chapter: 41-evaluation
questions:
  # ------------------------------------------------------------------ 1
  - id: ai300-qz-41-01
    objective: "4.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso adds the `builtin.coherence` and `builtin.fluency` evaluators to a cloud evaluation of stored chatbot responses in a Foundry project. The data mapping of both evaluators is complete.

        What else must the testing criteria of these two evaluators provide?
      fr: |
        Contoso ajoute les évaluateurs `builtin.coherence` et `builtin.fluency` à une évaluation cloud de réponses de chatbot stockées dans un projet Foundry. Le mappage des données des deux évaluateurs est complet.

        Que doivent fournir en plus les critères de test de ces deux évaluateurs ?
    body:
      options:
        - { id: a, text: { en: "The name of a chat model deployment that acts as the judge", fr: "Le nom d'un déploiement de modèle de conversation qui sert de juge" } }
        - { id: b, text: { en: "The connection of an Azure AI Content Safety resource", fr: "La connexion d'une ressource Azure AI Content Safety" } }
        - { id: c, text: { en: "A `ground_truth` value for each row of the dataset", fr: "Une valeur `ground_truth` pour chaque ligne du jeu de données" } }
        - { id: d, text: { en: "The connection string of an Application Insights resource", fr: "La chaîne de connexion d'une ressource Application Insights" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Coherence and fluency are AI-assisted evaluators: a model scores each response as an LLM judge, so each criterion needs a model deployment in its initialization parameters (`deployment_name`). Each evaluation call consumes tokens of that deployment, and Learn recommends `gpt-5-mini` for a balance of performance and cost.
        fr: |
          La cohérence et la fluidité sont des évaluateurs assistés par IA : un modèle note chaque réponse en tant que juge LLM, donc chaque critère a besoin d'un déploiement de modèle dans ses paramètres d'initialisation (`deployment_name`). Chaque appel d'évaluation consomme des jetons de ce déploiement, et Learn recommande `gpt-5-mini` pour l'équilibre entre performances et coût.
      options:
        b: { en: "Content Safety is used by the risk and safety evaluators and by Groundedness Pro, not by coherence and fluency, which rely on a judge model.", fr: "Content Safety est utilisé par les évaluateurs de risques et de sécurité et par Groundedness Pro, pas par la cohérence et la fluidité, qui s'appuient sur un modèle juge." }
        c: { en: "Coherence needs the query and the response, fluency only the response: neither compares the response with a ground truth.", fr: "La cohérence a besoin de la requête et de la réponse, la fluidité de la réponse seule : aucune ne compare la réponse à une vérité terrain." }
        d: { en: "Application Insights can receive evaluation results, but no evaluator needs it to compute a score.", fr: "Application Insights peut recevoir les résultats d'évaluation, mais aucun évaluateur n'en a besoin pour calculer un score." }
    references:
      - title: General purpose evaluators
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/general-purpose-evaluators

  # ------------------------------------------------------------------ 2
  - id: ai300-qz-41-02
    objective: "4.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam's chat assistant uses a model deployment whose guardrails (content filters) keep their default configuration. Before the release, the compliance team asks for a measurement: the percentage of responses that attack or demean people because of attributes such as their religion, origin or gender, measured on a set of 300 adversarial test queries.

        What should you do?
      fr: |
        L'assistant de conversation de Fabrikam utilise un déploiement de modèle dont les garde-fous (filtres de contenu) conservent leur configuration par défaut. Avant la mise en production, l'équipe de conformité demande une mesure : le pourcentage de réponses qui attaquent ou dénigrent des personnes en raison d'attributs comme leur religion, leur origine ou leur genre, mesuré sur un ensemble de 300 requêtes de test malveillantes.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run an evaluation with `builtin.hate_unfairness` on the test queries and report the share of failed rows.", fr: "Exécuter une évaluation avec `builtin.hate_unfairness` sur les requêtes de test et indiquer la part de lignes en échec." } }
        - { id: b, text: { en: "Export the content filter configuration of the deployment and report the severity level that it blocks.", fr: "Exporter la configuration des filtres de contenu du déploiement et indiquer le niveau de gravité qu'elle bloque." } }
        - { id: c, text: { en: "Run an evaluation with `builtin.groundedness` on the test queries and report the share of failed rows.", fr: "Exécuter une évaluation avec `builtin.groundedness` sur les requêtes de test et indiquer la part de lignes en échec." } }
        - { id: d, text: { en: "Run an evaluation with `builtin.ungrounded_attributes` on the test queries and report the share of flagged rows.", fr: "Exécuter une évaluation avec `builtin.ungrounded_attributes` sur les requêtes de test et indiquer la part de lignes signalées." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Guardrails block harmful content at run time, but they don't measure how often the application produces it. The `builtin.hate_unfairness` evaluator scores the severity of hateful and unfair content, such as attacks or demeaning language based on such attributes, in each response, and the share of rows that fail across the run is the measurement the compliance team asked for.
        fr: |
          Les garde-fous bloquent le contenu nuisible à l'exécution, mais ne mesurent pas la fréquence à laquelle l'application en produit. L'évaluateur `builtin.hate_unfairness` note la gravité du contenu haineux et injuste (attaques ou dénigrement fondés sur de tels attributs) de chaque réponse, et la part des lignes en échec sur l'exécution est la mesure demandée par l'équipe de conformité.
      options:
        b: { en: "The filter configuration says what is blocked at run time; it gives no figure about the responses that the application actually produces.", fr: "La configuration des filtres indique ce qui est bloqué à l'exécution ; elle ne donne aucun chiffre sur les réponses que l'application produit réellement." }
        c: { en: "Groundedness checks whether the claims of a response are supported by the context; it doesn't detect hateful or demeaning content.", fr: "L'ancrage vérifie si les affirmations d'une réponse sont étayées par le contexte ; il ne détecte pas le contenu haineux ou dénigrant." }
        d: { en: "Ungrounded attributes flags emotional states or protected-class attributes inferred about a person without support in the context; it doesn't score hateful or demeaning content.", fr: "Les attributs non ancrés signalent un état émotionnel ou un attribut de classe protégée déduit sur une personne sans appui dans le contexte ; ils ne notent pas le contenu haineux ou dénigrant." }
    references:
      - title: Risk and safety evaluators
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators

  # ------------------------------------------------------------------ 3
  - id: ai300-qz-41-03
    objective: "4.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware's QA team curated 250 test rows for a Foundry agent in a JSONL file. A CI pipeline runs a cloud evaluation of the agent for every release.

        The solution must meet the following requirements:

        - Every run must use exactly the rows that the QA team approved.
        - An auditor must be able to tell, from the Foundry project, which version of the rows each run used.

        What should you do?
      fr: |
        L'équipe d'assurance qualité de Proseware a préparé 250 lignes de test pour un agent Foundry dans un fichier JSONL. Un pipeline de CI exécute une évaluation cloud de l'agent à chaque mise en production.

        La solution doit répondre aux exigences suivantes :

        - Chaque exécution doit utiliser exactement les lignes approuvées par l'équipe d'assurance qualité.
        - Un auditeur doit pouvoir savoir, depuis le projet Foundry, quelle version des lignes chaque exécution a utilisée.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Register the file with `datasets.upload_file` and an explicit version, and reference it by its ID in each run.", fr: "Inscrire le fichier avec `datasets.upload_file` et une version explicite, puis le référencer par son ID dans chaque exécution." } }
        - { id: b, text: { en: "Pass the rows inline in a `file_content` source that the pipeline script builds from the JSONL file.", fr: "Passer les lignes en ligne dans une source `file_content` que le script du pipeline construit à partir du fichier JSONL." } }
        - { id: c, text: { en: "Generate a new Simple QnA synthetic dataset from the agent definition at the start of each run.", fr: "Générer un nouveau jeu de données synthétique Simple QnA à partir de la définition de l'agent au début de chaque exécution." } }
        - { id: d, text: { en: "Create a new dataset from the agent's traces of the last seven days at the start of each run.", fr: "Créer un nouveau jeu de données à partir des traces des sept derniers jours de l'agent au début de chaque exécution." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A dataset registered with `datasets.upload_file` gets a name and a version in the project and can be reused across runs through its file ID. Learn recommends this approach for production testing and CI/CD: each run uses the same approved rows, and the dataset version recorded with the run answers the auditor.
        fr: |
          Un jeu de données inscrit avec `datasets.upload_file` reçoit un nom et une version dans le projet et peut être réutilisé d'une exécution à l'autre par son ID de fichier. Learn recommande cette approche pour les tests de production et la CI/CD : chaque exécution utilise les mêmes lignes approuvées, et la version du jeu de données associée à l'exécution répond à l'auditeur.
      options:
        b: { en: "Inline `file_content` is meant for quick experiments with small datasets; the rows aren't registered as a versioned dataset in the project.", fr: "La source en ligne `file_content` est prévue pour des expériences rapides avec de petits jeux de données ; les lignes ne sont pas inscrites comme jeu de données versionné dans le projet." }
        c: { en: "A synthetic dataset generated for each run contains new rows that the QA team never approved.", fr: "Un jeu de données synthétique généré à chaque exécution contient de nouvelles lignes que l'équipe d'assurance qualité n'a jamais approuvées." }
        d: { en: "A dataset built from recent traces changes with production traffic, so the rows differ from one run to the next.", fr: "Un jeu de données construit à partir des traces récentes change avec le trafic de production : les lignes diffèrent d'une exécution à l'autre." }
    references:
      - title: Evaluate existing datasets with Microsoft Foundry SDK
        url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/cloud-evaluation-datasets

  # ------------------------------------------------------------------ 4
  - id: ai300-qz-41-04
    objective: "4.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys has a customer assistant that answers in French. You evaluate its stored responses with `builtin.fluency` and a `gpt-5-mini` judge deployment. The data mapping sends each stored response to the evaluator.

        French-speaking reviewers find that the fluency scores often disagree with their own ratings of the same responses.

        What is the most likely explanation?
      fr: |
        Wingtip Toys dispose d'un assistant client qui répond en français. Vous évaluez ses réponses stockées avec `builtin.fluency` et un déploiement juge `gpt-5-mini`. Le mappage des données envoie chaque réponse stockée à l'évaluateur.

        Des relecteurs francophones constatent que les scores de fluidité contredisent souvent leurs propres notes sur les mêmes réponses.

        Quelle est l'explication la plus probable ?
    body:
      options:
        - { id: a, text: { en: "The fluency evaluator currently supports English-language responses only.", fr: "L'évaluateur de fluidité ne prend actuellement en charge que les réponses en anglais." } }
        - { id: b, text: { en: "The fluency evaluator also needs the retrieved `context` of each response.", fr: "L'évaluateur de fluidité a aussi besoin du `context` récupéré de chaque réponse." } }
        - { id: c, text: { en: "The fluency evaluator compares each response with a `ground_truth` answer.", fr: "L'évaluateur de fluidité compare chaque réponse à une réponse `ground_truth`." } }
        - { id: d, text: { en: "The fluency evaluator requires a reasoning model as its judge deployment.", fr: "L'évaluateur de fluidité exige un modèle de raisonnement comme déploiement juge." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Coherence and fluency currently support English-language responses. Scores computed on French responses are therefore not reliable, which explains the disagreement with the reviewers; scores are also less reliable for very short responses.
        fr: |
          La cohérence et la fluidité prennent actuellement en charge les réponses en anglais. Les scores calculés sur des réponses en français ne sont donc pas fiables, ce qui explique le désaccord avec les relecteurs ; les scores sont aussi moins fiables pour les réponses très courtes.
      options:
        b: { en: "Fluency only needs the response (or the messages); context is an input of groundedness and retrieval.", fr: "La fluidité n'a besoin que de la réponse (ou des messages) ; le contexte est une entrée de l'ancrage et de la récupération." }
        c: { en: "Fluency judges grammar and readability on its own; ground truth is used by similarity, F1 and response completeness.", fr: "La fluidité juge la grammaire et la lisibilité seule ; la vérité terrain sert à la similarité, à F1 et à l'exhaustivité de la réponse." }
        d: { en: "The judge can be a reasoning or a non-reasoning model; `gpt-5-mini` is the recommended balance of performance and cost.", fr: "Le juge peut être un modèle de raisonnement ou non ; `gpt-5-mini` est l'équilibre recommandé entre performances et coût." }
    references:
      - title: General purpose evaluators
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/general-purpose-evaluators

  # ------------------------------------------------------------------ 5
  - id: ai300-qz-41-05
    objective: "4.1.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders has a Foundry agent that drafts customer emails and writes C# snippets for internal developers. The evaluation of the agent uses `builtin.ungrounded_attributes`, `builtin.code_vulnerability` and `builtin.protected_material`.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un agent Foundry qui rédige des e-mails aux clients et écrit des extraits de code C# pour les développeurs internes. L'évaluation de l'agent utilise `builtin.ungrounded_attributes`, `builtin.code_vulnerability` et `builtin.protected_material`.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: When `builtin.ungrounded_attributes` returns the label true for a row, the response infers an emotional state or a protected-class attribute of a person that the context doesn't support.
            fr: Quand `builtin.ungrounded_attributes` renvoie l'étiquette true pour une ligne, la réponse déduit sur une personne un état émotionnel ou un attribut de classe protégée que le contexte n'étaye pas.
        - id: s2
          text:
            en: "`builtin.code_vulnerability` can flag hard-coded credentials in a C# snippet that the agent generates."
            fr: "`builtin.code_vulnerability` peut signaler des informations d'identification codées en dur dans un extrait C# généré par l'agent."
        - id: s3
          text:
            en: "`builtin.protected_material` needs the `context` field in its data mapping to detect copyrighted text in a response."
            fr: "`builtin.protected_material` a besoin du champ `context` dans son mappage des données pour détecter du texte protégé par le droit d'auteur dans une réponse."
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Ungrounded attributes returns true only when an emotional state or a protected-class attribute is detected and isn't grounded in the context, so true flags a problem. Code vulnerability covers Python, Java, C++, C#, Go, JavaScript and SQL, and hard-coded credentials are one of its vulnerability classes. Protected material takes the query and the response (or messages) and classifies the text with the Azure AI Content Safety protected material service; it doesn't use a context.
        fr: |
          Les attributs non ancrés renvoient true uniquement quand un état émotionnel ou un attribut de classe protégée est détecté et n'est pas ancré dans le contexte : true signale donc un problème. La vulnérabilité du code couvre Python, Java, C++, C#, Go, JavaScript et SQL, et les informations d'identification codées en dur font partie de ses classes de vulnérabilités. Le matériel protégé prend la requête et la réponse (ou les messages) et classe le texte avec le service de matériel protégé d'Azure AI Content Safety ; il n'utilise pas de contexte.
      options:
        s3: { en: "Context is an input of ungrounded attributes, not of protected material.", fr: "Le contexte est une entrée des attributs non ancrés, pas du matériel protégé." }
    references:
      - title: Risk and safety evaluators
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators

  # ------------------------------------------------------------------ 6
  - id: ai300-qz-41-06
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Margie's Travel evaluates the stored responses of its RAG travel assistant with `builtin.groundedness`, mapped to `context` and `response`, and `builtin.relevance`, mapped to `query` and `response`. Both evaluators use their default threshold. A travel expert confirmed that every statement in the responses below is factually correct.

        Answer each prompt by selecting the row that matches it.

        NOTE: Each correct selection is worth one point.
      fr: |
        Margie's Travel évalue les réponses stockées de son assistant de voyage RAG avec `builtin.groundedness`, mappé à `context` et `response`, et `builtin.relevance`, mappé à `query` et `response`. Les deux évaluateurs utilisent leur seuil par défaut. Un expert du voyage a confirmé que chaque affirmation des réponses ci-dessous est exacte.

        Répondez à chaque consigne en sélectionnant la ligne qui y correspond.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The row most likely to pass Groundedness and fail Relevance", fr: "La ligne la plus susceptible de réussir l'ancrage et d'échouer à la pertinence" }
        - id: p2
          text: { en: "The row most likely to fail Groundedness and pass Relevance", fr: "La ligne la plus susceptible d'échouer à l'ancrage et de réussir la pertinence" }
      grid:
        header: [{ en: "Row", fr: "Ligne" }, query, context, response]
        rows:
          - [{ text: T-1, area: t1 }, { text: "What time does the Tokyo subway open?" }, { text: "Tokyo's subway runs from 5 AM to midnight." }, { text: "The Tokyo subway opens at 5 AM." }]
          - [{ text: T-2, area: t2 }, { text: "Do I need a visa for a two-week trip to Japan?" }, { text: "Japan has four main islands. Tokyo is on Honshu." }, { text: "Japan has four main islands, and Tokyo is on Honshu." }]
          - [{ text: T-3, area: t3 }, { text: "Which currency is used in Japan?" }, { text: "Tokyo's subway runs from 5 AM to midnight." }, { text: "Japan uses the yen." }]
          - [{ text: T-4, area: t4 }, { text: "What time does the Tokyo subway close?" }, { text: "Tokyo's subway runs from 5 AM to midnight." }, { text: "Kyoto has many temples." }]
    answer:
      values: { p1: t2, p2: t3 }
    explanation:
      correct:
        en: |
          Groundedness checks the response against the context, and relevance checks it against the query. T-2 copies the context, so it is fully grounded, but it says nothing about visas: low relevance. T-3 correctly answers the question from the model's general knowledge, so it is relevant, but the context doesn't contain the currency: low groundedness. T-1 passes both, and T-4 fails both.
        fr: |
          L'ancrage compare la réponse au contexte, et la pertinence la compare à la requête. T-2 recopie le contexte : elle est parfaitement ancrée, mais ne dit rien des visas, d'où une pertinence faible. T-3 répond correctement à la question à partir des connaissances générales du modèle : elle est pertinente, mais le contexte ne contient pas la devise, d'où un ancrage faible. T-1 réussit les deux, et T-4 échoue aux deux.
      options:
        t1: { en: "T-1 answers the query with a fact from the context: it passes both evaluators.", fr: "T-1 répond à la requête avec un fait du contexte : elle réussit les deux évaluateurs." }
        t4: { en: "T-4 neither answers the query nor relies on the context: it fails both evaluators.", fr: "T-4 ne répond pas à la requête et ne s'appuie pas sur le contexte : elle échoue aux deux évaluateurs." }
    references:
      - title: Retrieval-Augmented Generation (RAG) evaluators
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators

  # ------------------------------------------------------------------ 7
  - id: ai300-qz-41-07
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum has a Foundry project that contains a prompt agent named **hr-agent**. An Application Insights resource is connected to the project, and the project's managed identity has the Reader role on that resource.

        A test engineer runs a script that sends 40 conversations to version 6 of hr-agent. As soon as the script ends, the engineer starts a data generation job that creates a dataset from the traces of hr-agent for the last 15 minutes. The job is pinned to agent version 6, and `max_samples` is set to 10. The job succeeds, but the dataset contains no rows.

        What should the engineer do?
      fr: |
        Adatum dispose d'un projet Foundry qui contient un agent d'invite nommé **hr-agent**. Une ressource Application Insights est connectée au projet, et l'identité managée du projet a le rôle Reader sur cette ressource.

        Un ingénieur de test exécute un script qui envoie 40 conversations à la version 6 de hr-agent. Dès la fin du script, l'ingénieur lance un travail de génération de données qui crée un jeu de données à partir des traces de hr-agent des 15 dernières minutes. Le travail est figé sur la version 6 de l'agent, et `max_samples` vaut 10. Le travail réussit, mais le jeu de données ne contient aucune ligne.

        Que doit faire l'ingénieur ?
    body:
      options:
        - { id: a, text: { en: "Wait a few minutes after the traffic ends, and then start the job again.", fr: "Attendre quelques minutes après la fin du trafic, puis relancer le travail." } }
        - { id: b, text: { en: "Set `max_samples` to 15 or more, and then start the job again.", fr: "Définir `max_samples` sur 15 ou plus, puis relancer le travail." } }
        - { id: c, text: { en: "Remove the agent version from the job, and then start the job again.", fr: "Retirer la version de l'agent du travail, puis relancer le travail." } }
        - { id: d, text: { en: "Assign Log Analytics Reader to the engineer, and then start the job again.", fr: "Attribuer Log Analytics Reader à l'ingénieur, puis relancer le travail." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Application Insights needs 30 to 90 seconds to ingest the spans. A job started immediately after the traffic runs against a window that is still empty and produces no samples; starting it again once the traces are ingested fixes the problem.
        fr: |
          Application Insights a besoin de 30 à 90 secondes pour ingérer les étendues. Un travail lancé immédiatement après le trafic s'exécute sur une fenêtre encore vide et ne produit aucun échantillon ; le relancer une fois les traces ingérées règle le problème.
      options:
        b: { en: "From traces, `max_samples` accepts 1 to 1,000; the minimum of 15 applies to synthetic data generation.", fr: "À partir des traces, `max_samples` accepte de 1 à 1 000 ; le minimum de 15 s'applique à la génération de données synthétiques." }
        c: { en: "Pinning the version is the recommended practice, and version 6 produced the traffic: removing it would only mix spans of other versions.", fr: "Figer la version est la pratique recommandée, et c'est la version 6 qui a produit le trafic : la retirer ne ferait que mélanger les étendues d'autres versions." }
        d: { en: "The service queries the traces as the project's managed identity, which already has Reader; the engineer's own log access isn't used by the job.", fr: "Le service interroge les traces sous l'identité managée du projet, qui a déjà Reader ; l'accès aux journaux de l'ingénieur n'est pas utilisé par le travail." }
    references:
      - title: Convert agent traces into evaluation datasets
        url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/traces-to-dataset

  # ------------------------------------------------------------------ 8
  - id: ai300-qz-41-08
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank evaluates a chat assistant in a Foundry project on 500 adversarial test queries with `builtin.violence`, `builtin.sexual`, `builtin.self_harm` and `builtin.hate_unfairness`.

        The release policy states:

        - A response rated at the Medium or High severity level in a category is a defect in that category.
        - The release is blocked if more than 1 percent of the responses are defects in any category.

        You need to configure the evaluators and the release gate. What should you do?
      fr: |
        Woodgrove Bank évalue un assistant de conversation dans un projet Foundry sur 500 requêtes de test malveillantes avec `builtin.violence`, `builtin.sexual`, `builtin.self_harm` et `builtin.hate_unfairness`.

        La politique de mise en production indique :

        - Une réponse classée au niveau de gravité Medium ou High dans une catégorie est un défaut dans cette catégorie.
        - La mise en production est bloquée si plus de 1 % des réponses sont des défauts dans une catégorie, quelle qu'elle soit.

        Vous devez configurer les évaluateurs et le contrôle de mise en production. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep the default threshold of 3, and block the release if more than 1 percent of the rows fail any of the four evaluators.", fr: "Conserver le seuil par défaut de 3, et bloquer la mise en production si plus de 1 % des lignes échouent à l'un des quatre évaluateurs." } }
        - { id: b, text: { en: "Set the threshold to 4, and block the release if more than 1 percent of the rows fail any of the four evaluators.", fr: "Définir le seuil sur 4, et bloquer la mise en production si plus de 1 % des lignes échouent à l'un des quatre évaluateurs." } }
        - { id: c, text: { en: "Set the threshold to 1, and block the release if more than 1 percent of the rows fail any of the four evaluators.", fr: "Définir le seuil sur 1, et bloquer la mise en production si plus de 1 % des lignes échouent à l'un des quatre évaluateurs." } }
        - { id: d, text: { en: "Keep the default threshold of 3, and block the release if the average score of any of the four evaluators exceeds 3.", fr: "Conserver le seuil par défaut de 3, et bloquer la mise en production si le score moyen de l'un des quatre évaluateurs dépasse 3." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The content safety evaluators score severity from 0 to 7: Very low 0–1, Low 2–3, Medium 4–5, High 6–7. A row passes when its score is at or below the threshold, so the default threshold of 3 makes exactly the Medium and High responses fail. The gate must then look at the share of failed rows per evaluator, which is the policy's defect rate per category.
        fr: |
          Les évaluateurs de sécurité du contenu notent la gravité de 0 à 7 : Very low 0–1, Low 2–3, Medium 4–5, High 6–7. Une ligne réussit quand son score est inférieur ou égal au seuil : le seuil par défaut de 3 fait donc échouer exactement les réponses Medium et High. Le contrôle doit ensuite examiner la part des lignes en échec par évaluateur, qui correspond au taux de défauts par catégorie de la politique.
      options:
        b: { en: "With a threshold of 4, a Medium response scored 4 passes, although the policy counts it as a defect.", fr: "Avec un seuil de 4, une réponse Medium notée 4 réussit, alors que la politique la compte comme un défaut." }
        c: { en: "With a threshold of 1, Low responses (2 or 3) fail too, so the gate counts responses that the policy accepts.", fr: "Avec un seuil de 1, les réponses Low (2 ou 3) échouent aussi : le contrôle compte des réponses que la politique accepte." }
        d: { en: "An average dominated by harmless responses stays far below 3 even when well over 1 percent of the rows are Medium or High.", fr: "Une moyenne dominée par des réponses inoffensives reste bien en dessous de 3 même quand bien plus de 1 % des lignes sont Medium ou High." }
    references:
      - title: Risk and safety evaluators
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators

  # ------------------------------------------------------------------ 9
  - id: ai300-qz-41-09
    objective: "4.1.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys exported 800 interactions of its RAG assistant to a JSONL file. Each row contains `query`, `context` and `response` fields. You upload the file as a dataset whose ID is stored in `data_id`, and then you run the code shown in the exhibit. The project contains a chat model deployment named **judge-mini**.

        Which two statements about the evaluation run are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys a exporté 800 interactions de son assistant RAG dans un fichier JSONL. Chaque ligne contient les champs `query`, `context` et `response`. Vous chargez le fichier en tant que jeu de données dont l'ID est stocké dans `data_id`, puis vous exécutez le code présenté dans la pièce. Le projet contient un déploiement de modèle de conversation nommé **judge-mini**.

        Quelles sont les deux affirmations vraies sur l'exécution de l'évaluation ?

        Remarque : chaque sélection correcte vaut un point.
    exhibits:
      - id: code
        title: { en: "Evaluation and run", fr: "Évaluation et exécution" }
        body: |
          ```python
          eval_object = openai_client.evals.create(
              name="assistant-quality",
              data_source_config={
                  "type": "custom",
                  "item_schema": {
                      "type": "object",
                      "properties": {
                          "query": {"type": "string"},
                          "context": {"type": "string"},
                          "response": {"type": "string"},
                      },
                      "required": ["query", "context", "response"],
                  },
              },
              testing_criteria=[
                  {
                      "type": "azure_ai_evaluator",
                      "name": "groundedness",
                      "evaluator_name": "builtin.groundedness",
                      "initialization_parameters": {"deployment_name": "judge-mini"},
                      "data_mapping": {"context": "{{item.context}}", "response": "{{item.response}}"},
                  },
                  {
                      "type": "azure_ai_evaluator",
                      "name": "violence",
                      "evaluator_name": "builtin.violence",
                      "data_mapping": {"query": "{{item.query}}", "response": "{{item.response}}"},
                  },
              ],
          )

          run = openai_client.evals.runs.create(
              eval_id=eval_object.id,
              name="export-october",
              data_source={"type": "jsonl", "source": {"type": "file_id", "id": data_id}},
          )
          ```
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The run scores the stored responses and calls no model or agent to generate new responses.", fr: "L'exécution note les réponses stockées et n'appelle aucun modèle ni agent pour générer de nouvelles réponses." } }
        - { id: b, text: { en: "The violence criterion fails, because its initialization parameters don't name a judge deployment.", fr: "Le critère violence échoue, car ses paramètres d'initialisation ne nomment aucun déploiement juge." } }
        - { id: c, text: { en: "Of the two criteria, only the groundedness criterion consumes tokens of the judge-mini deployment.", fr: "Des deux critères, seul le critère groundedness consomme des jetons du déploiement judge-mini." } }
        - { id: d, text: { en: "Mapping `response` to `{{sample.output_text}}` in both criteria would score the same responses.", fr: "Mapper `response` à `{{sample.output_text}}` dans les deux critères noterait les mêmes réponses." } }
        - { id: e, text: { en: "The groundedness criterion needs a `ground_truth` field in each row to compute its score.", fr: "Le critère groundedness a besoin d'un champ `ground_truth` dans chaque ligne pour calculer son score." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          A data source of type `jsonl` with a `file_id` evaluates rows that already contain the responses: the run executes each evaluator on every row and calls no target. Groundedness is AI-assisted and uses the judge-mini deployment named in its initialization parameters, while violence runs on the hosted Foundry evaluation service and needs no deployment.
        fr: |
          Une source de données de type `jsonl` avec un `file_id` évalue des lignes qui contiennent déjà les réponses : l'exécution applique chaque évaluateur à chaque ligne sans appeler de cible. L'ancrage est assisté par IA et utilise le déploiement judge-mini nommé dans ses paramètres d'initialisation, tandis que la violence s'exécute sur le service d'évaluation hébergé de Foundry et n'a besoin d'aucun déploiement.
      options:
        b: { en: "Risk and safety evaluators use the hosted Foundry evaluation service and don't require a `deployment_name`.", fr: "Les évaluateurs de risques et de sécurité utilisent le service d'évaluation hébergé de Foundry et n'exigent pas de `deployment_name`." }
        d: { en: "Sample fields exist only when a target generates responses during the run and the configuration includes the sample schema; this run has neither.", fr: "Les champs sample n'existent que lorsqu'une cible génère des réponses pendant l'exécution et que la configuration inclut le schéma sample ; cette exécution n'a ni l'un ni l'autre." }
        e: { en: "Groundedness compares the response with the context; it doesn't use a ground truth.", fr: "L'ancrage compare la réponse au contexte ; il n'utilise pas de vérité terrain." }
    references:
      - title: Evaluate existing datasets with Microsoft Foundry SDK
        url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/cloud-evaluation-datasets
      - title: Risk and safety evaluators
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators

  # ------------------------------------------------------------------ 10
  - id: ai300-qz-41-10
    objective: "4.1.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso has a prompt agent named **support-agent** in a Foundry project. A dataset whose ID is stored in `data_id` contains rows with two fields: `question`, the user input, and `policy`, the policy excerpt that the answer must rely on. The project contains a chat model deployment named **judge-mini**.

        You need a cloud evaluation run that sends each question to version 5 of support-agent and checks that each generated answer is supported by the policy excerpt of its row.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un agent d'invite nommé **support-agent** dans un projet Foundry. Un jeu de données dont l'ID est stocké dans `data_id` contient des lignes à deux champs : `question`, l'entrée de l'utilisateur, et `policy`, l'extrait de politique sur lequel la réponse doit s'appuyer. Le projet contient un déploiement de modèle de conversation nommé **judge-mini**.

        Vous avez besoin d'une exécution d'évaluation cloud qui envoie chaque question à la version 5 de support-agent et vérifie que chaque réponse générée est étayée par l'extrait de politique de sa ligne.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        eval_object = openai_client.evals.create(
            name="policy-grounding",
            data_source_config={
                "type": "custom",
                "item_schema": {
                    "type": "object",
                    "properties": {"question": {"type": "string"}, "policy": {"type": "string"}},
                    "required": ["question", "policy"],
                },
                "include_sample_schema": True,
            },
            testing_criteria=[
                {
                    "type": "azure_ai_evaluator",
                    "name": "groundedness",
                    "evaluator_name": "builtin.groundedness",
                    "initialization_parameters": {"deployment_name": "judge-mini"},
                    "data_mapping": {"context": [[ctx]], "response": "{{sample.output_text}}"},
                },
            ],
        )

        run = openai_client.evals.runs.create(
            eval_id=eval_object.id,
            name="support-agent-v5",
            data_source={
                "type": [[ds]],
                "source": {"type": "file_id", "id": data_id},
                "input_messages": {
                    "type": "template",
                    "template": [
                        {"type": "message", "role": "user",
                         "content": {"type": "input_text", "text": [[msg]]}}
                    ],
                },
                "target": {"type": [[tt]], "name": "support-agent", "version": "5"},
            },
        )
      slots:
        - id: ctx
          options:
            - { id: pol, text: "\"{{item.policy}}\"" }
            - { id: ictx, text: "\"{{item.context}}\"" }
            - { id: items, text: "\"{{sample.output_items}}\"" }
            - { id: q, text: "\"{{item.question}}\"" }
        - id: ds
          options:
            - { id: target, text: "\"azure_ai_target_completions\"" }
            - { id: jsonl, text: "\"jsonl\"" }
            - { id: resp, text: "\"azure_ai_responses\"" }
        - id: msg
          options:
            - { id: iq, text: "\"{{item.question}}\"" }
            - { id: iquery, text: "\"{{item.query}}\"" }
            - { id: out, text: "\"{{sample.output_text}}\"" }
        - id: tt
          options:
            - { id: agent, text: "\"azure_ai_agent\"" }
            - { id: model, text: "\"azure_ai_model\"" }
    answer:
      values: { ctx: pol, ds: target, msg: iq, tt: agent }
    explanation:
      correct:
        en: |
          Groundedness takes `context` and `response`, and `{{item.<field>}}` must use the dataset's own field name, here `policy`. The `azure_ai_target_completions` data source generates the responses during the run from `input_messages`, whose user message must reference the `question` field of each row. An agent is targeted with the type `azure_ai_agent` and its name and version; `azure_ai_model` targets a model deployment.
        fr: |
          L'ancrage prend `context` et `response`, et `{{item.<champ>}}` doit utiliser le nom de champ du jeu de données, ici `policy`. La source de données `azure_ai_target_completions` génère les réponses pendant l'exécution à partir de `input_messages`, dont le message utilisateur doit référencer le champ `question` de chaque ligne. Un agent se cible avec le type `azure_ai_agent`, son nom et sa version ; `azure_ai_model` cible un déploiement de modèle.
      options:
        ictx: { en: "The rows have no `context` field: the mapping must name the field that the dataset actually uses.", fr: "Les lignes n'ont pas de champ `context` : le mappage doit nommer le champ réellement utilisé par le jeu de données." }
        items: { en: "`output_items` is the agent's structured output with its tool calls, not the policy excerpt.", fr: "`output_items` est la sortie structurée de l'agent avec ses appels d'outils, pas l'extrait de politique." }
        jsonl: { en: "A `jsonl` data source scores stored rows and calls no target, so no answer would be generated.", fr: "Une source de données `jsonl` note des lignes stockées sans appeler de cible : aucune réponse ne serait générée." }
        iquery: { en: "The rows have no `query` field; the user input is stored in `question`.", fr: "Les lignes n'ont pas de champ `query` ; l'entrée de l'utilisateur est stockée dans `question`." }
        out: { en: "`{{sample.output_text}}` is the answer generated by the target, so it can't be the input sent to it.", fr: "`{{sample.output_text}}` est la réponse générée par la cible : elle ne peut pas être l'entrée qui lui est envoyée." }
    references:
      - title: Evaluate model and agent targets with Microsoft Foundry SDK
        url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/cloud-evaluation-targets
      - title: Evaluation dataset schema in Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/evaluation-dataset-schema
