chapter: 12-workspace-assets
questions:
  # ------------------------------------------------------------------ 1
  - id: ai300-qz-12-01
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders keeps its customer history as CSV files in a datastore of the Azure Machine Learning workspace **mlw-northwind**. You plan to train a classification model on this tabular data with an AutoML job submitted with the Azure CLI (v2).

        Which data asset type should you register for the training data?
      fr: |
        Northwind Traders conserve l'historique de ses clients dans des fichiers CSV d'un magasin de données de l'espace de travail Azure Machine Learning **mlw-northwind**. Vous prévoyez d'entraîner un modèle de classification sur ces données tabulaires avec un travail AutoML soumis avec Azure CLI (v2).

        Quel type de ressource de données devez-vous inscrire pour les données d'entraînement ?
    body:
      options:
        - { id: a, text: "`uri_file`" }
        - { id: b, text: "`mltable`" }
        - { id: c, text: "`uri_folder`" }
        - { id: d, text: "`mlflow_model`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          AutoML v2 takes its tabular training data as an MLTable data asset: a folder with an `MLTable` file that defines how to load the CSV files. "AutoML with tables" is one of the documented scenarios of the `mltable` type.
        fr: |
          AutoML v2 reçoit ses données d'entraînement tabulaires sous forme de ressource de données MLTable : un dossier avec un fichier `MLTable` qui définit comment charger les fichiers CSV. « AutoML avec des tables » fait partie des scénarios documentés du type `mltable`.
      options:
        a: { en: "`uri_file` points to one file without a table definition; AutoML v2 expects an MLTable input.", fr: "`uri_file` pointe vers un seul fichier sans définition de table ; AutoML v2 attend une entrée MLTable." }
        c: { en: "`uri_folder` points to a folder that your own code reads; it doesn't give AutoML a table definition.", fr: "`uri_folder` pointe vers un dossier que votre propre code lit ; il ne fournit pas de définition de table à AutoML." }
        d: { en: "`mlflow_model` is a model type, used for model inputs and outputs, not for training data.", fr: "`mlflow_model` est un type de modèle, utilisé pour les entrées et sorties de modèles, pas pour des données d'entraînement." }
    references:
      - title: Set up AutoML with Python (v2) - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-auto-train
      - title: Create Data Assets - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-data-assets

  # ------------------------------------------------------------------ 2
  - id: ai300-qz-12-02
    objective: "1.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        In the Azure Machine Learning workspace **mlw-contoso**, a data scientist submits a command job whose YAML file describes the environment directly in the job: an `image` and a `conda_file`, but no `name` or `version`. The job succeeds.

        She then runs `az ml environment list` and doesn't find this environment. What explains this result?
      fr: |
        Dans l'espace de travail Azure Machine Learning **mlw-contoso**, une data scientist soumet un travail de commande dont le fichier YAML décrit l'environnement directement dans le travail : une `image` et un `conda_file`, mais ni `name` ni `version`. Le travail réussit.

        Elle exécute ensuite `az ml environment list` et ne trouve pas cet environnement. Qu'est-ce qui explique ce résultat ?
    body:
      options:
        - { id: a, text: { en: "The environment was archived automatically when the job completed.", fr: "L'environnement a été archivé automatiquement à la fin du travail." } }
        - { id: b, text: { en: "The environment is listed only in the `azureml` system registry.", fr: "L'environnement n'est listé que dans le registre système `azureml`." } }
        - { id: c, text: { en: "The environment is anonymous, so Azure Machine Learning doesn't track it as an asset.", fr: "L'environnement est anonyme : Azure Machine Learning ne le suit pas comme actif." } }
        - { id: d, text: { en: "The environment is listed only after its image is pushed to a registry.", fr: "L'environnement n'est listé qu'après l'envoi de son image dans un registre." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          An environment defined inline in a job, without `name` and `version`, is an unregistered (anonymous) environment: Azure Machine Learning builds and uses it, but doesn't track it in the environment assets of the workspace. To reuse and list it, register it with a name and a version.
        fr: |
          Un environnement défini en ligne dans un travail, sans `name` ni `version`, est un environnement non inscrit (anonyme) : Azure Machine Learning le construit et l'utilise, mais ne le suit pas dans les actifs d'environnement de l'espace de travail. Pour le réutiliser et le lister, inscrivez-le avec un nom et une version.
      options:
        a: { en: "Environments are never archived automatically; you archive them yourself, and they then stay listable with the right option.", fr: "Les environnements ne sont jamais archivés automatiquement ; c'est vous qui les archivez, et ils restent alors listables avec la bonne option." }
        b: { en: "The `azureml` system registry holds Microsoft's curated environments, not the environments of your jobs.", fr: "Le registre système `azureml` contient les environnements organisés de Microsoft, pas les environnements de vos travaux." }
        d: { en: "Registered environments are listed as soon as they're created, whatever the state of their image; this one was never registered.", fr: "Les environnements inscrits sont listés dès leur création, quel que soit l'état de leur image ; celui-ci n'a jamais été inscrit." }
    references:
      - title: Manage Azure Machine Learning environments with the CLI & SDK (v2) - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-environments-v2

  # ------------------------------------------------------------------ 3
  - id: ai300-qz-12-03
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A nightly pipeline in the Azure Machine Learning workspace **mlw-woodgrove** starts with a step that uses the command component **fetch_rates**. The step downloads exchange rates from a public URL that is passed as a string input, and the URL never changes.

        Since the second night, the fetch_rates step is shown as reused, finishes in seconds and passes yesterday's rates to the next steps. You need the step to download fresh rates every night.

        What should you do?
      fr: |
        Un pipeline nocturne de l'espace de travail Azure Machine Learning **mlw-woodgrove** commence par une étape qui utilise le composant de commande **fetch_rates**. L'étape télécharge des taux de change depuis une URL publique passée en entrée de type chaîne, et l'URL ne change jamais.

        Depuis la deuxième nuit, l'étape fetch_rates apparaît comme réutilisée, se termine en quelques secondes et transmet les taux de la veille aux étapes suivantes. Vous devez faire en sorte que l'étape télécharge des taux à jour chaque nuit.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Archive the earlier versions of fetch_rates so that the pipeline can't reuse their results.", fr: "Archiver les versions précédentes de fetch_rates afin que le pipeline ne puisse plus réutiliser leurs résultats." } }
        - { id: b, text: { en: "Add a `name` to the step output so that each run registers a new data asset version.", fr: "Ajouter un `name` à la sortie de l'étape afin que chaque exécution inscrive une nouvelle version de ressource de données." } }
        - { id: c, text: { en: "Set the mode of the step output to `upload` instead of `rw_mount` in the pipeline.", fr: "Définir le mode de la sortie de l'étape sur `upload` au lieu de `rw_mount` dans le pipeline." } }
        - { id: d, text: { en: "Set `is_deterministic: false` in fetch_rates, register the new version, and use it.", fr: "Définir `is_deterministic: false` dans fetch_rates, inscrire la nouvelle version, et l'utiliser." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `is_deterministic` defaults to `true`: when a step's inputs haven't changed, the pipeline reuses the previous output instead of running the step again. A component that loads data from an external source such as a URL must set `is_deterministic: false`, because the data behind an unchanged input can change.
        fr: |
          `is_deterministic` vaut `true` par défaut : quand les entrées d'une étape n'ont pas changé, le pipeline réutilise la sortie précédente au lieu de réexécuter l'étape. Un composant qui charge des données depuis une source externe comme une URL doit définir `is_deterministic: false`, car les données derrière une entrée inchangée peuvent changer.
      options:
        a: { en: "Archiving hides versions from the lists; it doesn't change the reuse behavior of the version the pipeline runs.", fr: "L'archivage masque des versions dans les listes ; il ne change pas le comportement de réutilisation de la version qu'exécute le pipeline." }
        b: { en: "Naming the output registers it as a data asset, but the step is still reused when its inputs are unchanged.", fr: "Nommer la sortie l'inscrit comme ressource de données, mais l'étape est toujours réutilisée quand ses entrées n'ont pas changé." }
        c: { en: "The output mode decides how files are written to storage, not whether the step runs.", fr: "Le mode de sortie décide de la façon dont les fichiers sont écrits dans le stockage, pas de l'exécution de l'étape." }
    references:
      - title: CLI (v2) command component YAML schema - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-component-command

  # ------------------------------------------------------------------ 4
  - id: ai300-qz-12-04
    objective: "1.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip publishes approved models in an Azure Machine Learning registry named **wingtip_registry**. The deployment engineers of the production workspace **mlw-wingtip-prod** must browse the registry models and deploy them to endpoints of mlw-wingtip-prod.

        The engineers must not create, update or delete anything in wingtip_registry. The solution must use a built-in role and follow the principle of least privilege.

        Which role should you assign to the engineers on wingtip_registry?
      fr: |
        Wingtip publie les modèles approuvés dans un registre Azure Machine Learning nommé **wingtip_registry**. Les ingénieurs de déploiement de l'espace de travail de production **mlw-wingtip-prod** doivent parcourir les modèles du registre et les déployer sur des points de terminaison de mlw-wingtip-prod.

        Les ingénieurs ne doivent rien créer, modifier ni supprimer dans wingtip_registry. La solution doit utiliser un rôle intégré et respecter le principe du moindre privilège.

        Quel rôle devez-vous attribuer aux ingénieurs sur wingtip_registry ?
    body:
      options:
        - { id: a, text: AzureML Registry User }
        - { id: b, text: AzureML Data Scientist }
        - { id: c, text: Reader }
        - { id: d, text: Contributor }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Using registry assets from a workspace needs only `registries/read` and `registries/assets/read`, which the built-in Reader role provides on the registry. The engineers deploy into mlw-wingtip-prod with their workspace permissions, so they need no write access to the registry.
        fr: |
          Utiliser les actifs d'un registre depuis un espace de travail ne demande que `registries/read` et `registries/assets/read`, que le rôle intégré Reader fournit sur le registre. Les ingénieurs déploient dans mlw-wingtip-prod avec leurs autorisations sur l'espace de travail : ils n'ont besoin d'aucun accès en écriture au registre.
      options:
        a: { en: "AzureML Registry User also lets its holders write and delete registry assets, which the engineers must not do.", fr: "AzureML Registry User permet aussi d'écrire et de supprimer des actifs du registre, ce que les ingénieurs ne doivent pas faire." }
        b: { en: "AzureML Data Scientist is a workspace role; it grants nothing on a registry.", fr: "AzureML Data Scientist est un rôle d'espace de travail ; il n'accorde rien sur un registre." }
        d: { en: "Contributor allows creating, updating and deleting assets and even the registry itself.", fr: "Contributor permet de créer, modifier et supprimer des actifs, et même le registre lui-même." }
    references:
      - title: Create and manage registries - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-registries

  # ------------------------------------------------------------------ 5
  - id: ai300-qz-12-05
    objective: "1.2.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        In the Azure Machine Learning workspace **mlw-adatum**, you register two `uri_folder` data assets:

        - **sales-2026**, whose path is `azureml://datastores/lake_curated/paths/sales/2026/`;
        - **local-sample**, whose path is the folder `./sample` on your computer.

        Next month, you plan to register version 2 of local-sample.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Dans l'espace de travail Azure Machine Learning **mlw-adatum**, vous inscrivez deux ressources de données `uri_folder` :

        - **sales-2026**, dont le chemin est `azureml://datastores/lake_curated/paths/sales/2026/` ;
        - **local-sample**, dont le chemin est le dossier `./sample` de votre ordinateur.

        Le mois prochain, vous prévoyez d'inscrire la version 2 de local-sample.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: |
              Registering sales-2026 copies its files to the default datastore of mlw-adatum.
            fr: |
              L'inscription de sales-2026 copie ses fichiers dans le magasin de données par défaut de mlw-adatum.
        - id: s2
          text:
            en: |
              Registering local-sample uploads the files of ./sample to the default datastore of mlw-adatum.
            fr: |
              L'inscription de local-sample charge les fichiers de ./sample dans le magasin de données par défaut de mlw-adatum.
        - id: s3
          text:
            en: |
              After you register version 2 of local-sample, you can delete version 1.
            fr: |
              Après avoir inscrit la version 2 de local-sample, vous pouvez supprimer la version 1.
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A data asset is a reference: when its path is already in cloud storage, such as a datastore path, the data stays where it is. When the path is local, the files are uploaded automatically to the default datastore of the workspace. Data asset versions are immutable and can't be deleted; you archive a version you no longer want to see.
        fr: |
          Une ressource de données est une référence : quand son chemin est déjà dans un stockage cloud, par exemple un chemin de magasin de données, les données restent où elles sont. Quand le chemin est local, les fichiers sont chargés automatiquement dans le magasin de données par défaut de l'espace de travail. Les versions de ressources de données sont immuables et ne peuvent pas être supprimées ; vous archivez une version que vous ne voulez plus voir.
    references:
      - title: Create Data Assets - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-data-assets

  # ------------------------------------------------------------------ 6
  - id: ai300-qz-12-06
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        The Azure Machine Learning workspace **mlw-adatum** contains a compute cluster named **gpu-cluster** and a compute instance named **ci-dev**. You are writing a pipeline job that must meet the following requirements:

        - every step runs on serverless compute unless the step sets its own compute;
        - the `score` step runs on gpu-cluster;
        - the `scored` output of the `score` step is returned as the pipeline output **scored_output**.

        How should you complete the pipeline YAML? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'espace de travail Azure Machine Learning **mlw-adatum** contient un cluster de calcul nommé **gpu-cluster** et une instance de calcul nommée **ci-dev**. Vous écrivez un travail de pipeline qui doit répondre aux exigences suivantes :

        - chaque étape s'exécute sur du calcul serverless, sauf si l'étape définit son propre calcul ;
        - l'étape `score` s'exécute sur gpu-cluster ;
        - la sortie `scored` de l'étape `score` est renvoyée comme sortie du pipeline **scored_output**.

        Comment devez-vous compléter le YAML du pipeline ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: yaml
      template: |
        $schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
        type: pipeline
        settings:
          default_compute: [[dc]]
        inputs:
          raw_data:
            type: uri_folder
            path: azureml:sales-transactions:3
        outputs:
          scored_output:
            type: uri_folder
        jobs:
          prep:
            type: command
            component: ./prep.yml
            inputs:
              raw: ${{parent.inputs.raw_data}}
          score:
            type: command
            component: azureml:score_customers@latest
            [[key]]: azureml:gpu-cluster
            inputs:
              features: ${{parent.jobs.prep.outputs.features}}
            outputs:
              scored: [[out]]
      slots:
        - id: dc
          options:
            - { id: gpu, text: "azureml:gpu-cluster" }
            - { id: serverless, text: "azureml:serverless" }
            - { id: ci, text: "azureml:ci-dev" }
        - id: key
          options:
            - { id: default, text: default_compute }
            - { id: resources, text: resources }
            - { id: compute, text: compute }
        - id: out
          options:
            - { id: self, text: "${{outputs.scored_output}}" }
            - { id: step, text: "${{parent.jobs.score.outputs.scored}}" }
            - { id: parent, text: "${{parent.outputs.scored_output}}" }
            - { id: input, text: "${{parent.inputs.scored_output}}" }
    answer:
      values: { dc: serverless, key: compute, out: parent }
    explanation:
      correct:
        en: |
          `settings.default_compute` applies to every step that doesn't set its own compute, and `azureml:serverless` selects serverless compute. A step overrides it with its own `compute` key. To return a step output as a pipeline output, bind it with `${{parent.outputs.<name>}}`.
        fr: |
          `settings.default_compute` s'applique à chaque étape qui ne définit pas son propre calcul, et `azureml:serverless` sélectionne le calcul serverless. Une étape le remplace par sa propre clé `compute`. Pour renvoyer la sortie d'une étape comme sortie du pipeline, liez-la avec `${{parent.outputs.<name>}}`.
      options:
        gpu: { en: "Using gpu-cluster as the default would run the prep step on the GPU cluster instead of serverless compute.", fr: "Utiliser gpu-cluster par défaut exécuterait l'étape prep sur le cluster GPU au lieu du calcul serverless." }
        ci: { en: "ci-dev is a personal compute instance, and the requirement is serverless compute by default.", fr: "ci-dev est une instance de calcul personnelle, et l'exigence est le calcul serverless par défaut." }
        default: { en: "`default_compute` is a pipeline-level setting; a step selects its target with `compute`.", fr: "`default_compute` est un paramètre du pipeline ; une étape choisit sa cible avec `compute`." }
        resources: { en: "`resources` sets the instance type and count of serverless compute; it doesn't take a compute target name.", fr: "`resources` définit le type et le nombre d'instances du calcul serverless ; il ne prend pas de nom de cible de calcul." }
        self: { en: "`${{outputs.x}}` is used inside a component command, not to bind a step output in a pipeline.", fr: "`${{outputs.x}}` s'utilise dans la commande d'un composant, pas pour lier la sortie d'une étape dans un pipeline." }
        step: { en: "`${{parent.jobs.score.outputs.scored}}` reads the step's own output: it's for the input of another step.", fr: "`${{parent.jobs.score.outputs.scored}}` lit la propre sortie de l'étape : c'est pour l'entrée d'une autre étape." }
        input: { en: "`parent.inputs` binds pipeline inputs; scored_output is declared under the pipeline `outputs`.", fr: "`parent.inputs` lie des entrées du pipeline ; scored_output est déclarée sous les `outputs` du pipeline." }
    references:
      - title: Create and run component-based ML pipelines (CLI) - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-component-pipelines-cli
      - title: CLI (v2) pipeline job YAML schema - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-job-pipeline

  # ------------------------------------------------------------------ 7
  - id: ai300-qz-12-07
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an `mltable` data asset named **telemetry-table**. Its MLTable file is stored in a folder of the datastore **tables**, and it lists 2 TB of Parquet files located in a container of another storage account.

        A command job receives telemetry-table as an input. The training script doesn't use the `mltable` library: it walks a local folder and opens the Parquet files that the MLTable file lists. The files must not be copied to the disk of the compute.

        Which mode should you set for the input?
      fr: |
        Fabrikam dispose d'une ressource de données `mltable` nommée **telemetry-table**. Son fichier MLTable est stocké dans un dossier du magasin de données **tables**, et il liste 2 To de fichiers Parquet situés dans un conteneur d'un autre compte de stockage.

        Un travail de commande reçoit telemetry-table en entrée. Le script d'entraînement n'utilise pas la bibliothèque `mltable` : il parcourt un dossier local et ouvre les fichiers Parquet que liste le fichier MLTable. Les fichiers ne doivent pas être copiés sur le disque du calcul.

        Quel mode devez-vous définir pour l'entrée ?
    body:
      options:
        - { id: a, text: "`ro_mount`" }
        - { id: b, text: "`eval_mount`" }
        - { id: c, text: "`eval_download`" }
        - { id: d, text: "`direct`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The files an MLTable file yields can sit in another storage account than the MLTable file itself, and that view exists only once the data runtime evaluates the MLTable file. `eval_mount`, available only for `mltable` inputs, evaluates the file and then mounts the paths it lists, so the script sees the Parquet files without copying them.
        fr: |
          Les fichiers que produit un fichier MLTable peuvent se trouver dans un autre compte de stockage que le fichier MLTable lui-même, et cette vue n'existe qu'une fois que le runtime de données a évalué le fichier MLTable. `eval_mount`, disponible uniquement pour les entrées `mltable`, évalue le fichier puis monte les chemins qu'il liste : le script voit les fichiers Parquet sans les copier.
      options:
        a: { en: "`ro_mount` mounts the storage location of the input, the folder that holds the MLTable file, not the Parquet files of the other account.", fr: "`ro_mount` monte l'emplacement de stockage de l'entrée, le dossier qui contient le fichier MLTable, pas les fichiers Parquet de l'autre compte." }
        c: { en: "`eval_download` evaluates the MLTable file but copies the listed files to the compute disk, which is forbidden.", fr: "`eval_download` évalue le fichier MLTable mais copie les fichiers listés sur le disque du calcul, ce qui est interdit." }
        d: { en: "`direct` passes the URI as a string; the script would have to read the storage itself instead of a local folder.", fr: "`direct` passe l'URI sous forme de chaîne ; le script devrait lire lui-même le stockage au lieu d'un dossier local." }
    references:
      - title: Access data in a job - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-read-write-data-v2

  # ------------------------------------------------------------------ 8
  - id: ai300-qz-12-08
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware's platform team maintains the base image **crlitware.azurecr.io/ml/base:2.1**. Its Python packages, including the internal package `litware-features`, were installed with pip when the image was built; `litware-features` isn't published to any package feed.

        A new training job in the Azure Machine Learning workspace **mlw-litware** needs every package of the base image plus `xgboost`. The environment image must be built when the environment is registered, and the job must not install packages at run time.

        What should you do?
      fr: |
        L'équipe plateforme de Litware maintient l'image de base **crlitware.azurecr.io/ml/base:2.1**. Ses packages Python, dont le package interne `litware-features`, ont été installés avec pip lors de la construction de l'image ; `litware-features` n'est publié dans aucun flux de packages.

        Un nouveau travail d'entraînement de l'espace de travail Azure Machine Learning **mlw-litware** a besoin de tous les packages de l'image de base, plus `xgboost`. L'image de l'environnement doit être construite à l'inscription de l'environnement, et le travail ne doit pas installer de packages à l'exécution.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Register an environment with `image` set to the base image and a `conda_file` that lists `xgboost`.", fr: "Inscrire un environnement avec `image` défini sur l'image de base et un `conda_file` qui liste `xgboost`." } }
        - { id: b, text: { en: "Register an environment from a build context whose Dockerfile starts from the base image and installs `xgboost`.", fr: "Inscrire un environnement à partir d'un contexte de build dont le Dockerfile part de l'image de base et installe `xgboost`." } }
        - { id: c, text: { en: "Register an environment with only `image` set to the base image, and install `xgboost` at the start of the script.", fr: "Inscrire un environnement avec seulement `image` défini sur l'image de base, et installer `xgboost` au début du script." } }
        - { id: d, text: { en: "Run `az ml environment update` on the existing base environment to add `xgboost` to its definition.", fr: "Exécuter `az ml environment update` sur l'environnement de base existant pour ajouter `xgboost` à sa définition." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A Docker build context keeps everything the base image contains and adds `xgboost` in the same image, and Azure Machine Learning builds it as soon as the environment is created. With a conda file, Azure Machine Learning would instead create a conda environment on top of the image, where the pip packages of the base image aren't available.
        fr: |
          Un contexte de build Docker garde tout ce que contient l'image de base et ajoute `xgboost` dans la même image, et Azure Machine Learning le construit dès la création de l'environnement. Avec un fichier conda, Azure Machine Learning créerait au contraire un environnement conda au-dessus de l'image, où les packages pip de l'image de base ne sont pas disponibles.
      options:
        a: { en: "The job would run in a new conda environment without `litware-features`, and the image would be built only at first use.", fr: "Le travail s'exécuterait dans un nouvel environnement conda sans `litware-features`, et l'image ne serait construite qu'à la première utilisation." }
        c: { en: "Installing `xgboost` when the script starts is an installation at run time, which the requirements forbid.", fr: "Installer `xgboost` au démarrage du script est une installation à l'exécution, ce que les exigences interdisent." }
        d: { en: "Only `description` and `tags` of an environment version can be updated; a package change requires a new version.", fr: "Seuls `description` et `tags` d'une version d'environnement peuvent être mis à jour ; un changement de package exige une nouvelle version." }
    references:
      - title: Manage Azure Machine Learning environments with the CLI & SDK (v2) - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-environments-v2

  # ------------------------------------------------------------------ 9
  - id: ai300-qz-12-09
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso created an Azure Machine Learning registry from the following file.

        ```yaml
        name: contoso_ml_registry
        location: westeurope
        replication_locations:
          - location: westeurope
          - location: northeurope
        ```

        A new governance standard requires hyphens in resource names and East US as the primary region of every shared registry.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso a créé un registre Azure Machine Learning à partir du fichier suivant.

        ```yaml
        name: contoso_ml_registry
        location: westeurope
        replication_locations:
          - location: westeurope
          - location: northeurope
        ```

        Une nouvelle norme de gouvernance exige des traits d'union dans les noms de ressources et USA Est comme région principale de chaque registre partagé.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: |
              You can rename the registry to contoso-ml-registry by updating it.
            fr: |
              Vous pouvez renommer le registre en contoso-ml-registry en le mettant à jour.
        - id: s2
          text:
            en: |
              To make East US the primary region, you must create another registry.
            fr: |
              Pour faire de USA Est la région principale, vous devez créer un autre registre.
        - id: s3
          text:
            en: |
              The registry currently stores its images in two container registries, one in each of its regions.
            fr: |
              Le registre stocke actuellement ses images dans deux registres de conteneurs, un dans chacune de ses régions.
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A registry name can't be changed after creation, because it's part of the IDs of the models, environments and components that code references. The primary region can't change either; only the other regions can be updated, so a new primary region means a new registry. A registry uses a blob storage account in each region but a single container registry replicated to every region.
        fr: |
          Le nom d'un registre ne peut pas être changé après la création, car il fait partie des ID des modèles, environnements et composants que le code référence. La région principale ne peut pas changer non plus ; seules les autres régions peuvent être mises à jour : une nouvelle région principale exige donc un nouveau registre. Un registre utilise un compte de stockage blob dans chaque région, mais un seul registre de conteneurs répliqué dans chaque région.
    references:
      - title: Create and manage registries - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-registries

  # ------------------------------------------------------------------ 10
  - id: ai300-qz-12-10
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Version 4 of the environment **churn-train-env** exists both in the workspace **mlw-dev** and in the registry **contoso_ml_registry**, whose primary region is West Europe. You must create the component defined in train.yml in contoso_ml_registry by using the Python SDK v2, so that the workspaces of several teams can use it.

        How should you complete the code and the `environment` value of train.yml? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        La version 4 de l'environnement **churn-train-env** existe à la fois dans l'espace de travail **mlw-dev** et dans le registre **contoso_ml_registry**, dont la région principale est Europe Ouest. Vous devez créer le composant défini dans train.yml dans contoso_ml_registry avec le SDK Python v2, afin que les espaces de travail de plusieurs équipes puissent l'utiliser.

        Comment devez-vous compléter le code et la valeur `environment` de train.yml ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        from azure.ai.ml import MLClient, load_component
        from azure.identity import DefaultAzureCredential

        credential = DefaultAzureCredential()
        workspace_client = MLClient(credential, "<subscription-id>", "rg-ml-dev", "mlw-dev")
        registry_client = MLClient(
            credential=credential,
            [[conn]],
        )

        # train.yml contains:  environment: [[env]]
        component = load_component(source="./train.yml")
        [[target]].components.create_or_update(component)
      slots:
        - id: conn
          options:
            - { id: sysreg, text: 'registry_name="azureml", registry_location="westeurope"' }
            - { id: reg, text: 'registry_name="contoso_ml_registry", registry_location="westeurope"' }
            - { id: ws, text: 'workspace_name="contoso_ml_registry", resource_group_name="rg-ml-shared"' }
        - id: env
          options:
            - { id: wsref, text: "azureml:churn-train-env:4" }
            - { id: curated, text: "azureml://registries/azureml/environments/churn-train-env/versions/4" }
            - { id: regref, text: "azureml://registries/contoso_ml_registry/environments/churn-train-env/versions/4" }
        - id: target
          options:
            - { id: wsclient, text: workspace_client }
            - { id: regclient, text: registry_client }
            - { id: fromconfig, text: MLClient.from_config(credential) }
    answer:
      values: { conn: reg, env: regref, target: regclient }
    explanation:
      correct:
        en: |
          An `MLClient` for a registry takes `registry_name` and `registry_location` instead of a workspace. A registry asset can reference only assets that already exist in a registry, so train.yml must point to the environment with its registry URI `azureml://registries/contoso_ml_registry/environments/churn-train-env/versions/4`. The component is then created through the registry client, not through a workspace client.
        fr: |
          Un `MLClient` pour un registre prend `registry_name` et `registry_location` au lieu d'un espace de travail. Un actif de registre ne peut référencer que des actifs qui existent déjà dans un registre : train.yml doit donc pointer vers l'environnement avec son URI de registre `azureml://registries/contoso_ml_registry/environments/churn-train-env/versions/4`. Le composant est ensuite créé par le client du registre, pas par un client d'espace de travail.
      options:
        sysreg: { en: "`azureml` is Microsoft's system registry of curated assets, not Contoso's registry.", fr: "`azureml` est le registre système de Microsoft pour les actifs organisés, pas le registre de Contoso." }
        ws: { en: "A registry isn't a workspace: `workspace_name` would target a workspace named contoso_ml_registry.", fr: "Un registre n'est pas un espace de travail : `workspace_name` viserait un espace de travail nommé contoso_ml_registry." }
        wsref: { en: "`azureml:churn-train-env:4` resolves in the workspace of the client; a registry component can't depend on a workspace asset.", fr: "`azureml:churn-train-env:4` se résout dans l'espace de travail du client ; un composant de registre ne peut pas dépendre d'un actif d'espace de travail." }
        curated: { en: "The `azureml` system registry holds Microsoft's curated environments; churn-train-env is in contoso_ml_registry.", fr: "Le registre système `azureml` contient les environnements organisés de Microsoft ; churn-train-env est dans contoso_ml_registry." }
        wsclient: { en: "`workspace_client` and `MLClient.from_config()` connect to a workspace, so the component would be created in that workspace only.", fr: "`workspace_client` et `MLClient.from_config()` se connectent à un espace de travail : le composant ne serait créé que dans cet espace de travail." }
    references:
      - title: Share models, components, and environments across workspaces with registries - Azure Machine Learning
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
