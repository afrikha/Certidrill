chapter: 21-model-training
questions:
  # ------------------------------------------------------------------ 1
  - id: ai300-qz-21-01
    objective: "2.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware inspects circuit boards with photos. A model must locate every defect in a photo by drawing a rectangle around it, and a photo can contain several defects.

        You plan to train the model with automated machine learning (AutoML) in Azure Machine Learning. Which task type should you use?
      fr: |
        Litware inspecte des circuits imprimés à partir de photos. Un modèle doit localiser chaque défaut d'une photo en traçant un rectangle autour de lui, et une photo peut contenir plusieurs défauts.

        Vous prévoyez d'entraîner le modèle avec le machine learning automatisé (AutoML) dans Azure Machine Learning. Quel type de tâche devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Image classification", fr: "Classification d'images" } }
        - { id: b, text: { en: "Image classification multi-label", fr: "Classification d'images multiétiquette" } }
        - { id: c, text: { en: "Image object detection", fr: "Détection d'objets dans les images" } }
        - { id: d, text: { en: "Tabular classification", fr: "Classification tabulaire" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Object detection finds each object in an image and returns its position as a bounding box, which is what locating several defects per photo requires. AutoML supports it with the `image_object_detection` task, trained from an MLTable of labeled images.
        fr: |
          La détection d'objets trouve chaque objet d'une image et renvoie sa position sous forme de rectangle englobant, ce qu'exige la localisation de plusieurs défauts par photo. AutoML la prend en charge avec la tâche `image_object_detection`, entraînée à partir d'une MLTable d'images étiquetées.
      options:
        a: { en: "Image classification assigns one class to the whole image; it doesn't locate anything.", fr: "La classification d'images attribue une seule classe à toute l'image ; elle ne localise rien." }
        b: { en: "Multi-label classification can say which defect types are present, but not where they are in the photo.", fr: "La classification multiétiquette peut dire quels types de défauts sont présents, mais pas où ils se trouvent sur la photo." }
        d: { en: "Tabular classification predicts a column of a table; it doesn't process images.", fr: "La classification tabulaire prédit une colonne d'une table ; elle ne traite pas d'images." }
    references:
      - title: Set up AutoML for computer vision
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-auto-train-image-models

  # ------------------------------------------------------------------ 2
  - id: ai300-qz-21-02
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A training script holds a Python dictionary named `label_map` that maps class indexes to class names. The script runs as a job in an Azure Machine Learning workspace.

        You need to store `label_map` as a JSON file in the artifacts of the run, without writing the file to disk first. Which MLflow call should you use?
      fr: |
        Un script d'entraînement contient un dictionnaire Python nommé `label_map` qui associe les index de classes aux noms de classes. Le script s'exécute comme un travail dans un espace de travail Azure Machine Learning.

        Vous devez stocker `label_map` sous forme de fichier JSON dans les artefacts de l'exécution, sans écrire d'abord le fichier sur le disque. Quel appel MLflow devez-vous utiliser ?
    body:
      options:
        - { id: a, text: "mlflow.log_params(label_map)" }
        - { id: b, text: "mlflow.log_artifact(\"label_map.json\")" }
        - { id: c, text: "mlflow.log_metric(\"label_map\", label_map)" }
        - { id: d, text: "mlflow.log_dict(label_map, \"label_map.json\")" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `mlflow.log_dict()` persists a dictionary object in the run as a JSON or YAML file, named by the second argument. The file doesn't have to exist on disk: MLflow creates the artifact from the object.
        fr: |
          `mlflow.log_dict()` conserve un objet dictionnaire dans l'exécution sous forme de fichier JSON ou YAML, nommé par le second argument. Le fichier n'a pas besoin d'exister sur le disque : MLflow crée l'artefact à partir de l'objet.
      options:
        a: { en: "log_params records each key as a run parameter, not a JSON file in the artifacts.", fr: "log_params enregistre chaque clé comme paramètre de l'exécution, pas comme fichier JSON dans les artefacts." }
        b: { en: "log_artifact uploads a file that already exists, so the script would have to write it to disk first.", fr: "log_artifact charge un fichier qui existe déjà : le script devrait donc d'abord l'écrire sur le disque." }
        c: { en: "log_metric only accepts a numeric value, not a dictionary.", fr: "log_metric n'accepte qu'une valeur numérique, pas un dictionnaire." }
    references:
      - title: Log metrics, parameters, and files with MLflow
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-log-view-metrics

  # ------------------------------------------------------------------ 3
  - id: ai300-qz-21-03
    objective: "2.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A data scientist finished an exploratory analysis in a notebook in Azure Machine Learning studio. The cells have run, and the notebook shows tables and charts.

        Her manager must read the whole analysis, including the charts, in a web browser. The manager must not get any access to the workspace. What should the data scientist do?
      fr: |
        Une scientifique des données a terminé une analyse exploratoire dans un notebook d'Azure Machine Learning studio. Les cellules ont été exécutées, et le notebook affiche des tableaux et des graphiques.

        Son responsable doit lire toute l'analyse, graphiques compris, dans un navigateur web. Le responsable ne doit obtenir aucun accès à l'espace de travail. Que doit faire la scientifique des données ?
    body:
      options:
        - { id: a, text: { en: "Assign the manager the Reader role on the workspace and send the notebook URL.", fr: "Attribuer au responsable le rôle Reader sur l'espace de travail et lui envoyer l'URL du notebook." } }
        - { id: b, text: { en: "Use Export As to save the notebook as HTML and send the exported file.", fr: "Utiliser Export As pour enregistrer le notebook en HTML et envoyer le fichier exporté." } }
        - { id: c, text: { en: "Use Export As to save the notebook as Python and send the exported file.", fr: "Utiliser Export As pour enregistrer le notebook en Python et envoyer le fichier exporté." } }
        - { id: d, text: { en: "Create a named checkpoint of the notebook and send its link to the manager.", fr: "Créer un point de contrôle nommé du notebook et envoyer son lien au responsable." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          **Export As** saves the notebook on your computer as Python, HTML or LaTeX. An HTML export keeps the rendered outputs of the cells and opens in any browser, so the manager reads it without any workspace access.
        fr: |
          **Export As** enregistre le notebook sur votre ordinateur au format Python, HTML ou LaTeX. Un export HTML garde les sorties affichées des cellules et s'ouvre dans n'importe quel navigateur : le responsable le lit donc sans aucun accès à l'espace de travail.
      options:
        a: { en: "Opening a notebook from the workspace requires access to the workspace, which the manager must not get.", fr: "Ouvrir un notebook depuis l'espace de travail exige un accès à l'espace de travail, que le responsable ne doit pas obtenir." }
        c: { en: "A Python export contains only the code, without the tables and charts produced by the cells.", fr: "Un export Python ne contient que le code, sans les tableaux ni les graphiques produits par les cellules." }
        d: { en: "A checkpoint is a saved version stored in the workspace, used to revert the notebook; it isn't shareable outside the workspace.", fr: "Un point de contrôle est une version enregistrée dans l'espace de travail, qui sert à rétablir le notebook ; il n'est pas partageable hors de l'espace de travail." }
    references:
      - title: Run Jupyter notebooks in your workspace
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-run-jupyter-notebooks

  # ------------------------------------------------------------------ 4
  - id: ai300-qz-21-04
    objective: "2.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You submit command jobs that run on a compute cluster named **cpu-cluster**. The system-assigned managed identity of cpu-cluster has the Storage Blob Data Reader role on the storage account that holds the training data. The data scientists who submit the jobs have no role on that storage account.

        The jobs must read their input data with the identity of cpu-cluster, whoever submits them. What should you add to the job YAML file?
      fr: |
        Vous soumettez des travaux de commande qui s'exécutent sur un cluster de calcul nommé **cpu-cluster**. L'identité managée affectée par le système de cpu-cluster a le rôle Storage Blob Data Reader sur le compte de stockage qui contient les données d'entraînement. Les scientifiques des données qui soumettent les travaux n'ont aucun rôle sur ce compte de stockage.

        Les travaux doivent lire leurs données d'entrée avec l'identité de cpu-cluster, quelle que soit la personne qui les soumet. Que devez-vous ajouter au fichier YAML du travail ?
    body:
      options:
        - { id: a, text: "identity: { type: user_identity }" }
        - { id: b, text: "identity: { type: aml_token }" }
        - { id: c, text: "identity: { type: managed }" }
        - { id: d, text: "inputs: { training_data: { mode: direct } }" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          With `identity: type: managed`, the job uses the managed identity of the compute target to access its inputs and outputs, here the identity of cpu-cluster that holds Storage Blob Data Reader. The permissions of the submitter then don't matter.
        fr: |
          Avec `identity: type: managed`, le travail utilise l'identité managée de la cible de calcul pour accéder à ses entrées et sorties, ici l'identité de cpu-cluster qui détient Storage Blob Data Reader. Les autorisations de l'auteur de la soumission n'ont alors plus d'importance.
      options:
        a: { en: "user_identity uses the identity of the person who submits the job, and the data scientists have no role on the storage account.", fr: "user_identity utilise l'identité de la personne qui soumet le travail, et les scientifiques des données n'ont aucun rôle sur le compte de stockage." }
        b: { en: "aml_token uses the workspace's Azure Machine Learning token, not the identity of cpu-cluster.", fr: "aml_token utilise le jeton Azure Machine Learning de l'espace de travail, pas l'identité de cpu-cluster." }
        d: { en: "The direct mode only passes the storage URI to the script, which must then handle credentials itself; it doesn't choose the job identity.", fr: "Le mode direct transmet seulement l'URI de stockage au script, qui doit alors gérer lui-même les informations d'identification ; il ne choisit pas l'identité du travail." }
    references:
      - title: CLI (v2) command job YAML schema
        url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-job-command

  # ------------------------------------------------------------------ 5
  - id: ai300-qz-21-05
    objective: "2.1.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A TensorFlow training script reads the `TF_CONFIG` environment variable and uses a multi-worker strategy without parameter servers. You need to run it as a command job on three nodes of a GPU compute cluster, with one worker on each node.

        Which configuration should you use in the job YAML file?
      fr: |
        Un script d'entraînement TensorFlow lit la variable d'environnement `TF_CONFIG` et utilise une stratégie multiworker sans serveurs de paramètres. Vous devez l'exécuter comme travail de commande sur trois nœuds d'un cluster de calcul GPU, avec un worker sur chaque nœud.

        Quelle configuration devez-vous utiliser dans le fichier YAML du travail ?
    body:
      options:
        - { id: a, text: "distribution: { type: tensorflow }, resources: { instance_count: 3 }" }
        - { id: b, text: "distribution: { type: tensorflow, worker_count: 3 }, resources: { instance_count: 1 }" }
        - { id: c, text: "distribution: { type: tensorflow, parameter_server_count: 1 }, resources: { instance_count: 3 }" }
        - { id: d, text: "distribution: { type: pytorch, process_count_per_instance: 1 }, resources: { instance_count: 3 }" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          With the `tensorflow` distribution, Azure Machine Learning sets `TF_CONFIG` on each worker. `worker_count` defaults to `resources.instance_count` and `parameter_server_count` defaults to 0, so three nodes give three workers and no parameter server.
        fr: |
          Avec la distribution `tensorflow`, Azure Machine Learning définit `TF_CONFIG` sur chaque worker. `worker_count` vaut `resources.instance_count` par défaut et `parameter_server_count` vaut 0 par défaut : trois nœuds donnent donc trois workers et aucun serveur de paramètres.
      options:
        b: { en: "instance_count is the number of nodes: with 1, the job gets a single node instead of three.", fr: "instance_count est le nombre de nœuds : avec 1, le travail n'obtient qu'un seul nœud au lieu de trois." }
        c: { en: "parameter_server_count: 1 adds a parameter server, which the script's strategy doesn't use.", fr: "parameter_server_count: 1 ajoute un serveur de paramètres, que la stratégie du script n'utilise pas." }
        d: { en: "The pytorch distribution sets the PyTorch variables (MASTER_ADDR, RANK...), not TF_CONFIG.", fr: "La distribution pytorch définit les variables PyTorch (MASTER_ADDR, RANK...), pas TF_CONFIG." }
    references:
      - title: CLI (v2) command job YAML schema
        url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-job-command

  # ------------------------------------------------------------------ 6
  - id: ai300-qz-21-06
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank trains a loan default model with an AutoML classification job by using the Python SDK v2. The job runs on a compute cluster named **cpu-cluster** that scales from 0 to 6 nodes. The compliance team sets the following requirements:

        - Only LightGBM models may be trained.
        - The selected model must be a single LightGBM model, not an ensemble of models.
        - Trials must use all the nodes of cpu-cluster in parallel, without queuing more trials than the cluster can run at once.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank entraîne un modèle de défaut de paiement avec un travail de classification AutoML à l'aide du SDK Python v2. Le travail s'exécute sur un cluster de calcul nommé **cpu-cluster** qui évolue de 0 à 6 nœuds. L'équipe de conformité fixe les exigences suivantes :

        - Seuls des modèles LightGBM peuvent être entraînés.
        - Le modèle sélectionné doit être un seul modèle LightGBM, pas un ensemble de modèles.
        - Les essais doivent utiliser tous les nœuds de cpu-cluster en parallèle, sans mettre en file d'attente plus d'essais que le cluster ne peut en exécuter à la fois.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        job = automl.classification(
            compute="cpu-cluster",
            experiment_name="loan-default",
            training_data=Input(type=AssetTypes.MLTABLE, path="azureml:loan-train@latest"),
            target_column_name="defaulted",
            primary_metric="AUC_weighted",
        )
        job.[[method]](
            [[algos]]=["LightGBM"],
            enable_vote_ensemble=False,
            [[ensemble]]=False,
        )
        job.set_limits(
            timeout_minutes=240,
            max_concurrent_trials=[[conc]],
        )
        ml_client.jobs.create_or_update(job)
      slots:
        - id: method
          options:
            - { id: limits, text: set_limits }
            - { id: training, text: set_training }
            - { id: featurization, text: set_featurization }
        - id: algos
          options:
            - { id: blocked, text: blocked_training_algorithms }
            - { id: transformers, text: blocked_transformers }
            - { id: allowed, text: allowed_training_algorithms }
        - id: ensemble
          options:
            - { id: stack, text: enable_stack_ensemble }
            - { id: onnx, text: enable_onnx_compatible_models }
            - { id: explain, text: enable_model_explainability }
        - id: conc
          options:
            - { id: one, text: "1" }
            - { id: six, text: "6" }
            - { id: twelve, text: "12" }
    answer:
      values: { method: training, algos: allowed, ensemble: stack, conc: six }
    explanation:
      correct:
        en: |
          `set_training()` holds the algorithm and ensemble settings. `allowed_training_algorithms=["LightGBM"]` limits the trials to LightGBM, and turning off both `enable_vote_ensemble` and `enable_stack_ensemble` prevents an ensemble from becoming the selected model. Learn recommends matching `max_concurrent_trials` with the number of nodes of the cluster, here 6.
        fr: |
          `set_training()` contient les paramètres d'algorithmes et d'ensembles. `allowed_training_algorithms=["LightGBM"]` limite les essais à LightGBM, et désactiver à la fois `enable_vote_ensemble` et `enable_stack_ensemble` empêche un ensemble de devenir le modèle sélectionné. Learn recommande d'aligner `max_concurrent_trials` sur le nombre de nœuds du cluster, ici 6.
      options:
        limits: { en: "set_limits holds the exit criteria (timeouts, trials, concurrency), not the algorithms.", fr: "set_limits contient les critères de sortie (délais, essais, simultanéité), pas les algorithmes." }
        featurization: { en: "set_featurization configures feature engineering, not the algorithms or ensembles.", fr: "set_featurization configure l'ingénierie des caractéristiques, pas les algorithmes ni les ensembles." }
        blocked: { en: "Blocking LightGBM would exclude the only algorithm that is allowed.", fr: "Bloquer LightGBM exclurait le seul algorithme autorisé." }
        transformers: { en: "blocked_transformers is a featurization setting that excludes transformers, not algorithms.", fr: "blocked_transformers est un paramètre de caractérisation qui exclut des transformateurs, pas des algorithmes." }
        onnx: { en: "enable_onnx_compatible_models controls ONNX export; the stack ensemble would stay enabled.", fr: "enable_onnx_compatible_models contrôle l'export ONNX ; l'ensemble par empilement resterait activé." }
        explain: { en: "Model explainability adds feature importance; it doesn't disable the stack ensemble.", fr: "L'explicabilité du modèle ajoute l'importance des caractéristiques ; elle ne désactive pas l'ensemble par empilement." }
        one: { en: "One concurrent trial leaves five nodes idle.", fr: "Un seul essai simultané laisse cinq nœuds inactifs." }
        twelve: { en: "Twelve concurrent trials exceed the six nodes, so half of them would wait in the queue.", fr: "Douze essais simultanés dépassent les six nœuds : la moitié attendrait donc dans la file." }
    references:
      - title: Set up AutoML with Python (v2)
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-auto-train

  # ------------------------------------------------------------------ 7
  - id: ai300-qz-21-07
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware runs a sweep job in Azure Machine Learning. Each trial trains a model for 40 epochs. The sweep job contains the following settings.

        ```yaml
        sampling_algorithm: random
        objective:
          goal: maximize
          primary_metric: val_auc
        early_termination:
          type: bandit
          slack_factor: 0.1
          evaluation_interval: 1
          delay_evaluation: 5
        ```

        The training script calls `mlflow.log_metric("val_auc", auc)` once, after the last epoch. Every trial runs all 40 epochs, and the policy never cancels a trial, even trials that are far worse than the best one.

        You need poorly performing trials to be canceled while they train. What should you do?
      fr: |
        Proseware exécute un travail de balayage dans Azure Machine Learning. Chaque essai entraîne un modèle pendant 40 époques. Le travail de balayage contient les paramètres suivants.

        ```yaml
        sampling_algorithm: random
        objective:
          goal: maximize
          primary_metric: val_auc
        early_termination:
          type: bandit
          slack_factor: 0.1
          evaluation_interval: 1
          delay_evaluation: 5
        ```

        Le script d'entraînement appelle `mlflow.log_metric("val_auc", auc)` une seule fois, après la dernière époque. Chaque essai exécute les 40 époques, et la stratégie n'annule jamais aucun essai, même ceux qui sont très inférieurs au meilleur.

        Vous devez faire en sorte que les essais peu performants soient annulés pendant leur entraînement. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set delay_evaluation to 0 so that the policy applies from the first interval.", fr: "Définir delay_evaluation sur 0 pour que la stratégie s'applique dès le premier intervalle." } }
        - { id: b, text: { en: "Replace the bandit policy with a median_stopping policy that uses the same intervals.", fr: "Remplacer la stratégie bandit par une stratégie median_stopping qui utilise les mêmes intervalles." } }
        - { id: c, text: { en: "Log val_auc at the end of every epoch by calling mlflow.log_metric with step=epoch.", fr: "Enregistrer val_auc à la fin de chaque époque en appelant mlflow.log_metric avec step=epoch." } }
        - { id: d, text: { en: "Set limits.trial_timeout so that trials are canceled before they reach 40 epochs.", fr: "Définir limits.trial_timeout pour que les essais soient annulés avant d'atteindre 40 époques." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Each time the script logs the primary metric counts as one evaluation interval. With a single value logged at the end, a trial never reaches interval 5, the first one evaluated with `delay_evaluation: 5`. Logging `val_auc` after every epoch gives the policy 40 intervals, so from interval 5 on it can cancel trials outside the slack factor of the best one.
        fr: |
          Chaque enregistrement de la métrique principale par le script compte comme un intervalle d'évaluation. Avec une seule valeur enregistrée à la fin, un essai n'atteint jamais l'intervalle 5, le premier évalué avec `delay_evaluation: 5`. Enregistrer `val_auc` après chaque époque donne 40 intervalles à la stratégie : à partir de l'intervalle 5, elle peut annuler les essais qui sortent du facteur de tolérance par rapport au meilleur.
      options:
        a: { en: "Even with no delay, the only interval happens when the metric is logged after the last epoch, when the trial has already finished training.", fr: "Même sans délai, le seul intervalle a lieu quand la métrique est enregistrée après la dernière époque, alors que l'essai a déjà fini son entraînement." }
        b: { en: "The median stopping policy counts intervals the same way, by logged values of the primary metric, so it has the same problem.", fr: "La stratégie d'arrêt médian compte les intervalles de la même façon, par valeurs enregistrées de la métrique principale : elle a donc le même problème." }
        d: { en: "A trial timeout cancels every trial after a fixed time, good ones included, and the trials then never log val_auc.", fr: "Un délai d'essai annule tous les essais après une durée fixe, y compris les bons, et les essais n'enregistrent alors jamais val_auc." }
    references:
      - title: Hyperparameter tuning a model (v2)
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-tune-hyperparameters

  # ------------------------------------------------------------------ 8
  - id: ai300-qz-21-08
    objective: "2.1.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin submits the following pipeline job with `az ml job create`. The workspace has the compute clusters **cpu-cluster** and **gpu-cluster** and its default datastores. The `prep` step cleans the raw sales data, `profile` builds a data quality report from the same raw data, and `train` fits the model on the cleaned data.

        ```yaml
        type: pipeline
        inputs:
          raw_data:
            type: uri_folder
            path: azureml:sales-raw@latest
        settings:
          default_compute: azureml:cpu-cluster
        jobs:
          prep:
            type: command
            component: ./prep.yml
            inputs:
              raw_data: ${{parent.inputs.raw_data}}
          profile:
            type: command
            component: ./profile.yml
            inputs:
              raw_data: ${{parent.inputs.raw_data}}
          train:
            type: command
            component: ./train.yml
            compute: azureml:gpu-cluster
            inputs:
              training_data: ${{parent.jobs.prep.outputs.clean_data}}
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin soumet le travail de pipeline suivant avec `az ml job create`. L'espace de travail contient les clusters de calcul **cpu-cluster** et **gpu-cluster** ainsi que ses magasins de données par défaut. L'étape `prep` nettoie les données de ventes brutes, `profile` produit un rapport de qualité des données à partir des mêmes données brutes, et `train` ajuste le modèle sur les données nettoyées.

        ```yaml
        type: pipeline
        inputs:
          raw_data:
            type: uri_folder
            path: azureml:sales-raw@latest
        settings:
          default_compute: azureml:cpu-cluster
        jobs:
          prep:
            type: command
            component: ./prep.yml
            inputs:
              raw_data: ${{parent.inputs.raw_data}}
          profile:
            type: command
            component: ./profile.yml
            inputs:
              raw_data: ${{parent.inputs.raw_data}}
          train:
            type: command
            component: ./train.yml
            compute: azureml:gpu-cluster
            inputs:
              training_data: ${{parent.jobs.prep.outputs.clean_data}}
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: If `prep` fails, `profile` keeps running until it completes.
            fr: Si `prep` échoue, `profile` continue de s'exécuter jusqu'à la fin.
        - id: s2
          text:
            en: The outputs of `prep` and `profile` are stored in the workspace blob datastore.
            fr: Les sorties de `prep` et de `profile` sont stockées dans le magasin de données blob de l'espace de travail.
        - id: s3
          text:
            en: The `train` step runs on cpu-cluster because `default_compute` applies to every step of the pipeline.
            fr: L'étape `train` s'exécute sur cpu-cluster car `default_compute` s'applique à toutes les étapes du pipeline.
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          `continue_on_step_failure` defaults to `True`, so the pipeline keeps running the steps that don't depend on a failed step: `profile` only consumes the pipeline input. Without `default_datastore`, outputs are stored in the workspace blob datastore. A `compute` set on a step overrides `default_compute` for that step, so `train` runs on gpu-cluster.
        fr: |
          `continue_on_step_failure` vaut `True` par défaut : le pipeline continue donc d'exécuter les étapes qui ne dépendent pas d'une étape en échec, et `profile` ne consomme que l'entrée du pipeline. Sans `default_datastore`, les sorties sont stockées dans le magasin de données blob de l'espace de travail. Un `compute` défini sur une étape remplace `default_compute` pour cette étape : `train` s'exécute donc sur gpu-cluster.
      options:
        s1: { en: "Yes: the default continue_on_step_failure is True, and profile doesn't depend on prep.", fr: "Oui : continue_on_step_failure vaut True par défaut, et profile ne dépend pas de prep." }
        s2: { en: "Yes: when default_datastore is omitted, outputs go to the workspace blob datastore.", fr: "Oui : quand default_datastore est omis, les sorties vont dans le magasin de données blob de l'espace de travail." }
        s3: { en: "No: the compute of a step overrides default_compute, so train runs on gpu-cluster.", fr: "Non : le calcul d'une étape remplace default_compute : train s'exécute donc sur gpu-cluster." }
    references:
      - title: CLI (v2) pipeline job YAML schema
        url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-job-pipeline

  # ------------------------------------------------------------------ 9
  - id: ai300-qz-21-09
    objective: "2.1.8"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam tracks its training jobs with MLflow in an Azure Machine Learning workspace. Each run logs the parameter `model_family`, whose values include `xgb-hist`, `xgb-gpu` and `rf`, and the metric `val_auc`.

        A notebook on a compute instance contains the following code.

        ```python
        mlflow.set_experiment("scratch")
        runs = mlflow.search_runs(
            filter_string="params.model_family = 'xgb' AND attributes.status = Finished",
        )
        top5 = runs.sort_values("metrics.val_auc", ascending=False).head(5)
        ```

        You need `top5` to contain the five runs with the highest `val_auc` among the completed runs of the experiments **churn-a** and **churn-b** whose `model_family` starts with `xgb`. Runs of other experiments must be excluded.

        Which three changes should you make? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam suit ses travaux d'entraînement avec MLflow dans un espace de travail Azure Machine Learning. Chaque exécution enregistre le paramètre `model_family`, dont les valeurs comprennent `xgb-hist`, `xgb-gpu` et `rf`, et la métrique `val_auc`.

        Un notebook sur une instance de calcul contient le code suivant.

        ```python
        mlflow.set_experiment("scratch")
        runs = mlflow.search_runs(
            filter_string="params.model_family = 'xgb' AND attributes.status = Finished",
        )
        top5 = runs.sort_values("metrics.val_auc", ascending=False).head(5)
        ```

        Vous devez faire en sorte que `top5` contienne les cinq exécutions de plus haute `val_auc` parmi les exécutions terminées des expériences **churn-a** et **churn-b** dont `model_family` commence par `xgb`. Les exécutions des autres expériences doivent être exclues.

        Quelles sont les trois modifications à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Add experiment_names=[\"churn-a\", \"churn-b\"] to the search_runs call.", fr: "Ajouter experiment_names=[\"churn-a\", \"churn-b\"] à l'appel de search_runs." } }
        - { id: b, text: { en: "Add search_all_experiments=True to the search_runs call.", fr: "Ajouter search_all_experiments=True à l'appel de search_runs." } }
        - { id: c, text: { en: "Replace the status condition with attributes.status = 'Completed'.", fr: "Remplacer la condition de statut par attributes.status = 'Completed'." } }
        - { id: d, text: { en: "Replace the status condition with attributes.status = 'Finished'.", fr: "Remplacer la condition de statut par attributes.status = 'Finished'." } }
        - { id: e, text: { en: "Replace the parameter condition with params.model_family LIKE 'xgb%'.", fr: "Remplacer la condition de paramètre par params.model_family LIKE 'xgb%'." } }
        - { id: f, text: { en: "Replace sort_values with order_by=[\"metrics.val_auc DESC\"] and max_results=5.", fr: "Remplacer sort_values par order_by=[\"metrics.val_auc DESC\"] et max_results=5." } }
      choose: 3
    answer: { optionIds: [a, d, e] }
    explanation:
      correct:
        en: |
          Without an experiment argument, `search_runs` searches only the active experiment, here `scratch`: `experiment_names` restricts the search to churn-a and churn-b. Values of `attributes` must be quoted strings, and a completed job has the MLflow status `Finished`. Parameters support `=`, `!=` and `like`: `LIKE 'xgb%'` matches every value that starts with `xgb`, whereas `= 'xgb'` matches none of them.
        fr: |
          Sans argument d'expérience, `search_runs` ne cherche que dans l'expérience active, ici `scratch` : `experiment_names` limite la recherche à churn-a et churn-b. Les valeurs des `attributes` doivent être des chaînes entre guillemets, et un travail terminé a le statut MLflow `Finished`. Les paramètres acceptent `=`, `!=` et `like` : `LIKE 'xgb%'` correspond à toutes les valeurs qui commencent par `xgb`, alors que `= 'xgb'` n'en trouve aucune.
      options:
        b: { en: "search_all_experiments returns runs of every experiment of the workspace, which must be excluded.", fr: "search_all_experiments renvoie les exécutions de toutes les expériences de l'espace de travail, qui doivent être exclues." }
        c: { en: "Completed is the status shown in Azure Machine Learning; MLflow maps it to Finished, so this filter returns nothing.", fr: "Completed est le statut affiché dans Azure Machine Learning ; MLflow le traduit en Finished : ce filtre ne renvoie donc rien." }
        f: { en: "Azure Machine Learning doesn't support order_by on metrics.*: sorting the DataFrame with pandas, as the code already does, is the supported way.", fr: "Azure Machine Learning ne prend pas en charge order_by sur metrics.* : trier le DataFrame avec pandas, comme le fait déjà le code, est la méthode prise en charge." }
    references:
      - title: Query & compare experiments and runs with MLflow
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-track-experiments-mlflow

  # ------------------------------------------------------------------ 10
  - id: ai300-qz-21-10
    objective: "2.1.7"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso has a command component file named `train.yml`. The component declares the inputs `training_data` (`uri_folder`) and `learning_rate` (`number`) and the output `model_output`. Its script logs `val_auc` with `mlflow.log_metric()`.

        You are writing a pipeline job. Inside the pipeline, the `tune` step must run the train component many times with log-uniform values of `learning_rate` and keep the run with the highest `val_auc`. The `evaluate` step must then receive the model output of `tune`.

        How should you complete the pipeline YAML? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un fichier de composant de commande nommé `train.yml`. Le composant déclare les entrées `training_data` (`uri_folder`) et `learning_rate` (`number`) et la sortie `model_output`. Son script enregistre `val_auc` avec `mlflow.log_metric()`.

        Vous rédigez un travail de pipeline. Dans le pipeline, l'étape `tune` doit exécuter le composant d'entraînement de nombreuses fois avec des valeurs log-uniformes de `learning_rate` et garder l'exécution qui a la plus haute `val_auc`. L'étape `evaluate` doit ensuite recevoir la sortie de modèle de `tune`.

        Comment devez-vous compléter le YAML du pipeline ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: yaml
      template: |
        $schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
        type: pipeline
        inputs:
          raw_data:
            type: uri_folder
            path: azureml:churn-raw@latest
        settings:
          default_compute: azureml:cpu-cluster
        jobs:
          prep:
            type: command
            component: ./prep.yml
            inputs:
              raw_data: ${{parent.inputs.raw_data}}
          tune:
            type: [[steptype]]
            [[trialkey]]: ./train.yml
            inputs:
              training_data: ${{parent.jobs.prep.outputs.clean_data}}
            outputs:
              model_output:
            sampling_algorithm: random
            search_space:
              [[sskey]]:
                type: loguniform
                min_value: -6
                max_value: -1
            objective:
              goal: maximize
              primary_metric: val_auc
            limits:
              max_total_trials: 20
              max_concurrent_trials: 4
          evaluate:
            type: command
            component: ./evaluate.yml
            inputs:
              model: [[bind]]
      slots:
        - id: steptype
          options:
            - { id: command, text: command }
            - { id: sweep, text: sweep }
            - { id: pipeline, text: pipeline }
        - id: trialkey
          options:
            - { id: component, text: component }
            - { id: code, text: code }
            - { id: trial, text: trial }
        - id: sskey
          options:
            - { id: lr, text: learning_rate }
            - { id: sslr, text: search_space.learning_rate }
            - { id: inlr, text: "${{inputs.learning_rate}}" }
        - id: bind
          options:
            - { id: parentout, text: "${{parent.outputs.model_output}}" }
            - { id: jobsout, text: "${{jobs.tune.outputs.model_output}}" }
            - { id: stepout, text: "${{parent.jobs.tune.outputs.model_output}}" }
    answer:
      values: { steptype: sweep, trialkey: trial, sskey: lr, bind: stepout }
    explanation:
      correct:
        en: |
          A hyperparameter sweep inside a pipeline is a step of `type: sweep` whose `trial` key references the command component. The keys of `search_space` are the names of the component inputs that the sweep samples, here `learning_rate`. A later step consumes the sweep output with `${{parent.jobs.tune.outputs.model_output}}`, which also makes `evaluate` wait for `tune`.
        fr: |
          Un balayage d'hyperparamètres dans un pipeline est une étape de `type: sweep` dont la clé `trial` référence le composant de commande. Les clés de `search_space` sont les noms des entrées du composant que le balayage échantillonne, ici `learning_rate`. Une étape suivante consomme la sortie du balayage avec `${{parent.jobs.tune.outputs.model_output}}`, ce qui fait aussi attendre `evaluate` jusqu'à la fin de `tune`.
      options:
        command: { en: "A command step runs the component once; it has no search space or objective.", fr: "Une étape de commande exécute le composant une seule fois ; elle n'a ni espace de recherche ni objectif." }
        pipeline: { en: "A pipeline step runs a nested pipeline; it doesn't tune a component.", fr: "Une étape de pipeline exécute un pipeline imbriqué ; elle ne règle pas un composant." }
        component: { en: "component is the key of a command step; a sweep step names the component to repeat in trial.", fr: "component est la clé d'une étape de commande ; une étape de balayage nomme le composant à répéter dans trial." }
        code: { en: "code points to a source folder in a command job, not to the component of the trials.", fr: "code désigne un dossier source dans un travail de commande, pas le composant des essais." }
        sslr: { en: "search_space.learning_rate is the form used in the ${{...}} binding of a standalone sweep job's command; the key itself is the input name.", fr: "search_space.learning_rate est la forme utilisée dans la liaison ${{...}} de la commande d'un travail de balayage autonome ; la clé elle-même est le nom de l'entrée." }
        inlr: { en: "An expression isn't a valid key of search_space: the key is the input name.", fr: "Une expression n'est pas une clé valide de search_space : la clé est le nom de l'entrée." }
        parentout: { en: "parent.outputs refers to outputs of the pipeline itself, not to the output of the tune step.", fr: "parent.outputs désigne les sorties du pipeline lui-même, pas la sortie de l'étape tune." }
        jobsout: { en: "Step outputs are referenced from the parent pipeline: the expression must start with parent.jobs.", fr: "Les sorties d'étape se référencent depuis le pipeline parent : l'expression doit commencer par parent.jobs." }
    references:
      - title: How to do hyperparameter sweep in pipelines
        url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-sweep-in-pipeline
      - title: CLI (v2) pipeline job YAML schema
        url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-job-pipeline
