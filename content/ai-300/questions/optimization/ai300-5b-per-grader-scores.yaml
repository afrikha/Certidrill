id: ai300-5b-per-grader-scores
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware fine-tunes o4-mini with reinforcement fine-tuning (RFT). The job uses a `multi` grader that averages a `text_similarity` child grader on the extracted text and a `string_check` child grader on the clause type.

    `valid_reward_mean` reaches 0.82, but testers report that the clause type is often wrong.

    You need to confirm which criterion the model meets poorly. Which job metrics should you review?
  fr: |
    Litware effectue le réglage précis par renforcement (RFT) d'o4-mini. Le travail utilise un évaluateur (grader) `multi` qui fait la moyenne d'un évaluateur enfant `text_similarity` sur le texte extrait et d'un évaluateur enfant `string_check` sur le type de clause.

    `valid_reward_mean` atteint 0,82, mais les testeurs signalent que le type de clause est souvent faux.

    Vous devez confirmer le critère que le modèle respecte mal. Quelles métriques du travail devez-vous examiner ?
body:
  options:
    - { id: a, text: { en: "The per-grader rewards in `data.scores.graders`", fr: "Les récompenses par évaluateur dans `data.scores.graders`" } }
    - { id: b, text: { en: "The grader errors in `data.errors.graders`", fr: "Les erreurs d'évaluateur dans `data.errors.graders`" } }
    - { id: c, text: { en: "The reasoning token means in `data.usage.samples`", fr: "Les moyennes de jetons de raisonnement dans `data.usage.samples`" } }
    - { id: d, text: { en: "The `train_reward_mean` value in `data.scores`", fr: "La valeur `train_reward_mean` dans `data.scores`" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A high combined reward can hide poor performance on one criterion. The per-grader rewards in `data.scores.graders` show the score of each child grader, so you can see whether the `string_check` grader on the clause type scores low.
    fr: |
      Une récompense combinée élevée peut masquer une mauvaise performance sur un critère. Les récompenses par évaluateur dans `data.scores.graders` indiquent le score de chaque évaluateur enfant : vous voyez ainsi si l'évaluateur `string_check` sur le type de clause obtient un score faible.
  options:
    b: { en: "Grader errors report parse errors, missing reference fields and execution errors, not the score of each criterion.", fr: "Les erreurs d'évaluateur signalent les erreurs d'analyse, les champs de référence manquants et les erreurs d'exécution, pas le score de chaque critère." }
    c: { en: "Reasoning token means describe how many reasoning tokens the model uses, not how well it meets a criterion.", fr: "Les moyennes de jetons de raisonnement décrivent le nombre de jetons de raisonnement utilisés, pas le respect d'un critère." }
    d: { en: "`train_reward_mean` is the combined reward of the training batch, so it hides the individual criteria.", fr: "`train_reward_mean` est la récompense combinée du lot d'entraînement : elle masque les critères individuels." }
references:
  - title: Fine-tune a model with reinforcement fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reinforcement-fine-tuning
