id: ai300-5a-embedding-statements
objective: "5.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys runs a RAG solution that stores Azure OpenAI embeddings in an Azure AI Search index. The team is reviewing its embedding model choices.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys exploite une solution RAG qui stocke des incorporations Azure OpenAI dans un index Azure AI Search. L'équipe passe en revue ses choix de modèle d'incorporation.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The user question must be embedded by the same embedding model that generated the document vectors.
        fr: |
          La question de l'utilisateur doit être incorporée par le même modèle d'incorporation que celui qui a généré les vecteurs des documents.
    - id: s2
      text:
        en: |
          According to OpenAI's MTEB testing, a third-generation embedding model reduced to fewer than 1,536 dimensions performs worse than `text-embedding-ada-002`.
        fr: |
          D'après les tests MTEB d'OpenAI, un modèle d'incorporation de troisième génération réduit à moins de 1 536 dimensions est moins performant que `text-embedding-ada-002`.
    - id: s3
      text:
        en: |
          The `dimensions` value of a vector field must match the number of dimensions that the embedding model returns.
        fr: |
          La valeur `dimensions` d'un champ vectoriel doit correspondre au nombre de dimensions renvoyé par le modèle d'incorporation.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Retrieval compares the query vector with the chunk vectors, so both must come from the same model, with the same preprocessing. Learn reports that, in OpenAI's MTEB testing, third-generation models reduced below the 1,536 dimensions of `text-embedding-ada-002` still perform slightly better than it. A vector field declares a number of dimensions that must match the embedding model output.
    fr: |
      La récupération compare le vecteur de la requête aux vecteurs des blocs : les deux doivent donc provenir du même modèle, avec le même prétraitement. Learn indique que, dans les tests MTEB d'OpenAI, les modèles de troisième génération réduits sous les 1 536 dimensions de `text-embedding-ada-002` restent légèrement meilleurs que lui. Un champ vectoriel déclare un nombre de dimensions qui doit correspondre à la sortie du modèle d'incorporation.
references:
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
  - title: Information retrieval
    url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/rag/rag-information-retrieval
