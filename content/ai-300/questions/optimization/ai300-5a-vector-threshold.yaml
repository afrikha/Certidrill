id: ai300-5a-vector-threshold
objective: "5.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a RAG assistant that sends a vector-only query (no `search` text) to an Azure AI Search index named **kb-index**. The vector field `contentVector` uses the `cosine` metric. Because a vector query returns `k` results whenever enough documents exist, out-of-scope questions still return poorly related chunks, and the assistant generates misleading answers.

    You need the query to return only the matches whose similarity score is at least 0.8, even if fewer than `k` matches remain.

    How should you complete the request? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un assistant RAG qui envoie une requête uniquement vectorielle (sans texte `search`) à un index Azure AI Search nommé **kb-index**. Le champ vectoriel `contentVector` utilise la métrique `cosine`. Comme une requête vectorielle renvoie `k` résultats dès que suffisamment de documents existent, les questions hors périmètre renvoient quand même des blocs peu pertinents, et l'assistant génère des réponses trompeuses.

    Vous devez faire en sorte que la requête ne renvoie que les correspondances dont le score de similarité est d'au moins 0,8, même s'il reste moins de `k` correspondances.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    POST https://srch-adatum.search.windows.net/indexes/kb-index/docs/search?api-version=[[api]]
    {
      "select": "title, content",
      "vectorQueries": [
        {
          "kind": "vector",
          "vector": [ -0.0091, 0.0187, ..., -0.0008 ],
          "fields": "contentVector",
          "k": 10,
          [[prop]]: {
            "kind": [[tkind]],
            "value": 0.8
          }
        }
      ]
    }
  slots:
    - id: api
      options:
        - { id: ga2023, text: "2023-11-01" }
        - { id: ga2026, text: "2026-04-01" }
        - { id: preview, text: "2026-08-01-preview" }
    - id: prop
      options:
        - { id: threshold, text: '"threshold"' }
        - { id: weight, text: '"weight"' }
        - { id: filterOverride, text: '"filterOverride"' }
        - { id: oversampling, text: '"oversampling"' }
    - id: tkind
      options:
        - { id: vector, text: '"vector"' }
        - { id: vecsim, text: '"vectorSimilarity"' }
        - { id: text, text: '"text"' }
answer:
  values: { api: preview, prop: threshold, tkind: vecsim }
explanation:
  correct:
    en: |
      The `threshold` property of a vector query, with `kind` set to `vectorSimilarity`, excludes the matches that score below the given value, even if fewer than `k` results remain. This feature is in preview, so the request uses a preview REST API version such as `2026-08-01-preview`. Learn recommends thresholds for single vector queries rather than hybrid queries, which is the case here.
    fr: |
      La propriété `threshold` d'une requête vectorielle, avec `kind` défini sur `vectorSimilarity`, exclut les correspondances dont le score est inférieur à la valeur indiquée, même s'il reste moins de `k` résultats. Cette fonctionnalité est en préversion : la requête utilise donc une version préliminaire de l'API REST, comme `2026-08-01-preview`. Learn recommande les seuils pour les requêtes vectorielles uniques plutôt que pour les requêtes hybrides, ce qui est le cas ici.
  options:
    ga2023: { en: "2023-11-01 is an older stable version that doesn't support vector query thresholds.", fr: "2023-11-01 est une ancienne version stable qui ne prend pas en charge les seuils de requête vectorielle." }
    ga2026: { en: "Thresholds are a preview feature; the stable 2026-04-01 version doesn't expose them.", fr: "Les seuils sont une fonctionnalité en préversion ; la version stable 2026-04-01 ne les expose pas." }
    weight: { en: "weight is a number that multiplies the contribution of a vector query to RRF; it doesn't remove low-scoring matches.", fr: "weight est un nombre qui multiplie la contribution d'une requête vectorielle à la fusion RRF ; il ne retire pas les correspondances à faible score." }
    filterOverride: { en: "filterOverride (preview) applies a filter expression to one vector query; it doesn't filter on scores.", fr: "filterOverride (préversion) applique une expression de filtre à une requête vectorielle ; il ne filtre pas sur les scores." }
    oversampling: { en: "oversampling applies to compressed vector fields; it isn't a minimum score.", fr: "oversampling s'applique aux champs vectoriels compressés ; ce n'est pas un score minimal." }
    vector: { en: "vector is a kind of vector query (raw embedding), not a kind of threshold.", fr: "vector est un type de requête vectorielle (incorporation brute), pas un type de seuil." }
    text: { en: "text is a kind of vector query that relies on a vectorizer, not a kind of threshold.", fr: "text est un type de requête vectorielle qui s'appuie sur un vectoriseur, pas un type de seuil." }
references:
  - title: Create a vector query in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-query
