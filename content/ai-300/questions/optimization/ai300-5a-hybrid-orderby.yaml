id: ai300-5a-hybrid-orderby
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware's RAG assistant sends the following hybrid query to Azure AI Search:

    ```json
    {
      "search": "replacement filter for model X200",
      "vectorQueries": [ { "kind": "text", "text": "replacement filter for model X200", "fields": "contentVector", "k": 50 } ],
      "orderby": "lastUpdated desc",
      "top": 5
    }
    ```

    Users report that the assistant grounds its answers on the most recently updated documents instead of the most relevant ones. You need the results to be ranked by hybrid relevance.

    What should you do?
  fr: |
    L'assistant RAG de Litware envoie la requête hybride suivante à Azure AI Search :

    ```json
    {
      "search": "replacement filter for model X200",
      "vectorQueries": [ { "kind": "text", "text": "replacement filter for model X200", "fields": "contentVector", "k": 50 } ],
      "orderby": "lastUpdated desc",
      "top": 5
    }
    ```

    Des utilisateurs signalent que l'assistant ancre ses réponses sur les documents mis à jour le plus récemment au lieu des plus pertinents. Vous devez faire en sorte que les résultats soient classés selon la pertinence hybride.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a `weight` of 2.0 to the vector query.", fr: "Ajouter un `weight` de 2.0 à la requête vectorielle." }
    - id: b
      text: { en: "Set `exhaustive` to `true` in the vector query.", fr: "Définir `exhaustive` sur `true` dans la requête vectorielle." }
    - id: c
      text: { en: "Remove the `orderby` parameter from the query.", fr: "Supprimer le paramètre `orderby` de la requête." }
    - id: d
      text: { en: "Increase `k` from 50 to 100 in the vector query.", fr: "Faire passer `k` de 50 à 100 dans la requête vectorielle." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An explicit `orderby` sort overrides relevance ranking, so neither BM25 relevance nor vector similarity, nor their RRF fusion, decides the order of the results. Removing `orderby` lets the hybrid query return results ranked by their RRF score.
    fr: |
      Un tri explicite `orderby` remplace le classement par pertinence : ni la pertinence BM25, ni la similarité vectorielle, ni leur fusion RRF ne déterminent alors l'ordre des résultats. Supprimer `orderby` permet à la requête hybride de renvoyer des résultats classés selon leur score RRF.
  options:
    d:
      en: |
        More nearest neighbors enter the fusion, but the results are still sorted by date.
      fr: |
        Davantage de plus proches voisins entrent dans la fusion, mais les résultats restent triés par date.
    b:
      en: |
        Exhaustive KNN returns exact neighbors, but the explicit sort still overrides the relevance order.
      fr: |
        La recherche KNN exhaustive renvoie les voisins exacts, mais le tri explicite remplace toujours l'ordre de pertinence.
    a:
      en: |
        A weight changes the RRF scores, but the scores aren't used to order results while `orderby` is set.
      fr: |
        Un poids modifie les scores RRF, mais ces scores ne servent pas à ordonner les résultats tant que `orderby` est défini.
references:
  - title: Hybrid search using vectors and full-text search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
