id: ai300-cs3c-overfitting
objective: "5.2.3"
type: single
caseStudy: ai300-cs3c-fourth-coffee
difficulty: 1
status: draft
stem:
  en: |
    You are preparing the next supervised fine-tuning job of gpt-4.1-mini. The training and validation files don't change.

    What should you do to meet Barista Assist requirement 6?
  fr: |
    Vous préparez le prochain travail de réglage précis supervisé de gpt-4.1-mini. Les fichiers d'entraînement et de validation ne changent pas.

    Que devez-vous faire pour respecter l'exigence 6 de Barista Assist ?
body:
  options:
    - id: a
      text:
        en: "Increase `n_epochs` to 10, and keep the other hyperparameters."
        fr: "Augmenter `n_epochs` à 10, et conserver les autres hyperparamètres."
    - id: b
      text:
        en: "Reduce `n_epochs` to 3, and set a smaller `learning_rate_multiplier`."
        fr: "Réduire `n_epochs` à 3, et définir un `learning_rate_multiplier` plus petit."
    - id: c
      text:
        en: "Keep `n_epochs` at 6, and add the validation examples to the training file."
        fr: "Conserver `n_epochs` à 6, et ajouter les exemples de validation au fichier d'entraînement."
    - id: d
      text:
        en: "Keep `n_epochs` at 6, and select the checkpoint that has the lowest `train_loss`."
        fr: "Conserver `n_epochs` à 6, et sélectionner le point de contrôle qui a la `train_loss` la plus faible."
answer: { optionId: b }
explanation:
  correct:
    en: |
      A training loss that keeps falling while the validation loss rises shows that the model memorizes the training data. More passes through the data can increase overfitting, so stopping around the epoch where the validation loss was lowest helps, and a smaller learning rate multiplier can also reduce overfitting.
    fr: |
      Une perte d'entraînement qui continue de baisser pendant que la perte de validation augmente montre que le modèle mémorise les données d'entraînement. Davantage de passes sur les données peut accroître le surajustement : s'arrêter vers l'époque où la perte de validation était la plus faible aide, et un multiplicateur de taux d'apprentissage plus petit peut aussi réduire le surajustement.
  options:
    a:
      en: |
        More epochs make the model fit the training data even more closely, which increases overfitting.
      fr: |
        Davantage d'époques ajustent encore plus le modèle aux données d'entraînement, ce qui accroît le surajustement.
    c:
      en: |
        Validation examples must stay out of the training set; otherwise the validation metrics no longer measure generalization.
      fr: |
        Les exemples de validation doivent rester en dehors du jeu d'entraînement ; sinon, les métriques de validation ne mesurent plus la généralisation.
    d:
      en: |
        The lowest training loss is reached at the last, most overfitted epoch; candidates should be compared on validation metrics instead.
      fr: |
        La perte d'entraînement la plus faible est atteinte à la dernière époque, la plus surajustée ; il faut plutôt comparer les candidats sur les métriques de validation.
references:
  - title: Fine-tune a model with supervised fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning
