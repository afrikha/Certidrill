id: ai300-5b-deployment-metrics
objective: "5.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Foundry resource with two Standard deployments of fine-tuned gpt-4.1-mini models, **ft-v1** and **ft-v2**. Both deployments receive production traffic.

    A cost analyst must chart the token consumption of each deployment in the Azure Monitor metrics explorer. The solution must follow the principle of least privilege.

    How should you configure the solution? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'une ressource Foundry avec deux déploiements Standard de modèles gpt-4.1-mini ajustés, **ft-v1** et **ft-v2**. Les deux déploiements reçoivent du trafic de production.

    Une analyste des coûts doit représenter la consommation de jetons de chaque déploiement dans l'explorateur de métriques d'Azure Monitor. La solution doit respecter le principe du moindre privilège.

    Comment devez-vous configurer la solution ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Metric: [[metric]]

      Split by dimension: [[dim]]

      Role to assign to the analyst on the resource: [[role]]
    fr: |
      Métrique : [[metric]]

      Fractionner par la dimension : [[dim]]

      Rôle à attribuer à l'analyste sur la ressource : [[role]]
  slots:
    - id: metric
      options:
        - { id: total, text: TotalTokens }
        - { id: provcons, text: ProvisionedConsumedTokens }
        - { id: provutil, text: ProvisionedUtilization }
    - id: dim
      options:
        - { id: region, text: Region }
        - { id: depname, text: ModelDeploymentName }
        - { id: status, text: StatusCode }
    - id: role
      options:
        - { id: monreader, text: Monitoring Reader }
        - { id: moncontrib, text: Monitoring Contributor }
        - { id: fowner, text: Foundry Owner }
answer:
  values: { metric: total, dim: depname, role: monreader }
explanation:
  correct:
    en: |
      `TotalTokens` applies to standard deployments as well as provisioned ones. The `ModelDeploymentName` dimension splits the chart by deployment. Viewing metrics requires the Monitoring Reader role on the resource; Monitoring Contributor is only needed to configure diagnostic settings.
    fr: |
      `TotalTokens` s'applique aux déploiements standard comme aux déploiements approvisionnés. La dimension `ModelDeploymentName` fractionne le graphique par déploiement. La consultation des métriques exige le rôle Monitoring Reader sur la ressource ; Monitoring Contributor n'est nécessaire que pour configurer les paramètres de diagnostic.
  options:
    provcons: { en: "`ProvisionedConsumedTokens` applies only to provisioned deployments.", fr: "`ProvisionedConsumedTokens` ne s'applique qu'aux déploiements approvisionnés." }
    provutil: { en: "`ProvisionedUtilization` is a percentage of provisioned capacity, not a token count.", fr: "`ProvisionedUtilization` est un pourcentage de la capacité approvisionnée, pas un nombre de jetons." }
    region: { en: "Both deployments are on the same resource, so splitting by region doesn't separate them.", fr: "Les deux déploiements sont sur la même ressource : fractionner par région ne les sépare pas." }
    status: { en: "`StatusCode` splits by HTTP response code, not by deployment.", fr: "`StatusCode` fractionne par code de réponse HTTP, pas par déploiement." }
    moncontrib: { en: "Monitoring Contributor grants more than the read access that charting needs.", fr: "Monitoring Contributor accorde plus que l'accès en lecture nécessaire à la création du graphique." }
    fowner: { en: "Foundry Owner grants management of the resource, far beyond viewing metrics.", fr: "Foundry Owner accorde la gestion de la ressource, bien au-delà de la consultation des métriques." }
references:
  - title: Monitor model deployments in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/how-to/monitor-models
