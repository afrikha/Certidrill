id: ai300-cs2b-finetuned-test
objective: "5.2.4"
type: single
caseStudy: ai300-cs2b-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You need to deploy ft-replies for the testers. The solution must meet operations requirement 10 and minimize cost.

    Which deployment type should you use?
  fr: |
    Vous devez déployer ft-replies pour les testeurs. La solution doit respecter l'exigence d'exploitation 10 et réduire les coûts au minimum.

    Quel type de déploiement devez-vous utiliser ?
body:
  options:
    - { id: a, text: Standard }
    - { id: b, text: Regional Provisioned }
    - { id: c, text: Global Batch }
    - { id: d, text: Developer }
answer: { optionId: d }
explanation:
  correct:
    en: "The Developer deployment type is meant for evaluating fine-tuned models: it bills per token with no hourly hosting fee, and a deployment lasts 24 hours, which covers one working day. It offers no data-residency guarantee and no availability SLA, which is acceptable for an anonymized test but not for production."
    fr: "Le type de déploiement Developer est conçu pour évaluer les modèles ajustés : il est facturé au jeton, sans frais d'hébergement horaires, et un déploiement dure 24 heures, ce qui couvre une journée de travail. Il n'offre ni garantie de résidence des données ni SLA de disponibilité, ce qui est acceptable pour un test anonymisé mais pas pour la production."
  options:
    a: { en: "A Standard deployment of a fine-tuned model adds hosting charges to the per-token billing.", fr: "Un déploiement Standard d'un modèle ajusté ajoute des frais d'hébergement à la facturation au jeton." }
    b: { en: "A provisioned deployment is billed per PTU and per hour, whatever the number of tokens.", fr: "Un déploiement approvisionné est facturé par PTU et par heure, quel que soit le nombre de jetons." }
    c: { en: "Batch deployments process asynchronous jobs, so testers cannot evaluate the model interactively.", fr: "Les déploiements Batch traitent des travaux asynchrones : les testeurs ne peuvent pas évaluer le modèle de manière interactive." }
references:
  - title: Training in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/fine-tuning-considerations
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
