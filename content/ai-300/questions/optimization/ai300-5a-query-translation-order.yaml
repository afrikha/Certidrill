id: ai300-5a-query-translation-order
objective: "5.1.1"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Proseware's RAG assistant receives complex questions such as "Compare the warranty terms of our two newest product lines and explain which one covers water damage." A language model has already classified this question as complex.

    You implement the combined query translation pipeline described in the information-retrieval phase of the Azure Architecture Center RAG guidance.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    L'assistant RAG de Proseware reçoit des questions complexes comme « Comparez les conditions de garantie de nos deux gammes de produits les plus récentes et indiquez laquelle couvre les dégâts des eaux. » Un modèle de langage a déjà classé cette question comme complexe.

    Vous implémentez le pipeline combiné de traduction de requête décrit dans la phase de récupération d'informations des recommandations RAG du Centre des architectures Azure.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: aug, text: { en: "Augment the question with missing context without changing its intent.", fr: "Enrichir la question avec le contexte manquant sans changer son intention." } }
    - { id: dec, text: { en: "Decompose the augmented question into subqueries.", fr: "Décomposer la question enrichie en sous-requêtes." } }
    - { id: sub, text: { en: "For each subquery, rewrite it, run it against the index and rerank its results.", fr: "Pour chaque sous-requête, la réécrire, l'exécuter sur l'index et reclasser ses résultats." } }
    - { id: orig, text: { en: "Run the original question through the same steps, with the accumulated subquery results as context.", fr: "Exécuter la question d'origine selon les mêmes étapes, avec les résultats cumulés des sous-requêtes comme contexte." } }
    - { id: groundfirst, text: { en: "Answer the original question first, and decompose it only if the answer gets a low groundedness score.", fr: "Répondre d'abord à la question d'origine, et ne la décomposer que si la réponse obtient un faible score d'ancrage." } }
    - { id: semans, text: { en: "Apply semantic ranking to the generated answer before returning it to the user.", fr: "Appliquer le classement sémantique à la réponse générée avant de la renvoyer à l'utilisateur." } }
answer:
  sequence: [ aug, dec, sub, orig ]
explanation:
  correct:
    en: |
      In the combined pipeline, the augmenter first adds missing context while keeping the question's intent, and the decomposer then splits the complex question into subqueries. Each subquery goes through the rewriter, the executor and the reranker, and its top results build up an accumulated context. Finally, the original question goes through the same substeps with that context to produce the top results used for generation.
    fr: |
      Dans le pipeline combiné, l'enrichissement ajoute d'abord le contexte manquant en conservant l'intention de la question, puis la décomposition découpe la question complexe en sous-requêtes. Chaque sous-requête passe par la réécriture, l'exécution et le reclassement, et ses meilleurs résultats constituent un contexte cumulé. Enfin, la question d'origine passe par les mêmes sous-étapes avec ce contexte pour produire les meilleurs résultats utilisés pour la génération.
  options:
    groundfirst:
      en: |
        The question is already classified as complex, and the pipeline decomposes it before retrieval instead of waiting for a poor answer.
      fr: |
        La question est déjà classée comme complexe, et le pipeline la décompose avant la récupération au lieu d'attendre une mauvaise réponse.
    semans:
      en: |
        Semantic ranking reorders search results; it doesn't apply to a generated answer.
      fr: |
        Le classement sémantique réordonne des résultats de recherche ; il ne s'applique pas à une réponse générée.
references:
  - title: Information retrieval
    url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/rag/rag-information-retrieval
