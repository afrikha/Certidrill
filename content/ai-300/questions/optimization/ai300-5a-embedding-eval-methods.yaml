id: ai300-5a-embedding-eval-methods
objective: "5.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware is comparing candidate embedding models for a RAG solution, following the guidance of the RAG generate embeddings phase in the Azure Architecture Center.

    Which technique should you use for each goal? To answer, drag the appropriate techniques to the correct goals. Each technique may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware compare des modèles d'incorporation candidats pour une solution RAG, en suivant les recommandations de la phase de génération des incorporations RAG du Centre des architectures Azure.

    Quelle technique devez-vous utiliser pour chaque objectif ? Pour répondre, faites glisser les techniques appropriées vers les objectifs correspondants. Chaque technique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: tsne, text: { en: "Plot the question and chunk vectors with t-SNE", fr: "Représenter les vecteurs des questions et des blocs avec t-SNE" } }
    - { id: realq, text: { en: "Run vector searches with real-world queries and check the retrieved items", fr: "Exécuter des recherches vectorielles avec des requêtes réelles et vérifier les éléments récupérés" } }
    - { id: pca, text: { en: "Apply PCA to the generated embeddings", fr: "Appliquer une ACP (PCA) aux incorporations générées" } }
    - { id: cosine, text: { en: "Compute the cosine similarity between vectors", fr: "Calculer la similarité cosinus entre les vecteurs" } }
    - { id: euclid, text: { en: "Compute the Euclidean distance between vectors", fr: "Calculer la distance euclidienne entre les vecteurs" } }
  targets:
    - { id: visual, text: { en: "See on a two-dimensional graph how far a question lies from the chunks", fr: "Voir sur un graphique à deux dimensions à quelle distance une question se trouve des blocs" } }
    - { id: practical, text: { en: "Use the most practical way to evaluate the quality of the embeddings", fr: "Utiliser la manière la plus pratique d'évaluer la qualité des incorporations" } }
    - { id: reduce, text: { en: "Reduce the number of dimensions after the embeddings are generated", fr: "Réduire le nombre de dimensions après la génération des incorporations" } }
    - { id: semantic, text: { en: "Measure the semantic closeness of two vectors, regardless of their length", fr: "Mesurer la proximité sémantique de deux vecteurs, indépendamment de leur longueur" } }
answer:
  mapping: { visual: tsne, practical: realq, reduce: pca, semantic: cosine }
explanation:
  correct:
    en: |
      t-SNE projects the question and chunk vectors onto an X-Y graph to show their distance visually. Running vector searches with real-world queries and checking whether the right items come back is, according to the guidance, the most practical evaluation of embedding quality. PCA (or t-SNE) can reduce dimensions as a post-processing step, and cosine similarity measures the angle between vectors, which the guidance recommends for semantic closeness.
    fr: |
      t-SNE projette les vecteurs des questions et des blocs sur un graphique X-Y pour montrer visuellement leur distance. Exécuter des recherches vectorielles avec des requêtes réelles et vérifier que les bons éléments sont renvoyés est, selon les recommandations, l'évaluation la plus pratique de la qualité des incorporations. L'ACP (ou t-SNE) peut réduire les dimensions en post-traitement, et la similarité cosinus mesure l'angle entre les vecteurs, ce que les recommandations préconisent pour la proximité sémantique.
  options:
    euclid:
      en: |
        Euclidean distance measures straight-line distance and depends on vector length; the guidance recommends it for literal proximity, not semantic closeness.
      fr: |
        La distance euclidienne mesure la distance en ligne droite et dépend de la longueur des vecteurs ; les recommandations la préconisent pour la proximité littérale, pas sémantique.
references:
  - title: RAG generate embeddings phase
    url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/rag/rag-generate-embeddings
