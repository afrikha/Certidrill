id: ai300-5a-chunking-by-structure
objective: "5.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware is building a RAG solution over four document collections. For each collection, you need a starting chunking approach that follows the RAG chunking guidance of the Azure Architecture Center.

    Which approach should you use for each collection? To answer, drag the appropriate approaches to the correct collections. Each approach may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware crée une solution RAG sur quatre collections de documents. Pour chaque collection, vous avez besoin d'une approche de segmentation de départ conforme aux recommandations de segmentation RAG du Centre des architectures Azure.

    Quelle approche devez-vous utiliser pour chaque collection ? Pour répondre, faites glisser les approches appropriées vers les collections correspondantes. Chaque approche peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: prebuilt, text: { en: "Prebuilt document models", fr: "Modèles de document prédéfinis" } }
    - { id: layout, text: { en: "Document layout analysis", fr: "Analyse de la disposition des documents" } }
    - { id: custom, text: { en: "Custom code that uses regular expressions or parsers", fr: "Code personnalisé qui utilise des expressions régulières ou des analyseurs" } }
    - { id: fixed, text: { en: "Fixed-size chunks with overlap", fr: "Blocs de taille fixe avec chevauchement" } }
    - { id: graph, text: { en: "Graph-based chunking, such as GraphRAG", fr: "Segmentation fondée sur un graphe, comme GraphRAG" } }
  targets:
    - { id: forms, text: { en: "Structured W-2 tax forms, for which a prebuilt model exists", fr: "Formulaires fiscaux W-2 structurés, pour lesquels un modèle prédéfini existe" } }
    - { id: web, text: { en: "Semi-structured web pages and news articles", fr: "Pages web et articles de presse semi-structurés" } }
    - { id: regs, text: { en: "Regulations whose structure can be inferred from their numbered articles", fr: "Réglementations dont la structure peut être déduite de leurs articles numérotés" } }
    - { id: feedback, text: { en: "Unstructured customer feedback and email", fr: "Commentaires de clients et e-mails non structurés" } }
answer:
  mapping: { forms: prebuilt, web: layout, regs: custom, feedback: fixed }
explanation:
  correct:
    en: |
      The guidance matches the approach to the structure of the documents. Structured documents with an existing model use prebuilt models, semi-structured documents such as web pages and news use document layout analysis, documents with an inferable structure such as regulations use custom code, and unstructured text such as feedback and email uses fixed-size chunks with overlap or sentence-based chunking. These are starting points to test on your own documents and queries.
    fr: |
      Les recommandations associent l'approche à la structure des documents. Les documents structurés pour lesquels un modèle existe utilisent des modèles prédéfinis, les documents semi-structurés comme les pages web et la presse utilisent l'analyse de la disposition, les documents dont la structure se déduit, comme les réglementations, utilisent du code personnalisé, et le texte non structuré, comme les commentaires et les e-mails, utilise des blocs de taille fixe avec chevauchement ou une segmentation par phrases. Ce sont des points de départ à tester sur vos propres documents et requêtes.
  options:
    graph:
      en: |
        Graph-based chunking has a high engineering and processing cost and targets quantitative or relationship queries across documents, which none of these collections requires.
      fr: |
        La segmentation fondée sur un graphe a un coût d'ingénierie et de traitement élevé et vise les requêtes quantitatives ou relationnelles entre documents, ce qu'aucune de ces collections n'exige.
references:
  - title: RAG chunking phase
    url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/rag/rag-chunking-phase
