id: ai300-5a-online-ab-traffic
objective: "5.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso hosts the orchestration code of its RAG assistant on an Azure Machine Learning managed online endpoint named **rag-ep**. A deployment named **blue** receives 100 percent of the traffic. You add a deployment named **green** that uses hybrid retrieval with semantic ranking.

    Offline evaluations of green are positive. You now need an online A/B test: 10 percent of the user requests must get their answers from green, so that the users' thumbs-up and thumbs-down feedback can be compared between the two deployments. The client application must not change.

    What should you do?
  fr: |
    Contoso héberge le code d'orchestration de son assistant RAG sur un point de terminaison en ligne managé Azure Machine Learning nommé **rag-ep**. Un déploiement nommé **blue** reçoit 100 % du trafic. Vous ajoutez un déploiement nommé **green** qui utilise la récupération hybride avec classement sémantique.

    Les évaluations hors connexion de green sont positives. Vous avez maintenant besoin d'un test A/B en ligne : 10 % des requêtes des utilisateurs doivent obtenir leur réponse de green, afin de comparer entre les deux déploiements les avis positifs et négatifs des utilisateurs. L'application cliente ne doit pas changer.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Run `az ml online-endpoint update --name rag-ep --traffic \"blue=100 green=10\"`.", fr: "Exécuter `az ml online-endpoint update --name rag-ep --traffic \"blue=100 green=10\"`." }
    - id: b
      text: { en: "Add the `azureml-model-deployment: green` header to the scoring requests sent by the gateway in front of the endpoint.", fr: "Ajouter l'en-tête `azureml-model-deployment: green` aux requêtes de scoring envoyées par la passerelle placée devant le point de terminaison." }
    - id: c
      text: { en: "Run `az ml online-endpoint update --name rag-ep --mirror-traffic \"green=10\"`.", fr: "Exécuter `az ml online-endpoint update --name rag-ep --mirror-traffic \"green=10\"`." }
    - id: d
      text: { en: "Run `az ml online-endpoint update --name rag-ep --traffic \"blue=90 green=10\"`.", fr: "Exécuter `az ml online-endpoint update --name rag-ep --traffic \"blue=90 green=10\"`." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A live traffic split sends 10 percent of the requests to green and returns green's responses to those users, so their feedback reflects the new retrieval. The percentages of live traffic must total 100 percent (or 0 percent to disable traffic).
    fr: |
      Une répartition du trafic en direct envoie 10 % des requêtes à green et renvoie les réponses de green à ces utilisateurs : leurs avis portent donc sur la nouvelle récupération. Les pourcentages de trafic en direct doivent totaliser 100 % (ou 0 % pour désactiver le trafic).
  options:
    c:
      en: |
        Mirrored traffic sends a copy of the requests to green, but clients still receive only blue's responses, so users never see green's answers.
      fr: |
        Le trafic mis en miroir envoie une copie des requêtes à green, mais les clients ne reçoivent toujours que les réponses de blue : les utilisateurs ne voient jamais les réponses de green.
    a:
      en: |
        The live traffic percentages of an endpoint must add up to 100 percent; 110 percent isn't valid.
      fr: |
        Les pourcentages de trafic en direct d'un point de terminaison doivent totaliser 100 % ; 110 % n'est pas valide.
    b:
      en: |
        The header routes every request that carries it directly to green and bypasses the traffic rules, so green would get all the traffic instead of 10 percent.
      fr: |
        L'en-tête dirige directement vers green chaque requête qui le porte et contourne les règles de trafic : green recevrait tout le trafic au lieu de 10 %.
references:
  - title: Perform safe rollout of new deployments for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
