id: ai300-5b-traces-reader-role
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a Microsoft Foundry project named **proj-loans**. An agent of the project sends its traces to an Application Insights resource named **appi-loans**. The trace tables aren't protected tables.

    You have the Foundry User role on proj-loans. You start a job to create an evaluation dataset from the agent's traces, but the service can't query the traces.

    You need to fix the issue. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un projet Microsoft Foundry nommé **proj-loans**. Un agent du projet envoie ses traces à une ressource Application Insights nommée **appi-loans**. Les tables de traces ne sont pas des tables protégées.

    Vous disposez du rôle Foundry User sur proj-loans. Vous lancez un travail de création d'un jeu de données d'évaluation à partir des traces de l'agent, mais le service ne parvient pas à interroger les traces.

    Vous devez résoudre le problème. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Monitoring Contributor role on appi-loans to the managed identity of proj-loans.", fr: "Attribuer le rôle Monitoring Contributor sur appi-loans à l'identité managée de proj-loans." } }
    - { id: b, text: { en: "Assign the Foundry Owner role on proj-loans to your user account.", fr: "Attribuer le rôle Foundry Owner sur proj-loans à votre compte d'utilisateur." } }
    - { id: c, text: { en: "Assign the Reader role on appi-loans to the managed identity of proj-loans.", fr: "Attribuer le rôle Reader sur appi-loans à l'identité managée de proj-loans." } }
    - { id: d, text: { en: "Assign the Privileged Monitoring Data Reader role on appi-loans to your user account.", fr: "Attribuer le rôle Privileged Monitoring Data Reader sur appi-loans à votre compte d'utilisateur." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The service queries traces with the project's managed identity, which needs the Reader role on the connected Application Insights resource. Your Foundry User role on the project already covers starting the job.
    fr: |
      Le service interroge les traces avec l'identité managée du projet, qui a besoin du rôle Reader sur la ressource Application Insights connectée. Votre rôle Foundry User sur le projet suffit déjà pour lancer le travail.
  options:
    a: { en: "Monitoring Contributor grants write permissions on monitoring settings that the job doesn't need.", fr: "Monitoring Contributor accorde des autorisations d'écriture sur les paramètres de supervision dont le travail n'a pas besoin." }
    b: { en: "The job runs with the project's managed identity, and Foundry User or higher is already enough on the project.", fr: "Le travail s'exécute avec l'identité managée du projet, et Foundry User ou un rôle supérieur suffit déjà sur le projet." }
    d: { en: "Privileged Monitoring Data Reader is needed only for protected tables, and it must go to the project's managed identity.", fr: "Privileged Monitoring Data Reader n'est nécessaire que pour des tables protégées, et il doit être attribué à l'identité managée du projet." }
references:
  - title: Convert agent traces into evaluation datasets
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/traces-to-dataset
