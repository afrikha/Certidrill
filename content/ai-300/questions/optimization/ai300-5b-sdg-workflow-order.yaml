id: ai300-5b-sdg-workflow-order
objective: "5.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam wants to fine-tune gpt-4.1-mini on synthetic question and answer pairs generated from an export of its internal wiki. The export contains navigation menus and employee contact details. The team also has 300 real customer questions with approved answers.

    You need to produce the training data while avoiding unnecessary generation cost, and then train a model that generalizes to real questions.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam souhaite effectuer le réglage précis de gpt-4.1-mini sur des paires question-réponse synthétiques générées à partir d'un export de son wiki interne. L'export contient des menus de navigation et les coordonnées des employés. L'équipe dispose aussi de 300 questions réelles de clients avec des réponses approuvées.

    Vous devez produire les données d'entraînement en évitant les coûts de génération inutiles, puis entraîner un modèle qui se généralise aux questions réelles.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: clean, text: { en: "Remove the navigation menus and the personal data from the reference file.", fr: "Supprimer les menus de navigation et les données personnelles du fichier de référence." } }
    - { id: small, text: { en: "Generate a small sample of 50 examples.", fr: "Générer un petit échantillon de 50 exemples." } }
    - { id: review, text: { en: "Review the sample outputs and adjust the reference file or the parameters.", fr: "Examiner les exemples générés et ajuster le fichier de référence ou les paramètres." } }
    - { id: full, text: { en: "Generate the full dataset with the 80/20 train and validation split.", fr: "Générer le jeu de données complet avec la répartition 80/20 entre entraînement et validation." } }
    - { id: train, text: { en: "Fine-tune on the synthetic training data combined with part of the real questions.", fr: "Effectuer le réglage précis sur les données d'entraînement synthétiques combinées à une partie des questions réelles." } }
    - { id: raise, text: { en: "Set a larger learning rate multiplier than for real data.", fr: "Définir un multiplicateur de taux d'apprentissage plus grand que pour des données réelles." } }
    - { id: merge, text: { en: "Add the generated validation examples to the training file.", fr: "Ajouter les exemples de validation générés au fichier d'entraînement." } }
answer:
  sequence: [ clean, small, review, full, train ]
explanation:
  correct:
    en: |
      Microsoft recommends a clean reference file without boilerplate such as navigation menus and without personal or sensitive data. Start small, review the outputs and adjust before scaling up to avoid unnecessary cost. Blending part of the real data with the synthetic data can improve generalization.
    fr: |
      Microsoft recommande un fichier de référence propre, sans contenu répétitif comme les menus de navigation et sans données personnelles ou sensibles. Commencez petit, examinez les résultats et ajustez avant de monter en charge pour éviter des coûts inutiles. Mélanger une partie des données réelles aux données synthétiques peut améliorer la généralisation.
  options:
    raise: { en: "Microsoft recommends a smaller learning rate with synthetic data to curb overfitting.", fr: "Microsoft recommande un taux d'apprentissage plus petit avec des données synthétiques pour limiter le surajustement." }
    merge: { en: "Validation data must stay separate from training data; otherwise validation metrics no longer measure generalization.", fr: "Les données de validation doivent rester séparées des données d'entraînement ; sinon, les métriques de validation ne mesurent plus la généralisation." }
references:
  - title: Generate synthetic data for fine-tuning in Microsoft Foundry (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/fine-tuning/data-generation
