id: ai300-5b-delete-old-deployment
objective: "5.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank serves version 2 of a fine-tuned model from a Standard deployment named **ft-v2**. The application no longer sends any request to **ft-v1**, the Standard deployment of version 1.

    You need to stop all the charges related to ft-v1. The solution must keep the fine-tuning job history.

    What should you do?
  fr: |
    Woodgrove Bank sert la version 2 d'un modèle ajusté à partir d'un déploiement Standard nommé **ft-v2**. L'application n'envoie plus aucune requête à **ft-v1**, le déploiement Standard de la version 1.

    Vous devez arrêter tous les frais liés à ft-v1. La solution doit conserver l'historique des travaux de réglage précis.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Delete the ft-v1 deployment.", fr: "Supprimer le déploiement ft-v1." } }
    - { id: b, text: { en: "Cancel the fine-tuning job that produced version 1.", fr: "Annuler le travail de réglage précis qui a produit la version 1." } }
    - { id: c, text: { en: "Delete the training and validation files of version 1.", fr: "Supprimer les fichiers d'entraînement et de validation de la version 1." } }
    - { id: d, text: { en: "Keep ft-v1, because a deployment without requests isn't billed.", fr: "Conserver ft-v1, car un déploiement sans requêtes n'est pas facturé." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Standard deployment of a fine-tuned model bills an hourly hosting fee while it exists, even without traffic. Deleting the deployment from the Models page stops that charge and leaves the job records intact.
    fr: |
      Un déploiement Standard d'un modèle ajusté facture des frais d'hébergement horaires tant qu'il existe, même sans trafic. Supprimer le déploiement depuis la page Models arrête ces frais et laisse intacts les enregistrements des travaux.
  options:
    b: { en: "Cancelling a job never deletes its deployments or stops their charges.", fr: "L'annulation d'un travail ne supprime jamais ses déploiements et n'arrête pas leurs frais." }
    c: { en: "Files are deleted separately from deployments; the hosting fee of ft-v1 continues.", fr: "Les fichiers sont supprimés indépendamment des déploiements ; les frais d'hébergement de ft-v1 continuent." }
    d: { en: "The hourly hosting fee applies whether or not the deployment receives requests.", fr: "Les frais d'hébergement horaires s'appliquent que le déploiement reçoive des requêtes ou non." }
references:
  - title: Manage fine-tuning costs in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-cost-management
  - title: Deploy fine-tuned models in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-deploy
