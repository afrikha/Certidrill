id: ai300-5b-developer-training
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys runs many short supervised fine-tuning experiments of gpt-4.1-nano in a Microsoft Foundry project to compare data preparation options.

    The experiments have no data residency requirement and no deadline, and they can tolerate jobs that are interrupted and resumed later. You need to minimize the training cost of the experiments.

    Which training type should you use?
  fr: |
    Wingtip Toys exécute de nombreuses expériences courtes de réglage précis supervisé de gpt-4.1-nano dans un projet Microsoft Foundry pour comparer des options de préparation des données.

    Les expériences n'ont ni exigence de résidence des données ni échéance, et elles tolèrent des travaux interrompus puis repris plus tard. Vous devez réduire au minimum le coût d'entraînement des expériences.

    Quel type d'entraînement devez-vous utiliser ?
body:
  options:
    - { id: a, text: Global }
    - { id: b, text: Developer }
    - { id: c, text: Standard }
    - { id: d, text: Data zone }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Developer training type has the lowest cost because it uses idle capacity. Jobs can be preempted and resumed later, and paused jobs aren't billed, with no latency, SLA or data residency guarantee, which makes it the type intended for experimentation.
    fr: |
      Le type d'entraînement Developer a le coût le plus bas, car il utilise de la capacité inutilisée. Les travaux peuvent être préemptés puis repris, les travaux en pause ne sont pas facturés, et il n'offre aucune garantie de latence, de SLA ni de résidence des données : c'est le type prévu pour l'expérimentation.
  options:
    a: { en: "Global training is cheaper than Standard, but Developer training is the lowest-cost type.", fr: "L'entraînement Global est moins cher que Standard, mais l'entraînement Developer est le type le moins coûteux." }
    c: { en: "Standard training guarantees data residency in the resource's region, which isn't needed and costs more.", fr: "L'entraînement Standard garantit la résidence des données dans la région de la ressource, ce qui n'est pas requis et coûte plus cher." }
    d: { en: "Data zone training keeps data within the US data zone; it isn't the lowest-cost option.", fr: "L'entraînement Data zone conserve les données dans la zone de données US ; ce n'est pas l'option la moins coûteuse." }
references:
  - title: Fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
  - title: Manage fine-tuning costs in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-cost-management
