id: ai300-5b-dataset-statements
objective: "5.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses the Data Generation tab of a Microsoft Foundry project to create fine-tuning data with synthetic data generation (preview) and evaluation datasets from agent traces.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise l'onglet Data Generation d'un projet Microsoft Foundry pour créer des données de réglage précis avec la génération de données synthétiques (préversion) et des jeux de données d'évaluation à partir des traces d'agents.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The Simple Q&A generator accepts an OpenAPI specification in JSON as its reference file."
        fr: "Le générateur Simple Q&A accepte une spécification OpenAPI au format JSON comme fichier de référence."
    - id: s2
      text:
        en: "Records produced by the Tool use generator contain `tool` messages that reference a `tool_call_id`."
        fr: "Les enregistrements produits par le générateur Tool use contiennent des messages `tool` qui font référence à un `tool_call_id`."
    - id: s3
      text:
        en: "A traces job that has `max_samples` set to 500 can produce a dataset with fewer than 500 rows."
        fr: "Un travail de traces dont `max_samples` est défini sur 500 peut produire un jeu de données de moins de 500 lignes."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Simple Q&A takes a PDF, Markdown or plain text document; the OpenAPI specification is the reference of the Tool use generator. Tool use records contain assistant `tool_calls` and `tool` messages with `content` and `tool_call_id`, plus a `tools` array. For traces, `max_samples` is a ceiling, not a guarantee: the window can lack enough distinct, high-quality traces.
    fr: |
      Simple Q&A prend un document PDF, Markdown ou texte brut ; la spécification OpenAPI est la référence du générateur Tool use. Les enregistrements Tool use contiennent des `tool_calls` de l'assistant et des messages `tool` avec `content` et `tool_call_id`, ainsi qu'un tableau `tools`. Pour les traces, `max_samples` est un plafond, pas une garantie : la période peut manquer de traces distinctes et de qualité.
references:
  - title: Generate synthetic data for fine-tuning in Microsoft Foundry (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/fine-tuning/data-generation
  - title: Convert agent traces into evaluation datasets
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/traces-to-dataset
