id: ai300-cs3c-synthetic-data
objective: "5.2.2"
type: yesno_statements
caseStudy: ai300-cs3c-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You plan to use the **Data Generation (preview)** page of proj-barista to meet Barista Assist requirement 4.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser la page **Data Generation (preview)** de proj-barista pour respecter l'exigence 4 de Barista Assist.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can upload the three PDF files of the Store Operations Handbook as the references of a single generation job.
        fr: |
          Vous pouvez charger les trois fichiers PDF du Store Operations Handbook comme références d'un même travail de génération.
    - id: s2
      text:
        en: |
          The generation job can split the generated examples into training data and validation data.
        fr: |
          Le travail de génération peut répartir les exemples générés entre données d'entraînement et données de validation.
    - id: s3
      text:
        en: |
          The members of the AI team can run the generation job with their current role assignment.
        fr: |
          Les membres de l'équipe IA peuvent exécuter le travail de génération avec leur attribution de rôle actuelle.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The preview supports only one reference file per job, so the team must combine the three PDF files into one file, which stays under the 20 MB limit. The Simple Q&A generator, with the Short answer question type, can apply an automatic 80/20 train-validation split. Foundry User on the Foundry resource is the minimum role for generation, and the generator model is already deployed, so the team doesn't need Foundry Owner.
    fr: |
      La préversion ne prend en charge qu'un fichier de référence par travail : l'équipe doit fusionner les trois fichiers PDF en un seul, qui reste sous la limite de 20 Mo. Le générateur Simple Q&A, avec le type de question Short answer, peut appliquer une répartition automatique 80/20 entre entraînement et validation. Foundry User sur la ressource Foundry est le rôle minimal pour la génération, et le modèle générateur est déjà déployé : l'équipe n'a pas besoin de Foundry Owner.
references:
  - title: Generate synthetic data with Microsoft Foundry (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/fine-tuning/data-generation
