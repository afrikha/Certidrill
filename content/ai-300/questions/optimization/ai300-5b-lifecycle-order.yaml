id: ai300-5b-lifecycle-order
objective: "5.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware wants to put a fine-tuned gpt-4.1-mini model into production in a Microsoft Foundry project hosted in Sweden Central. The team has 4,000 labeled examples.

    Production must keep inferencing in the resource's Azure geography. The evaluation must cost as little as possible and compare the model with the current base model and prompt.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware souhaite mettre en production un modèle gpt-4.1-mini ajusté dans un projet Microsoft Foundry hébergé dans la région Sweden Central. L'équipe dispose de 4 000 exemples étiquetés.

    La production doit conserver l'inférence dans la zone géographique Azure de la ressource. L'évaluation doit coûter le moins possible et comparer le modèle au modèle de base et à l'invite actuels.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: split, text: { en: "Split the examples into separate training, validation, and test sets.", fr: "Répartir les exemples en jeux distincts d'entraînement, de validation et de test." } }
    - { id: train, text: { en: "Run the fine-tuning job with the validation file and a suffix that identifies the version.", fr: "Exécuter le travail de réglage précis avec le fichier de validation et un suffixe qui identifie la version." } }
    - { id: select, text: { en: "Select the checkpoint that has the best validation results.", fr: "Sélectionner le point de contrôle qui a les meilleurs résultats de validation." } }
    - { id: evaluate, text: { en: "Deploy the selected model as a Developer deployment and evaluate it against the baseline on the test set.", fr: "Déployer le modèle sélectionné dans un déploiement Developer et l'évaluer par rapport à la référence sur le jeu de test." } }
    - { id: prod, text: { en: "Create a Standard deployment of the model for production.", fr: "Créer un déploiement Standard du modèle pour la production." } }
    - { id: ptu, text: { en: "Deploy the latest checkpoint to a provisioned deployment for the evaluation.", fr: "Déployer le dernier point de contrôle dans un déploiement approvisionné pour l'évaluation." } }
    - { id: cancel, text: { en: "Cancel the fine-tuning job to stop the hosting charges of the Developer deployment.", fr: "Annuler le travail de réglage précis pour arrêter les frais d'hébergement du déploiement Developer." } }
answer:
  sequence: [ split, train, select, evaluate, prod ]
explanation:
  correct:
    en: |
      Keep training, validation and test data separate, train, and choose the checkpoint on validation results rather than assuming the latest is best. A Developer deployment evaluates the model with no hourly hosting fee before a production deployment. A Standard deployment keeps inferencing in the resource's geography.
    fr: |
      Gardez séparées les données d'entraînement, de validation et de test, entraînez, puis choisissez le point de contrôle sur les résultats de validation au lieu de supposer que le dernier est le meilleur. Un déploiement Developer permet d'évaluer le modèle sans frais d'hébergement horaires avant un déploiement de production. Un déploiement Standard conserve l'inférence dans la zone géographique de la ressource.
  options:
    ptu: { en: "A provisioned deployment bills PTU-hours, which is costly for an evaluation, and the latest checkpoint isn't necessarily the best.", fr: "Un déploiement approvisionné facture des heures de PTU, ce qui est coûteux pour une évaluation, et le dernier point de contrôle n'est pas forcément le meilleur." }
    cancel: { en: "Developer deployments have no hourly hosting fee, and cancelling a job never deletes deployments or stops their charges.", fr: "Les déploiements Developer n'ont pas de frais d'hébergement horaires, et l'annulation d'un travail ne supprime jamais les déploiements ni n'arrête leurs frais." }
references:
  - title: Training in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
  - title: Manage fine-tuning costs in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-cost-management
