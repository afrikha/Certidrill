id: ai300-cs2c-chunking-split
objective: "5.1.1"
type: dropdown
caseStudy: ai300-cs2c-adventure-works
difficulty: 2
status: draft
stem:
  en: |
    You need to modify the Text Split skill of idx-manuals to meet retrieval requirement 1.

    How should you complete the skill definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez modifier la compétence Text Split d'idx-manuals pour respecter l'exigence de récupération 1.

    Comment devez-vous compléter la définition de la compétence ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "@odata.type": "#Microsoft.Skills.Text.SplitSkill",
      "textSplitMode": "pages",
      "unit": [[unit]],
      "maximumPageLength": 512,
      "pageOverlapLength": [[overlap]],
      "azureOpenAITokenizerParameters": {
        "encoderModelName": "cl100k_base"
      },
      "inputs": [ { "name": "text", "source": "/document/content" } ],
      "outputs": [ { "name": "textItems", "targetName": "pages" } ]
    }
  slots:
    - id: unit
      options:
        - { id: chars, text: "\"characters\"" }
        - { id: tokens, text: "\"azureOpenAITokens\"" }
        - { id: sentences, text: "\"sentences\"" }
    - id: overlap
      options:
        - { id: o0, text: "0" }
        - { id: o100, text: "100" }
        - { id: o600, text: "600" }
answer:
  values: { unit: tokens, overlap: o100 }
explanation:
  correct:
    en: "With the `azureOpenAITokens` unit (preview), `maximumPageLength` and `pageOverlapLength` are counted in tokens of the tokenizer set in `azureOpenAITokenizerParameters`, so 512 means about 512 tokens. A `pageOverlapLength` of 100 starts each chunk with the last 100 tokens of the previous one, so steps cut at a boundary also appear in the next chunk."
    fr: "Avec l'unité `azureOpenAITokens` (préversion), `maximumPageLength` et `pageOverlapLength` sont comptés en jetons du générateur de jetons défini dans `azureOpenAITokenizerParameters` : 512 correspond donc à environ 512 jetons. Un `pageOverlapLength` de 100 fait commencer chaque bloc par les 100 derniers jetons du bloc précédent : les étapes coupées à une limite figurent aussi dans le bloc suivant."
  options:
    chars: { en: "With characters, 512 would mean 512 characters, not about 512 tokens.", fr: "Avec characters, 512 signifierait 512 caractères, et non environ 512 jetons." }
    sentences: { en: "sentences is a value of textSplitMode, not of unit.", fr: "sentences est une valeur de textSplitMode, pas de unit." }
    o0: { en: "0 means no overlap, which keeps the current problem of missing steps.", fr: "0 signifie aucun chevauchement, ce qui conserve le problème actuel des étapes manquantes." }
    o600: { en: "An overlap longer than the 512-token chunk itself cannot be a part of the chunk's text.", fr: "Un chevauchement plus long que le bloc de 512 jetons lui-même ne peut pas être une partie du texte du bloc." }
references:
  - title: Text Split skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-textsplit
