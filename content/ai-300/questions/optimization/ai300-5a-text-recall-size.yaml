id: ai300-5a-text-recall-size
objective: "5.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Proseware sends hybrid queries to an Azure AI Search index that contains millions of short chunks. Analysis with labeled queries shows that relevant keyword matches are often ranked beyond the default number of BM25 results that enter Reciprocal Rank Fusion (RRF). The user interface displays facet counts next to the results.

    You need to modify the query so that:

    - 5,000 BM25-ranked results are provided to RRF;
    - the counts and facets are computed only on the documents retrieved for ranking, not on every document that matches the text query.

    How should you complete the request? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware envoie des requêtes hybrides à un index Azure AI Search qui contient des millions de blocs courts. Une analyse avec des requêtes étiquetées montre que des correspondances pertinentes par mots clés sont souvent classées au-delà du nombre par défaut de résultats BM25 qui entrent dans Reciprocal Rank Fusion (RRF). L'interface utilisateur affiche des nombres de facettes à côté des résultats.

    Vous devez modifier la requête de sorte que :

    - 5 000 résultats classés par BM25 soient fournis à RRF ;
    - les nombres et les facettes soient calculés uniquement sur les documents récupérés pour le classement, et non sur tous les documents qui correspondent à la requête texte.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    POST https://srch-proseware.search.windows.net/indexes/docs-idx/docs/search?api-version=2026-08-01-preview
    {
      "search": "invoice dispute escalation steps",
      "vectorQueries": [
        { "kind": "text", "text": "invoice dispute escalation steps", "fields": "chunkVector", "k": 50 }
      ],
      "count": true,
      "facets": [ "department" ],
      [[obj]]: {
        "maxTextRecallSize": [[size]],
        "countAndFacetMode": [[mode]]
      }
    }
  slots:
    - id: obj
      options:
        - { id: hybrid, text: '"hybridSearch"' }
        - { id: semantic, text: '"semanticConfiguration"' }
        - { id: vectorsearch, text: '"vectorSearch"' }
    - id: size
      options:
        - { id: s1000, text: "1000" }
        - { id: s5000, text: "5000" }
        - { id: s50000, text: "50000" }
    - id: mode
      options:
        - { id: all, text: '"countAllResults"' }
        - { id: retrievable, text: '"countRetrievableResults"' }
answer:
  values: { obj: hybrid, size: s5000, mode: retrievable }
explanation:
  correct:
    en: |
      The `hybridSearch` object (preview) of a query sets `maxTextRecallSize`, the number of BM25-ranked results provided to RRF (default 1,000, maximum 10,000), here 5,000. `countAndFacetMode` set to `countRetrievableResults` scopes the count and facets to the documents retrieved for ranking, which are the `maxTextRecallSize` BM25 results and the `k` vector matches.
    fr: |
      L'objet `hybridSearch` (préversion) d'une requête définit `maxTextRecallSize`, le nombre de résultats classés par BM25 fournis à RRF (1 000 par défaut, 10 000 au maximum), ici 5 000. `countAndFacetMode` défini sur `countRetrievableResults` limite le nombre et les facettes aux documents récupérés pour le classement, c'est-à-dire les `maxTextRecallSize` résultats BM25 et les `k` correspondances vectorielles.
  options:
    semantic:
      en: |
        semanticConfiguration is a string that names the semantic configuration of the index; it doesn't hold hybrid recall settings.
      fr: |
        semanticConfiguration est une chaîne qui nomme la configuration sémantique de l'index ; elle ne contient pas de paramètres de rappel hybride.
    vectorsearch:
      en: |
        vectorSearch is a section of the index definition (algorithms, profiles), not a query parameter.
      fr: |
        vectorSearch est une section de la définition de l'index (algorithmes, profils), pas un paramètre de requête.
    s1000:
      en: |
        1,000 is the default, which is the value that is too small here.
      fr: |
        1 000 est la valeur par défaut, justement trop faible ici.
    s50000:
      en: |
        The maximum value of maxTextRecallSize is 10,000.
      fr: |
        La valeur maximale de maxTextRecallSize est 10 000.
    all:
      en: |
        countAllResults, the default, counts every document that matches the text query, even those outside the maxTextRecallSize window.
      fr: |
        countAllResults, la valeur par défaut, compte tous les documents qui correspondent à la requête texte, même ceux situés hors de la fenêtre maxTextRecallSize.
references:
  - title: Create a hybrid query in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-how-to-query
  - title: Relevance scoring in hybrid search using Reciprocal Rank Fusion (RRF)
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-ranking
