id: ai300-5a-text-recall-size
objective: "5.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Proseware sends hybrid queries to an Azure AI Search index named **docs-idx**. The index has two HNSW vector fields, **titleVector** and **contentVector**, embedded with the same model, and each field has a vectorizer for that model.

    To measure the recall of HNSW, you need a hybrid query in which:

    - one vector query searches both vector fields;
    - the vector side returns the exact nearest neighbors instead of approximate ones;
    - the results stay ranked by relevance and return only the title and content fields.

    How should you complete the request? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware envoie des requêtes hybrides à un index Azure AI Search nommé **docs-idx**. L'index comporte deux champs vectoriels HNSW, **titleVector** et **contentVector**, incorporés avec le même modèle, et chaque champ dispose d'un vectoriseur pour ce modèle.

    Pour mesurer le rappel de HNSW, vous avez besoin d'une requête hybride dans laquelle :

    - une seule requête vectorielle interroge les deux champs vectoriels ;
    - la partie vectorielle renvoie les plus proches voisins exacts plutôt qu'approximatifs ;
    - les résultats restent classés par pertinence et ne renvoient que les champs title et content.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "search": "invoice dispute escalation steps",
      "vectorQueries": [
        {
          "kind": "text",
          "text": "invoice dispute escalation steps",
          "fields": [[fields]],
          [[exh]],
          "k": 50
        }
      ],
      [[ret]],
      "top": 10
    }
  slots:
    - id: fields
      options:
        - { id: both, text: '"titleVector, contentVector"' }
        - { id: title, text: '"titleVector"' }
        - { id: content, text: '"contentVector"' }
    - id: exh
      options:
        - { id: exhtrue, text: '"exhaustive": true' }
        - { id: exhfalse, text: '"exhaustive": false' }
        - { id: weight0, text: '"weight": 0' }
    - id: ret
      options:
        - { id: select, text: '"select": "title, content"' }
        - { id: searchfields, text: '"searchFields": "title, content"' }
        - { id: orderby, text: '"orderby": "title asc"' }
answer:
  values: { fields: both, exh: exhtrue, ret: select }
explanation:
  correct:
    en: |
      `vectorQueries.fields` accepts a comma-separated list of up to 10 vector fields, and the vector query runs against each of them; all must contain embeddings from the same model. `exhaustive` set to `true` invokes exhaustive KNN at query time even on an HNSW field, which returns the exact nearest neighbors and can serve as ground truth for the recall of the approximate search. `select` limits the returned fields without changing the relevance ranking.
    fr: |
      `vectorQueries.fields` accepte une liste de 10 champs vectoriels au plus, séparés par des virgules, et la requête vectorielle s'exécute sur chacun d'eux ; tous doivent contenir des incorporations du même modèle. `exhaustive` défini sur `true` appelle le KNN exhaustif au moment de la requête, même sur un champ HNSW : il renvoie les plus proches voisins exacts et peut servir de référence pour mesurer le rappel de la recherche approximative. `select` limite les champs renvoyés sans changer le classement par pertinence.
  options:
    title:
      en: |
        A single field leaves contentVector out of the vector side.
      fr: |
        Un seul champ exclut contentVector de la partie vectorielle.
    content:
      en: |
        A single field leaves titleVector out of the vector side.
      fr: |
        Un seul champ exclut titleVector de la partie vectorielle.
    exhfalse:
      en: |
        With exhaustive set to false, the HNSW field is searched with the approximate algorithm.
      fr: |
        Avec exhaustive défini sur false, le champ HNSW est interrogé avec l'algorithme approximatif.
    weight0:
      en: |
        The weight of a vector query must be greater than zero, and weight changes the fusion, not the search algorithm.
      fr: |
        Le poids d'une requête vectorielle doit être supérieur à zéro, et il modifie la fusion, pas l'algorithme de recherche.
    searchfields:
      en: |
        searchFields restricts the fields that the full-text query searches; it doesn't limit the fields returned.
      fr: |
        searchFields limite les champs qu'interroge la requête en texte intégral ; il ne limite pas les champs renvoyés.
    orderby:
      en: |
        An explicit sort replaces the relevance ranking of the hybrid results.
      fr: |
        Un tri explicite remplace le classement par pertinence des résultats hybrides.
references:
  - title: Create a vector query in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-query
  - title: Relevance in vector search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-ranking
