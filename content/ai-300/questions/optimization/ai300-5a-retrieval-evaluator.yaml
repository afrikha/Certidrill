id: ai300-5a-retrieval-evaluator
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a RAG application in a Microsoft Foundry project. You export production traffic to a test dataset in which each row contains `query` and `context`, the chunks retrieved for the query. The dataset has no ground truth and no relevance labels.

    You need a built-in evaluator that scores how relevant the retrieved chunks are to each query, so that you can compare two chunking strategies.

    Which evaluator should you use?
  fr: |
    Contoso dispose d'une application RAG dans un projet Microsoft Foundry. Vous exportez du trafic de production dans un jeu de données de test dont chaque ligne contient `query` et `context`, les blocs récupérés pour la requête. Le jeu de données ne contient ni vérité terrain ni étiquettes de pertinence.

    Vous avez besoin d'un évaluateur intégré qui note la pertinence des blocs récupérés par rapport à chaque requête, afin de comparer deux stratégies de segmentation.

    Quel évaluateur devez-vous utiliser ?
body:
  options:
    - { id: a, text: Retrieval }
    - { id: b, text: Relevance }
    - { id: c, text: Document Retrieval }
    - { id: d, text: Groundedness }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Retrieval evaluator (`builtin.retrieval`) uses a judge model to score, from 1 to 5, how relevant the retrieved context chunks are to the query. It needs only `query` and `context`, with no ground truth, which matches this dataset.
    fr: |
      L'évaluateur Retrieval (`builtin.retrieval`) utilise un modèle juge pour noter de 1 à 5 la pertinence des blocs de contexte récupérés par rapport à la requête. Il n'a besoin que de `query` et `context`, sans vérité terrain, ce qui correspond à ce jeu de données.
  options:
    d:
      en: |
        Groundedness evaluates the response, checking that it stays within the context; it doesn't score the retrieved chunks against the query.
      fr: |
        Groundedness évalue la réponse en vérifiant qu'elle reste dans les limites du contexte ; il ne note pas les blocs récupérés par rapport à la requête.
    b:
      en: |
        Relevance evaluates how well the response answers the query; it needs a response, not the retrieved chunks.
      fr: |
        Relevance évalue dans quelle mesure la réponse répond à la requête ; il a besoin d'une réponse, pas des blocs récupérés.
    c:
      en: |
        Document Retrieval compares retrieved documents with human relevance labels (`retrieval_ground_truth`), which this dataset doesn't contain.
      fr: |
        Document Retrieval compare les documents récupérés à des étiquettes de pertinence humaines (`retrieval_ground_truth`), que ce jeu de données ne contient pas.
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
