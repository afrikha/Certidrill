id: ai300-cs3c-grader-method
objective: "5.2.1"
type: single
caseStudy: ai300-cs3c-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You need to improve the answers of Barista Assist to the recipe-scaling questions by fine-tuning a model. The solution must meet Barista Assist requirement 5.

    What should you do?
  fr: |
    Vous devez améliorer les réponses de Barista Assist aux questions d'adaptation de recettes en ajustant un modèle. La solution doit respecter l'exigence 5 de Barista Assist.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Fine-tune gpt-4.1-mini with supervised fine-tuning (SFT).", fr: "Ajuster gpt-4.1-mini par réglage précis supervisé (SFT)." } }
    - { id: b, text: { en: "Fine-tune gpt-4.1-mini with direct preference optimization (DPO).", fr: "Ajuster gpt-4.1-mini par optimisation directe des préférences (DPO)." } }
    - { id: c, text: { en: "Fine-tune gpt-4.1-mini with reinforcement fine-tuning (RFT).", fr: "Ajuster gpt-4.1-mini par réglage précis par renforcement (RFT)." } }
    - { id: d, text: { en: "Fine-tune o4-mini with reinforcement fine-tuning (RFT).", fr: "Ajuster o4-mini par réglage précis par renforcement (RFT)." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      RFT trains on prompts plus a grader that scores the generated responses, which matches questions without reference answers and the Python grader. It suits tasks where quality can be scored reliably. o4-mini supports RFT; gpt-4.1-mini doesn't.
    fr: |
      RFT s'entraîne sur des invites et un correcteur (grader) qui note les réponses générées, ce qui correspond à des questions sans réponses de référence et au correcteur Python. Cette méthode convient aux tâches dont la qualité peut être notée de façon fiable. o4-mini prend en charge RFT ; gpt-4.1-mini non.
  options:
    a:
      en: |
        SFT needs prompts with the desired responses, and the team has no reference answers.
      fr: |
        SFT a besoin d'invites accompagnées des réponses souhaitées, et l'équipe n'a pas de réponses de référence.
    b:
      en: |
        DPO needs a preferred and a rejected response for each input; the team has a grader, not preference pairs.
      fr: |
        DPO a besoin d'une réponse préférée et d'une réponse rejetée pour chaque entrée ; l'équipe dispose d'un correcteur, pas de paires de préférences.
    c:
      en: |
        RFT is the right method, but gpt-4.1-mini isn't among the models that support it.
      fr: |
        RFT est la bonne méthode, mais gpt-4.1-mini ne fait pas partie des modèles qui la prennent en charge.
references:
  - title: Fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
