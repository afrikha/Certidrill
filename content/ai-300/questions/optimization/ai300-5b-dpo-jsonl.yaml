id: ai300-5b-dpo-jsonl
objective: "5.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware fine-tunes gpt-4.1 with direct preference optimization (DPO) in a Microsoft Foundry project. For each prompt, reviewers kept the answer they prefer and the answer they reject.

    You are preparing the training file. The following line is shown on several lines for readability.

    How should you complete the line? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware effectue le réglage précis de gpt-4.1 par optimisation directe des préférences (DPO) dans un projet Microsoft Foundry. Pour chaque invite, des relecteurs ont conservé la réponse qu'ils préfèrent et celle qu'ils rejettent.

    Vous préparez le fichier d'entraînement. La ligne suivante est présentée sur plusieurs lignes pour plus de lisibilité.

    Comment devez-vous compléter la ligne ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      [[k1]]: {
        "messages": [
          {"role": "user", "content": "Explain the late-payment fee to a customer."}
        ]
      },
      [[k2]]: [
        {"role": "assistant", "content": "A 2% fee applies after 30 days. You can avoid it by enabling automatic payment."}
      ],
      [[k3]]: [
        {"role": "assistant", "content": "Fees apply. See the contract."}
      ]
    }
  slots:
    - id: k1
      options:
        - { id: input, text: "\"input\"" }
        - { id: prompt, text: "\"prompt\"" }
        - { id: item, text: "\"item\"" }
    - id: k2
      options:
        - { id: completion, text: "\"completion\"" }
        - { id: preferred, text: "\"preferred_output\"" }
        - { id: refans, text: "\"reference_answer\"" }
    - id: k3
      options:
        - { id: tools, text: "\"tools\"" }
        - { id: samplek, text: "\"sample\"" }
        - { id: nonpref, text: "\"non_preferred_output\"" }
answer:
  values: { k1: input, k2: preferred, k3: nonpref }
explanation:
  correct:
    en: |
      Each DPO example has three fields: `input`, which holds the `messages` array of the prompt, `preferred_output` with the preferred assistant response, and `non_preferred_output` with the rejected response to the same input. Both outputs contain at least one assistant message.
    fr: |
      Chaque exemple DPO comporte trois champs : `input`, qui contient le tableau `messages` de l'invite, `preferred_output` avec la réponse préférée de l'assistant, et `non_preferred_output` avec la réponse rejetée pour la même entrée. Les deux sorties contiennent au moins un message assistant.
  options:
    prompt: { en: "`prompt` belongs to the legacy prompt-completion format, not to DPO records.", fr: "`prompt` appartient à l'ancien format invite-complétion, pas aux enregistrements DPO." }
    item: { en: "`item` is how grader templates refer to a dataset record, not a key of the record.", fr: "`item` est la façon dont les modèles d'évaluateur désignent un enregistrement, pas une clé de l'enregistrement." }
    completion: { en: "`completion` is the legacy completion key and can't express a preference.", fr: "`completion` est l'ancienne clé de complétion et ne peut pas exprimer une préférence." }
    refans: { en: "`reference_answer` is an example field read by RFT graders.", fr: "`reference_answer` est un exemple de champ lu par les évaluateurs RFT." }
    tools: { en: "`tools` is optional and goes inside `input`; it doesn't hold the rejected response.", fr: "`tools` est facultatif et se place dans `input` ; il ne contient pas la réponse rejetée." }
    samplek: { en: "`sample` refers to the generated response in grader templates, not to a DPO field.", fr: "`sample` désigne la réponse générée dans les modèles d'évaluateur, pas un champ DPO." }
references:
  - title: Fine-tune a model with direct preference optimization in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-direct-preference-optimization
