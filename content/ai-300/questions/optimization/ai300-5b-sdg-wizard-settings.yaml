id: ai300-5b-sdg-wizard-settings
objective: "5.2.2"
type: dropdown
difficulty: 1
shuffle: false
status: draft
stem:
  en: |
    Contoso has a 6 MB PDF policy guide. You plan to use **Data Generation (preview)** in a Microsoft Foundry project to create 2,000 question and answer examples for supervised fine-tuning.

    The answers must be brief and factual. You must use as few generation jobs as possible.

    How should you configure the generation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un guide des politiques au format PDF de 6 Mo. Vous prévoyez d'utiliser **Data Generation (preview)** dans un projet Microsoft Foundry pour créer 2 000 exemples de questions-réponses destinés au réglage précis supervisé.

    Les réponses doivent être brèves et factuelles. Vous devez utiliser le moins de travaux de génération possible.

    Comment devez-vous configurer la génération ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Task type: [[task]]

      Question type: [[qtype]]

      Number of generation jobs: [[jobs]]
    fr: |
      Type de tâche : [[task]]

      Type de question : [[qtype]]

      Nombre de travaux de génération : [[jobs]]
  slots:
    - id: task
      options:
        - { id: qa, text: Simple Q&A }
        - { id: tool, text: Tool use }
    - id: qtype
      options:
        - { id: long, text: Long answer }
        - { id: short, text: Short answer }
    - id: jobs
      options:
        - { id: one, text: "1" }
        - { id: two, text: "2" }
        - { id: four, text: "4" }
        - { id: twenty, text: "20" }
answer:
  values: { task: qa, qtype: short, jobs: two }
explanation:
  correct:
    en: |
      Simple Q&A turns a domain document (PDF, Markdown or text, under 20 MB) into question and answer pairs. The Short answer question type focuses on factual brevity, while Long answer elicits analytical reasoning. A job generates 50 to 1,000 samples, so 2,000 examples need at least two jobs.
    fr: |
      Simple Q&A transforme un document métier (PDF, Markdown ou texte, de moins de 20 Mo) en paires question-réponse. Le type de question Short answer privilégie des réponses factuelles et brèves, tandis que Long answer suscite un raisonnement analytique. Un travail génère de 50 à 1 000 exemples : 2 000 exemples exigent au moins deux travaux.
  options:
    tool: { en: "Tool use needs an OpenAPI specification in JSON and produces tool-calling conversations.", fr: "Tool use nécessite une spécification OpenAPI au format JSON et produit des conversations avec appels d'outils." }
    long: { en: "Long answer produces analytical answers, not brief factual ones.", fr: "Long answer produit des réponses analytiques, pas des réponses factuelles brèves." }
    one: { en: "One job can generate at most 1,000 samples.", fr: "Un travail peut générer au maximum 1 000 exemples." }
    four: { en: "Four jobs work but aren't the minimum, because each job can generate up to 1,000 samples.", fr: "Quatre travaux conviennent mais ne constituent pas le minimum, car chaque travail peut générer jusqu'à 1 000 exemples." }
    twenty: { en: "100 samples per job isn't a limit; a job can generate up to 1,000 samples.", fr: "100 exemples par travail n'est pas une limite ; un travail peut générer jusqu'à 1 000 exemples." }
references:
  - title: Generate synthetic data for fine-tuning in Microsoft Foundry (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/fine-tuning/data-generation
