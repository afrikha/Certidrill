id: ai300-5b-method-dragdrop
objective: "5.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Foundry project and four customization requests from different teams. Each request specifies the data or the constraint that the team has.

    You need to choose the technique that best fits each request.

    Which technique should you use for each request? To answer, drag the appropriate techniques to the correct requests. Each technique may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un projet Microsoft Foundry et de quatre demandes de personnalisation émanant d'équipes différentes. Chaque demande précise les données ou la contrainte dont dispose l'équipe.

    Vous devez choisir la technique la plus adaptée à chaque demande.

    Quelle technique devez-vous utiliser pour chaque demande ? Pour répondre, faites glisser les techniques appropriées vers les demandes correspondantes. Chaque technique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sft, text: { en: "Supervised fine-tuning (SFT)", fr: "Réglage précis supervisé (SFT)" } }
    - { id: dpo, text: { en: "Direct preference optimization (DPO)", fr: "Optimisation directe des préférences (DPO)" } }
    - { id: rft, text: { en: "Reinforcement fine-tuning (RFT)", fr: "Réglage précis par renforcement (RFT)" } }
    - { id: rag, text: { en: "Retrieval-augmented generation (RAG)", fr: "Génération augmentée de récupération (RAG)" } }
    - { id: ptu, text: { en: "Provisioned throughput deployment", fr: "Déploiement à débit approvisionné" } }
  targets:
    - id: t1
      text: { en: "Answers must reflect a price list that changes every day.", fr: "Les réponses doivent refléter une liste de prix qui change tous les jours." }
    - id: t2
      text: { en: "Editors picked the better of two drafts for each of 2,000 prompts.", fr: "Des rédacteurs ont choisi le meilleur de deux brouillons pour chacune de 2 000 invites." }
    - id: t3
      text: { en: "A Python function scores contract-clause answers that can be worded in several valid ways.", fr: "Une fonction Python note des réponses d'extraction de clauses qui peuvent être formulées de plusieurs façons valides." }
    - id: t4
      text: { en: "gpt-4.1-nano must reproduce the triage answers that gpt-4.1 generated for 5,000 tickets.", fr: "gpt-4.1-nano doit reproduire les réponses de tri que gpt-4.1 a générées pour 5 000 tickets." }
answer:
  mapping: { t1: rag, t2: dpo, t3: rft, t4: sft }
explanation:
  correct:
    en: |
      Fine-tuning doesn't replace retrieval for information that changes over time, so the daily price list calls for RAG. Pairs of preferred and rejected drafts are the training signal of DPO. A scoring function for answers with several valid forms is an RFT grader. Distillation in Managed Training is SFT on responses generated by a larger teacher model.
    fr: |
      Le réglage précis ne remplace pas la récupération pour des informations qui évoluent : la liste de prix quotidienne exige RAG. Des paires de brouillons préférés et rejetés constituent le signal d'entraînement de DPO. Une fonction de notation pour des réponses aux formes valides multiples est un évaluateur (grader) RFT. En Managed Training, la distillation est un SFT sur des réponses générées par un modèle enseignant plus grand.
  options:
    ptu: { en: "A provisioned deployment reserves throughput; it doesn't change what the model knows or how it answers.", fr: "Un déploiement approvisionné réserve du débit ; il ne change ni ce que sait le modèle ni sa façon de répondre." }
references:
  - title: Training in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
