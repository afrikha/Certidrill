id: ai300-5b-managed-compute-prereqs
objective: "5.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware fine-tuned gpt-4.1-mini with Managed Training in a Microsoft Foundry project. An engineer who has the Foundry User role on the Foundry resource ran the training job. The engineer now wants to deploy the fine-tuned model as a Standard serverless deployment from the job's details view.

    Which two conditions must be met for the deployment to succeed? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware a ajusté gpt-4.1-mini avec Managed Training dans un projet Microsoft Foundry. Un ingénieur qui dispose du rôle Foundry User sur la ressource Foundry a exécuté le travail d'entraînement. L'ingénieur souhaite maintenant déployer le modèle ajusté comme déploiement serverless Standard depuis la vue des détails du travail.

    Quelles sont les deux conditions requises pour que le déploiement réussisse ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The engineer has Foundry Owner, or a role with Microsoft.CognitiveServices/accounts/deployments/write, on the target resource.", fr: "L'ingénieur dispose de Foundry Owner, ou d'un rôle avec Microsoft.CognitiveServices/accounts/deployments/write, sur la ressource cible." } }
    - { id: b, text: { en: "A base deployment of gpt-4.1-mini created from a LoRA-enabled deployment template exists in the project.", fr: "Un déploiement de base de gpt-4.1-mini créé à partir d'un modèle de déploiement compatible LoRA existe dans le projet." } }
    - { id: c, text: { en: "A Subscription Owner or Contributor has enabled Fireworks on Foundry for the subscription.", fr: "Un Subscription Owner ou Contributor a activé Fireworks on Foundry pour l'abonnement." } }
    - { id: d, text: { en: "The subscription has enough deployment quota for the Standard deployment type in a supported region.", fr: "L'abonnement dispose d'un quota de déploiement suffisant pour le type de déploiement Standard dans une région prise en charge." } }
    - { id: e, text: { en: "The training job is deleted, so that its checkpoints are released for deployment.", fr: "Le travail d'entraînement est supprimé, afin que ses points de contrôle soient libérés pour le déploiement." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Deploying a fine-tuned model requires the Foundry Owner role, or a role with `Microsoft.CognitiveServices/accounts/deployments/write` on the target resource; Foundry User is enough to train, not to deploy. A serverless deployment also needs a compatible deployment type and enough deployment quota in a supported region.
    fr: |
      Le déploiement d'un modèle ajusté exige le rôle Foundry Owner, ou un rôle avec `Microsoft.CognitiveServices/accounts/deployments/write` sur la ressource cible ; Foundry User suffit pour entraîner, pas pour déployer. Un déploiement serverless exige aussi un type de déploiement compatible et un quota de déploiement suffisant dans une région prise en charge.
  options:
    b: { en: "A LoRA-enabled base deployment is a prerequisite of the Managed compute option (preview), not of a serverless deployment.", fr: "Un déploiement de base compatible LoRA est un prérequis de l'option Managed compute (préversion), pas d'un déploiement serverless." }
    c: { en: "Enabling Fireworks on Foundry is needed only for the Fireworks on Foundry option (preview).", fr: "L'activation de Fireworks on Foundry n'est nécessaire que pour l'option Fireworks on Foundry (préversion)." }
    e: { en: "Deleting the training job isn't required; you deploy from the job's details view.", fr: "Supprimer le travail d'entraînement n'est pas nécessaire : vous déployez depuis la vue des détails du travail." }
references:
  - title: Deploy fine-tuned models in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-deploy
