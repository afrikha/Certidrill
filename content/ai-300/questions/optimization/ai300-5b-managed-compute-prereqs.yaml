id: ai300-5b-managed-compute-prereqs
objective: "5.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware fine-tuned gpt-oss-120b with Global training in a Microsoft Foundry project. The team wants to serve the resulting LoRA adapter with the Managed compute (preview) option, on the same dedicated GPUs as two adapters that are already deployed.

    You have the required permissions and GPU quota.

    Which two conditions must be met for the deployment to succeed? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware a ajusté gpt-oss-120b avec l'entraînement Global dans un projet Microsoft Foundry. L'équipe souhaite servir l'adaptateur LoRA obtenu avec l'option Managed compute (préversion), sur les mêmes GPU dédiés que deux adaptateurs déjà déployés.

    Vous disposez des autorisations et du quota GPU nécessaires.

    Quelles sont les deux conditions requises pour que le déploiement réussisse ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The base deployment uses a LoRA-enabled deployment template.", fr: "Le déploiement de base utilise un modèle de déploiement compatible LoRA." } }
    - { id: b, text: { en: "A Subscription Owner or Contributor enables Fireworks on Foundry.", fr: "Un propriétaire ou contributeur de l'abonnement active Fireworks on Foundry." } }
    - { id: c, text: { en: "The adapter was trained with the Standard training type.", fr: "L'adaptateur a été entraîné avec le type d'entraînement Standard." } }
    - { id: d, text: { en: "The adapter matches the exact base model and version of the base deployment.", fr: "L'adaptateur correspond exactement au modèle de base et à la version du déploiement de base." } }
    - { id: e, text: { en: "The base deployment uses the Developer deployment type.", fr: "Le déploiement de base utilise le type de déploiement Developer." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Managed compute runs a matching base model on dedicated GPUs with one or more compatible LoRA adapters. It requires a base deployment created from a LoRA-enabled deployment template and an adapter that matches that base model and version; an adapter isn't interchangeable across similarly named base models.
    fr: |
      Managed compute exécute un modèle de base correspondant sur des GPU dédiés avec un ou plusieurs adaptateurs LoRA compatibles. Il exige un déploiement de base créé à partir d'un modèle de déploiement compatible LoRA et un adaptateur qui correspond à ce modèle de base et à sa version ; un adaptateur n'est pas interchangeable entre des modèles de base aux noms proches.
  options:
    b: { en: "Enabling Fireworks on Foundry is a prerequisite of the Fireworks option, not of Managed compute.", fr: "L'activation de Fireworks on Foundry est un prérequis de l'option Fireworks, pas de Managed compute." }
    c: { en: "The training type doesn't decide adapter compatibility, and gpt-oss-120b supports Global and Developer training only.", fr: "Le type d'entraînement ne détermine pas la compatibilité de l'adaptateur, et gpt-oss-120b ne prend en charge que les entraînements Global et Developer." }
    e: { en: "Managed compute is billed per GPU-hour on dedicated capacity; Developer is a serverless deployment type for evaluation.", fr: "Managed compute est facturé à l'heure GPU sur une capacité dédiée ; Developer est un type de déploiement serverless destiné à l'évaluation." }
references:
  - title: Deploy fine-tuned models in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-deploy
  - title: Fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
