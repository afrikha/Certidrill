difficulty: 3
status: draft
stem:
  en: You send a hybrid query and apply semantic ranking to its results.
  fr: Vous envoyez une requête hybride et appliquez le classement sémantique à ses résultats.
body:
  solution:
    en: |
      You change the query body to the following, where `<user question>` is the text typed by the user:

      ```json
      {
        "search": "<user question>",
        "vectorQueries": [
          {
            "kind": "text",
            "text": "<user question>",
            "fields": "contentVector",
            "k": 50
          }
        ],
        "queryType": "semantic",
        "semanticConfiguration": "kb-semantic",
        "top": 10
      }
      ```
    fr: |
      Vous remplacez le corps de la requête par le suivant, où `<user question>` est le texte saisi par l'utilisateur :

      ```json
      {
        "search": "<user question>",
        "vectorQueries": [
          {
            "kind": "text",
            "text": "<user question>",
            "fields": "contentVector",
            "k": 50
          }
        ],
        "queryType": "semantic",
        "semanticConfiguration": "kb-semantic",
        "top": 10
      }
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      The request is still a hybrid query: BM25 retrieves the chunks that contain the exact code, the vector query retrieves the conceptually similar chunks, and RRF merges them. The semantic ranker then reranks the top 50 results of this merged set, which is why `k` is set to 50. It changes the order, not the retrieval, so all three requirements are met.
    fr: |
      La requête reste une requête hybride : BM25 récupère les blocs qui contiennent le code exact, la requête vectorielle récupère les blocs conceptuellement proches, et RRF les fusionne. Le classeur sémantique reclasse ensuite les 50 premiers résultats de ce jeu fusionné, d'où la valeur 50 de `k`. Il modifie l'ordre, pas la récupération : les trois exigences sont satisfaites.
references:
  - title: Create a Hybrid Query - Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-how-to-query
  - title: Semantic Ranking Overview - Azure AI Search
