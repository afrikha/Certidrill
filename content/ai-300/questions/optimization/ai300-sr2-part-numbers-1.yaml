stem:
  en: You increase k of the vector query to 50.
  fr: Vous augmentez la valeur k de la requête vectorielle à 50.
body:
  solution:
    en: |
      You keep the vector-only query on `contentVector`, set `k` to 50 instead of 5, and set `top` to 5 so that the application still receives five chunks.
    fr: |
      Vous conservez la requête uniquement vectorielle sur `contentVector`, définissez `k` sur 50 au lieu de 5, et définissez `top` sur 5 pour que l'application reçoive toujours cinq blocs.
answer: { value: false }
explanation:
  correct:
    en: A larger `k` only returns more nearest neighbors from the same vector comparison, and the results are still ordered by vector similarity. Vector search finds conceptually similar content but doesn't look for exact term matches, so chunks with the exact part number aren't guaranteed to be retrieved.
    fr: "Une valeur `k` plus élevée renvoie seulement davantage de plus proches voisins issus de la même comparaison vectorielle, et les résultats restent triés par similarité vectorielle. La recherche vectorielle trouve du contenu conceptuellement similaire mais ne recherche pas les correspondances exactes de termes : les blocs qui contiennent le numéro de pièce exact ne sont pas forcément récupérés."
references:
  - title: Hybrid Search Overview - Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
