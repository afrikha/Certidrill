id: ai300-cs3b-similarity-threshold
objective: "5.1.1"
type: single
caseStudy: ai300-cs3b-lucerne-publishing
difficulty: 3
status: draft
stem:
  en: |
    You need to change the vector query that Newsroom Assistant sends to articles-idx to meet the retrieval requirement.

    What should you do?
  fr: |
    Vous devez modifier la requête vectorielle que Newsroom Assistant envoie à articles-idx pour respecter l'exigence de récupération.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Reduce `k` from 5 to 2 in the vector query."
        fr: "Réduire `k` de 5 à 2 dans la requête vectorielle."
    - id: b
      text:
        en: "Set `exhaustive` to `true` in the vector query."
        fr: "Régler `exhaustive` sur `true` dans la requête vectorielle."
    - id: c
      text:
        en: "Add a `threshold` object of kind `vectorSimilarity` with the value 0.8 to the vector query."
        fr: "Ajouter à la requête vectorielle un objet `threshold` de type `vectorSimilarity` avec la valeur 0,8."
    - id: d
      text:
        en: "Add a `search` parameter with the question text to make the query hybrid."
        fr: "Ajouter un paramètre `search` contenant le texte de la question pour rendre la requête hybride."
answer: { optionId: c }
explanation:
  correct:
    en: |
      A vector query always returns `k` results when the index contains at least `k` documents, even when the similarity is poor. The `threshold` parameter of kind `vectorSimilarity`, available in the preview REST API, excludes the matches whose similarity score is below the value, even if fewer than `k` results remain. On a cosine field, the value 0.8 applies the cutoff of requirement 7.
    fr: |
      Une requête vectorielle renvoie toujours `k` résultats quand l'index contient au moins `k` documents, même si la similarité est faible. Le paramètre `threshold` de type `vectorSimilarity`, disponible dans l'API REST en préversion, exclut les correspondances dont le score de similarité est inférieur à la valeur, même s'il reste moins de `k` résultats. Sur un champ cosinus, la valeur 0,8 applique le seuil de l'exigence 7.
  options:
    a:
      en: |
        A smaller `k` still returns the two nearest chunks, however weak their similarity is.
      fr: |
        Un `k` plus petit renvoie toujours les deux blocs les plus proches, quelle que soit la faiblesse de leur similarité.
    b:
      en: |
        Exhaustive KNN searches all vectors instead of the HNSW graph, but it still returns the `k` nearest matches without any minimum score.
      fr: |
        La recherche KNN exhaustive parcourt tous les vecteurs au lieu du graphe HNSW, mais elle renvoie toujours les `k` correspondances les plus proches, sans score minimal.
    d:
      en: |
        A hybrid query adds keyword matches merged by Reciprocal Rank Fusion; it doesn't exclude chunks below a similarity score.
      fr: |
        Une requête hybride ajoute des correspondances par mots clés fusionnées par Reciprocal Rank Fusion ; elle n'exclut pas les blocs dont le score de similarité est inférieur à un seuil.
references:
  - title: Create a Vector Query
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-query
  - title: Hybrid Search Overview
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
