id: ai300-5a-hybrid-processing-order
objective: "5.1.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Contoso's RAG assistant sends one request to Azure AI Search that contains a `search` string, one vector query and `queryType` set to `semantic`.

    You need to describe to the team how Azure AI Search processes this request.

    Which four steps occur in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    L'assistant RAG de Contoso envoie à Azure AI Search une requête qui contient une chaîne `search`, une requête vectorielle et `queryType` défini sur `semantic`.

    Vous devez décrire à l'équipe comment Azure AI Search traite cette requête.

    Quelles sont les quatre étapes qui se déroulent dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: parallel, text: { en: "Run the full-text query and the vector query in parallel.", fr: "Exécuter en parallèle la requête en texte intégral et la requête vectorielle." } }
    - { id: rrf, text: { en: "Merge the two ranked result sets with Reciprocal Rank Fusion (RRF).", fr: "Fusionner les deux jeux de résultats classés avec Reciprocal Rank Fusion (RRF)." } }
    - { id: rerank, text: { en: "Rerank the top 50 merged results with the semantic ranker.", fr: "Reclasser les 50 premiers résultats fusionnés avec le classeur sémantique." } }
    - { id: return, text: { en: "Return the results in descending `@search.rerankerScore` order.", fr: "Renvoyer les résultats par `@search.rerankerScore` décroissant." } }
    - { id: semfirst, text: { en: "Rerank each result set with the semantic ranker before the fusion.", fr: "Reclasser chaque jeu de résultats avec le classeur sémantique avant la fusion." } }
    - { id: average, text: { en: "Normalize the BM25 and similarity scores to the 0–1 range and average them.", fr: "Normaliser les scores BM25 et de similarité dans la plage 0–1 et en calculer la moyenne." } }
answer:
  sequence: [ parallel, rrf, rerank, return ]
explanation:
  correct:
    en: |
      A hybrid query runs the full-text (BM25) query and the vector query in parallel, and RRF merges the ranked result sets into one ranking. Semantic ranking runs after RRF, on the top 50 results, and the results come back ordered by `@search.rerankerScore`, while `@search.score` keeps the RRF score.
    fr: |
      Une requête hybride exécute en parallèle la requête en texte intégral (BM25) et la requête vectorielle, et RRF fusionne les jeux de résultats classés en un seul classement. Le classement sémantique s'exécute après RRF, sur les 50 premiers résultats, et les résultats sont renvoyés par `@search.rerankerScore`, tandis que `@search.score` conserve le score RRF.
  options:
    semfirst:
      en: |
        The semantic ranker processes the merged results once, after RRF, not each result set separately.
      fr: |
        Le classeur sémantique traite une seule fois les résultats fusionnés, après RRF, et non chaque jeu de résultats séparément.
    average:
      en: |
        RRF merges results by their ranks in each list, not by normalizing and averaging their scores.
      fr: |
        RRF fusionne les résultats selon leurs rangs dans chaque liste, et non en normalisant et en moyennant leurs scores.
references:
  - title: Hybrid search using vectors and full-text search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
  - title: Relevance scoring in hybrid search using Reciprocal Rank Fusion (RRF)
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-ranking
