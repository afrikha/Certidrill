id: ai300-cs4b-chunk-overlap
objective: "5.1.1"
type: single
caseStudy: ai300-cs4b-margies-travel
difficulty: 2
status: draft
stem:
  en: You need to resolve the problem with the cancellation conditions by modifying the Text Split skill of idx-travel-docs. The solution must meet the retrieval requirements. Which change should you make before you rerun the indexer?
  fr: Vous devez résoudre le problème des conditions d'annulation en modifiant la compétence Text Split d'idx-travel-docs. La solution doit respecter les exigences de récupération. Quelle modification devez-vous apporter avant de réexécuter l'indexeur ?
body:
  options:
    - { id: a, text: { en: "Set textSplitMode to sentences", fr: "Régler textSplitMode sur sentences" } }
    - { id: b, text: { en: "Set maximumPageLength to 4000", fr: "Régler maximumPageLength sur 4000" } }
    - { id: c, text: { en: "Set maximumPagesToTake to 1", fr: "Régler maximumPagesToTake sur 1" } }
    - { id: d, text: { en: "Set pageOverlapLength to 300", fr: "Régler pageOverlapLength sur 300" } }
answer: { optionId: d }
explanation:
  correct:
    en: In pages mode, pageOverlapLength makes each chunk start with that number of characters taken from the end of the previous chunk, so text that crosses a page boundary is repeated at the start of the next chunk. maximumPageLength stays at 2000, as the requirements demand.
    fr: En mode pages, pageOverlapLength fait commencer chaque bloc par ce nombre de caractères repris de la fin du bloc précédent ; le texte qui chevauche une limite de page est donc repris au début du bloc suivant. maximumPageLength reste à 2000, comme le demandent les exigences.
  options:
    a: { en: "The sentences mode splits the text into sentences; pageOverlapLength applies only in pages mode, so no chunk would include the end of the previous one.", fr: "Le mode sentences découpe le texte en phrases ; pageOverlapLength ne s'applique qu'en mode pages, si bien qu'aucun bloc n'inclurait la fin du précédent." }
    b: { en: "Raising maximumPageLength reduces the number of boundaries but increases the maximum chunk length, which the requirements forbid.", fr: "Augmenter maximumPageLength réduit le nombre de limites mais augmente la longueur maximale des blocs, ce que les exigences interdisent." }
    c: { en: "maximumPagesToTake 1 keeps only the first page of each document and drops the rest of the content.", fr: "maximumPagesToTake 1 ne conserve que la première page de chaque document et supprime le reste du contenu." }
references:
  - title: Text Split Skill - Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-textsplit
