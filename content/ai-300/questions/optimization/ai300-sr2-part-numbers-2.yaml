id: ai300-sr2-part-numbers-2
objective: "5.1.3"
type: series_yesno
series: ai300-sr2-part-numbers
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You send a hybrid query that combines the question text with the vector query.
  fr: Vous envoyez une requête hybride qui combine le texte de la question et la requête vectorielle.
body:
  solution:
    en: |
      In each query request, you set the `search` parameter to the text of the user question and keep the `vectorQueries` entry of kind `vector` on `contentVector`. You set `top` to 5.
    fr: |
      Dans chaque requête de recherche, vous définissez le paramètre `search` sur le texte de la question de l'utilisateur et conservez l'entrée `vectorQueries` de type `vector` sur `contentVector`. Vous définissez `top` sur 5.
answer: { value: true }
explanation:
  correct:
    en: A request that contains both `search` and `vectorQueries` is a hybrid query, which runs full-text and vector search in parallel and merges the results with Reciprocal Rank Fusion (RRF) into one result set. Full-text search matches exact terms such as product codes, while the vector query keeps returning conceptually similar chunks for symptom descriptions.
    fr: "Une requête qui contient à la fois `search` et `vectorQueries` est une requête hybride : elle exécute la recherche en texte intégral et la recherche vectorielle en parallèle, puis fusionne les résultats en un seul jeu avec la fusion de rang réciproque (RRF). La recherche en texte intégral trouve les termes exacts comme les codes de produit, tandis que la requête vectorielle continue de renvoyer des blocs conceptuellement similaires pour les descriptions de symptômes."
references:
  - title: Hybrid Search Overview - Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
  - title: Create a Hybrid Query - Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-how-to-query
