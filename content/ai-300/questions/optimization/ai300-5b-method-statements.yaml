id: ai300-5b-method-statements
objective: "5.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans fine-tuning jobs in a Microsoft Foundry project that's hosted in Sweden Central. The team is reviewing the training data and the job settings.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit des travaux de réglage précis dans un projet Microsoft Foundry hébergé dans la région Sweden Central. L'équipe examine les données d'entraînement et les paramètres des travaux.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "In a reinforcement fine-tuning (RFT) training file, the `messages` array of each record ends with a `user` message."
        fr: "Dans un fichier d'entraînement de réglage précis par renforcement (RFT), le tableau `messages` de chaque enregistrement se termine par un message `user`."
    - id: s2
      text:
        en: "A `python` grader can call the company's REST API to check each generated answer."
        fr: "Un évaluateur (grader) `python` peut appeler l'API REST de l'entreprise pour vérifier chaque réponse générée."
    - id: s3
      text:
        en: "With the Global training type, the training data and the model weights can be copied to a region other than Sweden Central."
        fr: "Avec le type d'entraînement Global, les données d'entraînement et les poids du modèle peuvent être copiés dans une région autre que Sweden Central."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      RFT records end with a `user` message because the model generates the response that the grader scores; they can also carry fields such as `reference_answer`. Python graders run in a constrained runtime with no network access, so they can't call an external API. Global training uses capacity beyond your region: data and weights are copied to the training region, with no data residency guarantee.
    fr: |
      Les enregistrements RFT se terminent par un message `user`, car le modèle génère la réponse que l'évaluateur note ; ils peuvent aussi contenir des champs comme `reference_answer`. Les évaluateurs Python s'exécutent dans un environnement restreint sans accès réseau : ils ne peuvent pas appeler une API externe. L'entraînement Global utilise de la capacité hors de votre région : les données et les poids sont copiés dans la région d'entraînement, sans garantie de résidence des données.
references:
  - title: Fine-tune a model with reinforcement fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reinforcement-fine-tuning
  - title: Fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
