id: ai300-5a-domain-model-eval
objective: "5.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind Health uses `text-embedding-3-large` for a clinical RAG index in Azure AI Search. A team proposes to replace it with PubMedBERT, deployed to an Azure Machine Learning managed online endpoint. The team would then have to version, scale and monitor this endpoint itself.

    You need to decide, based on measured evidence, whether the clinical model justifies this extra operational cost. Re-embedding the whole corpus takes several days, so you must limit re-embedding work until the decision is made.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Health utilise `text-embedding-3-large` pour un index RAG clinique dans Azure AI Search. Une équipe propose de le remplacer par PubMedBERT, déployé sur un point de terminaison en ligne managé Azure Machine Learning. L'équipe devrait alors gérer elle-même les versions, la mise à l'échelle et la surveillance de ce point de terminaison.

    Vous devez décider, sur la base de mesures, si le modèle clinique justifie ce coût d'exploitation supplémentaire. La réincorporation de tout le corpus prend plusieurs jours : vous devez donc limiter le travail de réincorporation tant que la décision n'est pas prise.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Build a labeled set of clinical queries with known relevant documents, and measure precision@10 and recall@10 for each model.", fr: "Constituer un jeu étiqueté de requêtes cliniques avec leurs documents pertinents connus, et mesurer precision@10 et recall@10 pour chaque modèle." } }
    - { id: b, text: { en: "Keep the model that ranks higher on the MTEB leaderboard, because public benchmarks reflect clinical retrieval.", fr: "Conserver le modèle le mieux classé sur le classement MTEB, car les bancs d'essai publics reflètent la récupération clinique." } }
    - { id: c, text: { en: "Index a representative sample of about 1,000 documents with each model, and run the labeled queries against both sample indexes.", fr: "Indexer un échantillon représentatif d'environ 1 000 documents avec chaque modèle, et exécuter les requêtes étiquetées sur les deux index d'échantillon." } }
    - { id: d, text: { en: "Compare the average similarity scores that each model returns for the same queries, and keep the model with the higher average.", fr: "Comparer les scores de similarité moyens renvoyés par chaque modèle pour les mêmes requêtes, et conserver le modèle dont la moyenne est la plus élevée." } }
    - { id: e, text: { en: "Re-embed the whole corpus with the clinical model in the production index, and roll back if users complain.", fr: "Réincorporer tout le corpus avec le modèle clinique dans l'index de production, et revenir en arrière si les utilisateurs se plaignent." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The most practical way to evaluate embeddings is to run real queries and check whether the right documents are retrieved, which a labeled query set with precision@10 and recall@10 measures for each configuration. Learn suggests piloting on a sample of about 1,000 representative documents before a full re-index, and treating a gain of about 10 percentage points as the level that justifies a clinical model.
    fr: |
      La manière la plus pratique d'évaluer des incorporations consiste à exécuter des requêtes réelles et à vérifier que les bons documents sont récupérés, ce que mesure pour chaque configuration un jeu de requêtes étiquetées avec precision@10 et recall@10. Learn propose un pilote sur un échantillon d'environ 1 000 documents représentatifs avant une réindexation complète, et considère qu'un gain d'environ 10 points de pourcentage justifie un modèle clinique.
  options:
    d:
      en: |
        Each model has its own vector space, so raw similarity scores aren't comparable between models and don't say whether the right documents were retrieved.
      fr: |
        Chaque modèle a son propre espace vectoriel : les scores de similarité bruts ne sont pas comparables d'un modèle à l'autre et n'indiquent pas si les bons documents ont été récupérés.
    b:
      en: |
        Public benchmarks are often academic and may not reflect your data; the choice must be validated on your own queries.
      fr: |
        Les bancs d'essai publics sont souvent académiques et peuvent ne pas refléter vos données ; le choix doit être validé sur vos propres requêtes.
    e:
      en: |
        This re-embeds the whole corpus before any evidence exists and exposes users to a possible regression.
      fr: |
        Cela réincorpore tout le corpus avant de disposer de la moindre mesure et expose les utilisateurs à une régression possible.
references:
  - title: Optimize chunking and embedding strategies
