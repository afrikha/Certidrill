id: ai300-5a-reranker-score-order
objective: "5.1.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank's RAG assistant sends a hybrid query with `queryType` set to `semantic` to Azure AI Search. The following table shows the scores of four of the documents processed for the query.

    Answer each prompt by selecting the appropriate document.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'assistant RAG de Woodgrove Bank envoie à Azure AI Search une requête hybride dont `queryType` est défini sur `semantic`. Le tableau suivant indique les scores de quatre des documents traités pour la requête.

    Répondez à chaque consigne en sélectionnant le document approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The document returned first in the response", fr: "Le document renvoyé en premier dans la réponse" }
    - id: p2
      text: { en: "The document that Reciprocal Rank Fusion (RRF) ranked first", fr: "Le document que Reciprocal Rank Fusion (RRF) a classé en premier" }
  grid:
    header: [ { en: Document, fr: Document }, "@search.score", "@search.rerankerScore" ]
    rows:
      - [ { text: doc-loans-07, area: d1 }, { text: "0.03279" }, { text: "1.85" } ]
      - [ { text: doc-cards-12, area: d2 }, { text: "0.03201" }, { text: "3.42" } ]
      - [ { text: doc-fees-03, area: d3 }, { text: "0.03150" }, { text: "2.10" } ]
      - [ { text: doc-fraud-21, area: d4 }, { text: "0.01613" }, { text: "2.95" } ]
answer:
  values: { p1: d2, p2: d1 }
explanation:
  correct:
    en: |
      In a hybrid query, `@search.score` holds the RRF score, so doc-loans-07, with the highest value, was ranked first by RRF. Semantic ranking runs after RRF on the top 50 results and reports its score separately in `@search.rerankerScore`, from 0 to 4. Semantically ranked results are returned in descending reranker score order, so doc-cards-12 (3.42) comes first.
    fr: |
      Dans une requête hybride, `@search.score` contient le score RRF : doc-loans-07, qui a la valeur la plus élevée, a donc été classé premier par RRF. Le classement sémantique s'exécute après RRF sur les 50 premiers résultats et indique son score séparément dans `@search.rerankerScore`, de 0 à 4. Les résultats classés sémantiquement sont renvoyés par score de reclassement décroissant : doc-cards-12 (3,42) arrive donc en premier.
references:
  - title: Relevance scoring in hybrid search using Reciprocal Rank Fusion (RRF)
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-ranking
  - title: Semantic ranking in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
