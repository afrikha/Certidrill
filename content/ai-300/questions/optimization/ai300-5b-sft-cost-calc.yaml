id: ai300-5b-sft-cost-calc
objective: "5.2.3"
type: single
difficulty: 3
shuffle: false
status: draft
stem:
  en: |
    Wingtip Toys fine-tunes gpt-4.1 with supervised fine-tuning (SFT) and Global training. The training file contains 3 million tokens, and `n_epochs` is set to 4. Assume a training price of 2 USD per million training tokens.

    The first job failed after 40 minutes of training. The second job waited 3 hours in the queue, then trained for 2 hours and succeeded.

    What is the total training charge for the two jobs?
  fr: |
    Wingtip Toys effectue le réglage précis supervisé (SFT) de gpt-4.1 avec l'entraînement Global. Le fichier d'entraînement contient 3 millions de jetons, et `n_epochs` est défini sur 4. Supposez un prix d'entraînement de 2 USD par million de jetons d'entraînement.

    Le premier travail a échoué après 40 minutes d'entraînement. Le second travail a attendu 3 heures dans la file d'attente, puis s'est entraîné pendant 2 heures et a réussi.

    Quel est le coût total d'entraînement des deux travaux ?
body:
  options:
    - { id: a, text: "6 USD" }
    - { id: b, text: "12 USD" }
    - { id: c, text: "24 USD" }
    - { id: d, text: "48 USD" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      SFT is billed as training tokens x epochs x training price per token: 3 million x 4 x 2 USD per million = 24 USD. The training runtime doesn't affect the SFT charge, and neither the failed job nor the time in the queue is billed.
    fr: |
      SFT est facturé selon jetons d'entraînement x époques x prix d'entraînement par jeton : 3 millions x 4 x 2 USD par million = 24 USD. La durée d'entraînement n'influe pas sur le coût SFT, et ni le travail échoué ni le temps en file d'attente ne sont facturés.
  options:
    a: { en: "6 USD ignores the number of epochs.", fr: "6 USD ignore le nombre d'époques." }
    b: { en: "12 USD corresponds to 2 epochs, but the job runs 4 epochs.", fr: "12 USD correspond à 2 époques, mais le travail en exécute 4." }
    d: { en: "48 USD also bills the failed job as a complete run, but failed jobs aren't billed.", fr: "48 USD facture aussi le travail échoué comme une exécution complète, alors que les travaux échoués ne sont pas facturés." }
references:
  - title: Manage fine-tuning costs in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-cost-management
