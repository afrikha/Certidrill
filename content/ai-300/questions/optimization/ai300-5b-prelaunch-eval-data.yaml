id: ai300-5b-prelaunch-eval-data
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware is about to launch a Foundry agent named **hr-agent**. The agent has never been used in production, so it has no traces.

    You need to create an evaluation dataset of single-turn questions with ground-truth answers that cover edge cases of the HR policy.

    What should you do in the Data Generation tab of the project?
  fr: |
    Proseware s'apprête à lancer un agent Foundry nommé **hr-agent**. L'agent n'a jamais été utilisé en production : il n'a donc aucune trace.

    Vous devez créer un jeu de données d'évaluation de questions à un seul tour avec des réponses de référence qui couvrent des cas limites de la politique RH.

    Que devez-vous faire dans l'onglet Data Generation du projet ?
body:
  options:
    - { id: a, text: { en: "Select Create dataset, From traces, and enable sampling.", fr: "Sélectionner Create dataset, From traces, et activer l'échantillonnage." } }
    - { id: b, text: { en: "Select Create dataset, Generate synthetic, set Dataset usage to Evaluation, and select Simple QnA.", fr: "Sélectionner Create dataset, Generate synthetic, définir Dataset usage sur Evaluation et sélectionner Simple QnA." } }
    - { id: c, text: { en: "Select Create dataset, Generate synthetic, set Dataset usage to Evaluation, and select Simulation seed.", fr: "Sélectionner Create dataset, Generate synthetic, définir Dataset usage sur Evaluation et sélectionner Simulation seed." } }
    - { id: d, text: { en: "Select Create dataset, From traces, and set Maximum samples to 1,000.", fr: "Sélectionner Create dataset, From traces, et définir Maximum samples sur 1 000." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Synthetic generation fits prelaunch scenarios and edge cases when no production traces exist. The Simple QnA (single-turn) task type produces `query` and `ground_truth` pairs that you can evaluate directly. You can ground it with the agent definition, a prompt or a reference file.
    fr: |
      La génération synthétique convient aux scénarios d'avant lancement et aux cas limites quand il n'existe aucune trace de production. Le type de tâche Simple QnA (à un seul tour) produit des paires `query` et `ground_truth` que vous pouvez évaluer directement. Vous pouvez l'ancrer sur la définition de l'agent, une invite ou un fichier de référence.
  options:
    a: { en: "A dataset from traces needs production traces, and hr-agent has none.", fr: "Un jeu de données issu de traces nécessite des traces de production, et hr-agent n'en a aucune." }
    c: { en: "Simulation seed produces scenario descriptions for multi-turn simulated conversations, not single-turn questions with ground truth.", fr: "Simulation seed produit des descriptions de scénarios pour des conversations simulées à plusieurs tours, pas des questions à un seul tour avec réponse de référence." }
    d: { en: "Maximum samples only caps a traces job, and there are no traces to sample.", fr: "Maximum samples ne fait que plafonner un travail de traces, et il n'y a aucune trace à échantillonner." }
references:
  - title: Generate a synthetic evaluation dataset (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/evaluation-dataset-synthetic
  - title: Convert agent traces into evaluation datasets
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/traces-to-dataset
