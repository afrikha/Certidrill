id: ai300-5b-method-tool-calls
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a support agent in a Microsoft Foundry project that uses a gpt-4.1-mini deployment. The agent often selects the wrong tool, and its system prompt contains 40 worked examples, which increases latency and token cost.

    The team has 3,000 reviewed conversations that show the correct tool calls and arguments for real customer requests. There are no alternative or rejected responses, and there is no scoring function.

    You need to customize gpt-4.1-mini so that the agent selects tools more accurately with a shorter prompt.

    Which fine-tuning method should you use?
  fr: |
    Contoso dispose d'un agent de support dans un projet Microsoft Foundry qui utilise un déploiement gpt-4.1-mini. L'agent sélectionne souvent le mauvais outil, et son invite système contient 40 exemples détaillés, ce qui augmente la latence et le coût en jetons.

    L'équipe dispose de 3 000 conversations vérifiées qui montrent les bons appels d'outils et leurs arguments pour des demandes réelles de clients. Il n'existe ni réponses alternatives ou rejetées, ni fonction de notation.

    Vous devez personnaliser gpt-4.1-mini pour que l'agent sélectionne les outils avec plus de précision à l'aide d'une invite plus courte.

    Quelle méthode de réglage précis devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Direct preference optimization (DPO)", fr: "Optimisation directe des préférences (DPO)" } }
    - { id: b, text: { en: "Reinforcement fine-tuning (RFT)", fr: "Réglage précis par renforcement (RFT)" } }
    - { id: c, text: { en: "Supervised fine-tuning (SFT)", fr: "Réglage précis supervisé (SFT)" } }
    - { id: d, text: { en: "Programmed Training with a custom loss", fr: "Programmed Training avec une perte personnalisée" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      SFT trains on prompts paired with the desired responses, which is exactly what the reviewed conversations provide. Microsoft lists better tool selection and argument accuracy, and lower prompt overhead, among the goals of fine-tuning. gpt-4.1-mini supports SFT in Managed Training.
    fr: |
      SFT s'entraîne sur des invites associées aux réponses souhaitées, ce que fournissent précisément les conversations vérifiées. Microsoft cite l'amélioration du choix des outils et de la précision des arguments, ainsi que la réduction de la taille des invites, parmi les objectifs du réglage précis. gpt-4.1-mini prend en charge SFT en Managed Training.
  options:
    a: { en: "DPO needs a preferred and a rejected response for each input, and the team has no rejected responses.", fr: "DPO a besoin d'une réponse préférée et d'une réponse rejetée pour chaque entrée, et l'équipe n'a pas de réponses rejetées." }
    b: { en: "RFT needs a grader that scores generated responses, and gpt-4.1-mini doesn't support RFT.", fr: "RFT a besoin d'un évaluateur (grader) qui note les réponses générées, et gpt-4.1-mini ne prend pas en charge RFT." }
    d: { en: "Programmed Training is a preview that requires access approval and is meant for custom training loops; gpt-4.1-mini doesn't support it, and the predefined SFT method already fits demonstration data.", fr: "Programmed Training est une préversion soumise à approbation, destinée aux boucles d'entraînement personnalisées ; gpt-4.1-mini ne le prend pas en charge, et la méthode SFT prédéfinie convient déjà à des données de démonstration." }
references:
  - title: Fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
