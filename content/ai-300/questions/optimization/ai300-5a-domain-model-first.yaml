id: ai300-5a-domain-model-first
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum builds a RAG solution over biomedical research papers. A test with a general-purpose embedding model shows poor retrieval for questions that contain drug and gene names, which the model's vocabulary splits into subword pieces.

    You follow the embedding model selection guidance of the Azure Architecture Center.

    What should you do first?
  fr: |
    Adatum crée une solution RAG sur des articles de recherche biomédicale. Un test avec un modèle d'incorporation généraliste montre une récupération médiocre pour les questions qui contiennent des noms de médicaments et de gènes, que le vocabulaire du modèle découpe en sous-mots.

    Vous suivez les recommandations de sélection d'un modèle d'incorporation du Centre des architectures Azure.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Look for an embedding model trained on biomedical text, such as PubMedBERT Embeddings, and test it on your data.", fr: "Rechercher un modèle d'incorporation entraîné sur des textes biomédicaux, comme PubMedBERT Embeddings, et le tester sur vos données." }
    - id: b
      text: { en: "Reduce the output dimensions of the general-purpose model so that rare terms carry more weight in each vector.", fr: "Réduire les dimensions de sortie du modèle généraliste pour que les termes rares pèsent davantage dans chaque vecteur." }
    - id: c
      text: { en: "Change the similarity metric of the vector field from cosine to Euclidean distance to measure literal proximity.", fr: "Remplacer la métrique de similarité du champ vectoriel, cosinus, par la distance euclidienne pour mesurer la proximité littérale." }
    - id: d
      text: { en: "Fine-tune the general-purpose model on the research papers, and then compare it with other general-purpose models.", fr: "Ajuster le modèle généraliste sur les articles de recherche, puis le comparer à d'autres modèles généralistes." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The guidance first asks whether the content is domain-specific and, if so, whether a domain model exists; if one exists, you test it. A model trained on biomedical literature, such as PubMedBERT Embeddings, has a vocabulary that represents terms that a general model splits into subwords, which produces poorer vector matches. Fine-tuning a general model comes only when no suitable domain model exists.
    fr: |
      Les recommandations demandent d'abord si le contenu est propre à un domaine et, dans ce cas, s'il existe un modèle de domaine ; s'il en existe un, vous le testez. Un modèle entraîné sur la littérature biomédicale, comme PubMedBERT Embeddings, possède un vocabulaire qui représente des termes qu'un modèle généraliste découpe en sous-mots, ce qui dégrade les correspondances vectorielles. L'ajustement d'un modèle généraliste n'intervient que si aucun modèle de domaine adapté n'existe.
  options:
    d:
      en: |
        Fine-tuning is the last option in the guidance; it requires careful evaluation and can degrade performance if the training data is poor.
      fr: |
        L'ajustement est la dernière option des recommandations ; il exige une évaluation soigneuse et peut dégrader les performances si les données d'entraînement sont médiocres.
    b:
      en: |
        Reducing dimensions lowers storage and compute costs; it doesn't add the missing domain vocabulary to the model.
      fr: |
        Réduire les dimensions diminue les coûts de stockage et de calcul ; cela n'ajoute pas au modèle le vocabulaire de domaine manquant.
    c:
      en: |
        The metric only compares the vectors that the model produces; it can't fix vectors that represent the domain terms poorly.
      fr: |
        La métrique ne fait que comparer les vecteurs produits par le modèle ; elle ne peut pas corriger des vecteurs qui représentent mal les termes du domaine.
references:
  - title: RAG generate embeddings phase
    url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/rag/rag-generate-embeddings
