id: ai300-5b-sdg-real-gap
objective: "5.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware fine-tuned gpt-4.1-mini only on 1,000 synthetic examples generated with the Simple Q&A generator. The model scores well on the synthetic validation split, but it performs worse than expected on production requests.

    You plan a new fine-tuning job. The reference file and the generator don't change.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware a effectué le réglage précis de gpt-4.1-mini uniquement sur 1 000 exemples synthétiques générés avec le générateur Simple Q&A. Le modèle obtient de bons scores sur la partie de validation synthétique, mais il est moins performant que prévu sur les requêtes de production.

    Vous prévoyez un nouveau travail de réglage précis. Le fichier de référence et le générateur ne changent pas.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Increase `n_epochs` so that the model learns the synthetic examples more closely.", fr: "Augmenter `n_epochs` pour que le modèle apprenne plus étroitement les exemples synthétiques." } }
    - { id: b, text: { en: "Add a portion of real customer questions and answers to the training data.", fr: "Ajouter une partie de questions et réponses réelles de clients aux données d'entraînement." } }
    - { id: c, text: { en: "Merge the synthetic validation split into the training file.", fr: "Fusionner la partie de validation synthétique dans le fichier d'entraînement." } }
    - { id: d, text: { en: "Use a smaller learning rate multiplier than you would use with real data.", fr: "Utiliser un multiplicateur de taux d'apprentissage plus petit qu'avec des données réelles." } }
    - { id: e, text: { en: "Change the training type from Standard to Global.", fr: "Changer le type d'entraînement de Standard à Global." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Microsoft recommends blending a portion of real-world data with synthetic data to improve generalization, and using a smaller learning rate than with real data to curb overfitting on synthetic data. The fine-tuned model should then be evaluated on real-world tasks.
    fr: |
      Microsoft recommande de mélanger une partie de données réelles aux données synthétiques pour améliorer la généralisation, et d'utiliser un taux d'apprentissage plus petit qu'avec des données réelles pour limiter le surajustement sur les données synthétiques. Le modèle ajusté doit ensuite être évalué sur des tâches réelles.
  options:
    a: { en: "More epochs fit the synthetic data even more closely, which increases overfitting.", fr: "Davantage d'époques ajustent encore plus le modèle aux données synthétiques, ce qui accroît le surajustement." }
    c: { en: "Validation data must stay separate from training data, and it's also synthetic.", fr: "Les données de validation doivent rester séparées des données d'entraînement, et elles sont elles aussi synthétiques." }
    e: { en: "The training type changes where training runs and its cost, not how well the model generalizes.", fr: "Le type d'entraînement change le lieu d'exécution et le coût de l'entraînement, pas la capacité de généralisation du modèle." }
references:
  - title: Generate synthetic data for fine-tuning in Microsoft Foundry (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/fine-tuning/data-generation
