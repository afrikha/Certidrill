id: ai300-5a-vector-score-facts
objective: "5.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs vector-only queries against an Azure AI Search index. The vector field stores `text-embedding-3-small` embeddings, and its HNSW configuration uses the `cosine` metric. You analyze the query results before you tune retrieval.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys exécute des requêtes uniquement vectorielles sur un index Azure AI Search. Le champ vectoriel stocke des incorporations `text-embedding-3-small`, et sa configuration HNSW utilise la métrique `cosine`. Vous analysez les résultats des requêtes avant d'optimiser la récupération.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A query returns `k` results when the index contains at least `k` documents, even if some of them have poor similarity.", fr: "Une requête renvoie `k` résultats lorsque l'index contient au moins `k` documents, même si certains ont une faible similarité." } }
    - { id: b, text: { en: "Setting `exhaustive` to `true` makes the query return only the results that are above a minimum similarity defined in the index.", fr: "Définir `exhaustive` sur `true` fait renvoyer à la requête uniquement les résultats supérieurs à une similarité minimale définie dans l'index." } }
    - { id: c, text: { en: "The `@search.score` of each result equals the cosine similarity between the query vector and the document vector.", fr: "Le `@search.score` de chaque résultat est égal à la similarité cosinus entre le vecteur de la requête et celui du document." } }
    - { id: d, text: { en: "The `@search.score` of each result is between 0.333 and 1.00.", fr: "Le `@search.score` de chaque résultat est compris entre 0,333 et 1,00." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Vector queries always return `k` results when at least `k` documents exist, whatever their similarity. For the cosine metric, Azure AI Search reports 1 / (1 + cosine distance), where the cosine distance is 1 minus the cosine similarity, so scores range from 0.333 to 1.00 and decrease as similarity worsens. To filter on a cosine value, a custom solution must first convert the score back to a similarity.
    fr: |
      Les requêtes vectorielles renvoient toujours `k` résultats dès qu'au moins `k` documents existent, quelle que soit leur similarité. Pour la métrique cosinus, Azure AI Search indique 1 / (1 + distance cosinus), la distance cosinus valant 1 moins la similarité cosinus : les scores vont donc de 0,333 à 1,00 et diminuent quand la similarité se dégrade. Pour filtrer sur une valeur de cosinus, une solution personnalisée doit d'abord reconvertir le score en similarité.
  options:
    c:
      en: |
        The score isn't the raw cosine value; it is derived from the cosine distance with the formula 1 / (1 + distance).
      fr: |
        Le score n'est pas la valeur brute du cosinus ; il est dérivé de la distance cosinus avec la formule 1 / (1 + distance).
    b:
      en: "`exhaustive` runs an exact KNN search instead of HNSW; an index defines no minimum similarity, and thresholds are set per query (preview)."
      fr: "`exhaustive` exécute une recherche KNN exacte au lieu de HNSW ; un index ne définit aucune similarité minimale, et les seuils se définissent par requête (préversion)."
references:
  - title: Relevance in vector search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-ranking
  - title: Create a vector query in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-query
