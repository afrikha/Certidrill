id: ai300-cs2c-preference-tuning
objective: "5.2.1"
type: single
caseStudy: ai300-cs2c-adventure-works
difficulty: 1
status: draft
stem:
  en: |
    You need to customize the chat model of gpt-support to meet the customization requirement.

    Which fine-tuning method should you use?
  fr: |
    Vous devez personnaliser le modèle de conversation de gpt-support pour respecter l'exigence de personnalisation.

    Quelle méthode de réglage précis devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Supervised fine-tuning (SFT)", fr: "Réglage précis supervisé (SFT)" } }
    - { id: b, text: { en: "Reinforcement fine-tuning (RFT)", fr: "Réglage précis par renforcement (RFT)" } }
    - { id: c, text: { en: "Distillation", fr: "Distillation" } }
    - { id: d, text: { en: "Direct preference optimization (DPO)", fr: "Optimisation directe des préférences (DPO)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "DPO trains on preferred and rejected responses to the same input. It fits when quality depends on preferences such as tone or length rather than on one correct answer, which is exactly what the editors produced."
    fr: "DPO s'entraîne sur des réponses préférées et rejetées pour une même entrée. Cette méthode convient quand la qualité dépend de préférences, comme le ton ou la longueur, plutôt que d'une seule réponse correcte : c'est exactement ce que les rédacteurs ont produit."
  options:
    a: { en: "SFT learns from prompts and one desired response each; it cannot use the rejected answers.", fr: "SFT apprend à partir d'invites associées chacune à une réponse souhaitée ; il ne peut pas exploiter les réponses rejetées." }
    b: { en: "RFT needs a grader that scores generated responses, not pairs of preferred and rejected answers.", fr: "RFT nécessite un évaluateur (grader) qui note les réponses générées, pas des paires de réponses préférées et rejetées." }
    c: { en: "Distillation trains a smaller model on responses generated by a larger teacher model; it does not learn the editors' preferences.", fr: "La distillation entraîne un modèle plus petit sur des réponses générées par un modèle enseignant plus grand ; elle n'apprend pas les préférences des rédacteurs." }
references:
  - title: Fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/fine-tuning-considerations
