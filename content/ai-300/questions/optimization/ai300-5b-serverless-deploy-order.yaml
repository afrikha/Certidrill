id: ai300-5b-serverless-deploy-order
objective: "5.2.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A supervised fine-tuning job of gpt-4.1-nano has completed in a Microsoft Foundry project named **proj-claims**. You have the Foundry Owner role, and the project has enough deployment quota.

    You need to deploy the fine-tuned model with the Serverless option and confirm that it responds.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un travail de réglage précis supervisé de gpt-4.1-nano s'est terminé dans un projet Microsoft Foundry nommé **proj-claims**. Vous disposez du rôle Foundry Owner, et le projet dispose d'un quota de déploiement suffisant.

    Vous devez déployer le modèle ajusté avec l'option Serverless et vérifier qu'il répond.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: open, text: { en: "Open the details of the completed fine-tuning job and select **Deploy**.", fr: "Ouvrir les détails du travail de réglage précis terminé et sélectionner **Deploy**." } }
    - { id: choose, text: { en: "Select **Serverless** and enter a deployment name.", fr: "Sélectionner **Serverless** et entrer un nom de déploiement." } }
    - { id: type, text: { en: "Choose a deployment type, configure the capacity within the quota, and create the deployment.", fr: "Choisir un type de déploiement, configurer la capacité dans les limites du quota et créer le déploiement." } }
    - { id: test, text: { en: "In the Playground, select the fine-tuned deployment and send a representative prompt.", fr: "Dans le Playground, sélectionner le déploiement ajusté et envoyer une invite représentative." } }
    - { id: base, text: { en: "In the Playground, select the base model deployment and send a representative prompt.", fr: "Dans le Playground, sélectionner le déploiement du modèle de base et envoyer une invite représentative." } }
    - { id: lora, text: { en: "Select a base deployment that uses a LoRA-enabled deployment template.", fr: "Sélectionner un déploiement de base qui utilise un modèle de déploiement compatible LoRA." } }
answer:
  sequence: [ open, choose, type, test ]
explanation:
  correct:
    en: |
      To deploy with Serverless, you open the completed job's details, select Deploy, choose Serverless, name the deployment, then choose a deployment type and capacity within your quota. To test, select the fine-tuned deployment in the Playground, not the base-model deployment, and send a representative prompt.
    fr: |
      Pour déployer avec Serverless, vous ouvrez les détails du travail terminé, sélectionnez Deploy, choisissez Serverless, nommez le déploiement, puis choisissez un type de déploiement et une capacité dans les limites de votre quota. Pour tester, sélectionnez le déploiement ajusté dans le Playground, et non celui du modèle de base, puis envoyez une invite représentative.
  options:
    base: { en: "The base-model deployment doesn't include the fine-tuning, so it doesn't confirm that the new model responds.", fr: "Le déploiement du modèle de base n'inclut pas le réglage précis : il ne confirme pas que le nouveau modèle répond." }
    lora: { en: "A LoRA-enabled base deployment is a prerequisite of Managed compute, not of Serverless.", fr: "Un déploiement de base compatible LoRA est un prérequis de Managed compute, pas de Serverless." }
references:
  - title: Deploy fine-tuned models in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-deploy
