id: ai300-5b-developer-expired
objective: "5.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam testers evaluated a fine-tuned gpt-4.1-mini model through a Developer deployment named **ft-eval** that you created yesterday morning. Today, ft-eval no longer exists, although nobody deleted it.

    The testers need one more day to finish the evaluation. The solution must minimize cost.

    What should you do?
  fr: |
    Les testeurs de Fabrikam ont évalué un modèle gpt-4.1-mini ajusté au moyen d'un déploiement Developer nommé **ft-eval** que vous avez créé hier matin. Aujourd'hui, ft-eval n'existe plus, bien que personne ne l'ait supprimé.

    Les testeurs ont besoin d'une journée de plus pour terminer l'évaluation. La solution doit réduire les coûts au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a Standard deployment of the fine-tuned model.", fr: "Créer un déploiement Standard du modèle ajusté." } }
    - { id: b, text: { en: "Run the fine-tuning job again, and deploy the new model.", fr: "Exécuter de nouveau le travail de réglage précis, et déployer le nouveau modèle." } }
    - { id: c, text: { en: "Create a provisioned deployment of the fine-tuned model.", fr: "Créer un déploiement approvisionné du modèle ajusté." } }
    - { id: d, text: { en: "Create a new Developer deployment of the fine-tuned model.", fr: "Créer un nouveau déploiement Developer du modèle ajusté." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Developer deployments have a fixed 24-hour lifetime and are removed automatically, regardless of usage. The fine-tuned model still exists, so you can redeploy it as a new Developer deployment, which bills tokens with no hourly hosting fee.
    fr: |
      Les déploiements Developer ont une durée de vie fixe de 24 heures et sont supprimés automatiquement, quelle que soit leur utilisation. Le modèle ajusté existe toujours : vous pouvez le redéployer dans un nouveau déploiement Developer, facturé au jeton sans frais d'hébergement horaires.
  options:
    a: { en: "A Standard deployment of a fine-tuned model adds an hourly hosting fee.", fr: "Un déploiement Standard d'un modèle ajusté ajoute des frais d'hébergement horaires." }
    b: { en: "Only the deployment expired; the fine-tuned model doesn't need to be trained again.", fr: "Seul le déploiement a expiré ; le modèle ajusté n'a pas besoin d'être réentraîné." }
    c: { en: "A provisioned deployment bills PTU-hours, which costs more for a one-day test.", fr: "Un déploiement approvisionné facture des heures de PTU, ce qui coûte plus cher pour un test d'une journée." }
references:
  - title: Manage fine-tuning costs in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-cost-management
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
