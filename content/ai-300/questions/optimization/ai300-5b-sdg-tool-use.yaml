id: ai300-5b-sdg-tool-use
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adventure Works builds a booking agent in a Microsoft Foundry project. The booking API is described by an OpenAPI 3.1 specification in JSON (2 MB), and the team has no real conversations yet.

    You need to generate fine-tuning data that contains multi-turn conversations with tool calls to the booking API.

    What should you use?
  fr: |
    Adventure Works développe un agent de réservation dans un projet Microsoft Foundry. L'API de réservation est décrite par une spécification OpenAPI 3.1 au format JSON (2 Mo), et l'équipe ne dispose encore d'aucune conversation réelle.

    Vous devez générer des données de réglage précis qui contiennent des conversations à plusieurs tours avec des appels d'outils vers l'API de réservation.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Simple Q&A generator with the Long answer question type", fr: "Le générateur Simple Q&A avec le type de question Long answer" } }
    - { id: b, text: { en: "The Tool use generator", fr: "Le générateur Tool use" } }
    - { id: c, text: { en: "The Simple Q&A generator with the Short answer question type", fr: "Le générateur Simple Q&A avec le type de question Short answer" } }
    - { id: d, text: { en: "A dataset created from the agent's traces", fr: "Un jeu de données créé à partir des traces de l'agent" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Tool use generator of synthetic data generation (preview) takes a valid OpenAPI 3.0.x or 3.1.x specification in JSON, under 20 MB, and simulates multi-turn conversations that call your API. Its records contain assistant `tool_calls`, `tool` messages and a top-level `tools` array.
    fr: |
      Le générateur Tool use de la génération de données synthétiques (préversion) prend une spécification OpenAPI 3.0.x ou 3.1.x valide au format JSON, de moins de 20 Mo, et simule des conversations à plusieurs tours qui appellent votre API. Ses enregistrements contiennent des `tool_calls` de l'assistant, des messages `tool` et un tableau `tools` de premier niveau.
  options:
    a: { en: "Simple Q&A turns a PDF, Markdown or text document into question and answer pairs, without tool calls.", fr: "Simple Q&A transforme un document PDF, Markdown ou texte en paires question-réponse, sans appels d'outils." }
    c: { en: "The question type only changes the length of Simple Q&A answers; it doesn't produce tool calls.", fr: "Le type de question ne change que la longueur des réponses Simple Q&A ; il ne produit pas d'appels d'outils." }
    d: { en: "A dataset from traces needs production traces of the agent, and the team has no real conversations yet.", fr: "Un jeu de données issu de traces nécessite des traces de production de l'agent, et l'équipe n'a encore aucune conversation réelle." }
references:
  - title: Generate synthetic data for fine-tuning in Microsoft Foundry (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/fine-tuning/data-generation
