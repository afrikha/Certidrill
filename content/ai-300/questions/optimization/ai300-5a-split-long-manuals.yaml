id: ai300-5a-split-long-manuals
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso indexes PDF maintenance manuals in an Azure AI Search index for a RAG assistant. The skillset contains only an Azure OpenAI Embedding skill that uses `text-embedding-3-small` and takes `/document/content` as its input.

    The indexer reports an error for every manual whose extracted text is larger than 8,000 tokens, and these manuals get no vectors. You need every manual to be vectorized, and each search result must be a passage short enough to be sent to the chat model.

    What should you do?
  fr: |
    Contoso indexe des manuels de maintenance PDF dans un index Azure AI Search pour un assistant RAG. L'ensemble de compétences contient uniquement une compétence Azure OpenAI Embedding qui utilise `text-embedding-3-small` et prend `/document/content` comme entrée.

    L'indexeur signale une erreur pour chaque manuel dont le texte extrait dépasse 8 000 jetons, et ces manuels n'obtiennent aucun vecteur. Chaque manuel doit être vectorisé, et chaque résultat de recherche doit être un passage assez court pour être envoyé au modèle de conversation.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set `dimensions` to 512 on the embedding skill and on the vector field to reduce the size of each request.", fr: "Définir `dimensions` sur 512 dans la compétence d'incorporation et dans le champ vectoriel pour réduire la taille de chaque requête." }
    - id: b
      text: { en: "Change `modelName` to `text-embedding-3-large` and set `dimensions` to 3072 on the embedding skill.", fr: "Remplacer `modelName` par `text-embedding-3-large` et définir `dimensions` sur 3072 dans la compétence d'incorporation." }
    - id: c
      text: { en: "Add a Text Split skill that splits `/document/content` into chunks, and set the input of the embedding skill to `/document/pages/*`.", fr: "Ajouter une compétence Text Split qui découpe `/document/content` en blocs, et définir l'entrée de la compétence d'incorporation sur `/document/pages/*`." }
    - id: d
      text: { en: "Change the algorithm of the vector profile used by the vector field from `hnsw` to `exhaustiveKnn`.", fr: "Remplacer `hnsw` par `exhaustiveKnn` comme algorithme du profil vectoriel utilisé par le champ vectoriel." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Azure OpenAI Embedding skill accepts at most 8,000 tokens and returns an error for longer text. A Text Split skill placed before it produces chunks (typically named `pages`), and the embedding skill then vectorizes each chunk from `/document/pages/*`. The chunks are also passages small enough to ground the chat model.
    fr: |
      La compétence Azure OpenAI Embedding accepte au maximum 8 000 jetons et renvoie une erreur pour un texte plus long. Une compétence Text Split placée avant elle produit des blocs (généralement nommés `pages`), puis la compétence d'incorporation vectorise chaque bloc à partir de `/document/pages/*`. Ces blocs sont aussi des passages assez petits pour ancrer le modèle de conversation.
  options:
    b:
      en: "`text-embedding-3-large` has the same input limit; `dimensions` sets the size of the output vector, not the length of the input text."
      fr: "`text-embedding-3-large` a la même limite d'entrée ; `dimensions` fixe la taille du vecteur de sortie, pas la longueur du texte d'entrée."
    a:
      en: |
        Reducing the output dimensions doesn't shorten the text sent to the model, so the long manuals still fail.
      fr: |
        Réduire les dimensions de sortie ne raccourcit pas le texte envoyé au modèle ; les longs manuels échouent toujours.
    d:
      en: |
        The vector search algorithm is used at query time; it has no effect on the input limit of the embedding skill at indexing time.
      fr: |
        L'algorithme de recherche vectorielle sert au moment de la requête ; il n'a aucun effet sur la limite d'entrée de la compétence d'incorporation lors de l'indexation.
references:
  - title: Azure OpenAI Embedding skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-azure-openai-embedding
  - title: Chunk large documents for RAG and vector search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents
