id: ai300-5a-rag-evaluator-map
objective: "5.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam evaluates a RAG application in a Microsoft Foundry project before and after a retrieval change. The test dataset contains, for each row, `query`, `context`, `response`, `ground_truth`, `retrieval_ground_truth` and `retrieved_documents`.

    Which built-in evaluator should you use for each requirement? To answer, drag the appropriate evaluators to the correct requirements. Each evaluator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam évalue une application RAG dans un projet Microsoft Foundry avant et après une modification de la récupération. Le jeu de données de test contient, pour chaque ligne, `query`, `context`, `response`, `ground_truth`, `retrieval_ground_truth` et `retrieved_documents`.

    Quel évaluateur intégré devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les évaluateurs appropriés vers les exigences correspondantes. Chaque évaluateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: grd, text: Groundedness }
    - { id: rel, text: Relevance }
    - { id: comp, text: Response Completeness }
    - { id: docret, text: Document Retrieval }
    - { id: flu, text: Fluency }
  targets:
    - { id: nofab, text: { en: "Check that each response contains no claims absent from the retrieved context", fr: "Vérifier que chaque réponse ne contient aucune affirmation absente du contexte récupéré" } }
    - { id: answers, text: { en: "Check that each response directly and accurately addresses the query", fr: "Vérifier que chaque réponse traite directement et avec exactitude la requête" } }
    - { id: covers, text: { en: "Check that each response covers the information of the expected answer", fr: "Vérifier que chaque réponse couvre les informations de la réponse attendue" } }
    - { id: ndcg, text: { en: "Compute NDCG@3 of the retrieved documents against human relevance labels", fr: "Calculer le NDCG@3 des documents récupérés par rapport à des étiquettes de pertinence humaines" } }
answer:
  mapping: { nofab: grd, answers: rel, covers: comp, ndcg: docret }
explanation:
  correct:
    en: |
      Groundedness measures whether the response stays within the context without fabrication (precision). Relevance measures how accurately and completely the response addresses the query. Response Completeness (preview) compares the response with the ground truth to measure whether it covers the expected information (recall). Document Retrieval compares `retrieved_documents` with `retrieval_ground_truth` and returns search metrics such as NDCG@3, XDCG@3 and Fidelity.
    fr: |
      Groundedness mesure si la réponse reste dans les limites du contexte sans invention (précision). Relevance mesure avec quelle exactitude et quelle complétude la réponse traite la requête. Response Completeness (préversion) compare la réponse à la vérité terrain pour mesurer si elle couvre les informations attendues (rappel). Document Retrieval compare `retrieved_documents` à `retrieval_ground_truth` et renvoie des métriques de recherche comme NDCG@3, XDCG@3 et Fidelity.
  options:
    flu:
      en: |
        Fluency is a general-purpose evaluator of language quality; it doesn't measure grounding, relevance or retrieval.
      fr: |
        Fluency est un évaluateur généraliste de la qualité de la langue ; il ne mesure ni l'ancrage, ni la pertinence, ni la récupération.
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
