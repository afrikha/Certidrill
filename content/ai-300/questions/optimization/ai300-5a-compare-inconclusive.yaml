id: ai300-5a-compare-inconclusive
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys tests a new chunking strategy for its RAG application in a Microsoft Foundry project. You run one evaluation for the current configuration and one for the new configuration, both on the same 12-row test dataset with the Groundedness and Retrieval evaluators.

    In the portal, you select both runs, select **Compare**, and set the current configuration's run as the baseline. Both evaluator cells show **Inconclusive**. You need a comparison that can support a decision.

    What should you do?
  fr: |
    Tailspin Toys teste une nouvelle stratégie de segmentation pour son application RAG dans un projet Microsoft Foundry. Vous exécutez une évaluation pour la configuration actuelle et une pour la nouvelle configuration, toutes deux sur le même jeu de données de test de 12 lignes avec les évaluateurs Groundedness et Retrieval.

    Dans le portail, vous sélectionnez les deux exécutions, vous sélectionnez **Compare** et vous définissez l'exécution de la configuration actuelle comme référence. Les cellules des deux évaluateurs affichent **Inconclusive**. Vous avez besoin d'une comparaison qui permette de prendre une décision.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Lower the pass threshold of both evaluators from 3 to 2, and rerun only the new configuration.", fr: "Abaisser le seuil de réussite des deux évaluateurs de 3 à 2, et réexécuter uniquement la nouvelle configuration." }
    - id: b
      text: { en: "Keep the comparison view open until the service collects enough production traffic to complete it.", fr: "Laisser la vue de comparaison ouverte jusqu'à ce que le service collecte assez de trafic de production pour la compléter." }
    - id: c
      text: { en: "Set the new configuration's run as the baseline instead, and regenerate the comparison view.", fr: "Définir plutôt l'exécution de la nouvelle configuration comme référence, et régénérer la vue de comparaison." }
    - id: d
      text: { en: "Add more representative rows to the test dataset, rerun both evaluations, and compare the runs again.", fr: "Ajouter davantage de lignes représentatives au jeu de données de test, réexécuter les deux évaluations et comparer de nouveau les exécutions." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The comparison view uses statistical t-testing, and Inconclusive means that there are too few examples or that the p-value is 0.05 or higher. Running both configurations on a larger representative dataset gives the test enough samples to show whether a difference is significant.
    fr: |
      La vue de comparaison utilise un test t statistique, et Inconclusive signifie que les exemples sont trop peu nombreux ou que la valeur p est supérieure ou égale à 0,05. Exécuter les deux configurations sur un jeu de données représentatif plus grand donne au test assez d'échantillons pour montrer si une différence est significative.
  options:
    c:
      en: |
        Swapping the baseline only changes the reference point; the sample size, and therefore the result, stays the same.
      fr: |
        Inverser la référence ne change que le point de comparaison ; la taille de l'échantillon, et donc le résultat, reste la même.
    a:
      en: |
        Changing the pass threshold changes pass or fail labels, not the amount of evidence; rerunning only one configuration also breaks the like-for-like comparison.
      fr: |
        Modifier le seuil de réussite change les étiquettes de réussite ou d'échec, pas la quantité de preuves ; réexécuter une seule configuration rompt aussi la comparaison à conditions égales.
    b:
      en: |
        The comparison is computed from the selected evaluation runs only, and the view isn't saved or updated over time.
      fr: |
        La comparaison est calculée uniquement à partir des exécutions d'évaluation sélectionnées, et la vue n'est ni enregistrée ni mise à jour au fil du temps.
references:
  - title: View evaluation results in the Microsoft Foundry portal
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluate-results
