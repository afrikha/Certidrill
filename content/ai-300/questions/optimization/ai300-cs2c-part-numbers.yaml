id: ai300-cs2c-part-numbers
objective: "5.1.3"
type: single
caseStudy: ai300-cs2c-adventure-works
difficulty: 1
status: draft
stem:
  en: |
    You need to change the query that RideHelp sends to srch-aw to meet retrieval requirement 2.

    What should you do?
  fr: |
    Vous devez modifier la requête que RideHelp envoie à srch-aw pour respecter l'exigence de récupération 2.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Increase the `k` value of the vector query from 5 to 50 so that more chunks are retrieved for each question."
        fr: "Augmenter la valeur `k` de la requête vectorielle de 5 à 50 pour récupérer davantage de blocs pour chaque question."
    - id: b
      text:
        en: "Set `exhaustive` to true in the vector query so that every vector of contentVector is compared with the question."
        fr: "Définir `exhaustive` sur true dans la requête vectorielle pour comparer chaque vecteur de contentVector à la question."
    - id: c
      text:
        en: "Add the question as the `search` parameter of the same request so that the full-text and vector results are merged."
        fr: "Ajouter la question comme paramètre `search` de la même requête pour fusionner les résultats en texte intégral et vectoriels."
    - id: d
      text:
        en: "Replace the embedding model with a model that has more dimensions so that the vectors capture more detail."
        fr: "Remplacer le modèle d'incorporation par un modèle doté de plus de dimensions pour que les vecteurs capturent plus de détails."
answer: { optionId: c }
explanation:
  correct:
    en: "A request that contains both a `search` string and `vectorQueries` is a hybrid query: the full-text query matches the exact part number in the content field, the vector query keeps semantic matching, and Reciprocal Rank Fusion (RRF) merges both result sets into one ranked list."
    fr: "Une requête qui contient à la fois une chaîne `search` et `vectorQueries` est une requête hybride : la requête en texte intégral trouve la référence de pièce exacte dans le champ content, la requête vectorielle conserve la correspondance sémantique, et la fusion de rangs réciproques (RRF) combine les deux jeux de résultats en une seule liste classée."
  options:
    a: { en: "More vector matches are still ranked only by vector similarity; no part of the query matches the exact part number as a keyword.", fr: "Davantage de correspondances vectorielles restent classées uniquement selon la similarité vectorielle ; aucune partie de la requête ne recherche la référence exacte comme mot clé." }
    b: { en: "Exhaustive KNN only replaces the approximate HNSW search; the ranking is still based on vector similarity.", fr: "La recherche KNN exhaustive remplace seulement la recherche HNSW approximative ; le classement reste fondé sur la similarité vectorielle." }
    d: { en: "More dimensions do not add keyword matching, and changing the model requires re-vectorizing the whole index.", fr: "Plus de dimensions n'ajoutent pas de correspondance par mots clés, et changer de modèle oblige à revectoriser tout l'index." }
references:
  - title: Create a hybrid query in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-how-to-query
  - title: Create a vector query in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-query
