id: ai300-5a-chunk-context
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a RAG assistant that queries an Azure AI Search index of HR policies. The skillset uses a Text Split skill with `textSplitMode` set to `sentences`, followed by an Azure OpenAI Embedding skill. For each question, the assistant sends a vector query and passes the top five chunks to the chat model. This limit of five chunks must not change.

    Reviewers report that answers often miss conditions stated in the sentences around the retrieved sentence. You need to improve the context that each retrieved chunk provides.

    What should you do?
  fr: |
    Northwind Traders dispose d'un assistant RAG qui interroge un index Azure AI Search de politiques RH. L'ensemble de compétences utilise une compétence Text Split dont `textSplitMode` est défini sur `sentences`, suivie d'une compétence Azure OpenAI Embedding. Pour chaque question, l'assistant envoie une requête vectorielle et transmet les cinq premiers blocs au modèle de conversation. Cette limite de cinq blocs ne doit pas changer.

    Des réviseurs signalent que les réponses omettent souvent des conditions énoncées dans les phrases qui entourent la phrase récupérée. Vous devez améliorer le contexte fourni par chaque bloc récupéré.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set `weight` to 2.0 in the vector query to increase the importance of the vector results.", fr: "Définir `weight` sur 2.0 dans la requête vectorielle pour augmenter l'importance des résultats vectoriels." }
    - id: b
      text: { en: "Set `textSplitMode` to `pages`, `maximumPageLength` to 2000 and `pageOverlapLength` to 500, and then reset and rerun the indexer.", fr: "Définir `textSplitMode` sur `pages`, `maximumPageLength` sur 2000 et `pageOverlapLength` sur 500, puis réinitialiser et réexécuter l'indexeur." }
    - id: c
      text: { en: "Set `exhaustive` to `true` in the vector query so that the exact nearest neighbors are returned.", fr: "Définir `exhaustive` sur `true` dans la requête vectorielle pour que les plus proches voisins exacts soient renvoyés." }
    - id: d
      text: { en: "Increase `efConstruction` of the HNSW configuration from 400 to 800, and then rebuild the index.", fr: "Faire passer `efConstruction` de la configuration HNSW de 400 à 800, puis reconstruire l'index." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In `sentences` mode, each chunk is a single sentence, which often lacks the context needed to answer. Learn recommends larger chunks with enough overlap, and suggests `pages` mode with a 2,000-character maximum and a 500-character overlap as a starting point. Rerunning the indexer regenerates the chunks and their embeddings, and the five retrieved chunks then carry more context.
    fr: |
      En mode `sentences`, chaque bloc est une seule phrase, qui manque souvent du contexte nécessaire pour répondre. Learn recommande des blocs plus grands avec un chevauchement suffisant, et propose comme point de départ le mode `pages` avec un maximum de 2 000 caractères et un chevauchement de 500 caractères. La réexécution de l'indexeur régénère les blocs et leurs incorporations, et les cinq blocs récupérés apportent alors plus de contexte.
  options:
    c:
      en: |
        Exhaustive KNN returns the exact nearest neighbors, but they are still single-sentence chunks without their surrounding context.
      fr: |
        La recherche KNN exhaustive renvoie les plus proches voisins exacts, mais ce sont toujours des blocs d'une seule phrase, sans leur contexte.
    d:
      en: "`efConstruction` changes the quality of the HNSW graph, not the content of the chunks."
      fr: "`efConstruction` modifie la qualité du graphe HNSW, pas le contenu des blocs."
    a:
      en: |
        A weight only changes how a vector query contributes to RRF when several queries are fused; it doesn't change what a chunk contains.
      fr: |
        Un poids ne change que la contribution d'une requête vectorielle à la fusion RRF lorsque plusieurs requêtes sont fusionnées ; il ne change pas le contenu d'un bloc.
references:
  - title: Chunk large documents for RAG and vector search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents
  - title: Relevance in vector search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-ranking
