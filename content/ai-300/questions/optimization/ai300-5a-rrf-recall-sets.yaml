id: ai300-5a-rrf-recall-sets
objective: "5.1.3"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Contoso has an Azure AI Search index that contains a searchable text field named `content` and two vector fields named `contentVector` and `titleVector`.

    A RAG assistant sends a hybrid query that contains a `search` string and one vector query whose `fields` property is set to `"contentVector, titleVector"`.

    How many result sets does Reciprocal Rank Fusion (RRF) merge to produce the ranked results?
  fr: |
    Contoso dispose d'un index Azure AI Search qui contient un champ texte pouvant faire l'objet d'une recherche nommé `content` et deux champs vectoriels nommés `contentVector` et `titleVector`.

    Un assistant RAG envoie une requête hybride qui contient une chaîne `search` et une requête vectorielle dont la propriété `fields` est définie sur `"contentVector, titleVector"`.

    Combien de jeux de résultats Reciprocal Rank Fusion (RRF) fusionne-t-il pour produire les résultats classés ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "4" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      RRF runs whenever a request has more than one query execution, and each targeted vector field counts as an execution. The full-text query produces one result set and the vector query targeting two vector fields produces two, so RRF merges three result sets.
    fr: |
      RRF s'exécute dès qu'une requête comporte plus d'une exécution, et chaque champ vectoriel ciblé compte comme une exécution. La requête en texte intégral produit un jeu de résultats et la requête vectorielle qui cible deux champs vectoriels en produit deux : RRF fusionne donc trois jeux de résultats.
  options:
    a:
      en: |
        A single result set would need no fusion; here the text query and the vector query run separately.
      fr: |
        Un seul jeu de résultats ne nécessiterait aucune fusion ; ici, la requête texte et la requête vectorielle s'exécutent séparément.
    b:
      en: |
        The vector query targets two vector fields, and each field produces its own result set in addition to the full-text results.
      fr: |
        La requête vectorielle cible deux champs vectoriels, et chaque champ produit son propre jeu de résultats en plus des résultats en texte intégral.
    d:
      en: |
        Only one text query and two vector field executions take place; the text field isn't counted twice.
      fr: |
        Seules une requête texte et deux exécutions sur des champs vectoriels ont lieu ; le champ texte n'est pas compté deux fois.
references:
  - title: Relevance scoring in hybrid search using Reciprocal Rank Fusion (RRF)
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-ranking
