id: ai300-5b-synthetic-test-leakage
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso generated 1,000 question and answer pairs from its product manual with the Simple Q&A generator and the automatic 80/20 train and validation split. A fine-tuned gpt-4.1-mini model scores much higher than the base model on the validation split.

    Before you approve the model for production, you need a reliable estimate of how the model will perform for customers, free of evaluation leakage.

    What should you do?
  fr: |
    Contoso a généré 1 000 paires question-réponse à partir de son manuel produit avec le générateur Simple Q&A et la répartition automatique 80/20 entre entraînement et validation. Un modèle gpt-4.1-mini ajusté obtient des scores bien supérieurs à ceux du modèle de base sur la partie de validation.

    Avant d'approuver le modèle pour la production, vous avez besoin d'une estimation fiable de ses performances pour les clients, exempte de fuite d'évaluation.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Generate a new test set from the same manual with a different generator model, and evaluate both models on it.", fr: "Générer un nouveau jeu de test à partir du même manuel avec un autre modèle générateur, et évaluer les deux modèles dessus." } }
    - { id: b, text: { en: "Evaluate both models on the training split, because it contains more examples than the validation split.", fr: "Évaluer les deux modèles sur la partie d'entraînement, car elle contient plus d'exemples que la partie de validation." } }
    - { id: c, text: { en: "Build a test set from support-history questions that were never used for training, and evaluate both models on it.", fr: "Constituer un jeu de test à partir de questions de l'historique du support jamais utilisées pour l'entraînement, et évaluer les deux modèles dessus." } }
    - { id: d, text: { en: "Regenerate the data with a 90/10 split, retrain, and evaluate both models on the new validation split.", fr: "Régénérer les données avec une répartition 90/10, réentraîner et évaluer les deux modèles sur la nouvelle partie de validation." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Training, validation and final test data must stay separate to avoid evaluation leakage, and Microsoft recommends evaluating a model trained on synthetic data on real-world tasks. A held-out set of real questions, used for both the fine-tuned and the base model, gives a fair comparison with the baseline.
    fr: |
      Les données d'entraînement, de validation et de test final doivent rester séparées pour éviter la fuite d'évaluation, et Microsoft recommande d'évaluer un modèle entraîné sur des données synthétiques sur des tâches réelles. Un jeu réservé de vraies questions, utilisé pour le modèle ajusté comme pour le modèle de base, permet une comparaison équitable avec la référence.
  options:
    a: { en: "Questions generated from the same manual resemble the training data, so the score still doesn't reflect real customer questions.", fr: "Des questions générées à partir du même manuel ressemblent aux données d'entraînement : le score ne reflète toujours pas les vraies questions des clients." }
    b: { en: "Scores on the training data measure memorization, not quality on new questions.", fr: "Les scores sur les données d'entraînement mesurent la mémorisation, pas la qualité sur de nouvelles questions." }
    d: { en: "A different split ratio of the same synthetic data still measures the model on questions generated from the same manual, not on real customer questions.", fr: "Un autre ratio de répartition des mêmes données synthétiques mesure toujours le modèle sur des questions générées à partir du même manuel, pas sur de vraies questions de clients." }
references:
  - title: Fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
  - title: Generate synthetic data for fine-tuning in Microsoft Foundry (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/fine-tuning/data-generation
