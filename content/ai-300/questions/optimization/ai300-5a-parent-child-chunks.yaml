id: ai300-5a-parent-child-chunks
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Health indexes multi-page treatment protocols in Azure AI Search for a clinical RAG assistant. With 1,000-token chunks, the retrieved chunks match the questions precisely, but the answers lack the surrounding protocol context. With one chunk per protocol, retrieval returns many loosely related protocols.

    You need precise matching on small passages while still providing the complete protocol to the chat model as context.

    Which chunking strategy should you implement?
  fr: |
    Northwind Health indexe des protocoles de traitement de plusieurs pages dans Azure AI Search pour un assistant RAG clinique. Avec des blocs de 1 000 jetons, les blocs récupérés correspondent précisément aux questions, mais les réponses manquent du contexte du protocole. Avec un bloc par protocole, la récupération renvoie de nombreux protocoles vaguement liés.

    Vous avez besoin d'une correspondance précise sur de petits passages tout en fournissant le protocole complet au modèle de conversation comme contexte.

    Quelle stratégie de segmentation devez-vous implémenter ?
body:
  options:
    - id: a
      text: { en: "Fixed-size chunking: keep the 1,000-token chunks and add a 25 percent overlap between consecutive chunks of a protocol.", fr: "Segmentation de taille fixe : conserver les blocs de 1 000 jetons et ajouter un chevauchement de 25 % entre les blocs consécutifs d'un protocole." }
    - id: b
      text: { en: "Hierarchical chunking: embed child chunks that reference their protocol through a `parent_id`, search the children, then fetch each parent.", fr: "Segmentation hiérarchique : incorporer des blocs enfants qui référencent leur protocole par un `parent_id`, rechercher les enfants, puis récupérer chaque parent." }
    - id: c
      text: { en: "Sentence-based chunking: split each protocol into single sentences so that each search result maps to one precise statement.", fr: "Segmentation par phrases : découper chaque protocole en phrases isolées pour que chaque résultat corresponde à un énoncé précis." }
    - id: d
      text: { en: "Semantic chunking: split each protocol where the similarity between adjacent sentences drops below a tuned threshold.", fr: "Segmentation sémantique : découper chaque protocole là où la similarité entre phrases adjacentes passe sous un seuil ajusté." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Hierarchical (parent-child) chunking indexes small child chunks, for example 500 to 1,000 tokens, that are embedded for precise matching, plus parent documents that hold the complete protocol and are referenced by a `parent_id`. The application searches the children only, then retrieves each parent to give the model its context. The trade-off is an index that can grow to about twice the content size.
    fr: |
      La segmentation hiérarchique (parent-enfant) indexe de petits blocs enfants, par exemple de 500 à 1 000 jetons, incorporés pour une correspondance précise, ainsi que des documents parents qui contiennent le protocole complet et sont référencés par un `parent_id`. L'application ne recherche que les enfants, puis récupère chaque parent pour fournir son contexte au modèle. La contrepartie est un index qui peut atteindre environ deux fois la taille du contenu.
  options:
    a:
      en: |
        Overlap preserves context at chunk boundaries, but each retrieved chunk still contains only a small part of the protocol.
      fr: |
        Le chevauchement préserve le contexte aux limites des blocs, mais chaque bloc récupéré ne contient toujours qu'une petite partie du protocole.
    c:
      en: |
        Single sentences make each result even smaller and give the model less context, not more.
      fr: |
        Des phrases isolées rendent chaque résultat encore plus petit et donnent moins de contexte au modèle, pas plus.
    d:
      en: |
        Semantic chunking produces topic-coherent chunks, but a chunk still doesn't give the model the complete protocol.
      fr: |
        La segmentation sémantique produit des blocs cohérents par sujet, mais un bloc ne fournit toujours pas le protocole complet au modèle.
references:
  - title: Optimize chunking and embedding strategies
    url: https://learn.microsoft.com/en-us/training/modules/aaai-implement-advanced-rag-azure-ai-search/5-optimize-chunk-embed-strategies
