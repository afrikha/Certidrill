id: ai300-5b-rft-spending-limit
objective: "5.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a reinforcement fine-tuning (RFT) job of o4-mini in a Microsoft Foundry project. The job uses a `score_model` grader. The finance team asks how the job's spending limit and billing work.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute un travail de réglage précis par renforcement (RFT) d'o4-mini dans un projet Microsoft Foundry. Le travail utilise un évaluateur (grader) `score_model`. L'équipe financière demande comment fonctionnent la limite de dépense du travail et sa facturation.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "When the job reaches its spending limit, the job is canceled and its checkpoints are deleted."
        fr: "Quand le travail atteint sa limite de dépense, il est annulé et ses points de contrôle sont supprimés."
    - id: s2
      text:
        en: "If you resume the job after it reaches the spending limit, training continues without another cost-based pause."
        fr: "Si vous reprenez le travail après qu'il a atteint la limite de dépense, l'entraînement continue sans nouvelle pause liée au coût."
    - id: s3
      text:
        en: "The time that the job spends in the queue is billed at the hourly training rate."
        fr: "Le temps que le travail passe dans la file d'attente est facturé au tarif horaire d'entraînement."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      When an RFT job reaches its per-job limit on combined training and grading costs, training pauses and a deployable checkpoint is created, so you can review the job before you decide to resume. If you resume, billing continues without another cost-based pause. RFT bills training hours plus grader tokens; time in the queue isn't billed.
    fr: |
      Quand un travail RFT atteint sa limite par travail sur les coûts cumulés d'entraînement et d'évaluation, l'entraînement se met en pause et un point de contrôle déployable est créé : vous pouvez examiner le travail avant de décider de le reprendre. Si vous le reprenez, la facturation continue sans nouvelle pause liée au coût. RFT facture les heures d'entraînement plus les jetons de l'évaluateur ; le temps en file d'attente n'est pas facturé.
references:
  - title: Manage fine-tuning costs in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-cost-management
