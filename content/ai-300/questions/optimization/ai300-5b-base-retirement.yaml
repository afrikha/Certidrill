id: ai300-5b-base-retirement
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys serves a fine-tuned model in production. Microsoft announces the retirement of the base model version that the fine-tuned model was trained on. A newer version of the base model supports the same fine-tuning method.

    You need to keep the production solution supported without lowering its quality.

    What should you do?
  fr: |
    Tailspin Toys sert un modèle ajusté en production. Microsoft annonce la mise hors service de la version du modèle de base sur laquelle le modèle ajusté a été entraîné. Une version plus récente du modèle de base prend en charge la même méthode de réglage précis.

    Vous devez maintenir la prise en charge de la solution de production sans dégrader sa qualité.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Attach the existing fine-tuned weights to a deployment of the newer base model version.", fr: "Associer les poids ajustés existants à un déploiement de la version plus récente du modèle de base." } }
    - { id: b, text: { en: "Convert the existing deployment to provisioned throughput to keep the current version.", fr: "Convertir le déploiement existant en débit approvisionné pour conserver la version actuelle." } }
    - { id: c, text: { en: "Fine-tune the newer version with the same data, compare it with the current model, then deploy it.", fr: "Ajuster la version plus récente avec les mêmes données, la comparer au modèle actuel, puis la déployer." } }
    - { id: d, text: { en: "Increase the capacity of the existing deployment before the retirement date.", fr: "Augmenter la capacité du déploiement existant avant la date de mise hors service." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft advises reassessing a fine-tuned model when its base model nears retirement, and retraining and redeploying may be needed. Fine-tuned weights are tied to the exact base model and version they were trained on, so you train a new model on the newer version and compare it with the current one on held-out data before switching.
    fr: |
      Microsoft conseille de réévaluer un modèle ajusté quand son modèle de base approche de la mise hors service, et un réentraînement suivi d'un redéploiement peut être nécessaire. Les poids ajustés sont liés au modèle de base et à la version exacts sur lesquels ils ont été entraînés : vous entraînez donc un nouveau modèle sur la version plus récente et le comparez au modèle actuel sur des données réservées avant de basculer.
  options:
    a: { en: "An adapter isn't interchangeable across base models; it only fits the exact base model and version it was trained on.", fr: "Un adaptateur n'est pas interchangeable entre modèles de base ; il ne convient qu'au modèle de base et à la version exacts sur lesquels il a été entraîné." }
    b: { en: "The deployment type doesn't change the lifecycle of the base model version.", fr: "Le type de déploiement ne change pas le cycle de vie de la version du modèle de base." }
    d: { en: "More capacity doesn't change the retirement of the base model version.", fr: "Davantage de capacité ne change pas la mise hors service de la version du modèle de base." }
references:
  - title: Training in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
