id: ai300-cs1c-embedding-choice
objective: "5.1.2"
type: yesno_statements
caseStudy: ai300-cs1c-trey-research
difficulty: 1
status: draft
stem:
  en: |
    You are planning the embedding model evaluation for RadAssist. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez l'évaluation du modèle d'incorporation de RadAssist. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Because the internal abbreviations can't be found on the internet, a general embedding model is likely to represent them well.
        fr: Comme les abréviations internes sont introuvables sur Internet, un modèle d'incorporation général a de bonnes chances de bien les représenter.
    - id: s2
      text:
        en: If you replace text-embedding-3-small with another model, RadAssist must embed both the queries and the chunks of reports-idx with the new model.
        fr: Si vous remplacez text-embedding-3-small par un autre modèle, RadAssist doit incorporer à la fois les requêtes et les blocs de reports-idx avec le nouveau modèle.
    - id: s3
      text:
        en: If no domain-specific model performs well on the reports, you can fine-tune a general embedding model with the vocabulary of the hospital network.
        fr: Si aucun modèle propre au domaine n'est performant sur les comptes rendus, vous pouvez ajuster un modèle d'incorporation général avec le vocabulaire du réseau hospitalier.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Learn suggests checking whether the entities and keywords of your content can be found on the internet; if they can't, the content is domain-specific and a general model probably doesn't know them, because words outside its vocabulary are split into subwords that give a poorer vector match. In a RAG solution, the query is embedded with the same model as the chunks. When no domain-specific model exists or performs well, a general embedding model can be fine-tuned with the domain vocabulary, then evaluated carefully.
    fr: Learn suggère de vérifier si les entités et les mots clés du contenu se trouvent sur Internet ; si ce n'est pas le cas, le contenu est propre à un domaine et un modèle général ne les connaît probablement pas, car les mots absents de son vocabulaire sont découpés en sous-mots qui donnent une moins bonne correspondance vectorielle. Dans une solution RAG, la requête est incorporée avec le même modèle que les blocs. Quand aucun modèle propre au domaine n'existe ou n'est performant, un modèle d'incorporation général peut être ajusté avec le vocabulaire du domaine, puis évalué avec soin.
references:
  - title: Develop a RAG Solution on Azure - Generate Embeddings Phase
    url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/rag/rag-generate-embeddings
