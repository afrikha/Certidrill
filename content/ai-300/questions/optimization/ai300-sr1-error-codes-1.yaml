id: ai300-sr1-error-codes-1
objective: "5.1.3"
type: series_yesno
series: ai300-sr1-error-codes
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You add semantic ranking to the full-text query.
  fr: Vous ajoutez le classement sémantique à la requête en texte intégral.
body:
  solution:
    en: |
      You change the query body to the following, where `<user question>` is the text typed by the user:

      ```json
      {
        "search": "<user question>",
        "queryType": "semantic",
        "semanticConfiguration": "kb-semantic",
        "top": 10
      }
      ```
    fr: |
      Vous remplacez le corps de la requête par le suivant, où `<user question>` est le texte saisi par l'utilisateur :

      ```json
      {
        "search": "<user question>",
        "queryType": "semantic",
        "semanticConfiguration": "kb-semantic",
        "top": 10
      }
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      The semantic ranker only reranks the top 50 results of the initial BM25 full-text query; it doesn't rerun the query over the whole index to find conceptually similar chunks. A chunk that shares no terms with a paraphrased question never enters the BM25 result set, so the semantic ranker can't surface it. The second requirement isn't met.
    fr: |
      Le classeur sémantique reclasse uniquement les 50 premiers résultats de la requête initiale en texte intégral BM25 ; il ne réexécute pas la requête sur tout l'index pour trouver des blocs conceptuellement proches. Un bloc qui ne partage aucun terme avec une question reformulée n'entre jamais dans le jeu de résultats BM25 : le classeur sémantique ne peut donc pas le faire remonter. La deuxième exigence n'est pas satisfaite.
references:
  - title: Semantic Ranking Overview - Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
