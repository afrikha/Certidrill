id: ai300-5b-grader-type
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders plans a reinforcement fine-tuning (RFT) job of o4-mini in a Microsoft Foundry project. The model must return one shipping category per request, such as `Express` or `Freight`.

    Each training record contains the expected category in a field named `reference_answer`. A response must earn a reward only when it matches the expected category exactly, including letter case.

    Which grader configuration should you use?
  fr: |
    Northwind Traders prévoit un travail de réglage précis par renforcement (RFT) d'o4-mini dans un projet Microsoft Foundry. Le modèle doit renvoyer une catégorie d'expédition par demande, par exemple `Express` ou `Freight`.

    Chaque enregistrement d'entraînement contient la catégorie attendue dans un champ nommé `reference_answer`. Une réponse ne doit obtenir de récompense que si elle correspond exactement à la catégorie attendue, casse comprise.

    Quelle configuration d'évaluateur (grader) devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A `text_similarity` grader with `evaluation_metric` set to `fuzzy_match`", fr: "Un évaluateur `text_similarity` avec `evaluation_metric` défini sur `fuzzy_match`" } }
    - { id: b, text: { en: "A `string_check` grader with `operation` set to `ilike`", fr: "Un évaluateur `string_check` avec `operation` défini sur `ilike`" } }
    - { id: c, text: { en: "A `score_model` grader with `range` set to `[0, 1]`", fr: "Un évaluateur `score_model` avec `range` défini sur `[0, 1]`" } }
    - { id: d, text: { en: "A `string_check` grader with `operation` set to `eq`", fr: "Un évaluateur `string_check` avec `operation` défini sur `eq`" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The `string_check` grader compares an input with a reference. The `eq` operation returns 1 only when both strings are equal, and it's case-sensitive, so `{{item.reference_answer}}` compared with `{{sample.output_text}}` meets the exact-match requirement at no grading-model cost.
    fr: |
      L'évaluateur `string_check` compare une entrée à une référence. L'opération `eq` ne renvoie 1 que si les deux chaînes sont égales, en respectant la casse : comparer `{{item.reference_answer}}` à `{{sample.output_text}}` répond à l'exigence de correspondance exacte, sans coût de modèle évaluateur.
  options:
    a: { en: "`fuzzy_match` rewards approximate similarity, so near-misses would earn partial rewards.", fr: "`fuzzy_match` récompense une similarité approximative : des réponses presque correctes obtiendraient une récompense partielle." }
    b: { en: "`ilike` checks that the input contains the reference and ignores letter case.", fr: "`ilike` vérifie que l'entrée contient la référence et ignore la casse." }
    c: { en: "A model grader applies a rubric and adds grading-token cost; it doesn't guarantee an exact, case-sensitive match.", fr: "Un modèle évaluateur applique une grille et ajoute un coût en jetons ; il ne garantit pas une correspondance exacte sensible à la casse." }
references:
  - title: Fine-tune a model with reinforcement fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reinforcement-fine-tuning
