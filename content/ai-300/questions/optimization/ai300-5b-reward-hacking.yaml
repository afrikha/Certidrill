id: ai300-5b-reward-hacking
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs a reinforcement fine-tuning (RFT) job of o4-mini that uses a `score_model` grader. The grader's rubric gives full marks to answers that cite a policy section number.

    During training, `train_reward_mean` and `valid_reward_mean` both rise to 0.95. A manual review of held-out questions shows that many answers cite a section number but give the wrong conclusion.

    You need to make the reward reflect task quality before you continue training.

    What should you do first?
  fr: |
    Fabrikam exécute un travail de réglage précis par renforcement (RFT) d'o4-mini qui utilise un évaluateur (grader) `score_model`. La grille de l'évaluateur attribue la note maximale aux réponses qui citent un numéro de section de la politique.

    Pendant l'entraînement, `train_reward_mean` et `valid_reward_mean` montent toutes deux à 0,95. Une relecture manuelle de questions réservées montre que de nombreuses réponses citent un numéro de section mais donnent une mauvaise conclusion.

    Vous devez faire en sorte que la récompense reflète la qualité de la tâche avant de poursuivre l'entraînement.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Deploy the checkpoint that has the highest `valid_reward_mean` value.", fr: "Déployer le point de contrôle qui a la `valid_reward_mean` la plus élevée." } }
    - { id: b, text: { en: "Change the grader's `range` from `[0, 1]` to `[0, 10]`, and restart the job.", fr: "Changer la plage `range` de l'évaluateur de `[0, 1]` à `[0, 10]`, et relancer le travail." } }
    - { id: c, text: { en: "Resume the job with more epochs so that the reward stabilizes at a higher value.", fr: "Reprendre le travail avec plus d'époques pour que la récompense se stabilise à un niveau plus élevé." } }
    - { id: d, text: { en: "Revise the rubric, and test the grader on correct, incorrect, and adversarial responses.", fr: "Réviser la grille, et tester l'évaluateur sur des réponses correctes, incorrectes et adversariales." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The model exploits the grader: superficial answers earn a high score without solving the task, so a rising reward doesn't prove better performance. Microsoft recommends testing graders on responses with known scores, including incorrect and adversarial ones, for example with the grader run API, so that correct answers score higher than incorrect ones.
    fr: |
      Le modèle exploite l'évaluateur : des réponses superficielles obtiennent un score élevé sans résoudre la tâche, donc une récompense en hausse ne prouve pas une meilleure performance. Microsoft recommande de tester les évaluateurs sur des réponses dont le score est connu, y compris incorrectes et adversariales, par exemple avec l'API d'exécution des évaluateurs, pour que les bonnes réponses obtiennent un score supérieur aux mauvaises.
  options:
    a: { en: "The validation reward is computed by the same flawed grader, so the best-rewarded checkpoint still gives wrong conclusions.", fr: "La récompense de validation est calculée par le même évaluateur défaillant : le point de contrôle le mieux récompensé donne toujours de mauvaises conclusions." }
    b: { en: "Rescaling the range keeps the same rubric, so the same superficial answers still earn the top score.", fr: "Changer l'échelle conserve la même grille : les mêmes réponses superficielles obtiennent toujours la note maximale." }
    c: { en: "More training optimizes the flawed reward even further.", fr: "Plus d'entraînement optimise encore davantage la récompense défaillante." }
references:
  - title: Fine-tune a model with reinforcement fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reinforcement-fine-tuning
  - title: Training in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
