id: ai300-5a-compare-view-statements
objective: "5.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank runs A/B comparisons of RAG configurations in a Microsoft Foundry project. For each configuration, the team runs an evaluation on the same test dataset, and then uses the **Compare** view of the portal to compare the runs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank réalise des comparaisons A/B de configurations RAG dans un projet Microsoft Foundry. Pour chaque configuration, l'équipe exécute une évaluation sur le même jeu de données de test, puis utilise la vue **Compare** du portail pour comparer les exécutions.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A cell labeled ImprovedWeak means that the metric moved in the desired direction with a p-value greater than 0.001 and lower than or equal to 0.05.
        fr: |
          Une cellule étiquetée ImprovedWeak signifie que la métrique a évolué dans la direction souhaitée avec une valeur p supérieure à 0,001 et inférieure ou égale à 0,05.
    - id: s2
      text:
        en: |
          The comparison view is saved in the project, so other team members can reopen it later without selecting the runs again.
        fr: |
          La vue de comparaison est enregistrée dans le projet : les autres membres de l'équipe peuvent la rouvrir plus tard sans sélectionner de nouveau les exécutions.
    - id: s3
      text:
        en: |
          If a variant changes both the chunk size and the embedding model, an ImprovedStrong result shows which of the two changes caused the improvement.
        fr: |
          Si une variante modifie à la fois la taille des blocs et le modèle d'incorporation, un résultat ImprovedStrong indique laquelle des deux modifications a causé l'amélioration.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The comparison uses t-testing; ImprovedWeak means 0.001 < p ≤ 0.05 in the desired direction, and ImprovedStrong means p ≤ 0.001. The comparison view isn't saved, so you reselect the runs and select Compare to regenerate it. A significant result shows that the variant differs from the baseline, but when several variables change at once you can't tell which change caused the difference, which is why experiments change one variable at a time.
    fr: |
      La comparaison utilise un test t ; ImprovedWeak signifie 0,001 < p ≤ 0,05 dans la direction souhaitée, et ImprovedStrong signifie p ≤ 0,001. La vue de comparaison n'est pas enregistrée : vous resélectionnez les exécutions et sélectionnez Compare pour la régénérer. Un résultat significatif montre que la variante diffère de la référence, mais lorsque plusieurs variables changent en même temps, impossible de savoir quelle modification a causé la différence ; c'est pourquoi les expériences ne modifient qu'une variable à la fois.
references:
  - title: View evaluation results in the Microsoft Foundry portal
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluate-results
  - title: Design evaluation experiments
    url: https://learn.microsoft.com/en-us/training/modules/evaluate-optimize-agents/2-design-evaluation-experiments
