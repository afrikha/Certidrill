id: ai300-5a-semantic-field-priority
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure AI Search index of long product guides. Each document has a `title` field, a `body` field that often contains several thousand words, and a short `summary` field. All three fields are searchable and retrievable strings.

    The semantic configuration sets `titleField` to `title` and lists `body` and then `summary` in `prioritizedContentFields`. Tests show that hybrid queries with semantic ranking rank documents poorly when the answer appears only in `summary`.

    What should you do?
  fr: |
    Northwind Traders dispose d'un index Azure AI Search de longs guides produit. Chaque document comporte un champ `title`, un champ `body` qui contient souvent plusieurs milliers de mots, et un court champ `summary`. Ces trois champs sont des chaînes pouvant faire l'objet d'une recherche et récupérables.

    La configuration sémantique définit `titleField` sur `title` et répertorie `body` puis `summary` dans `prioritizedContentFields`. Des tests montrent que les requêtes hybrides avec classement sémantique classent mal les documents lorsque la réponse ne figure que dans `summary`.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set `titleField` to `summary` instead of `title`.", fr: "Définir `titleField` sur `summary` au lieu de `title`." }
    - id: b
      text: { en: "Rebuild the index with `summary` as the first field.", fr: "Reconstruire l'index avec `summary` comme premier champ." }
    - id: c
      text: { en: "List `summary` before `body` in `prioritizedContentFields`.", fr: "Répertorier `summary` avant `body` dans `prioritizedContentFields`." }
    - id: d
      text: { en: "Move `body` to `prioritizedKeywordsFields`.", fr: "Déplacer `body` dans `prioritizedKeywordsFields`." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The semantic ranker accepts a limited number of tokens per document and ignores anything past the limit, so long content fields can push later fields out of its input. Content fields must be listed in priority order; putting the short `summary` first ensures it is always part of the input. A semantic configuration can be updated at any time without rebuilding the index.
    fr: |
      Le classeur sémantique accepte un nombre limité de jetons par document et ignore tout ce qui dépasse la limite : de longs champs de contenu peuvent donc exclure les champs suivants de son entrée. Les champs de contenu doivent être répertoriés par ordre de priorité ; placer le court `summary` en premier garantit qu'il fait toujours partie de l'entrée. Une configuration sémantique peut être mise à jour à tout moment sans reconstruire l'index.
  options:
    a:
      en: |
        The title field should be a short string such as a document title; a single title field doesn't replace the priority order of the content fields.
      fr: |
        Le champ de titre doit être une chaîne courte, comme un titre de document ; un unique champ de titre ne remplace pas l'ordre de priorité des champs de contenu.
    d:
      en: |
        Keyword fields are meant for tags and descriptive terms, not for long natural-language text such as `body`.
      fr: |
        Les champs de mots clés sont destinés aux balises et termes descriptifs, pas à un long texte en langage naturel comme `body`.
    b:
      en: |
        The order of fields in the index schema doesn't matter; the semantic configuration sets the priority, and it can change without a rebuild.
      fr: |
        L'ordre des champs dans le schéma de l'index n'a pas d'importance ; c'est la configuration sémantique qui fixe la priorité, et elle peut changer sans reconstruction.
references:
  - title: Configure semantic ranker and return captions in search results
    url: https://learn.microsoft.com/en-us/azure/search/semantic-how-to-configure
  - title: Semantic ranking in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
