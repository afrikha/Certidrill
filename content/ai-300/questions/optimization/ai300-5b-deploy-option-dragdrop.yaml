id: ai300-5b-deploy-option-dragdrop
objective: "5.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso has three fine-tuned models in a Microsoft Foundry project and must choose how to serve each one.

    Which deployment option should you use for each requirement? To answer, drag the appropriate deployment options to the correct requirements. Each deployment option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose de trois modèles ajustés dans un projet Microsoft Foundry et doit choisir comment servir chacun d'eux.

    Quelle option de déploiement devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options de déploiement appropriées vers les exigences correspondantes. Chaque option de déploiement peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: serverless, text: Serverless }
    - { id: managed, text: { en: "Managed compute", fr: "Calcul managé (Managed compute)" } }
    - { id: fireworks, text: Fireworks on Foundry }
    - { id: batch, text: Global Batch }
  targets:
    - id: t1
      text: { en: "A fine-tuned gpt-4.1-mini model; Foundry hosts the model and manages serving.", fr: "Un modèle gpt-4.1-mini ajusté ; Foundry héberge le modèle et gère le service." }
    - id: t2
      text: { en: "Three LoRA adapters of gpt-oss-120b served on the same dedicated GPU capacity as one base deployment.", fr: "Trois adaptateurs LoRA de gpt-oss-120b servis sur la même capacité GPU dédiée qu'un déploiement de base." }
    - id: t3
      text: { en: "One gpt-oss-120b adapter merged into a full-weight copy of the base model.", fr: "Un adaptateur gpt-oss-120b fusionné dans une copie complète des poids du modèle de base." }
answer:
  mapping: { t1: serverless, t2: managed, t3: fireworks }
explanation:
  correct:
    en: |
      With Serverless, Foundry hosts the fine-tuned model and manages serving; it's the option for fine-tuned gpt-4.1-mini. Managed compute (preview) runs a LoRA-enabled base deployment on dedicated GPUs with one or more compatible adapters. Fireworks on Foundry (preview) serves one adapter merged into a full-weight copy of the base model.
    fr: |
      Avec Serverless, Foundry héberge le modèle ajusté et gère le service ; c'est l'option pour gpt-4.1-mini ajusté. Managed compute (préversion) exécute un déploiement de base compatible LoRA sur des GPU dédiés avec un ou plusieurs adaptateurs compatibles. Fireworks on Foundry (préversion) sert un adaptateur fusionné dans une copie complète des poids du modèle de base.
  options:
    batch: { en: "Global Batch is a deployment type for asynchronous jobs, not a deployment option for fine-tuned adapters.", fr: "Global Batch est un type de déploiement pour des travaux asynchrones, pas une option de déploiement pour des adaptateurs ajustés." }
references:
  - title: Fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
  - title: Deploy fine-tuned models in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-deploy
