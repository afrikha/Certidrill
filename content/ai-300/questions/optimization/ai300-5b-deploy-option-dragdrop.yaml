id: ai300-5b-deploy-option-dragdrop
objective: "5.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso has two fine-tuned gpt-4.1-mini models in a Microsoft Foundry resource in a US region. Both models must go to production with serverless deployments billed per token.

    Which deployment type should you use for each model? To answer, drag the appropriate deployment types to the correct models. Each deployment type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose de deux modèles gpt-4.1-mini ajustés dans une ressource Microsoft Foundry située dans une région des États-Unis. Les deux modèles doivent passer en production avec des déploiements serverless facturés au jeton.

    Quel type de déploiement devez-vous utiliser pour chaque modèle ? Pour répondre, faites glisser les types de déploiement appropriés vers les modèles correspondants. Chaque type de déploiement peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: developer, text: Developer }
    - { id: standard, text: Standard }
    - { id: datazone, text: Data Zone Standard }
    - { id: globalstd, text: Global Standard }
    - { id: batch, text: Global Batch }
  targets:
    - id: t1
      text: { en: "Model 1: inference can use capacity in several US regions but must never leave the United States.", fr: "Modèle 1 : l'inférence peut utiliser de la capacité dans plusieurs régions des États-Unis mais ne doit jamais quitter les États-Unis." }
    - id: t2
      text: { en: "Model 2: inference can run on global capacity, and the custom weights may be stored temporarily outside the geography.", fr: "Modèle 2 : l'inférence peut s'exécuter sur une capacité globale, et les poids personnalisés peuvent être stockés temporairement hors de la zone géographique." }
answer:
  mapping: { t1: datazone, t2: globalstd }
explanation:
  correct:
    en: |
      Data Zone Standard runs inference within a data zone with per-token billing; only the US data zone is supported for fine-tuned models. Global Standard uses global capacity with per-token billing, and the custom weights may temporarily be stored outside your geography.
    fr: |
      Data Zone Standard exécute l'inférence dans une zone de données, avec une facturation au jeton ; seule la zone de données des États-Unis est prise en charge pour les modèles ajustés. Global Standard utilise une capacité globale avec une facturation au jeton, et les poids personnalisés peuvent être stockés temporairement hors de votre zone géographique.
  options:
    developer: { en: "Developer deployments are for evaluation only: no SLA and a 24-hour lifetime, so they don't fit production.", fr: "Les déploiements Developer servent uniquement à l'évaluation : sans SLA et avec une durée de vie de 24 heures, ils ne conviennent pas à la production." }
    standard: { en: "Standard runs inference in the deployment's region only, so it can't use capacity in other US regions.", fr: "Standard exécute l'inférence uniquement dans la région du déploiement : il ne peut pas utiliser de capacité dans d'autres régions des États-Unis." }
    batch: { en: "The batch API doesn't currently support fine-tuned models.", fr: "L'API batch ne prend pas en charge les modèles ajustés pour le moment." }
references:
  - title: Training in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
