id: ai300-5a-reembed-blue-green
objective: "5.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a production Azure AI Search index named **kb-v1** whose vectors were generated by `text-embedding-3-small`. A RAG assistant queries kb-v1 around the clock.

    You must move the solution to `text-embedding-3-large`. The assistant must stay available during the change, and you must confirm that retrieval quality improves before users get results from the new embeddings.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys dispose d'un index Azure AI Search de production nommé **kb-v1** dont les vecteurs ont été générés par `text-embedding-3-small`. Un assistant RAG interroge kb-v1 en continu.

    Vous devez faire passer la solution à `text-embedding-3-large`. L'assistant doit rester disponible pendant la modification, et vous devez confirmer que la qualité de la récupération s'améliore avant que les utilisateurs obtiennent des résultats issus des nouvelles incorporations.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create an index named kb-v2 whose vector field matches the output of `text-embedding-3-large`.", fr: "Créer un index nommé kb-v2 dont le champ vectoriel correspond à la sortie de `text-embedding-3-large`." } }
    - { id: reembed, text: { en: "Generate new embeddings for all the documents with `text-embedding-3-large`, and index them in kb-v2.", fr: "Générer de nouvelles incorporations pour tous les documents avec `text-embedding-3-large`, et les indexer dans kb-v2." } }
    - { id: compare, text: { en: "Run the same labeled test queries against kb-v1 and kb-v2, and compare the retrieval metrics.", fr: "Exécuter les mêmes requêtes de test étiquetées sur kb-v1 et kb-v2, et comparer les métriques de récupération." } }
    - { id: switch, text: { en: "Update the application configuration so that the assistant queries kb-v2.", fr: "Mettre à jour la configuration de l'application pour que l'assistant interroge kb-v2." } }
    - { id: vectorizer, text: { en: "Change the vectorizer of kb-v1 so that queries are embedded with `text-embedding-3-large`.", fr: "Modifier le vectoriseur de kb-v1 pour que les requêtes soient incorporées avec `text-embedding-3-large`." } }
    - { id: newdocs, text: { en: "Generate embeddings with `text-embedding-3-large` only for the documents added to kb-v1 after the change.", fr: "Générer des incorporations avec `text-embedding-3-large` uniquement pour les documents ajoutés à kb-v1 après la modification." } }
    - { id: recreate, text: { en: "Delete kb-v1, and recreate it with a vector field that matches `text-embedding-3-large`.", fr: "Supprimer kb-v1, puis le recréer avec un champ vectoriel qui correspond à `text-embedding-3-large`." } }
answer:
  sequence: [ create, reembed, compare, switch ]
explanation:
  correct:
    en: |
      You can't upgrade between embedding models; vectors from two models are in different vector spaces, so every document must be embedded again. A blue-green approach builds the new index next to the production one, re-embeds and indexes all documents, validates retrieval by running the same queries against both indexes, and only then switches the application. The old index can be deleted after the switch.
    fr: |
      Il n'est pas possible de mettre à niveau d'un modèle d'incorporation à un autre ; les vecteurs de deux modèles appartiennent à des espaces vectoriels différents, et tous les documents doivent donc être incorporés de nouveau. Une approche bleu-vert crée le nouvel index à côté de celui de production, réincorpore et indexe tous les documents, valide la récupération en exécutant les mêmes requêtes sur les deux index, puis seulement bascule l'application. L'ancien index peut être supprimé après la bascule.
  options:
    vectorizer:
      en: |
        Query vectors from the new model wouldn't be comparable with the document vectors generated by the old model.
      fr: |
        Les vecteurs de requête du nouveau modèle ne seraient pas comparables aux vecteurs de documents générés par l'ancien modèle.
    newdocs:
      en: |
        An index that mixes vectors from two models returns meaningless similarities; all documents must be re-embedded.
      fr: |
        Un index qui mélange des vecteurs de deux modèles renvoie des similarités sans signification ; tous les documents doivent être réincorporés.
    recreate:
      en: |
        Deleting the production index makes the assistant unavailable and leaves no index to compare with.
      fr: |
        Supprimer l'index de production rend l'assistant indisponible et ne laisse aucun index de comparaison.
references:
  - title: Optimize chunking and embedding strategies
    url: https://learn.microsoft.com/en-us/training/modules/aaai-implement-advanced-rag-azure-ai-search/5-optimize-chunk-embed-strategies
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
