id: ai300-5a-mrr-metric
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware evaluates the search step of a RAG solution with test queries whose relevant chunks are known. Users of the assistant mostly read the first relevant chunk, so the team wants one metric that rewards configurations that return the first relevant chunk as high as possible in the results.

    Which metric should you use?
  fr: |
    Litware évalue l'étape de recherche d'une solution RAG avec des requêtes de test dont les blocs pertinents sont connus. Les utilisateurs de l'assistant lisent surtout le premier bloc pertinent : l'équipe veut donc une métrique qui favorise les configurations qui renvoient le premier bloc pertinent le plus haut possible dans les résultats.

    Quelle métrique devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Recall@K", fr: "Recall@K" } }
    - { id: b, text: { en: "Mean reciprocal rank (MRR)", fr: "Rang réciproque moyen (MRR)" } }
    - { id: c, text: { en: "Groundedness", fr: "Groundedness" } }
    - { id: d, text: { en: "Precision@K", fr: "Precision@K" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Mean reciprocal rank averages, over the test queries, the reciprocal of the rank of the first relevant result, so it focuses on how early the first relevant item appears. The Architecture Center guidance lists it next to precision@K and recall@K to evaluate search results on positive and negative test queries.
    fr: |
      Le rang réciproque moyen calcule, sur les requêtes de test, la moyenne de l'inverse du rang du premier résultat pertinent : il se concentre donc sur la position à laquelle apparaît le premier élément pertinent. Les recommandations du Centre des architectures le citent avec precision@K et recall@K pour évaluer les résultats de recherche sur des requêtes de test positives et négatives.
  options:
    d:
      en: |
        Precision@K measures the share of relevant results among the top K, whatever their positions.
      fr: |
        Precision@K mesure la part de résultats pertinents parmi les K premiers, quelles que soient leurs positions.
    a:
      en: |
        Recall@K measures the share of all relevant items that appear in the top K, which focuses on coverage.
      fr: |
        Recall@K mesure la part de tous les éléments pertinents qui apparaissent dans les K premiers, ce qui porte sur la couverture.
    c:
      en: |
        Groundedness evaluates whether a generated response stays within the context; it doesn't measure search ranking.
      fr: |
        Groundedness évalue si une réponse générée reste dans les limites du contexte ; il ne mesure pas le classement de la recherche.
references:
  - title: Information retrieval
    url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/rag/rag-information-retrieval
