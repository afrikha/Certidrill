id: ai300-5a-enable-semantic-ranking
objective: "5.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has an Azure AI Search service on a tier and in a region that support semantic ranker. Its production index **kb-index** has no semantic configuration. A RAG assistant sends hybrid queries to kb-index around the clock.

    You need to add semantic reranking of the hybrid results. The assistant must stay available, and you must minimize administrative effort.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un service Azure AI Search sur un niveau tarifaire et dans une région qui prennent en charge le classeur sémantique. Son index de production **kb-index** n'a aucune configuration sémantique. Un assistant RAG envoie en continu des requêtes hybrides à kb-index.

    Vous devez ajouter le reclassement sémantique des résultats hybrides. L'assistant doit rester disponible, et vous devez réduire au minimum l'effort d'administration.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a new index with a semantic configuration, and rerun the indexer to load every document into it.", fr: "Créer un nouvel index avec une configuration sémantique, et réexécuter l'indexeur pour y charger tous les documents." } }
    - { id: b, text: { en: "Add a vectorizer to the semantic configuration so that it can rerank vector matches.", fr: "Ajouter un vectoriseur à la configuration sémantique pour qu'elle puisse reclasser les correspondances vectorielles." } }
    - { id: c, text: { en: "Update kb-index to add a semantic configuration that lists its title, content and keyword fields.", fr: "Mettre à jour kb-index pour ajouter une configuration sémantique qui répertorie ses champs de titre, de contenu et de mots clés." } }
    - { id: d, text: { en: "Add `\"orderby\": \"@search.rerankerScore desc\"` to the queries.", fr: "Ajouter `\"orderby\": \"@search.rerankerScore desc\"` aux requêtes." } }
    - { id: e, text: { en: "Set `queryType` to `semantic` in the queries, and specify the semantic configuration.", fr: "Définir `queryType` sur `semantic` dans les requêtes, et spécifier la configuration sémantique." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      Semantic ranking needs a semantic configuration in the index, which you can add or update at any time without rebuilding the index, and queries that set `queryType` to `semantic` and name the configuration (or rely on the default one). The semantic ranker then reranks the top 50 RRF results and returns `@search.rerankerScore`.
    fr: |
      Le classement sémantique exige une configuration sémantique dans l'index, que vous pouvez ajouter ou mettre à jour à tout moment sans reconstruire l'index, ainsi que des requêtes qui définissent `queryType` sur `semantic` et nomment la configuration (ou s'appuient sur celle par défaut). Le classeur sémantique reclasse alors les 50 premiers résultats RRF et renvoie `@search.rerankerScore`.
  options:
    a:
      en: |
        Semantic configurations can be added to an existing index without a rebuild, so a new index and a full reload add needless effort.
      fr: |
        Les configurations sémantiques peuvent être ajoutées à un index existant sans reconstruction : un nouvel index et un rechargement complet ajoutent un effort inutile.
    d:
      en: |
        Semantically ranked results are already returned in descending reranker score order; an explicit sort isn't used for this.
      fr: |
        Les résultats classés sémantiquement sont déjà renvoyés par score de reclassement décroissant ; un tri explicite ne sert pas à cela.
    b:
      en: |
        A semantic configuration lists text fields only; vectorizers are assigned to vector fields through vector profiles.
      fr: |
        Une configuration sémantique ne répertorie que des champs texte ; les vectoriseurs sont attribués aux champs vectoriels par les profils vectoriels.
references:
  - title: Configure semantic ranker and return captions in search results
    url: https://learn.microsoft.com/en-us/azure/search/semantic-how-to-configure
  - title: Semantic ranking in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
