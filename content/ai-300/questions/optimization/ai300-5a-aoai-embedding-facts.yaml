id: ai300-5a-aoai-embedding-facts
objective: "5.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is choosing an Azure OpenAI embedding model for a new RAG index in Microsoft Foundry. You review the embedding models listed in the Foundry Models sold by Azure documentation.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank choisit un modèle d'incorporation Azure OpenAI pour un nouvel index RAG dans Microsoft Foundry. Vous examinez les modèles d'incorporation répertoriés dans la documentation Foundry Models sold by Azure.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A larger embedding model always retrieves better results on your own data than a smaller one.", fr: "Un modèle d'incorporation plus grand récupère toujours de meilleurs résultats sur vos propres données qu'un modèle plus petit." } }
    - { id: b, text: { en: "`text-embedding-3-large` returns 3,072-dimension vectors when no `dimensions` value is specified.", fr: "`text-embedding-3-large` renvoie des vecteurs de 3 072 dimensions lorsqu'aucune valeur `dimensions` n'est spécifiée." } }
    - { id: c, text: { en: "`text-embedding-ada-002` supports the `dimensions` parameter to return shorter vectors.", fr: "`text-embedding-ada-002` prend en charge le paramètre `dimensions` pour renvoyer des vecteurs plus courts." } }
    - { id: d, text: { en: "`text-embedding-3-small` has a higher MIRACL average than `text-embedding-ada-002`.", fr: "`text-embedding-3-small` a une moyenne MIRACL supérieure à celle de `text-embedding-ada-002`." } }
    - { id: e, text: { en: "You can upgrade a `text-embedding-ada-002` deployment to `text-embedding-3-large` and keep the existing document vectors.", fr: "Vous pouvez mettre à niveau un déploiement `text-embedding-ada-002` vers `text-embedding-3-large` et conserver les vecteurs de documents existants." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "`text-embedding-3-large` outputs 3,072 dimensions by default, and the third-generation models can return fewer through the `dimensions` parameter. Both third-generation models beat `text-embedding-ada-002` on the multilingual MIRACL benchmark (44.0 for the small model and 54.9 for the large model, against 31.4)."
    fr: "`text-embedding-3-large` produit 3 072 dimensions par défaut, et les modèles de troisième génération peuvent en renvoyer moins grâce au paramètre `dimensions`. Les deux modèles de troisième génération dépassent `text-embedding-ada-002` sur le banc d'essai multilingue MIRACL (44,0 pour le petit modèle et 54,9 pour le grand, contre 31,4)."
  options:
    c:
      en: |
        Only the third-generation models support `dimensions`; `text-embedding-ada-002` always returns 1,536 dimensions.
      fr: |
        Seuls les modèles de troisième génération prennent en charge `dimensions` ; `text-embedding-ada-002` renvoie toujours 1 536 dimensions.
    e:
      en: |
        You can't upgrade between embedding models; moving to `text-embedding-3-large` requires generating new embeddings.
      fr: |
        Il n'est pas possible de passer d'un modèle d'incorporation à un autre par mise à niveau ; passer à `text-embedding-3-large` exige de générer de nouvelles incorporations.
    a:
      en: |
        Larger models usually score better on benchmarks, but they aren't always better on your data and cost more to store and run.
      fr: |
        Les grands modèles obtiennent généralement de meilleurs scores sur les bancs d'essai, mais ne sont pas toujours meilleurs sur vos données et coûtent plus cher à stocker et à exécuter.
references:
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
  - title: RAG generate embeddings phase
    url: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/rag/rag-generate-embeddings
