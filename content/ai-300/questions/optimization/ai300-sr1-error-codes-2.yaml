id: ai300-sr1-error-codes-2
objective: "5.1.3"
type: series_yesno
series: ai300-sr1-error-codes
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You send a hybrid query that combines the full-text query with a vector query.
  fr: Vous envoyez une requête hybride qui combine la requête en texte intégral et une requête vectorielle.
body:
  solution:
    en: |
      You change the query body to the following, where `<user question>` is the text typed by the user:

      ```json
      {
        "search": "<user question>",
        "vectorQueries": [
          {
            "kind": "text",
            "text": "<user question>",
            "fields": "contentVector",
            "k": 50
          }
        ],
        "top": 10
      }
      ```
    fr: |
      Vous remplacez le corps de la requête par le suivant, où `<user question>` est le texte saisi par l'utilisateur :

      ```json
      {
        "search": "<user question>",
        "vectorQueries": [
          {
            "kind": "text",
            "text": "<user question>",
            "fields": "contentVector",
            "k": 50
          }
        ],
        "top": 10
      }
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      A request that contains both `search` and `vectorQueries` is a hybrid query: the full-text (BM25) and vector queries run in parallel, and Reciprocal Rank Fusion (RRF) merges them into one result set. Keyword matching finds exact codes such as `ERR-4012`, and vector similarity finds conceptually similar chunks without shared terms. `kind: text` works because a vectorizer is assigned to `contentVector`. The goal is met.
    fr: |
      Une requête qui contient à la fois `search` et `vectorQueries` est une requête hybride : les requêtes en texte intégral (BM25) et vectorielle s'exécutent en parallèle, et la fusion de rang réciproque (RRF) les fusionne en un seul jeu de résultats. La correspondance par mots clés trouve les codes exacts comme `ERR-4012`, et la similarité vectorielle trouve les blocs conceptuellement proches sans terme commun. `kind: text` fonctionne parce qu'un vectoriseur est attribué à `contentVector`. L'objectif est atteint.
references:
  - title: Hybrid Search Overview - Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
  - title: Create a Hybrid Query - Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-how-to-query
