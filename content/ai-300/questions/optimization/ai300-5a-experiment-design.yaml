id: ai300-5a-experiment-design
objective: "5.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Proseware plans an offline experiment that compares its current RAG configuration (the baseline) with a variant that adds semantic ranking to the hybrid queries. Evaluations will run in a Microsoft Foundry project.

    You need the results of the experiment to show whether semantic ranking improves answer quality.

    Which two practices should you follow? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit une expérience hors connexion qui compare sa configuration RAG actuelle (la référence) à une variante qui ajoute le classement sémantique aux requêtes hybrides. Les évaluations s'exécuteront dans un projet Microsoft Foundry.

    Vous devez faire en sorte que les résultats de l'expérience montrent si le classement sémantique améliore la qualité des réponses.

    Quelles sont les deux pratiques à suivre ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Use a different test dataset for the variant, so that the comparison isn't biased by queries tuned for the baseline.", fr: "Utiliser un jeu de données de test différent pour la variante, afin que la comparaison ne soit pas biaisée par des requêtes adaptées à la référence." } }
    - { id: b, text: { en: "Run the baseline and the variant against the same test dataset.", fr: "Exécuter la référence et la variante sur le même jeu de données de test." } }
    - { id: c, text: { en: "Add a new prompt and a new chat model to the variant at the same time, to reduce the number of runs.", fr: "Ajouter en même temps une nouvelle invite et un nouveau modèle de conversation à la variante, pour réduire le nombre d'exécutions." } }
    - { id: d, text: { en: "Define the success thresholds after you review the first results, so that they reflect realistic scores.", fr: "Définir les seuils de réussite après avoir examiné les premiers résultats, afin qu'ils reflètent des scores réalistes." } }
    - { id: e, text: { en: "Change only the ranking setting in the variant, and keep the prompt and the chat model unchanged.", fr: "Modifier uniquement le paramètre de classement dans la variante, et conserver l'invite et le modèle de conversation." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      An optimization experiment compares a baseline with a variant under controlled conditions. Each variant runs against the same test prompts, and only one variable changes, so that any difference can be attributed to that change. Success thresholds are set in advance to avoid rationalizing disappointing results.
    fr: |
      Une expérience d'optimisation compare une référence à une variante dans des conditions contrôlées. Chaque variante s'exécute sur les mêmes invites de test et une seule variable change, afin que toute différence puisse être attribuée à cette modification. Les seuils de réussite sont fixés à l'avance pour éviter de justifier après coup des résultats décevants.
  options:
    d:
      en: |
        Thresholds set after seeing results invite rationalization; the guidance sets them before the experiment.
      fr: |
        Des seuils fixés après avoir vu les résultats invitent à les justifier après coup ; les recommandations les fixent avant l'expérience.
    a:
      en: |
        Different datasets make the scores incomparable, because differences could come from the queries rather than from the configuration.
      fr: |
        Des jeux de données différents rendent les scores incomparables, car les écarts pourraient venir des requêtes plutôt que de la configuration.
    c:
      en: |
        When several changes are tested together, you can't determine which one caused the observed difference.
      fr: |
        Lorsque plusieurs modifications sont testées ensemble, impossible de déterminer laquelle a causé la différence observée.
references:
  - title: Design evaluation experiments
    url: https://learn.microsoft.com/en-us/training/modules/evaluate-optimize-agents/2-design-evaluation-experiments
