id: ai300-5a-semantic-top50
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum's RAG assistant sends hybrid queries to Azure AI Search with `top` set to 100. For a set of test questions, the most relevant chunk is ranked around position 80 by Reciprocal Rank Fusion (RRF).

    You enable semantic ranking by setting `queryType` to `semantic` and specifying a valid semantic configuration. For these questions, the most relevant chunk still doesn't appear among the top 10 results.

    What explains this behavior?
  fr: |
    L'assistant RAG d'Adatum envoie des requêtes hybrides à Azure AI Search avec `top` défini sur 100. Pour un ensemble de questions de test, le bloc le plus pertinent est classé vers la position 80 par Reciprocal Rank Fusion (RRF).

    Vous activez le classement sémantique en définissant `queryType` sur `semantic` et en spécifiant une configuration sémantique valide. Pour ces questions, le bloc le plus pertinent n'apparaît toujours pas parmi les 10 premiers résultats.

    Qu'est-ce qui explique ce comportement ?
body:
  options:
    - id: a
      text: { en: "The semantic ranker removes every result whose `@search.rerankerScore` is below 2.0, which includes the relevant chunk.", fr: "Le classeur sémantique supprime chaque résultat dont `@search.rerankerScore` est inférieur à 2,0, ce qui inclut le bloc pertinent." }
    - id: b
      text: { en: "The semantic ranker rescores only the top 50 results of the initial ranking, so a chunk ranked 80th can't be promoted.", fr: "Le classeur sémantique ne réévalue que les 50 premiers résultats du classement initial : un bloc classé 80e ne peut pas être remonté." }
    - id: c
      text: { en: "The semantic ranker requires `top` to be set to 10 or less, otherwise it keeps the RRF order of the results.", fr: "Le classeur sémantique exige que `top` soit défini sur 10 ou moins ; sinon, il conserve l'ordre RRF des résultats." }
    - id: d
      text: { en: "The semantic ranker rescores only the results of the text query, so chunks found by the vector query are ignored.", fr: "Le classeur sémantique ne réévalue que les résultats de la requête texte : les blocs trouvés par la requête vectorielle sont ignorés." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Semantic ranking only reranks the top 50 results of the initial BM25 or RRF ranking, even if more results are returned. It can't rerun the query over the whole corpus, so a chunk that the first stage ranks beyond position 50 can't reach the top. To fix this, you must improve the first-stage retrieval, for example by tuning chunking, vector weights or the query itself.
    fr: |
      Le classement sémantique ne reclasse que les 50 premiers résultats du classement initial BM25 ou RRF, même si davantage de résultats sont renvoyés. Il ne peut pas réexécuter la requête sur tout le corpus : un bloc que la première étape classe au-delà de la position 50 ne peut pas atteindre le haut du classement. Pour corriger ce problème, vous devez améliorer la récupération de la première étape, par exemple en ajustant la segmentation, les poids vectoriels ou la requête elle-même.
  options:
    d:
      en: |
        In a hybrid query, the semantic ranker reranks the RRF-merged results, which include the vector matches.
      fr: |
        Dans une requête hybride, le classeur sémantique reclasse les résultats fusionnés par RRF, qui incluent les correspondances vectorielles.
    a:
      en: |
        The semantic ranker reorders results by `@search.rerankerScore`; it doesn't remove results below a score.
      fr: |
        Le classeur sémantique réordonne les résultats selon `@search.rerankerScore` ; il ne supprime pas les résultats sous un score donné.
    c:
      en: "`top` sets how many results are returned; the semantic ranker works whatever its value, on the top 50 results."
      fr: "`top` fixe le nombre de résultats renvoyés ; le classeur sémantique fonctionne quelle que soit sa valeur, sur les 50 premiers résultats."
references:
  - title: Semantic ranking in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
  - title: Implement reranking and context ranking
    url: https://learn.microsoft.com/en-us/training/modules/aaai-implement-advanced-rag-azure-ai-search/3-implement-rerank-context-rank
