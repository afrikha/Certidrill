id: ai300-5b-rft-cost-reduction
objective: "5.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs reinforcement fine-tuning (RFT) experiments of o4-mini with Global training. Each job uses a large validation dataset and a `score_model` grader that runs on the largest available grading model. A smaller grading model already meets the team's quality bar.

    You need to reduce the cost of the next experiments.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute des expériences de réglage précis par renforcement (RFT) d'o4-mini avec l'entraînement Global. Chaque travail utilise un grand jeu de données de validation et un évaluateur (grader) `score_model` qui s'exécute sur le plus grand modèle évaluateur disponible. Un modèle évaluateur plus petit respecte déjà la barre de qualité de l'équipe.

    Vous devez réduire le coût des prochaines expériences.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Change the training type from Global to Standard.", fr: "Changer le type d'entraînement de Global à Standard." } }
    - { id: b, text: { en: "Use the smaller grading model in the `score_model` grader.", fr: "Utiliser le modèle évaluateur plus petit dans l'évaluateur `score_model`." } }
    - { id: c, text: { en: "Add a second `score_model` grader in a `multi` grader.", fr: "Ajouter un second évaluateur `score_model` dans un évaluateur `multi`." } }
    - { id: d, text: { en: "Use a smaller validation dataset and fewer evaluation samples.", fr: "Utiliser un jeu de données de validation plus petit et moins d'échantillons d'évaluation." } }
    - { id: e, text: { en: "Validate the checkpoints more often during training.", fr: "Valider les points de contrôle plus souvent pendant l'entraînement." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      RFT bills training hours plus grader inference tokens when a model grader is used. Microsoft recommends choosing the smallest grader that meets your quality bar and limiting validation to a reasonable number of examples and evaluation samples.
    fr: |
      RFT facture les heures d'entraînement plus les jetons d'inférence de l'évaluateur quand un modèle évaluateur est utilisé. Microsoft recommande de choisir le plus petit évaluateur qui atteint votre barre de qualité et de limiter la validation à un nombre raisonnable d'exemples et d'échantillons d'évaluation.
  options:
    a: { en: "Global training is discounted compared with Standard training, which adds data residency at a higher rate.", fr: "L'entraînement Global est moins cher que l'entraînement Standard, qui ajoute la résidence des données à un tarif plus élevé." }
    c: { en: "A second model grader adds more grading tokens.", fr: "Un second modèle évaluateur ajoute des jetons d'évaluation." }
    e: { en: "Validating more often than needed increases grading and training time.", fr: "Valider plus souvent que nécessaire augmente l'évaluation et la durée d'entraînement." }
references:
  - title: Manage fine-tuning costs in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-cost-management
