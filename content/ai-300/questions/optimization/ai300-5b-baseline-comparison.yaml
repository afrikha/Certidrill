id: ai300-5b-baseline-comparison
objective: "5.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adventure Works fine-tuned gpt-4.1-mini with supervised fine-tuning. In production, the application currently calls the base gpt-4.1-mini model with a long system prompt that contains examples. A held-out test dataset of real requests and a set of evaluators are ready.

    You need to determine whether the fine-tuned model performs better than the current solution, at the lowest evaluation cost.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adventure Works a effectué le réglage précis supervisé de gpt-4.1-mini. En production, l'application appelle actuellement le modèle de base gpt-4.1-mini avec une longue invite système qui contient des exemples. Un jeu de données de test réservé, constitué de demandes réelles, et un ensemble d'évaluateurs sont prêts.

    Vous devez déterminer si le modèle ajusté est plus performant que la solution actuelle, au coût d'évaluation le plus bas.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deploy the fine-tuned model as a Developer deployment, and run a cloud evaluation on the test dataset.", fr: "Déployer le modèle ajusté dans un déploiement Developer, et exécuter une évaluation cloud sur le jeu de données de test." } }
    - { id: b, text: { en: "Compare the final `train_loss` of the job with the loss of the base model.", fr: "Comparer la `train_loss` finale du travail avec la perte du modèle de base." } }
    - { id: c, text: { en: "Run the same evaluation, with the same dataset and evaluators, on the base model with the current system prompt.", fr: "Exécuter la même évaluation, avec le même jeu de données et les mêmes évaluateurs, sur le modèle de base avec l'invite système actuelle." } }
    - { id: d, text: { en: "Evaluate the fine-tuned model on its training file to measure what it learned.", fr: "Évaluer le modèle ajusté sur son fichier d'entraînement pour mesurer ce qu'il a appris." } }
    - { id: e, text: { en: "Deploy the fine-tuned model as a Standard deployment, and compare its token metrics with production.", fr: "Déployer le modèle ajusté dans un déploiement Standard, et comparer ses métriques de jetons avec la production." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Benefits of fine-tuning aren't guaranteed, so compare the fine-tuned model with the baseline on held-out data. A Developer deployment is meant for evaluating fine-tuned models: it bills tokens with no hourly hosting fee. Running the same dataset and evaluators on the base model with its current prompt gives a comparable baseline.
    fr: |
      Les bénéfices du réglage précis ne sont pas garantis : comparez le modèle ajusté avec la référence sur des données réservées. Un déploiement Developer est conçu pour évaluer les modèles ajustés : il facture les jetons sans frais d'hébergement horaires. Exécuter le même jeu de données et les mêmes évaluateurs sur le modèle de base avec son invite actuelle fournit une référence comparable.
  options:
    b: { en: "Training loss doesn't measure task quality on held-out data, and it isn't comparable with the base model.", fr: "La perte d'entraînement ne mesure pas la qualité de la tâche sur des données réservées, et elle n'est pas comparable avec le modèle de base." }
    d: { en: "Scores on training data measure memorization and cause evaluation leakage.", fr: "Les scores sur les données d'entraînement mesurent la mémorisation et provoquent une fuite d'évaluation." }
    e: { en: "A Standard deployment adds an hourly hosting fee, and token metrics don't measure quality.", fr: "Un déploiement Standard ajoute des frais d'hébergement horaires, et les métriques de jetons ne mesurent pas la qualité." }
references:
  - title: Training in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
  - title: Introduction to cloud evaluation with Microsoft Foundry SDK
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/cloud-evaluation
