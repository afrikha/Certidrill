id: ai300-sr2-part-numbers-3
objective: "5.1.3"
type: series_yesno
series: ai300-sr2-part-numbers
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You send a hybrid query with semantic ranking.
  fr: Vous envoyez une requête hybride avec classement sémantique.
body:
  solution:
    en: |
      In each query request, you set the `search` parameter to the text of the user question, keep the `vectorQueries` entry on `contentVector` with `k` set to 50, set `queryType` to `semantic` and `semanticConfiguration` to `parts-sem`, and set `top` to 5.
    fr: |
      Dans chaque requête de recherche, vous définissez le paramètre `search` sur le texte de la question de l'utilisateur, conservez l'entrée `vectorQueries` sur `contentVector` avec `k` défini sur 50, définissez `queryType` sur `semantic` et `semanticConfiguration` sur `parts-sem`, et définissez `top` sur 5.
answer: { value: true }
explanation:
  correct:
    en: The request is still a single hybrid query, so exact part numbers are matched by full-text search and symptoms by vector search, merged with RRF. Semantic ranker then reranks the merged results with machine reading comprehension; setting `k` to 50 gives it enough inputs, as Microsoft recommends for hybrid queries with semantic ranking.
    fr: "La requête reste une seule requête hybride : les numéros de pièce exacts sont trouvés par la recherche en texte intégral et les symptômes par la recherche vectorielle, fusionnés avec RRF. Le classeur sémantique reclasse ensuite les résultats fusionnés grâce à la compréhension de lecture automatique ; définir `k` sur 50 lui fournit suffisamment d'entrées, comme Microsoft le recommande pour les requêtes hybrides avec classement sémantique."
references:
  - title: Create a Hybrid Query - Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-how-to-query
