id: ai300-cs1b-ab-retrieval
objective: "5.1.4"
type: single
caseStudy: ai300-cs1b-vanarsdel
difficulty: 3
status: draft
stem:
  en: You need to decide what to do with the retrieval variant that was evaluated last month. The solution must meet the operations requirements. What should you do next?
  fr: Vous devez décider de la suite à donner à la variante de récupération évaluée le mois dernier. La solution doit respecter les exigences d'exploitation. Que devez-vous faire ensuite ?
body:
  options:
    - id: a
      text:
        en: Promote the variant to production, because its average groundedness and retrieval scores are higher than those of the baseline run
        fr: Promouvoir la variante en production, car ses scores moyens de groundedness et de retrieval sont supérieurs à ceux de l'exécution de référence
    - id: b
      text:
        en: Keep the current configuration, and record that the two configurations give equivalent groundedness and retrieval quality
        fr: Conserver la configuration actuelle, et consigner que les deux configurations donnent une qualité de groundedness et de retrieval équivalente
    - id: c
      text:
        en: Evaluate a variant that changes only the chunk size on an extended dataset with more rows, and compare it with a new baseline run on the same dataset
        fr: Évaluer une variante qui ne change que la taille des blocs sur un jeu de données étendu à davantage de lignes, et la comparer à une nouvelle exécution de référence sur le même jeu de données
    - id: d
      text:
        en: Run the same two configurations again on eval-clauses.jsonl, and use a different judge model deployment for the variant run
        fr: Exécuter de nouveau les deux mêmes configurations sur eval-clauses.jsonl, et utiliser un autre déploiement de modèle juge pour l'exécution de la variante
answer: { optionId: c }
explanation:
  correct:
    en: The variant changed two settings at once, the chunk size and the embedding model, so any difference can't be attributed to a single setting. Inconclusive means too few examples or a p-value of 0.05 or more; it calls for more test rows, not for a conclusion in either direction. A one-change variant and a baseline evaluated on the same larger dataset can then show a statistically significant result in the Compare view.
    fr: La variante a modifié deux paramètres à la fois, la taille des blocs et le modèle d'incorporation ; aucune différence ne peut donc être attribuée à un seul paramètre. Inconclusive signifie trop peu d'exemples ou une valeur p de 0,05 ou plus ; cela demande plus de lignes de test, pas une conclusion dans un sens ou dans l'autre. Une variante à une seule modification et une exécution de référence évaluées sur le même jeu de données plus grand peuvent alors montrer un résultat statistiquement significatif dans la vue Compare.
  options:
    a: { en: "A higher average that the t-test marks as Inconclusive isn't a significant improvement, and the two simultaneous changes can't be told apart.", fr: "Une moyenne plus élevée que le test t marque comme Inconclusive n'est pas une amélioration significative, et les deux modifications simultanées ne peuvent pas être distinguées." }
    b: { en: "Inconclusive doesn't mean equivalent: the test couldn't detect a difference with 40 rows.", fr: "Inconclusive ne signifie pas équivalent : le test n'a pas pu détecter de différence avec 40 lignes." }
    d: { en: "Different judge models add a third difference between the runs, and the same 40 rows still give too few examples.", fr: "Des modèles juges différents ajoutent une troisième différence entre les exécutions, et les mêmes 40 lignes donnent toujours trop peu d'exemples." }
references:
  - title: See Evaluation Results in Microsoft Foundry portal
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluate-results
