id: ai300-5b-checkpoint-hotarea
objective: "5.2.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs a supervised fine-tuning job of gpt-4.1-mini with a training file and a separate validation file. The job reports the following metrics at the end of each epoch.

    Answer each prompt by selecting the appropriate checkpoint.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute un travail de réglage précis supervisé de gpt-4.1-mini avec un fichier d'entraînement et un fichier de validation distinct. Le travail indique les métriques suivantes à la fin de chaque époque.

    Répondez à chaque consigne en sélectionnant le point de contrôle approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The checkpoint to evaluate first as the deployment candidate", fr: "Le point de contrôle à évaluer en premier comme candidat au déploiement" }
    - id: p2
      text: { en: "The first checkpoint at which the metrics show overfitting", fr: "Le premier point de contrôle auquel les métriques montrent un surajustement" }
  grid:
    header: [{ en: "Checkpoint", fr: "Point de contrôle" }, { en: "Epoch", fr: "Époque" }, train_loss, full_valid_loss, full_valid_mean_token_accuracy]
    rows:
      - [{ text: ckpt-1, area: c1 }, { text: "1" }, { text: "1.02" }, { text: "1.10" }, { text: "0.71" }]
      - [{ text: ckpt-2, area: c2 }, { text: "2" }, { text: "0.71" }, { text: "0.86" }, { text: "0.78" }]
      - [{ text: ckpt-3, area: c3 }, { text: "3" }, { text: "0.52" }, { text: "0.79" }, { text: "0.81" }]
      - [{ text: ckpt-4, area: c4 }, { text: "4" }, { text: "0.38" }, { text: "0.84" }, { text: "0.80" }]
      - [{ text: ckpt-5, area: c5 }, { text: "5" }, { text: "0.27" }, { text: "0.93" }, { text: "0.78" }]
answer:
  values: { p1: c3, p2: c4 }
explanation:
  correct:
    en: |
      Candidates must be compared on validation results, not on training loss, and the latest checkpoint isn't necessarily the best. ckpt-3 has the lowest `full_valid_loss` and the highest validation token accuracy. From ckpt-4, the training loss keeps falling while the validation loss rises, which is the sign of overfitting.
    fr: |
      Les candidats doivent être comparés sur les résultats de validation, pas sur la perte d'entraînement, et le dernier point de contrôle n'est pas forcément le meilleur. ckpt-3 a la `full_valid_loss` la plus faible et la meilleure précision de jetons en validation. À partir de ckpt-4, la perte d'entraînement continue de baisser alors que la perte de validation augmente : c'est le signe d'un surajustement.
references:
  - title: Fine-tune a model with supervised fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning
