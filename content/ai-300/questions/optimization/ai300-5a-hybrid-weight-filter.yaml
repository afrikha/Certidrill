id: ai300-5a-hybrid-weight-filter
objective: "5.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's support assistant sends hybrid queries to an Azure AI Search index that has a vectorizer assigned to the vector field `contentVector`. Tests with labeled queries show that conceptual questions are answered better when the vector results have more influence than the keyword results.

    You need to modify the query so that:

    - the vector query counts twice as much as the text query in the fused ranking;
    - the filter on `category` is applied before the vector search, so that the nearest neighbors are taken only from billing documents.

    How should you complete the request body? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'assistant de support de Fabrikam envoie des requêtes hybrides à un index Azure AI Search dont le champ vectoriel `contentVector` a un vectoriseur attribué. Des tests avec des requêtes étiquetées montrent que les questions conceptuelles obtiennent de meilleures réponses lorsque les résultats vectoriels ont plus d'influence que les résultats par mots clés.

    Vous devez modifier la requête de sorte que :

    - la requête vectorielle compte deux fois plus que la requête texte dans le classement fusionné ;
    - le filtre sur `category` soit appliqué avant la recherche vectorielle, afin que les plus proches voisins soient pris uniquement parmi les documents de facturation.

    Comment devez-vous compléter le corps de la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "search": "why was I charged twice this month",
      "filter": "category eq 'billing'",
      "vectorFilterMode": [[mode]],
      "vectorQueries": [
        {
          "kind": "text",
          "text": "why was I charged twice this month",
          "fields": "contentVector",
          "k": 50,
          [[prop]]: [[value]]
        }
      ],
      "top": 10
    }
  slots:
    - id: mode
      options:
        - { id: pre, text: '"preFilter"' }
        - { id: post, text: '"postFilter"' }
        - { id: strict, text: '"strictPostFilter"' }
    - id: prop
      options:
        - { id: weight, text: '"weight"' }
        - { id: oversampling, text: '"oversampling"' }
        - { id: threshold, text: '"threshold"' }
    - id: value
      options:
        - { id: v05, text: "0.5" }
        - { id: v1, text: "1.0" }
        - { id: v2, text: "2.0" }
answer:
  values: { mode: pre, prop: weight, value: v2 }
explanation:
  correct:
    en: "`preFilter`, the default mode, applies the filter before the vector search, so the nearest neighbors are found among the filtered documents. The `weight` of a vector query multiplies its contribution to the RRF score; the text query has an implicit weight of 1.0, so a weight of 2.0 makes the vector results count twice as much."
    fr: "`preFilter`, le mode par défaut, applique le filtre avant la recherche vectorielle : les plus proches voisins sont donc trouvés parmi les documents filtrés. Le `weight` d'une requête vectorielle multiplie sa contribution au score RRF ; la requête texte a un poids implicite de 1.0, donc un poids de 2.0 fait compter deux fois plus les résultats vectoriels."
  options:
    post:
      en: "`postFilter` applies the filter after the vector search, to the neighbors already found, which can leave fewer billing documents."
      fr: "`postFilter` applique le filtre après la recherche vectorielle, aux voisins déjà trouvés, ce qui peut laisser moins de documents de facturation."
    strict:
      en: "`strictPostFilter` (preview) is also a post-filtering mode, not a filter applied before the vector search."
      fr: "`strictPostFilter` (préversion) est aussi un mode de post-filtrage, pas un filtre appliqué avant la recherche vectorielle."
    oversampling:
      en: "`oversampling` applies to compressed vector fields; it doesn't change the influence of the query in RRF."
      fr: "`oversampling` s'applique aux champs vectoriels compressés ; il ne change pas l'influence de la requête dans la fusion RRF."
    threshold:
      en: "`threshold` (preview) is an object that sets a minimum score; it doesn't weight the query."
      fr: "`threshold` (préversion) est un objet qui fixe un score minimal ; il ne pondère pas la requête."
    v05:
      en: |
        A weight below 1.0 reduces the influence of the vector results.
      fr: |
        Un poids inférieur à 1.0 réduit l'influence des résultats vectoriels.
    v1:
      en: |
        1.0 is the default and gives the vector query the same influence as the text query.
      fr: |
        1.0 est la valeur par défaut et donne à la requête vectorielle la même influence qu'à la requête texte.
references:
  - title: Create a vector query in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-query
  - title: Create a hybrid query in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-how-to-query
