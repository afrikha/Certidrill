id: ai300-5a-retrieval-criteria-code
objective: "5.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum compares two retrieval configurations of a RAG application in a Microsoft Foundry project. Each row of the test dataset contains `query`, `context` (the retrieved chunks), `retrieval_ground_truth` (document IDs with human relevance labels) and `retrieved_documents` (document IDs with their search scores).

    The evaluation must use two criteria:

    - a 1–5 score, judged by the deployment whose name is stored in `model_deployment`, of how relevant the retrieved chunks are to the query;
    - search metrics such as NDCG@3 computed against the human relevance labels.

    How should you complete the Python code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum compare deux configurations de récupération d'une application RAG dans un projet Microsoft Foundry. Chaque ligne du jeu de données de test contient `query`, `context` (les blocs récupérés), `retrieval_ground_truth` (des ID de documents avec des étiquettes de pertinence humaines) et `retrieved_documents` (des ID de documents avec leurs scores de recherche).

    L'évaluation doit utiliser deux critères :

    - un score de 1 à 5, jugé par le déploiement dont le nom est stocké dans `model_deployment`, de la pertinence des blocs récupérés par rapport à la requête ;
    - des métriques de recherche comme NDCG@3 calculées par rapport aux étiquettes de pertinence humaines.

    Comment devez-vous compléter le code Python ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    testing_criteria = [
        {
            "type": "azure_ai_evaluator",
            "name": "retrieval",
            "evaluator_name": [[ev]],
            "initialization_parameters": {"deployment_name": model_deployment},
            "data_mapping": {"query": "{{item.query}}", [[ctxkey]]: "{{item.context}}"},
        },
        {
            "type": "azure_ai_evaluator",
            "name": "document_retrieval",
            "evaluator_name": "builtin.document_retrieval",
            "data_mapping": {
                "retrieval_ground_truth": "{{item.retrieval_ground_truth}}",
                [[dockey]]: "{{item.retrieved_documents}}",
            },
        },
    ]
  slots:
    - id: ev
      options:
        - { id: retrieval, text: '"builtin.retrieval"' }
        - { id: relevance, text: '"builtin.relevance"' }
        - { id: groundedness, text: '"builtin.groundedness"' }
    - id: ctxkey
      options:
        - { id: context, text: '"context"' }
        - { id: response, text: '"response"' }
        - { id: groundtruth, text: '"ground_truth"' }
    - id: dockey
      options:
        - { id: retrieved, text: '"retrieved_documents"' }
        - { id: ctx2, text: '"context"' }
        - { id: resp2, text: '"response"' }
answer:
  values: { ev: retrieval, ctxkey: context, dockey: retrieved }
explanation:
  correct:
    en: "`builtin.retrieval` is an LLM-judged evaluator that scores the relevance of the retrieved context to the query; it takes `query` and `context` and needs a `deployment_name`. `builtin.document_retrieval` needs no judge model: it compares `retrieved_documents` with `retrieval_ground_truth` and returns metrics such as NDCG@3, XDCG@3, Fidelity and top-1 relevance."
    fr: "`builtin.retrieval` est un évaluateur jugé par un LLM qui note la pertinence du contexte récupéré par rapport à la requête ; il prend `query` et `context` et a besoin d'un `deployment_name`. `builtin.document_retrieval` n'a besoin d'aucun modèle juge : il compare `retrieved_documents` à `retrieval_ground_truth` et renvoie des métriques comme NDCG@3, XDCG@3, Fidelity et la pertinence top-1."
  options:
    relevance:
      en: |
        builtin.relevance scores the response against the query, not the retrieved chunks.
      fr: |
        builtin.relevance note la réponse par rapport à la requête, pas les blocs récupérés.
    groundedness:
      en: |
        builtin.groundedness checks that a response stays within the context; the dataset has no response to evaluate.
      fr: |
        builtin.groundedness vérifie qu'une réponse reste dans les limites du contexte ; le jeu de données ne contient aucune réponse à évaluer.
    response:
      en: |
        The Retrieval evaluator takes the retrieved chunks as `context`, not as a response.
      fr: |
        L'évaluateur Retrieval reçoit les blocs récupérés comme `context`, pas comme une réponse.
    groundtruth:
      en: |
        The Retrieval evaluator needs no ground truth; the chunks are its `context` input.
      fr: |
        L'évaluateur Retrieval n'a besoin d'aucune vérité terrain ; les blocs constituent son entrée `context`.
    ctx2:
      en: |
        Document Retrieval expects document IDs with scores in `retrieved_documents`, not text chunks in `context`.
      fr: |
        Document Retrieval attend des ID de documents avec des scores dans `retrieved_documents`, pas des blocs de texte dans `context`.
    resp2:
      en: |
        Document Retrieval has no `response` input; it evaluates the retrieved documents only.
      fr: |
        Document Retrieval n'a pas d'entrée `response` ; il n'évalue que les documents récupérés.
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
