id: ai300-5b-deployment-type-dragdrop
objective: "5.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum fine-tuned gpt-4.1 in a Microsoft Foundry project hosted in Sweden Central and plans its serverless deployments for each stage.

    Which deployment type should you use for each stage? To answer, drag the appropriate deployment types to the correct stages. Each deployment type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum a ajusté gpt-4.1 dans un projet Microsoft Foundry hébergé dans la région Sweden Central et planifie ses déploiements serverless pour chaque étape.

    Quel type de déploiement devez-vous utiliser pour chaque étape ? Pour répondre, faites glisser les types de déploiement appropriés vers les étapes correspondantes. Chaque type de déploiement peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: developer, text: Developer }
    - { id: standard, text: Standard }
    - { id: globalstd, text: Global Standard }
    - { id: ptu, text: Provisioned Throughput }
    - { id: gbatch, text: Global Batch }
  targets:
    - id: t1
      text: { en: "One-day evaluation by testers at the lowest cost; no SLA needed", fr: "Évaluation d'une journée par des testeurs au coût le plus bas ; aucun SLA requis" }
    - id: t2
      text: { en: "Production with irregular traffic and per-token inference billing; inferencing must stay in the resource's geography", fr: "Production avec un trafic irrégulier et une inférence facturée au jeton ; l'inférence doit rester dans la zone géographique de la ressource" }
    - id: t3
      text: { en: "Production with high, steady volume and predictable throughput, without per-token charges", fr: "Production avec un volume élevé et régulier et un débit prévisible, sans facturation au jeton" }
answer:
  mapping: { t1: developer, t2: standard, t3: ptu }
explanation:
  correct:
    en: |
      Developer deployments are for evaluation only: per-token billing, no hourly hosting fee, no SLA and a 24-hour lifetime. Standard keeps inferencing in the deployment's region and bills tokens plus an hourly hosting fee. Provisioned Throughput bills PTU-hours with no per-token charge for predictable throughput; gpt-4.1 supports it in Sweden Central.
    fr: |
      Les déploiements Developer servent uniquement à l'évaluation : facturation au jeton, pas de frais d'hébergement horaires, pas de SLA et une durée de vie de 24 heures. Standard conserve l'inférence dans la région du déploiement et facture les jetons plus des frais d'hébergement horaires. Provisioned Throughput facture des heures de PTU sans facturation au jeton pour un débit prévisible ; gpt-4.1 le prend en charge dans Sweden Central.
  options:
    globalstd: { en: "Global Standard uses global capacity, and custom weights may be stored outside the resource's geography.", fr: "Global Standard utilise une capacité mondiale, et les poids personnalisés peuvent être stockés hors de la zone géographique de la ressource." }
    gbatch: { en: "Global Batch processes asynchronous jobs with a 24-hour target turnaround; it fits none of the stages.", fr: "Global Batch traite des travaux asynchrones avec un délai cible de 24 heures ; il ne convient à aucune des étapes." }
references:
  - title: Training in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
  - title: Manage fine-tuning costs in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning-cost-management
