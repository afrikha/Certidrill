id: ai300-cs4b-hybrid-query
objective: "5.1.3"
type: dropdown
caseStudy: ai300-cs4b-margies-travel
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You are changing the query that app-margie-assist sends to `POST https://srch-margie.search.windows.net/indexes/travel-idx/docs/search?api-version=2026-04-01`. The query must meet the retrieval requirements, and the semantic ranker must receive as many vector matches as it can use as input.

    How should you complete the request body? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous modifiez la requête qu'app-margie-assist envoie à `POST https://srch-margie.search.windows.net/indexes/travel-idx/docs/search?api-version=2026-04-01`. La requête doit respecter les exigences de récupération, et le classeur sémantique doit recevoir autant de correspondances vectorielles qu'il peut en utiliser en entrée.

    Comment devez-vous compléter le corps de la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "search": "CHI-0427 late checkout for families",
      "vectorQueries": [
        {
          "kind": [[kind]],
          "text": "CHI-0427 late checkout for families",
          "fields": "chunkVector",
          "k": [[k]]
        }
      ],
      "queryType": [[qt]],
      "semanticConfiguration": "travel-semantic",
      "select": "title, chunk, hotelCode",
      "top": 10
    }
  slots:
    - id: kind
      options:
        - { id: vector, text: "\"vector\"" }
        - { id: text, text: "\"text\"" }
    - id: k
      options:
        - { id: k5, text: "5" }
        - { id: k10, text: "10" }
        - { id: k50, text: "50" }
    - id: qt
      options:
        - { id: simple, text: "\"simple\"" }
        - { id: semantic, text: "\"semantic\"" }
        - { id: full, text: "\"full\"" }
answer:
  values: { kind: text, k: k50, qt: semantic }
explanation:
  correct:
    en: "A request that contains both `search` and `vectorQueries` is a hybrid query: the keyword and vector results are merged with Reciprocal Rank Fusion (RRF), so the typed hotel code can match the searchable hotelCode field. `\"kind\": \"text\"` sends a string that Azure AI Search vectorizes with the vectorizer of chunkVector, so the application doesn't compute embeddings. `\"queryType\": \"semantic\"` with the semantic configuration reranks the merged results, and Microsoft recommends `k` set to 50 because the semantic ranker uses up to 50 matches as input."
    fr: "Une requête qui contient à la fois `search` et `vectorQueries` est une requête hybride : les résultats par mots clés et vectoriels sont fusionnés avec Reciprocal Rank Fusion (RRF), si bien que le code d'hôtel saisi peut correspondre au champ hotelCode, qui peut faire l'objet d'une recherche. `\"kind\": \"text\"` envoie une chaîne qu'Azure AI Search vectorise avec le vectoriseur de chunkVector ; l'application ne calcule donc pas d'incorporations. `\"queryType\": \"semantic\"` avec la configuration sémantique reclasse les résultats fusionnés, et Microsoft recommande de régler `k` sur 50, car le classeur sémantique utilise jusqu'à 50 correspondances en entrée."
  options:
    vector: { en: "\"kind\": \"vector\" expects a raw embedding in a vector property, which the application would have to compute.", fr: "\"kind\": \"vector\" attend une incorporation brute dans une propriété vector, que l'application devrait calculer." }
    k5: { en: "With k set to 5, the semantic ranker receives fewer vector matches than the 50 it can use.", fr: "Avec k réglé sur 5, le classeur sémantique reçoit moins de correspondances vectorielles que les 50 qu'il peut utiliser." }
    k10: { en: "k sets the number of nearest neighbors; matching top (10) gives the semantic ranker fewer matches than it can use.", fr: "k fixe le nombre de plus proches voisins ; l'aligner sur top (10) donne au classeur sémantique moins de correspondances qu'il ne peut en utiliser." }
    simple: { en: "simple is the default query syntax; it doesn't apply semantic reranking.", fr: "simple est la syntaxe de requête par défaut ; elle n'applique pas de reclassement sémantique." }
    full: { en: "full enables the Lucene query syntax; it doesn't apply semantic reranking.", fr: "full active la syntaxe de requête Lucene ; elle n'applique pas de reclassement sémantique." }
references:
  - title: Create a hybrid query in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-how-to-query
  - title: Create a vector query in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-query
