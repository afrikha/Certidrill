id: ai300-5b-programmed-training
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The research team of Woodgrove Bank wants to fine-tune an open-weight model in Microsoft Foundry. The team must define its own loss function and decide when checkpoints are saved and how updates are applied.

    The team doesn't want to provision training GPUs.

    What should you do?
  fr: |
    L'équipe de recherche de Woodgrove Bank souhaite effectuer le réglage précis d'un modèle à poids ouverts dans Microsoft Foundry. L'équipe doit définir sa propre fonction de perte et décider du moment où les points de contrôle sont enregistrés et de la façon dont les mises à jour sont appliquées.

    L'équipe ne souhaite pas provisionner de GPU d'entraînement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a Managed Training SFT job and set `learning_rate_multiplier` and `n_epochs`.", fr: "Créer un travail SFT en Managed Training et définir `learning_rate_multiplier` et `n_epochs`." } }
    - { id: b, text: { en: "Create a Managed Training RFT job that uses a `python` grader.", fr: "Créer un travail RFT en Managed Training qui utilise un évaluateur `python`." } }
    - { id: c, text: { en: "Create a Managed Training DPO job from an SFT checkpoint.", fr: "Créer un travail DPO en Managed Training à partir d'un point de contrôle SFT." } }
    - { id: d, text: { en: "Request access to Programmed Training and write the training loop in Python.", fr: "Demander l'accès à Programmed Training et écrire la boucle d'entraînement en Python." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Programmed Training (preview) lets you write a Python loop while Foundry runs the training and sampling operations on managed infrastructure. You control losses, rewards, rollouts, updates and checkpoints. It requires explicit access approval through the preview sign-up form.
    fr: |
      Programmed Training (préversion) permet d'écrire une boucle Python pendant que Foundry exécute les opérations d'entraînement et d'échantillonnage sur une infrastructure managée. Vous contrôlez les pertes, les récompenses, les déroulements (rollouts), les mises à jour et les points de contrôle. Il exige une approbation explicite, demandée avec le formulaire d'inscription à la préversion.
  options:
    a: { en: "Managed Training only exposes the supported hyperparameters; you can't define the loss or the checkpoint logic.", fr: "Managed Training n'expose que les hyperparamètres pris en charge ; vous ne pouvez définir ni la perte ni la logique des points de contrôle." }
    b: { en: "A `python` grader defines the reward of RFT, not the loss function or how checkpoints and updates are handled.", fr: "Un évaluateur `python` définit la récompense de RFT, pas la fonction de perte ni la gestion des points de contrôle et des mises à jour." }
    c: { en: "DPO uses a predefined preference objective; Managed Training doesn't let you replace it.", fr: "DPO utilise un objectif de préférence prédéfini ; Managed Training ne permet pas de le remplacer." }
references:
  - title: Fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
