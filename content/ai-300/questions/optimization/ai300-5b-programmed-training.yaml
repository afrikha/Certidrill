id: ai300-5b-programmed-training
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The research team of Woodgrove Bank has 3,000 examples of customer questions together with the answers that the bank expects. The team wants to fine-tune an open-weight model with Managed Training in Microsoft Foundry.

    The solution must use only generally available models and methods.

    Which model and method should you use?
  fr: |
    L'équipe de recherche de Woodgrove Bank dispose de 3 000 exemples de questions de clients accompagnées des réponses attendues par la banque. L'équipe souhaite effectuer le réglage précis d'un modèle à poids ouverts avec Managed Training dans Microsoft Foundry.

    La solution ne doit utiliser que des modèles et des méthodes en disponibilité générale.

    Quels modèle et méthode devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "RFT on Llama-3.3-70B-Instruct, with a `string_check` grader on the expected answers", fr: "RFT sur Llama-3.3-70B-Instruct, avec un évaluateur `string_check` sur les réponses attendues" } }
    - { id: b, text: { en: "DPO on Qwen3-32B, with the expected answers as preferred outputs", fr: "DPO sur Qwen3-32B, avec les réponses attendues comme sorties préférées" } }
    - { id: c, text: { en: "SFT on Llama-3.3-70B-Instruct, with the examples in the `messages` format", fr: "SFT sur Llama-3.3-70B-Instruct, avec les exemples au format `messages`" } }
    - { id: d, text: { en: "RFT on gpt-oss-120b, with a `python` grader on the expected answers", fr: "RFT sur gpt-oss-120b, avec un évaluateur `python` sur les réponses attendues" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Demonstrations of the expected answers are SFT data, and Llama-3.3-70B-Instruct is listed for SFT in Managed Training without a preview label. Support for one method doesn't carry over to another, so check the model table for each combination of model and method.
    fr: |
      Des démonstrations des réponses attendues sont des données SFT, et Llama-3.3-70B-Instruct figure dans la liste SFT de Managed Training sans mention de préversion. La prise en charge d'une méthode ne s'étend pas à une autre : vérifiez la table des modèles pour chaque combinaison de modèle et de méthode.
  options:
    a: { en: "Llama-3.3-70B-Instruct isn't listed for RFT; the generally available RFT models are o4-mini and, by invitation, gpt-5.", fr: "Llama-3.3-70B-Instruct ne figure pas dans la liste RFT ; les modèles RFT en disponibilité générale sont o4-mini et, sur invitation, gpt-5." }
    b: { en: "DPO supports only gpt-4o and the gpt-4.1 family, and DPO also needs a rejected response for each input.", fr: "DPO ne prend en charge que gpt-4o et la famille gpt-4.1, et il lui faut aussi une réponse rejetée pour chaque entrée." }
    d: { en: "gpt-oss-120b is listed for RFT only as a preview model.", fr: "gpt-oss-120b ne figure dans la liste RFT qu'en tant que modèle en préversion." }
references:
  - title: Training in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview
