id: ai300-5a-separate-embed-deployments
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses integrated vectorization in Azure AI Search. The Azure OpenAI Embedding skill of the skillset and the vectorizer of the index both call the same `text-embedding-3-large` deployment, named **embed-prod**.

    When the indexer processes a large batch of documents, user queries fail with throttling errors returned by embed-prod, and the deployment metrics don't show which traffic comes from the indexer. You need to isolate query vectorization from the indexing load without changing the vector space of the index.

    What should you do?
  fr: |
    Contoso utilise la vectorisation intégrée dans Azure AI Search. La compétence Azure OpenAI Embedding de l'ensemble de compétences et le vectoriseur de l'index appellent tous deux le même déploiement `text-embedding-3-large`, nommé **embed-prod**.

    Lorsque l'indexeur traite un grand lot de documents, les requêtes des utilisateurs échouent avec des erreurs de limitation renvoyées par embed-prod, et les métriques du déploiement n'indiquent pas quel trafic provient de l'indexeur. Vous devez isoler la vectorisation des requêtes de la charge d'indexation sans changer l'espace vectoriel de l'index.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a deployment of `text-embedding-3-small`, and configure the vectorizer to call it while the skill keeps calling embed-prod.", fr: "Créer un déploiement de `text-embedding-3-small`, et configurer le vectoriseur pour qu'il l'appelle pendant que la compétence continue d'appeler embed-prod." }
    - id: b
      text: { en: "Set `dimensions` to 1024 on the embedding skill so that each indexing request consumes fewer tokens on embed-prod.", fr: "Définir `dimensions` sur 1024 dans la compétence d'incorporation pour que chaque requête d'indexation consomme moins de jetons sur embed-prod." }
    - id: c
      text: { en: "Remove the vectorizer, and send vector queries of kind `text` so that the search service embeds queries without calling a deployment.", fr: "Supprimer le vectoriseur, et envoyer des requêtes vectorielles de type `text` pour que le service de recherche incorpore les requêtes sans appeler de déploiement." }
    - id: d
      text: { en: "Create a second deployment of `text-embedding-3-large`, and configure the vectorizer to call it while the skill keeps calling embed-prod.", fr: "Créer un second déploiement de `text-embedding-3-large`, et configurer le vectoriseur pour qu'il l'appelle pendant que la compétence continue d'appeler embed-prod." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Learn recommends separate deployments of the embedding model for the skill and for the query vectorizer, so that each can be sized for its workload and indexer traffic can be told apart from query traffic. Because both deployments use the same model, query vectors stay in the same vector space as the indexed document vectors.
    fr: |
      Learn recommande des déploiements distincts du modèle d'incorporation pour la compétence et pour le vectoriseur de requêtes, afin de dimensionner chacun selon sa charge et de distinguer le trafic de l'indexeur de celui des requêtes. Comme les deux déploiements utilisent le même modèle, les vecteurs des requêtes restent dans le même espace vectoriel que les vecteurs des documents indexés.
  options:
    a:
      en: |
        A different embedding model produces vectors in a different vector space, so query vectors would no longer be comparable with the indexed vectors.
      fr: |
        Un modèle d'incorporation différent produit des vecteurs dans un autre espace vectoriel ; les vecteurs des requêtes ne seraient plus comparables aux vecteurs indexés.
    b:
      en: |
        The `dimensions` parameter sets the size of the output vectors; it doesn't reduce the input tokens, and it would require a vector field with the same dimensions.
      fr: |
        Le paramètre `dimensions` fixe la taille des vecteurs de sortie ; il ne réduit pas les jetons d'entrée, et il exigerait un champ vectoriel de mêmes dimensions.
    c:
      en: |
        Vector queries of kind `text` require a vectorizer assigned to the vector field; the vectorizer is what calls the embedding model.
      fr: |
        Les requêtes vectorielles de type `text` exigent un vectoriseur attribué au champ vectoriel ; c'est le vectoriseur qui appelle le modèle d'incorporation.
references:
  - title: Azure OpenAI Embedding skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-azure-openai-embedding
  - title: Create a vector query in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-query
