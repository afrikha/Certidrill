id: ai300-5a-hnsw-eknn
objective: "5.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure AI Search index that contains two vector fields:

    - `bodyVector` uses a vector profile whose algorithm is of kind `hnsw`.
    - `titleVector` uses a vector profile whose algorithm is of kind `exhaustiveKnn`.

    You plan retrieval tuning experiments on this index.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un index Azure AI Search qui contient deux champs vectoriels :

    - `bodyVector` utilise un profil vectoriel dont l'algorithme est de type `hnsw`.
    - `titleVector` utilise un profil vectoriel dont l'algorithme est de type `exhaustiveKnn`.

    Vous prévoyez des expériences d'optimisation de la récupération sur cet index.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can run an exhaustive KNN search on `bodyVector` by setting `exhaustive` to `true` in the vector query.
        fr: |
          Vous pouvez exécuter une recherche KNN exhaustive sur `bodyVector` en définissant `exhaustive` sur `true` dans la requête vectorielle.
    - id: s2
      text:
        en: |
          You can run an HNSW search on `titleVector` by setting `exhaustive` to `false` in the vector query.
        fr: |
          Vous pouvez exécuter une recherche HNSW sur `titleVector` en définissant `exhaustive` sur `false` dans la requête vectorielle.
    - id: s3
      text:
        en: |
          The vectors of `titleVector` consume the vector index size quota of the search service, like the vectors of `bodyVector`.
        fr: |
          Les vecteurs de `titleVector` consomment le quota de taille d'index vectoriel du service de recherche, comme les vecteurs de `bodyVector`.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A field indexed for HNSW can still be searched with exhaustive KNN by setting `exhaustive` to `true` at query time, which is useful to build a ground-truth set and measure the recall of HNSW. A field indexed for `exhaustiveKnn` has no HNSW graph, so it doesn't support HNSW queries. Exhaustive KNN fields don't consume the vector index size quota, whereas HNSW keeps all vectors in memory and consumes it.
    fr: |
      Un champ indexé pour HNSW peut quand même être interrogé en KNN exhaustif en définissant `exhaustive` sur `true` au moment de la requête, ce qui permet de constituer un jeu de vérité terrain et de mesurer le rappel de HNSW. Un champ indexé pour `exhaustiveKnn` n'a pas de graphe HNSW : il ne prend donc pas en charge les requêtes HNSW. Les champs KNN exhaustifs ne consomment pas le quota de taille d'index vectoriel, alors que HNSW conserve tous les vecteurs en mémoire et consomme ce quota.
references:
  - title: Relevance in vector search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-ranking
