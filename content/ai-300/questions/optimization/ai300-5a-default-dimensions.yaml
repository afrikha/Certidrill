id: ai300-5a-default-dimensions
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam creates a new Azure AI Search index for a RAG assistant. To limit vector storage, the vector field `contentVector` is defined with `dimensions` set to 1536. The skillset contains a Text Split skill and an Azure OpenAI Embedding skill whose `modelName` is `text-embedding-3-large`. The embedding skill has no `dimensions` parameter.

    When the indexer runs, no vectors are written to `contentVector`. You need to fix the indexing and keep 1,536-dimension vectors generated by `text-embedding-3-large`.

    What should you do?
  fr: |
    Fabrikam crée un nouvel index Azure AI Search pour un assistant RAG. Pour limiter le stockage des vecteurs, le champ vectoriel `contentVector` est défini avec `dimensions` égal à 1536. L'ensemble de compétences contient une compétence Text Split et une compétence Azure OpenAI Embedding dont le `modelName` est `text-embedding-3-large`. La compétence d'incorporation n'a pas de paramètre `dimensions`.

    Lorsque l'indexeur s'exécute, aucun vecteur n'est écrit dans `contentVector`. Vous devez corriger l'indexation et conserver des vecteurs de 1 536 dimensions générés par `text-embedding-3-large`.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set the `maximumPageLength` of the Text Split skill to 1536.", fr: "Définir le `maximumPageLength` de la compétence Text Split sur 1536." }
    - id: b
      text: { en: "Change the `type` of the `contentVector` field to `Collection(Edm.Half)`.", fr: "Remplacer le `type` du champ `contentVector` par `Collection(Edm.Half)`." }
    - id: c
      text: { en: "Set the `dimensions` parameter of the Azure OpenAI Embedding skill to 1536.", fr: "Définir le paramètre `dimensions` de la compétence Azure OpenAI Embedding sur 1536." }
    - id: d
      text: { en: "Change the algorithm of the vector profile of `contentVector` to `exhaustiveKnn`.", fr: "Remplacer l'algorithme du profil vectoriel de `contentVector` par `exhaustiveKnn`." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When `dimensions` is omitted, the Azure OpenAI Embedding skill returns the maximum size of the model, 3,072 dimensions for `text-embedding-3-large`, which doesn't match the 1,536-dimension field. The third-generation models accept a range of output sizes (1 to 3,072 for the large model), and Learn requires the same value on the skill and on the vector field.
    fr: |
      Lorsque `dimensions` est omis, la compétence Azure OpenAI Embedding renvoie la taille maximale du modèle, soit 3 072 dimensions pour `text-embedding-3-large`, ce qui ne correspond pas au champ de 1 536 dimensions. Les modèles de troisième génération acceptent une plage de tailles de sortie (de 1 à 3 072 pour le grand modèle), et Learn exige la même valeur dans la compétence et dans le champ vectoriel.
  options:
    b:
      en: |
        A narrower data type stores each value in fewer bytes; it doesn't change the number of dimensions that the skill returns.
      fr: |
        Un type de données plus étroit stocke chaque valeur sur moins d'octets ; il ne change pas le nombre de dimensions renvoyé par la compétence.
    d:
      en: |
        The search algorithm doesn't change the number of dimensions of the vectors; the 3,072-dimension output still doesn't fit the field.
      fr: |
        L'algorithme de recherche ne change pas le nombre de dimensions des vecteurs ; la sortie de 3 072 dimensions ne correspond toujours pas au champ.
    a:
      en: "`maximumPageLength` limits the length of each chunk of text; the vector size depends only on the embedding model and its `dimensions` parameter."
      fr: "`maximumPageLength` limite la longueur de chaque bloc de texte ; la taille du vecteur dépend uniquement du modèle d'incorporation et de son paramètre `dimensions`."
references:
  - title: Azure OpenAI Embedding skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-azure-openai-embedding
  - title: Create a vector index in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-create-index
