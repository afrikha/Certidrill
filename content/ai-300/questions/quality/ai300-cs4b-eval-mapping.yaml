id: ai300-cs4b-eval-mapping
objective: "4.1.1"
type: dropdown
caseStudy: ai300-cs4b-margies-travel
difficulty: 2
status: draft
stem:
  en: |
    You are writing the testing criteria of the cloud evaluation of eval-trips.jsonl by using the Microsoft Foundry SDK. The variable judge_deployment contains the name of the model deployment used as the judge.

    How should you complete the code to meet the evaluation requirements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez les critères de test de l'évaluation cloud d'eval-trips.jsonl à l'aide du SDK Microsoft Foundry. La variable judge_deployment contient le nom du déploiement de modèle utilisé comme juge.

    Comment devez-vous compléter le code pour respecter les exigences d'évaluation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    testing_criteria = [
        {
            "type": "azure_ai_evaluator",
            "name": "unsupported-claims",
            "evaluator_name": [[ev1]],
            "initialization_parameters": {"deployment_name": judge_deployment},
            "data_mapping": {
                "context": "{{item.retrieved_passages}}",
                "response": [[resp]],
            },
        },
        {
            "type": "azure_ai_evaluator",
            "name": "passage-quality",
            "evaluator_name": [[ev2]],
            "initialization_parameters": {"deployment_name": judge_deployment},
            "data_mapping": {
                "query": "{{item.question}}",
                "context": "{{item.retrieved_passages}}",
            },
        },
    ]
  slots:
    - id: ev1
      options:
        - { id: relevance, text: "\"builtin.relevance\"" }
        - { id: coherence, text: "\"builtin.coherence\"" }
        - { id: groundedness, text: "\"builtin.groundedness\"" }
        - { id: fluency, text: "\"builtin.fluency\"" }
    - id: resp
      options:
        - { id: reference, text: "\"{{item.reference_answer}}\"" }
        - { id: sample, text: "\"{{sample.output_text}}\"" }
        - { id: answer, text: "\"{{item.answer}}\"" }
        - { id: question, text: "\"{{item.question}}\"" }
    - id: ev2
      options:
        - { id: retrieval, text: "\"builtin.retrieval\"" }
        - { id: relevance2, text: "\"builtin.relevance\"" }
        - { id: groundedness2, text: "\"builtin.groundedness\"" }
        - { id: coherence2, text: "\"builtin.coherence\"" }
answer:
  values: { ev1: groundedness, resp: answer, ev2: retrieval }
explanation:
  correct:
    en: "Groundedness checks whether a response stays within the provided context without fabricated content; the response to check is the assistant's answer, which is already stored in the dataset, so it is mapped with `{{item.answer}}`. Retrieval judges, from a query and a context, how relevant the retrieved chunks are to the question. In a dataset evaluation, `{{item.<column>}}` binds an evaluator input to a column of the dataset."
    fr: "Groundedness vérifie qu'une réponse reste dans le contexte fourni sans contenu inventé ; la réponse à vérifier est celle de l'assistant, déjà stockée dans le jeu de données, et elle est donc associée avec `{{item.answer}}`. Retrieval juge, à partir d'une requête et d'un contexte, la pertinence des blocs récupérés par rapport à la question. Dans une évaluation de jeu de données, `{{item.<colonne>}}` relie une entrée d'évaluateur à une colonne du jeu de données."
  options:
    relevance: { en: "Relevance judges whether the response addresses the query; it doesn't detect information missing from the passages.", fr: "Relevance juge si la réponse traite la requête ; il ne détecte pas les informations absentes des passages." }
    coherence: { en: "Coherence measures the logical flow of the response, not its support by a context.", fr: "Coherence mesure l'enchaînement logique de la réponse, pas son ancrage dans un contexte." }
    fluency: { en: "Fluency measures grammar and readability of the response only.", fr: "Fluency mesure uniquement la grammaire et la lisibilité de la réponse." }
    reference: { en: "The expert's reference answer isn't the assistant's response; checking it against the passages says nothing about the assistant's unsupported claims.", fr: "La réponse de référence de l'expert n'est pas la réponse de l'assistant ; la comparer aux passages ne dit rien des affirmations non étayées de l'assistant." }
    sample: { en: "{{sample.output_text}} refers to output generated during the evaluation run by a target; here the answers already exist in the dataset.", fr: "{{sample.output_text}} désigne une sortie générée pendant l'exécution de l'évaluation par une cible ; ici, les réponses existent déjà dans le jeu de données." }
    question: { en: "The question is the query, not the response whose claims must be checked.", fr: "La question est la requête, pas la réponse dont les affirmations doivent être vérifiées." }
    relevance2: { en: "Relevance evaluates a response against the query; it takes query and response, not the retrieved context.", fr: "Relevance évalue une réponse par rapport à la requête ; il prend la requête et la réponse, pas le contexte récupéré." }
    groundedness2: { en: "Groundedness evaluates the response against the context; it doesn't judge whether the passages fit the question.", fr: "Groundedness évalue la réponse par rapport au contexte ; il ne juge pas si les passages conviennent à la question." }
    coherence2: { en: "Coherence evaluates the response's logical flow, not the retrieved passages.", fr: "Coherence évalue l'enchaînement logique de la réponse, pas les passages récupérés." }
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
  - title: General Purpose Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/general-purpose-evaluators
