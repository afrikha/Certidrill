id: ai300-4a-qm-symptom-dd
objective: "4.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has a RAG chat application that answers questions from product manuals. Reviewers report four kinds of problems in the responses.

    You need to add one built-in evaluator to the evaluation for each problem. Which evaluator should you use for each problem? To answer, drag the appropriate evaluators to the correct problems. Each evaluator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'une application de conversation RAG qui répond aux questions à partir des manuels produits. Des relecteurs signalent quatre types de problèmes dans les réponses.

    Vous devez ajouter à l'évaluation un évaluateur intégré pour chaque problème. Quel évaluateur devez-vous utiliser pour chaque problème ? Pour répondre, faites glisser les évaluateurs appropriés vers les problèmes correspondants. Chaque évaluateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: grd, text: Groundedness }
    - { id: rel, text: Relevance }
    - { id: coh, text: Coherence }
    - { id: flu, text: Fluency }
    - { id: ret, text: Retrieval }
    - { id: sim, text: Similarity }
  targets:
    - id: t1
      text: { en: "Responses include facts that do not appear in the retrieved passages", fr: "Les réponses contiennent des faits qui n'apparaissent pas dans les passages récupérés" }
    - id: t2
      text: { en: "Responses stay within the retrieved passages but do not address what the user asked", fr: "Les réponses s'en tiennent aux passages récupérés, mais ne traitent pas ce que l'utilisateur a demandé" }
    - id: t3
      text: { en: "Responses are grammatically correct, but the ideas jump from one point to another without logical transitions", fr: "Les réponses sont grammaticalement correctes, mais les idées passent d'un point à l'autre sans transitions logiques" }
    - id: t4
      text: { en: "Responses contain grammatical errors and awkward phrasing", fr: "Les réponses contiennent des fautes de grammaire et des formulations maladroites" }
answer:
  mapping: { t1: grd, t2: rel, t3: coh, t4: flu }
explanation:
  correct:
    en: Groundedness checks that the response contains no content outside the supplied context. Relevance checks that the response addresses the query. Coherence measures the logical, orderly presentation of ideas, and Fluency measures grammar, vocabulary and readability, independent of content.
    fr: Groundedness vérifie que la réponse ne contient aucun contenu extérieur au contexte fourni. Relevance vérifie que la réponse traite la requête. Coherence mesure la présentation logique et ordonnée des idées, et Fluency la grammaire, le vocabulaire et la lisibilité, indépendamment du contenu.
  options:
    ret: { en: "Retrieval scores the relevance of the retrieved chunks to the query, not the generated response.", fr: "Retrieval note la pertinence des blocs récupérés par rapport à la requête, pas la réponse générée." }
    sim: { en: "Similarity compares the response with a ground truth answer, which the reported problems do not involve.", fr: "Similarity compare la réponse à une réponse de vérité de terrain, ce qui ne correspond à aucun des problèmes signalés." }
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
  - title: General purpose evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/general-purpose-evaluators
