id: ai300-4b-diag-settings
objective: "4.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Microsoft Foundry resource named **fdy-nw** that hosts model deployments used in production.

    To troubleshoot failed calls, you need to keep a record of every inference request and response of fdy-nw, including status codes and latency, and query these records with KQL. You create a diagnostic setting on fdy-nw.

    How should you configure the diagnostic setting, and which table should you query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'une ressource Microsoft Foundry nommée **fdy-nw** qui héberge des déploiements de modèles utilisés en production.

    Pour résoudre les problèmes d'appels en échec, vous devez conserver une trace de chaque requête et réponse d'inférence de fdy-nw, avec les codes d'état et la latence, et interroger ces enregistrements avec KQL. Vous créez un paramètre de diagnostic sur fdy-nw.

    Comment devez-vous configurer le paramètre de diagnostic, et quelle table devez-vous interroger ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Log category: [[cat]]

      Destination: [[dest]]

      Table to query: [[tbl]]
    fr: |
      Catégorie de journal : [[cat]]

      Destination : [[dest]]

      Table à interroger : [[tbl]]
  slots:
    - id: cat
      options:
        - { id: audit, text: Audit }
        - { id: reqresp, text: RequestResponse }
        - { id: trace, text: Trace }
    - id: dest
      options:
        - { id: storage, text: { en: "Archive to a storage account", fr: "Archiver dans un compte de stockage" } }
        - { id: hub, text: { en: "Stream to an event hub", fr: "Diffuser vers un hub d'événements" } }
        - { id: law, text: { en: "Send to Log Analytics workspace", fr: "Envoyer à l'espace de travail Log Analytics" } }
    - id: tbl
      options:
        - { id: azdiag, text: AzureDiagnostics }
        - { id: azmetrics, text: AzureMetrics }
        - { id: azact, text: AzureActivity }
answer:
  values: { cat: reqresp, dest: law, tbl: azdiag }
explanation:
  correct:
    en: The RequestResponse category records every inference request and response, including status codes and latency. Resource logs are generated automatically but must be routed by a diagnostic setting; sending them to a Log Analytics workspace lets you query them with KQL. The resource logs of the Foundry resource land in the AzureDiagnostics table.
    fr: La catégorie RequestResponse enregistre chaque requête et réponse d'inférence, avec les codes d'état et la latence. Les journaux de ressources sont générés automatiquement, mais doivent être acheminés par un paramètre de diagnostic ; les envoyer à un espace de travail Log Analytics permet de les interroger avec KQL. Les journaux de ressources de la ressource Foundry arrivent dans la table AzureDiagnostics.
  options:
    audit: { en: "Audit records administrative operations such as deployments and access control changes, not inference calls.", fr: "Audit enregistre les opérations d'administration comme les déploiements et les modifications du contrôle d'accès, pas les appels d'inférence." }
    trace: { en: "Trace holds detailed debugging traces of inference calls, not the record of each request and response.", fr: "Trace contient des traces de débogage détaillées des appels d'inférence, pas l'enregistrement de chaque requête et réponse." }
    storage: { en: "A storage account keeps the logs but does not let you query them with KQL.", fr: "Un compte de stockage conserve les journaux, mais ne permet pas de les interroger avec KQL." }
    hub: { en: "An event hub streams the logs to another system; it does not store them for KQL queries.", fr: "Un hub d'événements diffuse les journaux vers un autre système ; il ne les stocke pas pour des requêtes KQL." }
    azmetrics: { en: "AzureMetrics contains exported metric values, not resource logs.", fr: "AzureMetrics contient les valeurs de métriques exportées, pas les journaux de ressources." }
    azact: { en: "AzureActivity contains activity log operations on the resource, not inference requests.", fr: "AzureActivity contient les opérations du journal d'activité sur la ressource, pas les requêtes d'inférence." }
references:
  - title: Monitor model deployments in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/monitor-models
  - title: Azure OpenAI monitoring data reference
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/monitor-openai-reference
