id: ai300-4a-ds-columns-dd
objective: "4.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys prepares JSONL evaluation datasets for a Foundry agent named **order-agent**. Each dataset supports a different evaluation scenario.

    Which field must each dataset provide for its scenario? To answer, drag the appropriate fields to the correct scenarios. Each field may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prépare des jeux de données d'évaluation JSONL pour un agent Foundry nommé **order-agent**. Chaque jeu de données correspond à un scénario d'évaluation différent.

    Quel champ chaque jeu de données doit-il fournir pour son scénario ? Pour répondre, faites glisser les champs appropriés vers les scénarios correspondants. Chaque champ peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: msg, text: messages }
    - { id: qr, text: { en: "query and response", fr: "query et response" } }
    - { id: tcd, text: test_case_description }
    - { id: gt, text: ground_truth }
    - { id: td, text: tool_definitions }
    - { id: ctx, text: context }
  targets:
    - id: t1
      text: { en: "Evaluate complete conversations that users already had with order-agent", fr: "Évaluer des conversations complètes que des utilisateurs ont déjà eues avec order-agent" }
    - id: t2
      text: { en: "Evaluate stored outputs of a batch job, each row holding a separate input string and output string", fr: "Évaluer les sorties stockées d'un traitement par lots, chaque ligne contenant une chaîne d'entrée et une chaîne de sortie distinctes" }
    - id: t3
      text: { en: "Seed simulated multi-turn conversations from scenario descriptions", fr: "Amorcer des conversations multitours simulées à partir de descriptions de scénarios" }
    - id: t4
      text: { en: "Compare each response with a reference answer written by a subject-matter expert", fr: "Comparer chaque réponse à une réponse de référence rédigée par un expert du domaine" }
answer:
  mapping: { t1: msg, t2: qr, t3: tcd, t4: gt }
explanation:
  correct:
    en: An existing interaction is evaluated from a `messages` array, and separately stored inputs and outputs from `query` and `response`. Simulated conversations are seeded by `test_case_description` (with an optional `desired_num_turns`). Evaluators that compare with a reference answer read it from `ground_truth`.
    fr: Une interaction existante est évaluée à partir d'un tableau `messages`, et des entrées et sorties stockées séparément à partir de `query` et `response`. Les conversations simulées sont amorcées par `test_case_description` (avec un `desired_num_turns` facultatif). Les évaluateurs qui comparent avec une réponse de référence la lisent dans `ground_truth`.
  options:
    td: { en: "tool_definitions describes the schemas of the tools available to the agent; it is an evaluator-specific column, not the primary field of these scenarios.", fr: "tool_definitions décrit les schémas des outils disponibles pour l'agent ; c'est une colonne propre à certains évaluateurs, pas le champ principal de ces scénarios." }
    ctx: { en: "context holds supporting material, such as retrieved passages, for evaluators like Groundedness.", fr: "context contient des éléments d'appui, comme des passages récupérés, pour des évaluateurs tels que Groundedness." }
references:
  - title: Evaluation dataset schema in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/evaluation-dataset-schema
