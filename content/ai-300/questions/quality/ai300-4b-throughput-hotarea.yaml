id: ai300-4b-throughput-hotarea
objective: "4.2.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a Standard Azure OpenAI deployment named **chat-std** in a Microsoft Foundry resource. You open metrics explorer for the resource to measure the throughput of chat-std. The following table shows some of the available metrics.

    Answer each prompt by selecting the metric that you should chart.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un déploiement Azure OpenAI Standard nommé **chat-std** dans une ressource Microsoft Foundry. Vous ouvrez Metrics Explorer pour la ressource afin de mesurer le débit de chat-std. Le tableau suivant présente certaines des métriques disponibles.

    Répondez à chaque consigne en sélectionnant la métrique que vous devez représenter.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Total tokens per minute (prompt tokens plus generated tokens) processed by chat-std", fr: "Nombre total de jetons par minute (jetons d'invite et jetons générés) traités par chat-std" }
    - id: p2
      text: { en: "Number of calls per minute to chat-std, which you can split by status code to find throttled calls", fr: "Nombre d'appels par minute vers chat-std, que vous pouvez fractionner par code d'état pour trouver les appels limités" }
  grid:
    header: [{ en: "Metric", fr: "Métrique" }, { en: "REST name", fr: "Nom REST" }, { en: "Unit", fr: "Unité" }]
    rows:
      - [{ text: Azure OpenAI Requests, area: req }, { text: AzureOpenAIRequests }, { text: Count }]
      - [{ text: Processed Inference Tokens, area: tok }, { text: TokenTransaction }, { text: Count }]
      - [{ text: Tokens Per Second, area: tps }, { text: AzureOpenAITokenPerSecond }, { text: Count }]
      - [{ text: Active Tokens, area: active }, { text: ActiveTokens }, { text: Count }]
      - [{ text: Time to Response, area: ttr }, { text: AzureOpenAITimeToResponse }, { text: MilliSeconds }]
answer:
  values: { p1: tok, p2: req }
explanation:
  correct:
    en: Microsoft recommends two throughput measures per deployment. Processed Inference Tokens is the sum of prompt and generated tokens, which gives tokens per minute. Azure OpenAI Requests counts calls; split it by ModelDeploymentName and StatusCode to see calls per minute and the 429 responses. Tokens Per Second describes generation speed, and Active Tokens applies only to provisioned deployments.
    fr: Microsoft recommande deux mesures de débit par déploiement. Processed Inference Tokens est la somme des jetons d'invite et des jetons générés, ce qui donne les jetons par minute. Azure OpenAI Requests compte les appels ; fractionnez-la par ModelDeploymentName et StatusCode pour voir les appels par minute et les réponses 429. Tokens Per Second décrit la vitesse de génération, et Active Tokens ne s'applique qu'aux déploiements approvisionnés.
references:
  - title: Azure OpenAI in Microsoft Foundry Models performance & latency
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/latency
  - title: Azure OpenAI monitoring data reference
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/monitor-openai-reference
