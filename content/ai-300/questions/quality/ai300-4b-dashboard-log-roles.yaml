id: ai300-4b-dashboard-log-roles
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Microsoft Foundry project that contains several agents. An Application Insights resource named **appi-nw** is connected to the project. The tables of the Log Analytics workspace behind appi-nw have the protection level **Protected**.

    A data analyst named User1 must be able to open the log-based views of the Agent Monitoring Dashboard and query the telemetry stored in appi-nw. User1 must not be able to change any monitoring configuration. The solution must follow the principle of least privilege.

    Which two roles should you assign to User1? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un projet Microsoft Foundry qui contient plusieurs agents. Une ressource Application Insights nommée **appi-nw** est connectée au projet. Les tables de l'espace de travail Log Analytics associé à appi-nw ont le niveau de protection **Protected**.

    Un analyste de données nommé User1 doit pouvoir ouvrir les vues du tableau de bord Agent Monitoring Dashboard basées sur les journaux et interroger la télémétrie stockée dans appi-nw. User1 ne doit pouvoir modifier aucune configuration de surveillance. La solution doit respecter le principe du moindre privilège.

    Quels sont les deux rôles que vous devez attribuer à User1 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Log Analytics Reader }
    - { id: b, text: Log Analytics Contributor }
    - { id: c, text: Privileged Monitoring Data Reader }
    - { id: d, text: Monitoring Contributor }
    - { id: e, text: Application Insights Component Contributor }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Querying the telemetry behind the dashboard and traces requires Log Analytics Reader. When the underlying Log Analytics tables are protected, Foundry documentation adds Privileged Monitoring Data Reader. Both roles only grant read access, which meets least privilege.
    fr: Interroger la télémétrie qui alimente le tableau de bord et les traces nécessite Log Analytics Reader. Lorsque les tables Log Analytics sous-jacentes sont protégées, la documentation Foundry ajoute Privileged Monitoring Data Reader. Les deux rôles n'accordent qu'un accès en lecture, ce qui respecte le moindre privilège.
  options:
    b: { en: "Log Analytics Contributor can modify workspace settings, more than User1 needs.", fr: "Log Analytics Contributor peut modifier les paramètres de l'espace de travail, plus que ce dont User1 a besoin." }
    d: { en: "Monitoring Contributor can change monitoring settings such as alerts and diagnostic settings, which User1 must not do.", fr: "Monitoring Contributor peut modifier des paramètres de surveillance comme les alertes et les paramètres de diagnostic, ce que User1 ne doit pas faire." }
    e: { en: "Application Insights Component Contributor manages the Application Insights resource itself; it is a write role, not the role the documentation requires to read the protected data.", fr: "Application Insights Component Contributor gère la ressource Application Insights elle-même ; c'est un rôle d'écriture, pas le rôle que la documentation exige pour lire les données protégées." }
references:
  - title: Monitor agents with the Agent Monitoring Dashboard
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard
  - title: Set up tracing in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup
