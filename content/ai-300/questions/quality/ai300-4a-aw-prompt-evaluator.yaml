id: ai300-4a-aw-prompt-evaluator
objective: "4.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys registers a prompt-based custom evaluator named **friendliness_evaluator** in a Foundry project, and then uses it in an evaluation of stored responses. The evaluator must meet the following requirements:

    - The judge model returns an integer score from 1 to 5.
    - Responses that score 3 or more pass.

    How should you complete the Python code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys inscrit un évaluateur personnalisé basé sur une invite nommé **friendliness_evaluator** dans un projet Foundry, puis l'utilise dans une évaluation de réponses stockées. L'évaluateur doit répondre aux exigences suivantes :

    - Le modèle juge renvoie un score entier de 1 à 5.
    - Les réponses dont le score est supérieur ou égal à 3 sont acceptées.

    Comment devez-vous compléter le code Python ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    # Excerpt of the evaluator definition passed to create_version
    "definition": {
        "type": EvaluatorDefinitionType.PROMPT,
        "prompt_text": "Rate how friendly the response is from 1 to 5.\nResponse:\n[[var]]\n...",
        "data_schema": {
            "type": "object",
            "properties": {"response": {"type": "string"}},
            "required": ["response"],
        },
        "metrics": {
            "custom_prompt": {
                "type": [[metric]],
                "desirable_direction": "increase",
                "min_value": 1,
                "max_value": 5,
            }
        },
    },

    # Testing criteria of the evaluation
    testing_criteria = [
        {
            "type": "azure_ai_evaluator",
            "name": "friendliness",
            "evaluator_name": "friendliness_evaluator",
            "data_mapping": {"response": "{{item.response}}"},
            "initialization_parameters": {
                "deployment_name": judge_deployment,
                [[init]]: 3,
            },
        },
    ]
  slots:
    - id: var
      options:
        - { id: brace, text: "{{response}}" }
        - { id: dollar, text: "${data.response}" }
        - { id: sample, text: "{{sample.output_text}}" }
    - id: metric
      options:
        - { id: ord, text: "\"ordinal\"" }
        - { id: cont, text: "\"continuous\"" }
        - { id: bin, text: "\"binary\"" }
    - id: init
      options:
        - { id: thr, text: "\"threshold\"" }
        - { id: pass, text: "\"pass_threshold\"" }
        - { id: labels, text: "\"passing_labels\"" }
answer:
  values: { var: brace, metric: ord, init: thr }
explanation:
  correct:
    en: "The judge prompt of a prompt-based evaluator uses double curly braces for its template variables, such as `{{response}}`, which match the fields of `data_schema`. An ordinal metric returns integers on the range you define (here 1–5). Prompt-based evaluators require the `deployment_name` and `threshold` init parameters, set in `initialization_parameters` when you use the evaluator."
    fr: "L'invite du juge d'un évaluateur basé sur une invite utilise des doubles accolades pour ses variables de modèle, comme `{{response}}`, qui correspondent aux champs de `data_schema`. Une métrique ordinale renvoie des entiers sur la plage que vous définissez (ici 1–5). Les évaluateurs basés sur une invite exigent les paramètres d'initialisation `deployment_name` et `threshold`, définis dans `initialization_parameters` quand vous utilisez l'évaluateur."
  options:
    dollar: { en: "The ${data.field} syntax belongs to the column mapping of the classic Azure AI Evaluation SDK, not to judge prompts.", fr: "La syntaxe ${data.champ} appartient au mappage de colonnes du SDK Azure AI Evaluation classique, pas aux invites de juge." }
    cont: { en: "A continuous metric returns floats, not integer scores.", fr: "Une métrique continue renvoie des nombres décimaux, pas des scores entiers." }
    bin: { en: "A binary metric returns a boolean, not a 1–5 score.", fr: "Une métrique binaire renvoie un booléen, pas un score de 1 à 5." }
    pass: { en: "pass_threshold is the init parameter of code-based evaluators.", fr: "pass_threshold est le paramètre d'initialisation des évaluateurs basés sur du code." }
    labels: { en: "passing_labels configures label_model graders.", fr: "passing_labels configure les correcteurs label_model." }
references:
  - title: Custom evaluators (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/custom-evaluators
