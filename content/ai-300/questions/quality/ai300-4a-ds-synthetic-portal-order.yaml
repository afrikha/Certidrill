id: ai300-4a-ds-synthetic-portal-order
objective: "4.1.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Proseware has a Foundry agent named **claims-agent** in production. Server-side tracing sends its traces to the Application Insights resource connected to the project, and the project's managed identity has the required roles.

    You need to use the Foundry portal to build an evaluation dataset of at most 200 representative conversations of claims-agent from the last seven days. You must review the rows before you evaluate claims-agent on the dataset.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'un agent Foundry nommé **claims-agent** en production. Le traçage côté serveur envoie ses traces vers la ressource Application Insights connectée au projet, et l'identité managée du projet dispose des rôles requis.

    Vous devez utiliser le portail Foundry pour constituer un jeu de données d'évaluation d'au plus 200 conversations représentatives de claims-agent des sept derniers jours. Vous devez examiner les lignes avant d'évaluer claims-agent sur ce jeu de données.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: open, text: { en: "On the Data Generation tab, select Create dataset, and then select From traces.", fr: "Dans l'onglet Data Generation, sélectionner Create dataset, puis From traces." } }
    - { id: cfg, text: { en: "Select claims-agent as the Agent, set Create dataset for to Evaluation, and set the Date range to the last seven days.", fr: "Sélectionner claims-agent comme Agent, définir Create dataset for sur Evaluation et la plage de dates (Date range) sur les sept derniers jours." } }
    - { id: sample, text: { en: "Enable Sampling, set Maximum samples to 200, and then select Create.", fr: "Activer Sampling, définir Maximum samples sur 200, puis sélectionner Create." } }
    - { id: preview, text: { en: "When the job finishes, open the Data tab and preview the rows of the dataset.", fr: "Une fois le travail terminé, ouvrir l'onglet Data et afficher un aperçu des lignes du jeu de données." } }
    - { id: eval, text: { en: "Start an evaluation run of claims-agent on the new dataset.", fr: "Lancer une exécution d'évaluation de claims-agent sur le nouveau jeu de données." } }
    - { id: synth, text: { en: "Select Create dataset, select Generate synthetic, and set Task type to Simulation seed (multi-turn).", fr: "Sélectionner Create dataset, puis Generate synthetic, et définir Task type sur Simulation seed (multi-turn)." } }
    - { id: cont, text: { en: "Create a continuous evaluation rule for claims-agent with max_hourly_runs set to 200.", fr: "Créer une règle d'évaluation continue pour claims-agent avec max_hourly_runs défini sur 200." } }
answer:
  sequence: [ open, cfg, sample, preview, eval ]
explanation:
  correct:
    en: A dataset from traces starts from Create dataset > From traces on the Data Generation tab. In the dialog you select the agent, the Evaluation usage and the date range; enabling Sampling with Maximum samples (1 to 1,000) keeps a representative subset, and Create starts a background job. When it finishes, you preview the rows on the Data tab, and the finished job links to starting an evaluation run.
    fr: Un jeu de données à partir de traces commence par Create dataset > From traces dans l'onglet Data Generation. Dans la boîte de dialogue, vous sélectionnez l'agent, l'usage Evaluation et la plage de dates ; activer Sampling avec Maximum samples (1 à 1 000) conserve un sous-ensemble représentatif, et Create lance un travail en arrière-plan. Une fois le travail terminé, vous affichez un aperçu des lignes dans l'onglet Data, et le travail terminé permet de lancer une exécution d'évaluation.
  options:
    synth: { en: "Synthetic generation (preview) creates new scenarios from a definition or a file; it doesn't select conversations from the agent's traces.", fr: "La génération synthétique (préversion) crée de nouveaux scénarios à partir d'une définition ou d'un fichier ; elle ne sélectionne pas de conversations dans les traces de l'agent." }
    cont: { en: "Continuous evaluation scores live responses up to an hourly cap; it doesn't build a dataset that you can review first.", fr: "L'évaluation continue note les réponses réelles dans la limite d'un plafond horaire ; elle ne constitue pas de jeu de données que vous pouvez examiner d'abord." }
references:
  - title: Convert agent traces into evaluation datasets
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/traces-to-dataset
