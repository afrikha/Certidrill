id: ai300-4a-ds-synthetic-portal-order
objective: "4.1.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Proseware has a Foundry agent named **claims-agent** and a PDF document that describes its claims policy. You need to use the Foundry portal to generate seeds for simulated multi-turn conversations about the policy, so that you can evaluate claims-agent at the conversation level.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'un agent Foundry nommé **claims-agent** et d'un document PDF qui décrit sa politique de sinistres. Vous devez utiliser le portail Foundry pour générer des amorces de conversations multitours simulées portant sur cette politique, afin d'évaluer claims-agent au niveau de la conversation.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: open, text: { en: "On the Data Generation tab, select Create dataset, and then select Generate synthetic.", fr: "Dans l'onglet Data Generation, sélectionner Create dataset, puis Generate synthetic." } }
    - { id: type, text: { en: "Set Dataset usage to Evaluation and Task type to Simulation seed (multi-turn).", fr: "Définir Dataset usage sur Evaluation et Task type sur Simulation seed (multi-turn)." } }
    - { id: model, text: { en: "Select a generator model and add the PDF document as a Reference file.", fr: "Sélectionner un modèle générateur (Generator model) et ajouter le document PDF comme Reference file." } }
    - { id: gen, text: { en: "Set Maximum number of samples and Output file name, and then select Generate.", fr: "Définir Maximum number of samples et Output file name, puis sélectionner Generate." } }
    - { id: preview, text: { en: "When the job finishes, preview the generated rows on the Data tab.", fr: "Une fois le travail terminé, afficher un aperçu des lignes générées dans l'onglet Data." } }
    - { id: traces, text: { en: "Select Create dataset, select From traces, and then set the Date range.", fr: "Sélectionner Create dataset, puis From traces, puis définir la plage de dates (Date range)." } }
    - { id: qna, text: { en: "Set Task type to Simple QnA (single-turn).", fr: "Définir Task type sur Simple QnA (single-turn)." } }
answer:
  sequence: [ open, type, model, gen, preview ]
explanation:
  correct:
    en: Synthetic generation starts from Create dataset > Generate synthetic on the Data Generation tab. You set the usage and the task type, choose the generator model and the inputs (here a reference file), then set the sample count and output name and generate. The job runs in the background, and you review the rows on the Data tab before evaluating.
    fr: La génération synthétique démarre par Create dataset > Generate synthetic dans l'onglet Data Generation. Vous définissez l'usage et le type de tâche, choisissez le modèle générateur et les entrées (ici un fichier de référence), puis le nombre d'échantillons et le nom de sortie, et lancez la génération. Le travail s'exécute en arrière-plan, et vous examinez les lignes dans l'onglet Data avant d'évaluer.
  options:
    traces: { en: "From traces converts production traces; it does not generate questions from a policy document.", fr: "From traces convertit des traces de production ; il ne génère pas de questions à partir d'un document de politique." }
    qna: { en: "Simple QnA produces single-turn query and ground_truth rows, not seeds for multi-turn simulations.", fr: "Simple QnA produit des lignes query et ground_truth à un seul tour, pas des amorces de simulations multitours." }
references:
  - title: Generate a synthetic evaluation dataset (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/evaluation-dataset-synthetic
