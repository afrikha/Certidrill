id: ai300-4b-cost-analysis-meters
objective: "4.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. has a resource group named **rg-genai** that contains a Microsoft Foundry resource. The Foundry resource hosts Azure OpenAI deployments and a partner model deployment.

    You need to identify which billing meters generate the costs of the solution and which resource generates each meter. No cost must be missed.

    How should you configure Cost analysis? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose d'un groupe de ressources nommé **rg-genai** qui contient une ressource Microsoft Foundry. La ressource Foundry héberge des déploiements Azure OpenAI et un déploiement de modèle partenaire.

    Vous devez identifier les compteurs de facturation qui génèrent les coûts de la solution et la ressource qui génère chaque compteur. Aucun coût ne doit être oublié.

    Comment devez-vous configurer l'analyse des coûts ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Scope: [[scope]]

      Group by: [[group]]

      View: [[view]]
    fr: |
      Étendue : [[scope]]

      Group by : [[group]]

      View : [[view]]
  slots:
    - id: scope
      options:
        - { id: fdy, text: { en: "The Foundry resource", fr: "La ressource Foundry" } }
        - { id: rg, text: { en: "The resource group rg-genai", fr: "Le groupe de ressources rg-genai" } }
        - { id: mg, text: { en: "The root management group", fr: "Le groupe d'administration racine" } }
    - id: group
      options:
        - { id: loc, text: Location }
        - { id: meter, text: Meter }
        - { id: rtype, text: Resource type }
    - id: view
      options:
        - { id: acc, text: Accumulated costs }
        - { id: daily, text: Daily costs }
        - { id: byres, text: Cost by resource }
answer:
  values: { scope: rg, group: meter, view: byres }
explanation:
  correct:
    en: Scope the analysis to the resource group, because partner and community model meters can appear under the resource group rather than under the Foundry resource. Group by Meter shows the charges per billing meter, and the Cost by resource view shows which resource generates each meter.
    fr: Définissez l'étendue de l'analyse sur le groupe de ressources, car les compteurs des modèles partenaires et communautaires peuvent apparaître sous le groupe de ressources plutôt que sous la ressource Foundry. Group by Meter affiche les frais par compteur de facturation, et la vue Cost by resource indique la ressource qui génère chaque compteur.
  options:
    fdy: { en: "Scoping to the Foundry resource can miss partner model meters that are billed under the resource group.", fr: "Une étendue limitée à la ressource Foundry peut omettre des compteurs de modèles partenaires facturés sous le groupe de ressources." }
    mg: { en: "A management group scope includes the costs of many other subscriptions and resources.", fr: "Une étendue de groupe d'administration inclut les coûts de nombreux autres abonnements et ressources." }
    loc: { en: "Grouping by location does not show the billing meters.", fr: "Le regroupement par emplacement n'affiche pas les compteurs de facturation." }
    rtype: { en: "Grouping by resource type mixes all the meters of a resource type together.", fr: "Le regroupement par type de ressource mélange tous les compteurs d'un même type de ressource." }
    acc: { en: "Accumulated costs shows the running total over time, not the resource behind each meter.", fr: "Accumulated costs affiche le cumul dans le temps, pas la ressource associée à chaque compteur." }
    daily: { en: "Daily costs shows the costs per day, not the resource behind each meter.", fr: "Daily costs affiche les coûts par jour, pas la ressource associée à chaque compteur." }
references:
  - title: Cost and FinOps in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/manage-costs
