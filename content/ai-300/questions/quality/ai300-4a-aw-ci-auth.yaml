id: ai300-4a-aw-ci-auth
objective: "4.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Proseware plans a GitHub Actions workflow that runs the `microsoft/ai-agent-evals` action against agents in a Foundry project. The workflow signs in with `azure/login` by using an app registration named **app-evals**.

    You need to configure authentication and authorization for the workflow. The solution must not store any secret in GitHub and must follow the principle of least privilege.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit un workflow GitHub Actions qui exécute l'action `microsoft/ai-agent-evals` sur des agents d'un projet Foundry. Le workflow se connecte avec `azure/login` à l'aide d'une inscription d'application nommée **app-evals**.

    Vous devez configurer l'authentification et l'autorisation du workflow. La solution ne doit stocker aucun secret dans GitHub et doit respecter le principe du moindre privilège.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a client secret for app-evals and store it as a GitHub secret.", fr: "Créer un secret client pour app-evals et le stocker comme secret GitHub." } }
    - { id: b, text: { en: "Add a federated credential for the repository to app-evals.", fr: "Ajouter à app-evals des informations d'identification fédérées pour le dépôt." } }
    - { id: c, text: { en: "Assign the Contributor role to app-evals at the subscription scope.", fr: "Attribuer le rôle Contributor à app-evals dans l'étendue de l'abonnement." } }
    - { id: d, text: { en: "Assign the Foundry User role to app-evals for the Foundry project.", fr: "Attribuer le rôle Foundry User à app-evals pour le projet Foundry." } }
    - { id: e, text: { en: "Assign the Owner role to app-evals on the Foundry resource.", fr: "Attribuer le rôle Owner à app-evals sur la ressource Foundry." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: A federated credential lets `azure/login` exchange the GitHub OIDC token for a Microsoft Entra token, so no client secret is stored. The Foundry User role (formerly Azure AI User) grants the permissions needed to run evaluations in CI/CD.
    fr: "Des informations d'identification fédérées permettent à `azure/login` d'échanger le jeton OIDC GitHub contre un jeton Microsoft Entra : aucun secret client n'est stocké. Le rôle Foundry User (anciennement Azure AI User) accorde les autorisations nécessaires pour exécuter des évaluations en CI/CD."
  options:
    a: { en: "A client secret stored in GitHub violates the no-secret requirement.", fr: "Un secret client stocké dans GitHub enfreint l'exigence d'absence de secret." }
    c: { en: "Contributor at subscription scope grants far more than needed; Learn advises against it.", fr: "Contributor dans l'étendue de l'abonnement accorde bien plus que nécessaire ; Learn le déconseille." }
    e: { en: "Owner also grants resource management and role assignment rights, which violates least privilege.", fr: "Owner accorde aussi des droits de gestion des ressources et d'attribution de rôles, ce qui enfreint le moindre privilège." }
references:
  - title: How to run an evaluation in GitHub Action (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action
  - title: Set up permissions for Microsoft Foundry evaluation workflows
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/evaluation-permissions
