id: ai300-4b-tracing-env-yesno
objective: "4.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys adds client-side tracing to a Python application that uses the `azure-ai-projects` package to call Microsoft Foundry agents. The application calls `AIProjectInstrumentor().instrument()` with no arguments. No tracing environment variable is set unless a statement says otherwise.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys ajoute le traçage côté client à une application Python qui utilise le package `azure-ai-projects` pour appeler des agents Microsoft Foundry. L'application appelle `AIProjectInstrumentor().instrument()` sans argument. Aucune variable d'environnement de traçage n'est définie, sauf si une affirmation indique le contraire.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: GenAI instrumentation is enabled only if AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING is set to true before the call to instrument().
        fr: L'instrumentation GenAI n'est activée que si AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING est défini sur true avant l'appel à instrument().
    - id: s2
      text:
        en: The W3C baggage header is included in outgoing requests by default.
        fr: L'en-tête W3C baggage est inclus par défaut dans les requêtes sortantes.
    - id: s3
      text:
        en: When tracing is enabled, the spans record the content of user messages and tool call arguments by default.
        fr: Lorsque le traçage est activé, les étendues enregistrent par défaut le contenu des messages des utilisateurs et les arguments des appels d'outils.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING defaults to false and must be set to true before instrumenting; otherwise instrumentation is not enabled and a warning is logged. Baggage propagation is off by default because the header can carry sensitive key-value pairs. Content recording (OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT) is also false by default, and Microsoft advises enabling it only in development unless compliance allows it.
    fr: AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING vaut false par défaut et doit être défini sur true avant l'instrumentation ; sinon, l'instrumentation n'est pas activée et un avertissement est journalisé. La propagation de baggage est désactivée par défaut, car l'en-tête peut transporter des paires clé-valeur sensibles. L'enregistrement du contenu (OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT) vaut lui aussi false par défaut, et Microsoft conseille de ne l'activer qu'en développement, sauf si la conformité l'autorise.
references:
  - title: Add client-side tracing to Foundry agents (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-client-side
