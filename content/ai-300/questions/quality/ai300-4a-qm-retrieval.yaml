id: ai300-4a-qm-retrieval
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a RAG application that retrieves chunks from an Azure AI Search index before calling a model. Users complain about weak answers, and you suspect the retrieval step.

    You need to measure how relevant the retrieved chunks are to each query, independently of the generated answer. Your dataset contains the query and the retrieved chunks for each row. No human-labeled relevance judgments exist for the documents.

    Which evaluator should you use?
  fr: |
    Contoso dispose d'une application RAG qui récupère des blocs dans un index Azure AI Search avant d'appeler un modèle. Les utilisateurs se plaignent de réponses médiocres, et vous soupçonnez l'étape de récupération.

    Vous devez mesurer la pertinence des blocs récupérés par rapport à chaque requête, indépendamment de la réponse générée. Votre jeu de données contient la requête et les blocs récupérés pour chaque ligne. Il n'existe aucun jugement de pertinence étiqueté par des humains pour les documents.

    Quel évaluateur devez-vous utiliser ?
body:
  options:
    - id: a
      text: builtin.document_retrieval
    - id: b
      text: builtin.retrieval
    - id: c
      text: builtin.relevance
    - id: d
      text: builtin.groundedness
answer: { optionId: b }
explanation:
  correct:
    en: Retrieval is a process evaluation in which an LLM judge scores, from 1 to 5, how relevant the retrieved context chunks are to the query. It takes only `query` and `context`, so it needs neither the response nor labeled data.
    fr: "Retrieval est une évaluation de processus dans laquelle un juge LLM note, de 1 à 5, la pertinence des blocs de contexte récupérés par rapport à la requête. Il ne prend que `query` et `context` : il n'a besoin ni de la réponse ni de données étiquetées."
  options:
    a:
      en: Document Retrieval measures retrieval quality against human-labeled relevance judgments (retrieval_ground_truth), which do not exist here.
      fr: Document Retrieval mesure la qualité de la récupération par rapport à des jugements de pertinence étiquetés par des humains (retrieval_ground_truth), qui n'existent pas ici.
    c:
      en: Relevance scores the final response against the query; it does not look at the retrieved chunks.
      fr: Relevance note la réponse finale par rapport à la requête ; il n'examine pas les blocs récupérés.
    d:
      en: Groundedness checks whether the response is supported by the context; it does not judge whether the context matches the query.
      fr: Groundedness vérifie si la réponse est étayée par le contexte ; il ne juge pas si le contexte correspond à la requête.
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
