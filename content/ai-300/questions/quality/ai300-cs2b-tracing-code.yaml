id: ai300-cs2b-tracing-code
objective: "4.2.4"
type: dropdown
caseStudy: ai300-cs2b-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You install the azure-monitor-opentelemetry and opentelemetry-instrumentation-openai-v2 packages on app-docdesk.

    You need to complete the startup code of DocDesk to meet operations requirement 9.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous installez les packages azure-monitor-opentelemetry et opentelemetry-instrumentation-openai-v2 sur app-docdesk.

    Vous devez compléter le code de démarrage de DocDesk pour respecter l'exigence d'exploitation 9.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.ai.projects import AIProjectClient
    from azure.identity import DefaultAzureCredential
    from azure.monitor.opentelemetry import configure_azure_monitor
    from opentelemetry.instrumentation.openai_v2 import OpenAIInstrumentor

    project_client = AIProjectClient(
        credential=DefaultAzureCredential(),
        endpoint="https://fdy-wwi.services.ai.azure.com/api/projects/docdesk",
    )
    connection_string = [[conn]]
    [[setup]]
    [[instr]]

    client = project_client.get_openai_client()
  slots:
    - id: conn
      options:
        - { id: telemetry, text: "project_client.telemetry.get_application_insights_connection_string()" }
        - { id: openai, text: "project_client.get_openai_client()" }
        - { id: env, text: "os.environ[\"AZURE_OPENAI_ENDPOINT\"]" }
    - id: setup
      options:
        - { id: monitor, text: "configure_azure_monitor(connection_string=connection_string)" }
        - { id: logging, text: "logging.basicConfig(filename=connection_string)" }
        - { id: client, text: "AIProjectClient(credential=DefaultAzureCredential(), endpoint=connection_string)" }
    - id: instr
      options:
        - { id: instrument, text: "OpenAIInstrumentor().instrument()" }
        - { id: uninstrument, text: "OpenAIInstrumentor().uninstrument()" }
        - { id: ctor, text: "instrumentor = OpenAIInstrumentor()" }
answer:
  values: { conn: telemetry, setup: monitor, instr: instrument }
explanation:
  correct:
    en: "Because appi-wwi is connected to the docdesk project, `project_client.telemetry.get_application_insights_connection_string()` returns its connection string. `configure_azure_monitor()` sets up the Azure Monitor OpenTelemetry exporter with that connection string, and `OpenAIInstrumentor().instrument()` makes the OpenAI client emit a span for each call, with token usage and duration, which you then view on the Tracing page or in Application Insights."
    fr: "Comme appi-wwi est connectée au projet docdesk, `project_client.telemetry.get_application_insights_connection_string()` renvoie sa chaîne de connexion. `configure_azure_monitor()` configure l'exportateur OpenTelemetry Azure Monitor avec cette chaîne de connexion, et `OpenAIInstrumentor().instrument()` fait émettre au client OpenAI une étendue (span) par appel, avec la consommation de jetons et la durée, que vous consultez ensuite dans la page Tracing ou dans Application Insights."
  options:
    openai: { en: "get_openai_client() returns an OpenAI client for inference, not a connection string.", fr: "get_openai_client() renvoie un client OpenAI pour l'inférence, pas une chaîne de connexion." }
    env: { en: "An endpoint URL is not an Application Insights connection string.", fr: "Une URL de point de terminaison n'est pas une chaîne de connexion Application Insights." }
    logging: { en: "logging.basicConfig() writes local logs; it does not export traces to Application Insights.", fr: "logging.basicConfig() écrit des journaux locaux ; il n'exporte pas de traces vers Application Insights." }
    client: { en: "Creating another project client does not configure any telemetry exporter.", fr: "Créer un autre client de projet ne configure aucun exportateur de télémétrie." }
    uninstrument: { en: "uninstrument() removes the instrumentation instead of enabling it.", fr: "uninstrument() supprime l'instrumentation au lieu de l'activer." }
    ctor: { en: "Creating the instrumentor without calling instrument() does not instrument the OpenAI client.", fr: "Créer l'instrumenteur sans appeler instrument() n'instrumente pas le client OpenAI." }
references:
  - title: View trace results for AI applications using OpenAI SDK (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/develop/trace-application
