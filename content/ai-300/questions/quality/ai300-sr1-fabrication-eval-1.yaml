id: ai300-sr1-fabrication-eval-1
objective: "4.1.2"
type: series_yesno
series: ai300-sr1-fabrication-eval
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You configure the Relevance evaluator.
  fr: Vous configurez l'évaluateur Relevance.
body:
  solution:
    en: |
      You add the following testing criterion to the evaluation:

      ```python
      testing_criteria = [
          {
              "type": "azure_ai_evaluator",
              "name": "relevance",
              "evaluator_name": "builtin.relevance",
              "initialization_parameters": {"deployment_name": model_deployment},
              "data_mapping": {
                  "query": "{{item.query}}",
                  "response": "{{item.response}}",
              },
          },
      ]
      ```
    fr: |
      Vous ajoutez le critère de test suivant à l'évaluation :

      ```python
      testing_criteria = [
          {
              "type": "azure_ai_evaluator",
              "name": "relevance",
              "evaluator_name": "builtin.relevance",
              "initialization_parameters": {"deployment_name": model_deployment},
              "data_mapping": {
                  "query": "{{item.query}}",
                  "response": "{{item.response}}",
              },
          },
      ]
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      Relevance judges how accurately and directly the response addresses the query. Its data mapping doesn't even include the retrieved chunks, so it can't detect facts that are missing from the context: a fabricated answer can be perfectly on-topic and score high. The goal isn't met.
    fr: |
      Relevance évalue dans quelle mesure la réponse traite la question de manière exacte et directe. Son mappage de données n'inclut même pas les blocs récupérés : il ne peut donc pas détecter des faits absents du contexte, et une réponse inventée mais parfaitement dans le sujet peut obtenir un score élevé. L'objectif n'est pas atteint.
references:
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI - Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
