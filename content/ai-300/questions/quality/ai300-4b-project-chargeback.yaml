id: ai300-4b-project-chargeback
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a resource group named **rg-ai** that contains a Microsoft Foundry resource and a Log Analytics workspace. The Foundry resource hosts Azure OpenAI deployments and deployments of other Models sold by Azure, such as Llama models.

    The finance team opens Cost analysis with rg-ai as the scope. The team needs to see only the cost of the Azure OpenAI usage.

    Which filter should the team add?
  fr: |
    Contoso dispose d'un groupe de ressources nommé **rg-ai** qui contient une ressource Microsoft Foundry et un espace de travail Log Analytics. La ressource Foundry héberge des déploiements Azure OpenAI et des déploiements d'autres Models sold by Azure, comme des modèles Llama.

    L'équipe financière ouvre l'analyse des coûts (Cost analysis) avec rg-ai comme étendue. L'équipe doit voir uniquement le coût de la consommation Azure OpenAI.

    Quel filtre l'équipe doit-elle ajouter ?
body:
  options:
    - { id: a, text: { en: "Service name, with the value Azure OpenAI", fr: "Service name, avec la valeur Azure OpenAI" } }
    - { id: b, text: { en: "Service tier, with the value Azure OpenAI", fr: "Service tier, avec la valeur Azure OpenAI" } }
    - { id: c, text: { en: "Service name, with the value Azure Monitor", fr: "Service name, avec la valeur Azure Monitor" } }
    - { id: d, text: { en: "Tag, with the project tag that Foundry applies", fr: "Tag, avec l'étiquette project appliquée par Foundry" } }
answer: { optionId: b }
explanation:
  correct:
    en: Azure OpenAI usage is classified under the broader Cognitive Services service, so Azure OpenAI isn't listed when you filter by service. To isolate it in Cost analysis, add a Service tier filter and select Azure OpenAI.
    fr: La consommation Azure OpenAI est classée sous le service plus large Cognitive Services ; Azure OpenAI n'apparaît donc pas quand vous filtrez par service. Pour l'isoler dans l'analyse des coûts, ajoutez un filtre Service tier et sélectionnez Azure OpenAI.
  options:
    a: { en: "Azure OpenAI isn't a value of the service filter; its usage appears under Cognitive Services.", fr: "Azure OpenAI n'est pas une valeur du filtre de service ; sa consommation apparaît sous Cognitive Services." }
    c: { en: "Azure Monitor shows the Log Analytics ingestion and retention costs, not model usage.", fr: "Azure Monitor affiche les coûts d'ingestion et de rétention de Log Analytics, pas la consommation des modèles." }
    d: { en: "The project tag (preview) allocates usage per Foundry project for all supported Models sold by Azure, so it would also include the Llama deployments.", fr: "L'étiquette project (préversion) répartit la consommation par projet Foundry pour tous les Models sold by Azure pris en charge : elle inclurait donc aussi les déploiements Llama." }
references:
  - title: Analyze Microsoft Foundry costs in Azure Cost Management
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/analyze-costs-cost-management
