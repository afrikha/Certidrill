id: ai300-4b-project-chargeback
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has one Microsoft Foundry resource that contains three projects named **sales**, **hr** and **legal**. Each project calls its own Azure OpenAI deployments.

    The finance team needs the monthly cost of each project for internal chargeback. The solution must minimize administrative effort and must not require new Azure resources.

    What should you do?
  fr: |
    Contoso dispose d'une ressource Microsoft Foundry qui contient trois projets nommés **sales**, **hr** et **legal**. Chaque projet appelle ses propres déploiements Azure OpenAI.

    L'équipe financière a besoin du coût mensuel de chaque projet pour la refacturation interne. La solution doit réduire au minimum l'effort d'administration et ne doit pas nécessiter de nouvelles ressources Azure.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In Cost analysis, filter the costs by the project tag.", fr: "Dans l'analyse des coûts, filtrer les coûts selon l'étiquette project." } }
    - { id: b, text: { en: "In Cost analysis, filter the costs by the Azure OpenAI service name.", fr: "Dans l'analyse des coûts, filtrer les coûts selon le nom de service Azure OpenAI." } }
    - { id: c, text: { en: "Move each project to its own Foundry resource in a separate subscription.", fr: "Déplacer chaque projet dans sa propre ressource Foundry dans un abonnement distinct." } }
    - { id: d, text: { en: "In Cost analysis, group the costs by Meter.", fr: "Dans l'analyse des coûts, regrouper les coûts par Meter." } }
answer: { optionId: a }
explanation:
  correct:
    en: For supported models, including Azure OpenAI and the other Models sold by Azure, Foundry automatically applies a project tag to the usage, which lets you filter Cost analysis per project for chargeback (preview). Marketplace models and Claude are not covered by this attribution.
    fr: Pour les modèles pris en charge, dont Azure OpenAI et les autres Models sold by Azure, Foundry applique automatiquement une étiquette project à l'utilisation, ce qui permet de filtrer l'analyse des coûts par projet pour la refacturation (préversion). Les modèles de la Place de marché et Claude ne sont pas couverts par cette attribution.
  options:
    b: { en: "Azure OpenAI usage is classified under Cognitive Services, and a service filter would not separate the projects anyway.", fr: "L'utilisation d'Azure OpenAI est classée sous Cognitive Services, et un filtre de service ne séparerait de toute façon pas les projets." }
    c: { en: "Separate resources and subscriptions would work but add resources and administrative effort.", fr: "Des ressources et des abonnements distincts fonctionneraient, mais ajoutent des ressources et de l'effort d'administration." }
    d: { en: "Meters identify what is billed (for example input or output tokens of a model), not which project consumed it.", fr: "Les compteurs identifient ce qui est facturé (par exemple les jetons d'entrée ou de sortie d'un modèle), pas le projet qui l'a consommé." }
references:
  - title: Plan and manage costs for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/manage-costs
