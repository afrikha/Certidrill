id: ai300-4a-qm-scales-yn
objective: "4.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware evaluates the English responses of a support assistant in a Foundry project by using built-in quality evaluators. The AI-assisted evaluators use a gpt-5-mini deployment as the judge model, with their default thresholds.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware évalue les réponses en anglais d'un assistant de support dans un projet Foundry à l'aide d'évaluateurs de qualité intégrés. Les évaluateurs assistés par IA utilisent un déploiement gpt-5-mini comme modèle juge, avec leurs seuils par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Coherence returns a score from 1 to 5, and a response that scores 3 passes.
        fr: Coherence renvoie un score de 1 à 5, et une réponse qui obtient 3 est acceptée (pass).
    - id: s2
      text:
        en: Fluency requires the query and the retrieved context in the data mapping.
        fr: Fluency nécessite la requête et le contexte récupéré dans le mappage de données.
    - id: s3
      text:
        en: Groundedness Pro returns a True or False result instead of a score from 1 to 5.
        fr: Groundedness Pro renvoie un résultat True ou False au lieu d'un score de 1 à 5.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Coherence and Fluency use a 1–5 Likert scale with a default pass threshold of 3; scores at or above the threshold pass. Fluency needs only the `response` (or `messages`), because it judges the writing regardless of the content. Groundedness Pro (preview) uses the Azure AI Content Safety service instead of your judge deployment and returns a boolean.
    fr: Coherence et Fluency utilisent une échelle de Likert de 1 à 5 avec un seuil de réussite par défaut de 3 ; les scores supérieurs ou égaux au seuil sont acceptés. Fluency n'a besoin que de `response` (ou `messages`), car il juge l'écriture indépendamment du contenu. Groundedness Pro (préversion) utilise le service Azure AI Content Safety au lieu de votre déploiement juge et renvoie un booléen.
references:
  - title: General purpose evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/general-purpose-evaluators
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
