id: ai300-4b-scheduled-vs-continuous
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Foundry project that contains an agent named **support-agent**. An Application Insights resource is connected to the project.

    The quality team maintains a curated test dataset of 200 queries. Every Monday, the same dataset must be scored with quality and safety evaluators so that the team can detect drift of the system over time. The results must not depend on the volume of production traffic.

    What should you configure?
  fr: |
    Fabrikam dispose d'un projet Microsoft Foundry qui contient un agent nommé **support-agent**. Une ressource Application Insights est connectée au projet.

    L'équipe qualité gère un jeu de données de test de 200 requêtes. Chaque lundi, ce même jeu de données doit être noté avec des évaluateurs de qualité et de sécurité afin que l'équipe puisse détecter une dérive du système dans le temps. Les résultats ne doivent pas dépendre du volume du trafic de production.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A continuous evaluation rule for support-agent", fr: "Une règle d'évaluation continue pour support-agent" } }
    - { id: b, text: { en: "A recurring evaluation that runs on a weekly schedule", fr: "Une évaluation récurrente exécutée selon une planification hebdomadaire" } }
    - { id: c, text: { en: "A scheduled red team scan for support-agent", fr: "Une analyse de red teaming planifiée pour support-agent" } }
    - { id: d, text: { en: "An Azure Monitor metric alert on the latency of support-agent", fr: "Une alerte de métrique Azure Monitor sur la latence de support-agent" } }
answer: { optionId: b }
explanation:
  correct:
    en: A scheduled (recurring) evaluation runs quality and safety evaluators against a test dataset on a fixed schedule, which is how Foundry recommends detecting system drift after deployment. Because it scores the same dataset each time, the results are comparable from week to week and do not depend on live traffic.
    fr: Une évaluation planifiée (récurrente) exécute des évaluateurs de qualité et de sécurité sur un jeu de données de test selon une planification fixe ; c'est la méthode que Foundry recommande pour détecter une dérive du système après le déploiement. Comme elle note chaque fois le même jeu de données, les résultats sont comparables d'une semaine à l'autre et ne dépendent pas du trafic réel.
  options:
    a:
      en: Continuous evaluation scores a sample of live agent responses as they complete, so its input depends on production traffic, not on a curated dataset.
      fr: |
        L'évaluation continue note un échantillon des réponses réelles de l'agent au fil de l'eau : ses entrées dépendent du trafic de production, pas d'un jeu de données choisi.
    c:
      en: A red team scan runs adversarial tests to find safety and security vulnerabilities; it does not score quality on the team's dataset.
      fr: Une analyse de red teaming exécute des tests adverses pour trouver des vulnérabilités de sécurité ; elle ne note pas la qualité sur le jeu de données de l'équipe.
    d:
      en: A metric alert reacts to an operational metric such as latency; it does not run evaluators on a dataset.
      fr: Une alerte de métrique réagit à une métrique opérationnelle comme la latence ; elle n'exécute aucun évaluateur sur un jeu de données.
references:
  - title: Observability in generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/observability
  - title: Monitor agents with the Agent Monitoring Dashboard
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard
