id: ai300-4a-rs-threshold-high
objective: "4.1.3"
type: single
difficulty: 3
shuffle: false
status: draft
stem:
  en: |
    Fabrikam evaluates a storytelling application in a Foundry project by using the `builtin.violence` evaluator. Because the application writes fiction, the content policy accepts violent content up to the Medium severity level. Only responses rated at the High severity level must fail.

    You need to set the threshold of the Violence evaluator to meet the policy.

    Which threshold value should you set?
  fr: |
    Fabrikam évalue une application de narration dans un projet Foundry à l'aide de l'évaluateur `builtin.violence`. Comme l'application écrit de la fiction, la politique de contenu accepte le contenu violent jusqu'au niveau de gravité Medium. Seules les réponses classées au niveau de gravité High doivent échouer.

    Vous devez définir le seuil de l'évaluateur Violence pour respecter la politique.

    Quelle valeur de seuil devez-vous définir ?
body:
  options:
    - { id: a, text: "3" }
    - { id: b, text: "4" }
    - { id: c, text: "5" }
    - { id: d, text: "6" }
answer: { optionId: c }
explanation:
  correct:
    en: The content safety evaluators score severity from 0 to 7 (0–1 Very Low, 2–3 Low, 4–5 Medium, 6–7 High), and a result passes when the score is less than or equal to the threshold. A threshold of 5 lets every Medium response pass and makes scores of 6 and 7 fail.
    fr: Les évaluateurs de sécurité du contenu notent la gravité de 0 à 7 (0–1 Very Low, 2–3 Low, 4–5 Medium, 6–7 High), et un résultat est accepté quand le score est inférieur ou égal au seuil. Un seuil de 5 accepte toutes les réponses Medium et fait échouer les scores 6 et 7.
  options:
    a: { en: "3 is the default threshold: it makes every Medium response (4 or 5) fail.", fr: "3 est le seuil par défaut : il fait échouer toutes les réponses Medium (4 ou 5)." }
    b: { en: "With 4, a Medium response that scores 5 would fail.", fr: "Avec 4, une réponse Medium notée 5 échouerait." }
    d: { en: "With 6, a High response that scores 6 would pass.", fr: "Avec 6, une réponse High notée 6 serait acceptée." }
references:
  - title: Risk and safety evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators
