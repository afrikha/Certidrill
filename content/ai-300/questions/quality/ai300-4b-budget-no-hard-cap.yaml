id: ai300-4b-budget-no-hard-cap
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs a pilot in a dedicated Azure subscription that contains a Microsoft Foundry resource with Azure OpenAI deployments.

    When the actual monthly cost of the subscription reaches USD 2,000, the deployments must stop serving requests automatically, without waiting for an administrator.

    What should you do?
  fr: |
    Fabrikam mène un projet pilote dans un abonnement Azure dédié qui contient une ressource Microsoft Foundry avec des déploiements Azure OpenAI.

    Lorsque le coût mensuel réel de l'abonnement atteint 2 000 USD, les déploiements doivent cesser automatiquement de servir des requêtes, sans attendre d'administrateur.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a budget whose alert triggers an action group that runs automation to remove the deployments.", fr: "Créer un budget dont l'alerte déclenche un groupe d'actions qui exécute une automatisation pour supprimer les déploiements." } }
    - { id: b, text: { en: "Create a budget of USD 2,000 for the subscription; Azure OpenAI rejects new requests once it is reached.", fr: "Créer un budget de 2 000 USD pour l'abonnement ; Azure OpenAI rejette les nouvelles requêtes une fois ce montant atteint." } }
    - { id: c, text: { en: "Set a spending limit of USD 2,000 in the properties of the Foundry resource.", fr: "Définir une limite de dépenses de 2 000 USD dans les propriétés de la ressource Foundry." } }
    - { id: d, text: { en: "Create a daily cost export to a storage account and review the exported data every morning.", fr: "Créer une exportation quotidienne des coûts vers un compte de stockage et consulter les données chaque matin." } }
answer: { optionId: a }
explanation:
  correct:
    en: A Cost Management budget alerts on billed cost but can't block requests. Foundry cost controls (preview) can block requests, but they keep their own running total, which isn't reconciled with the bill during the preview, so they don't act on the actual cost. A budget alert can trigger an action group, and the action group can run your own automation (for example a runbook or a function) that removes or scales down the deployments. This requires custom development.
    fr: Un budget Cost Management alerte sur le coût facturé mais ne peut pas bloquer les requêtes. Les contrôles des coûts de Foundry (cost controls, préversion) peuvent bloquer les requêtes, mais ils tiennent leur propre total cumulé, qui n'est pas rapproché de la facture pendant la préversion ; ils n'agissent donc pas sur le coût réel. Une alerte budgétaire peut déclencher un groupe d'actions, et ce groupe d'actions peut exécuter votre propre automatisation (par exemple un runbook ou une fonction) qui supprime ou réduit les déploiements. Cela nécessite un développement personnalisé.
  options:
    b: { en: "A budget does not stop usage; it only evaluates costs and sends alerts.", fr: "Un budget n'arrête pas l'utilisation ; il évalue seulement les coûts et envoie des alertes." }
    c: { en: "A Foundry resource has no spending limit property; the cost controls of the Foundry portal are in preview and don't track the billed cost.", fr: "Une ressource Foundry n'a pas de propriété de limite de dépenses ; les contrôles des coûts du portail Foundry sont en préversion et ne suivent pas le coût facturé." }
    d: { en: "A daily manual review needs an administrator and does not stop the deployments automatically.", fr: "Une revue manuelle quotidienne nécessite un administrateur et n'arrête pas automatiquement les déploiements." }
references:
  - title: Cost and FinOps in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/manage-costs
