id: ai300-4a-ds-responses-file-content
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a Foundry agent named **loan-agent**. You need to evaluate 40 responses that loan-agent already produced, identified by their response IDs, without generating new responses.

    You upload a JSONL file that lists the response IDs by using `project_client.datasets.upload_file`. You then call `openai_client.evals.runs.create` with a data source of type `azure_ai_responses` whose source is `{"type": "file_id", "id": data_id}`. The service rejects the run creation with HTTP 400.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un agent Foundry nommé **loan-agent**. Vous devez évaluer 40 réponses déjà produites par loan-agent, identifiées par leurs ID de réponse, sans générer de nouvelles réponses.

    Vous chargez un fichier JSONL qui répertorie les ID de réponse à l'aide de `project_client.datasets.upload_file`. Vous appelez ensuite `openai_client.evals.runs.create` avec une source de données de type `azure_ai_responses` dont la source est `{"type": "file_id", "id": data_id}`. Le service rejette la création de l'exécution avec une erreur HTTP 400.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Provide the response IDs inline in a source of type file_content.", fr: "Fournir les ID de réponse en ligne dans une source de type file_content." }
    - id: b
      text: { en: "Convert the file to CSV and set the data source type to csv.", fr: "Convertir le fichier en CSV et définir le type de source de données sur csv." }
    - id: c
      text: { en: "Increase the tokens-per-minute (TPM) quota of the judge model deployment.", fr: "Augmenter le quota de jetons par minute (TPM) du déploiement du modèle juge." }
    - id: d
      text: { en: "Change the data source type to azure_ai_target_completions with loan-agent as the target.", fr: "Remplacer le type de source de données par azure_ai_target_completions avec loan-agent comme cible." }
answer: { optionId: a }
explanation:
  correct:
    en: Agent response evaluations (`azure_ai_responses`) support only inline data through a `file_content` source; an HTTP 400 with `file_id` is the documented symptom. Listing the response IDs inline lets the service retrieve the stored responses and score them.
    fr: Les évaluations de réponses d'agent (`azure_ai_responses`) ne prennent en charge que des données en ligne via une source `file_content` ; une erreur HTTP 400 avec `file_id` est le symptôme documenté. Indiquer les ID de réponse en ligne permet au service de récupérer les réponses stockées et de les noter.
  options:
    b:
      en: A csv data source scores stored query and response columns; it does not retrieve agent responses by ID.
      fr: Une source de données csv note des colonnes query et response stockées ; elle ne récupère pas les réponses d'agent par ID.
    c:
      en: Quota issues cause HTTP 429 or slow runs during execution, not an HTTP 400 at run creation.
      fr: Les problèmes de quota provoquent des erreurs HTTP 429 ou des exécutions lentes, pas une erreur HTTP 400 à la création de l'exécution.
    d:
      en: A target run sends queries to loan-agent and generates new responses, which the requirement excludes.
      fr: Une exécution avec cible envoie les requêtes à loan-agent et génère de nouvelles réponses, ce que l'exigence exclut.
references:
  - title: Evaluate datasets in the cloud
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/cloud-evaluation-datasets
  - title: Get evaluation results with Microsoft Foundry SDK
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/cloud-evaluation-results
