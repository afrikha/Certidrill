id: ai300-4b-span-processor-session
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has a Python application that calls Microsoft Foundry agents. Client-side tracing exports the spans to Application Insights by using `configure_azure_monitor`.

    To troubleshoot reported issues, the support team must be able to filter the traces in Application Insights by the session ID of the user. Every span created by the application must therefore carry a `session.id` attribute.

    What should you do?
  fr: |
    Tailspin Toys dispose d'une application Python qui appelle des agents Microsoft Foundry. Le traçage côté client exporte les étendues vers Application Insights à l'aide de `configure_azure_monitor`.

    Pour résoudre les problèmes signalés, l'équipe de support doit pouvoir filtrer les traces dans Application Insights selon l'ID de session de l'utilisateur. Chaque étendue créée par l'application doit donc porter un attribut `session.id`.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set AZURE_TRACING_GEN_AI_TRACE_CONTEXT_PROPAGATION_INCLUDE_BAGGAGE to true.", fr: "Définir AZURE_TRACING_GEN_AI_TRACE_CONTEXT_PROPAGATION_INCLUDE_BAGGAGE sur true." } }
    - { id: b, text: { en: "Set OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT to true.", fr: "Définir OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT sur true." } }
    - { id: c, text: { en: "Decorate each function with @trace_function(\"session.id\").", fr: "Décorer chaque fonction avec @trace_function(\"session.id\")." } }
    - { id: d, text: { en: "Add a custom SpanProcessor whose on_start method calls span.set_attribute(\"session.id\", ...) to the tracer provider.", fr: "Ajouter au fournisseur de traceurs un SpanProcessor personnalisé dont la méthode on_start appelle span.set_attribute(\"session.id\", ...)." } }
answer: { optionId: d }
explanation:
  correct:
    en: A custom span processor runs for every span. Setting the attribute in on_start and adding the processor to the TracerProvider tags every span with session.id, which you can then filter on in Application Insights.
    fr: Un processeur d'étendues personnalisé s'exécute pour chaque étendue. Définir l'attribut dans on_start et ajouter le processeur au TracerProvider marque chaque étendue avec session.id, sur lequel vous pouvez ensuite filtrer dans Application Insights.
  options:
    a: { en: "This setting adds the W3C baggage header to outgoing requests; it does not add an attribute to the spans.", fr: "Ce paramètre ajoute l'en-tête W3C baggage aux requêtes sortantes ; il n'ajoute pas d'attribut aux étendues." }
    b: { en: "Content recording captures message content and tool arguments, not a session identifier on every span.", fr: "L'enregistrement du contenu capture le contenu des messages et les arguments des outils, pas un identifiant de session sur chaque étendue." }
    c: { en: "The argument of @trace_function sets the span name of that function; it does not add a session attribute to the other spans.", fr: "L'argument de @trace_function définit le nom de l'étendue de cette fonction ; il n'ajoute pas d'attribut de session aux autres étendues." }
references:
  - title: Add client-side tracing to Foundry agents (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-client-side
