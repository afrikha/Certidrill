id: ai300-4a-qm-results-grid
objective: "4.1.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Adatum evaluates the responses of a RAG assistant with four built-in evaluators. Each evaluator returns a score from 1 to 5 with a pass threshold of 3. The following table shows the scores for five rows of the test dataset.

    Answer each prompt by selecting the row that matches it.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum évalue les réponses d'un assistant RAG avec quatre évaluateurs intégrés. Chaque évaluateur renvoie un score de 1 à 5 avec un seuil de réussite de 3. Le tableau suivant présente les scores de cinq lignes du jeu de données de test.

    Répondez à chaque consigne en sélectionnant la ligne qui y correspond.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The response contains claims that the retrieved context does not support.", fr: "La réponse contient des affirmations que le contexte récupéré n'étaye pas." }
    - id: p2
      text: { en: "The response is grammatically correct and readable, but its ideas are poorly organized.", fr: "La réponse est grammaticalement correcte et lisible, mais ses idées sont mal organisées." }
  grid:
    header: [{ en: "Row", fr: "Ligne" }, Groundedness, Relevance, Coherence, Fluency]
    rows:
      - [{ text: Q-101, area: r101 }, { text: "5" }, { text: "5" }, { text: "5" }, { text: "5" }]
      - [{ text: Q-102, area: r102 }, { text: "2" }, { text: "5" }, { text: "4" }, { text: "5" }]
      - [{ text: Q-103, area: r103 }, { text: "5" }, { text: "2" }, { text: "4" }, { text: "5" }]
      - [{ text: Q-104, area: r104 }, { text: "4" }, { text: "4" }, { text: "2" }, { text: "5" }]
      - [{ text: Q-105, area: r105 }, { text: "5" }, { text: "4" }, { text: "4" }, { text: "2" }]
answer:
  values: { p1: r102, p2: r104 }
explanation:
  correct:
    en: Q-102 fails only Groundedness, which detects content that is not supported by the context. Q-104 fails Coherence, which measures the logical organization of ideas, while its Fluency score of 5 shows that grammar and readability are fine. Q-103 is grounded but off topic (Relevance), and Q-105 has poor writing quality (Fluency).
    fr: Q-102 échoue uniquement à Groundedness, qui détecte le contenu non étayé par le contexte. Q-104 échoue à Coherence, qui mesure l'organisation logique des idées, tandis que son score Fluency de 5 montre que la grammaire et la lisibilité sont correctes. Q-103 est ancrée mais hors sujet (Relevance), et Q-105 présente une mauvaise qualité d'écriture (Fluency).
references:
  - title: General purpose evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/general-purpose-evaluators
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
