id: ai300-4b-continuous-eval-identity
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Microsoft Foundry project that contains an agent named **hr-agent**. An Application Insights resource is connected to the project.

    You create a continuous evaluation rule for hr-agent by using the Python SDK. The rule is enabled, and hr-agent has received a steady flow of requests for several hours without reaching the hourly run limit of the rule. On the **Monitor** tab of hr-agent, the token usage and latency charts show data, but no evaluation results appear.

    What should you do?
  fr: |
    Contoso dispose d'un projet Microsoft Foundry qui contient un agent nommé **hr-agent**. Une ressource Application Insights est connectée au projet.

    Vous créez une règle d'évaluation continue pour hr-agent à l'aide du SDK Python. La règle est activée, et hr-agent reçoit un flux régulier de requêtes depuis plusieurs heures sans atteindre la limite d'exécutions horaires de la règle. Sous l'onglet **Monitor** de hr-agent, les graphiques d'utilisation des jetons et de latence affichent des données, mais aucun résultat d'évaluation n'apparaît.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Foundry User role to the managed identity of the project.", fr: "Attribuer le rôle Foundry User à l'identité managée du projet." } }
    - { id: b, text: { en: "Assign the Log Analytics Reader role to your own user account.", fr: "Attribuer le rôle Log Analytics Reader à votre propre compte d'utilisateur." } }
    - { id: c, text: { en: "Increase the max_hourly_runs value of the rule to 1000.", fr: "Augmenter la valeur max_hourly_runs de la règle à 1000." } }
    - { id: d, text: { en: "Set OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT to true in the agent code.", fr: "Définir OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT sur true dans le code de l'agent." } }
answer: { optionId: a }
explanation:
  correct:
    en: Continuous evaluation runs under the managed identity of the project, which needs the Foundry User role (previously named Azure AI User). When results are missing although the rule is enabled and traffic flows, the troubleshooting guidance is to check that this role is assigned to the project's managed identity.
    fr: L'évaluation continue s'exécute sous l'identité managée du projet, qui a besoin du rôle Foundry User (anciennement Azure AI User). Lorsque les résultats manquent alors que la règle est activée et que le trafic circule, la procédure de dépannage consiste à vérifier que ce rôle est attribué à l'identité managée du projet.
  options:
    b:
      en: The charts already display telemetry, so your account can read the connected data; a reader role for you does not let the rule run evaluations.
      fr: Les graphiques affichent déjà la télémétrie, votre compte peut donc lire les données connectées ; un rôle de lecteur pour vous ne permet pas à la règle d'exécuter des évaluations.
    c:
      en: Raising the hourly limit helps only when runs are skipped because the limit is reached, which the scenario excludes.
      fr: Augmenter la limite horaire n'aide que si des exécutions sont ignorées parce que la limite est atteinte, ce que le scénario exclut.
    d:
      en: This variable controls whether client-side traces record message content; it does not enable or fix evaluation runs.
      fr: Cette variable détermine si les traces côté client enregistrent le contenu des messages ; elle n'active ni ne répare les exécutions d'évaluation.
references:
  - title: Monitor agents with the Agent Monitoring Dashboard
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard
