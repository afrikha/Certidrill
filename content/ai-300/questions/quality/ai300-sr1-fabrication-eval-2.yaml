stem:
  en: You configure the Groundedness evaluator.
  fr: Vous configurez l'évaluateur Groundedness.
body:
  solution:
    en: |
      You add the following testing criterion to the evaluation:

      ```python
      testing_criteria = [
          {
              "type": "azure_ai_evaluator",
              "name": "groundedness",
              "evaluator_name": "builtin.groundedness",
              "initialization_parameters": {"deployment_name": model_deployment},
              "data_mapping": {
                  "query": "{{item.query}}",
                  "context": "{{item.context}}",
                  "response": "{{item.response}}",
              },
          },
      ]
      ```
    fr: |
      Vous ajoutez le critère de test suivant à l'évaluation :

      ```python
      testing_criteria = [
          {
              "type": "azure_ai_evaluator",
              "name": "groundedness",
              "evaluator_name": "builtin.groundedness",
              "initialization_parameters": {"deployment_name": model_deployment},
              "data_mapping": {
                  "query": "{{item.query}}",
                  "context": "{{item.context}}",
                  "response": "{{item.response}}",
              },
          },
      ]
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      Groundedness measures how well the response aligns with the provided context without fabricating content, which is exactly the reported problem. It needs no ground truth, and mapping the optional `query` field in addition to `context` and `response` improves scoring accuracy. Each response gets a score from 1 to 5. The goal is met.
    fr: |
      Groundedness mesure dans quelle mesure la réponse s'aligne sur le contexte fourni sans inventer de contenu, ce qui correspond exactement au problème signalé. Il ne nécessite aucune vérité terrain, et mapper le champ facultatif `query` en plus de `context` et `response` améliore la précision du score. Chaque réponse reçoit un score de 1 à 5. L'objectif est atteint.
references:
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI - Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
