stem:
  en: You configure the Relevance evaluator.
  fr: Vous configurez l'évaluateur Relevance.
body:
  solution:
    en: |
      You configure the built-in **Relevance** evaluator with a judge model deployment, and you map its `query` input to the `query` column and its `response` input to the `response` column.
    fr: |
      Vous configurez l'évaluateur intégré **Relevance** avec un déploiement de modèle juge, et vous mappez son entrée `query` à la colonne `query` et son entrée `response` à la colonne `response`.
answer: { value: false }
explanation:
  correct:
    en: Relevance measures how accurately and directly the response addresses the query. It never reads the retrieved chunks, so an answer that invents a rule can still score high as long as it addresses the question.
    fr: "Relevance mesure dans quelle mesure la réponse traite la question de façon exacte et directe. Il ne lit jamais les blocs récupérés : une réponse qui invente une règle peut obtenir une note élevée du moment qu'elle répond à la question."
references:
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI - Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
