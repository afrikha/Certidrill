id: ai300-4a-aw-code-evaluator
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam's order assistant must return JSON that follows a specific schema. You need a reusable evaluator in the Foundry project that parses each response, checks it against the schema, and returns a partial score from 0.0 to 1.0.

    The scoring must be deterministic, must not call a model, and must not require you to host any additional service.

    What should you create?
  fr: |
    L'assistant de commandes de Fabrikam doit renvoyer du JSON conforme à un schéma précis. Vous avez besoin d'un évaluateur réutilisable dans le projet Foundry qui analyse chaque réponse, la vérifie par rapport au schéma et renvoie un score partiel de 0,0 à 1,0.

    La notation doit être déterministe, ne doit pas appeler de modèle et ne doit pas vous obliger à héberger un service supplémentaire.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A prompt-based custom evaluator with an ordinal metric", fr: "Un évaluateur personnalisé basé sur une invite avec une métrique ordinale" } }
    - { id: b, text: { en: "An endpoint-based custom evaluator that calls a validation API", fr: "Un évaluateur personnalisé basé sur un point de terminaison qui appelle une API de validation" } }
    - { id: c, text: { en: "A label_model grader with passing labels", fr: "Un correcteur label_model avec des étiquettes de réussite" } }
    - { id: d, text: { en: "A code-based custom evaluator with a grade() function", fr: "Un évaluateur personnalisé basé sur du code avec une fonction grade()" } }
answer: { optionId: d }
explanation:
  correct:
    en: A code-based custom evaluator runs a Python `grade(sample, item)` function that returns a single float from 0.0 to 1.0 for each item. The code runs in the evaluation service without calling a model, and the evaluator is registered in the project's evaluator catalog for reuse.
    fr: Un évaluateur personnalisé basé sur du code exécute une fonction Python `grade(sample, item)` qui renvoie un seul nombre décimal de 0,0 à 1,0 pour chaque élément. Le code s'exécute dans le service d'évaluation sans appeler de modèle, et l'évaluateur est inscrit dans le catalogue d'évaluateurs du projet pour être réutilisé.
  options:
    a: { en: "A prompt-based evaluator asks an LLM judge to score each item, which is neither deterministic nor free of model calls.", fr: "Un évaluateur basé sur une invite demande à un juge LLM de noter chaque élément, ce qui n'est ni déterministe ni exempt d'appels de modèle." }
    b: { en: "An endpoint-based evaluator posts items to an HTTP endpoint that you must host.", fr: "Un évaluateur basé sur un point de terminaison envoie les éléments à un point de terminaison HTTP que vous devez héberger." }
    c: { en: "label_model uses an LLM to classify text into labels.", fr: "label_model utilise un LLM pour classer le texte dans des étiquettes." }
references:
  - title: Custom evaluators (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/custom-evaluators
