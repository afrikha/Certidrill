id: ai300-cs1b-custom-evaluators
objective: "4.1.4"
type: dragdrop
caseStudy: ai300-cs1b-vanarsdel
difficulty: 2
status: draft
stem:
  en: |
    You are designing the automated evaluation of ClauseCheck in Microsoft Foundry.

    Which evaluator should you use for each evaluation requirement? To answer, drag the appropriate evaluators to the correct requirements. Each evaluator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez l'évaluation automatisée de ClauseCheck dans Microsoft Foundry.

    Quel évaluateur devez-vous utiliser pour chaque exigence d'évaluation ? Pour répondre, faites glisser les évaluateurs appropriés vers les exigences correspondantes. Chaque évaluateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: code, text: { en: "Code-based custom evaluator", fr: "Évaluateur personnalisé basé sur du code" } }
    - { id: prompt, text: { en: "Prompt-based custom evaluator", fr: "Évaluateur personnalisé basé sur une invite" } }
    - { id: endpoint, text: { en: "Endpoint-based custom evaluator", fr: "Évaluateur personnalisé basé sur un point de terminaison" } }
    - { id: groundedness, text: { en: "Built-in Groundedness evaluator", fr: "Évaluateur intégré Groundedness" } }
    - { id: fluency, text: { en: "Built-in Fluency evaluator", fr: "Évaluateur intégré Fluency" } }
    - { id: relevance, text: { en: "Built-in Relevance evaluator", fr: "Évaluateur intégré Relevance" } }
  targets:
    - id: r1
      text: { en: "Requirement 1: clause number format", fr: "Exigence 1 : format des numéros de clause" }
    - id: r2
      text: { en: "Requirement 2: cited clauses exist in the clause register", fr: "Exigence 2 : les clauses citées existent dans le registre des clauses" }
    - id: r3
      text: { en: "Requirement 3: neutral tone, no advice to sign or reject", fr: "Exigence 3 : ton neutre, aucun conseil de signer ou de refuser" }
    - id: r4
      text: { en: "Requirement 4: only information supported by the retrieved passages", fr: "Exigence 4 : uniquement des informations étayées par les passages récupérés" }
answer:
  mapping: { r1: code, r2: endpoint, r3: prompt, r4: groundedness }
explanation:
  correct:
    en: A code-based evaluator is a Python `grade` function that returns a score from 0.0 to 1.0 without calling a model, which suits a deterministic format check. Its sandbox has no network access, so the lookup in the clause register needs an endpoint-based evaluator, which delegates scoring to an HTTP endpoint that VanArsdel hosts. A prompt-based evaluator runs a judge prompt on a model, which fits a tone judgment written by the legal team, and the built-in Groundedness evaluator checks that the response is supported by the context.
    fr: Un évaluateur basé sur du code est une fonction Python `grade` qui renvoie un score de 0,0 à 1,0 sans appeler de modèle, ce qui convient à une vérification de format déterministe. Son bac à sable n'a pas d'accès réseau ; la recherche dans le registre des clauses demande donc un évaluateur basé sur un point de terminaison, qui délègue le calcul du score à un point de terminaison HTTP hébergé par VanArsdel. Un évaluateur basé sur une invite exécute une invite de juge sur un modèle, ce qui convient à un jugement du ton rédigé par l'équipe juridique, et l'évaluateur intégré Groundedness vérifie que la réponse est étayée par le contexte.
  options:
    fluency: { en: "Fluency judges grammar and readability; it doesn't check support by the passages or the legal team's tone rules.", fr: "Fluency juge la grammaire et la lisibilité ; il ne vérifie ni l'ancrage dans les passages ni les règles de ton de l'équipe juridique." }
    relevance: { en: "Relevance checks that the response addresses the question, not that its content comes from the retrieved passages.", fr: "Relevance vérifie que la réponse traite la question, pas que son contenu provient des passages récupérés." }
references:
  - title: Custom Evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/custom-evaluators
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
