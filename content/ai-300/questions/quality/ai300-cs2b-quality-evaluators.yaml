id: ai300-cs2b-quality-evaluators
objective: "4.1.2"
type: dragdrop
caseStudy: ai300-cs2b-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You plan to evaluate DocDesk on the test dataset of the quality team by using built-in evaluators of Microsoft Foundry.

    Which evaluator should you use for each quality requirement? To answer, drag the appropriate evaluators to the correct requirements. Each evaluator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'évaluer DocDesk sur le jeu de données de test de l'équipe qualité à l'aide des évaluateurs intégrés de Microsoft Foundry.

    Quel évaluateur devez-vous utiliser pour chaque exigence de qualité ? Pour répondre, faites glisser les évaluateurs appropriés vers les exigences correspondantes. Chaque évaluateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: grounded, text: Groundedness }
    - { id: relevance, text: Relevance }
    - { id: rouge, text: ROUGE }
    - { id: coherence, text: Coherence }
    - { id: fluency, text: Fluency }
    - { id: retrieval, text: Retrieval }
  targets:
    - id: r4
      text: { en: "Requirement 4: no information absent from the shipping document", fr: "Exigence 4 : aucune information absente du document d'expédition" }
    - id: r5
      text: { en: "Requirement 5: the reply addresses the customer's question", fr: "Exigence 5 : la réponse traite la question du client" }
    - id: r6
      text: { en: "Requirement 6: no omission compared with the reference summary", fr: "Exigence 6 : aucune omission par rapport au résumé de référence" }
answer:
  mapping: { r4: grounded, r5: relevance, r6: rouge }
explanation:
  correct:
    en: "Groundedness compares the response with the context (the shipping document) and checks the precision aspect: nothing outside the grounding context. Relevance compares the response with the query. ROUGE compares the response with the ground truth (the reference summary) by n-gram overlap and reports recall, which shows how much of the reference the summary covers."
    fr: "Groundedness compare la réponse au contexte (le document d'expédition) et vérifie l'aspect précision : rien en dehors du contexte d'ancrage. Relevance compare la réponse à la requête. ROUGE compare la réponse à la vérité terrain (le résumé de référence) par recouvrement de n-grammes et indique le rappel, qui montre la part de la référence couverte par le résumé."
  options:
    coherence: { en: "Coherence measures the logical flow of the response, not its link to the document, the question or the reference.", fr: "Coherence mesure l'enchaînement logique de la réponse, pas son lien avec le document, la question ou la référence." }
    fluency: { en: "Fluency measures language quality and readability only.", fr: "Fluency ne mesure que la qualité de la langue et la lisibilité." }
    retrieval: { en: "Retrieval assesses the retrieved context against the query, not the generated response.", fr: "Retrieval évalue le contexte récupéré par rapport à la requête, pas la réponse générée." }
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
  - title: Textual similarity evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/textual-similarity-evaluators
