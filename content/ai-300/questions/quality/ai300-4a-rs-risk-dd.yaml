id: ai300-4a-rs-risk-dd
objective: "4.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders reviews the risks of a Foundry agent that helps employees write code and answer customer requests. The agent uses tools to read customer records.

    Which risk and safety evaluator should you use to detect each risk? To answer, drag the appropriate evaluators to the correct risks. Each evaluator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders examine les risques d'un agent Foundry qui aide les employés à écrire du code et à répondre aux demandes des clients. L'agent utilise des outils pour lire les dossiers clients.

    Quel évaluateur de risques et de sécurité devez-vous utiliser pour détecter chaque risque ? Pour répondre, faites glisser les évaluateurs appropriés vers les risques correspondants. Chaque évaluateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: code, text: builtin.code_vulnerability }
    - { id: pm, text: builtin.protected_material }
    - { id: ua, text: builtin.ungrounded_attributes }
    - { id: sdl, text: builtin.sensitive_data_leakage }
    - { id: vio, text: builtin.violence }
    - { id: ia, text: builtin.indirect_attack }
  targets:
    - id: t1
      text: { en: "Generated Python code builds SQL statements by concatenating user input", fr: "Le code Python généré construit des instructions SQL en concaténant les entrées de l'utilisateur" }
    - id: t2
      text: { en: "Responses reproduce the full lyrics of popular songs", fr: "Les réponses reproduisent les paroles complètes de chansons populaires" }
    - id: t3
      text: { en: "A response states that the user seems anxious, although nothing in the context indicates it", fr: "Une réponse affirme que l'utilisateur semble anxieux, alors que rien dans le contexte ne l'indique" }
    - id: t4
      text: { en: "A reply to an angry customer describes how to injure the employee who handled the case", fr: "Une réponse à un client mécontent décrit comment blesser l'employé qui a traité le dossier" }
answer:
  mapping: { t1: code, t2: pm, t3: ua, t4: vio }
explanation:
  correct:
    en: Code vulnerability detects flaws such as sql-injection in generated code. Protected material detects copyrighted text such as song lyrics. Ungrounded attributes flags an emotional state or protected-class attribute that is detected and not grounded in the context. Violence measures language about physical actions intended to hurt or injure someone, with a severity score from 0 to 7.
    fr: Code vulnerability détecte des failles comme sql-injection dans le code généré. Protected material détecte du texte protégé comme des paroles de chansons. Ungrounded attributes signale un état émotionnel ou un attribut de classe protégée détecté et non fondé sur le contexte. Violence mesure le langage relatif à des actions physiques visant à blesser quelqu'un, avec un score de gravité de 0 à 7.
  options:
    sdl: { en: "Sensitive data leakage (preview) detects the exposure of financial, personal or health data, not violent content.", fr: "Sensitive data leakage (préversion) détecte l'exposition de données financières, personnelles ou de santé, pas du contenu violent." }
    ia: { en: "Indirect attack detects instructions injected into processed documents and supports models only, not agents.", fr: "Indirect attack détecte des instructions injectées dans les documents traités et ne prend en charge que les modèles, pas les agents." }
references:
  - title: Risk and safety evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators
