id: ai300-4a-rs-xpia
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a model deployment named **mail-summarizer** that summarizes emails and attachments sent by external senders. The security team is concerned that attackers might hide instructions inside the attachments to make the model produce manipulated content or gather data.

    You need to add an evaluator that detects these attacks in the evaluation of mail-summarizer.

    Which evaluator should you use?
  fr: |
    Woodgrove Bank dispose d'un déploiement de modèle nommé **mail-summarizer** qui résume les e-mails et les pièces jointes envoyés par des expéditeurs externes. L'équipe de sécurité craint que des attaquants dissimulent des instructions dans les pièces jointes pour amener le modèle à produire du contenu manipulé ou à collecter des données.

    Vous devez ajouter un évaluateur qui détecte ces attaques dans l'évaluation de mail-summarizer.

    Quel évaluateur devez-vous utiliser ?
body:
  options:
    - { id: a, text: builtin.protected_material }
    - { id: b, text: builtin.indirect_attack }
    - { id: c, text: builtin.code_vulnerability }
    - { id: d, text: builtin.ungrounded_attributes }
answer: { optionId: b }
explanation:
  correct:
    en: The indirect attack evaluator detects indirect jailbreak attempts (XPIA), in which attack content is injected into a document or source that the model processes. It returns pass or fail and covers manipulated content, intrusion and information gathering.
    fr: L'évaluateur indirect attack détecte les tentatives de jailbreak indirect (XPIA), dans lesquelles du contenu d'attaque est injecté dans un document ou une source que le modèle traite. Il renvoie pass ou fail et couvre le contenu manipulé, l'intrusion et la collecte d'informations.
  options:
    a: { en: "Protected material detects copyrighted text, such as song lyrics or articles, in responses.", fr: "Protected material détecte du texte protégé par le droit d'auteur, comme des paroles de chansons ou des articles, dans les réponses." }
    c: { en: "Code vulnerability detects security flaws, such as SQL injection, in generated code.", fr: "Code vulnerability détecte des failles de sécurité, comme l'injection SQL, dans le code généré." }
    d: { en: "Ungrounded attributes detects ungrounded inferences about personal attributes such as emotional state.", fr: "Ungrounded attributes détecte des déductions non fondées sur des attributs personnels comme l'état émotionnel." }
references:
  - title: Risk and safety evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators
