id: ai300-4b-lifecycle-stages
objective: "4.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. builds a retrieval-augmented generation (RAG) assistant in Microsoft Foundry and wants to apply observability at each stage of the application lifecycle.

    Which Foundry capability should Litware use for each activity? To answer, drag the appropriate capabilities to the correct activities. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. crée un assistant de génération augmentée de récupération (RAG) dans Microsoft Foundry et veut appliquer l'observabilité à chaque étape du cycle de vie de l'application.

    Quelle fonctionnalité Foundry Litware doit-elle utiliser pour chaque activité ? Pour répondre, faites glisser les fonctionnalités appropriées vers les activités correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: bench, text: { en: "Model benchmarks in Foundry", fr: "Benchmarks de modèles dans Foundry" } }
    - { id: redteam, text: { en: "AI red teaming agent", fr: "Agent de red teaming IA" } }
    - { id: cont, text: { en: "Continuous evaluation", fr: "Évaluation continue" } }
    - { id: alerts, text: { en: "Azure Monitor alerts", fr: "Alertes Azure Monitor" } }
    - { id: cluster, text: { en: "Cluster analysis", fr: "Analyse de clusters" } }
    - { id: sched, text: { en: "Scheduled evaluation", fr: "Évaluation planifiée" } }
  targets:
    - id: t1
      text: { en: "Before choosing a model: compare candidate models on quality and safety", fr: "Avant de choisir un modèle : comparer les modèles candidats sur la qualité et la sécurité" }
    - id: t2
      text: { en: "Before release: simulate adversarial attacks against the application", fr: "Avant la mise en production : simuler des attaques adverses contre l'application" }
    - id: t3
      text: { en: "In production: score a sample of live responses for quality and safety", fr: "En production : noter un échantillon des réponses réelles pour la qualité et la sécurité" }
    - id: t4
      text: { en: "In production: notify the on-call team when outputs fail a quality threshold", fr: "En production : avertir l'équipe d'astreinte lorsque les sorties ne respectent pas un seuil de qualité" }
answer:
  mapping: { t1: bench, t2: redteam, t3: cont, t4: alerts }
explanation:
  correct:
    en: Foundry maps observability to three stages. For base model selection, benchmarks compare models on quality, task performance and safety. In pre-production, the AI red teaming agent (built on PyRIT) simulates adversarial attacks. In post-production, continuous evaluation scores production traffic at a sampled rate, and Azure Monitor alerts notify people when outputs fail quality thresholds or produce harmful content.
    fr: Foundry associe l'observabilité à trois étapes. Pour la sélection du modèle de base, les benchmarks comparent les modèles sur la qualité, les performances sur la tâche et la sécurité. En préproduction, l'agent de red teaming IA (fondé sur PyRIT) simule des attaques adverses. En postproduction, l'évaluation continue note le trafic de production à un taux d'échantillonnage donné, et les alertes Azure Monitor avertissent les personnes lorsque les sorties ne respectent pas les seuils de qualité ou produisent du contenu nuisible.
  options:
    sched: { en: "Scheduled evaluation scores a test dataset on a schedule to detect drift; it neither samples live traffic nor sends notifications.", fr: "L'évaluation planifiée note un jeu de données de test selon une planification pour détecter une dérive ; elle n'échantillonne pas le trafic réel et n'envoie pas de notifications." }
    cluster: { en: "Cluster analysis groups evaluation failures to help analyze them; it is not one of the four activities.", fr: "L'analyse de clusters regroupe les échecs d'évaluation pour aider à les analyser ; elle ne correspond à aucune des quatre activités." }
references:
  - title: Observability in generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/observability
