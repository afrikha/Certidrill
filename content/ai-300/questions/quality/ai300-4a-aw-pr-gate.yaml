id: ai300-4a-aw-pr-gate
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum uses the Azure Developer CLI (azd) 1.33.0 with the `azure.ai.evaluations` extension to run an evaluation named **ci-f1-quality** for a Foundry agent. The evaluation runs from a GitHub Actions workflow.

    You need to prevent pull requests from being merged when the pass rate of ci-f1-quality is below 80 percent. The check must run without human review.

    What should you do?
  fr: |
    Adatum utilise Azure Developer CLI (azd) 1.33.0 avec l'extension `azure.ai.evaluations` pour exécuter une évaluation nommée **ci-f1-quality** pour un agent Foundry. L'évaluation est lancée depuis un workflow GitHub Actions.

    Vous devez empêcher la fusion des demandes de tirage (pull requests) quand le taux de réussite de ci-f1-quality est inférieur à 80 %. La vérification doit s'exécuter sans révision humaine.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set pass_threshold to 0.8 on a score_model grader in the evaluation.", fr: "Définir pass_threshold sur 0.8 pour un correcteur score_model dans l'évaluation." }
    - id: b
      text: { en: "Add a job that runs azd ai eval run show with --wait --fail-on pass-rate=0.8, and make the job a required check.", fr: "Ajouter un travail qui exécute azd ai eval run show avec --wait --fail-on pass-rate=0.8, et en faire une vérification obligatoire." }
    - id: c
      text: { en: "Create a scheduled evaluation that runs ci-f1-quality on the test dataset every night.", fr: "Créer une évaluation planifiée qui exécute ci-f1-quality sur le jeu de données de test chaque nuit." }
    - id: d
      text: { en: "Trigger the evaluation workflow on pull_request_target so that it can read the repository secrets.", fr: "Déclencher le workflow d'évaluation sur pull_request_target pour qu'il puisse lire les secrets du dépôt." }
answer: { optionId: b }
explanation:
  correct:
    en: The azd evaluation quality gate waits for the run and exits with code 1 when the pass rate breaches the `--fail-on pass-rate=0.8` condition, which fails the job. Making that job a required check on pull requests blocks the merge automatically.
    fr: La barrière de qualité d'évaluation azd attend la fin de l'exécution et se termine avec le code 1 quand le taux de réussite ne respecte pas la condition `--fail-on pass-rate=0.8`, ce qui fait échouer le travail. Faire de ce travail une vérification obligatoire des demandes de tirage bloque automatiquement la fusion.
  options:
    a:
      en: pass_threshold decides whether each item passes; it does not fail the workflow when the overall pass rate is low.
      fr: pass_threshold décide si chaque élément est accepté ; il ne fait pas échouer le workflow quand le taux de réussite global est faible.
    c:
      en: A scheduled evaluation detects drift over time; it is not tied to pull requests and cannot block a merge.
      fr: Une évaluation planifiée détecte une dérive dans le temps ; elle n'est pas liée aux demandes de tirage et ne peut pas bloquer une fusion.
    d:
      en: Learn advises against pull_request_target for this gate, and the trigger alone does not enforce any pass-rate threshold.
      fr: Learn déconseille pull_request_target pour cette barrière, et le déclencheur seul n'impose aucun seuil de taux de réussite.
references:
  - title: How to run an evaluation in GitHub Action (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action
