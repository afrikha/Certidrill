id: ai300-4b-metrics-reader-role
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Foundry resource named **fdy-fabrikam** that contains several model deployments.

    An analyst must view the Azure Monitor metrics of the deployments, such as Time To Response and Input Tokens, in metrics explorer. The analyst must not be able to change any setting of fdy-fabrikam. The solution must follow the principle of least privilege.

    Which role should you assign to the analyst on fdy-fabrikam?
  fr: |
    Fabrikam dispose d'une ressource Microsoft Foundry nommée **fdy-fabrikam** qui contient plusieurs déploiements de modèles.

    Un analyste doit consulter les métriques Azure Monitor des déploiements, comme Time To Response et Input Tokens, dans Metrics Explorer. L'analyste ne doit pouvoir modifier aucun paramètre de fdy-fabrikam. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à l'analyste sur fdy-fabrikam ?
body:
  options:
    - { id: a, text: Monitoring Contributor }
    - { id: b, text: Cognitive Services Contributor }
    - { id: c, text: Monitoring Reader }
    - { id: d, text: Log Analytics Contributor }
answer: { optionId: c }
explanation:
  correct:
    en: Metrics of Foundry Models deployments are collected automatically in the Azure Monitor metrics database. Viewing them requires the Monitoring Reader role on the resource, which grants read-only access to monitoring data.
    fr: Les métriques des déploiements Foundry Models sont collectées automatiquement dans la base de données de métriques d'Azure Monitor. Leur consultation nécessite le rôle Monitoring Reader sur la ressource, qui accorde un accès en lecture seule aux données de surveillance.
  options:
    a: { en: "Monitoring Contributor is needed to configure diagnostic settings; it grants more than viewing metrics.", fr: "Monitoring Contributor est nécessaire pour configurer les paramètres de diagnostic ; il accorde plus que la consultation des métriques." }
    b: { en: "Cognitive Services Contributor can create and modify deployments, far more than the analyst needs.", fr: "Cognitive Services Contributor peut créer et modifier des déploiements, bien plus que ce dont l'analyste a besoin." }
    d: { en: "Log Analytics Contributor applies to Log Analytics workspaces and grants write access; platform metrics do not require a workspace.", fr: "Log Analytics Contributor s'applique aux espaces de travail Log Analytics et accorde un accès en écriture ; les métriques de plateforme ne nécessitent pas d'espace de travail." }
references:
  - title: Monitor model deployments in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/monitor-models
