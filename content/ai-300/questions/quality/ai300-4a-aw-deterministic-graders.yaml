id: ai300-4a-aw-deterministic-graders
objective: "4.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys adds Azure OpenAI graders to an evaluation in a Foundry project. Each row of the dataset contains a `response` and a `ground_truth`.

    You need a grader that compares the response with the ground truth without calling a model, to avoid model inference costs.

    Which two grader types can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys ajoute des correcteurs Azure OpenAI à une évaluation dans un projet Foundry. Chaque ligne du jeu de données contient une `response` et une `ground_truth`.

    Vous avez besoin d'un correcteur qui compare la réponse à la vérité de terrain sans appeler de modèle, pour éviter les coûts d'inférence.

    Quels sont les deux types de correcteurs que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: string_check }
    - { id: b, text: label_model }
    - { id: c, text: text_similarity }
    - { id: d, text: score_model }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "`string_check` performs a deterministic string comparison (`eq`, `ne`, `like`, `ilike`) between the input and the reference, and `text_similarity` computes a metric such as `fuzzy_match`, `bleu` or `rouge_l` against the reference. Neither calls an LLM."
    fr: "`string_check` effectue une comparaison déterministe de chaînes (`eq`, `ne`, `like`, `ilike`) entre l'entrée et la référence, et `text_similarity` calcule une métrique comme `fuzzy_match`, `bleu` ou `rouge_l` par rapport à la référence. Aucun des deux n'appelle de LLM."
  options:
    b: { en: "label_model uses an LLM to classify text into predefined labels.", fr: "label_model utilise un LLM pour classer le texte dans des étiquettes prédéfinies." }
    d: { en: "score_model uses an LLM to assign a numeric score.", fr: "score_model utilise un LLM pour attribuer un score numérique." }
references:
  - title: Azure OpenAI graders
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/azure-openai-graders
