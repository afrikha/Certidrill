id: ai300-4a-rs-region
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware publishes a writing assistant. You plan to create a new Foundry project dedicated to evaluations. The evaluations must run the Protected material evaluator, to detect copyrighted text in responses, and the Groundedness Pro evaluator.

    You need to choose a region for the project that supports both evaluators.

    Which region should you choose?
  fr: |
    Litware publie un assistant d'écriture. Vous prévoyez de créer un nouveau projet Foundry dédié aux évaluations. Les évaluations doivent exécuter l'évaluateur Protected material, pour détecter du texte protégé par le droit d'auteur dans les réponses, et l'évaluateur Groundedness Pro.

    Vous devez choisir pour le projet une région qui prend en charge les deux évaluateurs.

    Quelle région devez-vous choisir ?
body:
  options:
    - { id: a, text: Sweden Central }
    - { id: b, text: West Europe }
    - { id: c, text: France Central }
    - { id: d, text: East US 2 }
answer: { optionId: d }
explanation:
  correct:
    en: Most risk and safety evaluators are available in many regions, but Protected material is supported only in East US 2, and Groundedness Pro only in East US 2 and Sweden Central. East US 2 is the only region that meets both requirements.
    fr: La plupart des évaluateurs de risques et de sécurité sont disponibles dans de nombreuses régions, mais Protected material n'est pris en charge que dans East US 2, et Groundedness Pro uniquement dans East US 2 et Sweden Central. East US 2 est la seule région qui répond aux deux exigences.
  options:
    a: { en: "Sweden Central supports Groundedness Pro but not Protected material.", fr: "Sweden Central prend en charge Groundedness Pro, mais pas Protected material." }
    b: { en: "West Europe supports the content safety evaluators but neither Protected material nor Groundedness Pro.", fr: "West Europe prend en charge les évaluateurs de sécurité du contenu, mais ni Protected material ni Groundedness Pro." }
    c: { en: "France Central supports the content safety evaluators but neither Protected material nor Groundedness Pro.", fr: "France Central prend en charge les évaluateurs de sécurité du contenu, mais ni Protected material ni Groundedness Pro." }
references:
  - title: Rate limits, region support, and enterprise features for evaluation
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-regions-limits-virtual-network
