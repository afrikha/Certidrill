id: ai300-4b-workload-billing-match
objective: "4.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys plans four generative AI workloads in Microsoft Foundry. All workloads use the same Azure OpenAI model. Each workload must use the deployment or billing option with the lowest cost that meets its requirement.

    Which option should you use for each workload? To answer, drag the appropriate options to the correct workloads. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prévoit quatre charges de travail d'IA générative dans Microsoft Foundry. Toutes les charges de travail utilisent le même modèle Azure OpenAI. Chaque charge de travail doit utiliser l'option de déploiement ou de facturation la moins chère qui répond à son exigence.

    Quelle option devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les options appropriées vers les charges de travail correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: std, text: { en: "Global Standard deployment (pay per token)", fr: "Déploiement Global Standard (paiement par jeton)" } }
    - { id: batch, text: { en: "Global Batch deployment", fr: "Déploiement Global Batch" } }
    - { id: ptures, text: { en: "Provisioned deployment with a one-year Azure Reservation", fr: "Déploiement approvisionné avec une réservation Azure d'un an" } }
    - { id: ptuhour, text: { en: "Provisioned deployment billed hourly, without a reservation", fr: "Déploiement approvisionné facturé à l'heure, sans réservation" } }
  targets:
    - id: t1
      text: { en: "Customer chat assistant with high, steady traffic around the clock and predictable latency, planned for the next three years", fr: "Assistant de conversation client avec un trafic élevé et régulier jour et nuit et une latence prévisible, prévu pour les trois prochaines années" }
    - id: t2
      text: { en: "Two-day benchmark of provisioned capacity before a product launch", fr: "Test de performances de deux jours d'une capacité approvisionnée avant le lancement d'un produit" }
    - id: t3
      text: { en: "Weekly translation of 50,000 documents, with results accepted within 24 hours", fr: "Traduction hebdomadaire de 50 000 documents, avec des résultats acceptés sous 24 heures" }
    - id: t4
      text: { en: "Internal assistant with low and unpredictable traffic", fr: "Assistant interne avec un trafic faible et imprévisible" }
answer:
  mapping: { t1: ptures, t2: ptuhour, t3: batch, t4: std }
explanation:
  correct:
    en: Reservations give a discounted PTU rate for sustained production workloads, while hourly PTU billing suits short-term use such as benchmarking or events. Global Batch costs 50 % less than Global Standard for work that can wait up to 24 hours. Low, unpredictable traffic is cheapest on pay-per-token Global Standard, because a provisioned deployment is billed every hour it exists.
    fr: Les réservations accordent un tarif réduit par PTU pour des charges de production soutenues, alors que la facturation horaire des PTU convient à un usage court comme un test de performances ou un événement. Global Batch coûte 50 % de moins que Global Standard pour un travail qui peut attendre jusqu'à 24 heures. Un trafic faible et imprévisible est moins cher en Global Standard facturé par jeton, car un déploiement approvisionné est facturé pour chaque heure d'existence.
references:
  - title: Provisioned throughput billing and cost management
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-onboarding
  - title: How to use global batch processing with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/batch
