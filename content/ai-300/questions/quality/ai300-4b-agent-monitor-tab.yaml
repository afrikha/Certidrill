id: ai300-4b-agent-monitor-tab
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a Microsoft Foundry project that contains an agent named **travel-agent**. An Application Insights resource is connected to the project.

    The product owner wants to review the run success rate, the token usage and the latency of travel-agent for the last seven days, without writing any query.

    What should the product owner use?
  fr: |
    Wingtip Toys dispose d'un projet Microsoft Foundry qui contient un agent nommé **travel-agent**. Une ressource Application Insights est connectée au projet.

    Le propriétaire du produit veut consulter le taux de réussite des exécutions, l'utilisation des jetons et la latence de travel-agent sur les sept derniers jours, sans écrire de requête.

    Qu'est-ce que le propriétaire du produit doit utiliser ?
body:
  options:
    - { id: a, text: { en: "The Metrics tab of the model deployment that travel-agent uses", fr: "L'onglet Metrics du déploiement de modèle utilisé par travel-agent" } }
    - { id: b, text: { en: "Cost analysis in Microsoft Cost Management", fr: "L'analyse des coûts dans Microsoft Cost Management" } }
    - { id: c, text: { en: "The Monitor tab of travel-agent in the Foundry portal", fr: "L'onglet Monitor de travel-agent dans le portail Foundry" } }
    - { id: d, text: { en: "The activity log of the Foundry resource", fr: "Le journal d'activité de la ressource Foundry" } }
answer: { optionId: c }
explanation:
  correct:
    en: The Monitor tab of an agent (Build > Agents > agent > Monitor) opens the Agent Monitoring Dashboard, with summary cards and charts for token usage, latency, run success rate, evaluation scores and red teaming results over a selected time range. The data comes from the connected Application Insights resource, so no query is needed.
    fr: |
      L'onglet Monitor d'un agent (Build > Agents > agent > Monitor) ouvre le tableau de bord Agent Monitoring Dashboard, avec des cartes de synthèse et des graphiques sur l'utilisation des jetons, la latence, le taux de réussite des exécutions, les scores d'évaluation et les résultats de red teaming pour une plage de temps choisie. Les données proviennent de la ressource Application Insights connectée : aucune requête n'est nécessaire.
  options:
    a: { en: "Deployment metrics describe the model (requests, latency, tokens), not agent runs, so they do not show a run success rate.", fr: "Les métriques d'un déploiement décrivent le modèle (requêtes, latence, jetons), pas les exécutions de l'agent : elles n'affichent pas de taux de réussite des exécutions." }
    b: { en: "Cost analysis shows charges by meter and resource, not latency or run success.", fr: "L'analyse des coûts affiche les frais par compteur et par ressource, pas la latence ni la réussite des exécutions." }
    d: { en: "The activity log records management operations on the resource, not agent runtime metrics.", fr: "Le journal d'activité enregistre les opérations de gestion sur la ressource, pas les métriques d'exécution de l'agent." }
references:
  - title: Monitor agents with the Agent Monitoring Dashboard
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard
