id: ai300-4a-rs-red-team-cloud
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Foundry agent named **billing-agent** that calls tools to read and update invoices. Before release, you must red team billing-agent for the prohibited actions, sensitive data leakage and task adherence risk categories.

    You need to choose how to run the scan.

    What should you do?
  fr: |
    Adatum dispose d'un agent Foundry nommé **billing-agent** qui appelle des outils pour lire et mettre à jour des factures. Avant la mise en production, vous devez effectuer un red teaming de billing-agent pour les catégories de risques prohibited actions, sensitive data leakage et task adherence.

    Vous devez choisir comment exécuter l'analyse.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run a local red teaming scan from a developer workstation against billing-agent.", fr: "Exécuter une analyse de red teaming locale depuis un poste de développeur sur billing-agent." } }
    - { id: b, text: { en: "Run a local red teaming scan against the model deployment that billing-agent uses.", fr: "Exécuter une analyse de red teaming locale sur le déploiement de modèle utilisé par billing-agent." } }
    - { id: c, text: { en: "Run a dataset evaluation of stored billing-agent responses with builtin.prohibited_actions.", fr: "Exécuter une évaluation de jeu de données des réponses stockées de billing-agent avec builtin.prohibited_actions." } }
    - { id: d, text: { en: "Run a cloud red teaming scan of billing-agent from the Foundry project.", fr: "Exécuter une analyse de red teaming dans le cloud de billing-agent depuis le projet Foundry." } }
answer: { optionId: d }
explanation:
  correct:
    en: Prohibited actions, sensitive data leakage and task adherence are agentic risk categories that the AI Red Teaming Agent supports only in cloud runs, which provide a minimally sandboxed environment. Local runs support only the model-focused categories, such as hateful, sexual, violent and self-harm content.
    fr: Prohibited actions, sensitive data leakage et task adherence sont des catégories de risques agentiques qu'AI Red Teaming Agent ne prend en charge que dans les exécutions cloud, qui fournissent un environnement minimalement isolé (sandbox). Les exécutions locales ne prennent en charge que les catégories centrées sur le modèle, comme le contenu haineux, sexuel, violent ou d'automutilation.
  options:
    a: { en: "Local scans do not support the agentic risk categories.", fr: "Les analyses locales ne prennent pas en charge les catégories de risques agentiques." }
    b: { en: "Scanning the model alone ignores the agent's tool calls, and local scans do not support agentic categories.", fr: "Analyser le modèle seul ignore les appels d'outils de l'agent, et les analyses locales ne prennent pas en charge les catégories agentiques." }
    c: { en: "Prohibited actions supports agent targets only and is not available for dataset evaluations; a dataset run is also not red teaming.", fr: "Prohibited actions ne prend en charge que les cibles d'agent et n'est pas disponible pour les évaluations de jeux de données ; une exécution sur un jeu de données n'est pas non plus du red teaming." }
references:
  - title: AI Red Teaming Agent
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/ai-red-teaming-agent
  - title: Risk and safety evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators
