id: ai300-4a-qm-completeness
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam evaluates an IT support assistant. The Groundedness and Relevance scores are high, but support engineers notice that many responses don't say what the expected answers say. Each row of the test dataset contains a `query`, a `response` and a `ground_truth` written by the support engineers, often in different words from the assistant.

    You need an evaluator that scores from 1 to 5 how close the meaning of each response is to the expected answer, even when the wording differs.

    Which evaluator should you use?
  fr: |
    Fabrikam évalue un assistant de support informatique. Les scores Groundedness et Relevance sont élevés, mais les ingénieurs du support constatent que de nombreuses réponses ne disent pas ce que disent les réponses attendues. Chaque ligne du jeu de données de test contient une `query`, une `response` et une `ground_truth` rédigée par les ingénieurs du support, souvent avec d'autres mots que l'assistant.

    Vous avez besoin d'un évaluateur qui note de 1 à 5 la proximité de sens entre chaque réponse et la réponse attendue, même quand la formulation diffère.

    Quel évaluateur devez-vous utiliser ?
body:
  options:
    - id: a
      text: Coherence
    - id: b
      text: ROUGE
    - id: c
      text: Similarity
    - id: d
      text: Groundedness
answer: { optionId: c }
explanation:
  correct:
    en: Similarity (`builtin.similarity`) is an AI-assisted evaluator that compares the response with the `ground_truth` by using a judge model deployment. It returns a score from 1 to 5 with a default threshold of 3, so it can recognize the same meaning in different words. Groundedness, by contrast, checks the response against the context, which explains why responses can be grounded yet differ from the expected answers.
    fr: Similarity (`builtin.similarity`) est un évaluateur assisté par IA qui compare la réponse à la `ground_truth` à l'aide d'un déploiement de modèle juge. Il renvoie un score de 1 à 5 avec un seuil par défaut de 3 ; il peut donc reconnaître le même sens exprimé avec d'autres mots. Groundedness vérifie au contraire la réponse par rapport au contexte, ce qui explique qu'une réponse puisse être ancrée tout en s'écartant des réponses attendues.
  options:
    a:
      en: Coherence measures the logical flow of ideas, not the closeness to an expected answer.
      fr: Coherence mesure l'enchaînement logique des idées, pas la proximité avec une réponse attendue.
    b:
      en: ROUGE measures n-gram overlap with the ground truth and returns a value from 0 to 1, so different wording lowers it even when the meaning is the same.
      fr: ROUGE mesure le recouvrement de n-grammes avec la vérité terrain et renvoie une valeur de 0 à 1 ; une formulation différente le fait baisser même quand le sens est le même.
    d:
      en: Groundedness compares the response with the context, not with a ground truth.
      fr: Groundedness compare la réponse au contexte, pas à une vérité terrain.
references:
  - title: Textual similarity evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/textual-similarity-evaluators
