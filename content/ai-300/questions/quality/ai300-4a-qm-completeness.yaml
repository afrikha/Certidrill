id: ai300-4a-qm-completeness
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam evaluates an IT support assistant. The Groundedness and Relevance scores are high, but support engineers notice that many responses omit troubleshooting steps that appear in the expected answers. Each row of the test dataset contains a `response` and a `ground_truth` written by the support engineers.

    You need an evaluator that measures how much of the expected information each response covers.

    Which evaluator should you use?
  fr: |
    Fabrikam évalue un assistant de support informatique. Les scores Groundedness et Relevance sont élevés, mais les ingénieurs du support constatent que de nombreuses réponses omettent des étapes de dépannage présentes dans les réponses attendues. Chaque ligne du jeu de données de test contient une `response` et une `ground_truth` rédigée par les ingénieurs du support.

    Vous avez besoin d'un évaluateur qui mesure la part des informations attendues couverte par chaque réponse.

    Quel évaluateur devez-vous utiliser ?
body:
  options:
    - id: a
      text: Coherence
    - id: b
      text: Groundedness Pro
    - id: c
      text: Response Completeness
    - id: d
      text: Fluency
answer: { optionId: c }
explanation:
  correct:
    en: Response Completeness (preview) compares the response with the `ground_truth` and scores, from 1 to 5, whether it covers the expected information; it measures recall. Groundedness, by contrast, measures precision against the context, which explains why responses can be grounded yet incomplete.
    fr: Response Completeness (préversion) compare la réponse à la `ground_truth` et note, de 1 à 5, si elle couvre les informations attendues ; il mesure le rappel. Groundedness mesure au contraire la précision par rapport au contexte, ce qui explique qu'une réponse puisse être ancrée mais incomplète.
  options:
    a:
      en: Coherence measures the logical flow of ideas, not whether expected information is present.
      fr: Coherence mesure l'enchaînement logique des idées, pas la présence des informations attendues.
    b:
      en: Groundedness Pro strictly checks the response against the context and returns True or False; it does not use a ground truth.
      fr: Groundedness Pro vérifie strictement la réponse par rapport au contexte et renvoie True ou False ; il n'utilise pas de vérité de terrain.
    d:
      en: Fluency measures grammar and readability, regardless of the content.
      fr: Fluency mesure la grammaire et la lisibilité, indépendamment du contenu.
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
