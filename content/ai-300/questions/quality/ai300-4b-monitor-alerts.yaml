id: ai300-4b-monitor-alerts
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Microsoft Foundry project that contains an agent named **hr-agent**. An Application Insights resource is connected to the project. Continuous evaluation and scheduled red team scans are configured for hr-agent.

    The on-call engineers must be notified when the evaluation scores of hr-agent drop or when a red team scan reports findings. The solution must minimize administrative effort.

    What should you configure?
  fr: |
    Contoso dispose d'un projet Microsoft Foundry qui contient un agent nommé **hr-agent**. Une ressource Application Insights est connectée au projet. L'évaluation continue et des analyses de red teaming planifiées sont configurées pour hr-agent.

    Les ingénieurs d'astreinte doivent être avertis lorsque les scores d'évaluation de hr-agent baissent ou lorsqu'une analyse de red teaming signale des problèmes. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A budget alert in Microsoft Cost Management", fr: "Une alerte budgétaire dans Microsoft Cost Management" } }
    - { id: b, text: { en: "A diagnostic setting that streams the logs to an event hub", fr: "Un paramètre de diagnostic qui diffuse les journaux vers un hub d'événements" } }
    - { id: c, text: { en: "A recurring evaluation that runs every hour", fr: "Une évaluation récurrente exécutée toutes les heures" } }
    - { id: d, text: { en: "Alerts in the Monitor settings of hr-agent", fr: "Des alertes dans les paramètres Monitor de hr-agent" } }
answer: { optionId: d }
explanation:
  correct:
    en: The Monitor settings of an agent include Alerts (preview), which detect performance anomalies, evaluation failures and security risks. You can configure alerts on latency, token usage, evaluation scores or red team findings directly there, without building a custom pipeline.
    fr: Les paramètres Monitor d'un agent comprennent Alerts (préversion), qui détectent les anomalies de performances, les échecs d'évaluation et les risques de sécurité. Vous pouvez y configurer directement des alertes sur la latence, l'utilisation des jetons, les scores d'évaluation ou les résultats de red teaming, sans créer de pipeline personnalisé.
  options:
    a: { en: "A budget alert reacts to spending, not to evaluation scores or red team findings.", fr: "Une alerte budgétaire réagit aux dépenses, pas aux scores d'évaluation ni aux résultats de red teaming." }
    b: { en: "Streaming logs to an event hub only exports data; you would still have to build the detection and notification yourself.", fr: "Diffuser les journaux vers un hub d'événements ne fait qu'exporter des données : il faudrait encore créer vous-même la détection et la notification." }
    c: { en: "A recurring evaluation produces more scores but notifies nobody.", fr: "Une évaluation récurrente produit davantage de scores, mais n'avertit personne." }
references:
  - title: Monitor agents with the Agent Monitoring Dashboard
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard
