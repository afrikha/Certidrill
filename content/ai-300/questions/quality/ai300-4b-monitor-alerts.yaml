id: ai300-4b-monitor-alerts
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Microsoft Foundry resource named **fdy-contoso**. An agent named **hr-agent** calls a model deployment named **chat-prod** in fdy-contoso. Continuous evaluation is configured for hr-agent.

    The on-call engineers must receive an email whenever the Model Availability Rate of chat-prod drops below 99 percent. The solution must minimize administrative effort.

    What should you configure?
  fr: |
    Contoso dispose d'une ressource Microsoft Foundry nommée **fdy-contoso**. Un agent nommé **hr-agent** appelle un déploiement de modèle nommé **chat-prod** dans fdy-contoso. L'évaluation continue est configurée pour hr-agent.

    Les ingénieurs d'astreinte doivent recevoir un e-mail chaque fois que le Model Availability Rate de chat-prod descend sous 99 %. La solution doit réduire au minimum les tâches d'administration.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A budget alert in Microsoft Cost Management", fr: "Une alerte budgétaire dans Microsoft Cost Management" } }
    - { id: b, text: { en: "A diagnostic setting that streams the logs to an event hub", fr: "Un paramètre de diagnostic qui diffuse les journaux vers un hub d'événements" } }
    - { id: c, text: { en: "A second continuous evaluation rule for hr-agent", fr: "Une seconde règle d'évaluation continue pour hr-agent" } }
    - { id: d, text: { en: "An Azure Monitor metric alert rule with an action group", fr: "Une règle d'alerte de métrique Azure Monitor avec un groupe d'actions" } }
answer: { optionId: d }
explanation:
  correct:
    en: Model deployment metrics such as Model Availability Rate are collected automatically in Azure Monitor and support near real-time metric alerts. A metric alert rule scoped to fdy-contoso, with a condition on the metric filtered on chat-prod, triggers an action group that sends the email, with no custom pipeline.
    fr: Les métriques des déploiements de modèles, comme Model Availability Rate, sont collectées automatiquement dans Azure Monitor et prennent en charge les alertes de métrique en quasi temps réel. Une règle d'alerte de métrique dont l'étendue est fdy-contoso, avec une condition sur la métrique filtrée sur chat-prod, déclenche un groupe d'actions qui envoie l'e-mail, sans pipeline personnalisé.
  options:
    a: { en: "A budget alert reacts to spending, not to the availability of a deployment.", fr: "Une alerte budgétaire réagit aux dépenses, pas à la disponibilité d'un déploiement." }
    b: { en: "Streaming logs to an event hub only exports data; you would still have to build the detection and notification yourself.", fr: "Diffuser les journaux vers un hub d'événements ne fait qu'exporter des données : il faudrait encore créer vous-même la détection et la notification." }
    c: { en: "A continuous evaluation rule scores sampled responses with evaluators; it doesn't watch a deployment metric or notify anyone.", fr: "Une règle d'évaluation continue note des réponses échantillonnées avec des évaluateurs ; elle ne surveille pas une métrique de déploiement et n'avertit personne." }
references:
  - title: Monitor model deployments in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/monitor-models
