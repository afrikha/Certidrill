id: ai300-4a-aw-custom-name-fix
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso registered a code-based custom evaluator in a Foundry project by calling `project_client.beta.evaluators.create_version(name="response_length_scorer", ...)`. Its init parameters are `deployment_name` and `pass_threshold`, and its `grade()` function reads the `response` field of each dataset item.

    A developer writes the testing criteria shown in the exhibit. When the developer creates the evaluation, the service reports that the evaluator cannot be found.

    What should you change?
  fr: |
    Contoso a inscrit un évaluateur personnalisé basé sur du code dans un projet Foundry en appelant `project_client.beta.evaluators.create_version(name="response_length_scorer", ...)`. Ses paramètres d'initialisation sont `deployment_name` et `pass_threshold`, et sa fonction `grade()` lit le champ `response` de chaque élément du jeu de données.

    Un développeur écrit les critères de test présentés dans la pièce. Quand le développeur crée l'évaluation, le service signale que l'évaluateur est introuvable.

    Que devez-vous modifier ?
exhibits:
  - id: code
    title: { en: "Testing criteria", fr: "Critères de test" }
    body: |
      ```python
      testing_criteria = [
          {
              "type": "azure_ai_evaluator",
              "name": "response_length",
              "evaluator_name": "builtin.response_length_scorer",
              "initialization_parameters": {
                  "deployment_name": model_deployment_name,
                  "pass_threshold": 0.5,
              },
          },
      ]
      ```
body:
  options:
    - { id: a, text: { en: "Remove deployment_name, because the evaluator does not call a model.", fr: "Supprimer deployment_name, car l'évaluateur n'appelle pas de modèle." } }
    - { id: b, text: { en: "Rename pass_threshold to threshold.", fr: "Renommer pass_threshold en threshold." } }
    - { id: c, text: { en: "Set evaluator_name to \"response_length_scorer\".", fr: "Définir evaluator_name sur \"response_length_scorer\"." } }
    - { id: d, text: { en: "Set name to \"response_length_scorer\".", fr: "Définir name sur \"response_length_scorer\"." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The `builtin.` prefix identifies the evaluators that Microsoft provides. A custom evaluator is referenced in `testing_criteria` by the name under which it was registered, here `response_length_scorer`, while `name` is only the label of the criterion in the results."
    fr: "Le préfixe `builtin.` identifie les évaluateurs fournis par Microsoft. Un évaluateur personnalisé est référencé dans `testing_criteria` par le nom sous lequel il a été inscrit, ici `response_length_scorer`, tandis que `name` n'est que le libellé du critère dans les résultats."
  options:
    a: { en: "deployment_name is a required init parameter of code-based evaluators, even though no LLM is called.", fr: "deployment_name est un paramètre d'initialisation obligatoire des évaluateurs basés sur du code, même si aucun LLM n'est appelé." }
    b: { en: "pass_threshold is the correct init parameter of a code-based evaluator; threshold belongs to prompt-based evaluators.", fr: "pass_threshold est le bon paramètre d'initialisation d'un évaluateur basé sur du code ; threshold appartient aux évaluateurs basés sur une invite." }
    d: { en: "name labels the criterion; the service looks up the evaluator by evaluator_name.", fr: "name sert de libellé au critère ; le service recherche l'évaluateur par evaluator_name." }
references:
  - title: Custom evaluators (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/custom-evaluators
