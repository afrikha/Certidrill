status: draft
stem:
  en: You configure the Response Completeness evaluator and map ground_truth to the context column.
  fr: Vous configurez l'évaluateur Response Completeness et mappez ground_truth à la colonne context.
body:
  solution:
    en: |
      You configure the built-in **Response Completeness** evaluator with a judge model deployment. You map its `response` input to the `response` column, and its `ground_truth` input to the `context` column.
    fr: |
      Vous configurez l'évaluateur intégré **Response Completeness** avec un déploiement de modèle juge. Vous mappez son entrée `response` à la colonne `response`, et son entrée `ground_truth` à la colonne `context`.
answer: { value: false }
explanation:
  correct:
    en: Response Completeness measures the recall aspect, whether the response covers the critical information of the ground truth. With the chunks mapped as ground truth, it penalizes answers that omit policy content, but an answer that adds a rule found in no chunk isn't penalized for it; that precision aspect is what Groundedness measures.
    fr: "Response Completeness mesure l'aspect rappel, c'est-à-dire si la réponse couvre les informations essentielles de la vérité terrain. Avec les blocs mappés comme vérité terrain, il pénalise les réponses qui omettent du contenu de politique, mais une réponse qui ajoute une règle absente de tous les blocs n'est pas pénalisée pour cela ; cet aspect précision est celui que mesure Groundedness."
references:
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI - Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
