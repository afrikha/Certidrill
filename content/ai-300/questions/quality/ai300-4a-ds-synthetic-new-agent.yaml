id: ai300-4a-ds-synthetic-new-agent
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Microsoft Foundry project named **proj-support** that contains a prompt agent named **returns-agent**. The agent has not been released to users yet, so no production traces exist.

    You need to create a test dataset of single-turn questions with expected answers that reflects the instructions of returns-agent, so that you can evaluate the agent before launch. The solution must minimize development effort.

    What should you do?
  fr: |
    Contoso dispose d'un projet Microsoft Foundry nommé **proj-support** qui contient un agent d'invite nommé **returns-agent**. L'agent n'a pas encore été mis à la disposition des utilisateurs : aucune trace de production n'existe.

    Vous devez créer un jeu de données de test de questions à un seul tour avec des réponses attendues, qui reflète les instructions de returns-agent, afin d'évaluer l'agent avant son lancement. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "On the Data Generation tab, generate a synthetic dataset with the Simple QnA (single-turn) task type and returns-agent as the input.", fr: "Dans l'onglet Data Generation, générer un jeu de données synthétique avec le type de tâche Simple QnA (single-turn) et returns-agent comme entrée." }
    - id: b
      text: { en: "On the Data Generation tab, create a dataset from traces of returns-agent over the last seven days.", fr: "Dans l'onglet Data Generation, créer un jeu de données à partir des traces de returns-agent des sept derniers jours." }
    - id: c
      text: { en: "Run an AI Red Teaming Agent scan against returns-agent and save the attack prompts as a dataset.", fr: "Exécuter une analyse AI Red Teaming Agent sur returns-agent et enregistrer les invites d'attaque comme jeu de données." }
    - id: d
      text: { en: "Configure continuous evaluation of returns-agent on a sample of its traffic.", fr: "Configurer l'évaluation continue de returns-agent sur un échantillon de son trafic." }
answer: { optionId: a }
explanation:
  correct:
    en: Synthetic generation builds an evaluation dataset from an agent definition, a prompt or a reference file, which suits agents that are not launched yet. The Simple QnA (single-turn) task type produces `query` and `ground_truth` fields, and the job stores the result as a versioned dataset in the project, with no code to write.
    fr: La génération synthétique crée un jeu de données d'évaluation à partir d'une définition d'agent, d'une invite ou d'un fichier de référence, ce qui convient à un agent pas encore lancé. Le type de tâche Simple QnA (single-turn) produit les champs `query` et `ground_truth`, et le travail enregistre le résultat comme jeu de données versionné dans le projet, sans code à écrire.
  options:
    b:
      en: A trace-based dataset needs traces emitted by real traffic; returns-agent has no production traces yet.
      fr: Un jeu de données basé sur les traces nécessite des traces produites par du trafic réel ; returns-agent n'en a encore aucune.
    c:
      en: Red teaming probes the agent with adversarial attacks to find safety risks; it does not produce questions with expected answers for quality evaluation.
      fr: Le red teaming sonde l'agent avec des attaques adverses pour trouver des risques de sécurité ; il ne produit pas de questions avec des réponses attendues pour l'évaluation de la qualité.
    d:
      en: Continuous evaluation scores production traffic at a sampled rate; there is no traffic before launch, and it does not create a test dataset.
      fr: L'évaluation continue note le trafic de production à un taux d'échantillonnage donné ; il n'y a aucun trafic avant le lancement, et elle ne crée pas de jeu de données de test.
references:
  - title: Generate a synthetic evaluation dataset (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/evaluation-dataset-synthetic
