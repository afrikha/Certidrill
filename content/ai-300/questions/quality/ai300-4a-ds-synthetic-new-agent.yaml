id: ai300-4a-ds-synthetic-new-agent
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Microsoft Foundry project named **proj-support** that contains a prompt agent named **returns-agent**. Support engineers exported 200 multi-turn conversations to a JSONL file. Each row contains a `messages` array that ends with the answer that a human agent gave, with the `assistant` role.

    You need to evaluate how returns-agent answers the last user turn of each conversation, by running an evaluation that uses returns-agent as its target.

    What should you do to the dataset?
  fr: |
    Contoso dispose d'un projet Microsoft Foundry nommé **proj-support** qui contient un agent d'invite nommé **returns-agent**. Les ingénieurs du support ont exporté 200 conversations multitours dans un fichier JSONL. Chaque ligne contient un tableau `messages` qui se termine par la réponse donnée par un agent humain, avec le rôle `assistant`.

    Vous devez évaluer la façon dont returns-agent répond au dernier tour de l'utilisateur de chaque conversation, en exécutant une évaluation qui utilise returns-agent comme cible.

    Que devez-vous faire au jeu de données ?
body:
  options:
    - id: a
      text: { en: "Remove the final assistant message of each row, so that each messages array ends with a user message.", fr: "Supprimer le dernier message assistant de chaque ligne, afin que chaque tableau messages se termine par un message user." }
    - id: b
      text: { en: "Rename the messages column to query, so that the target receives the whole conversation as its input.", fr: "Renommer la colonne messages en query, afin que la cible reçoive toute la conversation comme entrée." }
    - id: c
      text: { en: "Add a response column that copies the final assistant message of each row, so that evaluators can read it.", fr: "Ajouter une colonne response qui copie le dernier message assistant de chaque ligne, afin que les évaluateurs puissent la lire." }
    - id: d
      text: { en: "Convert the file to CSV with one row for each message, so that each turn is evaluated separately.", fr: "Convertir le fichier en CSV avec une ligne par message, afin que chaque tour soit évalué séparément." }
answer: { optionId: a }
explanation:
  correct:
    en: For a model or agent target, the `messages` array must end with a `user` message. Foundry sends the messages to the target, the target generates the next assistant response, and the evaluators score that response. A stored assistant answer at the end of the array is the format for evaluating stored interactions, not a target.
    fr: Pour une cible de type modèle ou agent, le tableau `messages` doit se terminer par un message `user`. Foundry envoie les messages à la cible, la cible génère la réponse suivante de l'assistant, et les évaluateurs notent cette réponse. Une réponse assistant stockée à la fin du tableau est le format d'évaluation d'interactions stockées, pas d'une cible.
  options:
    b:
      en: Each test case uses one interaction format, either `messages` or separate `query` and `response` columns; renaming the column doesn't remove the stored answer from the end of the conversation.
      fr: Chaque cas de test utilise un seul format d'interaction, soit `messages`, soit les colonnes séparées `query` et `response` ; renommer la colonne ne retire pas la réponse stockée de la fin de la conversation.
    c:
      en: A `response` column is for evaluating a stored response; it isn't required for a target run and would score the human agent's answer, not returns-agent.
      fr: Une colonne `response` sert à évaluer une réponse stockée ; elle n'est pas requise pour une exécution sur une cible et noterait la réponse de l'agent humain, pas celle de returns-agent.
    d:
      en: Each row is one test case; splitting a conversation into one row per message loses the earlier turns that the target needs as context.
      fr: Chaque ligne est un cas de test ; découper une conversation en une ligne par message fait perdre les tours précédents dont la cible a besoin comme contexte.
references:
  - title: Evaluation dataset schema in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/evaluation-dataset-schema
