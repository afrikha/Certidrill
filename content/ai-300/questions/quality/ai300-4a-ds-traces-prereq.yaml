id: ai300-4a-ds-traces-prereq
objective: "4.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a Foundry project named **proj-claims** that uses Microsoft-managed storage. A deployed agent sends its traces to an Application Insights resource named **appi-claims** that is connected to the project. appi-claims belongs to an Azure Monitor Private Link Scope, and public network access for queries is disabled. The project's managed identity has no role assignments on appi-claims.

    You have the Foundry User role on the project. You need to create an evaluation dataset from the agent's traces of the last seven days.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un projet Foundry nommé **proj-claims** qui utilise un stockage managé par Microsoft. Un agent déployé envoie ses traces à une ressource Application Insights nommée **appi-claims**, connectée au projet. appi-claims appartient à une étendue de liaison privée Azure Monitor (AMPLS), et l'accès réseau public pour les requêtes est désactivé. L'identité managée du projet n'a aucune attribution de rôle sur appi-claims.

    Vous disposez du rôle Foundry User sur le projet. Vous devez créer un jeu de données d'évaluation à partir des traces de l'agent des sept derniers jours.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign the Reader role to the project's managed identity on appi-claims.", fr: "Attribuer le rôle Reader à l'identité managée du projet sur appi-claims." } }
    - { id: b, text: { en: "Enable public network access for queries on appi-claims.", fr: "Activer l'accès réseau public pour les requêtes sur appi-claims." } }
    - { id: c, text: { en: "Assign the Log Analytics Reader role to your user account on appi-claims.", fr: "Attribuer le rôle Log Analytics Reader à votre compte d'utilisateur sur appi-claims." } }
    - { id: d, text: { en: "Assign the Storage Blob Data Contributor role to the project's managed identity on a new storage account.", fr: "Attribuer le rôle Storage Blob Data Contributor à l'identité managée du projet sur un nouveau compte de stockage." } }
    - { id: e, text: { en: "Create a private endpoint for the Foundry resource in the virtual network linked to the private link scope.", fr: "Créer un point de terminaison privé pour la ressource Foundry dans le réseau virtuel lié à l'étendue de liaison privée." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: The trace-to-dataset job reads Application Insights with the project's managed identity, which needs the Reader role on the connected resource (plus Privileged Monitoring Data Reader for protected tables). Learn also states that the connected Application Insights resource must allow public network access for queries; behind an Azure Monitor Private Link Scope, you must enable public network query access.
    fr: Le travail qui convertit les traces en jeu de données lit Application Insights avec l'identité managée du projet, qui a besoin du rôle Reader sur la ressource connectée (plus Privileged Monitoring Data Reader pour les tables protégées). Learn indique aussi que la ressource Application Insights connectée doit autoriser l'accès réseau public pour les requêtes ; derrière une étendue de liaison privée Azure Monitor, vous devez activer l'accès public pour les requêtes.
  options:
    c:
      en: Log Analytics Reader lets your account view traces; the generation job runs with the project's managed identity, which still lacks access.
      fr: Log Analytics Reader permet à votre compte de consulter les traces ; le travail de génération s'exécute avec l'identité managée du projet, qui reste sans accès.
    d:
      en: The project uses Microsoft-managed storage; a storage role only matters when you bring your own storage account with Microsoft Entra ID authentication.
      fr: Le projet utilise un stockage managé par Microsoft ; un rôle de stockage n'importe que si vous utilisez votre propre compte de stockage avec l'authentification Microsoft Entra ID.
    e:
      en: Private connectivity does not remove the documented limitation; the trace queries require public network query access on Application Insights.
      fr: La connectivité privée ne lève pas la limitation documentée ; les requêtes sur les traces nécessitent l'accès réseau public pour les requêtes sur Application Insights.
references:
  - title: Convert agent traces into evaluation datasets
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/traces-to-dataset
  - title: Set up permissions for Microsoft Foundry evaluation workflows
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/evaluation-permissions
