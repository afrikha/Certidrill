id: ai300-cs4b-tracing
objective: "4.2.4"
type: yesno_statements
caseStudy: ai300-cs4b-margies-travel
difficulty: 2
status: draft
stem:
  en: |
    You are configuring tracing for app-margie-assist to meet the observability requirements. The application gets the connection string of appi-margie from the trip-assistant project and passes it to `configure_azure_monitor()`. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez le traçage d'app-margie-assist pour respecter les exigences d'observabilité. L'application obtient la chaîne de connexion d'appi-margie à partir du projet trip-assistant et la transmet à `configure_azure_monitor()`. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To query the traces in the Foundry portal, each team member needs the Log Analytics Reader role on appi-margie.
        fr: Pour interroger les traces dans le portail Foundry, chaque membre de l'équipe a besoin du rôle Log Analytics Reader sur appi-margie.
    - id: s2
      text:
        en: To meet the content requirement, you must set OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT to true in the production application settings.
        fr: Pour respecter l'exigence relative au contenu, vous devez régler OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT sur true dans les paramètres de l'application de production.
    - id: s3
      text:
        en: The retention period of the trace data follows the configuration of appi-margie and its Log Analytics workspace.
        fr: La durée de conservation des données de trace suit la configuration d'appi-margie et de son espace de travail Log Analytics.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Traces are stored in the connected Application Insights resource, and querying them requires Log Analytics Reader on that resource (plus Privileged Monitoring Data Reader if the tables are protected). OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT defaults to false; setting it to true records message contents, which the requirements forbid in production. Retention and billing of the trace data follow the Application Insights and Log Analytics configuration.
    fr: Les traces sont stockées dans la ressource Application Insights connectée, et leur interrogation exige le rôle Log Analytics Reader sur cette ressource (plus Privileged Monitoring Data Reader si les tables sont protégées). OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT vaut false par défaut ; le régler sur true enregistre le contenu des messages, ce que les exigences interdisent en production. La conservation et la facturation des données de trace suivent la configuration d'Application Insights et de Log Analytics.
references:
  - title: Set up tracing in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup
  - title: Add client-side tracing to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-client-side
