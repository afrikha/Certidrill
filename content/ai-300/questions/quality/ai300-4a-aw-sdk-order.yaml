id: ai300-4a-aw-sdk-order
objective: "4.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a local JSONL file whose rows contain `query`, `response` and `ground_truth` fields. You already created `project_client` and `openai_client`, and defined `data_source_config` and `testing_criteria` with built-in evaluators.

    You need to run a cloud evaluation of the file with the Foundry SDK and print the row-level results.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders dispose d'un fichier JSONL local dont les lignes contiennent les champs `query`, `response` et `ground_truth`. Vous avez déjà créé `project_client` et `openai_client`, et défini `data_source_config` et `testing_criteria` avec des évaluateurs intégrés.

    Vous devez exécuter une évaluation cloud du fichier avec le SDK Foundry et afficher les résultats par ligne.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: upload, text: { en: "Upload the file by calling project_client.datasets.upload_file.", fr: "Charger le fichier en appelant project_client.datasets.upload_file." } }
    - { id: create, text: { en: "Create the evaluation by calling openai_client.evals.create with data_source_config and testing_criteria.", fr: "Créer l'évaluation en appelant openai_client.evals.create avec data_source_config et testing_criteria." } }
    - { id: run, text: { en: "Start a run by calling openai_client.evals.runs.create with a jsonl data source that references the dataset ID.", fr: "Démarrer une exécution en appelant openai_client.evals.runs.create avec une source de données jsonl qui référence l'ID du jeu de données." } }
    - { id: poll, text: { en: "Call openai_client.evals.runs.retrieve until the status is completed, failed or canceled.", fr: "Appeler openai_client.evals.runs.retrieve jusqu'à ce que l'état soit completed, failed ou canceled." } }
    - { id: list, text: { en: "Call openai_client.evals.runs.output_items.list and print the items.", fr: "Appeler openai_client.evals.runs.output_items.list et afficher les éléments." } }
    - { id: cancel, text: { en: "Call openai_client.evals.runs.cancel to finalize the results.", fr: "Appeler openai_client.evals.runs.cancel pour finaliser les résultats." } }
    - { id: register, text: { en: "Register each built-in evaluator by calling project_client.beta.evaluators.create_version.", fr: "Inscrire chaque évaluateur intégré en appelant project_client.beta.evaluators.create_version." } }
answer:
  sequence: [ upload, create, run, poll, list ]
explanation:
  correct:
    en: The dataset is uploaded first so that the run can reference its ID. The evaluation object holds the data shape and the testing criteria, and each run binds it to a data source. Runs are asynchronous, so you poll the status, and then list the output items (or open the run's report URL) to read the scored rows.
    fr: "Le jeu de données est chargé en premier pour que l'exécution puisse référencer son ID. L'objet d'évaluation contient la forme des données et les critères de test, et chaque exécution l'associe à une source de données. Les exécutions sont asynchrones : vous interrogez l'état, puis listez les éléments de sortie (ou ouvrez l'URL du rapport de l'exécution) pour lire les lignes notées."
  options:
    cancel: { en: "Cancelling stops a run that you no longer need; results are available once the run completes.", fr: "L'annulation arrête une exécution devenue inutile ; les résultats sont disponibles dès que l'exécution est terminée." }
    register: { en: "Built-in evaluators are referenced directly by their builtin.* names; only custom evaluators are registered.", fr: "Les évaluateurs intégrés sont référencés directement par leur nom builtin.* ; seuls les évaluateurs personnalisés sont inscrits." }
references:
  - title: Evaluate datasets in the cloud
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/cloud-evaluation-datasets
  - title: Get evaluation results with Microsoft Foundry SDK
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/cloud-evaluation-results
