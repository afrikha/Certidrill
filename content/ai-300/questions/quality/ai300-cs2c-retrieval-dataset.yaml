id: ai300-cs2c-retrieval-dataset
objective: "4.1.1"
type: multi
caseStudy: ai300-cs2c-adventure-works
difficulty: 3
status: draft
stem:
  en: |
    You plan to use the Document Retrieval evaluator of Microsoft Foundry to meet evaluation requirement 3. You need to build the test dataset and its data mapping.

    Which two inputs must each row of the dataset provide to the evaluator? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser l'évaluateur Document Retrieval de Microsoft Foundry pour respecter l'exigence d'évaluation 3. Vous devez créer le jeu de données de test et son mappage de données.

    Quelles sont les deux entrées que chaque ligne du jeu de données doit fournir à l'évaluateur ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "`retrieval_ground_truth`: the relevance labels assigned by the product experts to the chunks for the question"
        fr: "`retrieval_ground_truth` : les étiquettes de pertinence attribuées aux blocs par les experts produit pour la question"
    - id: b
      text:
        en: "`ground_truth`: a reference answer to the question written by a product expert"
        fr: "`ground_truth` : une réponse de référence à la question rédigée par un expert produit"
    - id: c
      text:
        en: "`retrieved_documents`: the IDs of the chunks returned by srch-aw for the question, with their search scores"
        fr: "`retrieved_documents` : les ID des blocs renvoyés par srch-aw pour la question, avec leurs scores de recherche"
    - id: d
      text:
        en: "`response`: the answer that gpt-support generated from the retrieved chunks"
        fr: "`response` : la réponse que gpt-support a générée à partir des blocs récupérés"
    - id: e
      text:
        en: "`context`: the concatenated text of the five chunks sent to gpt-support"
        fr: "`context` : le texte concaténé des cinq blocs envoyés à gpt-support"
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Document Retrieval compares what the search system returned (`retrieved_documents`, with document IDs and relevance scores) with human-labeled relevance scores per document (`retrieval_ground_truth`, also called qrels). From both, it computes NDCG, XDCG, fidelity and holes; it does not need the generated answer. Its default label range is 0 to 4, which matches the experts' scale."
    fr: "Document Retrieval compare ce que le système de recherche a renvoyé (`retrieved_documents`, avec les ID de documents et les scores de pertinence) aux scores de pertinence attribués par des humains à chaque document (`retrieval_ground_truth`, aussi appelés qrels). À partir des deux, il calcule NDCG, XDCG, la fidélité et les trous (holes) ; il n'a pas besoin de la réponse générée. Sa plage d'étiquettes par défaut va de 0 à 4, ce qui correspond à l'échelle des experts."
  options:
    b: { en: "A reference answer is the input of generation evaluators such as Response Completeness, not of Document Retrieval.", fr: "Une réponse de référence est l'entrée d'évaluateurs de génération comme Response Completeness, pas de Document Retrieval." }
    d: { en: "The generated response is evaluated by Groundedness or Relevance; Document Retrieval only measures the search results.", fr: "La réponse générée est évaluée par Groundedness ou Relevance ; Document Retrieval ne mesure que les résultats de recherche." }
    e: { en: "Context text is the input of the Retrieval evaluator, an AI-assisted 1-5 score that does not compute NDCG or XDCG.", fr: "Le texte du contexte est l'entrée de l'évaluateur Retrieval, un score de 1 à 5 assisté par IA qui ne calcule ni NDCG ni XDCG." }
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
