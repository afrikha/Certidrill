id: ai300-cs3b-token-metrics
objective: "4.2.3"
type: dropdown
caseStudy: ai300-cs3b-lucerne-publishing
difficulty: 1
status: draft
stem:
  en: |
    You are building the chart for the finance team in Metrics explorer, with fdy-lucerne as the scope and a time range of one month.

    How should you configure the chart to meet operations requirement 8? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez le graphique de l'équipe financière dans Metrics explorer, avec fdy-lucerne comme étendue et une plage de temps d'un mois.

    Comment devez-vous configurer le graphique pour respecter l'exigence 8 d'exploitation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Metric: [[metric]]
      Aggregation: [[agg]]
      Apply splitting by: [[split]]
    fr: |
      Métrique : [[metric]]
      Agrégation : [[agg]]
      Fractionnement par : [[split]]
  slots:
    - id: metric
      options:
        - { id: prompt, text: Processed Prompt Tokens }
        - { id: generated, text: Generated Completion Tokens }
        - { id: inference, text: Processed Inference Tokens }
        - { id: requests, text: Azure OpenAI Requests }
    - id: agg
      options:
        - { id: sum, text: Sum }
        - { id: avg, text: Avg }
        - { id: max, text: Max }
    - id: split
      options:
        - { id: region, text: Region }
        - { id: apiname, text: ApiName }
        - { id: deployment, text: ModelDeploymentName }
answer:
  values: { metric: generated, agg: sum, split: deployment }
explanation:
  correct:
    en: |
      Generated Completion Tokens (`GeneratedTokens`) counts the tokens that the models return in completions, and its Sum aggregation gives the total for the month. Splitting by the ModelDeploymentName dimension draws one series per deployment of fdy-lucerne.
    fr: |
      Generated Completion Tokens (`GeneratedTokens`) compte les jetons que les modèles renvoient dans les complétions, et l'agrégation Sum donne le total du mois. Le fractionnement par la dimension ModelDeploymentName trace une série par déploiement de fdy-lucerne.
  options:
    prompt:
      en: |
        Processed Prompt Tokens counts input tokens, not the tokens generated in completions.
      fr: |
        Processed Prompt Tokens compte les jetons d'entrée, pas les jetons générés dans les complétions.
    inference:
      en: |
        Processed Inference Tokens counts prompt and completion tokens together.
      fr: |
        Processed Inference Tokens compte ensemble les jetons d'invite et de complétion.
    requests:
      en: |
        Azure OpenAI Requests counts calls, not tokens.
      fr: |
        Azure OpenAI Requests compte des appels, pas des jetons.
references:
  - title: Monitoring data reference for Azure OpenAI (classic)
    url: https://learn.microsoft.com/en-us/azure/foundry-classic/openai/monitor-openai-reference
