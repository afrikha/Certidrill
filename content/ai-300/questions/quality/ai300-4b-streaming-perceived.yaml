id: ai300-4b-streaming-perceived
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a chat application that calls an Azure OpenAI deployment in Microsoft Foundry. Responses average 800 tokens. Calls are non-streaming.

    Users complain that the interface shows nothing for several seconds and then displays the whole answer at once. The total generation time is acceptable, and the responses must keep their current length.

    What should you do?
  fr: |
    Northwind Traders dispose d'une application de conversation qui appelle un déploiement Azure OpenAI dans Microsoft Foundry. Les réponses comptent en moyenne 800 jetons. Les appels sont sans streaming.

    Les utilisateurs se plaignent que l'interface n'affiche rien pendant plusieurs secondes, puis affiche toute la réponse d'un coup. Le temps total de génération est acceptable, et les réponses doivent conserver leur longueur actuelle.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set max_tokens to 200 in the requests.", fr: "Définir max_tokens sur 200 dans les requêtes." } }
    - { id: b, text: { en: "Send the requests to a Global Batch deployment.", fr: "Envoyer les requêtes vers un déploiement Global Batch." } }
    - { id: c, text: { en: "Set n to 2 in the requests.", fr: "Définir n sur 2 dans les requêtes." } }
    - { id: d, text: { en: "Set stream to true in the requests.", fr: "Définir stream sur true dans les requêtes." } }
answer: { optionId: d }
explanation:
  correct:
    en: Streaming does not shorten the total generation time, but it returns the first tokens as soon as they are generated. This improves the latency users perceive, which is why Microsoft recommends it for chatbots and conversational interfaces.
    fr: Le streaming ne raccourcit pas le temps total de génération, mais il renvoie les premiers jetons dès qu'ils sont générés. Il améliore ainsi la latence perçue par les utilisateurs ; c'est pourquoi Microsoft le recommande pour les chatbots et les interfaces conversationnelles.
  options:
    a: { en: "A lower max_tokens truncates the 800-token answers, which breaks the length requirement.", fr: "Une valeur max_tokens plus faible tronque les réponses de 800 jetons, ce qui ne respecte pas l'exigence de longueur." }
    b: { en: "Batch processing targets a 24-hour turnaround; it is not for interactive chat.", fr: "Le traitement par lots vise un délai de 24 heures ; il n'est pas destiné à une conversation interactive." }
    c: { en: "Several outputs per call increase latency.", fr: "Plusieurs sorties par appel augmentent la latence." }
references:
  - title: Azure OpenAI in Microsoft Foundry Models performance & latency
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/latency
