id: ai300-4a-aw-code-limits-yn
objective: "4.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware registers a code-based custom evaluator named **sku_format_checker** in a Foundry project by using `project_client.beta.evaluators.create_version`. Its `grade()` function checks that each response contains valid product SKUs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware inscrit un évaluateur personnalisé basé sur du code nommé **sku_format_checker** dans un projet Foundry à l'aide de `project_client.beta.evaluators.create_version`. Sa fonction `grade()` vérifie que chaque réponse contient des références produit (SKU) valides.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The grade() function can call an internal REST API to look up the product catalog while it scores an item.
        fr: La fonction grade() peut appeler une API REST interne pour consulter le catalogue de produits pendant qu'elle note un élément.
    - id: s2
      text:
        en: If grade() raises an exception for an item, that item receives a score of 0.0 and is marked as an error.
        fr: Si grade() lève une exception pour un élément, cet élément reçoit un score de 0,0 et est marqué comme erreur.
    - id: s3
      text:
        en: The init parameters of sku_format_checker must include deployment_name, even though grade() does not call a model.
        fr: Les paramètres d'initialisation de sku_format_checker doivent inclure deployment_name, même si grade() n'appelle pas de modèle.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Code-based evaluators run without network access, with limits such as 2 minutes per grading call and 2 GB of memory. When `grade()` raises an exception or times out, the item scores 0.0 and is marked as an error, so Learn recommends `try/except` with fallback scores. `deployment_name` and `pass_threshold` are required init parameters; the API requires the deployment even though no LLM is called.
    fr: "Les évaluateurs basés sur du code s'exécutent sans accès réseau, avec des limites comme 2 minutes par appel de notation et 2 Go de mémoire. Quand `grade()` lève une exception ou dépasse le délai, l'élément obtient 0,0 et est marqué comme erreur : Learn recommande `try/except` avec des scores de repli. `deployment_name` et `pass_threshold` sont des paramètres d'initialisation obligatoires ; l'API exige le déploiement même si aucun LLM n'est appelé."
references:
  - title: Custom evaluators (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/custom-evaluators
