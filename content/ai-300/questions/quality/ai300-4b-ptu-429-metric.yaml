id: ai300-4b-ptu-429-metric
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a Global Provisioned Throughput deployment named **gpt-ptu** in a Microsoft Foundry resource. During the daily peak hour, client applications receive HTTP 429 responses from gpt-ptu.

    Before you buy more PTUs, you need to confirm that the 429 responses occur because the deployment has used all its provisioned capacity.

    Which metric should you review?
  fr: |
    Woodgrove Bank dispose d'un déploiement Global Provisioned Throughput nommé **gpt-ptu** dans une ressource Microsoft Foundry. Pendant l'heure de pointe quotidienne, les applications clientes reçoivent des réponses HTTP 429 de gpt-ptu.

    Avant d'acheter des PTU supplémentaires, vous devez confirmer que les réponses 429 se produisent parce que le déploiement a utilisé toute sa capacité approvisionnée.

    Quelle métrique devez-vous examiner ?
body:
  options:
    - { id: a, text: Prompt Token Cache Match Rate }
    - { id: b, text: Azure OpenAI AvailabilityRate }
    - { id: c, text: Time Between Tokens }
    - { id: d, text: Provisioned-managed Utilization V2 }
answer: { optionId: d }
explanation:
  correct:
    en: Provisioned-managed Utilization V2 is the percentage of deployed PTUs consumed. When it reaches 100 %, the service throttles calls and returns HTTP 429, so this metric confirms whether the deployment is at capacity. The earlier V1 utilization metric is deprecated.
    fr: Provisioned-managed Utilization V2 est le pourcentage des PTU déployées qui est consommé. Lorsqu'elle atteint 100 %, le service limite les appels et renvoie HTTP 429 ; cette métrique confirme donc si le déploiement est à pleine capacité. L'ancienne métrique d'utilisation V1 est dépréciée.
  options:
    a: { en: "A higher cache match rate can lower PTU consumption, but the metric does not show whether capacity is exhausted.", fr: "Un taux de correspondance du cache plus élevé peut réduire la consommation de PTU, mais la métrique n'indique pas si la capacité est épuisée." }
    b: { en: "AvailabilityRate counts only server errors (HTTP 500 and above); 429 responses do not lower it.", fr: "AvailabilityRate ne compte que les erreurs de serveur (HTTP 500 et plus) ; les réponses 429 ne la font pas baisser." }
    c: { en: "Time Between Tokens shows generation speed of streaming calls; it can rise under load but does not measure consumed capacity.", fr: "Time Between Tokens indique la vitesse de génération des appels en streaming ; elle peut augmenter sous charge, mais ne mesure pas la capacité consommée." }
references:
  - title: Azure OpenAI monitoring data reference
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/monitor-openai-reference
