id: ai300-4a-rs-hosted-models
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso evaluates a chat application in a Foundry project. The evaluation already uses Coherence with a gpt-5-mini deployment as the judge model. You add the `builtin.violence`, `builtin.sexual`, `builtin.self_harm` and `builtin.hate_unfairness` evaluators.

    The team asks what scores the four new criteria and whether they consume the quota of the gpt-5-mini deployment.

    What should you tell the team?
  fr: |
    Contoso évalue une application de conversation dans un projet Foundry. L'évaluation utilise déjà Coherence avec un déploiement gpt-5-mini comme modèle juge. Vous ajoutez les évaluateurs `builtin.violence`, `builtin.sexual`, `builtin.self_harm` et `builtin.hate_unfairness`.

    L'équipe demande ce qui note les quatre nouveaux critères et s'ils consomment le quota du déploiement gpt-5-mini.

    Que devez-vous répondre à l'équipe ?
body:
  options:
    - id: a
      text: { en: "The gpt-5-mini deployment scores them as an LLM judge, in the same way as Coherence.", fr: "Le déploiement gpt-5-mini les note en tant que juge LLM, comme pour Coherence." }
    - id: b
      text: { en: "An Azure AI Content Safety resource that you must connect to the project scores them.", fr: "Une ressource Azure AI Content Safety que vous devez connecter au projet les note." }
    - id: c
      text: { en: "Hosted models of the Foundry Evaluation service score them, so no judge deployment is needed.", fr: "Des modèles hébergés par le service d'évaluation Foundry les notent : aucun déploiement juge n'est nécessaire." }
    - id: d
      text: { en: "The content filters of the evaluated deployment score them when it generates each response.", fr: "Les filtres de contenu du déploiement évalué les notent quand il génère chaque réponse." }
answer: { optionId: c }
explanation:
  correct:
    en: The risk and safety evaluators run on a set of hosted language models in the Foundry Evaluation service, each assessing one risk category. They need your Foundry project information but no `deployment_name` initialization parameter, unlike LLM-as-judge evaluators such as Coherence.
    fr: Les évaluateurs de risques et de sécurité s'exécutent sur un ensemble de modèles de langage hébergés dans le service d'évaluation Foundry, chacun évaluant une catégorie de risque. Ils ont besoin des informations de votre projet Foundry, mais pas du paramètre d'initialisation `deployment_name`, contrairement aux évaluateurs de type juge LLM comme Coherence.
  options:
    a:
      en: Only AI-assisted quality evaluators use your judge deployment; the safety evaluators use Microsoft's hosted safety models.
      fr: Seuls les évaluateurs de qualité assistés par IA utilisent votre déploiement juge ; les évaluateurs de sécurité utilisent les modèles de sécurité hébergés par Microsoft.
    b:
      en: No Content Safety resource has to be connected; the evaluation service hosts the models that score these categories.
      fr: Aucune ressource Content Safety ne doit être connectée ; le service d'évaluation héberge les modèles qui notent ces catégories.
    d:
      en: Content filters act at inference time on the deployment; evaluation scores are produced afterwards by the evaluation service.
      fr: Les filtres de contenu agissent au moment de l'inférence sur le déploiement ; les scores d'évaluation sont produits ensuite par le service d'évaluation.
references:
  - title: Risk and safety evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators
