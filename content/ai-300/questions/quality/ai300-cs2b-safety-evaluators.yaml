id: ai300-cs2b-safety-evaluators
objective: "4.1.3"
type: multi
caseStudy: ai300-cs2b-wide-world-importers
difficulty: 1
status: draft
stem:
  en: |
    You need to add risk and safety evaluators to the evaluation of DocDesk to meet quality and safety requirements 7 and 8.

    Which two evaluators should you add? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez ajouter des évaluateurs de risques et de sécurité à l'évaluation de DocDesk pour respecter les exigences de qualité et de sécurité 7 et 8.

    Quels sont les deux évaluateurs à ajouter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Hate and Unfairness }
    - { id: b, text: Indirect Attack }
    - { id: c, text: Protected Material }
    - { id: d, text: Ungrounded Attributes }
    - { id: e, text: Code Vulnerability }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Indirect Attack measures whether the response fell for a jailbreak injected into the context, such as instructions hidden in a document, also called a cross-domain prompt injected attack (XPIA). Ungrounded Attributes detects responses that infer personal attributes, such as the emotional state or a protected class, that the context does not support."
    fr: "Indirect Attack mesure si la réponse a cédé à une tentative de jailbreak injectée dans le contexte, comme des instructions masquées dans un document, aussi appelée attaque par injection d'invite inter-domaines (XPIA). Ungrounded Attributes détecte les réponses qui déduisent des attributs personnels, comme l'état émotionnel ou une catégorie protégée, que le contexte ne justifie pas."
  options:
    a: { en: "Hate and Unfairness detects hateful or discriminatory content; it does not check whether an inference is supported by the email.", fr: "Hate and Unfairness détecte les contenus haineux ou discriminatoires ; il ne vérifie pas si une déduction est justifiée par l'e-mail." }
    c: { en: "Protected Material detects copyrighted text, such as lyrics or articles, in the response.", fr: "Protected Material détecte les textes protégés par le droit d'auteur, comme des paroles ou des articles, dans la réponse." }
    e: { en: "Code Vulnerability detects security issues in generated code; DocDesk does not generate code.", fr: "Code Vulnerability détecte les problèmes de sécurité dans le code généré ; DocDesk ne génère pas de code." }
references:
  - title: Risk and safety evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators
