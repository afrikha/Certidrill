id: ai300-4b-spillover-monitor
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation has a Microsoft Foundry resource that contains a provisioned deployment named **ptu-main** and a standard deployment named **std-overflow** of the same model and version. Spillover from ptu-main to std-overflow is configured.

    You need a chart that shows how many requests were served by std-overflow because ptu-main could not serve them.

    What should you chart?
  fr: |
    Adatum Corporation dispose d'une ressource Microsoft Foundry qui contient un déploiement approvisionné nommé **ptu-main** et un déploiement standard nommé **std-overflow** du même modèle et de la même version. Le débordement (spillover) de ptu-main vers std-overflow est configuré.

    Vous avez besoin d'un graphique qui montre combien de requêtes ont été servies par std-overflow parce que ptu-main n'a pas pu les servir.

    Que devez-vous représenter ?
body:
  options:
    - { id: a, text: { en: "Azure OpenAI Requests for ptu-main, split by StatusCode, counting the 429 responses", fr: "Azure OpenAI Requests pour ptu-main, fractionnée par StatusCode, en comptant les réponses 429" } }
    - { id: b, text: { en: "Azure OpenAI Requests for std-overflow, split by IsSpillover", fr: "Azure OpenAI Requests pour std-overflow, fractionnée par IsSpillover" } }
    - { id: c, text: { en: "Provisioned-managed Utilization V2 for ptu-main, counting the minutes at 100 %", fr: "Provisioned-managed Utilization V2 pour ptu-main, en comptant les minutes à 100 %" } }
    - { id: d, text: { en: "Azure OpenAI AvailabilityRate for std-overflow, split by ModelDeploymentName", fr: "Azure OpenAI AvailabilityRate pour std-overflow, fractionnée par ModelDeploymentName" } }
answer: { optionId: b }
explanation:
  correct:
    en: Spilled-over requests appear on the standard deployment with IsSpillover = True, usually with a 200 status. Splitting Azure OpenAI Requests by IsSpillover on std-overflow separates them from the requests sent directly to that deployment.
    fr: Les requêtes débordées apparaissent sur le déploiement standard avec IsSpillover = True, en général avec un code 200. Fractionner Azure OpenAI Requests par IsSpillover sur std-overflow les distingue des requêtes envoyées directement à ce déploiement.
  options:
    a: { en: "Requests that spill over are not counted as 429 responses on the provisioned deployment.", fr: "Les requêtes débordées ne sont pas comptées comme des réponses 429 sur le déploiement approvisionné." }
    c: { en: "Utilization shows capacity pressure, not the number of requests served by the standard deployment.", fr: "L'utilisation montre la pression sur la capacité, pas le nombre de requêtes servies par le déploiement standard." }
    d: { en: "AvailabilityRate measures server errors; it does not distinguish spilled-over requests.", fr: "AvailabilityRate mesure les erreurs de serveur ; elle ne distingue pas les requêtes débordées." }
references:
  - title: Manage traffic with spillover for provisioned deployments
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/spillover-traffic-management
