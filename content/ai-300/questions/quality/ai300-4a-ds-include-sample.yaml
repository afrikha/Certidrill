id: ai300-4a-ds-include-sample
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Foundry project with a model deployment named **chat-gpt5mini**. You write the evaluation shown in the exhibit. Each row of the uploaded dataset contains only a `query` field, and the run uses the `azure_ai_target_completions` data source to send each query to chat-gpt5mini.

    The coherence criterion cannot resolve the generated response during the run.

    What should you change?
  fr: |
    Adatum dispose d'un projet Foundry avec un déploiement de modèle nommé **chat-gpt5mini**. Vous écrivez l'évaluation présentée dans la pièce. Chaque ligne du jeu de données chargé contient uniquement un champ `query`, et l'exécution utilise la source de données `azure_ai_target_completions` pour envoyer chaque requête à chat-gpt5mini.

    Le critère coherence ne parvient pas à résoudre la réponse générée pendant l'exécution.

    Que devez-vous modifier ?
exhibits:
  - id: code
    title: { en: "Evaluation definition", fr: "Définition de l'évaluation" }
    body: |
      ```python
      data_source_config = DataSourceConfigCustom(
          type="custom",
          item_schema={
              "type": "object",
              "properties": {"query": {"type": "string"}},
              "required": ["query"],
          },
      )

      testing_criteria = [
          TestingCriterionAzureAIEvaluator(
              type="azure_ai_evaluator",
              name="coherence",
              evaluator_name="builtin.coherence",
              initialization_parameters={"model": model_deployment_name},
              data_mapping={
                  "query": "{{item.query}}",
                  "response": "{{sample.output_text}}",
              },
          ),
      ]
      ```
body:
  options:
    - id: a
      text: { en: "Add include_sample_schema=True to the DataSourceConfigCustom object.", fr: "Ajouter include_sample_schema=True à l'objet DataSourceConfigCustom." }
    - id: b
      text: { en: "Add a response property to item_schema and mark it as required.", fr: "Ajouter une propriété response à item_schema et la marquer comme obligatoire." }
    - id: c
      text: { en: "Change the data source type of the run from azure_ai_target_completions to jsonl.", fr: "Remplacer le type de source de données de l'exécution azure_ai_target_completions par jsonl." }
    - id: d
      text: { en: "Replace {{sample.output_text}} with {{sample.output_items}} in the data mapping.", fr: "Remplacer {{sample.output_text}} par {{sample.output_items}} dans le mappage de données." }
answer: { optionId: a }
explanation:
  correct:
    en: "`item_schema` describes the rows of the dataset, and `include_sample_schema=True` makes the `{{sample.*}}` variables, such as the text generated by the target, available to `data_mapping`. Without it, the mapping can only reference `{{item.*}}` fields."
    fr: "`item_schema` décrit les lignes du jeu de données, et `include_sample_schema=True` rend les variables `{{sample.*}}`, comme le texte généré par la cible, disponibles pour `data_mapping`. Sans ce paramètre, le mappage ne peut référencer que les champs `{{item.*}}`."
  options:
    b:
      en: The rows contain no response; the response is generated by the target during the run, so declaring it as a required dataset field would make every row invalid.
      fr: "Les lignes ne contiennent pas de réponse ; elle est générée par la cible pendant l'exécution : la déclarer comme champ obligatoire du jeu de données rendrait chaque ligne non valide."
    c:
      en: A jsonl data source scores stored rows and calls no target, so no response would be generated at all.
      fr: "Une source de données jsonl note les lignes stockées sans appeler de cible : aucune réponse ne serait générée."
    d:
      en: output_items is the structured output of an agent target and also belongs to the sample namespace, which is not enabled; output_text is the right variable for a model's text response.
      fr: output_items est la sortie structurée d'une cible d'agent et appartient aussi à l'espace de noms sample, qui n'est pas activé ; output_text est la bonne variable pour la réponse texte d'un modèle.
references:
  - title: Evaluate model and agent targets with Microsoft Foundry SDK
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/cloud-evaluation-targets
