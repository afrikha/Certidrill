id: ai300-4b-console-exporter
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at Litware, Inc. debugs a Python application that calls Microsoft Foundry agents. Client-side GenAI tracing is enabled with `AIProjectInstrumentor`.

    During local debugging, the developer wants to see the spans printed in the terminal, without sending any telemetry to Azure.

    What should the developer add to the OpenTelemetry tracer provider?
  fr: |
    Un développeur de Litware, Inc. débogue une application Python qui appelle des agents Microsoft Foundry. Le traçage GenAI côté client est activé avec `AIProjectInstrumentor`.

    Pendant le débogage local, le développeur veut voir les étendues s'afficher dans le terminal, sans envoyer de télémétrie à Azure.

    Qu'est-ce que le développeur doit ajouter au fournisseur de traceurs OpenTelemetry ?
body:
  options:
    - { id: a, text: { en: "A SimpleSpanProcessor that wraps a ConsoleSpanExporter", fr: "Un SimpleSpanProcessor qui encapsule un ConsoleSpanExporter" } }
    - { id: b, text: { en: "The exporter created by configure_azure_monitor", fr: "L'exportateur créé par configure_azure_monitor" } }
    - { id: c, text: { en: "A span processor that sets the session.id attribute", fr: "Un processeur d'étendues qui définit l'attribut session.id" } }
    - { id: d, text: { en: "The @trace_function decorator on each function", fr: "Le décorateur @trace_function sur chaque fonction" } }
answer: { optionId: a }
explanation:
  correct:
    en: Spans are sent to a backend by an exporter. Adding a SimpleSpanProcessor with a ConsoleSpanExporter to the TracerProvider prints each span to the console, so no Application Insights resource is involved.
    fr: Les étendues sont envoyées à un back-end par un exportateur. Ajouter un SimpleSpanProcessor avec un ConsoleSpanExporter au TracerProvider affiche chaque étendue dans la console, sans aucune ressource Application Insights.
  options:
    b: { en: "configure_azure_monitor exports the spans to Application Insights, which sends telemetry to Azure.", fr: "configure_azure_monitor exporte les étendues vers Application Insights, ce qui envoie de la télémétrie vers Azure." }
    c: { en: "A custom attribute processor enriches spans but does not export them anywhere.", fr: "Un processeur d'attributs personnalisé enrichit les étendues, mais ne les exporte nulle part." }
    d: { en: "@trace_function creates spans for your functions; without an exporter they are not displayed.", fr: "@trace_function crée des étendues pour vos fonctions ; sans exportateur, elles ne sont pas affichées." }
references:
  - title: Add client-side tracing to Foundry agents (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-client-side
