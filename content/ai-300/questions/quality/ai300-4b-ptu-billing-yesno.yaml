id: ai300-4b-ptu-billing-yesno
objective: "4.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. reviews the costs of its Microsoft Foundry resource, which contains a Global Provisioned Throughput deployment of 100 PTUs and a Standard deployment of a fine-tuned model.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. examine les coûts de sa ressource Microsoft Foundry, qui contient un déploiement Global Provisioned Throughput de 100 PTU et un déploiement Standard d'un modèle affiné.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Purchasing an Azure Reservation for the 100 PTUs guarantees that capacity will be available if you later scale the deployment up.
        fr: L'achat d'une réservation Azure pour les 100 PTU garantit que de la capacité sera disponible si vous augmentez plus tard la taille du déploiement.
    - id: s2
      text:
        en: The provisioned deployment is billed for every hour it exists, including hours in which it serves no request.
        fr: Le déploiement approvisionné est facturé pour chaque heure d'existence, y compris les heures pendant lesquelles il ne sert aucune requête.
    - id: s3
      text:
        en: The fine-tuned model deployment incurs an hourly hosting charge even when it receives no inference calls.
        fr: Le déploiement du modèle affiné entraîne des frais d'hébergement horaires même lorsqu'il ne reçoit aucun appel d'inférence.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Provisioned deployments are billed per PTU per hour on deployed capacity, not on token consumption, and billing stops only when the deployment is deleted. A reservation gives a discounted rate for a one-month or one-year term, but it does not guarantee capacity, so you create deployments first. Fine-tuned models on a Standard or Global Standard deployment are charged an hourly hosting fee while deployed, even when unused (a Developer deployment has none), in addition to per-token inference.
    fr: |
      Les déploiements approvisionnés sont facturés par PTU et par heure sur la capacité déployée, pas sur la consommation de jetons, et la facturation ne s'arrête qu'à la suppression du déploiement. Une réservation accorde un tarif réduit pour une durée d'un mois ou d'un an, mais ne garantit pas de capacité : vous créez d'abord les déploiements. Les modèles affinés d'un déploiement Standard ou Global Standard sont facturés à l'heure pour l'hébergement tant qu'ils sont déployés, même inutilisés (un déploiement Developer n'en a pas), en plus de l'inférence facturée par jeton.
references:
  - title: Provisioned throughput billing and cost management
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-onboarding
  - title: Cost and FinOps in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/manage-costs
