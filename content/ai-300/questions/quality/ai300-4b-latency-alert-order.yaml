id: ai300-4b-latency-alert-order
objective: "4.2.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has a Microsoft Foundry resource named **fdy-tailspin** that hosts a provisioned streaming chat deployment named **chat-prod**.

    The operations team must receive an email when the average Time to Response of chat-prod exceeds 3,000 milliseconds over 15 minutes. You will use the Azure portal.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys dispose d'une ressource Microsoft Foundry nommée **fdy-tailspin** qui héberge un déploiement de conversation approvisionné en streaming nommé **chat-prod**.

    L'équipe d'exploitation doit recevoir un e-mail lorsque le Time to Response moyen de chat-prod dépasse 3 000 millisecondes sur 15 minutes. Vous utiliserez le portail Azure.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: scope, text: { en: "Create an alert rule and select fdy-tailspin as its scope.", fr: "Créer une règle d'alerte et sélectionner fdy-tailspin comme étendue." } }
    - { id: cond, text: { en: "Add a condition on the Time to Response signal, filtered on chat-prod, with the Average aggregation, a 15-minute window and a 3,000 ms threshold.", fr: "Ajouter une condition sur le signal Time to Response, filtrée sur chat-prod, avec l'agrégation Average, une fenêtre de 15 minutes et un seuil de 3 000 ms." } }
    - { id: act, text: { en: "In the actions of the rule, create an action group that sends an email to the operations team.", fr: "Dans les actions de la règle, créer un groupe d'actions qui envoie un e-mail à l'équipe d'exploitation." } }
    - { id: det, text: { en: "Enter the name and severity of the rule, and then create the rule.", fr: "Saisir le nom et la gravité de la règle, puis créer la règle." } }
    - { id: diag, text: { en: "Create a diagnostic setting that sends AllMetrics to a Log Analytics workspace.", fr: "Créer un paramètre de diagnostic qui envoie AllMetrics à un espace de travail Log Analytics." } }
    - { id: budget, text: { en: "Create a budget for the resource group with an alert condition.", fr: "Créer un budget pour le groupe de ressources avec une condition d'alerte." } }
answer:
  sequence: [ scope, cond, act, det ]
explanation:
  correct:
    en: Deployment metrics are collected automatically in the Azure Monitor metrics database and support near real-time metric alerts. A metric alert rule is built in order - scope, condition (signal, dimension filter, aggregation, window, threshold), actions (action group with the email notification), then details and creation.
    fr: Les métriques des déploiements sont collectées automatiquement dans la base de données de métriques d'Azure Monitor et prennent en charge les alertes de métrique en quasi temps réel. Une règle d'alerte de métrique se crée dans l'ordre - étendue, condition (signal, filtre de dimension, agrégation, fenêtre, seuil), actions (groupe d'actions avec la notification par e-mail), puis détails et création.
  options:
    diag: { en: "Metric alerts use platform metrics directly; exporting them to a workspace is not required.", fr: "Les alertes de métrique utilisent directement les métriques de plateforme ; il n'est pas nécessaire de les exporter vers un espace de travail." }
    budget: { en: "A budget alert reacts to costs, not to latency.", fr: "Une alerte budgétaire réagit aux coûts, pas à la latence." }
references:
  - title: Monitor model deployments in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/monitor-models
