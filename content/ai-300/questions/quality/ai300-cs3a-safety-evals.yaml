id: ai300-cs3a-safety-evals
objective: "4.1.3"
type: multi
caseStudy: ai300-cs3a-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You are configuring the testing criteria of an evaluation in proj-claimbrief to meet the ClaimBrief requirement. The data mapping sends **handler_question** as the query and **brief** as the response.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez les critères de test d'une évaluation dans proj-claimbrief pour respecter l'exigence relative à ClaimBrief. Le mappage de données envoie **handler_question** comme requête et **brief** comme réponse.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "The `builtin.violence` evaluator runs without a `deployment_name` initialization parameter."
        fr: "L'évaluateur `builtin.violence` s'exécute sans paramètre d'initialisation `deployment_name`."
    - id: b
      text:
        en: "With the default threshold, a brief that gets a violence severity score of 3 passes."
        fr: "Avec le seuil par défaut, un résumé qui obtient un score de gravité de violence de 3 réussit."
    - id: c
      text:
        en: "The `builtin.sensitive_data_leakage` evaluator can evaluate the briefs of the test dataset."
        fr: "L'évaluateur `builtin.sensitive_data_leakage` peut évaluer les résumés du jeu de données de test."
    - id: d
      text:
        en: "The `builtin.protected_material` evaluator returns a severity score from 0 to 7."
        fr: "L'évaluateur `builtin.protected_material` renvoie un score de gravité de 0 à 7."
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |
      Risk and safety evaluators run on Microsoft's hosted safety models through the Foundry evaluation service, so they take no `deployment_name` and need no new model deployment. The content safety evaluators, such as violence, score severity from 0 to 7, and a score at or below the threshold, which is 3 by default, passes.
    fr: |
      Les évaluateurs des risques et de la sécurité s'exécutent sur les modèles de sécurité hébergés par Microsoft via le service d'évaluation Foundry : ils ne prennent pas de `deployment_name` et ne nécessitent aucun nouveau déploiement de modèle. Les évaluateurs de sécurité du contenu, comme la violence, notent la gravité de 0 à 7, et un score inférieur ou égal au seuil, qui vaut 3 par défaut, réussit.
  options:
    c:
      en: |
        The sensitive data leakage evaluator is a preview evaluator for agent targets only; it isn't available for dataset or model evaluations.
      fr: |
        L'évaluateur de fuite de données sensibles est un évaluateur en préversion réservé aux cibles de type agent ; il n'est pas disponible pour les évaluations de jeux de données ou de modèles.
    d:
      en: |
        The protected material evaluator detects copyrighted text and returns pass or fail, not a severity score.
      fr: |
        L'évaluateur de contenu protégé détecte le texte protégé par le droit d'auteur et renvoie une réussite ou un échec, pas un score de gravité.
references:
  - title: Risk and Safety Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/risk-safety-evaluators
