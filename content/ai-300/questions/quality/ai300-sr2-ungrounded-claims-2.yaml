status: draft
stem:
  en: You configure the Groundedness evaluator.
  fr: Vous configurez l'évaluateur Groundedness.
body:
  solution:
    en: |
      You configure the built-in **Groundedness** evaluator with a judge model deployment, and you map its `query`, `context` and `response` inputs to the columns of the same names.
    fr: |
      Vous configurez l'évaluateur intégré **Groundedness** avec un déploiement de modèle juge, et vous mappez ses entrées `query`, `context` et `response` aux colonnes du même nom.
answer: { value: true }
explanation:
  correct:
    en: Groundedness measures whether the response stays aligned with the given context without fabricating content, which is the precision aspect of the response. It doesn't need reference answers, and it returns a score from 1 to 5 for each row, so low-scoring rows reveal the unsupported answers.
    fr: "Groundedness mesure si la réponse reste alignée sur le contexte fourni sans inventer de contenu, c'est-à-dire l'aspect précision de la réponse. Il n'a pas besoin de réponses de référence et renvoie une note de 1 à 5 pour chaque ligne : les lignes à note faible révèlent les réponses non étayées."
references:
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI - Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
