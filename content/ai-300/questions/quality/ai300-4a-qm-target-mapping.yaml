id: ai300-4a-qm-target-mapping
objective: "4.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware has a model deployment named **kb-chat** in a Foundry project. Each row of a test dataset contains a `query` and the `context` that kb-chat must answer from. The evaluation run sends each row to kb-chat as a model target, and the data source configuration includes the sample schema.

    You need the run to measure:

    - whether each generated response is supported by the row's context;
    - whether each generated response addresses the query.

    How should you complete the testing criteria? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un déploiement de modèle nommé **kb-chat** dans un projet Foundry. Chaque ligne d'un jeu de données de test contient une `query` et le `context` à partir duquel kb-chat doit répondre. L'exécution de l'évaluation envoie chaque ligne à kb-chat en tant que cible de modèle, et la configuration de la source de données inclut le schéma sample.

    L'exécution doit mesurer :

    - si chaque réponse générée est étayée par le contexte de la ligne ;
    - si chaque réponse générée traite la requête.

    Comment devez-vous compléter les critères de test ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    testing_criteria = [
        {
            "type": "azure_ai_evaluator",
            "name": "criterion_1",
            "evaluator_name": [[ev]],
            "initialization_parameters": {"deployment_name": judge_deployment},
            "data_mapping": {
                "context": "{{item.context}}",
                "response": [[resp]],
            },
        },
        {
            "type": "azure_ai_evaluator",
            "name": "criterion_2",
            "evaluator_name": "builtin.relevance",
            "initialization_parameters": {"deployment_name": judge_deployment},
            "data_mapping": {
                [[key]]: "{{item.query}}",
                "response": "{{sample.output_text}}",
            },
        },
    ]
  slots:
    - id: ev
      options:
        - { id: grd, text: "\"builtin.groundedness\"" }
        - { id: ret, text: "\"builtin.retrieval\"" }
        - { id: sim, text: "\"builtin.similarity\"" }
        - { id: coh, text: "\"builtin.coherence\"" }
    - id: resp
      options:
        - { id: out, text: "\"{{sample.output_text}}\"" }
        - { id: item, text: "\"{{item.response}}\"" }
        - { id: ctx, text: "\"{{item.context}}\"" }
    - id: key
      options:
        - { id: q, text: "\"query\"" }
        - { id: c, text: "\"context\"" }
        - { id: gt, text: "\"ground_truth\"" }
answer:
  values: { ev: grd, resp: out, key: q }
explanation:
  correct:
    en: "Groundedness checks whether the response is supported by the context, so it takes `context` and `response`. With a model target, the generated response is referenced by `{{sample.output_text}}`, while `{{item.*}}` references the dataset. Relevance compares the response with the user input, mapped to its `query` input."
    fr: "Groundedness vérifie si la réponse est étayée par le contexte : il prend `context` et `response`. Avec une cible de modèle, la réponse générée est référencée par `{{sample.output_text}}`, tandis que `{{item.*}}` référence le jeu de données. Relevance compare la réponse à l'entrée de l'utilisateur, mappée à son entrée `query`."
  options:
    ret: { en: "Retrieval scores the context against the query; it does not evaluate the response.", fr: "Retrieval note le contexte par rapport à la requête ; il n'évalue pas la réponse." }
    sim: { en: "Similarity compares the response with a ground truth, which the dataset does not contain.", fr: "Similarity compare la réponse à une vérité de terrain, absente du jeu de données." }
    item: { en: "The dataset has no response field; the response is generated by kb-chat during the run.", fr: "Le jeu de données n'a pas de champ response ; la réponse est générée par kb-chat pendant l'exécution." }
    c: { en: "Relevance does not take a context input; it judges the response against the query.", fr: "Relevance ne prend pas d'entrée context ; il juge la réponse par rapport à la requête." }
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
  - title: Evaluate model and agent targets with Microsoft Foundry SDK
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/cloud-evaluation-targets
