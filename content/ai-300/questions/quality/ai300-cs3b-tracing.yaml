id: ai300-cs3b-tracing
objective: "4.2.4"
type: yesno_statements
caseStudy: ai300-cs3b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    You plan to connect appi-lucerne for tracing in the Foundry portal and to grant access to the traces to meet operations requirement 9.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de connecter appi-lucerne pour le traçage dans le portail Foundry et d'accorder l'accès aux traces pour respecter l'exigence 9 d'exploitation.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          After you connect appi-lucerne, you must connect it again for each new project that you create in fdy-lucerne.
        fr: |
          Après avoir connecté appi-lucerne, vous devez le connecter de nouveau pour chaque nouveau projet que vous créez dans fdy-lucerne.
    - id: s2
      text:
        en: |
          The developers of Newsroom Assistant can connect appi-lucerne to fdy-lucerne with their current role assignments.
        fr: |
          Les développeurs de Newsroom Assistant peuvent connecter appi-lucerne à fdy-lucerne avec leurs attributions de rôles actuelles.
    - id: s3
      text:
        en: |
          The support engineers need the Privileged Monitoring Data Reader role in addition to the Log Analytics Reader role on appi-lucerne.
        fr: |
          Les ingénieurs du support ont besoin du rôle Privileged Monitoring Data Reader en plus du rôle Log Analytics Reader sur appi-lucerne.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      You associate an Application Insights resource once per Foundry resource, and its projects use it for traces. Connecting an existing Application Insights resource requires at least Contributor on the Foundry resource, and the developers have only Reader on fdy-lucerne. Viewing traces requires Log Analytics Reader on the Application Insights resource and, when the underlying Log Analytics tables are protected, Privileged Monitoring Data Reader as well.
    fr: |
      Vous associez une ressource Application Insights une seule fois par ressource Foundry, et ses projets l'utilisent pour les traces. La connexion d'une ressource Application Insights existante exige au moins le rôle Contributor sur la ressource Foundry, et les développeurs n'ont que Reader sur fdy-lucerne. La consultation des traces exige Log Analytics Reader sur la ressource Application Insights et, quand les tables Log Analytics sous-jacentes sont protégées, Privileged Monitoring Data Reader en plus.
references:
  - title: View Trace Results for AI Applications using OpenAI SDK (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/develop/trace-application
