id: ai300-4b-trace-investigate-order
objective: "4.2.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Foundry project that contains an agent named **orders-agent**. An Application Insights resource is connected to the project, and server-side tracing is active.

    A user reports that one answer of orders-agent took a very long time. The user gives you the Response ID of that answer. You need to find which step of the run caused the delay.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'un projet Microsoft Foundry qui contient un agent nommé **orders-agent**. Une ressource Application Insights est connectée au projet, et le traçage côté serveur est actif.

    Un utilisateur signale qu'une réponse d'orders-agent a pris beaucoup de temps. Il vous donne l'ID de réponse (Response ID) de cette réponse. Vous devez trouver quelle étape de l'exécution a causé le retard.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: open, text: { en: "In the Foundry portal, open the project, select **Agents**, and then select the **Traces** tab.", fr: "Dans le portail Foundry, ouvrir le projet, sélectionner **Agents**, puis l'onglet **Traces**." } }
    - { id: search, text: { en: "Search for the Response ID given by the user.", fr: "Rechercher l'ID de réponse fourni par l'utilisateur." } }
    - { id: step, text: { en: "Open the trace and step through its spans to compare their durations.", fr: "Ouvrir la trace et parcourir ses étendues pour comparer leurs durées." } }
    - { id: diag, text: { en: "Create a diagnostic setting that sends the Trace log category to a Log Analytics workspace.", fr: "Créer un paramètre de diagnostic qui envoie la catégorie de journal Trace à un espace de travail Log Analytics." } }
    - { id: console, text: { en: "Add a ConsoleSpanExporter to the application and run the request again.", fr: "Ajouter un ConsoleSpanExporter à l'application et relancer la requête." } }
    - { id: alert, text: { en: "Create a metric alert on the Time to Response metric.", fr: "Créer une alerte de métrique sur la métrique Time to Response." } }
answer:
  sequence: [ open, search, step ]
explanation:
  correct:
    en: Traces of the last 90 days can be searched, filtered and sorted on the Traces tab. Searching by Response ID or Trace ID opens the conversation, and stepping through the spans of the trace, each with its start and end time, shows which model call, tool call or retrieval step took the time.
    fr: Les traces des 90 derniers jours peuvent être recherchées, filtrées et triées sous l'onglet Traces. Une recherche par Response ID ou Trace ID ouvre la conversation, et le parcours des étendues de la trace, chacune avec son heure de début et de fin, montre quel appel de modèle, appel d'outil ou étape de récupération a pris le temps.
  options:
    diag: { en: "Traces of the agent are already in the connected Application Insights resource; a diagnostic setting is not needed and would not capture past runs.", fr: "Les traces de l'agent se trouvent déjà dans la ressource Application Insights connectée ; un paramètre de diagnostic n'est pas nécessaire et ne capturerait pas les exécutions passées." }
    console: { en: "A console exporter is for local debugging and would not show the run that the user reported.", fr: "Un exportateur console sert au débogage local et ne montrerait pas l'exécution signalée par l'utilisateur." }
    alert: { en: "An alert notifies future threshold breaches; it does not explain a specific run.", fr: "Une alerte signale les futurs dépassements de seuil ; elle n'explique pas une exécution précise." }
references:
  - title: Set up tracing in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup
