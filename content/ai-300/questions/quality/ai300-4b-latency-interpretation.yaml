id: ai300-4b-latency-interpretation
objective: "4.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has two Azure OpenAI deployments in Microsoft Foundry:

    | Deployment | Type | Calls | Observation over the last week |
    | --- | --- | --- | --- |
    | sum-docs | Standard | Non-streaming | Average Time to Last Byte +35 %; Generated Completion Tokens per call +35 % |
    | chat-live | Provisioned | Streaming | Average Time to Response +60 %; Processed Prompt Tokens per call unchanged |

    You need to interpret the metrics and choose the next diagnostic step.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose de deux déploiements Azure OpenAI dans Microsoft Foundry :

    | Déploiement | Type | Appels | Observation sur la dernière semaine |
    | --- | --- | --- | --- |
    | sum-docs | Standard | Sans streaming | Time to Last Byte moyen +35 % ; Generated Completion Tokens par appel +35 % |
    | chat-live | Approvisionné | Streaming | Time to Response moyen +60 % ; Processed Prompt Tokens par appel inchangé |

    Vous devez interpréter les métriques et choisir l'étape de diagnostic suivante.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      For sum-docs, the latency increase [[c1]].

      For chat-live, you should first check [[c2]].
    fr: |
      Pour sum-docs, la hausse de latence [[c1]].

      Pour chat-live, vous devez d'abord vérifier [[c2]].
  slots:
    - id: c1
      options:
        - { id: tokens, text: { en: "is explained by the longer responses and does not indicate a performance problem", fr: "s'explique par des réponses plus longues et n'indique pas de problème de performances" } }
        - { id: throttle, text: { en: "shows that the deployment is throttled and needs more quota", fr: "montre que le déploiement est limité et a besoin de plus de quota" } }
        - { id: filter, text: { en: "shows that content filtering became slower", fr: "montre que le filtrage de contenu est devenu plus lent" } }
    - id: c2
      options:
        - { id: gen, text: { en: "the Generated Completion Tokens metric", fr: "la métrique Generated Completion Tokens" } }
        - { id: util, text: { en: "the Provisioned-managed Utilization V2 metric and the request concurrency", fr: "la métrique Provisioned-managed Utilization V2 et la simultanéité des requêtes" } }
        - { id: avail, text: { en: "the Azure OpenAI AvailabilityRate metric", fr: "la métrique Azure OpenAI AvailabilityRate" } }
        - { id: norm, text: { en: "the Normalized Time to First Byte metric", fr: "la métrique Normalized Time to First Byte" } }
answer:
  values: { c1: tokens, c2: util }
explanation:
  correct:
    en: "End-to-end latency follows TTLT = TTFT + (TBT x tokens generated), so when Time to Last Byte and generated tokens rise together, the change is expected. Time to Response (first token) grows with prompt size; when it rises while prompt size stays flat, Microsoft recommends checking utilization and concurrency, which for a provisioned deployment means Provisioned-managed Utilization V2."
    fr: "La latence de bout en bout suit la formule TTLT = TTFT + (TBT x jetons générés) : lorsque Time to Last Byte et le nombre de jetons générés augmentent ensemble, la variation est attendue. Time to Response (premier jeton) augmente avec la taille de l'invite ; lorsqu'elle augmente alors que la taille de l'invite reste stable, Microsoft recommande de vérifier l'utilisation et la simultanéité, c'est-à-dire, pour un déploiement approvisionné, Provisioned-managed Utilization V2."
  options:
    throttle: { en: "Throttling would raise latency without a matching rise in generated tokens; here the tokens explain the change.", fr: "Une limitation augmenterait la latence sans hausse correspondante des jetons générés ; ici, les jetons expliquent la variation." }
    filter: { en: "Nothing in the metrics points to content filtering; the token growth alone explains the increase.", fr: "Rien dans les métriques n'indique le filtrage de contenu ; la croissance des jetons suffit à expliquer la hausse." }
    gen: { en: "Generated tokens affect the time to the last token, not the time to the first token measured by Time to Response.", fr: "Les jetons générés influent sur le temps jusqu'au dernier jeton, pas sur le temps jusqu'au premier jeton mesuré par Time to Response." }
    avail: { en: "AvailabilityRate counts server errors; it does not explain slower first tokens.", fr: "AvailabilityRate compte les erreurs de serveur ; elle n'explique pas des premiers jetons plus lents." }
    norm: { en: "Normalized Time to First Byte compares efficiency across prompt sizes; with a flat prompt size it adds no diagnostic information.", fr: "Normalized Time to First Byte compare l'efficacité entre tailles d'invite ; avec une taille d'invite stable, elle n'apporte aucune information de diagnostic." }
references:
  - title: Azure OpenAI in Microsoft Foundry Models performance & latency
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/latency
