id: ai300-4b-monitoring-yesno
objective: "4.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a Microsoft Foundry project that contains several agents. An Application Insights resource named **appi-adatum** is connected to the project, and a continuous evaluation rule is enabled for one of the agents with the default settings.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un projet Microsoft Foundry qui contient plusieurs agents. Une ressource Application Insights nommée **appi-adatum** est connectée au projet, et une règle d'évaluation continue est activée pour l'un des agents avec les paramètres par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The monitoring data displayed on the Monitor tab of an agent is stored in appi-adatum, and its retention follows the configuration of appi-adatum.
        fr: Les données de surveillance affichées sous l'onglet Monitor d'un agent sont stockées dans appi-adatum, et leur rétention suit la configuration d'appi-adatum.
    - id: s2
      text:
        en: The continuous evaluation rule evaluates every response of the agent, whatever the hourly traffic volume.
        fr: La règle d'évaluation continue évalue chaque réponse de l'agent, quel que soit le volume de trafic horaire.
    - id: s3
      text:
        en: An agent that runs outside Foundry can appear in this monitoring if it is onboarded through the Foundry Control Plane and emits OpenTelemetry GenAI traces to appi-adatum.
        fr: Un agent exécuté en dehors de Foundry peut apparaître dans cette surveillance s'il est intégré via le Foundry Control Plane et émet des traces OpenTelemetry GenAI vers appi-adatum.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Monitoring data is stored in the connected Application Insights resource, so retention and billing follow that resource's configuration. A continuous evaluation rule is capped by max_hourly_runs (100 runs per hour by default); runs beyond the limit are skipped until the next hour. Custom agents that run outside Foundry are onboarded through the Foundry Control Plane and must send OpenTelemetry GenAI semantic-convention traces to the same Application Insights instance.
    fr: Les données de surveillance sont stockées dans la ressource Application Insights connectée ; la rétention et la facturation suivent donc la configuration de cette ressource. Une règle d'évaluation continue est limitée par max_hourly_runs (100 exécutions par heure par défaut) ; les exécutions au-delà de la limite sont ignorées jusqu'à l'heure suivante. Les agents personnalisés exécutés en dehors de Foundry sont intégrés via le Foundry Control Plane et doivent envoyer des traces conformes aux conventions sémantiques OpenTelemetry GenAI à la même instance Application Insights.
references:
  - title: Monitor agents with the Agent Monitoring Dashboard
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard
