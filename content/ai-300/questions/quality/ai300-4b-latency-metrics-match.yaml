id: ai300-4b-latency-metrics-match
objective: "4.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank uses a provisioned Azure OpenAI model deployment in Microsoft Foundry for two applications: a chat assistant that streams its responses, and a summarization service that does not stream.

    Which Azure OpenAI metric should you chart for each requirement? To answer, drag the appropriate metrics to the correct requirements. Each metric may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise un déploiement de modèle Azure OpenAI approvisionné dans Microsoft Foundry pour deux applications : un assistant de conversation qui diffuse ses réponses en continu (streaming) et un service de synthèse qui ne les diffuse pas.

    Quelle métrique Azure OpenAI devez-vous représenter pour chaque exigence ? Pour répondre, faites glisser les métriques appropriées vers les exigences correspondantes. Chaque métrique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ttr, text: Time to Response }
    - { id: ttlb, text: Time to Last Byte }
    - { id: tbt, text: Time Between Tokens }
    - { id: avail, text: Azure OpenAI AvailabilityRate }
    - { id: nttfb, text: Normalized Time to First Byte }
    - { id: cache, text: Prompt Token Cache Match Rate }
  targets:
    - id: t1
      text: { en: "Chat assistant: time until the user receives the first token", fr: "Assistant de conversation : temps avant que l'utilisateur reçoive le premier jeton" }
    - id: t2
      text: { en: "Summarization service: overall response time of each call", fr: "Service de synthèse : temps de réponse global de chaque appel" }
    - id: t3
      text: { en: "Chat assistant: speed at which tokens are generated after the first one", fr: "Assistant de conversation : vitesse de génération des jetons après le premier" }
    - id: t4
      text: { en: "Both applications: share of calls that do not fail with a server error (HTTP 5xx)", fr: "Les deux applications : part des appels qui n'échouent pas avec une erreur de serveur (HTTP 5xx)" }
answer:
  mapping: { t1: ttr, t2: ttlb, t3: tbt, t4: avail }
explanation:
  correct:
    en: Time to Response measures the time to the first token and is recommended for streaming requests. Time to Last Byte measures the end-to-end time of non-streaming requests. Time Between Tokens measures the generation rate of streaming responses. AvailabilityRate is computed as (total calls - server errors) / total calls, where server errors are HTTP 500 and above.
    fr: Time to Response mesure le temps jusqu'au premier jeton et est recommandée pour les requêtes en streaming. Time to Last Byte mesure le temps de bout en bout des requêtes sans streaming. Time Between Tokens mesure la vitesse de génération des réponses en streaming. AvailabilityRate se calcule ainsi (appels totaux - erreurs de serveur) / appels totaux, les erreurs de serveur étant les réponses HTTP 500 et plus.
  options:
    nttfb: { en: "Normalized Time to First Byte divides first-byte latency by prompt size; it is only for comparing efficiency across prompt sizes, not for the absolute latency users see.", fr: "Normalized Time to First Byte divise la latence du premier octet par la taille de l'invite ; elle sert uniquement à comparer l'efficacité entre tailles d'invite, pas à mesurer la latence absolue que voient les utilisateurs." }
    cache: { en: "Prompt Token Cache Match Rate shows how much of the prompts is served from the cache, not a latency or availability value.", fr: "Prompt Token Cache Match Rate indique la part des invites servie depuis le cache, pas une valeur de latence ou de disponibilité." }
references:
  - title: Azure OpenAI in Microsoft Foundry Models performance & latency
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/latency
  - title: Azure OpenAI monitoring data reference
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/monitor-openai-reference
