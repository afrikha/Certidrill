id: ai300-4b-trace-function-content
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a production Python application that calls a Microsoft Foundry agent. Client-side tracing is enabled with `AIProjectInstrumentor` and exports to Application Insights. The `OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT` environment variable is not set.

    The application contains a function `lookup_customer(email: str)` decorated with `@trace_function`. A security review finds customer email addresses in the span attribute `code.function.parameter.email`.

    You need to stop recording the email addresses while keeping the traces of the model and tool calls. What should you do?
  fr: |
    Contoso dispose d'une application Python de production qui appelle un agent Microsoft Foundry. Le traçage côté client est activé avec `AIProjectInstrumentor` et exporte vers Application Insights. La variable d'environnement `OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT` n'est pas définie.

    L'application contient une fonction `lookup_customer(email: str)` décorée avec `@trace_function`. Une revue de sécurité trouve des adresses e-mail de clients dans l'attribut d'étendue (span) `code.function.parameter.email`.

    Vous devez cesser d'enregistrer les adresses e-mail tout en conservant les traces des appels de modèle et d'outils. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT to false.", fr: "Définir OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT sur false." } }
    - { id: b, text: { en: "Set AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING to false.", fr: "Définir AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING sur false." } }
    - { id: c, text: { en: "Remove the @trace_function decorator from lookup_customer.", fr: "Supprimer le décorateur @trace_function de lookup_customer." } }
    - { id: d, text: { en: "Set AZURE_TRACING_GEN_AI_ENABLE_TRACE_CONTEXT_PROPAGATION to false.", fr: "Définir AZURE_TRACING_GEN_AI_ENABLE_TRACE_CONTEXT_PROPAGATION sur false." } }
answer: { optionId: c }
explanation:
  correct:
    en: The @trace_function decorator always records the parameters and the return value of the function, as `code.function.parameter.<name>` and `code.function.return.value`, whatever the content recording setting. Removing the decorator from lookup_customer (or no longer passing personal data to a traced function) stops the leak while the instrumentation of model and tool calls continues.
    fr: Le décorateur @trace_function enregistre toujours les paramètres et la valeur de retour de la fonction, sous `code.function.parameter.<name>` et `code.function.return.value`, quel que soit le paramètre d'enregistrement du contenu. Supprimer le décorateur de lookup_customer (ou ne plus passer de données personnelles à une fonction tracée) arrête la fuite, tandis que l'instrumentation des appels de modèle et d'outils continue.
  options:
    a: { en: "Content recording is already off by default, and it does not affect @trace_function.", fr: "L'enregistrement du contenu est déjà désactivé par défaut, et il n'affecte pas @trace_function." }
    b: { en: "This variable turns off GenAI tracing entirely, so the model and tool call traces would be lost.", fr: "Cette variable désactive entièrement le traçage GenAI : les traces des appels de modèle et d'outils seraient perdues." }
    d: { en: "Trace context propagation only injects W3C trace headers into outgoing requests; it does not control span attributes.", fr: "La propagation du contexte de trace injecte seulement des en-têtes de trace W3C dans les requêtes sortantes ; elle ne contrôle pas les attributs d'étendue." }
references:
  - title: Add client-side tracing to Foundry agents (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-client-side
