id: ai300-4a-qm-groundedness-inputs
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys stores the responses of its RAG assistant together with the passages that the search index retrieved for each response. You add the `builtin.groundedness` evaluator to an evaluation of these stored rows.

    You need Groundedness to check each response against the passages retrieved for it.

    Which two fields should the data mapping provide?
  fr: |
    Wingtip Toys stocke les réponses de son assistant RAG avec les passages que l'index de recherche a récupérés pour chaque réponse. Vous ajoutez l'évaluateur `builtin.groundedness` à une évaluation de ces lignes stockées.

    Groundedness doit vérifier chaque réponse par rapport aux passages récupérés pour elle.

    Quels sont les deux champs que le mappage de données doit fournir ?
body:
  options:
    - id: a
      text: { en: "response and context", fr: "response et context" }
    - id: b
      text: { en: "query and response", fr: "query et response" }
    - id: c
      text: { en: "response and ground_truth", fr: "response et ground_truth" }
    - id: d
      text: { en: "query and context", fr: "query et context" }
answer: { optionId: a }
explanation:
  correct:
    en: Groundedness measures whether the response aligns with the context without fabricated content, so it needs the `response` and the `context` (the retrieved passages). `query` is optional for this evaluator.
    fr: "Groundedness mesure si la réponse est conforme au contexte sans contenu inventé : il a besoin de `response` et de `context` (les passages récupérés). `query` est facultatif pour cet évaluateur."
  options:
    b:
      en: query and response are the inputs of Relevance, which does not take the context into account.
      fr: query et response sont les entrées de Relevance, qui ne prend pas le contexte en compte.
    c:
      en: Comparing a response with a ground truth is what Response Completeness or Similarity do, not Groundedness.
      fr: Comparer une réponse à une vérité de terrain relève de Response Completeness ou de Similarity, pas de Groundedness.
    d:
      en: query and context are the inputs of Retrieval, which scores the retrieved chunks, not the response.
      fr: query et context sont les entrées de Retrieval, qui note les blocs récupérés, pas la réponse.
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
