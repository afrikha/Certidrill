id: ai300-4a-qm-reference-metrics
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders evaluates a summarization feature in a Foundry project. Each row of the test dataset contains a generated `response` and a reference summary in `ground_truth`.

    You need to add an evaluator that scores the overlap between each response and its reference summary. The evaluator must not use a judge model, to avoid model inference costs.

    Which two evaluators can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders évalue une fonctionnalité de synthèse dans un projet Foundry. Chaque ligne du jeu de données de test contient une `response` générée et un résumé de référence dans `ground_truth`.

    Vous devez ajouter un évaluateur qui note le recouvrement entre chaque réponse et son résumé de référence. L'évaluateur ne doit pas utiliser de modèle juge, pour éviter les coûts d'inférence.

    Quels sont les deux évaluateurs que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: builtin.f1_score }
    - { id: b, text: builtin.similarity }
    - { id: c, text: builtin.coherence }
    - { id: d, text: builtin.relevance }
    - { id: e, text: builtin.rouge_score }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: F1 score measures token overlap between the response and the ground truth, and ROUGE measures recall-oriented n-gram overlap, a common choice for summarization. Both are computed algorithmically on a 0–1 scale (default threshold 0.5) and need no judge model deployment.
    fr: F1 score mesure le recouvrement de jetons entre la réponse et la vérité de terrain, et ROUGE le recouvrement de n-grammes orienté rappel, souvent utilisé pour la synthèse. Les deux sont calculés de façon algorithmique sur une échelle de 0 à 1 (seuil par défaut 0,5) et ne nécessitent aucun déploiement de modèle juge.
  options:
    b: { en: "Similarity also compares with the ground truth, but it is an AI-assisted evaluator that requires a judge model deployment.", fr: "Similarity compare aussi avec la vérité de terrain, mais c'est un évaluateur assisté par IA qui nécessite un déploiement de modèle juge." }
    c: { en: "Coherence uses a judge model and does not compare with a reference summary.", fr: "Coherence utilise un modèle juge et ne compare pas avec un résumé de référence." }
    d: { en: "Relevance uses a judge model and compares the response with the query, not with the reference.", fr: "Relevance utilise un modèle juge et compare la réponse à la requête, pas à la référence." }
references:
  - title: Textual similarity evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/textual-similarity-evaluators
