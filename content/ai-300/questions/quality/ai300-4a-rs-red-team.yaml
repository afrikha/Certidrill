id: ai300-4a-rs-red-team
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys plans to deploy a model-based chat application. Before deployment, the security team wants to probe the application endpoint automatically with adversarial prompts, including encoded attacks such as Base64 and multi-turn Crescendo attacks.

    You need to produce a scorecard that shows the Attack Success Rate (ASR) for each risk category.

    What should you use?
  fr: |
    Tailspin Toys prévoit de déployer une application de conversation basée sur un modèle. Avant le déploiement, l'équipe de sécurité veut sonder automatiquement le point de terminaison de l'application avec des invites adverses, notamment des attaques encodées comme Base64 et des attaques multitours Crescendo.

    Vous devez produire une fiche de résultats qui indique le taux de réussite des attaques (ASR) pour chaque catégorie de risque.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The risk and safety evaluators, run on the existing test dataset", fr: "Les évaluateurs de risques et de sécurité, exécutés sur le jeu de données de test existant" } }
    - { id: b, text: { en: "Continuous evaluation of the production traffic", fr: "L'évaluation continue du trafic de production" } }
    - { id: c, text: { en: "The AI Red Teaming Agent", fr: "AI Red Teaming Agent" } }
    - { id: d, text: { en: "Content filtering on the model deployment", fr: "Le filtrage de contenu sur le déploiement de modèle" } }
answer: { optionId: c }
explanation:
  correct:
    en: The AI Red Teaming Agent combines Microsoft's open-source PyRIT framework with the Foundry risk and safety evaluations. It simulates adversarial probing with attack strategies such as Base64, Flip, Jailbreak and Crescendo, scores each attack-response pair, and reports ASR in a scorecard by attack technique and risk category.
    fr: AI Red Teaming Agent combine le framework open source PyRIT de Microsoft avec les évaluations de risques et de sécurité de Foundry. Il simule des sondages adverses avec des stratégies d'attaque comme Base64, Flip, Jailbreak et Crescendo, note chaque paire attaque-réponse et présente l'ASR dans une fiche de résultats par technique d'attaque et catégorie de risque.
  options:
    a: { en: "Evaluators score the rows you provide; they do not generate adversarial attacks or compute an attack success rate.", fr: "Les évaluateurs notent les lignes que vous fournissez ; ils ne génèrent pas d'attaques adverses et ne calculent pas de taux de réussite des attaques." }
    b: { en: "Continuous evaluation samples production traffic after deployment, whereas the probing must happen before deployment.", fr: "L'évaluation continue échantillonne le trafic de production après le déploiement, alors que le sondage doit avoir lieu avant." }
    d: { en: "Content filtering blocks harmful content at inference time; it does not attack the endpoint or produce a scorecard.", fr: "Le filtrage de contenu bloque le contenu nuisible au moment de l'inférence ; il n'attaque pas le point de terminaison et ne produit pas de fiche de résultats." }
references:
  - title: AI Red Teaming Agent
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/ai-red-teaming-agent
