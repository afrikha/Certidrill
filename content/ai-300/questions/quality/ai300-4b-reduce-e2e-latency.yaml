id: ai300-4b-reduce-e2e-latency
objective: "4.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. has a Standard Azure OpenAI deployment named **docs-gen** in Microsoft Foundry. The deployment serves two workloads:

    - short ticket classification calls that return about 20 tokens;
    - long report generations that return about 3,000 tokens.

    All calls are non-streaming and set `max_tokens` to 4096. The Time to Last Byte of the classification calls is too high. You need to reduce the end-to-end latency of the classification calls. You cannot change the model.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose d'un déploiement Azure OpenAI Standard nommé **docs-gen** dans Microsoft Foundry. Le déploiement sert deux charges de travail :

    - des appels courts de classification de tickets qui renvoient environ 20 jetons ;
    - de longues générations de rapports qui renvoient environ 3 000 jetons.

    Tous les appels sont sans streaming et définissent `max_tokens` sur 4096. Le Time to Last Byte des appels de classification est trop élevé. Vous devez réduire la latence de bout en bout des appels de classification. Vous ne pouvez pas changer de modèle.

    Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable streaming for the classification calls.", fr: "Activer le streaming pour les appels de classification." } }
    - { id: b, text: { en: "Set max_tokens of the classification calls close to the expected output size.", fr: "Définir max_tokens des appels de classification près de la taille de sortie attendue." } }
    - { id: c, text: { en: "Set n to 2 for the classification calls.", fr: "Définir n sur 2 pour les appels de classification." } }
    - { id: d, text: { en: "Send the classification calls to a separate deployment.", fr: "Envoyer les appels de classification vers un déploiement distinct." } }
    - { id: e, text: { en: "Monitor Normalized Time to First Byte instead of Time to Last Byte.", fr: "Surveiller Normalized Time to First Byte au lieu de Time to Last Byte." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: The service reserves capacity for the requested max_tokens, so setting it as low as practical reduces latency without changing quality. Mixing short and long calls on one endpoint can slow the short calls that are batched with long completions; separate deployments per workload avoid this.
    fr: Le service réserve de la capacité pour la valeur max_tokens demandée ; la définir aussi bas que possible réduit la latence sans changer la qualité. Mélanger appels courts et longs sur un même point de terminaison peut ralentir les appels courts regroupés avec de longues complétions ; des déploiements distincts par charge de travail évitent ce problème.
  options:
    a: { en: "Streaming returns the first tokens sooner but does not reduce the total generation time.", fr: "Le streaming renvoie les premiers jetons plus tôt, mais ne réduit pas le temps total de génération." }
    c: { en: "Requesting several outputs per call increases latency.", fr: "Demander plusieurs sorties par appel augmente la latence." }
    e: { en: "Changing the metric you watch does not reduce latency, and this metric is only for comparing prompt sizes.", fr: "Changer la métrique surveillée ne réduit pas la latence, et cette métrique sert uniquement à comparer des tailles d'invite." }
references:
  - title: Azure OpenAI in Microsoft Foundry Models performance & latency
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/latency
