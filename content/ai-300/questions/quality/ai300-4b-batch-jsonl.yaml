id: ai300-4b-batch-jsonl
objective: "4.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has two Azure OpenAI deployments of the same model in Microsoft Foundry: a Global Standard deployment named **chat-gpt** and a Global Batch deployment named **batch-gpt**.

    To reduce costs, you prepare a JSON Lines input file to classify support tickets in a batch job. Each result must be matched to the ticket number, because results are not returned in file order.

    How should you complete each line of the file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose de deux déploiements Azure OpenAI du même modèle dans Microsoft Foundry : un déploiement Global Standard nommé **chat-gpt** et un déploiement Global Batch nommé **batch-gpt**.

    Pour réduire les coûts, vous préparez un fichier d'entrée JSON Lines afin de classer des tickets de support dans un travail par lots. Chaque résultat doit être associé au numéro de ticket, car les résultats ne sont pas renvoyés dans l'ordre du fichier.

    Comment devez-vous compléter chaque ligne du fichier ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {"[[key]]": "ticket-48213", "method": "POST", "url": "/v1/chat/completions", "body": {"model": [[model]], "messages": [{"role": "user", "content": "Classify this ticket: printer offline since Monday."}]}}
  slots:
    - id: key
      options:
        - { id: user, text: user }
        - { id: custom, text: custom_id }
        - { id: meta, text: metadata }
    - id: model
      options:
        - { id: batch, text: '"batch-gpt"' }
        - { id: chat, text: '"chat-gpt"' }
        - { id: type, text: '"Global-Batch"' }
answer:
  values: { key: custom, model: batch }
explanation:
  correct:
    en: "Each line of a batch input file contains `custom_id`, `method`, `url` and `body`. The `custom_id` value links each response to its request, which is required because responses are not returned in the order of the file. Every line must use the name of the Global Batch deployment in `body.model`."
    fr: "Chaque ligne d'un fichier d'entrée de traitement par lots contient `custom_id`, `method`, `url` et `body`. La valeur `custom_id` relie chaque réponse à sa requête, ce qui est indispensable car les réponses ne sont pas renvoyées dans l'ordre du fichier. Chaque ligne doit utiliser le nom du déploiement Global Batch dans `body.model`."
  options:
    user: { en: "user is a field of a chat completion request body; it does not identify the line of a batch file.", fr: "user est un champ du corps d'une requête de complétion de conversation ; il n'identifie pas la ligne d'un fichier de lots." }
    meta: { en: "metadata can be set on the batch job itself, not as the identifier of each line.", fr: "metadata peut être défini sur le travail par lots lui-même, pas comme identifiant de chaque ligne." }
    chat: { en: "A batch file must reference a Global Batch deployment, not the Global Standard one.", fr: "Un fichier de lots doit référencer un déploiement Global Batch, pas le déploiement Global Standard." }
    type: { en: "Global-Batch is the deployment type shown in the portal, not the name of a deployment.", fr: "Global-Batch est le type de déploiement affiché dans le portail, pas le nom d'un déploiement." }
references:
  - title: How to use global batch processing with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/batch
