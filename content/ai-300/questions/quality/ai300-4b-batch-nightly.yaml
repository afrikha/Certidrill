id: ai300-4b-batch-nightly
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank uses a Global Standard Azure OpenAI deployment in Microsoft Foundry for its online chat assistant.

    Every night, 60,000 customer reviews must be classified by the same model. The results are needed within 24 hours. The solution must minimize cost and must not consume the quota used by the online chat assistant.

    What should you use for the review classification?
  fr: |
    Woodgrove Bank utilise un déploiement Azure OpenAI Global Standard dans Microsoft Foundry pour son assistant de conversation en ligne.

    Chaque nuit, 60 000 avis de clients doivent être classés par le même modèle. Les résultats sont nécessaires sous 24 heures. La solution doit réduire les coûts au minimum et ne doit pas consommer le quota utilisé par l'assistant de conversation en ligne.

    Que devez-vous utiliser pour la classification des avis ?
body:
  options:
    - { id: a, text: { en: "A Global Batch deployment of the model", fr: "Un déploiement Global Batch du modèle" } }
    - { id: b, text: { en: "A higher tokens-per-minute quota on the Global Standard deployment", fr: "Un quota de jetons par minute plus élevé sur le déploiement Global Standard" } }
    - { id: c, text: { en: "A provisioned deployment of the model billed hourly", fr: "Un déploiement approvisionné du modèle facturé à l'heure" } }
    - { id: d, text: { en: "A second Global Standard deployment called with streaming enabled", fr: "Un second déploiement Global Standard appelé avec le streaming activé" } }
answer: { optionId: a }
explanation:
  correct:
    en: Global Batch processes asynchronous requests with a 24-hour target turnaround at 50 % less cost than Global Standard. Batch uses a separate enqueued token quota, so it does not disrupt online workloads.
    fr: |
      Global Batch traite des requêtes asynchrones avec un délai cible de 24 heures, pour un coût inférieur de 50 % à celui de Global Standard. Le traitement par lots utilise un quota distinct de jetons en file d'attente : il ne perturbe pas les charges de travail en ligne.
  options:
    b: { en: "More quota on the existing deployment keeps standard token prices and shares capacity with the chat assistant.", fr: "Davantage de quota sur le déploiement existant conserve le prix standard des jetons et partage la capacité avec l'assistant de conversation." }
    c: { en: "A provisioned deployment is billed for every hour it exists, which is not the lowest-cost option for a nightly job.", fr: "Un déploiement approvisionné est facturé pour chaque heure d'existence, ce qui n'est pas l'option la moins chère pour une tâche nocturne." }
    d: { en: "Streaming changes how responses are returned, not their price.", fr: "Le streaming modifie la façon dont les réponses sont renvoyées, pas leur prix." }
references:
  - title: How to use global batch processing with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/batch
