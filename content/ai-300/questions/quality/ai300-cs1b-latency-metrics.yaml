id: ai300-cs1b-latency-metrics
objective: "4.2.2"
type: yesno_statements
caseStudy: ai300-cs1b-vanarsdel
difficulty: 1
status: draft
stem:
  en: |
    You are reviewing the latency of the chat-qa deployment used by app-clausecheck. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la latence du déploiement chat-qa utilisé par app-clausecheck. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To meet the operations requirement for the wait before the first words, you should chart the Time to Response metric of chat-qa.
        fr: Pour respecter l'exigence d'exploitation sur l'attente avant les premiers mots, vous devez représenter la métrique Time to Response de chat-qa.
    - id: s2
      text:
        en: Because app-clausecheck streams the responses, each complete answer is generated in less time than it would be without streaming.
        fr: Comme app-clausecheck diffuse les réponses en continu, chaque réponse complète est générée en moins de temps que sans diffusion en continu.
    - id: s3
      text:
        en: Lowering the max_tokens value of the requests to chat-qa can reduce latency even for answers whose length doesn't change.
        fr: Réduire la valeur max_tokens des requêtes envoyées à chat-qa peut diminuer la latence même pour des réponses dont la longueur ne change pas.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Time to Response measures the time from prompt submission to the first response chunk (time to first token) and is the metric for streaming requests. Streaming returns tokens as soon as they're available, which shortens the wait for the first words but doesn't change the time needed to get all the tokens. Learn notes that a request with a higher max_tokens value has more latency even when the number of generated tokens is similar.
    fr: Time to Response mesure le temps entre l'envoi de l'invite et le premier bloc de réponse (temps jusqu'au premier jeton) ; c'est la métrique des requêtes en diffusion en continu. La diffusion en continu renvoie les jetons dès qu'ils sont disponibles, ce qui raccourcit l'attente des premiers mots mais ne change pas le temps nécessaire pour obtenir tous les jetons. Learn indique qu'une requête dont la valeur max_tokens est plus élevée a plus de latence, même quand le nombre de jetons générés est similaire.
references:
  - title: Azure OpenAI in Microsoft Foundry Models performance & latency
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/latency
