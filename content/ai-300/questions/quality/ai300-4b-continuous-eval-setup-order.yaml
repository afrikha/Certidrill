id: ai300-4b-continuous-eval-setup-order
objective: "4.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has a Microsoft Foundry project that contains an agent named **claims-agent**. No Application Insights resource is connected to the project yet. The managed identity of the project already has the Foundry User role.

    You need the coherence scores of a sample of the production responses of claims-agent to appear on its **Monitor** tab. You will use the Foundry portal.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware, Inc. dispose d'un projet Microsoft Foundry qui contient un agent nommé **claims-agent**. Aucune ressource Application Insights n'est encore connectée au projet. L'identité managée du projet dispose déjà du rôle Foundry User.

    Les scores de cohérence d'un échantillon des réponses de production de claims-agent doivent apparaître sous son onglet **Monitor**. Vous utiliserez le portail Foundry.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: conn, text: { en: "Connect an Application Insights resource to the project.", fr: "Connecter une ressource Application Insights au projet." } }
    - { id: add, text: { en: "On the Monitor tab of claims-agent, open the settings, select **Continuous evaluation**, and add the coherence evaluator.", fr: "Sous l'onglet Monitor de claims-agent, ouvrir les paramètres, sélectionner **Continuous evaluation** et ajouter l'évaluateur de cohérence." } }
    - { id: traffic, text: { en: "Send requests to claims-agent, and then check the evaluation charts on the Monitor tab.", fr: "Envoyer des requêtes à claims-agent, puis vérifier les graphiques d'évaluation sous l'onglet Monitor." } }
    - { id: diag, text: { en: "Create a diagnostic setting on the Foundry resource that sends AllMetrics to a Log Analytics workspace.", fr: "Créer un paramètre de diagnostic sur la ressource Foundry qui envoie AllMetrics à un espace de travail Log Analytics." } }
    - { id: hub, text: { en: "Create a hub-based project and recreate claims-agent in it.", fr: "Créer un projet basé sur un hub et y recréer claims-agent." } }
    - { id: env, text: { en: "Set AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING to true in the application code.", fr: "Définir AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING sur true dans le code de l'application." } }
answer:
  sequence: [ conn, add, traffic ]
explanation:
  correct:
    en: Monitoring and evaluation results are stored in the Application Insights resource connected to the project, so you connect it first. You then add the evaluator on the Continuous evaluation tab of the Monitor settings. Continuous evaluation samples live traffic, so you generate requests and verify that the evaluation charts appear.
    fr: |
      Les résultats de surveillance et d'évaluation sont stockés dans la ressource Application Insights connectée au projet : vous la connectez d'abord. Vous ajoutez ensuite l'évaluateur sous l'onglet Continuous evaluation des paramètres de Monitor. L'évaluation continue échantillonne le trafic réel : vous générez des requêtes et vérifiez que les graphiques d'évaluation apparaissent.
  options:
    diag: { en: "Diagnostic settings export resource logs and metrics of the Foundry resource; continuous evaluation does not depend on them.", fr: "Les paramètres de diagnostic exportent les journaux de ressources et les métriques de la ressource Foundry ; l'évaluation continue n'en dépend pas." }
    hub: { en: "Continuous evaluation of agents works with Foundry projects; hub-based projects are not supported.", fr: "L'évaluation continue des agents fonctionne avec les projets Foundry ; les projets basés sur un hub ne sont pas pris en charge." }
    env: { en: "This variable enables client-side tracing in your own code; server-side tracing of a Foundry agent needs no code change.", fr: "Cette variable active le traçage côté client dans votre propre code ; le traçage côté serveur d'un agent Foundry ne demande aucune modification de code." }
references:
  - title: Monitor agents with the Agent Monitoring Dashboard
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard
  - title: Set up tracing in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup
