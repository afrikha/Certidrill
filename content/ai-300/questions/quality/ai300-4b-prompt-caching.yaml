id: ai300-4b-prompt-caching
objective: "4.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a support application that calls a **gpt-4.1** Standard deployment in Microsoft Foundry. Each request contains a 3,000-token system message with the support policies, followed by the user's question. The system message starts with the current date and time and the name of the user, followed by the policies.

    The `cached_tokens` value in the usage data of every response is 0. You want to reduce the cost of the input tokens by using prompt caching.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'une application de support qui appelle un déploiement Standard **gpt-4.1** dans Microsoft Foundry. Chaque requête contient un message système de 3 000 jetons avec les règles de support, suivi de la question de l'utilisateur. Le message système commence par la date et l'heure actuelles et le nom de l'utilisateur, suivis des règles.

    La valeur `cached_tokens` dans les données d'utilisation de chaque réponse est 0. Vous voulez réduire le coût des jetons d'entrée à l'aide de la mise en cache des invites.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A cache hit requires the first 1,024 tokens of the prompt to be identical to those of an earlier request.", fr: "Une correspondance dans le cache exige que les 1 024 premiers jetons de l'invite soient identiques à ceux d'une requête précédente." } }
    - { id: b, text: { en: "You must first enable prompt caching in the deployment settings.", fr: "Vous devez d'abord activer la mise en cache des invites dans les paramètres du déploiement." } }
    - { id: c, text: { en: "Moving the date, the time and the user name after the policies allows cache hits.", fr: "Déplacer la date, l'heure et le nom de l'utilisateur après les règles permet des correspondances dans le cache." } }
    - { id: d, text: { en: "Cache hits are reported in the completion_tokens_details section of the usage data.", fr: "Les correspondances dans le cache sont signalées dans la section completion_tokens_details des données d'utilisation." } }
    - { id: e, text: { en: "Cached prompts stay available for 30 days after their last use.", fr: "Les invites mises en cache restent disponibles 30 jours après leur dernière utilisation." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Prompt caching applies to requests of at least 1,024 tokens whose first 1,024 tokens are identical; a single different character in that prefix causes a miss. Because the date, time and user name change on every request, they prevent any match; putting the stable policies first and the variable content at the end lets the prefix be reused.
    fr: La mise en cache des invites s'applique aux requêtes d'au moins 1 024 jetons dont les 1 024 premiers jetons sont identiques ; un seul caractère différent dans ce préfixe entraîne un échec. Comme la date, l'heure et le nom de l'utilisateur changent à chaque requête, ils empêchent toute correspondance ; placer les règles stables en premier et le contenu variable à la fin permet de réutiliser le préfixe.
  options:
    b: { en: "Prompt caching is enabled by default on supported models; there is nothing to turn on.", fr: "La mise en cache des invites est activée par défaut sur les modèles pris en charge ; il n'y a rien à activer." }
    d: { en: "Cache hits appear as cached_tokens under prompt_tokens_details.", fr: "Les correspondances dans le cache apparaissent sous la forme cached_tokens dans prompt_tokens_details." }
    e: { en: "The in-memory cache is usually cleared within minutes of inactivity; even extended retention lasts up to 24 hours.", fr: "Le cache en mémoire est généralement vidé après quelques minutes d'inactivité ; même la rétention étendue dure au plus 24 heures." }
references:
  - title: Prompt caching with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/prompt-caching
