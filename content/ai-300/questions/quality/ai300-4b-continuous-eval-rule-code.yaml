id: ai300-4b-continuous-eval-rule-code
objective: "4.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has a Microsoft Foundry project that contains an agent named **booking-agent**. An Application Insights resource is connected to the project. You already created an evaluation object named `eval_object` that uses the built-in violence evaluator.

    You need to create a rule that evaluates the responses of booking-agent as they complete in production, with no more than 50 evaluation runs per hour.

    How should you complete the Python code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un projet Microsoft Foundry qui contient un agent nommé **booking-agent**. Une ressource Application Insights est connectée au projet. Vous avez déjà créé un objet d'évaluation nommé `eval_object` qui utilise l'évaluateur intégré de violence.

    Vous devez créer une règle qui évalue les réponses de booking-agent au fur et à mesure qu'elles se terminent en production, avec au plus 50 exécutions d'évaluation par heure.

    Comment devez-vous compléter le code Python ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    rule = project_client.evaluation_rules.create_or_update(
        id="booking-violence-rule",
        evaluation_rule=EvaluationRule(
            display_name="Booking violence rule",
            action=[[act]](eval_id=eval_object.id, [[lim]]=50),
            event_type=EvaluationRuleEventType.RESPONSE_COMPLETED,
            filter=EvaluationRuleFilter(agent_name="booking-agent"),
            enabled=True,
        ),
    )
  slots:
    - id: act
      options:
        - { id: cont, text: ContinuousEvaluationRuleAction }
        - { id: rec, text: RecurrenceTrigger }
        - { id: samp, text: AgentEvaluationSamplingConfiguration }
    - id: lim
      options:
        - { id: maxrate, text: maxRequestRate }
        - { id: maxruns, text: max_hourly_runs }
        - { id: pct, text: samplingPercent }
answer:
  values: { act: cont, lim: maxruns }
explanation:
  correct:
    en: "A continuous evaluation rule uses a `ContinuousEvaluationRuleAction` that points to the evaluation object, and its `max_hourly_runs` parameter caps the number of evaluation runs per hour (100 by default). The `RESPONSE_COMPLETED` event type and the `agent_name` filter make the rule evaluate each completed response of booking-agent."
    fr: "Une règle d'évaluation continue utilise une action `ContinuousEvaluationRuleAction` qui pointe vers l'objet d'évaluation, et son paramètre `max_hourly_runs` limite le nombre d'exécutions d'évaluation par heure (100 par défaut). Le type d'événement `RESPONSE_COMPLETED` et le filtre `agent_name` font évaluer par la règle chaque réponse terminée de booking-agent."
  options:
    rec: { en: "RecurrenceTrigger defines the schedule of a scheduled (recurring) evaluation, not the action of an event-driven rule.", fr: "RecurrenceTrigger définit la planification d'une évaluation planifiée (récurrente), pas l'action d'une règle déclenchée par un événement." }
    samp: { en: "AgentEvaluationSamplingConfiguration belongs to the classic agent evaluation API (AgentEvaluationRequest), not to evaluation rules.", fr: "AgentEvaluationSamplingConfiguration appartient à l'API classique d'évaluation des agents (AgentEvaluationRequest), pas aux règles d'évaluation." }
    maxrate: { en: "maxRequestRate is a parameter of the classic sampling configuration, not of ContinuousEvaluationRuleAction.", fr: "maxRequestRate est un paramètre de la configuration d'échantillonnage classique, pas de ContinuousEvaluationRuleAction." }
    pct: { en: "samplingPercent is a classic sampling setting expressed as a percentage, not an hourly cap of the rule action.", fr: "samplingPercent est un paramètre d'échantillonnage classique exprimé en pourcentage, pas une limite horaire de l'action de la règle." }
references:
  - title: Monitor agents with the Agent Monitoring Dashboard
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard
  - title: Continuously evaluate your AI agents (preview) (classic)
    url: https://learn.microsoft.com/en-us/azure/foundry-classic/how-to/continuous-evaluation-agents
