id: ai300-4a-ds-format-yn
objective: "4.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware prepares evaluation datasets for a Foundry project that contains a model deployment and a prompt agent. Some datasets are CSV files and others are JSONL files.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prépare des jeux de données d'évaluation pour un projet Foundry qui contient un déploiement de modèle et un agent d'invite. Certains jeux de données sont des fichiers CSV, d'autres des fichiers JSONL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can use a CSV file for a dataset whose rows contain only string query and response columns.
        fr: Vous pouvez utiliser un fichier CSV pour un jeu de données dont les lignes ne contiennent que des colonnes de chaînes query et response.
    - id: s2
      text:
        en: When a run sends the dataset queries to a model target, the evaluators score the response column stored in the dataset.
        fr: Quand une exécution envoie les requêtes du jeu de données à une cible de modèle, les évaluateurs notent la colonne response stockée dans le jeu de données.
    - id: s3
      text:
        en: When a dataset item in the messages format is sent to an agent target, the messages array must end with a user message.
        fr: Quand un élément du jeu de données au format messages est envoyé à une cible d'agent, le tableau messages doit se terminer par un message user.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: CSV is supported only for simple string-based `query` and `response` rows; richer structures such as message arrays or tool calls need JSONL. When a run calls a model or agent target, any stored `response` is ignored and the evaluators score the generated output. For a model or agent target, the `messages` array ends with a `user` message so that Foundry generates the next assistant response.
    fr: Le format CSV n'est pris en charge que pour des lignes simples de chaînes `query` et `response` ; les structures plus riches, comme les tableaux de messages ou les appels d'outils, nécessitent JSONL. Quand une exécution appelle une cible de modèle ou d'agent, toute `response` stockée est ignorée et les évaluateurs notent la sortie générée. Pour une cible de modèle ou d'agent, le tableau `messages` se termine par un message `user` afin que Foundry génère la réponse suivante de l'assistant.
references:
  - title: Evaluation dataset schema in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/evaluation-dataset-schema
