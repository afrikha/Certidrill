stem:
  en: You configure the Retrieval evaluator.
  fr: Vous configurez l'évaluateur Retrieval.
body:
  solution:
    en: |
      You add the following testing criterion to the evaluation:

      ```python
      testing_criteria = [
          {
              "type": "azure_ai_evaluator",
              "name": "retrieval",
              "evaluator_name": "builtin.retrieval",
              "initialization_parameters": {"deployment_name": model_deployment},
              "data_mapping": {
                  "query": "{{item.query}}",
                  "context": "{{item.context}}",
              },
          },
      ]
      ```
    fr: |
      Vous ajoutez le critère de test suivant à l'évaluation :

      ```python
      testing_criteria = [
          {
              "type": "azure_ai_evaluator",
              "name": "retrieval",
              "evaluator_name": "builtin.retrieval",
              "initialization_parameters": {"deployment_name": model_deployment},
              "data_mapping": {
                  "query": "{{item.query}}",
                  "context": "{{item.context}}",
              },
          },
      ]
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      Retrieval is a process evaluator: it judges how relevant the retrieved chunks are to the query. It never reads the generated response, so it can't tell whether the answer adds facts that the chunks don't contain. Even perfectly relevant chunks can come with a fabricated answer. The goal isn't met.
    fr: |
      Retrieval est un évaluateur de processus : il juge la pertinence des blocs récupérés par rapport à la question. Il ne lit jamais la réponse générée et ne peut donc pas déterminer si la réponse ajoute des faits absents des blocs. Des blocs parfaitement pertinents peuvent très bien s'accompagner d'une réponse inventée. L'objectif n'est pas atteint.
references:
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI - Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
