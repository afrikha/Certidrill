id: ai300-4b-trace-concepts
objective: "4.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. uses tracing in Microsoft Foundry to troubleshoot a production agent that calls several tools. The project is connected to an Application Insights resource.

    Which two statements about the traces of the agent are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise le traçage dans Microsoft Foundry pour résoudre les problèmes d'un agent de production qui appelle plusieurs outils. Le projet est connecté à une ressource Application Insights.

    Quelles sont les deux affirmations vraies sur les traces de l'agent ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Each span has a start time and an end time, and spans can be nested to show the hierarchy of operations.", fr: "Chaque étendue a une heure de début et une heure de fin, et les étendues peuvent être imbriquées pour montrer la hiérarchie des opérations." } }
    - { id: b, text: { en: "Trace data is kept for 90 days, whatever the retention settings of Application Insights.", fr: "Les données de trace sont conservées 90 jours, quels que soient les paramètres de rétention d'Application Insights." } }
    - { id: c, text: { en: "The OpenTelemetry GenAI semantic conventions used by the traces are stable and will not change.", fr: "Les conventions sémantiques OpenTelemetry GenAI utilisées par les traces sont stables et ne changeront pas." } }
    - { id: d, text: { en: "An execute_tool span can carry the arguments of the tool call in the gen_ai.tool.call.arguments attribute.", fr: "Une étendue execute_tool peut porter les arguments de l'appel d'outil dans l'attribut gen_ai.tool.call.arguments." } }
    - { id: e, text: { en: "Foundry stores the traces in the storage account of the project instead of Application Insights.", fr: "Foundry stocke les traces dans le compte de stockage du projet plutôt que dans Application Insights." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: A trace is made of spans, single operations with start and end times, attributes and nesting. Agent spans follow the OpenTelemetry GenAI semantic conventions; execute_tool spans, children of invoke_agent, carry gen_ai.tool.call.arguments and gen_ai.tool.call.result.
    fr: Une trace est composée d'étendues, des opérations uniques avec des heures de début et de fin, des attributs et une imbrication. Les étendues d'agent suivent les conventions sémantiques OpenTelemetry GenAI ; les étendues execute_tool, enfants d'invoke_agent, portent gen_ai.tool.call.arguments et gen_ai.tool.call.result.
  options:
    b: { en: "The portal lets you search traces of the last 90 days, but retention follows the Application Insights configuration.", fr: "Le portail permet de rechercher les traces des 90 derniers jours, mais la rétention suit la configuration d'Application Insights." }
    c: { en: "The GenAI semantic conventions are in Development status and might change.", fr: "Les conventions sémantiques GenAI sont au statut Development et peuvent changer." }
    e: { en: "Trace data is stored in the connected Application Insights resource.", fr: "Les données de trace sont stockées dans la ressource Application Insights connectée." }
references:
  - title: Agent tracing overview
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept
  - title: Set up tracing in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup
