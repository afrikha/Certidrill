id: ai300-4a-rs-agent-risks
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Foundry agent named **hr-agent** that answers employee questions about leave, benefits and workplace conflicts. Before each release, Contoso evaluates hr-agent on a dataset of adversarial queries.

    You need the evaluation to detect the following:

    - responses that demean employees because of their nationality or religion;
    - responses that encourage an employee who mentions burnout to hurt themselves.

    Which two evaluators should you add? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un agent Foundry nommé **hr-agent** qui répond aux questions des employés sur les congés, les avantages et les conflits au travail. Avant chaque version, Contoso évalue hr-agent sur un jeu de données de requêtes malveillantes.

    Vous devez faire en sorte que l'évaluation détecte les éléments suivants :

    - les réponses qui dénigrent des employés en raison de leur nationalité ou de leur religion ;
    - les réponses qui encouragent un employé qui parle d'épuisement professionnel à se faire du mal.

    Quels sont les deux évaluateurs à ajouter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: builtin.ungrounded_attributes }
    - { id: b, text: builtin.hate_unfairness }
    - { id: c, text: builtin.violence }
    - { id: d, text: builtin.indirect_attack }
    - { id: e, text: builtin.self_harm }
    - { id: f, text: builtin.sensitive_data_leakage }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: Hate and unfairness measures language that reflects hate towards or unfair representations of people based on factors such as nationality or religion. Self harm measures language about actions intended to hurt or damage one's own body. Both are content safety evaluators that support models and agents and return a severity score from 0 to 7.
    fr: Hate and unfairness mesure le langage qui exprime de la haine envers des personnes ou les représente de façon injuste selon des facteurs comme la nationalité ou la religion. Self harm mesure le langage relatif à des actions visant à blesser ou endommager son propre corps. Ce sont deux évaluateurs de sécurité du contenu qui prennent en charge les modèles et les agents et renvoient un score de gravité de 0 à 7.
  options:
    a: { en: "Ungrounded attributes detects inferences about a person's emotional state or protected class that the context doesn't support, not demeaning language.", fr: "Ungrounded attributes détecte des déductions sur l'état émotionnel ou la classe protégée d'une personne que le contexte n'étaye pas, pas un langage dénigrant." }
    c: { en: "Violence measures language about hurting or killing someone or something else; harm directed at oneself is measured by self harm.", fr: "Violence mesure le langage relatif au fait de blesser ou de tuer quelqu'un ou quelque chose d'autre ; le mal fait à soi-même relève de self harm." }
    d: { en: "Indirect attack detects instructions injected through processed content and supports models only, not agents.", fr: "Indirect attack détecte des instructions injectées par du contenu traité et ne prend en charge que les modèles, pas les agents." }
    f: { en: "Sensitive data leakage (preview) detects the exposure of financial, personal or health data, not harmful language.", fr: "Sensitive data leakage (préversion) détecte l'exposition de données financières, personnelles ou de santé, pas un langage nuisible." }
references:
  - title: Risk and safety evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators
