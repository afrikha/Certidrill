id: ai300-4a-rs-agent-risks
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Foundry agent named **hr-agent** that uses function tools to query employee records. The HR policy forbids hr-agent from calling the tool that updates salaries.

    You need to evaluate hr-agent to detect the following:

    - calls to tools that the policy explicitly disallows;
    - responses that expose personal identifiers or health data of employees.

    Which two evaluators should you add? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un agent Foundry nommé **hr-agent** qui utilise des outils de fonction pour interroger les dossiers des employés. La politique RH interdit à hr-agent d'appeler l'outil qui met à jour les salaires.

    Vous devez évaluer hr-agent pour détecter les éléments suivants :

    - les appels à des outils que la politique interdit explicitement ;
    - les réponses qui exposent des identifiants personnels ou des données de santé des employés.

    Quels sont les deux évaluateurs à ajouter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: builtin.ungrounded_attributes }
    - { id: b, text: builtin.prohibited_actions }
    - { id: c, text: builtin.protected_material }
    - { id: d, text: builtin.indirect_attack }
    - { id: e, text: builtin.sensitive_data_leakage }
    - { id: f, text: builtin.hate_unfairness }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: Prohibited actions detects agent behaviors that violate explicitly disallowed actions or tool uses, based on the verified policy. Sensitive data leakage detects the exposure of financial data, personal identifiers and health data. Both are in preview, take the query, the response and the tool calls, and support agent targets only.
    fr: Prohibited actions détecte les comportements d'agent qui enfreignent des actions ou des utilisations d'outils explicitement interdites, selon la politique vérifiée. Sensitive data leakage détecte l'exposition de données financières, d'identifiants personnels et de données de santé. Les deux sont en préversion, prennent la requête, la réponse et les appels d'outils, et ne prennent en charge que les cibles d'agent.
  options:
    a: { en: "Ungrounded attributes detects ungrounded inferences about personal attributes, not the disclosure of stored data.", fr: "Ungrounded attributes détecte des déductions non fondées sur des attributs personnels, pas la divulgation de données stockées." }
    c: { en: "Protected material detects copyrighted text.", fr: "Protected material détecte du texte protégé par le droit d'auteur." }
    d: { en: "Indirect attack detects injected instructions in processed content and supports model targets only.", fr: "Indirect attack détecte des instructions injectées dans le contenu traité et ne prend en charge que les cibles de modèle." }
    f: { en: "Hate and unfairness scores hateful or unfair content about groups, not policy violations or data leaks.", fr: "Hate and unfairness note le contenu haineux ou injuste envers des groupes, pas les violations de politique ni les fuites de données." }
references:
  - title: Risk and safety evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators
