id: ai300-3b-mirror-new-version
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys serves an open model from the model catalog on managed compute behind the managed online endpoint **ep-classify**. The **blue** deployment runs the current model version and receives all the traffic. The **green** deployment runs a newer version of the model and has no traffic.

    You need green to receive a copy of 20 % of the live requests so that you can compare its latency and logs. Clients must receive only responses from blue.

    Which command should you run?
  fr: |
    Tailspin Toys sert un modèle ouvert du catalogue de modèles sur un calcul managé derrière le point de terminaison en ligne managé **ep-classify**. Le déploiement **blue** exécute la version actuelle du modèle et reçoit tout le trafic. Le déploiement **green** exécute une version plus récente du modèle et ne reçoit aucun trafic.

    Vous devez faire en sorte que green reçoive une copie de 20 % des requêtes réelles afin de comparer sa latence et ses journaux. Les clients ne doivent recevoir que des réponses de blue.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "az ml online-endpoint update --name ep-classify --traffic \"blue=80 green=20\"" }
    - { id: b, text: "az ml online-endpoint update --name ep-classify --mirror-traffic \"blue=20\"" }
    - { id: c, text: "az ml online-endpoint invoke --name ep-classify --deployment-name green --request-file sample.json" }
    - { id: d, text: "az ml online-endpoint update --name ep-classify --mirror-traffic \"green=20\"" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Mirrored traffic copies a percentage of the requests to a shadow deployment without changing the responses returned to clients, which all still come from blue. You can mirror to only one deployment, up to 50 %, and requests that name a deployment explicitly aren't mirrored.
    fr: |
      Le trafic mis en miroir copie un pourcentage des requêtes vers un déploiement fantôme sans modifier les réponses renvoyées aux clients, qui proviennent toujours de blue. Vous ne pouvez mettre en miroir que vers un seul déploiement, jusqu'à 50 %, et les requêtes qui nomment explicitement un déploiement ne sont pas mises en miroir.
  options:
    a: { en: "A traffic split sends 20 % of the live requests to green, and those clients receive green's responses.", fr: "Une répartition du trafic envoie 20 % des requêtes réelles à green, et ces clients reçoivent les réponses de green." }
    b: { en: "The mirror target must be green; blue already serves the live traffic and can't receive both live and mirrored traffic.", fr: "La cible du miroir doit être green ; blue sert déjà le trafic réel et ne peut pas recevoir à la fois du trafic réel et du trafic mis en miroir." }
    c: { en: "Invoking green directly tests it with a sample file, not with a copy of live requests.", fr: "Appeler green directement le teste avec un fichier d'exemple, pas avec une copie des requêtes réelles." }
references:
  - title: Safe rollout for online endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
