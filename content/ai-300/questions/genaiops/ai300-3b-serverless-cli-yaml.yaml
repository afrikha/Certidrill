id: ai300-3b-serverless-cli-yaml
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a hub-based project named **proj-claims** in the Foundry (classic) portal. You need to deploy the **DeepSeek-R1** model from the model catalog as a serverless API deployment by using the Azure CLI `ml` extension. Any required Azure Marketplace subscription already exists, and the CLI defaults for the resource group and the project are configured.

    After the deployment, the claims application needs the endpoint keys.

    How should you complete the file and the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un projet basé sur un hub nommé **proj-claims** dans le portail Foundry (classique). Vous devez déployer le modèle **DeepSeek-R1** du catalogue de modèles en tant que déploiement d'API serverless à l'aide de l'extension `ml` d'Azure CLI. L'éventuel abonnement Place de marché Azure requis existe déjà, et les valeurs par défaut de l'interface CLI pour le groupe de ressources et le projet sont configurées.

    Après le déploiement, l'application de sinistres a besoin des clés du point de terminaison.

    Comment devez-vous compléter le fichier et les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    # endpoint.yml
    name: deepseek-r1-claims
    model_id: [[model]]

    # Azure CLI
    az ml [[cmd]] -f endpoint.yml
    az ml serverless-endpoint [[keys]] -n deepseek-r1-claims
  slots:
    - id: model
      options:
        - { id: m1, text: "azureml://registries/azureml-deepseek/models/DeepSeek-R1/versions/1" }
        - { id: m2, text: "azureml://registries/azureml-deepseek/models/DeepSeek-R1" }
        - { id: m3, text: "azureml:DeepSeek-R1:1" }
        - { id: m4, text: "DeepSeek-R1" }
    - id: cmd
      options:
        - { id: c1, text: online-endpoint create }
        - { id: c2, text: online-deployment create }
        - { id: c3, text: serverless-endpoint create }
        - { id: c4, text: marketplace-subscription create }
    - id: keys
      options:
        - { id: k1, text: show }
        - { id: k2, text: regenerate-keys }
        - { id: k3, text: list }
        - { id: k4, text: get-credentials }
answer:
  values: { model: m2, cmd: c3, keys: k4 }
explanation:
  correct:
    en: "The serverless endpoint YAML contains the endpoint name and the catalog model ID copied without the version, because serverless API deployments always use the latest version of the model. `az ml serverless-endpoint create -f endpoint.yml` creates the deployment, and `az ml serverless-endpoint get-credentials` returns its keys."
    fr: "Le fichier YAML du point de terminaison serverless contient le nom du point de terminaison et l'ID de modèle du catalogue copié sans la version, car les déploiements d'API serverless utilisent toujours la dernière version du modèle. `az ml serverless-endpoint create -f endpoint.yml` crée le déploiement, et `az ml serverless-endpoint get-credentials` renvoie ses clés."
  options:
    m1: { en: "The model ID must not include the /versions/ suffix: serverless deployments always deploy the latest version.", fr: "L'ID de modèle ne doit pas inclure le suffixe /versions/ : les déploiements serverless déploient toujours la dernière version." }
    m3: { en: "azureml:<name>:<version> references a model registered in the workspace, not a catalog model in a registry.", fr: "azureml:<nom>:<version> référence un modèle inscrit dans l'espace de travail, pas un modèle du catalogue dans un registre." }
    m4: { en: "The display name isn't enough: the YAML needs the full registry model ID.", fr: "Le nom d'affichage ne suffit pas : le YAML exige l'ID complet du modèle dans le registre." }
    c1: { en: "online-endpoint create creates a managed online endpoint for managed compute, not a serverless deployment.", fr: "online-endpoint create crée un point de terminaison en ligne managé pour le calcul managé, pas un déploiement serverless." }
    c2: { en: "online-deployment create deploys a model to instances of a managed online endpoint.", fr: "online-deployment create déploie un modèle sur les instances d'un point de terminaison en ligne managé." }
    c4: { en: "The marketplace subscription already exists; this command doesn't create the endpoint.", fr: "L'abonnement de la Place de marché existe déjà ; cette commande ne crée pas le point de terminaison." }
    k1: { en: "show returns the endpoint details, not its keys.", fr: "show renvoie les détails du point de terminaison, pas ses clés." }
    k2: { en: "regenerate-keys replaces the keys, which isn't required.", fr: "regenerate-keys remplace les clés, ce qui n'est pas demandé." }
    k3: { en: "list lists the serverless endpoints of the workspace.", fr: "list répertorie les points de terminaison serverless de l'espace de travail." }
references:
  - title: Deploy models as serverless API deployments (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/deploy-models-serverless
  - title: az ml serverless-endpoint
    url: https://learn.microsoft.com/en-us/cli/azure/ml/serverless-endpoint
