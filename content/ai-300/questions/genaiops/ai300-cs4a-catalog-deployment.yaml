id: ai300-cs4a-catalog-deployment
objective: "3.2.1"
type: single
caseStudy: ai300-cs4a-coho-winery
difficulty: 2
status: draft
stem:
  en: You need to deploy the model selected by the marketing department in aif-coho for the monthly generation of the catalog descriptions. The solution must meet the catalog requirements. Which deployment type should you use?
  fr: Vous devez déployer dans aif-coho le modèle choisi par le service marketing pour la génération mensuelle des descriptions du catalogue. La solution doit respecter les exigences du catalogue. Quel type de déploiement devez-vous utiliser ?
body:
  options:
    - { id: a, text: Global Batch }
    - { id: b, text: Data Zone Standard }
    - { id: c, text: Data Zone Batch }
    - { id: d, text: Data Zone Provisioned }
    - { id: e, text: Standard }
answer: { optionId: c }
explanation:
  correct:
    en: Data Zone Batch processes prompts and responses only within the selected data zone, here the EU Data Boundary, and batch jobs cost 50% less than Global Standard with a 24-hour target turnaround. The 15,000 requests are sent as one JSONL file, which fits a monthly job whose results can arrive up to 24 hours later.
    fr: Data Zone Batch traite les invites et les réponses uniquement dans la zone de données choisie, ici l'EU Data Boundary, et les travaux par lots coûtent 50 % de moins que Global Standard, avec un délai de traitement cible de 24 heures. Les 15 000 requêtes sont envoyées dans un seul fichier JSONL, ce qui convient à un travail mensuel dont les résultats peuvent arriver jusqu'à 24 heures plus tard.
  options:
    a: { en: "Global Batch has the batch discount, but it can process data in any Azure region, outside the European Union.", fr: "Global Batch bénéficie de la remise des lots, mais il peut traiter les données dans n'importe quelle région Azure, hors de l'Union européenne." }
    b: { en: "Data Zone Standard keeps processing in the EU data zone, but it bills every token at the pay-per-token rate, without the batch discount.", fr: "Data Zone Standard maintient le traitement dans la zone de données UE, mais il facture chaque jeton au tarif du paiement par jeton, sans la remise des lots." }
    d: { en: "Data Zone Provisioned reserves throughput units billed even when the monthly job isn't running, which doesn't minimize cost.", fr: "Data Zone Provisioned réserve des unités de débit facturées même quand le travail mensuel ne s'exécute pas, ce qui ne réduit pas le coût au minimum." }
    e: { en: "Standard keeps processing in the Azure geography but bills at the pay-per-token rate, without the batch discount.", fr: "Standard maintient le traitement dans la zone géographique Azure mais facture au tarif du paiement par jeton, sans la remise des lots." }
references:
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
  - title: Getting started with Azure OpenAI batch deployments
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/batch
