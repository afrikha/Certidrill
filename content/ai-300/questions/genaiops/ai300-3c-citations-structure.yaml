id: ai300-3c-citations-structure
objective: "3.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is designing a prompt for a GPT chat model in Microsoft Foundry that writes market briefs from news articles. Fact-checkers must be able to verify each statement quickly, and the briefs must cover events that happened after the model's training data.

    How should you complete the prompt design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam conçoit une invite pour un modèle de conversation GPT dans Microsoft Foundry qui rédige des notes de marché à partir d'articles de presse. Les vérificateurs doivent pouvoir contrôler rapidement chaque affirmation, et les notes doivent couvrir des événements postérieurs aux données d'entraînement du modèle.

    Comment devez-vous compléter la conception de l'invite ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Ask the model to place each citation [[cit]].
      Ask the model to return the extracted facts [[fmt]].
      To provide information more recent than the model's parameters, use [[aff]].
    fr: |
      Demander au modèle de placer chaque citation [[cit]].
      Demander au modèle de renvoyer les faits extraits [[fmt]].
      Pour fournir des informations plus récentes que les paramètres du modèle, utiliser [[aff]].
  slots:
    - id: cit
      options:
        - { id: inline, text: { en: "inline, next to the statement it supports", fr: "en ligne, à côté de l'affirmation qu'elle justifie" } }
        - { id: end, text: { en: "in a single list at the end of the brief", fr: "dans une liste unique à la fin de la note" } }
        - { id: ask, text: { en: "only when the reader asks for a source", fr: "uniquement lorsque le lecteur demande une source" } }
    - id: fmt
      options:
        - { id: triple, text: { en: "as (entity, relationship, entity) triples", fr: "sous forme de triplets (entité, relation, entité)" } }
        - { id: compound, text: { en: "as compound sentences that group related facts", fr: "sous forme de phrases composées qui regroupent les faits liés" } }
        - { id: para, text: { en: "as one narrative paragraph per article", fr: "sous forme d'un paragraphe narratif par article" } }
    - id: aff
      options:
        - { id: search, text: { en: "an affordance: SEARCH calls whose results you insert into the prompt", fr: "une affordance : des appels SEARCH dont vous insérez les résultats dans l'invite" } }
        - { id: temp, text: { en: "a higher temperature so that the model generalizes further", fr: "une température plus élevée pour que le modèle généralise davantage" } }
        - { id: cot, text: { en: "a chain-of-thought instruction that asks the model to reason about recent events", fr: "une instruction de chaîne de pensée qui demande au modèle de raisonner sur les événements récents" } }
answer:
  values: { cit: inline, fmt: triple, aff: search }
explanation:
  correct:
    en: Inline citations sit close to the text they support, which makes them a better mitigation against false content than citations at the end. A defined triple format avoids compound statements that are hard to verify. An affordance such as search lets the model use external, up-to-date results that you paste into the prompt instead of relying on its parameters.
    fr: Les citations en ligne sont proches du texte qu'elles justifient, ce qui en fait une meilleure protection contre le contenu faux que des citations en fin de texte. Un format en triplets défini évite les affirmations composées difficiles à vérifier. Une affordance comme la recherche permet au modèle d'utiliser des résultats externes et à jour que vous insérez dans l'invite, au lieu de s'appuyer sur ses paramètres.
  options:
    end:
      en: A citation far from its statement is harder to anticipate correctly and to check.
      fr: Une citation éloignée de son affirmation est plus difficile à anticiper correctement et à vérifier.
    compound:
      en: Compound statements such as "X does Y and Z" are harder to verify than one fact per triple.
      fr: Les affirmations composées comme « X fait Y et Z » sont plus difficiles à vérifier qu'un fait par triplet.
    cot:
      en: Step-by-step reasoning does not give the model information it doesn't have.
      fr: Un raisonnement étape par étape ne donne pas au modèle des informations qu'il ne possède pas.
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
