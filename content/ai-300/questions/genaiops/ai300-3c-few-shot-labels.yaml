id: ai300-3c-few-shot-labels
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Microsoft Foundry project that contains a deployment of a non-reasoning GPT chat model. An application uses the deployment to classify IT support tickets into the labels **Network**, **Hardware** and **Access**.

    The system message lists the labels, but the model often replies with full sentences or invents labels such as "Connectivity". You need the model to return only one of the three labels, in the same format every time. The solution must not train or modify the model.

    What should you do?
  fr: |
    Contoso dispose d'un projet Microsoft Foundry qui contient un déploiement d'un modèle de conversation GPT sans raisonnement. Une application utilise ce déploiement pour classer des tickets de support informatique selon les étiquettes **Network**, **Hardware** et **Access**.

    Le message système liste les étiquettes, mais le modèle répond souvent par des phrases complètes ou invente des étiquettes comme « Connectivity ». Vous devez faire en sorte que le modèle renvoie uniquement l'une des trois étiquettes, toujours dans le même format. La solution ne doit ni entraîner ni modifier le modèle.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add the example tickets with their expected labels to a training file and fine-tune the deployment.", fr: "Ajouter les exemples de tickets avec leur étiquette attendue à un fichier d'entraînement et affiner le déploiement." }
    - id: b
      text: { en: "Move the list of labels from the system message to the end of each assistant message.", fr: "Déplacer la liste des étiquettes du message système vers la fin de chaque message assistant." }
    - id: c
      text: { en: "Add example tickets with their expected labels as user and assistant messages after the system message.", fr: "Ajouter des exemples de tickets avec leur étiquette attendue sous forme de messages user et assistant après le message système." }
    - id: d
      text: { en: "Increase the max_tokens value so that the model has room to explain its choice of label.", fr: "Augmenter la valeur de max_tokens pour que le modèle ait la place d'expliquer son choix d'étiquette." }
answer: { optionId: c }
explanation:
  correct:
    en: Few-shot learning adds examples of the expected input and output to the prompt. With the Chat Completions API, the examples are user and assistant turns placed after the system message. They condition the model for the current request only, so the model itself is not changed, and they show the exact output format to reproduce.
    fr: L'apprentissage few-shot ajoute à l'invite des exemples d'entrée et de sortie attendues. Avec l'API Chat Completions, ces exemples sont des échanges user et assistant placés après le message système. Ils conditionnent le modèle pour la requête en cours uniquement, sans modifier le modèle, et montrent le format de sortie exact à reproduire.
  options:
    a:
      en: Fine-tuning trains a customized model, which the requirements exclude.
      fr: L'affinage entraîne un modèle personnalisé, ce que les exigences excluent.
    b:
      en: Assistant messages hold model answers; moving the instructions there does not show the model input/output examples and makes the format less clear.
      fr: Les messages assistant contiennent les réponses du modèle ; y déplacer les instructions ne montre pas d'exemples d'entrée et de sortie et rend le format moins clair.
    d:
      en: A higher token limit allows longer answers, the opposite of returning a single label.
      fr: Une limite de jetons plus élevée autorise des réponses plus longues, l'inverse d'une étiquette unique.
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
