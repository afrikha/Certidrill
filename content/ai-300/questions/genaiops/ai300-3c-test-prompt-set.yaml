id: ai300-3c-test-prompt-set
objective: "3.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware is preparing an experiment to compare a production system prompt with two prompt variants for a travel agent in Microsoft Foundry. The team will score the responses manually and wants a result that it can trust and reproduce.

    Which two practices should you apply? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prépare une expérience pour comparer une invite système de production à deux variantes d'invite pour un agent de voyage dans Microsoft Foundry. L'équipe notera les réponses manuellement et veut un résultat fiable et reproductible.

    Quelles sont les deux pratiques à appliquer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Generate a different random set of test prompts for each variant.", fr: "Générer un jeu aléatoire d'invites de test différent pour chaque variante." } }
    - { id: b, text: { en: "Set the success thresholds after the run, based on the best variant's scores.", fr: "Fixer les seuils de réussite après l'exécution, d'après les scores de la meilleure variante." } }
    - { id: c, text: { en: "Run the production prompt and both variants against the same set of test prompts.", fr: "Exécuter l'invite de production et les deux variantes sur le même jeu d'invites de test." } }
    - { id: d, text: { en: "Keep only the test prompts that the production prompt already answers well.", fr: "Ne conserver que les invites de test auxquelles l'invite de production répond déjà bien." } }
    - { id: e, text: { en: "Define the success thresholds before you run the experiment.", fr: "Définir les seuils de réussite avant d'exécuter l'expérience." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: Every variant must run against the same test prompts so that differences come from the variant, not from the inputs. Success criteria are set before the experiment to avoid rationalizing disappointing results afterward.
    fr: Chaque variante doit être exécutée sur les mêmes invites de test pour que les écarts viennent de la variante et non des entrées. Les critères de réussite sont fixés avant l'expérience pour éviter de justifier a posteriori des résultats décevants.
  options:
    a:
      en: Different inputs per variant make the comparison meaningless.
      fr: Des entrées différentes par variante rendent la comparaison vide de sens.
    b:
      en: Thresholds chosen after seeing the results invite rationalization.
      fr: Des seuils choisis après avoir vu les résultats encouragent les justifications a posteriori.
    d:
      en: The test set must be representative and include edge cases such as ambiguous or incomplete requests, not only easy cases.
      fr: Le jeu de test doit être représentatif et inclure des cas limites comme des demandes ambiguës ou incomplètes, pas seulement des cas faciles.
references:
  - title: Design evaluation experiments
    url: https://learn.microsoft.com/en-us/training/modules/evaluate-optimize-agents/2-design-evaluation-experiments
