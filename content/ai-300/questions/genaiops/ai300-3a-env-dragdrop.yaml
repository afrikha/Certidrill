id: ai300-3a-env-dragdrop
objective: "3.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Foundry resource named **foundry-lw** that contains the projects **proj-mkt** and **proj-legal**. foundry-lw has a private endpoint and several model deployments. You must meet the following requirements with the least administrative effort.

    What should you create for each requirement? To answer, drag the appropriate items to the correct requirements. Each item may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'une ressource Foundry nommée **foundry-lw** qui contient les projets **proj-mkt** et **proj-legal**. foundry-lw possède un point de terminaison privé et plusieurs déploiements de modèles. Vous devez répondre aux exigences suivantes avec le moins d'effort d'administration possible.

    Que devez-vous créer pour chaque exigence ? Pour répondre, faites glisser les éléments appropriés vers les exigences correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: res, text: { en: "A new Foundry resource", fr: "Une nouvelle ressource Foundry" } }
    - { id: proj, text: { en: "A new project on foundry-lw", fr: "Un nouveau projet sur foundry-lw" } }
    - { id: resconn, text: { en: "A connection at the foundry-lw resource level", fr: "Une connexion au niveau de la ressource foundry-lw" } }
    - { id: projconn, text: { en: "A connection in proj-legal", fr: "Une connexion dans proj-legal" } }
    - { id: dep, text: { en: "A new model deployment on foundry-lw", fr: "Un nouveau déploiement de modèle sur foundry-lw" } }
  targets:
    - id: t1
      text: { en: "The finance team needs a separate workspace with its own access control that uses the existing deployments and network settings.", fr: "L'équipe financière a besoin d'un espace de travail distinct, avec son propre contrôle d'accès, qui utilise les déploiements et les paramètres réseau existants." }
    - id: t2
      text: { en: "An Azure AI Search service must be usable from every current and future project of foundry-lw.", fr: "Un service Azure AI Search doit être utilisable depuis tous les projets actuels et futurs de foundry-lw." }
    - id: t3
      text: { en: "A third-party API key must be usable only from proj-legal.", fr: "Une clé API tierce doit être utilisable uniquement depuis proj-legal." }
answer:
  mapping: { t1: proj, t2: resconn, t3: projconn }
explanation:
  correct:
    en: |
      A new project on the existing resource gets its own access control while sharing the parent's network security and deployments. Connections created at the parent resource level are available to all its projects, while a connection created in a project is scoped to that project.
    fr: |
      Un nouveau projet sur la ressource existante dispose de son propre contrôle d'accès tout en partageant la sécurité réseau et les déploiements de son parent. Les connexions créées au niveau de la ressource parente sont disponibles pour tous ses projets, alors qu'une connexion créée dans un projet est limitée à ce projet.
  options:
    res:
      en: |
        A new Foundry resource would require new deployments and network settings instead of reusing those of foundry-lw.
      fr: |
        Une nouvelle ressource Foundry exigerait de nouveaux déploiements et de nouveaux paramètres réseau au lieu de réutiliser ceux de foundry-lw.
    dep:
      en: |
        Deployments are already shared by the projects of foundry-lw; a new deployment meets none of the requirements.
      fr: |
        Les déploiements sont déjà partagés par les projets de foundry-lw ; un nouveau déploiement ne répond à aucune des exigences.
references:
  - title: Create a project for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-projects
  - title: Microsoft Foundry rollout across my organization
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/planning
