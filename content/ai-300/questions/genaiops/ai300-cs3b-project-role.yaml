id: ai300-cs3b-project-role
objective: "3.1.2"
type: single
caseStudy: ai300-cs3b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    You need to grant Marta access to meet the access requirement.

    Which built-in role should you assign to Marta?
  fr: |
    Vous devez accorder à Marta l'accès qui respecte l'exigence d'accès.

    Quel rôle intégré devez-vous attribuer à Marta ?
body:
  options:
    - { id: a, text: Foundry Owner }
    - { id: b, text: Foundry Account Owner }
    - { id: c, text: Foundry Project Manager }
    - { id: d, text: Foundry User }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Foundry Project Manager (previously Azure AI Project Manager) includes the project data actions needed to build and evaluate, and it can assign only the Foundry User role, which is how Marta grants developers access to proj-newsroom. It can't manage model deployments, so requirement 6 is met with the least privilege.
    fr: |
      Foundry Project Manager (anciennement Azure AI Project Manager) inclut les actions de données de projet nécessaires pour créer et évaluer, et il ne peut attribuer que le rôle Foundry User, ce qui permet à Marta d'accorder l'accès à proj-newsroom aux développeurs. Il ne peut pas gérer les déploiements de modèles : l'exigence 6 est respectée avec le moindre privilège.
  options:
    a:
      en: |
        Foundry Owner is a highly privileged role that can also deploy models, which Marta must not be able to do.
      fr: |
        Foundry Owner est un rôle à privilèges élevés qui peut aussi déployer des modèles, ce que Marta ne doit pas pouvoir faire.
    b:
      en: |
        Foundry Account Owner manages accounts, projects and model deployments, but it doesn't include the project data actions needed to build in proj-newsroom.
      fr: |
        Foundry Account Owner gère les comptes, les projets et les déploiements de modèles, mais il n'inclut pas les actions de données de projet nécessaires pour créer dans proj-newsroom.
    d:
      en: |
        Foundry User lets Marta build in the project, but it can't assign roles, so she couldn't grant access to new developers.
      fr: |
        Foundry User permet à Marta de créer dans le projet, mais il ne peut pas attribuer de rôles : elle ne pourrait pas accorder l'accès aux nouveaux développeurs.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/rbac-foundry
