id: ai300-3a-team-lead-role
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Foundry resource named **foundry-adt**. A team lead named Lee must be able to:

    - perform management actions on the team's projects and build in them;
    - publish agents;
    - grant the Foundry User role to developers.

    Lee must not be able to create or manage model deployments or assign any other role. You need to assign a role to Lee at the foundry-adt scope. The solution must follow the principle of least privilege.

    Which role should you assign?
  fr: |
    Adatum dispose d'une ressource Foundry nommée **foundry-adt**. Un chef d'équipe nommé Lee doit pouvoir :

    - effectuer des actions de gestion sur les projets de l'équipe et y travailler ;
    - publier des agents ;
    - attribuer le rôle Foundry User aux développeurs.

    Lee ne doit pas pouvoir créer ni gérer de déploiements de modèles, ni attribuer d'autre rôle. Vous devez attribuer un rôle à Lee à l'étendue de foundry-adt. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer ?
body:
  options:
    - { id: a, text: Foundry Project Manager }
    - { id: b, text: Foundry Account Owner }
    - { id: c, text: Foundry Owner }
    - { id: d, text: Role Based Access Control Administrator }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Foundry Project Manager allows management actions on projects, building in them and publishing agents, and it can assign only the Foundry User role. It can read deployments and quota but can't create or delete deployments.
    fr: |
      Foundry Project Manager permet les actions de gestion sur les projets, le travail dans ces projets et la publication d'agents, et il ne peut attribuer que le rôle Foundry User. Il peut lire les déploiements et le quota, mais pas créer ni supprimer de déploiements.
  options:
    b:
      en: |
        Foundry Account Owner manages models and can assign ACR and monitoring roles, but it can't build in projects or publish agents.
      fr: |
        Foundry Account Owner gère les modèles et peut attribuer les rôles ACR et de surveillance, mais il ne peut ni travailler dans les projets ni publier d'agents.
    c:
      en: |
        Foundry Owner also manages models and assigns ACR and monitoring roles, which Lee must not do.
      fr: |
        Foundry Owner gère aussi les modèles et attribue les rôles ACR et de surveillance, ce que Lee ne doit pas faire.
    d:
      en: |
        Role Based Access Control Administrator manages role assignments but grants no Foundry project management, build or publishing permissions.
      fr: |
        Role Based Access Control Administrator gère les attributions de rôles, mais n'accorde aucune autorisation de gestion de projet, de développement ni de publication dans Foundry.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
