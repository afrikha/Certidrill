id: ai300-3b-upgrade-policy-text
objective: "3.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a Microsoft Foundry resource with three Global Standard deployments, one per application:

    - **lab-chat**: the innovation lab wants each new default model version within two weeks of its release as default.
    - **claims-chat**: the claims team keeps its current version and moves automatically to the default version only when its version retires.
    - **audit-chat**: the audit team must approve every version change; the deployment must never change version on its own.

    Which version update policy should you set for each deployment? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'une ressource Microsoft Foundry avec trois déploiements Global Standard, un par application :

    - **lab-chat** : le laboratoire d'innovation veut chaque nouvelle version par défaut du modèle dans les deux semaines suivant sa désignation comme version par défaut.
    - **claims-chat** : l'équipe des sinistres conserve sa version actuelle et passe automatiquement à la version par défaut uniquement lorsque sa version est mise hors service.
    - **audit-chat** : l'équipe d'audit doit approuver chaque changement de version ; le déploiement ne doit jamais changer de version de lui-même.

    Quelle stratégie de mise à jour de version devez-vous définir pour chaque déploiement ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      lab-chat: [[lab]]

      claims-chat: [[claims]]

      audit-chat: [[audit]]
    fr: |
      lab-chat : [[lab]]

      claims-chat : [[claims]]

      audit-chat : [[audit]]
  slots:
    - id: lab
      options:
        - { id: lnew, text: OnceNewDefaultVersionAvailable }
        - { id: lexp, text: OnceCurrentVersionExpired }
        - { id: lno, text: NoAutoUpgrade }
    - id: claims
      options:
        - { id: cnew, text: OnceNewDefaultVersionAvailable }
        - { id: cexp, text: OnceCurrentVersionExpired }
        - { id: cno, text: NoAutoUpgrade }
    - id: audit
      options:
        - { id: anew, text: OnceNewDefaultVersionAvailable }
        - { id: aexp, text: OnceCurrentVersionExpired }
        - { id: ano, text: NoAutoUpgrade }
answer:
  values: { lab: lnew, claims: cexp, audit: ano }
explanation:
  correct:
    en: |
      OnceNewDefaultVersionAvailable upgrades the deployment within two weeks after a new version becomes the default. OnceCurrentVersionExpired keeps the selected version until its retirement date and then upgrades to the current default. NoAutoUpgrade never upgrades; the team must migrate before retirement, because the deployment stops working when its version retires.
    fr: |
      OnceNewDefaultVersionAvailable met à niveau le déploiement dans les deux semaines suivant la désignation d'une nouvelle version par défaut. OnceCurrentVersionExpired conserve la version choisie jusqu'à sa date de mise hors service, puis passe à la version par défaut actuelle. NoAutoUpgrade ne met jamais à niveau ; l'équipe doit migrer avant la mise hors service, car le déploiement cesse de fonctionner lorsque sa version est mise hors service.
references:
  - title: Azure OpenAI in Microsoft Foundry Models working with models
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/working-with-models
