id: ai300-3b-retirement-alerts
objective: "3.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs several Global Standard deployments in Microsoft Foundry resources. The operations team, which doesn't include the subscription owners, must be warned before the model version of any deployment retires, so that it can test a replacement in time.

    Which two solutions meet the requirement? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute plusieurs déploiements Global Standard dans des ressources Microsoft Foundry. L'équipe d'exploitation, dont ne font pas partie les propriétaires des abonnements, doit être avertie avant la mise hors service de la version de modèle de tout déploiement, afin de tester un remplaçant à temps.

    Quelles sont les deux solutions qui répondent à l'exigence ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a Service Health alert rule for health advisories of the Azure OpenAI Service service that notifies the team.", fr: "Créer une règle d'alerte Service Health pour les avis d'intégrité du service Azure OpenAI Service qui avertit l'équipe." } }
    - { id: b, text: { en: "Create a metric alert on Azure OpenAI Requests for responses with status code 410 that notifies the team.", fr: "Créer une alerte de métrique sur Azure OpenAI Requests pour les réponses de code d'état 410 qui avertit l'équipe." } }
    - { id: c, text: { en: "Schedule a job that reads lifecycleStatus and deprecation.inference from the Models API and notifies the team.", fr: "Planifier un travail qui lit lifecycleStatus et deprecation.inference dans l'API Models et avertit l'équipe." } }
    - { id: d, text: { en: "Create an activity log alert on write operations to the deployments that notifies the team.", fr: "Créer une alerte de journal d'activité sur les opérations d'écriture des déploiements qui avertit l'équipe." } }
    - { id: e, text: { en: "Create a metric alert on Provisioned-managed utilization V2 that notifies the team.", fr: "Créer une alerte de métrique sur Provisioned-managed utilization V2 qui avertit l'équipe." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Retirement notices appear as health advisories in Azure Service Health, where you filter on Azure OpenAI Service and create an alert rule. The Models API also exposes the lifecycle status and deprecation dates programmatically. Both warn ahead of retirement, whereas the automatic emails go only to subscription owners with active deployments.
    fr: |
      Les avis de mise hors service apparaissent comme avis d'intégrité dans Azure Service Health, où vous filtrez sur Azure OpenAI Service et créez une règle d'alerte. L'API Models expose aussi par programmation l'état du cycle de vie et les dates de dépréciation. Ces deux solutions avertissent avant la mise hors service, alors que les e-mails automatiques ne sont envoyés qu'aux propriétaires des abonnements qui ont des déploiements actifs.
  options:
    b: { en: "Retired models return 410 Gone, so this alert fires only after the retirement, not before.", fr: "Les modèles mis hors service renvoient 410 Gone : cette alerte ne se déclenche qu'après la mise hors service, pas avant." }
    d: { en: "Activity log alerts on writes report changes made to deployments, not upcoming retirements.", fr: "Les alertes de journal d'activité sur les écritures signalent les modifications apportées aux déploiements, pas les mises hors service à venir." }
    e: { en: "This metric measures the use of provisioned deployments; the deployments here are Global Standard, and the metric doesn't report retirements.", fr: "Cette métrique mesure l'utilisation des déploiements provisionnés ; les déploiements sont ici Global Standard, et la métrique ne signale pas les mises hors service." }
references:
  - title: Foundry Models lifecycle and support policy
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirements
