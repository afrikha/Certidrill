id: ai300-3b-ptu-quota-capacity
objective: "3.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum plans its first provisioned deployments in Microsoft Foundry and reviews how PTU quota, capacity and billing work.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prépare ses premiers déploiements provisionnés dans Microsoft Foundry et examine le fonctionnement du quota de PTU, de la capacité et de la facturation.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An Azure Reservation for PTUs guarantees that capacity is available in the region.", fr: "Une réservation Azure de PTU garantit que la capacité est disponible dans la région." } }
    - { id: b, text: { en: "PTU quota is the maximum number of PTUs you can deploy per subscription, region and deployment type, and it has no cost.", fr: "Le quota de PTU est le nombre maximal de PTU que vous pouvez déployer par abonnement, région et type de déploiement, et il n'a aucun coût." } }
    - { id: c, text: { en: "Global, Data Zone and Regional Provisioned deployments draw on a single PTU quota pool.", fr: "Les déploiements Global, Data Zone et Regional Provisioned puisent dans un seul pool de quota de PTU." } }
    - { id: d, text: { en: "Having enough PTU quota doesn't guarantee that a deployment of that size can be created.", fr: "Disposer d'un quota de PTU suffisant ne garantit pas qu'un déploiement de cette taille puisse être créé." } }
    - { id: e, text: { en: "Hourly billing of a provisioned deployment starts when it receives its first request.", fr: "La facturation horaire d'un déploiement provisionné commence lorsqu'il reçoit sa première requête." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Quota is a free policy limit per subscription, region and deployment type. Capacity is the PTUs actually available for a model version; if it's insufficient in the region, the deployment fails even with enough quota. That's why you create the deployment before buying a reservation.
    fr: |
      Le quota est une limite de stratégie gratuite par abonnement, région et type de déploiement. La capacité correspond aux PTU réellement disponibles pour une version de modèle ; si elle est insuffisante dans la région, le déploiement échoue même avec un quota suffisant. C'est pourquoi vous créez le déploiement avant d'acheter une réservation.
  options:
    a: { en: "A reservation is a billing discount; it doesn't guarantee capacity. Only deployments do.", fr: "Une réservation est une remise de facturation ; elle ne garantit pas la capacité. Seuls les déploiements la garantissent." }
    c: { en: "Global, Data Zone and Regional Provisioned are separate quota pools.", fr: "Global, Data Zone et Regional Provisioned sont des pools de quota distincts." }
    e: { en: "The meter starts when the deployment is created and stops when it's deleted, whatever the traffic.", fr: "Le compteur démarre à la création du déploiement et s'arrête à sa suppression, quel que soit le trafic." }
references:
  - title: Provisioned throughput for Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/provisioned-throughput
