id: ai300-3c-playground-compare
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Microsoft Foundry project with three chat model deployments. A prompt engineer is iterating on a new system message and wants to see, for each change, how the three models respond to the same user input with the same system message and parameters, including their latency and token throughput.

    The solution must minimize effort and must not require writing code.

    What should the prompt engineer use?
  fr: |
    Adatum dispose d'un projet Microsoft Foundry avec trois déploiements de modèles de conversation. Un ingénieur d'invite fait évoluer un nouveau message système et souhaite voir, à chaque modification, comment les trois modèles répondent à la même entrée utilisateur avec le même message système et les mêmes paramètres, y compris leur latence et leur débit de jetons.

    La solution doit réduire l'effort au minimum et ne doit pas nécessiter d'écrire du code.

    Que doit utiliser l'ingénieur d'invite ?
body:
  options:
    - id: a
      text: { en: "Three browser tabs, each with the Agents playground open", fr: "Trois onglets de navigateur, chacun avec le terrain de jeu des agents ouvert" }
    - id: b
      text: { en: "Compare mode in the Model playground", fr: "Le mode de comparaison du terrain de jeu des modèles" }
    - id: c
      text: { en: "The grid view of the Images playground", fr: "La vue en grille du terrain de jeu des images" }
    - id: d
      text: { en: "An evaluation run for each deployment after each change", fr: "Une exécution d'évaluation par déploiement après chaque modification" }
answer: { optionId: b }
explanation:
  correct:
    en: Compare mode in the Model playground shows up to three models side by side. Each model receives the same prompt, system message and parameters (sync can be turned off per model), and responses stream in real time so you can compare quality, latency and token throughput.
    fr: Le mode de comparaison du terrain de jeu des modèles affiche jusqu'à trois modèles côte à côte. Chaque modèle reçoit la même invite, le même message système et les mêmes paramètres (la synchronisation peut être désactivée par modèle), et les réponses arrivent en temps réel pour comparer qualité, latence et débit de jetons.
  options:
    a:
      en: Separate playground sessions require you to copy every change three times and do not keep the inputs synchronized.
      fr: Des sessions de terrain de jeu séparées obligent à recopier chaque modification trois fois et ne synchronisent pas les entrées.
    c:
      en: The grid view of the Images playground is for image generation, not chat models.
      fr: La vue en grille du terrain de jeu des images sert à la génération d'images, pas aux modèles de conversation.
    d:
      en: Evaluation runs need a dataset and run asynchronously; they do not give the quick interactive comparison wanted for each change.
      fr: Les exécutions d'évaluation nécessitent un jeu de données et s'exécutent de façon asynchrone ; elles n'offrent pas la comparaison interactive rapide souhaitée à chaque modification.
references:
  - title: Microsoft Foundry Playgrounds
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds
