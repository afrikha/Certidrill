id: ai300-3b-spillover-headers
objective: "3.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Foundry resource with a Global Provisioned deployment named **claims-ptu** and a Global Standard deployment named **claims-std** that runs the same model and version. The `spilloverDeploymentName` property isn't set on claims-ptu.

    When claims-ptu is fully used, only the requests of the interactive claims application must spill over to claims-std; the nightly scoring job must not. The interactive application must also log whether each response was served after a spillover.

    How should you complete the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une ressource Microsoft Foundry avec un déploiement Global Provisioned nommé **claims-ptu** et un déploiement Global Standard nommé **claims-std** qui exécute le même modèle et la même version. La propriété `spilloverDeploymentName` n'est pas définie sur claims-ptu.

    Lorsque claims-ptu est entièrement utilisé, seules les requêtes de l'application interactive de sinistres doivent déborder vers claims-std ; le travail de scoring nocturne ne doit pas déborder. L'application interactive doit aussi journaliser si chaque réponse a été servie après un débordement.

    Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In each request to claims-ptu, the interactive application adds the [[h1]] header with the value [[v1]].

      To detect a spilled-over request, the application checks whether the response contains the [[h2]] header.
    fr: |
      Dans chaque requête adressée à claims-ptu, l'application interactive ajoute l'en-tête [[h1]] avec la valeur [[v1]].

      Pour détecter une requête en débordement, l'application vérifie si la réponse contient l'en-tête [[h2]].
  slots:
    - id: h1
      options:
        - { id: a1, text: x-ms-deployment-name }
        - { id: a2, text: x-ms-spillover-deployment }
        - { id: a3, text: x-ms-spillover-from-deployment }
        - { id: a4, text: retry-after-ms }
    - id: v1
      options:
        - { id: b1, text: claims-ptu }
        - { id: b2, text: claims-std }
        - { id: b3, text: GlobalStandard }
    - id: h2
      options:
        - { id: c1, text: x-ms-spillover-deployment }
        - { id: c2, text: x-ratelimit-remaining-tokens }
        - { id: c3, text: retry-after-ms }
        - { id: c4, text: x-ms-spillover-from-deployment }
answer:
  values: { h1: a2, v1: b2, h2: c4 }
explanation:
  correct:
    en: |
      Per-request spillover is enabled with the x-ms-spillover-deployment header set to the name of the standard deployment; requests without the header don't spill over. A spilled-over response carries x-ms-spillover-from-deployment with the name of the provisioned deployment. The deployment-level property isn't used here because it would apply to every caller and takes precedence over the header.
    fr: |
      Le débordement par requête s'active avec l'en-tête x-ms-spillover-deployment défini sur le nom du déploiement standard ; les requêtes sans cet en-tête ne débordent pas. Une réponse en débordement contient x-ms-spillover-from-deployment avec le nom du déploiement provisionné. La propriété au niveau du déploiement n'est pas utilisée ici, car elle s'appliquerait à tous les appelants et a priorité sur l'en-tête.
  options:
    a1: { en: "x-ms-deployment-name is a response header that names the deployment that served the request.", fr: "x-ms-deployment-name est un en-tête de réponse qui indique le déploiement ayant servi la requête." }
    a3: { en: "x-ms-spillover-from-deployment is returned by the service; the client doesn't send it.", fr: "x-ms-spillover-from-deployment est renvoyé par le service ; le client ne l'envoie pas." }
    a4: { en: "retry-after-ms is returned with a 429 to say how long to wait.", fr: "retry-after-ms est renvoyé avec une réponse 429 pour indiquer le délai d'attente." }
    b1: { en: "The header names the target standard deployment, not the provisioned one.", fr: "L'en-tête désigne le déploiement standard cible, pas le déploiement provisionné." }
    b3: { en: "The value is a deployment name, not a deployment type.", fr: "La valeur est un nom de déploiement, pas un type de déploiement." }
    c1: { en: "x-ms-spillover-deployment is the request header that the client sends.", fr: "x-ms-spillover-deployment est l'en-tête de requête envoyé par le client." }
    c2: { en: "x-ratelimit-remaining-tokens reports remaining rate limit, not spillover.", fr: "x-ratelimit-remaining-tokens indique la limite de débit restante, pas le débordement." }
    c3: { en: "retry-after-ms appears on throttled responses, not on responses served by spillover.", fr: "retry-after-ms apparaît sur les réponses limitées, pas sur les réponses servies par débordement." }
references:
  - title: Manage traffic with spillover for provisioned deployments
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/spillover-traffic-management
