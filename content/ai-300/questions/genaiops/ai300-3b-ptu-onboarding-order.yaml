id: ai300-3b-ptu-onboarding-order
objective: "3.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware wants to move a high-volume customer service workload to a Global Provisioned deployment in a Microsoft Foundry project. Finance requires the discounted rate of a one-year Azure Reservation, but doesn't want to pay for reserved PTUs that can't be deployed.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware souhaite déplacer une charge de travail de service client à volume élevé vers un déploiement Global Provisioned dans un projet Microsoft Foundry. Le service financier exige le tarif réduit d'une réservation Azure d'un an, mais ne veut pas payer des PTU réservées qui ne pourraient pas être déployées.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: size, text: { en: "Estimate the required PTUs with the capacity calculator.", fr: "Estimer les PTU nécessaires avec le calculateur de capacité." } }
    - { id: quota, text: { en: "Check the Global Provisioned PTU quota in the region, and request more if needed.", fr: "Vérifier le quota de PTU Global Provisioned dans la région et en demander davantage si nécessaire." } }
    - { id: deploy, text: { en: "Create the Global Provisioned deployment.", fr: "Créer le déploiement Global Provisioned." } }
    - { id: reserve, text: { en: "Purchase a Global Provisioned reservation whose scope includes the deployment.", fr: "Acheter une réservation Global Provisioned dont l'étendue inclut le déploiement." } }
    - { id: tpm, text: { en: "Request a TPM quota increase for a Global Standard deployment.", fr: "Demander une augmentation du quota de TPM pour un déploiement Global Standard." } }
    - { id: scale, text: { en: "Schedule a nightly scale-down of the deployment to zero PTUs.", fr: "Planifier une réduction nocturne du déploiement à zéro PTU." } }
answer:
  sequence: [ size, quota, deploy, reserve ]
explanation:
  correct:
    en: |
      You size the workload first (request shape, output-to-input ratio, cache rate), then make sure the quota for that deployment type and region covers it. Creating the deployment confirms that capacity is available, because neither quota nor reservations guarantee capacity. You then buy the reservation, matched by deployment type and scope.
    fr: |
      Vous dimensionnez d'abord la charge de travail (forme des requêtes, ratio sortie/entrée, taux de cache), puis vous vérifiez que le quota de ce type de déploiement et de cette région la couvre. La création du déploiement confirme que la capacité est disponible, car ni le quota ni les réservations ne garantissent la capacité. Vous achetez ensuite la réservation, qui correspond par type de déploiement et par étendue.
  options:
    tpm:
      en: |
        TPM quota applies to pay-per-token standard deployments, not to provisioned throughput.
      fr: |
        Le quota de TPM s'applique aux déploiements standard facturés au jeton, pas au débit approvisionné.
    scale:
      en: |
        Microsoft advises against scaling provisioned deployments up and down with traffic, because released capacity might not be available again; a deployment also has a minimum PTU count.
      fr: |
        Microsoft déconseille d'augmenter et de réduire les déploiements provisionnés au rythme du trafic, car la capacité libérée pourrait ne plus être disponible ; un déploiement a aussi un nombre minimal de PTU.
references:
  - title: Provisioned throughput for Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/provisioned-throughput
  - title: Provisioned throughput billing and cost management
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput-billing
