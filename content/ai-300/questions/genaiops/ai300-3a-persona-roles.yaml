id: ai300-3a-persona-roles
objective: "3.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso is rolling out a Foundry resource named **foundry-ent** and its projects. You must assign a built-in role to each persona. Each persona must receive only the permissions it needs.

    Which role should you assign to each persona? To answer, drag the appropriate roles to the correct personas. Each role may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso déploie une ressource Foundry nommée **foundry-ent** et ses projets. Vous devez attribuer un rôle intégré à chaque profil. Chaque profil ne doit recevoir que les autorisations dont il a besoin.

    Quel rôle devez-vous attribuer à chaque profil ? Pour répondre, faites glisser les rôles appropriés vers les profils correspondants. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: owner, text: Foundry Owner }
    - { id: acct, text: Foundry Account Owner }
    - { id: user, text: Foundry User }
    - { id: consumer, text: Foundry Agent Consumer }
    - { id: reader, text: Reader }
    - { id: contrib, text: Contributor }
  targets:
    - id: admin
      text: { en: "Platform managers: create Foundry resources and projects, deploy models, create shared connections and grant Foundry User to others; they must not build in projects.", fr: "Responsables de plateforme : créer des ressources et des projets Foundry, déployer des modèles, créer des connexions partagées et attribuer Foundry User à d'autres personnes ; ils ne doivent pas travailler dans les projets." }
    - id: dev
      text: { en: "Developers: build and test agents in an existing project with pre-deployed models and connections.", fr: "Développeurs : créer et tester des agents dans un projet existant avec des modèles et des connexions déjà déployés." }
    - id: audit
      text: { en: "Auditors: view the configuration of the Foundry resource and its projects without changing anything or using data actions.", fr: "Auditeurs : consulter la configuration de la ressource Foundry et de ses projets sans rien modifier ni utiliser d'actions de données." }
answer:
  mapping: { admin: acct, dev: user, audit: reader }
explanation:
  correct:
    en: |
      Foundry Account Owner creates accounts and projects, manages models and can assign Foundry User, but has no data actions to build in projects. Foundry User is the least-privilege role for developers who build and test agents. Reader gives read access to projects and accounts only.
    fr: |
      Foundry Account Owner crée des comptes et des projets, gère les modèles et peut attribuer Foundry User, mais n'a pas d'actions de données pour travailler dans les projets. Foundry User est le rôle de moindre privilège pour les développeurs qui créent et testent des agents. Reader donne uniquement un accès en lecture aux projets et aux comptes.
  options:
    owner:
      en: |
        Foundry Owner also builds in projects and publishes agents, which is more than any of the personas needs.
      fr: |
        Foundry Owner travaille aussi dans les projets et publie des agents, ce qui dépasse les besoins de chacun des profils.
    contrib:
      en: |
        Contributor can't complete role assignments, so platform managers couldn't grant Foundry User.
      fr: |
        Contributor ne peut pas effectuer d'attributions de rôles : les responsables de plateforme ne pourraient pas attribuer Foundry User.
    consumer:
      en: |
        Foundry Agent Consumer only interacts with agent endpoints; developers couldn't build agents.
      fr: |
        Foundry Agent Consumer interagit seulement avec les points de terminaison des agents ; les développeurs ne pourraient pas créer d'agents.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
