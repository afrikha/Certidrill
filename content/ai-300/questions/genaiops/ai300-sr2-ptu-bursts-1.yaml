id: ai300-sr2-ptu-bursts-1
objective: "3.2.4"
type: series_yesno
series: ai300-sr2-ptu-bursts
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You enable traffic spillover on claims-ptu to a standard deployment of the same model and version.
  fr: Vous activez le débordement du trafic (spillover) de claims-ptu vers un déploiement standard du même modèle et de la même version.
body:
  solution:
    en: |
      In nw-foundry, you create a Data Zone Standard deployment named **claims-std** of the same model and model version as claims-ptu. In the deployment settings of claims-ptu, you enable **Traffic spillover** and select claims-std as the spillover deployment.
    fr: |
      Dans nw-foundry, vous créez un déploiement Data Zone Standard nommé **claims-std** du même modèle et de la même version de modèle que claims-ptu. Dans les paramètres de déploiement de claims-ptu, vous activez **Traffic spillover** et sélectionnez claims-std comme déploiement de débordement.
answer: { value: true }
explanation:
  correct:
    en: When spillover is enabled on the deployment, requests that receive a 429 because the PTUs are fully used are automatically routed to the standard deployment, with no change to the client requests. Requests served by claims-ptu stay covered by the hourly provisioned cost, and only the overflow is billed per token on claims-std, so no extra provisioned capacity is bought for the bursts.
    fr: "Quand le débordement est activé sur le déploiement, les requêtes qui reçoivent une réponse 429 parce que les PTU sont entièrement utilisées sont automatiquement routées vers le déploiement standard, sans modifier les requêtes du client. Les requêtes traitées par claims-ptu restent couvertes par le coût horaire du déploiement provisionné, et seul l'excédent est facturé au jeton sur claims-std : aucune capacité approvisionnée supplémentaire n'est achetée pour les pics."
references:
  - title: Manage traffic with spillover for provisioned deployments - Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/spillover-traffic-management
