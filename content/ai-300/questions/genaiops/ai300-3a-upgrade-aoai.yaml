id: ai300-3a-upgrade-aoai
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an Azure OpenAI resource named **aoai-tailspin** with several model deployments, completed fine-tuning jobs and stored completions. Ten applications call the resource by using its endpoint and API keys.

    You need aoai-tailspin itself to support Foundry projects, Agent Service and the broader model catalog. The applications must keep using the same endpoint and API keys, and the existing state must be kept.

    What should you do?
  fr: |
    Tailspin dispose d'une ressource Azure OpenAI nommée **aoai-tailspin** avec plusieurs déploiements de modèles, des travaux de réglage précis terminés et des complétions stockées. Dix applications appellent la ressource à l'aide de son point de terminaison et de ses clés API.

    Vous devez faire en sorte qu'aoai-tailspin elle-même prenne en charge les projets Foundry, Agent Service et le catalogue de modèles étendu. Les applications doivent continuer à utiliser le même point de terminaison et les mêmes clés API, et l'état existant doit être conservé.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a Foundry resource, redeploy the models in it, and add a connection to aoai-tailspin.", fr: "Créer une ressource Foundry, y redéployer les modèles et ajouter une connexion vers aoai-tailspin." } }
    - { id: b, text: { en: "Enable a system-assigned managed identity on aoai-tailspin and change nothing else.", fr: "Activer une identité managée affectée par le système sur aoai-tailspin sans rien modifier d'autre." } }
    - { id: c, text: { en: "Upgrade aoai-tailspin to a Foundry resource and create its first project.", fr: "Mettre à niveau aoai-tailspin vers une ressource Foundry et créer son premier projet." } }
    - { id: d, text: { en: "Create a Foundry project in a new Foundry resource and move aoai-tailspin into it.", fr: "Créer un projet Foundry dans une nouvelle ressource Foundry et y déplacer aoai-tailspin." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An Azure OpenAI resource can be upgraded to a Foundry resource while its endpoint, API keys and existing state are preserved. After the upgrade, the resource hosts projects and gives access to Agent Service and the broader model catalog.
    fr: |
      Une ressource Azure OpenAI peut être mise à niveau vers une ressource Foundry en conservant son point de terminaison, ses clés API et son état existant. Après la mise à niveau, la ressource héberge des projets et donne accès à Agent Service et au catalogue de modèles étendu.
  options:
    a:
      en: |
        The new resource has a different endpoint and keys, and aoai-tailspin itself still doesn't support projects.
      fr: |
        La nouvelle ressource a un point de terminaison et des clés différents, et aoai-tailspin elle-même ne prend toujours pas en charge les projets.
    b:
      en: |
        A system-assigned identity is a prerequisite of the upgrade, but on its own it doesn't change the resource type.
      fr: |
        Une identité affectée par le système est un prérequis de la mise à niveau, mais à elle seule elle ne change pas le type de ressource.
    d:
      en: |
        An Azure resource can't be moved into a project; projects are child resources of a Foundry resource.
      fr: |
        Une ressource Azure ne peut pas être déplacée dans un projet ; les projets sont des ressources enfants d'une ressource Foundry.
references:
  - title: What is Microsoft Foundry?
    url: https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry
