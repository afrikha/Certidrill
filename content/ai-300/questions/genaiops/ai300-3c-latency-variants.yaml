id: ai300-3c-latency-variants
objective: "3.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has a customer agent in Microsoft Foundry. Its average end-to-end response time, measured from the request until the complete answer is received, is 34 seconds, and the target is under 30 seconds. The model must not change.

    You plan to create prompt and configuration variants and compare them against the current version.

    Which two variants can reduce the end-to-end response time? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un agent client dans Microsoft Foundry. Son temps de réponse de bout en bout moyen, mesuré de la requête jusqu'à la réception de la réponse complète, est de 34 secondes, alors que l'objectif est de moins de 30 secondes. Le modèle ne doit pas changer.

    Vous prévoyez de créer des variantes d'invite et de configuration et de les comparer à la version actuelle.

    Quelles sont les deux variantes qui peuvent réduire le temps de réponse de bout en bout ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A variant with shorter, more focused system instructions", fr: "Une variante avec des instructions système plus courtes et plus ciblées" } }
    - { id: b, text: { en: "A variant with streaming enabled (stream set to true)", fr: "Une variante avec le streaming activé (stream défini sur true)" } }
    - { id: c, text: { en: "A variant with three additional few-shot examples", fr: "Une variante avec trois exemples few-shot supplémentaires" } }
    - { id: d, text: { en: "A variant with a lower max_tokens value", fr: "Une variante avec une valeur max_tokens plus basse" } }
    - { id: e, text: { en: "A variant with a higher temperature", fr: "Une variante avec une température plus élevée" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Response time depends on the model, the prompt length and the generation size. A shorter prompt reduces latency, and a lower max_tokens limits the generated length, which reduces cost and latency (at the risk of truncating useful content, which the comparison must check).
    fr: Le temps de réponse dépend du modèle, de la longueur de l'invite et de la taille de la génération. Une invite plus courte réduit la latence, et une valeur max_tokens plus basse limite la longueur générée, ce qui réduit le coût et la latence (au risque de tronquer du contenu utile, ce que la comparaison doit vérifier).
  options:
    b:
      en: Streaming improves perceived responsiveness (time to first token) but does not change the total response time.
      fr: Le streaming améliore la réactivité perçue (délai jusqu'au premier jeton) mais ne change pas le temps de réponse total.
    c:
      en: More examples make the prompt longer, which tends to increase latency.
      fr: Davantage d'exemples allongent l'invite, ce qui tend à augmenter la latence.
    e:
      en: Temperature controls randomness, not speed.
      fr: La température contrôle le caractère aléatoire, pas la vitesse.
references:
  - title: Design evaluation experiments
    url: https://learn.microsoft.com/en-us/training/modules/evaluate-optimize-agents/2-design-evaluation-experiments
