id: ai300-3b-bicep-pinned-version
objective: "3.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso deploys a chat model in a Microsoft Foundry resource named **ais-contoso-eu** by using Bicep. The deployment must meet the following requirements:

    - Requests must use data zone processing in the EU data zone and be billed per token.
    - The deployment stays on gpt-4.1 version 2025-04-14 and never upgrades automatically.

    How should you complete the Bicep file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso déploie un modèle de conversation dans une ressource Microsoft Foundry nommée **ais-contoso-eu** à l'aide de Bicep. Le déploiement doit répondre aux exigences suivantes :

    - Les requêtes doivent utiliser le traitement en zone de données dans la zone de données UE et être facturées au jeton.
    - Le déploiement reste sur gpt-4.1 version 2025-04-14 et n'est jamais mis à niveau automatiquement.

    Comment devez-vous compléter le fichier Bicep ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    resource account 'Microsoft.CognitiveServices/accounts@2025-06-01' existing = {
      name: 'ais-contoso-eu'
    }

    resource chat 'Microsoft.CognitiveServices/accounts/deployments@2025-06-01' = {
      parent: account
      name: 'chat-prod'
      sku: {
        name: [[sku]]
        capacity: 100
      }
      properties: {
        model: {
          format: 'OpenAI'
          name: 'gpt-4.1'
          version: '2025-04-14'
        }
        [[key]]: [[value]]
      }
    }
  slots:
    - id: sku
      options:
        - { id: s1, text: "'GlobalStandard'" }
        - { id: s2, text: "'DataZoneStandard'" }
        - { id: s3, text: "'DataZoneProvisionedManaged'" }
        - { id: s4, text: "'Standard'" }
    - id: key
      options:
        - { id: k1, text: raiPolicyName }
        - { id: k2, text: deploymentState }
        - { id: k3, text: versionUpgradeOption }
    - id: value
      options:
        - { id: v1, text: "'OnceCurrentVersionExpired'" }
        - { id: v2, text: "'NoAutoUpgrade'" }
        - { id: v3, text: "'OnceNewDefaultVersionAvailable'" }
        - { id: v4, text: "'Paused'" }
answer:
  values: { sku: s2, key: k3, value: v2 }
explanation:
  correct:
    en: "DataZoneStandard is billed per token and processes data only within the Microsoft-specified data zone (EU here). The `versionUpgradeOption` property set to `NoAutoUpgrade` keeps the pinned version: the deployment never upgrades on its own, so the team must migrate before the version retires."
    fr: "DataZoneStandard est facturé au jeton et ne traite les données que dans la zone de données définie par Microsoft (ici l'UE). La propriété `versionUpgradeOption` définie sur `NoAutoUpgrade` conserve la version fixée : le déploiement n'est jamais mis à niveau de lui-même, et l'équipe doit donc migrer avant la mise hors service de la version."
  options:
    s1: { en: "GlobalStandard may process data in any Azure region.", fr: "GlobalStandard peut traiter les données dans n'importe quelle région Azure." }
    s3: { en: "DataZoneProvisionedManaged bills reserved PTUs per hour, not per token.", fr: "DataZoneProvisionedManaged facture des PTU réservées à l'heure, pas au jeton." }
    s4: { en: "Standard processes data within the Azure geography of the resource; it isn't a data zone deployment type.", fr: "Standard traite les données dans la zone géographique Azure de la ressource ; ce n'est pas un type de déploiement en zone de données." }
    k1: { en: "raiPolicyName selects the content filtering policy.", fr: "raiPolicyName sélectionne la stratégie de filtrage de contenu." }
    k2: { en: "deploymentState sets whether the deployment is Running or Paused.", fr: "deploymentState indique si le déploiement est Running ou Paused." }
    v1: { en: "OnceCurrentVersionExpired upgrades the deployment automatically when its version retires.", fr: "OnceCurrentVersionExpired met à niveau le déploiement automatiquement à la mise hors service de sa version." }
    v3: { en: "OnceNewDefaultVersionAvailable upgrades within two weeks of a new default version.", fr: "OnceNewDefaultVersionAvailable met à niveau dans les deux semaines suivant une nouvelle version par défaut." }
    v4: { en: "Paused is a value of deploymentState, not of the upgrade policy.", fr: "Paused est une valeur de deploymentState, pas de la stratégie de mise à niveau." }
references:
  - title: Microsoft.CognitiveServices/accounts/deployments - Bicep, ARM template & Terraform AzAPI reference
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.cognitiveservices/accounts/deployments
  - title: Understanding deployment types in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
