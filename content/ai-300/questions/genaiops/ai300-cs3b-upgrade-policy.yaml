id: ai300-cs3b-upgrade-policy
objective: "3.2.3"
type: single
caseStudy: ai300-cs3b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    You need to change the `versionUpgradeOption` property of gpt-newsroom to meet model deployment requirement 5.

    Which value should you set?
  fr: |
    Vous devez modifier la propriété `versionUpgradeOption` de gpt-newsroom pour respecter l'exigence 5 relative aux déploiements de modèles.

    Quelle valeur devez-vous définir ?
body:
  options:
    - { id: a, text: OnceNewDefaultVersionAvailable }
    - { id: b, text: OnceCurrentVersionExpired }
    - { id: c, text: NoAutoUpgrade }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With `NoAutoUpgrade`, the deployment never changes its model version automatically. When the version is retired, the deployment stops working instead of moving to an unvalidated version, which is acceptable because the team creates a new deployment for each validated version.
    fr: |
      Avec `NoAutoUpgrade`, le déploiement ne change jamais automatiquement de version de modèle. Quand la version est mise hors service, le déploiement cesse de fonctionner au lieu de passer à une version non validée, ce qui est acceptable puisque l'équipe crée un nouveau déploiement pour chaque version validée.
  options:
    a:
      en: |
        This is the current setting: the deployment moves to a new default version within two weeks of the default changing, before the editorial team validates it.
      fr: |
        C'est le réglage actuel : le déploiement passe à une nouvelle version par défaut dans les deux semaines qui suivent le changement de version par défaut, avant que l'équipe éditoriale ne la valide.
    b:
      en: |
        With `OnceCurrentVersionExpired`, the deployment keeps its version until retirement, but then upgrades automatically to the default version, which may not be validated.
      fr: |
        Avec `OnceCurrentVersionExpired`, le déploiement conserve sa version jusqu'à la mise hors service, mais passe alors automatiquement à la version par défaut, qui n'est peut-être pas validée.
references:
  - title: Azure OpenAI in Microsoft Foundry Models working with models
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/working-with-models
