id: ai300-3a-mvnet-setup-order
objective: "3.1.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam must create a Foundry resource named **foundry-fmv** whose agents run in a managed virtual network. Agents may reach only approved destinations, including a supplier API at `api.supplier.example`. You use `az rest` and the `az cognitiveservices account managed-network` commands.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam doit créer une ressource Foundry nommée **foundry-fmv** dont les agents s'exécutent dans un réseau virtuel managé. Les agents ne peuvent joindre que des destinations approuvées, dont une API fournisseur à l'adresse `api.supplier.example`. Vous utilisez `az rest` et les commandes `az cognitiveservices account managed-network`.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: acct, text: { en: "Create foundry-fmv with a networkInjections entry that sets useMicrosoftManagedNetwork to true.", fr: "Créer foundry-fmv avec une entrée networkInjections qui définit useMicrosoftManagedNetwork sur true." } }
    - { id: role, text: { en: "Assign the Azure AI Enterprise Network Connection Approver role to the managed identity of foundry-fmv.", fr: "Attribuer le rôle Azure AI Enterprise Network Connection Approver à l'identité managée de foundry-fmv." } }
    - { id: mnet, text: { en: "Create the managed network in allow_only_approved_outbound mode.", fr: "Créer le réseau managé en mode allow_only_approved_outbound." } }
    - { id: fqdn, text: { en: "Add an fqdn outbound rule for api.supplier.example.", fr: "Ajouter une règle de trafic sortant fqdn pour api.supplier.example." } }
    - { id: subnet, text: { en: "Create a subnet delegated to Microsoft.App/environments.", fr: "Créer un sous-réseau délégué à Microsoft.App/environments." } }
    - { id: portal, text: { en: "Enable the managed network on the Networking page of foundry-fmv in the Azure portal.", fr: "Activer le réseau managé sur la page Mise en réseau de foundry-fmv dans le portail Azure." } }
answer:
  sequence: [ acct, role, mnet, fqdn ]
explanation:
  correct:
    en: |
      `networkInjections` with `useMicrosoftManagedNetwork` must be set when the account is created. You then give the account's managed identity the Network Connection Approver role so that managed private endpoints are created and approved, create the managed network in Allow only approved outbound mode, and add the `fqdn` rule for the supplier API.
    fr: |
      `networkInjections` avec `useMicrosoftManagedNetwork` doit être défini à la création du compte. Vous donnez ensuite à l'identité managée du compte le rôle Network Connection Approver afin que les points de terminaison privés managés soient créés et approuvés, vous créez le réseau managé en mode Allow only approved outbound, puis vous ajoutez la règle `fqdn` pour l'API fournisseur.
  options:
    subnet:
      en: |
        With a managed virtual network, Microsoft handles the subnet range and delegation; a delegated subnet is for a custom virtual network.
      fr: |
        Avec un réseau virtuel managé, Microsoft gère la plage et la délégation du sous-réseau ; un sous-réseau délégué concerne un réseau virtuel personnalisé.
    portal:
      en: |
        The Azure portal doesn't currently support creating the managed network.
      fr: |
        Le portail Azure ne prend pas en charge actuellement la création du réseau managé.
references:
  - title: Configure managed virtual network for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/managed-virtual-network
