id: ai300-3c-experiment-workflow
objective: "3.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware wants to test a concise version of the system instructions of its agent in Microsoft Foundry. The repository contains the agent creation script, the prompt files and a run script that sends test prompts to the agent and saves the responses. The production prompt is on the main branch.

    You need to run the experiment with a Git-based workflow and promote the variant only if it outperforms production.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware veut tester une version concise des instructions système de son agent dans Microsoft Foundry. Le dépôt contient le script de création de l'agent, les fichiers d'invite et un script d'exécution qui envoie des invites de test à l'agent et enregistre les réponses. L'invite de production se trouve sur la branche main.

    Vous devez mener l'expérience avec un flux de travail basé sur Git et ne promouvoir la variante que si elle surpasse la production.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: branch, text: { en: "Create the experiment/prompt-v2-concise branch from main.", fr: "Créer la branche experiment/prompt-v2-concise à partir de main." } }
    - { id: prompts, text: { en: "Add the test prompts and the concise prompt file to the branch.", fr: "Ajouter les invites de test et le fichier d'invite concise à la branche." } }
    - { id: run, text: { en: "Run the agent creation script, and then run the test prompts to capture the responses.", fr: "Exécuter le script de création de l'agent, puis exécuter les invites de test pour recueillir les réponses." } }
    - { id: score, text: { en: "Score the responses and commit evaluation.csv to the experiment folder.", fr: "Noter les réponses et valider evaluation.csv dans le dossier de l'expérience." } }
    - { id: merge, text: { en: "Compare the results with main and merge the branch if it meets the criteria.", fr: "Comparer les résultats à ceux de main et fusionner la branche si elle satisfait les critères." } }
    - { id: early, text: { en: "Merge the branch into main so that the agent creation script deploys the variant.", fr: "Fusionner la branche dans main pour que le script de création de l'agent déploie la variante." } }
    - { id: portal, text: { en: "Edit the agent instructions in the Foundry portal to match the concise prompt.", fr: "Modifier les instructions de l'agent dans le portail Foundry pour reprendre l'invite concise." } }
answer:
  sequence: [ branch, prompts, run, score, merge ]
explanation:
  correct:
    en: Each experiment gets its own branch, with one change per branch. You store the test prompts and the variant prompt in the branch, deploy the agent version and run the test prompts to capture responses, score them in evaluation.csv, and then compare the branches and merge only the variant that meets the criteria.
    fr: Chaque expérience dispose de sa propre branche, avec une modification par branche. Vous stockez les invites de test et l'invite de la variante dans la branche, déployez la version de l'agent et exécutez les invites de test pour recueillir les réponses, notez-les dans evaluation.csv, puis comparez les branches et ne fusionnez que la variante qui satisfait les critères.
  options:
    early:
      en: Merging before the comparison would promote an untested prompt to production.
      fr: Fusionner avant la comparaison promouvrait en production une invite non testée.
    portal:
      en: Editing the instructions in the portal bypasses version control, so the experiment would not be tracked or reproducible.
      fr: "Modifier les instructions dans le portail contourne le contrôle de version : l'expérience ne serait ni tracée ni reproductible."
references:
  - title: Apply Git-based workflows to optimization experiments
    url: https://learn.microsoft.com/en-us/training/modules/evaluate-optimize-agents/3-git-based-experimentation-workflow
