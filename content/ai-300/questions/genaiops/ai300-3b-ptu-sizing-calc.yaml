id: ai300-3b-ptu-sizing-calc
objective: "3.2.4"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Northwind Traders sizes a Global Provisioned deployment of gpt-4.1 for a workload that peaks at 60,000 input tokens per minute and 6,000 output tokens per minute. The prompts don't use cached tokens.

    The sizing table for gpt-4.1 shows an input TPM per PTU of 3,000, an output-to-input ratio of 4, and a global deployment minimum of 15 PTUs with increments of 5.

    What is the smallest PTU count that you should deploy for the peak?
  fr: |
    Northwind Traders dimensionne un déploiement Global Provisioned de gpt-4.1 pour une charge de travail qui culmine à 60 000 jetons d'entrée par minute et 6 000 jetons de sortie par minute. Les invites n'utilisent pas de jetons en cache.

    Le tableau de dimensionnement de gpt-4.1 indique un TPM d'entrée par PTU de 3 000, un ratio sortie/entrée de 4, et un minimum de 15 PTU pour un déploiement global, par incréments de 5.

    Quel est le plus petit nombre de PTU à déployer pour la pointe ?
body:
  options:
    - { id: a, text: "20" }
    - { id: b, text: "30" }
    - { id: c, text: "50" }
    - { id: d, text: "84" }
answer: { optionId: b }
explanation:
  correct:
    en: "Normalized TPM = input TPM × (1 − cache rate) + output-to-input ratio × output TPM = 60,000 + 4 × 6,000 = 84,000. Dividing by 3,000 input TPM per PTU gives 28 PTUs, which rounds up to the next increment of 5: 30 PTUs. The capacity calculator in the Foundry portal performs the same estimate."
    fr: "TPM normalisé = TPM d'entrée × (1 − taux de cache) + ratio sortie/entrée × TPM de sortie = 60 000 + 4 × 6 000 = 84 000. Divisé par 3 000 TPM d'entrée par PTU, on obtient 28 PTU, arrondies à l'incrément de 5 suivant : 30 PTU. Le calculateur de capacité du portail Foundry effectue la même estimation."
  options:
    a: { en: "20 PTUs only covers the input tokens; each output token counts as four input tokens for gpt-4.1.", fr: "20 PTU ne couvre que les jetons d'entrée ; pour gpt-4.1, chaque jeton de sortie compte comme quatre jetons d'entrée." }
    c: { en: "50 PTUs is the regional minimum of gpt-4.1; a global deployment can use 30.", fr: "50 PTU est le minimum régional de gpt-4.1 ; un déploiement global peut utiliser 30." }
    d: { en: "84 is the normalized TPM in thousands, not a number of PTUs.", fr: "84 est le TPM normalisé en milliers, pas un nombre de PTU." }
references:
  - title: Determine PTU sizing for a workload
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-sizing
