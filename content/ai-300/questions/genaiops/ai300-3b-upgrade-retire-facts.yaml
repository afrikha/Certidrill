id: ai300-3b-upgrade-retire-facts
objective: "3.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Foundry resource that contains Global Standard deployments and a Global Provisioned deployment. The platform team reviews how model version updates and retirements affect them.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une ressource Microsoft Foundry qui contient des déploiements Global Standard et un déploiement Global Provisioned. L'équipe plateforme examine l'effet des mises à jour et des mises hors service des versions de modèles sur ces déploiements.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A Global Standard deployment set to NoAutoUpgrade stops working when its model version retires.
        fr: |
          Un déploiement Global Standard défini sur NoAutoUpgrade cesse de fonctionner lorsque sa version de modèle est mise hors service.
    - id: s2
      text:
        en: |
          If the Global Provisioned deployment is set to OnceCurrentVersionExpired, it's upgraded automatically to the default version at retirement.
        fr: |
          Si le déploiement Global Provisioned est défini sur OnceCurrentVersionExpired, il est mis à niveau automatiquement vers la version par défaut lors de la mise hors service.
    - id: s3
      text:
        en: |
          A Global Standard deployment whose version upgrade option is null behaves as if it were set to OnceCurrentVersionExpired.
        fr: |
          Un déploiement Global Standard dont l'option de mise à niveau de version est null se comporte comme s'il était défini sur OnceCurrentVersionExpired.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      With NoAutoUpgrade, the deployment never upgrades, so it stops working at retirement (retired models return 410 Gone). Automatic upgrades apply only to Standard deployment types; provisioned deployments are never auto-upgraded and must be migrated manually. A null value is equivalent to OnceCurrentVersionExpired.
    fr: |
      Avec NoAutoUpgrade, le déploiement n'est jamais mis à niveau : il cesse donc de fonctionner à la mise hors service (les modèles mis hors service renvoient 410 Gone). Les mises à niveau automatiques s'appliquent uniquement aux types de déploiement Standard ; les déploiements provisionnés ne sont jamais mis à niveau automatiquement et doivent être migrés manuellement. Une valeur null équivaut à OnceCurrentVersionExpired.
references:
  - title: Azure OpenAI in Microsoft Foundry Models working with models
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/working-with-models
  - title: Foundry Models lifecycle and support policy
