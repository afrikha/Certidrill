id: ai300-3a-bicep-deploy-order
objective: "3.1.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a Bicep file named **main.bicep** in your working folder. The file deploys a Foundry resource and a project, and it accepts the parameters `aiFoundryName` and `aiProjectName`. The target resource group **rg-proseware** doesn't exist yet.

    You need to deploy the file by using the Azure CLI and then review the deployed resources.

    Which three commands should you run in sequence? To answer, move the appropriate commands from the list of commands to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un fichier Bicep nommé **main.bicep** dans votre dossier de travail. Le fichier déploie une ressource Foundry et un projet, et il accepte les paramètres `aiFoundryName` et `aiProjectName`. Le groupe de ressources cible **rg-proseware** n'existe pas encore.

    Vous devez déployer le fichier à l'aide d'Azure CLI, puis examiner les ressources déployées.

    Quelles sont les trois commandes à exécuter dans l'ordre ? Pour répondre, déplacez les commandes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: rg, text: "az group create --name rg-proseware --location eastus" }
    - { id: deploy, text: "az deployment group create --resource-group rg-proseware --template-file main.bicep --parameters aiFoundryName=pw-ai aiProjectName=pw-ai-proj" }
    - { id: list, text: "az resource list --resource-group rg-proseware" }
    - { id: sub, text: "az deployment sub create --location eastus --template-file main.bicep" }
    - { id: decompile, text: "az bicep decompile --file main.json" }
    - { id: delete, text: "az group delete --name rg-proseware" }
answer:
  sequence: [ rg, deploy, list ]
explanation:
  correct:
    en: |
      The template targets a resource group, so the group must exist before `az deployment group create` deploys main.bicep into it with its parameters. `az resource list` then shows the resources that were created, such as `Microsoft.CognitiveServices/accounts` and `Microsoft.CognitiveServices/accounts/projects`.
    fr: |
      Le modèle cible un groupe de ressources : le groupe doit exister avant que `az deployment group create` y déploie main.bicep avec ses paramètres. `az resource list` affiche ensuite les ressources créées, comme `Microsoft.CognitiveServices/accounts` et `Microsoft.CognitiveServices/accounts/projects`.
  options:
    sub:
      en: |
        A subscription-scope deployment doesn't deploy a resource-group-scoped file into rg-proseware.
      fr: |
        Un déploiement à l'étendue de l'abonnement ne déploie pas un fichier de l'étendue d'un groupe de ressources dans rg-proseware.
    decompile:
      en: |
        Decompiling converts an ARM JSON template into Bicep; it isn't needed to deploy a Bicep file.
      fr: |
        La décompilation convertit un modèle ARM JSON en Bicep ; elle n'est pas nécessaire pour déployer un fichier Bicep.
    delete:
      en: |
        Deleting the resource group is a cleanup step, not part of the deployment.
      fr: |
        La suppression du groupe de ressources est une étape de nettoyage, pas une partie du déploiement.
references:
  - title: "Quickstart: Deploy a Foundry resource by using Bicep"
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-resource-template
