id: ai300-sr2-ptu-bursts-2
objective: "3.2.4"
type: series_yesno
series: ai300-sr2-ptu-bursts
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You enable traffic spillover on claims-ptu to a standard deployment of a newer version of the model.
  fr: Vous activez le débordement du trafic (spillover) de claims-ptu vers un déploiement standard d'une version plus récente du modèle.
body:
  solution:
    en: |
      In nw-foundry, you create a Data Zone Standard deployment named **claims-std** of the same model as claims-ptu, but you select a newer model version that has more quota available. In the deployment settings of claims-ptu, you enable **Traffic spillover** and select claims-std as the spillover deployment.
    fr: |
      Dans nw-foundry, vous créez un déploiement Data Zone Standard nommé **claims-std** du même modèle que claims-ptu, mais vous sélectionnez une version de modèle plus récente qui dispose de davantage de quota. Dans les paramètres de déploiement de claims-ptu, vous activez **Traffic spillover** et sélectionnez claims-std comme déploiement de débordement.
answer: { value: false }
explanation:
  correct:
    en: Spillover requires a pay-as-you-go deployment in the same Foundry resource that matches both the model and the model version of the provisioned deployment. A deployment of a newer version can't be selected as the spillover target, so the requests rejected during the bursts still fail.
    fr: "Le débordement exige un déploiement avec paiement à l'utilisation, dans la même ressource Foundry, qui correspond à la fois au modèle et à la version de modèle du déploiement provisionné. Un déploiement d'une version plus récente ne peut pas être choisi comme cible de débordement : les requêtes rejetées pendant les pics échouent toujours."
references:
  - title: Manage traffic with spillover for provisioned deployments - Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/spillover-traffic-management
