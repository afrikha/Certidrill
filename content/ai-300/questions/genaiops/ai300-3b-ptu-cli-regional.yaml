id: ai300-3b-ptu-cli-regional
objective: "3.2.4"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Contoso has a Microsoft Foundry resource named **ais-contoso-fr** that has enough PTU quota. You need to create a provisioned deployment of gpt-4.1 version 2025-04-14 by using the Azure CLI. The deployment must meet the following requirements:

    - Prompts and responses must not be routed outside the Azure geography of the resource.
    - Throughput must be reserved, not pay-per-token.
    - The deployment must use the smallest PTU count allowed for its deployment type.

    According to the sizing table, gpt-4.1 has a minimum of 15 PTUs (increments of 5) for global and data zone deployments, and a minimum of 50 PTUs (increments of 50) for regional deployments.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une ressource Microsoft Foundry nommée **ais-contoso-fr** qui a un quota de PTU suffisant. Vous devez créer un déploiement provisionné de gpt-4.1 version 2025-04-14 à l'aide d'Azure CLI. Le déploiement doit répondre aux exigences suivantes :

    - Les invites et les réponses ne doivent pas être acheminées hors de la zone géographique Azure de la ressource.
    - Le débit doit être réservé, et non facturé au jeton.
    - Le déploiement doit utiliser le plus petit nombre de PTU autorisé pour son type de déploiement.

    D'après le tableau de dimensionnement, gpt-4.1 exige au minimum 15 PTU (par incréments de 5) pour les déploiements globaux et en zone de données, et au minimum 50 PTU (par incréments de 50) pour les déploiements régionaux.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az cognitiveservices account deployment create \
      --name ais-contoso-fr \
      --resource-group rg-ai \
      --deployment-name chat-ptu \
      --model-name gpt-4.1 \
      --model-version "2025-04-14" \
      --model-format OpenAI \
      --sku-name [[sku]] \
      --sku-capacity [[cap]]
  slots:
    - id: sku
      options:
        - { id: s1, text: GlobalProvisionedManaged }
        - { id: s2, text: DataZoneProvisionedManaged }
        - { id: s3, text: ProvisionedManaged }
        - { id: s4, text: Standard }
    - id: cap
      options:
        - { id: c15, text: "15" }
        - { id: c25, text: "25" }
        - { id: c50, text: "50" }
        - { id: c100, text: "100" }
answer:
  values: { sku: s3, cap: c50 }
explanation:
  correct:
    en: "`--sku-name` sets the deployment type and `--sku-capacity` the number of PTUs. Regional Provisioned (`ProvisionedManaged`) keeps processing within the Azure geography of the resource with reserved throughput, and its minimum for gpt-4.1 is 50 PTUs."
    fr: "`--sku-name` définit le type de déploiement et `--sku-capacity` le nombre de PTU. Regional Provisioned (`ProvisionedManaged`) conserve le traitement dans la zone géographique Azure de la ressource avec un débit réservé, et son minimum pour gpt-4.1 est de 50 PTU."
  options:
    s1: { en: "Global Provisioned can route requests across Azure regions globally.", fr: "Global Provisioned peut acheminer les requêtes entre les régions Azure du monde entier." }
    s2: { en: "Data Zone Provisioned processes data within a data zone (such as the EU), which can span several geographies.", fr: "Data Zone Provisioned traite les données dans une zone de données (comme l'UE), qui peut couvrir plusieurs zones géographiques." }
    s4: { en: "Standard keeps data in the geography but is billed per token, without reserved throughput.", fr: "Standard conserve les données dans la zone géographique mais est facturé au jeton, sans débit réservé." }
    c15: { en: "15 PTUs is the minimum for global and data zone deployments, not regional ones.", fr: "15 PTU est le minimum des déploiements globaux et en zone de données, pas des déploiements régionaux." }
    c25: { en: "25 PTUs is below the regional minimum of gpt-4.1 and isn't a multiple of its 50-PTU increment.", fr: "25 PTU est inférieur au minimum régional de gpt-4.1 et n'est pas un multiple de son incrément de 50 PTU." }
    c100: { en: "100 PTUs is valid but larger than the minimum.", fr: "100 PTU est valide mais supérieur au minimum." }
references:
  - title: "Quickstart: Create a provisioned throughput deployment"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/provisioned-quickstart
  - title: Determine PTU sizing for a workload
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-sizing
