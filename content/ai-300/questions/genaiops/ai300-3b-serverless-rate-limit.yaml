id: ai300-3b-serverless-rate-limit
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure Machine Learning workspace named **mlw-adatum** that contains a serverless deployment of a catalog model. At peak hours, the application needs about 300,000 tokens per minute, and requests to the deployment are throttled.

    The application must keep calling the same endpoint, and the model must stay deployed with token-based billing.

    What should you do?
  fr: |
    Adatum dispose d'un espace de travail Azure Machine Learning nommé **mlw-adatum** qui contient un déploiement serverless d'un modèle du catalogue. Aux heures de pointe, l'application a besoin d'environ 300 000 jetons par minute, et les requêtes adressées au déploiement sont limitées.

    L'application doit continuer à appeler le même point de terminaison, et le modèle doit rester déployé avec une facturation au jeton.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Contact Microsoft Azure Support to raise the limits of the deployment.", fr: "Contacter le support Microsoft Azure pour relever les limites du déploiement." } }
    - { id: b, text: { en: "Create a second serverless deployment of the model in mlw-adatum.", fr: "Créer un second déploiement serverless du modèle dans mlw-adatum." } }
    - { id: c, text: { en: "Request a TPM quota increase for the subscription on the Quota page.", fr: "Demander une augmentation du quota de TPM de l'abonnement dans la page Quota." } }
    - { id: d, text: { en: "Increase the instance count of the deployment to two.", fr: "Augmenter à deux le nombre d'instances du déploiement." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each serverless deployment is limited to 200,000 tokens per minute and 1,000 API requests per minute. The quota is managed per deployment, not taken from the subscription quota, and Microsoft asks you to contact Microsoft Azure Support when these limits aren't enough.
    fr: |
      Chaque déploiement serverless est limité à 200 000 jetons par minute et à 1 000 requêtes d'API par minute. Le quota est géré par déploiement, il ne provient pas du quota de l'abonnement, et Microsoft demande de contacter le support Microsoft Azure lorsque ces limites ne suffisent pas.
  options:
    b:
      en: |
        Only one deployment per model per workspace is currently allowed, and a second deployment would have its own endpoint.
      fr: |
        Un seul déploiement par modèle et par espace de travail est actuellement autorisé, et un second déploiement aurait son propre point de terminaison.
    c:
      en: |
        The limits of a serverless deployment don't come from the subscription's TPM quota, so raising that quota has no effect.
      fr: |
        Les limites d'un déploiement serverless ne proviennent pas du quota de TPM de l'abonnement : augmenter ce quota n'a aucun effet.
    d:
      en: |
        Instance count is a setting of managed compute deployments; Microsoft hosts the model of a serverless deployment and you don't manage instances.
      fr: |
        Le nombre d'instances est un paramètre des déploiements sur calcul managé ; Microsoft héberge le modèle d'un déploiement serverless et vous ne gérez pas d'instances.
references:
  - title: Deploy models as standard deployments
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-models-serverless
  - title: Deploy models as serverless API deployments (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/deploy-models-serverless
