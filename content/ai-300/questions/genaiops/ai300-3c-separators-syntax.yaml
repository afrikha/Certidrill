id: ai300-3c-separators-syntax
objective: "3.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware is building a prompt for a GPT chat model in Microsoft Foundry. The prompt passes four source documents and asks the model to extract the factual claims of each document. Reviewers report that the model sometimes mixes up the documents, and the application struggles to parse where each document's claims start.

    You need to make the prompt easier for the model to interpret and its output easier to parse.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware construit une invite pour un modèle de conversation GPT dans Microsoft Foundry. L'invite transmet quatre documents sources et demande au modèle d'extraire les affirmations factuelles de chaque document. Les relecteurs signalent que le modèle confond parfois les documents, et l'application a du mal à repérer où commencent les affirmations de chaque document.

    Vous devez rendre l'invite plus facile à interpréter pour le modèle et sa sortie plus facile à analyser.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Concatenate the four documents into one paragraph so that the prompt uses fewer tokens.", fr: "Concaténer les quatre documents en un seul paragraphe pour que l'invite utilise moins de jetons." } }
    - { id: b, text: { en: "Separate the documents with a separator such as --- and ask the model to use it between the documents in its output.", fr: "Séparer les documents par un séparateur comme --- et demander au modèle de l'utiliser entre les documents dans sa sortie." } }
    - { id: c, text: { en: "Raise the temperature so that the model reads the documents with more flexibility.", fr: "Augmenter la température pour que le modèle lise les documents avec plus de souplesse." } }
    - { id: d, text: { en: "Structure the prompt with Markdown or XML and label each part with an uppercase heading such as DOCUMENT 1 and CLAIMS.", fr: "Structurer l'invite en Markdown ou en XML et désigner chaque partie par un titre en majuscules comme DOCUMENT 1 et CLAIMS." } }
    - { id: e, text: { en: "Put the extraction instructions in an assistant message instead of the system message.", fr: "Placer les instructions d'extraction dans un message assistant plutôt que dans le message système." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Microsoft recommends clear syntax to communicate intent and make outputs easy to parse. Separators such as --- delimit sources or steps (and can even serve as a stop condition), and Markdown or XML structure with uppercase section headings helps the model distinguish the parts of the prompt.
    fr: Microsoft recommande une syntaxe claire pour exprimer l'intention et faciliter l'analyse des sorties. Des séparateurs comme --- délimitent les sources ou les étapes (et peuvent même servir de condition d'arrêt), et une structure Markdown ou XML avec des titres de section en majuscules aide le modèle à distinguer les parties de l'invite.
  options:
    a:
      en: Merging the documents removes the boundaries that the model needs to keep them apart.
      fr: Fusionner les documents supprime les frontières dont le modèle a besoin pour les distinguer.
    c:
      en: A higher temperature increases randomness; it does not help the model separate documents or format its output.
      fr: Une température plus élevée augmente le caractère aléatoire ; elle n'aide pas le modèle à séparer les documents ni à formater sa sortie.
    e:
      en: Assistant messages represent model answers; instructions belong in the system message or the user prompt.
      fr: Les messages assistant représentent les réponses du modèle ; les instructions ont leur place dans le message système ou l'invite utilisateur.
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
