id: ai300-3b-hf-realtime
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure Machine Learning workspace named **mlw-fabrikam**. The data science team selected a text classification model from the **HuggingFace** collection of the model catalog.

    An internal application must call the model for real-time scoring through a REST API. The subscription has virtual machine quota for the instance type that the model requires.

    Which deployment option should you use?
  fr: |
    Fabrikam dispose d'un espace de travail Azure Machine Learning nommé **mlw-fabrikam**. L'équipe de science des données a choisi un modèle de classification de texte dans la collection **HuggingFace** du catalogue de modèles.

    Une application interne doit appeler le modèle pour un scoring en temps réel via une API REST. L'abonnement dispose d'un quota de machines virtuelles pour le type d'instance requis par le modèle.

    Quelle option de déploiement devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A serverless API deployment billed per token", fr: "Un déploiement d'API serverless facturé au jeton" } }
    - { id: b, text: { en: "A batch endpoint that runs on a compute cluster", fr: "Un point de terminaison de lot exécuté sur un cluster de calcul" } }
    - { id: c, text: { en: "A managed online endpoint on managed compute", fr: "Un point de terminaison en ligne managé sur calcul managé" } }
    - { id: d, text: { en: "A Global Standard deployment in a Foundry resource", fr: "Un déploiement Global Standard dans une ressource Foundry" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Models of the HuggingFace collection are deployed with managed compute, to Azure Machine Learning managed online endpoints for real-time inference. The deployment runs on dedicated instances that consume the subscription's VM quota and exposes a REST scoring API.
    fr: |
      Les modèles de la collection HuggingFace sont déployés avec le calcul managé, sur des points de terminaison en ligne managés Azure Machine Learning pour l'inférence en temps réel. Le déploiement s'exécute sur des instances dédiées qui consomment le quota de machines virtuelles de l'abonnement et expose une API REST de scoring.
  options:
    a:
      en: |
        Serverless API deployments serve Foundry Models offered with pay-as-you-go billing; Hugging Face models require managed compute.
      fr: |
        Les déploiements d'API serverless servent les Foundry Models proposés avec une facturation à l'utilisation ; les modèles Hugging Face exigent le calcul managé.
    b:
      en: |
        Models from the HuggingFace registry can't be deployed to batch endpoints, and a batch endpoint doesn't provide real-time scoring.
      fr: |
        Les modèles du registre HuggingFace ne peuvent pas être déployés sur des points de terminaison de lot, et un point de terminaison de lot ne fournit pas de scoring en temps réel.
    d:
      en: |
        Standard deployments in Foundry resources serve Foundry Models sold by Azure or from partners and community, not models of the HuggingFace collection.
      fr: |
        Les déploiements standard dans les ressources Foundry servent les Foundry Models vendus par Azure ou issus de partenaires et de la communauté, pas les modèles de la collection HuggingFace.
references:
  - title: Deploy models from HuggingFace hub to Azure Machine Learning online endpoints for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-models-from-huggingface
  - title: Explore Microsoft Foundry Models in Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-model-catalog
