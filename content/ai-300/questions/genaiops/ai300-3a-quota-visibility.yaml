id: ai300-3a-quota-visibility
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Developers at Northwind have the Foundry User role on a Foundry project named **proj-nw**. When they open the deployment experience, Foundry can't display the available quota or validate deployments.

    You need to give the developers access to the quota information. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Les développeurs de Northwind ont le rôle Foundry User sur un projet Foundry nommé **proj-nw**. Lorsqu'ils ouvrent l'expérience de déploiement, Foundry ne peut ni afficher le quota disponible ni valider les déploiements.

    Vous devez donner aux développeurs l'accès aux informations de quota. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign Cognitive Services Usages Reader on the Foundry resource.", fr: "Attribuer Cognitive Services Usages Reader sur la ressource Foundry." } }
    - { id: b, text: { en: "Assign Foundry Account Owner on the resource group.", fr: "Attribuer Foundry Account Owner sur le groupe de ressources." } }
    - { id: c, text: { en: "Assign Cognitive Services Usages Reader on the subscription.", fr: "Attribuer Cognitive Services Usages Reader sur l'abonnement." } }
    - { id: d, text: { en: "Assign Foundry User on the Foundry resource.", fr: "Attribuer Foundry User sur la ressource Foundry." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Quota and usage information is subscription-level data read through the Usages API. Cognitive Services Usages Reader assigned at the subscription scope is the least-privilege role for quota visibility.
    fr: |
      Les informations de quota et d'utilisation sont des données de niveau abonnement lues par l'API Usages. Cognitive Services Usages Reader attribué à l'étendue de l'abonnement est le rôle de moindre privilège pour la visibilité du quota.
  options:
    a:
      en: |
        Resource group, Foundry resource and project assignments don't authorize access to subscription-level quota information.
      fr: |
        Les attributions sur un groupe de ressources, une ressource Foundry ou un projet n'autorisent pas l'accès aux informations de quota de niveau abonnement.
    b:
      en: |
        Foundry Account Owner grants far more than quota visibility, and a resource group assignment doesn't cover the subscription-level Usages API.
      fr: |
        Foundry Account Owner accorde bien plus que la visibilité du quota, et une attribution sur un groupe de ressources ne couvre pas l'API Usages de niveau abonnement.
    d:
      en: |
        A role on the Foundry resource doesn't apply to subscription-level quota data.
      fr: |
        Un rôle sur la ressource Foundry ne s'applique pas aux données de quota de niveau abonnement.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
