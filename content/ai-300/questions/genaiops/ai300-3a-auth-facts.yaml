id: ai300-3a-auth-facts
objective: "3.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Foundry resource named **foundry-lit**. Some applications call foundry-lit by using an API key; others use Microsoft Entra ID. The security team plans to set `disableLocalAuth` to `true` on foundry-lit.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'une ressource Foundry nommée **foundry-lit**. Certaines applications appellent foundry-lit avec une clé API, d'autres avec Microsoft Entra ID. L'équipe de sécurité prévoit de définir `disableLocalAuth` sur `true` sur foundry-lit.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Today, the role assignments of foundry-lit don't limit what a caller that uses the API key can do.
        fr: |
          Aujourd'hui, les attributions de rôles de foundry-lit ne limitent pas ce que peut faire un appelant qui utilise la clé API.
    - id: s2
      text:
        en: |
          The applications that use Foundry Agent Service can keep using the API key until the change.
        fr: |
          Les applications qui utilisent Foundry Agent Service peuvent continuer à utiliser la clé API jusqu'à la modification.
    - id: s3
      text:
        en: |
          Right after the change, requests that use a previously valid key might still be accepted for a while.
        fr: |
          Juste après la modification, des requêtes qui utilisent une clé auparavant valide peuvent encore être acceptées pendant un certain temps.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      An API key grants full access to the resource; RBAC roles apply only to Microsoft Entra ID authentication. Agent Service doesn't support API keys, so those applications already use Microsoft Entra ID. After local authentication is disabled, the gateway can keep accepting previously valid keys until its cached configuration refreshes, typically minutes but up to several hours.
    fr: |
      Une clé API accorde un accès complet à la ressource ; les rôles RBAC ne s'appliquent qu'à l'authentification Microsoft Entra ID. Agent Service ne prend pas en charge les clés API : ces applications utilisent donc déjà Microsoft Entra ID. Une fois l'authentification locale désactivée, la passerelle peut continuer à accepter des clés auparavant valides jusqu'à l'actualisation de sa configuration en cache, en général quelques minutes, mais jusqu'à plusieurs heures.
references:
  - title: Authentication and authorization in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/authentication-authorization-foundry
  - title: Disable local authentication in Foundry Tools
    url: https://learn.microsoft.com/en-us/azure/ai-services/disable-local-auth
