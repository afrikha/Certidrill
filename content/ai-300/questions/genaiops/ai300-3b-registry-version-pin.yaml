id: ai300-3b-registry-version-pin
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware deploys a catalog model to a managed online endpoint by using a deployment YAML file. The `model` key currently references `azureml://registries/azureml/models/Phi-4/labels/latest`.

    Release management requires that redeploying the same YAML file always runs version 8 of the model, even after newer versions are published.

    Which value should you use for the `model` key?
  fr: |
    Proseware déploie un modèle du catalogue sur un point de terminaison en ligne managé à l'aide d'un fichier YAML de déploiement. La clé `model` référence actuellement `azureml://registries/azureml/models/Phi-4/labels/latest`.

    La gestion des mises en production exige que le redéploiement du même fichier YAML exécute toujours la version 8 du modèle, même après la publication de versions plus récentes.

    Quelle valeur devez-vous utiliser pour la clé `model` ?
body:
  options:
    - { id: a, text: "azureml://registries/azureml/models/Phi-4/versions/8" }
    - { id: b, text: "azureml://registries/azureml/models/Phi-4" }
    - { id: c, text: "azureml:Phi-4@latest" }
    - { id: d, text: "azureml://registries/azureml/models/Phi-4/labels/latest" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A registry model ID that ends with /versions/8 always resolves to that exact version, so each redeployment runs the same model. This is the format of the model ID shown on the model card for managed compute deployments.
    fr: |
      Un ID de modèle de registre qui se termine par /versions/8 correspond toujours à cette version précise : chaque redéploiement exécute donc le même modèle. C'est le format de l'ID de modèle affiché sur la fiche du modèle pour les déploiements sur calcul managé.
  options:
    b: { en: "The ID without a version is used for serverless deployments, which always deploy the latest version.", fr: "L'ID sans version est utilisé pour les déploiements serverless, qui déploient toujours la dernière version." }
    c: { en: "azureml:Phi-4@latest points to the latest version of a model registered in the workspace, not to version 8 in the registry.", fr: "azureml:Phi-4@latest désigne la dernière version d'un modèle inscrit dans l'espace de travail, pas la version 8 du registre." }
    d: { en: "labels/latest resolves to the newest published version when you deploy, so a later redeployment can change versions.", fr: "labels/latest correspond à la version publiée la plus récente au moment du déploiement : un redéploiement ultérieur peut changer de version." }
references:
  - title: Deploy models with managed compute (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/deploy-models-managed
  - title: Deploy models from HuggingFace hub to Azure Machine Learning online endpoints for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-models-from-huggingface
