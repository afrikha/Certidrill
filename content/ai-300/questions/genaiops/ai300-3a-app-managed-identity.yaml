id: ai300-3a-app-managed-identity
objective: "3.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Tailspin runs an application in Azure Container Apps. The application uses Foundry Agent Service in a project named **proj-tail** of the Foundry resource **foundry-tail**.

    The application must authenticate without any secret stored in its code or configuration.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin exécute une application dans Azure Container Apps. L'application utilise Foundry Agent Service dans un projet nommé **proj-tail** de la ressource Foundry **foundry-tail**.

    L'application doit s'authentifier sans aucun secret stocké dans son code ou sa configuration.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store the API key of foundry-tail in Azure Key Vault and read it at startup.", fr: "Stocker la clé API de foundry-tail dans Azure Key Vault et la lire au démarrage." } }
    - { id: b, text: { en: "Enable a managed identity on the container app.", fr: "Activer une identité managée sur l'application conteneur." } }
    - { id: c, text: { en: "Assign the Foundry User role on proj-tail to the managed identity.", fr: "Attribuer le rôle Foundry User sur proj-tail à l'identité managée." } }
    - { id: d, text: { en: "Regenerate Key1 and Key2 of foundry-tail.", fr: "Régénérer Key1 et Key2 de foundry-tail." } }
    - { id: e, text: { en: "Assign the Contributor role on foundry-tail to the managed identity.", fr: "Attribuer le rôle Contributor sur foundry-tail à l'identité managée." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      A managed identity gives the app a Microsoft Entra identity without secrets, and Agent Service supports Microsoft Entra ID authentication only. The identity then needs a role with data actions on the project, such as Foundry User.
    fr: |
      Une identité managée donne à l'application une identité Microsoft Entra sans secret, et Agent Service ne prend en charge que l'authentification Microsoft Entra ID. L'identité a ensuite besoin d'un rôle comportant des actions de données sur le projet, comme Foundry User.
  options:
    a:
      en: |
        Agent Service doesn't support API key authentication, and the key would still be a secret used by the app.
      fr: |
        Agent Service ne prend pas en charge l'authentification par clé API, et la clé resterait un secret utilisé par l'application.
    d:
      en: |
        Regenerating keys revokes existing keys but doesn't give the app a way to authenticate.
      fr: |
        La régénération des clés révoque les clés existantes, mais ne donne pas à l'application de moyen de s'authentifier.
    e:
      en: |
        Contributor is a control plane role; it doesn't grant the data actions needed to use agents.
      fr: |
        Contributor est un rôle du plan de contrôle ; il n'accorde pas les actions de données nécessaires pour utiliser les agents.
references:
  - title: Authentication and authorization in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/authentication-authorization-foundry
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
