id: ai300-cs1b-triage-router
objective: "3.2.2"
type: dropdown
caseStudy: ai300-cs1b-vanarsdel
difficulty: 2
status: draft
stem:
  en: |
    You plan to deploy model router in fdy-vanarsdel-prod for Contract Triage by using a custom deployment.

    How should you configure the deployment to meet the Contract Triage requirements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de déployer le routeur de modèles dans fdy-vanarsdel-prod pour Contract Triage au moyen d'un déploiement personnalisé.

    Comment devez-vous configurer le déploiement pour respecter les exigences de Contract Triage ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Deployment type: [[dtype]]
      Routing mode: [[mode]]
      Models used for routing: [[subset]]
    fr: |
      Type de déploiement : [[dtype]]
      Mode de routage : [[mode]]
      Modèles utilisés pour le routage : [[subset]]
  slots:
    - id: dtype
      options:
        - { id: global, text: "Global Standard" }
        - { id: datazone, text: "Data Zone Standard" }
        - { id: standard, text: "Standard" }
        - { id: dz-provisioned, text: "Data Zone Provisioned" }
    - id: mode
      options:
        - { id: balanced, text: "Balanced" }
        - { id: quality, text: "Quality" }
        - { id: cost, text: "Cost" }
    - id: subset
      options:
        - { id: all, text: { en: "All the underlying models supported in the region", fr: "Tous les modèles sous-jacents pris en charge dans la région" } }
        - { id: approved, text: { en: "A model subset that contains gpt-4.1, gpt-4.1-mini and gpt-5-mini", fr: "Un sous-ensemble de modèles qui contient gpt-4.1, gpt-4.1-mini et gpt-5-mini" } }
        - { id: cheapest, text: { en: "A model subset that contains only gpt-4.1-mini", fr: "Un sous-ensemble de modèles qui contient uniquement gpt-4.1-mini" } }
answer:
  values: { dtype: datazone, mode: cost, subset: approved }
explanation:
  correct:
    en: Model router deploys with Global Standard or Data Zone Standard, and only Data Zone Standard keeps prompts and responses within the EU data zone. Balanced is the default mode; Cost considers a larger quality band to favor savings. A model subset limits routing to the approved models, and it is also the fallback set, so it needs at least two models for requests to be served by another approved model.
    fr: Le routeur de modèles se déploie en Global Standard ou en Data Zone Standard, et seul Data Zone Standard garde les invites et les réponses dans la zone de données UE. Balanced est le mode par défaut ; Cost considère une plage de qualité plus large pour privilégier les économies. Un sous-ensemble de modèles limite le routage aux modèles approuvés, et il sert aussi d'ensemble de secours ; il lui faut donc au moins deux modèles pour que les requêtes soient servies par un autre modèle approuvé.
  options:
    global: { en: "Global Standard can process prompts and responses in any Azure region.", fr: "Global Standard peut traiter les invites et les réponses dans n'importe quelle région Azure." }
    standard: { en: "Model router doesn't support the regional Standard deployment type.", fr: "Le routeur de modèles ne prend pas en charge le type de déploiement Standard régional." }
    dz-provisioned: { en: "Model router doesn't support provisioned deployment types.", fr: "Le routeur de modèles ne prend pas en charge les types de déploiement approvisionnés." }
    balanced: { en: "Balanced is the default routing; the requirement asks for more cost savings than the default.", fr: "Balanced est le routage par défaut ; l'exigence demande plus d'économies que le routage par défaut." }
    quality: { en: "Quality picks the highest-rated model and ignores cost.", fr: "Quality choisit le modèle le mieux noté et ignore le coût." }
    all: { en: "Without a subset, the router can use models that the risk team didn't approve.", fr: "Sans sous-ensemble, le routeur peut utiliser des modèles que l'équipe des risques n'a pas approuvés." }
    cheapest: { en: "A one-model subset leaves no fallback model and no choice of model per contract.", fr: "Un sous-ensemble d'un seul modèle ne laisse aucun modèle de secours et aucun choix de modèle par contrat." }
references:
  - title: Model router for Microsoft Foundry concepts
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-router
  - title: Understanding deployment types in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types
