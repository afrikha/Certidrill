id: ai300-3a-custom-dns-forwarding
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has a Foundry resource named **foundry-tsn** with a private endpoint in a virtual network named **vnet-core**. The private DNS zones of the endpoint are linked to vnet-core. vnet-core uses custom DNS servers that run on Azure virtual machines in vnet-core.

    When clients in vnet-core run `nslookup` for the foundry-tsn host name, the name resolves to a public IP address instead of the private endpoint.

    What should you do?
  fr: |
    Tailspin dispose d'une ressource Foundry nommée **foundry-tsn** avec un point de terminaison privé dans un réseau virtuel nommé **vnet-core**. Les zones DNS privées du point de terminaison sont liées à vnet-core. vnet-core utilise des serveurs DNS personnalisés exécutés sur des machines virtuelles Azure de vnet-core.

    Lorsque les clients de vnet-core exécutent `nslookup` pour le nom d'hôte de foundry-tsn, le nom est résolu en adresse IP publique au lieu du point de terminaison privé.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Configure the custom DNS servers to forward privatelink queries to 168.63.129.16.", fr: "Configurer les serveurs DNS personnalisés pour qu'ils transfèrent les requêtes privatelink vers 168.63.129.16." } }
    - { id: b, text: { en: "Configure the custom DNS servers to forward privatelink queries to 169.254.169.254.", fr: "Configurer les serveurs DNS personnalisés pour qu'ils transfèrent les requêtes privatelink vers 169.254.169.254." } }
    - { id: c, text: { en: "Disable public network access on foundry-tsn.", fr: "Désactiver l'accès réseau public sur foundry-tsn." } }
    - { id: d, text: { en: "Create a second private endpoint for foundry-tsn in vnet-core.", fr: "Créer un deuxième point de terminaison privé pour foundry-tsn dans vnet-core." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With a custom DNS server, `privatelink` queries must be forwarded to Azure DNS at 168.63.129.16, which resolves them from the private DNS zones linked to the virtual network.
    fr: |
      Avec un serveur DNS personnalisé, les requêtes `privatelink` doivent être transférées vers Azure DNS à l'adresse 168.63.129.16, qui les résout à partir des zones DNS privées liées au réseau virtuel.
  options:
    b:
      en: |
        169.254.169.254 is the Azure Instance Metadata Service endpoint, not Azure DNS.
      fr: |
        169.254.169.254 est le point de terminaison d'Azure Instance Metadata Service, pas Azure DNS.
    c:
      en: |
        Disabling public access blocks the public endpoint but doesn't change how the custom DNS servers resolve the name.
      fr: |
        La désactivation de l'accès public bloque le point de terminaison public, mais ne change pas la façon dont les serveurs DNS personnalisés résolvent le nom.
    d:
      en: |
        Another private endpoint doesn't fix the name resolution path of the custom DNS servers.
      fr: |
        Un autre point de terminaison privé ne corrige pas le chemin de résolution des noms des serveurs DNS personnalisés.
references:
  - title: How to configure network isolation for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
