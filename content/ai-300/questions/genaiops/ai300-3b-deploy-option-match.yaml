id: ai300-3b-deploy-option-match
objective: "3.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys uses the Foundry (classic) portal. It has a hub-based project that isn't connected to a Foundry resource, and a separate Foundry resource. Four teams need to deploy models.

    Which deployment option should each team use? To answer, drag the appropriate options to the correct requirements. Each option may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise le portail Foundry (classique). L'entreprise dispose d'un projet basé sur un hub qui n'est pas connecté à une ressource Foundry, et d'une ressource Foundry distincte. Quatre équipes doivent déployer des modèles.

    Quelle option de déploiement chaque équipe doit-elle utiliser ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: std, text: { en: "Standard deployment in the Foundry resource", fr: "Déploiement standard dans la ressource Foundry" } }
    - { id: srv, text: { en: "Serverless API deployment in the hub-based project", fr: "Déploiement d'API serverless dans le projet basé sur un hub" } }
    - { id: mc, text: { en: "Managed compute deployment in the hub-based project", fr: "Déploiement sur calcul managé dans le projet basé sur un hub" } }
    - { id: batch, text: { en: "Batch endpoint in an Azure Machine Learning workspace", fr: "Point de terminaison de lot dans un espace de travail Azure Machine Learning" } }
  targets:
    - id: t1
      text: { en: "Serve an open model from the Hugging Face collection in real time", fr: "Servir en temps réel un modèle ouvert de la collection Hugging Face" }
    - id: t2
      text: { en: "Run a flagship model with data zone processing and provisioned throughput units (PTUs)", fr: "Exécuter un modèle phare avec traitement en zone de données et unités de débit approvisionné (PTU)" }
    - id: t3
      text: { en: "In the hub-based project, use a partner model billed per token through Azure Marketplace, with integrated content filtering and no VM quota", fr: "Dans le projet basé sur un hub, utiliser un modèle partenaire facturé au jeton via la Place de marché Azure, avec un filtrage de contenu intégré et sans quota de machines virtuelles" }
    - id: t4
      text: { en: "Serve in real time a custom model that the team trained", fr: "Servir en temps réel un modèle personnalisé entraîné par l'équipe" }
answer:
  mapping: { t1: mc, t2: std, t3: srv, t4: mc }
explanation:
  correct:
    en: |
      Managed compute is required for Hugging Face models and custom models, which run on dedicated instances. Standard deployments in Foundry resources are the only option with regional, data zone or global processing and provisioned throughput. Serverless API deployments, available only in hub-based projects, serve pay-as-you-go Foundry Models billed per token, with content filtering and no VM quota to manage.
    fr: |
      Le calcul managé est requis pour les modèles Hugging Face et les modèles personnalisés, qui s'exécutent sur des instances dédiées. Les déploiements standard dans les ressources Foundry sont la seule option offrant un traitement régional, en zone de données ou global, et le débit approvisionné. Les déploiements d'API serverless, disponibles uniquement dans les projets basés sur un hub, servent des Foundry Models facturés au jeton, avec un filtrage de contenu et sans quota de machines virtuelles à gérer.
  options:
    batch:
      en: |
        A batch endpoint processes data asynchronously; none of the requirements is a batch workload, and Hugging Face registry models can't use batch endpoints.
      fr: |
        Un point de terminaison de lot traite les données de manière asynchrone ; aucune exigence n'est une charge de travail par lots, et les modèles du registre HuggingFace ne peuvent pas utiliser de points de terminaison de lot.
references:
  - title: Deployment options for Microsoft Foundry Models (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/deployments-overview
