id: ai300-3a-mvnet-outbound-mode
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware is creating a Foundry resource named **foundry-ltw** for prompt agents. The agents must reach a partner API at `api.partner.example` over HTTPS and the Azure resources of the standard setup. All other outbound traffic from the agents must be blocked to minimize data exfiltration risk.

    Litware doesn't want to create or maintain its own virtual network for the agents.

    What should you configure?
  fr: |
    Litware crée une ressource Foundry nommée **foundry-ltw** pour des agents d'invite. Les agents doivent joindre une API partenaire à l'adresse `api.partner.example` en HTTPS ainsi que les ressources Azure de la configuration standard. Tout autre trafic sortant des agents doit être bloqué pour réduire au minimum le risque d'exfiltration de données.

    Litware ne veut ni créer ni maintenir son propre réseau virtuel pour les agents.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A managed virtual network in Allow internet outbound mode with an fqdn outbound rule for api.partner.example", fr: "Un réseau virtuel managé en mode Allow internet outbound avec une règle de trafic sortant fqdn pour api.partner.example" } }
    - { id: b, text: { en: "A managed virtual network in Allow only approved outbound mode with an fqdn outbound rule for api.partner.example", fr: "Un réseau virtuel managé en mode Allow only approved outbound avec une règle de trafic sortant fqdn pour api.partner.example" } }
    - { id: c, text: { en: "Virtual network injection into a delegated subnet with an Azure Firewall application rule for api.partner.example", fr: "Une injection dans un sous-réseau délégué avec une règle d'application Azure Firewall pour api.partner.example" } }
    - { id: d, text: { en: "A private endpoint for foundry-ltw with public network access disabled on the resource", fr: "Un point de terminaison privé pour foundry-ltw avec l'accès réseau public désactivé sur la ressource" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A managed virtual network is created and maintained by Microsoft. In Allow only approved outbound mode, outbound traffic is limited to service tags, private endpoints and optional FQDN rules on ports 80 and 443, enforced by a managed Azure Firewall. An `fqdn` rule allows the partner API.
    fr: |
      Un réseau virtuel managé est créé et maintenu par Microsoft. En mode Allow only approved outbound, le trafic sortant est limité aux balises de service, aux points de terminaison privés et à des règles FQDN facultatives sur les ports 80 et 443, appliquées par un Azure Firewall managé. Une règle `fqdn` autorise l'API partenaire.
  options:
    a:
      en: |
        Allow internet outbound mode allows all outbound internet traffic, so other destinations wouldn't be blocked.
      fr: |
        Le mode Allow internet outbound autorise tout le trafic sortant vers Internet : les autres destinations ne seraient pas bloquées.
    c:
      en: |
        Virtual network injection requires Litware to provide and manage its own virtual network, subnet and firewall.
      fr: |
        L'injection dans un réseau virtuel oblige Litware à fournir et gérer son propre réseau virtuel, son sous-réseau et son pare-feu.
    d:
      en: |
        A private endpoint and disabled public access secure inbound traffic; they don't restrict the agents' outbound traffic.
      fr: |
        Un point de terminaison privé et l'accès public désactivé sécurisent le trafic entrant ; ils ne restreignent pas le trafic sortant des agents.
references:
  - title: Configure managed virtual network for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/managed-virtual-network
