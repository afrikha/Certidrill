id: ai300-3a-iac-facts
objective: "3.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove automates its Foundry environments with Bicep files and Azure CLI scripts. You have the Owner role on the target resource groups.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove automatise ses environnements Foundry avec des fichiers Bicep et des scripts Azure CLI. Vous disposez du rôle Owner sur les groupes de ressources cibles.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When you create a Foundry resource with `az cognitiveservices account create`, the Foundry User role is assigned to you automatically.
        fr: |
          Lorsque vous créez une ressource Foundry avec `az cognitiveservices account create`, le rôle Foundry User vous est attribué automatiquement.
    - id: s2
      text:
        en: |
          A project resource declared inside the body of its parent account resource in Bicep doesn't need the `parent` property.
        fr: |
          Une ressource de projet déclarée dans le corps de sa ressource de compte parente en Bicep n'a pas besoin de la propriété `parent`.
    - id: s3
      text:
        en: |
          The `--allow-project-management` parameter of `az cognitiveservices account create` applies only to the AIServices kind.
        fr: |
          Le paramètre `--allow-project-management` de `az cognitiveservices account create` s'applique uniquement au type AIServices.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The automatic Foundry User assignment applies only when a user who can assign roles deploys from the Azure portal or the Foundry portal UI, not from the SDK or the CLI. In Bicep, `parent` is needed only when the child resource is declared outside its parent. The CLI documents `--allow-project-management` for the AIServices kind only.
    fr: |
      L'attribution automatique de Foundry User ne s'applique que lorsqu'un utilisateur autorisé à attribuer des rôles déploie depuis le portail Azure ou l'interface du portail Foundry, pas depuis le SDK ou la CLI. En Bicep, `parent` n'est nécessaire que lorsque la ressource enfant est déclarée en dehors de son parent. La CLI documente `--allow-project-management` pour le seul type AIServices.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
  - title: Microsoft.CognitiveServices accounts/projects
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.cognitiveservices/accounts/projects
