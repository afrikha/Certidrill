id: ai300-3a-custom-domain-error
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You run the following command to create a Foundry resource for Tailspin:

    ```bash
    az cognitiveservices account create --name foundry-tailspin --resource-group rg-tailspin \
      --kind AIServices --sku S0 --location eastus --custom-domain foundry-ai \
      --assign-identity --allow-project-management true
    ```

    The command fails with the error `CustomDomainInUse`. No deleted Cognitive Services account exists in your subscription.

    What should you do?
  fr: |
    Vous exécutez la commande suivante pour créer une ressource Foundry pour Tailspin :

    ```bash
    az cognitiveservices account create --name foundry-tailspin --resource-group rg-tailspin \
      --kind AIServices --sku S0 --location eastus --custom-domain foundry-ai \
      --assign-identity --allow-project-management true
    ```

    La commande échoue avec l'erreur `CustomDomainInUse`. Aucun compte Cognitive Services supprimé n'existe dans votre abonnement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run the command again with a different value for --location.", fr: "Exécuter de nouveau la commande avec une autre valeur pour --location." } }
    - { id: b, text: { en: "Run the command again with a different value for --custom-domain.", fr: "Exécuter de nouveau la commande avec une autre valeur pour --custom-domain." } }
    - { id: c, text: { en: "Run the command again with a different value for --resource-group.", fr: "Exécuter de nouveau la commande avec une autre valeur pour --resource-group." } }
    - { id: d, text: { en: "Run the command again without --assign-identity.", fr: "Exécuter de nouveau la commande sans --assign-identity." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The custom domain becomes the subdomain of the resource endpoints and must be globally unique. `CustomDomainInUse` means that another resource already uses foundry-ai, so you choose another name.
    fr: |
      Le domaine personnalisé devient le sous-domaine des points de terminaison de la ressource et doit être unique au niveau mondial. `CustomDomainInUse` signifie qu'une autre ressource utilise déjà foundry-ai : vous choisissez un autre nom.
  options:
    a:
      en: |
        Uniqueness is global, so another region doesn't free the subdomain.
      fr: |
        L'unicité est mondiale : une autre région ne libère pas le sous-domaine.
    c:
      en: |
        The resource group doesn't affect the uniqueness of the custom domain.
      fr: |
        Le groupe de ressources n'a pas d'incidence sur l'unicité du domaine personnalisé.
    d:
      en: |
        The managed identity is unrelated to the error, and project management needs it.
      fr: |
        L'identité managée est sans rapport avec l'erreur, et la gestion des projets en a besoin.
references:
  - title: Create a project for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-projects
