id: ai300-3a-injection-after-deploy
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a Foundry resource named **foundry-adm** that was deployed six months ago with a private endpoint and without virtual network injection. Its projects run hosted agents.

    A new requirement states that the outbound traffic of the agents must go through a subnet of Adatum's virtual network so that it can be inspected by Adatum's firewall. You need to meet the requirement.

    What should you do?
  fr: |
    Adatum dispose d'une ressource Foundry nommée **foundry-adm**, déployée il y a six mois avec un point de terminaison privé et sans injection dans un réseau virtuel. Ses projets exécutent des agents hébergés.

    Une nouvelle exigence impose que le trafic sortant des agents passe par un sous-réseau du réseau virtuel d'Adatum afin d'être inspecté par le pare-feu d'Adatum. Vous devez répondre à cette exigence.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Update foundry-adm to add a networkInjections entry that references a delegated subnet.", fr: "Mettre à jour foundry-adm pour ajouter une entrée networkInjections qui référence un sous-réseau délégué." } }
    - { id: b, text: { en: "Add a second private endpoint for foundry-adm in the subnet that the firewall inspects.", fr: "Ajouter un deuxième point de terminaison privé pour foundry-adm dans le sous-réseau inspecté par le pare-feu." } }
    - { id: c, text: { en: "Deploy a new Foundry resource with virtual network injection configured at creation, and recreate the agents.", fr: "Déployer une nouvelle ressource Foundry avec l'injection dans le réseau virtuel configurée à la création, puis recréer les agents." } }
    - { id: d, text: { en: "Set publicNetworkAccess to Disabled on foundry-adm and add a user-defined route to the firewall.", fr: "Définir publicNetworkAccess sur Disabled sur foundry-adm et ajouter un itinéraire défini par l'utilisateur vers le pare-feu." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Outbound networking can't be changed after deployment: you can't add virtual network injection to an existing Foundry resource, and for hosted agents it must be set when the account is created. You must redeploy a resource with injection into a delegated subnet whose traffic your firewall can inspect.
    fr: |
      La mise en réseau sortante ne peut pas être modifiée après le déploiement : vous ne pouvez pas ajouter l'injection dans un réseau virtuel à une ressource Foundry existante, et pour les agents hébergés elle doit être définie à la création du compte. Vous devez redéployer une ressource avec une injection dans un sous-réseau délégué dont votre pare-feu peut inspecter le trafic.
  options:
    a:
      en: |
        Network injection can only be set when the Foundry resource is created; it can't be added to an existing deployment.
      fr: |
        L'injection réseau ne peut être définie qu'à la création de la ressource Foundry ; elle ne peut pas être ajoutée à un déploiement existant.
    b:
      en: |
        A private endpoint secures inbound access to the resource; it doesn't carry the agents' outbound traffic.
      fr: |
        Un point de terminaison privé sécurise l'accès entrant à la ressource ; il ne transporte pas le trafic sortant des agents.
    d:
      en: |
        Public network access controls inbound traffic, and a route in your subnet doesn't apply to agent compute that isn't injected into it.
      fr: |
        L'accès réseau public contrôle le trafic entrant, et un itinéraire de votre sous-réseau ne s'applique pas au calcul des agents qui n'y est pas injecté.
references:
  - title: How to configure network isolation for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
  - title: Set up private networking for Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks
