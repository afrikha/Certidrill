id: ai300-3a-byo-search-endpoint
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware deploys a Foundry resource named **foundry-prs** with a standard agent setup and private networking. The agent subnet and the private endpoint subnet are in a virtual network named **vnet-prs**. The deployment uses an existing Azure AI Search service named **srch-prs** that has public network access disabled.

    Agents fail to reach srch-prs. The Foundry resource and its private endpoint work as expected.

    What should you do?
  fr: |
    Proseware déploie une ressource Foundry nommée **foundry-prs** avec une configuration d'agent standard et une mise en réseau privée. Le sous-réseau des agents et le sous-réseau des points de terminaison privés se trouvent dans un réseau virtuel nommé **vnet-prs**. Le déploiement utilise un service Azure AI Search existant nommé **srch-prs** dont l'accès réseau public est désactivé.

    Les agents ne parviennent pas à joindre srch-prs. La ressource Foundry et son point de terminaison privé fonctionnent comme prévu.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Allow trusted Azure services in the network settings of foundry-prs.", fr: "Autoriser les services Azure approuvés dans les paramètres réseau de foundry-prs." } }
    - { id: b, text: { en: "Create a private endpoint for srch-prs in vnet-prs.", fr: "Créer un point de terminaison privé pour srch-prs dans vnet-prs." } }
    - { id: c, text: { en: "Create a second private endpoint for foundry-prs in the agent subnet.", fr: "Créer un deuxième point de terminaison privé pour foundry-prs dans le sous-réseau des agents." } }
    - { id: d, text: { en: "Delegate the private endpoint subnet to Microsoft.App/environments.", fr: "Déléguer le sous-réseau des points de terminaison privés à Microsoft.App/environments." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Private endpoints to Azure AI Search, Azure Storage and Azure Cosmos DB aren't created automatically with the Foundry resource. You create a private endpoint for srch-prs in vnet-prs, with its private DNS zone, so the agents reach it privately.
    fr: |
      Les points de terminaison privés vers Azure AI Search, Stockage Azure et Azure Cosmos DB ne sont pas créés automatiquement avec la ressource Foundry. Vous créez un point de terminaison privé pour srch-prs dans vnet-prs, avec sa zone DNS privée, afin que les agents le joignent en privé.
  options:
    a:
      en: |
        The trusted services setting of foundry-prs controls inbound access to the Foundry resource, not access from the agents to the search service.
      fr: |
        Le paramètre des services approuvés de foundry-prs contrôle l'accès entrant à la ressource Foundry, pas l'accès des agents au service de recherche.
    c:
      en: |
        Another private endpoint for the Foundry resource doesn't give a private path to srch-prs.
      fr: |
        Un autre point de terminaison privé pour la ressource Foundry ne fournit pas de chemin privé vers srch-prs.
    d:
      en: |
        Only the agent subnet is delegated to `Microsoft.App/environments`; the delegation doesn't create a path to srch-prs.
      fr: |
        Seul le sous-réseau des agents est délégué à `Microsoft.App/environments` ; la délégation ne crée pas de chemin vers srch-prs.
references:
  - title: Set up private networking for Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks
