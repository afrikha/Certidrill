id: ai300-3c-safety-sysmsg-parts
objective: "3.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is writing the system message of a mortgage assistant that runs on a chat model in Microsoft Foundry. The team follows Microsoft's guidance for safety system messages and wants each line to belong to the right component.

    To which component does each line belong? To answer, drag the appropriate components to the correct lines. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank rédige le message système d'un assistant de prêts immobiliers qui s'exécute sur un modèle de conversation dans Microsoft Foundry. L'équipe suit les recommandations de Microsoft sur les messages système de sécurité et veut que chaque ligne appartienne au bon composant.

    À quel composant appartient chaque ligne ? Pour répondre, faites glisser les composants appropriés vers les lignes correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: role, text: { en: "Role and task", fr: "Rôle et tâche" } }
    - { id: tone, text: { en: "Audience and tone", fr: "Public et ton" } }
    - { id: scope, text: { en: "Scope and boundaries", fr: "Périmètre et limites" } }
    - { id: safety, text: { en: "Safety guidelines", fr: "Consignes de sécurité" } }
    - { id: tools, text: { en: "Tools and data", fr: "Outils et données" } }
  targets:
    - id: t1
      text: { en: "\"You are an assistant for the Woodgrove mortgage team. Your job is to answer questions about loan applications.\"", fr: "« Tu es un assistant de l'équipe prêts immobiliers de Woodgrove. Ta mission est de répondre aux questions sur les demandes de prêt. »" }
    - id: t2
      text: { en: "\"Only answer questions about Woodgrove mortgage products. If a request is out of scope, say that you can't help and suggest contacting a branch.\"", fr: "« Réponds uniquement aux questions sur les prêts immobiliers Woodgrove. Si une demande sort de ce cadre, indique que tu ne peux pas aider et propose de contacter une agence. »" }
    - id: t3
      text: { en: "\"Never ask for or repeat passwords, card numbers or other personal information that isn't needed to look up an application.\"", fr: "« Ne demande et ne répète jamais de mots de passe, de numéros de carte ou d'autres informations personnelles non nécessaires à la recherche d'un dossier. »" }
    - id: t4
      text: { en: "\"Use the rates_lookup tool to get the current interest rate before you quote a rate.\"", fr: "« Utilise l'outil rates_lookup pour obtenir le taux d'intérêt actuel avant de citer un taux. »" }
answer:
  mapping: { t1: role, t2: scope, t3: safety, t4: tools }
explanation:
  correct:
    en: The role and task component states what the assistant is and what it is responsible for. Scope and boundaries say what it must not do and what to do when it can't comply. Safety guidelines cover sensitive topics such as personal information. Tools and data say which tools or sources the model can use and how. Audience and tone, which describes who reads the answers and the expected voice, matches none of the lines.
    fr: Le composant rôle et tâche indique ce qu'est l'assistant et ce dont il est responsable. Le périmètre et les limites précisent ce qu'il ne doit pas faire et la conduite à tenir lorsqu'il ne peut pas répondre. Les consignes de sécurité couvrent les sujets sensibles comme les informations personnelles. Les outils et données indiquent quels outils ou sources le modèle peut utiliser et comment. Le public et le ton, qui décrit les lecteurs des réponses et la voix attendue, ne correspond à aucune ligne.
references:
  - title: Safety system messages
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/system-message
