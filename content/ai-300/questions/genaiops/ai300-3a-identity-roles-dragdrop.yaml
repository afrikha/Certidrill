id: ai300-3a-identity-roles-dragdrop
objective: "3.1.2"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam configures a Foundry resource named **foundry-fbk** that has a system-assigned managed identity. You must grant the access described for each requirement. Each requirement must be met by using the least-privilege role.

    Which role should you assign for each requirement? To answer, drag the appropriate roles to the correct requirements. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam configure une ressource Foundry nommée **foundry-fbk** qui possède une identité managée affectée par le système. Vous devez accorder l'accès décrit pour chaque exigence. Chaque exigence doit être satisfaite avec le rôle de moindre privilège.

    Quel rôle devez-vous attribuer pour chaque exigence ? Pour répondre, faites glisser les rôles appropriés vers les exigences correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: blobreader, text: Storage Blob Data Reader }
    - { id: crypto, text: Key Vault Crypto User }
    - { id: secrets, text: Key Vault Secrets User }
    - { id: approver, text: Azure AI Enterprise Network Connection Approver }
    - { id: cosmosop, text: Cosmos DB Operator }
    - { id: netcontrib, text: Network Contributor }
  targets:
    - id: t1
      text: { en: "The managed identity of foundry-fbk must read documents from a storage account that was created outside Foundry.", fr: "L'identité managée de foundry-fbk doit lire des documents dans un compte de stockage créé en dehors de Foundry." }
    - id: t2
      text: { en: "The managed identity of foundry-fbk must use a key in a key vault that uses the Azure RBAC permission model, for customer-managed keys.", fr: "L'identité managée de foundry-fbk doit utiliser une clé d'un coffre de clés qui utilise le modèle d'autorisation Azure RBAC, pour les clés gérées par le client." }
    - id: t3
      text: { en: "The managed identity of foundry-fbk must create and approve the managed private endpoints of its managed virtual network.", fr: "L'identité managée de foundry-fbk doit créer et approuver les points de terminaison privés managés de son réseau virtuel managé." }
    - id: t4
      text: { en: "The engineer who deploys the agent capability settings must reference an Azure Cosmos DB account for thread storage.", fr: "L'ingénieur qui déploie les paramètres de capacité des agents doit référencer un compte Azure Cosmos DB pour le stockage des threads." }
answer:
  mapping: { t1: blobreader, t2: crypto, t3: approver, t4: cosmosop }
explanation:
  correct:
    en: |
      To use a storage account created outside Foundry, the Foundry resource's managed identity gets Storage Blob Data Reader on it. For customer-managed keys with Azure RBAC, the identity needs Key Vault Crypto User. Azure AI Enterprise Network Connection Approver lets the identity create and approve managed private endpoints. The identity that deploys capability settings needs Cosmos DB Operator on the Cosmos DB account.
    fr: |
      Pour utiliser un compte de stockage créé en dehors de Foundry, l'identité managée de la ressource Foundry reçoit Storage Blob Data Reader sur ce compte. Pour les clés gérées par le client avec Azure RBAC, l'identité a besoin de Key Vault Crypto User. Azure AI Enterprise Network Connection Approver permet à l'identité de créer et d'approuver des points de terminaison privés managés. L'identité qui déploie les paramètres de capacité a besoin de Cosmos DB Operator sur le compte Cosmos DB.
  options:
    secrets:
      en: |
        Key Vault Secrets User reads secrets, not cryptographic keys used for encryption.
      fr: |
        Key Vault Secrets User lit des secrets, pas les clés de chiffrement utilisées pour le chiffrement.
    netcontrib:
      en: |
        Network Contributor manages networks in your subscription; managed private endpoints are approved through the Network Connection Approver role.
      fr: |
        Network Contributor gère des réseaux dans votre abonnement ; les points de terminaison privés managés sont approuvés grâce au rôle Network Connection Approver.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
  - title: Configure customer-managed keys for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/encryption-keys-portal
