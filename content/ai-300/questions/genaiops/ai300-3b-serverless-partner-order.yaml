id: ai300-3b-serverless-partner-order
objective: "3.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Machine Learning workspace named **mlw-wg** in a region that supports serverless deployment of a partner model. The model is billed through Azure Marketplace, and the workspace has never used this offering.

    You need to deploy the model as a serverless deployment by using the Azure CLI and give its keys to the application team.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank dispose d'un espace de travail Azure Machine Learning nommé **mlw-wg** dans une région qui prend en charge le déploiement serverless d'un modèle partenaire. Le modèle est facturé via la Place de marché Azure, et l'espace de travail n'a jamais utilisé cette offre.

    Vous devez déployer le modèle en tant que déploiement serverless à l'aide d'Azure CLI et transmettre ses clés à l'équipe applicative.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: id, text: { en: "Copy the model ID from the model card, without the version.", fr: "Copier l'ID du modèle depuis la fiche du modèle, sans la version." } }
    - { id: sub, text: { en: "Run `az ml marketplace-subscription create` for the model offering.", fr: "Exécuter `az ml marketplace-subscription create` pour l'offre du modèle." } }
    - { id: ep, text: { en: "Run `az ml serverless-endpoint create` with the endpoint YAML file.", fr: "Exécuter `az ml serverless-endpoint create` avec le fichier YAML du point de terminaison." } }
    - { id: keys, text: { en: "Run `az ml serverless-endpoint get-credentials`.", fr: "Exécuter `az ml serverless-endpoint get-credentials`." } }
    - { id: quota, text: { en: "Request virtual machine quota for the GPU family of the model.", fr: "Demander un quota de machines virtuelles pour la famille de GPU du modèle." } }
    - { id: online, text: { en: "Run `az ml online-endpoint create` with the endpoint YAML file.", fr: "Exécuter `az ml online-endpoint create` avec le fichier YAML du point de terminaison." } }
answer:
  sequence: [ id, sub, ep, keys ]
explanation:
  correct:
    en: |
      You first get the catalog model ID without its version, because serverless deployments always deploy the latest version. A non-Microsoft model needs a marketplace subscription, once per workspace and offering, before the endpoint can be created. You then create the serverless endpoint and retrieve its keys with get-credentials.
    fr: |
      Vous récupérez d'abord l'ID du modèle du catalogue sans sa version, car les déploiements serverless déploient toujours la dernière version. Un modèle non Microsoft exige un abonnement de la Place de marché, une fois par espace de travail et par offre, avant de pouvoir créer le point de terminaison. Vous créez ensuite le point de terminaison serverless et récupérez ses clés avec get-credentials.
  options:
    quota:
      en: |
        Serverless deployments don't use the subscription's VM quota; only managed compute does.
      fr: |
        Les déploiements serverless n'utilisent pas le quota de machines virtuelles de l'abonnement ; seul le calcul managé l'utilise.
    online:
      en: |
        A managed online endpoint is for managed compute deployments, not serverless deployments.
      fr: |
        Un point de terminaison en ligne managé est destiné aux déploiements sur calcul managé, pas aux déploiements serverless.
references:
  - title: Deploy models as standard deployments
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-models-serverless
  - title: az ml marketplace-subscription
    url: https://learn.microsoft.com/en-us/cli/azure/ml/marketplace-subscription
