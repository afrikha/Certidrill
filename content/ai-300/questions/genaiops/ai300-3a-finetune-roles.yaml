id: ai300-3a-finetune-roles
objective: "3.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A data scientist at Woodgrove must fine-tune a model in the default project of a Foundry resource named **foundry-wgb** and then deploy the fine-tuned model on foundry-wgb.

    Company policy forbids assigning the Foundry Owner role. You need to assign roles on foundry-wgb to the data scientist. The solution must follow the principle of least privilege.

    Which two roles should you assign? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une scientifique des données de Woodgrove doit effectuer le réglage précis d'un modèle dans le projet par défaut d'une ressource Foundry nommée **foundry-wgb**, puis déployer le modèle ajusté sur foundry-wgb.

    La stratégie de l'entreprise interdit d'attribuer le rôle Foundry Owner. Vous devez attribuer des rôles sur foundry-wgb à la scientifique des données. La solution doit respecter le principe du moindre privilège.

    Quels sont les deux rôles à attribuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Foundry Project Manager }
    - { id: b, text: Foundry Agent Consumer }
    - { id: c, text: Foundry User }
    - { id: d, text: Reader }
    - { id: e, text: Foundry Account Owner }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      Fine-tuning needs data plane permissions, and deploying the fine-tuned model is a control plane operation. Without Foundry Owner, Microsoft documents the combination of Foundry User for the data plane and Foundry Account Owner for the control plane.
    fr: |
      Le réglage précis nécessite des autorisations du plan de données, et le déploiement du modèle ajusté est une opération du plan de contrôle. Sans Foundry Owner, Microsoft documente la combinaison de Foundry User pour le plan de données et de Foundry Account Owner pour le plan de contrôle.
  options:
    a:
      en: |
        Foundry Project Manager can't create or manage deployments, and for the data plane it grants more than Foundry User (publishing agents, assigning Foundry User).
      fr: |
        Foundry Project Manager ne peut ni créer ni gérer de déploiements, et pour le plan de données il accorde plus que Foundry User (publication d'agents, attribution de Foundry User).
    b:
      en: |
        Foundry Agent Consumer only allows interaction with agent endpoints.
      fr: |
        Foundry Agent Consumer permet uniquement d'interagir avec les points de terminaison des agents.
    d:
      en: |
        Reader grants read access only: no data actions and no deployments.
      fr: |
        Reader accorde uniquement un accès en lecture : aucune action de données et aucun déploiement.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
