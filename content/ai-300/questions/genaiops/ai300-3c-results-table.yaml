id: ai300-3c-results-table
objective: "3.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso compares three variants of its trail guide agent with the production baseline. Each variant is on its own Git branch and was run against the same test prompts. The success criteria, defined before the experiment, are:

    - average quality score of 4.2 or more, and no response below 3.5;
    - average cost per request at least 30 % lower than the baseline;
    - average response time under 30 seconds.

    | Branch | Average quality | Lowest response score | Average cost per request (USD) | Average response time |
    | --- | --- | --- | --- | --- |
    | main (baseline) | 4.3 | 3.8 | 0.024 | 21 s |
    | experiment/prompt-concise | 4.4 | 3.6 | 0.014 | 14 s |
    | experiment/small-model | 4.0 | 3.0 | 0.006 | 12 s |
    | experiment/detailed-examples | 4.6 | 4.0 | 0.042 | 33 s |

    How should you complete the analysis? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso compare trois variantes de son agent de guide de randonnée à la référence de production. Chaque variante se trouve sur sa propre branche Git et a été exécutée sur les mêmes invites de test. Les critères de réussite, définis avant l'expérience, sont :

    - score de qualité moyen de 4,2 ou plus, et aucune réponse sous 3,5 ;
    - coût moyen par requête inférieur d'au moins 30 % à celui de la référence ;
    - temps de réponse moyen inférieur à 30 secondes.

    | Branche | Qualité moyenne | Score de réponse le plus bas | Coût moyen par requête (USD) | Temps de réponse moyen |
    | --- | --- | --- | --- | --- |
    | main (référence) | 4,3 | 3,8 | 0,024 | 21 s |
    | experiment/prompt-concise | 4,4 | 3,6 | 0,014 | 14 s |
    | experiment/small-model | 4,0 | 3,0 | 0,006 | 12 s |
    | experiment/detailed-examples | 4,6 | 4,0 | 0,042 | 33 s |

    Comment devez-vous compléter l'analyse ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The branch to merge into main is [[win]].
      experiment/small-model fails because [[small]].
      experiment/detailed-examples fails because [[detail]].
    fr: |
      La branche à fusionner dans main est [[win]].
      experiment/small-model échoue parce que [[small]].
      experiment/detailed-examples échoue parce que [[detail]].
  slots:
    - id: win
      options:
        - { id: concise, text: experiment/prompt-concise }
        - { id: small, text: experiment/small-model }
        - { id: detailed, text: experiment/detailed-examples }
        - { id: none, text: { en: "none (keep main unchanged)", fr: "aucune (main reste inchangée)" } }
    - id: small
      options:
        - { id: quality, text: { en: "its average and lowest quality scores are below the thresholds", fr: "ses scores de qualité moyen et minimal sont sous les seuils" } }
        - { id: cost, text: { en: "its cost reduction is less than 30 %", fr: "sa réduction de coût est inférieure à 30 %" } }
        - { id: time, text: { en: "its response time is 30 seconds or more", fr: "son temps de réponse atteint 30 secondes ou plus" } }
    - id: detail
      options:
        - { id: costtime, text: { en: "its cost and its response time exceed the criteria", fr: "son coût et son temps de réponse dépassent les critères" } }
        - { id: quality, text: { en: "its average quality score is below the threshold", fr: "son score de qualité moyen est sous le seuil" } }
        - { id: lowest, text: { en: "its lowest response score is below 3.5", fr: "son score de réponse le plus bas est sous 3,5" } }
answer:
  values: { win: concise, small: quality, detail: costtime }
explanation:
  correct:
    en: experiment/prompt-concise meets every criterion (quality 4.4 with a lowest score of 3.6, cost 0.014, about 42 % less than 0.024, and 14 seconds). experiment/small-model cuts cost by 75 % and is fast, but its average (4.0) and lowest (3.0) quality scores miss the thresholds. experiment/detailed-examples has the best quality, but its cost rises above the baseline and its response time (33 s) exceeds 30 seconds. A variant must satisfy quality, cost and performance together.
    fr: experiment/prompt-concise satisfait tous les critères (qualité 4,4 avec un score minimal de 3,6, coût 0,014, soit environ 42 % de moins que 0,024, et 14 secondes). experiment/small-model réduit le coût de 75 % et est rapide, mais ses scores de qualité moyen (4,0) et minimal (3,0) manquent les seuils. experiment/detailed-examples offre la meilleure qualité, mais son coût dépasse celui de la référence et son temps de réponse (33 s) dépasse 30 secondes. Une variante doit satisfaire ensemble la qualité, le coût et les performances.
references:
  - title: Design evaluation experiments
    url: https://learn.microsoft.com/en-us/training/modules/evaluate-optimize-agents/2-design-evaluation-experiments
  - title: Apply Git-based workflows to optimization experiments
    url: https://learn.microsoft.com/en-us/training/modules/evaluate-optimize-agents/3-git-based-experimentation-workflow
