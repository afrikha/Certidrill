id: ai300-3c-prompt-file-format
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam deploys three agents to a Microsoft Foundry project by running Python scripts from a GitHub repository. The system instructions of the agents contain no variables. They are reviewed in pull requests by support managers who don't read Python.

    You need to store the system instructions so that prompt-only changes produce clear diffs, the deployment scripts can read them directly, and no extra tooling is required.

    How should you store the system instructions?
  fr: |
    Fabrikam déploie trois agents dans un projet Microsoft Foundry en exécutant des scripts Python depuis un dépôt GitHub. Les instructions système des agents ne contiennent aucune variable. Elles sont relues dans des demandes de tirage par des responsables du support qui ne lisent pas le Python.

    Vous devez stocker les instructions système de façon que les modifications portant uniquement sur les invites produisent des différences claires, que les scripts de déploiement puissent les lire directement et qu'aucun outil supplémentaire ne soit nécessaire.

    Comment devez-vous stocker les instructions système ?
body:
  options:
    - id: a
      text: { en: "As a string constant inside each deployment script, next to the call that creates the agent", fr: "Sous forme de constante de chaîne dans chaque script de déploiement, à côté de l'appel qui crée l'agent" }
    - id: b
      text: { en: "As one Jinja2 template per prompt version, rendered by a templating step before each deployment", fr: "Sous forme d'un modèle Jinja2 par version d'invite, rendu par une étape de génération avant chaque déploiement" }
    - id: c
      text: { en: "As one plain text file per prompt version, in a prompts folder next to each deployment script", fr: "Sous forme d'un fichier texte brut par version d'invite, dans un dossier prompts à côté de chaque script de déploiement" }
    - id: d
      text: { en: "Only in the agent definitions in the Foundry portal, with an exported copy attached to each pull request", fr: "Uniquement dans les définitions d'agent du portail Foundry, avec une copie exportée jointe à chaque demande de tirage" }
answer: { optionId: c }
explanation:
  correct:
    en: Plain text files are the recommended default for agent prompts. They work with any editor, produce clear Git diffs that nontechnical reviewers can read, and Python SDK scripts can read them directly. Naming them with a version number (v1_instructions.txt, v2_instructions.txt) in a prompts subfolder keeps them aligned with the deployed agent versions.
    fr: Les fichiers texte brut sont le format recommandé par défaut pour les invites d'agent. Ils fonctionnent avec n'importe quel éditeur, produisent des différences Git claires que des relecteurs non techniques peuvent lire, et les scripts du SDK Python peuvent les lire directement. Les nommer avec un numéro de version (v1_instructions.txt, v2_instructions.txt) dans un sous-dossier prompts les garde alignés sur les versions d'agent déployées.
  options:
    a:
      en: Embedded prompts are simple but mix prompt and code, which makes prompt-only changes harder to review for people who don't read Python.
      fr: Les invites intégrées sont simples mais mélangent invite et code, ce qui complique la relecture des modifications d'invite pour des personnes qui ne lisent pas le Python.
    b:
      en: Jinja2 templates are for variable substitution, which these prompts don't need, and they add a templating step.
      fr: Les modèles Jinja2 servent à la substitution de variables, dont ces invites n'ont pas besoin, et ajoutent une étape de rendu.
    d:
      en: Prompts kept only in the portal have no Git history, so diffs, reviews and rollback are lost.
      fr: "Des invites conservées uniquement dans le portail n'ont pas d'historique Git : différences, relectures et restauration sont perdues."
references:
  - title: Organize prompts in GitHub repositories
    url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/4-github-repository-structure
