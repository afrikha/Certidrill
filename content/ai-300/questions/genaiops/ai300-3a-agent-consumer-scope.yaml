id: ai300-3a-agent-consumer-scope
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Foundry project named **proj-support** that contains three agents: **claims-bot**, **hr-bot** and **it-bot**. A web app authenticates to Foundry by using its managed identity.

    The web app must be able to interact with the endpoint of claims-bot only. It must not be able to call the other agents or create and modify agents. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Contoso dispose d'un projet Foundry nommé **proj-support** qui contient trois agents : **claims-bot**, **hr-bot** et **it-bot**. Une application web s'authentifie auprès de Foundry avec son identité managée.

    L'application web doit pouvoir interagir uniquement avec le point de terminaison de claims-bot. Elle ne doit pas pouvoir appeler les autres agents, ni créer ou modifier des agents. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign Foundry Agent Consumer at the Foundry resource scope by using the Azure portal.", fr: "Attribuer Foundry Agent Consumer à l'étendue de la ressource Foundry dans le portail Azure." } }
    - { id: b, text: { en: "Assign Foundry User at the proj-support scope by using the Azure CLI.", fr: "Attribuer Foundry User à l'étendue de proj-support avec Azure CLI." } }
    - { id: c, text: { en: "Assign Foundry Agent Consumer at the proj-support scope by using the Azure CLI.", fr: "Attribuer Foundry Agent Consumer à l'étendue de proj-support avec Azure CLI." } }
    - { id: d, text: { en: "Assign Foundry Agent Consumer at the claims-bot agent scope by using the Azure CLI.", fr: "Attribuer Foundry Agent Consumer à l'étendue de l'agent claims-bot avec Azure CLI." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Foundry Agent Consumer only grants interaction with agent endpoints. Assigned at the scope of one agent (`.../projects/proj-support/agents/claims-bot`), it grants access to that agent's endpoint only. The Azure portal supports this role only at the account scope, so you use the Azure CLI for a project or agent scope.
    fr: |
      Foundry Agent Consumer accorde uniquement l'interaction avec les points de terminaison des agents. Attribué à l'étendue d'un agent (`.../projects/proj-support/agents/claims-bot`), il donne accès au seul point de terminaison de cet agent. Le portail Azure ne prend en charge ce rôle qu'à l'étendue du compte : vous utilisez donc Azure CLI pour une étendue de projet ou d'agent.
  options:
    a:
      en: |
        At the resource scope, the web app could call the endpoints of every agent in every project of the resource.
      fr: |
        À l'étendue de la ressource, l'application web pourrait appeler les points de terminaison de tous les agents de tous les projets de la ressource.
    b:
      en: |
        Foundry User also grants data actions to build and modify agents, and it applies to every agent of the project.
      fr: |
        Foundry User accorde aussi les actions de données permettant de créer et de modifier des agents, et il s'applique à tous les agents du projet.
    c:
      en: |
        Project scope grants access to every agent endpoint in proj-support, including hr-bot and it-bot.
      fr: |
        L'étendue du projet donne accès à tous les points de terminaison d'agents de proj-support, y compris hr-bot et it-bot.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
