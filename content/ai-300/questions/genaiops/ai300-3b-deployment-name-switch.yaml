id: ai300-3b-deployment-name-switch
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a Microsoft Foundry resource with two Global Standard deployments:

    | Deployment name | Model | Version |
    | --- | --- | --- |
    | support-v1 | gpt-4.1 | 2025-04-14 |
    | support-v2 | gpt-5.1 | 2025-11-13 |

    The team validated support-v2. The application calls `client.responses.create(model=..., input=...)` with the OpenAI SDK, and it must now use gpt-5.1.

    Which value should the application pass in the `model` parameter?
  fr: |
    Wingtip Toys dispose d'une ressource Microsoft Foundry avec deux déploiements Global Standard :

    | Nom du déploiement | Modèle | Version |
    | --- | --- | --- |
    | support-v1 | gpt-4.1 | 2025-04-14 |
    | support-v2 | gpt-5.1 | 2025-11-13 |

    L'équipe a validé support-v2. L'application appelle `client.responses.create(model=..., input=...)` avec le SDK OpenAI, et elle doit maintenant utiliser gpt-5.1.

    Quelle valeur l'application doit-elle passer dans le paramètre `model` ?
body:
  options:
    - { id: a, text: "\"gpt-5.1\"" }
    - { id: b, text: "\"2025-11-13\"" }
    - { id: c, text: "\"support-v2\"" }
    - { id: d, text: "\"GlobalStandard\"" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Inference calls use the deployment name, not the model name, as the model parameter. Keeping each model version in its own named deployment lets you validate a new version and then switch the application by changing only the deployment name.
    fr: |
      Les appels d'inférence utilisent le nom du déploiement, et non le nom du modèle, comme paramètre model. Placer chaque version de modèle dans son propre déploiement nommé permet de valider une nouvelle version, puis de basculer l'application en changeant uniquement le nom du déploiement.
  options:
    a: { en: "The model name isn't what the endpoint routes on; requests target a deployment.", fr: "Le nom du modèle n'est pas ce qu'utilise le point de terminaison pour l'acheminement ; les requêtes ciblent un déploiement." }
    b: { en: "The model version is a property of the deployment, not a value for the model parameter.", fr: "La version du modèle est une propriété du déploiement, pas une valeur du paramètre model." }
    d: { en: "GlobalStandard is the SKU name of the deployment type.", fr: "GlobalStandard est le nom de la référence SKU du type de déploiement." }
references:
  - title: "Quickstart: Create a provisioned throughput deployment"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/provisioned-quickstart
