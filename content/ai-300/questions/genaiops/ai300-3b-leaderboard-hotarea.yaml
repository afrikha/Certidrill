id: ai300-3b-leaderboard-hotarea
objective: "3.2.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys exported benchmark results of five candidate models from the model leaderboard of the Microsoft Foundry portal. The results are shown in the following table.

    Answer each prompt by selecting the appropriate candidate.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys a exporté les résultats de benchmark de cinq modèles candidats depuis le classement des modèles du portail Microsoft Foundry. Les résultats figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le candidat approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "A live chat feature needs a throughput of at least 150 GTPS. Select the candidate with the highest quality index that meets this requirement.", fr: "Une fonctionnalité de conversation en direct exige un débit d'au moins 150 GTPS. Sélectionnez le candidat dont l'index de qualité est le plus élevé parmi ceux qui répondent à cette exigence." }
    - id: p2
      text: { en: "A summarization job sends 500,000-token documents in a single request. Select the candidate with the lowest estimated cost that meets this requirement.", fr: "Un travail de synthèse envoie des documents de 500 000 jetons en une seule requête. Sélectionnez le candidat dont le coût estimé est le plus bas parmi ceux qui répondent à cette exigence." }
  grid:
    header: [{ en: "Candidate", fr: "Candidat" }, { en: "Quality index", fr: "Index de qualité" }, { en: "Estimated cost", fr: "Coût estimé" }, { en: "Throughput (GTPS)", fr: "Débit (GTPS)" }, { en: "Context window (tokens)", fr: "Fenêtre de contexte (jetons)" }]
    rows:
      - [{ text: Model-A, area: ma }, { text: "0.82" }, { text: "4.00" }, { text: "60" }, { text: "1,000,000" }]
      - [{ text: Model-B, area: mb }, { text: "0.78" }, { text: "1.20" }, { text: "160" }, { text: "400,000" }]
      - [{ text: Model-C, area: mc }, { text: "0.71" }, { text: "0.40" }, { text: "210" }, { text: "128,000" }]
      - [{ text: Model-D, area: md }, { text: "0.80" }, { text: "2.50" }, { text: "120" }, { text: "1,000,000" }]
      - [{ text: Model-E, area: me }, { text: "0.74" }, { text: "0.90" }, { text: "180" }, { text: "1,000,000" }]
answer:
  values: { p1: mb, p2: me }
explanation:
  correct:
    en: |
      Only B, C and E reach 150 GTPS, and B has the highest quality index of the three (0.78). Only A, D and E have a context window large enough for a 500,000-token request, and E is the cheapest of them. Trade-offs like these are why the leaderboard lets you plot quality against cost, throughput or safety; confirm the shortlisted model with an evaluation on your own data.
    fr: |
      Seuls B, C et E atteignent 150 GTPS, et B a l'index de qualité le plus élevé des trois (0,78). Seuls A, D et E ont une fenêtre de contexte assez grande pour une requête de 500 000 jetons, et E est le moins cher des trois. C'est pour ce type de compromis que le classement permet de tracer la qualité en fonction du coût, du débit ou de la sécurité ; confirmez le modèle présélectionné par une évaluation sur vos propres données.
references:
  - title: Compare and select models using the model leaderboard in Foundry portal
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/benchmark-model-in-catalog
