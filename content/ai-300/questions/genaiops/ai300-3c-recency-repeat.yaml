id: ai300-3c-recency-repeat
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses a non-reasoning GPT chat model deployed in a Microsoft Foundry project to summarize long insurance claim files. The prompt starts with the instruction "Return the summary as a JSON object with the fields claimId, cause and amount", followed by the full claim file, which is several thousand words long.

    For the longest files, the model often returns a prose summary instead of JSON. You need to improve compliance with the output format without changing the model or the deployment.

    What should you do first?
  fr: |
    Fabrikam utilise un modèle de conversation GPT sans raisonnement déployé dans un projet Microsoft Foundry pour résumer de longs dossiers de sinistre. L'invite commence par l'instruction « Renvoie le résumé sous forme d'objet JSON avec les champs claimId, cause et amount », suivie du dossier complet, long de plusieurs milliers de mots.

    Pour les dossiers les plus longs, le modèle renvoie souvent un résumé en prose au lieu de JSON. Vous devez améliorer le respect du format de sortie sans changer de modèle ni de déploiement.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Raise the temperature so that the model explores more output formats.", fr: "Augmenter la température pour que le modèle explore davantage de formats de sortie." }
    - id: b
      text: { en: "Repeat the format instruction after the claim file, at the end of the prompt.", fr: "Répéter l'instruction de format après le dossier, à la fin de l'invite." }
    - id: c
      text: { en: "Move the format instruction into a separate assistant message before the claim file.", fr: "Déplacer l'instruction de format dans un message assistant distinct avant le dossier." }
    - id: d
      text: { en: "Remove the separators between the instruction and the claim file to save tokens.", fr: "Supprimer les séparateurs entre l'instruction et le dossier pour économiser des jetons." }
answer: { optionId: b }
explanation:
  correct:
    en: Models can show recency bias, so information at the end of a long prompt can weigh more than an instruction at the beginning. Microsoft recommends doubling down by repeating the instruction after the primary content, then evaluating the result.
    fr: "Les modèles peuvent présenter un biais de récence : les informations situées à la fin d'une longue invite peuvent peser davantage qu'une instruction placée au début. Microsoft recommande d'insister en répétant l'instruction après le contenu principal, puis d'évaluer le résultat."
  options:
    a:
      en: A higher temperature makes the output more random, which works against a strict format.
      fr: Une température plus élevée rend la sortie plus aléatoire, ce qui va à l'encontre d'un format strict.
    c:
      en: An assistant message represents a previous model answer; it does not reinforce the instruction where the model loses it, after the long content.
      fr: Un message assistant représente une réponse précédente du modèle ; il ne renforce pas l'instruction là où le modèle la perd, après le long contenu.
    d:
      en: Clear separators help the model distinguish instructions from content; removing them makes the prompt harder to interpret.
      fr: Des séparateurs clairs aident le modèle à distinguer les instructions du contenu ; les supprimer rend l'invite plus difficile à interpréter.
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
