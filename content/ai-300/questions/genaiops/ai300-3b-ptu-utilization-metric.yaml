id: ai300-3b-ptu-utilization-metric
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has a Global Provisioned deployment that returns HTTP 429 responses during afternoon peaks. Before buying more PTUs, the team wants to measure, over time, how much of the deployed PTU capacity the deployment consumes.

    What should the team use?
  fr: |
    Tailspin Toys dispose d'un déploiement Global Provisioned qui renvoie des réponses HTTP 429 lors des pointes de l'après-midi. Avant d'acheter davantage de PTU, l'équipe veut mesurer dans le temps la part de la capacité en PTU déployée que consomme le déploiement.

    Que doit utiliser l'équipe ?
body:
  options:
    - { id: a, text: { en: "The Utilization (%) value on the Reservations page", fr: "La valeur Utilization (%) de la page Réservations" } }
    - { id: b, text: { en: "The Provisioned-managed utilization V2 metric in Azure Monitor", fr: "La métrique Provisioned-managed utilization V2 dans Azure Monitor" } }
    - { id: c, text: { en: "The Provisioned throughput unit tab of the Quota page", fr: "L'onglet Provisioned throughput unit de la page Quota" } }
    - { id: d, text: { en: "The x-ratelimit-remaining-tokens header of each response", fr: "L'en-tête x-ratelimit-remaining-tokens de chaque réponse" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Provisioned-managed utilization V2 is the PTUs consumed divided by the PTUs deployed over a period, and you can split it by deployment. At 100 % utilization, the service returns 429 immediately with retry-after-ms and retry-after headers, which is a traffic-management signal rather than a service error.
    fr: |
      Provisioned-managed utilization V2 correspond aux PTU consommées divisées par les PTU déployées sur une période, et vous pouvez la fractionner par déploiement. À 100 % d'utilisation, le service renvoie immédiatement une réponse 429 avec les en-têtes retry-after-ms et retry-after : c'est un signal de gestion du trafic, pas une erreur du service.
  options:
    a: { en: "Reservation utilization shows how much of the reserved quantity matches running deployments, not how busy a deployment is.", fr: "L'utilisation de la réservation montre la part de la quantité réservée qui correspond à des déploiements en cours, pas la charge d'un déploiement." }
    c: { en: "The Quota page shows how many PTUs are allocated against the quota, not how much of them is consumed by traffic.", fr: "La page Quota montre combien de PTU sont attribuées sur le quota, pas la part consommée par le trafic." }
    d: { en: "The rate-limit headers describe the TPM and RPM limits of standard deployments; they don't give a utilization history.", fr: "Les en-têtes de limite de débit décrivent les limites de TPM et de RPM des déploiements standard ; ils ne fournissent pas d'historique d'utilisation." }
references:
  - title: Operate provisioned throughput deployments in production
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-get-started
