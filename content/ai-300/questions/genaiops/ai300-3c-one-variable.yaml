id: ai300-3c-one-variable
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adventure Works runs a trail guide agent in a Microsoft Foundry project. On an experiment branch, a developer replaced the system instructions with a shorter prompt and also switched the agent to a smaller model. Tested against the team's five test prompts, the variant scored 0.3 points higher than the production baseline and cost less.

    The product owner wants to know which change caused the quality improvement before approving it.

    What should you do?
  fr: |
    Adventure Works exécute un agent de guide de randonnée dans un projet Microsoft Foundry. Sur une branche d'expérience, un développeur a remplacé les instructions système par une invite plus courte et a aussi fait passer l'agent sur un modèle plus petit. Testée sur les cinq invites de test de l'équipe, la variante a obtenu 0,3 point de plus que la référence de production, pour un coût inférieur.

    Le responsable produit veut savoir quelle modification a causé l'amélioration de la qualité avant de l'approuver.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Run the combined variant again at a temperature of 0 to remove randomness from the scores.", fr: "Exécuter à nouveau la variante combinée avec une température de 0 pour supprimer l'aléa des scores." }
    - id: b
      text: { en: "Run the combined variant against a new set of test prompts that the baseline has never seen.", fr: "Exécuter la variante combinée sur un nouveau jeu d'invites de test que la référence n'a jamais vu." }
    - id: c
      text: { en: "Compare the token counts of the combined variant and the baseline for each test prompt.", fr: "Comparer le nombre de jetons de la variante combinée et de la référence pour chaque invite de test." }
    - id: d
      text: { en: "Create one variant per change and test each one against the same test prompts as the baseline.", fr: "Créer une variante par modification et tester chacune sur les mêmes invites de test que la référence." }
answer: { optionId: d }
explanation:
  correct:
    en: A controlled comparison changes one variable at a time. When a new prompt and a new model are tested together, you can't tell whether the result comes from the prompt, the model or their interaction. Test each change on its own against the same test prompts, then test a combination of the successful changes.
    fr: Une comparaison contrôlée modifie une seule variable à la fois. Lorsqu'une nouvelle invite et un nouveau modèle sont testés ensemble, impossible de savoir si le résultat vient de l'invite, du modèle ou de leur interaction. Testez chaque modification séparément sur les mêmes invites de test, puis une combinaison des modifications réussies.
  options:
    a:
      en: Lower randomness does not separate the effect of the prompt from the effect of the model.
      fr: Réduire l'aléa ne sépare pas l'effet de l'invite de celui du modèle.
    b:
      en: Every variant must run against the same test prompts as the baseline; new prompts make the comparison less reliable and still mix both changes.
      fr: Chaque variante doit être testée sur les mêmes invites que la référence ; de nouvelles invites rendent la comparaison moins fiable et mélangent toujours les deux modifications.
    c:
      en: Token counts measure cost, not which change improved quality.
      fr: Le nombre de jetons mesure le coût, pas la modification qui a amélioré la qualité.
references:
  - title: Design evaluation experiments
    url: https://learn.microsoft.com/en-us/training/modules/evaluate-optimize-agents/2-design-evaluation-experiments
