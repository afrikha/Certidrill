id: ai300-3c-cot-statements
objective: "3.3.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Proseware has a Microsoft Foundry project with two deployments: a non-reasoning GPT chat model and an o-series reasoning model. The team is designing prompts for both deployments.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un projet Microsoft Foundry avec deux déploiements : un modèle de conversation GPT sans raisonnement et un modèle de raisonnement de la série o. L'équipe conçoit des invites pour les deux déploiements.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: With the non-reasoning GPT model, instructing the model to proceed step by step and show each step can reduce inaccurate outcomes.
        fr: Avec le modèle GPT sans raisonnement, demander au modèle de procéder étape par étape et de présenter chaque étape peut réduire les résultats inexacts.
    - id: s2
      text:
        en: With the o-series model, you should add chain-of-thought instructions to the prompt to make the model write out its internal reasoning in the response.
        fr: Avec le modèle de la série o, vous devez ajouter des instructions de chaîne de pensée à l'invite pour que le modèle écrive son raisonnement interne dans la réponse.
    - id: s3
      text:
        en: Few-shot examples sent in one request continue to influence the model's answers to later requests that don't include them.
        fr: Des exemples few-shot envoyés dans une requête continuent d'influencer les réponses du modèle aux requêtes suivantes qui ne les contiennent pas.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Chain-of-thought prompting, a variant of breaking the task down, applies to non-reasoning models and makes answers both more accurate and easier to check. For reasoning models such as the o-series, prompting the model to expose its reasoning is not supported (use the reasoning summary parameter instead) and can violate the acceptable use policy. Few-shot examples condition the model for the current inference only; the model is not changed.
    fr: L'invite de chaîne de pensée, une variante de la décomposition de la tâche, s'applique aux modèles sans raisonnement et rend les réponses à la fois plus exactes et plus faciles à vérifier. Pour les modèles de raisonnement comme la série o, demander au modèle d'exposer son raisonnement n'est pas pris en charge (il faut utiliser le paramètre de résumé du raisonnement) et peut enfreindre la politique d'utilisation acceptable. Les exemples few-shot conditionnent le modèle pour l'inférence en cours uniquement ; le modèle n'est pas modifié.
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
