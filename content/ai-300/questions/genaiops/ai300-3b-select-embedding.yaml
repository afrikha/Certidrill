id: ai300-3b-select-embedding
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware is building a retrieval-augmented generation (RAG) solution in a Microsoft Foundry project. The product manuals are split into chunks that must be converted into vectors and stored in an Azure AI Search index for similarity search.

    Which model should you deploy to convert the chunks?
  fr: |
    Proseware crée une solution de génération augmentée par récupération (RAG) dans un projet Microsoft Foundry. Les manuels produits sont découpés en blocs qui doivent être convertis en vecteurs et stockés dans un index Azure AI Search pour la recherche par similarité.

    Quel modèle devez-vous déployer pour convertir les blocs ?
body:
  options:
    - { id: a, text: gpt-4.1-mini }
    - { id: b, text: gpt-image-1 }
    - { id: c, text: gpt-4o-transcribe }
    - { id: d, text: text-embedding-3-small }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Embedding models convert text into vectors for similarity search and retrieval. text-embedding-3-small returns 1,536-dimension vectors; text-embedding-3-large returns 3,072 dimensions.
    fr: |
      Les modèles d'incorporation convertissent du texte en vecteurs pour la recherche par similarité et la récupération. text-embedding-3-small renvoie des vecteurs de 1 536 dimensions ; text-embedding-3-large en renvoie 3 072.
  options:
    a: { en: "gpt-4.1-mini is a chat model that generates text; it doesn't return embedding vectors.", fr: "gpt-4.1-mini est un modèle de conversation qui génère du texte ; il ne renvoie pas de vecteurs d'incorporation." }
    b: { en: "gpt-image-1 generates images from text prompts.", fr: "gpt-image-1 génère des images à partir d'invites textuelles." }
    c: { en: "gpt-4o-transcribe converts speech to text.", fr: "gpt-4o-transcribe convertit la parole en texte." }
references:
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure
