id: ai300-3b-shared-quota-expired
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a hub-based project in the Foundry (classic) portal. The subscription has no quota for the VM SKU that a catalog model requires. To test the model quickly, an engineer deployed it to managed compute and selected the shared quota option in the deployment wizard.

    Eight days later, the endpoint and its deployment no longer exist. Nobody deleted them.

    What is the most likely cause?
  fr: |
    Tailspin Toys dispose d'un projet basé sur un hub dans le portail Foundry (classique). L'abonnement n'a pas de quota pour la référence SKU de machine virtuelle requise par un modèle du catalogue. Pour tester rapidement le modèle, un ingénieur l'a déployé sur un calcul managé en choisissant l'option de quota partagé dans l'Assistant de déploiement.

    Huit jours plus tard, le point de terminaison et son déploiement n'existent plus. Personne ne les a supprimés.

    Quelle est la cause la plus probable ?
body:
  options:
    - { id: a, text: { en: "The marketplace subscription of the model expired after seven days.", fr: "L'abonnement de la Place de marché du modèle a expiré après sept jours." } }
    - { id: b, text: { en: "Endpoints that use shared quota are deleted after 168 hours.", fr: "Les points de terminaison qui utilisent le quota partagé sont supprimés après 168 heures." } }
    - { id: c, text: { en: "The hub's managed network blocked the outbound traffic of the deployment.", fr: "Le réseau managé du hub a bloqué le trafic sortant du déploiement." } }
    - { id: d, text: { en: "The subscription's VM quota for the SKU was reduced to zero.", fr: "Le quota de machines virtuelles de l'abonnement pour la référence SKU a été ramené à zéro." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When the subscription lacks quota, the deployment wizard lets you use shared quota for testing, on the condition that you acknowledge the endpoint will be deleted in 168 hours (seven days). For lasting use, request quota for the SKU or choose a SKU that has quota.
    fr: |
      Lorsque l'abonnement manque de quota, l'Assistant de déploiement permet d'utiliser un quota partagé pour les tests, à condition d'accepter que le point de terminaison soit supprimé au bout de 168 heures (sept jours). Pour un usage durable, demandez un quota pour la référence SKU ou choisissez une référence SKU qui dispose d'un quota.
  options:
    a:
      en: |
        Marketplace subscriptions concern serverless deployments of partner models; they don't expire after seven days, and deleting one leaves an Unhealthy endpoint rather than removing it.
      fr: |
        Les abonnements de la Place de marché concernent les déploiements serverless de modèles partenaires ; ils n'expirent pas après sept jours, et en supprimer un laisse un point de terminaison Unhealthy au lieu de le supprimer.
    c:
      en: |
        Blocked outbound traffic makes provisioning fail or time out; it doesn't delete an existing endpoint.
      fr: |
        Un trafic sortant bloqué fait échouer ou expirer l'approvisionnement ; il ne supprime pas un point de terminaison existant.
    d:
      en: |
        The deployment didn't use the subscription's quota, so a change to that quota doesn't explain the deletion.
      fr: |
        Le déploiement n'utilisait pas le quota de l'abonnement : une modification de ce quota n'explique pas la suppression.
references:
  - title: Deploy models with managed compute (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/deploy-models-managed
