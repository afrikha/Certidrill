id: ai300-3a-project-sharing-facts
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to create three projects named **proj-hr**, **proj-legal** and **proj-ops** on an existing Foundry resource named **foundry-adatum**. The resource has public network access disabled and a private endpoint, three model deployments, and an Azure AI Search connection created at the resource level.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de créer trois projets nommés **proj-hr**, **proj-legal** et **proj-ops** sur une ressource Foundry existante nommée **foundry-adatum**. La ressource a l'accès réseau public désactivé et un point de terminaison privé, trois déploiements de modèles et une connexion Azure AI Search créée au niveau de la ressource.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Each project needs its own private endpoint before it can be reached from the virtual network.", fr: "Chaque projet a besoin de son propre point de terminaison privé pour être accessible depuis le réseau virtuel." } }
    - { id: b, text: { en: "The three projects use the network security configuration of foundry-adatum.", fr: "Les trois projets utilisent la configuration de sécurité réseau de foundry-adatum." } }
    - { id: c, text: { en: "Each project must receive its own copy of the three model deployments.", fr: "Chaque projet doit recevoir sa propre copie des trois déploiements de modèles." } }
    - { id: d, text: { en: "You can grant access to proj-legal without granting access to proj-hr or proj-ops.", fr: "Vous pouvez accorder l'accès à proj-legal sans accorder l'accès à proj-hr ni à proj-ops." } }
    - { id: e, text: { en: "The Azure AI Search connection must be recreated in each project to be used.", fr: "La connexion Azure AI Search doit être recréée dans chaque projet pour être utilisée." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Projects are child resources of the Foundry resource. They share settings such as network security, deployments and tool integrations from the parent, while each project can receive its own role assignments.
    fr: |
      Les projets sont des ressources enfants de la ressource Foundry. Ils partagent des paramètres de leur parent comme la sécurité réseau, les déploiements et les intégrations d'outils, tandis que chaque projet peut recevoir ses propres attributions de rôles.
  options:
    a:
      en: |
        Network security, including the private endpoint, is configured on the parent Foundry resource and shared by its projects.
      fr: |
        La sécurité réseau, y compris le point de terminaison privé, est configurée sur la ressource Foundry parente et partagée par ses projets.
    c:
      en: |
        Deployments belong to the Foundry resource and are shared by its projects.
      fr: |
        Les déploiements appartiennent à la ressource Foundry et sont partagés par ses projets.
    e:
      en: |
        Connections configured at the parent resource level are available to all its projects.
      fr: |
        Les connexions configurées au niveau de la ressource parente sont disponibles pour tous ses projets.
references:
  - title: Create a project for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-projects
  - title: Microsoft Foundry rollout across my organization
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/planning
