id: ai300-3b-reservation-overage
objective: "3.2.4"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Fabrikam has one Azure Reservation of **300 Global Provisioned PTUs** scoped to a subscription named **sub1**. The subscription contains the following provisioned deployments:

    | Deployment | Deployment type | Model | Region | PTUs |
    | --- | --- | --- | --- | --- |
    | chat-us | Global Provisioned | gpt-4.1 | East US 2 | 200 |
    | chat-se | Global Provisioned | gpt-5.1 | Sweden Central | 150 |
    | docs-eu | Data Zone Provisioned | gpt-4.1 | Sweden Central | 100 |

    How many of these PTUs are billed at the hourly rate?
  fr: |
    Fabrikam dispose d'une réservation Azure de **300 PTU Global Provisioned** dont l'étendue est un abonnement nommé **sub1**. L'abonnement contient les déploiements provisionnés suivants :

    | Déploiement | Type de déploiement | Modèle | Région | PTU |
    | --- | --- | --- | --- | --- |
    | chat-us | Global Provisioned | gpt-4.1 | East US 2 | 200 |
    | chat-se | Global Provisioned | gpt-5.1 | Sweden Central | 150 |
    | docs-eu | Data Zone Provisioned | gpt-4.1 | Sweden Central | 100 |

    Combien de ces PTU sont facturées au tarif horaire ?
body:
  options:
    - { id: a, text: "0" }
    - { id: b, text: "50" }
    - { id: c, text: "100" }
    - { id: d, text: "150" }
    - { id: e, text: "250" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A reservation matches deployments by deployment type and scope, not by model or deployment, and a Global reservation isn't region-specific. The two Global deployments total 350 PTUs, so 300 are covered and 50 are billed hourly. The Data Zone deployment doesn't match a Global reservation, so its 100 PTUs are billed hourly too, for a total of 150.
    fr: |
      Une réservation correspond aux déploiements par type de déploiement et par étendue, pas par modèle ni par déploiement, et une réservation Global n'est pas liée à une région. Les deux déploiements Global totalisent 350 PTU : 300 sont couvertes et 50 sont facturées à l'heure. Le déploiement Data Zone ne correspond pas à une réservation Global : ses 100 PTU sont aussi facturées à l'heure, soit 150 au total.
  options:
    a: { en: "The reservation covers at most 300 PTUs, and only Global deployments.", fr: "La réservation couvre au plus 300 PTU, et uniquement des déploiements Global." }
    b: { en: "50 is only the Global overage; the Data Zone PTUs aren't covered by a Global reservation.", fr: "50 correspond seulement au dépassement Global ; les PTU Data Zone ne sont pas couvertes par une réservation Global." }
    c: { en: "100 counts only the Data Zone deployment and forgets the 50 Global PTUs above the reservation quantity.", fr: "100 ne compte que le déploiement Data Zone et oublie les 50 PTU Global au-delà de la quantité réservée." }
    e: { en: "250 would mean that the reservation covers only chat-us; matching isn't by model, so chat-se is covered as well up to 300 PTUs.", fr: "250 signifierait que la réservation ne couvre que chat-us ; la correspondance ne se fait pas par modèle, chat-se est donc aussi couvert dans la limite de 300 PTU." }
references:
  - title: Provisioned throughput billing and cost management
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput-billing
