id: ai300-3b-reasoning-params-code
objective: "3.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum moves a contract comparison feature from a gpt-4o deployment to an o3 deployment named **o3-contracts**, because the task needs multistep reasoning. The existing call sends `temperature=0.2` and `max_tokens=4000`, and it now fails.

    The new call must use the Chat Completions API, cap the generated tokens (reasoning included) at 4,000, and ask the model for deeper reasoning.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum transfère une fonctionnalité de comparaison de contrats d'un déploiement gpt-4o vers un déploiement o3 nommé **o3-contracts**, car la tâche exige un raisonnement en plusieurs étapes. L'appel existant envoie `temperature=0.2` et `max_tokens=4000`, et il échoue désormais.

    Le nouvel appel doit utiliser l'API Chat Completions, plafonner à 4 000 les jetons générés (raisonnement compris) et demander au modèle un raisonnement plus approfondi.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    response = client.chat.completions.create(
        model="o3-contracts",
        messages=[
            {"role": "developer", "content": "Compare the two contracts clause by clause."},
            {"role": "user", "content": contracts_text},
        ],
        [[limit]]=4000,
        [[effort]],
    )
  slots:
    - id: limit
      options:
        - { id: l1, text: max_tokens }
        - { id: l2, text: max_output_tokens }
        - { id: l3, text: max_completion_tokens }
    - id: effort
      options:
        - { id: e1, text: "temperature=0.2" }
        - { id: e2, text: "reasoning_effort=\"high\"" }
        - { id: e3, text: "reasoning={\"effort\": \"high\"}" }
        - { id: e4, text: "top_p=0.9" }
answer:
  values: { limit: l3, effort: e2 }
explanation:
  correct:
    en: "Reasoning models don't support `max_tokens`, `temperature` or `top_p`. With the Chat Completions API, `max_completion_tokens` caps the reasoning tokens and the visible output together, and `reasoning_effort` set to `high` asks for deeper reasoning, at the cost of more output tokens and latency."
    fr: "Les modèles de raisonnement ne prennent pas en charge `max_tokens`, `temperature` ni `top_p`. Avec l'API Chat Completions, `max_completion_tokens` plafonne ensemble les jetons de raisonnement et la sortie visible, et `reasoning_effort` défini sur `high` demande un raisonnement plus approfondi, au prix de plus de jetons de sortie et de latence."
  options:
    l1: { en: "max_tokens isn't supported by reasoning models; that's why the existing call fails.", fr: "max_tokens n'est pas pris en charge par les modèles de raisonnement ; c'est pourquoi l'appel existant échoue." }
    l2: { en: "max_output_tokens is the parameter of the Responses API, not of Chat Completions.", fr: "max_output_tokens est le paramètre de l'API Responses, pas de Chat Completions." }
    e1: { en: "temperature isn't supported by o3.", fr: "temperature n'est pas pris en charge par o3." }
    e3: { en: "The reasoning object belongs to the Responses API; Chat Completions uses reasoning_effort.", fr: "L'objet reasoning appartient à l'API Responses ; Chat Completions utilise reasoning_effort." }
    e4: { en: "top_p isn't supported by o3 and doesn't control reasoning depth.", fr: "top_p n'est pas pris en charge par o3 et ne contrôle pas la profondeur du raisonnement." }
references:
  - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
