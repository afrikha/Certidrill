id: ai300-cs2b-deployment-type
objective: "3.2.4"
type: single
caseStudy: ai300-cs2b-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You need to replace gpt-docs with a new deployment of the same model for production. The solution must meet the production deployment requirements 1 and 2.

    Which deployment type should you use?
  fr: |
    Vous devez remplacer gpt-docs par un nouveau déploiement du même modèle pour la production. La solution doit respecter les exigences 1 et 2 du déploiement en production.

    Quel type de déploiement devez-vous utiliser ?
body:
  options:
    - { id: a, text: Global Provisioned }
    - { id: b, text: Data Zone Standard }
    - { id: c, text: Data Zone Provisioned }
    - { id: d, text: Data Zone Batch }
answer: { optionId: c }
explanation:
  correct:
    en: "A provisioned deployment reserves model processing capacity, measured in provisioned throughput units (PTUs) and billed per hour, which gives predictable latency and cost at a known volume. The Data Zone type processes data only within the selected data zone; the EU data zone follows the EU Data Boundary."
    fr: "Un déploiement approvisionné réserve une capacité de traitement du modèle, mesurée en unités de débit approvisionné (PTU) et facturée à l'heure, ce qui garantit une latence et un coût prévisibles pour un volume connu. Le type Data Zone ne traite les données que dans la zone de données choisie ; la zone de données UE suit la limite des données de l'UE (EU Data Boundary)."
  options:
    a: { en: "A Global deployment can process data in any Azure region, outside the EU data boundary.", fr: "Un déploiement Global peut traiter les données dans n'importe quelle région Azure, hors de la limite des données de l'UE." }
    b: { en: "Data Zone Standard keeps processing in the EU, but its pay-per-token capacity is shared, so latency is not predictable at peak.", fr: "Data Zone Standard maintient le traitement dans l'UE, mais sa capacité facturée au jeton est partagée : la latence n'est pas prévisible pendant les pics." }
    d: { en: "Data Zone Batch processes asynchronous jobs; it cannot serve interactive requests.", fr: "Data Zone Batch traite des travaux asynchrones ; il ne peut pas servir des requêtes interactives." }
references:
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
  - title: Provisioned throughput for Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/provisioned-throughput
