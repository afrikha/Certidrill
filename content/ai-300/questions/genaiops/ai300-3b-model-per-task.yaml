id: ai300-3b-model-per-task
objective: "3.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a Microsoft Foundry project and plans four AI features.

    Which model should you deploy for each feature? To answer, drag the appropriate models to the correct features. Each model may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un projet Microsoft Foundry et prévoit quatre fonctionnalités d'IA.

    Quel modèle devez-vous déployer pour chaque fonctionnalité ? Pour répondre, faites glisser les modèles appropriés vers les fonctionnalités correspondantes. Chaque modèle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: emb, text: text-embedding-3-large }
    - { id: trn, text: gpt-4o-transcribe }
    - { id: img, text: gpt-image-1 }
    - { id: rsn, text: o3 }
    - { id: tts, text: tts-hd }
    - { id: rt, text: gpt-realtime }
  targets:
    - { id: t1, text: { en: "Transcribe recorded meeting audio files to text", fr: "Transcrire en texte des fichiers audio de réunions enregistrées" } }
    - { id: t2, text: { en: "Generate product images from text descriptions", fr: "Générer des images de produits à partir de descriptions textuelles" } }
    - { id: t3, text: { en: "Convert support articles into vectors for semantic search", fr: "Convertir des articles de support en vecteurs pour la recherche sémantique" } }
    - { id: t4, text: { en: "Solve multistep math and science problems for engineers", fr: "Résoudre des problèmes de mathématiques et de sciences en plusieurs étapes pour les ingénieurs" } }
answer:
  mapping: { t1: trn, t2: img, t3: emb, t4: rsn }
explanation:
  correct:
    en: |
      gpt-4o-transcribe is a speech-to-text model of the Audio API, suited to recorded files. gpt-image-1 generates images from text prompts. text-embedding-3-large converts text into vectors for similarity and retrieval. o3 is an o-series reasoning model, strongest in math, science and coding.
    fr: |
      gpt-4o-transcribe est un modèle de reconnaissance vocale de l'API Audio, adapté aux fichiers enregistrés. gpt-image-1 génère des images à partir d'invites textuelles. text-embedding-3-large convertit du texte en vecteurs pour la similarité et la récupération. o3 est un modèle de raisonnement de la série o, particulièrement performant en mathématiques, en sciences et en programmation.
  options:
    tts: { en: "tts-hd converts text to speech, the opposite of transcription.", fr: "tts-hd convertit du texte en parole, l'inverse de la transcription." }
    rt: { en: "gpt-realtime targets low-latency live speech conversations rather than recorded files.", fr: "gpt-realtime cible les conversations vocales en direct à faible latence plutôt que les fichiers enregistrés." }
references:
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure
  - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
