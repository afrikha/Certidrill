id: ai300-cs1a-prompt-git
objective: "3.3.3"
type: multi
caseStudy: ai300-cs1a-relecloud-bank
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the requirements for the disputes agent. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter les exigences relatives à l'agent des litiges. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: Keep editing the instructions in the Foundry portal, and rely on the agent version that Foundry creates on each update
        fr: Continuer à modifier les instructions dans le portail Foundry, et s'appuyer sur la version d'agent que Foundry crée à chaque mise à jour
    - id: b
      text:
        en: Store the instructions as versioned text files in a Git repository, and change them only through reviewed pull requests
        fr: Stocker les instructions dans des fichiers texte versionnés d'un dépôt Git, et ne les modifier que par des demandes de tirage relues
    - id: c
      text:
        en: Store the instructions in an Azure Key Vault secret, and create a new secret version for each change
        fr: Stocker les instructions dans un secret Azure Key Vault, et créer une nouvelle version du secret à chaque modification
    - id: d
      text:
        en: Tag each release commit, and create the agent version from the tagged prompt file by using a deployment script
        fr: Ajouter une balise Git à chaque commit de mise en production, et créer la version d'agent à partir du fichier d'invite de cette balise au moyen d'un script de déploiement
    - id: e
      text:
        en: Assign the analysts the Foundry Agent Consumer role on the disputes project so that they can't delete the agent
        fr: Attribuer aux analystes le rôle Foundry Agent Consumer sur le projet disputes pour qu'ils ne puissent pas supprimer l'agent
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: Prompts kept as files in Git get a history and go through branches and pull requests, so a second person reviews every change before it reaches production. Tagging each release and deploying the agent version from the prompt file of that tag shows which text each production version uses, and restoring the previous text means redeploying the prompt file of the previous tag.
    fr: Les invites conservées dans des fichiers Git ont un historique et passent par des branches et des demandes de tirage ; une deuxième personne relit donc chaque modification avant qu'elle n'atteigne la production. Baliser chaque mise en production et déployer la version d'agent à partir du fichier d'invite de cette balise montre quel texte utilise chaque version de production, et restaurer le texte précédent consiste à redéployer le fichier d'invite de la balise précédente.
  options:
    a: { en: "Foundry creates a new agent version on each update, but portal edits go straight to the agent without any review.", fr: "Foundry crée une nouvelle version d'agent à chaque mise à jour, mais les modifications dans le portail s'appliquent directement à l'agent, sans aucune relecture." }
    c: { en: "Key Vault stores secrets; it provides no review workflow and isn't where prompts are versioned and compared.", fr: "Key Vault stocke des secrets ; il n'offre aucun processus de relecture et n'est pas l'endroit où les invites sont versionnées et comparées." }
    e: { en: "Foundry Agent Consumer only lets a principal call agents; it doesn't add any review of instruction changes.", fr: "Foundry Agent Consumer permet seulement d'appeler des agents ; il n'ajoute aucune relecture des modifications d'instructions." }
references:
  - title: Develop safe prompt deployment workflows
    url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/5-prompt-workflow-development
  - title: Understand Microsoft Foundry agents and prompt versioning
    url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/3-foundry-agents-prompt-versioning
