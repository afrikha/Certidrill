id: ai300-3b-hf-registry-facts
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware plans to deploy several open models from the **HuggingFace** registry of Azure Machine Learning to its workspace **mlw-litware**. One of the models is a gated model on the Hugging Face Hub.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de déployer plusieurs modèles ouverts du registre **HuggingFace** d'Azure Machine Learning dans son espace de travail **mlw-litware**. L'un des modèles est un modèle à accès restreint (gated) sur le Hugging Face Hub.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can deploy a model from the HuggingFace registry to a batch endpoint for nightly scoring.
        fr: |
          Vous pouvez déployer un modèle du registre HuggingFace sur un point de terminaison de lot pour un scoring nocturne.
    - id: s2
      text:
        en: |
          When the deployment is created, the endpoint downloads the model weights from the Hugging Face Hub.
        fr: |
          Lors de la création du déploiement, le point de terminaison télécharge les poids du modèle depuis le Hugging Face Hub.
    - id: s3
      text:
        en: |
          For the gated model, you create a custom key connection named HuggingFaceTokenConnection that stores a Hugging Face token in the HF_TOKEN key.
        fr: |
          Pour le modèle à accès restreint, vous créez une connexion de clé personnalisée nommée HuggingFaceTokenConnection qui stocke un jeton Hugging Face dans la clé HF_TOKEN.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The HuggingFace registry is a community registry that acts as a catalog; it doesn't store the weights, which the endpoint downloads from the Hugging Face Hub. For that reason these models support real-time managed online endpoints only, not batch endpoints. A gated model also needs a Hugging Face token stored in a custom key connection named HuggingFaceTokenConnection with the key HF_TOKEN, and an endpoint that enforces access to the default secret stores.
    fr: |
      Le registre HuggingFace est un registre communautaire qui sert de catalogue ; il ne stocke pas les poids, que le point de terminaison télécharge depuis le Hugging Face Hub. Pour cette raison, ces modèles prennent en charge uniquement les points de terminaison en ligne managés en temps réel, pas les points de terminaison de lot. Un modèle à accès restreint exige aussi un jeton Hugging Face stocké dans une connexion de clé personnalisée nommée HuggingFaceTokenConnection avec la clé HF_TOKEN, et un point de terminaison qui impose l'accès aux magasins de secrets par défaut.
references:
  - title: Deploy models from HuggingFace hub to Azure Machine Learning online endpoints for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-models-from-huggingface
