id: ai300-cs1b-private-access
objective: "3.1.3"
type: multi
caseStudy: ai300-cs1b-vanarsdel
difficulty: 2
status: draft
stem:
  en: |
    main.bicep deploys fdy-vanarsdel-prod with public network access disabled. You need to complete the network configuration so that the platform requirements are met.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    main.bicep déploie fdy-vanarsdel-prod avec l'accès au réseau public désactivé. Vous devez terminer la configuration réseau pour respecter les exigences de la plateforme.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: Create a private endpoint in snet-pe for the clausecheck project, and link its private DNS zone to vnet-vanarsdel
        fr: Créer dans snet-pe un point de terminaison privé pour le projet clausecheck, et lier sa zone DNS privée à vnet-vanarsdel
    - id: b
      text:
        en: Create a private endpoint in snet-pe for fdy-vanarsdel-prod, and link its private DNS zone to vnet-vanarsdel
        fr: Créer dans snet-pe un point de terminaison privé pour fdy-vanarsdel-prod, et lier sa zone DNS privée à vnet-vanarsdel
    - id: c
      text:
        en: Create a private endpoint in snet-pe for srch-vanarsdel, and disable public network access on srch-vanarsdel
        fr: Créer dans snet-pe un point de terminaison privé pour srch-vanarsdel, et désactiver l'accès au réseau public sur srch-vanarsdel
    - id: d
      text:
        en: Delegate snet-app to Microsoft.App/environments, and add virtual network injection to fdy-vanarsdel-prod
        fr: Déléguer snet-app à Microsoft.App/environments, et ajouter l'injection de réseau virtuel à fdy-vanarsdel-prod
    - id: e
      text:
        en: Set the trusted services exception on fdy-vanarsdel-prod, and allow the outbound IP addresses of app-clausecheck
        fr: Activer l'exception des services approuvés sur fdy-vanarsdel-prod, et autoriser les adresses IP sortantes d'app-clausecheck
answer: { optionIds: [b, c] }
explanation:
  correct:
    en: With public network access disabled, clients reach the Foundry resource only through a private endpoint that targets the resource, with a private DNS zone linked to the virtual network so that its name resolves to the private IP address. The private endpoint of the Foundry resource doesn't protect srch-vanarsdel, which needs its own private endpoint and its own public network access setting.
    fr: Avec l'accès au réseau public désactivé, les clients n'atteignent la ressource Foundry que par un point de terminaison privé qui cible la ressource, avec une zone DNS privée liée au réseau virtuel pour que son nom se résolve en adresse IP privée. Le point de terminaison privé de la ressource Foundry ne protège pas srch-vanarsdel, qui a besoin de son propre point de terminaison privé et de son propre paramètre d'accès au réseau public.
  options:
    a: { en: "Private endpoints target the Foundry resource; projects share the network configuration of their parent resource.", fr: "Les points de terminaison privés ciblent la ressource Foundry ; les projets partagent la configuration réseau de leur ressource parente." }
    d: { en: "Virtual network injection is for outbound traffic of agents, must be planned when the resource is deployed, and doesn't give app-clausecheck inbound access.", fr: "L'injection de réseau virtuel concerne le trafic sortant des agents, doit être prévue lors du déploiement de la ressource, et ne donne pas d'accès entrant à app-clausecheck." }
    e: { en: "IP rules apply to public network access, which must stay disabled; the trusted services exception is for Azure services such as Azure AI Search, not for the web app.", fr: "Les règles IP s'appliquent à l'accès au réseau public, qui doit rester désactivé ; l'exception des services approuvés concerne des services Azure comme Azure AI Search, pas l'application web." }
references:
  - title: How to configure network isolation for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
  - title: Create a Private Endpoint for a Secure Connection - Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/service-create-private-endpoint
