id: ai300-3b-select-realtime-voice
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso wants a voice assistant for its call center. Callers talk to the assistant in a live conversation, and the assistant must answer with speech. The solution must minimize latency and use a single model for speech input and speech output.

    Which model should you deploy?
  fr: |
    Contoso souhaite un assistant vocal pour son centre d'appels. Les appelants parlent à l'assistant au cours d'une conversation en direct, et l'assistant doit répondre oralement. La solution doit réduire la latence au minimum et utiliser un seul modèle pour l'entrée et la sortie vocales.

    Quel modèle devez-vous déployer ?
body:
  options:
    - { id: a, text: whisper }
    - { id: b, text: gpt-realtime }
    - { id: c, text: tts-hd }
    - { id: d, text: o4-mini }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The realtime audio models, such as gpt-realtime, provide low-latency speech in and speech out in one model, which suits live voice conversations.
    fr: |
      Les modèles audio en temps réel, comme gpt-realtime, offrent une entrée et une sortie vocales à faible latence dans un seul modèle, ce qui convient aux conversations vocales en direct.
  options:
    a: { en: "whisper only transcribes or translates speech into text; another model would have to produce the spoken answer.", fr: "whisper ne fait que transcrire ou traduire la parole en texte ; un autre modèle devrait produire la réponse orale." }
    c: { en: "tts-hd only converts text to speech; it can't understand the caller.", fr: "tts-hd convertit uniquement du texte en parole ; il ne peut pas comprendre l'appelant." }
    d: { en: "o4-mini is a reasoning model that works with text and has no speech output.", fr: "o4-mini est un modèle de raisonnement qui travaille sur du texte et n'a pas de sortie vocale." }
references:
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure
