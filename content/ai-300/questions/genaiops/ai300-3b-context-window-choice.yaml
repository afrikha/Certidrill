id: ai300-3b-context-window-choice
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The legal team of Woodgrove Bank wants to analyze complete case files in a single request, without chunking or retrieval. The largest case files contain about 700,000 input tokens.

    Which model should you deploy?
  fr: |
    L'équipe juridique de Woodgrove Bank veut analyser des dossiers complets en une seule requête, sans découpage ni récupération. Les dossiers les plus volumineux contiennent environ 700 000 jetons d'entrée.

    Quel modèle devez-vous déployer ?
body:
  options:
    - { id: a, text: gpt-4o }
    - { id: b, text: o3 }
    - { id: c, text: gpt-4.1 }
    - { id: d, text: gpt-5-mini }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The GPT-4.1 series has a context window of 1,047,576 tokens, enough for a 700,000-token prompt. Input, output and reasoning tokens share the context budget, so the remaining space covers the answer.
    fr: |
      La série GPT-4.1 a une fenêtre de contexte de 1 047 576 jetons, suffisante pour une invite de 700 000 jetons. Les jetons d'entrée, de sortie et de raisonnement partagent le budget de contexte, et l'espace restant couvre la réponse.
  options:
    a: { en: "gpt-4o accepts 128,000 input tokens.", fr: "gpt-4o accepte 128 000 jetons d'entrée." }
    b: { en: "o3 accepts 200,000 input tokens.", fr: "o3 accepte 200 000 jetons d'entrée." }
    d: { en: "gpt-5-mini has a 400,000-token context window, of which 272,000 are for input.", fr: "gpt-5-mini a une fenêtre de contexte de 400 000 jetons, dont 272 000 pour l'entrée." }
references:
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure
