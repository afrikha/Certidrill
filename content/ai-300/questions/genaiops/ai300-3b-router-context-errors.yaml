id: ai300-3b-router-context-errors
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a model router deployment that uses the Balanced routing mode and no model subset. An application sends prompts of about 300,000 tokens. Some of these requests succeed, but others fail because the prompt exceeds the context length.

    The large prompts must succeed every time, the application must keep using model router, and the prompts must not be shortened.

    What should you do?
  fr: |
    Contoso dispose d'un déploiement du routeur de modèles qui utilise le mode de routage Balanced et aucun sous-ensemble de modèles. Une application envoie des invites d'environ 300 000 jetons. Certaines de ces requêtes réussissent, mais d'autres échouent, car l'invite dépasse la longueur de contexte.

    Les invites volumineuses doivent réussir à chaque fois, l'application doit continuer à utiliser le routeur de modèles, et les invites ne doivent pas être raccourcies.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Configure a model subset of models whose context window exceeds the prompt size.", fr: "Configurer un sous-ensemble de modèles dont la fenêtre de contexte dépasse la taille des invites." } }
    - { id: b, text: { en: "Switch the routing mode to Quality.", fr: "Passer le mode de routage sur Quality." } }
    - { id: c, text: { en: "Enable Auto-update so that the deployment uses the latest router version.", fr: "Activer Auto-update pour que le déploiement utilise la dernière version du routeur." } }
    - { id: d, text: { en: "Increase the tokens-per-minute (TPM) quota of the deployment.", fr: "Augmenter le quota de jetons par minute (TPM) du déploiement." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The context window of model router is that of its smallest underlying model. A larger request succeeds only when it happens to be routed to a model that supports its size. Restricting routing to a subset of large-context models makes every routing choice able to handle the prompt; the other documented fix, shortening the prompt, is excluded here.
    fr: |
      La fenêtre de contexte du routeur de modèles est celle de son plus petit modèle sous-jacent. Une requête plus grande ne réussit que si elle est acheminée par hasard vers un modèle qui prend en charge sa taille. Limiter le routage à un sous-ensemble de modèles à grand contexte permet à chaque choix de routage de traiter l'invite ; l'autre correctif documenté, raccourcir l'invite, est exclu ici.
  options:
    b: { en: "Quality picks the highest-quality model for the prompt, which isn't necessarily a model with a large enough context window.", fr: "Quality choisit le modèle de meilleure qualité pour l'invite, qui n'a pas forcément une fenêtre de contexte assez grande." }
    c: { en: "Auto-update can change the underlying model set, but it doesn't guarantee that every model supports 300,000 tokens.", fr: "Auto-update peut modifier l'ensemble des modèles sous-jacents, mais ne garantit pas que chaque modèle prend en charge 300 000 jetons." }
    d: { en: "TPM quota limits throughput per minute; it doesn't change the maximum context length of a request.", fr: "Le quota de TPM limite le débit par minute ; il ne modifie pas la longueur de contexte maximale d'une requête." }
references:
  - title: Model router for Microsoft Foundry concepts
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-router
