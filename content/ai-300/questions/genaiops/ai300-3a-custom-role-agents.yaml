id: ai300-3a-custom-role-agents
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's built-in Foundry roles grant more permissions than its developers need. You write a custom role definition in JSON for the Azure CLI. The role must let developers create and run agents in Foundry projects, and must grant read access to the Foundry resources.

    You add `Microsoft.CognitiveServices/*/read` to the definition.

    Where should you add `Microsoft.CognitiveServices/accounts/AIServices/agents/*`?
  fr: |
    Les rôles Foundry intégrés de Fabrikam accordent plus d'autorisations que nécessaire à ses développeurs. Vous écrivez une définition de rôle personnalisé en JSON pour Azure CLI. Le rôle doit permettre aux développeurs de créer et d'exécuter des agents dans des projets Foundry, et accorder un accès en lecture aux ressources Foundry.

    Vous ajoutez `Microsoft.CognitiveServices/*/read` à la définition.

    Où devez-vous ajouter `Microsoft.CognitiveServices/accounts/AIServices/agents/*` ?
body:
  options:
    - { id: a, text: "Actions" }
    - { id: b, text: "NotActions" }
    - { id: c, text: "DataActions" }
    - { id: d, text: "AssignableScopes" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Building agents is a data plane operation, authorized by `dataActions` in Azure RBAC, so the agents permission goes in `DataActions`. Control plane operations, such as `Microsoft.CognitiveServices/*/read`, go in `Actions`.
    fr: |
      La création d'agents est une opération du plan de données, autorisée par les `dataActions` d'Azure RBAC : l'autorisation sur les agents va donc dans `DataActions`. Les opérations du plan de contrôle, comme `Microsoft.CognitiveServices/*/read`, vont dans `Actions`.
  options:
    a:
      en: |
        `Actions` holds control plane operations; a data action placed there doesn't authorize agent operations.
      fr: |
        `Actions` contient les opérations du plan de contrôle ; une action de données placée à cet endroit n'autorise pas les opérations sur les agents.
    b:
      en: |
        `NotActions` removes control plane operations from the role; it would grant nothing.
      fr: |
        `NotActions` retire des opérations du plan de contrôle du rôle ; il n'accorderait rien.
    d:
      en: |
        `AssignableScopes` lists the scopes where the role can be assigned, not operations.
      fr: |
        `AssignableScopes` liste les étendues où le rôle peut être attribué, pas des opérations.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
  - title: Authentication and authorization in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/authentication-authorization-foundry
