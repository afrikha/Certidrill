id: ai300-3c-prompt-parts-hotarea
objective: "3.3.1"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys sends the following prompt to a GPT chat model in Microsoft Foundry to summarize customer emails. The table shows the prompt line by line.

    Answer each prompt by selecting the appropriate line.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys envoie l'invite suivante à un modèle de conversation GPT dans Microsoft Foundry pour résumer les e-mails des clients. Le tableau présente l'invite ligne par ligne.

    Répondez à chaque consigne en sélectionnant la ligne appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Select the supporting content.", fr: "Sélectionnez le contenu de support." }
    - id: p2
      text: { en: "Select the cue.", fr: "Sélectionnez l'amorce." }
  grid:
    header: [{ en: "Line", fr: "Ligne" }, { en: "Prompt text", fr: "Texte de l'invite" }]
    rows:
      - [{ text: "1" }, { text: { en: "Summarize the customer email below in three short points.", fr: "Résume l'e-mail du client ci-dessous en trois points courts." }, area: l1 }]
      - [{ text: "2" }, { text: { en: "Customer name: Alex Martin. Loyalty tier: Gold. Today's date: 12 November.", fr: "Nom du client : Alex Martin. Niveau de fidélité : Gold. Date du jour : 12 novembre." }, area: l2 }]
      - [{ text: "3" }, { text: { en: "Email: \"My order of 2 November arrived damaged and I want a replacement before the holidays.\"", fr: "E-mail : « Ma commande du 2 novembre est arrivée endommagée et je veux un remplacement avant les fêtes. »" }, area: l3 }]
      - [{ text: "4" }, { text: { en: "Key points:", fr: "Points clés :" }, area: l4 }]
answer:
  values: { p1: l2, p2: l4 }
explanation:
  correct:
    en: Line 1 is the instruction and line 3 is the primary content, the text the model transforms. Line 2 is supporting content, information such as the user name or the current date that influences the output without being its target. Line 4 is a cue, a prefix that the model builds on and that steers the format of the answer.
    fr: La ligne 1 est l'instruction et la ligne 3 le contenu principal, c'est-à-dire le texte que le modèle transforme. La ligne 2 est du contenu de support, des informations comme le nom de l'utilisateur ou la date du jour qui influencent la sortie sans en être la cible. La ligne 4 est une amorce, un préfixe sur lequel le modèle s'appuie et qui oriente le format de la réponse.
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
