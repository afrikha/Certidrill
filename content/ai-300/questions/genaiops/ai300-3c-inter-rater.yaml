id: ai300-3c-inter-rater
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys compares prompt variants of a support agent by scoring responses manually with a 1–5 rubric. Before scoring a new experiment, three evaluators independently scored the same 10 responses on three metrics, which gives 30 scoring opportunities:

    | Agreement level | Count |
    | --- | --- |
    | Exact agreement | 14 |
    | Within one point (not exact) | 8 |
    | Scores differ by two points or more | 8 |

    The team follows Microsoft's recommended target for inter-rater reliability. You need to decide how to proceed.

    What should you do?
  fr: |
    Tailspin Toys compare des variantes d'invite d'un agent de support en notant manuellement les réponses avec une grille de 1 à 5. Avant de noter une nouvelle expérience, trois évaluateurs ont noté indépendamment les 10 mêmes réponses sur trois métriques, soit 30 occasions de notation :

    | Niveau d'accord | Nombre |
    | --- | --- |
    | Accord exact | 14 |
    | À un point près (sans accord exact) | 8 |
    | Écart de deux points ou plus | 8 |

    L'équipe suit l'objectif recommandé par Microsoft pour la fiabilité inter-évaluateurs. Vous devez décider de la suite.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Run additional calibration and clarify the rubric before the evaluators score the experiment.", fr: "Organiser une calibration supplémentaire et clarifier la grille avant que les évaluateurs notent l'expérience." }
    - id: b
      text: { en: "Score the experiment now, because most of the scores agree within one point.", fr: "Noter l'expérience dès maintenant, car la plupart des scores concordent à un point près." }
    - id: c
      text: { en: "Score the experiment now, and drop the scores that differ by two points or more.", fr: "Noter l'expérience dès maintenant, en écartant les scores qui diffèrent de deux points ou plus." }
    - id: d
      text: { en: "Replace the 1–5 rubric with a 1–10 scale so that evaluators can express finer differences.", fr: "Remplacer la grille de 1 à 5 par une échelle de 1 à 10 pour que les évaluateurs nuancent davantage." }
answer: { optionId: a }
explanation:
  correct:
    en: Microsoft's guidance is to aim for at least 80 % agreement within one point. Here, 14 + 8 = 22 of 30 opportunities (about 73 %) are within one point, which is below the target. When agreement is below 80 %, run more calibration and review the divergent responses to clarify the rubric before relying on the scores.
    fr: Les recommandations de Microsoft visent au moins 80 % d'accord à un point près. Ici, 14 + 8 = 22 occasions sur 30 (environ 73 %) sont à un point près, en dessous de l'objectif. Lorsque l'accord est inférieur à 80 %, organisez une calibration supplémentaire et revoyez les réponses divergentes pour clarifier la grille avant de vous fier aux scores.
  options:
    b:
      en: About 73 % agreement within one point is below the 80 % target, so the scores are not yet reliable.
      fr: "Environ 73 % d'accord à un point près reste sous l'objectif de 80 % : les scores ne sont pas encore fiables."
    c:
      en: Discarding divergent scores hides the rubric problem instead of fixing it, and the new experiment would show the same divergence.
      fr: Écarter les scores divergents masque le problème de grille au lieu de le corriger, et la nouvelle expérience présenterait la même divergence.
    d:
      en: A finer scale gives evaluators more room to disagree; the issue is how they interpret the criteria.
      fr: Une échelle plus fine laisse aux évaluateurs plus de place pour diverger ; le problème vient de leur interprétation des critères.
references:
  - title: Apply evaluation rubrics for consistent scoring
    url: https://learn.microsoft.com/en-us/training/modules/evaluate-optimize-agents/4-evaluate-agent-responses
