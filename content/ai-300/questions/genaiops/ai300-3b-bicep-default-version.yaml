id: ai300-3b-bicep-default-version
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam deploys a Global Standard deployment named **chat-prod** with a Bicep file that a pipeline runs every week. The `model` block of the deployment contains `format: 'OpenAI'` and `name: 'gpt-4.1'` only, and the file doesn't set `versionUpgradeOption`.

    Last week, the answers of the application changed without any code change. The deployment now runs a different model version.

    You need to ensure that the model version changes only after the team approves it. Billing must stay pay-per-token. What should you do?
  fr: |
    Fabrikam déploie un déploiement Global Standard nommé **chat-prod** avec un fichier Bicep qu'un pipeline exécute chaque semaine. Le bloc `model` du déploiement contient uniquement `format: 'OpenAI'` et `name: 'gpt-4.1'`, et le fichier ne définit pas `versionUpgradeOption`.

    La semaine dernière, les réponses de l'application ont changé sans aucune modification du code. Le déploiement exécute désormais une autre version du modèle.

    Vous devez vous assurer que la version du modèle ne change qu'après approbation par l'équipe. La facturation doit rester au jeton. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set versionUpgradeOption to 'OnceCurrentVersionExpired' and keep the model block unchanged.", fr: "Définir versionUpgradeOption sur 'OnceCurrentVersionExpired' et laisser le bloc model inchangé." } }
    - { id: b, text: { en: "Add the approved version to the model block and set versionUpgradeOption to 'NoAutoUpgrade'.", fr: "Ajouter la version approuvée au bloc model et définir versionUpgradeOption sur 'NoAutoUpgrade'." } }
    - { id: c, text: { en: "Set raiPolicyName to a custom content filter policy for the deployment.", fr: "Définir raiPolicyName sur une stratégie de filtrage de contenu personnalisée pour le déploiement." } }
    - { id: d, text: { en: "Set deploymentState to 'Paused' between two approved releases.", fr: "Définir deploymentState sur 'Paused' entre deux mises en production approuvées." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When the model version is omitted, the deployment gets the default version, and that default can change when a new version becomes available, so a weekly redeployment can switch versions. Pinning the version in the template stops this, and NoAutoUpgrade prevents the automatic upgrade that would otherwise happen at retirement.
    fr: |
      Lorsque la version du modèle est omise, le déploiement reçoit la version par défaut, et celle-ci peut changer lorsqu'une nouvelle version devient disponible : un redéploiement hebdomadaire peut donc changer de version. Fixer la version dans le modèle de déploiement empêche ce changement, et NoAutoUpgrade empêche la mise à niveau automatique qui aurait sinon lieu à la mise hors service.
  options:
    a: { en: "Without a version in the model block, each redeployment can still pick a new default version, and the deployment would also upgrade automatically at retirement.", fr: "Sans version dans le bloc model, chaque redéploiement peut encore prendre une nouvelle version par défaut, et le déploiement serait aussi mis à niveau automatiquement à la mise hors service." }
    c: { en: "raiPolicyName selects the content filtering policy; it doesn't control the model version.", fr: "raiPolicyName sélectionne la stratégie de filtrage de contenu ; elle ne contrôle pas la version du modèle." }
    d: { en: "A paused deployment doesn't serve the application, and pausing doesn't pin the model version.", fr: "Un déploiement en pause ne sert pas l'application, et la pause ne fixe pas la version du modèle." }
references:
  - title: Microsoft.CognitiveServices/accounts/deployments - Bicep, ARM template & Terraform AzAPI reference
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.cognitiveservices/accounts/deployments
  - title: Azure OpenAI in Microsoft Foundry Models working with models
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/working-with-models
