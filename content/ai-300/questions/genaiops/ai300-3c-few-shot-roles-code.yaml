id: ai300-3c-few-shot-roles-code
objective: "3.3.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso calls a non-reasoning GPT chat model deployment named **chat-model** in a Microsoft Foundry project by using the Chat Completions API. The code must:

    - set the classification instructions as the system message;
    - add one few-shot example before the ticket to classify;
    - make the output as focused and repeatable as possible.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso appelle un déploiement de modèle de conversation GPT sans raisonnement nommé **chat-model** dans un projet Microsoft Foundry à l'aide de l'API Chat Completions. Le code doit :

    - définir les instructions de classification comme message système ;
    - ajouter un exemple few-shot avant le ticket à classer ;
    - rendre la sortie aussi ciblée et reproductible que possible.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    messages = [
        {"role": "[[r1]]", "content": "Classify the ticket as Network, Hardware or Access. Reply with the label only."},
        {"role": "user", "content": "My laptop screen flickers when I open the lid."},
        {"role": "[[r2]]", "content": "Hardware"},
        {"role": "user", "content": ticket_text},
    ]

    response = client.chat.completions.create(
        model="chat-model",
        messages=messages,
        temperature=[[t]],
    )
  slots:
    - id: r1
      options:
        - { id: system, text: system }
        - { id: user, text: user }
        - { id: assistant, text: assistant }
        - { id: tool, text: tool }
    - id: r2
      options:
        - { id: system, text: system }
        - { id: user, text: user }
        - { id: assistant, text: assistant }
        - { id: tool, text: tool }
    - id: t
      options:
        - { id: t0, text: "0" }
        - { id: t1, text: "1" }
        - { id: t2, text: "2" }
answer:
  values: { r1: system, r2: assistant, t: t0 }
explanation:
  correct:
    en: The instructions go in the system message. A few-shot example is a user message followed by the assistant message that shows the expected answer, placed after the system message and before the real input. Temperature ranges from 0 to 2, and lower values give more focused, deterministic output.
    fr: Les instructions vont dans le message système. Un exemple few-shot est un message user suivi du message assistant qui montre la réponse attendue, placé après le message système et avant l'entrée réelle. La température va de 0 à 2, et les valeurs basses donnent une sortie plus ciblée et déterministe.
  options:
    tool:
      en: The tool role carries the output of a tool call, not instructions or example answers.
      fr: Le rôle tool transporte le résultat d'un appel d'outil, pas des instructions ni des exemples de réponse.
    t2:
      en: A temperature of 2 is the maximum and gives the most random output.
      fr: Une température de 2 est le maximum et donne la sortie la plus aléatoire.
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
