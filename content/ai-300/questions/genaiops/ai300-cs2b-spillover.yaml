id: ai300-cs2b-spillover
objective: "3.2.4"
type: yesno_statements
caseStudy: ai300-cs2b-wide-world-importers
difficulty: 3
status: draft
stem:
  en: |
    You deploy the model of gpt-docs as a provisioned deployment named ptu-docs in fdy-wwi. You plan to configure spillover to meet production deployment requirement 3.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez le modèle de gpt-docs sous la forme d'un déploiement approvisionné nommé ptu-docs dans fdy-wwi. Vous prévoyez de configurer le débordement (spillover) pour respecter l'exigence 3 du déploiement en production.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The spillover target must be a standard deployment in fdy-wwi that uses the same model and model version as ptu-docs.
        fr: La cible du débordement doit être un déploiement standard dans fdy-wwi qui utilise le même modèle et la même version de modèle que ptu-docs.
    - id: s2
      text:
        en: Requests that spill over to the standard deployment are covered by the hourly cost of the PTUs of ptu-docs.
        fr: Les requêtes qui débordent vers le déploiement standard sont couvertes par le coût horaire des PTU de ptu-docs.
    - id: s3
      text:
        en: Spillover redirects a request to the standard deployment only when ptu-docs returns an HTTP 429 response.
        fr: Le débordement ne redirige une requête vers le déploiement standard que lorsque ptu-docs renvoie une réponse HTTP 429.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Spillover needs a provisioned deployment and a pay-as-you-go deployment of the same model and version in the same Foundry resource. Requests served by the provisioned deployment cost only its hourly PTU rate, but requests routed to the standard deployment are billed at its input, cached and output token rates. Spillover starts on any non-200 response of the provisioned deployment: 429 when the PTUs are exhausted, but also 400 for an over-long context and 500 or 503 server errors."
    fr: "Le débordement nécessite un déploiement approvisionné et un déploiement à l'utilisation du même modèle et de la même version dans la même ressource Foundry. Les requêtes servies par le déploiement approvisionné ne coûtent que son tarif horaire par PTU, mais les requêtes routées vers le déploiement standard sont facturées à ses tarifs de jetons d'entrée, mis en cache et de sortie. Le débordement se déclenche sur toute réponse non 200 du déploiement approvisionné : 429 quand les PTU sont épuisées, mais aussi 400 pour un contexte trop long et 500 ou 503 pour les erreurs serveur."
references:
  - title: Manage traffic with spillover for provisioned deployments
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/spillover-traffic-management
