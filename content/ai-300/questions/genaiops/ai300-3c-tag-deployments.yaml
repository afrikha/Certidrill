id: ai300-3c-tag-deployments
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys deploys an agent named **trail-guide** by running a script from a GitHub repository. Each run creates a new agent version in Microsoft Foundry, numbered automatically. The prompt files are named v1_instructions.txt, v2_instructions.txt and so on.

    When an incident occurs, the team must be able to find, for a given deployed agent version, the exact prompt file and script that produced it, and redeploy that state if needed. The solution must minimize effort.

    What should you do after each deployment?
  fr: |
    Tailspin Toys déploie un agent nommé **trail-guide** en exécutant un script depuis un dépôt GitHub. Chaque exécution crée une nouvelle version de l'agent dans Microsoft Foundry, numérotée automatiquement. Les fichiers d'invite se nomment v1_instructions.txt, v2_instructions.txt, etc.

    Lors d'un incident, l'équipe doit pouvoir retrouver, pour une version d'agent déployée, le fichier d'invite et le script exacts qui l'ont produite, et redéployer cet état si nécessaire. La solution doit réduire l'effort au minimum.

    Que devez-vous faire après chaque déploiement ?
body:
  options:
    - id: a
      text: { en: "Create a long-lived Git branch named after the agent version and keep it open.", fr: "Créer une branche Git de longue durée nommée d'après la version de l'agent et la garder ouverte." }
    - id: b
      text: { en: "Write the agent version number to the .env file of the repository.", fr: "Écrire le numéro de version de l'agent dans le fichier .env du dépôt." }
    - id: c
      text: { en: "Commit the script change and create a Git tag on the commit that matches the agent version.", fr: "Valider la modification du script et créer sur le commit une balise Git qui correspond à la version de l'agent." }
    - id: d
      text: { en: "Create the agent under a new name that includes the prompt file version.", fr: "Créer l'agent sous un nouveau nom qui inclut la version du fichier d'invite." }
answer: { optionId: c }
explanation:
  correct:
    en: Tagging the deployment commit (v1, v2, v3) gives each deployed agent version a fixed pointer to the prompt file and script that produced it. Checking out the tag recovers that state for debugging or redeployment, with no extra branches to maintain.
    fr: Baliser le commit de déploiement (v1, v2, v3) donne à chaque version d'agent déployée un pointeur fixe vers le fichier d'invite et le script qui l'ont produite. Extraire la balise permet de retrouver cet état pour le débogage ou un redéploiement, sans branche supplémentaire à maintenir.
  options:
    a:
      en: A branch per version adds branches to maintain, and a branch can move as new commits are added, unlike a tag.
      fr: Une branche par version ajoute des branches à maintenir, et une branche peut avancer avec de nouveaux commits, contrairement à une balise.
    b:
      en: The .env file holds local environment settings and must not be committed, so it gives no history.
      fr: "Le fichier .env contient des paramètres d'environnement locaux et ne doit pas être validé : il ne fournit aucun historique."
    d:
      en: A new name creates a separate agent and breaks the version history that Foundry keeps for trail-guide.
      fr: Un nouveau nom crée un agent distinct et rompt l'historique des versions que Foundry conserve pour trail-guide.
references:
  - title: Organize prompts in GitHub repositories
    url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/4-github-repository-structure
