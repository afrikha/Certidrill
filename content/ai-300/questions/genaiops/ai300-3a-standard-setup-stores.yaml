id: ai300-3a-standard-setup-stores
objective: "3.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso configures a Foundry resource named **foundry-cts** with a standard agent setup so that all agent data stays in customer-managed resources.

    Which resource stores each type of agent data? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso configure une ressource Foundry nommée **foundry-cts** avec une configuration d'agent standard afin que toutes les données des agents restent dans des ressources gérées par le client.

    Quelle ressource stocke chaque type de données des agents ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Messages, conversation history and agent metadata: [[threads]]

      Files uploaded by developers and end users: [[files]]

      Vector stores created by the agents: [[vectors]]
    fr: |
      Messages, historique des conversations et métadonnées des agents : [[threads]]

      Fichiers chargés par les développeurs et les utilisateurs finaux : [[files]]

      Magasins de vecteurs créés par les agents : [[vectors]]
  slots:
    - id: threads
      options:
        - { id: cosmos, text: Azure Cosmos DB for NoSQL }
        - { id: storage, text: { en: "Azure Storage account", fr: "Compte Stockage Azure" } }
        - { id: search, text: Azure AI Search }
        - { id: kv, text: Azure Key Vault }
    - id: files
      options:
        - { id: cosmos, text: Azure Cosmos DB for NoSQL }
        - { id: storage, text: { en: "Azure Storage account", fr: "Compte Stockage Azure" } }
        - { id: search, text: Azure AI Search }
        - { id: kv, text: Azure Key Vault }
    - id: vectors
      options:
        - { id: cosmos, text: Azure Cosmos DB for NoSQL }
        - { id: storage, text: { en: "Azure Storage account", fr: "Compte Stockage Azure" } }
        - { id: search, text: Azure AI Search }
        - { id: kv, text: Azure Key Vault }
answer:
  values: { threads: cosmos, files: storage, vectors: search }
explanation:
  correct:
    en: |
      In a standard agent setup, Azure Cosmos DB for NoSQL stores messages, conversation history and agent metadata, Azure Storage stores the uploaded files, and Azure AI Search stores the vector stores created by the agents. Azure Key Vault stores secrets, not agent data.
    fr: |
      Dans une configuration d'agent standard, Azure Cosmos DB for NoSQL stocke les messages, l'historique des conversations et les métadonnées des agents, Stockage Azure stocke les fichiers chargés et Azure AI Search stocke les magasins de vecteurs créés par les agents. Azure Key Vault stocke des secrets, pas des données d'agents.
references:
  - title: Set up standard agent resources for Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/standard-agent-setup
