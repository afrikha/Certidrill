id: ai300-3c-feature-to-prod
objective: "3.3.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys manages the prompts of its Microsoft Foundry agents in a GitHub repository. Changes must be tested in development, approved by the team in a pull request and traceable to a release before they are deployed to production.

    You need to change the greeting prompt of the support agent and prepare it for production deployment.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys gère les invites de ses agents Microsoft Foundry dans un dépôt GitHub. Les modifications doivent être testées en développement, approuvées par l'équipe dans une demande de tirage et rattachées à une version publiée avant leur déploiement en production.

    Vous devez modifier l'invite d'accueil de l'agent de support et la préparer au déploiement en production.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: branch, text: { en: "Create a feature branch from an up-to-date main branch.", fr: "Créer une branche de fonctionnalité à partir d'une branche main à jour." } }
    - { id: edit, text: { en: "Edit the prompt file and test it with sample inputs in the development project.", fr: "Modifier le fichier d'invite et le tester avec des exemples d'entrée dans le projet de développement." } }
    - { id: commit, text: { en: "Commit the change with a message that explains what changed and why.", fr: "Valider la modification avec un message qui explique ce qui a changé et pourquoi." } }
    - { id: pr, text: { en: "Open a pull request to main that includes the test results, and request reviews.", fr: "Ouvrir une demande de tirage vers main qui inclut les résultats de test, et demander des relectures." } }
    - { id: merge, text: { en: "After approval, merge the pull request and tag the release version.", fr: "Après approbation, fusionner la demande de tirage et baliser la version publiée." } }
    - { id: prodfirst, text: { en: "Deploy the edited prompt to production to collect user feedback for the reviewers.", fr: "Déployer l'invite modifiée en production pour recueillir l'avis des utilisateurs à l'intention des relecteurs." } }
    - { id: hotfix, text: { en: "Create a hotfix branch from the feature branch for the reviewers' comments.", fr: "Créer une branche de correctif à partir de la branche de fonctionnalité pour les commentaires des relecteurs." } }
answer:
  sequence: [ branch, edit, commit, pr, merge ]
explanation:
  correct:
    en: The recommended branching workflow isolates the change in a feature branch created from the latest main, develops and tests it, commits it with a clear explanation, opens a pull request with test results for team review, and after approval merges to main and tags the release before deploying and monitoring it.
    fr: Le flux de branches recommandé isole la modification dans une branche de fonctionnalité créée depuis la dernière version de main, la développe et la teste, la valide avec une explication claire, ouvre une demande de tirage avec les résultats de test pour la relecture de l'équipe, puis, après approbation, fusionne dans main et balise la version avant de la déployer et de la surveiller.
  options:
    prodfirst:
      en: Deploying before review sends an untested, unapproved prompt to customers, which the workflow is meant to prevent.
      fr: Déployer avant la relecture envoie aux clients une invite non testée et non approuvée, ce que le flux de travail vise justement à empêcher.
    hotfix:
      en: Hotfix branches are for urgent production fixes; review feedback is addressed with new commits on the feature branch.
      fr: Les branches de correctif servent aux corrections urgentes en production ; les retours de relecture se traitent par de nouveaux commits sur la branche de fonctionnalité.
references:
  - title: Develop safe prompt deployment workflows
    url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/5-prompt-workflow-development
