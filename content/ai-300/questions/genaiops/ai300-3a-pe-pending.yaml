id: ai300-3a-pe-pending
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has a Foundry resource named **foundry-wdg** that has public network access disabled. A network engineer who has no role on foundry-wdg creates a private endpoint for foundry-wdg in a virtual network named **vnet-hub**. The private DNS zones are linked to vnet-hub.

    Clients in vnet-hub still can't send traffic to foundry-wdg through the private endpoint. The private endpoint connection shows the **Pending** state.

    What should you do?
  fr: |
    Woodgrove dispose d'une ressource Foundry nommée **foundry-wdg** dont l'accès réseau public est désactivé. Un ingénieur réseau qui n'a aucun rôle sur foundry-wdg crée un point de terminaison privé pour foundry-wdg dans un réseau virtuel nommé **vnet-hub**. Les zones DNS privées sont liées à vnet-hub.

    Les clients de vnet-hub ne peuvent toujours pas envoyer de trafic vers foundry-wdg par le point de terminaison privé. La connexion du point de terminaison privé affiche l'état **Pending**.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Have an owner of foundry-wdg approve the private endpoint connection.", fr: "Faire approuver la connexion du point de terminaison privé par un propriétaire de foundry-wdg." } }
    - { id: b, text: { en: "Enable public network access from selected networks on foundry-wdg.", fr: "Activer l'accès réseau public à partir des réseaux sélectionnés sur foundry-wdg." } }
    - { id: c, text: { en: "Add a virtual network rule for the subnet of vnet-hub on foundry-wdg.", fr: "Ajouter une règle de réseau virtuel pour le sous-réseau de vnet-hub sur foundry-wdg." } }
    - { id: d, text: { en: "Recreate the private DNS zones and link them to vnet-hub again.", fr: "Recréer les zones DNS privées et les lier de nouveau à vnet-hub." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Only private endpoints in the **Approved** state can send traffic. When the creator lacks Contributor or Owner permissions on the Foundry resource, the connection stays **Pending** until the resource owner approves it.
    fr: |
      Seuls les points de terminaison privés à l'état **Approved** peuvent envoyer du trafic. Lorsque le créateur n'a pas les autorisations Contributor ou Owner sur la ressource Foundry, la connexion reste **Pending** jusqu'à ce que le propriétaire de la ressource l'approuve.
  options:
    b:
      en: |
        Public network access doesn't change the state of the private endpoint connection, and it would weaken the isolation.
      fr: |
        L'accès réseau public ne change pas l'état de la connexion du point de terminaison privé, et il affaiblirait l'isolation.
    c:
      en: |
        Virtual network rules apply to public network access through service endpoints, not to traffic through a private endpoint.
      fr: |
        Les règles de réseau virtuel s'appliquent à l'accès réseau public par des points de terminaison de service, pas au trafic qui passe par un point de terminaison privé.
    d:
      en: |
        DNS resolution isn't the problem: a pending connection can't carry traffic whatever the DNS configuration.
      fr: |
        La résolution DNS n'est pas en cause : une connexion en attente ne peut pas transporter de trafic, quelle que soit la configuration DNS.
references:
  - title: How to configure network isolation for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
