id: ai300-cs4b-search-access
objective: "3.1.2"
type: single
caseStudy: ai300-cs4b-margies-travel
difficulty: 2
status: draft
stem:
  en: You need to change how app-margie-assist accesses travel-idx. The solution must meet the security requirements. What should you do?
  fr: Vous devez modifier la façon dont app-margie-assist accède à travel-idx. La solution doit respecter les exigences de sécurité. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set API access control to Both, and assign Search Index Data Reader to the managed identity", fr: "Régler le contrôle d'accès à l'API sur Both, et attribuer Search Index Data Reader à l'identité managée" } }
    - { id: b, text: { en: "Set API access control to Role-based access control, and assign Search Service Contributor to the managed identity", fr: "Régler le contrôle d'accès à l'API sur Role-based access control, et attribuer Search Service Contributor à l'identité managée" } }
    - { id: c, text: { en: "Set API access control to Role-based access control, and assign Search Index Data Reader to the managed identity", fr: "Régler le contrôle d'accès à l'API sur Role-based access control, et attribuer Search Index Data Reader à l'identité managée" } }
    - { id: d, text: { en: "Keep API access control at its default, and assign Search Index Data Contributor to the managed identity", fr: "Conserver la valeur par défaut du contrôle d'accès à l'API, et attribuer Search Index Data Contributor à l'identité managée" } }
answer: { optionId: c }
explanation:
  correct:
    en: The Role-based access control option makes srch-margie accept only Microsoft Entra tokens, so no client can use an API key. Search Index Data Reader is the data-plane role that allows queries without loading documents or changing index definitions, which applies least privilege to the managed identity.
    fr: L'option Role-based access control fait accepter à srch-margie uniquement des jetons Microsoft Entra ; aucun client ne peut donc utiliser de clé API. Search Index Data Reader est le rôle de plan de données qui autorise les requêtes sans permettre de charger des documents ni de modifier les définitions d'index, ce qui applique le moindre privilège à l'identité managée.
  options:
    a: { en: "With Both, requests that carry an API key are still accepted, so the existing query key would keep working.", fr: "Avec Both, les requêtes qui portent une clé API sont toujours acceptées ; la clé de requête existante continuerait donc de fonctionner." }
    b: { en: "Search Service Contributor manages the service and its objects but can't query indexes through role-based access, and it can retrieve the admin keys.", fr: "Search Service Contributor gère le service et ses objets mais ne peut pas interroger les index avec le contrôle d'accès en fonction du rôle, et il peut récupérer les clés d'administration." }
    d: { en: "With the default API key setting, requests that use role-based authentication are denied; Search Index Data Contributor would also grant write access to the index.", fr: "Avec le réglage par défaut des clés API, les requêtes qui utilisent l'authentification par rôle sont refusées ; Search Index Data Contributor accorderait en outre un accès en écriture à l'index." }
references:
  - title: Connect to Azure AI Search using roles
    url: https://learn.microsoft.com/en-us/azure/search/search-security-rbac
  - title: Enable Role-Based Access Control - Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/search-security-enable-roles
