id: ai300-3a-network-facts
objective: "3.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind operates two Foundry resources:

    - **foundry-a** has a private endpoint, public network access disabled, and virtual network injection for its agents.
    - **foundry-b** has a managed virtual network in Allow only approved outbound mode.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind exploite deux ressources Foundry :

    - **foundry-a** possède un point de terminaison privé, l'accès réseau public désactivé et une injection dans un réseau virtuel pour ses agents.
    - **foundry-b** possède un réseau virtuel managé en mode Allow only approved outbound.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If you enable public network access on foundry-a again, its existing private endpoint is removed.
        fr: |
          Si vous réactivez l'accès réseau public sur foundry-a, son point de terminaison privé existant est supprimé.
    - id: s2
      text:
        en: |
          foundry-a must be in the same region as the virtual network that its agents are injected into.
        fr: |
          foundry-a doit se trouver dans la même région que le réseau virtuel dans lequel ses agents sont injectés.
    - id: s3
      text:
        en: |
          You can switch the managed virtual network of foundry-b to Allow internet outbound mode.
        fr: |
          Vous pouvez faire passer le réseau virtuel managé de foundry-b en mode Allow internet outbound.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Enabling public access doesn't remove existing private endpoints. The Foundry resource must be in the same region as the virtual network used for agent injection, although other BYO resources can be elsewhere. After you configure Allow only approved outbound, you can't switch to Allow internet outbound, and managed isolation can't be disabled.
    fr: |
      L'activation de l'accès public ne supprime pas les points de terminaison privés existants. La ressource Foundry doit se trouver dans la même région que le réseau virtuel utilisé pour l'injection des agents, même si les autres ressources apportées peuvent être ailleurs. Une fois le mode Allow only approved outbound configuré, vous ne pouvez pas passer à Allow internet outbound, et l'isolation managée ne peut pas être désactivée.
references:
  - title: How to configure network isolation for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
  - title: Configure managed virtual network for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/managed-virtual-network
