id: ai300-3c-metric-dimensions
objective: "3.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys is designing an experiment that compares two system prompts for a shopping agent in Microsoft Foundry. The experiment must measure each variant on quality, cost and performance.

    Which dimension does each metric measure? To answer, drag the appropriate dimensions to the correct metrics. Each dimension may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys conçoit une expérience qui compare deux invites système d'un agent d'achat dans Microsoft Foundry. L'expérience doit mesurer chaque variante sur la qualité, le coût et les performances.

    Quelle dimension chaque métrique mesure-t-elle ? Pour répondre, faites glisser les dimensions appropriées vers les métriques correspondantes. Chaque dimension peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: quality, text: { en: "Quality", fr: "Qualité" } }
    - { id: cost, text: { en: "Cost", fr: "Coût" } }
    - { id: perf, text: { en: "Performance", fr: "Performances" } }
  targets:
    - { id: t1, text: { en: "Input and output tokens per request", fr: "Jetons d'entrée et de sortie par requête" } }
    - { id: t2, text: { en: "Time-to-first-token of a streamed response", fr: "Délai jusqu'au premier jeton d'une réponse en streaming" } }
    - { id: t3, text: { en: "Intent Resolution score", fr: "Score Intent Resolution" } }
    - { id: t4, text: { en: "End-to-end response time", fr: "Temps de réponse de bout en bout" } }
answer:
  mapping: { t1: cost, t2: perf, t3: quality, t4: perf }
explanation:
  correct:
    en: Token usage, combined with the model's price per million tokens, gives the cost of a variant. End-to-end response time and time-to-first-token (perceived responsiveness when streaming) are performance metrics. Intent Resolution is one of Foundry's agent evaluators and measures quality.
    fr: L'utilisation de jetons, combinée au prix du modèle par million de jetons, donne le coût d'une variante. Le temps de réponse de bout en bout et le délai jusqu'au premier jeton (réactivité perçue en streaming) sont des métriques de performances. Intent Resolution est l'un des évaluateurs d'agents de Foundry et mesure la qualité.
references:
  - title: Design evaluation experiments
    url: https://learn.microsoft.com/en-us/training/modules/evaluate-optimize-agents/2-design-evaluation-experiments
