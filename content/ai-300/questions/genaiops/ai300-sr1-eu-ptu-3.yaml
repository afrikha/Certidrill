id: ai300-sr1-eu-ptu-3
objective: "3.2.4"
type: series_yesno
series: ai300-sr1-eu-ptu
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You create a Regional Provisioned deployment of the model.
  fr: Vous créez un déploiement Regional Provisioned du modèle.
body:
  solution:
    en: |
      You estimate the required number of PTUs with the capacity calculator in the Foundry portal. You then create a deployment of the model with the **Regional Provisioned** deployment type (SKU `ProvisionedManaged`) and that number of PTUs.
    fr: |
      Vous estimez le nombre de PTU nécessaires avec le calculateur de capacité du portail Foundry. Vous créez ensuite un déploiement du modèle avec le type de déploiement **Regional Provisioned** (SKU `ProvisionedManaged`) et ce nombre de PTU.
answer: { value: true }
explanation:
  correct:
    en: |
      A Regional Provisioned deployment processes data only in the region of the resource. Sweden Central is in the European Union, so this is even stricter than the requirement, and the deployment still has dedicated PTU capacity with predictable latency. No cost or resiliency constraint favors another type, so the goal is met.
    fr: |
      Un déploiement Regional Provisioned traite les données uniquement dans la région de la ressource. Sweden Central se trouve dans l'Union européenne : c'est même plus strict que l'exigence, et le déploiement dispose toujours d'une capacité PTU dédiée avec une latence prévisible. Aucune contrainte de coût ou de résilience ne favorise un autre type : l'objectif est atteint.
references:
  - title: Provisioned throughput for Foundry Models - Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/provisioned-throughput
