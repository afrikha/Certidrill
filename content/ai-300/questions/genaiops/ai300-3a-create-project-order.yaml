id: ai300-3a-create-project-order
objective: "3.1.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You need to prepare a new Foundry environment for a development team at Adatum by using the Azure CLI. The environment must contain a Foundry resource in a new resource group and one project. The team members, who belong to a Microsoft Entra security group, must be able to build in the project.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez préparer un nouvel environnement Foundry pour une équipe de développement d'Adatum à l'aide d'Azure CLI. L'environnement doit contenir une ressource Foundry dans un nouveau groupe de ressources et un projet. Les membres de l'équipe, qui appartiennent à un groupe de sécurité Microsoft Entra, doivent pouvoir travailler dans le projet.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: rg, text: { en: "Create the resource group.", fr: "Créer le groupe de ressources." } }
    - { id: res, text: { en: "Create an AIServices resource with a managed identity and project management enabled.", fr: "Créer une ressource AIServices avec une identité managée et la gestion des projets activée." } }
    - { id: proj, text: { en: "Create the project on the Foundry resource.", fr: "Créer le projet sur la ressource Foundry." } }
    - { id: role, text: { en: "Assign the Foundry User role to the security group at the project scope.", fr: "Attribuer le rôle Foundry User au groupe de sécurité à l'étendue du projet." } }
    - { id: hub, text: { en: "Create a hub-based project to host the project.", fr: "Créer un projet basé sur un hub pour héberger le projet." } }
    - { id: dep, text: { en: "Create a model deployment inside the project before creating the resource.", fr: "Créer un déploiement de modèle dans le projet avant de créer la ressource." } }
answer:
  sequence: [ rg, res, proj, role ]
explanation:
  correct:
    en: |
      A Foundry project is a child resource of a Foundry resource, so you create the resource group, then the AIServices resource with a managed identity and project management enabled, then the project. You then assign Foundry User to the group at the project scope, because the project must exist before it can be the scope of a role assignment.
    fr: |
      Un projet Foundry est une ressource enfant d'une ressource Foundry : vous créez le groupe de ressources, puis la ressource AIServices avec une identité managée et la gestion des projets activée, puis le projet. Vous attribuez ensuite Foundry User au groupe à l'étendue du projet, car le projet doit exister pour servir d'étendue à une attribution de rôle.
  options:
    hub:
      en: |
        Hub-based projects belong to the classic experience; a Foundry project is created directly on a Foundry resource.
      fr: |
        Les projets basés sur un hub relèvent de l'expérience classique ; un projet Foundry est créé directement sur une ressource Foundry.
    dep:
      en: |
        Model deployments are child resources of the Foundry resource, which must exist first.
      fr: |
        Les déploiements de modèles sont des ressources enfants de la ressource Foundry, qui doit exister d'abord.
references:
  - title: Create a project for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-projects
