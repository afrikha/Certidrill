id: ai300-3c-inconclusive-label
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam compares two evaluation runs in the Microsoft Foundry portal. The baseline run evaluated the production system prompt and the other run evaluated a rewritten prompt. Both runs used the same eight-row dataset and the same evaluators.

    In the comparison view, the Groundedness cell of the rewritten prompt is labeled **Inconclusive**, although its average score is lower than the baseline. You need to determine reliably whether the rewritten prompt changes groundedness.

    What should you do?
  fr: |
    Fabrikam compare deux exécutions d'évaluation dans le portail Microsoft Foundry. L'exécution de référence a évalué l'invite système de production, et l'autre exécution une invite réécrite. Les deux exécutions ont utilisé le même jeu de données de huit lignes et les mêmes évaluateurs.

    Dans la vue de comparaison, la cellule Groundedness de l'invite réécrite porte la mention **Inconclusive**, bien que son score moyen soit inférieur à celui de la référence. Vous devez déterminer de manière fiable si l'invite réécrite modifie l'ancrage (groundedness).

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Conclude that the rewritten prompt degrades groundedness, because its average score is lower.", fr: "Conclure que l'invite réécrite dégrade l'ancrage, puisque son score moyen est inférieur." }
    - id: b
      text: { en: "Evaluate both prompts again with a larger dataset, and then compare the new runs.", fr: "Évaluer à nouveau les deux invites avec un jeu de données plus grand, puis comparer les nouvelles exécutions." }
    - id: c
      text: { en: "Set the run of the rewritten prompt as the baseline so that the comparison is recalculated.", fr: "Définir l'exécution de l'invite réécrite comme référence pour que la comparaison soit recalculée." }
    - id: d
      text: { en: "Evaluate the rewritten prompt again and select the Groundedness evaluator when you create the run.", fr: "Évaluer à nouveau l'invite réécrite en sélectionnant l'évaluateur Groundedness lors de la création de l'exécution." }
answer: { optionId: b }
explanation:
  correct:
    en: The comparison view uses t-tests, and Inconclusive means there were too few examples or the p-value is not significant. With only eight rows, the lower average may be noise. Rerunning both prompts on a larger dataset gives the test enough samples to label the difference as improved, degraded or unchanged.
    fr: La vue de comparaison utilise des tests t, et Inconclusive signifie que les exemples sont trop peu nombreux ou que la valeur p n'est pas significative. Avec seulement huit lignes, la moyenne plus basse peut n'être que du bruit. Réévaluer les deux invites sur un jeu de données plus grand donne au test assez d'échantillons pour qualifier l'écart d'amélioration, de dégradation ou de changement.
  options:
    a:
      en: A difference of averages that is not statistically significant does not prove a degradation.
      fr: Un écart de moyennes non significatif statistiquement ne prouve pas une dégradation.
    c:
      en: Swapping the baseline reverses the direction of the comparison but leaves the same small sample, so the result stays inconclusive.
      fr: "Inverser la référence change le sens de la comparaison mais conserve le même petit échantillon : le résultat reste non concluant."
    d:
      en: The Groundedness metric is already present in the comparison; a missing metric would not appear at all instead of showing Inconclusive.
      fr: La métrique Groundedness figure déjà dans la comparaison ; une métrique non sélectionnée n'apparaîtrait pas du tout au lieu d'afficher Inconclusive.
references:
  - title: See Evaluation Results in Microsoft Foundry portal
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluate-results
