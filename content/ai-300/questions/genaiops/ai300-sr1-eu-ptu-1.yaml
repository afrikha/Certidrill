seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You create a Data Zone Provisioned deployment of the model.
  fr: Vous créez un déploiement Data Zone Provisioned du modèle.
body:
  solution:
    en: |
      You estimate the required number of PTUs with the capacity calculator in the Foundry portal. You then create a deployment of the model with the **Data Zone Provisioned** deployment type (SKU `DataZoneProvisionedManaged`) and that number of PTUs.
    fr: |
      Vous estimez le nombre de PTU nécessaires avec le calculateur de capacité du portail Foundry. Vous créez ensuite un déploiement du modèle avec le type de déploiement **Data Zone Provisioned** (SKU `DataZoneProvisionedManaged`) et ce nombre de PTU.
answer: { value: true }
explanation:
  correct:
    en: |
      A provisioned deployment reserves dedicated capacity for the deployment, and each model has a latency target, which gives predictable latency. With the Data Zone Provisioned type, data processing stays within the data zone of the resource; Sweden Central belongs to the EU data zone. Both requirements are met.
    fr: |
      Un déploiement approvisionné réserve une capacité dédiée au déploiement, et chaque modèle a une cible de latence, ce qui assure une latence prévisible. Avec le type Data Zone Provisioned, le traitement des données reste dans la zone de données de la ressource ; Sweden Central appartient à la zone de données UE. Les deux exigences sont satisfaites.
references:
  - title: Provisioned throughput for Foundry Models - Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/provisioned-throughput
