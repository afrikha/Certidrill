id: ai300-3b-managed-required-models
objective: "3.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Litware has a hub-based project in the Foundry (classic) portal. The team plans to deploy five models for different applications.

    Which two models can be deployed only by using managed compute?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un projet basé sur un hub dans le portail Foundry (classique). L'équipe prévoit de déployer cinq modèles pour différentes applications.

    Quels sont les deux modèles qui ne peuvent être déployés qu'avec le calcul managé ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "gpt-4.1 from Azure OpenAI in Foundry Models", fr: "gpt-4.1 d'Azure OpenAI dans Foundry Models" } }
    - { id: b, text: { en: "A model from the Hugging Face collection", fr: "Un modèle de la collection Hugging Face" } }
    - { id: c, text: { en: "text-embedding-3-small", fr: "text-embedding-3-small" } }
    - { id: d, text: { en: "An NVIDIA inference microservice (NIM)", fr: "Un microservice d'inférence NVIDIA (NIM)" } }
    - { id: e, text: { en: "A Foundry Model offered with pay-as-you-go billing", fr: "Un Foundry Model proposé avec une facturation à l'utilisation" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Managed compute is required for the Hugging Face and NVIDIA NIM collections, as well as for industry models, Databricks models and custom models. These models run on dedicated compute in a hub-based project.
    fr: |
      Le calcul managé est requis pour les collections Hugging Face et NVIDIA NIM, ainsi que pour les modèles sectoriels, les modèles Databricks et les modèles personnalisés. Ces modèles s'exécutent sur un calcul dédié dans un projet basé sur un hub.
  options:
    a:
      en: |
        Azure OpenAI models use standard deployments in Foundry resources, the preferred option.
      fr: |
        Les modèles Azure OpenAI utilisent des déploiements standard dans les ressources Foundry, l'option recommandée.
    c:
      en: |
        Azure OpenAI embedding models are also deployed as standard deployments in a Foundry resource.
      fr: |
        Les modèles d'incorporation Azure OpenAI sont eux aussi déployés en tant que déploiements standard dans une ressource Foundry.
    e:
      en: |
        Foundry Models with pay-as-you-go billing can be deployed to serverless API endpoints.
      fr: |
        Les Foundry Models avec facturation à l'utilisation peuvent être déployés sur des points de terminaison d'API serverless.
references:
  - title: Deployment options for Microsoft Foundry Models (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/deployments-overview
