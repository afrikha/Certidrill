id: ai300-3a-search-connection-bicep
objective: "3.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip has a Foundry project named **proj-kb** (symbolic name `project`) and an Azure AI Search service named **srch-wingtip-docs**. You add the following resource to a Bicep file so that proj-kb can use the search service.

    The connection must authenticate by using Microsoft Entra ID. No key or secret may be stored in the connection.

    How should you complete the Bicep code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip dispose d'un projet Foundry nommé **proj-kb** (nom symbolique `project`) et d'un service Azure AI Search nommé **srch-wingtip-docs**. Vous ajoutez la ressource suivante à un fichier Bicep pour que proj-kb puisse utiliser le service de recherche.

    La connexion doit s'authentifier avec Microsoft Entra ID. Aucune clé ni aucun secret ne doit être stocké dans la connexion.

    Comment devez-vous compléter le code Bicep ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    resource searchConnection 'Microsoft.CognitiveServices/accounts/projects/connections@2026-09-15-preview' = {
      parent: project
      name: 'srch-wingtip-docs'
      properties: {
        category: [[cat]]
        target: 'https://srch-wingtip-docs.search.windows.net'
        authType: [[auth]]
      }
    }
  slots:
    - id: cat
      options:
        - { id: search, text: "'CognitiveSearch'" }
        - { id: cogsvc, text: "'CognitiveService'" }
        - { id: blob, text: "'AzureBlob'" }
        - { id: aisvc, text: "'AIServices'" }
    - id: auth
      options:
        - { id: apikey, text: "'ApiKey'" }
        - { id: aad, text: "'AAD'" }
        - { id: acctkey, text: "'AccountKey'" }
        - { id: sas, text: "'SAS'" }
answer:
  values: { cat: search, auth: aad }
explanation:
  correct:
    en: "Azure AI Search connections use the `CognitiveSearch` category. The `AAD` authentication type uses Microsoft Entra ID, so the connection stores no credentials; the `credentials` shape depends on `authType`, and key-based types carry a key or secret."
    fr: "Les connexions Azure AI Search utilisent la catégorie `CognitiveSearch`. Le type d'authentification `AAD` utilise Microsoft Entra ID : la connexion ne stocke aucune information d'identification ; la forme de `credentials` dépend de `authType`, et les types fondés sur une clé contiennent une clé ou un secret."
  options:
    cat:
      en: "`CognitiveService` and `AIServices` target Foundry Tools resources, and `AzureBlob` targets a blob container, not a search service."
      fr: "`CognitiveService` et `AIServices` ciblent des ressources Foundry Tools, et `AzureBlob` cible un conteneur d'objets blob, pas un service de recherche."
    auth:
      en: "`ApiKey`, `AccountKey` and `SAS` all store a key or token in the connection, which the requirement forbids."
      fr: "`ApiKey`, `AccountKey` et `SAS` stockent tous une clé ou un jeton dans la connexion, ce que l'exigence interdit."
references:
  - title: Microsoft.CognitiveServices accounts/projects/connections
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.cognitiveservices/accounts/projects/connections
  - title: Add a new connection to your project
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/connections-add
