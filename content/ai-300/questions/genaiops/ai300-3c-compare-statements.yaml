id: ai300-3c-compare-statements
objective: "3.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum evaluates two versions of a system prompt in a Microsoft Foundry project. Each version is evaluated in its own evaluation run that targets the same model deployment, and the team compares the runs in the Foundry portal.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum évalue deux versions d'une invite système dans un projet Microsoft Foundry. Chaque version est évaluée dans sa propre exécution d'évaluation qui cible le même déploiement de modèle, et l'équipe compare les exécutions dans le portail Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The comparison view uses statistical t-testing to label how each metric differs from the baseline run.
        fr: La vue de comparaison utilise des tests t statistiques pour qualifier l'écart de chaque métrique par rapport à l'exécution de référence.
    - id: s2
      text:
        en: The comparison view is saved in the project, so the team can reopen it later from the list of evaluation runs.
        fr: La vue de comparaison est enregistrée dans le projet, et l'équipe peut la rouvrir plus tard depuis la liste des exécutions d'évaluation.
    - id: s3
      text:
        en: Because the runs target a model, their results include the median (p50) and 95th-percentile (p95) end-to-end latency.
        fr: Comme les exécutions ciblent un modèle, leurs résultats incluent la latence de bout en bout médiane (p50) et au 95e centile (p95).
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Selecting two or more runs and Compare opens a side-by-side view based on t-tests, with an optional baseline run and significance labels. The view isn't saved; if you leave the page, you reselect the runs and select Compare again. For model-target runs, results show p50 and p95 end-to-end latency in milliseconds, which helps compare prompt variants on performance as well as quality.
    fr: Sélectionner au moins deux exécutions puis Compare ouvre une vue côte à côte fondée sur des tests t, avec une exécution de référence facultative et des étiquettes de significativité. Cette vue n'est pas enregistrée ; si vous quittez la page, vous resélectionnez les exécutions et sélectionnez à nouveau Compare. Pour les exécutions qui ciblent un modèle, les résultats indiquent la latence de bout en bout p50 et p95 en millisecondes, ce qui permet de comparer les variantes d'invite sur les performances autant que sur la qualité.
references:
  - title: See Evaluation Results in Microsoft Foundry portal
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluate-results
