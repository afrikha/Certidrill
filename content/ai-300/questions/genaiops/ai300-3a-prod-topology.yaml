id: ai300-3a-prod-topology
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses a single Foundry resource named **foundry-explore** with one project per use case for experimentation. The fraud detection use case is moving to production.

    The production fraud workload must have its own quota and cost boundary, and an incident or a misconfiguration in another use case must not affect it. The solution must follow Microsoft's guidance for production topologies.

    What should you do?
  fr: |
    Contoso utilise une seule ressource Foundry nommée **foundry-explore**, avec un projet par cas d'usage pour l'expérimentation. Le cas d'usage de détection de fraude passe en production.

    La charge de travail de fraude en production doit disposer de sa propre limite de quota et de coût, et un incident ou une erreur de configuration dans un autre cas d'usage ne doit pas l'affecter. La solution doit suivre les recommandations de Microsoft pour les topologies de production.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a production project for fraud detection in foundry-explore.", fr: "Créer un projet de production pour la détection de fraude dans foundry-explore." } }
    - { id: b, text: { en: "Create dedicated model deployments for fraud detection in foundry-explore.", fr: "Créer des déploiements de modèles dédiés à la détection de fraude dans foundry-explore." } }
    - { id: c, text: { en: "Create a dedicated Foundry resource for the production fraud workload.", fr: "Créer une ressource Foundry dédiée à la charge de travail de fraude en production." } }
    - { id: d, text: { en: "Move the fraud detection project of foundry-explore to a new resource group.", fr: "Déplacer le projet de détection de fraude de foundry-explore vers un nouveau groupe de ressources." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For production, Microsoft recommends isolation by default, with one Foundry resource per production workload boundary. A separate resource gives the workload independent quota and cost boundaries and removes the shared blast radius of a co-located resource.
    fr: |
      Pour la production, Microsoft recommande l'isolation par défaut, avec une ressource Foundry par limite de charge de travail de production. Une ressource distincte donne à la charge de travail des limites de quota et de coût indépendantes et supprime le rayon d'impact partagé d'une ressource colocalisée.
  options:
    a:
      en: |
        Projects on the same resource share its deployments, network settings and quota, so the fraud workload keeps the shared blast radius.
      fr: |
        Les projets d'une même ressource partagent ses déploiements, ses paramètres réseau et son quota ; la charge de travail de fraude conserve donc le rayon d'impact partagé.
    b:
      en: |
        Deployments of the same resource remain inside the same resource boundary and are consumable from every project of that resource.
      fr: |
        Les déploiements d'une même ressource restent dans la même limite de ressource et sont utilisables par tous les projets de cette ressource.
    d:
      en: |
        A project is a child resource of its Foundry resource; it can't be separated from its parent to obtain its own boundary.
      fr: |
        Un projet est une ressource enfant de sa ressource Foundry ; il ne peut pas être séparé de son parent pour obtenir sa propre limite.
references:
  - title: Microsoft Foundry rollout across my organization
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/planning
