id: ai300-3a-bicep-project-host
objective: "3.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind wrote the following Bicep file to deploy a Foundry resource and a project.

    ```bicep
    resource foundry 'Microsoft.CognitiveServices/accounts@2026-07-01' = {
      name: 'foundry-ntw'
      location: location
      kind: 'AIServices'
      sku: { name: 'S0' }
      properties: {
        customSubDomainName: 'foundry-ntw'
        publicNetworkAccess: 'Enabled'
      }
    }

    resource project 'Microsoft.CognitiveServices/accounts/projects@2026-07-01' = {
      parent: foundry
      name: 'proj-ntw'
      location: location
      identity: { type: 'SystemAssigned' }
      properties: {}
    }
    ```

    You need to modify the `foundry` resource so that it meets Microsoft's documented requirements for hosting projects.

    Which two changes should you make? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind a écrit le fichier Bicep suivant pour déployer une ressource Foundry et un projet.

    ```bicep
    resource foundry 'Microsoft.CognitiveServices/accounts@2026-07-01' = {
      name: 'foundry-ntw'
      location: location
      kind: 'AIServices'
      sku: { name: 'S0' }
      properties: {
        customSubDomainName: 'foundry-ntw'
        publicNetworkAccess: 'Enabled'
      }
    }

    resource project 'Microsoft.CognitiveServices/accounts/projects@2026-07-01' = {
      parent: foundry
      name: 'proj-ntw'
      location: location
      identity: { type: 'SystemAssigned' }
      properties: {}
    }
    ```

    Vous devez modifier la ressource `foundry` pour qu'elle réponde aux exigences documentées par Microsoft pour héberger des projets.

    Quelles sont les deux modifications à apporter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add `identity: { type: 'SystemAssigned' }` to the foundry resource.", fr: "Ajouter `identity: { type: 'SystemAssigned' }` à la ressource foundry." } }
    - { id: b, text: { en: "Add `disableLocalAuth: true` to the properties of foundry.", fr: "Ajouter `disableLocalAuth: true` aux propriétés de foundry." } }
    - { id: c, text: { en: "Change the `kind` of foundry to `'OpenAI'`.", fr: "Remplacer le `kind` de foundry par `'OpenAI'`." } }
    - { id: d, text: { en: "Add `allowProjectManagement: true` to the properties of foundry.", fr: "Ajouter `allowProjectManagement: true` aux propriétés de foundry." } }
    - { id: e, text: { en: "Add `dependsOn: [ foundry ]` to the project resource.", fr: "Ajouter `dependsOn: [ foundry ]` à la ressource project." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Project management requires a managed identity on the Foundry resource; without one, project creation fails with an error that a managed identity must be enabled. The `allowProjectManagement` property allows the resource to contain child projects, and Microsoft's templates and samples set it to `true`.
    fr: |
      La gestion des projets nécessite une identité managée sur la ressource Foundry ; sans elle, la création d'un projet échoue avec une erreur indiquant qu'une identité managée doit être activée. La propriété `allowProjectManagement` permet à la ressource de contenir des projets enfants, et les modèles et exemples de Microsoft la définissent sur `true`.
  options:
    b:
      en: |
        Disabling local authentication is a security choice; it isn't required to host projects.
      fr: |
        La désactivation de l'authentification locale est un choix de sécurité ; elle n'est pas nécessaire pour héberger des projets.
    c:
      en: |
        Foundry projects are hosted by AIServices resources; project management applies to the AIServices kind only.
      fr: |
        Les projets Foundry sont hébergés par des ressources AIServices ; la gestion des projets s'applique uniquement au type AIServices.
    e:
      en: |
        The `parent` property already creates the dependency on foundry, so `dependsOn` adds nothing.
      fr: |
        La propriété `parent` crée déjà la dépendance envers foundry : `dependsOn` n'apporte rien.
references:
  - title: Create a project for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-projects
  - title: Microsoft.CognitiveServices accounts
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.cognitiveservices/accounts
