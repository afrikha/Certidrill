id: ai300-cs3b-deployment-types
objective: "3.2.1"
type: dragdrop
caseStudy: ai300-cs3b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    You plan to create a gpt-4.1 deployment in fdy-lucerne for each new workload.

    Which deployment type should you use for each workload to meet the model deployment requirements? To answer, drag the appropriate deployment types to the correct workloads. Each deployment type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer un déploiement gpt-4.1 dans fdy-lucerne pour chaque nouvelle charge de travail.

    Quel type de déploiement devez-vous utiliser pour chaque charge de travail afin de respecter les exigences relatives aux déploiements de modèles ? Pour répondre, faites glisser les types de déploiement appropriés vers les charges de travail correspondantes. Chaque type de déploiement peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: gstd, text: Global Standard }
    - { id: gprov, text: Global Provisioned }
    - { id: gbatch, text: Global Batch }
    - { id: dzstd, text: Data Zone Standard }
    - { id: dzprov, text: Data Zone Provisioned }
    - { id: dzbatch, text: Data Zone Batch }
  targets:
    - id: archive
      text: { en: "Archive tagging", fr: "Étiquetage des archives" }
    - id: headline
      text: { en: "Headline Lab", fr: "Headline Lab" }
    - id: marketing
      text: { en: "Marketing copy generator", fr: "Générateur de textes marketing" }
answer:
  mapping: { archive: dzbatch, headline: dzstd, marketing: gstd }
explanation:
  correct:
    en: |
      Archive tagging processes articles, so it must stay in the EU data zone; Data Zone Batch processes asynchronous jobs within the data zone at a 50% discount with a 24-hour target. Headline Lab also handles article content, and its low, bursty volume fits pay-per-token Data Zone Standard. The marketing generator has no residency requirement and needs real-time, pay-per-token responses with the highest default quota, which is Global Standard.
    fr: |
      L'étiquetage des archives traite des articles et doit donc rester dans la zone de données UE ; Data Zone Batch traite des travaux asynchrones dans la zone de données avec une remise de 50 % et un objectif de 24 heures. Headline Lab traite aussi du contenu d'articles, et son volume faible et irrégulier convient à Data Zone Standard, facturé au jeton. Le générateur marketing n'a pas d'exigence de résidence et a besoin de réponses en temps réel, facturées au jeton, avec le quota par défaut le plus élevé : c'est Global Standard.
  options:
    gbatch:
      en: |
        Global Batch may process data in any Azure region, which breaks requirement 1 for archive tagging, and it doesn't return real-time responses for the marketing generator.
      fr: |
        Global Batch peut traiter les données dans n'importe quelle région Azure, ce qui enfreint l'exigence 1 pour l'étiquetage des archives, et il ne renvoie pas de réponses en temps réel pour le générateur marketing.
    gprov:
      en: |
        Provisioned types reserve PTU capacity instead of billing per token, and Global Provisioned may process data outside the EU data zone.
      fr: |
        Les types provisionnés réservent une capacité en PTU au lieu d'une facturation au jeton, et Global Provisioned peut traiter les données hors de la zone de données UE.
    dzprov:
      en: |
        Data Zone Provisioned reserves PTU capacity for predictable high throughput; none of the three workloads asks for reserved capacity, and Headline Lab must be billed per token.
      fr: |
        Data Zone Provisioned réserve une capacité en PTU pour un débit élevé et prévisible ; aucune des trois charges de travail ne demande de capacité réservée, et Headline Lab doit être facturé au jeton.
references:
  - title: Understanding deployment types in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
