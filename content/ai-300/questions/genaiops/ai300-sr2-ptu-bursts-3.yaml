id: ai300-sr2-ptu-bursts-3
objective: "3.2.4"
type: series_yesno
series: ai300-sr2-ptu-bursts
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You increase the PTUs of claims-ptu to cover the month-end peak.
  fr: Vous augmentez les PTU de claims-ptu pour couvrir le pic de fin de mois.
body:
  solution:
    en: |
      You measure the peak utilization of claims-ptu during the last month-end burst, and you increase the number of PTUs allocated to claims-ptu so that the deployment can process the highest burst without HTTP 429 responses.
    fr: |
      Vous mesurez l'utilisation maximale de claims-ptu pendant le dernier pic de fin de mois, et vous augmentez le nombre de PTU alloués à claims-ptu pour que le déploiement puisse traiter le pic le plus élevé sans réponse HTTP 429.
answer: { value: false }
explanation:
  correct:
    en: More PTUs would absorb the bursts without changing the application, but a provisioned deployment is billed hourly for its deployed PTUs, whether or not it handles requests. The extra PTUs would sit idle for most of the month, which breaks the cost requirement; spillover to a standard deployment bills only the overflow requests.
    fr: "Davantage de PTU absorberaient les pics sans modifier l'application, mais un déploiement provisionné est facturé à l'heure pour ses PTU déployées, qu'il traite des requêtes ou non. Les PTU supplémentaires resteraient inutilisées la majeure partie du mois, ce qui enfreint l'exigence de coût ; le débordement vers un déploiement standard ne facture que les requêtes excédentaires."
references:
  - title: Provisioned throughput billing and cost management - Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/provisioned-throughput-onboarding
  - title: Manage traffic with spillover for provisioned deployments - Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/spillover-traffic-management
