id: ai300-3b-finetune-reasons
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs a support assistant on a gpt-4.1-mini deployment. Every request includes a long block of instructions and examples, and the team has thousands of high-quality, reviewed conversations.

    The team considers fine-tuning the model. Which two requirements are good reasons to fine-tune rather than rely only on prompt engineering or retrieval-augmented generation (RAG)?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam exécute un assistant de support sur un déploiement gpt-4.1-mini. Chaque requête inclut un long bloc d'instructions et d'exemples, et l'équipe dispose de milliers de conversations de haute qualité et relues.

    L'équipe envisage d'affiner le modèle. Quelles sont les deux exigences qui justifient l'affinage plutôt que de s'appuyer uniquement sur l'ingénierie d'invite ou la génération augmentée par récupération (RAG) ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Answers must reflect product prices that change every day.", fr: "Les réponses doivent refléter des prix de produits qui changent chaque jour." } }
    - { id: b, text: { en: "Answers must always follow the company's tone and a fixed output structure.", fr: "Les réponses doivent toujours suivre le ton de l'entreprise et une structure de sortie fixe." } }
    - { id: c, text: { en: "The assistant must block requests that contain harmful content.", fr: "L'assistant doit bloquer les requêtes au contenu préjudiciable." } }
    - { id: d, text: { en: "Token costs and latency must drop by removing the long instruction block from each request.", fr: "Les coûts en jetons et la latence doivent baisser en supprimant le long bloc d'instructions de chaque requête." } }
    - { id: e, text: { en: "Each answer must cite the internal document that it's based on.", fr: "Chaque réponse doit citer le document interne sur lequel elle s'appuie." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Fine-tuning trains the model on task-specific examples. It helps align style and structure (tone, format, schema) and reduces prompt overhead, which lowers token costs and latency. Benefits aren't guaranteed, so evaluate the tuned model against the baseline on held-out data.
    fr: |
      L'affinage entraîne le modèle sur des exemples propres à la tâche. Il aide à aligner le style et la structure (ton, format, schéma) et réduit la surcharge de l'invite, ce qui diminue les coûts en jetons et la latence. Les gains ne sont pas garantis : évaluez le modèle affiné par rapport à la référence sur des données réservées.
  options:
    a: { en: "Fine-tuning doesn't replace retrieval for current information; daily prices call for RAG.", fr: "L'affinage ne remplace pas la récupération pour les informations à jour ; des prix quotidiens appellent le RAG." }
    c: { en: "Fine-tuning doesn't replace application-level safety controls such as guardrails and content filters.", fr: "L'affinage ne remplace pas les contrôles de sécurité au niveau de l'application, comme les garde-fous et les filtres de contenu." }
    e: { en: "Citing source documents requires retrieving them at query time, which is what RAG does.", fr: "Citer les documents sources exige de les récupérer au moment de la requête, ce que fait le RAG." }
references:
  - title: Fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/fine-tuning-considerations
