id: ai300-3c-pr-gate
objective: "3.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum stores agent prompts in the prompts folder of a GitHub repository. A GitHub Actions workflow runs on each pull request that targets main and changes files in prompts. The workflow runs run_evaluation.py, which writes results.json with a passed field, and then posts the metrics as a pull request comment. The job succeeds even when passed is false.

    You need to ensure that a prompt change can reach main only after a reviewer approves it and only if its evaluation passes.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum stocke les invites de ses agents dans le dossier prompts d'un dépôt GitHub. Un flux de travail GitHub Actions s'exécute à chaque demande de tirage qui cible main et modifie des fichiers de prompts. Le flux de travail exécute run_evaluation.py, qui écrit results.json avec un champ passed, puis publie les métriques dans un commentaire de la demande de tirage. Le travail réussit même lorsque passed vaut false.

    Vous devez faire en sorte qu'une modification d'invite ne puisse atteindre main qu'après l'approbation d'un relecteur et uniquement si son évaluation réussit.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a push trigger for the main branch to the workflow so that it also runs after each merge.", fr: "Ajouter au flux de travail un déclencheur push sur la branche main pour qu'il s'exécute aussi après chaque fusion." } }
    - { id: b, text: { en: "Protect main with a rule that requires an approving review and requires the evaluation job to pass before merging.", fr: "Protéger main par une règle qui exige une relecture approuvée et la réussite du travail d'évaluation avant la fusion." } }
    - { id: c, text: { en: "Grant the workflow the pull-requests: write permission so that it can post the comment.", fr: "Accorder au flux de travail l'autorisation pull-requests: write pour qu'il puisse publier le commentaire." } }
    - { id: d, text: { en: "Create an annotated Git tag on main after each merged prompt change.", fr: "Créer une balise Git annotée sur main après chaque modification d'invite fusionnée." } }
    - { id: e, text: { en: "Change run_evaluation.py so that it exits with a nonzero code when passed is false.", fr: "Modifier run_evaluation.py pour qu'il se termine avec un code différent de zéro lorsque passed vaut false." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: The workflow only reports results, so a failed evaluation still produces a successful check. Making the script fail the job when passed is false turns the evaluation into a real pass/fail check, and a protection rule on main that requires an approving review and that check blocks merges until both conditions are met. Human review keeps the final decision on accuracy, safety and tone.
    fr: "Le flux de travail se contente de rapporter les résultats : une évaluation échouée produit tout de même une vérification réussie. Faire échouer le travail lorsque passed vaut false transforme l'évaluation en véritable vérification réussite/échec, et une règle de protection sur main qui exige une relecture approuvée et cette vérification bloque la fusion tant que les deux conditions ne sont pas remplies. La relecture humaine garde la décision finale sur l'exactitude, la sécurité et le ton."
  options:
    a:
      en: A run after the merge comes too late; the change is already in main.
      fr: "Une exécution après la fusion arrive trop tard : la modification est déjà dans main."
    c:
      en: This permission only lets the workflow comment on the pull request (and the workflow needs it already); it blocks nothing.
      fr: Cette autorisation permet seulement au flux de travail de commenter la demande de tirage (il en a déjà besoin) ; elle ne bloque rien.
    d:
      en: Tags improve traceability after the merge but do not gate it.
      fr: Les balises améliorent la traçabilité après la fusion mais ne la conditionnent pas.
references:
  - title: Integrate evaluations into GitHub Actions
    url: https://learn.microsoft.com/en-us/training/modules/automated-evaluation-genaiops/6-github-actions-workflow
  - title: Develop safe prompt deployment workflows
    url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/5-prompt-workflow-development
