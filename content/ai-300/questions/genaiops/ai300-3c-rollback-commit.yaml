id: ai300-3c-rollback-commit
objective: "3.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso deploys an agent named **support-agent** to a Microsoft Foundry project by running a deployment script from the main branch of a GitHub repository. The script loads a prompt file from the prompts folder. The commits that deployed v2_instructions.txt and v3_instructions.txt are tagged **v2** and **v3**.

    After the v3 deployment, the agent gives incorrect refund information. You must restore the v2 behavior. The main branch must always reflect the prompt that runs in production, and the shared history of main must not be rewritten.

    What should you do?
  fr: |
    Contoso déploie un agent nommé **support-agent** dans un projet Microsoft Foundry en exécutant un script de déploiement depuis la branche main d'un dépôt GitHub. Le script charge un fichier d'invite depuis le dossier prompts. Les commits qui ont déployé v2_instructions.txt et v3_instructions.txt portent les balises **v2** et **v3**.

    Après le déploiement de v3, l'agent donne des informations erronées sur les remboursements. Vous devez rétablir le comportement de v2. La branche main doit toujours refléter l'invite exécutée en production, et l'historique partagé de main ne doit pas être réécrit.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Paste the content of v2_instructions.txt into the agent instructions in the Foundry portal.", fr: "Coller le contenu de v2_instructions.txt dans les instructions de l'agent dans le portail Foundry." }
    - id: b
      text: { en: "Delete the v3 tag from the repository and push the deletion to GitHub.", fr: "Supprimer la balise v3 du dépôt et pousser la suppression vers GitHub." }
    - id: c
      text: { en: "Run git reset --hard v2 on main, force-push main, and then run the script.", fr: "Exécuter git reset --hard v2 sur main, pousser main en force, puis exécuter le script." }
    - id: d
      text: { en: "Commit a change on main that makes the script load v2_instructions.txt, run the script, and tag the commit.", fr: "Valider sur main une modification qui fait charger v2_instructions.txt au script, exécuter le script et baliser le commit." }
answer: { optionId: d }
explanation:
  correct:
    en: Rolling forward with a new commit keeps the history intact and leaves main describing what runs in production. Running the script creates a new agent version in Foundry that uses the v2 instructions, and tagging the commit keeps the mapping between Git and the deployed agent version for later debugging or rollback.
    fr: Avancer avec un nouveau commit préserve l'historique et laisse main décrire ce qui s'exécute en production. L'exécution du script crée dans Foundry une nouvelle version de l'agent qui utilise les instructions v2, et baliser le commit conserve la correspondance entre Git et la version d'agent déployée pour le débogage ou une restauration ultérieure.
  options:
    a:
      en: A portal edit restores the behavior but main still points to v3, so the next deployment from main reintroduces the problem (environment drift).
      fr: "Une modification dans le portail rétablit le comportement, mais main pointe toujours vers v3 : le prochain déploiement depuis main réintroduit le problème (dérive d'environnement)."
    b:
      en: A tag is only a label on a commit; deleting it changes neither the deployed agent nor the prompt that main loads.
      fr: Une balise n'est qu'une étiquette sur un commit ; la supprimer ne change ni l'agent déployé ni l'invite que charge main.
    c:
      en: A hard reset followed by a force-push rewrites the shared history of main, which the requirements forbid.
      fr: Une réinitialisation complète suivie d'un push forcé réécrit l'historique partagé de main, ce que les exigences interdisent.
references:
  - title: Organize prompts in GitHub repositories
    url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/4-github-repository-structure
  - title: Apply version control to prompts
    url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/2-version-control-for-prompts
