    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/deployments-overview
  - title: Explore Microsoft Foundry Models in Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-model-catalog
