id: ai300-3b-managed-vs-serverless
objective: "3.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys works in a hub-based project of the Foundry (classic) portal. The team compares two options to host a catalog model: a managed compute deployment and a serverless API deployment.

    Which two statements are true about the managed compute deployment?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys travaille dans un projet basé sur un hub du portail Foundry (classique). L'équipe compare deux options pour héberger un modèle du catalogue : un déploiement sur calcul managé et un déploiement d'API serverless.

    Quelles sont les deux affirmations vraies concernant le déploiement sur calcul managé ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It's billed in compute core hours, per minute, for the instances it uses.", fr: "Il est facturé en heures de cœurs de calcul, à la minute, pour les instances qu'il utilise." } }
    - { id: b, text: { en: "It includes Azure AI Content Safety filtering by default.", fr: "Il inclut par défaut le filtrage Azure AI Content Safety." } }
    - { id: c, text: { en: "It requires virtual machine quota in the subscription for the selected SKU.", fr: "Il exige un quota de machines virtuelles dans l'abonnement pour la référence SKU choisie." } }
    - { id: d, text: { en: "It supports data zone and global data processing.", fr: "Il prend en charge le traitement des données en zone de données et global." } }
    - { id: e, text: { en: "It's billed for the input and output tokens of each request.", fr: "Il est facturé pour les jetons d'entrée et de sortie de chaque requête." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Managed compute deploys the model weights to dedicated virtual machines. It needs VM quota for the SKU and is billed per minute for compute core hours from the moment of creation until you delete the endpoint. Serverless API deployments are the token-billed option, with integrated content filtering.
    fr: |
      Le calcul managé déploie les poids du modèle sur des machines virtuelles dédiées. Il exige un quota de machines virtuelles pour la référence SKU et il est facturé à la minute en heures de cœurs de calcul, de sa création jusqu'à la suppression du point de terminaison. Les déploiements d'API serverless sont l'option facturée au jeton, avec un filtrage de contenu intégré.
  options:
    b:
      en: |
        Content filtering is integrated with serverless API deployments; with managed compute you call the Azure AI Content Safety APIs yourself.
      fr: |
        Le filtrage de contenu est intégré aux déploiements d'API serverless ; avec le calcul managé, vous appelez vous-même les API Azure AI Content Safety.
    d:
      en: |
        Managed compute and serverless API deployments support regional processing only; data zone and global processing are options of standard deployments in Foundry resources.
      fr: |
        Le calcul managé et les déploiements d'API serverless prennent en charge uniquement le traitement régional ; les traitements en zone de données et global sont des options des déploiements standard dans les ressources Foundry.
    e:
      en: |
        Token-based billing applies to serverless API deployments, not to managed compute.
      fr: |
        La facturation au jeton s'applique aux déploiements d'API serverless, pas au calcul managé.
references:
