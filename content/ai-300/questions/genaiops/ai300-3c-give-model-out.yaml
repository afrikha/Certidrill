id: ai300-3c-give-model-out
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has an HR assistant built on a GPT chat model in a Microsoft Foundry project. The system message contains the text of the company leave policy and the instruction "Answer only from the policy text".

    When employees ask about topics that the policy does not cover, the assistant still produces confident but invented answers. You need to reduce these fabricated answers by changing only the system message.

    What should you add to the system message?
  fr: |
    Northwind Traders dispose d'un assistant RH basé sur un modèle de conversation GPT dans un projet Microsoft Foundry. Le message système contient le texte de la politique de congés de l'entreprise et l'instruction « Réponds uniquement à partir du texte de la politique ».

    Lorsque des employés posent des questions sur des sujets que la politique ne couvre pas, l'assistant produit tout de même des réponses assurées mais inventées. Vous devez réduire ces réponses fabriquées en modifiant uniquement le message système.

    Que devez-vous ajouter au message système ?
body:
  options:
    - id: a
      text: { en: "An instruction to complete the answer with general HR knowledge when the policy text is silent", fr: "Une instruction demandant de compléter la réponse avec des connaissances RH générales lorsque le texte ne dit rien" }
    - id: b
      text: { en: "An instruction to answer in a creative and engaging tone that keeps employees interested", fr: "Une instruction demandant de répondre sur un ton créatif et engageant qui retient l'attention des employés" }
    - id: c
      text: { en: "An instruction to answer every question in 300 words or more so that no detail is left out", fr: "Une instruction demandant de répondre à chaque question en 300 mots ou plus pour ne laisser aucun détail de côté" }
    - id: d
      text: { en: "An instruction to reply \"not found in the policy\" when the answer isn't in the policy text", fr: "Une instruction demandant de répondre « non trouvé dans la politique » lorsque la réponse ne figure pas dans le texte" }
answer: { optionId: d }
explanation:
  correct:
    en: Giving the model an "out", an alternative path such as answering "not found" when the information is missing, is a Microsoft-recommended practice to avoid false responses in grounded scenarios. Without it, the most likely continuation of a question is still an answer.
    fr: Offrir au modèle une « porte de sortie », par exemple répondre « non trouvé » lorsque l'information manque, est une pratique recommandée par Microsoft pour éviter les réponses fausses dans les scénarios ancrés. Sans elle, la suite la plus probable d'une question reste une réponse.
  options:
    a:
      en: Asking the model to fill gaps with general knowledge encourages exactly the ungrounded answers you want to remove.
      fr: Demander au modèle de combler les lacunes avec des connaissances générales encourage précisément les réponses non ancrées que vous voulez supprimer.
    b:
      en: A creative tone does not tell the model what to do when the answer is missing and tends to increase invented content.
      fr: Un ton créatif n'indique pas au modèle quoi faire lorsque la réponse manque et tend à augmenter le contenu inventé.
    c:
      en: Forcing long answers pushes the model to produce more text, including text the policy does not support.
      fr: Imposer de longues réponses pousse le modèle à produire plus de texte, y compris du texte que la politique ne justifie pas.
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
