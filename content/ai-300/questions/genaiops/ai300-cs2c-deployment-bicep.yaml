id: ai300-cs2c-deployment-bicep
objective: "3.2.3"
type: dropdown
caseStudy: ai300-cs2c-adventure-works
difficulty: 3
status: draft
stem:
  en: |
    You are writing the following Bicep file to redeploy gpt-support. The file references the existing fdy-aw resource.

    You need to complete the file to meet deployment requirements 5 and 6.

    How should you complete the file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez le fichier Bicep suivant pour redéployer gpt-support. Le fichier référence la ressource existante fdy-aw.

    Vous devez compléter le fichier pour respecter les exigences de déploiement 5 et 6.

    Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    resource foundry 'Microsoft.CognitiveServices/accounts@2025-06-01' existing = {
      name: 'fdy-aw'
    }

    resource gptSupport 'Microsoft.CognitiveServices/accounts/deployments@2025-06-01' = {
      [[parent]]
      name: 'gpt-support'
      sku: {
        name: [[sku]]
        capacity: 100
      }
      properties: {
        model: {
          format: 'OpenAI'
          name: 'gpt-4.1'
          version: '2025-04-14'
        }
        versionUpgradeOption: [[upgrade]]
      }
    }
  slots:
    - id: parent
      options:
        - { id: parent, text: "parent: foundry" }
        - { id: scope, text: "scope: foundry" }
        - { id: depends, text: "dependsOn: [ foundry ]" }
    - id: sku
      options:
        - { id: global, text: "'GlobalStandard'" }
        - { id: dzstd, text: "'DataZoneStandard'" }
        - { id: dzptu, text: "'DataZoneProvisionedManaged'" }
        - { id: dzbatch, text: "'DataZoneBatch'" }
    - id: upgrade
      options:
        - { id: newdefault, text: "'OnceNewDefaultVersionAvailable'" }
        - { id: expired, text: "'OnceCurrentVersionExpired'" }
        - { id: noauto, text: "'NoAutoUpgrade'" }
answer:
  values: { parent: parent, sku: dzstd, upgrade: expired }
explanation:
  correct:
    en: "A deployment is a child resource of the Foundry account, declared with the `parent` property. The `DataZoneStandard` SKU processes requests only within the selected data zone and bills per token. `OnceCurrentVersionExpired` keeps the pinned model version until it expires and then upgrades the deployment automatically."
    fr: "Un déploiement est une ressource enfant du compte Foundry, déclarée avec la propriété `parent`. La référence SKU `DataZoneStandard` ne traite les requêtes que dans la zone de données choisie et facture au jeton. `OnceCurrentVersionExpired` conserve la version de modèle fixée jusqu'à son expiration, puis met à niveau le déploiement automatiquement."
  options:
    scope: { en: "scope is used for extension resources and modules, not to declare a child resource.", fr: "scope sert aux ressources d'extension et aux modules, pas à déclarer une ressource enfant." }
    depends: { en: "dependsOn only orders deployments; it does not make the deployment a child of fdy-aw.", fr: "dependsOn ne fait qu'ordonner les déploiements ; il ne fait pas du déploiement un enfant de fdy-aw." }
    global: { en: "GlobalStandard can process requests in any Azure region, outside the United States data zone.", fr: "GlobalStandard peut traiter les requêtes dans n'importe quelle région Azure, hors de la zone de données des États-Unis." }
    dzptu: { en: "DataZoneProvisionedManaged is billed per PTU and per hour, not per token.", fr: "DataZoneProvisionedManaged est facturé par PTU et par heure, pas au jeton." }
    dzbatch: { en: "DataZoneBatch processes asynchronous batch jobs; it cannot serve RideHelp's interactive requests.", fr: "DataZoneBatch traite des travaux par lots asynchrones ; il ne peut pas servir les requêtes interactives de RideHelp." }
    newdefault: { en: "OnceNewDefaultVersionAvailable changes the version as soon as a new default version is available, even if the current version is still supported.", fr: "OnceNewDefaultVersionAvailable change de version dès qu'une nouvelle version par défaut est disponible, même si la version actuelle est encore prise en charge." }
    noauto: { en: "NoAutoUpgrade never upgrades the deployment automatically, so manual action is required when the version expires.", fr: "NoAutoUpgrade ne met jamais à niveau le déploiement automatiquement : une action manuelle est nécessaire quand la version expire." }
references:
  - title: Microsoft.CognitiveServices accounts/deployments
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.cognitiveservices/accounts/deployments
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
