id: ai300-3a-whatif-preview
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware deploys its Foundry environment to a resource group named **rg-foundry** from a file named **main.bicep**. You change the network settings and the projects declared in main.bicep.

    Before you apply the change, you must see which resources would be created, modified or deleted, without deploying anything.

    Which command should you run?
  fr: |
    Litware déploie son environnement Foundry dans un groupe de ressources nommé **rg-foundry** à partir d'un fichier nommé **main.bicep**. Vous modifiez les paramètres réseau et les projets déclarés dans main.bicep.

    Avant d'appliquer la modification, vous devez voir quelles ressources seraient créées, modifiées ou supprimées, sans rien déployer.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "az deployment group validate --resource-group rg-foundry --template-file main.bicep" }
    - { id: b, text: "az bicep build --file main.bicep" }
    - { id: c, text: "az deployment group what-if --resource-group rg-foundry --template-file main.bicep" }
    - { id: d, text: "az deployment group show --resource-group rg-foundry --name main" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `az deployment group what-if` evaluates the template against the current state of the resource group and predicts the resources that the deployment would create, modify or delete, without changing existing resources.
    fr: |
      `az deployment group what-if` évalue le modèle par rapport à l'état actuel du groupe de ressources et prédit les ressources que le déploiement créerait, modifierait ou supprimerait, sans modifier les ressources existantes.
  options:
    a:
      en: |
        `validate` checks that the template is syntactically correct and would be accepted, but it doesn't list the resource changes.
      fr: |
        `validate` vérifie que le modèle est correct et serait accepté, mais ne liste pas les modifications de ressources.
    b:
      en: |
        `az bicep build` only transpiles the Bicep file into an ARM JSON template.
      fr: |
        `az bicep build` transpile seulement le fichier Bicep en modèle ARM JSON.
    d:
      en: |
        `az deployment group show` displays an existing deployment, not the changes of a new one.
      fr: |
        `az deployment group show` affiche un déploiement existant, pas les modifications d'un nouveau déploiement.
references:
  - title: "Bicep What-If: Preview Changes Before Deployment"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if
