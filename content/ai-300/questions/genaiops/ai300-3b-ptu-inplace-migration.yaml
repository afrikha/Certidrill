id: ai300-3b-ptu-inplace-migration
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Global Provisioned deployment named **orders-ptu** with 200 PTUs. A newer version of the same model is available, and quota and capacity for it are confirmed.

    You need to move orders-ptu to the newer version. The deployment name and size must stay the same, the application must not experience downtime, and you must not create another deployment.

    What should you do?
  fr: |
    Northwind Traders dispose d'un déploiement Global Provisioned nommé **orders-ptu** avec 200 PTU. Une version plus récente du même modèle est disponible, et le quota et la capacité correspondants sont confirmés.

    Vous devez faire passer orders-ptu à la nouvelle version. Le nom et la taille du déploiement doivent rester identiques, l'application ne doit subir aucune interruption, et vous ne devez pas créer d'autre déploiement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Update the model version of orders-ptu to run an in-place migration.", fr: "Mettre à jour la version de modèle d'orders-ptu pour effectuer une migration sur place." } }
    - { id: b, text: { en: "Set the version upgrade option of orders-ptu to OnceNewDefaultVersionAvailable.", fr: "Définir l'option de mise à niveau de version d'orders-ptu sur OnceNewDefaultVersionAvailable." } }
    - { id: c, text: { en: "Delete orders-ptu, and then recreate it with the same name and the new version.", fr: "Supprimer orders-ptu, puis le recréer avec le même nom et la nouvelle version." } }
    - { id: d, text: { en: "Configure orders-ptu to spill over to a standard deployment of the new version.", fr: "Configurer orders-ptu pour déborder vers un déploiement standard de la nouvelle version." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Provisioned deployments aren't upgraded automatically. An in-place migration changes the model version of the existing deployment while keeping its name and size; the service shifts traffic over a 20 to 30 minute window with no downtime, and the state shows Updating until it returns to Succeeded.
    fr: |
      Les déploiements provisionnés ne sont pas mis à niveau automatiquement. Une migration sur place change la version de modèle du déploiement existant en conservant son nom et sa taille ; le service bascule le trafic sur une fenêtre de 20 à 30 minutes sans interruption, et l'état affiche Updating jusqu'au retour à Succeeded.
  options:
    b: { en: "Automatic version updates are supported only for Standard deployment types, not for provisioned deployments.", fr: "Les mises à jour automatiques de version sont prises en charge uniquement pour les types de déploiement Standard, pas pour les déploiements provisionnés." }
    c: { en: "Deleting the deployment interrupts the application and releases its capacity, which might not be available again.", fr: "Supprimer le déploiement interrompt l'application et libère sa capacité, qui pourrait ne plus être disponible." }
    d: { en: "Spillover only handles requests that orders-ptu can't serve; orders-ptu itself would keep the old version, and a second deployment is needed.", fr: "Le débordement ne traite que les requêtes qu'orders-ptu ne peut pas servir ; orders-ptu conserverait l'ancienne version, et un second déploiement serait nécessaire." }
references:
  - title: Azure OpenAI in Microsoft Foundry Models working with models
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/working-with-models
