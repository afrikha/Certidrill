id: ai300-3a-model-availability
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Bicep deployment that creates a Foundry resource and a model deployment in the East US 2 region fails. The error states that the requested model version isn't available.

    Before you update the model name and version parameters, you need to list the models that are available in East US 2.

    Which command should you run?
  fr: |
    Un déploiement Bicep qui crée une ressource Foundry et un déploiement de modèle dans la région East US 2 échoue. L'erreur indique que la version de modèle demandée n'est pas disponible.

    Avant de mettre à jour les paramètres de nom et de version du modèle, vous devez lister les modèles disponibles dans East US 2.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "az cognitiveservices account list-kinds" }
    - { id: b, text: "az cognitiveservices account list-skus --kind AIServices --location eastus2" }
    - { id: c, text: "az cognitiveservices account list-usage --name foundry-cts --resource-group rg-ai" }
    - { id: d, text: "az cognitiveservices model list --location eastus2" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `az cognitiveservices model list --location` returns the models available in a region; you can add a JMESPath query such as `[?model.lifecycleStatus=='GenerallyAvailable']` to keep only generally available models. Microsoft's Bicep quickstart suggests this command to troubleshoot model availability.
    fr: |
      `az cognitiveservices model list --location` renvoie les modèles disponibles dans une région ; vous pouvez ajouter une requête JMESPath comme `[?model.lifecycleStatus=='GenerallyAvailable']` pour ne conserver que les modèles en disponibilité générale. Le guide de démarrage rapide Bicep de Microsoft propose cette commande pour diagnostiquer la disponibilité des modèles.
  options:
    a:
      en: |
        `list-kinds` lists the valid account kinds, such as AIServices, not models.
      fr: |
        `list-kinds` liste les types de comptes valides, comme AIServices, pas les modèles.
    b:
      en: |
        `list-skus` lists the account SKUs available for a kind and a location, not model versions.
      fr: |
        `list-skus` liste les SKU de compte disponibles pour un type et un emplacement, pas les versions de modèles.
    c:
      en: |
        `list-usage` shows the usage of an existing account, not the models offered in the region.
      fr: |
        `list-usage` affiche l'utilisation d'un compte existant, pas les modèles proposés dans la région.
references:
  - title: "Quickstart: Deploy a Foundry resource by using Bicep"
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-resource-template
  - title: az cognitiveservices account
    url: https://learn.microsoft.com/en-us/cli/azure/cognitiveservices/account
