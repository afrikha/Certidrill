id: ai300-3b-ptu-side-by-side-order
objective: "3.2.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a Data Zone Provisioned deployment named **support-ptu** that runs gpt-4.1. The team wants to move the support application to gpt-5.1 by using a side-by-side (multi-deployment) migration, so that it can validate the new deployment before it receives production traffic.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose d'un déploiement Data Zone Provisioned nommé **support-ptu** qui exécute gpt-4.1. L'équipe souhaite faire passer l'application de support à gpt-5.1 par une migration côte à côte (plusieurs déploiements), afin de valider le nouveau déploiement avant qu'il ne reçoive le trafic de production.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: quota, text: { en: "Confirm that PTU quota and capacity are available for gpt-5.1 in the region.", fr: "Confirmer que le quota de PTU et la capacité sont disponibles pour gpt-5.1 dans la région." } }
    - { id: create, text: { en: "Create a Data Zone Provisioned deployment of gpt-5.1.", fr: "Créer un déploiement Data Zone Provisioned de gpt-5.1." } }
    - { id: app, text: { en: "Update the application to send requests to the new deployment name.", fr: "Mettre à jour l'application pour qu'elle envoie les requêtes au nouveau nom de déploiement." } }
    - { id: check, text: { en: "Use the Azure OpenAI Requests metric to confirm that support-ptu has received no requests for 5 to 10 minutes.", fr: "Utiliser la métrique Azure OpenAI Requests pour confirmer que support-ptu n'a reçu aucune requête pendant 5 à 10 minutes." } }
    - { id: delete, text: { en: "Delete support-ptu.", fr: "Supprimer support-ptu." } }
    - { id: reserve, text: { en: "Purchase a new Azure Reservation for the gpt-5.1 PTUs.", fr: "Acheter une nouvelle réservation Azure pour les PTU de gpt-5.1." } }
    - { id: upgrade, text: { en: "Set the version upgrade option of support-ptu to OnceCurrentVersionExpired.", fr: "Définir l'option de mise à niveau de version de support-ptu sur OnceCurrentVersionExpired." } }
answer:
  sequence: [ quota, create, app, check, delete ]
explanation:
  correct:
    en: |
      A side-by-side migration starts by validating quota and capacity, then creates a new provisioned deployment of the same deployment type. After testing, you move traffic to it, check with the Azure OpenAI Requests metric that the original deployment has had no requests for 5 to 10 minutes, and delete the original deployment to stop its hourly billing.
    fr: |
      Une migration côte à côte commence par la validation du quota et de la capacité, puis crée un nouveau déploiement provisionné du même type de déploiement. Après les tests, vous y basculez le trafic, vérifiez avec la métrique Azure OpenAI Requests que le déploiement d'origine n'a reçu aucune requête pendant 5 à 10 minutes, puis supprimez le déploiement d'origine pour arrêter sa facturation horaire.
  options:
    reserve:
      en: |
        Reservations match by deployment type, region and scope, not by model, so a model change doesn't require a new reservation.
      fr: |
        Les réservations correspondent par type de déploiement, région et étendue, pas par modèle : un changement de modèle n'exige pas de nouvelle réservation.
    upgrade:
      en: |
        Provisioned deployments aren't upgraded automatically, and a version upgrade option can't change the model family.
      fr: |
        Les déploiements provisionnés ne sont pas mis à niveau automatiquement, et une option de mise à niveau de version ne peut pas changer de famille de modèles.
references:
  - title: Azure OpenAI in Microsoft Foundry Models working with models
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/working-with-models
  - title: Provisioned throughput billing and cost management
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput-billing
