id: ai300-3a-private-dns-zones
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso creates a private endpoint for a Foundry resource named **foundry-ctso** in a virtual network that uses Azure-provided DNS. Applications in the virtual network call foundry-ctso only through these endpoints:

    - `https://foundry-ctso.openai.azure.com`
    - `https://foundry-ctso.services.ai.azure.com`

    You need to create the private DNS zones that let the applications resolve both host names to the private endpoint.

    Which two private DNS zones should you create? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso crée un point de terminaison privé pour une ressource Foundry nommée **foundry-ctso** dans un réseau virtuel qui utilise le DNS fourni par Azure. Les applications du réseau virtuel appellent foundry-ctso uniquement par ces points de terminaison :

    - `https://foundry-ctso.openai.azure.com`
    - `https://foundry-ctso.services.ai.azure.com`

    Vous devez créer les zones DNS privées qui permettent aux applications de résoudre les deux noms d'hôte vers le point de terminaison privé.

    Quelles sont les deux zones DNS privées à créer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: privatelink.api.azureml.ms }
    - { id: b, text: privatelink.openai.azure.com }
    - { id: c, text: privatelink.search.windows.net }
    - { id: d, text: privatelink.services.ai.azure.com }
    - { id: e, text: privatelink.vaultcore.azure.net }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A Foundry resource can expose the `cognitiveservices.azure.com`, `openai.azure.com` and `services.ai.azure.com` endpoints, and each one needs the matching private DNS zone. The applications use the last two, so you need `privatelink.openai.azure.com` and `privatelink.services.ai.azure.com`.
    fr: |
      Une ressource Foundry peut exposer les points de terminaison `cognitiveservices.azure.com`, `openai.azure.com` et `services.ai.azure.com`, et chacun nécessite la zone DNS privée correspondante. Les applications utilisent les deux derniers : il faut donc `privatelink.openai.azure.com` et `privatelink.services.ai.azure.com`.
  options:
    a:
      en: |
        `privatelink.api.azureml.ms` is the zone of Azure Machine Learning workspaces.
      fr: |
        `privatelink.api.azureml.ms` est la zone des espaces de travail Azure Machine Learning.
    c:
      en: |
        `privatelink.search.windows.net` is the zone of Azure AI Search.
      fr: |
        `privatelink.search.windows.net` est la zone d'Azure AI Search.
    e:
      en: |
        `privatelink.vaultcore.azure.net` is the zone of Azure Key Vault.
      fr: |
        `privatelink.vaultcore.azure.net` est la zone d'Azure Key Vault.
references:
  - title: Azure Private Endpoint private DNS zone values
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
