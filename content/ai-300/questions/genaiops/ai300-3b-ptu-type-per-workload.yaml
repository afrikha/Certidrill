id: ai300-3b-ptu-type-per-workload
objective: "3.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso is planning the deployments of four workloads in Microsoft Foundry.

    Which deployment type should you use for each workload? To answer, drag the appropriate SKU names to the correct workloads. Each SKU name may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso planifie les déploiements de quatre charges de travail dans Microsoft Foundry.

    Quel type de déploiement devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les noms de SKU appropriés vers les charges de travail correspondantes. Chaque nom de SKU peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: gp, text: GlobalProvisionedManaged }
    - { id: dzp, text: DataZoneProvisionedManaged }
    - { id: rp, text: ProvisionedManaged }
    - { id: gs, text: GlobalStandard }
    - { id: gb, text: GlobalBatch }
  targets:
    - { id: t1, text: { en: "Consistent high volume, no data residency constraint, highest availability", fr: "Volume élevé et régulier, aucune contrainte de résidence des données, disponibilité maximale" } }
    - { id: t2, text: { en: "Consistent high volume, data must stay within the EU data zone", fr: "Volume élevé et régulier, les données doivent rester dans la zone de données UE" } }
    - { id: t3, text: { en: "Consistent high volume, strict single-region data residency", fr: "Volume élevé et régulier, résidence stricte des données dans une seule région" } }
    - { id: t4, text: { en: "Variable, bursty real-time traffic at low volume, no data residency constraint", fr: "Trafic en temps réel variable, en rafales et à faible volume, aucune contrainte de résidence des données" } }
answer:
  mapping: { t1: gp, t2: dzp, t3: rp, t4: gs }
explanation:
  correct:
    en: |
      Provisioned types suit consistent high volume and low latency variance. Global Provisioned routes across regions for the highest availability, Data Zone Provisioned keeps data in a zone such as the EU, and Regional Provisioned (ProvisionedManaged) serves strict single-region residency. Bursty, low-volume traffic is cheaper on a pay-per-token type such as Global Standard.
    fr: |
      Les types provisionnés conviennent à un volume élevé et régulier et à une faible variance de latence. Global Provisioned achemine entre les régions pour une disponibilité maximale, Data Zone Provisioned conserve les données dans une zone comme l'UE, et Regional Provisioned (ProvisionedManaged) répond à une résidence stricte dans une seule région. Un trafic en rafales à faible volume coûte moins cher sur un type facturé au jeton comme Global Standard.
  options:
    gb: { en: "Global Batch is for large asynchronous jobs that aren't time-sensitive, not real-time traffic.", fr: "Global Batch est destiné aux travaux asynchrones volumineux non urgents, pas au trafic en temps réel." }
references:
  - title: Provisioned throughput for Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/provisioned-throughput
  - title: Understanding deployment types in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
