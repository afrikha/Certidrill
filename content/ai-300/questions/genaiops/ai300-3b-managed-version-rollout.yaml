id: ai300-3b-managed-version-rollout
objective: "3.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware has a managed online endpoint named **ep-summarize** in a hub-based project. Its only deployment, **blue**, runs version 7 of a catalog model on managed compute and receives 100 % of the traffic.

    You need to move the endpoint to version 8 of the model. The scoring URI must not change, the new version must be tested before it receives any client traffic, and then it must receive 10 % of the traffic before taking all of it. Finally, the old deployment must be removed.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware dispose d'un point de terminaison en ligne managé nommé **ep-summarize** dans un projet basé sur un hub. Son unique déploiement, **blue**, exécute la version 7 d'un modèle du catalogue sur un calcul managé et reçoit 100 % du trafic.

    Vous devez faire passer le point de terminaison à la version 8 du modèle. L'URI de scoring ne doit pas changer, la nouvelle version doit être testée avant de recevoir le moindre trafic client, puis elle doit recevoir 10 % du trafic avant de le prendre en totalité. Enfin, l'ancien déploiement doit être supprimé.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: green, text: { en: "Create a deployment named green in ep-summarize that references version 8 of the model.", fr: "Créer dans ep-summarize un déploiement nommé green qui référence la version 8 du modèle." } }
    - { id: test, text: { en: "Run `az ml online-endpoint invoke` with `--deployment-name green`.", fr: "Exécuter `az ml online-endpoint invoke` avec `--deployment-name green`." } }
    - { id: ten, text: { en: "Run `az ml online-endpoint update` with `--traffic \"blue=90 green=10\"`.", fr: "Exécuter `az ml online-endpoint update` avec `--traffic \"blue=90 green=10\"`." } }
    - { id: all, text: { en: "Run `az ml online-endpoint update` with `--traffic \"blue=0 green=100\"`.", fr: "Exécuter `az ml online-endpoint update` avec `--traffic \"blue=0 green=100\"`." } }
    - { id: del, text: { en: "Delete the blue deployment.", fr: "Supprimer le déploiement blue." } }
    - { id: newep, text: { en: "Create a new managed online endpoint for version 8.", fr: "Créer un nouveau point de terminaison en ligne managé pour la version 8." } }
    - { id: mirror, text: { en: "Run `az ml online-endpoint update` with `--mirror-traffic \"green=100\"`.", fr: "Exécuter `az ml online-endpoint update` avec `--mirror-traffic \"green=100\"`." } }
answer:
  sequence: [ green, test, ten, all, del ]
explanation:
  correct:
    en: |
      A new deployment added to the same endpoint receives no traffic until you allocate some, so you can invoke it directly with --deployment-name. You then shift 10 % of the live traffic with --traffic, move all of it to green once it behaves well, and delete blue. The endpoint, and therefore its scoring URI, never changes.
    fr: |
      Un nouveau déploiement ajouté au même point de terminaison ne reçoit aucun trafic tant que vous ne lui en attribuez pas : vous pouvez l'appeler directement avec --deployment-name. Vous basculez ensuite 10 % du trafic réel avec --traffic, puis la totalité vers green lorsqu'il se comporte correctement, et vous supprimez blue. Le point de terminaison, et donc son URI de scoring, ne change jamais.
  options:
    newep:
      en: |
        A new endpoint has a different scoring URI, which breaks the requirement.
      fr: |
        Un nouveau point de terminaison a un URI de scoring différent, ce qui enfreint l'exigence.
    mirror:
      en: |
        Mirrored traffic is limited to 50 %, and mirroring sends copies whose responses aren't returned to clients; it doesn't move live traffic.
      fr: |
        Le trafic mis en miroir est limité à 50 %, et la mise en miroir envoie des copies dont les réponses ne sont pas renvoyées aux clients ; elle ne déplace pas le trafic réel.
references:
  - title: Safe rollout for online endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
