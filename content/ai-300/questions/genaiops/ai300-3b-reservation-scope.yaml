id: ai300-3b-reservation-scope
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has two subscriptions in a management group named **mg-prod**:

    | Subscription | Deployment type | Region | PTUs |
    | --- | --- | --- | --- |
    | sub-prod1 | Global Provisioned | East US 2 | 100 |
    | sub-prod2 | Global Provisioned | Sweden Central | 150 |

    Both deployments run steady production traffic. You need to apply a one-year Azure Reservation discount to all these PTUs by purchasing the fewest reservations.

    What should you purchase?
  fr: |
    Woodgrove Bank dispose de deux abonnements dans un groupe d'administration nommé **mg-prod** :

    | Abonnement | Type de déploiement | Région | PTU |
    | --- | --- | --- | --- |
    | sub-prod1 | Global Provisioned | East US 2 | 100 |
    | sub-prod2 | Global Provisioned | Sweden Central | 150 |

    Les deux déploiements reçoivent un trafic de production régulier. Vous devez appliquer la remise d'une réservation Azure d'un an à toutes ces PTU en achetant le moins de réservations possible.

    Que devez-vous acheter ?
body:
  options:
    - { id: a, text: { en: "Two Global Provisioned reservations, one per region, each scoped to its subscription", fr: "Deux réservations Global Provisioned, une par région, chacune limitée à son abonnement" } }
    - { id: b, text: { en: "One Data Zone Provisioned reservation of 250 PTUs scoped to mg-prod", fr: "Une réservation Data Zone Provisioned de 250 PTU dont l'étendue est mg-prod" } }
    - { id: c, text: { en: "One Global Provisioned reservation of 250 PTUs scoped to mg-prod", fr: "Une réservation Global Provisioned de 250 PTU dont l'étendue est mg-prod" } }
    - { id: d, text: { en: "One Regional Provisioned reservation of 250 PTUs in East US 2 scoped to mg-prod", fr: "Une réservation Regional Provisioned de 250 PTU dans East US 2 dont l'étendue est mg-prod" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Reservations are purchased per deployment type. Global reservations aren't region-specific, so one Global reservation covers Global deployments in several regions. Its scope can be a group of subscriptions in a management group, so a single 250-PTU reservation scoped to mg-prod covers both deployments.
    fr: |
      Les réservations s'achètent par type de déploiement. Les réservations Global ne sont pas liées à une région : une seule réservation Global couvre des déploiements Global dans plusieurs régions. Son étendue peut être un groupe d'abonnements d'un groupe d'administration : une seule réservation de 250 PTU dont l'étendue est mg-prod couvre donc les deux déploiements.
  options:
    a: { en: "Two reservations work, but one Global reservation is enough because Global reservations span regions and the scope can cover both subscriptions.", fr: "Deux réservations fonctionnent, mais une seule réservation Global suffit, car les réservations Global couvrent plusieurs régions et l'étendue peut englober les deux abonnements." }
    b: { en: "Global, Data Zone and Regional reservations aren't interchangeable; a Data Zone reservation doesn't match Global deployments.", fr: "Les réservations Global, Data Zone et Regional ne sont pas interchangeables ; une réservation Data Zone ne correspond pas à des déploiements Global." }
    d: { en: "A Regional reservation matches only Regional Provisioned deployments in its region.", fr: "Une réservation Regional ne correspond qu'aux déploiements Regional Provisioned de sa région." }
references:
  - title: Provisioned throughput billing and cost management
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput-billing
