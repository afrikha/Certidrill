id: ai300-3c-table-tokens
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is designing a prompt for a GPT chat model in Microsoft Foundry. The prompt must include a product catalog of 300 rows, each with the same five fields (SKU, name, category, price and stock), as supporting content for answering sales questions.

    You need to pass the catalog in a way that keeps the structure clear to the model and minimizes the number of input tokens.

    How should you format the catalog?
  fr: |
    Tailspin Toys conçoit une invite pour un modèle de conversation GPT dans Microsoft Foundry. L'invite doit inclure un catalogue de 300 lignes, chacune avec les mêmes cinq champs (SKU, nom, catégorie, prix et stock), comme contenu de support pour répondre aux questions commerciales.

    Vous devez transmettre le catalogue de façon à garder la structure claire pour le modèle tout en réduisant au minimum le nombre de jetons d'entrée.

    Comment devez-vous mettre en forme le catalogue ?
body:
  options:
    - id: a
      text: { en: "As a table with one header row and one line per product", fr: "Sous forme de tableau avec une ligne d'en-tête et une ligne par produit" }
    - id: b
      text: { en: "As a JSON array with one object per product that repeats the field names", fr: "Sous forme de tableau JSON avec un objet par produit qui répète les noms de champs" }
    - id: c
      text: { en: "As 300 pairs of user and assistant messages, one pair per product", fr: "Sous forme de 300 paires de messages user et assistant, une paire par produit" }
    - id: d
      text: { en: "As a table whose columns are aligned by padding each value with spaces", fr: "Sous forme de tableau dont les colonnes sont alignées en complétant chaque valeur par des espaces" }
answer: { optionId: a }
explanation:
  correct:
    en: Microsoft's prompt engineering guidance notes that tables are a space-efficient way to pass structured data, because the field names appear once in the header instead of in every record as in JSON.
    fr: Les recommandations de Microsoft sur l'ingénierie d'invite indiquent que les tableaux sont un moyen économe en espace de transmettre des données structurées, car les noms de champs n'apparaissent qu'une fois dans l'en-tête au lieu de figurer dans chaque enregistrement comme en JSON.
  options:
    b:
      en: Repeating the five field names in 300 objects adds many tokens compared with a table.
      fr: Répéter les cinq noms de champs dans 300 objets ajoute de nombreux jetons par rapport à un tableau.
    c:
      en: User and assistant pairs are meant for few-shot examples of a task; they add role overhead and do not present catalog data compactly.
      fr: Les paires user et assistant servent aux exemples few-shot d'une tâche ; elles ajoutent une surcharge de rôles et ne présentent pas les données du catalogue de façon compacte.
    d:
      en: Consecutive spaces are counted as separate tokens, so padding for alignment wastes tokens.
      fr: "Les espaces consécutifs comptent comme des jetons distincts : compléter par des espaces pour aligner gaspille des jetons."
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
