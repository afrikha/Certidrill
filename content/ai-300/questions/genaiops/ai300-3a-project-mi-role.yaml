id: ai300-3a-project-mi-role
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You create a Foundry resource named **foundry-tsp** and a project named **proj-tsp** by using the Azure CLI. proj-tsp has a system-assigned managed identity.

    You need to give the managed identity of proj-tsp the minimum role assignment that Microsoft recommends to get started with Foundry features.

    What should you do?
  fr: |
    Vous créez une ressource Foundry nommée **foundry-tsp** et un projet nommé **proj-tsp** à l'aide d'Azure CLI. proj-tsp possède une identité managée affectée par le système.

    Vous devez donner à l'identité managée de proj-tsp l'attribution de rôle minimale recommandée par Microsoft pour commencer à utiliser les fonctionnalités de Foundry.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign Foundry Owner on proj-tsp to the managed identity.", fr: "Attribuer Foundry Owner sur proj-tsp à l'identité managée." } }
    - { id: b, text: { en: "Assign Contributor on the resource group to the managed identity.", fr: "Attribuer Contributor sur le groupe de ressources à l'identité managée." } }
    - { id: c, text: { en: "Assign Foundry Agent Consumer on proj-tsp to the managed identity.", fr: "Attribuer Foundry Agent Consumer sur proj-tsp à l'identité managée." } }
    - { id: d, text: { en: "Assign Foundry User on foundry-tsp to the managed identity.", fr: "Attribuer Foundry User sur foundry-tsp à l'identité managée." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Microsoft's minimum assignments are Foundry User on the Foundry resource for your user principal and for the project's managed identity. The Foundry portal adds them automatically when a user who can assign roles creates the project in the portal, but not when the project is created with the SDK or the CLI.
    fr: |
      Les attributions minimales recommandées par Microsoft sont Foundry User sur la ressource Foundry pour votre principal d'utilisateur et pour l'identité managée du projet. Le portail Foundry les ajoute automatiquement lorsqu'un utilisateur autorisé à attribuer des rôles crée le projet dans le portail, mais pas lorsque le projet est créé avec le SDK ou la CLI.
  options:
    a:
      en: |
        Foundry Owner is a highly privileged role, far beyond the minimum assignment.
      fr: |
        Foundry Owner est un rôle à privilèges élevés, bien au-delà de l'attribution minimale.
    b:
      en: |
        Contributor grants control plane permissions on the whole resource group but no data actions in the project.
      fr: |
        Contributor accorde des autorisations du plan de contrôle sur tout le groupe de ressources, mais aucune action de données dans le projet.
    c:
      en: |
        Foundry Agent Consumer only allows calling agent endpoints; it isn't the documented minimum for the project's managed identity.
      fr: |
        Foundry Agent Consumer permet seulement d'appeler les points de terminaison des agents ; ce n'est pas l'attribution minimale documentée pour l'identité managée du projet.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
