id: ai300-3b-selection-tools
objective: "3.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum is choosing and deploying models in a Microsoft Foundry project for several workloads.

    Which option should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum choisit et déploie des modèles dans un projet Microsoft Foundry pour plusieurs charges de travail.

    Quelle option devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lb, text: { en: "Model leaderboard", fr: "Classement des modèles" } }
    - { id: ev, text: { en: "Evaluation on your own dataset", fr: "Évaluation sur votre propre jeu de données" } }
    - { id: mr, text: { en: "Model router deployment", fr: "Déploiement du routeur de modèles" } }
    - { id: gb, text: { en: "Global Batch deployment", fr: "Déploiement Global Batch" } }
    - { id: gp, text: { en: "Global Provisioned deployment", fr: "Déploiement Global Provisioned" } }
  targets:
    - { id: t1, text: { en: "Compare public quality and throughput benchmarks of three candidate models", fr: "Comparer les benchmarks publics de qualité et de débit de trois modèles candidats" } }
    - { id: t2, text: { en: "Confirm that a shortlisted model answers the company's own test questions well", fr: "Confirmer qu'un modèle présélectionné répond bien aux propres questions de test de l'entreprise" } }
    - { id: t3, text: { en: "Send each prompt automatically to the most cost-effective model that keeps comparable quality", fr: "Envoyer automatiquement chaque invite au modèle le plus économique qui conserve une qualité comparable" } }
    - { id: t4, text: { en: "Summarize five million archived tickets asynchronously at the lowest token price", fr: "Résumer cinq millions de tickets archivés de manière asynchrone au prix par jeton le plus bas" } }
answer:
  mapping: { t1: lb, t2: ev, t3: mr, t4: gb }
explanation:
  correct:
    en: |
      The model leaderboard compares up to three models on industry benchmarks for quality, safety, cost and throughput. Public benchmarks may not reflect your data, so you confirm the choice with an evaluation on your own dataset. Model router routes each prompt in real time to a suitable underlying model to lower cost at comparable quality. Global Batch costs 50 % less than Global Standard for asynchronous jobs that target completion within 24 hours.
    fr: |
      Le classement des modèles compare jusqu'à trois modèles sur des benchmarks du secteur pour la qualité, la sécurité, le coût et le débit. Les benchmarks publics peuvent ne pas refléter vos données : vous confirmez donc le choix par une évaluation sur votre propre jeu de données. Le routeur de modèles achemine chaque invite en temps réel vers un modèle sous-jacent adapté pour réduire le coût à qualité comparable. Global Batch coûte 50 % de moins que Global Standard pour des travaux asynchrones dont l'achèvement est visé sous 24 heures.
  options:
    gp: { en: "Global Provisioned reserves throughput for consistent high-volume real-time traffic and is billed per PTU per hour, not the cheapest option for a one-off asynchronous job.", fr: "Global Provisioned réserve du débit pour un trafic en temps réel régulier et volumineux, et il est facturé par PTU et par heure : ce n'est pas l'option la moins chère pour un travail asynchrone ponctuel." }
references:
  - title: Model benchmarks and leaderboards in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/model-benchmarks
  - title: Understanding deployment types in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
