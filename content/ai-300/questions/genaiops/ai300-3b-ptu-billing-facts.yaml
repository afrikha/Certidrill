id: ai300-3b-ptu-billing-facts
objective: "3.2.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Proseware uses hourly billing for a Data Zone Provisioned deployment during a two-day product launch, and it has a one-year reservation for its other provisioned deployments.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware utilise la facturation horaire pour un déploiement Data Zone Provisioned pendant le lancement d'un produit sur deux jours, et dispose d'une réservation d'un an pour ses autres déploiements provisionnés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can pause the launch deployment overnight to stop its hourly billing.
        fr: |
          Vous pouvez mettre en pause le déploiement du lancement pendant la nuit pour arrêter sa facturation horaire.
    - id: s2
      text:
        en: |
          A deployment that exists for 15 minutes is charged a quarter of the hourly rate for its PTUs.
        fr: |
          Un déploiement qui existe pendant 15 minutes est facturé un quart du tarif horaire de ses PTU.
    - id: s3
      text:
        en: |
          Deleting a provisioned deployment also cancels the reservation that covered it.
        fr: |
          La suppression d'un déploiement provisionné annule aussi la réservation qui le couvrait.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Provisioned deployments can't be paused; hourly billing stops only when the deployment is deleted. Partial hours are prorated, so 15 minutes cost a quarter of the hourly rate. Reservations and deployments are independent; deleting a deployment leaves the reservation active (and unused), and cancelling a reservation may incur an early termination fee.
    fr: |
      Les déploiements provisionnés ne peuvent pas être mis en pause ; la facturation horaire ne s'arrête qu'à la suppression du déploiement. Les heures partielles sont calculées au prorata : 15 minutes coûtent un quart du tarif horaire. Réservations et déploiements sont indépendants ; supprimer un déploiement laisse la réservation active (et inutilisée), et l'annulation d'une réservation peut entraîner des frais de résiliation anticipée.
references:
  - title: Provisioned throughput billing and cost management
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput-billing
