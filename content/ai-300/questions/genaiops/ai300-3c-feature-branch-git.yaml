id: ai300-3c-feature-branch-git
objective: "3.3.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank keeps the prompts of its support agent in a GitHub repository. You are changing the greeting prompt. You must:

    - start a new branch from the latest version of main on GitHub;
    - after the pull request is merged, mark the merge commit with an annotated tag and publish the tag to GitHub.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank conserve les invites de son agent de support dans un dépôt GitHub. Vous modifiez l'invite d'accueil. Vous devez :

    - démarrer une nouvelle branche à partir de la dernière version de main sur GitHub ;
    - une fois la demande de tirage fusionnée, marquer le commit de fusion avec une balise annotée et publier la balise sur GitHub.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    git checkout main
    git [[sync]] origin main
    git checkout [[new]] feature/shorter-greeting
    # edit src/agents/support_agent/prompts/v3_greeting.txt and test it
    git add src/agents/support_agent/prompts/v3_greeting.txt
    git commit -m "Shorten support greeting"
    git push -u origin feature/shorter-greeting

    # after the pull request is merged, on an up-to-date main branch
    git tag [[ann]] v3-greeting -m "Support greeting v3"
    git push origin [[pub]]
  slots:
    - id: sync
      options:
        - { id: pull, text: pull }
        - { id: fetch, text: fetch }
        - { id: clone, text: clone }
        - { id: stash, text: stash }
    - id: new
      options:
        - { id: b, text: "-b" }
        - { id: t, text: "-t" }
        - { id: detach, text: "--detach" }
        - { id: orphan, text: "--orphan" }
    - id: ann
      options:
        - { id: a, text: "-a" }
        - { id: d, text: "-d" }
        - { id: l, text: "-l" }
        - { id: f, text: "-f" }
    - id: pub
      options:
        - { id: tags, text: "--tags" }
        - { id: all, text: "--all" }
        - { id: mirror, text: "--mirror" }
        - { id: force, text: "--force" }
answer:
  values: { sync: pull, new: b, ann: a, pub: tags }
explanation:
  correct:
    en: git pull origin main updates the local main branch with the latest commits from GitHub, and git checkout -b creates the feature branch from it. git tag -a creates an annotated tag with the message given by -m, and git push origin --tags publishes the tags, which a plain push of a branch doesn't do.
    fr: git pull origin main met à jour la branche main locale avec les derniers commits de GitHub, et git checkout -b crée la branche de fonctionnalité à partir de celle-ci. git tag -a crée une balise annotée avec le message fourni par -m, et git push origin --tags publie les balises, ce que ne fait pas un simple push de branche.
  options:
    fetch:
      en: git fetch downloads the commits but doesn't update the local main branch, so the new branch would start from an outdated commit.
      fr: "git fetch télécharge les commits sans mettre à jour la branche main locale : la nouvelle branche partirait d'un commit obsolète."
    orphan:
      en: --orphan creates a branch with no history, unrelated to main.
      fr: --orphan crée une branche sans historique, sans lien avec main.
    d:
      en: -d deletes a tag instead of creating one.
      fr: -d supprime une balise au lieu d'en créer une.
    all:
      en: --all pushes all branches, not tags.
      fr: --all pousse toutes les branches, pas les balises.
references:
  - title: Develop safe prompt deployment workflows
    url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/5-prompt-workflow-development
