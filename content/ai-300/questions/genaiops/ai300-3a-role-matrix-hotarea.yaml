id: ai300-3a-role-matrix-hotarea
objective: "3.1.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a Foundry resource named **foundry-nwd** in a resource group named **rg-ai**. The resource contains a project named **proj-ops**. The following table shows the role assignments of five users.

    Answer each prompt by selecting the user who has the described permissions.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'une ressource Foundry nommée **foundry-nwd** dans un groupe de ressources nommé **rg-ai**. La ressource contient un projet nommé **proj-ops**. Le tableau suivant présente les attributions de rôles de cinq utilisateurs.

    Répondez à chaque consigne en sélectionnant l'utilisateur qui dispose des autorisations décrites.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The user who can publish agents", fr: "L'utilisateur qui peut publier des agents" }
    - id: p2
      text: { en: "The user who can assign the Foundry User role to others but can't build in a project", fr: "L'utilisateur qui peut attribuer le rôle Foundry User à d'autres personnes mais ne peut pas travailler dans un projet" }
  grid:
    header: [{ en: "User", fr: "Utilisateur" }, { en: "Role", fr: "Rôle" }, { en: "Scope", fr: "Étendue" }]
    rows:
      - [{ text: User1, area: u1 }, { text: Foundry User }, { text: proj-ops }]
      - [{ text: User2, area: u2 }, { text: Foundry Project Manager }, { text: foundry-nwd }]
      - [{ text: User3, area: u3 }, { text: Foundry Account Owner }, { text: foundry-nwd }]
      - [{ text: User4, area: u4 }, { text: Contributor }, { text: rg-ai }]
      - [{ text: User5, area: u5 }, { text: Reader }, { text: foundry-nwd }]
answer:
  values: { p1: u2, p2: u3 }
explanation:
  correct:
    en: |
      Publishing agents requires at least Foundry Project Manager on the Foundry resource scope, so User2 can publish; Foundry User, Foundry Account Owner, Contributor and Reader can't. Foundry Account Owner can assign the Foundry User, ACR and monitoring roles but has no data actions to build in projects. Contributor can't complete role assignments.
    fr: |
      La publication d'agents nécessite au minimum Foundry Project Manager à l'étendue de la ressource Foundry : User2 peut publier, alors que Foundry User, Foundry Account Owner, Contributor et Reader ne le peuvent pas. Foundry Account Owner peut attribuer les rôles Foundry User, ACR et de surveillance, mais n'a pas d'actions de données pour travailler dans les projets. Contributor ne peut pas effectuer d'attributions de rôles.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
