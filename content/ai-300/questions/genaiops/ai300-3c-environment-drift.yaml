id: ai300-3c-environment-drift
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has two Microsoft Foundry projects named **dev** and **prod**. Each contains an agent named **claims-agent** that is created by a script that reads the system instructions from a GitHub repository.

    An engineer fixed a tone issue by editing the instructions of the agent directly in the prod project in the Foundry portal. Two weeks later, the team deployed a new prompt version from the repository to both projects, and the tone issue came back in prod. You need to prevent this situation from happening again.

    What should you do?
  fr: |
    Litware dispose de deux projets Microsoft Foundry nommés **dev** et **prod**. Chacun contient un agent nommé **claims-agent** créé par un script qui lit les instructions système depuis un dépôt GitHub.

    Un ingénieur a corrigé un problème de ton en modifiant directement les instructions de l'agent dans le projet prod depuis le portail Foundry. Deux semaines plus tard, l'équipe a déployé une nouvelle version d'invite depuis le dépôt vers les deux projets, et le problème de ton est réapparu en prod. Vous devez empêcher que cette situation se reproduise.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Copy the instructions of the prod agent to the dev agent each time someone edits them in the portal.", fr: "Copier les instructions de l'agent prod vers l'agent dev chaque fois que quelqu'un les modifie dans le portail." }
    - id: b
      text: { en: "Require every prompt change to go through a pull request, and deploy both projects only from main.", fr: "Exiger que chaque modification d'invite passe par une demande de tirage, et déployer les deux projets uniquement depuis main." }
    - id: c
      text: { en: "Create the prod agent under a new agent name each time a fix is applied in the portal.", fr: "Créer l'agent prod sous un nouveau nom d'agent chaque fois qu'un correctif est appliqué dans le portail." }
    - id: d
      text: { en: "Deploy new prompt versions to the dev project only, and let engineers maintain prod in the portal.", fr: "Déployer les nouvelles versions d'invite uniquement dans le projet dev, et laisser les ingénieurs maintenir prod dans le portail." }
answer: { optionId: b }
explanation:
  correct:
    en: The portal edit was never committed, so the repository kept the old prompt and the next deployment overwrote the fix. Making the repository the single source of prompts, with reviewed pull requests and deployments from main to every environment, prevents environment drift and keeps a full audit trail.
    fr: "La modification dans le portail n'a jamais été validée dans le dépôt : celui-ci a conservé l'ancienne invite et le déploiement suivant a écrasé le correctif. Faire du dépôt l'unique source des invites, avec des demandes de tirage relues et des déploiements depuis main vers chaque environnement, empêche la dérive d'environnement et conserve une piste d'audit complète."
  options:
    a:
      en: Copying between projects keeps dev and prod aligned but leaves the repository out of date, so the next deployment still overwrites the fix.
      fr: "Copier entre projets aligne dev et prod mais laisse le dépôt obsolète : le déploiement suivant écrase toujours le correctif."
    c:
      en: A new agent name restarts version history and does not put the fix under version control.
      fr: Un nouveau nom d'agent redémarre l'historique des versions et ne place pas le correctif sous contrôle de version.
    d:
      en: Maintaining prod by hand is the source of the drift; prod would differ from what was tested in dev.
      fr: Maintenir prod à la main est la source de la dérive ; prod différerait de ce qui a été testé en dev.
references:
  - title: Apply version control to prompts
    url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/2-version-control-for-prompts
  - title: Develop safe prompt deployment workflows
    url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/5-prompt-workflow-development
