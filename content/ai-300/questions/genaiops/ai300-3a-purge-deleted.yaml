id: ai300-3a-purge-deleted
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso deleted a test Foundry resource named **foundry-test** in the East US region yesterday. The resource is in a soft-deleted state.

    Before you redeploy the test environment from Bicep, security policy requires that foundry-test and its data be permanently removed. You have the Contributor role on the subscription.

    Which command should you run?
  fr: |
    Contoso a supprimé hier une ressource Foundry de test nommée **foundry-test** dans la région East US. La ressource est à l'état supprimé de manière réversible.

    Avant de redéployer l'environnement de test à partir de Bicep, la stratégie de sécurité exige que foundry-test et ses données soient supprimées définitivement. Vous disposez du rôle Contributor sur l'abonnement.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "az cognitiveservices account recover --location eastus --name foundry-test --resource-group rg-test" }
    - { id: b, text: "az cognitiveservices account delete --name foundry-test --resource-group rg-test" }
    - { id: c, text: "az group delete --name rg-test" }
    - { id: d, text: "az cognitiveservices account purge --location eastus --name foundry-test --resource-group rg-test" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `az cognitiveservices account purge` permanently removes a soft-deleted account; you can list such accounts with `list-deleted`. Viewing and purging deleted Foundry accounts requires the Contributor role at the subscription scope.
    fr: |
      `az cognitiveservices account purge` supprime définitivement un compte supprimé de manière réversible ; vous pouvez lister ces comptes avec `list-deleted`. L'affichage et la purge des comptes Foundry supprimés nécessitent le rôle Contributor à l'étendue de l'abonnement.
  options:
    a:
      en: |
        `recover` restores the soft-deleted account instead of removing it.
      fr: |
        `recover` restaure le compte supprimé de manière réversible au lieu de le supprimer.
    b:
      en: |
        `delete` removes an existing account and leaves it soft-deleted; it doesn't purge an account that is already soft-deleted.
      fr: |
        `delete` supprime un compte existant en le laissant supprimé de manière réversible ; il ne purge pas un compte déjà supprimé de manière réversible.
    c:
      en: |
        `az group delete` deletes the resources that still exist in the group; it isn't the command that purges a soft-deleted account.
      fr: |
        `az group delete` supprime les ressources qui existent encore dans le groupe ; ce n'est pas la commande qui purge un compte supprimé de manière réversible.
references:
  - title: az cognitiveservices account
    url: https://learn.microsoft.com/en-us/cli/azure/cognitiveservices/account
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
