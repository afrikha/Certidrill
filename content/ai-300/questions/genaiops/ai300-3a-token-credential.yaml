id: ai300-3a-token-credential
objective: "3.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs a Python application in Azure Container Apps. The container app has a user-assigned managed identity whose client ID is stored in the `UAMI_CLIENT_ID` environment variable. The identity has the required role on the Foundry resource **foundry-pro**.

    The application must call a model deployment of foundry-pro by using Microsoft Entra ID. Microsoft recommends a deterministic credential instead of `DefaultAzureCredential` in production.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute une application Python dans Azure Container Apps. L'application conteneur possède une identité managée affectée par l'utilisateur dont l'ID client est stocké dans la variable d'environnement `UAMI_CLIENT_ID`. L'identité dispose du rôle nécessaire sur la ressource Foundry **foundry-pro**.

    L'application doit appeler un déploiement de modèle de foundry-pro avec Microsoft Entra ID. Microsoft recommande d'utiliser en production une information d'identification déterministe plutôt que `DefaultAzureCredential`.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import os
    from openai import OpenAI
    import azure.identity as identity

    credential = identity.[[cred]](client_id=os.environ["UAMI_CLIENT_ID"])
    token_provider = identity.get_bearer_token_provider(credential, [[scope]])

    client = OpenAI(
        base_url="https://foundry-pro.openai.azure.com/openai/v1/",
        api_key=[[key]],
    )
  slots:
    - id: cred
      options:
        - { id: mi, text: ManagedIdentityCredential }
        - { id: secret, text: ClientSecretCredential }
        - { id: browser, text: InteractiveBrowserCredential }
        - { id: cli, text: AzureCliCredential }
    - id: scope
      options:
        - { id: ai, text: "\"https://ai.azure.com/.default\"" }
        - { id: arm, text: "\"https://management.azure.com/.default\"" }
        - { id: graph, text: "\"https://graph.microsoft.com/.default\"" }
        - { id: kv, text: "\"https://vault.azure.net/.default\"" }
    - id: key
      options:
        - { id: tp, text: token_provider }
        - { id: credobj, text: credential }
        - { id: env, text: "os.environ[\"FOUNDRY_API_KEY\"]" }
        - { id: none, text: None }
answer:
  values: { cred: mi, scope: ai, key: tp }
explanation:
  correct:
    en: |
      `ManagedIdentityCredential` with the `client_id` of the user-assigned identity is a deterministic, secret-less credential for code running in Azure. Foundry accepts OAuth 2.0 bearer tokens for the `https://ai.azure.com/.default` scope, and the OpenAI client receives the token provider through its `api_key` parameter.
    fr: |
      `ManagedIdentityCredential` avec le `client_id` de l'identité affectée par l'utilisateur est une information d'identification déterministe et sans secret pour du code exécuté dans Azure. Foundry accepte des jetons du porteur OAuth 2.0 pour l'étendue `https://ai.azure.com/.default`, et le client OpenAI reçoit le fournisseur de jetons par son paramètre `api_key`.
  options:
    cred:
      en: |
        `ClientSecretCredential` needs a client secret, `InteractiveBrowserCredential` needs a signed-in user, and `AzureCliCredential` relies on a developer's Azure CLI session.
      fr: |
        `ClientSecretCredential` nécessite un secret client, `InteractiveBrowserCredential` un utilisateur connecté et `AzureCliCredential` la session Azure CLI d'un développeur.
    scope:
      en: |
        The Azure Resource Manager, Microsoft Graph and Key Vault scopes produce tokens with the wrong audience; Foundry returns 401.
      fr: |
        Les étendues d'Azure Resource Manager, de Microsoft Graph et de Key Vault produisent des jetons dont l'audience est incorrecte ; Foundry renvoie une erreur 401.
    key:
      en: |
        The credential object isn't an API key or a token provider, an API key read from the environment is a secret, and `None` sends no credential.
      fr: |
        L'objet d'information d'identification n'est ni une clé API ni un fournisseur de jetons, une clé API lue dans l'environnement est un secret, et `None` n'envoie aucune information d'identification.
references:
  - title: Configure keyless authentication with Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/configure-entra-id
  - title: Authentication and authorization in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/authentication-authorization-foundry
