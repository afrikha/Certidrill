id: ai300-3b-leaderboard-facts
objective: "3.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam's architects use the model leaderboards of the Microsoft Foundry portal to shortlist models for a document assistant.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les architectes de Fabrikam utilisent les classements de modèles du portail Microsoft Foundry pour présélectionner des modèles pour un assistant documentaire.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can select up to five models and compare them side by side.
        fr: |
          Vous pouvez sélectionner jusqu'à cinq modèles et les comparer côte à côte.
    - id: s2
      text:
        en: |
          The quality index averages accuracy scores across benchmark datasets, on a scale from 0 to 1 where higher is better.
        fr: |
          L'index de qualité fait la moyenne de scores de précision sur des jeux de données de benchmark, sur une échelle de 0 à 1 où une valeur plus élevée est meilleure.
    - id: s3
      text:
        en: |
          The throughput metric GTPS counts the output tokens generated per second from the time the request is sent.
        fr: |
          La métrique de débit GTPS compte les jetons de sortie générés par seconde à partir de l'envoi de la requête.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The leaderboard compares up to three models side by side. The quality index is the average of applicable accuracy scores (such as exact_match or pass@1) across benchmark datasets, from 0 to 1, higher being better. Generated tokens per second (GTPS) measures output tokens per second from the moment the request is sent; public benchmarks should then be confirmed with an evaluation on your own data.
    fr: |
      Le classement compare jusqu'à trois modèles côte à côte. L'index de qualité est la moyenne des scores de précision applicables (comme exact_match ou pass@1) sur les jeux de données de benchmark, de 0 à 1, une valeur plus élevée étant meilleure. Les jetons générés par seconde (GTPS) mesurent les jetons de sortie par seconde à partir de l'envoi de la requête ; les benchmarks publics doivent ensuite être confirmés par une évaluation sur vos propres données.
references:
  - title: Model benchmarks and leaderboards in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/model-benchmarks
  - title: Compare and select models using the model leaderboard in Foundry portal
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/benchmark-model-in-catalog
