id: ai300-3a-cmk-identity-order
objective: "3.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a key vault named **kv-fab** in the same region as its future Foundry resource. kv-fab uses the Azure RBAC permission model, has soft delete and purge protection enabled, and contains an RSA 3072-bit key named **foundry-key**.

    You must deploy a Foundry resource named **foundry-cmk** that uses customer-managed keys from kv-fab as soon as it's created. The solution must use a user-assigned managed identity.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'un coffre de clés nommé **kv-fab** dans la même région que sa future ressource Foundry. kv-fab utilise le modèle d'autorisation Azure RBAC, la suppression réversible et la protection contre le vidage y sont activées, et il contient une clé RSA de 3 072 bits nommée **foundry-key**.

    Vous devez déployer une ressource Foundry nommée **foundry-cmk** qui utilise des clés gérées par le client de kv-fab dès sa création. La solution doit utiliser une identité managée affectée par l'utilisateur.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: uami, text: { en: "Create a user-assigned managed identity.", fr: "Créer une identité managée affectée par l'utilisateur." } }
    - { id: role, text: { en: "Assign the Key Vault Crypto User role on kv-fab to the user-assigned identity.", fr: "Attribuer le rôle Key Vault Crypto User sur kv-fab à l'identité affectée par l'utilisateur." } }
    - { id: deploy, text: { en: "Deploy foundry-cmk with the user-assigned identity and encryption settings that reference foundry-key.", fr: "Déployer foundry-cmk avec l'identité affectée par l'utilisateur et des paramètres de chiffrement qui référencent foundry-key." } }
    - { id: smi, text: { en: "Assign the Key Vault Crypto User role on kv-fab to the system-assigned identity of foundry-cmk.", fr: "Attribuer le rôle Key Vault Crypto User sur kv-fab à l'identité affectée par le système de foundry-cmk." } }
    - { id: secrets, text: { en: "Assign the Key Vault Secrets User role on kv-fab to the user-assigned identity.", fr: "Attribuer le rôle Key Vault Secrets User sur kv-fab à l'identité affectée par l'utilisateur." } }
    - { id: purge, text: { en: "Disable purge protection on kv-fab.", fr: "Désactiver la protection contre le vidage sur kv-fab." } }
answer:
  sequence: [ uami, role, deploy ]
explanation:
  correct:
    en: |
      The managed identity must be able to access the key before customer-managed keys are enabled, otherwise the operation fails. With a user-assigned identity, you can create it and grant it Key Vault Crypto User before the Foundry resource exists, and then deploy the resource with CMK enabled at creation.
    fr: |
      L'identité managée doit pouvoir accéder à la clé avant l'activation des clés gérées par le client, sinon l'opération échoue. Avec une identité affectée par l'utilisateur, vous pouvez la créer et lui accorder Key Vault Crypto User avant que la ressource Foundry existe, puis déployer la ressource avec les clés gérées par le client activées dès la création.
  options:
    smi:
      en: |
        A system-assigned identity doesn't exist until the resource is provisioned, so it can't be granted access before creation.
      fr: |
        Une identité affectée par le système n'existe qu'après le provisionnement de la ressource : elle ne peut pas recevoir d'accès avant la création.
    secrets:
      en: |
        Key Vault Secrets User reads secrets; customer-managed keys need cryptographic operations on the key.
      fr: |
        Key Vault Secrets User lit des secrets ; les clés gérées par le client nécessitent des opérations de chiffrement sur la clé.
    purge:
      en: |
        Soft delete and purge protection are required on the key store for customer-managed keys.
      fr: |
        La suppression réversible et la protection contre le vidage sont requises sur le magasin de clés pour les clés gérées par le client.
references:
  - title: Configure customer-managed keys for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/encryption-keys-portal
