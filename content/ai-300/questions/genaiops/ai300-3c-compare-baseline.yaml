id: ai300-3c-compare-baseline
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Microsoft Foundry project that contains three completed evaluation runs named **eval-prompt-v1**, **eval-prompt-v2** and **eval-prompt-v3**. Each run evaluated a different version of a system prompt against the same dataset with the same evaluators. Version 1 is in production.

    You need a side-by-side view that shows how versions 2 and 3 deviate from version 1 on each metric, and whether each difference is statistically significant. The solution must minimize effort.

    What should you do?
  fr: |
    Contoso dispose d'un projet Microsoft Foundry qui contient trois exécutions d'évaluation terminées nommées **eval-prompt-v1**, **eval-prompt-v2** et **eval-prompt-v3**. Chaque exécution a évalué une version différente d'une invite système sur le même jeu de données avec les mêmes évaluateurs. La version 1 est en production.

    Vous avez besoin d'une vue côte à côte qui montre l'écart des versions 2 et 3 par rapport à la version 1 pour chaque métrique, et si chaque écart est statistiquement significatif. La solution doit réduire l'effort au minimum.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Download the dataset of each run as CSV and run t-tests on the scores in a notebook.", fr: "Télécharger le jeu de données de chaque exécution au format CSV et effectuer des tests t sur les scores dans un notebook." }
    - id: b
      text: { en: "Open the row-level details of each run and compare the score explanations of each query.", fr: "Ouvrir le détail ligne par ligne de chaque exécution et comparer les explications de score de chaque requête." }
    - id: c
      text: { en: "Select the three runs on the Evaluation page, select Compare, and set eval-prompt-v1 as the baseline.", fr: "Sélectionner les trois exécutions sur la page Evaluation, sélectionner Compare et définir eval-prompt-v1 comme référence." }
    - id: d
      text: { en: "Create a new evaluation run whose dataset contains the responses of the three prompt versions.", fr: "Créer une nouvelle exécution d'évaluation dont le jeu de données contient les réponses des trois versions d'invite." }
answer: { optionId: c }
explanation:
  correct:
    en: In the Foundry portal, you select two or more evaluation runs and select Compare to open a side-by-side view. You can set a baseline run, and the comparison uses statistical t-testing to label each cell (for example ImprovedStrong, DegradedWeak or Inconclusive) with its sample size and p-value.
    fr: Dans le portail Foundry, vous sélectionnez au moins deux exécutions d'évaluation puis Compare pour ouvrir une vue côte à côte. Vous pouvez définir une exécution de référence, et la comparaison utilise des tests t statistiques pour étiqueter chaque cellule (par exemple ImprovedStrong, DegradedWeak ou Inconclusive) avec la taille de l'échantillon et la valeur p.
  options:
    a:
      en: A manual statistical analysis gives the same information with much more effort.
      fr: Une analyse statistique manuelle fournit la même information avec beaucoup plus d'effort.
    b:
      en: Row-level details show individual scores but no aggregate comparison or significance test.
      fr: Le détail ligne par ligne montre des scores individuels, sans comparaison agrégée ni test de significativité.
    d:
      en: A single run mixing the three versions produces one set of metrics and loses the per-version comparison.
      fr: Une exécution unique mélangeant les trois versions produit un seul ensemble de métriques et perd la comparaison par version.
references:
  - title: See Evaluation Results in Microsoft Foundry portal
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluate-results
