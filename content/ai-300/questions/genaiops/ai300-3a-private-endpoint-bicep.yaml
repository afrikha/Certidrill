id: ai300-3a-private-endpoint-bicep
objective: "3.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Wingtip has a Foundry resource (symbolic name `foundry`) and a subnet for private endpoints (symbolic name `peSubnet`) in the same region. You add the following resource to a Bicep file to create a private endpoint for the Foundry resource.

    How should you complete the Bicep code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip dispose d'une ressource Foundry (nom symbolique `foundry`) et d'un sous-réseau pour les points de terminaison privés (nom symbolique `peSubnet`) dans la même région. Vous ajoutez la ressource suivante à un fichier Bicep pour créer un point de terminaison privé pour la ressource Foundry.

    Comment devez-vous compléter le code Bicep ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    resource pe 'Microsoft.Network/privateEndpoints@2024-05-01' = {
      name: 'pe-foundry-wingtip'
      location: location
      properties: {
        subnet: { id: peSubnet.id }
        privateLinkServiceConnections: [
          {
            name: 'foundry-connection'
            properties: {
              privateLinkServiceId: [[svc]]
              groupIds: [ [[grp]] ]
            }
          }
        ]
      }
    }
  slots:
    - id: svc
      options:
        - { id: id, text: foundry.id }
        - { id: endpoint, text: foundry.properties.endpoint }
        - { id: subnet, text: peSubnet.id }
        - { id: name, text: foundry.name }
    - id: grp
      options:
        - { id: account, text: "'account'" }
        - { id: aml, text: "'amlworkspace'" }
        - { id: search, text: "'searchService'" }
        - { id: blob, text: "'blob'" }
answer:
  values: { svc: id, grp: account }
explanation:
  correct:
    en: |
      `privateLinkServiceId` takes the resource ID of the target resource, here `foundry.id`. The private endpoint target sub-resource (group ID) of a Foundry resource (`Microsoft.CognitiveServices/accounts`) is `account`.
    fr: |
      `privateLinkServiceId` prend l'ID de ressource de la ressource cible, ici `foundry.id`. La sous-ressource cible (ID de groupe) du point de terminaison privé d'une ressource Foundry (`Microsoft.CognitiveServices/accounts`) est `account`.
  options:
    svc:
      en: |
        The endpoint URL and the resource name aren't resource IDs, and the subnet is where the private endpoint is placed, not its target.
      fr: |
        L'URL du point de terminaison et le nom de la ressource ne sont pas des ID de ressource, et le sous-réseau est l'emplacement du point de terminaison privé, pas sa cible.
    grp:
      en: |
        `amlworkspace`, `searchService` and `blob` are the sub-resources of Azure Machine Learning workspaces, Azure AI Search and Storage.
      fr: |
        `amlworkspace`, `searchService` et `blob` sont les sous-ressources des espaces de travail Azure Machine Learning, d'Azure AI Search et de Stockage.
references:
  - title: Azure Private Endpoint private DNS zone values
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
  - title: How to configure network isolation for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
