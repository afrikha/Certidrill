id: ai300-3b-finetuned-eval-tier
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso fine-tuned gpt-4.1-mini in a Microsoft Foundry project. Before deciding whether to use the fine-tuned model in production, the team wants to run an evaluation that takes a few hours.

    The evaluation deployment needs no SLA and no data residency guarantee. The solution must minimize cost.

    Which deployment type should you use for the evaluation?
  fr: |
    Contoso a affiné gpt-4.1-mini dans un projet Microsoft Foundry. Avant de décider d'utiliser le modèle affiné en production, l'équipe souhaite exécuter une évaluation de quelques heures.

    Le déploiement d'évaluation n'a besoin ni de contrat SLA ni de garantie de résidence des données. La solution doit réduire les coûts au minimum.

    Quel type de déploiement devez-vous utiliser pour l'évaluation ?
body:
  options:
    - { id: a, text: Standard }
    - { id: b, text: Global Provisioned }
    - { id: c, text: Developer }
    - { id: d, text: Data Zone Standard }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Developer deployment type (DeveloperTier) is designed for evaluating fine-tuned models. It has no hourly hosting fee, no SLA and no data residency guarantee, and the deployment is deleted automatically after its fixed 24-hour lifetime.
    fr: |
      Le type de déploiement Developer (DeveloperTier) est conçu pour évaluer des modèles affinés. Il n'a pas de frais d'hébergement horaires, ni contrat SLA ni garantie de résidence des données, et le déploiement est supprimé automatiquement à la fin de sa durée de vie fixe de 24 heures.
  options:
    a: { en: "A Standard deployment of a fine-tuned model adds hosting charges to the token price.", fr: "Un déploiement Standard d'un modèle affiné ajoute des frais d'hébergement au prix des jetons." }
    b: { en: "Global Provisioned bills reserved PTUs per hour, the most expensive option for a short test.", fr: "Global Provisioned facture des PTU réservées à l'heure, l'option la plus coûteuse pour un test court." }
    d: { en: "Data Zone Standard also adds fine-tuned hosting charges, and data residency isn't required.", fr: "Data Zone Standard ajoute aussi des frais d'hébergement du modèle affiné, et la résidence des données n'est pas requise." }
references:
  - title: Fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/fine-tuning-considerations
  - title: Understanding deployment types in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
