id: ai300-3a-bicep-child-resources
objective: "3.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware has an existing Foundry resource named **foundry-lwt**. You write a Bicep file that adds a project named **proj-docs** and a model deployment named **chat** that every project of foundry-lwt can use.

    How should you complete the Bicep code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'une ressource Foundry existante nommée **foundry-lwt**. Vous écrivez un fichier Bicep qui ajoute un projet nommé **proj-docs** et un déploiement de modèle nommé **chat** que tous les projets de foundry-lwt peuvent utiliser.

    Comment devez-vous compléter le code Bicep ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    resource foundry 'Microsoft.CognitiveServices/accounts@2026-07-01' existing = {
      name: 'foundry-lwt'
    }

    resource project [[ptype]] = {
      parent: foundry
      name: 'proj-docs'
      location: location
      identity: { type: 'SystemAssigned' }
      properties: { displayName: 'Documents' }
    }

    resource chat [[dtype]] = {
      parent: [[dparent]]
      name: 'chat'
      sku: { name: 'GlobalStandard', capacity: 50 }
      properties: {
        model: { format: 'OpenAI', name: modelName, version: modelVersion }
      }
    }
  slots:
    - id: ptype
      options:
        - { id: proj, text: "'Microsoft.CognitiveServices/accounts/projects@2026-07-01'" }
        - { id: aml, text: "'Microsoft.MachineLearningServices/workspaces@2024-10-01'" }
        - { id: dep, text: "'Microsoft.CognitiveServices/accounts/deployments@2026-05-01'" }
    - id: dtype
      options:
        - { id: dep, text: "'Microsoft.CognitiveServices/accounts/deployments@2026-05-01'" }
        - { id: online, text: "'Microsoft.MachineLearningServices/workspaces/onlineEndpoints/deployments@2024-10-01'" }
        - { id: proj, text: "'Microsoft.CognitiveServices/accounts/projects@2026-07-01'" }
    - id: dparent
      options:
        - { id: foundry, text: foundry }
        - { id: project, text: project }
        - { id: rg, text: resourceGroup() }
answer:
  values: { ptype: proj, dtype: dep, dparent: foundry }
explanation:
  correct:
    en: |
      A Foundry project is the child resource type `Microsoft.CognitiveServices/accounts/projects`. Model deployments are child resources of the Foundry resource itself (`Microsoft.CognitiveServices/accounts/deployments`), so their parent is `foundry` and they are shared by all the projects of the resource.
    fr: |
      Un projet Foundry est le type de ressource enfant `Microsoft.CognitiveServices/accounts/projects`. Les déploiements de modèles sont des ressources enfants de la ressource Foundry elle-même (`Microsoft.CognitiveServices/accounts/deployments`) : leur parent est `foundry` et ils sont partagés par tous les projets de la ressource.
  options:
    ptype:
      en: |
        `Microsoft.MachineLearningServices/workspaces` is the type of Azure Machine Learning workspaces and hubs, not of Foundry projects.
      fr: |
        `Microsoft.MachineLearningServices/workspaces` est le type des espaces de travail et des hubs Azure Machine Learning, pas des projets Foundry.
    dtype:
      en: |
        Online endpoint deployments belong to Azure Machine Learning workspaces; they aren't model deployments of a Foundry resource.
      fr: |
        Les déploiements de points de terminaison en ligne appartiennent aux espaces de travail Azure Machine Learning ; ce ne sont pas des déploiements de modèles d'une ressource Foundry.
    dparent:
      en: |
        A deployment isn't a child of a project, and `parent` takes the symbolic name of the parent resource, not a scope function.
      fr: |
        Un déploiement n'est pas un enfant d'un projet, et `parent` prend le nom symbolique de la ressource parente, pas une fonction d'étendue.
references:
  - title: Microsoft.CognitiveServices accounts/deployments
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.cognitiveservices/accounts/deployments
  - title: Microsoft.CognitiveServices accounts/projects
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.cognitiveservices/accounts/projects
