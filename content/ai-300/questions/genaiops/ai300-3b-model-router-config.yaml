id: ai300-3b-model-router-config
objective: "3.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware deploys model router in a Microsoft Foundry resource with a custom Global Standard deployment. The deployment must meet the following requirements:

    - Cost savings matter more than the last few percent of quality.
    - Prompts may be sent only to gpt-4.1, gpt-4o and gpt-5.4-mini, the models approved by the compliance team.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware déploie le routeur de modèles dans une ressource Microsoft Foundry avec un déploiement Global Standard personnalisé. Le déploiement doit répondre aux exigences suivantes :

    - Les économies comptent davantage que les derniers points de qualité.
    - Les invites ne doivent être envoyées qu'à gpt-4.1, gpt-4o et gpt-5.4-mini, les modèles approuvés par l'équipe de conformité.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the routing mode to Cost.", fr: "Définir le mode de routage sur Cost." } }
    - { id: b, text: { en: "Set the routing mode to Quality.", fr: "Définir le mode de routage sur Quality." } }
    - { id: c, text: { en: "Configure a model subset that contains only the approved models.", fr: "Configurer un sous-ensemble de modèles qui contient uniquement les modèles approuvés." } }
    - { id: d, text: { en: "Leave the routing mode unset so that the deployment uses Cost.", fr: "Ne pas définir le mode de routage pour que le déploiement utilise Cost." } }
    - { id: e, text: { en: "Redeploy the router as Global Provisioned to fix its model set.", fr: "Redéployer le routeur en Global Provisioned pour figer son ensemble de modèles." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The Cost mode considers a wider quality band (about 5 to 6 % of the best model) and picks the most cost-effective model in it. A model subset restricts routing to the models you list; new base models aren't added unless you include them.
    fr: |
      Le mode Cost prend en compte une plage de qualité plus large (environ 5 à 6 % du meilleur modèle) et choisit le modèle le plus économique de cette plage. Un sous-ensemble de modèles limite le routage aux modèles que vous indiquez ; les nouveaux modèles de base ne sont pas ajoutés tant que vous ne les incluez pas.
  options:
    b: { en: "Quality picks the highest-quality model for each prompt and ignores cost.", fr: "Quality choisit le modèle de meilleure qualité pour chaque invite et ignore le coût." }
    d: { en: "Without a routing mode, the deployment uses Balanced, which keeps a narrower quality range (about 1 to 2 %).", fr: "Sans mode de routage, le déploiement utilise Balanced, qui conserve une plage de qualité plus étroite (environ 1 à 2 %)." }
    e: { en: "Model router supports the Global Standard and Data Zone Standard deployment types, not provisioned types.", fr: "Le routeur de modèles prend en charge les types de déploiement Global Standard et Data Zone Standard, pas les types provisionnés." }
references:
  - title: Model router for Microsoft Foundry concepts
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-router
