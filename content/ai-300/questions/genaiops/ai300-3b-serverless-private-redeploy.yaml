id: ai300-3b-serverless-private-redeploy
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank created an Azure Machine Learning workspace named **mlw-risk** in 2025. The workspace contains a serverless deployment of a catalog model that the risk application has used for months.

    Last week, the security team disabled public network access on **mlw-risk** and created a private endpoint for it. Today, the serverless endpoint still accepts calls from the internet.

    You need the serverless endpoint to follow the network configuration of the workspace. What should you do?
  fr: |
    Woodgrove Bank a créé en 2025 un espace de travail Azure Machine Learning nommé **mlw-risk**. L'espace de travail contient un déploiement serverless d'un modèle du catalogue que l'application de gestion des risques utilise depuis des mois.

    La semaine dernière, l'équipe de sécurité a désactivé l'accès réseau public de **mlw-risk** et créé un point de terminaison privé pour celui-ci. Aujourd'hui, le point de terminaison serverless accepte toujours les appels provenant d'Internet.

    Vous devez faire en sorte que le point de terminaison serverless suive la configuration réseau de l'espace de travail. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Associate a network security group that denies internet traffic with the subnet of the private endpoint.", fr: "Associer au sous-réseau du point de terminaison privé un groupe de sécurité réseau qui refuse le trafic Internet." } }
    - { id: b, text: { en: "Set the managed network of the workspace to the Allow only approved outbound mode.", fr: "Configurer le réseau managé de l'espace de travail en mode Allow only approved outbound." } }
    - { id: c, text: { en: "Regenerate the keys of the serverless endpoint and store them in Azure Key Vault.", fr: "Régénérer les clés du point de terminaison serverless et les stocker dans Azure Key Vault." } }
    - { id: d, text: { en: "Delete the serverless deployment and deploy the model again.", fr: "Supprimer le déploiement serverless et déployer de nouveau le modèle." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Serverless endpoints follow the public network access setting of their workspace, but existing serverless deployments don't follow the workspace's networking after a private endpoint is enabled. You must redeploy them; a deployment created after the change follows the new configuration.
    fr: |
      Les points de terminaison serverless suivent le paramètre d'accès réseau public de leur espace de travail, mais les déploiements serverless existants ne suivent pas la mise en réseau de l'espace de travail après l'activation d'un point de terminaison privé. Vous devez les redéployer ; un déploiement créé après la modification suit la nouvelle configuration.
  options:
    a:
      en: |
        The endpoint is reached on its public address, not through the private endpoint's subnet, so an NSG on that subnet doesn't block internet calls.
      fr: |
        Le point de terminaison est joint sur son adresse publique, pas via le sous-réseau du point de terminaison privé : un NSG sur ce sous-réseau ne bloque pas les appels Internet.
    b:
      en: |
        The outbound mode of a managed network controls traffic leaving the workspace's managed resources, not inbound calls to a serverless endpoint.
      fr: |
        Le mode sortant d'un réseau managé contrôle le trafic qui quitte les ressources managées de l'espace de travail, pas les appels entrants vers un point de terminaison serverless.
    c:
      en: |
        New keys only invalidate the old ones; the endpoint would remain reachable from the internet.
      fr: |
        De nouvelles clés invalident seulement les anciennes ; le point de terminaison resterait joignable depuis Internet.
references:
  - title: Explore Microsoft Foundry Models in Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-model-catalog
