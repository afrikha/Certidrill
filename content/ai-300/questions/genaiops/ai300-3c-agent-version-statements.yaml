id: ai300-3c-agent-version-statements
objective: "3.3.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders manages the prompt of an agent named **orders-agent** in a GitHub repository and deploys it to a Microsoft Foundry project by running a Python script that uses the Foundry SDK.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders gère l'invite d'un agent nommé **orders-agent** dans un dépôt GitHub et la déploie dans un projet Microsoft Foundry en exécutant un script Python qui utilise le SDK Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Each time the script updates orders-agent, Foundry creates a new version of the agent.
        fr: Chaque fois que le script met à jour orders-agent, Foundry crée une nouvelle version de l'agent.
    - id: s2
      text:
        en: Pushing a new Git tag to the repository creates a new version of orders-agent in Foundry.
        fr: Pousser une nouvelle balise Git vers le dépôt crée une nouvelle version de orders-agent dans Foundry.
    - id: s3
      text:
        en: Storing the system instructions in a separate text file instead of a string in the script makes prompt-only changes easier to review.
        fr: Stocker les instructions système dans un fichier texte distinct plutôt que dans une chaîne du script facilite la relecture des modifications portant uniquement sur l'invite.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Foundry creates a new agent version whenever you create or update an agent, through the portal or the SDK. Git tags are labels in the repository; they have no link to Foundry unless a pipeline or script deploys the tagged commit. Separate prompt files isolate prompt changes from code changes and give a clearer history than prompts embedded in scripts.
    fr: Foundry crée une nouvelle version d'agent chaque fois que vous créez ou mettez à jour un agent, depuis le portail ou le SDK. Les balises Git sont des étiquettes du dépôt ; elles n'ont aucun lien avec Foundry sauf si un pipeline ou un script déploie le commit balisé. Des fichiers d'invite distincts isolent les modifications d'invite des modifications de code et donnent un historique plus clair que des invites intégrées aux scripts.
references:
  - title: Understand Microsoft Foundry agents and prompt versioning
    url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/3-foundry-agents-prompt-versioning
