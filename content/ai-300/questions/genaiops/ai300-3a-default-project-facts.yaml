id: ai300-3a-default-project-facts
objective: "3.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Proseware creates a Foundry resource named **foundry-pw** and then creates the projects **proj-a**, **proj-b** and **proj-c**, in that order. Applications authenticate by using Microsoft Entra ID.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware crée une ressource Foundry nommée **foundry-pw**, puis crée les projets **proj-a**, **proj-b** et **proj-c**, dans cet ordre. Les applications s'authentifient avec Microsoft Entra ID.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          proj-a is the default project of foundry-pw.
        fr: |
          proj-a est le projet par défaut de foundry-pw.
    - id: s2
      text:
        en: |
          If you delete proj-b by mistake, you can recover it from the Foundry portal.
        fr: |
          Si vous supprimez proj-b par erreur, vous pouvez le récupérer depuis le portail Foundry.
    - id: s3
      text:
        en: |
          The applications don't need the project API key shown on the project Home page.
        fr: |
          Les applications n'ont pas besoin de la clé API du projet affichée sur la page d'accueil du projet.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The first project created on a Foundry resource becomes its default project. Deleting a project is permanent and a deleted project can't be recovered. The API key shown on the project Home page isn't needed when you use Microsoft Entra ID authentication.
    fr: |
      Le premier projet créé sur une ressource Foundry devient son projet par défaut. La suppression d'un projet est définitive et un projet supprimé ne peut pas être récupéré. La clé API affichée sur la page d'accueil du projet n'est pas nécessaire lorsque vous utilisez l'authentification Microsoft Entra ID.
references:
  - title: Create a project for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-projects
