id: ai300-3c-calibration-order
objective: "3.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank compares two system prompts of an advisory agent by having four people score the responses manually with a 1–5 rubric. In a pilot, two people gave the same response 5 and 3 for Intent Resolution.

    You need to align the evaluators before they score the experiment.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank compare deux invites système d'un agent de conseil en faisant noter manuellement les réponses par quatre personnes avec une grille de 1 à 5. Lors d'un essai, deux personnes ont attribué 5 et 3 à la même réponse pour Intent Resolution.

    Vous devez aligner les évaluateurs avant qu'ils notent l'expérience.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: select, text: { en: "Select five to eight responses that span the score range, including ambiguous ones.", fr: "Sélectionner cinq à huit réponses couvrant toute l'échelle de scores, y compris des réponses ambiguës." } }
    - { id: score, text: { en: "Have each evaluator score the responses independently, without revealing the intended scores.", fr: "Faire noter les réponses par chaque évaluateur de façon indépendante, sans révéler les scores attendus." } }
    - { id: discuss, text: { en: "Compare the scores as a team and discuss the responses whose scores differ by more than one point.", fr: "Comparer les scores en équipe et discuter des réponses dont les scores diffèrent de plus d'un point." } }
    - { id: revise, text: { en: "Revise the rubric descriptions to remove the sources of confusion.", fr: "Réviser les descriptions de la grille pour supprimer les sources de confusion." } }
    - { id: reveal, text: { en: "Show each evaluator the intended score of each response before they score it.", fr: "Montrer à chaque évaluateur le score attendu de chaque réponse avant qu'il la note." } }
    - { id: average, text: { en: "Average the evaluators' scores and record the mean as the score of each response.", fr: "Calculer la moyenne des scores des évaluateurs et l'enregistrer comme score de chaque réponse." } }
answer:
  sequence: [ select, score, discuss, revise ]
explanation:
  correct:
    en: A calibration exercise starts with a set of responses covering clear and ambiguous cases. Evaluators score them independently with the rubric, the team compares scores and discusses differences of more than one point, and the rubric is revised where it caused confusion. The exercise is repeated until the team agrees on how to apply the rubric.
    fr: Un exercice de calibration commence par un ensemble de réponses couvrant des cas nets et ambigus. Les évaluateurs les notent indépendamment avec la grille, l'équipe compare les scores et discute des écarts de plus d'un point, puis la grille est révisée là où elle a semé la confusion. L'exercice est répété jusqu'à ce que l'équipe s'accorde sur l'application de la grille.
  options:
    reveal:
      en: Revealing the intended score defeats the purpose of measuring how each evaluator interprets the rubric.
      fr: Révéler le score attendu empêche de mesurer comment chaque évaluateur interprète la grille.
    average:
      en: Averaging hides the disagreement instead of resolving the different interpretations of the criteria.
      fr: La moyenne masque le désaccord au lieu de résoudre les interprétations divergentes des critères.
references:
  - title: Apply evaluation rubrics for consistent scoring
    url: https://learn.microsoft.com/en-us/training/modules/evaluate-optimize-agents/4-evaluate-agent-responses
