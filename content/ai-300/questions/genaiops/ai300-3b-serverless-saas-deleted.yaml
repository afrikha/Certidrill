id: ai300-3b-serverless-saas-deleted
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a hub-based project named **proj-nw** in a resource group named **rg-ai**. The project contains a serverless API deployment of a partner model that is billed through Azure Marketplace. The deployment worked for several weeks.

    Yesterday, an administrator cleaned up **rg-ai** and deleted every resource whose type is **SaaS**. Since then, the endpoint shows the **Unhealthy** state and the application calls fail.

    What is the cause of the issue?
  fr: |
    Northwind Traders dispose d'un projet basé sur un hub nommé **proj-nw** dans un groupe de ressources nommé **rg-ai**. Le projet contient un déploiement d'API serverless d'un modèle partenaire facturé via la Place de marché Azure. Le déploiement a fonctionné pendant plusieurs semaines.

    Hier, un administrateur a nettoyé **rg-ai** et supprimé toutes les ressources de type **SaaS**. Depuis, le point de terminaison affiche l'état **Unhealthy** et les appels de l'application échouent.

    Quelle est la cause du problème ?
body:
  options:
    - { id: a, text: { en: "The deleted resource was the project's subscription to the model offering.", fr: "La ressource supprimée était l'abonnement du projet à l'offre du modèle." } }
    - { id: b, text: { en: "The deleted resource held the virtual machine quota that hosted the model.", fr: "La ressource supprimée détenait le quota de machines virtuelles qui hébergeait le modèle." } }
    - { id: c, text: { en: "The deleted resource stored the keys of the serverless endpoint.", fr: "La ressource supprimée stockait les clés du point de terminaison serverless." } }
    - { id: d, text: { en: "The deleted resource was the private endpoint of the hub.", fr: "La ressource supprimée était le point de terminaison privé du hub." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each time a project subscribes to a partner model offering in Azure Marketplace, a resource of type SaaS is created in the resource group to track the costs. Deleting this model subscription makes every associated serverless endpoint Unhealthy and unusable.
    fr: |
      Chaque fois qu'un projet s'abonne à une offre de modèle partenaire dans la Place de marché Azure, une ressource de type SaaS est créée dans le groupe de ressources pour suivre les coûts. La suppression de cet abonnement au modèle rend tout point de terminaison serverless associé Unhealthy et inutilisable.
  options:
    b:
      en: |
        Serverless deployments don't consume virtual machine quota; Microsoft hosts the model, and only managed compute needs VM quota.
      fr: |
        Les déploiements serverless ne consomment pas de quota de machines virtuelles ; Microsoft héberge le modèle, et seul le calcul managé exige un quota de machines virtuelles.
    c:
      en: |
        The endpoint keys belong to the serverless endpoint itself and are retrieved with get-credentials; they aren't a SaaS resource.
      fr: |
        Les clés appartiennent au point de terminaison serverless lui-même et s'obtiennent avec get-credentials ; ce ne sont pas une ressource SaaS.
    d:
      en: |
        A private endpoint is a network resource (Microsoft.Network), not a SaaS resource.
      fr: |
        Un point de terminaison privé est une ressource réseau (Microsoft.Network), pas une ressource SaaS.
references:
  - title: Deploy models as standard deployments
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-models-serverless
  - title: Deploy models as serverless API deployments (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/deploy-models-serverless
