id: ai300-3a-network-features-dragdrop
objective: "3.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum is designing the network configuration of several new Foundry resources. Each requirement applies to a different Foundry resource.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum conçoit la configuration réseau de plusieurs nouvelles ressources Foundry. Chaque exigence s'applique à une ressource Foundry différente.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pe, text: { en: "A private endpoint", fr: "Un point de terminaison privé" } }
    - { id: inj, text: { en: "Virtual network injection into a customer subnet", fr: "L'injection dans un sous-réseau du client" } }
    - { id: mint, text: { en: "A managed virtual network in Allow internet outbound mode", fr: "Un réseau virtuel managé en mode Allow internet outbound" } }
    - { id: mapp, text: { en: "A managed virtual network in Allow only approved outbound mode", fr: "Un réseau virtuel managé en mode Allow only approved outbound" } }
    - { id: ip, text: { en: "An IP network rule", fr: "Une règle de réseau IP" } }
    - { id: nat, text: { en: "A NAT gateway on the private endpoint subnet", fr: "Une passerelle NAT sur le sous-réseau des points de terminaison privés" } }
  targets:
    - id: t1
      text: { en: "Applications in a virtual network must reach the Foundry resource through a private IP address.", fr: "Des applications d'un réseau virtuel doivent joindre la ressource Foundry par une adresse IP privée." }
    - id: t2
      text: { en: "Agent outbound traffic must use Adatum's own subnet, user-defined routes and firewall.", fr: "Le trafic sortant des agents doit utiliser le sous-réseau, les itinéraires définis par l'utilisateur et le pare-feu d'Adatum." }
    - id: t3
      text: { en: "Agents need unrestricted outbound internet access, and Adatum must not manage any virtual network for them.", fr: "Les agents ont besoin d'un accès Internet sortant sans restriction, et Adatum ne doit gérer aucun réseau virtuel pour eux." }
    - id: t4
      text: { en: "A partner's public address range must reach the Foundry endpoint over the internet.", fr: "La plage d'adresses publiques d'un partenaire doit joindre le point de terminaison Foundry par Internet." }
answer:
  mapping: { t1: pe, t2: inj, t3: mint, t4: ip }
explanation:
  correct:
    en: |
      A private endpoint gives inbound access through a private IP address in your virtual network. Virtual network injection places the agent client in your delegated subnet, under your routes and firewall. A managed virtual network in Allow internet outbound mode secures agent compute in a Microsoft-managed network while allowing all outbound internet traffic. An IP network rule allows a public address range to the public endpoint.
    fr: |
      Un point de terminaison privé fournit un accès entrant par une adresse IP privée de votre réseau virtuel. L'injection dans un réseau virtuel place le client d'agent dans votre sous-réseau délégué, soumis à vos itinéraires et à votre pare-feu. Un réseau virtuel managé en mode Allow internet outbound sécurise le calcul des agents dans un réseau géré par Microsoft tout en autorisant tout le trafic sortant vers Internet. Une règle de réseau IP autorise une plage d'adresses publiques sur le point de terminaison public.
  options:
    mapp:
      en: |
        Allow only approved outbound mode blocks internet traffic that no rule approves, so it doesn't give unrestricted outbound access.
      fr: |
        Le mode Allow only approved outbound bloque le trafic Internet qu'aucune règle n'approuve : il ne donne pas d'accès sortant sans restriction.
    nat:
      en: |
        A NAT gateway provides outbound connectivity for your subnet; it doesn't meet any of the requirements for the Foundry resource.
      fr: |
        Une passerelle NAT fournit une connectivité sortante à votre sous-réseau ; elle ne répond à aucune des exigences pour la ressource Foundry.
references:
  - title: How to configure network isolation for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
  - title: Configure managed virtual network for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/managed-virtual-network
