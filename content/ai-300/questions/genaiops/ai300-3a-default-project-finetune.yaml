id: ai300-3a-default-project-finetune
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Foundry resource named **foundry-fab** that contains two projects:

    | Project | Created |
    | --- | --- |
    | proj-core | First project of the resource |
    | proj-claims | Second project of the resource |

    The claims team works in proj-claims. The team must fine-tune an Azure OpenAI model by using the OpenAI fine-tuning API and then call the fine-tuned model from its application in proj-claims.

    What should you do?
  fr: |
    Fabrikam dispose d'une ressource Foundry nommée **foundry-fab** qui contient deux projets :

    | Projet | Création |
    | --- | --- |
    | proj-core | Premier projet de la ressource |
    | proj-claims | Deuxième projet de la ressource |

    L'équipe des sinistres travaille dans proj-claims. Elle doit effectuer le réglage précis d'un modèle Azure OpenAI à l'aide de l'API de réglage précis d'OpenAI, puis appeler le modèle ajusté depuis son application dans proj-claims.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run the fine-tuning job from proj-claims after you assign the Foundry Owner role on proj-claims.", fr: "Exécuter le travail de réglage précis depuis proj-claims après avoir attribué le rôle Foundry Owner sur proj-claims." } }
    - { id: b, text: { en: "Run the fine-tuning job from proj-core, and then use the fine-tuned deployment from proj-claims.", fr: "Exécuter le travail de réglage précis depuis proj-core, puis utiliser le déploiement ajusté depuis proj-claims." } }
    - { id: c, text: { en: "Add an Azure OpenAI connection to proj-claims, and then run the fine-tuning job from proj-claims.", fr: "Ajouter une connexion Azure OpenAI à proj-claims, puis exécuter le travail de réglage précis depuis proj-claims." } }
    - { id: d, text: { en: "Create a new Foundry resource for the claims team, and then run the fine-tuning job from its second project.", fr: "Créer une ressource Foundry pour l'équipe des sinistres, puis exécuter le travail de réglage précis depuis son deuxième projet." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The first project of a Foundry resource is its default project, and only the default project supports OpenAI Batch, fine-tuning and stored completions. Fine-tuned deployments belong to the resource and are consumable across its projects, so proj-claims can call the model.
    fr: |
      Le premier projet d'une ressource Foundry est son projet par défaut, et seul le projet par défaut prend en charge OpenAI Batch, le réglage précis et les complétions stockées. Les déploiements ajustés appartiennent à la ressource et sont utilisables par tous ses projets : proj-claims peut donc appeler le modèle.
  options:
    a:
      en: |
        The limitation is a feature of non-default projects, not a permission issue; a role assignment doesn't add OpenAI fine-tuning to proj-claims.
      fr: |
        La limitation est une caractéristique des projets autres que celui par défaut, pas un problème d'autorisation ; une attribution de rôle n'ajoute pas le réglage précis OpenAI à proj-claims.
    c:
      en: |
        A connection doesn't change the OpenAI API features that a non-default project supports.
      fr: |
        Une connexion ne change pas les fonctionnalités de l'API OpenAI prises en charge par un projet autre que celui par défaut.
    d:
      en: |
        The second project of the new resource isn't its default project either, so it has the same limitation.
      fr: |
        Le deuxième projet de la nouvelle ressource n'est pas non plus son projet par défaut ; il a donc la même limitation.
references:
  - title: Create a project for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-projects
  - title: Microsoft Foundry rollout across my organization
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/planning
