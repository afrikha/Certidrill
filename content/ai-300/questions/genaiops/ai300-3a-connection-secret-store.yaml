id: ai300-3a-connection-secret-store
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has a Foundry resource named **foundry-lit** with a project named **proj-sales**. A developer adds an **API key** connection to a third-party service in proj-sales. No Azure Key Vault connection exists on foundry-lit.

    An auditor asks where the API key of the connection is stored.

    What should you answer?
  fr: |
    Litware dispose d'une ressource Foundry nommée **foundry-lit** avec un projet nommé **proj-sales**. Un développeur ajoute dans proj-sales une connexion **API key** vers un service tiers. Aucune connexion Azure Key Vault n'existe sur foundry-lit.

    Un auditeur demande où est stockée la clé API de la connexion.

    Que devez-vous répondre ?
body:
  options:
    - { id: a, text: { en: "In a key vault that Foundry creates in the resource group of foundry-lit", fr: "Dans un coffre de clés que Foundry crée dans le groupe de ressources de foundry-lit" } }
    - { id: b, text: { en: "In a managed key vault that isn't visible in the Azure subscription", fr: "Dans un coffre de clés managé qui n'est pas visible dans l'abonnement Azure" } }
    - { id: c, text: { en: "In the default blob container of the project's storage account", fr: "Dans le conteneur d'objets blob par défaut du compte de stockage du projet" } }
    - { id: d, text: { en: "In the application settings of the project's managed identity", fr: "Dans les paramètres d'application de l'identité managée du projet" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When no Azure Key Vault connection exists, Foundry stores connection details in a managed key vault that isn't shown in your subscription. To manage the secrets yourself, you bring your own key vault through a Key Vault connection.
    fr: |
      En l'absence de connexion Azure Key Vault, Foundry stocke les détails des connexions dans un coffre de clés managé qui n'apparaît pas dans votre abonnement. Pour gérer vous-même les secrets, vous apportez votre propre coffre de clés au moyen d'une connexion Key Vault.
  options:
    a:
      en: |
        Foundry doesn't create a visible key vault in your resource group for connection secrets; a key vault in your subscription is used only if you add a Key Vault connection.
      fr: |
        Foundry ne crée pas de coffre de clés visible dans votre groupe de ressources pour les secrets des connexions ; un coffre de votre abonnement n'est utilisé que si vous ajoutez une connexion Key Vault.
    c:
      en: |
        Storage accounts hold files and agent data, not connection secrets.
      fr: |
        Les comptes de stockage contiennent des fichiers et des données d'agents, pas les secrets des connexions.
    d:
      en: |
        A managed identity has no application settings and doesn't store secrets.
      fr: |
        Une identité managée n'a pas de paramètres d'application et ne stocke pas de secrets.
references:
  - title: Add a new connection to your project
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/connections-add
