seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You create a Global Provisioned deployment of the model.
  fr: Vous créez un déploiement Global Provisioned du modèle.
body:
  solution:
    en: |
      You estimate the required number of PTUs with the capacity calculator in the Foundry portal. You then create a deployment of the model with the **Global Provisioned** deployment type (SKU `GlobalProvisionedManaged`) and that number of PTUs.
    fr: |
      Vous estimez le nombre de PTU nécessaires avec le calculateur de capacité du portail Foundry. Vous créez ensuite un déploiement du modèle avec le type de déploiement **Global Provisioned** (SKU `GlobalProvisionedManaged`) et ce nombre de PTU.
answer: { value: false }
explanation:
  correct:
    en: |
      Global Provisioned gives dedicated capacity and predictable latency, but requests can be routed to and processed in Azure regions anywhere in the world. Deploying the resource in Sweden Central doesn't restrict where a global deployment processes prompts and responses, so the EU-only processing requirement isn't met.
    fr: |
      Global Provisioned fournit une capacité dédiée et une latence prévisible, mais les requêtes peuvent être routées vers des régions Azure du monde entier et y être traitées. Le fait que la ressource se trouve dans Sweden Central ne limite pas l'endroit où un déploiement global traite les invites et les réponses : l'exigence de traitement uniquement dans l'UE n'est pas satisfaite.
references:
  - title: Provisioned throughput for Foundry Models - Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/provisioned-throughput
