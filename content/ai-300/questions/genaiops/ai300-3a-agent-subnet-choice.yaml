id: ai300-3a-agent-subnet-choice
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to deploy a Foundry resource named **foundry-fab2** with private networking for Foundry Agent Service, by using virtual network injection into a virtual network named **vnet-ai** (10.20.0.0/16) in the same region. vnet-ai contains the following subnets:

    | Subnet | Size | Delegation | Current use |
    | --- | --- | --- | --- |
    | snet-pe | /24 | None | Private endpoints |
    | snet-small | /28 | Microsoft.App/environments | None |
    | snet-agents1 | /24 | Microsoft.App/environments | Injected by the Foundry resource foundry-fab1 |
    | snet-agents2 | /26 | Microsoft.App/environments | None |

    Which subnet should you use for the agent client of foundry-fab2?
  fr: |
    Fabrikam prévoit de déployer une ressource Foundry nommée **foundry-fab2** avec une mise en réseau privée pour Foundry Agent Service, par injection dans un réseau virtuel nommé **vnet-ai** (10.20.0.0/16) situé dans la même région. vnet-ai contient les sous-réseaux suivants :

    | Sous-réseau | Taille | Délégation | Utilisation actuelle |
    | --- | --- | --- | --- |
    | snet-pe | /24 | Aucune | Points de terminaison privés |
    | snet-small | /28 | Microsoft.App/environments | Aucune |
    | snet-agents1 | /24 | Microsoft.App/environments | Injecté par la ressource Foundry foundry-fab1 |
    | snet-agents2 | /26 | Microsoft.App/environments | Aucune |

    Quel sous-réseau devez-vous utiliser pour le client d'agent de foundry-fab2 ?
body:
  options:
    - { id: a, text: snet-pe }
    - { id: b, text: snet-small }
    - { id: c, text: snet-agents1 }
    - { id: d, text: snet-agents2 }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The agent subnet must be delegated to `Microsoft.App/environments`, be /27 or larger, and be dedicated to one Foundry resource. snet-agents2 is a delegated /26 subnet that no other resource uses.
    fr: |
      Le sous-réseau des agents doit être délégué à `Microsoft.App/environments`, avoir une taille /27 ou plus grande et être dédié à une seule ressource Foundry. snet-agents2 est un sous-réseau /26 délégué qu'aucune autre ressource n'utilise.
  options:
    a:
      en: |
        snet-pe isn't delegated to `Microsoft.App/environments`; it hosts the private endpoints.
      fr: |
        snet-pe n'est pas délégué à `Microsoft.App/environments` ; il héberge les points de terminaison privés.
    b:
      en: |
        A /28 subnet is smaller than the /27 minimum.
      fr: |
        Un sous-réseau /28 est plus petit que le minimum /27.
    c:
      en: |
        The agent subnet can't be shared: snet-agents1 is already used by foundry-fab1.
      fr: |
        Le sous-réseau des agents ne peut pas être partagé : snet-agents1 est déjà utilisé par foundry-fab1.
references:
  - title: Set up private networking for Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks
