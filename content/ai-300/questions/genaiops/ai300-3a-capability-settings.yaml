id: ai300-3a-capability-settings
objective: "3.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove uses a Foundry resource named **foundry-wg** with a standard agent setup. The capability settings of foundry-wg reference a storage account, an Azure Cosmos DB account and an Azure AI Search service as defaults for its projects. The project **proj-retail** was created last month by using these defaults.

    You plan to change the default Cosmos DB account of foundry-wg and to create a project named **proj-bank** that must use a dedicated Azure AI Search service.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove utilise une ressource Foundry nommée **foundry-wg** avec une configuration d'agent standard. Les paramètres de capacité de foundry-wg référencent un compte de stockage, un compte Azure Cosmos DB et un service Azure AI Search comme valeurs par défaut pour ses projets. Le projet **proj-retail** a été créé le mois dernier avec ces valeurs par défaut.

    Vous prévoyez de modifier le compte Cosmos DB par défaut de foundry-wg et de créer un projet nommé **proj-bank** qui doit utiliser un service Azure AI Search dédié.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "After you change the account default, proj-retail keeps using its current Cosmos DB account.", fr: "Après la modification de la valeur par défaut du compte, proj-retail continue d'utiliser son compte Cosmos DB actuel." } }
    - { id: b, text: { en: "You can later update the capability settings of proj-retail to use the new Cosmos DB account.", fr: "Vous pourrez ensuite mettre à jour les paramètres de capacité de proj-retail pour utiliser le nouveau compte Cosmos DB." } }
    - { id: c, text: { en: "proj-bank can override the vector store and inherit the other stores from foundry-wg.", fr: "proj-bank peut remplacer le magasin de vecteurs et hériter des autres magasins de foundry-wg." } }
    - { id: d, text: { en: "The identity that deploys proj-bank needs Search Index Data Contributor on the dedicated search service.", fr: "L'identité qui déploie proj-bank a besoin du rôle Search Index Data Contributor sur le service de recherche dédié." } }
    - { id: e, text: { en: "Every project of foundry-wg must use the same three stores as the account defaults.", fr: "Tous les projets de foundry-wg doivent utiliser les trois mêmes magasins que les valeurs par défaut du compte." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A project inherits the account's storage defaults or overrides individual stores, such as only the vector store. Changing the account defaults later doesn't update existing projects, so proj-retail keeps its effective configuration.
    fr: |
      Un projet hérite des valeurs de stockage par défaut du compte ou remplace des magasins individuels, par exemple uniquement le magasin de vecteurs. La modification ultérieure des valeurs par défaut du compte ne met pas à jour les projets existants : proj-retail conserve sa configuration effective.
  options:
    b:
      en: |
        Capability settings of an existing project can't be updated; you must delete and recreate the project with the new settings.
      fr: |
        Les paramètres de capacité d'un projet existant ne peuvent pas être mis à jour ; vous devez supprimer puis recréer le projet avec les nouveaux paramètres.
    d:
      en: |
        Azure AI Search requires no caller role for the capability settings; the caller needs Storage Blob Data Contributor on Storage and Cosmos DB Operator on Cosmos DB.
      fr: |
        Azure AI Search n'exige aucun rôle de l'appelant pour les paramètres de capacité ; l'appelant a besoin de Storage Blob Data Contributor sur le stockage et de Cosmos DB Operator sur Cosmos DB.
    e:
      en: |
        The account settings are only defaults; each project can override individual stores.
      fr: |
        Les paramètres du compte ne sont que des valeurs par défaut ; chaque projet peut remplacer des magasins individuels.
references:
  - title: Create a project for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-projects
  - title: Set up standard agent resources for Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/standard-agent-setup
