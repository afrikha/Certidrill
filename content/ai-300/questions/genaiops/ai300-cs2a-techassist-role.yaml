id: ai300-cs2a-techassist-role
objective: "3.1.2"
type: single
caseStudy: ai300-cs2a-blue-yonder
difficulty: 1
status: draft
stem:
  en: |
    You update TechAssist to request Microsoft Entra tokens with the managed identity of ca-techassist when it calls gpt-manuals.

    You need to grant the managed identity access to gpt-manuals. The solution must meet the security requirements.

    Which role should you assign to the managed identity at the scope of fdy-by-tech?
  fr: |
    Vous modifiez TechAssist pour qu'elle demande des jetons Microsoft Entra avec l'identité managée de ca-techassist quand elle appelle gpt-manuals.

    Vous devez accorder à l'identité managée l'accès à gpt-manuals. La solution doit respecter les exigences de sécurité.

    Quel rôle devez-vous attribuer à l'identité managée dans l'étendue de fdy-by-tech ?
body:
  options:
    - { id: a, text: Foundry Account Owner }
    - { id: b, text: Foundry Project Manager }
    - { id: c, text: Foundry User }
    - { id: d, text: Contributor }
answer: { optionId: c }
explanation:
  correct:
    en: "To call a model deployment at inference time with Microsoft Entra ID, a principal needs the Foundry User role (formerly named Azure AI User) on the Foundry resource. It grants the data actions that inference requires, without permissions to manage models or to assign roles."
    fr: "Pour appeler un déploiement de modèle au moment de l'inférence avec Microsoft Entra ID, un principal a besoin du rôle Foundry User (anciennement nommé Azure AI User) sur la ressource Foundry. Ce rôle accorde les actions de données nécessaires à l'inférence, sans autorisation de gérer les modèles ni d'attribuer des rôles."
  options:
    a: { en: "Foundry Account Owner manages models and projects but has no data actions, so it cannot call deployments.", fr: "Foundry Account Owner gère les modèles et les projets, mais ne dispose d'aucune action de données : il ne peut pas appeler les déploiements." }
    b: { en: "Foundry Project Manager works, but it can also assign the Foundry User role and publish agents, which exceeds least privilege.", fr: "Foundry Project Manager fonctionne, mais il peut aussi attribuer le rôle Foundry User et publier des agents, ce qui dépasse le moindre privilège." }
    d: { en: "Contributor grants management actions only; it includes no data actions to call deployments.", fr: "Contributor n'accorde que des actions de gestion ; il ne comprend aucune action de données pour appeler les déploiements." }
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/rbac-azure-ai-foundry
