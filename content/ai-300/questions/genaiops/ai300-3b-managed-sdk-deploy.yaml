id: ai300-3b-managed-sdk-deploy
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a hub-based project. `ml_client` is an authenticated `MLClient` for the project, and the entity classes of `azure.ai.ml.entities` are imported.

    You need to deploy version **8** of the **Phi-4** model from the **azureml** registry to managed compute behind the endpoint **phi4-support**. Later releases of the model must not change the deployment.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un projet basé sur un hub. `ml_client` est un `MLClient` authentifié pour le projet, et les classes d'entités de `azure.ai.ml.entities` sont importées.

    Vous devez déployer la version **8** du modèle **Phi-4** du registre **azureml** sur un calcul managé, derrière le point de terminaison **phi4-support**. Les versions ultérieures du modèle ne doivent pas modifier le déploiement.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    endpoint = ManagedOnlineEndpoint(name="phi4-support", auth_mode="key")
    ml_client.online_endpoints.begin_create_or_update(endpoint).wait()

    deployment = [[cls]](
        name="blue",
        endpoint_name="phi4-support",
        model=[[model]],
        instance_type="Standard_DS3_v2",
        instance_count=2,
    )
    ml_client.[[op]].begin_create_or_update(deployment).wait()

    endpoint.traffic = {"blue": 100}
    ml_client.online_endpoints.begin_create_or_update(endpoint).result()
  slots:
    - id: cls
      options:
        - { id: c1, text: ServerlessEndpoint }
        - { id: c2, text: ManagedOnlineDeployment }
        - { id: c3, text: BatchDeployment }
        - { id: c4, text: KubernetesOnlineDeployment }
    - id: model
      options:
        - { id: m1, text: "\"azureml://registries/azureml/models/Phi-4/labels/latest\"" }
        - { id: m2, text: "\"azureml:Phi-4:8\"" }
        - { id: m3, text: "\"azureml://registries/azureml/models/Phi-4/versions/8\"" }
        - { id: m4, text: "\"azureml://registries/azureml/models/Phi-4\"" }
    - id: op
      options:
        - { id: o1, text: online_deployments }
        - { id: o2, text: serverless_endpoints }
        - { id: o3, text: batch_deployments }
        - { id: o4, text: models }
answer:
  values: { cls: c2, model: m3, op: o1 }
explanation:
  correct:
    en: "A managed compute deployment is a `ManagedOnlineDeployment` created in an existing `ManagedOnlineEndpoint` with `ml_client.online_deployments.begin_create_or_update()`. The model ID copied from the model card pins the version with `/versions/8`, so a new release of Phi-4 doesn't change what the deployment runs. The last lines send 100 % of the traffic to the deployment."
    fr: "Un déploiement sur calcul managé est un `ManagedOnlineDeployment` créé dans un `ManagedOnlineEndpoint` existant avec `ml_client.online_deployments.begin_create_or_update()`. L'ID de modèle copié depuis la fiche du modèle fixe la version avec `/versions/8` : une nouvelle version de Phi-4 ne modifie pas ce qu'exécute le déploiement. Les dernières lignes envoient 100 % du trafic vers le déploiement."
  options:
    c1: { en: "ServerlessEndpoint creates a serverless API deployment, which has no instances to size.", fr: "ServerlessEndpoint crée un déploiement d'API serverless, qui n'a pas d'instances à dimensionner." }
    c3: { en: "BatchDeployment belongs to a batch endpoint, not to a managed online endpoint.", fr: "BatchDeployment appartient à un point de terminaison de lot, pas à un point de terminaison en ligne managé." }
    c4: { en: "KubernetesOnlineDeployment targets an attached Kubernetes cluster, not managed compute.", fr: "KubernetesOnlineDeployment cible un cluster Kubernetes attaché, pas le calcul managé." }
    m1: { en: "labels/latest resolves to the newest version, so a later release would change the deployment at its next update.", fr: "labels/latest correspond à la version la plus récente : une version ultérieure modifierait le déploiement lors de sa prochaine mise à jour." }
    m2: { en: "azureml:Phi-4:8 references a model registered in the workspace, not in the azureml registry.", fr: "azureml:Phi-4:8 référence un modèle inscrit dans l'espace de travail, pas dans le registre azureml." }
    m4: { en: "The ID without version is the format used for serverless deployments, which always take the latest version.", fr: "L'ID sans version est le format utilisé pour les déploiements serverless, qui prennent toujours la dernière version." }
    o2: { en: "serverless_endpoints manages serverless API deployments.", fr: "serverless_endpoints gère les déploiements d'API serverless." }
    o3: { en: "batch_deployments manages deployments of batch endpoints.", fr: "batch_deployments gère les déploiements des points de terminaison de lot." }
    o4: { en: "models registers or lists models; it doesn't deploy them.", fr: "models inscrit ou répertorie des modèles ; il ne les déploie pas." }
references:
  - title: Deploy models with managed compute (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/deploy-models-managed
  - title: Deploy models from HuggingFace hub to Azure Machine Learning online endpoints for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-models-from-huggingface
