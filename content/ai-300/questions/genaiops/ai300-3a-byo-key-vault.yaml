id: ai300-3a-byo-key-vault
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind has a Foundry resource named **foundry-nw**. Its projects already contain five API key connections. No Azure Key Vault connection exists on foundry-nw.

    A new security policy requires that the secrets of all connections be stored in **kv-nw-sec**, a key vault that the security team manages in your subscription. The connections must keep working after the change.

    What should you do?
  fr: |
    Northwind dispose d'une ressource Foundry nommée **foundry-nw**. Ses projets contiennent déjà cinq connexions par clé API. Aucune connexion Azure Key Vault n'existe sur foundry-nw.

    Une nouvelle stratégie de sécurité exige que les secrets de toutes les connexions soient stockés dans **kv-nw-sec**, un coffre de clés que l'équipe de sécurité gère dans votre abonnement. Les connexions doivent continuer à fonctionner après la modification.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a Key Vault connection to kv-nw-sec on foundry-nw, and then recreate the five connections.", fr: "Ajouter une connexion Key Vault vers kv-nw-sec sur foundry-nw, puis recréer les cinq connexions." } }
    - { id: b, text: { en: "Add a Key Vault connection to kv-nw-sec on foundry-nw, and then wait for the secrets to migrate.", fr: "Ajouter une connexion Key Vault vers kv-nw-sec sur foundry-nw, puis attendre la migration des secrets." } }
    - { id: c, text: { en: "Add a Key Vault connection to kv-nw-sec in each project that contains API key connections.", fr: "Ajouter une connexion Key Vault vers kv-nw-sec dans chaque projet qui contient des connexions par clé API." } }
    - { id: d, text: { en: "Configure customer-managed keys on foundry-nw by using a key stored in kv-nw-sec.", fr: "Configurer des clés gérées par le client sur foundry-nw avec une clé stockée dans kv-nw-sec." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      You bring your own key vault by adding one Azure Key Vault connection to the Foundry resource. Secret migration isn't supported, so connections created before the Key Vault connection must be recreated to store their secrets in kv-nw-sec.
    fr: |
      Vous apportez votre propre coffre de clés en ajoutant une connexion Azure Key Vault à la ressource Foundry. La migration des secrets n'est pas prise en charge : les connexions créées avant la connexion Key Vault doivent être recréées pour que leurs secrets soient stockés dans kv-nw-sec.
  options:
    b:
      en: |
        Existing secrets aren't migrated to the new key vault; they stay where they were until you recreate the connections.
      fr: |
        Les secrets existants ne sont pas migrés vers le nouveau coffre de clés ; ils restent à leur emplacement jusqu'à ce que vous recréiez les connexions.
    c:
      en: |
        Only one Azure Key Vault connection can exist per Foundry resource at a time, and existing secrets still wouldn't migrate.
      fr: |
        Une seule connexion Azure Key Vault peut exister à la fois par ressource Foundry, et les secrets existants ne seraient toujours pas migrés.
    d:
      en: |
        Customer-managed keys encrypt data at rest; they don't change where connection secrets are stored.
      fr: |
        Les clés gérées par le client chiffrent les données au repos ; elles ne changent pas l'emplacement de stockage des secrets des connexions.
references:
  - title: Add a new connection to your project
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/connections-add
