id: ai300-3c-repo-folders
objective: "3.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is organizing a GitHub repository for its Microsoft Foundry agents by following the structure recommended in Microsoft's GenAIOps guidance. Each agent has its own folder under src/agents.

    In which folder should you store each file? To answer, drag the appropriate folders to the correct files. Each folder may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam organise un dépôt GitHub pour ses agents Microsoft Foundry en suivant la structure recommandée par les conseils GenAIOps de Microsoft. Chaque agent possède son propre dossier sous src/agents.

    Dans quel dossier devez-vous stocker chaque fichier ? Pour répondre, faites glisser les dossiers appropriés vers les fichiers correspondants. Chaque dossier peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: prompts, text: src/agents/support_agent/prompts/ }
    - { id: tests, text: tests/ }
    - { id: infra, text: infra/ }
    - { id: workflows, text: .github/workflows/ }
    - { id: docs, text: docs/ }
    - { id: root, text: src/agents/ }
  targets:
    - { id: t1, text: { en: "v2_greeting.txt (system instructions of the support agent, version 2)", fr: "v2_greeting.txt (instructions système de l'agent de support, version 2)" } }
    - { id: t2, text: { en: "test_support_agent.py (automated tests of the support agent)", fr: "test_support_agent.py (tests automatisés de l'agent de support)" } }
    - { id: t3, text: { en: "main.bicep (Azure resource definitions)", fr: "main.bicep (définitions des ressources Azure)" } }
    - { id: t4, text: { en: "deploy-agents.yml (CI/CD workflow that deploys the agents)", fr: "deploy-agents.yml (flux de travail CI/CD qui déploie les agents)" } }
answer:
  mapping: { t1: prompts, t2: tests, t3: infra, t4: workflows }
explanation:
  correct:
    en: Prompt files live in a prompts subfolder of their agent's folder, next to the deployment script. Automated tests go in tests, infrastructure as code such as main.bicep in infra, and GitHub Actions workflows in .github/workflows. The docs folder holds guides such as prompt-writing standards.
    fr: Les fichiers d'invite se trouvent dans un sous-dossier prompts du dossier de leur agent, à côté du script de déploiement. Les tests automatisés vont dans tests, l'infrastructure as code comme main.bicep dans infra, et les flux de travail GitHub Actions dans .github/workflows. Le dossier docs contient des guides comme les standards de rédaction des invites.
references:
  - title: Organize prompts in GitHub repositories
    url: https://learn.microsoft.com/en-us/training/modules/prompt-versioning-genaiops/4-github-repository-structure
