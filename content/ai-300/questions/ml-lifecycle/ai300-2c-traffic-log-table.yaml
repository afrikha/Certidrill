id: ai300-2c-traffic-log-table
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a managed online endpoint named **ep-churn** with two deployments. A diagnostic setting sends all the endpoint log categories to a Log Analytics workspace.

    You need to find which deployment returned 5xx responses during the last 24 hours and how long each of those requests took.

    Which table should you query?
  fr: |
    Contoso dispose d'un point de terminaison en ligne managé nommé **ep-churn** avec deux déploiements. Un paramètre de diagnostic envoie toutes les catégories de journaux du point de terminaison vers un espace de travail Log Analytics.

    Vous devez déterminer quel déploiement a renvoyé des réponses 5xx au cours des dernières 24 heures et combien de temps chacune de ces requêtes a duré.

    Quelle table devez-vous interroger ?
body:
  options:
    - { id: a, text: AmlOnlineEndpointTrafficLog }
    - { id: b, text: AmlOnlineEndpointConsoleLog }
    - { id: c, text: AmlOnlineEndpointEventLog }
    - { id: d, text: AzureActivity }
answer: { optionId: a }
explanation:
  correct:
    en: |
      AmlOnlineEndpointTrafficLog records each request with its deployment name, the response code returned to the client, the code returned by the model and the durations (`TotalDurationMs`, `RequestDurationMs`, `ResponseDurationMs`).
    fr: |
      AmlOnlineEndpointTrafficLog enregistre chaque requête avec le nom de son déploiement, le code de réponse renvoyé au client, le code renvoyé par le modèle et les durées (`TotalDurationMs`, `RequestDurationMs`, `ResponseDurationMs`).
  options:
    b: { en: "The console log contains the container's standard output, not one record per request with its response code.", fr: "Le journal de console contient la sortie standard du conteneur, pas un enregistrement par requête avec son code de réponse." }
    c: { en: "The event log contains container lifecycle events such as probe failures and restarts.", fr: "Le journal des événements contient les événements du cycle de vie du conteneur, comme les échecs de sonde et les redémarrages." }
    d: { en: "The activity log records control-plane operations on Azure resources, not scoring requests.", fr: "Le journal d'activité enregistre les opérations du plan de contrôle sur les ressources Azure, pas les requêtes de scoring." }
references:
  - title: Monitor online endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-online-endpoints
