id: ai300-2a-mlflow-plugin-package
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-proseware**. On your local computer, you installed only the `mlflow` package. When your script calls `mlflow.set_tracking_uri()` with the `azureml://` tracking URI of the workspace, MLflow can't use the URI.

    You need to log runs from your computer to mlw-proseware.

    Which package should you install?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-proseware**. Sur votre ordinateur local, vous avez installé uniquement le package `mlflow`. Quand votre script appelle `mlflow.set_tracking_uri()` avec l'URI de suivi `azureml://` de l'espace de travail, MLflow ne peut pas utiliser l'URI.

    Vous devez enregistrer des exécutions dans mlw-proseware depuis votre ordinateur.

    Quel package devez-vous installer ?
body:
  options:
    - { id: a, text: azure-ai-ml }
    - { id: b, text: mlflow-skinny }
    - { id: c, text: azureml-mlflow }
    - { id: d, text: azure-identity }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The `azureml-mlflow` package is the Azure Machine Learning plugin for MLflow. It lets MLflow use `azureml://` tracking URIs and handles authentication; it also installs `azure-identity`. Microsoft documents `pip install mlflow azureml-mlflow` as the prerequisite.
    fr: |
      Le package `azureml-mlflow` est le plug-in Azure Machine Learning pour MLflow. Il permet à MLflow d'utiliser les URI de suivi `azureml://` et gère l'authentification ; il installe aussi `azure-identity`. Microsoft indique `pip install mlflow azureml-mlflow` comme prérequis.
  options:
    a:
      en: "`azure-ai-ml` is the Python SDK v2 for managing workspace resources and jobs; it isn't the MLflow plugin."
      fr: "`azure-ai-ml` est le SDK Python v2 qui gère les ressources et les travaux de l'espace de travail ; ce n'est pas le plug-in MLflow."
    b:
      en: "`mlflow-skinny` is a lighter MLflow distribution; it doesn't add support for Azure Machine Learning URIs."
      fr: "`mlflow-skinny` est une distribution allégée de MLflow ; elle n'ajoute pas la prise en charge des URI Azure Machine Learning."
    d:
      en: "`azure-identity` provides credentials only; without the plugin, MLflow still can't use the URI."
      fr: "`azure-identity` fournit seulement des informations d'identification ; sans le plug-in, MLflow ne peut toujours pas utiliser l'URI."
references:
  - title: Configure MLflow for Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-mlflow-configure-tracking
