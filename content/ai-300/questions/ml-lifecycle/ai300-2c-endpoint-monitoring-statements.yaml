id: ai300-2c-endpoint-monitoring-statements
objective: "2.4.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a managed online endpoint named **ep-pricing**. You are documenting how the operations team monitors the endpoint with Azure Monitor.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un point de terminaison en ligne managé nommé **ep-pricing**. Vous documentez la façon dont l'équipe d'exploitation surveille le point de terminaison avec Azure Monitor.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To query AmlOnlineEndpointConsoleLog, you must first add a diagnostic setting on ep-pricing that sends the logs to a Log Analytics workspace.
        fr: Pour interroger AmlOnlineEndpointConsoleLog, vous devez d'abord ajouter sur ep-pricing un paramètre de diagnostic qui envoie les journaux vers un espace de travail Log Analytics.
    - id: s2
      text:
        en: AmlOnlineEndpointEventLog contains the response code returned to each client request.
        fr: AmlOnlineEndpointEventLog contient le code de réponse renvoyé à chaque requête cliente.
    - id: s3
      text:
        en: The deployment metrics show CPU and memory utilization, and you can drill down to a single instance.
        fr: Les métriques du déploiement indiquent l'utilisation du processeur et de la mémoire, et vous pouvez descendre jusqu'à une instance.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The traffic, console and event log tables are populated only after you add a diagnostic setting that sends the chosen categories to a Log Analytics workspace. The event log contains container lifecycle events (for example `ReadinessProbeFailed`, `BackOff`, `Started`); response codes are in AmlOnlineEndpointTrafficLog. Deployment-level metrics include CPU, GPU, memory and disk utilization, drillable to the instance level.
    fr: |
      Les tables de journaux de trafic, de console et d'événements ne sont alimentées qu'après l'ajout d'un paramètre de diagnostic qui envoie les catégories choisies vers un espace de travail Log Analytics. Le journal des événements contient les événements du cycle de vie du conteneur (par exemple `ReadinessProbeFailed`, `BackOff`, `Started`) ; les codes de réponse se trouvent dans AmlOnlineEndpointTrafficLog. Les métriques au niveau du déploiement incluent l'utilisation du processeur, du GPU, de la mémoire et du disque, jusqu'au niveau de l'instance.
references:
  - title: Monitor online endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-online-endpoints
