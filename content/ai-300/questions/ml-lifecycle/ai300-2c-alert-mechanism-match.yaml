id: ai300-2c-alert-mechanism-match
objective: "2.4.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware operates several models in an Azure Machine Learning workspace. The models are deployed to managed online endpoints and monitored by model monitors.

    Which mechanism should you use for each requirement? To answer, drag the appropriate mechanisms to the correct requirements. Each mechanism may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exploite plusieurs modèles dans un espace de travail Azure Machine Learning. Les modèles sont déployés sur des points de terminaison en ligne managés et surveillés par des surveillances de modèle.

    Quel mécanisme devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les mécanismes appropriés vers les exigences correspondantes. Chaque mécanisme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: notif, text: { en: "alert_notification emails in the model monitor", fr: "E-mails alert_notification dans la surveillance de modèle" } }
    - { id: eg, text: { en: "Event Grid subscription on Run status changed that calls a Logic App", fr: "Abonnement Event Grid sur Run status changed qui appelle une application logique" } }
    - { id: metric, text: { en: "Azure Monitor metric alert rule with an action group", fr: "Règle d'alerte de métrique Azure Monitor avec un groupe d'actions" } }
    - { id: sched, text: { en: "Azure Machine Learning schedule with a recurrence trigger", fr: "Planification Azure Machine Learning avec un déclencheur de récurrence" } }
    - { id: reg, text: { en: "Event Grid subscription on Model registered", fr: "Abonnement Event Grid sur Model registered" } }
    - { id: dc, text: { en: "Data collector on the deployment", fr: "Collecteur de données sur le déploiement" } }
  targets:
    - id: t1
      text: { en: "Email the data scientists when a data drift threshold is breached.", fr: "Envoyer un e-mail aux scientifiques des données quand un seuil de dérive des données est dépassé." }
    - id: t2
      text: { en: "Submit the retraining pipeline automatically when a monitoring threshold is breached.", fr: "Soumettre automatiquement le pipeline de réentraînement quand un seuil de surveillance est dépassé." }
    - id: t3
      text: { en: "Page the on-call engineer when the CPU utilization of a deployment exceeds 90 percent.", fr: "Prévenir l'ingénieur d'astreinte quand l'utilisation du processeur d'un déploiement dépasse 90 %." }
    - id: t4
      text: { en: "Retrain a model every Sunday night, whatever the monitoring results.", fr: "Réentraîner un modèle chaque dimanche soir, quels que soient les résultats de la surveillance." }
    - id: t5
      text: { en: "Notify the release managers when a new version of a model is registered.", fr: "Notifier les responsables de mise en production quand une nouvelle version d'un modèle est inscrite." }
answer:
  mapping: { t1: notif, t2: eg, t3: metric, t4: sched, t5: reg }
explanation:
  correct:
    en: |
      A monitor with `alert_enabled` sends emails to the addresses of `alert_notification` when a signal breaches its threshold. To act on a breach, an Event Grid subscription on **Run status changed**, filtered on the threshold-breach tag, calls a handler such as a Logic App that submits the pipeline. Endpoint and deployment metrics such as CPU are Azure Monitor metrics with metric alert rules and action groups. Time-based retraining is a schedule, and model registrations raise the **Model registered** event.
    fr: |
      Une surveillance avec `alert_enabled` envoie des e-mails aux adresses de `alert_notification` quand un signal dépasse son seuil. Pour agir sur un dépassement, un abonnement Event Grid sur **Run status changed**, filtré sur la balise de dépassement de seuil, appelle un gestionnaire, par exemple une application logique qui soumet le pipeline. Les métriques des points de terminaison et des déploiements, comme le processeur, sont des métriques Azure Monitor avec des règles d'alerte de métrique et des groupes d'actions. Le réentraînement périodique relève d'une planification, et les inscriptions de modèle déclenchent l'événement **Model registered**.
  options:
    dc: { en: "The data collector stores production inputs and outputs; it doesn't notify or trigger anything.", fr: "Le collecteur de données stocke les entrées et les sorties de production ; il ne notifie ni ne déclenche rien." }
references:
  - title: Monitor model performance in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance
  - title: Trigger applications, processes, or CI/CD workflows based on Azure Machine Learning events
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-event-grid
