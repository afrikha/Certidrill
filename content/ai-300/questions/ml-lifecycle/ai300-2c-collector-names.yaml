id: ai300-2c-collector-names
objective: "2.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has a custom model deployed to a managed online deployment named **blue** on the endpoint **ep-claims**. The environment includes the `azureml-ai-monitoring` package, the deployment YAML enables two collections named `inputs` and `predictions`, and `score.py` contains the following code.

    ```python
    from azureml.ai.monitoring import Collector

    def init():
        global inputs_collector, outputs_collector
        inputs_collector = Collector(name="inputs")
        outputs_collector = Collector(name="predictions")

    def run(data):
        input_df = parse(data)                         # pandas DataFrame
        context = inputs_collector.collect(input_df)
        output_df = predict(input_df)
        outputs_collector.collect(output_df, context)
        return output_df.to_dict()
    ```

    Data files are written to storage. You need model monitoring to recognize the collected data automatically, without declaring production data in each monitoring signal.

    What should you do?
  fr: |
    Litware dispose d'un modèle personnalisé déployé sur un déploiement en ligne managé nommé **blue** du point de terminaison **ep-claims**. L'environnement inclut le package `azureml-ai-monitoring`, le YAML du déploiement active deux collections nommées `inputs` et `predictions`, et `score.py` contient le code suivant.

    ```python
    from azureml.ai.monitoring import Collector

    def init():
        global inputs_collector, outputs_collector
        inputs_collector = Collector(name="inputs")
        outputs_collector = Collector(name="predictions")

    def run(data):
        input_df = parse(data)                         # pandas DataFrame
        context = inputs_collector.collect(input_df)
        output_df = predict(input_df)
        outputs_collector.collect(output_df, context)
        return output_df.to_dict()
    ```

    Des fichiers de données sont écrits dans le stockage. Vous devez faire en sorte que la surveillance du modèle reconnaisse automatiquement les données collectées, sans déclarer de données de production dans chaque signal de surveillance.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Rename the collectors and the collections to `model_inputs` and `model_outputs`.", fr: "Renommer les collecteurs et les collections en `model_inputs` et `model_outputs`." } }
    - { id: b, text: { en: "Rename the collections to `request` and `response`, and remove the collectors from `score.py`.", fr: "Renommer les collections en `request` et `response`, et supprimer les collecteurs de `score.py`." } }
    - { id: c, text: { en: "Set `sampling_rate: 1.0` in the `data_collector` section of the deployment.", fr: "Définir `sampling_rate: 1.0` dans la section `data_collector` du déploiement." } }
    - { id: d, text: { en: "Pass a custom correlation context to `collect()` for the inputs and the outputs.", fr: "Passer un contexte de corrélation personnalisé à `collect()` pour les entrées et les sorties." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Model monitoring automatically recognizes the data assets of collections named `model_inputs` and `model_outputs`. With other names, the data is collected but monitoring doesn't pick it up, so the collector names in `score.py` and the collection names in the deployment must match these reserved names.
    fr: |
      La surveillance du modèle reconnaît automatiquement les ressources de données des collections nommées `model_inputs` et `model_outputs`. Avec d'autres noms, les données sont collectées mais la surveillance ne les prend pas en compte : les noms des collecteurs dans `score.py` et ceux des collections dans le déploiement doivent correspondre à ces noms réservés.
  options:
    b: { en: "request and response log raw HTTP payloads, which aren't guaranteed to be tabular and need a preprocessing component before monitoring.", fr: "request et response journalisent les charges utiles HTTP brutes, qui ne sont pas forcément tabulaires et nécessitent un composant de prétraitement avant la surveillance." }
    c: { en: "The sampling rate controls the share of requests collected (1.0 is the default); it doesn't make monitoring recognize the data.", fr: "Le taux d'échantillonnage contrôle la part des requêtes collectées (1.0 par défaut) ; il ne permet pas à la surveillance de reconnaître les données." }
    d: { en: "A correlation ID joins inputs and outputs (an ID is generated by default); it doesn't change how monitoring finds the data assets.", fr: "Un ID de corrélation relie les entrées et les sorties (un ID est généré par défaut) ; il ne change pas la façon dont la surveillance trouve les ressources de données." }
references:
  - title: Collect production data from models for real-time inferencing
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-collect-production-data
