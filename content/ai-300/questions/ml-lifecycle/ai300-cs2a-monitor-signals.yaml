id: ai300-cs2a-monitor-signals
objective: "2.4.1"
type: yesno_statements
caseStudy: ai300-cs2a-blue-yonder
difficulty: 2
status: draft
stem:
  en: |
    You plan to configure Azure Machine Learning model monitoring for the blue deployment of ep-engine-rul to meet the monitoring requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de configurer la surveillance des modèles Azure Machine Learning pour le déploiement blue d'ep-engine-rul afin de respecter les exigences de surveillance.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To meet requirement 4, the data drift signal can use recent past production data as its reference data, without the training data of engine-rul.
        fr: Pour respecter l'exigence 4, le signal de dérive des données peut utiliser des données de production passées récentes comme données de référence, sans les données d'entraînement d'engine-rul.
    - id: s2
      text:
        en: The monitor can compute the data drift signal from the requests sent to ep-engine-rul even if data collection is not enabled on the blue deployment.
        fr: Le moniteur peut calculer le signal de dérive des données à partir des requêtes envoyées à ep-engine-rul même si la collecte de données n'est pas activée sur le déploiement blue.
    - id: s3
      text:
        en: To meet requirement 5, you can configure a model performance signal that uses the workshops' data asset as ground truth data, joined to the model outputs on the request ID.
        fr: Pour respecter l'exigence 5, vous pouvez configurer un signal de performances du modèle qui utilise la ressource de données des ateliers comme données de vérité terrain, jointes aux sorties du modèle sur l'ID de requête.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "When you do not specify reference data, the data drift signal compares production inference data with recent past production data. Monitoring reads the production inference data that the deployment collects, so data collection must be enabled on the deployment. The model performance signal compares the production outputs with a ground truth data asset; both must contain a unique ID per row (a correlation ID) so that each actual value can be matched with its prediction."
    fr: "Quand vous ne spécifiez pas de données de référence, le signal de dérive des données compare les données d'inférence de production aux données de production passées récentes. La surveillance lit les données d'inférence de production collectées par le déploiement : la collecte de données doit donc être activée sur le déploiement. Le signal de performances du modèle compare les sorties de production à une ressource de données de vérité terrain ; les deux doivent contenir un ID unique par ligne (ID de corrélation) pour associer chaque valeur réelle à sa prédiction."
references:
  - title: Monitor model performance in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance
