id: ai300-2b-reg-lineage-methods
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-litware**. A command job named **job-price-17** trained a regression model and logged it with `mlflow.sklearn.log_model(model, "model")` in the default artifact location. The job's run ID is the job name.

    You need to register the model in mlw-litware so that the registered version keeps its lineage to job-price-17.

    Which two actions can you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-litware**. Un travail command nommé **job-price-17** a entraîné un modèle de régression et l'a journalisé avec `mlflow.sklearn.log_model(model, "model")` dans l'emplacement d'artefacts par défaut. L'ID d'exécution du travail est le nom du travail.

    Vous devez inscrire le modèle dans mlw-litware pour que la version inscrite conserve sa traçabilité vers job-price-17.

    Quelles sont les deux actions que vous pouvez effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Call `mlflow.register_model(\"runs:/job-price-17/model\", \"price-model\")`.", fr: "Appeler `mlflow.register_model(\"runs:/job-price-17/model\", \"price-model\")`." } }
    - { id: b, text: { en: "Create a model YAML file with `path: ./model` and run `az ml model create -f model.yml`.", fr: "Créer un fichier YAML de modèle avec `path: ./model` et exécuter `az ml model create -f model.yml`." } }
    - { id: c, text: { en: "Copy the model folder to a datastore and run `az ml model create` with an `azureml://datastores/` path.", fr: "Copier le dossier du modèle dans un magasin de données et exécuter `az ml model create` avec un chemin `azureml://datastores/`." } }
    - { id: d, text: { en: "Run `az ml model create` with `--path azureml://jobs/job-price-17/outputs/artifacts/paths/model/` and `--type mlflow_model`.", fr: "Exécuter `az ml model create` avec `--path azureml://jobs/job-price-17/outputs/artifacts/paths/model/` et `--type mlflow_model`." } }
    - { id: e, text: { en: "Download the model folder, then call `mlflow.register_model(\"file:///tmp/model\", \"price-model\")`.", fr: "Télécharger le dossier du modèle, puis appeler `mlflow.register_model(\"file:///tmp/model\", \"price-model\")`." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Registering from the run with a `runs:/<run-id>/<path>` URI establishes the lineage between the registered model and the run. The `azureml://jobs/<job-name>/outputs/artifacts/paths/<path>/` URI points to the same default artifact location and also links the model to the job that trained it.
    fr: |
      L'inscription à partir de l'exécution avec un URI `runs:/<run-id>/<path>` établit la traçabilité entre le modèle inscrit et l'exécution. L'URI `azureml://jobs/<job-name>/outputs/artifacts/paths/<path>/` désigne le même emplacement d'artefacts par défaut et relie lui aussi le modèle au travail qui l'a entraîné.
  options:
    e: { en: "A `file://` URI registers a local copy, which has no link to the job.", fr: "Un URI `file://` inscrit une copie locale, qui n'a aucun lien avec le travail." }
    c: { en: "A datastore path registers files from storage without any link to the job that produced them.", fr: "Un chemin de magasin de données inscrit des fichiers du stockage sans aucun lien avec le travail qui les a produits." }
    b: { en: "A local path uploads the files at registration time, so the lineage to the job is lost.", fr: "Un chemin local charge les fichiers au moment de l'inscription : la traçabilité vers le travail est perdue." }
references:
  - title: Work with registered models in Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
  - title: Manage models registry in Azure Machine Learning with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models-mlflow
