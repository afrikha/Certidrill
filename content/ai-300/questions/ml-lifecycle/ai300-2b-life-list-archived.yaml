id: ai300-2b-life-list-archived
objective: "2.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace that contains a registered model named **churn-classifier**. Versions 1 and 2 are archived, and versions 3 to 6 are active.

    An auditor needs to see the archived versions of churn-classifier in the output of an Azure CLI command.

    Which two commands can you run? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning qui contient un modèle inscrit nommé **churn-classifier**. Les versions 1 et 2 sont archivées, et les versions 3 à 6 sont actives.

    Un auditeur doit voir les versions archivées de churn-classifier dans la sortie d'une commande Azure CLI.

    Quelles sont les deux commandes que vous pouvez exécuter ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "az ml model list --name churn-classifier" }
    - { id: b, text: "az ml model list --name churn-classifier --include-archived" }
    - { id: c, text: "az ml model restore --name churn-classifier" }
    - { id: d, text: "az ml model list --name churn-classifier --max-results 100" }
    - { id: e, text: "az ml model list --name churn-classifier --archived-only" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      `az ml model list` hides archived models by default. `--include-archived` lists archived and active versions together, and `--archived-only` lists only the archived ones.
    fr: |
      `az ml model list` masque par défaut les modèles archivés. `--include-archived` liste ensemble les versions archivées et actives, et `--archived-only` ne liste que les versions archivées.
  options:
    a: { en: "Without a flag, archived versions are hidden from the list.", fr: "Sans indicateur, les versions archivées sont masquées dans la liste." }
    d: { en: "`--max-results` limits the number of results; it doesn't include archived versions.", fr: "`--max-results` limite le nombre de résultats ; il n'inclut pas les versions archivées." }
    c: { en: "Restoring changes the state of the model instead of only showing the archived versions to the auditor.", fr: "La restauration change l'état du modèle au lieu de simplement montrer les versions archivées à l'auditeur." }
references:
  - title: az ml model
    url: https://learn.microsoft.com/en-us/cli/azure/ml/model
