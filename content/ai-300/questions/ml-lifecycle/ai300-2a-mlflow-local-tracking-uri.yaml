id: ai300-2a-mlflow-local-tracking-uri
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-contoso**.

    A data scientist trains a scikit-learn model in Visual Studio Code on her local computer. She installed the `mlflow` and `azureml-mlflow` packages and signed in by running `az login`. Her script calls `mlflow.log_param()` and `mlflow.log_metric()`.

    You need the runs of the script to be stored in mlw-contoso.

    What should she do?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-contoso**.

    Une data scientist entraîne un modèle scikit-learn dans Visual Studio Code sur son ordinateur local. Elle a installé les packages `mlflow` et `azureml-mlflow` et s'est connectée en exécutant `az login`. Son script appelle `mlflow.log_param()` et `mlflow.log_metric()`.

    Les exécutions du script doivent être stockées dans mlw-contoso.

    Que doit-elle faire ?
body:
  options:
    - id: a
      text: { en: "Call `mlflow.set_tracking_uri()` with the MLflow tracking URI of mlw-contoso before logging.", fr: "Appeler `mlflow.set_tracking_uri()` avec l'URI de suivi MLflow de mlw-contoso avant d'enregistrer." }
    - id: b
      text: { en: "Call `mlflow.set_experiment()` with the name of mlw-contoso before logging.", fr: "Appeler `mlflow.set_experiment()` avec le nom de mlw-contoso avant d'enregistrer." }
    - id: c
      text: { en: "Set the `AZUREML_CURRENT_CLOUD` environment variable to the name of mlw-contoso.", fr: "Définir la variable d'environnement `AZUREML_CURRENT_CLOUD` sur le nom de mlw-contoso." }
    - id: d
      text: { en: "Call `mlflow.autolog()` at the start of the script before logging.", fr: "Appeler `mlflow.autolog()` au début du script avant d'enregistrer." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Outside Azure Machine Learning compute, MLflow doesn't know where the workspace is. You retrieve the workspace tracking URI (it starts with `azureml://`, for example with `az ml workspace show --query mlflow_tracking_uri`) and pass it to `mlflow.set_tracking_uri()`. The `azureml-mlflow` plugin then authenticates, here with the Azure CLI credentials.
    fr: |
      Hors du calcul Azure Machine Learning, MLflow ne sait pas où se trouve l'espace de travail. Vous récupérez l'URI de suivi de l'espace de travail (il commence par `azureml://`, par exemple avec `az ml workspace show --query mlflow_tracking_uri`) et le passez à `mlflow.set_tracking_uri()`. Le plug-in `azureml-mlflow` s'authentifie ensuite, ici avec les informations d'identification d'Azure CLI.
  options:
    b:
      en: |
        An experiment groups runs inside a tracking server; it doesn't point MLflow to the workspace. Without a tracking URI, runs are stored locally.
      fr: |
        Une expérience regroupe des exécutions dans un serveur de suivi ; elle n'oriente pas MLflow vers l'espace de travail. Sans URI de suivi, les exécutions sont stockées localement.
    c:
      en: "`AZUREML_CURRENT_CLOUD` selects a nonpublic Azure cloud (such as AzureChinaCloud); it doesn't identify a workspace."
      fr: "`AZUREML_CURRENT_CLOUD` sélectionne un cloud Azure non public (comme AzureChinaCloud) ; elle n'identifie pas un espace de travail."
    d:
      en: |
        Autologging changes what is logged, not where it's stored.
      fr: |
        La journalisation automatique change ce qui est enregistré, pas l'endroit où c'est stocké.
references:
  - title: Configure MLflow for Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-mlflow-configure-tracking
