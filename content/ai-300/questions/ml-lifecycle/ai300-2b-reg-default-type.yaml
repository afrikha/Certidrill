id: ai300-2b-reg-default-type
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-proseware**. A training job named **job-churn-42** logged a model with `mlflow.sklearn.log_model(model, "model")`. You registered it by running the following command:

    ```bash
    az ml model create --name churn-classifier --version 1 --path runs:/job-churn-42/model/
    ```

    When you create an online deployment for version 1 without a scoring script or an environment, the deployment is rejected. You need to register a version that supports deployment without a scoring script or an environment, and that keeps the link to job-churn-42.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-proseware**. Un travail d'entraînement nommé **job-churn-42** a journalisé un modèle avec `mlflow.sklearn.log_model(model, "model")`. Vous l'avez inscrit en exécutant la commande suivante :

    ```bash
    az ml model create --name churn-classifier --version 1 --path runs:/job-churn-42/model/
    ```

    Quand vous créez un déploiement en ligne pour la version 1 sans script de scoring ni environnement, le déploiement est refusé. Vous devez inscrire une version qui prend en charge le déploiement sans script de scoring ni environnement, et qui conserve le lien avec job-churn-42.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run `az ml model update` on version 1 with `--set type=mlflow_model`.", fr: "Exécuter `az ml model update` sur la version 1 avec `--set type=mlflow_model`." } }
    - { id: b, text: { en: "Register version 2 with the same path and `--type mlflow_model`.", fr: "Inscrire la version 2 avec le même chemin et `--type mlflow_model`." } }
    - { id: c, text: { en: "Download the model files and register version 2 from the local folder with `--type mlflow_model`.", fr: "Télécharger les fichiers du modèle et inscrire la version 2 à partir du dossier local avec `--type mlflow_model`." } }
    - { id: d, text: { en: "Register version 2 with the same path and `--type triton_model`.", fr: "Inscrire la version 2 avec le même chemin et `--type triton_model`." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When `--type` is omitted, `az ml model create` registers a `custom_model`, which needs a scoring script and an environment to be deployed. Registering a new version from the same `runs:/` path with `--type mlflow_model` enables deployment without them and keeps the lineage to the run.
    fr: |
      Quand `--type` est omis, `az ml model create` inscrit un `custom_model`, qui nécessite un script de scoring et un environnement pour être déployé. Inscrire une nouvelle version à partir du même chemin `runs:/` avec `--type mlflow_model` permet le déploiement sans ces éléments et conserve la traçabilité vers l'exécution.
  options:
    a: { en: "Only the description and tags of a model version can be updated; other properties need a new version.", fr: "Seuls la description et les étiquettes d'une version de modèle peuvent être modifiées ; les autres propriétés nécessitent une nouvelle version." }
    c: { en: "Registering from a local folder uploads the files but loses the link to the job that trained the model.", fr: "Inscrire à partir d'un dossier local charge les fichiers, mais perd le lien avec le travail qui a entraîné le modèle." }
    d: { en: "The model is in MLflow format; `triton_model` is for models served with Triton Inference Server.", fr: "Le modèle est au format MLflow ; `triton_model` concerne les modèles servis par Triton Inference Server." }
references:
  - title: Work with registered models in Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
  - title: az ml model
    url: https://learn.microsoft.com/en-us/cli/azure/ml/model
