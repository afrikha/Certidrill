id: ai300-sr1-training-drift-2
objective: "2.4.1"
type: series_yesno
series: ai300-sr1-training-drift
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You configure a data drift signal without a reference_data section.
  fr: Vous configurez un signal de dérive des données sans section reference_data.
body:
  solution:
    en: |
      You create monitor.yaml with the same `$schema`, `name`, `trigger`, `compute`, `monitoring_target` and `alert_notification` settings as a daily monitor of `azureml:ep-loan:main`, and with the following `monitoring_signals` section:

      ```yaml
      monitoring_signals:
        input_drift:
          type: data_drift
          features:
            top_n_feature_importance: 10
          alert_enabled: true
          metric_thresholds:
            numerical:
              jensen_shannon_distance: 0.01
            categorical:
              pearsons_chi_squared_test: 0.02
      ```
    fr: |
      Vous créez monitor.yaml avec les mêmes paramètres `$schema`, `name`, `trigger`, `compute`, `monitoring_target` et `alert_notification` qu'un moniteur quotidien de `azureml:ep-loan:main`, et avec la section `monitoring_signals` suivante :

      ```yaml
      monitoring_signals:
        input_drift:
          type: data_drift
          features:
            top_n_feature_importance: 10
          alert_enabled: true
          metric_thresholds:
            numerical:
              jensen_shannon_distance: 0.01
            categorical:
              pearsons_chi_squared_test: 0.02
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      `reference_data` is optional, but when you omit it, the monitor uses recent past production inference data of the deployment as the comparison baseline. The signal would detect changes between recent and earlier production traffic, not divergence from the training data that the goal names. The goal isn't met.
    fr: |
      `reference_data` est facultatif, mais si vous l'omettez, le moniteur utilise les données d'inférence de production passées récentes du déploiement comme base de comparaison. Le signal détecterait des changements entre le trafic de production récent et antérieur, et non un écart par rapport aux données d'entraînement exigées par l'objectif. L'objectif n'est pas atteint.
references:
  - title: Monitor model performance in production - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance?view=azureml-api-2
