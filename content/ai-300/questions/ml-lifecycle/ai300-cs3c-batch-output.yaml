id: ai300-cs3c-batch-output
objective: "2.3.2"
type: single
caseStudy: ai300-cs3c-fourth-coffee
difficulty: 3
status: draft
stem:
  en: |
    You need to fix the nightly scoring of forecast-batch. The solution must meet demand forecasting requirement 3.

    What should you do?
  fr: |
    Vous devez corriger le scoring nocturne de forecast-batch. La solution doit respecter l'exigence 3 de prévision de la demande.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Set `error_threshold` to -1 in the settings of forecast-v3."
        fr: "Régler `error_threshold` sur -1 dans les paramètres de forecast-v3."
    - id: b
      text:
        en: "Set `output_action` to `summary_only` in the settings of forecast-v3."
        fr: "Régler `output_action` sur `summary_only` dans les paramètres de forecast-v3."
    - id: c
      text:
        en: "Set `retry_settings.max_retries` to 10 in the settings of forecast-v3."
        fr: "Régler `retry_settings.max_retries` sur 10 dans les paramètres de forecast-v3."
    - id: d
      text:
        en: "Add `--set output_file_name=forecast_<date>.csv` to the invoke command, with the date of the night."
        fr: "Ajouter `--set output_file_name=forecast_<date>.csv` à la commande invoke, avec la date de la nuit."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Every night the job writes forecast.csv to the same output path, and a batch scoring job fails when the output file already exists. Overriding `output_file_name` at invocation time with a name that is unique per night keeps the previous files and still produces one merged file, because `append_row` stays in place.
    fr: |
      Chaque nuit, le travail écrit forecast.csv dans le même chemin de sortie, et un travail de scoring par lots échoue quand le fichier de sortie existe déjà. Remplacer `output_file_name` au moment de l'appel par un nom unique pour chaque nuit conserve les fichiers précédents et produit toujours un fichier fusionné, car `append_row` reste en place.
  options:
    a:
      en: |
        `error_threshold` sets how many failed input files are tolerated; the input files are valid, and the conflict on the output file remains.
      fr: |
        `error_threshold` définit le nombre de fichiers d'entrée en échec tolérés ; les fichiers d'entrée sont valides, et le conflit sur le fichier de sortie demeure.
    b:
      en: |
        `summary_only` doesn't merge the outputs into one file, which requirement 3 asks for.
      fr: |
        `summary_only` ne fusionne pas les sorties dans un fichier, ce que demande l'exigence 3.
    c:
      en: |
        Retries apply to failed mini-batches during scoring; they don't resolve an output file that already exists.
      fr: |
        Les nouvelles tentatives s'appliquent aux mini-lots en échec pendant le scoring ; elles ne résolvent pas un fichier de sortie qui existe déjà.
references:
  - title: Deploy models for scoring in batch endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-batch-model-deployments
