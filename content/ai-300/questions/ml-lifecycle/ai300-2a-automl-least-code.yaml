id: ai300-2a-automl-least-code
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Machine Learning workspace that contains a registered MLTable data asset named **loan-history**. Each row describes a past loan and has a column named **defaulted** that contains Yes or No.

    The data scientists need to compare many algorithms and featurization options to find the model that best predicts **defaulted**. They want to write as little training code as possible.

    What should you use?
  fr: |
    Woodgrove Bank dispose d'un espace de travail Azure Machine Learning qui contient une ressource de données MLTable inscrite nommée **loan-history**. Chaque ligne décrit un prêt passé et possède une colonne nommée **defaulted** qui contient Yes ou No.

    Les data scientists doivent comparer de nombreux algorithmes et options de caractérisation pour trouver le modèle qui prédit le mieux **defaulted**. Ils veulent écrire le moins de code d'entraînement possible.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "An AutoML regression job", fr: "Un travail AutoML de régression" } }
    - { id: b, text: { en: "A sweep job over a scikit-learn training script", fr: "Un travail de balayage sur un script d'entraînement scikit-learn" } }
    - { id: c, text: { en: "An AutoML classification job", fr: "Un travail AutoML de classification" } }
    - { id: d, text: { en: "A command job that runs a LightGBM training script", fr: "Un travail de commande qui exécute un script d'entraînement LightGBM" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Automated machine learning trains many combinations of algorithms and featurization for you and ranks them by a primary metric, with no training script to write. Predicting a Yes/No value is a classification task, so you create an AutoML classification job on the MLTable.
    fr: |
      Le machine learning automatisé entraîne pour vous de nombreuses combinaisons d'algorithmes et de caractérisation et les classe selon une métrique principale, sans script d'entraînement à écrire. Prédire une valeur Yes/No est une tâche de classification : vous créez un travail AutoML de classification sur la MLTable.
  options:
    a:
      en: |
        Regression predicts a continuous numeric value, not a Yes/No category.
      fr: |
        La régression prédit une valeur numérique continue, pas une catégorie Yes/No.
    b:
      en: |
        A sweep job tunes the hyperparameters of one script that you must write; it doesn't compare algorithms and featurization for you.
      fr: |
        Un travail de balayage règle les hyperparamètres d'un script que vous devez écrire ; il ne compare pas les algorithmes et la caractérisation à votre place.
    d:
      en: |
        A command job runs a single script with a single algorithm that you write yourself.
      fr: |
        Un travail de commande exécute un seul script avec un seul algorithme que vous écrivez vous-même.
references:
  - title: Set up AutoML training for tabular data with the Azure Machine Learning CLI and Python SDK
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-auto-train
