id: ai300-2b-life-share-registry
objective: "2.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have two Azure Machine Learning workspaces named **mlw-dev** and **mlw-prod**, and a registry named **reg-contoso** whose regions include the region of mlw-prod. Version 5 of the model **churn-classifier** was registered in mlw-dev from a job output and was tested on an endpoint in mlw-dev.

    You need to promote version 5 to mlw-prod by copying it to reg-contoso as version 5 of churn-classifier, keeping its link to the training job, and then deploy it to an online endpoint in mlw-prod.

    How should you complete the command and the deployment file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de deux espaces de travail Azure Machine Learning nommés **mlw-dev** et **mlw-prod**, et d'un registre nommé **reg-contoso** dont les régions incluent celle de mlw-prod. La version 5 du modèle **churn-classifier** a été inscrite dans mlw-dev à partir d'une sortie de travail et testée sur un point de terminaison de mlw-dev.

    Vous devez promouvoir la version 5 vers mlw-prod en la copiant dans reg-contoso en tant que version 5 de churn-classifier, en conservant son lien avec le travail d'entraînement, puis la déployer sur un point de terminaison en ligne de mlw-prod.

    Comment devez-vous compléter la commande et le fichier de déploiement ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    # Azure CLI, run against mlw-dev
    az ml model [[s1]] --name churn-classifier --version 5 \
      --registry-name reg-contoso \
      [[s2]] \
      --resource-group rg-ml --workspace-name mlw-dev

    # deploy.yml, used with az ml online-deployment create in mlw-prod
    model: [[s3]]
  slots:
    - id: s1
      options:
        - { id: s1a, text: share }
        - { id: s1b, text: create }
        - { id: s1d, text: download }
        - { id: s1c, text: archive }
    - id: s2
      options:
        - { id: s2b, text: "--path azureml:churn-classifier:5" }
        - { id: s2c, text: "--type mlflow_model" }
        - { id: s2a, text: "--share-with-name churn-classifier --share-with-version 5" }
    - id: s3
      options:
        - { id: s3a, text: "azureml://registries/reg-contoso/models/churn-classifier/versions/5" }
        - { id: s3c, text: "models:/churn-classifier/5" }
        - { id: s3b, text: "azureml:churn-classifier:5" }
        - { id: s3d, text: "azureml://registries/reg-contoso/churn-classifier:5" }
answer:
  values: { s1: s1a, s2: s2a, s3: s3a }
explanation:
  correct:
    en: |
      `az ml model share` copies a workspace model version to a registry; `--share-with-name` and `--share-with-version` are required and set the name and version in the registry. A model copied from a job output keeps its link to the training job. Other workspaces reference it as `azureml://registries/<registry>/models/<name>/versions/<version>`.
    fr: |
      `az ml model share` copie une version de modèle d'un espace de travail vers un registre ; `--share-with-name` et `--share-with-version` sont obligatoires et définissent le nom et la version dans le registre. Un modèle copié à partir d'une sortie de travail conserve son lien avec le travail d'entraînement. Les autres espaces de travail le référencent sous la forme `azureml://registries/<registry>/models/<name>/versions/<version>`.
  options:
    s1b: { en: "`create` with `--registry-name` registers a new model from a path in the registry; it doesn't copy the existing workspace version.", fr: "`create` avec `--registry-name` inscrit un nouveau modèle dans le registre à partir d'un chemin ; il ne copie pas la version existante de l'espace de travail." }
    s2b: { en: "`share` takes the source version from `--name` and `--version`; it requires the target name and version, not a path.", fr: "`share` prend la version source dans `--name` et `--version` ; il exige le nom et la version cibles, pas un chemin." }
    s2c: { en: "The type is already set on the source version, and the required target name and version would be missing.", fr: "Le type est déjà défini sur la version source, et le nom et la version cibles obligatoires manqueraient." }
    s3b: { en: "This references a model in the workspace of the deployment, and mlw-prod has no such model.", fr: "Cette référence désigne un modèle de l'espace de travail du déploiement, et mlw-prod ne contient pas ce modèle." }
    s3c: { en: "`models:/` is an MLflow URI for loading models, not a deployment model reference.", fr: "`models:/` est un URI MLflow pour charger des modèles, pas une référence de modèle de déploiement." }
    s3d: { en: "Registry model references use the `models/<name>/versions/<version>` path.", fr: "Les références de modèles de registre utilisent le chemin `models/<name>/versions/<version>`." }
references:
  - title: Share models, components, and environments across workspaces with registries
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
  - title: az ml model
    url: https://learn.microsoft.com/en-us/cli/azure/ml/model
