id: ai300-2a-automl-featurization-custom
objective: "2.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have an AutoML regression job object named `regression_job` that predicts insurance premiums from an MLTable.

    You need to change the featurization as follows:

    - Missing values in the **Income** column must be replaced by the most frequent value.
    - The **ZipCode** column, which contains numbers, must be treated as a categorical feature.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un objet de travail AutoML de régression nommé `regression_job` qui prédit des primes d'assurance à partir d'une MLTable.

    Vous devez modifier la caractérisation comme suit :

    - Les valeurs manquantes de la colonne **Income** doivent être remplacées par la valeur la plus fréquente.
    - La colonne **ZipCode**, qui contient des nombres, doit être traitée comme une caractéristique catégorielle.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.ai.ml.automl import ColumnTransformer

    transformer_params = {
        "[[key]]": [
            ColumnTransformer(fields=["Income"], parameters={"strategy": "most_frequent"}),
        ],
    }
    regression_job.set_featurization(
        mode="[[mode]]",
        transformer_params=transformer_params,
        [[types]]={"ZipCode": "Categorical"},
    )
  slots:
    - id: key
      options:
        - { id: k-blocked, text: blocked_transformers }
        - { id: k-imputer, text: imputer }
        - { id: k-types, text: column_name_and_types }
    - id: mode
      options:
        - { id: md-auto, text: auto }
        - { id: md-off, text: "off" }
        - { id: md-custom, text: custom }
    - id: types
      options:
        - { id: t-types, text: column_name_and_types }
        - { id: t-blocked, text: blocked_transformers }
        - { id: t-allowed, text: allowed_training_algorithms }
answer:
  values: { key: k-imputer, mode: md-custom, types: t-types }
explanation:
  correct:
    en: "Customized featurization uses `mode=\"custom\"`. In `transformer_params`, the `imputer` key holds `ColumnTransformer` objects that set the imputation strategy per column, here `most_frequent` for Income. `column_name_and_types` overrides the detected type of a column, here Categorical for ZipCode."
    fr: "La caractérisation personnalisée utilise `mode=\"custom\"`. Dans `transformer_params`, la clé `imputer` contient des objets `ColumnTransformer` qui définissent la stratégie d'imputation par colonne, ici `most_frequent` pour Income. `column_name_and_types` remplace le type détecté d'une colonne, ici Categorical pour ZipCode."
  options:
    k-blocked: { en: "blocked_transformers is a separate parameter that lists transformers to skip, not a key of transformer_params.", fr: "blocked_transformers est un paramètre distinct qui liste les transformateurs à ignorer, pas une clé de transformer_params." }
    md-auto: { en: "auto applies the default featurization and ignores per-column customizations.", fr: "auto applique la caractérisation par défaut et ignore les personnalisations par colonne." }
    md-off: { en: "off disables automatic featurization.", fr: "off désactive la caractérisation automatique." }
    t-blocked: { en: "blocked_transformers excludes transformers such as LabelEncoding; it doesn't set column types.", fr: "blocked_transformers exclut des transformateurs comme LabelEncoding ; il ne définit pas les types de colonnes." }
    t-allowed: { en: "allowed_training_algorithms is a training setting of set_training().", fr: "allowed_training_algorithms est un paramètre d'entraînement de set_training()." }
references:
  - title: Set up AutoML training for tabular data with the Azure Machine Learning CLI and Python SDK
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-auto-train
