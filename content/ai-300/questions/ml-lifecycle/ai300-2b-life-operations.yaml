id: ai300-2b-life-operations
objective: "2.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You manage the registered models of an Azure Machine Learning workspace named **mlw-tailspin**.

    Which operation should you use for each task? To answer, drag the appropriate operations to the correct tasks. Each operation may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez les modèles inscrits d'un espace de travail Azure Machine Learning nommé **mlw-tailspin**.

    Quelle opération devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les opérations appropriées vers les tâches correspondantes. Chaque opération peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rest, text: az ml model restore }
    - { id: arch, text: az ml model archive }
    - { id: del, text: MlflowClient().delete_model_version() }
    - { id: dl, text: az ml model download }
    - { id: share, text: az ml model share }
    - { id: upd, text: az ml model update }
  targets:
    - { id: t1, text: { en: "Permanently remove version 2 of a model", fr: "Supprimer définitivement la version 2 d'un modèle" } }
    - { id: t2, text: { en: "Copy version 5 to a registry so that other workspaces can deploy it", fr: "Copier la version 5 dans un registre pour que d'autres espaces de travail puissent la déployer" } }
    - { id: t3, text: { en: "Change the description of version 5", fr: "Modifier la description de la version 5" } }
    - { id: t4, text: { en: "Get all the files of version 5 on a local computer", fr: "Récupérer tous les fichiers de la version 5 sur un ordinateur local" } }
answer:
  mapping: { t1: del, t2: share, t3: upd, t4: dl }
explanation:
  correct:
    en: |
      The `az ml model` group has no delete subcommand; a model version is deleted with `MlflowClient().delete_model_version()`. `share` copies a workspace version to a registry, `update` changes the description and tags, and `download` downloads all model files.
    fr: |
      Le groupe `az ml model` ne comporte pas de sous-commande de suppression ; une version de modèle se supprime avec `MlflowClient().delete_model_version()`. `share` copie une version de l'espace de travail dans un registre, `update` modifie la description et les étiquettes, et `download` télécharge tous les fichiers du modèle.
  options:
    arch: { en: "Archiving hides a version from list queries but doesn't remove it.", fr: "L'archivage masque une version dans les requêtes de liste, mais ne la supprime pas." }
    rest: { en: "Restoring makes an archived model visible again in list queries.", fr: "La restauration rend un modèle archivé de nouveau visible dans les requêtes de liste." }
references:
  - title: az ml model
    url: https://learn.microsoft.com/en-us/cli/azure/ml/model
  - title: Manage models registry in Azure Machine Learning with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models-mlflow
