id: ai300-2c-latency-sources
objective: "2.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a managed online endpoint named **ep-retail** with two deployments, **blue** and **green**, and a Log Analytics workspace named **law-retail**. No diagnostic setting is configured on the endpoint.

    You need to compare, in law-retail, the end-to-end duration of the individual scoring requests served by blue and by green.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un point de terminaison en ligne managé nommé **ep-retail** avec deux déploiements, **blue** et **green**, et d'un espace de travail Log Analytics nommé **law-retail**. Aucun paramètre de diagnostic n'est configuré sur le point de terminaison.

    Vous devez comparer, dans law-retail, la durée de bout en bout des requêtes de scoring individuelles servies par blue et par green.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable the `model_inputs` and `model_outputs` collections on both deployments.", fr: "Activer les collections `model_inputs` et `model_outputs` sur les deux déploiements." } }
    - { id: b, text: { en: "Query AmlOnlineEndpointTrafficLog and summarize `TotalDurationMs` by `DeploymentName`.", fr: "Interroger AmlOnlineEndpointTrafficLog et agréger `TotalDurationMs` par `DeploymentName`." } }
    - { id: c, text: { en: "Query AmlOnlineEndpointEventLog and summarize the events by `DeploymentName`.", fr: "Interroger AmlOnlineEndpointEventLog et agréger les événements par `DeploymentName`." } }
    - { id: d, text: { en: "Add a diagnostic setting on ep-retail that sends the traffic logs to law-retail.", fr: "Ajouter sur ep-retail un paramètre de diagnostic qui envoie les journaux de trafic vers law-retail." } }
    - { id: e, text: { en: "Create a prediction drift signal that uses blue's outputs as reference data.", fr: "Créer un signal de dérive des prédictions qui utilise les sorties de blue comme données de référence." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The endpoint log tables are sent to Log Analytics only through a diagnostic setting on the endpoint (the first data can take up to an hour). Each record of AmlOnlineEndpointTrafficLog carries the deployment name and the request durations, with `TotalDurationMs` for the end-to-end time.
    fr: |
      Les tables de journaux du point de terminaison ne sont envoyées vers Log Analytics que par un paramètre de diagnostic sur le point de terminaison (les premières données peuvent mettre jusqu'à une heure). Chaque enregistrement d'AmlOnlineEndpointTrafficLog contient le nom du déploiement et les durées de la requête, avec `TotalDurationMs` pour la durée de bout en bout.
  options:
    a: { en: "The data collector stores inputs and outputs in blob storage for model monitoring; it doesn't record request durations in Log Analytics.", fr: "Le collecteur de données stocke les entrées et les sorties dans le stockage blob pour la surveillance du modèle ; il n'enregistre pas les durées de requête dans Log Analytics." }
    c: { en: "The event log records container events (probe failures, restarts), not request durations.", fr: "Le journal des événements enregistre des événements de conteneur (échecs de sonde, redémarrages), pas des durées de requête." }
    e: { en: "Prediction drift compares output distributions; it doesn't measure latency.", fr: "La dérive des prédictions compare des distributions de sorties ; elle ne mesure pas la latence." }
references:
  - title: Monitor online endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-online-endpoints
