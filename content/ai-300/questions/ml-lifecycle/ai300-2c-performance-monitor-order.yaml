id: ai300-2c-performance-monitor-order
objective: "2.4.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a custom churn model deployed as **blue** on the managed online endpoint **ep-churn**. The scoring script doesn't collect any data yet. Whether a customer actually churned is known 60 days after the prediction.

    You need to configure Azure Machine Learning to alert you when the accuracy of the model in production falls below 0.9.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'un modèle d'attrition personnalisé déployé en tant que **blue** sur le point de terminaison en ligne managé **ep-churn**. Le script de scoring ne collecte encore aucune donnée. Le fait qu'un client soit réellement parti n'est connu que 60 jours après la prédiction.

    Vous devez configurer Azure Machine Learning pour recevoir une alerte quand l'exactitude du modèle en production passe sous 0,9.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: collect, text: { en: "Update blue so that score.py collects `model_outputs` with a column that contains a unique request ID.", fr: "Mettre à jour blue pour que score.py collecte `model_outputs` avec une colonne contenant un ID de requête unique." } }
    - { id: gt, text: { en: "Register the actual outcomes, with the same request ID column, as a data asset.", fr: "Inscrire les résultats réels, avec la même colonne d'ID de requête, en tant que ressource de données." } }
    - { id: yaml, text: { en: "Write a schedule file with a `model_performance` signal that references both data assets and an accuracy threshold of 0.9.", fr: "Rédiger un fichier de planification avec un signal `model_performance` qui référence les deux ressources de données et un seuil d'exactitude de 0,9." } }
    - { id: create, text: { en: "Run `az ml schedule create` with the schedule file.", fr: "Exécuter `az ml schedule create` avec le fichier de planification." } }
    - { id: diag, text: { en: "Add a diagnostic setting that sends AmlOnlineEndpointTrafficLog to Log Analytics.", fr: "Ajouter un paramètre de diagnostic qui envoie AmlOnlineEndpointTrafficLog vers Log Analytics." } }
    - { id: drift, text: { en: "Add a `data_drift` signal that uses the training data as reference data.", fr: "Ajouter un signal `data_drift` qui utilise les données d'entraînement comme données de référence." } }
answer:
  sequence: [ collect, gt, yaml, create ]
explanation:
  correct:
    en: |
      The model performance signal joins production outputs with ground truth on a correlation ID, so predictions must first be collected with an ID column, then the actual outcomes are registered with the same ID once they are known. The signal and its `metric_thresholds` are declared in a schedule file, which `az ml schedule create` turns into a recurring monitor.
    fr: |
      Le signal de performances du modèle joint les sorties de production et la vérité terrain sur un ID de corrélation : il faut d'abord collecter les prédictions avec une colonne d'ID, puis inscrire les résultats réels avec le même ID quand ils sont connus. Le signal et ses `metric_thresholds` sont déclarés dans un fichier de planification, que `az ml schedule create` transforme en surveillance récurrente.
  options:
    diag: { en: "Endpoint logs describe requests and durations; they aren't used to compute accuracy.", fr: "Les journaux du point de terminaison décrivent les requêtes et les durées ; ils ne servent pas à calculer l'exactitude." }
    drift: { en: "Data drift detects input changes but doesn't measure accuracy.", fr: "La dérive des données détecte des changements d'entrées mais ne mesure pas l'exactitude." }
references:
  - title: Monitor model performance in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance
  - title: Collect production data from models for real-time inferencing
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-collect-production-data
