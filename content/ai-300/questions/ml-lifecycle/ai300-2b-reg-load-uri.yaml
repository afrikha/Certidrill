id: ai300-2b-reg-load-uri
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace that contains a registered MLflow model named **churn-classifier** with four versions. In a notebook, the MLflow tracking URI points to the workspace.

    You need to load version 4 of the model to score a pandas DataFrame.

    Which code should you use?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning qui contient un modèle MLflow inscrit nommé **churn-classifier** possédant quatre versions. Dans un notebook, l'URI de suivi MLflow pointe vers l'espace de travail.

    Vous devez charger la version 4 du modèle pour évaluer un DataFrame pandas.

    Quel code devez-vous utiliser ?
body:
  options:
    - { id: a, text: "mlflow.pyfunc.load_model(\"azureml:churn-classifier:4\")" }
    - { id: b, text: "mlflow.pyfunc.load_model(\"models:/4/churn-classifier\")" }
    - { id: c, text: "mlflow.pyfunc.load_model(\"models:/churn-classifier/4\")" }
    - { id: d, text: "mlflow.pyfunc.load_model(\"runs:/churn-classifier/4\")" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Registered models are loaded with the URI `models:/<model-name>/<version-number>`; `models:/<model-name>/latest` loads the last version. `mlflow.pyfunc.load_model()` returns a model whose `predict` function accepts a pandas DataFrame.
    fr: |
      Les modèles inscrits se chargent avec l'URI `models:/<model-name>/<version-number>` ; `models:/<model-name>/latest` charge la dernière version. `mlflow.pyfunc.load_model()` renvoie un modèle dont la fonction `predict` accepte un DataFrame pandas.
  options:
    d: { en: "A `runs:/` URI expects a run ID and an artifact path, not a model name and version.", fr: "Un URI `runs:/` attend un ID d'exécution et un chemin d'artefact, pas un nom de modèle et une version." }
    a: { en: "`azureml:<name>:<version>` references an asset in Azure Machine Learning YAML and CLI, not an MLflow model URI.", fr: "`azureml:<name>:<version>` référence un actif dans les fichiers YAML et l'interface CLI d'Azure Machine Learning ; ce n'est pas un URI de modèle MLflow." }
    b: { en: "The model name comes before the version in a `models:/` URI.", fr: "Le nom du modèle précède la version dans un URI `models:/`." }
references:
  - title: Manage models registry in Azure Machine Learning with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models-mlflow
