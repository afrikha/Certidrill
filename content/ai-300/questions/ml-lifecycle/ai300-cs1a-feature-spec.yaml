id: ai300-cs1a-feature-spec
objective: "2.2.1"
type: single
caseStudy: ai300-cs1a-relecloud-bank
difficulty: 2
status: draft
stem:
  en: |
    The data scientists generated a feature retrieval specification for the features of fs-rc-cards that fraud-lgbm uses. The nightly batch scoring pipeline starts with the built-in feature retrieval component.

    You need to meet the feature requirements. What should you do?
  fr: |
    Les data scientists ont généré une spécification de récupération de caractéristiques pour les caractéristiques de fs-rc-cards qu'utilise fraud-lgbm. Le pipeline de scoring par lots nocturne commence par le composant intégré de récupération de caractéristiques.

    Vous devez respecter les exigences relatives aux caractéristiques. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Place feature_retrieval_spec.yaml in the root folder of each model version, and pass the registered model to the input_model input of the component
        fr: Placer feature_retrieval_spec.yaml dans le dossier racine de chaque version du modèle, et transmettre le modèle inscrit à l'entrée input_model du composant
    - id: b
      text:
        en: Register feature_retrieval_spec.yaml as a data asset, and pass that data asset to the feature_retrieval_spec input of the component
        fr: Inscrire feature_retrieval_spec.yaml comme ressource de données, et transmettre cette ressource à l'entrée feature_retrieval_spec du composant
    - id: c
      text:
        en: Place feature_retrieval_spec.yaml in a features subfolder of each model version, and pass the registered model to the input_model input of the component
        fr: Placer feature_retrieval_spec.yaml dans un sous-dossier features de chaque version du modèle, et transmettre le modèle inscrit à l'entrée input_model du composant
    - id: d
      text:
        en: Store the list of feature names in a tag of each model version, and read the tag in the batch scoring script to select the features
        fr: Stocker la liste des noms de caractéristiques dans une étiquette de chaque version du modèle, et lire l'étiquette dans le script de scoring par lots
answer: { optionId: a }
explanation:
  correct:
    en: A feature retrieval specification packaged with the model must be named feature_retrieval_spec.yaml and placed under the root folder of the model artifact. The lineage between a registered model and its feature sets is tracked only when the specification is in the model artifact, and the feature retrieval component can then take the registered model as input_model and read the specification from it, so no separate feature list is maintained.
    fr: Une spécification de récupération de caractéristiques empaquetée avec le modèle doit se nommer feature_retrieval_spec.yaml et se trouver dans le dossier racine de l'artefact du modèle. La traçabilité entre un modèle inscrit et ses ensembles de caractéristiques n'est suivie que si la spécification se trouve dans l'artefact du modèle, et le composant de récupération de caractéristiques peut alors prendre le modèle inscrit comme input_model et y lire la spécification ; aucune liste de caractéristiques distincte n'est tenue à jour.
  options:
    b: { en: "A specification passed separately retrieves features, but it isn't tied to a model version and gives no model-to-feature-set lineage; the team would have to keep the right file for each version.", fr: "Une spécification transmise séparément récupère des caractéristiques, mais elle n'est liée à aucune version du modèle et ne donne pas de traçabilité entre le modèle et les ensembles de caractéristiques ; l'équipe devrait conserver le bon fichier pour chaque version." }
    c: { en: "The specification must be under the root folder of the model artifact; the system doesn't look for it in a subfolder.", fr: "La spécification doit se trouver dans le dossier racine de l'artefact du modèle ; le système ne la cherche pas dans un sous-dossier." }
    d: { en: "A tag is a separate list maintained by hand, the feature retrieval component doesn't read it, and it creates no lineage to the feature sets.", fr: "Une étiquette est une liste distincte tenue à jour à la main, le composant de récupération de caractéristiques ne la lit pas, et elle ne crée aucune traçabilité vers les ensembles de caractéristiques." }
references:
  - title: Feature retrieval specification and usage in training and inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/feature-retrieval-concepts
