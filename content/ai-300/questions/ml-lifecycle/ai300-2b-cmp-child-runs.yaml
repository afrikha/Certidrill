id: ai300-2b-cmp-child-runs
objective: "2.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace. You submitted a sweep job, and its parent run ID is stored in the variable `parent_id`. Some trials completed, some failed, and some were canceled.

    You need to use `mlflow.search_runs` to return only the trials of this sweep job that completed successfully, so that you can compare their metrics.

    Which two conditions should you combine in `filter_string`? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning. Vous avez soumis un travail de balayage (sweep) dont l'ID d'exécution parente est stocké dans la variable `parent_id`. Certains essais se sont terminés, d'autres ont échoué et d'autres ont été annulés.

    Vous devez utiliser `mlflow.search_runs` pour ne renvoyer que les essais de ce travail de balayage qui se sont terminés correctement, afin de comparer leurs métriques.

    Quelles sont les deux conditions à combiner dans `filter_string` ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "tags.mlflow.parentRunId = '{parent_id}'" }
    - { id: b, text: "attributes.status != 'Killed'" }
    - { id: c, text: "params.parentRunId = '{parent_id}'" }
    - { id: d, text: "attributes.status = 'Finished'" }
    - { id: e, text: "attributes.status = 'Completed'" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Child runs, such as the trials of a sweep job, carry the tag `mlflow.parentRunId`, so `tags.mlflow.parentRunId` selects the trials of one parent. MLflow reports the Azure Machine Learning status Completed as `Finished`, so `attributes.status = 'Finished'` keeps only the successful trials.
    fr: |
      Les exécutions enfants, comme les essais d'un travail de balayage, portent l'étiquette `mlflow.parentRunId` : `tags.mlflow.parentRunId` sélectionne donc les essais d'un parent. MLflow indique l'état Completed d'Azure Machine Learning sous la forme `Finished` : `attributes.status = 'Finished'` ne conserve que les essais réussis.
  options:
    e: { en: "Completed is the status shown by Azure Machine Learning; in MLflow queries the same status is `Finished`.", fr: "Completed est l'état affiché par Azure Machine Learning ; dans les requêtes MLflow, ce même état s'appelle `Finished`." }
    c: { en: "The parent run ID is stored in a tag, not in a parameter.", fr: "L'ID de l'exécution parente est stocké dans une étiquette, pas dans un paramètre." }
    b: { en: "Excluding canceled runs still keeps the failed trials, whose MLflow status is `Failed`.", fr: "Exclure les exécutions annulées conserve tout de même les essais en échec, dont l'état MLflow est `Failed`." }
references:
  - title: Query & compare experiments and runs with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-track-experiments-mlflow
