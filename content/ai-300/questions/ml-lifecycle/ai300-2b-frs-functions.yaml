id: ai300-2b-frs-functions
objective: "2.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You use the `azureml-featurestore` package with a managed feature store in Azure Machine Learning.

    Which function or method should you use for each task? To answer, drag the appropriate functions or methods to the correct tasks. Each function or method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez le package `azureml-featurestore` avec un magasin de caractéristiques managé dans Azure Machine Learning.

    Quelle fonction ou méthode devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les fonctions ou méthodes appropriées vers les tâches correspondantes. Chaque fonction ou méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: onl, text: init_online_lookup() }
    - { id: uri, text: resolve_feature_uri() }
    - { id: res, text: resolve_feature_retrieval_spec() }
    - { id: gen, text: generate_feature_retrieval_spec() }
    - { id: off, text: get_offline_features() }
  targets:
    - { id: t1, text: { en: "Write a specification file for the features selected in a notebook", fr: "Écrire un fichier de spécification pour les caractéristiques sélectionnées dans un notebook" } }
    - { id: t2, text: { en: "Load the feature list from the specification packaged in a model folder", fr: "Charger la liste des caractéristiques à partir de la spécification empaquetée dans un dossier de modèle" } }
    - { id: t3, text: { en: "Build a training DataFrame with a point-in-time join in a Spark session", fr: "Créer un DataFrame d'entraînement par jointure à un instant donné dans une session Spark" } }
    - { id: t4, text: { en: "Prepare feature lookup from the online store in the `init()` function of a scoring script", fr: "Préparer la recherche de caractéristiques dans le magasin en ligne dans la fonction `init()` d'un script de scoring" } }
answer:
  mapping: { t1: gen, t2: res, t3: off, t4: onl }
explanation:
  correct:
    en: |
      `generate_feature_retrieval_spec()` writes the specification for a list of features, and `resolve_feature_retrieval_spec()` reads it back as a feature list. `get_offline_features()` joins features to observation data at the right point in time to produce training data. In a scoring script, `init_online_lookup()` prepares online lookup for the resolved features.
    fr: |
      `generate_feature_retrieval_spec()` écrit la spécification d'une liste de caractéristiques, et `resolve_feature_retrieval_spec()` la relit sous forme de liste de caractéristiques. `get_offline_features()` joint les caractéristiques aux données d'observation au bon instant pour produire les données d'entraînement. Dans un script de scoring, `init_online_lookup()` prépare la recherche en ligne pour les caractéristiques résolues.
  options:
    uri: { en: "`resolve_feature_uri()` selects features from URIs such as `transactions:1:transaction_amount_7d_avg`; none of the tasks needs it.", fr: "`resolve_feature_uri()` sélectionne des caractéristiques à partir d'URI comme `transactions:1:transaction_amount_7d_avg` ; aucune des tâches n'en a besoin." }
references:
  - title: Feature retrieval specification and usage in training and inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/feature-retrieval-concepts
