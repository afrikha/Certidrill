id: ai300-2b-rai-connect-compute
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace. A Responsible AI dashboard with explanations, error analysis and counterfactuals is attached to a registered model.

    Reviewers open the dashboard from the **Responsible AI** tab of the model. They can see the precomputed charts, but they can't generate new what-if counterfactual data points or display individual conditional expectation (ICE) plots. You need to enable these features for the reviewers.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning. Un tableau de bord Responsible AI comportant des explications, une analyse des erreurs et des contrefactuels est associé à un modèle inscrit.

    Des réviseurs ouvrent le tableau de bord depuis l'onglet **Responsible AI** du modèle. Ils voient les graphiques précalculés, mais ne peuvent ni générer de nouveaux points de données contrefactuels de simulation ni afficher de tracés d'espérance conditionnelle individuelle (ICE). Vous devez activer ces fonctionnalités pour les réviseurs.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Increase the maximum number of nodes of the compute cluster that ran the dashboard job.", fr: "Augmenter le nombre maximal de nœuds du cluster de calcul qui a exécuté le travail du tableau de bord." } }
    - { id: b, text: { en: "Select a running compute instance in the Compute list of the dashboard.", fr: "Sélectionner une instance de calcul en cours d'exécution dans la liste Compute du tableau de bord." } }
    - { id: c, text: { en: "Regenerate the dashboard with a higher `total_CFs` value in the counterfactual component.", fr: "Régénérer le tableau de bord avec une valeur `total_CFs` plus élevée dans le composant de contrefactuels." } }
    - { id: d, text: { en: "Generate a Responsible AI scorecard for the dashboard.", fr: "Générer une scorecard Responsible AI pour le tableau de bord." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Some dashboard features need on-the-fly computation, such as generating a new what-if counterfactual or showing ICE plots. They are available only when a running compute instance is connected to the dashboard; a green message bar confirms the connection.
    fr: |
      Certaines fonctionnalités du tableau de bord nécessitent un calcul à la volée, comme la génération d'un nouveau contrefactuel de simulation ou l'affichage des tracés ICE. Elles ne sont disponibles que lorsqu'une instance de calcul en cours d'exécution est connectée au tableau de bord ; une barre de message verte confirme la connexion.
  options:
    c: { en: "`total_CFs` sets how many counterfactuals are precomputed per data point; interactive what-if still needs connected compute.", fr: "`total_CFs` définit le nombre de contrefactuels précalculés par point de données ; la simulation interactive nécessite toujours un calcul connecté." }
    a: { en: "The cluster ran the job that built the dashboard; interactive features use a compute instance connected in the studio.", fr: "Le cluster a exécuté le travail qui a créé le tableau de bord ; les fonctionnalités interactives utilisent une instance de calcul connectée dans le studio." }
    d: { en: "A scorecard is a static PDF summary; it doesn't add interactive features.", fr: "Une scorecard est un résumé PDF statique ; elle n'ajoute pas de fonctionnalités interactives." }
references:
  - title: Use the Responsible AI dashboard in Azure Machine Learning studio
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-responsible-ai-dashboard
