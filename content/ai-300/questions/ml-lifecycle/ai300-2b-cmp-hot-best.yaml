id: ai300-2b-cmp-hot-best
objective: "2.1.8"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace. You run `mlflow.search_runs` on the trials of a sweep job and get the results shown in the following table. The primary metric of the sweep is `val_auc`, and higher values are better.

    Answer each prompt by selecting the appropriate run.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning. Vous exécutez `mlflow.search_runs` sur les essais d'un travail de balayage (sweep) et obtenez les résultats du tableau suivant. La métrique principale du balayage est `val_auc`, et les valeurs les plus élevées sont les meilleures.

    Répondez à chaque consigne en sélectionnant l'exécution appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The run whose model you should promote: the best primary metric among the runs that completed successfully", fr: "L'exécution dont vous devez promouvoir le modèle : la meilleure métrique principale parmi les exécutions terminées correctement" }
    - id: p2
      text: { en: "The run with the largest gap between training and validation AUC, which suggests overfitting", fr: "L'exécution présentant le plus grand écart entre l'AUC d'entraînement et l'AUC de validation, ce qui suggère un surajustement" }
  grid:
    header: [run_id, params.learning_rate, metrics.train_auc, metrics.val_auc, attributes.status]
    rows:
      - [{ text: run-a, area: ra }, { text: "0.1" }, { text: "0.99" }, { text: "0.81" }, { text: Finished }]
      - [{ text: run-b, area: rb }, { text: "0.05" }, { text: "0.94" }, { text: "0.91" }, { text: Finished }]
      - [{ text: run-c, area: rc }, { text: "0.02" }, { text: "0.95" }, { text: "0.93" }, { text: Failed }]
      - [{ text: run-d, area: rd }, { text: "0.01" }, { text: "0.90" }, { text: "0.89" }, { text: Finished }]
answer:
  values: { p1: rb, p2: ra }
explanation:
  correct:
    en: |
      run-c has the highest `val_auc`, but its status is `Failed`, so its model is not a reliable candidate; among the `Finished` runs, run-b has the best primary metric (0.91). run-a has a training AUC of 0.99 but a validation AUC of 0.81, the largest gap (0.18), which indicates that the model doesn't generalize.
    fr: |
      run-c a la valeur `val_auc` la plus élevée, mais son état est `Failed` : son modèle n'est pas un candidat fiable. Parmi les exécutions `Finished`, run-b a la meilleure métrique principale (0,91). run-a a une AUC d'entraînement de 0,99 mais une AUC de validation de 0,81, soit le plus grand écart (0,18), ce qui indique que le modèle ne généralise pas.
references:
  - title: Query & compare experiments and runs with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-track-experiments-mlflow
