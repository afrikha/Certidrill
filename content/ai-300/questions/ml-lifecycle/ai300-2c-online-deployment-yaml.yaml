id: ai300-2c-online-deployment-yaml
objective: "2.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware has a managed online endpoint named **ep-claims**. You are writing the YAML file of a deployment named **blue** for a custom model.

    The deployment must meet the following requirements:

    - Use the minimum number of instances that Microsoft recommends for high availability.
    - Block outbound internet access from the deployment.
    - Allow the model up to 15 seconds to process a request before the request fails.

    How should you complete the YAML file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un point de terminaison en ligne managé nommé **ep-claims**. Vous rédigez le fichier YAML d'un déploiement nommé **blue** pour un modèle personnalisé.

    Le déploiement doit répondre aux exigences suivantes :

    - Utiliser le nombre minimal d'instances recommandé par Microsoft pour la haute disponibilité.
    - Bloquer l'accès Internet sortant depuis le déploiement.
    - Laisser au modèle jusqu'à 15 secondes pour traiter une requête avant qu'elle échoue.

    Comment devez-vous compléter le fichier YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    $schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
    name: blue
    endpoint_name: ep-claims
    model: azureml:fraud-model:7
    code_configuration:
      code: ./src
      scoring_script: score.py
    environment: azureml:fraud-env:2
    instance_type: Standard_DS3_v2
    instance_count: [[cnt]]
    egress_public_network_access: [[egress]]
    request_settings:
      [[tkey]]: 15000
  slots:
    - id: cnt
      options:
        - { id: c1, text: "1" }
        - { id: c2, text: "2" }
        - { id: c3, text: "3" }
        - { id: c5, text: "5" }
    - id: egress
      options:
        - { id: egon, text: enabled }
        - { id: dis, text: disabled }
    - id: tkey
      options:
        - { id: timeout, text: request_timeout_ms }
        - { id: queue, text: max_queue_wait_ms }
        - { id: conc, text: max_concurrent_requests_per_instance }
answer:
  values: { cnt: c3, egress: dis, tkey: timeout }
explanation:
  correct:
    en: |
      Microsoft recommends at least three instances for a highly available online deployment. `egress_public_network_access: disabled` blocks outbound internet traffic from the deployment. `request_timeout_ms` (default 5,000, maximum 180,000) sets how long a request can run, so 15000 allows 15 seconds.
    fr: |
      Microsoft recommande au moins trois instances pour un déploiement en ligne hautement disponible. `egress_public_network_access: disabled` bloque le trafic Internet sortant du déploiement. `request_timeout_ms` (5 000 par défaut, 180 000 au maximum) définit la durée maximale d'une requête : 15000 laisse 15 secondes.
  options:
    c2: { en: "Two instances is below the recommended minimum of three.", fr: "Deux instances, c'est moins que le minimum recommandé de trois." }
    egon: { en: "enabled is the default and allows outbound internet access.", fr: "enabled est la valeur par défaut et autorise l'accès Internet sortant." }
    queue: { en: "max_queue_wait_ms is deprecated; Microsoft recommends raising request_timeout_ms instead.", fr: "max_queue_wait_ms est déprécié ; Microsoft recommande d'augmenter plutôt request_timeout_ms." }
    conc: { en: "max_concurrent_requests_per_instance is a number of parallel requests, not a duration.", fr: "max_concurrent_requests_per_instance est un nombre de requêtes parallèles, pas une durée." }
references:
  - title: CLI (v2) managed online deployment YAML schema
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-deployment-managed-online
  - title: Online endpoints for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-online
