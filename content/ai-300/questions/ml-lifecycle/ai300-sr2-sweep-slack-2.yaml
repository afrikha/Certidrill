id: ai300-sr2-sweep-slack-2
objective: "2.1.4"
type: series_yesno
series: ai300-sr2-sweep-slack
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You set a truncation selection policy with a percentage of 10 on the sweep job.
  fr: Vous définissez une stratégie de sélection par troncature avec un pourcentage de 10 sur le travail de balayage.
body:
  solution:
    en: |
      You add the following line before the sweep job is submitted:

      `sweep_job.early_termination = TruncationSelectionPolicy(evaluation_interval=1, truncation_percentage=10, delay_evaluation=5)`
    fr: |
      Vous ajoutez la ligne suivante avant l'envoi du travail de balayage :

      `sweep_job.early_termination = TruncationSelectionPolicy(evaluation_interval=1, truncation_percentage=10, delay_evaluation=5)`
answer: { value: false }
explanation:
  correct:
    en: A truncation selection policy cancels the lowest-performing 10 percent of trials at each evaluation interval, whatever their distance from the best trial. A trial close to the best value can be canceled, and a trial far below it can survive, so the tolerance requirement isn't met.
    fr: "Une stratégie de sélection par troncature annule les 10 % d'essais les moins performants à chaque intervalle d'évaluation, quelle que soit leur distance au meilleur essai. Un essai proche de la meilleure valeur peut être annulé et un essai très en dessous peut continuer : l'exigence de tolérance n'est pas respectée."
references:
  - title: Hyperparameter tuning a model (v2) - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-tune-hyperparameters
