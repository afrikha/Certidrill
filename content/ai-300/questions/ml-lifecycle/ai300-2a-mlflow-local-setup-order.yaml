id: ai300-2a-mlflow-local-setup-order
objective: "2.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-wingtip**. You already copied the MLflow tracking URI of the workspace and signed in by running `az login` on your local computer, which has Python 3.11 and no MLflow package.

    You need to log a run from a local script to an experiment named **price-model** in mlw-wingtip.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-wingtip**. Vous avez déjà copié l'URI de suivi MLflow de l'espace de travail et vous vous êtes connecté en exécutant `az login` sur votre ordinateur local, qui dispose de Python 3.11 et d'aucun package MLflow.

    Vous devez enregistrer une exécution depuis un script local dans une expérience nommée **price-model** dans mlw-wingtip.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: install, text: { en: "Run `pip install mlflow azureml-mlflow`.", fr: "Exécuter `pip install mlflow azureml-mlflow`." } }
    - { id: uri, text: { en: "Call `mlflow.set_tracking_uri()` with the tracking URI.", fr: "Appeler `mlflow.set_tracking_uri()` avec l'URI de suivi." } }
    - { id: exp, text: { en: "Call `mlflow.set_experiment(\"price-model\")`.", fr: "Appeler `mlflow.set_experiment(\"price-model\")`." } }
    - { id: run, text: { en: "Open `mlflow.start_run()` and call the logging functions inside it.", fr: "Ouvrir `mlflow.start_run()` et appeler les fonctions de journalisation à l'intérieur." } }
    - { id: ci, text: { en: "Create a compute instance in mlw-wingtip.", fr: "Créer une instance de calcul dans mlw-wingtip." } }
    - { id: job, text: { en: "Run `az ml job create --file job.yml`.", fr: "Exécuter `az ml job create --file job.yml`." } }
    - { id: reg, text: { en: "Register a model in the model registry of mlw-wingtip.", fr: "Inscrire un modèle dans le registre de modèles de mlw-wingtip." } }
answer:
  sequence: [ install, uri, exp, run ]
explanation:
  correct:
    en: |
      You install MLflow and the Azure Machine Learning plugin first, then set the tracking URI so that MLflow talks to the workspace. `set_experiment()` is the first call that contacts the tracking server (it authenticates and creates the experiment if needed), so it must follow the URI. Runs are then logged in the active experiment.
    fr: |
      Vous installez d'abord MLflow et le plug-in Azure Machine Learning, puis vous définissez l'URI de suivi pour que MLflow communique avec l'espace de travail. `set_experiment()` est le premier appel qui contacte le serveur de suivi (il s'authentifie et crée l'expérience si nécessaire) : il doit donc suivre l'URI. Les exécutions sont ensuite enregistrées dans l'expérience active.
  options:
    ci: { en: "The script runs locally; a compute instance isn't needed to log runs.", fr: "Le script s'exécute localement ; une instance de calcul n'est pas nécessaire pour enregistrer des exécutions." }
    job: { en: "Submitting a job runs code in the cloud; the requirement is to log from the local script.", fr: "Soumettre un travail exécute du code dans le cloud ; l'exigence est d'enregistrer depuis le script local." }
    reg: { en: "Registering a model isn't required to log a run.", fr: "L'inscription d'un modèle n'est pas nécessaire pour enregistrer une exécution." }
references:
  - title: Configure MLflow for Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-mlflow-configure-tracking
