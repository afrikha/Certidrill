id: ai300-2b-pipe-nondeterministic
objective: "2.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Machine Learning pipeline with two independent branches:

    - `download` → `train`: the `download` component fetches the latest exchange rates from a public HTTPS URL. The URL is passed as a string input and never changes.
    - `profile` → `report`: these components read a registered data asset that changes once a month.

    When you resubmit the pipeline, `download` reuses its previous output, so `train` uses stale rates. You need `download` to run again at every submission. The `profile` step must keep reusing its previous output when its input hasn't changed.

    What should you do?
  fr: |
    Vous disposez d'un pipeline Azure Machine Learning comportant deux branches indépendantes :

    - `download` → `train` : le composant `download` récupère les derniers taux de change à partir d'une URL HTTPS publique. L'URL est transmise sous forme d'entrée de type chaîne et ne change jamais.
    - `profile` → `report` : ces composants lisent une ressource de données inscrite qui change une fois par mois.

    Quand vous soumettez à nouveau le pipeline, `download` réutilise sa sortie précédente : `train` utilise donc des taux obsolètes. L'étape `download` doit s'exécuter de nouveau à chaque soumission. L'étape `profile` doit continuer à réutiliser sa sortie précédente quand son entrée n'a pas changé.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set `force_rerun: true` in the settings of the pipeline job.", fr: "Définir `force_rerun: true` dans les paramètres du travail de pipeline." } }
    - { id: b, text: { en: "Set `continue_on_step_failure: false` in the settings of the pipeline job.", fr: "Définir `continue_on_step_failure: false` dans les paramètres du travail de pipeline." } }
    - { id: c, text: { en: "Set the mode of the `download` output to `upload` instead of `rw_mount`.", fr: "Définir le mode de la sortie de `download` sur `upload` au lieu de `rw_mount`." } }
    - { id: d, text: { en: "Set `is_deterministic: false` in the `download` component definition.", fr: "Définir `is_deterministic: false` dans la définition du composant `download`." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Components are deterministic by default, so a step whose inputs haven't changed reuses its previous result. Setting `is_deterministic: false` on a component that loads external data, such as data from a URL that can change, forces only that step to run again, while the other steps keep the default reuse behavior.
    fr: |
      Les composants sont déterministes par défaut : une étape dont les entrées n'ont pas changé réutilise son résultat précédent. Définir `is_deterministic: false` sur un composant qui charge des données externes, comme des données issues d'une URL susceptibles de changer, force la réexécution de cette seule étape, tandis que les autres étapes conservent la réutilisation par défaut.
  options:
    a: { en: "`force_rerun: true` reruns every step of the pipeline, so `profile` would no longer reuse its output.", fr: "`force_rerun: true` réexécute toutes les étapes du pipeline : `profile` ne réutiliserait plus sa sortie." }
    b: { en: "This setting controls what happens when a step fails; it doesn't affect output reuse.", fr: "Ce paramètre contrôle ce qui se passe en cas d'échec d'une étape ; il n'affecte pas la réutilisation des sorties." }
    c: { en: "The output mode only controls how files are written to storage; reuse is decided before the step runs.", fr: "Le mode de sortie contrôle seulement la façon dont les fichiers sont écrits dans le stockage ; la réutilisation est décidée avant l'exécution de l'étape." }
references:
