id: ai300-2c-latency-sms-alert
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a managed online endpoint named **ep-churn** in an Azure Machine Learning workspace.

    You need the on-call engineer to receive an SMS message when the average request latency of ep-churn stays above 300 milliseconds for five minutes.

    What should you configure?
  fr: |
    Contoso dispose d'un point de terminaison en ligne managé nommé **ep-churn** dans un espace de travail Azure Machine Learning.

    Vous devez faire en sorte que l'ingénieur d'astreinte reçoive un SMS quand la latence moyenne des requêtes d'ep-churn reste supérieure à 300 millisecondes pendant cinq minutes.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "An `alert_notification` section in a model monitor that targets the deployment", fr: "Une section `alert_notification` dans une surveillance de modèle qui cible le déploiement" } }
    - { id: b, text: { en: "An Azure Monitor alert rule on the request latency metric, with an action group", fr: "Une règle d'alerte Azure Monitor sur la métrique de latence des requêtes, avec un groupe d'actions" } }
    - { id: c, text: { en: "An autoscale rule on the request latency metric of the endpoint", fr: "Une règle de mise à l'échelle automatique sur la métrique de latence des requêtes du point de terminaison" } }
    - { id: d, text: { en: "An Event Grid subscription on the workspace for the **Model deployed** event", fr: "Un abonnement Event Grid sur l'espace de travail pour l'événement **Model deployed**" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Online endpoint metrics, such as request latency, are Azure Monitor metrics. A metric alert rule evaluates a threshold over a time window, and its action group delivers the notification, for example as an SMS message.
    fr: |
      Les métriques des points de terminaison en ligne, comme la latence des requêtes, sont des métriques Azure Monitor. Une règle d'alerte de métrique évalue un seuil sur une fenêtre de temps, et son groupe d'actions envoie la notification, par exemple sous forme de SMS.
  options:
    a: { en: "Model monitor notifications are emails about monitoring signals such as drift, not about endpoint latency.", fr: "Les notifications d'une surveillance de modèle sont des e-mails sur des signaux comme la dérive, pas sur la latence du point de terminaison." }
    c: { en: "An autoscale rule adds or removes instances; it doesn't notify anyone.", fr: "Une règle de mise à l'échelle automatique ajoute ou retire des instances ; elle ne notifie personne." }
    d: { en: "Model deployed is raised when models are deployed successfully, not when latency rises.", fr: "Model deployed est déclenché quand des modèles sont déployés correctement, pas quand la latence augmente." }
references:
  - title: Monitor online endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-online-endpoints
