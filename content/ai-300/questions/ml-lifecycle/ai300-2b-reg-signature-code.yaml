id: ai300-2b-reg-signature-code
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace. You train a scikit-learn classifier on a pandas DataFrame named `X_train` and evaluate it on `X_test`.

    You need to meet the following requirements:

    - The logged model has a signature, so that MLflow enforces the input types when data is submitted.
    - The model is logged inside the current run.
    - The model is registered as **churn-classifier** with lineage to the run.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning. Vous entraînez un classifieur scikit-learn sur un DataFrame pandas nommé `X_train` et l'évaluez sur `X_test`.

    Vous devez répondre aux exigences suivantes :

    - Le modèle journalisé possède une signature, pour que MLflow applique les types d'entrée quand des données sont soumises.
    - Le modèle est journalisé dans l'exécution en cours.
    - Le modèle est inscrit sous le nom **churn-classifier** avec une traçabilité vers l'exécution.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import mlflow
    from mlflow.models import infer_signature

    signature = infer_signature([[s1]], model.predict(X_test))

    with mlflow.start_run() as run:
        mlflow.sklearn.[[s2]](model, "model", signature=signature)

    mlflow.[[s3]](f"runs:/{run.info.run_id}/model", "churn-classifier")
  slots:
    - id: s1
      options:
        - { id: s1a, text: X_test }
        - { id: s1c, text: "model.predict(X_test)" }
        - { id: s1b, text: model }
    - id: s2
      options:
        - { id: s2b, text: save_model }
        - { id: s2a, text: log_model }
        - { id: s2c, text: load_model }
    - id: s3
      options:
        - { id: s3b, text: log_artifact }
        - { id: s3c, text: set_tag }
        - { id: s3a, text: register_model }
answer:
  values: { s1: s1a, s2: s2a, s3: s3a }
explanation:
  correct:
    en: |
      `infer_signature` takes sample model inputs and the matching outputs, here `X_test` and its predictions, to build a column-based signature. `mlflow.sklearn.log_model()` logs the model with this signature inside the active run, and `mlflow.register_model()` with the `runs:/` URI registers it with lineage to the run.
    fr: |
      `infer_signature` prend des exemples d'entrées du modèle et les sorties correspondantes, ici `X_test` et ses prédictions, pour construire une signature basée sur les colonnes. `mlflow.sklearn.log_model()` journalise le modèle avec cette signature dans l'exécution active, et `mlflow.register_model()` avec l'URI `runs:/` l'inscrit avec une traçabilité vers l'exécution.
  options:
    s1b: { en: "The signature describes data, not the model object.", fr: "La signature décrit des données, pas l'objet modèle." }
    s1c: { en: "The predictions are the outputs; the first argument must be the inputs.", fr: "Les prédictions sont les sorties ; le premier argument doit être les entrées." }
    s2b: { en: "`save_model` writes the model to the local file system, outside the run, so `runs:/` would find nothing.", fr: "`save_model` écrit le modèle dans le système de fichiers local, hors de l'exécution : `runs:/` ne trouverait rien." }
    s3b: { en: "`log_artifact` stores a file in a run; it doesn't register a model.", fr: "`log_artifact` stocke un fichier dans une exécution ; il n'inscrit pas de modèle." }
references:
  - title: Artifacts and models in MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-mlflow-models
  - title: Manage models registry in Azure Machine Learning with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models-mlflow
