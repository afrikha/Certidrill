seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You mirror 20 percent of the endpoint traffic to green.
  fr: Vous mettez en miroir 20 % du trafic du point de terminaison vers green.
body:
  solution:
    en: |
      You keep the traffic of ep-credit at `blue=100`, and you run the following command:

      ```bash
      az ml online-endpoint update --name ep-credit --mirror-traffic "green=20"
      ```
    fr: |
      Vous conservez le trafic de ep-credit à `blue=100`, et vous exécutez la commande suivante :

      ```bash
      az ml online-endpoint update --name ep-credit --mirror-traffic "green=20"
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      Mirrored (shadow) traffic copies the specified percentage of live requests to green, so you can collect its metrics and logs, while every request is still served by blue and clients receive only blue's predictions. 20 percent is below the 50 percent maximum, and green receives mirrored traffic only, which is allowed because a deployment can't receive both live and mirrored traffic. The goal is met.
    fr: |
      Le trafic en miroir (shadow) copie le pourcentage indiqué des requêtes en direct vers green, ce qui vous permet de collecter ses métriques et ses journaux, tandis que chaque requête reste servie par blue et que les clients ne reçoivent que les prédictions de blue. 20 % est inférieur au maximum de 50 %, et green reçoit uniquement du trafic en miroir, ce qui est permis puisqu'un déploiement ne peut pas recevoir à la fois du trafic en direct et du trafic en miroir. L'objectif est atteint.
references:
  - title: Safe rollout for online endpoints - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints?view=azureml-api-2
