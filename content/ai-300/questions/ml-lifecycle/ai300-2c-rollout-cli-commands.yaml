id: ai300-2c-rollout-cli-commands
objective: "2.3.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a managed online endpoint named **ep-credit**. A deployment named **blue** receives 100 percent of the traffic, and a new deployment named **green** receives none.

    You need to:

    1. send 10 percent of the live requests to green;
    2. after validation, send all the live requests to green;
    3. remove blue.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un point de terminaison en ligne managé nommé **ep-credit**. Un déploiement nommé **blue** reçoit 100 % du trafic, et un nouveau déploiement nommé **green** n'en reçoit aucun.

    Vous devez :

    1. envoyer 10 % des requêtes réelles vers green ;
    2. après validation, envoyer toutes les requêtes réelles vers green ;
    3. supprimer blue.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az ml online-endpoint update --name ep-credit [[s1]] "blue=90 green=10"

    az ml online-endpoint update --name ep-credit --traffic "[[s2]]"

    az ml online-deployment [[s3]] --name blue --endpoint-name ep-credit --yes
  slots:
    - id: s1
      options:
        - { id: traffic, text: --traffic }
        - { id: mirror, text: --mirror-traffic }
        - { id: set, text: --set }
    - id: s2
      options:
        - { id: g100, text: blue=0 green=100 }
        - { id: b100, text: blue=100 green=0 }
        - { id: half, text: blue=50 green=50 }
    - id: s3
      options:
        - { id: delete, text: delete }
        - { id: update, text: update }
        - { id: show, text: show }
answer:
  values: { s1: traffic, s2: g100, s3: delete }
explanation:
  correct:
    en: |
      `--traffic` sets the live traffic percentages of the deployments, which must total 100. `blue=0 green=100` completes the rollout, and `az ml online-deployment delete` then removes blue without affecting green.
    fr: |
      `--traffic` définit les pourcentages de trafic réel des déploiements, dont le total doit valoir 100. `blue=0 green=100` termine le déploiement progressif, puis `az ml online-deployment delete` supprime blue sans affecter green.
  options:
    mirror: { en: "--mirror-traffic copies requests to green without returning its answers; it isn't a live split.", fr: "--mirror-traffic copie des requêtes vers green sans renvoyer ses réponses ; ce n'est pas une répartition du trafic réel." }
    b100: { en: "blue=100 green=0 is the rollback, not the completion of the rollout.", fr: "blue=100 green=0 correspond à la restauration, pas à la fin du déploiement progressif." }
    update: { en: "update changes a deployment's configuration; it doesn't remove it.", fr: "update modifie la configuration d'un déploiement ; il ne le supprime pas." }
references:
  - title: Perform safe rollout of new deployments for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
