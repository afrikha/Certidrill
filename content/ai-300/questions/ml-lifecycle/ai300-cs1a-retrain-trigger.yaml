id: ai300-cs1a-retrain-trigger
objective: "2.4.3"
type: single
caseStudy: ai300-cs1a-relecloud-bank
difficulty: 3
status: draft
stem:
  en: The fraud_precision signal has been added to fraud_monitoring. You need to meet the retraining requirement. What should you create?
  fr: Le signal fraud_precision a été ajouté à fraud_monitoring. Vous devez respecter l'exigence de réentraînement. Que devez-vous créer ?
body:
  options:
    - id: a
      text:
        en: An Event Grid subscription on mlw-rc-fraud for the Run status changed event, with a String contains filter on data.RunTags.azureml_modelmonitor_threshold_breached for the threshold breach message, and la-rc-retrain as the endpoint
        fr: Un abonnement Event Grid sur mlw-rc-fraud pour l'événement Run status changed, avec un filtre String contains sur data.RunTags.azureml_modelmonitor_threshold_breached pour le message de dépassement de seuil, et la-rc-retrain comme point de terminaison
    - id: b
      text:
        en: An Event Grid subscription on mlw-rc-fraud for the Run status changed event, with String contains filters on data.RunTags.azureml_modelmonitor_threshold_breached for the breach message and for the precision signal name, and la-rc-retrain as the endpoint
        fr: Un abonnement Event Grid sur mlw-rc-fraud pour l'événement Run status changed, avec des filtres String contains sur data.RunTags.azureml_modelmonitor_threshold_breached pour le message de dépassement et pour le nom du signal de précision, et la-rc-retrain comme point de terminaison
    - id: c
      text:
        en: An Event Grid subscription on mlw-rc-fraud for the Dataset drift detected event, with an advanced filter on the name of the precision signal, and la-rc-retrain as the endpoint
        fr: Un abonnement Event Grid sur mlw-rc-fraud pour l'événement Dataset drift detected, avec un filtre avancé sur le nom du signal de précision, et la-rc-retrain comme point de terminaison
    - id: d
      text:
        en: An Azure Monitor metric alert rule on ep-card-fraud that fires when the request latency exceeds a threshold, with an action group that calls la-rc-retrain
        fr: Une règle d'alerte de métrique Azure Monitor sur ep-card-fraud qui se déclenche quand la latence des requêtes dépasse un seuil, avec un groupe d'actions qui appelle la-rc-retrain
answer: { optionId: b }
explanation:
  correct:
    en: A monitoring run that breaches a threshold raises a Run status changed event on the workspace with the tag azureml_modelmonitor_threshold_breached. The filter on the breach message keeps only threshold breaches, and a second filter on the same key with the signal name keeps only the breaches of the precision signal, so a fraud_drift breach doesn't start la-rc-retrain.
    fr: Une exécution de surveillance qui dépasse un seuil déclenche sur l'espace de travail un événement Run status changed avec l'étiquette azureml_modelmonitor_threshold_breached. Le filtre sur le message de dépassement ne garde que les dépassements de seuil, et un second filtre sur la même clé avec le nom du signal ne garde que les dépassements du signal de précision ; un dépassement de fraud_drift ne démarre donc pas la-rc-retrain.
  options:
    a: { en: "Without the filter on the signal name, a breach of fraud_drift also raises a matching event and starts a retraining.", fr: "Sans le filtre sur le nom du signal, un dépassement de fraud_drift déclenche aussi un événement correspondant et lance un réentraînement." }
    c: { en: "Dataset drift detected belongs to data drift v1, not to model monitoring; model monitor breaches arrive as Run status changed events.", fr: "Dataset drift detected relève de la dérive des données v1, pas de la surveillance des modèles ; les dépassements des moniteurs arrivent sous forme d'événements Run status changed." }
    d: { en: "Endpoint metrics describe operational health such as latency; they don't measure the precision of predictions against confirmed fraud.", fr: "Les métriques du point de terminaison décrivent la santé opérationnelle, comme la latence ; elles ne mesurent pas la précision des prédictions par rapport aux fraudes confirmées." }
references:
  - title: Monitor model performance in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance
  - title: Trigger events in ML workflows
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-event-grid
