id: ai300-2b-life-promote-order
objective: "2.2.4"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace. Version 3 of the model **churn-classifier** serves production traffic on an online deployment. A retraining job named **job-77** produced a better MLflow model in its default artifact location.

    Your release process deploys only model versions tagged `stage=Prod`. You need to replace version 3 in production with the new model, keep the lineage to job-77, and hide version 3 from the default model list once no deployment uses it. Version 3 must remain usable for a rollback.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning. La version 3 du modèle **churn-classifier** sert le trafic de production sur un déploiement en ligne. Un travail de réentraînement nommé **job-77** a produit un meilleur modèle MLflow dans son emplacement d'artefacts par défaut.

    Votre processus de mise en production ne déploie que les versions de modèle étiquetées `stage=Prod`. Vous devez remplacer la version 3 en production par le nouveau modèle, conserver la traçabilité vers job-77 et masquer la version 3 dans la liste par défaut des modèles une fois qu'aucun déploiement ne l'utilise. La version 3 doit rester utilisable pour une restauration de version.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: stage, text: { en: "Call `transition_model_version_stage()` to move version 4 to `Production`.", fr: "Appeler `transition_model_version_stage()` pour faire passer la version 4 à `Production`." } }
    - { id: arch, text: { en: "Run `az ml model archive --name churn-classifier --version 3`.", fr: "Exécuter `az ml model archive --name churn-classifier --version 3`." } }
    - { id: tag, text: { en: "Run `az ml model update --name churn-classifier --version 4 --set tags.stage=Prod`.", fr: "Exécuter `az ml model update --name churn-classifier --version 4 --set tags.stage=Prod`." } }
    - { id: reg, text: { en: "Run `az ml model create --name churn-classifier --version 4 --path runs:/job-77/model/ --type mlflow_model`.", fr: "Exécuter `az ml model create --name churn-classifier --version 4 --path runs:/job-77/model/ --type mlflow_model`." } }
    - { id: dep, text: { en: "Update the online deployment to reference `azureml:churn-classifier:4`.", fr: "Mettre à jour le déploiement en ligne pour qu'il référence `azureml:churn-classifier:4`." } }
    - { id: del, text: { en: "Call `MlflowClient().delete_model_version(\"churn-classifier\", version=\"3\")`.", fr: "Appeler `MlflowClient().delete_model_version(\"churn-classifier\", version=\"3\")`." } }
answer:
  sequence: [ reg, tag, dep, arch ]
explanation:
  correct:
    en: |
      Registering from `runs:/job-77/model/` creates version 4 with lineage to the job. The tag must exist before the release process deploys the version, and the deployment must move to version 4 before version 3 is archived. Archiving hides version 3 from list queries, but it stays usable by explicit reference for a rollback.
    fr: |
      L'inscription à partir de `runs:/job-77/model/` crée la version 4 avec une traçabilité vers le travail. L'étiquette doit exister avant que le processus de mise en production déploie la version, et le déploiement doit passer à la version 4 avant l'archivage de la version 3. L'archivage masque la version 3 dans les requêtes de liste, mais elle reste utilisable par référence explicite pour une restauration de version.
  options:
    del: { en: "Deleting version 3 would prevent a rollback to it.", fr: "Supprimer la version 3 empêcherait une restauration vers celle-ci." }
    stage: { en: "MLflow stages aren't visible to the Azure Machine Learning CLI or studio, and the release process uses tags.", fr: "Les étapes MLflow ne sont pas visibles pour l'interface CLI ni le studio d'Azure Machine Learning, et le processus de mise en production utilise des étiquettes." }
references:
  - title: Work with registered models in Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
  - title: Manage models registry in Azure Machine Learning with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models-mlflow
