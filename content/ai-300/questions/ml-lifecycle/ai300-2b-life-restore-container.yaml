id: ai300-2b-life-restore-container
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace that contains a registered model named **fraud-score** with versions 1 to 5. Last month, an administrator ran `az ml model archive --name fraud-score`.

    You need version 5 to appear again in the default results of `az ml model list`, while versions 1 to 4 stay hidden. When you run `az ml model restore --name fraud-score --version 5`, the version is not restored.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning qui contient un modèle inscrit nommé **fraud-score** possédant les versions 1 à 5. Le mois dernier, un administrateur a exécuté `az ml model archive --name fraud-score`.

    La version 5 doit de nouveau apparaître dans les résultats par défaut de `az ml model list`, tandis que les versions 1 à 4 restent masquées. Quand vous exécutez `az ml model restore --name fraud-score --version 5`, la version n'est pas restaurée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run `az ml model update --name fraud-score --version 5 --set tags.archived=false`.", fr: "Exécuter `az ml model update --name fraud-score --version 5 --set tags.archived=false`." } }
    - { id: b, text: { en: "Restore the model container with `az ml model restore --name fraud-score`, and then archive versions 1 to 4.", fr: "Restaurer le conteneur du modèle avec `az ml model restore --name fraud-score`, puis archiver les versions 1 à 4." } }
    - { id: c, text: { en: "Register a new version 6 from the files of version 5 while the container stays archived.", fr: "Inscrire une nouvelle version 6 à partir des fichiers de la version 5 pendant que le conteneur reste archivé." } }
    - { id: d, text: { en: "Run `az ml model list --name fraud-score --include-archived` once to reactivate the version.", fr: "Exécuter une fois `az ml model list --name fraud-score --include-archived` pour réactiver la version." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Archiving a model without a version archives the whole container and all its versions. You can't restore only one version while the entire container is archived: restore the container, which makes the versions visible again, and then archive the versions that must stay hidden.
    fr: |
      Archiver un modèle sans indiquer de version archive le conteneur entier et toutes ses versions. Vous ne pouvez pas restaurer une seule version tant que le conteneur entier est archivé : restaurez le conteneur, ce qui rend les versions de nouveau visibles, puis archivez les versions qui doivent rester masquées.
  options:
    c: { en: "A new version created under an archived container is archived automatically.", fr: "Une nouvelle version créée dans un conteneur archivé est automatiquement archivée." }
    a: { en: "Tags are metadata; changing them doesn't change the archive state.", fr: "Les étiquettes sont des métadonnées ; les modifier ne change pas l'état d'archivage." }
    d: { en: "`--include-archived` only shows archived models in that listing; it doesn't restore them.", fr: "`--include-archived` affiche seulement les modèles archivés dans cette liste ; il ne les restaure pas." }
references:
  - title: az ml model
    url: https://learn.microsoft.com/en-us/cli/azure/ml/model
  - title: Work with registered models in Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
