id: ai300-cs1c-register-model
objective: "2.2.2"
type: single
caseStudy: ai300-cs1c-trey-research
difficulty: 1
status: draft
stem:
  en: |
    The best run of LesionSeg is the job named **lesion-seg-run-42**. train.py didn't register the model.

    You need to meet the registration requirement. Which command should you run?
  fr: |
    La meilleure exécution de LesionSeg est le travail nommé **lesion-seg-run-42**. train.py n'a pas inscrit le modèle.

    Vous devez respecter l'exigence d'inscription. Quelle commande devez-vous exécuter ?
body:
  options:
    - id: a
      text: "az ml model create --name lesionseg --version 1 --type custom_model --path azureml://jobs/lesion-seg-run-42/outputs/artifacts/paths/model/"
    - id: b
      text: "az ml model create --name lesionseg --version 1 --type mlflow_model --path azureml://jobs/lesion-seg-run-42/outputs/artifacts/paths/model/"
    - id: c
      text: "az ml model create --name lesionseg --version 1 --type mlflow_model --path ./downloads/lesion-seg-run-42/model/"
    - id: d
      text: "az ml model create --name lesionseg --version 1 --type mlflow_model --path azureml://datastores/workspaceartifactstore/paths/lesionseg/model/"
answer: { optionId: b }
explanation:
  correct:
    en: The model logged with mlflow.pytorch.log_model is in the default artifact location of the job, which azureml://jobs/<job-name>/outputs/artifacts/paths/model/ references; registering from a job path establishes lineage between the model and the job. The mlflow_model type enables no-code deployment, in which Azure Machine Learning generates the scoring script and the environment.
    fr: Le modèle enregistré avec mlflow.pytorch.log_model se trouve dans l'emplacement d'artefacts par défaut du travail, que référence azureml://jobs/<nom-du-travail>/outputs/artifacts/paths/model/ ; l'inscription depuis un chemin de travail établit la traçabilité entre le modèle et le travail. Le type mlflow_model permet le déploiement sans code, dans lequel Azure Machine Learning génère le script de scoring et l'environnement.
  options:
    a: { en: "A custom_model keeps the lineage, but a custom model deployment needs a scoring script and an environment.", fr: "Un custom_model conserve la traçabilité, mais le déploiement d'un modèle personnalisé exige un script de scoring et un environnement." }
    c: { en: "Files uploaded from a local folder are registered without any link to the job that trained them.", fr: "Des fichiers chargés depuis un dossier local sont inscrits sans aucun lien avec le travail qui les a entraînés." }
    d: { en: "A datastore path registers files from storage, without lineage to the training job.", fr: "Un chemin de magasin de données inscrit des fichiers depuis le stockage, sans traçabilité vers le travail d'entraînement." }
references:
  - title: Register and work with models
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
  - title: Guidelines for Deploying MLflow Models
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-mlflow-models
