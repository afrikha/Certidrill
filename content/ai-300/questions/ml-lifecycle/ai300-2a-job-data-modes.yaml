id: ai300-2a-job-data-modes
objective: "2.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are configuring the inputs and outputs of command jobs in Azure Machine Learning. You have four requirements.

    Which mode should you use for each requirement? To answer, drag the appropriate modes to the correct requirements. Each mode may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez les entrées et les sorties de travaux de commande dans Azure Machine Learning. Vous avez quatre exigences.

    Quel mode devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les modes appropriés vers les exigences correspondantes. Chaque mode peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ro, text: ro_mount }
    - { id: download, text: download }
    - { id: direct, text: direct }
    - { id: rw, text: rw_mount }
    - { id: upload, text: upload }
    - { id: evalm, text: eval_mount }
  targets:
    - id: t1
      text: { en: "Input: copy a 2-GB folder to the local disk before the script starts, because the script reads every file several times", fr: "Entrée : copier un dossier de 2 Go sur le disque local avant le démarrage du script, car le script lit chaque fichier plusieurs fois" }
    - id: t2
      text: { en: "Input: give the script the storage URI only, because it reads the data with its own client code and credentials", fr: "Entrée : fournir seulement l'URI de stockage au script, car il lit les données avec son propre code client et ses propres informations d'identification" }
    - id: t3
      text: { en: "Output: write the files to the local disk and copy them to storage when the job ends", fr: "Sortie : écrire les fichiers sur le disque local et les copier vers le stockage à la fin du travail" }
    - id: t4
      text: { en: "Output: write the files directly to a read-write mounted storage location", fr: "Sortie : écrire les fichiers directement dans un emplacement de stockage monté en lecture-écriture" }
answer:
  mapping: { t1: download, t2: direct, t3: upload, t4: rw }
explanation:
  correct:
    en: "`download` copies the input to the local disk, which suits small data read more than once. `direct` passes the URI and lets your code access it, with credentials managed by you. For outputs, `upload` copies the files to storage at the end of the job, and `rw_mount` (the default) mounts the storage location read-write."
    fr: "`download` copie l'entrée sur le disque local, ce qui convient à de petites données lues plusieurs fois. `direct` passe l'URI et laisse votre code y accéder, avec des informations d'identification que vous gérez. Pour les sorties, `upload` copie les fichiers vers le stockage à la fin du travail, et `rw_mount` (valeur par défaut) monte l'emplacement de stockage en lecture-écriture."
  options:
    ro: { en: "ro_mount streams an input read-only instead of copying it first.", fr: "ro_mount diffuse une entrée en lecture seule au lieu de la copier d'abord." }
    evalm: { en: "eval_mount applies only to MLTable inputs whose MLTable file subsets or combines data.", fr: "eval_mount s'applique uniquement aux entrées MLTable dont le fichier MLTable filtre ou combine des données." }
references:
  - title: Access data in a job
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-read-write-data-v2
