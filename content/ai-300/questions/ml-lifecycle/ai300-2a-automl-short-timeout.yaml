id: ai300-2a-automl-short-timeout
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an AutoML regression job that trains on an MLTable of 2,000,000 rows and 15 columns. All rows and columns must be used. The job calls `set_limits(timeout_minutes=45, max_trials=20)` and fails with an error about the experiment timeout.

    You need the job to run. The solution must change only one setting.

    What should you do?
  fr: |
    Vous disposez d'un travail AutoML de régression qui s'entraîne sur une MLTable de 2 000 000 de lignes et 15 colonnes. Toutes les lignes et colonnes doivent être utilisées. Le travail appelle `set_limits(timeout_minutes=45, max_trials=20)` et échoue avec une erreur liée au délai d'expiration de l'expérience.

    Le travail doit s'exécuter. La solution ne doit modifier qu'un seul paramètre.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Reduce `max_trials` to 10.", fr: "Réduire `max_trials` à 10." } }
    - { id: b, text: { en: "Add `trial_timeout_minutes=45`.", fr: "Ajouter `trial_timeout_minutes=45`." } }
    - { id: c, text: { en: "Increase `max_concurrent_trials` to the number of cluster nodes.", fr: "Augmenter `max_concurrent_trials` au nombre de nœuds du cluster." } }
    - { id: d, text: { en: "Increase `timeout_minutes` to a value greater than 60.", fr: "Augmenter `timeout_minutes` à une valeur supérieure à 60." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An experiment timeout of 60 minutes or less is allowed only when the dataset has at most 10,000,000 cells (rows times columns). This dataset has 30,000,000 cells, and the data can't be reduced, so the job timeout must be more than 60 minutes.
    fr: |
      Un délai d'expiration de l'expérience de 60 minutes ou moins n'est autorisé que si le jeu de données compte au plus 10 000 000 de cellules (lignes multipliées par colonnes). Ce jeu de données compte 30 000 000 de cellules et les données ne peuvent pas être réduites : le délai du travail doit dépasser 60 minutes.
  options:
    a:
      en: |
        The number of trials doesn't lift the rule that links a short experiment timeout to the dataset size.
      fr: |
        Le nombre d'essais ne lève pas la règle qui lie un délai d'expérience court à la taille du jeu de données.
    b:
      en: |
        A per-trial timeout doesn't change the experiment timeout that causes the error.
      fr: |
        Un délai par essai ne change pas le délai de l'expérience qui provoque l'erreur.
    c:
      en: |
        More parallelism doesn't change the experiment timeout rule.
      fr: |
        Plus de parallélisme ne change pas la règle du délai de l'expérience.
references:
  - title: Set up AutoML training for tabular data with the Azure Machine Learning CLI and Python SDK
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-auto-train
