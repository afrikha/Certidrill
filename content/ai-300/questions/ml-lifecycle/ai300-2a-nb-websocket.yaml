id: ai300-2a-nb-websocket
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's data scientists use Azure Machine Learning studio from the corporate network, which goes through a web proxy. They can open and edit notebooks, and their compute instances show as running. However, the kernel indicator stays gray (**Kernel not connected**) and no cell runs.

    You need the data scientists to run notebook cells from the corporate network.

    What should you do?
  fr: |
    Les data scientists de Fabrikam utilisent Azure Machine Learning studio depuis le réseau d'entreprise, qui passe par un proxy web. Ils peuvent ouvrir et modifier des notebooks, et leurs instances de calcul apparaissent en cours d'exécution. Cependant, l'indicateur de noyau reste gris (**Kernel not connected**) et aucune cellule ne s'exécute.

    Les data scientists doivent pouvoir exécuter des cellules de notebook depuis le réseau d'entreprise.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Allow WebSocket connections to `*.instances.azureml.net` and `*.instances.azureml.ms` on the proxy.", fr: "Autoriser les connexions WebSocket vers `*.instances.azureml.net` et `*.instances.azureml.ms` sur le proxy." } }
    - { id: b, text: { en: "Allow HTTPS connections to `*.blob.core.windows.net` and `*.file.core.windows.net` on the proxy.", fr: "Autoriser les connexions HTTPS vers `*.blob.core.windows.net` et `*.file.core.windows.net` sur le proxy." } }
    - { id: c, text: { en: "Restart the compute instances, and then select a different kernel.", fr: "Redémarrer les instances de calcul, puis sélectionner un autre noyau." } }
    - { id: d, text: { en: "Assign the data scientists the Contributor role on the storage account of the workspace.", fr: "Attribuer aux data scientists le rôle Contributor sur le compte de stockage de l'espace de travail." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The studio talks to the Jupyter kernels of a compute instance over WebSockets. If a proxy or firewall blocks WebSocket traffic to `*.instances.azureml.net` and `*.instances.azureml.ms`, notebooks open but the kernel can't connect.
    fr: |
      Le studio communique avec les noyaux Jupyter d'une instance de calcul par WebSockets. Si un proxy ou un pare-feu bloque le trafic WebSocket vers `*.instances.azureml.net` et `*.instances.azureml.ms`, les notebooks s'ouvrent mais le noyau ne peut pas se connecter.
  options:
    b:
      en: |
        Notebook files already open and save, so storage access works; the failing connection is the one to the kernel.
      fr: |
        Les fichiers de notebook s'ouvrent et s'enregistrent déjà : l'accès au stockage fonctionne ; la connexion qui échoue est celle du noyau.
    c:
      en: |
        The instances are healthy; restarting them or changing kernel doesn't open the blocked network path.
      fr: |
        Les instances fonctionnent ; les redémarrer ou changer de noyau n'ouvre pas le chemin réseau bloqué.
    d:
      en: |
        Editing already works, and a role assignment doesn't change what the proxy blocks.
      fr: |
        La modification fonctionne déjà, et une attribution de rôle ne change pas ce que bloque le proxy.
references:
  - title: Run Jupyter notebooks in your workspace
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-run-jupyter-notebooks
