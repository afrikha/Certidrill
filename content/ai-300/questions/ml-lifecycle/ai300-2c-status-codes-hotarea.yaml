id: ai300-2c-status-codes-hotarea
objective: "2.3.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a managed online endpoint named **ep-orders** with two deployments. The following table shows an extract of the requests that clients sent to the endpoint during an incident.

    Answer each prompt by selecting the request in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un point de terminaison en ligne managé nommé **ep-orders** avec deux déploiements. Le tableau suivant présente un extrait des requêtes envoyées par les clients au point de terminaison pendant un incident.

    Répondez à chaque consigne en sélectionnant la requête dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The request that failed because the scoring script returned an error", fr: "La requête qui a échoué parce que le script de scoring a renvoyé une erreur" }
    - id: p2
      text: { en: "The request that was rejected because too many requests were pending on the deployment", fr: "La requête rejetée parce que trop de requêtes étaient en attente sur le déploiement" }
  grid:
    header: [{ en: "Request", fr: "Requête" }, { en: "Deployment", fr: "Déploiement" }, { en: "HTTP status code", fr: "Code d'état HTTP" }]
    rows:
      - [{ text: req-01, area: r1 }, { text: blue }, { text: "200" }]
      - [{ text: req-02, area: r2 }, { text: blue }, { text: "401" }]
      - [{ text: req-03, area: r3 }, { text: green }, { text: "408" }]
      - [{ text: req-04, area: r4 }, { text: green }, { text: "424" }]
      - [{ text: req-05, area: r5 }, { text: blue }, { text: "429" }]
      - [{ text: req-06, area: r6 }, { text: blue }, { text: "500" }]
answer:
  values: { p1: r4, p2: r5 }
explanation:
  correct:
    en: |
      On a managed online endpoint, 424 means that the model container returned a non-200 response, for example an exception raised by the scoring script. 429 means too many pending requests (more than 2 × `max_concurrent_requests_per_instance` × `instance_count`) or a rate limit. 401 is an authentication failure, 408 a request that exceeded `request_timeout_ms`, and 500 a failure of the platform infrastructure.
    fr: |
      Sur un point de terminaison en ligne managé, 424 signifie que le conteneur du modèle a renvoyé une réponse autre que 200, par exemple une exception levée par le script de scoring. 429 signifie trop de requêtes en attente (plus de 2 × `max_concurrent_requests_per_instance` × `instance_count`) ou une limite de débit. 401 est un échec d'authentification, 408 une requête qui a dépassé `request_timeout_ms`, et 500 une défaillance de l'infrastructure de la plateforme.
references:
  - title: Troubleshoot online endpoint deployment and scoring
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-troubleshoot-online-endpoints
