id: ai300-2a-mlflow-job-statements
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-litware**. You submit a command job that runs `train.py` on a compute cluster named **cpu-cluster**. The job YAML file contains `experiment_name: churn`. The script uses scikit-learn and MLflow.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-litware**. Vous soumettez un travail de commande qui exécute `train.py` sur un cluster de calcul nommé **cpu-cluster**. Le fichier YAML du travail contient `experiment_name: churn`. Le script utilise scikit-learn et MLflow.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "`train.py` must call `mlflow.set_tracking_uri()` for its metrics to be stored in mlw-litware."
        fr: "`train.py` doit appeler `mlflow.set_tracking_uri()` pour que ses métriques soient stockées dans mlw-litware."
    - id: s2
      text:
        en: |
          If `train.py` doesn't call `mlflow.set_experiment()`, the run is recorded in the churn experiment.
        fr: |
          Si `train.py` n'appelle pas `mlflow.set_experiment()`, l'exécution est enregistrée dans l'expérience churn.
    - id: s3
      text:
        en: |
          If `train.py` calls `mlflow.autolog(log_models=False)`, the parameters and metrics are logged automatically, but the model isn't.
        fr: |
          Si `train.py` appelle `mlflow.autolog(log_models=False)`, les paramètres et les métriques sont enregistrés automatiquement, mais pas le modèle.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      On Azure Machine Learning compute clusters, the tracking URI is configured automatically, so the script needs no `set_tracking_uri()` call. The `experiment_name` property of the job YAML sets the experiment, so the script doesn't have to. `autolog(log_models=False)` keeps automatic logging of parameters and metrics and skips the model, which is useful when you log the model yourself.
    fr: |
      Sur les clusters de calcul Azure Machine Learning, l'URI de suivi est configuré automatiquement : le script n'a besoin d'aucun appel à `set_tracking_uri()`. La propriété `experiment_name` du YAML du travail définit l'expérience, le script n'a donc pas à le faire. `autolog(log_models=False)` conserve la journalisation automatique des paramètres et des métriques et ignore le modèle, ce qui est utile quand vous enregistrez le modèle vous-même.
references:
  - title: Configure MLflow for Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-mlflow-configure-tracking
  - title: Log metrics, parameters, and files with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-log-view-metrics
