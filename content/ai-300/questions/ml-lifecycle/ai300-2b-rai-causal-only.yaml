id: ai300-2b-rai-causal-only
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace. A marketing team has historical tabular data about customers, the discounts they received, and whether they churned. No model has been trained on this data.

    The team wants a Responsible AI dashboard that only estimates the effect of the discount on churn. You build a pipeline with the RAI Insights dashboard constructor, Add Causal to RAI Insights dashboard, and Gather RAI Insights dashboard components. The solution must minimize development effort.

    What should you provide as the model?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning. Une équipe marketing dispose de données tabulaires historiques sur les clients, les remises qu'ils ont reçues et leur attrition. Aucun modèle n'a été entraîné sur ces données.

    L'équipe souhaite un tableau de bord Responsible AI qui estime uniquement l'effet de la remise sur l'attrition. Vous créez un pipeline avec les composants RAI Insights dashboard constructor, Add Causal to RAI Insights dashboard et Gather RAI Insights dashboard. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous fournir comme modèle ?
body:
  options:
    - { id: a, text: { en: "A scikit-learn `DummyClassifier` registered in MLflow format with the `sklearn` flavor", fr: "Un `DummyClassifier` scikit-learn inscrit au format MLflow avec la saveur `sklearn`" } }
    - { id: b, text: { en: "A `DummyClassifier` serialized with `joblib` and registered as a `custom_model`", fr: "Un `DummyClassifier` sérialisé avec `joblib` et inscrit en tant que `custom_model`" } }
    - { id: c, text: { en: "No model: leave the model input of the constructor empty for a causal-only analysis", fr: "Aucun modèle : laisser vide l'entrée de modèle du constructeur pour une analyse uniquement causale" } }
    - { id: d, text: { en: "The best model of an automated ML job, registered from the studio", fr: "Le meilleur modèle d'un travail de ML automatisé, inscrit depuis le studio" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Responsible AI components need a model even when you only run causal analysis. You can supply a placeholder such as scikit-learn's `DummyClassifier` or `DummyRegressor`, registered in MLflow format with the `sklearn` flavor, the only model format the components support.
    fr: |
      Les composants Responsible AI ont besoin d'un modèle même si vous n'exécutez qu'une analyse causale. Vous pouvez fournir un modèle de substitution comme `DummyClassifier` ou `DummyRegressor` de scikit-learn, inscrit au format MLflow avec la saveur `sklearn`, le seul format de modèle pris en charge par les composants.
  options:
    c: { en: "A model must be supplied, even for a causal-only analysis.", fr: "Un modèle doit être fourni, même pour une analyse uniquement causale." }
    d: { en: "Models produced by automated ML aren't supported by the dashboard, and training one adds effort.", fr: "Les modèles produits par le ML automatisé ne sont pas pris en charge par le tableau de bord, et en entraîner un ajoute de l'effort." }
    b: { en: "The components support only MLflow models with the `sklearn` flavor, not `custom_model` files.", fr: "Les composants ne prennent en charge que les modèles MLflow avec la saveur `sklearn`, pas les fichiers `custom_model`." }
references:
  - title: Generate Responsible AI insights with YAML and Python
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-responsible-ai-insights-sdk-cli
  - title: Assess AI systems by using the Responsible AI dashboard
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai-dashboard
