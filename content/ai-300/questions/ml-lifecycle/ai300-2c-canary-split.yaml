id: ai300-2c-canary-split
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a managed online endpoint named **ep-credit**. A deployment named **blue** receives 100 percent of the traffic. A deployment named **green** that runs a new model version passed its functional tests and currently receives no traffic.

    You need 5 percent of the real client requests to be answered by green so that the business team can compare the outcomes of both models. Client applications must keep calling the same scoring URI.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un point de terminaison en ligne managé nommé **ep-credit**. Un déploiement nommé **blue** reçoit 100 % du trafic. Un déploiement nommé **green**, qui exécute une nouvelle version du modèle, a réussi ses tests fonctionnels et ne reçoit actuellement aucun trafic.

    Vous devez faire en sorte que 5 % des requêtes clientes réelles reçoivent la réponse de green, afin que l'équipe métier compare les résultats des deux modèles. Les applications clientes doivent continuer à appeler le même URI de scoring.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run `az ml online-endpoint update --name ep-credit --mirror-traffic \"green=5\"`.", fr: "Exécuter `az ml online-endpoint update --name ep-credit --mirror-traffic \"green=5\"`." } }
    - { id: b, text: { en: "Run `az ml online-endpoint update --name ep-credit --traffic \"blue=95 green=5\"`.", fr: "Exécuter `az ml online-endpoint update --name ep-credit --traffic \"blue=95 green=5\"`." } }
    - { id: c, text: { en: "Ask 5 percent of the clients to add the header `azureml-model-deployment: green` to their requests.", fr: "Demander à 5 % des clients d'ajouter l'en-tête `azureml-model-deployment: green` à leurs requêtes." } }
    - { id: d, text: { en: "Run `az ml online-deployment update --name green --endpoint-name ep-credit --set instance_count=5`.", fr: "Exécuter `az ml online-deployment update --name green --endpoint-name ep-credit --set instance_count=5`." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A traffic split routes a percentage of the live requests to each deployment, and the clients receive the answer of the deployment that served them. Setting blue to 95 and green to 5 exposes 5 percent of the real requests to the new model behind the same scoring URI, and the percentages total 100.
    fr: |
      Une répartition du trafic achemine un pourcentage des requêtes réelles vers chaque déploiement, et les clients reçoivent la réponse du déploiement qui les a servis. Définir blue à 95 et green à 5 expose 5 % des requêtes réelles au nouveau modèle derrière le même URI de scoring, et le total des pourcentages vaut 100.
  options:
    a: { en: "Mirrored traffic is a copy: green processes it, but clients still receive only blue's answers, so the business team sees no green outcome.", fr: "Le trafic mis en miroir est une copie : green le traite, mais les clients ne reçoivent que les réponses de blue, et l'équipe métier ne voit aucun résultat de green." }
    c: { en: "The header bypasses the traffic rules for selected clients; it requires client changes and doesn't give a controlled 5 percent of requests.", fr: "L'en-tête contourne les règles de trafic pour certains clients ; il impose de modifier les clients et ne garantit pas 5 % contrôlés des requêtes." }
    d: { en: "instance_count scales green's capacity; it doesn't route any traffic to green.", fr: "instance_count met à l'échelle la capacité de green ; il n'achemine aucun trafic vers green." }
references:
  - title: Perform safe rollout of new deployments for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
