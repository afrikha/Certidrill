id: ai300-cs3a-rai-components
objective: "2.2.3"
type: dragdrop
caseStudy: ai300-cs3a-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You plan to generate a Responsible AI dashboard for version 7 of fraud-model to meet model governance requirement 7.

    Which dashboard component should you use for each task of the model risk team? To answer, drag the appropriate components to the correct tasks. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de générer un tableau de bord Responsible AI pour la version 7 de fraud-model afin de respecter l'exigence 7 de gouvernance des modèles.

    Quel composant du tableau de bord devez-vous utiliser pour chaque tâche de l'équipe de gestion du risque de modèle ? Pour répondre, faites glisser les composants appropriés vers les tâches correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: error, text: { en: "Error analysis", fr: "Analyse des erreurs (Error analysis)" } }
    - { id: fairness, text: { en: "Model overview and fairness assessment", fr: "Vue d'ensemble du modèle et évaluation de l'équité (Model overview and fairness assessment)" } }
    - { id: data, text: { en: "Data analysis", fr: "Analyse des données (Data analysis)" } }
    - { id: interpret, text: { en: "Model interpretability", fr: "Interprétabilité du modèle (Model interpretability)" } }
    - { id: whatif, text: { en: "Counterfactual what-if", fr: "Simulation contrefactuelle (Counterfactual what-if)" } }
    - { id: causal, text: { en: "Causal analysis", fr: "Analyse causale (Causal analysis)" } }
  targets:
    - id: t1
      text: { en: "Compare the accuracy and the fraud-flag rate across age bands", fr: "Comparer l'exactitude et le taux de signalement de fraude entre les tranches d'âge" }
    - id: t2
      text: { en: "Identify the cohorts of claims with the most errors", fr: "Identifier les cohortes de sinistres qui présentent le plus d'erreurs" }
    - id: t3
      text: { en: "Explain which features drove the score of one claim", fr: "Expliquer quelles caractéristiques ont déterminé le score d'un sinistre" }
    - id: t4
      text: { en: "Estimate how requiring a police report affects the settlement amount", fr: "Estimer l'effet de l'exigence d'un procès-verbal de police sur le montant de l'indemnisation" }
answer:
  mapping: { t1: fairness, t2: error, t3: interpret, t4: causal }
explanation:
  correct:
    en: |
      Model overview and fairness assessment compares performance and prediction rates across sensitive groups such as age bands. Error analysis finds the cohorts with the highest error rates. Model interpretability gives global and local (single prediction) feature importance. Causal analysis estimates the effect of a treatment feature, here a police report, on a real-world outcome from historical data. fraud-model qualifies because it's an MLflow model with a scikit-learn flavor trained on tabular data.
    fr: |
      La vue d'ensemble du modèle et l'évaluation de l'équité comparent les performances et les taux de prédiction entre des groupes sensibles comme les tranches d'âge. L'analyse des erreurs identifie les cohortes qui ont les taux d'erreur les plus élevés. L'interprétabilité du modèle donne l'importance des caractéristiques au niveau global et local (une seule prédiction). L'analyse causale estime l'effet d'une caractéristique de traitement, ici un procès-verbal de police, sur un résultat réel à partir de données historiques. fraud-model est éligible car c'est un modèle MLflow avec une saveur scikit-learn entraîné sur des données tabulaires.
  options:
    data:
      en: |
        Data analysis describes the distributions of the dataset (over- or underrepresentation); it doesn't measure model performance by group or causal effects.
      fr: |
        L'analyse des données décrit les distributions du jeu de données (sur- ou sous-représentation) ; elle ne mesure ni les performances du modèle par groupe ni les effets causaux.
    whatif:
      en: |
        Counterfactual what-if shows the minimal feature changes that would flip a prediction; it doesn't estimate the effect of a treatment on an outcome.
      fr: |
        La simulation contrefactuelle montre les plus petites modifications de caractéristiques qui inverseraient une prédiction ; elle n'estime pas l'effet d'un traitement sur un résultat.
references:
  - title: Assess AI Systems and Make Data-Driven Decisions with Azure Machine Learning Responsible AI Dashboard
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai-dashboard
