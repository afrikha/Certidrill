id: ai300-2b-cmp-last-failed
objective: "2.1.8"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace that contains an experiment named **churn-training**. Some of its jobs failed and some were canceled by users.

    You need to retrieve, with MLflow, only the most recent job of the experiment that failed, to compare its parameters with those of a successful job.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning qui contient une expérience nommée **churn-training**. Certains de ses travaux ont échoué et d'autres ont été annulés par des utilisateurs.

    Vous devez récupérer avec MLflow uniquement le travail de l'expérience le plus récent ayant échoué, afin de comparer ses paramètres avec ceux d'un travail réussi.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    last_failed = mlflow.search_runs(
        experiment_names=["churn-training"],
        filter_string="[[s1]]",
        order_by=["[[s2]]"],
        [[s3]]=1,
    )
  slots:
    - id: s1
      options:
        - { id: s1b, text: "attributes.status = 'Killed'" }
        - { id: s1a, text: "attributes.status = 'Failed'" }
        - { id: s1c, text: "attributes.status = Failed" }
        - { id: s1d, text: "tags.status = 'Failed'" }
    - id: s2
      options:
        - { id: s2c, text: metrics.start_time DESC }
        - { id: s2b, text: attributes.start_time ASC }
        - { id: s2a, text: attributes.start_time DESC }
    - id: s3
      options:
        - { id: s3c, text: top }
        - { id: s3b, text: limit }
        - { id: s3a, text: max_results }
answer:
  values: { s1: s1a, s2: s2a, s3: s3a }
explanation:
  correct:
    en: |
      Run status is an attribute, and attribute values must always be quoted strings: `attributes.status = 'Failed'`. Ordering by `attributes.start_time DESC` is supported and puts the most recent run first, and `max_results=1` keeps only that run.
    fr: |
      L'état d'une exécution est un attribut, et les valeurs d'attributs doivent toujours être des chaînes entre guillemets : `attributes.status = 'Failed'`. Le tri par `attributes.start_time DESC` est pris en charge et place l'exécution la plus récente en premier, et `max_results=1` ne conserve que celle-ci.
  options:
    s1b: { en: "`Killed` is the MLflow status of canceled jobs, not failed ones.", fr: "`Killed` est l'état MLflow des travaux annulés, pas des travaux en échec." }
    s1c: { en: "Attribute values must be enclosed in quotes.", fr: "Les valeurs d'attributs doivent être placées entre guillemets." }
    s1d: { en: "The status is a run attribute, not a tag.", fr: "L'état est un attribut de l'exécution, pas une étiquette." }
    s2b: { en: "Ascending order puts the oldest run first.", fr: "L'ordre croissant place l'exécution la plus ancienne en premier." }
    s2c: { en: "The start time is an attribute, and `order_by` doesn't accept `metrics.*` in Azure Machine Learning.", fr: "L'heure de début est un attribut, et `order_by` n'accepte pas `metrics.*` dans Azure Machine Learning." }
references:
  - title: Query & compare experiments and runs with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-track-experiments-mlflow
