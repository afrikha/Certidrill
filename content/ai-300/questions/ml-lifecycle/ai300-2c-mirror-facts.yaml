id: ai300-2c-mirror-facts
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a managed online endpoint named **ep-pricing**. A deployment named **blue** receives 100 percent of the live traffic. You plan to shadow test a new deployment named **green** by configuring mirrored traffic.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un point de terminaison en ligne managé nommé **ep-pricing**. Un déploiement nommé **blue** reçoit 100 % du trafic réel. Vous prévoyez de tester en mode fantôme un nouveau déploiement nommé **green** en configurant du trafic en miroir.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Clients receive only the responses of blue; green's responses aren't returned to them.", fr: "Les clients ne reçoivent que les réponses de blue ; celles de green ne leur sont pas renvoyées." } }
    - { id: b, text: { en: "Requests that set the header `azureml-model-deployment: blue` are mirrored to green too.", fr: "Les requêtes qui définissent l'en-tête `azureml-model-deployment: blue` sont aussi mises en miroir vers green." } }
    - { id: c, text: { en: "You can mirror traffic to two deployments at the same time if the total stays within the limit.", fr: "Vous pouvez mettre en miroir du trafic vers deux déploiements en même temps si le total reste dans la limite." } }
    - { id: d, text: { en: "You can mirror at most 50 percent of the traffic to green.", fr: "Vous pouvez mettre en miroir au plus 50 % du trafic vers green." } }
    - { id: e, text: { en: "The same mirroring configuration also works on a Kubernetes online endpoint.", fr: "La même configuration de mise en miroir fonctionne aussi sur un point de terminaison en ligne Kubernetes." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Mirrored traffic copies a percentage of the live requests to green: green's metrics and logs are recorded, but clients only get blue's predictions. At most 50 percent can be mirrored, to a single deployment per endpoint.
    fr: |
      Le trafic en miroir copie un pourcentage des requêtes réelles vers green : les métriques et les journaux de green sont enregistrés, mais les clients n'obtiennent que les prédictions de blue. Au plus 50 % peuvent être mis en miroir, vers un seul déploiement par point de terminaison.
  options:
    b: { en: "Requests that name a deployment go directly to it and aren't mirrored.", fr: "Les requêtes qui nomment un déploiement lui sont envoyées directement et ne sont pas mises en miroir." }
    c: { en: "Only one deployment per endpoint can receive mirrored traffic.", fr: "Un seul déploiement par point de terminaison peut recevoir du trafic en miroir." }
    e: { en: "Kubernetes online endpoints don't support mirrored traffic.", fr: "Les points de terminaison en ligne Kubernetes ne prennent pas en charge le trafic en miroir." }
references:
  - title: Perform safe rollout of new deployments for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
  - title: Online endpoints for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-online
