id: ai300-2c-batch-invoke-facts
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a batch endpoint named **invoice-batch** with a default model deployment. A data engineer plans to invoke the endpoint from a script by running the following command.

    ```bash
    az ml batch-endpoint invoke --name invoice-batch \
      --input azureml://datastores/workspaceblobstore/paths/invoices/2026-11-16/ \
      --input-type uri_folder \
      --output-path azureml://datastores/workspaceblobstore/paths/scores/ \
      --set output_file_name=scores.csv
    ```

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un point de terminaison de lot nommé **invoice-batch** avec un déploiement de modèle par défaut. Un ingénieur de données prévoit d'appeler le point de terminaison depuis un script en exécutant la commande suivante.

    ```bash
    az ml batch-endpoint invoke --name invoice-batch \
      --input azureml://datastores/workspaceblobstore/paths/invoices/2026-11-16/ \
      --input-type uri_folder \
      --output-path azureml://datastores/workspaceblobstore/paths/scores/ \
      --set output_file_name=scores.csv
    ```

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The command creates a job and returns its name; the predictions are available in storage when the job completes.", fr: "La commande crée un travail et renvoie son nom ; les prédictions sont disponibles dans le stockage quand le travail se termine." } }
    - { id: b, text: { en: "The command returns the predictions in its response once all the files are scored.", fr: "La commande renvoie les prédictions dans sa réponse une fois tous les fichiers notés." } }
    - { id: c, text: { en: "The job runs under the Microsoft Entra identity that the script uses to invoke the endpoint.", fr: "Le travail s'exécute sous l'identité Microsoft Entra que le script utilise pour appeler le point de terminaison." } }
    - { id: d, text: { en: "If scores.csv already exists in the output path, the job overwrites it.", fr: "Si scores.csv existe déjà dans le chemin de sortie, le travail le remplace." } }
    - { id: e, text: { en: "The output path can point to any datastore type registered in the workspace, including Azure Files.", fr: "Le chemin de sortie peut désigner n'importe quel type de magasin de données inscrit dans l'espace de travail, y compris Azure Files." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Invoking a batch endpoint starts an asynchronous scoring job and returns the job name; the results are files written to the output location. Batch endpoints use Microsoft Entra authentication, and the job runs under the identity associated with the token presented by the caller.
    fr: |
      Appeler un point de terminaison de lot démarre un travail de scoring asynchrone et renvoie le nom du travail ; les résultats sont des fichiers écrits à l'emplacement de sortie. Les points de terminaison de lot utilisent l'authentification Microsoft Entra, et le travail s'exécute sous l'identité associée au jeton présenté par l'appelant.
  options:
    b: { en: "Batch endpoints don't return predictions in the response; they write them to a datastore.", fr: "Les points de terminaison de lot ne renvoient pas les prédictions dans la réponse ; ils les écrivent dans un magasin de données." }
    d: { en: "If the output file already exists, the batch scoring job fails; use a unique file name or location.", fr: "Si le fichier de sortie existe déjà, le travail de scoring par lots échoue ; utilisez un nom de fichier ou un emplacement unique." }
    e: { en: "Outputs must go to a datastore backed by a blob storage account; only inputs have no such restriction.", fr: "Les sorties doivent aller vers un magasin de données reposant sur un compte de stockage blob ; seules les entrées n'ont pas cette restriction." }
references:
  - title: Deploy models for scoring in batch endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-batch-model-deployments
  - title: Authorization on batch endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-authenticate-batch-endpoint
