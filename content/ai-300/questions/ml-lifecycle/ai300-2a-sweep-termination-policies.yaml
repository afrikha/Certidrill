id: ai300-2a-sweep-termination-policies
objective: "2.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are configuring four sweep jobs in Azure Machine Learning. Each job has a different requirement for stopping poorly performing trials.

    Which `early_termination` configuration should you use for each requirement? To answer, drag the appropriate configurations to the correct requirements. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez quatre travaux de balayage dans Azure Machine Learning. Chaque travail a une exigence différente pour arrêter les essais peu performants.

    Quelle configuration `early_termination` devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les configurations appropriées vers les exigences correspondantes. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: bandit, text: "type: bandit" }
    - { id: median, text: "type: median_stopping" }
    - { id: trunc, text: "type: truncation_selection" }
    - { id: none, text: { en: "No early_termination section", fr: "Aucune section early_termination" } }
    - { id: grid, text: "type: grid" }
  targets:
    - id: t1
      text: { en: "Cancel trials whose metric falls outside a slack amount of the best trial", fr: "Annuler les essais dont la métrique sort d'une marge de tolérance par rapport au meilleur essai" }
    - id: t2
      text: { en: "Cancel trials whose running average is worse than the median of the running averages of all trials", fr: "Annuler les essais dont la moyenne courante est moins bonne que la médiane des moyennes courantes de tous les essais" }
    - id: t3
      text: { en: "Cancel the lowest-performing 20 % of trials at each evaluation interval", fr: "Annuler les 20 % d'essais les moins performants à chaque intervalle d'évaluation" }
    - id: t4
      text: { en: "Let every trial run to completion", fr: "Laisser chaque essai s'exécuter jusqu'au bout" }
answer:
  mapping: { t1: bandit, t2: median, t3: trunc, t4: none }
explanation:
  correct:
    en: |
      The bandit policy uses `slack_factor` (ratio) or `slack_amount` (absolute) relative to the best trial. Median stopping compares each trial's running average with the median of all running averages. Truncation selection cancels `truncation_percentage` percent of the lowest trials at each interval. Without an `early_termination` section, no policy applies and all trials complete.
    fr: |
      La stratégie bandit utilise `slack_factor` (ratio) ou `slack_amount` (valeur absolue) par rapport au meilleur essai. L'arrêt médian compare la moyenne courante de chaque essai à la médiane de toutes les moyennes courantes. La sélection par troncation annule `truncation_percentage` % des moins bons essais à chaque intervalle. Sans section `early_termination`, aucune stratégie ne s'applique et tous les essais vont jusqu'au bout.
  options:
    grid: { en: "grid is a sampling algorithm, not an early termination policy.", fr: "grid est un algorithme d'échantillonnage, pas une stratégie d'arrêt anticipé." }
references:
  - title: Hyperparameter tuning a model (v2)
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-tune-hyperparameters
