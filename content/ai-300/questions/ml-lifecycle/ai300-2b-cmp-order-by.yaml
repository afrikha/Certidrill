id: ai300-2b-cmp-order-by
objective: "2.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace that tracks experiments with MLflow. You run the following code from a compute instance:

    ```python
    best = mlflow.search_runs(
        experiment_names=["churn-training"],
        order_by=["metrics.val_auc DESC"],
        max_results=1,
    )
    ```

    The ordering expression is not supported by Azure Machine Learning. You need to return the run with the highest `val_auc` value in the experiment.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning qui suit les expériences avec MLflow. Vous exécutez le code suivant depuis une instance de calcul :

    ```python
    best = mlflow.search_runs(
        experiment_names=["churn-training"],
        order_by=["metrics.val_auc DESC"],
        max_results=1,
    )
    ```

    L'expression de tri n'est pas prise en charge par Azure Machine Learning. Vous devez renvoyer l'exécution ayant la valeur `val_auc` la plus élevée de l'expérience.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Remove `order_by` and `max_results`, then sort the DataFrame with `sort_values(\"metrics.val_auc\", ascending=False)` and keep the first row.", fr: "Supprimer `order_by` et `max_results`, puis trier le DataFrame avec `sort_values(\"metrics.val_auc\", ascending=False)` et conserver la première ligne." } }
    - { id: b, text: { en: "Replace the expression with `order_by=[\"attributes.start_time DESC\"]` and keep `max_results=1`.", fr: "Remplacer l'expression par `order_by=[\"attributes.start_time DESC\"]` et conserver `max_results=1`." } }
    - { id: c, text: { en: "Replace the expression with `order_by=[\"attributes.val_auc DESC\"]` and keep `max_results=1`.", fr: "Remplacer l'expression par `order_by=[\"attributes.val_auc DESC\"]` et conserver `max_results=1`." } }
    - { id: d, text: { en: "Add `output_format=\"list\"` so that the runs are returned as `Run` objects ordered by the metric.", fr: "Ajouter `output_format=\"list\"` pour que les exécutions soient renvoyées sous forme d'objets `Run` triés selon la métrique." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In Azure Machine Learning, `order_by` doesn't accept expressions that contain `metrics.*`, `params.*` or `tags.*`. `search_runs` returns a pandas DataFrame with a `metrics.val_auc` column, so you sort it with `sort_values` and take the first row.
    fr: |
      Dans Azure Machine Learning, `order_by` n'accepte pas les expressions contenant `metrics.*`, `params.*` ou `tags.*`. `search_runs` renvoie un DataFrame pandas avec une colonne `metrics.val_auc` : vous le triez avec `sort_values` et prenez la première ligne.
  options:
    c: { en: "Metrics are not run attributes; `attributes.*` covers values such as status, start time and duration.", fr: "Les métriques ne sont pas des attributs d'exécution ; `attributes.*` couvre des valeurs comme l'état, l'heure de début et la durée." }
    d: { en: "`output_format` only changes the type of the result; it doesn't sort runs by a metric.", fr: "`output_format` change seulement le type du résultat ; il ne trie pas les exécutions selon une métrique." }
    b: { en: "This returns the most recent run, not the run with the best metric.", fr: "Cela renvoie l'exécution la plus récente, pas celle qui a la meilleure métrique." }
references:
  - title: Query & compare experiments and runs with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-track-experiments-mlflow
