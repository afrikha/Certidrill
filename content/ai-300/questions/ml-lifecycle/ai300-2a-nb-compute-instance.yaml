id: ai300-2a-nb-compute-instance
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace that contains a compute cluster named **cpu-cluster** (0 to 4 nodes) and an Azure Arc-enabled Kubernetes cluster attached as **k8s-compute**.

    A data scientist opens a notebook in the **Notebooks** section of Azure Machine Learning studio. She needs to run its cells interactively to explore a dataset.

    Which compute should she use?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning qui contient un cluster de calcul nommé **cpu-cluster** (0 à 4 nœuds) et un cluster Kubernetes avec Azure Arc attaché en tant que **k8s-compute**.

    Une data scientist ouvre un notebook dans la section **Notebooks** d'Azure Machine Learning studio. Elle doit exécuter ses cellules de manière interactive pour explorer un jeu de données.

    Quel calcul doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "cpu-cluster", fr: "cpu-cluster" } }
    - { id: b, text: { en: "Serverless compute", fr: "Le calcul serverless" } }
    - { id: c, text: { en: "k8s-compute", fr: "k8s-compute" } }
    - { id: d, text: { en: "A compute instance", fr: "Une instance de calcul" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Running notebook cells in the studio requires a compute instance, a managed cloud workstation that hosts the Jupyter kernels. She can create one from the notebook toolbar (**+ New Compute**); a stopped instance starts automatically when she runs the first cell.
    fr: |
      Exécuter des cellules de notebook dans le studio demande une instance de calcul, une station de travail cloud managée qui héberge les noyaux Jupyter. Elle peut en créer une depuis la barre d'outils du notebook (**+ New Compute**) ; une instance arrêtée démarre automatiquement quand elle exécute la première cellule.
  options:
    a:
      en: |
        A compute cluster runs submitted jobs, not interactive notebook kernels.
      fr: |
        Un cluster de calcul exécute des travaux soumis, pas des noyaux de notebook interactifs.
    b:
      en: |
        Serverless compute runs jobs such as command, sweep and pipeline jobs, not notebook cells.
      fr: |
        Le calcul serverless exécute des travaux comme les travaux de commande, de balayage et de pipeline, pas des cellules de notebook.
    c:
      en: |
        An attached Kubernetes cluster is a target for jobs and inference, not for running notebook cells in the studio.
      fr: |
        Un cluster Kubernetes attaché est une cible pour les travaux et l'inférence, pas pour exécuter des cellules de notebook dans le studio.
references:
  - title: Run Jupyter notebooks in your workspace
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-run-jupyter-notebooks
