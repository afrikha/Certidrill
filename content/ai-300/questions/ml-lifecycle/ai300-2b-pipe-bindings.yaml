id: ai300-2b-pipe-bindings
objective: "2.1.7"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are writing the YAML files of an Azure Machine Learning training pipeline. The pipeline job has an input named `raw_data` and an output named `trained_model`. The `train` component declares an input named `training_data` and an output named `model_output`.

    Which expression should you use in each location? To answer, drag the appropriate expressions to the correct locations. Each expression may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez les fichiers YAML d'un pipeline d'entraînement Azure Machine Learning. Le travail de pipeline possède une entrée nommée `raw_data` et une sortie nommée `trained_model`. Le composant `train` déclare une entrée nommée `training_data` et une sortie nommée `model_output`.

    Quelle expression devez-vous utiliser à chaque emplacement ? Pour répondre, faites glisser les expressions appropriées vers les emplacements correspondants. Chaque expression peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: cout, text: "${{outputs.model_output}}" }
    - { id: pin, text: "${{parent.inputs.raw_data}}" }
    - { id: pjob, text: "${{parent.jobs.prep.outputs.clean_data}}" }
    - { id: pout, text: "${{parent.outputs.trained_model}}" }
    - { id: cin, text: "${{inputs.training_data}}" }
  targets:
    - { id: t1, text: { en: "Pipeline file: the `prep` step input that receives the pipeline input", fr: "Fichier de pipeline : l'entrée de l'étape `prep` qui reçoit l'entrée du pipeline" } }
    - { id: t2, text: { en: "Pipeline file: the `train` step output that becomes the pipeline output", fr: "Fichier de pipeline : la sortie de l'étape `train` qui devient la sortie du pipeline" } }
    - { id: t3, text: { en: "Component file: the `--data` argument of the `train` command", fr: "Fichier de composant : l'argument `--data` de la commande de `train`" } }
    - { id: t4, text: { en: "Component file: the `--model-dir` argument of the `train` command", fr: "Fichier de composant : l'argument `--model-dir` de la commande de `train`" } }
answer:
  mapping: { t1: pin, t2: pout, t3: cin, t4: cout }
explanation:
  correct:
    en: |
      In the pipeline file, `${{parent.inputs.<name>}}` passes a pipeline input to a step and `${{parent.outputs.<name>}}` promotes a step output to a pipeline output. Inside a component command, the component refers to its own interface with `${{inputs.<name>}}` and `${{outputs.<name>}}`.
    fr: |
      Dans le fichier de pipeline, `${{parent.inputs.<name>}}` transmet une entrée du pipeline à une étape et `${{parent.outputs.<name>}}` fait d'une sortie d'étape une sortie du pipeline. Dans la commande d'un composant, le composant fait référence à sa propre interface avec `${{inputs.<name>}}` et `${{outputs.<name>}}`.
  options:
    pjob: { en: "This expression connects the output of the `prep` step to the input of a later step; none of the locations needs it.", fr: "Cette expression relie la sortie de l'étape `prep` à l'entrée d'une étape suivante ; aucun des emplacements n'en a besoin." }
references:
  - title: CLI (v2) pipeline job YAML schema
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-job-pipeline
  - title: CLI (v2) command component YAML schema
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-component-command
