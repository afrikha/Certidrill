id: ai300-2b-pipe-serverless
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-fabrikam** that contains no compute clusters. You define a pipeline job in YAML with three command steps: `prep`, `train` and `evaluate`.

    You need all the steps to run on serverless compute. The solution must minimize the number of settings that you add to the pipeline file.

    What should you add to the pipeline job?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-fabrikam** qui ne contient aucun cluster de calcul. Vous définissez en YAML un travail de pipeline comportant trois étapes command : `prep`, `train` et `evaluate`.

    Toutes les étapes doivent s'exécuter sur un calcul serverless. La solution doit réduire au minimum le nombre de paramètres ajoutés au fichier de pipeline.

    Que devez-vous ajouter au travail de pipeline ?
body:
  options:
    - { id: a, text: { en: "`default_datastore: azureml:serverless` under `settings`", fr: "`default_datastore: azureml:serverless` sous `settings`" } }
    - { id: b, text: { en: "`identity: type: managed` at the top level of the pipeline", fr: "`identity: type: managed` au niveau supérieur du pipeline" } }
    - { id: c, text: { en: "`compute: azureml:serverless` on each of the three steps", fr: "`compute: azureml:serverless` sur chacune des trois étapes" } }
    - { id: d, text: { en: "`default_compute: azureml:serverless` under `settings`", fr: "`default_compute: azureml:serverless` sous `settings`" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      For pipeline jobs defined with the Azure CLI, `default_compute: azureml:serverless` in `settings` sets serverless compute as the pipeline-level default. Every step that doesn't declare its own `compute` uses it, so one setting covers the three steps.
    fr: |
      Pour les travaux de pipeline définis avec Azure CLI, `default_compute: azureml:serverless` dans `settings` fait du calcul serverless la valeur par défaut au niveau du pipeline. Chaque étape qui ne déclare pas son propre `compute` l'utilise ; un seul paramètre couvre donc les trois étapes.
  options:
    c: { en: "This could work, but it adds three settings instead of one, so it does not minimize the changes.", fr: "Cela pourrait fonctionner, mais ajoute trois paramètres au lieu d'un : les modifications ne sont pas réduites au minimum." }
    a: { en: "`default_datastore` sets where pipeline outputs are written, not where steps run.", fr: "`default_datastore` définit où les sorties du pipeline sont écrites, pas où les étapes s'exécutent." }
    b: { en: "The identity setting controls data access, not the compute target.", fr: "Le paramètre identity contrôle l'accès aux données, pas la cible de calcul." }
references:
  - title: Model training on serverless compute
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-serverless-compute
