id: ai300-2a-mlflow-logging-functions
objective: "2.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are writing a training script that runs as a command job in an Azure Machine Learning workspace. The script must record four kinds of information in the job by using MLflow.

    Which MLflow function should you use for each kind of information? To answer, drag the appropriate functions to the correct information. Each function may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez un script d'entraînement qui s'exécute dans un travail de commande dans un espace de travail Azure Machine Learning. Le script doit enregistrer quatre types d'informations dans le travail avec MLflow.

    Quelle fonction MLflow devez-vous utiliser pour chaque type d'information ? Pour répondre, faites glisser les fonctions appropriées vers les informations correspondantes. Chaque fonction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: param, text: mlflow.log_param }
    - { id: params, text: mlflow.log_params }
    - { id: metric, text: mlflow.log_metric }
    - { id: figure, text: mlflow.log_figure }
    - { id: artifact, text: mlflow.log_artifact }
    - { id: artifacts, text: mlflow.log_artifacts }
  targets:
    - id: t1
      text: { en: "A dictionary that contains the six hyperparameter values of the run", fr: "Un dictionnaire qui contient les six valeurs d'hyperparamètres de l'exécution" }
    - id: t2
      text: { en: "The validation loss at the end of each epoch, displayed as a curve", fr: "La perte de validation à la fin de chaque époque, affichée sous forme de courbe" }
    - id: t3
      text: { en: "A matplotlib confusion matrix built in memory", fr: "Une matrice de confusion matplotlib construite en mémoire" }
    - id: t4
      text: { en: "Every file in an existing reports folder", fr: "Tous les fichiers d'un dossier reports existant" }
answer:
  mapping: { t1: params, t2: metric, t3: figure, t4: artifacts }
explanation:
  correct:
    en: "`log_params` takes a dictionary of parameters in one call. Repeated `log_metric` calls with the same key (and a `step`) build a curve. `log_figure` saves a matplotlib figure as an artifact without writing a file first. `log_artifacts` uploads the contents of an existing folder, while `log_artifact` uploads a single file."
    fr: "`log_params` prend un dictionnaire de paramètres en un seul appel. Des appels répétés à `log_metric` avec la même clé (et un `step`) forment une courbe. `log_figure` enregistre une figure matplotlib comme artefact sans écrire de fichier au préalable. `log_artifacts` charge le contenu d'un dossier existant, alors que `log_artifact` charge un seul fichier."
  options:
    param: { en: "log_param logs a single parameter, not a dictionary.", fr: "log_param enregistre un seul paramètre, pas un dictionnaire." }
    artifact: { en: "log_artifact uploads one existing file, not a whole folder.", fr: "log_artifact charge un seul fichier existant, pas un dossier entier." }
references:
  - title: Log metrics, parameters, and files with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-log-view-metrics
