id: ai300-2a-automl-classification-code
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are configuring an AutoML job by using the Python SDK v2 to predict whether a customer will cancel a subscription (column **churned**, values 0 or 1).

    The requirements are:

    - The training set is small and highly imbalanced (3 % of the rows are churners), and the primary metric must suit this kind of data.
    - Logistic regression must not be tried. All other algorithms remain allowed.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez un travail AutoML avec le SDK Python v2 pour prédire si un client va résilier un abonnement (colonne **churned**, valeurs 0 ou 1).

    Les exigences sont les suivantes :

    - Le jeu d'entraînement est petit et très déséquilibré (3 % des lignes sont des résiliations), et la métrique principale doit convenir à ce type de données.
    - La régression logistique ne doit pas être essayée. Tous les autres algorithmes restent autorisés.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.ai.ml import automl, Input
    from azure.ai.ml.constants import AssetTypes

    job = automl.[[task]](
        compute="cpu-cluster",
        experiment_name="churn-automl",
        training_data=Input(type=AssetTypes.MLTABLE, path="azureml:churn-train@latest"),
        target_column_name="churned",
        primary_metric="[[metric]]",
    )
    job.[[method]](blocked_training_algorithms=["logistic_regression"])
    ml_client.jobs.create_or_update(job)
  slots:
    - id: task
      options:
        - { id: task-reg, text: regression }
        - { id: task-cls, text: classification }
        - { id: task-fc, text: forecasting }
    - id: metric
      options:
        - { id: m-acc, text: accuracy }
        - { id: m-r2, text: r2_score }
        - { id: m-auc, text: AUC_weighted }
        - { id: m-nrmse, text: normalized_root_mean_squared_error }
    - id: method
      options:
        - { id: f-limits, text: set_limits }
        - { id: f-feat, text: set_featurization }
        - { id: f-train, text: set_training }
answer:
  values: { task: task-cls, metric: m-auc, method: f-train }
explanation:
  correct:
    en: |
      A 0/1 target is a classification task. Microsoft notes that `AUC_weighted` can be a better primary metric than accuracy for small datasets and imbalanced classes. Algorithm selection (`allowed_training_algorithms`, `blocked_training_algorithms`) belongs to `set_training()`.
    fr: |
      Une cible 0/1 relève d'une tâche de classification. Microsoft indique que `AUC_weighted` peut être une meilleure métrique principale que la justesse (accuracy) pour les petits jeux de données et les classes déséquilibrées. Le choix des algorithmes (`allowed_training_algorithms`, `blocked_training_algorithms`) relève de `set_training()`.
  options:
    task-reg: { en: "Regression predicts a continuous value, not a 0/1 class.", fr: "La régression prédit une valeur continue, pas une classe 0/1." }
    task-fc: { en: "Forecasting predicts future values of a time series.", fr: "La prévision prédit les valeurs futures d'une série chronologique." }
    m-acc: { en: "Accuracy is misleading on imbalanced data: predicting no churn at all already scores 97 %.", fr: "La justesse est trompeuse sur des données déséquilibrées : ne jamais prédire de résiliation donne déjà 97 %." }
    m-r2: { en: "r2_score is a regression and forecasting metric.", fr: "r2_score est une métrique de régression et de prévision." }
    m-nrmse: { en: "This is a regression and forecasting metric.", fr: "C'est une métrique de régression et de prévision." }
    f-limits: { en: "set_limits sets timeouts and trial counts, not algorithms.", fr: "set_limits définit les délais et le nombre d'essais, pas les algorithmes." }
    f-feat: { en: "set_featurization controls feature engineering, not the algorithms tried.", fr: "set_featurization contrôle l'ingénierie des caractéristiques, pas les algorithmes essayés." }
references:
  - title: Set up AutoML training for tabular data with the Azure Machine Learning CLI and Python SDK
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-auto-train
