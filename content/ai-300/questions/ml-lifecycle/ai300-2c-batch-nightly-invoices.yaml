id: ai300-2c-batch-nightly-invoices
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Machine Learning workspace named **mlw-finance** that contains a registered MLflow model named **invoice-risk**.

    Every night, about 400,000 invoice files are written to a folder in the workspace blob datastore. The model must score all the files and write the predictions to storage before 06:00. No application needs an immediate response, and the compute must not incur charges during the day.

    What should you use to serve the model?
  fr: |
    Contoso dispose d'un espace de travail Azure Machine Learning nommé **mlw-finance** qui contient un modèle MLflow inscrit nommé **invoice-risk**.

    Chaque nuit, environ 400 000 fichiers de factures sont écrits dans un dossier du magasin de données blob de l'espace de travail. Le modèle doit noter tous les fichiers et écrire les prédictions dans le stockage avant 06:00. Aucune application n'a besoin d'une réponse immédiate, et le calcul ne doit pas être facturé pendant la journée.

    Que devez-vous utiliser pour servir le modèle ?
body:
  options:
    - { id: a, text: { en: "A managed online endpoint with an autoscale rule based on CPU utilization", fr: "Un point de terminaison en ligne managé avec une règle de mise à l'échelle automatique basée sur l'utilisation du processeur" } }
    - { id: b, text: { en: "A managed online endpoint invoked file by file from a scheduled notebook", fr: "Un point de terminaison en ligne managé appelé fichier par fichier depuis un notebook planifié" } }
    - { id: c, text: { en: "A Kubernetes online endpoint on a cluster attached to the workspace", fr: "Un point de terminaison en ligne Kubernetes sur un cluster attaché à l'espace de travail" } }
    - { id: d, text: { en: "A batch endpoint whose deployment runs on a compute cluster with a minimum of 0 nodes", fr: "Un point de terminaison de lot dont le déploiement s'exécute sur un cluster de calcul avec un minimum de 0 nœud" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Batch endpoints run asynchronous scoring jobs over large sets of files and write the results to a datastore, with no low-latency requirement. The deployment runs on a compute cluster that is provisioned when a job starts; with a minimum of 0 nodes, the cluster costs nothing while no job runs.
    fr: |
      Les points de terminaison de lot exécutent des travaux de scoring asynchrones sur de grands ensembles de fichiers et écrivent les résultats dans un magasin de données, sans exigence de faible latence. Le déploiement s'exécute sur un cluster de calcul approvisionné au démarrage d'un travail ; avec un minimum de 0 nœud, le cluster ne coûte rien tant qu'aucun travail ne s'exécute.
  options:
    a: { en: "An online endpoint is built for per-request, low-latency scoring and keeps its instances running, so it is charged all day.", fr: "Un point de terminaison en ligne est conçu pour un scoring à faible latence par requête et garde ses instances actives : il est facturé toute la journée." }
    b: { en: "Calling an online endpoint once per file is custom orchestration, and the endpoint's instances stay allocated, which is charged during the day.", fr: "Appeler un point de terminaison en ligne pour chaque fichier est une orchestration sur mesure, et les instances du point de terminaison restent allouées, ce qui est facturé pendant la journée." }
    c: { en: "A Kubernetes online endpoint also serves real-time requests and runs on a cluster you operate; it does not process files asynchronously.", fr: "Un point de terminaison en ligne Kubernetes sert lui aussi des requêtes en temps réel sur un cluster que vous exploitez ; il ne traite pas des fichiers de façon asynchrone." }
references:
  - title: What are batch endpoints?
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-batch
  - title: Deploy models for scoring in batch endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-batch-model-deployments
