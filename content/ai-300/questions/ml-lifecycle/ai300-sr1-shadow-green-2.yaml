id: ai300-sr1-shadow-green-2
objective: "2.3.3"
type: series_yesno
series: ai300-sr1-shadow-green
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You make a test script send requests to green by using the azureml-model-deployment header.
  fr: Vous faites envoyer des requêtes à green par un script de test à l'aide de l'en-tête azureml-model-deployment.
body:
  solution:
    en: |
      You keep the traffic of ep-credit at `blue=100`. You write a test script that replays a sample of requests copied from the client applications' logs to the scoring URI of ep-credit, with the header `azureml-model-deployment: green`.
    fr: |
      Vous conservez le trafic de ep-credit à `blue=100`. Vous écrivez un script de test qui rejoue un échantillon de requêtes copiées depuis les journaux des applications clientes vers l'URI de scoring de ep-credit, avec l'en-tête `azureml-model-deployment: green`.
answer: { value: false }
explanation:
  correct:
    en: |
      The `azureml-model-deployment` header bypasses the traffic rules and targets green directly, so clients are unaffected. However, green only processes the requests that the script replays, not a continuous copy of 20 percent of the live requests that client applications send to ep-credit. Mirrored traffic is the feature that copies a percentage of live requests to a deployment. The goal isn't met.
    fr: |
      L'en-tête `azureml-model-deployment` contourne les règles de trafic et cible green directement : les clients ne sont donc pas affectés. Cependant, green traite uniquement les requêtes rejouées par le script, et non une copie continue de 20 % des requêtes en direct que les applications clientes envoient à ep-credit. C'est le trafic en miroir qui copie un pourcentage des requêtes en direct vers un déploiement. L'objectif n'est pas atteint.
references:
  - title: Safe rollout for online endpoints - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints?view=azureml-api-2
