id: ai300-2b-reg-best-run-order
objective: "2.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace. An experiment named **churn-training** contains 40 completed runs. Each run logged an MLflow model under the artifact path `model` and the metric `val_auc`.

    In a notebook, you need to register the model of the run with the highest `val_auc` as **churn-classifier**, with lineage to that run, and then mark the new version with the tag `validated=true` so that the release process can find it.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning. Une expérience nommée **churn-training** contient 40 exécutions terminées. Chaque exécution a journalisé un modèle MLflow sous le chemin d'artefact `model` ainsi que la métrique `val_auc`.

    Dans un notebook, vous devez inscrire le modèle de l'exécution ayant la valeur `val_auc` la plus élevée sous le nom **churn-classifier**, avec une traçabilité vers cette exécution, puis marquer la nouvelle version avec l'étiquette `validated=true` pour que le processus de mise en production puisse la trouver.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: search, text: { en: "Call `mlflow.search_runs(experiment_names=[\"churn-training\"])`.", fr: "Appeler `mlflow.search_runs(experiment_names=[\"churn-training\"])`." } }
    - { id: stage, text: { en: "Call `transition_model_version_stage()` to move the version to `Production`, and deploy from that stage.", fr: "Appeler `transition_model_version_stage()` pour faire passer la version à `Production`, puis déployer à partir de cette étape." } }
    - { id: sort, text: { en: "Sort the DataFrame by `metrics.val_auc` in descending order and read the `run_id` of the first row.", fr: "Trier le DataFrame par `metrics.val_auc` dans l'ordre décroissant et lire le `run_id` de la première ligne." } }
    - { id: tag, text: { en: "Call `MlflowClient().set_model_version_tag()` on the returned version with `validated` = `true`.", fr: "Appeler `MlflowClient().set_model_version_tag()` sur la version renvoyée avec `validated` = `true`." } }
    - { id: dl, text: { en: "Download the model with `mlflow.artifacts.download_artifacts()` and register it from the local folder.", fr: "Télécharger le modèle avec `mlflow.artifacts.download_artifacts()` et l'inscrire à partir du dossier local." } }
    - { id: reg, text: { en: "Call `mlflow.register_model(f\"runs:/{run_id}/model\", \"churn-classifier\")`.", fr: "Appeler `mlflow.register_model(f\"runs:/{run_id}/model\", \"churn-classifier\")`." } }
answer:
  sequence: [ search, sort, reg, tag ]
explanation:
  correct:
    en: |
      `search_runs` returns a DataFrame of the experiment's runs, which you sort on `metrics.val_auc` because `order_by` can't use metrics. Registering from the `runs:/` URI of the best run keeps the lineage, and the tag can only be set on the model version once it exists.
    fr: |
      `search_runs` renvoie un DataFrame des exécutions de l'expérience, que vous triez sur `metrics.val_auc`, car `order_by` ne peut pas utiliser les métriques. L'inscription à partir de l'URI `runs:/` de la meilleure exécution conserve la traçabilité, et l'étiquette ne peut être définie sur la version de modèle qu'une fois celle-ci créée.
  options:
    stage: { en: "Stages exist only in the MLflow SDK, aren't visible in the studio or the Azure Machine Learning CLI, and you can't deploy from a stage.", fr: "Les étapes n'existent que dans le SDK MLflow, ne sont visibles ni dans le studio ni dans l'interface CLI d'Azure Machine Learning, et vous ne pouvez pas déployer à partir d'une étape." }
    dl: { en: "Registering downloaded files loses the lineage to the run.", fr: "Inscrire des fichiers téléchargés fait perdre la traçabilité vers l'exécution." }
references:
  - title: Manage models registry in Azure Machine Learning with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models-mlflow
  - title: Query & compare experiments and runs with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-track-experiments-mlflow
