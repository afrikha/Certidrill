id: ai300-2a-nb-submit-job-sdk
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You explore data in a notebook on a compute instance. You now want to run the training code as a command job on a compute cluster named **cpu-cluster** directly from the notebook, and follow the job output in the notebook until the job ends.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous explorez des données dans un notebook sur une instance de calcul. Vous voulez maintenant exécuter le code d'entraînement dans un travail de commande sur un cluster de calcul nommé **cpu-cluster** directement depuis le notebook, et suivre la sortie du travail dans le notebook jusqu'à sa fin.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.ai.ml import MLClient, Input, command
    from azure.identity import DefaultAzureCredential

    ml_client = MLClient(DefaultAzureCredential(), subscription_id, resource_group, workspace)

    job = command(
        code="./src",
        command="python train.py --data ${{inputs.data}}",
        inputs={"data": Input(type="uri_folder", path="azureml:sales-raw@latest")},
        environment="AzureML-sklearn-1.5@latest",
        compute="cpu-cluster",
    )

    returned_job = ml_client.[[ops]].[[submit]](job)
    ml_client.jobs.[[follow]](returned_job.name)
  slots:
    - id: ops
      options:
        - { id: o-compute, text: compute }
        - { id: o-jobs, text: jobs }
        - { id: o-envs, text: environments }
    - id: submit
      options:
        - { id: s-get, text: get }
        - { id: s-list, text: list }
        - { id: s-cou, text: create_or_update }
    - id: follow
      options:
        - { id: f-stream, text: stream }
        - { id: f-download, text: download }
        - { id: f-get, text: get }
answer:
  values: { ops: o-jobs, submit: s-cou, follow: f-stream }
explanation:
  correct:
    en: |
      The same `azure-ai-ml` client used for exploration submits jobs. `ml_client.jobs.create_or_update(job)` submits the command job and returns it, and `ml_client.jobs.stream(name)` prints the job logs until the job finishes.
    fr: |
      Le même client `azure-ai-ml` que celui de l'exploration soumet les travaux. `ml_client.jobs.create_or_update(job)` soumet le travail de commande et le renvoie, et `ml_client.jobs.stream(name)` affiche les journaux du travail jusqu'à sa fin.
  options:
    o-compute: { en: "The compute operations manage compute targets, not jobs.", fr: "Les opérations compute gèrent les cibles de calcul, pas les travaux." }
    o-envs: { en: "The environments operations manage environments, not jobs.", fr: "Les opérations environments gèrent les environnements, pas les travaux." }
    s-get: { en: "get retrieves an existing job; it doesn't submit one.", fr: "get récupère un travail existant ; il n'en soumet pas." }
    s-list: { en: "list enumerates jobs; it doesn't submit one.", fr: "list énumère les travaux ; il n'en soumet pas." }
    f-download: { en: "download retrieves outputs and logs after the fact; it doesn't follow the run.", fr: "download récupère les sorties et les journaux après coup ; il ne suit pas l'exécution." }
    f-get: { en: "get returns the current status once; it doesn't stream the output.", fr: "get renvoie l'état actuel une seule fois ; il ne diffuse pas la sortie." }
references:
  - title: Train models with Azure Machine Learning CLI, SDK, and REST API
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-train-model
