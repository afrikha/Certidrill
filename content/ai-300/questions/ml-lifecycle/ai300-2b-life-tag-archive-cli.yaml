id: ai300-2b-life-tag-archive-cli
objective: "2.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace that contains a registered model named **churn-classifier**. Version 5 has passed validation, and version 3 is obsolete but is still referenced by an old pipeline that must keep working.

    You need to meet the following requirements:

    - Mark version 5 with the tag `stage` set to `Prod`.
    - Hide version 3 from the default results of `az ml model list`.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning qui contient un modèle inscrit nommé **churn-classifier**. La version 5 a réussi la validation, et la version 3 est obsolète mais toujours référencée par un ancien pipeline qui doit continuer de fonctionner.

    Vous devez répondre aux exigences suivantes :

    - Marquer la version 5 avec l'étiquette `stage` définie sur `Prod`.
    - Masquer la version 3 dans les résultats par défaut de `az ml model list`.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az ml model [[s1]] --name churn-classifier --version 5 \
      --set [[s2]]

    az ml model [[s3]] --name churn-classifier --version 3
  slots:
    - id: s1
      options:
        - { id: s1d, text: restore }
        - { id: s1c, text: share }
        - { id: s1a, text: update }
        - { id: s1b, text: create }
    - id: s2
      options:
        - { id: s2c, text: properties.stage="Prod" }
        - { id: s2b, text: stage="Prod" }
        - { id: s2a, text: tags.stage="Prod" }
    - id: s3
      options:
        - { id: s3c, text: update }
        - { id: s3a, text: archive }
        - { id: s3d, text: download }
        - { id: s3b, text: delete }
answer:
  values: { s1: s1a, s2: s2a, s3: s3a }
explanation:
  correct:
    en: |
      `az ml model update --set tags.<key>=<value>` changes the tags of a version; only the description and tags are mutable. `az ml model archive` with `--version` hides that version from list queries, while jobs and pipelines that reference it explicitly keep working.
    fr: |
      `az ml model update --set tags.<key>=<value>` modifie les étiquettes d'une version ; seules la description et les étiquettes sont modifiables. `az ml model archive` avec `--version` masque cette version dans les requêtes de liste, tandis que les travaux et pipelines qui la référencent explicitement continuent de fonctionner.
  options:
    s1b: { en: "`create` registers a new version; it doesn't change an existing one.", fr: "`create` inscrit une nouvelle version ; il ne modifie pas une version existante." }
    s2b: { en: "`stage` is not one of the mutable fields; only `description` and `tags` can be updated.", fr: "`stage` ne fait pas partie des champs modifiables ; seuls `description` et `tags` peuvent être mis à jour." }
    s2c: { en: "Properties are immutable after registration.", fr: "Les propriétés sont immuables après l'inscription." }
    s3b: { en: "The `az ml model` group has no `delete` subcommand, and deleting would break the old pipeline.", fr: "Le groupe `az ml model` ne comporte pas de sous-commande `delete`, et une suppression interromprait l'ancien pipeline." }
    s3c: { en: "Updating tags or the description doesn't hide a version from list results.", fr: "Modifier les étiquettes ou la description ne masque pas une version dans les résultats de liste." }
references:
  - title: Work with registered models in Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
  - title: az ml model
    url: https://learn.microsoft.com/en-us/cli/azure/ml/model
