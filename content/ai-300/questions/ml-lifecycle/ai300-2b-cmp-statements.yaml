id: ai300-2b-cmp-statements
objective: "2.1.8"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace that contains several experiments. You set the active experiment with `mlflow.set_experiment("churn-training")` and compare runs with `mlflow.search_runs`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning qui contient plusieurs expériences. Vous définissez l'expérience active avec `mlflow.set_experiment("churn-training")` et comparez les exécutions avec `mlflow.search_runs`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Calling `mlflow.search_runs()` without `experiment_ids`, `experiment_names` or `search_all_experiments` returns the runs of every experiment in the workspace.
        fr: Appeler `mlflow.search_runs()` sans `experiment_ids`, `experiment_names` ni `search_all_experiments` renvoie les exécutions de toutes les expériences de l'espace de travail.
    - id: s2
      text:
        en: For a metric logged several times in a run, the `metrics.<name>` column of the returned DataFrame contains the last logged value.
        fr: Pour une métrique journalisée plusieurs fois dans une exécution, la colonne `metrics.<name>` du DataFrame renvoyé contient la dernière valeur journalisée.
    - id: s3
      text:
        en: A job that a user canceled in Azure Machine Learning studio is returned by the filter `attributes.status = 'Killed'`.
        fr: Un travail qu'un utilisateur a annulé dans Azure Machine Learning studio est renvoyé par le filtre `attributes.status = 'Killed'`.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Without an experiment argument or `search_all_experiments=True`, MLflow searches only the active experiment, here churn-training. For metrics logged several times, `search_runs` returns only the last value; use `get_metric_history` for all of them. The Azure Machine Learning status Canceled corresponds to the MLflow status `Killed`.
    fr: |
      Sans argument d'expérience ni `search_all_experiments=True`, MLflow ne recherche que dans l'expérience active, ici churn-training. Pour les métriques journalisées plusieurs fois, `search_runs` ne renvoie que la dernière valeur ; utilisez `get_metric_history` pour les obtenir toutes. L'état Canceled d'Azure Machine Learning correspond à l'état MLflow `Killed`.
references:
  - title: Query & compare experiments and runs with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-track-experiments-mlflow
