id: ai300-2c-monitoring-facts
objective: "2.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to use Azure Machine Learning model monitoring to detect drift for several models deployed to managed online endpoints. The workspace uses a managed virtual network.

    Which two statements about model monitoring are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit d'utiliser la surveillance des modèles Azure Machine Learning pour détecter la dérive de plusieurs modèles déployés sur des points de terminaison en ligne managés. L'espace de travail utilise un réseau virtuel managé.

    Quelles sont les deux affirmations vraies concernant la surveillance des modèles ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A monitor is created with the `az ml monitor create` command.", fr: "Une surveillance se crée avec la commande `az ml monitor create`." } }
    - { id: b, text: { en: "Model monitoring isn't supported when the managed network uses the `AllowOnlyApprovedOutbound` isolation mode.", fr: "La surveillance des modèles n'est pas prise en charge quand le réseau managé utilise le mode d'isolation `AllowOnlyApprovedOutbound`." } }
    - { id: c, text: { en: "The data drift signal requires ground truth data as reference data.", fr: "Le signal de dérive des données nécessite des données de vérité terrain comme données de référence." } }
    - { id: d, text: { en: "Feature attribution drift can use recent past production data as reference data.", fr: "La dérive de l'attribution des caractéristiques peut utiliser des données de production récentes comme données de référence." } }
    - { id: e, text: { en: "Monitoring jobs compute their metrics on Spark compute specified in the `compute` section of the monitor.", fr: "Les travaux de surveillance calculent leurs métriques sur un calcul Spark indiqué dans la section `compute` de la surveillance." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Model monitoring relies on Spark to compute metrics over large datasets; the monitor's `compute` section sets the instance type and the Spark runtime version. Model monitoring doesn't support the `AllowOnlyApprovedOutbound` managed virtual network isolation setting.
    fr: |
      La surveillance des modèles s'appuie sur Spark pour calculer les métriques sur de grands jeux de données ; la section `compute` de la surveillance définit le type d'instance et la version du runtime Spark. La surveillance des modèles ne prend pas en charge le paramètre d'isolation de réseau virtuel managé `AllowOnlyApprovedOutbound`.
  options:
    a: { en: "A monitor is a schedule: you create it with az ml schedule create and a file that contains create_monitor.", fr: "Une surveillance est une planification : vous la créez avec az ml schedule create et un fichier qui contient create_monitor." }
    c: { en: "Data drift uses training data or recent past production data; only model performance needs ground truth.", fr: "La dérive des données utilise des données d'entraînement ou des données de production récentes ; seules les performances du modèle nécessitent une vérité terrain." }
    d: { en: "Feature attribution drift requires training data as reference.", fr: "La dérive de l'attribution des caractéristiques nécessite des données d'entraînement comme référence." }
references:
  - title: Model monitoring in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-model-monitoring
  - title: Monitor model performance in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance
