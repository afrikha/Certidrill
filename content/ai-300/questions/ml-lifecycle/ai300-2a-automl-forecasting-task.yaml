id: ai300-2a-automl-forecasting-task
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has three years of daily sales for each of its 40 stores in an MLTable. The company needs to predict the sales of each store for each of the next 14 days.

    You plan to use automated machine learning in Azure Machine Learning.

    Which task type should you select?
  fr: |
    Northwind Traders dispose de trois ans de ventes quotidiennes pour chacun de ses 40 magasins dans une MLTable. L'entreprise doit prédire les ventes de chaque magasin pour chacun des 14 prochains jours.

    Vous prévoyez d'utiliser le machine learning automatisé dans Azure Machine Learning.

    Quel type de tâche devez-vous sélectionner ?
body:
  options:
    - { id: a, text: { en: "Classification", fr: "Classification" } }
    - { id: b, text: { en: "Time series forecasting", fr: "Prévision de séries chronologiques" } }
    - { id: c, text: { en: "Regression", fr: "Régression" } }
    - { id: d, text: { en: "Named entity recognition", fr: "Reconnaissance d'entités nommées" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Predicting future values of a series indexed by time, over a forecast horizon (here 14 days), is the time series forecasting task. It takes a time column and a forecast horizon and offers forecasting-specific algorithms such as AutoARIMA, Prophet and TCNForecaster.
    fr: |
      Prédire les valeurs futures d'une série indexée par le temps, sur un horizon de prévision (ici 14 jours), relève de la tâche de prévision de séries chronologiques. Elle prend une colonne de temps et un horizon de prévision, et propose des algorithmes propres à la prévision comme AutoARIMA, Prophet et TCNForecaster.
  options:
    a:
      en: |
        Classification predicts a category, not a future numeric value.
      fr: |
        La classification prédit une catégorie, pas une valeur numérique future.
    c:
      en: |
        Regression predicts a number but ignores the time ordering and the forecast horizon that this scenario needs.
      fr: |
        La régression prédit un nombre mais ignore l'ordre temporel et l'horizon de prévision dont ce scénario a besoin.
    d:
      en: |
        Named entity recognition is a text task.
      fr: |
        La reconnaissance d'entités nommées est une tâche de texte.
references:
  - title: Set up AutoML training for tabular data with the Azure Machine Learning CLI and Python SDK
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-auto-train
  - title: Set up no-code Automated ML training for tabular data with the studio UI
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-automated-ml-for-ml-models
