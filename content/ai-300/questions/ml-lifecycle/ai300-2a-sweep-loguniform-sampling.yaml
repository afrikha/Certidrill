id: ai300-2a-sweep-loguniform-sampling
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have the following extract of a sweep job YAML file in Azure Machine Learning:

    ```yaml
    sampling_algorithm: grid
    search_space:
      learning_rate:
        type: loguniform
        min_value: -6
        max_value: -1
      max_depth:
        type: choice
        values: [4, 8, 16]
    ```

    The job fails validation. The learning rate must keep its log-uniform distribution, and both hyperparameters must still be tuned.

    What should you do?
  fr: |
    Vous disposez de l'extrait suivant d'un fichier YAML de travail de balayage dans Azure Machine Learning :

    ```yaml
    sampling_algorithm: grid
    search_space:
      learning_rate:
        type: loguniform
        min_value: -6
        max_value: -1
      max_depth:
        type: choice
        values: [4, 8, 16]
    ```

    Le travail échoue à la validation. Le taux d'apprentissage doit conserver sa distribution log-uniforme, et les deux hyperparamètres doivent toujours être réglés.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change `sampling_algorithm` to `bayesian`.", fr: "Remplacer `sampling_algorithm` par `bayesian`." } }
    - { id: b, text: { en: "Change `sampling_algorithm` to `random`.", fr: "Remplacer `sampling_algorithm` par `random`." } }
    - { id: c, text: { en: "Keep `grid` and set `limits.max_total_trials` to 30.", fr: "Conserver `grid` et définir `limits.max_total_trials` sur 30." } }
    - { id: d, text: { en: "Keep `grid` and change `max_depth` to `type: uniform`.", fr: "Conserver `grid` et remplacer `max_depth` par `type: uniform`." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Grid sampling supports only `choice` parameters, so the `loguniform` learning rate makes the job invalid. Random sampling supports both discrete and continuous distributions, including `loguniform`, so it keeps both hyperparameters as defined.
    fr: |
      L'échantillonnage par grille ne prend en charge que les paramètres `choice` : le taux d'apprentissage `loguniform` rend le travail invalide. L'échantillonnage aléatoire prend en charge les distributions discrètes et continues, dont `loguniform`, et conserve donc les deux hyperparamètres tels qu'ils sont définis.
  options:
    a:
      en: |
        Bayesian sampling supports only `choice`, `uniform` and `quniform`, so `loguniform` is still invalid.
      fr: |
        L'échantillonnage bayésien ne prend en charge que `choice`, `uniform` et `quniform` : `loguniform` reste invalide.
    c:
      en: |
        The trial limit doesn't change which distributions grid sampling accepts.
      fr: |
        La limite d'essais ne change pas les distributions qu'accepte l'échantillonnage par grille.
    d:
      en: |
        This adds a second continuous parameter, which grid sampling rejects as well; learning_rate is still loguniform.
      fr: |
        Cela ajoute un deuxième paramètre continu, que l'échantillonnage par grille rejette aussi ; learning_rate reste loguniform.
references:
  - title: Hyperparameter tuning a model (v2)
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-tune-hyperparameters
