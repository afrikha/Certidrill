id: ai300-2b-frs-batch-input
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace that contains a registered model named **fraud-model**. Version 3 was trained on features from a managed feature store, and its artifact contains `feature_retrieval_spec.yaml`.

    You are building a batch inference pipeline whose first step is the built-in feature retrieval component. You have already set the observation data and the timestamp column. The features retrieved must always match the model being scored, and you must not maintain a separate copy of the specification.

    What should you configure on the component?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning qui contient un modèle inscrit nommé **fraud-model**. La version 3 a été entraînée sur des caractéristiques d'un magasin de caractéristiques managé, et son artefact contient `feature_retrieval_spec.yaml`.

    Vous créez un pipeline d'inférence par lots dont la première étape est le composant intégré de récupération de caractéristiques. Vous avez déjà défini les données d'observation et la colonne d'horodatage. Les caractéristiques récupérées doivent toujours correspondre au modèle évalué, et vous ne devez pas gérer de copie distincte de la spécification.

    Que devez-vous configurer sur le composant ?
body:
  options:
    - { id: a, text: { en: "Set the `observation_data_format` input to `delta`.", fr: "Définir l'entrée `observation_data_format` sur `delta`." } }
    - { id: b, text: { en: "Set the `timestamp_column` input to the name of the column that holds the model version.", fr: "Définir l'entrée `timestamp_column` sur le nom de la colonne qui contient la version du modèle." } }
    - { id: c, text: { en: "Set the `input_model` input to `azureml:fraud-model:3`.", fr: "Définir l'entrée `input_model` sur `azureml:fraud-model:3`." } }
    - { id: d, text: { en: "Set the `feature_retrieval_spec` input to a datastore folder that contains a copy of the specification.", fr: "Définir l'entrée `feature_retrieval_spec` sur un dossier de magasin de données qui contient une copie de la spécification." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The feature retrieval component accepts either `input_model` or `feature_retrieval_spec`. When you pass the registered model, the component reads `feature_retrieval_spec.yaml` from the model artifact folder, so the features always match that model version. Batch inference pipelines typically use this option as their first step.
    fr: |
      Le composant de récupération de caractéristiques accepte soit `input_model`, soit `feature_retrieval_spec`. Quand vous transmettez le modèle inscrit, le composant lit `feature_retrieval_spec.yaml` dans le dossier de l'artefact du modèle : les caractéristiques correspondent donc toujours à cette version du modèle. Les pipelines d'inférence par lots utilisent généralement cette option comme première étape.
  options:
    d: { en: "This works technically, but it relies on a separate copy of the specification that can drift from the model, which the requirements exclude.", fr: "Cela fonctionne techniquement, mais repose sur une copie distincte de la spécification susceptible de diverger du modèle, ce que les exigences excluent." }
    a: { en: "The format of the observation data doesn't tell the component which features to retrieve.", fr: "Le format des données d'observation n'indique pas au composant quelles caractéristiques récupérer." }
    b: { en: "The timestamp column is the event time used by the point-in-time join, not a model version.", fr: "La colonne d'horodatage contient l'heure des événements utilisée par la jointure à un instant donné, pas une version de modèle." }
references:
  - title: Feature retrieval specification and usage in training and inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/feature-retrieval-concepts
