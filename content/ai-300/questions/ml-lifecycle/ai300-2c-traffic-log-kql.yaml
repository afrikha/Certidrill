id: ai300-2c-traffic-log-kql
objective: "2.4.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank sends the logs of a managed online endpoint named **ep-credit** to a Log Analytics workspace.

    You need a query that returns, for the last 24 hours, the number of requests and the average end-to-end duration for each deployment and each response code returned to the clients.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank envoie les journaux d'un point de terminaison en ligne managé nommé **ep-credit** vers un espace de travail Log Analytics.

    Vous avez besoin d'une requête qui renvoie, pour les dernières 24 heures, le nombre de requêtes et la durée moyenne de bout en bout pour chaque déploiement et chaque code de réponse renvoyé aux clients.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[t]]
    | where TimeGenerated > ago(24h)
    | where EndpointName == "ep-credit"
    | summarize Requests = count(), AvgMs = avg([[d]]) by [[g]], [[c]]
  slots:
    - id: t
      options:
        - { id: traffic, text: AmlOnlineEndpointTrafficLog }
        - { id: console, text: AmlOnlineEndpointConsoleLog }
        - { id: event, text: AmlOnlineEndpointEventLog }
    - id: d
      options:
        - { id: total, text: TotalDurationMs }
        - { id: throttle, text: RequestThrottlingDelayMs }
        - { id: size, text: ResponsePayloadSize }
    - id: g
      options:
        - { id: dep, text: DeploymentName }
        - { id: inst, text: InstanceId }
        - { id: ws, text: AzureMLWorkspaceName }
    - id: c
      options:
        - { id: resp, text: ResponseCode }
        - { id: model, text: ModelStatusCode }
        - { id: reqid, text: XRequestId }
answer:
  values: { t: traffic, d: total, g: dep, c: resp }
explanation:
  correct:
    en: |
      AmlOnlineEndpointTrafficLog holds one record per request. `TotalDurationMs` is the end-to-end duration, `DeploymentName` identifies the deployment that served the request, and `ResponseCode` is the final code returned to the client, whereas `ModelStatusCode` is the code returned by the model container.
    fr: |
      AmlOnlineEndpointTrafficLog contient un enregistrement par requête. `TotalDurationMs` est la durée de bout en bout, `DeploymentName` identifie le déploiement qui a servi la requête, et `ResponseCode` est le code final renvoyé au client, alors que `ModelStatusCode` est le code renvoyé par le conteneur du modèle.
  options:
    console: { en: "The console log holds the container's standard output, with no response codes or durations.", fr: "Le journal de console contient la sortie standard du conteneur, sans codes de réponse ni durées." }
    throttle: { en: "RequestThrottlingDelayMs is only the delay added by network throttling.", fr: "RequestThrottlingDelayMs n'est que le délai ajouté par la limitation réseau." }
    inst: { en: "InstanceId identifies a node, not the deployment that served the request.", fr: "InstanceId identifie un nœud, pas le déploiement qui a servi la requête." }
    model: { en: "ModelStatusCode is the code returned by the model, which can differ from the code returned to the client.", fr: "ModelStatusCode est le code renvoyé par le modèle, qui peut différer du code renvoyé au client." }
references:
  - title: Monitor online endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-online-endpoints
