id: ai300-2b-rai-scorecard
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace. A credit scoring model is registered in MLflow format with the `sklearn` flavor, and you are building a Responsible AI dashboard for it before it is approved.

    The bank's responsible AI standard requires the transparency principle to be addressed: loan officers and applicants must get human-understandable descriptions of the model's predictions.

    Which two dashboard components should you include? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning. Un modèle de notation de crédit est inscrit au format MLflow avec la saveur `sklearn`, et vous créez un tableau de bord Responsible AI pour ce modèle avant son approbation.

    La norme d'IA responsable de la banque exige que le principe de transparence soit traité : les chargés de prêts et les demandeurs doivent obtenir des descriptions compréhensibles des prédictions du modèle.

    Quels sont les deux composants du tableau de bord que vous devez inclure ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Error analysis", fr: "Analyse des erreurs (Error analysis)" } }
    - { id: b, text: { en: "Model interpretability", fr: "Interprétabilité du modèle (Model interpretability)" } }
    - { id: c, text: { en: "Causal analysis", fr: "Analyse causale (Causal analysis)" } }
    - { id: d, text: { en: "Counterfactual what-if", fr: "Simulation contrefactuelle (Counterfactual what-if)" } }
    - { id: e, text: { en: "Data analysis", fr: "Analyse des données (Data analysis)" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      In Azure Machine Learning, the model interpretability and counterfactual what-if components of the Responsible AI dashboard support transparency: they generate human-understandable descriptions of model predictions. Interpretability shows which features drive predictions, globally and for one data point, and counterfactual what-if shows the minimal changes that would alter a prediction.
    fr: |
      Dans Azure Machine Learning, les composants d'interprétabilité du modèle et de simulation contrefactuelle du tableau de bord Responsible AI soutiennent la transparence : ils génèrent des descriptions compréhensibles des prédictions du modèle. L'interprétabilité montre quelles caractéristiques déterminent les prédictions, globalement et pour un point de données, et la simulation contrefactuelle montre les modifications minimales qui changeraient une prédiction.
  options:
    a: { en: "Error analysis supports reliability and safety: it finds the cohorts with an error rate higher than the overall benchmark, not why a prediction was made.", fr: "L'analyse des erreurs soutient la fiabilité et la sécurité : elle trouve les cohortes dont le taux d'erreur dépasse la référence globale, pas la raison d'une prédiction." }
    c: { en: "Causal analysis estimates the effect of a treatment on a real-world outcome from historical data; it doesn't describe the model's predictions.", fr: "L'analyse causale estime l'effet d'un traitement sur un résultat réel à partir de données historiques ; elle ne décrit pas les prédictions du modèle." }
    e: { en: "Data analysis explores how the dataset is distributed, for example overrepresentation and underrepresentation; it doesn't explain predictions.", fr: "L'analyse des données explore la distribution du jeu de données, par exemple la surreprésentation et la sous-représentation ; elle n'explique pas les prédictions." }
references:
  - title: What is Responsible AI - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai
  - title: Assess AI systems by using the Responsible AI dashboard
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai-dashboard
