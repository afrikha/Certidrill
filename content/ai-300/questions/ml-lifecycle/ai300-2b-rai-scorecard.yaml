id: ai300-2b-rai-scorecard
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace. A credit scoring model has a Responsible AI dashboard. The compliance team doesn't use Azure Machine Learning studio and asks for an offline report before it approves the model.

    You generate a Responsible AI scorecard for the dashboard and download the PDF.

    Which two types of information can the scorecard contain?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning. Un modèle de notation de crédit possède un tableau de bord Responsible AI. L'équipe de conformité n'utilise pas Azure Machine Learning studio et demande un rapport hors connexion avant d'approuver le modèle.

    Vous générez une scorecard Responsible AI pour le tableau de bord et téléchargez le PDF.

    Quels sont les deux types d'informations que la scorecard peut contenir ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The top-performing and worst-performing data cohorts", fr: "Les cohortes de données les plus performantes et les moins performantes" } }
    - { id: b, text: { en: "How well the model meets fairness targets for the sensitive groups that you selected", fr: "La mesure dans laquelle le modèle atteint les objectifs d'équité pour les groupes sensibles que vous avez sélectionnés" } }
    - { id: c, text: { en: "The request latency and throughput of the model's online endpoint", fr: "La latence des requêtes et le débit du point de terminaison en ligne du modèle" } }
    - { id: d, text: { en: "The role assignments of the users who can access the model", fr: "Les attributions de rôles des utilisateurs qui peuvent accéder au modèle" } }
    - { id: e, text: { en: "The source code of the training script and its Git commit", fr: "Le code source du script d'entraînement et son commit Git" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      The scorecard is a PDF generated from the dashboard insights for technical and non-technical stakeholders. It can include a model summary with target values, data analysis, model performance, top- and worst-performing cohorts, the most important factors, fairness insights for the chosen sensitive groups, and causal insights.
    fr: |
      La scorecard est un PDF généré à partir des analyses du tableau de bord pour des parties prenantes techniques et non techniques. Elle peut inclure un résumé du modèle avec des valeurs cibles, l'analyse des données, les performances du modèle, les cohortes les plus et les moins performantes, les facteurs les plus importants, les analyses d'équité pour les groupes sensibles choisis et les analyses causales.
  options:
    c: { en: "Endpoint latency and throughput come from monitoring the deployment, not from the Responsible AI insights.", fr: "La latence et le débit du point de terminaison proviennent de la supervision du déploiement, pas des analyses Responsible AI." }
    e: { en: "The scorecard summarizes data and model health; it doesn't embed source code.", fr: "La scorecard résume l'état des données et du modèle ; elle n'intègre pas de code source." }
    d: { en: "Access control isn't part of the scorecard content.", fr: "Le contrôle d'accès ne fait pas partie du contenu de la scorecard." }
references:
  - title: Use Responsible AI scorecard (preview) in Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-responsible-ai-scorecard
