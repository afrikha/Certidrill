id: ai300-2c-monitoring-source-match
objective: "2.4.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has a managed online endpoint with model monitoring and a diagnostic setting that sends all endpoint logs to Log Analytics. Ground truth data is registered every week.

    Which source should you use to answer each question? To answer, drag the appropriate sources to the correct questions. Each source may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un point de terminaison en ligne managé avec une surveillance de modèle et un paramètre de diagnostic qui envoie tous les journaux du point de terminaison vers Log Analytics. Des données de vérité terrain sont inscrites chaque semaine.

    Quelle source devez-vous utiliser pour répondre à chaque question ? Pour répondre, faites glisser les sources appropriées vers les questions correspondantes. Chaque source peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: traffic, text: AmlOnlineEndpointTrafficLog }
    - { id: console, text: AmlOnlineEndpointConsoleLog }
    - { id: event, text: AmlOnlineEndpointEventLog }
    - { id: perf, text: { en: "Model performance signal", fr: "Signal de performances du modèle" } }
    - { id: cpu, text: { en: "CPU utilization metric of the deployment", fr: "Métrique d'utilisation du processeur du déploiement" } }
  targets:
    - id: t1
      text: { en: "Why did the containers of the deployment restart during the night?", fr: "Pourquoi les conteneurs du déploiement ont-ils redémarré pendant la nuit ?" }
    - id: t2
      text: { en: "Which stack trace did score.py print when it raised an exception?", fr: "Quelle trace de pile score.py a-t-il affichée lorsqu'il a levé une exception ?" }
    - id: t3
      text: { en: "Did the precision of the model drop compared with the actual outcomes?", fr: "La précision du modèle a-t-elle baissé par rapport aux résultats réels ?" }
    - id: t4
      text: { en: "Is the instance type of the deployment too small for the current load?", fr: "Le type d'instance du déploiement est-il trop petit pour la charge actuelle ?" }
answer:
  mapping: { t1: event, t2: console, t3: perf, t4: cpu }
explanation:
  correct:
    en: |
      The event log records container lifecycle events such as `LivenessProbeFailed`, `BackOff` and `Killing`, which explain restarts. The console log contains the container's standard output, including what score.py prints. Only the model performance signal compares predictions with ground truth. Deployment metrics such as CPU utilization show whether the instances are saturated.
    fr: |
      Le journal des événements enregistre les événements du cycle de vie du conteneur, comme `LivenessProbeFailed`, `BackOff` et `Killing`, qui expliquent les redémarrages. Le journal de console contient la sortie standard du conteneur, y compris ce qu'affiche score.py. Seul le signal de performances du modèle compare les prédictions à la vérité terrain. Les métriques du déploiement, comme l'utilisation du processeur, indiquent si les instances sont saturées.
  options:
    traffic: { en: "The traffic log describes each request (codes, durations), not container restarts or script output.", fr: "Le journal de trafic décrit chaque requête (codes, durées), pas les redémarrages de conteneur ni la sortie du script." }
references:
  - title: Monitor online endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-online-endpoints
  - title: Model monitoring in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-model-monitoring
