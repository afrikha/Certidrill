id: ai300-2a-mlflow-default-experiment
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-northwind**. A data scientist runs a notebook named `explore-churn.ipynb` on a compute instance named **ci-dana**. The notebook calls `mlflow.start_run()` and `mlflow.log_metric()`, but it never calls `mlflow.set_experiment()`.

    In which experiment are the runs recorded?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-northwind**. Une data scientist exécute un notebook nommé `explore-churn.ipynb` sur une instance de calcul nommée **ci-dana**. Le notebook appelle `mlflow.start_run()` et `mlflow.log_metric()`, mais n'appelle jamais `mlflow.set_experiment()`.

    Dans quelle expérience les exécutions sont-elles enregistrées ?
body:
  options:
    - { id: a, text: { en: "An experiment named explore-churn", fr: "Une expérience nommée explore-churn" } }
    - { id: b, text: { en: "An experiment named ci-dana", fr: "Une expérience nommée ci-dana" } }
    - { id: c, text: { en: "An experiment named after the current working directory", fr: "Une expérience nommée d'après le répertoire de travail actuel" } }
    - { id: d, text: { en: "An experiment named Default", fr: "Une expérience nommée Default" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      MLflow runs go to the active experiment. When no experiment is set, they go to an experiment named `Default`, which is created automatically. Call `mlflow.set_experiment()` to group the runs under a meaningful name.
    fr: |
      Les exécutions MLflow vont dans l'expérience active. Quand aucune expérience n'est définie, elles vont dans une expérience nommée `Default`, créée automatiquement. Appelez `mlflow.set_experiment()` pour regrouper les exécutions sous un nom parlant.
  options:
    a:
      en: |
        MLflow doesn't name the experiment after the notebook file.
      fr: |
        MLflow ne nomme pas l'expérience d'après le fichier du notebook.
    b:
      en: |
        The compute instance name isn't used as an experiment name.
      fr: |
        Le nom de l'instance de calcul n'est pas utilisé comme nom d'expérience.
    c:
      en: |
        The working directory name is the default `experiment_name` of a job submitted from a YAML file, not of MLflow runs started in a notebook.
      fr: |
        Le nom du répertoire de travail est la valeur par défaut d'`experiment_name` pour un travail soumis à partir d'un fichier YAML, pas pour des exécutions MLflow démarrées dans un notebook.
references:
  - title: Configure MLflow for Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-mlflow-configure-tracking
