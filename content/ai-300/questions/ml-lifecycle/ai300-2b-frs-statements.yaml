id: ai300-2b-frs-statements
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning project workspace. Your models use features from two managed feature stores named **fs-sales** and **fs-risk**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail de projet Azure Machine Learning. Vos modèles utilisent des caractéristiques de deux magasins de caractéristiques managés nommés **fs-sales** et **fs-risk**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A single feature retrieval specification can list features from both fs-sales and fs-risk.
        fr: Une seule spécification de récupération de caractéristiques peut lister des caractéristiques de fs-sales et de fs-risk.
    - id: s2
      text:
        en: You must create a feature retrieval specification before you can call `get_offline_features()` to generate training data.
        fr: Vous devez créer une spécification de récupération de caractéristiques avant de pouvoir appeler `get_offline_features()` pour générer des données d'entraînement.
    - id: s3
      text:
        en: In an online deployment, the `init()` function of the scoring script loads the feature retrieval specification from the model folder before it looks up online features.
        fr: Dans un déploiement en ligne, la fonction `init()` du script de scoring charge la spécification de récupération de caractéristiques depuis le dossier du modèle avant de rechercher les caractéristiques en ligne.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A specification can contain features from several feature sets and several feature stores. With `get_offline_features()`, the specification is optional because you can pass the feature list directly. For online inference, `init()` resolves the specification packaged in the model folder and then initializes the online lookup.
    fr: |
      Une spécification peut contenir des caractéristiques issues de plusieurs ensembles de caractéristiques et de plusieurs magasins. Avec `get_offline_features()`, la spécification est facultative, car vous pouvez transmettre directement la liste des caractéristiques. Pour l'inférence en ligne, `init()` résout la spécification empaquetée dans le dossier du modèle, puis initialise la recherche en ligne.
references:
  - title: Feature retrieval specification and usage in training and inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/feature-retrieval-concepts
