id: ai300-2a-dist-no-launcher
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    On a workstation, your team starts a PyTorch training script with `python -m torch.distributed.launch --nproc_per_node 4 train.py`. You are moving the training to a command job in Azure Machine Learning on two nodes that have four GPUs each.

    You need to configure the job so that exactly one process runs per GPU.

    What should you do?
  fr: |
    Sur une station de travail, votre équipe lance un script d'entraînement PyTorch avec `python -m torch.distributed.launch --nproc_per_node 4 train.py`. Vous déplacez l'entraînement vers un travail de commande dans Azure Machine Learning sur deux nœuds de quatre GPU chacun.

    Vous devez configurer le travail pour qu'exactement un processus s'exécute par GPU.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep the launcher command, and set the distribution type to pytorch with `process_count_per_instance: 4`.", fr: "Conserver la commande du lanceur, et définir le type de distribution pytorch avec `process_count_per_instance: 4`." } }
    - { id: b, text: { en: "Set the command to `python train.py`, and set the distribution type to pytorch with `process_count_per_instance: 4`.", fr: "Définir la commande sur `python train.py`, et définir le type de distribution pytorch avec `process_count_per_instance: 4`." } }
    - { id: c, text: { en: "Set the command to `python train.py`, and set the distribution type to tensorflow with `worker_count: 8`.", fr: "Définir la commande sur `python train.py`, et définir le type de distribution tensorflow avec `worker_count: 8`." } }
    - { id: d, text: { en: "Set the command to `python train.py`, remove the distribution section, and add `WORLD_SIZE: 8` to `environment_variables`.", fr: "Définir la commande sur `python train.py`, supprimer la section distribution et ajouter `WORLD_SIZE: 8` à `environment_variables`." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With the pytorch distribution, Azure Machine Learning launches `process_count_per_instance` processes on each node and sets MASTER_ADDR, MASTER_PORT, WORLD_SIZE, NODE_RANK, RANK and LOCAL_RANK, so you don't need a launcher utility such as `torch.distributed.launch`. The command simply runs the script.
    fr: |
      Avec la distribution pytorch, Azure Machine Learning lance `process_count_per_instance` processus sur chaque nœud et définit MASTER_ADDR, MASTER_PORT, WORLD_SIZE, NODE_RANK, RANK et LOCAL_RANK : vous n'avez pas besoin d'un utilitaire de lancement comme `torch.distributed.launch`. La commande exécute simplement le script.
  options:
    a:
      en: |
        Azure Machine Learning already starts four processes per node; each would run the launcher, which starts four more, so the processes no longer match the GPUs.
      fr: |
        Azure Machine Learning démarre déjà quatre processus par nœud ; chacun exécuterait le lanceur, qui en démarre quatre autres : les processus ne correspondent plus aux GPU.
    c:
      en: |
        The tensorflow distribution sets TF_CONFIG for TensorFlow workers; it doesn't set up torch.distributed for a PyTorch script.
      fr: |
        La distribution tensorflow définit TF_CONFIG pour des workers TensorFlow ; elle ne configure pas torch.distributed pour un script PyTorch.
    d:
      en: |
        Without a distribution section, one process runs per node and no master address or ranks are set.
      fr: |
        Sans section distribution, un seul processus s'exécute par nœud, et aucune adresse maître ni aucun rang ne sont définis.
references:
  - title: Distributed GPU training guide (SDK v2)
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-train-distributed-gpu
