id: ai300-2a-sweep-statements
objective: "2.1.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You have the following extract of a sweep job YAML file in Azure Machine Learning:

    ```yaml
    sampling_algorithm: random
    search_space:
      learning_rate:
        type: loguniform
        min_value: -6
        max_value: -1
    limits:
      max_total_trials: 24
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de l'extrait suivant d'un fichier YAML de travail de balayage dans Azure Machine Learning :

    ```yaml
    sampling_algorithm: random
    search_space:
      learning_rate:
        type: loguniform
        min_value: -6
        max_value: -1
    limits:
      max_total_trials: 24
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Up to 24 trials can run at the same time if the compute target has the capacity.
        fr: |
          Jusqu'à 24 essais peuvent s'exécuter en même temps si la cible de calcul en a la capacité.
    - id: s2
      text:
        en: |
          The sampled learning rates are between -6 and -1.
        fr: |
          Les taux d'apprentissage échantillonnés sont compris entre -6 et -1.
    - id: s3
      text:
        en: |
          Each trial starts from the model weights produced by the previous trial.
        fr: |
          Chaque essai part des poids du modèle produits par l'essai précédent.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      When `max_concurrent_trials` is omitted, it defaults to `max_total_trials`, so all 24 trials can launch in parallel. A `loguniform` parameter returns `exp(uniform(min_value, max_value))`, here between about 0.0025 and 0.37. Each trial restarts training from scratch, including the model and the data loaders.
    fr: |
      Quand `max_concurrent_trials` est omis, il prend la valeur de `max_total_trials` : les 24 essais peuvent démarrer en parallèle. Un paramètre `loguniform` renvoie `exp(uniform(min_value, max_value))`, ici entre environ 0,0025 et 0,37. Chaque essai redémarre l'entraînement de zéro, modèle et chargeurs de données compris.
references:
  - title: CLI (v2) sweep job YAML schema
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-job-sweep
  - title: Hyperparameter tuning a model (v2)
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-tune-hyperparameters
