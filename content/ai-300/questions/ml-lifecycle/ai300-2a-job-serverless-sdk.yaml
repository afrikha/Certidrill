id: ai300-2a-job-serverless-sdk
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You use the Python SDK v2 to submit a training script named `train.py` as a command job in an Azure Machine Learning workspace.

    You need to run the job without creating or managing any compute target, and choose the VM size for each job.

    What should you do?
  fr: |
    Vous utilisez le SDK Python v2 pour soumettre un script d'entraînement nommé `train.py` dans un travail de commande dans un espace de travail Azure Machine Learning.

    Vous devez exécuter le travail sans créer ni gérer de cible de calcul, et choisir la taille de machine virtuelle de chaque travail.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set `compute=\"local\"` and pass the VM size in `environment_variables`.", fr: "Définir `compute=\"local\"` et passer la taille de machine virtuelle dans `environment_variables`." } }
    - { id: b, text: { en: "Create a compute cluster with `min_instances=0` and set `compute` to its name.", fr: "Créer un cluster de calcul avec `min_instances=0` et définir `compute` sur son nom." } }
    - { id: c, text: { en: "Omit the `compute` argument and set `instance_type` in the job resources.", fr: "Omettre l'argument `compute` et définir `instance_type` dans les ressources du travail." } }
    - { id: d, text: { en: "Set `compute` to the name of your compute instance and enable idle shutdown.", fr: "Définir `compute` sur le nom de votre instance de calcul et activer l'arrêt en cas d'inactivité." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When `compute` isn't specified, a command job runs on serverless compute, so there's no cluster to create, scale or patch. You choose the VM size per job with `resources` (`instance_type` and `instance_count`).
    fr: |
      Quand `compute` n'est pas spécifié, un travail de commande s'exécute sur un calcul serverless : il n'y a aucun cluster à créer, mettre à l'échelle ou corriger. Vous choisissez la taille de machine virtuelle de chaque travail dans `resources` (`instance_type` et `instance_count`).
  options:
    a:
      en: "`local` runs the job on the machine that submits it, and environment variables don't select a VM size."
      fr: "`local` exécute le travail sur la machine qui le soumet, et des variables d'environnement ne sélectionnent pas de taille de machine virtuelle."
    b:
      en: |
        A compute cluster is a compute target that you create and manage, and its VM size is fixed for the cluster.
      fr: |
        Un cluster de calcul est une cible de calcul que vous créez et gérez, et sa taille de machine virtuelle est fixée pour le cluster.
    d:
      en: |
        A compute instance is also a compute target to create and manage, with a single fixed size.
      fr: |
        Une instance de calcul est aussi une cible de calcul à créer et à gérer, avec une seule taille fixe.
references:
  - title: Model training on serverless compute
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-serverless-compute
