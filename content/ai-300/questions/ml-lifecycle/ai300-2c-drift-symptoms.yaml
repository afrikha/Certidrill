id: ai300-2c-drift-symptoms
objective: "2.4.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin monitors a flight delay model deployed to a managed online endpoint. Production inputs and outputs are collected, and the training data is registered as a data asset. No ground truth data is available yet.

    The data science team describes four issues that it wants to detect. Which monitoring signal should detect each issue? To answer, drag the appropriate signals to the correct issues. Each signal may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin surveille un modèle de prévision des retards de vol déployé sur un point de terminaison en ligne managé. Les entrées et les sorties de production sont collectées, et les données d'entraînement sont inscrites en tant que ressource de données. Aucune donnée de vérité terrain n'est encore disponible.

    L'équipe de science des données décrit quatre problèmes qu'elle veut détecter. Quel signal de surveillance doit détecter chaque problème ? Pour répondre, faites glisser les signaux appropriés vers les problèmes correspondants. Chaque signal peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dd, text: { en: "Data drift", fr: "Dérive des données (data drift)" } }
    - { id: pd, text: { en: "Prediction drift", fr: "Dérive des prédictions (prediction drift)" } }
    - { id: dq, text: { en: "Data quality", fr: "Qualité des données (data quality)" } }
    - { id: fa, text: { en: "Feature attribution drift", fr: "Dérive de l'attribution des caractéristiques (feature attribution drift)" } }
    - { id: mp, text: { en: "Model performance", fr: "Performances du modèle (model performance)" } }
  targets:
    - id: t1
      text: { en: "The departure airports sent to the model now include codes that never appeared in the training data.", fr: "Les aéroports de départ envoyés au modèle incluent désormais des codes qui n'apparaissaient jamais dans les données d'entraînement." }
    - id: t2
      text: { en: "The model now predicts a delay for 40 percent of flights, compared with 15 percent in recent weeks.", fr: "Le modèle prévoit désormais un retard pour 40 % des vols, contre 15 % les semaines précédentes." }
    - id: t3
      text: { en: "The distribution of the scheduled departure hours in production no longer matches the training data.", fr: "La distribution des heures de départ prévues en production ne correspond plus aux données d'entraînement." }
    - id: t4
      text: { en: "The features that contribute most to the predictions in production differ from those that mattered most in training.", fr: "Les caractéristiques qui contribuent le plus aux prédictions en production diffèrent de celles qui comptaient le plus à l'entraînement." }
answer:
  mapping: { t1: dq, t2: pd, t3: dd, t4: fa }
explanation:
  correct:
    en: |
      Values outside the set seen in the reference data raise the out-of-bounds rate of the data quality signal. A change in the distribution of the outputs is prediction drift, and a change in the distribution of an input feature is data drift. A change in feature importance compared with training is feature attribution drift (preview), measured with NDCG.
    fr: |
      Des valeurs absentes de l'ensemble observé dans les données de référence augmentent le taux de valeurs hors limites du signal de qualité des données. Un changement de distribution des sorties est une dérive des prédictions, et un changement de distribution d'une caractéristique d'entrée une dérive des données. Un changement de l'importance des caractéristiques par rapport à l'entraînement est une dérive de l'attribution des caractéristiques (préversion), mesurée avec le NDCG.
  options:
    mp: { en: "Model performance requires ground truth data, which isn't available.", fr: "Les performances du modèle nécessitent des données de vérité terrain, qui ne sont pas disponibles." }
references:
  - title: Model monitoring in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-model-monitoring
