id: ai300-2b-frs-generate
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are experimenting in a notebook in an Azure Machine Learning project workspace. You connected to a managed feature store with a `FeatureStoreClient` object named `featurestore` and selected a list of features named `features`.

    You need to create a portable definition of this feature list that the training pipeline can take as an input and that can later be packaged with the model.

    Which method should you call?
  fr: |
    Vous expérimentez dans un notebook d'un espace de travail de projet Azure Machine Learning. Vous êtes connecté à un magasin de caractéristiques managé avec un objet `FeatureStoreClient` nommé `featurestore` et avez sélectionné une liste de caractéristiques nommée `features`.

    Vous devez créer une définition portable de cette liste de caractéristiques que le pipeline d'entraînement peut prendre en entrée et qui pourra ensuite être empaquetée avec le modèle.

    Quelle méthode devez-vous appeler ?
body:
  options:
    - { id: a, text: "featurestore.generate_feature_retrieval_spec(spec_folder, features)" }
    - { id: b, text: "init_online_lookup(features, credential)" }
    - { id: c, text: "get_offline_features(features=features, observation_data=obs_df, timestamp_column=\"ts\")" }
    - { id: d, text: "featurestore.resolve_feature_retrieval_spec(spec_folder)" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `generate_feature_retrieval_spec()` writes a feature retrieval specification, a YAML file that lists the selected features and their feature sets and feature stores, to the given folder. The training pipeline takes this folder as an input, and the training job packages the file with the model.
    fr: |
      `generate_feature_retrieval_spec()` écrit dans le dossier indiqué une spécification de récupération de caractéristiques, un fichier YAML qui liste les caractéristiques sélectionnées ainsi que leurs ensembles de caractéristiques et magasins. Le pipeline d'entraînement prend ce dossier en entrée, et le travail d'entraînement empaquette le fichier avec le modèle.
  options:
    d: { en: "This method loads the feature list from an existing specification; it doesn't create one.", fr: "Cette méthode charge la liste des caractéristiques à partir d'une spécification existante ; elle n'en crée pas." }
    c: { en: "This function builds a training DataFrame with a point-in-time join; it doesn't write a portable definition.", fr: "Cette fonction crée un DataFrame d'entraînement par jointure à un instant donné ; elle n'écrit pas de définition portable." }
    b: { en: "This function prepares online feature lookup in a scoring script.", fr: "Cette fonction prépare la recherche de caractéristiques en ligne dans un script de scoring." }
references:
  - title: "Tutorial 2: Experiment and train models by using features"
    url: https://learn.microsoft.com/en-us/azure/machine-learning/tutorial-experiment-train-models-using-features
