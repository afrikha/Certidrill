id: ai300-cs1c-best-runs
objective: "2.1.8"
type: single
caseStudy: ai300-cs1c-trey-research
difficulty: 2
status: draft
stem:
  en: |
    The notebook is connected to the MLflow tracking server of mlw-trey-imaging. You need to meet the comparison requirement.

    Which code should you run?
  fr: |
    Le notebook est connecté au serveur de suivi MLflow de mlw-trey-imaging. Vous devez respecter l'exigence de comparaison.

    Quel code devez-vous exécuter ?
body:
  options:
    - id: a
      text: "mlflow.search_runs(experiment_names=[\"lesion-seg\"], filter_string=\"params.architecture = 'unet'\", order_by=[\"metrics.val_dice DESC\"], max_results=5)"
    - id: b
      text: "mlflow.search_runs(filter_string=\"params.architecture = 'unet'\").sort_values(\"metrics.val_dice\", ascending=False).head(5)"
    - id: c
      text: "mlflow.search_runs(experiment_names=[\"lesion-seg\"], filter_string=\"params.architecture = 'unet'\").sort_values(\"metrics.val_dice\", ascending=False).head(5)"
    - id: d
      text: "mlflow.search_runs(experiment_names=[\"lesion-seg\"], filter_string=\"params.architecture = 'unet' AND metrics.val_dice > 0\").head(5)"
answer: { optionId: c }
explanation:
  correct:
    en: In Azure Machine Learning, the order_by parameter of search_runs doesn't support expressions on metrics, parameters or tags, so the returned pandas DataFrame is sorted with sort_values and the first five rows are kept. Parameters are filtered as strings with =, and experiment_names is required because, without it, MLflow searches only the active experiment.
    fr: Dans Azure Machine Learning, le paramètre order_by de search_runs ne prend pas en charge les expressions sur les métriques, les paramètres ou les étiquettes ; le DataFrame pandas renvoyé est donc trié avec sort_values et les cinq premières lignes sont conservées. Les paramètres se filtrent comme des chaînes avec =, et experiment_names est nécessaire car, sans lui, MLflow ne recherche que dans l'expérience active.
  options:
    a: { en: "order_by doesn't accept metrics.* expressions in Azure Machine Learning; sort the DataFrame with pandas instead.", fr: "order_by n'accepte pas les expressions metrics.* dans Azure Machine Learning ; triez plutôt le DataFrame avec pandas." }
    b: { en: "Without experiment_names, experiment_ids or search_all_experiments, MLflow searches only the active experiment, which the notebook doesn't set to lesion-seg.", fr: "Sans experiment_names, experiment_ids ni search_all_experiments, MLflow ne recherche que dans l'expérience active, que le notebook ne définit pas sur lesion-seg." }
    d: { en: "The filter is valid, but without sorting on val_dice the first five rows aren't the five runs with the highest val_dice.", fr: "Le filtre est valide, mais sans tri sur val_dice, les cinq premières lignes ne sont pas les cinq exécutions qui ont la val_dice la plus élevée." }
references:
  - title: Query & compare experiments and runs with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-track-experiments-mlflow
