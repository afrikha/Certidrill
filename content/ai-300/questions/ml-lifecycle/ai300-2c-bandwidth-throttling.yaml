id: ai300-2c-bandwidth-throttling
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has a managed online endpoint named **ep-docs** that scores scanned documents sent as large request payloads. Clients report that responses became slow after the request volume doubled. The CPU and memory utilization of the deployment stay below 40 percent, and no request returns an error.

    You suspect that the endpoint's bandwidth limit is delaying the requests.

    What should you check to confirm it?
  fr: |
    Litware dispose d'un point de terminaison en ligne managé nommé **ep-docs** qui note des documents numérisés envoyés sous forme de charges utiles de requête volumineuses. Les clients signalent que les réponses sont devenues lentes depuis que le volume de requêtes a doublé. L'utilisation du processeur et de la mémoire du déploiement reste inférieure à 40 %, et aucune requête ne renvoie d'erreur.

    Vous soupçonnez que la limite de bande passante du point de terminaison retarde les requêtes.

    Que devez-vous vérifier pour le confirmer ?
body:
  options:
    - { id: a, text: { en: "The `LivenessProbeFailed` and `BackOff` events in AmlOnlineEndpointEventLog", fr: "Les événements `LivenessProbeFailed` et `BackOff` dans AmlOnlineEndpointEventLog" } }
    - { id: b, text: { en: "The `ms-azureml-model-error-statuscode` and `ms-azureml-model-error-reason` response headers", fr: "Les en-têtes de réponse `ms-azureml-model-error-statuscode` et `ms-azureml-model-error-reason`" } }
    - { id: c, text: { en: "The network bytes metric and the `ms-azureml-bandwidth-request-delay-ms` response trailer", fr: "La métrique d'octets réseau et la fin de réponse (trailer) `ms-azureml-bandwidth-request-delay-ms`" } }
    - { id: d, text: { en: "The output of `az ml online-deployment get-logs` with `--container storage-initializer`", fr: "La sortie de `az ml online-deployment get-logs` avec `--container storage-initializer`" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When the bandwidth limit is enforced, requests are throttled rather than rejected. You detect it with the network bytes metric of the endpoint and with the response trailers `ms-azureml-bandwidth-request-delay-ms` and `ms-azureml-bandwidth-response-delay-ms`, which give the delay added to the request and the response.
    fr: |
      Quand la limite de bande passante s'applique, les requêtes sont limitées plutôt que rejetées. Vous le détectez avec la métrique d'octets réseau du point de terminaison et avec les fins de réponse `ms-azureml-bandwidth-request-delay-ms` et `ms-azureml-bandwidth-response-delay-ms`, qui indiquent le délai ajouté à la requête et à la réponse.
  options:
    a: { en: "Probe failures and back-off events explain container restarts, not bandwidth throttling of healthy containers.", fr: "Les échecs de sonde et les événements de back-off expliquent des redémarrages de conteneur, pas la limitation de bande passante de conteneurs sains." }
    b: { en: "These headers come with 424 responses, when the model container returns an error; no request fails here.", fr: "Ces en-têtes accompagnent les réponses 424, quand le conteneur du modèle renvoie une erreur ; aucune requête n'échoue ici." }
    d: { en: "The storage initializer logs show whether the model and code were downloaded at startup, not runtime throttling.", fr: "Les journaux de l'initialisation du stockage indiquent si le modèle et le code ont été téléchargés au démarrage, pas une limitation pendant l'exécution." }
references:
  - title: Monitor online endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-online-endpoints
  - title: Troubleshoot online endpoint deployment and scoring
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-troubleshoot-online-endpoints
