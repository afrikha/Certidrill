id: ai300-2b-frs-code
objective: "2.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You are experimenting in an Azure Machine Learning project workspace. The managed feature store contains version 1 of a feature set named `transactions`, which has a feature named `transaction_amount_7d_sum`.

    You need to write code that selects this feature by its URI and writes a feature retrieval specification to the folder `./spec`, so that the training pipeline can use it.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous expérimentez dans un espace de travail de projet Azure Machine Learning. Le magasin de caractéristiques managé contient la version 1 d'un ensemble de caractéristiques nommé `transactions`, qui possède une caractéristique nommée `transaction_amount_7d_sum`.

    Vous devez écrire du code qui sélectionne cette caractéristique par son URI et écrit une spécification de récupération de caractéristiques dans le dossier `./spec`, afin que le pipeline d'entraînement puisse l'utiliser.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    featurestore = FeatureStoreClient(
        credential=AzureMLOnBehalfOfCredential(),
        subscription_id=sub_id,
        resource_group_name="rg-features",
        name="fs-contoso",
    )

    features = featurestore.[[s1]](
        ["[[s2]]"]
    )

    featurestore.[[s3]]("./spec", features)
  slots:
    - id: s1
      options:
        - { id: s1b, text: resolve_feature_retrieval_spec }
        - { id: s1c, text: generate_feature_retrieval_spec }
        - { id: s1a, text: resolve_feature_uri }
    - id: s2
      options:
        - { id: s2d, text: "transactions@latest:transaction_amount_7d_sum" }
        - { id: s2b, text: "transaction_amount_7d_sum:transactions:1" }
        - { id: s2a, text: "transactions:1:transaction_amount_7d_sum" }
        - { id: s2c, text: "azureml:transactions:1" }
    - id: s3
      options:
        - { id: s3b, text: resolve_feature_retrieval_spec }
        - { id: s3a, text: generate_feature_retrieval_spec }
        - { id: s3c, text: resolve_feature_uri }
answer:
  values: { s1: s1a, s2: s2a, s3: s3a }
explanation:
  correct:
    en: |
      `resolve_feature_uri()` takes a list of feature URIs in the form `<feature set>:<version>:<feature>` and returns the matching feature objects. `generate_feature_retrieval_spec()` then writes the specification for these features to the folder.
    fr: |
      `resolve_feature_uri()` accepte une liste d'URI de caractéristiques au format `<feature set>:<version>:<feature>` et renvoie les objets caractéristiques correspondants. `generate_feature_retrieval_spec()` écrit ensuite la spécification de ces caractéristiques dans le dossier.
  options:
    s1b: { en: "This method reads an existing specification folder; it doesn't resolve feature URIs.", fr: "Cette méthode lit un dossier de spécification existant ; elle ne résout pas d'URI de caractéristiques." }
    s1c: { en: "This method writes the specification; it expects a folder and feature objects, not URIs.", fr: "Cette méthode écrit la spécification ; elle attend un dossier et des objets caractéristiques, pas des URI." }
    s2b: { en: "The feature set and its version come first, then the feature name.", fr: "L'ensemble de caractéristiques et sa version viennent en premier, puis le nom de la caractéristique." }
    s2c: { en: "This is an asset reference; it doesn't name a feature.", fr: "Il s'agit d'une référence d'actif ; elle ne désigne aucune caractéristique." }
    s2d: { en: "A feature URI names an explicit feature set version, not a label.", fr: "Un URI de caractéristique indique une version explicite de l'ensemble de caractéristiques, pas une étiquette de version." }
    s3b: { en: "This method loads a specification; it doesn't write one.", fr: "Cette méthode charge une spécification ; elle n'en écrit pas." }
references:
  - title: Feature retrieval specification and usage in training and inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/feature-retrieval-concepts
