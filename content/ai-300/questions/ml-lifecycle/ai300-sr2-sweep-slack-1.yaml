status: draft
stem:
  en: You set a median stopping policy on the sweep job.
  fr: Vous définissez une stratégie d'arrêt médian sur le travail de balayage.
body:
  solution:
    en: |
      You add the following line before the sweep job is submitted:

      `sweep_job.early_termination = MedianStoppingPolicy(delay_evaluation=5, evaluation_interval=1)`
    fr: |
      Vous ajoutez la ligne suivante avant l'envoi du travail de balayage :

      `sweep_job.early_termination = MedianStoppingPolicy(delay_evaluation=5, evaluation_interval=1)`
answer: { value: false }
explanation:
  correct:
    en: A median stopping policy computes running averages across all trials and cancels the trials whose primary metric is worse than the median of those averages. It doesn't compare each trial with the best trial and has no tolerance setting, so it can't apply the 0.1 ratio that the requirement sets.
    fr: "Une stratégie d'arrêt médian calcule des moyennes mobiles sur tous les essais et annule les essais dont la métrique principale est inférieure à la médiane de ces moyennes. Elle ne compare pas chaque essai au meilleur essai et n'a aucun paramètre de tolérance : elle ne peut pas appliquer le ratio de 0,1 demandé."
references:
  - title: Hyperparameter tuning a model (v2) - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-tune-hyperparameters
