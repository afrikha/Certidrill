id: ai300-2b-frs-flow
objective: "2.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning project workspace connected to a managed feature store. You are building a loan default model from features of the store.

    You need the model to be trained and scored in batch with exactly the same features, without maintaining the feature list in more than one place.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail de projet Azure Machine Learning connecté à un magasin de caractéristiques managé. Vous créez un modèle de défaut de paiement à partir de caractéristiques du magasin.

    Le modèle doit être entraîné et évalué par lots avec exactement les mêmes caractéristiques, sans gérer la liste des caractéristiques à plus d'un endroit.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: batch, text: { en: "Run a batch inference pipeline that passes the registered model to the feature retrieval component.", fr: "Exécuter un pipeline d'inférence par lots qui transmet le modèle inscrit au composant de récupération de caractéristiques." } }
    - { id: online, text: { en: "Call `init_online_lookup()` in the batch scoring step.", fr: "Appeler `init_online_lookup()` dans l'étape de scoring par lots." } }
    - { id: gen, text: { en: "Select the features and generate a feature retrieval specification.", fr: "Sélectionner les caractéristiques et générer une spécification de récupération de caractéristiques." } }
    - { id: ret, text: { en: "Run the feature retrieval component with the specification and the observation data to produce training data.", fr: "Exécuter le composant de récupération de caractéristiques avec la spécification et les données d'observation pour produire les données d'entraînement." } }
    - { id: train, text: { en: "Train the model and copy `feature_retrieval_spec.yaml` to the model output folder.", fr: "Entraîner le modèle et copier `feature_retrieval_spec.yaml` dans le dossier de sortie du modèle." } }
    - { id: asset, text: { en: "Register the specification as a data asset for the batch inference pipeline.", fr: "Inscrire la spécification en tant que ressource de données pour le pipeline d'inférence par lots." } }
    - { id: reg, text: { en: "Register the model.", fr: "Inscrire le modèle." } }
answer:
  sequence: [ gen, ret, train, reg, batch ]
explanation:
  correct:
    en: |
      The specification is generated during experimentation, then used with the observation data to create training data with a point-in-time join. The training job packages the specification with the model, so the registered model carries its feature list. At batch inference time, the feature retrieval component takes the registered model as input and reads the specification from the model artifact.
    fr: |
      La spécification est générée pendant l'expérimentation, puis utilisée avec les données d'observation pour créer les données d'entraînement par une jointure à un instant donné. Le travail d'entraînement empaquette la spécification avec le modèle : le modèle inscrit transporte donc sa liste de caractéristiques. Au moment de l'inférence par lots, le composant de récupération de caractéristiques prend le modèle inscrit en entrée et lit la spécification dans l'artefact du modèle.
  options:
    asset: { en: "A separate data asset would be a second copy of the feature list, which the requirements exclude.", fr: "Une ressource de données distincte constituerait une deuxième copie de la liste des caractéristiques, ce que les exigences excluent." }
    online: { en: "Online lookup is for real-time scoring; batch inference retrieves features offline with the component.", fr: "La recherche en ligne sert au scoring en temps réel ; l'inférence par lots récupère les caractéristiques hors connexion avec le composant." }
references:
  - title: Feature retrieval specification and usage in training and inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/feature-retrieval-concepts
  - title: "Tutorial 2: Experiment and train models by using features"
    url: https://learn.microsoft.com/en-us/azure/machine-learning/tutorial-experiment-train-models-using-features
