id: ai300-2c-kubernetes-online
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure Machine Learning workspace named **mlw-retail**. The platform team operates an Azure Kubernetes Service (AKS) cluster that is already attached to the workspace as a Kubernetes compute target. Company policy requires every production inference workload to run on this cluster, and the platform team handles node sizing, upgrades and networking.

    You need to deploy a recommendation model so that a web application receives a prediction for each request in real time.

    What should you create?
  fr: |
    Fabrikam dispose d'un espace de travail Azure Machine Learning nommé **mlw-retail**. L'équipe plateforme exploite un cluster Azure Kubernetes Service (AKS) déjà attaché à l'espace de travail en tant que cible de calcul Kubernetes. La stratégie de l'entreprise impose que toute charge de travail d'inférence de production s'exécute sur ce cluster, et l'équipe plateforme gère le dimensionnement des nœuds, les mises à niveau et le réseau.

    Vous devez déployer un modèle de recommandation afin qu'une application web reçoive une prédiction pour chaque requête en temps réel.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A managed online endpoint and deployment", fr: "Un point de terminaison en ligne managé et un déploiement" } }
    - { id: b, text: { en: "A batch endpoint and a pipeline component deployment", fr: "Un point de terminaison de lot et un déploiement de composant de pipeline" } }
    - { id: c, text: { en: "A batch endpoint and a model deployment on the attached cluster", fr: "Un point de terminaison de lot et un déploiement de modèle sur le cluster attaché" } }
    - { id: d, text: { en: "A Kubernetes online endpoint and deployment", fr: "Un point de terminaison en ligne Kubernetes et un déploiement" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Kubernetes online endpoint serves real-time requests on a customer-managed Kubernetes cluster attached to the workspace. Node provisioning, maintenance and networking remain the cluster owner's responsibility, which matches the policy.
    fr: |
      Un point de terminaison en ligne Kubernetes sert des requêtes en temps réel sur un cluster Kubernetes géré par le client et attaché à l'espace de travail. Le provisionnement des nœuds, leur maintenance et le réseau restent sous la responsabilité du propriétaire du cluster, ce qui correspond à la stratégie.
  options:
    a: { en: "A managed online endpoint runs on compute managed by Azure Machine Learning, not on the team's AKS cluster, so it breaks the policy.", fr: "Un point de terminaison en ligne managé s'exécute sur un calcul géré par Azure Machine Learning, pas sur le cluster AKS de l'équipe : il ne respecte pas la stratégie." }
    b: { en: "A pipeline component deployment runs a multi-step batch job; it is not a real-time interface.", fr: "Un déploiement de composant de pipeline exécute un travail de lot en plusieurs étapes ; ce n'est pas une interface en temps réel." }
    c: { en: "A batch deployment can run on an attached Kubernetes cluster, but it scores files asynchronously and returns no prediction per request.", fr: "Un déploiement de lot peut s'exécuter sur un cluster Kubernetes attaché, mais il note des fichiers de façon asynchrone et ne renvoie pas de prédiction par requête." }
references:
  - title: Online endpoints for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-online
