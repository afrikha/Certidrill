id: ai300-2b-life-archive-version
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace that contains a registered model named **churn-classifier** with 12 versions. Version 2 is obsolete, but a batch endpoint deployment that a partner team owns still references `azureml:churn-classifier:2`.

    You need to hide version 2 from the default results of `az ml model list` without breaking the partner team's deployment. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning qui contient un modèle inscrit nommé **churn-classifier** possédant 12 versions. La version 2 est obsolète, mais un déploiement de point de terminaison de traitement par lots appartenant à une équipe partenaire référence encore `azureml:churn-classifier:2`.

    Vous devez masquer la version 2 dans les résultats par défaut de `az ml model list` sans interrompre le déploiement de l'équipe partenaire. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run `az ml model archive --name churn-classifier --version 2`.", fr: "Exécuter `az ml model archive --name churn-classifier --version 2`." } }
    - { id: b, text: { en: "Call `transition_model_version_stage()` to move version 2 to the `Archived` stage.", fr: "Appeler `transition_model_version_stage()` pour faire passer la version 2 à l'étape `Archived`." } }
    - { id: c, text: { en: "Call `MlflowClient().delete_model_version(\"churn-classifier\", version=\"2\")`.", fr: "Appeler `MlflowClient().delete_model_version(\"churn-classifier\", version=\"2\")`." } }
    - { id: d, text: { en: "Run `az ml model archive --name churn-classifier`.", fr: "Exécuter `az ml model archive --name churn-classifier`." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Archiving a specific version hides it from list queries such as `az ml model list` by default, but the version can still be referenced and used in workflows, so the existing deployment keeps working.
    fr: |
      Archiver une version précise la masque par défaut dans les requêtes de liste comme `az ml model list`, mais la version peut toujours être référencée et utilisée dans les workflows : le déploiement existant continue donc de fonctionner.
  options:
    d: { en: "Without `--version`, the command archives every version of the model, not only version 2.", fr: "Sans `--version`, la commande archive toutes les versions du modèle, pas seulement la version 2." }
    c: { en: "Deleting removes the version permanently instead of hiding it, so the deployment would reference a version that no longer exists.", fr: "La suppression efface définitivement la version au lieu de la masquer : le déploiement référencerait une version qui n'existe plus." }
    b: { en: "MLflow stages are visible only through the MLflow SDK; they don't affect `az ml model list`.", fr: "Les étapes MLflow ne sont visibles qu'avec le SDK MLflow ; elles n'ont aucun effet sur `az ml model list`." }
references:
  - title: Work with registered models in Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
  - title: az ml model
    url: https://learn.microsoft.com/en-us/cli/azure/ml/model
