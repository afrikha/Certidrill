id: ai300-2a-job-serverless-facts
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys plans to run its training scripts as command jobs on serverless compute in an Azure Machine Learning workspace that has a system-assigned managed identity and a user-assigned managed identity.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit d'exécuter ses scripts d'entraînement dans des travaux de commande sur un calcul serverless, dans un espace de travail Azure Machine Learning qui possède une identité managée affectée par le système et une identité managée affectée par l'utilisateur.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A job can access data with the identity of the user who submits it or with the user-assigned managed identity of the workspace.", fr: "Un travail peut accéder aux données avec l'identité de l'utilisateur qui le soumet ou avec l'identité managée affectée par l'utilisateur de l'espace de travail." } }
    - { id: b, text: { en: "A job can access data with the system-assigned managed identity of the workspace.", fr: "Un travail peut accéder aux données avec l'identité managée affectée par le système de l'espace de travail." } }
    - { id: c, text: { en: "The jobs consume the Azure Machine Learning compute quota of the workspace and subscription.", fr: "Les travaux consomment le quota de calcul Azure Machine Learning de l'espace de travail et de l'abonnement." } }
    - { id: d, text: { en: "You must create a compute cluster named serverless before you submit the first job.", fr: "Vous devez créer un cluster de calcul nommé serverless avant de soumettre le premier travail." } }
    - { id: e, text: { en: "Serverless compute provides only CPU VM sizes, so GPU training needs a compute cluster.", fr: "Le calcul serverless ne fournit que des tailles de machine virtuelle CPU : l'entraînement GPU demande un cluster de calcul." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Serverless jobs run with user identity (credential passthrough) or the workspace's user-assigned managed identity. They need enough workspace-level and subscription-level compute quota, and the quota they use appears under the name Serverless in the Azure portal.
    fr: |
      Les travaux serverless s'exécutent avec l'identité de l'utilisateur (transmission des informations d'identification) ou avec l'identité managée affectée par l'utilisateur de l'espace de travail. Ils ont besoin d'un quota de calcul suffisant au niveau de l'espace de travail et de l'abonnement, et le quota qu'ils utilisent apparaît sous le nom Serverless dans le portail Azure.
  options:
    b:
      en: |
        Serverless compute doesn't support system-assigned identity.
      fr: |
        Le calcul serverless ne prend pas en charge l'identité affectée par le système.
    d:
      en: |
        There's no compute to create; you omit `compute`, and Azure Machine Learning provisions the nodes.
      fr: |
        Il n'y a aucun calcul à créer ; vous omettez `compute`, et Azure Machine Learning provisionne les nœuds.
    e:
      en: |
        You can request a GPU size such as Standard_NC24 with `instance_type`.
      fr: |
        Vous pouvez demander une taille GPU comme Standard_NC24 avec `instance_type`.
references:
  - title: Model training on serverless compute
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-serverless-compute
