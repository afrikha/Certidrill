id: ai300-2c-schedule-yaml
objective: "2.4.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a retraining pipeline defined in the file `retrain-pipeline.yml`. You are writing an Azure Machine Learning schedule that must run the pipeline every Sunday at 02:00 Paris time by using a recurrence trigger.

    How should you complete the YAML file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un pipeline de réentraînement défini dans le fichier `retrain-pipeline.yml`. Vous rédigez une planification Azure Machine Learning qui doit exécuter le pipeline chaque dimanche à 02:00, heure de Paris, à l'aide d'un déclencheur de récurrence.

    Comment devez-vous compléter le fichier YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    $schema: https://azuremlschemas.azureedge.net/latest/schedule.schema.json
    name: weekly_retraining
    trigger:
      type: [[type]]
      frequency: [[freq]]
      interval: 1
      schedule:
        hours: 2
        minutes: 0
        weekdays: ["sunday"]
      time_zone: "W. Europe Standard Time"
    [[job]]: ./retrain-pipeline.yml
  slots:
    - id: type
      options:
        - { id: rec, text: recurrence }
        - { id: cron, text: cron }
    - id: freq
      options:
        - { id: day, text: day }
        - { id: week, text: week }
        - { id: hour, text: hour }
    - id: job
      options:
        - { id: cj, text: create_job }
        - { id: cm, text: create_monitor }
        - { id: jobs, text: jobs }
answer:
  values: { type: rec, freq: week, job: cj }
explanation:
  correct:
    en: |
      A recurrence trigger uses `frequency`, `interval` and an optional `schedule` with hours, minutes and weekdays; `weekdays` applies only when the frequency is `week` or `month`. `create_job` references the pipeline job that the schedule submits at each run.
    fr: |
      Un déclencheur de récurrence utilise `frequency`, `interval` et un `schedule` facultatif avec les heures, les minutes et les jours de la semaine ; `weekdays` ne s'applique que si la fréquence est `week` ou `month`. `create_job` référence le travail de pipeline que la planification soumet à chaque exécution.
  options:
    cron: { en: "A cron trigger uses an expression key, not frequency, interval and schedule.", fr: "Un déclencheur cron utilise une clé expression, pas frequency, interval et schedule." }
    day: { en: "weekdays applies only with a week or month frequency.", fr: "weekdays ne s'applique qu'avec une fréquence week ou month." }
    cm: { en: "create_monitor defines a model monitor, not a pipeline job to run.", fr: "create_monitor définit une surveillance de modèle, pas un travail de pipeline à exécuter." }
    jobs: { en: "jobs lists the steps inside a pipeline job file; a schedule uses create_job.", fr: "jobs répertorie les étapes d'un fichier de travail de pipeline ; une planification utilise create_job." }
references:
  - title: Schedule machine learning pipeline jobs
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-schedule-pipeline-job
