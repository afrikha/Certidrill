id: ai300-2a-nb-sharing-facts
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-litware**. Ana and Ben both have the Contributor role on mlw-litware, and each of them has created a compute instance.

    Ana creates a notebook in **Notebooks > User files** and sends its browser URL to Ben.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-litware**. Ana et Ben ont tous deux le rôle Contributor sur mlw-litware, et chacun a créé une instance de calcul.

    Ana crée un notebook dans **Notebooks > User files** et envoie son URL de navigateur à Ben.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "The notebook is stored in the storage account of the workspace, in a folder named after Ana, and Ben can open it.", fr: "Le notebook est stocké dans le compte de stockage de l'espace de travail, dans un dossier au nom d'Ana, et Ben peut l'ouvrir." }
    - id: b
      text: { en: "When Ben runs the notebook, its cells run on Ana's compute instance because the notebook is attached to it.", fr: "Quand Ben exécute le notebook, ses cellules s'exécutent sur l'instance de calcul d'Ana, car le notebook y est attaché." }
    - id: c
      text: { en: "When Ben runs the notebook, its cells run on a compute instance that Ben selects, such as his own.", fr: "Quand Ben exécute le notebook, ses cellules s'exécutent sur une instance de calcul que Ben sélectionne, comme la sienne." }
    - id: d
      text: { en: "Ben must copy the notebook to the OS disk of his compute instance before he can edit it.", fr: "Ben doit copier le notebook sur le disque du système d'exploitation de son instance de calcul avant de pouvoir le modifier." }
    - id: e
      text: { en: "A user who has only the Reader role on mlw-litware could edit the notebook but not run it.", fr: "Un utilisateur qui a seulement le rôle Reader sur mlw-litware pourrait modifier le notebook, mais pas l'exécuter." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Notebooks live in the User files of the workspace storage account, by default in a folder named after the user, and others with workspace access can open them. Compute instances have a single owner and aren't shared, so Ben runs the notebook on his own compute instance.
    fr: |
      Les notebooks se trouvent dans les fichiers utilisateur (User files) du compte de stockage de l'espace de travail, par défaut dans un dossier au nom de l'utilisateur, et les autres utilisateurs ayant accès à l'espace de travail peuvent les ouvrir. Les instances de calcul n'ont qu'un propriétaire et ne sont pas partagées : Ben exécute le notebook sur sa propre instance de calcul.
  options:
    b:
      en: |
        Only the owner can use a compute instance; other users who run a shared notebook use their own compute instance.
      fr: |
        Seul le propriétaire peut utiliser une instance de calcul ; les autres utilisateurs qui exécutent un notebook partagé utilisent leur propre instance de calcul.
    d:
      en: |
        User files are stored separately from the machine and shared among all compute instances of the workspace; no copy is needed.
      fr: |
        Les fichiers utilisateur sont stockés séparément de la machine et partagés entre toutes les instances de calcul de l'espace de travail ; aucune copie n'est nécessaire.
    e:
      en: |
        A Reader can only view a notebook; a Contributor can edit it.
      fr: |
        Un Reader peut seulement consulter un notebook ; un Contributor peut le modifier.
references:
  - title: Run Jupyter notebooks in your workspace
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-run-jupyter-notebooks
  - title: What is an Azure Machine Learning compute instance?
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-compute-instance
