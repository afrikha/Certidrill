id: ai300-2a-job-shm-size
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You run a PyTorch training script as a command job on a GPU compute cluster in Azure Machine Learning. The job YAML file doesn't contain a `resources` section. The script creates a `DataLoader` with `num_workers=8`, and the job fails with an error that reports insufficient shared memory in the container.

    You need to fix the error without changing the script or the compute cluster.

    What should you do?
  fr: |
    Vous exécutez un script d'entraînement PyTorch dans un travail de commande sur un cluster de calcul GPU dans Azure Machine Learning. Le fichier YAML du travail ne contient pas de section `resources`. Le script crée un `DataLoader` avec `num_workers=8`, et le travail échoue avec une erreur qui signale une mémoire partagée insuffisante dans le conteneur.

    Vous devez corriger l'erreur sans modifier le script ni le cluster de calcul.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set `resources.instance_count` to 2.", fr: "Définir `resources.instance_count` sur 2." } }
    - { id: b, text: { en: "Set `resources.shm_size` to a larger value, such as `16g`.", fr: "Définir `resources.shm_size` sur une valeur plus élevée, comme `16g`." } }
    - { id: c, text: { en: "Set the mode of the training input to `download`.", fr: "Définir le mode de l'entrée d'entraînement sur `download`." } }
    - { id: d, text: { en: "Increase `limits.timeout` to 7200.", fr: "Augmenter `limits.timeout` à 7200." } }
answer: { optionId: b }
explanation:
  correct:
    en: "`resources.shm_size` sets the size of the shared memory block of the job container (`/dev/shm`), `2g` by default. PyTorch data loader workers exchange batches through shared memory, so raising the value fixes the error without touching the script."
    fr: "`resources.shm_size` définit la taille du bloc de mémoire partagée du conteneur du travail (`/dev/shm`), `2g` par défaut. Les workers du chargeur de données PyTorch échangent les lots par la mémoire partagée : augmenter la valeur corrige l'erreur sans toucher au script."
  options:
    a:
      en: |
        More nodes run more copies of the container, each with the same 2 GB of shared memory.
      fr: |
        Plus de nœuds exécutent plus de copies du conteneur, chacune avec les mêmes 2 Go de mémoire partagée.
    c:
      en: |
        The input mode decides how data reaches the node, not the shared memory of the container.
      fr: |
        Le mode d'entrée détermine comment les données arrivent sur le nœud, pas la mémoire partagée du conteneur.
    d:
      en: |
        The job fails on memory, not on duration.
      fr: |
        Le travail échoue à cause de la mémoire, pas de la durée.
references:
  - title: CLI (v2) command job YAML schema
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-job-command
