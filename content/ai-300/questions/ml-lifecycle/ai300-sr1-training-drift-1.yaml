id: ai300-sr1-training-drift-1
objective: "2.4.1"
type: series_yesno
series: ai300-sr1-training-drift
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You configure a data drift signal whose reference data is the training data asset.
  fr: Vous configurez un signal de dérive des données dont les données de référence sont la ressource de données d'entraînement.
body:
  solution:
    en: |
      You create monitor.yaml with the following content:

      ```yaml
      $schema: http://azureml/sdk-2-0/Schedule.json
      name: loan_model_monitoring
      trigger:
        type: recurrence
        frequency: day
        interval: 1
        schedule:
          hours: 2
          minutes: 0
      create_monitor:
        compute:
          instance_type: standard_e4s_v3
          runtime_version: "3.4"
        monitoring_target:
          ml_task: classification
          endpoint_deployment_id: azureml:ep-loan:main
        monitoring_signals:
          input_drift:
            type: data_drift
            reference_data:
              input_data:
                path: azureml:loan-train:3
                type: mltable
              data_context: training
              data_column_names:
                target_column: defaulted
            features:
              top_n_feature_importance: 10
            alert_enabled: true
            metric_thresholds:
              numerical:
                jensen_shannon_distance: 0.01
              categorical:
                pearsons_chi_squared_test: 0.02
        alert_notification:
          emails:
            - mlops@northwind.example
      ```
    fr: |
      Vous créez monitor.yaml avec le contenu suivant :

      ```yaml
      $schema: http://azureml/sdk-2-0/Schedule.json
      name: loan_model_monitoring
      trigger:
        type: recurrence
        frequency: day
        interval: 1
        schedule:
          hours: 2
          minutes: 0
      create_monitor:
        compute:
          instance_type: standard_e4s_v3
          runtime_version: "3.4"
        monitoring_target:
          ml_task: classification
          endpoint_deployment_id: azureml:ep-loan:main
        monitoring_signals:
          input_drift:
            type: data_drift
            reference_data:
              input_data:
                path: azureml:loan-train:3
                type: mltable
              data_context: training
              data_column_names:
                target_column: defaulted
            features:
              top_n_feature_importance: 10
            alert_enabled: true
            metric_thresholds:
              numerical:
                jensen_shannon_distance: 0.01
              categorical:
                pearsons_chi_squared_test: 0.02
        alert_notification:
          emails:
            - mlops@northwind.example
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      The `data_drift` signal compares the distribution of the production inputs collected from main with the reference data, here the training data asset with `data_context: training`. The target column lets the monitor compute feature importance for `top_n_feature_importance: 10`, the daily recurrence runs the check every day, and `alert_enabled` with `alert_notification` sends the email when a threshold is exceeded. The goal is met.
    fr: |
      Le signal `data_drift` compare la distribution des entrées de production collectées depuis main avec les données de référence, ici la ressource de données d'entraînement avec `data_context: training`. La colonne cible permet au moniteur de calculer l'importance des caractéristiques pour `top_n_feature_importance: 10`, la récurrence quotidienne exécute la vérification chaque jour, et `alert_enabled` avec `alert_notification` envoie l'e-mail lorsqu'un seuil est dépassé. L'objectif est atteint.
references:
  - title: Monitor model performance in production - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance?view=azureml-api-2
