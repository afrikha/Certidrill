id: ai300-2b-pipe-schedule
objective: "2.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-tailspin** and a pipeline job file named `train-pipeline.yml`. The data science team works in Paris.

    You need to run the training pipeline every day at 02:00 Paris time, including during daylight saving time, by using a schedule created with `az ml schedule create`.

    Which two trigger definitions can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-tailspin** et d'un fichier de travail de pipeline nommé `train-pipeline.yml`. L'équipe de science des données travaille à Paris.

    Vous devez exécuter le pipeline d'entraînement chaque jour à 02:00, heure de Paris, y compris pendant l'heure d'été, à l'aide d'une planification créée avec `az ml schedule create`.

    Quelles sont les deux définitions de déclencheur que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "`type: cron`, `expression: \"2 0 * * *\"`, `time_zone: \"Romance Standard Time\"`", fr: "`type: cron`, `expression: \"2 0 * * *\"`, `time_zone: \"Romance Standard Time\"`" } }
    - { id: b, text: { en: "`type: recurrence`, `frequency: hour`, `interval: 2`, `time_zone: \"Romance Standard Time\"`", fr: "`type: recurrence`, `frequency: hour`, `interval: 2`, `time_zone: \"Romance Standard Time\"`" } }
    - { id: c, text: { en: "`type: recurrence`, `frequency: day`, `interval: 1`, `schedule: {hours: [2], minutes: [0]}`, `time_zone: \"Romance Standard Time\"`", fr: "`type: recurrence`, `frequency: day`, `interval: 1`, `schedule: {hours: [2], minutes: [0]}`, `time_zone: \"Romance Standard Time\"`" } }
    - { id: d, text: { en: "`type: cron`, `expression: \"0 2 * * *\"`, `time_zone: \"Romance Standard Time\"`", fr: "`type: cron`, `expression: \"0 2 * * *\"`, `time_zone: \"Romance Standard Time\"`" } }
    - { id: e, text: { en: "`type: cron`, `expression: \"0 2 * * *\"`, with no `time_zone`", fr: "`type: cron`, `expression: \"0 2 * * *\"`, sans `time_zone`" } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      A recurrence trigger with `frequency: day`, `interval: 1` and `hours: [2]`, `minutes: [0]` runs once a day at 02:00, and the cron expression `0 2 * * *` (minutes, hours, days, months, days of week) does the same. Both need `time_zone` set to the Paris time zone, because a schedule without a time zone uses UTC.
    fr: |
      Un déclencheur de récurrence avec `frequency: day`, `interval: 1` et `hours: [2]`, `minutes: [0]` s'exécute une fois par jour à 02:00, tout comme l'expression cron `0 2 * * *` (minutes, heures, jours, mois, jours de la semaine). Les deux nécessitent de définir `time_zone` sur le fuseau horaire de Paris, car une planification sans fuseau horaire utilise UTC.
  options:
    e: { en: "Without `time_zone`, the schedule uses UTC, so the run starts at 03:00 or 04:00 Paris time depending on the season.", fr: "Sans `time_zone`, la planification utilise UTC : l'exécution démarre à 03:00 ou 04:00, heure de Paris, selon la saison." }
    a: { en: "The first cron field is the minute: `2 0 * * *` runs at 00:02.", fr: "Le premier champ cron est la minute : `2 0 * * *` s'exécute à 00:02." }
    b: { en: "This trigger runs every two hours, not once a day.", fr: "Ce déclencheur s'exécute toutes les deux heures, pas une fois par jour." }
references:
  - title: Schedule machine learning pipeline jobs
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-schedule-pipeline-job
