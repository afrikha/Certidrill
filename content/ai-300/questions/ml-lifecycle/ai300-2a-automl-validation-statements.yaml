id: ai300-2a-automl-validation-statements
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware submits AutoML classification jobs from the Python SDK v2. The jobs set neither `validation_data` nor `n_cross_validations`. Some jobs call `set_limits(max_trials=50, enable_early_termination=True)`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware soumet des travaux AutoML de classification à partir du SDK Python v2. Les travaux ne définissent ni `validation_data` ni `n_cross_validations`. Certains travaux appellent `set_limits(max_trials=50, enable_early_termination=True)`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          For training data of 50,000 rows, AutoML holds out 10 % of the rows as the validation set.
        fr: |
          Pour des données d'entraînement de 50 000 lignes, AutoML réserve 10 % des lignes comme jeu de validation.
    - id: s2
      text:
        en: |
          For training data of 800 rows, AutoML uses 3-fold cross-validation.
        fr: |
          Pour des données d'entraînement de 800 lignes, AutoML utilise une validation croisée à 3 plis.
    - id: s3
      text:
        en: |
          A job with early termination enabled can end before 50 trials have run.
        fr: |
          Un travail avec l'arrêt anticipé activé peut se terminer avant que 50 essais aient été exécutés.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Without explicit validation settings, data larger than 20,000 rows is split, with 10 % held out for validation. Data of 20,000 rows or fewer uses cross-validation, with 10 folds below 1,000 rows and 3 folds from 1,000 to 20,000 rows, so 800 rows get 10 folds. Early termination ends the job when the score stops improving, which can happen before `max_trials` is reached.
    fr: |
      Sans paramètre de validation explicite, des données de plus de 20 000 lignes sont fractionnées, avec 10 % réservés à la validation. Des données de 20 000 lignes ou moins utilisent la validation croisée, avec 10 plis sous 1 000 lignes et 3 plis de 1 000 à 20 000 lignes : 800 lignes donnent 10 plis. L'arrêt anticipé met fin au travail quand le score cesse de s'améliorer, ce qui peut se produire avant d'atteindre `max_trials`.
references:
  - title: Set up AutoML training for tabular data with the Azure Machine Learning CLI and Python SDK
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-auto-train
