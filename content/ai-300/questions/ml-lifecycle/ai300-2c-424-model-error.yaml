id: ai300-2c-424-model-error
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a managed online endpoint named **ep-credit** with one deployment that receives 100 percent of the traffic. After a new scoring script was deployed, some client requests return HTTP status code 424.

    What does this status code indicate?
  fr: |
    Woodgrove Bank dispose d'un point de terminaison en ligne managé nommé **ep-credit** avec un déploiement qui reçoit 100 % du trafic. Après le déploiement d'un nouveau script de scoring, certaines requêtes clientes renvoient le code d'état HTTP 424.

    Qu'indique ce code d'état ?
body:
  options:
    - { id: a, text: { en: "The client's key or token is missing, expired or invalid.", fr: "La clé ou le jeton du client est manquant, expiré ou non valide." } }
    - { id: b, text: { en: "The model container returned a non-200 response to the endpoint.", fr: "Le conteneur du modèle a renvoyé une réponse autre que 200 au point de terminaison." } }
    - { id: c, text: { en: "The model took longer than the request timeout to return a result.", fr: "Le modèle a mis plus de temps que le délai d'expiration de la requête pour renvoyer un résultat." } }
    - { id: d, text: { en: "The endpoint has no deployment with a positive traffic weight.", fr: "Le point de terminaison n'a aucun déploiement avec un poids de trafic positif." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      On a managed online endpoint, 424 means that the model container itself returned an error, typically an exception in the scoring script. The response headers `ms-azureml-model-error-statuscode` and `ms-azureml-model-error-reason` give the model's status code and reason.
    fr: |
      Sur un point de terminaison en ligne managé, 424 signifie que le conteneur du modèle lui-même a renvoyé une erreur, en général une exception dans le script de scoring. Les en-têtes de réponse `ms-azureml-model-error-statuscode` et `ms-azureml-model-error-reason` donnent le code d'état et la raison du modèle.
  options:
    a: { en: "Authentication problems return 401.", fr: "Les problèmes d'authentification renvoient 401." }
    c: { en: "Exceeding request_timeout_ms returns 408.", fr: "Le dépassement de request_timeout_ms renvoie 408." }
    d: { en: "An endpoint without a deployment that has positive traffic returns 404.", fr: "Un point de terminaison sans déploiement doté d'un trafic positif renvoie 404." }
references:
  - title: Troubleshoot online endpoint deployment and scoring
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-troubleshoot-online-endpoints
