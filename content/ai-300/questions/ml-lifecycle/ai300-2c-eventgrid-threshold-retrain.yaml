id: ai300-2c-eventgrid-threshold-retrain
objective: "2.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Machine Learning workspace named **mlw-risk** with a model monitor named **loans_monitor**. Its data drift and data quality signals have `alert_enabled: true` and metric thresholds. A Logic App named **la-retrain** submits the retraining pipeline job when it is called.

    You need la-retrain to run automatically whenever any signal of a monitor in mlw-risk breaches its threshold.

    How should you configure the Event Grid subscription on mlw-risk?
  fr: |
    Woodgrove Bank dispose d'un espace de travail Azure Machine Learning nommé **mlw-risk** avec une surveillance de modèle nommée **loans_monitor**. Ses signaux de dérive des données et de qualité des données ont `alert_enabled: true` et des seuils de métriques. Une application logique nommée **la-retrain** soumet le travail du pipeline de réentraînement quand elle est appelée.

    Vous devez faire en sorte que la-retrain s'exécute automatiquement chaque fois qu'un signal d'une surveillance de mlw-risk dépasse son seuil.

    Comment devez-vous configurer l'abonnement Event Grid sur mlw-risk ?
body:
  options:
    - { id: a, text: { en: "Event type **Dataset drift detected**, with la-retrain as the endpoint", fr: "Type d'événement **Dataset drift detected**, avec la-retrain comme point de terminaison" } }
    - { id: b, text: { en: "Event type **Run completed**, with a subject filter that begins with `models/`", fr: "Type d'événement **Run completed**, avec un filtre d'objet qui commence par `models/`" } }
    - { id: c, text: { en: "Event type **Run status changed**, with an advanced filter on `data.RunTags.azureml_modelmonitor_threshold_breached`", fr: "Type d'événement **Run status changed**, avec un filtre avancé sur `data.RunTags.azureml_modelmonitor_threshold_breached`" } }
    - { id: d, text: { en: "Event type **Model deployed**, with an advanced filter on the endpoint name", fr: "Type d'événement **Model deployed**, avec un filtre avancé sur le nom du point de terminaison" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When a signal breaches its threshold, the monitoring run fails and is tagged. Subscribe only to **Run status changed** and add an advanced filter with the key `data.RunTags.azureml_modelmonitor_threshold_breached`, the operator **String contains** and the value "has failed due to one or more features violating metric thresholds"; filtering on a signal name instead restricts it to one signal.
    fr: |
      Quand un signal dépasse son seuil, l'exécution de surveillance échoue et reçoit une balise. Abonnez-vous uniquement à **Run status changed** et ajoutez un filtre avancé avec la clé `data.RunTags.azureml_modelmonitor_threshold_breached`, l'opérateur **String contains** et la valeur « has failed due to one or more features violating metric thresholds » ; filtrer plutôt sur un nom de signal limite l'abonnement à ce signal.
  options:
    a: { en: "Dataset drift detected belongs to data drift v1 (dataset monitors), not to model monitoring.", fr: "Dataset drift detected appartient à la dérive des données v1 (moniteurs de jeux de données), pas à la surveillance des modèles." }
    b: { en: "Run completed is raised when a run completes, and the models/ subject prefix applies to model registration events.", fr: "Run completed est déclenché quand une exécution se termine, et le préfixe d'objet models/ s'applique aux événements d'inscription de modèle." }
    d: { en: "Model deployed is raised after a successful deployment; it has nothing to do with monitoring thresholds.", fr: "Model deployed est déclenché après un déploiement réussi ; il n'a aucun rapport avec les seuils de surveillance." }
references:
  - title: Monitor model performance in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance
  - title: Trigger applications, processes, or CI/CD workflows based on Azure Machine Learning events
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-event-grid
