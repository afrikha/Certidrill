id: ai300-2c-mlflow-no-code
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has an Azure Machine Learning workspace that contains a model named **delay-predictor**, registered with the type `mlflow_model`. The model has the PyFunc flavor and a signature, and it returns tabular predictions without preprocessing.

    You need to deploy the model to a managed online endpoint. The solution must minimize development effort.

    What should you do?
  fr: |
    Tailspin dispose d'un espace de travail Azure Machine Learning qui contient un modèle nommé **delay-predictor**, inscrit avec le type `mlflow_model`. Le modèle a la saveur PyFunc et une signature, et il renvoie des prédictions tabulaires sans prétraitement.

    Vous devez déployer le modèle sur un point de terminaison en ligne managé. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Write a `score.py` that loads the model with `mlflow.pyfunc.load_model`, and reference it with an environment.", fr: "Écrire un `score.py` qui charge le modèle avec `mlflow.pyfunc.load_model`, et le référencer avec un environnement." } }
    - { id: b, text: { en: "Build a custom container image that contains the model, and push it to Azure Container Registry.", fr: "Créer une image conteneur personnalisée qui contient le modèle, puis l'envoyer vers Azure Container Registry." } }
    - { id: c, text: { en: "Register the model again with the type `custom_model`, and then deploy it with a scoring script.", fr: "Inscrire à nouveau le modèle avec le type `custom_model`, puis le déployer avec un script de scoring." } }
    - { id: d, text: { en: "Omit `code_configuration` and `environment` from the deployment YAML file.", fr: "Omettre `code_configuration` et `environment` dans le fichier YAML du déploiement." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      MLflow models with the PyFunc flavor support no-code deployment. When the deployment omits `code_configuration` and `environment`, Azure Machine Learning provides the scoring script and the environment and installs the packages listed in the model's conda file.
    fr: |
      Les modèles MLflow dotés de la saveur PyFunc prennent en charge le déploiement sans code. Quand le déploiement omet `code_configuration` et `environment`, Azure Machine Learning fournit le script de scoring et l'environnement, et installe les packages répertoriés dans le fichier conda du modèle.
  options:
    a: { en: "A custom scoring script is only needed for pre- or postprocessing, a specific flavor or non-tabular output; it adds code to write and maintain.", fr: "Un script de scoring personnalisé n'est nécessaire que pour un prétraitement ou un post-traitement, une saveur précise ou une sortie non tabulaire ; il ajoute du code à écrire et à maintenir." }
    b: { en: "A custom container is possible but is the most work: you build, version and maintain the image yourself.", fr: "Un conteneur personnalisé est possible, mais c'est l'option la plus coûteuse en travail : vous créez, versionnez et maintenez l'image vous-même." }
    c: { en: "Converting to a custom model removes the no-code option and requires both a scoring script and an environment.", fr: "Passer à un modèle personnalisé supprime l'option sans code et impose à la fois un script de scoring et un environnement." }
references:
  - title: Deploy MLflow models to real-time endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-mlflow-models-online-endpoints
