status: draft
stem:
  en: You configure a prediction drift signal.
  fr: Vous configurez un signal de dérive des prédictions.
body:
  solution:
    en: |
      You create monitor.yaml with the same `$schema`, `name`, `trigger`, `compute`, `monitoring_target` and `alert_notification` settings as a daily monitor of `azureml:ep-loan:main`. The only monitoring signal is of type `prediction_drift`, with `alert_enabled: true`, and it uses `azureml:loan-train:3` as its reference data.
    fr: |
      Vous créez monitor.yaml avec les mêmes paramètres `$schema`, `name`, `trigger`, `compute`, `monitoring_target` et `alert_notification` qu'un moniteur quotidien de `azureml:ep-loan:main`. Le seul signal de surveillance est de type `prediction_drift`, avec `alert_enabled: true`, et il utilise `azureml:loan-train:3` comme données de référence.
answer: { value: false }
explanation:
  correct:
    en: |
      Prediction drift tracks changes in the distribution of the model's outputs (its predictions) in production, not in the input feature values. The goal asks for the distribution of the production inputs of the 10 most important features, which is what the `data_drift` signal measures. The goal isn't met.
    fr: |
      La dérive des prédictions suit l'évolution de la distribution des sorties du modèle (ses prédictions) en production, et non celle des valeurs des caractéristiques d'entrée. L'objectif porte sur la distribution des entrées de production des 10 caractéristiques les plus importantes, ce que mesure le signal `data_drift`. L'objectif n'est pas atteint.
references:
  - title: Monitor model performance in production - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance?view=azureml-api-2
