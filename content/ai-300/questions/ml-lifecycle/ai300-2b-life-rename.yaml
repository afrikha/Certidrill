id: ai300-2b-life-rename
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-adatum** that contains a registered model named **model-v1-test** with three versions. The team decides to follow a naming convention, and the model must be available in mlw-adatum under the name **credit-risk-classifier**.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-adatum** qui contient un modèle inscrit nommé **model-v1-test** possédant trois versions. L'équipe décide de suivre une convention de nommage, et le modèle doit être disponible dans mlw-adatum sous le nom **credit-risk-classifier**.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run `az ml model update` on each version with `--set name=credit-risk-classifier`.", fr: "Exécuter `az ml model update` sur chaque version avec `--set name=credit-risk-classifier`." } }
    - { id: b, text: { en: "Run `az ml model share` with `--share-with-name credit-risk-classifier` and a registry named reg-adatum.", fr: "Exécuter `az ml model share` avec `--share-with-name credit-risk-classifier` et un registre nommé reg-adatum." } }
    - { id: c, text: { en: "Call `MlflowClient().rename_registered_model()` with the new name.", fr: "Appeler `MlflowClient().rename_registered_model()` avec le nouveau nom." } }
    - { id: d, text: { en: "Register the model again in mlw-adatum under the name credit-risk-classifier.", fr: "Inscrire de nouveau le modèle dans mlw-adatum sous le nom credit-risk-classifier." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Registered models are immutable objects in Azure Machine Learning, and renaming them isn't supported. To use a new name, register the model again under that name, from the original job output or model files.
    fr: |
      Les modèles inscrits sont des objets immuables dans Azure Machine Learning, et leur renommage n'est pas pris en charge. Pour utiliser un nouveau nom, inscrivez de nouveau le modèle sous ce nom, à partir de la sortie du travail d'origine ou des fichiers du modèle.
  options:
    a: { en: "Only the description and tags of a version can be updated; the name is immutable.", fr: "Seules la description et les étiquettes d'une version peuvent être modifiées ; le nom est immuable." }
    c: { en: "Open-source MLflow can rename models, but Azure Machine Learning doesn't support renaming registered models.", fr: "La version open source de MLflow prend en charge le renommage, mais Azure Machine Learning ne prend pas en charge le renommage des modèles." }
    b: { en: "Sharing copies the version to a registry, not into mlw-adatum under a new name.", fr: "Le partage copie la version dans un registre, pas dans mlw-adatum sous un nouveau nom." }
references:
  - title: Manage models registry in Azure Machine Learning with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models-mlflow
