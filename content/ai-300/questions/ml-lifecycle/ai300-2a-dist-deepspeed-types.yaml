id: ai300-2a-dist-deepspeed-types
objective: "2.1.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam plans to train a large language model with DeepSpeed as a distributed command job in Azure Machine Learning.

    Which two values can you use for `distribution.type` in the job? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit d'entraîner un grand modèle de langage avec DeepSpeed dans un travail de commande distribué dans Azure Machine Learning.

    Quelles sont les deux valeurs que vous pouvez utiliser pour `distribution.type` dans le travail ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: pytorch }
    - { id: b, text: tensorflow }
    - { id: c, text: mpi }
    - { id: d, text: { en: "No distribution section, with `instance_count` set to the total number of GPUs", fr: "Aucune section distribution, avec `instance_count` défini sur le nombre total de GPU" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Azure Machine Learning supports DeepSpeed as a top-level feature and lets you enable it with either the PyTorch distribution or the Message Passing Interface (MPI) distribution. Curated environments that include DeepSpeed are available.
    fr: |
      Azure Machine Learning prend en charge DeepSpeed comme fonctionnalité de premier niveau et permet de l'activer avec la distribution PyTorch ou avec la distribution MPI (Message Passing Interface). Des environnements organisés qui incluent DeepSpeed sont disponibles.
  options:
    b:
      en: |
        The tensorflow distribution sets TF_CONFIG for TensorFlow; it isn't a documented way to run DeepSpeed.
      fr: |
        La distribution tensorflow définit TF_CONFIG pour TensorFlow ; ce n'est pas une méthode documentée pour exécuter DeepSpeed.
    d:
      en: |
        Without a distribution, one process runs per node, and instance_count counts nodes, not GPUs.
      fr: |
        Sans distribution, un seul processus s'exécute par nœud, et instance_count compte les nœuds, pas les GPU.
references:
  - title: Distributed GPU training guide (SDK v2)
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-train-distributed-gpu
