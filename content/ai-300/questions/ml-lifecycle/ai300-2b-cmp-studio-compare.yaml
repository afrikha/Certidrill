id: ai300-2b-cmp-studio-compare
objective: "2.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-adatum**. An experiment named **credit-risk** contains three completed training jobs that logged parameters, metrics and tags with MLflow.

    A data scientist needs to view the parameters, metrics and tags of the three jobs side by side in Azure Machine Learning studio, without writing code.

    What should the data scientist do?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-adatum**. Une expérience nommée **credit-risk** contient trois travaux d'entraînement terminés qui ont journalisé des paramètres, des métriques et des étiquettes avec MLflow.

    Un scientifique des données doit afficher côte à côte les paramètres, les métriques et les étiquettes des trois travaux dans Azure Machine Learning studio, sans écrire de code.

    Que doit faire le scientifique des données ?
body:
  options:
    - { id: a, text: { en: "Open each job, select Outputs + logs, and download the `user_logs/std_log.txt` files.", fr: "Ouvrir chaque travail, sélectionner Outputs + logs et télécharger les fichiers `user_logs/std_log.txt`." } }
    - { id: b, text: { en: "Open each job, select the Metrics tab, and save a custom chart view for each job.", fr: "Ouvrir chaque travail, sélectionner l'onglet Metrics et enregistrer une vue de graphique personnalisée pour chacun." } }
    - { id: c, text: { en: "Register the model of each job and compare the three models on the Models page.", fr: "Inscrire le modèle de chaque travail et comparer les trois modèles dans la page Models." } }
    - { id: d, text: { en: "Enable the preview panel in the preview features, select the three jobs in the job list, and compare them.", fr: "Activer le panneau d'aperçu dans les fonctionnalités en préversion, sélectionner les trois travaux dans la liste et les comparer." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure Machine Learning studio can compare jobs and models through the preview panel, which you turn on in the preview features settings. After you select several jobs, it shows their parameters, metrics and tags side by side. The feature is in public preview.
    fr: |
      Azure Machine Learning studio permet de comparer des travaux et des modèles avec le panneau d'aperçu, que vous activez dans les paramètres des fonctionnalités en préversion. Après la sélection de plusieurs travaux, il affiche côte à côte leurs paramètres, métriques et étiquettes. La fonctionnalité est en préversion publique.
  options:
    b: { en: "The Metrics tab charts the metrics of one job at a time; it does not show the parameters and tags of the three jobs side by side.", fr: "L'onglet Metrics affiche les métriques d'un seul travail à la fois ; il ne montre pas côte à côte les paramètres et étiquettes des trois travaux." }
    a: { en: "`std_log.txt` contains the standard output and errors of the script, not a comparison of logged values.", fr: "`std_log.txt` contient la sortie standard et les erreurs du script, pas une comparaison des valeurs journalisées." }
    c: { en: "Registering models is unnecessary to compare jobs, and the jobs' parameters and metrics are compared from the job list.", fr: "Inscrire les modèles est inutile pour comparer des travaux ; leurs paramètres et métriques se comparent à partir de la liste des travaux." }
references:
  - title: Query & compare experiments and runs with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-track-experiments-mlflow
