id: ai300-2b-pipe-stop-on-failure
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning pipeline job named **churn-training** that runs five command steps on a GPU compute cluster. Three of the steps don't depend on each other and run in parallel.

    When any step fails, the results of the run are useless. You need the pipeline to stop as soon as one step fails and to cancel the steps that are still running, to avoid paying for unnecessary GPU time. The pipeline settings currently use their default values.

    What should you configure?
  fr: |
    Vous disposez d'un travail de pipeline Azure Machine Learning nommé **churn-training** qui exécute cinq étapes command sur un cluster de calcul GPU. Trois de ces étapes ne dépendent pas les unes des autres et s'exécutent en parallèle.

    Si une étape échoue, les résultats de l'exécution sont inutilisables. Le pipeline doit s'arrêter dès qu'une étape échoue et annuler les étapes encore en cours, pour éviter de payer du temps GPU inutile. Les paramètres du pipeline utilisent actuellement leurs valeurs par défaut.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Set `continue_on_step_failure` to `false` in the pipeline settings.", fr: "Définir `continue_on_step_failure` sur `false` dans les paramètres du pipeline." } }
    - { id: b, text: { en: "Set the minimum number of nodes of the GPU cluster to 0.", fr: "Définir le nombre minimal de nœuds du cluster GPU sur 0." } }
    - { id: c, text: { en: "Set `is_deterministic` to `false` in each component definition.", fr: "Définir `is_deterministic` sur `false` dans chaque définition de composant." } }
    - { id: d, text: { en: "Set `force_rerun` to `false` in the pipeline settings.", fr: "Définir `force_rerun` sur `false` dans les paramètres du pipeline." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `continue_on_step_failure` defaults to `True`: steps that don't depend on the failed step keep running. Setting it to `False` stops the pipeline and cancels the running steps as soon as one step fails.
    fr: |
      `continue_on_step_failure` vaut `True` par défaut : les étapes qui ne dépendent pas de l'étape en échec continuent de s'exécuter. Avec la valeur `False`, le pipeline s'arrête et les étapes en cours sont annulées dès qu'une étape échoue.
  options:
    d: { en: "`force_rerun` is already `false` by default and only controls the reuse of earlier outputs.", fr: "`force_rerun` vaut déjà `false` par défaut et ne contrôle que la réutilisation des sorties précédentes." }
    c: { en: "`is_deterministic` controls whether a step can reuse previous results; it has no effect on failure handling.", fr: "`is_deterministic` détermine si une étape peut réutiliser des résultats précédents ; il n'a aucun effet sur la gestion des échecs." }
    b: { en: "Scaling the cluster to zero nodes when idle lowers cost between runs but doesn't cancel the steps still running after a failure.", fr: "Réduire le cluster à zéro nœud en cas d'inactivité diminue le coût entre les exécutions, mais n'annule pas les étapes encore en cours après un échec." }
references:
  - title: CLI (v2) pipeline job YAML schema
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-job-pipeline
