id: ai300-2c-troubleshoot-statements
objective: "2.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a managed online endpoint named **ep-retail** with a deployment named **blue** (`instance_count: 3`, `max_concurrent_requests_per_instance: 2`). You are preparing a troubleshooting runbook for the operations team.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un point de terminaison en ligne managé nommé **ep-retail** avec un déploiement nommé **blue** (`instance_count: 3`, `max_concurrent_requests_per_instance: 2`). Vous préparez un runbook de dépannage pour l'équipe d'exploitation.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Running `az ml online-deployment get-logs` with `--container storage-initializer` shows whether the model and code files were downloaded to the deployment.
        fr: Exécuter `az ml online-deployment get-logs` avec `--container storage-initializer` indique si les fichiers du modèle et du code ont été téléchargés dans le déploiement.
    - id: s2
      text:
        en: A local endpoint created with `--local` lets you test the endpoint's key authentication and its traffic rules before you deploy to Azure.
        fr: Un point de terminaison local créé avec `--local` permet de tester l'authentification par clé et les règles de trafic du point de terminaison avant le déploiement dans Azure.
    - id: s3
      text:
        en: blue can return HTTP 429 when more than 12 requests are pending at the same time.
        fr: blue peut renvoyer HTTP 429 lorsque plus de 12 requêtes sont en attente en même temps.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The storage initializer container runs before the inference server and logs whether the model and code downloaded successfully. Local endpoints don't support traffic rules, authentication or probe settings, and they host only one deployment. A managed online deployment returns 429 when pending requests exceed 2 × `max_concurrent_requests_per_instance` × `instance_count`, here 2 × 2 × 3 = 12.
    fr: |
      Le conteneur d'initialisation du stockage s'exécute avant le serveur d'inférence et journalise si le modèle et le code ont été téléchargés correctement. Les points de terminaison locaux ne prennent en charge ni les règles de trafic, ni l'authentification, ni les paramètres de sonde, et ils n'hébergent qu'un seul déploiement. Un déploiement en ligne managé renvoie 429 lorsque les requêtes en attente dépassent 2 × `max_concurrent_requests_per_instance` × `instance_count`, soit ici 2 × 2 × 3 = 12.
references:
  - title: Troubleshoot online endpoint deployment and scoring
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-troubleshoot-online-endpoints
  - title: Online endpoints for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-online
