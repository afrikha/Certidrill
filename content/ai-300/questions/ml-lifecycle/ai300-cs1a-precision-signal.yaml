id: ai300-cs1a-precision-signal
objective: "2.4.2"
type: dropdown
caseStudy: ai300-cs1a-relecloud-bank
difficulty: 2
status: draft
stem:
  en: |
    You are adding a signal named fraud_precision to the `monitoring_signals` section of fraud_monitoring.

    How should you complete the YAML to meet the monitoring requirements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ajoutez un signal nommé fraud_precision à la section `monitoring_signals` de fraud_monitoring.

    Comment devez-vous compléter le YAML pour respecter les exigences de surveillance ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    fraud_precision:
      type: [[signal]]
      production_data:
        input_data:
          path: azureml:ep-card-fraud-main-model_outputs:1
          type: mltable
        data_column_names:
          prediction: is_fraud_pred
          correlation_id: transaction_id
      reference_data:
        input_data:
          path: azureml:card-chargebacks:1
          type: mltable
        data_column_names:
          actual: is_fraud
          correlation_id: transaction_id
        data_context: [[context]]
      alert_enabled: true
      metric_thresholds:
        [[task]]:
          precision: 0.7
  slots:
    - id: signal
      options:
        - { id: prediction-drift, text: "prediction_drift" }
        - { id: data-quality, text: "data_quality" }
        - { id: model-performance, text: "model_performance" }
        - { id: attribution, text: "feature_attribution_drift" }
    - id: context
      options:
        - { id: training, text: "training" }
        - { id: ground-truth, text: "ground_truth" }
        - { id: validation, text: "validation" }
    - id: task
      options:
        - { id: numerical, text: "numerical" }
        - { id: classification, text: "classification" }
        - { id: tabular-classification, text: "tabular_classification" }
        - { id: categorical, text: "categorical" }
answer:
  values: { signal: model-performance, context: ground-truth, task: tabular-classification }
explanation:
  correct:
    en: "Precision compares predictions with actual outcomes, which only the `model_performance` signal does: the production data provides the `prediction` column, and the reference data provides the `actual` column of the ground truth, joined to the predictions on the correlation ID. The reference data is declared with `data_context: ground_truth`, and classification thresholds such as accuracy and precision go under `tabular_classification`."
    fr: "La précision compare les prédictions aux résultats réels, ce que seul le signal `model_performance` fait : les données de production fournissent la colonne `prediction`, et les données de référence fournissent la colonne `actual` de la vérité terrain, jointe aux prédictions sur l'ID de corrélation. Les données de référence sont déclarées avec `data_context: ground_truth`, et les seuils de classification comme l'exactitude et la précision se placent sous `tabular_classification`."
  options:
    prediction-drift: { en: "Prediction drift compares the distribution of outputs with a reference; it uses no ground truth and doesn't compute precision.", fr: "La dérive des prédictions compare la distribution des sorties à une référence ; elle n'utilise pas de vérité terrain et ne calcule pas la précision." }
    data-quality: { en: "Data quality checks null values, data types and out-of-bounds values of inputs, not prediction correctness.", fr: "La qualité des données vérifie les valeurs nulles, les types et les valeurs hors limites des entrées, pas la justesse des prédictions." }
    attribution: { en: "Feature attribution drift compares feature importance in production with training; it doesn't measure precision.", fr: "La dérive d'attribution des caractéristiques compare l'importance des caractéristiques en production et à l'entraînement ; elle ne mesure pas la précision." }
    training: { en: "card-chargebacks holds confirmed outcomes of production transactions, not training data.", fr: "card-chargebacks contient les résultats confirmés des transactions de production, pas des données d'entraînement." }
    validation: { en: "Validation data serves as reference for prediction drift; the confirmed fraud cases are ground truth.", fr: "Les données de validation servent de référence à la dérive des prédictions ; les fraudes confirmées sont la vérité terrain." }
    numerical: { en: "`numerical` groups drift or data quality thresholds of numerical features, not classification metrics.", fr: "`numerical` regroupe les seuils de dérive ou de qualité des caractéristiques numériques, pas les métriques de classification." }
    classification: { en: "`classification` is the value of `ml_task` in the monitoring target, not the key of the performance thresholds.", fr: "`classification` est la valeur de `ml_task` dans la cible de surveillance, pas la clé des seuils de performances." }
    categorical: { en: "`categorical` groups drift or data quality thresholds of categorical features.", fr: "`categorical` regroupe les seuils de dérive ou de qualité des caractéristiques catégorielles." }
references:
  - title: Monitor model performance in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance
