id: ai300-cs4a-monitor-signals
objective: "2.4.1"
type: dragdrop
caseStudy: ai300-cs4a-coho-winery
difficulty: 2
status: draft
stem:
  en: |
    You are configuring Azure Machine Learning model monitoring for harvest-api. Which monitoring signal should you configure for each requirement? To answer, drag the appropriate signals to the correct requirements. Each signal may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez la surveillance des modèles Azure Machine Learning pour harvest-api. Quel signal de surveillance devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les signaux appropriés vers les exigences correspondantes. Chaque signal peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: datadrift, text: { en: "Data drift", fr: "Dérive des données" } }
    - { id: preddrift, text: { en: "Prediction drift", fr: "Dérive des prédictions" } }
    - { id: quality, text: { en: "Data quality", fr: "Qualité des données" } }
    - { id: attribution, text: { en: "Feature attribution drift", fr: "Dérive de l'attribution des caractéristiques" } }
    - { id: performance, text: { en: "Model performance (regression)", fr: "Performances du modèle (régression)" } }
  targets:
    - { id: m1, text: { en: "M1", fr: "M1" } }
    - { id: m2, text: { en: "M2", fr: "M2" } }
    - { id: m3, text: { en: "M3", fr: "M3" } }
answer:
  mapping: { m1: datadrift, m2: preddrift, m3: quality }
explanation:
  correct:
    en: Data drift compares the distribution of the production inputs with a reference such as the training data (M1). Prediction drift compares the distribution of the model outputs with a reference such as recent past production data (M2). Data quality checks the inputs for null values, type mismatches and out-of-bounds values (M3).
    fr: La dérive des données compare la distribution des entrées de production à une référence comme les données d'entraînement (M1). La dérive des prédictions compare la distribution des sorties du modèle à une référence comme les données de production récentes (M2). La qualité des données vérifie dans les entrées les valeurs nulles, les incohérences de type et les valeurs hors limites (M3).
  options:
    attribution: { en: "Feature attribution drift (preview) compares feature importance in production with training; it doesn't measure the input distribution, the output distribution or nulls.", fr: "La dérive de l'attribution des caractéristiques (préversion) compare l'importance des caractéristiques en production et à l'entraînement ; elle ne mesure ni la distribution des entrées ou des sorties, ni les valeurs nulles." }
    performance: { en: "Model performance (preview) measures the prediction error against ground truth; M1, M2 and M3 concern the distributions and the integrity of the data, not the error.", fr: "Les performances du modèle (préversion) mesurent l'erreur de prédiction par rapport à la vérité terrain ; M1, M2 et M3 portent sur les distributions et l'intégrité des données, pas sur l'erreur." }
references:
  - title: Azure Machine Learning model monitoring
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-model-monitoring
