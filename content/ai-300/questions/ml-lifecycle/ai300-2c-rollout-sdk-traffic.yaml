id: ai300-2c-rollout-sdk-traffic
objective: "2.3.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam uses the Azure Machine Learning Python SDK v2 to manage a managed online endpoint named **ep-retail**. A deployment named **blue** receives 100 percent of the live traffic, and a new deployment named **green** receives none.

    You need to write a script that:

    1. sends a copy of 20 percent of the requests to green while clients keep receiving blue's answers;
    2. after validation, stops the copy and sends 10 percent of the live requests to green.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise le SDK Python v2 d'Azure Machine Learning pour gérer un point de terminaison en ligne managé nommé **ep-retail**. Un déploiement nommé **blue** reçoit 100 % du trafic réel, et un nouveau déploiement nommé **green** n'en reçoit aucun.

    Vous devez écrire un script qui :

    1. envoie une copie de 20 % des requêtes vers green, tandis que les clients continuent de recevoir les réponses de blue ;
    2. après validation, arrête la copie et envoie 10 % des requêtes réelles vers green.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    endpoint = ml_client.online_endpoints.get(name="ep-retail")
    endpoint.[[a1]] = {"green": 20}
    ml_client.online_endpoints.[[op]](endpoint).result()

    # After validation
    endpoint = ml_client.online_endpoints.get(name="ep-retail")
    endpoint.mirror_traffic = {"green": [[m]]}
    endpoint.[[a2]] = {"blue": 90, "green": 10}
    ml_client.online_endpoints.begin_create_or_update(endpoint).result()
  slots:
    - id: a1
      options:
        - { id: mirror, text: mirror_traffic }
        - { id: traffic, text: traffic }
        - { id: tags, text: tags }
    - id: op
      options:
        - { id: cou, text: begin_create_or_update }
        - { id: invoke, text: invoke }
        - { id: del, text: begin_delete }
    - id: m
      options:
        - { id: m0, text: "0" }
        - { id: m10, text: "10" }
        - { id: m20, text: "20" }
    - id: a2
      options:
        - { id: traffic2, text: traffic }
        - { id: mirror2, text: mirror_traffic }
        - { id: tags2, text: tags }
answer:
  values: { a1: mirror, op: cou, m: m0, a2: traffic2 }
explanation:
  correct:
    en: |
      `mirror_traffic` holds the duplicated live traffic sent to a single deployment, and `traffic` holds the live traffic rules. Changes to the endpoint object take effect when you call `begin_create_or_update`. A deployment can't receive live and mirrored traffic at the same time, so the mirror to green must be set to 0 before green gets 10 percent of the live traffic.
    fr: |
      `mirror_traffic` contient le trafic réel dupliqué envoyé vers un seul déploiement, et `traffic` contient les règles de trafic réel. Les modifications de l'objet point de terminaison prennent effet quand vous appelez `begin_create_or_update`. Un déploiement ne peut pas recevoir en même temps du trafic réel et du trafic en miroir : le miroir vers green doit donc passer à 0 avant que green reçoive 10 % du trafic réel.
  options:
    traffic: { en: "Setting traffic to green=20 would send live requests to green (and the total wouldn't be 100), so clients would receive green's answers.", fr: "Définir traffic à green=20 enverrait des requêtes réelles vers green (et le total ne vaudrait pas 100) : des clients recevraient les réponses de green." }
    invoke: { en: "invoke sends a scoring request; it doesn't apply the endpoint configuration.", fr: "invoke envoie une requête de scoring ; il n'applique pas la configuration du point de terminaison." }
    m10: { en: "Keeping any mirror on green conflicts with giving it live traffic.", fr: "Conserver un miroir sur green est incompatible avec l'attribution de trafic réel à green." }
    mirror2: { en: "A mirror can target only one deployment and is capped at 50 percent; the 90/10 split is a live traffic rule.", fr: "Un miroir ne peut cibler qu'un seul déploiement et est plafonné à 50 % ; la répartition 90/10 est une règle de trafic réel." }
references:
  - title: Perform safe rollout of new deployments for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
  - title: ManagedOnlineEndpoint Class
    url: https://learn.microsoft.com/en-us/python/api/azure-ai-ml/azure.ai.ml.entities.managedonlineendpoint
