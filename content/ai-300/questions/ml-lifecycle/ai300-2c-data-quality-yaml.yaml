id: ai300-2c-data-quality-yaml
objective: "2.4.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso monitors a model deployed to a managed online endpoint. You are adding a signal to the monitoring schedule. The signal must use the training data as reference and alert in the following cases:

    - more than 5 percent of the values of a numerical feature are missing;
    - more than 3 percent of the values of a categorical feature are not in the set of values found in the training data.

    How should you complete the YAML file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso surveille un modèle déployé sur un point de terminaison en ligne managé. Vous ajoutez un signal à la planification de surveillance. Le signal doit utiliser les données d'entraînement comme référence et générer une alerte dans les cas suivants :

    - plus de 5 % des valeurs d'une caractéristique numérique sont manquantes ;
    - plus de 3 % des valeurs d'une caractéristique catégorielle ne font pas partie de l'ensemble des valeurs présentes dans les données d'entraînement.

    Comment devez-vous compléter le fichier YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    monitoring_signals:
      contoso_quality:
        type: [[t]]
        reference_data:
          input_data:
            path: azureml:contoso-train:4
            type: mltable
          data_context: training
        alert_enabled: true
        metric_thresholds:
          numerical:
            [[n]]: 0.05
          categorical:
            [[c]]: 0.03
  slots:
    - id: t
      options:
        - { id: dq, text: data_quality }
        - { id: dd, text: data_drift }
        - { id: pd, text: prediction_drift }
    - id: n
      options:
        - { id: nnull, text: null_value_rate }
        - { id: ntype, text: data_type_error_rate }
        - { id: noob, text: out_of_bounds_rate }
    - id: c
      options:
        - { id: coob, text: out_of_bounds_rate }
        - { id: cnull, text: null_value_rate }
        - { id: cchi, text: pearsons_chi_squared_test }
        - { id: ctype, text: data_type_error_rate }
answer:
  values: { t: dq, n: nnull, c: coob }
explanation:
  correct:
    en: |
      The `data_quality` signal checks the integrity of the inputs against reference data. `null_value_rate` is the share of null values of a feature, and `out_of_bounds_rate` is the share of values outside the reference range (numerical) or the reference set of values (categorical).
    fr: |
      Le signal `data_quality` vérifie l'intégrité des entrées par rapport aux données de référence. `null_value_rate` est la part de valeurs nulles d'une caractéristique, et `out_of_bounds_rate` la part de valeurs hors de la plage de référence (numérique) ou de l'ensemble de valeurs de référence (catégorielle).
  options:
    dd: { en: "data_drift compares distributions; it doesn't count missing or unknown values.", fr: "data_drift compare des distributions ; il ne compte pas les valeurs manquantes ou inconnues." }
    ntype: { en: "data_type_error_rate counts values whose type differs from the type inferred from the reference data.", fr: "data_type_error_rate compte les valeurs dont le type diffère de celui déduit des données de référence." }
    cchi: { en: "Pearson's chi-squared test is a drift metric, not a data quality rate.", fr: "Le test du khi-deux de Pearson est une métrique de dérive, pas un taux de qualité des données." }
references:
  - title: Model monitoring in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-model-monitoring
  - title: Monitor model performance in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance
