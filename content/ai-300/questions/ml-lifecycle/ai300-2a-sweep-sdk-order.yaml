id: ai300-2a-sweep-sdk-order
objective: "2.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You need to tune the `learning_rate` and `boosting` arguments of a LightGBM training script by using the Python SDK v2 for Azure Machine Learning. The sweep must stop after 20 trials and use a median stopping policy.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez régler les arguments `learning_rate` et `boosting` d'un script d'entraînement LightGBM avec le SDK Python v2 pour Azure Machine Learning. Le balayage doit s'arrêter après 20 essais et utiliser une stratégie d'arrêt médian.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: cmd, text: { en: "Define a command job with `command()` whose inputs include `learning_rate` and `boosting`.", fr: "Définir un travail de commande avec `command()` dont les entrées comprennent `learning_rate` et `boosting`." } }
    - { id: expr, text: { en: "Call the command job with `learning_rate=Uniform(...)` and `boosting=Choice(...)`.", fr: "Appeler le travail de commande avec `learning_rate=Uniform(...)` et `boosting=Choice(...)`." } }
    - { id: sweep, text: { en: "Call `sweep()` with the sampling algorithm, the primary metric and the goal.", fr: "Appeler `sweep()` avec l'algorithme d'échantillonnage, la métrique principale et l'objectif." } }
    - { id: limits, text: { en: "Call `set_limits(max_total_trials=20)` and set `early_termination` to a `MedianStoppingPolicy`.", fr: "Appeler `set_limits(max_total_trials=20)` et définir `early_termination` sur une `MedianStoppingPolicy`." } }
    - { id: submit, text: { en: "Submit the sweep job by using `ml_client.create_or_update()`.", fr: "Soumettre le travail de balayage avec `ml_client.create_or_update()`." } }
    - { id: register, text: { en: "Register the model of each trial by using `ml_client.models.create_or_update()`.", fr: "Inscrire le modèle de chaque essai avec `ml_client.models.create_or_update()`." } }
    - { id: automl, text: { en: "Call `automl.classification()` with the same inputs.", fr: "Appeler `automl.classification()` avec les mêmes entrées." } }
answer:
  sequence: [ cmd, expr, sweep, limits, submit ]
explanation:
  correct:
    en: |
      You start from a command job with literal inputs, override those inputs with parameter expressions to define the search space, and call `sweep()` on the result to get a sweep job. Limits and the early termination policy are properties of that sweep job, so they come after `sweep()`, and you submit last.
    fr: |
      Vous partez d'un travail de commande avec des entrées littérales, remplacez ces entrées par des expressions de paramètres pour définir l'espace de recherche, puis appelez `sweep()` sur le résultat pour obtenir un travail de balayage. Les limites et la stratégie d'arrêt anticipé sont des propriétés de ce travail de balayage : elles viennent après `sweep()`, et vous soumettez en dernier.
  options:
    register: { en: "Registering models isn't part of creating the sweep; you register the best model after the sweep completes.", fr: "L'inscription des modèles ne fait pas partie de la création du balayage ; vous inscrivez le meilleur modèle une fois le balayage terminé." }
    automl: { en: "AutoML searches algorithms on an MLTable; it doesn't tune the arguments of your script.", fr: "AutoML recherche des algorithmes sur une MLTable ; il ne règle pas les arguments de votre script." }
references:
  - title: Hyperparameter tuning a model (v2)
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-tune-hyperparameters
