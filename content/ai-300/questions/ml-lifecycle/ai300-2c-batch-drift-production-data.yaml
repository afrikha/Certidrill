id: ai300-2c-batch-drift-production-data
objective: "2.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum scores insurance applications every week with a model deployed to a batch endpoint named **be-underwriting** in an Azure Machine Learning workspace. The training data is registered as a data asset named **uw-train**.

    You need to detect drift between the inputs scored each week and the training data by using Azure Machine Learning model monitoring.

    What should you do?
  fr: |
    Adatum note chaque semaine des demandes d'assurance avec un modèle déployé sur un point de terminaison de lot nommé **be-underwriting** dans un espace de travail Azure Machine Learning. Les données d'entraînement sont inscrites en tant que ressource de données nommée **uw-train**.

    Vous devez détecter la dérive entre les entrées notées chaque semaine et les données d'entraînement à l'aide de la surveillance des modèles Azure Machine Learning.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a `data_collector` section with a `model_inputs` collection to the batch deployment YAML.", fr: "Ajouter une section `data_collector` avec une collection `model_inputs` au YAML du déploiement de lot." } }
    - { id: b, text: { en: "Enable out-of-box monitoring on be-underwriting and select uw-train as reference data.", fr: "Activer la surveillance prête à l'emploi sur be-underwriting et sélectionner uw-train comme données de référence." } }
    - { id: c, text: { en: "Set `app_insights_enabled: true` on the batch deployment and create a monitor from Application Insights.", fr: "Définir `app_insights_enabled: true` sur le déploiement de lot et créer une surveillance depuis Application Insights." } }
    - { id: d, text: { en: "Register the weekly inputs as a data asset and declare it as `production_data` in a data drift signal.", fr: "Inscrire les entrées hebdomadaires en tant que ressource de données et la déclarer comme `production_data` dans un signal de dérive des données." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Automatic collection of production inference data applies to online endpoints. For batch endpoints and models deployed elsewhere, you collect the production data yourself, register it as a data asset and reference it as `production_data` in the signal (with a preprocessing component if the data isn't tabular), with uw-train as `reference_data`.
    fr: |
      La collecte automatique des données d'inférence de production s'applique aux points de terminaison en ligne. Pour les points de terminaison de lot et les modèles déployés ailleurs, vous collectez vous-même les données de production, les inscrivez en tant que ressource de données et les référencez comme `production_data` dans le signal (avec un composant de prétraitement si les données ne sont pas tabulaires), avec uw-train comme `reference_data`.
  options:
    a: { en: "The data collector is a setting of managed online deployments; batch deployments rely on data you collect yourself.", fr: "Le collecteur de données est un paramètre des déploiements en ligne managés ; les déploiements de lot reposent sur des données que vous collectez vous-même." }
    b: { en: "Out-of-box monitoring depends on the data collected automatically from an online endpoint deployment.", fr: "La surveillance prête à l'emploi dépend des données collectées automatiquement à partir d'un déploiement de point de terminaison en ligne." }
    c: { en: "app_insights_enabled is an online deployment setting, and Application Insights doesn't compute drift signals.", fr: "app_insights_enabled est un paramètre des déploiements en ligne, et Application Insights ne calcule pas de signaux de dérive." }
references:
  - title: Model monitoring in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-model-monitoring
  - title: Monitor model performance in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance
