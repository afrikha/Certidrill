id: ai300-2a-sweep-metric-mismatch
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You run a sweep job in Azure Machine Learning. The training script logs its score with `mlflow.log_metric("val_f1", f1)`. The sweep job defines the following objective:

    ```yaml
    objective:
      goal: maximize
      primary_metric: f1_score
    ```

    All trials complete and show the `val_f1` metric, but the sweep can't identify a best trial and the early termination policy never cancels a trial.

    You need the sweep to rank the trials. What should you do?
  fr: |
    Vous exécutez un travail de balayage dans Azure Machine Learning. Le script d'entraînement enregistre son score avec `mlflow.log_metric("val_f1", f1)`. Le travail de balayage définit l'objectif suivant :

    ```yaml
    objective:
      goal: maximize
      primary_metric: f1_score
    ```

    Tous les essais se terminent et affichent la métrique `val_f1`, mais le balayage ne peut pas identifier de meilleur essai et la stratégie d'arrêt anticipé n'annule jamais d'essai.

    Le balayage doit classer les essais. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change `primary_metric` to `val_f1`.", fr: "Remplacer `primary_metric` par `val_f1`." } }
    - { id: b, text: { en: "Add `mlflow.autolog()` to the training script.", fr: "Ajouter `mlflow.autolog()` au script d'entraînement." } }
    - { id: c, text: { en: "Change `sampling_algorithm` to `bayesian`.", fr: "Remplacer `sampling_algorithm` par `bayesian`." } }
    - { id: d, text: { en: "Add `mlflow.set_experiment()` to the training script.", fr: "Ajouter `mlflow.set_experiment()` au script d'entraînement." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The sweep reads the primary metric by name, and that name must exactly match the metric the script logs. Here the script logs `val_f1`, so the sweep never receives any `f1_score` value to compare or to evaluate against the early termination policy.
    fr: |
      Le balayage lit la métrique principale par son nom, et ce nom doit correspondre exactement à la métrique enregistrée par le script. Ici, le script enregistre `val_f1` : le balayage ne reçoit donc aucune valeur `f1_score` à comparer ni à évaluer pour la stratégie d'arrêt anticipé.
  options:
    b:
      en: |
        Autologging adds framework metrics under their own names; it doesn't create a metric named f1_score.
      fr: |
        La journalisation automatique ajoute des métriques du framework sous leurs propres noms ; elle ne crée pas de métrique nommée f1_score.
    c:
      en: |
        Bayesian sampling still needs the primary metric by its exact name.
      fr: |
        L'échantillonnage bayésien a toujours besoin de la métrique principale sous son nom exact.
    d:
      en: |
        Trials of a sweep are already recorded under the experiment of the sweep job; the experiment isn't the issue.
      fr: |
        Les essais d'un balayage sont déjà enregistrés dans l'expérience du travail de balayage ; l'expérience n'est pas en cause.
references:
  - title: Hyperparameter tuning a model (v2)
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-tune-hyperparameters
