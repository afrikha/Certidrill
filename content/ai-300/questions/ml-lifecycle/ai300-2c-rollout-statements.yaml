id: ai300-2c-rollout-statements
objective: "2.3.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a managed online endpoint named **ep-orders** with two deployments named **blue** and **green**. You are documenting the rollout procedure for the endpoint.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un point de terminaison en ligne managé nommé **ep-orders** avec deux déploiements nommés **blue** et **green**. Vous documentez la procédure de déploiement progressif du point de terminaison.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The live traffic percentages of blue and green can be set to blue=70 green=20.
        fr: Les pourcentages de trafic réel de blue et green peuvent être définis à blue=70 green=20.
    - id: s2
      text:
        en: Running `az ml online-deployment delete --name blue --endpoint-name ep-orders` also deletes green.
        fr: L'exécution de `az ml online-deployment delete --name blue --endpoint-name ep-orders` supprime aussi green.
    - id: s3
      text:
        en: A third deployment created with `az ml online-deployment create` and no traffic parameter starts with 0 percent of the traffic.
        fr: Un troisième déploiement créé avec `az ml online-deployment create` sans paramètre de trafic démarre avec 0 % du trafic.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      The total live traffic of an endpoint must be 100 percent (or 0 to disable traffic), so 70 + 20 is rejected. Deleting one deployment doesn't affect the other deployments; only deleting the endpoint deletes all of them. A new deployment receives no traffic until you allocate it, which is what makes it safe to test.
    fr: |
      Le trafic réel total d'un point de terminaison doit valoir 100 % (ou 0 pour désactiver le trafic) : 70 + 20 est donc refusé. Supprimer un déploiement n'affecte pas les autres ; seule la suppression du point de terminaison les supprime tous. Un nouveau déploiement ne reçoit aucun trafic tant que vous ne lui en attribuez pas, ce qui permet de le tester sans risque.
references:
  - title: Perform safe rollout of new deployments for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
