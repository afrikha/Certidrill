id: ai300-2c-local-endpoint-order
objective: "2.3.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A developer at Adatum has a custom model, a `score.py` file and a conda file stored in a local folder. Docker Engine is running on the developer's workstation. The files `endpoint.yml` and `blue.yml` describe an endpoint named **ep-local** and a deployment named **blue** that references the local model files.

    The developer needs to send a sample request to the model running in a local container.

    Which three actions should the developer perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un développeur d'Adatum dispose d'un modèle personnalisé, d'un fichier `score.py` et d'un fichier conda stockés dans un dossier local. Docker Engine s'exécute sur son poste de travail. Les fichiers `endpoint.yml` et `blue.yml` décrivent un point de terminaison nommé **ep-local** et un déploiement nommé **blue** qui référence les fichiers locaux du modèle.

    Le développeur doit envoyer une requête d'exemple au modèle exécuté dans un conteneur local.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: ep, text: { en: "Run `az ml online-endpoint create --local --name ep-local --file endpoint.yml`.", fr: "Exécuter `az ml online-endpoint create --local --name ep-local --file endpoint.yml`." } }
    - { id: dep, text: { en: "Run `az ml online-deployment create --local --name blue --endpoint-name ep-local --file blue.yml`.", fr: "Exécuter `az ml online-deployment create --local --name blue --endpoint-name ep-local --file blue.yml`." } }
    - { id: inv, text: { en: "Run `az ml online-endpoint invoke --local --name ep-local --request-file sample-request.json`.", fr: "Exécuter `az ml online-endpoint invoke --local --name ep-local --request-file sample-request.json`." } }
    - { id: traffic, text: { en: "Run `az ml online-endpoint update --local --name ep-local --traffic \"blue=100\"`.", fr: "Exécuter `az ml online-endpoint update --local --name ep-local --traffic \"blue=100\"`." } }
    - { id: reg, text: { en: "Register the model in the workspace and reference it as `azureml:model:1` in blue.yml.", fr: "Inscrire le modèle dans l'espace de travail et le référencer comme `azureml:model:1` dans blue.yml." } }
    - { id: cred, text: { en: "Run `az ml online-endpoint get-credentials --name ep-local` to obtain a key.", fr: "Exécuter `az ml online-endpoint get-credentials --name ep-local` pour obtenir une clé." } }
answer:
  sequence: [ ep, dep, inv ]
explanation:
  correct:
    en: |
      A local endpoint is created like a managed one, with `--local`: first the endpoint, then its deployment, which Docker builds and starts, and then you invoke it. A local endpoint has a single deployment and supports neither traffic rules nor authentication, and it uses local model files rather than registered models.
    fr: |
      Un point de terminaison local se crée comme un point de terminaison managé, avec `--local` : d'abord le point de terminaison, puis son déploiement, que Docker génère et démarre, puis vous l'appelez. Un point de terminaison local a un seul déploiement et ne prend en charge ni les règles de trafic ni l'authentification ; il utilise des fichiers de modèle locaux plutôt que des modèles inscrits.
  options:
    traffic: { en: "Local endpoints don't support traffic rules.", fr: "Les points de terminaison locaux ne prennent pas en charge les règles de trafic." }
    reg: { en: "Local deployment uses local model files; registered models aren't supported.", fr: "Le déploiement local utilise des fichiers de modèle locaux ; les modèles inscrits ne sont pas pris en charge." }
    cred: { en: "Local endpoints don't support authentication, so no key is needed.", fr: "Les points de terminaison locaux ne prennent pas en charge l'authentification : aucune clé n'est nécessaire." }
references:
  - title: Deploy machine learning models to online endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-online-endpoints
  - title: Online endpoints for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-online
