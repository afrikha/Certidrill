id: ai300-2a-dist-data-parallel-facts
objective: "2.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware plans to speed up the training of an image classification model in Azure Machine Learning by using distributed data parallelism on a compute cluster of four GPU nodes.

    Which two statements about this approach are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit d'accélérer l'entraînement d'un modèle de classification d'images dans Azure Machine Learning en utilisant le parallélisme des données distribué sur un cluster de calcul de quatre nœuds GPU.

    Quelles sont les deux affirmations vraies sur cette approche ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Each node holds a full copy of the model, so the model must fit on each node.", fr: "Chaque nœud détient une copie complète du modèle : le modèle doit tenir sur chaque nœud." } }
    - { id: b, text: { en: "Each node processes the entire training dataset in every epoch.", fr: "Chaque nœud traite l'intégralité du jeu d'entraînement à chaque époque." } }
    - { id: c, text: { en: "The worker nodes synchronize the parameters or gradients at the end of each batch computation.", fr: "Les nœuds workers synchronisent les paramètres ou les gradients à la fin du calcul de chaque lot." } }
    - { id: d, text: { en: "It's more complex to implement than model parallelism.", fr: "Il est plus complexe à mettre en œuvre que le parallélisme des modèles." } }
    - { id: e, text: { en: "Each node runs a different part of the model on the same data.", fr: "Chaque nœud exécute une partie différente du modèle sur les mêmes données." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      In data parallelism, the data is divided into partitions, one per node, and each node runs a copy of the whole model on its own subset. The nodes must synchronize parameters or gradients at the end of each batch computation so that they train a consistent model.
    fr: |
      Dans le parallélisme des données, les données sont divisées en partitions, une par nœud, et chaque nœud exécute une copie du modèle entier sur son propre sous-ensemble. Les nœuds doivent synchroniser les paramètres ou les gradients à la fin du calcul de chaque lot pour entraîner un modèle cohérent.
  options:
    b:
      en: |
        Each node works on its own partition of the data, not on the whole dataset.
      fr: |
        Chaque nœud travaille sur sa propre partition des données, pas sur le jeu complet.
    d:
      en: |
        Data parallelism is the easier of the two approaches and is sufficient for most use cases.
      fr: |
        Le parallélisme des données est la plus simple des deux approches et suffit dans la plupart des cas.
    e:
      en: |
        Splitting the model into parts that run on the same data describes model parallelism.
      fr: |
        Découper le modèle en parties qui s'exécutent sur les mêmes données décrit le parallélisme des modèles.
references:
  - title: Distributed training with Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-distributed-training
