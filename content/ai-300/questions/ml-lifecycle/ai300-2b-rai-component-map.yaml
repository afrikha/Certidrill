id: ai300-2b-rai-component-map
objective: "2.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace that contains a registered loan approval model. You are generating a Responsible AI dashboard for it.

    Which dashboard component should you use for each requirement? To answer, drag the appropriate components to the correct requirements. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning qui contient un modèle inscrit d'approbation de prêts. Vous générez un tableau de bord Responsible AI pour ce modèle.

    Quel composant du tableau de bord devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les composants appropriés vers les exigences correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: err, text: { en: "Error analysis", fr: "Analyse des erreurs (Error analysis)" } }
    - { id: data, text: { en: "Data analysis", fr: "Analyse des données (Data analysis)" } }
    - { id: causal, text: { en: "Causal analysis", fr: "Analyse causale (Causal analysis)" } }
    - { id: cf, text: { en: "Counterfactual what-if", fr: "Simulation contrefactuelle (Counterfactual what-if)" } }
    - { id: interp, text: { en: "Model interpretability", fr: "Interprétabilité du modèle (Model interpretability)" } }
    - { id: fair, text: { en: "Fairness assessment", fr: "Évaluation de l'équité (Fairness assessment)" } }
  targets:
    - { id: t1, text: { en: "Explain which features drove the rejection of application 1042", fr: "Expliquer quelles caractéristiques ont conduit au refus de la demande 1042" } }
    - { id: t2, text: { en: "Tell a rejected applicant the smallest change that would lead to an approval", fr: "Indiquer à un demandeur refusé la plus petite modification qui conduirait à une approbation" } }
    - { id: t3, text: { en: "Estimate from historical data how a lower interest rate would change repayment", fr: "Estimer à partir de données historiques comment un taux d'intérêt plus bas modifierait le remboursement" } }
    - { id: t4, text: { en: "Assess how the predictions affect groups defined by age and gender", fr: "Évaluer l'effet des prédictions sur les groupes définis par l'âge et le genre" } }
answer:
  mapping: { t1: interp, t2: cf, t3: causal, t4: fair }
explanation:
  correct:
    en: |
      Model interpretability provides local explanations of individual predictions. Counterfactual what-if finds minimal changes to a data point that alter the prediction. Causal analysis estimates how a real-world outcome changes after an intervention, using historical data. Fairness assessment evaluates how predictions affect groups defined by sensitive attributes.
    fr: |
      L'interprétabilité du modèle fournit des explications locales des prédictions individuelles. La simulation contrefactuelle trouve les modifications minimales d'un point de données qui changent la prédiction. L'analyse causale estime, à partir de données historiques, comment un résultat réel change après une intervention. L'évaluation de l'équité mesure l'effet des prédictions sur des groupes définis par des attributs sensibles.
  options:
    err: { en: "Error analysis finds cohorts with a high error rate; it doesn't explain one prediction or estimate causal effects.", fr: "L'analyse des erreurs trouve les cohortes dont le taux d'erreur est élevé ; elle n'explique pas une prédiction et n'estime pas d'effets causaux." }
    data: { en: "Data analysis explores the dataset for over- and underrepresentation.", fr: "L'analyse des données explore le jeu de données pour détecter la surreprésentation et la sous-représentation." }
references:
  - title: Assess AI systems by using the Responsible AI dashboard
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai-dashboard
