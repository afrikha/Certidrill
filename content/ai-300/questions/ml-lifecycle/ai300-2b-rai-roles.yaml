id: ai300-2b-rai-roles
objective: "2.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-woodgrove** that contains registered models with Responsible AI dashboards. The workspace also contains compute instances for interactive analysis.

    A group of model risk reviewers must open the dashboards and use the features that require a connected compute instance, which includes starting a compute instance. The solution must follow the principle of least privilege.

    Which two roles should you assign to the group at the workspace scope? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-woodgrove** qui contient des modèles inscrits associés à des tableaux de bord Responsible AI. L'espace de travail contient aussi des instances de calcul pour l'analyse interactive.

    Un groupe de réviseurs des risques liés aux modèles doit ouvrir les tableaux de bord et utiliser les fonctionnalités qui nécessitent une instance de calcul connectée, ce qui comprend le démarrage d'une instance de calcul. La solution doit respecter le principe du moindre privilège.

    Quels sont les deux rôles à attribuer au groupe dans l'étendue de l'espace de travail ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: AzureML Compute Operator }
    - { id: b, text: AzureML Data Scientist }
    - { id: c, text: Reader }
    - { id: d, text: Contributor }
    - { id: e, text: Owner }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Viewing a dashboard requires permission to view the models, and its interactive features require permission to start compute instances. Microsoft recommends combining Reader, to view assets, with AzureML Compute Operator, to manage compute, for least privilege.
    fr: |
      Consulter un tableau de bord nécessite l'autorisation d'afficher les modèles, et ses fonctionnalités interactives nécessitent l'autorisation de démarrer des instances de calcul. Microsoft recommande de combiner Reader, pour afficher les actifs, et AzureML Compute Operator, pour gérer le calcul, afin de respecter le moindre privilège.
  options:
    d: { en: "Contributor can start compute instances, but it also lets reviewers change every resource in the workspace.", fr: "Contributor permet de démarrer des instances de calcul, mais aussi de modifier toutes les ressources de l'espace de travail." }
    b: { en: "AzureML Data Scientist grants rights to submit jobs and manage assets, more than reviewers need.", fr: "AzureML Data Scientist accorde le droit de soumettre des travaux et de gérer des actifs, plus que ce dont les réviseurs ont besoin." }
    e: { en: "Owner grants full control, including access management.", fr: "Owner accorde un contrôle total, y compris la gestion des accès." }
references:
  - title: Use the Responsible AI dashboard in Azure Machine Learning studio
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-responsible-ai-dashboard
