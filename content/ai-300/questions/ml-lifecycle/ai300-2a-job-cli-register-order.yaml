id: ai300-2a-job-cli-register-order
objective: "2.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace that contains a compute cluster named **cpu-cluster**. A training script in `./src/train.py` logs an MLflow model named `model`.

    You need to run the script by using the Azure CLI and register the resulting model as an MLflow model in the workspace.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning qui contient un cluster de calcul nommé **cpu-cluster**. Un script d'entraînement dans `./src/train.py` enregistre un modèle MLflow nommé `model`.

    Vous devez exécuter le script avec Azure CLI et inscrire le modèle obtenu en tant que modèle MLflow dans l'espace de travail.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: yaml, text: { en: "Write a command job YAML file that references `./src`, a curated environment and `azureml:cpu-cluster`.", fr: "Écrire un fichier YAML de travail de commande qui référence `./src`, un environnement organisé et `azureml:cpu-cluster`." } }
    - { id: create, text: { en: "Run `az ml job create --file job.yml`.", fr: "Exécuter `az ml job create --file job.yml`." } }
    - { id: stream, text: { en: "Run `az ml job stream` and wait until the job completes.", fr: "Exécuter `az ml job stream` et attendre la fin du travail." } }
    - { id: register, text: { en: "Register an `mlflow_model` from `azureml://jobs/<job-name>/outputs/artifacts/paths/model/`.", fr: "Inscrire un `mlflow_model` à partir de `azureml://jobs/<job-name>/outputs/artifacts/paths/model/`." } }
    - { id: compute, text: { en: "Run `az ml compute create` to create cpu-cluster.", fr: "Exécuter `az ml compute create` pour créer cpu-cluster." } }
    - { id: endpoint, text: { en: "Create a managed online endpoint for the model.", fr: "Créer un point de terminaison en ligne managé pour le modèle." } }
answer:
  sequence: [ yaml, create, stream, register ]
explanation:
  correct:
    en: |
      You describe the job in YAML, submit it with `az ml job create`, and wait for it to finish. The model can be registered only after the job completes, from the job output path `azureml://jobs/<job-name>/outputs/artifacts/paths/model/` with the type `mlflow_model`.
    fr: |
      Vous décrivez le travail en YAML, le soumettez avec `az ml job create` et attendez sa fin. Le modèle ne peut être inscrit qu'une fois le travail terminé, à partir du chemin de sortie du travail `azureml://jobs/<job-name>/outputs/artifacts/paths/model/` avec le type `mlflow_model`.
  options:
    compute: { en: "cpu-cluster already exists.", fr: "cpu-cluster existe déjà." }
    endpoint: { en: "Deployment comes after registration and isn't required here.", fr: "Le déploiement vient après l'inscription et n'est pas demandé ici." }
references:
  - title: Train models with Azure Machine Learning CLI, SDK, and REST API
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-train-model
