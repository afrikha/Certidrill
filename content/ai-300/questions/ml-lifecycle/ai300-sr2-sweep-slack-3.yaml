id: ai300-sr2-sweep-slack-3
objective: "2.1.4"
type: series_yesno
series: ai300-sr2-sweep-slack
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You set a bandit policy with a slack factor of 0.1 on the sweep job.
  fr: Vous définissez une stratégie bandit avec un facteur de marge de 0,1 sur le travail de balayage.
body:
  solution:
    en: |
      You add the following line before the sweep job is submitted:

      `sweep_job.early_termination = BanditPolicy(slack_factor=0.1, delay_evaluation=5, evaluation_interval=1)`
    fr: |
      Vous ajoutez la ligne suivante avant l'envoi du travail de balayage :

      `sweep_job.early_termination = BanditPolicy(slack_factor=0.1, delay_evaluation=5, evaluation_interval=1)`
answer: { value: true }
explanation:
  correct:
    en: A bandit policy ends a trial when its primary metric falls outside the allowed slack from the best trial; `slack_factor` expresses that slack as a ratio, while `slack_amount` would express it as an absolute value. `evaluation_interval=1` applies the policy at every interval, and `delay_evaluation=5` makes the first evaluation happen at interval 5.
    fr: "Une stratégie bandit arrête un essai quand sa métrique principale sort de la marge autorisée par rapport au meilleur essai ; `slack_factor` exprime cette marge sous forme de ratio, alors que `slack_amount` l'exprimerait en valeur absolue. `evaluation_interval=1` applique la stratégie à chaque intervalle, et `delay_evaluation=5` fait commencer l'évaluation à l'intervalle 5."
references:
  - title: Hyperparameter tuning a model (v2) - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-tune-hyperparameters
