id: ai300-2a-dist-env-vars-statements
objective: "2.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You submit the following distributed command job in Azure Machine Learning to a compute cluster whose nodes have four GPUs each:

    ```yaml
    distribution:
      type: pytorch
      process_count_per_instance: 4
    resources:
      instance_count: 2
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous soumettez le travail de commande distribué suivant dans Azure Machine Learning à un cluster de calcul dont les nœuds ont chacun quatre GPU :

    ```yaml
    distribution:
      type: pytorch
      process_count_per_instance: 4
    resources:
      instance_count: 2
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Azure Machine Learning sets the NODE_RANK environment variable on each of the two nodes.
        fr: |
          Azure Machine Learning définit la variable d'environnement NODE_RANK sur chacun des deux nœuds.
    - id: s2
      text:
        en: |
          The WORLD_SIZE environment variable is 2 in every process.
        fr: |
          La variable d'environnement WORLD_SIZE vaut 2 dans chaque processus.
    - id: s3
      text:
        en: |
          If you remove `process_count_per_instance`, Azure Machine Learning still starts one process per GPU.
        fr: |
          Si vous supprimez `process_count_per_instance`, Azure Machine Learning démarre toujours un processus par GPU.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Azure Machine Learning sets MASTER_ADDR, MASTER_PORT, WORLD_SIZE and NODE_RANK on each node, and RANK and LOCAL_RANK per process. WORLD_SIZE is the total number of processes, 2 nodes × 4 = 8. Without `process_count_per_instance`, Azure Machine Learning launches one process per node by default.
    fr: |
      Azure Machine Learning définit MASTER_ADDR, MASTER_PORT, WORLD_SIZE et NODE_RANK sur chaque nœud, ainsi que RANK et LOCAL_RANK pour chaque processus. WORLD_SIZE est le nombre total de processus, 2 nœuds × 4 = 8. Sans `process_count_per_instance`, Azure Machine Learning lance par défaut un seul processus par nœud.
references:
  - title: Distributed GPU training guide (SDK v2)
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-train-distributed-gpu
