id: ai300-2c-404-zero-traffic
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an Azure Machine Learning workspace. You run the following commands, and both complete successfully. The provisioning state of the endpoint and of the deployment is **Succeeded**.

    ```bash
    az ml online-endpoint create --name ep-ship --file endpoint.yml
    az ml online-deployment create --name blue --endpoint-name ep-ship --file blue.yml
    ```

    A client application then posts a valid request with a valid key to the scoring URI of **ep-ship**. Every request returns HTTP status code 404.

    What should you do to resolve the issue?
  fr: |
    Tailspin dispose d'un espace de travail Azure Machine Learning. Vous exécutez les commandes suivantes, qui se terminent toutes deux correctement. L'état d'approvisionnement du point de terminaison et du déploiement est **Succeeded**.

    ```bash
    az ml online-endpoint create --name ep-ship --file endpoint.yml
    az ml online-deployment create --name blue --endpoint-name ep-ship --file blue.yml
    ```

    Une application cliente envoie ensuite une requête valide, avec une clé valide, à l'URI de scoring de **ep-ship**. Chaque requête renvoie le code d'état HTTP 404.

    Que devez-vous faire pour résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Run `az ml online-endpoint update --name ep-ship --traffic \"blue=100\"`.", fr: "Exécuter `az ml online-endpoint update --name ep-ship --traffic \"blue=100\"`." } }
    - { id: b, text: { en: "Regenerate the endpoint keys and give the new primary key to the client.", fr: "Régénérer les clés du point de terminaison et donner la nouvelle clé primaire au client." } }
    - { id: c, text: { en: "Increase `request_timeout_ms` in the request settings of blue.", fr: "Augmenter `request_timeout_ms` dans les paramètres de requête de blue." } }
    - { id: d, text: { en: "Run `az ml online-deployment update --name blue --endpoint-name ep-ship --set instance_count=3`.", fr: "Exécuter `az ml online-deployment update --name blue --endpoint-name ep-ship --set instance_count=3`." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The deployment was created without `--all-traffic`, so it receives 0 percent of the traffic. A managed online endpoint returns 404 when it has no deployment with a positive traffic weight; allocating 100 percent to blue fixes it.
    fr: |
      Le déploiement a été créé sans `--all-traffic` : il reçoit donc 0 % du trafic. Un point de terminaison en ligne managé renvoie 404 quand aucun de ses déploiements n'a un poids de trafic positif ; attribuer 100 % à blue résout le problème.
  options:
    b: { en: "A missing, wrong or expired key or token returns 401, not 404.", fr: "Une clé ou un jeton manquant, incorrect ou expiré renvoie 401, pas 404." }
    c: { en: "A request that exceeds request_timeout_ms returns 408.", fr: "Une requête qui dépasse request_timeout_ms renvoie 408." }
    d: { en: "More instances help with 429 (too many pending requests), but the endpoint still routes no traffic to blue.", fr: "Davantage d'instances aident en cas de 429 (trop de requêtes en attente), mais le point de terminaison n'envoie toujours aucun trafic vers blue." }
references:
  - title: Troubleshoot online endpoint deployment and scoring
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-troubleshoot-online-endpoints
  - title: Perform safe rollout of new deployments for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
