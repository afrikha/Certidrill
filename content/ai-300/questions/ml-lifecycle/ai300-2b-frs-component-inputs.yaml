id: ai300-2b-frs-component-inputs
objective: "2.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning project workspace that uses a managed feature store. The first step of your training pipeline is the built-in feature retrieval component, and you pass it the folder that contains `feature_retrieval_spec.yaml`.

    You need the component to produce training data by joining the feature values to your labeled events with a point-in-time join.

    Which two other values must you provide to the component? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail de projet Azure Machine Learning qui utilise un magasin de caractéristiques managé. La première étape de votre pipeline d'entraînement est le composant intégré de récupération de caractéristiques, auquel vous transmettez le dossier qui contient `feature_retrieval_spec.yaml`.

    Le composant doit produire les données d'entraînement en joignant les valeurs des caractéristiques à vos événements étiquetés par une jointure à un instant donné (point-in-time join).

    Quelles sont les deux autres valeurs à fournir au composant ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The signature of the model that will be trained", fr: "La signature du modèle qui sera entraîné" } }
    - { id: b, text: { en: "The observation data that contains the labeled events", fr: "Les données d'observation qui contiennent les événements étiquetés" } }
    - { id: c, text: { en: "The materialization schedule of each feature set", fr: "La planification de matérialisation de chaque ensemble de caractéristiques" } }
    - { id: d, text: { en: "The connection to the online store of the feature store", fr: "La connexion au magasin en ligne du magasin de caractéristiques" } }
    - { id: e, text: { en: "The name of the timestamp column of the observation data", fr: "Le nom de la colonne d'horodatage des données d'observation" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      The component joins the features listed in the specification to the observation data. The point-in-time join needs the timestamp column of the observation data, so that each event receives the feature values that were valid at that time. The component runs this as a Spark job and outputs the training data in parquet format.
    fr: |
      Le composant joint les caractéristiques listées dans la spécification aux données d'observation. La jointure à un instant donné a besoin de la colonne d'horodatage des données d'observation, afin que chaque événement reçoive les valeurs de caractéristiques valides à ce moment-là. Le composant exécute cette opération sous forme de travail Spark et produit les données d'entraînement au format parquet.
  options:
    a: { en: "The model doesn't exist yet at this step, and the component doesn't use a signature.", fr: "Le modèle n'existe pas encore à cette étape, et le composant n'utilise pas de signature." }
    d: { en: "The online store serves features for real-time inference; offline retrieval for training doesn't need it as an input.", fr: "Le magasin en ligne sert les caractéristiques pour l'inférence en temps réel ; la récupération hors connexion pour l'entraînement n'en a pas besoin en entrée." }
    c: { en: "Materialization is configured on the feature sets, not passed to the retrieval component.", fr: "La matérialisation se configure sur les ensembles de caractéristiques ; elle n'est pas transmise au composant de récupération." }
references:
  - title: Feature retrieval specification and usage in training and inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/feature-retrieval-concepts
