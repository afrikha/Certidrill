id: ai300-2a-nb-to-job-order
objective: "2.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A data scientist developed a training procedure in a notebook named `train-explore.ipynb` in Azure Machine Learning studio. The notebook reads a hard-coded file path. The workspace has a compute cluster named **cpu-cluster**.

    You need the training to run as a repeatable command job on cpu-cluster with the data asset passed as an input.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une data scientist a mis au point une procédure d'entraînement dans un notebook nommé `train-explore.ipynb` dans Azure Machine Learning studio. Le notebook lit un chemin de fichier codé en dur. L'espace de travail dispose d'un cluster de calcul nommé **cpu-cluster**.

    L'entraînement doit s'exécuter dans un travail de commande reproductible sur cpu-cluster, avec la ressource de données passée en entrée.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: export, text: { en: "Export the notebook as a Python file by using **Export As**.", fr: "Exporter le notebook sous forme de fichier Python avec **Export As**." } }
    - { id: args, text: { en: "Save the file as `./src/train.py` and replace the hard-coded path with a command-line argument.", fr: "Enregistrer le fichier sous `./src/train.py` et remplacer le chemin codé en dur par un argument de ligne de commande." } }
    - { id: define, text: { en: "Define a command job with `code=\"./src\"`, an environment, an input bound to the argument, and `compute=\"cpu-cluster\"`.", fr: "Définir un travail de commande avec `code=\"./src\"`, un environnement, une entrée liée à l'argument et `compute=\"cpu-cluster\"`." } }
    - { id: submit, text: { en: "Submit the job by using `ml_client.jobs.create_or_update()`.", fr: "Soumettre le travail avec `ml_client.jobs.create_or_update()`." } }
    - { id: checkpoint, text: { en: "Create a named checkpoint of the notebook.", fr: "Créer un point de contrôle nommé du notebook." } }
    - { id: jupyter, text: { en: "Open the notebook in JupyterLab on the compute instance.", fr: "Ouvrir le notebook dans JupyterLab sur l'instance de calcul." } }
answer:
  sequence: [ export, args, define, submit ]
explanation:
  correct:
    en: |
      A notebook depends on one person's compute instance and on cell order, so repeatable training runs as a script in a job. You export the notebook as Python, turn the hard-coded path into an argument so that the job can pass `${{inputs.<name>}}`, define the command job that uploads `./src` and targets cpu-cluster, and then submit it.
    fr: |
      Un notebook dépend de l'instance de calcul d'une personne et de l'ordre des cellules : un entraînement reproductible s'exécute sous forme de script dans un travail. Vous exportez le notebook en Python, transformez le chemin codé en dur en argument pour que le travail puisse passer `${{inputs.<name>}}`, définissez le travail de commande qui charge `./src` et cible cpu-cluster, puis vous le soumettez.
  options:
    checkpoint: { en: "A checkpoint saves a version of the notebook; it doesn't help the job run.", fr: "Un point de contrôle enregistre une version du notebook ; il n'aide pas le travail à s'exécuter." }
    jupyter: { en: "JupyterLab is another editor for the same notebook; the job runs a script, not the notebook.", fr: "JupyterLab est un autre éditeur du même notebook ; le travail exécute un script, pas le notebook." }
references:
  - title: Run Jupyter notebooks in your workspace
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-run-jupyter-notebooks
  - title: Train models with Azure Machine Learning CLI, SDK, and REST API
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-train-model
