id: ai300-2a-automl-settings-mapping
objective: "2.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are configuring an AutoML classification job by using the Python SDK v2. You have four requirements.

    Which setting should you use for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez un travail AutoML de classification avec le SDK Python v2. Vous avez quatre exigences.

    Quel paramètre devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: blocked, text: blocked_training_algorithms }
    - { id: allowed, text: allowed_training_algorithms }
    - { id: explain, text: enable_model_explainability }
    - { id: onnx, text: enable_onnx_compatible_models }
    - { id: valdata, text: validation_data }
    - { id: ncv, text: n_cross_validations }
  targets:
    - id: t1
      text: { en: "Exclude only the K Nearest Neighbors algorithm and keep every other algorithm", fr: "Exclure uniquement l'algorithme K Nearest Neighbors et conserver tous les autres algorithmes" }
    - id: t2
      text: { en: "Show which features drive the predictions of the best model", fr: "Montrer quelles caractéristiques influencent les prédictions du meilleur modèle" }
    - id: t3
      text: { en: "Produce models that can be exported in the ONNX format", fr: "Produire des modèles qui peuvent être exportés au format ONNX" }
    - id: t4
      text: { en: "Score the candidate models on a separate MLTable that you provide", fr: "Évaluer les modèles candidats sur une MLTable distincte que vous fournissez" }
answer:
  mapping: { t1: blocked, t2: explain, t3: onnx, t4: valdata }
explanation:
  correct:
    en: "`blocked_training_algorithms` removes listed algorithms from the search and keeps the rest. `enable_model_explainability` adds an explanation run for the best model. `enable_onnx_compatible_models` (in `set_training()`) restricts the search to ONNX-compatible models. `validation_data` supplies your own validation MLTable instead of the default split or cross-validation."
    fr: "`blocked_training_algorithms` retire de la recherche les algorithmes listés et garde les autres. `enable_model_explainability` ajoute une exécution d'explication pour le meilleur modèle. `enable_onnx_compatible_models` (dans `set_training()`) limite la recherche aux modèles compatibles ONNX. `validation_data` fournit votre propre MLTable de validation au lieu du fractionnement par défaut ou de la validation croisée."
  options:
    allowed:
      en: "`allowed_training_algorithms` lists the only algorithms to try, the opposite of excluding one."
      fr: "`allowed_training_algorithms` liste les seuls algorithmes à essayer, l'inverse de l'exclusion d'un algorithme."
    ncv:
      en: "`n_cross_validations` splits the training data into folds; it doesn't use a separate dataset."
      fr: "`n_cross_validations` découpe les données d'entraînement en plis ; il n'utilise pas de jeu de données distinct."
references:
  - title: Set up AutoML training for tabular data with the Azure Machine Learning CLI and Python SDK
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-auto-train
