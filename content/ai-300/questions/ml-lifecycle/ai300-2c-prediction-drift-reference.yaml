id: ai300-2c-prediction-drift-reference
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a churn classification model deployed to a managed online endpoint with data collection enabled for `model_inputs` and `model_outputs`. A registered data asset named **churn-validation** contains the predictions that the model produced on the validation dataset before release.

    You need a monitoring signal that alerts when the distribution of the predicted classes in production moves away from the predictions on the validation dataset.

    Which signal configuration should you use?
  fr: |
    Fabrikam dispose d'un modèle de classification d'attrition déployé sur un point de terminaison en ligne managé, avec la collecte des données activée pour `model_inputs` et `model_outputs`. Une ressource de données inscrite nommée **churn-validation** contient les prédictions produites par le modèle sur le jeu de données de validation avant sa mise en production.

    Vous avez besoin d'un signal de surveillance qui génère une alerte quand la distribution des classes prédites en production s'éloigne de celle des prédictions sur le jeu de validation.

    Quelle configuration de signal devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "`type: data_drift` with churn-validation as reference data and `data_context: training`", fr: "`type: data_drift` avec churn-validation comme données de référence et `data_context: training`" } }
    - { id: b, text: { en: "`type: model_performance` with churn-validation as reference data and `data_context: ground_truth`", fr: "`type: model_performance` avec churn-validation comme données de référence et `data_context: ground_truth`" } }
    - { id: c, text: { en: "`type: prediction_drift` with churn-validation as reference data and `data_context: validation`", fr: "`type: prediction_drift` avec churn-validation comme données de référence et `data_context: validation`" } }
    - { id: d, text: { en: "`type: feature_attribution_drift` with churn-validation as reference data and `data_context: training`", fr: "`type: feature_attribution_drift` avec churn-validation comme données de référence et `data_context: training`" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Prediction drift compares the distribution of the model outputs in production with reference data, which can be validation data or recent past production data. Declaring the validation predictions with `data_context: validation` gives the comparison the requirement asks for.
    fr: |
      La dérive des prédictions compare la distribution des sorties du modèle en production avec des données de référence, qui peuvent être des données de validation ou des données de production récentes. Déclarer les prédictions de validation avec `data_context: validation` fournit la comparaison demandée.
  options:
    a: { en: "Data drift compares model inputs, not predicted classes.", fr: "La dérive des données compare les entrées du modèle, pas les classes prédites." }
    b: { en: "Model performance compares predictions with ground truth labels; churn-validation contains predictions, not actual outcomes.", fr: "Les performances du modèle comparent les prédictions aux étiquettes de vérité terrain ; churn-validation contient des prédictions, pas des résultats réels." }
    d: { en: "Feature attribution drift compares feature importance with the training data; it doesn't track the distribution of predictions.", fr: "La dérive de l'attribution des caractéristiques compare l'importance des caractéristiques avec les données d'entraînement ; elle ne suit pas la distribution des prédictions." }
references:
  - title: Model monitoring in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-model-monitoring
  - title: Monitor model performance in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance
