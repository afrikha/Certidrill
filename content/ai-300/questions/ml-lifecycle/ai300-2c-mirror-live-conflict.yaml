id: ai300-2c-mirror-live-conflict
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a managed online endpoint named **ep-churn** with two deployments, **blue** and **green**. A colleague ran the following command, which succeeded.

    ```bash
    az ml online-endpoint update --name ep-churn --traffic "blue=80 green=20"
    ```

    You now want green to also process a copy of 20 percent of the requests. You run the following command by using a current version of the Azure CLI ml extension, and the command fails.

    ```bash
    az ml online-endpoint update --name ep-churn --mirror-traffic "green=20"
    ```

    What is the cause of the failure?
  fr: |
    Contoso dispose d'un point de terminaison en ligne managé nommé **ep-churn** avec deux déploiements, **blue** et **green**. Un collègue a exécuté la commande suivante, qui a réussi.

    ```bash
    az ml online-endpoint update --name ep-churn --traffic "blue=80 green=20"
    ```

    Vous voulez maintenant que green traite aussi une copie de 20 % des requêtes. Vous exécutez la commande suivante avec une version actuelle de l'extension ml d'Azure CLI, et la commande échoue.

    ```bash
    az ml online-endpoint update --name ep-churn --mirror-traffic "green=20"
    ```

    Quelle est la cause de l'échec ?
body:
  options:
    - { id: a, text: { en: "The mirrored percentage is higher than the maximum allowed for an endpoint.", fr: "Le pourcentage mis en miroir dépasse le maximum autorisé pour un point de terminaison." } }
    - { id: b, text: { en: "green already receives live traffic, and a deployment can't receive both live and mirrored traffic.", fr: "green reçoit déjà du trafic réel, et un déploiement ne peut pas recevoir à la fois du trafic réel et du trafic en miroir." } }
    - { id: c, text: { en: "The live and mirrored percentages of the endpoint must add up to exactly 100.", fr: "Les pourcentages de trafic réel et en miroir du point de terminaison doivent totaliser exactement 100." } }
    - { id: d, text: { en: "Mirrored traffic is supported only on Kubernetes online endpoints.", fr: "Le trafic en miroir n'est pris en charge que sur les points de terminaison en ligne Kubernetes." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A deployment receives either live traffic or mirrored traffic, not both. green has 20 percent of the live traffic, so it can't also be the mirror target; set its live traffic to 0 first, or keep it on live traffic only.
    fr: |
      Un déploiement reçoit soit du trafic réel, soit du trafic en miroir, mais pas les deux. green a 20 % du trafic réel : il ne peut donc pas être aussi la cible du miroir. Ramenez d'abord son trafic réel à 0, ou conservez-le uniquement en trafic réel.
  options:
    a: { en: "Up to 50 percent of the traffic can be mirrored; 20 percent is within the limit.", fr: "Jusqu'à 50 % du trafic peut être mis en miroir ; 20 % respecte la limite." }
    c: { en: "Only the live traffic percentages must total 100 (or 0); mirrored traffic is an additional copy.", fr: "Seuls les pourcentages de trafic réel doivent totaliser 100 (ou 0) ; le trafic en miroir est une copie supplémentaire." }
    d: { en: "It's the opposite: mirrored traffic is supported on managed online endpoints and not on Kubernetes online endpoints.", fr: "C'est l'inverse : le trafic en miroir est pris en charge sur les points de terminaison en ligne managés et pas sur les points de terminaison en ligne Kubernetes." }
references:
  - title: Perform safe rollout of new deployments for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
