id: ai300-2c-retrain-promotion-order
objective: "2.4.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank serves a credit model from a deployment named **blue** on the managed online endpoint **ep-credit**. An Event Grid subscription starts a retraining pipeline when the model monitor reports a threshold breach.

    You need to design what happens after the trigger. The retrained model must reach production without downtime and behind the same scoring URI, a small share of clients must use it first, and blue must remain available for an immediate rollback.

    Which four actions should be performed in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank sert un modèle de crédit à partir d'un déploiement nommé **blue** sur le point de terminaison en ligne managé **ep-credit**. Un abonnement Event Grid démarre un pipeline de réentraînement quand la surveillance du modèle signale un dépassement de seuil.

    Vous devez concevoir ce qui se passe après le déclenchement. Le modèle réentraîné doit atteindre la production sans interruption et derrière le même URI de scoring, une petite partie des clients doit l'utiliser en premier, et blue doit rester disponible pour une restauration immédiate.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: train, text: { en: "Train and evaluate a new model on recent data in the retraining pipeline.", fr: "Entraîner et évaluer un nouveau modèle sur des données récentes dans le pipeline de réentraînement." } }
    - { id: reg, text: { en: "Register the evaluated model as a new version.", fr: "Inscrire le modèle évalué en tant que nouvelle version." } }
    - { id: green, text: { en: "Create a deployment named green for the new version without allocating traffic to it.", fr: "Créer un déploiement nommé green pour la nouvelle version sans lui attribuer de trafic." } }
    - { id: canary, text: { en: "Set the traffic of ep-credit to blue=90 green=10.", fr: "Définir le trafic d'ep-credit à blue=90 green=10." } }
    - { id: inplace, text: { en: "Update blue in place so that it uses the new model version.", fr: "Mettre à jour blue sur place pour qu'il utilise la nouvelle version du modèle." } }
    - { id: newep, text: { en: "Create a new endpoint for the new version and give its scoring URI to the clients.", fr: "Créer un nouveau point de terminaison pour la nouvelle version et donner son URI de scoring aux clients." } }
    - { id: delete, text: { en: "Delete blue.", fr: "Supprimer blue." } }
answer:
  sequence: [ train, reg, green, canary ]
explanation:
  correct:
    en: |
      Retraining produces a candidate model that is evaluated and then registered as a new version. Deploying it as green with no traffic, under the same endpoint, adds it without downtime; a 90/10 split then exposes a small share of clients while blue keeps serving the rest and remains ready for `blue=100 green=0`.
    fr: |
      Le réentraînement produit un modèle candidat qui est évalué, puis inscrit en tant que nouvelle version. Le déployer en tant que green sans trafic, sous le même point de terminaison, l'ajoute sans interruption ; une répartition 90/10 expose ensuite une petite partie des clients tandis que blue continue de servir les autres et reste prêt pour `blue=100 green=0`.
  options:
    inplace: { en: "Updating blue replaces the current model for every client and removes the deployment you would roll back to.", fr: "Mettre à jour blue remplace le modèle actuel pour tous les clients et supprime le déploiement vers lequel vous reviendriez." }
    newep: { en: "A new endpoint changes the scoring URI, which the requirements forbid.", fr: "Un nouveau point de terminaison change l'URI de scoring, ce que les exigences interdisent." }
    delete: { en: "Deleting blue removes the immediate rollback.", fr: "Supprimer blue retire la restauration immédiate." }
references:
  - title: Monitor model performance in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance
  - title: Perform safe rollout of new deployments for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
