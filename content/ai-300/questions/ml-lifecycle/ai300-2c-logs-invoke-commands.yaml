id: ai300-2c-logs-invoke-commands
objective: "2.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Litware has a managed online endpoint named **ep-claims**. A deployment named **green** was just created; the endpoint still sends all its traffic to another deployment.

    You need to:

    - check whether the model and the code of green were downloaded successfully;
    - send a test request to green, whatever the traffic rules of the endpoint.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un point de terminaison en ligne managé nommé **ep-claims**. Un déploiement nommé **green** vient d'être créé ; le point de terminaison envoie toujours tout son trafic vers un autre déploiement.

    Vous devez :

    - vérifier si le modèle et le code de green ont été téléchargés correctement ;
    - envoyer une requête de test à green, quelles que soient les règles de trafic du point de terminaison.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az ml online-deployment [[cmd]] --name green --endpoint-name ep-claims [[flag]]

    az ml online-endpoint invoke --name ep-claims [[dep]] --request-file sample-request.json
  slots:
    - id: cmd
      options:
        - { id: logs, text: get-logs }
        - { id: show, text: show }
        - { id: list, text: list }
    - id: flag
      options:
        - { id: init, text: --container storage-initializer }
        - { id: lines, text: --lines 100 }
        - { id: local, text: --local }
    - id: dep
      options:
        - { id: depname, text: --deployment-name green }
        - { id: traffic, text: "--traffic \"green=100\"" }
        - { id: mirror, text: "--mirror-traffic \"green=10\"" }
answer:
  values: { cmd: logs, flag: init, dep: depname }
explanation:
  correct:
    en: |
      `get-logs` returns the container logs of a deployment; by default they come from the inference server, and `--container storage-initializer` returns the logs of the container that downloads the model and code. `az ml online-endpoint invoke` with `--deployment-name` sends the request directly to that deployment, bypassing the traffic rules.
    fr: |
      `get-logs` renvoie les journaux de conteneur d'un déploiement ; par défaut ils proviennent du serveur d'inférence, et `--container storage-initializer` renvoie les journaux du conteneur qui télécharge le modèle et le code. `az ml online-endpoint invoke` avec `--deployment-name` envoie la requête directement à ce déploiement, en contournant les règles de trafic.
  options:
    show: { en: "show returns the deployment's configuration and provisioning state, not its logs.", fr: "show renvoie la configuration et l'état d'approvisionnement du déploiement, pas ses journaux." }
    lines: { en: "--lines limits the number of lines, but the logs still come from the inference server container.", fr: "--lines limite le nombre de lignes, mais les journaux proviennent toujours du conteneur du serveur d'inférence." }
    traffic: { en: "Traffic is set with az ml online-endpoint update, and changing it would affect live clients.", fr: "Le trafic se définit avec az ml online-endpoint update, et le modifier affecterait les clients réels." }
    mirror: { en: "Mirroring is configured with az ml online-endpoint update; it copies live requests, it doesn't send a test request.", fr: "La mise en miroir se configure avec az ml online-endpoint update ; elle copie des requêtes réelles, elle n'envoie pas de requête de test." }
references:
  - title: Deploy machine learning models to online endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-online-endpoints
  - title: Troubleshoot online endpoint deployment and scoring
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-troubleshoot-online-endpoints
