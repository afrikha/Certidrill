id: ai300-2a-nb-state-statements
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A data scientist explores data in a notebook named `eda.ipynb` in Azure Machine Learning studio. Several cells have already run on a compute instance named **ci-raj**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un data scientist explore des données dans un notebook nommé `eda.ipynb` dans Azure Machine Learning studio. Plusieurs cellules se sont déjà exécutées sur une instance de calcul nommée **ci-raj**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If ci-raj is stopped, the data scientist can still edit the cells of the notebook.
        fr: |
          Si ci-raj est arrêtée, le data scientist peut toujours modifier les cellules du notebook.
    - id: s2
      text:
        en: |
          If the data scientist switches the notebook to another compute instance, the variables defined by the previous cells remain available.
        fr: |
          Si le data scientist bascule le notebook vers une autre instance de calcul, les variables définies par les cellules précédentes restent disponibles.
    - id: s3
      text:
        en: |
          The autosave that runs every 30 seconds also updates the checkpoint file of the notebook.
        fr: |
          L'enregistrement automatique qui s'exécute toutes les 30 secondes met aussi à jour le fichier de point de contrôle du notebook.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      You can edit a notebook without any compute; only running cells needs a compute instance. Switching compute, like changing the kernel or stopping the compute, resets the notebook state and all variables. Autosave updates only the .ipynb file; checkpoints are created with **File > Save and checkpoint** or from the **Checkpoints** menu.
    fr: |
      Vous pouvez modifier un notebook sans aucun calcul ; seule l'exécution des cellules demande une instance de calcul. Changer de calcul, comme changer de noyau ou arrêter le calcul, réinitialise l'état du notebook et toutes les variables. L'enregistrement automatique met à jour uniquement le fichier .ipynb ; les points de contrôle se créent avec **File > Save and checkpoint** ou depuis le menu **Checkpoints**.
references:
  - title: Run Jupyter notebooks in your workspace
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-run-jupyter-notebooks
