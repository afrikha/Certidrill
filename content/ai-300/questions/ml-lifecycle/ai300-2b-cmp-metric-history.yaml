id: ai300-2b-cmp-metric-history
objective: "2.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace. A training script logs the metric `loss` at each epoch by calling `mlflow.log_metric("loss", value, step=epoch)`.

    When you query the runs with `mlflow.search_runs`, the `metrics.loss` column contains a single value per run. You need to retrieve every logged value of `loss` for one run, to plot the training curve in a notebook.

    What should you use?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning. Un script d'entraînement journalise la métrique `loss` à chaque époque en appelant `mlflow.log_metric("loss", value, step=epoch)`.

    Quand vous interrogez les exécutions avec `mlflow.search_runs`, la colonne `metrics.loss` ne contient qu'une valeur par exécution. Vous devez récupérer toutes les valeurs journalisées de `loss` pour une exécution, afin de tracer la courbe d'entraînement dans un notebook.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: "mlflow.artifacts.download_artifacts(run_id=run_id, artifact_path=\"loss\")" }
    - { id: b, text: "MlflowClient().get_metric_history(run_id, \"loss\")" }
    - { id: c, text: "mlflow.search_runs(filter_string=\"metrics.loss > 0\", output_format=\"list\")" }
    - { id: d, text: "mlflow.get_run(run_id).data.metrics[\"loss\"]" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `search_runs` and `run.data.metrics` return only the last value of each metric. `MlflowClient.get_metric_history()` returns all the values logged for a metric, one per step, which is what a training curve needs.
    fr: |
      `search_runs` et `run.data.metrics` ne renvoient que la dernière valeur de chaque métrique. `MlflowClient.get_metric_history()` renvoie toutes les valeurs journalisées d'une métrique, une par étape, ce dont une courbe d'entraînement a besoin.
  options:
    d: { en: "`run.data.metrics` holds only the most recent value of each metric.", fr: "`run.data.metrics` ne contient que la valeur la plus récente de chaque métrique." }
    c: { en: "With the list format, each `Run` object still exposes only the last value of each metric.", fr: "Avec le format liste, chaque objet `Run` n'expose toujours que la dernière valeur de chaque métrique." }
    a: { en: "Metrics are not stored as artifacts, so there is no `loss` artifact to download.", fr: "Les métriques ne sont pas stockées en tant qu'artefacts : il n'existe aucun artefact `loss` à télécharger." }
references:
  - title: Query & compare experiments and runs with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-track-experiments-mlflow
  - title: Log metrics, parameters, and files with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-log-view-metrics
