id: ai300-2a-sweep-bandit-hotarea
objective: "2.1.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    You run a sweep job in Azure Machine Learning with the following settings:

    ```yaml
    objective:
      goal: maximize
      primary_metric: val_auc
    early_termination:
      type: bandit
      slack_factor: 0.25
      evaluation_interval: 1
      delay_evaluation: 5
    ```

    The following table shows the best `val_auc` value that each running trial has reported when the policy is evaluated at interval 6.

    Select the trial that the policy cancels at interval 6.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous exécutez un travail de balayage dans Azure Machine Learning avec les paramètres suivants :

    ```yaml
    objective:
      goal: maximize
      primary_metric: val_auc
    early_termination:
      type: bandit
      slack_factor: 0.25
      evaluation_interval: 1
      delay_evaluation: 5
    ```

    Le tableau suivant indique la meilleure valeur `val_auc` signalée par chaque essai en cours quand la stratégie est évaluée à l'intervalle 6.

    Sélectionnez l'essai que la stratégie annule à l'intervalle 6.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Trial canceled at interval 6", fr: "Essai annulé à l'intervalle 6" }
  grid:
    header: [{ en: "Trial", fr: "Essai" }, { en: "Best val_auc at interval 6", fr: "Meilleure val_auc à l'intervalle 6" }]
    rows:
      - [{ text: trial-01, area: t1 }, { text: "0.90" }]
      - [{ text: trial-02, area: t2 }, { text: "0.75" }]
      - [{ text: trial-03, area: t3 }, { text: "0.70" }]
      - [{ text: trial-04, area: t4 }, { text: "0.81" }]
answer:
  values: { p1: t3 }
explanation:
  correct:
    en: "With a goal to maximize, the bandit policy cancels trials whose best metric is less than best / (1 + slack_factor). The best trial reports 0.90, so the threshold is 0.90 / 1.25 = 0.72. Only trial-03 (0.70) is below it; trial-02 (0.75) stays within the slack."
    fr: "Avec un objectif de maximisation, la stratégie bandit annule les essais dont la meilleure métrique est inférieure à meilleur / (1 + slack_factor). Le meilleur essai signale 0,90 : le seuil est 0,90 / 1,25 = 0,72. Seul trial-03 (0,70) est en dessous ; trial-02 (0,75) reste dans la tolérance."
  options:
    t2: { en: "0.75 is above the 0.72 threshold.", fr: "0,75 est au-dessus du seuil de 0,72." }
    t1: { en: "trial-01 is the best trial and defines the threshold.", fr: "trial-01 est le meilleur essai et définit le seuil." }
references:
  - title: Hyperparameter tuning a model (v2)
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-tune-hyperparameters
