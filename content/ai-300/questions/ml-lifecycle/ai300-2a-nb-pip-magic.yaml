id: ai300-2a-nb-pip-magic
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data scientist runs a notebook in Azure Machine Learning studio on a compute instance that has several Jupyter kernels. The notebook uses the **Python 3.10 - SDK v2** kernel and needs the `lightgbm` package, which isn't installed in that kernel.

    You need to install the package so that the running kernel can import it.

    What should the data scientist run?
  fr: |
    Une data scientist exécute un notebook dans Azure Machine Learning studio sur une instance de calcul qui possède plusieurs noyaux Jupyter. Le notebook utilise le noyau **Python 3.10 - SDK v2** et a besoin du package `lightgbm`, qui n'est pas installé dans ce noyau.

    Vous devez installer le package pour que le noyau en cours d'exécution puisse l'importer.

    Que doit exécuter la data scientist ?
body:
  options:
    - { id: a, text: { en: "`!pip install lightgbm` in a notebook cell", fr: "`!pip install lightgbm` dans une cellule du notebook" } }
    - { id: b, text: { en: "`%pip install lightgbm` in a notebook cell", fr: "`%pip install lightgbm` dans une cellule du notebook" } }
    - { id: c, text: { en: "`az ml environment create` with a conda file that lists lightgbm", fr: "`az ml environment create` avec un fichier conda qui liste lightgbm" } }
    - { id: d, text: { en: "`pip install lightgbm` in a new terminal of the compute instance", fr: "`pip install lightgbm` dans un nouveau terminal de l'instance de calcul" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Because a compute instance has several kernels, Microsoft recommends the `%pip` or `%conda` magic functions, which install packages into the currently running kernel.
    fr: |
      Comme une instance de calcul possède plusieurs noyaux, Microsoft recommande les fonctions magiques `%pip` ou `%conda`, qui installent les packages dans le noyau en cours d'exécution.
  options:
    a:
      en: "`!pip` runs a shell command that isn't tied to the running kernel, so the package can land in another environment."
      fr: "`!pip` exécute une commande shell qui n'est pas liée au noyau en cours : le package peut être installé dans un autre environnement."
    c:
      en: |
        A registered environment is used by jobs and deployments; it doesn't change the kernel of the notebook.
      fr: |
        Un environnement inscrit est utilisé par les travaux et les déploiements ; il ne modifie pas le noyau du notebook.
    d:
      en: |
        The terminal installs into whichever Python environment is active in that shell, not necessarily the one of the notebook kernel.
      fr: |
        Le terminal installe dans l'environnement Python actif de ce shell, pas forcément celui du noyau du notebook.
references:
  - title: Run Jupyter notebooks in your workspace
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-run-jupyter-notebooks
