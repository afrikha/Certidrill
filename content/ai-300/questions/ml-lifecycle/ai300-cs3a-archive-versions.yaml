id: ai300-cs3a-archive-versions
objective: "2.2.4"
type: single
caseStudy: ai300-cs3a-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You need to meet model governance requirement 8 for fraud-model in mlw-claims-dev.

    What should you do?
  fr: |
    Vous devez respecter l'exigence 8 de gouvernance des modèles pour fraud-model dans mlw-claims-dev.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Run `az ml model archive --name fraud-model` once, without the `--version` parameter."
        fr: "Exécuter `az ml model archive --name fraud-model` une fois, sans le paramètre `--version`."
    - id: b
      text:
        en: "Run `az ml model update --name fraud-model --version <n> --set tags.stage=Archived` for versions 1 to 4."
        fr: "Exécuter `az ml model update --name fraud-model --version <n> --set tags.stage=Archived` pour les versions 1 à 4."
    - id: c
      text:
        en: "Run `az ml model archive --name fraud-model --version <n>` for versions 1 to 4."
        fr: "Exécuter `az ml model archive --name fraud-model --version <n>` pour les versions 1 à 4."
    - id: d
      text:
        en: "Register versions 5 to 7 under a new model name, and then run `az ml model archive --name fraud-model`."
        fr: "Inscrire les versions 5 à 7 sous un nouveau nom de modèle, puis exécuter `az ml model archive --name fraud-model`."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Archiving a model version hides it from list queries such as `az ml model list`, but an archived version can still be referenced and used, so pipelines that name a version explicitly keep working. Archiving versions 1 to 4 one by one leaves versions 5 to 7, and the versions registered later, visible.
    fr: |
      Archiver une version de modèle la masque des requêtes de liste comme `az ml model list`, mais une version archivée peut toujours être référencée et utilisée : les pipelines qui nomment explicitement une version continuent à fonctionner. Archiver les versions 1 à 4 une par une laisse visibles les versions 5 à 7 ainsi que les versions inscrites par la suite.
  options:
    a:
      en: |
        Without `--version`, the command archives every version of fraud-model, and a new version created under an archived model container is archived automatically.
      fr: |
        Sans `--version`, la commande archive toutes les versions de fraud-model, et une nouvelle version créée sous un conteneur de modèle archivé est archivée automatiquement.
    b:
      en: |
        Tags and the description are the only mutable properties of a model version, and a tag doesn't hide the version from the model lists.
      fr: |
        Les étiquettes et la description sont les seules propriétés modifiables d'une version de modèle, et une étiquette ne masque pas la version des listes de modèles.
    d:
      en: |
        Archiving the whole fraud-model container also hides versions 5 to 7 of fraud-model, and every version registered later under fraud-model would be archived automatically. Copying versions under a new name is also unnecessary effort.
      fr: |
        Archiver tout le conteneur fraud-model masque aussi les versions 5 à 7 de fraud-model, et chaque version inscrite par la suite sous fraud-model serait archivée automatiquement. Copier des versions sous un nouveau nom est en outre un effort inutile.
references:
  - title: Register and work with models
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
