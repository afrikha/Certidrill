id: ai300-2a-sweep-grid-discrete
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are creating a sweep job in Azure Machine Learning. The search space contains two hyperparameters:

    - `batch_size`: `choice` of 16, 32 or 64
    - `optimizer`: `choice` of adam or sgd

    Every combination of values must be evaluated exactly once, and the compute budget allows it.

    Which sampling algorithm should you use?
  fr: |
    Vous créez un travail de balayage dans Azure Machine Learning. L'espace de recherche contient deux hyperparamètres :

    - `batch_size` : `choice` parmi 16, 32 ou 64
    - `optimizer` : `choice` parmi adam ou sgd

    Chaque combinaison de valeurs doit être évaluée exactement une fois, et le budget de calcul le permet.

    Quel algorithme d'échantillonnage devez-vous utiliser ?
body:
  options:
    - { id: a, text: random }
    - { id: b, text: bayesian }
    - { id: c, text: grid }
    - { id: d, text: { en: "random with `rule: sobol`", fr: "random avec `rule: sobol`" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Grid sampling performs a simple grid search over all possible values and supports only `choice` parameters. Here it runs the 6 combinations (3 × 2), each once, which is affordable.
    fr: |
      L'échantillonnage par grille effectue une recherche simple sur toutes les valeurs possibles et ne prend en charge que les paramètres `choice`. Ici, il exécute les 6 combinaisons (3 × 2), chacune une fois, ce qui reste abordable.
  options:
    a:
      en: |
        Random sampling picks values at random, so it can repeat a combination or miss one.
      fr: |
        L'échantillonnage aléatoire choisit les valeurs au hasard : il peut répéter une combinaison ou en oublier une.
    b:
      en: |
        Bayesian sampling chooses each sample from earlier results; it doesn't guarantee that every combination is evaluated once.
      fr: |
        L'échantillonnage bayésien choisit chaque échantillon à partir des résultats précédents ; il ne garantit pas que chaque combinaison soit évaluée une fois.
    d:
      en: |
        Sobol is a quasi-random sequence for better coverage of the space; it isn't an exhaustive enumeration.
      fr: |
        Sobol est une séquence quasi aléatoire qui couvre mieux l'espace ; ce n'est pas une énumération exhaustive.
references:
  - title: Hyperparameter tuning a model (v2)
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-tune-hyperparameters
