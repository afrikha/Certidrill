id: ai300-cs3c-automl-forecast
objective: "2.1.2"
type: dropdown
caseStudy: ai300-cs3c-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You are writing an automated machine learning (AutoML) job with the Python SDK v2 to train the demand forecasting model.

    How should you complete the code to meet demand forecasting requirement 1? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez un travail de machine learning automatisé (AutoML) avec le SDK Python v2 pour entraîner le modèle de prévision de la demande.

    Comment devez-vous compléter le code pour respecter l'exigence 1 de prévision de la demande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    forecast_job = automl.[[task]](
        compute="cpu-cluster",
        experiment_name="store-demand",
        training_data=Input(type=AssetTypes.[[dtype]], path="azureml:store-sales-train@latest"),
        target_column_name="units_sold",
        primary_metric="normalized_root_mean_squared_error",
        n_cross_validations="auto",
    )
    forecast_job.set_forecast_settings(
        time_column_name="sale_date",
        [[horizon]]=14,
        [[series]]=["store_id", "product_id"],
    )
    ml_client.jobs.create_or_update(forecast_job)
  slots:
    - id: task
      options:
        - { id: regression, text: regression }
        - { id: forecasting, text: forecasting }
        - { id: classification, text: classification }
    - id: dtype
      options:
        - { id: urifile, text: URI_FILE }
        - { id: urifolder, text: URI_FOLDER }
        - { id: mltable, text: MLTABLE }
    - id: horizon
      options:
        - { id: lags, text: target_lags }
        - { id: window, text: target_rolling_window_size }
        - { id: horizon, text: forecast_horizon }
        - { id: cvstep, text: cv_step_size }
    - id: series
      options:
        - { id: ids, text: time_series_id_column_names }
        - { id: unknown, text: features_unknown_at_forecast_time }
        - { id: holidays, text: country_or_region_for_holidays }
answer:
  values: { task: forecasting, dtype: mltable, horizon: horizon, series: ids }
explanation:
  correct:
    en: "`automl.forecasting()` creates a time-series forecasting job, and AutoML reads its training data from an MLTable, which store-sales-train is. `forecast_horizon=14` sets how many periods ahead to predict, and `time_series_id_column_names` declares the columns that identify each series (store and product) instead of letting AutoML detect them."
    fr: "`automl.forecasting()` crée un travail de prévision de séries chronologiques, et AutoML lit ses données d'entraînement depuis une MLTable, ce qu'est store-sales-train. `forecast_horizon=14` définit le nombre de périodes à prévoir, et `time_series_id_column_names` déclare les colonnes qui identifient chaque série (café et produit) au lieu de laisser AutoML les détecter."
  options:
    regression:
      en: |
        A regression job ignores the time structure of the data and has no forecast settings such as a horizon.
      fr: |
        Un travail de régression ignore la structure temporelle des données et n'a pas de paramètres de prévision comme un horizon.
    lags:
      en: |
        `target_lags` and `target_rolling_window_size` create features from past values of the target; they don't set how far ahead the model predicts.
      fr: |
        `target_lags` et `target_rolling_window_size` créent des caractéristiques à partir des valeurs passées de la cible ; ils ne définissent pas jusqu'où le modèle prévoit.
    unknown:
      en: |
        `features_unknown_at_forecast_time` lists features whose future values aren't known; it doesn't identify the series.
      fr: |
        `features_unknown_at_forecast_time` liste les caractéristiques dont les valeurs futures ne sont pas connues ; il n'identifie pas les séries.
references:
  - title: Set Up AutoML for Time-Series Forecasting
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-auto-train-forecast
  - title: azure.ai.ml.automl.ForecastingJob class
    url: https://learn.microsoft.com/en-us/python/api/azure-ai-ml/azure.ai.ml.automl.forecastingjob
