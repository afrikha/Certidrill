id: ai300-2c-aad-token-least-privilege
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has an Azure Machine Learning workspace named **mlw-claims**. You are deploying a fraud model to a new managed online endpoint named **ep-claims**. The only client is an Azure App Service app that has a system-assigned managed identity.

    The solution must meet the following requirements:

    - No secret or key is stored or rotated by the app team.
    - The app's identity can call the scoring URI of the endpoint and nothing else in the workspace.

    What should you do?
  fr: |
    Litware dispose d'un espace de travail Azure Machine Learning nommé **mlw-claims**. Vous déployez un modèle de détection de fraude sur un nouveau point de terminaison en ligne managé nommé **ep-claims**. Le seul client est une application Azure App Service qui possède une identité managée affectée par le système.

    La solution doit répondre aux exigences suivantes :

    - Aucun secret ni aucune clé n'est stocké ou renouvelé par l'équipe de l'application.
    - L'identité de l'application peut appeler l'URI de scoring du point de terminaison et rien d'autre dans l'espace de travail.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set `auth_mode: key`, store the primary key in Azure Key Vault and grant the identity access to the secret.", fr: "Définir `auth_mode: key`, stocker la clé primaire dans Azure Key Vault et accorder à l'identité l'accès au secret." } }
    - { id: b, text: { en: "Set `auth_mode: aml_token` and let the app call `az ml online-endpoint get-credentials` before each token expires.", fr: "Définir `auth_mode: aml_token` et laisser l'application appeler `az ml online-endpoint get-credentials` avant chaque expiration du jeton." } }
    - { id: c, text: { en: "Set `auth_mode: aad_token` and assign the identity the AzureML Data Scientist role on the workspace.", fr: "Définir `auth_mode: aad_token` et attribuer à l'identité le rôle AzureML Data Scientist sur l'espace de travail." } }
    - { id: d, text: { en: "Set `auth_mode: aad_token` and assign the identity a custom role that allows only `onlineEndpoints/score/action`.", fr: "Définir `auth_mode: aad_token` et attribuer à l'identité un rôle personnalisé qui autorise uniquement `onlineEndpoints/score/action`." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With `auth_mode: aad_token`, a managed online endpoint accepts Microsoft Entra tokens, so the managed identity obtains tokens itself and no key is stored. Authorization then relies on Azure RBAC; a custom role that contains only `Microsoft.MachineLearningServices/workspaces/onlineEndpoints/score/action` lets the identity score and nothing more.
    fr: |
      Avec `auth_mode: aad_token`, un point de terminaison en ligne managé accepte des jetons Microsoft Entra : l'identité managée obtient elle-même ses jetons et aucune clé n'est stockée. L'autorisation repose alors sur Azure RBAC ; un rôle personnalisé qui contient uniquement `Microsoft.MachineLearningServices/workspaces/onlineEndpoints/score/action` permet à l'identité de noter et rien de plus.
  options:
    a: { en: "Endpoint keys don't expire but must be rotated regularly, and a secret is still stored, which breaks the first requirement.", fr: "Les clés de point de terminaison n'expirent pas mais doivent être renouvelées régulièrement, et un secret reste stocké, ce qui contredit la première exigence." }
    b: { en: "An Azure Machine Learning token is short-lived and must be fetched again with credentials that can read the endpoint, which adds token handling for the app team.", fr: "Un jeton Azure Machine Learning a une durée de vie courte et doit être récupéré à nouveau avec des informations d'identification capables de lire le point de terminaison, ce qui ajoute une gestion de jetons pour l'équipe de l'application." }
    c: { en: "AzureML Data Scientist includes the score action, but it also allows most other workspace operations, so it isn't least privilege.", fr: "AzureML Data Scientist inclut l'action de scoring, mais il autorise aussi la plupart des autres opérations de l'espace de travail : ce n'est pas le moindre privilège." }
references:
  - title: Authenticate clients for online endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-authenticate-online-endpoint
