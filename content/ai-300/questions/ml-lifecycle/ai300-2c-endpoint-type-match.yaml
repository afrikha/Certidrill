id: ai300-2c-endpoint-type-match
objective: "2.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses an Azure Machine Learning workspace to serve several models. The platform team also operates an AKS cluster that is attached to the workspace.

    You need to choose how to serve each workload.

    Which option should you use for each workload? To answer, drag the appropriate options to the correct workloads. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise un espace de travail Azure Machine Learning pour servir plusieurs modèles. L'équipe plateforme exploite aussi un cluster AKS attaché à l'espace de travail.

    Vous devez choisir comment servir chaque charge de travail.

    Quelle option devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les options appropriées vers les charges de travail correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: managed, text: { en: "Managed online endpoint", fr: "Point de terminaison en ligne managé" } }
    - { id: k8s, text: { en: "Kubernetes online endpoint", fr: "Point de terminaison en ligne Kubernetes" } }
    - { id: batchmodel, text: { en: "Batch endpoint with a model deployment", fr: "Point de terminaison de lot avec un déploiement de modèle" } }
    - { id: batchpipe, text: { en: "Batch endpoint with a pipeline component deployment", fr: "Point de terminaison de lot avec un déploiement de composant de pipeline" } }
    - { id: ci, text: { en: "Compute instance running a scheduled notebook", fr: "Instance de calcul exécutant un notebook planifié" } }
  targets:
    - id: t1
      text: { en: "A checkout API needs a fraud score for each order in real time; nobody on the team wants to manage nodes or OS updates.", fr: "Une API de paiement a besoin d'un score de fraude pour chaque commande en temps réel ; personne dans l'équipe ne veut gérer des nœuds ni des mises à jour du système d'exploitation." }
    - id: t2
      text: { en: "Each week, a registered model scores thousands of CSV files stored in a datastore and writes the predictions to storage.", fr: "Chaque semaine, un modèle inscrit note des milliers de fichiers CSV stockés dans un magasin de données et écrit les prédictions dans le stockage." }
    - id: t3
      text: { en: "Each night, raw files are cleaned by a preprocessing component and then scored, both steps behind a single endpoint.", fr: "Chaque nuit, des fichiers bruts sont nettoyés par un composant de prétraitement, puis notés, les deux étapes derrière un seul point de terminaison." }
    - id: t4
      text: { en: "A pricing model must answer each request in real time on the AKS cluster that the platform team sizes and upgrades.", fr: "Un modèle de tarification doit répondre à chaque requête en temps réel sur le cluster AKS que l'équipe plateforme dimensionne et met à niveau." }
answer:
  mapping: { t1: managed, t2: batchmodel, t3: batchpipe, t4: k8s }
explanation:
  correct:
    en: |
      Managed online endpoints serve real-time requests on compute that Azure provisions, patches and scales. Kubernetes online endpoints serve real-time requests on a customer-managed cluster. Batch endpoints score files asynchronously; a model deployment runs one model over the files, while a pipeline component deployment runs a multi-step graph such as preprocessing followed by scoring.
    fr: |
      Les points de terminaison en ligne managés servent des requêtes en temps réel sur un calcul qu'Azure approvisionne, corrige et met à l'échelle. Les points de terminaison en ligne Kubernetes servent des requêtes en temps réel sur un cluster géré par le client. Les points de terminaison de lot notent des fichiers de façon asynchrone ; un déploiement de modèle exécute un modèle sur les fichiers, tandis qu'un déploiement de composant de pipeline exécute un graphe en plusieurs étapes, par exemple un prétraitement suivi du scoring.
  options:
    ci: { en: "A compute instance is a development workstation, not a managed inference option.", fr: "Une instance de calcul est un poste de développement, pas une option d'inférence managée." }
references:
  - title: Online endpoints for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-online
  - title: What are batch endpoints?
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-batch
