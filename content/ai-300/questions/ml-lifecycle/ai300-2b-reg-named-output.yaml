id: ai300-2b-reg-named-output
objective: "2.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-wingtip**. A pipeline step job named **job-train-88** writes an MLflow model folder to a named output called `model_output`. The step doesn't call any MLflow registration method.

    You need to register the content of `model_output` as version 1 of a model named **demand-forecast**. The registered model must keep its lineage to job-train-88.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-wingtip**. Un travail d'étape de pipeline nommé **job-train-88** écrit un dossier de modèle MLflow dans une sortie nommée `model_output`. L'étape n'appelle aucune méthode d'inscription MLflow.

    Vous devez inscrire le contenu de `model_output` en tant que version 1 d'un modèle nommé **demand-forecast**. Le modèle inscrit doit conserver sa traçabilité vers job-train-88.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az ml model [[s1]] --name demand-forecast --version 1 \
      --path [[s2]] \
      --type mlflow_model \
      --resource-group rg-ml --workspace-name mlw-wingtip
  slots:
    - id: s1
      options:
        - { id: s1a, text: create }
        - { id: s1b, text: register }
        - { id: s1d, text: package }
        - { id: s1c, text: share }
    - id: s2
      options:
        - { id: s2c, text: "azureml:job-train-88:model_output" }
        - { id: s2b, text: "azureml://datastores/workspaceblobstore/paths/model_output" }
        - { id: s2d, text: "runs:/job-train-88/model_output/model" }
        - { id: s2a, text: "azureml://jobs/job-train-88/outputs/model_output" }
answer:
  values: { s1: s1a, s2: s2a }
explanation:
  correct:
    en: |
      In CLI v2, `az ml model create` registers a model. For a named output folder of a job, the path is `azureml://jobs/<job-name>/outputs/<output-name>`, which establishes the lineage between the registered model and the job when the training script didn't register the model with MLflow.
    fr: |
      Dans CLI v2, `az ml model create` inscrit un modèle. Pour le dossier d'une sortie nommée d'un travail, le chemin est `azureml://jobs/<job-name>/outputs/<output-name>`, ce qui établit la traçabilité entre le modèle inscrit et le travail quand le script d'entraînement n'a pas inscrit le modèle avec MLflow.
  options:
    s1b: { en: "There is no `register` subcommand in the CLI v2 `az ml model` group.", fr: "Le groupe `az ml model` de CLI v2 ne comporte aucune sous-commande `register`." }
    s1c: { en: "`share` copies an existing workspace model version to a registry.", fr: "`share` copie une version de modèle existante d'un espace de travail vers un registre." }
    s1d: { en: "`package` (preview) packages a registered model into an environment.", fr: "`package` (préversion) empaquette un modèle inscrit dans un environnement." }
    s2b: { en: "A datastore path doesn't link the model to the job.", fr: "Un chemin de magasin de données ne relie pas le modèle au travail." }
    s2c: { en: "`azureml:<name>:<version>` references a registered asset, not a job output.", fr: "`azureml:<name>:<version>` référence un actif inscrit, pas une sortie de travail." }
    s2d: { en: "`runs:/` paths are relative to the run's default artifact location, where this step wrote nothing; the model is in a named output.", fr: "Les chemins `runs:/` sont relatifs à l'emplacement d'artefacts par défaut de l'exécution, où cette étape n'a rien écrit ; le modèle se trouve dans une sortie nommée." }
references:
  - title: Work with registered models in Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
  - title: az ml model
    url: https://learn.microsoft.com/en-us/cli/azure/ml/model
