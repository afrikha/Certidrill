id: ai300-2b-reg-statements
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-contoso**. Data scientists log and register MLflow models from command jobs and from their laptops, with the MLflow tracking URI set to mlw-contoso.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-contoso**. Les scientifiques des données journalisent et inscrivent des modèles MLflow à partir de travaux command et de leurs ordinateurs portables, avec l'URI de suivi MLflow défini sur mlw-contoso.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: For a model logged in the default artifact location, the path `azureml://jobs/<job-name>/outputs/artifacts/paths/model/` is equivalent to `runs:/<job-name>/model`.
        fr: Pour un modèle journalisé dans l'emplacement d'artefacts par défaut, le chemin `azureml://jobs/<job-name>/outputs/artifacts/paths/model/` équivaut à `runs:/<job-name>/model`.
    - id: s2
      text:
        en: A stage set with `MlflowClient().transition_model_version_stage()` is displayed on the model page in Azure Machine Learning studio.
        fr: Une étape définie avec `MlflowClient().transition_model_version_stage()` est affichée dans la page du modèle dans Azure Machine Learning studio.
    - id: s3
      text:
        en: A model saved on a laptop with `mlflow.sklearn.save_model()` can be registered with `mlflow.register_model()` and a `file://` URI.
        fr: Un modèle enregistré sur un ordinateur portable avec `mlflow.sklearn.save_model()` peut être inscrit avec `mlflow.register_model()` et un URI `file://`.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The `azureml://jobs/<job-name>/outputs/artifacts/paths/` form points to the default artifact location of the job, the same location as `runs:/`. MLflow stages are accessible only through the MLflow SDK and aren't visible in the studio. `save_model()` writes an MLflow model to the local file system, and `register_model()` accepts its `file://` path.
    fr: |
      La forme `azureml://jobs/<job-name>/outputs/artifacts/paths/` désigne l'emplacement d'artefacts par défaut du travail, le même que `runs:/`. Les étapes MLflow ne sont accessibles qu'avec le SDK MLflow et ne sont pas visibles dans le studio. `save_model()` écrit un modèle MLflow dans le système de fichiers local, et `register_model()` accepte son chemin `file://`.
references:
  - title: Work with registered models in Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models
  - title: Manage models registry in Azure Machine Learning with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models-mlflow
