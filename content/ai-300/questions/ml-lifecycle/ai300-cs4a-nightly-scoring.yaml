id: ai300-cs4a-nightly-scoring
objective: "2.3.1"
type: multi
caseStudy: ai300-cs4a-coho-winery
difficulty: 1
status: draft
stem:
  en: |
    You need to implement the nightly scoring in mlw-coho-prod by using the version of harvest-forecaster published to reg-coho. The solution must meet the scoring requirements. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez mettre en place le scoring nocturne dans mlw-coho-prod en utilisant la version de harvest-forecaster publiée dans reg-coho. La solution doit respecter les exigences de scoring. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a batch endpoint and a model deployment of harvest-forecaster", fr: "Créer un point de terminaison par lots et un déploiement de modèle de harvest-forecaster" } }
    - { id: b, text: { en: "Create a second deployment of harvest-forecaster under harvest-api", fr: "Créer un second déploiement de harvest-forecaster sous harvest-api" } }
    - { id: c, text: { en: "Create a compute cluster with a minimum of 0 nodes for the deployment", fr: "Créer un cluster de calcul avec un minimum de 0 nœud pour le déploiement" } }
    - { id: d, text: { en: "Create a compute instance with an idle shutdown schedule for the deployment", fr: "Créer une instance de calcul avec un arrêt sur inactivité pour le déploiement" } }
    - { id: e, text: { en: "Create a Kubernetes online endpoint attached to a new AKS cluster", fr: "Créer un point de terminaison en ligne Kubernetes attaché à un nouveau cluster AKS" } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: A batch endpoint runs an asynchronous scoring job over the input files when it is invoked, and writes the predictions as files to a datastore. Its deployment runs on a compute cluster; with a minimum of 0 nodes, the cluster scales down to zero after the job, so no compute cost is incurred between nightly runs. The MLflow model needs no scoring script or environment.
    fr: Un point de terminaison par lots exécute un travail de scoring asynchrone sur les fichiers d'entrée quand il est appelé, et écrit les prédictions sous forme de fichiers dans un magasin de données. Son déploiement s'exécute sur un cluster de calcul ; avec un minimum de 0 nœud, le cluster revient à zéro après le travail, si bien qu'aucun coût de calcul n'est engagé entre deux exécutions nocturnes. Le modèle MLflow ne nécessite ni script de scoring ni environnement.
  options:
    b: { en: "An online deployment answers each request synchronously and keeps its instances running, which incurs cost between runs and doesn't write prediction files.", fr: "Un déploiement en ligne répond à chaque requête de façon synchrone et garde ses instances en fonctionnement, ce qui engendre des coûts entre les exécutions et n'écrit pas de fichiers de prédiction." }
    d: { en: "Batch deployments run on compute clusters, not on compute instances.", fr: "Les déploiements par lots s'exécutent sur des clusters de calcul, pas sur des instances de calcul." }
    e: { en: "A Kubernetes online endpoint is a real-time endpoint whose cluster runs continuously, and the team would have to manage it.", fr: "Un point de terminaison en ligne Kubernetes est un point de terminaison en temps réel dont le cluster fonctionne en permanence, et l'équipe devrait le gérer." }
references:
  - title: Deploy models for scoring in batch endpoints
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-batch-model-deployments
