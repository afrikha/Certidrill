id: ai300-2c-ground-truth-performance
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a fraud classification model deployed to a managed online endpoint. The scoring script collects `model_outputs` and logs a request ID column with each prediction. Thirty days after each prediction, investigators record whether the transaction was really fraudulent, with the same request ID, and the results are registered as the data asset **fraud-actuals**.

    You need to track the accuracy and precision of the model in production and be alerted when they fall below thresholds.

    What should you configure?
  fr: |
    Northwind Traders dispose d'un modèle de classification de fraude déployé sur un point de terminaison en ligne managé. Le script de scoring collecte `model_outputs` et journalise une colonne d'ID de requête avec chaque prédiction. Trente jours après chaque prédiction, les enquêteurs enregistrent si la transaction était réellement frauduleuse, avec le même ID de requête, et les résultats sont inscrits en tant que ressource de données **fraud-actuals**.

    Vous devez suivre l'exactitude et la précision du modèle en production et recevoir une alerte quand elles passent sous des seuils.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A `prediction_drift` signal with the validation predictions as reference data", fr: "Un signal `prediction_drift` avec les prédictions de validation comme données de référence" } }
    - { id: b, text: { en: "An Azure Monitor alert rule on the request latency metric of the endpoint", fr: "Une règle d'alerte Azure Monitor sur la métrique de latence des requêtes du point de terminaison" } }
    - { id: c, text: { en: "A `model_performance` signal with fraud-actuals as reference data, joined to the outputs by the request ID", fr: "Un signal `model_performance` avec fraud-actuals comme données de référence, joint aux sorties par l'ID de requête" } }
    - { id: d, text: { en: "A `data_drift` signal with the training data as reference data and `top_n_feature_importance`", fr: "Un signal `data_drift` avec les données d'entraînement comme données de référence et `top_n_feature_importance`" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The model performance signal compares the model outputs with ground truth data and computes accuracy, precision and recall for classification. The production outputs and the ground truth are joined on a correlation ID column (`data_column_names.correlation_id`), and `metric_thresholds` under `tabular_classification` sets the alert thresholds.
    fr: |
      Le signal de performances du modèle compare les sorties du modèle aux données de vérité terrain et calcule l'exactitude, la précision et le rappel pour la classification. Les sorties de production et la vérité terrain sont jointes sur une colonne d'ID de corrélation (`data_column_names.correlation_id`), et `metric_thresholds` sous `tabular_classification` définit les seuils d'alerte.
  options:
    a: { en: "Prediction drift detects a change in the distribution of outputs, but it can't tell whether the predictions are correct.", fr: "La dérive des prédictions détecte un changement de distribution des sorties, mais elle ne peut pas dire si les prédictions sont correctes." }
    b: { en: "Endpoint metrics describe operational health such as latency, not the quality of the predictions.", fr: "Les métriques du point de terminaison décrivent l'intégrité opérationnelle, comme la latence, pas la qualité des prédictions." }
    d: { en: "Data drift compares input distributions and uses no labels, so it doesn't measure accuracy.", fr: "La dérive des données compare des distributions d'entrées et n'utilise aucune étiquette : elle ne mesure pas l'exactitude." }
references:
  - title: Monitor model performance in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-model-performance
  - title: Collect production data from models for real-time inferencing
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-collect-production-data
