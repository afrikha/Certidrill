id: ai300-cs2a-safe-rollout
objective: "2.3.3"
type: ordering
caseStudy: ai300-cs2a-blue-yonder
difficulty: 3
status: draft
stem:
  en: |
    You have a deployment file named green.yml that references version 4 of engine-rul. Your Azure CLI session uses mlw-by-prod as its default workspace.

    You need to roll out version 4 on ep-engine-rul. The solution must meet the release process requirements.

    Which five commands should you run in sequence? To answer, move the appropriate commands from the list of commands to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un fichier de déploiement nommé green.yml qui référence la version 4 d'engine-rul. Votre session Azure CLI utilise mlw-by-prod comme espace de travail par défaut.

    Vous devez déployer la version 4 sur ep-engine-rul. La solution doit respecter les exigences du processus de mise en production.

    Quelles sont les cinq commandes à exécuter dans l'ordre ? Pour répondre, déplacez les commandes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: create, text: "`az ml online-deployment create --name green --endpoint-name ep-engine-rul -f green.yml`" }
    - { id: createall, text: "`az ml online-deployment create --name green --endpoint-name ep-engine-rul -f green.yml --all-traffic`" }
    - { id: mirror, text: "`az ml online-endpoint update --name ep-engine-rul --mirror-traffic \"green=10\"`" }
    - { id: unmirror, text: "`az ml online-endpoint update --name ep-engine-rul --mirror-traffic \"green=0\"`" }
    - { id: both, text: "`az ml online-endpoint update --name ep-engine-rul --traffic \"blue=90 green=10\" --mirror-traffic \"green=10\"`" }
    - { id: live10, text: "`az ml online-endpoint update --name ep-engine-rul --traffic \"blue=90 green=10\"`" }
    - { id: live100, text: "`az ml online-endpoint update --name ep-engine-rul --traffic \"blue=0 green=100\"`" }
answer:
  sequence: [ create, mirror, unmirror, live10, live100 ]
explanation:
  correct:
    en: |
      Created without `--all-traffic`, the green deployment receives 0% of the live traffic. Mirroring 10% sends copies of requests to green while clients still receive only the responses of blue. A deployment can receive either live traffic or mirrored traffic, not both, so you stop mirroring (`green=0`) before you give green 10% of the live traffic, and then 100%. Blue stays deployed during the whole rollout and remains available for a rollback.
    fr: |
      Créé sans `--all-traffic`, le déploiement green reçoit 0 % du trafic réel. La mise en miroir de 10 % envoie à green des copies des requêtes, tandis que les clients ne reçoivent que les réponses de blue. Un déploiement peut recevoir soit du trafic réel, soit du trafic en miroir, mais pas les deux : vous arrêtez donc la mise en miroir (`green=0`) avant d'accorder à green 10 % du trafic réel, puis 100 %. Blue reste déployé pendant tout le déploiement progressif et reste disponible pour une restauration.
  options:
    createall: { en: "--all-traffic sends 100% of the live traffic to version 4 immediately, before any mirrored test.", fr: "--all-traffic envoie immédiatement 100 % du trafic réel à la version 4, avant tout test en miroir." }
    both: { en: "A deployment cannot receive live traffic and mirrored traffic at the same time.", fr: "Un déploiement ne peut pas recevoir en même temps du trafic réel et du trafic en miroir." }
references:
  - title: Perform safe rollout of new deployments for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
