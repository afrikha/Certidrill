id: ai300-2b-frs-package
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning project workspace that uses features from a managed feature store named **fs-woodgrove**. You generated a feature retrieval specification during experimentation, and a training job now produces a fraud detection model.

    You need to package the specification with the model so that the system recognizes it when the model is registered and used for inference.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail de projet Azure Machine Learning qui utilise des caractéristiques d'un magasin de caractéristiques managé nommé **fs-woodgrove**. Vous avez généré une spécification de récupération de caractéristiques pendant l'expérimentation, et un travail d'entraînement produit désormais un modèle de détection de fraude.

    Vous devez empaqueter la spécification avec le modèle pour que le système la reconnaisse quand le modèle est inscrit et utilisé pour l'inférence.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the list of features to the `signature` section of the MLmodel file.", fr: "Ajouter la liste des caractéristiques à la section `signature` du fichier MLmodel." } }
    - { id: b, text: { en: "Add the file to the conda file of the environment used by the deployment.", fr: "Ajouter le fichier au fichier conda de l'environnement utilisé par le déploiement." } }
    - { id: c, text: { en: "Copy the file, named `feature_retrieval_spec.yaml`, to the root folder of the model artifact.", fr: "Copier le fichier, nommé `feature_retrieval_spec.yaml`, dans le dossier racine de l'artefact du modèle." } }
    - { id: d, text: { en: "Register the file `feature_retrieval_spec.yaml` as a `uri_file` data asset that has the same name as the model.", fr: "Inscrire le fichier `feature_retrieval_spec.yaml` en tant que ressource de données `uri_file` portant le même nom que le modèle." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The specification must be packaged in the root folder of the model artifact, with its file name unchanged: `feature_retrieval_spec.yaml`. The system then tracks the model's dependency on the feature sets, and the scoring code or the feature retrieval component can load the feature list from the model folder.
    fr: |
      La spécification doit être empaquetée dans le dossier racine de l'artefact du modèle, sans changer son nom de fichier : `feature_retrieval_spec.yaml`. Le système suit alors la dépendance du modèle envers les ensembles de caractéristiques, et le code de scoring ou le composant de récupération de caractéristiques peut charger la liste des caractéristiques depuis le dossier du modèle.
  options:
    d: { en: "A separate data asset isn't linked to the model; the specification must travel inside the model artifact.", fr: "Une ressource de données distincte n'est pas liée au modèle ; la spécification doit voyager à l'intérieur de l'artefact du modèle." }
    a: { en: "The signature describes the model's inputs and outputs; it doesn't tell the system where to retrieve features from.", fr: "La signature décrit les entrées et sorties du modèle ; elle n'indique pas au système où récupérer les caractéristiques." }
    b: { en: "A conda file lists packages for the environment; it can't carry the feature list of a model.", fr: "Un fichier conda liste les packages de l'environnement ; il ne peut pas transporter la liste des caractéristiques d'un modèle." }
references:
  - title: Feature retrieval specification and usage in training and inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/feature-retrieval-concepts
