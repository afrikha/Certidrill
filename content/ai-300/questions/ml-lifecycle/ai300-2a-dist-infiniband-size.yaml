id: ai300-2a-dist-infiniband-size
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You run multi-node distributed GPU training in Azure Machine Learning. Scaling from one to four nodes barely reduces the training time because communication between the nodes is the bottleneck.

    You need to create a new compute cluster whose nodes communicate over InfiniBand.

    Which VM size should you use?
  fr: |
    Vous exécutez un entraînement GPU distribué multinœud dans Azure Machine Learning. Passer de un à quatre nœuds réduit à peine la durée d'entraînement, car la communication entre les nœuds est le goulot d'étranglement.

    Vous devez créer un nouveau cluster de calcul dont les nœuds communiquent par InfiniBand.

    Quelle taille de machine virtuelle devez-vous utiliser ?
body:
  options:
    - { id: a, text: Standard_NC24s_v3 }
    - { id: b, text: Standard_NC4as_T4_v3 }
    - { id: c, text: Standard_D16s_v5 }
    - { id: d, text: Standard_NC24rs_v3 }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Only VM sizes with an *r* (for RDMA) in their name contain the InfiniBand hardware. Standard_NC24rs_v3 is InfiniBand-enabled, and compute clusters of such sizes come with the InfiniBand drivers preinstalled and configured.
    fr: |
      Seules les tailles de machine virtuelle dont le nom contient un *r* (pour RDMA) disposent du matériel InfiniBand. Standard_NC24rs_v3 prend en charge InfiniBand, et les clusters de calcul de ces tailles sont livrés avec les pilotes InfiniBand préinstallés et configurés.
  options:
    a:
      en: |
        Standard_NC24s_v3 has the same cores, memory and four GPUs, but no InfiniBand hardware.
      fr: |
        Standard_NC24s_v3 a les mêmes cœurs, la même mémoire et quatre GPU, mais pas de matériel InfiniBand.
    b:
      en: |
        This GPU size has no r in its name and no InfiniBand.
      fr: |
        Cette taille GPU n'a pas de r dans son nom ni d'InfiniBand.
    c:
      en: |
        This is a general-purpose CPU size without GPUs or InfiniBand.
      fr: |
        C'est une taille CPU à usage général, sans GPU ni InfiniBand.
references:
  - title: Distributed GPU training guide (SDK v2)
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-train-distributed-gpu
