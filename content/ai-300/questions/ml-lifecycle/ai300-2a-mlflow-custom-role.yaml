id: ai300-2a-mlflow-custom-role
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-tailspin**. An external training platform uses a service principal to log MLflow runs (parameters, metrics and artifacts) to mlw-tailspin and to register the resulting MLflow models in the model registry of the workspace.

    You need to create a custom role for the service principal. The solution must follow the principle of least privilege.

    Which actions should the custom role contain?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-tailspin**. Une plateforme d'entraînement externe utilise un principal de service pour enregistrer des exécutions MLflow (paramètres, métriques et artefacts) dans mlw-tailspin et pour inscrire les modèles MLflow obtenus dans le registre de modèles de l'espace de travail.

    Vous devez créer un rôle personnalisé pour le principal de service. La solution doit respecter le principe du moindre privilège.

    Quelles actions le rôle personnalisé doit-il contenir ?
body:
  options:
    - id: a
      text: { en: "`workspaces/experiments/*` and `workspaces/jobs/*` only", fr: "`workspaces/experiments/*` et `workspaces/jobs/*` uniquement" }
    - id: b
      text: { en: "`workspaces/models/*/*` only", fr: "`workspaces/models/*/*` uniquement" }
    - id: c
      text: { en: "`workspaces/experiments/*`, `workspaces/jobs/*` and `workspaces/models/*/*`", fr: "`workspaces/experiments/*`, `workspaces/jobs/*` et `workspaces/models/*/*`" }
    - id: d
      text: { en: "`workspaces/*` on the workspace", fr: "`workspaces/*` sur l'espace de travail" }
answer: { optionId: c }
explanation:
  correct:
    en: "All actions are under `Microsoft.MachineLearningServices/`. MLflow tracking needs `workspaces/experiments/*` and `workspaces/jobs/*`, and the MLflow model registry needs `workspaces/models/*/*`. The service principal does both, so it needs the three, and nothing broader."
    fr: "Toutes les actions sont sous `Microsoft.MachineLearningServices/`. Le suivi MLflow demande `workspaces/experiments/*` et `workspaces/jobs/*`, et le registre de modèles MLflow demande `workspaces/models/*/*`. Le principal de service fait les deux : il lui faut les trois, et rien de plus large."
  options:
    a:
      en: |
        These actions cover tracking but not model registration, so registering the model fails.
      fr: |
        Ces actions couvrent le suivi mais pas l'inscription des modèles : l'inscription du modèle échoue.
    b:
      en: |
        These actions cover the model registry but not tracking, so logging runs fails.
      fr: |
        Ces actions couvrent le registre de modèles mais pas le suivi : l'enregistrement des exécutions échoue.
    d:
      en: |
        A wildcard on the whole workspace grants every workspace operation, far more than required.
      fr: |
        Un caractère générique sur tout l'espace de travail accorde toutes les opérations de l'espace de travail, bien plus que nécessaire.
references:
  - title: Configure MLflow for Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-mlflow-configure-tracking
