id: ai300-2c-trigger-statements
objective: "2.4.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Adatum automates retraining and notifications for models in an Azure Machine Learning workspace by using Azure Machine Learning schedules and Event Grid subscriptions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum automatise le réentraînement et les notifications des modèles d'un espace de travail Azure Machine Learning à l'aide de planifications Azure Machine Learning et d'abonnements Event Grid.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A subscription to the **Model deployed** event notifies the team when a deployment of a new model version fails.
        fr: Un abonnement à l'événement **Model deployed** notifie l'équipe quand le déploiement d'une nouvelle version de modèle échoue.
    - id: s2
      text:
        en: Before you delete a schedule with `az ml schedule delete`, you must disable it.
        fr: Avant de supprimer une planification avec `az ml schedule delete`, vous devez la désactiver.
    - id: s3
      text:
        en: A schedule with the cron expression `0 2 15 * *` starts the retraining pipeline only on the 15th day of each month.
        fr: Une planification avec l'expression cron `0 2 15 * *` démarre le pipeline de réentraînement uniquement le 15 de chaque mois.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Failed or canceled operations don't raise Azure Machine Learning events, so a failed deployment raises no **Model deployed** event; check the operation status instead. A schedule must be disabled before it is deleted, and deletion can't be undone. In schedule cron expressions, the day-of-month and month fields aren't supported and are treated as `*`, so `0 2 15 * *` runs every day at 02:00.
    fr: |
      Les opérations ayant échoué ou annulées ne déclenchent pas d'événements Azure Machine Learning : un déploiement en échec ne déclenche donc aucun événement **Model deployed** ; vérifiez plutôt l'état de l'opération. Une planification doit être désactivée avant d'être supprimée, et la suppression est irréversible. Dans les expressions cron des planifications, les champs jour du mois et mois ne sont pas pris en charge et sont traités comme `*` : `0 2 15 * *` s'exécute donc chaque jour à 02:00.
references:
  - title: Trigger applications, processes, or CI/CD workflows based on Azure Machine Learning events
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-event-grid
  - title: Schedule machine learning pipeline jobs
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-schedule-pipeline-job
