id: ai300-2a-nb-idle-shutdown
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Machine Learning workspace where 12 data scientists explore data in notebooks, each on their own compute instance. They often forget to stop their compute instance at the end of the day.

    You need to reduce compute costs. The data scientists must keep running notebooks on their compute instances. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Contoso dispose d'un espace de travail Azure Machine Learning dans lequel 12 data scientists explorent des données dans des notebooks, chacun sur sa propre instance de calcul. Ils oublient souvent d'arrêter leur instance de calcul en fin de journée.

    Vous devez réduire les coûts de calcul. Les data scientists doivent continuer à exécuter des notebooks sur leurs instances de calcul. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable idle shutdown on the compute instances.", fr: "Activer l'arrêt en cas d'inactivité sur les instances de calcul." } }
    - { id: b, text: { en: "Set the minimum number of nodes of the compute instances to 0.", fr: "Définir le nombre minimal de nœuds des instances de calcul sur 0." } }
    - { id: c, text: { en: "Ask the data scientists to run `sudo shutdown` in the terminal at the end of the day.", fr: "Demander aux data scientists d'exécuter `sudo shutdown` dans le terminal en fin de journée." } }
    - { id: d, text: { en: "Replace the compute instances with serverless compute for the notebooks.", fr: "Remplacer les instances de calcul par le calcul serverless pour les notebooks." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Idle shutdown stops a compute instance automatically after a period of inactivity, with no manual step. A start and stop schedule is the other built-in way to avoid paying for an instance that nobody uses.
    fr: |
      L'arrêt en cas d'inactivité arrête automatiquement une instance de calcul après une période d'inactivité, sans étape manuelle. Une planification de démarrage et d'arrêt est l'autre moyen intégré d'éviter de payer une instance que personne n'utilise.
  options:
    b:
      en: |
        A minimum node count is a compute cluster setting; a compute instance is a single node.
      fr: |
        Un nombre minimal de nœuds est un paramètre de cluster de calcul ; une instance de calcul est un nœud unique.
    c:
      en: |
        Microsoft says not to stop a compute instance with `sudo shutdown` from the OS terminal, and it relies on people remembering.
      fr: |
        Microsoft indique de ne pas arrêter une instance de calcul avec `sudo shutdown` depuis le terminal du système d'exploitation, et cela dépend de la mémoire des utilisateurs.
    d:
      en: |
        Serverless compute runs jobs; notebook cells need a compute instance.
      fr: |
        Le calcul serverless exécute des travaux ; les cellules de notebook ont besoin d'une instance de calcul.
references:
  - title: What is an Azure Machine Learning compute instance?
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-compute-instance
