id: ai300-cs3a-mlflow-laptop
objective: "2.1.1"
type: single
caseStudy: ai300-cs3a-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You need to change the training script that Ines runs on her laptop to meet model governance requirement 6. Ines is signed in to the Azure CLI with her own account, and she has the AzureML Data Scientist role on mlw-claims-dev.

    What should you do?
  fr: |
    Vous devez modifier le script d'entraînement qu'Ines exécute sur son ordinateur portable pour respecter l'exigence 6 de gouvernance des modèles. Ines est connectée à Azure CLI avec son propre compte et dispose du rôle AzureML Data Scientist sur mlw-claims-dev.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Install `azureml-mlflow`, pass the `mlflow_tracking_uri` value of mlw-claims-dev to `mlflow.set_tracking_uri()`, and then call `mlflow.set_experiment(\"fraud-gbm\")`."
        fr: "Installer `azureml-mlflow`, passer la valeur `mlflow_tracking_uri` de mlw-claims-dev à `mlflow.set_tracking_uri()`, puis appeler `mlflow.set_experiment(\"fraud-gbm\")`."
    - id: b
      text:
        en: "Install `azureml-mlflow`, call `mlflow.set_experiment(\"fraud-gbm\")`, and rely on the tracking URI that is configured automatically for MLflow."
        fr: "Installer `azureml-mlflow`, appeler `mlflow.set_experiment(\"fraud-gbm\")`, et s'appuyer sur l'URI de suivi configuré automatiquement pour MLflow."
    - id: c
      text:
        en: "Set the `AZURE_TENANT_ID`, `AZURE_CLIENT_ID` and `AZURE_CLIENT_SECRET` environment variables, and then call `mlflow.set_experiment(\"fraud-gbm\")`."
        fr: "Définir les variables d'environnement `AZURE_TENANT_ID`, `AZURE_CLIENT_ID` et `AZURE_CLIENT_SECRET`, puis appeler `mlflow.set_experiment(\"fraud-gbm\")`."
    - id: d
      text:
        en: "Call `mlflow.autolog()` before training, and set the `experiment_name` key to fraud-gbm in a job YAML file in the repository."
        fr: "Appeler `mlflow.autolog()` avant l'entraînement, et définir la clé `experiment_name` sur fraud-gbm dans un fichier YAML de travail du dépôt."
answer: { optionId: a }
explanation:
  correct:
    en: |
      Outside Azure Machine Learning, MLflow logs to the local mlruns folder until you point it at the workspace. You install the `azureml-mlflow` plug-in, get the workspace's tracking URI (for example with `az ml workspace show --query mlflow_tracking_uri`), pass it to `mlflow.set_tracking_uri()`, and select the experiment with `mlflow.set_experiment()`. Ines's Azure CLI sign-in provides the credentials through the default credential chain.
    fr: |
      En dehors d'Azure Machine Learning, MLflow journalise dans le dossier mlruns local tant que vous ne le dirigez pas vers l'espace de travail. Vous installez le plug-in `azureml-mlflow`, récupérez l'URI de suivi de l'espace de travail (par exemple avec `az ml workspace show --query mlflow_tracking_uri`), le passez à `mlflow.set_tracking_uri()` et sélectionnez l'expérience avec `mlflow.set_experiment()`. La connexion Azure CLI d'Ines fournit les informations d'identification via la chaîne d'informations d'identification par défaut.
  options:
    b:
      en: |
        The tracking URI is configured automatically only in Azure Machine Learning notebooks, compute instances and jobs, not on a laptop.
      fr: |
        L'URI de suivi n'est configuré automatiquement que dans les notebooks, les instances de calcul et les travaux Azure Machine Learning, pas sur un ordinateur portable.
    c:
      en: |
        Service principal variables only change how MLflow authenticates; without a tracking URI the runs still go to the local mlruns folder.
      fr: |
        Les variables d'un principal de service ne changent que la manière dont MLflow s'authentifie ; sans URI de suivi, les exécutions vont toujours dans le dossier mlruns local.
    d:
      en: |
        Autologging chooses what is logged, not where. A job YAML file applies only to jobs submitted to the workspace, not to a script that Ines runs locally.
      fr: |
        La journalisation automatique choisit ce qui est journalisé, pas l'emplacement. Un fichier YAML de travail ne s'applique qu'aux travaux soumis à l'espace de travail, pas à un script qu'Ines exécute en local.
references:
  - title: Configure MLflow for Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-mlflow-configure-tracking
