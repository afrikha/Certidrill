id: ai300-2c-eventgrid-prerequisites
objective: "2.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An engineer at Litware must create an Event Grid subscription on an Azure Machine Learning workspace named **mlw-claims** so that a function app starts a retraining pipeline when a model monitor reports a threshold breach. The engineer currently has the AzureML Data Scientist role on mlw-claims, and the subscription has never used Event Grid.

    Which two actions are required before the engineer can create the event subscription? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un ingénieur de Litware doit créer un abonnement Event Grid sur un espace de travail Azure Machine Learning nommé **mlw-claims** pour qu'une application de fonction démarre un pipeline de réentraînement quand une surveillance de modèle signale un dépassement de seuil. L'ingénieur dispose actuellement du rôle AzureML Data Scientist sur mlw-claims, et l'abonnement Azure n'a jamais utilisé Event Grid.

    Quelles sont les deux actions requises avant que l'ingénieur puisse créer l'abonnement aux événements ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Register the `Microsoft.EventGrid` resource provider in the Azure subscription.", fr: "Inscrire le fournisseur de ressources `Microsoft.EventGrid` dans l'abonnement Azure." } }
    - { id: b, text: { en: "Assign the engineer the AzureML Compute Operator role on mlw-claims.", fr: "Attribuer à l'ingénieur le rôle AzureML Compute Operator sur mlw-claims." } }
    - { id: c, text: { en: "Add a diagnostic setting on mlw-claims that sends the run logs to Log Analytics.", fr: "Ajouter sur mlw-claims un paramètre de diagnostic qui envoie les journaux d'exécution vers Log Analytics." } }
    - { id: d, text: { en: "Configure the managed virtual network of mlw-claims in `AllowOnlyApprovedOutbound` mode.", fr: "Configurer le réseau virtuel managé de mlw-claims en mode `AllowOnlyApprovedOutbound`." } }
    - { id: e, text: { en: "Assign the engineer the Contributor role on mlw-claims.", fr: "Attribuer à l'ingénieur le rôle Contributor sur mlw-claims." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      Only a contributor or owner of the workspace can create, update and delete event subscriptions, so AzureML Data Scientist isn't enough. The `Microsoft.EventGrid` resource provider must be registered in the subscription before you create Event Grid subscriptions.
    fr: |
      Seul un contributeur ou un propriétaire de l'espace de travail peut créer, mettre à jour et supprimer des abonnements aux événements : AzureML Data Scientist ne suffit donc pas. Le fournisseur de ressources `Microsoft.EventGrid` doit être inscrit dans l'abonnement avant la création d'abonnements Event Grid.
  options:
    b: { en: "AzureML Compute Operator manages compute resources; it doesn't allow creating event subscriptions.", fr: "AzureML Compute Operator gère les ressources de calcul ; il ne permet pas de créer des abonnements aux événements." }
    c: { en: "Workspace events are published to Event Grid directly; no diagnostic setting is needed.", fr: "Les événements de l'espace de travail sont publiés directement dans Event Grid ; aucun paramètre de diagnostic n'est nécessaire." }
    d: { en: "Network isolation is unrelated to Event Grid subscriptions, and model monitoring doesn't support AllowOnlyApprovedOutbound.", fr: "L'isolation réseau n'a aucun rapport avec les abonnements Event Grid, et la surveillance des modèles ne prend pas en charge AllowOnlyApprovedOutbound." }
references:
  - title: Trigger applications, processes, or CI/CD workflows based on Azure Machine Learning events
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-event-grid
