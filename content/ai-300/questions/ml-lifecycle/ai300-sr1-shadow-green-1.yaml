stem:
  en: You split the endpoint traffic 80/20 between blue and green.
  fr: Vous répartissez le trafic du point de terminaison à 80/20 entre blue et green.
body:
  solution:
    en: |
      You run the following command:

      ```bash
      az ml online-endpoint update --name ep-credit --traffic "blue=80 green=20"
      ```
    fr: |
      Vous exécutez la commande suivante :

      ```bash
      az ml online-endpoint update --name ep-credit --traffic "blue=80 green=20"
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      Live traffic allocation sends each request to one deployment only, and that deployment's response is returned to the caller. With this split, about 20 percent of the client applications' requests would receive green's predictions, which breaks the requirement that clients see only blue's predictions. The goal isn't met.
    fr: |
      L'allocation du trafic en direct envoie chaque requête à un seul déploiement, et la réponse de ce déploiement est renvoyée à l'appelant. Avec cette répartition, environ 20 % des requêtes des applications clientes recevraient les prédictions de green, ce qui enfreint l'exigence selon laquelle les clients ne voient que les prédictions de blue. L'objectif n'est pas atteint.
references:
  - title: Safe rollout for online endpoints - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints?view=azureml-api-2
