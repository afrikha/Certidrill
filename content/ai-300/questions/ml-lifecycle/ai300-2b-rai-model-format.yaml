id: ai300-2b-rai-model-format
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace. A scikit-learn classifier was serialized with `joblib` and registered as a `custom_model` named **claims-triage**. The training and test data are registered as `mltable` data assets.

    You build a pipeline with the Responsible AI components to generate a dashboard for the model, but the job fails when it loads the model. You need to generate the dashboard.

    What should you do first?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning. Un classifieur scikit-learn a été sérialisé avec `joblib` et inscrit en tant que `custom_model` nommé **claims-triage**. Les données d'entraînement et de test sont inscrites en tant que ressources de données `mltable`.

    Vous créez un pipeline avec les composants Responsible AI pour générer un tableau de bord du modèle, mais le travail échoue au chargement du modèle. Vous devez générer le tableau de bord.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Log and register the model in MLflow format with the `sklearn` flavor.", fr: "Journaliser et inscrire le modèle au format MLflow avec la saveur `sklearn`." } }
    - { id: b, text: { en: "Register the model again as a `triton_model`.", fr: "Inscrire de nouveau le modèle en tant que `triton_model`." } }
    - { id: c, text: { en: "Share the model to an Azure Machine Learning registry.", fr: "Partager le modèle dans un registre Azure Machine Learning." } }
    - { id: d, text: { en: "Register the training and test data as `uri_folder` data assets.", fr: "Inscrire les données d'entraînement et de test en tant que ressources de données `uri_folder`." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Responsible AI components currently support only models registered in MLflow format with a `sklearn` flavor, which must be loadable in the component environment and pickleable. A `custom_model` pickle file doesn't meet this requirement.
    fr: |
      Les composants Responsible AI ne prennent actuellement en charge que les modèles inscrits au format MLflow avec une saveur `sklearn`, qui doivent pouvoir être chargés dans l'environnement du composant et être sérialisables avec pickle. Un fichier pickle inscrit en tant que `custom_model` ne répond pas à cette exigence.
  options:
    d: { en: "The training and test data must be `mltable` inputs, which they already are.", fr: "Les données d'entraînement et de test doivent être des entrées `mltable`, ce qu'elles sont déjà." }
    c: { en: "A registry shares assets across workspaces; it doesn't change the model format.", fr: "Un registre partage des actifs entre espaces de travail ; il ne change pas le format du modèle." }
    b: { en: "Triton models are for Triton Inference Server and aren't supported by the Responsible AI components.", fr: "Les modèles Triton concernent Triton Inference Server et ne sont pas pris en charge par les composants Responsible AI." }
references:
  - title: Generate Responsible AI insights with YAML and Python
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-responsible-ai-insights-sdk-cli
