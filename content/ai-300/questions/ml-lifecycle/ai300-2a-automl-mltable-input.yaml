id: ai300-2a-automl-mltable-input
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace. A data asset named **claims-csv** is registered as a `uri_file` that points to a CSV file.

    You configure an AutoML regression job by using the Python SDK v2 and pass `training_data=Input(type=AssetTypes.URI_FILE, path="azureml:claims-csv:1")`. The job is rejected because of the training data.

    You need the AutoML job to train on the data in the CSV file.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning. Une ressource de données nommée **claims-csv** est inscrite en tant que `uri_file` qui pointe vers un fichier CSV.

    Vous configurez un travail AutoML de régression avec le SDK Python v2 et passez `training_data=Input(type=AssetTypes.URI_FILE, path="azureml:claims-csv:1")`. Le travail est rejeté à cause des données d'entraînement.

    Le travail AutoML doit s'entraîner sur les données du fichier CSV.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Register the folder that contains the CSV file as a `uri_folder` data asset and pass it with `AssetTypes.URI_FOLDER`.", fr: "Inscrire le dossier qui contient le fichier CSV en tant que ressource de données `uri_folder` et la passer avec `AssetTypes.URI_FOLDER`." }
    - id: b
      text: { en: "Create an MLTable that loads the CSV file and pass it with `AssetTypes.MLTABLE`.", fr: "Créer une MLTable qui charge le fichier CSV et la passer avec `AssetTypes.MLTABLE`." }
    - id: c
      text: { en: "Call `set_featurization(mode=\"off\")` so that AutoML reads the CSV file without transforming it.", fr: "Appeler `set_featurization(mode=\"off\")` pour qu'AutoML lise le fichier CSV sans le transformer." }
    - id: d
      text: { en: "Pass the CSV file in `validation_data` and set `n_cross_validations` to 5.", fr: "Passer le fichier CSV dans `validation_data` et définir `n_cross_validations` sur 5." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      AutoML jobs in the SDK v2 and CLI v2 take tabular training data as an MLTable. You create one, for example with `mltable.from_delimited_files()` and `save()`, which writes an MLTable file that describes how to load the CSV, then pass it as `Input(type=AssetTypes.MLTABLE, ...)`.
    fr: |
      Les travaux AutoML du SDK v2 et de la CLI v2 prennent les données d'entraînement tabulaires sous forme de MLTable. Vous en créez une, par exemple avec `mltable.from_delimited_files()` et `save()`, qui écrit un fichier MLTable décrivant comment charger le CSV, puis vous la passez avec `Input(type=AssetTypes.MLTABLE, ...)`.
  options:
    a:
      en: |
        A `uri_folder` is still not an MLTable; AutoML needs the loading instructions that an MLTable provides.
      fr: |
        Un `uri_folder` n'est toujours pas une MLTable ; AutoML a besoin des instructions de chargement que fournit une MLTable.
    c:
      en: |
        Featurization settings don't change the accepted input type; the training data must still be an MLTable.
      fr: |
        Les paramètres de caractérisation ne changent pas le type d'entrée accepté ; les données d'entraînement doivent toujours être une MLTable.
    d:
      en: |
        Validation data has the same MLTable requirement, and training data is still required.
      fr: |
        Les données de validation ont la même exigence de MLTable, et les données d'entraînement restent obligatoires.
references:
  - title: Set up AutoML training for tabular data with the Azure Machine Learning CLI and Python SDK
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-auto-train
