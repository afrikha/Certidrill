id: ai300-2a-automl-exit-criteria
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are configuring an AutoML classification job by using the Python SDK v2. The job must meet the following requirements:

    - The whole job must end after at most two hours.
    - The job must end sooner if the score stops improving in the short term.

    Which two settings should you configure in `set_limits()`? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez un travail AutoML de classification avec le SDK Python v2. Le travail doit répondre aux exigences suivantes :

    - Le travail entier doit se terminer au bout de deux heures au maximum.
    - Le travail doit se terminer plus tôt si le score cesse de s'améliorer à court terme.

    Quels sont les deux paramètres à configurer dans `set_limits()` ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "trial_timeout_minutes=120" }
    - { id: b, text: "timeout_minutes=120" }
    - { id: c, text: "max_trials=120" }
    - { id: d, text: "enable_early_termination=True" }
    - { id: e, text: "max_concurrent_trials=2" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "`timeout_minutes` caps the duration of the whole AutoML job (8,640 minutes by default). `enable_early_termination` ends the job when the score isn't improving in the short term."
    fr: "`timeout_minutes` plafonne la durée du travail AutoML entier (8 640 minutes par défaut). `enable_early_termination` met fin au travail quand le score ne s'améliore pas à court terme."
  options:
    a:
      en: "`trial_timeout_minutes` caps each trial, not the whole job: many 2-hour trials could run."
      fr: "`trial_timeout_minutes` plafonne chaque essai, pas le travail entier : de nombreux essais de 2 heures pourraient s'exécuter."
    c:
      en: "`max_trials` caps the number of trials, not the elapsed time."
      fr: "`max_trials` plafonne le nombre d'essais, pas la durée écoulée."
    e:
      en: "`max_concurrent_trials` controls parallelism; it neither caps the duration nor reacts to the score."
      fr: "`max_concurrent_trials` contrôle le parallélisme ; il ne plafonne pas la durée et ne réagit pas au score."
references:
  - title: Set up AutoML training for tabular data with the Azure Machine Learning CLI and Python SDK
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-auto-train
