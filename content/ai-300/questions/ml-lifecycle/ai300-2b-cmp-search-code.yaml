id: ai300-2b-cmp-search-code
objective: "2.1.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace that contains an experiment named **churn-training**. Each run logs the parameter `max_depth` and the metric `val_auc` with MLflow.

    You need to write Python code that meets the following requirements:

    - Return only the runs of the churn-training experiment.
    - Keep the runs where `val_auc` is greater than 0.85 and `max_depth` is 8.
    - Put the run with the highest `val_auc` first.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning qui contient une expérience nommée **churn-training**. Chaque exécution journalise le paramètre `max_depth` et la métrique `val_auc` avec MLflow.

    Vous devez écrire du code Python qui répond aux exigences suivantes :

    - Ne renvoyer que les exécutions de l'expérience churn-training.
    - Conserver les exécutions dont `val_auc` est supérieur à 0,85 et dont `max_depth` vaut 8.
    - Placer en premier l'exécution ayant la valeur `val_auc` la plus élevée.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import mlflow

    runs = mlflow.search_runs(
        [[s1]]=["churn-training"],
        filter_string="[[s2]]",
    )
    ranked = runs.[[s3]]("metrics.val_auc", ascending=False)
  slots:
    - id: s1
      options:
        - { id: s1a, text: experiment_names }
        - { id: s1b, text: experiment_ids }
        - { id: s1c, text: run_names }
        - { id: s1d, text: search_all_experiments }
    - id: s2
      options:
        - { id: s2c, text: "metrics.val_auc > 0.85 AND metrics.max_depth = 8" }
        - { id: s2d, text: "metrics.val_auc > 0.85 AND tags.max_depth = '8'" }
        - { id: s2b, text: "metrics.val_auc > 0.85 AND params.max_depth > 7" }
        - { id: s2a, text: "metrics.val_auc > 0.85 AND params.max_depth = '8'" }
    - id: s3
      options:
        - { id: s3c, text: sort_index }
        - { id: s3b, text: order_by }
        - { id: s3a, text: sort_values }
answer:
  values: { s1: s1a, s2: s2a, s3: s3a }
explanation:
  correct:
    en: |
      `experiment_names` takes a list of experiment names. Parameters are stored as strings and support only `=`, `!=` and `like`, so the value is quoted: `params.max_depth = '8'`. `search_runs` returns a pandas DataFrame, which you sort on the `metrics.val_auc` column with `sort_values`.
    fr: |
      `experiment_names` accepte une liste de noms d'expériences. Les paramètres sont stockés sous forme de chaînes et ne prennent en charge que `=`, `!=` et `like` : la valeur est donc entre guillemets, `params.max_depth = '8'`. `search_runs` renvoie un DataFrame pandas, que vous triez sur la colonne `metrics.val_auc` avec `sort_values`.
  options:
    s1b: { en: "`experiment_ids` expects experiment IDs, not names.", fr: "`experiment_ids` attend des ID d'expériences, pas des noms." }
    s1d: { en: "`search_all_experiments` is a Boolean that searches every experiment of the workspace.", fr: "`search_all_experiments` est un booléen qui recherche dans toutes les expériences de l'espace de travail." }
    s2b: { en: "Comparison operators such as `>` aren't supported for parameters.", fr: "Les opérateurs de comparaison comme `>` ne sont pas pris en charge pour les paramètres." }
    s2c: { en: "`max_depth` is logged as a parameter, not as a metric.", fr: "`max_depth` est journalisé en tant que paramètre, pas en tant que métrique." }
    s2d: { en: "`max_depth` is a parameter, not a tag.", fr: "`max_depth` est un paramètre, pas une étiquette." }
    s3b: { en: "`order_by` is an argument of `search_runs` and doesn't accept `metrics.*` in Azure Machine Learning; a DataFrame has no `order_by` method.", fr: "`order_by` est un argument de `search_runs` qui n'accepte pas `metrics.*` dans Azure Machine Learning ; un DataFrame n'a pas de méthode `order_by`." }
    s3c: { en: "`sort_index` sorts on the row index, not on a metric column.", fr: "`sort_index` trie selon l'index des lignes, pas selon une colonne de métrique." }
references:
  - title: Query & compare experiments and runs with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-track-experiments-mlflow
