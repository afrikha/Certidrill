id: ai300-2a-dist-model-parallelism
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum trains a deep learning model in Azure Machine Learning. The model has grown so large that it no longer fits in the memory of a single node of the GPU compute cluster.

    You need to distribute the training across several nodes so that training can continue with this model.

    Which type of distributed training should you use?
  fr: |
    Adatum entraîne un modèle d'apprentissage profond dans Azure Machine Learning. Le modèle est devenu si volumineux qu'il ne tient plus dans la mémoire d'un seul nœud du cluster de calcul GPU.

    Vous devez répartir l'entraînement sur plusieurs nœuds pour que l'entraînement puisse continuer avec ce modèle.

    Quel type d'entraînement distribué devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Data parallelism", fr: "Le parallélisme des données" } }
    - { id: b, text: { en: "Model parallelism", fr: "Le parallélisme des modèles" } }
    - { id: c, text: { en: "A sweep job with more concurrent trials", fr: "Un travail de balayage avec plus d'essais simultanés" } }
    - { id: d, text: { en: "A parallel job that splits the input files into mini-batches", fr: "Un travail parallèle qui découpe les fichiers d'entrée en mini-lots" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In model parallelism, the model is split into parts that run concurrently on different nodes on the same data, so a model larger than one node can still be trained. It's more complex to implement than data parallelism, which is sufficient for most cases but requires the whole model to fit on each node.
    fr: |
      Dans le parallélisme des modèles, le modèle est découpé en parties qui s'exécutent simultanément sur différents nœuds avec les mêmes données : un modèle plus grand qu'un nœud peut donc toujours être entraîné. Il est plus complexe à mettre en œuvre que le parallélisme des données, qui suffit dans la plupart des cas mais exige que le modèle entier tienne sur chaque nœud.
  options:
    a:
      en: |
        Data parallelism copies the entire model to each node, so the model must fit on one node.
      fr: |
        Le parallélisme des données copie le modèle entier sur chaque nœud : le modèle doit tenir sur un nœud.
    c:
      en: |
        A sweep runs independent trials of the same model; each trial still needs the whole model on its node.
      fr: |
        Un balayage exécute des essais indépendants du même modèle ; chaque essai a toujours besoin du modèle entier sur son nœud.
    d:
      en: |
        A parallel job processes independent mini-batches of data; it doesn't split one model across nodes.
      fr: |
        Un travail parallèle traite des mini-lots de données indépendants ; il ne répartit pas un modèle sur plusieurs nœuds.
references:
  - title: Distributed training with Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-distributed-training
