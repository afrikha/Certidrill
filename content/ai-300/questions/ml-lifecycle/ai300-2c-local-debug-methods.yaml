id: ai300-2c-local-debug-methods
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data scientist at Proseware has written a new `score.py` file for a custom model. Docker Engine is installed and running on the data scientist's workstation, and the model files and conda file are stored locally.

    The data scientist needs to test the scoring script on the workstation before anything is deployed to Azure.

    Which two methods can the data scientist use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un scientifique des données de Proseware a écrit un nouveau fichier `score.py` pour un modèle personnalisé. Docker Engine est installé et en cours d'exécution sur son poste de travail, et les fichiers du modèle ainsi que le fichier conda sont stockés localement.

    Le scientifique des données doit tester le script de scoring sur son poste de travail avant tout déploiement dans Azure.

    Quelles sont les deux méthodes qu'il peut utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a local endpoint from the Endpoints page of Azure Machine Learning studio.", fr: "Créer un point de terminaison local depuis la page Points de terminaison d'Azure Machine Learning studio." } }
    - { id: b, text: { en: "Create a local endpoint and deployment by adding `--local` to the Azure CLI commands.", fr: "Créer un point de terminaison et un déploiement locaux en ajoutant `--local` aux commandes Azure CLI." } }
    - { id: c, text: { en: "Run the script with the Azure Machine Learning inference HTTP server package.", fr: "Exécuter le script avec le package de serveur HTTP d'inférence Azure Machine Learning." } }
    - { id: d, text: { en: "Deploy a local endpoint by using an ARM template with the local endpoint type.", fr: "Déployer un point de terminaison local à l'aide d'un modèle ARM avec le type de point de terminaison local." } }
    - { id: e, text: { en: "Run `az ml online-endpoint invoke` with `--deployment-name` against a new deployment that has no traffic.", fr: "Exécuter `az ml online-endpoint invoke` avec `--deployment-name` sur un nouveau déploiement sans trafic." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      The inference HTTP server (`azureml-inference-server-http`) runs the scoring script locally without a container, which is the fastest loop for script errors. A local endpoint, created with `--local` in the Azure CLI or the Python SDK, builds and runs the deployment container in the local Docker Engine.
    fr: |
      Le serveur HTTP d'inférence (`azureml-inference-server-http`) exécute le script de scoring localement sans conteneur, ce qui offre la boucle la plus rapide pour corriger les erreurs du script. Un point de terminaison local, créé avec `--local` dans Azure CLI ou le SDK Python, génère et exécute le conteneur du déploiement dans le Docker Engine local.
  options:
    a: { en: "Azure Machine Learning studio doesn't support local endpoints; only the CLI and the Python SDK do.", fr: "Azure Machine Learning studio ne prend pas en charge les points de terminaison locaux ; seuls l'interface CLI et le SDK Python le font." }
    d: { en: "ARM templates don't support local endpoints.", fr: "Les modèles ARM ne prennent pas en charge les points de terminaison locaux." }
    e: { en: "Testing a deployment by name is a good practice, but the deployment then runs in Azure, which the requirement excludes.", fr: "Tester un déploiement par son nom est une bonne pratique, mais le déploiement s'exécute alors dans Azure, ce que l'exigence exclut." }
references:
  - title: Troubleshoot online endpoint deployment and scoring
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-troubleshoot-online-endpoints
  - title: Online endpoints for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-online
