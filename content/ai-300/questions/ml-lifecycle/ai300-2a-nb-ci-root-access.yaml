id: ai300-2a-nb-ci-root-access
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace. A data scientist has a compute instance named **ci-anna** that was created with root access disabled. She explores data in notebooks on ci-anna.

    She now wants to submit quick test training jobs from her notebook and run them on a compute instance instead of a compute cluster.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning. Une data scientist dispose d'une instance de calcul nommée **ci-anna**, créée avec l'accès root désactivé. Elle explore des données dans des notebooks sur ci-anna.

    Elle veut désormais soumettre de rapides travaux d'entraînement de test depuis son notebook et les exécuter sur une instance de calcul plutôt que sur un cluster de calcul.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable root access in the settings of ci-anna, and then restart it.", fr: "Activer l'accès root dans les paramètres de ci-anna, puis la redémarrer." } }
    - { id: b, text: { en: "Assign the AzureML Compute Operator role to the data scientist on the workspace.", fr: "Attribuer le rôle AzureML Compute Operator à la data scientist sur l'espace de travail." } }
    - { id: c, text: { en: "Create a new compute instance with root access enabled and submit the jobs to it.", fr: "Créer une nouvelle instance de calcul avec l'accès root activé et lui soumettre les travaux." } }
    - { id: d, text: { en: "Enable idle shutdown on ci-anna so that it can accept queued jobs.", fr: "Activer l'arrêt en cas d'inactivité sur ci-anna pour qu'elle puisse accepter des travaux en file d'attente." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A compute instance can be the compute target of training jobs (one job per vCPU, run in containers) only if root access is enabled, and that setting must be chosen when the instance is created. Because ci-anna was created without it, you create a new compute instance with root access enabled.
    fr: |
      Une instance de calcul ne peut être la cible de calcul de travaux d'entraînement (un travail par processeur virtuel, exécuté dans des conteneurs) que si l'accès root est activé, et ce paramètre doit être choisi à la création de l'instance. Comme ci-anna a été créée sans, vous créez une nouvelle instance de calcul avec l'accès root activé.
  options:
    a:
      en: |
        Root access can't be turned on later; it must be enabled during the creation of the compute instance.
      fr: |
        L'accès root ne peut pas être activé ensuite ; il doit l'être lors de la création de l'instance de calcul.
    b:
      en: |
        A role assignment doesn't change the configuration of the compute instance, which still has root access disabled.
      fr: |
        Une attribution de rôle ne change pas la configuration de l'instance de calcul, dont l'accès root reste désactivé.
    d:
      en: |
        Idle shutdown only stops an inactive instance to save cost; it doesn't let the instance run jobs.
      fr: |
        L'arrêt en cas d'inactivité arrête seulement une instance inactive pour réduire les coûts ; il ne permet pas à l'instance d'exécuter des travaux.
references:
  - title: What is an Azure Machine Learning compute instance?
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-compute-instance
