id: ai300-2b-reg-cross-workspace
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Your company has two Azure Machine Learning workspaces: **mlw-dev**, where data scientists track training runs with MLflow, and **mlw-prod**, where models are deployed. The workspaces can use an Azure Machine Learning registry named **reg-contoso**.

    A run in mlw-dev logged an MLflow model. You need to make the model available for deployment from mlw-prod. The model must keep its link to the run that trained it.

    What should you do?
  fr: |
    Votre entreprise dispose de deux espaces de travail Azure Machine Learning : **mlw-dev**, où les scientifiques des données suivent les exécutions d'entraînement avec MLflow, et **mlw-prod**, où les modèles sont déployés. Les espaces de travail peuvent utiliser un registre Azure Machine Learning nommé **reg-contoso**.

    Une exécution dans mlw-dev a journalisé un modèle MLflow. Vous devez rendre le modèle disponible pour un déploiement depuis mlw-prod. Le modèle doit conserver son lien avec l'exécution qui l'a entraîné.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the MLflow tracking URI to mlw-prod and call `mlflow.register_model()` with the `runs:/` URI of the run.", fr: "Définir l'URI de suivi MLflow sur mlw-prod et appeler `mlflow.register_model()` avec l'URI `runs:/` de l'exécution." } }
    - { id: b, text: { en: "Register the model in mlw-dev from the run, and then share the model version to reg-contoso.", fr: "Inscrire le modèle dans mlw-dev à partir de l'exécution, puis partager la version du modèle dans reg-contoso." } }
    - { id: c, text: { en: "Download the model folder from the run and register it in mlw-prod with `az ml model create --path ./model`.", fr: "Télécharger le dossier du modèle depuis l'exécution et l'inscrire dans mlw-prod avec `az ml model create --path ./model`." } }
    - { id: d, text: { en: "Register the model in mlw-dev and move the version to the `Production` stage with `transition_model_version_stage()`.", fr: "Inscrire le modèle dans mlw-dev et faire passer la version à l'étape `Production` avec `transition_model_version_stage()`." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      MLflow can register a model only in the workspace where the run was tracked, and cross-workspace operations aren't supported. Registering in mlw-dev keeps the lineage to the run, and sharing the version to a registry makes it usable from mlw-prod while it keeps its link to the training job.
    fr: |
      MLflow ne peut inscrire un modèle que dans l'espace de travail où l'exécution a été suivie, et les opérations entre espaces de travail ne sont pas prises en charge. L'inscription dans mlw-dev conserve la traçabilité vers l'exécution, et le partage de la version dans un registre la rend utilisable depuis mlw-prod tout en gardant son lien avec le travail d'entraînement.
  options:
    a: { en: "You can only register models in the workspace where the run was tracked; the run doesn't exist in mlw-prod.", fr: "Vous ne pouvez inscrire un modèle que dans l'espace de travail où l'exécution a été suivie ; l'exécution n'existe pas dans mlw-prod." }
    c: { en: "Registering downloaded files makes the model available but loses the link to the run.", fr: "Inscrire des fichiers téléchargés rend le modèle disponible, mais perd le lien avec l'exécution." }
    d: { en: "MLflow stages are visible only through the MLflow SDK in the same workspace, and you can't deploy from a stage.", fr: "Les étapes MLflow ne sont visibles qu'avec le SDK MLflow dans le même espace de travail, et vous ne pouvez pas déployer à partir d'une étape." }
references:
  - title: Manage models registry in Azure Machine Learning with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models-mlflow
  - title: Share models, components, and environments across workspaces with registries
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
