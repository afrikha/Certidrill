id: ai300-2a-sweep-limits
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are writing the `limits` section of a sweep job YAML file in Azure Machine Learning. `max_total_trials` is already set to 40.

    The sweep must meet the following requirements:

    - The whole sweep, including all its trials, is canceled after two hours.
    - Any trial that runs for more than 15 minutes is canceled.

    Which two settings should you add? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez la section `limits` d'un fichier YAML de travail de balayage dans Azure Machine Learning. `max_total_trials` est déjà défini sur 40.

    Le balayage doit répondre aux exigences suivantes :

    - Le balayage entier, essais compris, est annulé au bout de deux heures.
    - Tout essai qui s'exécute plus de 15 minutes est annulé.

    Quels sont les deux paramètres à ajouter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "timeout: 120" }
    - { id: b, text: "trial_timeout: 900" }
    - { id: c, text: "timeout: 7200" }
    - { id: d, text: "trial_timeout: 15" }
    - { id: e, text: "max_concurrent_trials: 8" }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Both limits are in seconds. `timeout` cancels the sweep and all its trials (7,200 seconds = two hours), and `trial_timeout` cancels each trial that reaches it (900 seconds = 15 minutes). With `max_total_trials` also set, the sweep ends at whichever limit is reached first.
    fr: |
      Les deux limites sont en secondes. `timeout` annule le balayage et tous ses essais (7 200 secondes = deux heures), et `trial_timeout` annule chaque essai qui l'atteint (900 secondes = 15 minutes). Avec `max_total_trials` également défini, le balayage s'arrête à la première limite atteinte.
  options:
    a:
      en: |
        120 seconds is two minutes, not two hours.
      fr: |
        120 secondes font deux minutes, pas deux heures.
    d:
      en: |
        15 seconds is far below 15 minutes.
      fr: |
        15 secondes sont bien en dessous de 15 minutes.
    e:
      en: "`max_concurrent_trials` sets parallelism; it doesn't cancel anything."
      fr: "`max_concurrent_trials` définit le parallélisme ; il n'annule rien."
references:
  - title: CLI (v2) sweep job YAML schema
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-job-sweep
