id: ai300-2b-rai-error-cohorts
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace that contains a registered loan approval model. The model reaches 92 % accuracy on the test set, and you are generating a Responsible AI dashboard for it.

    Before the model is approved, you need to identify the subgroups of applicants for which the model has an error rate higher than the overall benchmark.

    Which dashboard component should you use?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning qui contient un modèle inscrit d'approbation de prêts. Le modèle atteint une exactitude de 92 % sur le jeu de test, et vous générez un tableau de bord Responsible AI pour ce modèle.

    Avant l'approbation du modèle, vous devez identifier les sous-groupes de demandeurs pour lesquels le modèle a un taux d'erreur supérieur à la référence globale.

    Quel composant du tableau de bord devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Causal analysis", fr: "Analyse causale (Causal analysis)" } }
    - { id: b, text: { en: "Counterfactual what-if", fr: "Simulation contrefactuelle (Counterfactual what-if)" } }
    - { id: c, text: { en: "Error analysis", fr: "Analyse des erreurs (Error analysis)" } }
    - { id: d, text: { en: "Model interpretability", fr: "Interprétabilité du modèle (Model interpretability)" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Error analysis shows how failures are distributed across the data and identifies cohorts (subsets of data) with a higher error rate than the overall benchmark. A high overall accuracy can hide subgroups where the model performs poorly, which matters for the reliability and safety principle.
    fr: |
      L'analyse des erreurs montre comment les échecs se répartissent dans les données et identifie les cohortes (sous-ensembles de données) dont le taux d'erreur dépasse la référence globale. Une exactitude globale élevée peut masquer des sous-groupes où le modèle fonctionne mal, ce qui concerne le principe de fiabilité et de sécurité.
  options:
    a: { en: "Causal analysis estimates how a real-world outcome changes when you intervene on a treatment feature; it doesn't locate model errors.", fr: "L'analyse causale estime comment un résultat réel change quand on agit sur une caractéristique de traitement ; elle ne localise pas les erreurs du modèle." }
    b: { en: "Counterfactual what-if finds the minimal changes that alter the prediction for one data point.", fr: "La simulation contrefactuelle trouve les modifications minimales qui changent la prédiction pour un point de données." }
    d: { en: "Interpretability explains which features drive predictions; it doesn't rank cohorts by error rate.", fr: "L'interprétabilité explique quelles caractéristiques déterminent les prédictions ; elle ne classe pas les cohortes selon leur taux d'erreur." }
references:
  - title: Assess AI systems by using the Responsible AI dashboard
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai-dashboard
  - title: What is Responsible AI?
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai
