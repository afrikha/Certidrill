id: ai300-2b-pipe-cli-sequence
objective: "2.1.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-northwind**. You have written three command component files (`prep.yml`, `train.yml` and `evaluate.yml`), their source code, and a file named `pipeline.yml` whose steps reference the components as `azureml:<name>:<version>`.

    You need to build a training pipeline from versioned components that other pipelines in the workspace can reuse, validate the pipeline by running it once, and then run it automatically every night.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-northwind**. Vous avez écrit trois fichiers de composants command (`prep.yml`, `train.yml` et `evaluate.yml`), leur code source et un fichier nommé `pipeline.yml` dont les étapes référencent les composants sous la forme `azureml:<name>:<version>`.

    Vous devez créer un pipeline d'entraînement à partir de composants versionnés que d'autres pipelines de l'espace de travail peuvent réutiliser, valider le pipeline en l'exécutant une fois, puis l'exécuter automatiquement chaque nuit.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: sch, text: { en: "Run `az ml schedule create --file schedule.yml` with `create_job` pointing to the pipeline.", fr: "Exécuter `az ml schedule create --file schedule.yml` avec `create_job` pointant vers le pipeline." } }
    - { id: reg, text: { en: "Run `az ml component create --file` for each component file.", fr: "Exécuter `az ml component create --file` pour chaque fichier de composant." } }
    - { id: ep, text: { en: "Run `az ml online-endpoint create` for the pipeline.", fr: "Exécuter `az ml online-endpoint create` pour le pipeline." } }
    - { id: env, text: { en: "Run `az ml environment create` for each component file.", fr: "Exécuter `az ml environment create` pour chaque fichier de composant." } }
    - { id: run, text: { en: "Run `az ml job create --file pipeline.yml` and check the job status.", fr: "Exécuter `az ml job create --file pipeline.yml` et vérifier l'état du travail." } }
    - { id: pub, text: { en: "Publish the pipeline to a pipeline endpoint.", fr: "Publier le pipeline sur un point de terminaison de pipeline." } }
answer:
  sequence: [ reg, run, sch ]
explanation:
  correct:
    en: |
      Registering the components with `az ml component create` makes them versioned workspace assets that any pipeline can reference as `azureml:<name>:<version>`. Once they exist, `az ml job create` submits a validation run, and a schedule whose `create_job` points to the pipeline file or job runs it every night.
    fr: |
      Inscrire les composants avec `az ml component create` en fait des actifs versionnés de l'espace de travail, que tout pipeline peut référencer sous la forme `azureml:<name>:<version>`. Une fois ceux-ci créés, `az ml job create` soumet une exécution de validation, et une planification dont `create_job` pointe vers le fichier ou le travail de pipeline l'exécute chaque nuit.
  options:
    pub: { en: "A schedule runs a pipeline job directly; you don't need to publish the pipeline first.", fr: "Une planification exécute directement un travail de pipeline ; il n'est pas nécessaire de publier le pipeline au préalable." }
    env: { en: "A component file is not an environment definition; components are registered with `az ml component create`.", fr: "Un fichier de composant n'est pas une définition d'environnement ; les composants s'inscrivent avec `az ml component create`." }
    ep: { en: "Online endpoints serve models for real-time inference; they don't run training pipelines.", fr: "Les points de terminaison en ligne servent des modèles pour l'inférence en temps réel ; ils n'exécutent pas de pipelines d'entraînement." }
references:
  - title: Create and run component-based ML pipelines with the Azure Machine Learning CLI
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-component-pipelines-cli
  - title: Schedule machine learning pipeline jobs
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-schedule-pipeline-job
