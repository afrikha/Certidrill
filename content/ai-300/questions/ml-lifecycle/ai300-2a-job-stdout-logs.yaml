id: ai300-2a-job-stdout-logs
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You submit a command job in an Azure Machine Learning workspace. The training script uses `print()` statements to report the number of rows it loads.

    You need to read the printed output of the job in Azure Machine Learning studio.

    Where should you look?
  fr: |
    Vous soumettez un travail de commande dans un espace de travail Azure Machine Learning. Le script d'entraînement utilise des instructions `print()` pour indiquer le nombre de lignes qu'il charge.

    Vous devez lire la sortie affichée par le travail dans Azure Machine Learning studio.

    Où devez-vous regarder ?
body:
  options:
    - { id: a, text: { en: "In the **Metrics** tab of the job", fr: "Dans l'onglet **Metrics** du travail" } }
    - { id: b, text: { en: "In the `system_logs` folder of the **Outputs + logs** tab", fr: "Dans le dossier `system_logs` de l'onglet **Outputs + logs**" } }
    - { id: c, text: { en: "In `user_logs/std_log.txt` in the **Outputs + logs** tab", fr: "Dans `user_logs/std_log.txt` de l'onglet **Outputs + logs**" } }
    - { id: d, text: { en: "In the **Models** list of the workspace", fr: "Dans la liste **Models** de l'espace de travail" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The `user_logs` folder holds the logs generated by your code; `std_log.txt` contains the stdout and stderr of the script, including print statements. You can also download all logs as a zip file from the same tab.
    fr: |
      Le dossier `user_logs` contient les journaux générés par votre code ; `std_log.txt` contient les sorties stdout et stderr du script, y compris les instructions print. Vous pouvez aussi télécharger tous les journaux dans un fichier zip depuis le même onglet.
  options:
    a:
      en: |
        The Metrics tab charts values logged with MLflow, not printed text.
      fr: |
        L'onglet Metrics affiche les valeurs enregistrées avec MLflow, pas le texte affiché.
    b:
      en: "`system_logs` holds the logs that Azure Machine Learning generates for each job stage, not your script output."
      fr: "`system_logs` contient les journaux qu'Azure Machine Learning génère pour chaque étape du travail, pas la sortie de votre script."
    d:
      en: |
        The model list shows registered models, not job logs.
      fr: |
        La liste des modèles affiche les modèles inscrits, pas les journaux des travaux.
references:
  - title: Log metrics, parameters, and files with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-log-view-metrics
