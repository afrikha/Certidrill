id: ai300-2a-mlflow-many-metrics
objective: "2.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-adatum**. A command job runs a training script on a compute cluster. The job environment includes MLflow 2.12 and `azureml-mlflow` 1.57.

    The script calls `mlflow.log_metric("batch_loss", value)` inside the training loop and logs about 200,000 values per job. Logging now slows training noticeably.

    You need to reduce the time that the script spends on logging. Every value must still be recorded.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-adatum**. Un travail de commande exécute un script d'entraînement sur un cluster de calcul. L'environnement du travail comprend MLflow 2.12 et `azureml-mlflow` 1.57.

    Le script appelle `mlflow.log_metric("batch_loss", value)` dans la boucle d'entraînement et enregistre environ 200 000 valeurs par travail. La journalisation ralentit désormais nettement l'entraînement.

    Vous devez réduire le temps que le script passe à journaliser. Toutes les valeurs doivent toujours être enregistrées.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Collect the values and send them in groups by using `MlflowClient().log_batch()`.", fr: "Collecter les valeurs et les envoyer par groupes avec `MlflowClient().log_batch()`." }
    - id: b
      text: { en: "Replace each `mlflow.log_metric()` call with `mlflow.log_param()`.", fr: "Remplacer chaque appel à `mlflow.log_metric()` par `mlflow.log_param()`." }
    - id: c
      text: { en: "Call `mlflow.autolog(log_models=False)` at the start of the script.", fr: "Appeler `mlflow.autolog(log_models=False)` au début du script." }
    - id: d
      text: { en: "Call `mlflow.config.enable_async_logging()` at the start of the script.", fr: "Appeler `mlflow.config.enable_async_logging()` au début du script." }
    - id: e
      text: { en: "Set the `MLFLOW_TRACKING_URI` variable in the environment variables of the job.", fr: "Définir la variable `MLFLOW_TRACKING_URI` dans les variables d'environnement du travail." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Microsoft advises against calling `log_metric` in loops for many values. `log_batch` sends many metric values in one request, and asynchronous logging returns control as soon as each call is accepted (it needs MLflow 2.8.0 or later and `azureml-mlflow` 1.55 or later, which the environment meets). Azure Machine Learning waits for pending values to be persisted before the job finishes.
    fr: |
      Microsoft déconseille d'appeler `log_metric` dans des boucles pour de nombreuses valeurs. `log_batch` envoie de nombreuses valeurs de métriques en une seule requête, et la journalisation asynchrone rend la main dès que chaque appel est accepté (elle demande MLflow 2.8.0 ou ultérieur et `azureml-mlflow` 1.55 ou ultérieur, ce que l'environnement respecte). Azure Machine Learning attend que les valeurs en attente soient persistées avant la fin du travail.
  options:
    b:
      en: |
        Parameters hold configuration values, one value per key; they can't record 200,000 values of a curve.
      fr: |
        Les paramètres contiennent des valeurs de configuration, une valeur par clé ; ils ne peuvent pas enregistrer les 200 000 valeurs d'une courbe.
    c:
      en: |
        Autologging adds framework logging; it doesn't speed up the explicit `log_metric` calls in the loop.
      fr: |
        La journalisation automatique ajoute la journalisation du framework ; elle n'accélère pas les appels explicites à `log_metric` dans la boucle.
    e:
      en: |
        Jobs on Azure Machine Learning compute already have the tracking URI; setting it again changes nothing about logging speed.
      fr: |
        Les travaux sur le calcul Azure Machine Learning ont déjà l'URI de suivi ; le redéfinir ne change rien à la vitesse de journalisation.
references:
  - title: Log metrics, parameters, and files with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-log-view-metrics
