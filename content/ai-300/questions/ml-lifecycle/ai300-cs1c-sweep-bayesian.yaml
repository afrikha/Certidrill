id: ai300-cs1c-sweep-bayesian
objective: "2.1.4"
type: dropdown
caseStudy: ai300-cs1c-trey-research
difficulty: 3
status: draft
stem:
  en: |
    You are writing the sweep job YAML that tunes LesionSeg. The trial section is complete and isn't shown.

    How should you complete the YAML to meet the tuning requirements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez le YAML du travail de balayage (sweep) qui règle LesionSeg. La section trial est complète et n'est pas affichée.

    Comment devez-vous compléter le YAML pour respecter les exigences de réglage ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    $schema: https://azuremlschemas.azureedge.net/latest/sweepJob.schema.json
    type: sweep
    compute: azureml:gpu-cluster
    experiment_name: lesion-seg
    sampling_algorithm: [[sampling]]
    search_space:
      learning_rate:
        type: [[lrtype]]
        min_value: 0.0001
        max_value: 0.01
      batch_size:
        type: choice
        values: [8, 16, 32]
    objective:
      goal: maximize
      primary_metric: val_dice
    limits:
      max_total_trials: [[trials]]
      max_concurrent_trials: 2
  slots:
    - id: sampling
      options:
        - { id: random, text: "random" }
        - { id: bayesian, text: "bayesian" }
        - { id: grid, text: "grid" }
    - id: lrtype
      options:
        - { id: uniform, text: "uniform" }
        - { id: loguniform, text: "loguniform" }
        - { id: normal, text: "normal" }
        - { id: choice, text: "choice" }
    - id: trials
      options:
        - { id: t20, text: "20" }
        - { id: t40, text: "40" }
        - { id: t60, text: "60" }
        - { id: t100, text: "100" }
answer:
  values: { sampling: bayesian, lrtype: uniform, trials: t40 }
explanation:
  correct:
    en: "Bayesian sampling selects new samples based on the results of earlier trials. It supports only the `choice`, `uniform` and `quniform` distributions, so the continuous learning rate must use `uniform`. Microsoft recommends setting the maximum number of trials to at least 20 times the number of tuned hyperparameters: with two hyperparameters, the minimum is 40."
    fr: "L'échantillonnage bayésien choisit de nouveaux échantillons en fonction des résultats des essais précédents. Il ne prend en charge que les distributions `choice`, `uniform` et `quniform` ; le taux d'apprentissage continu doit donc utiliser `uniform`. Microsoft recommande de fixer le nombre maximal d'essais à au moins 20 fois le nombre d'hyperparamètres réglés : avec deux hyperparamètres, le minimum est de 40."
  options:
    random: { en: "Random sampling picks values independently of the earlier results.", fr: "L'échantillonnage aléatoire choisit des valeurs indépendamment des résultats précédents." }
    grid: { en: "Grid sampling supports only `choice` hyperparameters and doesn't use earlier results.", fr: "L'échantillonnage par grille ne prend en charge que des hyperparamètres `choice` et n'utilise pas les résultats précédents." }
    loguniform: { en: "Bayesian sampling doesn't support `loguniform`.", fr: "L'échantillonnage bayésien ne prend pas en charge `loguniform`." }
    normal: { en: "Bayesian sampling doesn't support `normal`, and a normal distribution isn't bounded by a minimum and a maximum.", fr: "L'échantillonnage bayésien ne prend pas en charge `normal`, et une distribution normale n'est pas bornée par un minimum et un maximum." }
    choice: { en: "`choice` takes a list of discrete values, not a continuous range defined by min_value and max_value.", fr: "`choice` prend une liste de valeurs discrètes, pas une plage continue définie par min_value et max_value." }
    t20: { en: "20 trials follow the recommendation for one hyperparameter only.", fr: "20 essais respectent la recommandation pour un seul hyperparamètre." }
    t60: { en: "60 trials follow the recommendation but aren't the minimum.", fr: "60 essais respectent la recommandation mais ne sont pas le minimum." }
    t100: { en: "100 trials follow the recommendation but aren't the minimum.", fr: "100 essais respectent la recommandation mais ne sont pas le minimum." }
references:
  - title: Hyperparameter tuning a model (v2)
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-tune-hyperparameters
