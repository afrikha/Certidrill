id: ai300-2c-drift-signal-inputs
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a loan approval model deployed to a managed online endpoint. Production inputs and outputs are collected. A marketing campaign now attracts much younger applicants, and the analysts suspect that the age and income values sent to the model no longer look like the training data. Whether each loan is repaid will only be known in 12 months.

    You need to configure model monitoring to detect this change now.

    Which monitoring signal should you use?
  fr: |
    Contoso dispose d'un modèle d'approbation de prêts déployé sur un point de terminaison en ligne managé. Les entrées et les sorties de production sont collectées. Une campagne marketing attire désormais des demandeurs beaucoup plus jeunes, et les analystes soupçonnent que les valeurs d'âge et de revenu envoyées au modèle ne ressemblent plus aux données d'entraînement. Le remboursement de chaque prêt ne sera connu que dans 12 mois.

    Vous devez configurer la surveillance du modèle pour détecter ce changement dès maintenant.

    Quel signal de surveillance devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Data drift", fr: "Dérive des données (data drift)" } }
    - { id: b, text: { en: "Prediction drift", fr: "Dérive des prédictions (prediction drift)" } }
    - { id: c, text: { en: "Data quality", fr: "Qualité des données (data quality)" } }
    - { id: d, text: { en: "Model performance", fr: "Performances du modèle (model performance)" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The data drift signal compares the distribution of the model inputs in production with reference data such as the training data, feature by feature. It needs no labels, so it detects the shift in age and income now, long before repayments are known.
    fr: |
      Le signal de dérive des données compare, caractéristique par caractéristique, la distribution des entrées du modèle en production avec des données de référence comme les données d'entraînement. Il ne nécessite aucune étiquette : il détecte donc dès maintenant le changement d'âge et de revenu, bien avant que les remboursements soient connus.
  options:
    b: { en: "Prediction drift compares the distribution of the model outputs, not of the input features.", fr: "La dérive des prédictions compare la distribution des sorties du modèle, pas celle des caractéristiques d'entrée." }
    c: { en: "Data quality measures null values, data type errors and out-of-bounds values, not a change in distribution.", fr: "La qualité des données mesure les valeurs nulles, les erreurs de type de données et les valeurs hors limites, pas un changement de distribution." }
    d: { en: "Model performance requires ground truth data, which won't exist for 12 months.", fr: "Les performances du modèle nécessitent des données de vérité terrain, qui n'existeront pas avant 12 mois." }
references:
  - title: Model monitoring in production
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-model-monitoring
