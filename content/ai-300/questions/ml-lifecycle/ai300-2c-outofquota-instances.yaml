id: ai300-2c-outofquota-instances
objective: "2.3.2"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Adatum has an Azure Machine Learning workspace. You create a managed online deployment that uses the **Standard_DS3_v2** VM size (4 cores) with `instance_count: 4`. The deployment fails with the error **OutOfQuota**.

    The subscription has 16 cores of available quota for this VM family in the region, and you cannot request more quota this week. No other deployment uses this quota.

    What is the highest `instance_count` that you can set so that the deployment succeeds?
  fr: |
    Adatum dispose d'un espace de travail Azure Machine Learning. Vous créez un déploiement en ligne managé qui utilise la taille de machine virtuelle **Standard_DS3_v2** (4 cœurs) avec `instance_count: 4`. Le déploiement échoue avec l'erreur **OutOfQuota**.

    L'abonnement dispose de 16 cœurs de quota disponible pour cette famille de machines virtuelles dans la région, et vous ne pouvez pas demander davantage de quota cette semaine. Aucun autre déploiement n'utilise ce quota.

    Quelle est la valeur maximale de `instance_count` que vous pouvez définir pour que le déploiement réussisse ?
body:
  options:
    - { id: a, text: "2" }
    - { id: b, text: "3" }
    - { id: c, text: "4" }
    - { id: d, text: "5" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Managed online endpoints reserve 20 percent extra capacity for upgrades, and the quota needed is ceil(1.2 × instances) × cores of the SKU. With 3 instances, ceil(3.6) = 4 VMs × 4 cores = 16 cores, which fits. With 4 instances, ceil(4.8) = 5 VMs × 4 cores = 20 cores, which explains the failure.
    fr: |
      Les points de terminaison en ligne managés réservent 20 % de capacité supplémentaire pour les mises à niveau, et le quota nécessaire vaut ceil(1,2 × instances) × cœurs de la référence SKU. Avec 3 instances, ceil(3,6) = 4 machines virtuelles × 4 cœurs = 16 cœurs, ce qui tient dans le quota. Avec 4 instances, ceil(4,8) = 5 machines virtuelles × 4 cœurs = 20 cœurs, ce qui explique l'échec.
  options:
    a: { en: "Two instances need ceil(2.4) × 4 = 12 cores; it works but isn't the highest value that fits.", fr: "Deux instances nécessitent ceil(2,4) × 4 = 12 cœurs ; cela fonctionne mais ce n'est pas la valeur maximale possible." }
    c: { en: "Four instances need 20 cores because of the 20 percent reserved for upgrades; this is the failing configuration.", fr: "Quatre instances nécessitent 20 cœurs à cause des 20 % réservés aux mises à niveau ; c'est la configuration en échec." }
    d: { en: "Five instances need ceil(6) × 4 = 24 cores, above the available quota.", fr: "Cinq instances nécessitent ceil(6) × 4 = 24 cœurs, au-delà du quota disponible." }
references:
  - title: Online endpoints for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-online
  - title: Troubleshoot online endpoint deployment and scoring
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-troubleshoot-online-endpoints
