id: ai300-2b-rai-statements
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace. You plan to evaluate several tabular classification models with Responsible AI dashboards before you approve them for production.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning. Vous prévoyez d'évaluer plusieurs modèles de classification tabulaire avec des tableaux de bord Responsible AI avant de les approuver pour la production.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can attach several Responsible AI dashboards, each with a different combination of components, to the same registered model.
        fr: Vous pouvez associer plusieurs tableaux de bord Responsible AI, chacun avec une combinaison de composants différente, au même modèle inscrit.
    - id: s2
      text:
        en: By default, the dashboard displays at most 5,000 rows of the test dataset.
        fr: Par défaut, le tableau de bord affiche au maximum 5 000 lignes du jeu de données de test.
    - id: s3
      text:
        en: You can generate a Responsible AI dashboard for the MLflow model produced by an automated ML job.
        fr: Vous pouvez générer un tableau de bord Responsible AI pour le modèle MLflow produit par un travail de ML automatisé.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Several dashboards with different components can be attached to a registered model and listed on its Responsible AI tab. The constructor's `maximum_rows_for_test_dataset` defaults to 5,000 for performance reasons. The dashboard doesn't support the AutoML MLflow model or AutoML models registered from the UI.
    fr: |
      Plusieurs tableaux de bord avec des composants différents peuvent être associés à un modèle inscrit et listés dans son onglet Responsible AI. Le paramètre `maximum_rows_for_test_dataset` du constructeur vaut 5 000 par défaut pour des raisons de performances. Le tableau de bord ne prend pas en charge le modèle MLflow AutoML ni les modèles AutoML inscrits depuis l'interface utilisateur.
references:
  - title: Use the Responsible AI dashboard in Azure Machine Learning studio
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-responsible-ai-dashboard
  - title: Assess AI systems by using the Responsible AI dashboard
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai-dashboard
