id: ai300-2b-reg-log-artifact
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace. A training script for a scikit-learn model ends with the following code:

    ```python
    joblib.dump(model, "model.pkl")
    mlflow.log_artifact("model.pkl")
    ```

    You need to change the script so that the job produces an MLflow model that you can register as `mlflow_model`, deploy to an online endpoint without a scoring script, and test from the **Test** tab of the studio.

    Which change should you make?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning. Un script d'entraînement de modèle scikit-learn se termine par le code suivant :

    ```python
    joblib.dump(model, "model.pkl")
    mlflow.log_artifact("model.pkl")
    ```

    Vous devez modifier le script pour que le travail produise un modèle MLflow que vous pouvez inscrire en tant que `mlflow_model`, déployer sur un point de terminaison en ligne sans script de scoring et tester depuis l'onglet **Test** du studio.

    Quelle modification devez-vous apporter ?
body:
  options:
    - { id: a, text: { en: "Add `mlflow.log_dict({\"flavor\": \"sklearn\"}, \"MLmodel\")` after `log_artifact`.", fr: "Ajouter `mlflow.log_dict({\"flavor\": \"sklearn\"}, \"MLmodel\")` après `log_artifact`." } }
    - { id: b, text: { en: "Replace both lines with `mlflow.sklearn.log_model(model, \"model\")`.", fr: "Remplacer les deux lignes par `mlflow.sklearn.log_model(model, \"model\")`." } }
    - { id: c, text: { en: "Replace `mlflow.log_artifact` with `mlflow.log_artifacts(\"outputs\")` after saving the file to `outputs`.", fr: "Remplacer `mlflow.log_artifact` par `mlflow.log_artifacts(\"outputs\")` après avoir enregistré le fichier dans `outputs`." } }
    - { id: d, text: { en: "Add `mlflow.autolog(log_models=False)` at the start of the script and keep both lines.", fr: "Ajouter `mlflow.autolog(log_models=False)` au début du script et conserver les deux lignes." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `log_artifact` stores a plain file with no contract about how to load it. A flavor-specific method such as `mlflow.sklearn.log_model()` saves an MLflow model folder with its MLmodel file and environment, which allows deployment without a scoring script or an environment and generates a swagger file for the Test feature.
    fr: |
      `log_artifact` stocke un simple fichier, sans contrat sur la façon de le charger. Une méthode propre à une saveur, comme `mlflow.sklearn.log_model()`, enregistre un dossier de modèle MLflow avec son fichier MLmodel et son environnement, ce qui permet le déploiement sans script de scoring ni environnement et génère un fichier swagger pour la fonctionnalité Test.
  options:
    c: { en: "`log_artifacts` logs the content of a folder as plain files; it still doesn't create an MLflow model.", fr: "`log_artifacts` journalise le contenu d'un dossier sous forme de simples fichiers ; il ne crée toujours pas de modèle MLflow." }
    d: { en: "With `log_models=False`, autolog logs metrics and parameters but not the model.", fr: "Avec `log_models=False`, autolog journalise les métriques et les paramètres, mais pas le modèle." }
    a: { en: "A hand-written file named MLmodel doesn't describe how to load the model and isn't produced by a flavor.", fr: "Un fichier MLmodel écrit à la main ne décrit pas comment charger le modèle et n'est pas produit par une saveur." }
references:
  - title: Artifacts and models in MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-mlflow-models
