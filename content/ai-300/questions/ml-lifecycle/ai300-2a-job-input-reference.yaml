id: ai300-2a-job-input-reference
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are writing a command job YAML file for Azure Machine Learning. The `inputs` section contains a literal input named **learning_rate** with the value 0.01.

    You need to pass this value to the `--lr` argument of `train.py` in the `command` key.

    Which expression should you use?
  fr: |
    Vous écrivez un fichier YAML de travail de commande pour Azure Machine Learning. La section `inputs` contient une entrée littérale nommée **learning_rate** avec la valeur 0.01.

    Vous devez passer cette valeur à l'argument `--lr` de `train.py` dans la clé `command`.

    Quelle expression devez-vous utiliser ?
body:
  options:
    - { id: a, text: "--lr ${{search_space.learning_rate}}" }
    - { id: b, text: "--lr ${{parent.inputs.learning_rate}}" }
    - { id: c, text: "--lr ${{outputs.learning_rate}}" }
    - { id: d, text: "--lr ${{inputs.learning_rate}}" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In a command job, the command references inputs with `${{inputs.<input_name>}}` and output paths with `${{outputs.<output_name>}}`. Azure Machine Learning replaces the expression with the value 0.01 at run time.
    fr: |
      Dans un travail de commande, la commande référence les entrées avec `${{inputs.<input_name>}}` et les chemins de sortie avec `${{outputs.<output_name>}}`. Azure Machine Learning remplace l'expression par la valeur 0.01 à l'exécution.
  options:
    a:
      en: "`search_space` values exist only in the trial of a sweep job."
      fr: "Les valeurs `search_space` n'existent que dans l'essai d'un travail de balayage."
    b:
      en: "`parent.inputs` binds a pipeline-level input to a step of a pipeline job."
      fr: "`parent.inputs` lie une entrée au niveau du pipeline à une étape d'un travail de pipeline."
    c:
      en: |
        learning_rate is an input, not an output.
      fr: |
        learning_rate est une entrée, pas une sortie.
references:
  - title: CLI (v2) command job YAML schema
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-job-command
