id: ai300-2c-blue-green-order
objective: "2.3.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has a managed online endpoint named **ep-ship**. A deployment named **blue** runs model version 2 and receives 100 percent of the traffic. You need to roll out model version 3 progressively.

    The solution must meet the following requirements:

    - Validate the new model on real production requests before any client receives its predictions.
    - Expose a small share of clients before all of them.
    - Keep blue available for an immediate rollback at the end of the procedure.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin dispose d'un point de terminaison en ligne managé nommé **ep-ship**. Un déploiement nommé **blue** exécute la version 2 du modèle et reçoit 100 % du trafic. Vous devez déployer progressivement la version 3 du modèle.

    La solution doit répondre aux exigences suivantes :

    - Valider le nouveau modèle sur des requêtes de production réelles avant qu'un client ne reçoive ses prédictions.
    - Exposer une petite partie des clients avant l'ensemble.
    - Conserver blue disponible pour une restauration immédiate à la fin de la procédure.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: create, text: { en: "Create a deployment named green for model version 3 without allocating traffic to it.", fr: "Créer un déploiement nommé green pour la version 3 du modèle sans lui attribuer de trafic." } }
    - { id: test, text: { en: "Invoke the endpoint with `--deployment-name green` and a sample request.", fr: "Appeler le point de terminaison avec `--deployment-name green` et une requête d'exemple." } }
    - { id: mirror, text: { en: "Mirror 10 percent of the traffic to green and review its metrics and logs.", fr: "Mettre en miroir 10 % du trafic vers green et examiner ses métriques et ses journaux." } }
    - { id: canary, text: { en: "Set the mirror to 0 and set the traffic to blue=90 green=10.", fr: "Ramener le miroir à 0 et définir le trafic à blue=90 green=10." } }
    - { id: full, text: { en: "Set the traffic to blue=0 green=100.", fr: "Définir le trafic à blue=0 green=100." } }
    - { id: alltraffic, text: { en: "Create green with the `--all-traffic` parameter.", fr: "Créer green avec le paramètre `--all-traffic`." } }
    - { id: delete, text: { en: "Delete the blue deployment.", fr: "Supprimer le déploiement blue." } }
answer:
  sequence: [ create, test, mirror, canary, full ]
explanation:
  correct:
    en: |
      A new deployment starts with no traffic, so you can first test it directly by name, then shadow it with mirrored traffic (clients still get blue's answers), then expose 10 percent of live requests, and finally all of them. The mirror must be removed before green receives live traffic, and blue is kept so that `blue=100 green=0` remains an instant rollback.
    fr: |
      Un nouveau déploiement démarre sans trafic : vous pouvez d'abord le tester directement par son nom, puis le soumettre à du trafic en miroir (les clients reçoivent toujours les réponses de blue), puis exposer 10 % des requêtes réelles, et enfin la totalité. Le miroir doit être supprimé avant que green reçoive du trafic réel, et blue est conservé pour que `blue=100 green=0` reste une restauration immédiate.
  options:
    alltraffic: { en: "--all-traffic sends 100 percent of the traffic to green immediately, before any validation.", fr: "--all-traffic envoie immédiatement 100 % du trafic vers green, avant toute validation." }
    delete: { en: "Deleting blue removes the instant rollback that the requirements ask to keep.", fr: "Supprimer blue retire la restauration immédiate que les exigences demandent de conserver." }
references:
  - title: Perform safe rollout of new deployments for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
