id: ai300-2b-frs-lineage
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning project workspace connected to a managed feature store. A training pipeline uses the built-in feature retrieval component to generate training data, then trains and registers a model named **churn-fs**.

    On the model details page, the **Feature sets** tab of churn-fs is empty, and the feature sets in the feature store don't list the model. You need the next registered version to show its dependency on the feature sets.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail de projet Azure Machine Learning connecté à un magasin de caractéristiques managé. Un pipeline d'entraînement utilise le composant intégré de récupération de caractéristiques pour générer les données d'entraînement, puis entraîne et inscrit un modèle nommé **churn-fs**.

    Dans la page de détails du modèle, l'onglet **Feature sets** de churn-fs est vide, et les ensembles de caractéristiques du magasin ne mentionnent pas le modèle. La prochaine version inscrite doit afficher sa dépendance envers les ensembles de caractéristiques.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Register the model with the type `mlflow_model` instead of `custom_model`, with no change to the training script.", fr: "Inscrire le modèle avec le type `mlflow_model` au lieu de `custom_model`, sans modifier le script d'entraînement." } }
    - { id: b, text: { en: "Share the model version to an Azure Machine Learning registry.", fr: "Partager la version du modèle dans un registre Azure Machine Learning." } }
    - { id: c, text: { en: "Enable offline materialization on the feature sets that the model uses.", fr: "Activer la matérialisation hors connexion sur les ensembles de caractéristiques utilisés par le modèle." } }
    - { id: d, text: { en: "Update the training script to copy `feature_retrieval_spec.yaml` from the training data folder to the model output folder.", fr: "Modifier le script d'entraînement pour copier `feature_retrieval_spec.yaml` du dossier des données d'entraînement vers le dossier de sortie du modèle." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      For a model registered in a workspace, the link to feature sets is tracked only if the feature retrieval specification exists in the model artifact. The built-in component writes the specification to the root of its output data, so the training code must copy it to the model output folder before registration.
    fr: |
      Pour un modèle inscrit dans un espace de travail, le lien vers les ensembles de caractéristiques n'est suivi que si la spécification de récupération de caractéristiques existe dans l'artefact du modèle. Le composant intégré écrit la spécification à la racine de ses données de sortie : le code d'entraînement doit donc la copier dans le dossier de sortie du modèle avant l'inscription.
  options:
    a: { en: "The model type doesn't create the link to feature sets; the specification file inside the artifact does.", fr: "Le type de modèle ne crée pas le lien vers les ensembles de caractéristiques ; c'est le fichier de spécification présent dans l'artefact qui le crée." }
    c: { en: "Materialization precomputes feature values in the stores; it doesn't link a model to its feature sets.", fr: "La matérialisation précalcule les valeurs des caractéristiques dans les magasins ; elle ne lie pas un modèle à ses ensembles de caractéristiques." }
    b: { en: "Sharing copies the model to a registry but doesn't add a specification that the artifact doesn't contain.", fr: "Le partage copie le modèle dans un registre, mais n'ajoute pas une spécification que l'artefact ne contient pas." }
references:
  - title: Feature retrieval specification and usage in training and inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/feature-retrieval-concepts
  - title: "Tutorial 2: Experiment and train models by using features"
    url: https://learn.microsoft.com/en-us/azure/machine-learning/tutorial-experiment-train-models-using-features
