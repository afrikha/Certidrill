id: ai300-2b-cmp-or-filter
objective: "2.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace. Training runs in an experiment named **fraud-models** are tagged with `framework`, whose value is `xgboost`, `lightgbm` or `sklearn`.

    You need to build a single pandas DataFrame that contains only the runs tagged `xgboost` or `lightgbm`, so that you can compare their metrics. The following filter is rejected:

    ```python
    filter_string="tags.framework = 'xgboost' OR tags.framework = 'lightgbm'"
    ```

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning. Les exécutions d'entraînement d'une expérience nommée **fraud-models** possèdent une étiquette `framework` dont la valeur est `xgboost`, `lightgbm` ou `sklearn`.

    Vous devez créer un seul DataFrame pandas qui ne contient que les exécutions étiquetées `xgboost` ou `lightgbm`, afin de comparer leurs métriques. Le filtre suivant est refusé :

    ```python
    filter_string="tags.framework = 'xgboost' OR tags.framework = 'lightgbm'"
    ```

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace `OR` with `AND` in the filter string.", fr: "Remplacer `OR` par `AND` dans la chaîne de filtre." } }
    - { id: b, text: { en: "Run one `search_runs` query per tag value and concatenate the two DataFrames with `pandas.concat`.", fr: "Exécuter une requête `search_runs` par valeur d'étiquette et concaténer les deux DataFrames avec `pandas.concat`." } }
    - { id: c, text: { en: "Add `search_all_experiments=True` to the query and keep the filter.", fr: "Ajouter `search_all_experiments=True` à la requête et conserver le filtre." } }
    - { id: d, text: { en: "Use the filter `tags.framework != 'sklearn'` in a single `search_runs` query.", fr: "Utiliser le filtre `tags.framework != 'sklearn'` dans une seule requête `search_runs`." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Machine Learning supports only `AND` in MLflow filter strings; `OR` isn't supported. Running one query for each value and concatenating the results gives the same set of runs in one DataFrame.
    fr: |
      Azure Machine Learning ne prend en charge que `AND` dans les chaînes de filtre MLflow ; `OR` n'est pas pris en charge. Exécuter une requête par valeur et concaténer les résultats donne le même ensemble d'exécutions dans un seul DataFrame.
  options:
    d: { en: "The `!=` operator isn't supported for tags in Azure Machine Learning.", fr: "L'opérateur `!=` n'est pas pris en charge pour les étiquettes dans Azure Machine Learning." }
    a: { en: "A run has a single value for the tag, so both conditions can never be true at the same time and the query returns no runs.", fr: "Une exécution n'a qu'une valeur pour l'étiquette : les deux conditions ne peuvent jamais être vraies ensemble et la requête ne renvoie aucune exécution." }
    c: { en: "Widening the search scope doesn't make the `OR` operator supported.", fr: "Élargir l'étendue de la recherche ne rend pas l'opérateur `OR` pris en charge." }
references:
  - title: Query & compare experiments and runs with MLflow
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-track-experiments-mlflow
