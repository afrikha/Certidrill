id: ai300-2c-weekly-retrain-schedule
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, based in Paris, has a retraining pipeline defined in the file `retrain-pipeline.yml` in an Azure Machine Learning workspace.

    You need the pipeline to run every Monday at 02:00 Paris time. The solution must minimize administrative effort.

    What should you create?
  fr: |
    Fabrikam, basée à Paris, dispose d'un pipeline de réentraînement défini dans le fichier `retrain-pipeline.yml` d'un espace de travail Azure Machine Learning.

    Vous devez faire en sorte que le pipeline s'exécute chaque lundi à 02:00, heure de Paris. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A schedule with a cron trigger `0 2 * * 1` and `time_zone: \"W. Europe Standard Time\"`", fr: "Une planification avec un déclencheur cron `0 2 * * 1` et `time_zone: \"W. Europe Standard Time\"`" } }
    - { id: b, text: { en: "A schedule with a cron trigger `0 2 * * 1` and no `time_zone` value", fr: "Une planification avec un déclencheur cron `0 2 * * 1` et sans valeur `time_zone`" } }
    - { id: c, text: { en: "An Event Grid subscription on the workspace for the **Run completed** event", fr: "Un abonnement Event Grid sur l'espace de travail pour l'événement **Run completed**" } }
    - { id: d, text: { en: "A model monitor schedule with `create_monitor` and a weekly recurrence", fr: "Une planification de surveillance de modèle avec `create_monitor` et une récurrence hebdomadaire" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An Azure Machine Learning schedule runs a pipeline job on a time-based trigger. The cron expression `0 2 * * 1` means minute 0, hour 2, every Monday, and `time_zone` makes it Paris time; `create_job` points to the pipeline file.
    fr: |
      Une planification Azure Machine Learning exécute un travail de pipeline selon un déclencheur temporel. L'expression cron `0 2 * * 1` signifie minute 0, heure 2, chaque lundi, et `time_zone` la place à l'heure de Paris ; `create_job` désigne le fichier du pipeline.
  options:
    b: { en: "Without time_zone, a schedule uses UTC, so the job wouldn't start at 02:00 Paris time.", fr: "Sans time_zone, une planification utilise UTC : le travail ne démarrerait pas à 02:00, heure de Paris." }
    c: { en: "Event Grid reacts to workspace events, not to a time of day, and schedules don't support event triggers.", fr: "Event Grid réagit aux événements de l'espace de travail, pas à une heure de la journée, et les planifications ne prennent pas en charge les déclencheurs d'événements." }
    d: { en: "create_monitor runs monitoring signals; a retraining pipeline is started with create_job.", fr: "create_monitor exécute des signaux de surveillance ; un pipeline de réentraînement se lance avec create_job." }
references:
  - title: Schedule machine learning pipeline jobs
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-schedule-pipeline-job
