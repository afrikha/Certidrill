id: ai300-2c-instant-rollback
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a managed online endpoint named **ep-credit** with two deployments: **blue** runs model version 4 and **green** runs model version 5. Both deployments have three instances.

    Ten minutes ago you ran `az ml online-endpoint update --name ep-credit --traffic "blue=0 green=100"`. Since then, the business rules team reports wrong credit decisions.

    You need to return all clients to model version 4 as quickly as possible.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un point de terminaison en ligne managé nommé **ep-credit** avec deux déploiements : **blue** exécute la version 4 du modèle et **green** la version 5. Les deux déploiements ont trois instances.

    Il y a dix minutes, vous avez exécuté `az ml online-endpoint update --name ep-credit --traffic "blue=0 green=100"`. Depuis, l'équipe des règles métier signale des décisions de crédit erronées.

    Vous devez ramener tous les clients vers la version 4 du modèle le plus rapidement possible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Update green with `--set model=azureml:credit-model:4`.", fr: "Mettre à jour green avec `--set model=azureml:credit-model:4`." } }
    - { id: b, text: { en: "Run `az ml online-endpoint update` with `--mirror-traffic \"blue=100\"`.", fr: "Exécuter `az ml online-endpoint update` avec `--mirror-traffic \"blue=100\"`." } }
    - { id: c, text: { en: "Run `az ml online-endpoint update` with `--traffic \"blue=100 green=0\"`.", fr: "Exécuter `az ml online-endpoint update` avec `--traffic \"blue=100 green=0\"`." } }
    - { id: d, text: { en: "Delete green, and then create a new deployment of model version 4.", fr: "Supprimer green, puis créer un nouveau déploiement de la version 4 du modèle." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Because blue still exists with its instances, rolling back is only a traffic change: allocating 100 percent to blue makes the endpoint route every new request to model version 4 again. Keeping the previous deployment until the new one has proved itself is what makes this rollback immediate.
    fr: |
      Comme blue existe toujours avec ses instances, la restauration n'est qu'un changement de trafic : attribuer 100 % à blue fait de nouveau acheminer chaque nouvelle requête vers la version 4 du modèle. C'est le fait de conserver l'ancien déploiement jusqu'à ce que le nouveau ait fait ses preuves qui rend cette restauration immédiate.
  options:
    a: { en: "Updating green replaces its model through a rolling update of 20 percent of the nodes at a time, which is much slower than a traffic change.", fr: "Mettre à jour green remplace son modèle par une mise à jour progressive de 20 % des nœuds à la fois, ce qui est bien plus lent qu'un changement de trafic." }
    b: { en: "Mirroring copies requests without changing the responses, is limited to 50 percent, and a deployment can't receive mirrored traffic while it receives live traffic.", fr: "La mise en miroir copie des requêtes sans changer les réponses, elle est limitée à 50 %, et un déploiement ne peut pas recevoir de trafic en miroir pendant qu'il reçoit du trafic réel." }
    d: { en: "Creating a deployment takes minutes, and blue, which already runs version 4, would still receive no traffic until you change the traffic rules.", fr: "Créer un déploiement prend plusieurs minutes, et blue, qui exécute déjà la version 4, ne recevrait toujours aucun trafic tant que vous ne modifiez pas les règles de trafic." }
references:
  - title: Perform safe rollout of new deployments for real-time inference
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-safely-rollout-online-endpoints
