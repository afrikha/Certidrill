id: ai300-1a-cmp-on-behalf
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Ana is a new data scientist at Contoso. She has the AzureML Data Scientist role on the Azure Machine Learning workspace **mlw-contoso**, which doesn't allow her to create compute.

    As a workspace administrator, you need to provide Ana with a compute instance for notebook development. Ana must be the only user of the instance, and she must not receive permissions to create compute.

    What should you do?
  fr: |
    Ana est une nouvelle data scientist de Contoso. Elle a le rôle AzureML Data Scientist sur l'espace de travail Azure Machine Learning **mlw-contoso**, qui ne lui permet pas de créer de calcul.

    En tant qu'administrateur de l'espace de travail, vous devez fournir à Ana une instance de calcul pour développer dans des notebooks. Ana doit être la seule utilisatrice de l'instance, et elle ne doit pas recevoir d'autorisations de création de calcul.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create the compute instance with your account, and then share its Jupyter link with Ana.", fr: "Créer l'instance de calcul avec votre compte, puis partager son lien Jupyter avec Ana." } }
    - { id: b, text: { en: "Assign the AzureML Compute Operator role to Ana so that she creates her own compute instance.", fr: "Attribuer le rôle AzureML Compute Operator à Ana pour qu'elle crée sa propre instance de calcul." } }
    - { id: c, text: { en: "Create a compute cluster with `min_instances: 1`, and give Ana its SSH credentials.", fr: "Créer un cluster de calcul avec `min_instances: 1`, et donner à Ana ses informations d'identification SSH." } }
    - { id: d, text: { en: "Create the compute instance with `create_on_behalf_of` set to Ana's tenant ID and object ID.", fr: "Créer l'instance de calcul avec `create_on_behalf_of` défini sur l'ID de locataire et l'ID d'objet d'Ana." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An administrator can create a compute instance on behalf of a data scientist and assign it to them by specifying the user's Microsoft Entra tenant ID and object ID. The assigned user is the one who uses the instance, and they don't need compute create permissions.
    fr: |
      Un administrateur peut créer une instance de calcul pour le compte d'un data scientist et la lui affecter en indiquant l'ID de locataire et l'ID d'objet Microsoft Entra de l'utilisateur. L'utilisateur affecté est celui qui utilise l'instance, et il n'a pas besoin d'autorisations de création de calcul.
  options:
    a: { en: "A compute instance can't be shared: it belongs to the user it was created for, here the administrator.", fr: "Une instance de calcul ne peut pas être partagée : elle appartient à l'utilisateur pour lequel elle a été créée, ici l'administrateur." }
    b: { en: "AzureML Compute Operator grants permissions to create and delete compute, which Ana must not receive.", fr: "AzureML Compute Operator accorde l'autorisation de créer et supprimer du calcul, ce qu'Ana ne doit pas recevoir." }
    c: { en: "A compute cluster runs jobs; it isn't a personal notebook development environment.", fr: "Un cluster de calcul exécute des travaux ; ce n'est pas un environnement personnel de développement dans des notebooks." }
references:
  - title: Create a compute instance - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-compute-instance
  - title: CLI (v2) compute instance YAML schema - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-compute-instance
