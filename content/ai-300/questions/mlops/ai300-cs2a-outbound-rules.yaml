id: ai300-cs2a-outbound-rules
objective: "1.3.4"
type: single
caseStudy: ai300-cs2a-blue-yonder
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the managed virtual network of mlw-by-prod. The solution must meet the security requirements.

    What should you configure?
  fr: |
    Vous devez configurer le réseau virtuel managé de mlw-by-prod. La solution doit respecter les exigences de sécurité.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text:
        en: "The `allow_internet_outbound` isolation mode, and a private endpoint outbound rule for pypi.org"
        fr: "Le mode d'isolation `allow_internet_outbound`, et une règle de trafic sortant de type point de terminaison privé pour pypi.org"
    - id: b
      text:
        en: "The `allow_only_approved_outbound` isolation mode, and a private endpoint outbound rule for pypi.org"
        fr: "Le mode d'isolation `allow_only_approved_outbound`, et une règle de trafic sortant de type point de terminaison privé pour pypi.org"
    - id: c
      text:
        en: "The `allow_internet_outbound` isolation mode, and an FQDN outbound rule for pypi.org"
        fr: "Le mode d'isolation `allow_internet_outbound`, et une règle de trafic sortant de type FQDN pour pypi.org"
    - id: d
      text:
        en: "The `allow_only_approved_outbound` isolation mode, and an FQDN outbound rule for pypi.org"
        fr: "Le mode d'isolation `allow_only_approved_outbound`, et une règle de trafic sortant de type FQDN pour pypi.org"
answer: { optionId: d }
explanation:
  correct:
    en: "The `allow_only_approved_outbound` mode blocks all outbound traffic that is not allowed by an outbound rule. FQDN rules, which allow a host name such as pypi.org on ports 80 and 443, are available only in this mode; they are enforced by an Azure Firewall that the managed network creates and that is billed separately."
    fr: "Le mode `allow_only_approved_outbound` bloque tout le trafic sortant qui n'est pas autorisé par une règle de trafic sortant. Les règles FQDN, qui autorisent un nom d'hôte comme pypi.org sur les ports 80 et 443, ne sont disponibles que dans ce mode ; elles sont appliquées par un pare-feu Azure Firewall que le réseau managé crée et qui est facturé séparément."
  options:
    a: { en: "allow_internet_outbound allows all outbound internet traffic, and private endpoint rules only target Azure resources.", fr: "allow_internet_outbound autorise tout le trafic Internet sortant, et les règles de point de terminaison privé ne ciblent que des ressources Azure." }
    b: { en: "A private endpoint rule connects to an Azure resource such as a storage account; it cannot target a public host such as pypi.org.", fr: "Une règle de point de terminaison privé se connecte à une ressource Azure comme un compte de stockage ; elle ne peut pas cibler un hôte public comme pypi.org." }
    c: { en: "FQDN rules are available only in allow_only_approved_outbound, and allow_internet_outbound does not restrict outbound traffic.", fr: "Les règles FQDN ne sont disponibles qu'en mode allow_only_approved_outbound, et allow_internet_outbound ne restreint pas le trafic sortant." }
references:
  - title: Workspace managed virtual network isolation
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
