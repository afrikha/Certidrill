id: ai300-1b-git-clone-location
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data scientist named Ana uses a compute instance named **ci-ana** in an Azure Machine Learning workspace. She plans to clone the team's Git repository from the ci-ana terminal.

    The clone must remain available if ci-ana is deleted and recreated, must be visible from her other compute instances in the workspace, and must not collide with the working branches of her colleagues.

    Where should Ana clone the repository?
  fr: |
    Une data scientist nommée Ana utilise une instance de calcul nommée **ci-ana** dans un espace de travail Azure Machine Learning. Elle prévoit de cloner le dépôt Git de l'équipe depuis le terminal de ci-ana.

    Le clone doit rester disponible si ci-ana est supprimée puis recréée, être visible depuis ses autres instances de calcul de l'espace de travail et ne pas entrer en conflit avec les branches de travail de ses collègues.

    Où Ana doit-elle cloner le dépôt ?
body:
  options:
    - { id: a, text: "/home/azureuser/repos" }
    - { id: b, text: "~/cloudfiles/code/Users/ana" }
    - { id: c, text: "~/cloudfiles/code" }
    - { id: d, text: "/tmp/repos" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The `~/cloudfiles/code/` folder is the workspace file share, mounted on every compute instance and kept when an instance is deleted. Cloning into your own user folder, `~/cloudfiles/code/Users/<user>`, prevents collisions with colleagues' working branches.
    fr: |
      Le dossier `~/cloudfiles/code/` est le partage de fichiers de l'espace de travail, monté sur chaque instance de calcul et conservé quand une instance est supprimée. Cloner dans votre propre dossier utilisateur, `~/cloudfiles/code/Users/<utilisateur>`, évite les conflits avec les branches de travail des collègues.
  options:
    a:
      en: |
        The local file system of the compute instance performs better, but it's lost when the instance is deleted and isn't visible from other instances.
      fr: |
        Le système de fichiers local de l'instance de calcul est plus performant, mais il est perdu quand l'instance est supprimée et n'est pas visible depuis les autres instances.
    c:
      en: |
        The root of the shared file system is common to all workspace users, so a clone there can collide with colleagues' branches.
      fr: |
        La racine du système de fichiers partagé est commune à tous les utilisateurs de l'espace de travail : un clone à cet endroit peut entrer en conflit avec les branches des collègues.
    d:
      en: |
        /tmp is on the instance's local disk, so it's lost with the instance and isn't shared.
      fr: |
        /tmp se trouve sur le disque local de l'instance : il est perdu avec l'instance et n'est pas partagé.
references:
  - title: Git integration
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-train-model-git-integration
  - title: How to access a compute terminal
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-access-terminal
