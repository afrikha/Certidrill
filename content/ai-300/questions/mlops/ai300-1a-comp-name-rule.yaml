id: ai300-1a-comp-name-rule
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are writing the YAML definition of a command component that prepares sales data for the Azure Machine Learning workspace **mlw-adatum**. Running `az ml component create --file prep.yml` must succeed.

    Which value can you use for the `name` key of the component?
  fr: |
    Vous écrivez la définition YAML d'un composant de commande qui prépare des données de vente pour l'espace de travail Azure Machine Learning **mlw-adatum**. L'exécution de `az ml component create --file prep.yml` doit réussir.

    Quelle valeur pouvez-vous utiliser pour la clé `name` du composant ?
body:
  options:
    - { id: a, text: Prep_Sales_Data }
    - { id: b, text: prep-sales-data }
    - { id: c, text: 2026_prep_sales }
    - { id: d, text: prep_sales_data }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A component name must start with a lowercase letter and can contain only lowercase letters, numbers and underscores, up to 255 characters. `prep_sales_data` meets these rules. Use `display_name` for a friendlier label in the studio.
    fr: |
      Un nom de composant doit commencer par une lettre minuscule et ne peut contenir que des lettres minuscules, des chiffres et des traits de soulignement, jusqu'à 255 caractères. `prep_sales_data` respecte ces règles. Utilisez `display_name` pour un libellé plus lisible dans le studio.
  options:
    a: { en: "Uppercase letters aren't allowed in component names.", fr: "Les majuscules ne sont pas autorisées dans les noms de composants." }
    b: { en: "Hyphens aren't allowed; use underscores.", fr: "Les traits d'union ne sont pas autorisés ; utilisez des traits de soulignement." }
    c: { en: "The name must start with a lowercase letter, not a digit.", fr: "Le nom doit commencer par une lettre minuscule, pas par un chiffre." }
references:
  - title: CLI (v2) command component YAML schema - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-component-command
