id: ai300-1b-reg-deploy-uri
objective: "1.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    An MLflow model named **churn-model** version 3 is registered in an Azure Machine Learning registry named **contoso_ml_registry**. The model isn't registered in the production workspace **mlw-contoso-prod**, which is in the resource group **rg-ml-prod** and in a region supported by the registry. A managed online endpoint named **churn-endpoint** already exists in mlw-contoso-prod.

    You need to create a deployment of the registry model behind churn-endpoint and send all the traffic to it.

    How should you complete the deployment file and the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un modèle MLflow nommé **churn-model** version 3 est inscrit dans un registre Azure Machine Learning nommé **contoso_ml_registry**. Le modèle n'est pas inscrit dans l'espace de travail de production **mlw-contoso-prod**, qui se trouve dans le groupe de ressources **rg-ml-prod** et dans une région prise en charge par le registre. Un point de terminaison en ligne managé nommé **churn-endpoint** existe déjà dans mlw-contoso-prod.

    Vous devez créer un déploiement du modèle du registre derrière churn-endpoint et lui envoyer tout le trafic.

    Comment devez-vous compléter le fichier de déploiement et la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    # deploy.yml
    name: blue
    endpoint_name: churn-endpoint
    model: [[model]]
    instance_type: Standard_DS3_v2
    instance_count: 1

    az ml online-deployment create --file deploy.yml \
      --resource-group rg-ml-prod [[scope]] --all-traffic
  slots:
    - id: model
      options:
        - { id: reg, text: "azureml://registries/contoso_ml_registry/models/churn-model/versions/3" }
        - { id: ws, text: "azureml:churn-model:3" }
        - { id: ds, text: "azureml://datastores/workspaceblobstore/paths/churn-model/3" }
    - id: scope
      options:
        - { id: wsn, text: "--workspace-name mlw-contoso-prod" }
        - { id: regn, text: "--registry-name contoso_ml_registry" }
        - { id: name, text: "--name mlw-contoso-prod" }
answer:
  values: { model: reg, scope: wsn }
explanation:
  correct:
    en: |
      A registry model is referenced with its registry URI `azureml://registries/<registry>/models/<name>/versions/<version>`. Endpoints and deployments are workspace resources, so the command targets the production workspace with `--workspace-name`; the registry only provides the model.
    fr: |
      Un modèle de registre est référencé par son URI de registre `azureml://registries/<registre>/models/<nom>/versions/<version>`. Les points de terminaison et les déploiements sont des ressources d'espace de travail : la commande cible l'espace de travail de production avec `--workspace-name` ; le registre ne fournit que le modèle.
  options:
    ws: { en: "azureml:churn-model:3 refers to a model registered in the workspace, and the model isn't registered in mlw-contoso-prod.", fr: "azureml:churn-model:3 désigne un modèle inscrit dans l'espace de travail, or le modèle n'est pas inscrit dans mlw-contoso-prod." }
    ds: { en: "A datastore path points to files, not to the registered model version in the registry.", fr: "Un chemin de magasin de données pointe vers des fichiers, pas vers la version de modèle inscrite dans le registre." }
    regn: { en: "Deployments aren't created in a registry: compute, jobs and endpoints stay in workspaces.", fr: "Les déploiements ne sont pas créés dans un registre : le calcul, les travaux et les points de terminaison restent dans les espaces de travail." }
    name: { en: "--name sets the name of the deployment, not the workspace.", fr: "--name définit le nom du déploiement, pas l'espace de travail." }
references:
  - title: Share models, components, and environments across workspaces with registries
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
