id: ai300-1b-reg-pipeline-order
objective: "1.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has two Azure Machine Learning workspaces, **mlw-team-a** and **mlw-team-b**, in the North Europe region. Each workspace has its own compute cluster named **cpu-cluster**. No registry exists yet.

    You need both teams to run the same training component, which uses a custom environment, from a single shared definition. You start with mlw-team-a.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin dispose de deux espaces de travail Azure Machine Learning, **mlw-team-a** et **mlw-team-b**, dans la région North Europe. Chaque espace de travail possède son propre cluster de calcul nommé **cpu-cluster**. Aucun registre n'existe encore.

    Les deux équipes doivent exécuter le même composant d'entraînement, qui utilise un environnement personnalisé, à partir d'une définition partagée unique. Vous commencez par mlw-team-a.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: reg, text: { en: "Run `az ml registry create` with a file whose replication locations include northeurope.", fr: "Exécuter `az ml registry create` avec un fichier dont les emplacements de réplication incluent northeurope." } }
    - { id: env, text: { en: "Run `az ml environment create` with `--registry-name`.", fr: "Exécuter `az ml environment create` avec `--registry-name`." } }
    - { id: comp, text: { en: "Run `az ml component create` with `--registry-name`, referencing the registry environment URI.", fr: "Exécuter `az ml component create` avec `--registry-name`, en référençant l'URI de l'environnement du registre." } }
    - { id: job, text: { en: "Run `az ml job create` with `--workspace-name mlw-team-a` for a pipeline that references the registry component.", fr: "Exécuter `az ml job create` avec `--workspace-name mlw-team-a` pour un pipeline qui référence le composant du registre." } }
    - { id: share, text: { en: "Create the component in mlw-team-a and share it to the registry.", fr: "Créer le composant dans mlw-team-a et le partager vers le registre." } }
    - { id: compute, text: { en: "Create a compute cluster in the registry.", fr: "Créer un cluster de calcul dans le registre." } }
answer:
  sequence: [ reg, env, comp, job ]
explanation:
  correct:
    en: |
      The registry must exist in the region of the workspaces before assets can be created in it. A registry component can only reference assets that already exist in the registry, so the environment comes before the component. The pipeline job is then submitted in a workspace, where it runs on that workspace's compute.
    fr: |
      Le registre doit exister dans la région des espaces de travail avant qu'on puisse y créer des actifs. Un composant de registre ne peut référencer que des actifs qui existent déjà dans le registre : l'environnement vient donc avant le composant. Le travail de pipeline est ensuite soumis dans un espace de travail, où il s'exécute sur le calcul de cet espace de travail.
  options:
    share: { en: "Sharing a component from a workspace to a registry isn't supported.", fr: "Le partage d'un composant d'un espace de travail vers un registre n'est pas pris en charge." }
    compute: { en: "Registries hold assets only; compute stays in each workspace.", fr: "Les registres ne contiennent que des actifs ; le calcul reste dans chaque espace de travail." }
references:
  - title: Share models, components, and environments across workspaces with registries
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
  - title: Create and manage registries
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-registries
