id: ai300-1a-ws-byo-yaml
objective: "1.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are creating an Azure Machine Learning workspace named **mlw-fabrikam-prod** by running `az ml workspace create -g rg-ml-prod --file workspace.yml`.

    The workspace must meet the following requirements:

    - use the existing storage account **stfabrikamml** as its default storage;
    - send endpoint monitoring data to the existing Application Insights instance **appi-fabrikam**;
    - encrypt the workspace metadata at rest with the key **mlw-key** stored in the key vault **kv-fabrikam-cmk**.

    Resources that aren't specified can be created automatically. How should you complete workspace.yml? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un espace de travail Azure Machine Learning nommé **mlw-fabrikam-prod** en exécutant `az ml workspace create -g rg-ml-prod --file workspace.yml`.

    L'espace de travail doit répondre aux exigences suivantes :

    - utiliser le compte de stockage existant **stfabrikamml** comme stockage par défaut ;
    - envoyer les données de supervision des points de terminaison à l'instance Application Insights existante **appi-fabrikam** ;
    - chiffrer au repos les métadonnées de l'espace de travail avec la clé **mlw-key** stockée dans le coffre de clés **kv-fabrikam-cmk**.

    Les ressources non spécifiées peuvent être créées automatiquement. Comment devez-vous compléter workspace.yml ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    $schema: https://azuremlschemas.azureedge.net/latest/workspace.schema.json
    name: mlw-fabrikam-prod
    location: westeurope
    [[s1]]: /subscriptions/<sub-id>/resourceGroups/rg-shared/providers/Microsoft.Storage/storageAccounts/stfabrikamml
    [[s2]]: /subscriptions/<sub-id>/resourceGroups/rg-shared/providers/Microsoft.insights/components/appi-fabrikam
    [[s3]]:
      key_vault: /subscriptions/<sub-id>/resourceGroups/rg-shared/providers/Microsoft.KeyVault/vaults/kv-fabrikam-cmk
      key_uri: https://kv-fabrikam-cmk.vault.azure.net/keys/mlw-key/<key-version>
  slots:
    - id: s1
      options:
        - { id: sa, text: storage_account }
        - { id: cr, text: container_registry }
        - { id: ibc, text: image_build_compute }
        - { id: kv, text: key_vault }
    - id: s2
      options:
        - { id: kv, text: key_vault }
        - { id: ai, text: application_insights }
        - { id: cr, text: container_registry }
        - { id: mn, text: managed_network }
    - id: s3
      options:
        - { id: kv, text: key_vault }
        - { id: hbi, text: hbi_workspace }
        - { id: mn, text: managed_network }
        - { id: cmk, text: customer_managed_key }
answer:
  values: { s1: sa, s2: ai, s3: cmk }
explanation:
  correct:
    en: "`storage_account` and `application_insights` take the resource IDs of existing resources to use instead of creating new ones. `customer_managed_key` contains `key_vault` and `key_uri` and makes the workspace encrypt its metadata with your key instead of a Microsoft-managed key; that key vault can differ from the workspace default key vault."
    fr: "`storage_account` et `application_insights` reçoivent les ID de ressource de ressources existantes à utiliser au lieu d'en créer de nouvelles. `customer_managed_key` contient `key_vault` et `key_uri` et fait chiffrer les métadonnées de l'espace de travail avec votre clé au lieu d'une clé gérée par Microsoft ; ce coffre de clés peut être différent du coffre de clés par défaut de l'espace de travail."
  options:
    kv: { en: "`key_vault` at the top level sets the workspace default key vault for secrets; it doesn't configure encryption with a customer-managed key.", fr: "`key_vault` au premier niveau définit le coffre de clés par défaut de l'espace de travail pour les secrets ; il ne configure pas le chiffrement avec une clé gérée par le client." }
    hbi: { en: "`hbi_workspace` is a boolean that reduces diagnostic data collection; it doesn't take a key.", fr: "`hbi_workspace` est un booléen qui réduit la collecte de données de diagnostic ; il n'accepte pas de clé." }
    ibc: { en: "`image_build_compute` names a compute target used to build images; it doesn't reference a storage account.", fr: "`image_build_compute` désigne une cible de calcul servant à construire les images ; il ne référence pas de compte de stockage." }
references:
  - title: CLI (v2) workspace YAML schema - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-workspace
  - title: Create workspaces with Azure CLI - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-workspace-cli
