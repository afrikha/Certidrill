id: ai300-1b-iac-keyvault-change
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Azure Machine Learning workspace named **mlw-fabrikam** was deployed from a Bicep file. Its `keyVault` property references a key vault named **kv-ml-old**.

    A new compliance rule requires the workspace's associated key vault to be **kv-ml-new**, which has purge protection enabled. You change the `keyVault` property to the ID of kv-ml-new and run `az deployment group create`. The deployment fails.

    You need a workspace whose associated key vault is kv-ml-new.

    What should you do?
  fr: |
    Un espace de travail Azure Machine Learning nommé **mlw-fabrikam** a été déployé à partir d'un fichier Bicep. Sa propriété `keyVault` référence un coffre de clés nommé **kv-ml-old**.

    Une nouvelle règle de conformité exige que le coffre de clés associé à l'espace de travail soit **kv-ml-new**, sur lequel la protection contre le vidage est activée. Vous remplacez la propriété `keyVault` par l'ID de kv-ml-new et vous exécutez `az deployment group create`. Le déploiement échoue.

    Vous avez besoin d'un espace de travail dont le coffre de clés associé est kv-ml-new.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a dependsOn entry for kv-ml-new to the workspace resource and redeploy.", fr: "Ajouter une entrée dependsOn pour kv-ml-new à la ressource d'espace de travail et redéployer." }
    - id: b
      text: { en: "Run az ml workspace sync-keys for mlw-fabrikam, then redeploy the file.", fr: "Exécuter az ml workspace sync-keys pour mlw-fabrikam, puis redéployer le fichier." }
    - id: c
      text: { en: "Change the API version of the workspace resource to a preview version and redeploy.", fr: "Remplacer la version d'API de la ressource d'espace de travail par une préversion et redéployer." }
    - id: d
      text: { en: "Deploy a new workspace that references kv-ml-new and move the assets to it.", fr: "Déployer un nouvel espace de travail qui référence kv-ml-new et y déplacer les actifs." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The template reference states that the associated key vault (like the associated storage account) can't be changed once the workspace has been created. The only way to get kv-ml-new as the associated key vault is a new workspace created with that ID, so plan these IDs in the first deployment.
    fr: |
      La référence du modèle indique que le coffre de clés associé (comme le compte de stockage associé) ne peut pas être modifié une fois l'espace de travail créé. La seule façon d'avoir kv-ml-new comme coffre associé est un nouvel espace de travail créé avec cet ID : prévoyez ces ID dès le premier déploiement.
  options:
    a:
      en: |
        dependsOn only orders deployments; the property stays immutable whatever the order.
      fr: |
        dependsOn ne fait qu'ordonner les déploiements ; la propriété reste non modifiable quel que soit l'ordre.
    b:
      en: |
        sync-keys resynchronizes the keys of the associated resources; it doesn't replace the key vault.
      fr: |
        sync-keys resynchronise les clés des ressources associées ; il ne remplace pas le coffre de clés.
    c:
      en: |
        The property is immutable after creation; changing the API version doesn't lift that restriction.
      fr: |
        La propriété n'est pas modifiable après la création ; changer de version d'API ne lève pas cette restriction.
references:
  - title: Microsoft.MachineLearningServices/workspaces
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.machinelearningservices/workspaces
  - title: Create workspaces with Azure CLI
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-workspace-cli
