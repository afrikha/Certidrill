id: ai300-1b-reg-data-statements
objective: "1.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove uses an Azure Machine Learning registry named **woodgrove_registry** that is used by six workspaces. A data engineer plans to publish a `uri_folder` data asset named **claims-sample** to the registry by running `az ml data create --file claims.yml --registry-name woodgrove_registry`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove utilise un registre Azure Machine Learning nommé **woodgrove_registry**, utilisé par six espaces de travail. Un ingénieur de données prévoit de publier une ressource de données `uri_folder` nommée **claims-sample** dans le registre en exécutant `az ml data create --file claims.yml --registry-name woodgrove_registry`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Creating claims-sample in the registry ingests a copy of the data into the registry's storage.
        fr: |
          La création de claims-sample dans le registre ingère une copie des données dans le stockage du registre.
    - id: s2
      text:
        en: |
          You can make claims-sample readable by only one of the six workspaces that use woodgrove_registry.
        fr: |
          Vous pouvez rendre claims-sample lisible par un seul des six espaces de travail qui utilisent woodgrove_registry.
    - id: s3
      text:
        en: |
          The `path` in claims.yml can be an `azureml://datastores/...` URI of a workspace datastore.
        fr: |
          Le `path` de claims.yml peut être un URI `azureml://datastores/...` d'un magasin de données d'espace de travail.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Creating a data asset in a registry copies the data into the registry's storage, so registries suit data that can be copied. Registries aren't designed for fine-grained access, so data can't be limited to a subset of the workspaces that use the registry. When you create data directly in a registry, Microsoft Learn states that the only supported paths are locations on your local computer.
    fr: |
      La création d'une ressource de données dans un registre copie les données dans le stockage du registre : les registres conviennent donc aux données qui peuvent être copiées. Les registres ne sont pas conçus pour un accès précis : les données ne peuvent pas être limitées à une partie des espaces de travail qui utilisent le registre. Quand vous créez des données directement dans un registre, Microsoft Learn indique que les seuls chemins pris en charge sont des emplacements sur votre ordinateur local.
references:
  - title: Share data across workspaces with registries
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-data-across-workspaces-with-registries
