id: ai300-1b-reg-promote-model
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has two Azure Machine Learning workspaces: **mlw-contoso-dev** in a development subscription and **mlw-contoso-prod** in a production subscription. Both workspaces are in the West Europe region.

    Data scientists train a churn model in mlw-contoso-dev. You need to deploy the validated model to a managed online endpoint in mlw-contoso-prod. The model must be published once to a central catalog that both workspaces can use, without downloading and uploading the model files manually.

    What should you do?
  fr: |
    Contoso dispose de deux espaces de travail Azure Machine Learning : **mlw-contoso-dev** dans un abonnement de développement et **mlw-contoso-prod** dans un abonnement de production. Les deux espaces de travail se trouvent dans la région West Europe.

    Les data scientists entraînent un modèle d'attrition dans mlw-contoso-dev. Vous devez déployer le modèle validé sur un point de terminaison en ligne managé dans mlw-contoso-prod. Le modèle doit être publié une seule fois dans un catalogue central que les deux espaces de travail peuvent utiliser, sans téléchargement ni chargement manuel des fichiers du modèle.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Download the model files from mlw-contoso-dev and register them again in mlw-contoso-prod.", fr: "Télécharger les fichiers du modèle depuis mlw-contoso-dev et les inscrire à nouveau dans mlw-contoso-prod." }
    - id: b
      text: { en: "Create a datastore in mlw-contoso-prod that points to the default storage account of mlw-contoso-dev.", fr: "Créer dans mlw-contoso-prod un magasin de données qui pointe vers le compte de stockage par défaut de mlw-contoso-dev." }
    - id: c
      text: { en: "Share the model to an Azure Machine Learning registry and deploy it from the registry in mlw-contoso-prod.", fr: "Partager le modèle dans un registre Azure Machine Learning et le déployer depuis le registre dans mlw-contoso-prod." }
    - id: d
      text: { en: "Push the model's container image to the Azure Container Registry of mlw-contoso-prod.", fr: "Envoyer l'image conteneur du modèle dans l'instance Azure Container Registry de mlw-contoso-prod." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An Azure Machine Learning registry hosts models, environments, components and data assets centrally so that every workspace in a supported region can use them, even across subscriptions. You share the model from the dev workspace to the registry, then reference the registry model in the online deployment of the production workspace.
    fr: |
      Un registre Azure Machine Learning héberge de façon centralisée des modèles, des environnements, des composants et des ressources de données, afin que tout espace de travail d'une région prise en charge puisse les utiliser, même dans un autre abonnement. Vous partagez le modèle de l'espace de travail de développement vers le registre, puis vous référencez le modèle du registre dans le déploiement en ligne de l'espace de travail de production.
  options:
    a:
      en: |
        Downloading and registering the files again is the manual copy that the requirement excludes, and it creates two unrelated model entries.
      fr: |
        Télécharger les fichiers puis les inscrire à nouveau est la copie manuelle que l'exigence exclut, et cela crée deux entrées de modèle sans lien entre elles.
    b:
      en: |
        A datastore only stores connection information to storage; it doesn't publish a model to a catalog shared by workspaces.
      fr: |
        Un magasin de données ne stocke que des informations de connexion à un stockage ; il ne publie pas de modèle dans un catalogue partagé entre espaces de travail.
    d:
      en: |
        A container image isn't a registered model, and a workspace's container registry isn't a catalog of machine learning assets for other workspaces.
      fr: |
        Une image conteneur n'est pas un modèle inscrit, et le registre de conteneurs d'un espace de travail n'est pas un catalogue d'actifs de machine learning pour les autres espaces de travail.
references:
  - title: Machine Learning registries
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-machine-learning-registries-mlops
  - title: Share models, components, and environments across workspaces with registries
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
