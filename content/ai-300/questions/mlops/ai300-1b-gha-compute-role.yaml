id: ai300-1b-gha-compute-role
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A GitHub Actions workflow signs in with OpenID Connect as a service principal named **sp-ml-ci**. sp-ml-ci has the AzureML Data Scientist role on a workspace named **mlw-tailspin** and submits training jobs successfully.

    You add the following step before the job submission. The step fails with an authorization error.

    ```yaml
    - name: Create the training cluster
      run: az ml compute create --file ml/compute/cpu-cluster.yml -w mlw-tailspin -g rg-ml-tailspin
    ```

    You need the workflow to create and delete compute in mlw-tailspin. sp-ml-ci must not be able to modify the workspace settings. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Un workflow GitHub Actions se connecte avec OpenID Connect en tant que principal de service nommé **sp-ml-ci**. sp-ml-ci possède le rôle AzureML Data Scientist sur un espace de travail nommé **mlw-tailspin** et soumet des travaux d'entraînement avec succès.

    Vous ajoutez l'étape suivante avant la soumission du travail. L'étape échoue avec une erreur d'autorisation.

    ```yaml
    - name: Create the training cluster
      run: az ml compute create --file ml/compute/cpu-cluster.yml -w mlw-tailspin -g rg-ml-tailspin
    ```

    Le workflow doit créer et supprimer du calcul dans mlw-tailspin. sp-ml-ci ne doit pas pouvoir modifier les paramètres de l'espace de travail. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Replace the AzureML Data Scientist assignment with Contributor on mlw-tailspin.", fr: "Remplacer l'attribution AzureML Data Scientist par Contributor sur mlw-tailspin." }
    - id: b
      text: { en: "Also assign sp-ml-ci the AzureML Compute Operator role on mlw-tailspin.", fr: "Attribuer également à sp-ml-ci le rôle AzureML Compute Operator sur mlw-tailspin." }
    - id: c
      text: { en: "Also assign sp-ml-ci the Reader role on rg-ml-tailspin.", fr: "Attribuer également à sp-ml-ci le rôle Reader sur rg-ml-tailspin." }
    - id: d
      text: { en: "Also assign sp-ml-ci the Owner role on rg-ml-tailspin.", fr: "Attribuer également à sp-ml-ci le rôle Owner sur rg-ml-tailspin." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      AzureML Data Scientist allows everything in the workspace except creating or deleting compute and modifying the workspace. AzureML Compute Operator adds CRUD operations on managed compute only, so the combination meets the requirement without granting workspace management.
    fr: |
      AzureML Data Scientist autorise tout dans l'espace de travail, sauf créer ou supprimer du calcul et modifier l'espace de travail. AzureML Compute Operator ajoute uniquement les opérations CRUD sur le calcul managé : la combinaison répond à l'exigence sans accorder la gestion de l'espace de travail.
  options:
    a:
      en: |
        Contributor would also let sp-ml-ci modify the workspace settings.
      fr: |
        Contributor permettrait aussi à sp-ml-ci de modifier les paramètres de l'espace de travail.
    c:
      en: |
        Reader is read-only and doesn't allow creating compute.
      fr: |
        Reader est en lecture seule et ne permet pas de créer du calcul.
    d:
      en: |
        Owner grants full control, including role assignments, which violates least privilege.
      fr: |
        Owner accorde un contrôle total, y compris les attributions de rôles, ce qui enfreint le moindre privilège.
references:
  - title: Azure built-in roles for AI + machine learning
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/ai-machine-learning
