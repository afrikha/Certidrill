id: ai300-1a-data-wrong-path
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Azure Machine Learning workspace **mlw-contoso** contains a `uri_folder` data asset named **sales-transactions**. Version 2 was registered yesterday with a wrong path: it points to the 2025 folder instead of the 2026 folder of the datastore.

    Training pipelines reference the asset as `azureml:sales-transactions@latest`. You need the pipelines to use the 2026 folder without changing their definitions.

    What should you do?
  fr: |
    L'espace de travail Azure Machine Learning **mlw-contoso** contient une ressource de données `uri_folder` nommée **sales-transactions**. La version 2 a été inscrite hier avec un mauvais chemin : elle pointe vers le dossier 2025 au lieu du dossier 2026 du magasin de données.

    Les pipelines d'entraînement référencent la ressource sous la forme `azureml:sales-transactions@latest`. Vous devez faire en sorte que les pipelines utilisent le dossier 2026 sans modifier leurs définitions.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run `az ml data update` on version 2 to set the path to the 2026 folder.", fr: "Exécuter `az ml data update` sur la version 2 pour définir le chemin sur le dossier 2026." } }
    - { id: b, text: { en: "Delete version 2, and then register version 2 again with the 2026 folder.", fr: "Supprimer la version 2, puis inscrire de nouveau la version 2 avec le dossier 2026." } }
    - { id: c, text: { en: "Register version 3 of sales-transactions with the 2026 folder as its path.", fr: "Inscrire la version 3 de sales-transactions avec le dossier 2026 comme chemin." } }
    - { id: d, text: { en: "Archive sales-transactions, and then register a data asset named sales-2026.", fr: "Archiver sales-transactions, puis inscrire une ressource de données nommée sales-2026." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A data asset version is immutable and can't be modified or deleted. When the path is wrong, you create a new version with the same name and the correct path. `@latest` then resolves to version 3, so the pipelines use the 2026 folder without changes.
    fr: |
      Une version de ressource de données est immuable et ne peut être ni modifiée ni supprimée. Quand le chemin est erroné, vous créez une nouvelle version du même nom avec le bon chemin. `@latest` se résout alors en version 3 : les pipelines utilisent le dossier 2026 sans modification.
  options:
    a: { en: "Only properties such as tags can be updated; the path of a version is immutable.", fr: "Seules des propriétés comme les étiquettes peuvent être mises à jour ; le chemin d'une version est immuable." }
    b: { en: "Data asset deletion isn't supported by design.", fr: "La suppression des ressources de données n'est pas prise en charge, par conception." }
    d: { en: "A new name would force you to change the pipeline definitions.", fr: "Un nouveau nom obligerait à modifier les définitions des pipelines." }
references:
  - title: Create Data Assets - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-data-assets
