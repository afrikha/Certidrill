id: ai300-1a-ds-files-auth
objective: "1.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Litware stores scanned forms in an Azure Files share named **forms-in** in the storage account **stlitwarefiles**. You need to create an Azure Machine Learning datastore of type `azure_file` that connects the workspace **mlw-litware** to this share.

    Which two authentication methods can you configure for the datastore? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware stocke des formulaires numérisés dans un partage Azure Files nommé **forms-in** du compte de stockage **stlitwarefiles**. Vous devez créer un magasin de données Azure Machine Learning de type `azure_file` qui connecte l'espace de travail **mlw-litware** à ce partage.

    Quelles sont les deux méthodes d'authentification que vous pouvez configurer pour le magasin de données ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Identity-based access with Microsoft Entra ID", fr: "Accès basé sur l'identité avec Microsoft Entra ID" } }
    - { id: b, text: { en: "The storage account key", fr: "La clé du compte de stockage" } }
    - { id: c, text: { en: "A service principal with a client secret", fr: "Un principal de service avec un secret client" } }
    - { id: d, text: { en: "A SAS token", fr: "Un jeton SAS" } }
    - { id: e, text: { en: "The managed identity of the workspace", fr: "L'identité managée de l'espace de travail" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      An Azure Files datastore supports only credential-based access, with an account key or a SAS token, and the credential is stored in the workspace key vault. Identity-based access is available for Azure Blob Storage and Azure Data Lake Storage Gen2, not for file shares.
    fr: |
      Un magasin de données Azure Files ne prend en charge que l'accès basé sur des informations d'identification, avec une clé de compte ou un jeton SAS, et ces informations sont stockées dans le coffre de clés de l'espace de travail. L'accès basé sur l'identité est disponible pour Stockage Blob Azure et Azure Data Lake Storage Gen2, pas pour les partages de fichiers.
  options:
    a: { en: "Identity-based access isn't supported for Azure Files datastores.", fr: "L'accès basé sur l'identité n'est pas pris en charge pour les magasins de données Azure Files." }
    c: { en: "Service principal credentials are used for Azure Data Lake Storage Gen2 datastores, not for Azure Files.", fr: "Les informations d'identification d'un principal de service servent aux magasins de données Azure Data Lake Storage Gen2, pas à Azure Files." }
    e: { en: "Managed identity access is identity-based access, which Azure Files datastores don't support.", fr: "L'accès par identité managée est un accès basé sur l'identité, que les magasins de données Azure Files ne prennent pas en charge." }
references:
  - title: Data concepts in Azure Machine Learning - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-data
  - title: Use datastores - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-datastore
