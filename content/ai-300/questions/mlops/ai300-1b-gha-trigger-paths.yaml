id: ai300-1b-gha-trigger-paths
objective: "1.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind keeps the Bicep files of its Azure Machine Learning platform in the `infra/` folder of a GitHub repository. A workflow named **validate-infra** runs a what-if analysis of the Bicep files.

    The workflow must run when a pull request that targets the `main` branch changes files in `infra/`. It must not run for pull requests that change only other folders, and it must not run after the merge.

    How should you complete the trigger? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind conserve les fichiers Bicep de sa plateforme Azure Machine Learning dans le dossier `infra/` d'un dépôt GitHub. Un workflow nommé **validate-infra** exécute une analyse what-if des fichiers Bicep.

    Le workflow doit s'exécuter quand une pull request qui cible la branche `main` modifie des fichiers de `infra/`. Il ne doit pas s'exécuter pour les pull requests qui ne modifient que d'autres dossiers, ni après la fusion.

    Comment devez-vous compléter le déclencheur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    name: validate-infra
    on:
      [[event]]:
        branches:
          - main
        [[filter]]:
          - infra/**
  slots:
    - id: event
      options:
        - { id: push, text: push }
        - { id: pr, text: pull_request }
        - { id: run, text: workflow_run }
    - id: filter
      options:
        - { id: tags, text: tags }
        - { id: ignore, text: paths-ignore }
        - { id: paths, text: paths }
answer:
  values: { event: pr, filter: paths }
explanation:
  correct:
    en: "`pull_request` with `branches: [main]` runs for pull requests that target main, and the `paths` filter limits the runs to changes under `infra/`. The Azure Machine Learning GitHub Actions example uses the same `pull_request`, `branches` and `paths` combination."
    fr: "`pull_request` avec `branches: [main]` s'exécute pour les pull requests qui ciblent main, et le filtre `paths` limite les exécutions aux modifications sous `infra/`. L'exemple GitHub Actions d'Azure Machine Learning utilise la même combinaison `pull_request`, `branches` et `paths`."
  options:
    push: { en: "push runs when commits reach main, which includes the merge itself.", fr: "push s'exécute quand des commits arrivent sur main, ce qui inclut la fusion elle-même." }
    run: { en: "workflow_run starts after another workflow, not on pull request changes.", fr: "workflow_run démarre après un autre workflow, pas sur les modifications de pull request." }
    tags: { en: "tags filters pushes of Git tags, not changed files.", fr: "tags filtre les envois d'étiquettes Git, pas les fichiers modifiés." }
    ignore: { en: "paths-ignore would skip changes in infra/, the opposite of the requirement.", fr: "paths-ignore ignorerait les modifications de infra/, soit l'inverse de l'exigence." }
references:
  - title: GitHub Actions for CI/CD
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-github-actions-machine-learning
