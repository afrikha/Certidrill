id: ai300-cs1a-env-conda
objective: "1.2.2"
type: single
caseStudy: ai300-cs1a-relecloud-bank
difficulty: 1
status: draft
stem:
  en: You need to resolve the error of the jobs that use fraud-train-env. The solution must meet the training requirements. What should you do?
  fr: Vous devez résoudre l'erreur des travaux qui utilisent fraud-train-env. La solution doit respecter les exigences d'entraînement. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run az ml environment update on version 2 to point it to a new conda file that adds lightgbm", fr: "Exécuter az ml environment update sur la version 2 pour la faire pointer vers un nouveau fichier conda qui ajoute lightgbm" } }
    - { id: b, text: { en: "Trigger a new build of version 2 of fraud-train-env from Azure Machine Learning studio", fr: "Déclencher une nouvelle génération de la version 2 de fraud-train-env depuis Azure Machine Learning studio" } }
    - { id: c, text: { en: "Create version 3 of fraud-train-env with the same image and a conda file that adds lightgbm", fr: "Créer la version 3 de fraud-train-env avec la même image et un fichier conda qui ajoute lightgbm" } }
    - { id: d, text: { en: "Run the jobs on serverless compute instead of cpu-cluster with version 2 of fraud-train-env", fr: "Exécuter les travaux sur un calcul serverless au lieu de cpu-cluster avec la version 2 de fraud-train-env" } }
answer: { optionId: c }
explanation:
  correct:
    en: When an environment combines an image and a conda file, Azure Machine Learning builds a conda environment on top of the image and runs the job in it, so Python packages installed only in the base image aren't available. Adding lightgbm to the conda specification fixes the error while keeping the image, and because environment versions are immutable, the change requires a new version.
    fr: Quand un environnement combine une image et un fichier conda, Azure Machine Learning crée un environnement conda au-dessus de l'image et y exécute le travail ; les packages Python installés uniquement dans l'image de base ne sont donc pas disponibles. Ajouter lightgbm à la spécification conda corrige l'erreur en conservant l'image, et comme les versions d'environnement sont immuables, la modification exige une nouvelle version.
  options:
    a: { en: "Only the description and tags of an environment version can be updated; any other change needs a new version.", fr: "Seuls la description et les étiquettes d'une version d'environnement peuvent être mises à jour ; toute autre modification exige une nouvelle version." }
    b: { en: "A new build of the same specification produces the same conda environment, still without lightgbm.", fr: "Une nouvelle génération de la même spécification produit le même environnement conda, toujours sans lightgbm." }
    d: { en: "The compute target doesn't change the image or the conda environment in which the job runs.", fr: "La cible de calcul ne change ni l'image ni l'environnement conda dans lequel le travail s'exécute." }
references:
  - title: Manage Azure Machine Learning environments with the CLI & SDK (v2)
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-environments-v2
