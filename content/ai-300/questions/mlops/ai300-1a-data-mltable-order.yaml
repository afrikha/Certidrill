id: ai300-1a-data-mltable-order
objective: "1.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores a file named **churn.csv** in an Azure Data Lake Storage Gen2 account. You have the `mltable` Python package and the Azure CLI `ml` extension on your computer.

    You need to register an `mltable` data asset named **churn-table** that defines how to read churn.csv, so that AutoML jobs in the workspace **mlw-fabrikam** can use it.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam stocke un fichier nommé **churn.csv** dans un compte Azure Data Lake Storage Gen2. Vous disposez du package Python `mltable` et de l'extension `ml` d'Azure CLI sur votre ordinateur.

    Vous devez inscrire une ressource de données `mltable` nommée **churn-table** qui définit comment lire churn.csv, afin que les travaux AutoML de l'espace de travail **mlw-fabrikam** puissent l'utiliser.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: define, text: { en: "Define the loading steps by calling `mltable.from_delimited_files()` with the path of churn.csv.", fr: "Définir les étapes de chargement en appelant `mltable.from_delimited_files()` avec le chemin de churn.csv." } }
    - { id: save, text: { en: "Save the table definition to a local folder named churn by calling `save()`.", fr: "Enregistrer la définition de table dans un dossier local nommé churn en appelant `save()`." } }
    - { id: create, text: { en: "Run `az ml data create --path ./churn --name churn-table --version 1 --type mltable`.", fr: "Exécuter `az ml data create --path ./churn --name churn-table --version 1 --type mltable`." } }
    - { id: rename, text: { en: "Rename the saved MLTable file to MLTable.yaml.", fr: "Renommer le fichier MLTable enregistré en MLTable.yaml." } }
    - { id: urifile, text: { en: "Run `az ml data create` with `--type uri_file` and the path of churn.csv.", fr: "Exécuter `az ml data create` avec `--type uri_file` et le chemin de churn.csv." } }
    - { id: datastore, text: { en: "Run `az ml datastore create` with a YAML file of type `mltable`.", fr: "Exécuter `az ml datastore create` avec un fichier YAML de type `mltable`." } }
answer:
  sequence: [ define, save, create ]
explanation:
  correct:
    en: |
      The `mltable` package builds the table definition (`from_delimited_files`), and `save()` writes it as an MLTable file in a folder. `az ml data create --type mltable` then registers that folder; its path must be the folder that contains the MLTable file.
    fr: |
      Le package `mltable` crée la définition de table (`from_delimited_files`), et `save()` l'écrit sous forme de fichier MLTable dans un dossier. `az ml data create --type mltable` inscrit ensuite ce dossier ; son chemin doit être le dossier qui contient le fichier MLTable.
  options:
    rename: { en: "The file must be named exactly MLTable; MLTable.yaml isn't recognized.", fr: "Le fichier doit s'appeler exactement MLTable ; MLTable.yaml n'est pas reconnu." }
    urifile: { en: "A `uri_file` asset references the file but contains no table definition.", fr: "Une ressource `uri_file` référence le fichier, mais ne contient aucune définition de table." }
    datastore: { en: "A datastore connects a storage service; `mltable` isn't a datastore type.", fr: "Un magasin de données connecte un service de stockage ; `mltable` n'est pas un type de magasin de données." }
references:
  - title: Working with tables in Azure Machine Learning - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-mltable
