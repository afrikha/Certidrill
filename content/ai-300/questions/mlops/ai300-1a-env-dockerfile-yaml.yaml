id: ai300-1a-env-dockerfile-yaml
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin's vision team keeps a local folder named **docker-context** that contains the files needed to build its training image. The Dockerfile isn't at the root of the folder: it's stored as **docker/Dockerfile.gpu** inside docker-context.

    You need to register an environment named **vision-gpu-env** in the Azure Machine Learning workspace **mlw-tailspin** from this build context by running `az ml environment create --file vision-gpu-env.yml`.

    How should you complete vision-gpu-env.yml? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe vision de Tailspin conserve un dossier local nommé **docker-context** qui contient les fichiers nécessaires à la construction de son image d'entraînement. Le Dockerfile n'est pas à la racine du dossier : il est stocké sous **docker/Dockerfile.gpu** dans docker-context.

    Vous devez inscrire un environnement nommé **vision-gpu-env** dans l'espace de travail Azure Machine Learning **mlw-tailspin** à partir de ce contexte de build en exécutant `az ml environment create --file vision-gpu-env.yml`.

    Comment devez-vous compléter vision-gpu-env.yml ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    $schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json
    name: vision-gpu-env
    version: "1"
    [[b]]:
      [[p]]: ./docker-context
      [[d]]: docker/Dockerfile.gpu
  slots:
    - id: b
      options:
        - { id: image, text: image }
        - { id: build, text: build }
        - { id: conda, text: conda_file }
    - id: p
      options:
        - { id: path, text: path }
        - { id: dfp, text: dockerfile_path }
        - { id: image, text: image }
    - id: d
      options:
        - { id: path, text: path }
        - { id: conda, text: conda_file }
        - { id: dfp, text: dockerfile_path }
answer:
  values: { b: build, p: path, d: dfp }
explanation:
  correct:
    en: |
      An environment built from a Docker build context uses the `build` section. `build.path` is the local folder of the build context, and `build.dockerfile_path` is the path of the Dockerfile relative to that folder; without it, Azure Machine Learning looks for a file named `Dockerfile` at the root of the context.
    fr: |
      Un environnement construit à partir d'un contexte de build Docker utilise la section `build`. `build.path` est le dossier local du contexte de build, et `build.dockerfile_path` est le chemin du Dockerfile relatif à ce dossier ; sans lui, Azure Machine Learning cherche un fichier nommé `Dockerfile` à la racine du contexte.
  options:
    image: { en: "`image` references an existing Docker image to pull; it isn't a build context.", fr: "`image` référence une image Docker existante à récupérer ; ce n'est pas un contexte de build." }
    conda: { en: "`conda_file` defines conda dependencies on top of a base image, not a Dockerfile build.", fr: "`conda_file` définit des dépendances conda par-dessus une image de base, pas une construction à partir d'un Dockerfile." }
references:
  - title: Manage Azure Machine Learning environments with the CLI & SDK (v2) - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-environments-v2
