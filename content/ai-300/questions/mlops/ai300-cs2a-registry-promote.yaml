id: ai300-cs2a-registry-promote
objective: "1.2.4"
type: single
caseStudy: ai300-cs2a-blue-yonder
difficulty: 2
status: draft
stem:
  en: |
    You need to make version 4 of engine-rul available for deployment to ep-engine-rul. The solution must meet the release process requirements.

    What should you do?
  fr: |
    Vous devez rendre la version 4 d'engine-rul disponible pour un déploiement sur ep-engine-rul. La solution doit respecter les exigences du processus de mise en production.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Download version 4 from mlw-by-dev by running `az ml model download`, and then register the files in mlw-by-prod by running `az ml model create`."
        fr: "Télécharger la version 4 depuis mlw-by-dev en exécutant `az ml model download`, puis inscrire les fichiers dans mlw-by-prod en exécutant `az ml model create`."
    - id: b
      text:
        en: "Share version 4 from mlw-by-dev to reg-by-shared by running `az ml model share`, and then reference it in the deployment with an `azureml://registries/` URI."
        fr: "Partager la version 4 de mlw-by-dev vers reg-by-shared en exécutant `az ml model share`, puis la référencer dans le déploiement avec un URI `azureml://registries/`."
    - id: c
      text:
        en: "Submit the training pipeline to mlw-by-prod by running `az ml job create`, and then register the model output of the job in mlw-by-prod."
        fr: "Soumettre le pipeline d'entraînement à mlw-by-prod en exécutant `az ml job create`, puis inscrire dans mlw-by-prod le modèle produit par le travail."
    - id: d
      text:
        en: "Create version 4 in reg-by-shared by running `az ml model create --registry-name` with a local copy of the model folder, and then reference it in the deployment."
        fr: "Créer la version 4 dans reg-by-shared en exécutant `az ml model create --registry-name` avec une copie locale du dossier du modèle, puis la référencer dans le déploiement."
answer: { optionId: b }
explanation:
  correct:
    en: "`az ml model share` copies a model that is registered in a workspace into a registry, with the `--share-with-name` and `--share-with-version` values that it takes in the registry. A deployment in any workspace can then use `azureml://registries/reg-by-shared/models/<name>/versions/<version>`, so mlw-by-prod serves exactly the validated artifacts, without retraining and without a manual copy."
    fr: "`az ml model share` copie un modèle inscrit dans un espace de travail vers un registre, avec les valeurs `--share-with-name` et `--share-with-version` qu'il prend dans le registre. Un déploiement de n'importe quel espace de travail peut ensuite utiliser `azureml://registries/reg-by-shared/models/<nom>/versions/<version>` : mlw-by-prod sert exactement les artefacts validés, sans réentraînement ni copie manuelle."
  options:
    a: { en: "Downloading and registering the files again is the manual copy that requirement 1 forbids.", fr: "Télécharger puis réinscrire les fichiers est la copie manuelle que l'exigence 1 interdit." }
    c: { en: "Running the pipeline in mlw-by-prod retrains the model and produces new artifacts, not the validated ones.", fr: "Exécuter le pipeline dans mlw-by-prod réentraîne le modèle et produit de nouveaux artefacts, différents de ceux qui ont été validés." }
    d: { en: "Creating the model in the registry from a local folder requires copying the model files manually first.", fr: "Créer le modèle dans le registre à partir d'un dossier local oblige à copier d'abord manuellement les fichiers du modèle." }
references:
  - title: Share models, components, and environments across workspaces with registries
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
