id: ai300-cs3c-datastore-identity
objective: "1.1.2"
type: multi
caseStudy: ai300-cs3c-fourth-coffee
difficulty: 3
status: draft
stem:
  en: |
    You need to re-create the sales datastore and configure data access for the training jobs that run on cpu-cluster. The solution must meet demand forecasting requirement 2.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recréer le magasin de données sales et configurer l'accès aux données pour les travaux d'entraînement qui s'exécutent sur cpu-cluster. La solution doit respecter l'exigence 2 de prévision de la demande.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create the datastore with a SAS token that grants read and list permissions on the sales container."
        fr: "Créer le magasin de données avec un jeton SAS qui accorde les autorisations de lecture et de liste sur le conteneur sales."
    - id: b
      text:
        en: "Create the datastore without a `credentials` section."
        fr: "Créer le magasin de données sans section `credentials`."
    - id: c
      text:
        en: "Assign the Storage Blob Data Reader role on adlsfcsales to the managed identity of cpu-cluster."
        fr: "Attribuer le rôle Storage Blob Data Reader sur adlsfcsales à l'identité managée de cpu-cluster."
    - id: d
      text:
        en: "Assign the Storage Blob Data Reader role on adlsfcsales to the managed identity of mlw-fc-forecast."
        fr: "Attribuer le rôle Storage Blob Data Reader sur adlsfcsales à l'identité managée de mlw-fc-forecast."
    - id: e
      text:
        en: "Add `identity: type: user_identity` to the YAML files of the training jobs."
        fr: "Ajouter `identity: type: user_identity` aux fichiers YAML des travaux d'entraînement."
answer: { optionIds: [b, c] }
explanation:
  correct:
    en: |
      A datastore without credentials is identity-based, so no key or SAS token is stored in the workspace. When a job doesn't set an identity and the datastore has no cached credentials, the job uses the managed identity of the compute, which needs at least Storage Blob Data Reader on the storage account. Data scientists then need no role on adlsfcsales.
    fr: |
      Un magasin de données sans informations d'identification est basé sur l'identité : aucune clé ni aucun jeton SAS n'est stocké dans l'espace de travail. Quand un travail ne définit pas d'identité et que le magasin de données n'a pas d'informations d'identification mises en cache, le travail utilise l'identité managée du calcul, qui a besoin au minimum du rôle Storage Blob Data Reader sur le compte de stockage. Les data scientists n'ont alors besoin d'aucun rôle sur adlsfcsales.
  options:
    a:
      en: |
        A credential-based datastore stores its SAS token as a secret in the workspace, which requirement 2 forbids.
      fr: |
        Un magasin de données basé sur des informations d'identification stocke son jeton SAS comme secret dans l'espace de travail, ce qu'interdit l'exigence 2.
    d:
      en: |
        Training jobs on a compute cluster authenticate with the compute's managed identity (or the user's identity), not with the workspace's managed identity.
      fr: |
        Les travaux d'entraînement sur un cluster de calcul s'authentifient avec l'identité managée du calcul (ou l'identité de l'utilisateur), pas avec l'identité managée de l'espace de travail.
    e:
      en: |
        With user identity, storage authenticates the data scientist who submits the job, so each data scientist would need a role on adlsfcsales.
      fr: |
        Avec l'identité de l'utilisateur, le stockage authentifie le data scientist qui soumet le travail : chaque data scientist aurait besoin d'un rôle sur adlsfcsales.
references:
  - title: Set up service authentication
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-identity-based-service-authentication
