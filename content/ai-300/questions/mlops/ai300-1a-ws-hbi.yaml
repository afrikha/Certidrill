id: ai300-1a-ws-hbi
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Machine Learning workspace named **mlw-woodgrove-risk** that was created last year with the default settings. Its compute clusters train credit models on sensitive data.

    The security team now requires that Microsoft collect less diagnostic data from the compute clusters and that the local scratch disk of the cluster nodes be cleaned up between jobs.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un espace de travail Azure Machine Learning nommé **mlw-woodgrove-risk**, créé l'an dernier avec les paramètres par défaut. Ses clusters de calcul entraînent des modèles de crédit sur des données sensibles.

    L'équipe de sécurité exige désormais que Microsoft collecte moins de données de diagnostic depuis les clusters de calcul et que le disque de travail local des nœuds soit nettoyé entre les travaux.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run `az ml workspace update` with `--set hbi_workspace=true` on mlw-woodgrove-risk.", fr: "Exécuter `az ml workspace update` avec `--set hbi_workspace=true` sur mlw-woodgrove-risk." } }
    - { id: b, text: { en: "Create a new workspace with `hbi_workspace: true`, and move the workloads to it.", fr: "Créer un nouvel espace de travail avec `hbi_workspace: true`, et y déplacer les charges de travail." } }
    - { id: c, text: { en: "Add a `customer_managed_key` section to mlw-woodgrove-risk with `az ml workspace update`.", fr: "Ajouter une section `customer_managed_key` à mlw-woodgrove-risk avec `az ml workspace update`." } }
    - { id: d, text: { en: "Set `public_network_access` to `disabled` on mlw-woodgrove-risk with `az ml workspace update`.", fr: "Définir `public_network_access` sur `disabled` sur mlw-woodgrove-risk avec `az ml workspace update`." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The high business impact (HBI) flag reduces the diagnostic data Microsoft collects from compute clusters, encrypts and cleans up the local scratch disk between jobs, and passes credentials through your key vault. It can be set only when a workspace is created, so you need a new workspace with `hbi_workspace` set to true.
    fr: |
      L'indicateur d'impact élevé sur l'activité (HBI) réduit les données de diagnostic que Microsoft collecte depuis les clusters de calcul, chiffre et nettoie le disque de travail local entre les travaux, et transmet les informations d'identification par votre coffre de clés. Il ne peut être défini qu'à la création d'un espace de travail : il faut donc un nouvel espace de travail avec `hbi_workspace` défini sur true.
  options:
    a: { en: "The HBI setting can't be changed on an existing workspace.", fr: "Le paramètre HBI ne peut pas être modifié sur un espace de travail existant." }
    c: { en: "A customer-managed key controls the encryption key of workspace metadata; it doesn't reduce diagnostic data or clean scratch disks.", fr: "Une clé gérée par le client contrôle la clé de chiffrement des métadonnées de l'espace de travail ; elle ne réduit pas les données de diagnostic et ne nettoie pas les disques de travail." }
    d: { en: "Disabling public network access restricts network connectivity; it doesn't change diagnostic data collection or scratch disk handling.", fr: "Désactiver l'accès réseau public restreint la connectivité réseau ; cela ne change ni la collecte des données de diagnostic ni la gestion des disques de travail." }
references:
  - title: Customer-managed keys - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-customer-managed-keys
