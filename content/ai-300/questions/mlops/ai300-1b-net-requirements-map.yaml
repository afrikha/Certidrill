id: ai300-1b-net-requirements-map
objective: "1.3.4"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Proseware has several Azure Machine Learning workspaces with different network requirements.

    Which configuration should you use for each requirement? To answer, drag the appropriate configurations to the correct requirements. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose de plusieurs espaces de travail Azure Machine Learning aux exigences réseau différentes.

    Quelle configuration devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les configurations appropriées vers les exigences correspondantes. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: acl, text: { en: "Public network access Enabled with --network-acls", fr: "Accès réseau public Enabled avec --network-acls" } }
    - { id: ibc, text: { en: "image_build_compute set to a compute cluster", fr: "image_build_compute défini sur un cluster de calcul" } }
    - { id: inet, text: { en: "Managed network in allow_internet_outbound mode", fr: "Réseau managé en mode allow_internet_outbound" } }
    - { id: approver, text: { en: "Azure AI Enterprise Network Connection Approver role for the workspace identity", fr: "Rôle Azure AI Enterprise Network Connection Approver pour l'identité de l'espace de travail" } }
    - { id: approved, text: { en: "Managed network in allow_only_approved_outbound mode", fr: "Réseau managé en mode allow_only_approved_outbound" } }
    - { id: pe, text: { en: "Workspace private endpoint with public network access Disabled", fr: "Point de terminaison privé d'espace de travail avec accès réseau public Disabled" } }
  targets:
    - id: t1
      text: { en: "Allow studio access over the internet only from the public range 203.0.113.0/24 of a partner office", fr: "Autoriser l'accès au studio par Internet uniquement depuis la plage publique 203.0.113.0/24 d'un bureau partenaire" }
    - id: t2
      text: { en: "Build environment images when the workspace and its container registry use private endpoints", fr: "Générer les images d'environnement quand l'espace de travail et son registre de conteneurs utilisent des points de terminaison privés" }
    - id: t3
      text: { en: "Let compute reach any internet package source with no outbound rule to manage", fr: "Permettre au calcul d'atteindre n'importe quelle source de packages sur Internet sans règle de trafic sortant à gérer" }
    - id: t4
      text: { en: "Allow private endpoint outbound rules to your own storage accounts to be approved", fr: "Permettre l'approbation des règles de trafic sortant de point de terminaison privé vers vos propres comptes de stockage" }
answer:
  mapping: { t1: acl, t2: ibc, t3: inet, t4: approver }
explanation:
  correct:
    en: |
      IP network rules (`--network-acls`) keep public access enabled but limit it to public IPv4 ranges. `image_build_compute` names the compute used to build images when the container registry is behind a private endpoint. allow_internet_outbound permits all internet outbound traffic. Since April 30, 2025, the workspace identity needs the Azure AI Enterprise Network Connection Approver role to approve private endpoint connections to your resources.
    fr: |
      Les règles de réseau IP (`--network-acls`) laissent l'accès public activé mais le limitent à des plages IPv4 publiques. `image_build_compute` désigne le calcul utilisé pour générer les images quand le registre de conteneurs est derrière un point de terminaison privé. allow_internet_outbound autorise tout le trafic sortant vers Internet. Depuis le 30 avril 2025, l'identité de l'espace de travail a besoin du rôle Azure AI Enterprise Network Connection Approver pour approuver les connexions de point de terminaison privé vers vos ressources.
  options:
    approved: { en: "allow_only_approved_outbound requires outbound rules for each package source.", fr: "allow_only_approved_outbound exige des règles de trafic sortant pour chaque source de packages." }
    pe: { en: "Disabling public access blocks the partner office, which reaches the studio over the internet.", fr: "Désactiver l'accès public bloque le bureau partenaire, qui atteint le studio par Internet." }
references:
  - title: Configure a private endpoint
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-private-link
  - title: Managed virtual network isolation
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
