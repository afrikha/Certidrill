id: ai300-sr1-private-workspace-3
objective: "1.3.4"
type: series_yesno
series: ai300-sr1-private-workspace
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You enable a workspace managed virtual network that allows only approved outbound traffic.
  fr: Vous activez un réseau virtuel managé d'espace de travail qui autorise uniquement le trafic sortant approuvé.
body:
  solution:
    en: |
      You update mlw-fab-prod with `az ml workspace update --file workspace.yaml --resource-group rg-ml --name mlw-fab-prod`, where workspace.yaml contains the following settings:

      ```yaml
      managed_network:
        isolation_mode: allow_only_approved_outbound
      ```
    fr: |
      Vous mettez à jour mlw-fab-prod avec `az ml workspace update --file workspace.yaml --resource-group rg-ml --name mlw-fab-prod`, où workspace.yaml contient les paramètres suivants :

      ```yaml
      managed_network:
        isolation_mode: allow_only_approved_outbound
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      A workspace managed virtual network isolates outbound traffic from the workspace and its managed compute (compute instances, clusters, serverless compute, managed online endpoints). It doesn't give clients a private IP address to reach the workspace: inbound access still requires a private endpoint in a virtual network you manage. The workspace would remain reachable from the internet, so the goal isn't met.
    fr: |
      Un réseau virtuel managé d'espace de travail isole le trafic sortant de l'espace de travail et de ses calculs managés (instances de calcul, clusters, calcul serverless, points de terminaison en ligne managés). Il ne fournit pas aux clients d'adresse IP privée pour joindre l'espace de travail : l'accès entrant exige toujours un point de terminaison privé dans un réseau virtuel que vous gérez. L'espace de travail resterait accessible depuis Internet : l'objectif n'est pas atteint.
references:
  - title: Managed virtual network isolation - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network?view=azureml-api-2
