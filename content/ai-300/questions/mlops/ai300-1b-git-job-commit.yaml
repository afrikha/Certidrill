id: ai300-1b-git-job-commit
objective: "1.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A model registered in an Azure Machine Learning workspace named **mlw-adatum** was produced by a job named **calm_river_42**. The job was submitted from a clone of the repository **adatum/churn-ml**, with no uncommitted changes.

    You need to retrieve the commit hash that Azure Machine Learning recorded for the job, and then restore that exact version of the code in your local clone.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un modèle inscrit dans un espace de travail Azure Machine Learning nommé **mlw-adatum** a été produit par un travail nommé **calm_river_42**. Le travail a été soumis depuis un clone du dépôt **adatum/churn-ml**, sans modification non validée.

    Vous devez récupérer le hachage de commit qu'Azure Machine Learning a enregistré pour le travail, puis restaurer exactement cette version du code dans votre clone local.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    COMMIT=$(az ml job [[verb]] --name calm_river_42 -w mlw-adatum -g rg-ml-adatum \
      --query "properties.\"[[prop]]\"" -o tsv)

    git [[gitcmd]] $COMMIT
  slots:
    - id: verb
      options:
        - { id: list, text: list }
        - { id: show, text: show }
        - { id: stream, text: stream }
    - id: prop
      options:
        - { id: commit, text: azureml.git.commit }
        - { id: branch, text: azureml.git.branch }
        - { id: uri, text: azureml.git.repository_uri }
        - { id: dirty, text: azureml.git.dirty }
    - id: gitcmd
      options:
        - { id: clone, text: clone }
        - { id: stash, text: stash }
        - { id: checkout, text: checkout }
answer:
  values: { verb: show, prop: commit, gitcmd: checkout }
explanation:
  correct:
    en: "`az ml job show` returns one job, including its properties, and the `--query` expression extracts `azureml.git.commit`, the hash recorded from `git rev-parse HEAD` at submission. `git checkout <hash>` then restores that version of the code in the local clone."
    fr: "`az ml job show` renvoie un travail, propriétés comprises, et l'expression `--query` extrait `azureml.git.commit`, le hachage enregistré à partir de `git rev-parse HEAD` lors de la soumission. `git checkout <hachage>` restaure ensuite cette version du code dans le clone local."
  options:
    list: { en: "list returns several jobs and doesn't take a single job name.", fr: "list renvoie plusieurs travaux et ne prend pas un nom de travail unique." }
    stream: { en: "stream displays the logs of a running job.", fr: "stream affiche les journaux d'un travail en cours." }
    branch: { en: "The branch name points to its latest commit, which may have moved since the job.", fr: "Le nom de branche pointe vers son dernier commit, qui a pu changer depuis le travail." }
    uri: { en: "The repository URI identifies the repository, not the version of the code.", fr: "L'URI du dépôt identifie le dépôt, pas la version du code." }
    dirty: { en: "The dirty flag only says whether there were uncommitted changes.", fr: "L'indicateur dirty indique seulement s'il y avait des modifications non validées." }
    clone: { en: "git clone takes a repository URL, not a commit hash.", fr: "git clone prend une URL de dépôt, pas un hachage de commit." }
    stash: { en: "git stash sets local changes aside; it doesn't move to another commit.", fr: "git stash met de côté les modifications locales ; il ne passe pas à un autre commit." }
references:
  - title: Git integration
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-train-model-git-integration
