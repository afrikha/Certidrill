id: ai300-1b-git-dirty-flag
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data scientist modifies `train.py` in a cloned Git repository and submits a training job by running `az ml job create`. The job properties show `azureml.git.dirty` set to `True`.

    Auditors require that every training job whose model can be promoted runs the modified code and can be reproduced exactly from the commit recorded on the job.

    What should the data scientist do before resubmitting the job?
  fr: |
    Une data scientist modifie `train.py` dans un dépôt Git cloné et soumet un travail d'entraînement en exécutant `az ml job create`. Les propriétés du travail indiquent `azureml.git.dirty` défini sur `True`.

    Les auditeurs exigent que chaque travail d'entraînement dont le modèle peut être promu exécute le code modifié et puisse être reproduit exactement à partir du commit enregistré sur le travail.

    Que doit faire la data scientist avant de soumettre à nouveau le travail ?
body:
  options:
    - id: a
      text: { en: "Run git stash to set the changes aside.", fr: "Exécuter git stash pour mettre les modifications de côté." }
    - id: b
      text: { en: "Add a tag named commit to the job with the current branch name.", fr: "Ajouter au travail une étiquette nommée commit avec le nom de la branche actuelle." }
    - id: c
      text: { en: "Commit the changes to the current branch.", fr: "Valider (commit) les modifications sur la branche actuelle." }
    - id: d
      text: { en: "Delete the .git folder so that the code snapshot is used instead.", fr: "Supprimer le dossier .git pour que l'instantané du code soit utilisé à la place." }
answer: { optionId: c }
explanation:
  correct:
    en: "`azureml.git.dirty` is True when the working tree had uncommitted changes at submission, so the recorded commit (`azureml.git.commit`) doesn't contain the code that ran. Committing first makes the recorded commit hash identify exactly the submitted code."
    fr: "`azureml.git.dirty` vaut True quand l'arborescence de travail contenait des modifications non validées lors de la soumission : le commit enregistré (`azureml.git.commit`) ne contient donc pas le code exécuté. Valider d'abord les modifications fait que le hachage de commit enregistré identifie exactement le code soumis."
  options:
    a:
      en: |
        git stash removes the changes from the working tree, so the job would no longer run the modified code.
      fr: |
        git stash retire les modifications de l'arborescence de travail : le travail n'exécuterait plus le code modifié.
    b:
      en: |
        A branch name points to a moving commit and doesn't capture uncommitted changes.
      fr: |
        Un nom de branche pointe vers un commit qui évolue et ne capture pas les modifications non validées.
    d:
      en: |
        Without a Git repository, no Git information is tracked at all, so the job couldn't be linked to a commit.
      fr: |
        Sans dépôt Git, aucune information Git n'est suivie : le travail ne pourrait plus être relié à un commit.
references:
  - title: Git integration
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-train-model-git-integration
