id: ai300-1b-reg-new-region
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You created an Azure Machine Learning registry named **contoso_ml_registry** from the following file.

    ```yaml
    name: contoso_ml_registry
    location: westeurope
    replication_locations:
      - location: westeurope
      - location: northeurope
    ```

    Contoso creates a new workspace named **mlw-contoso-us** in the East US region. A pipeline job submitted in mlw-contoso-us must use components and environments stored in contoso_ml_registry. You need to make the registry assets usable from mlw-contoso-us. The solution must keep the existing asset references unchanged.

    What should you do?
  fr: |
    Vous avez créé un registre Azure Machine Learning nommé **contoso_ml_registry** à partir du fichier suivant.

    ```yaml
    name: contoso_ml_registry
    location: westeurope
    replication_locations:
      - location: westeurope
      - location: northeurope
    ```

    Contoso crée un nouvel espace de travail nommé **mlw-contoso-us** dans la région East US. Un travail de pipeline soumis dans mlw-contoso-us doit utiliser des composants et des environnements stockés dans contoso_ml_registry. Vous devez rendre les actifs du registre utilisables depuis mlw-contoso-us. La solution doit conserver les références existantes aux actifs.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Update the registry to add eastus to its replication locations.", fr: "Mettre à jour le registre pour ajouter eastus à ses emplacements de réplication." }
    - id: b
      text: { en: "Recreate the registry with eastus as its primary location.", fr: "Recréer le registre avec eastus comme emplacement principal." }
    - id: c
      text: { en: "Assign the AcrPull role on the registry's container registry to the identity of mlw-contoso-us.", fr: "Attribuer le rôle AcrPull sur le registre de conteneurs du registre à l'identité de mlw-contoso-us." }
    - id: d
      text: { en: "Create a private endpoint for the registry in the virtual network used by mlw-contoso-us.", fr: "Créer un point de terminaison privé pour le registre dans le réseau virtuel utilisé par mlw-contoso-us." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A workspace can use registry assets only if its region is one of the regions the registry supports. The primary region can't be changed, but the other regions of the registry can be updated, so you add East US to the replication locations and keep the registry name, which appears in every asset URI.
    fr: |
      Un espace de travail ne peut utiliser les actifs d'un registre que si sa région fait partie des régions prises en charge par le registre. La région principale ne peut pas être modifiée, mais les autres régions du registre peuvent être mises à jour : vous ajoutez East US aux emplacements de réplication et vous conservez le nom du registre, qui figure dans chaque URI d'actif.
  options:
    b:
      en: |
        The primary region can't be changed, and recreating the registry isn't needed; a new registry would also break the existing asset references if its name changed.
      fr: |
        La région principale ne peut pas être modifiée et recréer le registre n'est pas nécessaire ; un nouveau registre casserait aussi les références existantes si son nom changeait.
    c:
      en: |
        Workspace compute doesn't get direct access to the registry's container registry; the registry's own managed identity holds AcrPull. The region is the blocking issue.
      fr: |
        Le calcul de l'espace de travail n'obtient pas d'accès direct au registre de conteneurs du registre ; c'est l'identité managée du registre qui détient AcrPull. Le blocage vient de la région.
    d:
      en: |
        A private endpoint changes how the registry is reached on the network; it doesn't add a supported region.
      fr: |
        Un point de terminaison privé change la façon d'atteindre le registre sur le réseau ; il n'ajoute pas de région prise en charge.
references:
  - title: Create and manage registries
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-registries
