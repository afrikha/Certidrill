id: ai300-1b-gh-role-jobs
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A GitHub Actions workflow signs in to Azure by using a user-assigned managed identity named **id-gh-training** that has a federated identity credential for the repository.

    The workflow must submit training pipeline jobs and register models in an existing Azure Machine Learning workspace named **mlw-litware**. It must not create or delete compute and must not modify the workspace. The solution must follow the principle of least privilege.

    Which role should you assign to id-gh-training on mlw-litware?
  fr: |
    Un workflow GitHub Actions se connecte à Azure à l'aide d'une identité managée affectée par l'utilisateur nommée **id-gh-training**, qui possède des informations d'identification fédérées pour le dépôt.

    Le workflow doit soumettre des travaux de pipeline d'entraînement et inscrire des modèles dans un espace de travail Azure Machine Learning existant nommé **mlw-litware**. Il ne doit ni créer ni supprimer de calcul et ne doit pas modifier l'espace de travail. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à id-gh-training sur mlw-litware ?
body:
  options:
    - { id: a, text: Contributor }
    - { id: b, text: AzureML Compute Operator }
    - { id: c, text: Reader }
    - { id: d, text: AzureML Data Scientist }
answer: { optionId: d }
explanation:
  correct:
    en: |
      AzureML Data Scientist allows all actions within a workspace, such as submitting jobs and registering models, except creating or deleting compute resources and modifying the workspace itself. That matches the requirement exactly.
    fr: |
      AzureML Data Scientist autorise toutes les actions dans un espace de travail, comme soumettre des travaux et inscrire des modèles, sauf créer ou supprimer des ressources de calcul et modifier l'espace de travail lui-même. Cela correspond exactement à l'exigence.
  options:
    a:
      en: |
        Contributor also allows the identity to modify the workspace and manage compute, which exceeds the requirement.
      fr: |
        Contributor permet aussi à l'identité de modifier l'espace de travail et de gérer le calcul, ce qui dépasse l'exigence.
    b:
      en: |
        AzureML Compute Operator manages compute resources; it doesn't allow submitting jobs or registering models.
      fr: |
        AzureML Compute Operator gère les ressources de calcul ; il ne permet pas de soumettre des travaux ni d'inscrire des modèles.
    c:
      en: |
        Reader is read-only, so the workflow couldn't submit jobs.
      fr: |
        Reader est en lecture seule : le workflow ne pourrait pas soumettre de travaux.
references:
  - title: Azure built-in roles for AI + machine learning
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/ai-machine-learning
