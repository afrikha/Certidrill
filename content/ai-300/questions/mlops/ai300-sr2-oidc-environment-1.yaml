id: ai300-sr2-oidc-environment-1
objective: "1.3.1"
type: series_yesno
series: ai300-sr2-oidc-environment
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: You add a federated credential for the main branch to a Microsoft Entra application.
  fr: Vous ajoutez des informations d'identification fédérées pour la branche main à une application Microsoft Entra.
body:
  solution:
    en: |
      You register a Microsoft Entra application and add a federated identity credential for GitHub Actions with the entity type **Branch** and the value `main` for fabrikam/churn-mlops. You store the client ID, tenant ID and subscription ID as GitHub secrets. The workflow grants `permissions: id-token: write`, and the deploy job signs in with `azure/login@v2` by using `client-id`, `tenant-id` and `subscription-id`.
    fr: |
      Vous inscrivez une application Microsoft Entra et vous lui ajoutez des informations d'identification fédérées pour GitHub Actions avec le type d'entité **Branch** et la valeur `main` pour fabrikam/churn-mlops. Vous stockez l'ID client, l'ID de locataire et l'ID d'abonnement dans des secrets GitHub. Le workflow accorde `permissions: id-token: write`, et le travail deploy se connecte avec `azure/login@v2` en utilisant `client-id`, `tenant-id` et `subscription-id`.
answer: { value: false }
explanation:
  correct:
    en: Because the deploy job is tied to the production environment, the subject of GitHub's token is `repo:fabrikam/churn-mlops:environment:production`, not the branch reference. The subject of a federated credential must match exactly, so the token exchange fails even though the credential was created without error. The credential must use the Environment entity type with the value production.
    fr: "Comme le travail deploy est lié à l'environnement production, le sujet du jeton de GitHub est `repo:fabrikam/churn-mlops:environment:production`, et non la référence de branche. Le sujet des informations d'identification fédérées doit correspondre exactement : l'échange de jetons échoue, bien que les informations d'identification aient été créées sans erreur. Il faut le type d'entité Environment avec la valeur production."
references:
  - title: Create a trust relationship between an app and an external identity provider
    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-create-trust
