id: ai300-1a-ws-recover-order
objective: "1.1.1"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Three days ago, a cleanup script at Northwind Traders deleted the Azure Machine Learning workspace **mlw-northwind-ml** with the default options. The script also deleted the Application Insights instance **appi-nw-ml** of the workspace and the Log Analytics workspace **log-nw-ml** that appi-nw-ml used. The key vault and the storage account of the workspace weren't deleted.

    You need to recover mlw-northwind-ml.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Il y a trois jours, un script de nettoyage de Northwind Traders a supprimé l'espace de travail Azure Machine Learning **mlw-northwind-ml** avec les options par défaut. Le script a aussi supprimé l'instance Application Insights **appi-nw-ml** de l'espace de travail et l'espace de travail Log Analytics **log-nw-ml** qu'appi-nw-ml utilisait. Le coffre de clés et le compte de stockage de l'espace de travail n'ont pas été supprimés.

    Vous devez récupérer mlw-northwind-ml.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: la, text: { en: "Recover the Log Analytics workspace log-nw-ml.", fr: "Récupérer l'espace de travail Log Analytics log-nw-ml." } }
    - { id: ai, text: { en: "Create an Application Insights resource named appi-nw-ml that uses log-nw-ml.", fr: "Créer une ressource Application Insights nommée appi-nw-ml qui utilise log-nw-ml." } }
    - { id: rec, text: { en: "In Azure Machine Learning, open **Recently deleted**, select mlw-northwind-ml, and then select **Recover**.", fr: "Dans Azure Machine Learning, ouvrir **Recently deleted**, sélectionner mlw-northwind-ml, puis sélectionner **Recover**." } }
    - { id: kv, text: { en: "Recover the deleted key vault of the workspace.", fr: "Récupérer le coffre de clés supprimé de l'espace de travail." } }
    - { id: new, text: { en: "Create a workspace named mlw-northwind-ml that references the existing storage account and key vault.", fr: "Créer un espace de travail nommé mlw-northwind-ml qui référence le compte de stockage et le coffre de clés existants." } }
    - { id: sync, text: { en: "Run `az ml workspace sync-keys` for mlw-northwind-ml.", fr: "Exécuter `az ml workspace sync-keys` pour mlw-northwind-ml." } }
answer:
  sequence: [ la, ai, rec ]
explanation:
  correct:
    en: |
      Before recovering a workspace, its dependencies must exist again. For Application Insights, you recover the Log Analytics workspace first and then recreate Application Insights with its original name. Then you recover the workspace from Recently deleted during the 14-day retention period.
    fr: |
      Avant de récupérer un espace de travail, ses dépendances doivent de nouveau exister. Pour Application Insights, vous récupérez d'abord l'espace de travail Log Analytics, puis vous recréez Application Insights avec son nom d'origine. Ensuite, vous récupérez l'espace de travail depuis Recently deleted pendant la période de rétention de 14 jours.
  options:
    kv: { en: "The key vault wasn't deleted, so there is nothing to recover.", fr: "Le coffre de clés n'a pas été supprimé : il n'y a rien à récupérer." }
    new: { en: "The name is still held by the soft-deleted workspace, and a new workspace wouldn't contain the recovered assets.", fr: "Le nom est encore occupé par l'espace de travail en suppression réversible, et un nouvel espace de travail ne contiendrait pas les actifs récupérés." }
    sync: { en: "Key synchronization refreshes storage keys of an active workspace; it doesn't recover a deleted one.", fr: "La synchronisation des clés actualise les clés de stockage d'un espace de travail actif ; elle ne récupère pas un espace de travail supprimé." }
references:
  - title: Workspace soft deletion - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-soft-delete
