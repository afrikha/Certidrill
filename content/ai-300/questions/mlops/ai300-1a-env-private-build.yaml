id: ai300-1a-env-private-build
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove's Azure Machine Learning workspace **mlw-woodgrove** and its container registry are reachable only through private endpoints, and public network access is disabled on both. The workspace contains a compute cluster named **cpu-build** in the same virtual network.

    When a data scientist registers a custom environment from a Dockerfile, the image build fails. You need image builds to succeed. The container registry must stay without public network access.

    What should you do?
  fr: |
    L'espace de travail Azure Machine Learning **mlw-woodgrove** de Woodgrove et son registre de conteneurs ne sont accessibles que par des points de terminaison privés, et l'accès réseau public est désactivé sur les deux. L'espace de travail contient un cluster de calcul nommé **cpu-build** dans le même réseau virtuel.

    Quand un data scientist inscrit un environnement personnalisé à partir d'un Dockerfile, la construction de l'image échoue. Vous devez faire en sorte que les constructions d'images réussissent. Le registre de conteneurs doit rester sans accès réseau public.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable public network access on the container registry for the duration of the builds.", fr: "Activer l'accès réseau public sur le registre de conteneurs pendant les constructions." } }
    - { id: b, text: { en: "Run `az ml workspace update` with `--image-build-compute cpu-build`.", fr: "Exécuter `az ml workspace update` avec `--image-build-compute cpu-build`." } }
    - { id: c, text: { en: "Recreate the environment from a conda file and a base image instead of a Dockerfile.", fr: "Recréer l'environnement à partir d'un fichier conda et d'une image de base au lieu d'un Dockerfile." } }
    - { id: d, text: { en: "Run `az ml workspace update` with `--public-network-access enabled`.", fr: "Exécuter `az ml workspace update` avec `--public-network-access enabled`." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When both the workspace and its container registry use private endpoints, Docker images for environments must be built on a compute cluster that you set with `image_build_compute`. The cluster in the virtual network can reach the registry privately, so the registry keeps public access disabled.
    fr: |
      Quand l'espace de travail et son registre de conteneurs utilisent tous deux des points de terminaison privés, les images Docker des environnements doivent être construites sur un cluster de calcul que vous définissez avec `image_build_compute`. Le cluster du réseau virtuel peut joindre le registre en privé : le registre garde l'accès public désactivé.
  options:
    a: { en: "Enabling public access on the registry violates the requirement.", fr: "Activer l'accès public sur le registre enfreint l'exigence." }
    c: { en: "A conda-based environment is also built into a Docker image, so the build would fail in the same way.", fr: "Un environnement basé sur conda est lui aussi construit en image Docker : la construction échouerait de la même façon." }
    d: { en: "Opening the workspace endpoint doesn't give the image build a way to reach the private registry.", fr: "Ouvrir le point de terminaison de l'espace de travail ne permet pas à la construction d'image de joindre le registre privé." }
references:
  - title: Create workspaces with Azure CLI - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-workspace-cli
  - title: CLI (v2) workspace YAML schema - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-workspace
