id: ai300-1b-gh-secret-values
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You configure a Microsoft Entra application named **app-ml-ci** with a federated identity credential for the GitHub repository **proseware/churn-ml**. A workflow in the repository will sign in to Azure with the `azure/login` action by using OpenID Connect.

    You need to create the repository secrets that the sign-in step uses.

    Which values should you store?
  fr: |
    Vous configurez une application Microsoft Entra nommée **app-ml-ci** avec des informations d'identification fédérées pour le dépôt GitHub **proseware/churn-ml**. Un workflow du dépôt se connectera à Azure avec l'action `azure/login` en utilisant OpenID Connect.

    Vous devez créer les secrets de dépôt que l'étape de connexion utilise.

    Quelles valeurs devez-vous stocker ?
body:
  options:
    - id: a
      text: { en: "The client ID, the tenant ID and the subscription ID", fr: "L'ID client, l'ID de locataire et l'ID d'abonnement" }
    - id: b
      text: { en: "The client ID, a client secret and the tenant ID", fr: "L'ID client, un secret client et l'ID de locataire" }
    - id: c
      text: { en: "The object ID of the application, the workspace name and the resource group name", fr: "L'ID d'objet de l'application, le nom de l'espace de travail et le nom du groupe de ressources" }
    - id: d
      text: { en: "A JSON document that contains the client ID, a client secret, the tenant ID and the subscription ID", fr: "Un document JSON qui contient l'ID client, un secret client, l'ID de locataire et l'ID d'abonnement" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With OpenID Connect, `azure/login` takes `client-id`, `tenant-id` and `subscription-id`, stored as the secrets AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID. No client secret exists, because the GitHub token is exchanged through the federated credential.
    fr: |
      Avec OpenID Connect, `azure/login` prend `client-id`, `tenant-id` et `subscription-id`, stockés dans les secrets AZURE_CLIENT_ID, AZURE_TENANT_ID et AZURE_SUBSCRIPTION_ID. Aucun secret client n'existe, car le jeton GitHub est échangé via les informations d'identification fédérées.
  options:
    b:
      en: |
        OpenID Connect doesn't use a client secret, and the sign-in step also needs the subscription ID.
      fr: |
        OpenID Connect n'utilise pas de secret client, et l'étape de connexion a aussi besoin de l'ID d'abonnement.
    c:
      en: |
        azure/login identifies the application by its client ID; the workspace and resource group are parameters of later az ml commands, not sign-in values.
      fr: |
        azure/login identifie l'application par son ID client ; l'espace de travail et le groupe de ressources sont des paramètres des commandes az ml suivantes, pas des valeurs de connexion.
    d:
      en: |
        This JSON document is the AZURE_CREDENTIALS secret of the service principal secret method, not of OpenID Connect.
      fr: |
        Ce document JSON est le secret AZURE_CREDENTIALS de la méthode par secret de principal de service, pas d'OpenID Connect.
references:
  - title: Authenticate to Azure from GitHub Actions by OpenID Connect
    url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
  - title: Authenticate to Azure from GitHub Actions by a secret
    url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-secret
