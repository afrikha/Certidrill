id: ai300-cs2a-github-oidc
objective: "1.3.1"
type: dropdown
caseStudy: ai300-cs2a-blue-yonder
difficulty: 2
status: draft
stem:
  en: |
    You create a Microsoft Entra application for the workflows of by-engine-ml and add a federated identity credential that trusts the GitHub Actions tokens of the repository. You store the client ID, tenant ID and subscription ID as repository secrets.

    You need to update the following workflow to meet the release process requirements.

    How should you complete the workflow? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une application Microsoft Entra pour les workflows de by-engine-ml et vous lui ajoutez des informations d'identification fédérées qui approuvent les jetons GitHub Actions du dépôt. Vous stockez l'ID client, l'ID de locataire et l'ID d'abonnement comme secrets de dépôt.

    Vous devez mettre à jour le workflow suivant pour respecter les exigences du processus de mise en production.

    Comment devez-vous compléter le workflow ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    name: train-engine-rul
    on:
      workflow_dispatch:
    permissions:
      [[perm]]
    jobs:
      train:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - name: azure login
          uses: azure/login@v2
          with:
            [[login]]
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        - name: run pipeline
          run: az ml job create --file pipeline.yml --resource-group rg-by-ml --workspace-name mlw-by-dev
  slots:
    - id: perm
      options:
        - { id: idtoken, text: "id-token: write" }
        - { id: contents, text: "contents: write" }
        - { id: actions, text: "actions: write" }
    - id: login
      options:
        - { id: creds, text: "creds: ${{ secrets.AZURE_CREDENTIALS }}" }
        - { id: clientid, text: "client-id: ${{ secrets.AZURE_CLIENT_ID }}" }
        - { id: pssession, text: "enable-AzPSSession: true" }
answer:
  values: { perm: idtoken, login: clientid }
explanation:
  correct:
    en: "With OpenID Connect, the job requests a GitHub OIDC token, which requires the `id-token: write` permission, and `azure/login@v2` exchanges it for a Microsoft Entra token through the federated identity credential. The login step takes only `client-id`, `tenant-id` and `subscription-id`: no client secret or certificate is stored in GitHub."
    fr: "Avec OpenID Connect, le travail demande un jeton OIDC GitHub, ce qui exige l'autorisation `id-token: write`, et `azure/login@v2` l'échange contre un jeton Microsoft Entra grâce aux informations d'identification fédérées. L'étape de connexion ne prend que `client-id`, `tenant-id` et `subscription-id` : aucun secret client ni certificat n'est stocké dans GitHub."
  options:
    contents: { en: "`contents: write` lets the job modify the repository; it does not allow the job to request an OIDC token.", fr: "`contents: write` permet au travail de modifier le dépôt ; il ne lui permet pas de demander un jeton OIDC." }
    actions: { en: "`actions: write` manages workflow runs; it does not allow the job to request an OIDC token.", fr: "`actions: write` gère les exécutions de workflows ; il ne permet pas au travail de demander un jeton OIDC." }
    creds: { en: "The creds input contains a service principal secret stored in GitHub, which requirement 2 forbids.", fr: "L'entrée creds contient un secret de principal de service stocké dans GitHub, ce que l'exigence 2 interdit." }
    pssession: { en: "enable-AzPSSession also signs in Azure PowerShell; the step still needs the client ID of the application.", fr: "enable-AzPSSession connecte aussi Azure PowerShell ; l'étape a toujours besoin de l'ID client de l'application." }
references:
  - title: Use GitHub Actions with Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-github-actions-machine-learning
