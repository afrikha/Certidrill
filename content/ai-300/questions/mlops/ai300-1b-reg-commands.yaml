id: ai300-1b-reg-commands
objective: "1.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an Azure Machine Learning workspace named **mlw-adatum-dev** and a registry named **adatum_registry**.

    You need to perform the tasks listed in the answer area by using Azure CLI.

    Which command should you use for each task? To answer, drag the appropriate commands to the correct tasks. Each command may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un espace de travail Azure Machine Learning nommé **mlw-adatum-dev** et d'un registre nommé **adatum_registry**.

    Vous devez effectuer les tâches de la zone de réponse à l'aide d'Azure CLI.

    Quelle commande devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les commandes appropriées vers les tâches correspondantes. Chaque commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mshare, text: az ml model share }
    - { id: dshare, text: az ml data share }
    - { id: mcreate, text: az ml model create --registry-name adatum_registry }
    - { id: rupdate, text: az ml registry update }
    - { id: rcreate, text: az ml registry create }
    - { id: wcreate, text: az ml model create --workspace-name mlw-adatum-dev }
  targets:
    - id: t1
      text: { en: "Copy version 4 of a model already registered in mlw-adatum-dev to adatum_registry", fr: "Copier dans adatum_registry la version 4 d'un modèle déjà inscrit dans mlw-adatum-dev" }
    - id: t2
      text: { en: "Register a model in adatum_registry directly from local model files", fr: "Inscrire un modèle dans adatum_registry directement à partir de fichiers de modèle locaux" }
    - id: t3
      text: { en: "Disable public network access to adatum_registry", fr: "Désactiver l'accès réseau public à adatum_registry" }
    - id: t4
      text: { en: "Copy a data asset of mlw-adatum-dev to adatum_registry", fr: "Copier une ressource de données de mlw-adatum-dev dans adatum_registry" }
answer:
  mapping: { t1: mshare, t2: mcreate, t3: rupdate, t4: dshare }
explanation:
  correct:
    en: "`az ml model share` copies a workspace model to a registry and requires `--share-with-name` and `--share-with-version`. `az ml model create` with `--registry-name` registers a model directly in the registry. `az ml registry update --public-network-access Disabled` disables public access. `az ml data share` (preview) copies a workspace data asset to a registry."
    fr: "`az ml model share` copie un modèle d'espace de travail dans un registre et exige `--share-with-name` et `--share-with-version`. `az ml model create` avec `--registry-name` inscrit un modèle directement dans le registre. `az ml registry update --public-network-access Disabled` désactive l'accès public. `az ml data share` (préversion) copie une ressource de données d'espace de travail dans un registre."
  options:
    rcreate: { en: "az ml registry create creates a new registry; adatum_registry already exists.", fr: "az ml registry create crée un nouveau registre ; adatum_registry existe déjà." }
    wcreate: { en: "With --workspace-name, the model is registered in the workspace, not in the registry.", fr: "Avec --workspace-name, le modèle est inscrit dans l'espace de travail, pas dans le registre." }
references:
  - title: Share models, components, and environments across workspaces with registries
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
  - title: Machine Learning registry network isolation
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-registry-network-isolation
