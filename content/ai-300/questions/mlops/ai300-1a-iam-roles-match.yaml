id: ai300-1a-iam-roles-match
objective: "1.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip uses an Azure Machine Learning workspace named **mlw-wingtip** and an Azure Machine Learning registry named **wingtip_registry**. Four groups need access, and each group must receive only the permissions it needs.

    Which built-in role should you assign to each group? To answer, drag the appropriate roles to the correct groups. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip utilise un espace de travail Azure Machine Learning nommé **mlw-wingtip** et un registre Azure Machine Learning nommé **wingtip_registry**. Quatre groupes ont besoin d'accès, et chacun ne doit recevoir que les autorisations dont il a besoin.

    Quel rôle intégré devez-vous attribuer à chaque groupe ? Pour répondre, faites glisser les rôles appropriés vers les groupes correspondants. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: owner, text: Owner }
    - { id: contrib, text: Contributor }
    - { id: reader, text: Reader }
    - { id: compop, text: AzureML Compute Operator }
    - { id: ds, text: AzureML Data Scientist }
    - { id: reguser, text: AzureML Registry User }
  targets:
    - id: platform
      text: { en: "Platform team, on mlw-wingtip: create, manage and delete compute resources only", fr: "Équipe plateforme, sur mlw-wingtip : créer, gérer et supprimer uniquement des ressources de calcul" }
    - id: audit
      text: { en: "Auditors, on mlw-wingtip: list and view assets without changing them", fr: "Auditeurs, sur mlw-wingtip : lister et consulter les actifs sans les modifier" }
    - id: lead
      text: { en: "ML leads, on mlw-wingtip: manage everything, including role assignments", fr: "Responsables ML, sur mlw-wingtip : tout gérer, y compris les attributions de rôles" }
    - id: publishers
      text: { en: "Model publishers, on wingtip_registry: read, write and delete assets, but not create or delete registries", fr: "Éditeurs de modèles, sur wingtip_registry : lire, écrire et supprimer des actifs, sans créer ni supprimer de registres" }
answer:
  mapping: { platform: compop, audit: reader, lead: owner, publishers: reguser }
explanation:
  correct:
    en: |
      AzureML Compute Operator covers creating, managing and deleting compute. Reader allows only read actions on assets. Owner is the only role listed that also manages role assignments. AzureML Registry User lets users read, write and delete assets in a registry without creating or deleting registry resources.
    fr: |
      AzureML Compute Operator couvre la création, la gestion et la suppression du calcul. Reader n'autorise que les actions de lecture sur les actifs. Owner est le seul rôle de la liste qui gère aussi les attributions de rôles. AzureML Registry User permet de lire, écrire et supprimer des actifs dans un registre sans créer ni supprimer de ressources de registre.
  options:
    contrib: { en: "Contributor can't assign roles and grants far more than compute management.", fr: "Contributor ne peut pas attribuer de rôles et accorde bien plus que la gestion du calcul." }
    ds: { en: "AzureML Data Scientist runs jobs and deploys models but can't create or delete compute.", fr: "AzureML Data Scientist exécute des travaux et déploie des modèles, mais ne peut pas créer ni supprimer de calcul." }
references:
  - title: Manage roles in your workspace - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-assign-roles
