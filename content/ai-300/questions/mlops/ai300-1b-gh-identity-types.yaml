id: ai300-1b-gh-identity-types
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware plans to let a GitHub Actions workflow on GitHub-hosted runners deploy Azure Machine Learning resources by using OpenID Connect. The workflow identity must receive an Azure role on the resource group **rg-ml-litware**.

    You need to choose the type of identity that will hold the federated identity credential.

    Which two identity types can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit qu'un workflow GitHub Actions exécuté sur des exécuteurs hébergés par GitHub déploie des ressources Azure Machine Learning en utilisant OpenID Connect. L'identité du workflow doit recevoir un rôle Azure sur le groupe de ressources **rg-ml-litware**.

    Vous devez choisir le type d'identité qui portera les informations d'identification fédérées.

    Quels sont les deux types d'identité que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "A user-assigned managed identity", fr: "Une identité managée affectée par l'utilisateur" }
    - id: b
      text: { en: "The system-assigned managed identity of the workspace", fr: "L'identité managée affectée par le système de l'espace de travail" }
    - id: c
      text: { en: "A Microsoft Entra application with a service principal", fr: "Une application Microsoft Entra avec un principal de service" }
    - id: d
      text: { en: "The system-assigned managed identity of a compute cluster", fr: "L'identité managée affectée par le système d'un cluster de calcul" }
    - id: e
      text: { en: "A Microsoft Entra user account dedicated to automation", fr: "Un compte d'utilisateur Microsoft Entra dédié à l'automatisation" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Microsoft Learn describes two options for OpenID Connect from GitHub Actions. You configure the federated identity credential either on a Microsoft Entra application that has a service principal, or on a user-assigned managed identity, and you assign the Azure role to that identity.
    fr: |
      Microsoft Learn décrit deux options pour OpenID Connect depuis GitHub Actions. Vous configurez les informations d'identification fédérées soit sur une application Microsoft Entra dotée d'un principal de service, soit sur une identité managée affectée par l'utilisateur, et vous attribuez le rôle Azure à cette identité.
  options:
    b:
      en: |
        A system-assigned identity is tied to its Azure resource and is used by that resource, not by an external workload such as a GitHub runner.
      fr: |
        Une identité affectée par le système est liée à sa ressource Azure et utilisée par cette ressource, pas par une charge de travail externe comme un exécuteur GitHub.
    d:
      en: |
        The identity of a compute cluster is used by jobs running on the cluster, not by a GitHub runner.
      fr: |
        L'identité d'un cluster de calcul est utilisée par les travaux qui s'exécutent sur le cluster, pas par un exécuteur GitHub.
    e:
      en: |
        Federated identity credentials are configured on applications or user-assigned managed identities, not on user accounts; a user account would also need a password.
      fr: |
        Les informations d'identification fédérées se configurent sur des applications ou des identités managées affectées par l'utilisateur, pas sur des comptes d'utilisateur ; un compte d'utilisateur exigerait en plus un mot de passe.
references:
  - title: Authenticate to Azure from GitHub Actions by OpenID Connect
    url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
