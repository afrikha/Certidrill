id: ai300-1a-data-images-type
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin stores 40,000 JPEG photos of aircraft parts in a folder of a blob container that is registered as a datastore in the Azure Machine Learning workspace **mlw-tailspin**. A PyTorch training script reads all the images in the folder.

    You need to register the images as a data asset that the training job can use.

    Which data asset type should you use?
  fr: |
    Tailspin stocke 40 000 photos JPEG de pièces d'avion dans un dossier d'un conteneur blob inscrit comme magasin de données dans l'espace de travail Azure Machine Learning **mlw-tailspin**. Un script d'entraînement PyTorch lit toutes les images du dossier.

    Vous devez inscrire les images comme ressource de données utilisable par le travail d'entraînement.

    Quel type de ressource de données devez-vous utiliser ?
body:
  options:
    - { id: a, text: uri_file }
    - { id: b, text: mltable }
    - { id: c, text: mlflow_model }
    - { id: d, text: uri_folder }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `uri_folder` references a folder, which suits deep learning data such as images, text or audio files that the script reads directly. The data stays in the blob container; the data asset only references it.
    fr: |
      `uri_folder` référence un dossier, ce qui convient aux données de deep learning comme les images, les textes ou les fichiers audio que le script lit directement. Les données restent dans le conteneur blob ; la ressource de données ne fait que les référencer.
  options:
    a: { en: "`uri_file` references a single file, not a folder of 40,000 images.", fr: "`uri_file` référence un seul fichier, pas un dossier de 40 000 images." }
    b: { en: "`mltable` targets tabular data with a schema; the images don't need a table definition.", fr: "`mltable` cible les données tabulaires avec un schéma ; les images n'ont pas besoin de définition de table." }
    c: { en: "`mlflow_model` is a model type used for job outputs and model assets, not a data asset type.", fr: "`mlflow_model` est un type de modèle utilisé pour les sorties de travaux et les modèles, pas un type de ressource de données." }
references:
  - title: Data concepts in Azure Machine Learning - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-data
