id: ai300-1a-cmp-instance-facts
objective: "1.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders plans to give each data scientist a compute instance in the Azure Machine Learning workspace **mlw-northwind**. The platform team is writing an internal guide about compute instances.

    Which two statements should the guide contain?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders prévoit de donner à chaque data scientist une instance de calcul dans l'espace de travail Azure Machine Learning **mlw-northwind**. L'équipe plateforme rédige un guide interne sur les instances de calcul.

    Quelles sont les deux affirmations que le guide doit contenir ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The VM size of a compute instance can't be changed after the instance is created.", fr: "La taille de machine virtuelle d'une instance de calcul ne peut pas être modifiée après sa création." } }
    - { id: b, text: { en: "Stopping a compute instance releases the cores it uses from the regional quota.", fr: "L'arrêt d'une instance de calcul libère les cœurs qu'elle utilise du quota régional." } }
    - { id: c, text: { en: "SSH access to a compute instance can be enabled at any time after its creation.", fr: "L'accès SSH à une instance de calcul peut être activé à tout moment après sa création." } }
    - { id: d, text: { en: "The name of a compute instance must be unique across the Azure region.", fr: "Le nom d'une instance de calcul doit être unique dans la région Azure." } }
    - { id: e, text: { en: "Several data scientists can share one compute instance as their development environment.", fr: "Plusieurs data scientists peuvent partager une instance de calcul comme environnement de développement." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      The VM size of a compute instance is fixed at creation, and compute instance names must be unique across the region, not only within the workspace. These two constraints matter when you plan names and sizes for each data scientist.
    fr: |
      La taille de machine virtuelle d'une instance de calcul est fixée à la création, et les noms d'instances de calcul doivent être uniques dans la région, pas seulement dans l'espace de travail. Ces deux contraintes comptent quand vous planifiez les noms et les tailles pour chaque data scientist.
  options:
    b: { en: "Stopping a compute instance doesn't release quota.", fr: "L'arrêt d'une instance de calcul ne libère pas de quota." }
    c: { en: "SSH access is disabled by default and can't be enabled or disabled after creation.", fr: "L'accès SSH est désactivé par défaut et ne peut être ni activé ni désactivé après la création." }
    e: { en: "As a development environment, a compute instance can't be shared with other users of the workspace.", fr: "En tant qu'environnement de développement, une instance de calcul ne peut pas être partagée avec d'autres utilisateurs de l'espace de travail." }
references:
  - title: Create a compute instance - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-compute-instance
