id: ai300-1a-iam-quota-scope
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has several Azure Machine Learning workspaces in one subscription. A platform engineer must set workspace-level quotas for managed compute so that no single workspace can consume all the dedicated cores of the subscription.

    You need to grant the engineer the permissions to manage these quotas. The engineer must not be able to modify other resources. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Contoso dispose de plusieurs espaces de travail Azure Machine Learning dans un abonnement. Un ingénieur plateforme doit définir des quotas au niveau de l'espace de travail pour le calcul managé, afin qu'aucun espace de travail ne puisse consommer tous les cœurs dédiés de l'abonnement.

    Vous devez accorder à l'ingénieur les autorisations nécessaires pour gérer ces quotas. L'ingénieur ne doit pas pouvoir modifier d'autres ressources. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Contributor role at the scope of each workspace.", fr: "Attribuer le rôle Contributor à l'étendue de chaque espace de travail." } }
    - { id: b, text: { en: "Assign the AzureML Compute Operator role at the scope of each workspace.", fr: "Attribuer le rôle AzureML Compute Operator à l'étendue de chaque espace de travail." } }
    - { id: c, text: { en: "Assign the Owner role at the scope of each resource group that contains a workspace.", fr: "Attribuer le rôle Owner à l'étendue de chaque groupe de ressources qui contient un espace de travail." } }
    - { id: d, text: { en: "Assign a custom role that allows only quota updates at the subscription scope.", fr: "Attribuer un rôle personnalisé qui autorise uniquement les mises à jour de quota à l'étendue de l'abonnement." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Quota operations, including workspace-level quotas for managed compute, require permissions at the subscription scope; roles at the resource group or workspace scope aren't authorized. A custom role that allows only the `updateQuotas` action, assigned at the subscription, grants this without the broad rights of Owner or Contributor.
    fr: |
      Les opérations de quota, y compris les quotas au niveau de l'espace de travail pour le calcul managé, exigent des autorisations à l'étendue de l'abonnement ; les rôles à l'étendue d'un groupe de ressources ou d'un espace de travail ne sont pas autorisés. Un rôle personnalisé qui autorise uniquement l'action `updateQuotas`, attribué sur l'abonnement, accorde ce droit sans les larges permissions d'Owner ou de Contributor.
  options:
    a: { en: "A role at workspace scope doesn't authorize quota operations.", fr: "Un rôle à l'étendue de l'espace de travail n'autorise pas les opérations de quota." }
    b: { en: "AzureML Compute Operator manages compute resources in a workspace, not subscription quotas.", fr: "AzureML Compute Operator gère les ressources de calcul d'un espace de travail, pas les quotas de l'abonnement." }
    c: { en: "Resource group scope isn't authorized for quota operations, and Owner grants far more than needed.", fr: "L'étendue d'un groupe de ressources n'est pas autorisée pour les opérations de quota, et Owner accorde bien plus que nécessaire." }
references:
  - title: Manage roles in your workspace - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-assign-roles
