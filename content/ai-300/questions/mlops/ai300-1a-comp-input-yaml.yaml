id: ai300-1a-comp-input-yaml
objective: "1.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are defining a command component named **train_churn_model** for the Azure Machine Learning workspace **mlw-fabrikam**. The component must meet the following requirements:

    - learning_rate accepts decimal values from 0.0001 to 1, with 0.01 as the default;
    - model_kind accepts only the values logistic and gradient_boosting;
    - model_output is an MLflow model that the next pipeline step can register.

    Out-of-range values must be rejected when the pipeline is validated, before it's submitted. How should you complete the YAML file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez un composant de commande nommé **train_churn_model** pour l'espace de travail Azure Machine Learning **mlw-fabrikam**. Le composant doit répondre aux exigences suivantes :

    - learning_rate accepte des valeurs décimales de 0,0001 à 1, avec 0,01 par défaut ;
    - model_kind n'accepte que les valeurs logistic et gradient_boosting ;
    - model_output est un modèle MLflow que l'étape suivante du pipeline peut inscrire.

    Les valeurs hors limites doivent être rejetées lors de la validation du pipeline, avant sa soumission. Comment devez-vous compléter le fichier YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    $schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
    type: command
    name: train_churn_model
    version: 3
    inputs:
      training_data:
        type: uri_folder
      learning_rate:
        type: [[t]]
        default: 0.01
        [[mn]]: 0.0001
        max: 1
      model_kind:
        type: string
        default: logistic
        [[e]]: [logistic, gradient_boosting]
    outputs:
      model_output:
        type: [[o]]
    code: ./train_src
    environment: azureml:churn-train-env:4
    command: >-
      python train.py --data ${{inputs.training_data}}
      --lr ${{inputs.learning_rate}} --kind ${{inputs.model_kind}}
      --model ${{outputs.model_output}}
  slots:
    - id: t
      options:
        - { id: integer, text: integer }
        - { id: number, text: number }
        - { id: string, text: string }
    - id: mn
      options:
        - { id: min, text: min }
        - { id: default, text: default }
        - { id: optional, text: optional }
    - id: e
      options:
        - { id: optional, text: optional }
        - { id: default, text: default }
        - { id: enum, text: enum }
    - id: o
      options:
        - { id: urifile, text: uri_file }
        - { id: mlflow, text: mlflow_model }
        - { id: mltable, text: mltable }
answer:
  values: { t: number, mn: min, e: enum, o: mlflow }
explanation:
  correct:
    en: |
      Decimal inputs use the `number` type; `min` and `max` can be set only on `number` or `integer` inputs, and `enum` lists the allowed values of a `string` input. These constraints are checked when the pipeline is validated. A component output of type `mlflow_model` carries an MLflow model to the next step.
    fr: |
      Les entrées décimales utilisent le type `number` ; `min` et `max` ne peuvent être définis que sur des entrées `number` ou `integer`, et `enum` liste les valeurs autorisées d'une entrée `string`. Ces contraintes sont vérifiées lors de la validation du pipeline. Une sortie de composant de type `mlflow_model` transmet un modèle MLflow à l'étape suivante.
  options:
    integer: { en: "`integer` doesn't accept decimal values such as 0.01.", fr: "`integer` n'accepte pas de valeurs décimales comme 0,01." }
    optional: { en: "`optional` is a boolean that makes an input non-mandatory.", fr: "`optional` est un booléen qui rend une entrée facultative." }
    mltable: { en: "`mltable` describes tabular data, not a model.", fr: "`mltable` décrit des données tabulaires, pas un modèle." }
references:
  - title: CLI (v2) command component YAML schema - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-component-command
