id: ai300-cs3a-workspace-bicep
objective: "1.3.2"
type: dropdown
caseStudy: ai300-cs3a-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You are completing main.bicep. You plan to deploy the file by running `az deployment group create --resource-group rg-claims-prod --template-file main.bicep`.

    You need to configure mlw-claims-prod to meet the production workspace requirements.

    How should you complete the resource definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous complétez main.bicep. Vous prévoyez de déployer le fichier en exécutant `az deployment group create --resource-group rg-claims-prod --template-file main.bicep`.

    Vous devez configurer mlw-claims-prod pour respecter les exigences relatives à l'espace de travail de production.

    Comment devez-vous compléter la définition de la ressource ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    resource mlwProd 'Microsoft.MachineLearningServices/workspaces@2026-09-01' = {
      name: 'mlw-claims-prod'
      location: 'westeurope'
      identity: {
        type: 'SystemAssigned'
      }
      properties: {
        storageAccount: stClaimsProd.id
        keyVault: kvClaimsProd.id
        applicationInsights: appiClaimsProd.id
        hbiWorkspace: [[hbi]]
        publicNetworkAccess: [[pna]]
        managedNetwork: {
          isolationMode: [[iso]]
        }
      }
    }
  slots:
    - id: hbi
      options:
        - { id: "true", text: "true" }
        - { id: "false", text: "false" }
    - id: pna
      options:
        - { id: enabled, text: "'Enabled'" }
        - { id: disabled, text: "'Disabled'" }
    - id: iso
      options:
        - { id: internet, text: "'AllowInternetOutbound'" }
        - { id: approved, text: "'AllowOnlyApprovedOutbound'" }
        - { id: none, text: "'Disabled'" }
answer:
  values: { hbi: "true", pna: disabled, iso: internet }
explanation:
  correct:
    en: "`hbiWorkspace: true` flags the workspace as holding high business impact data and reduces the diagnostic data that the service collects (requirement 3). `publicNetworkAccess: 'Disabled'` leaves the private endpoint as the only way in (requirement 1). The `AllowInternetOutbound` isolation mode creates a managed virtual network for compute and still lets jobs reach any internet source, as requirement 2 asks."
    fr: "`hbiWorkspace: true` signale que l'espace de travail contient des données à fort impact métier et réduit les données de diagnostic collectées par le service (exigence 3). `publicNetworkAccess: 'Disabled'` laisse le point de terminaison privé comme seul accès (exigence 1). Le mode d'isolation `AllowInternetOutbound` crée un réseau virtuel managé pour les calculs tout en laissant les travaux joindre n'importe quelle source sur Internet, comme le demande l'exigence 2."
  options:
    approved:
      en: "`AllowOnlyApprovedOutbound` blocks every destination that has no outbound rule, so jobs could not download packages from any public source."
      fr: "`AllowOnlyApprovedOutbound` bloque toute destination sans règle de trafic sortant : les travaux ne pourraient pas télécharger de packages depuis n'importe quelle source publique."
    none:
      en: "`Disabled` means no managed virtual network, which contradicts requirement 2."
      fr: "`Disabled` signifie qu'il n'y a pas de réseau virtuel managé, ce qui contredit l'exigence 2."
    enabled:
      en: "With public network access enabled, the workspace stays reachable from the internet in addition to the private endpoint."
      fr: "Avec l'accès réseau public activé, l'espace de travail reste accessible depuis Internet en plus du point de terminaison privé."
references:
  - title: Microsoft.MachineLearningServices/workspaces
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.machinelearningservices/workspaces
  - title: Managed virtual network isolation
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
