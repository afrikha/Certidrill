id: ai300-1b-iac-bicep-workspace
objective: "1.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are completing a Bicep file that deploys an Azure Machine Learning workspace named **mlw-woodgrove-prod**. The workspace must meet the following requirements:

    - It must not accept requests from the public network.
    - Its managed compute may send outbound traffic only to approved destinations.
    - It must access its default storage account by using identity-based access, without account keys or SAS tokens.

    How should you complete the file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous complétez un fichier Bicep qui déploie un espace de travail Azure Machine Learning nommé **mlw-woodgrove-prod**. L'espace de travail doit respecter les exigences suivantes :

    - il ne doit pas accepter de requêtes depuis le réseau public ;
    - son calcul managé ne peut envoyer du trafic sortant que vers des destinations approuvées ;
    - il doit accéder à son compte de stockage par défaut avec un accès basé sur l'identité, sans clés de compte ni jetons SAS.

    Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    resource workspace 'Microsoft.MachineLearningServices/workspaces@2026-05-01' = {
      name: 'mlw-woodgrove-prod'
      location: location
      identity: {
        type: 'SystemAssigned'
      }
      properties: {
        storageAccount: storageAccountId
        keyVault: keyVaultId
        applicationInsights: appInsightsId
        publicNetworkAccess: [[pna]]
        systemDatastoresAuthMode: [[auth]]
        managedNetwork: {
          isolationMode: [[iso]]
        }
      }
    }
  slots:
    - id: pna
      options:
        - { id: dis, text: "'Disabled'" }
        - { id: bool, text: "false" }
        - { id: enab, text: "'Enabled'" }
    - id: auth
      options:
        - { id: key, text: "'AccessKey'" }
        - { id: sas, text: "'UserDelegationSAS'" }
        - { id: identity, text: "'Identity'" }
    - id: iso
      options:
        - { id: inet, text: "'AllowInternetOutbound'" }
        - { id: approved, text: "'AllowOnlyApprovedOutbound'" }
        - { id: snake, text: "'allow_only_approved_outbound'" }
answer:
  values: { pna: dis, auth: identity, iso: approved }
explanation:
  correct:
    en: |
      In Bicep, `publicNetworkAccess` takes `'Enabled'` or `'Disabled'`, `systemDatastoresAuthMode` takes `'AccessKey'`, `'Identity'` or `'UserDelegationSAS'`, and `managedNetwork.isolationMode` takes `'AllowInternetOutbound'`, `'AllowOnlyApprovedOutbound'` or `'Disabled'`.
    fr: |
      En Bicep, `publicNetworkAccess` accepte `'Enabled'` ou `'Disabled'`, `systemDatastoresAuthMode` accepte `'AccessKey'`, `'Identity'` ou `'UserDelegationSAS'`, et `managedNetwork.isolationMode` accepte `'AllowInternetOutbound'`, `'AllowOnlyApprovedOutbound'` ou `'Disabled'`.
  options:
    bool: { en: "publicNetworkAccess is a string property, not a Boolean.", fr: "publicNetworkAccess est une propriété de type chaîne, pas un booléen." }
    enab: { en: "'Enabled' allows requests from the public network.", fr: "'Enabled' autorise les requêtes depuis le réseau public." }
    key: { en: "AccessKey uses the storage account keys, which the requirement excludes.", fr: "AccessKey utilise les clés du compte de stockage, ce que l'exigence exclut." }
    sas: { en: "UserDelegationSAS relies on SAS tokens, which the requirement excludes.", fr: "UserDelegationSAS repose sur des jetons SAS, ce que l'exigence exclut." }
    inet: { en: "AllowInternetOutbound allows all internet outbound traffic.", fr: "AllowInternetOutbound autorise tout le trafic sortant vers Internet." }
    snake: { en: "snake_case values belong to the CLI YAML file, not to Bicep.", fr: "Les valeurs en snake_case appartiennent au fichier YAML de la CLI, pas à Bicep." }
references:
  - title: Microsoft.MachineLearningServices/workspaces
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.machinelearningservices/workspaces
