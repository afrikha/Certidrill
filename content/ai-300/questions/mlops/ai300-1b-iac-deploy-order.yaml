id: ai300-1b-iac-deploy-order
objective: "1.3.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a Bicep file named **main.bicep** that deploys an Azure Machine Learning workspace named **mlw-proseware**, its associated resources and a compute cluster. The target resource group **rg-ml-proseware** doesn't exist yet. You also have an environment definition named **train-env.yml**.

    You need to deploy the infrastructure and then register the environment in the workspace. You must review the predicted changes before anything is deployed.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un fichier Bicep nommé **main.bicep** qui déploie un espace de travail Azure Machine Learning nommé **mlw-proseware**, ses ressources associées et un cluster de calcul. Le groupe de ressources cible **rg-ml-proseware** n'existe pas encore. Vous disposez aussi d'une définition d'environnement nommée **train-env.yml**.

    Vous devez déployer l'infrastructure, puis inscrire l'environnement dans l'espace de travail. Vous devez examiner les modifications prévues avant tout déploiement.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: rg, text: { en: "Run `az group create` for rg-ml-proseware.", fr: "Exécuter `az group create` pour rg-ml-proseware." } }
    - { id: whatif, text: { en: "Run `az deployment group what-if` with main.bicep.", fr: "Exécuter `az deployment group what-if` avec main.bicep." } }
    - { id: create, text: { en: "Run `az deployment group create` with main.bicep.", fr: "Exécuter `az deployment group create` avec main.bicep." } }
    - { id: env, text: { en: "Run `az ml environment create --file train-env.yml` against mlw-proseware.", fr: "Exécuter `az ml environment create --file train-env.yml` sur mlw-proseware." } }
    - { id: decompile, text: { en: "Run `az bicep decompile` on main.bicep.", fr: "Exécuter `az bicep decompile` sur main.bicep." } }
    - { id: wscreate, text: { en: "Run `az ml workspace create --name mlw-proseware`.", fr: "Exécuter `az ml workspace create --name mlw-proseware`." } }
answer:
  sequence: [ rg, whatif, create, env ]
explanation:
  correct:
    en: |
      A resource group deployment needs an existing resource group, so you create it first. what-if then previews the changes without deploying anything, `az deployment group create` deploys the workspace and its compute, and only then can the environment be registered in the new workspace.
    fr: |
      Un déploiement au niveau du groupe de ressources exige un groupe de ressources existant : vous le créez d'abord. what-if affiche ensuite l'aperçu des modifications sans rien déployer, `az deployment group create` déploie l'espace de travail et son calcul, et ce n'est qu'ensuite que l'environnement peut être inscrit dans le nouvel espace de travail.
  options:
    decompile: { en: "az bicep decompile converts an ARM JSON template to Bicep; main.bicep is already a Bicep file.", fr: "az bicep decompile convertit un modèle ARM JSON en Bicep ; main.bicep est déjà un fichier Bicep." }
    wscreate: { en: "The Bicep file already deploys the workspace; creating it again with the CLI is redundant.", fr: "Le fichier Bicep déploie déjà l'espace de travail ; le recréer avec la CLI est redondant." }
references:
  - title: "Bicep What-If: Preview Changes Before Deployment"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if
  - title: Create workspaces with Azure CLI
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-workspace-cli
