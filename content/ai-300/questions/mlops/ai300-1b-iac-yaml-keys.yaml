id: ai300-1b-iac-yaml-keys
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are writing a file named **workspace.yml** that you will pass to `az ml workspace create --file workspace.yml --resource-group rg-ml-tailspin`. The workspace must not be reachable from the public network, and its managed virtual network must allow only approved outbound traffic.

    Which two entries are valid in workspace.yml for these requirements?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous rédigez un fichier nommé **workspace.yml** que vous passerez à `az ml workspace create --file workspace.yml --resource-group rg-ml-tailspin`. L'espace de travail ne doit pas être accessible depuis le réseau public, et son réseau virtuel managé ne doit autoriser que le trafic sortant approuvé.

    Quelles sont les deux entrées valides dans workspace.yml pour ces exigences ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "publicNetworkAccess: Disabled" }
    - { id: b, text: "public_network_access: disabled" }
    - { id: c, text: "managedNetwork: { isolationMode: AllowOnlyApprovedOutbound }" }
    - { id: d, text: "managed_network: { isolation_mode: allow_only_approved_outbound }" }
    - { id: e, text: "managed_network: { isolation_mode: disabled }" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The CLI (v2) workspace YAML uses snake_case keys and values, such as `public_network_access` and `managed_network.isolation_mode` with the value `allow_only_approved_outbound`. The camelCase names with PascalCase values are the Bicep and ARM properties of the same settings.
    fr: |
      Le YAML d'espace de travail de la CLI (v2) utilise des clés et des valeurs en snake_case, comme `public_network_access` et `managed_network.isolation_mode` avec la valeur `allow_only_approved_outbound`. Les noms en camelCase avec des valeurs en PascalCase sont les propriétés Bicep et ARM des mêmes paramètres.
  options:
    a:
      en: |
        publicNetworkAccess is the Bicep/ARM property name, not a key of the CLI workspace YAML.
      fr: |
        publicNetworkAccess est le nom de propriété Bicep/ARM, pas une clé du YAML d'espace de travail de la CLI.
    c:
      en: |
        managedNetwork.isolationMode with AllowOnlyApprovedOutbound is the Bicep/ARM spelling.
      fr: |
        managedNetwork.isolationMode avec AllowOnlyApprovedOutbound est l'écriture Bicep/ARM.
    e:
      en: |
        The disabled mode doesn't restrict outbound traffic from managed compute.
      fr: |
        Le mode disabled ne restreint pas le trafic sortant du calcul managé.
references:
  - title: CLI (v2) workspace YAML schema
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-workspace
  - title: Microsoft.MachineLearningServices/workspaces
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.machinelearningservices/workspaces
