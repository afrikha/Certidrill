id: ai300-1b-git-ssh-order
objective: "1.3.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A data scientist has a compute instance in an Azure Machine Learning workspace. She needs to clone the private GitHub repository **wingtip/forecast-ml** onto the workspace file share by using SSH authentication, so that her clone survives the deletion of the compute instance.

    Which four actions should she perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une data scientist dispose d'une instance de calcul dans un espace de travail Azure Machine Learning. Elle doit cloner le dépôt GitHub privé **wingtip/forecast-ml** sur le partage de fichiers de l'espace de travail en utilisant une authentification SSH, afin que son clone survive à la suppression de l'instance de calcul.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: term, text: { en: "Open a terminal on the compute instance.", fr: "Ouvrir un terminal sur l'instance de calcul." } }
    - { id: keygen, text: { en: "Run `ssh-keygen -t ed25519` in the terminal.", fr: "Exécuter `ssh-keygen -t ed25519` dans le terminal." } }
    - { id: pub, text: { en: "Add the content of `~/.ssh/id_ed25519.pub` to her GitHub account.", fr: "Ajouter le contenu de `~/.ssh/id_ed25519.pub` à son compte GitHub." } }
    - { id: clone, text: { en: "Run `git clone git@github.com:wingtip/forecast-ml.git` from her folder under `~/cloudfiles/code/Users/`.", fr: "Exécuter `git clone git@github.com:wingtip/forecast-ml.git` depuis son dossier sous `~/cloudfiles/code/Users/`." } }
    - { id: priv, text: { en: "Add the content of `~/.ssh/id_ed25519` to her GitHub account.", fr: "Ajouter le contenu de `~/.ssh/id_ed25519` à son compte GitHub." } }
    - { id: local, text: { en: "Run `git clone git@github.com:wingtip/forecast-ml.git` from `/home/azureuser`.", fr: "Exécuter `git clone git@github.com:wingtip/forecast-ml.git` depuis `/home/azureuser`." } }
answer:
  sequence: [ term, keygen, pub, clone ]
explanation:
  correct:
    en: |
      The compute instance terminal has a full Git client. You generate the key pair there, register only the public key (`.pub`) with GitHub, then clone with the SSH URL into your user folder of `~/cloudfiles/code/`, the shared file system that is kept when the instance is deleted.
    fr: |
      Le terminal de l'instance de calcul dispose d'un client Git complet. Vous y générez la paire de clés, vous n'inscrivez que la clé publique (`.pub`) dans GitHub, puis vous clonez avec l'URL SSH dans votre dossier utilisateur de `~/cloudfiles/code/`, le système de fichiers partagé qui est conservé quand l'instance est supprimée.
  options:
    priv: { en: "The private key must never leave the compute instance; GitHub needs the public key.", fr: "La clé privée ne doit jamais quitter l'instance de calcul ; GitHub a besoin de la clé publique." }
    local: { en: "The local file system of the instance is lost when the instance is deleted.", fr: "Le système de fichiers local de l'instance est perdu quand l'instance est supprimée." }
references:
  - title: Git integration
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-train-model-git-integration
