id: ai300-1b-net-inbound-private
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Machine Learning workspace named **mlw-litware** that currently allows public network access. The corporate network is connected to a virtual network named **vnet-hub** by ExpressRoute and uses the address range 10.20.0.0/16.

    You need to ensure that users can reach the workspace and the studio only through vnet-hub. Access from the internet must be blocked.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un espace de travail Azure Machine Learning nommé **mlw-litware** qui autorise actuellement l'accès réseau public. Le réseau de l'entreprise est connecté à un réseau virtuel nommé **vnet-hub** par ExpressRoute et utilise la plage d'adresses 10.20.0.0/16.

    Vous devez faire en sorte que les utilisateurs ne puissent atteindre l'espace de travail et le studio que par vnet-hub. L'accès depuis Internet doit être bloqué.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Create a private endpoint in vnet-hub for mlw-litware with the group ID amlworkspace.", fr: "Créer dans vnet-hub un point de terminaison privé pour mlw-litware avec l'ID de groupe amlworkspace." }
    - id: b
      text: { en: "Add 10.20.0.0/16 to the IP network rules of the workspace.", fr: "Ajouter 10.20.0.0/16 aux règles de réseau IP de l'espace de travail." }
    - id: c
      text: { en: "Set the public network access of mlw-litware to Disabled.", fr: "Définir l'accès réseau public de mlw-litware sur Disabled." }
    - id: d
      text: { en: "Set the managed network isolation mode to allow_only_approved_outbound.", fr: "Définir le mode d'isolation du réseau managé sur allow_only_approved_outbound." }
    - id: e
      text: { en: "Add an fqdn outbound rule for ml.azure.com.", fr: "Ajouter une règle de trafic sortant fqdn pour ml.azure.com." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Inbound isolation combines a private endpoint for the workspace (group ID `amlworkspace`, private DNS zones `privatelink.api.azureml.ms` and `privatelink.notebooks.azure.net`) in the virtual network that users reach, and public network access set to Disabled so that requests from the internet are refused.
    fr: |
      L'isolation entrante combine un point de terminaison privé pour l'espace de travail (ID de groupe `amlworkspace`, zones DNS privées `privatelink.api.azureml.ms` et `privatelink.notebooks.azure.net`) dans le réseau virtuel que les utilisateurs atteignent, et l'accès réseau public défini sur Disabled afin que les requêtes depuis Internet soient refusées.
  options:
    b:
      en: |
        IP network rules accept only public IPv4 addresses; private ranges such as 10.x aren't allowed, and the rules keep public access enabled.
      fr: |
        Les règles de réseau IP n'acceptent que des adresses IPv4 publiques ; les plages privées comme 10.x ne sont pas autorisées, et ces règles laissent l'accès public activé.
    d:
      en: |
        The isolation mode controls outbound traffic from managed compute, not inbound access by users.
      fr: |
        Le mode d'isolation contrôle le trafic sortant du calcul managé, pas l'accès entrant des utilisateurs.
    e:
      en: |
        An outbound rule applies to traffic leaving the managed network, not to users connecting to the workspace.
      fr: |
        Une règle de trafic sortant s'applique au trafic qui quitte le réseau managé, pas aux utilisateurs qui se connectent à l'espace de travail.
references:
  - title: Configure a private endpoint
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-private-link
  - title: Plan for network isolation
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-network-isolation-planning
