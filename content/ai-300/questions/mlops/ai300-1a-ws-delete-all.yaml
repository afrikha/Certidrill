id: ai300-1a-ws-delete-all
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The resource group **rg-ml-poc** contains an Azure Machine Learning workspace named **mlw-poc**, the storage account, key vault, container registry and Application Insights instance created with it, and a virtual network used by other teams.

    The proof of concept is over. You need to delete the workspace and its four associated resources by using a single Azure CLI command. The workspace name must be available for reuse immediately, and the virtual network must be kept.

    Which command should you run?
  fr: |
    Le groupe de ressources **rg-ml-poc** contient un espace de travail Azure Machine Learning nommé **mlw-poc**, le compte de stockage, le coffre de clés, le registre de conteneurs et l'instance Application Insights créés avec lui, ainsi qu'un réseau virtuel utilisé par d'autres équipes.

    La preuve de concept est terminée. Vous devez supprimer l'espace de travail et ses quatre ressources associées avec une seule commande Azure CLI. Le nom de l'espace de travail doit pouvoir être réutilisé immédiatement, et le réseau virtuel doit être conservé.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "`az ml workspace delete -n mlw-poc -g rg-ml-poc --all-resources --yes`" }
    - { id: b, text: "`az ml workspace delete -n mlw-poc -g rg-ml-poc --permanently-delete --yes`" }
    - { id: c, text: "`az ml workspace delete -n mlw-poc -g rg-ml-poc --permanently-delete --all-resources --yes`" }
    - { id: d, text: "`az group delete -n rg-ml-poc --yes`" }
answer: { optionId: c }
explanation:
  correct:
    en: "`--permanently-delete` bypasses the default soft delete, so the name can be reused at once, and `--all-resources` also deletes the storage account, container registry, Application Insights and key vault of the workspace. Both flags are required, and the command doesn't touch other resources of the group."
    fr: "`--permanently-delete` contourne la suppression réversible par défaut, ce qui permet de réutiliser le nom tout de suite, et `--all-resources` supprime aussi le compte de stockage, le registre de conteneurs, Application Insights et le coffre de clés de l'espace de travail. Les deux options sont nécessaires, et la commande ne touche pas aux autres ressources du groupe."
  options:
    a: { en: "Without `--permanently-delete`, the workspace is soft-deleted and keeps its name for the retention period.", fr: "Sans `--permanently-delete`, l'espace de travail est placé en suppression réversible et conserve son nom pendant la période de rétention." }
    b: { en: "Without `--all-resources`, the associated resources aren't deleted with the workspace.", fr: "Sans `--all-resources`, les ressources associées ne sont pas supprimées avec l'espace de travail." }
    d: { en: "Deleting the resource group also deletes the virtual network that must be kept.", fr: "Supprimer le groupe de ressources supprime aussi le réseau virtuel qui doit être conservé." }
references:
  - title: az ml workspace
    url: https://learn.microsoft.com/en-us/cli/azure/ml/workspace
  - title: Workspace soft deletion - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-soft-delete
