id: ai300-1a-data-archive
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The Azure Machine Learning workspace **mlw-woodgrove** contains a data asset named **loans-2024** with versions 1, 2 and 3. A scheduled retraining pipeline references `azureml:loans-2024:3`.

    You run `az ml data archive --name loans-2024`.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    L'espace de travail Azure Machine Learning **mlw-woodgrove** contient une ressource de données nommée **loans-2024** avec les versions 1, 2 et 3. Un pipeline de réentraînement planifié référence `azureml:loans-2024:3`.

    Vous exécutez `az ml data archive --name loans-2024`.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The files referenced by loans-2024 are deleted from the datastore.", fr: "Les fichiers référencés par loans-2024 sont supprimés du magasin de données." } }
    - { id: b, text: { en: "loans-2024 no longer appears in the output of `az ml data list` by default.", fr: "loans-2024 n'apparaît plus par défaut dans la sortie de `az ml data list`." } }
    - { id: c, text: { en: "The retraining pipeline can still use version 3 of loans-2024.", fr: "Le pipeline de réentraînement peut toujours utiliser la version 3 de loans-2024." } }
    - { id: d, text: { en: "You can restore only version 3 and leave versions 1 and 2 archived.", fr: "Vous pouvez restaurer uniquement la version 3 et laisser les versions 1 et 2 archivées." } }
    - { id: e, text: { en: "New jobs that reference loans-2024 fail until the asset is restored.", fr: "Les nouveaux travaux qui référencent loans-2024 échouent tant que la ressource n'est pas restaurée." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Archiving hides a data asset by default from list queries such as `az ml data list` and from the studio listing, but workflows can still reference and use it. The command archived all versions, and the data in storage isn't touched because a data asset is only a reference.
    fr: |
      L'archivage masque par défaut une ressource de données des requêtes de liste comme `az ml data list` et de la liste du studio, mais les flux de travail peuvent toujours la référencer et l'utiliser. La commande a archivé toutes les versions, et les données du stockage ne sont pas touchées, car une ressource de données n'est qu'une référence.
  options:
    a: { en: "A data asset only references the data; archiving it doesn't delete the files.", fr: "Une ressource de données ne fait que référencer les données ; l'archiver ne supprime pas les fichiers." }
    d: { en: "When all versions are archived, you can't restore individual versions; you must restore all of them.", fr: "Quand toutes les versions sont archivées, vous ne pouvez pas restaurer des versions individuelles ; vous devez toutes les restaurer." }
    e: { en: "Archived data assets can still be referenced and used in workflows.", fr: "Les ressources de données archivées peuvent toujours être référencées et utilisées dans les flux de travail." }
references:
  - title: Create Data Assets - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-data-assets
