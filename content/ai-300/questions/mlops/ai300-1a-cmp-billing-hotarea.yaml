id: ai300-1a-cmp-billing-hotarea
objective: "1.1.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    The Azure Machine Learning workspace **mlw-woodgrove** contains the compute targets shown in the following table. No job is currently running or queued.

    Answer each prompt by selecting the appropriate compute target.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'espace de travail Azure Machine Learning **mlw-woodgrove** contient les cibles de calcul indiquées dans le tableau suivant. Aucun travail n'est en cours d'exécution ni en file d'attente.

    Répondez à chaque consigne en sélectionnant la cible de calcul appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The compute cluster that incurs compute charges right now", fr: "Le cluster de calcul qui entraîne des coûts de calcul en ce moment" }
    - id: p2
      text: { en: "The compute cluster on which a running job can be preempted", fr: "Le cluster de calcul sur lequel un travail en cours peut être préempté" }
  grid:
    header: [{ en: Name, fr: Nom }, Type, { en: Tier, fr: Niveau }, min_instances, max_instances, { en: Current nodes, fr: Nœuds actuels }]
    rows:
      - [{ text: cpu-dev, area: cpudev }, { text: { en: Compute cluster, fr: Cluster de calcul } }, { text: dedicated }, { text: "0" }, { text: "2" }, { text: "0" }]
      - [{ text: cpu-batch, area: cpubatch }, { text: { en: Compute cluster, fr: Cluster de calcul } }, { text: low_priority }, { text: "0" }, { text: "8" }, { text: "0" }]
      - [{ text: gpu-train, area: gputrain }, { text: { en: Compute cluster, fr: Cluster de calcul } }, { text: dedicated }, { text: "1" }, { text: "4" }, { text: { en: "1 (idle)", fr: "1 (inactif)" } }]
      - [{ text: ci-ana, area: ciana }, { text: { en: Compute instance, fr: Instance de calcul } }, { text: "-" }, { text: "-" }, { text: "-" }, { text: { en: Stopped, fr: Arrêtée } }]
answer:
  values: { p1: gputrain, p2: cpubatch }
explanation:
  correct:
    en: |
      gpu-train keeps one node running because `min_instances` is 1, so that node is billed even though no job runs. The clusters with `min_instances: 0` have no node. cpu-batch uses the `low_priority` tier, whose VMs can be preempted while in use; a preempted job must be restarted.
    fr: |
      gpu-train maintient un nœud en fonctionnement, car `min_instances` vaut 1 : ce nœud est facturé même sans travail. Les clusters avec `min_instances: 0` n'ont aucun nœud. cpu-batch utilise le niveau `low_priority`, dont les machines virtuelles peuvent être préemptées en cours d'utilisation ; un travail préempté doit être redémarré.
references:
  - title: Create compute clusters - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-attach-compute-cluster
