id: ai300-1a-ds-job-uri
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    The Azure Machine Learning workspace **mlw-adatum** has a datastore named **sales_raw** that points to a blob container. You are writing a command job that profiles the files in the folder **2026/11/** of that container.

    The job must read the folder directly from the datastore, without creating a data asset. The files must be copied to the local disk of the compute before the script starts.

    How should you complete the job YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'espace de travail Azure Machine Learning **mlw-adatum** a un magasin de données nommé **sales_raw** qui pointe vers un conteneur blob. Vous écrivez un travail de commande qui analyse les fichiers du dossier **2026/11/** de ce conteneur.

    Le travail doit lire le dossier directement à partir du magasin de données, sans créer de ressource de données. Les fichiers doivent être copiés sur le disque local du calcul avant le démarrage du script.

    Comment devez-vous compléter le fichier YAML du travail ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    $schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
    command: python profile.py --data ${{inputs.raw}}
    code: ./src
    environment: azureml:profiling-env:2
    compute: azureml:cpu-cluster
    inputs:
      raw:
        type: uri_folder
        path: [[p]]
        mode: [[m]]
  slots:
    - id: p
      options:
        - { id: asset, text: "azureml:sales_raw:2026/11" }
        - { id: ds, text: "azureml://datastores/sales_raw/paths/2026/11/" }
        - { id: https, text: "https://sales_raw.blob.core.windows.net/2026/11/" }
        - { id: short, text: "azureml://sales_raw/paths/2026/11/" }
    - id: m
      options:
        - { id: ro, text: ro_mount }
        - { id: dl, text: download }
        - { id: direct, text: direct }
        - { id: up, text: upload }
answer:
  values: { p: ds, m: dl }
explanation:
  correct:
    en: |
      A datastore path is referenced with the URI `azureml://datastores/<datastore-name>/paths/<path>`, so no data asset is needed. The `download` mode copies the input data to the compute target before the job runs.
    fr: |
      Un chemin de magasin de données est référencé avec l'URI `azureml://datastores/<nom-du-magasin>/paths/<chemin>` : aucune ressource de données n'est nécessaire. Le mode `download` copie les données d'entrée sur la cible de calcul avant l'exécution du travail.
  options:
    asset: { en: "`azureml:<name>:<version>` references a registered data asset, which the requirements exclude.", fr: "`azureml:<nom>:<version>` référence une ressource de données inscrite, ce que les exigences excluent." }
    https: { en: "A datastore name isn't a storage account name, and this URL doesn't use the datastore.", fr: "Un nom de magasin de données n'est pas un nom de compte de stockage, et cette URL n'utilise pas le magasin de données." }
    short: { en: "The datastore URI must contain the `datastores` segment before the datastore name.", fr: "L'URI du magasin de données doit contenir le segment `datastores` avant le nom du magasin." }
    ro: { en: "`ro_mount` mounts the storage path instead of copying the files to the local disk.", fr: "`ro_mount` monte le chemin de stockage au lieu de copier les fichiers sur le disque local." }
    direct: { en: "`direct` passes the URI as a string and lets the code read the data itself.", fr: "`direct` transmet l'URI sous forme de chaîne et laisse le code lire lui-même les données." }
    up: { en: "`upload` is an output mode, not an input mode.", fr: "`upload` est un mode de sortie, pas un mode d'entrée." }
references:
  - title: Access data in a job - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-read-write-data-v2
  - title: Data concepts in Azure Machine Learning - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-data
