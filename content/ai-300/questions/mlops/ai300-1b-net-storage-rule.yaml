id: ai300-1b-net-storage-rule
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Azure Machine Learning workspace named **mlw-contoso-prod** uses a managed virtual network in the allow only approved outbound mode. Training jobs must read blobs from a storage account named **stcontososales**, which isn't one of the workspace's associated resources.

    The workspace managed identity has the Azure AI Enterprise Network Connection Approver role. The solution must not allow the compute to reach any other storage account.

    Which outbound rule should you add?
  fr: |
    Un espace de travail Azure Machine Learning nommé **mlw-contoso-prod** utilise un réseau virtuel managé en mode allow only approved outbound. Les travaux d'entraînement doivent lire des objets blob dans un compte de stockage nommé **stcontososales**, qui ne fait pas partie des ressources associées à l'espace de travail.

    L'identité managée de l'espace de travail possède le rôle Azure AI Enterprise Network Connection Approver. La solution ne doit permettre au calcul d'atteindre aucun autre compte de stockage.

    Quelle règle de trafic sortant devez-vous ajouter ?
body:
  options:
    - id: a
      text: { en: "A fqdn rule with the destination stcontososales.blob.core.windows.net", fr: "Une règle fqdn avec la destination stcontososales.blob.core.windows.net" }
    - id: b
      text: { en: "A service_tag rule with the Storage service tag on port 443", fr: "Une règle service_tag avec la balise de service Storage sur le port 443" }
    - id: c
      text: { en: "A private_endpoint rule to stcontososales with subresource_target set to blob", fr: "Une règle private_endpoint vers stcontososales avec subresource_target défini sur blob" }
    - id: d
      text: { en: "A private_endpoint rule to stcontososales with subresource_target set to file", fr: "Une règle private_endpoint vers stcontososales avec subresource_target défini sur file" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A private endpoint outbound rule creates a private endpoint from the managed network to the specific storage account, here for the blob subresource. The workspace identity needs the approver role so that the private endpoint connection can be approved.
    fr: |
      Une règle de trafic sortant de point de terminaison privé crée un point de terminaison privé depuis le réseau managé vers le compte de stockage précis, ici pour la sous-ressource blob. L'identité de l'espace de travail a besoin du rôle d'approbateur pour que la connexion du point de terminaison privé puisse être approuvée.
  options:
    a:
      en: |
        In the approved outbound mode, you can't use an FQDN rule to access Azure Storage accounts; Microsoft Learn says to use a private endpoint instead.
      fr: |
        En mode approved outbound, vous ne pouvez pas utiliser de règle FQDN pour accéder aux comptes Stockage Azure ; Microsoft Learn indique d'utiliser un point de terminaison privé à la place.
    b:
      en: |
        The Storage service tag covers storage accounts in general, so compute could reach other storage accounts.
      fr: |
        La balise de service Storage couvre les comptes de stockage en général : le calcul pourrait atteindre d'autres comptes de stockage.
    d:
      en: |
        The jobs read blobs, so the private endpoint must target the blob subresource, not Azure Files.
      fr: |
        Les travaux lisent des objets blob : le point de terminaison privé doit cibler la sous-ressource blob, pas Azure Files.
references:
  - title: Managed virtual network isolation
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
