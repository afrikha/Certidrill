id: ai300-1a-ds-default-stores
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has an Azure Machine Learning workspace named **mlw-litware** that uses its default storage account. Data scientists create notebooks and files on their compute instances.

    The backup team asks which default datastore of the workspace points to the location where these notebooks and compute instance files are stored.

    Which datastore should you identify?
  fr: |
    Litware dispose d'un espace de travail Azure Machine Learning nommé **mlw-litware** qui utilise son compte de stockage par défaut. Les data scientists créent des notebooks et des fichiers sur leurs instances de calcul.

    L'équipe de sauvegarde demande quel magasin de données par défaut de l'espace de travail pointe vers l'emplacement où ces notebooks et fichiers des instances de calcul sont stockés.

    Quel magasin de données devez-vous indiquer ?
body:
  options:
    - { id: a, text: workspaceblobstore }
    - { id: b, text: workspaceartifactstore }
    - { id: c, text: workspaceworkingdirectory }
    - { id: d, text: workspacefilestore }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `workspaceworkingdirectory` is a file share in the default storage account that stores the data of notebooks and compute instances. The other default datastores hold data uploads and job snapshots (`workspaceblobstore`), assets such as metrics and models (`workspaceartifactstore`) and alternative data uploads (`workspacefilestore`).
    fr: |
      `workspaceworkingdirectory` est un partage de fichiers du compte de stockage par défaut qui stocke les données des notebooks et des instances de calcul. Les autres magasins de données par défaut contiennent les données chargées et les instantanés de code des travaux (`workspaceblobstore`), des actifs comme les métriques et les modèles (`workspaceartifactstore`) et d'autres chargements de données (`workspacefilestore`).
  options:
    a: { en: "workspaceblobstore is the default blob datastore for data uploads, job code snapshots and pipeline data cache.", fr: "workspaceblobstore est le magasin de données blob par défaut pour les données chargées, les instantanés de code des travaux et le cache des données de pipeline." }
    b: { en: "workspaceartifactstore stores assets such as metrics, models and components.", fr: "workspaceartifactstore stocke des actifs comme les métriques, les modèles et les composants." }
    d: { en: "workspacefilestore is a file share used as an alternative container for data uploads.", fr: "workspacefilestore est un partage de fichiers utilisé comme autre conteneur pour les chargements de données." }
references:
  - title: Data concepts in Azure Machine Learning - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-data
