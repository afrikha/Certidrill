id: ai300-1a-iam-ds-role
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has an Azure Machine Learning workspace named **mlw-proseware**. The data science team submits training jobs, registers models and deploys them to endpoints in the workspace.

    You need to grant the team the required permissions. The team must not be able to create or delete compute resources or to modify the workspace itself. The solution must follow the principle of least privilege.

    Which role should you assign to the team on mlw-proseware?
  fr: |
    Proseware dispose d'un espace de travail Azure Machine Learning nommé **mlw-proseware**. L'équipe de data science soumet des travaux d'entraînement, inscrit des modèles et les déploie sur des points de terminaison dans l'espace de travail.

    Vous devez accorder à l'équipe les autorisations nécessaires. L'équipe ne doit pas pouvoir créer ni supprimer de ressources de calcul, ni modifier l'espace de travail lui-même. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à l'équipe sur mlw-proseware ?
body:
  options:
    - { id: a, text: AzureML Data Scientist }
    - { id: b, text: AzureML Compute Operator }
    - { id: c, text: Contributor }
    - { id: d, text: Reader }
answer: { optionId: a }
explanation:
  correct:
    en: |
      AzureML Data Scientist allows all actions within a workspace, such as submitting jobs, registering models and deploying endpoints, except creating or deleting compute resources and modifying the workspace itself. It matches the requirements without granting extra permissions.
    fr: |
      AzureML Data Scientist autorise toutes les actions dans un espace de travail, comme soumettre des travaux, inscrire des modèles et déployer des points de terminaison, sauf créer ou supprimer des ressources de calcul et modifier l'espace de travail lui-même. Il répond aux exigences sans accorder d'autorisations supplémentaires.
  options:
    c: { en: "Contributor also lets users create compute clusters and modify the workspace.", fr: "Contributor permet aussi de créer des clusters de calcul et de modifier l'espace de travail." }
    b: { en: "AzureML Compute Operator manages compute resources; it doesn't let users run jobs or deploy models.", fr: "AzureML Compute Operator gère les ressources de calcul ; il ne permet pas d'exécuter des travaux ni de déployer des modèles." }
    d: { en: "Reader allows only read actions, so the team couldn't submit jobs or register models.", fr: "Reader n'autorise que les actions de lecture : l'équipe ne pourrait ni soumettre de travaux ni inscrire de modèles." }
references:
  - title: Manage roles in your workspace - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-assign-roles
