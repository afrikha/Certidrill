id: ai300-1b-net-pypi-rule
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Azure Machine Learning workspace named **mlw-adatum** uses a managed virtual network in the allow only approved outbound mode.

    Environment builds for training jobs fail because conda can't download packages from `pypi.org`. You need the builds to succeed. The workspace must keep blocking all other internet destinations.

    What should you do?
  fr: |
    Un espace de travail Azure Machine Learning nommé **mlw-adatum** utilise un réseau virtuel managé en mode allow only approved outbound.

    Les générations d'environnement des travaux d'entraînement échouent car conda ne peut pas télécharger de packages depuis `pypi.org`. Les générations doivent réussir. L'espace de travail doit continuer à bloquer toutes les autres destinations Internet.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add an outbound rule of type fqdn with the destination pypi.org.", fr: "Ajouter une règle de trafic sortant de type fqdn avec la destination pypi.org." }
    - id: b
      text: { en: "Add an outbound rule of type service_tag with the AzureCloud service tag.", fr: "Ajouter une règle de trafic sortant de type service_tag avec la balise de service AzureCloud." }
    - id: c
      text: { en: "Add an outbound rule of type private_endpoint that targets pypi.org.", fr: "Ajouter une règle de trafic sortant de type private_endpoint qui cible pypi.org." }
    - id: d
      text: { en: "Change the isolation mode to allow_internet_outbound.", fr: "Remplacer le mode d'isolation par allow_internet_outbound." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An FQDN outbound rule allows a specific host name in the approved outbound mode. It's implemented with an Azure Firewall that the managed network deploys and bills, and it only supports ports 80 and 443, which is enough for package downloads.
    fr: |
      Une règle de trafic sortant FQDN autorise un nom d'hôte précis en mode approved outbound. Elle est implémentée par un pare-feu Azure Firewall que le réseau managé déploie et facture, et elle ne prend en charge que les ports 80 et 443, ce qui suffit pour télécharger des packages.
  options:
    b:
      en: |
        AzureCloud covers Azure IP ranges, not the public pypi.org site, and it would open far more than required.
      fr: |
        AzureCloud couvre des plages IP Azure, pas le site public pypi.org, et ouvrirait bien plus que nécessaire.
    c:
      en: |
        Private endpoint rules target Azure resources that support Private Link, not a public internet site.
      fr: |
        Les règles de point de terminaison privé ciblent des ressources Azure prenant en charge Private Link, pas un site Internet public.
    d:
      en: |
        Once the allow only approved outbound mode is chosen, you can't switch to allow internet outbound, and that mode would allow every internet destination.
      fr: |
        Une fois le mode allow only approved outbound choisi, vous ne pouvez pas passer à allow internet outbound, et ce mode autoriserait toutes les destinations Internet.
references:
  - title: Managed virtual network isolation
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
