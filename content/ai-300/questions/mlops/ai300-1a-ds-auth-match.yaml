id: ai300-1a-ds-auth-match
objective: "1.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum must connect three storage locations to the Azure Machine Learning workspace **mlw-adatum** by using datastores.

    Which datastore configuration should you use for each storage location? To answer, drag the appropriate configurations to the correct storage locations. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum doit connecter trois emplacements de stockage à l'espace de travail Azure Machine Learning **mlw-adatum** au moyen de magasins de données.

    Quelle configuration de magasin de données devez-vous utiliser pour chaque emplacement de stockage ? Pour répondre, faites glisser les configurations appropriées vers les emplacements de stockage correspondants. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: file_key, text: { en: "`azure_file` with `account_key`", fr: "`azure_file` avec `account_key`" } }
    - { id: file_none, text: { en: "`azure_file` without credentials", fr: "`azure_file` sans informations d'identification" } }
    - { id: blob_sas, text: { en: "`azure_blob` with `sas_token`", fr: "`azure_blob` avec `sas_token`" } }
    - { id: blob_sp, text: { en: "`azure_blob` with `tenant_id`, `client_id` and `client_secret`", fr: "`azure_blob` avec `tenant_id`, `client_id` et `client_secret`" } }
    - { id: adls_sp, text: { en: "`azure_data_lake_gen2` with `tenant_id`, `client_id` and `client_secret`", fr: "`azure_data_lake_gen2` avec `tenant_id`, `client_id` et `client_secret`" } }
    - { id: adls_sas, text: { en: "`azure_data_lake_gen2` with `sas_token`", fr: "`azure_data_lake_gen2` avec `sas_token`" } }
  targets:
    - id: share
      text: { en: "An Azure Files share; the storage team provides the account key", fr: "Un partage Azure Files ; l'équipe de stockage fournit la clé de compte" }
    - id: partner
      text: { en: "A partner's blob container; the partner provides a time-limited token", fr: "Le conteneur blob d'un partenaire ; le partenaire fournit un jeton à durée limitée" }
    - id: lake
      text: { en: "A Data Lake Storage Gen2 file system; the data team provides an app registration and its secret", fr: "Un système de fichiers Data Lake Storage Gen2 ; l'équipe de données fournit une inscription d'application et son secret" }
answer:
  mapping: { share: file_key, partner: blob_sas, lake: adls_sp }
explanation:
  correct:
    en: |
      Azure Files datastores accept only an account key or a SAS token. Blob datastores accept an account key or a SAS token, so the partner's time-limited token is a `sas_token`. Data Lake Storage Gen2 datastores use service principal credentials (`tenant_id`, `client_id`, `client_secret`) when they aren't identity-based.
    fr: |
      Les magasins de données Azure Files n'acceptent qu'une clé de compte ou un jeton SAS. Les magasins de données blob acceptent une clé de compte ou un jeton SAS : le jeton à durée limitée du partenaire est un `sas_token`. Les magasins de données Data Lake Storage Gen2 utilisent les informations d'identification d'un principal de service (`tenant_id`, `client_id`, `client_secret`) lorsqu'ils ne sont pas basés sur l'identité.
  options:
    file_none: { en: "Azure Files doesn't support identity-based access, so a file datastore needs credentials.", fr: "Azure Files ne prend pas en charge l'accès basé sur l'identité : un magasin de données de fichiers a besoin d'informations d'identification." }
    blob_sp: { en: "Blob datastore credentials are an account key or a SAS token, not a service principal.", fr: "Les informations d'identification d'un magasin de données blob sont une clé de compte ou un jeton SAS, pas un principal de service." }
    adls_sas: { en: "Data Lake Storage Gen2 datastore credentials are service principal credentials, not a SAS token.", fr: "Les informations d'identification d'un magasin de données Data Lake Storage Gen2 sont celles d'un principal de service, pas un jeton SAS." }
references:
  - title: CLI (v2) Azure Blob datastore YAML schema - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-datastore-blob
  - title: CLI (v2) Azure Data Lake Gen2 datastore YAML schema - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-datastore-data-lake-gen2
