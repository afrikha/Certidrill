id: ai300-1a-comp-new-version
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Azure Machine Learning workspace **mlw-northwind** contains a registered command component named **train_churn_model** version 2. Several production pipelines pin `azureml:train_churn_model:2`.

    The data science team must change the command of the component to pass a new `--seed` argument to the script. The production pipelines must keep running the current command until they are updated.

    What should you do?
  fr: |
    L'espace de travail Azure Machine Learning **mlw-northwind** contient un composant de commande inscrit nommé **train_churn_model** version 2. Plusieurs pipelines de production épinglent `azureml:train_churn_model:2`.

    L'équipe de data science doit modifier la commande du composant pour transmettre un nouvel argument `--seed` au script. Les pipelines de production doivent continuer à exécuter la commande actuelle tant qu'ils ne sont pas mis à jour.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run `az ml component update` on version 2 with `--set command=...`.", fr: "Exécuter `az ml component update` sur la version 2 avec `--set command=...`." } }
    - { id: b, text: { en: "Set `version: 3` in the component YAML file, and then run `az ml component create`.", fr: "Définir `version: 3` dans le fichier YAML du composant, puis exécuter `az ml component create`." } }
    - { id: c, text: { en: "Archive version 2, edit the YAML file, and then run `az ml component restore`.", fr: "Archiver la version 2, modifier le fichier YAML, puis exécuter `az ml component restore`." } }
    - { id: d, text: { en: "Set `is_deterministic: false` in the YAML file, and then run `az ml component create`.", fr: "Définir `is_deterministic: false` dans le fichier YAML, puis exécuter `az ml component create`." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Components are versioned: producers publish new versions, and consumers choose which version their pipelines use. Registering the changed definition as version 3 leaves version 2 intact for the pinned production pipelines. `az ml component update` changes only a few fields, such as `description` and `display_name`.
    fr: |
      Les composants sont versionnés : les producteurs publient de nouvelles versions, et les consommateurs choisissent la version utilisée par leurs pipelines. Inscrire la définition modifiée comme version 3 laisse la version 2 intacte pour les pipelines de production épinglés. `az ml component update` ne modifie que quelques champs, comme `description` et `display_name`.
  options:
    a: { en: "The command of a registered version can't be updated; only fields such as description and display_name support update.", fr: "La commande d'une version inscrite ne peut pas être mise à jour ; seuls des champs comme description et display_name le permettent." }
    c: { en: "Restore only brings back an archived component; it doesn't publish a new definition.", fr: "La restauration ne fait que rétablir un composant archivé ; elle ne publie pas de nouvelle définition." }
    d: { en: "`is_deterministic` only controls whether a step reuses previous results; it has nothing to do with publishing a changed command.", fr: "`is_deterministic` contrôle uniquement la réutilisation des résultats précédents par une étape ; il n'a aucun rapport avec la publication d'une commande modifiée." }
references:
  - title: What is a component - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-component
  - title: Create and run component-based ML pipelines (CLI) - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-component-pipelines-cli
