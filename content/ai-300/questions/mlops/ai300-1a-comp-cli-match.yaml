id: ai300-1a-comp-cli-match
objective: "1.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You manage the components of the Azure Machine Learning workspace **mlw-wingtip** with the Azure CLI. The component **score_leads** has versions 1 and 2, and its new definition is in score.yml with `version: 3`.

    Which command should you run for each task? To answer, drag the appropriate commands to the correct tasks. Each command may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez les composants de l'espace de travail Azure Machine Learning **mlw-wingtip** avec Azure CLI. Le composant **score_leads** a les versions 1 et 2, et sa nouvelle définition se trouve dans score.yml avec `version: 3`.

    Quelle commande devez-vous exécuter pour chaque tâche ? Pour répondre, faites glisser les commandes appropriées vers les tâches correspondantes. Chaque commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: create, text: az ml component create }
    - { id: list, text: az ml component list }
    - { id: archive, text: az ml component archive }
    - { id: restore, text: az ml component restore }
    - { id: show, text: az ml component show }
    - { id: job, text: az ml job create }
  targets:
    - id: register
      text: { en: "Register version 3 from score.yml", fr: "Inscrire la version 3 à partir de score.yml" }
    - id: table
      text: { en: "Display all the components of the workspace as a table", fr: "Afficher tous les composants de l'espace de travail sous forme de tableau" }
    - id: hide
      text: { en: "Hide version 1 of score_leads from the component list", fr: "Masquer la version 1 de score_leads de la liste des composants" }
    - id: run
      text: { en: "Run a pipeline defined in pipeline.yml that uses score_leads", fr: "Exécuter un pipeline défini dans pipeline.yml qui utilise score_leads" }
answer:
  mapping: { register: create, table: list, hide: archive, run: job }
explanation:
  correct:
    en: |
      `az ml component create --file` registers a component version, `az ml component list --output table` lists the components of the workspace, and `az ml component archive` archives a component so that it's hidden from the list. A pipeline is a job, so you submit it with `az ml job create --file pipeline.yml`.
    fr: |
      `az ml component create --file` inscrit une version de composant, `az ml component list --output table` liste les composants de l'espace de travail, et `az ml component archive` archive un composant pour le masquer de la liste. Un pipeline est un travail : vous le soumettez avec `az ml job create --file pipeline.yml`.
  options:
    restore: { en: "`restore` brings back an archived component.", fr: "`restore` rétablit un composant archivé." }
    show: { en: "`show` displays the details of one component.", fr: "`show` affiche les détails d'un composant." }
references:
  - title: Create and run component-based ML pipelines (CLI) - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-component-pipelines-cli
