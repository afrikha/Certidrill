id: ai300-1a-data-mltable-name
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a local folder named **churn** that contains a file named **churn.csv** and a file named **MLTable.yaml** that defines how to load churn.csv.

    You run `az ml data create --path ./churn --name churn-table --version 1 --type mltable`, and the command fails because no valid table definition is found.

    What should you do?
  fr: |
    Vous disposez d'un dossier local nommé **churn** qui contient un fichier nommé **churn.csv** et un fichier nommé **MLTable.yaml** qui définit comment charger churn.csv.

    Vous exécutez `az ml data create --path ./churn --name churn-table --version 1 --type mltable`, et la commande échoue, car aucune définition de table valide n'est trouvée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Rename MLTable.yaml to MLTable, and then run the command again.", fr: "Renommer MLTable.yaml en MLTable, puis exécuter de nouveau la commande." } }
    - { id: b, text: { en: "Set `--path` to ./churn/MLTable.yaml, and then run the command again.", fr: "Définir `--path` sur ./churn/MLTable.yaml, puis exécuter de nouveau la commande." } }
    - { id: c, text: { en: "Set `--type` to `uri_folder`, and then run the command again.", fr: "Définir `--type` sur `uri_folder`, puis exécuter de nouveau la commande." } }
    - { id: d, text: { en: "Set `--path` to ./churn/churn.csv, and then run the command again.", fr: "Définir `--path` sur ./churn/churn.csv, puis exécuter de nouveau la commande." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An `mltable` data asset is created from a folder that contains a file named exactly `MLTable`. Azure Machine Learning doesn't recognize `MLTable.yaml` or `MLTable.yml`, so you rename the file and keep `--path` on the folder.
    fr: |
      Une ressource de données `mltable` est créée à partir d'un dossier qui contient un fichier nommé exactement `MLTable`. Azure Machine Learning ne reconnaît pas `MLTable.yaml` ni `MLTable.yml` : vous renommez le fichier et laissez `--path` sur le dossier.
  options:
    b: { en: "The path of an `mltable` data asset must be a folder that contains a valid MLTable file, not the file itself.", fr: "Le chemin d'une ressource de données `mltable` doit être un dossier contenant un fichier MLTable valide, pas le fichier lui-même." }
    c: { en: "A `uri_folder` asset only references the folder and ignores the loading steps of the table definition.", fr: "Une ressource `uri_folder` ne fait que référencer le dossier et ignore les étapes de chargement de la définition de table." }
    d: { en: "An `mltable` asset path must be a folder, and pointing to the CSV file ignores the loading steps.", fr: "Le chemin d'une ressource `mltable` doit être un dossier, et pointer vers le fichier CSV ignore les étapes de chargement." }
references:
  - title: Create Data Assets - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-data-assets
