id: ai300-1b-git-repo-content
objective: "1.3.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is creating a GitHub repository for its MLOps project. A GitHub Actions workflow will deploy the Azure Machine Learning workspace and submit the training pipeline by using OpenID Connect.

    You need to decide what to commit to the repository.

    Which two items should you commit?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam crée un dépôt GitHub pour son projet MLOps. Un workflow GitHub Actions déploiera l'espace de travail Azure Machine Learning et soumettra le pipeline d'entraînement en utilisant OpenID Connect.

    Vous devez décider de ce qu'il faut valider (commit) dans le dépôt.

    Quels sont les deux éléments que vous devez valider ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "The Bicep files that deploy the workspace and its compute", fr: "Les fichiers Bicep qui déploient l'espace de travail et son calcul" }
    - id: b
      text: { en: "A JSON file with the client secret of the deployment service principal", fr: "Un fichier JSON contenant le secret client du principal de service de déploiement" }
    - id: c
      text: { en: "The component and pipeline job YAML files with their source code", fr: "Les fichiers YAML des composants et du travail de pipeline avec leur code source" }
    - id: d
      text: { en: "The private SSH key generated on a compute instance", fr: "La clé SSH privée générée sur une instance de calcul" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Infrastructure definitions and the YAML and code of components and pipelines are the source of the platform; versioning them lets workflows rebuild it and lets each job be traced to a commit. Credentials don't belong in Git.
    fr: |
      Les définitions d'infrastructure ainsi que le YAML et le code des composants et des pipelines constituent la source de la plateforme ; les versionner permet aux workflows de la reconstruire et de relier chaque travail à un commit. Les informations d'identification n'ont pas leur place dans Git.
  options:
    b:
      en: |
        Secrets must not be committed; with OpenID Connect, no client secret is needed at all.
      fr: |
        Les secrets ne doivent pas être validés ; avec OpenID Connect, aucun secret client n'est même nécessaire.
    d:
      en: |
        The private key must stay on the compute instance, where only its owner can access it; only the public key is added to the Git service.
      fr: |
        La clé privée doit rester sur l'instance de calcul, où seul son propriétaire y a accès ; seule la clé publique est ajoutée au service Git.
references:
  - title: Git integration
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-train-model-git-integration
  - title: Authenticate to Azure from GitHub Actions by OpenID Connect
    url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
