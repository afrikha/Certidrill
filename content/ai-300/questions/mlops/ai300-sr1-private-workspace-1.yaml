id: ai300-sr1-private-workspace-1
objective: "1.3.4"
type: series_yesno
series: ai300-sr1-private-workspace
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You add a private endpoint to the workspace, and then you disable public network access.
  fr: Vous ajoutez un point de terminaison privé à l'espace de travail, puis vous désactivez l'accès au réseau public.
body:
  solution:
    en: |
      You create a private endpoint for mlw-fab-prod in a subnet of vnet-ds, and you link the private DNS zones `privatelink.api.azureml.ms` and `privatelink.notebooks.azure.net` to vnet-ds. You then run the following commands:

      ```bash
      az network private-endpoint create \
        --name pe-mlw-fab-prod \
        --resource-group rg-ml \
        --vnet-name vnet-ds \
        --subnet snet-pe \
        --private-connection-resource-id "/subscriptions/<subscription-id>/resourceGroups/rg-ml/providers/Microsoft.MachineLearningServices/workspaces/mlw-fab-prod" \
        --group-id amlworkspace \
        --connection-name workspace

      az ml workspace update \
        --name mlw-fab-prod \
        --resource-group rg-ml \
        --public-network-access Disabled
      ```
    fr: |
      Vous créez un point de terminaison privé pour mlw-fab-prod dans un sous-réseau de vnet-ds, et vous liez les zones DNS privées `privatelink.api.azureml.ms` et `privatelink.notebooks.azure.net` à vnet-ds. Vous exécutez ensuite les commandes suivantes :

      ```bash
      az network private-endpoint create \
        --name pe-mlw-fab-prod \
        --resource-group rg-ml \
        --vnet-name vnet-ds \
        --subnet snet-pe \
        --private-connection-resource-id "/subscriptions/<subscription-id>/resourceGroups/rg-ml/providers/Microsoft.MachineLearningServices/workspaces/mlw-fab-prod" \
        --group-id amlworkspace \
        --connection-name workspace

      az ml workspace update \
        --name mlw-fab-prod \
        --resource-group rg-ml \
        --public-network-access Disabled
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      A private endpoint with the `amlworkspace` group ID gives the workspace a private IP address in vnet-ds, and the two private DNS zones make the studio, CLI and SDK resolve the workspace to that address. Setting `public_network_access` to `Disabled` then rejects data-plane connections from the internet. Adding a private endpoint alone doesn't change this setting, which is why the second command is needed. The goal is met.
    fr: |
      Un point de terminaison privé avec l'ID de groupe `amlworkspace` donne à l'espace de travail une adresse IP privée dans vnet-ds, et les deux zones DNS privées font résoudre l'espace de travail vers cette adresse par le studio, l'interface CLI et le SDK. Définir `public_network_access` sur `Disabled` refuse ensuite les connexions de plan de données depuis Internet. L'ajout d'un point de terminaison privé ne modifie pas à lui seul ce paramètre, d'où la seconde commande. L'objectif est atteint.
references:
  - title: Configure a private endpoint - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-private-link?view=azureml-api-2
