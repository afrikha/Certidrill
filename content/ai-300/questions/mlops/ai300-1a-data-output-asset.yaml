id: ai300-1a-data-output-asset
objective: "1.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are writing a command job for the Azure Machine Learning workspace **mlw-northwind**. The job scores customers and writes its results to the folder **scoring/2026-11/** of the default datastore.

    The script writes the files to a local folder, and the files must be copied to the datastore when the job ends. The output must also be registered as a data asset named **scored-customers**, without running another command.

    How should you complete the job YAML? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez un travail de commande pour l'espace de travail Azure Machine Learning **mlw-northwind**. Le travail calcule le score des clients et écrit ses résultats dans le dossier **scoring/2026-11/** du magasin de données par défaut.

    Le script écrit les fichiers dans un dossier local, et les fichiers doivent être copiés dans le magasin de données à la fin du travail. La sortie doit aussi être inscrite comme ressource de données nommée **scored-customers**, sans exécuter d'autre commande.

    Comment devez-vous compléter le fichier YAML du travail ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    outputs:
      scored:
        type: uri_folder
        mode: [[mode]]
        path: azureml://datastores/[[ds]]/paths/scoring/2026-11/
        [[key]]: scored-customers
  slots:
    - id: mode
      options:
        - { id: rw, text: rw_mount }
        - { id: up, text: upload }
        - { id: ro, text: ro_mount }
        - { id: dl, text: download }
    - id: ds
      options:
        - { id: file, text: workspacefilestore }
        - { id: art, text: workspaceartifactstore }
        - { id: blob, text: workspaceblobstore }
    - id: key
      options:
        - { id: dn, text: display_name }
        - { id: ver, text: version }
        - { id: name, text: name }
answer:
  values: { mode: up, ds: blob, key: name }
explanation:
  correct:
    en: |
      In `upload` mode, files written on the compute are uploaded to the storage location at the end of the job. `workspaceblobstore` is the default datastore of the workspace. Setting `name` on an output registers it as a data asset when the job writes the data; if no `version` is set, one is assigned automatically.
    fr: |
      En mode `upload`, les fichiers écrits sur le calcul sont chargés vers l'emplacement de stockage à la fin du travail. `workspaceblobstore` est le magasin de données par défaut de l'espace de travail. Définir `name` sur une sortie l'inscrit comme ressource de données quand le travail écrit les données ; si aucune `version` n'est définie, une version est attribuée automatiquement.
  options:
    rw: { en: "`rw_mount` mounts the storage location so that files are written to it directly, not uploaded at the end.", fr: "`rw_mount` monte l'emplacement de stockage pour y écrire directement les fichiers, sans chargement à la fin." }
    ro: { en: "`ro_mount` is a read-only input mode.", fr: "`ro_mount` est un mode d'entrée en lecture seule." }
    dl: { en: "`download` is an input mode.", fr: "`download` est un mode d'entrée." }
    file: { en: "workspacefilestore is a file share used as an alternative location for uploads, not the default datastore.", fr: "workspacefilestore est un partage de fichiers servant d'autre emplacement de chargement, pas le magasin de données par défaut." }
    art: { en: "workspaceartifactstore stores metrics, models and components.", fr: "workspaceartifactstore stocke les métriques, les modèles et les composants." }
    ver: { en: "`version` alone doesn't register the output; the data asset needs a `name`.", fr: "`version` seul n'inscrit pas la sortie ; la ressource de données a besoin d'un `name`." }
references:
  - title: Create Data Assets - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-data-assets
  - title: Access data in a job - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-read-write-data-v2
