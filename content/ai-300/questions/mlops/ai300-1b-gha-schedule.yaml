id: ai300-1b-gha-schedule
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses a GitHub Actions workflow to submit an Azure Machine Learning training pipeline with `az ml job create`.

    You need the workflow to run automatically every Monday at 02:00 UTC, whether or not the repository has changed. No person must have to start it.

    Which trigger should you add to the `on` section of the workflow?
  fr: |
    Contoso utilise un workflow GitHub Actions pour soumettre un pipeline d'entraînement Azure Machine Learning avec `az ml job create`.

    Le workflow doit s'exécuter automatiquement chaque lundi à 02:00 UTC, que le dépôt ait changé ou non. Personne ne doit avoir à le démarrer.

    Quel déclencheur devez-vous ajouter à la section `on` du workflow ?
body:
  options:
    - { id: a, text: "push" }
    - { id: b, text: "workflow_dispatch" }
    - { id: c, text: "pull_request" }
    - { id: d, text: "schedule with a cron expression" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The `schedule` trigger runs the workflow on a cron expression, here `0 2 * * 1`, without any repository event or manual action. The Azure Machine Learning GitHub Actions example uses `schedule` with `cron` for periodic pipeline runs.
    fr: |
      Le déclencheur `schedule` exécute le workflow selon une expression cron, ici `0 2 * * 1`, sans événement de dépôt ni action manuelle. L'exemple GitHub Actions d'Azure Machine Learning utilise `schedule` avec `cron` pour des exécutions périodiques du pipeline.
  options:
    a:
      en: |
        push only runs when commits are pushed, so nothing runs on a Monday without changes.
      fr: |
        push ne s'exécute que lorsque des commits sont envoyés : rien ne s'exécute un lundi sans modification.
    b:
      en: |
        workflow_dispatch adds a manual run, which requires a person to start the workflow.
      fr: |
        workflow_dispatch ajoute une exécution manuelle, qui exige qu'une personne démarre le workflow.
    c:
      en: |
        pull_request runs when pull requests are opened or updated, not on a calendar.
      fr: |
        pull_request s'exécute quand des pull requests sont ouvertes ou mises à jour, pas selon un calendrier.
references:
  - title: GitHub Actions for CI/CD
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-github-actions-machine-learning
