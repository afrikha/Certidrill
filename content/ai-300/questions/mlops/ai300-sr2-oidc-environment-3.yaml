id: ai300-sr2-oidc-environment-3
objective: "1.3.1"
type: series_yesno
series: ai300-sr2-oidc-environment
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You store service principal credentials in an environment secret of production.
  fr: Vous stockez les informations d'identification d'un principal de service dans un secret de l'environnement production.
body:
  solution:
    en: |
      You create a service principal with a client secret. You store its credentials JSON in a secret named `AZURE_CREDENTIALS` of the **production** environment, and the deploy job signs in with `azure/login@v2` by using `creds: ${{ secrets.AZURE_CREDENTIALS }}`.
    fr: |
      Vous créez un principal de service avec un secret client. Vous stockez son JSON d'informations d'identification dans un secret nommé `AZURE_CREDENTIALS` de l'environnement **production**, et le travail deploy se connecte avec `azure/login@v2` en utilisant `creds: ${{ secrets.AZURE_CREDENTIALS }}`.
answer: { value: false }
explanation:
  correct:
    en: The job can sign in, and the environment secret is only readable after a reviewer approves the run, but the client secret is still a credential stored in GitHub that expires and must be rotated. Microsoft recommends OpenID Connect and describes the service principal secret approach as less secure.
    fr: "Le travail peut se connecter, et le secret d'environnement n'est lisible qu'après l'approbation d'un réviseur, mais le secret client reste une information d'identification stockée dans GitHub, qui expire et doit être renouvelée. Microsoft recommande OpenID Connect et qualifie l'approche par secret de principal de service de moins sûre."
references:
  - title: GitHub Actions for CI/CD - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-github-actions-machine-learning
