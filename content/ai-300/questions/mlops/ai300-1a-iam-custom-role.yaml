id: ai300-1a-iam-custom-role
objective: "1.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are creating a custom role named **ML Experimenter** for the Azure Machine Learning workspaces of Northwind Traders. Users who have the role must be able to create and update assets and submit jobs. They must not be able to:

    - modify the workspace itself;
    - create or update compute resources;
    - create or change role assignments.

    How should you complete the role definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un rôle personnalisé nommé **ML Experimenter** pour les espaces de travail Azure Machine Learning de Northwind Traders. Les utilisateurs qui ont ce rôle doivent pouvoir créer et mettre à jour des actifs et soumettre des travaux. Ils ne doivent pas pouvoir :

    - modifier l'espace de travail lui-même ;
    - créer ou mettre à jour des ressources de calcul ;
    - créer ou modifier des attributions de rôles.

    Comment devez-vous compléter la définition du rôle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "Name": "ML Experimenter",
      "IsCustom": true,
      "Description": "Runs experiments; can't change the workspace, compute or access.",
      "Actions": [
        "Microsoft.MachineLearningServices/workspaces/*/read",
        "Microsoft.MachineLearningServices/workspaces/*/action",
        "Microsoft.MachineLearningServices/workspaces/*/write"
      ],
      "NotActions": [
        "Microsoft.MachineLearningServices/workspaces/write",
        "[[s1]]",
        "[[s2]]"
      ],
      "AssignableScopes": [ "/subscriptions/<subscription-id>" ]
    }
  slots:
    - id: s1
      options:
        - { id: wsaction, text: "Microsoft.MachineLearningServices/workspaces/*/action" }
        - { id: compwrite, text: "Microsoft.MachineLearningServices/workspaces/computes/*/write" }
        - { id: wsread, text: "Microsoft.MachineLearningServices/workspaces/*/read" }
        - { id: wskeys, text: "Microsoft.MachineLearningServices/workspaces/listKeys/action" }
    - id: s2
      options:
        - { id: deploy, text: "Microsoft.Resources/deployments/*" }
        - { id: wsdelete, text: "Microsoft.MachineLearningServices/workspaces/*/delete" }
        - { id: authz, text: "Microsoft.Authorization/*" }
        - { id: compkeys, text: "Microsoft.MachineLearningServices/workspaces/computes/listKeys/action" }
answer:
  values: { s1: compwrite, s2: authz }
explanation:
  correct:
    en: |
      `NotActions` removes permissions from the wildcard `Actions`. `workspaces/write` blocks changes to the workspace itself, `workspaces/computes/*/write` blocks creating and updating compute, and `Microsoft.Authorization/*` blocks creating or changing role assignments.
    fr: |
      `NotActions` retire des autorisations aux caractères génériques de `Actions`. `workspaces/write` bloque les modifications de l'espace de travail lui-même, `workspaces/computes/*/write` bloque la création et la mise à jour du calcul, et `Microsoft.Authorization/*` bloque la création ou la modification des attributions de rôles.
  options:
    wsaction: { en: "Excluding all workspace actions would also prevent users from submitting jobs.", fr: "Exclure toutes les actions de l'espace de travail empêcherait aussi de soumettre des travaux." }
    wsread: { en: "Excluding read operations would prevent users from viewing assets.", fr: "Exclure les lectures empêcherait de consulter les actifs." }
    wskeys: { en: "Blocking key listing protects workspace keys; it doesn't prevent compute creation.", fr: "Bloquer la liste des clés protège les clés de l'espace de travail ; cela n'empêche pas la création de calcul." }
    wsdelete: { en: "Excluding all deletes doesn't block role assignments.", fr: "Exclure toutes les suppressions ne bloque pas les attributions de rôles." }
    deploy: { en: "`Microsoft.Resources/deployments/*` covers template deployments, not role assignments.", fr: "`Microsoft.Resources/deployments/*` couvre les déploiements de modèles ARM, pas les attributions de rôles." }
references:
  - title: Manage roles in your workspace - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-assign-roles
