id: ai300-1b-gha-id-token
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A workflow deploys a Bicep file for an Azure Machine Learning workspace. The federated identity credential of the workflow identity is correct. The workflow contains the following lines.

    ```yaml
    permissions:
      contents: read
    jobs:
      deploy:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: azure/login@v2
            with:
              client-id: ${{ secrets.AZURE_CLIENT_ID }}
              tenant-id: ${{ secrets.AZURE_TENANT_ID }}
              subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    ```

    The checkout step succeeds, but the `azure/login` step fails because the job can't obtain an OpenID Connect token. You need to fix the workflow without storing a secret.

    What should you do?
  fr: |
    Un workflow déploie un fichier Bicep pour un espace de travail Azure Machine Learning. Les informations d'identification fédérées de l'identité du workflow sont correctes. Le workflow contient les lignes suivantes.

    ```yaml
    permissions:
      contents: read
    jobs:
      deploy:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: azure/login@v2
            with:
              client-id: ${{ secrets.AZURE_CLIENT_ID }}
              tenant-id: ${{ secrets.AZURE_TENANT_ID }}
              subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    ```

    L'étape d'extraction réussit, mais l'étape `azure/login` échoue car le travail ne peut pas obtenir de jeton OpenID Connect. Vous devez corriger le workflow sans stocker de secret.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add id-token: write to the permissions section.", fr: "Ajouter id-token: write à la section permissions." }
    - id: b
      text: { en: "Change contents: read to contents: write.", fr: "Remplacer contents: read par contents: write." }
    - id: c
      text: { en: "Add enable-AzPSSession: true to the azure/login step.", fr: "Ajouter enable-AzPSSession: true à l'étape azure/login." }
    - id: d
      text: { en: "Add a creds input that reads secrets.AZURE_CREDENTIALS.", fr: "Ajouter une entrée creds qui lit secrets.AZURE_CREDENTIALS." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A job needs the `id-token: write` permission to request the OIDC token that `azure/login` exchanges for an Azure token. Because the workflow sets permissions explicitly, any permission not listed is not granted, so you add `id-token: write` next to `contents: read`.
    fr: |
      Un travail a besoin de l'autorisation `id-token: write` pour demander le jeton OIDC qu'`azure/login` échange contre un jeton Azure. Comme le workflow définit les autorisations explicitement, toute autorisation non listée n'est pas accordée : vous ajoutez `id-token: write` à côté de `contents: read`.
  options:
    b:
      en: |
        contents controls access to the repository content; write access doesn't allow requesting an OIDC token.
      fr: |
        contents contrôle l'accès au contenu du dépôt ; l'accès en écriture ne permet pas de demander un jeton OIDC.
    c:
      en: |
        enable-AzPSSession also signs in Azure PowerShell; it doesn't provide the missing token.
      fr: |
        enable-AzPSSession connecte aussi Azure PowerShell ; il ne fournit pas le jeton manquant.
    d:
      en: |
        AZURE_CREDENTIALS contains a client secret, which the requirement excludes.
      fr: |
        AZURE_CREDENTIALS contient un secret client, ce que l'exigence exclut.
references:
  - title: Authenticate to Azure from GitHub Actions by OpenID Connect
    url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
  - title: Deploy Bicep files by using GitHub Actions
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-github-actions
