id: ai300-1a-cmp-serverless-spot
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Data scientists at Fabrikam submit command jobs to the Azure Machine Learning workspace **mlw-fabrikam** by using YAML files. The workspace has enough quota for the jobs.

    The data scientists must not create, size or maintain any compute target. The jobs tolerate interruptions, and they must run at the lowest possible cost.

    What should the data scientists do in each job YAML file?
  fr: |
    Les data scientists de Fabrikam soumettent des travaux de commande à l'espace de travail Azure Machine Learning **mlw-fabrikam** au moyen de fichiers YAML. L'espace de travail dispose d'un quota suffisant pour les travaux.

    Les data scientists ne doivent créer, dimensionner ni maintenir aucune cible de calcul. Les travaux tolèrent les interruptions, et ils doivent s'exécuter au coût le plus bas possible.

    Que doivent faire les data scientists dans chaque fichier YAML de travail ?
body:
  options:
    - { id: a, text: { en: "Omit `compute`, and leave the `queue_settings` section unset.", fr: "Omettre `compute`, et ne pas définir la section `queue_settings`." } }
    - { id: b, text: { en: "Set `compute` to a low-priority compute cluster that an administrator creates.", fr: "Définir `compute` sur un cluster de calcul de basse priorité créé par un administrateur." } }
    - { id: c, text: { en: "Omit `compute`, and set the job tier in `queue_settings` to Spot.", fr: "Omettre `compute`, et définir le niveau du travail dans `queue_settings` sur Spot." } }
    - { id: d, text: { en: "Omit `compute`, and set `resources.instance_count` to the smallest value.", fr: "Omettre `compute`, et définir `resources.instance_count` sur la plus petite valeur." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When a job doesn't specify `compute`, it runs on serverless compute, which Azure Machine Learning creates, scales and manages. The `job_tier` setting of `queue_settings` selects Standard (dedicated VMs, the default) or Spot (low-priority, preemptible VMs at a lower price).
    fr: |
      Quand un travail ne spécifie pas `compute`, il s'exécute sur du calcul serverless, qu'Azure Machine Learning crée, met à l'échelle et gère. Le paramètre `job_tier` de `queue_settings` sélectionne Standard (machines virtuelles dédiées, valeur par défaut) ou Spot (machines virtuelles de basse priorité, préemptibles, moins chères).
  options:
    a: { en: "Without a job tier, serverless jobs use the default Standard tier on dedicated VMs, which isn't the lowest cost.", fr: "Sans niveau de travail, les travaux serverless utilisent le niveau Standard par défaut sur des machines virtuelles dédiées, qui n'est pas le moins cher." }
    b: { en: "A compute cluster is a compute target that someone must create and maintain, which the requirements exclude.", fr: "Un cluster de calcul est une cible de calcul qu'il faut créer et maintenir, ce que les exigences excluent." }
    d: { en: "The node count changes the size of the job, not the price tier of the VMs, which stay dedicated.", fr: "Le nombre de nœuds change la taille du travail, pas le niveau tarifaire des machines virtuelles, qui restent dédiées." }
references:
  - title: Model Training on Serverless Compute - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-use-serverless-compute
