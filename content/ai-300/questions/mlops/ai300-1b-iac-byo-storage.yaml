id: ai300-1b-iac-byo-storage
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You plan to create an Azure Machine Learning workspace by running `az ml workspace create --file workspace.yml`. The YAML file must reference an existing storage account as the workspace's default storage account (`storage_account` key).

    The resource group contains the following storage accounts.

    | Name | Performance | Account kind | Hierarchical namespace |
    | --- | --- | --- | --- |
    | stmlraw | Standard | StorageV2 (general purpose v2) | Enabled |
    | stmlfast | Premium | BlockBlobStorage | Disabled |
    | stmlcore | Standard | StorageV2 (general purpose v2) | Disabled |
    | stmllake | Premium | BlockBlobStorage | Enabled |

    Which storage account can you reference?
  fr: |
    Vous prévoyez de créer un espace de travail Azure Machine Learning en exécutant `az ml workspace create --file workspace.yml`. Le fichier YAML doit référencer un compte de stockage existant comme compte de stockage par défaut de l'espace de travail (clé `storage_account`).

    Le groupe de ressources contient les comptes de stockage suivants.

    | Nom | Performances | Type de compte | Espace de noms hiérarchique |
    | --- | --- | --- | --- |
    | stmlraw | Standard | StorageV2 (usage général v2) | Activé |
    | stmlfast | Premium | BlockBlobStorage | Désactivé |
    | stmlcore | Standard | StorageV2 (usage général v2) | Désactivé |
    | stmllake | Premium | BlockBlobStorage | Activé |

    Quel compte de stockage pouvez-vous référencer ?
body:
  options:
    - { id: a, text: stmlraw }
    - { id: b, text: stmlfast }
    - { id: c, text: stmlcore }
    - { id: d, text: stmllake }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The CLI (v2) workspace schema states that the default storage account can't be a Premium storage account or an account with hierarchical namespace enabled. stmlcore is the only Standard account without hierarchical namespace.
    fr: |
      Le schéma YAML d'espace de travail de la CLI (v2) indique que le compte de stockage par défaut ne peut pas être un compte Premium ni un compte dont l'espace de noms hiérarchique est activé. stmlcore est le seul compte Standard sans espace de noms hiérarchique.
  options:
    a:
      en: |
        stmlraw has hierarchical namespace enabled (Data Lake Storage Gen2), which isn't allowed for the default storage account. You can still register it later as a datastore.
      fr: |
        L'espace de noms hiérarchique de stmlraw est activé (Data Lake Storage Gen2), ce qui n'est pas autorisé pour le compte de stockage par défaut. Vous pouvez néanmoins l'inscrire plus tard comme magasin de données.
    b:
      en: |
        stmlfast is a Premium account, which isn't allowed for the default storage account.
      fr: |
        stmlfast est un compte Premium, ce qui n'est pas autorisé pour le compte de stockage par défaut.
    d:
      en: |
        stmllake is Premium and has hierarchical namespace enabled; both are excluded.
      fr: |
        stmllake est Premium et son espace de noms hiérarchique est activé ; les deux sont exclus.
references:
  - title: CLI (v2) workspace YAML schema
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-workspace
