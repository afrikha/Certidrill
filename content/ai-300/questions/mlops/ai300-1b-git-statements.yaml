id: ai300-1b-git-statements
objective: "1.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Two data scientists, Ben and Chloé, each have a compute instance in an Azure Machine Learning workspace named **mlw-litware**. Ben generates an SSH key in the terminal of his compute instance, adds the public key to GitHub, and clones the team repository. He then submits jobs with the Azure Machine Learning CLI (v2) from the cloned folder.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Deux data scientists, Ben et Chloé, disposent chacun d'une instance de calcul dans un espace de travail Azure Machine Learning nommé **mlw-litware**. Ben génère une clé SSH dans le terminal de son instance de calcul, ajoute la clé publique à GitHub et clone le dépôt de l'équipe. Il soumet ensuite des travaux avec la CLI Azure Machine Learning (v2) depuis le dossier cloné.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Chloé can use Ben's SSH key to push to GitHub from her own compute instance.
        fr: |
          Chloé peut utiliser la clé SSH de Ben pour envoyer des modifications vers GitHub depuis sa propre instance de calcul.
    - id: s2
      text:
        en: |
          The `mlflow.source.git.commit` property of Ben's jobs contains the hash of the commit checked out when each job was submitted.
        fr: |
          La propriété `mlflow.source.git.commit` des travaux de Ben contient le hachage du commit extrait au moment de la soumission de chaque travail.
    - id: s3
      text:
        en: |
          The `azureml.git.branch` property of Ben's jobs contains the branch that was active when each job was submitted.
        fr: |
          La propriété `azureml.git.branch` des travaux de Ben contient la branche active au moment de la soumission de chaque travail.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      An SSH key generated on a compute instance is saved on that instance and is accessible only to its owner, so Chloé must generate her own key. Jobs submitted from a Git repository with the CLI or SDK record the commit hash (`azureml.git.commit` or `mlflow.source.git.commit`, from `git rev-parse HEAD`) and the active branch (`azureml.git.branch` or `mlflow.source.git.branch`).
    fr: |
      Une clé SSH générée sur une instance de calcul est enregistrée sur cette instance et n'est accessible qu'à son propriétaire : Chloé doit générer sa propre clé. Les travaux soumis depuis un dépôt Git avec la CLI ou le SDK enregistrent le hachage du commit (`azureml.git.commit` ou `mlflow.source.git.commit`, issu de `git rev-parse HEAD`) et la branche active (`azureml.git.branch` ou `mlflow.source.git.branch`).
references:
  - title: Git integration
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-train-model-git-integration
