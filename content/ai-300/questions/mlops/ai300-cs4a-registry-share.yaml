id: ai300-cs4a-registry-share
objective: "1.2.4"
type: single
caseStudy: ai300-cs4a-coho-winery
difficulty: 2
status: draft
stem:
  en: You need to make version 7 of harvest-forecaster available to the platform team. The solution must meet the release requirements. What should you do?
  fr: Vous devez mettre la version 7 de harvest-forecaster à la disposition de l'équipe plateforme. La solution doit respecter les exigences de mise en production. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run az ml model download in mlw-coho-dev, then az ml model create --registry-name reg-coho with the downloaded folder", fr: "Exécuter az ml model download dans mlw-coho-dev, puis az ml model create --registry-name reg-coho avec le dossier téléchargé" } }
    - { id: b, text: { en: "Run az ml model share in mlw-coho-dev with --registry-name reg-coho, --share-with-name and --share-with-version", fr: "Exécuter az ml model share dans mlw-coho-dev avec --registry-name reg-coho, --share-with-name et --share-with-version" } }
    - { id: c, text: { en: "Run az ml model download in mlw-coho-dev, then az ml model create in mlw-coho-prod with the downloaded folder", fr: "Exécuter az ml model download dans mlw-coho-dev, puis az ml model create dans mlw-coho-prod avec le dossier téléchargé" } }
    - { id: d, text: { en: "Assign the platform team the AzureML Data Scientist role on mlw-coho-dev, then deploy from mlw-coho-dev", fr: "Attribuer à l'équipe plateforme le rôle AzureML Data Scientist sur mlw-coho-dev, puis déployer à partir de mlw-coho-dev" } }
answer: { optionId: b }
explanation:
  correct:
    en: "`az ml model share` copies a model that is registered in a workspace to a registry under the name and version given by `--share-with-name` and `--share-with-version`. The registry model keeps its lineage to the training job, and the platform team references it from mlw-coho-prod as `azureml://registries/reg-coho/models/...` without accessing mlw-coho-dev."
    fr: "`az ml model share` copie un modèle inscrit dans un espace de travail vers un registre, sous le nom et la version indiqués par `--share-with-name` et `--share-with-version`. Le modèle du registre conserve sa traçabilité vers le travail d'entraînement, et l'équipe plateforme le référence depuis mlw-coho-prod sous la forme `azureml://registries/reg-coho/models/...` sans accéder à mlw-coho-dev."
  options:
    a: { en: "Creating the registry model from downloaded files publishes it to reg-coho but loses the link to the train-2026-10 job.", fr: "Créer le modèle du registre à partir de fichiers téléchargés le publie dans reg-coho mais perd le lien avec le travail train-2026-10." }
    c: { en: "A copy registered directly in mlw-coho-prod bypasses reg-coho and loses the lineage to the training job.", fr: "Une copie inscrite directement dans mlw-coho-prod contourne reg-coho et perd la traçabilité vers le travail d'entraînement." }
    d: { en: "The platform team must not have access to mlw-coho-dev, and the model would not be published to reg-coho.", fr: "L'équipe plateforme ne doit pas avoir accès à mlw-coho-dev, et le modèle ne serait pas publié dans reg-coho." }
references:
  - title: Share models, components, and environments across workspaces with registries
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
