id: ai300-cs1c-gpu-cluster
objective: "1.1.3"
type: single
caseStudy: ai300-cs1c-trey-research
difficulty: 2
status: draft
stem:
  en: You need to create gpu-cluster. Which configuration should you use to meet the compute requirements?
  fr: Vous devez créer gpu-cluster. Quelle configuration devez-vous utiliser pour respecter les exigences de calcul ?
body:
  options:
    - id: a
      text:
        en: "Size Standard_ND96isr_H100_v5, tier low_priority, min_instances 0, max_instances 2"
        fr: "Taille Standard_ND96isr_H100_v5, niveau low_priority, min_instances 0, max_instances 2"
    - id: b
      text:
        en: "Size Standard_NC80adis_H100_v5, tier dedicated, min_instances 0, max_instances 2"
        fr: "Taille Standard_NC80adis_H100_v5, niveau dedicated, min_instances 0, max_instances 2"
    - id: c
      text:
        en: "Size Standard_ND96isr_H100_v5, tier dedicated, min_instances 2, max_instances 2"
        fr: "Taille Standard_ND96isr_H100_v5, niveau dedicated, min_instances 2, max_instances 2"
    - id: d
      text:
        en: "Size Standard_ND96isr_H100_v5, tier dedicated, min_instances 0, max_instances 2"
        fr: "Taille Standard_ND96isr_H100_v5, niveau dedicated, min_instances 0, max_instances 2"
answer: { optionId: d }
explanation:
  correct:
    en: Standard_ND96isr_H100_v5 has eight H100 GPUs per VM and InfiniBand; sizes with an r (RDMA) in their name are the ones that typically carry InfiniBand hardware. The dedicated tier isn't preempted, and min_instances 0 releases every node when no job runs, so no compute cost is incurred while the cluster is idle.
    fr: Standard_ND96isr_H100_v5 dispose de huit GPU H100 par machine virtuelle et d'InfiniBand ; ce sont généralement les tailles avec un r (RDMA) dans leur nom qui disposent du matériel InfiniBand. Le niveau dedicated n'est pas préempté, et min_instances 0 libère tous les nœuds quand aucun travail ne s'exécute ; aucun coût de calcul n'est donc engagé quand le cluster est inactif.
  options:
    a: { en: "Low-priority nodes are cheaper but can be preempted, which can interrupt a three-day training run.", fr: "Les nœuds de faible priorité sont moins chers mais peuvent être préemptés, ce qui peut interrompre une exécution d'entraînement de trois jours." }
    b: { en: "The NCads_H100_v5 series has one or two GPUs per VM, and its sizes have no r for RDMA in their name.", fr: "La série NCads_H100_v5 compte un ou deux GPU par machine virtuelle, et ses tailles n'ont pas de r (RDMA) dans leur nom." }
    c: { en: "With min_instances 2, both nodes keep running and are billed when no job runs.", fr: "Avec min_instances 2, les deux nœuds restent en marche et sont facturés quand aucun travail ne s'exécute." }
references:
  - title: Distributed GPU training guide (SDK v2)
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-train-distributed-gpu
  - title: ND-H100-v5 size series
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/gpu-accelerated/ndh100v5-series
