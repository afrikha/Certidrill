id: ai300-1a-data-wrong-type
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Version 1 of the data asset **churn-data** in the Azure Machine Learning workspace **mlw-fabrikam** has the type `uri_file` and points to a CSV file. The team now needs an `mltable` data asset built from a folder that contains an MLTable file for the same data.

    Jobs that used churn-data version 1 must stay reproducible. churn-data must no longer appear in the default data asset list of the workspace.

    What should you do?
  fr: |
    La version 1 de la ressource de données **churn-data** de l'espace de travail Azure Machine Learning **mlw-fabrikam** est de type `uri_file` et pointe vers un fichier CSV. L'équipe a désormais besoin d'une ressource de données `mltable` créée à partir d'un dossier qui contient un fichier MLTable pour les mêmes données.

    Les travaux qui ont utilisé la version 1 de churn-data doivent rester reproductibles. churn-data ne doit plus apparaître dans la liste par défaut des ressources de données de l'espace de travail.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Register version 2 of churn-data with the type `mltable`, and then archive version 1.", fr: "Inscrire la version 2 de churn-data avec le type `mltable`, puis archiver la version 1." } }
    - { id: b, text: { en: "Run `az ml data update` on version 1 of churn-data to change its type to `mltable`.", fr: "Exécuter `az ml data update` sur la version 1 de churn-data pour changer son type en `mltable`." } }
    - { id: c, text: { en: "Delete churn-data, and then register it again with the same name and the type `mltable`.", fr: "Supprimer churn-data, puis l'inscrire de nouveau sous le même nom avec le type `mltable`." } }
    - { id: d, text: { en: "Archive churn-data, and then register an `mltable` data asset with a different name.", fr: "Archiver churn-data, puis inscrire une ressource de données `mltable` sous un autre nom." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A new version can't change the type of a data asset, so the `mltable` data must use another name. Archiving churn-data hides it from list queries and the studio listing, while jobs can still reference version 1, which keeps them reproducible.
    fr: |
      Une nouvelle version ne peut pas changer le type d'une ressource de données : les données `mltable` doivent utiliser un autre nom. Archiver churn-data la masque des requêtes de liste et de la liste du studio, tandis que les travaux peuvent toujours référencer la version 1, ce qui les garde reproductibles.
  options:
    a: { en: "All versions of a data asset share the type of the name, so version 2 can't be `mltable`.", fr: "Toutes les versions d'une ressource de données partagent le type de leur nom : la version 2 ne peut pas être `mltable`." }
    b: { en: "Data asset versions are immutable; their type can't be updated.", fr: "Les versions des ressources de données sont immuables ; leur type ne peut pas être modifié." }
    c: { en: "Data assets can't be deleted, and deleting would break the reproducibility of the existing jobs.", fr: "Les ressources de données ne peuvent pas être supprimées, et une suppression casserait la reproductibilité des travaux existants." }
references:
  - title: Create Data Assets - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-data-assets
