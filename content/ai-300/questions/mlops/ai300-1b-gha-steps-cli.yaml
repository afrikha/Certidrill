id: ai300-1b-gha-steps-cli
objective: "1.3.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    A GitHub Actions workflow has already signed in to Azure. Its next steps must use the Azure Machine Learning CLI (v2) to register the training environment defined in `ml/env/train-env.yml` in a workspace named **mlw-litware**, and then submit the pipeline job defined in `ml/pipelines/train.yml`.

    How should you complete the steps? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un workflow GitHub Actions s'est déjà connecté à Azure. Ses étapes suivantes doivent utiliser la CLI Azure Machine Learning (v2) pour inscrire l'environnement d'entraînement défini dans `ml/env/train-env.yml` dans un espace de travail nommé **mlw-litware**, puis soumettre le travail de pipeline défini dans `ml/pipelines/train.yml`.

    Comment devez-vous compléter les étapes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    - name: Install the CLI extension
      run: az extension add -n [[ext]] -y
    - name: Register the environment
      run: [[envcmd]] --file ml/env/train-env.yml -w mlw-litware -g rg-ml-litware
    - name: Submit the pipeline
      run: [[jobcmd]] --file ml/pipelines/train.yml -w mlw-litware -g rg-ml-litware
  slots:
    - id: ext
      options:
        - { id: ml, text: ml }
        - { id: v1, text: azure-cli-ml }
        - { id: devops, text: azure-devops }
    - id: envcmd
      options:
        - { id: data, text: az ml data create }
        - { id: env, text: az ml environment create }
        - { id: compute, text: az ml compute create }
    - id: jobcmd
      options:
        - { id: comp, text: az ml component create }
        - { id: sched, text: az ml schedule create }
        - { id: job, text: az ml job create }
answer:
  values: { ext: ml, envcmd: env, jobcmd: job }
explanation:
  correct:
    en: |
      The `ml` extension provides the Azure Machine Learning CLI (v2). `az ml environment create` registers an environment from its YAML file, and `az ml job create` submits a job, including a pipeline job, from its YAML file.
    fr: |
      L'extension `ml` fournit la CLI Azure Machine Learning (v2). `az ml environment create` inscrit un environnement à partir de son fichier YAML, et `az ml job create` soumet un travail, y compris un travail de pipeline, à partir de son fichier YAML.
  options:
    v1: { en: "azure-cli-ml is the CLI v1 extension, not the v2 ml extension.", fr: "azure-cli-ml est l'extension de la CLI v1, pas l'extension ml v2." }
    devops: { en: "azure-devops manages Azure DevOps, not Azure Machine Learning.", fr: "azure-devops gère Azure DevOps, pas Azure Machine Learning." }
    data: { en: "az ml data create registers a data asset.", fr: "az ml data create inscrit une ressource de données." }
    compute: { en: "az ml compute create creates a compute target.", fr: "az ml compute create crée une cible de calcul." }
    comp: { en: "az ml component create registers a component; it doesn't run the pipeline.", fr: "az ml component create inscrit un composant ; il n'exécute pas le pipeline." }
    sched: { en: "az ml schedule create creates a schedule for later runs instead of submitting the job now.", fr: "az ml schedule create crée une planification pour des exécutions futures au lieu de soumettre le travail maintenant." }
references:
  - title: Create workspaces with Azure CLI
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-workspace-cli
  - title: Share models, components, and environments across workspaces with registries
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
