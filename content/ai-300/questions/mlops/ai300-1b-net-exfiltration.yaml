id: ai300-1b-net-exfiltration
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Machine Learning workspace named **mlw-woodgrove** that uses a managed virtual network. Data scientists run training jobs on compute clusters and compute instances in the workspace.

    The security team requires that training compute can send traffic only to destinations that an administrator has approved, to minimize the risk of data exfiltration.

    What should you configure?
  fr: |
    Woodgrove Bank dispose d'un espace de travail Azure Machine Learning nommé **mlw-woodgrove** qui utilise un réseau virtuel managé. Les data scientists exécutent des travaux d'entraînement sur des clusters de calcul et des instances de calcul de l'espace de travail.

    L'équipe de sécurité exige que le calcul d'entraînement ne puisse envoyer du trafic que vers des destinations approuvées par un administrateur, afin de réduire au minimum le risque d'exfiltration de données.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "Set public network access of the workspace to Disabled", fr: "Définir l'accès réseau public de l'espace de travail sur Disabled" }
    - id: b
      text: { en: "Set the managed network isolation mode to allow_only_approved_outbound", fr: "Définir le mode d'isolation du réseau managé sur allow_only_approved_outbound" }
    - id: c
      text: { en: "Set the managed network isolation mode to allow_internet_outbound", fr: "Définir le mode d'isolation du réseau managé sur allow_internet_outbound" }
    - id: d
      text: { en: "Create a private endpoint for the workspace in the corporate virtual network", fr: "Créer un point de terminaison privé pour l'espace de travail dans le réseau virtuel de l'entreprise" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In the allow only approved outbound mode, outbound traffic from managed compute is limited to the required service destinations and to the outbound rules you approve (private endpoints, service tags, FQDNs). Data exfiltration protection is enabled automatically in this mode.
    fr: |
      En mode allow only approved outbound, le trafic sortant du calcul managé est limité aux destinations requises par le service et aux règles de trafic sortant que vous approuvez (points de terminaison privés, balises de service, FQDN). La protection contre l'exfiltration de données est activée automatiquement dans ce mode.
  options:
    a:
      en: |
        Public network access controls inbound access to the workspace; it doesn't restrict outbound traffic from compute.
      fr: |
        L'accès réseau public contrôle l'accès entrant à l'espace de travail ; il ne restreint pas le trafic sortant du calcul.
    c:
      en: |
        allow_internet_outbound allows all internet outbound traffic.
      fr: |
        allow_internet_outbound autorise tout le trafic sortant vers Internet.
    d:
      en: |
        A workspace private endpoint secures inbound access from your network; it doesn't limit where compute sends data.
      fr: |
        Un point de terminaison privé d'espace de travail sécurise l'accès entrant depuis votre réseau ; il ne limite pas les destinations vers lesquelles le calcul envoie des données.
references:
  - title: Managed virtual network isolation
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
