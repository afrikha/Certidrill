id: ai300-1a-comp-register-order
objective: "1.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You are preparing a training pipeline for the Azure Machine Learning workspace **mlw-adatum**, which already contains the compute cluster cpu-cluster and the data asset sales-transactions. You have three local files:

    - churn-env.yml defines the environment churn-env version 1;
    - train.yml defines the component train_churn_model, which uses `environment: azureml:churn-env:1`;
    - pipeline.yml defines a pipeline job whose train step uses `azureml:train_churn_model@latest`.

    Each asset must exist before a component or job that references it is created. Which three commands should you run in sequence? To answer, move the appropriate commands from the list of commands to the answer area and arrange them in the correct order.
  fr: |
    Vous préparez un pipeline d'entraînement pour l'espace de travail Azure Machine Learning **mlw-adatum**, qui contient déjà le cluster de calcul cpu-cluster et la ressource de données sales-transactions. Vous disposez de trois fichiers locaux :

    - churn-env.yml définit l'environnement churn-env version 1 ;
    - train.yml définit le composant train_churn_model, qui utilise `environment: azureml:churn-env:1` ;
    - pipeline.yml définit un travail de pipeline dont l'étape train utilise `azureml:train_churn_model@latest`.

    Chaque actif doit exister avant la création d'un composant ou d'un travail qui le référence. Quelles sont les trois commandes à exécuter dans l'ordre ? Pour répondre, déplacez les commandes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: env, text: "`az ml environment create --file churn-env.yml`" }
    - { id: comp, text: "`az ml component create --file train.yml`" }
    - { id: job, text: "`az ml job create --file pipeline.yml`" }
    - { id: compute, text: "`az ml compute create --name cpu-cluster --type AmlCompute`" }
    - { id: data, text: "`az ml data create --name sales-transactions --path ./sales`" }
    - { id: archive, text: "`az ml component archive --name train_churn_model`" }
answer:
  sequence: [ env, comp, job ]
explanation:
  correct:
    en: |
      The component references churn-env version 1, so the environment is created first. The pipeline references the registered component with `@latest`, so the component is registered next. The pipeline job is then submitted with `az ml job create`.
    fr: |
      Le composant référence churn-env version 1 : l'environnement est donc créé en premier. Le pipeline référence le composant inscrit avec `@latest` : le composant est donc inscrit ensuite. Le travail de pipeline est enfin soumis avec `az ml job create`.
  options:
    compute: { en: "cpu-cluster already exists in the workspace.", fr: "cpu-cluster existe déjà dans l'espace de travail." }
    data: { en: "The data asset sales-transactions already exists.", fr: "La ressource de données sales-transactions existe déjà." }
    archive: { en: "Archiving would hide the component the pipeline needs; it isn't part of the preparation.", fr: "L'archivage masquerait le composant dont le pipeline a besoin ; il ne fait pas partie de la préparation." }
references:
  - title: Create and run component-based ML pipelines (CLI) - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-component-pipelines-cli
  - title: Manage Azure Machine Learning environments with the CLI & SDK (v2) - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-environments-v2
