id: ai300-1a-iam-user-identity
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's analysts submit command jobs with the Azure CLI to the compute cluster **cpu-train** in the Azure Machine Learning workspace **mlw-fabrikam**. The jobs read an identity-based datastore that points to a Data Lake Storage Gen2 account, where each analyst is authorized only on their own folders. cpu-train has a system-assigned managed identity.

    You need to ensure that each job accesses the data with the permissions of the analyst who submitted it.

    What should you add to the job YAML files?
  fr: |
    Les analystes de Fabrikam soumettent des travaux de commande avec Azure CLI au cluster de calcul **cpu-train** de l'espace de travail Azure Machine Learning **mlw-fabrikam**. Les travaux lisent un magasin de données basé sur l'identité qui pointe vers un compte Data Lake Storage Gen2, où chaque analyste n'est autorisé que sur ses propres dossiers. cpu-train a une identité managée affectée par le système.

    Vous devez faire en sorte que chaque travail accède aux données avec les autorisations de l'analyste qui l'a soumis.

    Que devez-vous ajouter aux fichiers YAML des travaux ?
body:
  options:
    - { id: a, text: { en: "An `identity` section with `type: managed`", fr: "Une section `identity` avec `type: managed`" } }
    - { id: b, text: { en: "An `identity` section with `type: user_identity`", fr: "Une section `identity` avec `type: user_identity`" } }
    - { id: c, text: { en: "An `identity` section with `type: aml_token`", fr: "Une section `identity` avec `type: aml_token`" } }
    - { id: d, text: { en: "A `credentials` section with the analyst's SAS token", fr: "Une section `credentials` avec le jeton SAS de l'analyste" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With `identity: type: user_identity`, the job uses the Microsoft Entra identity of the user who submitted it to access input data and write outputs. Without this setting, an identity-based datastore is accessed with the managed identity of the compute, which has the same permissions for every analyst.
    fr: |
      Avec `identity: type: user_identity`, le travail utilise l'identité Microsoft Entra de l'utilisateur qui l'a soumis pour accéder aux données d'entrée et écrire les sorties. Sans ce paramètre, un magasin de données basé sur l'identité est lu avec l'identité managée du calcul, qui a les mêmes autorisations pour tous les analystes.
  options:
    a: { en: "`managed` uses the managed identity of cpu-train, whose permissions are the same whoever submits the job.", fr: "`managed` utilise l'identité managée de cpu-train, dont les autorisations sont les mêmes quel que soit l'auteur du travail." }
    c: { en: "`aml_token` doesn't pass the identity of the submitting analyst to the storage.", fr: "`aml_token` ne transmet pas l'identité de l'analyste qui soumet le travail au stockage." }
    d: { en: "A job has no `credentials` section; credentials belong to credential-based datastores, which aren't tied to the submitting user.", fr: "Un travail n'a pas de section `credentials` ; les informations d'identification appartiennent aux magasins de données qui en utilisent, et elles ne sont pas liées à l'utilisateur qui soumet." }
references:
  - title: Set up service authentication - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-identity-based-service-authentication
  - title: CLI (v2) command job YAML schema - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-job-command
