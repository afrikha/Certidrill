id: ai300-1a-env-new-version-order
objective: "1.2.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A training job in the Azure Machine Learning workspace **mlw-fabrikam** uses `environment: azureml:forecast-env:4`. forecast-env is defined in forecast-env.yml with a base image and a conda file named conda.yml. The training script now also needs the `prophet` package.

    You need to run the job in an environment that contains prophet. Existing jobs that use version 4 must stay reproducible.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un travail d'entraînement de l'espace de travail Azure Machine Learning **mlw-fabrikam** utilise `environment: azureml:forecast-env:4`. forecast-env est défini dans forecast-env.yml avec une image de base et un fichier conda nommé conda.yml. Le script d'entraînement a désormais aussi besoin du package `prophet`.

    Vous devez exécuter le travail dans un environnement qui contient prophet. Les travaux existants qui utilisent la version 4 doivent rester reproductibles.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: conda, text: { en: "Add prophet to conda.yml, and set `version: \"5\"` in forecast-env.yml.", fr: "Ajouter prophet à conda.yml, et définir `version: \"5\"` dans forecast-env.yml." } }
    - { id: create, text: { en: "Run `az ml environment create --file forecast-env.yml`.", fr: "Exécuter `az ml environment create --file forecast-env.yml`." } }
    - { id: job, text: { en: "Submit the job with `environment: azureml:forecast-env:5`.", fr: "Soumettre le travail avec `environment: azureml:forecast-env:5`." } }
    - { id: update, text: { en: "Run `az ml environment update --name forecast-env --version 4` to apply the new conda.yml.", fr: "Exécuter `az ml environment update --name forecast-env --version 4` pour appliquer le nouveau conda.yml." } }
    - { id: restore, text: { en: "Run `az ml environment restore --name forecast-env`.", fr: "Exécuter `az ml environment restore --name forecast-env`." } }
    - { id: base, text: { en: "Install prophet in the base image with pip, keeping the same image tag.", fr: "Installer prophet dans l'image de base avec pip, en conservant la même balise d'image." } }
answer:
  sequence: [ conda, create, job ]
explanation:
  correct:
    en: |
      Only the description and tags of an existing version can be updated, so you add prophet to the conda file and register the definition as version 5. The job then references version 5, while version 4 stays unchanged for the existing jobs.
    fr: |
      Seules la description et les étiquettes d'une version existante peuvent changer : vous ajoutez donc prophet au fichier conda et inscrivez la définition comme version 5. Le travail référence ensuite la version 5, tandis que la version 4 reste inchangée pour les travaux existants.
  options:
    update: { en: "Only the description and tags of an environment version can be updated.", fr: "Seules la description et les étiquettes d'une version d'environnement peuvent être mises à jour." }
    restore: { en: "Restore applies only to archived environments and doesn't change their content.", fr: "La restauration s'applique uniquement aux environnements archivés et ne change pas leur contenu." }
    base: { en: "With a conda file, the job runs in the conda environment, and reusing the same tag doesn't create a new environment version.", fr: "Avec un fichier conda, le travail s'exécute dans l'environnement conda, et réutiliser la même balise ne crée pas de nouvelle version d'environnement." }
references:
  - title: Manage Azure Machine Learning environments with the CLI & SDK (v2) - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-environments-v2
