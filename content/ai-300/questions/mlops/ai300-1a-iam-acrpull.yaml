id: ai300-1a-iam-acrpull
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You created the Azure Machine Learning workspace **mlw-litware** and, immediately afterwards, a compute cluster named **gpu-train** with a system-assigned managed identity. At that time, no custom environment had been built, so the workspace had no container registry yet.

    Today, a data scientist registers the first custom environment. Its image is built and pushed to the new workspace container registry, but jobs on gpu-train fail with an authorization error when they pull the image. You need to fix the issue. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous avez créé l'espace de travail Azure Machine Learning **mlw-litware** puis, juste après, un cluster de calcul nommé **gpu-train** avec une identité managée affectée par le système. À ce moment-là, aucun environnement personnalisé n'avait été construit : l'espace de travail n'avait pas encore de registre de conteneurs.

    Aujourd'hui, un data scientist inscrit le premier environnement personnalisé. Son image est construite et envoyée dans le nouveau registre de conteneurs de l'espace de travail, mais les travaux sur gpu-train échouent avec une erreur d'autorisation quand ils récupèrent l'image. Vous devez corriger le problème. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the AcrPush role on the workspace container registry to the managed identity of gpu-train.", fr: "Attribuer le rôle AcrPush sur le registre de conteneurs de l'espace de travail à l'identité managée de gpu-train." } }
    - { id: b, text: { en: "Assign the AcrPull role on the workspace container registry to the managed identity of gpu-train.", fr: "Attribuer le rôle AcrPull sur le registre de conteneurs de l'espace de travail à l'identité managée de gpu-train." } }
    - { id: c, text: { en: "Assign the Contributor role on mlw-litware to the managed identity of gpu-train.", fr: "Attribuer le rôle Contributor sur mlw-litware à l'identité managée de gpu-train." } }
    - { id: d, text: { en: "Assign the AcrPull role on the workspace container registry to the data scientist.", fr: "Attribuer le rôle AcrPull sur le registre de conteneurs de l'espace de travail au data scientist." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A cluster's managed identity normally receives AcrPull on the workspace container registry automatically so that it can pull training images. When the compute is created before the registry exists, you must assign AcrPull manually. AcrPull is the least-privileged role that allows image pulls.
    fr: |
      L'identité managée d'un cluster reçoit normalement AcrPull sur le registre de conteneurs de l'espace de travail automatiquement, afin de récupérer les images d'entraînement. Quand le calcul est créé avant que le registre existe, vous devez attribuer AcrPull manuellement. AcrPull est le rôle le moins privilégié qui permet de récupérer des images.
  options:
    a: { en: "AcrPush also allows pushing images, which the cluster doesn't need.", fr: "AcrPush permet aussi d'envoyer des images, ce dont le cluster n'a pas besoin." }
    c: { en: "A role on the workspace doesn't grant data access to the container registry, and Contributor is broad.", fr: "Un rôle sur l'espace de travail ne donne pas accès aux données du registre de conteneurs, et Contributor est très large." }
    d: { en: "The cluster pulls the image with its own managed identity, not with the identity of the user who registered the environment.", fr: "Le cluster récupère l'image avec sa propre identité managée, pas avec celle de l'utilisateur qui a inscrit l'environnement." }
references:
  - title: Set up service authentication - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-identity-based-service-authentication
