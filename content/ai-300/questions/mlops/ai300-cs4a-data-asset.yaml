id: ai300-cs4a-data-asset
objective: "1.2.1"
type: dropdown
caseStudy: ai300-cs4a-coho-winery
difficulty: 1
status: draft
stem:
  en: |
    You need to create the vineyard-readings data asset. You run `az ml data create --file readings.yml --resource-group rg-coho-dev --workspace-name mlw-coho-dev`. How should you complete readings.yml? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer la ressource de données vineyard-readings. Vous exécutez `az ml data create --file readings.yml --resource-group rg-coho-dev --workspace-name mlw-coho-dev`. Comment devez-vous compléter readings.yml ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    $schema: https://azuremlschemas.azureedge.net/latest/data.schema.json
    name: vineyard-readings
    version: "1"
    type: [[type]]
    path: [[path]]
  slots:
    - id: type
      options:
        - { id: file, text: uri_file }
        - { id: folder, text: uri_folder }
        - { id: table, text: mltable }
    - id: path
      options:
        - { id: blobstore, text: "azureml://datastores/workspaceblobstore/paths/readings/2026/" }
        - { id: sensor, text: "azureml://datastores/sensorstore/paths/readings/2026/" }
        - { id: local, text: "./readings/2026/" }
        - { id: sensorfile, text: "azureml://datastores/sensorstore/paths/readings/2026/vineyard01.parquet" }
answer:
  values: { type: folder, path: sensor }
explanation:
  correct:
    en: "A `uri_folder` data asset references a folder, and the job can read all the Parquet files it contains with pandas. The `azureml://datastores/<datastore>/paths/<path>` format points to the readings/2026/ folder through the existing sensorstore datastore, so the data stays in stcohoiot."
    fr: "Une ressource de données `uri_folder` référence un dossier, et le travail peut lire avec pandas tous les fichiers Parquet qu'il contient. Le format `azureml://datastores/<datastore>/paths/<path>` désigne le dossier readings/2026/ au moyen du magasin de données sensorstore existant, si bien que les données restent dans stcohoiot."
  options:
    file: { en: "uri_file references a single file, not a whole folder.", fr: "uri_file référence un seul fichier, pas un dossier entier." }
    table: { en: "mltable requires a folder that contains an MLTable file, which is the schema file the data scientists don't want to maintain.", fr: "mltable exige un dossier contenant un fichier MLTable, c'est-à-dire le fichier de schéma que les data scientists ne veulent pas maintenir." }
    blobstore: { en: "workspaceblobstore is the default workspace datastore; the readings are in the sensors container behind sensorstore.", fr: "workspaceblobstore est le magasin de données par défaut de l'espace de travail ; les mesures se trouvent dans le conteneur sensors, derrière sensorstore." }
    local: { en: "A local path is uploaded to the default datastore when the asset is created; it doesn't reference the existing folder in stcohoiot.", fr: "Un chemin local est chargé dans le magasin de données par défaut à la création de la ressource ; il ne référence pas le dossier existant de stcohoiot." }
    sensorfile: { en: "This path targets one Parquet file, not the whole readings/2026/ folder.", fr: "Ce chemin cible un seul fichier Parquet, pas tout le dossier readings/2026/." }
references:
  - title: Create and manage data assets
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-data-assets
