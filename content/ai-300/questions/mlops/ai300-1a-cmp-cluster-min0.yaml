id: ai300-1a-cmp-cluster-min0
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Six data scientists at Contoso submit training jobs to the Azure Machine Learning workspace **mlw-contoso** a few times a week. Each job needs up to four Standard_DS3_v2 nodes, and the team's pipelines reference the compute target by name as `azureml:cpu-train`.

    You need to create cpu-train. The solution must ensure that no compute charges are incurred when no job is running.

    What should you create?
  fr: |
    Six data scientists de Contoso soumettent des travaux d'entraînement à l'espace de travail Azure Machine Learning **mlw-contoso** quelques fois par semaine. Chaque travail a besoin de jusqu'à quatre nœuds Standard_DS3_v2, et les pipelines de l'équipe référencent la cible de calcul par son nom, `azureml:cpu-train`.

    Vous devez créer cpu-train. La solution doit garantir qu'aucun coût de calcul n'est facturé quand aucun travail ne s'exécute.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A compute cluster with `min_instances: 0` and `max_instances: 4`", fr: "Un cluster de calcul avec `min_instances: 0` et `max_instances: 4`" } }
    - { id: b, text: { en: "A compute instance shared by the six data scientists, with idle shutdown enabled", fr: "Une instance de calcul partagée par les six data scientists, avec l'arrêt en cas d'inactivité activé" } }
    - { id: c, text: { en: "A compute cluster with `min_instances: 4` and `max_instances: 4`", fr: "Un cluster de calcul avec `min_instances: 4` et `max_instances: 4`" } }
    - { id: d, text: { en: "A compute instance of size Standard_DS3_v2 with a stop schedule every evening", fr: "Une instance de calcul de taille Standard_DS3_v2 avec une planification d'arrêt chaque soir" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A compute cluster autoscales each time a job is submitted, up to `max_instances`. With `min_instances: 0`, it scales down to zero nodes when no job runs, so no compute charges are incurred while it's idle.
    fr: |
      Un cluster de calcul se met à l'échelle automatiquement à chaque soumission de travail, jusqu'à `max_instances`. Avec `min_instances: 0`, il redescend à zéro nœud quand aucun travail ne s'exécute : aucun coût de calcul n'est facturé quand il est inactif.
  options:
    c: { en: "Any `min_instances` value above 0 keeps that number of nodes running and billed even when no job runs.", fr: "Toute valeur de `min_instances` supérieure à 0 maintient ce nombre de nœuds en fonctionnement, et facturés, même sans travail." }
    b: { en: "A compute instance can't be shared with other users, and it's a single node, so it can't provide four nodes.", fr: "Une instance de calcul ne peut pas être partagée avec d'autres utilisateurs, et elle n'a qu'un nœud : elle ne peut pas fournir quatre nœuds." }
    d: { en: "A compute instance is a single node, and it's billed for compute while it runs during the day even when no job is running.", fr: "Une instance de calcul n'a qu'un nœud, et elle est facturée pendant qu'elle tourne dans la journée, même sans travail." }
references:
  - title: Understand compute targets - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-compute-target
  - title: Create compute clusters - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-attach-compute-cluster
