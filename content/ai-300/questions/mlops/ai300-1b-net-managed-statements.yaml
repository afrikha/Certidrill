id: ai300-1b-net-managed-statements
objective: "1.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an Azure Machine Learning workspace named **mlw-tailspin** that doesn't use a managed virtual network. It contains a compute cluster named **gpu-cluster** and a managed online endpoint.

    You plan to update mlw-tailspin to use a managed virtual network in the allow only approved outbound mode, with one FQDN outbound rule.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un espace de travail Azure Machine Learning nommé **mlw-tailspin** qui n'utilise pas de réseau virtuel managé. Il contient un cluster de calcul nommé **gpu-cluster** et un point de terminaison en ligne managé.

    Vous prévoyez de mettre à jour mlw-tailspin pour utiliser un réseau virtuel managé en mode allow only approved outbound, avec une règle de trafic sortant FQDN.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          After the update, gpu-cluster and the managed online endpoint are moved into the managed virtual network automatically.
        fr: |
          Après la mise à jour, gpu-cluster et le point de terminaison en ligne managé sont déplacés automatiquement dans le réseau virtuel managé.
    - id: s2
      text:
        en: |
          The FQDN outbound rule adds an Azure Firewall that is billed in addition to the managed virtual network.
        fr: |
          La règle de trafic sortant FQDN ajoute un pare-feu Azure Firewall facturé en plus du réseau virtuel managé.
    - id: s3
      text:
        en: |
          Later, you can switch the workspace to the allow internet outbound mode to simplify package installation.
        fr: |
          Plus tard, vous pourrez passer l'espace de travail en mode allow internet outbound pour simplifier l'installation des packages.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      There is no migration path for existing compute; you delete and recreate compute clusters, compute instances and managed online endpoints after enabling the managed network. The managed network itself is free, but FQDN rules use an Azure Firewall that you pay for. Once allow only approved outbound is chosen, the workspace can't switch to allow internet outbound.
    fr: |
      Il n'existe pas de chemin de migration pour le calcul existant ; vous supprimez puis recréez les clusters de calcul, les instances de calcul et les points de terminaison en ligne managés après avoir activé le réseau managé. Le réseau managé lui-même est gratuit, mais les règles FQDN utilisent un pare-feu Azure Firewall payant. Une fois allow only approved outbound choisi, l'espace de travail ne peut pas passer à allow internet outbound.
references:
  - title: Managed virtual network isolation
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-managed-network
