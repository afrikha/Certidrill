id: ai300-1a-iam-uai-facts
objective: "1.1.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Tailspin's Azure Machine Learning workspace **mlw-tailspin-prod** uses a system-assigned managed identity and a user-assigned managed identity named **id-mlw-a**. id-mlw-a is the primary user-assigned identity of the workspace. You plan changes to the identity configuration.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'espace de travail Azure Machine Learning **mlw-tailspin-prod** de Tailspin utilise une identité managée affectée par le système et une identité managée affectée par l'utilisateur nommée **id-mlw-a**. id-mlw-a est l'identité affectée par l'utilisateur principale de l'espace de travail. Vous prévoyez de modifier la configuration des identités.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can update mlw-tailspin-prod so that it uses only its system-assigned managed identity.
        fr: |
          Vous pouvez mettre à jour mlw-tailspin-prod pour qu'il utilise uniquement son identité managée affectée par le système.
    - id: s2
      text:
        en: |
          To add a second user-assigned identity named id-mlw-b, the update must list both id-mlw-a and id-mlw-b under `user_assigned_identities`.
        fr: |
          Pour ajouter une deuxième identité affectée par l'utilisateur nommée id-mlw-b, la mise à jour doit lister id-mlw-a et id-mlw-b sous `user_assigned_identities`.
    - id: s3
      text:
        en: |
          id-mlw-a needs the Contributor role on the container registry of the workspace.
        fr: |
          id-mlw-a a besoin du rôle Contributor sur le registre de conteneurs de l'espace de travail.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A workspace can move from system-assigned to system-assigned plus user-assigned identities, but not back. When you add a user-assigned identity, you must pass all the existing user-assigned identity IDs; those you omit are removed. A user-assigned workspace identity needs Contributor on the workspace and on its associated resources, including the container registry.
    fr: |
      Un espace de travail peut passer d'une identité affectée par le système à des identités affectées par le système et par l'utilisateur, mais pas l'inverse. Quand vous ajoutez une identité affectée par l'utilisateur, vous devez transmettre les ID de toutes les identités affectées par l'utilisateur existantes ; celles que vous omettez sont supprimées. Une identité d'espace de travail affectée par l'utilisateur a besoin de Contributor sur l'espace de travail et sur ses ressources associées, dont le registre de conteneurs.
references:
  - title: Set up service authentication - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-identity-based-service-authentication
