id: ai300-1a-cmp-cluster-yaml
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You need to create a compute cluster named **cpu-batch** in the Azure Machine Learning workspace **mlw-adatum** for nightly feature engineering jobs. The cluster must meet the following requirements:

    - use up to four nodes;
    - incur no compute charges when no job is running;
    - release an idle node five minutes after its last job;
    - use the lowest-priced VMs, because the jobs tolerate interruptions.

    How should you complete the YAML file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer un cluster de calcul nommé **cpu-batch** dans l'espace de travail Azure Machine Learning **mlw-adatum** pour des travaux nocturnes d'ingénierie des caractéristiques. Le cluster doit répondre aux exigences suivantes :

    - utiliser jusqu'à quatre nœuds ;
    - n'entraîner aucun coût de calcul quand aucun travail ne s'exécute ;
    - libérer un nœud inactif cinq minutes après son dernier travail ;
    - utiliser les machines virtuelles les moins chères, car les travaux tolèrent les interruptions.

    Comment devez-vous compléter le fichier YAML ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    $schema: https://azuremlschemas.azureedge.net/latest/amlCompute.schema.json
    name: cpu-batch
    type: amlcompute
    size: STANDARD_DS3_v2
    min_instances: [[min]]
    max_instances: 4
    idle_time_before_scale_down: [[idle]]
    tier: [[tier]]
  slots:
    - id: min
      options:
        - { id: m0, text: "0" }
        - { id: m1, text: "1" }
        - { id: m4, text: "4" }
    - id: idle
      options:
        - { id: i5, text: "5" }
        - { id: i120, text: "120" }
        - { id: i300, text: "300" }
    - id: tier
      options:
        - { id: ded, text: dedicated }
        - { id: low, text: low_priority }
        - { id: spot, text: Spot }
answer:
  values: { min: m0, idle: i300, tier: low }
explanation:
  correct:
    en: |
      `min_instances: 0` lets the cluster scale down to zero nodes, so nothing is billed when no job runs. `idle_time_before_scale_down` is expressed in seconds, so five minutes is 300 (the default is 120). The `low_priority` tier uses preemptible VMs at a reduced cost compared to `dedicated`.
    fr: |
      `min_instances: 0` permet au cluster de redescendre à zéro nœud : rien n'est facturé quand aucun travail ne s'exécute. `idle_time_before_scale_down` s'exprime en secondes : cinq minutes valent 300 (la valeur par défaut est 120). Le niveau `low_priority` utilise des machines virtuelles préemptibles à un coût réduit par rapport à `dedicated`.
  options:
    m1: { en: "Any value above 0 keeps nodes running and billed while the cluster is idle.", fr: "Toute valeur supérieure à 0 maintient des nœuds en fonctionnement, et facturés, quand le cluster est inactif." }
    i5: { en: "The value is in seconds, so 5 would release nodes after five seconds.", fr: "La valeur est en secondes : 5 libérerait les nœuds après cinq secondes." }
    spot: { en: "Spot is a job tier of serverless compute; a compute cluster tier is `dedicated` or `low_priority`.", fr: "Spot est un niveau de travail du calcul serverless ; le niveau d'un cluster de calcul est `dedicated` ou `low_priority`." }
references:
  - title: CLI (v2) compute cluster (AmlCompute) YAML schema - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-compute-aml
