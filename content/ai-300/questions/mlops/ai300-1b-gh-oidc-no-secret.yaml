id: ai300-1b-gh-oidc-no-secret
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind stores its MLOps code in a GitHub repository. A GitHub Actions workflow that runs on GitHub-hosted runners must run `az ml` commands against an Azure Machine Learning workspace named **mlw-northwind**.

    Security requirements state that no credential that expires or must be rotated can be stored in GitHub.

    What should you use to authenticate the workflow to Azure?
  fr: |
    Northwind stocke son code MLOps dans un dépôt GitHub. Un workflow GitHub Actions exécuté sur des exécuteurs hébergés par GitHub doit lancer des commandes `az ml` sur un espace de travail Azure Machine Learning nommé **mlw-northwind**.

    Les exigences de sécurité imposent qu'aucune information d'identification qui expire ou doit être renouvelée ne soit stockée dans GitHub.

    Que devez-vous utiliser pour authentifier le workflow auprès d'Azure ?
body:
  options:
    - id: a
      text: { en: "A service principal client secret stored in a GitHub secret named AZURE_CREDENTIALS", fr: "Un secret client de principal de service stocké dans un secret GitHub nommé AZURE_CREDENTIALS" }
    - id: b
      text: { en: "OpenID Connect with a federated identity credential on a Microsoft Entra application", fr: "OpenID Connect avec des informations d'identification fédérées sur une application Microsoft Entra" }
    - id: c
      text: { en: "The system-assigned managed identity of mlw-northwind", fr: "L'identité managée affectée par le système de mlw-northwind" }
    - id: d
      text: { en: "A GitHub personal access token stored in a GitHub secret", fr: "Un jeton d'accès personnel GitHub stocké dans un secret GitHub" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With OpenID Connect, the Microsoft Entra application (or a user-assigned managed identity) has a federated identity credential that trusts tokens issued by GitHub Actions for the repository. GitHub only stores the client, tenant and subscription IDs, which aren't secrets, and the short-lived GitHub token is exchanged for an Azure token at each run. Microsoft Learn recommends this option.
    fr: |
      Avec OpenID Connect, l'application Microsoft Entra (ou une identité managée affectée par l'utilisateur) possède des informations d'identification fédérées qui approuvent les jetons émis par GitHub Actions pour le dépôt. GitHub ne stocke que les ID de client, de locataire et d'abonnement, qui ne sont pas des secrets, et le jeton GitHub de courte durée est échangé contre un jeton Azure à chaque exécution. Microsoft Learn recommande cette option.
  options:
    a:
      en: |
        A client secret expires and must be stored and rotated; Microsoft Learn describes this option as less secure and not recommended.
      fr: |
        Un secret client expire et doit être stocké et renouvelé ; Microsoft Learn décrit cette option comme moins sûre et déconseillée.
    c:
      en: |
        A workspace's system-assigned identity belongs to the workspace; a GitHub-hosted runner can't sign in with it.
      fr: |
        L'identité affectée par le système d'un espace de travail appartient à l'espace de travail ; un exécuteur hébergé par GitHub ne peut pas se connecter avec elle.
    d:
      en: |
        A GitHub personal access token authenticates to GitHub, not to Azure.
      fr: |
        Un jeton d'accès personnel GitHub authentifie auprès de GitHub, pas auprès d'Azure.
references:
  - title: GitHub Actions for CI/CD
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-github-actions-machine-learning
  - title: Authenticate to Azure from GitHub Actions by OpenID Connect
    url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
