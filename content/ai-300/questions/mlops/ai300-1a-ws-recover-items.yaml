id: ai300-1a-ws-recover-items
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Machine Learning workspace named **mlw-fabrikam-risk** that was deleted by mistake two days ago with the default options. The workspace used a system-assigned managed identity, and its key vault and storage account still exist.

    You plan to recover the workspace from **Recently deleted** in the Azure portal.

    Which two items will be available again after the recovery without being recreated?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un espace de travail Azure Machine Learning nommé **mlw-fabrikam-risk** qui a été supprimé par erreur il y a deux jours avec les options par défaut. L'espace de travail utilisait une identité managée affectée par le système, et son coffre de clés et son compte de stockage existent toujours.

    Vous prévoyez de récupérer l'espace de travail depuis **Recently deleted** dans le portail Azure.

    Quels sont les deux éléments qui seront de nouveau disponibles après la récupération sans avoir à les recréer ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The registered models", fr: "Les modèles inscrits" } }
    - { id: b, text: { en: "The compute clusters", fr: "Les clusters de calcul" } }
    - { id: c, text: { en: "The jobs that were queued at deletion time", fr: "Les travaux qui étaient en file d'attente au moment de la suppression" } }
    - { id: d, text: { en: "The managed online endpoints", fr: "Les points de terminaison en ligne managés" } }
    - { id: e, text: { en: "The datastores", fr: "Les magasins de données" } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      Soft delete keeps run history, models, data, environments, components, notebooks, pipelines and datastores, so they come back with the workspace. Compute instances and clusters, inference endpoints, queued or running jobs and the internal cache are hard-deleted and must be recreated or resubmitted.
    fr: |
      La suppression réversible conserve l'historique des exécutions, les modèles, les données, les environnements, les composants, les notebooks, les pipelines et les magasins de données : ils reviennent avec l'espace de travail. Les instances et clusters de calcul, les points de terminaison d'inférence, les travaux en file d'attente ou en cours et le cache interne sont supprimés définitivement et doivent être recréés ou soumis de nouveau.
  options:
    b: { en: "Compute clusters are hard-deleted when the workspace is soft-deleted; you recreate them manually.", fr: "Les clusters de calcul sont supprimés définitivement lors de la suppression réversible ; vous les recréez manuellement." }
    d: { en: "Inference endpoints are hard-deleted and aren't recovered.", fr: "Les points de terminaison d'inférence sont supprimés définitivement et ne sont pas récupérés." }
    c: { en: "Queued and running jobs are hard-deleted; you must submit them again.", fr: "Les travaux en file d'attente et en cours sont supprimés définitivement ; vous devez les soumettre de nouveau." }
references:
  - title: Workspace soft deletion - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-soft-delete
