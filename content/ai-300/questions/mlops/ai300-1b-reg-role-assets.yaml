id: ai300-1b-reg-role-assets
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Machine Learning registry named **fabrikam_registry** in a resource group named **rg-ml-shared**.

    The members of the platform team must be able to create and delete models, environments and components in fabrikam_registry. They must not be able to update or delete the registry itself. The solution must use a built-in role and follow the principle of least privilege.

    Which role should you assign to the team on fabrikam_registry?
  fr: |
    Fabrikam dispose d'un registre Azure Machine Learning nommé **fabrikam_registry** dans un groupe de ressources nommé **rg-ml-shared**.

    Les membres de l'équipe plateforme doivent pouvoir créer et supprimer des modèles, des environnements et des composants dans fabrikam_registry. Ils ne doivent pas pouvoir mettre à jour ni supprimer le registre lui-même. La solution doit utiliser un rôle intégré et respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à l'équipe sur fabrikam_registry ?
body:
  options:
    - { id: a, text: Contributor }
    - { id: b, text: AzureML Registry User }
    - { id: c, text: Reader }
    - { id: d, text: AzureML Data Scientist }
answer: { optionId: b }
explanation:
  correct:
    en: |
      AzureML Registry User grants `registries/read` and `registries/assets/*`, so its members can perform every action on registry assets, including create and delete, without the `registries/write` and `registries/delete` actions that manage the registry resource.
    fr: |
      AzureML Registry User accorde `registries/read` et `registries/assets/*` : ses membres peuvent effectuer toutes les actions sur les actifs du registre, y compris les créer et les supprimer, sans les actions `registries/write` et `registries/delete` qui gèrent la ressource registre.
  options:
    a:
      en: |
        Contributor also allows users to update and delete the registry, which the requirement forbids.
      fr: |
        Contributor permet aussi de mettre à jour et de supprimer le registre, ce que l'exigence interdit.
    c:
      en: |
        Reader only allows users to browse and use registry assets; it doesn't allow creating or deleting them.
      fr: |
        Reader permet seulement de parcourir et d'utiliser les actifs du registre ; il ne permet pas de les créer ni de les supprimer.
    d:
      en: |
        AzureML Data Scientist grants actions inside a workspace, not actions on registry assets.
      fr: |
        AzureML Data Scientist accorde des actions à l'intérieur d'un espace de travail, pas des actions sur les actifs d'un registre.
references:
  - title: Azure built-in roles for AI + machine learning
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/ai-machine-learning
  - title: Create and manage registries
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-registries
