id: ai300-1a-ds-adls-nosecret
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware has an Azure Data Lake Storage Gen2 account named **stproselake** with a file system named **curated**, and an Azure Machine Learning workspace named **mlw-proseware**. Training jobs run on a compute cluster named **cpu-train** that has a system-assigned managed identity. The job definitions don't set an `identity` property, and the jobs only read the data.

    You need to create a datastore for the curated file system. No secret must be stored in the workspace, and the solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Proseware dispose d'un compte Azure Data Lake Storage Gen2 nommé **stproselake** avec un système de fichiers nommé **curated**, et d'un espace de travail Azure Machine Learning nommé **mlw-proseware**. Les travaux d'entraînement s'exécutent sur un cluster de calcul nommé **cpu-train** qui a une identité managée affectée par le système. Les définitions des travaux ne définissent pas de propriété `identity`, et les travaux ne font que lire les données.

    Vous devez créer un magasin de données pour le système de fichiers curated. Aucun secret ne doit être stocké dans l'espace de travail, et la solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an `azure_data_lake_gen2` datastore without a `credentials` section, and assign Storage Blob Data Reader to the managed identity of cpu-train.", fr: "Créer un magasin de données `azure_data_lake_gen2` sans section `credentials`, et attribuer Storage Blob Data Reader à l'identité managée de cpu-train." } }
    - { id: b, text: { en: "Create an `azure_data_lake_gen2` datastore with service principal credentials, and assign Storage Blob Data Reader to the service principal.", fr: "Créer un magasin de données `azure_data_lake_gen2` avec les informations d'identification d'un principal de service, et attribuer Storage Blob Data Reader au principal de service." } }
    - { id: c, text: { en: "Create an `azure_data_lake_gen2` datastore without a `credentials` section, and assign Storage Blob Data Contributor to the managed identity of cpu-train.", fr: "Créer un magasin de données `azure_data_lake_gen2` sans section `credentials`, et attribuer Storage Blob Data Contributor à l'identité managée de cpu-train." } }
    - { id: d, text: { en: "Create an `azure_data_lake_gen2` datastore without a `credentials` section, and assign Reader on stproselake to the managed identity of cpu-train.", fr: "Créer un magasin de données `azure_data_lake_gen2` sans section `credentials`, et attribuer Reader sur stproselake à l'identité managée de cpu-train." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A datastore without a `credentials` section is identity-based: only the storage account information is saved. When a job doesn't set `identity`, the compute managed identity accesses the data, and it needs at least Storage Blob Data Reader on the storage account, which is enough for read-only jobs.
    fr: |
      Un magasin de données sans section `credentials` est basé sur l'identité : seules les informations du compte de stockage sont enregistrées. Quand un travail ne définit pas `identity`, c'est l'identité managée du calcul qui accède aux données, et elle a besoin au minimum de Storage Blob Data Reader sur le compte de stockage, ce qui suffit pour des travaux en lecture seule.
  options:
    c: { en: "Storage Blob Data Contributor also grants write and delete access, which the read-only jobs don't need.", fr: "Storage Blob Data Contributor accorde aussi l'écriture et la suppression, dont les travaux en lecture seule n'ont pas besoin." }
    b: { en: "Service principal credentials, including the client secret, are stored in the workspace key vault.", fr: "Les informations d'identification du principal de service, dont le secret client, sont stockées dans le coffre de clés de l'espace de travail." }
    d: { en: "Reader is a control-plane role; it doesn't grant access to the data in the file system.", fr: "Reader est un rôle du plan de contrôle ; il ne donne pas accès aux données du système de fichiers." }
references:
  - title: Set up service authentication - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-identity-based-service-authentication
  - title: CLI (v2) Azure Data Lake Gen2 datastore YAML schema - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-datastore-data-lake-gen2
