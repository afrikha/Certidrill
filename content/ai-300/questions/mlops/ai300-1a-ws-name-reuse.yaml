id: ai300-1a-ws-name-reuse
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Yesterday, an engineer at Tailspin deleted the Azure Machine Learning workspace **mlw-tailspin-test** from the Azure portal by using the default options. The workspace was used only for automated tests, and its data is no longer needed.

    Today, you must create a new workspace named **mlw-tailspin-test** in the same resource group so that the test pipelines keep working without changes.

    What should you do?
  fr: |
    Hier, un ingénieur de Tailspin a supprimé l'espace de travail Azure Machine Learning **mlw-tailspin-test** depuis le portail Azure en utilisant les options par défaut. L'espace de travail servait uniquement aux tests automatisés, et ses données ne sont plus nécessaires.

    Aujourd'hui, vous devez créer un nouvel espace de travail nommé **mlw-tailspin-test** dans le même groupe de ressources pour que les pipelines de test continuent de fonctionner sans modification.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Permanently delete the soft-deleted workspace, and then create the new workspace.", fr: "Supprimer définitivement l'espace de travail en suppression réversible, puis créer le nouvel espace de travail." } }
    - { id: b, text: { en: "Recover the soft-deleted workspace, and then rename it to free the name.", fr: "Récupérer l'espace de travail en suppression réversible, puis le renommer pour libérer le nom." } }
    - { id: c, text: { en: "Create the new workspace from a YAML file that references the old storage account and key vault.", fr: "Créer le nouvel espace de travail à partir d'un fichier YAML qui référence l'ancien compte de stockage et l'ancien coffre de clés." } }
    - { id: d, text: { en: "Wait for the 7-day retention period to end, and then create the new workspace.", fr: "Attendre la fin de la période de rétention de 7 jours, puis créer le nouvel espace de travail." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      By default, deleting a workspace soft-deletes it, and its name can't be reused until the retention period ends or the workspace is permanently deleted. During the retention period you can either recover or permanently delete it; permanent deletion frees the name immediately.
    fr: |
      Par défaut, supprimer un espace de travail le place en suppression réversible, et son nom ne peut pas être réutilisé avant la fin de la période de rétention ou la suppression définitive de l'espace de travail. Pendant la rétention, vous pouvez le récupérer ou le supprimer définitivement ; la suppression définitive libère le nom immédiatement.
  options:
    b: { en: "A workspace can't be renamed, so recovering it keeps the name in use.", fr: "Un espace de travail ne peut pas être renommé : le récupérer laisse le nom occupé." }
    c: { en: "Reusing the associated resources doesn't free the name held by the soft-deleted workspace.", fr: "Réutiliser les ressources associées ne libère pas le nom conservé par l'espace de travail en suppression réversible." }
    d: { en: "The default retention period is 14 days, and waiting doesn't meet the requirement to create the workspace today.", fr: "La période de rétention par défaut est de 14 jours, et attendre ne permet pas de créer l'espace de travail aujourd'hui." }
references:
  - title: Workspace soft deletion - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-soft-delete
