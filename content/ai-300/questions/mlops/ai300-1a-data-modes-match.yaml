id: ai300-1a-data-modes-match
objective: "1.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum is writing four Azure Machine Learning command jobs that use `uri_folder` inputs and outputs. Each job has a different requirement for how its data is delivered.

    Which mode should you set for each requirement? To answer, drag the appropriate modes to the correct requirements. Each mode may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum écrit quatre travaux de commande Azure Machine Learning qui utilisent des entrées et sorties `uri_folder`. Chaque travail a une exigence différente sur la façon dont ses données sont livrées.

    Quel mode devez-vous définir pour chaque exigence ? Pour répondre, faites glisser les modes appropriés vers les exigences correspondantes. Chaque mode peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ro, text: ro_mount }
    - { id: rw, text: rw_mount }
    - { id: dl, text: download }
    - { id: up, text: upload }
    - { id: direct, text: direct }
    - { id: evalm, text: eval_mount }
  targets:
    - id: copy
      text: { en: "Input: copy all the files to the local disk of the compute before the script starts", fr: "Entrée : copier tous les fichiers sur le disque local du calcul avant le démarrage du script" }
    - id: spark
      text: { en: "Input: pass the storage URI as a string to code that reads the data itself", fr: "Entrée : transmettre l'URI de stockage sous forme de chaîne à du code qui lit lui-même les données" }
    - id: mount
      text: { en: "Input: mount a large folder read-only instead of copying it", fr: "Entrée : monter un dossier volumineux en lecture seule au lieu de le copier" }
    - id: writedirect
      text: { en: "Output: write the files directly to a mounted storage folder while the job runs", fr: "Sortie : écrire les fichiers directement dans un dossier de stockage monté pendant l'exécution du travail" }
answer:
  mapping: { copy: dl, spark: direct, mount: ro, writedirect: rw }
explanation:
  correct:
    en: |
      `download` copies input data to the compute, `direct` passes the URI as a string, and `ro_mount` mounts the storage location read-only. For outputs, `rw_mount` mounts the destination so the job writes to it directly, whereas `upload` copies the files at the end of the job.
    fr: |
      `download` copie les données d'entrée sur le calcul, `direct` transmet l'URI sous forme de chaîne, et `ro_mount` monte l'emplacement de stockage en lecture seule. Pour les sorties, `rw_mount` monte la destination pour que le travail y écrive directement, tandis que `upload` copie les fichiers à la fin du travail.
  options:
    up: { en: "`upload` copies output files at the end of the job, not while it runs.", fr: "`upload` copie les fichiers de sortie à la fin du travail, pas pendant son exécution." }
    evalm: { en: "`eval_mount` is available only for `mltable` inputs.", fr: "`eval_mount` n'est disponible que pour les entrées `mltable`." }
references:
  - title: Access data in a job - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-read-write-data-v2
