id: ai300-1a-env-curated-ref
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are writing a command job for the Azure Machine Learning workspace **mlw-litware**. The workspace has no registered environment named sklearn-1.5.

    The job must run in the latest version of the curated scikit-learn 1.5 environment that Microsoft maintains, without creating a custom environment.

    Which `environment` value should you use in the job YAML?
  fr: |
    Vous écrivez un travail de commande pour l'espace de travail Azure Machine Learning **mlw-litware**. L'espace de travail ne contient aucun environnement inscrit nommé sklearn-1.5.

    Le travail doit s'exécuter dans la dernière version de l'environnement organisé scikit-learn 1.5 que Microsoft maintient, sans créer d'environnement personnalisé.

    Quelle valeur `environment` devez-vous utiliser dans le fichier YAML du travail ?
body:
  options:
    - { id: a, text: "`azureml:sklearn-1.5@latest`" }
    - { id: b, text: "`azureml://registries/azureml/environments/sklearn-1.5/labels/latest`" }
    - { id: c, text: "`azureml://registries/azureml/environments/sklearn-1.5/versions/latest`" }
    - { id: d, text: "`azureml://datastores/azureml/paths/environments/sklearn-1.5`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Curated environments are hosted in the `azureml` system registry. You reference the latest version with the `labels/latest` form of the registry URI, or a specific version with `versions/<version-number>`.
    fr: |
      Les environnements organisés sont hébergés dans le registre système `azureml`. Vous référencez la dernière version avec la forme `labels/latest` de l'URI du registre, ou une version précise avec `versions/<numéro-de-version>`.
  options:
    a: { en: "`azureml:<name>@latest` references an environment registered in the workspace, and the workspace has none with this name.", fr: "`azureml:<nom>@latest` référence un environnement inscrit dans l'espace de travail, et l'espace de travail n'en a aucun de ce nom." }
    c: { en: "`versions/` expects a version number; `latest` is a label.", fr: "`versions/` attend un numéro de version ; `latest` est un label." }
    d: { en: "A datastore URI references data, not an environment.", fr: "Un URI de magasin de données référence des données, pas un environnement." }
references:
  - title: Manage Azure Machine Learning environments with the CLI & SDK (v2) - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-environments-v2
