id: ai300-1a-env-facts
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware manages custom environments in the Azure Machine Learning workspace **mlw-proseware**. The environment **churn-env** has three versions, and all of them are archived.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware gère des environnements personnalisés dans l'espace de travail Azure Machine Learning **mlw-proseware**. L'environnement **churn-env** a trois versions, toutes archivées.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A data scientist can register a custom environment named Microsoft-churn-env and use it in jobs.
        fr: |
          Un data scientist peut inscrire un environnement personnalisé nommé Microsoft-churn-env et l'utiliser dans des travaux.
    - id: s2
      text:
        en: |
          Changing only the order of the packages in the conda file of an environment results in a new image build.
        fr: |
          Changer uniquement l'ordre des packages dans le fichier conda d'un environnement entraîne une nouvelle construction d'image.
    - id: s3
      text:
        en: |
          If you create version 4 of churn-env, version 4 is archived automatically.
        fr: |
          Si vous créez la version 4 de churn-env, la version 4 est archivée automatiquement.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The prefixes `AzureML-` and `Microsoft` are reserved for curated environments, and a job submission fails if the environment name starts with either of them. The image hash depends on the base image, Docker steps and packages, and changing the order of dependencies or channels changes the hash. A new version created under an archived environment container is automatically archived as well.
    fr: |
      Les préfixes `AzureML-` et `Microsoft` sont réservés aux environnements organisés, et la soumission d'un travail échoue si le nom de l'environnement commence par l'un d'eux. Le hachage de l'image dépend de l'image de base, des étapes Docker et des packages, et changer l'ordre des dépendances ou des canaux modifie le hachage. Une nouvelle version créée sous un conteneur d'environnement archivé est automatiquement archivée elle aussi.
references:
  - title: About Azure Machine Learning environments - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-environments
  - title: Manage Azure Machine Learning environments with the CLI & SDK (v2) - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-environments-v2
