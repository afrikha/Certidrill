id: ai300-1a-iam-selfservice-compute
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Ana is a data scientist at Adatum. She must run experiments in the Azure Machine Learning workspace **mlw-adatum** and create, scale and delete her own compute clusters in a self-service manner.

    Ana must not be able to modify the workspace settings or manage role assignments. The solution must follow the principle of least privilege.

    Which two roles should you assign to Ana on mlw-adatum? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Ana est data scientist chez Adatum. Elle doit exécuter des expériences dans l'espace de travail Azure Machine Learning **mlw-adatum** et créer, mettre à l'échelle et supprimer ses propres clusters de calcul en libre-service.

    Ana ne doit pas pouvoir modifier les paramètres de l'espace de travail ni gérer les attributions de rôles. La solution doit respecter le principe du moindre privilège.

    Quels sont les deux rôles que vous devez attribuer à Ana sur mlw-adatum ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: AzureML Data Scientist }
    - { id: b, text: Contributor }
    - { id: c, text: AzureML Compute Operator }
    - { id: d, text: Owner }
    - { id: e, text: Reader }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Roles are additive. AzureML Data Scientist allows all actions in the workspace except creating or deleting compute and modifying the workspace, and AzureML Compute Operator allows creating, managing and deleting compute. Together they let Ana run experiments and manage her compute without any workspace or access management rights.
    fr: |
      Les rôles se cumulent. AzureML Data Scientist autorise toutes les actions dans l'espace de travail, sauf créer ou supprimer du calcul et modifier l'espace de travail, et AzureML Compute Operator permet de créer, gérer et supprimer du calcul. Ensemble, ils permettent à Ana d'exécuter des expériences et de gérer son calcul sans droit de gestion de l'espace de travail ni des accès.
  options:
    b: { en: "Contributor would also let Ana modify the workspace and its other resources.", fr: "Contributor permettrait aussi à Ana de modifier l'espace de travail et ses autres ressources." }
    d: { en: "Owner includes role assignments, which Ana must not manage.", fr: "Owner inclut les attributions de rôles, qu'Ana ne doit pas gérer." }
    e: { en: "Reader is read-only, so Ana couldn't run experiments or create compute.", fr: "Reader est en lecture seule : Ana ne pourrait ni exécuter d'expériences ni créer de calcul." }
references:
  - title: Manage roles in your workspace - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-assign-roles
