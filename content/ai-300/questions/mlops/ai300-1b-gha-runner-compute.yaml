id: ai300-1b-gha-runner-compute
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Machine Learning workspace named **mlw-fabrikam** that allows public network access. It contains a compute cluster named **cpu-cluster** with a minimum of 0 nodes. A pipeline job file named **pipeline.yml** sets `compute: azureml:cpu-cluster` for every step.

    A GitHub Actions workflow contains the following job.

    ```yaml
    jobs:
      train:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: azure/login@v2
            with:
              client-id: ${{ secrets.AZURE_CLIENT_ID }}
              tenant-id: ${{ secrets.AZURE_TENANT_ID }}
              subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          - run: az extension add -n ml -y
          - run: az ml job create --file pipeline.yml -w mlw-fabrikam -g rg-ml-fabrikam
    ```

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un espace de travail Azure Machine Learning nommé **mlw-fabrikam** qui autorise l'accès réseau public. Il contient un cluster de calcul nommé **cpu-cluster** avec un minimum de 0 nœud. Un fichier de travail de pipeline nommé **pipeline.yml** définit `compute: azureml:cpu-cluster` pour chaque étape.

    Un workflow GitHub Actions contient le travail suivant.

    ```yaml
    jobs:
      train:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: azure/login@v2
            with:
              client-id: ${{ secrets.AZURE_CLIENT_ID }}
              tenant-id: ${{ secrets.AZURE_TENANT_ID }}
              subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          - run: az extension add -n ml -y
          - run: az ml job create --file pipeline.yml -w mlw-fabrikam -g rg-ml-fabrikam
    ```

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "The pipeline steps run on the ubuntu-latest runner.", fr: "Les étapes du pipeline s'exécutent sur l'exécuteur ubuntu-latest." }
    - id: b
      text: { en: "The az ml job create command runs on the ubuntu-latest runner.", fr: "La commande az ml job create s'exécute sur l'exécuteur ubuntu-latest." }
    - id: c
      text: { en: "The pipeline steps run on cpu-cluster in mlw-fabrikam.", fr: "Les étapes du pipeline s'exécutent sur cpu-cluster dans mlw-fabrikam." }
    - id: d
      text: { en: "The runner must be connected to a virtual network that has a private endpoint to mlw-fabrikam.", fr: "L'exécuteur doit être connecté à un réseau virtuel doté d'un point de terminaison privé vers mlw-fabrikam." }
    - id: e
      text: { en: "The job submission fails because cpu-cluster has no running node.", fr: "La soumission du travail échoue car cpu-cluster n'a aucun nœud en cours d'exécution." }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      The GitHub runner only executes the workflow steps, including the Azure CLI command that submits the pipeline. The Azure Machine Learning pipeline itself runs in the workspace, on the compute named in the job file. A GitHub Actions workflow and a machine learning pipeline are two different things.
    fr: |
      L'exécuteur GitHub n'exécute que les étapes du workflow, y compris la commande Azure CLI qui soumet le pipeline. Le pipeline Azure Machine Learning lui-même s'exécute dans l'espace de travail, sur le calcul indiqué dans le fichier de travail. Un workflow GitHub Actions et un pipeline de machine learning sont deux choses différentes.
  options:
    a:
      en: |
        The steps run on the compute set in pipeline.yml, not on the GitHub runner.
      fr: |
        Les étapes s'exécutent sur le calcul défini dans pipeline.yml, pas sur l'exécuteur GitHub.
    d:
      en: |
        The workspace allows public network access, so a GitHub-hosted runner can reach it without a private endpoint.
      fr: |
        L'espace de travail autorise l'accès réseau public : un exécuteur hébergé par GitHub peut l'atteindre sans point de terminaison privé.
    e:
      en: |
        A cluster with a minimum of 0 nodes deallocates idle nodes and scales out when a job is submitted.
      fr: |
        Un cluster avec un minimum de 0 nœud libère les nœuds inactifs et monte en charge quand un travail est soumis.
references:
  - title: GitHub Actions for CI/CD
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-github-actions-machine-learning
  - title: Create compute clusters
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-attach-compute-cluster
