id: ai300-1a-cmp-cluster-facts
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an Azure Machine Learning workspace named **mlw-tailspin** in the resource group **rg-tailspin-ml**. The workspace contains a compute cluster named **cpu-train** that uses the `low_priority` tier, Standard_DS3_v2 nodes, `min_instances: 0` and `max_instances: 6`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un espace de travail Azure Machine Learning nommé **mlw-tailspin** dans le groupe de ressources **rg-tailspin-ml**. L'espace de travail contient un cluster de calcul nommé **cpu-train** qui utilise le niveau `low_priority`, des nœuds Standard_DS3_v2, `min_instances: 0` et `max_instances: 6`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can switch cpu-train to Standard_E8s_v3 nodes by running `az ml compute update --name cpu-train` with a size parameter.
        fr: |
          Vous pouvez faire passer cpu-train à des nœuds Standard_E8s_v3 en exécutant `az ml compute update --name cpu-train` avec un paramètre de taille.
    - id: s2
      text:
        en: |
          If a node of cpu-train is preempted while a job runs on it, the job must be restarted.
        fr: |
          Si un nœud de cpu-train est préempté pendant qu'un travail s'y exécute, le travail doit être redémarré.
    - id: s3
      text:
        en: |
          A delete lock on rg-tailspin-ml can prevent cpu-train from scaling.
        fr: |
          Un verrou de suppression sur rg-tailspin-ml peut empêcher cpu-train de se mettre à l'échelle.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      `az ml compute update` changes only the tags, the minimum and maximum node counts, the idle time before scale-down and the identity of a cluster; to use another VM size, you create a new cluster. Low-priority nodes have no guaranteed availability, so a preempted job must be restarted. Resource locks on the resource group that contains the workspace block the scaling operations of compute clusters.
    fr: |
      `az ml compute update` ne modifie que les étiquettes, le nombre minimal et maximal de nœuds, le délai d'inactivité avant réduction et l'identité d'un cluster ; pour utiliser une autre taille de machine virtuelle, vous créez un nouveau cluster. Les nœuds de basse priorité n'ont pas de disponibilité garantie : un travail préempté doit être redémarré. Les verrous de ressource sur le groupe de ressources qui contient l'espace de travail bloquent les opérations de mise à l'échelle des clusters de calcul.
references:
  - title: Create compute clusters - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-attach-compute-cluster
  - title: az ml compute
    url: https://learn.microsoft.com/en-us/cli/azure/ml/compute
