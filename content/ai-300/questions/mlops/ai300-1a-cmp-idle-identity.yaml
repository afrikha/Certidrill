id: ai300-1a-cmp-idle-identity
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Ben has a compute instance named **ci-ben** in the Azure Machine Learning workspace **mlw-litware**. Idle shutdown is set to 60 minutes, and no schedule is configured. ci-ben has a user-assigned managed identity that Ben's notebooks use to read secrets from a key vault; the identity has no role on the workspace.

    Each evening, Ben closes all kernels, terminals and VS Code sessions, but ci-ben keeps running all night. You need ci-ben to stop after 60 minutes of inactivity. The notebooks must keep using the managed identity.

    What should you do?
  fr: |
    Ben dispose d'une instance de calcul nommée **ci-ben** dans l'espace de travail Azure Machine Learning **mlw-litware**. L'arrêt en cas d'inactivité est défini sur 60 minutes, et aucune planification n'est configurée. ci-ben possède une identité managée affectée par l'utilisateur que les notebooks de Ben utilisent pour lire des secrets dans un coffre de clés ; l'identité n'a aucun rôle sur l'espace de travail.

    Chaque soir, Ben ferme tous les noyaux, terminaux et sessions VS Code, mais ci-ben continue de fonctionner toute la nuit. Vous devez faire en sorte que ci-ben s'arrête après 60 minutes d'inactivité. Les notebooks doivent continuer à utiliser l'identité managée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Contributor role on mlw-litware to the managed identity of ci-ben.", fr: "Attribuer le rôle Contributor sur mlw-litware à l'identité managée de ci-ben." } }
    - { id: b, text: { en: "Reduce the idle shutdown setting of ci-ben to 15 minutes.", fr: "Réduire le paramètre d'arrêt en cas d'inactivité de ci-ben à 15 minutes." } }
    - { id: c, text: { en: "Replace the user-assigned identity of ci-ben with a system-assigned identity.", fr: "Remplacer l'identité affectée par l'utilisateur de ci-ben par une identité affectée par le système." } }
    - { id: d, text: { en: "Assign the AzureML Compute Operator role on mlw-litware to Ben.", fr: "Attribuer le rôle AzureML Compute Operator sur mlw-litware à Ben." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When a managed identity is assigned to a compute instance, the instance doesn't shut down because of inactivity unless that managed identity has Contributor access to the workspace. Granting the role enables idle shutdown while the notebooks keep using the identity.
    fr: |
      Quand une identité managée est affectée à une instance de calcul, l'instance ne s'arrête pas pour cause d'inactivité, sauf si cette identité managée dispose de l'accès Contributor à l'espace de travail. Attribuer ce rôle permet l'arrêt en cas d'inactivité, tandis que les notebooks continuent d'utiliser l'identité.
  options:
    b: { en: "A shorter idle period doesn't help: the instance doesn't stop for inactivity until its identity has Contributor on the workspace.", fr: "Une durée d'inactivité plus courte n'aide pas : l'instance ne s'arrête pas pour inactivité tant que son identité n'a pas Contributor sur l'espace de travail." }
    c: { en: "The requirement applies to any managed identity assigned to the instance, so a system-assigned identity still needs Contributor.", fr: "L'exigence s'applique à toute identité managée affectée à l'instance : une identité affectée par le système a aussi besoin de Contributor." }
    d: { en: "Ben's role doesn't change the idle shutdown behavior, which depends on the identity of the instance.", fr: "Le rôle de Ben ne change pas le comportement d'arrêt en cas d'inactivité, qui dépend de l'identité de l'instance." }
references:
  - title: Create a compute instance - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-compute-instance
