id: ai300-1b-iac-bicep-cluster
objective: "1.3.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    A Bicep file deploys an Azure Machine Learning workspace with the symbolic name `workspace`. You are adding a compute target for training jobs that must meet the following requirements:

    - It must scale out to four nodes and release all the nodes when no job is running.
    - It must use the cheapest VM priority, because the jobs can be restarted if a node is preempted.
    - The nodes must not have public IP addresses.

    How should you complete the resource? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un fichier Bicep déploie un espace de travail Azure Machine Learning de nom symbolique `workspace`. Vous ajoutez une cible de calcul pour des travaux d'entraînement qui doit respecter les exigences suivantes :

    - elle doit monter jusqu'à quatre nœuds et libérer tous les nœuds quand aucun travail ne s'exécute ;
    - elle doit utiliser la priorité de machine virtuelle la moins chère, car les travaux peuvent être redémarrés si un nœud est préempté ;
    - les nœuds ne doivent pas avoir d'adresse IP publique.

    Comment devez-vous compléter la ressource ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    resource cluster 'Microsoft.MachineLearningServices/workspaces/computes@2026-05-01' = {
      parent: workspace
      name: 'cpu-cluster'
      location: location
      properties: {
        computeType: [[ctype]]
        properties: {
          vmSize: 'STANDARD_DS3_V2'
          vmPriority: [[prio]]
          enableNodePublicIp: [[pip]]
          scaleSettings: {
            minNodeCount: [[min]]
            maxNodeCount: 4
          }
        }
      }
    }
  slots:
    - id: ctype
      options:
        - { id: ci, text: "'ComputeInstance'" }
        - { id: aml, text: "'AmlCompute'" }
        - { id: k8s, text: "'Kubernetes'" }
    - id: prio
      options:
        - { id: low, text: "'LowPriority'" }
        - { id: lowsnake, text: "'low_priority'" }
        - { id: ded, text: "'Dedicated'" }
    - id: pip
      options:
        - { id: t, text: "true" }
        - { id: f, text: "false" }
    - id: min
      options:
        - { id: m0, text: "0" }
        - { id: m1, text: "1" }
        - { id: m4, text: "4" }
answer:
  values: { ctype: aml, prio: low, pip: f, min: m0 }
explanation:
  correct:
    en: |
      A compute cluster is the `AmlCompute` compute type, whose `scaleSettings` require `maxNodeCount`. A `minNodeCount` of 0 lets Azure Machine Learning deallocate every node when no job runs. `vmPriority` takes `'Dedicated'` or `'LowPriority'`; low-priority VMs cost less but can be preempted. `enableNodePublicIp: false` provisions nodes without public IP addresses.
    fr: |
      Un cluster de calcul correspond au type de calcul `AmlCompute`, dont les `scaleSettings` exigent `maxNodeCount`. Un `minNodeCount` de 0 permet à Azure Machine Learning de libérer tous les nœuds quand aucun travail ne s'exécute. `vmPriority` accepte `'Dedicated'` ou `'LowPriority'` ; les machines virtuelles de faible priorité coûtent moins cher mais peuvent être préemptées. `enableNodePublicIp: false` provisionne des nœuds sans adresse IP publique.
  options:
    ci: { en: "A compute instance is a single-node workstation; it doesn't scale out to four nodes.", fr: "Une instance de calcul est une station de travail à nœud unique ; elle ne monte pas jusqu'à quatre nœuds." }
    k8s: { en: "Kubernetes attaches an existing cluster; it isn't a managed cluster with scaleSettings.", fr: "Kubernetes attache un cluster existant ; ce n'est pas un cluster managé avec des scaleSettings." }
    lowsnake: { en: "low_priority is the CLI YAML value (tier); Bicep uses 'LowPriority'.", fr: "low_priority est la valeur YAML de la CLI (tier) ; Bicep utilise 'LowPriority'." }
    ded: { en: "Dedicated VMs cost more than low-priority VMs.", fr: "Les machines virtuelles dédiées coûtent plus cher que celles de faible priorité." }
    t: { en: "true provisions public IP addresses on the nodes.", fr: "true provisionne des adresses IP publiques sur les nœuds." }
    m1: { en: "Any minimum above 0 keeps that number of nodes running even when idle.", fr: "Tout minimum supérieur à 0 maintient ce nombre de nœuds en fonctionnement même au repos." }
    m4: { en: "A minimum of 4 keeps all four nodes running permanently.", fr: "Un minimum de 4 maintient les quatre nœuds en fonctionnement en permanence." }
references:
  - title: Microsoft.MachineLearningServices/workspaces/computes
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.machinelearningservices/workspaces/computes
  - title: Create compute clusters
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-attach-compute-cluster
