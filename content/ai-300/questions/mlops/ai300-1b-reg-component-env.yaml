id: ai300-1b-reg-component-env
objective: "1.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Machine Learning workspace named **mlw-dev** and a registry named **contoso_ml_registry** in the same region.

    A component file named **train.yml** contains `environment: azureml:churn-env:3`. The environment churn-env version 3 exists only in mlw-dev. When you run `az ml component create --file train.yml --registry-name contoso_ml_registry`, the command fails.

    You need to create the component in contoso_ml_registry.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Azure Machine Learning nommé **mlw-dev** et d'un registre nommé **contoso_ml_registry** dans la même région.

    Un fichier de composant nommé **train.yml** contient `environment: azureml:churn-env:3`. La version 3 de l'environnement churn-env n'existe que dans mlw-dev. Quand vous exécutez `az ml component create --file train.yml --registry-name contoso_ml_registry`, la commande échoue.

    Vous devez créer le composant dans contoso_ml_registry.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Create churn-env in the registry from its YAML file, then reference the registry environment URI in train.yml.", fr: "Créer churn-env dans le registre à partir de son fichier YAML, puis référencer l'URI de l'environnement du registre dans train.yml." }
    - id: b
      text: { en: "Create the component in mlw-dev, then share the component from mlw-dev to the registry.", fr: "Créer le composant dans mlw-dev, puis partager le composant de mlw-dev vers le registre." }
    - id: c
      text: { en: "Share churn-env version 3 from mlw-dev to the registry, then reference the registry environment URI in train.yml.", fr: "Partager la version 3 de churn-env de mlw-dev vers le registre, puis référencer l'URI de l'environnement du registre dans train.yml." }
    - id: d
      text: { en: "Assign the AzureML Registry User role on the registry to the managed identity of mlw-dev.", fr: "Attribuer le rôle AzureML Registry User sur le registre à l'identité managée de mlw-dev." }
    - id: e
      text: { en: "Add the region of mlw-dev to the replication locations of the registry.", fr: "Ajouter la région de mlw-dev aux emplacements de réplication du registre." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A registry only supports named assets, and an asset in a registry can only reference assets that already exist in the registry. You can either create the environment directly in the registry or share the workspace environment to the registry; in both cases the component must then reference the environment with its `azureml://registries/...` URI.
    fr: |
      Un registre ne prend en charge que des actifs nommés, et un actif d'un registre ne peut référencer que des actifs qui existent déjà dans le registre. Vous pouvez soit créer l'environnement directement dans le registre, soit partager l'environnement de l'espace de travail vers le registre ; dans les deux cas, le composant doit ensuite référencer l'environnement par son URI `azureml://registries/...`.
  options:
    b:
      en: |
        Microsoft Learn states that sharing a component from a workspace to a registry isn't supported.
      fr: |
        Microsoft Learn indique que le partage d'un composant d'un espace de travail vers un registre n'est pas pris en charge.
    d:
      en: |
        The failure comes from a reference to a workspace asset, not from missing permissions; a role assignment doesn't make a workspace environment visible in the registry.
      fr: |
        L'échec vient d'une référence à un actif d'espace de travail, pas d'autorisations manquantes ; une attribution de rôle ne rend pas un environnement d'espace de travail visible dans le registre.
    e:
      en: |
        The workspace and the registry are already in the same region.
      fr: |
        L'espace de travail et le registre sont déjà dans la même région.
references:
  - title: Share models, components, and environments across workspaces with registries
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-share-models-pipelines-across-workspaces-with-registries
  - title: Machine Learning registry network isolation
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-registry-network-isolation
