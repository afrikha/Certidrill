id: ai300-1a-comp-add-input
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a command component named **prep_orders** defined in prep.yml, with its Python code in ./src/prep.py. The team needs a new string input named **region_filter** so that pipelines can choose the region to keep.

    You add region_filter to the `inputs` section of prep.yml. Which two additional changes must you make? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un composant de commande nommé **prep_orders** défini dans prep.yml, dont le code Python se trouve dans ./src/prep.py. L'équipe a besoin d'une nouvelle entrée de type chaîne nommée **region_filter** pour que les pipelines puissent choisir la région à conserver.

    Vous ajoutez region_filter à la section `inputs` de prep.yml. Quelles sont les deux modifications supplémentaires que vous devez apporter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add region_filter to the `settings` section of each pipeline job.", fr: "Ajouter region_filter à la section `settings` de chaque travail de pipeline." } }
    - { id: b, text: { en: "Register a new version of the environment that prep_orders uses.", fr: "Inscrire une nouvelle version de l'environnement utilisé par prep_orders." } }
    - { id: c, text: { en: "Update prep.py to parse the `--region_filter` command-line argument.", fr: "Mettre à jour prep.py pour analyser l'argument de ligne de commande `--region_filter`." } }
    - { id: d, text: { en: "Set `is_deterministic: false` in prep.yml.", fr: "Définir `is_deterministic: false` dans prep.yml." } }
    - { id: e, text: { en: "Add `--region_filter ${{inputs.region_filter}}` to the `command` field of prep.yml.", fr: "Ajouter `--region_filter ${{inputs.region_filter}}` au champ `command` de prep.yml." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      Adding an input to a component takes three edits: the `inputs` section of the component YAML, the `command` field that passes the value with `${{inputs.region_filter}}`, and the source code that handles the new command-line argument.
    fr: |
      Ajouter une entrée à un composant demande trois modifications : la section `inputs` du YAML du composant, le champ `command` qui transmet la valeur avec `${{inputs.region_filter}}`, et le code source qui gère le nouvel argument de ligne de commande.
  options:
    b: { en: "The input doesn't require new packages, so the environment doesn't change.", fr: "L'entrée ne nécessite pas de nouveaux packages : l'environnement ne change pas." }
    d: { en: "Output reuse is unrelated to adding an input; a changed input value already triggers a new run.", fr: "La réutilisation des sorties n'a pas de rapport avec l'ajout d'une entrée ; une valeur d'entrée modifiée déclenche déjà une nouvelle exécution." }
    a: { en: "Pipeline `settings` hold options such as the default compute; step inputs are set under each job's `inputs`.", fr: "Les `settings` du pipeline contiennent des options comme le calcul par défaut ; les entrées d'une étape se définissent sous `inputs` de chaque travail." }
references:
  - title: Create and run component-based ML pipelines (CLI) - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-component-pipelines-cli
