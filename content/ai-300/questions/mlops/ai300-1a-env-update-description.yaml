id: ai300-1a-env-update-description
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Azure Machine Learning workspace **mlw-tailspin** contains an environment named **fraud-env** version 3, which several production deployments reference as `azureml:fraud-env:3`.

    The QA team validated fraud-env version 3. You need to change its description to "Validated by QA". The deployments must keep using version 3, and you must not create a new version.

    What should you do?
  fr: |
    L'espace de travail Azure Machine Learning **mlw-tailspin** contient un environnement nommé **fraud-env** version 3, que plusieurs déploiements de production référencent sous la forme `azureml:fraud-env:3`.

    L'équipe QA a validé la version 3 de fraud-env. Vous devez changer sa description en « Validated by QA ». Les déploiements doivent continuer à utiliser la version 3, et vous ne devez pas créer de nouvelle version.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Register fraud-env version 4 with the new description.", fr: "Inscrire la version 4 de fraud-env avec la nouvelle description." } }
    - { id: b, text: { en: "Archive fraud-env version 3, and then restore it with the new description.", fr: "Archiver la version 3 de fraud-env, puis la restaurer avec la nouvelle description." } }
    - { id: c, text: { en: "Run `az ml environment update --name fraud-env --version 3 --set description=\"Validated by QA\"`.", fr: "Exécuter `az ml environment update --name fraud-env --version 3 --set description=\"Validated by QA\"`." } }
    - { id: d, text: { en: "Run `az ml environment create` with the version 3 YAML file and the new description.", fr: "Exécuter `az ml environment create` avec le fichier YAML de la version 3 et la nouvelle description." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The `description` and `tags` of an environment version can be updated in place with `az ml environment update`. All other properties are immutable, but a description change doesn't affect the image, so the deployments keep using version 3.
    fr: |
      La `description` et les étiquettes (`tags`) d'une version d'environnement peuvent être mises à jour sur place avec `az ml environment update`. Toutes les autres propriétés sont immuables, mais un changement de description n'affecte pas l'image : les déploiements continuent d'utiliser la version 3.
  options:
    a: { en: "A new version is forbidden by the requirements, and it isn't needed for a description change.", fr: "Une nouvelle version est interdite par les exigences, et elle n'est pas nécessaire pour changer une description." }
    b: { en: "Restoring an archived environment doesn't change its properties.", fr: "Restaurer un environnement archivé ne modifie pas ses propriétés." }
    d: { en: "`az ml environment create` registers an environment version; it isn't the command to edit an existing version's description.", fr: "`az ml environment create` inscrit une version d'environnement ; ce n'est pas la commande pour modifier la description d'une version existante." }
references:
  - title: Manage Azure Machine Learning environments with the CLI & SDK (v2) - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-environments-v2
