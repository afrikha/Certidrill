id: ai300-1a-comp-optional-input
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A command component in the Azure Machine Learning workspace **mlw-tailspin** declares an input named **max_epochs** with `type: integer` and `optional: true`. Its command is `python train.py --data ${{inputs.training_data}} --max_epochs ${{inputs.max_epochs}}`.

    Some pipelines don't provide max_epochs, and their train step must then run with the default value defined in train.py. You need to modify the component to meet this requirement. Pipelines that provide max_epochs must keep passing it to the script.

    What should you do?
  fr: |
    Un composant de commande de l'espace de travail Azure Machine Learning **mlw-tailspin** déclare une entrée nommée **max_epochs** avec `type: integer` et `optional: true`. Sa commande est `python train.py --data ${{inputs.training_data}} --max_epochs ${{inputs.max_epochs}}`.

    Certains pipelines ne fournissent pas max_epochs, et leur étape d'entraînement doit alors s'exécuter avec la valeur par défaut définie dans train.py. Vous devez modifier le composant pour répondre à cette exigence. Les pipelines qui fournissent max_epochs doivent continuer à la transmettre au script.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add `default: 0` to the max_epochs input.", fr: "Ajouter `default: 0` à l'entrée max_epochs." } }
    - { id: b, text: { en: "Wrap the argument in the command as `$[[--max_epochs ${{inputs.max_epochs}}]]`.", fr: "Encadrer l'argument dans la commande sous la forme `$[[--max_epochs ${{inputs.max_epochs}}]]`." } }
    - { id: c, text: { en: "Remove `optional: true` from the max_epochs input.", fr: "Supprimer `optional: true` de l'entrée max_epochs." } }
    - { id: d, text: { en: "Set `is_deterministic: false` on the component.", fr: "Définir `is_deterministic: false` sur le composant." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When an input is optional, the part of the command line that uses it must be enclosed in `$[[ ]]`. At runtime, the enclosed part is omitted when no value is provided, so the script falls back to its own default, and it's kept when the pipeline provides max_epochs.
    fr: |
      Quand une entrée est facultative, la partie de la ligne de commande qui l'utilise doit être encadrée par `$[[ ]]`. À l'exécution, cette partie est omise quand aucune valeur n'est fournie, si bien que le script utilise sa propre valeur par défaut, et elle est conservée quand le pipeline fournit max_epochs.
  options:
    a: { en: "A component default would always pass 0 to the script instead of letting train.py use its own default.", fr: "Une valeur par défaut du composant transmettrait toujours 0 au script au lieu de laisser train.py utiliser sa propre valeur par défaut." }
    c: { en: "A required input would force every pipeline to provide max_epochs.", fr: "Une entrée obligatoire forcerait chaque pipeline à fournir max_epochs." }
    d: { en: "`is_deterministic` controls whether previous results are reused; it doesn't change how the command line is built.", fr: "`is_deterministic` contrôle la réutilisation des résultats précédents ; il ne change pas la construction de la ligne de commande." }
references:
  - title: CLI (v2) command component YAML schema - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-component-command
