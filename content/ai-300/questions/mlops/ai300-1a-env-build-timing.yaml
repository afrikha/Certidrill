id: ai300-1a-env-build-timing
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum's data scientists create custom environments in the Azure Machine Learning workspace **mlw-adatum** in different ways. The platform team wants to explain when Azure Machine Learning builds environment images and how it reuses them.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Les data scientists d'Adatum créent des environnements personnalisés dans l'espace de travail Azure Machine Learning **mlw-adatum** de différentes façons. L'équipe plateforme veut expliquer quand Azure Machine Learning construit les images d'environnement et comment il les réutilise.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Archiving an environment version deletes its cached image from the container registry.", fr: "L'archivage d'une version d'environnement supprime son image mise en cache du registre de conteneurs." } }
    - { id: b, text: { en: "Registering an unchanged definition under a new environment name triggers a new image build.", fr: "Inscrire une définition inchangée sous un nouveau nom d'environnement déclenche une nouvelle construction d'image." } }
    - { id: c, text: { en: "An environment defined from a conda file and a base image is built when a job or deployment first uses it.", fr: "Un environnement défini à partir d'un fichier conda et d'une image de base est construit quand un travail ou un déploiement l'utilise pour la première fois." } }
    - { id: d, text: { en: "An environment defined from a Docker build context is built as soon as the environment is created.", fr: "Un environnement défini à partir d'un contexte de build Docker est construit dès la création de l'environnement." } }
    - { id: e, text: { en: "You can extend the image build time limit by configuring the lifetime of the registry token.", fr: "Vous pouvez prolonger la durée limite de construction d'image en configurant la durée de vie du jeton du registre." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      Azure Machine Learning starts building the image from a Docker build context when the environment is created, whereas it builds a conda-plus-image environment when the environment is first used in a job or deployment. Images are cached and reused as long as the definition doesn't change.
    fr: |
      Azure Machine Learning commence à construire l'image d'un contexte de build Docker dès la création de l'environnement, alors qu'il construit un environnement conda plus image lors de sa première utilisation dans un travail ou un déploiement. Les images sont mises en cache et réutilisées tant que la définition ne change pas.
  options:
    b: { en: "The environment name and version have no effect on the image hash, so an unchanged definition reuses the cached image.", fr: "Le nom et la version de l'environnement n'ont aucun effet sur le hachage de l'image : une définition inchangée réutilise l'image mise en cache." }
    a: { en: "Archiving doesn't delete the cached image; you delete it in the container registry if needed.", fr: "L'archivage ne supprime pas l'image mise en cache ; vous la supprimez dans le registre de conteneurs si nécessaire." }
    e: { en: "The token lifetime isn't configurable; it ranges from 60 to 90 minutes.", fr: "La durée de vie du jeton n'est pas configurable ; elle varie de 60 à 90 minutes." }
references:
  - title: Manage Azure Machine Learning environments with the CLI & SDK (v2) - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-environments-v2
  - title: About Azure Machine Learning environments - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-environments
