id: ai300-1a-ds-reader-creds
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Azure Machine Learning workspace **mlw-contoso-fin** has a datastore named **finance_raw** that connects to a blob container by using the storage account key. Jobs that use finance_raw run on a compute cluster whose managed identity already has Storage Blob Data Reader on the storage account.

    An audit team must be able to list and view the assets of the workspace without changing them. The auditors must not be able to retrieve any storage account key through the workspace.

    What should you do?
  fr: |
    L'espace de travail Azure Machine Learning **mlw-contoso-fin** a un magasin de données nommé **finance_raw** qui se connecte à un conteneur blob avec la clé du compte de stockage. Les travaux qui utilisent finance_raw s'exécutent sur un cluster de calcul dont l'identité managée a déjà Storage Blob Data Reader sur le compte de stockage.

    Une équipe d'audit doit pouvoir lister et consulter les actifs de l'espace de travail sans les modifier. Les auditeurs ne doivent pouvoir récupérer aucune clé de compte de stockage par l'intermédiaire de l'espace de travail.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Reader role on the workspace and on the storage account to the audit team.", fr: "Attribuer le rôle Reader sur l'espace de travail et sur le compte de stockage à l'équipe d'audit." } }
    - { id: b, text: { en: "Regenerate the storage account key, and then assign the Reader role on the workspace to the audit team.", fr: "Régénérer la clé du compte de stockage, puis attribuer le rôle Reader sur l'espace de travail à l'équipe d'audit." } }
    - { id: c, text: { en: "Assign the AzureML Data Scientist role on the workspace to the audit team.", fr: "Attribuer le rôle AzureML Data Scientist sur l'espace de travail à l'équipe d'audit." } }
    - { id: d, text: { en: "Recreate finance_raw without a credentials section, and then assign Reader on the workspace to the audit team.", fr: "Recréer finance_raw sans section credentials, puis attribuer Reader sur l'espace de travail à l'équipe d'audit." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Users with the Reader role can view datastore credentials, so Reader alone would expose the account key of finance_raw. An identity-based datastore stores no secret, and the jobs keep working because the cluster managed identity already has Storage Blob Data Reader. Reader then gives the auditors read-only access to the assets.
    fr: |
      Les utilisateurs qui ont le rôle Reader peuvent voir les informations d'identification des magasins de données : Reader seul exposerait la clé de compte de finance_raw. Un magasin de données basé sur l'identité ne stocke aucun secret, et les travaux continuent de fonctionner, car l'identité managée du cluster a déjà Storage Blob Data Reader. Reader donne alors aux auditeurs un accès en lecture seule aux actifs.
  options:
    a: { en: "Workspace Readers can view datastore credentials, including the account key of finance_raw; a role on the storage account doesn't change that.", fr: "Les lecteurs de l'espace de travail peuvent voir les informations d'identification des magasins de données, dont la clé de compte de finance_raw ; un rôle sur le compte de stockage n'y change rien." }
    b: { en: "After regeneration, the datastore stores the new key, which Readers can still view.", fr: "Après la régénération, le magasin de données stocke la nouvelle clé, que les lecteurs peuvent toujours voir." }
    c: { en: "AzureML Data Scientist lets users perform actions in the workspace, which exceeds read-only access, and doesn't hide credentials.", fr: "AzureML Data Scientist permet d'effectuer des actions dans l'espace de travail, ce qui dépasse la lecture seule, et ne masque pas les informations d'identification." }
references:
  - title: Manage roles in your workspace - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-assign-roles
  - title: Set up service authentication - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-identity-based-service-authentication
