id: ai300-1a-ds-blob-wasbs-yaml
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a storage account named **stproseland** with a blob container named **landing**. A legacy data loader requires that the Azure Machine Learning datastore connect to the container by using the `wasbs` protocol. The storage team gave you the account key of stproseland for this datastore.

    You need to create the datastore by running `az ml datastore create --file landing.yml`.

    How should you complete landing.yml? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un compte de stockage nommé **stproseland** avec un conteneur blob nommé **landing**. Un ancien chargeur de données exige que le magasin de données Azure Machine Learning se connecte au conteneur avec le protocole `wasbs`. L'équipe de stockage vous a fourni la clé de compte de stproseland pour ce magasin de données.

    Vous devez créer le magasin de données en exécutant `az ml datastore create --file landing.yml`.

    Comment devez-vous compléter landing.yml ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    $schema: https://azuremlschemas.azureedge.net/latest/azureBlob.schema.json
    name: landing_zone
    type: [[t]]
    account_name: stproseland
    [[c]]: landing
    protocol: [[p]]
    credentials:
      [[k]]: <account-key>
  slots:
    - id: t
      options:
        - { id: blob, text: azure_blob }
        - { id: adls, text: azure_data_lake_gen2 }
        - { id: file, text: azure_file }
    - id: c
      options:
        - { id: fs, text: filesystem }
        - { id: cn, text: container_name }
        - { id: ep, text: endpoint }
    - id: p
      options:
        - { id: https, text: https }
        - { id: abfss, text: abfss }
        - { id: wasbs, text: wasbs }
    - id: k
      options:
        - { id: sas, text: sas_token }
        - { id: key, text: account_key }
        - { id: secret, text: client_secret }
answer:
  values: { t: blob, c: cn, p: wasbs, k: key }
explanation:
  correct:
    en: |
      A blob container datastore has the type `azure_blob` and requires `account_name` and `container_name`. Its `protocol` accepts `https` (the default) or `wasbs`. The `credentials` section of a blob datastore contains either `account_key` or `sas_token`, and the secret is stored in the workspace key vault.
    fr: |
      Un magasin de données de conteneur blob a le type `azure_blob` et exige `account_name` et `container_name`. Sa propriété `protocol` accepte `https` (valeur par défaut) ou `wasbs`. La section `credentials` d'un magasin de données blob contient `account_key` ou `sas_token`, et le secret est stocké dans le coffre de clés de l'espace de travail.
  options:
    adls: { en: "`azure_data_lake_gen2` is for Data Lake Storage Gen2 file systems and uses service principal credentials.", fr: "`azure_data_lake_gen2` sert aux systèmes de fichiers Data Lake Storage Gen2 et utilise un principal de service." }
    fs: { en: "`filesystem` is the key of Data Lake Storage Gen2 datastores.", fr: "`filesystem` est la clé des magasins de données Data Lake Storage Gen2." }
    abfss: { en: "`abfss` is a protocol of Data Lake Storage Gen2 datastores, not blob datastores.", fr: "`abfss` est un protocole des magasins de données Data Lake Storage Gen2, pas des magasins de données blob." }
    sas: { en: "You received an account key, not a SAS token.", fr: "Vous avez reçu une clé de compte, pas un jeton SAS." }
references:
  - title: CLI (v2) Azure Blob datastore YAML schema - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-datastore-blob
