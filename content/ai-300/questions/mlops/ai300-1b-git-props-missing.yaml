id: ai300-1b-git-props-missing
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso submits training jobs from a container-based build agent. The agent downloads the repository as a ZIP archive of the latest commit, installs the Azure CLI and the `ml` extension, and runs `az ml job create --file job.yml`. The job's environment uses a Docker image that includes Git.

    The jobs run successfully, but no `azureml.git.*` properties appear on them. You need the jobs to record the repository, branch and commit.

    What should you do?
  fr: |
    Contoso soumet des travaux d'entraînement depuis un agent de build basé sur un conteneur. L'agent télécharge le dépôt sous forme d'archive ZIP du dernier commit, installe Azure CLI et l'extension `ml`, puis exécute `az ml job create --file job.yml`. L'environnement du travail utilise une image Docker qui inclut Git.

    Les travaux réussissent, mais aucune propriété `azureml.git.*` n'y apparaît. Les travaux doivent enregistrer le dépôt, la branche et le commit.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Install Git in the job's Docker image and rebuild the environment.", fr: "Installer Git dans l'image Docker du travail et régénérer l'environnement." }
    - id: b
      text: { en: "Enable Git tracking in the settings of the workspace.", fr: "Activer le suivi Git dans les paramètres de l'espace de travail." }
    - id: c
      text: { en: "Install Git on the agent and clone the repository instead of downloading the archive.", fr: "Installer Git sur l'agent et cloner le dépôt au lieu de télécharger l'archive." }
    - id: d
      text: { en: "Call mlflow.autolog() at the beginning of the training script.", fr: "Appeler mlflow.autolog() au début du script d'entraînement." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Git information is captured by the CLI or SDK on the machine that submits the job, only if the `git` command is available there and the training files are inside a Git repository. A ZIP archive has no `.git` folder, so the agent must have Git and a real clone.
    fr: |
      Les informations Git sont capturées par la CLI ou le SDK sur la machine qui soumet le travail, à condition que la commande `git` y soit disponible et que les fichiers d'entraînement se trouvent dans un dépôt Git. Une archive ZIP n'a pas de dossier `.git` : l'agent doit disposer de Git et d'un vrai clone.
  options:
    a:
      en: |
        Git in the job's image runs on the compute, after submission; tracking depends on the submitting environment.
      fr: |
        Git dans l'image du travail s'exécute sur le calcul, après la soumission ; le suivi dépend de l'environnement qui soumet le travail.
    b:
      en: |
        Git tracking isn't a workspace setting; it happens automatically when the conditions on the submitting machine are met.
      fr: |
        Le suivi Git n'est pas un paramètre de l'espace de travail ; il a lieu automatiquement quand les conditions sont réunies sur la machine qui soumet le travail.
    d:
      en: |
        MLflow autologging records parameters, metrics and models, not the Git properties of the submitted code.
      fr: |
        La journalisation automatique MLflow enregistre des paramètres, des métriques et des modèles, pas les propriétés Git du code soumis.
references:
  - title: Git integration
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-train-model-git-integration
