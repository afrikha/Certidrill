id: ai300-sr2-oidc-environment-2
objective: "1.3.1"
type: series_yesno
series: ai300-sr2-oidc-environment
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You add a federated credential for the production environment to a user-assigned managed identity.
  fr: Vous ajoutez des informations d'identification fédérées pour l'environnement production à une identité managée affectée par l'utilisateur.
body:
  solution:
    en: |
      You create a user-assigned managed identity named **id-mlops-prod** and add a federated identity credential for GitHub Actions with the entity type **Environment** and the value `production` for fabrikam/churn-mlops. You store the client ID of id-mlops-prod, the tenant ID and the subscription ID as GitHub secrets. The workflow grants `permissions: id-token: write`, and the deploy job signs in with `azure/login@v2` by using `client-id`, `tenant-id` and `subscription-id`.
    fr: |
      Vous créez une identité managée affectée par l'utilisateur nommée **id-mlops-prod** et vous lui ajoutez des informations d'identification fédérées pour GitHub Actions avec le type d'entité **Environment** et la valeur `production` pour fabrikam/churn-mlops. Vous stockez l'ID client de id-mlops-prod, l'ID de locataire et l'ID d'abonnement dans des secrets GitHub. Le workflow accorde `permissions: id-token: write`, et le travail deploy se connecte avec `azure/login@v2` en utilisant `client-id`, `tenant-id` et `subscription-id`.
answer: { value: true }
explanation:
  correct:
    en: OpenID Connect sign-in works with a user-assigned managed identity as well as with a Microsoft Entra application. The Environment entity matches the subject of the token issued to a job tied to the production environment, and GitHub only stores identifiers, so nothing expires or needs rotation.
    fr: "La connexion OpenID Connect fonctionne avec une identité managée affectée par l'utilisateur comme avec une application Microsoft Entra. L'entité Environment correspond au sujet du jeton émis pour un travail lié à l'environnement production, et GitHub ne stocke que des identifiants : rien n'expire ni ne doit être renouvelé."
references:
  - title: Authenticate to Azure from GitHub Actions by OpenID Connect
    url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
  - title: GitHub Actions for CI/CD - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-github-actions-machine-learning
