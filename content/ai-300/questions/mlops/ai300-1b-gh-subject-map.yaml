id: ai300-1b-gh-subject-map
objective: "1.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    The GitHub repository **adatum/ml-models** contains several GitHub Actions workflows that sign in to Azure by using OpenID Connect and the same Microsoft Entra application. None of the jobs references a GitHub environment unless stated otherwise.

    You need to add one federated identity credential for each workflow context.

    Which subject should you use for each context? To answer, drag the appropriate subjects to the correct contexts. Each subject may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le dépôt GitHub **adatum/ml-models** contient plusieurs workflows GitHub Actions qui se connectent à Azure avec OpenID Connect et la même application Microsoft Entra. Aucun travail ne référence d'environnement GitHub, sauf mention contraire.

    Vous devez ajouter des informations d'identification fédérées pour chaque contexte de workflow.

    Quel sujet devez-vous utiliser pour chaque contexte ? Pour répondre, faites glisser les sujets appropriés vers les contextes correspondants. Chaque sujet peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: env, text: "repo:adatum/ml-models:environment:staging" }
    - { id: branch, text: "repo:adatum/ml-models:ref:refs/heads/release" }
    - { id: pr, text: "repo:adatum/ml-models:pull-request" }
    - { id: tag, text: "repo:adatum/ml-models:ref:refs/tags/v2.0" }
    - { id: wild, text: "repo:adatum/ml-models:ref:refs/heads/*" }
    - { id: envbranch, text: "repo:adatum/ml-models:environment:release" }
  targets:
    - id: t1
      text: { en: "A job that declares environment: staging", fr: "Un travail qui déclare environment: staging" }
    - id: t2
      text: { en: "A workflow triggered by pushes to the release branch", fr: "Un workflow déclenché par les envois (push) sur la branche release" }
    - id: t3
      text: { en: "A workflow triggered by pull_request events", fr: "Un workflow déclenché par les événements pull_request" }
    - id: t4
      text: { en: "A workflow triggered when the tag v2.0 is pushed", fr: "Un workflow déclenché lorsque l'étiquette (tag) v2.0 est envoyée" }
answer:
  mapping: { t1: env, t2: branch, t3: pr, t4: tag }
explanation:
  correct:
    en: "A job that references an environment uses `repo:<org>/<repo>:environment:<name>`. Without an environment, a branch or tag context uses `repo:<org>/<repo>:ref:<ref path>` (`refs/heads/...` or `refs/tags/...`), and a pull request uses `repo:<org>/<repo>:pull-request`."
    fr: "Un travail qui référence un environnement utilise `repo:<org>/<dépôt>:environment:<nom>`. Sans environnement, un contexte de branche ou d'étiquette utilise `repo:<org>/<dépôt>:ref:<chemin de ref>` (`refs/heads/...` ou `refs/tags/...`), et une pull request utilise `repo:<org>/<dépôt>:pull-request`."
  options:
    wild: { en: "Wildcards aren't supported in federated identity credentials, and branch values must match exactly.", fr: "Les caractères génériques ne sont pas pris en charge dans les informations d'identification fédérées, et les valeurs de branche doivent correspondre exactement." }
    envbranch: { en: "release is a branch, not a GitHub environment, so the token doesn't carry an environment subject.", fr: "release est une branche, pas un environnement GitHub : le jeton ne porte pas de sujet d'environnement." }
references:
  - title: Create a trust relationship between an app and an external identity provider
    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-create-trust
