id: ai300-1b-gh-credential-json
objective: "1.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Microsoft Entra application named **app-ml-dev** that has a service principal with the AzureML Data Scientist role on a workspace named **mlw-dev**.

    A job in the GitHub repository **wingtip/ml-ops** that references the GitHub environment `dev` must sign in to Azure as app-ml-dev by using OpenID Connect.

    How should you complete the file and the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une application Microsoft Entra nommée **app-ml-dev** dont le principal de service a le rôle AzureML Data Scientist sur un espace de travail nommé **mlw-dev**.

    Un travail du dépôt GitHub **wingtip/ml-ops** qui référence l'environnement GitHub `dev` doit se connecter à Azure en tant qu'app-ml-dev en utilisant OpenID Connect.

    Comment devez-vous compléter le fichier et la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    # credential.json
    {
      "name": "ml-ops-dev",
      "issuer": "[[issuer]]",
      "subject": "repo:wingtip/ml-ops:environment:dev",
      "audiences": ["[[aud]]"]
    }

    [[cmd]] --id <app-ml-dev-object-id> --parameters credential.json
  slots:
    - id: issuer
      options:
        - { id: gh, text: "https://token.actions.githubusercontent.com" }
        - { id: entra, text: "https://login.microsoftonline.com/<tenant-id>/v2.0" }
        - { id: ghcom, text: "https://github.com/wingtip/ml-ops" }
    - id: aud
      options:
        - { id: mgmt, text: "https://management.azure.com/" }
        - { id: tx, text: "api://AzureADTokenExchange" }
        - { id: ml, text: "https://ml.azure.com" }
    - id: cmd
      options:
        - { id: reset, text: az ad app credential reset }
        - { id: sp, text: az ad sp create-for-rbac }
        - { id: fed, text: az ad app federated-credential create }
answer:
  values: { issuer: gh, aud: tx, cmd: fed }
explanation:
  correct:
    en: |
      For GitHub Actions, the issuer is `https://token.actions.githubusercontent.com` and the audience is `api://AzureADTokenExchange`. `az ad app federated-credential create --id <app> --parameters credential.json` adds the federated identity credential to the application.
    fr: |
      Pour GitHub Actions, l'émetteur est `https://token.actions.githubusercontent.com` et l'audience est `api://AzureADTokenExchange`. `az ad app federated-credential create --id <app> --parameters credential.json` ajoute les informations d'identification fédérées à l'application.
  options:
    entra: { en: "Microsoft Entra ID issues the Azure token; the federated credential must trust the issuer of the GitHub token.", fr: "Microsoft Entra ID émet le jeton Azure ; les informations d'identification fédérées doivent approuver l'émetteur du jeton GitHub." }
    ghcom: { en: "A repository URL isn't the issuer of GitHub Actions tokens.", fr: "Une URL de dépôt n'est pas l'émetteur des jetons GitHub Actions." }
    mgmt: { en: "This is the Azure Resource Manager resource, not the audience expected for the token exchange.", fr: "Il s'agit de la ressource Azure Resource Manager, pas de l'audience attendue pour l'échange de jeton." }
    ml: { en: "This is the studio URL, not the token exchange audience.", fr: "Il s'agit de l'URL du studio, pas de l'audience de l'échange de jeton." }
    reset: { en: "az ad app credential reset creates a password or certificate credential, which is a secret.", fr: "az ad app credential reset crée des informations d'identification de type mot de passe ou certificat, c'est-à-dire un secret." }
    sp: { en: "az ad sp create-for-rbac creates a new service principal with a secret; app-ml-dev already exists.", fr: "az ad sp create-for-rbac crée un nouveau principal de service avec un secret ; app-ml-dev existe déjà." }
references:
  - title: Create a trust relationship between an app and an external identity provider
    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-create-trust
