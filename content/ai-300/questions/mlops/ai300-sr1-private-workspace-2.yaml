id: ai300-sr1-private-workspace-2
objective: "1.3.4"
type: series_yesno
series: ai300-sr1-private-workspace
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You allow public access to the workspace only from the public IP address of the NAT gateway.
  fr: Vous autorisez l'accès public à l'espace de travail uniquement depuis l'adresse IP publique de la passerelle NAT.
body:
  solution:
    en: |
      You run the following command, where `<nat-public-ip>` is the public IP address of the NAT gateway of vnet-ds:

      ```bash
      az ml workspace update \
        --name mlw-fab-prod \
        --resource-group rg-ml \
        --public-network-access Enabled \
        --network-acls "<nat-public-ip>"
      ```
    fr: |
      Vous exécutez la commande suivante, où `<nat-public-ip>` est l'adresse IP publique de la passerelle NAT de vnet-ds :

      ```bash
      az ml workspace update \
        --name mlw-fab-prod \
        --resource-group rg-ml \
        --public-network-access Enabled \
        --network-acls "<nat-public-ip>"
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      IP network rules keep public network access enabled and only filter which public IPv4 addresses can reach the workspace's public endpoint. The data scientists would still connect over the internet to a public address, not through a private IP address in vnet-ds. Microsoft also requires network isolation (a private endpoint or a managed virtual network) before you use selected IP addresses. The goal isn't met.
    fr: |
      Les règles de réseau IP laissent l'accès au réseau public activé et filtrent seulement les adresses IPv4 publiques autorisées à joindre le point de terminaison public de l'espace de travail. Les scientifiques des données se connecteraient toujours via Internet à une adresse publique, et non via une adresse IP privée de vnet-ds. Microsoft exige en outre une isolation réseau (point de terminaison privé ou réseau virtuel managé) avant d'utiliser des adresses IP sélectionnées. L'objectif n'est pas atteint.
references:
  - title: Configure a private endpoint - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-configure-private-link?view=azureml-api-2
