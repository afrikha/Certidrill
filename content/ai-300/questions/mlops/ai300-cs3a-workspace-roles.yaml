id: ai300-cs3a-workspace-roles
objective: "1.1.4"
type: yesno_statements
caseStudy: ai300-cs3a-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You are planning the role assignments on mlw-claims-dev to meet the access requirements. You plan to use built-in roles only.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez les attributions de rôles sur mlw-claims-dev pour respecter les exigences d'accès. Vous prévoyez d'utiliser uniquement des rôles intégrés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If you assign the Reader role on mlw-claims-dev to the external auditors, they can view the credentials of claims-sql-export.
        fr: |
          Si vous attribuez le rôle Reader sur mlw-claims-dev aux auditeurs externes, ils peuvent voir les informations d'identification de claims-sql-export.
    - id: s2
      text:
        en: |
          A data scientist who has only the AzureML Data Scientist role on mlw-claims-dev can create a compute cluster in mlw-claims-dev.
        fr: |
          Un data scientist qui dispose uniquement du rôle AzureML Data Scientist sur mlw-claims-dev peut créer un cluster de calcul dans mlw-claims-dev.
    - id: s3
      text:
        en: |
          A platform team member who has the AzureML Data Scientist and AzureML Compute Operator roles on mlw-claims-dev can submit jobs and create compute clusters.
        fr: |
          Un membre de l'équipe plateforme qui dispose des rôles AzureML Data Scientist et AzureML Compute Operator sur mlw-claims-dev peut soumettre des travaux et créer des clusters de calcul.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The Reader role lists and views assets, including datastore credentials, so Reader alone doesn't meet requirement 4 and the auditors need a custom role. AzureML Data Scientist allows all workspace actions except creating or deleting compute and modifying the workspace, which matches requirement 5. Roles add up, so combining AzureML Data Scientist with AzureML Compute Operator gives both job submission and compute management.
    fr: |
      Le rôle Reader permet de lister et de consulter les actifs, y compris les informations d'identification des magasins de données ; Reader seul ne respecte donc pas l'exigence 4 et les auditeurs ont besoin d'un rôle personnalisé. AzureML Data Scientist autorise toutes les actions de l'espace de travail sauf la création ou la suppression de calculs et la modification de l'espace de travail, ce qui correspond à l'exigence 5. Les rôles se cumulent : associer AzureML Data Scientist et AzureML Compute Operator donne à la fois la soumission de travaux et la gestion des calculs.
references:
  - title: Manage roles in your workspace
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-assign-roles
