id: ai300-1b-gha-workflow-lines
objective: "1.3.3"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    The following table shows the lines of a GitHub Actions workflow that deploys the Bicep files of an Azure Machine Learning workspace. A GitHub environment named **production** is configured with required reviewers.

    Answer each prompt by selecting the line that meets the requirement.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le tableau suivant présente les lignes d'un workflow GitHub Actions qui déploie les fichiers Bicep d'un espace de travail Azure Machine Learning. Un environnement GitHub nommé **production** est configuré avec des réviseurs obligatoires.

    Répondez à chaque consigne en sélectionnant la ligne qui répond à l'exigence.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Lets a user start the workflow manually from the Actions tab", fr: "Permet à un utilisateur de démarrer le workflow manuellement depuis l'onglet Actions" }
    - id: p2
      text: { en: "Makes the job wait for a required reviewer before it can read the environment secrets", fr: "Fait attendre au travail l'approbation d'un réviseur obligatoire avant qu'il puisse lire les secrets d'environnement" }
  grid:
    header: [{ en: "Line", fr: "Ligne" }, { en: "Content", fr: "Contenu" }]
    rows:
      - [{ text: "1" }, { text: "on:" }]
      - [{ text: "2" }, { text: "  push: { branches: [main] }", area: l2 }]
      - [{ text: "3" }, { text: "  workflow_dispatch:", area: l3 }]
      - [{ text: "4" }, { text: "permissions: { id-token: write, contents: read }", area: l4 }]
      - [{ text: "5" }, { text: "jobs:" }]
      - [{ text: "6" }, { text: "  deploy:" }]
      - [{ text: "7" }, { text: "    runs-on: ubuntu-latest", area: l7 }]
      - [{ text: "8" }, { text: "    environment: production", area: l8 }]
      - [{ text: "9" }, { text: "    steps: [ ... ]" }]
answer:
  values: { p1: l3, p2: l8 }
explanation:
  correct:
    en: |
      The `workflow_dispatch` trigger adds a manual run from the Actions tab. A job that declares `environment: production` is subject to that environment's protection rules; when the environment requires approval, the job can't access the environment secrets until a required reviewer approves it.
    fr: |
      Le déclencheur `workflow_dispatch` ajoute une exécution manuelle depuis l'onglet Actions. Un travail qui déclare `environment: production` est soumis aux règles de protection de cet environnement ; quand l'environnement exige une approbation, le travail ne peut pas accéder aux secrets d'environnement tant qu'un réviseur obligatoire ne l'a pas approuvé.
references:
  - title: Authenticate to Azure from GitHub Actions by OpenID Connect
    url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
  - title: GitHub Actions for CI/CD
    url: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-github-actions-machine-learning
