id: ai300-1b-iac-what-if
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You maintain a Bicep file named **main.bicep** that deploys an Azure Machine Learning workspace and its compute cluster to a resource group named **rg-ml-prod**. A colleague changed the file.

    Before anything is deployed, you need to see which resources the change will create, modify or delete, and which properties will change.

    Which command should you run?
  fr: |
    Vous gérez un fichier Bicep nommé **main.bicep** qui déploie un espace de travail Azure Machine Learning et son cluster de calcul dans un groupe de ressources nommé **rg-ml-prod**. Un collègue a modifié le fichier.

    Avant tout déploiement, vous devez voir quelles ressources la modification va créer, modifier ou supprimer, et quelles propriétés vont changer.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "az bicep build --file main.bicep" }
    - { id: b, text: "az deployment group what-if --resource-group rg-ml-prod --template-file main.bicep" }
    - { id: c, text: "az deployment group show --resource-group rg-ml-prod --name main" }
    - { id: d, text: "az ml workspace show --name mlw-prod --resource-group rg-ml-prod" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The what-if operation predicts the result of a deployment without making changes. With the default FullResourcePayloads format, it lists the resources with their change type (Create, Modify, Delete, NoChange...) and the properties that change.
    fr: |
      L'opération what-if prédit le résultat d'un déploiement sans rien modifier. Avec le format par défaut FullResourcePayloads, elle liste les ressources avec leur type de modification (Create, Modify, Delete, NoChange...) et les propriétés qui changent.
  options:
    a:
      en: |
        az bicep build compiles the Bicep file to an ARM JSON template; it doesn't compare it with the deployed resources.
      fr: |
        az bicep build compile le fichier Bicep en modèle ARM JSON ; il ne le compare pas aux ressources déployées.
    c:
      en: |
        az deployment group show returns a past deployment; it doesn't preview a new one.
      fr: |
        az deployment group show renvoie un déploiement passé ; il n'affiche pas l'aperçu d'un nouveau déploiement.
    d:
      en: |
        az ml workspace show displays the current workspace, not the changes that the modified file would make.
      fr: |
        az ml workspace show affiche l'espace de travail actuel, pas les modifications qu'apporterait le fichier modifié.
references:
  - title: "Bicep What-If: Preview Changes Before Deployment"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if
