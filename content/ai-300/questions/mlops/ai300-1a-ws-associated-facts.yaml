id: ai300-1a-ws-associated-facts
objective: "1.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum creates an Azure Machine Learning workspace named **mlw-adatum** by running `az ml workspace create -n mlw-adatum -g rg-adatum-ml` without a YAML file. Azure Machine Learning creates the associated resources.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum crée un espace de travail Azure Machine Learning nommé **mlw-adatum** en exécutant `az ml workspace create -n mlw-adatum -g rg-adatum-ml` sans fichier YAML. Azure Machine Learning crée les ressources associées.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The container registry of the workspace is created the first time it's needed, for example when the image of a custom environment is built.
        fr: |
          Le registre de conteneurs de l'espace de travail est créé la première fois qu'il est nécessaire, par exemple lors de la construction de l'image d'un environnement personnalisé.
    - id: s2
      text:
        en: |
          You can later replace the default storage account of mlw-adatum by running `az ml workspace update`.
        fr: |
          Vous pourrez ensuite remplacer le compte de stockage par défaut de mlw-adatum en exécutant `az ml workspace update`.
    - id: s3
      text:
        en: |
          Running `az ml workspace delete -n mlw-adatum -g rg-adatum-ml` also deletes the storage account and the key vault of the workspace.
        fr: |
          L'exécution de `az ml workspace delete -n mlw-adatum -g rg-adatum-ml` supprime aussi le compte de stockage et le coffre de clés de l'espace de travail.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The container registry is lazy-loaded, so it is created the first time an operation needs it, such as building a custom environment image. The default storage account is set at creation, and `az ml workspace update` has no parameter to change it. By default, deleting a workspace leaves its associated resources in place; they are deleted only with `--all-resources`.
    fr: |
      Le registre de conteneurs est créé à la demande, la première fois qu'une opération en a besoin, par exemple la construction de l'image d'un environnement personnalisé. Le compte de stockage par défaut est défini à la création, et `az ml workspace update` n'a aucun paramètre pour le changer. Par défaut, supprimer un espace de travail laisse ses ressources associées en place ; elles ne sont supprimées qu'avec `--all-resources`.
references:
  - title: CLI (v2) workspace YAML schema - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-workspace
  - title: az ml workspace
    url: https://learn.microsoft.com/en-us/cli/azure/ml/workspace
