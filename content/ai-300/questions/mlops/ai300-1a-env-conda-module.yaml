id: ai300-1a-env-conda-module
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Azure Machine Learning workspace **mlw-contoso** contains an environment named **churn-train-env** version 4. It's defined with a custom base image in which the platform team installed every package that training needs, including `lightgbm`, and with a conda file that lists Python, `scikit-learn` and `mlflow`.

    Training jobs that use churn-train-env:4 fail with `ModuleNotFoundError: No module named 'lightgbm'`. You need the jobs to succeed. Python packages must be managed only in the base image.

    What should you do?
  fr: |
    L'espace de travail Azure Machine Learning **mlw-contoso** contient un environnement nommé **churn-train-env** version 4. Il est défini avec une image de base personnalisée dans laquelle l'équipe plateforme a installé tous les packages nécessaires à l'entraînement, dont `lightgbm`, et avec un fichier conda qui liste Python, `scikit-learn` et `mlflow`.

    Les travaux d'entraînement qui utilisent churn-train-env:4 échouent avec `ModuleNotFoundError: No module named 'lightgbm'`. Vous devez faire en sorte que les travaux réussissent. Les packages Python doivent être gérés uniquement dans l'image de base.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add `lightgbm` to the conda file, register version 5 of churn-train-env, and use it in the jobs.", fr: "Ajouter `lightgbm` au fichier conda, inscrire la version 5 de churn-train-env et l'utiliser dans les travaux." } }
    - { id: b, text: { en: "Run `az ml environment update` on version 4 to remove its conda file.", fr: "Exécuter `az ml environment update` sur la version 4 pour supprimer son fichier conda." } }
    - { id: c, text: { en: "Register version 5 of churn-train-env with only the `image` key, and use it in the jobs.", fr: "Inscrire la version 5 de churn-train-env avec la seule clé `image`, et l'utiliser dans les travaux." } }
    - { id: d, text: { en: "Archive version 4 of churn-train-env, and then restore it to force a new image build.", fr: "Archiver la version 4 de churn-train-env, puis la restaurer pour forcer une nouvelle construction d'image." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With a conda file and a base image, Azure Machine Learning builds a conda environment from the listed dependencies and runs the job in it, not with the Python libraries installed in the base image. An environment defined only from the Docker image runs the job with the packages of the image, which keeps package management in the base image.
    fr: |
      Avec un fichier conda et une image de base, Azure Machine Learning crée un environnement conda à partir des dépendances listées et y exécute le travail, sans utiliser les bibliothèques Python installées dans l'image de base. Un environnement défini uniquement à partir de l'image Docker exécute le travail avec les packages de l'image, ce qui laisse la gestion des packages dans l'image de base.
  options:
    a: { en: "This fixes the error, but packages would then be managed in the conda file, which the requirements forbid.", fr: "Cela corrige l'erreur, mais les packages seraient alors gérés dans le fichier conda, ce que les exigences interdisent." }
    b: { en: "Only the description and tags of an environment version can be updated.", fr: "Seules la description et les étiquettes d'une version d'environnement peuvent être mises à jour." }
    d: { en: "Archiving and restoring don't change the definition, so the conda environment still lacks the package.", fr: "Archiver puis restaurer ne change pas la définition : l'environnement conda ne contient toujours pas le package." }
references:
