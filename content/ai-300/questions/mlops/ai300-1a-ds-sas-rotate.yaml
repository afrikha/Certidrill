id: ai300-1a-ds-sas-rotate
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Azure Machine Learning workspace **mlw-wingtip** has a datastore named **partner_drop** of type `azure_blob` that authenticates with a SAS token. The SAS token expired this morning, and jobs that read from partner_drop now fail with authorization errors. The partner sent you a new SAS token.

    You need to restore access without changing the jobs that reference partner_drop. The solution must minimize administrative effort.

    What should you do?
  fr: |
    L'espace de travail Azure Machine Learning **mlw-wingtip** a un magasin de données nommé **partner_drop** de type `azure_blob` qui s'authentifie avec un jeton SAS. Le jeton SAS a expiré ce matin, et les travaux qui lisent partner_drop échouent désormais avec des erreurs d'autorisation. Le partenaire vous a envoyé un nouveau jeton SAS.

    Vous devez rétablir l'accès sans modifier les travaux qui référencent partner_drop. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run `az ml workspace sync-keys` for mlw-wingtip.", fr: "Exécuter `az ml workspace sync-keys` pour mlw-wingtip." } }
    - { id: b, text: { en: "Run `az ml datastore update` with a YAML file that contains the new `sas_token`.", fr: "Exécuter `az ml datastore update` avec un fichier YAML qui contient le nouveau `sas_token`." } }
    - { id: c, text: { en: "Create a datastore named partner_drop_v2 with the new token, and update the jobs.", fr: "Créer un magasin de données nommé partner_drop_v2 avec le nouveau jeton, et mettre à jour les travaux." } }
    - { id: d, text: { en: "Create a new version of the data assets that reference partner_drop.", fr: "Créer une nouvelle version des ressources de données qui référencent partner_drop." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The description, tags and credentials of a datastore can be updated with `az ml datastore update`. Updating partner_drop with the new `sas_token` keeps its name, so every job that references `azureml://datastores/partner_drop/...` works again without changes.
    fr: |
      La description, les étiquettes et les informations d'identification d'un magasin de données peuvent être mises à jour avec `az ml datastore update`. Mettre à jour partner_drop avec le nouveau `sas_token` conserve son nom : chaque travail qui référence `azureml://datastores/partner_drop/...` fonctionne de nouveau sans modification.
  options:
    a: { en: "sync-keys resynchronizes the keys of the workspace's own associated resources; it doesn't receive a partner SAS token.", fr: "sync-keys resynchronise les clés des ressources associées de l'espace de travail ; il ne reçoit pas le jeton SAS d'un partenaire." }
    c: { en: "A new datastore name forces you to change the jobs, which the requirements forbid.", fr: "Un nouveau nom de magasin de données oblige à modifier les travaux, ce que les exigences interdisent." }
    d: { en: "Data assets reference a path; the credentials stay in the datastore, so new versions don't fix authentication.", fr: "Les ressources de données référencent un chemin ; les informations d'identification restent dans le magasin de données : de nouvelles versions ne corrigent pas l'authentification." }
references:
  - title: az ml datastore
    url: https://learn.microsoft.com/en-us/cli/azure/ml/datastore
  - title: CLI (v2) Azure Blob datastore YAML schema - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/reference-yaml-datastore-blob
