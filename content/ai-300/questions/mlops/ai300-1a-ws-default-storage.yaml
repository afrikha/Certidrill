id: ai300-1a-ws-default-storage
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso's IT team created four storage accounts in the resource group **rg-ml-shared**. You plan to create an Azure Machine Learning workspace named **mlw-contoso-dev** by using an existing storage account as the workspace default storage.

    | Name | Account kind | SKU | Hierarchical namespace |
    | --- | --- | --- | --- |
    | stcontoso1 | BlobStorage | Standard_LRS | Disabled |
    | stcontoso2 | StorageV2 (general-purpose v2) | Premium_LRS | Disabled |
    | stcontoso3 | StorageV2 (general-purpose v2) | Standard_GRS | Enabled |
    | stcontoso4 | StorageV2 (general-purpose v2) | Standard_LRS | Disabled |

    Which storage account can you use as the default storage account of the workspace?
  fr: |
    L'équipe informatique de Contoso a créé quatre comptes de stockage dans le groupe de ressources **rg-ml-shared**. Vous prévoyez de créer un espace de travail Azure Machine Learning nommé **mlw-contoso-dev** en utilisant un compte de stockage existant comme stockage par défaut de l'espace de travail.

    | Nom | Type de compte | SKU | Espace de noms hiérarchique |
    | --- | --- | --- | --- |
    | stcontoso1 | BlobStorage | Standard_LRS | Désactivé |
    | stcontoso2 | StorageV2 (usage général v2) | Premium_LRS | Désactivé |
    | stcontoso3 | StorageV2 (usage général v2) | Standard_GRS | Activé |
    | stcontoso4 | StorageV2 (usage général v2) | Standard_LRS | Désactivé |

    Quel compte de stockage pouvez-vous utiliser comme compte de stockage par défaut de l'espace de travail ?
body:
  options:
    - { id: a, text: stcontoso1 }
    - { id: b, text: stcontoso2 }
    - { id: c, text: stcontoso3 }
    - { id: d, text: stcontoso4 }
shuffle: false
answer: { optionId: d }
explanation:
  correct:
    en: |
      The default storage account of a workspace can't be a BlobStorage account, a premium account (Premium_LRS or Premium_GRS) or an account with hierarchical namespace enabled. stcontoso4 is a standard general-purpose v2 account without hierarchical namespace, so it meets the requirements.
    fr: |
      Le compte de stockage par défaut d'un espace de travail ne peut pas être un compte BlobStorage, un compte premium (Premium_LRS ou Premium_GRS) ni un compte dont l'espace de noms hiérarchique est activé. stcontoso4 est un compte standard à usage général v2 sans espace de noms hiérarchique : il répond aux exigences.
  options:
    a: { en: "An account of kind BlobStorage can't be the default storage of a workspace.", fr: "Un compte de type BlobStorage ne peut pas être le stockage par défaut d'un espace de travail." }
    b: { en: "Premium accounts can't be the default storage; you can add them later as a datastore.", fr: "Les comptes premium ne peuvent pas être le stockage par défaut ; vous pouvez les ajouter ensuite comme magasin de données." }
    c: { en: "An account with hierarchical namespace (Data Lake Storage Gen2) can't be the default storage; connect it as a datastore instead.", fr: "Un compte avec espace de noms hiérarchique (Data Lake Storage Gen2) ne peut pas être le stockage par défaut ; connectez-le plutôt comme magasin de données." }
references:
  - title: What is a workspace? - Azure Machine Learning
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-workspace
