# CKA objectives — Certified Kubernetes Administrator.
# Source: Linux Foundation certification page
# (https://training.linuxfoundation.org/certification/certified-kubernetes-administrator-cka/,
# read on 2026-11-27): 5 domains, 27 competencies, exam based on Kubernetes v1.37. Groups below are the
# competencies, titles verbatim, in the page's order.
# WRITTEN OBJECTIVES: the page lists competency names only. Every objective below is OUR wording,
# 2–4 per competency, stating the tasks an administrator performs for it on a kubeadm cluster running
# v1.37 (kubernetes.io/docs tasks, setup and reference pages, kubeadm, etcd, helm.sh/docs,
# gateway-api.sigs.k8s.io). They are hands-on: each one is practised by command and manifest exercises
# (docs/SPECS-KUBERNETES-PRATIQUE.md); node-level work (kubelet, static Pods, kubeadm, etcdctl) is
# practised as commands and configuration files.
# Codes <domain order>.<group>.<n>; English only (the exam is not offered in French).
storage:
- group:
    en: Implement storage classes and dynamic volume provisioning
  objectives:
  - code: 1.1.1
    en: Create StorageClasses (provisioner, parameters, reclaimPolicy, volumeBindingMode WaitForFirstConsumer, allowVolumeExpansion) and set or change the default StorageClass
  - code: 1.1.2
    en: Provision volumes dynamically from a PersistentVolumeClaim and expand a bound claim
- group:
    en: Configure volume types, access modes and reclaim policies
  objectives:
  - code: 1.2.1
    en: Choose access modes (ReadWriteOnce, ReadOnlyMany, ReadWriteMany, ReadWriteOncePod) and volume modes (Filesystem, Block) for a workload
  - code: 1.2.2
    en: Set and change reclaim policies (Retain, Delete) and predict what happens to a PersistentVolume and its data when its claim is deleted
  - code: 1.2.3
    en: Use hostPath, local and CSI volume sources, with nodeAffinity for local volumes
- group:
    en: Manage persistent volumes and persistent volume claims
  objectives:
  - code: 1.3.1
    en: Create PersistentVolumes and PersistentVolumeClaims that bind statically (capacity, accessModes, storageClassName, selector, volumeName)
  - code: 1.3.2
    en: Mount a claim in Pods and StatefulSets (volumeClaimTemplates) and diagnose Pending claims and released volumes
troubleshooting:
- group:
    en: Troubleshoot clusters and nodes
  objectives:
  - code: 2.1.1
    en: Diagnose NotReady nodes (kubelet service status and logs with systemctl and journalctl, container runtime, certificates, disk and memory pressure)
  - code: 2.1.2
    en: Cordon, drain and uncordon nodes, and fix kubelet configuration (config.yaml, flags, systemd drop-ins) then restart the service
  - code: 2.1.3
    en: Inspect node conditions, capacity, allocatable resources and taints
- group:
    en: Troubleshoot cluster components
  objectives:
  - code: 2.2.1
    en: Locate and fix static Pod manifests of the control plane (/etc/kubernetes/manifests) for kube-apiserver, etcd, kube-scheduler and kube-controller-manager
  - code: 2.2.2
    en: Read control plane component logs with kubectl logs, crictl ps and logs, and journalctl when the API server is down
  - code: 2.2.3
    en: Check API server and component health endpoints (livez, readyz) and kubeconfig files of components
- group:
    en: Monitor cluster and application resource usage
  objectives:
  - code: 2.3.1
    en: Use kubectl top for nodes, Pods and containers with sorting and selectors, with metrics-server
  - code: 2.3.2
    en: Find the objects that use the most resources and compare usage to requests, limits and quotas
- group:
    en: Manage and evaluate container output streams
  objectives:
  - code: 2.4.1
    en: Read container and previous-container logs (kubectl logs with -c, --previous, --since, --tail, -l, --all-containers) and write them to a file
  - code: 2.4.2
    en: Find container logs on a node (/var/log/pods, /var/log/containers, crictl logs) and use a logging sidecar
- group:
    en: Troubleshoot services and networking
  objectives:
  - code: 2.5.1
    en: Diagnose a Service without endpoints or with the wrong port (selectors, labels, targetPort, EndpointSlices, readiness)
  - code: 2.5.2
    en: Diagnose DNS and connectivity problems from a temporary Pod (nslookup, wget, curl) and check kube-proxy and the CNI plugin
workloads:
- group:
    en: Understand application deployments and how to perform rolling update and rollbacks
  objectives:
  - code: 3.1.1
    en: Create Deployments, update their image and template, and follow and roll back rollouts (rollout status, history, undo --to-revision)
  - code: 3.1.2
    en: Configure the rolling update strategy (maxSurge, maxUnavailable, Recreate) and revision history
- group:
    en: Use ConfigMaps and Secrets to configure applications
  objectives:
  - code: 3.2.1
    en: Create ConfigMaps and Secrets from literals, files and env files
  - code: 3.2.2
    en: Consume them as environment variables and mounted volumes, and roll out the change to running Pods
- group:
    en: Configure workload autoscaling
  objectives:
  - code: 3.3.1
    en: Create a HorizontalPodAutoscaler (kubectl autoscale or autoscaling/v2 manifest) with CPU or memory targets, min and max replicas
  - code: 3.3.2
    en: Tune HPA behavior (scaleUp and scaleDown policies, stabilization window) and diagnose an HPA without metrics
- group:
    en: Understand the primitives used to create robust, self-healing, application deployments
  objectives:
  - code: 3.4.1
    en: Use ReplicaSets, Deployments, StatefulSets and DaemonSets with probes and restart policies to keep workloads running
  - code: 3.4.2
    en: Protect availability with PodDisruptionBudgets and topology spread constraints
- group:
    en: Configure Pod admission and scheduling (limits, node affinity, etc.)
  objectives:
  - code: 3.5.1
    en: Schedule Pods with nodeSelector, nodeName, node affinity and Pod affinity and anti-affinity
  - code: 3.5.2
    en: Use taints and tolerations (NoSchedule, PreferNoSchedule, NoExecute, tolerationSeconds) and PriorityClasses
  - code: 3.5.3
    en: Apply requests and limits, LimitRanges and ResourceQuotas and predict admission and scheduling results
cluster:
- group:
    en: Manage role based access control (RBAC)
  objectives:
  - code: 4.1.1
    en: Create Roles, ClusterRoles, RoleBindings and ClusterRoleBindings for users, groups and ServiceAccounts (imperatively and in manifests)
  - code: 4.1.2
    en: Test permissions with kubectl auth can-i (--as, --list) and choose the right scope (namespaced, cluster-wide, ClusterRole bound in a namespace)
- group:
    en: Prepare underlying infrastructure for installing a Kubernetes cluster
  objectives:
  - code: 4.2.1
    en: Prepare nodes (container runtime with the systemd cgroup driver, swap, kernel modules overlay and br_netfilter, sysctl for IP forwarding, required ports)
  - code: 4.2.2
    en: Install and hold kubeadm, kubelet and kubectl packages at the target version
- group:
    en: Create and manage Kubernetes clusters using kubeadm
  objectives:
  - code: 4.3.1
    en: Initialize a control plane with kubeadm init (pod network CIDR, control plane endpoint, configuration file) and install a CNI plugin
  - code: 4.3.2
    en: Join worker and control plane nodes (kubeadm token create --print-join-command, certificate key) and reset a node
- group:
    en: Manage the lifecycle of Kubernetes clusters
  objectives:
  - code: 4.4.1
    en: Upgrade a kubeadm cluster one minor version (upgrade plan, upgrade apply, upgrade node, drain, kubelet and kubectl packages, uncordon)
  - code: 4.4.2
    en: Back up and restore etcd (etcdctl snapshot save with endpoints and certificates, etcdutl snapshot restore, data directory in the etcd manifest)
  - code: 4.4.3
    en: Check and renew control plane certificates with kubeadm certs
- group:
    en: Implement and configure a highly-available control plane
  objectives:
  - code: 4.5.1
    en: Describe stacked and external etcd topologies, quorum and the load-balanced control plane endpoint
  - code: 4.5.2
    en: Add control plane nodes to a kubeadm cluster (upload-certs, certificate key, --control-plane join)
- group:
    en: Use Helm and Kustomize to install cluster components
  objectives:
  - code: 4.6.1
    en: Install and upgrade cluster components from Helm charts (repositories, values, namespace, version) and inspect releases
  - code: 4.6.2
    en: Install components with Kustomize (kubectl apply -k, overlays, images and patches)
- group:
    en: Understand extension interfaces (CNI, CSI, CRI, etc.)
  objectives:
  - code: 4.7.1
    en: Identify the CNI configuration and plugin binaries, the CRI socket and runtime (crictl) and the CSI drivers of a cluster
  - code: 4.7.2
    en: Choose and install a CNI plugin and a CSI driver, and use RuntimeClasses
- group:
    en: Understand CRDs, install and configure operators
  objectives:
  - code: 4.8.1
    en: Install CRDs and operators (manifests or Helm) and create and inspect custom resources
  - code: 4.8.2
    en: Read a CRD (group, versions, scope, names, schema) with kubectl get, describe and explain
networking:
- group:
    en: Understand connectivity between Pods
  objectives:
  - code: 5.1.1
    en: Explain the Kubernetes network model (every Pod gets an IP, Pod-to-Pod without NAT, Pod and Service CIDRs) and find Pod and node IPs
  - code: 5.1.2
    en: Test Pod-to-Pod and Pod-to-Service connectivity from a temporary Pod
- group:
    en: Define and enforce Network Policies
  objectives:
  - code: 5.2.1
    en: Write ingress and egress NetworkPolicies with Pod, namespace and IP block selectors and ports
  - code: 5.2.2
    en: Write default-deny policies and predict the traffic a set of policies allows (DNS egress, AND versus OR selectors)
- group:
    en: Use ClusterIP, NodePort, LoadBalancer service types and endpoints
  objectives:
  - code: 5.3.1
    en: Expose workloads with ClusterIP, NodePort, LoadBalancer and headless Services (kubectl expose, create service, manifest), with named ports and fixed nodePorts
  - code: 5.3.2
    en: Inspect and troubleshoot Endpoints and EndpointSlices, and Services without a selector
- group:
    en: Use the Gateway API to manage Ingress traffic
  objectives:
  - code: 5.4.1
    en: Create Gateways (gatewayClassName, listeners, protocols, TLS, allowedRoutes) for an installed GatewayClass
  - code: 5.4.2
    en: Create HTTPRoutes (parentRefs, hostnames, path and header matches, backendRefs with weights, filters such as redirects and header changes)
- group:
    en: Know how to use Ingress controllers and Ingress resources
  objectives:
  - code: 5.5.1
    en: Create Ingress resources with host and path rules, pathType, ingressClassName, default backend and TLS
  - code: 5.5.2
    en: Identify the installed Ingress controller and IngressClass (default class annotation) and troubleshoot an Ingress that does not route
- group:
    en: Understand and use CoreDNS
  objectives:
  - code: 5.6.1
    en: Resolve Services and Pods by DNS name (service.namespace.svc.cluster.local, headless and StatefulSet Pod names) and check resolv.conf
  - code: 5.6.2
    en: Inspect and edit the CoreDNS Corefile ConfigMap (forward, stub domains, cache) and restart CoreDNS
