        - manifest: |
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: store
              namespace: shop
            spec:
              parentRefs:
              - name: edge-gw
                namespace: infra
                sectionName: shop
