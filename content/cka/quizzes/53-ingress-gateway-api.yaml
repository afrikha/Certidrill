                - path:
                    type: PathPrefix
                    value: /
                backendRefs:
                - name: storefront
                  namespace: infra
                  port: 8080
          why: The Service is in namespace shop, like the route; namespace infra points to a Service that does not exist there (and would need a ReferenceGrant).
        - manifest: |
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: store
              namespace: shop
            spec:
              parentRefs:
              - name: edge-gw
                sectionName: shop
              hostnames:
              - shop.example.com
              rules:
              - matches:
                - path:
                    type: PathPrefix
                    value: /
                backendRefs:
                - name: storefront
                  port: 8080
          why: parentRefs.namespace defaults to the route's namespace, so the route would look for a Gateway edge-gw in shop.
    explanation:
      correct:
        en: |
          Four fields are wrong. `NoMatchingParent` means the `sectionName` (or port) of `parentRefs` matches no listener: the HTTPS listener of `edge-gw` is named `shop`. Once it attaches there, the route `hostnames` must intersect the listener hostname, so `www.shop.example.com` must become `shop.example.com` (or be removed to inherit it). `BackendNotFound` points to the Service name, `storefront`, and `backendRefs.port` must be its port 8080 shown in `services.txt`.
