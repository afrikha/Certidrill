  # ------------------------------------------------------------------ 10
  - id: cka-qz-41-10
    objective: "4.8.1"
    difficulty: 3
    status: draft
    type: manifest
    stem:
      en: |-
        A backup operator was installed from `operator.yaml`: its CRD, the namespace `ops-system`, the ServiceAccount `backup-operator` and the Deployment `backup-operator`, but no RBAC. The operator handles `Backup` objects in every namespace. Its logs show:

        ```text
        backups.ops.example.com is forbidden: User "system:serviceaccount:ops-system:backup-operator" cannot watch resource "backups" in API group "ops.example.com" at the cluster scope
        backups.ops.example.com "nightly" is forbidden: User "system:serviceaccount:ops-system:backup-operator" cannot patch resource "backups/status" in API group "ops.example.com" in the namespace "shop"
        jobs.batch is forbidden: User "system:serviceaccount:ops-system:backup-operator" cannot create resource "jobs" in API group "batch" in the namespace "shop"
        ```

        Write the manifests of a ClusterRole named `backup-operator` and of its binding, also named `backup-operator`, so that the operator can `get`, `list` and `watch` Backups, `update` and `patch` their status, and `create` Jobs, in every namespace.
    body:
      starter: ""
    answer:
      checks:
        - id: cr-backups
          label: The ClusterRole allows get, list and watch on backups in the ops.example.com group
          select: { kind: ClusterRole, name: backup-operator }
          path: rules
          op: contains
          value: { apiGroups: [ops.example.com], resources: [backups], verbs: [get, list, watch] }
        - id: cr-status
          label: The ClusterRole allows update and patch on the backups/status subresource
          select: { kind: ClusterRole, name: backup-operator }
          path: rules
          op: contains
          value: { apiGroups: [ops.example.com], resources: [backups/status], verbs: [update, patch] }
        - id: cr-jobs
          label: The ClusterRole allows create on jobs in the batch group
          select: { kind: ClusterRole, name: backup-operator }
          path: rules
          op: contains
          value: { apiGroups: [batch], resources: [jobs], verbs: [create] }
        - id: crb-roleref
          label: A ClusterRoleBinding backup-operator references the ClusterRole backup-operator
          select: { kind: ClusterRoleBinding, name: backup-operator }
          path: roleRef
          op: subset
          value: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: backup-operator }
        - id: crb-subject
          label: Its subject is the ServiceAccount backup-operator of namespace ops-system
          select: { kind: ClusterRoleBinding, name: backup-operator }
          path: subjects
          op: contains
          value: { kind: ServiceAccount, name: backup-operator, namespace: ops-system }
      solution:
        - manifest: |
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: backup-operator
            rules:
            - apiGroups: ["ops.example.com"]
              resources: ["backups"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["ops.example.com"]
              resources: ["backups/status"]
              verbs: ["update", "patch"]
            - apiGroups: ["batch"]
              resources: ["jobs"]
              verbs: ["create"]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: backup-operator
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: backup-operator
            subjects:
            - kind: ServiceAccount
              name: backup-operator
              namespace: ops-system
        - manifest: |
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: backup-operator
            subjects:
            - kind: ServiceAccount
              namespace: ops-system
              name: backup-operator
            roleRef:
              kind: ClusterRole
              name: backup-operator
              apiGroup: rbac.authorization.k8s.io
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: backup-operator
            rules:
            - apiGroups:
              - batch
              resources:
              - jobs
              verbs:
              - create
            - apiGroups:
              - ops.example.com
              resources:
              - backups/status
              verbs:
              - patch
              - update
            - apiGroups:
              - ops.example.com
              resources:
              - backups
              verbs:
              - watch
              - list
              - get
      negatives:
        - manifest: |
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: backup-operator
            rules:
            - apiGroups: ["ops.example.com"]
              resources: ["backups"]
              verbs: ["get", "list", "watch", "update", "patch"]
            - apiGroups: ["batch"]
              resources: ["jobs"]
              verbs: ["create"]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: backup-operator
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: backup-operator
            subjects:
            - kind: ServiceAccount
              name: backup-operator
              namespace: ops-system
          why: Update and patch on backups do not cover the status subresource; RBAC authorizes backups/status as a separate resource.
        - manifest: |
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: backup-operator
            rules:
            - apiGroups: [""]
              resources: ["backups", "backups/status"]
              verbs: ["get", "list", "watch", "update", "patch"]
            - apiGroups: ["batch"]
              resources: ["jobs"]
              verbs: ["create"]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: backup-operator
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: backup-operator
            subjects:
            - kind: ServiceAccount
              name: backup-operator
              namespace: ops-system
          why: The custom resource is in the API group ops.example.com, not in the core group "".
        - manifest: |
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: backup-operator
            rules:
            - apiGroups: ["ops.example.com"]
              resources: ["backups"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["ops.example.com"]
              resources: ["backups/status"]
              verbs: ["update", "patch"]
            - apiGroups: ["batch"]
              resources: ["jobs"]
              verbs: ["create"]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: backup-operator
              namespace: ops-system
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: backup-operator
            subjects:
            - kind: ServiceAccount
              name: backup-operator
              namespace: ops-system
          why: A RoleBinding grants the ClusterRole only in ops-system; the operator watches at the cluster scope and works in shop.
        - manifest: |
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: backup-operator
            rules:
            - apiGroups: ["ops.example.com"]
              resources: ["backups"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["ops.example.com"]
              resources: ["backups/status"]
              verbs: ["update", "patch"]
            - apiGroups: ["apps"]
              resources: ["jobs"]
              verbs: ["create"]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: backup-operator
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: backup-operator
            subjects:
            - kind: ServiceAccount
              name: backup-operator
              namespace: ops-system
          why: Jobs are in the batch API group, as the error message says, not in apps.
    explanation:
      correct:
        en: |
          Each forbidden line gives the verb, the resource and the API group to grant: `backups` and the subresource `backups/status` in `ops.example.com`, `jobs` in `batch`. A status subresource is authorized separately from its parent, so it needs its own entry. "At the cluster scope" and the work in `shop` call for a ClusterRoleBinding, whose ServiceAccount subject must carry `namespace: ops-system`.
    references:
      - title: Using RBAC Authorization
        url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
      - title: Extend the Kubernetes API with CustomResourceDefinitions
        url: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/
