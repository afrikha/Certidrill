  # ------------------------------------------------------------------ 10
  - id: cka-qz-42-10
    objective: "4.3.1"
    difficulty: 3
    status: draft
    type: manifest
    stem:
      en: |-
        A colleague wrote `/root/kubeadm-config.yaml` (below) for `kubeadm init --config /root/kubeadm-config.yaml` on `cp1`, copying the component flags from an old blog post. kubeadm refuses to read the file.

        Fix the file so that kubeadm accepts it and:

        - kube-controller-manager and kube-scheduler listen on all interfaces (`--bind-address=0.0.0.0`), so that the monitoring system can scrape them;
        - each node receives a `/25` Pod CIDR (`--node-cidr-mask-size=25`) carved from the cluster's Pod network `10.244.0.0/16`.

        Keep the `kubeadm.k8s.io/v1beta4` API and the other settings.
    body:
      starter: |
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: InitConfiguration
        localAPIEndpoint:
          advertiseAddress: 192.168.10.11
        nodeRegistration:
          name: cp1
          criSocket: unix:///run/containerd/containerd.sock
        ---
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: ClusterConfiguration
        kubernetesVersion: v1.37.1
        networking:
          podSubnet: 10.244.0.0/16
        controllerManager:
          extraArgs:
            bind-address: 0.0.0.0
        scheduler:
          extraArgs:
            bind-address: 0.0.0.0
    answer:
      checks:
        - id: api
          label: ClusterConfiguration uses kubeadm.k8s.io/v1beta4
          select: { kind: ClusterConfiguration }
          path: apiVersion
          op: equals
          value: kubeadm.k8s.io/v1beta4
        - id: kcm-bind
          label: controllerManager.extraArgs has bind-address 0.0.0.0 as a name/value item
          select: { kind: ClusterConfiguration }
          path: controllerManager.extraArgs[name=bind-address].value
          op: equals
          value: 0.0.0.0
        - id: kcm-mask
          label: controllerManager.extraArgs has node-cidr-mask-size 25
          select: { kind: ClusterConfiguration }
          path: controllerManager.extraArgs[name=node-cidr-mask-size].value
          op: equals
          value: 25
        - id: sched-bind
          label: scheduler.extraArgs has bind-address 0.0.0.0 as a name/value item
          select: { kind: ClusterConfiguration }
          path: scheduler.extraArgs[name=bind-address].value
          op: equals
          value: 0.0.0.0
        - id: pod-subnet
          label: The Pod network 10.244.0.0/16 is kept
          select: { kind: ClusterConfiguration }
          path: networking.podSubnet
          op: equals
          value: 10.244.0.0/16
        - id: version
          label: kubernetesVersion v1.37.1 is kept
          select: { kind: ClusterConfiguration }
          path: kubernetesVersion
          op: oneOf
          value: [v1.37.1, 1.37.1]
        - id: advertise
          label: cp1 still advertises 192.168.10.11
          select: { kind: InitConfiguration }
          path: localAPIEndpoint.advertiseAddress
          op: equals
          value: 192.168.10.11
        - id: cri
          label: The containerd socket is kept
          select: { kind: InitConfiguration }
          path: nodeRegistration.criSocket
          op: equals
          value: unix:///run/containerd/containerd.sock
      solution:
        - manifest: |
            apiVersion: kubeadm.k8s.io/v1beta4
            kind: InitConfiguration
            localAPIEndpoint:
              advertiseAddress: 192.168.10.11
            nodeRegistration:
              name: cp1
              criSocket: unix:///run/containerd/containerd.sock
            ---
            apiVersion: kubeadm.k8s.io/v1beta4
            kind: ClusterConfiguration
            kubernetesVersion: v1.37.1
            networking:
              podSubnet: 10.244.0.0/16
            controllerManager:
              extraArgs:
              - name: bind-address
                value: 0.0.0.0
              - name: node-cidr-mask-size
                value: "25"
            scheduler:
              extraArgs:
              - name: bind-address
                value: 0.0.0.0
        - manifest: |
            apiVersion: kubeadm.k8s.io/v1beta4
            kind: ClusterConfiguration
            kubernetesVersion: "v1.37.1"
            scheduler:
              extraArgs:
                - { name: bind-address, value: "0.0.0.0" }
            controllerManager:
              extraArgs:
                - name: node-cidr-mask-size
                  value: "25"
                - name: bind-address
                  value: "0.0.0.0"
            networking:
              podSubnet: "10.244.0.0/16"
            ---
            apiVersion: kubeadm.k8s.io/v1beta4
            kind: InitConfiguration
            nodeRegistration:
              criSocket: unix:///run/containerd/containerd.sock
              name: cp1
            localAPIEndpoint:
              advertiseAddress: 192.168.10.11
      negatives:
        - manifest: |
            apiVersion: kubeadm.k8s.io/v1beta4
            kind: InitConfiguration
            localAPIEndpoint:
              advertiseAddress: 192.168.10.11
            nodeRegistration:
              name: cp1
              criSocket: unix:///run/containerd/containerd.sock
            ---
            apiVersion: kubeadm.k8s.io/v1beta4
            kind: ClusterConfiguration
            kubernetesVersion: v1.37.1
            networking:
              podSubnet: 10.244.0.0/16
            controllerManager:
              extraArgs:
                bind-address: 0.0.0.0
                node-cidr-mask-size: "25"
            scheduler:
              extraArgs:
                bind-address: 0.0.0.0
          why: In v1beta4, extraArgs is a list of name/value items; the map form of v1beta3 is exactly why kubeadm refuses the file.
        - manifest: |
            apiVersion: kubeadm.k8s.io/v1beta4
            kind: InitConfiguration
            localAPIEndpoint:
              advertiseAddress: 192.168.10.11
            nodeRegistration:
              name: cp1
              criSocket: unix:///run/containerd/containerd.sock
            ---
            apiVersion: kubeadm.k8s.io/v1beta4
            kind: ClusterConfiguration
            kubernetesVersion: v1.37.1
            networking:
              podSubnet: 10.244.0.0/16
            controllerManager:
              extraArgs:
              - name: bind-address
                value: 0.0.0.0
            scheduler:
              extraArgs:
              - name: bind-address
                value: 0.0.0.0
              - name: node-cidr-mask-size
                value: "25"
          why: Node Pod CIDRs are allocated by kube-controller-manager, so node-cidr-mask-size belongs to controllerManager; the scheduler has no such flag.
        - manifest: |
            apiVersion: kubeadm.k8s.io/v1beta4
            kind: InitConfiguration
            localAPIEndpoint:
              advertiseAddress: 192.168.10.11
            nodeRegistration:
              name: cp1
              criSocket: unix:///run/containerd/containerd.sock
            ---
            apiVersion: kubeadm.k8s.io/v1beta4
            kind: ClusterConfiguration
            kubernetesVersion: v1.37.1
            networking:
              podSubnet: 10.244.0.0/16
            controllerManager:
              extraArgs:
              - name: --bind-address
                value: 0.0.0.0
              - name: --node-cidr-mask-size
                value: "25"
            scheduler:
              extraArgs:
              - name: --bind-address
                value: 0.0.0.0
          why: The name is the flag name without dashes; kubeadm adds the leading -- itself, so these items would become invalid flags.
    explanation:
      correct:
        en: |
          Since v1beta4, `apiServer`, `controllerManager`, `scheduler` and `etcd.local` take `extraArgs` as a list of `name`/`value` items (the flag name without dashes), not the `flag: value` map of v1beta3. `bind-address` goes to both components, while `node-cidr-mask-size` goes to `controllerManager` only, because kube-controller-manager allocates each node's Pod CIDR from `podSubnet`. Each `value` is a string, so quote numbers (`value: "25"`).
    references:
      - title: kubeadm Configuration (v1beta4)
        url: https://kubernetes.io/docs/reference/config-api/kubeadm-config.v1beta4/
      - title: kubeadm init
        url: https://kubernetes.io/docs/reference/setup-tools/kubeadm/kubeadm-init/
