    explanation:
      correct:
        en: |
          The restarts come from `containerRuntimeEndpoint`, which still points to the removed CRI-O socket: it must be containerd's socket (`unix:///run/containerd/containerd.sock`; `/var/run` is a link to `/run`). The kubelet v1.37 learns the cgroup driver from containerd 2.x through the `RuntimeConfig` CRI call and then ignores `cgroupDriver`, but that setting is still the fallback for a runtime without the call, so set it to `systemd` like containerd and the `kubelet-config` ConfigMap. After saving the file, `systemctl restart kubelet` and uncordon the node.
