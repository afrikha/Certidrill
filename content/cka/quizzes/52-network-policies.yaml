    explanation:
      correct:
        en: |
          Under `default-deny-all`, every connection needs an allow on both sides: `api-ingress` for gateway → api, and for api → db both the egress of the api Pods (`api-egress`) and the ingress of the db Pods (`db-ingress`). The gateways need no egress rule because no policy selects the Pods of `edge`. Selectors that combine a namespace and Pods sit in one peer entry (AND), Pods of `edge` are selected through `kubernetes.io/metadata.name`, the api port is the target port 8443, and DNS must be opened explicitly once the api Pods are isolated for egress.
