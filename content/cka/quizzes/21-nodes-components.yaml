chapter: 21-nodes-components
questions:
  # ------------------------------------------------------------------ 1
  - id: cka-qz-21-01
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        `kubectl get nodes` shows `node-3` as `NotReady`. In `kubectl describe node node-3`, the `Ready` condition has the status `Unknown`.

        What does the status `Unknown` tell you?
    body:
      options:
        - { id: a, text: { en: "The kubelet on node-3 reported that the node is unhealthy and does not accept new Pods." } }
        - { id: b, text: { en: "The node has been cordoned, so the scheduler no longer places new Pods on node-3." } }
        - { id: c, text: { en: "The node controller has received no status from the kubelet on node-3 for longer than the grace period." } }
        - { id: d, text: { en: "The kubelet on node-3 is running, but its MemoryPressure or DiskPressure condition is True." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `Unknown` means the node controller has not heard from the node during the last `node-monitor-grace-period` (50 seconds by default): the kubelet is typically stopped, crashing or unable to reach the API server. The next step is on the node itself: `systemctl status kubelet`, then `journalctl -u kubelet`.
      options:
        a: { en: "A kubelet that reports the node as unhealthy sets `Ready` to `False`, not `Unknown`: it is still sending status updates." }
        b: { en: "Cordoning sets `spec.unschedulable` and shows `SchedulingDisabled` in `kubectl get nodes`; it does not change the `Ready` condition." }
        d: { en: "Pressure conditions are separate conditions reported by a working kubelet; they do not turn `Ready` into `Unknown`." }
    references:
      - title: Node Status
        url: https://kubernetes.io/docs/reference/node/node-status/

  # ------------------------------------------------------------------ 2
  - id: cka-qz-21-02
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        On control plane node `cp-1` (kubeadm), you run `kubectl -n kube-system delete pod kube-scheduler-cp-1`. The file `/etc/kubernetes/manifests/kube-scheduler.yaml` is not changed.

        What happens?
    body:
      options:
        - { id: a, text: { en: "The scheduler stays stopped until you run `kubectl apply -f` on the manifest file again." } }
        - { id: b, text: { en: "The kubelet keeps running the scheduler from the file, and the Pod object appears again in the API." } }
        - { id: c, text: { en: "The kubelet removes the manifest file, so the scheduler does not come back after the next reboot." } }
        - { id: d, text: { en: "The scheduler's Deployment in kube-system creates a replacement Pod on another control plane node." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `kube-scheduler-cp-1` is the mirror Pod of a static Pod: the API object only reflects what the kubelet runs from `/etc/kubernetes/manifests`. Deleting it does not stop the static Pod, and the kubelet recreates the mirror Pod. To change or stop a control plane component, edit or move its file on the node.
      options:
        a: { en: "Static Pods are not created through the API: the kubelet reads the file directly, so no `kubectl apply` is needed (or useful)." }
        c: { en: "The kubelet never deletes files in its static Pod directory; deleting the mirror Pod does not touch the manifest." }
        d: { en: "kubeadm runs the scheduler as a static Pod on each control plane node, not as a Deployment." }
    references:
      - title: Create static Pods
        url: https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/

  # ------------------------------------------------------------------ 3
  - id: cka-qz-21-03
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Worker node `node-2` was joined with kubeadm and uses the DEB packages. Its `/var/lib/kubelet/config.yaml` contains `maxPods: 110`. A colleague added the line `KUBELET_EXTRA_ARGS=--max-pods=60` to `/etc/default/kubelet`.

        You restart the kubelet. What is the maximum number of Pods on `node-2`?
    body:
      options:
        - { id: a, text: { en: "110, because the file given with `--config` takes precedence over command-line flags." } }
        - { id: b, text: { en: "60, because a command-line flag overrides the same setting in the configuration file." } }
        - { id: c, text: { en: "None, because the kubelet refuses to start when a setting is both a flag and in the file." } }
        - { id: d, text: { en: "110, until the `kubelet-config` ConfigMap in kube-system is updated with the new value." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Command-line flags that target the same value as the kubelet configuration file override it, and `KUBELET_EXTRA_ARGS` from `/etc/default/kubelet` comes last in the kubeadm drop-in's `ExecStart`, so it wins on conflicts. The node reports 60 allocatable Pods. `--max-pods` is deprecated in favour of the file, which is why such an override is easy to forget.
      options:
        a: { en: "The precedence is the other way round: flags (other than feature gates) have the highest priority over the configuration file." }
        c: { en: "A duplicated setting is not an error: the kubelet merges the sources and the flag value wins." }
        d: { en: "The `kubelet-config` ConfigMap is only read when kubeadm writes `config.yaml` (join, upgrade); the running kubelet reads its local file and flags." }
    references:
      - title: Set Kubelet Parameters Via A Configuration File
        url: https://kubernetes.io/docs/tasks/administer-cluster/kubelet-config-file/
      - title: Configuring each kubelet in your cluster using kubeadm
        url: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/kubelet-integration/

  # ------------------------------------------------------------------ 4
  - id: cka-qz-21-04
    objective: "2.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        `kubectl describe node node-7` shows the condition `DiskPressure` with the status `True`. The Deployment `web` in namespace `shop` has no tolerations, and the ReplicaSet is creating a new `web` Pod.

        What does the control plane do because of this condition, and what happens to the new Pod?
    body:
      options:
        - { id: a, text: { en: "It adds the taint `node.kubernetes.io/disk-pressure:NoSchedule`, so the scheduler does not place the new Pod on node-7." } }
        - { id: b, text: { en: "It adds the taint `node.kubernetes.io/disk-pressure:NoExecute`, which also evicts every running Pod without a toleration." } }
        - { id: c, text: { en: "It adds the taint `node.kubernetes.io/not-ready:NoExecute`, because a pressure condition sets the Ready condition to False." } }
        - { id: d, text: { en: "It adds no taint: the scheduler reads the DiskPressure condition itself and skips node-7 for the new Pod." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The node controller turns node conditions into taints with the `NoSchedule` effect: `DiskPressure=True` gives `node.kubernetes.io/disk-pressure:NoSchedule`. The scheduler checks taints, not conditions, so a Pod without a matching toleration is not placed on node-7. Running Pods are not evicted by a `NoSchedule` taint (the kubelet may still evict some to reclaim disk).
      options:
        b: { en: "Condition taints for pressure use `NoSchedule`; only `not-ready` and `unreachable` use `NoExecute`." }
        c: { en: "A pressure condition does not make `Ready` False; `not-ready` appears only when the kubelet reports the node unhealthy." }
        d: { en: "The scheduler deliberately reads taints rather than conditions; the control plane adds the taint for it." }
    references:
      - title: Taints and Tolerations
        url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/

  # ------------------------------------------------------------------ 5
  - id: cka-qz-21-05
    objective: "2.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Three control plane nodes run kube-apiserver behind a TCP load balancer that sends an HTTPS health check to port 6443 of each node. When an instance is running but temporarily unable to serve requests, for example while it waits for etcd, the load balancer must route traffic away from it. A failed health check must not mean that the instance needs a restart.

        Which path should the health check request?
    body:
      options:
        - { id: a, text: "`/livez`" }
        - { id: b, text: "`/healthz`" }
        - { id: c, text: "`/version`" }
        - { id: d, text: "`/readyz`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `/readyz` tells whether the API server is ready to accept traffic: it fails while the server initializes or cannot serve requests (for example while waiting for etcd), and traffic should then be routed away. Machines should rely on the HTTP status code (200 = ready), not on the `?verbose` output, which is meant for humans.
      options:
        a: { en: "`/livez` tells whether the API server should be restarted (deadlock, non-recoverable state); it is the liveness signal, not the traffic signal." }
        b: { en: "`/healthz` has been deprecated since v1.16 in favour of the more specific `/livez` and `/readyz`; only `/readyz` is the endpoint meant to say whether traffic should be sent (it also starts failing first during a graceful shutdown)." }
        c: { en: "`/version` only returns build information; it answers even when the server cannot serve requests that need etcd." }
    references:
      - title: Kubernetes API health endpoints
        url: https://kubernetes.io/docs/reference/using-api/health-checks/

  # ------------------------------------------------------------------ 6
  - id: cka-qz-21-06
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: command
    stem:
      en: |-
        Node `node-5` was reserved for the batch team. `kubectl describe node node-5` shows:

        ```text
        Taints:             dedicated=batch:NoExecute
                            dedicated=batch:NoSchedule
                            gpu=true:NoSchedule
        ```

        The reservation policy changes: the scheduler must still never place a Pod that does not tolerate `dedicated=batch` on `node-5`, but Pods bound to `node-5` (for example with `spec.nodeName`) must no longer be evicted because of the reservation. The `gpu` taint stays as it is.

        Remove only what is needed. Type the single command you would run.
    body:
      mode: invocation
      tools: [kubectl]
    answer:
      checks:
        - id: tool
          label: Uses kubectl
          path: tool
          op: equals
          value: kubectl
        - id: verb
          label: Uses kubectl taint
          path: verb
          op: equals
          value: taint
        - id: resource
          label: Targets a node
          path: resource
          op: equals
          value: node
        - id: node
          label: Targets node-5
          path: names
          op: contains
          value: node-5
        - id: remove-noexecute
          label: Removes the dedicated taint with the NoExecute effect (trailing dash)
          path: args
          op: matches
          value: '"dedicated(=batch)?:NoExecute-"'
        - id: keep-others
          label: Keeps the dedicated NoSchedule taint and the gpu taint
          path: args
          op: matches
          value: '^(?!.*(NoSchedule-|"dedicated-"|"gpu-"))'
      solution:
        - command: kubectl taint nodes node-5 dedicated=batch:NoExecute-
        - command: kubectl taint node node-5 dedicated:NoExecute-
        - command: k taint nodes node-5 dedicated:NoExecute-
      negatives:
        - command: kubectl taint nodes node-5 dedicated-
          why: A key alone with a dash removes every taint with that key, so the NoSchedule reservation disappears too and the scheduler may place any Pod on node-5.
        - command: kubectl taint nodes node-5 dedicated=batch:NoSchedule-
          why: This removes the scheduling barrier and keeps the NoExecute taint, which is the one that evicts Pods that do not tolerate it.
        - command: kubectl taint nodes node-5 dedicated=batch:NoExecute
          why: Without the trailing dash kubectl tries to add the taint (and fails because it already exists); nothing is removed.
        - command: kubectl uncordon node-5
          why: uncordon only clears spec.unschedulable and its node.kubernetes.io/unschedulable taint; taints added with kubectl taint stay.
    explanation:
      correct:
        en: 'A `NoExecute` taint evicts running Pods that do not tolerate it, while `NoSchedule` only keeps new Pods away from the scheduler. Removing just `dedicated=batch:NoExecute` meets both requirements: `kubectl taint nodes node-5 dedicated=batch:NoExecute-` (or `dedicated:NoExecute-`, key and effect) deletes that taint only, whereas `dedicated-` would delete every taint with the key.'
    references:
      - title: kubectl taint
        url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_taint/
      - title: Taints and Tolerations
        url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/

  # ------------------------------------------------------------------ 7
  - id: cka-qz-21-07
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: command
    stem:
      en: |-
        The disk controller of node `node-4` is failing and the node must be emptied now. It runs:

        - Pods of the DaemonSets `kube-proxy` (namespace `kube-system`) and `log-agent` (namespace `monitoring`);
        - both replicas of the Deployment `ledger` in namespace `payments`, which mount an `emptyDir` volume and are covered by the PodDisruptionBudget `ledger-pdb` (`minAvailable: 2`).

        Every Pod on the node has a controller. A first drain attempt kept retrying with `Cannot evict pod as it would violate the pod's disruption budget`. The owner of `ledger` accepts a short outage.

        With a single command, mark `node-4` unschedulable and remove its Pods without the PodDisruptionBudget check, and give up if the operation has not finished after 5 minutes. Type the single command you would run.
    body:
      mode: invocation
      tools: [kubectl]
    answer:
      checks:
        - id: tool
          label: Uses kubectl
          path: tool
          op: equals
          value: kubectl
        - id: verb
          label: Uses kubectl drain
          path: verb
          op: equals
          value: drain
        - id: node
          label: Drains node-4
          path: args
          op: contains
          value: node-4
        - id: daemonsets
          label: Ignores DaemonSet-managed Pods (--ignore-daemonsets)
          path: flags.ignore-daemonsets
          op: equals
          value: true
        - id: emptydir
          label: Accepts deleting emptyDir data (--delete-emptydir-data)
          path: flags.delete-emptydir-data
          op: equals
          value: true
        - id: no-eviction
          label: Deletes instead of evicting, bypassing PodDisruptionBudgets (--disable-eviction)
          path: flags.disable-eviction
          op: equals
          value: true
        - id: timeout
          label: Gives up after 5 minutes (--timeout)
          path: flags.timeout
          op: oneOf
          value: ["5m", "300s", "5m0s"]
      solution:
        - command: kubectl drain node-4 --ignore-daemonsets --delete-emptydir-data --disable-eviction --timeout=5m
        - command: k drain node-4 --disable-eviction --ignore-daemonsets --delete-emptydir-data --timeout 300s
        - command: kubectl drain --ignore-daemonsets --delete-emptydir-data --disable-eviction --timeout=5m0s node-4
      negatives:
        - command: kubectl drain node-4 --ignore-daemonsets --delete-emptydir-data --force --timeout=5m
          why: --force only allows deleting Pods that have no controller; the Pods are still evicted through the Eviction API, so the PodDisruptionBudget keeps blocking.
        - command: kubectl drain node-4 --ignore-daemonsets --disable-eviction --timeout=5m
          why: Without --delete-emptydir-data, drain refuses to remove the ledger Pods because they use emptyDir volumes.
        - command: kubectl drain node-4 --ignore-daemonsets --delete-emptydir-data --disable-eviction --grace-period=300
          why: --grace-period sets how long each Pod gets to terminate; it does not limit how long drain waits before giving up (that is --timeout).
        - command: kubectl drain node-4 --delete-emptydir-data --disable-eviction --timeout=5m
          why: Without --ignore-daemonsets, drain does not proceed while DaemonSet Pods run on the node.
    explanation:
      correct:
        en: '`kubectl drain` cordons the node, then evicts Pods through the Eviction API, which honours PodDisruptionBudgets: with `minAvailable: 2` and both replicas on node-4, eviction is refused forever. `--disable-eviction` makes drain use plain DELETE and skips the budget check; `--ignore-daemonsets` and `--delete-emptydir-data` are still needed for the DaemonSet Pods and the emptyDir volumes, and `--timeout=5m` bounds the wait.'
    references:
      - title: kubectl drain
        url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_drain/
      - title: Safely Drain a Node
        url: https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/

  # ------------------------------------------------------------------ 8
  - id: cka-qz-21-08
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: manifest
    stem:
      en: |-
        On control plane node `cp-1` (IP 10.0.0.10, single control plane created by kubeadm), a colleague edited the CA-related flags of `/etc/kubernetes/manifests/kube-apiserver.yaml` this morning. Since then the `kube-apiserver` container is `Running`, but `kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes` answers `error: You must be logged in to the server (Unauthorized)` and the nodes are turning `NotReady`. `apiserver-log.txt` is an extract of `crictl logs` for the API server container, and `ls-pki.txt` lists `/etc/kubernetes/pki`.

        The editor contains the manifest (the probes are left out). Write the corrected manifest: every CA flag must point to the CA file that kubeadm configures for it. Change nothing else.
    body:
      starter: |
        apiVersion: v1
        kind: Pod
        metadata:
          labels:
            component: kube-apiserver
            tier: control-plane
          name: kube-apiserver
          namespace: kube-system
        spec:
          containers:
          - command:
            - kube-apiserver
            - --advertise-address=10.0.0.10
            - --allow-privileged=true
            - --authorization-mode=Node,RBAC
            - --client-ca-file=/etc/kubernetes/pki/front-proxy-ca.crt
            - --enable-admission-plugins=NodeRestriction
            - --enable-bootstrap-token-auth=true
            - --etcd-cafile=/etc/kubernetes/pki/etcd/ca.crt
            - --etcd-certfile=/etc/kubernetes/pki/apiserver-etcd-client.crt
            - --etcd-keyfile=/etc/kubernetes/pki/apiserver-etcd-client.key
            - --etcd-servers=https://127.0.0.1:2379
            - --kubelet-client-certificate=/etc/kubernetes/pki/apiserver-kubelet-client.crt
            - --kubelet-client-key=/etc/kubernetes/pki/apiserver-kubelet-client.key
            - --proxy-client-cert-file=/etc/kubernetes/pki/front-proxy-client.crt
            - --proxy-client-key-file=/etc/kubernetes/pki/front-proxy-client.key
            - --requestheader-allowed-names=front-proxy-client
            - --requestheader-client-ca-file=/etc/kubernetes/pki/ca.crt
            - --requestheader-extra-headers-prefix=X-Remote-Extra-
            - --requestheader-group-headers=X-Remote-Group
            - --requestheader-username-headers=X-Remote-User
            - --secure-port=6443
            - --service-account-issuer=https://kubernetes.default.svc.cluster.local
            - --service-account-key-file=/etc/kubernetes/pki/sa.pub
            - --service-account-signing-key-file=/etc/kubernetes/pki/sa.key
            - --service-cluster-ip-range=10.96.0.0/12
            - --tls-cert-file=/etc/kubernetes/pki/apiserver.crt
            - --tls-private-key-file=/etc/kubernetes/pki/apiserver.key
            image: registry.k8s.io/kube-apiserver:v1.37.1
            imagePullPolicy: IfNotPresent
            name: kube-apiserver
            volumeMounts:
            - mountPath: /etc/ssl/certs
              name: ca-certs
              readOnly: true
            - mountPath: /etc/kubernetes/pki
              name: k8s-certs
              readOnly: true
          hostNetwork: true
          priorityClassName: system-node-critical
          volumes:
          - hostPath:
              path: /etc/ssl/certs
              type: DirectoryOrCreate
            name: ca-certs
          - hostPath:
              path: /etc/kubernetes/pki
              type: DirectoryOrCreate
            name: k8s-certs
      files:
        - name: apiserver-log.txt
          content: |
            E1127 09:02:17.481920       1 authentication.go:75] "Unable to authenticate the request" err="[x509: certificate signed by unknown authority, verifying certificate SN=5807213369210754023, SKID=, AKID=3C:1A:9E:57:0B:44:D2:81 failed: x509: certificate signed by unknown authority]"
            E1127 09:02:17.903355       1 authentication.go:75] "Unable to authenticate the request" err="[x509: certificate signed by unknown authority, verifying certificate SN=2214978530146812297, SKID=, AKID=3C:1A:9E:57:0B:44:D2:81 failed: x509: certificate signed by unknown authority]"
        - name: ls-pki.txt
          content: |
            # ls /etc/kubernetes/pki
            apiserver-etcd-client.crt     apiserver.crt  ca.key  front-proxy-ca.crt      front-proxy-client.key
            apiserver-etcd-client.key     apiserver.key  etcd    front-proxy-ca.key      sa.key
            apiserver-kubelet-client.crt  ca.crt         front-proxy-client.crt      sa.pub
            apiserver-kubelet-client.key
    answer:
      checks:
        - id: client-ca
          label: --client-ca-file is the cluster CA /etc/kubernetes/pki/ca.crt
          path: spec.containers[name=kube-apiserver].command
          op: contains
          value: --client-ca-file=/etc/kubernetes/pki/ca.crt
        - id: client-ca-last
          label: The effective (last) --client-ca-file is the cluster CA
          path: spec.containers[name=kube-apiserver].command
          op: matches
          value: '"--client-ca-file=/etc/kubernetes/pki/ca\.crt"(?!.*"--client-ca-file=)'
        - id: requestheader-ca
          label: --requestheader-client-ca-file is the front-proxy CA /etc/kubernetes/pki/front-proxy-ca.crt
          path: spec.containers[name=kube-apiserver].command
          op: contains
          value: --requestheader-client-ca-file=/etc/kubernetes/pki/front-proxy-ca.crt
        - id: requestheader-ca-last
          label: The effective (last) --requestheader-client-ca-file is the front-proxy CA
          path: spec.containers[name=kube-apiserver].command
          op: matches
          value: '"--requestheader-client-ca-file=/etc/kubernetes/pki/front-proxy-ca\.crt"(?!.*"--requestheader-client-ca-file=)'
        - id: etcd-ca
          label: --etcd-cafile stays the etcd CA
          path: spec.containers[name=kube-apiserver].command
          op: contains
          value: --etcd-cafile=/etc/kubernetes/pki/etcd/ca.crt
        - id: tls-cert
          label: The serving certificate is unchanged
          path: spec.containers[name=kube-apiserver].command
          op: contains
          value: --tls-cert-file=/etc/kubernetes/pki/apiserver.crt
        - id: proxy-client
          label: The front-proxy client certificate is unchanged
          path: spec.containers[name=kube-apiserver].command
          op: contains
          value: --proxy-client-cert-file=/etc/kubernetes/pki/front-proxy-client.crt
        - id: kubelet-client
          label: The kubelet client certificate is unchanged
          path: spec.containers[name=kube-apiserver].command
          op: contains
          value: --kubelet-client-certificate=/etc/kubernetes/pki/apiserver-kubelet-client.crt
        - id: image
          label: The image is unchanged
          path: spec.containers[name=kube-apiserver].image
          op: equals
          value: registry.k8s.io/kube-apiserver:v1.37.1
        - id: certs-volume
          label: /etc/kubernetes/pki is still mounted from the host
          path: spec.volumes[name=k8s-certs].hostPath.path
          op: equals
          value: /etc/kubernetes/pki
      solution:
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              labels:
                component: kube-apiserver
                tier: control-plane
              name: kube-apiserver
              namespace: kube-system
            spec:
              containers:
              - command:
                - kube-apiserver
                - --advertise-address=10.0.0.10
                - --allow-privileged=true
                - --authorization-mode=Node,RBAC
                - --client-ca-file=/etc/kubernetes/pki/ca.crt
                - --enable-admission-plugins=NodeRestriction
                - --enable-bootstrap-token-auth=true
                - --etcd-cafile=/etc/kubernetes/pki/etcd/ca.crt
                - --etcd-certfile=/etc/kubernetes/pki/apiserver-etcd-client.crt
                - --etcd-keyfile=/etc/kubernetes/pki/apiserver-etcd-client.key
                - --etcd-servers=https://127.0.0.1:2379
                - --kubelet-client-certificate=/etc/kubernetes/pki/apiserver-kubelet-client.crt
                - --kubelet-client-key=/etc/kubernetes/pki/apiserver-kubelet-client.key
                - --proxy-client-cert-file=/etc/kubernetes/pki/front-proxy-client.crt
                - --proxy-client-key-file=/etc/kubernetes/pki/front-proxy-client.key
                - --requestheader-allowed-names=front-proxy-client
                - --requestheader-client-ca-file=/etc/kubernetes/pki/front-proxy-ca.crt
