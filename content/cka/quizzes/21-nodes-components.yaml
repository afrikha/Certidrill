  # ------------------------------------------------------------------ 9
  - id: cka-qz-21-09
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: manifest
    stem:
      en: |-
        Worker node `node-6` is `NotReady` and its kubelet restarts in a loop. Yesterday a colleague edited `/var/lib/kubelet/config.yaml` so that a monitoring tool could read the kubelet API on port 10250 without credentials, and "tidied up" a path at the same time. `kubelet-journal.txt` shows the first error after the last start, and `ls-pki.txt` lists `/etc/kubernetes/pki` on `node-6`.

        The editor contains the file. Write the corrected file so that the kubelet starts and its API is protected again as kubeadm configures it:

        - requests that present a client certificate signed by the cluster CA, or a bearer token the API server validates, are authenticated;
        - requests without such credentials are rejected;
        - every request is authorized by the API server.

        Keep the other settings (you restart the kubelet afterwards).
    body:
      starter: |
        apiVersion: kubelet.config.k8s.io/v1beta1
        kind: KubeletConfiguration
        authentication:
          anonymous:
            enabled: true
          webhook:
            cacheTTL: 0s
            enabled: true
          x509:
            clientCAFile: /etc/kubernetes/pki/ca.pem
        authorization:
          mode: AlwaysAllow
          webhook:
            cacheAuthorizedTTL: 0s
            cacheUnauthorizedTTL: 0s
        cgroupDriver: systemd
        clusterDNS:
        - 10.96.0.10
        clusterDomain: cluster.local
        containerRuntimeEndpoint: unix:///var/run/containerd/containerd.sock
        rotateCertificates: true
        staticPodPath: /etc/kubernetes/manifests
      files:
        - name: kubelet-journal.txt
          content: |
            node-6 kubelet[3120]: E1127 07:41:09.553120    3120 run.go:72] "command failed" err="failed to construct kubelet dependencies: unable to load client CA file /etc/kubernetes/pki/ca.pem: open /etc/kubernetes/pki/ca.pem: no such file or directory"
            node-6 systemd[1]: kubelet.service: Main process exited, code=exited, status=1/FAILURE
        - name: ls-pki.txt
          content: |
            # ls /etc/kubernetes/pki
            ca.crt
    answer:
      checks:
        - id: kind
          label: The document is a KubeletConfiguration
          path: kind
          op: equals
          value: KubeletConfiguration
        - id: client-ca
          label: clientCAFile is the cluster CA /etc/kubernetes/pki/ca.crt
          path: authentication.x509.clientCAFile
          op: equals
          value: /etc/kubernetes/pki/ca.crt
        - id: no-anonymous
          label: Anonymous requests are not enabled (enabled false, or left to the file default false)
          path: authentication
          op: matches
          value: '^(?!.*"anonymous":\{"enabled":(true|"true")\})'
        - id: webhook-authn
          label: Bearer token (webhook) authentication is not disabled
          path: authentication
          op: matches
          value: '^(?!.*"webhook":\{[^{}]*"enabled":(false|"false"))'
        - id: webhook-authz
          label: Authorization is not AlwaysAllow (Webhook, the file default)
          path: .
          op: matches
          value: '^(?!.*"mode":"AlwaysAllow")'
        - id: endpoint
          label: containerRuntimeEndpoint is unchanged
          path: containerRuntimeEndpoint
          op: equals
          value: unix:///var/run/containerd/containerd.sock
        - id: static-pods
          label: staticPodPath is unchanged
          path: staticPodPath
          op: equals
          value: /etc/kubernetes/manifests
        - id: dns
          label: clusterDNS is unchanged
          path: clusterDNS
          op: contains
          value: 10.96.0.10
      solution:
        - manifest: |
            apiVersion: kubelet.config.k8s.io/v1beta1
            kind: KubeletConfiguration
            authentication:
              anonymous:
                enabled: false
              webhook:
                cacheTTL: 0s
                enabled: true
              x509:
                clientCAFile: /etc/kubernetes/pki/ca.crt
            authorization:
              mode: Webhook
              webhook:
                cacheAuthorizedTTL: 0s
                cacheUnauthorizedTTL: 0s
            cgroupDriver: systemd
            clusterDNS:
            - 10.96.0.10
            clusterDomain: cluster.local
            containerRuntimeEndpoint: unix:///var/run/containerd/containerd.sock
            rotateCertificates: true
            staticPodPath: /etc/kubernetes/manifests
        - manifest: |
            apiVersion: kubelet.config.k8s.io/v1beta1
            kind: KubeletConfiguration
            authentication:
              webhook:
                enabled: true
              x509:
                clientCAFile: /etc/kubernetes/pki/ca.crt
            cgroupDriver: systemd
            clusterDNS:
            - 10.96.0.10
            clusterDomain: cluster.local
            containerRuntimeEndpoint: unix:///var/run/containerd/containerd.sock
            rotateCertificates: true
            staticPodPath: /etc/kubernetes/manifests
      negatives:
        - manifest: |
            apiVersion: kubelet.config.k8s.io/v1beta1
            kind: KubeletConfiguration
            authentication:
              anonymous:
                enabled: true
              webhook:
                cacheTTL: 0s
                enabled: true
              x509:
                clientCAFile: /etc/kubernetes/pki/ca.crt
            authorization:
              mode: AlwaysAllow
            cgroupDriver: systemd
            clusterDNS:
            - 10.96.0.10
            clusterDomain: cluster.local
            containerRuntimeEndpoint: unix:///var/run/containerd/containerd.sock
            rotateCertificates: true
            staticPodPath: /etc/kubernetes/manifests
          why: The kubelet starts, but anyone who reaches port 10250 can still read logs or run commands in containers without credentials.
        - manifest: |
            apiVersion: kubelet.config.k8s.io/v1beta1
            kind: KubeletConfiguration
            authentication:
              anonymous:
                enabled: false
              webhook:
                cacheTTL: 0s
                enabled: true
              x509:
                clientCAFile: /etc/kubernetes/pki/ca.crt
            authorization:
              mode: AlwaysAllow
            cgroupDriver: systemd
            clusterDNS:
            - 10.96.0.10
            clusterDomain: cluster.local
            containerRuntimeEndpoint: unix:///var/run/containerd/containerd.sock
            rotateCertificates: true
            staticPodPath: /etc/kubernetes/manifests
          why: AlwaysAllow lets every authenticated identity do anything on the kubelet API; Webhook mode asks the API server (SubjectAccessReview) for each request.
        - manifest: |
            apiVersion: kubelet.config.k8s.io/v1beta1
            kind: KubeletConfiguration
            authentication:
              anonymous:
                enabled: false
              webhook:
                enabled: true
            authorization:
              mode: Webhook
            cgroupDriver: systemd
            clusterDNS:
            - 10.96.0.10
            clusterDomain: cluster.local
            containerRuntimeEndpoint: unix:///var/run/containerd/containerd.sock
            rotateCertificates: true
            staticPodPath: /etc/kubernetes/manifests
          why: Without clientCAFile the kubelet no longer accepts client certificates, so the API server (apiserver-kubelet-client certificate) gets 401 and kubectl logs or exec fail on this node.
        - manifest: |
            apiVersion: kubelet.config.k8s.io/v1beta1
            kind: KubeletConfiguration
            authentication:
              anonymous:
                enabled: false
              webhook:
                enabled: false
              x509:
                clientCAFile: /etc/kubernetes/pki/ca.crt
            authorization:
              mode: Webhook
            cgroupDriver: systemd
            clusterDNS:
            - 10.96.0.10
            clusterDomain: cluster.local
            containerRuntimeEndpoint: unix:///var/run/containerd/containerd.sock
            rotateCertificates: true
            staticPodPath: /etc/kubernetes/manifests
          why: With webhook authentication disabled, bearer tokens such as ServiceAccount tokens (used by metrics and monitoring agents) are no longer validated, so those requests are rejected.
    explanation:
      correct:
        en: 'The kubelet exits because `clientCAFile` names a file that does not exist: the cluster CA on the node is `/etc/kubernetes/pki/ca.crt`. Then remove the relaxations: anonymous authentication disabled (the file default is also `false`), webhook token authentication enabled, and `authorization.mode: Webhook` (the file default; the flag default is `AlwaysAllow`). A changed `config.yaml` only needs `systemctl restart kubelet`.'
    references:
      - title: Kubelet Configuration (v1beta1)
        url: https://kubernetes.io/docs/reference/config-api/kubelet-config.v1beta1/
      - title: Kubelet authentication/authorization
        url: https://kubernetes.io/docs/reference/access-authn-authz/kubelet-authn-authz/

  # ------------------------------------------------------------------ 10
  - id: cka-qz-21-10
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: manifest
    stem:
      en: |-
        On control plane node `cp-1` (IP 10.0.0.10, stacked etcd created by kubeadm), every `kubectl` command fails with `The connection to the server 10.0.0.10:6443 was refused` since a colleague "tidied up" the static Pod manifests. As root on `cp-1` you collected:

        - `crictl-ps.txt`: the output of `crictl ps -a`;
        - `apiserver-log.txt`: the end of `crictl logs` for the latest `kube-apiserver` container;
        - `etcd-log.txt`: the end of `crictl logs` for the latest `etcd` container;
        - `ls-pki-etcd.txt`: the content of `/etc/kubernetes/pki/etcd`.

        The editor contains `/etc/kubernetes/manifests/etcd.yaml` (the image line and the probes are left out). Write the corrected manifest. Fix only the cause: do not move files on the node, do not change etcd's flags, and give etcd access to its own certificate directory only, as kubeadm does.
    body:
      starter: |
        apiVersion: v1
        kind: Pod
        metadata:
          labels:
            component: etcd
            tier: control-plane
          name: etcd
          namespace: kube-system
        spec:
          containers:
          - command:
            - etcd
            - --advertise-client-urls=https://10.0.0.10:2379
            - --cert-file=/etc/kubernetes/pki/etcd/server.crt
            - --client-cert-auth=true
            - --data-dir=/var/lib/etcd
            - --initial-advertise-peer-urls=https://10.0.0.10:2380
            - --initial-cluster=cp-1=https://10.0.0.10:2380
            - --key-file=/etc/kubernetes/pki/etcd/server.key
            - --listen-client-urls=https://127.0.0.1:2379,https://10.0.0.10:2379
            - --listen-metrics-urls=http://127.0.0.1:2381
            - --listen-peer-urls=https://10.0.0.10:2380
            - --name=cp-1
            - --peer-cert-file=/etc/kubernetes/pki/etcd/peer.crt
            - --peer-client-cert-auth=true
            - --peer-key-file=/etc/kubernetes/pki/etcd/peer.key
            - --peer-trusted-ca-file=/etc/kubernetes/pki/etcd/ca.crt
            - --snapshot-count=10000
            - --trusted-ca-file=/etc/kubernetes/pki/etcd/ca.crt
            imagePullPolicy: IfNotPresent
            name: etcd
            volumeMounts:
            - mountPath: /var/lib/etcd
              name: etcd-data
            - mountPath: /etc/kubernetes/pki/etcd
              name: etcd-certs
          hostNetwork: true
          priorityClassName: system-node-critical
          volumes:
          - hostPath:
              path: /etc/kubernetes/etcd/pki
              type: DirectoryOrCreate
            name: etcd-certs
          - hostPath:
              path: /var/lib/etcd
              type: DirectoryOrCreate
            name: etcd-data
      files:
        - name: crictl-ps.txt
          content: |
            CONTAINER       IMAGE           CREATED          STATE     NAME                      ATTEMPT   POD ID          POD
            4c2d81f0e7a93   9b1f6e2d7c40a   12 seconds ago   Exited    etcd                      7         a83e5c9d1b2f4   etcd-cp-1
            e91b7a3c5d602   5d3a8c1f9e27b   48 seconds ago   Exited    kube-apiserver            9         2f6b0d8e4c1a7   kube-apiserver-cp-1
            1a7f3e9c2b8d5   7e2c9a4b6d1f8   3 hours ago      Running   kube-scheduler            0         c4d9e1f7a3b20   kube-scheduler-cp-1
            b5e8d2a6f1c39   3f8a1d7c5e9b2   3 hours ago      Running   kube-controller-manager   0         d7a2c5e9b1f46   kube-controller-manager-cp-1
        - name: apiserver-log.txt
          content: |
            W1127 08:15:40.102331       1 logging.go:55] [core] [Channel #5 SubChannel #6]grpc: addrConn.createTransport failed to connect to {Addr: "127.0.0.1:2379", ServerName: "127.0.0.1:2379", }. Err: connection error: desc = "transport: Error while dialing: dial tcp 127.0.0.1:2379: connect: connection refused"
            F1127 08:15:59.873210       1 instance.go:226] Error creating leases: error creating storage factory: context deadline exceeded
        - name: etcd-log.txt
          content: |
            {"level":"info","ts":"2026-11-27T08:16:27.311Z","msg":"configuring peer listeners","listen-peer-urls":["https://10.0.0.10:2380"]}
            {"level":"error","ts":"2026-11-27T08:16:27.312Z","msg":"creating peer listener failed","error":"open /etc/kubernetes/pki/etcd/peer.crt: no such file or directory"}
            {"level":"fatal","ts":"2026-11-27T08:16:27.312Z","msg":"discovery failed","error":"open /etc/kubernetes/pki/etcd/peer.crt: no such file or directory"}
