                  type: DirectoryOrCreate
                name: etcd-certs
              - hostPath:
                  path: /var/lib/etcd
                  type: DirectoryOrCreate
                name: etcd-data
          why: The node directory is right, but it is now mounted at /etc/kubernetes/etcd/pki in the container, while the flags read /etc/kubernetes/pki/etcd.
    explanation:
      correct:
        en: 'Follow the chain: the API server exits because nothing answers on 127.0.0.1:2379, etcd exits because it cannot open `/etc/kubernetes/pki/etcd/peer.crt`, yet the file exists on the node. The flags are right; the `etcd-certs` volume mounts `/etc/kubernetes/etcd/pki`, an empty directory created by `DirectoryOrCreate`, over `/etc/kubernetes/pki/etcd` in the container. Set its `hostPath.path` back to `/etc/kubernetes/pki/etcd`; when the file is saved the kubelet recreates etcd, then the API server.'
