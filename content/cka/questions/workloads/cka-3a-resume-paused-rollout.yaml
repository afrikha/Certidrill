id: cka-3a-resume-paused-rollout
objective: "3.1.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    A colleague updated the image of Deployment `web` in namespace `shop`, but no new ReplicaSet was created and the old Pods are still running. `kubectl describe deployment web -n shop` shows:

    ```text
    Conditions:
      Type           Status   Reason
      ----           ------   ------
      Available      True     MinimumReplicasAvailable
      Progressing    Unknown  DeploymentPaused
    ```

    Let the pending change roll out.

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: rollout
    label: It is a rollout command
    path: verb
    op: equals
    value: rollout
  - id: resume
    label: Uses rollout resume
    path: subverb
    op: equals
    value: resume
  - id: target
    label: Targets a Deployment
    path: resource
    op: equals
    value: deployment
  - id: name
    label: Names the Deployment web
    path: names
    op: contains
    value: web
  - id: namespace
    label: Runs in namespace shop
    path: flags.namespace
    op: equals
    value: shop
  solution:
  - command: kubectl rollout resume deployment/web -n shop
  - command: k -n shop rollout resume deploy web
  negatives:
  - command: kubectl rollout restart deployment/web -n shop
    why: kubectl refuses to restart a paused Deployment; the rollout must be resumed first.
  - command: kubectl rollout undo deployment/web -n shop
    why: A paused Deployment cannot be rolled back until it is resumed, and undo is not what is asked.
  - command: kubectl rollout resume deployment/web
    why: Without -n the command looks for web in the context namespace, default.
explanation:
  correct:
    en: 'The `Progressing` condition with reason `DeploymentPaused` shows that `.spec.paused` is true: template changes are recorded but do not start a rollout. `kubectl rollout resume deployment/web -n shop` clears the flag and the controller creates the new ReplicaSet. A paused Deployment can be neither rolled back nor restarted with `rollout restart`.'
references:
- title: Deployments
  url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
