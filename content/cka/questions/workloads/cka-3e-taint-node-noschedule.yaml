id: cka-3e-taint-node-noschedule
objective: "3.5.2"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    Node `worker-3` gets GPUs and must be reserved for the ML team. Add a taint with key `dedicated` and value `gpu` so that:

    - the scheduler never places a new Pod without a matching toleration on `worker-3`;
    - the Pods already running on `worker-3` keep running.

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: taint
    label: Uses kubectl taint
    path: verb
    op: equals
    value: taint
  - id: node-type
    label: Targets a node
    path: resource
    op: equals
    value: node
  - id: node
    label: Targets worker-3
    path: names
    op: contains
    value: worker-3
  - id: spec
    label: Adds dedicated=gpu:NoSchedule
    path: args
    op: contains
    value: dedicated=gpu:NoSchedule
  solution:
  - command: kubectl taint nodes worker-3 dedicated=gpu:NoSchedule
  - command: k taint node/worker-3 dedicated=gpu:NoSchedule
  negatives:
  - command: kubectl taint nodes worker-3 dedicated=gpu:NoExecute
    why: NoExecute also evicts the running Pods that do not tolerate the taint.
  - command: kubectl taint nodes worker-3 dedicated=gpu:PreferNoSchedule
    why: PreferNoSchedule is only a preference; the scheduler can still place Pods without a toleration on the node.
  - command: kubectl label node worker-3 dedicated=gpu
    why: A label attracts Pods that select it but repels nothing; only a taint keeps other Pods away.
  - command: kubectl taint nodes worker-3 dedicated=gpu:NoSchedule-
    why: The trailing dash removes the taint instead of adding it.
explanation:
  correct:
    en: '`kubectl taint nodes NODE key=value:effect` adds a taint. `NoSchedule` stops new Pods without a matching toleration from being scheduled on the node but leaves running Pods alone; `PreferNoSchedule` is a soft version, and `NoExecute` also evicts running Pods that do not tolerate it. Appending `-` (`dedicated=gpu:NoSchedule-`, `dedicated:NoSchedule-` or `dedicated-`) removes taints.'
references:
- title: Taints and Tolerations
  url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
- title: kubectl taint
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_taint/
