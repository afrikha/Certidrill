id: cka-3b-secret-from-env-file
objective: "3.2.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    The file `db.env` in the current directory holds two `KEY=VALUE` lines. In namespace `shop`, create a generic Secret named `db-env` in which each variable of the file becomes its own key (`DB_USER` and `DB_PASSWORD`).

    Type the single command you would run.
body:
  mode: object
  namespace: default
  files:
  - name: db.env
    content: |
      DB_USER=orders
      DB_PASSWORD=s3cr3t-Pa55
answer:
  checks:
  - id: kind
    label: The object is a Secret
    path: kind
    op: equals
    value: Secret
  - id: meta
    label: Named db-env in namespace shop
    path: metadata
    op: subset
    value: {name: db-env, namespace: shop}
  - id: user
    label: Key DB_USER holds orders (base64 b3JkZXJz)
    path: data.DB_USER
    op: equals
    value: b3JkZXJz
  - id: password
    label: Key DB_PASSWORD holds s3cr3t-Pa55 (base64 czNjcjN0LVBhNTU=)
    path: data.DB_PASSWORD
    op: equals
    value: czNjcjN0LVBhNTU=
  - id: no-file-key
    label: There is no single key named db.env
    path: data["db.env"]
    op: absent
  solution:
  - command: kubectl create secret generic db-env --from-env-file=db.env -n shop
    output: |
      apiVersion: v1
      data:
        DB_PASSWORD: czNjcjN0LVBhNTU=
        DB_USER: b3JkZXJz
      kind: Secret
      metadata:
        name: db-env
        namespace: shop
  - command: k create secret generic db-env --namespace=shop --from-env-file ./db.env
    output: |
      apiVersion: v1
      data:
        DB_PASSWORD: czNjcjN0LVBhNTU=
        DB_USER: b3JkZXJz
      kind: Secret
      metadata:
        name: db-env
        namespace: shop
  negatives:
  - command: kubectl create secret generic db-env --from-file=db.env -n shop
    why: --from-file stores the whole file under one key, db.env, instead of one key per variable.
    output: |
      apiVersion: v1
      data:
        db.env: REJfVVNFUj1vcmRlcnMKREJfUEFTU1dPUkQ9czNjcjN0LVBhNTUK
      kind: Secret
      metadata:
        name: db-env
        namespace: shop
  - command: kubectl create configmap db-env --from-env-file=db.env -n shop
    why: This creates a ConfigMap; a password belongs in a Secret.
    output: |
      apiVersion: v1
      data:
        DB_PASSWORD: s3cr3t-Pa55
        DB_USER: orders
      kind: ConfigMap
      metadata:
        name: db-env
        namespace: shop
explanation:
  correct:
    en: '`kubectl create secret generic NAME --from-env-file=FILE` reads `KEY=VALUE` lines and creates one key per variable, base64-encoded in `data` (`orders` → `b3JkZXJz`). `--from-file=db.env` would store the whole file under a single key named `db.env`. The resulting Secret can then be loaded at once with `envFrom.secretRef`.'
references:
- title: kubectl create secret generic
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_secret_generic/
