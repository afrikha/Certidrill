id: cka-3b-configmap-secret-manifest
objective: "3.2.1"
difficulty: 2
status: draft
type: manifest
stem:
  en: |-
    Write one file with two objects for namespace `shop`:

    - ConfigMap `proxy-config` with a key `LOG_LEVEL` set to `warn` and a key `nginx.conf` whose value is the two lines `listen 8080;` and `server_name shop.example.com;`. Its data must not be modifiable after creation.
    - generic (`Opaque`) Secret `proxy-token` with a key `API_TOKEN` whose value is `tok-5e1f-demo`. Write the value in plain text in the manifest (do not base64-encode it yourself).
body:
  starter: ""
answer:
  checks:
  - id: cm
    label: ConfigMap proxy-config in namespace shop
    select: {kind: ConfigMap, name: proxy-config}
    path: metadata.namespace
    op: equals
    value: shop
  - id: cm-level
    label: LOG_LEVEL is warn
    select: {kind: ConfigMap, name: proxy-config}
    path: data.LOG_LEVEL
    op: equals
    value: warn
  - id: cm-conf
    label: nginx.conf holds both lines
    select: {kind: ConfigMap, name: proxy-config}
    path: data["nginx.conf"]
    op: matches
    value: 'listen 8080;\s*\n\s*server_name shop\.example\.com;'
  - id: cm-immutable
    label: The ConfigMap is immutable
    select: {kind: ConfigMap, name: proxy-config}
    path: immutable
    op: equals
    value: true
  - id: secret
    label: Secret proxy-token in namespace shop
    select: {kind: Secret, name: proxy-token}
    path: metadata.namespace
    op: equals
    value: shop
  - id: secret-token
    label: API_TOKEN is given in plain text under stringData
    select: {kind: Secret, name: proxy-token}
    path: stringData.API_TOKEN
    op: equals
    value: tok-5e1f-demo
  solution:
  - manifest: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: proxy-config
        namespace: shop
      data:
        LOG_LEVEL: warn
        nginx.conf: |
          listen 8080;
          server_name shop.example.com;
      immutable: true
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: proxy-token
        namespace: shop
      type: Opaque
      stringData:
        API_TOKEN: tok-5e1f-demo
  - manifest: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: proxy-token
        namespace: shop
      type: Opaque
      stringData:
        API_TOKEN: "tok-5e1f-demo"
      ---
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: proxy-config
        namespace: shop
      immutable: true
      data:
        nginx.conf: "listen 8080;\nserver_name shop.example.com;\n"
        LOG_LEVEL: "warn"
  negatives:
  - manifest: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: proxy-config
        namespace: shop
      data:
        LOG_LEVEL: warn
        nginx.conf: |
          listen 8080;
          server_name shop.example.com;
      immutable: true
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: proxy-token
        namespace: shop
      type: Opaque
      data:
        API_TOKEN: tok-5e1f-demo
    why: Values under data must be base64; the API server rejects tok-5e1f-demo as illegal base64 data. Plain text goes under stringData.
  - manifest: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: proxy-config
        namespace: shop
        annotations:
          immutable: "true"
      data:
        LOG_LEVEL: warn
        nginx.conf: |
          listen 8080;
          server_name shop.example.com;
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: proxy-token
        namespace: shop
      type: Opaque
      stringData:
        API_TOKEN: tok-5e1f-demo
    why: An annotation has no effect; immutability is the top-level field immutable true.
  - manifest: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: proxy-config
        namespace: shop
      data:
        LOG_LEVEL: warn
        nginx.conf: listen 8080; server_name shop.example.com;
      immutable: true
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: proxy-token
        namespace: shop
      type: Opaque
      stringData:
        API_TOKEN: tok-5e1f-demo
    why: Written on one line, the value has no line break between the two directives; a literal block (|) keeps the two lines.
explanation:
  correct:
    en: 'A multi-line ConfigMap value is written as a YAML literal block (`|`), and the top-level field `immutable: true` locks `data` (the ConfigMap can then only be deleted and recreated). In a Secret, `stringData` accepts plain text that the API server encodes into `data`; values written directly under `data` must already be base64.'
references:
- title: ConfigMaps
  url: https://kubernetes.io/docs/concepts/configuration/configmap/
- title: Managing Secrets using kubectl
  url: https://kubernetes.io/docs/tasks/configmap-secret/managing-secret-using-kubectl/
