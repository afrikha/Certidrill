id: cka-3e-describe-node-allocated
objective: "3.5.3"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    A Pod that requests 2 CPU stays Pending with `0/3 nodes are available: 1 Insufficient cpu, ...`, although `kubectl top node worker-1` shows `worker-1` at 15 % CPU usage.

    Display, for `worker-1`, its allocatable resources together with the sum of the CPU and memory requests and limits of the Pods already scheduled on it. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: describe
    label: Uses kubectl describe
    path: verb
    op: equals
    value: describe
  - id: node-type
    label: Describes a node
    path: resource
    op: equals
    value: node
  - id: node
    label: Describes worker-1
    path: names
    op: contains
    value: worker-1
  solution:
  - command: kubectl describe node worker-1
  - command: k describe no/worker-1
  negatives:
  - command: kubectl top node worker-1
    why: top shows measured usage from metrics-server; the scheduler compares requests with allocatable, not usage.
  - command: kubectl get node worker-1 -o wide
    why: The wide table shows status, roles, version and addresses, not allocatable resources or the requests already allocated.
  - command: kubectl describe pod worker-1
    why: worker-1 is a node, not a Pod.
explanation:
  correct:
    en: '`kubectl describe node worker-1` prints Capacity, Allocatable, the list of non-terminated Pods with their requests and limits, and the "Allocated resources" totals. The scheduler places a Pod only if the sum of the requests on the node plus the new Pod''s requests fits in Allocatable; actual usage (`kubectl top`) does not count, so a lightly used node can still be full.'
references:
- title: Resource Management for Pods and Containers
  url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
