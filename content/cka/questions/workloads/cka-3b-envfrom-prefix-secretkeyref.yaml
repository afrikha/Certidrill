id: cka-3b-envfrom-prefix-secretkeyref
objective: "3.2.2"
difficulty: 2
status: draft
type: manifest
stem:
  en: |-
    Complete Deployment `orders` in namespace `shop` so that its container `app`:

    - receives every key of ConfigMap `orders-config` as an environment variable, each name prefixed with `ORDERS_` (key `MODE` becomes `ORDERS_MODE`);
    - receives the environment variable `DB_PASSWORD` from the key `password` of Secret `orders-db`.
body:
  starter: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: orders
      namespace: shop
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: orders
      template:
        metadata:
          labels:
            app: orders
        spec:
          containers:
          - name: app
            image: registry.example.com/shop/orders:4.1
answer:
  checks:
  - id: meta
    label: A Deployment named orders in namespace shop
    path: metadata
    op: subset
    value: {name: orders, namespace: shop}
  - id: envfrom
    label: envFrom loads ConfigMap orders-config with prefix ORDERS_
    path: spec.template.spec.containers[name=app].envFrom
    op: contains
    value: {prefix: ORDERS_, configMapRef: {name: orders-config}}
  - id: secret-name
    label: DB_PASSWORD comes from Secret orders-db
    path: spec.template.spec.containers[name=app].env[name=DB_PASSWORD].valueFrom.secretKeyRef.name
    op: equals
    value: orders-db
  - id: secret-key
    label: DB_PASSWORD reads key password
    path: spec.template.spec.containers[name=app].env[name=DB_PASSWORD].valueFrom.secretKeyRef.key
    op: equals
    value: password
  - id: image
    label: Container app runs orders:4.1
    path: spec.template.spec.containers[name=app].image
    op: equals
    value: registry.example.com/shop/orders:4.1
  solution:
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: orders
        namespace: shop
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: orders
        template:
          metadata:
            labels:
              app: orders
          spec:
            containers:
            - name: app
              image: registry.example.com/shop/orders:4.1
              envFrom:
              - prefix: ORDERS_
                configMapRef:
                  name: orders-config
              env:
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: orders-db
                    key: password
  negatives:
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: orders
        namespace: shop
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: orders
        template:
          metadata:
            labels:
              app: orders
          spec:
            containers:
            - name: app
              image: registry.example.com/shop/orders:4.1
              envFrom:
              - configMapRef:
                  name: orders-config
              - secretRef:
                  name: orders-db
    why: There is no prefix, and secretRef imports the Secret keys under their own names, so the variable is password, not DB_PASSWORD.
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: orders
        namespace: shop
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: orders
        template:
          metadata:
            labels:
              app: orders
          spec:
            containers:
            - name: app
              image: registry.example.com/shop/orders:4.1
              envFrom:
              - prefix: ORDERS_
                configMapRef:
                  name: orders-config
              env:
              - name: DB_PASSWORD
                valueFrom:
                  configMapKeyRef:
                    name: orders-db
                    key: password
    why: orders-db is a Secret; configMapKeyRef looks for a ConfigMap of that name and the container fails with CreateContainerConfigError.
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: orders
        namespace: shop
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: orders
        template:
          metadata:
            labels:
              app: orders
          spec:
            containers:
            - name: app
              image: registry.example.com/shop/orders:4.1
              envFrom:
              - prefix: ORDERS_
                configMapRef:
                  name: orders-config
              env:
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: password
                    key: orders-db
    why: name and key are swapped; name is the Secret, key is the entry inside it.
explanation:
  correct:
    en: '`envFrom` with `configMapRef` turns every key of the ConfigMap into a variable, and the optional `prefix` is prepended to each name. A single variable from a Secret uses `env[].valueFrom.secretKeyRef` with `name` (the Secret) and `key` (the entry). A missing Secret or key keeps the container in `CreateContainerConfigError` unless the reference is marked `optional`.'
references:
- title: Distribute Credentials Securely Using Secrets
  url: https://kubernetes.io/docs/tasks/inject-data-application/distribute-credentials-secure/
- title: Configure a Pod to Use a ConfigMap
  url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
