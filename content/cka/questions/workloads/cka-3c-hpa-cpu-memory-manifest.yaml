id: cka-3c-hpa-cpu-memory-manifest
objective: "3.3.1"
difficulty: 2
status: draft
type: manifest
stem:
  en: |-
    Write the manifest of a HorizontalPodAutoscaler named `web` in namespace `shop` for the Deployment `web`:

    - between 3 and 12 replicas;
    - target an average CPU utilization of 60 % and an average memory utilization of 75 % of the requests.
body:
  starter: ""
answer:
  checks:
  - id: api
    label: Uses autoscaling/v2
    path: apiVersion
    op: equals
    value: autoscaling/v2
  - id: meta
    label: A HorizontalPodAutoscaler named web in namespace shop
    path: metadata
    op: subset
    value: {name: web, namespace: shop}
  - id: target
    label: Scales the Deployment web
    path: spec.scaleTargetRef
    op: subset
    value: {kind: Deployment, name: web}
  - id: min
    label: minReplicas is 3
    path: spec.minReplicas
    op: equals
    value: 3
  - id: max
    label: maxReplicas is 12
    path: spec.maxReplicas
    op: equals
    value: 12
  - id: cpu
    label: CPU target is 60% average utilization
    path: spec.metrics
    op: contains
    value: {type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}}
  - id: memory
    label: Memory target is 75% average utilization
    path: spec.metrics
    op: contains
    value: {type: Resource, resource: {name: memory, target: {type: Utilization, averageUtilization: 75}}}
  solution:
  - manifest: |
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: web
        namespace: shop
      spec:
        scaleTargetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: web
        minReplicas: 3
        maxReplicas: 12
        metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 60
        - type: Resource
          resource:
            name: memory
            target:
              type: Utilization
              averageUtilization: 75
  negatives:
  - manifest: |
      apiVersion: autoscaling/v1
      kind: HorizontalPodAutoscaler
      metadata:
        name: web
        namespace: shop
      spec:
        scaleTargetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: web
        minReplicas: 3
        maxReplicas: 12
        targetCPUUtilizationPercentage: 60
    why: autoscaling/v1 only supports a CPU target; the memory target cannot be expressed.
  - manifest: |
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: web
        namespace: shop
      spec:
        scaleTargetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: web
        minReplicas: 3
        maxReplicas: 12
        metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: AverageValue
              averageValue: "60"
        - type: Resource
          resource:
            name: memory
            target:
              type: AverageValue
              averageValue: "75"
    why: AverageValue targets absolute quantities (60 cores, 75 bytes), not percentages of the requests.
  - manifest: |
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: web
        namespace: shop
      spec:
        scaleTargetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: web
        maxReplicas: 12
        metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 60
        - type: Resource
          resource:
            name: memory
            target:
              type: Utilization
              averageUtilization: 75
    why: Without minReplicas the minimum defaults to 1, not 3.
explanation:
  correct:
    en: 'In `autoscaling/v2`, each `Resource` metric names `cpu` or `memory` and a target of type `Utilization` with `averageUtilization` as a percentage of the requests. With several metrics, the HPA computes a replica count for each and uses the largest. `autoscaling/v1` only has `targetCPUUtilizationPercentage`.'
references:
- title: Horizontal Pod Autoscaling
  url: https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/
