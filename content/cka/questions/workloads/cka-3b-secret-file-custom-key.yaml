id: cka-3b-secret-file-custom-key
objective: "3.2.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    The file `root-ca.pem` in the current directory holds the CA certificate of an internal service. Applications in namespace `payments` expect it in a Secret under the key `ca.crt`.

    Create the generic Secret `ca-bundle` in namespace `payments` with a single key `ca.crt` whose value is the content of `root-ca.pem`.

    Type the single command you would run.
body:
  mode: object
  namespace: default
  files:
  - name: root-ca.pem
    content: |
      -----BEGIN CERTIFICATE-----
      MIIBexampleOnlyNotARealCertificate0123456789
      -----END CERTIFICATE-----
answer:
  checks:
  - id: kind
    label: The object is a Secret
    path: kind
    op: equals
    value: Secret
  - id: meta
    label: Named ca-bundle in namespace payments
    path: metadata
    op: subset
    value: {name: ca-bundle, namespace: payments}
  - id: key
    label: Key ca.crt holds the base64-encoded file content
    path: data["ca.crt"]
    op: equals
    value: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUJleGFtcGxlT25seU5vdEFSZWFsQ2VydGlmaWNhdGUwMTIzNDU2Nzg5Ci0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
  - id: one-key
    label: The Secret has a single key
    path: data
    op: length
    value: 1
  solution:
  - command: kubectl create secret generic ca-bundle --from-file=ca.crt=root-ca.pem -n payments
    output: |
      apiVersion: v1
      data:
        ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUJleGFtcGxlT25seU5vdEFSZWFsQ2VydGlmaWNhdGUwMTIzNDU2Nzg5Ci0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
      kind: Secret
      metadata:
        name: ca-bundle
        namespace: payments
  - command: k -n payments create secret generic ca-bundle --from-file ca.crt=./root-ca.pem --dry-run=client -o yaml
    output: |
      apiVersion: v1
      data:
        ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUJleGFtcGxlT25seU5vdEFSZWFsQ2VydGlmaWNhdGUwMTIzNDU2Nzg5Ci0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
      kind: Secret
      metadata:
        name: ca-bundle
        namespace: payments
  negatives:
  - command: kubectl create secret generic ca-bundle --from-file=root-ca.pem -n payments
    why: Without an explicit key, the key is the file basename, root-ca.pem, not ca.crt.
    output: |
      apiVersion: v1
      data:
        root-ca.pem: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUJleGFtcGxlT25seU5vdEFSZWFsQ2VydGlmaWNhdGUwMTIzNDU2Nzg5Ci0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
      kind: Secret
      metadata:
        name: ca-bundle
        namespace: payments
  - command: kubectl create secret generic ca-bundle --from-literal=ca.crt=root-ca.pem -n payments
    why: --from-literal stores the text "root-ca.pem" itself, not the content of the file.
    output: |
      apiVersion: v1
      data:
        ca.crt: cm9vdC1jYS5wZW0=
      kind: Secret
      metadata:
        name: ca-bundle
        namespace: payments
  - command: kubectl create secret generic ca-bundle --from-file=ca.crt=root-ca.pem
    why: Without -n the Secret is created in the context namespace, default.
    output: |
      apiVersion: v1
      data:
        ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUJleGFtcGxlT25seU5vdEFSZWFsQ2VydGlmaWNhdGUwMTIzNDU2Nzg5Ci0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
      kind: Secret
      metadata:
        name: ca-bundle
explanation:
  correct:
    en: '`--from-file=KEY=PATH` stores the file content under the key you choose; without `KEY=`, the key is the file basename. kubectl base64-encodes the bytes into `data`, including the final newline of the file. `--from-literal` would store the given string, here the file name, as the value.'
references:
- title: Managing Secrets using kubectl
  url: https://kubernetes.io/docs/tasks/configmap-secret/managing-secret-using-kubectl/
