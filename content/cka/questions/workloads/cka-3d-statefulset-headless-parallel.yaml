id: cka-3d-statefulset-headless-parallel
objective: "3.4.1"
difficulty: 3
status: draft
type: manifest
stem:
  en: |-
    In namespace `data`, write the manifests for a replicated database whose Pods keep stable names (`db-0`, `db-1`, `db-2`) and stable DNS names when they are recreated.

    - A headless Service named `db` selecting `app: db`, port 5432.
    - A workload named `db` with 3 replicas, governed by that Service, Pod label `app: db`, one container named `postgres` running `registry.example.com/data/postgres:16.4`.
    - A Pod must receive traffic only while a TCP connection to port 5432 succeeds.
    - The controller must create and delete all Pods at the same time instead of one by one.
body:
  starter: ""
answer:
  checks:
  - id: svc-headless
    label: Service db is headless (clusterIP None)
    select: {kind: Service, name: db}
    path: spec.clusterIP
    op: equals
    value: None
  - id: svc-selector
    label: Service db selects app=db
    select: {kind: Service, name: db}
    path: spec.selector.app
    op: equals
    value: db
  - id: svc-port
    label: Service db exposes port 5432
    select: {kind: Service, name: db}
    path: spec.ports
    op: contains
    value: {port: 5432}
  - id: sts-ns
    label: StatefulSet db is in namespace data
    select: {kind: StatefulSet, name: db}
    path: metadata.namespace
    op: equals
    value: data
  - id: svc-ns
    label: Service db is in namespace data
    select: {kind: Service, name: db}
    path: metadata.namespace
    op: equals
    value: data
  - id: sts-service
    label: The StatefulSet is governed by Service db
    select: {kind: StatefulSet, name: db}
    path: spec.serviceName
    op: equals
    value: db
  - id: sts-replicas
    label: The StatefulSet runs 3 replicas
    select: {kind: StatefulSet, name: db}
    path: spec.replicas
    op: equals
    value: 3
  - id: sts-selector
    label: Selector and template label are app=db
    select: {kind: StatefulSet, name: db}
    path: spec
    op: subset
    value: {selector: {matchLabels: {app: db}}, template: {metadata: {labels: {app: db}}}}
  - id: sts-image
    label: Container postgres runs postgres:16.4
    select: {kind: StatefulSet, name: db}
    path: spec.template.spec.containers[name=postgres].image
    op: equals
    value: registry.example.com/data/postgres:16.4
  - id: readiness
    label: Readiness probe opens a TCP connection to 5432
    select: {kind: StatefulSet, name: db}
    path: spec.template.spec.containers[name=postgres].readinessProbe.tcpSocket.port
    op: equals
    value: 5432
  - id: parallel
    label: Pods are managed in parallel
    select: {kind: StatefulSet, name: db}
    path: spec.podManagementPolicy
    op: equals
    value: Parallel
  solution:
  - manifest: |
      apiVersion: v1
      kind: Service
      metadata:
        name: db
        namespace: data
      spec:
        clusterIP: None
        selector:
          app: db
        ports:
        - name: postgres
          port: 5432
      ---
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: db
        namespace: data
      spec:
        serviceName: db
        replicas: 3
        podManagementPolicy: Parallel
        selector:
          matchLabels:
            app: db
        template:
          metadata:
            labels:
              app: db
          spec:
            containers:
            - name: postgres
              image: registry.example.com/data/postgres:16.4
              ports:
              - containerPort: 5432
              readinessProbe:
                tcpSocket:
                  port: 5432
  - manifest: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: db
        namespace: data
      spec:
        selector:
          matchLabels:
            app: db
        serviceName: "db"
        podManagementPolicy: Parallel
        replicas: 3
        template:
          metadata:
            labels:
              app: db
          spec:
            containers:
            - image: registry.example.com/data/postgres:16.4
              name: postgres
              readinessProbe:
                tcpSocket:
                  port: 5432
                periodSeconds: 5
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: db
        namespace: data
        labels:
          app: db
      spec:
        ports:
        - port: 5432
          targetPort: 5432
        clusterIP: None
        selector:
          app: db
  negatives:
  - manifest: |
      apiVersion: v1
      kind: Service
      metadata:
        name: db
        namespace: data
      spec:
        selector:
          app: db
        ports:
        - port: 5432
      ---
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: db
        namespace: data
      spec:
        serviceName: db
        replicas: 3
        podManagementPolicy: Parallel
        selector:
          matchLabels:
            app: db
        template:
          metadata:
            labels:
              app: db
          spec:
            containers:
            - name: postgres
              image: registry.example.com/data/postgres:16.4
              readinessProbe:
                tcpSocket:
                  port: 5432
    why: Without clusterIP None the Service gets a virtual IP and is not headless, so it publishes no per-Pod DNS records such as db-0.db.data.svc.cluster.local.
  - manifest: |
      apiVersion: v1
      kind: Service
      metadata:
        name: db
        namespace: data
      spec:
        clusterIP: None
        selector:
          app: db
        ports:
        - port: 5432
      ---
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: db
        namespace: data
      spec:
        serviceName: db
        replicas: 3
        selector:
          matchLabels:
            app: db
        template:
          metadata:
            labels:
              app: db
          spec:
            containers:
            - name: postgres
              image: registry.example.com/data/postgres:16.4
              readinessProbe:
                tcpSocket:
                  port: 5432
    why: Without podManagementPolicy the default OrderedReady applies; db-1 is created only once db-0 is Running and Ready.
  - manifest: |
      apiVersion: v1
      kind: Service
      metadata:
        name: db
        namespace: data
      spec:
        clusterIP: None
        selector:
          app: db
        ports:
        - port: 5432
      ---
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: db
        namespace: data
      spec:
        serviceName: db
        replicas: 3
        podManagementPolicy: Parallel
        selector:
          matchLabels:
            app: db
        template:
          metadata:
            labels:
              app: db
          spec:
            containers:
            - name: postgres
              image: registry.example.com/data/postgres:16.4
              livenessProbe:
                tcpSocket:
                  port: 5432
    why: A liveness probe restarts the container when it fails; it does not remove the Pod from the Service endpoints. The task asks for a readiness probe.
  - manifest: |
      apiVersion: v1
      kind: Service
      metadata:
        name: db
        namespace: data
      spec:
        clusterIP: None
        selector:
          app: db
        ports:
        - port: 5432
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: db
        namespace: data
      spec:
        replicas: 3
        selector:
          matchLabels:
            app: db
        template:
          metadata:
            labels:
              app: db
          spec:
            containers:
            - name: postgres
              image: registry.example.com/data/postgres:16.4
              readinessProbe:
                tcpSocket:
                  port: 5432
    why: Deployment Pods get random names (db-7c9d8-xk2lp) that change when they are recreated; only a StatefulSet gives stable ordinal names.
explanation:
  correct:
    en: 'A StatefulSet gives each Pod a stable name `$(statefulset name)-$(ordinal)` and, through the headless Service named in `spec.serviceName` (`clusterIP: None`), a stable DNS name such as `db-0.db.data.svc.cluster.local`. `podManagementPolicy: Parallel` launches and terminates all Pods at once; the default `OrderedReady` waits for each Pod to be Running and Ready before the next. The readiness probe (`tcpSocket` on 5432) controls whether a Pod is an endpoint of the Service.'
references:
- title: StatefulSets
  url: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
