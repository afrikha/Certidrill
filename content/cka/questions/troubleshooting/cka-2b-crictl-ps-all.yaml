id: cka-2b-crictl-ps-all
objective: "2.2.2"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    On control plane node `cp-1`, every `kubectl` command fails with `The connection to the server 10.0.0.10:6443 was refused`. You are root on `cp-1`, and `crictl` is configured for containerd.

    List every container the runtime knows on this node, including the containers that have exited (such as failed `kube-apiserver` attempts). Type the single command you would run.
body:
  mode: invocation
  tools: [crictl, kubectl]
answer:
  checks:
  - id: tool
    label: Uses crictl
    path: tool
    op: equals
    value: crictl
  - id: ps
    label: Lists containers (crictl ps)
    path: verb
    op: equals
    value: ps
  - id: all
    label: Includes exited containers (-a or --all)
    path: flags.all
    op: equals
    value: true
  solution:
  - command: crictl ps -a
  - command: crictl ps --all
  - command: sudo crictl ps -a
  - command: crictl ps -a --no-trunc
  negatives:
  - command: crictl ps
    why: Without -a, crictl ps lists only running containers, so the exited kube-apiserver attempts are hidden.
  - command: crictl pods
    why: crictl pods lists Pod sandboxes, not the containers and their exit state.
  - command: kubectl -n kube-system get pods
    why: kubectl needs the API server, which is down.
explanation:
  correct:
    en: 'With the API server down, ask the container runtime directly. `crictl ps -a` (`--all`) lists running and exited containers with their ID, state, name and attempt count; then `crictl logs <container-id>` on the latest `kube-apiserver` attempt shows why it exited.'
references:
- title: Debugging Kubernetes nodes with crictl
  url: https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/
