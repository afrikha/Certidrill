id: cka-2d-crictl-ps-name-namespace
objective: "2.4.2"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    You are logged in as root on node `worker-1`. Several Pods on this node, in different namespaces, run a container named `nginx`. You need the ID of the running `nginx` container of the Pods in namespace `shop`.

    Using the name and namespace filters of crictl, list only those containers. Type the single command you would run.
body:
  mode: invocation
  tools: [crictl]
  namespace: default
answer:
  checks:
  - id: tool
    label: Uses crictl
    path: tool
    op: equals
    value: crictl
  - id: verb
    label: Lists containers (crictl ps)
    path: verb
    op: equals
    value: ps
  - id: name
    label: Filters on the container name nginx
    path: flags.name
    op: matches
    value: '^\^?nginx\$?$'
  - id: namespace
    label: Filters on the Pod namespace shop
    path: flags.namespace
    op: matches
    value: '^\^?shop\$?$'
  solution:
  - command: crictl ps --name nginx --namespace shop
  - command: sudo crictl ps --namespace=shop --name=nginx
  - command: crictl ps --name '^nginx$' --namespace '^shop$'
  negatives:
  - command: crictl ps --name nginx
    why: Without the namespace filter the nginx containers of every namespace are listed.
  - command: crictl pods --namespace shop --name nginx
    why: crictl pods lists Pod sandboxes and their IDs, not containers.
  - command: crictl ps --namespace shop
    why: This lists every container of namespace shop, not only nginx.
explanation:
  correct:
    en: >-
      `crictl ps` lists the containers known to the runtime of the node. `--name` filters on the container name and
      `--namespace` on the namespace of its Pod; both take a regular expression. Running containers are shown by
      default; add `--all` to include exited ones. `crictl pods` lists Pod sandboxes instead.
references:
- title: Debugging Kubernetes nodes with crictl
  url: https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/
