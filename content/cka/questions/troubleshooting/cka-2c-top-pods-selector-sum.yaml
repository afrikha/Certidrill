id: cka-2c-top-pods-selector-sum
objective: "2.3.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    In namespace `checkout`, the Pods of the backend tier carry the label `tier=backend`. Capacity planning needs their current usage and the total CPU and memory they use together.

    Show the usage of these Pods with a sum line under the list. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl top
    path: verb
    op: equals
    value: top
  - id: resource
    label: Reports usage of Pods
    path: resource
    op: equals
    value: pod
  - id: selector
    label: Selects the Pods with label tier=backend
    path: flags.selector
    op: matches
    value: '^tier==?backend$'
  - id: sum
    label: Prints the sum of the usage
    path: flags.sum
    op: equals
    value: true
  - id: namespace
    label: Runs in namespace checkout
    path: flags.namespace
    op: equals
    value: checkout
  solution:
  - command: kubectl top pod -n checkout -l tier=backend --sum
  - command: k -n checkout top pods --sum --selector tier=backend
  - command: kubectl top po --namespace=checkout --selector=tier=backend --sum=true
  negatives:
  - command: kubectl top pod -n checkout -l tier=backend
    why: Without --sum kubectl lists each Pod but prints no total.
  - command: kubectl top pod -n checkout -l tier=backend --containers
    why: --containers splits each Pod into its containers; it does not add a total.
  - command: kubectl top pod -l tier=backend --sum
    why: Without -n the selector is evaluated in the context namespace, default.
explanation:
  correct:
    en: >-
      `kubectl top pod -l tier=backend -n checkout` lists the current CPU and memory of the matching Pods, and `--sum`
      adds a line with the total of the listed usage. `--containers` gives a per-container breakdown instead, and
      `kubectl top pod` without `-n` or `-A` only looks at the context namespace.
references:
- title: kubectl top pod
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_top/kubectl_top_pod/
