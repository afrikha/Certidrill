id: cka-2b-readyz-verbose
objective: "2.2.3"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    Some requests to the API server fail intermittently. Using `kubectl` (authenticated with your current kubeconfig), print every individual check of the API server's readiness endpoint with its status.

    Type the single command you would run.
body:
  mode: invocation
answer:
  checks:
  - id: get
    label: Uses kubectl get
    path: verb
    op: equals
    value: get
  - id: raw
    label: Requests the /readyz endpoint with the verbose parameter
    path: flags.raw
    op: matches
    value: '^/readyz\?(.*&)?verbose(=[^&]*)?(&.*)?$'
  solution:
  - command: kubectl get --raw='/readyz?verbose'
  - command: k get --raw /readyz?verbose
  negatives:
  - command: kubectl get --raw='/livez?verbose'
    why: /livez reports whether the API server should be restarted, not whether it is ready to serve traffic.
  - command: kubectl get --raw='/readyz'
    why: Without verbose, /readyz returns only ok, not the list of individual checks.
  - command: kubectl get --raw='/healthz?verbose'
    why: /healthz is deprecated since v1.16 and is not the readiness endpoint.
  - command: kubectl get componentstatuses
    why: componentstatuses is a deprecated API that does not list the API server's readiness checks.
explanation:
  correct:
    en: 'The API server exposes `/livez` and `/readyz` (`/healthz` is deprecated since v1.16). `kubectl get --raw=''/readyz?verbose''` sends an authenticated request and prints one line per check, `[+]` when it passes and `[-]` when it fails. `exclude=<check>` skips a check.'
references:
- title: Kubernetes API health endpoints
  url: https://kubernetes.io/docs/reference/using-api/health-checks/
