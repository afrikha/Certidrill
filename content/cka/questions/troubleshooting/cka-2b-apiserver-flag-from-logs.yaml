explanation:
  correct:
    en: 'When the API server is down, `crictl logs <container-id>` shows why each attempt exited: here `unknown flag: --enable-admission-plugin`, a typo of `--enable-admission-plugins` (plural). Fix the flag to `--enable-admission-plugins=NodeRestriction,PodNodeSelector` in the file and save it; the kubelet starts a new container, and `crictl ps` shows it `Running`.'
