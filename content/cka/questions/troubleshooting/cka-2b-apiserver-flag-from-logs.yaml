id: cka-2b-apiserver-flag-from-logs
objective: "2.2.2"
difficulty: 2
status: draft
type: manifest
stem:
  en: |-
    On `cp-1`, a colleague enabled the `PodNodeSelector` admission plugin in the API server manifest. Since then `kubectl` gets `connection refused`. `crictl ps -a --name kube-apiserver` shows a new `Exited` container every few seconds; `crictl-logs.txt` is the output of `crictl logs` for the latest one.

    The editor contains `/etc/kubernetes/manifests/kube-apiserver.yaml` (abridged). Write the corrected manifest so that the API server starts with the admission plugins `NodeRestriction` and `PodNodeSelector` enabled. Change nothing else.
body:
  starter: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        component: kube-apiserver
        tier: control-plane
      name: kube-apiserver
      namespace: kube-system
    spec:
      containers:
      - command:
        - kube-apiserver
        - --advertise-address=10.0.0.10
        - --allow-privileged=true
        - --authorization-mode=Node,RBAC
        - --client-ca-file=/etc/kubernetes/pki/ca.crt
        - --enable-admission-plugin=NodeRestriction,PodNodeSelector
        - --enable-bootstrap-token-auth=true
        - --etcd-cafile=/etc/kubernetes/pki/etcd/ca.crt
        - --etcd-certfile=/etc/kubernetes/pki/apiserver-etcd-client.crt
        - --etcd-keyfile=/etc/kubernetes/pki/apiserver-etcd-client.key
        - --etcd-servers=https://127.0.0.1:2379
        - --kubelet-client-certificate=/etc/kubernetes/pki/apiserver-kubelet-client.crt
        - --kubelet-client-key=/etc/kubernetes/pki/apiserver-kubelet-client.key
        - --secure-port=6443
        - --service-account-issuer=https://kubernetes.default.svc.cluster.local
        - --service-account-key-file=/etc/kubernetes/pki/sa.pub
        - --service-account-signing-key-file=/etc/kubernetes/pki/sa.key
        - --service-cluster-ip-range=10.96.0.0/12
        - --tls-cert-file=/etc/kubernetes/pki/apiserver.crt
        - --tls-private-key-file=/etc/kubernetes/pki/apiserver.key
        image: registry.k8s.io/kube-apiserver:v1.37.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 8
          httpGet:
            host: 10.0.0.10
            path: /livez
            port: probe-port
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 15
        name: kube-apiserver
        ports:
        - containerPort: 6443
          name: probe-port
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            host: 10.0.0.10
            path: /readyz
            port: probe-port
            scheme: HTTPS
          initialDelaySeconds: 0
          periodSeconds: 1
          timeoutSeconds: 15
        volumeMounts:
        - mountPath: /etc/ssl/certs
          name: ca-certs
          readOnly: true
        - mountPath: /etc/kubernetes/pki
          name: k8s-certs
          readOnly: true
      hostNetwork: true
      priorityClassName: system-node-critical
      volumes:
      - hostPath:
          path: /etc/ssl/certs
          type: DirectoryOrCreate
        name: ca-certs
      - hostPath:
          path: /etc/kubernetes/pki
          type: DirectoryOrCreate
        name: k8s-certs
  files:
  - name: crictl-logs.txt
    content: |
      Error: unknown flag: --enable-admission-plugin
answer:
  checks:
  - id: node-restriction
    label: --enable-admission-plugins enables NodeRestriction
    path: spec.containers[name=kube-apiserver].command
    op: matches
    value: '"--enable-admission-plugins=[^"]*NodeRestriction'
  - id: pod-node-selector
    label: --enable-admission-plugins enables PodNodeSelector
    path: spec.containers[name=kube-apiserver].command
    op: matches
    value: '"--enable-admission-plugins=[^"]*PodNodeSelector'
  - id: no-typo
    label: The misspelled --enable-admission-plugin flag is gone
    path: spec.containers[name=kube-apiserver].command
    op: matches
    value: '^(?!.*"--enable-admission-plugin=).*$'
  - id: etcd
    label: --etcd-servers is unchanged
    path: spec.containers[name=kube-apiserver].command
    op: contains
    value: --etcd-servers=https://127.0.0.1:2379
  - id: image
    label: The image is unchanged
    path: spec.containers[name=kube-apiserver].image
    op: equals
    value: registry.k8s.io/kube-apiserver:v1.37.1
