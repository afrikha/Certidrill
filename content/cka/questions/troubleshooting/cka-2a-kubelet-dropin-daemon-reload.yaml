id: cka-2a-kubelet-dropin-daemon-reload
objective: "2.1.2"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    On `node-2`, the kubelet fails because the systemd drop-in `/etc/systemd/system/kubelet.service.d/20-local.conf` set a wrong `ExecStart` path. You have saved the corrected drop-in.

    Type the command that must run before `systemctl restart kubelet` so that the restart uses the corrected drop-in.
body:
  mode: invocation
  tools: [systemctl]
answer:
  checks:
  - id: tool
    label: Uses systemctl
    path: tool
    op: equals
    value: systemctl
  - id: reload
    label: Reloads the systemd unit files (daemon-reload)
    path: verb
    op: equals
    value: daemon-reload
  solution:
  - command: systemctl daemon-reload
  - command: sudo systemctl daemon-reload
  negatives:
  - command: systemctl reload kubelet
    why: reload asks the running service to reload its own configuration; it does not make systemd reread unit files and drop-ins.
  - command: systemctl restart kubelet
    why: Without daemon-reload first, systemd restarts the kubelet with the unit definition it loaded before the edit.
  - command: systemctl enable kubelet
    why: enable manages boot-time links; it does not reload the changed drop-in.
explanation:
  correct:
    en: 'systemd keeps unit files and drop-ins in memory. After editing a file under `/etc/systemd/system/kubelet.service.d/`, run `systemctl daemon-reload`, then `systemctl restart kubelet`: kubeadm itself runs these two commands after writing the kubelet configuration. A change to `/var/lib/kubelet/config.yaml` only needs the restart.'
references:
- title: Configuring each kubelet in your cluster using kubeadm
  url: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/kubelet-integration/
- title: Troubleshooting kubeadm
  url: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/troubleshooting-kubeadm/
