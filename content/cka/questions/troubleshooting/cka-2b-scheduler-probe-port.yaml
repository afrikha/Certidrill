    why: 'Changing the bind address does not open port 10251; the probes still target a port nothing listens on, and the scheduler is now exposed on every interface.'
explanation:
  correct:
    en: 'The probes use the named port `probe-port`, which the manifest maps to 10251, the old insecure scheduler port that no longer exists. kube-scheduler serves `/livez` and `/readyz` over HTTPS on 10259, so set `containerPort: 10259`. The startup probe fails 24 times at 10-second intervals, then the kubelet restarts the container: that is the restart every few minutes.'
