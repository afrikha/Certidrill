explanation:
  correct:
    en: 'The tag `v1.73.1` does not exist, so the kubelet cannot pull the scheduler image and no Pod is scheduled. Set `image: registry.k8s.io/kube-scheduler:v1.37.1` in `/etc/kubernetes/manifests/kube-scheduler.yaml` on `cp-1`; the kubelet sees the change and recreates the static Pod.'
references:
- title: Create static Pods
  url: https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/
