id: cka-2c-metrics-server-kubelet-tls
objective: "2.3.1"
difficulty: 3
status: draft
type: manifest
stem:
  en: |-
    On a lab cluster, `kubectl top node` fails with `error: Metrics API not available`. The Deployment `metrics-server` in namespace `kube-system` is running but never becomes ready, and its logs (`metrics-server.log`) show that it cannot reach the kubelets. The node host names are not registered in any DNS server. The kubelets of this lab use self-signed serving certificates that carry no IP address.

    Correct the Deployment so that metrics-server:

    - contacts each kubelet by its `InternalIP` first (keep `ExternalIP` and `Hostname` as fallbacks after it);
    - does not verify the kubelet serving certificates (accepted on this lab cluster only).

    Keep every other argument unchanged. Write the corrected manifest.
body:
  starter: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: metrics-server
      namespace: kube-system
      labels:
        k8s-app: metrics-server
    spec:
      selector:
        matchLabels:
          k8s-app: metrics-server
      template:
        metadata:
          labels:
            k8s-app: metrics-server
        spec:
          serviceAccountName: metrics-server
          containers:
          - name: metrics-server
            image: registry.k8s.io/metrics-server/metrics-server:v0.9.1
            args:
            - --cert-dir=/tmp
            - --secure-port=10250
            - --kubelet-preferred-address-types=Hostname
            - --kubelet-use-node-status-port
            - --metric-resolution=15s
            ports:
            - name: https
              containerPort: 10250
            readinessProbe:
              httpGet:
                path: /readyz
                port: https
                scheme: HTTPS
  files:
  - name: metrics-server.log
    content: |
      E1127 09:14:02.118411       1 scraper.go:149] "Failed to scrape node" err="Get \"https://worker-1:10250/metrics/resource\": dial tcp: lookup worker-1 on 10.96.0.10:53: no such host" node="worker-1"
      E1127 09:14:02.120927       1 scraper.go:149] "Failed to scrape node" err="Get \"https://worker-2:10250/metrics/resource\": dial tcp: lookup worker-2 on 10.96.0.10:53: no such host" node="worker-2"
      I1127 09:14:09.402317       1 server.go:191] "Failed probe" probe="metric-storage-ready" err="no metrics to serve"
answer:
  checks:
  - id: deployment
    label: The Deployment metrics-server in namespace kube-system
    path: metadata
    op: subset
    value: {name: metrics-server, namespace: kube-system}
  - id: address-types
    label: Kubelets are contacted by InternalIP first
    path: spec.template.spec.containers[name=metrics-server].args
    op: matches
    value: '"--kubelet-preferred-address-types=InternalIP[,"]'
  - id: fallbacks
    label: ExternalIP and Hostname remain as fallbacks
    path: spec.template.spec.containers[name=metrics-server].args
    op: matches
    value: '"--kubelet-preferred-address-types=InternalIP,(ExternalIP,Hostname|Hostname,ExternalIP)"'
  - id: insecure-tls
    label: Kubelet serving certificates are not verified (--kubelet-insecure-tls)
    path: spec.template.spec.containers[name=metrics-server].args
    op: matches
    value: '"--kubelet-insecure-tls(=true)?"'
  - id: secure-port
    label: The secure port 10250 is unchanged
    path: spec.template.spec.containers[name=metrics-server].args
    op: contains
    value: --secure-port=10250
  - id: cert-dir
    label: The certificate directory /tmp is unchanged
    path: spec.template.spec.containers[name=metrics-server].args
    op: contains
    value: --cert-dir=/tmp
  - id: resolution
    label: The metric resolution of 15s is unchanged
    path: spec.template.spec.containers[name=metrics-server].args
    op: contains
    value: --metric-resolution=15s
  solution:
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: metrics-server
        namespace: kube-system
        labels:
          k8s-app: metrics-server
      spec:
        selector:
          matchLabels:
            k8s-app: metrics-server
        template:
          metadata:
            labels:
              k8s-app: metrics-server
          spec:
            serviceAccountName: metrics-server
            containers:
            - name: metrics-server
              image: registry.k8s.io/metrics-server/metrics-server:v0.9.1
              args:
              - --cert-dir=/tmp
              - --secure-port=10250
              - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
              - --kubelet-use-node-status-port
              - --metric-resolution=15s
              - --kubelet-insecure-tls
              ports:
              - name: https
                containerPort: 10250
              readinessProbe:
                httpGet:
                  path: /readyz
                  port: https
                  scheme: HTTPS
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: metrics-server
        namespace: kube-system
      spec:
        selector:
          matchLabels:
            k8s-app: metrics-server
        template:
          metadata:
            labels:
              k8s-app: metrics-server
          spec:
            serviceAccountName: metrics-server
            containers:
            - name: metrics-server
              image: registry.k8s.io/metrics-server/metrics-server:v0.9.1
              args: ["--kubelet-insecure-tls=true", "--cert-dir=/tmp", "--secure-port=10250", "--kubelet-preferred-address-types=InternalIP,Hostname,ExternalIP", "--kubelet-use-node-status-port", "--metric-resolution=15s"]
              ports:
              - name: https
                containerPort: 10250
  negatives:
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: metrics-server
        namespace: kube-system
      spec:
        selector:
          matchLabels:
            k8s-app: metrics-server
        template:
          metadata:
            labels:
              k8s-app: metrics-server
          spec:
            serviceAccountName: metrics-server
            containers:
            - name: metrics-server
              image: registry.k8s.io/metrics-server/metrics-server:v0.9.1
              args:
              - --cert-dir=/tmp
              - --secure-port=10250
              - --kubelet-preferred-address-types=Hostname
              - --kubelet-use-node-status-port
              - --metric-resolution=15s
              - --kubelet-insecure-tls
    why: Skipping certificate verification does not help while metrics-server still dials host names that no DNS server resolves.
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: metrics-server
        namespace: kube-system
      spec:
        selector:
          matchLabels:
            k8s-app: metrics-server
        template:
          metadata:
            labels:
              k8s-app: metrics-server
          spec:
            serviceAccountName: metrics-server
            containers:
            - name: metrics-server
              image: registry.k8s.io/metrics-server/metrics-server:v0.9.1
              args:
              - --cert-dir=/tmp
              - --secure-port=10250
              - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
              - --kubelet-use-node-status-port
              - --metric-resolution=15s
    why: metrics-server now reaches the kubelets by IP but rejects their self-signed certificates, which contain no IP SAN.
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: metrics-server
        namespace: kube-system
      spec:
        selector:
          matchLabels:
            k8s-app: metrics-server
        template:
          metadata:
            labels:
              k8s-app: metrics-server
          spec:
            serviceAccountName: metrics-server
            containers:
            - name: metrics-server
              image: registry.k8s.io/metrics-server/metrics-server:v0.9.1
              args:
              - --kubelet-preferred-address-types=InternalIP
              - --kubelet-insecure-tls
    why: Rewriting the list drops the fallbacks and the other arguments (certificate directory, secure port 10250 that the probes and the APIService use, metric resolution).
explanation:
  correct:
    en: >-
      The logs show DNS lookups of node names: `--kubelet-preferred-address-types=Hostname` makes metrics-server dial
      names that nothing resolves, so `InternalIP` must come first (the upstream manifest uses
      `InternalIP,ExternalIP,Hostname`). Once it connects by IP, the self-signed kubelet certificates fail verification,
      and `--kubelet-insecure-tls` disables that check, which the project documents for testing only. On a real cluster,
      give the kubelets serving certificates signed by the cluster CA instead. After the rollout, `kubectl top node` works again.
references:
- title: kubernetes-sigs/metrics-server
  url: https://github.com/kubernetes-sigs/metrics-server
- title: kubectl top node
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_top/kubectl_top_node/
