id: cka-2b-scheduler-kubeconfig
objective: "2.2.3"
difficulty: 3
status: draft
type: manifest
stem:
  en: |-
    A security review of `cp-1` found that the kube-scheduler static Pod authenticates with `/etc/kubernetes/admin.conf`, the cluster administrator's kubeconfig. kubeadm created a dedicated kubeconfig for the scheduler identity in `/etc/kubernetes`.

    The editor contains `/etc/kubernetes/manifests/kube-scheduler.yaml`. Write the corrected manifest so that the scheduler uses its own kubeconfig for all its kubeconfig flags, mounted from the host at the same path as kubeadm does (same path on the host and in the container). Change nothing else.
body:
  starter: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        component: kube-scheduler
        tier: control-plane
      name: kube-scheduler
      namespace: kube-system
    spec:
      containers:
      - command:
        - kube-scheduler
        - --authentication-kubeconfig=/etc/kubernetes/admin.conf
        - --authorization-kubeconfig=/etc/kubernetes/admin.conf
        - --bind-address=127.0.0.1
        - --kubeconfig=/etc/kubernetes/admin.conf
        - --leader-elect=true
        image: registry.k8s.io/kube-scheduler:v1.37.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 8
          httpGet:
            host: 127.0.0.1
            path: /livez
            port: probe-port
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 15
        name: kube-scheduler
        ports:
        - containerPort: 10259
          name: probe-port
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            host: 127.0.0.1
            path: /readyz
            port: probe-port
            scheme: HTTPS
          initialDelaySeconds: 0
          periodSeconds: 1
          timeoutSeconds: 15
        startupProbe:
          failureThreshold: 24
          httpGet:
            host: 127.0.0.1
            path: /livez
            port: probe-port
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 15
        volumeMounts:
        - mountPath: /etc/kubernetes/admin.conf
          name: kubeconfig
          readOnly: true
      hostNetwork: true
      priorityClassName: system-node-critical
      volumes:
      - hostPath:
          path: /etc/kubernetes/admin.conf
          type: FileOrCreate
        name: kubeconfig
answer:
  checks:
  - id: kubeconfig
    label: --kubeconfig is /etc/kubernetes/scheduler.conf
    path: spec.containers[name=kube-scheduler].command
    op: contains
    value: --kubeconfig=/etc/kubernetes/scheduler.conf
  - id: authn
    label: --authentication-kubeconfig is /etc/kubernetes/scheduler.conf
    path: spec.containers[name=kube-scheduler].command
    op: contains
    value: --authentication-kubeconfig=/etc/kubernetes/scheduler.conf
  - id: authz
    label: --authorization-kubeconfig is /etc/kubernetes/scheduler.conf
    path: spec.containers[name=kube-scheduler].command
    op: contains
    value: --authorization-kubeconfig=/etc/kubernetes/scheduler.conf
  - id: no-admin
    label: No flag uses admin.conf any more
    path: spec.containers[name=kube-scheduler].command
    op: matches
    value: '^(?!.*admin\.conf).*$'
  - id: host-path
    label: The kubeconfig volume mounts /etc/kubernetes/scheduler.conf from the host
    path: spec.volumes[name=kubeconfig].hostPath.path
    op: equals
    value: /etc/kubernetes/scheduler.conf
  - id: mount-path
    label: The kubeconfig volume is mounted at /etc/kubernetes/scheduler.conf
    path: spec.containers[name=kube-scheduler].volumeMounts[name=kubeconfig].mountPath
    op: equals
    value: /etc/kubernetes/scheduler.conf
  solution:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        labels:
          component: kube-scheduler
          tier: control-plane
        name: kube-scheduler
        namespace: kube-system
