    why: 'kubeadm''s etcd only serves clients over TLS (client-cert-auth); the URL must be https.'
explanation:
  correct:
    en: 'The log shows two faults: the API server dials 127.0.0.1:2380, the etcd peer port, and rejects the certificate as signed by an unknown authority because `--etcd-cafile` points to the cluster CA. Clients use `--etcd-servers=https://127.0.0.1:2379` and `--etcd-cafile=/etc/kubernetes/pki/etcd/ca.crt`. Save the file in place: the kubelet recreates the static Pod.'
