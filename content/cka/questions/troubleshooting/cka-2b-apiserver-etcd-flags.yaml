          - --service-cluster-ip-range=10.96.0.0/12
          - --tls-cert-file=/etc/kubernetes/pki/apiserver.crt
          - --tls-private-key-file=/etc/kubernetes/pki/apiserver.key
          image: registry.k8s.io/kube-apiserver:v1.37.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 8
            httpGet:
              host: 10.0.0.10
              path: /livez
              port: probe-port
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 15
          name: kube-apiserver
          ports:
          - containerPort: 6443
            name: probe-port
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              host: 10.0.0.10
