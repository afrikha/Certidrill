id: cka-2b-apiserver-etcd-flags
objective: "2.2.1"
difficulty: 3
status: draft
type: manifest
stem:
  en: |-
    After a colleague edited the API server manifest on control plane node `cp-1` (IP 10.0.0.10, stacked etcd created by kubeadm), `kubectl` answers `The connection to the server 10.0.0.10:6443 was refused`. `crictl ps -a --name kube-apiserver` lists only `Exited` containers; `apiserver-log.txt` is the end of the log of the last one and `ls-pki-etcd.txt` lists the etcd certificates.

    The editor contains `/etc/kubernetes/manifests/kube-apiserver.yaml` (abridged). Write the corrected manifest so that the API server reaches the local etcd. Change nothing else.
body:
  starter: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        component: kube-apiserver
        tier: control-plane
      name: kube-apiserver
      namespace: kube-system
    spec:
      containers:
      - command:
        - kube-apiserver
        - --advertise-address=10.0.0.10
        - --allow-privileged=true
        - --authorization-mode=Node,RBAC
        - --client-ca-file=/etc/kubernetes/pki/ca.crt
        - --enable-admission-plugins=NodeRestriction
        - --enable-bootstrap-token-auth=true
        - --etcd-cafile=/etc/kubernetes/pki/ca.crt
        - --etcd-certfile=/etc/kubernetes/pki/apiserver-etcd-client.crt
        - --etcd-keyfile=/etc/kubernetes/pki/apiserver-etcd-client.key
        - --etcd-servers=https://127.0.0.1:2380
        - --kubelet-client-certificate=/etc/kubernetes/pki/apiserver-kubelet-client.crt
        - --kubelet-client-key=/etc/kubernetes/pki/apiserver-kubelet-client.key
        - --secure-port=6443
        - --service-account-issuer=https://kubernetes.default.svc.cluster.local
        - --service-account-key-file=/etc/kubernetes/pki/sa.pub
        - --service-account-signing-key-file=/etc/kubernetes/pki/sa.key
        - --service-cluster-ip-range=10.96.0.0/12
        - --tls-cert-file=/etc/kubernetes/pki/apiserver.crt
        - --tls-private-key-file=/etc/kubernetes/pki/apiserver.key
        image: registry.k8s.io/kube-apiserver:v1.37.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 8
          httpGet:
            host: 10.0.0.10
            path: /livez
            port: probe-port
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 15
        name: kube-apiserver
        ports:
        - containerPort: 6443
          name: probe-port
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            host: 10.0.0.10
            path: /readyz
            port: probe-port
            scheme: HTTPS
          initialDelaySeconds: 0
          periodSeconds: 1
          timeoutSeconds: 15
        volumeMounts:
        - mountPath: /etc/ssl/certs
          name: ca-certs
          readOnly: true
        - mountPath: /etc/kubernetes/pki
          name: k8s-certs
          readOnly: true
      hostNetwork: true
      priorityClassName: system-node-critical
      volumes:
      - hostPath:
          path: /etc/ssl/certs
          type: DirectoryOrCreate
        name: ca-certs
      - hostPath:
          path: /etc/kubernetes/pki
          type: DirectoryOrCreate
        name: k8s-certs
  files:
  - name: apiserver-log.txt
    content: |
      W1127 10:02:11.481203       1 logging.go:55] [core] [Channel #1 SubChannel #2]grpc: addrConn.createTransport failed to connect to {Addr: "127.0.0.1:2380", ServerName: "127.0.0.1:2380", }. Err: connection error: desc = "transport: authentication handshake failed: tls: failed to verify certificate: x509: certificate signed by unknown authority"
      F1127 10:02:31.482007       1 instance.go:232] Error creating leases: error creating storage factory: context deadline exceeded
  - name: ls-pki-etcd.txt
    content: |
      # ls /etc/kubernetes/pki/etcd
      ca.crt  ca.key  healthcheck-client.crt  healthcheck-client.key  peer.crt  peer.key  server.crt  server.key
answer:
  checks:
  - id: servers
    label: --etcd-servers uses HTTPS on the etcd client port 2379
    path: spec.containers[name=kube-apiserver].command
    op: matches
    value: '"--etcd-servers=https://(127\.0\.0\.1|localhost|10\.0\.0\.10):2379"'
  - id: etcd-ca
    label: --etcd-cafile is the etcd CA /etc/kubernetes/pki/etcd/ca.crt
    path: spec.containers[name=kube-apiserver].command
    op: contains
    value: --etcd-cafile=/etc/kubernetes/pki/etcd/ca.crt
  - id: etcd-cert
    label: --etcd-certfile is unchanged
    path: spec.containers[name=kube-apiserver].command
    op: contains
    value: --etcd-certfile=/etc/kubernetes/pki/apiserver-etcd-client.crt
  - id: etcd-key
    label: --etcd-keyfile is unchanged
    path: spec.containers[name=kube-apiserver].command
    op: contains
    value: --etcd-keyfile=/etc/kubernetes/pki/apiserver-etcd-client.key
  - id: client-ca
    label: --client-ca-file stays the cluster CA
    path: spec.containers[name=kube-apiserver].command
    op: contains
    value: --client-ca-file=/etc/kubernetes/pki/ca.crt
  - id: image
    label: The image is unchanged
    path: spec.containers[name=kube-apiserver].image
    op: equals
    value: registry.k8s.io/kube-apiserver:v1.37.1
  - id: certs-volume
    label: /etc/kubernetes/pki is still mounted from the host
    path: spec.volumes[name=k8s-certs].hostPath.path
    op: equals
    value: /etc/kubernetes/pki
