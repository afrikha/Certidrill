id: cka-2c-top-pods-all-ns-memory
objective: "2.3.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    A node is under memory pressure and you need the Pods that use the most memory, wherever they run. The output will be read by a script, so it must not contain the header line.

    List the Pods of every namespace by current memory usage, highest first, without headers. Type the single command you would run.
body:
  mode: invocation
  namespace: shop
answer:
  checks:
  - id: verb
    label: Uses kubectl top
    path: verb
    op: equals
    value: top
  - id: resource
    label: Reports usage of Pods
    path: resource
    op: equals
    value: pod
  - id: all-ns
    label: Covers every namespace
    path: flags.all-namespaces
    op: equals
    value: true
  - id: sort
    label: Sorts by memory usage
    path: flags.sort-by
    op: equals
    value: memory
  - id: no-headers
    label: Prints no header line
    path: flags.no-headers
    op: equals
    value: true
  solution:
  - command: kubectl top pod -A --sort-by=memory --no-headers
  - command: k top pods --all-namespaces --no-headers --sort-by memory
  - command: kubectl top po --sort-by=memory -A --no-headers=true
  negatives:
  - command: kubectl top pod --sort-by=memory --no-headers
    why: Without -A only the context namespace, shop, is listed.
  - command: kubectl top pod -A --sort-by=memory
    why: The header line NAMESPACE NAME CPU(cores) MEMORY(bytes) is still printed.
  - command: kubectl top pod -A --sort-by=cpu --no-headers
    why: Sorting by CPU does not give the largest memory users first.
explanation:
  correct:
    en: >-
      `kubectl top pod -A` lists the Pods of all namespaces (the context namespace is ignored), `--sort-by=memory`
      orders them by working-set memory from the highest, and `--no-headers` drops the header line so that a script
      can read the first line directly. Without `-A`, `kubectl top pod` only covers the context namespace.
references:
- title: kubectl top pod
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_top/kubectl_top_pod/
