id: cka-2c-describe-node-allocated
objective: "2.3.2"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    Pod `etl-loader` in namespace `analytics` stays `Pending` with the event `0/3 nodes are available: 1 node(s) had untolerated taint {node-role.kubernetes.io/control-plane: }, 2 Insufficient cpu.` Yet `kubectl top node` shows `worker-1` at 18 % CPU.

    Show, for node `worker-1`, the CPU and memory requests and limits already allocated to the Pods it runs, as the scheduler counts them. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl describe
    path: verb
    op: equals
    value: describe
  - id: resource
    label: Describes a node
    path: resource
    op: equals
    value: node
  - id: name
    label: Targets node worker-1
    path: names
    op: contains
    value: worker-1
  solution:
  - command: kubectl describe node worker-1
  - command: k describe no worker-1
  - command: kubectl describe nodes/worker-1
  negatives:
  - command: kubectl top node worker-1
    why: kubectl top shows measured usage (18 %), which the scheduler ignores; it places Pods according to requests.
  - command: kubectl describe pod etl-loader -n analytics
    why: This repeats the FailedScheduling event; it does not show what is already requested on worker-1.
  - command: kubectl get node worker-1 -o wide
    why: The wide output shows addresses, OS and runtime, not the requests allocated on the node.
explanation:
  correct:
    en: >-
      `kubectl describe node worker-1` lists the Non-terminated Pods with their CPU and memory requests and limits, and
      the Allocated resources section with the totals as a percentage of allocatable. The scheduler compares a new Pod's
      requests with allocatable minus these requests, so a node can be full while `kubectl top` reports low usage.
references:
- title: Resource Management for Pods and Containers
  url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
