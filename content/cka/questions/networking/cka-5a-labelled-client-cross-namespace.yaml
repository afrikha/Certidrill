id: cka-5a-labelled-client-cross-namespace
objective: "5.1.2"
difficulty: 3
status: draft
type: command
stem:
  en: |-
    A NetworkPolicy in namespace `payments` admits traffic to the Pods behind Service `api` (port 8080) only from Pods labelled `role=frontend` in namespace `shop`.

    Check it as an allowed client would: start a temporary Pod named `np-test` in namespace `shop`, image `busybox:1.36`, labelled `role=frontend`, that sends an HTTP request with `wget` to Service `api` of namespace `payments` on port 8080 and gives up after 2 seconds. The Pod must never be restarted and must be deleted when the command exits. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl run
    path: verb
    op: equals
    value: run
  - id: name
    label: The Pod is named np-test
    path: args
    op: contains
    value: np-test
  - id: namespace
    label: It runs in namespace shop
    path: flags.namespace
    op: equals
    value: shop
  - id: image
    label: It runs busybox:1.36
    path: flags.image
    op: equals
    value: busybox:1.36
  - id: label
    label: The Pod carries the label role=frontend (--labels or -l)
    path: flags.labels
    op: matches
    value: '(^|,)role=frontend(,|$)'
  - id: rm
    label: The Pod is deleted on exit (--rm)
    path: flags.rm
    op: equals
    value: true
  - id: attach
    label: The session is attached (-i), as --rm requires
    path: flags.stdin
    op: equals
    value: true
  - id: restart
    label: The Pod is never restarted (--restart=Never)
    path: flags.restart
    op: equals
    value: Never
  - id: url
    label: wget calls Service api of namespace payments on port 8080
    path: rest
    op: matches
    value: 'wget.*api\.payments(\.svc(\.cluster\.local)?)?:8080'
  - id: timeout
    label: wget gives up after 2 seconds
    path: rest
    op: matches
    value: '"(-T2|--timeout=2)"|"(-T|--timeout)","2"|-T 2 |-T2 |--timeout=2 '
  solution:
  - command: kubectl run np-test -n shop --image=busybox:1.36 --labels=role=frontend --rm -it --restart=Never -- wget -qO- -T 2 http://api.payments:8080
  - command: k -n shop run np-test -l role=frontend --image busybox:1.36 --restart Never --rm -i -- wget -O- --timeout=2 http://api.payments.svc.cluster.local:8080/
  - command: kubectl run np-test --namespace=shop --labels="role=frontend" --image=busybox:1.36 --restart=Never -it --rm -- sh -c "wget -qO- -T 2 api.payments.svc:8080"
  negatives:
  - command: kubectl run np-test -n shop --image=busybox:1.36 --rm -it --restart=Never -- wget -qO- -T 2 http://api.payments:8080
    why: kubectl run labels the Pod run=np-test only; without role=frontend the policy blocks the test Pod, which proves nothing about allowed clients.
  - command: kubectl run np-test -n payments --image=busybox:1.36 --labels=role=frontend --rm -it --restart=Never -- wget -qO- -T 2 http://api.payments:8080
    why: The policy admits role=frontend Pods of namespace shop; a Pod in payments does not match its namespace selector.
  - command: kubectl run np-test -n shop --image=busybox:1.36 --labels=role=frontend --rm -it --restart=Never -- wget -qO- -T 2 http://api:8080
    why: From namespace shop, the short name api is looked up as api.shop, not as the Service of payments.
  - command: kubectl run np-test -n shop --image=busybox:1.36 --labels=role=frontend -it --restart=Never -- wget -qO- -T 2 http://api.payments:8080
    why: Without --rm the test Pod stays in namespace shop after the command exits.
explanation:
  correct:
    en: 'NetworkPolicies select clients by labels and namespace, so the test Pod must look like an allowed client: `--labels=role=frontend` (or `-l`) and `-n shop`. `api.payments` resolves to the Service of namespace `payments` from any namespace; the short name only works inside `payments`. `-T 2` makes a blocked connection fail fast, because policies usually drop packets rather than reject them.'
references:
- title: kubectl run
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_run/
- title: DNS for Services and Pods
  url: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
