id: cka-5b-egress-ipblock-port-range
objective: "5.2.1"
difficulty: 2
status: draft
type: manifest
stem:
  en: |-
    In namespace `observability`, the Pods labeled `app: exporter` push data to an external collector farm at `198.51.100.0/24`. The collectors listen on every TCP port from 9000 to 9100 (inclusive). The exporters connect by IP address and need no DNS.

    Write a NetworkPolicy named `exporter-egress` in namespace `observability` so that the `app: exporter` Pods can open connections only to that address range on TCP ports 9000 to 9100, with a single port entry. Ingress traffic to the exporter Pods must not be affected.
body:
  starter: |
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: exporter-egress
      namespace: observability
    spec:
answer:
  checks:
  - id: kind
    label: The object is a NetworkPolicy
    path: kind
    op: equals
    value: NetworkPolicy
  - id: meta
    label: It is named exporter-egress in namespace observability
    path: metadata
    op: subset
    value: {name: exporter-egress, namespace: observability}
  - id: target
    label: The policy selects the app=exporter Pods
    path: spec.podSelector.matchLabels
    op: equals
    value: {app: exporter}
  - id: types
    label: policyTypes is Egress only, so ingress is not isolated
    path: spec.policyTypes
    op: equals
    value: [Egress]
  - id: range
    label: Egress to 198.51.100.0/24 on ports 9000 to 9100 (port + endPort)
    path: spec.egress
    op: contains
    value:
      to:
      - ipBlock: {cidr: 198.51.100.0/24}
      ports:
      - {port: 9000, endPort: 9100}
  - id: tcp
    label: The rule uses TCP (written or default), not UDP or SCTP
    path: spec.egress
    op: matches
    value: '^(?!.*"protocol":"(UDP|SCTP)").*$'
  solution:
  - manifest: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: exporter-egress
        namespace: observability
      spec:
        podSelector:
          matchLabels:
            app: exporter
        policyTypes:
        - Egress
        egress:
        - to:
          - ipBlock:
              cidr: 198.51.100.0/24
          ports:
          - protocol: TCP
            port: 9000
            endPort: 9100
  - manifest: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: exporter-egress
        namespace: observability
      spec:
        podSelector:
          matchLabels: {app: exporter}
        policyTypes: [Egress]
        egress:
        - ports:
          - {port: 9000, endPort: 9100}
          to:
          - ipBlock: {cidr: 198.51.100.0/24}
  negatives:
  - manifest: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: exporter-egress
        namespace: observability
      spec:
        podSelector:
          matchLabels:
            app: exporter
        policyTypes:
        - Egress
        egress:
        - to:
          - ipBlock:
              cidr: 198.51.100.0/24
          ports:
          - protocol: TCP
            port: 9000
    why: Without endPort the entry opens port 9000 only; ports 9001 to 9100 stay blocked.
  - manifest: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: exporter-egress
        namespace: observability
      spec:
        podSelector:
          matchLabels:
            app: exporter
        policyTypes:
        - Ingress
        - Egress
        egress:
        - to:
          - ipBlock:
              cidr: 198.51.100.0/24
          ports:
          - protocol: TCP
            port: 9000
            endPort: 9100
    why: Listing Ingress with no ingress rule isolates the exporter Pods for ingress and blocks all incoming traffic.
  - manifest: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: exporter-egress
        namespace: observability
      spec:
        podSelector:
          matchLabels:
            app: exporter
        policyTypes:
        - Egress
        egress:
        - to:
          - ipBlock:
              cidr: 198.51.100.0/24
          ports:
          - protocol: TCP
            port: 9100
            endPort: 9000
    why: endPort must be equal to or greater than port; the API server rejects this policy.
explanation:
  correct:
    en: 'A port range is one `ports` entry with `port: 9000` and `endPort: 9100` (stable since v1.25; both must be numeric and `endPort` must be at least `port`). `ipBlock.cidr: 198.51.100.0/24` selects the external destinations. `policyTypes: [Egress]` isolates the exporters for egress only; ingress stays open because no policy lists `Ingress` for them. A CNI plugin that does not support `endPort` would apply only the single `port`.'
references:
- title: Network Policies
  url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
