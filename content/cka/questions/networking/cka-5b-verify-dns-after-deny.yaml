id: cka-5b-verify-dns-after-deny
objective: "5.2.2"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    In namespace `vault`, the policies of file `policies.yaml` are applied: `default-deny-all` and `allow-dns`. The Pod `tester` (image `busybox:1.36`) is running in `vault`.

    From the running Pod `tester`, check that name resolution still works by looking up the Service `kubernetes` of namespace `default` with `nslookup`. Type the single command you would run.
body:
  mode: invocation
  namespace: default
  files:
  - name: policies.yaml
    content: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny-all
        namespace: vault
      spec:
        podSelector: {}
        policyTypes:
        - Ingress
        - Egress
      ---
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-dns
        namespace: vault
      spec:
        podSelector: {}
        policyTypes:
        - Egress
        egress:
        - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
          ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
answer:
  checks:
  - id: verb
    label: Runs a command in an existing Pod with kubectl exec
    path: verb
    op: equals
    value: exec
  - id: pod
    label: Targets Pod tester
    path: names
    op: contains
    value: tester
  - id: namespace
    label: Targets namespace vault
    path: flags.namespace
    op: equals
    value: vault
  - id: tool
    label: Runs nslookup after --
    path: rest[0]
    op: equals
    value: nslookup
  - id: name
    label: Looks up Service kubernetes of namespace default
    path: rest
    op: matches
    value: '"kubernetes\.default(\.svc(\.cluster\.local\.?)?)?"'
  solution:
  - command: kubectl exec tester -n vault -- nslookup kubernetes.default
  - command: k -n vault exec -it tester -- nslookup kubernetes.default.svc.cluster.local
  - command: kubectl exec -n vault pod/tester -- nslookup kubernetes.default.svc
  negatives:
  - command: kubectl run tmp --rm -it --restart=Never --image=busybox:1.36 -- nslookup kubernetes.default
    why: The temporary Pod runs in namespace default, which these policies do not select, so the test says nothing about vault.
  - command: kubectl exec tester -n vault -- nslookup kubernetes
    why: The short name kubernetes is looked up in the Pod's own namespace first (kubernetes.vault), not as the Service of namespace default asked for.
  - command: kubectl exec tester -- nslookup kubernetes.default
    why: Without -n, kubectl looks for Pod tester in the context namespace, default.
  - command: kubectl exec tester -n vault -- wget -qO- -T 2 https://kubernetes.default
    why: wget also needs a connection to the API server on port 443, which default-deny-all blocks, so it fails even when DNS works; the task asks for an nslookup check.
explanation:
  correct:
    en: '`kubectl exec tester -n vault -- nslookup kubernetes.default` sends a DNS query from a Pod that both policies select. `default-deny-all` blocks all egress, and `allow-dns` adds UDP and TCP 53 to the `k8s-app: kube-dns` Pods of `kube-system`, so the lookup must succeed while other egress stays blocked. `kubernetes.default` is the API server Service used by the Debugging DNS Resolution guide; the short name `kubernetes` would be looked up in `vault`.'
references:
- title: Debugging DNS Resolution
  url: https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/
- title: Network Policies
  url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
