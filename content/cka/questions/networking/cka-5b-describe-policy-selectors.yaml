id: cka-5b-describe-policy-selectors
objective: "5.2.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    A colleague wrote the NetworkPolicy `db-ingress` in namespace `data` and is not sure whether its `from` selectors are combined with AND or OR. The documentation advises letting Kubernetes show how it interpreted the policy.

    Display the human-readable description of NetworkPolicy `db-ingress` in namespace `data`. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl describe
    path: verb
    op: equals
    value: describe
  - id: resource
    label: Targets a NetworkPolicy
    path: resource
    op: equals
    value: networkpolicy
  - id: name
    label: Names the policy db-ingress
    path: names
    op: contains
    value: db-ingress
  - id: namespace
    label: Runs in namespace data
    path: flags.namespace
    op: equals
    value: data
  solution:
  - command: kubectl describe networkpolicy db-ingress -n data
  - command: k -n data describe netpol db-ingress
  - command: kubectl describe networkpolicies/db-ingress --namespace=data
  negatives:
  - command: kubectl describe networkpolicy db-ingress
    why: Without -n kubectl looks for the policy in the context namespace, default.
  - command: kubectl get networkpolicy db-ingress -n data -o yaml
    why: get -o yaml prints the raw spec, which is exactly what the colleague cannot read; describe states which Pods and namespaces are allowed.
  - command: kubectl describe pod db-ingress -n data
    why: db-ingress is a NetworkPolicy, not a Pod.
explanation:
  correct:
    en: '`kubectl describe networkpolicy db-ingress -n data` (short name `netpol`) prints the selected Pods and, for each rule, the allowed peers and ports in plain text, so a `namespaceSelector` and a `podSelector` in the same from element appear as one combined peer, while separate elements appear as separate peers. The Network Policies page recommends `kubectl describe` when in doubt.'
references:
- title: Network Policies
  url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
