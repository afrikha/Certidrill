id: cka-5e-ingress-two-tls-secrets
objective: "5.5.1"
difficulty: 2
status: draft
type: manifest
stem:
  en: |-
    In namespace `shop`, the TLS Secrets `shop-tls` (certificate of `shop.example.com`) and `admin-tls` (certificate of `admin.example.com`) exist. Service `admin` exposes a port named `web`.

    Write the manifest of an Ingress named `shop`, handled by the IngressClass `edge`, that:

    - for `shop.example.com`: sends exactly `/api/health` to Service `health` on port 8081, the other paths under `/api` to Service `api` on port 80, and every other path to Service `storefront` on port 80;
    - for `admin.example.com`: sends every path to Service `admin` on its port named `web`;
    - terminates HTTPS for each host with its own certificate.
body:
  starter: |
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: shop
      namespace: shop
    spec:
      ingressClassName: edge
answer:
  checks:
  - id: ingress
    label: An Ingress named shop in namespace shop with class edge
    path: metadata
    op: subset
    value: {name: shop, namespace: shop}
  - id: class
    label: It uses the IngressClass edge
    path: spec.ingressClassName
    op: equals
    value: edge
  - id: health
    label: shop.example.com sends exactly /api/health to health:8081
    path: spec.rules[host=shop.example.com].http.paths
    op: contains
    value: {path: /api/health, pathType: Exact, backend: {service: {name: health, port: {number: 8081}}}}
  - id: api
    label: shop.example.com sends the prefix /api to api:80
    path: spec.rules[host=shop.example.com].http.paths
    op: contains
    value: {path: /api, pathType: Prefix, backend: {service: {name: api, port: {number: 80}}}}
  - id: storefront
    label: shop.example.com sends every other path to storefront:80
    path: spec.rules[host=shop.example.com].http.paths
    op: contains
    value: {path: /, pathType: Prefix, backend: {service: {name: storefront, port: {number: 80}}}}
  - id: admin
    label: admin.example.com sends every path to admin on the port named web
    path: spec.rules[host=admin.example.com].http.paths
    op: contains
    value: {path: /, pathType: Prefix, backend: {service: {name: admin, port: {name: web}}}}
  - id: tls-shop
    label: shop.example.com is served with shop-tls
    path: spec.tls
    op: contains
    value: {hosts: [shop.example.com], secretName: shop-tls}
  - id: tls-admin
    label: admin.example.com is served with admin-tls
    path: spec.tls
    op: contains
    value: {hosts: [admin.example.com], secretName: admin-tls}
  solution:
  - manifest: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: shop
        namespace: shop
      spec:
        ingressClassName: edge
        tls:
        - hosts:
          - shop.example.com
          secretName: shop-tls
        - hosts:
          - admin.example.com
          secretName: admin-tls
        rules:
        - host: shop.example.com
          http:
            paths:
            - path: /api/health
              pathType: Exact
              backend:
                service:
                  name: health
                  port:
                    number: 8081
            - path: /api
              pathType: Prefix
              backend:
                service:
                  name: api
                  port:
                    number: 80
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: storefront
                  port:
                    number: 80
        - host: admin.example.com
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: admin
                  port:
                    name: web
  negatives:
  - manifest: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: shop
        namespace: shop
      spec:
        ingressClassName: edge
        tls:
        - hosts:
          - shop.example.com
          - admin.example.com
          secretName: shop-tls
        rules:
        - host: shop.example.com
          http:
            paths:
            - path: /api/health
              pathType: Exact
              backend:
                service:
                  name: health
                  port:
                    number: 8081
            - path: /api
              pathType: Prefix
              backend:
                service:
                  name: api
                  port:
                    number: 80
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: storefront
                  port:
                    number: 80
        - host: admin.example.com
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: admin
                  port:
                    name: web
    why: One TLS entry holds one Secret; admin.example.com would be served with the shop.example.com certificate, which does not cover it.
  - manifest: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: shop
        namespace: shop
      spec:
        ingressClassName: edge
        tls:
        - secretName: shop-tls
        - secretName: admin-tls
        rules:
        - host: shop.example.com
          http:
            paths:
            - path: /api/health
              pathType: Exact
              backend:
                service:
                  name: health
                  port:
                    number: 8081
            - path: /api
              pathType: Prefix
              backend:
                service:
                  name: api
                  port:
                    number: 80
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: storefront
                  port:
                    number: 80
        - host: admin.example.com
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: admin
                  port:
                    name: web
    why: Without hosts the TLS entries are not tied to the rule hosts; the hosts in spec.tls must explicitly match the host of the rules.
  - manifest: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: shop
        namespace: shop
      spec:
        ingressClassName: edge
        tls:
        - hosts:
          - shop.example.com
          secretName: shop-tls
        - hosts:
          - admin.example.com
          secretName: admin-tls
        rules:
        - host: shop.example.com
          http:
            paths:
            - path: /api/health
              pathType: Prefix
              backend:
                service:
                  name: health
                  port:
                    number: 8081
            - path: /api
              pathType: Prefix
              backend:
                service:
                  name: api
                  port:
                    number: 80
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: storefront
                  port:
                    number: 80
        - host: admin.example.com
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: admin
                  port:
                    number: web
    why: Prefix /api/health also catches /api/health/db, and a port name must go in port.name, not port.number.
explanation:
  correct:
    en: 'Each `spec.tls` entry pairs `hosts` with one `secretName` (a `kubernetes.io/tls` Secret with `tls.crt` and `tls.key`), so two certificates need two entries whose hosts match the rule hosts. Among the paths that match a request the longest wins, and `Exact` wins over `Prefix` at equal length, so `/api/health` reaches `health`, `/api/orders` reaches `api` and `/cart` reaches `storefront` whatever the order of the paths. A named Service port goes in `backend.service.port.name`.'
references:
- title: Ingress
  url: https://kubernetes.io/docs/concepts/services-networking/ingress/
