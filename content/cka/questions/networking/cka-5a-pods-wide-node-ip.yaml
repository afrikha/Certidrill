id: cka-5a-pods-wide-node-ip
objective: "5.1.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    You need to know which IP address each Pod of namespace `shop` received from the CNI plugin and on which node each Pod runs.

    List the Pods of namespace `shop` in a table that shows their Pod IP and their node. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl get
    path: verb
    op: equals
    value: get
  - id: resource
    label: Lists Pods
    path: resource
    op: equals
    value: pod
  - id: namespace
    label: Lists namespace shop
    path: flags.namespace
    op: equals
    value: shop
  - id: wide
    label: Uses the wide output, which adds the IP and NODE columns
    path: flags.output
    op: equals
    value: wide
  solution:
  - command: kubectl get pods -n shop -o wide
  - command: k get po -owide --namespace=shop
  - command: kubectl -n shop get pod --output=wide
  negatives:
  - command: kubectl get pods -n shop
    why: The default table has no IP and no NODE column.
  - command: kubectl get pods -o wide
    why: Without -n the command lists the context namespace, default.
  - command: kubectl get nodes -o wide
    why: This lists the nodes and their internal IPs, not the Pods and their Pod IPs.
explanation:
  correct:
    en: '`kubectl get pods -n shop -o wide` adds the IP, NODE, NOMINATED NODE and READINESS GATES columns to the Pod table. In the Kubernetes network model every Pod gets its own cluster-wide IP, assigned by the network plugin from the Pod range, and all Pods can reach each other without NAT. `kubectl get nodes -o wide` shows node addresses instead.'
references:
- title: Services, Load Balancing, and Networking
  url: https://kubernetes.io/docs/concepts/services-networking/
- title: Cluster Networking
  url: https://kubernetes.io/docs/concepts/cluster-administration/networking/
