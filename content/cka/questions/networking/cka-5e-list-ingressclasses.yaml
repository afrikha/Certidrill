id: cka-5e-list-ingressclasses
objective: "5.5.2"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    You must write an Ingress for a cluster you do not know. First find out which Ingress controllers are installed: list every IngressClass of the cluster, with the controller that implements it.

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Reads objects with get or describe
    path: verb
    op: oneOf
    value: [get, describe]
  - id: resource
    label: Reads the IngressClasses
    path: resource
    op: equals
    value: ingressclass
  - id: all
    label: Lists every class (no single name given)
    path: names
    op: length
    value: 0
  solution:
  - command: kubectl get ingressclass
  - command: k get ingressclasses -o wide
  - command: kubectl describe ingressclasses.networking.k8s.io
  negatives:
  - command: kubectl get ingress -A
    why: This lists the Ingress objects of every namespace and their class name, not the installed classes and their controllers.
  - command: kubectl get gatewayclass
    why: GatewayClasses belong to the Gateway API; Ingress objects are handled through IngressClasses.
  - command: kubectl get ingressclass nginx
    why: This reads one class whose name you only guessed; the task is to list all of them.
explanation:
  correct:
    en: 'IngressClass is a cluster-scoped resource (`networking.k8s.io/v1`) with `spec.controller` naming the controller that implements it, for example `example.com/ingress-controller`; `kubectl get ingressclass` lists them with a CONTROLLER column and `kubectl describe ingressclass` also shows the annotations, including `ingressclass.kubernetes.io/is-default-class`. An Ingress selects a class by its `metadata.name` in `spec.ingressClassName`; creating an Ingress has no effect if no controller serves its class.'
references:
- title: Ingress Controllers
  url: https://kubernetes.io/docs/concepts/services-networking/ingress-controllers/
- title: Ingress
  url: https://kubernetes.io/docs/concepts/services-networking/ingress/
