id: cka-1c-list-claims-all-namespaces
objective: "1.3.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    Before you create new PersistentVolumes, list every PersistentVolumeClaim of the cluster, in all namespaces, including the claims that are still `Pending` and have no volume yet.

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl get
    path: verb
    op: equals
    value: get
  - id: resource
    label: Lists PersistentVolumeClaims
    path: resource
    op: equals
    value: persistentvolumeclaim
  - id: all
    label: In all namespaces
    path: flags.all-namespaces
    op: equals
    value: true
  solution:
  - command: kubectl get pvc -A
  - command: k get persistentvolumeclaims --all-namespaces
  negatives:
  - command: kubectl get pv
    why: The CLAIM column of kubectl get pv shows only bound claims; a Pending claim has no PV.
  - command: kubectl get pvc
    why: Without -A only the claims of the context namespace are listed.
explanation:
  correct:
    en: |-
      Claims are namespaced, so `kubectl get pvc -A` (or `--all-namespaces`) lists them all with their STATUS, VOLUME, CAPACITY, ACCESS MODES and STORAGECLASS. PVs are cluster-scoped; `kubectl get pv` shows only the claims that are already bound in its CLAIM column.
references:
- title: Persistent Volumes
  url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
