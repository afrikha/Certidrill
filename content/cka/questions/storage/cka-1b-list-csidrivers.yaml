id: cka-1b-list-csidrivers
objective: "1.2.3"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    Before you write a static CSI PersistentVolume, check which CSI drivers are registered in the cluster: list the API objects that describe the installed CSI drivers.

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl get
    path: verb
    op: equals
    value: get
  - id: resource
    label: Lists CSIDriver objects
    path: resource
    op: oneOf
    value: [csidriver, csidrivers, csidrivers.storage.k8s.io, csidriver.storage.k8s.io]
  solution:
  - command: kubectl get csidrivers
  - command: k get csidriver
  - command: kubectl get csidrivers.storage.k8s.io
  negatives:
  - command: kubectl get storageclass
    why: StorageClasses name a provisioner, but they are not the drivers registered in the cluster.
  - command: kubectl get csinodes
    why: CSINode objects describe the drivers on each node, not the cluster-wide list of CSIDriver objects.
  - command: kubectl get volumeattachments
    why: VolumeAttachments record volumes attached to nodes, not the installed drivers.
explanation:
  correct:
    en: |-
      `kubectl get csidrivers` lists the cluster-scoped CSIDriver objects (`storage.k8s.io/v1`), one per installed driver, with its capabilities. Then use that driver name in `csi.driver` of a PV or in the `provisioner` of a StorageClass (`kubectl get sc` shows the provisioner of each class).
references:
- title: Volumes
  url: https://kubernetes.io/docs/concepts/storage/volumes/
