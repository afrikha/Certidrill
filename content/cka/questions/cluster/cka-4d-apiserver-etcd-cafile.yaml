id: cka-4d-apiserver-etcd-cafile
objective: "4.4.3"
difficulty: 3
status: draft
type: manifest
stem:
  en: |-
    After a colleague edited certificate paths in `/etc/kubernetes/manifests/kube-apiserver.yaml` on `cp1`, `kubectl` gets `connection refused` and `crictl ps -a` shows the `kube-apiserver` container exiting again and again. `crictl logs` of the last container shows:

    ```text
    grpc: addrConn.createTransport failed to connect to {Addr: "127.0.0.1:2379", ServerName: "127.0.0.1:2379"}. Err: connection error: desc = "transport: authentication handshake failed: tls: failed to verify certificate: x509: certificate signed by unknown authority"
    ```

    The editor shows the manifest (the `image` line and the probes are left out). The certificate files themselves are valid and follow the kubeadm layout. Fix the manifest so that kube-apiserver can connect to etcd again. Change only what causes this error.
body:
  starter: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: kube-apiserver
      namespace: kube-system
      labels:
        component: kube-apiserver
        tier: control-plane
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      containers:
      - name: kube-apiserver
        command:
        - kube-apiserver
        - --advertise-address=192.168.10.11
        - --authorization-mode=Node,RBAC
        - --client-ca-file=/etc/kubernetes/pki/ca.crt
        - --etcd-cafile=/etc/kubernetes/pki/ca.crt
        - --etcd-certfile=/etc/kubernetes/pki/apiserver-etcd-client.crt
        - --etcd-keyfile=/etc/kubernetes/pki/apiserver-etcd-client.key
        - --etcd-servers=https://127.0.0.1:2379
        - --kubelet-client-certificate=/etc/kubernetes/pki/apiserver-kubelet-client.crt
        - --kubelet-client-key=/etc/kubernetes/pki/apiserver-kubelet-client.key
        - --secure-port=6443
        - --service-account-issuer=https://kubernetes.default.svc.cluster.local
        - --service-account-key-file=/etc/kubernetes/pki/sa.pub
        - --service-account-signing-key-file=/etc/kubernetes/pki/sa.key
        - --service-cluster-ip-range=10.96.0.0/12
        - --tls-cert-file=/etc/kubernetes/pki/apiserver.crt
        - --tls-private-key-file=/etc/kubernetes/pki/apiserver.key
        volumeMounts:
        - mountPath: /etc/kubernetes/pki
          name: k8s-certs
          readOnly: true
      volumes:
      - hostPath:
          path: /etc/kubernetes/pki
          type: DirectoryOrCreate
        name: k8s-certs
answer:
  checks:
  - id: pod
    label: Static Pod kube-apiserver in namespace kube-system
    path: metadata
    op: subset
    value: {name: kube-apiserver, namespace: kube-system}
  - id: etcd-ca
    label: --etcd-cafile is the etcd CA, /etc/kubernetes/pki/etcd/ca.crt
    path: spec.containers[name=kube-apiserver].command
    op: contains
    value: --etcd-cafile=/etc/kubernetes/pki/etcd/ca.crt
  - id: no-wrong-ca
    label: --etcd-cafile no longer points to the cluster CA
    path: spec.containers[name=kube-apiserver].command
    op: matches
    value: ^(?!.*"--etcd-cafile=/etc/kubernetes/pki/ca\.crt").*$
  - id: etcd-client
    label: The etcd client certificate is still apiserver-etcd-client.crt
    path: spec.containers[name=kube-apiserver].command
    op: contains
    value: --etcd-certfile=/etc/kubernetes/pki/apiserver-etcd-client.crt
  - id: etcd-key
    label: The etcd client key is still apiserver-etcd-client.key
    path: spec.containers[name=kube-apiserver].command
    op: contains
    value: --etcd-keyfile=/etc/kubernetes/pki/apiserver-etcd-client.key
  - id: client-ca
    label: --client-ca-file still uses the cluster CA, /etc/kubernetes/pki/ca.crt
    path: spec.containers[name=kube-apiserver].command
    op: contains
    value: --client-ca-file=/etc/kubernetes/pki/ca.crt
  - id: mount
    label: /etc/kubernetes/pki is still mounted in the container
    path: spec.containers[name=kube-apiserver].volumeMounts[name=k8s-certs].mountPath
    op: equals
    value: /etc/kubernetes/pki
  solution:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: kube-apiserver
        namespace: kube-system
        labels:
          component: kube-apiserver
          tier: control-plane
      spec:
        hostNetwork: true
        priorityClassName: system-node-critical
        containers:
        - name: kube-apiserver
          command:
          - kube-apiserver
          - --advertise-address=192.168.10.11
          - --authorization-mode=Node,RBAC
          - --client-ca-file=/etc/kubernetes/pki/ca.crt
          - --etcd-cafile=/etc/kubernetes/pki/etcd/ca.crt
          - --etcd-certfile=/etc/kubernetes/pki/apiserver-etcd-client.crt
          - --etcd-keyfile=/etc/kubernetes/pki/apiserver-etcd-client.key
          - --etcd-servers=https://127.0.0.1:2379
          - --kubelet-client-certificate=/etc/kubernetes/pki/apiserver-kubelet-client.crt
          - --kubelet-client-key=/etc/kubernetes/pki/apiserver-kubelet-client.key
          - --secure-port=6443
          - --service-account-issuer=https://kubernetes.default.svc.cluster.local
          - --service-account-key-file=/etc/kubernetes/pki/sa.pub
          - --service-account-signing-key-file=/etc/kubernetes/pki/sa.key
          - --service-cluster-ip-range=10.96.0.0/12
          - --tls-cert-file=/etc/kubernetes/pki/apiserver.crt
          - --tls-private-key-file=/etc/kubernetes/pki/apiserver.key
          volumeMounts:
          - mountPath: /etc/kubernetes/pki
            name: k8s-certs
            readOnly: true
        volumes:
        - hostPath:
            path: /etc/kubernetes/pki
            type: DirectoryOrCreate
          name: k8s-certs
  negatives:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: kube-apiserver
        namespace: kube-system
      spec:
        hostNetwork: true
        containers:
        - name: kube-apiserver
          command:
          - kube-apiserver
          - --client-ca-file=/etc/kubernetes/pki/etcd/ca.crt
          - --etcd-cafile=/etc/kubernetes/pki/ca.crt
          - --etcd-certfile=/etc/kubernetes/pki/apiserver-etcd-client.crt
          - --etcd-keyfile=/etc/kubernetes/pki/apiserver-etcd-client.key
          - --etcd-servers=https://127.0.0.1:2379
          volumeMounts:
          - mountPath: /etc/kubernetes/pki
            name: k8s-certs
            readOnly: true
        volumes:
        - hostPath:
            path: /etc/kubernetes/pki
            type: DirectoryOrCreate
          name: k8s-certs
    why: --client-ca-file verifies the clients of the API server; the error comes from verifying etcd, which is --etcd-cafile, still wrong here.
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: kube-apiserver
        namespace: kube-system
      spec:
        hostNetwork: true
        containers:
        - name: kube-apiserver
          command:
          - kube-apiserver
          - --client-ca-file=/etc/kubernetes/pki/ca.crt
          - --etcd-cafile=/etc/kubernetes/pki/ca.crt
          - --etcd-certfile=/etc/kubernetes/pki/etcd/server.crt
          - --etcd-keyfile=/etc/kubernetes/pki/etcd/server.key
          - --etcd-servers=https://127.0.0.1:2379
          volumeMounts:
          - mountPath: /etc/kubernetes/pki
            name: k8s-certs
            readOnly: true
        volumes:
        - hostPath:
            path: /etc/kubernetes/pki
            type: DirectoryOrCreate
          name: k8s-certs
    why: The client certificate is not the problem; kube-apiserver cannot verify the etcd server certificate because --etcd-cafile still names the cluster CA.
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: kube-apiserver
        namespace: kube-system
      spec:
        hostNetwork: true
        containers:
        - name: kube-apiserver
          command:
          - kube-apiserver
          - --client-ca-file=/etc/kubernetes/pki/ca.crt
          - --etcd-cafile=/etc/kubernetes/pki/etcd/server.crt
          - --etcd-certfile=/etc/kubernetes/pki/apiserver-etcd-client.crt
          - --etcd-keyfile=/etc/kubernetes/pki/apiserver-etcd-client.key
          - --etcd-servers=https://127.0.0.1:2379
          volumeMounts:
          - mountPath: /etc/kubernetes/pki
            name: k8s-certs
            readOnly: true
        volumes:
        - hostPath:
            path: /etc/kubernetes/pki
            type: DirectoryOrCreate
          name: k8s-certs
    why: --etcd-cafile needs the CA that signed the etcd server certificate (etcd/ca.crt), not the server certificate itself.
explanation:
  correct:
    en: 'A kubeadm cluster has a separate CA for etcd: kube-apiserver verifies the etcd server certificate with `--etcd-cafile=/etc/kubernetes/pki/etcd/ca.crt` and authenticates with `apiserver-etcd-client.crt`/`.key`, which `etcd-ca` signs. "x509: certificate signed by unknown authority" on the connection to 127.0.0.1:2379 means that the CA given to the etcd client is not the one that signed etcd''s certificate. `--client-ca-file` is the cluster CA, used to verify the clients of the API server. The kubelet recreates the static Pod when the manifest is saved.'
references:
- title: PKI certificates and requirements
  url: https://kubernetes.io/docs/setup/best-practices/certificates/
- title: Certificate Management with kubeadm
  url: https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
