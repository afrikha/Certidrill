id: cka-4b-enable-kubelet-now
objective: "4.2.2"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    On node `node03` you have installed the `kubelet`, `kubeadm` and `kubectl` packages for v1.37 from `pkgs.k8s.io` and held them with `apt-mark hold`. The kubelet service is neither running nor enabled.

    With one command, enable the kubelet service so that it starts at every boot, and start it now. Type the single command you would run.
body:
  mode: invocation
  tools: [systemctl, kubeadm, journalctl]
  namespace: default
answer:
  checks:
  - id: tool
    label: Uses systemctl
    path: tool
    op: equals
    value: systemctl
  - id: verb
    label: Enables the service
    path: verb
    op: equals
    value: enable
  - id: now
    label: Starts it immediately (--now)
    path: flags.now
    op: equals
    value: true
  - id: unit
    label: Targets the kubelet unit
    path: args
    op: matches
    value: '^\["kubelet(\.service)?"\]$'
  solution:
  - command: systemctl enable --now kubelet
  - command: sudo systemctl enable kubelet.service --now
  negatives:
  - command: systemctl start kubelet
    why: start runs the kubelet now but does not enable it, so it will not start after a reboot.
  - command: systemctl enable kubelet
    why: Without --now the service is only enabled for the next boot; it is not started now.
  - command: systemctl enable --now containerd
    why: This enables the container runtime, not the kubelet.
explanation:
  correct:
    en: '`systemctl enable --now kubelet` enables the unit and starts it in one step, as the Installing kubeadm page shows. Until `kubeadm init` or `kubeadm join` writes its configuration, the kubelet restarts every few seconds in a crash loop: this is expected. The packages are held (`apt-mark hold`, or `exclude=` in the yum repository) so that a normal system upgrade does not change their version.'
references:
- title: Installing kubeadm
  url: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/install-kubeadm/
