id: cka-4e-external-etcd-config
objective: "4.5.1"
difficulty: 3
status: draft
type: manifest
stem:
  en: |-
    A highly available cluster will use the **external etcd** topology: three etcd hosts `10.0.20.11`, `10.0.20.12` and `10.0.20.13` (client port 2379) and three control plane nodes behind the load balancer `k8s-api.example.com:6443`. The etcd CA and the API server's etcd client certificate were copied to the first control plane node:

    - `/etc/kubernetes/pki/etcd/ca.crt`
    - `/etc/kubernetes/pki/apiserver-etcd-client.crt` and `/etc/kubernetes/pki/apiserver-etcd-client.key`

    Fix the `ClusterConfiguration` (below), written for a stacked cluster, so that `kubeadm init --config` uses the external etcd cluster and the load-balanced endpoint.
body:
  starter: |
    apiVersion: kubeadm.k8s.io/v1beta4
    kind: ClusterConfiguration
    kubernetesVersion: v1.37.1
    etcd:
      local:
        dataDir: /var/lib/etcd
    networking:
      podSubnet: 10.244.0.0/16
answer:
  checks:
  - id: endpoint
    label: controlPlaneEndpoint is k8s-api.example.com:6443
    path: controlPlaneEndpoint
    op: equals
    value: k8s-api.example.com:6443
  - id: no-local
    label: No local etcd (local and external are mutually exclusive)
    path: etcd.local
    op: absent
  - id: three-endpoints
    label: etcd.external.endpoints lists three members
    path: etcd.external.endpoints
    op: length
    value: 3
  - id: etcd-11
    label: Endpoint https://10.0.20.11:2379
    path: etcd.external.endpoints
    op: contains
    value: https://10.0.20.11:2379
  - id: etcd-12
    label: Endpoint https://10.0.20.12:2379
    path: etcd.external.endpoints
    op: contains
    value: https://10.0.20.12:2379
  - id: etcd-13
    label: Endpoint https://10.0.20.13:2379
    path: etcd.external.endpoints
    op: contains
    value: https://10.0.20.13:2379
  - id: ca
    label: caFile is the etcd CA
    path: etcd.external.caFile
    op: equals
    value: /etc/kubernetes/pki/etcd/ca.crt
  - id: cert
    label: certFile is the API server's etcd client certificate
    path: etcd.external.certFile
    op: equals
    value: /etc/kubernetes/pki/apiserver-etcd-client.crt
  - id: key
    label: keyFile is the API server's etcd client key
    path: etcd.external.keyFile
    op: equals
    value: /etc/kubernetes/pki/apiserver-etcd-client.key
  solution:
  - manifest: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      kubernetesVersion: v1.37.1
      controlPlaneEndpoint: k8s-api.example.com:6443
      etcd:
        external:
          endpoints:
          - https://10.0.20.11:2379
          - https://10.0.20.12:2379
          - https://10.0.20.13:2379
          caFile: /etc/kubernetes/pki/etcd/ca.crt
          certFile: /etc/kubernetes/pki/apiserver-etcd-client.crt
          keyFile: /etc/kubernetes/pki/apiserver-etcd-client.key
      networking:
        podSubnet: 10.244.0.0/16
  negatives:
  - manifest: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      kubernetesVersion: v1.37.1
      controlPlaneEndpoint: k8s-api.example.com:6443
      etcd:
        external:
          endpoints:
          - https://10.0.20.11:2380
          - https://10.0.20.12:2380
          - https://10.0.20.13:2380
          caFile: /etc/kubernetes/pki/etcd/ca.crt
          certFile: /etc/kubernetes/pki/apiserver-etcd-client.crt
          keyFile: /etc/kubernetes/pki/apiserver-etcd-client.key
      networking:
        podSubnet: 10.244.0.0/16
    why: 2380 is the etcd peer port; the API server connects to the client URLs on 2379.
  - manifest: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      kubernetesVersion: v1.37.1
      controlPlaneEndpoint: k8s-api.example.com:6443
      etcd:
        local:
          dataDir: /var/lib/etcd
        external:
          endpoints:
          - https://10.0.20.11:2379
          - https://10.0.20.12:2379
          - https://10.0.20.13:2379
          caFile: /etc/kubernetes/pki/etcd/ca.crt
          certFile: /etc/kubernetes/pki/apiserver-etcd-client.crt
          keyFile: /etc/kubernetes/pki/apiserver-etcd-client.key
      networking:
        podSubnet: 10.244.0.0/16
    why: etcd.local and etcd.external are mutually exclusive; the local section must be removed.
  - manifest: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      kubernetesVersion: v1.37.1
      controlPlaneEndpoint: k8s-api.example.com:6443
      etcd:
        external:
          endpoints:
          - https://10.0.20.11:2379
          caFile: /etc/kubernetes/pki/etcd/ca.crt
          certFile: /etc/kubernetes/pki/apiserver-etcd-client.crt
          keyFile: /etc/kubernetes/pki/apiserver-etcd-client.key
      networking:
        podSubnet: 10.244.0.0/16
    why: With a single endpoint the API servers lose etcd as soon as 10.0.20.11 fails, although the other two members still have quorum.
  - manifest: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      kubernetesVersion: v1.37.1
      controlPlaneEndpoint: k8s-api.example.com:6443
      etcd:
        external:
          endpoints:
          - https://10.0.20.11:2379
          - https://10.0.20.12:2379
          - https://10.0.20.13:2379
          caFile: /etc/kubernetes/pki/etcd/ca.crt
          certFile: /etc/kubernetes/pki/etcd/server.crt
          keyFile: /etc/kubernetes/pki/etcd/server.key
      networking:
        podSubnet: 10.244.0.0/16
    why: These are not the files that were copied; the API server authenticates to etcd with apiserver-etcd-client.crt and .key.
explanation:
  correct:
    en: 'In the external topology, etcd runs on separate hosts and every API server talks to all of them, so `etcd.external` lists the client URLs (`https://<host>:2379`) with `caFile`, `certFile` and `keyFile`; `local` and `external` are mutually exclusive. `controlPlaneEndpoint` is the load balancer address. Three etcd hosts tolerate one failure (quorum 2 of 3); this topology needs at least three control plane hosts and three etcd hosts.'
references:
- title: Creating Highly Available Clusters with kubeadm
  url: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/high-availability/
- title: Options for Highly Available Topology
  url: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/ha-topology/
