id: cka-4f-helm-get-manifest
objective: "4.6.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    The cluster component `cert-manager` was installed with Helm as the release `cert-manager` in namespace `cert-manager`. Before an audit, display the Kubernetes objects that the current revision of this release generated, as YAML, exactly as Helm stored them for the release.

    Type the single command you would run.
body:
  mode: invocation
  tools: [helm]
  namespace: default
answer:
  checks:
  - id: get
    label: Uses helm get
    path: verb
    op: equals
    value: get
  - id: manifest
    label: Fetches the manifest of the release
    path: args[0]
    op: equals
    value: manifest
  - id: release
    label: Targets the release cert-manager
    path: args[1]
    op: equals
    value: cert-manager
  - id: namespace
    label: Looks for the release in namespace cert-manager
    path: flags.namespace
    op: equals
    value: cert-manager
  solution:
  - command: helm get manifest cert-manager -n cert-manager
  - command: helm get manifest cert-manager --namespace=cert-manager
  negatives:
  - command: helm get values cert-manager -n cert-manager
    why: get values shows only the values supplied by the user, not the generated objects.
  - command: helm status cert-manager -n cert-manager
    why: status shows the state, revision and notes of the release, not its manifests.
  - command: helm get manifest cert-manager
    why: Without -n, Helm looks for the release in the namespace of the context, default, where it does not exist.
  - command: helm template cert-manager jetstack/cert-manager -n cert-manager
    why: template renders the chart again locally from the repository; it does not read what the release actually installed.
explanation:
  correct:
    en: '`helm get manifest RELEASE` fetches the generated manifest of a release: the YAML of the Kubernetes objects rendered from its chart, as stored in the release record. Release records live in the release namespace, so `-n cert-manager` is required; `--revision` would select an older revision. `helm get values` returns only the user-supplied values and `helm template` renders the chart again, which may differ from what is installed.'
references:
- title: helm get manifest
  url: https://helm.sh/docs/helm/helm_get_manifest/
