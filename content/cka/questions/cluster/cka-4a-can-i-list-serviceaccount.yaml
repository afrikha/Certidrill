id: cka-4a-can-i-list-serviceaccount
objective: "4.1.2"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    The ServiceAccount `deployer` of namespace `ci` deploys into namespace `staging`. You are allowed to impersonate.

    Print every action this ServiceAccount is allowed to perform in namespace `staging`. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl auth
    path: verb
    op: equals
    value: auth
  - id: subverb
    label: Uses can-i
    path: subverb
    op: equals
    value: can-i
  - id: list
    label: Prints all allowed actions with --list
    path: flags.list
    op: equals
    value: true
  - id: as
    label: Impersonates system:serviceaccount:ci:deployer
    path: flags.as
    op: equals
    value: system:serviceaccount:ci:deployer
  - id: namespace
    label: Checks namespace staging
    path: flags.namespace
    op: equals
    value: staging
  solution:
  - command: kubectl auth can-i --list --as=system:serviceaccount:ci:deployer -n staging
  - command: k auth can-i --list --namespace staging --as system:serviceaccount:ci:deployer
  negatives:
  - command: kubectl auth can-i --list --as=system:serviceaccount:ci:deployer -n ci
    why: -n sets the namespace being checked; this lists the actions in ci, not in staging.
  - command: kubectl auth can-i --list --as=deployer -n staging
    why: --as=deployer impersonates a user named deployer; a ServiceAccount is system:serviceaccount:<namespace>:<name>.
  - command: kubectl auth can-i create deployments --as=system:serviceaccount:ci:deployer -n staging
    why: This answers yes or no for one action instead of listing every allowed action.
explanation:
  correct:
    en: '`kubectl auth can-i --list` prints the resources and verbs the identity may use in the namespace given by `-n`. `--as=system:serviceaccount:ci:deployer` impersonates the ServiceAccount: its user name is `system:serviceaccount:<namespace>:<name>`, with the namespace where the account lives (ci), while `-n staging` is where access is tested.'
references:
- title: kubectl auth can-i
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_auth/kubectl_auth_can-i/
