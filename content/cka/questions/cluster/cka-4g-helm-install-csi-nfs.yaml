id: cka-4g-helm-install-csi-nfs
objective: "4.7.2"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    The Helm repository `csi-driver-nfs` is already added and updated. Since chart version 4.11.0, this chart's versions have no `v` prefix.

    With `helm install`, install the chart `csi-driver-nfs/csi-driver-nfs` at version `4.13.4` as the release `csi-driver-nfs` in namespace `kube-system`. Type the single command you would run.
body:
  mode: invocation
  namespace: default
  tools: [helm, kubectl]
answer:
  checks:
  - id: tool
    label: Uses helm install
    path: verb
    op: equals
    value: install
  - id: helm
    label: The tool is helm
    path: tool
    op: equals
    value: helm
  - id: release
    label: Release name is csi-driver-nfs
    path: args[0]
    op: equals
    value: csi-driver-nfs
  - id: chart
    label: Chart is csi-driver-nfs/csi-driver-nfs
    path: args[1]
    op: equals
    value: csi-driver-nfs/csi-driver-nfs
  - id: namespace
    label: Installs into namespace kube-system
    path: flags.namespace
    op: equals
    value: kube-system
  - id: version
    label: Pins chart version 4.13.4
    path: flags.version
    op: equals
    value: 4.13.4
  solution:
  - command: helm install csi-driver-nfs csi-driver-nfs/csi-driver-nfs --namespace kube-system --version 4.13.4
  - command: helm install csi-driver-nfs csi-driver-nfs/csi-driver-nfs -n kube-system --version=4.13.4
  - command: helm -n kube-system install csi-driver-nfs csi-driver-nfs/csi-driver-nfs --version 4.13.4
  negatives:
  - command: helm install csi-driver-nfs csi-driver-nfs/csi-driver-nfs --namespace kube-system --version v4.13.4
    why: The chart versions of this repository have no v prefix since 4.11.0, so v4.13.4 is not found.
  - command: helm install csi-driver-nfs csi-driver-nfs/csi-driver-nfs --version 4.13.4
    why: Without --namespace the release and the driver go to the context namespace, default.
  - command: helm install csi-driver-nfs/csi-driver-nfs --namespace kube-system --version 4.13.4
    why: helm install needs a release name before the chart (or --generate-name); this command fails.
explanation:
  correct:
    en: '`helm install RELEASE CHART` takes the release name first, then `repo/chart`. `--namespace` (`-n`) selects the namespace of the release and of its namespaced objects, and `--version` pins the chart version exactly as the repository publishes it (here `4.13.4`, without `v`). Then `kubectl get csidrivers` should list `nfs.csi.k8s.io`.'
references:
- title: Install CSI driver with Helm 3
  url: https://github.com/kubernetes-csi/csi-driver-nfs/blob/master/charts/README.md
- title: helm install
  url: https://helm.sh/docs/helm/helm_install/
