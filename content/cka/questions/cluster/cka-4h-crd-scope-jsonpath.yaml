id: cka-4h-crd-scope-jsonpath
objective: "4.8.2"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    You must know whether the objects of the CRD `storagetiers.platform.example.com` are namespaced. Print only the value of the CRD's scope field (`Namespaced` or `Cluster`), using a JSONPath output.

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl get
    path: verb
    op: equals
    value: get
  - id: resource
    label: Reads a CustomResourceDefinition
    path: resource
    op: equals
    value: customresourcedefinition
  - id: name
    label: Names the CRD storagetiers.platform.example.com
    path: names
    op: contains
    value: storagetiers.platform.example.com
  - id: jsonpath
    label: Prints {.spec.scope} with -o jsonpath
    path: flags.output
    op: matches
    value: '^jsonpath=\{\.spec\.scope\}$'
  solution:
  - command: kubectl get crd storagetiers.platform.example.com -o jsonpath='{.spec.scope}'
  - command: k get customresourcedefinitions storagetiers.platform.example.com -o=jsonpath="{.spec.scope}"
  - command: kubectl get crd/storagetiers.platform.example.com --output 'jsonpath={.spec.scope}'
  negatives:
  - command: kubectl get storagetiers -o jsonpath='{.spec.scope}'
    why: This reads the StorageTier objects themselves, which have no spec.scope; the scope is a field of the CRD.
  - command: kubectl get crd storagetiers.platform.example.com -o jsonpath='{.scope}'
    why: scope sits under spec in the CRD; {.scope} prints nothing.
  - command: kubectl describe crd storagetiers.platform.example.com
    why: describe prints the whole definition, not only the scope value.
explanation:
  correct:
    en: 'A CRD is an ordinary API object (`customresourcedefinitions`, short name `crd`), named `<plural>.<group>`, and its scope is `spec.scope`. `kubectl get crd storagetiers.platform.example.com -o jsonpath=''{.spec.scope}''` prints `Namespaced` or `Cluster`. Quote the JSONPath expression so that the shell keeps the braces. `kubectl api-resources` also shows the NAMESPACED column for every resource.'
references:
- title: Extend the Kubernetes API with CustomResourceDefinitions
  url: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/
