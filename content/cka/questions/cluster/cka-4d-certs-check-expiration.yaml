id: cka-4d-certs-check-expiration
objective: "4.4.3"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    On the control plane node `cp1` of a kubeadm cluster, display the expiration date and the residual time of every certificate that kubeadm manages: the certificates in `/etc/kubernetes/pki`, the client certificates embedded in `admin.conf`, `controller-manager.conf` and `scheduler.conf`, and the certificate authorities. Nothing may be renewed.

    Type the single command you would run.
body:
  mode: invocation
  tools: [kubeadm, kubectl]
  namespace: default
answer:
  checks:
  - id: tool
    label: Uses kubeadm
    path: tool
    op: equals
    value: kubeadm
  - id: certs
    label: Runs a kubeadm certs command
    path: verb
    op: equals
    value: certs
  - id: check
    label: Uses check-expiration
    path: args[0]
    op: equals
    value: check-expiration
  solution:
  - command: kubeadm certs check-expiration
  - command: sudo kubeadm certs check-expiration
  negatives:
  - command: kubeadm certs renew all
    why: renew all issues new certificates; the task only asks to display the expiration dates.
  - command: kubectl get csr
    why: CertificateSigningRequests are requests sent to the API; this lists none of the kubeadm certificates or their expiry.
  - command: kubeadm certs certificate-key
    why: certificate-key generates a key used to upload control plane certificates when joining control plane nodes.
explanation:
  correct:
    en: '`kubeadm certs check-expiration` lists each kubeadm-managed certificate (`apiserver`, `apiserver-etcd-client`, `apiserver-kubelet-client`, `etcd-server`, `front-proxy-client`…, plus the client certificates of `admin.conf`, `controller-manager.conf` and `scheduler.conf`) with its expiry date, residual time and signing CA, then the CAs `ca`, `etcd-ca` and `front-proxy-ca`. `kubelet.conf` is not listed because the kubelet rotates its client certificate itself. Leaf certificates last one year by default.'
references:
- title: Certificate Management with kubeadm
  url: https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
