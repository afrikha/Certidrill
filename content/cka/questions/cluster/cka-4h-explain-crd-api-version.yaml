id: cka-4h-explain-crd-api-version
objective: "4.8.2"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    The CRD `backupschedules.ops.example.com` serves two versions, `v1` and `v2`; `v2` is the storage version and kubectl's default. An old script still creates objects in `v1`.

    Show the documentation of the field `spec.target` as defined in version `v1` of `backupschedules`. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl explain
    path: verb
    op: equals
    value: explain
  - id: field
    label: Explains backupschedules.spec.target
    path: args[0]
    op: matches
    value: '^([Bb]ackup[Ss]chedules?|bks)\.spec\.target$'
  - id: version
    label: Selects ops.example.com/v1 with --api-version
    path: flags.api-version
    op: equals
    value: ops.example.com/v1
  solution:
  - command: kubectl explain backupschedules.spec.target --api-version=ops.example.com/v1
  - command: k explain bks.spec.target --api-version ops.example.com/v1
  - command: kubectl explain BackupSchedule.spec.target --api-version=ops.example.com/v1 --recursive
  negatives:
  - command: kubectl explain backupschedules.spec.target
    why: Without --api-version kubectl explains the preferred version, v2, which may define target differently.
  - command: kubectl explain backupschedules.spec.target --api-version=v1
    why: --api-version takes group/version; v1 alone is the core group, which has no backupschedules.
  - command: kubectl explain backupschedules --api-version=ops.example.com/v1
    why: This shows only the top-level fields of the resource, not spec.target.
explanation:
  correct:
    en: '`kubectl explain TYPE.FIELD` reads the schema the API server publishes, CRD schemas included; the type can be the plural, singular, kind or short name. When several versions are served, kubectl uses the highest-priority one (`v2` sorts before `v1`), so `--api-version=ops.example.com/v1` (group/version) is needed to see the v1 schema.'
references:
- title: kubectl explain
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_explain/
- title: Versions in CustomResourceDefinitions
  url: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definition-versioning/
