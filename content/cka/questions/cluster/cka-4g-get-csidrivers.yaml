id: cka-4g-get-csidrivers
objective: "4.7.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    Before writing a StorageClass, you need the names of the CSI drivers installed in the cluster. List the cluster-scoped objects that each CSI driver registers to describe itself (attach required, Pod info on mount, volume lifecycle modes).

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl get
    path: verb
    op: equals
    value: get
  - id: resource
    label: Lists CSIDriver objects
    path: resource
    op: oneOf
    value: [csidriver, csidrivers, csidrivers.storage.k8s.io, csidriver.storage.k8s.io]
  solution:
  - command: kubectl get csidrivers
  - command: k get csidrivers.storage.k8s.io
  - command: kubectl get csidriver
  negatives:
  - command: kubectl get storageclasses
    why: StorageClasses show the provisioner they request, not the drivers that are actually installed.
  - command: kubectl get csinodes
    why: CSINode objects list, per node, the drivers registered by the kubelet; they are not the driver objects the task asks for.
  - command: kubectl get pods -n kube-system
    why: Driver Pods may run in any namespace and their names are not the driver names.
explanation:
  correct:
    en: 'A CSI driver describes itself with a non-namespaced `CSIDriver` object (`storage.k8s.io/v1`) whose `metadata.name` is the driver name used as a StorageClass `provisioner`, with fields such as `attachRequired`, `podInfoOnMount` and `volumeLifecycleModes`. `kubectl get csidrivers` lists them. CSINode objects show which drivers the kubelet registered on each node.'
references:
- title: CSIDriver
  url: https://kubernetes.io/docs/reference/kubernetes-api/config-and-storage-resources/csi-driver-v1/
