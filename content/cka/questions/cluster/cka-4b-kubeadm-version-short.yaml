id: cka-4b-kubeadm-version-short
objective: "4.2.2"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    A script that prepares nodes must check, on node `node03`, that the installed kubeadm package is the target version before it runs `kubeadm join`.

    Print only the version string of the installed kubeadm (for example `v1.37.1`), with no other information. Type the single command you would run.
body:
  mode: invocation
  tools: [kubeadm, kubectl, systemctl]
  namespace: default
answer:
  checks:
  - id: tool
    label: Uses kubeadm
    path: tool
    op: equals
    value: kubeadm
  - id: verb
    label: Runs kubeadm version
    path: verb
    op: equals
    value: version
  - id: short
    label: Uses the short output format (-o short)
    path: flags
    op: matches
    value: '"(o|output)":"short"'
  solution:
  - command: kubeadm version -o short
  - command: kubeadm version --output=short
  negatives:
  - command: kubeadm version
    why: Without -o short, kubeadm prints the whole version structure (git commit, build date, Go version...), not only the version string.
  - command: kubeadm version -o yaml
    why: yaml prints the full version information as a YAML document.
  - command: kubectl version --client
    why: This reports the kubectl client version, not kubeadm's.
explanation:
  correct:
    en: '`kubeadm version` prints the version of kubeadm; `-o`/`--output` accepts `yaml`, `json` and `short`, and `short` prints only the version string. kubeadm must match the cluster: for `kubeadm join`, the kubeadm binary must match the version last used to create or upgrade the cluster; kubeadm 1.37 can run a control plane at 1.37 or 1.36.'
references:
- title: kubeadm version
  url: https://kubernetes.io/docs/reference/setup-tools/kubeadm/kubeadm-version/
- title: Creating a cluster with kubeadm
  url: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/
