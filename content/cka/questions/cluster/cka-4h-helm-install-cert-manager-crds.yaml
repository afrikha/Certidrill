id: cka-4h-helm-install-cert-manager-crds
objective: "4.8.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    The Helm repository `jetstack` is already added. Install the operator cert-manager from the chart `jetstack/cert-manager` at version `v1.21.3`, as the release `cert-manager` in namespace `cert-manager`, which does not exist yet. The chart must also install cert-manager's CustomResourceDefinitions, which it does only when the value `crds.enabled` is `true`.

    Type the single `helm install` command you would run.
body:
  mode: invocation
  namespace: default
  tools: [helm, kubectl]
answer:
  checks:
  - id: install
    label: Uses helm install
    path: verb
    op: equals
    value: install
  - id: release
    label: Release name is cert-manager
    path: args[0]
    op: equals
    value: cert-manager
  - id: chart
    label: Chart is jetstack/cert-manager
    path: args[1]
    op: equals
    value: jetstack/cert-manager
  - id: namespace
    label: Installs into namespace cert-manager
    path: flags.namespace
    op: equals
    value: cert-manager
  - id: create-ns
    label: Creates the namespace with --create-namespace
    path: flags.create-namespace
    op: equals
    value: true
  - id: version
    label: Pins chart version v1.21.3
    path: flags.version
    op: equals
    value: v1.21.3
  - id: crds
    label: Sets crds.enabled=true
    path: flags.set
    op: contains
    value: crds.enabled=true
  solution:
  - command: helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --version v1.21.3 --set crds.enabled=true
  - command: helm install cert-manager jetstack/cert-manager -n cert-manager --create-namespace --version=v1.21.3 --set=crds.enabled=true
  negatives:
  - command: helm install cert-manager jetstack/cert-manager --namespace cert-manager --version v1.21.3 --set crds.enabled=true
    why: The namespace cert-manager does not exist; without --create-namespace the install fails.
  - command: helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --version v1.21.3
    why: Without crds.enabled=true the chart installs no CRDs, so Certificate and Issuer objects cannot be created.
  - command: helm install jetstack/cert-manager --namespace cert-manager --create-namespace --version v1.21.3 --set crds.enabled=true
    why: The release name is missing; helm install needs NAME before CHART (or --generate-name).
explanation:
  correct:
    en: 'An operator chart installs the controller and, here, its CRDs: `helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --version v1.21.3 --set crds.enabled=true`. `--create-namespace` creates the release namespace when it is missing, and `--set crds.enabled=true` makes the chart render the CRDs. Check them afterwards with `kubectl get crds | grep cert-manager.io`.'
references:
- title: Helm
  url: https://cert-manager.io/docs/installation/helm/
- title: helm install
  url: https://helm.sh/docs/helm/helm_install/
