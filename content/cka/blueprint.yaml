# CKA — Certified Kubernetes Administrator (practice, without a cluster)
# Everything describing the exam is data: changing it requires no code change.
# Sources (checked on 2026-11-27):
#   - Certification page: https://training.linuxfoundation.org/certification/certified-kubernetes-administrator-cka/
#     (online, proctored, performance-based; 2 hours; exam based on Kubernetes v1.37; $445 exam only; two simulator
#     attempts (killer.sh, 36 hours each); one retake; certification valid 2 years; domains Storage 10 %,
#     Troubleshooting 30 %, Workloads & Scheduling 15 %, Cluster Architecture, Installation & Configuration 25 %,
#     Services & Networking 20 %).
#   - Important tips CKA & CKAD (docs.linuxfoundation.org/tc-docs/certification/tips-cka-and-ckad): 15–20
#     performance-based tasks on the Linux command line, 2 hours, Kubernetes v1.37, PSI Bridge secure browser,
#     each task on a host reached with ssh, `sudo -i` allowed, kubectl with the `k` alias and Bash completion.
#   - FAQ CKA/CKAD/CKS (…/faq-cka-ckad-cks): CKA passes at 66 %, scored automatically.
#   - Resources allowed (…/certification-resources-allowed): kubernetes.io/docs, kubernetes.io/blog, helm.sh/docs,
#     gateway-api.sigs.k8s.io (CKA only).
#   - Candidate handbook, Language page: English, Japanese, Simplified Chinese. French is NOT offered.
# Certidrill cannot run a real cluster: the "exam" here is a practice set of command and manifest exercises
# checked without a cluster (docs/SPECS-KUBERNETES-PRATIQUE.md), labelled as such. Node work (kubelet, static Pods,
# kubeadm, etcdctl, crictl, systemctl) is practised as commands and configuration files; real troubleshooting of a
# broken cluster is not reproduced.
# 17 exercises (middle of 15–20), 120 minutes, pass at 66 %, scored per check. Readiness and progression as CKAD.
# active: false until the application supports the exercise types and the content is reviewed.
certification:
  code: cka
  title: Certified Kubernetes Administrator
  vendor: CNCF
  languages: [en]
  format: performance
  active: false
blueprint:
  version: 'v1.37'
  durationMin: 120
  questionCount:
    min: 17
    max: 17
  passScore: 66
  maxScore: 100
  scoring:
    multi: all_or_nothing
    dragdrop: all_or_nothing
    command: per_check
    manifest: per_check
  # Practice tasks only: commands typed at the prompt and manifests written in the editor.
  typeMix:
    command:
      min: 0.35
      max: 0.55
    manifest:
      min: 0.45
      max: 0.65
  difficultyMix:
    easy: 0.15
    medium: 0.5
    hard: 0.35
  structure:
    caseStudies:
      count:
        min: 0
        max: 0
      questionsEach:
        min: 0
        max: 0
      placement: end
    series:
      count:
        min: 0
        max: 0
      questionsEach:
        min: 0
        max: 0
    maxPerObjective: 2
    warningsMin:
    - 10
    - 5
    readiness:
      minAttempts: 3
      consecutive: 3
      minScore: 72
      domainFloor: 60
      recent: 3
      window: 5
      scale:
        from: 50
        to: 80
      weights:
        level: 0.5
        consistency: 0.2
        domains: 0.2
        freshness: 0.1
      bands:
        progressing: 50
        almost: 70
        ready: 85
      freshness:
        staleDays: 30
        zeroDays: 90
        minNewShare: 0.5
    progression:
      xp:
        base: 50
        scoreFrom: 40
        perPoint: 5
        knownShare: 0.5
        passBonus: 100
        bestBonus: 75
        domainBonus: 50
        domainGain: 5
      levels:
      - xp: 0
