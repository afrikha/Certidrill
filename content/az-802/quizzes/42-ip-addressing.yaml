chapter: 42-ip-addressing
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-42-01
    objective: "4.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A DHCP server named **DHCP1** hosts a scope for the subnet 10.20.4.0/24. The clients of this subnet must use 10.20.4.1 as their default gateway.

        Which scope option should you configure?
      fr: |
        Un serveur DHCP nommé **DHCP1** héberge une étendue pour le sous-réseau 10.20.4.0/24. Les clients de ce sous-réseau doivent utiliser 10.20.4.1 comme passerelle par défaut.

        Quelle option d'étendue devez-vous configurer ?
    body:
      options:
        - { id: a, text: "006 DNS Servers" }
        - { id: b, text: "015 DNS Domain Name" }
        - { id: c, text: "003 Router" }
        - { id: d, text: "044 WINS/NBNS Servers" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Option 003, Router, sets the default gateway of the clients. It is usually configured at the scope level, because the gateway is specific to each subnet.
        fr: |
          L'option 003, Router, définit la passerelle par défaut des clients. Elle se configure en général au niveau de l'étendue, car la passerelle est propre à chaque sous-réseau.
      options:
        a: { en: "Option 006 gives the clients the addresses of their DNS servers, not their gateway.", fr: "L'option 006 donne aux clients les adresses de leurs serveurs DNS, pas leur passerelle." }
        b: { en: "Option 015 sets the DNS domain name (suffix) of the clients.", fr: "L'option 015 définit le nom de domaine DNS (suffixe) des clients." }
        d: { en: "Option 044 lists WINS servers for NetBIOS name resolution.", fr: "L'option 044 liste les serveurs WINS pour la résolution des noms NetBIOS." }
    references:
      - title: Configure DHCP options - Training
        url: https://learn.microsoft.com/en-us/training/modules/deploy-manage-dynamic-host-configuration-protocol/4-configure-dynamic-host-configuration-protocol-options

  # ------------------------------------------------------------------ 2
  - id: az802-qz-42-02
    objective: "4.2.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Two DHCP servers, **DHCP1** in Paris and **DHCP2** in Lyon, share several scopes in a load balance failover relationship. A new firewall between the two sites blocks all traffic that isn't explicitly allowed. Since its deployment, the relationship stays in the communication interrupted state.

        Which traffic must you allow between DHCP1 and DHCP2?
      fr: |
        Deux serveurs DHCP, **DHCP1** à Paris et **DHCP2** à Lyon, partagent plusieurs étendues dans une relation de basculement en équilibrage de charge. Un nouveau pare-feu entre les deux sites bloque tout trafic qui n'est pas explicitement autorisé. Depuis son déploiement, la relation reste à l'état d'interruption des communications.

        Quel trafic devez-vous autoriser entre DHCP1 et DHCP2 ?
    body:
      options:
        - { id: a, text: "UDP 67" }
        - { id: b, text: "UDP 68" }
        - { id: c, text: "TCP 135" }
        - { id: d, text: "TCP 647" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Failover partners exchange their failover messages over TCP port 647. Installing the DHCP Server role creates the matching Windows Firewall rules, but a network firewall between the sites must allow this port too, or the partners can't communicate.
        fr: |
          Les partenaires de basculement échangent leurs messages de basculement sur le port TCP 647. L'installation du rôle serveur DHCP crée les règles correspondantes du Pare-feu Windows, mais un pare-feu réseau entre les sites doit lui aussi autoriser ce port, sinon les partenaires ne peuvent pas communiquer.
      options:
        a: { en: "UDP 67 is the port on which a DHCP server receives client and relay messages; it doesn't carry failover messages.", fr: "UDP 67 est le port sur lequel un serveur DHCP reçoit les messages des clients et des relais ; il ne transporte pas les messages de basculement." }
        b: { en: "UDP 68 is the port of the DHCP clients.", fr: "UDP 68 est le port des clients DHCP." }
        c: { en: "TCP 135 is the RPC endpoint mapper used by remote management tools, not by failover messages.", fr: "TCP 135 est le mappeur de points de terminaison RPC utilisé par les outils de gestion à distance, pas par les messages de basculement." }
    references:
      - title: DHCP failover in Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-failover

  # ------------------------------------------------------------------ 3
  - id: az802-qz-42-03
    objective: "4.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A DHCP server named **DHCP1** serves the subnet 10.30.2.0/24. Years ago, technicians configured static IP addresses inside the scope range on some printers and cameras, and nobody knows which addresses they used. Users now report IP address conflict warnings.

        Until an inventory of the static devices is complete, DHCP1 must check that an address isn't in use before it leases it. What should you run on DHCP1?
      fr: |
        Un serveur DHCP nommé **DHCP1** dessert le sous-réseau 10.30.2.0/24. Il y a plusieurs années, des techniciens ont configuré des adresses IP statiques dans la plage de l'étendue sur certaines imprimantes et caméras, et personne ne sait quelles adresses ils ont utilisées. Les utilisateurs signalent maintenant des avertissements de conflit d'adresses IP.

        Jusqu'à la fin de l'inventaire des appareils statiques, DHCP1 doit vérifier qu'une adresse n'est pas utilisée avant de l'attribuer. Que devez-vous exécuter sur DHCP1 ?
    body:
      options:
        - { id: a, text: "`Set-DhcpServerv4DnsSetting -NameProtection $true`" }
        - { id: b, text: "`Set-DhcpServerSetting -ConflictDetectionAttempts 2`" }
        - { id: c, text: "`Set-DhcpServerv4FilterList -Deny $true`" }
        - { id: d, text: "`Set-DhcpServerv4Scope -ScopeId 10.30.2.0 -State InActive`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With conflict detection, the server pings an address before it leases it, from one to five attempts (the default is 0, disabled). An address that answers is not leased, which avoids conflicts with static devices whose addresses aren't excluded yet. Once the inventory is done, exclusion ranges are the lasting solution.
        fr: |
          Avec la détection de conflits, le serveur envoie un ping à une adresse avant de l'attribuer, de une à cinq tentatives (0 par défaut, c'est-à-dire désactivée). Une adresse qui répond n'est pas attribuée, ce qui évite les conflits avec les appareils statiques dont les adresses ne sont pas encore exclues. Une fois l'inventaire terminé, les plages d'exclusion sont la solution durable.
      options:
        a: { en: "Name protection prevents a DNS registration from overwriting an existing record with the same name; it doesn't test IP addresses.", fr: "La protection de nom empêche une inscription DNS d'écraser un enregistrement existant de même nom ; elle ne teste pas les adresses IP." }
        c: { en: "Enabling the deny filter list blocks the MAC addresses in that list; it doesn't detect addresses already in use.", fr: "L'activation de la liste de refus bloque les adresses MAC de cette liste ; elle ne détecte pas les adresses déjà utilisées." }
        d: { en: "Deactivating the scope stops all leases on the subnet instead of avoiding the conflicting addresses.", fr: "Désactiver l'étendue arrête tous les baux du sous-réseau au lieu d'éviter les adresses en conflit." }
    references:
      - title: Set-DhcpServerSetting (DhcpServer)
        url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/set-dhcpserversetting

  # ------------------------------------------------------------------ 4
  - id: az802-qz-42-04
    objective: "4.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You deploy an Azure virtual machine named **DNS1** that will run the DNS Server role for the virtual network **VNet-Hub**. The network interface of DNS1 received the private IP address 10.1.0.4 with dynamic allocation. Other servers will be configured to use 10.1.0.4 as their DNS server.

        You need to ensure that DNS1 always keeps 10.1.0.4. The solution must follow Microsoft recommendations. What should you do?
      fr: |
        Vous déployez une machine virtuelle Azure nommée **DNS1** qui exécutera le rôle Serveur DNS pour le réseau virtuel **VNet-Hub**. L'interface réseau de DNS1 a reçu l'adresse IP privée 10.1.0.4 avec une allocation dynamique. D'autres serveurs seront configurés pour utiliser 10.1.0.4 comme serveur DNS.

        Vous devez faire en sorte que DNS1 conserve toujours 10.1.0.4. La solution doit suivre les recommandations de Microsoft. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In the IPv4 properties of the Windows network adapter of DNS1, set 10.1.0.4 as a static address.", fr: "Dans les propriétés IPv4 de la carte réseau Windows de DNS1, définir 10.1.0.4 comme adresse statique." } }
        - { id: b, text: { en: "On a Windows DHCP server in VNet-Hub, create a reservation of 10.1.0.4 for the MAC address of DNS1.", fr: "Sur un serveur DHCP Windows de VNet-Hub, créer une réservation de 10.1.0.4 pour l'adresse MAC de DNS1." } }
        - { id: c, text: { en: "Associate a Standard SKU public IP address with static allocation to the network interface of DNS1.", fr: "Associer une adresse IP publique de référence SKU Standard avec allocation statique à l'interface réseau de DNS1." } }
        - { id: d, text: { en: "In the IP configuration of the network interface of DNS1, set the private IP allocation to Static.", fr: "Dans la configuration IP de l'interface réseau de DNS1, définir l'allocation de l'adresse IP privée sur Static." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          In Azure, the private address of a VM is a property of its network interface, and the Azure DHCP service delivers it to the operating system. When a resource needs a specific private address, Microsoft recommends static allocation on the IP configuration of the network interface, while Windows keeps obtaining its address automatically.
        fr: |
          Dans Azure, l'adresse privée d'une machine virtuelle est une propriété de son interface réseau, et le service DHCP d'Azure la transmet au système d'exploitation. Quand une ressource a besoin d'une adresse privée précise, Microsoft recommande l'allocation statique sur la configuration IP de l'interface réseau, tandis que Windows continue d'obtenir son adresse automatiquement.
      options:
        a: { en: "Microsoft recommends never setting the IP address manually inside the operating system of an Azure VM; a mismatch with the network interface cuts the VM off.", fr: "Microsoft recommande de ne jamais définir l'adresse IP à la main dans le système d'exploitation d'une machine virtuelle Azure ; une incohérence avec l'interface réseau coupe la machine virtuelle du réseau." }
        b: { en: "Azure provides DHCP to the VMs of a virtual network, and broadcasts aren't supported, so a Windows DHCP server can't lease addresses to Azure VMs.", fr: "Azure fournit le DHCP aux machines virtuelles d'un réseau virtuel et la diffusion n'est pas prise en charge : un serveur DHCP Windows ne peut pas attribuer d'adresses aux machines virtuelles Azure." }
        c: { en: "A static public IP address doesn't change the allocation of the private address that the other servers use.", fr: "Une adresse IP publique statique ne change pas l'allocation de l'adresse privée qu'utilisent les autres serveurs." }
    references:
      - title: Configure IP addresses for an Azure network interface
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/virtual-network-network-interface-addresses

  # ------------------------------------------------------------------ 5
  - id: az802-qz-42-05
    objective: "4.2.3"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        A Windows 11 computer obtained a lease from a DHCP server named **DHCP1** on Monday at 08:00. The lease duration of the scope is 6 days. On Monday at 09:00, DHCP1 fails and stays offline. No other DHCP server is available, and the computer stays on and connected.

        How does the computer try to keep its address? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un ordinateur Windows 11 a obtenu un bail d'un serveur DHCP nommé **DHCP1** le lundi à 08:00. La durée du bail de l'étendue est de 6 jours. Le lundi à 09:00, DHCP1 tombe en panne et reste hors ligne. Aucun autre serveur DHCP n'est disponible, et l'ordinateur reste allumé et connecté.

        Comment l'ordinateur tente-t-il de conserver son adresse ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    shuffle: false
    body:
      layout: text
      template:
        en: |
          First renewal attempt: [[t1]]

          Message sent for this first attempt: [[msg]]

          Next attempt if DHCP1 still doesn't answer: [[t2]]
        fr: |
          Première tentative de renouvellement : [[t1]]

          Message envoyé pour cette première tentative : [[msg]]

          Tentative suivante si DHCP1 ne répond toujours pas : [[t2]]
      slots:
        - id: t1
          options:
            - { id: mon20, text: { en: "Monday 20:00", fr: "Lundi 20:00" } }
            - { id: thu08, text: { en: "Thursday 08:00", fr: "Jeudi 08:00" } }
            - { id: sat14, text: { en: "Saturday 14:00", fr: "Samedi 14:00" } }
            - { id: sun08, text: { en: "Sunday 08:00", fr: "Dimanche 08:00" } }
        - id: msg
          options:
            - { id: discover, text: { en: "A DHCPDISCOVER broadcast to obtain a new lease", fr: "Une diffusion DHCPDISCOVER pour obtenir un nouveau bail" } }
            - { id: unicast, text: { en: "A DHCPREQUEST sent by unicast to DHCP1", fr: "Un DHCPREQUEST envoyé en monodiffusion à DHCP1" } }
            - { id: bcast, text: { en: "A DHCPREQUEST broadcast to all DHCP servers", fr: "Un DHCPREQUEST diffusé à tous les serveurs DHCP" } }
        - id: t2
          options:
            - { id: mon20, text: { en: "Monday 20:00", fr: "Lundi 20:00" } }
            - { id: thu08, text: { en: "Thursday 08:00", fr: "Jeudi 08:00" } }
            - { id: sat14, text: { en: "Saturday 14:00", fr: "Samedi 14:00" } }
            - { id: sun08, text: { en: "Sunday 08:00", fr: "Dimanche 08:00" } }
    answer:
      values: { t1: thu08, msg: unicast, t2: sat14 }
    explanation:
      correct:
        en: |
          At 50 percent of the lease (3 days, Thursday 08:00), the client tries to renew with a unicast DHCPREQUEST to the server that granted the lease. If that server doesn't answer, the client waits until 87.5 percent of the lease (5 days and 6 hours, Saturday 14:00) and broadcasts a DHCPREQUEST that any DHCP server can answer; it is still a renewal of the same address, not a request for a new lease.
        fr: |
          À 50 % du bail (3 jours, jeudi 08:00), le client tente un renouvellement par un DHCPREQUEST envoyé en monodiffusion au serveur qui a accordé le bail. Si ce serveur ne répond pas, le client attend 87,5 % du bail (5 jours et 6 heures, samedi 14:00) et diffuse un DHCPREQUEST auquel tout serveur DHCP peut répondre ; il s'agit toujours d'un renouvellement de la même adresse, pas d'une demande de nouveau bail.
      options:
        discover: { en: "DHCPDISCOVER starts a new lease process; a client that holds a valid lease first tries to renew it with DHCPREQUEST.", fr: "DHCPDISCOVER démarre un nouveau processus de bail ; un client qui détient un bail valide tente d'abord de le renouveler avec DHCPREQUEST." }
        sun08: { en: "Sunday 08:00 is the end of the lease (100 percent), after both the renewal and the rebinding attempts.", fr: "Dimanche 08:00 est la fin du bail (100 %), après les tentatives de renouvellement et de nouvelle liaison." }
    references:
      - title: Use DHCP to simplify IP configuration - Training
        url: https://learn.microsoft.com/en-us/training/modules/deploy-manage-dynamic-host-configuration-protocol/2-use-dynamic-host-configuration-protocol-simplify-ip-configuration

  # ------------------------------------------------------------------ 6
  - id: az802-qz-42-06
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has a DHCP server named **DHCP1** that hosts the scope 10.50.9.0/24 for the guest Wi-Fi network of its showroom. The scope range is 10.50.9.10 to 10.50.9.250, and the lease duration is 8 days. Each week, about 900 different visitor devices connect, and each one stays for less than three hours.

        Since the showroom opened, the scope runs out of addresses by midweek, and new visitors receive addresses in the 169.254.0.0/16 range. The network team can't change the subnet, the router or the Wi-Fi configuration.

        You need the visitors to obtain addresses. The solution must minimize administrative effort. What should you do?
      fr: |
        Tailspin Toys dispose d'un serveur DHCP nommé **DHCP1** qui héberge l'étendue 10.50.9.0/24 du réseau Wi-Fi invité de sa salle d'exposition. La plage de l'étendue va de 10.50.9.10 à 10.50.9.250, et la durée du bail est de 8 jours. Chaque semaine, environ 900 appareils de visiteurs différents se connectent, et chacun reste moins de trois heures.

        Depuis l'ouverture de la salle d'exposition, l'étendue manque d'adresses dès le milieu de la semaine, et les nouveaux visiteurs reçoivent des adresses de la plage 169.254.0.0/16. L'équipe réseau ne peut modifier ni le sous-réseau, ni le routeur, ni la configuration Wi-Fi.

        Vous devez faire en sorte que les visiteurs obtiennent des adresses. La solution doit réduire au minimum l'effort administratif. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a superscope that groups 10.50.9.0/24 with a new scope for 10.50.10.0/24.", fr: "Créer une superétendue qui regroupe 10.50.9.0/24 et une nouvelle étendue pour 10.50.10.0/24." } }
        - { id: b, text: { en: "Configure a load balance failover relationship for the scope with a second server.", fr: "Configurer une relation de basculement en équilibrage de charge pour l'étendue avec un second serveur." } }
        - { id: c, text: { en: "Reduce the lease duration of the scope from 8 days to 4 hours.", fr: "Réduire la durée du bail de l'étendue de 8 jours à 4 heures." } }
        - { id: d, text: { en: "Enable conflict detection on DHCP1 with two detection attempts.", fr: "Activer la détection de conflits sur DHCP1 avec deux tentatives de détection." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          With an 8-day lease, each visitor device keeps its address for days after it leaves, so 241 addresses can't absorb 900 devices a week. A lease of a few hours suits a subnet with many transient devices: addresses of departed visitors expire quickly and return to the pool. Changing the lease duration is a single scope setting and needs no network change.
        fr: |
          Avec un bail de 8 jours, chaque appareil de visiteur garde son adresse pendant des jours après son départ : 241 adresses ne peuvent donc pas absorber 900 appareils par semaine. Un bail de quelques heures convient à un sous-réseau où passent beaucoup d'appareils : les adresses des visiteurs partis expirent vite et reviennent dans le pool. Modifier la durée du bail est un seul paramètre d'étendue et n'exige aucun changement réseau.
      options:
        a: { en: "A superscope serves several logical subnets on one physical network; the router would need an address in 10.50.10.0/24, which the network team can't add.", fr: "Une superétendue sert plusieurs sous-réseaux logiques sur un même réseau physique ; le routeur aurait besoin d'une adresse dans 10.50.10.0/24, que l'équipe réseau ne peut pas ajouter." }
        b: { en: "Failover partners share the same scope and its free addresses; a second server adds availability, not addresses.", fr: "Les partenaires de basculement partagent la même étendue et ses adresses libres ; un second serveur ajoute de la disponibilité, pas des adresses." }
        d: { en: "Conflict detection only checks that an address is unused before leasing it; it doesn't free any address.", fr: "La détection de conflits vérifie seulement qu'une adresse est inutilisée avant de l'attribuer ; elle ne libère aucune adresse." }
    references:
      - title: DHCP scopes in Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-scopes
      - title: DHCP failover in Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-failover

  # ------------------------------------------------------------------ 7
  - id: az802-qz-42-07
    objective: "4.2.4"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        A DHCP server named **DHCP1** hosts the scope 10.40.2.0/24. A printer named **PRN1** has a reservation for 10.40.2.30. PRN1 doesn't match the conditions of any DHCP policy. The following table shows the option values configured on DHCP1; a dash means that the option isn't set at that level.

        Answer each prompt by selecting the option value that PRN1 receives.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un serveur DHCP nommé **DHCP1** héberge l'étendue 10.40.2.0/24. Une imprimante nommée **PRN1** dispose d'une réservation pour 10.40.2.30. PRN1 ne remplit les conditions d'aucune stratégie DHCP. Le tableau suivant présente les valeurs d'options configurées sur DHCP1 ; un tiret signifie que l'option n'est pas définie à ce niveau.

        Répondez à chaque consigne en sélectionnant la valeur d'option que reçoit PRN1.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The DNS server that PRN1 receives", fr: "Le serveur DNS que reçoit PRN1" }
        - id: p2
          text: { en: "The default gateway that PRN1 receives", fr: "La passerelle par défaut que reçoit PRN1" }
      grid:
        header: [{ en: "Level", fr: "Niveau" }, "003 Router", "006 DNS Servers"]
        rows:
          - [{ text: { en: "Server", fr: "Serveur" } }, { text: "10.40.0.1", area: srvrt }, { text: "10.0.0.10", area: srvdns }]
          - [{ text: { en: "Scope 10.40.2.0", fr: "Étendue 10.40.2.0" } }, { text: "10.40.2.1", area: scrt }, { text: "10.0.0.11", area: scdns }]
          - [{ text: { en: "Policy Phones (vendor class of the IP phones)", fr: "Stratégie Phones (classe de fournisseur des téléphones IP)" } }, { text: "10.40.2.250", area: polrt }, { text: "10.0.0.20", area: poldns }]
          - [{ text: { en: "Reservation 10.40.2.30 (PRN1)", fr: "Réservation 10.40.2.30 (PRN1)" } }, { text: "10.40.2.254", area: resrt }, { text: "—" }]
    answer:
      values: { p1: scdns, p2: resrt }
    explanation:
      correct:
        en: |
          A reserved client receives the options set on its reservation, and inherits the other options from the scope, which itself overrides the server level. PRN1 therefore uses the reservation gateway 10.40.2.254 and, with no DNS server at the reservation level, the scope value 10.0.0.11. The Phones policy applies only to the clients that match its condition, which PRN1 doesn't.
        fr: |
          Un client réservé reçoit les options définies sur sa réservation et hérite des autres options de l'étendue, qui elle-même remplace le niveau serveur. PRN1 utilise donc la passerelle de la réservation 10.40.2.254 et, faute de serveur DNS au niveau de la réservation, la valeur de l'étendue 10.0.0.11. La stratégie Phones ne s'applique qu'aux clients qui remplissent sa condition, ce qui n'est pas le cas de PRN1.
      options:
        srvdns: { en: "The server-level DNS server is overridden by the value set on the scope of PRN1.", fr: "Le serveur DNS du niveau serveur est remplacé par la valeur définie sur l'étendue de PRN1." }
        scrt: { en: "The scope gateway is overridden for PRN1 by the router option set on its reservation.", fr: "La passerelle de l'étendue est remplacée pour PRN1 par l'option de routeur définie sur sa réservation." }
        poldns: { en: "Policy options reach only the clients that match the policy condition.", fr: "Les options d'une stratégie n'atteignent que les clients qui remplissent sa condition." }
    references:
      - title: "Assigning options: Dynamic Host Configuration Protocol (DHCP)"
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2003/cc780705(v=ws.10)
      - title: Set-DhcpServerv4OptionValue (DhcpServer)
        url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/set-dhcpserverv4optionvalue

  # ------------------------------------------------------------------ 8
  - id: az802-qz-42-08
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has an AD DS domain named corp.contoso.com. The corp.contoso.com zone is Active Directory-integrated and accepts only secure dynamic updates. The DHCP Server role runs on a domain controller named **DC1**, with the following DNS settings:

        | Setting | Value |
        | --- | --- |
        | DynamicUpdates | OnClientRequest |
        | UpdateDnsRRForOlderClients | False |
        | DNS update credentials (`Set-DhcpServerDnsCredential`) | Not configured |

        DC1 leases addresses to Windows 11 laptops and to IP cameras whose firmware doesn't send the client FQDN option (81).

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un domaine AD DS nommé corp.contoso.com. La zone corp.contoso.com est intégrée à Active Directory et n'accepte que les mises à jour dynamiques sécurisées. Le rôle serveur DHCP s'exécute sur un contrôleur de domaine nommé **DC1**, avec les paramètres DNS suivants :

        | Paramètre | Valeur |
        | --- | --- |
        | DynamicUpdates | OnClientRequest |
        | UpdateDnsRRForOlderClients | False |
        | Informations d'identification de mise à jour DNS (`Set-DhcpServerDnsCredential`) | Non configurées |

        DC1 attribue des adresses à des ordinateurs portables Windows 11 et à des caméras IP dont le microprogramme n'envoie pas l'option FQDN du client (81).

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "When a Windows 11 laptop obtains a lease, DC1 registers the PTR record of the laptop, and the laptop registers its own A record.", fr: "Quand un ordinateur portable Windows 11 obtient un bail, DC1 inscrit l'enregistrement PTR de l'ordinateur portable, et l'ordinateur portable inscrit lui-même son enregistrement A." }
        - id: s2
          text: { en: "When an IP camera obtains a lease, DC1 registers the A and PTR records of the camera.", fr: "Quand une caméra IP obtient un bail, DC1 inscrit les enregistrements A et PTR de la caméra." }
        - id: s3
          text: { en: "The DHCP Server service of DC1 can update or delete records of the corp.contoso.com zone that other computers registered.", fr: "Le service Serveur DHCP de DC1 peut mettre à jour ou supprimer des enregistrements de la zone corp.contoso.com que d'autres ordinateurs ont inscrits." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          A Windows DHCP client sends option 81 asking to update its A record itself and the server to update the PTR record, which an OnClientRequest server honors. A client that sends no FQDN option gets records from the server only when updates for older clients are enabled, which isn't the case here. Without dedicated DNS credentials, the DHCP Server service on a domain controller inherits the permissions of the domain controller and can update or delete any record of a secure zone.
        fr: |
          Un client DHCP Windows envoie l'option 81 pour demander à mettre à jour lui-même son enregistrement A et au serveur de mettre à jour l'enregistrement PTR, ce que respecte un serveur en mode OnClientRequest. Un client qui n'envoie pas d'option FQDN n'obtient d'enregistrements par le serveur que si les mises à jour pour les clients plus anciens sont activées, ce qui n'est pas le cas ici. Sans informations d'identification DNS dédiées, le service Serveur DHCP d'un contrôleur de domaine hérite des autorisations du contrôleur de domaine et peut mettre à jour ou supprimer tout enregistrement d'une zone sécurisée.
      options:
        s2: { en: "The cameras don't request any update, and UpdateDnsRRForOlderClients is False, so DC1 registers nothing for them.", fr: "Les caméras ne demandent aucune mise à jour et UpdateDnsRRForOlderClients vaut False : DC1 n'inscrit donc rien pour elles." }
        s3: { en: "This is why Microsoft recommends configuring a dedicated user account with Set-DhcpServerDnsCredential when DHCP runs on a domain controller.", fr: "C'est pourquoi Microsoft recommande de configurer un compte d'utilisateur dédié avec Set-DhcpServerDnsCredential quand DHCP s'exécute sur un contrôleur de domaine." }
    references:
      - title: Dynamic DNS Update in Windows and Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/networking/dns/dynamic-update
      - title: Set-DhcpServerv4DnsSetting (DhcpServer)
        url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/set-dhcpserverv4dnssetting

  # ------------------------------------------------------------------ 9
  - id: az802-qz-42-09
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has an AD DS domain named fabrikam.com. The branch offices connect to an Azure virtual network named **VNet-Core** through a site-to-site VPN. The branch routers relay DHCP requests by using the command `ip helper-address 10.0.0.3`, the address of the on-premises DHCP server **DHCP-HQ**.

        To decommission DHCP-HQ, you deploy a virtual machine named **DHCPAZ1** in VNet-Core and join it to fabrikam.com. Its network interface has the static private IP address 10.100.0.4. You install the DHCP Server role on DHCPAZ1 and re-create the branch scopes, which are active. Last night, you shut down DHCP-HQ.

        This morning, every branch computer that starts receives an address in the 169.254.0.0/16 range. On DHCPAZ1, the DHCP Server service is running, the scopes have free addresses, and `Get-DhcpServerInDC` returns only dhcp-hq.fabrikam.com.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un domaine AD DS nommé fabrikam.com. Les succursales se connectent à un réseau virtuel Azure nommé **VNet-Core** par un VPN site à site. Les routeurs des succursales relaient les requêtes DHCP avec la commande `ip helper-address 10.0.0.3`, l'adresse du serveur DHCP local **DHCP-HQ**.

        Pour mettre DHCP-HQ hors service, vous déployez une machine virtuelle nommée **DHCPAZ1** dans VNet-Core et la joignez à fabrikam.com. Son interface réseau a l'adresse IP privée statique 10.100.0.4. Vous installez le rôle serveur DHCP sur DHCPAZ1 et recréez les étendues des succursales, qui sont actives. Hier soir, vous avez arrêté DHCP-HQ.

        Ce matin, chaque ordinateur de succursale qui démarre reçoit une adresse de la plage 169.254.0.0/16. Sur DHCPAZ1, le service Serveur DHCP s'exécute, les étendues ont des adresses libres, et `Get-DhcpServerInDC` ne renvoie que dhcp-hq.fabrikam.com.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Authorize DHCPAZ1 in AD DS by running `Add-DhcpServerInDC`.", fr: "Autoriser DHCPAZ1 dans AD DS en exécutant `Add-DhcpServerInDC`." } }
        - { id: b, text: { en: "Set 10.100.0.4 as a static IPv4 address in the Windows network settings of DHCPAZ1.", fr: "Définir 10.100.0.4 comme adresse IPv4 statique dans les paramètres réseau Windows de DHCPAZ1." } }
        - { id: c, text: { en: "Create and activate a scope for the subnet of DHCPAZ1 in VNet-Core.", fr: "Créer et activer une étendue pour le sous-réseau de DHCPAZ1 dans VNet-Core." } }
        - { id: d, text: { en: "Replace the helper address of the branch routers with 10.100.0.4.", fr: "Remplacer l'adresse d'assistance des routeurs des succursales par 10.100.0.4." } }
        - { id: e, text: { en: "Allow direct client traffic from UDP 68 to UDP 67 between the branches and DHCPAZ1.", fr: "Autoriser le trafic direct des clients de UDP 68 vers UDP 67 entre les succursales et DHCPAZ1." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Two causes combine. The relay agents still forward the broadcasts to 10.0.0.3, a server that is now off, so they must point to the address of DHCPAZ1. DHCPAZ1 is in a domain but isn't in the list of authorized servers, and an unauthorized DHCP server in a domain doesn't lease addresses. A DHCP server in an Azure VM can serve on-premises clients through a relay agent once both problems are fixed.
        fr: |
          Deux causes se combinent. Les agents de relais transmettent toujours les diffusions à 10.0.0.3, un serveur désormais arrêté : ils doivent pointer vers l'adresse de DHCPAZ1. DHCPAZ1 fait partie d'un domaine mais ne figure pas dans la liste des serveurs autorisés, et un serveur DHCP non autorisé dans un domaine n'attribue aucun bail. Un serveur DHCP dans une machine virtuelle Azure peut servir des clients locaux par un agent de relais une fois les deux problèmes corrigés.
      options:
        b: { en: "The private address of an Azure VM is set on its network interface; setting it manually in Windows isn't recommended and fixes nothing here.", fr: "L'adresse privée d'une machine virtuelle Azure se définit sur son interface réseau ; la définir à la main dans Windows n'est pas recommandé et ne corrige rien ici." }
        c: { en: "Azure provides DHCP to the VMs of the virtual network; a Windows DHCP server can't lease addresses to them, and the branch clients don't use that subnet.", fr: "Azure fournit le DHCP aux machines virtuelles du réseau virtuel ; un serveur DHCP Windows ne peut pas leur attribuer d'adresses, et les clients des succursales n'utilisent pas ce sous-réseau." }
        e: { en: "Direct client-to-server DHCP traffic (UDP 68 to UDP 67) isn't supported in Azure; on-premises clients must go through a relay agent.", fr: "Le trafic DHCP direct du client vers le serveur (UDP 68 vers UDP 67) n'est pas pris en charge dans Azure ; les clients locaux doivent passer par un agent de relais." }
    references:
      - title: Azure Virtual Network FAQ
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
      - title: Install and configure DHCP Server on Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/quickstart-install-configure-dhcp-server

  # ------------------------------------------------------------------ 10
  - id: az802-qz-42-10
    objective: "4.2.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank has a branch DHCP server named **DHCP-BR1** and a head office DHCP server named **DHCP-HQ**. They share the branch scope 10.70.0.0/24 in a failover relationship that you created by running the following command:

        `Add-DhcpServerv4Failover -ComputerName DHCP-HQ -Name "BR1-HQ" -PartnerServer DHCP-BR1 -ScopeId 10.70.0.0 -ServerRole Standby`

        The branch routers relay DHCP requests to both servers. At 09:00, DHCP-BR1 fails and stays offline. Nobody changes the failover configuration unless a statement says so.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un serveur DHCP de succursale nommé **DHCP-BR1** et d'un serveur DHCP du siège nommé **DHCP-HQ**. Ils partagent l'étendue de la succursale 10.70.0.0/24 dans une relation de basculement que vous avez créée en exécutant la commande suivante :

        `Add-DhcpServerv4Failover -ComputerName DHCP-HQ -Name "BR1-HQ" -PartnerServer DHCP-BR1 -ScopeId 10.70.0.0 -ServerRole Standby`

        Les routeurs de la succursale relaient les requêtes DHCP vers les deux serveurs. À 09:00, DHCP-BR1 tombe en panne et reste hors ligne. Personne ne modifie la configuration du basculement, sauf si une affirmation l'indique.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "At 09:30, when an existing branch client renews its lease, DHCP-HQ gives it the same IP address with a lease of one hour.", fr: "À 09:30, quand un client existant de la succursale renouvelle son bail, DHCP-HQ lui donne la même adresse IP avec un bail d'une heure." }
        - id: s2
          text: { en: "At 11:00, DHCP-HQ can lease any free address of the scope to new clients, not only the addresses of its reserve.", fr: "À 11:00, DHCP-HQ peut attribuer à de nouveaux clients n'importe quelle adresse libre de l'étendue, et pas seulement les adresses de sa réserve." }
        - id: s3
          text: { en: "If you set DHCP-HQ to the partner down state at 09:15, DHCP-HQ can lease any free address of the scope to new clients at 10:30.", fr: "Si vous faites passer DHCP-HQ à l'état partenaire indisponible à 09:15, DHCP-HQ peut attribuer à de nouveaux clients n'importe quelle adresse libre de l'étendue à 10:30." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          The command creates a hot standby relationship in which DHCP-HQ is the standby, with the default maximum client lead time (MCLT) of one hour and a reserve of 5 percent. When DHCP-BR1 fails, DHCP-HQ enters the communication interrupted state: it renews existing clients with the same address for the MCLT and leases new addresses only from its reserve. Automatic state transition is off by default, so it stays in that state until an administrator sets partner down; one MCLT after that, it can use the whole pool.
        fr: |
          La commande crée une relation de secours à chaud dans laquelle DHCP-HQ est le serveur de secours, avec la durée maximale du délai d'exécution du client (MCLT) par défaut d'une heure et une réserve de 5 %. Quand DHCP-BR1 tombe en panne, DHCP-HQ passe à l'état d'interruption des communications : il renouvelle les clients existants avec la même adresse pour la durée du MCLT et n'attribue de nouvelles adresses que dans sa réserve. La transition automatique d'état est désactivée par défaut : il reste dans cet état jusqu'à ce qu'un administrateur le fasse passer à l'état partenaire indisponible ; un MCLT plus tard, il peut utiliser toute la plage.
      options:
        s2: { en: "Without AutoStateTransition, DHCP-HQ stays in the communication interrupted state, where new leases come only from its reserve, however long the outage lasts.", fr: "Sans AutoStateTransition, DHCP-HQ reste à l'état d'interruption des communications, où les nouveaux baux ne viennent que de sa réserve, quelle que soit la durée de la panne." }
    references:
      - title: DHCP failover in Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-failover
      - title: Add-DhcpServerv4Failover (DhcpServer)
        url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/add-dhcpserverv4failover
