chapter: 21-remote-management
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-21-01
    objective: "2.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. has a server named **SRV1** that runs Windows Server 2025. You create a WinRM listener that uses the HTTPS transport and a certificate on SRV1. Administrators will connect by running `Enter-PSSession -ComputerName srv1.contoso.com -UseSSL`.

        Which inbound TCP port must Windows Firewall allow on SRV1 for these connections?
      fr: |
        Contoso, Ltd. dispose d'un serveur nommé **SRV1** qui exécute Windows Server 2025. Vous créez sur SRV1 un écouteur WinRM qui utilise le transport HTTPS et un certificat. Les administrateurs se connecteront en exécutant `Enter-PSSession -ComputerName srv1.contoso.com -UseSSL`.

        Quel port TCP entrant le Pare-feu Windows doit-il autoriser sur SRV1 pour ces connexions ?
    body:
      options:
        - { id: a, text: "443" }
        - { id: b, text: "5985" }
        - { id: c, text: "5986" }
        - { id: d, text: "6516" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          WinRM uses TCP 5985 for the HTTP transport and TCP 5986 for the HTTPS transport by default. The `-UseSSL` parameter makes PowerShell remoting connect to the HTTPS listener, so port 5986 must be open on SRV1.
        fr: |
          WinRM utilise par défaut TCP 5985 pour le transport HTTP et TCP 5986 pour le transport HTTPS. Le paramètre `-UseSSL` fait passer la communication à distance PowerShell par l'écouteur HTTPS : le port 5986 doit donc être ouvert sur SRV1.
      options:
        a: { en: "443 is the standard HTTPS port for web servers; WinRM HTTPS listeners use 5986 by default.", fr: "443 est le port HTTPS standard des serveurs web ; les écouteurs HTTPS de WinRM utilisent 5986 par défaut." }
        b: { en: "5985 is the default port of the HTTP listener, not of the HTTPS listener used with -UseSSL.", fr: "5985 est le port par défaut de l'écouteur HTTP, pas de l'écouteur HTTPS utilisé avec -UseSSL." }
        d: { en: "6516 is the default port of Windows Admin Center, not of WinRM.", fr: "6516 est le port par défaut de Windows Admin Center, pas de WinRM." }
    references:
      - title: Installation and configuration for Windows Remote Management
        url: https://learn.microsoft.com/en-us/windows/win32/winrm/installation-and-configuration-for-windows-remote-management

  # ------------------------------------------------------------------ 2
  - id: az802-qz-21-02
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. installs Windows Admin Center on a gateway server named **GW1** for a pilot. During setup, the administrator has no certificate and lets the installer generate a self-signed certificate.

        For how long is the generated certificate valid?
      fr: |
        Fabrikam, Inc. installe Windows Admin Center sur un serveur de passerelle nommé **GW1** pour un pilote. Pendant l'installation, l'administrateur n'a pas de certificat et laisse le programme d'installation générer un certificat auto-signé.

        Pendant combien de temps le certificat généré est-il valide ?
    body:
      options:
        - { id: a, text: { en: "30 days", fr: "30 jours" } }
        - { id: b, text: { en: "60 days", fr: "60 jours" } }
        - { id: c, text: { en: "1 year", fr: "1 an" } }
        - { id: d, text: { en: "2 years", fr: "2 ans" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The self-signed certificate that the Windows Admin Center installer generates expires after 60 days and is meant for testing only. For production, install a certificate from a trusted certificate authority with the Server Authentication EKU in the `LocalMachine\My` store and select it during setup.
        fr: |
          Le certificat auto-signé que génère le programme d'installation de Windows Admin Center expire au bout de 60 jours et n'est destiné qu'aux tests. En production, installez un certificat d'une autorité de certification approuvée avec l'EKU Authentification du serveur dans le magasin `LocalMachine\My` et sélectionnez-le pendant l'installation.
      options:
        a: { en: "The installer's self-signed certificate is valid for 60 days, not 30.", fr: "Le certificat auto-signé du programme d'installation est valide 60 jours, pas 30." }
        c: { en: "A one-year validity is common for CA-issued certificates, not for the installer's test certificate.", fr: "Une validité d'un an est courante pour les certificats émis par une autorité de certification, pas pour le certificat de test du programme d'installation." }
        d: { en: "The self-signed certificate is short-lived on purpose: it expires after 60 days.", fr: "Le certificat auto-signé est volontairement de courte durée : il expire au bout de 60 jours." }
    references:
      - title: Install Windows Admin Center
        url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/deploy/install

  # ------------------------------------------------------------------ 3
  - id: az802-qz-21-03
    objective: "2.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. has a member server named **SRV12** that runs Windows Server 2025. Remote Desktop is enabled on SRV12, and the policy **Remote host allows delegation of nonexportable credentials** is enabled on it. A technician named **Tech1** is a member of the Remote Desktop Users group of SRV12 and isn't a member of its Administrators group.

        From a domain-joined Windows 11 computer, `mstsc.exe /v:srv12.contoso.com` connects Tech1 successfully, but `mstsc.exe /v:srv12.contoso.com /restrictedAdmin` fails.

        What explains the failure?
      fr: |
        Contoso, Ltd. dispose d'un serveur membre nommé **SRV12** qui exécute Windows Server 2025. Le Bureau à distance est activé sur SRV12, et la stratégie **Remote host allows delegation of nonexportable credentials** y est activée. Un technicien nommé **Tech1** est membre du groupe Remote Desktop Users de SRV12 et n'est pas membre de son groupe Administrators.

        Depuis un ordinateur Windows 11 joint au domaine, `mstsc.exe /v:srv12.contoso.com` connecte Tech1 sans problème, mais `mstsc.exe /v:srv12.contoso.com /restrictedAdmin` échoue.

        Qu'est-ce qui explique l'échec ?
    body:
      options:
        - { id: a, text: { en: "Restricted Admin mode grants Remote Desktop access only to members of the Administrators group of the remote host.", fr: "Le mode Administration restreinte n'accorde l'accès Bureau à distance qu'aux membres du groupe Administrators de l'hôte distant." } }
        - { id: b, text: { en: "Restricted Admin mode supports only Kerberos, and the connection to SRV12 fell back to NTLM authentication.", fr: "Le mode Administration restreinte ne prend en charge que Kerberos, et la connexion à SRV12 s'est repliée sur l'authentification NTLM." } }
        - { id: c, text: { en: "Restricted Admin mode requires the policy Restrict delegation of credentials to remote servers to be enabled on SRV12.", fr: "Le mode Administration restreinte exige que la stratégie Restrict delegation of credentials to remote servers soit activée sur SRV12." } }
        - { id: d, text: { en: "Restricted Admin mode works only when the connection goes through a Remote Desktop Gateway server.", fr: "Le mode Administration restreinte ne fonctionne que si la connexion passe par un serveur de passerelle des services Bureau à distance." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          With Restricted Admin mode, Remote Desktop access is granted through membership of the Administrators group on the remote host, whereas a standard connection or Remote Credential Guard accepts members of Remote Desktop Users. Tech1 is only in Remote Desktop Users, so the /restrictedAdmin connection is refused.
        fr: |
          En mode Administration restreinte, l'accès Bureau à distance est accordé par l'appartenance au groupe Administrators de l'hôte distant, alors qu'une connexion standard ou Remote Credential Guard accepte les membres de Remote Desktop Users. Tech1 n'est que dans Remote Desktop Users : la connexion /restrictedAdmin est donc refusée.
      options:
        b: { en: "Restricted Admin mode accepts any negotiable protocol; the Kerberos-only limitation belongs to Remote Credential Guard.", fr: "Le mode Administration restreinte accepte tout protocole négociable ; la limitation à Kerberos concerne Remote Credential Guard." }
        c: { en: "Restrict delegation of credentials to remote servers is a client-side policy that can enforce a mode; the /restrictedAdmin switch doesn't need it.", fr: "Restrict delegation of credentials to remote servers est une stratégie côté client qui peut imposer un mode ; le commutateur /restrictedAdmin n'en a pas besoin." }
        d: { en: "Restricted Admin mode is used for direct connections to the target; no gateway is required.", fr: "Le mode Administration restreinte s'utilise pour des connexions directes à la cible ; aucune passerelle n'est requise." }
    references:
      - title: Remote Credential Guard
        url: https://learn.microsoft.com/en-us/windows/security/identity-protection/remote-credential-guard

  # ------------------------------------------------------------------ 4
  - id: az802-qz-21-04
    objective: "2.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An administrator named **Admin1** uses a computer named **Client1** that runs Windows 11. Admin1 connects to several servers that run Windows Server 2025 by using key-based SSH authentication. The private key is protected by a passphrase, and Admin1 must enter it at every connection.

        Admin1 wants to enter the passphrase only once and let the SSH client use the key automatically afterwards. The key must keep its passphrase. On Client1, `ssh-add $env:USERPROFILE\.ssh\id_ed25519` returns an error stating that it can't connect to the authentication agent.

        What should you do first?
      fr: |
        Un administrateur nommé **Admin1** utilise un ordinateur nommé **Client1** qui exécute Windows 11. Admin1 se connecte à plusieurs serveurs qui exécutent Windows Server 2025 avec l'authentification SSH par clé. La clé privée est protégée par une phrase secrète, qu'Admin1 doit saisir à chaque connexion.

        Admin1 veut saisir la phrase secrète une seule fois et laisser ensuite le client SSH utiliser la clé automatiquement. La clé doit conserver sa phrase secrète. Sur Client1, `ssh-add $env:USERPROFILE\.ssh\id_ed25519` renvoie une erreur indiquant qu'il ne peut pas se connecter à l'agent d'authentification.

        Que devez-vous faire en premier ?
    body:
      options:
        - { id: a, text: { en: "On Client1, set the ssh-agent service to start automatically, and then start it.", fr: "Sur Client1, configurer le service ssh-agent en démarrage automatique, puis le démarrer." } }
        - { id: b, text: { en: "On each server, set the sshd service to start automatically, and then restart it.", fr: "Sur chaque serveur, configurer le service sshd en démarrage automatique, puis le redémarrer." } }
        - { id: c, text: { en: "On Client1, generate a new key pair by running ssh-keygen with an empty passphrase.", fr: "Sur Client1, générer une nouvelle paire de clés en exécutant ssh-keygen avec une phrase secrète vide." } }
        - { id: d, text: { en: "On each server, copy the public key to the administrators_authorized_keys file.", fr: "Sur chaque serveur, copier la clé publique dans le fichier administrators_authorized_keys." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The ssh-agent service stores private keys in the Windows security context of the user and passes them to the SSH client, so the passphrase is entered once, when the key is added. The service is disabled by default, which is why ssh-add can't reach it: set it to Automatic, start it, and then run ssh-add.
        fr: |
          Le service ssh-agent conserve les clés privées dans le contexte de sécurité Windows de l'utilisateur et les transmet au client SSH : la phrase secrète n'est saisie qu'une fois, à l'ajout de la clé. Ce service est désactivé par défaut, ce qui explique que ssh-add ne puisse pas le joindre : passez-le en Automatique, démarrez-le, puis exécutez ssh-add.
      options:
        b: { en: "sshd is the server side and already accepts the key; the agent that holds the key runs on the client.", fr: "sshd est le côté serveur et accepte déjà la clé ; l'agent qui conserve la clé s'exécute sur le client." }
        c: { en: "An empty passphrase removes the protection that the key must keep.", fr: "Une phrase secrète vide supprime la protection que la clé doit conserver." }
        d: { en: "Key authentication already works on the servers; the prompt comes from the client, which has no running agent.", fr: "L'authentification par clé fonctionne déjà sur les serveurs ; l'invite vient du client, qui n'a aucun agent en cours d'exécution." }
    references:
      - title: Key-based authentication in OpenSSH for Windows
        url: https://learn.microsoft.com/en-us/windows-server/administration/openssh/openssh_keymanagement

  # ------------------------------------------------------------------ 5
  - id: az802-qz-21-05
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        In an isolated test lab, Fabrikam, Inc. has a computer named **Client1** and two servers named **SRV1** and **FS1** in the **lab.fabrikam.com** domain. Administrators open a session from Client1 on SRV1 by using `Enter-PSSession`, and then access the share `\\fs1.lab.fabrikam.com\Builds` from that session. The access fails with an access denied error. The lab accounts aren't members of the Protected Users group.

        You decide to use CredSSP. Credentials must be delegated to SRV1 only.

        How should you complete the commands? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Dans un laboratoire de test isolé, Fabrikam, Inc. dispose d'un ordinateur nommé **Client1** et de deux serveurs nommés **SRV1** et **FS1** dans le domaine **lab.fabrikam.com**. Les administrateurs ouvrent depuis Client1 une session sur SRV1 avec `Enter-PSSession`, puis accèdent au partage `\\fs1.lab.fabrikam.com\Builds` depuis cette session. L'accès échoue avec une erreur d'accès refusé. Les comptes du laboratoire ne sont pas membres du groupe Protected Users.

        Vous décidez d'utiliser CredSSP. Les informations d'identification doivent être déléguées uniquement à SRV1.

        Comment devez-vous compléter les commandes ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: powershell
      template: |
        # Run on [[host1]]
        Enable-WSManCredSSP -Role Client -DelegateComputer [[deleg]]

        # Run on [[host2]]
        Enable-WSManCredSSP -Role Server

        # Run on Client1
        Enter-PSSession -ComputerName srv1.lab.fabrikam.com -Credential (Get-Credential) -Authentication [[auth]]
      slots:
        - id: host1
          options:
            - { id: client1, text: Client1 }
            - { id: srv1, text: SRV1 }
            - { id: fs1, text: FS1 }
        - id: deleg
          options:
            - { id: srv1fqdn, text: "\"srv1.lab.fabrikam.com\"" }
            - { id: fs1fqdn, text: "\"fs1.lab.fabrikam.com\"" }
            - { id: wildcard, text: "\"*.lab.fabrikam.com\"" }
            - { id: client1fqdn, text: "\"client1.lab.fabrikam.com\"" }
        - id: host2
          options:
            - { id: client1, text: Client1 }
            - { id: srv1, text: SRV1 }
            - { id: fs1, text: FS1 }
        - id: auth
          options:
            - { id: credssp, text: CredSSP }
            - { id: kerberos, text: Kerberos }
            - { id: negotiate, text: Negotiate }
            - { id: default, text: Default }
    answer:
      values: { host1: client1, deleg: srv1fqdn, host2: srv1, auth: credssp }
    explanation:
      correct:
        en: |
          CredSSP needs both roles: the client role on Client1, which lists the computers that may receive the delegated credentials (here SRV1 only), and the server role on SRV1, the intermediate server that acts as a delegate. The session must then be opened with `-Authentication CredSSP` and explicit credentials, which SRV1 caches and uses to reach FS1.
        fr: |
          CredSSP demande les deux rôles : le rôle client sur Client1, qui liste les ordinateurs autorisés à recevoir les informations d'identification déléguées (ici SRV1 seulement), et le rôle serveur sur SRV1, le serveur intermédiaire qui agit comme délégué. La session doit ensuite être ouverte avec `-Authentication CredSSP` et des informations d'identification explicites, que SRV1 met en cache et utilise pour atteindre FS1.
      options:
        fs1fqdn: { en: "FS1 is the resource of the second hop; the client delegates credentials to SRV1, the server it connects to.", fr: "FS1 est la ressource du second saut ; le client délègue les informations d'identification à SRV1, le serveur auquel il se connecte." }
        wildcard: { en: "A wildcard works but delegates credentials to every computer of the domain, not to SRV1 only.", fr: "Un caractère générique fonctionne mais délègue les informations d'identification à tous les ordinateurs du domaine, pas seulement à SRV1." }
        kerberos: { en: "Kerberos authentication doesn't forward the credentials, which is the cause of the access denied error.", fr: "L'authentification Kerberos ne transmet pas les informations d'identification, ce qui est la cause de l'accès refusé." }
    references:
      - title: Enable-WSManCredSSP (Microsoft.WSMan.Management)
        url: https://learn.microsoft.com/en-us/powershell/module/microsoft.wsman.management/enable-wsmancredssp
      - title: Making the second hop in PowerShell Remoting
        url: https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/ps-remoting-second-hop

  # ------------------------------------------------------------------ 6
  - id: az802-qz-21-06
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso, Ltd. has an Azure virtual machine named **VM1** that runs Windows Server 2022 and has 8 GiB of memory. VM1 has a public IP address. No VPN or peering connects the Contoso offices to the virtual network of VM1. Windows Admin Center was installed on VM1 from the Azure portal on port 6516.

        The network security group (NSG) associated with the network interface of VM1 contains the default rules and the following custom rules:

        | Direction | Priority | Destination | Port | Action |
        | --- | --- | --- | --- | --- |
        | Outbound | 100 | AzureActiveDirectory service tag | TCP 443 | Allow |
        | Outbound | 4000 | Internet service tag | Any | Deny |

        A user named **User1** has the Reader and Windows Admin Center Administrator Login roles on VM1. User1 works from an office whose public IP range is 203.0.113.0/27. When User1 opens Windows Admin Center from the page of VM1 in the Azure portal, the connection fails.

        You need to ensure that User1 can manage VM1 by using Windows Admin Center in the Azure portal. The solution must minimize the exposure of VM1.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. dispose d'une machine virtuelle Azure nommée **VM1** qui exécute Windows Server 2022 et dispose de 8 Gio de mémoire. VM1 possède une adresse IP publique. Aucun VPN ni peering ne relie les bureaux de Contoso au réseau virtuel de VM1. Windows Admin Center a été installé sur VM1 depuis le portail Azure sur le port 6516.

        Le groupe de sécurité réseau (NSG) associé à l'interface réseau de VM1 contient les règles par défaut et les règles personnalisées suivantes :

        | Direction | Priorité | Destination | Port | Action |
        | --- | --- | --- | --- | --- |
        | Sortant | 100 | Étiquette de service AzureActiveDirectory | TCP 443 | Allow |
        | Sortant | 4000 | Étiquette de service Internet | Any | Deny |

        Un utilisateur nommé **User1** dispose des rôles Reader et Windows Admin Center Administrator Login sur VM1. User1 travaille depuis un bureau dont la plage d'adresses IP publiques est 203.0.113.0/27. Quand User1 ouvre Windows Admin Center depuis la page de VM1 dans le portail Azure, la connexion échoue.

        Vous devez faire en sorte que User1 puisse gérer VM1 avec Windows Admin Center dans le portail Azure. La solution doit réduire au minimum l'exposition de VM1.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Add an inbound NSG rule that allows TCP 6516 from 203.0.113.0/27.", fr: "Ajouter une règle NSG entrante qui autorise TCP 6516 depuis 203.0.113.0/27." } }
        - { id: b, text: { en: "Add an outbound NSG rule that allows TCP 443 to the WindowsAdminCenter service tag.", fr: "Ajouter une règle NSG sortante qui autorise TCP 443 vers l'étiquette de service WindowsAdminCenter." } }
        - { id: c, text: { en: "Deploy Azure Bastion to the virtual network and open Windows Admin Center through it.", fr: "Déployer Azure Bastion dans le réseau virtuel et ouvrir Windows Admin Center par son intermédiaire." } }
        - { id: d, text: { en: "Add an inbound NSG rule that allows TCP 5985 from 203.0.113.0/27.", fr: "Ajouter une règle NSG entrante qui autorise TCP 5985 depuis 203.0.113.0/27." } }
        - { id: e, text: { en: "Assign the Contributor role on VM1 to User1.", fr: "Attribuer le rôle Contributor sur VM1 à User1." } }
        - { id: f, text: { en: "Add an inbound NSG rule that allows TCP 6516 from the Internet service tag.", fr: "Ajouter une règle NSG entrante qui autorise TCP 6516 depuis l'étiquette de service Internet." } }
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          Without a private path to the virtual network, the browser reaches Windows Admin Center through the public IP address, which needs an inbound rule on the WAC port limited to the management systems' IP addresses. VM1 also needs outbound HTTPS to the WindowsAdminCenter and AzureActiveDirectory service tags; the deny rule blocks the first one. User1 already holds the two roles needed to connect.
        fr: |
          Sans chemin privé vers le réseau virtuel, le navigateur atteint Windows Admin Center par l'adresse IP publique, ce qui demande une règle entrante sur le port de WAC limitée aux adresses IP des systèmes d'administration. VM1 a aussi besoin d'un accès HTTPS sortant vers les étiquettes de service WindowsAdminCenter et AzureActiveDirectory ; la règle de refus bloque la première. User1 détient déjà les deux rôles nécessaires pour se connecter.
      options:
        c: { en: "Windows Admin Center in the Azure portal doesn't work through Azure Bastion.", fr: "Windows Admin Center dans le portail Azure ne fonctionne pas via Azure Bastion." }
        d: { en: "WinRM is used by Windows Admin Center on VM1 itself; the browser only connects to the WAC port.", fr: "WinRM est utilisé par Windows Admin Center sur VM1 elle-même ; le navigateur ne se connecte qu'au port de WAC." }
        e: { en: "Contributor is needed to install the extension, not to connect; User1 already has Reader and Windows Admin Center Administrator Login.", fr: "Contributor sert à installer l'extension, pas à se connecter ; User1 dispose déjà de Reader et de Windows Admin Center Administrator Login." }
        f: { en: "Opening the port to the whole internet works but doesn't minimize exposure; limit the source to the office range.", fr: "Ouvrir le port à tout Internet fonctionne mais ne réduit pas l'exposition au minimum ; limitez la source à la plage du bureau." }
    references:
      - title: Manage a Windows VM using Windows Admin Center in Azure
        url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/azure/manage-vm

  # ------------------------------------------------------------------ 7
  - id: az802-qz-21-07
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso, Ltd. has a print server named **PRN1** that runs Windows Server 2025 and is a member of the **contoso.com** domain. A role capability named **PrintOperator** exists in a module on PRN1. You are writing the session configuration file of a JEA endpoint for PRN1. The endpoint must meet the following requirements:

        - The members of **CONTOSO\G-PrintOps** receive the PrintOperator role.
        - Sessions run in NoLanguage mode and expose only the default proxy functions and the commands of the role.
        - The commands run under a temporary account, unique to each session, that is a member of the local group **PrintQueueAdmins** only, never of the Administrators group.
        - A session is accepted only if the connecting user is also a member of **CONTOSO\smartcard-logon**, a group that authentication mechanism assurance adds to users who sign in with a smart card.

        How should you complete the file? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. dispose d'un serveur d'impression nommé **PRN1** qui exécute Windows Server 2025 et est membre du domaine **contoso.com**. Une capacité de rôle nommée **PrintOperator** existe dans un module sur PRN1. Vous rédigez le fichier de configuration de session d'un point de terminaison JEA pour PRN1. Le point de terminaison doit répondre aux exigences suivantes :

        - Les membres de **CONTOSO\G-PrintOps** reçoivent le rôle PrintOperator.
        - Les sessions s'exécutent en mode NoLanguage et n'exposent que les fonctions proxy par défaut et les commandes du rôle.
        - Les commandes s'exécutent sous un compte temporaire, propre à chaque session, membre uniquement du groupe local **PrintQueueAdmins**, jamais du groupe Administrators.
        - Une session n'est acceptée que si l'utilisateur qui se connecte est aussi membre de **CONTOSO\smartcard-logon**, un groupe que l'assurance du mécanisme d'authentification ajoute aux utilisateurs qui se connectent avec une carte à puce.

        Comment devez-vous compléter le fichier ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: powershell
      template: |
        @{
            SchemaVersion       = '2.0.0.0'
            SessionType         = '[[sess]]'
            RunAsVirtualAccount = $true
            [[ident]] = 'PrintQueueAdmins'
            [[cond]] = @{ And = 'CONTOSO\smartcard-logon' }
            TranscriptDirectory = 'C:\ProgramData\JEA\Transcripts'
            RoleDefinitions     = @{ 'CONTOSO\G-PrintOps' = @{ RoleCapabilities = 'PrintOperator' } }
        }
      slots:
        - id: sess
          options:
            - { id: restricted, text: RestrictedRemoteServer }
            - { id: default, text: Default }
            - { id: empty, text: Empty }
        - id: ident
          options:
            - { id: vagroups, text: RunAsVirtualAccountGroups }
            - { id: gmsa, text: GroupManagedServiceAccount }
            - { id: required, text: RequiredGroups }
        - id: cond
          options:
            - { id: required, text: RequiredGroups }
            - { id: roledef, text: RoleDefinitions }
            - { id: vagroups, text: RunAsVirtualAccountGroups }
    answer:
      values: { sess: restricted, ident: vagroups, cond: required }
    explanation:
      correct:
        en: |
          RestrictedRemoteServer sessions run in NoLanguage mode with a few default proxy functions such as Get-Command and Exit-PSSession. RunAsVirtualAccountGroups, combined with RunAsVirtualAccount, places the per-session virtual account in the listed local groups only, so it's no longer a local administrator. RequiredGroups defines conditional access rules with And or Or keys that the connecting user must meet.
        fr: |
          Les sessions RestrictedRemoteServer s'exécutent en mode NoLanguage avec quelques fonctions proxy par défaut comme Get-Command et Exit-PSSession. RunAsVirtualAccountGroups, combiné à RunAsVirtualAccount, place le compte virtuel de chaque session uniquement dans les groupes locaux listés : il n'est donc plus administrateur local. RequiredGroups définit des règles d'accès conditionnel avec des clés And ou Or auxquelles l'utilisateur qui se connecte doit satisfaire.
      options:
        default: { en: "Default adds the Microsoft.PowerShell.Core module, including Import-Module, instead of a restricted command set.", fr: "Default ajoute le module Microsoft.PowerShell.Core, y compris Import-Module, au lieu d'un jeu de commandes restreint." }
        empty: { en: "Empty adds no module and isn't the JEA session type that runs in NoLanguage with the default proxy functions.", fr: "Empty n'ajoute aucun module et n'est pas le type de session JEA qui s'exécute en NoLanguage avec les fonctions proxy par défaut." }
        gmsa: { en: "A gMSA is a domain account shared by all users and can't be combined with RunAsVirtualAccount.", fr: "Un gMSA est un compte de domaine partagé par tous les utilisateurs et ne peut pas être combiné avec RunAsVirtualAccount." }
        roledef: { en: "RoleDefinitions maps users to roles and is already in the file; it doesn't add a condition on another group.", fr: "RoleDefinitions associe des utilisateurs à des rôles et figure déjà dans le fichier ; il n'ajoute pas de condition sur un autre groupe." }
    references:
      - title: JEA Session Configurations
        url: https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/jea/session-configurations
      - title: New-PSSessionConfigurationFile (Microsoft.PowerShell.Core)
        url: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/new-pssessionconfigurationfile

  # ------------------------------------------------------------------ 8
  - id: az802-qz-21-08
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso, Ltd. has an AD DS domain named **contoso.com** (NetBIOS name **CONTOSO**) and a member server named **SRV9** that runs Windows Server 2022. OpenSSH Server is installed on SRV9 with the default configuration, and the sshd service is running.

        You open `C:\ProgramData\ssh\sshd_config` in a text editor, append the following lines, and save the file:

        ```text
        DenyGroups contoso\contractors
        AllowGroups contoso\sshops
        ```

        The domain contains the users shown in the following table.

        | User | Group membership |
        | --- | --- |
        | User2 | SSHOps, Contractors |
        | Admin3 | Domain Admins (member of the Administrators group of SRV9) |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. dispose d'un domaine AD DS nommé **contoso.com** (nom NetBIOS **CONTOSO**) et d'un serveur membre nommé **SRV9** qui exécute Windows Server 2022. OpenSSH Server est installé sur SRV9 avec la configuration par défaut, et le service sshd est en cours d'exécution.

        Vous ouvrez `C:\ProgramData\ssh\sshd_config` dans un éditeur de texte, ajoutez les lignes suivantes à la fin, puis enregistrez le fichier :

        ```text
        DenyGroups contoso\contractors
        AllowGroups contoso\sshops
        ```

        Le domaine contient les utilisateurs présentés dans le tableau suivant.

        | Utilisateur | Appartenance aux groupes |
        | --- | --- |
        | User2 | SSHOps, Contractors |
        | Admin3 | Domain Admins (membre du groupe Administrators de SRV9) |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Before the sshd service is restarted, User2 can sign in to SRV9 by using SSH.", fr: "Avant le redémarrage du service sshd, User2 peut se connecter à SRV9 en SSH." }
        - id: s2
          text: { en: "After the sshd service is restarted, User2 can sign in to SRV9 by using SSH.", fr: "Après le redémarrage du service sshd, User2 peut se connecter à SRV9 en SSH." }
        - id: s3
          text: { en: "After the sshd service is restarted, Admin3 can sign in to SRV9 by using SSH.", fr: "Après le redémarrage du service sshd, Admin3 peut se connecter à SRV9 en SSH." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          sshd reads sshd_config only when the service starts, so until it restarts, the default configuration, which has no group restriction, still applies. After the restart, the directives are processed in the order DenyUsers, AllowUsers, DenyGroups, AllowGroups, and a user must pass every check: User2 is rejected by DenyGroups even though SSHOps is allowed, and AllowGroups rejects anyone outside SSHOps, administrators included.
        fr: |
          sshd ne lit sshd_config qu'au démarrage du service : tant qu'il n'a pas redémarré, la configuration par défaut, sans restriction de groupe, s'applique encore. Après le redémarrage, les directives sont traitées dans l'ordre DenyUsers, AllowUsers, DenyGroups, AllowGroups, et un utilisateur doit passer chaque contrôle : User2 est rejeté par DenyGroups même si SSHOps est autorisé, et AllowGroups rejette toute personne hors de SSHOps, administrateurs compris.
      options:
        s2: { en: "DenyGroups is processed before AllowGroups; membership of Contractors blocks User2.", fr: "DenyGroups est traité avant AllowGroups ; l'appartenance à Contractors bloque User2." }
        s3: { en: "AllowGroups restricts every account, and Admin3 isn't a member of SSHOps.", fr: "AllowGroups restreint tous les comptes, et Admin3 n'est pas membre de SSHOps." }
    references:
      - title: OpenSSH Server Configuration for Windows
        url: https://learn.microsoft.com/en-us/windows-server/administration/openssh/openssh-server-configuration

  # ------------------------------------------------------------------ 9
  - id: az802-qz-21-09
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. help desk technicians use Windows 11 computers in an organizational unit (OU) named **HelpDesk-PCs**. They connect by using Remote Desktop to user workstations on which they're local administrators. The policy **Remote host allows delegation of nonexportable credentials** is enabled on all the workstations.

        A Group Policy Object (GPO) linked to HelpDesk-PCs sets the policy **Restrict delegation of credentials to remote servers** to **Restrict credential delegation**. The technicians start their connections by running `mstsc.exe /restrictedAdmin`.

        A security review finds that, from a help desk session, the workstation can authenticate to other computers on the network as the technician. You need to ensure that help desk sessions can't use the technician's identity on the network. The setting must be enforced for every connection, however a technician starts the Remote Desktop client.

        What should you do?
      fr: |
        Les techniciens du support de Contoso, Ltd. utilisent des ordinateurs Windows 11 situés dans une unité d'organisation (UO) nommée **HelpDesk-PCs**. Ils se connectent avec le Bureau à distance à des postes de travail d'utilisateurs sur lesquels ils sont administrateurs locaux. La stratégie **Remote host allows delegation of nonexportable credentials** est activée sur tous les postes de travail.

        Un objet de stratégie de groupe (GPO) lié à HelpDesk-PCs définit la stratégie **Restrict delegation of credentials to remote servers** sur **Restrict credential delegation**. Les techniciens lancent leurs connexions en exécutant `mstsc.exe /restrictedAdmin`.

        Un examen de sécurité constate que, depuis une session du support, le poste de travail peut s'authentifier auprès d'autres ordinateurs du réseau en tant que technicien. Vous devez faire en sorte que les sessions du support ne puissent pas utiliser l'identité du technicien sur le réseau. Le paramètre doit être imposé pour chaque connexion, quelle que soit la façon dont un technicien lance le client Bureau à distance.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In the GPO, change Restrict delegation of credentials to remote servers to Require Remote Credential Guard.", fr: "Dans le GPO, définir Restrict delegation of credentials to remote servers sur Require Remote Credential Guard." } }
        - { id: b, text: { en: "In the GPO, change Restrict delegation of credentials to remote servers to Require Restricted Admin.", fr: "Dans le GPO, définir Restrict delegation of credentials to remote servers sur Require Restricted Admin." } }
        - { id: c, text: { en: "On the workstations, disable the policy Remote host allows delegation of nonexportable credentials.", fr: "Sur les postes de travail, désactiver la stratégie Remote host allows delegation of nonexportable credentials." } }
        - { id: d, text: { en: "In the GPO, disable Restrict delegation of credentials to remote servers so that the /restrictedAdmin switch applies.", fr: "Dans le GPO, désactiver Restrict delegation of credentials to remote servers pour que le commutateur /restrictedAdmin s'applique." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With Restrict credential delegation, the client prefers Remote Credential Guard and uses Restricted Admin only when Remote Credential Guard can't be used; the /restrictedAdmin switch is then ignored. Remote Credential Guard gives single sign-on to other systems as the signed-in user, which is what the review found. Require Restricted Admin forces Restricted Admin mode, in which the session can't use the technician's identity.
        fr: |
          Avec Restrict credential delegation, le client privilégie Remote Credential Guard et n'utilise Restricted Admin que si Remote Credential Guard ne peut pas l'être ; le commutateur /restrictedAdmin est alors ignoré. Remote Credential Guard offre l'authentification unique vers d'autres systèmes en tant qu'utilisateur connecté, ce que l'examen a constaté. Require Restricted Admin impose le mode Administration restreinte, dans lequel la session ne peut pas utiliser l'identité du technicien.
      options:
        a: { en: "Remote Credential Guard keeps credentials on the client but lets the session authenticate to other systems as the technician.", fr: "Remote Credential Guard garde les informations d'identification sur le client mais laisse la session s'authentifier auprès d'autres systèmes en tant que technicien." }
        c: { en: "Both protected modes need this policy on the remote host; disabling it makes users pass their credentials to the workstation.", fr: "Les deux modes protégés ont besoin de cette stratégie sur l'hôte distant ; la désactiver oblige les utilisateurs à transmettre leurs informations d'identification au poste de travail." }
        d: { en: "Without the policy, nothing is enforced: a technician who omits the switch connects with a standard session.", fr: "Sans la stratégie, rien n'est imposé : un technicien qui omet le commutateur se connecte avec une session standard." }
    references:
      - title: Remote Credential Guard
        url: https://learn.microsoft.com/en-us/windows/security/identity-protection/remote-credential-guard

  # ------------------------------------------------------------------ 10
  - id: az802-qz-21-10
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Contoso, Ltd. has an AD DS forest named **contoso.com** that has a two-way forest trust with a forest named **fabrikam.com**. All the servers run Windows Server 2025. PowerShell remoting fails at the second hop in the four scenarios listed in the answer area.

        Which solution should you use for each scenario? To answer, drag the appropriate solutions to the correct scenarios. Each solution may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. dispose d'une forêt AD DS nommée **contoso.com** qui possède une approbation de forêt bidirectionnelle avec une forêt nommée **fabrikam.com**. Tous les serveurs exécutent Windows Server 2025. La communication à distance PowerShell échoue au second saut dans les quatre scénarios listés dans la zone de réponse.

        Quelle solution devez-vous utiliser pour chaque scénario ? Pour répondre, faites glisser les solutions appropriées vers les scénarios correspondants. Chaque solution peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: credssp, text: CredSSP }
        - { id: kcd, text: { en: "Kerberos constrained delegation set on the intermediate server", fr: "Délégation Kerberos contrainte définie sur le serveur intermédiaire" } }
        - { id: rbcd, text: { en: "Resource-based Kerberos constrained delegation set on the resource", fr: "Délégation Kerberos contrainte basée sur les ressources définie sur la ressource" } }
        - { id: jea, text: { en: "JEA endpoint that runs as a group managed service account", fr: "Point de terminaison JEA exécuté sous un compte de service administré de groupe" } }
        - { id: using, text: { en: "Credentials passed in the script block with $Using:", fr: "Informations d'identification transmises dans le bloc de script avec $Using:" } }
        - { id: kud, text: { en: "Kerberos unconstrained delegation", fr: "Délégation Kerberos non contrainte" } }
      targets:
        - id: crossforest
          text: { en: "An unattended job on SRV1 (contoso.com) copies files to \\\\FS9.fabrikam.com\\Drop. No credential may be stored on SRV1 or in the job, delegation must be limited to FS9, and only fabrikam.com administrators, who aren't Domain Admins, can update the computer object of FS9.", fr: "Une tâche sans surveillance sur SRV1 (contoso.com) copie des fichiers vers \\\\FS9.fabrikam.com\\Drop. Aucune information d'identification ne doit être stockée sur SRV1 ni dans la tâche, la délégation doit être limitée à FS9, et seuls les administrateurs de fabrikam.com, qui ne sont pas Domain Admins, peuvent modifier l'objet ordinateur de FS9." }
        - id: helpdesk
          text: { en: "Help desk operators who aren't administrators of SRV2 must run one approved function on SRV2 that reads \\\\FS1\\Logs. No password may need maintenance.", fr: "Des opérateurs du support qui ne sont pas administrateurs de SRV2 doivent exécuter sur SRV2 une fonction approuvée qui lit \\\\FS1\\Logs. Aucun mot de passe ne doit nécessiter de maintenance." }
        - id: oneoff
          text: { en: "An administrator runs a one-off interactive script from Client1 through SRV3 that reads \\\\FS2\\Install. No setting may change on any computer, in AD DS or in WinRM.", fr: "Un administrateur exécute ponctuellement un script interactif depuis Client1 via SRV3 qui lit \\\\FS2\\Install. Aucun paramètre ne doit changer sur un ordinateur, dans AD DS ni dans WinRM." }
        - id: nested
          text: { en: "In an isolated lab whose accounts aren't in Protected Users, administrators must open a nested WinRM session from SRV4 to SRV5 with full language and without typing their credentials again. The lab owner accepts that credentials are cached on SRV4.", fr: "Dans un laboratoire isolé dont les comptes ne sont pas dans Protected Users, les administrateurs doivent ouvrir une session WinRM imbriquée de SRV4 vers SRV5 avec le langage complet et sans saisir de nouveau leurs informations d'identification. Le responsable du laboratoire accepte que les informations d'identification soient mises en cache sur SRV4." }
    answer:
      mapping: { crossforest: rbcd, helpdesk: jea, oneoff: using, nested: credssp }
    explanation:
      correct:
        en: |
          Resource-based constrained delegation is set on the resource (FS9), stores no credentials, doesn't require Domain Admins and works across forests. A JEA endpoint running as a gMSA limits operators to approved commands and reaches network shares with no password to maintain. Passing credentials with $Using: needs no configuration at all. The Kerberos delegation options don't support the second hop for WinRM, so the nested session needs CredSSP, acceptable only in this trusted lab because it caches credentials on SRV4.
        fr: |
          La délégation contrainte basée sur les ressources se définit sur la ressource (FS9), ne stocke aucune information d'identification, n'exige pas Domain Admins et fonctionne entre forêts. Un point de terminaison JEA exécuté sous un gMSA limite les opérateurs aux commandes approuvées et atteint les partages réseau sans mot de passe à maintenir. Transmettre les informations d'identification avec $Using: ne demande aucune configuration. Les options de délégation Kerberos ne prennent pas en charge le second saut pour WinRM : la session imbriquée demande donc CredSSP, acceptable uniquement dans ce laboratoire de confiance car il met en cache les informations d'identification sur SRV4.
      options:
        kcd: { en: "Classic constrained delegation needs Domain Admins, is limited to one domain and doesn't support the WinRM second hop.", fr: "La délégation contrainte classique exige Domain Admins, est limitée à un domaine et ne prend pas en charge le second saut WinRM." }
        kud: { en: "Unconstrained delegation gives no control over where credentials are used and should be used only for testing.", fr: "La délégation non contrainte ne donne aucun contrôle sur l'usage des informations d'identification et ne doit servir qu'aux tests." }
    references:
      - title: Making the second hop in PowerShell Remoting
        url: https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/ps-remoting-second-hop
