chapter: 13-security-principals
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-13-01
    objective: "1.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Lea Martin, a new engineer, joins the **adatum.com** domain. Her user account (SamAccountName **lmartin**) must become a member of the groups **G-Engineering**, **G-VPN-Users** and **G-Wiki-Editors**.

        You want to do it with a single PowerShell command. Which command should you run?
      fr: |
        Lea Martin, une nouvelle ingénieure, rejoint le domaine **adatum.com**. Son compte d'utilisateur (SamAccountName **lmartin**) doit devenir membre des groupes **G-Engineering**, **G-VPN-Users** et **G-Wiki-Editors**.

        Vous voulez le faire avec une seule commande PowerShell. Quelle commande devez-vous exécuter ?
    body:
      options:
        - { id: a, text: "`Add-ADGroupMember -Identity lmartin -Members G-Engineering,G-VPN-Users,G-Wiki-Editors`" }
        - { id: b, text: "`Set-ADUser -Identity lmartin -Add @{memberOf=\"G-Engineering\",\"G-VPN-Users\",\"G-Wiki-Editors\"}`" }
        - { id: c, text: "`Add-ADPrincipalGroupMembership -Identity lmartin -MemberOf G-Engineering,G-VPN-Users,G-Wiki-Editors`" }
        - { id: d, text: "`Add-ADGroupMember -Identity G-Engineering,G-VPN-Users,G-Wiki-Editors -Members lmartin`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `Add-ADPrincipalGroupMembership` adds a user, group, computer or service account to one or more groups: the principal goes in `-Identity` and the groups, separated by commas, in `-MemberOf`. It is the cmdlet for "one account, several groups", while `Add-ADGroupMember` is for "one group, several members".
        fr: |
          `Add-ADPrincipalGroupMembership` ajoute un utilisateur, un groupe, un ordinateur ou un compte de service à un ou plusieurs groupes : le principal se place dans `-Identity` et les groupes, séparés par des virgules, dans `-MemberOf`. C'est la commande pour « un compte, plusieurs groupes », tandis que `Add-ADGroupMember` sert à « un groupe, plusieurs membres ».
      options:
        a: { en: "The roles are reversed: in Add-ADGroupMember, -Identity is the group and -Members lists the accounts to add, so lmartin isn't a group that can receive members.", fr: "Les rôles sont inversés : dans Add-ADGroupMember, -Identity désigne le groupe et -Members les comptes à ajouter ; lmartin n'est pas un groupe qui peut recevoir des membres." }
        b: { en: "memberOf is a back-link attribute computed from the member attribute of the groups; it can't be written on the user account.", fr: "memberOf est un attribut de lien arrière calculé à partir de l'attribut member des groupes ; il ne peut pas être écrit sur le compte d'utilisateur." }
        d: { en: "The -Identity parameter of Add-ADGroupMember accepts a single group, so this command would need to be run once per group.", fr: "Le paramètre -Identity d'Add-ADGroupMember n'accepte qu'un seul groupe : cette commande devrait être exécutée une fois par groupe." }
    references:
      - title: Add-ADPrincipalGroupMembership (ActiveDirectory)
        url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/add-adprincipalgroupmembership

  # ------------------------------------------------------------------ 2
  - id: az802-qz-13-02
    objective: "1.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You created the group managed service account (gMSA) **svc-print** and ran `Install-ADServiceAccount -Identity svc-print` on the print server **PRN2**.

        Before you configure the print management service to use svc-print, you want to confirm that PRN2 can retrieve the managed password of the account. Which cmdlet should you run on PRN2?
      fr: |
        Vous avez créé le compte de service administré de groupe (gMSA) **svc-print** et exécuté `Install-ADServiceAccount -Identity svc-print` sur le serveur d'impression **PRN2**.

        Avant de configurer le service de gestion de l'impression pour qu'il utilise svc-print, vous voulez vérifier que PRN2 peut récupérer le mot de passe géré du compte. Quelle commande devez-vous exécuter sur PRN2 ?
    body:
      options:
        - { id: a, text: "`Get-ADServiceAccount`" }
        - { id: b, text: "`Get-KdsRootKey`" }
        - { id: c, text: "`Test-ComputerSecureChannel`" }
        - { id: d, text: "`Test-ADServiceAccount`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `Test-ADServiceAccount -Identity svc-print` checks from the host that the computer can retrieve the password of the gMSA, and returns True or False. A False result usually means that the host isn't in the group allowed to retrieve the password, or that it hasn't obtained a new ticket since it was added to that group.
        fr: |
          `Test-ADServiceAccount -Identity svc-print` vérifie depuis l'hôte que l'ordinateur peut récupérer le mot de passe du gMSA, et renvoie True ou False. Un résultat False signifie généralement que l'hôte n'est pas dans le groupe autorisé à récupérer le mot de passe, ou qu'il n'a pas obtenu de nouveau ticket depuis son ajout à ce groupe.
      options:
        a: { en: "Get-ADServiceAccount reads the properties of the account object in AD DS; it doesn't test whether PRN2 can retrieve the password.", fr: "Get-ADServiceAccount lit les propriétés de l'objet compte dans AD DS ; il ne vérifie pas que PRN2 peut récupérer le mot de passe." }
        b: { en: "Get-KdsRootKey lists the KDS root keys of the forest; a key can exist while PRN2 still isn't allowed to retrieve the password.", fr: "Get-KdsRootKey liste les clés racines KDS de la forêt ; une clé peut exister alors que PRN2 n'est toujours pas autorisé à récupérer le mot de passe." }
        c: { en: "Test-ComputerSecureChannel checks the secure channel between PRN2 and its domain, not the use of a managed service account.", fr: "Test-ComputerSecureChannel vérifie le canal sécurisé entre PRN2 et son domaine, pas l'utilisation d'un compte de service administré." }
    references:
      - title: Manage Group Managed Service Accounts
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-managed-service-accounts/group-managed-service-accounts/getting-started-with-group-managed-service-accounts

  # ------------------------------------------------------------------ 3
  - id: az802-qz-13-03
    objective: "1.3.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        The **litware.com** forest contains the domains **litware.com** and **emea.litware.com**. During a reorganization, the user account of **Noah Weber** is moved from emea.litware.com to litware.com.

        Users must also be able to sign in with a user principal name (UPN) in the form `user@litwareinc.com`. You run `Set-ADForest -Identity litware.com -UPNSuffixes @{Add="litwareinc.com"}`.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        La forêt **litware.com** contient les domaines **litware.com** et **emea.litware.com**. Lors d'une réorganisation, le compte d'utilisateur de **Noah Weber** est déplacé d'emea.litware.com vers litware.com.

        Les utilisateurs doivent aussi pouvoir se connecter avec un nom d'utilisateur principal (UPN) de la forme `user@litwareinc.com`. Vous exécutez `Set-ADForest -Identity litware.com -UPNSuffixes @{Add="litwareinc.com"}`.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "In litware.com, the account of Noah Weber has a different SID from the one it had in emea.litware.com.", fr: "Dans litware.com, le compte de Noah Weber a un SID différent de celui qu'il avait dans emea.litware.com." }
        - id: s2
          text: { en: "Moving a user account from one OU to another OU of emea.litware.com gives the account a new SID.", fr: "Déplacer un compte d'utilisateur d'une UO vers une autre UO d'emea.litware.com donne un nouveau SID au compte." }
        - id: s3
          text: { en: "A user account of emea.litware.com can be given a UPN in the form user@litwareinc.com.", fr: "Un compte d'utilisateur d'emea.litware.com peut recevoir un UPN de la forme user@litwareinc.com." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          The relative part of a SID is unique only inside its domain, so a user who moves to another domain gets a new SID; the previous one is kept in the SIDHistory attribute. A move between OUs of the same domain doesn't change the domain, so the SID stays the same. UPN suffixes are a property of the forest (`Set-ADForest -UPNSuffixes`), so every domain of the forest can use litwareinc.com.
        fr: |
          La partie relative d'un SID n'est unique qu'à l'intérieur de son domaine : un utilisateur qui change de domaine reçoit donc un nouveau SID, l'ancien étant conservé dans l'attribut SIDHistory. Un déplacement entre UO du même domaine ne change pas le domaine : le SID reste le même. Les suffixes UPN sont une propriété de la forêt (`Set-ADForest -UPNSuffixes`) : tous les domaines de la forêt peuvent donc utiliser litwareinc.com.
      options:
        s2: { en: "The domain part of the SID doesn't change inside a domain: an OU is a container for delegation and Group Policy, not a SID namespace.", fr: "La partie domaine du SID ne change pas à l'intérieur d'un domaine : une UO est un conteneur pour la délégation et la stratégie de groupe, pas un espace de noms de SID." }
    references:
      - title: Security Identifiers
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-identifiers
      - title: Set-ADForest (ActiveDirectory)
        url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/set-adforest

  # ------------------------------------------------------------------ 4
  - id: az802-qz-13-04
    objective: "1.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        At Tailspin Toys, the user accounts of 40 temporary auditors are in the **Auditors-2026** OU of the **tailspin.local** domain. Their mission ends in 60 days.

        At the end of the mission, the accounts must automatically stop allowing sign-ins, without a scheduled task. They must stay in the directory with their group memberships. What should you run?
      fr: |
        Chez Tailspin Toys, les comptes d'utilisateur de 40 auditeurs temporaires se trouvent dans l'UO **Auditors-2026** du domaine **tailspin.local**. Leur mission se termine dans 60 jours.

        À la fin de la mission, les comptes doivent automatiquement cesser de permettre la connexion, sans tâche planifiée. Ils doivent rester dans l'annuaire avec leurs appartenances aux groupes. Que devez-vous exécuter ?
    body:
      options:
        - { id: a, text: 'Get-ADUser -Filter * -SearchBase "OU=Auditors-2026,DC=tailspin,DC=local" | Disable-ADAccount' }
        - { id: b, text: 'Get-ADUser -Filter * -SearchBase "OU=Auditors-2026,DC=tailspin,DC=local" | Set-ADAccountExpiration -TimeSpan 60.0:0' }
        - { id: c, text: 'Search-ADAccount -AccountExpiring -TimeSpan 60.00:00:00 -UsersOnly | Disable-ADAccount' }
        - { id: d, text: 'Set-ADDefaultDomainPasswordPolicy -Identity tailspin.local -MaxPasswordAge 60.00:00:00' }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `Set-ADAccountExpiration -TimeSpan 60.0:0` sets an expiration date 60 days from now on every account of the OU. When the date is reached, the domain controllers refuse sign-ins with these accounts, which stay in the directory, enabled, with all their group memberships.
        fr: |
          `Set-ADAccountExpiration -TimeSpan 60.0:0` définit une date d'expiration dans 60 jours sur chaque compte de l'UO. À cette date, les contrôleurs de domaine refusent les connexions avec ces comptes, qui restent dans l'annuaire, activés, avec toutes leurs appartenances aux groupes.
      options:
        a: { en: "Disable-ADAccount disables the accounts immediately, not at the end of the mission in 60 days.", fr: "Disable-ADAccount désactive les comptes immédiatement, et non à la fin de la mission dans 60 jours." }
        c: { en: "-AccountExpiring finds accounts that already have an expiration date; these accounts have none, and the found accounts would be disabled immediately anyway.", fr: "-AccountExpiring trouve les comptes qui ont déjà une date d'expiration ; ces comptes n'en ont pas, et les comptes trouvés seraient de toute façon désactivés immédiatement." }
        d: { en: "The maximum password age only forces a password change, and it applies to every account of the domain instead of the auditors only.", fr: "La durée de vie maximale du mot de passe ne fait qu'imposer un changement de mot de passe, et elle s'applique à tous les comptes du domaine au lieu des seuls auditeurs." }
    references:
      - title: Set-ADAccountExpiration (ActiveDirectory)
        url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/set-adaccountexpiration

  # ------------------------------------------------------------------ 5
  - id: az802-qz-13-05
    objective: "1.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        All the domain controllers of **fabrikam.com** run Windows Server 2025, and a KDS root key exists. On **APP7**, a member server that runs Windows Server 2025, the service **InvoiceSvc** runs as the domain user account **svc-invoice**.

        You create the delegated managed service account (dMSA) **dmsa-invoice**, and then you run `Start-ADServiceAccountMigration` with svc-invoice as the superseded account.

        You need APP7 to be able to sign in as dmsa-invoice when InvoiceSvc restarts. What should you configure?
      fr: |
        Tous les contrôleurs de domaine de **fabrikam.com** exécutent Windows Server 2025, et une clé racine KDS existe. Sur **APP7**, un serveur membre qui exécute Windows Server 2025, le service **InvoiceSvc** s'exécute sous le compte d'utilisateur de domaine **svc-invoice**.

        Vous créez le compte de service administré délégué (dMSA) **dmsa-invoice**, puis vous exécutez `Start-ADServiceAccountMigration` avec svc-invoice comme compte remplacé.

        Vous devez faire en sorte qu'APP7 puisse se connecter en tant que dmsa-invoice au redémarrage d'InvoiceSvc. Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "A security group that contains APP7, set as the retrieval principals of dmsa-invoice", fr: "Un groupe de sécurité qui contient APP7, défini comme principaux de récupération de dmsa-invoice" } }
        - { id: b, text: { en: "The Enable Delegated Managed Service Account logons Kerberos policy on APP7", fr: "La stratégie Kerberos Enable Delegated Managed Service Account logons sur APP7" } }
        - { id: c, text: { en: "A new KDS root key, created by running Add-KdsRootKey -EffectiveImmediately", fr: "Une nouvelle clé racine KDS, créée en exécutant Add-KdsRootKey -EffectiveImmediately" } }
        - { id: d, text: { en: "A new managed password, generated by running Reset-ADServiceAccountPassword", fr: "Un nouveau mot de passe géré, généré en exécutant Reset-ADServiceAccountPassword" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A computer uses a dMSA only when dMSA logons are enabled on it: the Kerberos policy **Enable Delegated Managed Service Account logons** (Computer Configuration > Administrative Templates > System > Kerberos), or the `DelegatedMSAEnabled` registry value that it sets. During the migration, the dMSA then learns the computers that use svc-invoice once their services restart.
        fr: |
          Un ordinateur n'utilise un dMSA que si les connexions dMSA y sont activées : la stratégie Kerberos **Enable Delegated Managed Service Account logons** (Configuration ordinateur > Modèles d'administration > Système > Kerberos), ou la valeur de Registre `DelegatedMSAEnabled` qu'elle définit. Pendant la migration, le dMSA apprend ensuite les ordinateurs qui utilisent svc-invoice dès que leurs services redémarrent.
      options:
        a: { en: "During the migration, the computers that use svc-invoice are added to the dMSA's membership automatically; without dMSA logons enabled on APP7, the service still can't use the dMSA.", fr: "Pendant la migration, les ordinateurs qui utilisent svc-invoice sont ajoutés automatiquement à l'appartenance du dMSA ; sans connexions dMSA activées sur APP7, le service ne peut toujours pas utiliser le dMSA." }
        c: { en: "The KDS root key is a forest object held by the domain controllers, and one already exists; creating another one changes nothing for APP7.", fr: "La clé racine KDS est un objet de la forêt détenu par les contrôleurs de domaine, et il en existe déjà une ; en créer une autre ne change rien pour APP7." }
        d: { en: "Reset-ADServiceAccountPassword applies to standalone managed service accounts; the keys of a dMSA are held by the domain controllers.", fr: "Reset-ADServiceAccountPassword s'applique aux comptes de service administrés autonomes ; les clés d'un dMSA sont détenues par les contrôleurs de domaine." }
    references:
      - title: Delegated Managed Service Accounts overview in Windows Server 2025
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/delegated-managed-service-accounts/delegated-managed-service-accounts-overview
      - title: Setting up delegated Managed Service Accounts (dMSA) in Windows Server 2025
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/delegated-managed-service-accounts/delegated-managed-service-accounts-set-up-dmsa

  # ------------------------------------------------------------------ 6
  - id: az802-qz-13-06
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        The **contoso.com** forest contains the domains **contoso.com** and **apac.contoso.com**.

        - In apac.contoso.com, the domain local group **DL-APAC-Readers** contains only global groups of apac.contoso.com. It has Read permission on a shared folder of **FS-APAC**, a file server of apac.contoso.com.
        - In contoso.com, the domain local group **DL-Archive-Read** has Read permission on `\\FS-HQ\Archive`, a file server of contoso.com.

        You try to add DL-APAC-Readers as a member of DL-Archive-Read, and the operation fails.

        You need all the current and future members of DL-APAC-Readers to get Read on `\\FS-HQ\Archive`. The existing permission on FS-APAC must keep working, and the solution must minimize administrative effort.

        What should you do?
      fr: |
        La forêt **contoso.com** contient les domaines **contoso.com** et **apac.contoso.com**.

        - Dans apac.contoso.com, le groupe de domaine local **DL-APAC-Readers** ne contient que des groupes globaux d'apac.contoso.com. Il a l'autorisation Lecture sur un dossier partagé de **FS-APAC**, un serveur de fichiers d'apac.contoso.com.
        - Dans contoso.com, le groupe de domaine local **DL-Archive-Read** a l'autorisation Lecture sur `\\FS-HQ\Archive`, un serveur de fichiers de contoso.com.

        Vous essayez d'ajouter DL-APAC-Readers comme membre de DL-Archive-Read, et l'opération échoue.

        Vous devez faire en sorte que tous les membres actuels et futurs de DL-APAC-Readers obtiennent la Lecture sur `\\FS-HQ\Archive`. L'autorisation existante sur FS-APAC doit continuer à fonctionner, et la solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Convert DL-Archive-Read to the universal scope, and then add DL-APAC-Readers to it.", fr: "Convertir DL-Archive-Read en étendue universelle, puis y ajouter DL-APAC-Readers." } }
        - { id: b, text: { en: "Convert DL-APAC-Readers to the global scope, and then add it to DL-Archive-Read.", fr: "Convertir DL-APAC-Readers en étendue globale, puis l'ajouter à DL-Archive-Read." } }
        - { id: c, text: { en: "Convert DL-APAC-Readers to the universal scope, and then add it to DL-Archive-Read.", fr: "Convertir DL-APAC-Readers en étendue universelle, puis l'ajouter à DL-Archive-Read." } }
        - { id: d, text: { en: "Grant DL-APAC-Readers the Read permission on the Archive share and folder directly.", fr: "Accorder directement à DL-APAC-Readers l'autorisation Lecture sur le partage et le dossier Archive." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A domain local group can contain domain local groups of its own domain only, so DL-APAC-Readers can't join DL-Archive-Read as it is. Because it contains no other domain local group, DL-APAC-Readers can be converted to universal; a universal group of any domain of the forest can be a member of a domain local group. A scope change keeps the SID, and a universal group can be granted permissions in any domain of the forest, so the FS-APAC permission keeps working.
        fr: |
          Un groupe de domaine local ne peut contenir que des groupes de domaine local de son propre domaine : DL-APAC-Readers ne peut donc pas rejoindre DL-Archive-Read en l'état. Comme il ne contient aucun autre groupe de domaine local, DL-APAC-Readers peut être converti en universel ; un groupe universel de n'importe quel domaine de la forêt peut être membre d'un groupe de domaine local. Le changement d'étendue conserve le SID, et un groupe universel peut recevoir des autorisations dans tout domaine de la forêt : l'autorisation sur FS-APAC continue de fonctionner.
      options:
        a: { en: "A universal group can contain accounts, global groups and universal groups of the forest, but never a domain local group.", fr: "Un groupe universel peut contenir des comptes, des groupes globaux et des groupes universels de la forêt, mais jamais un groupe de domaine local." }
        b: { en: "A domain local group can be converted only to the universal scope; there is no direct conversion from domain local to global.", fr: "Un groupe de domaine local ne peut être converti qu'en étendue universelle ; il n'existe pas de conversion directe de domaine local à global." }
        d: { en: "A domain local group can be granted permissions only in its own domain, and FS-HQ is in contoso.com.", fr: "Un groupe de domaine local ne peut recevoir des autorisations que dans son propre domaine, et FS-HQ se trouve dans contoso.com." }
    references:
      - title: Active Directory Security Groups
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-groups

  # ------------------------------------------------------------------ 7
  - id: az802-qz-13-07
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        In the **fabrikam.com** domain, the domain local group **Projects** has Modify permission on several folders of the file server **FS1**. Projects contains user accounts of fabrikam.com and the domain local group **Interns**, which contains only user accounts of fabrikam.com.

        You need to make Projects a member of the global group **G-Staff** of fabrikam.com. The following requirements must be met:

        - The permissions granted to Projects must keep working without being reassigned.
        - Interns and G-Staff must keep their current scope.
        - The members of Interns must keep the access granted by Projects at all times.

        Which five commands should you run in sequence? To answer, move the appropriate commands from the list of commands to the answer area and arrange them in the correct order.
      fr: |
        Dans le domaine **fabrikam.com**, le groupe de domaine local **Projects** a l'autorisation Modification sur plusieurs dossiers du serveur de fichiers **FS1**. Projects contient des comptes d'utilisateur de fabrikam.com et le groupe de domaine local **Interns**, qui ne contient que des comptes d'utilisateur de fabrikam.com.

        Vous devez faire de Projects un membre du groupe global **G-Staff** de fabrikam.com. Les exigences suivantes doivent être respectées :

        - Les autorisations accordées à Projects doivent continuer à fonctionner sans être réattribuées.
        - Interns et G-Staff doivent conserver leur étendue actuelle.
        - Les membres d'Interns doivent conserver à tout moment l'accès accordé par Projects.

        Quelles sont les cinq commandes à exécuter dans l'ordre ? Pour répondre, déplacez les commandes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
    body:
      actions:
        - { id: copy, text: 'Add-ADGroupMember -Identity "Projects" -Members (Get-ADGroupMember -Identity "Interns")' }
        - { id: remove, text: 'Remove-ADGroupMember -Identity "Projects" -Members "Interns"' }
        - { id: univ, text: 'Set-ADGroup -Identity "Projects" -GroupScope Universal' }
        - { id: glob, text: 'Set-ADGroup -Identity "Projects" -GroupScope Global' }
        - { id: join, text: 'Add-ADGroupMember -Identity "G-Staff" -Members "Projects"' }
        - { id: interns, text: 'Set-ADGroup -Identity "Interns" -GroupScope Universal' }
        - { id: staff, text: 'Set-ADGroup -Identity "G-Staff" -GroupScope Universal' }
      count: 5
    answer:
      sequence: [copy, remove, univ, glob, join]
    explanation:
      correct:
        en: |
          A global group can contain only accounts and global groups of its domain, so Projects must become global, and a domain local group can't be converted directly to global: it goes through universal. The conversion to universal is allowed only if Projects contains no domain local group, so Interns must leave Projects first, after its members were added directly to keep their access. Projects is then converted to universal, then to global (it contains no universal group), and only then can it join G-Staff. Scope changes keep the SID, so the FS1 permissions keep working.
        fr: |
          Un groupe global ne peut contenir que des comptes et des groupes globaux de son domaine : Projects doit donc devenir global, et un groupe de domaine local ne peut pas être converti directement en global, il passe par universel. La conversion en universel n'est permise que si Projects ne contient aucun groupe de domaine local : Interns doit donc d'abord sortir de Projects, après que ses membres ont été ajoutés directement pour conserver leur accès. Projects est ensuite converti en universel, puis en global (il ne contient aucun groupe universel), et ce n'est qu'alors qu'il peut rejoindre G-Staff. Les changements d'étendue conservent le SID : les autorisations sur FS1 continuent de fonctionner.
      options:
        interns: { en: "Interns must keep its scope; and a universal Interns would block the later conversion of Projects from universal to global.", fr: "Interns doit conserver son étendue ; de plus, un Interns universel bloquerait la conversion ultérieure de Projects d'universel à global." }
        staff: { en: "G-Staff must stay global; a universal group also can't be a member of a global group, so the conflict would only move.", fr: "G-Staff doit rester global ; de plus, un groupe universel ne peut pas être membre d'un groupe global : le problème ne ferait que se déplacer." }
    references:
      - title: Active Directory Security Groups
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-groups

  # ------------------------------------------------------------------ 8
  - id: az802-qz-13-08
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        All the domain controllers of **woodgrove.com** run Windows Server 2025, and a KDS root key exists in the forest. You are choosing the account under which four services will run.

        Which account type should you use for each service? To answer, drag the appropriate account types to the correct services. Each account type may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tous les contrôleurs de domaine de **woodgrove.com** exécutent Windows Server 2025, et une clé racine KDS existe dans la forêt. Vous choisissez le compte sous lequel quatre services s'exécuteront.

        Quel type de compte devez-vous utiliser pour chaque service ? Pour répondre, faites glisser les types de comptes appropriés vers les services correspondants. Chaque type de compte peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      items:
        - { id: user, text: { en: "Domain user account", fr: "Compte d'utilisateur de domaine" } }
        - { id: smsa, text: { en: "Standalone managed service account (sMSA)", fr: "Compte de service administré autonome (sMSA)" } }
        - { id: gmsa, text: { en: "Group managed service account (gMSA)", fr: "Compte de service administré de groupe (gMSA)" } }
        - { id: dmsa, text: { en: "Delegated managed service account (dMSA)", fr: "Compte de service administré délégué (dMSA)" } }
        - { id: virtual, text: { en: "Virtual account", fr: "Compte virtuel" } }
      targets:
        - { id: t1, text: { en: "A new web application in IIS application pools on WEB1, WEB2 and WEB3, three servers that run Windows Server 2022 behind a load balancer. The password must change automatically.", fr: "Une nouvelle application web dans des pools d'applications IIS sur WEB1, WEB2 et WEB3, trois serveurs qui exécutent Windows Server 2022 derrière un équilibreur de charge. Le mot de passe doit changer automatiquement." } }
        - { id: t2, text: { en: "The ERP service on ERP1, which runs Windows Server 2025, uses the domain user account svc-erp, which has SPNs. svc-erp must be replaced by an account whose keys can't be harvested, which takes over its SPNs, and after which svc-erp is disabled.", fr: "Le service ERP sur ERP1, qui exécute Windows Server 2025, utilise le compte d'utilisateur de domaine svc-erp, qui possède des SPN. svc-erp doit être remplacé par un compte dont les clés ne peuvent pas être récoltées, qui reprend ses SPN, et après quoi svc-erp est désactivé." } }
        - { id: t3, text: { en: "A third-party backup agent on FS4 whose console only accepts an account name and a password typed by an administrator.", fr: "Un agent de sauvegarde tiers sur FS4 dont la console n'accepte qu'un nom de compte et un mot de passe saisis par un administrateur." } }
        - { id: t4, text: { en: "A scheduled task that runs on BATCH1 and BATCH2, two servers that run Windows Server 2022, under one identity whose password nobody manages.", fr: "Une tâche planifiée qui s'exécute sur BATCH1 et BATCH2, deux serveurs qui exécutent Windows Server 2022, sous une même identité dont personne ne gère le mot de passe." } }
      reuse: true
    answer:
      mapping: { t1: gmsa, t2: dmsa, t3: user, t4: gmsa }
    explanation:
      correct:
        en: |
          A gMSA is the account for a service or a scheduled task shared by several servers: the domain controllers compute its password and the authorized hosts retrieve it. A dMSA, available on Windows Server 2025, replaces an existing service account through a migration that moves its SPNs and disables it, and binds authentication to the machine identity to stop kerberoasting. A domain user account remains only for software that can't use anything but a typed name and password.
        fr: |
          Un gMSA est le compte d'un service ou d'une tâche planifiée partagé par plusieurs serveurs : les contrôleurs de domaine calculent son mot de passe et les hôtes autorisés le récupèrent. Un dMSA, disponible sur Windows Server 2025, remplace un compte de service existant par une migration qui déplace ses SPN et le désactive, et lie l'authentification à l'identité de la machine pour empêcher le kerberoasting. Un compte d'utilisateur de domaine ne reste que pour un logiciel qui ne peut utiliser qu'un nom et un mot de passe saisis.
      options:
        smsa: { en: "An sMSA is limited to one computer: it fits none of the multi-server services, and the backup agent requires a typed password.", fr: "Un sMSA est limité à un seul ordinateur : il ne convient à aucun des services multiserveurs, et l'agent de sauvegarde exige un mot de passe saisi." }
        virtual: { en: "A virtual account exists on one computer only and uses the computer account on the network: it can't be shared by several servers.", fr: "Un compte virtuel n'existe que sur un seul ordinateur et utilise le compte d'ordinateur sur le réseau : il ne peut pas être partagé par plusieurs serveurs." }
        dmsa: { en: "dMSA setup is available only on Windows Server 2025, so it can't serve the Windows Server 2022 servers.", fr: "La configuration d'un dMSA n'est disponible que sur Windows Server 2025 : il ne peut pas servir les serveurs Windows Server 2022." }
    references:
      - title: Delegated Managed Service Accounts overview in Windows Server 2025
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/delegated-managed-service-accounts/delegated-managed-service-accounts-overview
      - title: Manage Group Managed Service Accounts
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-managed-service-accounts/group-managed-service-accounts/getting-started-with-group-managed-service-accounts

  # ------------------------------------------------------------------ 9
  - id: az802-qz-13-09
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A one-way forest trust exists between the **adatum.com** and **litware.com** forests: adatum.com trusts litware.com. No other trust exists. **FS9** is a file server of the litware.com domain, whose administrators grant permissions on FS9 to domain local groups only.

        The members of the global group **G-ADT-Legal** of adatum.com need the Modify permission on the share `\\FS9\Contracts`.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Une approbation de forêt unidirectionnelle existe entre les forêts **adatum.com** et **litware.com** : adatum.com approuve litware.com. Aucune autre approbation n'existe. **FS9** est un serveur de fichiers du domaine litware.com, dont les administrateurs n'accordent d'autorisations sur FS9 qu'à des groupes de domaine local.

        Les membres du groupe global **G-ADT-Legal** d'adatum.com ont besoin de l'autorisation Modification sur le partage `\\FS9\Contracts`.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Add G-ADT-Legal to a universal group of litware.com that has Modify on the share.", fr: "Ajouter G-ADT-Legal à un groupe universel de litware.com qui a Modification sur le partage." } }
        - { id: b, text: { en: "Create a one-way forest trust in which litware.com trusts adatum.com.", fr: "Créer une approbation de forêt unidirectionnelle dans laquelle litware.com approuve adatum.com." } }
        - { id: c, text: { en: "Add a domain local group of litware.com that has Modify on the share to G-ADT-Legal.", fr: "Ajouter à G-ADT-Legal un groupe de domaine local de litware.com qui a Modification sur le partage." } }
        - { id: d, text: { en: "Add G-ADT-Legal to a domain local group of litware.com that has Modify on the share.", fr: "Ajouter G-ADT-Legal à un groupe de domaine local de litware.com qui a Modification sur le partage." } }
        - { id: e, text: { en: "Convert G-ADT-Legal to the universal scope so that litware.com can resolve its members.", fr: "Convertir G-ADT-Legal en étendue universelle pour que litware.com puisse résoudre ses membres." } }
      choose: 2
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          The existing trust lets accounts of litware.com (the trusted forest) be used on resources of adatum.com, not the reverse. For adatum.com accounts to reach FS9, litware.com must trust adatum.com. Then G-ADT-Legal, a principal of another forest, can only become a member of a domain local group of litware.com (it appears there as a foreign security principal), and that group holds the Modify permission.
        fr: |
          L'approbation existante permet d'utiliser des comptes de litware.com (la forêt approuvée) sur des ressources d'adatum.com, pas l'inverse. Pour que des comptes d'adatum.com atteignent FS9, litware.com doit approuver adatum.com. Ensuite, G-ADT-Legal, principal d'une autre forêt, ne peut devenir membre que d'un groupe de domaine local de litware.com (il y apparaît comme principal de sécurité étranger), et c'est ce groupe qui détient l'autorisation Modification.
      options:
        a: { en: "A universal group can contain only accounts and groups of its own forest, never principals of another forest.", fr: "Un groupe universel ne peut contenir que des comptes et des groupes de sa propre forêt, jamais des principaux d'une autre forêt." }
        c: { en: "A global group can contain only accounts and global groups of its own domain, and nesting would give litware.com groups no access to adatum.com users anyway.", fr: "Un groupe global ne peut contenir que des comptes et des groupes globaux de son propre domaine, et cette imbrication ne donnerait de toute façon aucun accès aux utilisateurs d'adatum.com." }
        e: { en: "The scope of G-ADT-Legal doesn't decide anything here: without a trust from litware.com to adatum.com, no adatum.com group can be used in litware.com.", fr: "L'étendue de G-ADT-Legal ne décide de rien ici : sans approbation de litware.com vers adatum.com, aucun groupe d'adatum.com ne peut être utilisé dans litware.com." }
    references:
      - title: Active Directory Security Groups
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-groups
      - title: How trust relationships work for forests in Active Directory
        url: https://learn.microsoft.com/en-us/entra/identity/domain-services/concepts-forest-trust

  # ------------------------------------------------------------------ 10
  - id: az802-qz-13-10
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        In the **contoso.com** domain, the API service runs on **API1**, **API2** and **API3** as the group managed service account (gMSA) **svc-api**. svc-api was created with the group **API-Hosts** as `-PrincipalsAllowedToRetrieveManagedPassword`. The KDS root key was created two years ago.

        Yesterday, you added the computer account of the new server **API4** to API-Hosts. API4 hasn't been restarted since then. When `Test-ADServiceAccount -Identity svc-api` returned False on API4, another administrator ran the following command:

        `Set-ADServiceAccount -Identity svc-api -PrincipalsAllowedToRetrieveManagedPassword API4$`

        This morning, after a scheduled restart, the API service fails to start on API1, API2 and API3.

        You need the API service to run as svc-api on the four servers. Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Dans le domaine **contoso.com**, le service API s'exécute sur **API1**, **API2** et **API3** sous le compte de service administré de groupe (gMSA) **svc-api**. svc-api a été créé avec le groupe **API-Hosts** comme `-PrincipalsAllowedToRetrieveManagedPassword`. La clé racine KDS a été créée il y a deux ans.

        Hier, vous avez ajouté le compte d'ordinateur du nouveau serveur **API4** à API-Hosts. API4 n'a pas redémarré depuis. Comme `Test-ADServiceAccount -Identity svc-api` renvoyait False sur API4, un autre administrateur a exécuté la commande suivante :

        `Set-ADServiceAccount -Identity svc-api -PrincipalsAllowedToRetrieveManagedPassword API4$`

        Ce matin, après un redémarrage planifié, le service API ne démarre plus sur API1, API2 et API3.

        Vous devez faire en sorte que le service API s'exécute sous svc-api sur les quatre serveurs. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Run Add-KdsRootKey -EffectiveTime ((Get-Date).AddHours(-10)) on a domain controller.", fr: "Exécuter Add-KdsRootKey -EffectiveTime ((Get-Date).AddHours(-10)) sur un contrôleur de domaine." } }
        - { id: b, text: { en: "Run Set-ADServiceAccount -Identity svc-api -PrincipalsAllowedToRetrieveManagedPassword API-Hosts.", fr: "Exécuter Set-ADServiceAccount -Identity svc-api -PrincipalsAllowedToRetrieveManagedPassword API-Hosts." } }
        - { id: c, text: { en: "Run Reset-ADServiceAccountPassword -Identity svc-api on API1, API2 and API3.", fr: "Exécuter Reset-ADServiceAccountPassword -Identity svc-api sur API1, API2 et API3." } }
        - { id: d, text: { en: "Run Add-ADComputerServiceAccount -Identity API4 -ServiceAccount svc-api on a domain controller.", fr: "Exécuter Add-ADComputerServiceAccount -Identity API4 -ServiceAccount svc-api sur un contrôleur de domaine." } }
        - { id: e, text: { en: "Restart API4, and then run Install-ADServiceAccount -Identity svc-api on API4.", fr: "Redémarrer API4, puis exécuter Install-ADServiceAccount -Identity svc-api sur API4." } }
      choose: 2
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          `-PrincipalsAllowedToRetrieveManagedPassword` sets the whole list of principals allowed to use the gMSA, so the second command left API4$ alone in it: API1 to API3 lost the right to retrieve the password. Setting API-Hosts back restores the three servers and covers API4 through the group. API4 still has a ticket issued before it joined API-Hosts, so it must restart to get its new group membership before it can install and use svc-api.
        fr: |
          `-PrincipalsAllowedToRetrieveManagedPassword` définit la liste complète des principaux autorisés à utiliser le gMSA : la seconde commande n'y a laissé qu'API4$, et API1 à API3 ont perdu le droit de récupérer le mot de passe. Remettre API-Hosts rétablit les trois serveurs et couvre API4 par le groupe. API4 a encore un ticket émis avant son entrée dans API-Hosts : il doit redémarrer pour obtenir sa nouvelle appartenance au groupe avant de pouvoir installer et utiliser svc-api.
      options:
        a: { en: "The KDS root key has existed for two years and is replicated everywhere; a new back-dated key doesn't restore the list of allowed hosts.", fr: "La clé racine KDS existe depuis deux ans et est répliquée partout ; une nouvelle clé antidatée ne rétablit pas la liste des hôtes autorisés." }
        c: { en: "Reset-ADServiceAccountPassword applies to standalone managed service accounts, and the servers' problem is the right to retrieve the password, not the password itself.", fr: "Reset-ADServiceAccountPassword s'applique aux comptes de service administrés autonomes, et le problème des serveurs est le droit de récupérer le mot de passe, pas le mot de passe lui-même." }
        d: { en: "Add-ADComputerServiceAccount links a standalone managed service account to its computer; a gMSA's hosts are authorized through its retrieval list.", fr: "Add-ADComputerServiceAccount lie un compte de service administré autonome à son ordinateur ; les hôtes d'un gMSA sont autorisés par sa liste de récupération." }
    references:
      - title: Set-ADServiceAccount (ActiveDirectory)
        url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/set-adserviceaccount
      - title: Troubleshoot gMSAs for Windows containers
        url: https://learn.microsoft.com/en-us/virtualization/windowscontainers/manage-containers/gmsa-troubleshooting
