chapter: 14-group-policy
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-14-01
    objective: "1.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The computer account of **SRV2** is in the **Servers** OU, a child OU of the **Paris** OU, in the **northwind.com** domain. SRV2 is in the AD DS site **Paris-Site**. GPOs are linked to Paris-Site, to northwind.com, to the Paris OU and to the Servers OU, and SRV2 also has local policy settings.

        In which order does SRV2 process its Group Policy settings?
      fr: |
        Le compte d'ordinateur de **SRV2** se trouve dans l'UO **Servers**, une UO enfant de l'UO **Paris**, dans le domaine **northwind.com**. SRV2 se trouve dans le site AD DS **Paris-Site**. Des GPO sont liés à Paris-Site, à northwind.com, à l'UO Paris et à l'UO Servers, et SRV2 a aussi des paramètres de stratégie locale.

        Dans quel ordre SRV2 traite-t-il ses paramètres de stratégie de groupe ?
    body:
      options:
        - { id: a, text: { en: "Local GPO, northwind.com, Paris-Site, Paris OU, Servers OU", fr: "GPO local, northwind.com, Paris-Site, UO Paris, UO Servers" } }
        - { id: b, text: { en: "Local GPO, Paris-Site, northwind.com, Paris OU, Servers OU", fr: "GPO local, Paris-Site, northwind.com, UO Paris, UO Servers" } }
        - { id: c, text: { en: "Servers OU, Paris OU, northwind.com, Paris-Site, local GPO", fr: "UO Servers, UO Paris, northwind.com, Paris-Site, GPO local" } }
        - { id: d, text: { en: "Paris-Site, northwind.com, Servers OU, Paris OU, local GPO", fr: "Paris-Site, northwind.com, UO Servers, UO Paris, GPO local" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Group Policy is processed in the order local GPO, site, domain, then OUs from the parent down to the OU that contains the object (L-S-D-OU). Because the GPO applied last wins a conflict, the GPOs linked to the Servers OU have the highest precedence by default.
        fr: |
          La stratégie de groupe est traitée dans l'ordre GPO local, site, domaine, puis UO du parent jusqu'à l'UO qui contient l'objet (L-S-D-UO). Comme le GPO appliqué en dernier l'emporte en cas de conflit, les GPO liés à l'UO Servers ont par défaut la priorité la plus haute.
      options:
        a: { en: "The site is processed before the domain, not after it.", fr: "Le site est traité avant le domaine, pas après." }
        c: { en: "This is the order of precedence (from the strongest), not the processing order: the closest OU is processed last.", fr: "C'est l'ordre de priorité (du plus fort au plus faible), pas l'ordre de traitement : l'UO la plus proche est traitée en dernier." }
        d: { en: "The local GPO is processed first, and parent OUs are processed before their child OUs.", fr: "Le GPO local est traité en premier, et les UO parentes sont traitées avant leurs UO enfants." }
    references:
      - title: Group Policy processing for Windows
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-processing

  # ------------------------------------------------------------------ 2
  - id: az802-qz-14-02
    objective: "1.4.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The security team of Northwind Traders wants the built-in local Administrator account of each member server to have its own password, changed regularly. An administrator proposes to set the password with a Local Users and Groups preference item in a GPO linked to the **Servers** OU.

        What should you use instead?
      fr: |
        L'équipe de sécurité de Northwind Traders veut que le compte Administrateur local intégré de chaque serveur membre ait son propre mot de passe, changé régulièrement. Un administrateur propose de définir le mot de passe avec un élément de préférence Local Users and Groups dans un GPO lié à l'UO **Servers**.

        Que devez-vous utiliser à la place ?
    body:
      options:
        - { id: a, text: { en: "A Restricted Groups policy for the local Administrators group", fr: "Une stratégie Restricted Groups pour le groupe Administrateurs local" } }
        - { id: b, text: { en: "A fine-grained password policy applied to the server accounts", fr: "Une stratégie de mot de passe affinée appliquée aux comptes des serveurs" } }
        - { id: c, text: { en: "Windows LAPS, configured through Group Policy on the servers", fr: "Windows LAPS, configuré par stratégie de groupe sur les serveurs" } }
        - { id: d, text: { en: "A Registry preference item that writes the password value", fr: "Un élément de préférence Registry qui écrit la valeur du mot de passe" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Since security update MS14-025, the Group Policy Management Editor no longer lets preferences such as Local Users and Groups store passwords, because a password kept in a GPO could be retrieved and decrypted by any authenticated domain user. Windows LAPS gives each computer a unique, regularly rotated local administrator password.
        fr: |
          Depuis la mise à jour de sécurité MS14-025, l'Éditeur de gestion des stratégies de groupe ne permet plus aux préférences comme Local Users and Groups de stocker des mots de passe, car un mot de passe conservé dans un GPO pouvait être récupéré et déchiffré par n'importe quel utilisateur authentifié du domaine. Windows LAPS donne à chaque ordinateur un mot de passe d'administrateur local unique, changé régulièrement.
      options:
        a: { en: "Restricted Groups controls the membership of a group, not the password of an account.", fr: "Restricted Groups contrôle l'appartenance à un groupe, pas le mot de passe d'un compte." }
        b: { en: "A fine-grained password policy sets password rules for domain users and global groups; it doesn't set the password of local accounts.", fr: "Une stratégie de mot de passe affinée définit des règles de mot de passe pour des utilisateurs du domaine et des groupes globaux ; elle ne définit pas le mot de passe des comptes locaux." }
        d: { en: "A Registry item would store the password in clear text in SYSVOL, readable by every domain user, and Windows doesn't read account passwords from such a value.", fr: "Un élément Registry stockerait le mot de passe en clair dans SYSVOL, lisible par tout utilisateur du domaine, et Windows ne lit pas les mots de passe des comptes dans une telle valeur." }
    references:
      - title: Microsoft Security Bulletin MS14-025 - Important
        url: https://learn.microsoft.com/en-us/security-updates/SecurityBulletins/2014/ms14-025

  # ------------------------------------------------------------------ 3
  - id: az802-qz-14-03
    objective: "1.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The administrators of **northwind.com** edit GPOs from several workstations, and the Group Policy Management Editor shows different Administrative Templates settings depending on the workstation.

        You need every administrator to use the same ADMX and ADML files. Where should you copy the files and the language folders?
      fr: |
        Les administrateurs de **northwind.com** modifient les GPO depuis plusieurs stations de travail, et l'Éditeur de gestion des stratégies de groupe affiche des paramètres de modèles d'administration différents selon la station.

        Vous devez faire en sorte que tous les administrateurs utilisent les mêmes fichiers ADMX et ADML. Où devez-vous copier les fichiers et les dossiers de langue ?
    body:
      options:
        - { id: a, text: "`\\\\northwind.com\\SYSVOL\\northwind.com\\StarterGPOs`" }
        - { id: b, text: "`\\\\northwind.com\\NETLOGON\\PolicyDefinitions`" }
        - { id: c, text: { en: "`C:\\Windows\\PolicyDefinitions` on each domain controller", fr: "`C:\\Windows\\PolicyDefinitions` sur chaque contrôleur de domaine" } }
        - { id: d, text: "`\\\\northwind.com\\SYSVOL\\northwind.com\\Policies\\PolicyDefinitions`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The central store is the `PolicyDefinitions` folder under `Policies` in SYSVOL. When it exists, the Group Policy tools use the ADMX files it contains, and the ADML files of each language go in a subfolder such as `en-US`. Its content is replicated to all the domain controllers of the domain.
        fr: |
          Le magasin central est le dossier `PolicyDefinitions` situé sous `Policies` dans SYSVOL. Quand il existe, les outils de stratégie de groupe utilisent les fichiers ADMX qu'il contient, et les fichiers ADML de chaque langue vont dans un sous-dossier comme `en-US`. Son contenu est répliqué vers tous les contrôleurs de domaine du domaine.
      options:
        a: { en: "The StarterGPOs folder holds the starter GPOs used as templates for new GPOs, not the Administrative Templates files read by the editor.", fr: "Le dossier StarterGPOs contient les GPO de démarrage servant de modèles pour les nouveaux GPO, pas les fichiers de modèles d'administration lus par l'éditeur." }
        b: { en: "The Group Policy tools don't look for ADMX files in the NETLOGON share.", fr: "Les outils de stratégie de groupe ne cherchent pas les fichiers ADMX dans le partage NETLOGON." }
        c: { en: "The local PolicyDefinitions folder is read on the computer where the editor runs, here the workstations; updating it on the DCs doesn't change what administrators see.", fr: "Le dossier PolicyDefinitions local est lu sur l'ordinateur où s'exécute l'éditeur, ici les stations de travail ; le mettre à jour sur les DC ne change pas ce que voient les administrateurs." }
    references:
      - title: Create and Manage Central Store - Windows Client
        url: https://learn.microsoft.com/en-us/troubleshoot/windows-client/group-policy/create-and-manage-central-store

  # ------------------------------------------------------------------ 4
  - id: az802-qz-14-04
    objective: "1.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        On the member servers of **northwind.com**, the local Administrators group contains different accounts on each server, and these accounts must be kept.

        You need to add the domain group **NW\G-SrvAdmins** to the local Administrators group of every server of the **Servers** OU, by using a GPO linked to that OU. What should you configure in the GPO?
      fr: |
        Sur les serveurs membres de **northwind.com**, le groupe Administrateurs local contient des comptes différents sur chaque serveur, et ces comptes doivent être conservés.

        Vous devez ajouter le groupe de domaine **NW\G-SrvAdmins** au groupe Administrateurs local de chaque serveur de l'UO **Servers**, à l'aide d'un GPO lié à cette UO. Que devez-vous configurer dans le GPO ?
    body:
      options:
        - { id: a, text: { en: "A Local Group item for Administrators (built-in), action Update, with G-SrvAdmins added and Delete all member groups selected", fr: "Un élément Local Group pour Administrators (built-in), action Update, avec G-SrvAdmins ajouté et Delete all member groups sélectionné" } }
        - { id: b, text: { en: "A Local Group item for Administrators (built-in), action Update, with G-SrvAdmins added as a member", fr: "Un élément Local Group pour Administrators (built-in), action Update, avec G-SrvAdmins ajouté comme membre" } }
        - { id: c, text: { en: "A Restricted Groups policy for Administrators, with G-SrvAdmins as the only entry of Members of this group", fr: "Une stratégie Restricted Groups pour Administrators, avec G-SrvAdmins comme seule entrée de Members of this group" } }
        - { id: d, text: { en: "A Local Group item for Administrators (built-in), action Delete, followed by an item that recreates the group with G-SrvAdmins", fr: "Un élément Local Group pour Administrators (built-in), action Delete, suivi d'un élément qui recrée le groupe avec G-SrvAdmins" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The Update action modifies only the settings defined in the preference item: G-SrvAdmins is added with **Add to this group**, and the other members of the local group stay as they were. Local Users and Groups is the preference extension built for this per-member change.
        fr: |
          L'action Update ne modifie que les paramètres définis dans l'élément de préférence : G-SrvAdmins est ajouté avec **Add to this group**, et les autres membres du groupe local restent tels qu'ils étaient. Local Users and Groups est l'extension de préférence conçue pour ce changement membre par membre.
      options:
        a: { en: "Delete all member groups removes every group that is a member of the local group before the item adds its own members, so the existing groups are lost.", fr: "Delete all member groups retire tous les groupes membres du groupe local avant que l'élément n'ajoute ses propres membres : les groupes existants sont perdus." }
        c: { en: "Members of this group in Restricted Groups replaces the whole membership of the group with the listed accounts, so the existing members are removed.", fr: "Members of this group dans Restricted Groups remplace toute l'appartenance du groupe par les comptes listés : les membres existants sont retirés." }
        d: { en: "Deleting the built-in Administrators group isn't a way to add a member, and recreating a group with only G-SrvAdmins wouldn't keep the existing accounts.", fr: "Supprimer le groupe Administrateurs intégré n'est pas une façon d'ajouter un membre, et recréer un groupe avec le seul G-SrvAdmins ne conserverait pas les comptes existants." }
    references:
      - title: Configure a Local Group Item
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc732525(v=ws.10)

  # ------------------------------------------------------------------ 5
  - id: az802-qz-14-05
    objective: "1.4.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        In the **northwind.com** domain, you edit three GPOs on Monday at 10:00. The refresh settings of Group Policy are at their defaults. Nobody runs `gpupdate`, and no computer restarts or signs out.

        | GPO | Linked to | Change |
        | --- | --- | --- |
        | Srv-Settings | Servers OU | New Administrative Templates computer setting |
        | Srv-Software | Servers OU | New application assigned to computers (software installation) |
        | DC-Settings | Domain Controllers OU | New security option for the domain controllers |

        **SRV1** is a member server in the Servers OU, and **DC1** is a domain controller.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Dans le domaine **northwind.com**, vous modifiez trois GPO le lundi à 10 h 00. Les paramètres d'actualisation de la stratégie de groupe sont à leurs valeurs par défaut. Personne n'exécute `gpupdate`, et aucun ordinateur ne redémarre ni ne ferme de session.

        | GPO | Lié à | Modification |
        | --- | --- | --- |
        | Srv-Settings | UO Servers | Nouveau paramètre ordinateur de modèles d'administration |
        | Srv-Software | UO Servers | Nouvelle application attribuée aux ordinateurs (installation de logiciels) |
        | DC-Settings | UO Domain Controllers | Nouvelle option de sécurité pour les contrôleurs de domaine |

        **SRV1** est un serveur membre de l'UO Servers, et **DC1** est un contrôleur de domaine.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "SRV1 can wait up to 120 minutes for the background refresh that applies the new setting of Srv-Settings.", fr: "SRV1 peut attendre jusqu'à 120 minutes l'actualisation en arrière-plan qui applique le nouveau paramètre de Srv-Settings." }
        - id: s2
          text: { en: "SRV1 installs the application assigned by Srv-Software at its next background refresh.", fr: "SRV1 installe l'application attribuée par Srv-Software lors de sa prochaine actualisation en arrière-plan." }
        - id: s3
          text: { en: "DC1 checks for the change to DC-Settings about every five minutes.", fr: "DC1 recherche la modification de DC-Settings environ toutes les cinq minutes." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Member servers and clients refresh Group Policy in the background every 90 minutes, with a random offset of up to 30 minutes, so SRV1 can wait up to 120 minutes. Domain controllers check for computer policy changes every five minutes. Software installation is processed only when the computer starts (or the user signs in), never during a background refresh.
        fr: |
          Les serveurs membres et les clients actualisent la stratégie de groupe en arrière-plan toutes les 90 minutes, avec un décalage aléatoire de 30 minutes au plus : SRV1 peut donc attendre jusqu'à 120 minutes. Les contrôleurs de domaine recherchent les modifications de la stratégie ordinateur toutes les cinq minutes. L'installation de logiciels n'est traitée qu'au démarrage de l'ordinateur (ou à l'ouverture de session de l'utilisateur), jamais lors d'une actualisation en arrière-plan.
      options:
        s2: { en: "The application is installed at the next startup of SRV1; a background refresh doesn't process software installation.", fr: "L'application est installée au prochain démarrage de SRV1 ; une actualisation en arrière-plan ne traite pas l'installation de logiciels." }
    references:
      - title: Group Policy processing for Windows
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-processing

  # ------------------------------------------------------------------ 6
  - id: az802-qz-14-06
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        The domain functional level of **northwind.com** is Windows Server 2016. The Default Domain Policy sets a minimum password length of 8 characters.

        The user accounts of the members of the global security group **G-Admins** are in the **IT** OU. Their passwords must contain at least 15 characters, while all the other users keep the 8-character minimum. An administrator created the GPO **IT-Passwords**, which sets a minimum password length of 15 characters, and linked it to the IT OU. However, the members of G-Admins can still set 10-character passwords.

        You need to enforce the 15-character minimum for the members of G-Admins only. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Le niveau fonctionnel du domaine **northwind.com** est Windows Server 2016. La Default Domain Policy définit une longueur minimale de mot de passe de 8 caractères.

        Les comptes d'utilisateur des membres du groupe de sécurité global **G-Admins** se trouvent dans l'UO **IT**. Leurs mots de passe doivent contenir au moins 15 caractères, tandis que tous les autres utilisateurs conservent le minimum de 8 caractères. Un administrateur a créé le GPO **IT-Passwords**, qui définit une longueur minimale de mot de passe de 15 caractères, et l'a lié à l'UO IT. Pourtant, les membres de G-Admins peuvent toujours définir des mots de passe de 10 caractères.

        Vous devez imposer le minimum de 15 caractères aux seuls membres de G-Admins. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set the link of IT-Passwords on the IT OU to Enforced.", fr: "Rendre Appliqué (Enforced) le lien d'IT-Passwords sur l'UO IT." } }
        - { id: b, text: { en: "Create a fine-grained password policy with a 15-character minimum, and apply it to the IT OU.", fr: "Créer une stratégie de mot de passe affinée avec un minimum de 15 caractères, et l'appliquer à l'UO IT." } }
        - { id: c, text: { en: "Set the minimum password length of the Default Domain Policy to 15 characters.", fr: "Définir la longueur minimale du mot de passe de la Default Domain Policy sur 15 caractères." } }
        - { id: d, text: { en: "Create a fine-grained password policy with a 15-character minimum, and apply it to G-Admins.", fr: "Créer une stratégie de mot de passe affinée avec un minimum de 15 caractères, et l'appliquer à G-Admins." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Password settings for domain accounts come only from the policy applied at the domain level; in a GPO linked to an OU, they affect the local accounts of the computers in that OU, which is why IT-Passwords has no effect on the domain users. Different password rules for some domain users require a fine-grained password policy (a password settings object), which applies to user objects and global security groups such as G-Admins.
        fr: |
          Les paramètres de mot de passe des comptes du domaine ne viennent que de la stratégie appliquée au niveau du domaine ; dans un GPO lié à une UO, ils concernent les comptes locaux des ordinateurs de cette UO, ce qui explique qu'IT-Passwords n'ait aucun effet sur les utilisateurs du domaine. Des règles de mot de passe différentes pour certains utilisateurs du domaine exigent une stratégie de mot de passe affinée (un objet de paramètres de mot de passe), qui s'applique à des objets utilisateur et à des groupes de sécurité globaux comme G-Admins.
      options:
        a: { en: "Enforced only changes precedence between GPOs; the password settings of an OU-linked GPO still don't apply to domain accounts.", fr: "Appliqué ne change que la priorité entre GPO ; les paramètres de mot de passe d'un GPO lié à une UO ne s'appliquent toujours pas aux comptes du domaine." }
        b: { en: "A fine-grained password policy can't be applied to an OU directly, only to users and global security groups (an OU can be covered through a shadow group).", fr: "Une stratégie de mot de passe affinée ne peut pas être appliquée directement à une UO, seulement à des utilisateurs et à des groupes de sécurité globaux (une UO peut être couverte par un groupe fantôme)." }
        c: { en: "The Default Domain Policy applies to every domain account, so all users would need 15 characters.", fr: "La Default Domain Policy s'applique à tous les comptes du domaine : tous les utilisateurs devraient alors utiliser 15 caractères." }
    references:
      - title: Password Policy - Windows 10
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/password-policy

  # ------------------------------------------------------------------ 7
  - id: az802-qz-14-07
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        In the **northwind.com** domain, you must make two temporary changes to Group Policy:

        - **Kiosk-Config** is linked to the **Lobby**, **Library** and **Lab** OUs. For a test, it must stop applying to the computers of Lab only. The links to Lobby and Library must keep working, and the Lab link must be easy to reactivate later.
        - **Desktop-Std** is linked to the domain and contains both computer and user settings. Its computer settings must stop applying everywhere, while its user settings keep applying. All the settings must stay in the GPO for later use.

        What should you configure for each GPO? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Dans le domaine **northwind.com**, vous devez apporter deux modifications temporaires à la stratégie de groupe :

        - **Kiosk-Config** est lié aux UO **Lobby**, **Library** et **Lab**. Pour un test, il doit cesser de s'appliquer aux seuls ordinateurs de Lab. Les liens vers Lobby et Library doivent continuer à fonctionner, et le lien vers Lab doit pouvoir être réactivé facilement plus tard.
        - **Desktop-Std** est lié au domaine et contient des paramètres ordinateur et utilisateur. Ses paramètres ordinateur doivent cesser de s'appliquer partout, tandis que ses paramètres utilisateur continuent de s'appliquer. Tous les paramètres doivent rester dans le GPO pour un usage ultérieur.

        Que devez-vous configurer pour chaque GPO ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Kiosk-Config: [[kiosk]]

          Desktop-Std: [[desk]]
        fr: |
          Kiosk-Config : [[kiosk]]

          Desktop-Std : [[desk]]
      slots:
        - id: kiosk
          options:
            - { id: block, text: { en: "Enable Block Inheritance on the Lab OU", fr: "Activer Bloquer l'héritage sur l'UO Lab" } }
            - { id: link, text: { en: "Clear Link Enabled on the link to the Lab OU", fr: "Décocher Lien activé sur le lien vers l'UO Lab" } }
            - { id: alloff, text: { en: "Set the GPO status so that all its settings are disabled", fr: "Définir l'état du GPO pour que tous ses paramètres soient désactivés" } }
            - { id: compoff, text: { en: "Set the GPO status to Computer configuration settings disabled", fr: "Définir l'état du GPO sur Paramètres de configuration ordinateur désactivés" } }
        - id: desk
          options:
            - { id: useroff, text: { en: "Set the GPO status to User configuration settings disabled", fr: "Définir l'état du GPO sur Paramètres de configuration utilisateur désactivés" } }
            - { id: domlink, text: { en: "Clear Link Enabled on the link to the domain", fr: "Décocher Lien activé sur le lien vers le domaine" } }
            - { id: compoff, text: { en: "Set the GPO status to Computer configuration settings disabled", fr: "Définir l'état du GPO sur Paramètres de configuration ordinateur désactivés" } }
            - { id: loop, text: { en: "Enable loopback processing in Replace mode in the GPO", fr: "Activer le bouclage en mode Replace dans le GPO" } }
    answer:
      values: { kiosk: link, desk: compoff }
    explanation:
      correct:
        en: |
          Disabling one link stops the Group Policy service from considering the GPO for the objects under that container only: the GPO and its other links are untouched, and the link can be re-enabled. The GPO status acts on the GPO itself, everywhere it is linked; **Computer configuration settings disabled** turns off the computer half and keeps the user half and all the settings.
        fr: |
          Désactiver un lien empêche le service de stratégie de groupe de prendre en compte le GPO pour les seuls objets situés sous ce conteneur : le GPO et ses autres liens restent intacts, et le lien peut être réactivé. L'état du GPO agit sur le GPO lui-même, partout où il est lié ; **Paramètres de configuration ordinateur désactivés** désactive la moitié ordinateur et conserve la moitié utilisateur et tous les paramètres.
      options:
        block: { en: "Block Inheritance stops GPOs linked to parent containers; Kiosk-Config is linked to Lab itself, so it would keep applying.", fr: "Bloquer l'héritage arrête les GPO liés aux conteneurs parents ; Kiosk-Config est lié à Lab lui-même, il continuerait donc de s'appliquer." }
        alloff: { en: "The GPO status applies to every link, so Lobby and Library would lose Kiosk-Config too.", fr: "L'état du GPO s'applique à tous les liens : Lobby et Library perdraient aussi Kiosk-Config." }
        domlink: { en: "Disabling the domain link would stop the user settings too.", fr: "Désactiver le lien vers le domaine arrêterait aussi les paramètres utilisateur." }
        loop: { en: "Loopback changes which user settings apply on the computers it targets; it doesn't turn off the computer settings of the GPO.", fr: "Le bouclage change les paramètres utilisateur qui s'appliquent sur les ordinateurs ciblés ; il ne désactive pas les paramètres ordinateur du GPO." }
    references:
      - title: Group Policy Management Console in Windows
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-management-console
      - title: Group Policy scope in Windows
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-scope

  # ------------------------------------------------------------------ 8
  - id: az802-qz-14-08
    objective: "1.4.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        The GPO **App-Files** is linked to the **Staff** OU of **northwind.com**, which contains user accounts. Its User Configuration contains three Files preference items, processed in this order:

        1. Copy `\\FS1\Templates$\app.ini` to `%AppData%\Northwind\app.ini`.
        2. Copy a macro file that works only if app.ini is present.
        3. Copy a second file that also depends on app.ini.

        The Templates$ share grants access only to the group **G-Staff**, which contains the users; computer accounts have no access to it. The items use their default common options. Users report that app.ini is never copied.

        You need item 1 to copy app.ini. If item 1 still fails for a user, items 2 and 3 must not be processed for that user.

        Which two settings should you configure on item 1? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le GPO **App-Files** est lié à l'UO **Staff** de **northwind.com**, qui contient des comptes d'utilisateur. Sa Configuration utilisateur contient trois éléments de préférence Files, traités dans cet ordre :

        1. Copier `\\FS1\Templates$\app.ini` vers `%AppData%\Northwind\app.ini`.
        2. Copier un fichier de macros qui ne fonctionne que si app.ini est présent.
        3. Copier un second fichier qui dépend lui aussi d'app.ini.

        Le partage Templates$ n'accorde l'accès qu'au groupe **G-Staff**, qui contient les utilisateurs ; les comptes d'ordinateur n'y ont pas accès. Les éléments utilisent leurs options communes par défaut. Les utilisateurs signalent qu'app.ini n'est jamais copié.

        Vous devez faire en sorte que l'élément 1 copie app.ini. Si l'élément 1 échoue encore pour un utilisateur, les éléments 2 et 3 ne doivent pas être traités pour cet utilisateur.

        Quels sont les deux paramètres à configurer sur l'élément 1 ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: "Apply once and do not reapply" }
        - { id: b, text: "Run in logged-on user's security context" }
        - { id: c, text: { en: "Item-level targeting with a Security Group item for G-Staff", fr: "Item-level targeting avec un élément Security Group pour G-Staff" } }
        - { id: d, text: "Stop processing items in this extension if an error occurs on this item" }
        - { id: e, text: "Remove this item when it is no longer applied" }
      choose: 2
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          By default, user preference items are processed under the SYSTEM account, which accesses the network as the computer account and is refused by Templates$. **Run in logged-on user's security context** makes the item use the permissions of the signed-in user, a member of G-Staff. **Stop processing items in this extension if an error occurs on this item** skips the items listed after the failed one in the same extension and GPO, here items 2 and 3.
        fr: |
          Par défaut, les éléments de préférence utilisateur sont traités sous le compte SYSTEM, qui accède au réseau avec le compte d'ordinateur et se voit refuser Templates$. **Run in logged-on user's security context** fait utiliser à l'élément les autorisations de l'utilisateur connecté, membre de G-Staff. **Stop processing items in this extension if an error occurs on this item** ignore les éléments placés après l'élément en échec dans la même extension et le même GPO, ici les éléments 2 et 3.
      options:
        a: { en: "Apply once only stops later reapplication; the first copy would still run as SYSTEM and fail.", fr: "Apply once empêche seulement les réapplications suivantes ; la première copie s'exécuterait toujours sous SYSTEM et échouerait." }
        c: { en: "Item-level targeting decides for which users the item is processed, not the security context in which it runs.", fr: "Le ciblage au niveau de l'élément décide pour quels utilisateurs l'élément est traité, pas le contexte de sécurité dans lequel il s'exécute." }
        e: { en: "This option sets the action to Replace and removes the file when the GPO goes out of scope; it neither fixes access nor stops the next items.", fr: "Cette option impose l'action Replace et supprime le fichier quand le GPO sort de l'étendue ; elle ne corrige pas l'accès et n'arrête pas les éléments suivants." }
    references:
      - title: Group Policy preferences in Windows
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-preferences

  # ------------------------------------------------------------------ 9
  - id: az802-qz-14-09
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        In the **northwind.com** domain, the Remote Desktop session hosts **RDS1** and **RDS2** are in the **RDS-Hosts** OU, the user accounts are in the **Staff** OU, and the users' workstations are in the **Workstations** OU. Security filtering is at its default on all the GPOs.

        | GPO | Linked to | Content |
        | --- | --- | --- |
        | Dom-User | northwind.com | User settings |
        | Staff-Std | Staff OU | User settings |
        | RDS-User | RDS-Hosts OU | User settings |
        | RDS-Loop | RDS-Hosts OU | Configure user Group Policy loopback processing mode: Enabled, mode Replace |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Dans le domaine **northwind.com**, les hôtes de session Bureau à distance **RDS1** et **RDS2** se trouvent dans l'UO **RDS-Hosts**, les comptes d'utilisateur dans l'UO **Staff**, et les stations de travail des utilisateurs dans l'UO **Workstations**. Le filtrage de sécurité est à sa valeur par défaut sur tous les GPO.

        | GPO | Lié à | Contenu |
        | --- | --- | --- |
        | Dom-User | northwind.com | Paramètres utilisateur |
        | Staff-Std | UO Staff | Paramètres utilisateur |
        | RDS-User | UO RDS-Hosts | Paramètres utilisateur |
        | RDS-Loop | UO RDS-Hosts | Configure user Group Policy loopback processing mode : activé, mode Replace |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "When a user of the Staff OU signs in to RDS1, the user receives the settings of Staff-Std.", fr: "Quand un utilisateur de l'UO Staff se connecte à RDS1, il reçoit les paramètres de Staff-Std." }
        - id: s2
          text: { en: "When a user of the Staff OU signs in to RDS1, the user receives the settings of Dom-User.", fr: "Quand un utilisateur de l'UO Staff se connecte à RDS1, il reçoit les paramètres de Dom-User." }
        - id: s3
          text: { en: "When a user of the Staff OU signs in to a workstation of the Workstations OU, the user receives the settings of RDS-User.", fr: "Quand un utilisateur de l'UO Staff se connecte à une station de travail de l'UO Workstations, il reçoit les paramètres de RDS-User." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          In Replace mode, the list of GPOs built from the user's location isn't gathered: only the GPOs that apply to the computer's location are used, and their User Configuration is applied. RDS1 receives the GPOs linked to the domain and to RDS-Hosts, so a user signed in to RDS1 gets Dom-User and RDS-User, but not Staff-Std. Loopback is a computer setting of RDS-Loop, which applies only to RDS1 and RDS2, so the workstations keep normal processing.
        fr: |
          En mode Replace, la liste des GPO construite à partir de l'emplacement de l'utilisateur n'est pas collectée : seuls les GPO qui s'appliquent à l'emplacement de l'ordinateur sont utilisés, et leur Configuration utilisateur est appliquée. RDS1 reçoit les GPO liés au domaine et à RDS-Hosts : un utilisateur connecté à RDS1 obtient donc Dom-User et RDS-User, mais pas Staff-Std. Le bouclage est un paramètre ordinateur de RDS-Loop, qui ne s'applique qu'à RDS1 et RDS2 : les stations de travail conservent le traitement normal.
      options:
        s1: { en: "Replace ignores the GPOs of the user's own location; Staff-Std would apply only in Merge mode.", fr: "Replace ignore les GPO de l'emplacement de l'utilisateur ; Staff-Std ne s'appliquerait qu'en mode Merge." }
        s3: { en: "RDS-User is linked to RDS-Hosts, and no loopback applies to the workstations, so their users receive only the GPOs of their own location.", fr: "RDS-User est lié à RDS-Hosts, et aucun bouclage ne s'applique aux stations de travail : leurs utilisateurs ne reçoivent que les GPO de leur propre emplacement." }
    references:
      - title: Loopback processing of Group Policy
        url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/group-policy/loopback-processing-of-group-policy
      - title: Group Policy processing for Windows
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-processing

  # ------------------------------------------------------------------ 10
  - id: az802-qz-14-10
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        In the **northwind.com** domain, the GPO **Srv-Hardening** contains only computer settings and is linked to the **Servers** OU. Its security filtering lists only the group **G-Hardened**, which contains the computer accounts of the hardened servers. The default containers of the domain were never redirected.

        A technician joined the new server **SRV9** to the domain from the System Properties dialog box, and then added SRV9 to G-Hardened without restarting it. On SRV9, `gpresult /scope computer /r` doesn't list Srv-Hardening, even after `gpupdate /force`.

        You need Srv-Hardening to apply to SRV9. The GPO must keep applying only to the members of G-Hardened.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Dans le domaine **northwind.com**, le GPO **Srv-Hardening** ne contient que des paramètres ordinateur et est lié à l'UO **Servers**. Son filtrage de sécurité ne liste que le groupe **G-Hardened**, qui contient les comptes d'ordinateur des serveurs renforcés. Les conteneurs par défaut du domaine n'ont jamais été redirigés.

        Un technicien a joint le nouveau serveur **SRV9** au domaine depuis la boîte de dialogue Propriétés système, puis a ajouté SRV9 à G-Hardened sans le redémarrer. Sur SRV9, `gpresult /scope computer /r` ne liste pas Srv-Hardening, même après `gpupdate /force`.

        Vous devez faire en sorte que Srv-Hardening s'applique à SRV9. Le GPO doit continuer à ne s'appliquer qu'aux membres de G-Hardened.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Move the computer account of SRV9 to the Servers OU.", fr: "Déplacer le compte d'ordinateur de SRV9 vers l'UO Servers." } }
        - { id: b, text: { en: "Link Srv-Hardening to the Computers container of the domain.", fr: "Lier Srv-Hardening au conteneur Computers du domaine." } }
        - { id: c, text: { en: "Set the link of Srv-Hardening on the Servers OU to Enforced.", fr: "Rendre Appliqué (Enforced) le lien de Srv-Hardening sur l'UO Servers." } }
        - { id: d, text: { en: "Grant Authenticated Users Read and Apply group policy on Srv-Hardening.", fr: "Accorder à Authenticated Users Lecture et Appliquer la stratégie de groupe sur Srv-Hardening." } }
        - { id: e, text: { en: "Restart SRV9 so that it applies policy with its new group membership.", fr: "Redémarrer SRV9 pour qu'il applique la stratégie avec sa nouvelle appartenance au groupe." } }
      choose: 2
    answer: { optionIds: [a, e] }
    explanation:
      correct:
        en: |
          A domain join from System Properties creates the computer account in the default Computers container, a CN container to which GPOs can't be linked, so Srv-Hardening isn't in the scope of SRV9: SRV9 must be moved to the Servers OU. Once in scope, the GPO applies only if SRV9 has Read and Apply group policy through G-Hardened, and a computer gets a new ticket with its new group membership only after a restart, which `gpupdate /force` doesn't replace.
        fr: |
          Une jonction au domaine depuis Propriétés système crée le compte d'ordinateur dans le conteneur par défaut Computers, un conteneur CN auquel on ne peut pas lier de GPO : Srv-Hardening n'est donc pas dans l'étendue de SRV9, qui doit être déplacé vers l'UO Servers. Une fois dans l'étendue, le GPO ne s'applique que si SRV9 a Lecture et Appliquer la stratégie de groupe par G-Hardened, et un ordinateur n'obtient un nouveau ticket avec sa nouvelle appartenance aux groupes qu'après un redémarrage, que `gpupdate /force` ne remplace pas.
      options:
        b: { en: "Group Policy can be applied to OUs, domains and sites, not to CN containers such as Computers.", fr: "La stratégie de groupe peut s'appliquer aux UO, aux domaines et aux sites, pas aux conteneurs CN comme Computers." }
        c: { en: "Enforced changes precedence and bypasses Block Inheritance; it neither brings SRV9 into the scope of the OU nor bypasses security filtering.", fr: "Appliqué change la priorité et traverse le blocage de l'héritage ; il ne place pas SRV9 dans l'étendue de l'UO et ne contourne pas le filtrage de sécurité." }
        d: { en: "Granting Apply to Authenticated Users would make the GPO apply to every server of the OU, not only to the members of G-Hardened.", fr: "Accorder Appliquer à Authenticated Users ferait appliquer le GPO à tous les serveurs de l'UO, pas seulement aux membres de G-Hardened." }
    references:
      - title: Redirect users and computers containers
        url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/redirect-users-computers-containers
      - title: Group Policy scope in Windows
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-scope
