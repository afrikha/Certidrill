chapter: 71-monitoring
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-71-01
    objective: "7.1.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A file server named **FS2** runs Windows Server 2025. System Insights runs with its default capabilities and schedules. This morning, 4 TB of data was copied to a volume of FS2.

        You need an updated forecast of the consumption of this volume now, without waiting for the next scheduled run.

        Which command should you run?
      fr: |
        Un serveur de fichiers nommé **FS2** exécute Windows Server 2025. System Insights s'exécute avec ses capacités et ses planifications par défaut. Ce matin, 4 To de données ont été copiés sur un volume de FS2.

        Vous devez obtenir dès maintenant une prévision à jour de la consommation de ce volume, sans attendre la prochaine exécution planifiée.

        Quelle commande devez-vous exécuter ?
    body:
      options:
        - { id: a, text: "`Enable-InsightsCapability -Name \"Volume consumption forecasting\"`" }
        - { id: b, text: "`Invoke-InsightsCapability -Name \"Volume consumption forecasting\"`" }
        - { id: c, text: "`Get-InsightsCapabilityResult -Name \"Volume consumption forecasting\" -History`" }
        - { id: d, text: "`Enable-InsightsCapabilitySchedule -Name \"Volume consumption forecasting\"`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `Invoke-InsightsCapability` runs a capability on demand, outside its schedule, and produces a new prediction. By default, each default capability runs every day at 3:00 AM, so without an on-demand run the forecast would reflect the new data only after the next night.
        fr: |
          `Invoke-InsightsCapability` exécute une capacité à la demande, en dehors de sa planification, et produit une nouvelle prédiction. Par défaut, chaque capacité par défaut s'exécute tous les jours à 3 h 00 : sans exécution à la demande, la prévision ne refléterait les nouvelles données qu'après la nuit suivante.
      options:
        a: { en: "The default capabilities are already enabled; enabling a capability doesn't run a prediction now.", fr: "Les capacités par défaut sont déjà activées ; activer une capacité n'exécute pas de prédiction immédiatement." }
        c: { en: "This command lists the previous results of the capability; it doesn't compute a new forecast.", fr: "Cette commande liste les résultats précédents de la capacité ; elle ne calcule pas de nouvelle prévision." }
        d: { en: "This command turns on the periodic schedule, which is already enabled by default; it doesn't run the capability now.", fr: "Cette commande active la planification périodique, déjà activée par défaut ; elle n'exécute pas la capacité immédiatement." }
    references:
      - title: Manage System Insights capabilities in Windows Admin Center
        url: https://learn.microsoft.com/en-us/windows-server/manage/system-insights/managing-capabilities

  # ------------------------------------------------------------------ 2
  - id: az802-qz-71-02
    objective: "7.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Users report that opening files on a file server named **FS5** that runs Windows Server 2022 is slow. You suspect the storage subsystem.

        You need to add a counter to Performance Monitor that measures how long, on average, each read request takes on the disks of FS5.

        Which counter should you add?
      fr: |
        Des utilisateurs signalent que l'ouverture de fichiers sur un serveur de fichiers nommé **FS5** qui exécute Windows Server 2022 est lente. Vous soupçonnez le sous-système de stockage.

        Vous devez ajouter à l'Analyseur de performances un compteur qui mesure la durée moyenne de chaque demande de lecture sur les disques de FS5.

        Quel compteur devez-vous ajouter ?
    body:
      options:
        - { id: a, text: "`\\PhysicalDisk(*)\\Current Disk Queue Length`" }
        - { id: b, text: "`\\PhysicalDisk(*)\\Disk Read Bytes/sec`" }
        - { id: c, text: "`\\PhysicalDisk(*)\\Avg. Disk sec/Read`" }
        - { id: d, text: "`\\PhysicalDisk(*)\\Disk Reads/sec`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `Avg. Disk sec/Read` is the average latency of a read, in seconds. Microsoft's guidance considers values under 15 ms healthy, above 25 ms a warning, and above 50 ms critical, when they last for a minute or more.
        fr: |
          `Avg. Disk sec/Read` est la latence moyenne d'une lecture, en secondes. Les recommandations de Microsoft considèrent comme sains les valeurs inférieures à 15 ms, comme un avertissement au-delà de 25 ms et comme critiques au-delà de 50 ms, quand elles durent une minute ou plus.
      options:
        a: { en: "This counter shows the number of requests waiting at the moment of the sample, not the time each read takes.", fr: "Ce compteur indique le nombre de demandes en attente au moment de l'échantillon, pas la durée de chaque lecture." }
        b: { en: "This counter measures read throughput in bytes per second, not latency.", fr: "Ce compteur mesure le débit de lecture en octets par seconde, pas la latence." }
        d: { en: "This counter measures the number of read operations per second, not how long each one takes.", fr: "Ce compteur mesure le nombre d'opérations de lecture par seconde, pas la durée de chacune." }
    references:
      - title: Troubleshoot performance problems in Windows
        url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/performance/troubleshoot-performance-problems-in-windows

  # ------------------------------------------------------------------ 3
  - id: az802-qz-71-03
    objective: "7.1.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have an Azure subscription named **Sub1** that contains 150 Azure virtual machines that run Windows Server 2022. Several teams create new virtual machines in Sub1 every week. You use VM insights with the logs-based (classic) experience, and a VM insights data collection rule (DCR) named **DCR-VMI** already exists.

        You need VM insights to be enabled on all the existing virtual machines of Sub1 and on every virtual machine created later. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Vous disposez d'un abonnement Azure nommé **Sub1** qui contient 150 machines virtuelles Azure exécutant Windows Server 2022. Plusieurs équipes créent chaque semaine de nouvelles machines virtuelles dans Sub1. Vous utilisez VM Insights avec l'expérience basée sur les journaux (classique), et une règle de collecte de données (DCR) VM Insights nommée **DCR-VMI** existe déjà.

        Vous devez faire en sorte que VM Insights soit activé sur toutes les machines virtuelles existantes de Sub1 et sur chaque machine virtuelle créée ensuite. La solution doit réduire au minimum l'effort d'administration.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Associate DCR-VMI with each existing virtual machine from the Resources page of the DCR.", fr: "Associer DCR-VMI à chaque machine virtuelle existante depuis la page Ressources de la DCR." } }
        - { id: b, text: { en: "Assign the Legacy: Enable Azure Monitor for VMs initiative to Sub1, and then remediate.", fr: "Affecter l'initiative Legacy: Enable Azure Monitor for VMs à Sub1, puis lancer une correction." } }
        - { id: c, text: { en: "Enable VM insights from the Insights page of each virtual machine after it's created.", fr: "Activer VM Insights depuis la page Insights de chaque machine virtuelle après sa création." } }
        - { id: d, text: { en: "Assign the Enable Azure Monitor for VMs with Azure Monitoring Agent (AMA) initiative to Sub1, and then remediate.", fr: "Affecter l'initiative Enable Azure Monitor for VMs with Azure Monitoring Agent (AMA) à Sub1, puis lancer une correction." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The **Enable Azure Monitor for VMs with Azure Monitoring Agent (AMA)** initiative installs the Azure Monitor Agent and configures VM insights data collection on the virtual machines in its scope. Assigned to Sub1, it applies automatically to new virtual machines; existing ones need remediation tasks. These policies cover the logs-based experience used here.
        fr: |
          L'initiative **Enable Azure Monitor for VMs with Azure Monitoring Agent (AMA)** installe l'agent Azure Monitor et configure la collecte de données de VM Insights sur les machines virtuelles de son étendue. Affectée à Sub1, elle s'applique automatiquement aux nouvelles machines virtuelles ; les machines existantes exigent des tâches de correction. Ces stratégies couvrent l'expérience basée sur les journaux utilisée ici.
      options:
        a: { en: "Associating the DCR by hand covers only the existing virtual machines, not those created later, and requires the agent on each one.", fr: "Associer la DCR à la main ne couvre que les machines virtuelles existantes, pas celles créées ensuite, et exige l'agent sur chacune." }
        b: { en: "The legacy initiatives deploy the Log Analytics agent, which is deprecated; Microsoft recommends the AMA initiatives.", fr: "Les initiatives Legacy déploient l'agent Log Analytics, qui est déprécié ; Microsoft recommande les initiatives AMA." }
        c: { en: "Enabling VM insights machine by machine works, but it must be repeated for every new virtual machine, which doesn't minimize effort.", fr: "Activer VM Insights machine par machine fonctionne, mais doit être répété pour chaque nouvelle machine virtuelle, ce qui ne réduit pas l'effort au minimum." }
    references:
      - title: Enable VM insights using Azure Policy
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vminsights-enable-policy

  # ------------------------------------------------------------------ 4
  - id: az802-qz-71-04
    objective: "7.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A server named **APP7** runs Windows Server 2022 and has 8 processors and 16 GB of RAM. During a slowdown that lasted 30 minutes, a data collector set recorded the following average values.

        | Counter | Average value |
        | --- | --- |
        | `\Processor Information(_Total)\% User Time` | 87% |
        | `\Processor Information(_Total)\% Privileged Time` | 7% |
        | `\Processor Information(_Total)\% Idle Time` | 4% |
        | `\Memory\Available MBytes` | 9,800 |
        | `\LogicalDisk(D:)\Avg. Disk sec/Read` | 0.006 (6 ms) |

        Which resource limits the performance of APP7?
      fr: |
        Un serveur nommé **APP7** exécute Windows Server 2022 et dispose de 8 processeurs et de 16 Go de RAM. Pendant un ralentissement qui a duré 30 minutes, un jeu de collecteurs de données a enregistré les valeurs moyennes suivantes.

        | Compteur | Valeur moyenne |
        | --- | --- |
        | `\Processor Information(_Total)\% User Time` | 87 % |
        | `\Processor Information(_Total)\% Privileged Time` | 7 % |
        | `\Processor Information(_Total)\% Idle Time` | 4 % |
        | `\Memory\Available MBytes` | 9 800 |
        | `\LogicalDisk(D:)\Avg. Disk sec/Read` | 0,006 (6 ms) |

        Quelle ressource limite les performances d'APP7 ?
    body:
      options:
        - { id: a, text: { en: "Processor", fr: "Processeur" } }
        - { id: b, text: { en: "Memory", fr: "Mémoire" } }
        - { id: c, text: { en: "Storage", fr: "Stockage" } }
        - { id: d, text: { en: "Network", fr: "Réseau" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A % User Time above 80% and a % Idle Time below 10% are critical values for the processor, and they lasted 30 minutes: the processors spend their time running application code. Memory (about 9.6 GB available out of 16 GB) and disk latency (6 ms, below 15 ms) are healthy.
        fr: |
          Un % User Time supérieur à 80 % et un % Idle Time inférieur à 10 % sont des valeurs critiques pour le processeur, et ils ont duré 30 minutes : les processeurs passent leur temps à exécuter du code applicatif. La mémoire (environ 9,6 Go disponibles sur 16 Go) et la latence des disques (6 ms, sous 15 ms) sont saines.
      options:
        b: { en: "More than 4 GB and more than 10% of the RAM is available, which Microsoft's guidance considers healthy.", fr: "Plus de 4 Go et plus de 10 % de la RAM sont disponibles, ce que les recommandations de Microsoft considèrent comme sain." }
        c: { en: "A read latency of 6 ms is below the 15 ms healthy threshold.", fr: "Une latence de lecture de 6 ms est inférieure au seuil sain de 15 ms." }
        d: { en: "No network counter shows a problem, while the processor counters are critical.", fr: "Aucun compteur réseau ne signale de problème, alors que les compteurs du processeur sont critiques." }
    references:
      - title: Troubleshoot performance problems in Windows
        url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/performance/troubleshoot-performance-problems-in-windows

  # ------------------------------------------------------------------ 5
  - id: az802-qz-71-05
    objective: "7.1.7"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have an Azure subscription that contains Azure virtual machines that run Windows Server 2025. You created a metric alert rule with a static threshold on the Percentage CPU metric of the virtual machines and an action group that sends an email. The rule keeps its default settings.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un abonnement Azure qui contient des machines virtuelles Azure exécutant Windows Server 2025. Vous avez créé une règle d'alerte de métrique avec un seuil statique sur la métrique Percentage CPU des machines virtuelles, et un groupe d'actions qui envoie un e-mail. La règle conserve ses paramètres par défaut.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "After the alert fires, it's resolved automatically when the condition isn't met for three consecutive checks."
            fr: "Une fois l'alerte déclenchée, elle est résolue automatiquement quand la condition n'est pas remplie pendant trois vérifications consécutives."
        - id: s2
          text:
            en: "When the alert is resolved, Azure Monitor changes its user response from New to Closed."
            fr: "Quand l'alerte est résolue, Azure Monitor change sa réponse utilisateur de New à Closed."
        - id: s3
          text:
            en: "The fired alerts remain available in the Azure portal for 90 days."
            fr: "Les alertes déclenchées restent disponibles dans le portail Azure pendant 90 jours."
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Metric alerts are stateful by default: a fired alert doesn't fire again until it's resolved, which happens when the condition isn't met for three consecutive checks; a resolved notification is then sent. The user response (New, Acknowledged, Closed) is set by users only and never changes automatically. Alerts are stored for 30 days, then deleted.
        fr: |
          Les alertes de métrique sont avec état par défaut : une alerte déclenchée ne se déclenche plus avant d'être résolue, ce qui se produit quand la condition n'est pas remplie pendant trois vérifications consécutives ; une notification de résolution est alors envoyée. La réponse utilisateur (New, Acknowledged, Closed) n'est définie que par les utilisateurs et ne change jamais automatiquement. Les alertes sont stockées 30 jours, puis supprimées.
      options:
        s2: { en: "The resolution changes the monitor condition to Resolved; the user response stays as the user set it.", fr: "La résolution fait passer la condition de surveillance à Resolved ; la réponse utilisateur reste celle que l'utilisateur a définie." }
        s3: { en: "Alerts are kept for 30 days, not 90.", fr: "Les alertes sont conservées 30 jours, pas 90." }
    references:
      - title: Overview of Azure Monitor alerts
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-overview

  # ------------------------------------------------------------------ 6
  - id: az802-qz-71-06
    objective: "7.1.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Fabrikam administers a file and application server named **SRV3**, which runs Windows Server 2022, through a Windows Admin Center gateway. The gateway is already registered with Azure, and Fabrikam has an Azure subscription. The operations team wants to handle four monitoring and troubleshooting tasks on SRV3 without leaving Windows Admin Center.

        Which Windows Admin Center tool meets each need? To answer, drag a tool onto each task. Each tool may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam administre un serveur de fichiers et d'applications nommé **SRV3**, qui exécute Windows Server 2022, par une passerelle Windows Admin Center. La passerelle est déjà inscrite auprès d'Azure, et Fabrikam dispose d'un abonnement Azure. L'équipe d'exploitation veut traiter quatre tâches de supervision et de dépannage sur SRV3 sans quitter Windows Admin Center.

        Quel outil de Windows Admin Center répond à chaque besoin ? Pour répondre, faites glisser un outil sur chaque tâche. Chaque outil peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      items:
        - { id: overview, text: { en: "Overview", fr: "Vue d'ensemble" } }
        - { id: events, text: { en: "Events", fr: "Événements" } }
        - { id: perfmon, text: { en: "Performance Monitor", fr: "Analyseur de performances" } }
        - { id: processes, text: { en: "Processes", fr: "Processus" } }
        - { id: insights, text: System Insights }
        - { id: azmon, text: Azure Monitor }
      targets:
        - { id: t1, text: { en: "Find which process holds a handle on the file D:\\Data\\report.xlsx, which can't be deleted.", fr: "Trouver quel processus détient un handle sur le fichier D:\\Data\\report.xlsx, qui ne peut pas être supprimé." } }
        - { id: t2, text: { en: "Display % Processor Time together with Processor Queue Length of SRV3 in real time.", fr: "Afficher en temps réel % Processor Time avec Processor Queue Length de SRV3." } }
        - { id: t3, text: { en: "Forecast, on SRV3 itself, when the total storage of SRV3 will exceed its capacity.", fr: "Prévoir, sur SRV3 lui-même, quand le stockage total de SRV3 dépassera sa capacité." } }
        - { id: t4, text: { en: "Send an email to the operations team when the available memory of SRV3 stays low.", fr: "Envoyer un e-mail à l'équipe d'exploitation quand la mémoire disponible de SRV3 reste faible." } }
      reuse: false
    answer:
      mapping: { t1: processes, t2: perfmon, t3: insights, t4: azmon }
    explanation:
      correct:
        en: |
          **Processes** lists running processes, creates process dumps and finds process handles. **Performance Monitor** displays any performance counters, such as the processor queue length. **System Insights** runs predictive analytics locally, including total storage consumption forecasting (Windows Server 2019 or later). Windows Admin Center has no alerting engine of its own: email alerts come from **Azure Monitor**, which the tool of the same name connects the server to.
        fr: |
          **Processus** liste les processus en cours, crée des images mémoire de processus et trouve les handles de processus. **Analyseur de performances** affiche n'importe quels compteurs de performance, comme la longueur de la file d'attente du processeur. **System Insights** exécute des analyses prédictives en local, dont la prévision de la consommation totale du stockage (Windows Server 2019 ou version ultérieure). Windows Admin Center n'a pas de moteur d'alertes propre : les alertes par e-mail viennent d'**Azure Monitor**, auquel l'outil du même nom connecte le serveur.
      options:
        overview: { en: "Overview shows only the current CPU, memory and network activity; it can't display the processor queue length or send alerts.", fr: "Vue d'ensemble n'affiche que l'activité actuelle du processeur, de la mémoire et du réseau ; elle ne peut ni afficher la file d'attente du processeur ni envoyer d'alertes." }
        events: { en: "Events browses, searches, clears and exports event logs; it doesn't find file handles or send email.", fr: "Événements parcourt, recherche, efface et exporte les journaux des événements ; il ne trouve pas les handles de fichier et n'envoie pas d'e-mail." }
    references:
      - title: Manage Servers with Windows Admin Center
        url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/use/manage-servers

  # ------------------------------------------------------------------ 7
  - id: az802-qz-71-07
    objective: "7.1.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        You have an Azure subscription named **Sub1**. Several teams have created 60 alert rules in Sub1, of all types, each with the team's own action groups. A resource group named **RG-Prod** contains the production servers. An action group named **AG-OnCall** calls the webhook of the on-call service.

        You need every alert of severity **Sev0** fired on a resource of RG-Prod to also trigger AG-OnCall. The teams must not have to modify their alert rules, and the solution must minimize administrative effort.

        What should you do?
      fr: |
        Vous disposez d'un abonnement Azure nommé **Sub1**. Plusieurs équipes ont créé 60 règles d'alerte de tous types dans Sub1, chacune avec les groupes d'actions de l'équipe. Un groupe de ressources nommé **RG-Prod** contient les serveurs de production. Un groupe d'actions nommé **AG-OnCall** appelle le webhook du service d'astreinte.

        Vous devez faire en sorte que chaque alerte de gravité **Sev0** déclenchée sur une ressource de RG-Prod déclenche aussi AG-OnCall. Les équipes ne doivent pas avoir à modifier leurs règles d'alerte, et la solution doit réduire au minimum l'effort d'administration.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add AG-OnCall to each Sev0 alert rule whose scope includes RG-Prod.", fr: "Ajouter AG-OnCall à chaque règle d'alerte Sev0 dont l'étendue inclut RG-Prod." } }
        - { id: b, text: { en: "Create an alert processing rule on RG-Prod, filtered on Sev0, that applies AG-OnCall.", fr: "Créer une règle de traitement des alertes sur RG-Prod, filtrée sur Sev0, qui applique AG-OnCall." } }
        - { id: c, text: { en: "Create an activity log alert rule on RG-Prod, with severity Sev0, that uses AG-OnCall.", fr: "Créer une règle d'alerte de journal d'activité sur RG-Prod, de gravité Sev0, qui utilise AG-OnCall." } }
        - { id: d, text: { en: "Create a metric alert rule on RG-Prod, with severity Sev0, that uses AG-OnCall.", fr: "Créer une règle d'alerte de métrique sur RG-Prod, de gravité Sev0, qui utilise AG-OnCall." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          An alert processing rule changes fired alerts without changing the alert rules. Its **Apply action groups** action adds action groups to the alerts that match its scope (here RG-Prod) and its filters, which include **Severity**. One rule therefore covers the alerts of all 60 rules, current and future, that fire on RG-Prod with Sev0.
        fr: |
          Une règle de traitement des alertes modifie les alertes déclenchées sans modifier les règles d'alerte. Son action **Apply action groups** ajoute des groupes d'actions aux alertes qui correspondent à son étendue (ici RG-Prod) et à ses filtres, dont **Severity**. Une seule règle couvre donc les alertes des 60 règles, actuelles et futures, qui se déclenchent sur RG-Prod en Sev0.
      options:
        a: { en: "Editing the alert rules is forbidden by the requirements, and every new rule would have to be edited too.", fr: "Les exigences interdisent de modifier les règles d'alerte, et chaque nouvelle règle devrait aussi être modifiée." }
        c: { en: "An activity log alert fires on control plane events; it doesn't react to the alerts fired by the other rules.", fr: "Une alerte de journal d'activité se déclenche sur des événements du plan de contrôle ; elle ne réagit pas aux alertes déclenchées par les autres règles." }
        d: { en: "A new metric alert evaluates its own condition; it doesn't add AG-OnCall to the alerts fired by the existing rules.", fr: "Une nouvelle alerte de métrique évalue sa propre condition ; elle n'ajoute pas AG-OnCall aux alertes déclenchées par les règles existantes." }
    references:
      - title: Alert processing rules for Azure Monitor alerts
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-processing-rules

  # ------------------------------------------------------------------ 8
  - id: az802-qz-71-08
    objective: "7.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        A server named **SRV6** runs Windows Server 2025. A user-defined data collector set named **PerfDaily** records performance counters continuously in `D:\PerfLogs\PerfDaily`, in a new subfolder every day. Other applications store data on volume D.

        You need to meet the following requirements:

        - The data of PerfDaily must never use more than 5 GB in total.
        - When the limit is reached, the oldest data must be deleted first.
        - The deletion must happen before PerfDaily creates its next log file.

        How should you configure the Data Manager of PerfDaily? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un serveur nommé **SRV6** exécute Windows Server 2025. Un jeu de collecteurs de données défini par l'utilisateur nommé **PerfDaily** enregistre en continu des compteurs de performance dans `D:\PerfLogs\PerfDaily`, dans un nouveau sous-dossier chaque jour. D'autres applications stockent des données sur le volume D.

        Vous devez satisfaire aux exigences suivantes :

        - Les données de PerfDaily ne doivent jamais occuper plus de 5 Go au total.
        - Quand la limite est atteinte, les données les plus anciennes doivent être supprimées en premier.
        - La suppression doit avoir lieu avant que PerfDaily crée son prochain fichier journal.

        Comment devez-vous configurer le Gestionnaire de données (Data Manager) de PerfDaily ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Limit to set to 5 GB: [[limit]]

          Resource policy: [[policy]]

          Apply policy before the data collector set starts: [[apply]]
        fr: |
          Limite à définir sur 5 Go : [[limit]]

          Resource policy : [[policy]]

          Apply policy before the data collector set starts : [[apply]]
      slots:
        - id: limit
          options:
            - { id: minfree, text: Minimum free disk }
            - { id: maxfolders, text: Maximum folders }
            - { id: rootsize, text: Maximum root path size }
        - id: policy
          options:
            - { id: largest, text: Delete largest }
            - { id: oldest, text: Delete oldest }
        - id: apply
          options:
            - { id: on, text: { en: "Selected", fr: "Sélectionnée" } }
            - { id: off, text: { en: "Cleared", fr: "Non sélectionnée" } }
    answer:
      values: { limit: rootsize, policy: oldest, apply: "on" }
    explanation:
      correct:
        en: |
          **Maximum root path size** is the maximum size of the data directory of the set, including all its subfolders, and it overrides the other limits. **Resource policy** chooses whether the oldest or the largest data is deleted when a limit is reached. With **Apply policy before the data collector set starts** selected, previous data is deleted before the set creates its next log file.
        fr: |
          **Maximum root path size** est la taille maximale du répertoire de données du jeu, sous-dossiers compris, et elle prévaut sur les autres limites. **Resource policy** choisit si les données les plus anciennes ou les plus volumineuses sont supprimées quand une limite est atteinte. Avec **Apply policy before the data collector set starts** sélectionnée, les données précédentes sont supprimées avant que le jeu crée son prochain fichier journal.
      options:
        minfree: { en: "Minimum free disk protects the free space of volume D, which other applications also fill; it doesn't cap the size of the PerfDaily data.", fr: "Minimum free disk protège l'espace libre du volume D, que d'autres applications remplissent aussi ; il ne plafonne pas la taille des données de PerfDaily." }
        maxfolders: { en: "Maximum folders limits a number of subfolders, not a size in gigabytes.", fr: "Maximum folders limite un nombre de sous-dossiers, pas une taille en gigaoctets." }
        largest: { en: "Delete largest removes the largest data first, not the oldest.", fr: "Delete largest supprime d'abord les données les plus volumineuses, pas les plus anciennes." }
    references:
      - title: Manage Data in Windows Reliability and Performance Monitor
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc765998(v=ws.10)

  # ------------------------------------------------------------------ 9
  - id: az802-qz-71-09
    objective: "7.1.6"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You have two Azure virtual machines named **WEB1** and **WEB2** and an Azure Arc-enabled server named **WEB3**. All three run IIS on Windows Server 2022 and have the Azure Monitor Agent installed. You have a Log Analytics workspace named **LAW1**.

        You create a data collection rule (DCR) for the three servers that sends its data to LAW1. The DCR must meet the following requirements:

        - Collect the IIS access logs. The existing queries of the web team read the **W3CIISLog** table.
        - From the Application log, collect only the events with event ID 1000 or 1001, and no other event of this log.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez de deux machines virtuelles Azure nommées **WEB1** et **WEB2** et d'un serveur activé pour Azure Arc nommé **WEB3**. Les trois exécutent IIS sur Windows Server 2022, et l'agent Azure Monitor y est installé. Vous disposez d'un espace de travail Log Analytics nommé **LAW1**.

        Vous créez pour les trois serveurs une règle de collecte de données (DCR) qui envoie ses données à LAW1. La DCR doit satisfaire aux exigences suivantes :

        - Collecter les journaux d'accès IIS. Les requêtes existantes de l'équipe web lisent la table **W3CIISLog**.
        - Du journal Application, collecter uniquement les événements d'ID 1000 ou 1001, et aucun autre événement de ce journal.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Data source type for the IIS access logs: [[iis]]

          Configuration of the Windows Event Logs data source: [[mode]]

          Table in which the Application events are stored: [[table]]
        fr: |
          Type de source de données pour les journaux d'accès IIS : [[iis]]

          Configuration de la source de données Windows Event Logs : [[mode]]

          Table dans laquelle les événements Application sont stockés : [[table]]
      slots:
        - id: iis
          options:
            - { id: textlogs, text: Custom Text Logs }
            - { id: iislogs, text: IIS Logs }
            - { id: winevents, text: Windows Event Logs }
            - { id: perf, text: Performance Counters }
        - id: mode
          options:
            - { id: basicerr, text: { en: "Basic, with the Error level selected for the Application log", fr: "Basic, avec le niveau Error sélectionné pour le journal Application" } }
            - { id: custom, text: { en: "Custom, with an XPath query on the two event IDs", fr: "Custom, avec une requête XPath sur les deux ID d'événement" } }
            - { id: basiccrit, text: { en: "Basic, with the Critical level selected for the Application log", fr: "Basic, avec le niveau Critical sélectionné pour le journal Application" } }
        - id: table
          options:
            - { id: event, text: Event }
            - { id: secevent, text: SecurityEvent }
            - { id: w3c, text: W3CIISLog }
            - { id: perftable, text: Perf }
    answer:
      values: { iis: iislogs, mode: custom, table: event }
    explanation:
      correct:
        en: |
          The **IIS Logs** data source sends the IIS log files to a Log Analytics workspace, in the **W3CIISLog** table that the web team already queries. The Basic configuration of Windows Event Logs filters only by log and severity level, so selecting specific event IDs requires the **Custom** configuration with an XPath query. Windows events can only be sent to a Log Analytics workspace, where they're stored in the **Event** table.
        fr: |
          La source de données **IIS Logs** envoie les fichiers journaux IIS dans un espace de travail Log Analytics, dans la table **W3CIISLog** que l'équipe web interroge déjà. La configuration Basic de Windows Event Logs ne filtre que par journal et niveau de gravité : sélectionner des ID d'événement précis exige donc la configuration **Custom** avec une requête XPath. Les événements Windows ne peuvent être envoyés qu'à un espace de travail Log Analytics, où ils sont stockés dans la table **Event**.
      options:
        textlogs: { en: "A custom text log can read IIS files, but it stores them in a custom table, not in W3CIISLog.", fr: "Un journal de texte personnalisé peut lire des fichiers IIS, mais il les stocke dans une table personnalisée, pas dans W3CIISLog." }
        basicerr: { en: "The Error level collects every error event of the Application log, not only events 1000 and 1001.", fr: "Le niveau Error collecte chaque événement d'erreur du journal Application, pas seulement les événements 1000 et 1001." }
        secevent: { en: "SecurityEvent receives the Security events collected by the Microsoft Sentinel connector, not the Application events of a DCR.", fr: "SecurityEvent reçoit les événements de sécurité collectés par le connecteur Microsoft Sentinel, pas les événements Application d'une DCR." }
    references:
      - title: Collect IIS logs from virtual machine with Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-iis
      - title: Collect Windows events from virtual machines with Azure Monitor Agent
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events

  # ------------------------------------------------------------------ 10
  - id: az802-qz-71-10
    objective: "7.1.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Your network contains an AD DS domain named **contoso.com**. A member server named **WEC1** runs the Windows Event Collector service. On WEC1, you created a source computer initiated subscription that collects the **System** and **Security** logs. The subscription allows the computers of a group named **WEF-DCs**, which contains DC1 and DC2.

        A GPO linked to the Domain Controllers OU starts the WinRM service and configures **Configure target Subscription Manager** to point to WEC1. Yesterday, you promoted a third domain controller named **DC3**.

        In the Forwarded Events log of WEC1, you find the System events of DC1 and DC2, but no Security event from any domain controller and no event from DC3. The subscription must remain source computer initiated.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Votre réseau contient un domaine AD DS nommé **contoso.com**. Un serveur membre nommé **WEC1** exécute le service Collecteur d'événements de Windows. Sur WEC1, vous avez créé un abonnement initié par l'ordinateur source qui collecte les journaux **Système** et **Sécurité**. L'abonnement autorise les ordinateurs d'un groupe nommé **WEF-DCs**, qui contient DC1 et DC2.

        Un GPO lié à l'UO Domain Controllers démarre le service WinRM et configure **Configure target Subscription Manager** pour pointer vers WEC1. Hier, vous avez promu un troisième contrôleur de domaine nommé **DC3**.

        Dans le journal Événements transférés de WEC1, vous trouvez les événements Système de DC1 et DC2, mais aucun événement Sécurité d'aucun contrôleur de domaine et aucun événement de DC3. L'abonnement doit rester initié par l'ordinateur source.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Add the computer account of WEC1 to the Event Log Readers group of the domain controllers.", fr: "Ajouter le compte d'ordinateur de WEC1 au groupe Event Log Readers des contrôleurs de domaine." } }
        - { id: b, text: { en: "Add the Network Service account to the Event Log Readers group of the domain controllers.", fr: "Ajouter le compte Network Service au groupe Event Log Readers des contrôleurs de domaine." } }
        - { id: c, text: { en: "Run wecutil qc on DC1, DC2 and DC3 to configure them as event sources.", fr: "Exécuter wecutil qc sur DC1, DC2 et DC3 pour les configurer comme sources d'événements." } }
        - { id: d, text: { en: "Add the computer account of DC3 to WEF-DCs, and then restart DC3.", fr: "Ajouter le compte d'ordinateur de DC3 à WEF-DCs, puis redémarrer DC3." } }
        - { id: e, text: { en: "Change the startup type of the WinRM service to Automatic on DC1 and DC2.", fr: "Passer le type de démarrage du service WinRM à Automatique sur DC1 et DC2." } }
      choose: 2
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          In a source-initiated subscription, the forwarding client on each source reads the logs as **Network Service**, which can read a secured channel such as Security only once it's a member of **Event Log Readers**; the System events arrive because that log needs no extra permission. The subscription ACL on the collector lists the machine accounts or groups allowed to participate, so DC3 must join WEF-DCs, and a restart refreshes its group membership.
        fr: |
          Dans un abonnement initié par la source, le client de transfert de chaque source lit les journaux en tant que **Network Service**, qui ne peut lire un canal sécurisé comme Sécurité qu'une fois membre d'**Event Log Readers** ; les événements Système arrivent car ce journal n'exige aucune autorisation supplémentaire. La liste de contrôle d'accès de l'abonnement sur le collecteur indique les comptes d'ordinateur ou les groupes autorisés à participer : DC3 doit donc rejoindre WEF-DCs, et un redémarrage actualise son appartenance aux groupes.
      options:
        a: { en: "The collector's computer account in Event Log Readers is the requirement of a collector initiated subscription, where the collector reads the logs.", fr: "Le compte d'ordinateur du collecteur dans Event Log Readers est l'exigence d'un abonnement initié par le collecteur, où c'est le collecteur qui lit les journaux." }
        c: { en: "wecutil qc configures the Windows Event Collector service on the collector, not the sources.", fr: "wecutil qc configure le service Collecteur d'événements de Windows sur le collecteur, pas sur les sources." }
        e: { en: "WinRM already works on DC1 and DC2: their System events reach WEC1.", fr: "WinRM fonctionne déjà sur DC1 et DC2 : leurs événements Système parviennent à WEC1." }
    references:
      - title: Use Windows Event Forwarding to help with intrusion detection
        url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/device-management/use-windows-event-forwarding-to-assist-in-intrusion-detection
