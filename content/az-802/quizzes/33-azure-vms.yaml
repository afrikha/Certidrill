chapter: 33-azure-vms
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-33-01
    objective: "3.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You attach a new, empty 4-TiB Premium SSD data disk to an Azure virtual machine named **VM4** that runs Windows Server 2025. You then initialize the disk in Disk Management on VM4.

        You need one volume of VM4 to be able to use the full capacity of the disk.

        Which partition style should you select?
      fr: |
        Vous attachez un nouveau disque de données SSD Premium vide de 4 Tio à une machine virtuelle Azure nommée **VM4** qui exécute Windows Server 2025. Vous initialisez ensuite le disque dans Gestion des disques sur VM4.

        Vous devez faire en sorte qu'un volume de VM4 puisse utiliser toute la capacité du disque.

        Quel style de partition devez-vous sélectionner ?
    body:
      options:
        - { id: a, text: { en: "MBR (master boot record)", fr: "MBR (enregistrement de démarrage principal)" } }
        - { id: b, text: { en: "MBR, and then convert the disk to a dynamic disk", fr: "MBR, puis convertir le disque en disque dynamique" } }
        - { id: c, text: { en: "GPT (GUID partition table)", fr: "GPT (table de partition GUID)" } }
        - { id: d, text: { en: "Either style, because Azure presents large data disks as GPT", fr: "Indifféremment l'un ou l'autre, car Azure présente les grands disques de données en GPT" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The MBR partition style limits the usable size of a disk to 2 TiB. A data disk of 2 TiB or more must therefore be initialized with GPT so that a volume can use all its capacity. Expanding or creating the managed disk in Azure never changes the partition style: it is chosen in the guest.
        fr: |
          Le style de partition MBR limite la taille utilisable d'un disque à 2 Tio. Un disque de données de 2 Tio ou plus doit donc être initialisé en GPT pour qu'un volume puisse utiliser toute sa capacité. Créer ou agrandir le disque managé dans Azure ne change jamais le style de partition : il se choisit dans l'invité.
      options:
        a: { en: "With MBR, only 2 TiB of the 4-TiB disk can be used.", fr: "En MBR, seuls 2 Tio du disque de 4 Tio sont utilisables." }
        b: { en: "A dynamic disk keeps the 2-TiB limit of the MBR partition table it was created from.", fr: "Un disque dynamique conserve la limite de 2 Tio de la table de partition MBR à partir de laquelle il a été créé." }
        d: { en: "Azure presents a raw disk; the partition style is the one you select in Windows, and MBR stays limited to 2 TiB.", fr: "Azure présente un disque brut ; le style de partition est celui que vous sélectionnez dans Windows, et MBR reste limité à 2 Tio." }
    references:
      - title: Expand Virtual Hard Disks Attached to a Windows VM in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/expand-disks

  # ------------------------------------------------------------------ 2
  - id: az802-qz-33-02
    objective: "3.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam plans to deploy a Virtual Machine Scale Set for a batch application that runs on Windows Server 2025. To reduce cost, the scale set must run Azure Spot instances and regular-priority instances at the same time.

        Which configuration should you select when you create the scale set?
      fr: |
        Fabrikam prévoit de déployer un groupe de machines virtuelles identiques pour une application de traitement par lots qui s'exécute sur Windows Server 2025. Pour réduire les coûts, le groupe identique doit exécuter en même temps des instances Azure Spot et des instances de priorité normale.

        Quelle configuration devez-vous sélectionner lors de la création du groupe identique ?
    body:
      options:
        - { id: a, text: { en: "Uniform orchestration mode with a single placement group", fr: "Mode d'orchestration uniforme avec un groupe de placement unique" } }
        - { id: b, text: { en: "Uniform orchestration mode without a single placement group", fr: "Mode d'orchestration uniforme sans groupe de placement unique" } }
        - { id: c, text: { en: "Flexible orchestration mode", fr: "Mode d'orchestration flexible" } }
        - { id: d, text: { en: "Uniform orchestration mode with five fault domains", fr: "Mode d'orchestration uniforme avec cinq domaines d'erreur" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Flexible orchestration lets one scale set contain both Spot and regular-priority instances. It also accepts different VM sizes and existing VMs, and is the mode Microsoft recommends for new deployments.
        fr: |
          L'orchestration flexible permet à un même groupe identique de contenir à la fois des instances Spot et des instances de priorité normale. Elle accepte aussi des tailles de machines virtuelles différentes et des machines virtuelles existantes, et c'est le mode que Microsoft recommande pour les nouveaux déploiements.
      options:
        a: { en: "In Uniform orchestration, all the instances of a scale set are either Spot or regular, whatever the placement group setting.", fr: "En orchestration uniforme, toutes les instances d'un groupe identique sont soit Spot, soit normales, quel que soit le paramètre du groupe de placement." }
        b: { en: "Disabling the single placement group raises the instance limit of a Uniform scale set; it doesn't allow Spot and regular instances to be mixed.", fr: "Désactiver le groupe de placement unique relève la limite d'instances d'un groupe identique uniforme ; cela ne permet pas de mélanger instances Spot et normales." }
        d: { en: "The fault domain count controls how instances are spread; a Uniform scale set still can't mix priorities.", fr: "Le nombre de domaines d'erreur règle la répartition des instances ; un groupe identique uniforme ne peut toujours pas mélanger les priorités." }
    references:
      - title: Orchestration modes for Virtual Machine Scale Sets in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-orchestration-modes

  # ------------------------------------------------------------------ 3
  - id: az802-qz-33-03
    objective: "3.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a running Azure virtual machine named **APP2** that runs Windows Server 2025 and uses the Standard_D8s_v5 size, which supports Accelerated Networking. APP2 has one network interface named **app2-nic**, on which Accelerated Networking is disabled.

        You need to enable Accelerated Networking for APP2.

        What should you do?
      fr: |
        Vous disposez d'une machine virtuelle Azure en cours d'exécution nommée **APP2** qui exécute Windows Server 2025 et utilise la taille Standard_D8s_v5, qui prend en charge la mise en réseau accélérée. APP2 possède une interface réseau nommée **app2-nic**, sur laquelle la mise en réseau accélérée est désactivée.

        Vous devez activer la mise en réseau accélérée pour APP2.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable Accelerated Networking on app2-nic while APP2 runs, and then restart Windows on APP2.", fr: "Activer la mise en réseau accélérée sur app2-nic pendant l'exécution d'APP2, puis redémarrer Windows sur APP2." } }
        - { id: b, text: { en: "Stop APP2 so that it is deallocated, enable Accelerated Networking on app2-nic, and then start APP2.", fr: "Arrêter APP2 pour qu'elle soit libérée, activer la mise en réseau accélérée sur app2-nic, puis démarrer APP2." } }
        - { id: c, text: { en: "Enable SR-IOV in the properties of the network adapter in Windows on APP2, and then restart APP2.", fr: "Activer SR-IOV dans les propriétés de la carte réseau dans Windows sur APP2, puis redémarrer APP2." } }
        - { id: d, text: { en: "Redeploy APP2 to a new host, and then enable Accelerated Networking on app2-nic.", fr: "Redéployer APP2 sur un nouvel hôte, puis activer la mise en réseau accélérée sur app2-nic." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Accelerated Networking is a property of the Azure network interface. Azure can't enable it on a running VM: you enable it only while the VM is stopped and deallocated, and the setting takes effect when the VM starts again.
        fr: |
          La mise en réseau accélérée est une propriété de l'interface réseau Azure. Azure ne peut pas l'activer sur une machine virtuelle en cours d'exécution : vous l'activez uniquement quand la machine virtuelle est arrêtée et libérée, et le paramètre s'applique au redémarrage de la machine virtuelle.
      options:
        a: { en: "The change is refused while the VM runs; restarting Windows doesn't deallocate the VM.", fr: "La modification est refusée pendant l'exécution de la machine virtuelle ; redémarrer Windows ne libère pas la machine virtuelle." }
        c: { en: "SR-IOV is provided by the Azure host when Accelerated Networking is enabled on the network interface; a setting in the guest can't turn it on.", fr: "SR-IOV est fourni par l'hôte Azure quand la mise en réseau accélérée est activée sur l'interface réseau ; un réglage dans l'invité ne peut pas l'activer." }
        d: { en: "After a redeployment the VM is running again, so enabling Accelerated Networking is still refused.", fr: "Après un redéploiement, la machine virtuelle est de nouveau en cours d'exécution : l'activation de la mise en réseau accélérée reste refusée." }
    references:
      - title: Azure Accelerated Networking Overview and Benefits
        url: https://learn.microsoft.com/en-us/azure/virtual-network/accelerated-networking-overview

  # ------------------------------------------------------------------ 4
  - id: az802-qz-33-04
    objective: "3.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have an Azure virtual network named **VNet-Ops** that is peered with a virtual network named **VNet-App**. Both virtual networks contain Windows Server 2025 virtual machines. VNet-Ops contains an empty subnet named **AzureBastionSubnet** with the prefix 10.30.255.0/27.

        You try to deploy an Azure Bastion host that uses the Basic SKU to VNet-Ops, and the deployment fails. Administrators must be able to connect through the host to the VMs of both virtual networks.

        What should you do before you retry the deployment?
      fr: |
        Vous disposez d'un réseau virtuel Azure nommé **VNet-Ops** relié par peering à un réseau virtuel nommé **VNet-App**. Les deux réseaux virtuels contiennent des machines virtuelles Windows Server 2025. VNet-Ops contient un sous-réseau vide nommé **AzureBastionSubnet** dont le préfixe est 10.30.255.0/27.

        Vous tentez de déployer dans VNet-Ops un hôte Azure Bastion qui utilise la référence SKU Basic, et le déploiement échoue. Les administrateurs doivent pouvoir se connecter par cet hôte aux machines virtuelles des deux réseaux virtuels.

        Que devez-vous faire avant de relancer le déploiement ?
    body:
      options:
        - { id: a, text: { en: "Change the prefix of AzureBastionSubnet to a /26 or larger range.", fr: "Remplacer le préfixe d'AzureBastionSubnet par une plage /26 ou plus grande." } }
        - { id: b, text: { en: "Select the Standard SKU instead of the Basic SKU for the host.", fr: "Sélectionner la référence SKU Standard au lieu de Basic pour l'hôte." } }
        - { id: c, text: { en: "Select the Developer SKU, which doesn't use AzureBastionSubnet.", fr: "Sélectionner la référence SKU Developer, qui n'utilise pas AzureBastionSubnet." } }
        - { id: d, text: { en: "Associate a network security group with AzureBastionSubnet.", fr: "Associer un groupe de sécurité réseau à AzureBastionSubnet." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Every Bastion SKU except Developer needs a dedicated subnet named AzureBastionSubnet with a size of /26 or larger, in the virtual network of the host. A /27 subnet is refused for a new deployment, so you resize the empty subnet to /26 (or larger) and deploy again. The Basic SKU already supports VMs in peered virtual networks.
        fr: |
          Toutes les références SKU de Bastion sauf Developer exigent un sous-réseau dédié nommé AzureBastionSubnet, de taille /26 ou plus grande, dans le réseau virtuel de l'hôte. Un sous-réseau /27 est refusé pour un nouveau déploiement : vous redimensionnez donc le sous-réseau vide en /26 (ou plus) et vous relancez le déploiement. La référence SKU Basic prend déjà en charge les machines virtuelles de réseaux virtuels reliés par peering.
      options:
        b: { en: "The Standard SKU needs the same /26 or larger AzureBastionSubnet, so the deployment would fail for the same reason.", fr: "La référence SKU Standard exige le même AzureBastionSubnet en /26 ou plus : le déploiement échouerait pour la même raison." }
        c: { en: "The Developer SKU needs no subnet, but it can't connect to VMs in peered virtual networks such as VNet-App.", fr: "La référence SKU Developer n'exige pas de sous-réseau, mais elle ne peut pas se connecter aux machines virtuelles de réseaux virtuels reliés par peering comme VNet-App." }
        d: { en: "A network security group is optional on AzureBastionSubnet; it doesn't fix a subnet that is too small.", fr: "Un groupe de sécurité réseau est facultatif sur AzureBastionSubnet ; il ne corrige pas un sous-réseau trop petit." }
    references:
      - title: About Azure Bastion configuration settings
        url: https://learn.microsoft.com/en-us/azure/bastion/configuration-settings

  # ------------------------------------------------------------------ 5
  - id: az802-qz-33-05
    objective: "3.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have an Azure virtual machine named **SQL4** that runs Windows Server 2025. SQL4 has a 128-GiB Premium SSD data disk named **SQL4-log** that uses its baseline P10 performance (500 IOPS).

        During a two-week year-end closing, the write workload on SQL4-log will need about 2,000 IOPS without interruption. After the closing, SQL4-log must return to its current cost. SQL4 must stay running.

        What should you do?
      fr: |
        Vous disposez d'une machine virtuelle Azure nommée **SQL4** qui exécute Windows Server 2025. SQL4 possède un disque de données SSD Premium de 128 Gio nommé **SQL4-log** qui utilise ses performances de base P10 (500 IOPS).

        Pendant une clôture annuelle de deux semaines, la charge d'écriture sur SQL4-log nécessitera environ 2 000 IOPS en continu. Après la clôture, SQL4-log doit revenir à son coût actuel. SQL4 doit rester en cours d'exécution.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable on-demand bursting on SQL4-log for the two weeks, and then disable it.", fr: "Activer le bursting à la demande sur SQL4-log pendant les deux semaines, puis le désactiver." } }
        - { id: b, text: { en: "Expand SQL4-log to 512 GiB for the two weeks, and then shrink it to 128 GiB.", fr: "Agrandir SQL4-log à 512 Gio pendant les deux semaines, puis le réduire à 128 Gio." } }
        - { id: c, text: { en: "Set the host caching of SQL4-log to Read-only for the two weeks.", fr: "Définir la mise en cache de l'hôte de SQL4-log sur Lecture seule pendant les deux semaines." } }
        - { id: d, text: { en: "Set the performance tier of SQL4-log to P20 for the two weeks, and then back to P10.", fr: "Définir le niveau de performance de SQL4-log sur P20 pendant les deux semaines, puis le ramener à P10." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A Premium SSD can use a performance tier higher than the baseline of its size without changing the size: a 128-GiB disk can move from P10 to P20 (2,300 IOPS), and it is billed at the P20 rate only while the tier is set. Most tier changes need no downtime, and you set the disk back to P10 when the closing ends.
        fr: |
          Un SSD Premium peut utiliser un niveau de performance supérieur au niveau de base de sa taille sans changer de taille : un disque de 128 Gio peut passer de P10 à P20 (2 300 IOPS), et il est facturé au tarif P20 uniquement tant que ce niveau est défini. La plupart des changements de niveau n'exigent aucune interruption, et vous ramenez le disque à P10 à la fin de la clôture.
      options:
        a: { en: "On-demand bursting is available only for Premium SSD disks larger than 512 GiB.", fr: "Le bursting à la demande n'est disponible que pour les disques SSD Premium de plus de 512 Gio." }
        b: { en: "Shrinking a managed disk isn't supported, so the disk would keep the cost of its larger size.", fr: "La réduction d'un disque managé n'est pas prise en charge : le disque conserverait le coût de sa taille supérieure." }
        c: { en: "Read-only caching serves reads from the host cache; it doesn't raise the IOPS available to a write workload.", fr: "La mise en cache en lecture seule sert les lectures depuis le cache de l'hôte ; elle n'augmente pas les IOPS disponibles pour une charge d'écriture." }
    references:
      - title: Performance tiers for Azure Premium SSD managed disks
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-change-performance
      - title: Managed disk bursting
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/disk-bursting

  # ------------------------------------------------------------------ 6
  - id: az802-qz-33-06
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys has a Virtual Machine Scale Set named **VMSS-Shop** that uses Flexible orchestration, runs Windows Server 2025 and spans availability zones 1, 2 and 3. VMSS-Shop uses the Default scale-in policy, and no instance is protected. The instances have the following instance IDs:

        | Zone | Instance IDs |
        | --- | --- |
        | 1 | 3, 6, 12 |
        | 2 | 2, 5, 8, 10 |
        | 3 | 1, 4, 7 |

        At night, autoscale removes one instance at a time. Fault domain balancing doesn't change the selection in this scenario.

        Which instances are removed? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys possède un groupe de machines virtuelles identiques nommé **VMSS-Shop** qui utilise l'orchestration flexible, exécute Windows Server 2025 et s'étend sur les zones de disponibilité 1, 2 et 3. VMSS-Shop utilise la stratégie de scale-in Default, et aucune instance n'est protégée. Les instances ont les ID d'instance suivants :

        | Zone | ID d'instance |
        | --- | --- |
        | 1 | 3, 6, 12 |
        | 2 | 2, 5, 8, 10 |
        | 3 | 1, 4, 7 |

        La nuit, la mise à l'échelle automatique supprime une instance à la fois. L'équilibrage entre domaines d'erreur ne modifie pas la sélection dans ce scénario.

        Quelles instances sont supprimées ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          First scale-in: instance [[first]]

          Second scale-in: instance [[second]]
        fr: |
          Premier scale-in : instance [[first]]

          Deuxième scale-in : instance [[second]]
      slots:
        - id: first
          options:
            - { id: f1, text: "1" }
            - { id: f2, text: "2" }
            - { id: f10, text: "10" }
            - { id: f12, text: "12" }
        - id: second
          options:
            - { id: s3, text: "3" }
            - { id: s7, text: "7" }
            - { id: s8, text: "8" }
            - { id: s12, text: "12" }
    answer:
      values: { first: f10, second: s12 }
    explanation:
      correct:
        en: |
          The Default policy first balances the instances across availability zones, then across fault domains, and only then removes the instance with the highest ID. Zone 2 has four instances and the other zones three, so the first scale-in removes the highest ID of zone 2: instance 10, not instance 12. The zones are then balanced (three instances each), so the second scale-in removes the highest ID of the whole scale set: instance 12.
        fr: |
          La stratégie Default équilibre d'abord les instances entre les zones de disponibilité, puis entre les domaines d'erreur, et seulement ensuite supprime l'instance dont l'ID est le plus élevé. La zone 2 compte quatre instances et les autres zones trois : le premier scale-in supprime donc l'ID le plus élevé de la zone 2, l'instance 10, et non l'instance 12. Les zones sont alors équilibrées (trois instances chacune) : le deuxième scale-in supprime l'ID le plus élevé de tout le groupe identique, l'instance 12.
      options:
        f12: { en: "Instance 12 has the highest ID, but zone 1 isn't the zone with the most instances, and zone balancing comes first.", fr: "L'instance 12 a l'ID le plus élevé, mais la zone 1 n'est pas celle qui compte le plus d'instances, et l'équilibrage entre zones passe en premier." }
        f2: { en: "Removing the oldest instance of the largest zone is what the OldestVM policy would do, not the Default policy.", fr: "Supprimer l'instance la plus ancienne de la zone la plus grande correspond à la stratégie OldestVM, pas à la stratégie Default." }
        s8: { en: "Once zone 2 has three instances, the zones are balanced and the highest ID of the scale set is removed, not the highest of zone 2.", fr: "Une fois que la zone 2 compte trois instances, les zones sont équilibrées et c'est l'ID le plus élevé du groupe identique qui est supprimé, pas celui de la zone 2." }
    references:
      - title: Use scale-in policies with Azure Virtual Machine Scale Sets
        url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-scale-in-policy

  # ------------------------------------------------------------------ 7
  - id: az802-qz-33-07
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso plans to deploy two Azure virtual machines named **SQL1** and **SQL2** in the West Europe region, which has three availability zones that support Ultra Disks. Both VMs will run Windows Server 2025 and an Always On availability group, and their size supports Ultra Disks.

        Each VM needs one data disk, without striping, that delivers 120,000 IOPS. The availability group must keep running if a rack, a power supply or a network switch that hosts one of the VMs fails. The network latency between SQL1 and SQL2 must be as low as these requirements allow.

        Which deployment should you use?
      fr: |
        Contoso prévoit de déployer deux machines virtuelles Azure nommées **SQL1** et **SQL2** dans la région Europe Ouest, qui possède trois zones de disponibilité prenant en charge les disques Ultra. Les deux machines virtuelles exécuteront Windows Server 2025 et un groupe de disponibilité Always On, et leur taille prend en charge les disques Ultra.

        Chaque machine virtuelle a besoin d'un disque de données, sans agrégation par bandes, qui fournit 120 000 IOPS. Le groupe de disponibilité doit continuer à fonctionner si un rack, une alimentation ou un commutateur réseau qui héberge l'une des machines virtuelles tombe en panne. La latence réseau entre SQL1 et SQL2 doit être aussi faible que ces exigences le permettent.

        Quel déploiement devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "An availability set with three fault domains, and an Ultra Disk data disk for each VM", fr: "Un groupe à haute disponibilité avec trois domaines d'erreur, et un disque de données Ultra pour chaque machine virtuelle" } }
        - { id: b, text: { en: "An availability set with three fault domains, and a Premium SSD v2 data disk for each VM", fr: "Un groupe à haute disponibilité avec trois domaines d'erreur, et un disque de données SSD Premium v2 pour chaque machine virtuelle" } }
        - { id: c, text: { en: "Both VMs in availability zone 1 without an availability set, and an Ultra Disk data disk for each VM", fr: "Les deux machines virtuelles dans la zone de disponibilité 1 sans groupe à haute disponibilité, et un disque de données Ultra pour chaque machine virtuelle" } }
        - { id: d, text: { en: "SQL1 in availability zone 1 and SQL2 in availability zone 2, and an Ultra Disk data disk for each VM", fr: "SQL1 dans la zone de disponibilité 1 et SQL2 dans la zone de disponibilité 2, et un disque de données Ultra pour chaque machine virtuelle" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Only an Ultra Disk delivers 120,000 IOPS on one disk: a Premium SSD v2 tops out at 80,000 IOPS. Ultra Disks support single VMs and availability zones, but not availability sets. Placing the VMs in two different zones puts them in separate datacenters, so a rack, power or switch failure can't affect both; the higher latency between zones is the price of the only valid option.
        fr: |
          Seul un disque Ultra fournit 120 000 IOPS sur un seul disque : un SSD Premium v2 plafonne à 80 000 IOPS. Les disques Ultra prennent en charge les machines virtuelles uniques et les zones de disponibilité, mais pas les groupes à haute disponibilité. Placer les machines virtuelles dans deux zones différentes les met dans des centres de données distincts : une panne de rack, d'alimentation ou de commutateur ne peut pas toucher les deux ; la latence plus élevée entre zones est le prix de la seule option valide.
      options:
        a: { en: "An availability set would give the lowest latency, but Ultra Disks can't be used in an availability set.", fr: "Un groupe à haute disponibilité donnerait la latence la plus faible, mais les disques Ultra ne peuvent pas être utilisés dans un groupe à haute disponibilité." }
        b: { en: "A Premium SSD v2 disk delivers at most 80,000 IOPS, below the 120,000 IOPS required on one disk.", fr: "Un disque SSD Premium v2 fournit au plus 80 000 IOPS, moins que les 120 000 IOPS exigées sur un seul disque." }
        c: { en: "Two VMs in the same zone without an availability set have no fault domain separation, so one rack or switch failure could stop both.", fr: "Deux machines virtuelles dans la même zone sans groupe à haute disponibilité n'ont aucune séparation de domaines d'erreur : une seule panne de rack ou de commutateur pourrait arrêter les deux." }
    references:
      - title: Configure Ultra Disks for Azure virtual machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-enable-ultra-ssd
      - title: Availability sets overview
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview

  # ------------------------------------------------------------------ 8
  - id: az802-qz-33-08
    objective: "3.2.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have an Azure subscription in which Microsoft Defender for Servers Plan 2 is enabled. The subscription contains the following Windows Server 2025 virtual machines, all deployed through Azure Resource Manager:

        | VM | Network protection |
        | --- | --- |
        | VM-A | A network security group named NSG-A is associated with its network interface |
        | VM-B | No network security group; protected by FW1, an Azure Firewall in the same virtual network that uses classic rules |
        | VM-C | No network security group; protected by FW2, an Azure Firewall managed by Azure Firewall Manager through a firewall policy |

        You plan to use just-in-time (JIT) VM access for RDP. A user named Admin2 has only the Reader role on the subscription.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un abonnement Azure dans lequel Microsoft Defender pour les serveurs Plan 2 est activé. L'abonnement contient les machines virtuelles Windows Server 2025 suivantes, toutes déployées par Azure Resource Manager :

        | Machine virtuelle | Protection réseau |
        | --- | --- |
        | VM-A | Un groupe de sécurité réseau nommé NSG-A est associé à son interface réseau |
        | VM-B | Aucun groupe de sécurité réseau ; protégée par FW1, un Pare-feu Azure du même réseau virtuel qui utilise des règles classiques |
        | VM-C | Aucun groupe de sécurité réseau ; protégée par FW2, un Pare-feu Azure géré par Azure Firewall Manager au moyen d'une stratégie de pare-feu |

        Vous prévoyez d'utiliser l'accès juste-à-temps (JIT) aux machines virtuelles pour RDP. Un utilisateur nommé Admin2 dispose uniquement du rôle Reader sur l'abonnement.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "You can enable JIT VM access on VM-B.", fr: "Vous pouvez activer l'accès JIT aux machines virtuelles sur VM-B." } }
        - { id: s2, text: { en: "You can enable JIT VM access on VM-C.", fr: "Vous pouvez activer l'accès JIT aux machines virtuelles sur VM-C." } }
        - { id: s3, text: { en: "After JIT VM access is enabled on VM-A, Admin2 can request access to port 3389 of VM-A.", fr: "Une fois l'accès JIT aux machines virtuelles activé sur VM-A, Admin2 peut demander l'accès au port 3389 de VM-A." } }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          JIT needs Defender for Servers Plan 2 and a network security group, an Azure Firewall, or both in front of a Resource Manager VM. An Azure Firewall in the VM's virtual network works if it uses classic rules, so VM-B is supported. VMs protected by an Azure Firewall controlled by Azure Firewall Manager aren't supported, so VM-C can't use JIT. To request access, a user needs the `Microsoft.Security/locations/jitNetworkAccessPolicies/initiate/action` permission, which the Reader role doesn't include.
        fr: |
          JIT exige Defender pour les serveurs Plan 2 et un groupe de sécurité réseau, un Pare-feu Azure, ou les deux, devant une machine virtuelle Resource Manager. Un Pare-feu Azure du réseau virtuel de la machine convient s'il utilise des règles classiques : VM-B est donc prise en charge. Les machines virtuelles protégées par un Pare-feu Azure contrôlé par Azure Firewall Manager ne sont pas prises en charge : VM-C ne peut pas utiliser JIT. Pour demander l'accès, un utilisateur a besoin de l'autorisation `Microsoft.Security/locations/jitNetworkAccessPolicies/initiate/action`, que le rôle Reader n'inclut pas.
      options:
        s1: { en: "JIT doesn't require a network security group when an Azure Firewall with classic rules protects the VM.", fr: "JIT n'exige pas de groupe de sécurité réseau quand un Pare-feu Azure à règles classiques protège la machine virtuelle." }
        s3: { en: "Reader allows Admin2 to view the VM and its JIT configuration, but not to initiate a JIT request.", fr: "Reader permet à Admin2 de voir la machine virtuelle et sa configuration JIT, mais pas de lancer une demande JIT." }
    references:
      - title: Enable Just-in-Time Access
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-usage
      - title: Understand Just-in-time Virtual Machine Access
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-overview

  # ------------------------------------------------------------------ 9
  - id: az802-qz-33-09
    objective: "3.2.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You have an Azure virtual machine named **APP7** that runs Windows Server 2025 and has two network interfaces:

        | Network interface | Role | Subnet | Private IP address | Windows interface index |
        | --- | --- | --- | --- | --- |
        | app7-nic1 | Primary | Front (10.0.1.0/24) | 10.0.1.4 | 4 |
        | app7-nic2 | Secondary | Mgmt (10.0.2.0/24) | 10.0.2.4 | 7 |

        Administrators connect to 10.0.2.4 from workstations in the subnet 10.50.3.0/24 of a peered virtual network, but APP7 never answers them through app7-nic2. All the network security groups allow the traffic.

        You need traffic from APP7 to 10.50.3.0/24 to leave through app7-nic2. All other traffic must keep using app7-nic1. The configuration must survive restarts.

        How should you complete the command that you run on APP7? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'une machine virtuelle Azure nommée **APP7** qui exécute Windows Server 2025 et possède deux interfaces réseau :

        | Interface réseau | Rôle | Sous-réseau | Adresse IP privée | Index d'interface Windows |
        | --- | --- | --- | --- | --- |
        | app7-nic1 | Principale | Front (10.0.1.0/24) | 10.0.1.4 | 4 |
        | app7-nic2 | Secondaire | Mgmt (10.0.2.0/24) | 10.0.2.4 | 7 |

        Les administrateurs se connectent à 10.0.2.4 depuis des postes de travail du sous-réseau 10.50.3.0/24 d'un réseau virtuel relié par peering, mais APP7 ne leur répond jamais par app7-nic2. Tous les groupes de sécurité réseau autorisent le trafic.

        Vous devez faire en sorte que le trafic d'APP7 vers 10.50.3.0/24 sorte par app7-nic2. Tout le reste du trafic doit continuer à utiliser app7-nic1. La configuration doit persister après les redémarrages.

        Comment devez-vous compléter la commande que vous exécutez sur APP7 ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: powershell
      template: |
        route add -p [[dest]] MASK [[mask]] [[gateway]] METRIC 5015 IF 7
      slots:
        - id: dest
          options:
            - { id: d0, text: 0.0.0.0 }
            - { id: d50, text: 10.50.3.0 }
            - { id: d2, text: 10.0.2.0 }
        - id: mask
          options:
            - { id: m0, text: 0.0.0.0 }
            - { id: m16, text: 255.255.0.0 }
            - { id: m24, text: 255.255.255.0 }
        - id: gateway
          options:
            - { id: g21, text: 10.0.2.1 }
            - { id: g11, text: 10.0.1.1 }
            - { id: g24, text: 10.0.2.4 }
            - { id: gdns, text: 168.63.129.16 }
    answer:
      values: { dest: d50, mask: m24, gateway: g21 }
    explanation:
      correct:
        en: |
          Azure gives a default gateway only to the primary network interface, so Windows sends the replies to 10.50.3.0/24 through app7-nic1 and they never use app7-nic2. A persistent route (`-p`) for the destination 10.50.3.0 with the mask 255.255.255.0, through the gateway of the Mgmt subnet (its first address, 10.0.2.1) on interface 7, sends only that traffic through app7-nic2.
        fr: |
          Azure n'attribue une passerelle par défaut qu'à l'interface réseau principale : Windows envoie donc les réponses vers 10.50.3.0/24 par app7-nic1, et elles n'empruntent jamais app7-nic2. Un itinéraire persistant (`-p`) vers la destination 10.50.3.0 avec le masque 255.255.255.0, par la passerelle du sous-réseau Mgmt (sa première adresse, 10.0.2.1) sur l'interface 7, envoie uniquement ce trafic par app7-nic2.
      options:
        d0: { en: "0.0.0.0 with the mask 0.0.0.0 would send all the traffic that leaves the subnet through app7-nic2, not only the traffic to 10.50.3.0/24.", fr: "0.0.0.0 avec le masque 0.0.0.0 enverrait par app7-nic2 tout le trafic qui sort du sous-réseau, pas seulement celui vers 10.50.3.0/24." }
        m16: { en: "255.255.0.0 would cover 10.50.0.0/16, which is wider than the workstation subnet.", fr: "255.255.0.0 couvrirait 10.50.0.0/16, plus large que le sous-réseau des postes de travail." }
        g11: { en: "10.0.1.1 is the gateway of the Front subnet, which interface 7 can't reach directly.", fr: "10.0.1.1 est la passerelle du sous-réseau Front, que l'interface 7 ne peut pas joindre directement." }
        gdns: { en: "168.63.129.16 is the Azure platform address for DNS and health probes, not a subnet gateway.", fr: "168.63.129.16 est l'adresse de la plateforme Azure pour le DNS et les sondes d'intégrité, pas une passerelle de sous-réseau." }
    references:
      - title: Create and manage Windows VMs in Azure that use multiple NICs
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/multiple-nics

  # ------------------------------------------------------------------ 10
  - id: az802-qz-33-10
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        You have a running Azure virtual machine named **FS3** that runs Windows Server 2025. FS3 has a data disk named **FS3-data** with the following configuration:

        - Type: Premium SSD, 2 TiB
        - Host caching: Read-only
        - Partition style in Windows: GPT, with one volume F: that uses the whole disk

        You need the F: volume to have a size of 8 TiB. FS3-data must remain a Premium SSD disk.

        Which two actions should you perform before you change the size of FS3-data? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'une machine virtuelle Azure en cours d'exécution nommée **FS3** qui exécute Windows Server 2025. FS3 possède un disque de données nommé **FS3-data** dont la configuration est la suivante :

        - Type : SSD Premium, 2 Tio
        - Mise en cache de l'hôte : Lecture seule
        - Style de partition dans Windows : GPT, avec un volume F: qui utilise tout le disque

        Vous devez faire en sorte que le volume F: ait une taille de 8 Tio. FS3-data doit rester un disque SSD Premium.

        Quelles sont les deux actions à effectuer avant de modifier la taille de FS3-data ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Set the host caching of FS3-data to None.", fr: "Définir la mise en cache de l'hôte de FS3-data sur Aucune." } }
        - { id: b, text: { en: "Stop FS3 so that it is deallocated.", fr: "Arrêter FS3 pour qu'elle soit libérée." } }
        - { id: c, text: { en: "Set the performance tier of FS3-data to P50.", fr: "Définir le niveau de performance de FS3-data sur P50." } }
        - { id: d, text: { en: "Detach FS3-data from FS3.", fr: "Détacher FS3-data de FS3." } }
        - { id: e, text: { en: "Convert F: to a dynamic volume in Disk Management.", fr: "Convertir F: en volume dynamique dans Gestion des disques." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Data disks can usually be expanded without deallocating the VM, but not across the 4-TiB boundary: a Standard HDD, Standard SSD or Premium SSD of 4 TiB or less must have its VM deallocated and must be detached before it is expanded beyond 4 TiB. After the resize, you reattach the disk, start FS3 and extend F: in Disk Management; GPT already allows more than 2 TiB.
        fr: |
          Les disques de données peuvent en général être agrandis sans libérer la machine virtuelle, mais pas au-delà du seuil de 4 Tio : pour agrandir au-delà de 4 Tio un HDD Standard, un SSD Standard ou un SSD Premium de 4 Tio ou moins, il faut libérer sa machine virtuelle et détacher le disque. Après le redimensionnement, vous rattachez le disque, démarrez FS3 et étendez F: dans Gestion des disques ; GPT permet déjà plus de 2 Tio.
      options:
        a: { en: "The host caching setting doesn't change whether or how a data disk can be expanded.", fr: "Le paramètre de mise en cache de l'hôte ne change pas la possibilité ni la manière d'agrandir un disque de données." }
        c: { en: "The performance tier changes the IOPS and throughput of the disk, not its size, and isn't a prerequisite of the expansion.", fr: "Le niveau de performance modifie les IOPS et le débit du disque, pas sa taille, et n'est pas un prérequis de l'agrandissement." }
        e: { en: "A dynamic volume isn't needed: the basic GPT volume can be extended after the disk grows.", fr: "Un volume dynamique n'est pas nécessaire : le volume de base GPT peut être étendu une fois le disque agrandi." }
    references:
      - title: Expand Virtual Hard Disks Attached to a Windows VM in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/expand-disks
