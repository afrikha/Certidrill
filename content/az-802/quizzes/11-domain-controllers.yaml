chapter: 11-domain-controllers
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-11-01
    objective: "1.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam deploys a read-only domain controller (RODC) named **RODC-NTE** in a branch office. The password replication policy of RODC-NTE keeps its default settings, and no password has been prepopulated. Branch users have been signing in through RODC-NTE for a week.

        Which passwords are stored on RODC-NTE?
      fr: |
        Fabrikam déploie un contrôleur de domaine en lecture seule (RODC) nommé **RODC-NTE** dans une succursale. La stratégie de réplication de mot de passe de RODC-NTE conserve ses paramètres par défaut, et aucun mot de passe n'a été mis en cache à l'avance. Les utilisateurs de la succursale ouvrent une session par RODC-NTE depuis une semaine.

        Quels mots de passe sont stockés sur RODC-NTE ?
    body:
      options:
        - { id: a, text: { en: "The passwords of the users who signed in through RODC-NTE, and the password of its own computer account", fr: "Les mots de passe des utilisateurs qui ont ouvert une session par RODC-NTE, et celui de son propre compte d'ordinateur" } }
        - { id: b, text: { en: "Only the passwords of its own computer account and of its own krbtgt account", fr: "Uniquement les mots de passe de son propre compte d'ordinateur et de son propre compte krbtgt" } }
        - { id: c, text: { en: "The passwords of its own computer account and of the domain-wide krbtgt account", fr: "Les mots de passe de son propre compte d'ordinateur et du compte krbtgt de l'ensemble du domaine" } }
        - { id: d, text: { en: "A read-only copy of the passwords of all the users and computers of the domain", fr: "Une copie en lecture seule des mots de passe de tous les utilisateurs et ordinateurs du domaine" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          By default, the Allowed list of an RODC contains only the Allowed RODC Password Replication Group, which is empty. No user password is therefore cached: the RODC forwards each sign-in to a writable domain controller. The only secrets it holds are those of its own computer account and of its own krbtgt account, so the tickets it issues aren't valid on other domain controllers.
        fr: |
          Par défaut, la liste Autorisés d'un RODC ne contient que le groupe Allowed RODC Password Replication Group, qui est vide. Aucun mot de passe d'utilisateur n'est donc mis en cache : le RODC transmet chaque ouverture de session à un contrôleur de domaine accessible en écriture. Les seuls secrets qu'il détient sont ceux de son propre compte d'ordinateur et de son propre compte krbtgt ; les tickets qu'il émet ne sont donc pas valides sur les autres contrôleurs de domaine.
      options:
        a: { en: "Signing in through the RODC caches a password only if the password replication policy allows it, and the default Allowed group is empty.", fr: "Ouvrir une session par le RODC ne met un mot de passe en cache que si la stratégie de réplication de mot de passe l'autorise, et le groupe Autorisés par défaut est vide." }
        c: { en: "The domain-wide krbtgt account is a member of the Denied RODC Password Replication Group; an RODC uses its own krbtgt account instead.", fr: "Le compte krbtgt de l'ensemble du domaine est membre du groupe Denied RODC Password Replication Group ; un RODC utilise à la place son propre compte krbtgt." }
        d: { en: "An RODC holds a read-only copy of the directory objects, but not their passwords, unless its policy allows them to be cached.", fr: "Un RODC détient une copie en lecture seule des objets de l'annuaire, mais pas leurs mots de passe, sauf si sa stratégie autorise leur mise en cache." }
    references:
      - title: Password Replication Policy
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc730883(v=ws.10)

  # ------------------------------------------------------------------ 2
  - id: az802-qz-11-02
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You plan to promote a member server named **SRV4** to an additional domain controller of the **corp.adatum.com** domain. The AD-Domain-Services role and its management tools are already installed on SRV4.

        Before the maintenance window, you need to check whether the promotion would succeed, without changing anything on SRV4 or in the domain.

        Which cmdlet should you run?
      fr: |
        Vous prévoyez de promouvoir un serveur membre nommé **SRV4** en contrôleur de domaine supplémentaire du domaine **corp.adatum.com**. Le rôle AD-Domain-Services et ses outils de gestion sont déjà installés sur SRV4.

        Avant la fenêtre de maintenance, vous devez vérifier si la promotion réussirait, sans rien modifier sur SRV4 ni dans le domaine.

        Quelle applet de commande devez-vous exécuter ?
    body:
      options:
        - { id: a, text: Test-ADDSDomainInstallation }
        - { id: b, text: Test-ADDSReadOnlyDomainControllerAccountCreation }
        - { id: c, text: Test-ADDSForestInstallation }
        - { id: d, text: Test-ADDSDomainControllerInstallation }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `Test-ADDSDomainControllerInstallation` runs only the prerequisite checks that `Install-ADDSDomainController` performs before it adds a domain controller to an existing domain. It installs nothing, so you can run it ahead of the maintenance window and fix any blocking issue first.
        fr: |
          `Test-ADDSDomainControllerInstallation` exécute uniquement les vérifications des prérequis qu'`Install-ADDSDomainController` effectue avant d'ajouter un contrôleur de domaine à un domaine existant. Elle n'installe rien : vous pouvez donc l'exécuter avant la fenêtre de maintenance et corriger d'abord tout problème bloquant.
      options:
        a: { en: "Test-ADDSDomainInstallation checks the prerequisites for a new child or tree domain, not for an additional domain controller.", fr: "Test-ADDSDomainInstallation vérifie les prérequis d'un nouveau domaine enfant ou d'arborescence, pas ceux d'un contrôleur de domaine supplémentaire." }
        b: { en: "Test-ADDSReadOnlyDomainControllerAccountCreation checks the prerequisites for staging an RODC account, not for promoting a writable domain controller.", fr: "Test-ADDSReadOnlyDomainControllerAccountCreation vérifie les prérequis de la création à l'avance d'un compte de RODC, pas ceux de la promotion d'un contrôleur de domaine accessible en écriture." }
        c: { en: "Test-ADDSForestInstallation checks the prerequisites for the first domain controller of a new forest.", fr: "Test-ADDSForestInstallation vérifie les prérequis du premier contrôleur de domaine d'une nouvelle forêt." }
    references:
      - title: Test-ADDSDomainControllerInstallation (ADDSDeployment)
        url: https://learn.microsoft.com/en-us/powershell/module/addsdeployment/test-addsdomaincontrollerinstallation

  # ------------------------------------------------------------------ 3
  - id: az802-qz-11-03
    objective: "1.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The **corp.contoso.com** domain has a read-only domain controller named **RODC-LIL** in the Lille branch. The Allowed list of RODC-LIL contains a group named **Lille-Staff**, and its Denied list keeps the default entries. A user named **Paul** is a member of Lille-Staff and of several nested groups managed by other teams. Paul has never signed in at the Lille branch.

        You need to determine whether the password of Paul can be cached on RODC-LIL, taking into account all his group memberships.

        Which command should you run?
      fr: |
        Le domaine **corp.contoso.com** possède un contrôleur de domaine en lecture seule nommé **RODC-LIL** dans la succursale de Lille. La liste Autorisés de RODC-LIL contient un groupe nommé **Lille-Staff**, et sa liste Refusés conserve les entrées par défaut. Un utilisateur nommé **Paul** est membre de Lille-Staff et de plusieurs groupes imbriqués gérés par d'autres équipes. Paul n'a jamais ouvert de session dans la succursale de Lille.

        Vous devez déterminer si le mot de passe de Paul peut être mis en cache sur RODC-LIL, en tenant compte de toutes ses appartenances aux groupes.

        Quelle commande devez-vous exécuter ?
    body:
      options:
        - { id: a, text: "`Get-ADDomainControllerPasswordReplicationPolicy -Identity RODC-LIL -Allowed`" }
        - { id: b, text: "`Get-ADDomainControllerPasswordReplicationPolicyUsage -Identity RODC-LIL -RevealedAccounts`" }
        - { id: c, text: "`Get-ADAccountResultantPasswordReplicationPolicy -Identity Paul -DomainController RODC-LIL`" }
        - { id: d, text: "`Get-ADDomainControllerPasswordReplicationPolicyUsage -Identity RODC-LIL -AuthenticatedAccounts`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `Get-ADAccountResultantPasswordReplicationPolicy` returns the resultant policy of one account on one RODC: Allow, DenyExplicit or DenyImplicit. It evaluates the Allowed and Denied lists with all the account's memberships, and a Deny wins over an Allow, which a nested group could cause. It is the PowerShell equivalent of the **Resultant Policy** tab of the RODC account.
        fr: |
          `Get-ADAccountResultantPasswordReplicationPolicy` renvoie la stratégie résultante d'un compte sur un RODC : Allow, DenyExplicit ou DenyImplicit. Elle évalue les listes Autorisés et Refusés avec toutes les appartenances du compte, et un refus l'emporte sur une autorisation, ce qu'un groupe imbriqué pourrait provoquer. C'est l'équivalent PowerShell de l'onglet **Resultant Policy** du compte du RODC.
      options:
        a: { en: "This command returns the entries of the Allowed list, such as Lille-Staff, without expanding them and without evaluating the Denied list.", fr: "Cette commande renvoie les entrées de la liste Autorisés, comme Lille-Staff, sans les développer et sans évaluer la liste Refusés." }
        b: { en: "The revealed accounts are those whose password is already cached; Paul has never signed in at the branch, so he can't appear there yet.", fr: "Les comptes révélés sont ceux dont le mot de passe est déjà mis en cache ; Paul n'a jamais ouvert de session dans la succursale, il ne peut donc pas encore y figurer." }
        d: { en: "The authenticated accounts are those that RODC-LIL has authenticated, cached or not; it says nothing about an account that never signed in there.", fr: "Les comptes authentifiés sont ceux que RODC-LIL a authentifiés, mis en cache ou non ; cela ne dit rien d'un compte qui n'y a jamais ouvert de session." }
    references:
      - title: Get-ADAccountResultantPasswordReplicationPolicy (ActiveDirectory)
        url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-adaccountresultantpasswordreplicationpolicy
      - title: Administering the Password Replication Policy
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc754646(v=ws.10)

  # ------------------------------------------------------------------ 4
  - id: az802-qz-11-04
    objective: "1.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso extends its on-premises domain **corp.contoso.com** to Azure. You deploy a virtual machine named **VM-DC3** that runs Windows Server 2025. In Azure, the network interface of VM-DC3 has the static private IP address 10.1.0.6. Inside Windows, the network adapter obtains this address from the Azure DHCP service. The virtual network uses the on-premises DNS servers.

        When you start the promotion of VM-DC3 to an additional domain controller, the prerequisites check displays a warning that the network adapter has no static IP address assigned.

        What should you do?
      fr: |
        Contoso étend son domaine local **corp.contoso.com** à Azure. Vous déployez une machine virtuelle nommée **VM-DC3** qui exécute Windows Server 2025. Dans Azure, l'interface réseau de VM-DC3 a l'adresse IP privée statique 10.1.0.6. Dans Windows, la carte réseau obtient cette adresse du service DHCP d'Azure. Le réseau virtuel utilise les serveurs DNS locaux.

        Quand vous lancez la promotion de VM-DC3 en contrôleur de domaine supplémentaire, la vérification des prérequis affiche un avertissement indiquant que la carte réseau n'a pas d'adresse IP statique attribuée.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set 10.1.0.6 as a static address in the TCP/IP properties of the Windows network adapter, and then restart the promotion.", fr: "Définir 10.1.0.6 comme adresse statique dans les propriétés TCP/IP de la carte réseau Windows, puis relancer la promotion." } }
        - { id: b, text: { en: "Associate a Standard SKU public IP address with the network interface so that the domain controller keeps a fixed address.", fr: "Associer une adresse IP publique de référence SKU Standard à l'interface réseau pour que le contrôleur de domaine garde une adresse fixe." } }
        - { id: c, text: { en: "Restart the promotion by running Install-ADDSDomainController with the -SkipPreChecks parameter.", fr: "Relancer la promotion en exécutant Install-ADDSDomainController avec le paramètre -SkipPreChecks." } }
        - { id: d, text: { en: "Continue the promotion, because the address is already static in the configuration of the Azure network interface.", fr: "Poursuivre la promotion, car l'adresse est déjà statique dans la configuration de l'interface réseau Azure." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          For a domain controller in Azure, the static private IP address is set on the network interface in Azure, and the Azure DHCP service always delivers that address to the guest. The prerequisites check only sees a DHCP-configured adapter, and Microsoft states that this warning can be safely ignored. The promotion can continue.
        fr: |
          Pour un contrôleur de domaine dans Azure, l'adresse IP privée statique se définit sur l'interface réseau dans Azure, et le service DHCP d'Azure fournit toujours cette adresse à l'invité. La vérification des prérequis ne voit qu'une carte configurée par DHCP, et Microsoft indique que cet avertissement peut être ignoré sans risque. La promotion peut continuer.
      options:
        a: { en: "Microsoft advises never to set the IP address manually inside the guest operating system of an Azure VM unless it's necessary, which isn't the case here.", fr: "Microsoft recommande de ne jamais définir l'adresse IP manuellement dans le système d'exploitation invité d'une machine virtuelle Azure, sauf si c'est nécessaire, ce qui n'est pas le cas ici." }
        b: { en: "A domain controller must not have a public IP address, and a public address doesn't change what the guest adapter reports.", fr: "Un contrôleur de domaine ne doit pas avoir d'adresse IP publique, et une adresse publique ne change pas ce que signale la carte de l'invité." }
        c: { en: "The warning doesn't block the promotion; skipping every prerequisite check is discouraged and would also hide real problems.", fr: "L'avertissement ne bloque pas la promotion ; ignorer toutes les vérifications des prérequis est déconseillé et masquerait aussi de vrais problèmes." }
    references:
      - title: Install Active Directory Domain Services on an Azure virtual machine
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/virtual-dc/adds-on-azure-vm
      - title: Configure IP addresses for an Azure network interface
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/virtual-network-network-interface-addresses

  # ------------------------------------------------------------------ 5
  - id: az802-qz-11-05
    objective: "1.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The **corp.wingtiptoys.com** domain has three domain controllers. **DC1** holds the RID master and infrastructure master roles, and **DC2** holds the PDC emulator role. This morning, DC1 stopped because of a power supply failure. The hardware vendor will replace the part tomorrow, and DC1 will return with its current disks.

        DC2 and DC3 have most of their current RID pool available, and no domain controller promotion or domain change is planned this week. Users report no problem.

        You need to keep the domain healthy while minimizing risk and administrative effort. What should you do?
      fr: |
        Le domaine **corp.wingtiptoys.com** possède trois contrôleurs de domaine. **DC1** détient les rôles de maître RID et de maître d'infrastructure, et **DC2** le rôle d'émulateur PDC. Ce matin, DC1 s'est arrêté à cause d'une panne d'alimentation. Le fournisseur du matériel remplacera la pièce demain, et DC1 reviendra avec ses disques actuels.

        DC2 et DC3 disposent encore de la plus grande partie de leur pool RID actuel, et aucune promotion de contrôleur de domaine ni aucune modification de domaine n'est prévue cette semaine. Les utilisateurs ne signalent aucun problème.

        Vous devez maintenir le domaine en bon état tout en réduisant au minimum les risques et l'effort administratif. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Seize the RID master and infrastructure master roles on DC2 now, and transfer them back to DC1 when it returns.", fr: "Prendre maintenant les rôles de maître RID et de maître d'infrastructure sur DC2, puis les retransférer à DC1 à son retour." } }
        - { id: b, text: { en: "Transfer the RID master and infrastructure master roles to DC2 by using Active Directory Users and Computers.", fr: "Transférer les rôles de maître RID et de maître d'infrastructure vers DC2 à l'aide d'Utilisateurs et ordinateurs Active Directory." } }
        - { id: c, text: { en: "Wait for DC1 to be repaired, and leave the RID master and infrastructure master roles on DC1.", fr: "Attendre la réparation de DC1, et laisser les rôles de maître RID et de maître d'infrastructure sur DC1." } }
        - { id: d, text: { en: "Seize the RID master and infrastructure master roles on DC2 now, and reconnect DC1 to the network as a member server.", fr: "Prendre maintenant les rôles de maître RID et de maître d'infrastructure sur DC2, puis reconnecter DC1 au réseau comme serveur membre." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Roles don't move when a domain controller stops, and a holder that returns soon doesn't justify a seizure. The other domain controllers keep creating objects from their current RID pools, and stale cross-domain references can wait a day. Seizing is meant for a holder that won't return, because the old holder must then never come back with its database.
        fr: |
          Les rôles ne se déplacent pas quand un contrôleur de domaine s'arrête, et un détenteur qui revient bientôt ne justifie pas une prise de rôle. Les autres contrôleurs de domaine continuent de créer des objets à partir de leur pool RID actuel, et des références interdomaines obsolètes peuvent attendre un jour. La prise de rôle est réservée à un détenteur qui ne reviendra pas, car l'ancien détenteur ne doit alors jamais revenir avec sa base de données.
      options:
        a: { en: "After a seizure, DC1 must never come back with its old database; it must be reinstalled and its metadata cleaned up, which is far more effort.", fr: "Après une prise de rôle, DC1 ne doit jamais revenir avec son ancienne base de données ; il faut le réinstaller et nettoyer ses métadonnées, ce qui demande bien plus d'effort." }
        b: { en: "A transfer needs both domain controllers online; DC1 is down, so the transfer fails.", fr: "Un transfert exige que les deux contrôleurs de domaine soient en ligne ; DC1 est arrêté, le transfert échoue donc." }
        d: { en: "DC1 would still be a domain controller that believes it holds the roles; making it a member server requires a forced demotion and a metadata cleanup.", fr: "DC1 resterait un contrôleur de domaine qui se croit détenteur des rôles ; en faire un serveur membre exige une rétrogradation forcée et un nettoyage des métadonnées." }
    references:
      - title: Transfer or seize Operation Master roles in Active Directory Domain Services
        url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/transfer-or-seize-operation-master-roles-in-ad-ds
      - title: Active Directory Flexible Single Master Operation (FSMO) roles in Windows
        url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/fsmo-roles

  # ------------------------------------------------------------------ 6
  - id: az802-qz-11-06
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        The **corp.litware.com** domain has five read-only domain controllers (RODCs) in branch offices. For a new branch in Bordeaux, a domain administrator ran the following command on DC1:

        `Add-ADDSReadOnlyDomainControllerAccount -DomainControllerAccountName "RODC-BDX" -DomainName "corp.litware.com" -SiteName "Bordeaux" -DelegatedAdministratorAccountName "LITWARE\Bordeaux-IT"`

        A technician named Tech1 is a member of Bordeaux-IT and of no other administrative group. Tech1 receives a new server whose computer name is **BDX-SRV01**. The server runs Windows Server 2025, is in a workgroup, has an IP address of the Bordeaux subnet and can reach DC1. Tech1 installs the AD-Domain-Services role and runs:

        `Install-ADDSDomainController -DomainName "corp.litware.com" -UseExistingAccount -Credential (Get-Credential "LITWARE\Tech1")`

        The prerequisites check fails. You need Tech1 to complete the deployment by using the account created on DC1.

        What should Tech1 do first?
      fr: |
        Le domaine **corp.litware.com** possède cinq contrôleurs de domaine en lecture seule (RODC) dans des succursales. Pour une nouvelle succursale à Bordeaux, un administrateur du domaine a exécuté la commande suivante sur DC1 :

        `Add-ADDSReadOnlyDomainControllerAccount -DomainControllerAccountName "RODC-BDX" -DomainName "corp.litware.com" -SiteName "Bordeaux" -DelegatedAdministratorAccountName "LITWARE\Bordeaux-IT"`

        Un technicien nommé Tech1 est membre de Bordeaux-IT et d'aucun autre groupe d'administration. Tech1 reçoit un nouveau serveur dont le nom d'ordinateur est **BDX-SRV01**. Le serveur exécute Windows Server 2025, est dans un groupe de travail, a une adresse IP du sous-réseau de Bordeaux et peut joindre DC1. Tech1 installe le rôle AD-Domain-Services et exécute :

        `Install-ADDSDomainController -DomainName "corp.litware.com" -UseExistingAccount -Credential (Get-Credential "LITWARE\Tech1")`

        La vérification des prérequis échoue. Vous devez faire en sorte que Tech1 termine le déploiement en utilisant le compte créé sur DC1.

        Que doit faire Tech1 en premier ?
    body:
      options:
        - { id: a, text: { en: "Run adprep /rodcprep from the Windows Server 2025 installation media.", fr: "Exécuter adprep /rodcprep depuis le support d'installation de Windows Server 2025." } }
        - { id: b, text: { en: "Ask a domain administrator to add Tech1 to the Domain Admins group temporarily.", fr: "Demander à un administrateur du domaine d'ajouter temporairement Tech1 au groupe Domain Admins." } }
        - { id: c, text: { en: "Replace -UseExistingAccount with -ReadOnlyReplica -SiteName \"Bordeaux\" in the command.", fr: "Remplacer -UseExistingAccount par -ReadOnlyReplica -SiteName \"Bordeaux\" dans la commande." } }
        - { id: d, text: { en: "Rename the server RODC-BDX, restart it, and then run the same command again.", fr: "Renommer le serveur en RODC-BDX, le redémarrer, puis exécuter à nouveau la même commande." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A staged RODC account is attached by a server that has the same computer name as the account; otherwise the installation doesn't find the account to use. BDX-SRV01 doesn't match RODC-BDX, so Tech1 must rename the server first. Because Bordeaux-IT is the delegated administrator of the account, Tech1 can then attach the server without any domain-wide right.
        fr: |
          Un compte de RODC créé à l'avance est attaché par un serveur qui a le même nom d'ordinateur que le compte ; sinon, l'installation ne trouve pas le compte à utiliser. BDX-SRV01 ne correspond pas à RODC-BDX : Tech1 doit donc d'abord renommer le serveur. Comme Bordeaux-IT est l'administrateur délégué du compte, Tech1 peut ensuite attacher le serveur sans aucun droit sur le domaine.
      options:
        a: { en: "The domain already has RODCs, so adprep /rodcprep has already run in the forest; it isn't the cause of the failure.", fr: "Le domaine possède déjà des RODC : adprep /rodcprep a donc déjà été exécuté dans la forêt ; ce n'est pas la cause de l'échec." }
        b: { en: "The delegated administrator of a staged account can attach the server without Domain Admins membership; the rights aren't the problem.", fr: "L'administrateur délégué d'un compte créé à l'avance peut attacher le serveur sans appartenir à Domain Admins ; les droits ne sont pas le problème." }
        c: { en: "-ReadOnlyReplica performs an unstaged installation, which requires Domain Admins and ignores the account prepared with its delegation and policy.", fr: "-ReadOnlyReplica effectue une installation sans préparation, qui exige Domain Admins et ignore le compte préparé avec sa délégation et sa stratégie." }
    references:
      - title: Install a Windows Server 2012 Active Directory Read-Only Domain Controller (RODC) (Level 200)
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/rodc/install-a-windows-server-2012-active-directory-read-only-domain-controller--rodc---level-200-
      - title: Install-ADDSDomainController (ADDSDeployment)
        url: https://learn.microsoft.com/en-us/powershell/module/addsdeployment/install-addsdomaincontroller

  # ------------------------------------------------------------------ 7
  - id: az802-qz-11-07
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        The **corp.fabrikam.com** domain has a read-only domain controller named **RODC-NTE** in the Nantes branch. RODC-NTE is a DNS server and a global catalog server. Its password replication policy is the following:

        - Allowed list: Allowed RODC Password Replication Group (no members) and a group named **Nantes-Users**, which contains the 60 users of the branch
        - Denied list: the default entries

        The computer accounts of the branch workstations are members of a group named **Nantes-Computers**. The revealed accounts of RODC-NTE include every member of Nantes-Users. During a WAN outage last week, branch users couldn't sign in to their workstations, although they had all signed in during the previous days.

        A new WAN maintenance is planned for tomorrow. You need to ensure that branch users can sign in during the outage. The passwords of the branch accounts must not be cacheable on any other RODC.

        What should you do?
      fr: |
        Le domaine **corp.fabrikam.com** possède un contrôleur de domaine en lecture seule nommé **RODC-NTE** dans la succursale de Nantes. RODC-NTE est un serveur DNS et un serveur de catalogue global. Sa stratégie de réplication de mot de passe est la suivante :

        - Liste Autorisés : Allowed RODC Password Replication Group (sans membre) et un groupe nommé **Nantes-Users**, qui contient les 60 utilisateurs de la succursale
        - Liste Refusés : les entrées par défaut

        Les comptes d'ordinateur des postes de travail de la succursale sont membres d'un groupe nommé **Nantes-Computers**. Les comptes révélés de RODC-NTE incluent tous les membres de Nantes-Users. Pendant une coupure WAN la semaine dernière, les utilisateurs de la succursale n'ont pas pu ouvrir de session sur leurs postes de travail, alors qu'ils en avaient tous ouvert une les jours précédents.

        Une nouvelle maintenance WAN est prévue demain. Vous devez faire en sorte que les utilisateurs de la succursale puissent ouvrir une session pendant la coupure. Les mots de passe des comptes de la succursale ne doivent pouvoir être mis en cache sur aucun autre RODC.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add Nantes-Computers to the Allowed RODC Password Replication Group, and then prepopulate the passwords of its members on RODC-NTE.", fr: "Ajouter Nantes-Computers au groupe Allowed RODC Password Replication Group, puis mettre en cache à l'avance les mots de passe de ses membres sur RODC-NTE." } }
        - { id: b, text: { en: "Prepopulate the passwords of the members of Nantes-Users and Nantes-Computers on RODC-NTE, without changing its password replication policy.", fr: "Mettre en cache à l'avance sur RODC-NTE les mots de passe des membres de Nantes-Users et de Nantes-Computers, sans modifier sa stratégie de réplication de mot de passe." } }
        - { id: c, text: { en: "Add Nantes-Computers to the Allowed list of RODC-NTE, and then prepopulate the passwords of its members on RODC-NTE.", fr: "Ajouter Nantes-Computers à la liste Autorisés de RODC-NTE, puis mettre en cache à l'avance les mots de passe de ses membres sur RODC-NTE." } }
        - { id: d, text: { en: "Enable universal group membership caching for the Nantes site so that RODC-NTE can process sign-ins without the hub.", fr: "Activer la mise en cache de l'appartenance aux groupes universels pour le site de Nantes afin que RODC-NTE puisse traiter les ouvertures de session sans le site central." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          When no writable domain controller is reachable, a user can sign in through an RODC only if the passwords of both the user account and the computer account of the workstation are cached. The users are cached, but Nantes-Computers isn't allowed, so the workstations can't authenticate. Adding the group to the Allowed list of RODC-NTE alone keeps the other RODCs unaffected, and prepopulating caches the computer passwords before tomorrow's outage.
        fr: |
          Quand aucun contrôleur de domaine accessible en écriture n'est joignable, un utilisateur ne peut ouvrir une session par un RODC que si les mots de passe du compte d'utilisateur et du compte d'ordinateur du poste de travail sont tous deux en cache. Les utilisateurs sont en cache, mais Nantes-Computers n'est pas autorisé : les postes de travail ne peuvent pas s'authentifier. Ajouter le groupe à la seule liste Autorisés de RODC-NTE n'affecte pas les autres RODC, et la mise en cache à l'avance stocke les mots de passe des ordinateurs avant la coupure de demain.
      options:
        a: { en: "The Allowed RODC Password Replication Group is in the Allowed list of every RODC by default, so the computer passwords would become cacheable on the other RODCs.", fr: "Le groupe Allowed RODC Password Replication Group figure par défaut dans la liste Autorisés de chaque RODC : les mots de passe des ordinateurs pourraient donc être mis en cache sur les autres RODC." }
        b: { en: "Prepopulation works only for accounts that the password replication policy allows; it fails for the computer accounts, which aren't allowed.", fr: "La mise en cache à l'avance ne fonctionne que pour les comptes que la stratégie de réplication de mot de passe autorise ; elle échoue pour les comptes d'ordinateur, qui ne sont pas autorisés." }
        d: { en: "RODC-NTE is already a global catalog server, so universal group memberships aren't the problem; the missing cached credentials are those of the computers.", fr: "RODC-NTE est déjà un serveur de catalogue global : l'appartenance aux groupes universels n'est donc pas le problème ; les informations d'identification manquantes sont celles des ordinateurs." }
    references:
      - title: Administering the Password Replication Policy
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc754646(v=ws.10)
      - title: Password Replication Policy
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc730883(v=ws.10)

  # ------------------------------------------------------------------ 8
  - id: az802-qz-11-08
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        The **contoso.com** forest contains the forest root domain contoso.com and a child domain named **eu.contoso.com**. All six domain controllers of the forest run Windows Server 2022, and the domain and forest functional levels are Windows Server 2016. All the operation master role holders are online.

        You are a member of the Domain Admins group of eu.contoso.com only. An administrator named Admin-Root, a member of Schema Admins, Enterprise Admins and Domain Admins of contoso.com, can run commands for you.

        You need to make **SRV-EU5**, a member server of eu.contoso.com that runs Windows Server 2025, an additional domain controller of eu.contoso.com. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        La forêt **contoso.com** contient le domaine racine de la forêt contoso.com et un domaine enfant nommé **eu.contoso.com**. Les six contrôleurs de domaine de la forêt exécutent tous Windows Server 2022, et les niveaux fonctionnels du domaine et de la forêt sont Windows Server 2016. Tous les détenteurs de rôles de maître d'opérations sont en ligne.

        Vous êtes membre du groupe Domain Admins d'eu.contoso.com uniquement. Un administrateur nommé Admin-Root, membre de Schema Admins, d'Enterprise Admins et de Domain Admins de contoso.com, peut exécuter des commandes pour vous.

        Vous devez faire de **SRV-EU5**, un serveur membre d'eu.contoso.com qui exécute Windows Server 2025, un contrôleur de domaine supplémentaire d'eu.contoso.com. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Ask Admin-Root to add your account to Enterprise Admins temporarily, and then promote SRV-EU5 with your account.", fr: "Demander à Admin-Root d'ajouter temporairement votre compte à Enterprise Admins, puis promouvoir SRV-EU5 avec votre compte." } }
        - { id: b, text: { en: "Ask Admin-Root to run adprep /forestprep from the Windows Server 2025 media, and then promote SRV-EU5 with your account.", fr: "Demander à Admin-Root d'exécuter adprep /forestprep depuis le support de Windows Server 2025, puis promouvoir SRV-EU5 avec votre compte." } }
        - { id: c, text: { en: "Run adprep /domainprep in eu.contoso.com from the Windows Server 2025 media, and then promote SRV-EU5 with your account.", fr: "Exécuter adprep /domainprep dans eu.contoso.com depuis le support de Windows Server 2025, puis promouvoir SRV-EU5 avec votre compte." } }
        - { id: d, text: { en: "Ask Admin-Root to raise the forest functional level to Windows Server 2025, and then promote SRV-EU5 with your account.", fr: "Demander à Admin-Root d'élever le niveau fonctionnel de la forêt à Windows Server 2025, puis promouvoir SRV-EU5 avec votre compte." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          SRV-EU5 is the first Windows Server 2025 domain controller of the forest, so the forest must be prepared with adprep /forestprep, which requires Schema Admins, Enterprise Admins and Domain Admins memberships. The promotion runs adprep automatically, but only with credentials that have those memberships, and yours don't. Once Admin-Root has prepared the forest, your Domain Admins membership in eu.contoso.com is enough to promote SRV-EU5, and the domain preparation runs automatically.
        fr: |
          SRV-EU5 est le premier contrôleur de domaine Windows Server 2025 de la forêt : la forêt doit donc être préparée par adprep /forestprep, qui exige l'appartenance à Schema Admins, à Enterprise Admins et à Domain Admins. La promotion exécute adprep automatiquement, mais seulement avec des informations d'identification qui disposent de ces appartenances, ce qui n'est pas le cas des vôtres. Une fois la forêt préparée par Admin-Root, votre appartenance à Domain Admins d'eu.contoso.com suffit pour promouvoir SRV-EU5, et la préparation du domaine s'exécute automatiquement.
      options:
        a: { en: "Enterprise Admins alone isn't enough to prepare the forest, which also requires Schema Admins, and it grants your account forest-wide rights.", fr: "Enterprise Admins seul ne suffit pas pour préparer la forêt, qui exige aussi Schema Admins, et ce groupe donne à votre compte des droits sur toute la forêt." }
        c: { en: "The domain can be prepared only after the forest; without adprep /forestprep, the promotion of SRV-EU5 still fails.", fr: "Le domaine ne peut être préparé qu'après la forêt ; sans adprep /forestprep, la promotion de SRV-EU5 échoue toujours." }
        d: { en: "The Windows Server 2025 functional level requires every domain controller to run Windows Server 2025, and the functional level doesn't extend the schema.", fr: "Le niveau fonctionnel Windows Server 2025 exige que tous les contrôleurs de domaine exécutent Windows Server 2025, et le niveau fonctionnel n'étend pas le schéma." }
    references:
      - title: Upgrade domain controllers to a newer version of Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/upgrade-domain-controllers
      - title: Active Directory Domain Services Functional Levels
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/active-directory-functional-levels

  # ------------------------------------------------------------------ 9
  - id: az802-qz-11-09
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys has a test domain named **lab.tailspin.com**. Its only two domain controllers, **VM-DC1** and **VM-DC2**, run as Azure virtual machines in the same virtual network.

        To reduce costs, an Azure Automation runbook stops and deallocates both virtual machines at 20:00 every day by running `Stop-AzVM`. The runbook starts VM-DC1 at 07:00 and VM-DC2 at 07:15.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un domaine de test nommé **lab.tailspin.com**. Ses deux seuls contrôleurs de domaine, **VM-DC1** et **VM-DC2**, s'exécutent comme machines virtuelles Azure dans le même réseau virtuel.

        Pour réduire les coûts, un runbook Azure Automation arrête et libère les deux machines virtuelles à 20:00 chaque jour en exécutant `Stop-AzVM`. Le runbook démarre VM-DC1 à 07:00 et VM-DC2 à 07:15.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Each morning, VM-DC1 and VM-DC2 discard their current RID pool.", fr: "Chaque matin, VM-DC1 et VM-DC2 abandonnent leur pool RID actuel." }
        - id: s2
          text: { en: "Because VM-DC1 starts 15 minutes earlier, VM-DC2 resynchronizes its SYSVOL folder from VM-DC1 without manual intervention.", fr: "Comme VM-DC1 démarre 15 minutes plus tôt, VM-DC2 resynchronise son dossier SYSVOL depuis VM-DC1 sans intervention manuelle." }
        - id: s3
          text: { en: "If the runbook deallocated only VM-DC2 and left VM-DC1 running, VM-DC2 could resynchronize its SYSVOL folder from VM-DC1 after each start.", fr: "Si le runbook ne libérait que VM-DC2 et laissait VM-DC1 en fonctionnement, VM-DC2 pourrait resynchroniser son dossier SYSVOL depuis VM-DC1 après chaque démarrage." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Deallocating a domain controller VM resets its VM-Generation ID. At restart, the domain controller resets its invocation ID, discards its RID pool and marks SYSVOL as nonauthoritative, which is benign only while an authoritative domain controller is available. When every domain controller of a domain is deallocated at the same time, none of them finds an authoritative replica at restart, whatever the start order, and manual intervention is required. With VM-DC1 left running, VM-DC2 has an authoritative partner.
        fr: |
          Libérer la machine virtuelle d'un contrôleur de domaine réinitialise son VM-Generation ID. Au redémarrage, le contrôleur de domaine réinitialise son ID d'invocation, abandonne son pool RID et marque SYSVOL comme non autoritaire, ce qui n'est bénin que si un contrôleur de domaine faisant autorité est disponible. Quand tous les contrôleurs de domaine d'un domaine sont libérés en même temps, aucun ne trouve de réplica faisant autorité au redémarrage, quel que soit l'ordre de démarrage, et une intervention manuelle est nécessaire. Avec VM-DC1 laissée en fonctionnement, VM-DC2 dispose d'un partenaire faisant autorité.
      options:
        s2: { en: "VM-DC1 was deallocated too, so its SYSVOL is also nonauthoritative: starting it first doesn't give VM-DC2 an authoritative replica.", fr: "VM-DC1 a aussi été libérée : son SYSVOL est donc également non autoritaire, et la démarrer en premier ne donne pas à VM-DC2 de réplica faisant autorité." }
    references:
      - title: Deploy AD DS in an Azure Virtual Network - Azure Architecture Center
        url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/identity/adds-extend-domain
      - title: Safely virtualizing Active Directory Domain Services (AD DS)
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/introduction-to-active-directory-domain-services-ad-ds-virtualization-level-100

  # ------------------------------------------------------------------ 10
  - id: az802-qz-11-10
    objective: "1.1.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        The **contoso.com** forest contains the domains contoso.com and **eu.contoso.com**. All the domain controllers run Windows Server 2022, and no Windows Server 2025 server is involved. The following table shows the domain controllers.

        | Name | Domain | Operation master roles | State |
        | --- | --- | --- | --- |
        | DC1 | contoso.com | Schema master, RID master | Offline since this morning |
        | DC2 | contoso.com | Domain naming master, PDC emulator, infrastructure master | Online |
        | DC3 | contoso.com | None | Online |
        | EU-DC1 | eu.contoso.com | PDC emulator, RID master, infrastructure master | Online |

        DC2 and DC3 have most of their current RID pool available. Today, you must perform the operations listed below.

        Which two operations will fail until DC1 is back online or its roles are moved?

        NOTE: Each correct selection is worth one point.
      fr: |
        La forêt **contoso.com** contient les domaines contoso.com et **eu.contoso.com**. Tous les contrôleurs de domaine exécutent Windows Server 2022, et aucun serveur Windows Server 2025 n'est concerné. Le tableau suivant présente les contrôleurs de domaine.

        | Nom | Domaine | Rôles de maître d'opérations | État |
        | --- | --- | --- | --- |
        | DC1 | contoso.com | Maître de schéma, maître RID | Hors connexion depuis ce matin |
        | DC2 | contoso.com | Maître d'attribution de noms de domaine, émulateur PDC, maître d'infrastructure | En ligne |
        | DC3 | contoso.com | Aucun | En ligne |
        | EU-DC1 | eu.contoso.com | Émulateur PDC, maître RID, maître d'infrastructure | En ligne |

        DC2 et DC3 disposent encore de la plus grande partie de leur pool RID actuel. Aujourd'hui, vous devez effectuer les opérations ci-dessous.

        Quelles sont les deux opérations qui échoueront tant que DC1 ne sera pas de nouveau en ligne ou que ses rôles n'auront pas été déplacés ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create 20 user accounts in contoso.com on DC3", fr: "Créer 20 comptes d'utilisateur dans contoso.com sur DC3" } }
        - { id: b, text: { en: "Promote a member server to an additional domain controller of contoso.com", fr: "Promouvoir un serveur membre en contrôleur de domaine supplémentaire de contoso.com" } }
        - { id: c, text: { en: "Promote a member server to an additional domain controller of eu.contoso.com", fr: "Promouvoir un serveur membre en contrôleur de domaine supplémentaire d'eu.contoso.com" } }
        - { id: d, text: { en: "Install an application that adds new attributes to the directory schema", fr: "Installer une application qui ajoute de nouveaux attributs au schéma de l'annuaire" } }
        - { id: e, text: { en: "Transfer the PDC emulator role of contoso.com from DC2 to DC3", fr: "Transférer le rôle d'émulateur PDC de contoso.com de DC2 vers DC3" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Every domain controller installation needs to contact the RID master of its domain, and the RID master of contoso.com is DC1, so the promotion in contoso.com fails. Schema changes can only be written on the schema master, also DC1, so the application can't extend the schema. The other operations don't depend on DC1's roles.
        fr: |
          Toute installation de contrôleur de domaine doit contacter le maître RID de son domaine, et le maître RID de contoso.com est DC1 : la promotion dans contoso.com échoue donc. Les modifications du schéma ne peuvent être écrites que sur le maître de schéma, qui est aussi DC1 : l'application ne peut donc pas étendre le schéma. Les autres opérations ne dépendent pas des rôles de DC1.
      options:
        a: { en: "DC3 creates the accounts from its current RID pool; the RID master is needed only when a domain controller requests a new pool.", fr: "DC3 crée les comptes à partir de son pool RID actuel ; le maître RID n'est nécessaire que lorsqu'un contrôleur de domaine demande un nouveau pool." }
        c: { en: "A promotion in eu.contoso.com needs the RID master of eu.contoso.com, EU-DC1, which is online; no schema update is needed with the same Windows Server version.", fr: "Une promotion dans eu.contoso.com a besoin du maître RID d'eu.contoso.com, EU-DC1, qui est en ligne ; aucune mise à jour du schéma n'est nécessaire avec la même version de Windows Server." }
        e: { en: "A transfer needs only the current holder and the new holder to be online; DC2 and DC3 are both online.", fr: "Un transfert exige seulement que le détenteur actuel et le nouveau détenteur soient en ligne ; DC2 et DC3 le sont tous les deux." }
    references:
      - title: Active Directory Flexible Single Master Operation (FSMO) roles in Windows
        url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/fsmo-roles
      - title: Upgrade domain controllers to a newer version of Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/upgrade-domain-controllers
