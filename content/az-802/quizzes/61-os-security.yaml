chapter: 61-os-security
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-61-01
    objective: "6.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A member server named **APP3** runs Windows Server 2025 in the contoso.com domain, and Credential Guard is running on APP3. Domain users and local users sign in to APP3 every day.

        Which secrets does Credential Guard isolate on APP3?
      fr: |
        Un serveur membre nommé **APP3** exécute Windows Server 2025 dans le domaine contoso.com, et Credential Guard s'exécute sur APP3. Des utilisateurs du domaine et des utilisateurs locaux ouvrent une session sur APP3 tous les jours.

        Quels secrets Credential Guard isole-t-il sur APP3 ?
    body:
      options:
        - { id: a, text: { en: "The password hashes of the local accounts, stored in the SAM database of APP3", fr: "Les hachages de mots de passe des comptes locaux, stockés dans la base de données SAM d'APP3" } }
        - { id: b, text: { en: "The NTLM password hashes and Kerberos TGTs of the users who sign in to APP3", fr: "Les hachages de mots de passe NTLM et les tickets TGT Kerberos des utilisateurs qui ouvrent une session sur APP3" } }
        - { id: c, text: { en: "The copies of the password hashes stored in the AD DS database of the domain", fr: "Les copies des hachages de mots de passe stockées dans la base de données AD DS du domaine" } }
        - { id: d, text: { en: "The credentials that users delegate to APP3 through CredSSP for Remote Desktop", fr: "Les informations d'identification que les utilisateurs délèguent à APP3 par CredSSP pour le Bureau à distance" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Credential Guard uses virtualization-based security to protect NTLM password hashes, Kerberos ticket-granting tickets and credentials stored by applications as domain credentials. Code running in the normal operating system, even with administrative privileges, can't read them, which blocks pass-the-hash and pass-the-ticket attacks.
        fr: |
          Credential Guard utilise la sécurité basée sur la virtualisation pour protéger les hachages de mots de passe NTLM, les tickets TGT (ticket-granting tickets) Kerberos et les informations d'identification que les applications stockent comme informations d'identification de domaine. Du code qui s'exécute dans le système d'exploitation normal, même avec des privilèges d'administrateur, ne peut pas les lire, ce qui bloque les attaques pass-the-hash et pass-the-ticket.
      options:
        a: { en: "Credential Guard doesn't protect the Security Accounts Manager (SAM) database of local accounts.", fr: "Credential Guard ne protège pas la base de données SAM (Security Accounts Manager) des comptes locaux." }
        c: { en: "Credential Guard doesn't protect the Active Directory database, and APP3 isn't a domain controller anyway.", fr: "Credential Guard ne protège pas la base de données Active Directory, et APP3 n'est de toute façon pas un contrôleur de domaine." }
        d: { en: "CredSSP can't use the credentials that Credential Guard protects; users must type credentials again, and those aren't isolated.", fr: "CredSSP ne peut pas utiliser les informations d'identification protégées par Credential Guard ; les utilisateurs doivent les saisir de nouveau, et elles ne sont pas isolées." }
    references:
      - title: Credential Guard
        url: https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/

  # ------------------------------------------------------------------ 2
  - id: az802-qz-61-02
    objective: "6.1.8"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware has an Azure subscription named **Sub1** that contains 25 Azure virtual machines running Windows Server 2025. Microsoft Defender for Servers Plan 1 is enabled on Sub1.

        The security team needs file integrity monitoring on all the virtual machines.

        What should you do?
      fr: |
        Litware dispose d'un abonnement Azure nommé **Sub1** qui contient 25 machines virtuelles Azure exécutant Windows Server 2025. Microsoft Defender for Servers Plan 1 est activé sur Sub1.

        L'équipe sécurité a besoin de la supervision de l'intégrité des fichiers sur toutes les machines virtuelles.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Onboard the virtual machines to Azure Arc.", fr: "Intégrer les machines virtuelles à Azure Arc." } }
        - { id: b, text: { en: "Enable just-in-time VM access on the virtual machines.", fr: "Activer l'accès juste-à-temps aux machines virtuelles." } }
        - { id: c, text: { en: "Change the Defender for Servers plan of Sub1 to Plan 2.", fr: "Passer le plan Defender for Servers de Sub1 au Plan 2." } }
        - { id: d, text: { en: "Turn on agent-based vulnerability scanning in Plan 1.", fr: "Activer l'analyse des vulnérabilités avec agent dans le Plan 1." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          File integrity monitoring is a Defender for Servers Plan 2 feature; Plan 1 doesn't include it. Switching the subscription to Plan 2 adds it, together with agentless scanning, just-in-time VM access and 500 MB of free daily data ingestion.
        fr: |
          La supervision de l'intégrité des fichiers est une fonctionnalité du Plan 2 de Defender for Servers ; le Plan 1 ne l'inclut pas. Passer l'abonnement au Plan 2 l'ajoute, ainsi que l'analyse sans agent, l'accès juste-à-temps aux machines virtuelles et 500 Mo d'ingestion de données gratuite par jour.
      options:
        a: { en: "Azure Arc connects machines outside Azure; Azure virtual machines are already protected without it, and Arc doesn't add Plan 2 features.", fr: "Azure Arc connecte des machines situées hors d'Azure ; les machines virtuelles Azure sont déjà protégées sans lui, et Arc n'ajoute pas les fonctionnalités du Plan 2." }
        b: { en: "Just-in-time VM access controls management ports; it doesn't monitor file changes, and it's also a Plan 2 feature.", fr: "L'accès juste-à-temps contrôle les ports de gestion ; il ne surveille pas les modifications de fichiers, et c'est aussi une fonctionnalité du Plan 2." }
        d: { en: "Agent-based vulnerability scanning finds missing updates and weaknesses; it doesn't track changes to files.", fr: "L'analyse des vulnérabilités avec agent détecte les mises à jour manquantes et les faiblesses ; elle ne suit pas les modifications des fichiers." }
    references:
      - title: Defender for Servers
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview

  # ------------------------------------------------------------------ 3
  - id: az802-qz-61-03
    objective: "6.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Your network contains an AD DS domain named fabrikam.com. You edit a GPO named **GPO-RDS** that applies to Remote Desktop Session Host servers running Windows Server 2025 and Microsoft Edge. Users of these servers must not be able to continue to a website that Microsoft Defender SmartScreen flags as potentially malicious in Edge.

        In the Group Policy Management Editor, **Computer Configuration > Policies > Administrative Templates** shows no **Microsoft Edge** node.

        What should you do first?
      fr: |
        Votre réseau contient un domaine AD DS nommé fabrikam.com. Vous modifiez un GPO nommé **GPO-RDS** qui s'applique à des serveurs hôtes de session Bureau à distance exécutant Windows Server 2025 et Microsoft Edge. Les utilisateurs de ces serveurs ne doivent pas pouvoir poursuivre vers un site web que Microsoft Defender SmartScreen signale comme potentiellement malveillant dans Edge.

        Dans l'Éditeur de gestion des stratégies de groupe, **Configuration ordinateur > Stratégies > Modèles d'administration** n'affiche aucun nœud **Microsoft Edge**.

        Que devez-vous faire en premier ?
    body:
      options:
        - { id: a, text: { en: "Enable Configure Windows Defender SmartScreen under Windows Components > Windows Defender SmartScreen > Explorer, with Warn and prevent bypass.", fr: "Activer Configure Windows Defender SmartScreen sous Windows Components > Windows Defender SmartScreen > Explorer, avec Warn and prevent bypass." } }
        - { id: b, text: { en: "Enable Configure App Install Control under Windows Components > Windows Defender SmartScreen > Explorer.", fr: "Activer Configure App Install Control sous Windows Components > Windows Defender SmartScreen > Explorer." } }
        - { id: c, text: { en: "Run gpupdate /force on the domain controller, and then reopen the Group Policy Management Editor.", fr: "Exécuter gpupdate /force sur le contrôleur de domaine, puis rouvrir l'Éditeur de gestion des stratégies de groupe." } }
        - { id: d, text: { en: "Download the Microsoft Edge policy templates, and copy msedge.admx and msedge.adml to the Central Store.", fr: "Télécharger les modèles de stratégie Microsoft Edge, et copier msedge.admx et msedge.adml dans le magasin central." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The Edge SmartScreen settings, including **Prevent bypassing Windows Defender SmartScreen prompts for sites**, come from the Microsoft Edge administrative templates. You download them, copy `msedge.admx` to the PolicyDefinitions folder of the Central Store and `msedge.adml` to its language folder; the **Microsoft Edge > SmartScreen settings** node then appears and you can enable the setting.
        fr: |
          Les paramètres SmartScreen d'Edge, dont **Prevent bypassing Windows Defender SmartScreen prompts for sites**, proviennent des modèles d'administration de Microsoft Edge. Vous les téléchargez, copiez `msedge.admx` dans le dossier PolicyDefinitions du magasin central et `msedge.adml` dans son dossier de langue ; le nœud **Microsoft Edge > SmartScreen settings** apparaît alors et vous pouvez activer le paramètre.
      options:
        a: { en: "This Explorer setting checks apps and files that users run from File Explorer; it doesn't stop users from continuing to a flagged website in Edge.", fr: "Ce paramètre d'Explorer vérifie les applications et fichiers lancés depuis l'Explorateur de fichiers ; il n'empêche pas les utilisateurs de poursuivre vers un site signalé dans Edge." }
        b: { en: "App Install Control restricts the installation of downloaded apps to the Microsoft Store; it has no effect on websites.", fr: "Configure App Install Control limite l'installation des applications téléchargées au Microsoft Store ; il n'a aucun effet sur les sites web." }
        c: { en: "Refreshing Group Policy doesn't add administrative templates; the Edge ADMX and ADML files are missing from the Central Store.", fr: "Actualiser la stratégie de groupe n'ajoute aucun modèle d'administration ; les fichiers ADMX et ADML d'Edge manquent dans le magasin central." }
    references:
      - title: Configure Microsoft Edge policy settings on Windows devices
        url: https://learn.microsoft.com/en-us/deployedge/configure-microsoft-edge
      - title: Available Microsoft Defender SmartScreen settings
        url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/virus-and-threat-protection/microsoft-defender-smartscreen/available-settings

  # ------------------------------------------------------------------ 4
  - id: az802-qz-61-04
    objective: "6.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Your network contains an AD DS domain named adatum.com at the Windows Server 2016 domain functional level. The Default Domain Policy sets **Minimum password length** to 10. An organizational unit (OU) named **Admin-Accounts** contains the domain user accounts of 20 administrators. A GPO named **GPO-Admins** linked to Admin-Accounts sets **Minimum password length** to 16 under **Account Policies > Password Policy**.

        The administrators can still set 10-character passwords for their domain accounts. You need to require 16-character passwords for these 20 domain accounts only.

        What should you do?
      fr: |
        Votre réseau contient un domaine AD DS nommé adatum.com au niveau fonctionnel de domaine Windows Server 2016. La Default Domain Policy définit **Longueur minimale du mot de passe** à 10. Une unité d'organisation (UO) nommée **Admin-Accounts** contient les comptes d'utilisateur du domaine de 20 administrateurs. Un GPO nommé **GPO-Admins** lié à Admin-Accounts définit **Longueur minimale du mot de passe** à 16 sous **Stratégies de comptes > Stratégie de mot de passe**.

        Les administrateurs peuvent toujours définir des mots de passe de 10 caractères pour leurs comptes du domaine. Vous devez exiger des mots de passe de 16 caractères pour ces 20 comptes du domaine uniquement.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set the link of GPO-Admins to Enforced so that its password policy wins over the Default Domain Policy.", fr: "Définir le lien de GPO-Admins sur Appliqué pour que sa stratégie de mot de passe l'emporte sur la Default Domain Policy." } }
        - { id: b, text: { en: "Link GPO-Admins to the Domain Controllers OU so that the domain controllers enforce its password policy.", fr: "Lier GPO-Admins à l'UO Domain Controllers pour que les contrôleurs de domaine appliquent sa stratégie de mot de passe." } }
        - { id: c, text: { en: "Link GPO-Admins to the domain, and give it a higher link order than the Default Domain Policy.", fr: "Lier GPO-Admins au domaine, et lui donner un ordre de liaison prioritaire sur la Default Domain Policy." } }
        - { id: d, text: { en: "Create a fine-grained password policy that requires 16 characters, and apply it to a global group of the 20 administrators.", fr: "Créer une stratégie de mot de passe affinée qui exige 16 caractères, et l'appliquer à un groupe global contenant les 20 administrateurs." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A domain has a single account policy, enforced by the domain controllers from the domain-level GPO. An account policy in a GPO linked to an OU only changes the local policy of the computers in that OU, so it never applies to domain user accounts. A fine-grained password policy applies to users or global security groups, so it can target only the 20 administrators.
        fr: |
          Un domaine n'a qu'une seule stratégie de comptes, que les contrôleurs de domaine appliquent à partir du GPO lié au domaine. Une stratégie de comptes dans un GPO lié à une UO ne modifie que la stratégie locale des ordinateurs de cette UO : elle ne s'applique donc jamais aux comptes d'utilisateur du domaine. Une stratégie de mot de passe affinée s'applique à des utilisateurs ou à des groupes de sécurité globaux : elle peut donc cibler uniquement les 20 administrateurs.
      options:
        a: { en: "Enforcing the link doesn't change the scope of an OU-level account policy: it still affects only local accounts of the computers in the OU, and the OU contains no computer.", fr: "Appliquer le lien ne change pas la portée d'une stratégie de comptes au niveau d'une UO : elle concerne toujours uniquement les comptes locaux des ordinateurs de l'UO, et l'UO ne contient aucun ordinateur." }
        b: { en: "Domain controllers take the domain account policy from the GPO linked to the domain, not from a GPO linked to the Domain Controllers OU.", fr: "Les contrôleurs de domaine prennent la stratégie de comptes du domaine dans le GPO lié au domaine, pas dans un GPO lié à l'UO Domain Controllers." }
        c: { en: "At the domain level, the 16-character minimum would apply to every domain user, not only to the 20 administrators.", fr: "Au niveau du domaine, le minimum de 16 caractères s'appliquerait à tous les utilisateurs du domaine, pas seulement aux 20 administrateurs." }
    references:
      - title: Account Policies
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/account-policies
      - title: Password Policy
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/password-policy

  # ------------------------------------------------------------------ 5
  - id: az802-qz-61-05
    objective: "6.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A server named **SRV5** runs Windows Server 2025. In Windows Security, the **System settings** tab of exploit protection sets **Data Execution Prevention (DEP)** to **On by default**. Last year, to troubleshoot a line-of-business application, an administrator added C:\Apps\app4.exe on the **Program settings** tab and set DEP to **Override system settings** with the switch **Off**.

        The security team now requires DEP to protect app4.exe, like every other program on SRV5.

        What should you do?
      fr: |
        Un serveur nommé **SRV5** exécute Windows Server 2025. Dans Sécurité Windows, l'onglet **Paramètres système** de la protection contre les attaques définit **Data Execution Prevention (DEP)** sur **On by default**. L'an dernier, pour dépanner une application métier, un administrateur a ajouté C:\Apps\app4.exe dans l'onglet **Paramètres du programme** et a réglé DEP sur **Override system settings** avec le commutateur sur **Off**.

        L'équipe sécurité exige maintenant que DEP protège app4.exe, comme tous les autres programmes de SRV5.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: "Set-ProcessMitigation -System -Enable DEP" }
        - { id: b, text: "Set-ProcessMitigation -Name C:\\Apps\\app4.exe -Enable TerminateOnError" }
        - { id: c, text: "Set-ProcessMitigation -Name C:\\Apps\\app4.exe -Enable DEP" }
        - { id: d, text: "Set-ProcessMitigation -System -Enable DEP, EmulateAtlThunks" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          When a mitigation is configured for a program on the **Program settings** tab, that configuration is honored above the system setting for the same mitigation. Here the program setting turns DEP off for app4.exe, so you must change it at the program level: enabling DEP for app4.exe makes the program setting match the requirement.
        fr: |
          Quand une atténuation est configurée pour un programme dans l'onglet **Paramètres du programme**, cette configuration l'emporte sur le paramètre système de la même atténuation. Ici, le paramètre du programme désactive DEP pour app4.exe : vous devez donc le modifier au niveau du programme, et activer DEP pour app4.exe met ce paramètre en conformité avec l'exigence.
      options:
        a: { en: "DEP is already on at the system level; the program setting of app4.exe still overrides it.", fr: "DEP est déjà activé au niveau du système ; le paramètre du programme app4.exe continue de le remplacer." }
        b: { en: "TerminateOnError is the PowerShell value of Validate heap integrity, a different mitigation; DEP stays off for app4.exe.", fr: "TerminateOnError est la valeur PowerShell de Validate heap integrity, une autre atténuation ; DEP reste désactivé pour app4.exe." }
        d: { en: "Adding ATL thunk emulation at the system level doesn't remove the program-level override that turns DEP off for app4.exe.", fr: "Ajouter l'émulation des thunks ATL au niveau du système ne supprime pas le remplacement au niveau du programme qui désactive DEP pour app4.exe." }
    references:
      - title: Customize exploit protection
        url: https://learn.microsoft.com/en-us/defender-endpoint/customize-exploit-protection

  # ------------------------------------------------------------------ 6
  - id: az802-qz-61-06
    objective: "6.1.6"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A server named **WEB5** runs Windows Server 2025 in a perimeter network. WEB5 is a member of a workgroup, and the Microsoft.OSConfig PowerShell module is installed.

        The security team requires the following:

        - WEB5 uses the Microsoft security baseline for its role, and the baseline settings are protected against drift.
        - The **AuditDetailedFileShare** setting of the baseline uses the value 3 instead of the baseline value.
        - The value 3 must not be reverted later.

        What should you do?
      fr: |
        Un serveur nommé **WEB5** exécute Windows Server 2025 dans un réseau de périmètre. WEB5 est membre d'un groupe de travail, et le module PowerShell Microsoft.OSConfig est installé.

        L'équipe sécurité exige ce qui suit :

        - WEB5 utilise la base de référence de sécurité Microsoft de son rôle, et les paramètres de la base de référence sont protégés contre la dérive.
        - Le paramètre **AuditDetailedFileShare** de la base de référence utilise la valeur 3 au lieu de la valeur de la base de référence.
        - La valeur 3 ne doit pas être rétablie à l'ancienne valeur par la suite.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Apply the SecurityBaseline/WindowsServer/2025/MemberServer scenario with -Default, and then set the Detailed File Share subcategory to the required value by using auditpol.", fr: "Appliquer le scénario SecurityBaseline/WindowsServer/2025/MemberServer avec -Default, puis définir la sous-catégorie Detailed File Share sur la valeur exigée avec auditpol." } }
        - { id: b, text: { en: "Apply the SecurityBaseline/WindowsServer/2025/WorkgroupMember scenario with -Default, and then set the Detailed File Share subcategory to the required value in Local Security Policy.", fr: "Appliquer le scénario SecurityBaseline/WindowsServer/2025/WorkgroupMember avec -Default, puis définir la sous-catégorie Detailed File Share sur la valeur exigée dans la Stratégie de sécurité locale." } }
        - { id: c, text: { en: "Apply the SecurityBaseline/WindowsServer/2025/WorkgroupMember scenario with -Default, and then run Set-OSConfigDesiredConfiguration for it with -Setting AuditDetailedFileShare -Value 3.", fr: "Appliquer le scénario SecurityBaseline/WindowsServer/2025/WorkgroupMember avec -Default, puis exécuter Set-OSConfigDesiredConfiguration pour ce scénario avec -Setting AuditDetailedFileShare -Value 3." } }
        - { id: d, text: { en: "Import the Windows Server 2025 baseline GPO backup of the Security Compliance Toolkit into the local policy by using LGPO.exe, and then change the subcategory with LGPO.exe.", fr: "Importer la sauvegarde de GPO de la base de référence Windows Server 2025 du Security Compliance Toolkit dans la stratégie locale avec LGPO.exe, puis modifier la sous-catégorie avec LGPO.exe." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A server that isn't joined to a domain uses the **WorkgroupMember** scenario. Customizing a value through OSConfig itself, with `Set-OSConfigDesiredConfiguration -Setting AuditDetailedFileShare -Value 3`, makes 3 the desired value: drift control then protects 3 along with the rest of the baseline. You can check it with `Get-OSConfigDesiredConfiguration ... -Setting AuditDetailedFileShare`.
        fr: |
          Un serveur qui n'est pas joint à un domaine utilise le scénario **WorkgroupMember**. Personnaliser une valeur par OSConfig lui-même, avec `Set-OSConfigDesiredConfiguration -Setting AuditDetailedFileShare -Value 3`, fait de 3 la valeur souhaitée : le contrôle de la dérive protège alors 3 avec le reste de la base de référence. Vous pouvez la vérifier avec `Get-OSConfigDesiredConfiguration ... -Setting AuditDetailedFileShare`.
      options:
        a: { en: "MemberServer is the scenario for domain members, and a change made with auditpol is seen as drift and put back to the baseline value.", fr: "MemberServer est le scénario des membres d'un domaine, et une modification faite avec auditpol est vue comme une dérive et ramenée à la valeur de la base de référence." }
        b: { en: "The scenario is right, but a change made outside OSConfig is drift: OSConfig reverts the subcategory to the baseline value.", fr: "Le scénario est le bon, mais une modification faite en dehors d'OSConfig est une dérive : OSConfig ramène la sous-catégorie à la valeur de la base de référence." }
        d: { en: "Settings imported into the local policy with LGPO.exe aren't protected against drift, which the first requirement demands.", fr: "Les paramètres importés dans la stratégie locale avec LGPO.exe ne sont pas protégés contre la dérive, ce qu'exige la première exigence." }
    references:
      - title: Deploy Windows Server 2025 security baselines locally with OSConfig
        url: https://learn.microsoft.com/en-us/windows-server/security/osconfig/osconfig-how-to-configure-security-baselines

  # ------------------------------------------------------------------ 7
  - id: az802-qz-61-07
    objective: "6.1.9"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Your network contains an AD DS domain named contoso.com. All the computers are domain members that can authenticate by using Kerberos. A GPO named **GPO-Isolation** is linked to the domain.

        You plan to implement domain isolation by using GPO-Isolation. In the final configuration, computers must accept inbound connections only from authenticated computers, and they must still be able to initiate connections to computers that can't authenticate. An error in the GPO or in its distribution must never interrupt network communications during the deployment.

        Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Votre réseau contient un domaine AD DS nommé contoso.com. Tous les ordinateurs sont membres du domaine et peuvent s'authentifier par Kerberos. Un GPO nommé **GPO-Isolation** est lié au domaine.

        Vous prévoyez d'implémenter l'isolation de domaine avec GPO-Isolation. Dans la configuration finale, les ordinateurs doivent accepter les connexions entrantes uniquement d'ordinateurs authentifiés, et ils doivent toujours pouvoir initier des connexions vers des ordinateurs qui ne peuvent pas s'authentifier. Une erreur dans le GPO ou dans sa distribution ne doit jamais interrompre les communications réseau pendant le déploiement.

        Quelles sont les trois actions que vous devez effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et placez-les dans le bon ordre.
    body:
      count: 3
      actions:
        - { id: reqall, text: { en: "In GPO-Isolation, create an isolation connection security rule that requires authentication for inbound and outbound connections.", fr: "Dans GPO-Isolation, créer une règle de sécurité de connexion d'isolation qui exige l'authentification pour les connexions entrantes et sortantes." } }
        - { id: request, text: { en: "In GPO-Isolation, create an isolation connection security rule that requests authentication for inbound and outbound connections.", fr: "Dans GPO-Isolation, créer une règle de sécurité de connexion d'isolation qui demande l'authentification pour les connexions entrantes et sortantes." } }
        - { id: exempt, text: { en: "In GPO-Isolation, create an authentication exemption rule that lists the IP addresses of all the domain computers.", fr: "Dans GPO-Isolation, créer une règle de dispense d'authentification qui liste les adresses IP de tous les ordinateurs du domaine." } }
        - { id: verify, text: { en: "On a sample of computers, run Get-NetIPsecMainModeSA to confirm that they negotiate IPsec security associations with each other.", fr: "Sur un échantillon d'ordinateurs, exécuter Get-NetIPsecMainModeSA pour confirmer qu'ils négocient des associations de sécurité IPsec entre eux." } }
        - { id: require, text: { en: "Change the rule to require authentication for inbound connections and request authentication for outbound connections.", fr: "Modifier la règle pour exiger l'authentification pour les connexions entrantes et la demander pour les connexions sortantes." } }
        - { id: tunnel, text: { en: "In GPO-Isolation, create a tunnel connection security rule between the client subnet and the server subnet.", fr: "Dans GPO-Isolation, créer une règle de sécurité de connexion de tunnel entre le sous-réseau des clients et celui des serveurs." } }
    answer:
      sequence: [request, verify, require]
    explanation:
      correct:
        en: |
          A rule that only requests authentication lets computers communicate even when authentication fails, so a GPO error can't break the network. Once you've confirmed that the computers receive the GPO and negotiate IPsec with each other (main mode security associations), you change the rule to require inbound and request outbound authentication: inbound connections then need authentication, while outbound connections to computers that can't authenticate still work.
        fr: |
          Une règle qui ne fait que demander l'authentification laisse les ordinateurs communiquer même quand l'authentification échoue : une erreur de GPO ne peut donc pas casser le réseau. Une fois confirmé que les ordinateurs reçoivent le GPO et négocient IPsec entre eux (associations de sécurité en mode principal), vous modifiez la règle pour exiger l'authentification en entrée et la demander en sortie : les connexions entrantes exigent alors l'authentification, et les connexions sortantes vers des ordinateurs qui ne peuvent pas s'authentifier fonctionnent toujours.
      options:
        reqall: { en: "Requiring authentication from the start breaks communications if the GPO fails to apply somewhere, and requiring it outbound blocks connections to computers that can't authenticate.", fr: "Exiger l'authentification dès le départ casse les communications si le GPO ne s'applique pas quelque part, et l'exiger en sortie bloque les connexions vers les ordinateurs qui ne peuvent pas s'authentifier." }
        exempt: { en: "An authentication exemption is for computers that can't use IPsec; exempting every domain computer would defeat domain isolation.", fr: "Une dispense d'authentification sert aux ordinateurs qui ne peuvent pas utiliser IPsec ; dispenser tous les ordinateurs du domaine annulerait l'isolation de domaine." }
        tunnel: { en: "A tunnel rule links two gateways; domain isolation uses an isolation rule between all the domain computers.", fr: "Une règle de tunnel relie deux passerelles ; l'isolation de domaine utilise une règle d'isolation entre tous les ordinateurs du domaine." }
    references:
      - title: Create an Authentication Request Rule on Windows 8, Windows 7, Windows Vista, Windows Server 2012, Windows Server 2008, and Windows Server 2008 R2
        url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/create-an-authentication-request-rule
      - title: Domain Isolation Policy Design
        url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/domain-isolation-policy-design

  # ------------------------------------------------------------------ 8
  - id: az802-qz-61-08
    objective: "6.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank has four Remote Desktop Session Host servers that run Windows Server 2025. Employees and members of a group named **Contractors** sign in to the same servers. The security team lists the following requirements:

        - Only approved code can run on the servers, for every user, including kernel-mode drivers.
        - Among the approved applications, members of Contractors can run only an application named **TimeApp**. Employees can run all the approved applications.
        - The solution must use the feature that Microsoft recommends wherever it can meet the requirement.

        Which two features should you use? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank possède quatre serveurs hôtes de session Bureau à distance qui exécutent Windows Server 2025. Les employés et les membres d'un groupe nommé **Contractors** ouvrent une session sur les mêmes serveurs. L'équipe sécurité liste les exigences suivantes :

        - Seul du code approuvé peut s'exécuter sur les serveurs, pour tous les utilisateurs, pilotes en mode noyau compris.
        - Parmi les applications approuvées, les membres de Contractors ne peuvent exécuter qu'une application nommée **TimeApp**. Les employés peuvent exécuter toutes les applications approuvées.
        - La solution doit utiliser la fonctionnalité que Microsoft recommande partout où elle peut répondre à l'exigence.

        Quelles sont les deux fonctionnalités que vous devez utiliser ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "An App Control for Business supplemental policy that targets the Contractors group", fr: "Une stratégie supplémentaire App Control for Business qui cible le groupe Contractors" } }
        - { id: b, text: { en: "An App Control for Business base policy in enforcement mode on the servers", fr: "Une stratégie de base App Control for Business en mode application sur les serveurs" } }
        - { id: c, text: { en: "Exploit protection with Code integrity guard enabled for every program on the servers", fr: "La protection contre les attaques avec Code integrity guard activé pour chaque programme des serveurs" } }
        - { id: d, text: { en: "AppLocker rules that allow only TimeApp for the Contractors group", fr: "Des règles AppLocker qui n'autorisent que TimeApp pour le groupe Contractors" } }
        - { id: e, text: { en: "The SmartScreen setting Configure App Install Control for the servers", fr: "Le paramètre SmartScreen Configure App Install Control pour les serveurs" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          App Control for Business is the recommended feature and the only one of the two that controls kernel-mode drivers, but its policies apply to the whole device and all its users. AppLocker can complement it with user- or group-specific rules on shared servers: enforce App Control at the device level, then use AppLocker to restrict Contractors to TimeApp.
        fr: |
          App Control for Business est la fonctionnalité recommandée et la seule des deux qui contrôle les pilotes en mode noyau, mais ses stratégies s'appliquent à tout l'appareil et à tous ses utilisateurs. AppLocker peut la compléter avec des règles propres à un utilisateur ou à un groupe sur des serveurs partagés : appliquez App Control au niveau de l'appareil, puis utilisez AppLocker pour limiter Contractors à TimeApp.
      options:
        a: { en: "A supplemental policy extends a base policy for the whole device; App Control policies can't target a user group.", fr: "Une stratégie supplémentaire étend une stratégie de base pour tout l'appareil ; les stratégies App Control ne peuvent pas cibler un groupe d'utilisateurs." }
        c: { en: "Code integrity guard restricts the images that a process loads to Microsoft-signed binaries; it isn't an allow list of applications and drivers, and it has no per-group rules.", fr: "Code integrity guard limite les images qu'un processus charge aux binaires signés par Microsoft ; ce n'est pas une liste d'autorisation d'applications et de pilotes, et il n'a pas de règles par groupe." }
        e: { en: "App Install Control only limits the installation of downloaded apps to the Microsoft Store; it doesn't control which code runs.", fr: "Configure App Install Control limite seulement l'installation des applications téléchargées au Microsoft Store ; il ne contrôle pas le code qui s'exécute." }
    references:
      - title: App Control for Business and AppLocker Overview
        url: https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/appcontrol-and-applocker-overview
      - title: Customize exploit protection
        url: https://learn.microsoft.com/en-us/defender-endpoint/customize-exploit-protection

  # ------------------------------------------------------------------ 9
  - id: az802-qz-61-09
    objective: "6.1.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Your network contains an AD DS domain named tailspin.com. The member servers in an OU named **Servers** run Windows Server 2025. You ran Update-LapsADSchema and Set-LapsADComputerSelfPermission for the Servers OU. Each server has a local account named **LocalAdm**.

        A GPO named **GPO-LAPS2025** is linked to the Servers OU. Under **System > LAPS**, it configures only the following settings:

        | Setting | Value |
        | --- | --- |
        | BackupDirectory | 2 (Active Directory) |
        | AdministratorAccountName | LocalAdm |
        | AutomaticAccountManagementEnabled | 1 |
        | AutomaticAccountManagementTarget | 1 |
        | AutomaticAccountManagementNameOrPrefix | tsadm |
        | AutomaticAccountManagementRandomizeName | 1 |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Votre réseau contient un domaine AD DS nommé tailspin.com. Les serveurs membres d'une UO nommée **Servers** exécutent Windows Server 2025. Vous avez exécuté Update-LapsADSchema et Set-LapsADComputerSelfPermission pour l'UO Servers. Chaque serveur possède un compte local nommé **LocalAdm**.

        Un GPO nommé **GPO-LAPS2025** est lié à l'UO Servers. Sous **Système > LAPS**, il configure uniquement les paramètres suivants :

        | Paramètre | Valeur |
        | --- | --- |
        | BackupDirectory | 2 (Active Directory) |
        | AdministratorAccountName | LocalAdm |
        | AutomaticAccountManagementEnabled | 1 |
        | AutomaticAccountManagementTarget | 1 |
        | AutomaticAccountManagementNameOrPrefix | tsadm |
        | AutomaticAccountManagementRandomizeName | 1 |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Windows LAPS rotates the password of the LocalAdm account and backs it up to AD DS.", fr: "Windows LAPS renouvelle le mot de passe du compte LocalAdm et le sauvegarde dans AD DS." }
        - id: s2
          text: { en: "The name of the account that Windows LAPS manages changes each time its password is rotated.", fr: "Le nom du compte que gère Windows LAPS change à chaque renouvellement de son mot de passe." }
        - id: s3
          text: { en: "A technician can sign in to a server with the managed account by using the password retrieved from AD DS.", fr: "Un technicien peut ouvrir une session sur un serveur avec le compte géré en utilisant le mot de passe récupéré dans AD DS." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          With automatic account management enabled and the target set to 1, Windows LAPS creates and manages its own custom account, and AdministratorAccountName is ignored. Because RandomizeName is 1, the prefix tsadm receives a new random six-digit suffix at every rotation. AutomaticAccountManagementEnableAccount isn't configured, and its default value 0 keeps the managed account disabled, so nobody can sign in with it until the setting is 1.
        fr: |
          Avec la gestion automatique du compte activée et la cible définie à 1, Windows LAPS crée et gère son propre compte personnalisé, et AdministratorAccountName est ignoré. Comme RandomizeName vaut 1, le préfixe tsadm reçoit un nouveau suffixe aléatoire de six chiffres à chaque renouvellement. AutomaticAccountManagementEnableAccount n'est pas configuré, et sa valeur par défaut 0 garde le compte géré désactivé : personne ne peut donc ouvrir de session avec lui tant que ce paramètre ne vaut pas 1.
      options:
        s1: { en: "AdministratorAccountName is ignored when AutomaticAccountManagementEnabled is enabled; LAPS manages the tsadm account instead.", fr: "AdministratorAccountName est ignoré quand AutomaticAccountManagementEnabled est activé ; LAPS gère à la place le compte tsadm." }
        s3: { en: "Set AutomaticAccountManagementEnableAccount to 1 so that the automatically managed account is enabled.", fr: "Définissez AutomaticAccountManagementEnableAccount à 1 pour que le compte géré automatiquement soit activé." }
    references:
      - title: Configure policy settings for Windows LAPS
        url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-management-policy-settings

  # ------------------------------------------------------------------ 10
  - id: az802-qz-61-10
    objective: "6.1.8"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has two Azure subscriptions. Microsoft Defender for Servers isn't enabled on either of them. All the virtual machines run Windows Server 2025.

        - **Sub-Prod** contains 40 virtual machines that need Defender for Endpoint EDR and agent-based vulnerability scanning only.
        - **Sub-PCI** contains 10 virtual machines. Nine of them need file integrity monitoring and just-in-time VM access. The tenth, named **VM-Test**, must not be billed for Defender for Servers.

        You need to configure Defender for Servers. The solution must minimize cost and administrative effort.

        What should you do?
      fr: |
        Contoso dispose de deux abonnements Azure. Microsoft Defender for Servers n'est activé sur aucun d'eux. Toutes les machines virtuelles exécutent Windows Server 2025.

        - **Sub-Prod** contient 40 machines virtuelles qui n'ont besoin que de l'EDR de Defender pour point de terminaison et de l'analyse des vulnérabilités avec agent.
        - **Sub-PCI** contient 10 machines virtuelles. Neuf d'entre elles ont besoin de la supervision de l'intégrité des fichiers et de l'accès juste-à-temps aux machines virtuelles. La dixième, nommée **VM-Test**, ne doit pas être facturée pour Defender for Servers.

        Vous devez configurer Defender for Servers. La solution doit réduire au minimum les coûts et l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable Plan 1 on Sub-Prod and on Sub-PCI, and then enable Plan 2 at the resource level on the nine virtual machines of Sub-PCI.", fr: "Activer le Plan 1 sur Sub-Prod et sur Sub-PCI, puis activer le Plan 2 au niveau des ressources sur les neuf machines virtuelles de Sub-PCI." } }
        - { id: b, text: { en: "Enable Plan 2 on Sub-Prod and on Sub-PCI, and then disable Defender for Servers at the resource level on VM-Test.", fr: "Activer le Plan 2 sur Sub-Prod et sur Sub-PCI, puis désactiver Defender for Servers au niveau des ressources sur VM-Test." } }
        - { id: c, text: { en: "Enable Plan 1 on Sub-Prod and Plan 2 on Sub-PCI, and then remove the Defender for Endpoint agent from VM-Test.", fr: "Activer le Plan 1 sur Sub-Prod et le Plan 2 sur Sub-PCI, puis supprimer l'agent Defender pour point de terminaison de VM-Test." } }
        - { id: d, text: { en: "Enable Plan 1 on Sub-Prod and Plan 2 on Sub-PCI, and then disable Defender for Servers at the resource level on VM-Test.", fr: "Activer le Plan 1 sur Sub-Prod et le Plan 2 sur Sub-PCI, puis désactiver Defender for Servers au niveau des ressources sur VM-Test." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Plan 1 includes Defender for Endpoint EDR and agent-based vulnerability scanning, so it's enough and cheaper for Sub-Prod. File integrity monitoring and just-in-time VM access need Plan 2, which can be enabled only on a whole subscription, but can be disabled on an individual resource. Disabling the plan on VM-Test removes it from billing while the nine other VMs keep Plan 2.
        fr: |
          Le Plan 1 inclut l'EDR de Defender pour point de terminaison et l'analyse des vulnérabilités avec agent : il suffit donc pour Sub-Prod et coûte moins cher. La supervision de l'intégrité des fichiers et l'accès juste-à-temps aux machines virtuelles exigent le Plan 2, qui ne peut être activé que sur un abonnement entier, mais peut être désactivé sur une ressource précise. Désactiver le plan sur VM-Test la retire de la facturation, tandis que les neuf autres machines virtuelles conservent le Plan 2.
      options:
        a: { en: "Plan 2 can't be enabled at the resource level; only Plan 1 can be enabled per server.", fr: "Le Plan 2 ne peut pas être activé au niveau des ressources ; seul le Plan 1 peut être activé par serveur." }
        b: { en: "Plan 2 on Sub-Prod costs more than Plan 1 for 40 virtual machines that need only Plan 1 features.", fr: "Le Plan 2 sur Sub-Prod coûte plus cher que le Plan 1 pour 40 machines virtuelles qui n'ont besoin que des fonctionnalités du Plan 1." }
        c: { en: "Billing follows the plan enabled on the resource, not the presence of the agent; VM-Test would still be covered and billed by the Plan 2 of Sub-PCI.", fr: "La facturation suit le plan activé sur la ressource, pas la présence de l'agent ; VM-Test resterait couverte et facturée par le Plan 2 de Sub-PCI." }
    references:
      - title: Defender for Servers
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
