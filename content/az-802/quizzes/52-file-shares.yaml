chapter: 52-file-shares
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-52-01
    objective: "5.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum has a two-node failover cluster that runs a clustered file server role named **FS-CL1**. You create a share named **VMStore** on FS-CL1 to hold the virtual machine files of three Hyper-V hosts.

        The Hyper-V hosts must keep their open handles to the virtual machine files when the node that serves VMStore fails, so that the virtual machines keep running.

        Which parameter should you use when you create the share by running `New-SmbShare`?
      fr: |
        Adatum dispose d'un cluster de basculement à deux nœuds qui exécute un rôle de serveur de fichiers en cluster nommé **FS-CL1**. Vous créez sur FS-CL1 un partage nommé **VMStore** pour héberger les fichiers des machines virtuelles de trois hôtes Hyper-V.

        Les hôtes Hyper-V doivent conserver leurs handles ouverts sur les fichiers des machines virtuelles quand le nœud qui sert VMStore tombe en panne, afin que les machines virtuelles continuent de fonctionner.

        Quel paramètre devez-vous utiliser quand vous créez le partage en exécutant `New-SmbShare` ?
    body:
      options:
        - { id: a, text: "`-CachingMode BranchCache`" }
        - { id: b, text: "`-FolderEnumerationMode AccessBased`" }
        - { id: c, text: "`-ContinuouslyAvailable $true`" }
        - { id: d, text: "`-ConcurrentUserLimit 0`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A continuously available share on a clustered file server or a Scale-Out File Server survives the failover of the node that serves it without interrupting the clients, which is what Hyper-V and SQL Server need for their open files. `-ContinuouslyAvailable` sets this property when the share is created with `New-SmbShare`.
        fr: |
          Un partage continuellement disponible sur un serveur de fichiers en cluster ou un serveur de fichiers avec montée en puissance parallèle survit au basculement du nœud qui le sert sans interrompre les clients ; c'est ce dont Hyper-V et SQL Server ont besoin pour leurs fichiers ouverts. `-ContinuouslyAvailable` définit cette propriété quand le partage est créé avec `New-SmbShare`.
      options:
        a: { en: "The caching mode controls offline copies of the share on clients; it does nothing for a node failover.", fr: "Le mode de mise en cache contrôle les copies hors connexion du partage sur les clients ; il n'a aucun effet sur le basculement d'un nœud." }
        b: { en: "Access-based enumeration only hides the folders a user can't open; it doesn't keep open handles across a failover.", fr: "L'énumération basée sur l'accès masque seulement les dossiers qu'un utilisateur ne peut pas ouvrir ; elle ne conserve pas les handles ouverts lors d'un basculement." }
        d: { en: "A concurrent user limit of 0 means unlimited connections, which is already the default; it doesn't affect failover.", fr: "Une limite de 0 utilisateur simultané signifie un nombre illimité de connexions, déjà la valeur par défaut ; elle n'agit pas sur le basculement." }
    references:
      - title: New-SmbShare (SmbShare)
        url: https://learn.microsoft.com/en-us/powershell/module/smbshare/new-smbshare
      - title: Scale-Out File Server for application data overview for Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/failover-clustering/sofs-overview

  # ------------------------------------------------------------------ 2
  - id: az802-qz-52-02
    objective: "5.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam plans to replicate the folder D:\Engineering between two file servers named **FS1** and **FS2** by using DFS Replication. FS1 holds the current files. FS2 holds an older copy of the folder, restored from last month's backup, in which some files have different versions.

        During initial replication, the versions of FS1 must overwrite the different versions stored on FS2.

        What should you configure when you create the replication group?
      fr: |
        Fabrikam prévoit de répliquer le dossier D:\Engineering entre deux serveurs de fichiers nommés **FS1** et **FS2** à l'aide de la réplication DFS. FS1 détient les fichiers à jour. FS2 détient une copie plus ancienne du dossier, restaurée depuis la sauvegarde du mois dernier, dans laquelle certains fichiers ont des versions différentes.

        Pendant la réplication initiale, les versions de FS1 doivent remplacer les versions différentes stockées sur FS2.

        Que devez-vous configurer quand vous créez le groupe de réplication ?
    body:
      options:
        - { id: a, text: { en: "FS2 as the primary member of the replicated folder", fr: "FS2 comme membre principal du dossier répliqué" } }
        - { id: b, text: { en: "FS1 as the primary member of the replicated folder", fr: "FS1 comme membre principal du dossier répliqué" } }
        - { id: c, text: { en: "Remote differential compression on the connection between FS1 and FS2", fr: "La compression différentielle à distance sur la connexion entre FS1 et FS2" } }
        - { id: d, text: { en: "Restore-DfsrPreservedFiles on FS2 at the end of initial replication", fr: "Restore-DfsrPreservedFiles sur FS2 à la fin de la réplication initiale" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          During initial replication, the content of the primary member is authoritative: its files overwrite the other versions found on the other members. Designating FS1, the server with the current files, as the primary member gives the expected result. The designation only matters for initial replication; afterward, the members replicate as equals.
        fr: |
          Pendant la réplication initiale, le contenu du membre principal fait autorité : ses fichiers remplacent les autres versions trouvées sur les autres membres. Désigner FS1, le serveur qui détient les fichiers à jour, comme membre principal donne le résultat attendu. Cette désignation ne compte que pour la réplication initiale ; ensuite, les membres répliquent d'égal à égal.
      options:
        a: { en: "With FS2 as the primary member, the older versions restored on FS2 would win and overwrite the current files of FS1.", fr: "Avec FS2 comme membre principal, les versions anciennes restaurées sur FS2 l'emporteraient et remplaceraient les fichiers à jour de FS1." }
        c: { en: "Remote differential compression reduces the data sent by replicating only changed blocks; it doesn't decide which version wins.", fr: "La compression différentielle à distance réduit les données envoyées en ne répliquant que les blocs modifiés ; elle ne décide pas quelle version l'emporte." }
        d: { en: "Restore-DfsrPreservedFiles puts back files moved to the preserved folders; it doesn't make FS1 authoritative.", fr: "Restore-DfsrPreservedFiles remet en place des fichiers déplacés dans les dossiers de conservation ; il ne rend pas FS1 faisant autorité." }
    references:
      - title: DFS Replication - FAQ
        url: https://learn.microsoft.com/en-us/windows-server/storage/dfs-replication/dfsr-faq

  # ------------------------------------------------------------------ 3
  - id: az802-qz-52-03
    objective: "5.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        On a file server named **FS3**, each of the 120 user folders under D:\Home has an FSRM quota created from the quota template **Home-2GB**. Later, you edited the quotas of five managers' folders directly to give them 10 GB.

        You need to raise the limit of all the other user folders to 3 GB. The five managers must keep their 10-GB limit. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Sur un serveur de fichiers nommé **FS3**, chacun des 120 dossiers d'utilisateurs de D:\Home a un quota FSRM créé à partir du modèle de quota **Home-2GB**. Plus tard, vous avez modifié directement les quotas des dossiers de cinq responsables pour leur donner 10 Go.

        Vous devez porter la limite de tous les autres dossiers d'utilisateurs à 3 Go. Les cinq responsables doivent conserver leur limite de 10 Go. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set Home-2GB to 3 GB, then apply the template to all derived quotas.", fr: "Passer Home-2GB à 3 Go, puis appliquer le modèle à tous les quotas dérivés." } }
        - { id: b, text: { en: "Set Home-2GB to 3 GB, then don't apply the template to derived quotas.", fr: "Passer Home-2GB à 3 Go, puis ne pas appliquer le modèle aux quotas dérivés." } }
        - { id: c, text: { en: "Create a 3-GB quota on D:\\Home, then keep Home-2GB unchanged.", fr: "Créer un quota de 3 Go sur D:\\Home, puis laisser Home-2GB inchangé." } }
        - { id: d, text: { en: "Set Home-2GB to 3 GB, then apply it only to derived quotas that match it.", fr: "Passer Home-2GB à 3 Go, puis l'appliquer seulement aux quotas dérivés qui lui correspondent." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          When you edit a quota template, FSRM offers to extend the change to the quotas derived from it. Applying it only to the derived quotas that still match the original template updates the 115 unchanged quotas in one operation and skips the five quotas edited since their creation, so the managers keep 10 GB.
        fr: |
          Quand vous modifiez un modèle de quota, FSRM propose d'étendre la modification aux quotas qui en dérivent. L'appliquer seulement aux quotas dérivés qui correspondent encore au modèle d'origine met à jour en une opération les 115 quotas inchangés et ignore les cinq quotas modifiés depuis leur création : les responsables conservent 10 Go.
      options:
        a: { en: "Applying the template to all derived quotas also overwrites the custom properties of the five edited quotas, so the managers drop to 3 GB.", fr: "Appliquer le modèle à tous les quotas dérivés écrase aussi les propriétés personnalisées des cinq quotas modifiés : les responsables redescendent à 3 Go." }
        b: { en: "If the template isn't applied to derived quotas, the existing quotas keep their 2-GB limit; only new quotas would get 3 GB.", fr: "Si le modèle n'est pas appliqué aux quotas dérivés, les quotas existants gardent leur limite de 2 Go ; seuls les nouveaux quotas auraient 3 Go." }
        c: { en: "A quota on D:\\Home limits the total of all the user folders to 3 GB, and the 2-GB quotas of each folder still apply.", fr: "Un quota sur D:\\Home limite à 3 Go le total de tous les dossiers d'utilisateurs, et les quotas de 2 Go de chaque dossier s'appliquent toujours." }
    references:
      - title: Edit Quota Template Properties
        url: https://learn.microsoft.com/en-us/windows-server/storage/fsrm/edit-quota-template-properties

  # ------------------------------------------------------------------ 4
  - id: az802-qz-52-04
    objective: "5.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A server named **APP1** runs Windows Server 2025. A scheduled job on APP1 must write files to a share named **Scans** on **NAS2**, a third-party storage appliance whose SMB server listens only on TCP port 8445. The network firewalls already allow TCP port 8445 from APP1 to NAS2.

        You need to map drive S: on APP1 to the Scans share.

        Which command should you run on APP1?
      fr: |
        Un serveur nommé **APP1** exécute Windows Server 2025. Une tâche planifiée sur APP1 doit écrire des fichiers dans un partage nommé **Scans** sur **NAS2**, une appliance de stockage tierce dont le serveur SMB n'écoute que sur le port TCP 8445. Les pare-feu réseau autorisent déjà le port TCP 8445 d'APP1 vers NAS2.

        Vous devez mapper le lecteur S: d'APP1 sur le partage Scans.

        Quelle commande devez-vous exécuter sur APP1 ?
    body:
      options:
        - { id: a, text: "New-SmbMapping -LocalPath S: -RemotePath \\\\NAS2\\Scans -QuicPort 8445" }
        - { id: b, text: "New-SmbMapping -LocalPath S: -RemotePath \\\\NAS2\\Scans -TcpPort 8445" }
        - { id: c, text: "New-SmbMapping -LocalPath S: -RemotePath \\\\NAS2\\Scans -RdmaPort 8445" }
        - { id: d, text: "New-SmbServerAlternativePort -TransportType QUIC -Port 8445 -EnableInstances Default" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Since Windows Server 2025 and Windows 11 version 24H2, the SMB client can connect to a server on an alternative port. `New-SmbMapping -TcpPort` sets the destination TCP port of the mapping, which matches a server that listens on TCP 8445. The server side must already listen on that port, which is the case for NAS2.
        fr: |
          Depuis Windows Server 2025 et Windows 11 version 24H2, le client SMB peut se connecter à un serveur sur un port alternatif. `New-SmbMapping -TcpPort` définit le port TCP de destination du mappage, ce qui correspond à un serveur qui écoute sur TCP 8445. Le serveur doit déjà écouter sur ce port, ce qui est le cas de NAS2.
      options:
        a: { en: "-QuicPort targets an SMB over QUIC listener (UDP); NAS2 accepts SMB over TCP only.", fr: "-QuicPort vise un écouteur SMB sur QUIC (UDP) ; NAS2 n'accepte que SMB sur TCP." }
        c: { en: "-RdmaPort is for SMB Direct over RDMA network adapters, not for a TCP connection to an appliance.", fr: "-RdmaPort concerne SMB Direct sur des cartes réseau RDMA, pas une connexion TCP vers une appliance." }
        d: { en: "New-SmbServerAlternativePort changes the port on which a Windows SMB server listens for QUIC; it doesn't make the APP1 client reach TCP 8445.", fr: "New-SmbServerAlternativePort change le port d'écoute QUIC d'un serveur SMB Windows ; il ne fait pas joindre TCP 8445 au client APP1." }
    references:
      - title: Configure alternative SMB ports for Windows Server 2025
        url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-ports

  # ------------------------------------------------------------------ 5
  - id: az802-qz-52-05
    objective: "5.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A file server named **FSEDGE2** runs Windows Server 2025 and accepts SMB over QUIC connections at files.fabrikam.com. Last week, autoenrollment renewed its server certificate, and the new certificate, with the same subject and SAN, is in the Personal store of the computer. The old certificate expired this morning. Since then, Windows 11 devices on the internet can't connect to FSEDGE2 over QUIC.

        What should you do on FSEDGE2?
      fr: |
        Un serveur de fichiers nommé **FSEDGE2** exécute Windows Server 2025 et accepte les connexions SMB sur QUIC à l'adresse files.fabrikam.com. La semaine dernière, l'inscription automatique a renouvelé son certificat de serveur, et le nouveau certificat, avec le même objet et le même SAN, se trouve dans le magasin Personnel de l'ordinateur. L'ancien certificat a expiré ce matin. Depuis, les appareils Windows 11 sur internet ne peuvent plus se connecter à FSEDGE2 par QUIC.

        Que devez-vous faire sur FSEDGE2 ?
    body:
      options:
        - { id: a, text: { en: "Restart the Server service so that SMB loads the newest certificate of the Personal store.", fr: "Redémarrer le service Serveur pour que SMB charge le certificat le plus récent du magasin Personnel." } }
        - { id: b, text: { en: "Run Set-SmbServerConfiguration -EnableSMBQUIC $true to restart the QUIC listener of SMB.", fr: "Exécuter Set-SmbServerConfiguration -EnableSMBQUIC $true pour redémarrer l'écouteur QUIC de SMB." } }
        - { id: c, text: { en: "Request the certificate again with the public IP address of FSEDGE2 added to its SAN.", fr: "Redemander le certificat en ajoutant à son SAN l'adresse IP publique de FSEDGE2." } }
        - { id: d, text: { en: "Update the server certificate mapping of files.fabrikam.com with the thumbprint of the new certificate.", fr: "Mettre à jour le mappage de certificat de serveur de files.fabrikam.com avec l'empreinte du nouveau certificat." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          SMB over QUIC uses the certificate whose thumbprint is mapped to the server name, not the newest certificate of the store. A renewed certificate has a new thumbprint, so the mapping must be updated, for example with `Set-SmbServerCertificateMapping`, or the new certificate selected in Windows Admin Center on versions that support it.
        fr: |
          SMB sur QUIC utilise le certificat dont l'empreinte est mappée au nom du serveur, pas le certificat le plus récent du magasin. Un certificat renouvelé a une nouvelle empreinte : il faut donc mettre à jour le mappage, par exemple avec `Set-SmbServerCertificateMapping`, ou sélectionner le nouveau certificat dans Windows Admin Center sur les versions qui le prennent en charge.
      options:
        a: { en: "Restarting the Server service keeps the existing mapping, which still points to the thumbprint of the expired certificate.", fr: "Redémarrer le service Serveur conserve le mappage existant, qui pointe toujours vers l'empreinte du certificat expiré." }
        b: { en: "SMB over QUIC is still enabled; enabling it again doesn't change which certificate is mapped.", fr: "SMB sur QUIC est toujours activé ; l'activer de nouveau ne change pas le certificat mappé." }
        c: { en: "IP addresses aren't recommended in the SAN of an SMB over QUIC certificate, and a new certificate would still need to be mapped.", fr: "Les adresses IP sont déconseillées dans le SAN d'un certificat SMB sur QUIC, et un nouveau certificat devrait de toute façon être mappé." }
    references:
      - title: SMB over QUIC
        url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-over-quic

  # ------------------------------------------------------------------ 6
  - id: az802-qz-52-06
    objective: "5.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has a file server named **FS4** that runs Windows Server 2025 and shares D:\Contracts as **Contracts**. The share permissions grant Legal-Staff Change and Contractors Read. The NTFS permissions of D:\Contracts grant Authenticated Users Modify.

        Contractors also sign in to FS4 through Remote Desktop to run a document tool that opens D:\Contracts locally. An audit found that contractors changed contracts during these sessions.

        You need to ensure that contractors can only read the contracts, both through \\FS4\Contracts and when they work locally on FS4. Legal-Staff members must keep modifying the files. Access must be managed in a single permission set.

        What should you do?
      fr: |
        Northwind Traders dispose d'un serveur de fichiers nommé **FS4** qui exécute Windows Server 2025 et partage D:\Contracts sous le nom **Contracts**. Les autorisations de partage accordent Modifier à Legal-Staff et Lire à Contractors. Les autorisations NTFS de D:\Contracts accordent Modification à Utilisateurs authentifiés.

        Les prestataires se connectent aussi à FS4 par le Bureau à distance pour exécuter un outil documentaire qui ouvre D:\Contracts en local. Un audit a révélé que des prestataires ont modifié des contrats pendant ces sessions.

        Vous devez faire en sorte que les prestataires puissent seulement lire les contrats, aussi bien par \\FS4\Contracts qu'en travaillant en local sur FS4. Les membres de Legal-Staff doivent continuer à modifier les fichiers. L'accès doit être géré dans un seul ensemble d'autorisations.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add a Deny Change entry for Contractors to the share permissions, and keep the NTFS permissions as they are today.", fr: "Ajouter aux autorisations de partage une entrée Refuser Modifier pour Contractors, et garder les autorisations NTFS actuelles." } }
        - { id: b, text: { en: "Add an NTFS entry that grants Contractors Read & execute on D:\\Contracts, and keep the share permissions as they are.", fr: "Ajouter sur D:\\Contracts une entrée NTFS qui accorde Lecture et exécution à Contractors, et garder les autorisations de partage actuelles." } }
        - { id: c, text: { en: "Set the share to Authenticated Users Full Control, and set NTFS to Legal-Staff Modify and Contractors Read & execute.", fr: "Régler le partage sur Contrôle total pour Utilisateurs authentifiés, et NTFS sur Modification pour Legal-Staff et Lecture et exécution pour Contractors." } }
        - { id: d, text: { en: "Enable access-based enumeration on Contracts, and remove the Contractors entry from the share permissions of Contracts.", fr: "Activer l'énumération basée sur l'accès sur Contracts, et supprimer l'entrée Contractors des autorisations de partage de Contracts." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Share permissions apply only to network access, so the only way to restrict contractors locally is the NTFS layer. Replacing Authenticated Users Modify with Legal-Staff Modify and Contractors Read & execute restricts contractors in both cases, and opening the share to Authenticated Users Full Control leaves NTFS as the single place where access is decided.
        fr: |
          Les autorisations de partage ne s'appliquent qu'à l'accès réseau : la seule façon de restreindre les prestataires en local est la couche NTFS. Remplacer Modification pour Utilisateurs authentifiés par Modification pour Legal-Staff et Lecture et exécution pour Contractors restreint les prestataires dans les deux cas, et ouvrir le partage en Contrôle total à Utilisateurs authentifiés laisse NTFS comme seul endroit où l'accès se décide.
      options:
        a: { en: "A share deny entry affects network access only; in Remote Desktop sessions, contractors still have Modify through Authenticated Users in NTFS.", fr: "Une entrée de refus sur le partage n'agit que sur l'accès réseau ; en session Bureau à distance, les prestataires gardent Modification par Utilisateurs authentifiés en NTFS." }
        b: { en: "NTFS allow entries add up: contractors are authenticated users, so they keep Modify, and access stays split across two layers.", fr: "Les entrées d'autorisation NTFS s'additionnent : les prestataires sont des utilisateurs authentifiés et gardent Modification, et l'accès reste réparti sur deux couches." }
        d: { en: "Access-based enumeration only hides folders, and removing contractors from the share blocks their network reads without changing their local Modify permission.", fr: "L'énumération basée sur l'accès ne fait que masquer des dossiers, et retirer les prestataires du partage bloque leurs lectures réseau sans changer leur autorisation Modification en local." }
    references:
      - title: Share and NTFS Permissions on a File Server
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc754178(v=ws.11)

  # ------------------------------------------------------------------ 7
  - id: az802-qz-52-07
    objective: "5.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        On a file server named **FS5**, you created an active file screen on D:\Shares\Users two weeks ago. The screen blocks the **Audio and Video Files** file group, and the attempts to save such files are now rejected. A storage audit shows that D:\Shares\Users still contains many audio and video files.

        The department managers want a list of the audio and video files currently stored in D:\Shares\Users before they decide which ones to delete. No file may be moved or deleted until then.

        What should you configure in FSRM?
      fr: |
        Sur un serveur de fichiers nommé **FS5**, vous avez créé il y a deux semaines un filtre de fichiers actif sur D:\Shares\Users. Le filtre bloque le groupe de fichiers **Audio and Video Files**, et les tentatives d'enregistrer de tels fichiers sont désormais rejetées. Un audit du stockage montre que D:\Shares\Users contient encore de nombreux fichiers audio et vidéo.

        Les responsables de service veulent la liste des fichiers audio et vidéo stockés actuellement dans D:\Shares\Users avant de décider lesquels supprimer. Aucun fichier ne doit être déplacé ni supprimé d'ici là.

        Que devez-vous configurer dans FSRM ?
    body:
      options:
        - { id: a, text: { en: "A storage report of type FileScreenAuditFiles on D:\\Shares\\Users", fr: "Un rapport de stockage de type FileScreenAuditFiles sur D:\\Shares\\Users" } }
        - { id: b, text: { en: "A passive file screen on D:\\Shares\\Users that writes an event log entry", fr: "Un filtre de fichiers passif sur D:\\Shares\\Users qui écrit une entrée dans le journal des événements" } }
        - { id: c, text: { en: "A file management task that expires the audio and video files of D:\\Shares\\Users", fr: "Une tâche de gestion des fichiers qui fait expirer les fichiers audio et vidéo de D:\\Shares\\Users" } }
        - { id: d, text: { en: "A storage report of type FilesByFileGroup on D:\\Shares\\Users", fr: "Un rapport de stockage de type FilesByFileGroup sur D:\\Shares\\Users" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A file screen acts only when a file is saved: it doesn't remove or list the files stored before it existed. A Files by File Group storage report scans the folder and lists the files of each file group, here the audio and video files already present, without changing anything.
        fr: |
          Un filtre de fichiers n'agit qu'à l'enregistrement d'un fichier : il ne supprime ni ne liste les fichiers stockés avant sa création. Un rapport de stockage Fichiers par groupe de fichiers (FilesByFileGroup) analyse le dossier et liste les fichiers de chaque groupe de fichiers, ici les fichiers audio et vidéo déjà présents, sans rien modifier.
      options:
        a: { en: "The file screening audit report lists attempts to save blocked files, not the files that are already stored in the folder.", fr: "Le rapport d'audit du filtrage liste les tentatives d'enregistrer des fichiers bloqués, pas les fichiers déjà stockés dans le dossier." }
        b: { en: "A passive screen, like an active one, reacts only to new save attempts, so it reports nothing about existing files.", fr: "Un filtre passif, comme un filtre actif, ne réagit qu'aux nouvelles tentatives d'enregistrement : il ne signale rien sur les fichiers existants." }
        c: { en: "Expiring files moves them out of the folder, which the managers' requirement forbids for now.", fr: "Faire expirer des fichiers les déplace hors du dossier, ce que l'exigence des responsables interdit pour l'instant." }
    references:
      - title: Storage Reports Management
        url: https://learn.microsoft.com/en-us/windows-server/storage/fsrm/storage-reports-management
      - title: New-FsrmStorageReport (FileServerResourceManager)
        url: https://learn.microsoft.com/en-us/powershell/module/fileserverresourcemanager/new-fsrmstoragereport

  # ------------------------------------------------------------------ 8
  - id: az802-qz-52-08
    objective: "5.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys has a file server named **HQ-FS1** at headquarters that stores 1.5 TB of product images in D:\Catalog. A new branch office has a file server named **BR-FS1** that runs Windows Server 2025, connected to headquarters by a slow WAN link.

        You plan to replicate D:\Catalog to BR-FS1 by using DFS Replication. The solution must meet the following requirements:

        - Initial replication must send as little data as possible over the WAN link.
        - The files of HQ-FS1 must win any conflict during initial replication.
        - Changes made to the files on BR-FS1 must never replicate to HQ-FS1.

        Which three actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose au siège d'un serveur de fichiers nommé **HQ-FS1** qui stocke 1,5 To d'images de produits dans D:\Catalog. Une nouvelle succursale dispose d'un serveur de fichiers nommé **BR-FS1** qui exécute Windows Server 2025, relié au siège par une liaison WAN lente.

        Vous prévoyez de répliquer D:\Catalog vers BR-FS1 à l'aide de la réplication DFS. La solution doit répondre aux exigences suivantes :

        - La réplication initiale doit envoyer le moins de données possible sur la liaison WAN.
        - Les fichiers de HQ-FS1 doivent l'emporter en cas de conflit pendant la réplication initiale.
        - Les modifications apportées aux fichiers sur BR-FS1 ne doivent jamais être répliquées vers HQ-FS1.

        Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Copy D:\\Catalog to BR-FS1 with Robocopy before you create the replication group.", fr: "Copier D:\\Catalog sur BR-FS1 avec Robocopy avant de créer le groupe de réplication." } }
        - { id: b, text: { en: "Designate BR-FS1 as the primary member so that only differing blocks cross the WAN.", fr: "Désigner BR-FS1 comme membre principal pour que seuls les blocs différents traversent le WAN." } }
        - { id: c, text: { en: "Designate HQ-FS1 as the primary member of the replicated folder.", fr: "Désigner HQ-FS1 comme membre principal du dossier répliqué." } }
        - { id: d, text: { en: "Make the membership of BR-FS1 in the replicated folder read-only.", fr: "Rendre l'appartenance de BR-FS1 au dossier répliqué en lecture seule." } }
        - { id: e, text: { en: "Create a Storage Replica partnership from HQ-FS1 to BR-FS1 for the volume that holds D:\\Catalog.", fr: "Créer un partenariat de réplica de stockage de HQ-FS1 vers BR-FS1 pour le volume qui contient D:\\Catalog." } }
        - { id: f, text: { en: "Enable access-based enumeration on the share of D:\\Catalog on BR-FS1.", fr: "Activer l'énumération basée sur l'accès sur le partage de D:\\Catalog sur BR-FS1." } }
    answer: { optionIds: [a, c, d] }
    explanation:
      correct:
        en: |
          Pre-seeding BR-FS1 with Robocopy before setting up replication means that initial synchronization mostly compares files instead of copying 1.5 TB over the WAN. HQ-FS1 as the primary member is authoritative during initial replication, so its files overwrite differing versions. A read-only membership on BR-FS1 prevents local changes there, so nothing originates on BR-FS1 to replicate back to headquarters.
        fr: |
          Préamorcer BR-FS1 avec Robocopy avant de configurer la réplication fait que la synchronisation initiale compare surtout des fichiers au lieu de copier 1,5 To sur le WAN. HQ-FS1, membre principal, fait autorité pendant la réplication initiale : ses fichiers remplacent les versions différentes. Une appartenance en lecture seule sur BR-FS1 empêche les modifications locales : rien ne part de BR-FS1 pour être répliqué vers le siège.
      options:
        b: { en: "The primary member's files win initial replication: BR-FS1 as primary would make the branch copy authoritative, against the second requirement.", fr: "Les fichiers du membre principal l'emportent lors de la réplication initiale : BR-FS1 comme membre principal rendrait la copie de la succursale faisant autorité, contre la deuxième exigence." }
        e: { en: "Storage Replica replicates a whole volume at block level and dismounts the destination, so branch users couldn't read the files on BR-FS1.", fr: "Le réplica de stockage réplique un volume entier au niveau bloc et démonte la destination : les utilisateurs de la succursale ne pourraient pas lire les fichiers sur BR-FS1." }
        f: { en: "Access-based enumeration hides folders that users can't open; it neither blocks changes nor affects what replicates.", fr: "L'énumération basée sur l'accès masque les dossiers que les utilisateurs ne peuvent pas ouvrir ; elle ne bloque pas les modifications et n'agit pas sur ce qui est répliqué." }
    references:
      - title: Use Robocopy to pre-seed files for DFS Replication
        url: https://learn.microsoft.com/en-us/windows-server/storage/dfs-replication/preseed-dfsr-with-robocopy
      - title: Set-DfsrMembership (DFSR)
        url: https://learn.microsoft.com/en-us/powershell/module/dfsr/set-dfsrmembership

  # ------------------------------------------------------------------ 9
  - id: az802-qz-52-09
    objective: "5.2.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        A file server named **FSEDGE3** runs Windows Server 2025 and accepts SMB over QUIC connections. Client access control is enabled on FSEDGE3 by `Set-SmbServerCertificateMapping -RequireClientAuthentication $true`. The access control list contains the following entries:

        | Entry | Identifier type | Identifier |
        | --- | --- | --- |
        | Grant | ISSUER | CN=Contoso Root CA |
        | Block | ISSUER | CN=Contoso Partner CA |
        | Grant | SHA256 | Hash of the client certificate of LAPTOP7 |

        Contoso Device CA and Contoso Partner CA are intermediate CAs issued by Contoso Root CA. Fabrikam Issuing CA belongs to another PKI that FSEDGE3 trusts. All the devices run Windows 11 version 24H2 and have a Client Authentication certificate mapped for FSEDGE3:

        - LAPTOP3: certificate issued by Contoso Device CA
        - LAPTOP7: certificate issued by Contoso Partner CA
        - LAPTOP9: certificate issued by Fabrikam Issuing CA

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un serveur de fichiers nommé **FSEDGE3** exécute Windows Server 2025 et accepte les connexions SMB sur QUIC. Le contrôle d'accès client est activé sur FSEDGE3 par `Set-SmbServerCertificateMapping -RequireClientAuthentication $true`. La liste de contrôle d'accès contient les entrées suivantes :

        | Entrée | Type d'identificateur | Identificateur |
        | --- | --- | --- |
        | Grant | ISSUER | CN=Contoso Root CA |
        | Block | ISSUER | CN=Contoso Partner CA |
        | Grant | SHA256 | Hachage du certificat client de LAPTOP7 |

        Contoso Device CA et Contoso Partner CA sont des autorités de certification intermédiaires émises par Contoso Root CA. Fabrikam Issuing CA appartient à une autre PKI qu'approuve FSEDGE3. Tous les appareils exécutent Windows 11 version 24H2 et disposent d'un certificat d'authentification du client mappé pour FSEDGE3 :

        - LAPTOP3 : certificat émis par Contoso Device CA
        - LAPTOP7 : certificat émis par Contoso Partner CA
        - LAPTOP9 : certificat émis par Fabrikam Issuing CA

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si elle est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "LAPTOP3 can establish an SMB over QUIC connection to FSEDGE3.", fr: "LAPTOP3 peut établir une connexion SMB sur QUIC avec FSEDGE3." } }
        - { id: s2, text: { en: "LAPTOP7 can establish an SMB over QUIC connection to FSEDGE3.", fr: "LAPTOP7 peut établir une connexion SMB sur QUIC avec FSEDGE3." } }
        - { id: s3, text: { en: "LAPTOP9 can establish an SMB over QUIC connection to FSEDGE3.", fr: "LAPTOP9 peut établir une connexion SMB sur QUIC avec FSEDGE3." } }
    answer: { values: { s1: true, s2: false, s3: false } }
    explanation:
      correct:
        en: |
          A client is granted access when no certificate of its chain is blocked and at least one is granted. LAPTOP3 chains to Contoso Root CA, which is granted, and nothing in its chain is blocked: Yes. LAPTOP7 has an allow entry for its own certificate, but its issuer Contoso Partner CA is blocked, and a deny anywhere in the chain wins: No. LAPTOP9's chain is trusted but contains no granted certificate, so it isn't allowed: No.
        fr: |
          Un client obtient l'accès quand aucun certificat de sa chaîne n'est bloqué et qu'au moins un est autorisé. LAPTOP3 remonte à Contoso Root CA, autorisée, et rien dans sa chaîne n'est bloqué : Oui. LAPTOP7 a une entrée d'autorisation pour son propre certificat, mais son émetteur Contoso Partner CA est bloqué, et un refus n'importe où dans la chaîne l'emporte : Non. La chaîne de LAPTOP9 est approuvée mais ne contient aucun certificat autorisé : il n'est donc pas admis, Non.
      options:
        s2: { en: "The SHA256 allow entry of LAPTOP7 doesn't override the block entry of its issuing CA: deny entries take priority over allow entries.", fr: "L'entrée d'autorisation SHA256 de LAPTOP7 ne l'emporte pas sur l'entrée de blocage de son autorité émettrice : les entrées de refus priment sur les entrées d'autorisation." }
        s3: { en: "A trusted chain is checked first, but with client access control the client also needs an allow entry somewhere in its chain.", fr: "La chaîne approuvée est vérifiée d'abord, mais avec le contrôle d'accès client, le client a aussi besoin d'une entrée d'autorisation quelque part dans sa chaîne." }
    references:
      - title: Configure SMB over QUIC client access control in Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/configure-smb-over-quic-client-access-control

  # ------------------------------------------------------------------ 10
  - id: az802-qz-52-10
    objective: "5.2.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank has a file server named **FS6** that runs Windows Server 2025 and hosts two shares, **HR** and **Scans**. The following devices use SMB:

        - Windows 11 version 24H2 laptops, which connect to FS6 and to other Windows Server 2025 file servers.
        - **SCAN1**, a multifunction printer that supports SMB 2.1 only and saves files to Scans.
        - **APP1**, a Windows Server 2025 server that connects to HR and to **NAS3**, a third-party appliance that supports dialects up to SMB 3.0 and doesn't support SMB encryption.

        You need to meet the following requirements:

        - No device can ever access HR without SMB encryption.
        - SCAN1 keeps saving files to Scans.
        - The laptops refuse to connect to any SMB server that doesn't encrypt the connection.
        - APP1 keeps reaching NAS3.

        What should you configure? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un serveur de fichiers nommé **FS6** qui exécute Windows Server 2025 et héberge deux partages, **HR** et **Scans**. Les appareils suivants utilisent SMB :

        - Des ordinateurs portables Windows 11 version 24H2, qui se connectent à FS6 et à d'autres serveurs de fichiers Windows Server 2025.
        - **SCAN1**, une imprimante multifonction qui ne prend en charge que SMB 2.1 et enregistre des fichiers dans Scans.
        - **APP1**, un serveur Windows Server 2025 qui se connecte à HR et à **NAS3**, une appliance tierce qui prend en charge les dialectes jusqu'à SMB 3.0 et ne prend pas en charge le chiffrement SMB.

        Vous devez répondre aux exigences suivantes :

        - Aucun appareil ne doit jamais accéder à HR sans chiffrement SMB.
        - SCAN1 continue d'enregistrer des fichiers dans Scans.
        - Les ordinateurs portables refusent de se connecter à tout serveur SMB qui ne chiffre pas la connexion.
        - APP1 continue de joindre NAS3.

        Que devez-vous configurer ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          On FS6: [[fs6]]

          On the laptops: [[laptops]]

          On APP1: [[app1]]
        fr: |
          Sur FS6 : [[fs6]]

          Sur les ordinateurs portables : [[laptops]]

          Sur APP1 : [[app1]]
      slots:
        - id: fs6
          options:
            - { id: share, text: "Set-SmbShare -Name HR -EncryptData $true" }
            - { id: server, text: "Set-SmbServerConfiguration -EncryptData $true" }
            - { id: serverlegacy, text: "Set-SmbServerConfiguration -EncryptData $true -RejectUnencryptedAccess $false" }
        - id: laptops
          options:
            - { id: mapping, text: "New-SmbMapping -RemotePath \\\\FS6\\HR -RequirePrivacy $true" }
            - { id: clientreq, text: "Set-SmbClientConfiguration -RequireEncryption $true" }
            - { id: signing, text: "Set-SmbClientConfiguration -RequireSecuritySignature $true" }
        - id: app1
          options:
            - { id: appreq, text: "Set-SmbClientConfiguration -RequireEncryption $true" }
            - { id: dialect, text: "Set-SmbClientConfiguration -Smb2DialectMin SMB311" }
            - { id: default, text: { en: "Keep the default value of RequireEncryption ($false)", fr: "Conserver la valeur par défaut de RequireEncryption ($false)" } }
    answer: { values: { fs6: share, laptops: clientreq, app1: default } }
    explanation:
      correct:
        en: |
          Encrypting the HR share alone leaves Scans unencrypted, so SCAN1 keeps working, and with RejectUnencryptedAccess at its default `$true`, a client that can't encrypt is denied on HR. `Set-SmbClientConfiguration -RequireEncryption $true` makes the laptops refuse every server that doesn't support SMB 3 encryption. APP1 must keep the default client setting, because NAS3 supports SMB 3.0 without encryption; HR traffic of APP1 is still encrypted because the share requires it.
        fr: |
          Chiffrer le seul partage HR laisse Scans non chiffré : SCAN1 continue de fonctionner, et avec RejectUnencryptedAccess à sa valeur par défaut `$true`, un client incapable de chiffrer est refusé sur HR. `Set-SmbClientConfiguration -RequireEncryption $true` fait refuser aux portables tout serveur qui ne prend pas en charge le chiffrement SMB 3. APP1 doit conserver le paramètre client par défaut, car NAS3 prend en charge SMB 3.0 sans chiffrement ; le trafic HR d'APP1 reste chiffré puisque le partage l'exige.
      options:
        server: { en: "Server-wide encryption also covers Scans; with RejectUnencryptedAccess at $true, SCAN1 (SMB 2.1) would be rejected.", fr: "Le chiffrement de tout le serveur couvre aussi Scans ; avec RejectUnencryptedAccess à $true, SCAN1 (SMB 2.1) serait refusé." }
        serverlegacy: { en: "RejectUnencryptedAccess $false lets clients without SMB 3 access every encrypted share unencrypted, HR included.", fr: "RejectUnencryptedAccess $false laisse les clients sans SMB 3 accéder sans chiffrement à tous les partages chiffrés, HR compris." }
        mapping: { en: "RequirePrivacy encrypts one mapping only; the laptops would still connect unencrypted to other servers.", fr: "RequirePrivacy ne chiffre qu'un mappage ; les portables se connecteraient encore sans chiffrement aux autres serveurs." }
        signing: { en: "Signing protects integrity but doesn't encrypt; it doesn't make the client refuse servers without encryption.", fr: "La signature protège l'intégrité mais ne chiffre pas ; elle ne fait pas refuser au client les serveurs sans chiffrement." }
        appreq: { en: "Requiring encryption on APP1 would block its connections to NAS3, which doesn't support SMB encryption.", fr: "Exiger le chiffrement sur APP1 bloquerait ses connexions vers NAS3, qui ne prend pas en charge le chiffrement SMB." }
        dialect: { en: "A minimum dialect of SMB 3.1.1 on APP1 would block NAS3, which supports SMB 3.0 only.", fr: "Un dialecte minimal SMB 3.1.1 sur APP1 bloquerait NAS3, qui ne prend en charge que SMB 3.0." }
    references:
      - title: SMB Security Enhancements
        url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-security
      - title: Configure the SMB client to require encryption in Windows
        url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/configure-smb-client-require-encryption
