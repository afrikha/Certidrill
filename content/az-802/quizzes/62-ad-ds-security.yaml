chapter: 62-ad-ds-security
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-62-01
    objective: "6.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Your network contains an Active Directory Domain Services (AD DS) domain named **contoso.com**. Two password settings objects (PSOs) apply to the members of the IT and Finance groups. No PSO applies to the other user accounts of the domain.

        You need to change the minimum password length for all the domain user accounts to which no PSO applies.

        Where should you configure the setting?
      fr: |
        Votre réseau contient un domaine Active Directory Domain Services (AD DS) nommé **contoso.com**. Deux objets de paramètres de mot de passe (PSO) s'appliquent aux membres des groupes IT et Finance. Aucun PSO ne s'applique aux autres comptes d'utilisateur du domaine.

        Vous devez modifier la longueur minimale du mot de passe de tous les comptes d'utilisateur du domaine auxquels aucun PSO ne s'applique.

        Où devez-vous configurer ce paramètre ?
    body:
      options:
        - { id: a, text: { en: "In the Default Domain Controllers Policy GPO, linked to the Domain Controllers OU", fr: "Dans le GPO Default Domain Controllers Policy, lié à l'UO Domain Controllers" } }
        - { id: b, text: { en: "In the Default Domain Policy GPO, linked to the contoso.com domain", fr: "Dans le GPO Default Domain Policy, lié au domaine contoso.com" } }
        - { id: c, text: { en: "In a new GPO, linked to each OU that contains user accounts", fr: "Dans un nouveau GPO, lié à chaque UO qui contient des comptes d'utilisateur" } }
        - { id: d, text: { en: "In the local security policy of the domain controller that holds the PDC emulator role", fr: "Dans la stratégie de sécurité locale du contrôleur de domaine qui détient le rôle d'émulateur PDC" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A domain has a single default password and lockout policy for its domain accounts: the one set in a GPO linked to the domain, the Default Domain Policy by default. When no PSO is linked to a user or to one of their global security groups, this default policy applies.
        fr: |
          Un domaine a une seule stratégie de mot de passe et de verrouillage par défaut pour ses comptes de domaine : celle définie dans un GPO lié au domaine, la Default Domain Policy par défaut. Quand aucun PSO n'est lié à un utilisateur ni à l'un de ses groupes de sécurité globaux, c'est cette stratégie par défaut qui s'applique.
      options:
        a: { en: "Password settings in a GPO linked to the Domain Controllers OU don't define the password policy of the domain accounts.", fr: "Les paramètres de mot de passe d'un GPO lié à l'UO Domain Controllers ne définissent pas la stratégie de mot de passe des comptes de domaine." }
        c: { en: "Password settings in a GPO linked to an OU apply only to the local accounts of the computers in that OU, not to domain accounts.", fr: "Les paramètres de mot de passe d'un GPO lié à une UO ne s'appliquent qu'aux comptes locaux des ordinateurs de cette UO, pas aux comptes de domaine." }
        d: { en: "The domain password policy is defined by Group Policy at the domain level, not by the local policy of one domain controller.", fr: "La stratégie de mot de passe du domaine est définie par une stratégie de groupe au niveau du domaine, pas par la stratégie locale d'un contrôleur de domaine." }
    references:
      - title: "AD DS: Fine-Grained Password Policies"
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc770394(v=ws.10)

  # ------------------------------------------------------------------ 2
  - id: az802-qz-62-02
    objective: "6.2.7"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The **fabrikam.com** forest has one domain. The Enterprise Admins group contains no user accounts. Next week, an administrator who signs in with an account named **adm-jade** must create a child domain, a task that requires Enterprise Admins rights.

        You need to follow Microsoft's least-privilege guidance for the Enterprise Admins group.

        What should you do?
      fr: |
        La forêt **fabrikam.com** comprend un seul domaine. Le groupe Enterprise Admins ne contient aucun compte d'utilisateur. La semaine prochaine, un administrateur qui se connecte avec un compte nommé **adm-jade** doit créer un domaine enfant, une tâche qui exige les droits Enterprise Admins.

        Vous devez suivre les recommandations de Microsoft relatives au privilège minimum pour le groupe Enterprise Admins.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add adm-jade to Enterprise Admins for the duration of the task, and then remove it", fr: "Ajouter adm-jade à Enterprise Admins pendant la durée de la tâche, puis l'en retirer" } }
        - { id: b, text: { en: "Add the Domain Admins group to Enterprise Admins permanently, and then use adm-jade", fr: "Ajouter définitivement le groupe Domain Admins à Enterprise Admins, puis utiliser adm-jade" } }
        - { id: c, text: { en: "Add adm-jade to Schema Admins for the duration of the task, and then remove it", fr: "Ajouter adm-jade à Schema Admins pendant la durée de la tâche, puis l'en retirer" } }
        - { id: d, text: { en: "Add adm-jade to Account Operators permanently, so that it can create the domain", fr: "Ajouter définitivement adm-jade à Account Operators, pour qu'il puisse créer le domaine" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Enterprise Admins should contain no user accounts on a day-to-day basis. When a forest-wide change requires this level of rights, the account that performs it is placed in the group temporarily and removed when the change is done.
        fr: |
          Enterprise Admins ne doit contenir aucun compte d'utilisateur au quotidien. Quand une modification à l'échelle de la forêt exige ce niveau de droits, le compte qui l'effectue est placé temporairement dans le groupe, puis en est retiré une fois la modification terminée.
      options:
        b: { en: "A permanent membership gives forest-wide rights to every domain administrator every day, which is the opposite of the recommended empty group.", fr: "Une appartenance permanente donne chaque jour des droits sur toute la forêt à chaque administrateur de domaine, ce qui est l'inverse du groupe vide recommandé." }
        c: { en: "Schema Admins can modify the schema; this membership doesn't grant the rights needed to add a domain to the forest.", fr: "Schema Admins permet de modifier le schéma ; cette appartenance n'accorde pas les droits nécessaires pour ajouter un domaine à la forêt." }
        d: { en: "Account Operators manages accounts and groups in a domain; it can't create a domain, and Microsoft recommends keeping it empty.", fr: "Account Operators gère les comptes et les groupes d'un domaine ; il ne peut pas créer de domaine, et Microsoft recommande de le laisser vide." }
    references:
      - title: Implementing Least-Privilege Administrative Models
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/implementing-least-privilege-administrative-models

  # ------------------------------------------------------------------ 3
  - id: az802-qz-62-03
    objective: "6.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Your network contains an AD DS domain named **adatum.com**. The domain functional level is Windows Server 2016. Yesterday, you added the accounts of the domain administrators to the **Protected Users** group.

        You need to review, on the domain controllers, the NTLM sign-in attempts of these accounts that the domain controllers reject. You plan to enable a log in Event Viewer under **Applications and Services Logs\Microsoft\Windows\Authentication**.

        Which log should you enable?
      fr: |
        Votre réseau contient un domaine AD DS nommé **adatum.com**. Le niveau fonctionnel du domaine est Windows Server 2016. Hier, vous avez ajouté les comptes des administrateurs du domaine au groupe **Protected Users**.

        Vous devez examiner, sur les contrôleurs de domaine, les tentatives d'ouverture de session NTLM de ces comptes que les contrôleurs de domaine refusent. Vous prévoyez d'activer un journal dans l'Observateur d'événements sous **Journaux des applications et des services\Microsoft\Windows\Authentication**.

        Quel journal devez-vous activer ?
    body:
      options:
        - { id: a, text: ProtectedUserSuccesses-DomainController }
        - { id: b, text: ProtectedUser-Client }
        - { id: c, text: AuthenticationPolicyFailures-DomainController }
        - { id: d, text: ProtectedUserFailures-DomainController }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The Protected Users logs are disabled by default; you enable each one in Event Viewer. On the domain controllers, **ProtectedUserFailures-DomainController** records the failures of Protected Users members, such as event 100 for a rejected NTLM sign-in and event 104 for DES or RC4 used in Kerberos preauthentication.
        fr: |
          Les journaux de Protected Users sont désactivés par défaut ; vous activez chacun d'eux dans l'Observateur d'événements. Sur les contrôleurs de domaine, **ProtectedUserFailures-DomainController** enregistre les échecs des membres de Protected Users, comme l'événement 100 pour une ouverture de session NTLM refusée et l'événement 104 pour DES ou RC4 utilisé dans la pré-authentification Kerberos.
      options:
        a: { en: "This log records the Kerberos TGTs issued to Protected Users members (event 303), not the rejected sign-ins.", fr: "Ce journal enregistre les TGT Kerberos émis aux membres de Protected Users (événement 303), pas les ouvertures de session refusées." }
        b: { en: "This log is on the devices and records the credentials that the security packages don't store for members; it doesn't record domain controller rejections.", fr: "Ce journal se trouve sur les appareils et enregistre les informations d'identification que les packages de sécurité ne stockent pas pour les membres ; il n'enregistre pas les refus des contrôleurs de domaine." }
        c: { en: "This log records the failures caused by authentication policies and silos, not by Protected Users membership.", fr: "Ce journal enregistre les échecs dus aux stratégies et silos d'authentification, pas à l'appartenance à Protected Users." }
    references:
      - title: Protected Users security group
        url: https://learn.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/protected-users-security-group

  # ------------------------------------------------------------------ 4
  - id: az802-qz-62-04
    objective: "6.2.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        The **litware.com** domain contains two writable domain controllers named **DC1** and **DC2**, and a read-only domain controller named **RODC1** in a branch office. You plan to deploy Microsoft Entra Password Protection. The proxy service will run on two member servers that have outbound HTTPS access.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le domaine **litware.com** contient deux contrôleurs de domaine accessibles en écriture nommés **DC1** et **DC2**, et un contrôleur de domaine en lecture seule nommé **RODC1** dans une succursale. Vous prévoyez de déployer la protection par mot de passe Microsoft Entra. Le service proxy s'exécutera sur deux serveurs membres qui disposent d'un accès HTTPS sortant.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "The DC agent works properly only if the SYSVOL folder of litware.com is replicated by using DFS Replication (DFSR)."
            fr: "L'agent DC ne fonctionne correctement que si le dossier SYSVOL de litware.com est répliqué à l'aide de la réplication DFS (DFSR)."
        - id: s2
          text:
            en: "For the password changes of the branch users to be validated, you must install the DC agent on RODC1."
            fr: "Pour que les changements de mot de passe des utilisateurs de la succursale soient validés, vous devez installer l'agent DC sur RODC1."
        - id: s3
          text:
            en: "As soon as the DC agent installation completes on DC2, DC2 validates new passwords, without a restart."
            fr: "Dès que l'installation de l'agent DC se termine sur DC2, DC2 valide les nouveaux mots de passe, sans redémarrage."
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          The DC agent caches the password policy in SYSVOL, and a domain that runs it must use DFSR for SYSVOL replication: on FRS, the software installs but doesn't work properly. RODCs don't process password changes; they forward them to writable domain controllers, so the agent isn't needed there. Installing the agent requires a restart, because password filter DLLs are loaded only at startup.
        fr: |
          L'agent DC met en cache la stratégie de mot de passe dans SYSVOL, et un domaine qui l'exécute doit utiliser DFSR pour la réplication de SYSVOL : avec FRS, le logiciel s'installe mais ne fonctionne pas correctement. Les RODC ne traitent pas les changements de mot de passe ; ils les transmettent aux contrôleurs de domaine accessibles en écriture, l'agent n'y est donc pas nécessaire. L'installation de l'agent exige un redémarrage, car les DLL de filtre de mot de passe ne sont chargées qu'au démarrage.
      options:
        s2: { en: "A password change made through RODC1 is forwarded to DC1 or DC2, where their DC agent validates it.", fr: "Un changement de mot de passe effectué par RODC1 est transmis à DC1 ou DC2, où leur agent DC le valide." }
        s3: { en: "The password filter DLL of the agent is loaded only when the domain controller restarts.", fr: "La DLL de filtre de mot de passe de l'agent n'est chargée qu'au redémarrage du contrôleur de domaine." }
    references:
      - title: Plan and deploy on-premises Microsoft Entra Password Protection
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-password-ban-bad-on-premises-deploy

  # ------------------------------------------------------------------ 5
  - id: az802-qz-62-05
    objective: "6.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The domain controllers of **tailspintoys.com**, DC1 and DC2, are virtual machines on a Hyper-V cluster named **HVC1**. HVC1 also hosts 40 application virtual machines that an application team administers, and the cluster storage is managed by a storage team. Neither team is part of Tier 0.

        You need to apply Microsoft's guidance for securing virtual domain controllers. The domain controllers must remain writable virtual machines.

        What should you do?
      fr: |
        Les contrôleurs de domaine de **tailspintoys.com**, DC1 et DC2, sont des machines virtuelles d'un cluster Hyper-V nommé **HVC1**. HVC1 héberge aussi 40 machines virtuelles applicatives administrées par une équipe applicative, et le stockage du cluster est géré par une équipe stockage. Aucune de ces équipes ne fait partie du niveau 0.

        Vous devez appliquer les recommandations de Microsoft pour sécuriser les contrôleurs de domaine virtuels. Les contrôleurs de domaine doivent rester des machines virtuelles accessibles en écriture.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep DC1 and DC2 on HVC1, and take a production checkpoint of each one every day", fr: "Garder DC1 et DC2 sur HVC1, et prendre chaque jour un point de contrôle de production de chacun" } }
        - { id: b, text: { en: "Keep DC1 and DC2 on HVC1, and reinstall them by using the Server Core option", fr: "Garder DC1 et DC2 sur HVC1, et les réinstaller avec l'option Server Core" } }
        - { id: c, text: { en: "Move DC1 and DC2 to Hyper-V hosts that run no other virtual machines, on separate storage", fr: "Déplacer DC1 et DC2 vers des hôtes Hyper-V qui n'exécutent aucune autre machine virtuelle, sur un stockage distinct" } }
        - { id: d, text: { en: "Move DC1 and DC2 to a second cluster node, and add the application team to Protected Users", fr: "Déplacer DC1 et DC2 vers un deuxième nœud du cluster, et ajouter l'équipe applicative à Protected Users" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Microsoft recommends that virtual domain controllers run on physical hosts separate from the other virtual machines, and that their storage be separated so that storage administrators can't access the virtual machine files. Whoever administers the host or the storage of a domain controller can read its database, so these people would otherwise hold Tier 0 power.
        fr: |
          Microsoft recommande que les contrôleurs de domaine virtuels s'exécutent sur des hôtes physiques distincts des autres machines virtuelles, et que leur stockage soit séparé pour que les administrateurs du stockage ne puissent pas accéder aux fichiers des machines virtuelles. Quiconque administre l'hôte ou le stockage d'un contrôleur de domaine peut lire sa base de données : ces personnes détiendraient sinon un pouvoir de niveau 0.
      options:
        a: { en: "Checkpoints don't reduce the exposure: the application and storage teams can still reach the virtual machine files, including the checkpoint files.", fr: "Les points de contrôle ne réduisent pas l'exposition : les équipes applicative et stockage peuvent toujours atteindre les fichiers des machines virtuelles, y compris ceux des points de contrôle." }
        b: { en: "Server Core reduces the attack surface of the guest, but non-Tier 0 teams still control the hosts and the storage of the domain controllers.", fr: "Server Core réduit la surface d'attaque de l'invité, mais des équipes hors niveau 0 contrôlent toujours les hôtes et le stockage des contrôleurs de domaine." }
        d: { en: "Another node of the same cluster is still administered by the same teams, and Protected Users doesn't restrict host or storage administration.", fr: "Un autre nœud du même cluster reste administré par les mêmes équipes, et Protected Users ne restreint pas l'administration des hôtes ni du stockage." }
    references:
      - title: Securing domain controllers against attack
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/securing-domain-controllers-against-attack

  # ------------------------------------------------------------------ 6
  - id: az802-qz-62-06
    objective: "6.2.6"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Your network contains an AD DS domain named **contoso.com**. The domain functional level is Windows Server 2016. An administrator signs in with an account named **adm-tom** on a laptop named **LT12**, which he also uses while traveling, with no connection to the corporate network. adm-tom regularly opens the share `\\10.20.0.8\Firmware` on a NAS that is reached by its IP address. A web server named **WEB2**, used by all the employees, is trusted for unconstrained delegation.

        You need to ensure that no service can use the credentials of adm-tom through Kerberos delegation. The solution must not prevent adm-tom from signing in to LT12 while traveling or from opening the NAS share, and it must not affect the other users of WEB2.

        What should you do?
      fr: |
        Votre réseau contient un domaine AD DS nommé **contoso.com**. Le niveau fonctionnel du domaine est Windows Server 2016. Un administrateur se connecte avec un compte nommé **adm-tom** sur un ordinateur portable nommé **LT12**, qu'il utilise aussi en déplacement, sans connexion au réseau de l'entreprise. adm-tom ouvre régulièrement le partage `\\10.20.0.8\Firmware` d'un NAS joint par son adresse IP. Un serveur web nommé **WEB2**, utilisé par tous les employés, est approuvé pour la délégation non contrainte.

        Vous devez faire en sorte qu'aucun service ne puisse utiliser les informations d'identification d'adm-tom par délégation Kerberos. La solution ne doit pas empêcher adm-tom d'ouvrir une session sur LT12 en déplacement ni d'ouvrir le partage du NAS, et elle ne doit pas affecter les autres utilisateurs de WEB2.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add adm-tom to the Protected Users group.", fr: "Ajouter adm-tom au groupe Protected Users." } }
        - { id: b, text: { en: "Clear the trust for delegation on the computer account of WEB2.", fr: "Désactiver l'approbation pour la délégation sur le compte d'ordinateur de WEB2." } }
        - { id: c, text: { en: "Select Account is sensitive and cannot be delegated for adm-tom.", fr: "Sélectionner Account is sensitive and cannot be delegated pour adm-tom." } }
        - { id: d, text: { en: "Select Smart card is required for interactive logon for adm-tom.", fr: "Sélectionner Smart card is required for interactive logon pour adm-tom." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          **Account is sensitive and cannot be delegated** (the AccountNotDelegated property) prevents the security context of the account from being delegated to a service, even one trusted for Kerberos delegation. It changes nothing else for the account: cached sign-in on LT12 and NTLM to the NAS keep working, and WEB2 still delegates the other users.
        fr: |
          **Account is sensitive and cannot be delegated** (la propriété AccountNotDelegated) empêche la délégation du contexte de sécurité du compte à un service, même approuvé pour la délégation Kerberos. Elle ne change rien d'autre pour le compte : l'ouverture de session mise en cache sur LT12 et NTLM vers le NAS continuent de fonctionner, et WEB2 délègue toujours les autres utilisateurs.
      options:
        a: { en: "Protected Users blocks delegation, but it also blocks NTLM, needed to reach the NAS by IP address, and offline sign-in on LT12.", fr: "Protected Users bloque la délégation, mais bloque aussi NTLM, nécessaire pour joindre le NAS par son adresse IP, et l'ouverture de session hors connexion sur LT12." }
        b: { en: "Removing the delegation trust of WEB2 breaks delegation for every user of the application, which the requirements forbid.", fr: "Retirer l'approbation pour la délégation de WEB2 casse la délégation pour tous les utilisateurs de l'application, ce que les exigences interdisent." }
        d: { en: "A smart card requirement changes how adm-tom signs in, not whether a service can delegate his credentials.", fr: "Exiger une carte à puce change la façon dont adm-tom ouvre une session, pas la possibilité pour un service de déléguer ses informations d'identification." }
    references:
      - title: Set-ADAccountControl (ActiveDirectory)
        url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/set-adaccountcontrol
      - title: Protected Users security group
        url: https://learn.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/protected-users-security-group

  # ------------------------------------------------------------------ 7
  - id: az802-qz-62-07
    objective: "6.2.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Your network contains an AD DS domain named **fabrikam.com**. The domain functional level is Windows Server 2016. The Tier 0 accounts belong to an authentication policy silo named **T0-Silo**. Its authentication policy, **T0-Pol**, is enforced and lets these accounts obtain a TGT only from devices that belong to T0-Silo. **KDC support for claims, compound authentication and Kerberos armoring** is enabled in the Default Domain Controllers Policy GPO. A GPO named **GPO-PAW**, linked only to an OU named **PAW**, enables **Kerberos client support for claims, compound authentication and Kerberos armoring**.

        An administrator named **adm-lina** signs in successfully on PAW1 and PAW2, which are in the PAW OU. You deploy a new privileged access workstation named **PAW3** that runs Windows 11, leave its computer account in an OU named **Staging**, grant it access to T0-Silo and assign the silo to it. The sign-in of adm-lina on PAW3 fails, and event ID 105 is logged in the AuthenticationPolicyFailures-DomainController log.

        You need adm-lina to be able to sign in on PAW3. T0-Pol must remain enforced.

        What should you do?
      fr: |
        Votre réseau contient un domaine AD DS nommé **fabrikam.com**. Le niveau fonctionnel du domaine est Windows Server 2016. Les comptes du niveau 0 appartiennent à un silo de stratégies d'authentification nommé **T0-Silo**. Sa stratégie d'authentification, **T0-Pol**, est appliquée et ne permet à ces comptes d'obtenir un TGT que depuis des appareils qui appartiennent à T0-Silo. **KDC support for claims, compound authentication and Kerberos armoring** est activé dans le GPO Default Domain Controllers Policy. Un GPO nommé **GPO-PAW**, lié uniquement à une UO nommée **PAW**, active **Kerberos client support for claims, compound authentication and Kerberos armoring**.

        Un administrateur nommé **adm-lina** ouvre une session sans problème sur PAW1 et PAW2, qui se trouvent dans l'UO PAW. Vous déployez une nouvelle station de travail à accès privilégié nommée **PAW3** qui exécute Windows 11, laissez son compte d'ordinateur dans une UO nommée **Staging**, lui accordez l'accès à T0-Silo et lui attribuez le silo. L'ouverture de session d'adm-lina sur PAW3 échoue, et l'événement 105 est enregistré dans le journal AuthenticationPolicyFailures-DomainController.

        Vous devez permettre à adm-lina d'ouvrir une session sur PAW3. T0-Pol doit rester appliquée.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Configure T0-Pol to only audit policy restrictions for the members of T0-Silo.", fr: "Configurer T0-Pol pour qu'elle ne fasse qu'auditer les restrictions pour les membres de T0-Silo." } }
        - { id: b, text: { en: "Link a GPO that enables the KDC armoring support setting to the Staging OU.", fr: "Lier à l'UO Staging un GPO qui active le paramètre de prise en charge du blindage par le KDC." } }
        - { id: c, text: { en: "Add the computer account of PAW3 to the Protected Users group, and restart it.", fr: "Ajouter le compte d'ordinateur de PAW3 au groupe Protected Users, puis le redémarrer." } }
        - { id: d, text: { en: "Move the computer account of PAW3 to the PAW OU, and then restart PAW3.", fr: "Déplacer le compte d'ordinateur de PAW3 dans l'UO PAW, puis redémarrer PAW3." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A restriction on the device from which an account can authenticate is evaluated only on an armored Kerberos request, and a Windows 11 device sends one only when **Kerberos client support for claims, compound authentication and Kerberos armoring** is enabled. PAW3 doesn't receive GPO-PAW in the Staging OU, so its request is refused (event 105). Moving it to the PAW OU and restarting it applies the client setting.
        fr: |
          Une restriction sur l'appareil depuis lequel un compte peut s'authentifier n'est évaluée que sur une demande Kerberos blindée, et un appareil Windows 11 n'en envoie une que si **Kerberos client support for claims, compound authentication and Kerberos armoring** est activé. Dans l'UO Staging, PAW3 ne reçoit pas GPO-PAW : sa demande est donc refusée (événement 105). Le déplacer dans l'UO PAW et le redémarrer applique le paramètre client.
      options:
        a: { en: "An audit-only policy would let adm-lina sign in, but T0-Pol must remain enforced.", fr: "Une stratégie en audit seul laisserait adm-lina ouvrir une session, mais T0-Pol doit rester appliquée." }
        b: { en: "The KDC setting acts on domain controllers and is already enabled; PAW3 needs the Kerberos client setting.", fr: "Le paramètre KDC agit sur les contrôleurs de domaine et il est déjà activé ; PAW3 a besoin du paramètre client Kerberos." }
        c: { en: "Computer accounts must never be added to Protected Users, and membership doesn't enable armoring on the device.", fr: "Les comptes d'ordinateur ne doivent jamais être ajoutés à Protected Users, et l'appartenance n'active pas le blindage sur l'appareil." }
    references:
      - title: Guidance about how to configure protected accounts
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/how-to-configure-protected-accounts
      - title: Authentication Policies and Authentication Policy Silos
        url: https://learn.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/authentication-policies-and-authentication-policy-silos

  # ------------------------------------------------------------------ 8
  - id: az802-qz-62-08
    objective: "6.2.1"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Your network contains an AD DS domain named **woodgrovebank.com**. The password policies shown in the following table exist in the domain. Each PSO has a unique precedence value.

        Two users have the following memberships:

        - **u-sam**: member of GG-Admins and GG-Finance
        - **u-eva**: member of GG-Admins, GG-Finance and DL-Audit

        Answer each prompt by selecting the policy whose settings apply to the user.

        NOTE: Each correct selection is worth one point.
      fr: |
        Votre réseau contient un domaine AD DS nommé **woodgrovebank.com**. Les stratégies de mot de passe présentées dans le tableau suivant existent dans le domaine. Chaque PSO a une valeur de priorité unique.

        Deux utilisateurs ont les appartenances suivantes :

        - **u-sam** : membre de GG-Admins et de GG-Finance
        - **u-eva** : membre de GG-Admins, de GG-Finance et de DL-Audit

        Répondez à chaque consigne en sélectionnant la stratégie dont les paramètres s'appliquent à l'utilisateur.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "Password settings of u-sam", fr: "Paramètres de mot de passe de u-sam" }
        - id: p2
          text: { en: "Password settings of u-eva", fr: "Paramètres de mot de passe de u-eva" }
      grid:
        header: [{ en: "Policy", fr: "Stratégie" }, { en: "Precedence", fr: "Priorité" }, { en: "Applied to", fr: "Appliquée à" }, { en: "Minimum length", fr: "Longueur minimale" }]
        rows:
          - [{ text: PSO-Audit, area: audit }, { text: "5" }, { text: { en: "DL-Audit (domain local security group)", fr: "DL-Audit (groupe de sécurité de domaine local)" } }, { text: "18" }]
          - [{ text: PSO-Admins, area: admins }, { text: "10" }, { text: { en: "GG-Admins (global security group)", fr: "GG-Admins (groupe de sécurité global)" } }, { text: "16" }]
          - [{ text: PSO-Finance, area: finance }, { text: "20" }, { text: { en: "GG-Finance (global security group)", fr: "GG-Finance (groupe de sécurité global)" } }, { text: "14" }]
          - [{ text: PSO-Contract, area: contract }, { text: "40" }, { text: { en: "User account u-sam (direct link)", fr: "Compte d'utilisateur u-sam (lien direct)" } }, { text: "12" }]
          - [{ text: Default Domain Policy, area: ddp }, { text: "-" }, { text: { en: "Domain", fr: "Domaine" } }, { text: "10" }]
    answer:
      values: { p1: contract, p2: admins }
    explanation:
      correct:
        en: |
          A PSO linked directly to the user object is the resultant PSO, whatever the precedence of the PSOs received through groups: u-sam gets PSO-Contract even though PSO-Admins has a lower value. Without a direct link, only the PSOs of the user's global security groups are compared, and the lowest precedence value wins; PSOs linked to other types of groups, such as DL-Audit, are ignored. u-eva therefore gets PSO-Admins (10). Settings of several PSOs are never merged.
        fr: |
          Un PSO lié directement à l'objet utilisateur est le PSO résultant, quelle que soit la priorité des PSO reçus par des groupes : u-sam obtient PSO-Contract, bien que PSO-Admins ait une valeur plus faible. Sans lien direct, seuls les PSO des groupes de sécurité globaux de l'utilisateur sont comparés, et la plus petite valeur de priorité l'emporte ; les PSO liés à d'autres types de groupes, comme DL-Audit, sont ignorés. u-eva obtient donc PSO-Admins (10). Les paramètres de plusieurs PSO ne sont jamais fusionnés.
      options:
        audit: { en: "PSO-Audit is linked to a domain local group, so it never applies, despite its precedence of 5.", fr: "PSO-Audit est lié à un groupe de domaine local : il ne s'applique jamais, malgré sa priorité de 5." }
        finance: { en: "PSO-Finance (20) loses to PSO-Admins (10) for u-eva, and to the direct link of PSO-Contract for u-sam.", fr: "PSO-Finance (20) perd face à PSO-Admins (10) pour u-eva, et face au lien direct de PSO-Contract pour u-sam." }
        ddp: { en: "The Default Domain Policy applies only when no PSO is linked to the user or to one of their global security groups.", fr: "La Default Domain Policy ne s'applique que si aucun PSO n'est lié à l'utilisateur ni à l'un de ses groupes de sécurité globaux." }
    references:
      - title: "AD DS: Fine-Grained Password Policies"
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc770394(v=ws.10)
      - title: Configure fine grained password policies for Active Directory Domain Services in Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/adac/fine-grained-password-policies

  # ------------------------------------------------------------------ 9
  - id: az802-qz-62-09
    objective: "6.2.8"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Your network contains an AD DS domain named **litware.com**. The computer accounts of the workstations are in an OU named **Workstations**. The members of a group named **DT-Admins** manage the workstations. Only the Domain Admins can create GPOs and link them.

        You need the members of DT-Admins to be able to create new GPOs and link them to the Workstations OU. They must not be able to edit the GPOs created by other teams, or to link GPOs to the domain or to any other OU. The solution must follow the principle of least privilege.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Votre réseau contient un domaine AD DS nommé **litware.com**. Les comptes d'ordinateur des postes de travail se trouvent dans une UO nommée **Workstations**. Les membres d'un groupe nommé **DT-Admins** gèrent les postes de travail. Seuls les Domain Admins peuvent créer des GPO et les lier.

        Vous devez permettre aux membres de DT-Admins de créer de nouveaux GPO et de les lier à l'UO Workstations. Ils ne doivent pas pouvoir modifier les GPO créés par d'autres équipes, ni lier des GPO au domaine ou à une autre UO. La solution doit respecter le principe du privilège minimum.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Add DT-Admins to the Group Policy Creator Owners group.", fr: "Ajouter DT-Admins au groupe Group Policy Creator Owners." } }
        - { id: b, text: { en: "In GPMC, grant DT-Admins Link GPOs on the Delegation tab of the domain.", fr: "Dans la GPMC, accorder Link GPOs à DT-Admins dans l'onglet Délégation du domaine." } }
        - { id: c, text: { en: "In GPMC, grant DT-Admins Edit settings on the Delegation tab of every GPO.", fr: "Dans la GPMC, accorder Edit settings à DT-Admins dans l'onglet Délégation de chaque GPO." } }
        - { id: d, text: { en: "In GPMC, grant DT-Admins Link GPOs on the Delegation tab of the Workstations OU.", fr: "Dans la GPMC, accorder Link GPOs à DT-Admins dans l'onglet Délégation de l'UO Workstations." } }
        - { id: e, text: { en: "Add DT-Admins to the Account Operators group of the domain.", fr: "Ajouter DT-Admins au groupe Account Operators du domaine." } }
      choose: 2
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Members of **Group Policy Creator Owners** can create GPOs in the domain, but they get no permission on the GPOs created by others, and creating a GPO doesn't give the right to link it. Linking is a separate permission, **Link GPOs** (read and write on gPLink and gPOptions), granted on the Delegation tab of each site, domain or OU; granting it on the Workstations OU only limits where DT-Admins can link.
        fr: |
          Les membres de **Group Policy Creator Owners** peuvent créer des GPO dans le domaine, mais ils n'obtiennent aucune autorisation sur les GPO créés par d'autres, et créer un GPO ne donne pas le droit de le lier. La liaison est une autorisation distincte, **Link GPOs** (lecture et écriture de gPLink et gPOptions), accordée dans l'onglet Délégation de chaque site, domaine ou UO ; l'accorder sur la seule UO Workstations limite les endroits où DT-Admins peut lier.
      options:
        b: { en: "Link GPOs on the domain lets DT-Admins link GPOs at the domain level, which the requirements forbid.", fr: "Link GPOs sur le domaine permet à DT-Admins de lier des GPO au niveau du domaine, ce que les exigences interdisent." }
        c: { en: "Edit settings on every GPO lets DT-Admins modify the GPOs of the other teams.", fr: "Edit settings sur chaque GPO permet à DT-Admins de modifier les GPO des autres équipes." }
        e: { en: "Account Operators doesn't grant the rights to create or link GPOs, can sign in to domain controllers, and should stay empty.", fr: "Account Operators n'accorde pas les droits de créer ou de lier des GPO, peut ouvrir une session sur les contrôleurs de domaine et doit rester vide." }
    references:
      - title: "Delegation and policy-related permissions: Group Policy"
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2003/cc776858(v=ws.10)

  # ------------------------------------------------------------------ 10
  - id: az802-qz-62-10
    objective: "6.2.9"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Your network contains an AD DS domain named **adatum.com**. The domain functional level is Windows Server 2016, and all the domain controllers run Windows Server 2022. An application on a server named **APP4** runs as a service account named **svc-legacy**. The password of svc-legacy was last changed in 2006, when the domain controllers ran Windows Server 2003. The **This account supports Kerberos AES 128 bit encryption** and **This account supports Kerberos AES 256 bit encryption** options are already selected on svc-legacy.

        You create a GPO that will apply to all the computers, including the domain controllers. You need to meet the following requirements:

        - Kerberos must use only AES128 and AES256. DES and RC4 must be refused.
        - After the GPO applies, the application on APP4 must keep authenticating as svc-legacy by using Kerberos.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Votre réseau contient un domaine AD DS nommé **adatum.com**. Le niveau fonctionnel du domaine est Windows Server 2016, et tous les contrôleurs de domaine exécutent Windows Server 2022. Une application d'un serveur nommé **APP4** s'exécute sous un compte de service nommé **svc-legacy**. Le mot de passe de svc-legacy a été modifié pour la dernière fois en 2006, quand les contrôleurs de domaine exécutaient Windows Server 2003. Les options **This account supports Kerberos AES 128 bit encryption** et **This account supports Kerberos AES 256 bit encryption** sont déjà sélectionnées sur svc-legacy.

        Vous créez un GPO qui s'appliquera à tous les ordinateurs, y compris les contrôleurs de domaine. Vous devez satisfaire aux exigences suivantes :

        - Kerberos ne doit utiliser que AES128 et AES256. DES et RC4 doivent être refusés.
        - Après l'application du GPO, l'application d'APP4 doit continuer à s'authentifier en tant que svc-legacy avec Kerberos.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          In the GPO, set **Network security: Configure encryption types allowed for Kerberos** to: [[enc]]

          For svc-legacy: [[fix]]
        fr: |
          Dans le GPO, définissez **Network security: Configure encryption types allowed for Kerberos** sur : [[enc]]

          Pour svc-legacy : [[fix]]
      slots:
        - id: enc
          options:
            - { id: notdef, text: { en: "Not Defined, to keep the operating system defaults", fr: "Not Defined, pour conserver les valeurs par défaut du système d'exploitation" } }
            - { id: rc4aes, text: "RC4_HMAC_MD5, AES128_HMAC_SHA1 and AES256_HMAC_SHA1" }
            - { id: aes, text: "AES128_HMAC_SHA1 and AES256_HMAC_SHA1" }
            - { id: aes256, text: { en: "AES256_HMAC_SHA1 only", fr: "AES256_HMAC_SHA1 uniquement" } }
        - id: fix
          options:
            - { id: des, text: { en: "Select Use only Kerberos DES encryption types", fr: "Sélectionner Use only Kerberos DES encryption types" } }
            - { id: pu, text: { en: "Add the account to the Protected Users group", fr: "Ajouter le compte au groupe Protected Users" } }
            - { id: gmsa, text: { en: "Replace the account with a group managed service account", fr: "Remplacer le compte par un compte de service administré de groupe" } }
            - { id: reset, text: { en: "Reset the password, then update it in the service on APP4", fr: "Réinitialiser le mot de passe, puis le mettre à jour dans le service d'APP4" } }
    answer:
      values: { enc: aes, fix: reset }
    explanation:
      correct:
        en: |
          In **Configure encryption types allowed for Kerberos**, a type that isn't selected isn't allowed, so selecting only AES128_HMAC_SHA1 and AES256_HMAC_SHA1 refuses DES and RC4. An account has AES keys only if its password was changed on a domain controller that runs Windows Server 2008 or later: the AES options of svc-legacy announce support but create no key. Resetting its password generates the AES keys; the new password must then be entered in the service on APP4.
        fr: |
          Dans **Configure encryption types allowed for Kerberos**, un type non sélectionné n'est pas autorisé : ne sélectionner qu'AES128_HMAC_SHA1 et AES256_HMAC_SHA1 refuse donc DES et RC4. Un compte n'a de clés AES que si son mot de passe a été modifié sur un contrôleur de domaine qui exécute Windows Server 2008 ou une version ultérieure : les options AES de svc-legacy annoncent la prise en charge mais ne créent aucune clé. Réinitialiser son mot de passe génère les clés AES ; le nouveau mot de passe doit ensuite être saisi dans le service d'APP4.
      options:
        notdef: { en: "Not Defined keeps the operating system defaults, which still allow RC4.", fr: "Not Defined conserve les valeurs par défaut du système d'exploitation, qui autorisent encore RC4." }
        rc4aes: { en: "Selecting RC4_HMAC_MD5 keeps RC4 allowed, which the requirements forbid.", fr: "Sélectionner RC4_HMAC_MD5 laisse RC4 autorisé, ce que les exigences interdisent." }
        aes256: { en: "AES128 must remain allowed according to the requirements.", fr: "AES128 doit rester autorisé d'après les exigences." }
        des: { en: "DES must be refused, and DES is removed in recent Windows versions.", fr: "DES doit être refusé, et DES est supprimé dans les versions récentes de Windows." }
        pu: { en: "Service accounts must never be added to Protected Users, and membership creates no AES key.", fr: "Les comptes de service ne doivent jamais être ajoutés à Protected Users, et l'appartenance ne crée aucune clé AES." }
        gmsa: { en: "The application must keep running as svc-legacy, so replacing the account doesn't meet the requirements.", fr: "L'application doit continuer à s'exécuter sous svc-legacy : remplacer le compte ne répond donc pas aux exigences." }
    references:
      - title: "Network security: Configure encryption types allowed for Kerberos"
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/network-security-configure-encryption-types-allowed-for-kerberos
      - title: Guidance about how to configure protected accounts
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/how-to-configure-protected-accounts
