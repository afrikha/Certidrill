chapter: 54-file-systems-encryption
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-54-01
    objective: "5.3.8"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A server named **FS20** runs Windows Server 2025. You plan to add a new data volume to FS20 and to register a folder of this volume as a server endpoint in an Azure File Sync sync group.

        Which file system should you use to format the volume?
      fr: |
        Un serveur nommé **FS20** exécute Windows Server 2025. Vous prévoyez d'ajouter un nouveau volume de données à FS20 et d'inscrire un dossier de ce volume comme point de terminaison de serveur dans un groupe de synchronisation Azure File Sync.

        Quel système de fichiers devez-vous utiliser pour formater le volume ?
    body:
      options:
        - { id: a, text: ReFS }
        - { id: b, text: exFAT }
        - { id: c, text: NTFS }
        - { id: d, text: FAT32 }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Azure File Sync supports only directly attached NTFS volumes for its server endpoints. ReFS, FAT, FAT32 and other file systems aren't supported, even though ReFS offers more resiliency features.
        fr: |
          Azure File Sync ne prend en charge que des volumes NTFS attachés directement pour ses points de terminaison de serveur. ReFS, FAT, FAT32 et les autres systèmes de fichiers ne sont pas pris en charge, même si ReFS offre davantage de fonctionnalités de résilience.
      options:
        a: { en: "ReFS isn't supported for Azure File Sync server endpoints, like several other features that require NTFS.", fr: "ReFS n'est pas pris en charge pour les points de terminaison de serveur Azure File Sync, comme plusieurs autres fonctionnalités qui exigent NTFS." }
        b: { en: "exFAT is a file system for removable media; Azure File Sync supports only NTFS.", fr: "exFAT est un système de fichiers pour les supports amovibles ; Azure File Sync ne prend en charge que NTFS." }
        d: { en: "FAT32 is explicitly listed as unsupported by Azure File Sync.", fr: "FAT32 est explicitement indiqué comme non pris en charge par Azure File Sync." }
    references:
      - title: Plan an Azure File Sync deployment
        url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-planning

  # ------------------------------------------------------------------ 2
  - id: az802-qz-54-02
    objective: "5.3.11"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A server named **SRV21** in the contoso.com domain stops at the BitLocker recovery screen. Its recovery password was backed up to AD DS. A help desk technician who has the required permissions opens Active Directory Users and Computers, right-clicks the domain container, and selects **Find BitLocker Recovery Password**.

        What should the technician type in the search box?
      fr: |
        Un serveur nommé **SRV21** du domaine contoso.com s'arrête sur l'écran de récupération BitLocker. Son mot de passe de récupération a été sauvegardé dans AD DS. Un technicien du support qui dispose des autorisations nécessaires ouvre Utilisateurs et ordinateurs Active Directory, fait un clic droit sur le conteneur du domaine et sélectionne **Rechercher le mot de passe de récupération BitLocker**.

        Que doit saisir le technicien dans la zone de recherche ?
    body:
      options:
        - { id: a, text: { en: "The NetBIOS name of SRV21, as it appears on its computer object", fr: "Le nom NetBIOS de SRV21, tel qu'il figure sur son objet ordinateur" } }
        - { id: b, text: { en: "The first eight characters of the password ID shown on the recovery screen", fr: "Les huit premiers caractères de l'ID du mot de passe affiché sur l'écran de récupération" } }
        - { id: c, text: { en: "The first six digits of the 48-digit recovery password of SRV21", fr: "Les six premiers chiffres du mot de passe de récupération à 48 chiffres de SRV21" } }
        - { id: d, text: { en: "The ID of the TPM key protector, as returned by manage-bde -protectors -get", fr: "L'ID du protecteur de clé TPM, tel que le renvoie manage-bde -protectors -get" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The recovery screen displays the password ID of the recovery password. The **Find BitLocker Recovery Password** dialog box, added by the BitLocker Recovery Password Viewer, has a **Password ID (first 8 characters)** box, and the search covers all the domains of the forest. The matching recovery password is then displayed.
        fr: |
          L'écran de récupération affiche l'ID du mot de passe de récupération. La boîte de dialogue **Rechercher le mot de passe de récupération BitLocker**, ajoutée par la visionneuse de mots de passe de récupération BitLocker, contient une zone pour les huit premiers caractères de l'ID du mot de passe, et la recherche couvre tous les domaines de la forêt. Le mot de passe de récupération correspondant s'affiche alors.
      options:
        a: { en: "The search dialog box takes a password ID, not a computer name; the computer name is used to open the BitLocker Recovery tab of the object instead.", fr: "La boîte de dialogue de recherche attend un ID de mot de passe, pas un nom d'ordinateur ; le nom de l'ordinateur sert plutôt à ouvrir l'onglet Récupération BitLocker de l'objet." }
        c: { en: "The technician is looking for the recovery password and doesn't know it yet; the search uses its password ID.", fr: "Le technicien cherche le mot de passe de récupération et ne le connaît pas encore ; la recherche utilise son ID de mot de passe." }
        d: { en: "The TPM protector isn't the recovery password protector, and the server can't run manage-bde while it waits at the recovery screen.", fr: "Le protecteur TPM n'est pas le protecteur de mot de passe de récupération, et le serveur ne peut pas exécuter manage-bde pendant qu'il attend sur l'écran de récupération." }
    references:
      - title: BitLocker recovery process
        url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/recovery-process

  # ------------------------------------------------------------------ 3
  - id: az802-qz-54-03
    objective: "5.3.5"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        A file server named **FS22** runs Windows Server 2025. Volume E: on FS22 holds the team shares of the engineering department, and a line-of-business application keeps several project files permanently open there. You install Data Deduplication on FS22 and enable it on E: with the **Default** usage type. You keep the default policy and job schedules.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un serveur de fichiers nommé **FS22** exécute Windows Server 2025. Le volume E: de FS22 contient les partages d'équipe du service d'ingénierie, et une application métier y garde plusieurs fichiers de projet ouverts en permanence. Vous installez la déduplication des données sur FS22 et l'activez sur E: avec le type d'utilisation **Default**. Vous conservez la stratégie et les planifications de travaux par défaut.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Data written to E: is split into chunks and deduplicated before it's stored on disk.", fr: "Les données écrites sur E: sont découpées en blocs et dédupliquées avant d'être stockées sur le disque." }
        - id: s2
          text: { en: "A two-week-old file that an application keeps open on E: isn't optimized.", fr: "Un fichier vieux de deux semaines qu'une application garde ouvert sur E: n'est pas optimisé." }
        - id: s3
          text: { en: "The chunks of the optimized files are stored in the System Volume Information folder of E:.", fr: "Les blocs des fichiers optimisés sont stockés dans le dossier System Volume Information de E:." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Data Deduplication is a post-processing feature: data is first written unoptimized, then scheduled optimization jobs chunk it. The Default usage type optimizes files older than three days but never files that are in use or partial files; the Hyper-V and Backup usage types do optimize in-use files. Unique chunks go to the chunk store, a set of container files in the System Volume Information folder of the volume, and each optimized file becomes a reparse point.
        fr: |
          La déduplication des données fonctionne en post-traitement : les données sont d'abord écrites sans optimisation, puis des travaux d'optimisation planifiés les découpent en blocs. Le type d'utilisation Default optimise les fichiers de plus de trois jours, mais jamais les fichiers en cours d'utilisation ni les fichiers partiels ; les types Hyper-V et Backup optimisent, eux, les fichiers en cours d'utilisation. Les blocs uniques vont dans le magasin de blocs, un ensemble de fichiers conteneurs dans le dossier System Volume Information du volume, et chaque fichier optimisé devient un point d'analyse.
      options:
        s1: { en: "Deduplication doesn't work inline: an Optimization job processes the data after it's written, once every hour by default.", fr: "La déduplication ne fonctionne pas à la volée : un travail Optimization traite les données après leur écriture, toutes les heures par défaut." }
    references:
      - title: Understanding Data Deduplication
        url: https://learn.microsoft.com/en-us/windows-server/storage/data-deduplication/understand

  # ------------------------------------------------------------------ 4
  - id: az802-qz-54-04
    objective: "5.3.9"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        A server named **ISCSI5** runs Windows Server 2025 and the iSCSI Target Server role service. You need to provide a 2-TB block device to a test server that uses the IPv4 address 10.0.30.15 on the iSCSI network. The solution must meet the following requirements:

        - All the space of the iSCSI virtual disk is allocated when the disk is created.
        - Only the test server can connect to the new target named **LabDisks**, and it's identified by its IPv4 address.

        How should you complete the commands on ISCSI5? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un serveur nommé **ISCSI5** exécute Windows Server 2025 et le service de rôle Serveur cible iSCSI. Vous devez fournir un périphérique en mode bloc de 2 To à un serveur de test qui utilise l'adresse IPv4 10.0.30.15 sur le réseau iSCSI. La solution doit répondre aux exigences suivantes :

        - Tout l'espace du disque virtuel iSCSI est alloué à la création du disque.
        - Seul le serveur de test peut se connecter à la nouvelle cible nommée **LabDisks**, et il est identifié par son adresse IPv4.

        Comment devez-vous compléter les commandes sur ISCSI5 ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: powershell
      template: |
        New-IscsiVirtualDisk -Path E:\iSCSI\Lab1.vhdx -SizeBytes 2TB [[fixed]]
        New-IscsiServerTarget -TargetName LabDisks -InitiatorIds "[[idtype]]:10.0.30.15"
        [[map]] -TargetName LabDisks -Path E:\iSCSI\Lab1.vhdx
      slots:
        - id: fixed
          options:
            - { id: blocksize, text: "-BlockSizeBytes 32MB" }
            - { id: usefixed, text: "-UseFixed" }
            - { id: parent, text: "-ParentPath E:\\iSCSI\\Base.vhdx" }
        - id: idtype
          options:
            - { id: iqn, text: IQN }
            - { id: dns, text: DNSName }
            - { id: ip, text: IPAddress }
            - { id: mac, text: MACAddress }
        - id: map
          options:
            - { id: addmap, text: Add-IscsiVirtualDiskTargetMapping }
            - { id: setsrv, text: Set-IscsiServerTarget }
            - { id: connect, text: Connect-IscsiTarget }
            - { id: portal, text: New-IscsiTargetPortal }
    answer:
      values: { fixed: usefixed, idtype: ip, map: addmap }
    explanation:
      correct:
        en: |
          `New-IscsiVirtualDisk` creates a dynamic VHDX by default; `-UseFixed` creates a fixed VHDX whose space is allocated at creation. Initiator IDs use the `IdType:Value` format, and `IPAddress` identifies an initiator by its IPv4 address. `Add-IscsiVirtualDiskTargetMapping` then assigns the virtual disk to the target, so the allowed initiator sees it as a LUN.
        fr: |
          `New-IscsiVirtualDisk` crée par défaut un VHDX dynamique ; `-UseFixed` crée un VHDX fixe dont l'espace est alloué à la création. Les ID d'initiateur utilisent le format `IdType:Value`, et `IPAddress` identifie un initiateur par son adresse IPv4. `Add-IscsiVirtualDiskTargetMapping` attribue ensuite le disque virtuel à la cible : l'initiateur autorisé le voit alors comme un LUN.
      options:
        blocksize: { en: "The block size doesn't change the disk type; without -UseFixed, the VHDX stays dynamic.", fr: "La taille de bloc ne change pas le type du disque ; sans -UseFixed, le VHDX reste dynamique." }
        parent: { en: "-ParentPath creates a differencing VHDX, which grows on demand like a dynamic disk.", fr: "-ParentPath crée un VHDX de différenciation, qui grandit à la demande comme un disque dynamique." }
        iqn: { en: "IQN identifies the initiator by its iSCSI qualified name, not by its IPv4 address.", fr: "IQN identifie l'initiateur par son nom qualifié iSCSI, pas par son adresse IPv4." }
        connect: { en: "Connect-IscsiTarget runs on the initiator to open a session; it doesn't assign a virtual disk to a target.", fr: "Connect-IscsiTarget s'exécute sur l'initiateur pour ouvrir une session ; il n'attribue pas un disque virtuel à une cible." }
        portal: { en: "New-IscsiTargetPortal is also an initiator-side cmdlet that registers the address of a target server.", fr: "New-IscsiTargetPortal est aussi une applet de commande côté initiateur, qui enregistre l'adresse d'un serveur cible." }
    references:
      - title: New-IscsiVirtualDisk (IscsiTarget)
        url: https://learn.microsoft.com/en-us/powershell/module/iscsitarget/new-iscsivirtualdisk
      - title: New-IscsiServerTarget (IscsiTarget)
        url: https://learn.microsoft.com/en-us/powershell/module/iscsitarget/new-iscsiservertarget

  # ------------------------------------------------------------------ 5
  - id: az802-qz-54-05
    objective: "5.3.10"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A physical server named **SRV22** runs Windows Server 2025. Its operating system volume C: is protected by BitLocker with a TPM protector and a recovery password protector. Tonight, you will install a UEFI firmware update on SRV22, and the update restarts the server once.

        You need to prevent SRV22 from starting on the BitLocker recovery screen after the update. BitLocker protection must resume automatically after the restart, and C: must not be decrypted.

        Which command should you run before you install the update?
      fr: |
        Un serveur physique nommé **SRV22** exécute Windows Server 2025. Son volume du système d'exploitation C: est protégé par BitLocker avec un protecteur TPM et un protecteur de mot de passe de récupération. Ce soir, vous installerez une mise à jour du microprogramme UEFI sur SRV22, et la mise à jour redémarre le serveur une fois.

        Vous devez éviter que SRV22 démarre sur l'écran de récupération BitLocker après la mise à jour. La protection BitLocker doit reprendre automatiquement après le redémarrage, et C: ne doit pas être déchiffré.

        Quelle commande devez-vous exécuter avant d'installer la mise à jour ?
    body:
      options:
        - { id: a, text: "Disable-BitLocker -MountPoint C:" }
        - { id: b, text: "Suspend-BitLocker -MountPoint C: -RebootCount 0" }
        - { id: c, text: "Add-BitLockerKeyProtector -MountPoint C: -RecoveryKeyPath F:\\ -RecoveryKeyProtector" }
        - { id: d, text: "Suspend-BitLocker -MountPoint C: -RebootCount 1" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          While BitLocker is suspended, it doesn't validate system integrity at startup, so a changed firmware measurement doesn't trigger recovery. Suspension doesn't decrypt the volume: the key is made available in the clear and new data is still encrypted. `-RebootCount 1` (also the default) resumes protection automatically after the next restart.
        fr: |
          Tant que BitLocker est suspendu, il ne valide pas l'intégrité du système au démarrage : une mesure du microprogramme modifiée ne déclenche donc pas la récupération. La suspension ne déchiffre pas le volume : la clé est rendue disponible en clair et les nouvelles données restent chiffrées. `-RebootCount 1` (aussi la valeur par défaut) rétablit automatiquement la protection après le redémarrage suivant.
      options:
        a: { en: "Disable-BitLocker decrypts the volume, which the requirements forbid.", fr: "Disable-BitLocker déchiffre le volume, ce que les exigences interdisent." }
        b: { en: "A reboot count of 0 suspends protection indefinitely, until someone runs Resume-BitLocker; it doesn't resume automatically.", fr: "Un nombre de redémarrages de 0 suspend la protection indéfiniment, jusqu'à l'exécution de Resume-BitLocker ; elle ne reprend pas automatiquement." }
        c: { en: "A recovery key only helps an administrator unlock the volume once it's in recovery; it doesn't prevent the recovery screen.", fr: "Une clé de récupération aide seulement un administrateur à déverrouiller le volume une fois en récupération ; elle n'évite pas l'écran de récupération." }
    references:
      - title: Suspend-BitLocker (BitLocker)
        url: https://learn.microsoft.com/en-us/powershell/module/bitlocker/suspend-bitlocker
      - title: BitLocker recovery overview
        url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/recovery-overview

  # ------------------------------------------------------------------ 6
  - id: az802-qz-54-06
    objective: "5.3.8"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam is preparing a 30-TB volume named **V:** on a SAN LUN for a server named **FS40** that runs Windows Server 2025 Datacenter. The storage team proposes to format V: with ReFS. The volume owner lists the following requirements:

        - Users can encrypt individual files by using the Encrypting File System (EFS).
        - Data Deduplication runs on the volume.
        - Copies between V: and other LUNs of the same array are offloaded to the array by using ODX.
        - The volume is protected by BitLocker Drive Encryption.
        - The volume can be shrunk next year to free space for a new volume.
        - Checksums detect corruption of the file system metadata.

        Which two requirements prevent you from formatting V: with ReFS?

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam prépare un volume de 30 To nommé **V:** sur un LUN de SAN pour un serveur nommé **FS40** qui exécute Windows Server 2025 Datacenter. L'équipe stockage propose de formater V: en ReFS. Le propriétaire du volume liste les exigences suivantes :

        - Les utilisateurs peuvent chiffrer des fichiers individuels avec le système de fichiers EFS (Encrypting File System).
        - La déduplication des données s'exécute sur le volume.
        - Les copies entre V: et d'autres LUN de la même baie sont déchargées vers la baie grâce à ODX.
        - Le volume est protégé par le chiffrement de lecteur BitLocker.
        - Le volume pourra être réduit l'an prochain pour libérer de l'espace pour un nouveau volume.
        - Des sommes de contrôle détectent la corruption des métadonnées du système de fichiers.

        Quelles sont les deux exigences qui vous empêchent de formater V: en ReFS ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Encryption of individual files with EFS", fr: "Chiffrement de fichiers individuels avec EFS" } }
        - { id: b, text: { en: "Data Deduplication on the volume", fr: "Déduplication des données sur le volume" } }
        - { id: c, text: { en: "Copies offloaded to the array with ODX", fr: "Copies déchargées vers la baie avec ODX" } }
        - { id: d, text: { en: "BitLocker Drive Encryption of the volume", fr: "Chiffrement de lecteur BitLocker du volume" } }
        - { id: e, text: { en: "Shrinking the volume next year", fr: "Réduction du volume l'an prochain" } }
        - { id: f, text: { en: "Checksums on the file system metadata", fr: "Sommes de contrôle sur les métadonnées du système de fichiers" } }
    answer: { optionIds: [c, e] }
    explanation:
      correct:
        en: |
          ReFS doesn't support Offloaded Data Transfer (ODX) and can't be shrunk, so these two requirements force NTFS. The other requirements are all met by ReFS on Windows Server 2025: file system encryption is available on ReFS in Windows Server 2025 only, Data Deduplication supports ReFS since Windows Server 2019, BitLocker works on both file systems, and integrity streams use checksums for metadata.
        fr: |
          ReFS ne prend pas en charge le transfert de données déchargé (ODX) et ne peut pas être réduit : ces deux exigences imposent donc NTFS. Les autres exigences sont toutes satisfaites par ReFS sous Windows Server 2025 : le chiffrement du système de fichiers est disponible sur ReFS sous Windows Server 2025 uniquement, la déduplication des données prend en charge ReFS depuis Windows Server 2019, BitLocker fonctionne sur les deux systèmes de fichiers, et les flux d'intégrité utilisent des sommes de contrôle pour les métadonnées.
      options:
        a: { en: "File system encryption on ReFS is a Windows Server 2025 feature, and FS40 runs Windows Server 2025.", fr: "Le chiffrement du système de fichiers sur ReFS est une fonctionnalité de Windows Server 2025, et FS40 exécute Windows Server 2025." }
        b: { en: "Data Deduplication supports ReFS volumes since Windows Server 2019.", fr: "La déduplication des données prend en charge les volumes ReFS depuis Windows Server 2019." }
        d: { en: "BitLocker encryption is supported on both NTFS and ReFS.", fr: "Le chiffrement BitLocker est pris en charge à la fois sur NTFS et sur ReFS." }
        f: { en: "Metadata checksums are a ReFS feature (integrity streams), so this requirement favors ReFS.", fr: "Les sommes de contrôle des métadonnées sont une fonctionnalité de ReFS (flux d'intégrité) : cette exigence favorise donc ReFS." }
    references:
      - title: Resilient File System (ReFS) overview
        url: https://learn.microsoft.com/en-us/windows-server/storage/refs/refs-overview

  # ------------------------------------------------------------------ 7
  - id: az802-qz-54-07
    objective: "5.3.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A file server named **FS23** runs Windows Server 2025. Data Deduplication has been enabled on volume E: for two years, with the Default usage type. Next month, the content of E: will be replicated by a third-party tool that can't read deduplicated files.

        You need to ensure that every file on E: is stored again in its full, non-optimized form, and that no deduplication job runs on E: afterward. E: has enough free space for the full logical size of the data. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Un serveur de fichiers nommé **FS23** exécute Windows Server 2025. La déduplication des données est activée depuis deux ans sur le volume E:, avec le type d'utilisation Default. Le mois prochain, le contenu de E: sera répliqué par un outil tiers qui ne sait pas lire les fichiers dédupliqués.

        Vous devez faire en sorte que chaque fichier de E: soit de nouveau stocké sous sa forme complète, non optimisée, et qu'aucun travail de déduplication ne s'exécute ensuite sur E:. E: dispose d'assez d'espace libre pour la taille logique complète des données. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run Disable-DedupVolume -Volume E:.", fr: "Exécuter Disable-DedupVolume -Volume E:." } }
        - { id: b, text: { en: "Run Disable-DedupVolume -Volume E:, and then run Start-DedupJob -Volume E: -Type Unoptimization.", fr: "Exécuter Disable-DedupVolume -Volume E:, puis exécuter Start-DedupJob -Volume E: -Type Unoptimization." } }
        - { id: c, text: { en: "Run Start-DedupJob -Volume E: -Type Unoptimization.", fr: "Exécuter Start-DedupJob -Volume E: -Type Unoptimization." } }
        - { id: d, text: { en: "Run Start-DedupJob -Volume E: -Type GarbageCollection -Full, and then run Disable-DedupVolume -Volume E:.", fr: "Exécuter Start-DedupJob -Volume E: -Type GarbageCollection -Full, puis exécuter Disable-DedupVolume -Volume E:." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The Unoptimization job undoes the optimization of the files and then disables Data Deduplication on the volume, so one manual job meets both requirements. It's an on-demand job that never runs on a schedule, and it needs free space for the expanded data, which E: has.
        fr: |
          Le travail Unoptimization annule l'optimisation des fichiers puis désactive la déduplication des données sur le volume : un seul travail manuel répond donc aux deux exigences. C'est un travail à la demande qui ne s'exécute jamais selon une planification, et il a besoin d'espace libre pour les données décompressées, dont E: dispose.
      options:
        a: { en: "After Disable-DedupVolume, the volume stays in a deduplicated state: existing files remain optimized, and only new data isn't deduplicated.", fr: "Après Disable-DedupVolume, le volume reste dans un état dédupliqué : les fichiers existants restent optimisés, et seules les nouvelles données ne sont pas dédupliquées." }
        b: { en: "Once deduplication is disabled on a volume, the job cmdlets such as Start-DedupJob can no longer run on it, so the Unoptimization job can't start.", fr: "Une fois la déduplication désactivée sur un volume, les applets de commande de travaux comme Start-DedupJob ne peuvent plus s'y exécuter : le travail Unoptimization ne peut donc pas démarrer." }
        d: { en: "Garbage Collection only removes chunks that no file references anymore; the files stay optimized after deduplication is disabled.", fr: "Le Garbage Collection supprime seulement les blocs qu'aucun fichier ne référence plus ; les fichiers restent optimisés après la désactivation de la déduplication." }
    references:
      - title: Disable-DedupVolume (Deduplication)
        url: https://learn.microsoft.com/en-us/powershell/module/deduplication/disable-dedupvolume
      - title: Understanding Data Deduplication
        url: https://learn.microsoft.com/en-us/windows-server/storage/data-deduplication/understand

  # ------------------------------------------------------------------ 8
  - id: az802-qz-54-08
    objective: "5.3.9"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A server named **ISCSI7** runs iSCSI Target Server on Windows Server 2025 and listens on two iSCSI networks, at 10.0.10.5 and 10.0.11.5. A target on ISCSI7 lists the IQN of a server named **APP2** as its only initiator ID.

        APP2 runs Windows Server 2025 and has two network adapters dedicated to iSCSI, at 10.0.10.21 and 10.0.11.21. The Microsoft iSCSI Initiator service on APP2 starts automatically, and no iSCSI session exists yet.

        You need APP2 to keep access to the LUN of the target if either network adapter or either iSCSI network fails.

        Which three actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un serveur nommé **ISCSI7** exécute le serveur cible iSCSI sous Windows Server 2025 et écoute sur deux réseaux iSCSI, à 10.0.10.5 et 10.0.11.5. Une cible sur ISCSI7 liste l'IQN d'un serveur nommé **APP2** comme seul ID d'initiateur.

        APP2 exécute Windows Server 2025 et possède deux cartes réseau dédiées à iSCSI, à 10.0.10.21 et 10.0.11.21. Le service Initiateur iSCSI de Microsoft démarre automatiquement sur APP2, et aucune session iSCSI n'existe encore.

        Vous devez faire en sorte qu'APP2 conserve l'accès au LUN de la cible si l'une des cartes réseau ou l'un des réseaux iSCSI tombe en panne.

        Quelles sont les trois actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "On APP2, install the Multipath I/O feature.", fr: "Sur APP2, installer la fonctionnalité Multipath I/O." } }
        - { id: b, text: { en: "On APP2, run Enable-MSDSMAutomaticClaim -BusType SAS.", fr: "Sur APP2, exécuter Enable-MSDSMAutomaticClaim -BusType SAS." } }
        - { id: c, text: { en: "On APP2, run Enable-MSDSMAutomaticClaim -BusType iSCSI.", fr: "Sur APP2, exécuter Enable-MSDSMAutomaticClaim -BusType iSCSI." } }
        - { id: d, text: { en: "On ISCSI7, add both IPv4 addresses of APP2 to the initiator IDs of the target.", fr: "Sur ISCSI7, ajouter les deux adresses IPv4 d'APP2 aux ID d'initiateur de la cible." } }
        - { id: e, text: { en: "On APP2, connect once per path with Connect-IscsiTarget -IsMultipathEnabled $true, each time with a matching pair of initiator and target portal addresses.", fr: "Sur APP2, se connecter une fois par chemin avec Connect-IscsiTarget -IsMultipathEnabled $true, chaque fois avec une paire d'adresses de portail initiateur et cible correspondante." } }
        - { id: f, text: { en: "On APP2, connect once through the 10.0.10.5 portal with Connect-IscsiTarget -IsPersistent $true, and let the session move to the other network on failure.", fr: "Sur APP2, se connecter une fois par le portail 10.0.10.5 avec Connect-IscsiTarget -IsPersistent $true, et laisser la session passer sur l'autre réseau en cas de panne." } }
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: |
          Redundant iSCSI paths need Multipath I/O on the initiator, and the Microsoft DSM must claim iSCSI disks, which `Enable-MSDSMAutomaticClaim -BusType iSCSI` does. Then APP2 opens one session per path with `-IsMultipathEnabled $true`, pairing 10.0.10.21 with 10.0.10.5 and 10.0.11.21 with 10.0.11.5 through `-InitiatorPortalAddress` and `-TargetPortalAddress`. MPIO then sees one disk with two paths and keeps it available if a path fails.
        fr: |
          Des chemins iSCSI redondants exigent Multipath I/O sur l'initiateur, et le DSM Microsoft doit revendiquer les disques iSCSI, ce que fait `Enable-MSDSMAutomaticClaim -BusType iSCSI`. APP2 ouvre ensuite une session par chemin avec `-IsMultipathEnabled $true`, en associant 10.0.10.21 à 10.0.10.5 et 10.0.11.21 à 10.0.11.5 grâce à `-InitiatorPortalAddress` et `-TargetPortalAddress`. MPIO voit alors un seul disque avec deux chemins et le garde disponible si un chemin tombe en panne.
      options:
        b: { en: "The SAS bus type claims serial attached SCSI disks, not the disks that iSCSI presents.", fr: "Le type de bus SAS revendique les disques SAS (serial attached SCSI), pas les disques que présente iSCSI." }
        d: { en: "The target already allows APP2 by its IQN, which is the same on both paths; IP-based initiator IDs aren't needed.", fr: "La cible autorise déjà APP2 par son IQN, qui est le même sur les deux chemins ; des ID d'initiateur basés sur l'adresse IP ne sont pas nécessaires." }
        f: { en: "A persistent session only reconnects after a restart; a single session through one portal has no second path to fail over to.", fr: "Une session persistante se reconnecte seulement après un redémarrage ; une session unique par un seul portail n'a pas de second chemin vers lequel basculer." }
    references:
      - title: Connect-IscsiTarget (iSCSI)
        url: https://learn.microsoft.com/en-us/powershell/module/iscsi/connect-iscsitarget
      - title: Enable-MSDSMAutomaticClaim (MPIO)
        url: https://learn.microsoft.com/en-us/powershell/module/mpio/enable-msdsmautomaticclaim

  # ------------------------------------------------------------------ 9
  - id: az802-qz-54-09
    objective: "5.3.10"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        A domain-joined server named **SRV30** runs Windows Server 2025 and has a TPM 2.0. The BitLocker feature is installed. The volumes of SRV30 are configured as follows:

        | Volume | Content | BitLocker configuration |
        | --- | --- | --- |
        | C: | Operating system | TPM protector and recovery password protector |
        | D: | Application data | Password protector and recovery password protector, automatic unlocking enabled |
        | E: | Data volume that previously stored confidential files, which were deleted | Not encrypted yet |

        You plan to encrypt E: by running `Enable-BitLocker -MountPoint E: -UsedSpaceOnly -RecoveryPasswordProtector`.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un serveur joint au domaine nommé **SRV30** exécute Windows Server 2025 et possède un TPM 2.0. La fonctionnalité BitLocker est installée. Les volumes de SRV30 sont configurés comme suit :

        | Volume | Contenu | Configuration BitLocker |
        | --- | --- | --- |
        | C: | Système d'exploitation | Protecteur TPM et protecteur de mot de passe de récupération |
        | D: | Données d'application | Protecteur de mot de passe et protecteur de mot de passe de récupération, déverrouillage automatique activé |
        | E: | Volume de données qui stockait auparavant des fichiers confidentiels, supprimés depuis | Pas encore chiffré |

        Vous prévoyez de chiffrer E: en exécutant `Enable-BitLocker -MountPoint E: -UsedSpaceOnly -RecoveryPasswordProtector`.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "If you replace the TPM protector of C: with an AD DS account protector for SRV30$, C: unlocks at startup while SRV30 is connected to the domain network.", fr: "Si vous remplacez le protecteur TPM de C: par un protecteur de compte AD DS pour SRV30$, C: se déverrouille au démarrage tant que SRV30 est connecté au réseau du domaine." }
        - id: s2
          text: { en: "After SRV30 restarts and C: is unlocked, D: is unlocked without anyone typing its password.", fr: "Après le redémarrage de SRV30 et le déverrouillage de C:, D: est déverrouillé sans que personne ne saisisse son mot de passe." }
        - id: s3
          text: { en: "After the planned command completes, the remnants of the deleted confidential files in the free space of E: are encrypted.", fr: "Une fois la commande prévue terminée, les restes des fichiers confidentiels supprimés dans l'espace libre de E: sont chiffrés." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          An AD DS account protector uses domain authentication to unlock data volumes; operating system volumes can't use it, so C: still needs a TPM-based protector. Automatic unlocking stores encrypted information in the registry and in the volume metadata so that, once the operating system volume is unlocked, data volumes such as D: unlock without input. `-UsedSpaceOnly` doesn't encrypt unallocated space, so data left behind by deleted files stays readable; encrypt the full volume to cover it.
        fr: |
          Un protecteur de compte AD DS utilise l'authentification du domaine pour déverrouiller des volumes de données ; les volumes du système d'exploitation ne peuvent pas l'utiliser, et C: a donc toujours besoin d'un protecteur basé sur le TPM. Le déverrouillage automatique stocke des informations chiffrées dans le registre et dans les métadonnées du volume : une fois le volume du système d'exploitation déverrouillé, les volumes de données comme D: se déverrouillent sans intervention. `-UsedSpaceOnly` ne chiffre pas l'espace non alloué : les données laissées par les fichiers supprimés restent lisibles ; chiffrez tout le volume pour les couvrir.
      options:
        s1: { en: "Unlocking an operating system volume at startup on the corporate network without a PIN is the role of Network Unlock, not of an AD DS account protector.", fr: "Déverrouiller un volume du système d'exploitation au démarrage sur le réseau de l'entreprise sans code PIN est le rôle du déverrouillage réseau, pas d'un protecteur de compte AD DS." }
        s3: { en: "Without -UsedSpaceOnly, Enable-BitLocker encrypts the entire drive, free space included.", fr: "Sans -UsedSpaceOnly, Enable-BitLocker chiffre tout le lecteur, espace libre compris." }
    references:
      - title: Add-BitLockerKeyProtector (BitLocker)
        url: https://learn.microsoft.com/en-us/powershell/module/bitlocker/add-bitlockerkeyprotector
      - title: Enable-BitLocker (BitLocker)
        url: https://learn.microsoft.com/en-us/powershell/module/bitlocker/enable-bitlocker

  # ------------------------------------------------------------------ 10
  - id: az802-qz-54-10
    objective: "5.3.11"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Your network contains an AD DS domain named adatum.com. Before the servers were encrypted, a GPO configured a BitLocker data recovery agent (DRA) certificate for all the servers. The private key of the DRA certificate is in the certificate store of a server named **ADM1**, which runs Windows Server 2025.

        A server named **SRV40** has an operating system volume protected by TPM + PIN and by a recovery password. The motherboard of SRV40 failed and won't be repaired. The recovery password of SRV40 was never backed up to AD DS or Microsoft Entra ID, its printout is lost, and no key package was saved. Administrators know the PIN.

        You need to copy the data from the operating system volume of SRV40.

        What should you do?
      fr: |
        Votre réseau contient un domaine AD DS nommé adatum.com. Avant le chiffrement des serveurs, un GPO a configuré un certificat d'agent de récupération de données (DRA) BitLocker pour tous les serveurs. La clé privée du certificat DRA se trouve dans le magasin de certificats d'un serveur nommé **ADM1**, qui exécute Windows Server 2025.

        Un serveur nommé **SRV40** a un volume du système d'exploitation protégé par TPM + code PIN et par un mot de passe de récupération. La carte mère de SRV40 est tombée en panne et ne sera pas réparée. Le mot de passe de récupération de SRV40 n'a jamais été sauvegardé dans AD DS ni dans Microsoft Entra ID, son impression est perdue, et aucun package de clés n'a été enregistré. Les administrateurs connaissent le code PIN.

        Vous devez copier les données du volume du système d'exploitation de SRV40.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Install the disk in a replacement server that has a TPM, and type the known PIN at startup.", fr: "Installer le disque dans un serveur de remplacement doté d'un TPM, et saisir le code PIN connu au démarrage." } }
        - { id: b, text: { en: "Attach the disk to ADM1 as a data drive, and unlock it by running manage-bde -unlock with -Certificate and the DRA thumbprint.", fr: "Attacher le disque à ADM1 comme lecteur de données, et le déverrouiller en exécutant manage-bde -unlock avec -Certificate et l'empreinte du DRA." } }
        - { id: c, text: { en: "Install the disk in a replacement server, import the DRA certificate on it, and unlock the volume from the BitLocker recovery screen.", fr: "Installer le disque dans un serveur de remplacement, y importer le certificat DRA, et déverrouiller le volume depuis l'écran de récupération BitLocker." } }
        - { id: d, text: { en: "Attach the disk to ADM1, and run repair-bde with the -kp parameter to write the decrypted data to an empty volume.", fr: "Attacher le disque à ADM1, et exécuter repair-bde avec le paramètre -kp pour écrire les données déchiffrées sur un volume vide." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A DRA certificate was added as a protector when the drives were encrypted, so it can unlock them without the recovery password. For an operating system drive, the DRA works only when the drive is mounted as a data drive on another device that has the private key of the certificate. On ADM1, `manage-bde -unlock <drive> -Certificate -ct <thumbprint>` unlocks the volume, and the data can then be copied.
        fr: |
          Un certificat DRA a été ajouté comme protecteur lors du chiffrement des lecteurs : il peut donc les déverrouiller sans le mot de passe de récupération. Pour un lecteur du système d'exploitation, le DRA ne fonctionne que si le lecteur est monté comme lecteur de données sur un autre appareil qui détient la clé privée du certificat. Sur ADM1, `manage-bde -unlock <lecteur> -Certificate -ct <empreinte>` déverrouille le volume, et les données peuvent ensuite être copiées.
      options:
        a: { en: "The TPM + PIN protector is sealed to the TPM of the failed motherboard; a new TPM can't release the key, so the volume goes to recovery.", fr: "Le protecteur TPM + code PIN est scellé dans le TPM de la carte mère en panne ; un nouveau TPM ne peut pas libérer la clé : le volume passe donc en récupération." }
        c: { en: "The recovery screen accepts a recovery password or key, not a DRA certificate; an OS drive must be mounted as a data drive for the DRA to unlock it.", fr: "L'écran de récupération accepte un mot de passe ou une clé de récupération, pas un certificat DRA ; un lecteur du système d'exploitation doit être monté comme lecteur de données pour que le DRA le déverrouille." }
        d: { en: "repair-bde is for damaged volumes and needs a key package with the recovery password or key; no key package exists here, and the volume isn't damaged.", fr: "repair-bde sert aux volumes endommagés et exige un package de clés avec le mot de passe ou la clé de récupération ; aucun package de clés n'existe ici, et le volume n'est pas endommagé." }
    references:
      - title: BitLocker recovery overview
        url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/recovery-overview
      - title: BitLocker recovery process
        url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/recovery-process
