chapter: 31-hyper-v-guests
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-31-01
    objective: "3.1.8"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a Hyper-V host named **HV1** that runs Windows Server 2025. A virtual machine named **VM1** that runs Windows Server 2022 was created on HV1 and uses the default checkpoint type.

        Before an update, you create a checkpoint of VM1 while two applications are open in VM1. After the update, you apply the checkpoint.

        In which state is VM1 just after you apply the checkpoint?
      fr: |
        Vous disposez d'un hôte Hyper-V nommé **HV1** qui exécute Windows Server 2025. Une machine virtuelle nommée **VM1** qui exécute Windows Server 2022 a été créée sur HV1 et utilise le type de point de contrôle par défaut.

        Avant une mise à jour, vous créez un point de contrôle de VM1 alors que deux applications sont ouvertes dans VM1. Après la mise à jour, vous appliquez le point de contrôle.

        Dans quel état se trouve VM1 juste après l'application du point de contrôle ?
    body:
      options:
        - { id: a, text: { en: "Running, with the two applications open as when the checkpoint was created", fr: "En cours d'exécution, avec les deux applications ouvertes comme lors de la création du point de contrôle" } }
        - { id: b, text: { en: "Saved, and VM1 resumes from its memory state when you start it", fr: "Enregistré : VM1 reprend depuis son état mémoire quand vous la démarrez" } }
        - { id: c, text: { en: "Off, and you must start VM1 before you can use it", fr: "Arrêté : vous devez démarrer VM1 avant de pouvoir l'utiliser" } }
        - { id: d, text: { en: "Paused, and VM1 continues when you select Resume", fr: "En pause : VM1 continue quand vous sélectionnez Reprendre" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          New virtual machines use production checkpoints by default. A production checkpoint uses the Volume Shadow Copy Service in the Windows guest to create a data-consistent copy, like a backup, and doesn't capture the memory state. After you apply it, the virtual machine is off: you start it, and the files are restored but the applications aren't open.
        fr: |
          Les nouvelles machines virtuelles utilisent par défaut des points de contrôle de production. Un point de contrôle de production utilise le service VSS (cliché instantané de volume) dans l'invité Windows pour créer une copie cohérente des données, comme une sauvegarde, et ne capture pas l'état de la mémoire. Après son application, la machine virtuelle est arrêtée : vous la démarrez, et les fichiers sont restaurés mais les applications ne sont pas ouvertes.
      options:
        a: { en: "Only a standard checkpoint captures the memory state and brings back the open applications; the default type is production.", fr: "Seul un point de contrôle standard capture l'état de la mémoire et restaure les applications ouvertes ; le type par défaut est production." }
        b: { en: "A saved state is what a standard checkpoint stores; a production checkpoint contains no memory state to resume from.", fr: "Un état enregistré est ce que stocke un point de contrôle standard ; un point de contrôle de production ne contient aucun état mémoire depuis lequel reprendre." }
        d: { en: "Applying a checkpoint never leaves the virtual machine paused; a production checkpoint leaves it off.", fr: "L'application d'un point de contrôle ne laisse jamais la machine virtuelle en pause ; un point de contrôle de production la laisse arrêtée." }
    references:
      - title: Using checkpoints
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/checkpoints

  # ------------------------------------------------------------------ 2
  - id: az802-qz-31-02
    objective: "3.1.1"
    difficulty: 1
    status: draft
    type: multi
    stem:
      en: |
        You have a Hyper-V host named **HV1** that runs Windows Server 2025. A virtual machine named **VM1** runs Windows Server 2022. From your Windows 11 computer, you connect to VM1 by using Virtual Machine Connection (VMConnect) in a basic session.

        Which two tasks require Enhanced Session Mode?

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un hôte Hyper-V nommé **HV1** qui exécute Windows Server 2025. Une machine virtuelle nommée **VM1** exécute Windows Server 2022. Depuis votre ordinateur Windows 11, vous vous connectez à VM1 avec Connexion à une machine virtuelle (VMConnect) dans une session de base.

        Quelles sont les deux tâches qui exigent le mode de session amélioré ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Send Ctrl+Alt+Delete to VM1 from the Action menu", fr: "Envoyer Ctrl+Alt+Suppr à VM1 depuis le menu Action" } }
        - { id: b, text: { en: "Print from VM1 to a printer connected to your computer", fr: "Imprimer depuis VM1 sur une imprimante connectée à votre ordinateur" } }
        - { id: c, text: { en: "Connect an ISO file to the DVD drive of VM1 from the Media menu", fr: "Connecter un fichier ISO au lecteur de DVD de VM1 depuis le menu Média" } }
        - { id: d, text: { en: "Sign in to VM1 with a smart card in the reader of your computer", fr: "Se connecter à VM1 avec une carte à puce dans le lecteur de votre ordinateur" } }
        - { id: e, text: { en: "Create a checkpoint of VM1 from the Action menu", fr: "Créer un point de contrôle de VM1 depuis le menu Action" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          A basic VMConnect session only gives the screen, keyboard and mouse of the virtual machine, plus the VMConnect menus. Using the local resources of the computer that runs VMConnect, such as printers, smart cards, USB devices, drives, audio and the clipboard, requires Enhanced Session Mode, which redirects them through an RDP session over the VMBus.
        fr: |
          Une session VMConnect de base ne donne que l'écran, le clavier et la souris de la machine virtuelle, plus les menus de VMConnect. Utiliser les ressources locales de l'ordinateur qui exécute VMConnect, comme les imprimantes, les cartes à puce, les périphériques USB, les lecteurs, l'audio et le Presse-papiers, exige le mode de session amélioré, qui les redirige par une session RDP sur le VMBus.
      options:
        a: { en: "Action > Ctrl+Alt+Delete (or Ctrl+Alt+End) works in any VMConnect session, including a basic one.", fr: "Action > Ctrl+Alt+Suppr (ou Ctrl+Alt+Fin) fonctionne dans toute session VMConnect, y compris une session de base." }
        c: { en: "The Media menu of VMConnect connects an ISO image to the virtual DVD drive without Enhanced Session Mode.", fr: "Le menu Média de VMConnect connecte une image ISO au lecteur de DVD virtuel sans le mode de session amélioré." }
        e: { en: "Creating a checkpoint is a VMConnect action (Action > Checkpoint) that doesn't depend on the session type.", fr: "Créer un point de contrôle est une action de VMConnect (Action > Point de contrôle) qui ne dépend pas du type de session." }
    references:
      - title: Use local resources on Hyper-V with VMConnect
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/use-local-resources-virtual-machine-connection
      - title: Hyper-V Virtual Machine Connection
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/virtual-machine-connection

  # ------------------------------------------------------------------ 3
  - id: az802-qz-31-03
    objective: "3.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a Hyper-V host named **HV1** that runs Windows Server 2025. A virtual machine named **VM8** on HV1 runs Windows Server 2022 and has no network adapter.

        On HV1, you open a PowerShell Direct session by running the following command:

        `$s = New-PSSession -VMName VM8 -Credential (Get-Credential)`

        You need to copy the file `C:\Logs\setup.log` of VM8 to the folder `D:\Collect` on HV1.

        Which command should you run on HV1?
      fr: |
        Vous disposez d'un hôte Hyper-V nommé **HV1** qui exécute Windows Server 2025. Une machine virtuelle nommée **VM8** sur HV1 exécute Windows Server 2022 et n'a aucune carte réseau.

        Sur HV1, vous ouvrez une session PowerShell Direct en exécutant la commande suivante :

        `$s = New-PSSession -VMName VM8 -Credential (Get-Credential)`

        Vous devez copier le fichier `C:\Logs\setup.log` de VM8 dans le dossier `D:\Collect` de HV1.

        Quelle commande devez-vous exécuter sur HV1 ?
    body:
      options:
        - id: a
          text: '`Copy-Item -ToSession $s -Path C:\Logs\setup.log -Destination D:\Collect\`'
        - id: b
          text: '`Invoke-Command -Session $s -ScriptBlock { Copy-Item C:\Logs\setup.log -Destination D:\Collect\ }`'
        - id: c
          text: '`Copy-VMFile -Name VM8 -SourcePath C:\Logs\setup.log -DestinationPath D:\Collect\setup.log -FileSource Host`'
        - id: d
          text: '`Copy-Item -FromSession $s -Path C:\Logs\setup.log -Destination D:\Collect\`'
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          With a persistent PowerShell Direct session, `Copy-Item -FromSession` copies a file from the virtual machine to the host: `-Path` is read in the guest and `-Destination` is written on the host. The session uses the VMBus, so VM8 needs no network adapter.
        fr: |
          Avec une session PowerShell Direct persistante, `Copy-Item -FromSession` copie un fichier de la machine virtuelle vers l'hôte : `-Path` est lu dans l'invité et `-Destination` est écrit sur l'hôte. La session passe par le VMBus : VM8 n'a donc besoin d'aucune carte réseau.
      options:
        a: { en: "-ToSession copies from the host into the virtual machine: it would look for C:\\Logs\\setup.log on HV1.", fr: "-ToSession copie de l'hôte vers la machine virtuelle : la commande chercherait C:\\Logs\\setup.log sur HV1." }
        b: { en: "The script block runs inside VM8, so the copy stays in the guest: D:\\Collect would be a folder of VM8, not of HV1.", fr: "Le bloc de script s'exécute dans VM8 : la copie reste dans l'invité et D:\\Collect serait un dossier de VM8, pas de HV1." }
        c: { en: "Copy-VMFile only accepts Host as -FileSource: it copies files from the host into the guest, not the other way.", fr: "Copy-VMFile n'accepte que Host pour -FileSource : il copie des fichiers de l'hôte vers l'invité, pas dans l'autre sens." }
    references:
      - title: Manage Windows Virtual Machines with PowerShell Direct
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/powershell-direct
      - title: Copy-VMFile (Hyper-V)
        url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/copy-vmfile

  # ------------------------------------------------------------------ 4
  - id: az802-qz-31-04
    objective: "3.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a Hyper-V host named **HV2** that runs Windows Server 2025. A generation 2 virtual machine named **APP2** runs Windows Server 2022 and uses 8 GB of static memory.

        APP2 needs 12 GB of memory immediately. APP2 must keep running, and it must keep using static memory.

        What should you do?
      fr: |
        Vous disposez d'un hôte Hyper-V nommé **HV2** qui exécute Windows Server 2025. Une machine virtuelle de génération 2 nommée **APP2** exécute Windows Server 2022 et utilise 8 Go de mémoire statique.

        APP2 a besoin de 12 Go de mémoire immédiatement. APP2 doit rester en cours d'exécution et continuer à utiliser de la mémoire statique.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "While APP2 runs, run `Set-VMMemory -VMName APP2 -MaximumBytes 12GB` on HV2.", fr: "Pendant que APP2 s'exécute, exécuter `Set-VMMemory -VMName APP2 -MaximumBytes 12GB` sur HV2." } }
        - { id: b, text: { en: "While APP2 runs, run `Set-VMMemory -VMName APP2 -StartupBytes 12GB` on HV2.", fr: "Pendant que APP2 s'exécute, exécuter `Set-VMMemory -VMName APP2 -StartupBytes 12GB` sur HV2." } }
        - { id: c, text: { en: "While APP2 runs, run `Set-VMMemory -VMName APP2 -DynamicMemoryEnabled $true -MaximumBytes 12GB` on HV2.", fr: "Pendant que APP2 s'exécute, exécuter `Set-VMMemory -VMName APP2 -DynamicMemoryEnabled $true -MaximumBytes 12GB` sur HV2." } }
        - { id: d, text: { en: "Save APP2, run `Set-VMMemory -VMName APP2 -StartupBytes 12GB` on HV2, and then start APP2.", fr: "Enregistrer APP2, exécuter `Set-VMMemory -VMName APP2 -StartupBytes 12GB` sur HV2, puis démarrer APP2." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Since Windows Server 2016, you can change the memory assigned to a running virtual machine even if Dynamic Memory isn't enabled, for generation 1 and 2 VMs that run Windows Server 2016 / Windows 10 or later. For a static memory VM, the assigned amount is the startup memory, so `-StartupBytes 12GB` resizes APP2 at runtime.
        fr: |
          Depuis Windows Server 2016, vous pouvez modifier la mémoire attribuée à une machine virtuelle en cours d'exécution même sans mémoire dynamique, pour les machines virtuelles de génération 1 et 2 qui exécutent Windows Server 2016 / Windows 10 ou ultérieur. Pour une machine virtuelle à mémoire statique, la quantité attribuée est la mémoire de démarrage : `-StartupBytes 12GB` redimensionne donc APP2 à chaud.
      options:
        a: { en: "Maximum memory is a Dynamic Memory setting; it doesn't change the memory of a VM that uses static memory.", fr: "La mémoire maximale est un paramètre de la mémoire dynamique ; elle ne change pas la mémoire d'une machine virtuelle à mémoire statique." }
        c: { en: "Dynamic Memory can only be turned on while the VM is off, and APP2 must keep static memory.", fr: "La mémoire dynamique ne s'active que machine virtuelle arrêtée, et APP2 doit conserver de la mémoire statique." }
        d: { en: "Saving APP2 interrupts it, which breaks the requirement; the resize works without stopping the VM.", fr: "Enregistrer APP2 l'interrompt, ce qui enfreint l'exigence ; le redimensionnement fonctionne sans arrêter la machine virtuelle." }
    references:
      - title: What's new in Windows Server 2016
        url: https://learn.microsoft.com/en-us/windows-server/get-started/whats-new-in-windows-server-2016
      - title: Set-VMMemory (Hyper-V)
        url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vmmemory

  # ------------------------------------------------------------------ 5
  - id: az802-qz-31-05
    objective: "3.1.5"
    difficulty: 2
    status: draft
    type: dragdrop
    stem:
      en: |
        You have a Hyper-V host named **HV3** that runs Windows Server 2025. A virtual machine named **VM5** on HV3 runs Windows Server 2022. You are documenting the integration services of VM5 for the operations team.

        Which integration service provides each capability? To answer, drag the appropriate integration services to the correct capabilities. Each integration service may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un hôte Hyper-V nommé **HV3** qui exécute Windows Server 2025. Une machine virtuelle nommée **VM5** sur HV3 exécute Windows Server 2022. Vous documentez les services d'intégration de VM5 pour l'équipe d'exploitation.

        Quel service d'intégration fournit chaque fonctionnalité ? Pour répondre, faites glisser les services d'intégration appropriés vers les fonctionnalités correctes. Chaque service d'intégration peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: hb, text: Heartbeat }
        - { id: kvp, text: Key-Value Pair Exchange }
        - { id: vss, text: VSS }
        - { id: ts, text: Time Synchronization }
        - { id: sd, text: Shutdown }
        - { id: gsi, text: Guest Service Interface }
      targets:
        - { id: t1, text: { en: "Tells Hyper-V that the guest operating system has booted, which the Running state of VM5 alone doesn't prove", fr: "Indique à Hyper-V que le système d'exploitation invité a démarré, ce que l'état En cours d'exécution de VM5 ne prouve pas à lui seul" } }
        - { id: t2, text: { en: "Lets a backup application on HV3 back up VM5 without shutting it down", fr: "Permet à une application de sauvegarde sur HV3 de sauvegarder VM5 sans l'arrêter" } }
        - { id: t3, text: { en: "Shares small strings, such as guest metadata, between HV3 and VM5 through the registry", fr: "Partage de petites chaînes, comme des métadonnées de l'invité, entre HV3 et VM5 par le Registre" } }
        - { id: t4, text: { en: "Prevents the system clock of VM5 from drifting erratically", fr: "Empêche l'horloge système de VM5 de dériver de façon erratique" } }
    answer:
      mapping: { t1: hb, t2: vss, t3: kvp, t4: ts }
    explanation:
      correct:
        en: |
          Heartbeat reports that the operating system booted, whereas Running only means that Hyper-V set resources aside. The Volume Shadow Copy Requestor (VSS) lets the Volume Shadow Copy Service back up a running VM. Key-Value Pair Exchange (data exchange) shares string key-value pairs through the registry over the VMBus. Time Synchronization keeps the guest clock synchronized with the host; without it, the clock drifts.
        fr: |
          Heartbeat signale que le système d'exploitation a démarré, alors que l'état En cours d'exécution signifie seulement qu'Hyper-V a réservé des ressources. Le demandeur VSS (cliché instantané de volume) permet au service VSS de sauvegarder une machine virtuelle en cours d'exécution. Key-Value Pair Exchange (échange de données) partage des paires clé-valeur de chaînes par le Registre via le VMBus. Time Synchronization synchronise l'horloge de l'invité avec celle de l'hôte ; sans lui, l'horloge dérive.
      options:
        sd: { en: "Shutdown lets the host request a clean shutdown of the guest; without it, every shutdown is a hard power-off.", fr: "Shutdown permet à l'hôte de demander un arrêt propre de l'invité ; sans lui, chaque arrêt est une coupure d'alimentation." }
        gsi: { en: "Guest Service Interface copies files between the host and the guest (Copy-VMFile); it is the only service off by default.", fr: "Guest Service Interface copie des fichiers entre l'hôte et l'invité (Copy-VMFile) ; c'est le seul service désactivé par défaut." }
    references:
      - title: Hyper-V Integration Services
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/integration-services

  # ------------------------------------------------------------------ 6
  - id: az802-qz-31-06
    objective: "3.1.6"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        You have a standalone Hyper-V host named **HV4** that runs Windows Server 2025. HV4 has an NVIDIA GPU that is assigned to a running virtual machine named **VM-Render** by using Discrete Device Assignment. The PCIe location path of the GPU is stored in the variable `$locationPath`.

        The rendering project has ended. You need the operating system of HV4 to use the GPU again for a local visualization application.

        Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Vous disposez d'un hôte Hyper-V autonome nommé **HV4** qui exécute Windows Server 2025. HV4 possède un GPU NVIDIA attribué à une machine virtuelle en cours d'exécution nommée **VM-Render** par l'attribution discrète d'appareil. Le chemin d'emplacement PCIe du GPU est stocké dans la variable `$locationPath`.

        Le projet de rendu est terminé. Vous devez faire en sorte que le système d'exploitation de HV4 utilise de nouveau le GPU pour une application de visualisation locale.

        Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et classez-les dans l'ordre correct.
    body:
      count: 4
      actions:
        - { id: dismount, text: { en: "Run Dismount-VMHostAssignableDevice -Force -LocationPath $locationPath.", fr: "Exécuter Dismount-VMHostAssignableDevice -Force -LocationPath $locationPath." } }
        - { id: mount, text: { en: "Run Mount-VMHostAssignableDevice -LocationPath $locationPath.", fr: "Exécuter Mount-VMHostAssignableDevice -LocationPath $locationPath." } }
        - { id: stop, text: { en: "Turn off VM-Render.", fr: "Arrêter VM-Render." } }
        - { id: gpup, text: { en: "Run Remove-VMGpuPartitionAdapter -VMName VM-Render.", fr: "Exécuter Remove-VMGpuPartitionAdapter -VMName VM-Render." } }
        - { id: enable, text: { en: "Enable the GPU in Device Manager on HV4.", fr: "Activer le GPU dans le Gestionnaire de périphériques de HV4." } }
        - { id: remove, text: { en: "Run Remove-VMAssignableDevice -LocationPath $locationPath -VMName VM-Render.", fr: "Exécuter Remove-VMAssignableDevice -LocationPath $locationPath -VMName VM-Render." } }
        - { id: save, text: { en: "Run Set-VM -Name VM-Render -AutomaticStopAction Save.", fr: "Exécuter Set-VM -Name VM-Render -AutomaticStopAction Save." } }
    answer:
      sequence: [stop, remove, mount, enable]
    explanation:
      correct:
        en: |
          To return a device to its original state, you stop the virtual machine, remove the device from it with `Remove-VMAssignableDevice`, and mount it back in the host with `Mount-VMHostAssignableDevice`. You can then re-enable the device in Device Manager so that the host operating system can use it again.
        fr: |
          Pour rendre un appareil à son état d'origine, vous arrêtez la machine virtuelle, retirez l'appareil de celle-ci avec `Remove-VMAssignableDevice`, puis le remontez dans l'hôte avec `Mount-VMHostAssignableDevice`. Vous pouvez ensuite réactiver l'appareil dans le Gestionnaire de périphériques pour que le système d'exploitation de l'hôte l'utilise de nouveau.
      options:
        dismount: { en: "Dismounting removes a device from the host before it's assigned to a VM: it's the opposite of what you need here.", fr: "Le démontage retire un appareil de l'hôte avant son attribution à une machine virtuelle : c'est l'inverse de ce qu'il faut ici." }
        gpup: { en: "Remove-VMGpuPartitionAdapter removes a GPU partition (GPU-P), not a device assigned with DDA.", fr: "Remove-VMGpuPartitionAdapter retire une partition GPU (GPU-P), pas un appareil attribué par DDA." }
        save: { en: "A VM with an assigned device must use TurnOff as automatic stop action, because save/restore isn't available with DDA.", fr: "Une machine virtuelle à laquelle un appareil est attribué doit utiliser TurnOff comme action d'arrêt automatique, car l'enregistrement/restauration n'est pas disponible avec DDA." }
    references:
      - title: Deploy graphics devices by using Discrete Device Assignment
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/deploy/deploying-graphics-devices-using-dda

  # ------------------------------------------------------------------ 7
  - id: az802-qz-31-07
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has a Hyper-V host named **HV5** that runs Windows Server 2025 and has Intel processors with VT-x and EPT. A virtual machine named **LAB1** on HV5 has nested virtualization enabled and MAC address spoofing turned on for its network adapter. The Hyper-V role is installed in LAB1, which runs six nested virtual machines for a training course.

        LAB1 uses 16 GB of static memory. The trainers need LAB1 to have 24 GB of memory so that they can add nested virtual machines. LAB1 can be unavailable for a few minutes during the lunch break, and the solution must minimize the downtime of LAB1.

        What should you do?
      fr: |
        Contoso dispose d'un hôte Hyper-V nommé **HV5** qui exécute Windows Server 2025 et possède des processeurs Intel dotés de VT-x et d'EPT. Une machine virtuelle nommée **LAB1** sur HV5 a la virtualisation imbriquée activée et l'usurpation d'adresses MAC activée sur sa carte réseau. Le rôle Hyper-V est installé dans LAB1, qui exécute six machines virtuelles imbriquées pour une formation.

        LAB1 utilise 16 Go de mémoire statique. Les formateurs ont besoin que LAB1 dispose de 24 Go de mémoire pour ajouter des machines virtuelles imbriquées. LAB1 peut être indisponible quelques minutes pendant la pause déjeuner, et la solution doit réduire au minimum l'indisponibilité de LAB1.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Stop the nested virtual machines, and then run `Set-VMMemory -VMName LAB1 -StartupBytes 24GB` on HV5 while LAB1 runs.", fr: "Arrêter les machines virtuelles imbriquées, puis exécuter `Set-VMMemory -VMName LAB1 -StartupBytes 24GB` sur HV5 pendant que LAB1 s'exécute." } }
        - { id: b, text: { en: "Run `Set-VMMemory -VMName LAB1 -StartupBytes 24GB` on HV5 while LAB1 and its nested virtual machines run.", fr: "Exécuter `Set-VMMemory -VMName LAB1 -StartupBytes 24GB` sur HV5 pendant que LAB1 et ses machines virtuelles imbriquées s'exécutent." } }
        - { id: c, text: { en: "Turn off LAB1, enable Dynamic Memory with a startup of 16 GB and a maximum of 24 GB, and then start LAB1.", fr: "Arrêter LAB1, activer la mémoire dynamique avec 16 Go au démarrage et 24 Go au maximum, puis démarrer LAB1." } }
        - { id: d, text: { en: "Shut down LAB1, run `Set-VMMemory -VMName LAB1 -StartupBytes 24GB` on HV5, and then start LAB1.", fr: "Arrêter LAB1, exécuter `Set-VMMemory -VMName LAB1 -StartupBytes 24GB` sur HV5, puis démarrer LAB1." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          While Hyper-V runs inside a virtual machine, the memory of that VM can only be changed while it's turned off: a runtime resize of static memory fails, and Dynamic Memory makes the amount of memory never fluctuate. A short shutdown during the break to set 24 GB of static memory is therefore the only solution that gives LAB1 its 24 GB.
        fr: |
          Tant qu'Hyper-V s'exécute dans une machine virtuelle, la mémoire de celle-ci ne peut être modifiée que machine virtuelle arrêtée : le redimensionnement à chaud de la mémoire statique échoue, et avec la mémoire dynamique la quantité de mémoire ne varie jamais. Un court arrêt pendant la pause pour définir 24 Go de mémoire statique est donc la seule solution qui donne ses 24 Go à LAB1.
      options:
        a: { en: "Stopping the nested VMs doesn't stop Hyper-V in LAB1; the incompatibility lasts while Hyper-V runs in the VM, so the resize still fails.", fr: "Arrêter les machines virtuelles imbriquées n'arrête pas Hyper-V dans LAB1 ; l'incompatibilité dure tant qu'Hyper-V s'exécute dans la machine virtuelle : le redimensionnement échoue toujours." }
        b: { en: "Runtime memory resize fails for a VM without Dynamic Memory while Hyper-V runs inside it.", fr: "Le redimensionnement de la mémoire à chaud échoue pour une machine virtuelle sans mémoire dynamique tant qu'Hyper-V s'exécute dans celle-ci." }
        c: { en: "With Hyper-V running in LAB1, Dynamic Memory never adds memory: LAB1 would stay at its 16 GB startup memory.", fr: "Avec Hyper-V en cours d'exécution dans LAB1, la mémoire dynamique n'ajoute jamais de mémoire : LAB1 resterait à ses 16 Go de mémoire de démarrage." }
    references:
      - title: What is Nested Virtualization for Hyper-V?
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/nested-virtualization
      - title: Run Hyper-V in a Virtual Machine with Nested Virtualization
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/enable-nested-virtualization

  # ------------------------------------------------------------------ 8
  - id: az802-qz-31-08
    objective: "3.1.7"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has two standalone Hyper-V hosts named **HV6** and **HV7** that run Windows Server 2025 Standard. The hosts aren't members of a failover cluster. Each host has one NVIDIA A16 GPU, 4th Gen Intel Xeon Scalable processors and the NVIDIA vGPU software v18 host driver. Virtualization is enabled in the BIOS of both hosts. SR-IOV is enabled in the BIOS of HV7 only.

        You plan to give each of the following virtual machines on HV6 a partition of its GPU:

        | Virtual machine | Guest operating system |
        | --- | --- |
        | VDI1 | Windows 11 |
        | VDI2 | Windows 11 |
        | APP3 | Windows Server 2016 |
        | APP4 | Windows Server 2022 |

        The virtual machines must be live migrated to HV7 during the planned maintenance of HV6.

        Which two issues prevent you from meeting the requirements?

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose de deux hôtes Hyper-V autonomes nommés **HV6** et **HV7** qui exécutent Windows Server 2025 Standard. Les hôtes ne sont pas membres d'un cluster de basculement. Chaque hôte possède un GPU NVIDIA A16, des processeurs Intel Xeon Scalable de 4e génération et le pilote hôte du logiciel NVIDIA vGPU v18. La virtualisation est activée dans le BIOS des deux hôtes. SR-IOV n'est activé que dans le BIOS de HV7.

        Vous prévoyez de donner à chacune des machines virtuelles suivantes de HV6 une partition de son GPU :

        | Machine virtuelle | Système d'exploitation invité |
        | --- | --- |
        | VDI1 | Windows 11 |
        | VDI2 | Windows 11 |
        | APP3 | Windows Server 2016 |
        | APP4 | Windows Server 2022 |

        Les machines virtuelles doivent être migrées dynamiquement vers HV7 pendant la maintenance planifiée de HV6.

        Quels sont les deux problèmes qui vous empêchent de répondre aux exigences ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "HV6 and HV7 run the Standard edition of Windows Server 2025.", fr: "HV6 et HV7 exécutent l'édition Standard de Windows Server 2025." } }
        - { id: b, text: { en: "HV6 and HV7 aren't members of a failover cluster.", fr: "HV6 et HV7 ne sont pas membres d'un cluster de basculement." } }
        - { id: c, text: { en: "SR-IOV isn't enabled in the BIOS of HV6.", fr: "SR-IOV n'est pas activé dans le BIOS de HV6." } }
        - { id: d, text: { en: "HV6 has a single GPU for four virtual machines.", fr: "HV6 n'a qu'un seul GPU pour quatre machines virtuelles." } }
        - { id: e, text: { en: "APP3 runs Windows Server 2016.", fr: "APP3 exécute Windows Server 2016." } }
    answer: { optionIds: [c, e] }
    explanation:
      correct:
        en: |
          GPU partitioning relies on SR-IOV, which must be enabled in the BIOS of every host that provides partitions, so HV6 can't partition its GPU yet. GPU partitioning supports Windows 10 or later and Windows Server 2019 or later guests, so APP3 can't receive a partition. The rest is supported: live migration between standalone hosts for planned downtime, with processors that support IOMMU DMA bit tracking and the vGPU v18 driver.
        fr: |
          Le partitionnement GPU repose sur SR-IOV, qui doit être activé dans le BIOS de chaque hôte qui fournit des partitions : HV6 ne peut donc pas encore partitionner son GPU. Le partitionnement GPU prend en charge les invités Windows 10 ou ultérieur et Windows Server 2019 ou ultérieur : APP3 ne peut donc pas recevoir de partition. Le reste est pris en charge : la migration dynamique entre hôtes autonomes pour un arrêt planifié, avec des processeurs qui gèrent le suivi des bits DMA par l'IOMMU et le pilote vGPU v18.
      options:
        a: { en: "Windows Server 2025 Datacenter is required only when you cluster the hosts for unplanned downtime.", fr: "Windows Server 2025 Datacenter n'est exigé que si vous mettez les hôtes en cluster pour les arrêts non planifiés." }
        b: { en: "GPU partitioning is designed for standalone servers, and you can live migrate between standalone hosts for planned downtime.", fr: "Le partitionnement GPU est conçu pour les serveurs autonomes, et vous pouvez migrer dynamiquement entre hôtes autonomes pour un arrêt planifié." }
        d: { en: "Sharing one physical GPU between several VMs is the purpose of GPU partitioning.", fr: "Partager un GPU physique entre plusieurs machines virtuelles est précisément l'objet du partitionnement GPU." }
    references:
      - title: Partition and share GPUs with virtual machines on Hyper-V
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/gpu-partitioning
      - title: Partition and assign GPUs to a virtual machine in Hyper-V
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/partition-assign-vm-gpu

  # ------------------------------------------------------------------ 9
  - id: az802-qz-31-09
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum has a Hyper-V host named **HV8** that runs Windows Server 2025. A virtual machine named **SQL8** on HV8 runs Windows Server 2022 and uses Dynamic Memory with the following settings:

        | Setting | Value |
        | --- | --- |
        | Startup memory | 4 GB |
        | Minimum memory | 2 GB |
        | Maximum memory | 8 GB |

        SQL8 is running and currently uses 2.5 GB of memory.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un hôte Hyper-V nommé **HV8** qui exécute Windows Server 2025. Une machine virtuelle nommée **SQL8** sur HV8 exécute Windows Server 2022 et utilise la mémoire dynamique avec les paramètres suivants :

        | Paramètre | Valeur |
        | --- | --- |
        | Mémoire de démarrage | 4 Go |
        | Mémoire minimale | 2 Go |
        | Mémoire maximale | 8 Go |

        SQL8 est en cours d'exécution et utilise actuellement 2,5 Go de mémoire.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "While SQL8 runs, you can raise its maximum memory to 16 GB.", fr: "Pendant que SQL8 s'exécute, vous pouvez porter sa mémoire maximale à 16 Go." }
        - id: s2
          text: { en: "While SQL8 runs, you can raise its minimum memory to 3 GB.", fr: "Pendant que SQL8 s'exécute, vous pouvez porter sa mémoire minimale à 3 Go." }
        - id: s3
          text: { en: "If SQL8 restarts while HV8 can't provide its 4 GB of startup memory and no memory can be reclaimed from the other virtual machines, Hyper-V uses Smart Paging so that SQL8 can restart.", fr: "Si SQL8 redémarre alors que HV8 ne peut pas fournir ses 4 Go de mémoire de démarrage et qu'aucune mémoire ne peut être récupérée sur les autres machines virtuelles, Hyper-V utilise la pagination intelligente pour que SQL8 puisse redémarrer." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          While a VM runs, Hyper-V allows two Dynamic Memory changes: increasing the maximum memory and decreasing the minimum memory. Raising the minimum isn't one of them. Smart Paging uses disk as temporary memory when a VM whose minimum is lower than its startup memory restarts, there's no available physical memory and nothing can be reclaimed from the other VMs.
        fr: |
          Pendant qu'une machine virtuelle s'exécute, Hyper-V autorise deux modifications de la mémoire dynamique : augmenter la mémoire maximale et diminuer la mémoire minimale. Relever le minimum n'en fait pas partie. La pagination intelligente utilise le disque comme mémoire temporaire quand une machine virtuelle dont le minimum est inférieur à la mémoire de démarrage redémarre, qu'il n'y a pas de mémoire physique disponible et que rien ne peut être récupéré sur les autres machines virtuelles.
      options:
        s2: { en: "Only increasing the maximum and decreasing the minimum are run-time changes; to raise the minimum, turn SQL8 off first.", fr: "Seules l'augmentation du maximum et la diminution du minimum sont des modifications à chaud ; pour relever le minimum, arrêtez d'abord SQL8." }
    references:
      - title: Dynamic Memory for Hyper-V Virtual Machines
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/dynamic-memory

  # ------------------------------------------------------------------ 10
  - id: az802-qz-31-10
    objective: "3.1.8"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind Traders has a Hyper-V host named **HV9** that runs Windows Server 2025. A virtual machine named **ERP9** on HV9 runs Windows Server 2022 and an ERP database. The checkpoint type of ERP9 is set to **Production**.

        Last month, while troubleshooting a backup agent, an administrator ran the following command on HV9:

        `Disable-VMIntegrationService -VMName ERP9 -Name VSS`

        Yesterday, you created a checkpoint of ERP9 before an update, and then you applied it. ERP9 resumed running immediately, with the same applications open as when you created the checkpoint.

        You need to ensure that the future checkpoints of ERP9 are data-consistent and never contain the memory state. If a data-consistent checkpoint can't be created, the checkpoint operation must fail.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un hôte Hyper-V nommé **HV9** qui exécute Windows Server 2025. Une machine virtuelle nommée **ERP9** sur HV9 exécute Windows Server 2022 et une base de données d'ERP. Le type de point de contrôle d'ERP9 est défini sur **Production**.

        Le mois dernier, en dépannant un agent de sauvegarde, un administrateur a exécuté la commande suivante sur HV9 :

        `Disable-VMIntegrationService -VMName ERP9 -Name VSS`

        Hier, vous avez créé un point de contrôle d'ERP9 avant une mise à jour, puis vous l'avez appliqué. ERP9 a repris son exécution immédiatement, avec les mêmes applications ouvertes que lors de la création du point de contrôle.

        Vous devez faire en sorte que les futurs points de contrôle d'ERP9 soient cohérents au niveau des données et ne contiennent jamais l'état de la mémoire. Si un point de contrôle cohérent ne peut pas être créé, l'opération de point de contrôle doit échouer.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Run `Set-VM -Name ERP9 -CheckpointType Standard` on HV9.", fr: "Exécuter `Set-VM -Name ERP9 -CheckpointType Standard` sur HV9." } }
        - { id: b, text: { en: "Run `Enable-VMIntegrationService -VMName ERP9 -Name VSS` on HV9.", fr: "Exécuter `Enable-VMIntegrationService -VMName ERP9 -Name VSS` sur HV9." } }
        - { id: c, text: { en: "Run `Set-VM -Name ERP9 -AutomaticCheckpointsEnabled $false` on HV9.", fr: "Exécuter `Set-VM -Name ERP9 -AutomaticCheckpointsEnabled $false` sur HV9." } }
        - { id: d, text: { en: "Run `Set-VM -Name ERP9 -CheckpointType ProductionOnly` on HV9.", fr: "Exécuter `Set-VM -Name ERP9 -CheckpointType ProductionOnly` sur HV9." } }
        - { id: e, text: { en: "Start the Hyper-V Volume Shadow Copy Requestor service in ERP9 by using the Services console.", fr: "Démarrer le service Hyper-V Volume Shadow Copy Requestor dans ERP9 avec la console Services." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          A production checkpoint relies on the Volume Shadow Copy Service in the guest, which the VSS integration service connects to the host. With that service disabled, the guest couldn't create a production checkpoint, and the Production type fell back to a standard checkpoint that captured the memory, which is why ERP9 resumed with its applications open. Re-enabling VSS from the host restores production checkpoints, and ProductionOnly makes the operation fail instead of falling back.
        fr: |
          Un point de contrôle de production repose sur le service VSS de l'invité, que le service d'intégration VSS relie à l'hôte. Ce service étant désactivé, l'invité n'a pas pu créer de point de contrôle de production, et le type Production a basculé sur un point de contrôle standard qui a capturé la mémoire : c'est pourquoi ERP9 a repris avec ses applications ouvertes. Réactiver VSS depuis l'hôte rétablit les points de contrôle de production, et ProductionOnly fait échouer l'opération au lieu de basculer.
      options:
        a: { en: "Standard checkpoints always capture the memory state, which the requirement forbids.", fr: "Les points de contrôle standard capturent toujours l'état de la mémoire, ce que l'exigence interdit." }
        c: { en: "Automatic checkpoints only decide whether Hyper-V creates checkpoints by itself; they don't change the checkpoint type.", fr: "Les points de contrôle automatiques décident seulement si Hyper-V crée lui-même des points de contrôle ; ils ne changent pas le type de point de contrôle." }
        e: { en: "An integration service must be enabled on the host and in the guest; while VSS is disabled on HV9, starting the guest service doesn't restore it.", fr: "Un service d'intégration doit être activé sur l'hôte et dans l'invité ; tant que VSS est désactivé sur HV9, démarrer le service invité ne le rétablit pas." }
    references:
      - title: Using checkpoints
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/checkpoints
      - title: Hyper-V Integration Services
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/integration-services
