chapter: 32-hyper-v-storage-networking
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-32-01
    objective: "3.1.13"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a Hyper-V host named **HV1** that runs Windows Server 2025. You create three virtual machines on HV1 for a malware analysis lab.

        The three virtual machines must communicate with each other. They must never communicate with HV1 or with the physical network.

        Which type of virtual switch should you connect them to?
      fr: |
        Vous disposez d'un hôte Hyper-V nommé **HV1** qui exécute Windows Server 2025. Vous créez trois machines virtuelles sur HV1 pour un labo d'analyse de logiciels malveillants.

        Les trois machines virtuelles doivent communiquer entre elles. Elles ne doivent jamais communiquer avec HV1 ni avec le réseau physique.

        À quel type de commutateur virtuel devez-vous les connecter ?
    body:
      options:
        - { id: a, text: { en: "An external virtual switch", fr: "Un commutateur virtuel externe" } }
        - { id: b, text: { en: "An external virtual switch that the management operating system doesn't share", fr: "Un commutateur virtuel externe que le système d'exploitation de gestion ne partage pas" } }
        - { id: c, text: { en: "An internal virtual switch", fr: "Un commutateur virtuel interne" } }
        - { id: d, text: { en: "A private virtual switch", fr: "Un commutateur virtuel privé" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A private virtual switch connects only the virtual machines that run on the host that has the switch. It provides no networking between the host and the virtual machines, and it isn't bound to a physical adapter.
        fr: |
          Un commutateur virtuel privé ne relie que les machines virtuelles qui s'exécutent sur l'hôte qui possède le commutateur. Il n'offre aucune connectivité entre l'hôte et les machines virtuelles, et il n'est lié à aucune carte physique.
      options:
        a: { en: "An external switch is bound to a physical adapter, so the virtual machines would reach the physical network.", fr: "Un commutateur externe est lié à une carte physique : les machines virtuelles atteindraient le réseau physique." }
        b: { en: "Without management OS sharing, HV1 doesn't use the adapter, but the virtual machines still reach the physical network.", fr: "Sans partage avec le système d'exploitation de gestion, HV1 n'utilise pas la carte, mais les machines virtuelles atteignent toujours le réseau physique." }
        c: { en: "An internal switch also connects the virtual machines with the host, which the lab must never reach.", fr: "Un commutateur interne relie aussi les machines virtuelles à l'hôte, que le labo ne doit jamais atteindre." }
    references:
      - title: Plan for Hyper-V networking in Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/plan/plan-hyper-v-networking-in-windows-server

  # ------------------------------------------------------------------ 2
  - id: az802-qz-32-02
    objective: "3.1.10"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a Hyper-V host named **HV2** that runs Windows Server 2025. A generation 2 virtual machine named **FS2** stores file shares.

        You need to add a 3 TB data disk to FS2. The disk file must grow on HV2 only as data is written to it.

        Which virtual hard disk should you create?
      fr: |
        Vous disposez d'un hôte Hyper-V nommé **HV2** qui exécute Windows Server 2025. Une machine virtuelle de génération 2 nommée **FS2** héberge des partages de fichiers.

        Vous devez ajouter un disque de données de 3 To à FS2. Le fichier du disque ne doit grossir sur HV2 qu'au fil des données écrites.

        Quel disque dur virtuel devez-vous créer ?
    body:
      options:
        - { id: a, text: { en: "A dynamically expanding VHD", fr: "Un disque VHD dynamiquement extensible" } }
        - { id: b, text: { en: "A dynamically expanding VHDX", fr: "Un disque VHDX dynamiquement extensible" } }
        - { id: c, text: { en: "A fixed-size VHD", fr: "Un disque VHD de taille fixe" } }
        - { id: d, text: { en: "A differencing VHD", fr: "Un disque VHD de différenciation" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A VHD is limited to 2,040 GB, whereas a VHDX supports up to 64 TB, so only a VHDX can hold 3 TB. A dynamically expanding disk grows as data is written, which meets the second requirement.
        fr: |
          Un disque VHD est limité à 2 040 Go, alors qu'un disque VHDX prend en charge jusqu'à 64 To : seul un VHDX peut contenir 3 To. Un disque dynamiquement extensible grossit au fil des écritures, ce qui répond à la seconde exigence.
      options:
        a: { en: "The VHD format can't exceed 2,040 GB, whatever its type.", fr: "Le format VHD ne peut pas dépasser 2 040 Go, quel que soit son type." }
        c: { en: "A fixed-size disk allocates its full size at creation, and a VHD can't reach 3 TB.", fr: "Un disque de taille fixe alloue toute sa taille à la création, et un VHD ne peut pas atteindre 3 To." }
        d: { en: "A differencing disk stores the changes made to a parent disk, and a VHD can't reach 3 TB.", fr: "Un disque de différenciation stocke les modifications d'un disque parent, et un VHD ne peut pas atteindre 3 To." }
    references:
      - title: Hyper-V Maximum Scale Limits in Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/maximum-scale-limits

  # ------------------------------------------------------------------ 3
  - id: az802-qz-32-03
    objective: "3.1.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has a branch office with a two-node Hyper-V failover cluster named **HVC-BR1**. The nodes, **HV1** and **HV2**, run Windows Server 2025 and use Storage Spaces Direct. There's no other server and no NAS in the branch office. The branch office has a reliable internet connection, and Tailspin has an Azure subscription.

        You need to configure a quorum witness so that HVC-BR1 keeps running its virtual machines if one node fails. The solution must not require new hardware in the branch office.

        Which witness should you configure?
      fr: |
        Tailspin Toys dispose d'une succursale avec un cluster de basculement Hyper-V à deux nœuds nommé **HVC-BR1**. Les nœuds, **HV1** et **HV2**, exécutent Windows Server 2025 et utilisent les espaces de stockage direct. Il n'y a aucun autre serveur ni aucun NAS dans la succursale. La succursale dispose d'une connexion Internet fiable, et Tailspin dispose d'un abonnement Azure.

        Vous devez configurer un témoin de quorum pour que HVC-BR1 continue à exécuter ses machines virtuelles si un nœud tombe en panne. La solution ne doit exiger aucun nouveau matériel dans la succursale.

        Quel témoin devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "A disk witness on a volume of the Storage Spaces Direct pool", fr: "Un témoin disque sur un volume du pool d'espaces de stockage direct" } }
        - { id: b, text: { en: "A cloud witness in an Azure storage account", fr: "Un témoin cloud dans un compte de stockage Azure" } }
        - { id: c, text: { en: "A file share witness on a shared folder of HV1", fr: "Un témoin de partage de fichiers sur un dossier partagé de HV1" } }
        - { id: d, text: { en: "No witness, with node majority quorum", fr: "Aucun témoin, avec un quorum à majorité de nœuds" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With two nodes, the cluster needs a witness vote to keep a majority when one node fails. A cloud witness stores a blob in Azure Blob Storage and needs no third site or extra server, only internet access from the nodes.
        fr: |
          Avec deux nœuds, le cluster a besoin du vote d'un témoin pour garder la majorité quand un nœud tombe en panne. Un témoin cloud stocke un objet blob dans le Stockage Blob Azure et n'exige ni troisième site ni serveur supplémentaire, seulement un accès Internet depuis les nœuds.
      options:
        a: { en: "A disk witness needs a shared disk, and a Storage Spaces Direct cluster has no shared drive to use for it.", fr: "Un témoin disque exige un disque partagé, et un cluster d'espaces de stockage direct n'a aucun lecteur partagé à utiliser pour cela." }
        c: { en: "A witness hosted on HV1 disappears with HV1: when HV1 fails, the cluster loses two of its three votes.", fr: "Un témoin hébergé sur HV1 disparaît avec HV1 : quand HV1 tombe en panne, le cluster perd deux de ses trois votes." }
        d: { en: "Without a witness, the failure of one of the two nodes leaves half of the votes, which isn't a majority.", fr: "Sans témoin, la panne d'un des deux nœuds laisse la moitié des votes, ce qui n'est pas une majorité." }
    references:
      - title: What is a failover cluster quorum witness in Windows Server?
        url: https://learn.microsoft.com/en-us/windows-server/failover-clustering/what-is-quorum-witness

  # ------------------------------------------------------------------ 4
  - id: az802-qz-32-04
    objective: "3.1.11"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a Hyper-V host named **HV4** that runs Windows Server 2025. HV4 has an external virtual switch named **External1** that is shared by 12 virtual machines.

        During the night, the backup traffic sent by a virtual machine named **BKP1** saturates External1 and slows down the other virtual machines.

        You need to limit the outbound traffic of the network adapter of BKP1 to 2 Gbps. The settings of the other virtual machines must not change.

        Which command should you run on HV4?
      fr: |
        Vous disposez d'un hôte Hyper-V nommé **HV4** qui exécute Windows Server 2025. HV4 possède un commutateur virtuel externe nommé **External1** partagé par 12 machines virtuelles.

        La nuit, le trafic de sauvegarde émis par une machine virtuelle nommée **BKP1** sature External1 et ralentit les autres machines virtuelles.

        Vous devez limiter le trafic sortant de la carte réseau de BKP1 à 2 Gbit/s. Les paramètres des autres machines virtuelles ne doivent pas changer.

        Quelle commande devez-vous exécuter sur HV4 ?
    body:
      options:
        - { id: a, text: "`Set-VMNetworkAdapter -VMName BKP1 -MinimumBandwidthWeight 20`" }
        - { id: b, text: "`Set-VMNetworkAdapter -VMName BKP1 -MinimumBandwidthAbsolute 2000000000`" }
        - { id: c, text: "`Set-VMNetworkAdapter -VMName BKP1 -MaximumBandwidth 2000000000`" }
        - { id: d, text: "`Set-VMNetworkAdapter -VMName BKP1 -VmqWeight 20`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `-MaximumBandwidth` sets an egress limit on a virtual network adapter, in bits per second, so 2000000000 caps BKP1 at 2 Gbps. Only the adapter of BKP1 is changed, and the switch doesn't need to be re-created.
        fr: |
          `-MaximumBandwidth` définit une limite de trafic sortant sur une carte réseau virtuelle, en bits par seconde : 2000000000 plafonne donc BKP1 à 2 Gbit/s. Seule la carte de BKP1 est modifiée, et le commutateur n'a pas besoin d'être recréé.
      options:
        a: { en: "A minimum bandwidth weight guarantees a relative share of the switch bandwidth; it doesn't cap the traffic of BKP1.", fr: "Un poids de bande passante minimale garantit une part relative de la bande passante du commutateur ; il ne plafonne pas le trafic de BKP1." }
        b: { en: "A minimum bandwidth reservation guarantees 2 Gbps to BKP1 instead of limiting it.", fr: "Une réservation de bande passante minimale garantit 2 Gbit/s à BKP1 au lieu de la limiter." }
        d: { en: "VmqWeight controls the use of Virtual Machine Queue for the adapter; it doesn't limit bandwidth.", fr: "VmqWeight règle l'utilisation de la file d'attente de machine virtuelle (VMQ) pour la carte ; il ne limite pas la bande passante." }
    references:
      - title: Set-VMNetworkAdapter (Hyper-V)
        url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vmnetworkadapter

  # ------------------------------------------------------------------ 5
  - id: az802-qz-32-05
    objective: "3.1.12"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        You have a Hyper-V host named **HV5** that runs Windows Server 2025. You created a virtual switch on HV5 by running the following command:

        `New-VMSwitch -Name SETswitch -NetAdapterName "NIC1","NIC2" -EnableEmbeddedTeaming $true -AllowManagementOS $true`

        NIC1 and NIC2 are identical 25-GbE adapters. You need SETswitch to use the load balancing algorithm that Microsoft recommends for Switch Embedded Teaming (SET) on adapters of this speed.

        How should you complete the command? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un hôte Hyper-V nommé **HV5** qui exécute Windows Server 2025. Vous avez créé un commutateur virtuel sur HV5 en exécutant la commande suivante :

        `New-VMSwitch -Name SETswitch -NetAdapterName "NIC1","NIC2" -EnableEmbeddedTeaming $true -AllowManagementOS $true`

        NIC1 et NIC2 sont des cartes 25 GbE identiques. Vous devez faire en sorte que SETswitch utilise l'algorithme d'équilibrage de charge que Microsoft recommande pour le Switch Embedded Teaming (SET) sur des cartes de ce débit.

        Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: powershell
      template: |
        [[cmd]] -Name SETswitch -LoadBalancingAlgorithm [[lb]]
      slots:
        - id: cmd
          options:
            - { id: lbfo, text: Set-NetLbfoTeam }
            - { id: switch, text: Set-VMSwitch }
            - { id: team, text: Set-VMSwitchTeam }
            - { id: map, text: Set-VMNetworkAdapterTeamMapping }
        - id: lb
          options:
            - { id: dynamic, text: Dynamic }
            - { id: hvport, text: HyperVPort }
            - { id: tports, text: TransportPorts }
            - { id: ipaddr, text: IPAddresses }
    answer:
      values: { cmd: team, lb: hvport }
    explanation:
      correct:
        en: |
          The team of a SET switch is configured with `Set-VMSwitchTeam`, whose `-LoadBalancingAlgorithm` accepts only `Dynamic` (the default) and `HyperVPort`. SET supports only the switch-independent mode, and Microsoft recommends Hyper-V Port for all adapters that run at 10 Gbps or more.
        fr: |
          L'association d'un commutateur SET se configure avec `Set-VMSwitchTeam`, dont le paramètre `-LoadBalancingAlgorithm` n'accepte que `Dynamic` (la valeur par défaut) et `HyperVPort`. SET ne prend en charge que le mode indépendant du commutateur, et Microsoft recommande Hyper-V Port pour toutes les cartes de 10 Gbit/s ou plus.
      options:
        lbfo: { en: "Set-NetLbfoTeam configures an LBFO team, which a Hyper-V switch can't be bound to since Windows Server 2022.", fr: "Set-NetLbfoTeam configure une association LBFO, à laquelle un commutateur Hyper-V ne peut plus être lié depuis Windows Server 2022." }
        dynamic: { en: "Dynamic is the default algorithm of SET, not the one recommended for adapters of 10 Gbps or more.", fr: "Dynamic est l'algorithme par défaut de SET, pas celui recommandé pour les cartes de 10 Gbit/s ou plus." }
        tports: { en: "TransportPorts is an address hash algorithm of LBFO teams; Set-VMSwitchTeam doesn't accept it.", fr: "TransportPorts est un algorithme de hachage d'adresses des associations LBFO ; Set-VMSwitchTeam ne l'accepte pas." }
    references:
      - title: Set-VMSwitchTeam (Hyper-V)
        url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vmswitchteam
      - title: Host network requirements for Azure Local
        url: https://learn.microsoft.com/en-us/azure/azure-local/concepts/host-network-requirements

  # ------------------------------------------------------------------ 6
  - id: az802-qz-32-06
    objective: "3.1.14"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        You have two standalone Hyper-V hosts that run Windows Server 2025: **HV-NTE1** in Nantes and **HV-BDX1** in Bordeaux. A virtual machine named **CRM1** runs on HV-NTE1 and replicates to HV-BDX1 by using Hyper-V Replica.

        Power maintenance is scheduled in Nantes tomorrow. You need to run CRM1 on HV-BDX1 during the maintenance without losing any data. The changes made to CRM1 on HV-BDX1 must then replicate to HV-NTE1. You use PowerShell.

        Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Vous disposez de deux hôtes Hyper-V autonomes qui exécutent Windows Server 2025 : **HV-NTE1** à Nantes et **HV-BDX1** à Bordeaux. Une machine virtuelle nommée **CRM1** s'exécute sur HV-NTE1 et est répliquée vers HV-BDX1 avec Hyper-V Réplica.

        Une maintenance électrique est prévue demain à Nantes. Vous devez exécuter CRM1 sur HV-BDX1 pendant la maintenance sans perdre aucune donnée. Les modifications apportées à CRM1 sur HV-BDX1 doivent ensuite être répliquées vers HV-NTE1. Vous utilisez PowerShell.

        Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et classez-les dans l'ordre correct.
    body:
      count: 5
      actions:
        - { id: failover, text: { en: "On HV-BDX1, run Start-VMFailover -VMName CRM1.", fr: "Sur HV-BDX1, exécuter Start-VMFailover -VMName CRM1." } }
        - { id: astest, text: { en: "On HV-BDX1, run Start-VMFailover -VMName CRM1 -AsTest.", fr: "Sur HV-BDX1, exécuter Start-VMFailover -VMName CRM1 -AsTest." } }
        - { id: stop, text: { en: "On HV-NTE1, run Stop-VM -Name CRM1.", fr: "Sur HV-NTE1, exécuter Stop-VM -Name CRM1." } }
        - { id: start, text: { en: "On HV-BDX1, run Start-VM -Name CRM1.", fr: "Sur HV-BDX1, exécuter Start-VM -Name CRM1." } }
        - { id: asreplica, text: { en: "On HV-NTE1, run Set-VMReplication -VMName CRM1 -AsReplica.", fr: "Sur HV-NTE1, exécuter Set-VMReplication -VMName CRM1 -AsReplica." } }
        - { id: prepare, text: { en: "On HV-NTE1, run Start-VMFailover -VMName CRM1 -Prepare.", fr: "Sur HV-NTE1, exécuter Start-VMFailover -VMName CRM1 -Prepare." } }
        - { id: reverse, text: { en: "On HV-BDX1, run Set-VMReplication -VMName CRM1 -Reverse.", fr: "Sur HV-BDX1, exécuter Set-VMReplication -VMName CRM1 -Reverse." } }
        - { id: complete, text: { en: "On HV-BDX1, run Complete-VMFailover -VMName CRM1.", fr: "Sur HV-BDX1, exécuter Complete-VMFailover -VMName CRM1." } }
    answer:
      sequence: [stop, prepare, failover, reverse, start]
    explanation:
      correct:
        en: |
          A planned failover starts on the primary: you shut down the primary VM, then `Start-VMFailover -Prepare` replicates the pending changes. On the replica host, `Start-VMFailover` fails the VM over, `Set-VMReplication -Reverse` reverses the replication direction toward HV-NTE1, and `Start-VM` starts CRM1. Because the primary is shut down and prepared, no data is lost.
        fr: |
          Un basculement planifié commence sur le serveur principal : vous arrêtez la machine virtuelle principale, puis `Start-VMFailover -Prepare` réplique les modifications en attente. Sur l'hôte de réplica, `Start-VMFailover` bascule la machine virtuelle, `Set-VMReplication -Reverse` inverse le sens de réplication vers HV-NTE1, et `Start-VM` démarre CRM1. Comme la machine virtuelle principale est arrêtée et préparée, aucune donnée n'est perdue.
      options:
        astest: { en: "-AsTest creates an isolated test VM and leaves CRM1 running on HV-NTE1; it doesn't move the workload.", fr: "-AsTest crée une machine virtuelle de test isolée et laisse CRM1 s'exécuter sur HV-NTE1 ; il ne déplace pas la charge de travail." }
        asreplica: { en: "-AsReplica prepares the old primary after an unplanned failover; in a planned failover, -Reverse reconfigures the replication.", fr: "-AsReplica prépare l'ancien serveur principal après un basculement non planifié ; dans un basculement planifié, -Reverse reconfigure la réplication." }
        complete: { en: "Complete-VMFailover merges the recovery points after an unplanned failover; it isn't part of the planned failover steps.", fr: "Complete-VMFailover fusionne les points de récupération après un basculement non planifié ; il ne fait pas partie des étapes du basculement planifié." }
    references:
      - title: Fail over a virtual machine with Hyper-V Replica
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/replication-failover

  # ------------------------------------------------------------------ 7
  - id: az802-qz-32-07
    objective: "3.1.9"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware has two standalone Hyper-V hosts named **HV21** and **HV22** in the litware.com domain. Last weekend, both hosts were upgraded from Windows Server 2022 to Windows Server 2025. The virtual machines are stored on local volumes of the hosts.

        Before the upgrade, administrators signed in to the source host and live migrated virtual machines, with their storage, by using the default authentication protocol. Since the upgrade, every live migration fails during authentication.

        You need to start live migrations between HV21 and HV22, including the storage of the virtual machines, from a management workstation named **ADMIN1** without signing in to the hosts.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose de deux hôtes Hyper-V autonomes nommés **HV21** et **HV22** dans le domaine litware.com. Le week-end dernier, les deux hôtes ont été mis à niveau de Windows Server 2022 vers Windows Server 2025. Les machines virtuelles sont stockées sur des volumes locaux des hôtes.

        Avant la mise à niveau, les administrateurs se connectaient à l'hôte source et migraient dynamiquement les machines virtuelles, avec leur stockage, en utilisant le protocole d'authentification par défaut. Depuis la mise à niveau, chaque migration dynamique échoue lors de l'authentification.

        Vous devez lancer les migrations dynamiques entre HV21 et HV22, stockage des machines virtuelles compris, depuis un poste d'administration nommé **ADMIN1** sans vous connecter aux hôtes.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "On both hosts, turn off Credential Guard so that live migrations can use CredSSP authentication again.", fr: "Sur les deux hôtes, désactiver Credential Guard pour que les migrations dynamiques puissent de nouveau utiliser l'authentification CredSSP." } }
        - { id: b, text: { en: "On both hosts, run Set-VMHost -VirtualMachineMigrationAuthenticationType Kerberos.", fr: "Sur les deux hôtes, exécuter Set-VMHost -VirtualMachineMigrationAuthenticationType Kerberos." } }
        - { id: c, text: { en: "On both hosts, run Set-VMHost -VirtualMachineMigrationPerformanceOption SMB so that migrations use SMB.", fr: "Sur les deux hôtes, exécuter Set-VMHost -VirtualMachineMigrationPerformanceOption SMB pour que les migrations utilisent SMB." } }
        - { id: d, text: { en: "Configure constrained delegation between the hosts for the cifs and Microsoft Virtual System Migration Service services.", fr: "Configurer une délégation contrainte entre les hôtes pour les services cifs et Microsoft Virtual System Migration Service." } }
        - { id: e, text: { en: "On ADMIN1, add your account to the local Hyper-V Administrators group, and then sign in again.", fr: "Sur ADMIN1, ajouter votre compte au groupe local Hyper-V Administrators, puis vous reconnecter." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Windows Server 2025 enables Credential Guard by default on domain-joined servers that aren't domain controllers, which breaks CredSSP-based live migration, the default up to Windows Server 2022. Kerberos is the protocol that lets you start a migration without signing in to the source host. It requires constrained delegation on each host's computer account, with cifs for the storage and Microsoft Virtual System Migration Service for the virtual machine, and Kerberos selected as the authentication protocol on both hosts.
        fr: |
          Windows Server 2025 active par défaut Credential Guard sur les serveurs joints à un domaine qui ne sont pas contrôleurs de domaine, ce qui casse la migration dynamique basée sur CredSSP, la valeur par défaut jusqu'à Windows Server 2022. Kerberos est le protocole qui permet de lancer une migration sans se connecter à l'hôte source. Il exige une délégation contrainte sur le compte d'ordinateur de chaque hôte, avec cifs pour le stockage et Microsoft Virtual System Migration Service pour la machine virtuelle, et Kerberos choisi comme protocole d'authentification sur les deux hôtes.
      options:
        a: { en: "Even if it worked again, CredSSP requires you to sign in to the source host, which the requirement forbids.", fr: "Même s'il fonctionnait de nouveau, CredSSP exige de se connecter à l'hôte source, ce que l'exigence interdit." }
        c: { en: "The performance option only changes how memory is copied; it doesn't fix authentication.", fr: "L'option de performances ne change que la façon dont la mémoire est copiée ; elle ne corrige pas l'authentification." }
        e: { en: "The migration rights are needed on the hosts, not on ADMIN1, and group membership doesn't solve the authentication failure.", fr: "Les droits de migration sont nécessaires sur les hôtes, pas sur ADMIN1, et l'appartenance à un groupe ne résout pas l'échec d'authentification." }
    references:
      - title: Set up hosts for live migration without Failover Clustering
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/deploy/set-up-hosts-for-live-migration-without-failover-clustering

  # ------------------------------------------------------------------ 8
  - id: az802-qz-32-08
    objective: "3.1.10"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has a Hyper-V failover cluster named **HVCLU1** whose nodes run Windows Server 2025. Two virtual machines on HVCLU1, **SQLN1** and **SQLN2**, form a guest cluster. They share a disk named `Data.vhdx` that is stored on a Cluster Shared Volume and attached to both virtual machines as a shared VHDX.

        You need to replicate SQLN1, SQLN2 and their shared disk by using Hyper-V Replica. The shared disk must also be included in application-consistent checkpoints of the guest cluster. The guest cluster can be offline during tonight's maintenance window.

        What should you do?
      fr: |
        Contoso dispose d'un cluster de basculement Hyper-V nommé **HVCLU1** dont les nœuds exécutent Windows Server 2025. Deux machines virtuelles de HVCLU1, **SQLN1** et **SQLN2**, forment un cluster invité. Elles partagent un disque nommé `Data.vhdx`, stocké sur un volume partagé de cluster et attaché aux deux machines virtuelles comme VHDX partagé.

        Vous devez répliquer SQLN1, SQLN2 et leur disque partagé avec Hyper-V Réplica. Le disque partagé doit aussi être inclus dans les points de contrôle cohérents avec les applications du cluster invité. Le cluster invité peut être hors connexion pendant la fenêtre de maintenance de ce soir.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep both virtual machines running, run Convert-VHD to create Data.vhds from Data.vhdx, and then attach Data.vhds to both of them.", fr: "Laisser les deux machines virtuelles en cours d'exécution, exécuter Convert-VHD pour créer Data.vhds à partir de Data.vhdx, puis attacher Data.vhds aux deux." } }
        - { id: b, text: { en: "Shut down both virtual machines, remove Data.vhdx from them, run Optimize-VHD on Data.vhdx, and then add Data.vhdx back to both of them.", fr: "Arrêter les deux machines virtuelles, leur retirer Data.vhdx, exécuter Optimize-VHD sur Data.vhdx, puis rajouter Data.vhdx aux deux." } }
        - { id: c, text: { en: "Shut down both virtual machines, remove Data.vhdx from them, run Convert-VHD to create Data.vhds from Data.vhdx, and then add Data.vhds to both of them.", fr: "Arrêter les deux machines virtuelles, leur retirer Data.vhdx, exécuter Convert-VHD pour créer Data.vhds à partir de Data.vhdx, puis ajouter Data.vhds aux deux." } }
        - { id: d, text: { en: "Shut down both virtual machines, run Convert-VHD to create a fixed-size Data2.vhdx from Data.vhdx, and then add Data2.vhdx to both of them.", fr: "Arrêter les deux machines virtuelles, exécuter Convert-VHD pour créer un disque Data2.vhdx de taille fixe à partir de Data.vhdx, puis ajouter Data2.vhdx aux deux." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A VHD Set (`.vhds`) is the shared virtual disk model for guest clusters that supports Hyper-V Replica and application-consistent checkpoints. Migrating a shared VHDX to a VHD Set requires taking the virtual machines offline: you remove the VHDX from them, convert it with `Convert-VHD existing.vhdx new.vhds`, and add the VHD Set back.
        fr: |
          Un VHD Set (`.vhds`) est le modèle de disque virtuel partagé des clusters invités qui prend en charge Hyper-V Réplica et les points de contrôle cohérents avec les applications. Migrer un VHDX partagé vers un VHD Set exige de mettre les machines virtuelles hors connexion : vous leur retirez le VHDX, le convertissez avec `Convert-VHD existing.vhdx new.vhds`, puis rajoutez le VHD Set.
      options:
        a: { en: "Conversion is an offline operation: Convert-VHD requires the disk not to be attached, and the migration requires the VMs offline.", fr: "La conversion est une opération hors connexion : Convert-VHD exige que le disque ne soit pas attaché, et la migration exige que les machines virtuelles soient hors connexion." }
        b: { en: "Optimize-VHD only compacts a dynamic disk; Data.vhdx stays a shared VHDX instead of becoming a VHD Set.", fr: "Optimize-VHD ne fait que compacter un disque dynamique ; Data.vhdx reste un VHDX partagé au lieu de devenir un VHD Set." }
        d: { en: "Changing the type to fixed size keeps the .vhdx format: the disk would still be a shared VHDX, not a VHD Set.", fr: "Passer en taille fixe conserve le format .vhdx : le disque resterait un VHDX partagé, pas un VHD Set." }
    references:
      - title: Create Hyper-V VHD Set files
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/manage/create-vhdset-file
      - title: Convert-VHD (Hyper-V)
        url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/convert-vhd

  # ------------------------------------------------------------------ 9
  - id: az802-qz-32-09
    objective: "3.1.13"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        You have a Hyper-V host named **HV8** that runs Windows Server 2025 and has internet access through its physical adapter. HV8 hosts the following lab networks:

        | Internal virtual switch | Host interface | NAT network |
        | --- | --- | --- |
        | NatSw | vEthernet (NatSw), 192.168.50.1/24 | LabNat, internal prefix 192.168.50.0/24 |
        | NatSw2 | vEthernet (NatSw2), 192.168.60.1/24 | None |

        The virtual machines on NatSw reach the internet. To give the same access to the virtual machines on NatSw2, you run `New-NetNat -Name LabNat2 -InternalIPInterfaceAddressPrefix 192.168.60.0/24`, and the command fails.

        You need the virtual machines on both switches to reach the internet through NAT. The virtual machines must keep their IP addresses, and none of them can be connected to the physical network.

        What should you do?
      fr: |
        Vous disposez d'un hôte Hyper-V nommé **HV8** qui exécute Windows Server 2025 et accède à Internet par sa carte physique. HV8 héberge les réseaux de labo suivants :

        | Commutateur virtuel interne | Interface de l'hôte | Réseau NAT |
        | --- | --- | --- |
        | NatSw | vEthernet (NatSw), 192.168.50.1/24 | LabNat, préfixe interne 192.168.50.0/24 |
        | NatSw2 | vEthernet (NatSw2), 192.168.60.1/24 | Aucun |

        Les machines virtuelles de NatSw accèdent à Internet. Pour donner le même accès aux machines virtuelles de NatSw2, vous exécutez `New-NetNat -Name LabNat2 -InternalIPInterfaceAddressPrefix 192.168.60.0/24`, et la commande échoue.

        Vous devez faire en sorte que les machines virtuelles des deux commutateurs accèdent à Internet par NAT. Les machines virtuelles doivent conserver leurs adresses IP, et aucune ne peut être connectée au réseau physique.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run New-NetNat -Name LabNat2 again, with -ExternalIPInterfaceAddressPrefix 192.168.60.0/24 instead of the internal prefix.", fr: "Exécuter de nouveau New-NetNat -Name LabNat2, avec -ExternalIPInterfaceAddressPrefix 192.168.60.0/24 au lieu du préfixe interne." } }
        - { id: b, text: { en: "Remove LabNat, and then run New-NetNat to create one NAT network whose internal prefix is 192.168.0.0/16.", fr: "Supprimer LabNat, puis exécuter New-NetNat pour créer un seul réseau NAT dont le préfixe interne est 192.168.0.0/16." } }
        - { id: c, text: { en: "Run Add-NetNatStaticMapping on LabNat to add the 192.168.60.0/24 prefix to the existing NAT network.", fr: "Exécuter Add-NetNatStaticMapping sur LabNat pour ajouter le préfixe 192.168.60.0/24 au réseau NAT existant." } }
        - { id: d, text: { en: "Change NatSw2 to a private virtual switch, and then run the same New-NetNat command again for LabNat2.", fr: "Transformer NatSw2 en commutateur virtuel privé, puis exécuter de nouveau la même commande New-NetNat pour LabNat2." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A host is limited to one NAT network, so LabNat2 can't be created next to LabNat. Several internal switches can share a single NAT network if its internal prefix is large enough to encompass all their address ranges: 192.168.0.0/16 contains both 192.168.50.0/24 and 192.168.60.0/24, so no virtual machine has to change its address.
        fr: |
          Un hôte est limité à un seul réseau NAT : LabNat2 ne peut donc pas être créé à côté de LabNat. Plusieurs commutateurs internes peuvent partager un seul réseau NAT si son préfixe interne est assez large pour englober toutes leurs plages d'adresses : 192.168.0.0/16 contient 192.168.50.0/24 et 192.168.60.0/24, donc aucune machine virtuelle n'a à changer d'adresse.
      options:
        a: { en: "The failure comes from the one-NAT-per-host limit, not from the parameter; a second NAT network still can't be created.", fr: "L'échec vient de la limite d'un réseau NAT par hôte, pas du paramètre ; un second réseau NAT ne peut toujours pas être créé." }
        c: { en: "A static mapping forwards an external port to one internal address; it doesn't add a prefix to the NAT network.", fr: "Un mappage statique redirige un port externe vers une adresse interne ; il n'ajoute pas de préfixe au réseau NAT." }
        d: { en: "A private switch has no host interface, so the host can't route its traffic, and the second NAT network still can't be created.", fr: "Un commutateur privé n'a pas d'interface sur l'hôte : l'hôte ne peut pas router son trafic, et le second réseau NAT ne peut toujours pas être créé." }
    references:
      - title: Set up a NAT network
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/setup-nat-network

  # ------------------------------------------------------------------ 10
  - id: az802-qz-32-10
    objective: "3.1.14"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum has two standalone Hyper-V hosts that run Windows Server 2025: **HV-A** in Lille, on the 10.10.0.0/16 network, and **HV-B** in Lyon, on the 10.20.0.0/16 network. A generation 1 virtual machine named **ERP1** runs Windows Server 2022 on HV-A and uses the static IP address 10.10.0.25. The only network adapter of ERP1 is a legacy network adapter, kept since ERP1 was deployed by PXE boot.

        You plan to replicate ERP1 to HV-B by using Hyper-V Replica. Replication isn't enabled yet. After any failover to HV-B, ERP1 must start with the IP address 10.20.0.25 automatically, without anyone signing in to ERP1.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose de deux hôtes Hyper-V autonomes qui exécutent Windows Server 2025 : **HV-A** à Lille, sur le réseau 10.10.0.0/16, et **HV-B** à Lyon, sur le réseau 10.20.0.0/16. Une machine virtuelle de génération 1 nommée **ERP1** exécute Windows Server 2022 sur HV-A et utilise l'adresse IP statique 10.10.0.25. La seule carte réseau d'ERP1 est une carte réseau héritée, conservée depuis le déploiement d'ERP1 par démarrage PXE.

        Vous prévoyez de répliquer ERP1 vers HV-B avec Hyper-V Réplica. La réplication n'est pas encore activée. Après tout basculement vers HV-B, ERP1 doit démarrer automatiquement avec l'adresse IP 10.20.0.25, sans que personne ne se connecte à ERP1.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Before you enable replication, enable the Guest Service Interface integration service of ERP1.", fr: "Avant d'activer la réplication, activer le service d'intégration Guest Service Interface d'ERP1." } }
        - { id: b, text: { en: "Before you enable replication, replace the legacy network adapter of ERP1 with a synthetic network adapter.", fr: "Avant d'activer la réplication, remplacer la carte réseau héritée d'ERP1 par une carte réseau synthétique." } }
        - { id: c, text: { en: "Before you enable replication, set a static MAC address on the network adapter of ERP1.", fr: "Avant d'activer la réplication, définir une adresse MAC statique sur la carte réseau d'ERP1." } }
        - { id: d, text: { en: "After you enable replication, run Set-VMNetworkAdapter -TestReplicaSwitchName for the replica virtual machine on HV-B.", fr: "Après avoir activé la réplication, exécuter Set-VMNetworkAdapter -TestReplicaSwitchName pour la machine virtuelle de réplica sur HV-B." } }
        - { id: e, text: { en: "After you enable replication, run Set-VMNetworkAdapterFailoverConfiguration for the replica virtual machine on HV-B.", fr: "Après avoir activé la réplication, exécuter Set-VMNetworkAdapterFailoverConfiguration pour la machine virtuelle de réplica sur HV-B." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          Static IP injection sets the address that a VM uses when it starts after a failover. You configure it on the replica VM after replication is enabled, with the Failover TCP/IP settings or `Set-VMNetworkAdapterFailoverConfiguration`, and the Key-Value Pair Exchange integration component applies it in the guest. Static IP injection requires synthetic network adapters, not legacy ones, so the legacy adapter of ERP1 must be replaced first.
        fr: |
          L'injection d'adresse IP statique définit l'adresse qu'une machine virtuelle utilise quand elle démarre après un basculement. Vous la configurez sur la machine virtuelle de réplica après l'activation de la réplication, avec les paramètres Failover TCP/IP ou `Set-VMNetworkAdapterFailoverConfiguration`, et le composant d'intégration Key-Value Pair Exchange l'applique dans l'invité. L'injection d'adresse IP statique exige des cartes réseau synthétiques, pas des cartes héritées : la carte héritée d'ERP1 doit donc d'abord être remplacée.
      options:
        a: { en: "Guest Service Interface copies files from the host into the guest; static IP injection uses Key-Value Pair Exchange.", fr: "Guest Service Interface copie des fichiers de l'hôte vers l'invité ; l'injection d'adresse IP statique utilise Key-Value Pair Exchange." }
        c: { en: "A static MAC address doesn't change the IP address that the guest uses after the failover.", fr: "Une adresse MAC statique ne change pas l'adresse IP que l'invité utilise après le basculement." }
        d: { en: "TestReplicaSwitchName only chooses the virtual switch of the test VM created by a test failover; it sets no IP address.", fr: "TestReplicaSwitchName ne choisit que le commutateur virtuel de la machine virtuelle de test créée par un test de basculement ; il ne définit aucune adresse IP." }
    references:
      - title: Replicate a virtual machine with Hyper-V Replica
        url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/replication-virtual-machines
      - title: Set-VMNetworkAdapterFailoverConfiguration (Hyper-V)
        url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vmnetworkadapterfailoverconfiguration
