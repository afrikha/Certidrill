chapter: 12-sites-domains-forests
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-12-01
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You add a child domain named **eu.contoso.com** to the existing **contoso.com** forest by promoting a new server with `Install-ADDSDomain`. No trust is created manually.

        Which trust exists between eu.contoso.com and contoso.com after the promotion?
      fr: |
        Vous ajoutez un domaine enfant nommé **eu.contoso.com** à la forêt existante **contoso.com** en promouvant un nouveau serveur avec `Install-ADDSDomain`. Aucune approbation n'est créée manuellement.

        Quelle approbation existe entre eu.contoso.com et contoso.com après la promotion ?
    body:
      options:
        - { id: a, text: { en: "A one-way, nontransitive external trust in which contoso.com trusts eu.contoso.com", fr: "Une approbation externe unidirectionnelle et non transitive dans laquelle contoso.com approuve eu.contoso.com" } }
        - { id: b, text: { en: "A two-way, transitive shortcut trust that you must validate before it can be used", fr: "Une approbation raccourcie bidirectionnelle et transitive que vous devez valider avant de pouvoir l'utiliser" } }
        - { id: c, text: { en: "A two-way, transitive parent-child trust that is created automatically", fr: "Une approbation parent-enfant bidirectionnelle et transitive, créée automatiquement" } }
        - { id: d, text: { en: "A one-way forest trust in which eu.contoso.com trusts contoso.com", fr: "Une approbation de forêt unidirectionnelle dans laquelle eu.contoso.com approuve contoso.com" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Each time a domain is added to a forest, a two-way, transitive trust is created automatically between the new domain and its parent. Because these trusts are transitive, every domain of the forest trusts every other domain without any manual trust.
        fr: |
          Chaque fois qu'un domaine est ajouté à une forêt, une approbation bidirectionnelle et transitive est créée automatiquement entre le nouveau domaine et son parent. Ces approbations étant transitives, chaque domaine de la forêt approuve tous les autres sans aucune approbation manuelle.
      options:
        a: { en: "External trusts are created manually, between a domain and a domain of another forest.", fr: "Les approbations externes se créent manuellement, entre un domaine et un domaine d'une autre forêt." }
        b: { en: "Shortcut trusts are created manually to shorten the trust path between two domains of the same forest; the parent-child trust is automatic.", fr: "Les approbations raccourcies se créent manuellement pour raccourcir le chemin d'approbation entre deux domaines de la même forêt ; l'approbation parent-enfant est automatique." }
        d: { en: "A forest trust links the forest root domains of two different forests; it never links two domains of the same forest.", fr: "Une approbation de forêt relie les domaines racines de deux forêts différentes ; elle ne relie jamais deux domaines de la même forêt." }
    references:
      - title: How trust relationships work for forests in Active Directory
        url: https://learn.microsoft.com/en-us/entra/identity/domain-services/concepts-forest-trust

  # ------------------------------------------------------------------ 2
  - id: az802-qz-12-02
    objective: "1.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        In the **corp.fabrikam.com** domain, you open Active Directory Sites and Services. Under the NTDS Settings object of each domain controller, you see connection objects from replication partners of the same site, marked **automatically generated**. No administrator created them.

        Which component created these connection objects?
      fr: |
        Dans le domaine **corp.fabrikam.com**, vous ouvrez Sites et services Active Directory. Sous l'objet NTDS Settings de chaque contrôleur de domaine, vous voyez des objets de connexion provenant de partenaires de réplication du même site, marqués **automatically generated**. Aucun administrateur ne les a créés.

        Quel composant a créé ces objets de connexion ?
    body:
      options:
        - { id: a, text: { en: "The bridgehead servers of the site", fr: "Les serveurs tête de pont du site" } }
        - { id: b, text: { en: "The PDC emulator of the domain", fr: "L'émulateur PDC du domaine" } }
        - { id: c, text: { en: "The site link bridge of the IP transport", fr: "Le pont de liens de sites du transport IP" } }
        - { id: d, text: { en: "The Knowledge Consistency Checker (KCC)", fr: "Le vérificateur de cohérence des connaissances (KCC)" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The KCC is a built-in process that runs on every domain controller and generates the replication topology. On each domain controller, it creates inbound connection objects from its replication partners, shown as automatically generated in Active Directory Sites and Services.
        fr: |
          Le KCC est un processus intégré qui s'exécute sur chaque contrôleur de domaine et génère la topologie de réplication. Sur chaque contrôleur de domaine, il crée des objets de connexion entrants depuis ses partenaires de réplication, affichés comme automatically generated dans Sites et services Active Directory.
      options:
        a: { en: "Bridgehead servers are the domain controllers that replicate between sites; they don't create the intrasite connection objects.", fr: "Les serveurs tête de pont sont les contrôleurs de domaine qui répliquent entre sites ; ils ne créent pas les objets de connexion intrasite." }
        b: { en: "The PDC emulator handles password changes, lockouts and time; it plays no part in building the replication topology.", fr: "L'émulateur PDC gère les changements de mot de passe, les verrouillages et l'heure ; il ne joue aucun rôle dans la construction de la topologie de réplication." }
        c: { en: "A site link bridge is an object that groups site links for intersite routing; it doesn't create connection objects.", fr: "Un pont de liens de sites est un objet qui regroupe des liens de sites pour le routage intersite ; il ne crée pas d'objets de connexion." }
    references:
      - title: Active Directory Replication Concepts
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/replication/active-directory-replication-concepts

  # ------------------------------------------------------------------ 3
  - id: az802-qz-12-03
    objective: "1.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The **corp.contoso.com** domain has two sites. The **Paris** site is associated with the subnet 10.10.0.0/16 and contains DC1 and DC2. The **Lyon** site is associated with the subnet 10.8.0.0/22 and contains DC5 and DC6.

        Contoso opens a second building in Lyon, connected to the first one by a fast LAN link. Its computers use the range 10.8.40.0/22. Users in the new building report that they authenticate against DC1 or DC2 in Paris.

        You need to ensure that computers in the new building use the Lyon domain controllers. What should you run?
      fr: |
        Le domaine **corp.contoso.com** possède deux sites. Le site **Paris** est associé au sous-réseau 10.10.0.0/16 et contient DC1 et DC2. Le site **Lyon** est associé au sous-réseau 10.8.0.0/22 et contient DC5 et DC6.

        Contoso ouvre un second bâtiment à Lyon, relié au premier par une liaison LAN rapide. Ses ordinateurs utilisent la plage 10.8.40.0/22. Les utilisateurs du nouveau bâtiment signalent qu'ils s'authentifient auprès de DC1 ou de DC2 à Paris.

        Vous devez faire en sorte que les ordinateurs du nouveau bâtiment utilisent les contrôleurs de domaine de Lyon. Que devez-vous exécuter ?
    body:
      options:
        - { id: a, text: "`Set-ADReplicationSiteLink -Identity \"PAR-LYS\" -Cost 50`" }
        - { id: b, text: "`New-ADReplicationSubnet -Name \"10.8.40.0/22\" -Site \"Lyon\"`" }
        - { id: c, text: "`Get-ADDomainController -Identity DC5 | Move-ADDirectoryServer -Site \"Lyon\"`" }
        - { id: d, text: "`New-ADReplicationSite -Name \"Lyon-B2\"`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A computer belongs to the site of the subnet object that contains its IP address. No subnet object contains 10.8.40.0/22, so the computers of the new building have no site and can use any domain controller. Associating the range with the Lyon site makes them find DC5 and DC6 first.
        fr: |
          Un ordinateur appartient au site de l'objet sous-réseau qui contient son adresse IP. Aucun objet sous-réseau ne contient 10.8.40.0/22 : les ordinateurs du nouveau bâtiment n'ont donc pas de site et peuvent utiliser n'importe quel contrôleur de domaine. Associer la plage au site Lyon leur fait trouver d'abord DC5 et DC6.
      options:
        a: { en: "The site link cost drives replication and the choice between remote sites; it doesn't give the new range a site.", fr: "Le coût du lien de sites pilote la réplication et le choix entre sites distants ; il ne donne pas de site à la nouvelle plage." }
        c: { en: "DC5 is already in the Lyon site; moving server objects doesn't map the clients' range to a site.", fr: "DC5 est déjà dans le site Lyon ; déplacer des objets serveur n'associe pas la plage des clients à un site." }
        d: { en: "A new site with no subnet and no domain controller doesn't change where the clients of 10.8.40.0/22 authenticate.", fr: "Un nouveau site sans sous-réseau ni contrôleur de domaine ne change pas l'endroit où les clients de 10.8.40.0/22 s'authentifient." }
    references:
      - title: Active Directory Replication Concepts
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/replication/active-directory-replication-concepts

  # ------------------------------------------------------------------ 4
  - id: az802-qz-12-04
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The **corp.contoso.com** domain has two sites, **Paris** and **Lyon**, connected by a site link named **PAR-LYS** whose settings are all at their default values. At 09:00, an administrator changed the description of a group on DC1 in Paris. At 09:01, the change was visible on DC2, also in Paris. At 10:00, it isn't visible yet on DC5 in Lyon. `repadmin /showrepl DC5` shows that the last inbound replication from Paris succeeded at 08:10.

        What explains why the change isn't on DC5 yet?
      fr: |
        Le domaine **corp.contoso.com** possède deux sites, **Paris** et **Lyon**, reliés par un lien de sites nommé **PAR-LYS** dont tous les paramètres ont leur valeur par défaut. À 09:00, un administrateur a modifié la description d'un groupe sur DC1 à Paris. À 09:01, la modification était visible sur DC2, également à Paris. À 10:00, elle n'est pas encore visible sur DC5 à Lyon. `repadmin /showrepl DC5` montre que la dernière réplication entrante depuis Paris a réussi à 08:10.

        Qu'est-ce qui explique que la modification ne soit pas encore sur DC5 ?
    body:
      options:
        - { id: a, text: { en: "Change notification delays each partner by 15 seconds, and DC5 is the last partner of the replication ring of the domain.", fr: "La notification de modification retarde chaque partenaire de 15 secondes, et DC5 est le dernier partenaire de l'anneau de réplication du domaine." } }
        - { id: b, text: { en: "Replication between sites follows the interval of PAR-LYS, 180 minutes by default, so DC5 receives the change at the next cycle.", fr: "La réplication entre sites suit l'intervalle de PAR-LYS, 180 minutes par défaut : DC5 reçoit donc la modification au prochain cycle." } }
        - { id: c, text: { en: "Changes to groups replicate between sites only through the global catalog servers, and none of them is in Lyon.", fr: "Les modifications de groupes ne se répliquent entre sites que par les serveurs de catalogue global, et aucun ne se trouve à Lyon." } }
        - { id: d, text: { en: "The KCC removed the connection between DC5 and Paris because Bridge all site links is enabled on the IP transport.", fr: "Le KCC a supprimé la connexion entre DC5 et Paris parce que Bridge all site links est activé sur le transport IP." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Inside a site, domain controllers notify their partners within seconds of a change, which is why DC2 had it at 09:01. Between sites, bridgehead servers replicate on the schedule and interval of the site link, 180 minutes by default and without change notification. The last successful cycle was at 08:10, so the next one is expected around 11:10: nothing is broken.
        fr: |
          Dans un site, les contrôleurs de domaine préviennent leurs partenaires quelques secondes après une modification, d'où sa présence sur DC2 à 09:01. Entre sites, les serveurs tête de pont répliquent selon la planification et l'intervalle du lien de sites, 180 minutes par défaut et sans notification de modification. Le dernier cycle réussi date de 08:10 : le suivant est donc attendu vers 11:10, et rien n'est en panne.
      options:
        a: { en: "Change notification is used inside a site only by default; between sites, the site link interval applies.", fr: "Par défaut, la notification de modification ne s'utilise qu'à l'intérieur d'un site ; entre sites, c'est l'intervalle du lien de sites qui s'applique." }
        c: { en: "The domain partition replicates between sites through bridgehead servers, which are domain controllers of the domain, whether or not they are global catalog servers.", fr: "La partition de domaine se réplique entre sites par les serveurs tête de pont, qui sont des contrôleurs de domaine du domaine, qu'ils soient ou non serveurs de catalogue global." }
        d: { en: "Bridging all site links only makes site links transitive, and repadmin shows that inbound replication from Paris works.", fr: "Établir un pont entre tous les liens de sites rend seulement les liens transitifs, et repadmin montre que la réplication entrante depuis Paris fonctionne." }
    references:
      - title: Set-ADReplicationSiteLink (ActiveDirectory)
        url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/set-adreplicationsitelink
      - title: Active Directory Replication Concepts
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/replication/active-directory-replication-concepts

  # ------------------------------------------------------------------ 5
  - id: az802-qz-12-05
    objective: "1.2.1"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Users of every domain of the **litware.com** forest must be able to access resources in every domain of the **fabrikam.com** forest. Fabrikam users must not be able to access Litware resources. Name resolution between the two forests is already configured.

        You are a member of Enterprise Admins in fabrikam.com and have no account in litware.com. A Litware administrator will create the litware.com side of the trust later. You start the New Trust Wizard in Active Directory Domains and Trusts on the fabrikam.com domain.

        How should you complete the wizard? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Les utilisateurs de chaque domaine de la forêt **litware.com** doivent pouvoir accéder aux ressources de chaque domaine de la forêt **fabrikam.com**. Les utilisateurs de Fabrikam ne doivent pas pouvoir accéder aux ressources de Litware. La résolution de noms entre les deux forêts est déjà configurée.

        Vous êtes membre d'Enterprise Admins dans fabrikam.com et n'avez aucun compte dans litware.com. Un administrateur de Litware créera plus tard le côté litware.com de l'approbation. Vous lancez l'Assistant Nouvelle approbation dans Domaines et approbations Active Directory sur le domaine fabrikam.com.

        Comment devez-vous compléter l'assistant ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Trust type: [[type]]

          Direction of trust: [[dir]]

          Sides of trust: [[sides]]
        fr: |
          Type d'approbation : [[type]]

          Sens de l'approbation : [[dir]]

          Côtés de l'approbation : [[sides]]
      slots:
        - id: type
          options:
            - { id: external, text: { en: "External trust", fr: "Approbation externe" } }
            - { id: forest, text: { en: "Forest trust", fr: "Approbation de forêt" } }
            - { id: shortcut, text: { en: "Shortcut trust", fr: "Approbation raccourcie" } }
            - { id: realm, text: { en: "Realm trust", fr: "Approbation de domaine Kerberos (realm)" } }
        - id: dir
          options:
            - { id: twoway, text: "Two-way" }
            - { id: incoming, text: "One-way: incoming" }
            - { id: outgoing, text: "One-way: outgoing" }
        - id: sides
          options:
            - { id: both, text: "Both this domain and the specified domain" }
            - { id: this, text: "This domain only" }
    answer:
      values: { type: forest, dir: outgoing, sides: this }
    explanation:
      correct:
        en: |
          Access to every domain of both forests calls for a forest trust between the forest root domains. Fabrikam holds the resources, so it is the trusting side: from fabrikam.com, the trust is one-way outgoing, and Litware users are authenticated in Fabrikam. Without credentials in litware.com, you create this side only with a trust password; the Litware administrator then creates the incoming side with the exact same password.
        fr: |
          L'accès à chaque domaine des deux forêts demande une approbation de forêt entre les domaines racines des forêts. Fabrikam détient les ressources : c'est donc le côté qui approuve. Depuis fabrikam.com, l'approbation est unidirectionnelle sortante, et les utilisateurs de Litware sont authentifiés dans Fabrikam. Sans informations d'identification dans litware.com, vous créez ce côté uniquement avec un mot de passe d'approbation ; l'administrateur de Litware crée ensuite le côté entrant avec exactement le même mot de passe.
      options:
        external: { en: "An external trust is nontransitive and links only two domains, not every domain of both forests.", fr: "Une approbation externe est non transitive et ne relie que deux domaines, pas tous les domaines des deux forêts." }
        twoway: { en: "A two-way trust would also let Fabrikam users access Litware resources.", fr: "Une approbation bidirectionnelle permettrait aussi aux utilisateurs de Fabrikam d'accéder aux ressources de Litware." }
        incoming: { en: "An incoming trust on fabrikam.com would make Fabrikam the trusted side: Fabrikam users would access Litware resources.", fr: "Une approbation entrante sur fabrikam.com ferait de Fabrikam le côté approuvé : les utilisateurs de Fabrikam accéderaient aux ressources de Litware." }
        both: { en: "Creating both sides at once requires administrative credentials in litware.com, which you don't have.", fr: "Créer les deux côtés en une fois exige des informations d'identification d'administration dans litware.com, que vous n'avez pas." }
    references:
      - title: Create a One-Way, Outgoing, Forest Trust for One Side of the Trust
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-r2-and-2008/cc794827(v=ws.10)
      - title: How trust relationships work for forests in Active Directory
        url: https://learn.microsoft.com/en-us/entra/identity/domain-services/concepts-forest-trust

  # ------------------------------------------------------------------ 6
  - id: az802-qz-12-06
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        The **corp.adatum.com** domain has four sites: HQ, Lille, Rennes and Nice. The four sites are members of the site link **DEFAULTIPSITELINK**, which keeps its default cost, interval and schedule. Lille and Rennes must keep replicating with HQ at any time of the day.

        The WAN link to Nice is saturated during business hours. An administrator ran the following command, where `$NightOnly` allows replication from 20:00 to 06:00 only:

        `New-ADReplicationSiteLink -Name "HQ-Nice" -SitesIncluded HQ,Nice -Cost 100 -ReplicationSchedule $NightOnly -InterSiteTransportProtocol IP`

        A week later, monitoring shows that the domain controllers in Nice still replicate with HQ during business hours.

        You need to ensure that replication between HQ and Nice happens only between 20:00 and 06:00. What should you do?
      fr: |
        Le domaine **corp.adatum.com** possède quatre sites : HQ, Lille, Rennes et Nice. Les quatre sites sont membres du lien de sites **DEFAULTIPSITELINK**, qui conserve son coût, son intervalle et sa planification par défaut. Lille et Rennes doivent continuer à se répliquer avec HQ à toute heure de la journée.

        La liaison WAN vers Nice est saturée pendant les heures de bureau. Un administrateur a exécuté la commande suivante, où `$NightOnly` n'autorise la réplication que de 20:00 à 06:00 :

        `New-ADReplicationSiteLink -Name "HQ-Nice" -SitesIncluded HQ,Nice -Cost 100 -ReplicationSchedule $NightOnly -InterSiteTransportProtocol IP`

        Une semaine plus tard, la supervision montre que les contrôleurs de domaine de Nice se répliquent toujours avec HQ pendant les heures de bureau.

        Vous devez faire en sorte que la réplication entre HQ et Nice n'ait lieu qu'entre 20:00 et 06:00. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run `Set-ADReplicationSiteLink -Identity \"DEFAULTIPSITELINK\" -ReplicationSchedule $NightOnly`.", fr: "Exécuter `Set-ADReplicationSiteLink -Identity \"DEFAULTIPSITELINK\" -ReplicationSchedule $NightOnly`." } }
        - { id: b, text: { en: "Clear **Bridge all site links** on the IP intersite transport.", fr: "Désactiver **Bridge all site links** sur le transport intersite IP." } }
        - { id: c, text: { en: "Run `repadmin /kcc` on each domain controller in Nice to rebuild its connections.", fr: "Exécuter `repadmin /kcc` sur chaque contrôleur de domaine de Nice pour reconstruire ses connexions." } }
        - { id: d, text: { en: "Run `Set-ADReplicationSiteLink -Identity \"DEFAULTIPSITELINK\" -SitesIncluded @{Remove=\"Nice\"}`.", fr: "Exécuter `Set-ADReplicationSiteLink -Identity \"DEFAULTIPSITELINK\" -SitesIncluded @{Remove=\"Nice\"}`." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Nice is still a member of DEFAULTIPSITELINK, which has the same cost as HQ-Nice and is available all day, so the KCC can keep replicating HQ and Nice through it. When you add a site to a new site link, you remove it from DEFAULTIPSITELINK. HQ-Nice then becomes the only link of Nice, and its night-only schedule applies.
        fr: |
          Nice est toujours membre de DEFAULTIPSITELINK, qui a le même coût qu'HQ-Nice et est disponible toute la journée : le KCC peut donc continuer à répliquer HQ et Nice par ce lien. Quand vous ajoutez un site à un nouveau lien de sites, vous le retirez de DEFAULTIPSITELINK. HQ-Nice devient alors le seul lien de Nice, et sa planification de nuit s'applique.
      options:
        a: { en: "The schedule of DEFAULTIPSITELINK also applies to Lille and Rennes, which must keep replicating with HQ during the day.", fr: "La planification de DEFAULTIPSITELINK s'applique aussi à Lille et à Rennes, qui doivent continuer à se répliquer avec HQ dans la journée." }
        b: { en: "Both site links connect HQ and Nice directly; disabling transitivity doesn't stop DEFAULTIPSITELINK from being used.", fr: "Les deux liens de sites relient directement HQ et Nice ; désactiver la transitivité n'empêche pas l'utilisation de DEFAULTIPSITELINK." }
        c: { en: "Recalculating the topology changes nothing while DEFAULTIPSITELINK still contains Nice; the KCC builds the same result.", fr: "Recalculer la topologie ne change rien tant que DEFAULTIPSITELINK contient Nice ; le KCC produit le même résultat." }
    references:
      - title: Set-ADReplicationSiteLink (ActiveDirectory)
        url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/set-adreplicationsitelink
      - title: Design sites, site links, and the replication topology
        url: https://learn.microsoft.com/en-us/training/modules/active-directory-site-replication/2-site-link-design

  # ------------------------------------------------------------------ 7
  - id: az802-qz-12-07
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have the following forests:

        - **contoso.com**, which contains the domains contoso.com and eu.contoso.com
        - **litware.com**, which contains only the litware.com domain
        - **fabrikam.com**, which contains the domains fabrikam.com and na.fabrikam.com

        The following trusts were created manually. All the other trusts are the default trusts of each forest.

        | Trust | Type | Trusting side | Trusted side |
        | --- | --- | --- | --- |
        | T1 | External, one-way | eu.contoso.com | litware.com |
        | T2 | Forest, one-way | litware.com | fabrikam.com |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez des forêts suivantes :

        - **contoso.com**, qui contient les domaines contoso.com et eu.contoso.com
        - **litware.com**, qui contient uniquement le domaine litware.com
        - **fabrikam.com**, qui contient les domaines fabrikam.com et na.fabrikam.com

        Les approbations suivantes ont été créées manuellement. Toutes les autres approbations sont les approbations par défaut de chaque forêt.

        | Approbation | Type | Côté qui approuve | Côté approuvé |
        | --- | --- | --- | --- |
        | T1 | Externe, unidirectionnelle | eu.contoso.com | litware.com |
        | T2 | Forêt, unidirectionnelle | litware.com | fabrikam.com |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Users of litware.com can be granted access to a shared folder on a member server of eu.contoso.com.", fr: "Les utilisateurs de litware.com peuvent obtenir l'accès à un dossier partagé d'un serveur membre d'eu.contoso.com." }
        - id: s2
          text: { en: "Users of litware.com can be granted access to a shared folder on a member server of contoso.com.", fr: "Les utilisateurs de litware.com peuvent obtenir l'accès à un dossier partagé d'un serveur membre de contoso.com." }
        - id: s3
          text: { en: "Users of na.fabrikam.com can be granted access to a shared folder on a member server of litware.com.", fr: "Les utilisateurs de na.fabrikam.com peuvent obtenir l'accès à un dossier partagé d'un serveur membre de litware.com." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Access flows against the trust: the trusting side holds the resources and the trusted side holds the accounts. T1 lets litware.com users access eu.contoso.com, but an external trust is nontransitive, so it doesn't extend to contoso.com through the parent-child trust. T2 is a forest trust: it is transitive between the domains of the two forests, so users of any fabrikam.com domain, including na.fabrikam.com, can access litware.com.
        fr: |
          L'accès va à l'inverse de l'approbation : le côté qui approuve détient les ressources et le côté approuvé détient les comptes. T1 permet aux utilisateurs de litware.com d'accéder à eu.contoso.com, mais une approbation externe est non transitive : elle ne s'étend pas à contoso.com par l'approbation parent-enfant. T2 est une approbation de forêt : elle est transitive entre les domaines des deux forêts ; les utilisateurs de n'importe quel domaine de fabrikam.com, dont na.fabrikam.com, peuvent donc accéder à litware.com.
      options:
        s2: { en: "T1 is an external trust with eu.contoso.com only; litware.com users would need another trust with contoso.com, or a forest trust between the two forests.", fr: "T1 est une approbation externe avec eu.contoso.com seulement ; les utilisateurs de litware.com auraient besoin d'une autre approbation avec contoso.com, ou d'une approbation de forêt entre les deux forêts." }
    references:
      - title: "When to create an external trust: Active Directory"
        url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2003/cc755427(v=ws.10)
      - title: How trust relationships work for forests in Active Directory
        url: https://learn.microsoft.com/en-us/entra/identity/domain-services/concepts-forest-trust

  # ------------------------------------------------------------------ 8
  - id: az802-qz-12-08
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        The **contoso.com** forest contains three domains. The **Lille** site contains a single domain controller, **DC-LIL1**, which is a writable domain controller of the contoso.com domain and isn't a global catalog server. All the users who work in Lille have accounts in contoso.com. Lille is connected to the **Paris** site, which hosts two global catalog servers, by a slow WAN link and a site link named **PAR-LIL** that keeps its default settings.

        You need to meet the following requirements:

        - Users who regularly sign in at Lille must still be able to sign in when the WAN link is down. No global catalog server must be added in Lille, to avoid replicating the partial replicas of the other domains over the WAN.
        - Changes made in Paris must reach DC-LIL1 within 15 minutes. Change notification must not be enabled on PAR-LIL, to avoid bursts of replication traffic.

        How should you complete the commands? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        La forêt **contoso.com** contient trois domaines. Le site **Lille** contient un seul contrôleur de domaine, **DC-LIL1**, qui est un contrôleur de domaine accessible en écriture du domaine contoso.com et n'est pas serveur de catalogue global. Tous les utilisateurs qui travaillent à Lille ont un compte dans contoso.com. Lille est relié au site **Paris**, qui héberge deux serveurs de catalogue global, par une liaison WAN lente et un lien de sites nommé **PAR-LIL** qui conserve ses paramètres par défaut.

        Vous devez satisfaire les exigences suivantes :

        - Les utilisateurs qui ouvrent régulièrement une session à Lille doivent pouvoir continuer à le faire quand la liaison WAN est coupée. Aucun serveur de catalogue global ne doit être ajouté à Lille, pour éviter de répliquer les réplicas partiels des autres domaines à travers le WAN.
        - Les modifications faites à Paris doivent atteindre DC-LIL1 en 15 minutes au plus. La notification de modification ne doit pas être activée sur PAR-LIL, pour éviter des pics de trafic de réplication.

        Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: powershell
      template: |
        Set-ADReplicationSite -Identity "Lille" [[site]] $true
        Set-ADReplicationSiteLink -Identity "PAR-LIL" [[link]]
      slots:
        - id: site
          options:
            - { id: auto, text: "-AutomaticTopologyGenerationEnabled" }
            - { id: ugmc, text: "-UniversalGroupCachingEnabled" }
            - { id: redundant, text: "-RedundantServerTopologyEnabled" }
            - { id: hashing, text: "-ScheduleHashingEnabled" }
        - id: link
          options:
            - { id: notify, text: "-Replace @{'options'=1}" }
            - { id: cost, text: "-Cost 15" }
            - { id: freq15, text: "-ReplicationFrequencyInMinutes 15" }
            - { id: freq60, text: "-ReplicationFrequencyInMinutes 60" }
    answer:
      values: { site: ugmc, link: freq15 }
    explanation:
      correct:
        en: |
          In a multidomain forest, a sign-in normally needs a global catalog to expand universal group memberships. Universal group membership caching, enabled on the site, lets DC-LIL1 cache the memberships of the users after they have been resolved through a reachable global catalog, so those users can sign in when the WAN is down. A replication interval of 15 minutes on PAR-LIL replaces the default 180 minutes and meets the latency requirement without change notification.
        fr: |
          Dans une forêt à plusieurs domaines, une ouverture de session a normalement besoin d'un catalogue global pour développer l'appartenance aux groupes universels. La mise en cache de l'appartenance aux groupes universels, activée sur le site, permet à DC-LIL1 de mettre en cache l'appartenance des utilisateurs une fois résolue par un catalogue global joignable : ces utilisateurs peuvent alors ouvrir une session quand le WAN est coupé. Un intervalle de réplication de 15 minutes sur PAR-LIL remplace les 180 minutes par défaut et satisfait l'exigence de latence sans notification de modification.
      options:
        auto: { en: "This setting controls whether the KCC generates the intrasite connections; it has no effect on sign-ins.", fr: "Ce paramètre détermine si le KCC génère les connexions intrasite ; il n'a aucun effet sur les ouvertures de session." }
        notify: { en: "Setting options to 1 enables change notification on the site link, which the requirement forbids.", fr: "Définir options à 1 active la notification de modification sur le lien de sites, ce que l'exigence interdit." }
        cost: { en: "The cost only ranks the paths between sites; the interval stays at 180 minutes.", fr: "Le coût ne fait que classer les chemins entre sites ; l'intervalle reste de 180 minutes." }
        freq60: { en: "A 60-minute interval can leave changes waiting up to an hour, beyond the 15-minute requirement.", fr: "Un intervalle de 60 minutes peut faire attendre les modifications jusqu'à une heure, au-delà de l'exigence de 15 minutes." }
    references:
      - title: Set-ADReplicationSite (ActiveDirectory)
        url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/set-adreplicationsite
      - title: Plan global catalog placement and authentication paths
        url: https://learn.microsoft.com/en-us/training/modules/design-multi-domain-forest-trust/6-plan-global-catalog-authentication-paths

  # ------------------------------------------------------------------ 9
  - id: az802-qz-12-09
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        The **contoso.com** forest contains the domains contoso.com and **eu.contoso.com**. The **Paris** and **Berlin** sites are connected by a site link named **PAR-BER** whose settings are all at their default values. The following table shows the domain controllers.

        | Name | Domain | Site | Global catalog |
        | --- | --- | --- | --- |
        | DC1 | contoso.com | Paris | Yes |
        | DC2 | contoso.com | Paris | No |
        | DC3 | contoso.com | Berlin | No |
        | DC4 | contoso.com | Berlin | No |
        | EU-DC1 | eu.contoso.com | Berlin | Yes |

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        La forêt **contoso.com** contient les domaines contoso.com et **eu.contoso.com**. Les sites **Paris** et **Berlin** sont reliés par un lien de sites nommé **PAR-BER** dont tous les paramètres ont leur valeur par défaut. Le tableau suivant présente les contrôleurs de domaine.

        | Nom | Domaine | Site | Catalogue global |
        | --- | --- | --- | --- |
        | DC1 | contoso.com | Paris | Oui |
        | DC2 | contoso.com | Paris | Non |
        | DC3 | contoso.com | Berlin | Non |
        | DC4 | contoso.com | Berlin | Non |
        | EU-DC1 | eu.contoso.com | Berlin | Oui |

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "A user account created in eu.contoso.com on EU-DC1 is replicated to DC1 with only a subset of its attributes.", fr: "Un compte d'utilisateur créé dans eu.contoso.com sur EU-DC1 est répliqué vers DC1 avec seulement une partie de ses attributs." } }
        - { id: b, text: { en: "A user account created in contoso.com on DC1 is replicated to DC3 about 15 seconds after its creation.", fr: "Un compte d'utilisateur créé dans contoso.com sur DC1 est répliqué vers DC3 environ 15 secondes après sa création." } }
        - { id: c, text: { en: "Each domain controller in Paris replicates the contoso.com partition directly with DC3 and with DC4.", fr: "Chaque contrôleur de domaine de Paris réplique la partition contoso.com directement avec DC3 et avec DC4." } }
        - { id: d, text: { en: "If DC3 fails, the KCC creates temporary connections so that DC4 keeps receiving the changes made to contoso.com.", fr: "Si DC3 tombe en panne, le KCC crée des connexions temporaires pour que DC4 continue de recevoir les modifications de contoso.com." } }
        - { id: e, text: { en: "A user account created in eu.contoso.com on EU-DC1 is replicated in full to DC3, because DC3 is in the same site.", fr: "Un compte d'utilisateur créé dans eu.contoso.com sur EU-DC1 est répliqué en entier vers DC3, car DC3 est dans le même site." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          A global catalog server holds a partial, read-only replica of every other domain of the forest: every object, but only a subset of its attributes. DC1 is a global catalog, so it receives eu.contoso.com users from EU-DC1. When a connection doesn't work because a domain controller failed, the KCC automatically builds temporary connections to other available partners, so DC4 keeps replicating contoso.com.
        fr: |
          Un serveur de catalogue global détient un réplica partiel en lecture seule de chaque autre domaine de la forêt : tous les objets, mais seulement une partie de leurs attributs. DC1 est catalogue global : il reçoit donc les utilisateurs d'eu.contoso.com depuis EU-DC1. Quand une connexion ne fonctionne pas parce qu'un contrôleur de domaine est en panne, le KCC crée automatiquement des connexions temporaires vers d'autres partenaires disponibles : DC4 continue donc de répliquer contoso.com.
      options:
        b: { en: "DC1 and DC3 are in different sites; the change reaches Berlin at the site link interval, 180 minutes by default, not by change notification.", fr: "DC1 et DC3 sont dans des sites différents ; la modification atteint Berlin à l'intervalle du lien de sites, 180 minutes par défaut, et non par notification de modification." }
        c: { en: "Between sites, only bridgehead servers chosen by the KCC replicate with each other; the other domain controllers replicate inside their site.", fr: "Entre sites, seuls les serveurs tête de pont choisis par le KCC se répliquent entre eux ; les autres contrôleurs de domaine répliquent à l'intérieur de leur site." }
        e: { en: "A domain partition replicates in full only to the domain controllers of its domain; DC3 isn't a global catalog, so it doesn't receive eu.contoso.com objects at all.", fr: "Une partition de domaine n'est répliquée en entier que vers les contrôleurs de domaine de son domaine ; DC3 n'est pas catalogue global, il ne reçoit donc aucun objet d'eu.contoso.com." }
    references:
      - title: Active Directory Replication Concepts
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/replication/active-directory-replication-concepts

  # ------------------------------------------------------------------ 10
  - id: az802-qz-12-10
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        The **corp.fabrikam.com** domain has domain controllers in the **Paris** and **Nice** sites. The **Lyon** site contains only the subnets of the Lyon office and has no domain controller. The WAN is a chain: Paris is connected to Lyon, and Lyon to Nice. The network is fully routed, all the sites are in the same time zone, and **Bridge all site links** is enabled. The site links are the following, and Nice isn't a member of any other site link:

        | Site link | Sites | Cost | Schedule |
        | --- | --- | --- | --- |
        | PAR-LYS | Paris, Lyon | 100 | 00:00–06:00 |
        | LYS-NCE | Lyon, Nice | 100 | 08:00–18:00 |

        Since these site links were created, the domain controllers in Nice haven't received any change made in Paris. The Paris–Lyon WAN link must carry no replication traffic between 06:00 and midnight.

        You need to restore replication between Paris and Nice. What should you do?
      fr: |
        Le domaine **corp.fabrikam.com** possède des contrôleurs de domaine dans les sites **Paris** et **Nice**. Le site **Lyon** contient uniquement les sous-réseaux du bureau de Lyon et n'a aucun contrôleur de domaine. Le WAN est une chaîne : Paris est relié à Lyon, et Lyon à Nice. Le réseau est entièrement routé, tous les sites sont dans le même fuseau horaire, et **Bridge all site links** est activé. Les liens de sites sont les suivants, et Nice n'est membre d'aucun autre lien de sites :

        | Lien de sites | Sites | Coût | Planification |
        | --- | --- | --- | --- |
        | PAR-LYS | Paris, Lyon | 100 | 00:00–06:00 |
        | LYS-NCE | Lyon, Nice | 100 | 08:00–18:00 |

        Depuis la création de ces liens de sites, les contrôleurs de domaine de Nice n'ont reçu aucune modification faite à Paris. La liaison WAN Paris–Lyon ne doit transporter aucun trafic de réplication entre 06:00 et minuit.

        Vous devez rétablir la réplication entre Paris et Nice. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Clear Bridge all site links, and create a site link bridge that contains PAR-LYS and LYS-NCE.", fr: "Désactiver Bridge all site links, puis créer un pont de liens de sites qui contient PAR-LYS et LYS-NCE." } }
        - { id: b, text: { en: "Create a site link named PAR-NCE that contains Paris and Nice and keeps the default schedule.", fr: "Créer un lien de sites nommé PAR-NCE qui contient Paris et Nice et conserve la planification par défaut." } }
        - { id: c, text: { en: "Set the replication interval of PAR-LYS and LYS-NCE to 15 minutes to multiply the replication attempts.", fr: "Définir l'intervalle de réplication de PAR-LYS et de LYS-NCE à 15 minutes pour multiplier les tentatives de réplication." } }
        - { id: d, text: { en: "Change the schedule of LYS-NCE so that the site link is also available between 00:00 and 06:00.", fr: "Modifier la planification de LYS-NCE pour que le lien de sites soit aussi disponible entre 00:00 et 06:00." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Lyon has no domain controller, so Paris and Nice can only replicate directly, through a transitive path made of PAR-LYS and LYS-NCE. The schedule of such a path is the overlap of the schedules of its links, and these two windows don't overlap, so the path can never be used. Opening LYS-NCE between 00:00 and 06:00 creates an overlap while keeping the Paris–Lyon link free of replication outside that window.
        fr: |
          Lyon n'a aucun contrôleur de domaine : Paris et Nice ne peuvent donc se répliquer que directement, par un chemin transitif formé de PAR-LYS et de LYS-NCE. La planification d'un tel chemin est le chevauchement des planifications de ses liens, et ces deux plages ne se chevauchent pas : le chemin n'est donc jamais utilisable. Ouvrir LYS-NCE entre 00:00 et 06:00 crée un chevauchement tout en laissant la liaison Paris–Lyon sans réplication en dehors de cette plage.
      options:
        a: { en: "An explicit site link bridge provides the same transitive path as Bridge all site links; the schedules still don't overlap.", fr: "Un pont de liens de sites explicite fournit le même chemin transitif que Bridge all site links ; les planifications ne se chevauchent toujours pas." }
        b: { en: "Replication over PAR-NCE would be available all day, and its traffic would cross the Paris–Lyon WAN link outside the allowed window.", fr: "La réplication par PAR-NCE serait possible toute la journée, et son trafic traverserait la liaison WAN Paris–Lyon en dehors de la plage autorisée." }
        c: { en: "The interval only applies while the schedule is open; with no common window, no attempt is ever made on the path.", fr: "L'intervalle ne s'applique que lorsque la planification est ouverte ; sans plage commune, aucune tentative n'a jamais lieu sur le chemin." }
    references:
      - title: Determining the Schedule
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/determining-the-schedule
      - title: Active Directory Replication Concepts
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/replication/active-directory-replication-concepts
