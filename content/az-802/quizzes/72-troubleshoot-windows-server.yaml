chapter: 72-troubleshoot-windows-server
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-72-01
    objective: "7.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A server named **SRV1** runs Windows Server 2025 and has two network adapters: one on the 10.0.1.0/24 server subnet and one on the 10.0.9.0/24 backup subnet. You plan to configure backup software on SRV1 that will send data to a storage appliance at 10.1.2.3. No connection to 10.1.2.3 exists yet.

        You need to identify the source IP address and the next hop that SRV1 will use for traffic to 10.1.2.3.

        Which command should you run on SRV1?
      fr: |
        Un serveur nommé **SRV1** exécute Windows Server 2025 et possède deux cartes réseau : une sur le sous-réseau des serveurs 10.0.1.0/24 et une sur le sous-réseau de sauvegarde 10.0.9.0/24. Vous prévoyez de configurer sur SRV1 un logiciel de sauvegarde qui enverra des données à une appliance de stockage à l'adresse 10.1.2.3. Aucune connexion vers 10.1.2.3 n'existe encore.

        Vous devez identifier l'adresse IP source et le tronçon suivant que SRV1 utilisera pour le trafic vers 10.1.2.3.

        Quelle commande devez-vous exécuter sur SRV1 ?
    body:
      options:
        - { id: a, text: "`Get-NetIPConfiguration -Detailed`" }
        - { id: b, text: "`Find-NetRoute -RemoteIPAddress 10.1.2.3`" }
        - { id: c, text: "`Get-NetTCPConnection -RemoteAddress 10.1.2.3`" }
        - { id: d, text: "`Get-NetFirewallProfile -All`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `Find-NetRoute` finds the best local IP address and the best route to reach a remote address. Its output contains the selected address, with its interface, and the selected route, with its next hop, which is exactly what SRV1 will use for 10.1.2.3.
        fr: |
          `Find-NetRoute` trouve la meilleure adresse IP locale et le meilleur itinéraire pour atteindre une adresse distante. Sa sortie contient l'adresse choisie, avec son interface, et l'itinéraire choisi, avec son tronçon suivant : c'est exactement ce que SRV1 utilisera pour 10.1.2.3.
      options:
        a: { en: "Get-NetIPConfiguration lists the addresses, gateways and DNS servers of each adapter, but it doesn't say which adapter and route are chosen for a given destination.", fr: "Get-NetIPConfiguration liste les adresses, passerelles et serveurs DNS de chaque carte, mais n'indique pas quelle carte et quel itinéraire sont choisis pour une destination donnée." }
        c: { en: "Get-NetTCPConnection shows existing connections only; no connection to 10.1.2.3 exists yet, so it returns nothing.", fr: "Get-NetTCPConnection n'affiche que les connexions existantes ; aucune connexion vers 10.1.2.3 n'existe encore, elle ne renvoie donc rien." }
        d: { en: "Get-NetFirewallProfile shows the settings of the firewall profiles, not the routing decision.", fr: "Get-NetFirewallProfile affiche les paramètres des profils du pare-feu, pas la décision de routage." }
    references:
      - title: Find-NetRoute (NetTCPIP)
        url: https://learn.microsoft.com/en-us/powershell/module/nettcpip/find-netroute

  # ------------------------------------------------------------------ 2
  - id: az802-qz-72-02
    objective: "7.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A member server named **SRV2** in the contoso.com domain synchronizes its time from the domain hierarchy. Users report that the clock of SRV2 seems to drift away from the clock of a domain controller named **DC1**.

        You need to display the offset between the clock of SRV2 and the clock of DC1 over five samples. The command must not change the clock or the time configuration of SRV2.

        Which command should you run on SRV2?
      fr: |
        Un serveur membre nommé **SRV2** du domaine contoso.com synchronise son heure sur la hiérarchie du domaine. Des utilisateurs signalent que l'horloge de SRV2 semble s'écarter de celle d'un contrôleur de domaine nommé **DC1**.

        Vous devez afficher l'écart entre l'horloge de SRV2 et celle de DC1 sur cinq échantillons. La commande ne doit modifier ni l'horloge ni la configuration de l'heure de SRV2.

        Quelle commande devez-vous exécuter sur SRV2 ?
    body:
      options:
        - { id: a, text: "`w32tm /query /configuration`" }
        - { id: b, text: "`w32tm /resync /rediscover`" }
        - { id: c, text: "`w32tm /stripchart /computer:DC1 /samples:5 /dataonly`" }
        - { id: d, text: "`w32tm /config /syncfromflags:domhier /update`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `w32tm /stripchart` displays the offset between the local computer and the computer named in `/computer`. `/samples:5` stops after five samples and `/dataonly` shows the values without the graph. It only measures: the clock and the configuration stay unchanged.
        fr: |
          `w32tm /stripchart` affiche l'écart entre l'ordinateur local et l'ordinateur indiqué dans `/computer`. `/samples:5` s'arrête après cinq échantillons et `/dataonly` affiche les valeurs sans le graphique. Elle ne fait que mesurer : l'horloge et la configuration restent inchangées.
      options:
        a: { en: "This command shows the runtime configuration and where each setting comes from, not the offset from DC1.", fr: "Cette commande affiche la configuration en cours et l'origine de chaque paramètre, pas l'écart avec DC1." }
        b: { en: "This command rediscovers the time sources and resynchronizes the clock, which changes it.", fr: "Cette commande redécouvre les sources de temps et resynchronise l'horloge, ce qui la modifie." }
        d: { en: "This command rewrites the time configuration; SRV2 already uses the domain hierarchy.", fr: "Cette commande réécrit la configuration de l'heure ; SRV2 utilise déjà la hiérarchie du domaine." }
    references:
      - title: Windows Time service tools and settings
        url: https://learn.microsoft.com/en-us/windows-server/networking/windows-time-service/windows-time-service-tools-and-settings

  # ------------------------------------------------------------------ 3
  - id: az802-qz-72-03
    objective: "7.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The Active Directory domain of Fabrikam is fabrikam.com. Application servers are registered in a separate DNS zone named apps.fabrikam.com, hosted on the same DNS servers as fabrikam.com. A member server named **SRV3** runs Windows Server 2025 and uses the default DNS client settings.

        On SRV3, `Resolve-DnsName erp1.apps.fabrikam.com` returns the correct address, but `Resolve-DnsName erp1` fails.

        You need SRV3 to resolve single-label names of hosts in both fabrikam.com and apps.fabrikam.com. What should you run on SRV3?
      fr: |
        Le domaine Active Directory de Fabrikam est fabrikam.com. Les serveurs d'applications sont inscrits dans une zone DNS distincte nommée apps.fabrikam.com, hébergée sur les mêmes serveurs DNS que fabrikam.com. Un serveur membre nommé **SRV3** exécute Windows Server 2025 et utilise les paramètres par défaut du client DNS.

        Sur SRV3, `Resolve-DnsName erp1.apps.fabrikam.com` renvoie la bonne adresse, mais `Resolve-DnsName erp1` échoue.

        Vous devez faire en sorte que SRV3 résolve les noms en une seule partie des hôtes de fabrikam.com et d'apps.fabrikam.com. Que devez-vous exécuter sur SRV3 ?
    body:
      options:
        - { id: a, text: "`Set-DnsClientGlobalSetting -SuffixSearchList @(\"fabrikam.com\", \"apps.fabrikam.com\")`" }
        - { id: b, text: "`Add-DnsServerConditionalForwarderZone -Name apps.fabrikam.com -MasterServers 10.0.0.4`" }
        - { id: c, text: "`Clear-DnsClientCache`, then `Register-DnsClient`" }
        - { id: d, text: "`Set-DnsClient -InterfaceAlias Ethernet -RegisterThisConnectionsAddress $true`" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The FQDN resolves, so the DNS servers and the zone work: the problem is the suffix that SRV3 appends to single-label names. By default SRV3 appends only its primary suffix, fabrikam.com. A DNS suffix search list makes the client append each listed suffix in order, so `erp1` is tried as erp1.fabrikam.com, then erp1.apps.fabrikam.com.
        fr: |
          Le FQDN se résout : les serveurs DNS et la zone fonctionnent, le problème est le suffixe que SRV3 ajoute aux noms en une seule partie. Par défaut, SRV3 n'ajoute que son suffixe principal, fabrikam.com. Une liste de recherche de suffixes DNS fait ajouter par le client chaque suffixe de la liste dans l'ordre : `erp1` est donc essayé comme erp1.fabrikam.com, puis erp1.apps.fabrikam.com.
      options:
        b: { en: "The DNS servers already host apps.fabrikam.com and answer for the FQDN; a conditional forwarder doesn't change which suffix the client appends.", fr: "Les serveurs DNS hébergent déjà apps.fabrikam.com et répondent pour le FQDN ; un redirecteur conditionnel ne change pas le suffixe ajouté par le client." }
        c: { en: "Clearing the cache and registering SRV3's own records don't add apps.fabrikam.com to the suffixes tried for single-label names.", fr: "Vider le cache et inscrire les enregistrements de SRV3 n'ajoutent pas apps.fabrikam.com aux suffixes essayés pour les noms en une seule partie." }
        d: { en: "This setting controls whether SRV3 registers its own address in DNS; it has no effect on how SRV3 resolves other names.", fr: "Ce paramètre détermine si SRV3 inscrit sa propre adresse dans le DNS ; il n'a aucun effet sur la façon dont SRV3 résout les autres noms." }
    references:
      - title: Set-DnsClientGlobalSetting (DnsClient)
        url: https://learn.microsoft.com/en-us/powershell/module/dnsclient/set-dnsclientglobalsetting

  # ------------------------------------------------------------------ 4
  - id: az802-qz-72-04
    objective: "7.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum deployed a WSUS server named **WSUS2**. A GPO linked to the **Servers** OU enables only the **Configure Automatic Updates** setting, with the **Auto download and schedule the install** option.

        The servers of the OU install their updates, but they download them from Microsoft Update on the internet, and none of them reports to WSUS2.

        You need the servers to detect and download updates from WSUS2 and to report their status to WSUS2. Which GPO setting should you configure?
      fr: |
        Adatum a déployé un serveur WSUS nommé **WSUS2**. Un GPO lié à l'unité d'organisation **Servers** n'active que le paramètre **Configure Automatic Updates**, avec l'option **Auto download and schedule the install**.

        Les serveurs de l'unité d'organisation installent leurs mises à jour, mais ils les téléchargent depuis Microsoft Update sur Internet, et aucun d'eux ne rend compte à WSUS2.

        Vous devez faire en sorte que les serveurs détectent et téléchargent les mises à jour depuis WSUS2 et lui communiquent leur état. Quel paramètre du GPO devez-vous configurer ?
    body:
      options:
        - { id: a, text: "**Enable client-side targeting**, with the name of a WSUS2 computer group" }
        - { id: b, text: "**Do not connect to any Windows Update Internet locations**" }
        - { id: c, text: "**Automatic Updates detection frequency**, with an interval of one hour" }
        - { id: d, text: "**Specify intranet Microsoft update service location**, with WSUS2 as both servers" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          When **Specify intranet Microsoft update service location** is Not Configured, clients connect directly to the Windows Update website, which is what the servers do. Enabled, it sets the server from which clients detect and download updates and the statistics server to which they report; both values can name WSUS2.
        fr: |
          Quand **Specify intranet Microsoft update service location** n'est pas configuré, les clients se connectent directement au site Windows Update, ce que font les serveurs. Activé, il définit le serveur sur lequel les clients détectent et téléchargent les mises à jour et le serveur de statistiques auquel ils rendent compte ; les deux valeurs peuvent désigner WSUS2.
      options:
        a: { en: "Client-side targeting places the servers in a WSUS computer group, but the servers must first be told which WSUS server to use.", fr: "Le ciblage côté client place les serveurs dans un groupe d'ordinateurs WSUS, mais les serveurs doivent d'abord savoir quel serveur WSUS utiliser." }
        b: { en: "This setting blocks connections to the Windows Update internet locations, but it doesn't point the servers to WSUS2.", fr: "Ce paramètre bloque les connexions aux emplacements Internet de Windows Update, mais il n'oriente pas les serveurs vers WSUS2." }
        c: { en: "The detection frequency only changes how often the servers check for updates, still against Microsoft Update.", fr: "La fréquence de détection change seulement la fréquence à laquelle les serveurs recherchent des mises à jour, toujours auprès de Microsoft Update." }
    references:
      - title: Step 4 - Configure Group Policy Settings for Automatic Updates
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-server-update-services/deploy/4-configure-group-policy-settings-for-automatic-updates

  # ------------------------------------------------------------------ 5
  - id: az802-qz-72-05
    objective: "7.2.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A file server named **FS6** runs Windows Server 2022 and uses the iSCSI initiator to connect to a target on a SAN. Volume S:, on the iSCSI disk, works normally until FS6 restarts. After each restart, the disk is missing until an administrator connects to the target again in the iSCSI initiator.

        You need S: to be available after each restart without manual action. What should you run?
      fr: |
        Un serveur de fichiers nommé **FS6** exécute Windows Server 2022 et utilise l'initiateur iSCSI pour se connecter à une cible sur un SAN. Le volume S:, situé sur le disque iSCSI, fonctionne normalement jusqu'au redémarrage de FS6. Après chaque redémarrage, le disque est absent jusqu'à ce qu'un administrateur se reconnecte à la cible dans l'initiateur iSCSI.

        Vous devez faire en sorte que S: soit disponible après chaque redémarrage sans action manuelle. Que devez-vous exécuter ?
    body:
      options:
        - { id: a, text: "`Set-Disk -Number 4 -IsOffline $false`" }
        - { id: b, text: "`Connect-IscsiTarget -NodeAddress <target IQN> -IsPersistent $true`" }
        - { id: c, text: "`Update-IscsiTarget -NodeAddress <target IQN>`" }
        - { id: d, text: "`New-IscsiTargetPortal -TargetPortalAddress SAN1`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The disk disappears because the iSCSI session isn't restored at startup. `-IsPersistent $true` makes the session connect automatically after each restart, so the disk and S: come back without manual action.
        fr: |
          Le disque disparaît parce que la session iSCSI n'est pas rétablie au démarrage. `-IsPersistent $true` fait se reconnecter la session automatiquement après chaque redémarrage : le disque et S: reviennent sans action manuelle.
      options:
        a: { en: "The disk isn't offline: it doesn't exist on FS6 until the iSCSI session is connected.", fr: "Le disque n'est pas hors connexion : il n'existe pas sur FS6 tant que la session iSCSI n'est pas connectée." }
        c: { en: "Update-IscsiTarget refreshes the information about a target; it doesn't make the session reconnect at startup.", fr: "Update-IscsiTarget actualise les informations d'une cible ; elle ne fait pas se reconnecter la session au démarrage." }
        d: { en: "The target portal is already known, because the administrator reconnects to the target; the missing piece is a persistent session.", fr: "Le portail cible est déjà connu, puisque l'administrateur se reconnecte à la cible ; il manque une session persistante." }
    references:
      - title: Connect-IscsiTarget (iSCSI)
        url: https://learn.microsoft.com/en-us/powershell/module/iscsi/connect-iscsitarget

  # ------------------------------------------------------------------ 6
  - id: az802-qz-72-06
    objective: "7.2.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank has an Azure virtual machine named **SQL2** that runs Windows Server 2022. The VM size of SQL2 has an uncached disk limit of 6,400 IOPS. SQL2 has the following data disks.

        | LUN | Disk | Content | Host caching |
        | --- | --- | --- | --- |
        | 0 | 128 GiB Premium SSD, performance tier P10 (500 IOPS) | Transaction logs (writes) | None |
        | 1 | 1 TiB Premium SSD, performance tier P30 (5,000 IOPS) | Database files | ReadOnly |

        A nightly import runs for four hours and is slow after its first 30 minutes. During the import, the metrics show the following values:

        | Metric | Value |
        | --- | --- |
        | Data Disk IOPS Consumed Percentage (LUN 0) | 100% |
        | Data Disk IOPS Consumed Percentage (LUN 1) | 30% |
        | VM Uncached IOPS Consumed Percentage | 12% |

        The import needs 1,800 IOPS on the transaction log disk. You must not change the size of any disk or restart SQL2, and the solution must minimize cost.

        Which component limits the import, and what should you do? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'une machine virtuelle Azure nommée **SQL2** qui exécute Windows Server 2022. La taille de machine virtuelle de SQL2 a une limite de disque sans cache de 6 400 IOPS. SQL2 possède les disques de données suivants.

        | LUN | Disque | Contenu | Mise en cache de l'hôte |
        | --- | --- | --- | --- |
        | 0 | SSD Premium de 128 Gio, niveau de performance P10 (500 IOPS) | Journaux de transactions (écritures) | None |
        | 1 | SSD Premium de 1 Tio, niveau de performance P30 (5 000 IOPS) | Fichiers de base de données | ReadOnly |

        Une importation nocturne dure quatre heures et devient lente après ses 30 premières minutes. Pendant l'importation, les métriques affichent les valeurs suivantes :

        | Métrique | Valeur |
        | --- | --- |
        | Data Disk IOPS Consumed Percentage (LUN 0) | 100 % |
        | Data Disk IOPS Consumed Percentage (LUN 1) | 30 % |
        | VM Uncached IOPS Consumed Percentage | 12 % |

        L'importation a besoin de 1 800 IOPS sur le disque des journaux de transactions. Vous ne devez modifier la taille d'aucun disque ni redémarrer SQL2, et la solution doit réduire les coûts au minimum.

        Quel composant limite l'importation, et que devez-vous faire ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Component that limits the import: [[limit]]

          Action to perform: [[fix]]
        fr: |
          Composant qui limite l'importation : [[limit]]

          Action à effectuer : [[fix]]
      slots:
        - id: limit
          options:
            - { id: lun0, text: { en: "The IOPS limit of the LUN 0 disk", fr: "La limite d'IOPS du disque LUN 0" } }
            - { id: lun1, text: { en: "The IOPS limit of the LUN 1 disk", fr: "La limite d'IOPS du disque LUN 1" } }
            - { id: vmun, text: { en: "The uncached IOPS limit of the VM size", fr: "La limite d'IOPS sans cache de la taille de machine virtuelle" } }
            - { id: vmca, text: { en: "The cached IOPS limit of the VM size", fr: "La limite d'IOPS avec cache de la taille de machine virtuelle" } }
        - id: fix
          options:
            - { id: p15, text: { en: "Change the performance tier of the LUN 0 disk to P15", fr: "Changer le niveau de performance du disque LUN 0 en P15" } }
            - { id: p20, text: { en: "Change the performance tier of the LUN 0 disk to P20", fr: "Changer le niveau de performance du disque LUN 0 en P20" } }
            - { id: cache, text: { en: "Set the host caching of the LUN 0 disk to ReadOnly", fr: "Définir la mise en cache de l'hôte du disque LUN 0 sur ReadOnly" } }
            - { id: resize, text: { en: "Resize SQL2 to a VM size with a higher uncached limit", fr: "Redimensionner SQL2 vers une taille de machine virtuelle à la limite sans cache plus élevée" } }
    answer:
      values: { limit: lun0, fix: p20 }
    explanation:
      correct:
        en: |
          A Data Disk IOPS Consumed Percentage of 100% means the application is capped by that disk's IOPS limit, while 12% of the VM uncached limit shows that the VM size isn't the bottleneck. The first 30 minutes are fast because a P10 disk can burst for up to 30 minutes, then it falls back to 500 IOPS. The performance tier of a disk can be raised without changing its size and usually without downtime; P20 provides 2,300 IOPS, the cheapest tier that covers 1,800 IOPS.
        fr: |
          Une valeur de 100 % pour Data Disk IOPS Consumed Percentage signifie que l'application est plafonnée par la limite d'IOPS de ce disque, tandis que 12 % de la limite sans cache de la machine virtuelle montrent que la taille de machine virtuelle n'est pas le goulot d'étranglement. Les 30 premières minutes sont rapides parce qu'un disque P10 peut utiliser le bursting jusqu'à 30 minutes, puis il revient à 500 IOPS. Le niveau de performance d'un disque peut être augmenté sans changer sa taille et, en général, sans temps d'arrêt ; P20 fournit 2 300 IOPS, le niveau le moins cher qui couvre 1 800 IOPS.
      options:
        lun1: { en: "LUN 1 uses only 30% of its IOPS, so it has headroom.", fr: "LUN 1 n'utilise que 30 % de ses IOPS : il a de la marge." }
        vmun: { en: "The VM uses only 12% of its uncached limit; resizing it would cost more and wouldn't raise the 500 IOPS of LUN 0.", fr: "La machine virtuelle n'utilise que 12 % de sa limite sans cache ; la redimensionner coûterait plus cher sans relever les 500 IOPS de LUN 0." }
        p15: { en: "P15 provides 1,100 IOPS, less than the 1,800 IOPS the import needs.", fr: "P15 fournit 1 100 IOPS, moins que les 1 800 IOPS nécessaires à l'importation." }
        cache: { en: "ReadOnly caching serves reads from the cache; the log disk receives writes, which still go to the disk at its limit.", fr: "La mise en cache ReadOnly sert les lectures depuis le cache ; le disque des journaux reçoit des écritures, qui vont toujours au disque à sa limite." }
    references:
      - title: Disk performance metrics
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-metrics
      - title: Azure managed disk types
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types

  # ------------------------------------------------------------------ 7
  - id: az802-qz-72-07
    objective: "7.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso uses Azure Update Manager for its Azure Arc-enabled servers that run Windows Server 2022. The servers are in two subscriptions:

        - **Sub-Paris** contains 20 Arc-enabled servers. All of them show the **Connected** status, but none of them has ever produced assessment data.
        - **Sub-Lyon** contains 10 Arc-enabled servers. Nine of them are assessed normally. On the tenth, named **SRV9**, the extension that Update Manager uses for Windows updates has the **Failed** status, and SRV9 has no recent assessment.

        Periodic assessment is enabled on all 30 servers. You need all the servers to produce assessment data. The solution must minimize administrative effort.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso utilise le Gestionnaire de mise à jour Azure (Azure Update Manager) pour ses serveurs activés pour Azure Arc qui exécutent Windows Server 2022. Les serveurs se trouvent dans deux abonnements :

        - **Sub-Paris** contient 20 serveurs activés pour Arc. Tous affichent l'état **Connected**, mais aucun n'a jamais produit de données d'évaluation.
        - **Sub-Lyon** contient 10 serveurs activés pour Arc. Neuf d'entre eux sont évalués normalement. Sur le dixième, nommé **SRV9**, l'extension qu'utilise le Gestionnaire de mise à jour pour les mises à jour Windows est à l'état **Failed**, et SRV9 n'a aucune évaluation récente.

        L'évaluation périodique est activée sur les 30 serveurs. Vous devez faire en sorte que tous les serveurs produisent des données d'évaluation. La solution doit réduire au minimum l'effort administratif.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Register Sub-Paris to the Microsoft.HybridCompute resource provider.", fr: "Inscrire Sub-Paris auprès du fournisseur de ressources Microsoft.HybridCompute." } }
        - { id: b, text: { en: "Register Sub-Paris to the Microsoft.Compute resource provider.", fr: "Inscrire Sub-Paris auprès du fournisseur de ressources Microsoft.Compute." } }
        - { id: c, text: { en: "Attach the servers of Sub-Paris to a maintenance configuration.", fr: "Attacher les serveurs de Sub-Paris à une configuration de maintenance." } }
        - { id: d, text: { en: "Remove the failed extension from SRV9, then trigger an on-demand assessment.", fr: "Supprimer l'extension en échec de SRV9, puis déclencher une évaluation à la demande." } }
        - { id: e, text: { en: "Disconnect SRV9 from Azure Arc, then onboard SRV9 again.", fr: "Déconnecter SRV9 d'Azure Arc, puis intégrer de nouveau SRV9." } }
      choose: 2
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Arc-enabled servers produce periodic assessment data only if their subscription is registered to the Microsoft.Compute resource provider, which explains why every server of Sub-Paris lacks data. When the extension is present on an Arc-enabled machine but its status isn't Succeeded, the documented fix is to remove the extension and trigger an on-demand operation, which reinstalls it.
        fr: |
          Les serveurs activés pour Arc ne produisent des données d'évaluation périodique que si leur abonnement est inscrit auprès du fournisseur de ressources Microsoft.Compute, ce qui explique l'absence de données sur tous les serveurs de Sub-Paris. Quand l'extension est présente sur une machine activée pour Arc mais que son état n'est pas Succeeded, la correction documentée consiste à supprimer l'extension et à déclencher une opération à la demande, qui la réinstalle.
      options:
        a: { en: "The servers of Sub-Paris are already connected to Azure Arc, which requires Microsoft.HybridCompute; the missing registration is Microsoft.Compute.", fr: "Les serveurs de Sub-Paris sont déjà connectés à Azure Arc, ce qui exige Microsoft.HybridCompute ; l'inscription manquante est Microsoft.Compute." }
        c: { en: "A maintenance configuration schedules the installation of updates; it doesn't make the servers produce periodic assessment data.", fr: "Une configuration de maintenance planifie l'installation des mises à jour ; elle ne fait pas produire de données d'évaluation périodique aux serveurs." }
        e: { en: "Onboarding SRV9 again would also work, but it's far more effort than removing and reinstalling one extension.", fr: "Intégrer de nouveau SRV9 fonctionnerait aussi, mais demande bien plus d'effort que supprimer et réinstaller une extension." }
    references:
      - title: Troubleshoot Known Issues with Azure Update Manager
        url: https://learn.microsoft.com/en-us/azure/update-manager/troubleshoot

  # ------------------------------------------------------------------ 8
  - id: az802-qz-72-08
    objective: "7.2.6"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware has 40 on-premises servers that run Windows Server 2025 and are connected to Azure Arc. An Azure Policy assignment deploys the Azure Monitor Agent to all of them. The deployment succeeds everywhere except on a server named **SRV7**. On SRV7, `azcmagent config list` returns the following values:

        ```text
        config.mode           : full
        extensions.allowlist  : Microsoft.Compute/CustomScriptExtension
        extensions.blocklist  : Microsoft.Azure.Monitor/AzureMonitorWindowsAgent
        extensions.enabled    : true
        ```

        You need the Azure Monitor Agent to install on SRV7. The Custom Script Extension must stay allowed, and no other extension may be installed on SRV7.

        How should you complete the procedure? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose de 40 serveurs locaux qui exécutent Windows Server 2025 et sont connectés à Azure Arc. Une attribution Azure Policy déploie l'agent Azure Monitor sur tous ces serveurs. Le déploiement réussit partout sauf sur un serveur nommé **SRV7**. Sur SRV7, `azcmagent config list` renvoie les valeurs suivantes :

        ```text
        config.mode           : full
        extensions.allowlist  : Microsoft.Compute/CustomScriptExtension
        extensions.blocklist  : Microsoft.Azure.Monitor/AzureMonitorWindowsAgent
        extensions.enabled    : true
        ```

        Vous devez faire en sorte que l'agent Azure Monitor s'installe sur SRV7. L'extension de script personnalisé (Custom Script Extension) doit rester autorisée, et aucune autre extension ne doit pouvoir s'installer sur SRV7.

        Comment devez-vous compléter la procédure ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: powershell
      template:
        en: |
          # Run the commands on: [[where]]
          azcmagent config [[verb]] extensions.blocklist
          azcmagent config set extensions.allowlist "[[list]]"
        fr: |
          # Exécuter les commandes sur : [[where]]
          azcmagent config [[verb]] extensions.blocklist
          azcmagent config set extensions.allowlist "[[list]]"
      slots:
        - id: where
          options:
            - { id: srv7, text: { en: "SRV7, in an elevated session", fr: "SRV7, dans une session avec élévation de privilèges" } }
            - { id: shell, text: { en: "Azure Cloud Shell, as a subscription Owner", fr: "Azure Cloud Shell, en tant que propriétaire (Owner) de l'abonnement" } }
            - { id: other, text: { en: "Another Arc-enabled server of the same resource group", fr: "Un autre serveur activé pour Arc du même groupe de ressources" } }
        - id: verb
          options:
            - { id: clear, text: clear }
            - { id: get, text: get }
            - { id: info, text: info }
            - { id: list, text: list }
        - id: list
          options:
            - { id: ama, text: "Microsoft.Azure.Monitor/AzureMonitorWindowsAgent" }
            - { id: both, text: "Microsoft.Compute/CustomScriptExtension,Microsoft.Azure.Monitor/AzureMonitorWindowsAgent" }
            - { id: allownone, text: "Allow/None" }
    answer:
      values: { where: srv7, verb: clear, list: both }
    explanation:
      correct:
        en: |
          Allowlists and blocklists are configured locally on each server and can't be modified from Azure, not even by an Owner. Two settings block the agent: it's in the blocklist, and it's missing from the allowlist, which is exclusive. `clear` resets the blocklist to its default (empty) value, and because `set` replaces the whole allowlist, the new list must name both the Custom Script Extension and the agent.
        fr: |
          Les listes d'autorisation et de blocage se configurent localement sur chaque serveur et ne peuvent pas être modifiées depuis Azure, même par un propriétaire (Owner). Deux paramètres bloquent l'agent : il figure dans la liste de blocage, et il est absent de la liste d'autorisation, qui est exclusive. `clear` remet la liste de blocage à sa valeur par défaut (vide), et comme `set` remplace toute la liste d'autorisation, la nouvelle liste doit nommer à la fois l'extension de script personnalisé et l'agent.
      options:
        shell: { en: "These lists can only be changed by a command run on the server itself; Azure roles can't override them.", fr: "Ces listes ne se modifient que par une commande exécutée sur le serveur lui-même ; les rôles Azure ne peuvent pas les contourner." }
        other: { en: "azcmagent configures the agent of the server on which it runs; another server's settings don't apply to SRV7.", fr: "azcmagent configure l'agent du serveur sur lequel il s'exécute ; les paramètres d'un autre serveur ne s'appliquent pas à SRV7." }
        list: { en: "get, info and list only read values; the blocklist keeps blocking the agent.", fr: "get, info et list ne font que lire des valeurs ; la liste de blocage continue de bloquer l'agent." }
        ama: { en: "set replaces the allowlist: a list with only the agent would block the Custom Script Extension.", fr: "set remplace la liste d'autorisation : une liste qui ne contient que l'agent bloquerait l'extension de script personnalisé." }
        allownone: { en: "Allow/None keeps the extension manager running but allows no extension at all.", fr: "Allow/None laisse le gestionnaire d'extensions actif mais n'autorise aucune extension." }
    references:
      - title: Extensions security for Azure Arc-enabled servers
        url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/security-extensions
      - title: azcmagent config CLI reference
        url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/azcmagent-config

  # ------------------------------------------------------------------ 9
  - id: az802-qz-72-09
    objective: "7.2.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys keeps Azure Disk Encryption (ADE) on some existing Azure virtual machines until they are migrated to encryption at host. All the virtual machines run Windows Server 2022, are joined to the tailspin.com domain, and are in the West Europe region of a subscription named **Sub1**. A key vault named **KV1** in the West Europe region of Sub1 is enabled for disk encryption.

        | Virtual machine | Size | Situation |
        | --- | --- | --- |
        | VM-A | Standard_D4s_v5 | Not encrypted. A GPO linked to its OU enforces TPM protectors for operating system drives. Enabling ADE with KV1 fails. |
        | VM-B | Standard_D4s_v5 | Encrypted with ADE by using KV1. |
        | VM-C | Standard_D4s_v6 | New, not encrypted. |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys conserve Azure Disk Encryption (ADE) sur certaines machines virtuelles Azure existantes jusqu'à leur migration vers le chiffrement sur l'hôte. Toutes les machines virtuelles exécutent Windows Server 2022, sont jointes au domaine tailspin.com et se trouvent dans la région Europe Ouest d'un abonnement nommé **Sub1**. Un coffre de clés nommé **KV1**, dans la région Europe Ouest de Sub1, est activé pour le chiffrement de disque.

        | Machine virtuelle | Taille | Situation |
        | --- | --- | --- |
        | VM-A | Standard_D4s_v5 | Non chiffrée. Un GPO lié à son unité d'organisation impose des protecteurs TPM pour les lecteurs du système d'exploitation. L'activation d'ADE avec KV1 échoue. |
        | VM-B | Standard_D4s_v5 | Chiffrée avec ADE à l'aide de KV1. |
        | VM-C | Standard_D4s_v6 | Nouvelle, non chiffrée. |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "ADE can be enabled on VM-A after the GPO that applies to VM-A no longer enforces TPM protectors.", fr: "ADE peut être activé sur VM-A une fois que le GPO qui s'applique à VM-A n'impose plus de protecteurs TPM." }
        - id: s2
          text: { en: "To stop using ADE on VM-B, you can run `manage-bde -off C:` in the guest, and Azure then reports the disks of VM-B as not encrypted.", fr: "Pour cesser d'utiliser ADE sur VM-B, vous pouvez exécuter `manage-bde -off C:` dans l'invité, et Azure indique alors que les disques de VM-B ne sont pas chiffrés." }
        - id: s3
          text: { en: "You can encrypt the disks of VM-C by enabling ADE with KV1.", fr: "Vous pouvez chiffrer les disques de VM-C en activant ADE avec KV1." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          ADE uses BitLocker with an external key protector, so group policies that enforce TPM protectors must not apply to domain-joined VMs; once the GPO no longer enforces them, the other prerequisites of VM-A (size, key vault in the same region and subscription) are met. ADE must be disabled with the Azure commands (`Disable-AzVMDiskEncryption` or `az vm encryption disable`), because decrypting inside the guest leaves the platform settings out of step. ADE isn't available on v6 and later series, so VM-C needs encryption at host, which is also the recommended choice for new VMs before the September 15, 2028 retirement.
        fr: |
          ADE utilise BitLocker avec un protecteur de clé externe : les stratégies de groupe qui imposent des protecteurs TPM ne doivent donc pas s'appliquer aux machines virtuelles jointes au domaine ; une fois que le GPO ne les impose plus, les autres prérequis de VM-A (taille, coffre de clés dans la même région et le même abonnement) sont remplis. ADE se désactive avec les commandes Azure (`Disable-AzVMDiskEncryption` ou `az vm encryption disable`), car un déchiffrement dans l'invité désaligne les paramètres de la plateforme. ADE n'est pas disponible sur les séries v6 et ultérieures : VM-C a besoin du chiffrement sur l'hôte, qui est aussi le choix recommandé pour les nouvelles machines virtuelles avant la mise hors service du 15 septembre 2028.
      options:
        s2: { en: "Low-level decryption inside the VM doesn't update the platform and extension settings, so Azure can keep reporting the disks as encrypted.", fr: "Un déchiffrement de bas niveau dans la machine virtuelle ne met pas à jour les paramètres de la plateforme et de l'extension : Azure peut continuer d'indiquer que les disques sont chiffrés." }
        s3: { en: "ADE isn't available on v6 series VMs; use encryption at host for VM-C.", fr: "ADE n'est pas disponible sur les machines virtuelles de série v6 ; utilisez le chiffrement sur l'hôte pour VM-C." }
    references:
      - title: Azure Disk Encryption for Windows VMs
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disk-encryption-overview
      - title: Azure Disk Encryption troubleshooting guide
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disk-encryption-troubleshooting

  # ------------------------------------------------------------------ 10
  - id: az802-qz-72-10
    objective: "7.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind Traders has an on-premises AD DS domain whose DNS zones are hosted on two domain controllers, **DC1** and **DC2**. All on-premises servers use DC1 and DC2 as DNS servers. A site-to-site VPN connects the on-premises network to an Azure virtual network named **Hub-VNet**.

        A storage account named **stnwfiles** has a private endpoint for the file service in Hub-VNet. The private DNS zone **privatelink.file.core.windows.net** is linked to Hub-VNet. Azure virtual machines in Hub-VNet resolve stnwfiles.file.core.windows.net to the private address 10.50.1.5. On a server named **FS1** on-premises, the same name resolves to a public address.

        You need all on-premises servers to resolve stnwfiles.file.core.windows.net to its private address. The solution must use Azure-managed DNS services in Azure.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un domaine AD DS local dont les zones DNS sont hébergées sur deux contrôleurs de domaine, **DC1** et **DC2**. Tous les serveurs locaux utilisent DC1 et DC2 comme serveurs DNS. Un VPN site à site relie le réseau local à un réseau virtuel Azure nommé **Hub-VNet**.

        Un compte de stockage nommé **stnwfiles** possède un point de terminaison privé pour le service de fichiers dans Hub-VNet. La zone DNS privée **privatelink.file.core.windows.net** est liée à Hub-VNet. Les machines virtuelles Azure de Hub-VNet résolvent stnwfiles.file.core.windows.net en l'adresse privée 10.50.1.5. Sur un serveur local nommé **FS1**, le même nom se résout en une adresse publique.

        Vous devez faire en sorte que tous les serveurs locaux résolvent stnwfiles.file.core.windows.net en son adresse privée. La solution doit utiliser des services DNS managés par Azure dans Azure.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Deploy an Azure DNS Private Resolver in Hub-VNet with an inbound endpoint.", fr: "Déployer un Azure DNS Private Resolver dans Hub-VNet avec un point de terminaison entrant." } }
        - { id: b, text: { en: "On DC1 and DC2, create a conditional forwarder for file.core.windows.net that targets 168.63.129.16.", fr: "Sur DC1 et DC2, créer un redirecteur conditionnel pour file.core.windows.net qui cible 168.63.129.16." } }
        - { id: c, text: { en: "Deploy an Azure DNS Private Resolver in Hub-VNet with an outbound endpoint and a forwarding ruleset that targets DC1 and DC2.", fr: "Déployer un Azure DNS Private Resolver dans Hub-VNet avec un point de terminaison sortant et un ensemble de règles de transfert qui cible DC1 et DC2." } }
        - { id: d, text: { en: "On DC1 and DC2, create a conditional forwarder for file.core.windows.net that targets the IP address of the inbound endpoint.", fr: "Sur DC1 et DC2, créer un redirecteur conditionnel pour file.core.windows.net qui cible l'adresse IP du point de terminaison entrant." } }
        - { id: e, text: { en: "Link the privatelink.file.core.windows.net zone to the local network gateway of the VPN.", fr: "Lier la zone privatelink.file.core.windows.net à la passerelle de réseau local du VPN." } }
      choose: 2
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Queries for private endpoints must be answered from a virtual network linked to the private DNS zone. An inbound endpoint gives the resolver an address in Hub-VNet that on-premises DNS servers can reach through the VPN, and the on-premises conditional forwarder targets that address. Microsoft recommends forwarding the public zone (file.core.windows.net) rather than the privatelink zone.
        fr: |
          Les requêtes pour les points de terminaison privés doivent recevoir leur réponse depuis un réseau virtuel lié à la zone DNS privée. Un point de terminaison entrant donne au résolveur une adresse dans Hub-VNet que les serveurs DNS locaux peuvent atteindre par le VPN, et le redirecteur conditionnel local cible cette adresse. Microsoft recommande de rediriger la zone publique (file.core.windows.net) plutôt que la zone privatelink.
      options:
        b: { en: "168.63.129.16 is the Azure-provided DNS used from inside virtual networks; a query sent by DC1 or DC2 doesn't originate from the linked virtual network.", fr: "168.63.129.16 est le DNS fourni par Azure, utilisé depuis l'intérieur des réseaux virtuels ; une requête envoyée par DC1 ou DC2 ne provient pas du réseau virtuel lié." }
        c: { en: "An outbound endpoint and a forwarding ruleset send queries from Azure to on-premises DNS servers, the opposite direction.", fr: "Un point de terminaison sortant et un ensemble de règles de transfert envoient les requêtes d'Azure vers les serveurs DNS locaux, la direction opposée." }
        e: { en: "A private DNS zone can be linked only to virtual networks, not to a local network gateway.", fr: "Une zone DNS privée ne peut être liée qu'à des réseaux virtuels, pas à une passerelle de réseau local." }
    references:
      - title: Azure Private Endpoint DNS integration Scenarios
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
      - title: What is Azure DNS Private Resolver?
        url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
