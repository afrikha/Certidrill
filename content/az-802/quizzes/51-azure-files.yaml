chapter: 51-azure-files
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-51-01
    objective: "5.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware has a Windows Server 2022 file server named **FS1**. Users access the folder D:\Shares\Plans on FS1 over SMB. You plan to sync this folder with Azure by using Azure File Sync.

        What should you create in Azure to hold the data of D:\Shares\Plans?
      fr: |
        Litware dispose d'un serveur de fichiers Windows Server 2022 nommé **FS1**. Les utilisateurs accèdent au dossier D:\Shares\Plans de FS1 via SMB. Vous prévoyez de synchroniser ce dossier avec Azure en utilisant Azure File Sync.

        Que devez-vous créer dans Azure pour contenir les données de D:\Shares\Plans ?
    body:
      options:
        - { id: a, text: { en: "A file share resource of the Microsoft.FileShares provider, on SSD with provisioned v2 billing", fr: "Une ressource de partage de fichiers du fournisseur Microsoft.FileShares, sur SSD avec la facturation provisionnée v2" } }
        - { id: b, text: { en: "A classic file share that uses the SMB protocol, in a storage account of the FileStorage kind", fr: "Un partage de fichiers classique qui utilise le protocole SMB, dans un compte de stockage de type FileStorage" } }
        - { id: c, text: { en: "A classic file share that uses the NFS protocol, in a storage account of the FileStorage kind", fr: "Un partage de fichiers classique qui utilise le protocole NFS, dans un compte de stockage de type FileStorage" } }
        - { id: d, text: { en: "A blob container in a StorageV2 storage account that has a hierarchical namespace enabled", fr: "Un conteneur d'objets blob dans un compte de stockage StorageV2 dont l'espace de noms hiérarchique est activé" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Azure File Sync syncs a server endpoint with a cloud endpoint, which is a classic SMB Azure file share in a storage account (resource provider Microsoft.Storage). A FileStorage account with provisioned v2 billing is the recommended choice for new classic file shares.
        fr: |
          Azure File Sync synchronise un point de terminaison de serveur avec un point de terminaison cloud, qui est un partage de fichiers Azure SMB classique dans un compte de stockage (fournisseur de ressources Microsoft.Storage). Un compte FileStorage avec la facturation provisionnée v2 est le choix recommandé pour les nouveaux partages de fichiers classiques.
      options:
        a: { en: "File shares of the Microsoft.FileShares provider support only NFS and don't support Azure File Sync.", fr: "Les partages de fichiers du fournisseur Microsoft.FileShares ne prennent en charge que NFS et ne prennent pas en charge Azure File Sync." }
        c: { en: "Azure File Sync syncs only SMB file shares; an NFS share can't be a cloud endpoint.", fr: "Azure File Sync ne synchronise que des partages de fichiers SMB ; un partage NFS ne peut pas être un point de terminaison cloud." }
        d: { en: "A blob container isn't an Azure file share, so it can't be the cloud endpoint of a sync group.", fr: "Un conteneur d'objets blob n'est pas un partage de fichiers Azure : il ne peut pas être le point de terminaison cloud d'un groupe de synchronisation." }
    references:
      - title: Azure Files management concepts
        url: https://learn.microsoft.com/en-us/azure/storage/files/files-management-concepts

  # ------------------------------------------------------------------ 2
  - id: az802-qz-51-02
    objective: "5.1.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A server named **FS2** started the initial upload of a large server endpoint to Azure File Sync several hours ago. The sync session hasn't completed yet.

        You need to check on FS2 how many items the active session has applied so far. Which event should you review in the Telemetry event log of Azure File Sync?
      fr: |
        Un serveur nommé **FS2** a commencé il y a plusieurs heures le chargement initial d'un point de terminaison de serveur volumineux vers Azure File Sync. La session de synchronisation n'est pas encore terminée.

        Vous devez vérifier sur FS2 combien d'éléments la session active a appliqués jusqu'à présent. Quel événement devez-vous consulter dans le journal d'événements Telemetry d'Azure File Sync ?
    body:
      options:
        - { id: a, text: "Event ID 9102" }
        - { id: b, text: "Event ID 9121" }
        - { id: c, text: "Event ID 9301" }
        - { id: d, text: "Event ID 9302" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Event ID 9302 is logged every 5 to 10 minutes while a sync session is active. It shows the total item count, the applied item count and the per-item error count, so it reports the progress of a session that hasn't completed.
        fr: |
          L'événement 9302 est journalisé toutes les 5 à 10 minutes pendant qu'une session de synchronisation est active. Il indique le nombre total d'éléments, le nombre d'éléments appliqués et le nombre d'erreurs par élément : il rend donc compte de la progression d'une session qui n'est pas terminée.
      options:
        a: { en: "Event ID 9102 is logged only when a sync session completes.", fr: "L'événement 9102 n'est journalisé qu'à la fin d'une session de synchronisation." }
        b: { en: "Event ID 9121 describes one per-item error after a session completes.", fr: "L'événement 9121 décrit une erreur par élément à la fin d'une session." }
        c: { en: "Event ID 9301 shows that the server polls the service for jobs every 30 seconds; it doesn't report session progress.", fr: "L'événement 9301 montre que le serveur interroge le service toutes les 30 secondes pour obtenir des travaux ; il ne rend pas compte de la progression d'une session." }
    references:
      - title: Monitor Azure File Sync
        url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-monitoring

  # ------------------------------------------------------------------ 3
  - id: az802-qz-51-03
    objective: "5.1.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso will migrate 8 TB of archived project files from a file server to a classic Azure file share that uses pay-as-you-go billing on HDD media. After the migration, users will rarely open these files.

        You need to minimize the overall cost of the migration and of the following months. Which access tier strategy should you use for the share?
      fr: |
        Contoso va migrer 8 To de fichiers de projets archivés d'un serveur de fichiers vers un partage de fichiers Azure classique qui utilise la facturation à l'utilisation sur un média HDD. Après la migration, les utilisateurs ouvriront rarement ces fichiers.

        Vous devez réduire au minimum le coût global de la migration et des mois suivants. Quelle stratégie de niveau d'accès devez-vous utiliser pour le partage ?
    body:
      options:
        - { id: a, text: { en: "Create the share in the cool tier and keep it there during and after the migration.", fr: "Créer le partage dans le niveau froid (cool) et l'y laisser pendant et après la migration." } }
        - { id: b, text: { en: "Create the share in the hot tier, and move it to the cool tier after the migration.", fr: "Créer le partage dans le niveau chaud (hot), puis le passer au niveau froid (cool) après la migration." } }
        - { id: c, text: { en: "Create the share in the transaction optimized tier, then choose a tier from the measured usage.", fr: "Créer le partage dans le niveau optimisé pour les transactions, puis choisir un niveau d'après l'usage mesuré." } }
        - { id: d, text: { en: "Create the share in the cool tier, and move it to the hot tier once users access it.", fr: "Créer le partage dans le niveau froid (cool), puis le passer au niveau chaud (hot) dès que les utilisateurs y accèdent." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A migration generates a large number of write transactions, which are the cheapest in the transaction optimized tier and the most expensive in the cool tier. Microsoft recommends creating the share in the transaction optimized tier for the migration, then choosing the tier from normal usage after a few days or weeks, because migration transactions aren't representative.
        fr: |
          Une migration génère un grand nombre de transactions d'écriture, les moins chères dans le niveau optimisé pour les transactions et les plus chères dans le niveau froid (cool). Microsoft recommande de créer le partage dans le niveau optimisé pour les transactions pour la migration, puis de choisir le niveau d'après l'usage normal après quelques jours ou semaines, car les transactions de la migration ne sont pas représentatives.
      options:
        a: { en: "The cool tier has the lowest storage price but the highest transaction prices, so the millions of writes of the migration cost the most there.", fr: "Le niveau froid (cool) a le prix de stockage le plus bas mais les prix de transaction les plus élevés : les millions d'écritures de la migration y coûtent le plus cher." }
        b: { en: "Hot transactions cost more than transaction optimized ones, so hot isn't the cheapest tier for a write-heavy migration.", fr: "Les transactions du niveau chaud (hot) coûtent plus que celles du niveau optimisé pour les transactions : ce n'est pas le niveau le moins cher pour une migration riche en écritures." }
        d: { en: "Migrating into cool pays the highest write prices, and moving from cool to a hotter tier adds read and data retrieval charges.", fr: "Migrer dans le niveau froid (cool) fait payer les prix d'écriture les plus élevés, et passer du niveau froid à un niveau plus chaud ajoute des frais de lecture et de récupération des données." }
    references:
      - title: Understand Azure Files Billing
        url: https://learn.microsoft.com/en-us/azure/storage/files/understanding-billing

  # ------------------------------------------------------------------ 4
  - id: az802-qz-51-04
    objective: "5.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware has no on-premises AD DS. Its Azure virtual machines are joined to a Microsoft Entra Domain Services managed domain named aadds.proseware.com and aren't Microsoft Entra joined. Users sign in to the virtual machines with cloud-only Microsoft Entra accounts.

        You need the users to access an SMB Azure file share named **reports** from the virtual machines by using Kerberos with their own identities. Windows ACLs must control access to each folder.

        Which identity source should you enable on the storage account?
      fr: |
        Proseware ne dispose d'aucun AD DS local. Ses machines virtuelles Azure sont jointes à un domaine managé Microsoft Entra Domain Services nommé aadds.proseware.com et ne sont pas jointes à Microsoft Entra. Les utilisateurs se connectent aux machines virtuelles avec des comptes Microsoft Entra cloud uniquement.

        Vous devez permettre aux utilisateurs d'accéder à un partage de fichiers Azure SMB nommé **reports** depuis les machines virtuelles en utilisant Kerberos avec leurs propres identités. Les ACL Windows doivent contrôler l'accès à chaque dossier.

        Quelle source d'identité devez-vous activer sur le compte de stockage ?
    body:
      options:
        - { id: a, text: "On-premises AD DS" }
        - { id: b, text: "Microsoft Entra Kerberos" }
        - { id: c, text: "Microsoft Entra Domain Services" }
        - { id: d, text: { en: "None: mount the share with the storage account key", fr: "Aucune : monter le partage avec la clé du compte de stockage" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          With Microsoft Entra Domain Services as the identity source, clients joined to the managed domain obtain Kerberos tickets from it, and both cloud-only and hybrid identities are supported. Share-level permissions and Windows ACLs then apply to each user.
        fr: |
          Avec Microsoft Entra Domain Services comme source d'identité, les clients joints au domaine managé en obtiennent des tickets Kerberos, et les identités cloud uniquement comme hybrides sont prises en charge. Les autorisations au niveau du partage et les ACL Windows s'appliquent ensuite à chaque utilisateur.
      options:
        a: { en: "Proseware has no on-premises AD DS, and that identity source supports only hybrid identities.", fr: "Proseware n'a pas d'AD DS local, et cette source d'identité ne prend en charge que les identités hybrides." }
        b: { en: "Microsoft Entra Kerberos requires clients that are Microsoft Entra joined or hybrid joined, which these virtual machines aren't.", fr: "Microsoft Entra Kerberos exige des clients joints à Microsoft Entra ou joints de manière hybride, ce que ne sont pas ces machines virtuelles." }
        d: { en: "The storage account key gives every user the same administrative access, without their own identities.", fr: "La clé du compte de stockage donne à tous les utilisateurs le même accès administrateur, sans leurs propres identités." }
    references:
      - title: Overview - Azure Files Identity-Based Authentication
        url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-active-directory-overview

  # ------------------------------------------------------------------ 5
  - id: az802-qz-51-05
    objective: "5.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys has a sync group whose cloud endpoint is a 10 TiB Azure file share named **designs**. A server endpoint on **FS-PAR** in Paris and a server endpoint on **FS-SYD** in Sydney use cloud tiering. Volume D: of FS-SYD is 2 TiB.

        Designers in Paris create and modify files on FS-PAR during the day. The next morning, Sydney users wait each time they open one of these files on FS-SYD.

        You need new and modified files to be downloaded to FS-SYD as soon as they change in the Azure file share. Unchanged files must not be downloaded, and you must not use a scheduled script. What should you do?
      fr: |
        Wingtip Toys dispose d'un groupe de synchronisation dont le point de terminaison cloud est un partage de fichiers Azure de 10 Tio nommé **designs**. Un point de terminaison de serveur sur **FS-PAR** à Paris et un point de terminaison de serveur sur **FS-SYD** à Sydney utilisent la hiérarchisation cloud. Le volume D: de FS-SYD fait 2 Tio.

        Les designers de Paris créent et modifient des fichiers sur FS-PAR pendant la journée. Le lendemain matin, les utilisateurs de Sydney patientent chaque fois qu'ils ouvrent l'un de ces fichiers sur FS-SYD.

        Vous devez faire en sorte que les fichiers nouveaux et modifiés soient téléchargés sur FS-SYD dès qu'ils changent dans le partage de fichiers Azure. Les fichiers inchangés ne doivent pas être téléchargés, et vous ne devez pas utiliser de script planifié. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Disable cloud tiering on the server endpoint of FS-SYD.", fr: "Désactiver la hiérarchisation cloud sur le point de terminaison de serveur de FS-SYD." } }
        - { id: b, text: { en: "Run `Invoke-AzStorageSyncChangeDetection` on the cloud endpoint.", fr: "Exécuter `Invoke-AzStorageSyncChangeDetection` sur le point de terminaison cloud." } }
        - { id: c, text: { en: "Run `Invoke-StorageSyncFileRecall` on the server endpoint path of FS-SYD.", fr: "Exécuter `Invoke-StorageSyncFileRecall` sur le chemin du point de terminaison de serveur de FS-SYD." } }
        - { id: d, text: { en: "Change the Azure file share download mode of the FS-SYD server endpoint.", fr: "Modifier le mode de téléchargement du partage de fichiers Azure du point de terminaison de serveur de FS-SYD." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Proactive recall is set in the cloud tiering section of a server endpoint, under the Azure file share download mode. It makes the server download files as soon as they are created or changed in the Azure file share, instead of waiting until a user opens them, while unchanged tiered files stay in the cloud.
        fr: |
          Le rappel proactif se définit dans la section de hiérarchisation cloud d'un point de terminaison de serveur, sous le mode de téléchargement du partage de fichiers Azure. Il fait télécharger par le serveur les fichiers dès qu'ils sont créés ou modifiés dans le partage de fichiers Azure, au lieu d'attendre qu'un utilisateur les ouvre, tandis que les fichiers hiérarchisés inchangés restent dans le cloud.
      options:
        a: { en: "Without cloud tiering, FS-SYD would have to store the whole 10 TiB share on a 2 TiB volume.", fr: "Sans hiérarchisation cloud, FS-SYD devrait stocker la totalité du partage de 10 Tio sur un volume de 2 Tio." }
        b: { en: "Change detection discovers changes made directly in the Azure file share; changes from FS-PAR already sync, and detection downloads no content.", fr: "La détection des modifications découvre les changements faits directement dans le partage de fichiers Azure ; les changements de FS-PAR se synchronisent déjà, et la détection ne télécharge aucun contenu." }
        c: { en: "A recall on the whole path downloads unchanged tiered files too, and it must be run again each time.", fr: "Un rappel sur tout le chemin télécharge aussi les fichiers hiérarchisés inchangés, et il faut le relancer à chaque fois." }
    references:
      - title: Understand Azure File Sync Cloud Tiering
        url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-cloud-tiering-overview
      - title: Deploy Azure File Sync
        url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide

  # ------------------------------------------------------------------ 6
  - id: az802-qz-51-06
    objective: "5.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam plans to sync two Windows Server 2025 file servers in West Europe with a classic SMB Azure file share by using Azure File Sync. The storage account must meet the following requirements:

        - Storage, IOPS and throughput are provisioned and billed separately.
        - The data is replicated to a second Azure region to protect against a regional disaster.

        Your security baseline disables storage account key access on every new storage account, unless a service that you deploy requires it.

        Which storage account configuration should you use?
      fr: |
        Fabrikam prévoit de synchroniser deux serveurs de fichiers Windows Server 2025 situés en Europe Ouest avec un partage de fichiers Azure SMB classique en utilisant Azure File Sync. Le compte de stockage doit répondre aux exigences suivantes :

        - Le stockage, les IOPS et le débit sont provisionnés et facturés séparément.
        - Les données sont répliquées vers une seconde région Azure pour se protéger contre un sinistre régional.

        Votre référentiel de sécurité désactive l'accès par clé du compte de stockage sur chaque nouveau compte de stockage, sauf si un service que vous déployez l'exige.

        Quelle configuration de compte de stockage devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Kind FileStorage, SKU PremiumV2_ZRS, storage account key access disabled", fr: "Type FileStorage, référence SKU PremiumV2_ZRS, accès par clé du compte de stockage désactivé" } }
        - { id: b, text: { en: "Kind StorageV2, SKU Standard_GRS, storage account key access disabled", fr: "Type StorageV2, référence SKU Standard_GRS, accès par clé du compte de stockage désactivé" } }
        - { id: c, text: { en: "Kind FileStorage, SKU StandardV2_GRS, storage account key access disabled", fr: "Type FileStorage, référence SKU StandardV2_GRS, accès par clé du compte de stockage désactivé" } }
        - { id: d, text: { en: "Kind FileStorage, SKU StandardV2_GRS, storage account key access enabled", fr: "Type FileStorage, référence SKU StandardV2_GRS, accès par clé du compte de stockage activé" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Separate provisioning of storage, IOPS and throughput is the provisioned v2 model, which uses a FileStorage account. Geo-redundancy exists only on HDD media, so the SKU is StandardV2_GRS (or StandardV2_GZRS). Azure File Sync lists Allow storage account key access set to Enabled as a deployment prerequisite, so the baseline exception applies to this account.
        fr: |
          Le provisionnement séparé du stockage, des IOPS et du débit correspond au modèle provisionné v2, qui utilise un compte FileStorage. La géoredondance n'existe que sur le média HDD : la référence SKU est donc StandardV2_GRS (ou StandardV2_GZRS). Azure File Sync impose comme prérequis de déploiement que Allow storage account key access soit défini sur Enabled : l'exception du référentiel s'applique donc à ce compte.
      options:
        a: { en: "SSD media offers only LRS and ZRS: zone redundancy stays inside West Europe, and key access must stay enabled for Azure File Sync.", fr: "Le média SSD n'offre que LRS et ZRS : la redondance de zone reste dans la région Europe Ouest, et l'accès par clé doit rester activé pour Azure File Sync." }
        b: { en: "A StorageV2 account uses pay-as-you-go billing, without provisioned IOPS and throughput, and key access must stay enabled.", fr: "Un compte StorageV2 utilise la facturation à l'utilisation, sans IOPS ni débit provisionnés, et l'accès par clé doit rester activé." }
        c: { en: "The SKU is right, but Azure File Sync requires storage account key access to be enabled on the account.", fr: "La référence SKU convient, mais Azure File Sync exige que l'accès par clé du compte de stockage soit activé sur le compte." }
    references:
      - title: Create a classic file share - Azure Files
        url: https://learn.microsoft.com/en-us/azure/storage/files/create-classic-file-share
      - title: Deploy Azure File Sync
        url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide

  # ------------------------------------------------------------------ 7
  - id: az802-qz-51-07
    objective: "5.1.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys has a file server named **FS-OLD** that runs Windows Server 2012 R2. Its NTFS shares hold 9 TB in 15 million files. You plan to move these shares to Azure file shares and then decommission FS-OLD.

        The solution must meet the following requirements:

        - After the migration, users access the Azure file shares directly, without an on-premises cache.
        - File ACLs, timestamps and attributes are preserved.
        - No new Windows Server is deployed for the migration.

        Which two tools can you use? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un serveur de fichiers nommé **FS-OLD** qui exécute Windows Server 2012 R2. Ses partages NTFS contiennent 9 To répartis en 15 millions de fichiers. Vous prévoyez de déplacer ces partages vers des partages de fichiers Azure, puis de mettre FS-OLD hors service.

        La solution doit répondre aux exigences suivantes :

        - Après la migration, les utilisateurs accèdent directement aux partages de fichiers Azure, sans cache local.
        - Les ACL, les horodatages et les attributs des fichiers sont conservés.
        - Aucun nouveau serveur Windows Server n'est déployé pour la migration.

        Quels sont les deux outils que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "AzCopy sync jobs run from FS-OLD to the Azure file shares", fr: "Des tâches AzCopy sync exécutées depuis FS-OLD vers les partages de fichiers Azure" } }
        - { id: b, text: { en: "Azure Storage Mover with an agent deployed near FS-OLD", fr: "Azure Storage Mover avec un agent déployé près de FS-OLD" } }
        - { id: c, text: { en: "The Azure File Sync agent installed on FS-OLD", fr: "L'agent Azure File Sync installé sur FS-OLD" } }
        - { id: d, text: { en: "Robocopy run on FS-OLD to the mounted Azure file shares", fr: "Robocopy exécuté sur FS-OLD vers les partages de fichiers Azure montés" } }
        - { id: e, text: { en: "Azure Storage Explorer run on FS-OLD to upload the shares", fr: "L'Explorateur Stockage Azure exécuté sur FS-OLD pour charger les partages" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          For a Windows Server 2012 R2 source and a cloud-only target, Microsoft lists Azure Storage Mover and Robocopy to a mounted Azure file share; both preserve full file fidelity. Storage Mover runs its migration agent close to the source share, and Robocopy can run on FS-OLD itself, so neither requires a new Windows Server.
        fr: |
          Pour une source Windows Server 2012 R2 et une cible cloud uniquement, Microsoft indique Azure Storage Mover et Robocopy vers un partage de fichiers Azure monté ; les deux conservent une fidélité complète des fichiers. Storage Mover exécute son agent de migration près du partage source, et Robocopy peut s'exécuter sur FS-OLD lui-même : aucun des deux n'exige de nouveau serveur Windows Server.
      options:
        a: { en: "AzCopy can lose some file fidelity, and an AzCopy sync job supports up to 10 million files.", fr: "AzCopy peut perdre une partie de la fidélité des fichiers, et une tâche AzCopy sync prend en charge jusqu'à 10 millions de fichiers." }
        c: { en: "Azure File Sync supports Windows Server 2016 to 2025; a 2012 R2 server would need a new server, which is excluded.", fr: "Azure File Sync prend en charge Windows Server 2016 à 2025 ; un serveur 2012 R2 exigerait un nouveau serveur, ce qui est exclu." }
        e: { en: "Azure Storage Explorer loses most file fidelity, such as ACLs.", fr: "L'Explorateur Stockage Azure perd l'essentiel de la fidélité des fichiers, comme les ACL." }
    references:
      - title: Migration Overview for SMB Azure File Shares
        url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-migration-overview

  # ------------------------------------------------------------------ 8
  - id: az802-qz-51-08
    objective: "5.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has a two-node Windows Server 2022 failover cluster named **FS-CL1** with two clustered roles:

        | Clustered role | Type | Data location |
        | --- | --- | --- |
        | FS-GEN | File Server for general use | Clustered disk E: (NTFS) |
        | FS-SOFS | Scale-Out File Server | C:\ClusterStorage\Volume1 (Cluster Shared Volume) |

        A Storage Sync Service named **sss-contoso** and a storage account named **contosofiles01** that contains a classic SMB file share named **projects** are in West Europe. An administrator named Ana holds the Contributor role on sss-contoso and the Reader role on contosofiles01.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un cluster de basculement Windows Server 2022 à deux nœuds nommé **FS-CL1** avec deux rôles en cluster :

        | Rôle en cluster | Type | Emplacement des données |
        | --- | --- | --- |
        | FS-GEN | Serveur de fichiers pour une utilisation générale | Disque en cluster E: (NTFS) |
        | FS-SOFS | Serveur de fichiers avec montée en puissance parallèle | C:\ClusterStorage\Volume1 (volume partagé de cluster) |

        Un service de synchronisation de stockage nommé **sss-contoso** et un compte de stockage nommé **contosofiles01**, qui contient un partage de fichiers SMB classique nommé **projects**, se trouvent en Europe Ouest. Une administratrice nommée Ana détient le rôle Contributor sur sss-contoso et le rôle Reader sur contosofiles01.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "To sync data of FS-GEN, you must install the Azure File Sync agent on both nodes of FS-CL1.", fr: "Pour synchroniser des données de FS-GEN, vous devez installer l'agent Azure File Sync sur les deux nœuds de FS-CL1." }
        - id: s2
          text: { en: "You can create a server endpoint for the path C:\\ClusterStorage\\Volume1\\Projects of FS-SOFS.", fr: "Vous pouvez créer un point de terminaison de serveur pour le chemin C:\\ClusterStorage\\Volume1\\Projects de FS-SOFS." }
        - id: s3
          text: { en: "With her current roles, Ana can create a cloud endpoint that points to the projects share.", fr: "Avec ses rôles actuels, Ana peut créer un point de terminaison cloud qui pointe vers le partage projects." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Azure File Sync supports failover clusters only for the File Server for general use role on clustered disks, and the agent must be installed on every node. Scale-Out File Server and Cluster Shared Volumes aren't supported. Contributor on the Storage Sync Service lets Ana manage sync groups, but creating a cloud endpoint also needs storage account permissions such as listKeys, which Reader doesn't include.
        fr: |
          Azure File Sync ne prend en charge les clusters de basculement que pour le rôle Serveur de fichiers pour une utilisation générale sur des disques en cluster, et l'agent doit être installé sur chaque nœud. Le serveur de fichiers avec montée en puissance parallèle et les volumes partagés de cluster ne sont pas pris en charge. Contributor sur le service de synchronisation de stockage permet à Ana de gérer les groupes de synchronisation, mais créer un point de terminaison cloud exige aussi des autorisations sur le compte de stockage, comme listKeys, que Reader n'inclut pas.
      options:
        s2: { en: "Server endpoints aren't supported on Scale-Out File Server or Cluster Shared Volumes.", fr: "Les points de terminaison de serveur ne sont pas pris en charge sur un serveur de fichiers avec montée en puissance parallèle ni sur des volumes partagés de cluster." }
        s3: { en: "A user with only read permissions on the storage account can't create or update cloud endpoints; assign a role such as Reader and Data Access or Storage Account Contributor.", fr: "Un utilisateur qui n'a que des autorisations de lecture sur le compte de stockage ne peut ni créer ni mettre à jour de points de terminaison cloud ; attribuez un rôle comme Reader and Data Access ou Storage Account Contributor." }
    references:
      - title: Plan an Azure File Sync deployment
        url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-planning

  # ------------------------------------------------------------------ 9
  - id: az802-qz-51-09
    objective: "5.1.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind replicates the folder D:\Engineering between three Windows Server 2022 servers by using DFS Replication: **FS1** at the head office, and **FS2** and **FS3** in branch offices. FS3 joined the replication group last week, and its initial replication hasn't finished. Volume D: of FS2 is 90 percent full.

        You will replace DFS Replication with Azure File Sync. All three servers will have a server endpoint in the same sync group, and users must not lose any change during the migration.

        How should you complete the migration plan? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind réplique le dossier D:\Engineering entre trois serveurs Windows Server 2022 avec la réplication DFS : **FS1** au siège, ainsi que **FS2** et **FS3** dans des succursales. FS3 a rejoint le groupe de réplication la semaine dernière, et sa réplication initiale n'est pas terminée. Le volume D: de FS2 est plein à 90 %.

        Vous allez remplacer la réplication DFS par Azure File Sync. Les trois serveurs auront un point de terminaison de serveur dans le même groupe de synchronisation, et les utilisateurs ne doivent perdre aucune modification pendant la migration.

        Comment devez-vous compléter le plan de migration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Server of the first server endpoint: [[first]]

          Cloud tiering on the first server endpoint: [[tier]]

          Server endpoints of the two other servers: [[others]]
        fr: |
          Serveur du premier point de terminaison de serveur : [[first]]

          Hiérarchisation cloud sur le premier point de terminaison de serveur : [[tier]]

          Points de terminaison de serveur des deux autres serveurs : [[others]]
      slots:
        - id: first
          options:
            - { id: fs1, text: "FS1" }
            - { id: fs2, text: "FS2" }
            - { id: fs3, text: "FS3" }
        - id: tier
          options:
            - { id: off, text: { en: "Disabled", fr: "Désactivée" } }
            - { id: vfs, text: { en: "Enabled, with a volume free space policy of 20 percent", fr: "Activée, avec une stratégie d'espace libre sur le volume de 20 %" } }
            - { id: date, text: { en: "Enabled, with a date policy of 30 days", fr: "Activée, avec une stratégie de délai de 30 jours" } }
        - id: others
          options:
            - { id: before, text: { en: "Created while DFS Replication still runs, without cloud tiering", fr: "Créés pendant que la réplication DFS s'exécute encore, sans hiérarchisation cloud" } }
            - { id: after, text: { en: "Created after DFS Replication is disabled, without cloud tiering", fr: "Créés après la désactivation de la réplication DFS, sans hiérarchisation cloud" } }
            - { id: aftertier, text: { en: "Created after DFS Replication is disabled, with cloud tiering on FS2", fr: "Créés après la désactivation de la réplication DFS, avec la hiérarchisation cloud sur FS2" } }
    answer:
      values: { first: fs1, tier: off, others: after }
    explanation:
      correct:
        en: |
          The migration starts on the server that holds the full data set, here FS1, because FS3 hasn't finished its initial replication. Cloud tiering stays disabled on every server endpoint until DFS Replication is retired, so that the two engines don't act on the same files. After all the data of FS1 has synced to the cloud endpoint, you disable DFS Replication, then create the other server endpoints without tiering; tiering, for example on the full volume of FS2, comes last.
        fr: |
          La migration commence sur le serveur qui détient le jeu de données complet, ici FS1, car FS3 n'a pas terminé sa réplication initiale. La hiérarchisation cloud reste désactivée sur tous les points de terminaison de serveur jusqu'à la mise hors service de la réplication DFS, pour que les deux moteurs n'agissent pas sur les mêmes fichiers. Une fois toutes les données de FS1 synchronisées vers le point de terminaison cloud, vous désactivez la réplication DFS, puis créez les autres points de terminaison de serveur sans hiérarchisation ; la hiérarchisation, par exemple sur le volume plein de FS2, vient en dernier.
      options:
        fs3: { en: "FS3 doesn't hold the full data set yet, because its initial replication hasn't finished.", fr: "FS3 ne détient pas encore le jeu de données complet, car sa réplication initiale n'est pas terminée." }
        before: { en: "Server endpoints created while DFS Replication runs let two replication engines change the same files.", fr: "Des points de terminaison de serveur créés pendant que la réplication DFS s'exécute laissent deux moteurs de réplication modifier les mêmes fichiers." }
        aftertier: { en: "Cloud tiering is enabled only once sync has completed and DFS Replication is retired.", fr: "La hiérarchisation cloud ne s'active qu'une fois la synchronisation terminée et la réplication DFS mise hors service." }
    references:
      - title: Deploy Azure File Sync
        url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide
      - title: Plan an Azure File Sync deployment
        url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-planning

  # ------------------------------------------------------------------ 10
  - id: az802-qz-51-10
    objective: "5.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind has an AD DS domain named northwind.com that is synced to Microsoft Entra ID. A storage account named **nwlegal01** uses AD DS authentication and contains an SMB Azure file share named **legal**. The access to legal is configured as follows:

        | Layer | Configuration |
        | --- | --- |
        | Default share-level permission of nwlegal01 | Storage File Data SMB Share Reader |
        | Windows ACL of the root of legal (inherited by all items) | Legal-Team: Modify |

        A user named User3 is a member of Legal-Team and must create and modify files in legal. Ten minutes ago, you assigned the Storage File Data SMB Share Contributor role on legal to an account named User3 in the Azure portal. User3 maps legal from a domain-joined computer and can open files, but can't save any change.

        Which two issues could cause this behavior?

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind dispose d'un domaine AD DS nommé northwind.com, synchronisé avec Microsoft Entra ID. Un compte de stockage nommé **nwlegal01** utilise l'authentification AD DS et contient un partage de fichiers Azure SMB nommé **legal**. L'accès à legal est configuré comme suit :

        | Couche | Configuration |
        | --- | --- |
        | Autorisation par défaut au niveau du partage de nwlegal01 | Storage File Data SMB Share Reader |
        | ACL Windows de la racine de legal (héritée par tous les éléments) | Legal-Team : Modify |

        Un utilisateur nommé User3 est membre de Legal-Team et doit créer et modifier des fichiers dans legal. Il y a dix minutes, vous avez attribué le rôle Storage File Data SMB Share Contributor sur legal à un compte nommé User3 dans le portail Azure. User3 monte legal depuis un ordinateur joint au domaine et peut ouvrir des fichiers, mais ne peut enregistrer aucune modification.

        Quels sont les deux problèmes qui pourraient provoquer ce comportement ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The default share-level permission takes precedence over role assignments made on a share.", fr: "L'autorisation par défaut au niveau du partage l'emporte sur les attributions de rôles faites sur un partage." } }
        - { id: b, text: { en: "The new role assignment hasn't propagated yet; share-level changes can take about 30 minutes.", fr: "La nouvelle attribution de rôle ne s'est pas encore propagée ; les modifications au niveau du partage peuvent prendre environ 30 minutes." } }
        - { id: c, text: { en: "The Modify ACL is more restrictive than the Contributor role, so only read access remains.", fr: "L'ACL Modify est plus restrictive que le rôle Contributor : seul l'accès en lecture subsiste." } }
        - { id: d, text: { en: "The role was assigned to a cloud-only account named User3, not to the identity synced from AD DS.", fr: "Le rôle a été attribué à un compte cloud uniquement nommé User3, et non à l'identité synchronisée depuis AD DS." } }
        - { id: e, text: { en: "The role should have been assigned at the scope of nwlegal01 instead of the legal share.", fr: "Le rôle aurait dû être attribué à l'étendue de nwlegal01 plutôt qu'à celle du partage legal." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Until the Contributor assignment applies to User3, only the default Reader permission applies at the share level, which matches the symptom. Share-level permission changes usually take effect within 30 minutes, and with AD DS authentication the role must be assigned to the Microsoft Entra identity synced from the user's AD DS account; a cloud-only account with the same name doesn't match the Kerberos identity of User3.
        fr: |
          Tant que l'attribution Contributor ne s'applique pas à User3, seule l'autorisation Reader par défaut s'applique au niveau du partage, ce qui correspond au symptôme. Les modifications d'autorisations au niveau du partage prennent en général effet en 30 minutes, et avec l'authentification AD DS le rôle doit être attribué à l'identité Microsoft Entra synchronisée depuis le compte AD DS de l'utilisateur ; un compte cloud uniquement du même nom ne correspond pas à l'identité Kerberos de User3.
      options:
        a: { en: "When both a default share-level permission and a role assignment apply, the higher permission wins.", fr: "Quand une autorisation par défaut au niveau du partage et une attribution de rôle s'appliquent toutes les deux, l'autorisation la plus élevée l'emporte." }
        c: { en: "Modify allows creating and changing files, so combined with Contributor it allows writes.", fr: "Modify permet de créer et de modifier des fichiers : combinée à Contributor, elle autorise les écritures." }
        e: { en: "A share-level role can be assigned on the share itself; the share scope is valid and is the most restrictive choice.", fr: "Un rôle au niveau du partage peut être attribué sur le partage lui-même ; l'étendue du partage est valide et c'est le choix le plus restrictif." }
    references:
      - title: Assign Share-Level Permissions for Azure Files
        url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions
