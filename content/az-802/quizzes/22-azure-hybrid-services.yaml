chapter: 22-azure-hybrid-services
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-22-01
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. installed the Azure Connected Machine agent on an on-premises server named **SRV1** that runs Windows Server 2022. SRV1 isn't connected to Azure Arc yet. Before you connect it, you need to verify that SRV1 can reach the network endpoints that Azure Arc requires in the West Europe region.

        Which command should you run on SRV1?
      fr: |
        Contoso, Ltd. a installé l'agent Azure Connected Machine sur un serveur local nommé **SRV1** qui exécute Windows Server 2022. SRV1 n'est pas encore connecté à Azure Arc. Avant de le connecter, vous devez vérifier que SRV1 peut atteindre les points de terminaison réseau qu'Azure Arc exige dans la région Europe Ouest.

        Quelle commande devez-vous exécuter sur SRV1 ?
    body:
      options:
        - { id: a, text: "`azcmagent show`" }
        - { id: b, text: "`azcmagent config list`" }
        - { id: c, text: "`azcmagent connect --location westeurope`" }
        - { id: d, text: "`azcmagent check --location westeurope`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `azcmagent check` runs network connectivity tests against each endpoint the agent requires and shows, for each one, whether it was reached directly, through a proxy, a private endpoint or Azure Arc gateway. The `--location` parameter selects the region to test, which is needed when the machine isn't connected yet.
        fr: |
          `azcmagent check` exécute des tests de connectivité réseau vers chaque point de terminaison dont l'agent a besoin et indique pour chacun s'il a été atteint en direct, via un proxy, un point de terminaison privé ou la passerelle Azure Arc. Le paramètre `--location` choisit la région à tester, ce qui est nécessaire quand la machine n'est pas encore connectée.
      options:
        a: { en: "azcmagent show displays the agent status and its connection to Azure; it doesn't test the endpoints.", fr: "azcmagent show affiche l'état de l'agent et sa connexion à Azure ; il ne teste pas les points de terminaison." }
        b: { en: "azcmagent config list shows the local agent settings, such as the proxy and extension lists.", fr: "azcmagent config list affiche les paramètres locaux de l'agent, comme le proxy et les listes d'extensions." }
        c: { en: "azcmagent connect creates the Azure resource and connects the server, which you must not do yet.", fr: "azcmagent connect crée la ressource Azure et connecte le serveur, ce que vous ne devez pas encore faire." }
    references:
      - title: CLI reference for azcmagent check
        url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/azcmagent-check

  # ------------------------------------------------------------------ 2
  - id: az802-qz-22-02
    objective: "2.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. has on-premises servers that are onboarded to Azure Arc. You assign a machine configuration policy that sets a list of Windows settings. The settings must be applied to each server once. Afterwards, if a local administrator changes a setting, the server must be reported as non-compliant, but the change must not be reverted automatically.

        Which assignment type should the machine configuration assignment use?
      fr: |
        Fabrikam, Inc. dispose de serveurs locaux intégrés à Azure Arc. Vous affectez une stratégie de configuration de machine qui définit une liste de paramètres Windows. Les paramètres doivent être appliqués une fois à chaque serveur. Ensuite, si un administrateur local modifie un paramètre, le serveur doit être signalé comme non conforme, mais la modification ne doit pas être annulée automatiquement.

        Quel type d'affectation l'affectation de configuration de machine doit-elle utiliser ?
    body:
      options:
        - { id: a, text: Audit }
        - { id: b, text: ApplyAndMonitor }
        - { id: c, text: ApplyAndAutoCorrect }
        - { id: d, text: DeployIfNotExists }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          ApplyAndMonitor applies the configuration to the machine once and then monitors it. If the machine drifts and becomes non-compliant, the setting isn't corrected automatically unless a remediation is triggered.
        fr: |
          ApplyAndMonitor applique la configuration à la machine une fois, puis la surveille. Si la machine dérive et devient non conforme, le paramètre n'est pas corrigé automatiquement, sauf si une correction est déclenchée.
      options:
        a: { en: "Audit only reports the state of the machine and never applies the settings.", fr: "Audit signale uniquement l'état de la machine et n'applique jamais les paramètres." }
        c: { en: "ApplyAndAutoCorrect reverts drift at the next evaluation, which the requirement forbids.", fr: "ApplyAndAutoCorrect annule la dérive à l'évaluation suivante, ce que l'exigence interdit." }
        d: { en: "DeployIfNotExists is an Azure Policy effect, not a value of the assignment type of a machine configuration assignment.", fr: "DeployIfNotExists est un effet Azure Policy, pas une valeur du type d'affectation d'une affectation de configuration de machine." }
    references:
      - title: Remediation options for machine configuration
        url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/concepts/remediation-options

  # ------------------------------------------------------------------ 3
  - id: az802-qz-22-03
    objective: "2.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has an Azure Automation account named **AA1**. A PowerShell 7.4 runbook named **Archive-Blobs** in AA1 moves old blobs between Azure storage accounts and authenticates with the managed identity of AA1. Each night, the runbook starts from a schedule in the Azure sandbox. After three hours, the job status becomes **Stopped**, although the work needs about five hours.

        You need the runbook to finish its work in a single job each night. What should you do?
      fr: |
        Tailspin Toys dispose d'un compte Automation nommé **AA1**. Un runbook PowerShell 7.4 nommé **Archive-Blobs** dans AA1 déplace d'anciens objets blob entre des comptes de stockage Azure et s'authentifie avec l'identité managée d'AA1. Chaque nuit, le runbook démarre depuis une planification dans le bac à sable Azure. Au bout de trois heures, l'état du travail passe à **Stopped**, alors que le traitement dure environ cinq heures.

        Vous devez faire en sorte que le runbook termine son traitement en un seul travail chaque nuit. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Change the runtime version of the runbook to PowerShell 7.6.", fr: "Passer la version d'exécution du runbook à PowerShell 7.6." } }
        - { id: b, text: { en: "Rewrite the runbook as a Python 3.10 runbook.", fr: "Réécrire le runbook sous forme de runbook Python 3.10." } }
        - { id: c, text: { en: "Run the schedule on a Hybrid Runbook Worker group.", fr: "Exécuter la planification sur un groupe Runbook Worker hybride." } }
        - { id: d, text: { en: "Start the runbook from a webhook instead of a schedule.", fr: "Démarrer le runbook depuis un webhook au lieu d'une planification." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Under fair share, Azure stops any cloud job that runs for more than three hours, and PowerShell and Python jobs aren't restarted. Hybrid Runbook Workers aren't limited by fair share and have no limit on how long a runbook can run, so a long-running job should run on a Hybrid Runbook Worker group; the runbook can still use a managed identity to reach Azure.
        fr: |
          Avec la répartition équitable, Azure arrête tout travail cloud qui s'exécute plus de trois heures, et les travaux PowerShell et Python ne sont pas redémarrés. Les Runbook Workers hybrides ne sont pas soumis à la répartition équitable et n'ont pas de limite de durée d'exécution : un travail de longue durée doit donc s'exécuter sur un groupe Runbook Worker hybride ; le runbook peut toujours utiliser une identité managée pour atteindre Azure.
      options:
        a: { en: "The runtime version doesn't change the sandbox limits: the job is still stopped after three hours.", fr: "La version d'exécution ne change pas les limites du bac à sable : le travail est toujours arrêté au bout de trois heures." }
        b: { en: "Python jobs in the sandbox are stopped by fair share too.", fr: "Les travaux Python dans le bac à sable sont eux aussi arrêtés par la répartition équitable." }
        d: { en: "A webhook only changes how the job starts; the job still runs in the sandbox.", fr: "Un webhook ne change que la façon dont le travail démarre ; il s'exécute toujours dans le bac à sable." }
    references:
      - title: Runbook execution in Azure Automation
        url: https://learn.microsoft.com/en-us/azure/automation/automation-runbook-execution

  # ------------------------------------------------------------------ 4
  - id: az802-qz-22-04
    objective: "2.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation patches 12 Azure Arc-enabled servers by using a maintenance configuration named **MC-Prod** in Azure Update Manager. MC-Prod runs every Saturday and is also associated with other servers. The servers get updates from Microsoft Update.

        Microsoft releases an emergency security update, KB5099123, on a Tuesday. You need to install only this update on the 12 servers tonight. The servers must restart only if the update needs it. MC-Prod must not be modified.

        What should you do?
      fr: |
        Adatum Corporation applique les correctifs à 12 serveurs activés pour Azure Arc à l'aide d'une configuration de maintenance nommée **MC-Prod** dans le Gestionnaire de mise à jour Azure. MC-Prod s'exécute chaque samedi et est aussi associée à d'autres serveurs. Les serveurs obtiennent leurs mises à jour depuis Microsoft Update.

        Microsoft publie un mardi une mise à jour de sécurité urgente, KB5099123. Vous devez installer uniquement cette mise à jour sur les 12 serveurs ce soir. Les serveurs ne doivent redémarrer que si la mise à jour l'exige. MC-Prod ne doit pas être modifiée.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run a one-time update that includes the Security classification and is set to Always reboot.", fr: "Exécuter une mise à jour ponctuelle qui inclut la classification Security et est définie sur Always reboot." } }
        - { id: b, text: { en: "Run Check for updates on the 12 servers, and then let MC-Prod install the update on Saturday.", fr: "Exécuter Check for updates sur les 12 serveurs, puis laisser MC-Prod installer la mise à jour samedi." } }
        - { id: c, text: { en: "Run a one-time update that includes only KB5099123 and is set to Reboot if required.", fr: "Exécuter une mise à jour ponctuelle qui inclut uniquement KB5099123 et est définie sur Reboot if required." } }
        - { id: d, text: { en: "Add KB5099123 to the include list of MC-Prod and change its recurrence to daily.", fr: "Ajouter KB5099123 à la liste d'inclusion de MC-Prod et passer sa récurrence à quotidienne." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A one-time update installs updates now on Azure VMs and Arc-enabled servers, without a schedule. To install a single update, clear the preselected classifications and add the KB ID to the include list; the Reboot if required option restarts a server only when an installed update needs it.
        fr: |
          Une mise à jour ponctuelle installe des mises à jour immédiatement sur des machines virtuelles Azure et des serveurs activés pour Arc, sans planification. Pour installer une seule mise à jour, désélectionnez les classifications présélectionnées et ajoutez l'ID de KB à la liste d'inclusion ; l'option Reboot if required ne redémarre un serveur que si une mise à jour installée l'exige.
      options:
        a: { en: "The Security classification installs every missing security update, and Always reboot restarts every server.", fr: "La classification Security installe toutes les mises à jour de sécurité manquantes, et Always reboot redémarre tous les serveurs." }
        b: { en: "Check for updates only assesses the servers, and Saturday is too late.", fr: "Check for updates ne fait qu'évaluer les serveurs, et samedi est trop tard." }
        d: { en: "This modifies MC-Prod and changes the schedule of every server associated with it.", fr: "Cela modifie MC-Prod et change la planification de tous les serveurs qui y sont associés." }
    references:
      - title: Deploy updates and track results in Azure Update Manager
        url: https://learn.microsoft.com/en-us/azure/update-manager/deploy-updates

  # ------------------------------------------------------------------ 5
  - id: az802-qz-22-05
    objective: "2.2.3"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Traders has an on-premises server named **SRV5** that runs Windows Server 2022 and is onboarded to Azure Arc in a resource group named **RG-Arc** in the West Europe region. No extension is installed on SRV5.

        You need to use the Azure CLI to install the Azure Monitor Agent on SRV5. The platform must upgrade the extension automatically when Microsoft releases a new version.

        How should you complete the command? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un serveur local nommé **SRV5** qui exécute Windows Server 2022 et est intégré à Azure Arc dans un groupe de ressources nommé **RG-Arc** de la région Europe Ouest. Aucune extension n'est installée sur SRV5.

        Vous devez utiliser Azure CLI pour installer Azure Monitor Agent sur SRV5. La plateforme doit mettre à niveau l'extension automatiquement quand Microsoft publie une nouvelle version.

        Comment devez-vous compléter la commande ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        [[cmd]] \
          --resource-group RG-Arc --machine-name SRV5 --location westeurope \
          --name AzureMonitorWindowsAgent --type AzureMonitorWindowsAgent \
          --publisher [[pub]] \
          [[upg]] true
      slots:
        - id: cmd
          options:
            - { id: vmset, text: az vm extension set }
            - { id: arccreate, text: az connectedmachine extension create }
            - { id: vmssset, text: az vmss extension set }
        - id: pub
          options:
            - { id: monitor, text: Microsoft.Azure.Monitor }
            - { id: mma, text: Microsoft.EnterpriseCloud.Monitoring }
            - { id: compute, text: Microsoft.Compute }
        - id: upg
          options:
            - { id: minor, text: --auto-upgrade-minor-version }
            - { id: auto, text: --enable-auto-upgrade }
            - { id: nowait, text: --no-wait }
    answer:
      values: { cmd: arccreate, pub: monitor, upg: auto }
    explanation:
      correct:
        en: |
          Extensions of Arc-enabled servers are managed with `az connectedmachine extension create`, which takes the machine name and resource group. The Azure Monitor Agent for Windows is published by `Microsoft.Azure.Monitor` with the type `AzureMonitorWindowsAgent`. `--enable-auto-upgrade true` lets the platform upgrade the extension automatically when a newer version is available.
        fr: |
          Les extensions des serveurs activés pour Arc se gèrent avec `az connectedmachine extension create`, qui prend le nom de la machine et le groupe de ressources. Azure Monitor Agent pour Windows est publié par `Microsoft.Azure.Monitor` avec le type `AzureMonitorWindowsAgent`. `--enable-auto-upgrade true` permet à la plateforme de mettre à niveau l'extension automatiquement quand une version plus récente est disponible.
      options:
        vmset: { en: "az vm extension set targets Azure virtual machines, not Arc-enabled servers.", fr: "az vm extension set cible des machines virtuelles Azure, pas des serveurs activés pour Arc." }
        mma: { en: "Microsoft.EnterpriseCloud.Monitoring publishes the legacy Log Analytics agent, which is retired.", fr: "Microsoft.EnterpriseCloud.Monitoring publie l'ancien agent Log Analytics, qui est mis hors service." }
        minor: { en: "--auto-upgrade-minor-version only picks a newer minor version at deployment time; it doesn't upgrade the extension afterwards.", fr: "--auto-upgrade-minor-version ne choisit une version mineure plus récente qu'au déploiement ; il ne met pas l'extension à niveau ensuite." }
    references:
      - title: az connectedmachine extension
        url: https://learn.microsoft.com/en-us/cli/azure/connectedmachine/extension
      - title: VM Extension Management with Azure Arc-Enabled Servers
        url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/manage-vm-extensions

  # ------------------------------------------------------------------ 6
  - id: az802-qz-22-06
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware, Inc. has 80 on-premises servers that run Windows Server 2022 and are onboarded to Azure Arc. New servers are onboarded every month. The company has the requirements listed in the answer area.

        Which tool should you use for each requirement? To answer, drag the appropriate tools to the correct requirements. Each tool may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware, Inc. dispose de 80 serveurs locaux qui exécutent Windows Server 2022 et sont intégrés à Azure Arc. De nouveaux serveurs sont intégrés chaque mois. L'entreprise a les exigences listées dans la zone de réponse.

        Quel outil devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les outils appropriés vers les exigences correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: mc, text: { en: "Machine configuration assignment of type ApplyAndAutoCorrect", fr: "Affectation de configuration de machine de type ApplyAndAutoCorrect" } }
        - { id: cse, text: { en: "Custom Script Extension", fr: "Extension de script personnalisé" } }
        - { id: ct, text: Change Tracking and Inventory }
        - { id: dine, text: { en: "Azure Policy assignment with a DeployIfNotExists effect", fr: "Affectation Azure Policy avec un effet DeployIfNotExists" } }
        - { id: dsc, text: { en: "PowerShell DSC VM extension", fr: "Extension de machine virtuelle PowerShell DSC" } }
        - { id: um, text: { en: "Azure Update Manager", fr: "Gestionnaire de mise à jour Azure" } }
      targets:
        - id: admins
          text: { en: "Keep the members of the local Administrators group of every server equal to an approved list, and revert any change automatically.", fr: "Maintenir les membres du groupe local Administrators de chaque serveur égaux à une liste approuvée, et annuler automatiquement toute modification." }
        - id: rename
          text: { en: "Run a script once on the 80 servers to rename a local account.", fr: "Exécuter une fois un script sur les 80 serveurs pour renommer un compte local." }
        - id: changes
          text: { en: "Find which Windows services, registry keys and installed software changed on SRV12 during the last week.", fr: "Identifier quels services Windows, clés de Registre et logiciels installés ont changé sur SRV12 au cours de la dernière semaine." }
        - id: ama
          text: { en: "Install the Azure Monitor Agent automatically on every server, including the servers onboarded later.", fr: "Installer automatiquement Azure Monitor Agent sur chaque serveur, y compris les serveurs intégrés plus tard." }
    answer:
      mapping: { admins: mc, rename: cse, changes: ct, ama: dine }
    explanation:
      correct:
        en: |
          Machine configuration, built into the Connected Machine agent, sets operating system settings such as local group membership, and ApplyAndAutoCorrect corrects drift at the next evaluation. The Custom Script Extension runs a script once. Change Tracking and Inventory tracks changes to software, files, registry keys and services. A DeployIfNotExists policy, such as one that configures Arc machines to run the Azure Monitor Agent, also covers machines onboarded later.
        fr: |
          La configuration de machine, intégrée à l'agent Connected Machine, définit des paramètres du système d'exploitation comme l'appartenance aux groupes locaux, et ApplyAndAutoCorrect corrige la dérive à l'évaluation suivante. L'extension de script personnalisé exécute un script une fois. Change Tracking and Inventory suit les modifications des logiciels, fichiers, clés de Registre et services. Une stratégie DeployIfNotExists, comme celle qui configure les machines Arc pour exécuter Azure Monitor Agent, couvre aussi les machines intégrées plus tard.
      options:
        dsc: { en: "The DSC VM extension is no longer available for Azure Arc-enabled servers; machine configuration replaces it.", fr: "L'extension de machine virtuelle DSC n'est plus disponible pour les serveurs activés pour Azure Arc ; la configuration de machine la remplace." }
        um: { en: "Azure Update Manager assesses and installs operating system updates; it doesn't track configuration changes or deploy agents.", fr: "Le Gestionnaire de mise à jour Azure évalue et installe les mises à jour du système d'exploitation ; il ne suit pas les modifications de configuration et ne déploie pas d'agents." }
    references:
      - title: VM Extension Management with Azure Arc-Enabled Servers
        url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/manage-vm-extensions
      - title: Azure Change Tracking and Inventory Overview by Using Azure Monitor Agent
        url: https://learn.microsoft.com/en-us/azure/automation/change-tracking/overview-monitoring-agent

  # ------------------------------------------------------------------ 7
  - id: az802-qz-22-07
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has 200 on-premises servers that run Windows Server 2022 and are onboarded to Azure Arc. A Group Policy Object (GPO) configures the servers to get their updates only from a WSUS server named **WSUS1** and enables **Do not connect to any Windows Update Internet locations**. WSUS1 synchronizes the Windows Server products only.

        The Azure Connected Machine agent on the servers is several versions behind the current release. You need the agents to be upgraded through the existing update process. The servers must not connect to Windows Update or Microsoft Update directly.

        What should you do?
      fr: |
        Woodgrove Bank dispose de 200 serveurs locaux qui exécutent Windows Server 2022 et sont intégrés à Azure Arc. Un objet de stratégie de groupe (GPO) configure les serveurs pour qu'ils obtiennent leurs mises à jour uniquement depuis un serveur WSUS nommé **WSUS1** et active **Do not connect to any Windows Update Internet locations**. WSUS1 ne synchronise que les produits Windows Server.

        L'agent Azure Connected Machine des serveurs a plusieurs versions de retard sur la version actuelle. Vous devez faire en sorte que les agents soient mis à niveau par le processus de mise à jour existant. Les serveurs ne doivent pas se connecter directement à Windows Update ni à Microsoft Update.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In the GPO, enable the option to install updates for other Microsoft products.", fr: "Dans le GPO, activer l'option d'installation des mises à jour pour d'autres produits Microsoft." } }
        - { id: b, text: { en: "In Azure Update Manager, schedule the Updates classification for the 200 servers.", fr: "Dans le Gestionnaire de mise à jour Azure, planifier la classification Updates pour les 200 serveurs." } }
        - { id: c, text: { en: "On each server, run azcmagent disconnect, and then run azcmagent connect.", fr: "Sur chaque serveur, exécuter azcmagent disconnect, puis azcmagent connect." } }
        - { id: d, text: { en: "In WSUS1, synchronize the Azure Connected Machine Agent product, and then approve its updates.", fr: "Dans WSUS1, synchroniser le produit Azure Connected Machine Agent, puis approuver ses mises à jour." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Agent updates are published to Microsoft Update, so an existing WSUS or Configuration Manager infrastructure can deliver them with the regular OS updates once the product Azure Connected Machine Agent (Critical Updates and Updates classifications) is synchronized and approved. No restart is needed. The servers only install what WSUS1 offers, so WSUS1 must sync and approve that product.
        fr: |
          Les mises à jour de l'agent sont publiées dans Microsoft Update : une infrastructure WSUS ou Configuration Manager existante peut donc les distribuer avec les mises à jour habituelles du système une fois le produit Azure Connected Machine Agent (classifications Critical Updates et Updates) synchronisé et approuvé. Aucun redémarrage n'est nécessaire. Les serveurs n'installent que ce que WSUS1 propose : WSUS1 doit donc synchroniser et approuver ce produit.
      options:
        a: { en: "This option makes the Windows Update client check Microsoft Update, which the servers must not contact; they only use WSUS1.", fr: "Cette option fait interroger Microsoft Update par le client Windows Update, ce que les serveurs ne doivent pas contacter ; ils n'utilisent que WSUS1." }
        b: { en: "Servers pointed at WSUS install only the updates that WSUS approves; WSUS1 doesn't even synchronize the agent product.", fr: "Les serveurs dirigés vers WSUS n'installent que les mises à jour que WSUS approuve ; WSUS1 ne synchronise même pas le produit de l'agent." }
        c: { en: "Disconnecting and reconnecting recreates the connection with the same agent version; it doesn't upgrade the agent.", fr: "Déconnecter puis reconnecter recrée la connexion avec la même version de l'agent ; cela ne met pas l'agent à niveau." }
    references:
      - title: Manage Azure Connected Machine agent versions
        url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/manage-agent

  # ------------------------------------------------------------------ 8
  - id: az802-qz-22-08
    objective: "2.2.4"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Contoso, Ltd. manages the Azure Arc-enabled servers shown in the following table by using Azure Update Manager. Contoso doesn't use Windows Server pay-as-you-go. You plan to use Windows Server Management enabled by Azure Arc so that Update Manager isn't billed for these servers.

        Answer each prompt by selecting the appropriate server.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. gère les serveurs activés pour Azure Arc présentés dans le tableau suivant à l'aide du Gestionnaire de mise à jour Azure. Contoso n'utilise pas le paiement à l'utilisation de Windows Server. Vous prévoyez d'utiliser Windows Server Management enabled by Azure Arc pour que le Gestionnaire de mise à jour ne soit pas facturé pour ces serveurs.

        Répondez à chaque consigne en sélectionnant le serveur approprié.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The only server for which Activate benefits succeeds today", fr: "Le seul serveur pour lequel Activate benefits réussit aujourd'hui" }
        - id: p2
          text: { en: "The server whose Update Manager use stays billed even after its agent is upgraded and it's connected", fr: "Le serveur dont l'usage du Gestionnaire de mise à jour reste facturé même après la mise à niveau de son agent et sa connexion" }
      grid:
        header: [{ en: "Server", fr: "Serveur" }, { en: "Windows Server license", fr: "Licence Windows Server" }, { en: "Agent version", fr: "Version de l'agent" }, { en: "Status", fr: "État" }]
        rows:
          - [{ text: SRV1, area: srv1 }, { text: { en: "Datacenter, active Software Assurance", fr: "Datacenter, Software Assurance active" } }, { text: "1.44" }, { text: Connected }]
          - [{ text: SRV2, area: srv2 }, { text: { en: "Standard, active Software Assurance", fr: "Standard, Software Assurance active" } }, { text: "1.52" }, { text: Expired }]
          - [{ text: SRV3, area: srv3 }, { text: { en: "Standard, active Software Assurance", fr: "Standard, Software Assurance active" } }, { text: "1.53" }, { text: Connected }]
          - [{ text: SRV4, area: srv4 }, { text: { en: "Standard, perpetual license without Software Assurance", fr: "Standard, licence perpétuelle sans Software Assurance" } }, { text: "1.53" }, { text: Connected }]
    answer:
      values: { p1: srv3, p2: srv4 }
    explanation:
      correct:
        en: |
          Attestation in Azure Arc > Licenses > Azure Benefits - Windows Server requires an active Software Assurance or subscription license, Connected Machine agent 1.47 or later, and a server in the Connected state: only SRV3 meets all three today. SRV1 becomes eligible after an agent upgrade and SRV2 after it reconnects, but SRV4 has no Software Assurance, so without pay-as-you-go its Update Manager use must be bought.
        fr: |
          L'attestation dans Azure Arc > Licences > Azure Benefits - Windows Server exige une Software Assurance ou une licence d'abonnement active, l'agent Connected Machine 1.47 ou ultérieur et un serveur à l'état Connected : seul SRV3 remplit les trois conditions aujourd'hui. SRV1 devient éligible après une mise à niveau de l'agent et SRV2 après sa reconnexion, mais SRV4 n'a pas de Software Assurance : sans paiement à l'utilisation, son usage du Gestionnaire de mise à jour doit être acheté.
      options:
        srv1: { en: "SRV1 has Software Assurance but runs agent 1.44; benefits need version 1.47 or later.", fr: "SRV1 dispose de la Software Assurance mais exécute l'agent 1.44 ; les avantages exigent la version 1.47 ou ultérieure." }
        srv2: { en: "Disconnected and expired servers aren't eligible until they're connected again.", fr: "Les serveurs déconnectés et expirés ne sont pas éligibles tant qu'ils ne sont pas reconnectés." }
    references:
      - title: Windows Server Management enabled by Azure Arc
        url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/windows-server-management-overview

  # ------------------------------------------------------------------ 9
  - id: az802-qz-22-09
    objective: "2.2.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam, Inc. has an Azure Automation account named **AA-Ops**. AA-Ops contains a published PowerShell runbook named **Rotate-Logs** that is linked to a nightly schedule. The schedule runs Rotate-Logs on an extension-based Hybrid Runbook Worker group named **HRW-Paris** that contains two Azure Arc-enabled servers. HRW-Paris uses the default Hybrid Worker credentials.

        Today, an administrator opens Rotate-Logs in the editor, adds a step that deletes the archives older than 90 days on the file servers, and saves the runbook without publishing it.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. dispose d'un compte Automation nommé **AA-Ops**. AA-Ops contient un runbook PowerShell publié nommé **Rotate-Logs**, lié à une planification nocturne. La planification exécute Rotate-Logs sur un groupe Runbook Worker hybride basé sur une extension nommé **HRW-Paris**, qui contient deux serveurs activés pour Azure Arc. HRW-Paris utilise les informations d'identification Hybrid Worker par défaut.

        Aujourd'hui, un administrateur ouvre Rotate-Logs dans l'éditeur, ajoute une étape qui supprime les archives de plus de 90 jours sur les serveurs de fichiers, puis enregistre le runbook sans le publier.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Tonight's scheduled job runs the code that contains the new deletion step.", fr: "Le travail planifié de ce soir exécute le code qui contient la nouvelle étape de suppression." } }
        - { id: b, text: { en: "If the administrator runs Rotate-Logs in the Test pane, the deletion is performed against the real archives.", fr: "Si l'administrateur exécute Rotate-Logs dans le volet Test, la suppression est effectuée sur les archives réelles." } }
        - { id: c, text: { en: "Tonight's job runs under the Local System account of the worker that picks it up.", fr: "Le travail de ce soir s'exécute sous le compte Système local du worker qui le prend en charge." } }
        - { id: d, text: { en: "A webhook created now for Rotate-Logs starts the saved code that contains the new step.", fr: "Un webhook créé maintenant pour Rotate-Logs démarre le code enregistré qui contient la nouvelle étape." } }
        - { id: e, text: { en: "Tonight's job runs on both members of HRW-Paris at the same time.", fr: "Le travail de ce soir s'exécute sur les deux membres de HRW-Paris en même temps." } }
    answer: { optionIds: [b, c] }
    explanation:
      correct:
        en: |
          A runbook has a Draft version, the only one you can edit, and a Published version, the only one that can be run; the Test pane runs the Draft, and its actions really happen, so test on non-production resources. Hybrid Runbook Worker jobs run under the local System account unless the group uses custom Hybrid Worker credentials.
        fr: |
          Un runbook a une version Brouillon, la seule modifiable, et une version Publiée, la seule exécutable ; le volet Test exécute le Brouillon, et ses actions sont réellement effectuées : testez donc sur des ressources hors production. Les travaux des Runbook Workers hybrides s'exécutent sous le compte Système local, sauf si le groupe utilise des informations d'identification Hybrid Worker personnalisées.
      options:
        a: { en: "Saving changes only the Draft; schedules run the Published version until you publish the Draft.", fr: "L'enregistrement ne modifie que le Brouillon ; les planifications exécutent la version Publiée tant que vous ne publiez pas le Brouillon." }
        d: { en: "Webhooks start the Published version too; the new step runs only after the runbook is published.", fr: "Les webhooks démarrent eux aussi la version Publiée ; la nouvelle étape ne s'exécute qu'après la publication du runbook." }
        e: { en: "When a runbook starts on a group, one worker of the group retrieves and runs the job.", fr: "Quand un runbook démarre sur un groupe, un seul worker du groupe récupère et exécute le travail." }
    references:
      - title: Manage runbooks in Azure Automation
        url: https://learn.microsoft.com/en-us/azure/automation/manage-runbooks
      - title: Run Azure Automation Runbooks on a Hybrid Runbook Worker
        url: https://learn.microsoft.com/en-us/azure/automation/automation-hrw-run-runbooks

  # ------------------------------------------------------------------ 10
  - id: az802-qz-22-10
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum Corporation has an on-premises server named **SRV31** that runs Windows Server 2022 and is onboarded to Azure Arc. The Azure Monitor Agent and the Custom Script Extension are installed on SRV31. The agent runs in full mode with no extension list.

        A local administrator of SRV31 runs the following commands in this order:

        ```powershell
        azcmagent config set extensions.allowlist "Microsoft.Compute/CustomScriptExtension,Microsoft.Azure.AzureDefenderForServers/MDE.Windows"
        azcmagent config set config.mode monitor
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Corporation dispose d'un serveur local nommé **SRV31** qui exécute Windows Server 2022 et est intégré à Azure Arc. Azure Monitor Agent et l'extension de script personnalisé sont installés sur SRV31. L'agent s'exécute en mode complet, sans liste d'extensions.

        Un administrateur local de SRV31 exécute les commandes suivantes dans cet ordre :

        ```powershell
        azcmagent config set extensions.allowlist "Microsoft.Compute/CustomScriptExtension,Microsoft.Azure.AzureDefenderForServers/MDE.Windows"
        azcmagent config set config.mode monitor
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The Azure Monitor Agent extension remains installed on SRV31.", fr: "L'extension Azure Monitor Agent reste installée sur SRV31." }
        - id: s2
          text: { en: "A user who has the Owner role on the subscription can switch the agent of SRV31 back to full mode from the Azure portal.", fr: "Un utilisateur qui dispose du rôle Owner sur l'abonnement peut remettre l'agent de SRV31 en mode complet depuis le portail Azure." }
        - id: s3
          text: { en: "An administrator can run a new script on SRV31 by deploying the Custom Script Extension from Azure.", fr: "Un administrateur peut exécuter un nouveau script sur SRV31 en déployant l'extension de script personnalisé depuis Azure." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Neither an allowlist nor monitor mode removes extensions that are already installed, so the Azure Monitor Agent stays on SRV31. Monitor mode allows only monitoring and security extensions: it blocks any extension that could change the system configuration or run arbitrary scripts, even one listed in the local allowlist, and it also disables the guest configuration policy agent. These local settings can be changed only by running a command on the server itself, never from Azure.
        fr: |
          Ni une liste d'autorisation ni le mode monitor ne suppriment les extensions déjà installées : Azure Monitor Agent reste donc sur SRV31. Le mode monitor n'autorise que les extensions de surveillance et de sécurité : il bloque toute extension capable de modifier la configuration du système ou d'exécuter des scripts arbitraires, même si elle figure dans la liste d'autorisation locale, et il désactive aussi l'agent de stratégie de configuration invité. Ces paramètres locaux ne se modifient qu'en exécutant une commande sur le serveur lui-même, jamais depuis Azure.
      options:
        s1: { en: "Lists and modes control new operations; an installed extension must be deleted from Azure to be removed.", fr: "Les listes et les modes contrôlent les nouvelles opérations ; une extension installée doit être supprimée depuis Azure pour disparaître." }
        s2: { en: "Azure roles, even Owner, can't change the agent's local security settings; a local administrator must run azcmagent config set config.mode full.", fr: "Aucun rôle Azure, pas même Owner, ne peut modifier les paramètres de sécurité locaux de l'agent ; un administrateur local doit exécuter azcmagent config set config.mode full." }
        s3: { en: "The Custom Script Extension runs arbitrary scripts, which monitor mode blocks whatever the allowlist contains.", fr: "L'extension de script personnalisé exécute des scripts arbitraires, ce que le mode monitor bloque quel que soit le contenu de la liste d'autorisation." }
    references:
      - title: Extensions security for Azure Arc-enabled servers
        url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/security-extensions
