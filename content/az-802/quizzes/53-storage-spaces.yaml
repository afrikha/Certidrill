chapter: 53-storage-spaces
questions:
  # ------------------------------------------------------------------ 1
  - id: az802-qz-53-01
    objective: "5.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A stand-alone file server named **FS8** runs Windows Server 2025 and has a storage pool named **Pool1**. You add a new physical disk named **PhysicalDisk9** to Pool1.

        PhysicalDisk9 must hold no data, and it must be used automatically to replace a disk of Pool1 that fails.

        Which usage should you set for PhysicalDisk9?
      fr: |
        Un serveur de fichiers autonome nommé **FS8** exécute Windows Server 2025 et dispose d'un pool de stockage nommé **Pool1**. Vous ajoutez à Pool1 un nouveau disque physique nommé **PhysicalDisk9**.

        PhysicalDisk9 ne doit contenir aucune donnée, et il doit être utilisé automatiquement pour remplacer un disque de Pool1 qui tombe en panne.

        Quelle utilisation (Usage) devez-vous définir pour PhysicalDisk9 ?
    body:
      options:
        - { id: a, text: AutoSelect }
        - { id: b, text: Retired }
        - { id: c, text: HotSpare }
        - { id: d, text: ManualSelect }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A hot spare disk stays in the pool without receiving data and waits to replace a failed disk. You can set it when you add the disk (`Add-PhysicalDisk -Usage HotSpare`) or in the New Storage Pool Wizard with the Hot Spare allocation.
        fr: |
          Un disque de secours (hot spare) reste dans le pool sans recevoir de données et attend de remplacer un disque en panne. Vous pouvez le définir quand vous ajoutez le disque (`Add-PhysicalDisk -Usage HotSpare`) ou dans l'assistant New Storage Pool avec l'allocation Hot Spare.
      options:
        a: { en: "AutoSelect lets the pool place data on the disk like on any other member, so it wouldn't stay empty.", fr: "AutoSelect laisse le pool placer des données sur le disque comme sur tout autre membre : il ne resterait pas vide." }
        b: { en: "Retired marks a disk to be emptied and removed, typically a failing disk; it isn't a replacement disk.", fr: "Retired marque un disque à vider puis à retirer, en général un disque défaillant ; ce n'est pas un disque de remplacement." }
        d: { en: "ManualSelect makes the disk available to virtual disks that name it explicitly; it doesn't replace failed disks automatically.", fr: "ManualSelect rend le disque disponible pour les disques virtuels qui le désignent explicitement ; il ne remplace pas automatiquement les disques en panne." }
    references:
      - title: Deploy Storage Spaces on a stand-alone server
        url: https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/deploy-standalone-storage-spaces
      - title: Set-PhysicalDisk (Storage)
        url: https://learn.microsoft.com/en-us/powershell/module/storage/set-physicaldisk

  # ------------------------------------------------------------------ 2
  - id: az802-qz-53-02
    objective: "5.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A file server named **FS9** runs Windows Server 2025. You add a new disk to FS9 and create a 2-TB NTFS volume on it.

        Users must reach the new volume as the folder D:\Projects\Archive, where D: is an existing NTFS volume on another disk. The new volume must not use a drive letter. The folder D:\Projects\Archive exists and is empty.

        What should you do?
      fr: |
        Un serveur de fichiers nommé **FS9** exécute Windows Server 2025. Vous ajoutez un nouveau disque à FS9 et y créez un volume NTFS de 2 To.

        Les utilisateurs doivent atteindre le nouveau volume comme le dossier D:\Projects\Archive, où D: est un volume NTFS existant sur un autre disque. Le nouveau volume ne doit pas utiliser de lettre de lecteur. Le dossier D:\Projects\Archive existe et il est vide.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Extend volume D: onto the new disk so that D:\\Projects\\Archive gains its capacity.", fr: "Étendre le volume D: sur le nouveau disque pour que D:\\Projects\\Archive gagne sa capacité." } }
        - { id: b, text: { en: "Add the empty folder D:\\Projects\\Archive as an access path of the new volume.", fr: "Ajouter le dossier vide D:\\Projects\\Archive comme chemin d'accès du nouveau volume." } }
        - { id: c, text: { en: "Create a DFS namespace folder named Archive whose target is the new volume.", fr: "Créer un dossier d'espace de noms DFS nommé Archive dont la cible est le nouveau volume." } }
        - { id: d, text: { en: "Create a VHDX file in D:\\Projects\\Archive and attach it in Disk Management.", fr: "Créer un fichier VHDX dans D:\\Projects\\Archive et l'attacher dans la Gestion des disques." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A volume can be mounted in an empty folder of an NTFS (or ReFS) volume instead of receiving a drive letter. In Disk Management this is *Mount in the following empty NTFS folder*; in PowerShell, `Add-PartitionAccessPath -AccessPath D:\Projects\Archive` adds the folder as an access path of the partition.
        fr: |
          Un volume peut être monté dans un dossier vide d'un volume NTFS (ou ReFS) au lieu de recevoir une lettre de lecteur. Dans la Gestion des disques, c'est l'option *Mount in the following empty NTFS folder* ; en PowerShell, `Add-PartitionAccessPath -AccessPath D:\Projects\Archive` ajoute le dossier comme chemin d'accès de la partition.
      options:
        a: { en: "A basic volume extends only into unallocated space right after it on the same disk; it can't grow onto another disk.", fr: "Un volume de base ne s'étend que dans l'espace non alloué qui le suit sur le même disque ; il ne peut pas s'agrandir sur un autre disque." }
        c: { en: "A DFS folder target is the UNC path of a share, reached as \\\\domain\\namespace\\folder, not a local folder of D:.", fr: "Une cible de dossier DFS est le chemin UNC d'un partage, atteint par \\\\domaine\\espace de noms\\dossier, pas un dossier local de D:." }
        d: { en: "An attached VHDX is a new virtual disk stored on D:; it doesn't expose the new 2-TB volume and would itself need a drive letter or mount point.", fr: "Un VHDX attaché est un nouveau disque virtuel stocké sur D: ; il n'expose pas le nouveau volume de 2 To et aurait lui-même besoin d'une lettre ou d'un point de montage." }
    references:
      - title: Assign a mount point folder path to a drive in Windows and Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/storage/disk-management/assign-a-mount-point-folder-path-to-a-drive

  # ------------------------------------------------------------------ 3
  - id: az802-qz-53-03
    objective: "5.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You deploy Storage Spaces Direct on a two-node failover cluster named **S2D-BR**. The nodes, **N1** and **N2**, run Windows Server 2025 Datacenter, and all the volumes use two-way mirror resiliency. After `Enable-ClusterStorageSpacesDirect`, you only created the volumes.

        During a test, you shut down N1. The volumes and the virtual machines also become unavailable on N2.

        You need to ensure that N2 keeps the volumes online when N1 is offline. What should you configure?
      fr: |
        Vous déployez les espaces de stockage direct sur un cluster de basculement à deux nœuds nommé **S2D-BR**. Les nœuds, **N1** et **N2**, exécutent Windows Server 2025 Datacenter, et tous les volumes utilisent la résilience miroir bidirectionnel. Après `Enable-ClusterStorageSpacesDirect`, vous avez seulement créé les volumes.

        Lors d'un test, vous arrêtez N1. Les volumes et les machines virtuelles deviennent aussi indisponibles sur N2.

        Vous devez faire en sorte que N2 garde les volumes en ligne quand N1 est hors ligne. Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "Nested two-way mirror resiliency for new volumes", fr: "La résilience miroir bidirectionnel imbriqué pour de nouveaux volumes" } }
        - { id: b, text: { en: "Three-way mirror resiliency for new volumes", fr: "La résilience miroir tridirectionnel pour de nouveaux volumes" } }
        - { id: c, text: { en: "A cloud witness for the S2D-BR cluster", fr: "Un témoin cloud pour le cluster S2D-BR" } }
        - { id: d, text: { en: "The CSV in-memory read cache on both nodes", fr: "Le cache de lecture en mémoire CSV sur les deux nœuds" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A two-server Storage Spaces Direct cluster requires a cluster witness: without one, the remaining server loses quorum when the other goes offline and becomes unavailable too. A cloud witness or a file share witness gives the cluster the extra vote, and the two-way mirror then keeps the data online on N2.
        fr: |
          Un cluster d'espaces de stockage direct à deux serveurs exige un témoin de cluster : sans témoin, le serveur restant perd le quorum quand l'autre passe hors ligne et devient lui aussi indisponible. Un témoin cloud ou un témoin de partage de fichiers donne au cluster le vote supplémentaire, et le miroir bidirectionnel garde alors les données en ligne sur N2.
      options:
        a: { en: "Nested resiliency adds tolerance to a drive failure on top of a server failure, but the cluster still loses quorum without a witness.", fr: "La résilience imbriquée ajoute la tolérance à une panne de disque en plus d'une panne de serveur, mais le cluster perd toujours le quorum sans témoin." }
        b: { en: "Three-way mirror needs at least three servers, and the resiliency type isn't what stops N2.", fr: "Le miroir tridirectionnel exige au moins trois serveurs, et le type de résilience n'est pas ce qui arrête N2." }
        d: { en: "The CSV cache only speeds up unbuffered reads; it has no effect on quorum.", fr: "Le cache CSV ne fait qu'accélérer les lectures non mises en mémoire tampon ; il n'a aucun effet sur le quorum." }
    references:
      - title: Deploy Storage Spaces Direct on Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/deploy-storage-spaces-direct

  # ------------------------------------------------------------------ 4
  - id: az802-qz-53-04
    objective: "5.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Two servers named **SRV5** and **SRV6** run Windows Server 2025 Datacenter in two datacenters. You plan a Storage Replica server-to-server partnership for volume E:, with volume L: as the log volume on each server.

        Before you create the partnership, you need a report that checks the partition style and sector sizes of the volumes, the free space of the log volumes and the SMB connectivity, and that estimates the initial synchronization time.

        What should you run?
      fr: |
        Deux serveurs nommés **SRV5** et **SRV6** exécutent Windows Server 2025 Datacenter dans deux centres de données. Vous prévoyez un partenariat de réplica de stockage de serveur à serveur pour le volume E:, avec le volume L: comme volume de journal sur chaque serveur.

        Avant de créer le partenariat, vous avez besoin d'un rapport qui vérifie le style de partition et la taille de secteur des volumes, l'espace libre des volumes de journal et la connectivité SMB, et qui estime la durée de la synchronisation initiale.

        Que devez-vous exécuter ?
    body:
      options:
        - { id: a, text: "Test-Cluster" }
        - { id: b, text: "Get-SRGroup" }
        - { id: c, text: "New-SRPartnership" }
        - { id: d, text: "Test-SRTopology" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `Test-SRTopology` validates a planned partnership without creating it: GPT partition style and matching sector sizes, log volume formatting and free space, SMB ports 445 or 5445, WS-MAN and memory. It also measures latency and write I/O, estimates the initial synchronization time, and writes an HTML report to the result path.
        fr: |
          `Test-SRTopology` valide un partenariat prévu sans le créer : style de partition GPT et tailles de secteur identiques, format et espace libre des volumes de journal, ports SMB 445 ou 5445, WS-MAN et mémoire. Il mesure aussi la latence et les E/S d'écriture, estime la durée de la synchronisation initiale et écrit un rapport HTML dans le chemin de résultat.
      options:
        a: { en: "Test-Cluster validates failover cluster nodes; it doesn't check a Storage Replica partnership between two stand-alone servers.", fr: "Test-Cluster valide des nœuds de cluster de basculement ; il ne vérifie pas un partenariat de réplica de stockage entre deux serveurs autonomes." }
        b: { en: "Get-SRGroup shows existing replication groups; nothing has been created yet.", fr: "Get-SRGroup affiche les groupes de réplication existants ; rien n'a encore été créé." }
        c: { en: "New-SRPartnership creates the partnership and starts replication instead of reporting on it beforehand.", fr: "New-SRPartnership crée le partenariat et lance la réplication au lieu de produire un rapport préalable." }
    references:
      - title: Test-SRTopology (StorageReplica)
        url: https://learn.microsoft.com/en-us/powershell/module/storagereplica/test-srtopology

  # ------------------------------------------------------------------ 5
  - id: az802-qz-53-05
    objective: "5.3.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso is buying network adapters for a new four-node hyperconverged Storage Spaces Direct cluster that runs Windows Server 2025 Datacenter. SMB Direct must carry the storage traffic between the nodes.

        The nodes connect to the existing top-of-rack Ethernet switches. The network team won't configure Data Center Bridging or any other RDMA-specific setting on these switches.

        Which network adapters should you choose?
      fr: |
        Contoso achète des cartes réseau pour un nouveau cluster d'espaces de stockage direct hyperconvergé à quatre nœuds qui exécute Windows Server 2025 Datacenter. SMB Direct doit transporter le trafic de stockage entre les nœuds.

        Les nœuds se connectent aux commutateurs Ethernet de haut de baie existants. L'équipe réseau ne configurera ni Data Center Bridging ni aucun autre paramètre propre à RDMA sur ces commutateurs.

        Quelles cartes réseau devez-vous choisir ?
    body:
      options:
        - { id: a, text: { en: "25-GbE adapters without RDMA, with SMB Multichannel enabled", fr: "Des cartes 25 GbE sans RDMA, avec SMB Multichannel activé" } }
        - { id: b, text: { en: "RDMA adapters that use RoCE v2, with Data Center Bridging on each node", fr: "Des cartes RDMA qui utilisent RoCE v2, avec Data Center Bridging sur chaque nœud" } }
        - { id: c, text: { en: "RDMA adapters that use iWARP, connected to the existing switches", fr: "Des cartes RDMA qui utilisent iWARP, connectées aux commutateurs existants" } }
        - { id: d, text: { en: "InfiniBand adapters, connected to the existing Ethernet switches", fr: "Des cartes InfiniBand, connectées aux commutateurs Ethernet existants" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          SMB Direct needs RDMA-capable adapters. With iWARP adapters, the nodes don't need the Data Center Bridging feature, and iWARP is the easier RDMA option to set up. RoCE relies on Data Center Bridging on the nodes and, especially with RoCE v2, on correctly configured top-of-rack switches.
        fr: |
          SMB Direct exige des cartes compatibles RDMA. Avec des cartes iWARP, les nœuds n'ont pas besoin de la fonctionnalité Data Center Bridging, et iWARP est l'option RDMA la plus simple à mettre en place. RoCE repose sur Data Center Bridging sur les nœuds et, surtout avec RoCE v2, sur des commutateurs de haut de baie correctement configurés.
      options:
        a: { en: "Without RDMA, SMB uses TCP/IP: SMB Multichannel adds paths, but SMB Direct can't be used.", fr: "Sans RDMA, SMB utilise TCP/IP : SMB Multichannel ajoute des chemins, mais SMB Direct ne peut pas être utilisé." }
        b: { en: "RoCE v2 needs Data Center Bridging on the nodes and, in practice, matching settings on the switches, which the network team refuses to configure.", fr: "RoCE v2 exige Data Center Bridging sur les nœuds et, en pratique, des paramètres correspondants sur les commutateurs, que l'équipe réseau refuse de configurer." }
        d: { en: "InfiniBand is a different network fabric with its own switches; its adapters don't connect to Ethernet switches.", fr: "InfiniBand est une autre structure réseau avec ses propres commutateurs ; ses cartes ne se connectent pas à des commutateurs Ethernet." }
    references:
      - title: Deploy Storage Spaces Direct on Windows Server
        url: https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/deploy-storage-spaces-direct
      - title: Improve performance of a file server with SMB Direct
        url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-direct

  # ------------------------------------------------------------------ 6
  - id: az802-qz-53-06
    objective: "5.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A file server named **FS10** runs Windows Server 2025. Disk 1 is a basic disk that holds one 1-TB NTFS volume, D:, with 650 GB of free space. D: also holds the paging file of FS10.

        You need to shrink D: by 400 GB to create a second volume on Disk 1, without losing data. In Disk Management, **Shrink Volume** offers at most 120 GB, and an event with ID 259 in the Application log names pagefile.sys as the file that blocks the operation.

        What should you do first?
      fr: |
        Un serveur de fichiers nommé **FS10** exécute Windows Server 2025. Le disque 1 est un disque de base qui contient un volume NTFS de 1 To, D:, avec 650 Go d'espace libre. D: contient aussi le fichier d'échange de FS10.

        Vous devez réduire D: de 400 Go pour créer un deuxième volume sur le disque 1, sans perte de données. Dans la Gestion des disques, **Réduire le volume** (Shrink Volume) propose au plus 120 Go, et un événement d'ID 259 dans le journal Application désigne pagefile.sys comme le fichier qui bloque l'opération.

        Que devez-vous faire en premier ?
    body:
      options:
        - { id: a, text: { en: "Run Optimize-Volume -DriveLetter D -Defrag, and then shrink D: again.", fr: "Exécuter Optimize-Volume -DriveLetter D -Defrag, puis réduire D: de nouveau." } }
        - { id: b, text: { en: "Run diskpart and shrink D: with desired=409600 and minimum=409600.", fr: "Exécuter diskpart et réduire D: avec desired=409600 et minimum=409600." } }
        - { id: c, text: { en: "Move the paging file from D: to another volume, and restart FS10.", fr: "Déplacer le fichier d'échange de D: vers un autre volume, puis redémarrer FS10." } }
        - { id: d, text: { en: "Convert Disk 1 to a dynamic disk, and then shrink D: again.", fr: "Convertir le disque 1 en disque dynamique, puis réduire D: de nouveau." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A shrink moves ordinary files automatically, but it can't relocate unmovable files such as the paging file or the shadow copy storage area: the volume shrinks only down to where they sit, and event 259 names the blocking file. Moving the paging file to another disk removes the obstacle; after the shrink, you can move it back.
        fr: |
          Une réduction déplace automatiquement les fichiers ordinaires, mais elle ne peut pas déplacer les fichiers inamovibles comme le fichier d'échange ou la zone de stockage des clichés instantanés : le volume ne se réduit que jusqu'à leur emplacement, et l'événement 259 nomme le fichier bloquant. Déplacer le fichier d'échange vers un autre disque supprime l'obstacle ; après la réduction, vous pouvez le remettre en place.
      options:
        a: { en: "Defragmenting moves ordinary files, which the shrink already relocates; the in-use paging file stays where it is.", fr: "La défragmentation déplace des fichiers ordinaires, que la réduction déplace déjà ; le fichier d'échange en cours d'utilisation reste où il est." }
        b: { en: "diskpart shrink has the same limit: with minimum=409600 it fails, because the unmovable paging file still blocks beyond 120 GB.", fr: "diskpart shrink a la même limite : avec minimum=409600, il échoue, car le fichier d'échange inamovible bloque toujours au-delà de 120 Go." }
        d: { en: "Converting to a dynamic disk doesn't move unmovable files, so the shrink limit stays the same.", fr: "La conversion en disque dynamique ne déplace pas les fichiers inamovibles : la limite de réduction reste la même." }
    references:
      - title: Shrink a Basic Volume
        url: https://learn.microsoft.com/en-us/windows-server/storage/disk-management/shrink-a-basic-volume

  # ------------------------------------------------------------------ 7
  - id: az802-qz-53-07
    objective: "5.3.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        A Hyper-V failover cluster named **HVC1** runs Windows Server 2025 and stores its virtual machines on Cluster Shared Volumes. The Storage QoS Resource is online. You create and assign the following Storage QoS policies:

        | Policy | Policy type | MinimumIops | MaximumIops | Assigned to |
        | --- | --- | --- | --- | --- |
        | Gold | Aggregated | 1,000 | 4,000 | The data disks of SQL1, SQL2, SQL3 and SQL4 (one disk each) |
        | Desktop | Dedicated | 100 | 200 | The OS disk of each of 50 desktop VMs |

        All the I/O requests of these virtual machines are 8 KB or smaller.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un cluster de basculement Hyper-V nommé **HVC1** exécute Windows Server 2025 et stocke ses machines virtuelles sur des volumes partagés de cluster. La ressource Storage QoS est en ligne. Vous créez et attribuez les stratégies Storage QoS suivantes :

        | Stratégie | Type de stratégie | MinimumIops | MaximumIops | Attribuée à |
        | --- | --- | --- | --- | --- |
        | Gold | Aggregated | 1 000 | 4 000 | Les disques de données de SQL1, SQL2, SQL3 et SQL4 (un disque chacune) |
        | Desktop | Dedicated | 100 | 200 | Le disque du système d'exploitation de chacune des 50 machines virtuelles de bureau |

        Toutes les requêtes d'E/S de ces machines virtuelles font 8 Ko ou moins.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si elle est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "When the four SQL data disks all issue I/O as fast as they can and the storage keeps up, each disk gets about 1,000 IOPS.", fr: "Quand les quatre disques de données SQL émettent tous des E/S aussi vite que possible et que le stockage suit, chaque disque obtient environ 1 000 IOPS." } }
        - { id: s2, text: { en: "The Gold policy guarantees each SQL data disk at least 1,000 IOPS when it has demand.", fr: "La stratégie Gold garantit à chaque disque de données SQL au moins 1 000 IOPS quand il a de la demande." } }
        - { id: s3, text: { en: "Running Get-StorageQosPolicy -Name Desktop | Set-StorageQosPolicy -MaximumIops 300 raises the limit of the 50 OS disks without any change on the virtual machines.", fr: "Exécuter Get-StorageQosPolicy -Name Desktop | Set-StorageQosPolicy -MaximumIops 300 relève la limite des 50 disques du système d'exploitation sans aucune modification sur les machines virtuelles." } }
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          An Aggregated policy gives all the disks assigned to it one shared minimum and maximum: four busy data disks share the 4,000-IOPS maximum, about 1,000 each (Yes), and the 1,000-IOPS minimum is guaranteed to the four disks combined, not to each one (No). The settings of a policy can be changed after creation; the Policy Manager then notifies the Hyper-V hosts, so every disk that uses Desktop gets the new limit without being reassigned (Yes).
        fr: |
          Une stratégie Aggregated donne à tous les disques qui lui sont attribués un minimum et un maximum partagés : quatre disques de données actifs se partagent le maximum de 4 000 IOPS, environ 1 000 chacun (Oui), et le minimum de 1 000 IOPS est garanti aux quatre disques ensemble, pas à chacun (Non). Les paramètres d'une stratégie peuvent être modifiés après sa création ; le gestionnaire de stratégies prévient alors les hôtes Hyper-V, et chaque disque qui utilise Desktop reçoit la nouvelle limite sans nouvelle attribution (Oui).
      options:
        s2: { en: "A per-disk guarantee would need a Dedicated policy; with Aggregated, the 1,000-IOPS minimum is split among the four disks according to demand.", fr: "Une garantie par disque exigerait une stratégie Dedicated ; avec Aggregated, le minimum de 1 000 IOPS est réparti entre les quatre disques selon la demande." }
    references:
      - title: Storage Quality of Service
        url: https://learn.microsoft.com/en-us/windows-server/storage/storage-qos/storage-qos-overview

  # ------------------------------------------------------------------ 8
  - id: az802-qz-53-08
    objective: "5.3.2"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        A stand-alone file server named **FS11** runs Windows Server 2025. Its storage pool **Pool2** has six physical disks, no hot spare, and two-way mirror virtual disks. PhysicalDisk4 failed, and the virtual disks are degraded.

        You connected a new blank disk named **PhysicalDisk7** and added it to Pool2 by running `Add-PhysicalDisk`.

        You need to restore the resiliency of the virtual disks and then remove PhysicalDisk4 from Pool2, without data loss.

        Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Un serveur de fichiers autonome nommé **FS11** exécute Windows Server 2025. Son pool de stockage **Pool2** compte six disques physiques, aucun disque de secours, et des disques virtuels en miroir bidirectionnel. PhysicalDisk4 est tombé en panne, et les disques virtuels sont dégradés.

        Vous avez connecté un nouveau disque vierge nommé **PhysicalDisk7** et l'avez ajouté à Pool2 en exécutant `Add-PhysicalDisk`.

        Vous devez rétablir la résilience des disques virtuels, puis retirer PhysicalDisk4 de Pool2, sans perte de données.

        Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste d'actions vers la zone de réponse et placez-les dans le bon ordre.
    body:
      count: 3
      actions:
        - { id: retire, text: "Set-PhysicalDisk -FriendlyName PhysicalDisk4 -Usage Retired" }
        - { id: repair, text: { en: "Run Repair-VirtualDisk for each degraded virtual disk of Pool2.", fr: "Exécuter Repair-VirtualDisk pour chaque disque virtuel dégradé de Pool2." } }
        - { id: remove, text: "Remove-PhysicalDisk -PhysicalDisks (Get-PhysicalDisk -FriendlyName PhysicalDisk4) -StoragePoolFriendlyName Pool2" }
        - { id: hotspare, text: "Set-PhysicalDisk -FriendlyName PhysicalDisk7 -Usage HotSpare" }
        - { id: clear, text: "Clear-Disk -FriendlyName PhysicalDisk4 -RemoveData" }
        - { id: newpool, text: "New-StoragePool -FriendlyName Pool3 -StorageSubSystemFriendlyName \"Windows Storage*\" -PhysicalDisks (Get-PhysicalDisk -FriendlyName PhysicalDisk7)" }
    answer: { sequence: [retire, repair, remove] }
    explanation:
      correct:
        en: |
          Retiring PhysicalDisk4 tells Storage Spaces to stop allocating data to it. `Repair-VirtualDisk` then rebuilds the missing mirror copies on the remaining disks, which now include PhysicalDisk7. Only when the virtual disks are healthy do you remove PhysicalDisk4 from the pool, so that the removal never leaves data without a copy.
        fr: |
          Mettre PhysicalDisk4 hors service (Retired) indique aux espaces de stockage de ne plus y allouer de données. `Repair-VirtualDisk` reconstruit ensuite les copies miroir manquantes sur les disques restants, qui comprennent maintenant PhysicalDisk7. C'est seulement quand les disques virtuels sont sains que vous retirez PhysicalDisk4 du pool, afin que le retrait ne laisse jamais de données sans copie.
      options:
        hotspare: { en: "A hot spare receives no data, so PhysicalDisk7 couldn't hold the rebuilt copies.", fr: "Un disque de secours ne reçoit aucune donnée : PhysicalDisk7 ne pourrait pas accueillir les copies reconstruites." }
        clear: { en: "Clear-Disk prepares a disk for reuse; it neither repairs the virtual disks nor removes the failed disk from the pool.", fr: "Clear-Disk prépare un disque à sa réutilisation ; il ne répare pas les disques virtuels et ne retire pas le disque en panne du pool." }
        newpool: { en: "A new pool would take PhysicalDisk7 away from Pool2, where the rebuild needs its capacity.", fr: "Un nouveau pool retirerait PhysicalDisk7 de Pool2, où la reconstruction a besoin de sa capacité." }
    references:
      - title: Set-PhysicalDisk (Storage)
        url: https://learn.microsoft.com/en-us/powershell/module/storage/set-physicaldisk
      - title: Remove-PhysicalDisk (Storage)
        url: https://learn.microsoft.com/en-us/powershell/module/storage/remove-physicaldisk

  # ------------------------------------------------------------------ 9
  - id: az802-qz-53-09
    objective: "5.3.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Two servers named **SRV7** and **SRV8** run Windows Server 2025 Datacenter. A synchronous Storage Replica server-to-server partnership replicates volume F: from SRV7 to SRV8, and the initial synchronization is complete. Shadow copies of F: are created on SRV7 every day at 07:00.

        At 10:00, a user deletes a project folder from F: on SRV7.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Deux serveurs nommés **SRV7** et **SRV8** exécutent Windows Server 2025 Datacenter. Un partenariat de réplica de stockage de serveur à serveur synchrone réplique le volume F: de SRV7 vers SRV8, et la synchronisation initiale est terminée. Des clichés instantanés de F: sont créés sur SRV7 tous les jours à 07:00.

        À 10:00, un utilisateur supprime un dossier de projet de F: sur SRV7.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The deleted folder remains on the F: volume of SRV8 until the next scheduled replication.", fr: "Le dossier supprimé reste sur le volume F: de SRV8 jusqu'à la prochaine réplication planifiée." } }
        - { id: b, text: { en: "The 07:00 shadow copy of F: is replicated to SRV8 along with the other blocks of the volume.", fr: "Le cliché instantané de 07:00 de F: est répliqué vers SRV8 avec les autres blocs du volume." } }
        - { id: c, text: { en: "Users can open F: on SRV8 in read-only mode while the replication runs.", fr: "Les utilisateurs peuvent ouvrir F: sur SRV8 en lecture seule pendant que la réplication s'exécute." } }
        - { id: d, text: { en: "A test failover can temporarily mount a writable snapshot of F: on SRV8 without removing the partnership.", fr: "Un test de basculement peut monter temporairement sur SRV8 un instantané accessible en écriture de F: sans supprimer le partenariat." } }
        - { id: e, text: { en: "Switching the partnership to asynchronous mode keeps deleted data on SRV8 for the duration of the RPO.", fr: "Passer le partenariat en mode asynchrone conserve les données supprimées sur SRV8 pendant la durée du RPO." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Storage Replica works at the partition layer, so it replicates every block of the volume, including the VSS shadow copies created on the source. The destination volume is dismounted while it replicates, but a test failover (`Mount-SRDestination`) temporarily mounts a writable snapshot of it on another volume for tests or backups, while the partnership stays in place.
        fr: |
          Le réplica de stockage travaille au niveau de la partition : il réplique tous les blocs du volume, y compris les clichés instantanés VSS créés sur la source. Le volume de destination est démonté pendant la réplication, mais un test de basculement (`Mount-SRDestination`) en monte temporairement un instantané accessible en écriture sur un autre volume pour des tests ou des sauvegardes, pendant que le partenariat reste en place.
      options:
        a: { en: "Storage Replica isn't scheduled: it replicates changes continuously, and a deletion reaches the destination at once.", fr: "Le réplica de stockage n'est pas planifié : il réplique les modifications en continu, et une suppression atteint aussitôt la destination." }
        c: { en: "The destination volume is dismounted during replication; no user or application can read it, even if its drive letter is visible.", fr: "Le volume de destination est démonté pendant la réplication ; aucun utilisateur ni aucune application ne peut le lire, même si sa lettre de lecteur est visible." }
        e: { en: "Asynchronous replication is also continuous and replicates the deletion as well; Storage Replica isn't a backup in any mode.", fr: "La réplication asynchrone est elle aussi continue et réplique également la suppression ; le réplica de stockage n'est une sauvegarde dans aucun mode." }
    references:
      - title: Storage Replica Overview
        url: https://learn.microsoft.com/en-us/windows-server/storage/storage-replica/storage-replica-overview
      - title: Mount-SRDestination (StorageReplica)
        url: https://learn.microsoft.com/en-us/powershell/module/storagereplica/mount-srdestination

  # ------------------------------------------------------------------ 10
  - id: az802-qz-53-10
    objective: "5.3.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware has a two-node failover cluster named **S2D-SITE2** that runs Windows Server 2025 Datacenter. Storage Spaces Direct is enabled, and a cloud witness is configured. Each node has two cache drives and six capacity drives of the same type.

        You need to create the following volumes:

        - **Vol-Apps**: must stay online if one node fails. Its usable capacity must be as large as possible.
        - **Vol-Records**: must stay online if one node is down and a capacity drive fails in the other node at the same time. Its usable capacity must be as large as possible.

        Which resiliency should you use for each volume? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un cluster de basculement à deux nœuds nommé **S2D-SITE2** qui exécute Windows Server 2025 Datacenter. Les espaces de stockage direct sont activés et un témoin cloud est configuré. Chaque nœud dispose de deux disques de cache et de six disques de capacité du même type.

        Vous devez créer les volumes suivants :

        - **Vol-Apps** : doit rester en ligne si un nœud tombe en panne. Sa capacité utile doit être la plus grande possible.
        - **Vol-Records** : doit rester en ligne si un nœud est arrêté et qu'un disque de capacité tombe en panne en même temps dans l'autre nœud. Sa capacité utile doit être la plus grande possible.

        Quelle résilience devez-vous utiliser pour chaque volume ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Vol-Apps: [[apps]]

          Vol-Records: [[records]]
        fr: |
          Vol-Apps : [[apps]]

          Vol-Records : [[records]]
      slots:
        - id: apps
          options:
            - { id: twoway, text: { en: "Two-way mirror", fr: "Miroir bidirectionnel" } }
            - { id: threeway, text: { en: "Three-way mirror", fr: "Miroir tridirectionnel" } }
            - { id: dualparity, text: { en: "Dual parity", fr: "Double parité" } }
            - { id: nestedmirror, text: { en: "Nested two-way mirror", fr: "Miroir bidirectionnel imbriqué" } }
            - { id: nestedmap, text: { en: "Nested mirror-accelerated parity", fr: "Parité accélérée par miroir imbriquée" } }
        - id: records
          options:
            - { id: twoway, text: { en: "Two-way mirror", fr: "Miroir bidirectionnel" } }
            - { id: threeway, text: { en: "Three-way mirror", fr: "Miroir tridirectionnel" } }
            - { id: dualparity, text: { en: "Dual parity", fr: "Double parité" } }
            - { id: nestedmirror, text: { en: "Nested two-way mirror", fr: "Miroir bidirectionnel imbriqué" } }
            - { id: nestedmap, text: { en: "Nested mirror-accelerated parity", fr: "Parité accélérée par miroir imbriquée" } }
    answer: { values: { apps: twoway, records: nestedmap } }
    explanation:
      correct:
        en: |
          On two servers, a two-way mirror survives the loss of one server with 50 % efficiency, the best of the options that run on two nodes. Surviving a server and a drive failure at the same time needs nested resiliency, available only on exactly two servers: nested mirror-accelerated parity reaches about 35 % to 40 % efficiency (around 39 % with six capacity drives per server and 10 % mirror), against 25 % for a nested two-way mirror.
        fr: |
          Sur deux serveurs, un miroir bidirectionnel survit à la perte d'un serveur avec une efficacité de 50 %, la meilleure des options qui fonctionnent sur deux nœuds. Survivre en même temps à la panne d'un serveur et d'un disque exige une résilience imbriquée, disponible uniquement sur exactement deux serveurs : la parité accélérée par miroir imbriquée atteint environ 35 % à 40 % d'efficacité (environ 39 % avec six disques de capacité par serveur et 10 % de miroir), contre 25 % pour un miroir bidirectionnel imbriqué.
      options:
        threeway: { en: "Three-way mirror needs at least three servers.", fr: "Le miroir tridirectionnel exige au moins trois serveurs." }
        dualparity: { en: "Dual parity needs at least four servers.", fr: "La double parité exige au moins quatre serveurs." }
        nestedmirror: { en: "Nested two-way mirror meets both availability goals but has the lowest efficiency, 25 %.", fr: "Le miroir bidirectionnel imbriqué répond aux deux objectifs de disponibilité, mais il a l'efficacité la plus faible, 25 %." }
    references:
      - title: Nested resiliency for Storage Spaces Direct
        url: https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/nested-resiliency
      - title: Fault tolerance and storage efficiency on Azure Local and Windows Server clusters
        url: https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/fault-tolerance
