id: az802-cs2b-lamna-healthcare
status: draft
title:
  en: Lamna Healthcare
  fr: Lamna Healthcare
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Lamna Healthcare runs a hospital in Lille and five outpatient clinics in the surrounding towns. Medical imaging and administrative files are stored on Windows file servers.

        Lamna is modernizing its file services: the master copy of the clinic files will move to Azure Files, the clinics will keep a local cache, and the on-premises volumes must use less disk space.
      fr: |
        Lamna Healthcare exploite un hôpital à Lille et cinq centres de consultation dans les villes voisines. Les fichiers d'imagerie médicale et les fichiers administratifs sont stockés sur des serveurs de fichiers Windows.

        Lamna modernise ses services de fichiers : la copie de référence des fichiers des centres va migrer vers Azure Files, les centres conserveront un cache local, et les volumes locaux doivent occuper moins d'espace disque.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity.** The network contains an AD DS domain named **lamnahealth.com** at the Windows Server 2016 domain functional level. Users and groups are synchronized to Microsoft Entra ID. Every member server is in the **Servers** organizational unit (OU).

        **Servers.**

        | Name | Location | Operating system | Role |
        | --- | --- | --- | --- |
        | FS1 | Hospital | Windows Server 2022 Standard | File server, volume D: (imaging), volume F: (department shares and user documents) |
        | HV2 | Hospital | Windows Server 2022 Standard | Hyper-V host, volume H: stores the VHDX files of the line-of-business server VMs that run on HV2 |
        | BK1 | Hospital | Windows Server 2022 Standard (VM) | Virtualized backup application, backup storage on volume B: |
        | DB1 | Hospital | Windows Server 2022 Standard | SQL Server, database files on volume S:, heavy random I/O around the clock |
        | CL-FS1 | Clinic of Roubaix | Windows Server 2022 Standard | File server, volume E: (1 TiB) |

        The operating system volume of FS1 is protected by BitLocker with a TPM-only protector. Last month, after a UEFI firmware update, FS1 started on the BitLocker recovery screen and an administrator had to type the recovery password.

        **Azure.** Lamna has an Azure subscription that contains a storage account named **stlamnafiles**. stlamnafiles uses AD DS authentication for Azure Files and contains a file share named **records**. A Storage Sync Service named **SSS1** has a sync group named **Clinics** whose cloud endpoint is the records share. CL-FS1 is registered with SSS1.

        **Windows LAPS.** Windows LAPS is deployed. It manages the local Administrator password of the servers in the Servers OU and backs it up to AD DS. The administrators manage it from a server named **MGMT1** that has the Windows LAPS PowerShell module.

        **Groups.** The following AD DS groups are synchronized to Microsoft Entra ID: **Nurses**, **Records-Admins** and **Auditors**.
      fr: |
        **Identité.** Le réseau contient un domaine AD DS nommé **lamnahealth.com** au niveau fonctionnel de domaine Windows Server 2016. Les utilisateurs et les groupes sont synchronisés avec Microsoft Entra ID. Tous les serveurs membres se trouvent dans l'unité d'organisation (UO) **Servers**.

        **Serveurs.**

        | Nom | Emplacement | Système d'exploitation | Rôle |
        | --- | --- | --- | --- |
        | FS1 | Hôpital | Windows Server 2022 Standard | Serveur de fichiers, volume D: (imagerie), volume F: (partages des services et documents des utilisateurs) |
        | HV2 | Hôpital | Windows Server 2022 Standard | Hôte Hyper-V, le volume H: stocke les fichiers VHDX des machines virtuelles de serveurs métier qui s'exécutent sur HV2 |
        | BK1 | Hôpital | Windows Server 2022 Standard (machine virtuelle) | Application de sauvegarde virtualisée, stockage des sauvegardes sur le volume B: |
        | DB1 | Hôpital | Windows Server 2022 Standard | SQL Server, fichiers de base de données sur le volume S:, E/S aléatoires intensives jour et nuit |
        | CL-FS1 | Centre de Roubaix | Windows Server 2022 Standard | Serveur de fichiers, volume E: (1 Tio) |

        Le volume du système d'exploitation de FS1 est protégé par BitLocker avec un protecteur TPM uniquement. Le mois dernier, après une mise à jour du microprogramme UEFI, FS1 a démarré sur l'écran de récupération BitLocker et un administrateur a dû saisir le mot de passe de récupération.

        **Azure.** Lamna dispose d'un abonnement Azure qui contient un compte de stockage nommé **stlamnafiles**. stlamnafiles utilise l'authentification AD DS pour Azure Files et contient un partage de fichiers nommé **records**. Un service de synchronisation de stockage nommé **SSS1** possède un groupe de synchronisation nommé **Clinics** dont le point de terminaison cloud est le partage records. CL-FS1 est inscrit auprès de SSS1.

        **Windows LAPS.** Windows LAPS est déployé. Il gère le mot de passe du compte Administrateur local des serveurs de l'UO Servers et le sauvegarde dans AD DS. Les administrateurs le gèrent depuis un serveur nommé **MGMT1** qui dispose du module PowerShell Windows LAPS.

        **Groupes.** Les groupes AD DS suivants sont synchronisés avec Microsoft Entra ID : **Nurses**, **Records-Admins** et **Auditors**.
  - key: plans
    title: { en: "Planned changes", fr: "Modifications prévues" }
    body:
      en: |
        **Azure File Sync on CL-FS1.** Two server endpoints with cloud tiering enabled will be created on volume E:

        | Server endpoint path | Volume free space policy | Date policy |
        | --- | --- | --- |
        | E:\Imaging | 20% | 30 days |
        | E:\Admin | 35% | None |

        **Firmware.** A new UEFI firmware update for FS1 is scheduled for tonight. The update restarts FS1 twice.
      fr: |
        **Azure File Sync sur CL-FS1.** Deux points de terminaison de serveur avec la hiérarchisation cloud activée seront créés sur le volume E: :

        | Chemin du point de terminaison de serveur | Stratégie d'espace libre du volume | Stratégie de date |
        | --- | --- | --- |
        | E:\Imaging | 20 % | 30 jours |
        | E:\Admin | 35 % | Aucune |

        **Microprogramme.** Une nouvelle mise à jour du microprogramme UEFI de FS1 est planifiée pour ce soir. La mise à jour redémarre FS1 deux fois.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Lamna identifies the following requirements:

        1. **Share permissions.** On the records share, the Nurses group must read, create, modify and delete files. The Records-Admins group must also be able to change the NTFS permissions of files and folders. The Auditors group must only read files. Share-level permissions must not override the NTFS permissions, and the principle of least privilege must be applied.
        2. **Storage efficiency.** Data Deduplication must be configured for the volumes F:, H:, B: and S:. It must be enabled right away, with the usage type suited to the workload, only on the volumes whose workload Microsoft recommends for deduplication without prior evaluation. The other volumes must be evaluated first.
        3. **Firmware.** FS1 must not start on the BitLocker recovery screen during tonight's update. BitLocker protection must resume automatically once the update is complete, without any action from an administrator.
      fr: |
        Lamna a défini les exigences suivantes :

        1. **Autorisations de partage.** Sur le partage records, le groupe Nurses doit pouvoir lire, créer, modifier et supprimer des fichiers. Le groupe Records-Admins doit en plus pouvoir modifier les autorisations NTFS des fichiers et des dossiers. Le groupe Auditors doit uniquement lire les fichiers. Les autorisations au niveau du partage ne doivent pas passer outre les autorisations NTFS, et le principe du moindre privilège doit être appliqué.
        2. **Efficacité du stockage.** La déduplication des données doit être configurée pour les volumes F:, H:, B: et S:. Elle doit être activée immédiatement, avec le type d'utilisation adapté à la charge de travail, uniquement sur les volumes dont Microsoft recommande la charge de travail pour la déduplication sans évaluation préalable. Les autres volumes doivent d'abord être évalués.
        3. **Microprogramme.** FS1 ne doit pas démarrer sur l'écran de récupération BitLocker pendant la mise à jour de ce soir. La protection BitLocker doit reprendre automatiquement une fois la mise à jour terminée, sans intervention d'un administrateur.
