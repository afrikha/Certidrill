id: az802-cs4a-trey-research
status: draft
title:
  en: Trey Research
  fr: Trey Research
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Trey Research is a biotechnology company that develops diagnostic reagents. It has 900 employees: 750 at the headquarters in Boston and 150 in a research laboratory in Basel. A team of five administrators in Boston manages all the servers.

        The Basel laboratory is connected to Boston by a site-to-site VPN. Boston is connected to an Azure subscription named **Sub-Trey** (region East US) by another site-to-site VPN.
      fr: |
        Trey Research est une société de biotechnologie qui développe des réactifs de diagnostic. Elle compte 900 employés : 750 au siège de Boston et 150 dans un laboratoire de recherche à Bâle. Une équipe de cinq administrateurs basée à Boston gère tous les serveurs.

        Le laboratoire de Bâle est relié à Boston par un VPN site à site. Boston est relié à un abonnement Azure nommé **Sub-Trey** (région East US) par un autre VPN site à site.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Active Directory**

        The network contains a single-domain Active Directory forest named **treyresearch.com**. The forest and domain functional levels are Windows Server 2016. The forest has three AD DS sites: **Boston**, **Basel** and **Azure-EastUS**. The site link **Boston-Basel** has the default cost (100) and replication interval (180 minutes). The Basel subnet, **10.20.0.0/16**, is not defined in Active Directory.

        The domain contains the following groups:

        | Group | Members |
        | --- | --- |
        | Basel-Scientists | The user accounts of the Basel employees |
        | Basel-Computers | The computer accounts of the Basel workstations |
        | Basel-ITSupport | Two Basel technicians, who are not members of any administrative group |
        | T0-Admins | The five administrators, who are members of Domain Admins |

        **Servers**

        | Server | Site | Operating system | Configuration |
        | --- | --- | --- | --- |
        | DC2 | Boston | Windows Server 2022 Datacenter | Domain controller, global catalog, DNS server; holds all five operation master roles |
        | DC3 | Azure-EastUS | Windows Server 2025 Datacenter (Azure VM) | Domain controller, global catalog, DNS server |
        | HV1 | Boston | Windows Server 2025 Datacenter | Hyper-V host, member server; runs a VM named **LIMS-VM1** |
        | HV3 | Basel | Windows Server 2025 Datacenter | Hyper-V host, member server |
        | FS1, FS2 | Boston | Windows Server 2025 Standard | File servers, member servers |
        | APP1 | Boston | Windows Server 2019 Standard | Runs a legacy inventory application named **ChemTrack** |
        | BSL-DC1 | Basel | Windows Server 2025 Standard | Workgroup server, not yet promoted |

        LIMS-VM1 runs the laboratory information management system. Hyper-V Replica replicates LIMS-VM1 from HV1 to HV3 every five minutes by using Kerberos authentication.

        FS1 has two data volumes: **D:** (instrument data, 1.5 TB) and **E:** (genomics data, 3 TB). The round-trip latency between FS1 and FS2 is about 1 ms.

        ChemTrack supports only NTLM authentication.
      fr: |
        **Active Directory**

        Le réseau contient une forêt Active Directory à domaine unique nommée **treyresearch.com**. Les niveaux fonctionnels de la forêt et du domaine sont Windows Server 2016. La forêt compte trois sites AD DS : **Boston**, **Basel** et **Azure-EastUS**. Le lien de sites **Boston-Basel** a le coût (100) et l'intervalle de réplication (180 minutes) par défaut. Le sous-réseau de Bâle, **10.20.0.0/16**, n'est pas défini dans Active Directory.

        Le domaine contient les groupes suivants :

        | Groupe | Membres |
        | --- | --- |
        | Basel-Scientists | Les comptes d'utilisateur des employés de Bâle |
        | Basel-Computers | Les comptes d'ordinateur des postes de travail de Bâle |
        | Basel-ITSupport | Deux techniciens de Bâle, qui ne sont membres d'aucun groupe d'administration |
        | T0-Admins | Les cinq administrateurs, qui sont membres de Domain Admins |

        **Serveurs**

        | Serveur | Site | Système d'exploitation | Configuration |
        | --- | --- | --- | --- |
        | DC2 | Boston | Windows Server 2022 Datacenter | Contrôleur de domaine, catalogue global, serveur DNS ; détient les cinq rôles de maître d'opérations |
        | DC3 | Azure-EastUS | Windows Server 2025 Datacenter (machine virtuelle Azure) | Contrôleur de domaine, catalogue global, serveur DNS |
        | HV1 | Boston | Windows Server 2025 Datacenter | Hôte Hyper-V, serveur membre ; exécute une machine virtuelle nommée **LIMS-VM1** |
        | HV3 | Basel | Windows Server 2025 Datacenter | Hôte Hyper-V, serveur membre |
        | FS1, FS2 | Boston | Windows Server 2025 Standard | Serveurs de fichiers, serveurs membres |
        | APP1 | Boston | Windows Server 2019 Standard | Exécute une application d'inventaire héritée nommée **ChemTrack** |
        | BSL-DC1 | Basel | Windows Server 2025 Standard | Serveur de groupe de travail, pas encore promu |

        LIMS-VM1 exécute le système de gestion des informations du laboratoire. Réplica Hyper-V réplique LIMS-VM1 de HV1 vers HV3 toutes les cinq minutes avec l'authentification Kerberos.

        FS1 dispose de deux volumes de données : **D:** (données des instruments, 1,5 To) et **E:** (données génomiques, 3 To). La latence aller-retour entre FS1 et FS2 est d'environ 1 ms.

        ChemTrack ne prend en charge que l'authentification NTLM.
  - key: problems
    title: { en: "Problem statements", fr: "Problèmes" }
    body:
      en: |
        - Last week, the system board of a domain controller named DC1 failed beyond repair. DC1 held all five operation master roles. The administrators seized all the roles to DC2 and removed the metadata of DC1. DC1 will not return.
        - Yesterday, APP1 was restored from a three-month-old backup. Since then, domain users cannot sign in to APP1, and APP1 logs errors stating that the trust relationship with the domain failed. The local Administrator account of APP1 still works. A ChemTrack batch job that runs until next week prevents any restart of APP1.
        - The Basel server room is shared with a partner company, and its physical security cannot be guaranteed.
      fr: |
        - La semaine dernière, la carte mère d'un contrôleur de domaine nommé DC1 a subi une panne irréparable. DC1 détenait les cinq rôles de maître d'opérations. Les administrateurs ont saisi tous les rôles vers DC2 et supprimé les métadonnées de DC1. DC1 ne reviendra pas.
        - Hier, APP1 a été restauré à partir d'une sauvegarde vieille de trois mois. Depuis, les utilisateurs du domaine ne peuvent plus se connecter à APP1, et APP1 journalise des erreurs indiquant l'échec de la relation d'approbation avec le domaine. Le compte Administrator local d'APP1 fonctionne toujours. Un traitement par lots de ChemTrack qui s'exécute jusqu'à la semaine prochaine empêche tout redémarrage d'APP1.
        - La salle des serveurs de Bâle est partagée avec une société partenaire, et sa sécurité physique ne peut pas être garantie.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Planned changes**

        - Deploy BSL-DC1 as a read-only domain controller (RODC) in the Basel site by using a staged installation. A member of Domain Admins creates the RODC account; a member of Basel-ITSupport then attaches BSL-DC1 to it.

        **Technical requirements**

        - Only the passwords of the members of Basel-Scientists and Basel-Computers can be cached on BSL-DC1.
        - The members of Basel-ITSupport must be able to complete the installation of BSL-DC1 and to administer it locally, without receiving administrative rights on the domain.
        - The Basel workstations must locate the domain controllers of the Basel site.
        - Changes made in Boston must replicate to the Basel site as soon as they are made, as they do within a site, instead of waiting for the replication interval of the site link.
        - The trust relationship of APP1 must be restored without restarting APP1. The computer account of APP1 must be kept.
        - The user accounts of T0-Admins must be added to the Protected Users group.
        - The disaster recovery procedures of LIMS-VM1 must use Hyper-V Replica only.
        - Volumes D: and E: of FS1 must be replicated to FS2 by using Storage Replica in synchronous mode, so that no data is lost if FS1 fails.
      fr: |
        **Modifications prévues**

        - Déployer BSL-DC1 comme contrôleur de domaine en lecture seule (RODC) dans le site Basel en utilisant une installation intermédiaire (staged). Un membre de Domain Admins crée le compte RODC ; un membre de Basel-ITSupport y attache ensuite BSL-DC1.

        **Exigences techniques**

        - Seuls les mots de passe des membres de Basel-Scientists et de Basel-Computers peuvent être mis en cache sur BSL-DC1.
        - Les membres de Basel-ITSupport doivent pouvoir terminer l'installation de BSL-DC1 et l'administrer localement, sans recevoir de droits d'administration sur le domaine.
        - Les postes de travail de Bâle doivent localiser les contrôleurs de domaine du site Basel.
        - Les modifications faites à Boston doivent être répliquées vers le site Basel dès qu'elles sont effectuées, comme au sein d'un site, au lieu d'attendre l'intervalle de réplication du lien de sites.
        - La relation d'approbation d'APP1 doit être rétablie sans redémarrer APP1. Le compte d'ordinateur d'APP1 doit être conservé.
        - Les comptes d'utilisateur de T0-Admins doivent être ajoutés au groupe Protected Users.
        - Les procédures de reprise d'activité de LIMS-VM1 doivent utiliser uniquement Réplica Hyper-V.
        - Les volumes D: et E: de FS1 doivent être répliqués vers FS2 avec Réplica de stockage en mode synchrone, afin qu'aucune donnée ne soit perdue en cas de panne de FS1.
