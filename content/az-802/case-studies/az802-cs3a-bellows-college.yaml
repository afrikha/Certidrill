id: az802-cs3a-bellows-college
status: draft
title:
  en: Bellows College
  fr: Bellows College
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Bellows College is a private engineering school with 6,000 students. Teaching takes place on the main campus. A research center and a library are in two other buildings of the same city, connected to the campus by private fiber links.

        An IT team of ten administrators manages the servers. A help desk staffed by student workers handles first-level support.
      fr: |
        Bellows College est une école d'ingénieurs privée qui compte 6 000 étudiants. Les cours ont lieu sur le campus principal. Un centre de recherche et une bibliothèque occupent deux autres bâtiments de la même ville, reliés au campus par des liaisons fibre privées.

        Une équipe informatique de dix administrateurs gère les serveurs. Un service d'assistance composé d'étudiants salariés assure le support de premier niveau.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Active Directory.** The network contains a single-domain AD DS forest named **corp.bellowscollege.com**. The forest and domain functional levels are Windows Server 2016. The domain controllers DC1, DC2 and DC3 run Windows Server 2025. Active Directory Recycle Bin was enabled in 2023.

        The domain contains the organizational units (OUs) **Staff**, **Students**, **Research** and **Lab-Servers**, and the global security groups **Staff**, **IT-Admins** and **HelpDesk**.

        **Password policies.** The Default Domain Policy sets a minimum password length of 10 characters. A GPO named **Faculty Settings** is linked to the Staff OU and sets a minimum password length of 6 characters. The domain contains the following password settings objects (PSOs):

        | PSO | Precedence | Applies to | Minimum password length |
        | --- | --- | --- | --- |
        | PSO-Admins | 10 | Group IT-Admins | 16 |
        | PSO-Staff | 20 | Group Staff | 12 |
        | PSO-Lab | 40 | User account labadmin | 14 |

        The labadmin account is a member of IT-Admins.

        **Name resolution.** A member server named **DNS1** runs Windows Server 2025 and hosts the zone **bellowscollege.com** as a file-backed primary zone. The zone contains the record portal (A, 10.60.1.80). The laboratories of the research center use the subnet **10.60.20.0/24**.

        **File servers.** All the file servers run Windows Server 2025.

        | Server | Location | Role |
        | --- | --- | --- |
        | FS1 | Campus | Hosts D:\Courses (full data set), D:\Home (student home folders), D:\Research, D:\Coursework and D:\Media |
        | FS2 | Research center | Hosts D:\Courses |
        | FS3 | Library | Hosts D:\Courses |

        The DFS namespace **\\\\corp.bellowscollege.com\\Docs** has a folder named Courses with targets on FS1, FS2 and FS3. The DFS Replication group **RG-Courses** replicates D:\Courses between the three servers.

        **Azure.** The college has an Azure subscription that contains a Storage Sync Service named **sss-bellows** and a sync group named **SG-Courses** whose cloud endpoint is the Azure file share **courses**. The Azure File Sync agent is installed on FS1, FS2 and FS3, and the three servers are registered with sss-bellows.

        **Lab servers.** The Lab-Servers OU contains 30 servers. The forest schema was extended by running Update-LapsADSchema. A GPO named **LAPS-Labs** is linked to the Lab-Servers OU. It configures Windows LAPS to back up the password of the built-in Administrator account to Active Directory and to encrypt it.
      fr: |
        **Active Directory.** Le réseau contient une forêt AD DS à domaine unique nommée **corp.bellowscollege.com**. Les niveaux fonctionnels de la forêt et du domaine sont Windows Server 2016. Les contrôleurs de domaine DC1, DC2 et DC3 exécutent Windows Server 2025. La Corbeille Active Directory a été activée en 2023.

        Le domaine contient les unités d'organisation (UO) **Staff**, **Students**, **Research** et **Lab-Servers**, ainsi que les groupes de sécurité globaux **Staff**, **IT-Admins** et **HelpDesk**.

        **Stratégies de mot de passe.** La stratégie Default Domain Policy impose une longueur minimale de mot de passe de 10 caractères. Un objet de stratégie de groupe (GPO) nommé **Faculty Settings** est lié à l'UO Staff et impose une longueur minimale de mot de passe de 6 caractères. Le domaine contient les objets de paramètres de mot de passe (PSO) suivants :

        | PSO | Priorité | S'applique à | Longueur minimale du mot de passe |
        | --- | --- | --- | --- |
        | PSO-Admins | 10 | Groupe IT-Admins | 16 |
        | PSO-Staff | 20 | Groupe Staff | 12 |
        | PSO-Lab | 40 | Compte d'utilisateur labadmin | 14 |

        Le compte labadmin est membre d'IT-Admins.

        **Résolution de noms.** Un serveur membre nommé **DNS1** exécute Windows Server 2025 et héberge la zone **bellowscollege.com** en tant que zone principale stockée dans un fichier. La zone contient l'enregistrement portal (A, 10.60.1.80). Les laboratoires du centre de recherche utilisent le sous-réseau **10.60.20.0/24**.

        **Serveurs de fichiers.** Tous les serveurs de fichiers exécutent Windows Server 2025.

        | Serveur | Emplacement | Rôle |
        | --- | --- | --- |
        | FS1 | Campus | Héberge D:\Courses (jeu de données complet), D:\Home (dossiers de base des étudiants), D:\Research, D:\Coursework et D:\Media |
        | FS2 | Centre de recherche | Héberge D:\Courses |
        | FS3 | Bibliothèque | Héberge D:\Courses |

        L'espace de noms DFS **\\\\corp.bellowscollege.com\\Docs** contient un dossier nommé Courses dont les cibles sont sur FS1, FS2 et FS3. Le groupe de réplication DFS **RG-Courses** réplique D:\Courses entre les trois serveurs.

        **Azure.** L'école dispose d'un abonnement Azure qui contient un service de synchronisation de stockage nommé **sss-bellows** et un groupe de synchronisation nommé **SG-Courses** dont le point de terminaison cloud est le partage de fichiers Azure **courses**. L'agent Azure File Sync est installé sur FS1, FS2 et FS3, et les trois serveurs sont inscrits auprès de sss-bellows.

        **Serveurs de laboratoire.** L'UO Lab-Servers contient 30 serveurs. Le schéma de la forêt a été étendu en exécutant Update-LapsADSchema. Un GPO nommé **LAPS-Labs** est lié à l'UO Lab-Servers. Il configure Windows LAPS pour sauvegarder le mot de passe du compte Administrateur intégré dans Active Directory et pour le chiffrer.
  - key: problems
    title: { en: "Problem statements", fr: "Problèmes constatés" }
    body:
      en: |
        Yesterday, an administrator deleted the Research OU by mistake. The OU contained 25 user accounts that are members of several groups. AD DS replication is healthy.
      fr: |
        Hier, un administrateur a supprimé l'UO Research par erreur. L'UO contenait 25 comptes d'utilisateur membres de plusieurs groupes. La réplication AD DS est saine.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Bellows College identifies the following requirements:

        1. **File sync.** Replace RG-Courses with SG-Courses by following the Microsoft-recommended migration procedure. Cloud tiering will be enabled on FS2 and FS3 after the migration.
        2. **File Server Resource Manager (FSRM)** on FS1:
           - A student must not be able to store more than 2 GB in a home folder.
           - The administrators must receive an email when D:\Research exceeds 500 GB, and writes to D:\Research must never be blocked.
           - Executable files must never be saved in D:\Coursework.
           - Video files saved in D:\Media must be saved and reported to the administrators.
        3. **Name resolution.** Computers in 10.60.20.0/24 must resolve portal.bellowscollege.com to 10.60.20.80. All the other computers must keep resolving the name to 10.60.1.80.
        4. **Lab servers.** The members of HelpDesk must be able to retrieve the Windows LAPS passwords of the lab servers. HelpDesk must not be added to any built-in administrative group, and the principle of least privilege must be followed.
        5. **Recovery.** Deleted AD DS objects must be recovered without restarting any domain controller.
      fr: |
        Bellows College a défini les exigences suivantes :

        1. **Synchronisation de fichiers.** Remplacer RG-Courses par SG-Courses en suivant la procédure de migration recommandée par Microsoft. La hiérarchisation cloud sera activée sur FS2 et FS3 après la migration.
        2. **Gestionnaire de ressources du serveur de fichiers (FSRM)** sur FS1 :
           - Un étudiant ne doit pas pouvoir stocker plus de 2 Go dans un dossier de base.
           - Les administrateurs doivent recevoir un e-mail quand D:\Research dépasse 500 Go, et les écritures dans D:\Research ne doivent jamais être bloquées.
           - Aucun fichier exécutable ne doit jamais être enregistré dans D:\Coursework.
           - Les fichiers vidéo enregistrés dans D:\Media doivent être enregistrés et signalés aux administrateurs.
        3. **Résolution de noms.** Les ordinateurs du sous-réseau 10.60.20.0/24 doivent résoudre portal.bellowscollege.com en 10.60.20.80. Tous les autres ordinateurs doivent continuer à résoudre ce nom en 10.60.1.80.
        4. **Serveurs de laboratoire.** Les membres de HelpDesk doivent pouvoir récupérer les mots de passe Windows LAPS des serveurs de laboratoire. HelpDesk ne doit être ajouté à aucun groupe d'administration intégré, et le principe du privilège minimum doit être respecté.
        5. **Récupération.** Les objets AD DS supprimés doivent être récupérés sans redémarrer aucun contrôleur de domaine.
