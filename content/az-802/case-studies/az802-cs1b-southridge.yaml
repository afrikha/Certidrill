id: az802-cs1b-southridge
status: draft
title:
  en: Southridge Video
  fr: Southridge Video
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Southridge Video produces documentaries and commercials. Its head office and main studio are in Montréal, and a second studio is in Lyon. Editors work on large video files, and a render farm of 20 physical render nodes processes the final cuts.

        Two administrators manage the servers in both studios.
      fr: |
        Southridge Video produit des documentaires et des publicités. Son siège et son studio principal se trouvent à Montréal, et un second studio est installé à Lyon. Les monteurs travaillent sur des fichiers vidéo volumineux, et une ferme de rendu de 20 nœuds de rendu physiques traite les montages finaux.

        Deux administrateurs gèrent les serveurs des deux studios.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        The network contains an Active Directory Domain Services (AD DS) domain named **southridgevideo.com**. All the servers run Windows Server 2022 and are members of the domain.

        | Server | Location | Configuration |
        | --- | --- | --- |
        | FS-MTL1 | Montréal | File server. Volume E: stores the archive of finished projects. A storage pool named **Pool1** contains six new physical disks of the same size, no hot spare and no virtual disk. |
        | VDI-HV1 | Montréal | Hyper-V host for the pooled virtual desktops of the editors. Volume V: stores the VHDX files of the desktops. The Data Deduplication role service is installed. |
        | FS-LYO1 | Lyon | Server endpoint of the sync group **Projects** of an Azure File Sync Storage Sync Service named **sss-southridge**. Cloud tiering is enabled on the server endpoint. |
        | DHCP1 | Montréal | DHCP server authorized in AD DS. It serves the office networks of Montréal. |
        | DHCP2 | Montréal | New DHCP server (10.30.0.6) installed by using `Install-WindowsFeature DHCP -IncludeManagementTools`. The DHCP security groups were created and the DHCP Server service was restarted. The active scope 10.30.5.0/24 serves the render network. |

        **BitLocker.** Volume E: on FS-MTL1 is encrypted by BitLocker Drive Encryption. Its only key protector is a password protector. No recovery information for E: is stored in AD DS.

        **Render farm.** The render nodes are connected to the render network, on the same subnet as DHCP2. They don't receive any IP address from DHCP2. When you run `Get-DhcpServerInDC` on DHCP1, the output lists only DHCP1.
      fr: |
        Le réseau contient un domaine Active Directory Domain Services (AD DS) nommé **southridgevideo.com**. Tous les serveurs exécutent Windows Server 2022 et sont membres du domaine.

        | Serveur | Emplacement | Configuration |
        | --- | --- | --- |
        | FS-MTL1 | Montréal | Serveur de fichiers. Le volume E: stocke l'archive des projets terminés. Un pool de stockage nommé **Pool1** contient six nouveaux disques physiques de même taille, sans disque de secours et sans disque virtuel. |
        | VDI-HV1 | Montréal | Hôte Hyper-V des bureaux virtuels en pool des monteurs. Le volume V: stocke les fichiers VHDX des bureaux. Le service de rôle Déduplication des données est installé. |
        | FS-LYO1 | Lyon | Point de terminaison de serveur du groupe de synchronisation **Projects** d'un service de synchronisation de stockage Azure File Sync nommé **sss-southridge**. La hiérarchisation cloud est activée sur le point de terminaison de serveur. |
        | DHCP1 | Montréal | Serveur DHCP autorisé dans AD DS. Il dessert les réseaux bureautiques de Montréal. |
        | DHCP2 | Montréal | Nouveau serveur DHCP (10.30.0.6) installé avec `Install-WindowsFeature DHCP -IncludeManagementTools`. Les groupes de sécurité DHCP ont été créés et le service Serveur DHCP a été redémarré. L'étendue active 10.30.5.0/24 dessert le réseau de rendu. |

        **BitLocker.** Le volume E: de FS-MTL1 est chiffré par le chiffrement de lecteur BitLocker. Son seul protecteur de clé est un protecteur par mot de passe. Aucune information de récupération de E: n'est stockée dans AD DS.

        **Ferme de rendu.** Les nœuds de rendu sont connectés au réseau de rendu, sur le même sous-réseau que DHCP2. Ils ne reçoivent aucune adresse IP de DHCP2. Quand vous exécutez `Get-DhcpServerInDC` sur DHCP1, le résultat ne liste que DHCP1.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Southridge identifies the following requirements:

        1. **Desktops.** Data Deduplication must be enabled on volume V: with the settings tuned for the pooled virtual desktops.
        2. **Media library.** A new volume in Pool1 must remain available if two disks of Pool1 fail at the same time.
        3. **Recovery.** A recovery password for volume E: must be stored in AD DS. Volume E: must not be decrypted.
        4. **Render farm.** The render nodes must receive their IP addresses from DHCP2.
        5. **Lyon cache.** The administrators must be alerted when less than 80 % of the bytes accessed on FS-LYO1 are served from its local cache.
        6. **Capacity.** The administrators must get a forecast of the storage consumption of each volume of FS-MTL1. The data must be collected and analyzed only on FS-MTL1.
        7. Administrative effort must be minimized.
      fr: |
        Southridge a défini les exigences suivantes :

        1. **Bureaux.** La déduplication des données doit être activée sur le volume V: avec les paramètres adaptés aux bureaux virtuels en pool.
        2. **Médiathèque.** Un nouveau volume de Pool1 doit rester disponible si deux disques de Pool1 tombent en panne en même temps.
        3. **Récupération.** Un mot de passe de récupération du volume E: doit être stocké dans AD DS. Le volume E: ne doit pas être déchiffré.
        4. **Ferme de rendu.** Les nœuds de rendu doivent recevoir leurs adresses IP de DHCP2.
        5. **Cache de Lyon.** Les administrateurs doivent être alertés quand moins de 80 % des octets consultés sur FS-LYO1 sont servis depuis son cache local.
        6. **Capacité.** Les administrateurs doivent obtenir une prévision de la consommation de stockage de chaque volume de FS-MTL1. Les données doivent être collectées et analysées uniquement sur FS-MTL1.
        7. L'effort d'administration doit être réduit au minimum.
