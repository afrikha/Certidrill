id: az802-cs4b-lucerne-publishing
status: draft
title:
  en: Lucerne Publishing
  fr: Lucerne Publishing
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Lucerne Publishing is a book and magazine publisher with offices in Seattle (headquarters) and London. It has 600 employees, and many of its editors work from home.

        Lucerne recently acquired Graphic Design Institute (GDI), an illustration studio of 80 employees in Dublin that keeps its own Active Directory forest.
      fr: |
        Lucerne Publishing est un éditeur de livres et de magazines qui a des bureaux à Seattle (siège) et à Londres. Il compte 600 employés, et beaucoup de ses rédacteurs travaillent depuis leur domicile.

        Lucerne a récemment acquis Graphic Design Institute (GDI), un studio d'illustration de 80 employés situé à Dublin, qui conserve sa propre forêt Active Directory.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Active Directory forests**

        | Forest | Domains | Trusts |
        | --- | --- | --- |
        | lucernepublishing.com | lucernepublishing.com, eu.lucernepublishing.com | One-way forest trust: lucernepublishing.com trusts graphicdesigninstitute.com |
        | graphicdesigninstitute.com | graphicdesigninstitute.com | One-way forest trust: trusted by lucernepublishing.com |

        Name resolution between the two forests is configured. The following groups exist:

        | Group | Domain | Scope | Members |
        | --- | --- | --- | --- |
        | GDI-Studio | graphicdesigninstitute.com | Global | The groups of all the GDI teams |
        | LP-ArtEditors | lucernepublishing.com | Global | The art editors of Seattle |
        | EU-ArtEditors | eu.lucernepublishing.com | Global | The art editors of London |

        **On-premises servers**

        | Server | Location | Operating system | Role |
        | --- | --- | --- | --- |
        | DC1, DC2 | Seattle | Windows Server 2025 | Domain controllers and DNS servers of lucernepublishing.com |
        | DC3 | London | Windows Server 2025 | Domain controller and DNS server of eu.lucernepublishing.com |
        | FS1 | Seattle | Windows Server 2022 Standard | File server with the folders **D:\Manuscripts** (4 TB) and **C:\Templates** (20 GB) |
        | FS2 | London | Windows Server 2022 Standard | File server, member of eu.lucernepublishing.com; hosts a share named **Artwork** |
        | LON-DHCP1 | London | Windows Server 2025 | DHCP server of the London office; scope 10.30.0.0/24 with the range 10.30.0.20–10.30.0.200 |
        | FS3 | Seattle perimeter network | Windows Server 2022 Standard | File server for the editors, reachable only through the corporate VPN |

        All DNS zones are Active Directory-integrated. All the on-premises servers are Azure Arc-enabled servers in a resource group named **RG-Arc**.

        **Azure**

        Lucerne has an Azure subscription named **Sub1** that contains the following resources:

        | Resource | Configuration |
        | --- | --- |
        | stlucernefiles | Storage account with the Azure file shares **manuscripts** and **templates** |
        | LAW-Lucerne | Log Analytics workspace |

        Microsoft Sentinel is not deployed.
      fr: |
        **Forêts Active Directory**

        | Forêt | Domaines | Approbations |
        | --- | --- | --- |
        | lucernepublishing.com | lucernepublishing.com, eu.lucernepublishing.com | Approbation de forêt unidirectionnelle : lucernepublishing.com approuve graphicdesigninstitute.com |
        | graphicdesigninstitute.com | graphicdesigninstitute.com | Approbation de forêt unidirectionnelle : approuvée par lucernepublishing.com |

        La résolution de noms entre les deux forêts est configurée. Les groupes suivants existent :

        | Groupe | Domaine | Étendue | Membres |
        | --- | --- | --- | --- |
        | GDI-Studio | graphicdesigninstitute.com | Globale | Les groupes de toutes les équipes de GDI |
        | LP-ArtEditors | lucernepublishing.com | Globale | Les directeurs artistiques de Seattle |
        | EU-ArtEditors | eu.lucernepublishing.com | Globale | Les directeurs artistiques de Londres |

        **Serveurs locaux**

        | Serveur | Emplacement | Système d'exploitation | Rôle |
        | --- | --- | --- | --- |
        | DC1, DC2 | Seattle | Windows Server 2025 | Contrôleurs de domaine et serveurs DNS de lucernepublishing.com |
        | DC3 | Londres | Windows Server 2025 | Contrôleur de domaine et serveur DNS de eu.lucernepublishing.com |
        | FS1 | Seattle | Windows Server 2022 Standard | Serveur de fichiers avec les dossiers **D:\Manuscripts** (4 To) et **C:\Templates** (20 Go) |
        | FS2 | Londres | Windows Server 2022 Standard | Serveur de fichiers, membre de eu.lucernepublishing.com ; héberge un partage nommé **Artwork** |
        | LON-DHCP1 | Londres | Windows Server 2025 | Serveur DHCP du bureau de Londres ; étendue 10.30.0.0/24 avec la plage 10.30.0.20–10.30.0.200 |
        | FS3 | Réseau de périmètre de Seattle | Windows Server 2022 Standard | Serveur de fichiers des rédacteurs, accessible uniquement via le VPN de l'entreprise |

        Toutes les zones DNS sont intégrées à Active Directory. Tous les serveurs locaux sont des serveurs avec Azure Arc dans un groupe de ressources nommé **RG-Arc**.

        **Azure**

        Lucerne dispose d'un abonnement Azure nommé **Sub1** qui contient les ressources suivantes :

        | Ressource | Configuration |
        | --- | --- |
        | stlucernefiles | Compte de stockage avec les partages de fichiers Azure **manuscripts** et **templates** |
        | LAW-Lucerne | Espace de travail Log Analytics |

        Microsoft Sentinel n'est pas déployé.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Identity**

        - A new group that contains the user accounts of the GDI illustrators must be created in graphicdesigninstitute.com and added to GDI-Studio.
        - The GDI illustrators, LP-ArtEditors and EU-ArtEditors must receive the Modify permission on the Artwork share of FS2 through the AGDLP strategy: a single group of lucernepublishing.com must contain LP-ArtEditors and EU-ArtEditors, and only one group must be granted the permission.

        **Files**

        - D:\Manuscripts on FS1 must sync with the **manuscripts** file share by using Azure File Sync. FS2 must keep a cached copy of the same content.
        - C:\Templates on FS1 must sync with the **templates** file share by using the same Storage Sync Service.
        - Editors who work from home on Windows 11 laptops must access the shares of FS3 over the internet without the VPN by using SMB over QUIC. TCP port 445 must stay blocked from the internet.

        **IP addressing**

        - A printer named **PRN-LON1**, whose MAC address is 00-15-5D-0A-1B-2C, must always receive the IP address 10.30.0.50 from LON-DHCP1.

        **Operations**

        - The Arc-enabled servers must be checked daily for missing updates, and updates must be installed on the second Saturday of every month at 22:00. Update compliance must be visible in the Azure portal.
        - The following events must be collected in LAW-Lucerne by using the Azure Monitor Agent:
          - FS1, FS2 and FS3: Critical and Error events of the System log
          - DC1, DC2 and DC3: events with Event ID 4740 of the Security log
          - DC1, DC2 and DC3: Critical, Error and Warning events of the System log
        - Administrative effort must be minimized.
      fr: |
        **Identité**

        - Un nouveau groupe contenant les comptes d'utilisateur des illustrateurs de GDI doit être créé dans graphicdesigninstitute.com et ajouté à GDI-Studio.
        - Les illustrateurs de GDI, LP-ArtEditors et EU-ArtEditors doivent recevoir l'autorisation Modify sur le partage Artwork de FS2 selon la stratégie AGDLP : un seul groupe de lucernepublishing.com doit contenir LP-ArtEditors et EU-ArtEditors, et un seul groupe doit recevoir l'autorisation.

        **Fichiers**

        - D:\Manuscripts sur FS1 doit se synchroniser avec le partage de fichiers **manuscripts** à l'aide d'Azure File Sync. FS2 doit conserver une copie en cache du même contenu.
        - C:\Templates sur FS1 doit se synchroniser avec le partage de fichiers **templates** à l'aide du même service de synchronisation de stockage.
        - Les rédacteurs qui travaillent depuis leur domicile sur des ordinateurs portables Windows 11 doivent accéder aux partages de FS3 par Internet, sans le VPN, à l'aide de SMB over QUIC. Le port TCP 445 doit rester bloqué depuis Internet.

        **Adressage IP**

        - Une imprimante nommée **PRN-LON1**, dont l'adresse MAC est 00-15-5D-0A-1B-2C, doit toujours recevoir l'adresse IP 10.30.0.50 de LON-DHCP1.

        **Exploitation**

        - Les serveurs avec Azure Arc doivent être vérifiés chaque jour pour détecter les mises à jour manquantes, et les mises à jour doivent être installées le deuxième samedi de chaque mois à 22 h 00. La conformité des mises à jour doit être visible dans le portail Azure.
        - Les événements suivants doivent être collectés dans LAW-Lucerne à l'aide de l'Agent Azure Monitor :
          - FS1, FS2 et FS3 : événements critiques et d'erreur du journal System
          - DC1, DC2 et DC3 : événements d'ID 4740 du journal Security
          - DC1, DC2 et DC3 : événements critiques, d'erreur et d'avertissement du journal System
        - L'effort d'administration doit être réduit au minimum.
