# AZ-802 objectives — official study guide (en-us and fr-fr pages, checked on 2026-11-16); the guide shows no
# "Skills measured as of" date (en-us article date: 2026-06-22).
# `code` is the stable key referenced by question files and course sections.
# English verbatim (domain 3 is "Manage virtual machines" in "Skills at a glance" and "Manage VMs" in the outline).
# French from the fr-fr page with straight apostrophes. That page is a rough machine translation: word order,
# missing articles and elisions were corrected ("Gérer Windows Server instances…", "Configurer Hyper-V carte
# réseau", "à l'aide d'Gestionnaire…", "Windows Pare-feu", "Read-Only (RODC)"…), terminology kept.
ad-ds:
- group:
    en: Deploy and manage AD DS domain controllers
    fr: Déployer et gérer des contrôleurs de domaine AD DS
  objectives:
  - code: '1.1.1'
    en: Deploy and manage domain controllers locally
    fr: Déployer et gérer des contrôleurs de domaine localement
  - code: '1.1.2'
    en: Deploy and manage domain controllers in Azure
    fr: Déployer et gérer des contrôleurs de domaine dans Azure
  - code: '1.1.3'
    en: Deploy Read-Only Domain Controllers (RODCs)
    fr: Déployer des contrôleurs de domaine en lecture seule (RODC)
  - code: '1.1.4'
    en: Manage account security on an RODC
    fr: Gérer la sécurité des comptes sur un RODC
  - code: '1.1.5'
    en: Manage and troubleshoot Flexible Single-Master Operations (FSMO) roles
    fr: Gérer et dépanner les rôles FSMO (Flexible Single-Master Operations)
- group:
    en: Configure and manage multi-site, multi-domain, and multi-forest environments
    fr: Configurer et gérer des environnements multisites, multidomaines et multiforêts
  objectives:
  - code: '1.2.1'
    en: Configure domain and forest trust relationships
    fr: Configurer les relations d'approbation entre domaines et forêts
  - code: '1.2.2'
    en: Configure and manage AD DS sites
    fr: Configurer et gérer des sites AD DS
  - code: '1.2.3'
    en: Configure and manage AD DS replication
    fr: Configurer et gérer la réplication AD DS
- group:
    en: Create and manage AD DS security principals
    fr: Créer et gérer des principaux de sécurité AD DS
  objectives:
  - code: '1.3.1'
    en: Create and manage AD DS users and groups
    fr: Créer et gérer des utilisateurs et des groupes AD DS
  - code: '1.3.2'
    en: Manage users and groups in multi-domain or multi-forest environments
    fr: Gérer les utilisateurs et les groupes dans des environnements multidomaines ou multiforêts
  - code: '1.3.3'
    en: Select and manage service accounts
    fr: Sélectionner et gérer des comptes de service
- group:
    en: Manage Windows Server by using domain-based Group Policies
    fr: Gérer Windows Server en utilisant des stratégies de groupe basées sur un domaine
  objectives:
  - code: '1.4.1'
    en: Implement Group Policy
    fr: Implémenter une stratégie de groupe
  - code: '1.4.2'
    en: Implement Group Policy preferences
    fr: Implémenter les préférences de stratégie de groupe
hybrid:
- group:
    en: Configure remote management for Windows Server instances in a hybrid environment
    fr: Configurer la gestion à distance des instances Windows Server dans un environnement hybride
  objectives:
  - code: '2.1.1'
    en: Deploy and manage Windows Admin Center on-premises and in the Azure portal
    fr: Déployer et gérer Windows Admin Center localement et dans le portail Azure
  - code: '2.1.2'
    en: Configure remote management by using PowerShell, including double-hop and Just Enough Administration (JEA)
    fr: Configurer la gestion à distance à l'aide de PowerShell, y compris le double saut et l'administration déléguée minimale (JEA)
  - code: '2.1.3'
    en: Configure and manage remote Secure Shell (SSH)
    fr: Configurer et gérer l'accès à distance Secure Shell (SSH)
  - code: '2.1.4'
    en: Configure and manage remote desktop access
    fr: Configurer et gérer l'accès Bureau à distance
- group:
    en: Manage Windows Server instances and workloads by using Azure services in a hybrid environment
    fr: Gérer les instances et les charges de travail Windows Server à l'aide de services Azure dans un environnement hybride
  objectives:
  - code: '2.2.1'
    en: Implement Azure Arc–enabled Windows Server instances
    fr: Implémenter des instances Windows Server activées pour Azure Arc
  - code: '2.2.2'
    en: Implement device configuration by using Azure Arc
    fr: Implémenter la configuration de l'appareil à l'aide d'Azure Arc
  - code: '2.2.3'
    en: Deploy Azure services with virtual machine (VM) extensions on non–Azure machines
    fr: Déployer des services Azure avec des extensions de machine virtuelle sur des machines non Azure
  - code: '2.2.4'
    en: Manage updates by using Azure Update Manager
    fr: Gérer les mises à jour à l'aide du Gestionnaire de mise à jour Azure
  - code: '2.2.5'
    en: Create and run Azure Automation runbooks
    fr: Créer et exécuter des runbooks Azure Automation
vms:
- group:
    en: Manage Hyper-V and guest VM
    fr: Gérer Hyper-V et les machines virtuelles invitées
  objectives:
  - code: '3.1.1'
    en: Enable Enhanced Session Mode
    fr: Activer le mode de session amélioré
  - code: '3.1.2'
    en: Manage VMs remotely by using PowerShell, PowerShell Direct, and SSH Direct for Linux guests
    fr: Gérer des machines virtuelles à distance à l'aide de PowerShell, PowerShell Direct et SSH Direct pour les invités Linux
  - code: '3.1.3'
    en: Enable nested virtualization
    fr: Activer la virtualisation imbriquée
  - code: '3.1.4'
    en: Configure VM memory settings
    fr: Configurer les paramètres de mémoire de machine virtuelle
  - code: '3.1.5'
    en: Configure integration services
    fr: Configurer les services d'intégration
  - code: '3.1.6'
    en: Configure device assignment
    fr: Configurer l'attribution d'appareil
  - code: '3.1.7'
    en: Configure GPU partitioning
    fr: Configurer le partitionnement GPU
  - code: '3.1.8'
    en: Manage VM checkpoints
    fr: Gérer les points de contrôle de machine virtuelle
  - code: '3.1.9'
    en: Implement high availability for Hyper-V VMs
    fr: Implémenter la haute disponibilité pour les machines virtuelles Hyper-V
  - code: '3.1.10'
    en: Manage Hyper-V virtual hard disks
    fr: Gérer les disques durs virtuels Hyper-V
  - code: '3.1.11'
    en: Configure Hyper-V network adapter
    fr: Configurer la carte réseau Hyper-V
  - code: '3.1.12'
    en: Configure network interface card (NIC) teaming on the Hyper-V host and VM
    fr: Configurer le teaming de cartes réseau (NIC) sur l'hôte Hyper-V et la machine virtuelle
  - code: '3.1.13'
    en: Configure Hyper-V Virtual Switch
    fr: Configurer le commutateur virtuel Hyper-V
  - code: '3.1.14'
    en: Configure Hyper-V Replica
    fr: Configurer le réplica Hyper-V
- group:
    en: Manage Windows Server VMs in Azure
    fr: Gérer les machines virtuelles Windows Server dans Azure
  objectives:
  - code: '3.2.1'
    en: Manage storage for Windows Server VMs in Azure
    fr: Gérer le stockage des machines virtuelles Windows Server dans Azure
  - code: '3.2.2'
    en: Manage capacity, including resizing and VM scale sets
    fr: Gérer la capacité, y compris le redimensionnement et les groupes de machines virtuelles identiques (VM Scale Sets)
  - code: '3.2.3'
    en: Manage availability sets and zones
    fr: Gérer les groupes à haute disponibilité et les zones
  - code: '3.2.4'
    en: Manage just-in-time (JIT) VM access and Azure Bastion
    fr: Gérer l'accès juste-à-temps (JIT) aux machines virtuelles et Azure Bastion
  - code: '3.2.5'
    en: Manage Azure Virtual Machines network configuration
    fr: Gérer la configuration réseau des machines virtuelles Azure
networking:
- group:
    en: Implement on-premises and hybrid name resolution
    fr: Implémenter la résolution de noms locale et hybride
  objectives:
  - code: '4.1.1'
    en: Integrate domain name system (DNS) with AD DS
    fr: Intégrer le système de noms de domaine (DNS) à AD DS
  - code: '4.1.2'
    en: Create and manage DNS zones and records
    fr: Créer et gérer des zones et des enregistrements DNS
  - code: '4.1.3'
    en: Configure DNS forwarding and conditional forwarding
    fr: Configurer le transfert DNS et le transfert conditionnel
  - code: '4.1.4'
    en: Configure DNS name resolution in a hybrid environment
    fr: Configurer la résolution de noms DNS dans un environnement hybride
  - code: '4.1.5'
    en: Implement DNS policies
    fr: Implémenter des stratégies DNS
  - code: '4.1.6'
    en: Implement DNS security extensions (DNSSEC)
    fr: Implémenter des extensions de sécurité DNS (DNSSEC)
- group:
    en: Manage IP addressing in on-premises and hybrid scenarios
    fr: Gérer l'adressage IP dans les scénarios locaux et hybrides
  objectives:
  - code: '4.2.1'
    en: Implement and configure the Dynamic Host Configuration Protocol (DHCP) server role
    fr: Implémenter et configurer le rôle serveur DHCP (Dynamic Host Configuration Protocol)
  - code: '4.2.2'
    en: Troubleshoot IP addressing in hybrid environments
    fr: Résoudre les problèmes d'adressage IP dans les environnements hybrides
  - code: '4.2.3'
    en: Create and manage DHCP scopes
    fr: Créer et gérer des étendues DHCP
  - code: '4.2.4'
    en: Create IP reservations
    fr: Créer des réservations IP
  - code: '4.2.5'
    en: Implement high availability for DHCP
    fr: Implémenter la haute disponibilité pour DHCP
storage:
