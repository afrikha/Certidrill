    fr: Configurer et gérer la protection contre les attaques (exploit protection)
  - code: '6.1.2'
    en: Configure and manage Application Control for Windows
    fr: Configurer et gérer le contrôle d'application pour Windows
  - code: '6.1.3'
    en: Configure and manage Credential Guard
    fr: Configurer et gérer Credential Guard
  - code: '6.1.4'
    en: Configure Microsoft Defender SmartScreen
