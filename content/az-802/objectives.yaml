    en: Manage permissions for Azure file shares
    fr: Gérer les autorisations pour les partages de fichiers Azure
  - code: '5.1.3'
    en: Configure and manage Azure File Sync
    fr: Configurer et gérer Azure File Sync
  - code: '5.1.4'
    en: Monitor Azure File Sync
