  - code: '5.3.10'
    en: Manage BitLocker Drive Encryption
    fr: Gérer le chiffrement de lecteur BitLocker
  - code: '5.3.11'
    en: Manage and recover encrypted volumes
    fr: Gérer et récupérer des volumes chiffrés
