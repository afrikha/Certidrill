  - code: '5.2.2'
    en: Configure File Server Resource Manager (FSRM)
    fr: Configurer le Gestionnaire de ressources du serveur de fichiers (FSRM)
  - code: '5.2.3'
    en: Implement and configure DFS
    fr: Implémenter et configurer DFS
  - code: '5.2.4'
    en: Configure Server Message Block (SMB) over QUIC
    fr: Configurer SMB (Server Message Block) sur QUIC
  - code: '5.2.5'
    en: Configure SMB settings and management
    fr: Configurer les paramètres et la gestion SMB
- group:
    en: Configure Windows Server storage
    fr: Configurer le stockage Windows Server
  objectives:
  - code: '5.3.1'
    en: Configure disks and volumes
