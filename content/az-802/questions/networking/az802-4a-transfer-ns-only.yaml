id: az802-4a-transfer-ns-only
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A DNS server named DNS1 hosts a file-backed primary zone named east.contoso.com. The zone allows zone transfers to any server. Two DNS servers named DNS2 and DNS3 host secondary copies of the zone and are listed in the NS records of the zone.

    A security review requires that only the servers listed in the NS records of the zone can obtain a copy of the zone. Name servers will be added to the zone in the future, and you want to avoid maintaining a separate list of IP addresses.

    Which command should you run on DNS1?
  fr: |
    Un serveur DNS nommé DNS1 héberge une zone principale stockée dans un fichier, nommée east.contoso.com. La zone autorise les transferts de zone vers n'importe quel serveur. Deux serveurs DNS nommés DNS2 et DNS3 hébergent des copies secondaires de la zone et figurent dans les enregistrements NS de la zone.

    Un audit de sécurité exige que seuls les serveurs figurant dans les enregistrements NS de la zone puissent obtenir une copie de la zone. Des serveurs de noms seront ajoutés à la zone à l'avenir, et vous voulez éviter de tenir à jour une liste distincte d'adresses IP.

    Quelle commande devez-vous exécuter sur DNS1 ?
body:
  options:
    - { id: a, text: "Set-DnsServerPrimaryZone -Name east.contoso.com -Notify NotifyServers" }
    - { id: b, text: "Set-DnsServerPrimaryZone -Name east.contoso.com -SecureSecondaries TransferToSecureServers" }
    - { id: c, text: "Set-DnsServerPrimaryZone -Name east.contoso.com -SecureSecondaries TransferToZoneNameServer" }
    - { id: d, text: "Set-DnsServerPrimaryZone -Name east.contoso.com -SecureSecondaries NoTransfer" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      TransferToZoneNameServer allows zone transfers only to the servers listed in the NS records of the zone. A name server added to the zone later is allowed automatically, with no separate list to maintain.
    fr: |
      TransferToZoneNameServer n'autorise les transferts de zone que vers les serveurs figurant dans les enregistrements NS de la zone. Un serveur de noms ajouté plus tard à la zone est autorisé automatiquement, sans liste distincte à tenir à jour.
  options:
    a: { en: "-Notify controls which servers are notified of changes; it doesn't restrict which servers can request a transfer.", fr: "-Notify contrôle les serveurs avertis des modifications ; il ne limite pas les serveurs qui peuvent demander un transfert." }
    b: { en: "TransferToSecureServers allows transfers to an explicit list of servers (-SecondaryServers), which is the separate list you want to avoid.", fr: "TransferToSecureServers autorise les transferts vers une liste explicite de serveurs (-SecondaryServers), c'est-à-dire la liste distincte que vous voulez éviter." }
    d: { en: "NoTransfer blocks all transfers, so DNS2 and DNS3 could no longer update their secondary zones.", fr: "NoTransfer bloque tous les transferts : DNS2 et DNS3 ne pourraient plus mettre à jour leurs zones secondaires." }
references:
  - title: Manage DNS zones using DNS server in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/manage-dns-zones
  - title: DNS zones in DNS Server on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/zone-types
