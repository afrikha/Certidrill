id: az802-4b-reservation-statements
objective: "4.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A DHCP server named **DHCP1** hosts the scope 10.10.5.0/24. You run the following command on DHCP1:

    `Add-DhcpServerv4Reservation -ScopeId 10.10.5.0 -IPAddress 10.10.5.30 -ClientId "F0-DE-F1-7A-00-5E" -Description "Badge reader"`

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur DHCP nommé **DHCP1** héberge l'étendue 10.10.5.0/24. Vous exécutez la commande suivante sur DHCP1 :

    `Add-DhcpServerv4Reservation -ScopeId 10.10.5.0 -IPAddress 10.10.5.30 -ClientId "F0-DE-F1-7A-00-5E" -Description "Badge reader"`

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The reservation answers both DHCP and BOOTP requests from the badge reader.
        fr: |
          La réservation répond aux demandes DHCP et BOOTP du lecteur de badges.
    - id: s2
      text:
        en: |
          You can give the badge reader a DNS server that differs from the one of the scope without changing the configuration of the other clients.
        fr: |
          Vous pouvez donner au lecteur de badges un serveur DNS différent de celui de l'étendue sans changer la configuration des autres clients.
    - id: s3
      text:
        en: |
          If DHCP1 is offline when the lease of the badge reader expires, the badge reader keeps using 10.10.5.30.
        fr: |
          Si DHCP1 est hors ligne à l'expiration du bail du lecteur de badges, le lecteur de badges continue d'utiliser 10.10.5.30.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      The -Type parameter of Add-DhcpServerv4Reservation defaults to Both, so the reservation serves DHCP and BOOTP requests. `Set-DhcpServerv4OptionValue -ReservedIP 10.10.5.30` sets options for that reservation only. A device with a reservation is still a DHCP client: it depends on the DHCP server, and it loses its address when its lease expires while no server answers.
    fr: |
      Le paramètre -Type d'Add-DhcpServerv4Reservation vaut Both par défaut : la réservation sert les demandes DHCP et BOOTP. `Set-DhcpServerv4OptionValue -ReservedIP 10.10.5.30` définit des options pour cette seule réservation. Un appareil avec une réservation reste un client DHCP : il dépend du serveur DHCP et perd son adresse quand son bail expire sans qu'aucun serveur ne réponde.
references:
  - title: Add-DhcpServerv4Reservation (DhcpServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/add-dhcpserverv4reservation
  - title: DHCP scopes in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-scopes
