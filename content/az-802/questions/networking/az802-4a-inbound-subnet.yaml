id: az802-4a-inbound-subnet
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual network named VNet-Hub that contains the following subnets:

    | Name | Prefix | Configuration |
    | --- | --- | --- |
    | snet-app | 10.10.1.0/24 | Contains virtual machines |
    | GatewaySubnet | 10.10.255.0/27 | Contains a VPN gateway |
    | snet-dns-out | 10.10.2.0/28 | Delegated to Microsoft.Network/dnsResolvers; used by the outbound endpoint of an Azure DNS Private Resolver named dnspr-hub |

    On-premises DNS servers must resolve the private DNS zones linked to VNet-Hub. You need to add an inbound endpoint to dnspr-hub.

    Which subnet should the inbound endpoint use?
  fr: |
    Vous disposez d'un réseau virtuel Azure nommé VNet-Hub qui contient les sous-réseaux suivants :

    | Nom | Préfixe | Configuration |
    | --- | --- | --- |
    | snet-app | 10.10.1.0/24 | Contient des machines virtuelles |
    | GatewaySubnet | 10.10.255.0/27 | Contient une passerelle VPN |
    | snet-dns-out | 10.10.2.0/28 | Délégué à Microsoft.Network/dnsResolvers ; utilisé par le point de terminaison sortant d'un Azure DNS Private Resolver nommé dnspr-hub |

    Les serveurs DNS locaux doivent résoudre les zones DNS privées liées à VNet-Hub. Vous devez ajouter un point de terminaison entrant à dnspr-hub.

    Quel sous-réseau le point de terminaison entrant doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "snet-app, after you delegate it to Microsoft.Network/dnsResolvers", fr: "snet-app, après l'avoir délégué à Microsoft.Network/dnsResolvers" } }
    - { id: b, text: { en: "snet-dns-out, which is already delegated to Microsoft.Network/dnsResolvers", fr: "snet-dns-out, qui est déjà délégué à Microsoft.Network/dnsResolvers" } }
    - { id: c, text: { en: "A new subnet 10.10.3.0/28 delegated to Microsoft.Network/dnsResolvers", fr: "Un nouveau sous-réseau 10.10.3.0/28 délégué à Microsoft.Network/dnsResolvers" } }
    - { id: d, text: { en: "GatewaySubnet, after you delegate it to Microsoft.Network/dnsResolvers", fr: "GatewaySubnet, après l'avoir délégué à Microsoft.Network/dnsResolvers" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Each endpoint of a DNS Private Resolver needs its own subnet, between /28 and /24, delegated to Microsoft.Network/dnsResolvers and used by no other service. The inbound endpoint gets an IP address from that subnet, which the on-premises DNS servers then use as the target of a conditional forwarder.
    fr: |
      Chaque point de terminaison d'un DNS Private Resolver a besoin de son propre sous-réseau, de /28 à /24, délégué à Microsoft.Network/dnsResolvers et utilisé par aucun autre service. Le point de terminaison entrant reçoit une adresse IP de ce sous-réseau, que les serveurs DNS locaux utilisent ensuite comme cible d'un redirecteur conditionnel.
  options:
    a: { en: "An endpoint subnet must be dedicated to the resolver; snet-app already contains virtual machines.", fr: "Le sous-réseau d'un point de terminaison doit être dédié au résolveur ; snet-app contient déjà des machines virtuelles." }
    b: { en: "Endpoints can't share a subnet: snet-dns-out is already used by the outbound endpoint.", fr: "Des points de terminaison ne peuvent pas partager un sous-réseau : snet-dns-out est déjà utilisé par le point de terminaison sortant." }
    d: { en: "GatewaySubnet already hosts the VPN gateway, and an endpoint subnet can't be used by other services.", fr: "GatewaySubnet héberge déjà la passerelle VPN, et le sous-réseau d'un point de terminaison ne peut pas être utilisé par d'autres services." }
references:
  - title: Azure DNS Private Resolver Overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
