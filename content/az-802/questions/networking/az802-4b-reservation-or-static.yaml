id: az802-4b-reservation-or-static
objective: "4.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are planning the IP configuration of the devices on a subnet served by a DHCP server named **DHCP1**.

    Which addressing method should you use for each device? To answer, drag the appropriate methods to the correct devices. Each method may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez la configuration IP des appareils d'un sous-réseau desservi par un serveur DHCP nommé **DHCP1**.

    Quelle méthode d'adressage devez-vous utiliser pour chaque appareil ? Pour répondre, faites glisser les méthodes appropriées vers les appareils correspondants. Chaque méthode peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: resv, text: { en: "DHCP reservation", fr: "Réservation DHCP" } }
    - { id: static, text: { en: "Static address inside an exclusion range", fr: "Adresse statique dans une plage d'exclusion" } }
    - { id: dyn, text: { en: "Dynamic lease from the scope", fr: "Bail dynamique de l'étendue" } }
    - { id: mcast, text: { en: "Address from a multicast scope", fr: "Adresse d'une étendue multidiffusion" } }
  targets:
    - id: dhcp
      text: { en: "DHCP1 itself", fr: "DHCP1 lui-même" }
    - id: printers
      text: { en: "Network printers that need a fixed address that you can change centrally, without signing in to them", fr: "Imprimantes réseau qui ont besoin d'une adresse fixe que vous pouvez changer de façon centralisée, sans vous y connecter" }
    - id: router
      text: { en: "The router interface used as default gateway, which must keep working when DHCP1 is unavailable", fr: "L'interface du routeur utilisée comme passerelle par défaut, qui doit continuer de fonctionner quand DHCP1 est indisponible" }
    - id: laptops
      text: { en: "Employee laptops", fr: "Ordinateurs portables des employés" }
answer:
  mapping: { dhcp: static, printers: resv, router: static, laptops: dyn }
explanation:
  correct:
    en: |
      A DHCP server needs a static IPv4 address, and so does a device that must work when the DHCP server is down; exclude their addresses from the scope to avoid conflicts. A reservation always gives the same address to a device identified by its MAC address and lets you change that address from DHCP, but the device depends on the DHCP server. Ordinary clients such as laptops use dynamic leases. Multicast scopes distribute multicast addresses, not host addresses.
    fr: |
      Un serveur DHCP a besoin d'une adresse IPv4 statique, tout comme un appareil qui doit fonctionner quand le serveur DHCP est en panne ; excluez leurs adresses de l'étendue pour éviter les conflits. Une réservation donne toujours la même adresse à un appareil identifié par son adresse MAC et permet de changer cette adresse depuis DHCP, mais l'appareil dépend du serveur DHCP. Les clients ordinaires comme les ordinateurs portables utilisent des baux dynamiques. Les étendues multidiffusion distribuent des adresses de multidiffusion, pas des adresses d'hôtes.
references:
  - title: DHCP scopes in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-scopes
  - title: Install and configure DHCP Server on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/quickstart-install-configure-dhcp-server
