id: az802-4b-scope-exclusion
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A DHCP server named **DHCP1** has a scope for the subnet 10.10.20.0/24 with the range 10.10.20.1 to 10.10.20.254. The servers and network devices of the subnet use static IP addresses from 10.10.20.1 to 10.10.20.20.

    You need to ensure that DHCP1 never leases these addresses, even when one of the devices is turned off. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Un serveur DHCP nommé **DHCP1** dispose d'une étendue pour le sous-réseau 10.10.20.0/24 avec la plage 10.10.20.1 à 10.10.20.254. Les serveurs et les équipements réseau du sous-réseau utilisent des adresses IP statiques de 10.10.20.1 à 10.10.20.20.

    Vous devez vous assurer que DHCP1 n'attribue jamais ces adresses, même quand l'un des appareils est éteint. La solution doit réduire au minimum les tâches d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: excl, text: { en: "Add an exclusion range from 10.10.20.1 to 10.10.20.20 to the scope.", fr: "Ajouter à l'étendue une plage d'exclusion de 10.10.20.1 à 10.10.20.20." } }
    - { id: resv, text: { en: "Create a reservation in the scope for each server and network device.", fr: "Créer dans l'étendue une réservation pour chaque serveur et chaque équipement réseau." } }
    - { id: conflict, text: { en: "Set the number of conflict detection attempts of DHCP1 to 2.", fr: "Définir à 2 le nombre de tentatives de détection de conflits de DHCP1." } }
    - { id: deny, text: { en: "Add the MAC addresses of the devices to the deny filter list of DHCP1.", fr: "Ajouter les adresses MAC des appareils à la liste de refus des filtres de DHCP1." } }
answer: { optionId: excl }
explanation:
  correct:
    en: |
      An exclusion range is a contiguous range of addresses inside the scope that the DHCP server never leases. It is the recommended way to protect the addresses of statically configured devices, and one range covers all twenty addresses.
    fr: |
      Une plage d'exclusion est une plage contiguë d'adresses de l'étendue que le serveur DHCP n'attribue jamais. C'est la méthode recommandée pour protéger les adresses des appareils configurés en statique, et une seule plage couvre les vingt adresses.
  options:
    resv: { en: "Reservations require the MAC address of every device and twenty objects to maintain; the devices also keep static addresses, so the reservations add work without benefit.", fr: "Les réservations exigent l'adresse MAC de chaque appareil et vingt objets à maintenir ; les appareils gardent en outre des adresses statiques : les réservations ajoutent du travail sans bénéfice." }
    conflict: { en: "Conflict detection pings an address before leasing it; a device that is turned off doesn't answer, so its address can still be leased.", fr: "La détection de conflits envoie un ping à une adresse avant de l'attribuer ; un appareil éteint ne répond pas, et son adresse peut donc être attribuée." }
    deny: { en: "The deny list stops those devices from obtaining leases; it doesn't stop DHCP1 from leasing their addresses to other clients.", fr: "La liste de refus empêche ces appareils d'obtenir des baux ; elle n'empêche pas DHCP1 d'attribuer leurs adresses à d'autres clients." }
references:
  - title: DHCP scopes in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-scopes
