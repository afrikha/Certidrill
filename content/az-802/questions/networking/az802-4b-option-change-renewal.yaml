id: az802-4b-option-change-renewal
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A DHCP server named **DHCP1** hosts the scope 10.50.3.0/24 with a lease duration of 8 days. Yesterday, you changed the DNS servers option (006) of the scope to the address of a new DNS server. Today, you shut down the old DNS server.

    Some users of the subnet report that name resolution fails. On their computers, `ipconfig /all` still shows the old DNS server. The other users of the subnet resolve names normally.

    You need to restore name resolution for the affected users as quickly as possible.

    What should you do?
  fr: |
    Un serveur DHCP nommé **DHCP1** héberge l'étendue 10.50.3.0/24 avec une durée de bail de 8 jours. Hier, vous avez remplacé dans l'option Serveurs DNS (006) de l'étendue l'adresse de l'ancien serveur DNS par celle d'un nouveau. Aujourd'hui, vous avez arrêté l'ancien serveur DNS.

    Certains utilisateurs du sous-réseau signalent que la résolution de noms échoue. Sur leurs ordinateurs, `ipconfig /all` affiche toujours l'ancien serveur DNS. Les autres utilisateurs du sous-réseau résolvent les noms normalement.

    Vous devez rétablir la résolution de noms des utilisateurs concernés le plus rapidement possible.

    Que devez-vous faire ?
body:
  options:
    - { id: renew, text: { en: "Run ipconfig /renew on the affected computers.", fr: "Exécuter ipconfig /renew sur les ordinateurs concernés." } }
    - { id: flush, text: { en: "Run ipconfig /flushdns on the affected computers.", fr: "Exécuter ipconfig /flushdns sur les ordinateurs concernés." } }
    - { id: lease, text: { en: "Reduce the lease duration of the scope to 1 day.", fr: "Réduire la durée de bail de l'étendue à 1 jour." } }
    - { id: restart, text: { en: "Restart the DHCP Server service on DHCP1.", fr: "Redémarrer le service Serveur DHCP sur DHCP1." } }
answer: { optionId: renew }
explanation:
  correct:
    en: |
      A client receives changed options only when it renews its lease, which it does automatically at 50 percent of the lease duration (4 days here). The computers that haven't renewed since yesterday still use the old option value. Running ipconfig /renew makes them request their lease again and receive the new DNS server immediately.
    fr: |
      Un client ne reçoit les options modifiées que lorsqu'il renouvelle son bail, ce qu'il fait automatiquement à 50 % de la durée du bail (4 jours ici). Les ordinateurs qui n'ont pas renouvelé depuis hier utilisent toujours l'ancienne valeur de l'option. Exécuter ipconfig /renew leur fait redemander leur bail et recevoir immédiatement le nouveau serveur DNS.
  options:
    flush: { en: "Flushing the resolver cache doesn't change the DNS server list that the client received from DHCP.", fr: "Vider le cache du résolveur ne change pas la liste des serveurs DNS que le client a reçue de DHCP." }
    lease: { en: "A new lease duration reaches the clients only at their next renewal, so it doesn't help now.", fr: "Une nouvelle durée de bail n'atteint les clients qu'à leur prochain renouvellement : elle n'aide pas maintenant." }
    restart: { en: "Restarting the service doesn't push options to clients; DHCP clients pull their configuration.", fr: "Redémarrer le service n'envoie pas d'options aux clients ; ce sont les clients DHCP qui demandent leur configuration." }
references:
  - title: Set-DhcpServerv4OptionValue (DhcpServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/set-dhcpserverv4optionvalue
  - title: Troubleshooting guide for Dynamic Host Configuration Protocol (DHCP)
    url: https://learn.microsoft.com/en-us/windows-server/troubleshoot/troubleshoot-dhcp-issue
