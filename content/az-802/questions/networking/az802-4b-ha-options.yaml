id: az802-4b-ha-options
objective: "4.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A DHCP server named **DHCP1** runs Windows Server 2025 and hosts the IPv4 scope 10.30.0.0/23. You deploy a second server named **DHCP2** that runs Windows Server 2025. Both servers are on the same subnet as the clients.

    You need to ensure that, if DHCP1 fails, the clients keep their current IP addresses when they renew their leases. The solution must not require any manual action when DHCP1 fails.

    Which two solutions meet the goal? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur DHCP nommé **DHCP1** exécute Windows Server 2025 et héberge l'étendue IPv4 10.30.0.0/23. Vous déployez un second serveur nommé **DHCP2** qui exécute Windows Server 2025. Les deux serveurs se trouvent sur le même sous-réseau que les clients.

    Vous devez vous assurer que, si DHCP1 tombe en panne, les clients conservent leur adresse IP actuelle quand ils renouvellent leur bail. La solution ne doit nécessiter aucune action manuelle en cas de panne de DHCP1.

    Quelles sont les deux solutions qui permettent d'atteindre l'objectif ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: hs, text: { en: "Configure a failover relationship in hot standby mode between DHCP1 and DHCP2 for the scope.", fr: "Configurer une relation de basculement en mode de secours à chaud entre DHCP1 et DHCP2 pour l'étendue." } }
    - { id: cluster, text: { en: "Create a failover cluster of DHCP1 and DHCP2 with shared storage, and run the DHCP Server role as a clustered role that hosts the scope.", fr: "Créer un cluster de basculement de DHCP1 et DHCP2 avec un stockage partagé, et exécuter le rôle DHCP Server comme rôle en cluster qui héberge l'étendue." } }
    - { id: split, text: { en: "Split the scope between DHCP1 and DHCP2 so that each server leases half of the range.", fr: "Fractionner l'étendue entre DHCP1 et DHCP2 pour que chaque serveur attribue la moitié de la plage." } }
    - { id: backup, text: { en: "Run Backup-DhcpServer on DHCP1 every hour and store the backup on DHCP2.", fr: "Exécuter Backup-DhcpServer sur DHCP1 toutes les heures et stocker la sauvegarde sur DHCP2." } }
    - { id: super, text: { en: "Create a superscope on DHCP2 that contains a copy of the scope.", fr: "Créer sur DHCP2 une superétendue qui contient une copie de l'étendue." } }
answer: { optionIds: [hs, cluster] }
explanation:
  correct:
    en: |
      DHCP failover replicates the scope and its active leases to the partner, so the standby server renews the same addresses when the active server is unavailable. Clustered DHCP keeps the DHCP database on shared storage and moves the role to the other node automatically; Windows Server also supports it together with failover, where the cluster counts as one DHCP server. Both solutions keep the clients' addresses without manual action.
    fr: |
      Le basculement DHCP réplique l'étendue et ses baux actifs vers le partenaire : le serveur de secours renouvelle les mêmes adresses quand le serveur actif est indisponible. Le DHCP en cluster conserve la base DHCP sur un stockage partagé et déplace automatiquement le rôle vers l'autre nœud ; Windows Server le prend aussi en charge avec le basculement, où le cluster compte comme un seul serveur DHCP. Les deux solutions conservent les adresses des clients sans action manuelle.
  options:
    split: { en: "With a split scope, DHCP2 doesn't know the leases of DHCP1 and holds another part of the range, so the clients of DHCP1 receive new addresses.", fr: "Avec une étendue fractionnée, DHCP2 ne connaît pas les baux de DHCP1 et détient une autre partie de la plage : les clients de DHCP1 reçoivent de nouvelles adresses." }
    backup: { en: "A backup must be restored manually on DHCP2, which breaks the no-manual-action requirement.", fr: "Une sauvegarde doit être restaurée manuellement sur DHCP2, ce qui enfreint l'exigence d'absence d'action manuelle." }
    super: { en: "A superscope groups scopes of one server; a copy of the scope on DHCP2 has none of the leases of DHCP1.", fr: "Une superétendue regroupe des étendues d'un serveur ; une copie de l'étendue sur DHCP2 ne contient aucun bail de DHCP1." }
references:
  - title: DHCP failover in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-failover
