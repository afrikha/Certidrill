id: az802-4a-cf-forest-scope
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an AD DS forest named contoso.com that has three domains. Every domain controller runs the DNS Server role. A domain controller named DC1 is in the forest root domain.

    After a merger, the DNS servers in every domain of contoso.com must resolve names in the fabrikam.com forest by sending the queries to the Fabrikam DNS servers 192.168.20.10 and 192.168.20.11. The solution must minimize administrative effort, including when domain controllers are added.

    Which command should you run on DC1?
  fr: |
    Votre réseau contient une forêt AD DS nommée contoso.com qui compte trois domaines. Chaque contrôleur de domaine exécute le rôle Serveur DNS. Un contrôleur de domaine nommé DC1 se trouve dans le domaine racine de la forêt.

    Après une fusion, les serveurs DNS de chaque domaine de contoso.com doivent résoudre les noms de la forêt fabrikam.com en envoyant les requêtes aux serveurs DNS de Fabrikam 192.168.20.10 et 192.168.20.11. La solution doit réduire au minimum l'effort d'administration, y compris lors de l'ajout de contrôleurs de domaine.

    Quelle commande devez-vous exécuter sur DC1 ?
body:
  options:
    - { id: a, text: "Add-DnsServerConditionalForwarderZone -Name fabrikam.com -MasterServers 192.168.20.10, 192.168.20.11 -ReplicationScope Domain" }
    - { id: b, text: "Add-DnsServerConditionalForwarderZone -Name fabrikam.com -MasterServers 192.168.20.10, 192.168.20.11" }
    - { id: c, text: "Set-DnsServerForwarder -IPAddress 192.168.20.10, 192.168.20.11" }
    - { id: d, text: "Add-DnsServerConditionalForwarderZone -Name fabrikam.com -MasterServers 192.168.20.10, 192.168.20.11 -ReplicationScope Forest" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A conditional forwarder sends only the fabrikam.com queries to the Fabrikam servers. Stored in AD DS with the Forest scope, it replicates to the DNS servers on all domain controllers of the forest, including domain controllers promoted later, so you create it only once.
    fr: |
      Un redirecteur conditionnel n'envoie que les requêtes pour fabrikam.com aux serveurs de Fabrikam. Stocké dans AD DS avec l'étendue Forest, il est répliqué vers les serveurs DNS de tous les contrôleurs de domaine de la forêt, y compris ceux promus plus tard : vous ne le créez qu'une fois.
  options:
    a: { en: "The Domain scope replicates the forwarder only to the DNS servers on domain controllers of DC1's domain, not to the other two domains.", fr: "L'étendue Domain ne réplique le redirecteur que vers les serveurs DNS des contrôleurs de domaine du domaine de DC1, pas vers les deux autres domaines." }
    b: { en: "Without -ReplicationScope, the conditional forwarder is stored only on DC1; you would have to create it on every DNS server.", fr: "Sans -ReplicationScope, le redirecteur conditionnel n'est stocké que sur DC1 : il faudrait le créer sur chaque serveur DNS." }
    c: { en: "Server-level forwarders would send all unresolved queries, including internet names, to Fabrikam, and only from DC1.", fr: "Des redirecteurs de niveau serveur enverraient toutes les requêtes non résolues, y compris les noms internet, à Fabrikam, et seulement depuis DC1." }
references:
  - title: Add-DnsServerConditionalForwarderZone (DnsServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsserver/add-dnsserverconditionalforwarderzone
