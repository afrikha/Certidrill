id: az802-4a-forwarding-choices
objective: "4.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You manage a DNS server named DNS1 that runs Windows Server. DNS1 must meet four name resolution requirements.

    Which configuration should you use for each requirement? To answer, drag the appropriate configurations to the correct requirements. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez un serveur DNS nommé DNS1 qui exécute Windows Server. DNS1 doit satisfaire quatre exigences de résolution de noms.

    Quelle configuration devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les configurations appropriées vers les exigences correspondantes. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: fwd, text: { en: "Server-level forwarders", fr: "Redirecteurs de niveau serveur" } }
    - { id: cf, text: { en: "Conditional forwarder", fr: "Redirecteur conditionnel" } }
    - { id: stub, text: { en: "Stub zone", fr: "Zone de stub" } }
    - { id: sec, text: { en: "Secondary zone", fr: "Zone secondaire" } }
    - { id: root, text: { en: "Root hints", fr: "Indications de racine" } }
  targets:
    - id: t1
      text: { en: "Send every query for internet names that DNS1 can't answer to the two resolvers of the ISP", fr: "Envoyer aux deux résolveurs du FAI toutes les requêtes de noms internet auxquelles DNS1 ne peut pas répondre" }
    - id: t2
      text: { en: "Send queries for fabrikam.com only to the two IP addresses provided by Fabrikam", fr: "Envoyer les requêtes pour fabrikam.com uniquement aux deux adresses IP fournies par Fabrikam" }
    - id: t3
      text: { en: "Keep a full read-only copy of the litware.com zone obtained by zone transfer", fr: "Conserver une copie complète en lecture seule de la zone litware.com obtenue par transfert de zone" }
    - id: t4
      text: { en: "Resolve internet names by iterative queries that start at the DNS root servers when no forwarder is configured", fr: "Résoudre les noms internet par des requêtes itératives qui commencent aux serveurs racine du DNS lorsqu'aucun redirecteur n'est configuré" }
answer:
  mapping: { t1: fwd, t2: cf, t3: sec, t4: root }
explanation:
  correct:
    en: |
      Server-level forwarders receive the queries that DNS1 can't resolve locally, typically for internet names. A conditional forwarder sends the queries for one DNS domain to specific servers. A secondary zone is a read-only copy of a zone obtained by zone transfer. Root hints let a server without forwarders locate the root servers and resolve names iteratively. A stub zone holds only the name server records of a zone, so it fits none of the requirements.
    fr: |
      Les redirecteurs de niveau serveur reçoivent les requêtes que DNS1 ne peut pas résoudre localement, en général pour des noms internet. Un redirecteur conditionnel envoie les requêtes d'un domaine DNS à des serveurs précis. Une zone secondaire est une copie en lecture seule d'une zone, obtenue par transfert de zone. Les indications de racine permettent à un serveur sans redirecteur de localiser les serveurs racine et de résoudre les noms de façon itérative. Une zone de stub ne contient que les enregistrements de serveurs de noms d'une zone : elle ne correspond à aucune exigence.
references:
  - title: DNS Forwarding in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/forwarding
  - title: DNS zones in DNS Server on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/zone-types
