id: az802-4a-ruleset-spoke
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have the following Azure resources in the West Europe region:

    - A virtual network named VNet-Hub that is connected to the on-premises network by a VPN gateway.
    - An Azure DNS Private Resolver named dnspr-hub that references VNet-Hub and has an outbound endpoint.
    - A DNS forwarding ruleset named rs-onprem that uses the outbound endpoint of dnspr-hub. It contains a rule for corp.contoso.com. that targets the on-premises DNS servers, and it is linked to VNet-Hub.
    - A virtual network named VNet-Spoke1 that is peered with VNet-Hub. The virtual machines in VNet-Spoke1 use the Azure-provided DNS.

    The virtual machines in VNet-Hub resolve the names in corp.contoso.com, but the virtual machines in VNet-Spoke1 can't. You need to ensure that the virtual machines in VNet-Spoke1 resolve the names in corp.contoso.com while keeping the Azure-provided DNS.

    What should you do?
  fr: |
    Vous disposez des ressources Azure suivantes dans la région West Europe :

    - Un réseau virtuel nommé VNet-Hub connecté au réseau local par une passerelle VPN.
    - Un Azure DNS Private Resolver nommé dnspr-hub qui référence VNet-Hub et dispose d'un point de terminaison sortant.
    - Un ensemble de règles de transfert DNS nommé rs-onprem qui utilise le point de terminaison sortant de dnspr-hub. Il contient une règle pour corp.contoso.com. qui cible les serveurs DNS locaux, et il est lié à VNet-Hub.
    - Un réseau virtuel nommé VNet-Spoke1 relié à VNet-Hub par peering. Les machines virtuelles de VNet-Spoke1 utilisent le DNS fourni par Azure.

    Les machines virtuelles de VNet-Hub résolvent les noms de corp.contoso.com, mais pas celles de VNet-Spoke1. Vous devez faire en sorte que les machines virtuelles de VNet-Spoke1 résolvent les noms de corp.contoso.com tout en conservant le DNS fourni par Azure.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a second outbound endpoint for dnspr-hub in a subnet of VNet-Spoke1.", fr: "Créer un second point de terminaison sortant pour dnspr-hub dans un sous-réseau de VNet-Spoke1." } }
    - { id: b, text: { en: "Enable the use of the remote gateway on the peering from VNet-Spoke1 to VNet-Hub.", fr: "Activer l'utilisation de la passerelle distante sur le peering de VNet-Spoke1 vers VNet-Hub." } }
    - { id: c, text: { en: "Create a private DNS zone named corp.contoso.com and link it to VNet-Spoke1.", fr: "Créer une zone DNS privée nommée corp.contoso.com et la lier à VNet-Spoke1." } }
    - { id: d, text: { en: "Create a virtual network link between rs-onprem and VNet-Spoke1.", fr: "Créer un lien de réseau virtuel entre rs-onprem et VNet-Spoke1." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The rules of a forwarding ruleset apply only to the virtual networks linked to the ruleset. Linking rs-onprem to VNet-Spoke1 makes the Azure-provided DNS of VNet-Spoke1 evaluate the corp.contoso.com rule and forward the queries through the outbound endpoint of dnspr-hub. A ruleset accepts up to 500 virtual network links.
    fr: |
      Les règles d'un ensemble de règles de transfert ne s'appliquent qu'aux réseaux virtuels liés à cet ensemble. Lier rs-onprem à VNet-Spoke1 fait évaluer la règle corp.contoso.com par le DNS fourni par Azure de VNet-Spoke1, qui transfère les requêtes par le point de terminaison sortant de dnspr-hub. Un ensemble de règles accepte jusqu'à 500 liens de réseau virtuel.
  options:
    a: { en: "A DNS private resolver references only one virtual network, and its endpoints are created in that network.", fr: "Un résolveur privé DNS ne référence qu'un seul réseau virtuel, et ses points de terminaison se créent dans ce réseau." }
    b: { en: "Gateway transit changes routing to on-premises networks; it doesn't make the Azure-provided DNS of VNet-Spoke1 use the forwarding rules.", fr: "Le transit par passerelle modifie le routage vers les réseaux locaux ; il ne fait pas utiliser les règles de transfert par le DNS fourni par Azure de VNet-Spoke1." }
    c: { en: "A linked private zone is checked before the forwarding rules; an empty corp.contoso.com zone would answer instead of the on-premises servers.", fr: "Une zone privée liée est consultée avant les règles de transfert ; une zone corp.contoso.com vide répondrait à la place des serveurs locaux." }
references:
  - title: Azure DNS Private Resolver Overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
