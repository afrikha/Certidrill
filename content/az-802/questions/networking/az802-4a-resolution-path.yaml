id: az802-4a-resolution-path
objective: "4.1.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    A DNS server named DNS1 is configured as shown in the following table. Recursion is enabled on DNS1, and its cache is empty.

    Answer each prompt by selecting the configuration item that DNS1 uses to resolve the query.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur DNS nommé DNS1 est configuré comme indiqué dans le tableau suivant. La récursivité est activée sur DNS1, et son cache est vide.

    Répondez à chaque consigne en sélectionnant l'élément de configuration que DNS1 utilise pour résoudre la requête.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "A client queries DNS1 for app.fabrikam.com", fr: "Un client interroge DNS1 pour app.fabrikam.com" }
    - id: p2
      text: { en: "A client queries DNS1 for host1.branch.contoso.com", fr: "Un client interroge DNS1 pour host1.branch.contoso.com" }
  grid:
    header: [{ en: "Configuration item", fr: "Élément de configuration" }, { en: "Setting", fr: "Paramètre" }]
    rows:
      - [{ text: { en: "Primary zone", fr: "Zone principale" }, area: zone }, { text: "contoso.com" }]
      - [{ text: { en: "Delegation in contoso.com", fr: "Délégation dans contoso.com" }, area: deleg }, { text: "branch → ns1.branch.contoso.com (10.5.0.5)" }]
      - [{ text: { en: "Conditional forwarder", fr: "Redirecteur conditionnel" }, area: cf }, { text: "fabrikam.com → 192.168.20.10" }]
      - [{ text: { en: "Server-level forwarders", fr: "Redirecteurs de niveau serveur" }, area: fwd }, { text: "10.0.0.10, 10.0.0.11" }]
      - [{ text: { en: "Root hints", fr: "Indications de racine" }, area: root }, { text: { en: "Used if no forwarder is available", fr: "Utilisées si aucun redirecteur n'est disponible" } }]
answer:
  values: { p1: cf, p2: deleg }
explanation:
  correct:
    en: |
      DNS1 can't answer either name from its zone or its empty cache. For app.fabrikam.com, the conditional forwarder matches the query name, so the query goes to 192.168.20.10 instead of the server-level forwarders. For host1.branch.contoso.com, DNS1 hosts the parent zone and holds a delegation for branch, so it checks the delegation first and queries ns1.branch.contoso.com; forwarders are used only when no delegation exists.
    fr: |
      DNS1 ne peut répondre à aucun des deux noms depuis sa zone ou son cache vide. Pour app.fabrikam.com, le redirecteur conditionnel correspond au nom demandé : la requête part vers 192.168.20.10 au lieu des redirecteurs de niveau serveur. Pour host1.branch.contoso.com, DNS1 héberge la zone parente et détient une délégation pour branch : il vérifie d'abord la délégation et interroge ns1.branch.contoso.com ; les redirecteurs ne servent que lorsqu'il n'existe aucune délégation.
references:
  - title: DNS Forwarding in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/forwarding
