id: az802-4b-relay-agent-role
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an Active Directory Domain Services (AD DS) domain. A DHCP server named **DHCP1** is on the head office subnet 10.10.0.0/24 and hosts an active scope for the branch subnet 10.10.8.0/24. The router between the two subnets doesn't forward DHCP broadcasts, and its configuration can't be changed. A server named **SRV8** that runs Windows Server 2025 is connected to the branch subnet.

    You need the clients of the branch subnet to obtain their IP addresses from DHCP1.

    Which server role should you install on SRV8?
  fr: |
    Votre réseau contient un domaine Active Directory Domain Services (AD DS). Un serveur DHCP nommé **DHCP1** se trouve sur le sous-réseau du siège 10.10.0.0/24 et héberge une étendue active pour le sous-réseau de la succursale 10.10.8.0/24. Le routeur entre les deux sous-réseaux ne transmet pas les diffusions DHCP, et sa configuration ne peut pas être modifiée. Un serveur nommé **SRV8** qui exécute Windows Server 2025 est connecté au sous-réseau de la succursale.

    Les clients du sous-réseau de la succursale doivent obtenir leurs adresses IP auprès de DHCP1.

    Quel rôle serveur devez-vous installer sur SRV8 ?
body:
  options:
    - { id: ras, text: Remote Access }
    - { id: dhcp, text: DHCP Server }
    - { id: npas, text: Network Policy and Access Services }
    - { id: wds, text: Windows Deployment Services }
answer: { optionId: ras }
explanation:
  correct:
    en: |
      The DHCP Relay Agent of Windows Server is part of the Remote Access role, not of the DHCP Server role. You install Remote Access with the Routing role service, enable LAN routing, add the DHCP Relay Agent routing protocol on the branch interface and enter the address of DHCP1. The agent then forwards the clients' broadcasts to DHCP1 across the router.
    fr: |
      L'agent de relais DHCP de Windows Server fait partie du rôle Remote Access, pas du rôle DHCP Server. Vous installez Remote Access avec le service de rôle Routing, activez le routage LAN, ajoutez le protocole de routage DHCP Relay Agent sur l'interface de la succursale et saisissez l'adresse de DHCP1. L'agent transmet alors les diffusions des clients à DHCP1 à travers le routeur.
  options:
    dhcp: { en: "Installing DHCP Server would create a second DHCP server; it doesn't relay requests to DHCP1.", fr: "Installer DHCP Server créerait un second serveur DHCP ; il ne relaie pas les demandes vers DHCP1." }
    npas: { en: "Network Policy and Access Services provides NPS (RADIUS); it doesn't contain the DHCP Relay Agent.", fr: "Network Policy and Access Services fournit NPS (RADIUS) ; il ne contient pas l'agent de relais DHCP." }
    wds: { en: "Windows Deployment Services deploys operating system images over the network; it doesn't relay DHCP requests.", fr: "Windows Deployment Services déploie des images de système d'exploitation par le réseau ; il ne relaie pas les demandes DHCP." }
references:
  - title: Install DHCP relay agent for Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-deploy-relay-agent
