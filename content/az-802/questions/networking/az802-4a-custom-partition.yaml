id: az802-4a-custom-partition
objective: "4.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Your network contains an AD DS forest. The forest contains two domains named contoso.com and east.contoso.com. Each domain has two domain controllers that run the DNS Server role.

    A domain controller named DC1 in contoso.com hosts an Active Directory-integrated zone named apps.contoso.com. The zone uses the replication scope **To all DNS servers running on domain controllers in this domain**.

    You need to ensure that the DNS servers on the domain controllers of east.contoso.com host apps.contoso.com and can process dynamic updates for the zone.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient une forêt AD DS. La forêt contient deux domaines nommés contoso.com et east.contoso.com. Chaque domaine possède deux contrôleurs de domaine qui exécutent le rôle Serveur DNS.

    Un contrôleur de domaine nommé DC1 dans contoso.com héberge une zone intégrée à Active Directory nommée apps.contoso.com. La zone utilise l'étendue de réplication **To all DNS servers running on domain controllers in this domain** (tous les serveurs DNS exécutés sur des contrôleurs de domaine de ce domaine).

    Vous devez faire en sorte que les serveurs DNS des contrôleurs de domaine de east.contoso.com hébergent apps.contoso.com et puissent traiter les mises à jour dynamiques de la zone.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Change the replication scope of the zone to To all domain controllers in this domain (for Windows 2000 compatibility).", fr: "Changer l'étendue de réplication de la zone en To all domain controllers in this domain (for Windows 2000 compatibility)." } }
    - { id: b, text: { en: "Change the replication scope of the zone to To all DNS servers running on domain controllers in this forest.", fr: "Changer l'étendue de réplication de la zone en To all DNS servers running on domain controllers in this forest." } }
    - { id: c, text: { en: "Create a secondary zone for apps.contoso.com on each domain controller of east.contoso.com.", fr: "Créer une zone secondaire pour apps.contoso.com sur chaque contrôleur de domaine de east.contoso.com." } }
    - { id: d, text: { en: "Create an application directory partition, enlist the DNS servers of both domains in it, and store the zone in that partition.", fr: "Créer une partition d'annuaire d'application, y inscrire les serveurs DNS des deux domaines et stocker la zone dans cette partition." } }
    - { id: e, text: { en: "Create a stub zone for apps.contoso.com on each domain controller of east.contoso.com.", fr: "Créer une zone de stub pour apps.contoso.com sur chaque contrôleur de domaine de east.contoso.com." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The Forest scope (ForestDnsZones) replicates the zone to the DNS servers on all domain controllers of the forest, including those of east.contoso.com. The Custom scope stores the zone in an application directory partition and replicates it to the DNS servers enlisted in that partition, whatever their domain. In both cases the zone stays Active Directory-integrated, so every hosting domain controller is a primary that processes dynamic updates.
    fr: |
      L'étendue Forest (ForestDnsZones) réplique la zone vers les serveurs DNS de tous les contrôleurs de domaine de la forêt, y compris ceux de east.contoso.com. L'étendue Custom stocke la zone dans une partition d'annuaire d'application et la réplique vers les serveurs DNS inscrits dans cette partition, quel que soit leur domaine. Dans les deux cas, la zone reste intégrée à Active Directory : chaque contrôleur de domaine qui l'héberge est un serveur principal qui traite les mises à jour dynamiques.
  options:
    a: { en: "The Legacy scope stores the zone in the domain partition of contoso.com, which doesn't replicate to the domain controllers of east.contoso.com.", fr: "L'étendue Legacy stocke la zone dans la partition de domaine de contoso.com, qui n'est pas répliquée vers les contrôleurs de domaine de east.contoso.com." }
    c: { en: "A secondary zone is read-only: it can't process dynamic updates.", fr: "Une zone secondaire est en lecture seule : elle ne peut pas traiter les mises à jour dynamiques." }
    e: { en: "A stub zone holds only the name server records of the zone; it neither hosts the zone nor processes updates.", fr: "Une zone de stub ne contient que les enregistrements de serveurs de noms de la zone ; elle n'héberge pas la zone et ne traite pas les mises à jour." }
references:
  - title: Add-DnsServerConditionalForwarderZone (DnsServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsserver/add-dnsserverconditionalforwarderzone
  - title: DNS zones in DNS Server on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/zone-types
