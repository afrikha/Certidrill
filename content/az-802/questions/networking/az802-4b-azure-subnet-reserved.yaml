id: az802-4b-azure-subnet-reserved
objective: "4.2.2"
type: multi
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You have an Azure virtual network that contains a subnet named **Infra** with the address range 10.90.1.0/24. No resource is deployed in Infra yet.

    You plan to deploy a virtual machine named **DNS1** in Infra and to assign a static private IP address to its network interface.

    Which two IP addresses can you assign to DNS1?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un réseau virtuel Azure qui contient un sous-réseau nommé **Infra** de plage d'adresses 10.90.1.0/24. Aucune ressource n'est encore déployée dans Infra.

    Vous prévoyez de déployer une machine virtuelle nommée **DNS1** dans Infra et d'attribuer une adresse IP privée statique à son interface réseau.

    Quelles sont les deux adresses IP que vous pouvez attribuer à DNS1 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a1, text: 10.90.1.1 }
    - { id: a3, text: 10.90.1.3 }
    - { id: a4, text: 10.90.1.4 }
    - { id: a254, text: 10.90.1.254 }
    - { id: a255, text: 10.90.1.255 }
answer: { optionIds: [a4, a254] }
explanation:
  correct:
    en: |
      Azure reserves five addresses in every subnet, the first four and the last one. In 10.90.1.0/24, the addresses 10.90.1.0 to 10.90.1.3 and 10.90.1.255 can't be assigned, so 10.90.1.4 and 10.90.1.254 are valid static addresses.
    fr: |
      Azure réserve cinq adresses dans chaque sous-réseau, les quatre premières et la dernière. Dans 10.90.1.0/24, les adresses 10.90.1.0 à 10.90.1.3 et 10.90.1.255 ne peuvent pas être attribuées : 10.90.1.4 et 10.90.1.254 sont des adresses statiques valides.
  options:
    a1: { en: "Azure reserves the .1 address for the default gateway of the subnet.", fr: "Azure réserve l'adresse .1 pour la passerelle par défaut du sous-réseau." }
    a3: { en: "Azure reserves .2 and .3 to map the Azure DNS addresses into the virtual network.", fr: "Azure réserve .2 et .3 pour mapper les adresses DNS d'Azure dans le réseau virtuel." }
    a255: { en: "The last address of the subnet is the reserved broadcast address.", fr: "La dernière adresse du sous-réseau est l'adresse de diffusion réservée." }
references:
  - title: Azure Virtual Network FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
  - title: Configure IP addresses for an Azure network interface
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/virtual-network-network-interface-addresses
