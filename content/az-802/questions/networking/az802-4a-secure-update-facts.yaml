id: az802-4a-secure-update-facts
objective: "4.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an AD DS domain named contoso.com. The domain controllers DC1 and DC2 run the DNS Server role and host the Active Directory-integrated zone contoso.com, which allows only secure dynamic updates.

    A member server named Server3 runs the DNS Server role and hosts a file-backed primary zone named lab.contoso.com. The default DNS permissions have not been changed.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine AD DS nommé contoso.com. Les contrôleurs de domaine DC1 et DC2 exécutent le rôle Serveur DNS et hébergent la zone intégrée à Active Directory contoso.com, qui n'autorise que les mises à jour dynamiques sécurisées.

    Un serveur membre nommé Server3 exécute le rôle Serveur DNS et héberge une zone principale stockée dans un fichier, nommée lab.contoso.com. Les autorisations DNS par défaut n'ont pas été modifiées.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can configure lab.contoso.com on Server3 to accept only secure dynamic updates.
        fr: Vous pouvez configurer lab.contoso.com sur Server3 pour qu'elle n'accepte que les mises à jour dynamiques sécurisées.
    - id: s2
      text:
        en: Any authenticated user of the domain can create a new A record in the contoso.com zone.
        fr: Tout utilisateur authentifié du domaine peut créer un nouvel enregistrement A dans la zone contoso.com.
    - id: s3
      text:
        en: Members of the DnsAdmins group have full control of the contoso.com zone.
        fr: Les membres du groupe DnsAdmins ont le contrôle total de la zone contoso.com.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Secure dynamic update is available only for Active Directory-integrated zones, and a file-backed zone on a member server can't be integrated. By default, any authenticated user can create A or PTR records in an Active Directory-integrated zone and then owns them. The DnsAdmins group has full control of all zones and records of the domain by default.
    fr: |
      La mise à jour dynamique sécurisée n'est disponible que pour les zones intégrées à Active Directory, et une zone stockée dans un fichier sur un serveur membre ne peut pas être intégrée. Par défaut, tout utilisateur authentifié peut créer des enregistrements A ou PTR dans une zone intégrée à Active Directory et en devient propriétaire. Le groupe DnsAdmins a par défaut le contrôle total de toutes les zones et de tous les enregistrements du domaine.
references:
  - title: DNS zones in DNS Server on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/zone-types
  - title: Dynamic DNS Update in Windows and Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/dynamic-update
