id: az802-4b-dhcp-dns-credentials
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Your network contains an AD DS domain named corp.adatum.com. The corp.adatum.com zone is Active Directory-integrated and accepts only secure dynamic updates.

    You deploy two DHCP servers named **DHCP1** and **DHCP2** in a load balance failover relationship. Both servers register the DNS records of their clients (`-DynamicUpdates Always`).

    You need to ensure that either DHCP server can update or delete the DNS records that the other server registered for a client. The zone must continue to accept only secure dynamic updates.

    What should you do?
  fr: |
    Votre réseau contient un domaine AD DS nommé corp.adatum.com. La zone corp.adatum.com est intégrée à Active Directory et n'accepte que les mises à jour dynamiques sécurisées.

    Vous déployez deux serveurs DHCP nommés **DHCP1** et **DHCP2** dans une relation de basculement en mode équilibrage de charge. Les deux serveurs inscrivent les enregistrements DNS de leurs clients (`-DynamicUpdates Always`).

    Vous devez vous assurer que chaque serveur DHCP peut mettre à jour ou supprimer les enregistrements DNS que l'autre serveur a inscrits pour un client. La zone doit continuer à n'accepter que les mises à jour dynamiques sécurisées.

    Que devez-vous faire ?
body:
  options:
    - { id: same, text: { en: "Configure DHCP1 and DHCP2 to use the same dedicated domain user account for DNS dynamic updates.", fr: "Configurer DHCP1 et DHCP2 pour qu'ils utilisent le même compte d'utilisateur de domaine dédié pour les mises à jour dynamiques DNS." } }
    - { id: each, text: { en: "Configure DHCP1 and DHCP2 to each use its own dedicated domain user account for DNS dynamic updates.", fr: "Configurer DHCP1 et DHCP2 pour que chacun utilise son propre compte d'utilisateur de domaine dédié pour les mises à jour dynamiques DNS." } }
    - { id: protect, text: { en: "Enable DNS name protection on DHCP1 and DHCP2 by using Set-DhcpServerv4DnsSetting.", fr: "Activer la protection des noms DNS sur DHCP1 et DHCP2 avec Set-DhcpServerv4DnsSetting." } }
    - { id: repl, text: { en: "Run Invoke-DhcpServerv4FailoverReplication on DHCP1 after each change to the scopes.", fr: "Exécuter Invoke-DhcpServerv4FailoverReplication sur DHCP1 après chaque modification des étendues." } }
answer: { optionId: same }
explanation:
  correct:
    en: |
      In a secure zone, the account that registers a record becomes its owner, and only that owner can update the record later. When a failover partner uses different credentials, its updates of the other server's records fail. Configuring both servers with the same DNS credentials (`Set-DhcpServerDnsCredential`) lets either partner update or delete any client record while the zone stays secure.
    fr: |
      Dans une zone sécurisée, le compte qui inscrit un enregistrement en devient propriétaire, et seul ce propriétaire peut ensuite le mettre à jour. Quand un partenaire de basculement utilise d'autres informations d'identification, ses mises à jour des enregistrements de l'autre serveur échouent. Configurer les deux serveurs avec les mêmes informations d'identification DNS (`Set-DhcpServerDnsCredential`) permet à chaque partenaire de mettre à jour ou de supprimer tout enregistrement client, tout en gardant la zone sécurisée.
  options:
    each: { en: "Two different accounts still own different records, so each server's updates of the other's records fail.", fr: "Deux comptes différents restent propriétaires d'enregistrements différents : les mises à jour par un serveur des enregistrements de l'autre échouent." }
    protect: { en: "Name protection prevents overwriting a record with the same name; it doesn't give a server rights on records owned by another account.", fr: "La protection des noms empêche d'écraser un enregistrement du même nom ; elle ne donne à aucun serveur de droits sur les enregistrements appartenant à un autre compte." }
    repl: { en: "Failover replication copies scope settings to the partner; it doesn't change the ownership of DNS records.", fr: "La réplication de basculement copie les paramètres d'étendue vers le partenaire ; elle ne change pas le propriétaire des enregistrements DNS." }
references:
  - title: DHCP failover in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-failover
