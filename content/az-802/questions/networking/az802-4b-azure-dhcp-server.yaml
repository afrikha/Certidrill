id: az802-4b-azure-dhcp-server
objective: "4.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your company has an on-premises network that is connected to an Azure virtual network named **VNet1** by a site-to-site VPN.

    You move the DHCP Server role from an on-premises server to an Azure virtual machine named **DHCPAZ1** in VNet1. The branch routers relay DHCP requests to the private IP address of DHCPAZ1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre entreprise dispose d'un réseau local connecté à un réseau virtuel Azure nommé **VNet1** par un VPN de site à site.

    Vous déplacez le rôle DHCP Server d'un serveur local vers une machine virtuelle Azure nommée **DHCPAZ1** dans VNet1. Les routeurs des succursales relaient les demandes DHCP vers l'adresse IP privée de DHCPAZ1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          DHCPAZ1 can lease IP addresses to the other Azure virtual machines in VNet1.
        fr: |
          DHCPAZ1 peut attribuer des adresses IP aux autres machines virtuelles Azure de VNet1.
    - id: s2
      text:
        en: |
          DHCPAZ1 can lease IP addresses to the on-premises clients whose requests are relayed by the branch routers.
        fr: |
          DHCPAZ1 peut attribuer des adresses IP aux clients locaux dont les demandes sont relayées par les routeurs des succursales.
    - id: s3
      text:
        en: |
          When an on-premises client sends its T1 renewal request directly to DHCPAZ1, the renewal succeeds.
        fr: |
          Quand un client local envoie sa demande de renouvellement T1 directement à DHCPAZ1, le renouvellement réussit.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Azure provides DHCP to the VMs of a virtual network, and broadcasts aren't supported in a virtual network, so a DHCP server in a VM can't serve the other VMs. It can serve on-premises clients through a DHCP relay agent. Direct client-to-server DHCP traffic (UDP 68 to UDP 67) isn't supported in Azure, so the T1 renewal times out and the client renews at T2 through the relay agent.
    fr: |
      Azure fournit le DHCP aux machines virtuelles d'un réseau virtuel, et la diffusion n'est pas prise en charge dans un réseau virtuel : un serveur DHCP dans une machine virtuelle ne peut pas servir les autres machines virtuelles. Il peut servir des clients locaux par un agent de relais DHCP. Le trafic DHCP direct du client vers le serveur (UDP 68 vers UDP 67) n'est pas pris en charge dans Azure : le renouvellement T1 expire et le client renouvelle à T2 par l'agent de relais.
references:
  - title: Azure Virtual Network FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
