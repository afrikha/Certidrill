id: az802-4a-policy-geo-feature
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A DNS server named DNS1 runs Windows Server 2025 and hosts the primary zone contoso.com. A web application named www.contoso.com runs in two datacenters, one in Europe (172.17.97.97) and one in North America (172.21.21.21).

    You need clients in the 172.17.44.0/24 subnet to receive only 172.17.97.97 and clients in the 172.21.33.0/24 subnet to receive only 172.21.21.21 when they query www.contoso.com.

    What should you implement on DNS1?
  fr: |
    Un serveur DNS nommé DNS1 exécute Windows Server 2025 et héberge la zone principale contoso.com. Une application web nommée www.contoso.com s'exécute dans deux centres de données, l'un en Europe (172.17.97.97) et l'autre en Amérique du Nord (172.21.21.21).

    Les clients du sous-réseau 172.17.44.0/24 doivent recevoir uniquement 172.17.97.97, et ceux du sous-réseau 172.21.33.0/24 uniquement 172.21.21.21, lorsqu'ils interrogent www.contoso.com.

    Que devez-vous implémenter sur DNS1 ?
body:
  options:
    - { id: a, text: { en: "Two A records named www and DNS round robin", fr: "Deux enregistrements A nommés www et la répartition DNS par tourniquet (round robin)" } }
    - { id: b, text: { en: "A conditional forwarder for www.contoso.com in each datacenter", fr: "Un redirecteur conditionnel pour www.contoso.com dans chaque centre de données" } }
    - { id: c, text: { en: "Client subnets, zone scopes and query resolution policies", fr: "Des sous-réseaux clients, des étendues de zone et des stratégies de résolution de requêtes" } }
    - { id: d, text: { en: "A delegation of www to a DNS server in each datacenter", fr: "Une délégation de www vers un serveur DNS dans chaque centre de données" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      DNS policies provide geo-location based traffic management. You define one client subnet per region, one zone scope per datacenter that holds its own www record, and a query resolution policy that maps each client subnet to its zone scope.
    fr: |
      Les stratégies DNS assurent la gestion du trafic selon la géolocalisation. Vous définissez un sous-réseau client par région, une étendue de zone par centre de données contenant son propre enregistrement www, et une stratégie de résolution de requêtes qui associe chaque sous-réseau client à son étendue de zone.
  options:
    a: { en: "Round robin returns both addresses to every client and only rotates their order.", fr: "Le tourniquet renvoie les deux adresses à chaque client et ne fait qu'alterner leur ordre." }
    b: { en: "A conditional forwarder sends queries for a namespace to other servers; it doesn't choose an answer based on the client's subnet.", fr: "Un redirecteur conditionnel envoie les requêtes d'un espace de noms vers d'autres serveurs ; il ne choisit pas la réponse selon le sous-réseau du client." }
    d: { en: "A delegation sends every client to the same name servers, whatever its subnet.", fr: "Une délégation envoie tous les clients vers les mêmes serveurs de noms, quel que soit leur sous-réseau." }
references:
  - title: DNS Policies Overview
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/deploy/dns-policies-overview
