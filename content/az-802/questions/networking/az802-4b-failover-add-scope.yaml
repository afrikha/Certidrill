id: az802-4b-failover-add-scope
objective: "4.2.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Two DHCP servers named **DHCP1** and **DHCP2** have a load balance failover relationship named **HQ-LB** that contains three scopes.

    You need to provide high availability for a new subnet, 10.20.40.0/24. The addresses from 10.20.40.1 to 10.20.40.20 must never be leased. The solution must use HQ-LB and minimize the number of actions.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Deux serveurs DHCP nommés **DHCP1** et **DHCP2** ont une relation de basculement en mode équilibrage de charge nommée **HQ-LB** qui contient trois étendues.

    Vous devez assurer la haute disponibilité d'un nouveau sous-réseau, 10.20.40.0/24. Les adresses de 10.20.40.1 à 10.20.40.20 ne doivent jamais être attribuées. La solution doit utiliser HQ-LB et réduire au minimum le nombre d'actions.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: scope1
      text: { en: "On DHCP1, create the scope 10.20.40.0/24 by running `Add-DhcpServerv4Scope`.", fr: "Sur DHCP1, créer l'étendue 10.20.40.0/24 avec `Add-DhcpServerv4Scope`." }
    - id: excl
      text: { en: "On DHCP1, exclude 10.20.40.1 to 10.20.40.20 by running `Add-DhcpServerv4ExclusionRange`.", fr: "Sur DHCP1, exclure 10.20.40.1 à 10.20.40.20 avec `Add-DhcpServerv4ExclusionRange`." }
    - id: addfo
      text: { en: "On DHCP1, run `Add-DhcpServerv4FailoverScope -Name HQ-LB -ScopeId 10.20.40.0`.", fr: "Sur DHCP1, exécuter `Add-DhcpServerv4FailoverScope -Name HQ-LB -ScopeId 10.20.40.0`." }
    - id: scope2
      text: { en: "On DHCP2, create the scope 10.20.40.0/24 by running `Add-DhcpServerv4Scope`.", fr: "Sur DHCP2, créer l'étendue 10.20.40.0/24 avec `Add-DhcpServerv4Scope`." }
    - id: newfo
      text: { en: "On DHCP1, run `Add-DhcpServerv4Failover` to create a relationship with DHCP2 for 10.20.40.0.", fr: "Sur DHCP1, exécuter `Add-DhcpServerv4Failover` pour créer une relation avec DHCP2 pour 10.20.40.0." }
    - id: rep2
      text: { en: "On DHCP2, run `Invoke-DhcpServerv4FailoverReplication -ScopeId 10.20.40.0`.", fr: "Sur DHCP2, exécuter `Invoke-DhcpServerv4FailoverReplication -ScopeId 10.20.40.0`." }
answer:
  sequence: [scope1, excl, addfo]
explanation:
  correct:
    en: |
      The scope must exist on the local server before you add it to the existing relationship with `Add-DhcpServerv4FailoverScope`, and it must not exist on the partner. Creating the exclusion range before adding the scope means that the configuration copied to DHCP2 already contains it; adding it later would require an extra replication from DHCP1.
    fr: |
      L'étendue doit exister sur le serveur local avant d'être ajoutée à la relation existante avec `Add-DhcpServerv4FailoverScope`, et elle ne doit pas exister sur le partenaire. Créer la plage d'exclusion avant d'ajouter l'étendue garantit que la configuration copiée sur DHCP2 la contient déjà ; l'ajouter ensuite exigerait une réplication supplémentaire depuis DHCP1.
  options:
    scope2: { en: "A scope that already exists on the partner can't be added to the relationship.", fr: "Une étendue qui existe déjà sur le partenaire ne peut pas être ajoutée à la relation." }
    newfo: { en: "The requirement is to use the existing relationship HQ-LB, not to create a new one.", fr: "L'exigence est d'utiliser la relation existante HQ-LB, pas d'en créer une nouvelle." }
    rep2: { en: "Replication from DHCP2 would overwrite the settings of DHCP1, and no replication is needed when the scope is complete before it is added.", fr: "Une réplication depuis DHCP2 écraserait les paramètres de DHCP1, et aucune réplication n'est nécessaire quand l'étendue est complète avant son ajout." }
references:
  - title: Add-DhcpServerv4FailoverScope (DhcpServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/add-dhcpserverv4failoverscope
  - title: Manage DHCP failover relationships in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/manage-dhcp-failover-relationships
