id: az802-4a-policy-block
objective: "4.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A DNS server named DNS1 runs Windows Server 2022 and hosts several zones. Clients on the network attempt to resolve names under the domain contosomalicious.com.

    You need to configure DNS1 so that it drops every query for a name under contosomalicious.com without sending any response. The configuration must apply to all the queries received by DNS1.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur DNS nommé DNS1 exécute Windows Server 2022 et héberge plusieurs zones. Des clients du réseau tentent de résoudre des noms du domaine contosomalicious.com.

    Vous devez configurer DNS1 pour qu'il abandonne toute requête pour un nom de contosomalicious.com sans envoyer de réponse. La configuration doit s'appliquer à toutes les requêtes reçues par DNS1.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Add-DnsServerQueryResolutionPolicy -Name "BlockMalicious" -Action [[action]] -[[criterion]] "[[operator]],*.contosomalicious.com"
  slots:
    - id: action
      options:
        - { id: ignore, text: IGNORE }
        - { id: deny, text: DENY }
        - { id: allow, text: ALLOW }
    - id: criterion
      options:
        - { id: fqdn, text: FQDN }
        - { id: subnet, text: ClientSubnet }
        - { id: qtype, text: QType }
        - { id: iface, text: ServerInterfaceIP }
    - id: operator
      options:
        - { id: eq, text: EQ }
        - { id: ne, text: NE }
answer:
  values: { action: ignore, criterion: fqdn, operator: eq }
explanation:
  correct:
    en: |
      A query resolution policy created without -ZoneName is a server-level policy, which applies to all queries and can use only DENY or IGNORE. IGNORE makes the server drop the query without answering. The FQDN criterion matches the query name, and EQ with the wildcard *.contosomalicious.com matches every name under that domain.
    fr: |
      Une stratégie de résolution de requêtes créée sans -ZoneName est une stratégie de niveau serveur, qui s'applique à toutes les requêtes et ne peut utiliser que DENY ou IGNORE. IGNORE fait abandonner la requête par le serveur sans réponse. Le critère FQDN porte sur le nom demandé, et EQ avec le caractère générique *.contosomalicious.com correspond à tous les noms de ce domaine.
  options:
    deny: { en: "DENY sends a failure response to the client instead of dropping the query.", fr: "DENY envoie une réponse d'échec au client au lieu d'abandonner la requête." }
    allow: { en: "Server-level policies can use only DENY or IGNORE.", fr: "Les stratégies de niveau serveur ne peuvent utiliser que DENY ou IGNORE." }
    subnet: { en: "ClientSubnet expects the name of a client subnet created with Add-DnsServerClientSubnet, not a domain name.", fr: "ClientSubnet attend le nom d'un sous-réseau client créé avec Add-DnsServerClientSubnet, pas un nom de domaine." }
    qtype: { en: "QType matches record types such as A or MX, not names.", fr: "QType porte sur des types d'enregistrements comme A ou MX, pas sur des noms." }
    iface: { en: "ServerInterfaceIP matches the IP address of the interface that receives the query.", fr: "ServerInterfaceIP porte sur l'adresse IP de l'interface qui reçoit la requête." }
    ne: { en: "NE would match every name that is not under contosomalicious.com.", fr: "NE correspondrait à tous les noms qui ne sont pas sous contosomalicious.com." }
references:
  - title: Add-DnsServerQueryResolutionPolicy (DnsServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsserver/add-dnsserverqueryresolutionpolicy
  - title: DNS Policies Overview
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/deploy/dns-policies-overview
