id: az802-4a-policy-replication
objective: "4.1.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Your network contains an AD DS domain named contoso.com. The writable domain controllers DC1 and DC2 and a read-only domain controller named RODC1 run the DNS Server role and host the Active Directory-integrated zone contoso.com.

    On DC1, you run the following commands:

    ```powershell
    Add-DnsServerZoneScope -ZoneName "contoso.com" -Name "external"
    Add-DnsServerResourceRecord -ZoneName "contoso.com" -A -Name "www" -IPv4Address "65.55.39.10" -ZoneScope "external"
    Add-DnsServerQueryResolutionPolicy -Name "SplitBrainZonePolicy" -Action ALLOW -ServerInterfaceIP "EQ,208.84.0.53" -ZoneScope "external,1" -ZoneName "contoso.com"
    ```

    Active Directory replication completes. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine AD DS nommé contoso.com. Les contrôleurs de domaine accessibles en écriture DC1 et DC2 et un contrôleur de domaine en lecture seule nommé RODC1 exécutent le rôle Serveur DNS et hébergent la zone intégrée à Active Directory contoso.com.

    Sur DC1, vous exécutez les commandes suivantes :

    ```powershell
    Add-DnsServerZoneScope -ZoneName "contoso.com" -Name "external"
    Add-DnsServerResourceRecord -ZoneName "contoso.com" -A -Name "www" -IPv4Address "65.55.39.10" -ZoneScope "external"
    Add-DnsServerQueryResolutionPolicy -Name "SplitBrainZonePolicy" -Action ALLOW -ServerInterfaceIP "EQ,208.84.0.53" -ZoneScope "external,1" -ZoneName "contoso.com"
    ```

    La réplication Active Directory est terminée. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: DC2 hosts the external zone scope and its www record.
        fr: DC2 héberge l'étendue de zone external et son enregistrement www.
    - id: s2
      text:
        en: DC2 applies SplitBrainZonePolicy to the queries that it receives.
        fr: DC2 applique SplitBrainZonePolicy aux requêtes qu'il reçoit.
    - id: s3
      text:
        en: If you add SplitBrainZonePolicy to RODC1, RODC1 applies it only after its DNS Server service restarts.
        fr: Si vous ajoutez SplitBrainZonePolicy à RODC1, RODC1 ne l'applique qu'après le redémarrage de son service Serveur DNS.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      In an Active Directory-integrated zone, a zone scope and its records replicate through AD DS like the rest of the zone. DNS policies aren't Active Directory-integrated: they are stored on the local DNS server, so you must add them to every server that must apply them, for example by piping Get-DnsServerQueryResolutionPolicy into Add-DnsServerQueryResolutionPolicy -ComputerName. On a read-only domain controller, new policies are loaded only after the DNS Server service restarts.
    fr: |
      Dans une zone intégrée à Active Directory, une étendue de zone et ses enregistrements sont répliqués par AD DS comme le reste de la zone. Les stratégies DNS ne sont pas intégrées à Active Directory : elles sont stockées sur le serveur DNS local, et vous devez les ajouter à chaque serveur qui doit les appliquer, par exemple en redirigeant Get-DnsServerQueryResolutionPolicy vers Add-DnsServerQueryResolutionPolicy -ComputerName. Sur un contrôleur de domaine en lecture seule, les nouvelles stratégies ne sont chargées qu'après le redémarrage du service Serveur DNS.
references:
  - title: Use DNS Policy for Split-Brain DNS in Active Directory
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/deploy/dns-sb-with-ad
  - title: DNS Policies Overview
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/deploy/dns-policies-overview
