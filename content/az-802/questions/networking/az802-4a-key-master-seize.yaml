id: az802-4a-key-master-seize
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an AD DS domain named contoso.com. The domain controllers DC1, DC2 and DC3 run the DNS Server role and host the Active Directory-integrated zone secure.contoso.com, which is signed with DNSSEC. DC1 is the Key Master of the zone.

    DC1 suffers a permanent hardware failure and will not be brought back online. You need DC2 to perform the future key rollovers of the zone. The keys and the trust anchors already in use must keep working.

    Which command should you run?
  fr: |
    Votre réseau contient un domaine AD DS nommé contoso.com. Les contrôleurs de domaine DC1, DC2 et DC3 exécutent le rôle Serveur DNS et hébergent la zone intégrée à Active Directory secure.contoso.com, signée avec DNSSEC. DC1 est le maître de clés (Key Master) de la zone.

    DC1 subit une panne matérielle définitive et ne sera pas remis en ligne. DC2 doit effectuer les prochaines substitutions de clés de la zone. Les clés et les ancres d'approbation déjà utilisées doivent continuer à fonctionner.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "Reset-DnsServerZoneKeyMasterRole -ZoneName \"secure.contoso.com\" -KeyMasterServer DC2" }
    - { id: b, text: "Reset-DnsServerZoneKeyMasterRole -ZoneName \"secure.contoso.com\" -KeyMasterServer DC2 -SeizeRole" }
    - { id: c, text: "Invoke-DnsServerZoneSign -ZoneName \"secure.contoso.com\" -SignWithDefault -ComputerName DC2" }
    - { id: d, text: "Move-ADDirectoryServerOperationMasterRole -Identity DC2 -OperationMasterRole PDCEmulator" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In an Active Directory-integrated zone, any DNS server that hosts a primary copy of the zone can become the Key Master. Reset-DnsServerZoneKeyMasterRole first contacts the current Key Master and makes no change if it can't reach it; -SeizeRole moves the role to DC2 even though DC1 is offline. The existing keys, replicated through AD DS, stay in use.
    fr: |
      Dans une zone intégrée à Active Directory, tout serveur DNS qui héberge une copie principale de la zone peut devenir maître de clés. Reset-DnsServerZoneKeyMasterRole contacte d'abord le maître de clés actuel et ne change rien s'il ne peut pas le joindre ; -SeizeRole déplace le rôle vers DC2 même si DC1 est hors ligne. Les clés existantes, répliquées par AD DS, restent utilisées.
  options:
    a: { en: "Without -SeizeRole, the cmdlet makes no change when the current Key Master can't be reached.", fr: "Sans -SeizeRole, la cmdlet ne change rien lorsque le maître de clés actuel est injoignable." }
    c: { en: "On a signed zone, -SignWithDefault removes the existing KSK and ZSK and signs the zone with new keys, which breaks the trust anchors already distributed.", fr: "Sur une zone signée, -SignWithDefault supprime la KSK et la ZSK existantes et signe la zone avec de nouvelles clés, ce qui invalide les ancres d'approbation déjà distribuées." }
    d: { en: "FSMO roles are unrelated to the DNSSEC Key Master role.", fr: "Les rôles FSMO n'ont aucun rapport avec le rôle de maître de clés DNSSEC." }
references:
  - title: Reset-DnsServerZoneKeyMasterRole (DnsServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsserver/reset-dnsserverzonekeymasterrole
  - title: DNSSEC Key Master
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/dnssec-key-master
