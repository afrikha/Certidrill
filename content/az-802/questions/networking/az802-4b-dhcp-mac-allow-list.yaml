id: az802-4b-dhcp-mac-allow-list
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A DHCP server named **DHCP1** serves a lab network. Only 40 approved devices must obtain leases from DHCP1.

    For each approved device, you run a command similar to the following one, with the MAC address of the device:

    `Add-DhcpServerv4Filter -List Allow -MacAddress "00-15-5D-0A-12-01" -Description "Lab device 01"`

    A test laptop whose MAC address isn't in the list still obtains a lease from DHCP1.

    What should you do?
  fr: |
    Un serveur DHCP nommé **DHCP1** dessert un réseau de laboratoire. Seuls 40 appareils approuvés doivent obtenir des baux auprès de DHCP1.

    Pour chaque appareil approuvé, vous exécutez une commande semblable à la suivante, avec l'adresse MAC de l'appareil :

    `Add-DhcpServerv4Filter -List Allow -MacAddress "00-15-5D-0A-12-01" -Description "Lab device 01"`

    Un ordinateur portable de test dont l'adresse MAC n'est pas dans la liste obtient toujours un bail auprès de DHCP1.

    Que devez-vous faire ?
body:
  options:
    - { id: enable, text: { en: "Run `Set-DhcpServerv4FilterList -Allow $true` on DHCP1.", fr: "Exécuter `Set-DhcpServerv4FilterList -Allow $true` sur DHCP1." } }
    - { id: policies, text: { en: "Run `Set-DhcpServerSetting -ActivatePolicies $true` on DHCP1.", fr: "Exécuter `Set-DhcpServerSetting -ActivatePolicies $true` sur DHCP1." } }
    - { id: deny, text: { en: "Run `Add-DhcpServerv4Filter -List Deny` with the MAC address of the test laptop.", fr: "Exécuter `Add-DhcpServerv4Filter -List Deny` avec l'adresse MAC de l'ordinateur portable de test." } }
    - { id: resv, text: { en: "Run `Add-DhcpServerv4Reservation` for each approved device.", fr: "Exécuter `Add-DhcpServerv4Reservation` pour chaque appareil approuvé." } }
answer: { optionId: enable }
explanation:
  correct:
    en: |
      Adding MAC addresses to the allow list doesn't enforce it. The allow and deny lists are enabled separately with `Set-DhcpServerv4FilterList`. Once the allow list is enabled, DHCP1 leases addresses only to the devices whose MAC addresses are in it.
    fr: |
      Ajouter des adresses MAC à la liste d'autorisation ne suffit pas à l'appliquer. Les listes d'autorisation et de refus s'activent séparément avec `Set-DhcpServerv4FilterList`. Une fois la liste d'autorisation activée, DHCP1 n'attribue des adresses qu'aux appareils dont l'adresse MAC y figure.
  options:
    policies: { en: "Policy enforcement concerns DHCP policies (conditions that assign ranges and options), not MAC address filters.", fr: "L'application des stratégies concerne les stratégies DHCP (conditions qui attribuent des plages et des options), pas les filtres d'adresses MAC." }
    deny: { en: "Denying one laptop doesn't stop the other unknown devices; the requirement is to allow only the approved devices.", fr: "Refuser un seul ordinateur portable n'arrête pas les autres appareils inconnus ; l'exigence est de n'autoriser que les appareils approuvés." }
    resv: { en: "Reservations give fixed addresses to the approved devices, but the other devices still receive dynamic leases.", fr: "Les réservations donnent des adresses fixes aux appareils approuvés, mais les autres appareils reçoivent toujours des baux dynamiques." }
references:
  - title: Set-DhcpServerv4FilterList (DhcpServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/set-dhcpserverv4filterlist
