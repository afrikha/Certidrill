id: az802-sr2-dns-subnet-policy-2
objective: "4.1.5"
type: series_yesno
series: az802-sr2-dns-subnet-policy
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You create a client subnet, a zone scope and a zone-level query resolution policy that matches the subnet and the FQDN.
  fr: |
    Vous créez un sous-réseau client, une étendue de zone et une stratégie de résolution de requête au niveau de la zone qui correspond au sous-réseau et au FQDN.
body:
  solution:
    en: |
      You run the following commands on DNS1:

      ```powershell
      Add-DnsServerClientSubnet -Name "Branch1Subnet" -IPv4Subnet "10.20.0.0/16"
      Add-DnsServerZoneScope -ZoneName "contoso.com" -Name "Branch1Scope"
      Add-DnsServerResourceRecord -ZoneName "contoso.com" -A -Name "app" -IPv4Address "10.20.5.10" -ZoneScope "Branch1Scope"
      Add-DnsServerQueryResolutionPolicy -Name "Branch1Policy" -Action ALLOW -ClientSubnet "EQ,Branch1Subnet" -Fqdn "EQ,app.contoso.com" -Condition AND -ZoneScope "Branch1Scope,1" -ZoneName "contoso.com"
      ```
    fr: |
      Vous exécutez les commandes suivantes sur DNS1 :

      ```powershell
      Add-DnsServerClientSubnet -Name "Branch1Subnet" -IPv4Subnet "10.20.0.0/16"
      Add-DnsServerZoneScope -ZoneName "contoso.com" -Name "Branch1Scope"
      Add-DnsServerResourceRecord -ZoneName "contoso.com" -A -Name "app" -IPv4Address "10.20.5.10" -ZoneScope "Branch1Scope"
      Add-DnsServerQueryResolutionPolicy -Name "Branch1Policy" -Action ALLOW -ClientSubnet "EQ,Branch1Subnet" -Fqdn "EQ,app.contoso.com" -Condition AND -ZoneScope "Branch1Scope,1" -ZoneName "contoso.com"
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      The policy matches only queries whose source IP address is in 10.20.0.0/16 and whose name is app.contoso.com, and it answers them from Branch1Scope with 10.20.5.10. Every other query matches no policy and is answered from the default zone scope, which keeps the existing records.
    fr: |
      La stratégie ne correspond qu'aux requêtes dont l'adresse IP source appartient à 10.20.0.0/16 et dont le nom est app.contoso.com, et elle y répond depuis Branch1Scope avec 10.20.5.10. Toutes les autres requêtes ne correspondent à aucune stratégie et reçoivent une réponse de l'étendue de zone par défaut, qui conserve les enregistrements existants.
references:
  - title: Use DNS Policy for Geo-Location Based Traffic Management with Primary Servers
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/deploy/primary-geo-location
  - title: Add-DnsServerQueryResolutionPolicy (DnsServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsserver/add-dnsserverqueryresolutionpolicy
