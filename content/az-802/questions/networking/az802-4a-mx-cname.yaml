id: az802-4a-mx-cname
objective: "4.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A DNS server named DNS1 hosts the primary zone contoso.com. The zone contains an A record for a server named app1.contoso.com and an A record for a mail server named mail1.contoso.com.

    You need to meet the following requirements:

    - Email sent to addresses in the contoso.com domain must be delivered to mail1.contoso.com.
    - The name www.contoso.com must resolve to app1. When the IP address of app1 changes, only one record must be updated.

    Which two records should you create? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur DNS nommé DNS1 héberge la zone principale contoso.com. La zone contient un enregistrement A pour un serveur nommé app1.contoso.com et un enregistrement A pour un serveur de messagerie nommé mail1.contoso.com.

    Vous devez satisfaire les exigences suivantes :

    - Les e-mails envoyés aux adresses du domaine contoso.com doivent être remis à mail1.contoso.com.
    - Le nom www.contoso.com doit être résolu en app1. Lorsque l'adresse IP d'app1 change, un seul enregistrement doit être mis à jour.

    Quels sont les deux enregistrements à créer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An A record named www that contains the IP address of app1", fr: "Un enregistrement A nommé www qui contient l'adresse IP d'app1" } }
    - { id: b, text: { en: "An MX record at the root of the zone that points to mail1.contoso.com", fr: "Un enregistrement MX à la racine de la zone qui pointe vers mail1.contoso.com" } }
    - { id: c, text: { en: "A CNAME record named www that points to app1.contoso.com", fr: "Un enregistrement CNAME nommé www qui pointe vers app1.contoso.com" } }
    - { id: d, text: { en: "An SRV record named _smtp._tcp that points to mail1.contoso.com", fr: "Un enregistrement SRV nommé _smtp._tcp qui pointe vers mail1.contoso.com" } }
    - { id: e, text: { en: "A PTR record for mail1 in the reverse lookup zone", fr: "Un enregistrement PTR pour mail1 dans la zone de recherche inversée" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Mail servers find the mail exchanger of a domain through its MX records, created at the root of the zone (Add-DnsServerResourceRecordMX -Name "."). A CNAME record makes www an alias of app1.contoso.com, so only the A record of app1 must change when its address changes.
    fr: |
      Les serveurs de messagerie trouvent le serveur d'échange de courrier d'un domaine grâce à ses enregistrements MX, créés à la racine de la zone (Add-DnsServerResourceRecordMX -Name "."). Un enregistrement CNAME fait de www un alias d'app1.contoso.com : seul l'enregistrement A d'app1 doit changer quand son adresse change.
  options:
    a: { en: "A second A record would also have to be updated each time the IP address of app1 changes.", fr: "Un second enregistrement A devrait lui aussi être mis à jour chaque fois que l'adresse IP d'app1 change." }
    d: { en: "Mail delivery uses MX records, not SRV records.", fr: "La remise du courrier utilise les enregistrements MX, pas des enregistrements SRV." }
    e: { en: "A PTR record resolves an address to a name; it doesn't tell senders where to deliver mail.", fr: "Un enregistrement PTR résout une adresse en nom ; il n'indique pas aux expéditeurs où remettre le courrier." }
references:
  - title: Add-DnsServerResourceRecordMX (DnsServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsserver/add-dnsserverresourcerecordmx
