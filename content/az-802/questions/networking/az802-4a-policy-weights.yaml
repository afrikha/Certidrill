id: az802-4a-policy-weights
objective: "4.1.5"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    A DNS server named DNS1 hosts the zone contoso.com. The zone has two zone scopes named DublinScope and AmsterdamScope, and each scope contains a different A record named app. You run the following command:

    `Add-DnsServerQueryResolutionPolicy -Name "AppPolicy" -Action ALLOW -ZoneScope "DublinScope,3;AmsterdamScope,5" -ZoneName "contoso.com"`

    DNS1 receives eight queries for app.contoso.com. No other policy applies. How many responses contain the record from DublinScope?
  fr: |
    Un serveur DNS nommé DNS1 héberge la zone contoso.com. La zone possède deux étendues de zone nommées DublinScope et AmsterdamScope, et chaque étendue contient un enregistrement A nommé app différent. Vous exécutez la commande suivante :

    `Add-DnsServerQueryResolutionPolicy -Name "AppPolicy" -Action ALLOW -ZoneScope "DublinScope,3;AmsterdamScope,5" -ZoneName "contoso.com"`

    DNS1 reçoit huit requêtes pour app.contoso.com. Aucune autre stratégie ne s'applique. Combien de réponses contiennent l'enregistrement de DublinScope ?
body:
  options:
    - { id: a, text: "3" }
    - { id: b, text: "4" }
    - { id: c, text: "5" }
    - { id: d, text: "8" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each zone scope of the policy has a weight, and the server answers in proportion to each weight relative to the total. The total is 3 + 5 = 8, so DublinScope answers 3 queries out of 8 and AmsterdamScope 5 out of 8. Client and resolver caching can skew this distribution in practice.
    fr: |
      Chaque étendue de zone de la stratégie a une pondération, et le serveur répond en proportion de chaque pondération par rapport au total. Le total vaut 3 + 5 = 8 : DublinScope répond à 3 requêtes sur 8 et AmsterdamScope à 5 sur 8. En pratique, la mise en cache par les clients et les résolveurs peut fausser cette répartition.
  options:
    b: { en: "An equal split would apply only if both scopes had the same weight.", fr: "Une répartition égale ne s'appliquerait que si les deux étendues avaient la même pondération." }
    c: { en: "5 out of 8 is the share of AmsterdamScope.", fr: "5 sur 8 est la part d'AmsterdamScope." }
    d: { en: "The weights split the answers between the scopes; the first scope listed doesn't receive every query.", fr: "Les pondérations répartissent les réponses entre les étendues ; la première étendue listée ne reçoit pas toutes les requêtes." }
references:
  - title: Use DNS Policy for Application Load Balancing
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/deploy/app-lb
  - title: DNS Policies Overview
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/deploy/dns-policies-overview
