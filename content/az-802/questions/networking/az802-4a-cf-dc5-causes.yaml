id: az802-4a-cf-dc5-causes
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an AD DS domain named contoso.com. The domain controllers DC1 and DC5 run the DNS Server role and use server-level forwarders to an ISP. DC1 is in the main office and DC5 is in a branch office.

    An administrator created a conditional forwarder for fabrikam.com on DC1 that targets the Fabrikam DNS servers 192.168.20.10 and 192.168.20.11. Clients that use DC1 resolve names in fabrikam.com, but clients that use DC5 can't resolve any name in fabrikam.com.

    Which two issues could cause the problem?

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine AD DS nommé contoso.com. Les contrôleurs de domaine DC1 et DC5 exécutent le rôle Serveur DNS et utilisent des redirecteurs de niveau serveur vers un FAI. DC1 se trouve au siège et DC5 dans une succursale.

    Un administrateur a créé sur DC1 un redirecteur conditionnel pour fabrikam.com qui cible les serveurs DNS de Fabrikam 192.168.20.10 et 192.168.20.11. Les clients qui utilisent DC1 résolvent les noms de fabrikam.com, mais les clients qui utilisent DC5 ne peuvent résoudre aucun nom de fabrikam.com.

    Quels sont les deux problèmes qui peuvent en être la cause ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The conditional forwarder is stored in AD DS with the Forest replication scope.", fr: "Le redirecteur conditionnel est stocké dans AD DS avec l'étendue de réplication Forest." } }
    - { id: b, text: { en: "The conditional forwarder was created without being stored in AD DS.", fr: "Le redirecteur conditionnel a été créé sans être stocké dans AD DS." } }
    - { id: c, text: { en: "Root hints are disabled on DC5 by using UseRootHint $false.", fr: "Les indications de racine sont désactivées sur DC5 avec UseRootHint $false." } }
    - { id: d, text: { en: "A firewall blocks DNS traffic on port 53 from DC5 to 192.168.20.10 and 192.168.20.11.", fr: "Un pare-feu bloque le trafic DNS sur le port 53 de DC5 vers 192.168.20.10 et 192.168.20.11." } }
    - { id: e, text: { en: "Dynamic forwarder reordering is enabled on DC5.", fr: "Le réordonnancement dynamique des redirecteurs est activé sur DC5." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A conditional forwarder that isn't stored in AD DS exists only on the server where it was created, so DC5 sends fabrikam.com queries to the ISP, which can't resolve them. If the forwarder did replicate to DC5, DC5 itself sends the queries to the Fabrikam servers, so a firewall that blocks port 53 from DC5 also prevents resolution while DC1 keeps working.
    fr: |
      Un redirecteur conditionnel qui n'est pas stocké dans AD DS n'existe que sur le serveur où il a été créé : DC5 envoie alors les requêtes pour fabrikam.com au FAI, qui ne peut pas les résoudre. Si le redirecteur a bien été répliqué vers DC5, c'est DC5 lui-même qui envoie les requêtes aux serveurs de Fabrikam : un pare-feu qui bloque le port 53 depuis DC5 empêche donc aussi la résolution, alors que DC1 continue de fonctionner.
  options:
    a: { en: "The Forest scope replicates the forwarder to DC5, which is a DNS server on a domain controller of the forest.", fr: "L'étendue Forest réplique le redirecteur vers DC5, qui est un serveur DNS sur un contrôleur de domaine de la forêt." }
    c: { en: "DC5 uses server-level forwarders, so root hints aren't the path that resolves its queries, and disabling them doesn't affect DC1's result.", fr: "DC5 utilise des redirecteurs de niveau serveur : les indications de racine ne sont pas le chemin qui résout ses requêtes, et les désactiver ne change rien au résultat de DC1." }
    e: { en: "Reordering only changes the order of the server-level forwarders; it doesn't prevent a conditional forwarder from working.", fr: "Le réordonnancement ne change que l'ordre des redirecteurs de niveau serveur ; il n'empêche pas un redirecteur conditionnel de fonctionner." }
references:
  - title: Add-DnsServerConditionalForwarderZone (DnsServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsserver/add-dnsserverconditionalforwarderzone
  - title: DNS Forwarding in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/forwarding
