id: az802-4b-reservation-failover-order
objective: "4.2.4"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Two DHCP servers named **DHCP1** and **DHCP2** share the scope 10.60.2.0/24 in a load balance failover relationship. The default gateway of the scope is 10.60.2.1.

    A label printer with the MAC address 3C-2A-F4-10-22-7B must always receive the address 10.60.2.40 and must use the default gateway 10.60.2.254. The other clients of the scope must keep their current gateway. Both DHCP servers must give the printer the same configuration.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Deux serveurs DHCP nommés **DHCP1** et **DHCP2** partagent l'étendue 10.60.2.0/24 dans une relation de basculement en mode équilibrage de charge. La passerelle par défaut de l'étendue est 10.60.2.1.

    Une imprimante d'étiquettes d'adresse MAC 3C-2A-F4-10-22-7B doit toujours recevoir l'adresse 10.60.2.40 et doit utiliser la passerelle par défaut 10.60.2.254. Les autres clients de l'étendue doivent conserver leur passerelle actuelle. Les deux serveurs DHCP doivent donner la même configuration à l'imprimante.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: resv
      text:
        en: "On DHCP1, run `Add-DhcpServerv4Reservation -ScopeId 10.60.2.0 -IPAddress 10.60.2.40 -ClientId 3C-2A-F4-10-22-7B`."
        fr: "Sur DHCP1, exécuter `Add-DhcpServerv4Reservation -ScopeId 10.60.2.0 -IPAddress 10.60.2.40 -ClientId 3C-2A-F4-10-22-7B`."
    - id: opt
      text:
        en: "On DHCP1, run `Set-DhcpServerv4OptionValue -ReservedIP 10.60.2.40 -Router 10.60.2.254`."
        fr: "Sur DHCP1, exécuter `Set-DhcpServerv4OptionValue -ReservedIP 10.60.2.40 -Router 10.60.2.254`."
    - id: rep1
      text:
        en: "On DHCP1, run `Invoke-DhcpServerv4FailoverReplication -ScopeId 10.60.2.0`."
        fr: "Sur DHCP1, exécuter `Invoke-DhcpServerv4FailoverReplication -ScopeId 10.60.2.0`."
    - id: rep2
      text:
        en: "On DHCP2, run `Invoke-DhcpServerv4FailoverReplication -ScopeId 10.60.2.0`."
        fr: "Sur DHCP2, exécuter `Invoke-DhcpServerv4FailoverReplication -ScopeId 10.60.2.0`."
    - id: scopeopt
      text:
        en: "On DHCP1, run `Set-DhcpServerv4OptionValue -ScopeId 10.60.2.0 -Router 10.60.2.254`."
        fr: "Sur DHCP1, exécuter `Set-DhcpServerv4OptionValue -ScopeId 10.60.2.0 -Router 10.60.2.254`."
    - id: excl
      text:
        en: "On DHCP1, run `Add-DhcpServerv4ExclusionRange -ScopeId 10.60.2.0 -StartRange 10.60.2.40 -EndRange 10.60.2.40`."
        fr: "Sur DHCP1, exécuter `Add-DhcpServerv4ExclusionRange -ScopeId 10.60.2.0 -StartRange 10.60.2.40 -EndRange 10.60.2.40`."
answer:
  sequence: [resv, opt, rep1]
explanation:
  correct:
    en: |
      You first create the reservation, because a reservation-level option (`-ReservedIP`) applies to an existing reservation. The reservation-level router option then gives the printer its own gateway without changing the scope gateway of the other clients. Changes to a failover-enabled scope aren't replicated automatically, so you finish by replicating the scope from DHCP1, the server that holds the new settings.
    fr: |
      Vous créez d'abord la réservation, car une option au niveau de la réservation (`-ReservedIP`) s'applique à une réservation existante. L'option Routeur au niveau de la réservation donne ensuite à l'imprimante sa propre passerelle sans changer la passerelle de l'étendue pour les autres clients. Les modifications d'une étendue en basculement ne sont pas répliquées automatiquement : vous terminez en répliquant l'étendue depuis DHCP1, le serveur qui détient les nouveaux paramètres.
  options:
    rep2: { en: "Replication overwrites the partner's settings with those of the server where it starts; starting on DHCP2 would remove the new reservation from DHCP1.", fr: "La réplication écrase les paramètres du partenaire avec ceux du serveur où elle démarre ; la lancer sur DHCP2 supprimerait la nouvelle réservation de DHCP1." }
    scopeopt: { en: "A scope-level router option would change the gateway of every client of the scope.", fr: "Une option Routeur au niveau de l'étendue changerait la passerelle de tous les clients de l'étendue." }
    excl: { en: "An exclusion isn't needed: a reserved address is leased only to the client that has the matching client ID.", fr: "Une exclusion n'est pas nécessaire : une adresse réservée n'est attribuée qu'au client dont l'identificateur correspond." }
references:
  - title: Replicate DHCP failover in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/replicate-dhcp-failover
  - title: Set-DhcpServerv4OptionValue (DhcpServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/set-dhcpserverv4optionvalue
