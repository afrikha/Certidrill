id: az802-4a-hybrid-dns-facts
objective: "4.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Your on-premises network contains a DNS server named DNS1 and is connected to an Azure virtual network named VNet1 by a site-to-site VPN. VNet1 contains the following resources:

    | Name | DNS configuration |
    | --- | --- |
    | VNet1 | Custom DNS servers 10.20.1.4 and 10.20.1.5 |
    | Network interface of VM1 | Custom DNS server 10.20.1.9 |
    | Network interface of VM2 | Inherit from virtual network |

    A private DNS zone named azure.contoso.com is linked to VNet1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau local contient un serveur DNS nommé DNS1 et est connecté à un réseau virtuel Azure nommé VNet1 par un VPN site à site. VNet1 contient les ressources suivantes :

    | Nom | Configuration DNS |
    | --- | --- |
    | VNet1 | Serveurs DNS personnalisés 10.20.1.4 et 10.20.1.5 |
    | Interface réseau de VM1 | Serveur DNS personnalisé 10.20.1.9 |
    | Interface réseau de VM2 | Hériter du réseau virtuel |

    Une zone DNS privée nommée azure.contoso.com est liée à VNet1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: DNS1 can resolve azure.contoso.com by using a conditional forwarder that targets 168.63.129.16 through the VPN.
        fr: DNS1 peut résoudre azure.contoso.com avec un redirecteur conditionnel qui cible 168.63.129.16 à travers le VPN.
    - id: s2
      text:
        en: VM1 sends its DNS queries to 10.20.1.9.
        fr: VM1 envoie ses requêtes DNS à 10.20.1.9.
    - id: s3
      text:
        en: If you change the DNS servers of VNet1, VM2 uses the new servers after its DHCP lease is renewed, for example by running ipconfig /renew.
        fr: Si vous modifiez les serveurs DNS de VNet1, VM2 utilise les nouveaux serveurs après le renouvellement de son bail DHCP, par exemple avec ipconfig /renew.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      168.63.129.16 answers only queries that come from inside Azure, so an on-premises server must forward to a DNS proxy or a Private Resolver inbound endpoint in the virtual network instead. DNS servers set on a network interface take precedence over those of the virtual network. After a DNS change on the virtual network, a VM picks up the new servers when its DHCP lease is renewed.
    fr: |
      168.63.129.16 ne répond qu'aux requêtes émises depuis Azure : un serveur local doit plutôt transférer vers un proxy DNS ou un point de terminaison entrant de Private Resolver dans le réseau virtuel. Les serveurs DNS définis sur une interface réseau sont prioritaires sur ceux du réseau virtuel. Après une modification DNS sur le réseau virtuel, une machine virtuelle prend en compte les nouveaux serveurs au renouvellement de son bail DHCP.
references:
  - title: Azure Virtual Network Name Resolution Guide
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-name-resolution-for-vms-and-role-instances
  - title: Azure DNS Private Resolver Overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
