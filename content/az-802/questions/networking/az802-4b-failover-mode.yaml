id: az802-4b-failover-mode
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Two DHCP servers named **DHCP1** and **DHCP2** run Windows Server 2025 in the same datacenter. You need to configure high availability for the IPv4 scope 10.20.0.0/22 to meet the following requirements:

    - Both servers lease addresses to the clients at the same time.
    - If one server is unavailable, the other server renews the leases that the first server granted.

    What should you configure?
  fr: |
    Deux serveurs DHCP nommés **DHCP1** et **DHCP2** exécutent Windows Server 2025 dans le même centre de données. Vous devez configurer la haute disponibilité de l'étendue IPv4 10.20.0.0/22 pour répondre aux exigences suivantes :

    - Les deux serveurs attribuent des adresses aux clients en même temps.
    - Si un serveur est indisponible, l'autre serveur renouvelle les baux que le premier a accordés.

    Que devez-vous configurer ?
body:
  options:
    - { id: lb, text: { en: "A DHCP failover relationship in load balance mode", fr: "Une relation de basculement DHCP en mode équilibrage de charge" } }
    - { id: hs, text: { en: "A DHCP failover relationship in hot standby mode", fr: "Une relation de basculement DHCP en mode de secours à chaud" } }
    - { id: split, text: { en: "A split scope, with 80 percent of the range on DHCP1 and 20 percent on DHCP2", fr: "Une étendue fractionnée, avec 80 % de la plage sur DHCP1 et 20 % sur DHCP2" } }
    - { id: super, text: { en: "A superscope that contains the scope on both servers", fr: "Une superétendue qui contient l'étendue sur les deux serveurs" } }
answer: { optionId: lb }
explanation:
  correct:
    en: |
      In load balance mode, the default failover mode, both partners serve the same scope at the same time and split the clients by a hash of their MAC address. Both servers hold the lease database, so a partner can renew the leases granted by the other one. Microsoft recommends this mode when both servers are at the same site.
    fr: |
      En mode équilibrage de charge, le mode de basculement par défaut, les deux partenaires servent la même étendue en même temps et se répartissent les clients selon un hachage de leur adresse MAC. Les deux serveurs détiennent la base des baux : un partenaire peut renouveler les baux accordés par l'autre. Microsoft recommande ce mode quand les deux serveurs sont sur le même site.
  options:
    hs: { en: "In hot standby mode, only the active server leases addresses while it is available; the standby server answers only when the active server is down.", fr: "En mode de secours à chaud, seul le serveur actif attribue des adresses tant qu'il est disponible ; le serveur de secours ne répond qu'en cas de panne du serveur actif." }
    split: { en: "In a split scope, each server knows only its own leases and its own part of the range, so it can't renew the leases of the other server.", fr: "Dans une étendue fractionnée, chaque serveur ne connaît que ses propres baux et sa partie de la plage : il ne peut pas renouveler les baux de l'autre serveur." }
    super: { en: "A superscope groups scopes of one server for several logical subnets; it doesn't share leases between servers.", fr: "Une superétendue regroupe des étendues d'un serveur pour plusieurs sous-réseaux logiques ; elle ne partage pas de baux entre serveurs." }
references:
  - title: DHCP failover in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-failover
