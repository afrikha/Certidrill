id: az802-4a-dnssec-sign-nrpt
objective: "4.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A DNS server named DNS1 hosts the unsigned primary zone secure.contoso.com. The trust anchors of the zone will be distributed to the recursive DNS servers of the clients before the rule is applied.

    You need to sign the zone with the default DNSSEC settings. You then need to add to a Group Policy object named DNSSEC Clients a rule that makes the clients accept only validated answers for secure.contoso.com.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur DNS nommé DNS1 héberge la zone principale non signée secure.contoso.com. Les ancres d'approbation de la zone seront distribuées aux serveurs DNS récursifs des clients avant l'application de la règle.

    Vous devez signer la zone avec les paramètres DNSSEC par défaut. Vous devez ensuite ajouter à un objet de stratégie de groupe nommé DNSSEC Clients une règle qui fait accepter aux clients uniquement des réponses validées pour secure.contoso.com.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Invoke-DnsServerZoneSign -ZoneName "secure.contoso.com" -[[sign]] -Force
    Add-DnsClientNrptRule -GpoName "DNSSEC Clients" -Namespace ".secure.contoso.com" -[[enable]] -[[require]]
  slots:
    - id: sign
      options:
        - { id: default, text: SignWithDefault }
        - { id: resign, text: DoResign }
        - { id: seize, text: SeizeRole }
    - id: enable
      options:
        - { id: dnssec, text: DnsSecEnable }
        - { id: da, text: DAEnable }
        - { id: passthru, text: PassThru }
    - id: require
      options:
        - { id: valid, text: DnsSecValidationRequired }
        - { id: ipsec, text: DnsSecIPsecRequired }
        - { id: daipsec, text: DAIPsecRequired }
answer:
  values: { sign: default, enable: dnssec, require: valid }
explanation:
  correct:
    en: |
      -SignWithDefault signs an unsigned zone with one KSK and one ZSK and the default DNSSEC settings. In the NRPT rule, -DnsSecEnable turns on DNSSEC for the namespace and -DnsSecValidationRequired makes the client reject any answer that the DNS server didn't validate.
    fr: |
      -SignWithDefault signe une zone non signée avec une KSK, une ZSK et les paramètres DNSSEC par défaut. Dans la règle NRPT, -DnsSecEnable active DNSSEC pour l'espace de noms et -DnsSecValidationRequired fait rejeter par le client toute réponse que le serveur DNS n'a pas validée.
  options:
    resign: { en: "-DoResign re-signs a zone that is already signed.", fr: "-DoResign signe à nouveau une zone déjà signée." }
    seize: { en: "-SeizeRole is a parameter of Reset-DnsServerZoneKeyMasterRole.", fr: "-SeizeRole est un paramètre de Reset-DnsServerZoneKeyMasterRole." }
    da: { en: "-DAEnable configures the rule for DirectAccess.", fr: "-DAEnable configure la règle pour DirectAccess." }
    ipsec: { en: "-DnsSecIPsecRequired requires an IPsec connection to the DNS server; it doesn't require validation of the answers.", fr: "-DnsSecIPsecRequired exige une connexion IPsec vers le serveur DNS ; il n'exige pas la validation des réponses." }
    daipsec: { en: "-DAIPsecRequired applies to DirectAccess.", fr: "-DAIPsecRequired s'applique à DirectAccess." }
references:
  - title: Invoke-DnsServerZoneSign (DnsServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsserver/invoke-dnsserverzonesign
  - title: Add-DnsClientNrptRule (DnsClient)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsclient/add-dnsclientnrptrule
