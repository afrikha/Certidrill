id: az802-cs3a-dns-policy
objective: "4.1.5"
type: dropdown
caseStudy: az802-cs3a-bellows-college
difficulty: 2
status: draft
stem:
  en: |
    You need to configure DNS1 to meet the name resolution requirement. How should you complete the PowerShell script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer DNS1 pour satisfaire l'exigence de résolution de noms. Comment devez-vous compléter le script PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Add-DnsServerClientSubnet -Name "LabNet" -IPv4Subnet "10.60.20.0/24"
    [[cmdlet]] -ZoneName "bellowscollege.com" -Name "LabScope"
    Add-DnsServerResourceRecord -ZoneName "bellowscollege.com" -A -Name "portal" `
        -IPv4Address "10.60.20.80" -ZoneScope "LabScope"
    Add-DnsServerQueryResolutionPolicy -Name "LabPolicy" -Action ALLOW `
        -[[criterion]] "EQ,LabNet" -Fqdn "EQ,portal.bellowscollege.com" `
        -ZoneScope [[scope]] -ZoneName "bellowscollege.com"
  slots:
    - id: cmdlet
      options:
        - { id: zonescope, text: "Add-DnsServerZoneScope" }
        - { id: recscope, text: "Add-DnsServerRecursionScope" }
        - { id: zone, text: "Add-DnsServerPrimaryZone" }
    - id: criterion
      options:
        - { id: serverif, text: "ServerInterfaceIP" }
        - { id: clientsubnet, text: "ClientSubnet" }
        - { id: timeofday, text: "TimeOfDay" }
    - id: scope
      options:
        - { id: labnet, text: "\"LabNet,1\"" }
        - { id: default, text: "\"bellowscollege.com,1\"" }
        - { id: labscope, text: "\"LabScope,1\"" }
answer:
  values: { cmdlet: zonescope, criterion: clientsubnet, scope: labscope }
explanation:
  correct:
    en: |
      A zone scope is a separate copy of the zone that holds the lab version of the portal record, created with Add-DnsServerZoneScope. The query resolution policy matches the client subnet object LabNet with the ClientSubnet criterion, limits itself to the portal name with the Fqdn criterion, and answers from the LabScope zone scope (weight 1); clients outside LabNet keep getting the record of the default scope.
    fr: |
      Une étendue de zone est une copie distincte de la zone qui contient la version laboratoire de l'enregistrement portal ; elle est créée avec Add-DnsServerZoneScope. La stratégie de résolution de requêtes reconnaît l'objet de sous-réseau client LabNet grâce au critère ClientSubnet, se limite au nom portal grâce au critère Fqdn, et répond à partir de l'étendue de zone LabScope (poids 1) ; les clients hors de LabNet continuent de recevoir l'enregistrement de l'étendue par défaut.
  options:
    recscope:
      en: |
        A recursion scope controls recursion and forwarders for queries the server is not authoritative for; it cannot hold zone records.
      fr: |
        Une étendue de récursivité contrôle la récursivité et les redirecteurs pour les requêtes dont le serveur n'a pas l'autorité ; elle ne peut pas contenir d'enregistrements de zone.
    serverif:
      en: |
        ServerInterfaceIP matches the DNS server interface that receives the query, not the subnet of the client.
      fr: |
        ServerInterfaceIP identifie l'interface du serveur DNS qui reçoit la requête, pas le sous-réseau du client.
    labnet:
      en: |
        LabNet is the client subnet object used in the criterion; the ZoneScope parameter expects the name of a zone scope.
      fr: |
        LabNet est l'objet de sous-réseau client utilisé dans le critère ; le paramètre ZoneScope attend le nom d'une étendue de zone.
references:
  - title: Add-DnsServerQueryResolutionPolicy (DnsServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsserver/add-dnsserverqueryresolutionpolicy
  - title: Use DNS Policy for Split-Brain DNS Deployment
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/deploy/split-brain-dns-deployment
