id: az802-4a-aging-eligibility
objective: "4.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A DNS server named DNS1 hosts a primary zone named contoso.com. Scavenging is enabled on DNS1 and runs every day. Aging was enabled on the zone three months ago with these settings:

    | Setting | Value |
    | --- | --- |
    | No-refresh interval | 7 days |
    | Refresh interval | 7 days |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur DNS nommé DNS1 héberge une zone principale nommée contoso.com. Le nettoyage est activé sur DNS1 et s'exécute chaque jour. Le vieillissement a été activé sur la zone il y a trois mois avec les paramètres suivants :

    | Paramètre | Valeur |
    | --- | --- |
    | Intervalle sans actualisation | 7 jours |
    | Intervalle d'actualisation | 7 jours |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An A record that an administrator created manually 30 days ago is removed at the next scavenging cycle.
        fr: Un enregistrement A créé manuellement par un administrateur il y a 30 jours est supprimé au prochain cycle de nettoyage.
    - id: s2
      text:
        en: A dynamically registered record whose timestamp was last updated 10 days ago is removed at the next scavenging cycle.
        fr: Un enregistrement inscrit dynamiquement dont l'horodatage a été mis à jour pour la dernière fois il y a 10 jours est supprimé au prochain cycle de nettoyage.
    - id: s3
      text:
        en: A dynamically registered record whose timestamp was last updated 15 days ago is removed at the next scavenging cycle.
        fr: Un enregistrement inscrit dynamiquement dont l'horodatage a été mis à jour pour la dernière fois il y a 15 jours est supprimé au prochain cycle de nettoyage.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      A record is stale when its timestamp plus the no-refresh interval plus the refresh interval is earlier than the current time, here 14 days. A record created manually has a timestamp of zero and is never scavenged. A record refreshed 10 days ago isn't stale yet, while one refreshed 15 days ago is stale and is deleted by the next scavenging cycle.
    fr: |
      Un enregistrement est obsolète lorsque son horodatage augmenté de l'intervalle sans actualisation et de l'intervalle d'actualisation est antérieur à l'heure actuelle, soit ici 14 jours. Un enregistrement créé manuellement a un horodatage nul et n'est jamais nettoyé. Un enregistrement actualisé il y a 10 jours n'est pas encore obsolète, alors qu'un enregistrement actualisé il y a 15 jours l'est et sera supprimé au prochain cycle de nettoyage.
references:
  - title: DNS aging and scavenging in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/aging-scavenging
  - title: Set-DnsServerZoneAging (DnsServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsserver/set-dnsserverzoneaging
