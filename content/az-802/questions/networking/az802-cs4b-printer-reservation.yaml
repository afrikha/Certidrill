id: az802-cs4b-printer-reservation
objective: "4.2.4"
type: dropdown
caseStudy: az802-cs4b-lucerne-publishing
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the IP addressing requirement for PRN-LON1.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence d'adressage IP concernant PRN-LON1.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    [[cmd]] -ComputerName "LON-DHCP1" `
        -ScopeId [[scope]] `
        -IPAddress 10.30.0.50 `
        -ClientId [[client]] `
        -Name "PRN-LON1"
  slots:
    - id: cmd
      options:
        - { id: lease, text: Add-DhcpServerv4Lease }
        - { id: resv, text: Add-DhcpServerv4Reservation }
        - { id: policy, text: Add-DhcpServerv4Policy }
    - id: scope
      options:
        - { id: start, text: 10.30.0.20 }
        - { id: gw, text: 10.30.0.1 }
        - { id: net, text: 10.30.0.0 }
    - id: client
      options:
        - { id: mac, text: '"00-15-5D-0A-1B-2C"' }
        - { id: fqdn, text: '"PRN-LON1.eu.lucernepublishing.com"' }
        - { id: ip, text: '"10.30.0.50"' }
answer:
  values: { cmd: resv, scope: net, client: mac }
explanation:
  correct:
    en: |
      `Add-DhcpServerv4Reservation` reserves an IPv4 address in a scope for one client, so that the address is leased only to the client that has the specified client ID. The scope ID is the network address of the scope, here 10.30.0.0. For Windows DHCP, the client ID is the MAC address of the client; the `-Name` parameter only labels the reservation.
    fr: |
      `Add-DhcpServerv4Reservation` réserve une adresse IPv4 d'une étendue pour un client, afin que l'adresse ne soit attribuée qu'au client qui possède l'ID client indiqué. L'ID de l'étendue est l'adresse réseau de l'étendue, ici 10.30.0.0. Pour le DHCP Windows, l'ID client est l'adresse MAC du client ; le paramètre `-Name` ne fait que nommer la réservation.
  options:
    lease: { en: "A lease is temporary; only a reservation guarantees that the printer always receives the same address.", fr: "Un bail est temporaire ; seule une réservation garantit que l'imprimante reçoit toujours la même adresse." }
    policy: { en: "A DHCP policy assigns settings to groups of clients that match conditions; it is not the cmdlet that reserves one address for one client.", fr: "Une stratégie DHCP attribue des paramètres à des groupes de clients qui remplissent des conditions ; ce n'est pas l'applet de commande qui réserve une adresse pour un client." }
    start: { en: "10.30.0.20 is the first address of the range, not the ID of the scope.", fr: "10.30.0.20 est la première adresse de la plage, pas l'ID de l'étendue." }
    gw: { en: "10.30.0.1 is a host address, not the network address that identifies the scope.", fr: "10.30.0.1 est une adresse d'hôte, pas l'adresse réseau qui identifie l'étendue." }
    fqdn: { en: "The DNS name is not the client ID; the client is identified by its MAC address.", fr: "Le nom DNS n'est pas l'ID client ; le client est identifié par son adresse MAC." }
    ip: { en: "The reserved IP address goes in -IPAddress; the client ID identifies the client, not the address.", fr: "L'adresse IP réservée se place dans -IPAddress ; l'ID client identifie le client, pas l'adresse." }
references:
  - title: Add-DhcpServerv4Reservation (DhcpServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/add-dhcpserverv4reservation
