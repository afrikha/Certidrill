id: az802-4a-dhcp-dns-credentials
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Your network contains an AD DS domain named contoso.com. The contoso.com zone is Active Directory-integrated and allows only secure dynamic updates.

    A domain controller named DC1 runs the DHCP Server role and registers the A and PTR records of the DHCP clients in DNS. You plan to deploy a member server named DHCP2 and to configure DHCP failover between DC1 and DHCP2.

    You need to ensure that each DHCP server can update the records registered by the other server. The solution must keep the zone limited to secure dynamic updates and must prevent the DHCP Server service on DC1 from using the privileges of the domain controller.

    What should you do?
  fr: |
    Votre réseau contient un domaine AD DS nommé contoso.com. La zone contoso.com est intégrée à Active Directory et n'autorise que les mises à jour dynamiques sécurisées.

    Un contrôleur de domaine nommé DC1 exécute le rôle Serveur DHCP et inscrit dans le DNS les enregistrements A et PTR des clients DHCP. Vous prévoyez de déployer un serveur membre nommé DHCP2 et de configurer le basculement DHCP entre DC1 et DHCP2.

    Vous devez faire en sorte que chaque serveur DHCP puisse mettre à jour les enregistrements inscrits par l'autre serveur. La solution doit conserver une zone limitée aux mises à jour dynamiques sécurisées et doit empêcher le service Serveur DHCP de DC1 d'utiliser les privilèges du contrôleur de domaine.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the computer accounts of DC1 and DHCP2 to the DnsUpdateProxy group.", fr: "Ajouter les comptes d'ordinateur de DC1 et de DHCP2 au groupe DnsUpdateProxy." } }
    - { id: b, text: { en: "Configure both DHCP servers to use one dedicated user account for DNS dynamic updates.", fr: "Configurer les deux serveurs DHCP pour qu'ils utilisent un même compte d'utilisateur dédié aux mises à jour DNS." } }
    - { id: c, text: { en: "Set the dynamic updates setting of the contoso.com zone to Nonsecure and secure.", fr: "Définir le paramètre de mises à jour dynamiques de la zone contoso.com sur Nonsecure and secure." } }
    - { id: d, text: { en: "Configure the DHCP clients to run ipconfig /registerdns at each startup.", fr: "Configurer les clients DHCP pour qu'ils exécutent ipconfig /registerdns à chaque démarrage." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In a secure-only zone, the account that registers a record becomes its owner. When both DHCP servers use the same dedicated user account for dynamic updates, each can update the records registered by the other, and the DHCP service on DC1 no longer registers with the domain controller's computer account. The credentials are set in the DHCP console or with netsh dhcp server set dnscredentials.
    fr: |
      Dans une zone qui n'accepte que les mises à jour sécurisées, le compte qui inscrit un enregistrement en devient le propriétaire. Si les deux serveurs DHCP utilisent le même compte d'utilisateur dédié pour les mises à jour dynamiques, chacun peut mettre à jour les enregistrements inscrits par l'autre, et le service DHCP de DC1 n'inscrit plus les enregistrements avec le compte d'ordinateur du contrôleur de domaine. Les informations d'identification se définissent dans la console DHCP ou avec netsh dhcp server set dnscredentials.
  options:
    a: { en: "Records created by members of DnsUpdateProxy aren't secured, which Microsoft advises against in a zone that allows only secure updates; DC1 would also keep using its domain controller account.", fr: "Les enregistrements créés par les membres de DnsUpdateProxy ne sont pas sécurisés, ce que Microsoft déconseille dans une zone qui n'autorise que les mises à jour sécurisées ; DC1 continuerait aussi à utiliser son compte de contrôleur de domaine." }
    c: { en: "Allowing nonsecure updates breaks the requirement to keep the zone limited to secure dynamic updates.", fr: "Autoriser les mises à jour non sécurisées enfreint l'exigence de conserver une zone limitée aux mises à jour dynamiques sécurisées." }
    d: { en: "The client registers its own A record directly, bypassing the DHCP server; this changes nothing for the PTR records and for the ownership problem between the two DHCP servers.", fr: "Le client inscrit directement son propre enregistrement A en contournant le serveur DHCP ; cela ne change rien pour les enregistrements PTR ni pour le problème de propriété entre les deux serveurs DHCP." }
references:
  - title: Dynamic DNS Update in Windows and Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/dynamic-update
