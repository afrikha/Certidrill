id: az802-sr2-dns-subnet-policy-1
objective: "4.1.5"
type: series_yesno
series: az802-sr2-dns-subnet-policy
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: |
    You create a client subnet, a zone scope, a recursion scope and a recursion policy for the Branch1 subnet.
  fr: |
    Vous créez un sous-réseau client, une étendue de zone, une étendue de récursivité et une stratégie de récursivité pour le sous-réseau de Branch1.
body:
  solution:
    en: |
      You run the following commands on DNS1:

      ```powershell
      Add-DnsServerClientSubnet -Name "Branch1Subnet" -IPv4Subnet "10.20.0.0/16"
      Add-DnsServerZoneScope -ZoneName "contoso.com" -Name "Branch1Scope"
      Add-DnsServerResourceRecord -ZoneName "contoso.com" -A -Name "app" -IPv4Address "10.20.5.10" -ZoneScope "Branch1Scope"
      Add-DnsServerRecursionScope -Name "Branch1Recursion" -EnableRecursion $True
      Add-DnsServerQueryResolutionPolicy -Name "Branch1Policy" -Action ALLOW -ApplyOnRecursion -RecursionScope "Branch1Recursion" -ClientSubnet "EQ,Branch1Subnet" -Fqdn "EQ,app.contoso.com" -Condition AND
      ```
    fr: |
      Vous exécutez les commandes suivantes sur DNS1 :

      ```powershell
      Add-DnsServerClientSubnet -Name "Branch1Subnet" -IPv4Subnet "10.20.0.0/16"
      Add-DnsServerZoneScope -ZoneName "contoso.com" -Name "Branch1Scope"
      Add-DnsServerResourceRecord -ZoneName "contoso.com" -A -Name "app" -IPv4Address "10.20.5.10" -ZoneScope "Branch1Scope"
      Add-DnsServerRecursionScope -Name "Branch1Recursion" -EnableRecursion $True
      Add-DnsServerQueryResolutionPolicy -Name "Branch1Policy" -Action ALLOW -ApplyOnRecursion -RecursionScope "Branch1Recursion" -ClientSubnet "EQ,Branch1Subnet" -Fqdn "EQ,app.contoso.com" -Condition AND
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      A recursion policy is a server-level policy that applies only when query processing reaches the recursion path, and it selects recursion settings, not a zone scope. DNS1 is authoritative for contoso.com, so queries for app.contoso.com are answered from the zone without recursion. No zone-level policy references Branch1Scope, so every client still receives 10.10.5.10 from the default zone scope.
    fr: |
      Une stratégie de récursivité est une stratégie au niveau du serveur qui ne s'applique que lorsque le traitement de la requête atteint le chemin de récursivité, et elle sélectionne des paramètres de récursivité, pas une étendue de zone. DNS1 fait autorité pour contoso.com : les requêtes pour app.contoso.com reçoivent une réponse de la zone, sans récursivité. Aucune stratégie au niveau de la zone ne référence Branch1Scope : tous les clients reçoivent toujours 10.10.5.10 de l'étendue de zone par défaut.
references:
  - title: DNS Policies Overview
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/deploy/dns-policies-overview
