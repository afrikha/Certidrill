id: az802-4a-reverse-zone-name
objective: "4.1.2"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    On a domain controller named DC1, you run the following command:

    `Add-DnsServerPrimaryZone -NetworkID "10.1.0.0/24" -ReplicationScope "Forest"`

    Which zone does the command create?
  fr: |
    Sur un contrôleur de domaine nommé DC1, vous exécutez la commande suivante :

    `Add-DnsServerPrimaryZone -NetworkID "10.1.0.0/24" -ReplicationScope "Forest"`

    Quelle zone la commande crée-t-elle ?
body:
  options:
    - { id: a, text: 10.1.0.in-addr.arpa }
    - { id: b, text: 0.1.10.in-addr.arpa }
    - { id: c, text: 10.1.0.0.in-addr.arpa }
    - { id: d, text: 0.1.10.ip6.arpa }
answer: { optionId: b }
explanation:
  correct:
    en: |
      -NetworkID creates a reverse lookup zone. IPv4 reverse zones live under in-addr.arpa with the octets of the network in reverse order, so 10.1.0.0/24 becomes 0.1.10.in-addr.arpa. The zone is Active Directory-integrated and replicates to the DNS servers on all domain controllers of the forest.
    fr: |
      -NetworkID crée une zone de recherche inversée. Les zones inversées IPv4 se trouvent sous in-addr.arpa, avec les octets du réseau dans l'ordre inverse : 10.1.0.0/24 devient 0.1.10.in-addr.arpa. La zone est intégrée à Active Directory et répliquée vers les serveurs DNS de tous les contrôleurs de domaine de la forêt.
  options:
    a: { en: "The octets must be reversed in an in-addr.arpa name.", fr: "Les octets doivent être inversés dans un nom in-addr.arpa." }
    c: { en: "A /24 zone uses the three network octets, reversed; the host octet isn't part of the zone name.", fr: "Une zone /24 utilise les trois octets du réseau, inversés ; l'octet d'hôte ne fait pas partie du nom de la zone." }
    d: { en: "ip6.arpa is the reverse namespace for IPv6 addresses.", fr: "ip6.arpa est l'espace de noms inversé des adresses IPv6." }
references:
  - title: DNS zones in DNS Server on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/zone-types
  - title: Manage DNS zones using DNS server in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/manage-dns-zones
