id: az802-4a-replication-scopes
objective: "4.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an AD DS forest with several domains. You create four Active Directory-integrated zones on a domain controller and must set the replication scope of each zone by using the -ReplicationScope parameter of Add-DnsServerPrimaryZone.

    Which replication scope should you use for each zone? To answer, drag the appropriate values to the correct zones. Each value may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient une forêt AD DS composée de plusieurs domaines. Vous créez quatre zones intégrées à Active Directory sur un contrôleur de domaine et devez définir l'étendue de réplication de chaque zone avec le paramètre -ReplicationScope d'Add-DnsServerPrimaryZone.

    Quelle étendue de réplication devez-vous utiliser pour chaque zone ? Pour répondre, faites glisser les valeurs appropriées vers les zones correspondantes. Chaque valeur peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: forest, text: Forest }
    - { id: domain, text: Domain }
    - { id: legacy, text: Legacy }
    - { id: custom, text: Custom }
  targets:
    - id: z1
      text: { en: "Zone 1: the DNS servers on all domain controllers of every domain in the forest", fr: "Zone 1 : les serveurs DNS de tous les contrôleurs de domaine de chaque domaine de la forêt" }
    - id: z2
      text: { en: "Zone 2: only the DNS servers on the domain controllers of the local domain", fr: "Zone 2 : uniquement les serveurs DNS des contrôleurs de domaine du domaine local" }
    - id: z3
      text: { en: "Zone 3: all domain controllers of the local domain, including those that don't run the DNS Server role", fr: "Zone 3 : tous les contrôleurs de domaine du domaine local, y compris ceux qui n'exécutent pas le rôle Serveur DNS" }
    - id: z4
      text: { en: "Zone 4: only the DNS servers enlisted in a directory partition that you created", fr: "Zone 4 : uniquement les serveurs DNS inscrits dans une partition d'annuaire que vous avez créée" }
answer:
  mapping: { z1: forest, z2: domain, z3: legacy, z4: custom }
explanation:
  correct:
    en: |
      Forest replicates to all DNS servers on domain controllers in the forest and Domain to all DNS servers on domain controllers in the domain. Legacy stores the zone in the domain partition, so it reaches all domain controllers of the domain, whether or not they run DNS. Custom replicates to the DNS servers enlisted in the application directory partition named by -DirectoryPartitionName.
    fr: |
      Forest réplique vers tous les serveurs DNS des contrôleurs de domaine de la forêt et Domain vers tous les serveurs DNS des contrôleurs de domaine du domaine. Legacy stocke la zone dans la partition de domaine : elle atteint tous les contrôleurs de domaine du domaine, qu'ils exécutent DNS ou non. Custom réplique vers les serveurs DNS inscrits dans la partition d'annuaire d'application indiquée par -DirectoryPartitionName.
references:
  - title: Add-DnsServerConditionalForwarderZone (DnsServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsserver/add-dnsserverconditionalforwarderzone
  - title: Manage DNS zones using DNS server in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/manage-dns-zones
