id: az802-4b-superscope
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A DHCP server named **DHCP1** has an active scope for 10.40.1.0/24 that serves one floor of an office building. The scope has no free address left.

    The network team adds a second logical subnet, 10.40.2.0/24, to the same physical network. The router interface of the floor now has the addresses 10.40.1.1 and 10.40.2.1 and relays DHCP requests to DHCP1.

    You need DHCP1 to lease addresses from 10.40.2.0/24 to the new clients of the floor. The existing clients must keep their addresses in 10.40.1.0/24.

    What should you do?
  fr: |
    Un serveur DHCP nommé **DHCP1** dispose d'une étendue active pour 10.40.1.0/24 qui dessert un étage d'un immeuble de bureaux. L'étendue n'a plus d'adresse libre.

    L'équipe réseau ajoute un second sous-réseau logique, 10.40.2.0/24, sur le même réseau physique. L'interface du routeur de l'étage possède maintenant les adresses 10.40.1.1 et 10.40.2.1 et relaie les demandes DHCP vers DHCP1.

    DHCP1 doit attribuer des adresses de 10.40.2.0/24 aux nouveaux clients de l'étage. Les clients existants doivent conserver leurs adresses dans 10.40.1.0/24.

    Que devez-vous faire ?
body:
  options:
    - { id: super, text: { en: "Create a scope for 10.40.2.0/24, and then group it with the 10.40.1.0/24 scope in a superscope.", fr: "Créer une étendue pour 10.40.2.0/24, puis la regrouper avec l'étendue 10.40.1.0/24 dans une superétendue." } }
    - { id: scope, text: { en: "Create a scope for 10.40.2.0/24, and then activate the new scope.", fr: "Créer une étendue pour 10.40.2.0/24, puis activer la nouvelle étendue." } }
    - { id: mask, text: { en: "Change the subnet mask of the 10.40.1.0/24 scope to 255.255.254.0 by running Set-DhcpServerv4Scope.", fr: "Changer le masque de sous-réseau de l'étendue 10.40.1.0/24 en 255.255.254.0 avec Set-DhcpServerv4Scope." } }
    - { id: mcast, text: { en: "Create a multicast scope for 10.40.2.0/24, and then activate the new scope.", fr: "Créer une étendue multidiffusion pour 10.40.2.0/24, puis activer la nouvelle étendue." } }
answer: { optionId: super }
explanation:
  correct:
    en: |
      When several logical subnets share one physical network, a superscope lets the DHCP server lease addresses from all the scopes it groups to the clients of that network. Without the superscope, DHCP1 keeps answering the requests relayed for this floor from the full 10.40.1.0/24 scope only. The existing leases stay in 10.40.1.0/24, and new clients receive addresses from 10.40.2.0/24.
    fr: |
      Quand plusieurs sous-réseaux logiques partagent un même réseau physique, une superétendue permet au serveur DHCP d'attribuer aux clients de ce réseau des adresses de toutes les étendues qu'elle regroupe. Sans superétendue, DHCP1 continue de répondre aux demandes relayées pour cet étage avec la seule étendue 10.40.1.0/24, qui est pleine. Les baux existants restent dans 10.40.1.0/24 et les nouveaux clients reçoivent des adresses de 10.40.2.0/24.
  options:
    scope: { en: "A separate scope alone isn't used for the requests of this physical network; it must be grouped with the existing scope in a superscope.", fr: "Une étendue séparée seule n'est pas utilisée pour les demandes de ce réseau physique ; elle doit être regroupée avec l'étendue existante dans une superétendue." }
    mask: { en: "Set-DhcpServerv4Scope can't change the subnet mask of a scope, and 10.40.1.0 isn't the network address of a /23 subnet.", fr: "Set-DhcpServerv4Scope ne peut pas changer le masque de sous-réseau d'une étendue, et 10.40.1.0 n'est pas l'adresse réseau d'un sous-réseau /23." }
    mcast: { en: "A multicast scope distributes multicast (class D) addresses with MADCAP; it doesn't lease unicast addresses to clients.", fr: "Une étendue multidiffusion distribue des adresses de multidiffusion (classe D) avec MADCAP ; elle n'attribue pas d'adresses unicast aux clients." }
references:
  - title: DHCP scopes in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-scopes
