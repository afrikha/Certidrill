id: az802-4a-dnssec-trust-anchor
objective: "4.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Your network contains the following DNS servers that run Windows Server 2025. None of them is a domain controller.

    | Name | Configuration |
    | --- | --- |
    | DNS1 | Hosts the file-backed primary zone secure.contoso.com, which you just signed |
    | DNS2 | Recursive DNS server used by the clients; hosts no copy of secure.contoso.com |

    The parent zone contoso.com isn't signed. A Group Policy object deploys to the clients a Name Resolution Policy Table (NRPT) rule for .secure.contoso.com that enables DNSSEC and requires validation. On a client, `Resolve-DnsName finance.secure.contoso.com` fails with the error "Unsecured DNS packet".

    You need clients to resolve names in secure.contoso.com. DNSSEC validation must remain required.

    What should you do?
  fr: |
    Votre réseau contient les serveurs DNS suivants, qui exécutent Windows Server 2025. Aucun n'est contrôleur de domaine.

    | Nom | Configuration |
    | --- | --- |
    | DNS1 | Héberge la zone principale stockée dans un fichier secure.contoso.com, que vous venez de signer |
    | DNS2 | Serveur DNS récursif utilisé par les clients ; n'héberge aucune copie de secure.contoso.com |

    La zone parente contoso.com n'est pas signée. Un objet de stratégie de groupe déploie sur les clients une règle de la table de stratégie de résolution de noms (NRPT) pour .secure.contoso.com qui active DNSSEC et exige la validation. Sur un client, `Resolve-DnsName finance.secure.contoso.com` échoue avec l'erreur « Unsecured DNS packet ».

    Les clients doivent résoudre les noms de secure.contoso.com. La validation DNSSEC doit rester obligatoire.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "On DNS1, re-sign secure.contoso.com by running Invoke-DnsServerZoneSign with -DoResign.", fr: "Sur DNS1, signer à nouveau secure.contoso.com en exécutant Invoke-DnsServerZoneSign avec -DoResign." } }
    - { id: b, text: { en: "On DNS2, add the root trust anchors by running Add-DnsServerTrustAnchor -Root.", fr: "Sur DNS2, ajouter les ancres d'approbation de la racine en exécutant Add-DnsServerTrustAnchor -Root." } }
    - { id: c, text: { en: "On DNS1, add the DNSKEY records of secure.contoso.com as trust anchors.", fr: "Sur DNS1, ajouter les enregistrements DNSKEY de secure.contoso.com comme ancres d'approbation." } }
    - { id: d, text: { en: "On DNS2, add the DNSKEY records of secure.contoso.com as trust anchors.", fr: "Sur DNS2, ajouter les enregistrements DNSKEY de secure.contoso.com comme ancres d'approbation." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A recursive DNS server can validate a signed zone only if it holds a trust anchor for the zone, and trust anchors must be distributed to every non-authoritative server that validates. Because the NRPT requires validation and DNS2 can't validate, the client rejects the answer. Adding the DNSKEY records of the zone as trust anchors on DNS2, for example by piping Get-DnsServerResourceRecord -RRType DNSKEY into Add-DnsServerTrustAnchor, fixes the error.
    fr: |
      Un serveur DNS récursif ne peut valider une zone signée que s'il détient une ancre d'approbation pour cette zone, et les ancres d'approbation doivent être distribuées à chaque serveur sans autorité qui effectue la validation. Comme la NRPT exige la validation et que DNS2 ne peut pas valider, le client rejette la réponse. Ajouter les enregistrements DNSKEY de la zone comme ancres d'approbation sur DNS2, par exemple en redirigeant Get-DnsServerResourceRecord -RRType DNSKEY vers Add-DnsServerTrustAnchor, corrige l'erreur.
  options:
    a: { en: "The zone is correctly signed; re-signing it doesn't give DNS2 a trust anchor.", fr: "La zone est correctement signée ; la signer à nouveau ne donne pas d'ancre d'approbation à DNS2." }
    b: { en: "The root trust anchors validate the public chain of trust; secure.contoso.com has no signed delegation from the root, so they can't validate it.", fr: "Les ancres d'approbation de la racine valident la chaîne de confiance publique ; secure.contoso.com n'a pas de délégation signée depuis la racine : elles ne peuvent pas la valider." }
    c: { en: "DNS1 is authoritative for the zone; the clients query DNS2, which is the server that must validate.", fr: "DNS1 fait autorité pour la zone ; les clients interrogent DNS2, qui est le serveur qui doit valider." }
references:
  - title: Validate and secure DNS responses using DNSSEC on DNS Server in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/validate-dnssec-responses
  - title: Add-DnsServerTrustAnchor (DnsServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsserver/add-dnsservertrustanchor
