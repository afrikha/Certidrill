id: az802-4a-dcdiag-registration
objective: "4.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an AD DS domain named contoso.com. A new domain controller named DC3 was promoted last week. Clients in the branch office of DC3 sometimes authenticate against domain controllers in another site.

    You need to verify from DC1 whether DC3 registered its A, CNAME and SRV records in DNS. The test must not include the checks of forwarders and delegations.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine AD DS nommé contoso.com. Un nouveau contrôleur de domaine nommé DC3 a été promu la semaine dernière. Les clients de la succursale de DC3 s'authentifient parfois auprès de contrôleurs de domaine d'un autre site.

    Vous devez vérifier depuis DC1 si DC3 a inscrit ses enregistrements A, CNAME et SRV dans le DNS. Le test ne doit pas inclure les vérifications des redirecteurs et des délégations.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    dcdiag /test:[[test]] [[option]] /v /s:DC3
  slots:
    - id: test
      options:
        - { id: dns, text: DNS }
        - { id: adv, text: Advertising }
        - { id: repl, text: Replications }
        - { id: kcc, text: KccEvent }
    - id: option
      options:
        - { id: all, text: /DnsAll }
        - { id: reg, text: /DnsRecordRegistration }
        - { id: dyn, text: /DnsDynamicUpdate }
        - { id: ext, text: /DnsResolveExtName }
answer:
  values: { test: dns, option: reg }
explanation:
  correct:
    en: |
      The DNS test isn't part of the default dcdiag tests and must be requested with /test:DNS. Its /DnsRecordRegistration option runs the basic checks plus the registration of the A, CNAME and SRV records, with an inventory report; without an option the test runs /DnsAll, which also checks forwarders and delegations.
    fr: |
      Le test DNS ne fait pas partie des tests dcdiag par défaut et doit être demandé avec /test:DNS. Son option /DnsRecordRegistration exécute les vérifications de base et celle de l'inscription des enregistrements A, CNAME et SRV, avec un rapport d'inventaire ; sans option, le test exécute /DnsAll, qui vérifie aussi les redirecteurs et les délégations.
  options:
    adv: { en: "The Advertising test checks that the domain controller advertises its roles, not the content of its DNS records.", fr: "Le test Advertising vérifie que le contrôleur de domaine annonce ses rôles, pas le contenu de ses enregistrements DNS." }
    all: { en: "/DnsAll runs every DNS check except external name resolution, including the forwarder and delegation checks.", fr: "/DnsAll exécute toutes les vérifications DNS sauf la résolution de noms externes, y compris celles des redirecteurs et des délégations." }
    dyn: { en: "/DnsDynamicUpdate checks whether dynamic update is enabled on the zone, not which records DC3 registered.", fr: "/DnsDynamicUpdate vérifie si la mise à jour dynamique est activée sur la zone, pas quels enregistrements DC3 a inscrits." }
references:
  - title: dcdiag
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/dcdiag
