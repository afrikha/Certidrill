id: az802-cs3b-hybrid-dns
objective: "4.1.4"
type: single
caseStudy: az802-cs3b-blue-yonder
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the hybrid name resolution requirement. What should you do?
  fr: |
    Vous devez satisfaire l'exigence de résolution de noms hybride. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "On DC1 and DC2, create a conditional forwarder for file.core.windows.net that targets 168.63.129.16", fr: "Sur DC1 et DC2, créer un redirecteur conditionnel pour file.core.windows.net qui cible 168.63.129.16" } }
    - { id: b, text: { en: "In dnspr-hub, create a forwarding ruleset with a rule for file.core.windows.net that targets DC1 and DC2", fr: "Dans dnspr-hub, créer un ensemble de règles de transfert avec une règle pour file.core.windows.net qui cible DC1 et DC2" } }
    - { id: c, text: { en: "On DC1 and DC2, create a conditional forwarder for file.core.windows.net that targets 10.100.10.4", fr: "Sur DC1 et DC2, créer un redirecteur conditionnel pour file.core.windows.net qui cible 10.100.10.4" } }
    - { id: d, text: { en: "Set the DNS servers of VNet-Hub to 10.100.10.4 and keep the default forwarding on DC1 and DC2", fr: "Définir les serveurs DNS de VNet-Hub sur 10.100.10.4 et conserver le transfert par défaut sur DC1 et DC2" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The inbound endpoint of Azure DNS Private Resolver gives on-premises DNS servers a private IP address in VNet-Hub to send queries to. Because VNet-Hub is linked to the privatelink.file.core.windows.net zone, the resolver answers with the private endpoint address. The on-premises servers use DC1 and DC2, so the conditional forwarder goes there, for the public zone name.
    fr: |
      Le point de terminaison entrant d'Azure DNS Private Resolver fournit aux serveurs DNS locaux une adresse IP privée de VNet-Hub à laquelle envoyer leurs requêtes. Comme VNet-Hub est lié à la zone privatelink.file.core.windows.net, le résolveur répond avec l'adresse du point de terminaison privé. Les serveurs locaux utilisent DC1 et DC2 : le redirecteur conditionnel se crée donc sur ces serveurs, pour le nom de la zone publique.
  options:
    a:
      en: |
        168.63.129.16 is the Azure-provided DNS address, which answers only queries that originate inside Azure virtual networks; on-premises servers cannot use it over the VPN.
      fr: |
        168.63.129.16 est l'adresse du DNS fourni par Azure, qui ne répond qu'aux requêtes émises depuis des réseaux virtuels Azure ; les serveurs locaux ne peuvent pas l'utiliser via le VPN.
    b:
      en: |
        A forwarding ruleset sends queries from Azure to other DNS servers through the outbound endpoint; it is the opposite direction of the requirement.
      fr: |
        Un ensemble de règles de transfert envoie des requêtes depuis Azure vers d'autres serveurs DNS par le point de terminaison sortant ; c'est la direction inverse de l'exigence.
    d:
      en: |
        The DNS setting of VNet-Hub affects only the VMs in Azure; DC1 and DC2 would still resolve the public address of stbyfiles.
      fr: |
        Le paramètre DNS de VNet-Hub ne concerne que les machines virtuelles dans Azure ; DC1 et DC2 résoudraient toujours l'adresse publique de stbyfiles.
references:
  - title: Azure DNS Private Resolver Overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
  - title: Azure Private Endpoint DNS Integration Scenarios
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
