id: az802-4a-vnet-dns-dcs
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your on-premises network contains an AD DS domain named contoso.com and is connected to an Azure virtual network named VNet1 by an ExpressRoute circuit. Two domain controllers named DC3 (10.20.1.4) and DC4 (10.20.1.5) are Azure virtual machines in VNet1 and run the DNS Server role. VNet1 uses the Azure-provided DNS.

    You plan to deploy Windows Server virtual machines in VNet1 that must join contoso.com. The solution must apply automatically to the virtual machines deployed later.

    What should you do?
  fr: |
    Votre réseau local contient un domaine AD DS nommé contoso.com et est connecté à un réseau virtuel Azure nommé VNet1 par un circuit ExpressRoute. Deux contrôleurs de domaine nommés DC3 (10.20.1.4) et DC4 (10.20.1.5) sont des machines virtuelles Azure de VNet1 et exécutent le rôle Serveur DNS. VNet1 utilise le DNS fourni par Azure.

    Vous prévoyez de déployer dans VNet1 des machines virtuelles Windows Server qui doivent rejoindre contoso.com. La solution doit s'appliquer automatiquement aux machines virtuelles déployées ultérieurement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a private DNS zone named contoso.com with autoregistration enabled and link it to VNet1.", fr: "Créer une zone DNS privée nommée contoso.com avec l'inscription automatique activée et la lier à VNet1." } }
    - { id: b, text: { en: "Set the custom DNS servers of VNet1 to 168.63.129.16.", fr: "Définir les serveurs DNS personnalisés de VNet1 sur 168.63.129.16." } }
    - { id: c, text: { en: "In the operating system of each virtual machine, set the DNS servers of the network connection to 10.20.1.4 and 10.20.1.5.", fr: "Dans le système d'exploitation de chaque machine virtuelle, définir les serveurs DNS de la connexion réseau sur 10.20.1.4 et 10.20.1.5." } }
    - { id: d, text: { en: "Set the custom DNS servers of VNet1 to 10.20.1.4 and 10.20.1.5.", fr: "Définir les serveurs DNS personnalisés de VNet1 sur 10.20.1.4 et 10.20.1.5." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A computer joins a domain by locating a domain controller through the SRV records of contoso.com, which only the domain's DNS servers hold. Custom DNS servers set on the virtual network apply to every VM of VNet1 whose network interface doesn't override them, including the VMs deployed later. DC3 and DC4 can forward other names to 168.63.129.16.
    fr: |
      Un ordinateur rejoint un domaine en localisant un contrôleur de domaine grâce aux enregistrements SRV de contoso.com, que seuls les serveurs DNS du domaine détiennent. Les serveurs DNS personnalisés définis sur le réseau virtuel s'appliquent à toutes les machines virtuelles de VNet1 dont l'interface réseau ne les remplace pas, y compris celles déployées plus tard. DC3 et DC4 peuvent transférer les autres noms vers 168.63.129.16.
  options:
    a: { en: "A private DNS zone with autoregistration holds A records of the VMs, not the SRV records that AD DS domain controllers register, so domain join would fail.", fr: "Une zone DNS privée avec inscription automatique contient les enregistrements A des machines virtuelles, pas les enregistrements SRV qu'inscrivent les contrôleurs de domaine AD DS : la jonction au domaine échouerait." }
    b: { en: "168.63.129.16 is the Azure-provided DNS, which doesn't host the contoso.com zone of AD DS.", fr: "168.63.129.16 est le DNS fourni par Azure, qui n'héberge pas la zone contoso.com d'AD DS." }
    c: { en: "Microsoft advises against changing DNS settings inside the VM, because they can be lost when Azure replaces the virtual network adapter, and the setting doesn't apply to new VMs.", fr: "Microsoft déconseille de modifier les paramètres DNS dans la machine virtuelle, car ils peuvent être perdus lorsqu'Azure remplace la carte réseau virtuelle, et le paramètre ne s'applique pas aux nouvelles machines virtuelles." }
references:
  - title: Azure Virtual Network Name Resolution Guide
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-name-resolution-for-vms-and-role-instances
