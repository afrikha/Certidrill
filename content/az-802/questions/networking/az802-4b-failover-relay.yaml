id: az802-4b-failover-relay
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Two DHCP servers named **DHCP1** (10.0.1.11) and **DHCP2** (10.0.1.12) are on the head office subnet 10.0.1.0/24. They share the scope 10.70.5.0/24 of a branch office in a load balance failover relationship.

    The branch router relays DHCP requests to the head office by using the command `ip helper-address 10.0.1.11`.

    During maintenance of DHCP1, DHCP2 is in the partner down state, but new branch clients receive addresses in the 169.254.0.0/16 range.

    You need to ensure that the branch clients obtain addresses when either DHCP server is unavailable.

    What should you do?
  fr: |
    Deux serveurs DHCP nommés **DHCP1** (10.0.1.11) et **DHCP2** (10.0.1.12) se trouvent sur le sous-réseau du siège 10.0.1.0/24. Ils partagent l'étendue 10.70.5.0/24 d'une succursale dans une relation de basculement en mode équilibrage de charge.

    Le routeur de la succursale relaie les demandes DHCP vers le siège avec la commande `ip helper-address 10.0.1.11`.

    Pendant la maintenance de DHCP1, DHCP2 est dans l'état partenaire indisponible, mais les nouveaux clients de la succursale reçoivent des adresses de la plage 169.254.0.0/16.

    Vous devez vous assurer que les clients de la succursale obtiennent des adresses quand l'un ou l'autre des serveurs DHCP est indisponible.

    Que devez-vous faire ?
body:
  options:
    - { id: helper, text: { en: "Add `ip helper-address 10.0.1.12` to the client interface of the branch router.", fr: "Ajouter `ip helper-address 10.0.1.12` à l'interface client du routeur de la succursale." } }
    - { id: lb100, text: { en: "Run `Set-DhcpServerv4Failover -LoadBalancePercent 100` on DHCP2.", fr: "Exécuter `Set-DhcpServerv4Failover -LoadBalancePercent 100` sur DHCP2." } }
    - { id: hs, text: { en: "Change the relationship to hot standby mode with DHCP2 as the active server.", fr: "Passer la relation en mode de secours à chaud avec DHCP2 comme serveur actif." } }
    - { id: rep, text: { en: "Run `Invoke-DhcpServerv4FailoverReplication` on DHCP2.", fr: "Exécuter `Invoke-DhcpServerv4FailoverReplication` sur DHCP2." } }
answer: { optionId: helper }
explanation:
  correct:
    en: |
      DHCP clients must be able to reach both failover partners. Because both servers are on another subnet than the clients, the relay must forward the requests to both of them, so the router needs a second helper address (or the broadcast address 10.0.1.255, since both servers share a subnet). DHCP2 is healthy, but it never receives the branch requests.
    fr: |
      Les clients DHCP doivent pouvoir joindre les deux partenaires de basculement. Comme les deux serveurs sont sur un autre sous-réseau que les clients, le relais doit transmettre les demandes aux deux : le routeur a besoin d'une seconde adresse d'assistance (ou de l'adresse de diffusion 10.0.1.255, puisque les deux serveurs partagent un sous-réseau). DHCP2 fonctionne, mais il ne reçoit jamais les demandes de la succursale.
  options:
    lb100: { en: "The load balance percentage doesn't matter while DHCP2 receives no request.", fr: "Le pourcentage d'équilibrage de charge n'a pas d'effet tant que DHCP2 ne reçoit aucune demande." }
    hs: { en: "Changing the mode doesn't deliver the relayed requests to DHCP2; the branch clients would fail whenever DHCP1 is unreachable.", fr: "Changer de mode n'achemine pas les demandes relayées vers DHCP2 ; les clients de la succursale échoueraient chaque fois que DHCP1 est injoignable." }
    rep: { en: "Replication copies scope settings to the partner; it doesn't change where the router sends the requests.", fr: "La réplication copie les paramètres d'étendue vers le partenaire ; elle ne change pas la destination des demandes envoyées par le routeur." }
references:
  - title: DHCP failover in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-failover
