id: az802-cs2a-dhcp-standby
objective: "4.2.5"
type: dropdown
caseStudy: az802-cs2a-coho-winery
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the DHCP requirement. You plan to run the following command on DHCP1.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence DHCP. Vous prévoyez d'exécuter la commande suivante sur DHCP1.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Add-DhcpServerv4Failover -ComputerName DHCP1 -PartnerServer SE-SRV1 `
        -Name "SE-Failover" -ScopeId 10.40.11.0 `
        [[mode]] [[share]]
  slots:
    - id: mode
      options:
        - { id: active, text: "-ServerRole Active" }
        - { id: standby, text: "-ServerRole Standby" }
        - { id: lb, text: "-LoadBalancePercent 50" }
        - { id: ast, text: "-AutoStateTransition $true" }
    - id: share
      options:
        - { id: lbp, text: "-LoadBalancePercent 10" }
        - { id: mclt, text: "-MaxClientLeadTime 00:10:00" }
        - { id: rsv, text: "-ReservePercent 10" }
        - { id: ssi, text: "-StateSwitchInterval 00:10:00" }
answer:
  values: { mode: standby, share: rsv }
explanation:
  correct:
    en: |
      Hot standby mode is the recommended design when a hub server backs up a branch server, and only the active server leases addresses while it is available. `-ServerRole` sets the role of the local server, the one named by `-ComputerName`, so `Standby` makes DHCP1 the standby and SE-SRV1 the active server. `-ReservePercent 10` keeps 10% of the free addresses for the standby server (the default is 5).
    fr: |
      Le mode Hot standby est la conception recommandée quand un serveur central sert de secours à un serveur de site distant, et seul le serveur actif attribue des adresses tant qu'il est disponible. `-ServerRole` définit le rôle du serveur local, celui que désigne `-ComputerName` : `Standby` fait de DHCP1 le serveur de secours et de SE-SRV1 le serveur actif. `-ReservePercent 10` réserve 10 % des adresses libres au serveur de secours (la valeur par défaut est 5).
  options:
    active:
      en: '`Active` would make DHCP1 the active server, which would lease addresses while SE-SRV1 is available.'
      fr: '`Active` ferait de DHCP1 le serveur actif, qui attribuerait des adresses alors que SE-SRV1 est disponible.'
    lbp:
      en: '`-LoadBalancePercent` belongs to load balance mode, in which both servers lease addresses at the same time.'
      fr: '`-LoadBalancePercent` appartient au mode d''équilibrage de charge, dans lequel les deux serveurs attribuent des adresses en même temps.'
references:
  - title: Add-DhcpServerv4Failover (DhcpServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/add-dhcpserverv4failover
  - title: DHCP failover in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-failover
