id: az802-sr2-dns-subnet-policy-3
objective: "4.1.5"
type: series_yesno
series: az802-sr2-dns-subnet-policy
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You create a zone scope and a zone-level query resolution policy that matches the server interface IP address and the FQDN.
  fr: |
    Vous créez une étendue de zone et une stratégie de résolution de requête au niveau de la zone qui correspond à l'adresse IP de l'interface du serveur et au FQDN.
body:
  solution:
    en: |
      You run the following commands on DNS1:

      ```powershell
      Add-DnsServerZoneScope -ZoneName "contoso.com" -Name "Branch1Scope"
      Add-DnsServerResourceRecord -ZoneName "contoso.com" -A -Name "app" -IPv4Address "10.20.5.10" -ZoneScope "Branch1Scope"
      Add-DnsServerQueryResolutionPolicy -Name "Branch1Policy" -Action ALLOW -ServerInterfaceIP "EQ,10.10.0.53" -Fqdn "EQ,app.contoso.com" -Condition AND -ZoneScope "Branch1Scope,1" -ZoneName "contoso.com"
      ```
    fr: |
      Vous exécutez les commandes suivantes sur DNS1 :

      ```powershell
      Add-DnsServerZoneScope -ZoneName "contoso.com" -Name "Branch1Scope"
      Add-DnsServerResourceRecord -ZoneName "contoso.com" -A -Name "app" -IPv4Address "10.20.5.10" -ZoneScope "Branch1Scope"
      Add-DnsServerQueryResolutionPolicy -Name "Branch1Policy" -Action ALLOW -ServerInterfaceIP "EQ,10.10.0.53" -Fqdn "EQ,app.contoso.com" -Condition AND -ZoneScope "Branch1Scope,1" -ZoneName "contoso.com"
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      The server interface criterion distinguishes clients only when they reach the server on different interfaces, as in a split-brain deployment with a private and a public interface. DNS1 has a single interface, so every query for app.contoso.com, including those from headquarters, matches the policy and receives 10.20.5.10. A client subnet criterion is needed.
    fr: |
      Le critère d'interface du serveur ne distingue les clients que s'ils joignent le serveur par des interfaces différentes, comme dans un déploiement split-brain avec une interface privée et une interface publique. DNS1 n'a qu'une interface : toutes les requêtes pour app.contoso.com, y compris celles du siège, correspondent à la stratégie et reçoivent 10.20.5.10. Il faut un critère de sous-réseau client.
references:
  - title: Use DNS Policy for Split-Brain DNS Deployment
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/deploy/split-brain-dns-deployment
  - title: Add-DnsServerQueryResolutionPolicy (DnsServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsserver/add-dnsserverqueryresolutionpolicy
