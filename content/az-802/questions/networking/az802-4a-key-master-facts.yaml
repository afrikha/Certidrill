id: az802-4a-key-master-facts
objective: "4.1.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Your network contains the following signed DNS zones:

    | Zone | Storage | Servers |
    | --- | --- | --- |
    | secure.contoso.com | Active Directory-integrated | Domain controllers DC1 (Key Master) and DC2 |
    | tailspin.local | File-backed | Member server DNS5 (primary, Key Master) and member server DNS6 (secondary) |

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient les zones DNS signées suivantes :

    | Zone | Stockage | Serveurs |
    | --- | --- | --- |
    | secure.contoso.com | Intégrée à Active Directory | Contrôleurs de domaine DC1 (maître de clés) et DC2 |
    | tailspin.local | Fichier | Serveur membre DNS5 (principal, maître de clés) et serveur membre DNS6 (secondaire) |

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "DC2 signs its own copy of secure.contoso.com by using private keys replicated through AD DS.", fr: "DC2 signe sa propre copie de secure.contoso.com avec des clés privées répliquées par AD DS." } }
    - { id: b, text: { en: "You can transfer the Key Master role of tailspin.local to DNS6.", fr: "Vous pouvez transférer le rôle de maître de clés de tailspin.local à DNS6." } }
    - { id: c, text: { en: "DC1 and DC2 can both be the Key Master of secure.contoso.com at the same time.", fr: "DC1 et DC2 peuvent être en même temps maîtres de clés de secure.contoso.com." } }
    - { id: d, text: { en: "You can transfer the Key Master role of secure.contoso.com to DC2 while DC1 is online.", fr: "Vous pouvez transférer le rôle de maître de clés de secure.contoso.com à DC2 pendant que DC1 est en ligne." } }
    - { id: e, text: { en: "The Key Master of secure.contoso.com must also hold the PDC emulator role.", fr: "Le maître de clés de secure.contoso.com doit aussi détenir le rôle d'émulateur PDC." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      In an Active Directory-integrated zone, the private keys replicate through AD DS and each primary server signs its own in-memory copy of the zone. Any authoritative server that hosts a primary copy can take the Key Master role, and the normal transfer is done while the current Key Master is online.
    fr: |
      Dans une zone intégrée à Active Directory, les clés privées sont répliquées par AD DS et chaque serveur principal signe sa propre copie de la zone en mémoire. Tout serveur faisant autorité qui héberge une copie principale peut prendre le rôle de maître de clés, et le transfert normal se fait pendant que le maître de clés actuel est en ligne.
  options:
    b: { en: "A file-backed zone has a single primary server, and the Key Master must be a primary server; the role can't be transferred, and a secondary can't hold it.", fr: "Une zone stockée dans un fichier n'a qu'un serveur principal, et le maître de clés doit être un serveur principal : le rôle ne peut pas être transféré, et une zone secondaire ne peut pas le détenir." }
    c: { en: "Only one DNS server can be the Key Master of a given zone at a time.", fr: "Un seul serveur DNS peut être maître de clés d'une zone donnée à un instant donné." }
    e: { en: "The Key Master is a DNSSEC role of a zone, independent of the FSMO roles of AD DS.", fr: "Le maître de clés est un rôle DNSSEC propre à une zone, indépendant des rôles FSMO d'AD DS." }
references:
  - title: DNSSEC Key Master
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/dnssec-key-master
