id: az802-4b-dhcp-port-conflict
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A new server named **DHCP4** runs the DHCP Server role and the PXE boot service of a third-party imaging product. DHCP4 is connected to the subnet 10.60.4.0/24.

    You verify the following:

    - DHCP4 is authorized in AD DS, and the DHCP Server service is running.
    - The scope 10.60.4.0 is active and has 180 free addresses.
    - `Get-DhcpServerv4Binding` shows that the DHCP server is bound to the only network adapter of DHCP4.

    Clients on the subnet 10.60.4.0/24 receive no offer from DHCP4.

    Which command should you run on DHCP4 to continue troubleshooting?
  fr: |
    Un nouveau serveur nommé **DHCP4** exécute le rôle DHCP Server et le service de démarrage PXE d'un produit de création d'images tiers. DHCP4 est connecté au sous-réseau 10.60.4.0/24.

    Vous vérifiez les points suivants :

    - DHCP4 est autorisé dans AD DS, et le service Serveur DHCP est en cours d'exécution.
    - L'étendue 10.60.4.0 est active et compte 180 adresses libres.
    - `Get-DhcpServerv4Binding` montre que le serveur DHCP est lié à l'unique carte réseau de DHCP4.

    Les clients du sous-réseau 10.60.4.0/24 ne reçoivent aucune offre de DHCP4.

    Quelle commande devez-vous exécuter sur DHCP4 pour poursuivre le dépannage ?
body:
  options:
    - { id: netstat, text: "netstat -anb" }
    - { id: bad, text: "Get-DhcpServerv4Lease -BadLeases" }
    - { id: free, text: "Get-DhcpServerv4FreeIPAddress -ScopeId 10.60.4.0" }
    - { id: regdns, text: "ipconfig /registerdns" }
answer: { optionId: netstat }
explanation:
  correct:
    en: |
      Authorization, service state, scope state, free addresses and bindings are already verified. The next check is that only the DHCP server listens on UDP ports 67 and 68; another service such as PXE or WDS must not occupy them. `netstat -anb` lists the listening ports with the process that owns each one.
    fr: |
      L'autorisation, l'état du service, l'état de l'étendue, les adresses libres et les liaisons sont déjà vérifiés. La vérification suivante consiste à s'assurer que seul le serveur DHCP écoute sur les ports UDP 67 et 68 ; un autre service comme PXE ou WDS ne doit pas les occuper. `netstat -anb` liste les ports en écoute avec le processus propriétaire de chacun.
  options:
    bad: { en: "BAD_ADDRESS leases reveal conflicts with static devices; they don't explain a server that sends no offer at all.", fr: "Les baux BAD_ADDRESS révèlent des conflits avec des appareils statiques ; ils n'expliquent pas un serveur qui n'envoie aucune offre." }
    free: { en: "You already know that the scope has 180 free addresses.", fr: "Vous savez déjà que l'étendue compte 180 adresses libres." }
    regdns: { en: "ipconfig /registerdns registers the server's own DNS records; it doesn't diagnose DHCP.", fr: "ipconfig /registerdns inscrit les enregistrements DNS du serveur lui-même ; il ne diagnostique pas DHCP." }
references:
  - title: Troubleshoot problems on the DHCP server
    url: https://learn.microsoft.com/en-us/windows-server/troubleshoot/troubleshoot-problems-on-dhcp-server
