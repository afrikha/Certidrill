id: az802-cs1b-dhcp2-leases
objective: "4.2.1"
type: single
caseStudy: az802-cs1b-southridge
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the render farm requirement.

    Which command should you run?
  fr: |
    Vous devez respecter l'exigence relative à la ferme de rendu.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "Set-DhcpServerv4Scope -ComputerName DHCP2 -ScopeId 10.30.5.0 -State Active" }
    - { id: b, text: "Restart-Service -Name dhcpserver" }
    - { id: c, text: "Add-DhcpServerInDC -DnsName DHCP2.southridgevideo.com -IPAddress 10.30.0.6" }
    - { id: d, text: "Add-DhcpServerv4ExclusionRange -ComputerName DHCP2 -ScopeId 10.30.5.0 -StartRange 10.30.5.1 -EndRange 10.30.5.10" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In an AD DS domain, a DHCP server must be authorized in Active Directory; an unauthorized server doesn't lease addresses to clients. `Get-DhcpServerInDC` lists only DHCP1, so DHCP2 isn't authorized. `Add-DhcpServerInDC` authorizes DHCP2 with its DNS name and IP address.
    fr: |
      Dans un domaine AD DS, un serveur DHCP doit être autorisé dans Active Directory ; un serveur non autorisé n'attribue pas d'adresses aux clients. `Get-DhcpServerInDC` ne liste que DHCP1 : DHCP2 n'est donc pas autorisé. `Add-DhcpServerInDC` autorise DHCP2 avec son nom DNS et son adresse IP.
  options:
    a: { en: "The scope 10.30.5.0 is already active.", fr: "L'étendue 10.30.5.0 est déjà active." }
    b: { en: "The service was already restarted after the security groups were created; restarting it again doesn't authorize the server.", fr: "Le service a déjà été redémarré après la création des groupes de sécurité ; le redémarrer de nouveau n'autorise pas le serveur." }
    d: { en: "An exclusion range only removes addresses from the pool; it doesn't make DHCP2 lease addresses.", fr: "Une plage d'exclusion retire seulement des adresses du pool ; elle ne permet pas à DHCP2 d'attribuer des adresses." }
references:
  - title: Deploy DHCP Using Windows PowerShell
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-deploy-wps
