id: az802-4b-hybrid-overlap
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an on-premises network that uses the address space 10.20.0.0/16. An Azure virtual network named **VNet-Hub** uses 10.30.0.0/16 and is connected to the on-premises network by a site-to-site VPN gateway.

    You create a virtual network named **VNet-App** with the address space 10.20.128.0/20. VNet-App contains no resources yet. You plan to peer VNet-App with VNet-Hub so that the virtual machines in VNet-App reach the on-premises servers through the VPN gateway of VNet-Hub.

    You need to ensure that the virtual machines in VNet-App will be able to communicate with the on-premises servers.

    What should you do first?
  fr: |
    Contoso dispose d'un réseau local qui utilise l'espace d'adressage 10.20.0.0/16. Un réseau virtuel Azure nommé **VNet-Hub** utilise 10.30.0.0/16 et est connecté au réseau local par une passerelle VPN de site à site.

    Vous créez un réseau virtuel nommé **VNet-App** avec l'espace d'adressage 10.20.128.0/20. VNet-App ne contient encore aucune ressource. Vous prévoyez de créer un peering entre VNet-App et VNet-Hub pour que les machines virtuelles de VNet-App atteignent les serveurs locaux par la passerelle VPN de VNet-Hub.

    Vous devez vous assurer que les machines virtuelles de VNet-App pourront communiquer avec les serveurs locaux.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: space, text: { en: "Replace the address space of VNet-App with a range that overlaps neither the on-premises network nor VNet-Hub, such as 10.40.0.0/20.", fr: "Remplacer l'espace d'adressage de VNet-App par une plage qui ne chevauche ni le réseau local ni VNet-Hub, par exemple 10.40.0.0/20." } }
    - { id: transit, text: { en: "Create the peering with Allow gateway transit on VNet-Hub and Use remote gateways on VNet-App.", fr: "Créer le peering avec Allow gateway transit sur VNet-Hub et Use remote gateways sur VNet-App." } }
    - { id: udr, text: { en: "Add a user-defined route for 10.20.0.0/16 with the next hop type Virtual network gateway to the subnets of VNet-App.", fr: "Ajouter aux sous-réseaux de VNet-App un itinéraire défini par l'utilisateur pour 10.20.0.0/16 avec le type de tronçon suivant Virtual network gateway." } }
    - { id: dns, text: { en: "Configure VNet-App to use the on-premises DNS servers as custom DNS servers.", fr: "Configurer VNet-App pour qu'il utilise les serveurs DNS locaux comme serveurs DNS personnalisés." } }
answer: { optionId: space }
explanation:
  correct:
    en: |
      A virtual network can be linked to other virtual networks and to on-premises networks only if their address ranges don't overlap. 10.20.128.0/20 is inside the on-premises space 10.20.0.0/16, so traffic to the on-premises servers can't be routed correctly. Because VNet-App is still empty, change its address space to a non-overlapping range before you create the peering.
    fr: |
      Un réseau virtuel ne peut être relié à d'autres réseaux virtuels et à des réseaux locaux que si leurs plages d'adresses ne se chevauchent pas. 10.20.128.0/20 se trouve dans l'espace local 10.20.0.0/16 : le trafic vers les serveurs locaux ne peut pas être routé correctement. Comme VNet-App est encore vide, changez son espace d'adressage pour une plage sans chevauchement avant de créer le peering.
  options:
    transit: { en: "Gateway transit is needed later, but it doesn't solve the overlap between VNet-App and the on-premises network.", fr: "Le transit par passerelle sera nécessaire ensuite, mais il ne résout pas le chevauchement entre VNet-App et le réseau local." }
    udr: { en: "A route can't make addresses that exist on both sides unique; the overlap must be removed.", fr: "Un itinéraire ne peut pas rendre uniques des adresses qui existent des deux côtés ; le chevauchement doit être supprimé." }
    dns: { en: "DNS settings affect name resolution, not the routing conflict caused by overlapping address spaces.", fr: "Les paramètres DNS concernent la résolution de noms, pas le conflit de routage causé par des espaces d'adressage qui se chevauchent." }
references:
  - title: Azure Virtual Network FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
