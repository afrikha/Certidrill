id: az802-4b-dhcp-install-workgroup
objective: "4.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    A server named **SRV5** runs Windows Server 2025 in a perimeter network. SRV5 is a member of a workgroup, not of a domain.

    You plan to install the DHCP Server role on SRV5 by running `Install-WindowsFeature DHCP -IncludeManagementTools`, and then to create a scope for the perimeter subnet.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur nommé **SRV5** exécute Windows Server 2025 dans un réseau de périmètre. SRV5 est membre d'un groupe de travail, pas d'un domaine.

    Vous prévoyez d'installer le rôle DHCP Server sur SRV5 en exécutant `Install-WindowsFeature DHCP -IncludeManagementTools`, puis de créer une étendue pour le sous-réseau de périmètre.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          SRV5 must have a static IPv4 address.
        fr: |
          SRV5 doit avoir une adresse IPv4 statique.
    - id: s2
      text:
        en: |
          You must run `Add-DhcpServerInDC` before SRV5 can lease addresses.
        fr: |
          Vous devez exécuter `Add-DhcpServerInDC` avant que SRV5 puisse attribuer des adresses.
    - id: s3
      text:
        en: |
          You must restart SRV5 to complete the installation of the DHCP Server role.
        fr: |
          Vous devez redémarrer SRV5 pour terminer l'installation du rôle DHCP Server.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A static IPv4 address is a prerequisite of a DHCP server. Authorization in Active Directory applies only to DHCP servers in a domain; in a workgroup, you don't run `Add-DhcpServerInDC`. Installing the DHCP Server role doesn't require a restart.
    fr: |
      Une adresse IPv4 statique est un prérequis d'un serveur DHCP. L'autorisation dans Active Directory ne concerne que les serveurs DHCP d'un domaine ; dans un groupe de travail, vous n'exécutez pas `Add-DhcpServerInDC`. L'installation du rôle DHCP Server ne nécessite pas de redémarrage.
references:
  - title: Install and configure DHCP Server on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/quickstart-install-configure-dhcp-server
