id: az802-4a-dnssec-records
objective: "4.1.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You sign a zone named secure.contoso.com by using DNSSEC on a DNS server that runs Windows Server 2025. The zone uses NSEC3.

    Which record type matches each description? To answer, drag the appropriate record types to the correct descriptions. Each record type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous signez une zone nommée secure.contoso.com avec DNSSEC sur un serveur DNS qui exécute Windows Server 2025. La zone utilise NSEC3.

    Quel type d'enregistrement correspond à chaque description ? Pour répondre, faites glisser les types d'enregistrements appropriés vers les descriptions correspondantes. Chaque type d'enregistrement peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rrsig, text: RRSIG }
    - { id: dnskey, text: DNSKEY }
    - { id: nsec, text: NSEC }
    - { id: nsec3, text: NSEC3 }
    - { id: ds, text: DS }
  targets:
    - id: t1
      text: { en: "Contains the signature of a set of records", fr: "Contient la signature d'un ensemble d'enregistrements" }
    - id: t2
      text: { en: "Contains the public key of the zone signing key or of the key signing key", fr: "Contient la clé publique de la clé de signature de zone ou de la clé de signature de clé" }
    - id: t3
      text: { en: "Proves that a queried name doesn't exist while preventing zone walking", fr: "Prouve qu'un nom demandé n'existe pas tout en empêchant le parcours de la zone (zone walking)" }
    - id: t4
      text: { en: "Must be created in the parent zone to secure the delegation to secure.contoso.com", fr: "Doit être créé dans la zone parente pour sécuriser la délégation vers secure.contoso.com" }
answer:
  mapping: { t1: rrsig, t2: dnskey, t3: nsec3, t4: ds }
explanation:
  correct:
    en: |
      RRSIG records hold the signatures, and DNSKEY records hold the public keys of the ZSK and the KSK. NSEC3 provides authenticated denial of existence and, unlike NSEC, prevents zone walking; a zone uses one or the other. The DS record secures a delegation; it isn't created automatically when you sign the child zone and must be added to the parent zone.
    fr: |
      Les enregistrements RRSIG contiennent les signatures, et les enregistrements DNSKEY les clés publiques de la ZSK et de la KSK. NSEC3 fournit le refus d'existence authentifié et, contrairement à NSEC, empêche le parcours de la zone ; une zone utilise l'un ou l'autre. L'enregistrement DS sécurise une délégation ; il n'est pas créé automatiquement lors de la signature de la zone enfant et doit être ajouté à la zone parente.
references:
  - title: What is DNSSEC on DNS Server in Windows Server?
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/dnssec-overview
