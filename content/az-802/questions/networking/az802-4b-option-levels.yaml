id: az802-4b-option-levels
objective: "4.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A DHCP server named **DHCP1** hosts scopes for several subnets, including 10.30.1.0/24. You need to configure the DHCP options described in the answer area. Each option must apply only to the clients described.

    At which level should you set each option? To answer, drag the appropriate levels to the correct requirements. Each level may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur DHCP nommé **DHCP1** héberge des étendues pour plusieurs sous-réseaux, dont 10.30.1.0/24. Vous devez configurer les options DHCP décrites dans la zone de réponse. Chaque option ne doit s'appliquer qu'aux clients décrits.

    À quel niveau devez-vous définir chaque option ? Pour répondre, faites glisser les niveaux appropriés vers les exigences correspondantes. Chaque niveau peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: server, text: { en: "Server level", fr: "Niveau serveur" } }
    - { id: scope, text: { en: "Scope level", fr: "Niveau étendue" } }
    - { id: resv, text: { en: "Reservation level", fr: "Niveau réservation" } }
    - { id: policy, text: { en: "Policy level", fr: "Niveau stratégie" } }
    - { id: super, text: { en: "Superscope level", fr: "Niveau superétendue" } }
  targets:
    - id: dns
      text: { en: "DNS servers 10.0.0.10 and 10.0.0.11 for every client of every scope", fr: "Serveurs DNS 10.0.0.10 et 10.0.0.11 pour tous les clients de toutes les étendues" }
    - id: gw
      text: { en: "Default gateway 10.30.1.1 for the clients of 10.30.1.0/24", fr: "Passerelle par défaut 10.30.1.1 pour les clients de 10.30.1.0/24" }
    - id: prn
      text: { en: "Default gateway 10.30.1.254 for the label printer PRN7 only, which has a reserved address", fr: "Passerelle par défaut 10.30.1.254 pour la seule imprimante d'étiquettes PRN7, qui a une adresse réservée" }
    - id: hv
      text: { en: "Another DNS server for the Hyper-V virtual machines of 10.30.1.0/24, identified by the MAC address prefix 00-15-5D", fr: "Un autre serveur DNS pour les machines virtuelles Hyper-V de 10.30.1.0/24, identifiées par le préfixe d'adresse MAC 00-15-5D" }
answer:
  mapping: { dns: server, gw: scope, prn: resv, hv: policy }
explanation:
  correct:
    en: |
      `Set-DhcpServerv4OptionValue` sets options at the server level (without -ScopeId or -ReservedIP), at the scope level (-ScopeId), at the reservation level (-ReservedIP) or for a policy (-PolicyName). Server options apply to the clients of every scope, scope options to one subnet, reservation options to one device, and a policy whose condition matches the MAC address prefix targets only the Hyper-V virtual machines. A superscope groups scopes for administration and lease assignment; it isn't an option level.
    fr: |
      `Set-DhcpServerv4OptionValue` définit des options au niveau du serveur (sans -ScopeId ni -ReservedIP), de l'étendue (-ScopeId), de la réservation (-ReservedIP) ou d'une stratégie (-PolicyName). Les options du serveur s'appliquent aux clients de toutes les étendues, celles de l'étendue à un sous-réseau, celles de la réservation à un appareil, et une stratégie dont la condition porte sur le préfixe d'adresse MAC ne cible que les machines virtuelles Hyper-V. Une superétendue regroupe des étendues pour l'administration et l'attribution des baux ; ce n'est pas un niveau d'options.
references:
  - title: Set-DhcpServerv4OptionValue (DhcpServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/set-dhcpserverv4optionvalue
  - title: DHCP scopes in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-scopes
