id: az802-cs2c-outbound-resolution
objective: "4.1.4"
type: dropdown
caseStudy: az802-cs2c-graphic-design-institute
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the name resolution requirement. You will link the DNS forwarding ruleset to VNet-Hub.

    How should you complete the configuration of DNSPR1? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence de résolution de noms. Vous lierez l'ensemble de règles de transfert DNS à VNet-Hub.

    Comment devez-vous compléter la configuration de DNSPR1 ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Endpoint to add to DNSPR1: [[ep]]

      Subnet of the new endpoint: [[subnet]]

      Destination of the forwarding rule for gdinstitute.edu: [[target]]
    fr: |
      Point de terminaison à ajouter à DNSPR1 : [[ep]]

      Sous-réseau du nouveau point de terminaison : [[subnet]]

      Destination de la règle de transfert pour gdinstitute.edu : [[target]]
  slots:
    - id: ep
      options:
        - { id: outbound, text: { en: "An outbound endpoint", fr: "Un point de terminaison sortant" } }
        - { id: inbound, text: { en: "A second inbound endpoint", fr: "Un deuxième point de terminaison entrant" } }
        - { id: pe, text: { en: "A private endpoint", fr: "Un point de terminaison privé" } }
    - id: subnet
      options:
        - { id: dnsin, text: { en: "snet-dns-in", fr: "snet-dns-in" } }
        - { id: new, text: { en: "A new subnet 10.60.3.0/28 delegated to Microsoft.Network/dnsResolvers", fr: "Un nouveau sous-réseau 10.60.3.0/28 délégué à Microsoft.Network/dnsResolvers" } }
        - { id: lab, text: { en: "snet-lab", fr: "snet-lab" } }
    - id: target
      options:
        - { id: wire, text: "168.63.129.16" }
        - { id: inip, text: "10.60.2.4" }
        - { id: dcs, text: "10.20.0.10, 10.20.0.11" }
answer:
  values: { ep: outbound, subnet: new, target: dcs }
explanation:
  correct:
    en: |
      Queries from Azure to on-premises DNS servers leave through an outbound endpoint, and a DNS forwarding ruleset linked to VNet-Hub sends the gdinstitute.edu queries to DC1 and DC2. The VMs keep the Azure-provided DNS setting, and the resolver is a managed service. An outbound endpoint needs its own dedicated subnet delegated to Microsoft.Network/dnsResolvers; it cannot share snet-dns-in with the inbound endpoint.
    fr: |
      Les requêtes envoyées depuis Azure vers des serveurs DNS locaux sortent par un point de terminaison sortant, et un ensemble de règles de transfert DNS lié à VNet-Hub envoie les requêtes pour gdinstitute.edu à DC1 et DC2. Les machines virtuelles conservent le paramètre DNS fourni par Azure, et le résolveur est un service managé. Un point de terminaison sortant a besoin de son propre sous-réseau dédié, délégué à Microsoft.Network/dnsResolvers ; il ne peut pas partager snet-dns-in avec le point de terminaison entrant.
  options:
    inbound:
      en: |
        An inbound endpoint receives queries that come from on-premises; it does not forward queries from Azure to on-premises servers.
      fr: |
        Un point de terminaison entrant reçoit les requêtes venant du réseau local ; il ne transfère pas les requêtes d'Azure vers des serveurs locaux.
    dnsin:
      en: |
        Each resolver endpoint needs its own subnet, and snet-dns-in already hosts the inbound endpoint.
      fr: |
        Chaque point de terminaison du résolveur a besoin de son propre sous-réseau, et snet-dns-in héberge déjà le point de terminaison entrant.
    inip:
      en: |
        Forwarding to the inbound endpoint would send the queries back to Azure DNS, which does not host the gdinstitute.edu zone.
      fr: |
        Transférer vers le point de terminaison entrant renverrait les requêtes vers Azure DNS, qui n'héberge pas la zone gdinstitute.edu.
references:
  - title: What is Azure DNS Private Resolver?
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
