id: az802-4a-policy-types
objective: "4.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to implement DNS policies on DNS servers that run Windows Server 2022.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'implémenter des stratégies DNS sur des serveurs DNS qui exécutent Windows Server 2022.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A zone transfer policy can use the ALLOW action with weighted zone scopes.", fr: "Une stratégie de transfert de zone peut utiliser l'action ALLOW avec des étendues de zone pondérées." } }
    - { id: b, text: { en: "A server-level query resolution policy can use only the DENY or IGNORE action.", fr: "Une stratégie de résolution de requêtes de niveau serveur ne peut utiliser que l'action DENY ou IGNORE." } }
    - { id: c, text: { en: "When several policies of the same level match a query, the server applies the policy that has the most criteria.", fr: "Lorsque plusieurs stratégies du même niveau correspondent à une requête, le serveur applique celle qui a le plus de critères." } }
    - { id: d, text: { en: "A recursion policy can be created only at the server level.", fr: "Une stratégie de récursivité ne peut être créée qu'au niveau du serveur." } }
    - { id: e, text: { en: "A zone-level query resolution policy uses DENY as its default action.", fr: "Une stratégie de résolution de requêtes de niveau zone utilise DENY comme action par défaut." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Server-level query resolution policies can only deny or ignore queries; returning records from zone scopes is done at the zone level. Recursion policies are a special type of server-level policy that applies when the query reaches the recursion path, so they exist only at the server level.
    fr: |
      Les stratégies de résolution de requêtes de niveau serveur ne peuvent que refuser ou ignorer des requêtes ; le renvoi d'enregistrements depuis des étendues de zone se fait au niveau de la zone. Les stratégies de récursivité sont un type particulier de stratégie de niveau serveur qui s'applique lorsque la requête atteint le chemin de récursivité : elles n'existent qu'au niveau du serveur.
  options:
    a: { en: "Zone transfer policies can only DENY or IGNORE transfers.", fr: "Les stratégies de transfert de zone ne peuvent que refuser (DENY) ou ignorer (IGNORE) les transferts." }
    c: { en: "Policies of the same level are evaluated in processing order, and the first policy that matches is applied.", fr: "Les stratégies d'un même niveau sont évaluées selon l'ordre de traitement, et la première qui correspond s'applique." }
    e: { en: "ALLOW is the default action at the zone level; DENY is the default at the server level.", fr: "ALLOW est l'action par défaut au niveau de la zone ; DENY est l'action par défaut au niveau du serveur." }
references:
  - title: DNS Policies Overview
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/deploy/dns-policies-overview
