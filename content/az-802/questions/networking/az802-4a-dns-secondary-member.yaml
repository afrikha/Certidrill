id: az802-4a-dns-secondary-member
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an Active Directory Domain Services (AD DS) domain named corp.contoso.com. The domain controllers DC1 and DC2 run the DNS Server role and host the Active Directory-integrated zone corp.contoso.com.

    A branch office contains a member server named Server5 that runs the DNS Server role. Server5 is not a domain controller and will not be promoted. The branch office clients use Server5 as their DNS server.

    You need to ensure that Server5 can answer queries for corp.contoso.com from a local copy of the zone when the WAN link to the main office is down.

    What should you do?
  fr: |
    Votre réseau contient un domaine Active Directory Domain Services (AD DS) nommé corp.contoso.com. Les contrôleurs de domaine DC1 et DC2 exécutent le rôle Serveur DNS et hébergent la zone intégrée à Active Directory corp.contoso.com.

    Une succursale contient un serveur membre nommé Server5 qui exécute le rôle Serveur DNS. Server5 n'est pas contrôleur de domaine et ne sera pas promu. Les clients de la succursale utilisent Server5 comme serveur DNS.

    Vous devez faire en sorte que Server5 puisse répondre aux requêtes pour corp.contoso.com à partir d'une copie locale de la zone lorsque la liaison WAN vers le siège est coupée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "On Server5, create an Active Directory-integrated primary zone for corp.contoso.com that uses the Domain replication scope.", fr: "Sur Server5, créer une zone principale intégrée à Active Directory pour corp.contoso.com qui utilise l'étendue de réplication Domain." } }
    - { id: b, text: { en: "On Server5, create a stub zone for corp.contoso.com that uses DC1 and DC2 as master servers.", fr: "Sur Server5, créer une zone de stub pour corp.contoso.com qui utilise DC1 et DC2 comme serveurs maîtres." } }
    - { id: c, text: { en: "On Server5, create a secondary zone for corp.contoso.com, and on DC1, allow zone transfers to Server5.", fr: "Sur Server5, créer une zone secondaire pour corp.contoso.com et, sur DC1, autoriser les transferts de zone vers Server5." } }
    - { id: d, text: { en: "On Server5, create a conditional forwarder for corp.contoso.com that targets DC1 and DC2.", fr: "Sur Server5, créer un redirecteur conditionnel pour corp.contoso.com qui cible DC1 et DC2." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A secondary zone is a read-only copy of the whole zone obtained by zone transfer, and it can be hosted on any DNS server, including a member server. Server5 then answers from its own copy while the WAN link is down. The server that provides the copy must allow transfers to Server5.
    fr: |
      Une zone secondaire est une copie en lecture seule de toute la zone, obtenue par transfert de zone, et elle peut être hébergée sur n'importe quel serveur DNS, y compris un serveur membre. Server5 répond alors à partir de sa propre copie pendant la coupure WAN. Le serveur qui fournit la copie doit autoriser les transferts vers Server5.
  options:
    a: { en: "Active Directory-integrated zones are available only on DNS servers that are domain controllers.", fr: "Les zones intégrées à Active Directory ne sont disponibles que sur les serveurs DNS qui sont contrôleurs de domaine." }
    b: { en: "A stub zone holds only the records that identify the authoritative name servers, not the host records, so Server5 would still need to reach DC1 or DC2.", fr: "Une zone de stub ne contient que les enregistrements qui identifient les serveurs de noms faisant autorité, pas les enregistrements d'hôte : Server5 devrait toujours joindre DC1 ou DC2." }
    d: { en: "A conditional forwarder holds no records; every query is sent to DC1 or DC2 over the WAN link.", fr: "Un redirecteur conditionnel ne contient aucun enregistrement ; chaque requête est envoyée à DC1 ou DC2 par la liaison WAN." }
references:
  - title: DNS zones in DNS Server on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/zone-types
