id: az802-4a-forwarder-facts
objective: "4.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an AD DS domain named contoso.com. A writable domain controller named DC1 and a read-only domain controller (RODC) named RODC1 run the DNS Server role. DC1 uses the server-level forwarders 10.0.0.10 and 10.0.0.11, and dynamic forwarder reordering is enabled.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine AD DS nommé contoso.com. Un contrôleur de domaine accessible en écriture nommé DC1 et un contrôleur de domaine en lecture seule (RODC) nommé RODC1 exécutent le rôle Serveur DNS. DC1 utilise les redirecteurs de niveau serveur 10.0.0.10 et 10.0.0.11, et le réordonnancement dynamique des redirecteurs est activé.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After you run Set-DnsServerForwarder -IPAddress 10.0.0.12 on DC1, DC1 uses three forwarders.
        fr: Après l'exécution de Set-DnsServerForwarder -IPAddress 10.0.0.12 sur DC1, DC1 utilise trois redirecteurs.
    - id: s2
      text:
        en: If 10.0.0.10 answers slowly several times in a row, DC1 moves it to the end of its list of forwarders.
        fr: Si 10.0.0.10 répond lentement plusieurs fois de suite, DC1 le place en fin de sa liste de redirecteurs.
    - id: s3
      text:
        en: You can create an Active Directory-integrated conditional forwarder for fabrikam.com on RODC1.
        fr: Vous pouvez créer un redirecteur conditionnel intégré à Active Directory pour fabrikam.com sur RODC1.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Set-DnsServerForwarder overwrites the existing server-level forwarders, so DC1 would use only 10.0.0.12; Add-DnsServerForwarder appends to the list. With dynamic forwarder reordering, which is enabled by default, a forwarder that answers slowly is moved to the end of the list, which is reset to the configured order about every 15 minutes. An Active Directory-integrated conditional forwarder must be created on a writable domain controller, not on an RODC.
    fr: |
      Set-DnsServerForwarder remplace les redirecteurs de niveau serveur existants : DC1 n'utiliserait que 10.0.0.12 ; Add-DnsServerForwarder ajoute à la liste. Avec le réordonnancement dynamique des redirecteurs, activé par défaut, un redirecteur qui répond lentement est placé en fin de liste, et la liste revient à l'ordre configuré environ toutes les 15 minutes. Un redirecteur conditionnel intégré à Active Directory doit être créé sur un contrôleur de domaine accessible en écriture, pas sur un RODC.
references:
  - title: Set-DnsServerForwarder (DnsServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsserver/set-dnsserverforwarder
  - title: Set Up DNS Forwarding in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/configure-dns-forwarding
