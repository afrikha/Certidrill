id: az802-4a-stub-partner
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a DNS server named DNS1 that runs Windows Server. A partner company, Fabrikam, Inc., hosts the zone fabrikam.com on its own DNS servers and regularly adds and removes name servers for the zone.

    You need DNS1 to resolve names in fabrikam.com by querying the authoritative name servers of the zone. The list of those name servers must stay up to date automatically, and DNS1 must not store a copy of the records of fabrikam.com.

    What should you create on DNS1?
  fr: |
    Contoso, Ltd. dispose d'un serveur DNS nommé DNS1 qui exécute Windows Server. Une société partenaire, Fabrikam, Inc., héberge la zone fabrikam.com sur ses propres serveurs DNS et ajoute ou retire régulièrement des serveurs de noms pour la zone.

    DNS1 doit résoudre les noms de fabrikam.com en interrogeant les serveurs de noms faisant autorité pour la zone. La liste de ces serveurs de noms doit rester à jour automatiquement, et DNS1 ne doit pas stocker de copie des enregistrements de fabrikam.com.

    Que devez-vous créer sur DNS1 ?
body:
  options:
    - { id: a, text: { en: "A stub zone for fabrikam.com", fr: "Une zone de stub pour fabrikam.com" } }
    - { id: b, text: { en: "A secondary zone for fabrikam.com", fr: "Une zone secondaire pour fabrikam.com" } }
    - { id: c, text: { en: "A conditional forwarder for fabrikam.com", fr: "Un redirecteur conditionnel pour fabrikam.com" } }
    - { id: d, text: { en: "A delegation for fabrikam.com", fr: "Une délégation pour fabrikam.com" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A stub zone contains only the records that identify the authoritative name servers of a zone, and it refreshes them from its master servers. DNS1 always knows the current name servers of fabrikam.com without holding its host records.
    fr: |
      Une zone de stub ne contient que les enregistrements qui identifient les serveurs de noms faisant autorité d'une zone, et elle les actualise depuis ses serveurs maîtres. DNS1 connaît toujours les serveurs de noms actuels de fabrikam.com sans détenir ses enregistrements d'hôte.
  options:
    b: { en: "A secondary zone is a full read-only copy of all the records of the zone, which the requirement forbids.", fr: "Une zone secondaire est une copie complète en lecture seule de tous les enregistrements de la zone, ce que l'exigence interdit." }
    c: { en: "A conditional forwarder uses a static list of IP addresses that you must update by hand when Fabrikam changes its name servers.", fr: "Un redirecteur conditionnel utilise une liste statique d'adresses IP que vous devez mettre à jour à la main quand Fabrikam change ses serveurs de noms." }
    d: { en: "A delegation is created in a parent zone for one of its child zones; DNS1 doesn't host a parent zone of fabrikam.com.", fr: "Une délégation se crée dans une zone parente pour l'une de ses zones enfants ; DNS1 n'héberge pas de zone parente de fabrikam.com." }
references:
  - title: DNS zones in DNS Server on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/zone-types
