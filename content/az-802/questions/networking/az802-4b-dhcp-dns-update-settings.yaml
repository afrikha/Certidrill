id: az802-4b-dhcp-dns-update-settings
objective: "4.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A DHCP server named **DHCP1** leases addresses to Windows and non-Windows clients in a domain named corp.fabrikam.com.

    You need to configure DHCP1 to meet the following requirements:

    - DHCP1 registers the A and PTR records of every client, whether or not the client requests it.
    - The DNS records of a client are deleted when its lease expires.
    - A registration fails, instead of overwriting the record, when a record with the same name already exists.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur DHCP nommé **DHCP1** attribue des adresses à des clients Windows et non Windows dans un domaine nommé corp.fabrikam.com.

    Vous devez configurer DHCP1 pour répondre aux exigences suivantes :

    - DHCP1 inscrit les enregistrements A et PTR de chaque client, que le client le demande ou non.
    - Les enregistrements DNS d'un client sont supprimés à l'expiration de son bail.
    - Une inscription échoue, au lieu d'écraser l'enregistrement, quand un enregistrement du même nom existe déjà.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Set-DhcpServerv4DnsSetting -ComputerName DHCP1 -DynamicUpdates [[upd]] `
      [[expiry]] $true [[protect]] $true
  slots:
    - id: upd
      options:
        - { id: onreq, text: OnClientRequest }
        - { id: always, text: Always }
        - { id: never, text: Never }
    - id: expiry
      options:
        - { id: older, text: -UpdateDnsRRForOlderClients }
        - { id: noptr, text: -DisableDnsPtrRRUpdate }
        - { id: delete, text: -DeleteDnsRROnLeaseExpiry }
    - id: protect
      options:
        - { id: protect, text: -NameProtection }
        - { id: older, text: -UpdateDnsRRForOlderClients }
        - { id: noptr, text: -DisableDnsPtrRRUpdate }
answer:
  values: { upd: always, expiry: delete, protect: protect }
explanation:
  correct:
    en: |
      With `-DynamicUpdates Always`, the DHCP server always registers the A and PTR records of its clients, whatever the client asks. `-DeleteDnsRROnLeaseExpiry $true` removes the records when the lease expires. `-NameProtection $true` makes the update fail instead of overwriting an existing record that has the same name.
    fr: |
      Avec `-DynamicUpdates Always`, le serveur DHCP inscrit toujours les enregistrements A et PTR de ses clients, quelle que soit la demande du client. `-DeleteDnsRROnLeaseExpiry $true` supprime les enregistrements à l'expiration du bail. `-NameProtection $true` fait échouer la mise à jour au lieu d'écraser un enregistrement existant du même nom.
  options:
    onreq: { en: "OnClientRequest registers records only as requested by the client, not for every client.", fr: "OnClientRequest n'inscrit les enregistrements que selon la demande du client, pas pour chaque client." }
    never: { en: "Never disables registration by the DHCP server.", fr: "Never désactive l'inscription par le serveur DHCP." }
    older: { en: "-UpdateDnsRRForOlderClients registers records for clients that don't request updates; it neither deletes records nor protects names.", fr: "-UpdateDnsRRForOlderClients inscrit les enregistrements des clients qui ne demandent pas de mise à jour ; il ne supprime pas d'enregistrements et ne protège pas les noms." }
    noptr: { en: "-DisableDnsPtrRRUpdate $true registers only A records, which breaks the first requirement.", fr: "-DisableDnsPtrRRUpdate $true n'inscrit que les enregistrements A, ce qui enfreint la première exigence." }
references:
  - title: Set-DhcpServerv4DnsSetting (DhcpServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/set-dhcpserverv4dnssetting
