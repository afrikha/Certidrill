id: az802-4a-outbound-ruleset
objective: "4.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual network named VNet1 that uses the Azure-provided DNS. VNet1 contains a subnet named snet-out (10.1.5.0/28) that is delegated to Microsoft.Network/dnsResolvers. VNet1 is connected to your on-premises network by a site-to-site VPN. The on-premises DNS servers 10.0.0.4 and 10.0.0.5 host the zone corp.contoso.com.

    You need the virtual machines in VNet1 to resolve the names in corp.contoso.com. The virtual machines must keep using the Azure-provided DNS.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un réseau virtuel Azure nommé VNet1 qui utilise le DNS fourni par Azure. VNet1 contient un sous-réseau nommé snet-out (10.1.5.0/28) délégué à Microsoft.Network/dnsResolvers. VNet1 est connecté à votre réseau local par un VPN site à site. Les serveurs DNS locaux 10.0.0.4 et 10.0.0.5 hébergent la zone corp.contoso.com.

    Les machines virtuelles de VNet1 doivent résoudre les noms de corp.contoso.com. Elles doivent continuer à utiliser le DNS fourni par Azure.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: res, text: { en: "Create a DNS private resolver that references VNet1.", fr: "Créer un résolveur privé DNS qui référence VNet1." } }
    - { id: out, text: { en: "Create an outbound endpoint that uses snet-out.", fr: "Créer un point de terminaison sortant qui utilise snet-out." } }
    - { id: rs, text: { en: "Create a DNS forwarding ruleset that uses the outbound endpoint and contains a rule for corp.contoso.com. that targets 10.0.0.4 and 10.0.0.5.", fr: "Créer un ensemble de règles de transfert DNS qui utilise le point de terminaison sortant et contient une règle pour corp.contoso.com. ciblant 10.0.0.4 et 10.0.0.5." } }
    - { id: link, text: { en: "Link the DNS forwarding ruleset to VNet1.", fr: "Lier l'ensemble de règles de transfert DNS à VNet1." } }
    - { id: in, text: { en: "Create an inbound endpoint that uses snet-out.", fr: "Créer un point de terminaison entrant qui utilise snet-out." } }
    - { id: vnetdns, text: { en: "Set the DNS servers of VNet1 to the IP address of the outbound endpoint.", fr: "Définir les serveurs DNS de VNet1 sur l'adresse IP du point de terminaison sortant." } }
    - { id: onprem, text: { en: "On the on-premises DNS servers, create a conditional forwarder for corp.contoso.com that targets 168.63.129.16.", fr: "Sur les serveurs DNS locaux, créer un redirecteur conditionnel pour corp.contoso.com qui cible 168.63.129.16." } }
answer:
  sequence: [ res, out, rs, link ]
explanation:
  correct:
    en: |
      The endpoints belong to a resolver, so the resolver comes first. The outbound endpoint is the egress point for conditional forwarding from Azure, and a forwarding ruleset is attached to an outbound endpoint, so the endpoint must exist before the ruleset. Linking the ruleset to VNet1 makes its rules apply to the queries that VMs send to the Azure-provided DNS.
    fr: |
      Les points de terminaison appartiennent à un résolveur : le résolveur vient donc en premier. Le point de terminaison sortant est le point de sortie du transfert conditionnel depuis Azure, et un ensemble de règles de transfert est associé à un point de terminaison sortant : le point de terminaison doit exister avant l'ensemble de règles. Lier l'ensemble de règles à VNet1 applique ses règles aux requêtes que les machines virtuelles envoient au DNS fourni par Azure.
  options:
    in: { en: "An inbound endpoint receives queries from on-premises; it isn't needed here, and snet-out can host only one endpoint.", fr: "Un point de terminaison entrant reçoit des requêtes venant du réseau local ; il n'est pas nécessaire ici, et snet-out ne peut héberger qu'un point de terminaison." }
    vnetdns: { en: "The VMs must keep the Azure-provided DNS, and an outbound endpoint doesn't accept queries from VMs.", fr: "Les machines virtuelles doivent conserver le DNS fourni par Azure, et un point de terminaison sortant n'accepte pas de requêtes des machines virtuelles." }
    onprem: { en: "corp.contoso.com is hosted on-premises; 168.63.129.16 is reachable only from inside Azure and doesn't host the zone.", fr: "corp.contoso.com est hébergée en local ; 168.63.129.16 n'est joignable que depuis Azure et n'héberge pas la zone." }
references:
  - title: Azure DNS Private Resolver Overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
