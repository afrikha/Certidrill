id: az802-4b-reservation-convert-bulk
objective: "4.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You manage a DHCP server named **DHCP1**. You need to perform the following tasks:

    - Turn the current lease of a security camera that has the address 10.80.3.57 into a reservation.
    - Create the reservations of the other cameras from a CSV file.

    How should you complete the command and the CSV file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez un serveur DHCP nommé **DHCP1**. Vous devez effectuer les tâches suivantes :

    - Transformer en réservation le bail actuel d'une caméra de sécurité qui a l'adresse 10.80.3.57.
    - Créer les réservations des autres caméras à partir d'un fichier CSV.

    Comment devez-vous compléter la commande et le fichier CSV ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Get-DhcpServerv4Lease -ComputerName DHCP1 -IPAddress 10.80.3.57 | [[cmd]] -ComputerName DHCP1

    # Content of C:\Data\Cameras.csv
    # ScopeId,IPAddress,Name,[[col]],Description
    # 10.80.3.0,10.80.3.60,CAM-13,00-1B-63-84-45-E6,Loading dock

    Import-Csv -Path C:\Data\Cameras.csv | Add-DhcpServerv4Reservation -ComputerName DHCP1
  slots:
    - id: cmd
      options:
        - { id: setresv, text: Set-DhcpServerv4Reservation }
        - { id: addlease, text: Add-DhcpServerv4Lease }
        - { id: addresv, text: Add-DhcpServerv4Reservation }
        - { id: addfilter, text: Add-DhcpServerv4Filter }
    - id: col
      options:
        - { id: clientid, text: ClientId }
        - { id: mac, text: MacAddress }
        - { id: state, text: AddressState }
answer:
  values: { cmd: addresv, col: clientid }
explanation:
  correct:
    en: |
      Piping the lease object returned by `Get-DhcpServerv4Lease` to `Add-DhcpServerv4Reservation` creates a reservation with the IP address and client ID of the lease. For bulk creation, the CSV file passed to `Add-DhcpServerv4Reservation` uses the column ClientId, which holds the MAC address of each device.
    fr: |
      Rediriger l'objet bail renvoyé par `Get-DhcpServerv4Lease` vers `Add-DhcpServerv4Reservation` crée une réservation avec l'adresse IP et l'identificateur client du bail. Pour la création en masse, le fichier CSV transmis à `Add-DhcpServerv4Reservation` utilise la colonne ClientId, qui contient l'adresse MAC de chaque appareil.
  options:
    setresv: { en: "Set-DhcpServerv4Reservation modifies an existing reservation; it doesn't create one.", fr: "Set-DhcpServerv4Reservation modifie une réservation existante ; il n'en crée pas." }
    addlease: { en: "Add-DhcpServerv4Lease adds a lease record, not a reservation.", fr: "Add-DhcpServerv4Lease ajoute un enregistrement de bail, pas une réservation." }
    addfilter: { en: "Add-DhcpServerv4Filter adds a MAC address to the allow or deny list.", fr: "Add-DhcpServerv4Filter ajoute une adresse MAC à la liste d'autorisation ou de refus." }
    mac: { en: "MacAddress is a parameter of the filter cmdlets; reservations identify the device with ClientId.", fr: "MacAddress est un paramètre des applets de commande de filtre ; les réservations identifient l'appareil avec ClientId." }
    state: { en: "AddressState is a property of a lease that shows its state; it doesn't identify the device.", fr: "AddressState est une propriété d'un bail qui indique son état ; elle n'identifie pas l'appareil." }
references:
  - title: Add-DhcpServerv4Reservation (DhcpServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/add-dhcpserverv4reservation
