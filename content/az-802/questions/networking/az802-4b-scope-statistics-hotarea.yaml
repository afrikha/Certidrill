id: az802-4b-scope-statistics-hotarea
objective: "4.2.2"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    A DHCP server named **DHCP1** hosts four scopes. The routers of each subnet relay DHCP requests to DHCP1. The following table shows the scopes of DHCP1.

    Users report the following issues:

    - On the subnet 10.20.6.0/24, no client has received an address since the scope was created yesterday.
    - On the subnet 10.20.7.0/24, clients that already have an address work normally, but new laptops receive an address in the 169.254.0.0/16 range.

    For each issue, select the scope that causes it.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur DHCP nommé **DHCP1** héberge quatre étendues. Les routeurs de chaque sous-réseau relaient les demandes DHCP vers DHCP1. Le tableau suivant présente les étendues de DHCP1.

    Les utilisateurs signalent les problèmes suivants :

    - Sur le sous-réseau 10.20.6.0/24, aucun client n'a reçu d'adresse depuis la création de l'étendue hier.
    - Sur le sous-réseau 10.20.7.0/24, les clients qui ont déjà une adresse fonctionnent normalement, mais les nouveaux ordinateurs portables reçoivent une adresse de la plage 169.254.0.0/16.

    Pour chaque problème, sélectionnez l'étendue qui en est la cause.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "No client of 10.20.6.0/24 receives an address", fr: "Aucun client de 10.20.6.0/24 ne reçoit d'adresse" }
    - id: p2
      text: { en: "New clients of 10.20.7.0/24 receive an APIPA address", fr: "Les nouveaux clients de 10.20.7.0/24 reçoivent une adresse APIPA" }
  grid:
    header: [{ en: "Scope", fr: "Étendue" }, { en: "State", fr: "État" }, { en: "Addresses in use", fr: "Adresses utilisées" }, { en: "Available addresses", fr: "Adresses disponibles" }]
    rows:
      - [{ text: 10.20.5.0, area: s5 }, { text: Active }, { text: { en: "41%", fr: "41 %" } }, { text: "148" }]
      - [{ text: 10.20.6.0, area: s6 }, { text: Inactive }, { text: { en: "0%", fr: "0 %" } }, { text: "200" }]
      - [{ text: 10.20.7.0, area: s7 }, { text: Active }, { text: { en: "100%", fr: "100 %" } }, { text: "0" }]
      - [{ text: 10.20.8.0, area: s8 }, { text: Active }, { text: { en: "96%", fr: "96 %" } }, { text: "9" }]
answer:
  values: { p1: s6, p2: s7 }
explanation:
  correct:
    en: |
      Only an active scope answers client requests, so the inactive scope 10.20.6.0 never leases an address; activate it once it is ready. The scope 10.20.7.0 has no free address left, so existing clients keep renewing their leases while new clients get no offer and fall back to APIPA. The 10.20.8.0 scope is nearly full but still has free addresses.
    fr: |
      Seule une étendue active répond aux demandes des clients : l'étendue inactive 10.20.6.0 n'attribue donc aucune adresse ; activez-la quand elle est prête. L'étendue 10.20.7.0 n'a plus d'adresse libre : les clients existants continuent de renouveler leurs baux, tandis que les nouveaux clients ne reçoivent aucune offre et se replient sur APIPA. L'étendue 10.20.8.0 est presque pleine mais a encore des adresses libres.
references:
  - title: Troubleshoot problems on the DHCP server
    url: https://learn.microsoft.com/en-us/windows-server/troubleshoot/troubleshoot-problems-on-dhcp-server
  - title: Add-DhcpServerv4Scope (DhcpServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/add-dhcpserverv4scope
