id: az802-4a-scavenging-disabled
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A DNS server named DNS1 hosts a primary zone named contoso.com. Aging was enabled on the zone six months ago with a no-refresh interval and a refresh interval of seven days each.

    Dynamically registered records whose timestamps are more than 60 days old are still in the zone. Get-DnsServerScavenging on DNS1 shows a ScavengingInterval of 00:00:00.

    You need stale records to be removed automatically once a week.

    Which command should you run on DNS1?
  fr: |
    Un serveur DNS nommé DNS1 héberge une zone principale nommée contoso.com. Le vieillissement a été activé sur la zone il y a six mois, avec un intervalle sans actualisation et un intervalle d'actualisation de sept jours chacun.

    Des enregistrements inscrits dynamiquement, dont l'horodatage date de plus de 60 jours, se trouvent toujours dans la zone. Get-DnsServerScavenging sur DNS1 affiche un ScavengingInterval de 00:00:00.

    Les enregistrements obsolètes doivent être supprimés automatiquement une fois par semaine.

    Quelle commande devez-vous exécuter sur DNS1 ?
body:
  options:
    - { id: a, text: "Set-DnsServerZoneAging -Name contoso.com -Aging $true -RefreshInterval 1.00:00:00" }
    - { id: b, text: "Set-DnsServerZoneAging -Name contoso.com -ScavengeServers 10.0.0.5" }
    - { id: c, text: "Set-DnsServerPrimaryZone -Name contoso.com -DynamicUpdate Secure" }
    - { id: d, text: "Set-DnsServerScavenging -ScavengingInterval 7.00:00:00" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Automatic cleanup needs both aging on the zone and scavenging on the server. Aging is already enabled, but a ScavengingInterval of 0 means that scavenging is disabled on DNS1. Setting the interval to seven days enables scavenging cycles every week.
    fr: |
      Le nettoyage automatique exige à la fois le vieillissement sur la zone et le nettoyage sur le serveur. Le vieillissement est déjà activé, mais un ScavengingInterval de 0 signifie que le nettoyage est désactivé sur DNS1. Définir l'intervalle sur sept jours active un cycle de nettoyage chaque semaine.
  options:
    a: { en: "Aging is already enabled on the zone; a shorter refresh interval changes when records become stale, but nothing removes them while server scavenging is off.", fr: "Le vieillissement est déjà activé sur la zone ; un intervalle d'actualisation plus court change le moment où les enregistrements deviennent obsolètes, mais rien ne les supprime tant que le nettoyage du serveur est désactivé." }
    b: { en: "ScavengeServers only restricts which servers may scavenge the zone; it doesn't enable scavenging.", fr: "ScavengeServers limite seulement les serveurs autorisés à nettoyer la zone ; il n'active pas le nettoyage." }
    c: { en: "The dynamic update setting controls who can register records, not the removal of stale records.", fr: "Le paramètre de mise à jour dynamique contrôle qui peut inscrire des enregistrements, pas la suppression des enregistrements obsolètes." }
references:
  - title: DNS aging and scavenging in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/aging-scavenging
  - title: Set-DnsServerScavenging (DnsServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsserver/set-dnsserverscavenging
