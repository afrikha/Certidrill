id: az802-4b-failover-prereqs
objective: "4.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A DHCP server named **DHCP1** runs Windows Server 2025 and hosts the scope 10.20.30.0/24. A DHCP server named **DHCP2** runs Windows Server 2022 at another site. Both servers are authorized in AD DS.

    On DHCP1, you run the Configure Failover wizard to create a load balance relationship with DHCP2 for the scope 10.20.30.0/24. The wizard fails.

    Which two issues could cause the failure?

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur DHCP nommé **DHCP1** exécute Windows Server 2025 et héberge l'étendue 10.20.30.0/24. Un serveur DHCP nommé **DHCP2** exécute Windows Server 2022 sur un autre site. Les deux serveurs sont autorisés dans AD DS.

    Sur DHCP1, vous exécutez l'assistant Configure Failover pour créer une relation en mode équilibrage de charge avec DHCP2 pour l'étendue 10.20.30.0/24. L'assistant échoue.

    Quels sont les deux problèmes qui peuvent provoquer cet échec ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: exists, text: { en: "DHCP2 still hosts a 10.20.30.0/24 scope from a former split-scope design.", fr: "DHCP2 héberge toujours une étendue 10.20.30.0/24 issue d'une ancienne conception à étendue fractionnée." } }
    - { id: time, text: { en: "The clocks of DHCP1 and DHCP2 differ by four minutes.", fr: "Les horloges de DHCP1 et de DHCP2 diffèrent de quatre minutes." } }
    - { id: version, text: { en: "DHCP2 runs Windows Server 2022.", fr: "DHCP2 exécute Windows Server 2022." } }
    - { id: subnet, text: { en: "DHCP1 and DHCP2 are on different subnets.", fr: "DHCP1 et DHCP2 se trouvent sur des sous-réseaux différents." } }
    - { id: auth, text: { en: "You cleared the Enable Message Authentication check box in the wizard.", fr: "Vous avez décoché la case Enable Message Authentication dans l'assistant." } }
answer: { optionIds: [exists, time] }
explanation:
  correct:
    en: |
      The scope that you add to a failover relationship must not already exist on the partner server; a scope left on DHCP2 by a split-scope design must be deleted first. The wizard also compares the clocks of the two servers and stops with a critical error when they differ by more than one minute.
    fr: |
      L'étendue ajoutée à une relation de basculement ne doit pas déjà exister sur le serveur partenaire ; une étendue laissée sur DHCP2 par une conception à étendue fractionnée doit d'abord être supprimée. L'assistant compare aussi les horloges des deux serveurs et s'arrête sur une erreur critique quand elles diffèrent de plus d'une minute.
  options:
    version: { en: "Failover partners must run Windows Server 2016 or later, so Windows Server 2022 is supported.", fr: "Les partenaires de basculement doivent exécuter Windows Server 2016 ou ultérieur : Windows Server 2022 est pris en charge." }
    subnet: { en: "Failover partners can be on different subnets.", fr: "Les partenaires de basculement peuvent se trouver sur des sous-réseaux différents." }
    auth: { en: "Message authentication with a shared secret is optional.", fr: "L'authentification des messages par un secret partagé est facultative." }
references:
  - title: DHCP failover in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-failover
  - title: Manage DHCP failover relationships in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/manage-dhcp-failover-relationships
