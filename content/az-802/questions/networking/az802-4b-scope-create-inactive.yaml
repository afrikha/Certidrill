id: az802-4b-scope-create-inactive
objective: "4.2.3"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You need to create a scope on a DHCP server named **DHCP1** for the subnet 10.70.8.0/22 of a new building. The scope must meet the following requirements:

    - Lease the addresses from 10.70.8.1 to 10.70.11.254.
    - Grant leases of 12 hours.
    - Not answer any client until the building opens next month.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer sur un serveur DHCP nommé **DHCP1** une étendue pour le sous-réseau 10.70.8.0/22 d'un nouveau bâtiment. L'étendue doit répondre aux exigences suivantes :

    - Attribuer les adresses de 10.70.8.1 à 10.70.11.254.
    - Accorder des baux de 12 heures.
    - Ne répondre à aucun client avant l'ouverture du bâtiment le mois prochain.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Add-DhcpServerv4Scope -ComputerName DHCP1 -Name "Building-C" `
      -StartRange 10.70.8.1 -EndRange 10.70.11.254 `
      -SubnetMask [[mask]] -LeaseDuration [[lease]] [[state]]
  slots:
    - id: mask
      options:
        - { id: m24, text: 255.255.255.0 }
        - { id: m23, text: 255.255.254.0 }
        - { id: m22, text: 255.255.252.0 }
        - { id: m21, text: 255.255.248.0 }
    - id: lease
      options:
        - { id: min12, text: "0.00:12:00" }
        - { id: h12, text: "0.12:00:00" }
        - { id: d12, text: "12.00:00:00" }
    - id: state
      options:
        - { id: active, text: -State Active }
        - { id: nopol, text: -ActivatePolicies $false }
        - { id: inactive, text: -State InActive }
answer:
  values: { mask: m22, lease: h12, state: inactive }
explanation:
  correct:
    en: |
      A /22 subnet uses the mask 255.255.252.0, which covers 10.70.8.0 to 10.70.11.255. -LeaseDuration uses the format day.hrs:mins:secs, so 12 hours is 0.12:00:00. Only an active scope answers clients, so -State InActive creates the scope without serving it until you activate it.
    fr: |
      Un sous-réseau /22 utilise le masque 255.255.252.0, qui couvre 10.70.8.0 à 10.70.11.255. -LeaseDuration utilise le format jours.heures:minutes:secondes ; 12 heures s'écrit donc 0.12:00:00. Seule une étendue active répond aux clients : -State InActive crée l'étendue sans la servir tant que vous ne l'activez pas.
  options:
    m24: { en: "255.255.255.0 (/24) doesn't contain the range up to 10.70.11.254.", fr: "255.255.255.0 (/24) ne contient pas la plage jusqu'à 10.70.11.254." }
    m23: { en: "255.255.254.0 (/23) stops at 10.70.9.255.", fr: "255.255.254.0 (/23) s'arrête à 10.70.9.255." }
    m21: { en: "255.255.248.0 (/21) describes 10.70.8.0 to 10.70.15.255, not the /22 subnet of the building.", fr: "255.255.248.0 (/21) décrit 10.70.8.0 à 10.70.15.255, pas le sous-réseau /22 du bâtiment." }
    min12: { en: "0.00:12:00 is 12 minutes.", fr: "0.00:12:00 correspond à 12 minutes." }
    d12: { en: "12.00:00:00 is 12 days.", fr: "12.00:00:00 correspond à 12 jours." }
    active: { en: "An active scope starts answering clients immediately.", fr: "Une étendue active commence immédiatement à répondre aux clients." }
    nopol: { en: "-ActivatePolicies $false only disables policy enforcement; the scope still answers clients.", fr: "-ActivatePolicies $false désactive seulement l'application des stratégies ; l'étendue répond toujours aux clients." }
references:
  - title: Add-DhcpServerv4Scope (DhcpServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/add-dhcpserverv4scope
