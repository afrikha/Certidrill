id: az802-4b-reservation-new-nic
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A DHCP server named **DHCP1** has a reservation of 10.10.5.30 for a printer named **PRN-ACC**. Users print to 10.10.5.30.

    Technicians replace the network card of PRN-ACC. Since then, PRN-ACC receives another address from the scope, and users can't print.

    You need PRN-ACC to receive 10.10.5.30 again. PRN-ACC must remain a DHCP client.

    What should you do on DHCP1?
  fr: |
    Un serveur DHCP nommé **DHCP1** dispose d'une réservation de 10.10.5.30 pour une imprimante nommée **PRN-ACC**. Les utilisateurs impriment vers 10.10.5.30.

    Des techniciens remplacent la carte réseau de PRN-ACC. Depuis, PRN-ACC reçoit une autre adresse de l'étendue, et les utilisateurs ne peuvent plus imprimer.

    PRN-ACC doit de nouveau recevoir 10.10.5.30. PRN-ACC doit rester client DHCP.

    Que devez-vous faire sur DHCP1 ?
body:
  options:
    - { id: clientid, text: { en: "Run Set-DhcpServerv4Reservation to set the client ID of the reservation to the MAC address of the new network card.", fr: "Exécuter Set-DhcpServerv4Reservation pour définir comme identificateur client de la réservation l'adresse MAC de la nouvelle carte réseau." } }
    - { id: type, text: { en: "Run Set-DhcpServerv4Reservation to set the type of the reservation to Both.", fr: "Exécuter Set-DhcpServerv4Reservation pour définir le type de la réservation sur Both." } }
    - { id: excl, text: { en: "Run Add-DhcpServerv4ExclusionRange to exclude 10.10.5.30 from the scope.", fr: "Exécuter Add-DhcpServerv4ExclusionRange pour exclure 10.10.5.30 de l'étendue." } }
    - { id: conflict, text: { en: "Run Set-DhcpServerSetting to set the number of conflict detection attempts to 2.", fr: "Exécuter Set-DhcpServerSetting pour définir à 2 le nombre de tentatives de détection de conflits." } }
answer: { optionId: clientid }
explanation:
  correct:
    en: |
      An IPv4 reservation is matched on the client ID, which is the MAC address for Windows DHCP clients. The new network card has another MAC address, so the printer is treated as an unknown client and receives a dynamic lease. Updating the client ID of the existing reservation restores the match; the printer gets 10.10.5.30 when it renews or rebinds its lease.
    fr: |
      Une réservation IPv4 est associée à l'identificateur client, qui est l'adresse MAC pour les clients DHCP Windows. La nouvelle carte réseau a une autre adresse MAC : l'imprimante est traitée comme un client inconnu et reçoit un bail dynamique. Mettre à jour l'identificateur client de la réservation existante rétablit la correspondance ; l'imprimante obtient 10.10.5.30 quand elle renouvelle son bail ou tente une nouvelle liaison (rebind).
  options:
    type: { en: "Both is already the default type; the type controls DHCP or BOOTP requests, not which device matches the reservation.", fr: "Both est déjà le type par défaut ; le type concerne les demandes DHCP ou BOOTP, pas l'appareil qui correspond à la réservation." }
    excl: { en: "Excluding the address doesn't link it to the new MAC address; the printer would still get a dynamic lease.", fr: "Exclure l'adresse ne la lie pas à la nouvelle adresse MAC ; l'imprimante recevrait toujours un bail dynamique." }
    conflict: { en: "Conflict detection checks whether an address is in use before leasing it; it doesn't identify the printer.", fr: "La détection de conflits vérifie si une adresse est utilisée avant de l'attribuer ; elle n'identifie pas l'imprimante." }
references:
  - title: Add-DhcpServerv4Reservation (DhcpServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dhcpserver/add-dhcpserverv4reservation
