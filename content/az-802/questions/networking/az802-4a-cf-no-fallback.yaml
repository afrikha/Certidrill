id: az802-4a-cf-no-fallback
objective: "4.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Your network contains an AD DS forest. The forest contains a domain named corp.contoso.com and two other domains. All domain controllers run the DNS Server role, and they use server-level forwarders to an ISP for internet names.

    A partner hosts a private namespace named fabrikam.local on the DNS servers 192.168.20.10 and 192.168.20.11. You need to configure name resolution for fabrikam.local to meet the following requirements:

    - The configuration must be available on the DNS servers of the domain controllers in corp.contoso.com only.
    - If both partner servers fail to answer, the domain controllers must not try to resolve fabrikam.local names by any other means.

    You run the commands on DC1, a domain controller in corp.contoso.com.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient une forêt AD DS. La forêt contient un domaine nommé corp.contoso.com et deux autres domaines. Tous les contrôleurs de domaine exécutent le rôle Serveur DNS et utilisent des redirecteurs de niveau serveur vers un FAI pour les noms internet.

    Un partenaire héberge un espace de noms privé nommé fabrikam.local sur les serveurs DNS 192.168.20.10 et 192.168.20.11. Vous devez configurer la résolution de noms pour fabrikam.local de façon à satisfaire les exigences suivantes :

    - La configuration doit être disponible sur les serveurs DNS des contrôleurs de domaine de corp.contoso.com uniquement.
    - Si les deux serveurs du partenaire ne répondent pas, les contrôleurs de domaine ne doivent pas tenter de résoudre les noms de fabrikam.local par un autre moyen.

    Vous exécutez les commandes sur DC1, un contrôleur de domaine de corp.contoso.com.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Add-DnsServerConditionalForwarderZone -Name "fabrikam.local" `
      -[[servers]] 192.168.20.10, 192.168.20.11 -ReplicationScope "[[scope]]"
    Set-DnsServerConditionalForwarderZone -Name "fabrikam.local" -[[fallback]] $false
  slots:
    - id: servers
      options:
        - { id: master, text: MasterServers }
        - { id: ip, text: IPAddress }
        - { id: ns, text: NameServer }
    - id: scope
      options:
        - { id: forest, text: Forest }
        - { id: domain, text: Domain }
        - { id: legacy, text: Legacy }
    - id: fallback
      options:
        - { id: recursion, text: UseRecursion }
        - { id: roothint, text: UseRootHint }
        - { id: reorder, text: EnableReordering }
answer:
  values: { servers: master, scope: domain, fallback: recursion }
explanation:
  correct:
    en: |
      Add-DnsServerConditionalForwarderZone takes the target servers in -MasterServers. The Domain scope replicates the forwarder to the DNS servers on the domain controllers of corp.contoso.com only. UseRecursion set to $false prevents the server from resolving the query by other means, such as the server-level forwarders or root hints, after the conditional forwarder fails.
    fr: |
      Add-DnsServerConditionalForwarderZone reçoit les serveurs cibles dans -MasterServers. L'étendue Domain réplique le redirecteur vers les serveurs DNS des contrôleurs de domaine de corp.contoso.com uniquement. UseRecursion défini sur $false empêche le serveur de résoudre la requête par d'autres moyens, comme les redirecteurs de niveau serveur ou les indications de racine, après l'échec du redirecteur conditionnel.
  options:
    ip: { en: "-IPAddress is the parameter of Set-DnsServerForwarder for server-level forwarders.", fr: "-IPAddress est le paramètre de Set-DnsServerForwarder pour les redirecteurs de niveau serveur." }
    ns: { en: "-NameServer belongs to Add-DnsServerZoneDelegation.", fr: "-NameServer appartient à Add-DnsServerZoneDelegation." }
    forest: { en: "Forest would also replicate the forwarder to the two other domains.", fr: "Forest répliquerait aussi le redirecteur vers les deux autres domaines." }
    legacy: { en: "Legacy stores the forwarder in the domain partition, which replicates to every domain controller of the domain, including those that don't run DNS.", fr: "Legacy stocke le redirecteur dans la partition de domaine, répliquée vers tous les contrôleurs de domaine du domaine, y compris ceux qui n'exécutent pas DNS." }
    roothint: { en: "UseRootHint is a setting of the server-level forwarders (Set-DnsServerForwarder), not of a conditional forwarder.", fr: "UseRootHint est un paramètre des redirecteurs de niveau serveur (Set-DnsServerForwarder), pas d'un redirecteur conditionnel." }
    reorder: { en: "EnableReordering controls dynamic reordering of server-level forwarders.", fr: "EnableReordering contrôle le réordonnancement dynamique des redirecteurs de niveau serveur." }
references:
  - title: Add-DnsServerConditionalForwarderZone (DnsServer)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsserver/add-dnsserverconditionalforwarderzone
  - title: Set Up DNS Forwarding in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/configure-dns-forwarding
