id: az802-4a-dnssec-deploy-order
objective: "4.1.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Your network contains the following DNS servers. None of them is a domain controller.

    | Name | Configuration |
    | --- | --- |
    | DNS1 | Hosts the file-backed primary zone secure.contoso.com |
    | DNS3 | Hosts a secondary copy of secure.contoso.com |
    | DNS2 | Recursive DNS server used by the domain-joined Windows 11 clients |

    The parent zone contoso.com isn't signed. You need to sign secure.contoso.com and ensure that the clients accept only validated answers for names in secure.contoso.com. Client name resolution must never fail during the deployment.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Votre réseau contient les serveurs DNS suivants. Aucun n'est contrôleur de domaine.

    | Nom | Configuration |
    | --- | --- |
    | DNS1 | Héberge la zone principale stockée dans un fichier secure.contoso.com |
    | DNS3 | Héberge une copie secondaire de secure.contoso.com |
    | DNS2 | Serveur DNS récursif utilisé par les clients Windows 11 joints au domaine |

    La zone parente contoso.com n'est pas signée. Vous devez signer secure.contoso.com et faire en sorte que les clients n'acceptent que des réponses validées pour les noms de secure.contoso.com. La résolution de noms des clients ne doit jamais échouer pendant le déploiement.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: sign, text: { en: "On DNS1, sign secure.contoso.com.", fr: "Sur DNS1, signer secure.contoso.com." } }
    - { id: ta, text: { en: "On DNS2, add the DNSKEY records of secure.contoso.com as trust anchors.", fr: "Sur DNS2, ajouter les enregistrements DNSKEY de secure.contoso.com comme ancres d'approbation." } }
    - { id: nrpt, text: { en: "Apply to the clients a GPO with an NRPT rule for .secure.contoso.com that requires DNSSEC validation.", fr: "Appliquer aux clients un GPO contenant une règle NRPT pour .secure.contoso.com qui exige la validation DNSSEC." } }
    - { id: dns3, text: { en: "On DNS3, sign secure.contoso.com.", fr: "Sur DNS3, signer secure.contoso.com." } }
    - { id: root, text: { en: "On DNS2, run Add-DnsServerTrustAnchor -Root.", fr: "Sur DNS2, exécuter Add-DnsServerTrustAnchor -Root." } }
    - { id: nrptopt, text: { en: "Apply to the clients a GPO with an NRPT rule for .secure.contoso.com that enables DNSSEC without requiring validation.", fr: "Appliquer aux clients un GPO contenant une règle NRPT pour .secure.contoso.com qui active DNSSEC sans exiger la validation." } }
answer:
  sequence: [ sign, ta, nrpt ]
explanation:
  correct:
    en: |
      Signing happens on the primary, authoritative server and creates the DNSKEY records. Those keys are then added as trust anchors on DNS2, the non-authoritative server that validates for the clients. The NRPT rule that requires validation comes last: deployed earlier, it would make clients reject every answer that DNS2 can't validate, and resolution would fail.
    fr: |
      La signature se fait sur le serveur principal faisant autorité et crée les enregistrements DNSKEY. Ces clés sont ensuite ajoutées comme ancres d'approbation sur DNS2, le serveur sans autorité qui valide pour les clients. La règle NRPT qui exige la validation vient en dernier : déployée plus tôt, elle ferait rejeter par les clients toute réponse que DNS2 ne peut pas valider, et la résolution échouerait.
  options:
    dns3: { en: "A zone can't be signed on a server that hosts a secondary copy; DNS3 receives the signed records by zone transfer.", fr: "Une zone ne peut pas être signée sur un serveur qui en héberge une copie secondaire ; DNS3 reçoit les enregistrements signés par transfert de zone." }
    root: { en: "Root trust anchors can't validate secure.contoso.com, which has no signed chain from the root.", fr: "Les ancres d'approbation de la racine ne peuvent pas valider secure.contoso.com, qui n'a pas de chaîne signée depuis la racine." }
    nrptopt: { en: "Without validation required, clients would still accept unvalidated answers.", fr: "Sans validation obligatoire, les clients accepteraient encore des réponses non validées." }
references:
  - title: Sign DNS Zones with DNSSEC on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/sign-dnssec-zone
  - title: Validate and secure DNS responses using DNSSEC on DNS Server in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/validate-dnssec-responses
