id: az802-1b-gpo-loopback-merge
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In the **corp.contoso.com** domain, the session hosts **RDSH1** and **RDSH2** are in the **RDS-Hosts** OU, and the user accounts are in the **Staff** OU. The **RDS-Lockdown** GPO contains User Configuration settings and is linked to the RDS-Hosts OU.

    When users sign in to RDSH1 or RDSH2, they must receive the settings of the GPOs that normally apply to their account, plus the user settings of RDS-Lockdown. When a setting conflicts, the value from RDS-Lockdown must win. Users who sign in to other computers must not receive the settings of RDS-Lockdown.

    What should you do?
  fr: |
    Dans le domaine **corp.contoso.com**, les hôtes de session **RDSH1** et **RDSH2** se trouvent dans l'UO **RDS-Hosts**, et les comptes d'utilisateur dans l'UO **Staff**. Le GPO **RDS-Lockdown** contient des paramètres de Configuration utilisateur et est lié à l'UO RDS-Hosts.

    Lorsque les utilisateurs se connectent à RDSH1 ou RDSH2, ils doivent recevoir les paramètres des GPO qui s'appliquent habituellement à leur compte, ainsi que les paramètres utilisateur de RDS-Lockdown. En cas de conflit, la valeur de RDS-Lockdown doit l'emporter. Les utilisateurs qui se connectent à d'autres ordinateurs ne doivent pas recevoir les paramètres de RDS-Lockdown.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In RDS-Lockdown, enable user Group Policy loopback processing in Replace mode.", fr: "Dans RDS-Lockdown, activer le traitement par bouclage de la stratégie de groupe utilisateur en mode Replace." } }
    - { id: b, text: { en: "Link RDS-Lockdown to the Staff OU and set the link to Enforced.", fr: "Lier RDS-Lockdown à l'UO Staff et définir le lien sur Appliqué." } }
    - { id: c, text: { en: "In RDS-Lockdown, enable user Group Policy loopback processing in Merge mode.", fr: "Dans RDS-Lockdown, activer le traitement par bouclage de la stratégie de groupe utilisateur en mode Merge." } }
    - { id: d, text: { en: "Enable Block Inheritance on the RDS-Hosts OU.", fr: "Activer Bloquer l'héritage sur l'UO RDS-Hosts." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Without loopback, the User Configuration of a GPO linked to a computer OU is ignored. Loopback (a computer setting under Computer Configuration\\Policies\\Administrative Templates\\System\\Group Policy) in Merge mode gathers the user's GPOs, then appends the GPOs of the computer, so the computer's GPOs have higher precedence on conflicts while the user keeps their normal settings."
    fr: "Sans bouclage, la Configuration utilisateur d'un GPO lié à une UO d'ordinateurs est ignorée. Le bouclage (un paramètre ordinateur sous Configuration ordinateur\\Stratégies\\Modèles d'administration\\Système\\Stratégie de groupe) en mode Merge rassemble les GPO de l'utilisateur, puis y ajoute ceux de l'ordinateur : les GPO de l'ordinateur ont la priorité en cas de conflit, et l'utilisateur garde ses paramètres habituels."
  options:
    a: { en: "Replace mode ignores the user's own GPOs, so users would lose their normal settings on RDSH1 and RDSH2.", fr: "Le mode Replace ignore les GPO propres à l'utilisateur : ils perdraient leurs paramètres habituels sur RDSH1 et RDSH2." }
    b: { en: "Linked to the Staff OU, the settings would apply to the users on every computer they sign in to.", fr: "Lié à l'UO Staff, les paramètres s'appliqueraient aux utilisateurs sur tous les ordinateurs où ils se connectent." }
    d: { en: "Block Inheritance stops parent GPOs from applying to the session hosts; it doesn't apply user settings from the computer's GPOs.", fr: "Bloquer l'héritage empêche les GPO parents de s'appliquer aux hôtes de session ; il n'applique pas les paramètres utilisateur des GPO de l'ordinateur." }
references:
  - title: Group Policy processing for Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-processing
