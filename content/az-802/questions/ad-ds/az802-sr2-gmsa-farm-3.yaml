id: az802-sr2-gmsa-farm-3
objective: "1.3.3"
type: series_yesno
series: az802-sr2-gmsa-farm
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You create a gMSA that the App1 administrators group can retrieve and configure App1 on each server to use it.
  fr: |
    Vous créez un gMSA que le groupe des administrateurs d'App1 peut récupérer et configurez App1 sur chaque serveur pour l'utiliser.
body:
  solution:
    en: |
      You create a global security group named **App1Admins** that contains the user accounts of the App1 administrators. You run `New-ADServiceAccount -Name gmsaApp1 -DNSHostName gmsaApp1.contoso.com -PrincipalsAllowedToRetrieveManagedPassword App1Admins`. Signed in as a member of App1Admins, you run `Install-ADServiceAccount -Identity gmsaApp1` on Web1, Web2 and Web3, and you configure App1 to log on as **CONTOSO\gmsaApp1$** with a blank password.
    fr: |
      Vous créez un groupe de sécurité global nommé **App1Admins** qui contient les comptes d'utilisateur des administrateurs d'App1. Vous exécutez `New-ADServiceAccount -Name gmsaApp1 -DNSHostName gmsaApp1.contoso.com -PrincipalsAllowedToRetrieveManagedPassword App1Admins`. Connecté en tant que membre d'App1Admins, vous exécutez `Install-ADServiceAccount -Identity gmsaApp1` sur Web1, Web2 et Web3, puis vous configurez App1 pour qu'il ouvre une session en tant que **CONTOSO\gmsaApp1$** avec un mot de passe vide.
answer: { value: false }
explanation:
  correct:
    en: |
      PrincipalsAllowedToRetrieveManagedPassword defines which systems can use the gMSA, so it must contain the computer accounts of the hosts, directly or through a group such as WebServers. The service runs in the context of Web1, Web2 and Web3, which are not in App1Admins, so the servers cannot retrieve the password; Test-ADServiceAccount would fail on them and App1 would not start.
    fr: |
      PrincipalsAllowedToRetrieveManagedPassword définit les systèmes qui peuvent utiliser le gMSA : il doit contenir les comptes d'ordinateur des hôtes, directement ou par un groupe comme WebServers. Le service s'exécute dans le contexte de Web1, Web2 et Web3, qui ne sont pas membres d'App1Admins : les serveurs ne peuvent pas récupérer le mot de passe, Test-ADServiceAccount échouerait sur eux et App1 ne démarrerait pas.
