id: az802-1a-prp-reveal-prepopulate
objective: "1.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A read-only domain controller named **RODC1** is in the Lyon branch of the **corp.contoso.com** domain. **DC1** is a writable domain controller in the hub site. A new employee, Ana Ruiz, will start working in Lyon tomorrow; her account is already a member of a group in the Allowed list of RODC1.

    You need to:

    - display the accounts whose passwords are currently stored on RODC1;
    - store the password of Ana Ruiz on RODC1 before her first sign-in.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un contrôleur de domaine en lecture seule nommé **RODC1** se trouve dans la succursale de Lyon du domaine **corp.contoso.com**. **DC1** est un contrôleur de domaine accessible en écriture du site principal. Une nouvelle employée, Ana Ruiz, commencera demain à Lyon ; son compte est déjà membre d'un groupe de la liste Autorisés de RODC1.

    Vous devez :

    - afficher les comptes dont les mots de passe sont actuellement stockés sur RODC1 ;
    - stocker le mot de passe d'Ana Ruiz sur RODC1 avant sa première connexion.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    repadmin /prp view RODC1 [[list]]
    repadmin [[op]] RODC1 DC1 "CN=Ana Ruiz,OU=Lyon,DC=corp,DC=contoso,DC=com"
  slots:
    - id: list
      options:
        - { id: reveal, text: reveal }
        - { id: auth2, text: auth2 }
        - { id: allow, text: allow }
        - { id: deny, text: deny }
    - id: op
      options:
        - { id: rodcpwdrepl, text: /rodcpwdrepl }
        - { id: replsingleobj, text: /replsingleobj }
        - { id: syncall, text: /syncall }
        - { id: replicate, text: /replicate }
answer:
  values: { list: reveal, op: rodcpwdrepl }
explanation:
  correct:
    en: "The reveal list contains the accounts whose passwords have been replicated to and stored on the RODC. repadmin /rodcpwdrepl triggers the replication of the password of the specified user from a source domain controller (DC1) to the RODC, which prepopulates the cache before the user signs in."
    fr: "La liste reveal contient les comptes dont les mots de passe ont été répliqués et stockés sur le RODC. repadmin /rodcpwdrepl déclenche la réplication du mot de passe de l'utilisateur indiqué depuis un contrôleur de domaine source (DC1) vers le RODC, ce qui préremplit le cache avant la connexion de l'utilisateur."
  options:
    auth2: { en: "auth2 lists the accounts that the RODC authenticated, whether or not their passwords are stored.", fr: "auth2 liste les comptes que le RODC a authentifiés, que leurs mots de passe soient stockés ou non." }
    allow: { en: "allow lists the principals that the policy allows, not the passwords actually cached.", fr: "allow liste les principaux que la stratégie autorise, pas les mots de passe réellement mis en cache." }
    replsingleobj: { en: "/replsingleobj replicates an object between two domain controllers; secrets are not sent to an RODC this way.", fr: "/replsingleobj réplique un objet entre deux contrôleurs de domaine ; les secrets ne sont pas envoyés à un RODC de cette façon." }
    syncall: { en: "/syncall synchronizes a domain controller with all its partners; it does not prepopulate a specific password.", fr: "/syncall synchronise un contrôleur de domaine avec tous ses partenaires ; il ne préremplit pas un mot de passe précis." }
references:
  - title: Repadmin /prp
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc835090(v=ws.11)
  - title: Repadmin
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc770963(v=ws.11)
