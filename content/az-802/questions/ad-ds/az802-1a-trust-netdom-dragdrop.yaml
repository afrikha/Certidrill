id: az802-1a-trust-netdom-dragdrop
objective: "1.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    The **northwind.com** forest has an outbound forest trust with the **adventure-works.com** forest. You manage the trust by using `netdom trust` from northwind.com.

    Which netdom trust option should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    La forêt **northwind.com** possède une approbation de forêt sortante avec la forêt **adventure-works.com**. Vous gérez l'approbation avec `netdom trust` depuis northwind.com.

    Quelle option de netdom trust devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: selective, text: "/selectiveauth:yes" }
    - { id: sidhistory, text: "/enablesidhistory:yes" }
    - { id: reset, text: /reset }
    - { id: suffixes, text: /namesuffixes }
    - { id: realm, text: /realm }
    - { id: quarantine, text: "/quarantine:no" }
  targets:
    - { id: t1, text: { en: "Allow adventure-works.com users to authenticate only to the northwind.com computers on which they are explicitly permitted", fr: "Permettre aux utilisateurs d'adventure-works.com de s'authentifier uniquement auprès des ordinateurs de northwind.com sur lesquels ils sont explicitement autorisés" } }
    - { id: t2, text: { en: "Let users migrated into adventure-works.com use their SID history to access northwind.com resources", fr: "Permettre aux utilisateurs migrés vers adventure-works.com d'utiliser leur historique SID pour accéder aux ressources de northwind.com" } }
    - { id: t3, text: { en: "Generate a new trust secret for the trust", fr: "Générer un nouveau secret pour l'approbation" } }
    - { id: t4, text: { en: "List the name suffixes routed through the forest trust", fr: "Lister les suffixes de noms routés par l'approbation de forêt" } }
answer:
  mapping: { t1: selective, t2: sidhistory, t3: reset, t4: suffixes }
explanation:
  correct:
    en: /selectiveauth:yes enables selective authentication on an outbound forest or external trust. /enablesidhistory:yes lets migrated users of the trusted forest use SID history over an outbound forest trust. /reset resets the trust secret, and /namesuffixes lists the routed name suffixes of a forest trust.
    fr: /selectiveauth:yes active l'authentification sélective sur une approbation de forêt ou externe sortante. /enablesidhistory:yes permet aux utilisateurs migrés de la forêt approuvée d'utiliser l'historique SID sur une approbation de forêt sortante. /reset réinitialise le secret de l'approbation, et /namesuffixes liste les suffixes de noms routés d'une approbation de forêt.
  options:
    realm: { en: "/realm creates a trust with a non-Windows Kerberos realm.", fr: "/realm crée une approbation avec un domaine Kerberos non Windows." }
    quarantine: { en: "/quarantine:no disables SID filtering so that any SID is accepted; it does not target migrated users specifically.", fr: "/quarantine:no désactive le filtrage SID pour accepter n'importe quel SID ; il ne cible pas spécifiquement les utilisateurs migrés." }
references:
  - title: Netdom trust
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netdom-trust
