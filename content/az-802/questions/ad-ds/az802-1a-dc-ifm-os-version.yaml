id: az802-1a-dc-ifm-os-version
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The **corp.contoso.com** domain has domain controllers in a hub site: DC1 runs Windows Server 2022 and DC2 runs Windows Server 2025. A branch office is connected by a slow WAN link.

    You plan to promote a branch server named DC3 that runs Windows Server 2025 by using Install from Media (IFM) to minimize replication traffic over the WAN. An administrator created IFM media on DC1 and copied it to DC3, but the promotion of DC3 from this media fails.

    What should you do?
  fr: |
    Le domaine **corp.contoso.com** possède des contrôleurs de domaine dans un site principal : DC1 exécute Windows Server 2022 et DC2 exécute Windows Server 2025. Une succursale est reliée par une liaison WAN lente.

    Vous prévoyez de promouvoir un serveur de la succursale nommé DC3, qui exécute Windows Server 2025, à l'aide de l'installation à partir du support (IFM) pour réduire au minimum le trafic de réplication sur le WAN. Un administrateur a créé un support IFM sur DC1 et l'a copié sur DC3, mais la promotion de DC3 à partir de ce support échoue.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add -ReplicationSourceDC DC1 to the Install-ADDSDomainController command.", fr: "Ajouter -ReplicationSourceDC DC1 à la commande Install-ADDSDomainController." } }
    - { id: b, text: { en: "Add -CriticalReplicationOnly to the Install-ADDSDomainController command.", fr: "Ajouter -CriticalReplicationOnly à la commande Install-ADDSDomainController." } }
    - { id: c, text: { en: "Copy the NTDS.dit file of DC1 to the media folder on DC3.", fr: "Copier le fichier NTDS.dit de DC1 dans le dossier du support sur DC3." } }
    - { id: d, text: { en: "Create new IFM media on DC2 and use it to promote DC3.", fr: "Créer un nouveau support IFM sur DC2 et l'utiliser pour promouvoir DC3." } }
answer: { optionId: d }
explanation:
  correct:
    en: IFM does not work across operating system versions. To promote a Windows Server 2025 domain controller from media, the media must be created on a domain controller that runs Windows Server 2025, which is DC2 here.
    fr: L'installation IFM ne fonctionne pas entre versions différentes du système d'exploitation. Pour promouvoir un contrôleur de domaine Windows Server 2025 à partir d'un support, ce support doit être créé sur un contrôleur de domaine qui exécute Windows Server 2025, ici DC2.
  options:
    a: { en: "Choosing DC1 as the replication source does not make media created on another OS version usable.", fr: "Choisir DC1 comme source de réplication ne rend pas utilisable un support créé sur une autre version du système d'exploitation." }
    b: { en: "-CriticalReplicationOnly defers noncritical replication until after the restart; it does not fix incompatible media.", fr: "-CriticalReplicationOnly reporte la réplication non critique après le redémarrage ; il ne corrige pas un support incompatible." }
    c: { en: "Copying the live database file is not a supported way to create installation media, and the OS version mismatch remains.", fr: "Copier le fichier de base de données en cours d'utilisation n'est pas une méthode prise en charge pour créer un support d'installation, et l'écart de version subsiste." }
references:
  - title: Install Active Directory Domain Services on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/install-active-directory-domain-services--level-100-
