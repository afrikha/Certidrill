id: az802-1a-prp-add-allowed
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The **corp.contoso.com** domain has several read-only domain controllers, including **RODC1** in the Lyon branch. A group named **Lyon-Sales** has the distinguished name CN=Lyon-Sales,OU=Groups,DC=corp,DC=contoso,DC=com.

    You need to allow the passwords of the members of Lyon-Sales to be cached on RODC1 only.

    Which two commands can you run? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le domaine **corp.contoso.com** possède plusieurs contrôleurs de domaine en lecture seule, dont **RODC1** dans la succursale de Lyon. Un groupe nommé **Lyon-Sales** a pour nom unique CN=Lyon-Sales,OU=Groups,DC=corp,DC=contoso,DC=com.

    Vous devez autoriser la mise en cache des mots de passe des membres de Lyon-Sales sur RODC1 uniquement.

    Quelles sont les deux commandes que vous pouvez exécuter ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Add-ADDomainControllerPasswordReplicationPolicy -Identity RODC1 -AllowedList Lyon-Sales" }
    - { id: b, text: "Add-ADGroupMember -Identity \"Allowed RODC Password Replication Group\" -Members Lyon-Sales" }
    - { id: c, text: "repadmin /prp add RODC1 allow CN=Lyon-Sales,OU=Groups,DC=corp,DC=contoso,DC=com" }
    - { id: d, text: "Add-ADDomainControllerPasswordReplicationPolicy -Identity RODC1 -DeniedList Lyon-Sales" }
    - { id: e, text: "repadmin /rodcpwdrepl RODC1 DC1 CN=Lyon-Sales,OU=Groups,DC=corp,DC=contoso,DC=com" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Both Add-ADDomainControllerPasswordReplicationPolicy with -AllowedList and repadmin /prp add with the allow list write the group to the Allowed list (msDS-RevealOnDemandGroup) of RODC1 only.
    fr: Add-ADDomainControllerPasswordReplicationPolicy avec -AllowedList et repadmin /prp add avec la liste allow inscrivent tous deux le groupe dans la liste Autorisés (msDS-RevealOnDemandGroup) de RODC1 uniquement.
  options:
    b: { en: "The Allowed RODC Password Replication Group is allowed on every RODC, so the passwords could be cached on all RODCs, not on RODC1 only.", fr: "Le groupe Allowed RODC Password Replication Group est autorisé sur chaque RODC : les mots de passe pourraient être mis en cache sur tous les RODC, pas seulement sur RODC1." }
    d: { en: "-DeniedList prevents the passwords from ever being cached on RODC1.", fr: "-DeniedList empêche toute mise en cache des mots de passe sur RODC1." }
    e: { en: "repadmin /rodcpwdrepl triggers the replication of passwords to the RODC; it does not change the password replication policy.", fr: "repadmin /rodcpwdrepl déclenche la réplication de mots de passe vers le RODC ; il ne modifie pas la stratégie de réplication de mot de passe." }
references:
  - title: Add-ADDomainControllerPasswordReplicationPolicy
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/add-addomaincontrollerpasswordreplicationpolicy
  - title: Repadmin /prp
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc835090(v=ws.11)
