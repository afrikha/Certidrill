id: az802-1a-rodc-stage-rights
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The **litware.com** forest contains a single domain. The domain already has three read-only domain controllers (RODCs) in branch offices.

    You plan to stage a fourth RODC by running `Add-ADDSReadOnlyDomainControllerAccount` for a server named **RODC4**. The solution must follow the principle of least privilege.

    Of which group must the account that stages the RODC4 account be a member?
  fr: |
    La forêt **litware.com** contient un seul domaine. Ce domaine possède déjà trois contrôleurs de domaine en lecture seule (RODC) dans des succursales.

    Vous prévoyez de créer à l'avance un quatrième RODC en exécutant `Add-ADDSReadOnlyDomainControllerAccount` pour un serveur nommé **RODC4**. La solution doit respecter le principe du moindre privilège.

    De quel groupe le compte qui crée à l'avance le compte de RODC4 doit-il être membre ?
body:
  options:
    - { id: a, text: Enterprise Admins }
    - { id: b, text: Server Operators }
    - { id: c, text: Schema Admins }
    - { id: d, text: Domain Admins }
answer: { optionId: d }
explanation:
  correct:
    en: Staging an RODC account requires Domain Admins credentials. Enterprise Admins membership is needed only to install the first RODC of a forest, which is not the case here because the domain already has RODCs.
    fr: La création à l'avance d'un compte de RODC exige des informations d'identification Domain Admins. L'appartenance à Enterprise Admins n'est requise que pour installer le premier RODC d'une forêt, ce qui n'est pas le cas ici puisque le domaine possède déjà des RODC.
  options:
    a: { en: "Enterprise Admins is required only for the first RODC in the forest; it grants more than needed here.", fr: "Enterprise Admins n'est requis que pour le premier RODC de la forêt ; il accorde ici plus que nécessaire." }
    b: { en: "Server Operators cannot create domain controller accounts, and it is in the default Deny list of RODC password replication.", fr: "Server Operators ne peut pas créer de comptes de contrôleur de domaine, et il figure dans la liste Refusés par défaut de la réplication de mot de passe des RODC." }
    c: { en: "Schema Admins is used to modify the schema, not to stage RODC accounts.", fr: "Schema Admins sert à modifier le schéma, pas à créer à l'avance des comptes de RODC." }
