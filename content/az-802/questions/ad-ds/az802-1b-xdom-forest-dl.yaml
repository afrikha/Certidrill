id: az802-1b-xdom-forest-dl
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A one-way forest trust exists in which the **corp.contoso.com** forest trusts the **fabrikam.com** forest. **FS1** is a file server in the corp.contoso.com domain.

    The members of the global group **FAB-Auditors** in fabrikam.com need the Read permission on the share `\\FS1\Reports`. You try to add FAB-Auditors to the universal group **U-Reports-Read** of corp.contoso.com, but you can't select any object from fabrikam.com.

    What should you do?
  fr: |
    Il existe une approbation de forêt unidirectionnelle dans laquelle la forêt **corp.contoso.com** approuve la forêt **fabrikam.com**. **FS1** est un serveur de fichiers du domaine corp.contoso.com.

    Les membres du groupe global **FAB-Auditors** de fabrikam.com ont besoin de l'autorisation Lecture sur le partage `\\FS1\Reports`. Vous essayez d'ajouter FAB-Auditors au groupe universel **U-Reports-Read** de corp.contoso.com, mais vous ne pouvez sélectionner aucun objet de fabrikam.com.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a global group in corp.contoso.com, add FAB-Auditors to it, and grant it Read on the share.", fr: "Créer un groupe global dans corp.contoso.com, y ajouter FAB-Auditors et lui accorder la Lecture sur le partage." } }
    - { id: b, text: { en: "Convert U-Reports-Read to the global scope, and then add FAB-Auditors to it.", fr: "Convertir U-Reports-Read en étendue globale, puis y ajouter FAB-Auditors." } }
    - { id: c, text: { en: "Create a domain local group in corp.contoso.com, add FAB-Auditors to it, and grant it Read on the share.", fr: "Créer un groupe local de domaine dans corp.contoso.com, y ajouter FAB-Auditors et lui accorder la Lecture sur le partage." } }
    - { id: d, text: { en: "Make the forest trust two-way, and then add FAB-Auditors to U-Reports-Read.", fr: "Rendre l'approbation de forêt bidirectionnelle, puis ajouter FAB-Auditors à U-Reports-Read." } }
answer: { optionId: c }
explanation:
  correct:
    en: Universal groups can contain only accounts and groups from their own forest. Domain local groups are the scope that can contain accounts, global groups and universal groups from other forests, and they can be granted permissions in their own domain, which is FS1's domain.
    fr: Les groupes universels ne peuvent contenir que des comptes et des groupes de leur propre forêt. Les groupes locaux de domaine sont l'étendue qui peut contenir des comptes, des groupes globaux et des groupes universels d'autres forêts, et ils peuvent recevoir des autorisations dans leur propre domaine, qui est celui de FS1.
  options:
    a: { en: "A global group can contain only accounts and global groups of its own domain.", fr: "Un groupe global ne peut contenir que des comptes et des groupes globaux de son propre domaine." }
    b: { en: "A global group is even more restricted than a universal group: same domain only.", fr: "Un groupe global est encore plus restreint qu'un groupe universel : même domaine uniquement." }
    d: { en: "The trust direction doesn't change the scope rule: a universal group still can't contain principals of another forest.", fr: "Le sens de l'approbation ne change pas la règle d'étendue : un groupe universel ne peut toujours pas contenir de principaux d'une autre forêt." }
references:
  - title: Active Directory Security Groups
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-groups
