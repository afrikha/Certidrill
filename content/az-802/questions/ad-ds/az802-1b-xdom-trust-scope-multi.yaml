id: az802-1b-xdom-trust-scope-multi
objective: "1.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A one-way forest trust exists in which the **litware.com** forest trusts the **adatum.com** forest. No other trust exists between the two forests.

    Which two actions can you perform?

    NOTE: Each correct selection is worth one point.
  fr: |
    Il existe une approbation de forêt unidirectionnelle dans laquelle la forêt **litware.com** approuve la forêt **adatum.com**. Aucune autre approbation n'existe entre les deux forêts.

    Quelles sont les deux actions que vous pouvez effectuer ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a global group of adatum.com to a domain local group of litware.com.", fr: "Ajouter un groupe global de adatum.com à un groupe local de domaine de litware.com." } }
    - { id: b, text: { en: "Add a global group of litware.com to a domain local group of adatum.com.", fr: "Ajouter un groupe global de litware.com à un groupe local de domaine de adatum.com." } }
    - { id: c, text: { en: "Add a global group of adatum.com to a universal group of litware.com.", fr: "Ajouter un groupe global de adatum.com à un groupe universel de litware.com." } }
    - { id: d, text: { en: "Grant a global group of adatum.com NTFS permissions on a folder of a litware.com file server.", fr: "Accorder à un groupe global de adatum.com des autorisations NTFS sur un dossier d'un serveur de fichiers de litware.com." } }
    - { id: e, text: { en: "Add user accounts of adatum.com to a global group of litware.com.", fr: "Ajouter des comptes d'utilisateur de adatum.com à un groupe global de litware.com." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "litware.com is the trusting forest and adatum.com the trusted forest, so principals of adatum.com can be used in litware.com, not the reverse. A domain local group of litware.com can contain global groups of other forests, and a global group can be granted permissions in trusting domains or forests."
    fr: "litware.com est la forêt qui approuve et adatum.com la forêt approuvée : les principaux de adatum.com peuvent être utilisés dans litware.com, pas l'inverse. Un groupe local de domaine de litware.com peut contenir des groupes globaux d'autres forêts, et un groupe global peut recevoir des autorisations dans les domaines ou forêts qui l'approuvent."
  options:
    b: { en: "adatum.com doesn't trust litware.com, so it can't use litware.com principals.", fr: "adatum.com n'approuve pas litware.com : il ne peut pas utiliser de principaux de litware.com." }
    c: { en: "Universal groups can contain only accounts and groups of their own forest.", fr: "Les groupes universels ne peuvent contenir que des comptes et des groupes de leur propre forêt." }
    e: { en: "Global groups can contain only accounts of their own domain.", fr: "Les groupes globaux ne peuvent contenir que des comptes de leur propre domaine." }
references:
  - title: Active Directory Security Groups
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-groups
