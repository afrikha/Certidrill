id: az802-1a-prp-allowed-group
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The **corp.litware.com** domain has 12 read-only domain controllers (RODCs) in branch offices. Each RODC uses the default password replication policy. A group of 40 field engineers travels between all the branches.

    You need to ensure that the passwords of the field engineers can be cached on every RODC. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Le domaine **corp.litware.com** possède 12 contrôleurs de domaine en lecture seule (RODC) dans des succursales. Chaque RODC utilise la stratégie de réplication de mot de passe par défaut. Un groupe de 40 ingénieurs terrain se déplace entre toutes les succursales.

    Vous devez vous assurer que les mots de passe des ingénieurs terrain peuvent être mis en cache sur chaque RODC. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the field engineers to the Allowed RODC Password Replication Group.", fr: "Ajouter les ingénieurs terrain au groupe Allowed RODC Password Replication Group." } }
    - { id: b, text: { en: "Run Add-ADDomainControllerPasswordReplicationPolicy -AllowedList for the field engineers on each RODC.", fr: "Exécuter Add-ADDomainControllerPasswordReplicationPolicy -AllowedList pour les ingénieurs terrain sur chaque RODC." } }
    - { id: c, text: { en: "Add the field engineers to the Enterprise Read-only Domain Controllers group.", fr: "Ajouter les ingénieurs terrain au groupe Enterprise Read-only Domain Controllers." } }
    - { id: d, text: { en: "Run repadmin /rodcpwdrepl for each field engineer on each RODC.", fr: "Exécuter repadmin /rodcpwdrepl pour chaque ingénieur terrain sur chaque RODC." } }
answer: { optionId: a }
explanation:
  correct:
    en: The Allowed RODC Password Replication Group is in the Allowed list of every RODC by default. Adding the engineers to this one group makes their passwords cacheable on all 12 RODCs with a single change.
    fr: Le groupe Allowed RODC Password Replication Group figure par défaut dans la liste Autorisés de chaque RODC. Ajouter les ingénieurs à ce seul groupe permet la mise en cache de leurs mots de passe sur les 12 RODC en une seule modification.
  options:
    b: { en: "This works but requires a change on each of the 12 RODCs, which does not minimize effort.", fr: "Cela fonctionne, mais exige une modification sur chacun des 12 RODC, ce qui ne réduit pas l'effort au minimum." }
    c: { en: "Enterprise Read-only Domain Controllers contains RODC computer accounts; it does not control password caching for users.", fr: "Enterprise Read-only Domain Controllers contient des comptes d'ordinateur de RODC ; il ne contrôle pas la mise en cache des mots de passe des utilisateurs." }
    d: { en: "Prepopulation replicates passwords to an RODC; it does not change the password replication policy, and it would have to be repeated on each RODC.", fr: "Le préremplissage réplique des mots de passe vers un RODC ; il ne modifie pas la stratégie de réplication de mot de passe et devrait être répété sur chaque RODC." }
references:
  - title: Install-ADDSDomainController
    url: https://learn.microsoft.com/en-us/powershell/module/addsdeployment/install-addsdomaincontroller
  - title: Deploy Active Directory Domain Services domain controllers
