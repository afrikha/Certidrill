id: az802-1a-prp-lists-dragdrop
objective: "1.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are auditing the credential exposure of a read-only domain controller named **RODC4**.

    Which RODC list provides each piece of information? To answer, drag the appropriate lists to the correct descriptions. Each list may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous auditez l'exposition des informations d'identification d'un contrôleur de domaine en lecture seule nommé **RODC4**.

    Quelle liste du RODC fournit chaque information ? Pour répondre, faites glisser les listes appropriées vers les descriptions correspondantes. Chaque liste peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: allowed, text: { en: "Allowed list", fr: "Liste Autorisés" } }
    - { id: denied, text: { en: "Denied list", fr: "Liste Refusés" } }
    - { id: revealed, text: { en: "Revealed list", fr: "Liste des comptes révélés" } }
    - { id: authto, text: { en: "Authenticated to list", fr: "Liste Authentifiés auprès de" } }
    - { id: fas, text: { en: "RODC filtered attribute set", fr: "Jeu d'attributs filtré du RODC" } }
  targets:
    - { id: t1, text: { en: "Accounts whose passwords are currently stored on RODC4", fr: "Comptes dont les mots de passe sont actuellement stockés sur RODC4" } }
    - { id: t2, text: { en: "Accounts that RODC4 has authenticated, cached or not", fr: "Comptes que RODC4 a authentifiés, mis en cache ou non" } }
    - { id: t3, text: { en: "Principals whose passwords RODC4 may cache", fr: "Principaux dont RODC4 peut mettre en cache les mots de passe" } }
    - { id: t4, text: { en: "Principals whose passwords RODC4 must never cache", fr: "Principaux dont RODC4 ne doit jamais mettre en cache les mots de passe" } }
answer:
  mapping: { t1: revealed, t2: authto, t3: allowed, t4: denied }
explanation:
  correct:
    en: The Revealed list (Get-ADDomainControllerPasswordReplicationPolicyUsage -RevealedAccounts) shows the passwords stored on the RODC, and the Authenticated to list (-AuthenticatedAccounts) shows every account the RODC authenticated. The Allowed and Denied lists of the password replication policy define which passwords can and can never be cached.
    fr: La liste des comptes révélés (Get-ADDomainControllerPasswordReplicationPolicyUsage -RevealedAccounts) montre les mots de passe stockés sur le RODC, et la liste Authentifiés auprès de (-AuthenticatedAccounts) montre tous les comptes authentifiés par le RODC. Les listes Autorisés et Refusés de la stratégie de réplication de mot de passe définissent les mots de passe qui peuvent, ou ne peuvent jamais, être mis en cache.
  options:
    fas: { en: "The RODC filtered attribute set lists attributes that are not replicated to RODCs; it does not list accounts.", fr: "Le jeu d'attributs filtré du RODC liste des attributs qui ne sont pas répliqués vers les RODC ; il ne liste pas de comptes." }
references:
  - title: Get-ADDomainControllerPasswordReplicationPolicyUsage
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-addomaincontrollerpasswordreplicationpolicyusage
  - title: Repadmin /prp
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc835090(v=ws.11)
