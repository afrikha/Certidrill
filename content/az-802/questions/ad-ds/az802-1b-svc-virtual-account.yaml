id: az802-1b-svc-virtual-account
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    **SRV4** is a member server of the **corp.contoso.com** domain. A custom Windows service named **IndexerSvc** is installed only on SRV4.

    The service must meet the following requirements:

    - It must have its own identity on SRV4, so that you can grant local permissions to the service alone.
    - No password must ever be managed for the account.
    - It must access a share on **FS1** by using the computer account of SRV4.

    Which account should the service use?
  fr: |
    **SRV4** est un serveur membre du domaine **corp.contoso.com**. Un service Windows personnalisé nommé **IndexerSvc** est installé uniquement sur SRV4.

    Le service doit respecter les exigences suivantes :

    - Il doit avoir sa propre identité sur SRV4, afin que vous puissiez accorder des autorisations locales au seul service.
    - Aucun mot de passe ne doit jamais être géré pour le compte.
    - Il doit accéder à un partage de **FS1** en utilisant le compte d'ordinateur de SRV4.

    Quel compte le service doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "A standalone managed service account (sMSA)", fr: "Un compte de service administré autonome (sMSA)" } }
    - { id: b, text: { en: "A group managed service account (gMSA)", fr: "Un compte de service administré de groupe (gMSA)" } }
    - { id: c, text: { en: "The virtual account NT SERVICE\\IndexerSvc", fr: "Le compte virtuel NT SERVICE\\IndexerSvc" } }
    - { id: d, text: { en: "A domain user account with the Password never expires option", fr: "Un compte d'utilisateur de domaine avec l'option Le mot de passe n'expire jamais" } }
answer: { optionId: c }
explanation:
  correct:
    en: A virtual account is a managed local account created automatically for the service, so it has its own identity and needs no password management. In a domain, a virtual account accesses network resources with the credentials of the computer account, here CORP\SRV4$.
    fr: Un compte virtuel est un compte local administré créé automatiquement pour le service ; il a donc sa propre identité et ne demande aucune gestion de mot de passe. Dans un domaine, un compte virtuel accède aux ressources réseau avec les informations d'identification du compte d'ordinateur, ici CORP\SRV4$.
  options:
    a: { en: "An sMSA is a domain identity: on the network the service authenticates as the sMSA, not as the computer account of SRV4.", fr: "Un sMSA est une identité de domaine : sur le réseau, le service s'authentifie en tant que sMSA, pas avec le compte d'ordinateur de SRV4." }
    b: { en: "A gMSA is a domain identity meant for several servers; the service would authenticate as the gMSA on the network.", fr: "Un gMSA est une identité de domaine destinée à plusieurs serveurs ; le service s'authentifierait en tant que gMSA sur le réseau." }
    d: { en: "A domain user account requires password management and authenticates as itself, not as the computer account.", fr: "Un compte d'utilisateur de domaine exige une gestion du mot de passe et s'authentifie sous sa propre identité, pas avec le compte d'ordinateur." }
references:
  - title: Service Accounts in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-service-accounts
