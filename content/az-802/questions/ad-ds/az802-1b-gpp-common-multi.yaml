id: az802-1b-gpp-common-multi
objective: "1.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The **Desktop-Items** GPO is linked to the **Staff** OU of **corp.contoso.com** and contains several preference items for users of all sites. You add a Shortcuts item that creates a desktop shortcut to the Lyon intranet.

    You need to meet the following requirements:

    - The shortcut must be created only once for each user. If a user deletes it, it must not be created again.
    - The shortcut must be created only when the user signs in to a computer in the **Lyon** AD DS site.
    - The other items of Desktop-Items must keep applying in all sites.

    Which two settings should you configure on the Shortcuts item? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le GPO **Desktop-Items** est lié à l'UO **Staff** de **corp.contoso.com** et contient plusieurs éléments de préférence destinés aux utilisateurs de tous les sites. Vous ajoutez un élément Shortcuts qui crée un raccourci sur le Bureau vers l'intranet de Lyon.

    Vous devez respecter les exigences suivantes :

    - Le raccourci ne doit être créé qu'une seule fois pour chaque utilisateur. Si un utilisateur le supprime, il ne doit pas être recréé.
    - Le raccourci ne doit être créé que lorsque l'utilisateur se connecte à un ordinateur du site AD DS **Lyon**.
    - Les autres éléments de Desktop-Items doivent continuer à s'appliquer dans tous les sites.

    Quels sont les deux paramètres à configurer sur l'élément Shortcuts ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Remove this item when it is no longer applied", fr: "Remove this item when it is no longer applied" } }
    - { id: b, text: { en: "Item-level targeting with a Site targeting item for Lyon", fr: "Un ciblage au niveau de l'élément avec un élément de ciblage Site pour Lyon" } }
    - { id: c, text: { en: "Stop processing items in this extension if an error occurs on this item", fr: "Stop processing items in this extension if an error occurs on this item" } }
    - { id: d, text: { en: "Apply once and do not reapply", fr: "Apply once and do not reapply" } }
    - { id: e, text: { en: "Item-level targeting with an Organizational Unit targeting item for Staff", fr: "Un ciblage au niveau de l'élément avec un élément de ciblage Unité d'organisation pour Staff" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Apply once and do not reapply applies the item a single time, so a shortcut deleted by the user isn't recreated at the next refresh. A Site targeting item makes the item apply only when the processing computer is in the Lyon site, without affecting the other items of the GPO.
    fr: Apply once and do not reapply applique l'élément une seule fois ; un raccourci supprimé par l'utilisateur n'est donc pas recréé à l'actualisation suivante. Un élément de ciblage Site fait en sorte que l'élément ne s'applique que lorsque l'ordinateur de traitement se trouve dans le site Lyon, sans toucher aux autres éléments du GPO.
  options:
    a: { en: "This option removes the shortcut when the item falls out of scope; it doesn't prevent it from being recreated.", fr: "Cette option supprime le raccourci quand l'élément sort de l'étendue ; elle n'empêche pas qu'il soit recréé." }
    c: { en: "This option only affects the processing of the following items after an error.", fr: "Cette option ne concerne que le traitement des éléments suivants après une erreur." }
    e: { en: "All the users are in the Staff OU, whatever the site they sign in from.", fr: "Tous les utilisateurs sont dans l'UO Staff, quel que soit le site depuis lequel ils se connectent." }
references:
  - title: Group Policy preferences in Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-preferences
