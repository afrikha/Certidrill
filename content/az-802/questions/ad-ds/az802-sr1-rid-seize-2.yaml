id: az802-sr1-rid-seize-2
objective: "1.1.5"
type: series_yesno
series: az802-sr1-rid-seize
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You move the RID master role to DC2 by using Move-ADDirectoryServerOperationMasterRole without the Force parameter.
  fr: Vous déplacez le rôle maître RID vers DC2 à l'aide de Move-ADDirectoryServerOperationMasterRole sans le paramètre Force.
body:
  solution:
    en: |
      On DC2, you run the following command:

      ```powershell
      Move-ADDirectoryServerOperationMasterRole -Identity DC2 -OperationMasterRole RIDMaster
      ```
    fr: |
      Sur DC2, vous exécutez la commande suivante :

      ```powershell
      Move-ADDirectoryServerOperationMasterRole -Identity DC2 -OperationMasterRole RIDMaster
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      Without `-Force`, the cmdlet performs a graceful transfer, which requires the current role holder to be online and reachable. DC1 has failed, so the transfer cannot complete and DC2 does not become the RID master. A seizure requires the same command with the `-Force` switch, or `seize rid master` in ntdsutil.
    fr: |
      Sans `-Force`, l'applet de commande effectue un transfert normal, qui exige que le détenteur actuel du rôle soit en ligne et joignable. DC1 est en panne : le transfert ne peut pas aboutir et DC2 ne devient pas maître RID. Une saisie (seize) exige la même commande avec le commutateur `-Force`, ou `seize rid master` dans ntdsutil.
references:
  - title: Move-ADDirectoryServerOperationMasterRole (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/move-addirectoryserveroperationmasterrole
