id: az802-1a-dc-install-facts
objective: "1.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are planning the deployment of additional domain controllers that run Windows Server 2025 in the **corp.litware.com** forest. The forest and domain functional levels are Windows Server 2016.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez le déploiement de contrôleurs de domaine supplémentaires qui exécutent Windows Server 2025 dans la forêt **corp.litware.com**. Les niveaux fonctionnels de la forêt et du domaine sont Windows Server 2016.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can use Install from Media (IFM) to install the first domain controller of a new child domain.
        fr: Vous pouvez utiliser l'installation à partir du support (IFM) pour installer le premier contrôleur de domaine d'un nouveau domaine enfant.
    - id: s2
      text:
        en: A domain controller that you add by running Install-ADDSDomainController without the -NoGlobalCatalog parameter is a global catalog server.
        fr: Un contrôleur de domaine que vous ajoutez en exécutant Install-ADDSDomainController sans le paramètre -NoGlobalCatalog est un serveur de catalogue global.
    - id: s3
      text:
        en: You can store the AD DS database and SYSVOL on a volume formatted with ReFS.
        fr: Vous pouvez stocker la base de données AD DS et SYSVOL sur un volume formaté en ReFS.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: IFM cannot be used for the first domain controller of a domain, because there is no existing domain database to back up. A new domain controller is a global catalog server by default unless you specify -NoGlobalCatalog. Microsoft states that the AD DS database, logs and SYSVOL must not be stored on a ReFS volume.
    fr: L'installation IFM ne peut pas servir au premier contrôleur de domaine d'un domaine, car aucune base de données du domaine n'existe encore à sauvegarder. Un nouveau contrôleur de domaine est serveur de catalogue global par défaut, sauf si vous spécifiez -NoGlobalCatalog. Microsoft indique que la base de données AD DS, les journaux et SYSVOL ne doivent pas être stockés sur un volume ReFS.
references:
  - title: Install Active Directory Domain Services on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/install-active-directory-domain-services--level-100-
  - title: Install-ADDSDomainController
    url: https://learn.microsoft.com/en-us/powershell/module/addsdeployment/install-addsdomaincontroller
