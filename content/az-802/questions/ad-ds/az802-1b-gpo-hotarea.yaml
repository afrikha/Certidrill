id: az802-1b-gpo-hotarea
objective: "1.4.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    The computer account of **SRV3** is in the **Servers** OU, a child OU of the **Branch** OU, in the **corp.contoso.com** domain. No OU has Block Inheritance enabled. SRV3 isn't a member of the **G-Web-Servers** group. All the GPOs in the following table configure the same Administrative Templates computer setting with different values.

    Answer each prompt by selecting the appropriate GPO.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le compte d'ordinateur de **SRV3** se trouve dans l'UO **Servers**, une UO enfant de l'UO **Branch**, dans le domaine **corp.contoso.com**. Aucune UO n'a Bloquer l'héritage activé. SRV3 n'est pas membre du groupe **G-Web-Servers**. Tous les GPO du tableau suivant configurent le même paramètre ordinateur de Modèles d'administration avec des valeurs différentes.

    Répondez à chaque consigne en sélectionnant le GPO approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The GPO whose value SRV3 currently applies", fr: "Le GPO dont SRV3 applique actuellement la valeur" }
    - id: p2
      text: { en: "The GPO whose value SRV3 would apply after it's added to G-Web-Servers and restarted", fr: "Le GPO dont SRV3 appliquerait la valeur après son ajout à G-Web-Servers et son redémarrage" }
  grid:
    header: [ GPO, { en: "Linked to", fr: "Lié à" }, { en: "Link order", fr: "Ordre de lien" }, { en: "Enforced", fr: "Appliqué" }, { en: "GPO status", fr: "État du GPO" }, { en: "Security filtering", fr: "Filtrage de sécurité" } ]
    rows:
      - [ { text: GPO-Dom, area: dom }, { text: corp.contoso.com }, { text: "1" }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: "Computer configuration settings disabled", fr: "Paramètres de configuration ordinateur désactivés" } }, { text: Authenticated Users } ]
      - [ { text: GPO-Branch, area: branch }, { text: { en: "Branch OU", fr: "UO Branch" } }, { text: "1" }, { text: { en: "No", fr: "Non" } }, { text: { en: "Enabled", fr: "Activé" } }, { text: Authenticated Users } ]
      - [ { text: GPO-Srv-A, area: srva }, { text: { en: "Servers OU", fr: "UO Servers" } }, { text: "1" }, { text: { en: "No", fr: "Non" } }, { text: { en: "Enabled", fr: "Activé" } }, { text: G-Web-Servers } ]
      - [ { text: GPO-Srv-B, area: srvb }, { text: { en: "Servers OU", fr: "UO Servers" } }, { text: "2" }, { text: { en: "No", fr: "Non" } }, { text: { en: "Enabled", fr: "Activé" } }, { text: Authenticated Users } ]
answer:
  values: { p1: srvb, p2: srva }
explanation:
  correct:
    en: "GPO-Dom is enforced, but its computer settings are disabled, so it sets nothing on SRV3. SRV3 lacks Read and Apply group policy on GPO-Srv-A, so that GPO is filtered out. Among the GPOs that apply, those linked to the Servers OU are processed last, so GPO-Srv-B wins over GPO-Branch. Once SRV3 is in G-Web-Servers, GPO-Srv-A applies too, and with the link order 1 it has the highest precedence in the Servers OU."
    fr: "GPO-Dom est appliqué, mais ses paramètres ordinateur sont désactivés : il ne définit rien sur SRV3. SRV3 n'a pas Lecture et Appliquer la stratégie de groupe sur GPO-Srv-A, qui est donc filtré. Parmi les GPO qui s'appliquent, ceux liés à l'UO Servers sont traités en dernier : GPO-Srv-B l'emporte sur GPO-Branch. Une fois SRV3 dans G-Web-Servers, GPO-Srv-A s'applique aussi et, avec l'ordre de lien 1, il a la priorité la plus haute dans l'UO Servers."
references:
  - title: Group Policy processing for Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-processing
  - title: Group Policy scope in Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-scope
