id: az802-1a-fsmo-ntdsutil-seize
objective: "1.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    **DC1**, the PDC emulator of the **corp.wingtiptoys.com** domain, was destroyed in a fire and will never return. You are signed in to **DC2**, a writable domain controller of the same domain, as a member of Domain Admins, and you started `ntdsutil` from an elevated command prompt.

    You need to make DC2 the PDC emulator by using ntdsutil.

    Which five commands should you run in sequence? To answer, move the appropriate commands from the list of commands to the answer area and arrange them in the correct order.
  fr: |
    **DC1**, l'émulateur PDC du domaine **corp.wingtiptoys.com**, a été détruit dans un incendie et ne reviendra jamais. Vous êtes connecté à **DC2**, un contrôleur de domaine accessible en écriture du même domaine, en tant que membre de Domain Admins, et vous avez lancé `ntdsutil` depuis une invite de commandes avec élévation de privilèges.

    Vous devez faire de DC2 l'émulateur PDC à l'aide de ntdsutil.

    Quelles sont les cinq commandes à exécuter dans l'ordre ? Pour répondre, déplacez les commandes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: roles, text: roles }
    - { id: connections, text: connections }
    - { id: connect, text: connect to server DC2 }
    - { id: quit, text: q }
    - { id: seize, text: seize pdc }
    - { id: transfer, text: transfer pdc }
    - { id: metadata, text: metadata cleanup }
    - { id: connectdc1, text: connect to server DC1 }
answer:
  sequence: [ roles, connections, connect, quit, seize ]
explanation:
  correct:
    en: "In ntdsutil, the roles context opens FSMO maintenance; from there, the connections context binds to the domain controller that will receive the role (DC2), and q returns to FSMO maintenance where seize pdc takes the role. A transfer is not possible because the current owner, DC1, is gone."
    fr: "Dans ntdsutil, le contexte roles ouvre la maintenance FSMO ; de là, le contexte connections se lie au contrôleur de domaine qui recevra le rôle (DC2), et q revient à la maintenance FSMO, où seize pdc prend le rôle de force. Un transfert est impossible, car le détenteur actuel, DC1, a disparu."
  options:
    transfer: { en: "A transfer needs the current role owner to be online; DC1 was destroyed.", fr: "Un transfert exige que le détenteur actuel du rôle soit en ligne ; DC1 a été détruit." }
    connectdc1: { en: "You connect to the server that will hold the role, not to the failed owner.", fr: "On se connecte au serveur qui détiendra le rôle, pas à l'ancien détenteur défaillant." }
    metadata: { en: "Metadata cleanup of DC1 is a separate operation; it does not assign the PDC emulator role.", fr: "Le nettoyage des métadonnées de DC1 est une opération distincte ; il n'attribue pas le rôle d'émulateur PDC." }
references:
  - title: Transfer or seize Operation Master roles
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/transfer-or-seize-operation-master-roles-in-ad-ds
