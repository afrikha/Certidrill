id: az802-1a-site-hotarea-promotion
objective: "1.2.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    The **corp.tailspin.com** domain has the following sites and subnet objects. **DC1** is a domain controller in the Paris site and **DC2** is a domain controller in the Nantes site.

    | Site | Subnet objects |
    | --- | --- |
    | Default-First-Site-Name | None |
    | Paris | 10.10.0.0/16 |
    | Lille | 10.20.0.0/24 |
    | Nantes | 10.40.0.0/24 |

    You will promote two member servers by running `Install-ADDSDomainController` without the -SiteName parameter:

    - **SRV-A** (10.20.0.15), with -ReplicationSourceDC DC1
    - **SRV-B** (10.70.0.15), with -ReplicationSourceDC DC2

    Answer each prompt by selecting the site in which the new domain controller will be placed.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le domaine **corp.tailspin.com** possède les sites et objets sous-réseau suivants. **DC1** est un contrôleur de domaine du site Paris et **DC2** un contrôleur de domaine du site Nantes.

    | Site | Objets sous-réseau |
    | --- | --- |
    | Default-First-Site-Name | Aucun |
    | Paris | 10.10.0.0/16 |
    | Lille | 10.20.0.0/24 |
    | Nantes | 10.40.0.0/24 |

    Vous allez promouvoir deux serveurs membres en exécutant `Install-ADDSDomainController` sans le paramètre -SiteName :

    - **SRV-A** (10.20.0.15), avec -ReplicationSourceDC DC1
    - **SRV-B** (10.70.0.15), avec -ReplicationSourceDC DC2

    Répondez à chaque consigne en sélectionnant le site dans lequel le nouveau contrôleur de domaine sera placé.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "SRV-A", fr: "SRV-A" }
    - id: p2
      text: { en: "SRV-B", fr: "SRV-B" }
  grid:
    header: [{ en: Site, fr: Site }, { en: Domain controllers, fr: Contrôleurs de domaine }]
    rows:
      - [{ text: Default-First-Site-Name, area: dfsn }, { text: { en: "None", fr: "Aucun" } }]
      - [{ text: Paris, area: paris }, { text: DC1 }]
      - [{ text: Lille, area: lille }, { text: { en: "None", fr: "Aucun" } }]
      - [{ text: Nantes, area: nantes }, { text: DC2 }]
answer:
  values: { p1: lille, p2: nantes }
explanation:
  correct:
    en: Without -SiteName, the new domain controller goes to the site associated with the subnet that contains its IP address. SRV-A (10.20.0.15) matches 10.20.0.0/24, so it joins Lille even though it replicates from DC1 in Paris. No subnet object contains 10.70.0.15, so SRV-B is placed in the site of its replication source domain controller, DC2, which is Nantes.
    fr: "Sans -SiteName, le nouveau contrôleur de domaine rejoint le site associé au sous-réseau qui contient son adresse IP. SRV-A (10.20.0.15) correspond à 10.20.0.0/24 : il rejoint Lille, même s'il réplique depuis DC1 à Paris. Aucun objet sous-réseau ne contient 10.70.0.15 : SRV-B est placé dans le site de son contrôleur de domaine source de réplication, DC2, c'est-à-dire Nantes."
references:
  - title: Install-ADDSDomainController
    url: https://learn.microsoft.com/en-us/powershell/module/addsdeployment/install-addsdomaincontroller
