id: az802-1a-site-link-defaults
objective: "1.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You create a site link by running the following command:

    `New-ADReplicationSiteLink -Name "Nantes-Rennes" -SitesIncluded Nantes,Rennes -Cost 100 -InterSiteTransportProtocol IP`

    Which two statements describe the replication over this site link?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un lien de sites en exécutant la commande suivante :

    `New-ADReplicationSiteLink -Name "Nantes-Rennes" -SitesIncluded Nantes,Rennes -Cost 100 -InterSiteTransportProtocol IP`

    Quelles sont les deux affirmations qui décrivent la réplication sur ce lien de sites ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Replication occurs every 180 minutes.", fr: "La réplication a lieu toutes les 180 minutes." } }
    - { id: b, text: { en: "The site link is available for replication 24 hours a day, 7 days a week.", fr: "Le lien de sites est disponible pour la réplication 24 heures sur 24, 7 jours sur 7." } }
    - { id: c, text: { en: "Replication occurs every 15 minutes.", fr: "La réplication a lieu toutes les 15 minutes." } }
    - { id: d, text: { en: "Changes are replicated immediately by change notification.", fr: "Les modifications sont répliquées immédiatement par notification des modifications." } }
    - { id: e, text: { en: "The site link is available for replication only outside business hours.", fr: "Le lien de sites n'est disponible pour la réplication qu'en dehors des heures ouvrées." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: Without -ReplicationFrequencyInMinutes, intersite replication over a site link occurs every 180 minutes (3 hours), and without -ReplicationSchedule the link is available 24 hours a day, 7 days a week.
    fr: Sans -ReplicationFrequencyInMinutes, la réplication intersite sur un lien de sites a lieu toutes les 180 minutes (3 heures), et sans -ReplicationSchedule le lien est disponible 24 heures sur 24, 7 jours sur 7.
  options:
    c: { en: "15 minutes is not the default; you must set it with -ReplicationFrequencyInMinutes.", fr: "15 minutes n'est pas la valeur par défaut ; il faut la définir avec -ReplicationFrequencyInMinutes." }
    d: { en: "Change notification over a site link must be enabled explicitly, for example with -OtherAttributes @{'options'=1}.", fr: "La notification des modifications sur un lien de sites doit être activée explicitement, par exemple avec -OtherAttributes @{'options'=1}." }
    e: { en: "No schedule restriction applies unless you configure -ReplicationSchedule.", fr: "Aucune restriction horaire ne s'applique sauf si vous configurez -ReplicationSchedule." }
references:
  - title: New-ADReplicationSiteLink
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/new-adreplicationsitelink
