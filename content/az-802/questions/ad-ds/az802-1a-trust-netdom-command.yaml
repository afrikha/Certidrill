id: az802-1a-trust-netdom-command
objective: "1.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank (domain **woodgrove.com**, its own forest) must give the auditors of a partner domain named **proseware.com**, in another forest, access to reports stored in woodgrove.com. Woodgrove users must not be able to access proseware.com resources. No forest trust will be created.

    The security team also requires that woodgrove.com accept only security identifiers (SIDs) from the proseware.com domain in authentication data received over the trust.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank (domaine **woodgrove.com**, dans sa propre forêt) doit donner aux auditeurs d'un domaine partenaire nommé **proseware.com**, situé dans une autre forêt, l'accès à des rapports stockés dans woodgrove.com. Les utilisateurs de Woodgrove ne doivent pas pouvoir accéder aux ressources de proseware.com. Aucune approbation de forêt ne sera créée.

    L'équipe de sécurité exige aussi que woodgrove.com n'accepte que des identificateurs de sécurité (SID) du domaine proseware.com dans les données d'authentification reçues par l'approbation.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    netdom trust [[pair]] /add /userd:proseware\admin /passwordd:* /usero:woodgrove\admin /passwordo:* [[sid]]
  slots:
    - id: pair
      options:
        - { id: wgpw, text: "woodgrove.com /domain:proseware.com" }
        - { id: pwwg, text: "proseware.com /domain:woodgrove.com" }
        - { id: twoway, text: "woodgrove.com /domain:proseware.com /twoway" }
    - id: sid
      options:
        - { id: quarantine, text: "/quarantine:yes" }
        - { id: quarantineno, text: "/quarantine:no" }
        - { id: sidhistory, text: "/enablesidhistory:yes" }
        - { id: selective, text: "/selectiveauth:no" }
answer:
  values: { pair: wgpw, sid: quarantine }
explanation:
  correct:
    en: "The resources are in woodgrove.com, so woodgrove.com is the trusting domain (first argument) and proseware.com is the trusted domain (/domain). Without /twoway the trust stays one-way. /quarantine:yes enables SID filtering, so the trusting domain accepts only SIDs from the directly trusted domain."
    fr: "Les ressources se trouvent dans woodgrove.com : woodgrove.com est donc le domaine qui approuve (premier argument) et proseware.com le domaine approuvé (/domain). Sans /twoway, l'approbation reste unidirectionnelle. /quarantine:yes active le filtrage SID : le domaine qui approuve n'accepte que les SID du domaine directement approuvé."
  options:
    sidhistory: { en: "/enablesidhistory:yes lets SID history from the trusted forest be used, which accepts more SIDs, and applies to outbound forest trusts.", fr: "/enablesidhistory:yes permet d'utiliser l'historique SID de la forêt approuvée, ce qui accepte davantage de SID, et s'applique aux approbations de forêt sortantes." }
    pwwg: { en: "Reversing the arguments would make proseware.com trust woodgrove.com, giving Woodgrove users access to proseware.com instead.", fr: "Inverser les arguments ferait que proseware.com approuve woodgrove.com, ce qui donnerait plutôt aux utilisateurs de Woodgrove l'accès à proseware.com." }
    twoway: { en: "/twoway would also let woodgrove.com users be granted access to proseware.com.", fr: "/twoway permettrait aussi aux utilisateurs de woodgrove.com d'obtenir l'accès à proseware.com." }
    quarantineno: { en: "/quarantine:no disables SID filtering, so any SID would be accepted.", fr: "/quarantine:no désactive le filtrage SID : n'importe quel SID serait accepté." }
    selective: { en: "Selective authentication controls which users can authenticate to which computers, not which SIDs are accepted.", fr: "L'authentification sélective contrôle quels utilisateurs peuvent s'authentifier auprès de quels ordinateurs, pas quels SID sont acceptés." }
references:
  - title: Netdom trust
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netdom-trust
