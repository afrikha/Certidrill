id: az802-1b-gpp-registry-dropdown
objective: "1.4.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    The **App-Config** GPO of **corp.contoso.com** is linked to the **Servers** OU. You need to add a Registry preference item to the Computer Configuration of App-Config for the value **LogLevel** (DWORD) of the key `HKLM\Software\Contoso\App`:

    - On servers where LogLevel doesn't exist, it must be created with the data **2**.
    - On servers where an administrator already set LogLevel, its current data must be kept.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le GPO **App-Config** de **corp.contoso.com** est lié à l'UO **Servers**. Vous devez ajouter à la Configuration ordinateur de App-Config un élément de préférence Registre pour la valeur **LogLevel** (DWORD) de la clé `HKLM\Software\Contoso\App` :

    - Sur les serveurs où LogLevel n'existe pas, elle doit être créée avec la donnée **2**.
    - Sur les serveurs où un administrateur a déjà défini LogLevel, sa donnée actuelle doit être conservée.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    [[cmd]] -Name "App-Config" -Context Computer `
      -Key "HKLM\Software\Contoso\App" -ValueName "LogLevel" -Value 2 -Type DWord `
      -Action [[act]]
  slots:
    - id: cmd
      options:
        - { id: pref, text: Set-GPPrefRegistryValue }
        - { id: pol, text: Set-GPRegistryValue }
        - { id: item, text: Set-ItemProperty }
    - id: act
      options:
        - { id: create, text: Create }
        - { id: update, text: Update }
        - { id: replace, text: Replace }
        - { id: delete, text: Delete }
answer:
  values: { cmd: pref, act: create }
explanation:
  correct:
    en: "Set-GPPrefRegistryValue configures a Registry preference item in a GPO, with -Context to choose Computer or User Configuration and -Action to set how the item is applied on the client. The Create action creates the value where it's missing and leaves an existing value unchanged, which keeps the data set by administrators."
    fr: "Set-GPPrefRegistryValue configure un élément de préférence Registre dans un GPO, avec -Context pour choisir la Configuration ordinateur ou utilisateur et -Action pour définir la façon dont l'élément est appliqué sur le client. L'action Create crée la valeur là où elle manque et laisse une valeur existante inchangée, ce qui conserve la donnée définie par les administrateurs."
  options:
    pol: { en: "Set-GPRegistryValue configures registry-based policy settings, not preference items, and has no -Context or -Action parameter.", fr: "Set-GPRegistryValue configure des paramètres de stratégie basés sur le Registre, pas des éléments de préférence, et n'a pas de paramètre -Context ni -Action." }
    item: { en: "Set-ItemProperty changes the local registry of the computer where it runs; it doesn't configure a GPO.", fr: "Set-ItemProperty modifie le Registre local de l'ordinateur où il s'exécute ; il ne configure pas de GPO." }
    update: { en: "Update would overwrite the data set by administrators with 2 at each refresh.", fr: "Update remplacerait la donnée définie par les administrateurs par 2 à chaque actualisation." }
    replace: { en: "Replace deletes and recreates the value with the data 2, which overwrites the existing data.", fr: "Replace supprime puis recrée la valeur avec la donnée 2, ce qui écrase la donnée existante." }
    delete: { en: "Delete removes the value instead of creating it.", fr: "Delete supprime la valeur au lieu de la créer." }
references:
  - title: Set-GPPrefRegistryValue (GroupPolicy)
    url: https://learn.microsoft.com/en-us/powershell/module/grouppolicy/set-gpprefregistryvalue
  - title: Group Policy preferences in Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-preferences
