id: az802-1b-usr-scopes-yesno
objective: "1.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    The **corp.contoso.com** forest contains the domains **corp.contoso.com** and **eu.corp.contoso.com**. You are reviewing the group design of the forest.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    La forêt **corp.contoso.com** contient les domaines **corp.contoso.com** et **eu.corp.contoso.com**. Vous examinez la conception des groupes de la forêt.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A global group of corp.contoso.com can contain user accounts of eu.corp.contoso.com.
        fr: Un groupe global de corp.contoso.com peut contenir des comptes d'utilisateur de eu.corp.contoso.com.
    - id: s2
      text:
        en: A domain local group of corp.contoso.com can contain universal groups of eu.corp.contoso.com.
        fr: Un groupe local de domaine de corp.contoso.com peut contenir des groupes universels de eu.corp.contoso.com.
    - id: s3
      text:
        en: You can change the scope of the built-in Administrators group of corp.contoso.com to Domain local.
        fr: Vous pouvez changer l'étendue du groupe intégré Administrators de corp.contoso.com en Domaine local.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: A global group contains only accounts and global groups of its own domain. A domain local group can contain accounts and global groups of any domain or trusted domain, and universal groups of any domain of the same forest. The default groups of the Builtin container, such as Administrators, have the Builtin Local scope, which can't be changed.
    fr: Un groupe global ne contient que des comptes et des groupes globaux de son propre domaine. Un groupe local de domaine peut contenir des comptes et des groupes globaux de n'importe quel domaine ou domaine approuvé, et des groupes universels de n'importe quel domaine de la même forêt. Les groupes par défaut du conteneur Builtin, comme Administrators, ont l'étendue Builtin Local, qui ne peut pas être modifiée.
references:
  - title: Active Directory Security Groups
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-groups
