id: az802-1a-azdc-bastion-admin
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has extended its on-premises AD DS domain to Azure. Two domain controllers, **VM-DC1** and **VM-DC2**, run in a dedicated subnet of a virtual network named **VNet-Identity**. The network interfaces of the domain controllers have no public IP address.

    Administrators must be able to open RDP sessions to VM-DC1 and VM-DC2 from the Azure portal. The domain controllers must not be exposed with public IP addresses.

    What should you deploy?
  fr: |
    Contoso a étendu son domaine AD DS local à Azure. Deux contrôleurs de domaine, **VM-DC1** et **VM-DC2**, s'exécutent dans un sous-réseau dédié d'un réseau virtuel nommé **VNet-Identity**. Les interfaces réseau des contrôleurs de domaine n'ont pas d'adresse IP publique.

    Les administrateurs doivent pouvoir ouvrir des sessions RDP vers VM-DC1 et VM-DC2 depuis le portail Azure. Les contrôleurs de domaine ne doivent pas être exposés par des adresses IP publiques.

    Que devez-vous déployer ?
body:
  options:
    - { id: a, text: { en: "A Standard SKU public IP address on each domain controller, restricted by a network security group", fr: "Une adresse IP publique de référence SKU Standard sur chaque contrôleur de domaine, restreinte par un groupe de sécurité réseau" } }
    - { id: b, text: { en: "Azure Bastion in VNet-Identity", fr: "Azure Bastion dans VNet-Identity" } }
    - { id: c, text: { en: "A public Standard SKU load balancer with inbound NAT rules for TCP 3389", fr: "Un équilibreur de charge public de référence SKU Standard avec des règles NAT de trafic entrant pour TCP 3389" } }
    - { id: d, text: { en: "A jump box virtual machine with a public IP address in VNet-Identity", fr: "Une machine virtuelle de rebond avec une adresse IP publique dans VNet-Identity" } }
answer: { optionId: b }
explanation:
  correct:
    en: Azure Bastion provides RDP and SSH access to virtual machines from the Azure portal over TLS, without a public IP address on the virtual machines. Microsoft recommends it for domain controllers in Azure instead of a jump box with a public IP address.
    fr: Azure Bastion fournit un accès RDP et SSH aux machines virtuelles depuis le portail Azure via TLS, sans adresse IP publique sur les machines virtuelles. Microsoft le recommande pour les contrôleurs de domaine dans Azure plutôt qu'une machine de rebond dotée d'une adresse IP publique.
  options:
    a: { en: "Microsoft recommends never assigning a public IP address to the network interface of an AD DS server.", fr: "Microsoft recommande de ne jamais attribuer d'adresse IP publique à l'interface réseau d'un serveur AD DS." }
    c: { en: "Inbound NAT rules publish RDP on a public frontend, which exposes the domain controllers to the internet.", fr: "Les règles NAT de trafic entrant publient RDP sur une adresse frontale publique, ce qui expose les contrôleurs de domaine à Internet." }
    d: { en: "A jump box with a public IP address is the exposure that Azure Bastion is designed to remove.", fr: "Une machine de rebond avec une adresse IP publique est précisément l'exposition qu'Azure Bastion permet de supprimer." }
references:
  - title: Deploy AD DS in an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/identity/adds-extend-domain
