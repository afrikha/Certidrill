id: az802-sr1-rid-seize-1
objective: "1.1.5"
type: series_yesno
series: az802-sr1-rid-seize
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You seize the RID master role on DC2 by using ntdsutil.
  fr: Vous saisissez (seize) le rôle maître RID sur DC2 à l'aide de ntdsutil.
body:
  solution:
    en: |
      On DC2, you run the following ntdsutil commands:

      ```text
      ntdsutil
      roles
      connections
      connect to server DC2
      q
      seize rid master
      q
      q
      ```
    fr: |
      Sur DC2, vous exécutez les commandes ntdsutil suivantes :

      ```text
      ntdsutil
      roles
      connections
      connect to server DC2
      q
      seize rid master
      q
      q
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      A role is transferred when its current holder is online and seized when the holder has failed and will not return, which is the case of DC1. In ntdsutil, you connect to the domain controller that must receive the role (DC2) and run `seize rid master`; Domain Admins membership is enough for a domain-wide role. DC1 must never come back online with its old database, and its metadata must be cleaned up.
    fr: |
      Un rôle est transféré lorsque son détenteur actuel est en ligne, et saisi (seize) lorsque le détenteur est en panne et ne reviendra pas, ce qui est le cas de DC1. Dans ntdsutil, vous vous connectez au contrôleur de domaine qui doit recevoir le rôle (DC2) et vous exécutez `seize rid master` ; l'appartenance à Domain Admins suffit pour un rôle à l'échelle du domaine. DC1 ne doit jamais revenir en ligne avec son ancienne base, et ses métadonnées doivent être nettoyées.
references:
  - title: Transfer or seize Operation Master roles in Active Directory Domain Services
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/transfer-or-seize-operation-master-roles-in-ad-ds
