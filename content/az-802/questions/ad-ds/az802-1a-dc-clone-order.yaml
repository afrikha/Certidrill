id: az802-1a-dc-clone-order
objective: "1.1.1"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have a Hyper-V host named **Host1** that runs a virtual machine named **DC2**. DC2 is a domain controller of the **corp.adatum.com** domain and runs Windows Server 2025. The PDC emulator runs Windows Server 2025 and is online. DC2 has no checkpoints. You confirmed that no application or service installed on DC2 is excluded from cloning.

    You need to create a new domain controller named **DC5** by cloning DC2.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **Host1** qui exécute une machine virtuelle nommée **DC2**. DC2 est un contrôleur de domaine du domaine **corp.adatum.com** et exécute Windows Server 2025. L'émulateur PDC exécute Windows Server 2025 et est en ligne. DC2 n'a aucun point de contrôle. Vous avez vérifié qu'aucune application ni aucun service installé sur DC2 n'est exclu du clonage.

    Vous devez créer un nouveau contrôleur de domaine nommé **DC5** en clonant DC2.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: group, text: { en: "Add DC2 to the Cloneable Domain Controllers group.", fr: "Ajouter DC2 au groupe Cloneable Domain Controllers." } }
    - { id: config, text: { en: "On DC2, run New-ADDCCloneConfigFile -CloneComputerName DC5.", fr: "Sur DC2, exécuter New-ADDCCloneConfigFile -CloneComputerName DC5." } }
    - { id: stop, text: { en: "Shut down DC2 gracefully.", fr: "Arrêter DC2 proprement." } }
    - { id: export, text: { en: "Export DC2, then import the export on Host1 by selecting Copy the virtual machine (create a new unique ID).", fr: "Exporter DC2, puis importer l'exportation sur Host1 en sélectionnant Copy the virtual machine (create a new unique ID)." } }
    - { id: start, text: { en: "Start the imported virtual machine.", fr: "Démarrer la machine virtuelle importée." } }
    - { id: sysprep, text: { en: "Run Sysprep with the /generalize option on DC2.", fr: "Exécuter Sysprep avec l'option /generalize sur DC2." } }
    - { id: checkpoint, text: { en: "Create a checkpoint of DC2.", fr: "Créer un point de contrôle de DC2." } }
answer:
  sequence: [ group, config, stop, export, start ]
explanation:
  correct:
    en: "The source domain controller must be authorized for cloning (Cloneable Domain Controllers group) before New-ADDCCloneConfigFile runs, because the cmdlet checks that membership in online mode. You then shut down the source gracefully, copy it by export and import as a new unique VM, and start the copy: it reads DCCloneConfig.xml, contacts the PDC emulator and becomes DC5."
    fr: "Le contrôleur de domaine source doit être autorisé au clonage (groupe Cloneable Domain Controllers) avant l'exécution de New-ADDCCloneConfigFile, car l'applet de commande vérifie cette appartenance en mode en ligne. Vous arrêtez ensuite proprement la source, la copiez par exportation puis importation comme nouvelle machine virtuelle unique, et démarrez la copie : elle lit DCCloneConfig.xml, contacte l'émulateur PDC et devient DC5."
  options:
    sysprep: { en: "Cloning relies on DCCloneConfig.xml and the VM-Generation ID; you do not generalize a domain controller.", fr: "Le clonage repose sur DCCloneConfig.xml et l'identifiant VM-Generation ID ; on ne généralise pas un contrôleur de domaine." }
    checkpoint: { en: "Checkpoints must be removed before cloning; restoring a pre-clone checkpoint can create duplicate domain controllers.", fr: "Les points de contrôle doivent être supprimés avant le clonage ; restaurer un point de contrôle antérieur au clonage peut créer des contrôleurs de domaine en double." }
references:
  - title: Virtualized Domain Controller Deployment and Configuration
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/virtual-dc/virtualized-domain-controller-deployment-and-configuration
