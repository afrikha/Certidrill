id: az802-1b-svc-dmsa-dropdown
objective: "1.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    All the domain controllers of **corp.contoso.com** run Windows Server 2025, and a KDS root key exists. A service on **SRV9** runs as the domain user account **svc-crm** (`CN=svc-crm,OU=Service Accounts,DC=corp,DC=contoso,DC=com`).

    You need to create a delegated managed service account (dMSA) named **dmsa-crm** and start the migration from svc-crm, so that the dMSA learns the computers that use svc-crm. svc-crm must not be disabled yet.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tous les contrôleurs de domaine de **corp.contoso.com** exécutent Windows Server 2025, et une clé racine KDS existe. Un service de **SRV9** s'exécute sous le compte d'utilisateur de domaine **svc-crm** (`CN=svc-crm,OU=Service Accounts,DC=corp,DC=contoso,DC=com`).

    Vous devez créer un compte de service administré délégué (dMSA) nommé **dmsa-crm** et démarrer la migration depuis svc-crm, afin que le dMSA apprenne les ordinateurs qui utilisent svc-crm. svc-crm ne doit pas encore être désactivé.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    New-ADServiceAccount -Name "dmsa-crm" -DNSHostName "dmsa-crm.corp.contoso.com" `
      [[create]] -KerberosEncryptionType AES256

    [[mig]] -Identity "dmsa-crm" `
      -SupersededAccount "CN=svc-crm,OU=Service Accounts,DC=corp,DC=contoso,DC=com"
  slots:
    - id: create
      options:
        - { id: dmsa, text: -CreateDelegatedServiceAccount }
        - { id: single, text: -RestrictToSingleComputer }
        - { id: outbound, text: -RestrictToOutboundAuthenticationOnly }
    - id: mig
      options:
        - { id: start, text: Start-ADServiceAccountMigration }
        - { id: complete, text: Complete-ADServiceAccountMigration }
        - { id: undo, text: Undo-ADServiceAccountMigration }
        - { id: reset, text: Reset-ADServiceAccountMigration }
answer:
  values: { create: dmsa, mig: start }
explanation:
  correct:
    en: "New-ADServiceAccount with -CreateDelegatedServiceAccount creates the dMSA. Start-ADServiceAccountMigration links the dMSA to the superseded account and starts the phase during which the computers that sign in with svc-crm are added to the dMSA; svc-crm is disabled only when you run Complete-ADServiceAccountMigration."
    fr: "New-ADServiceAccount avec -CreateDelegatedServiceAccount crée le dMSA. Start-ADServiceAccountMigration lie le dMSA au compte remplacé et démarre la phase pendant laquelle les ordinateurs qui se connectent avec svc-crm sont ajoutés au dMSA ; svc-crm n'est désactivé que lorsque vous exécutez Complete-ADServiceAccountMigration."
  options:
    single: { en: "This switch creates a standalone MSA and can't be combined with -DNSHostName.", fr: "Ce commutateur crée un MSA autonome et ne peut pas être combiné avec -DNSHostName." }
    outbound: { en: "This switch creates an account restricted to outbound authentication, not a dMSA, and doesn't accept -DNSHostName.", fr: "Ce commutateur crée un compte limité à l'authentification sortante, pas un dMSA, et n'accepte pas -DNSHostName." }
    complete: { en: "Completing the migration disables svc-crm, which must not happen yet.", fr: "Terminer la migration désactive svc-crm, ce qui ne doit pas encore se produire." }
    undo: { en: "Undo reverts a migration that was started on the wrong account.", fr: "Undo annule une migration démarrée sur le mauvais compte." }
    reset: { en: "Reset returns the superseded account to an unlinked state; it doesn't start a migration.", fr: "Reset ramène le compte remplacé à un état non lié ; il ne démarre pas de migration." }
references:
  - title: Setting up delegated Managed Service Accounts (dMSA) in Windows Server 2025
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/delegated-managed-service-accounts/delegated-managed-service-accounts-set-up-dmsa
  - title: New-ADServiceAccount (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/new-adserviceaccount
