id: az802-1b-repl-replsummary
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The **corp.fabrikam.com** forest has 14 domain controllers spread across five sites. A WAN outage between two sites was resolved this morning.

    You need a single report that shows, for every source and destination domain controller, the largest replication delta and the number of failed replication attempts out of the total.

    Which command should you run?
  fr: |
    La forêt **corp.fabrikam.com** compte 14 contrôleurs de domaine répartis sur cinq sites. Une panne WAN entre deux sites a été résolue ce matin.

    Vous avez besoin d'un rapport unique qui indique, pour chaque contrôleur de domaine source et destination, le plus grand écart de réplication et le nombre de tentatives de réplication en échec par rapport au total.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "repadmin /showrepl DC1" }
    - { id: b, text: "repadmin /replsummary *" }
    - { id: c, text: "repadmin /queue *" }
    - { id: d, text: "repadmin /kcc *" }
answer: { optionId: b }
explanation:
  correct:
    en: "repadmin /replsummary identifies the domain controllers that fail inbound or outbound replication and summarizes the results in one report, with the largest delta and the failures out of the total for each source and destination. The asterisk targets all domain controllers of the forest."
    fr: "repadmin /replsummary identifie les contrôleurs de domaine dont la réplication entrante ou sortante échoue et résume les résultats dans un seul rapport, avec le plus grand écart et les échecs par rapport au total pour chaque source et chaque destination. L'astérisque cible tous les contrôleurs de domaine de la forêt."
  options:
    a: { en: "showrepl details the inbound partners of one domain controller; it doesn't summarize the whole forest.", fr: "showrepl détaille les partenaires entrants d'un seul contrôleur de domaine ; il ne résume pas toute la forêt." }
    c: { en: "queue lists the inbound replication requests still pending on each domain controller, not the deltas or failure counts.", fr: "queue liste les demandes de réplication entrantes encore en attente sur chaque contrôleur de domaine, pas les écarts ni le nombre d'échecs." }
    d: { en: "kcc makes the KCC recalculate the inbound topology; it produces no replication report.", fr: "kcc force le KCC à recalculer la topologie entrante ; il ne produit aucun rapport de réplication." }
references:
  - title: Repadmin /replsummary
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc835092(v=ws.11)
  - title: Repadmin
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc770963(v=ws.11)
