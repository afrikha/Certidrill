id: az802-1a-trust-forest-scope
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The **contoso.com** forest contains the domains contoso.com and **eu.contoso.com**. The **fabrikam.com** forest contains the domains fabrikam.com and **na.fabrikam.com**. A two-way forest trust exists between contoso.com and fabrikam.com. No other trust was created manually.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    La forêt **contoso.com** contient les domaines contoso.com et **eu.contoso.com**. La forêt **fabrikam.com** contient les domaines fabrikam.com et **na.fabrikam.com**. Une approbation de forêt bidirectionnelle existe entre contoso.com et fabrikam.com. Aucune autre approbation n'a été créée manuellement.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Users in eu.contoso.com can be granted access to resources in na.fabrikam.com.", fr: "Les utilisateurs de eu.contoso.com peuvent obtenir l'accès aux ressources de na.fabrikam.com." } }
    - { id: b, text: { en: "The forest trust could have been created between eu.contoso.com and na.fabrikam.com instead of the forest root domains.", fr: "L'approbation de forêt aurait pu être créée entre eu.contoso.com et na.fabrikam.com au lieu des domaines racines des forêts." } }
    - { id: c, text: { en: "A two-way transitive trust between contoso.com and eu.contoso.com was created automatically.", fr: "Une approbation bidirectionnelle transitive entre contoso.com et eu.contoso.com a été créée automatiquement." } }
    - { id: d, text: { en: "Users in na.fabrikam.com can access contoso.com resources only after you create an external trust between na.fabrikam.com and contoso.com.", fr: "Les utilisateurs de na.fabrikam.com ne peuvent accéder aux ressources de contoso.com qu'après la création d'une approbation externe entre na.fabrikam.com et contoso.com." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: A forest trust is transitive between the two forests, so every domain of one forest can be granted access to every domain of the other. When a child domain is created, a two-way transitive parent-child trust is created automatically with its parent.
    fr: "Une approbation de forêt est transitive entre les deux forêts : chaque domaine d'une forêt peut obtenir l'accès à chaque domaine de l'autre. Lors de la création d'un domaine enfant, une approbation parent-enfant bidirectionnelle et transitive est créée automatiquement avec son parent."
  options:
    b: { en: "A forest trust can be created only between the forest root domains of the two forests.", fr: "Une approbation de forêt ne peut être créée qu'entre les domaines racines des deux forêts." }
    d: { en: "The forest trust already covers na.fabrikam.com; no external trust is required.", fr: "L'approbation de forêt couvre déjà na.fabrikam.com ; aucune approbation externe n'est nécessaire." }
references:
  - title: How trust relationships work for forests in Active Directory
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/concepts-forest-trust
