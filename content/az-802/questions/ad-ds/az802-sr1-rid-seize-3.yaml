id: az802-sr1-rid-seize-3
objective: "1.1.5"
type: series_yesno
series: az802-sr1-rid-seize
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You run Move-ADDirectoryServerOperationMasterRole with the Force parameter and the Identity parameter set to DC1.
  fr: Vous exécutez Move-ADDirectoryServerOperationMasterRole avec le paramètre Force et le paramètre Identity défini sur DC1.
body:
  solution:
    en: |
      On DC2, you run the following command:

      ```powershell
      Move-ADDirectoryServerOperationMasterRole -Identity DC1 -OperationMasterRole RIDMaster -Force
      ```
    fr: |
      Sur DC2, vous exécutez la commande suivante :

      ```powershell
      Move-ADDirectoryServerOperationMasterRole -Identity DC1 -OperationMasterRole RIDMaster -Force
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      The `-Identity` parameter names the directory server that receives the roles, not the failed holder. The command targets DC1, which is offline and already the RID master, so DC2 never receives the role. The correct seizure is `Move-ADDirectoryServerOperationMasterRole -Identity DC2 -OperationMasterRole RIDMaster -Force`.
    fr: |
      Le paramètre `-Identity` désigne le serveur d'annuaire qui reçoit les rôles, et non le détenteur en panne. La commande cible DC1, qui est hors ligne et déjà maître RID : DC2 ne reçoit jamais le rôle. La saisie correcte est `Move-ADDirectoryServerOperationMasterRole -Identity DC2 -OperationMasterRole RIDMaster -Force`.
references:
  - title: Move-ADDirectoryServerOperationMasterRole (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/move-addirectoryserveroperationmasterrole
