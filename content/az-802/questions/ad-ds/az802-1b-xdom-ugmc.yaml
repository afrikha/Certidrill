id: az802-1b-xdom-ugmc
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The **corp.contoso.com** forest has two domains. The branch site **Tours** has 40 users and one domain controller, **DC-TRS**, which isn't a global catalog server. Tours is connected to the **Paris** hub site, where the global catalog servers are, by a slow WAN link. Users are members of universal groups, and no application in Tours requires a global catalog.

    When the WAN link fails, users in Tours can't sign in. You need sign-ins in Tours to keep working during WAN outages. The solution must minimize the replication traffic over the WAN link.

    What should you do?
  fr: |
    La forêt **corp.contoso.com** compte deux domaines. Le site de succursale **Tours** compte 40 utilisateurs et un contrôleur de domaine, **DC-TRS**, qui n'est pas serveur de catalogue global. Tours est relié au site central **Paris**, où se trouvent les serveurs de catalogue global, par une liaison WAN lente. Les utilisateurs sont membres de groupes universels, et aucune application de Tours n'a besoin d'un catalogue global.

    Lorsque la liaison WAN tombe, les utilisateurs de Tours ne peuvent pas se connecter. Les connexions à Tours doivent continuer à fonctionner pendant les pannes WAN. La solution doit réduire au minimum le trafic de réplication sur la liaison WAN.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable universal group membership caching for the Tours site.", fr: "Activer la mise en cache de l'appartenance aux groupes universels pour le site Tours." } }
    - { id: b, text: { en: "Configure DC-TRS as a global catalog server.", fr: "Configurer DC-TRS comme serveur de catalogue global." } }
    - { id: c, text: { en: "Replace DC-TRS with a read-only domain controller.", fr: "Remplacer DC-TRS par un contrôleur de domaine en lecture seule." } }
    - { id: d, text: { en: "Enable change notification on the site link between Tours and Paris.", fr: "Activer la notification des modifications sur le lien de sites entre Tours et Paris." } }
answer: { optionId: a }
explanation:
  correct:
    en: At sign-in, a domain controller needs the user's universal group memberships, which come from a global catalog. Universal group membership caching lets DC-TRS cache them, which removes the need for a global catalog in a small site behind a limited WAN link, without replicating a partial copy of every domain to Tours.
    fr: "À la connexion, un contrôleur de domaine a besoin des appartenances de l'utilisateur aux groupes universels, qui proviennent d'un catalogue global. La mise en cache de l'appartenance aux groupes universels permet à DC-TRS de les conserver en cache : un catalogue global n'est plus nécessaire dans un petit site derrière une liaison WAN limitée, et aucune copie partielle de chaque domaine n'est répliquée vers Tours."
  options:
    b: { en: "It works, but a global catalog receives a partial replica of every domain of the forest, which increases WAN replication traffic.", fr: "Cela fonctionne, mais un catalogue global reçoit un réplica partiel de chaque domaine de la forêt, ce qui augmente le trafic de réplication sur le WAN." }
    c: { en: "An RODC that isn't a global catalog still needs a global catalog to evaluate universal group memberships.", fr: "Un RODC qui n'est pas catalogue global a toujours besoin d'un catalogue global pour évaluer les appartenances aux groupes universels." }
    d: { en: "Change notification speeds up replication when the link is up; it doesn't help when the link is down and adds traffic.", fr: "La notification des modifications accélère la réplication quand la liaison fonctionne ; elle n'aide pas quand la liaison est coupée et ajoute du trafic." }
references:
