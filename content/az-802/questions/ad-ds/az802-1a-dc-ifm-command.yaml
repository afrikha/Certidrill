id: az802-1a-dc-ifm-command
objective: "1.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a server named **Server3** that runs Windows Server 2025 in a branch office of the **corp.contoso.com** domain. The branch is connected to the main office by a slow WAN link and is represented by an existing site named **Branch1**. A domain administrator copied valid installation media created on a Windows Server 2025 domain controller to the D:\IFM folder of Server3.

    You need to make Server3 an additional writable domain controller of corp.contoso.com in the Branch1 site. Replication traffic over the WAN during the promotion must be minimized.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur nommé **Server3** qui exécute Windows Server 2025 dans une succursale du domaine **corp.contoso.com**. La succursale est reliée au siège par une liaison WAN lente et est représentée par un site existant nommé **Branch1**. Un administrateur du domaine a copié dans le dossier D:\IFM de Server3 un support d'installation valide créé sur un contrôleur de domaine Windows Server 2025.

    Vous devez faire de Server3 un contrôleur de domaine accessible en écriture supplémentaire de corp.contoso.com dans le site Branch1. Le trafic de réplication sur le WAN pendant la promotion doit être réduit au minimum.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Install-WindowsFeature -Name [[feat]] -IncludeManagementTools
    [[cmd]] -DomainName corp.contoso.com -Credential (Get-Credential) -SiteName Branch1 [[media]] "D:\IFM"
  slots:
    - id: feat
      options:
        - { id: adds, text: AD-Domain-Services }
        - { id: rsat, text: RSAT-AD-PowerShell }
        - { id: dns, text: DNS }
        - { id: gpmc, text: GPMC }
    - id: cmd
      options:
        - { id: dc, text: Install-ADDSDomainController }
        - { id: dom, text: Install-ADDSDomain }
        - { id: forest, text: Install-ADDSForest }
        - { id: rodc, text: Add-ADDSReadOnlyDomainControllerAccount }
    - id: media
      options:
        - { id: imp, text: -InstallationMediaPath }
        - { id: src, text: -ReplicationSourceDC }
        - { id: db, text: -DatabasePath }
        - { id: sysvol, text: -SysvolPath }
answer:
  values: { feat: adds, cmd: dc, media: imp }
explanation:
  correct:
    en: "The AD-Domain-Services feature provides the role binaries and, with -IncludeManagementTools, the ADDSDeployment cmdlets. Install-ADDSDomainController adds a replica domain controller to an existing domain, and -InstallationMediaPath points to the IFM media so that most of the directory is copied locally instead of over the WAN."
    fr: "La fonctionnalité AD-Domain-Services fournit les fichiers binaires du rôle et, avec -IncludeManagementTools, les applets de commande ADDSDeployment. Install-ADDSDomainController ajoute un contrôleur de domaine réplica à un domaine existant, et -InstallationMediaPath désigne le support IFM afin que l'essentiel de l'annuaire soit copié localement plutôt que sur le WAN."
  options:
    rsat: { en: "RSAT-AD-PowerShell installs only the Active Directory module, not the AD DS role.", fr: "RSAT-AD-PowerShell installe seulement le module Active Directory, pas le rôle AD DS." }
    dom: { en: "Install-ADDSDomain creates a new child or tree domain.", fr: "Install-ADDSDomain crée un nouveau domaine enfant ou une nouvelle arborescence." }
    src: { en: "-ReplicationSourceDC selects a partner domain controller; it expects a server name, not a media folder.", fr: "-ReplicationSourceDC choisit un contrôleur de domaine partenaire ; il attend un nom de serveur, pas un dossier de support." }
    db: { en: "-DatabasePath sets where NTDS.dit is created; it does not use the media.", fr: "-DatabasePath définit l'emplacement de création de NTDS.dit ; il n'utilise pas le support." }
references:
  - title: Install Active Directory Domain Services on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/install-active-directory-domain-services--level-100-
