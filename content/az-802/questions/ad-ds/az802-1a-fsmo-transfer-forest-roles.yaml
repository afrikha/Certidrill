id: az802-1a-fsmo-transfer-forest-roles
objective: "1.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    The **contoso.com** forest contains two domains. **DC1**, a domain controller of the forest root domain contoso.com, holds all the operation master roles of that domain and is online. DC1 will be decommissioned next month.

    You need to move the forest-wide operation master roles to **DC2**, another domain controller of contoso.com, and then display the name of the server that holds the schema master role.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    La forêt **contoso.com** contient deux domaines. **DC1**, contrôleur de domaine du domaine racine contoso.com, détient tous les rôles de maître d'opérations de ce domaine et est en ligne. DC1 sera mis hors service le mois prochain.

    Vous devez déplacer les rôles de maître d'opérations à l'échelle de la forêt vers **DC2**, un autre contrôleur de domaine de contoso.com, puis afficher le nom du serveur qui détient le rôle de maître de schéma.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Move-ADDirectoryServerOperationMasterRole -Identity DC2 -OperationMasterRole [[roles]]
    ([[getcmd]]).SchemaMaster
  slots:
    - id: roles
      options:
        - { id: forest, text: "SchemaMaster,DomainNamingMaster" }
        - { id: domain, text: "PDCEmulator,RIDMaster" }
        - { id: mixed, text: "3,2" }
        - { id: rid, text: "RIDMaster,InfrastructureMaster" }
    - id: getcmd
      options:
        - { id: forestcmd, text: Get-ADForest }
        - { id: domaincmd, text: Get-ADDomain }
        - { id: dccmd, text: Get-ADDomainController }
answer:
  values: { roles: forest, getcmd: forestcmd }
explanation:
  correct:
    en: "The two forest-wide roles are the schema master and the domain naming master. DC1 is online, so a transfer without -Force is the right operation. The forest object returned by Get-ADForest exposes the SchemaMaster and DomainNamingMaster properties."
    fr: "Les deux rôles à l'échelle de la forêt sont le maître de schéma et le maître d'attribution de noms de domaine. DC1 est en ligne : un transfert sans -Force est l'opération appropriée. L'objet forêt renvoyé par Get-ADForest expose les propriétés SchemaMaster et DomainNamingMaster."
  options:
    domain: { en: "The PDC emulator and RID master are domain-wide roles.", fr: "L'émulateur PDC et le maître RID sont des rôles à l'échelle du domaine." }
    mixed: { en: "3 is SchemaMaster but 2 is InfrastructureMaster, a domain-wide role; DomainNamingMaster is 4.", fr: "3 correspond à SchemaMaster mais 2 à InfrastructureMaster, un rôle à l'échelle du domaine ; DomainNamingMaster vaut 4." }
    domaincmd: { en: "Get-ADDomain exposes the domain-wide roles (PDCEmulator, RIDMaster, InfrastructureMaster), not the schema master.", fr: "Get-ADDomain expose les rôles à l'échelle du domaine (PDCEmulator, RIDMaster, InfrastructureMaster), pas le maître de schéma." }
references:
  - title: Move-ADDirectoryServerOperationMasterRole
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/move-addirectoryserveroperationmasterrole
  - title: Manage Active Directory Domain Services operations masters
    url: https://learn.microsoft.com/en-us/training/modules/deploy-manage-active-directory-domain-services-domain-controllers/6-operations-masters
