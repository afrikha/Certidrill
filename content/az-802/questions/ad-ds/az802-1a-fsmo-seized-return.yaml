id: az802-1a-fsmo-seized-return
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The **corp.fabrikam.com** domain has three domain controllers. DC1 held the RID master and PDC emulator roles. After DC1 stopped responding because of a motherboard failure, an administrator seized both roles on DC2. Two weeks later, DC1 was repaired, with its original disks, and has not been reconnected to the network.

    You need to use the DC1 hardware as a domain controller again. The solution must not cause duplicate RIDs or conflicting role owners.

    What should you do?
  fr: |
    Le domaine **corp.fabrikam.com** possède trois contrôleurs de domaine. DC1 détenait les rôles de maître RID et d'émulateur PDC. Après que DC1 a cessé de répondre en raison d'une panne de carte mère, un administrateur a pris de force les deux rôles sur DC2. Deux semaines plus tard, DC1 a été réparé, avec ses disques d'origine, et n'a pas été reconnecté au réseau.

    Vous devez réutiliser le matériel de DC1 comme contrôleur de domaine. La solution ne doit pas provoquer de RID en double ni de détenteurs de rôles en conflit.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Reconnect DC1, and then transfer the RID master and PDC emulator roles back to DC1.", fr: "Reconnecter DC1, puis lui retransférer les rôles de maître RID et d'émulateur PDC." } }
    - { id: b, text: { en: "Reconnect DC1, and then run repadmin /syncall on DC1 so that it learns the new role owners.", fr: "Reconnecter DC1, puis exécuter repadmin /syncall sur DC1 pour qu'il découvre les nouveaux détenteurs des rôles." } }
    - { id: c, text: { en: "Reinstall Windows Server on DC1, clean up the DC1 metadata from another domain controller, and then promote DC1 again.", fr: "Réinstaller Windows Server sur DC1, nettoyer les métadonnées de DC1 depuis un autre contrôleur de domaine, puis promouvoir de nouveau DC1." } }
    - { id: d, text: { en: "Start DC1 in Directory Services Restore Mode and perform an authoritative restore of its NTDS Settings object.", fr: "Démarrer DC1 en mode de restauration des services d'annuaire et effectuer une restauration faisant autorité de son objet NTDS Settings." } }
answer: { optionId: c }
explanation:
  correct:
    en: A domain controller whose roles were seized must not come back with its old database. Microsoft's guidance is to reinstall the operating system (or forcibly demote the server), remove its metadata from another domain controller with ntdsutil, and then promote it again as a new domain controller, after which you can transfer roles back to it normally.
    fr: Un contrôleur de domaine dont les rôles ont été pris de force ne doit pas revenir avec son ancienne base de données. Microsoft recommande de réinstaller le système d'exploitation (ou de rétrograder le serveur de force), de supprimer ses métadonnées depuis un autre contrôleur de domaine avec ntdsutil, puis de le promouvoir de nouveau comme nouveau contrôleur de domaine ; vous pourrez ensuite lui retransférer des rôles normalement.
  options:
    a: { en: "With its old database, DC1 still believes it owns the roles and could issue RIDs from its stale pool before replication converges.", fr: "Avec son ancienne base de données, DC1 se croit toujours détenteur des rôles et pourrait émettre des RID de son ancien pool avant la convergence de la réplication." }
    b: { en: "Reconnecting the old database is the risk itself; replication does not undo RIDs already issued or the role conflict window.", fr: "Reconnecter l'ancienne base de données est le risque lui-même ; la réplication n'annule pas les RID déjà émis ni la période de conflit de rôles." }
    d: { en: "An authoritative restore would push stale data to the other domain controllers instead of removing DC1 cleanly.", fr: "Une restauration faisant autorité pousserait des données obsolètes vers les autres contrôleurs de domaine au lieu de retirer proprement DC1." }
references:
  - title: Transfer or seize Operation Master roles
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/transfer-or-seize-operation-master-roles-in-ad-ds
