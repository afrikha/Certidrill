id: az802-1a-trust-direction
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    The **adatum.com** forest contains a single domain. The **fabrikam.com** forest contains the forest root domain fabrikam.com and a child domain named **sales.fabrikam.com**. No forest trust exists.

    An administrator ran the following command:

    `netdom trust adatum.com /domain:fabrikam.com /add /userd:fabrikam\admin1 /passwordd:* /usero:adatum\admin2 /passwordo:*`

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    La forêt **adatum.com** contient un seul domaine. La forêt **fabrikam.com** contient le domaine racine fabrikam.com et un domaine enfant nommé **sales.fabrikam.com**. Aucune approbation de forêt n'existe.

    Un administrateur a exécuté la commande suivante :

    `netdom trust adatum.com /domain:fabrikam.com /add /userd:fabrikam\admin1 /passwordd:* /usero:adatum\admin2 /passwordo:*`

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Users in fabrikam.com can be granted access to resources in adatum.com.
        fr: Les utilisateurs de fabrikam.com peuvent obtenir l'accès aux ressources de adatum.com.
    - id: s2
      text:
        en: Users in adatum.com can be granted access to resources in fabrikam.com.
        fr: Les utilisateurs de adatum.com peuvent obtenir l'accès aux ressources de fabrikam.com.
    - id: s3
      text:
        en: Users in sales.fabrikam.com can be granted access to resources in adatum.com through this trust.
        fr: Les utilisateurs de sales.fabrikam.com peuvent obtenir l'accès aux ressources de adatum.com par cette approbation.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: In netdom trust, the first argument is the trusting domain and /domain is the trusted domain, so adatum.com trusts fabrikam.com and only fabrikam.com users can be granted access to adatum.com resources. Without /twoway the trust is one-way. A trust created between domains of two forests without a forest trust is an external trust, which is nontransitive, so it does not extend to sales.fabrikam.com.
    fr: "Dans netdom trust, le premier argument est le domaine qui approuve et /domain le domaine approuvé : adatum.com approuve fabrikam.com, et seuls les utilisateurs de fabrikam.com peuvent obtenir l'accès aux ressources de adatum.com. Sans /twoway, l'approbation est unidirectionnelle. Une approbation créée entre des domaines de deux forêts sans approbation de forêt est une approbation externe, non transitive : elle ne s'étend pas à sales.fabrikam.com."
references:
  - title: Netdom trust
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netdom-trust
  - title: "Trust types: Active Directory"
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2003/cc775736(v=ws.10)
