id: az802-1b-xdom-gc-search
objective: "1.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    The **corp.contoso.com** forest contains the domains **corp.contoso.com**, **eu.corp.contoso.com** and **us.corp.contoso.com**. **DC1** is a global catalog server of corp.contoso.com.

    You need a single command that returns the user accounts whose name starts with **Kim** in all the domains of the forest.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    La forêt **corp.contoso.com** contient les domaines **corp.contoso.com**, **eu.corp.contoso.com** et **us.corp.contoso.com**. **DC1** est un serveur de catalogue global de corp.contoso.com.

    Vous avez besoin d'une seule commande qui renvoie les comptes d'utilisateur dont le nom commence par **Kim** dans tous les domaines de la forêt.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Get-ADUser -Filter "Name -like 'Kim*'" -SearchBase [[base]] `
      -Server "DC1.corp.contoso.com:[[port]]"
  slots:
    - id: base
      options:
        - { id: empty, text: '""' }
        - { id: domain, text: '"DC=corp,DC=contoso,DC=com"' }
        - { id: config, text: '"CN=Configuration,DC=corp,DC=contoso,DC=com"' }
    - id: port
      options:
        - { id: p3268, text: "3268" }
        - { id: p389, text: "389" }
        - { id: p636, text: "636" }
        - { id: p9389, text: "9389" }
answer:
  values: { base: empty, port: p3268 }
explanation:
  correct:
    en: "Port 3268 is the global catalog port, used to search all the domains of the forest. When -SearchBase is an empty string and the cmdlet is connected to a GC port, all partitions are searched; with a non-GC port, an empty search base returns an error."
    fr: "Le port 3268 est le port du catalogue global, utilisé pour rechercher dans tous les domaines de la forêt. Lorsque -SearchBase est une chaîne vide et que l'applet de commande est connectée à un port GC, toutes les partitions sont parcourues ; avec un port non GC, une base de recherche vide renvoie une erreur."
  options:
    domain: { en: "This search base limits the search to the corp.contoso.com domain partition and its child objects, not the other domains.", fr: "Cette base de recherche limite la recherche à la partition du domaine corp.contoso.com et à ses objets enfants, pas aux autres domaines." }
    config: { en: "User accounts aren't stored in the configuration partition.", fr: "Les comptes d'utilisateur ne sont pas stockés dans la partition de configuration." }
    p389: { en: "389 is the default LDAP port of the domain controller, which holds only its own domain partition in full.", fr: "389 est le port LDAP par défaut du contrôleur de domaine, qui ne détient en entier que sa propre partition de domaine." }
    p636: { en: "636 is secure LDAP to the domain controller, not to the global catalog.", fr: "636 est le LDAP sécurisé vers le contrôleur de domaine, pas vers le catalogue global." }
    p9389: { en: "9389 is the Active Directory Web Services port that the cmdlets use internally; you don't specify it in -Server.", fr: "9389 est le port des services web Active Directory que les applets de commande utilisent en interne ; il ne se spécifie pas dans -Server." }
references:
  - title: Specify a server name and port number for an Active Directory cmdlet
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/specify-server-port-active-directory-powershell-cmdlet
  - title: Get-ADUser (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-aduser
