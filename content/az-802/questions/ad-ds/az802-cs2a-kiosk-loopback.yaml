id: az802-cs2a-kiosk-loopback
objective: "1.4.1"
type: dropdown
caseStudy: az802-cs2a-coho-winery
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the kiosks requirement.

    What should you configure? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence relative aux kiosques.

    Que devez-vous configurer ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Configuration: [[setting]]

      Location: [[where]]
    fr: |
      Configuration : [[setting]]

      Emplacement : [[where]]
  slots:
    - id: setting
      options:
        - { id: merge, text: { en: "Loopback processing in Merge mode", fr: "Traitement par bouclage en mode Merge" } }
        - { id: replace, text: { en: "Loopback processing in Replace mode", fr: "Traitement par bouclage en mode Replace" } }
        - { id: block, text: { en: "Block Inheritance", fr: "Bloquer l'héritage" } }
        - { id: enforced, text: { en: "Enforced", fr: "Appliqué" } }
    - id: where
      options:
        - { id: kcomp, text: { en: "Computer Configuration of Kiosk-Lockdown", fr: "Configuration ordinateur de Kiosk-Lockdown" } }
        - { id: kuser, text: { en: "User Configuration of Kiosk-Lockdown", fr: "Configuration utilisateur de Kiosk-Lockdown" } }
        - { id: ddp, text: { en: "Computer Configuration of the Default Domain Policy", fr: "Configuration ordinateur de la stratégie Default Domain Policy" } }
        - { id: staff, text: { en: "The Staff OU", fr: "L'UO Staff" } }
answer:
  values: { setting: replace, where: kcomp }
explanation:
  correct:
    en: |
      The user settings of Kiosk-Lockdown are linked to the OU of the computers, so they apply to users only through loopback processing. The setting Configure user Group Policy loopback processing mode is a computer setting, so it goes in the Computer Configuration of a GPO that applies to the kiosks, such as Kiosk-Lockdown. Replace mode ignores the GPOs of the user account and applies only the user settings of the GPOs that apply to the computer.
    fr: |
      Les paramètres utilisateur de Kiosk-Lockdown sont liés à l'UO des ordinateurs : ils ne s'appliquent aux utilisateurs que par le traitement par bouclage. Le paramètre Configure user Group Policy loopback processing mode est un paramètre ordinateur : il se place dans la Configuration ordinateur d'un GPO qui s'applique aux kiosques, comme Kiosk-Lockdown. Le mode Replace ignore les GPO du compte d'utilisateur et applique uniquement les paramètres utilisateur des GPO qui s'appliquent à l'ordinateur.
  options:
    merge:
      en: |
        Merge mode adds the computer's GPOs after the user's GPOs, so the user's usual settings would still apply.
      fr: |
        Le mode Merge ajoute les GPO de l'ordinateur après ceux de l'utilisateur : les paramètres habituels de l'utilisateur s'appliqueraient toujours.
    block:
      en: |
        Block Inheritance stops GPOs linked to parent containers from applying to an OU; it does not apply user settings based on the computer's location.
      fr: |
        Bloquer l'héritage empêche les GPO liés aux conteneurs parents de s'appliquer à une UO ; cela n'applique pas les paramètres utilisateur en fonction de l'emplacement de l'ordinateur.
    ddp:
      en: |
        Enabling loopback processing in the Default Domain Policy would affect every computer of the domain, not only the kiosks.
      fr: |
        Activer le traitement par bouclage dans la stratégie Default Domain Policy affecterait tous les ordinateurs du domaine, pas uniquement les kiosques.
references:
  - title: Loopback processing of Group Policy
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/group-policy/loopback-processing-of-group-policy
