id: az802-1a-azdc-vnet-dns-ps
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A virtual network named **VNet-Hub** in a resource group named **RG-Identity** currently uses an on-premises domain controller (192.168.10.5) as its custom DNS server. You promoted two Azure virtual machines in VNet-Hub, VM-DC1 (10.1.0.4) and VM-DC2 (10.1.0.5), to domain controllers that run the DNS Server role.

    You need to configure VNet-Hub so that its virtual machines use VM-DC1 and VM-DC2 as DNS servers.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un réseau virtuel nommé **VNet-Hub**, dans un groupe de ressources nommé **RG-Identity**, utilise actuellement un contrôleur de domaine local (192.168.10.5) comme serveur DNS personnalisé. Vous avez promu deux machines virtuelles Azure de VNet-Hub, VM-DC1 (10.1.0.4) et VM-DC2 (10.1.0.5), en contrôleurs de domaine qui exécutent le rôle Serveur DNS.

    Vous devez configurer VNet-Hub pour que ses machines virtuelles utilisent VM-DC1 et VM-DC2 comme serveurs DNS.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $vnet = Get-AzVirtualNetwork -ResourceGroupName RG-Identity -Name VNet-Hub
    $vnet.[[prop]] = @("10.1.0.4", "10.1.0.5")
    [[cmd]] -VirtualNetwork $vnet
  slots:
    - id: prop
      options:
        - { id: dns, text: DhcpOptions.DnsServers }
        - { id: prefixes, text: AddressSpace.AddressPrefixes }
        - { id: subnets, text: Subnets }
    - id: cmd
      options:
        - { id: setvnet, text: Set-AzVirtualNetwork }
        - { id: newvnet, text: New-AzVirtualNetwork }
        - { id: updvm, text: Update-AzVM }
        - { id: setnic, text: Set-AzNetworkInterface }
answer:
  values: { prop: dns, cmd: setvnet }
explanation:
  correct:
    en: "The custom DNS servers of a virtual network are stored in its DhcpOptions.DnsServers property. Set-AzVirtualNetwork writes the modified virtual network object back to Azure; virtual machines use the new servers after they renew their configuration or restart."
    fr: "Les serveurs DNS personnalisés d'un réseau virtuel sont stockés dans sa propriété DhcpOptions.DnsServers. Set-AzVirtualNetwork réécrit dans Azure l'objet réseau virtuel modifié ; les machines virtuelles utilisent les nouveaux serveurs après le renouvellement de leur configuration ou un redémarrage."
  options:
    prefixes: { en: "AddressSpace.AddressPrefixes holds the IP ranges of the virtual network, not its DNS servers.", fr: "AddressSpace.AddressPrefixes contient les plages d'adresses IP du réseau virtuel, pas ses serveurs DNS." }
    newvnet: { en: "New-AzVirtualNetwork creates a virtual network; it does not update an existing object.", fr: "New-AzVirtualNetwork crée un réseau virtuel ; il ne met pas à jour un objet existant." }
    setnic: { en: "Set-AzNetworkInterface updates one network interface and does not accept a virtual network object.", fr: "Set-AzNetworkInterface met à jour une interface réseau et n'accepte pas d'objet réseau virtuel." }
references:
  - title: Deploy AD DS in an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/identity/adds-extend-domain
