id: az802-sr2-gmsa-farm-2
objective: "1.3.3"
type: series_yesno
series: az802-sr2-gmsa-farm
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    You create a gMSA that the WebServers group can retrieve, install it on each server and configure App1 to use it.
  fr: |
    Vous créez un gMSA que le groupe WebServers peut récupérer, l'installez sur chaque serveur et configurez App1 pour l'utiliser.
body:
  solution:
    en: |
      You run `New-ADServiceAccount -Name gmsaApp1 -DNSHostName gmsaApp1.contoso.com -PrincipalsAllowedToRetrieveManagedPassword WebServers`. On Web1, Web2 and Web3, you run `Install-ADServiceAccount -Identity gmsaApp1`, and you configure App1 to log on as **CONTOSO\gmsaApp1$** with a blank password.
    fr: |
      Vous exécutez `New-ADServiceAccount -Name gmsaApp1 -DNSHostName gmsaApp1.contoso.com -PrincipalsAllowedToRetrieveManagedPassword WebServers`. Sur Web1, Web2 et Web3, vous exécutez `Install-ADServiceAccount -Identity gmsaApp1`, puis vous configurez App1 pour qu'il ouvre une session en tant que **CONTOSO\gmsaApp1$** avec un mot de passe vide.
answer: { value: true }
explanation:
  correct:
    en: |
      A group managed service account (gMSA) extends managed service accounts to several servers, which is the case of a load-balanced farm. The domain controllers compute its password from the KDS root key and change it automatically (every 30 days by default), and only the principals listed in PrincipalsAllowedToRetrieveManagedPassword, here the computer accounts of the WebServers group, can retrieve it. The prerequisites are met: functional levels of Windows Server 2012 or later and a replicated KDS root key.
    fr: |
      Un compte de service administré de groupe (gMSA) étend les comptes de service administrés à plusieurs serveurs, ce qui correspond à une batterie à charge équilibrée. Les contrôleurs de domaine calculent son mot de passe à partir de la clé racine KDS et le changent automatiquement (tous les 30 jours par défaut), et seuls les principaux listés dans PrincipalsAllowedToRetrieveManagedPassword, ici les comptes d'ordinateur du groupe WebServers, peuvent le récupérer. Les prérequis sont remplis : niveaux fonctionnels Windows Server 2012 ou ultérieur et clé racine KDS répliquée.
