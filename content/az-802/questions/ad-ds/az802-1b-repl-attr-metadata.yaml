id: az802-1b-repl-attr-metadata
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The **corp.contoso.com** domain has six domain controllers in three sites. The description of the **Finance-Approvers** group changed unexpectedly last week.

    You need to identify the domain controller on which the change was originally written and the date and time of the change.

    Which cmdlet should you use?
  fr: |
    Le domaine **corp.contoso.com** compte six contrôleurs de domaine répartis sur trois sites. La description du groupe **Finance-Approvers** a été modifiée de manière inattendue la semaine dernière.

    Vous devez identifier le contrôleur de domaine sur lequel la modification a été écrite à l'origine, ainsi que la date et l'heure de la modification.

    Quelle applet de commande devez-vous utiliser ?
body:
  options:
    - { id: a, text: Get-ADReplicationPartnerMetadata }
    - { id: b, text: Get-ADReplicationUpToDatenessVectorTable }
    - { id: c, text: Get-ADReplicationFailure }
    - { id: d, text: Get-ADReplicationAttributeMetadata }
answer: { optionId: d }
explanation:
  correct:
    en: Get-ADReplicationAttributeMetadata returns the replication metadata of an object's attributes, like repadmin /showobjmeta. For each attribute it shows the originating domain controller, the time of the last originating change, the version and the USNs, which is what you need to audit where and when the description changed.
    fr: Get-ADReplicationAttributeMetadata renvoie les métadonnées de réplication des attributs d'un objet, comme repadmin /showobjmeta. Pour chaque attribut, elle indique le contrôleur de domaine d'origine, l'heure de la dernière modification d'origine, la version et les USN, ce qui permet de savoir où et quand la description a changé.
  options:
    a: { en: "It returns the replication state of a domain controller with its partners (last attempt, last result), not the history of an attribute.", fr: "Elle renvoie l'état de la réplication d'un contrôleur de domaine avec ses partenaires (dernière tentative, dernier résultat), pas l'historique d'un attribut." }
    b: { en: "It shows the highest USN a domain controller has received from each partner, not which DC changed a given attribute.", fr: "Elle indique le plus haut USN reçu par un contrôleur de domaine de chaque partenaire, pas quel DC a modifié un attribut donné." }
    c: { en: "It lists recent replication errors; the change replicated successfully.", fr: "Elle liste les erreurs de réplication récentes ; la modification a été répliquée sans erreur." }
references:
  - title: Advanced Active Directory Replication and Topology Management Using Windows PowerShell (Level 200)
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/powershell/advanced-active-directory-replication-and-topology-management-using-windows-powershell--level-200-
