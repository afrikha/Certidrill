id: az802-1a-fsmo-infrastructure-gc
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The **contoso.com** forest contains two domains: contoso.com and **emea.contoso.com**. The Active Directory Recycle Bin is not enabled. The emea.contoso.com domain has the following domain controllers:

    | Name | Global catalog | Operation master roles |
    | --- | --- | --- |
    | DC-E1 | Yes | PDC emulator, RID master, infrastructure master |
    | DC-E2 | Yes | None |
    | DC-E3 | No | None |

    Groups in emea.contoso.com contain users from contoso.com. When those users are renamed in contoso.com, the member names shown in the emea.contoso.com groups are not updated, and DC-E1 logs a warning about the infrastructure master.

    You need to resolve the issue without changing the global catalog configuration.

    What should you do?
  fr: |
    La forêt **contoso.com** contient deux domaines : contoso.com et **emea.contoso.com**. La Corbeille Active Directory n'est pas activée. Le domaine emea.contoso.com possède les contrôleurs de domaine suivants :

    | Nom | Catalogue global | Rôles de maître d'opérations |
    | --- | --- | --- |
    | DC-E1 | Oui | Émulateur PDC, maître RID, maître d'infrastructure |
    | DC-E2 | Oui | Aucun |
    | DC-E3 | Non | Aucun |

    Des groupes de emea.contoso.com contiennent des utilisateurs de contoso.com. Lorsque ces utilisateurs sont renommés dans contoso.com, les noms des membres affichés dans les groupes de emea.contoso.com ne sont pas mis à jour, et DC-E1 journalise un avertissement concernant le maître d'infrastructure.

    Vous devez résoudre le problème sans modifier la configuration du catalogue global.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Transfer the infrastructure master role to DC-E2.", fr: "Transférer le rôle de maître d'infrastructure vers DC-E2." } }
    - { id: b, text: { en: "Transfer the infrastructure master role to DC-E3.", fr: "Transférer le rôle de maître d'infrastructure vers DC-E3." } }
    - { id: c, text: { en: "Transfer the RID master role to DC-E3.", fr: "Transférer le rôle de maître RID vers DC-E3." } }
    - { id: d, text: { en: "Transfer the PDC emulator role to DC-E3.", fr: "Transférer le rôle d'émulateur PDC vers DC-E3." } }
answer: { optionId: b }
explanation:
  correct:
    en: The infrastructure master updates references to objects from other domains. On a global catalog server it never sees these references as stale, because the global catalog already holds a partial copy of every object, so it stops updating them. Unless all domain controllers are global catalogs or the Recycle Bin is enabled, the role must be on a domain controller that is not a global catalog, which is DC-E3.
    fr: "Le maître d'infrastructure met à jour les références vers des objets d'autres domaines. Sur un serveur de catalogue global, il ne voit jamais ces références comme obsolètes, car le catalogue global contient déjà une copie partielle de chaque objet : il cesse donc de les mettre à jour. Sauf si tous les contrôleurs de domaine sont catalogues globaux ou si la Corbeille est activée, le rôle doit être sur un contrôleur de domaine qui n'est pas catalogue global, ici DC-E3."
  options:
    a: { en: "DC-E2 is also a global catalog server, so the infrastructure master would have the same problem there.", fr: "DC-E2 est aussi serveur de catalogue global : le maître d'infrastructure y aurait le même problème." }
    c: { en: "The RID master allocates RID pools; it does not update cross-domain references.", fr: "Le maître RID attribue les pools RID ; il ne met pas à jour les références interdomaines." }
    d: { en: "The PDC emulator does not update cross-domain group member references.", fr: "L'émulateur PDC ne met pas à jour les références interdomaines des membres de groupes." }
references:
  - title: Active Directory Flexible Single Master Operation (FSMO) roles in Windows
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/fsmo-roles
