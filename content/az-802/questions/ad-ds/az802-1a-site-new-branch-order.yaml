id: az802-1a-site-new-branch-order
objective: "1.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso is opening an office in Nice that uses the IP range 10.60.0.0/24. A member server named **Server6** (10.60.0.10) in Nice runs Windows Server 2025 and has the AD-Domain-Services role installed. No site or subnet object exists for Nice. Site link configuration will be handled later by another team.

    You need to make Server6 an additional domain controller of **corp.contoso.com**. When you run the promotion command, you will not specify the -SiteName parameter, and Server6 must be placed automatically in a new site named **Nice**.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso ouvre un bureau à Nice qui utilise la plage d'adresses IP 10.60.0.0/24. Un serveur membre nommé **Server6** (10.60.0.10) situé à Nice exécute Windows Server 2025 et le rôle AD-Domain-Services y est installé. Aucun objet site ni sous-réseau n'existe pour Nice. La configuration des liens de sites sera traitée plus tard par une autre équipe.

    Vous devez faire de Server6 un contrôleur de domaine supplémentaire de **corp.contoso.com**. Lorsque vous exécuterez la commande de promotion, vous ne spécifierez pas le paramètre -SiteName, et Server6 doit être placé automatiquement dans un nouveau site nommé **Nice**.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: site, text: { en: "Run New-ADReplicationSite -Name Nice.", fr: "Exécuter New-ADReplicationSite -Name Nice." } }
    - { id: subnet, text: { en: "Run New-ADReplicationSubnet -Name 10.60.0.0/24 -Site Nice.", fr: "Exécuter New-ADReplicationSubnet -Name 10.60.0.0/24 -Site Nice." } }
    - { id: promote, text: { en: "On Server6, run Install-ADDSDomainController -DomainName corp.contoso.com.", fr: "Sur Server6, exécuter Install-ADDSDomainController -DomainName corp.contoso.com." } }
    - { id: move, text: { en: "Run Move-ADDirectoryServer -Identity Server6 -Site Nice.", fr: "Exécuter Move-ADDirectoryServer -Identity Server6 -Site Nice." } }
    - { id: bridge, text: { en: "Run New-ADReplicationSiteLinkBridge for the Nice site.", fr: "Exécuter New-ADReplicationSiteLinkBridge pour le site Nice." } }
    - { id: dfsn, text: { en: "Run New-ADReplicationSubnet -Name 10.60.0.0/24 -Site Default-First-Site-Name.", fr: "Exécuter New-ADReplicationSubnet -Name 10.60.0.0/24 -Site Default-First-Site-Name." } }
answer:
  sequence: [ site, subnet, promote ]
explanation:
  correct:
    en: A subnet object can only be associated with an existing site, so you create the Nice site first and then the 10.60.0.0/24 subnet linked to it. When -SiteName is omitted, Install-ADDSDomainController places the new domain controller in the site of the subnet that contains its IP address, which is Nice.
    fr: "Un objet sous-réseau ne peut être associé qu'à un site existant : vous créez d'abord le site Nice, puis le sous-réseau 10.60.0.0/24 qui lui est lié. Lorsque -SiteName est omis, Install-ADDSDomainController place le nouveau contrôleur de domaine dans le site du sous-réseau qui contient son adresse IP, c'est-à-dire Nice."
  options:
    move: { en: "Move-ADDirectoryServer moves the server object of an existing domain controller; Server6 is not a domain controller before promotion.", fr: "Move-ADDirectoryServer déplace l'objet serveur d'un contrôleur de domaine existant ; Server6 n'est pas contrôleur de domaine avant la promotion." }
    dfsn: { en: "Associating the subnet with Default-First-Site-Name would place Server6 in that site instead of Nice.", fr: "Associer le sous-réseau à Default-First-Site-Name placerait Server6 dans ce site au lieu de Nice." }
    bridge: { en: "Site link bridges group site links; they do not determine the site of a new domain controller.", fr: "Les ponts de liens de sites regroupent des liens de sites ; ils ne déterminent pas le site d'un nouveau contrôleur de domaine." }
references:
  - title: Migrate a domain controller to a new site
    url: https://learn.microsoft.com/en-us/training/modules/deploy-manage-active-directory-domain-services-domain-controllers/5-migrate-domain-controller-new-site
  - title: Install-ADDSDomainController
    url: https://learn.microsoft.com/en-us/powershell/module/addsdeployment/install-addsdomaincontroller
