id: az802-cs3b-azure-dc
objective: "1.1.2"
type: multi
caseStudy: az802-cs3b-blue-yonder
difficulty: 2
status: draft
stem:
  en: |
    The Azure region of Sub1 supports availability zones. You need to deploy AZDC1 and AZDC2 to meet the requirement for the Azure domain controllers. Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    La région Azure de Sub1 prend en charge les zones de disponibilité. Vous devez déployer AZDC1 et AZDC2 pour satisfaire l'exigence relative aux contrôleurs de domaine Azure. Quelles sont les trois actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Store NTDS.dit, the AD DS logs and SYSVOL on a data disk whose host caching is set to None", fr: "Stocker NTDS.dit, les journaux AD DS et SYSVOL sur un disque de données dont la mise en cache de l'hôte est définie sur None" } }
    - { id: b, text: { en: "Store NTDS.dit, the AD DS logs and SYSVOL on a data disk whose host caching is set to Read/Write", fr: "Stocker NTDS.dit, les journaux AD DS et SYSVOL sur un disque de données dont la mise en cache de l'hôte est définie sur Read/Write" } }
    - { id: c, text: { en: "Assign a static private IP address to the network interface of each VM in Azure", fr: "Attribuer une adresse IP privée statique à l'interface réseau de chaque machine virtuelle dans Azure" } }
    - { id: d, text: { en: "Assign a static IP address in the Windows network adapter settings of each VM", fr: "Attribuer une adresse IP statique dans les paramètres de la carte réseau Windows de chaque machine virtuelle" } }
    - { id: e, text: { en: "Deploy AZDC1 and AZDC2 in different availability zones", fr: "Déployer AZDC1 et AZDC2 dans des zones de disponibilité différentes" } }
    - { id: f, text: { en: "Deploy AZDC1 and AZDC2 in the same proximity placement group", fr: "Déployer AZDC1 et AZDC2 dans le même groupe de placement de proximité" } }
answer:
  optionIds: [a, c, e]
explanation:
  correct:
    en: |
      The AD DS database engine manages its own write ordering, so NTDS.dit, the logs and SYSVOL belong on a separate data disk with host caching set to None. A static private IP address is set on the VM network interface in Azure so that clients can always reach the domain controller. Placing the two domain controllers in different availability zones keeps one of them available if a datacenter fails.
    fr: |
      Le moteur de base de données d'AD DS gère lui-même l'ordre de ses écritures : NTDS.dit, les journaux et SYSVOL doivent donc se trouver sur un disque de données distinct dont la mise en cache de l'hôte est None. L'adresse IP privée statique se définit sur l'interface réseau de la machine virtuelle dans Azure, afin que les clients puissent toujours joindre le contrôleur de domaine. Placer les deux contrôleurs de domaine dans des zones de disponibilité différentes garde l'un d'eux disponible si un centre de données tombe en panne.
  options:
    b:
      en: |
        Read/Write host caching can interfere with the write ordering of the AD DS database and put its consistency at risk.
      fr: |
        La mise en cache de l'hôte Read/Write peut perturber l'ordre des écritures de la base de données AD DS et compromettre sa cohérence.
    d:
      en: |
        In Azure, the guest operating system keeps getting its address from the platform; the static address is configured on the Azure network interface, not inside Windows.
      fr: |
        Dans Azure, le système d'exploitation invité continue de recevoir son adresse de la plateforme ; l'adresse statique se configure sur l'interface réseau Azure, pas dans Windows.
    f:
      en: |
        A proximity placement group keeps VMs physically close to reduce latency; it does not spread the domain controllers across zones.
      fr: |
        Un groupe de placement de proximité rapproche physiquement les machines virtuelles pour réduire la latence ; il ne répartit pas les contrôleurs de domaine entre des zones.
references:
  - title: Deploy AD DS in an Azure Virtual Network
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/identity/adds-extend-domain
