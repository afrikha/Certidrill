id: az802-1a-trust-selective-auth
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A two-way forest trust exists between the **contoso.com** and **fabrikam.com** forests. To limit exposure, an administrator enabled selective authentication on the contoso.com side of the trust.

    Members of a fabrikam.com group named **FAB-Auditors** must read a shared folder on **FS1**, a file server in contoso.com. You granted FAB-Auditors Read permissions on the share and on the NTFS folder. FAB-Auditors members still cannot access the folder. Other fabrikam.com users must not be able to authenticate to any contoso.com server.

    What should you do?
  fr: |
    Une approbation de forêt bidirectionnelle existe entre les forêts **contoso.com** et **fabrikam.com**. Pour limiter l'exposition, un administrateur a activé l'authentification sélective du côté contoso.com de l'approbation.

    Les membres d'un groupe de fabrikam.com nommé **FAB-Auditors** doivent lire un dossier partagé sur **FS1**, un serveur de fichiers de contoso.com. Vous avez accordé à FAB-Auditors l'autorisation Lecture sur le partage et sur le dossier NTFS. Les membres de FAB-Auditors ne peuvent toujours pas accéder au dossier. Les autres utilisateurs de fabrikam.com ne doivent pouvoir s'authentifier auprès d'aucun serveur de contoso.com.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant FAB-Auditors the Allowed to Authenticate permission on the FS1 computer object in contoso.com.", fr: "Accorder à FAB-Auditors l'autorisation Allowed to Authenticate sur l'objet ordinateur FS1 dans contoso.com." } }
    - { id: b, text: { en: "Disable SID filtering on the trust by running netdom trust with /quarantine:no.", fr: "Désactiver le filtrage SID sur l'approbation en exécutant netdom trust avec /quarantine:no." } }
    - { id: c, text: { en: "Change the trust to forest-wide authentication.", fr: "Passer l'approbation en authentification à l'échelle de la forêt." } }
    - { id: d, text: { en: "Add FAB-Auditors to the local Administrators group of FS1.", fr: "Ajouter FAB-Auditors au groupe Administrateurs local de FS1." } }
answer: { optionId: a }
explanation:
  correct:
    en: With selective authentication, users from the trusted forest can authenticate only to the computers of the trusting forest on which they hold the Allowed to Authenticate permission. Granting this permission on the FS1 computer object lets FAB-Auditors reach FS1, where the share and NTFS permissions then apply, while other servers stay closed.
    fr: Avec l'authentification sélective, les utilisateurs de la forêt approuvée ne peuvent s'authentifier qu'auprès des ordinateurs de la forêt qui approuve sur lesquels ils disposent de l'autorisation Allowed to Authenticate. Accorder cette autorisation sur l'objet ordinateur FS1 permet à FAB-Auditors d'atteindre FS1, où s'appliquent ensuite les autorisations de partage et NTFS, tandis que les autres serveurs restent fermés.
  options:
    b: { en: "SID filtering removes foreign SIDs from other domains; disabling it weakens security and does not bypass selective authentication.", fr: "Le filtrage SID supprime les SID étrangers d'autres domaines ; le désactiver affaiblit la sécurité et ne contourne pas l'authentification sélective." }
    c: { en: "Forest-wide authentication would let every fabrikam.com user authenticate to all contoso.com servers.", fr: "L'authentification à l'échelle de la forêt permettrait à tous les utilisateurs de fabrikam.com de s'authentifier auprès de tous les serveurs de contoso.com." }
    d: { en: "Local group membership does not replace the Allowed to Authenticate check and grants excessive rights.", fr: "L'appartenance à un groupe local ne remplace pas le contrôle Allowed to Authenticate et accorde des droits excessifs." }
references:
  - title: "Configuring Selective Authentication Settings: Domain and Forest Trusts; Active Directory"
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc816580(v=ws.10)
