id: az802-1a-rodc-branch-choice
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. is opening a small warehouse office that has no IT staff and no secure server room. The office will host one domain controller of the **proseware.com** domain so that users can sign in when the WAN link is down.

    You need to deploy the domain controller so that it cannot originate changes to the directory and stores no account passwords except those you explicitly allow.

    What should you deploy?
  fr: |
    Proseware, Inc. ouvre un petit entrepôt qui n'a ni personnel informatique ni salle serveur sécurisée. Le site hébergera un contrôleur de domaine du domaine **proseware.com** afin que les utilisateurs puissent se connecter lorsque la liaison WAN est coupée.

    Vous devez déployer ce contrôleur de domaine de façon qu'il ne puisse pas être à l'origine de modifications de l'annuaire et ne stocke aucun mot de passe de compte, hormis ceux que vous autorisez explicitement.

    Que devez-vous déployer ?
body:
  options:
    - { id: a, text: { en: "A writable domain controller whose volumes are encrypted with BitLocker", fr: "Un contrôleur de domaine accessible en écriture dont les volumes sont chiffrés avec BitLocker" } }
    - { id: b, text: { en: "A writable domain controller installed with -NoGlobalCatalog", fr: "Un contrôleur de domaine accessible en écriture installé avec -NoGlobalCatalog" } }
    - { id: c, text: { en: "A read-only domain controller (RODC)", fr: "Un contrôleur de domaine en lecture seule (RODC)" } }
    - { id: d, text: { en: "A writable domain controller installed with -CriticalReplicationOnly", fr: "Un contrôleur de domaine accessible en écriture installé avec -CriticalReplicationOnly" } }
answer: { optionId: c }
explanation:
  correct:
    en: An RODC holds a read-only copy of the AD DS database, replicates inbound only, and by default caches no passwords except those allowed by its password replication policy. It is designed for branch offices with weak physical security.
    fr: Un RODC détient une copie en lecture seule de la base de données AD DS, ne réplique qu'en entrée et, par défaut, ne met en cache aucun mot de passe, hormis ceux qu'autorise sa stratégie de réplication de mot de passe. Il est conçu pour les succursales dont la sécurité physique est faible.
  options:
    a: { en: "BitLocker protects the disks at rest, but a writable domain controller still stores all the passwords of the domain and accepts changes.", fr: "BitLocker protège les disques au repos, mais un contrôleur de domaine accessible en écriture stocke toujours tous les mots de passe du domaine et accepte les modifications." }
    b: { en: "Without the global catalog, the domain controller is still writable and stores all the domain passwords.", fr: "Sans catalogue global, le contrôleur de domaine reste accessible en écriture et stocke tous les mots de passe du domaine." }
    d: { en: "-CriticalReplicationOnly only defers noncritical replication during promotion; the domain controller remains writable.", fr: "-CriticalReplicationOnly ne fait que reporter la réplication non critique pendant la promotion ; le contrôleur de domaine reste accessible en écriture." }
references:
  - title: Deploy Active Directory Domain Services domain controllers
    url: https://learn.microsoft.com/en-us/training/modules/deploy-manage-active-directory-domain-services-domain-controllers/4-deploy-active-directory-domain-services-controllers
