id: az802-1a-dc-ws2025-functional-level
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The **fabrikam.com** forest contains a single domain. The domain has two domain controllers named DC1 and DC2 that run Windows Server 2022. The forest and domain functional levels are **Windows Server 2012 R2**.

    You plan to add a domain controller named DC3 that runs Windows Server 2025. DC1 and DC2 must remain domain controllers.

    What should you do before you promote DC3?
  fr: |
    La forêt **fabrikam.com** contient un seul domaine. Ce domaine possède deux contrôleurs de domaine nommés DC1 et DC2 qui exécutent Windows Server 2022. Les niveaux fonctionnels de la forêt et du domaine sont **Windows Server 2012 R2**.

    Vous prévoyez d'ajouter un contrôleur de domaine nommé DC3 qui exécute Windows Server 2025. DC1 et DC2 doivent rester contrôleurs de domaine.

    Que devez-vous faire avant de promouvoir DC3 ?
body:
  options:
    - { id: a, text: { en: "Raise the domain and forest functional levels to Windows Server 2016.", fr: "Élever les niveaux fonctionnels du domaine et de la forêt à Windows Server 2016." } }
    - { id: b, text: { en: "Raise the domain and forest functional levels to Windows Server 2025.", fr: "Élever les niveaux fonctionnels du domaine et de la forêt à Windows Server 2025." } }
    - { id: c, text: { en: "Run adprep /rodcprep on the schema master.", fr: "Exécuter adprep /rodcprep sur le maître de schéma." } }
    - { id: d, text: { en: "Enable the Database 32k pages optional feature.", fr: "Activer la fonctionnalité facultative Database 32k pages." } }
answer: { optionId: a }
explanation:
  correct:
    en: A Windows Server 2025 domain controller is supported only at the Windows Server 2016 and Windows Server 2025 functional levels. Windows Server 2016 is the highest level that DC1 and DC2 (Windows Server 2022) support, so you raise the domain and forest to that level first.
    fr: Un contrôleur de domaine Windows Server 2025 n'est pris en charge qu'aux niveaux fonctionnels Windows Server 2016 et Windows Server 2025. Windows Server 2016 est le niveau le plus élevé que DC1 et DC2 (Windows Server 2022) prennent en charge ; vous élevez donc d'abord le domaine et la forêt à ce niveau.
  options:
    b: { en: "The Windows Server 2025 functional level supports only Windows Server 2025 domain controllers, so DC1 and DC2 could not stay.", fr: "Le niveau fonctionnel Windows Server 2025 ne prend en charge que des contrôleurs de domaine Windows Server 2025 : DC1 et DC2 ne pourraient pas rester." }
    c: { en: "adprep /rodcprep prepares a forest for read-only domain controllers; it does not change functional levels.", fr: "adprep /rodcprep prépare une forêt aux contrôleurs de domaine en lecture seule ; il ne modifie pas les niveaux fonctionnels." }
    d: { en: "Database 32k pages is an optional feature of the Windows Server 2025 functional level, which cannot be reached while DC1 and DC2 exist.", fr: "Database 32k pages est une fonctionnalité facultative du niveau fonctionnel Windows Server 2025, inaccessible tant que DC1 et DC2 existent." }
references:
  - title: Active Directory Domain Services functional levels
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/active-directory-functional-levels
