id: az802-cs3b-forest-trust
objective: "1.2.1"
type: yesno_statements
caseStudy: az802-cs3b-blue-yonder
difficulty: 2
status: draft
stem:
  en: |
    You plan to create a forest trust to meet the trust requirement. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer une approbation de forêt pour satisfaire l'exigence d'approbation. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The trust must be a one-way trust in which margiestravel.com is the trusted forest.
        fr: L'approbation doit être une approbation unidirectionnelle dans laquelle margiestravel.com est la forêt approuvée.
    - id: s2
      text:
        en: Before you create the trust, the DNS servers of each forest must be able to resolve the names of the other forest, for example by using conditional forwarders.
        fr: Avant de créer l'approbation, les serveurs DNS de chaque forêt doivent pouvoir résoudre les noms de l'autre forêt, par exemple à l'aide de redirecteurs conditionnels.
    - id: s3
      text:
        en: If blueyonderairlines.com later creates a forest trust with a third forest, the users of margiestravel.com can access resources in the third forest through the two trusts.
        fr: Si blueyonderairlines.com crée plus tard une approbation de forêt avec une troisième forêt, les utilisateurs de margiestravel.com peuvent accéder aux ressources de la troisième forêt par l'intermédiaire des deux approbations.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Access flows from the trusted side to the trusting side: blueyonderairlines.com, which hosts BOOK1, must trust margiestravel.com, and a one-way trust keeps Blue Yonder users out of margiestravel.com. A forest trust needs name resolution between the forests, which is usually provided by conditional forwarders on both sides. A forest trust is transitive between the two forests only; it is never extended implicitly to a third forest.
    fr: |
      L'accès va du côté approuvé vers le côté approbateur : blueyonderairlines.com, qui héberge BOOK1, doit approuver margiestravel.com, et une approbation unidirectionnelle empêche les utilisateurs de Blue Yonder d'accéder à margiestravel.com. Une approbation de forêt exige la résolution de noms entre les forêts, généralement assurée par des redirecteurs conditionnels des deux côtés. Une approbation de forêt n'est transitive qu'entre les deux forêts ; elle n'est jamais étendue implicitement à une troisième forêt.
references:
  - title: How trusts work for Microsoft Entra Domain Services
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/concepts-forest-trust
  - title: Tutorial - Create a forest trust in Microsoft Entra Domain Services
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/tutorial-create-forest-trust
