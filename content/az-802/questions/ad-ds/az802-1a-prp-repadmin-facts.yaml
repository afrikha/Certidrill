id: az802-1a-prp-repadmin-facts
objective: "1.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You manage the password replication policy of a read-only domain controller named **RODC1** by using `repadmin /prp` and the Active Directory module for Windows PowerShell.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez la stratégie de réplication de mot de passe d'un contrôleur de domaine en lecture seule nommé **RODC1** à l'aide de `repadmin /prp` et du module Active Directory pour Windows PowerShell.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can add a group to the Deny list of RODC1 by running repadmin /prp add.
        fr: Vous pouvez ajouter un groupe à la liste Refusés de RODC1 en exécutant repadmin /prp add.
    - id: s2
      text:
        en: The Allowed list of RODC1 is stored in the msDS-RevealOnDemandGroup attribute.
        fr: La liste Autorisés de RODC1 est stockée dans l'attribut msDS-RevealOnDemandGroup.
    - id: s3
      text:
        en: Running repadmin /prp delete RODC1 auth2 /all clears the list of accounts that RODC1 has authenticated.
        fr: L'exécution de repadmin /prp delete RODC1 auth2 /all efface la liste des comptes que RODC1 a authentifiés.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: repadmin /prp add works only on the Allowed list (msDS-RevealOnDemandGroup); the Deny list (msDS-NeverRevealGroup) must be changed with Active Directory Users and Computers, PowerShell or a script. The auth2 list is the Authenticated to list (msDS-AuthenticatedToAccountList), which repadmin /prp delete with /all clears.
    fr: repadmin /prp add ne fonctionne que sur la liste Autorisés (msDS-RevealOnDemandGroup) ; la liste Refusés (msDS-NeverRevealGroup) se modifie avec Utilisateurs et ordinateurs Active Directory, PowerShell ou un script. La liste auth2 est la liste Authentifiés auprès de (msDS-AuthenticatedToAccountList), que repadmin /prp delete avec /all efface.
references:
  - title: Repadmin /prp
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc835090(v=ws.11)
