id: az802-1b-repl-sync-object
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The **corp.adatum.com** domain has domain controllers in a hub site and in eight branch sites. The branch sites are connected to the hub by slow WAN links, and every site link uses the default schedule and interval.

    An administrator just restored the deleted user account **Mia Chen** from the Active Directory Recycle Bin on **DC1** in the hub site. You need the restored account to be present on every domain controller now. The solution must not force the replication of the other pending changes over the WAN links.

    What should you do?
  fr: |
    Le domaine **corp.adatum.com** possède des contrôleurs de domaine dans un site central et dans huit sites de succursale. Les succursales sont reliées au site central par des liaisons WAN lentes, et chaque lien de sites utilise la planification et l'intervalle par défaut.

    Un administrateur vient de restaurer le compte d'utilisateur supprimé **Mia Chen** depuis la Corbeille Active Directory sur **DC1**, dans le site central. Le compte restauré doit être présent sur chaque contrôleur de domaine dès maintenant. La solution ne doit pas forcer la réplication des autres modifications en attente sur les liaisons WAN.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run repadmin /syncall DC1 /AeP.", fr: "Exécuter repadmin /syncall DC1 /AeP." } }
    - { id: b, text: { en: "Run Sync-ADObject for the restored account, from DC1 to each domain controller.", fr: "Exécuter Sync-ADObject pour le compte restauré, de DC1 vers chaque contrôleur de domaine." } }
    - { id: c, text: { en: "Set the options attribute of every site link to 1.", fr: "Définir l'attribut options de chaque lien de sites sur 1." } }
    - { id: d, text: { en: "Run repadmin /replicate for the domain partition from DC1 to each branch domain controller.", fr: "Exécuter repadmin /replicate pour la partition de domaine, de DC1 vers chaque contrôleur de domaine de succursale." } }
answer: { optionId: b }
explanation:
  correct:
    en: Sync-ADObject replicates a single object between two domain controllers that share the partition, even if they aren't direct partners, like repadmin /replsingleobj. Running it from DC1 to each domain controller (for example in a loop over Get-ADDomainController) makes the restored account available everywhere without pushing the rest of the pending changes over the WAN.
    fr: Sync-ADObject réplique un seul objet entre deux contrôleurs de domaine qui partagent la partition, même s'ils ne sont pas partenaires directs, comme repadmin /replsingleobj. L'exécuter de DC1 vers chaque contrôleur de domaine (par exemple dans une boucle sur Get-ADDomainController) rend le compte restauré disponible partout sans pousser le reste des modifications en attente sur le WAN.
  options:
    a: { en: "syncall pushes every partition from DC1 to all its partners, including all the other pending changes.", fr: "syncall pousse toutes les partitions de DC1 vers tous ses partenaires, y compris toutes les autres modifications en attente." }
    c: { en: "Change notification on the site links speeds up all future intersite replication; it doesn't target one object and replicates every change.", fr: "La notification des modifications sur les liens de sites accélère toute la réplication intersite future ; elle ne cible pas un objet et réplique toutes les modifications." }
    d: { en: "replicate synchronizes the whole domain partition, so every pending change of that partition crosses the WAN.", fr: "replicate synchronise toute la partition de domaine : toutes les modifications en attente de cette partition traversent le WAN." }
references:
  - title: Advanced Active Directory Replication and Topology Management Using Windows PowerShell (Level 200)
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/powershell/advanced-active-directory-replication-and-topology-management-using-windows-powershell--level-200-
  - title: Sync-ADObject (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/sync-adobject
