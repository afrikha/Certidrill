id: az802-1b-usr-new-disabled
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    On **DC1**, a domain controller of **corp.contoso.com**, you run the following command:

    `New-ADUser -Name "Lena Hoffmann" -SamAccountName "lhoffmann" -Path "OU=Sales,DC=corp,DC=contoso,DC=com"`

    The command completes without an error.

    What is the state of the new account?
  fr: |
    Sur **DC1**, un contrôleur de domaine de **corp.contoso.com**, vous exécutez la commande suivante :

    `New-ADUser -Name "Lena Hoffmann" -SamAccountName "lhoffmann" -Path "OU=Sales,DC=corp,DC=contoso,DC=com"`

    La commande se termine sans erreur.

    Quel est l'état du nouveau compte ?
body:
  options:
    - { id: a, text: { en: "It's in the Sales OU, disabled, and has no password.", fr: "Il se trouve dans l'UO Sales, il est désactivé et n'a pas de mot de passe." } }
    - { id: b, text: { en: "It's in the Sales OU, enabled, and has a blank password.", fr: "Il se trouve dans l'UO Sales, il est activé et a un mot de passe vide." } }
    - { id: c, text: { en: "It's in the Sales OU, enabled, and the user must set a password at the next sign-in.", fr: "Il se trouve dans l'UO Sales, il est activé et l'utilisateur doit définir un mot de passe à la prochaine connexion." } }
    - { id: d, text: { en: "It's in the Users container, disabled, and has no password.", fr: "Il se trouve dans le conteneur Users, il est désactivé et n'a pas de mot de passe." } }
answer: { optionId: a }
explanation:
  correct:
    en: "-Path places the account in the Sales OU. New-ADUser creates user accounts without a password by default, and an account is never enabled unless a valid password is set (or PasswordNotRequired is true), so the account is disabled. Set a password with Set-ADAccountPassword -Reset and enable it with Enable-ADAccount, or pass -AccountPassword and -Enabled $true at creation."
    fr: "-Path place le compte dans l'UO Sales. New-ADUser crée par défaut les comptes d'utilisateur sans mot de passe, et un compte n'est jamais activé tant qu'un mot de passe valide n'est pas défini (ou que PasswordNotRequired n'est pas à true) : le compte est donc désactivé. Définissez un mot de passe avec Set-ADAccountPassword -Reset et activez-le avec Enable-ADAccount, ou passez -AccountPassword et -Enabled $true lors de la création."
  options:
    b: { en: "Accounts are never enabled without a valid password unless PasswordNotRequired is set.", fr: "Les comptes ne sont jamais activés sans mot de passe valide, sauf si PasswordNotRequired est défini." }
    c: { en: "-ChangePasswordAtLogon wasn't specified, and the account isn't enabled anyway.", fr: "-ChangePasswordAtLogon n'a pas été spécifié, et le compte n'est de toute façon pas activé." }
    d: { en: "The Users container is used only when -Path is omitted.", fr: "Le conteneur Users n'est utilisé que si -Path est omis." }
references:
  - title: New-ADUser (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/new-aduser
