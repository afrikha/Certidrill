id: az802-1b-gpp-actions-dragdrop
objective: "1.4.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    The **Drives-Sales** GPO of **corp.contoso.com** contains a Drive Maps item that maps drive **S:** to `\\FS1\Sales`, with the **Reconnect** option selected. You plan three separate changes to the drive S: of the users, each made with one Drive Maps item.

    Which action should each Drive Maps item use? To answer, drag the appropriate actions to the correct changes. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le GPO **Drives-Sales** de **corp.contoso.com** contient un élément Drive Maps qui mappe le lecteur **S:** sur `\\FS1\Sales`, avec l'option **Reconnect** sélectionnée. Vous prévoyez trois modifications distinctes du lecteur S: des utilisateurs, chacune réalisée avec un élément Drive Maps.

    Quelle action chaque élément Drive Maps doit-il utiliser ? Pour répondre, faites glisser les actions appropriées vers les modifications correspondantes. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: create, text: Create }
    - { id: replace, text: Replace }
    - { id: update, text: Update }
    - { id: delete, text: Delete }
  targets:
    - id: t1
      text: { en: "Change only the label displayed for S:, and leave its other settings unchanged", fr: "Modifier uniquement l'étiquette affichée pour S:, sans changer ses autres paramètres" } 
    - id: t2
      text: { en: "Point S: to `\\\\FS2\\Sales` and clear the Reconnect option", fr: "Faire pointer S: vers `\\\\FS2\\Sales` et désactiver l'option Reconnect" }
    - id: t3
      text: { en: "Remove the S: mapping from the users' sessions", fr: "Supprimer le mappage S: des sessions des utilisateurs" }
answer:
  mapping: { t1: update, t2: replace, t3: delete }
explanation:
  correct:
    en: "Update changes only the settings defined in the item, but it can't change the location, Reconnect or Connect as of an existing mapping. Replace deletes and recreates the mapping with all the configured settings, so it's needed to change the location and Reconnect. Delete removes the mapping."
    fr: "Update ne modifie que les paramètres définis dans l'élément, mais ne peut pas changer l'emplacement, Reconnect ni Connect as d'un mappage existant. Replace supprime puis recrée le mappage avec tous les paramètres configurés : il est donc nécessaire pour changer l'emplacement et Reconnect. Delete supprime le mappage."
  options:
    create: { en: "Create creates a new mapping; it isn't meant to modify or remove the existing S: mapping.", fr: "Create crée un nouveau mappage ; il n'est pas prévu pour modifier ou supprimer le mappage S: existant." }
references:
  - title: Drive Map
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/dn581924(v=ws.11)
