id: az802-1b-usr-scope-convert
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The **corp.contoso.com** forest contains the domains **corp.contoso.com** and **eu.corp.contoso.com**. In corp.contoso.com, the global security group **G-Projects** is a member of the global group **G-AllStaff** and is granted Modify permissions on several shared folders.

    You need G-Projects to also contain user accounts from eu.corp.contoso.com. The existing permissions granted to G-Projects must keep working without being reassigned.

    What should you do first?
  fr: |
    La forêt **corp.contoso.com** contient les domaines **corp.contoso.com** et **eu.corp.contoso.com**. Dans corp.contoso.com, le groupe de sécurité global **G-Projects** est membre du groupe global **G-AllStaff** et dispose de l'autorisation Modification sur plusieurs dossiers partagés.

    G-Projects doit aussi contenir des comptes d'utilisateur de eu.corp.contoso.com. Les autorisations existantes accordées à G-Projects doivent continuer à fonctionner sans être réattribuées.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Convert G-Projects to the Domain local scope.", fr: "Convertir G-Projects en étendue Domaine local." } }
    - { id: b, text: { en: "Add the eu.corp.contoso.com users to G-AllStaff.", fr: "Ajouter les utilisateurs de eu.corp.contoso.com à G-AllStaff." } }
    - { id: c, text: { en: "Remove G-Projects from the members of G-AllStaff.", fr: "Retirer G-Projects des membres de G-AllStaff." } }
    - { id: d, text: { en: "Change the group type of G-Projects to Distribution.", fr: "Changer le type du groupe G-Projects en Distribution." } }
answer: { optionId: c }
explanation:
  correct:
    en: A global group can contain accounts of its own domain only, so G-Projects must become a universal group, which can contain accounts from any domain of the forest. A global group can be converted to universal only if it isn't a member of another global group, so you first remove it from G-AllStaff. The conversion keeps the group's SID, so the existing permissions keep working.
    fr: "Un groupe global ne peut contenir que des comptes de son propre domaine : G-Projects doit donc devenir un groupe universel, qui peut contenir des comptes de n'importe quel domaine de la forêt. Un groupe global ne peut être converti en universel que s'il n'est membre d'aucun autre groupe global : vous devez d'abord le retirer de G-AllStaff. La conversion conserve le SID du groupe, donc les autorisations existantes continuent de fonctionner."
  options:
    a: { en: "A global group can be converted only to the universal scope, not directly to domain local.", fr: "Un groupe global ne peut être converti qu'en étendue universelle, pas directement en domaine local." }
    b: { en: "G-AllStaff is also a global group, so it can't contain accounts from eu.corp.contoso.com either.", fr: "G-AllStaff est lui aussi un groupe global : il ne peut pas non plus contenir de comptes de eu.corp.contoso.com." }
    d: { en: "A distribution group can't appear in ACLs, so the existing permissions would stop working, and its scope rules don't change.", fr: "Un groupe de distribution ne peut pas figurer dans les listes ACL : les autorisations existantes cesseraient de fonctionner, et les règles d'étendue ne changent pas." }
references:
  - title: Active Directory Security Groups
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-groups
