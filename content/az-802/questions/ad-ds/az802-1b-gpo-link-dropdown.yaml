id: az802-1b-gpo-link-dropdown
objective: "1.4.1"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    In the **corp.contoso.com** domain, the **Security-Baseline** GPO is linked to the domain. The administrator of the **Lab** OU enabled Block Inheritance on that OU. Three GPOs are linked to the Lab OU, and **Lab-Settings** currently has the link order 3.

    You need to meet the following requirements:

    - Security-Baseline must apply to every OU of the domain, including Lab, and its settings must override the settings of any GPO linked to an OU. The other GPOs linked above Lab must remain blocked.
    - Lab-Settings must have the highest precedence of the GPOs linked to the Lab OU.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Dans le domaine **corp.contoso.com**, le GPO **Security-Baseline** est lié au domaine. L'administrateur de l'UO **Lab** a activé Bloquer l'héritage sur cette UO. Trois GPO sont liés à l'UO Lab, et **Lab-Settings** a actuellement l'ordre de lien 3.

    Vous devez respecter les exigences suivantes :

    - Security-Baseline doit s'appliquer à toutes les UO du domaine, y compris Lab, et ses paramètres doivent l'emporter sur ceux de tout GPO lié à une UO. Les autres GPO liés au-dessus de Lab doivent rester bloqués.
    - Lab-Settings doit avoir la priorité la plus haute parmi les GPO liés à l'UO Lab.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Set-GPLink -Name "Security-Baseline" -Target [[tgt]] -Enforced Yes

    Set-GPLink -Name "Lab-Settings" -Target "OU=Lab,DC=corp,DC=contoso,DC=com" -Order [[ord]]
  slots:
    - id: tgt
      options:
        - { id: dom, text: '"DC=corp,DC=contoso,DC=com"' }
        - { id: lab, text: '"OU=Lab,DC=corp,DC=contoso,DC=com"' }
        - { id: pol, text: '"CN=Policies,CN=System,DC=corp,DC=contoso,DC=com"' }
    - id: ord
      options:
        - { id: o1, text: "1" }
        - { id: o2, text: "2" }
        - { id: o3, text: "3" }
answer:
  values: { tgt: dom, ord: o1 }
explanation:
  correct:
    en: "Enforced is a property of the link, so you set it on the existing link of Security-Baseline at the domain. An enforced link applies through Block Inheritance, and GPOs linked lower can't override it, while the other parent GPOs stay blocked. Among the GPOs linked to one container, the link with the lowest link order (1) has precedence."
    fr: "Appliqué est une propriété du lien : vous le définissez sur le lien existant de Security-Baseline au niveau du domaine. Un lien appliqué passe outre le blocage de l'héritage et les GPO liés plus bas ne peuvent pas l'emporter sur lui, tandis que les autres GPO parents restent bloqués. Parmi les GPO liés à un même conteneur, le lien dont l'ordre de lien est le plus bas (1) a la priorité."
  options:
    lab: { en: "Security-Baseline has no link on the Lab OU, and a link there wouldn't enforce it on the other OUs.", fr: "Security-Baseline n'a pas de lien sur l'UO Lab, et un lien à cet endroit ne l'appliquerait pas aux autres UO." }
    pol: { en: "CN=Policies holds the Group Policy containers; GPOs aren't linked there.", fr: "CN=Policies contient les conteneurs de stratégie de groupe ; les GPO n'y sont pas liés." }
    o3: { en: "3 is the current, lowest precedence of the three links.", fr: "3 est la priorité actuelle, la plus faible des trois liens." }
    o2: { en: "Link order 1 still has a higher precedence than 2.", fr: "L'ordre de lien 1 a toujours une priorité plus haute que 2." }
references:
  - title: Group Policy processing for Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-processing
  - title: Set-GPLink (GroupPolicy)
    url: https://learn.microsoft.com/en-us/powershell/module/grouppolicy/set-gplink
