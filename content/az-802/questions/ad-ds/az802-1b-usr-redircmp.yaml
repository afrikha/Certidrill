id: az802-1b-usr-redircmp
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The domain functional level of **corp.contoso.com** is Windows Server 2016. Technicians join new servers to the domain from the **System Properties** dialog box, and the computer accounts are created in the default **Computers** container. The **Servers-Baseline** GPO is linked to the **Servers** OU, so new servers receive it only after someone moves their account.

    You need the computer accounts created by future domain joins to be placed in the Servers OU automatically. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Le niveau fonctionnel du domaine **corp.contoso.com** est Windows Server 2016. Les techniciens joignent les nouveaux serveurs au domaine depuis la boîte de dialogue **Propriétés système**, et les comptes d'ordinateur sont créés dans le conteneur par défaut **Computers**. Le GPO **Servers-Baseline** est lié à l'UO **Servers** : les nouveaux serveurs ne le reçoivent qu'une fois leur compte déplacé.

    Les comptes d'ordinateur créés par les futures jonctions au domaine doivent être placés automatiquement dans l'UO Servers. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Link the Servers-Baseline GPO to the Computers container.", fr: "Lier le GPO Servers-Baseline au conteneur Computers." } }
    - { id: b, text: { en: "Run redirusr \"OU=Servers,DC=corp,DC=contoso,DC=com\".", fr: "Exécuter redirusr \"OU=Servers,DC=corp,DC=contoso,DC=com\"." } }
    - { id: c, text: { en: "Move the Computers container into the Servers OU.", fr: "Déplacer le conteneur Computers dans l'UO Servers." } }
    - { id: d, text: { en: "Run redircmp \"OU=Servers,DC=corp,DC=contoso,DC=com\".", fr: "Exécuter redircmp \"OU=Servers,DC=corp,DC=contoso,DC=com\"." } }
answer: { optionId: d }
explanation:
  correct:
    en: The domain join UI uses the default location stored in the wellKnownObjects attribute of the domain, which is CN=Computers. redircmp changes that default location to the OU you specify, so new computer accounts land in the Servers OU and receive its GPOs. It requires the Windows Server 2003 domain functional level or later.
    fr: "L'interface de jonction au domaine utilise l'emplacement par défaut stocké dans l'attribut wellKnownObjects du domaine, c'est-à-dire CN=Computers. redircmp remplace cet emplacement par défaut par l'UO indiquée : les nouveaux comptes d'ordinateur arrivent dans l'UO Servers et reçoivent ses GPO. Cette commande exige le niveau fonctionnel de domaine Windows Server 2003 ou ultérieur."
  options:
    a: { en: "GPOs can be linked to sites, domains and OUs, not to CN containers such as Computers.", fr: "Les GPO se lient aux sites, aux domaines et aux UO, pas aux conteneurs CN comme Computers." }
    b: { en: "redirusr redirects the default location of new users and groups, not of computers.", fr: "redirusr redirige l'emplacement par défaut des nouveaux utilisateurs et groupes, pas celui des ordinateurs." }
    c: { en: "CN=Computers is a system-protected container that can't be moved.", fr: "CN=Computers est un conteneur protégé par le système qui ne peut pas être déplacé." }
references:
  - title: Redirect users and computers containers
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/redirect-users-computers-containers
