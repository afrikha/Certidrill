id: az802-1b-repl-notify-options
objective: "1.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    The **Paris** and **Lyon** sites of the **corp.contoso.com** forest are connected by a dedicated 10-Gbps link. The site link between them is named **PAR-LYS** and its **options** attribute isn't set.

    You need to meet the following requirements:

    - Changes must replicate between the two sites by change notification, as they do inside a site, instead of waiting for the site link interval.
    - Replication traffic over PAR-LYS must not be compressed, to reduce the processor load on the bridgehead servers.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les sites **Paris** et **Lyon** de la forêt **corp.contoso.com** sont reliés par une liaison dédiée de 10 Gbit/s. Le lien de sites qui les relie se nomme **PAR-LYS** et son attribut **options** n'est pas défini.

    Vous devez respecter les exigences suivantes :

    - Les modifications doivent être répliquées entre les deux sites par notification des modifications, comme à l'intérieur d'un site, au lieu d'attendre l'intervalle du lien de sites.
    - Le trafic de réplication sur PAR-LYS ne doit pas être compressé, afin de réduire la charge du processeur des serveurs tête de pont.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    [[cmd]] -Identity "PAR-LYS" -Replace @{options=[[val]]}
  slots:
    - id: cmd
      options:
        - { id: link, text: Set-ADReplicationSiteLink }
        - { id: conn, text: Set-ADReplicationConnection }
        - { id: site, text: Set-ADReplicationSite }
        - { id: bridge, text: Set-ADReplicationSiteLinkBridge }
    - id: val
      options:
        - { id: v1, text: "1" }
        - { id: v4, text: "4" }
        - { id: v5, text: "5" }
answer:
  values: { cmd: link, val: v5 }
explanation:
  correct:
    en: "Change notification between sites is a flag of the site link object, set with Set-ADReplicationSiteLink -Replace @{options=1}. The options attribute is a bitmask: adding the flag 4 disables the compression of intersite replication on that link, so the value 5 (1 + 4) enables change notification and disables compression."
    fr: "La notification des modifications entre sites est un indicateur de l'objet lien de sites, défini avec Set-ADReplicationSiteLink -Replace @{options=1}. L'attribut options est un masque de bits : l'ajout de l'indicateur 4 désactive la compression de la réplication intersite sur ce lien, donc la valeur 5 (1 + 4) active la notification des modifications et désactive la compression."
  options:
    conn: { en: "Connection objects belong to a destination domain controller; the change notification setting of intersite replication is on the site link.", fr: "Les objets de connexion appartiennent à un contrôleur de domaine de destination ; le paramètre de notification de la réplication intersite se trouve sur le lien de sites." }
    site: { en: "A site object has no setting for the replication behavior of a link between two sites.", fr: "Un objet site n'a pas de paramètre pour le comportement de réplication d'un lien entre deux sites." }
    bridge: { en: "A site link bridge only groups site links for transitivity; PAR-LYS is a site link.", fr: "Un pont de liens de sites ne fait que regrouper des liens de sites pour la transitivité ; PAR-LYS est un lien de sites." }
    v1: { en: "1 enables change notification but leaves compression on.", fr: "1 active la notification des modifications mais laisse la compression active." }
    v4: { en: "4 disables compression without enabling change notification.", fr: "4 désactive la compression sans activer la notification des modifications." }
references:
  - title: Set-ADReplicationSiteLink (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/set-adreplicationsitelink
  - title: Advanced Active Directory Replication and Topology Management Using Windows PowerShell (Level 200)
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/powershell/advanced-active-directory-replication-and-topology-management-using-windows-powershell--level-200-
