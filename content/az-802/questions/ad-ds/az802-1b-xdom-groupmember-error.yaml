id: az802-1b-xdom-groupmember-error
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A one-way forest trust exists in which the **corp.contoso.com** forest trusts the **fabrikam.com** forest. The domain local group **DL-Reports-Read** of corp.contoso.com contains user accounts of corp.contoso.com and global groups of fabrikam.com.

    On **DC1**, a domain controller of corp.contoso.com, you run `Get-ADGroupMember -Identity "DL-Reports-Read"`, and the cmdlet fails with the error "An unspecified error has occurred".

    You need to review the current members of DL-Reports-Read today. You must not change the trust configuration or the group.

    What should you do?
  fr: |
    Il existe une approbation de forêt unidirectionnelle dans laquelle la forêt **corp.contoso.com** approuve la forêt **fabrikam.com**. Le groupe local de domaine **DL-Reports-Read** de corp.contoso.com contient des comptes d'utilisateur de corp.contoso.com et des groupes globaux de fabrikam.com.

    Sur **DC1**, un contrôleur de domaine de corp.contoso.com, vous exécutez `Get-ADGroupMember -Identity "DL-Reports-Read"`, et l'applet de commande échoue avec l'erreur « An unspecified error has occurred ».

    Vous devez examiner aujourd'hui les membres actuels de DL-Reports-Read. Vous ne devez modifier ni la configuration de l'approbation ni le groupe.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run Get-ADGroupMember -Identity \"DL-Reports-Read\" -Recursive.", fr: "Exécuter Get-ADGroupMember -Identity \"DL-Reports-Read\" -Recursive." } }
    - { id: b, text: { en: "View the Members tab of DL-Reports-Read in Active Directory Users and Computers.", fr: "Consulter l'onglet Membres de DL-Reports-Read dans Utilisateurs et ordinateurs Active Directory." } }
    - { id: c, text: { en: "Run Get-ADPrincipalGroupMembership -Identity \"DL-Reports-Read\".", fr: "Exécuter Get-ADPrincipalGroupMembership -Identity \"DL-Reports-Read\"." } }
    - { id: d, text: { en: "Convert DL-Reports-Read to a universal group, and then run Get-ADGroupMember again.", fr: "Convertir DL-Reports-Read en groupe universel, puis exécuter de nouveau Get-ADGroupMember." } }
answer: { optionId: b }
explanation:
  correct:
    en: In a one-way trust, Get-ADGroupMember can fail with this error on a group of the trusting forest that contains members of the trusted forest. Microsoft documents two workarounds, viewing the members in Active Directory Users and Computers or converting the trust to two-way; only the first one leaves the trust unchanged.
    fr: "Dans une approbation unidirectionnelle, Get-ADGroupMember peut échouer avec cette erreur sur un groupe de la forêt qui approuve lorsqu'il contient des membres de la forêt approuvée. Microsoft documente deux solutions de contournement : consulter les membres dans Utilisateurs et ordinateurs Active Directory ou rendre l'approbation bidirectionnelle ; seule la première laisse l'approbation inchangée."
  options:
    a: { en: "-Recursive still resolves the same foreign members, so the cmdlet fails the same way.", fr: "-Recursive résout toujours les mêmes membres étrangers : l'applet de commande échoue de la même façon." }
    c: { en: "This cmdlet lists the groups that DL-Reports-Read is a member of, not its members.", fr: "Cette applet de commande liste les groupes dont DL-Reports-Read est membre, pas ses membres." }
    d: { en: "It changes the group, and a universal group can't contain principals of fabrikam.com.", fr: "Cela modifie le groupe, et un groupe universel ne peut pas contenir de principaux de fabrikam.com." }
references:
  - title: Fail to run Get-ADGroupMember for domain local group
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/get-adgroupmember-error-remote-forest-members
