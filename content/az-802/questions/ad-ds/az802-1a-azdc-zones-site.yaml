id: az802-1a-azdc-zones-site
objective: "1.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has an on-premises AD DS domain named **northwind.local** with one site named **Paris-HQ**. The datacenter is connected to an Azure virtual network named **VNet-Prod** (10.50.0.0/16) by a site-to-site VPN. The Azure region that hosts VNet-Prod supports availability zones.

    You plan to deploy two domain controllers in VNet-Prod. The solution must meet the following requirements:

    - The failure of one Azure datacenter in the region must not make both Azure domain controllers unavailable.
    - Virtual machines in VNet-Prod must authenticate against the Azure domain controllers rather than across the VPN.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders possède un domaine AD DS local nommé **northwind.local** avec un seul site nommé **Paris-HQ**. Le centre de données est relié à un réseau virtuel Azure nommé **VNet-Prod** (10.50.0.0/16) par un VPN site à site. La région Azure qui héberge VNet-Prod prend en charge les zones de disponibilité.

    Vous prévoyez de déployer deux contrôleurs de domaine dans VNet-Prod. La solution doit répondre aux exigences suivantes :

    - La défaillance d'un centre de données Azure de la région ne doit pas rendre indisponibles les deux contrôleurs de domaine Azure.
    - Les machines virtuelles de VNet-Prod doivent s'authentifier auprès des contrôleurs de domaine Azure plutôt qu'à travers le VPN.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deploy the two domain controller virtual machines in different availability zones.", fr: "Déployer les deux machines virtuelles contrôleurs de domaine dans des zones de disponibilité différentes." } }
    - { id: b, text: { en: "Deploy the two domain controller virtual machines in one availability set in a single zone.", fr: "Déployer les deux machines virtuelles contrôleurs de domaine dans un groupe à haute disponibilité au sein d'une seule zone." } }
    - { id: c, text: { en: "Create an AD DS site for Azure, associate the 10.50.0.0/16 subnet with it, and link it to Paris-HQ with a site link.", fr: "Créer un site AD DS pour Azure, lui associer le sous-réseau 10.50.0.0/16 et le relier à Paris-HQ par un lien de sites." } }
    - { id: d, text: { en: "Associate the 10.50.0.0/16 subnet with the Paris-HQ site.", fr: "Associer le sous-réseau 10.50.0.0/16 au site Paris-HQ." } }
    - { id: e, text: { en: "Place an internal load balancer in front of the two Azure domain controllers.", fr: "Placer un équilibreur de charge interne devant les deux contrôleurs de domaine Azure." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Microsoft recommends at least two domain controllers in different availability zones when the region supports them, so the loss of one datacenter leaves a domain controller online. A dedicated AD DS site that contains the Azure subnets, linked to the on-premises site, makes the DC locator send Azure clients to the Azure domain controllers and lets replication between the sites follow the site link.
    fr: "Microsoft recommande au moins deux contrôleurs de domaine dans des zones de disponibilité différentes lorsque la région les prend en charge : la perte d'un centre de données laisse un contrôleur de domaine en ligne. Un site AD DS dédié contenant les sous-réseaux Azure et relié au site local amène le localisateur de contrôleurs de domaine à diriger les clients Azure vers les contrôleurs de domaine Azure, et la réplication entre les sites suit le lien de sites."
  options:
    b: { en: "An availability set protects against rack failures within one datacenter, not against the loss of that datacenter; it is the fallback only when zones are not available.", fr: "Un groupe à haute disponibilité protège des pannes de rack dans un centre de données, pas de la perte de ce centre ; c'est la solution de repli seulement sans zones de disponibilité." }
    d: { en: "With the Azure subnet in Paris-HQ, Azure clients would treat on-premises and Azure domain controllers alike and could authenticate across the VPN.", fr: "Si le sous-réseau Azure est dans Paris-HQ, les clients Azure traiteraient de la même façon les contrôleurs de domaine locaux et Azure et pourraient s'authentifier à travers le VPN." }
    e: { en: "Domain controllers are located through DNS and the DC locator; no load balancer is needed.", fr: "Les contrôleurs de domaine sont localisés par DNS et le localisateur ; aucun équilibreur de charge n'est nécessaire." }
references:
  - title: Deploy AD DS in an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/identity/adds-extend-domain
