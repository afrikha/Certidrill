id: az802-1a-rodc-defaults
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The DNS zone of the **corp.contoso.com** domain is Active Directory–integrated. You install a read-only domain controller named **RODC2** in an existing site named **Lille** by running the following command on a domain-joined server:

    `Install-ADDSDomainController -DomainName corp.contoso.com -ReadOnlyReplica -SiteName Lille -Credential (Get-Credential)`

    No other parameter is specified. Which two statements describe RODC2 after the promotion?

    NOTE: Each correct selection is worth one point.
  fr: |
    La zone DNS du domaine **corp.contoso.com** est intégrée à Active Directory. Vous installez un contrôleur de domaine en lecture seule nommé **RODC2** dans un site existant nommé **Lille** en exécutant la commande suivante sur un serveur joint au domaine :

    `Install-ADDSDomainController -DomainName corp.contoso.com -ReadOnlyReplica -SiteName Lille -Credential (Get-Credential)`

    Aucun autre paramètre n'est spécifié. Quelles sont les deux affirmations qui décrivent RODC2 après la promotion ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "RODC2 is a global catalog server.", fr: "RODC2 est un serveur de catalogue global." } }
    - { id: b, text: { en: "RODC2 runs the DNS Server service.", fr: "RODC2 exécute le service Serveur DNS." } }
    - { id: c, text: { en: "The passwords of the members of Backup Operators can be cached on RODC2.", fr: "Les mots de passe des membres de Backup Operators peuvent être mis en cache sur RODC2." } }
    - { id: d, text: { en: "RODC2 can hold the PDC emulator role of the domain.", fr: "RODC2 peut détenir le rôle d'émulateur PDC du domaine." } }
    - { id: e, text: { en: "Writable domain controllers in Lille replicate inbound changes from RODC2.", fr: "Les contrôleurs de domaine accessibles en écriture de Lille répliquent en entrée les modifications de RODC2." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: Install-ADDSDomainController makes the new domain controller a global catalog server unless -NoGlobalCatalog is used, and installs DNS by default when the domain's DNS names are hosted in Active Directory. Both defaults also apply to the RODC parameter set.
    fr: Install-ADDSDomainController fait du nouveau contrôleur de domaine un serveur de catalogue global, sauf si -NoGlobalCatalog est utilisé, et installe DNS par défaut lorsque les noms DNS du domaine sont hébergés dans Active Directory. Ces deux valeurs par défaut s'appliquent aussi au jeu de paramètres RODC.
  options:
    c: { en: "Backup Operators is in the default Deny list of the password replication policy.", fr: "Backup Operators figure dans la liste Refusés par défaut de la stratégie de réplication de mot de passe." }
    d: { en: "Operation master roles cannot be moved to an RODC; Move-ADDirectoryServerOperationMasterRole does not work with an RODC.", fr: "Les rôles de maître d'opérations ne peuvent pas être déplacés vers un RODC ; Move-ADDirectoryServerOperationMasterRole ne fonctionne pas avec un RODC." }
    e: { en: "RODCs replicate unidirectionally (inbound only); no domain controller replicates from an RODC.", fr: "Les RODC répliquent de façon unidirectionnelle (en entrée uniquement) ; aucun contrôleur de domaine ne réplique depuis un RODC." }
references:
  - title: Install-ADDSDomainController
    url: https://learn.microsoft.com/en-us/powershell/module/addsdeployment/install-addsdomaincontroller
  - title: Active Directory Replication Concepts
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/replication/active-directory-replication-concepts
