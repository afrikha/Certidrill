id: az802-1a-azdc-true-statements
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs four domain controllers of the **tailspin.local** domain as Azure virtual machines in two virtual networks. You are reviewing the operational guidance for these domain controllers.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys exécute quatre contrôleurs de domaine du domaine **tailspin.local** en tant que machines virtuelles Azure dans deux réseaux virtuels. Vous examinez les recommandations d'exploitation de ces contrôleurs de domaine.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "You do not need a load balancer to distribute authentication requests across the domain controllers.", fr: "Vous n'avez pas besoin d'un équilibreur de charge pour répartir les demandes d'authentification entre les contrôleurs de domaine." } }
    - { id: b, text: { en: "Copying the VHD files of a domain controller is a supported way to back up AD DS.", fr: "Copier les fichiers VHD d'un contrôleur de domaine est une méthode prise en charge pour sauvegarder AD DS." } }
    - { id: c, text: { en: "Ephemeral OS disks are recommended for domain controllers because they reduce write latency.", fr: "Les disques de système d'exploitation éphémères sont recommandés pour les contrôleurs de domaine, car ils réduisent la latence d'écriture." } }
    - { id: d, text: { en: "When a domain controller detects a new VM-Generation ID, it discards its current RID pool and resets its invocationID.", fr: "Lorsqu'un contrôleur de domaine détecte un nouvel identifiant VM-Generation ID, il abandonne son pool RID actuel et réinitialise son invocationID." } }
    - { id: e, text: { en: "Each domain controller should have a public IP address so that on-premises domain controllers can replicate with it.", fr: "Chaque contrôleur de domaine doit avoir une adresse IP publique pour que les contrôleurs de domaine locaux puissent répliquer avec lui." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Clients find domain controllers through DNS and the DC locator, so no load balancer or traffic controller is needed. A changed VM-Generation ID (restore, clone or deallocation) makes the domain controller invalidate its RID pool and reset its invocationID, which prevents duplicate RIDs and USN reuse.
    fr: Les clients trouvent les contrôleurs de domaine par DNS et le localisateur de contrôleurs de domaine ; aucun équilibreur de charge ni contrôleur de trafic n'est nécessaire. Un identifiant VM-Generation ID modifié (restauration, clonage ou libération) amène le contrôleur de domaine à invalider son pool RID et à réinitialiser son invocationID, ce qui évite les RID en double et la réutilisation des USN.
  options:
    b: { en: "The database in a copied VHD might not be consistent; perform regular AD DS backups instead.", fr: "La base de données d'un VHD copié peut ne pas être cohérente ; effectuez plutôt des sauvegardes AD DS régulières." }
    c: { en: "Microsoft recommends persistent managed disks and explicitly advises against ephemeral OS disks for domain controllers.", fr: "Microsoft recommande des disques managés persistants et déconseille explicitement les disques éphémères pour les contrôleurs de domaine." }
    e: { en: "Domain controllers must not have public IP addresses; hybrid replication uses private connectivity such as VPN or ExpressRoute.", fr: "Les contrôleurs de domaine ne doivent pas avoir d'adresse IP publique ; la réplication hybride passe par une connectivité privée comme un VPN ou ExpressRoute." }
references:
  - title: Deploy AD DS in an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/identity/adds-extend-domain
  - title: Virtualized Domain Controller Architecture
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/virtual-dc/virtualized-domain-controller-architecture
