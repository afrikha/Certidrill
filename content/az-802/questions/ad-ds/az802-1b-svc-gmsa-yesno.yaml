id: az802-1b-svc-gmsa-yesno
objective: "1.3.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    The **corp.contoso.com** forest contains the domains **corp.contoso.com** and **eu.corp.contoso.com**. In corp.contoso.com, you created a group managed service account (gMSA) named **svc-web** without specifying `-ManagedPasswordIntervalInDays`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    La forêt **corp.contoso.com** contient les domaines **corp.contoso.com** et **eu.corp.contoso.com**. Dans corp.contoso.com, vous avez créé un compte de service administré de groupe (gMSA) nommé **svc-web** sans spécifier `-ManagedPasswordIntervalInDays`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can change the password change interval of svc-web to 15 days by using Set-ADServiceAccount.
        fr: Vous pouvez faire passer l'intervalle de changement du mot de passe de svc-web à 15 jours avec Set-ADServiceAccount.
    - id: s2
      text:
        en: An administrator of eu.corp.contoso.com can't create another gMSA named svc-web in eu.corp.contoso.com.
        fr: Un administrateur de eu.corp.contoso.com ne peut pas créer un autre gMSA nommé svc-web dans eu.corp.contoso.com.
    - id: s3
      text:
        en: By default, the members of the Account Operators group can create gMSAs.
        fr: Par défaut, les membres du groupe Account Operators peuvent créer des gMSA.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: The password interval of a gMSA (30 days by default) can be set only at creation; to change it, you create a new gMSA. gMSA names must be unique in the forest, not only in the domain, so a duplicate name fails even in another domain. Account Operators don't have default rights to create gMSAs unless the permission is delegated.
    fr: "L'intervalle de mot de passe d'un gMSA (30 jours par défaut) ne peut être défini qu'à la création ; pour le modifier, vous créez un nouveau gMSA. Les noms de gMSA doivent être uniques dans la forêt, pas seulement dans le domaine : un nom en double échoue même dans un autre domaine. Les Account Operators n'ont pas par défaut le droit de créer des gMSA, sauf si cette autorisation leur est déléguée."
references:
  - title: Manage Group Managed Service Accounts
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-managed-service-accounts/group-managed-service-accounts/getting-started-with-group-managed-service-accounts
