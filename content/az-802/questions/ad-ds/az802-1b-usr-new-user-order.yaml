id: az802-1b-usr-new-user-order
objective: "1.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    The **corp.contoso.com** domain doesn't have an OU named **Interns** yet.

    You need to create the Interns OU and, in it, an account for the intern **Tom Weber**. The account must be enabled with an initial password that you type. You must use one PowerShell command per step.

    Which four commands should you run in sequence? To answer, move the appropriate commands from the list of commands to the answer area and arrange them in the correct order.
  fr: |
    Le domaine **corp.contoso.com** ne possède pas encore d'UO nommée **Interns**.

    Vous devez créer l'UO Interns et, dans celle-ci, un compte pour le stagiaire **Tom Weber**. Le compte doit être activé avec un mot de passe initial que vous saisissez. Vous devez utiliser une commande PowerShell par étape.

    Quelles sont les quatre commandes à exécuter dans l'ordre ? Pour répondre, déplacez les commandes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: ou, text: "New-ADOrganizationalUnit -Name \"Interns\" -Path \"DC=corp,DC=contoso,DC=com\"" }
    - { id: user, text: "New-ADUser -Name \"Tom Weber\" -SamAccountName \"tweber\" -Path \"OU=Interns,DC=corp,DC=contoso,DC=com\"" }
    - { id: pwd, text: "Set-ADAccountPassword -Identity \"tweber\" -Reset -NewPassword (Read-Host -AsSecureString)" }
    - { id: enable, text: "Enable-ADAccount -Identity \"tweber\"" }
    - { id: unlock, text: "Unlock-ADAccount -Identity \"tweber\"" }
    - { id: move, text: "Move-ADObject -Identity \"CN=Tom Weber,CN=Users,DC=corp,DC=contoso,DC=com\" -TargetPath \"OU=Interns,DC=corp,DC=contoso,DC=com\"" }
answer:
  sequence: [ ou, user, pwd, enable ]
explanation:
  correct:
    en: "The OU must exist before New-ADUser can create the account in it with -Path. Without -AccountPassword, New-ADUser creates the account with no password and disabled, and an account can't be enabled until a valid password is set, so you reset the password before running Enable-ADAccount."
    fr: "L'UO doit exister avant que New-ADUser puisse y créer le compte avec -Path. Sans -AccountPassword, New-ADUser crée le compte sans mot de passe et désactivé, et un compte ne peut pas être activé tant qu'un mot de passe valide n'est pas défini : vous réinitialisez donc le mot de passe avant d'exécuter Enable-ADAccount."
  options:
    unlock: { en: "A new account isn't locked out; unlocking doesn't enable it.", fr: "Un nouveau compte n'est pas verrouillé ; le déverrouiller ne l'active pas." }
    move: { en: "The account is created directly in the Interns OU by -Path, not in the Users container.", fr: "Le compte est créé directement dans l'UO Interns grâce à -Path, pas dans le conteneur Users." }
references:
  - title: New-ADUser (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/new-aduser
  - title: Set-ADAccountPassword (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/set-adaccountpassword
