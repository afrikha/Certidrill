id: az802-1b-xdom-upn-suffix
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The **corp.tailspin.local** forest contains the domains **corp.tailspin.local** and **eu.corp.tailspin.local**. The company's public email domain is **tailspintoys.com**.

    Users of both domains must be able to sign in with a user principal name (UPN) in the form `user@tailspintoys.com`. The solution must minimize administrative effort.

    What should you do first?
  fr: |
    La forêt **corp.tailspin.local** contient les domaines **corp.tailspin.local** et **eu.corp.tailspin.local**. Le domaine de messagerie public de l'entreprise est **tailspintoys.com**.

    Les utilisateurs des deux domaines doivent pouvoir se connecter avec un nom d'utilisateur principal (UPN) de la forme `user@tailspintoys.com`. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Create a new domain tree named tailspintoys.com in the forest.", fr: "Créer une nouvelle arborescence de domaine nommée tailspintoys.com dans la forêt." } }
    - { id: b, text: { en: "Add tailspintoys.com to the SPN suffixes of the forest by using Set-ADForest.", fr: "Ajouter tailspintoys.com aux suffixes SPN de la forêt avec Set-ADForest." } }
    - { id: c, text: { en: "Create a forward lookup zone named tailspintoys.com on the domain controllers.", fr: "Créer une zone de recherche directe nommée tailspintoys.com sur les contrôleurs de domaine." } }
    - { id: d, text: { en: "Add tailspintoys.com to the UPN suffixes of the forest by using Set-ADForest.", fr: "Ajouter tailspintoys.com aux suffixes UPN de la forêt avec Set-ADForest." } }
answer: { optionId: d }
explanation:
  correct:
    en: "UPN suffixes are a property of the forest. Adding the suffix, for example with Set-ADForest -UPNSuffixes @{Add=\"tailspintoys.com\"}, makes it available to the accounts of every domain of the forest; you then set the new UPN on the user accounts."
    fr: "Les suffixes UPN sont une propriété de la forêt. Ajouter le suffixe, par exemple avec Set-ADForest -UPNSuffixes @{Add=\"tailspintoys.com\"}, le rend disponible pour les comptes de tous les domaines de la forêt ; vous définissez ensuite le nouvel UPN sur les comptes d'utilisateur."
  options:
    a: { en: "A new domain tree means new domain controllers and a new domain, far more effort than adding a suffix.", fr: "Une nouvelle arborescence de domaine implique de nouveaux contrôleurs de domaine et un nouveau domaine, bien plus d'effort que l'ajout d'un suffixe." }
    b: { en: "SPN suffixes are used for service principal names, not for user sign-in names.", fr: "Les suffixes SPN servent aux noms de principal du service, pas aux noms de connexion des utilisateurs." }
    c: { en: "A UPN suffix doesn't need a DNS zone with the same name.", fr: "Un suffixe UPN n'a pas besoin d'une zone DNS du même nom." }
references:
  - title: Set-ADForest (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/set-adforest
