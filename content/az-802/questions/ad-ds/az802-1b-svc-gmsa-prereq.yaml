id: az802-1b-svc-gmsa-prereq
objective: "1.3.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You plan to create the first group managed service account (gMSA) in the **corp.contoso.com** domain for a web farm of three servers.

    Which two prerequisites must be met?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer le premier compte de service administré de groupe (gMSA) du domaine **corp.contoso.com** pour une batterie web de trois serveurs.

    Quelles sont les deux conditions préalables à remplir ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "All the domain controllers run Windows Server 2025.", fr: "Tous les contrôleurs de domaine exécutent Windows Server 2025." } }
    - { id: b, text: { en: "A Key Distribution Service (KDS) root key exists.", fr: "Une clé racine du service de distribution de clés (KDS) existe." } }
    - { id: c, text: { en: "Credential Guard is enabled on the three servers.", fr: "Credential Guard est activé sur les trois serveurs." } }
    - { id: d, text: { en: "The domain and forest functional levels are Windows Server 2012 or later.", fr: "Les niveaux fonctionnels du domaine et de la forêt sont Windows Server 2012 ou ultérieurs." } }
    - { id: e, text: { en: "A standalone managed service account is linked to each server.", fr: "Un compte de service administré autonome est lié à chaque serveur." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: The domain controllers compute gMSA passwords from a KDS root key, which must exist before you create the account, and gMSAs require domain and forest functional levels of Windows Server 2012 or later.
    fr: Les contrôleurs de domaine calculent les mots de passe des gMSA à partir d'une clé racine KDS, qui doit exister avant la création du compte, et les gMSA exigent des niveaux fonctionnels de domaine et de forêt Windows Server 2012 ou ultérieurs.
  options:
    a: { en: "Windows Server 2025 domain controllers are required for dMSAs, not for gMSAs.", fr: "Des contrôleurs de domaine Windows Server 2025 sont requis pour les dMSA, pas pour les gMSA." }
    c: { en: "Credential Guard can protect dMSAs; it isn't a gMSA prerequisite.", fr: "Credential Guard peut protéger les dMSA ; ce n'est pas une condition préalable des gMSA." }
    e: { en: "Standalone MSAs are a different account type, limited to one computer.", fr: "Les MSA autonomes sont un autre type de compte, limité à un seul ordinateur." }
references:
  - title: Manage Group Managed Service Accounts
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-managed-service-accounts/group-managed-service-accounts/getting-started-with-group-managed-service-accounts
