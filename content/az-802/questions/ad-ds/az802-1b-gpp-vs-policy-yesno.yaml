id: az802-1b-gpp-vs-policy-yesno
objective: "1.4.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    The **Desktop-Config** GPO of **corp.contoso.com** contains both Administrative Templates policy settings and Group Policy preference items. All the preference items use their default common options.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le GPO **Desktop-Config** de **corp.contoso.com** contient à la fois des paramètres de stratégie de Modèles d'administration et des éléments de préférence de stratégie de groupe. Tous les éléments de préférence utilisent leurs options communes par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A user can change a setting deployed by a preference item, and the change lasts until the next Group Policy refresh.
        fr: Un utilisateur peut modifier un paramètre déployé par un élément de préférence, et la modification dure jusqu'à la prochaine actualisation de la stratégie de groupe.
    - id: s2
      text:
        en: When Desktop-Config stops applying to a computer, the settings applied by its preference items are removed.
        fr: Lorsque Desktop-Config cesse de s'appliquer à un ordinateur, les paramètres appliqués par ses éléments de préférence sont supprimés.
    - id: s3
      text:
        en: You can use item-level targeting to apply a single Administrative Templates policy setting of Desktop-Config to the members of one group.
        fr: Vous pouvez utiliser le ciblage au niveau de l'élément pour appliquer un seul paramètre de stratégie de Modèles d'administration de Desktop-Config aux membres d'un groupe.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Preferences don't prevent users from changing the configured settings; the value is rewritten at the next refresh. By default, preference settings aren't removed when the GPO no longer applies, unless Remove this item when it is no longer applied is selected. Item-level targeting is a filtering layer of preference items only; policy settings are filtered per GPO by security filtering or WMI filters.
    fr: Les préférences n'empêchent pas les utilisateurs de modifier les paramètres configurés ; la valeur est réécrite à la prochaine actualisation. Par défaut, les paramètres de préférence ne sont pas supprimés lorsque le GPO ne s'applique plus, sauf si Remove this item when it is no longer applied est sélectionné. Le ciblage au niveau de l'élément est une couche de filtrage propre aux éléments de préférence ; les paramètres de stratégie sont filtrés par GPO, avec le filtrage de sécurité ou des filtres WMI.
references:
  - title: Group Policy preferences in Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-preferences
  - title: Group Policy processing for Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-processing
