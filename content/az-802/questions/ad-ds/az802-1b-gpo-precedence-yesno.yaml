id: az802-1b-gpo-precedence-yesno
objective: "1.4.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    The computer account of **SRV1** is in the **Servers** OU, a child OU of the **Paris** OU, in the **corp.contoso.com** domain. SRV1 is in the AD DS site **Paris-Site**. Block Inheritance is enabled on the Paris OU. The following GPOs configure two computer settings named **X** and **Y**. Security filtering and GPO status are at their defaults.

    | GPO | Linked to | Link order | Enforced | X | Y |
    | --- | --- | --- | --- | --- | --- |
    | GPO-Site | Paris-Site | 1 | No | S | Not configured |
    | GPO-Dom | corp.contoso.com | 1 | Yes | Not configured | 1 |
    | GPO-Paris | Paris OU | 1 | No | P | 2 |
    | GPO-A | Servers OU | 1 | No | A | Not configured |
    | GPO-B | Servers OU | 2 | No | B | Not configured |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le compte d'ordinateur de **SRV1** se trouve dans l'UO **Servers**, une UO enfant de l'UO **Paris**, dans le domaine **corp.contoso.com**. SRV1 se trouve dans le site AD DS **Paris-Site**. Bloquer l'héritage est activé sur l'UO Paris. Les GPO suivants configurent deux paramètres ordinateur nommés **X** et **Y**. Le filtrage de sécurité et l'état des GPO sont à leurs valeurs par défaut.

    | GPO | Lié à | Ordre de lien | Appliqué | X | Y |
    | --- | --- | --- | --- | --- | --- |
    | GPO-Site | Paris-Site | 1 | Non | S | Non configuré |
    | GPO-Dom | corp.contoso.com | 1 | Oui | Non configuré | 1 |
    | GPO-Paris | UO Paris | 1 | Non | P | 2 |
    | GPO-A | UO Servers | 1 | Non | A | Non configuré |
    | GPO-B | UO Servers | 2 | Non | B | Non configuré |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The effective value of X on SRV1 is A.
        fr: La valeur effective de X sur SRV1 est A.
    - id: s2
      text:
        en: The effective value of Y on SRV1 is 2.
        fr: La valeur effective de Y sur SRV1 est 2.
    - id: s3
      text:
        en: GPO-Site is applied to SRV1.
        fr: GPO-Site est appliqué à SRV1.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Block Inheritance on the Paris OU stops the GPOs linked to the site and to the domain, except enforced links. GPO-Dom is enforced, so it still applies and its value of Y (1) can't be overridden by GPO-Paris. GPO-Site isn't enforced, so it's blocked. For X, the Servers OU is processed last, and inside it the link order 1 (GPO-A) has the highest precedence, so X = A."
    fr: "Bloquer l'héritage sur l'UO Paris arrête les GPO liés au site et au domaine, sauf les liens appliqués. GPO-Dom est appliqué : il s'applique toujours et sa valeur de Y (1) ne peut pas être remplacée par GPO-Paris. GPO-Site n'est pas appliqué : il est bloqué. Pour X, l'UO Servers est traitée en dernier et, dans celle-ci, l'ordre de lien 1 (GPO-A) a la priorité la plus haute : X = A."
references:
  - title: Group Policy processing for Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-processing
  - title: Group Policy scope in Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-scope
