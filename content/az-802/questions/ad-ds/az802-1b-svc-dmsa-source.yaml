id: az802-1b-svc-dmsa-source
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    All the domain controllers of the **corp.contoso.com** domain run Windows Server 2025, and a KDS root key exists. The following service accounts are in use:

    | Account | Type | Used by |
    | --- | --- | --- |
    | svc-crm | Domain user account with SPNs | CRM service on SRV9 |
    | gmsa-portal$ | Group managed service account | Web portal on WEB1 and WEB2 |

    The security team wants both services to move to delegated managed service accounts (dMSAs) by using the dMSA migration process (`Start-ADServiceAccountMigration`).

    Which accounts can you migrate?
  fr: |
    Tous les contrôleurs de domaine du domaine **corp.contoso.com** exécutent Windows Server 2025, et une clé racine KDS existe. Les comptes de service suivants sont utilisés :

    | Compte | Type | Utilisé par |
    | --- | --- | --- |
    | svc-crm | Compte d'utilisateur de domaine avec des SPN | Service CRM sur SRV9 |
    | gmsa-portal$ | Compte de service administré de groupe | Portail web sur WEB1 et WEB2 |

    L'équipe de sécurité souhaite faire passer les deux services à des comptes de service administrés délégués (dMSA) en utilisant le processus de migration dMSA (`Start-ADServiceAccountMigration`).

    Quels comptes pouvez-vous migrer ?
body:
  options:
    - { id: a, text: { en: "svc-crm only", fr: "svc-crm uniquement" } }
    - { id: b, text: { en: "gmsa-portal$ only", fr: "gmsa-portal$ uniquement" } }
    - { id: c, text: { en: "Both svc-crm and gmsa-portal$", fr: "svc-crm et gmsa-portal$" } }
    - { id: d, text: { en: "Neither account; a dMSA can only be created as a standalone account", fr: "Aucun des deux ; un dMSA ne peut être créé que comme compte autonome" } }
answer: { optionId: a }
explanation:
  correct:
    en: A dMSA can be created standalone or can supersede an existing traditional service account such as svc-crm; during the migration it learns the computers that use the old account, and completing the migration disables the old account and moves its SPNs. Microsoft states that you can't migrate a managed service account or a gMSA to a dMSA.
    fr: Un dMSA peut être créé en mode autonome ou remplacer un compte de service traditionnel existant comme svc-crm ; pendant la migration, il apprend les ordinateurs qui utilisent l'ancien compte, et la fin de la migration désactive l'ancien compte et transfère ses SPN. Microsoft indique qu'il est impossible de migrer un compte de service administré ou un gMSA vers un dMSA.
  options:
    b: { en: "A gMSA can't be migrated to a dMSA.", fr: "Un gMSA ne peut pas être migré vers un dMSA." }
    c: { en: "Only traditional service accounts can be superseded; gmsa-portal$ is a gMSA.", fr: "Seuls les comptes de service traditionnels peuvent être remplacés ; gmsa-portal$ est un gMSA." }
    d: { en: "A dMSA can also replace an existing standard service account through migration.", fr: "Un dMSA peut aussi remplacer un compte de service standard existant par migration." }
references:
  - title: Delegated Managed Service Accounts overview in Windows Server 2025
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/delegated-managed-service-accounts/delegated-managed-service-accounts-overview
