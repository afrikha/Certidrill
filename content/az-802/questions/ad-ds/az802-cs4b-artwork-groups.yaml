id: az802-cs4b-artwork-groups
objective: "1.3.2"
type: dragdrop
caseStudy: az802-cs4b-lucerne-publishing
difficulty: 3
status: draft
stem:
  en: |
    You are creating the groups required to grant access to the Artwork share.

    Which type of group should you create for each need? To answer, drag the appropriate group types to the correct needs. Each group type may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez les groupes nécessaires pour accorder l'accès au partage Artwork.

    Quel type de groupe devez-vous créer pour chaque besoin ? Pour répondre, faites glisser les types de groupes appropriés vers les besoins correspondants. Chaque type de groupe peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: global, text: { en: "Global security group", fr: "Groupe de sécurité global" } }
    - { id: universal, text: { en: "Universal security group", fr: "Groupe de sécurité universel" } }
    - { id: dlocal, text: { en: "Domain local security group", fr: "Groupe de sécurité local de domaine" } }
    - { id: udist, text: { en: "Universal distribution group", fr: "Groupe de distribution universel" } }
  targets:
    - id: gdi
      text: { en: "In graphicdesigninstitute.com: the group of the illustrator user accounts, which becomes a member of GDI-Studio", fr: "Dans graphicdesigninstitute.com : le groupe des comptes d'utilisateur des illustrateurs, qui devient membre de GDI-Studio" }
    - id: lp
      text: { en: "In lucernepublishing.com: the group that contains LP-ArtEditors and EU-ArtEditors", fr: "Dans lucernepublishing.com : le groupe qui contient LP-ArtEditors et EU-ArtEditors" }
    - id: res
      text: { en: "In eu.lucernepublishing.com: the group that receives Modify on Artwork and contains the two groups above", fr: "Dans eu.lucernepublishing.com : le groupe qui reçoit Modify sur Artwork et contient les deux groupes ci-dessus" }
answer:
  mapping: { gdi: global, lp: universal, res: dlocal }
explanation:
  correct:
    en: |
      GDI-Studio is a global group, and a global group can contain only accounts and other global groups of its own domain, so the illustrators group must be global. A group that contains global groups from two domains of the same forest must be universal; a global group cannot, and a domain local group of lucernepublishing.com could not be nested in a group of eu.lucernepublishing.com. The resource group must be domain local: only a domain local group can contain groups from a trusted forest, and it grants permissions within its own domain, where FS2 is.
    fr: |
      GDI-Studio est un groupe global, et un groupe global ne peut contenir que des comptes et d'autres groupes globaux de son propre domaine : le groupe des illustrateurs doit donc être global. Un groupe qui contient des groupes globaux de deux domaines d'une même forêt doit être universel ; un groupe global ne le peut pas, et un groupe local de domaine de lucernepublishing.com ne pourrait pas être imbriqué dans un groupe de eu.lucernepublishing.com. Le groupe de ressources doit être local de domaine : seul un groupe local de domaine peut contenir des groupes d'une forêt approuvée, et il accorde des autorisations au sein de son propre domaine, où se trouve FS2.
  options:
    udist: { en: "A distribution group is not security-enabled, so it cannot be used to grant permissions.", fr: "Un groupe de distribution n'est pas un groupe de sécurité : il ne peut pas servir à accorder des autorisations." }
    universal: { en: "A universal group cannot be a member of the global group GDI-Studio, and it cannot contain groups from another forest.", fr: "Un groupe universel ne peut pas être membre du groupe global GDI-Studio, et il ne peut pas contenir de groupes d'une autre forêt." }
references:
  - title: Active Directory Security Groups
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-groups
