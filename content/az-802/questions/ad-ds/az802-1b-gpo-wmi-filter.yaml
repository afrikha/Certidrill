id: az802-1b-gpo-wmi-filter
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The **Servers** OU of the **corp.contoso.com** domain contains servers that run Windows Server 2022 and servers that run Windows Server 2025. The **WS2025-Hardening** GPO contains Administrative Templates settings and is linked to the Servers OU.

    You need WS2025-Hardening to apply only to the servers that run Windows Server 2025. Servers upgraded later to Windows Server 2025 must receive the GPO without any change to groups or OUs. You must not create new OUs or groups.

    What should you do?
  fr: |
    L'UO **Servers** du domaine **corp.contoso.com** contient des serveurs qui exécutent Windows Server 2022 et des serveurs qui exécutent Windows Server 2025. Le GPO **WS2025-Hardening** contient des paramètres de Modèles d'administration et est lié à l'UO Servers.

    WS2025-Hardening ne doit s'appliquer qu'aux serveurs qui exécutent Windows Server 2025. Les serveurs mis à niveau plus tard vers Windows Server 2025 doivent recevoir le GPO sans aucune modification des groupes ou des UO. Vous ne devez pas créer de nouvelles UO ni de nouveaux groupes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Link a WMI filter that queries the Win32_OperatingSystem class to WS2025-Hardening.", fr: "Lier à WS2025-Hardening un filtre WMI qui interroge la classe Win32_OperatingSystem." } }
    - { id: b, text: { en: "Configure item-level targeting on the WS2025-Hardening GPO.", fr: "Configurer un ciblage au niveau de l'élément sur le GPO WS2025-Hardening." } }
    - { id: c, text: { en: "Replace Authenticated Users with Domain Computers in the security filtering of WS2025-Hardening.", fr: "Remplacer Authenticated Users par Domain Computers dans le filtrage de sécurité de WS2025-Hardening." } }
    - { id: d, text: { en: "Set the link of WS2025-Hardening to Enforced.", fr: "Définir le lien de WS2025-Hardening sur Appliqué." } }
answer: { optionId: a }
explanation:
  correct:
    en: A WMI filter is evaluated on the target computer during Group Policy processing, and the GPO applies only if the query returns true. A query on Win32_OperatingSystem (for example on its Version or BuildNumber) follows the operating system of each server automatically. Each GPO can be linked to one WMI filter.
    fr: Un filtre WMI est évalué sur l'ordinateur cible pendant le traitement de la stratégie de groupe, et le GPO ne s'applique que si la requête renvoie vrai. Une requête sur Win32_OperatingSystem (par exemple sur Version ou BuildNumber) suit automatiquement le système d'exploitation de chaque serveur. Chaque GPO peut être lié à un seul filtre WMI.
  options:
    b: { en: "Item-level targeting filters individual preference items; it can't filter Administrative Templates policy settings or a whole GPO.", fr: "Le ciblage au niveau de l'élément filtre des éléments de préférence individuels ; il ne peut pas filtrer des paramètres de stratégie de Modèles d'administration ni un GPO entier." }
    c: { en: "Domain Computers contains all the servers, whatever their operating system.", fr: "Domain Computers contient tous les serveurs, quel que soit leur système d'exploitation." }
    d: { en: "Enforced changes precedence and bypasses Block Inheritance; it doesn't filter by operating system.", fr: "Appliqué modifie la priorité et passe outre le blocage de l'héritage ; il ne filtre pas selon le système d'exploitation." }
references:
  - title: Group Policy processing for Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-processing
  - title: Group Policy preferences in Windows
