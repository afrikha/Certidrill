id: az802-1b-xdom-fsp-yesno
objective: "1.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A forest trust exists in which the **corp.contoso.com** forest trusts the **fabrikam.com** forest. You add the user account `FABRIKAM\ana` of fabrikam.com to the domain local group **DL-Share** of corp.contoso.com.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Il existe une approbation de forêt dans laquelle la forêt **corp.contoso.com** approuve la forêt **fabrikam.com**. Vous ajoutez le compte d'utilisateur `FABRIKAM\ana` de fabrikam.com au groupe local de domaine **DL-Share** de corp.contoso.com.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An object that represents ana is created in the ForeignSecurityPrincipals container of corp.contoso.com.
        fr: Un objet qui représente ana est créé dans le conteneur ForeignSecurityPrincipals de corp.contoso.com.
    - id: s2
      text:
        en: The common name of the object that represents ana in corp.contoso.com is the SID of her fabrikam.com account.
        fr: Le nom commun de l'objet qui représente ana dans corp.contoso.com est le SID de son compte fabrikam.com.
    - id: s3
      text:
        en: If the account of ana is deleted in fabrikam.com, the object that represents her in corp.contoso.com is removed automatically.
        fr: Si le compte de ana est supprimé dans fabrikam.com, l'objet qui la représente dans corp.contoso.com est supprimé automatiquement.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: A member from another forest is represented in the local domain by a foreign security principal (FSP), an object of the ForeignSecurityPrincipals container whose CN is the SID of the remote account; the group's member attribute points to it. When the source account is deleted, the FSP isn't updated or removed, so you must clean up these references manually.
    fr: Un membre provenant d'une autre forêt est représenté dans le domaine local par un principal de sécurité étranger (FSP), un objet du conteneur ForeignSecurityPrincipals dont le CN est le SID du compte distant ; l'attribut member du groupe pointe vers lui. Lorsque le compte source est supprimé, le FSP n'est ni mis à jour ni supprimé, et vous devez nettoyer ces références manuellement.
references:
  - title: Fail to run Get-ADGroupMember for domain local group
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/get-adgroupmember-error-remote-forest-members
