id: az802-1b-svc-smsa-order
objective: "1.3.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    The backup service **BackupSvc** runs only on **SRV5**, a member server of **corp.contoso.com**. You decide to use a standalone managed service account (sMSA) named **msa-backup** for the service.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Le service de sauvegarde **BackupSvc** s'exécute uniquement sur **SRV5**, un serveur membre de **corp.contoso.com**. Vous décidez d'utiliser pour ce service un compte de service administré autonome (sMSA) nommé **msa-backup**.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: new, text: "New-ADServiceAccount -Name msa-backup -RestrictToSingleComputer" }
    - { id: link, text: "Add-ADComputerServiceAccount -Identity SRV5 -ServiceAccount msa-backup" }
    - { id: install, text: { en: "On SRV5, run Install-ADServiceAccount -Identity msa-backup.", fr: "Sur SRV5, exécuter Install-ADServiceAccount -Identity msa-backup." } }
    - { id: svc, text: { en: "On SRV5, configure BackupSvc to log on as the managed service account.", fr: "Sur SRV5, configurer BackupSvc pour qu'il ouvre une session sous le compte de service administré." } }
    - { id: gmsa, text: "New-ADServiceAccount -Name msa-backup -DNSHostName msa-backup.corp.contoso.com" }
    - { id: reset, text: { en: "On DC1, run Reset-ADServiceAccountPassword -Identity msa-backup.", fr: "Sur DC1, exécuter Reset-ADServiceAccountPassword -Identity msa-backup." } }
answer:
  sequence: [ new, link, install, svc ]
explanation:
  correct:
    en: "-RestrictToSingleComputer creates a standalone MSA. You then link it to the computer account of SRV5 with Add-ADComputerServiceAccount, install it locally on SRV5 with Install-ADServiceAccount (adding the account to a computer is a different operation from installing it locally), and finally configure the service to use it."
    fr: "-RestrictToSingleComputer crée un MSA autonome. Vous le liez ensuite au compte d'ordinateur de SRV5 avec Add-ADComputerServiceAccount, vous l'installez localement sur SRV5 avec Install-ADServiceAccount (ajouter le compte à un ordinateur est une opération distincte de son installation locale), puis vous configurez le service pour qu'il l'utilise."
  options:
    gmsa: { en: "With -DNSHostName and without -RestrictToSingleComputer, New-ADServiceAccount creates a group managed service account.", fr: "Avec -DNSHostName et sans -RestrictToSingleComputer, New-ADServiceAccount crée un compte de service administré de groupe." }
    reset: { en: "Windows resets sMSA passwords automatically, and Reset-ADServiceAccountPassword runs on the computer where the sMSA is installed, not on a DC.", fr: "Windows réinitialise automatiquement les mots de passe des sMSA, et Reset-ADServiceAccountPassword s'exécute sur l'ordinateur où le sMSA est installé, pas sur un DC." }
references:
  - title: Add-ADComputerServiceAccount (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/add-adcomputerserviceaccount
  - title: Install-ADServiceAccount (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/install-adserviceaccount
