id: az802-1a-fsmo-find-pdc
objective: "1.1.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are signed in to a member server of the **corp.contoso.com** domain that has the Remote Server Administration Tools for AD DS installed.

    You need to identify the domain controller that holds the PDC emulator role of corp.contoso.com.

    Which two commands can you run? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes connecté à un serveur membre du domaine **corp.contoso.com** sur lequel les outils d'administration de serveur distant pour AD DS sont installés.

    Vous devez identifier le contrôleur de domaine qui détient le rôle d'émulateur PDC de corp.contoso.com.

    Quelles sont les deux commandes que vous pouvez exécuter ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "netdom query fsmo" }
    - { id: b, text: "Get-ADForest | Select-Object SchemaMaster, DomainNamingMaster" }
    - { id: c, text: "Get-ADDomain | Select-Object PDCEmulator" }
    - { id: d, text: "repadmin /replsummary" }
    - { id: e, text: "w32tm /query /configuration" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: netdom query fsmo lists the holders of the five operation master roles. The PDC emulator, RID master and infrastructure master are domain-wide roles, so Get-ADDomain exposes them in its PDCEmulator, RIDMaster and InfrastructureMaster properties.
    fr: "netdom query fsmo liste les détenteurs des cinq rôles de maître d'opérations. L'émulateur PDC, le maître RID et le maître d'infrastructure sont des rôles à l'échelle du domaine : Get-ADDomain les expose dans ses propriétés PDCEmulator, RIDMaster et InfrastructureMaster."
  options:
    b: { en: "Get-ADForest exposes only the forest-wide roles: schema master and domain naming master.", fr: "Get-ADForest n'expose que les rôles à l'échelle de la forêt : maître de schéma et maître d'attribution de noms de domaine." }
    d: { en: "repadmin /replsummary summarizes replication failures; it does not list role holders.", fr: "repadmin /replsummary résume les échecs de réplication ; il ne liste pas les détenteurs de rôles." }
    e: { en: "This command shows the local Windows Time configuration, not the role owner.", fr: "Cette commande affiche la configuration locale du service de temps Windows, pas le détenteur du rôle." }
references:
  - title: Manage Active Directory Domain Services operations masters
    url: https://learn.microsoft.com/en-us/training/modules/deploy-manage-active-directory-domain-services-domain-controllers/6-operations-masters
