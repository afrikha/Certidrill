id: az802-1a-fsmo-consoles-dragdrop
objective: "1.1.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    The operation master role holders of the **corp.adatum.com** forest are all online. Before maintenance, you need to transfer roles to other domain controllers by using graphical consoles only.

    Which console should you use to transfer each role? To answer, drag the appropriate consoles to the correct roles. Each console may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les détenteurs des rôles de maître d'opérations de la forêt **corp.adatum.com** sont tous en ligne. Avant une maintenance, vous devez transférer des rôles vers d'autres contrôleurs de domaine en utilisant uniquement des consoles graphiques.

    Quelle console devez-vous utiliser pour transférer chaque rôle ? Pour répondre, faites glisser les consoles appropriées vers les rôles correspondants. Chaque console peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: schema, text: { en: "Active Directory Schema", fr: "Schéma Active Directory" } }
    - { id: adt, text: { en: "Active Directory Domains and Trusts", fr: "Domaines et approbations Active Directory" } }
    - { id: aduc, text: { en: "Active Directory Users and Computers", fr: "Utilisateurs et ordinateurs Active Directory" } }
    - { id: ss, text: { en: "Active Directory Sites and Services", fr: "Sites et services Active Directory" } }
    - { id: gpmc, text: { en: "Group Policy Management", fr: "Gestion des stratégies de groupe" } }
  targets:
    - { id: t1, text: { en: "Schema master", fr: "Maître de schéma" } }
    - { id: t2, text: { en: "Domain naming master", fr: "Maître d'attribution de noms de domaine" } }
    - { id: t3, text: { en: "RID master", fr: "Maître RID" } }
    - { id: t4, text: { en: "PDC emulator", fr: "Émulateur PDC" } }
answer:
  mapping: { t1: schema, t2: adt, t3: aduc, t4: aduc }
explanation:
  correct:
    en: The schema master is transferred from the Active Directory Schema snap-in and the domain naming master from Active Directory Domains and Trusts. The three domain-wide roles (RID master, PDC emulator and infrastructure master) are transferred from the Operations Masters dialog of Active Directory Users and Computers.
    fr: Le maître de schéma se transfère depuis le composant logiciel enfichable Schéma Active Directory et le maître d'attribution de noms de domaine depuis Domaines et approbations Active Directory. Les trois rôles à l'échelle du domaine (maître RID, émulateur PDC et maître d'infrastructure) se transfèrent depuis la boîte de dialogue Maîtres d'opérations de Utilisateurs et ordinateurs Active Directory.
  options:
    ss: { en: "Sites and Services manages sites, subnets, site links and replication connections, not operation master roles.", fr: "Sites et services gère les sites, sous-réseaux, liens de sites et connexions de réplication, pas les rôles de maître d'opérations." }
    gpmc: { en: "Group Policy Management edits GPOs; it cannot transfer roles.", fr: "Gestion des stratégies de groupe modifie des objets de stratégie de groupe ; elle ne peut pas transférer de rôles." }
references:
  - title: Manage Active Directory Domain Services operations masters
    url: https://learn.microsoft.com/en-us/training/modules/deploy-manage-active-directory-domain-services-domain-controllers/6-operations-masters
