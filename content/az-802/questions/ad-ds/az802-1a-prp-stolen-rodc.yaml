id: az802-1a-prp-stolen-rodc
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A read-only domain controller named **RODC-NIC** of the **corp.tailspin.com** domain was stolen from the Nice branch office. Its password replication policy allowed the passwords of the Nice users and computers to be cached.

    You need to prevent the attacker from using the credentials that were cached on RODC-NIC. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Un contrôleur de domaine en lecture seule nommé **RODC-NIC** du domaine **corp.tailspin.com** a été volé dans la succursale de Nice. Sa stratégie de réplication de mot de passe autorisait la mise en cache des mots de passe des utilisateurs et ordinateurs de Nice.

    Vous devez empêcher l'attaquant d'utiliser les informations d'identification mises en cache sur RODC-NIC. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Disable the RODC-NIC computer account in Active Directory Users and Computers.", fr: "Désactiver le compte d'ordinateur RODC-NIC dans Utilisateurs et ordinateurs Active Directory." } }
    - { id: b, text: { en: "Remove the Nice users and computers from the Allowed list of RODC-NIC.", fr: "Supprimer les utilisateurs et ordinateurs de Nice de la liste Autorisés de RODC-NIC." } }
    - { id: c, text: { en: "Delete the RODC-NIC computer account and select the options to reset the passwords of the accounts that were cached on it.", fr: "Supprimer le compte d'ordinateur RODC-NIC et sélectionner les options de réinitialisation des mots de passe des comptes qui y étaient mis en cache." } }
    - { id: d, text: { en: "Delete the NTDS Settings object of RODC-NIC in Active Directory Sites and Services.", fr: "Supprimer l'objet NTDS Settings de RODC-NIC dans Sites et services Active Directory." } }
answer: { optionId: c }
explanation:
  correct:
    en: When you delete the account of a lost or stolen RODC, Active Directory Users and Computers lets you reset the passwords of the user and computer accounts that were cached on that RODC. The cached hashes then become useless, and the RODC is removed from the domain in the same operation.
    fr: Lorsque vous supprimez le compte d'un RODC perdu ou volé, Utilisateurs et ordinateurs Active Directory permet de réinitialiser les mots de passe des comptes d'utilisateur et d'ordinateur qui étaient mis en cache sur ce RODC. Les hachages mis en cache deviennent alors inutilisables, et le RODC est supprimé du domaine dans la même opération.
  options:
    a: { en: "Disabling the account does not change the passwords already stored on the stolen server.", fr: "Désactiver le compte ne change pas les mots de passe déjà stockés sur le serveur volé." }
    b: { en: "Changing the policy affects future caching only; the passwords already cached remain on the stolen disk.", fr: "Modifier la stratégie n'affecte que les mises en cache futures ; les mots de passe déjà mis en cache restent sur le disque volé." }
    d: { en: "Removing the NTDS Settings object does not reset any password and skips the password reset options.", fr: "Supprimer l'objet NTDS Settings ne réinitialise aucun mot de passe et contourne les options de réinitialisation." }
references:
  - title: Deploy Active Directory Domain Services domain controllers
    url: https://learn.microsoft.com/en-us/training/modules/deploy-manage-active-directory-domain-services-domain-controllers/4-deploy-active-directory-domain-services-controllers
