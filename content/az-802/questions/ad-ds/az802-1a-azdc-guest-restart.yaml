id: az802-1a-azdc-guest-restart
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named **VM-DC1** that is a domain controller of the **corp.contoso.com** domain. You must restart VM-DC1 after installing updates.

    You need to restart VM-DC1 while avoiding a reset of its VM-Generation ID, the discard of its RID pool and a nonauthoritative resynchronization of SYSVOL.

    What should you do?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **VM-DC1** qui est contrôleur de domaine du domaine **corp.contoso.com**. Vous devez redémarrer VM-DC1 après l'installation de mises à jour.

    Vous devez redémarrer VM-DC1 en évitant une réinitialisation de son identifiant VM-Generation ID, l'abandon de son pool RID et une resynchronisation ne faisant pas autorité de SYSVOL.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Stop VM-DC1 from the Azure portal, and then start it again.", fr: "Arrêter VM-DC1 depuis le portail Azure, puis le redémarrer." } }
    - { id: b, text: { en: "Redeploy VM-DC1 from the Azure portal.", fr: "Redéployer VM-DC1 depuis le portail Azure." } }
    - { id: c, text: { en: "Run Stop-AzVM for VM-DC1, and then run Start-AzVM.", fr: "Exécuter Stop-AzVM pour VM-DC1, puis Start-AzVM." } }
    - { id: d, text: { en: "Restart Windows from within the guest operating system of VM-DC1.", fr: "Redémarrer Windows depuis le système d'exploitation invité de VM-DC1." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Microsoft recommends shutting down and restarting a domain controller from its guest operating system. A stop from the Azure platform deallocates the virtual machine, which resets the VM-Generation ID: the domain controller then resets its invocationID, discards its RID pool and marks SYSVOL as nonauthoritative."
    fr: Microsoft recommande d'arrêter et de redémarrer un contrôleur de domaine depuis son système d'exploitation invité. Un arrêt depuis la plateforme Azure libère la machine virtuelle, ce qui réinitialise l'identifiant VM-Generation ID ; le contrôleur de domaine réinitialise alors son invocationID, abandonne son pool RID et marque SYSVOL comme ne faisant pas autorité.
  options:
    a: { en: "Stopping from the portal deallocates the virtual machine and triggers the VM-Generation ID safeguards.", fr: "L'arrêt depuis le portail libère la machine virtuelle et déclenche les protections liées au VM-Generation ID." }
    b: { en: "Redeploying moves the virtual machine to a new host, which also deallocates it.", fr: "Le redéploiement déplace la machine virtuelle vers un nouvel hôte, ce qui la libère également." }
    c: { en: "Stop-AzVM deallocates the virtual machine by default, with the same effect as a stop from the portal.", fr: "Stop-AzVM libère la machine virtuelle par défaut, avec le même effet qu'un arrêt depuis le portail." }
references:
  - title: Deploy AD DS in an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/identity/adds-extend-domain
