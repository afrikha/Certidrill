id: az802-1a-dc-new-forest-cmdlet
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. is building a new Active Directory environment. You have a server named **Server1** that runs Windows Server 2025 and is a member of a workgroup. You signed in to Server1 as the local Administrator and installed the **AD-Domain-Services** role with its management tools.

    You need to make Server1 the first domain controller of a new forest named **corp.contoso.com**.

    Which cmdlet should you run?
  fr: |
    Contoso, Ltd. crée un nouvel environnement Active Directory. Vous disposez d'un serveur nommé **Server1** qui exécute Windows Server 2025 et appartient à un groupe de travail. Vous vous êtes connecté à Server1 en tant qu'Administrateur local et avez installé le rôle **AD-Domain-Services** avec ses outils de gestion.

    Vous devez faire de Server1 le premier contrôleur de domaine d'une nouvelle forêt nommée **corp.contoso.com**.

    Quelle applet de commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: Install-ADDSDomain }
    - { id: b, text: Install-ADDSDomainController }
    - { id: c, text: Install-ADDSForest }
    - { id: d, text: Add-ADDSReadOnlyDomainControllerAccount }
answer: { optionId: c }
explanation:
  correct:
    en: "`Install-ADDSForest` creates a new forest and its forest root domain, and installs the DNS Server role by default. Creating a new forest only requires the local Administrator account of the server, which matches the scenario."
    fr: "`Install-ADDSForest` crée une nouvelle forêt et son domaine racine, et installe le rôle Serveur DNS par défaut. La création d'une nouvelle forêt nécessite seulement le compte Administrateur local du serveur, ce qui correspond au scénario."
  options:
    a: { en: "Install-ADDSDomain adds a new child or tree domain to an existing forest.", fr: "Install-ADDSDomain ajoute un nouveau domaine enfant ou une nouvelle arborescence à une forêt existante." }
    b: { en: "Install-ADDSDomainController adds a replica domain controller to an existing domain.", fr: "Install-ADDSDomainController ajoute un contrôleur de domaine réplica à un domaine existant." }
    d: { en: "Add-ADDSReadOnlyDomainControllerAccount pre-creates an RODC account in an existing domain (staged installation).", fr: "Add-ADDSReadOnlyDomainControllerAccount crée à l'avance un compte de RODC dans un domaine existant (installation intermédiaire)." }
references:
  - title: Install Active Directory Domain Services on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/install-active-directory-domain-services--level-100-
