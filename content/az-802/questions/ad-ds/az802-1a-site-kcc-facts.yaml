id: az802-1a-site-kcc-facts
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    The **corp.adatum.com** domain has a large site named **Main** with eight writable domain controllers, and four branch sites connected to Main by site links. An administrator edited the schedule of one connection object that the KCC had generated in Main.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le domaine **corp.adatum.com** possède un grand site nommé **Main** avec huit contrôleurs de domaine accessibles en écriture, et quatre sites de succursale reliés à Main par des liens de sites. Un administrateur a modifié la planification d'un objet connexion que le KCC avait généré dans Main.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Within the Main site, the KCC arranges the writable domain controllers in a bidirectional ring, with additional shortcut connections to reduce latency.
        fr: Dans le site Main, le KCC organise les contrôleurs de domaine accessibles en écriture en anneau bidirectionnel, avec des connexions raccourcies supplémentaires pour réduire la latence.
    - id: s2
      text:
        en: The KCC continues to update the connection object whose schedule the administrator edited.
        fr: Le KCC continue de mettre à jour l'objet connexion dont l'administrateur a modifié la planification.
    - id: s3
      text:
        en: To improve replication efficiency, you should create a redundant site link for each physical WAN path between Main and each branch.
        fr: Pour améliorer l'efficacité de la réplication, vous devez créer un lien de sites redondant pour chaque chemin WAN physique entre Main et chaque succursale.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Inside a site, the KCC builds a bidirectional ring of writable domain controllers plus shortcut connections in large sites. A connection object that an administrator modifies is no longer managed by the KCC. Site links do not map to the physical path of packets, so redundant site links are not needed for replication efficiency.
    fr: "Dans un site, le KCC construit un anneau bidirectionnel de contrôleurs de domaine accessibles en écriture, plus des connexions raccourcies dans les grands sites. Un objet connexion modifié par un administrateur n'est plus géré par le KCC. Les liens de sites ne correspondent pas au chemin physique des paquets : des liens de sites redondants ne sont pas nécessaires à l'efficacité de la réplication."
references:
  - title: Active Directory Replication Concepts
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/replication/active-directory-replication-concepts
