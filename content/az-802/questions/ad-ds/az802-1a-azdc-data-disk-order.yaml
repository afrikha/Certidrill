id: az802-1a-azdc-data-disk-order
objective: "1.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named **VM-DC3** that runs Windows Server 2025. VM-DC3 is a member server of the **corp.adatum.com** domain, has a static private IP address and has the AD-Domain-Services role installed. VM-DC3 currently has only an OS disk and a temporary disk.

    You need to promote VM-DC3 to an additional domain controller by following Microsoft's storage recommendations for domain controllers in Azure.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **VM-DC3** qui exécute Windows Server 2025. VM-DC3 est un serveur membre du domaine **corp.adatum.com**, possède une adresse IP privée statique et le rôle AD-Domain-Services est installé. VM-DC3 n'a actuellement qu'un disque de système d'exploitation et un disque temporaire.

    Vous devez promouvoir VM-DC3 en contrôleur de domaine supplémentaire en suivant les recommandations de Microsoft en matière de stockage pour les contrôleurs de domaine dans Azure.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: attach, text: { en: "Attach a new managed data disk to VM-DC3 with host caching set to None.", fr: "Attacher un nouveau disque de données managé à VM-DC3 avec la mise en cache de l'hôte définie sur Aucun (None)." } }
    - { id: ntfs, text: { en: "In VM-DC3, initialize the new disk and format it as volume F: with NTFS.", fr: "Dans VM-DC3, initialiser le nouveau disque et le formater en volume F: avec NTFS." } }
    - { id: promote, text: { en: "Run Install-ADDSDomainController with -DatabasePath, -LogPath and -SysvolPath on F:.", fr: "Exécuter Install-ADDSDomainController avec -DatabasePath, -LogPath et -SysvolPath sur F:." } }
    - { id: rw, text: { en: "Attach a new managed data disk to VM-DC3 with host caching set to ReadWrite.", fr: "Attacher un nouveau disque de données managé à VM-DC3 avec la mise en cache de l'hôte définie sur ReadWrite." } }
    - { id: refs, text: { en: "In VM-DC3, initialize the new disk and format it as volume F: with ReFS.", fr: "Dans VM-DC3, initialiser le nouveau disque et le formater en volume F: avec ReFS." } }
    - { id: temp, text: { en: "Run Install-ADDSDomainController with -DatabasePath, -LogPath and -SysvolPath on the temporary disk.", fr: "Exécuter Install-ADDSDomainController avec -DatabasePath, -LogPath et -SysvolPath sur le disque temporaire." } }
answer:
  sequence: [ attach, ntfs, promote ]
explanation:
  correct:
    en: Microsoft recommends a separate persistent data disk for NTDS.dit, the logs and SYSVOL, with host caching set to None because the ESE engine manages its own write ordering. The volume must exist before the promotion, and the AD DS database must not be stored on ReFS.
    fr: Microsoft recommande un disque de données persistant distinct pour NTDS.dit, les journaux et SYSVOL, avec la mise en cache de l'hôte définie sur Aucun (None), car le moteur ESE gère lui-même l'ordre de ses écritures. Le volume doit exister avant la promotion, et la base de données AD DS ne doit pas être stockée sur ReFS.
  options:
    rw: { en: "Read/write host caching can interfere with the write ordering that the AD DS database relies on.", fr: "La mise en cache de l'hôte en lecture/écriture peut perturber l'ordre d'écriture sur lequel repose la base de données AD DS." }
    refs: { en: "Microsoft states that the AD DS database, logs and SYSVOL must not be placed on a ReFS volume.", fr: "Microsoft indique que la base de données AD DS, les journaux et SYSVOL ne doivent pas être placés sur un volume ReFS." }
    temp: { en: "The temporary disk is not persistent: its content can be lost when the virtual machine is moved or deallocated.", fr: "Le disque temporaire n'est pas persistant : son contenu peut être perdu lorsque la machine virtuelle est déplacée ou libérée." }
references:
  - title: Deploy AD DS in an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/identity/adds-extend-domain
  - title: Install Active Directory Domain Services on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/install-active-directory-domain-services--level-100-
