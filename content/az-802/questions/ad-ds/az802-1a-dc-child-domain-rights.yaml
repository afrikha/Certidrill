id: az802-1a-dc-child-domain-rights
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The **contoso.com** forest contains a single domain. You plan to run `Install-ADDSDomain` on a server named Server5 to create a child domain named **eu.contoso.com**.

    You need to identify the group whose membership is required for the account that creates the child domain. The solution must follow the principle of least privilege.

    Which group should you identify?
  fr: |
    La forêt **contoso.com** contient un seul domaine. Vous prévoyez d'exécuter `Install-ADDSDomain` sur un serveur nommé Server5 pour créer un domaine enfant nommé **eu.contoso.com**.

    Vous devez identifier le groupe dont l'appartenance est exigée pour le compte qui crée le domaine enfant. La solution doit respecter le principe du moindre privilège.

    Quel groupe devez-vous identifier ?
body:
  options:
    - { id: a, text: Domain Admins }
    - { id: b, text: Enterprise Admins }
    - { id: c, text: Schema Admins }
    - { id: d, text: { en: "The local Administrators group of Server5", fr: "Le groupe Administrateurs local de Server5" } }
answer: { optionId: b }
explanation:
  correct:
    en: Creating a new child or tree domain in an existing forest requires membership in Enterprise Admins, because the operation adds a domain to the forest-wide configuration. Domain Admins is enough only to add a domain controller to an existing domain.
    fr: La création d'un nouveau domaine enfant ou d'une nouvelle arborescence dans une forêt existante exige l'appartenance au groupe Enterprise Admins, car l'opération ajoute un domaine à la configuration de toute la forêt. Domain Admins suffit seulement pour ajouter un contrôleur de domaine à un domaine existant.
  options:
    a: { en: "Domain Admins can add a domain controller to an existing domain, not create a new domain in the forest.", fr: "Domain Admins permet d'ajouter un contrôleur de domaine à un domaine existant, pas de créer un nouveau domaine dans la forêt." }
    c: { en: "Schema Admins controls schema changes; it does not grant the right to add a domain to the forest.", fr: "Schema Admins contrôle les modifications du schéma ; il n'accorde pas le droit d'ajouter un domaine à la forêt." }
    d: { en: "Local administrator rights are enough only to create a new forest, not a domain in an existing forest.", fr: "Les droits d'administrateur local suffisent uniquement pour créer une nouvelle forêt, pas un domaine dans une forêt existante." }
references:
  - title: Install Active Directory Domain Services on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/install-active-directory-domain-services--level-100-
