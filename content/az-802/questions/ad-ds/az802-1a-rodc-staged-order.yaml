id: az802-1a-rodc-staged-order
objective: "1.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso is opening a branch office in Lyon, which is not yet represented in AD DS. A workgroup server named **RODC-LYS** that runs Windows Server 2025 and has the AD-Domain-Services role installed is shipped to the branch. The forest is already prepared for read-only domain controllers.

    You need to deploy RODC-LYS as a staged read-only domain controller of **corp.contoso.com** in a new site named **Lyon**, and ensure that the branch users in the group **Lyon-Users** can sign in on the first day even if the WAN link fails. Lyon-Users must be in the Allowed list of RODC-LYS.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso ouvre une succursale à Lyon, qui n'est pas encore représentée dans AD DS. Un serveur de groupe de travail nommé **RODC-LYS**, qui exécute Windows Server 2025 et sur lequel le rôle AD-Domain-Services est installé, est expédié à la succursale. La forêt est déjà préparée pour les contrôleurs de domaine en lecture seule.

    Vous devez déployer RODC-LYS comme contrôleur de domaine en lecture seule de **corp.contoso.com** par une installation intermédiaire dans un nouveau site nommé **Lyon**, et vous assurer que les utilisateurs de la succursale membres du groupe **Lyon-Users** pourront se connecter dès le premier jour, même si la liaison WAN tombe. Lyon-Users doit figurer dans la liste Autorisés de RODC-LYS.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: site, text: { en: "Run New-ADReplicationSite -Name Lyon.", fr: "Exécuter New-ADReplicationSite -Name Lyon." } }
    - { id: stage, text: { en: "Run Add-ADDSReadOnlyDomainControllerAccount for RODC-LYS with -SiteName Lyon and -AllowPasswordReplicationAccountName Lyon-Users.", fr: "Exécuter Add-ADDSReadOnlyDomainControllerAccount pour RODC-LYS avec -SiteName Lyon et -AllowPasswordReplicationAccountName Lyon-Users." } }
    - { id: attach, text: { en: "On RODC-LYS, run Install-ADDSDomainController -UseExistingAccount.", fr: "Sur RODC-LYS, exécuter Install-ADDSDomainController -UseExistingAccount." } }
    - { id: prepop, text: { en: "Run repadmin /rodcpwdrepl for RODC-LYS for each member of Lyon-Users.", fr: "Exécuter repadmin /rodcpwdrepl pour RODC-LYS pour chaque membre de Lyon-Users." } }
    - { id: join, text: { en: "Join RODC-LYS to corp.contoso.com as a member server.", fr: "Joindre RODC-LYS à corp.contoso.com en tant que serveur membre." } }
    - { id: ro, text: { en: "On RODC-LYS, run Install-ADDSDomainController -ReadOnlyReplica -SiteName Lyon.", fr: "Sur RODC-LYS, exécuter Install-ADDSDomainController -ReadOnlyReplica -SiteName Lyon." } }
answer:
  sequence: [ site, stage, attach, prepop ]
explanation:
  correct:
    en: The site must exist before you stage the account, because the staging cmdlet references an existing site and does not create one. The server then attaches to the staged account. Only after RODC-LYS exists can you prepopulate the passwords of the allowed users with repadmin /rodcpwdrepl, so they can sign in without contacting a writable domain controller.
    fr: Le site doit exister avant la création à l'avance du compte, car l'applet de commande de création référence un site existant et n'en crée pas. Le serveur s'attache ensuite au compte créé à l'avance. Ce n'est qu'une fois RODC-LYS en place que vous pouvez préremplir les mots de passe des utilisateurs autorisés avec repadmin /rodcpwdrepl, afin qu'ils se connectent sans joindre de contrôleur de domaine accessible en écriture.
  options:
    join: { en: "A staged RODC is attached from a server that is not joined to the domain; joining it first is not required.", fr: "Un RODC créé à l'avance est attaché depuis un serveur qui n'est pas joint au domaine ; il n'est pas nécessaire de le joindre d'abord." }
    ro: { en: "-ReadOnlyReplica performs an unstaged installation and ignores the staged account.", fr: "-ReadOnlyReplica effectue une installation non intermédiaire et ignore le compte créé à l'avance." }
references:
  - title: Install a Windows Server 2012 Active Directory Read-Only Domain Controller (RODC) (Level 200)
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/rodc/install-a-windows-server-2012-active-directory-read-only-domain-controller--rodc---level-200-
  - title: Repadmin
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc770963(v=ws.11)
