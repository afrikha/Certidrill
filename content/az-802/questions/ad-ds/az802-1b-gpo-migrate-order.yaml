id: az802-1b-gpo-migrate-order
objective: "1.4.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    No trust exists between the **contoso.com** forest and the new **tailspintoys.com** forest. The **Kiosk-Baseline** GPO of contoso.com references contoso.com groups and the UNC path `\\FS1.contoso.com\Kiosk`. The share `\\FS9\Transfer` is reachable from both forests, and it already contains the migration table **kiosk.migtable**, which maps these references to tailspintoys.com values.

    You need the settings of Kiosk-Baseline to apply to the computers of the **Kiosks** OU of tailspintoys.com, with the references mapped by the migration table.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Aucune approbation n'existe entre la forêt **contoso.com** et la nouvelle forêt **tailspintoys.com**. Le GPO **Kiosk-Baseline** de contoso.com fait référence à des groupes de contoso.com et au chemin UNC `\\FS1.contoso.com\Kiosk`. Le partage `\\FS9\Transfer` est accessible depuis les deux forêts et contient déjà la table de migration **kiosk.migtable**, qui fait correspondre ces références à des valeurs de tailspintoys.com.

    Les paramètres de Kiosk-Baseline doivent s'appliquer aux ordinateurs de l'UO **Kiosks** de tailspintoys.com, avec les références converties par la table de migration.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: backup, text: { en: "In contoso.com, run Backup-GPO -Name \"Kiosk-Baseline\" -Path \"\\\\FS9\\Transfer\".", fr: "Dans contoso.com, exécuter Backup-GPO -Name \"Kiosk-Baseline\" -Path \"\\\\FS9\\Transfer\"." } }
    - { id: import, text: { en: "In tailspintoys.com, run Import-GPO -BackupGpoName \"Kiosk-Baseline\" -Path \"\\\\FS9\\Transfer\" -TargetName \"Kiosk-Baseline\" -CreateIfNeeded -MigrationTable \"\\\\FS9\\Transfer\\kiosk.migtable\".", fr: "Dans tailspintoys.com, exécuter Import-GPO -BackupGpoName \"Kiosk-Baseline\" -Path \"\\\\FS9\\Transfer\" -TargetName \"Kiosk-Baseline\" -CreateIfNeeded -MigrationTable \"\\\\FS9\\Transfer\\kiosk.migtable\"." } }
    - { id: link, text: { en: "In tailspintoys.com, run New-GPLink -Name \"Kiosk-Baseline\" -Target \"OU=Kiosks,DC=tailspintoys,DC=com\".", fr: "Dans tailspintoys.com, exécuter New-GPLink -Name \"Kiosk-Baseline\" -Target \"OU=Kiosks,DC=tailspintoys,DC=com\"." } }
    - { id: restore, text: { en: "In tailspintoys.com, run Restore-GPO -Name \"Kiosk-Baseline\" -Path \"\\\\FS9\\Transfer\".", fr: "Dans tailspintoys.com, exécuter Restore-GPO -Name \"Kiosk-Baseline\" -Path \"\\\\FS9\\Transfer\"." } }
    - { id: copy, text: { en: "Run Copy-GPO from contoso.com to tailspintoys.com with the migration table.", fr: "Exécuter Copy-GPO de contoso.com vers tailspintoys.com avec la table de migration." } }
    - { id: sysvol, text: { en: "Copy the GPO folder from the SYSVOL share of contoso.com to the SYSVOL share of tailspintoys.com.", fr: "Copier le dossier du GPO depuis le partage SYSVOL de contoso.com vers le partage SYSVOL de tailspintoys.com." } }
answer:
  sequence: [ backup, import, link ]
explanation:
  correct:
    en: "Importing settings from a backup is the method for untrusted environments, because it needs only the backup, not access to the production GPO. Import-GPO with -CreateIfNeeded creates the target GPO, and -MigrationTable replaces the source references. An import never creates or changes links, so you link the GPO to the Kiosks OU last."
    fr: "Importer des paramètres depuis une sauvegarde est la méthode adaptée aux environnements sans approbation, car elle ne demande que la sauvegarde, pas l'accès au GPO de production. Import-GPO avec -CreateIfNeeded crée le GPO cible, et -MigrationTable remplace les références source. Une importation ne crée ni ne modifie jamais de liens : vous liez le GPO à l'UO Kiosks en dernier."
  options:
    restore: { en: "A backup can be restored only to the domain it was backed up from.", fr: "Une sauvegarde ne peut être restaurée que dans le domaine d'où elle provient." }
    copy: { en: "A copy can target only a trusted domain; there is no trust between the forests.", fr: "Une copie ne peut viser qu'un domaine approuvé ; il n'existe aucune approbation entre les forêts." }
    sysvol: { en: "A GPO is stored both in AD DS and in SYSVOL, so it can't be copied by copying a folder.", fr: "Un GPO est stocké à la fois dans AD DS et dans SYSVOL : il ne peut pas être copié en copiant un dossier." }
references:
  - title: Back Up and Restore Group Policy in Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-backup-restore
  - title: Import-GPO (GroupPolicy)
    url: https://learn.microsoft.com/en-us/powershell/module/grouppolicy/import-gpo
