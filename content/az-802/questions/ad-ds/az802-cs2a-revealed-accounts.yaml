id: az802-cs2a-revealed-accounts
objective: "1.1.4"
type: single
caseStudy: az802-cs2a-coho-winery
difficulty: 1
status: draft
stem:
  en: |
    RODC-MED is stolen from the Medoc estate office. You need to meet the security requirement for RODC-MED.

    Which command should you run?
  fr: |
    RODC-MED est volé dans le bureau de la propriété de Medoc. Vous devez satisfaire l'exigence de sécurité concernant RODC-MED.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "Get-ADDomainControllerPasswordReplicationPolicy -Identity RODC-MED -Allowed" }
    - { id: b, text: "Get-ADDomainControllerPasswordReplicationPolicyUsage -Identity RODC-MED -AuthenticatedAccounts" }
    - { id: c, text: "Get-ADDomainControllerPasswordReplicationPolicyUsage -Identity RODC-MED -RevealedAccounts" }
    - { id: d, text: "Get-ADDomainControllerPasswordReplicationPolicy -Identity RODC-MED -Denied" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The `-RevealedAccounts` switch returns the accounts whose passwords are stored on the RODC. Those are exactly the accounts an attacker could use, so they are the passwords you must reset after the theft.
    fr: |
      Le commutateur `-RevealedAccounts` renvoie les comptes dont le mot de passe est stocké sur le RODC. Ce sont précisément les comptes qu'un attaquant pourrait utiliser : ce sont donc les mots de passe à réinitialiser après le vol.
  options:
    a:
      en: |
        The Allowed list shows which accounts may be cached, not which passwords were actually cached.
      fr: |
        La liste Autorisés indique quels comptes peuvent être mis en cache, pas quels mots de passe l'ont réellement été.
    b:
      en: '`-AuthenticatedAccounts` lists the accounts that the RODC authenticated, including accounts whose passwords it never stored.'
      fr: '`-AuthenticatedAccounts` liste les comptes authentifiés par le RODC, y compris des comptes dont il n''a jamais stocké le mot de passe.'
    d:
      en: |
        The Denied list shows the accounts that can never be cached; their passwords are not on the stolen RODC.
      fr: |
        La liste Refusés indique les comptes qui ne peuvent jamais être mis en cache ; leurs mots de passe ne se trouvent pas sur le RODC volé.
references:
  - title: Get-ADDomainControllerPasswordReplicationPolicyUsage (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-addomaincontrollerpasswordreplicationpolicyusage
  - title: Password Replication Policy
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc730883(v=ws.10)
