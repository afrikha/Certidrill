id: az802-1a-rodc-facts
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation is planning a new forest named **adatum.net** and will deploy read-only domain controllers (RODCs) in its branch offices. A branch technician named Tech1 will be the delegated administrator of the RODC in her office.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation planifie une nouvelle forêt nommée **adatum.net** et déploiera des contrôleurs de domaine en lecture seule (RODC) dans ses succursales. Une technicienne de succursale nommée Tech1 sera l'administratrice déléguée du RODC de son agence.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The first domain controller of the adatum.net forest can be installed as an RODC.
        fr: Le premier contrôleur de domaine de la forêt adatum.net peut être installé en tant que RODC.
    - id: s2
      text:
        en: Specifying Tech1 as the delegated administrator gives Tech1 local administrative rights on the RODC without adding her to Domain Admins.
        fr: Désigner Tech1 comme administratrice déléguée lui donne des droits d'administration locale sur le RODC sans l'ajouter à Domain Admins.
    - id: s3
      text:
        en: Writable domain controllers in the hub site use the branch RODCs as replication sources for changes made in the branches.
        fr: Les contrôleurs de domaine accessibles en écriture du site principal utilisent les RODC des succursales comme sources de réplication pour les modifications faites dans les succursales.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: The RODC option is not available for the first domain controller of a forest, because an RODC replicates from a writable domain controller. Administrator role separation gives the delegated user or group local administrative rights on the RODC only. RODCs replicate unidirectionally, so bridgehead servers never need to replicate from them.
    fr: "L'option RODC n'est pas disponible pour le premier contrôleur de domaine d'une forêt, car un RODC réplique depuis un contrôleur de domaine accessible en écriture. La séparation des rôles d'administrateur donne à l'utilisateur ou au groupe délégué des droits d'administration locale sur le RODC seulement. Les RODC répliquent de façon unidirectionnelle : les serveurs tête de pont n'ont jamais besoin de répliquer depuis eux."
references:
  - title: Deploy Active Directory Domain Services domain controllers
    url: https://learn.microsoft.com/en-us/training/modules/deploy-manage-active-directory-domain-services-domain-controllers/4-deploy-active-directory-domain-services-controllers
  - title: Active Directory Replication Concepts
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/replication/active-directory-replication-concepts
