id: az802-1a-fsmo-tools-facts
objective: "1.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You manage the operation master roles of the **litware.com** forest, which contains writable domain controllers and read-only domain controllers (RODCs).

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez les rôles de maître d'opérations de la forêt **litware.com**, qui contient des contrôleurs de domaine accessibles en écriture et des contrôleurs de domaine en lecture seule (RODC).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can seize the RID master role by using the Active Directory Users and Computers console.
        fr: Vous pouvez prendre de force le rôle de maître RID à l'aide de la console Utilisateurs et ordinateurs Active Directory.
    - id: s2
      text:
        en: When you run Move-ADDirectoryServerOperationMasterRole with -Force, the cmdlet first attempts a graceful transfer of the role.
        fr: Lorsque vous exécutez Move-ADDirectoryServerOperationMasterRole avec -Force, l'applet de commande tente d'abord un transfert normal du rôle.
    - id: s3
      text:
        en: You can use Move-ADDirectoryServerOperationMasterRole to move the infrastructure master role to an RODC.
        fr: Vous pouvez utiliser Move-ADDirectoryServerOperationMasterRole pour déplacer le rôle de maître d'infrastructure vers un RODC.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: The Active Directory snap-ins can transfer roles but not seize them; seizing requires ntdsutil or PowerShell. With -Force, Move-ADDirectoryServerOperationMasterRole still tries a transfer first and seizes only if the transfer is not possible. The cmdlet does not work with a read-only domain controller, which cannot hold operation master roles.
    fr: Les composants logiciels enfichables Active Directory peuvent transférer des rôles mais pas les prendre de force ; la prise de force exige ntdsutil ou PowerShell. Avec -Force, Move-ADDirectoryServerOperationMasterRole tente quand même d'abord un transfert et ne prend le rôle de force que si le transfert est impossible. L'applet de commande ne fonctionne pas avec un contrôleur de domaine en lecture seule, qui ne peut pas détenir de rôle de maître d'opérations.
references:
  - title: Move-ADDirectoryServerOperationMasterRole
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/move-addirectoryserveroperationmasterrole
  - title: Manage Active Directory Domain Services operations masters
    url: https://learn.microsoft.com/en-us/training/modules/deploy-manage-active-directory-domain-services-domain-controllers/6-operations-masters
