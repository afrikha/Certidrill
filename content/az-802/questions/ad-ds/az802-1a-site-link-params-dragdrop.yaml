id: az802-1a-site-link-params-dragdrop
objective: "1.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are creating a site link named **Paris-Madrid** with `New-ADReplicationSiteLink -Name "Paris-Madrid" -SitesIncluded Paris,Madrid`. The site link must meet the following requirements.

    Which parameter should you add for each requirement? To answer, drag the appropriate parameters to the correct requirements. Each parameter may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un lien de sites nommé **Paris-Madrid** avec `New-ADReplicationSiteLink -Name "Paris-Madrid" -SitesIncluded Paris,Madrid`. Le lien de sites doit répondre aux exigences suivantes.

    Quel paramètre devez-vous ajouter pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: freq, text: "-ReplicationFrequencyInMinutes 30" }
    - { id: sched, text: "-ReplicationSchedule $Schedule" }
    - { id: notify, text: "-OtherAttributes @{'options'=1}" }
    - { id: transport, text: "-InterSiteTransportProtocol IP" }
    - { id: cost, text: "-Cost 50" }
    - { id: sites, text: "-SitesIncluded Paris,Madrid,Lisbon" }
  targets:
    - { id: t1, text: { en: "Replicate every 30 minutes while the link is available", fr: "Répliquer toutes les 30 minutes lorsque le lien est disponible" } }
    - { id: t2, text: { en: "Allow replication only between 20:00 and 22:30 every day", fr: "N'autoriser la réplication qu'entre 20:00 et 22:30 chaque jour" } }
    - { id: t3, text: { en: "Notify the partner site of changes as soon as they occur", fr: "Notifier le site partenaire des modifications dès qu'elles se produisent" } }
    - { id: t4, text: { en: "Use the recommended intersite transport", fr: "Utiliser le transport intersite recommandé" } }
answer:
  mapping: { t1: freq, t2: sched, t3: notify, t4: transport }
explanation:
  correct:
    en: -ReplicationFrequencyInMinutes sets how often replication occurs (180 minutes by default). -ReplicationSchedule sets when the link is available (24 hours a day by default). Setting the options attribute to 1 through -OtherAttributes enables change notification on the site link. IP is the recommended transport, because SMTP replication will not be supported in future versions of AD DS.
    fr: -ReplicationFrequencyInMinutes fixe la fréquence de réplication (180 minutes par défaut). -ReplicationSchedule fixe les plages de disponibilité du lien (24 heures sur 24 par défaut). Définir l'attribut options sur 1 via -OtherAttributes active la notification des modifications sur le lien de sites. IP est le transport recommandé, car la réplication SMTP ne sera plus prise en charge dans les versions futures d'AD DS.
  options:
    cost: { en: "Cost determines path preference between sites, not frequency, schedule or notification.", fr: "Le coût détermine la préférence des chemins entre sites, pas la fréquence, la planification ni la notification." }
    sites: { en: "Adding Lisbon changes which sites the link connects; no requirement asks for it.", fr: "Ajouter Lisbon modifie les sites que relie le lien ; aucune exigence ne le demande." }
references:
  - title: New-ADReplicationSiteLink
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/new-adreplicationsitelink
  - title: Active Directory Replication Concepts
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/replication/active-directory-replication-concepts
