id: az802-1a-azdc-availability-set
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam plans to deploy two domain controllers as Azure virtual machines in a region that does not support availability zones.

    You need to ensure that a single hardware failure or planned maintenance event in the Azure datacenter does not make both domain controllers unavailable at the same time.

    What should you do?
  fr: |
    Fabrikam prévoit de déployer deux contrôleurs de domaine en tant que machines virtuelles Azure dans une région qui ne prend pas en charge les zones de disponibilité.

    Vous devez vous assurer qu'une seule panne matérielle ou un seul événement de maintenance planifiée dans le centre de données Azure ne rende pas les deux contrôleurs de domaine indisponibles en même temps.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Deploy both virtual machines in the same proximity placement group.", fr: "Déployer les deux machines virtuelles dans le même groupe de placement de proximité." } }
    - { id: b, text: { en: "Deploy both virtual machines behind an internal Standard SKU load balancer.", fr: "Déployer les deux machines virtuelles derrière un équilibreur de charge interne de référence SKU Standard." } }
    - { id: c, text: { en: "Deploy both virtual machines in the same availability set.", fr: "Déployer les deux machines virtuelles dans le même groupe à haute disponibilité." } }
    - { id: d, text: { en: "Deploy both virtual machines with ephemeral OS disks.", fr: "Déployer les deux machines virtuelles avec des disques de système d'exploitation éphémères." } }
answer: { optionId: c }
explanation:
  correct:
    en: Microsoft recommends placing at least two domain controllers in different availability zones and, when the region has no availability zones, in an availability set. An availability set spreads the virtual machines across fault domains and update domains.
    fr: Microsoft recommande de placer au moins deux contrôleurs de domaine dans des zones de disponibilité différentes et, si la région n'a pas de zones de disponibilité, dans un groupe à haute disponibilité. Un groupe à haute disponibilité répartit les machines virtuelles entre domaines d'erreur et domaines de mise à jour.
  options:
    a: { en: "A proximity placement group keeps virtual machines physically close to reduce latency; it does not separate them across failure domains.", fr: "Un groupe de placement de proximité rapproche physiquement les machines virtuelles pour réduire la latence ; il ne les répartit pas entre domaines de défaillance." }
    b: { en: "Domain controllers do not need a load balancer: clients locate them through DNS. A load balancer does not protect against hardware failure either.", fr: "Les contrôleurs de domaine n'ont pas besoin d'équilibreur de charge : les clients les localisent par DNS. Un équilibreur de charge ne protège pas non plus d'une panne matérielle." }
    d: { en: "Microsoft recommends persistent managed OS disks for domain controllers, never ephemeral OS disks.", fr: "Microsoft recommande des disques de système d'exploitation managés persistants pour les contrôleurs de domaine, jamais des disques éphémères." }
references:
  - title: Deploy AD DS in an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/identity/adds-extend-domain
