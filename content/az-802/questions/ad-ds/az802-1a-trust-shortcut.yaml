id: az802-1a-trust-shortcut
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The **tailspin.com** forest contains two domain trees. The first tree has the domains tailspin.com, emea.tailspin.com and **sales.emea.tailspin.com**. The second tree has the domains tailspintoys.com and **dev.tailspintoys.com**. All the trusts are the default trusts.

    Users in sales.emea.tailspin.com frequently access file servers in dev.tailspintoys.com. Authentication to these servers is slow because each request is referred through several domains.

    You need to reduce the authentication time for these users. The solution must not affect authentication between other domains.

    What should you create?
  fr: |
    La forêt **tailspin.com** contient deux arborescences de domaines. La première comprend les domaines tailspin.com, emea.tailspin.com et **sales.emea.tailspin.com**. La seconde comprend les domaines tailspintoys.com et **dev.tailspintoys.com**. Toutes les approbations sont les approbations par défaut.

    Les utilisateurs de sales.emea.tailspin.com accèdent fréquemment à des serveurs de fichiers de dev.tailspintoys.com. L'authentification auprès de ces serveurs est lente, car chaque demande est renvoyée à travers plusieurs domaines.

    Vous devez réduire le temps d'authentification de ces utilisateurs. La solution ne doit pas affecter l'authentification entre les autres domaines.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A shortcut trust between sales.emea.tailspin.com and dev.tailspintoys.com", fr: "Une approbation raccourcie entre sales.emea.tailspin.com et dev.tailspintoys.com" } }
    - { id: b, text: { en: "An external trust between sales.emea.tailspin.com and dev.tailspintoys.com", fr: "Une approbation externe entre sales.emea.tailspin.com et dev.tailspintoys.com" } }
    - { id: c, text: { en: "A forest trust between tailspin.com and tailspintoys.com", fr: "Une approbation de forêt entre tailspin.com et tailspintoys.com" } }
    - { id: d, text: { en: "A site link bridge between the sites of the two domains", fr: "Un pont de liens de sites entre les sites des deux domaines" } }
answer: { optionId: a }
explanation:
  correct:
    en: A shortcut trust is a transitive trust between two domains of the same forest. It shortens the authentication path, so Kerberos referrals no longer have to climb to the tree roots and down the other tree; it is the trust type designed for domains separated by two domain trees.
    fr: "Une approbation raccourcie est une approbation transitive entre deux domaines d'une même forêt. Elle raccourcit le chemin d'authentification : les recommandations Kerberos n'ont plus à remonter jusqu'aux racines des arborescences puis à redescendre l'autre arborescence. C'est le type d'approbation conçu pour des domaines séparés par deux arborescences."
  options:
    b: { en: "External trusts connect domains in different forests (or Windows NT 4.0 domains), not domains of the same forest.", fr: "Les approbations externes relient des domaines de forêts différentes (ou des domaines Windows NT 4.0), pas des domaines d'une même forêt." }
    c: { en: "tailspin.com and tailspintoys.com are tree roots of the same forest; forest trusts connect two different forests.", fr: "tailspin.com et tailspintoys.com sont des racines d'arborescence de la même forêt ; les approbations de forêt relient deux forêts différentes." }
    d: { en: "Site link bridges influence replication topology, not the Kerberos referral path.", fr: "Les ponts de liens de sites influencent la topologie de réplication, pas le chemin des recommandations Kerberos." }
references:
  - title: "Trust types: Active Directory"
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2003/cc775736(v=ws.10)
