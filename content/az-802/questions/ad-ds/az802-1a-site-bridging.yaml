id: az802-1a-site-bridging
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The **corp.litware.com** domain has three sites: **HUB**, **BR1** and **BR2**, each with domain controllers. Two site links exist: HUB-BR1 and HUB-BR2. All settings of the IP intersite transport are at their defaults.

    The firewall policy allows domain controllers in BR1 and BR2 to communicate only with domain controllers in HUB. Replication errors show that domain controllers in BR1 try to replicate directly with domain controllers in BR2.

    You need to ensure that the KCC creates only replication connections that the network allows.

    What should you do?
  fr: |
    Le domaine **corp.litware.com** possède trois sites : **HUB**, **BR1** et **BR2**, chacun avec des contrôleurs de domaine. Deux liens de sites existent : HUB-BR1 et HUB-BR2. Tous les paramètres du transport intersite IP sont à leurs valeurs par défaut.

    La stratégie du pare-feu n'autorise les contrôleurs de domaine de BR1 et BR2 à communiquer qu'avec les contrôleurs de domaine de HUB. Des erreurs de réplication montrent que des contrôleurs de domaine de BR1 tentent de répliquer directement avec des contrôleurs de domaine de BR2.

    Vous devez faire en sorte que le KCC ne crée que des connexions de réplication autorisées par le réseau.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Increase the cost of the HUB-BR2 site link.", fr: "Augmenter le coût du lien de sites HUB-BR2." } }
    - { id: b, text: { en: "Create a site link bridge that contains HUB-BR1 and HUB-BR2.", fr: "Créer un pont de liens de sites qui contient HUB-BR1 et HUB-BR2." } }
    - { id: c, text: { en: "Clear Bridge all site links on the IP intersite transport.", fr: "Désactiver l'option Bridge all site links du transport intersite IP." } }
    - { id: d, text: { en: "Create an SMTP site link between BR1 and BR2.", fr: "Créer un lien de sites SMTP entre BR1 et BR2." } }
answer: { optionId: c }
explanation:
  correct:
    en: By default, all site links are bridged (transitive), so the KCC may connect BR1 and BR2 directly through HUB-BR1 and HUB-BR2. Clearing Bridge all site links stops this automatic transitivity, which is the recommended approach when the network is not fully routed; replication then follows the defined site links through HUB.
    fr: "Par défaut, tous les liens de sites sont pontés (transitifs) : le KCC peut donc relier directement BR1 et BR2 via HUB-BR1 et HUB-BR2. Désactiver Bridge all site links met fin à cette transitivité automatique, ce qui est recommandé lorsque le réseau n'est pas entièrement routé ; la réplication suit alors les liens de sites définis, en passant par HUB."
  options:
    a: { en: "Cost changes path preference but keeps the links transitive, so direct BR1–BR2 connections remain possible.", fr: "Le coût modifie la préférence des chemins mais laisse les liens transitifs : des connexions directes BR1–BR2 restent possibles." }
    b: { en: "A bridge of HUB-BR1 and HUB-BR2 explicitly makes them transitive, which is exactly what causes the direct connections.", fr: "Un pont de HUB-BR1 et HUB-BR2 les rend explicitement transitifs, ce qui provoque justement les connexions directes." }
    d: { en: "A direct BR1–BR2 link is blocked by the firewall, and SMTP site links are not recommended because SMTP replication will not be supported in future versions.", fr: "Un lien direct BR1–BR2 est bloqué par le pare-feu, et les liens de sites SMTP ne sont pas recommandés, car la réplication SMTP ne sera plus prise en charge dans les versions futures." }
references:
  - title: Active Directory Replication Concepts
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/replication/active-directory-replication-concepts
