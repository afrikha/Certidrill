id: az802-1a-prp-authenticated-list
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A read-only domain controller named **RODC2** has been running in the Bordeaux branch for three months with the default password replication policy. Branch users complain that sign-ins are slow when the WAN link is congested.

    Before you change the Allowed list of RODC2, you need to identify the users and computers that have been authenticated by RODC2.

    Which command should you run?
  fr: |
    Un contrôleur de domaine en lecture seule nommé **RODC2** fonctionne depuis trois mois dans la succursale de Bordeaux avec la stratégie de réplication de mot de passe par défaut. Les utilisateurs de la succursale se plaignent de connexions lentes lorsque la liaison WAN est saturée.

    Avant de modifier la liste Autorisés de RODC2, vous devez identifier les utilisateurs et ordinateurs qui ont été authentifiés par RODC2.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "Get-ADDomainControllerPasswordReplicationPolicyUsage -Identity RODC2 -RevealedAccounts" }
    - { id: b, text: "Get-ADDomainControllerPasswordReplicationPolicyUsage -Identity RODC2 -AuthenticatedAccounts" }
    - { id: c, text: "Get-ADDomainControllerPasswordReplicationPolicy -Identity RODC2" }
    - { id: d, text: "repadmin /prp view RODC2 allow" }
answer: { optionId: b }
explanation:
  correct:
    en: "-AuthenticatedAccounts returns the users, computers and service accounts that the RODC has authenticated (its Authenticated to list). With the default policy almost no branch password is cached, so this list, not the revealed list, shows who would benefit from being allowed."
    fr: "-AuthenticatedAccounts renvoie les utilisateurs, ordinateurs et comptes de service que le RODC a authentifiés (sa liste Authentifiés auprès de). Avec la stratégie par défaut, presque aucun mot de passe de la succursale n'est mis en cache : c'est cette liste, et non la liste des comptes révélés, qui montre qui gagnerait à être autorisé."
  options:
    a: { en: "-RevealedAccounts lists only the accounts whose passwords are stored on the RODC, which excludes the branch users not yet allowed.", fr: "-RevealedAccounts ne liste que les comptes dont les mots de passe sont stockés sur le RODC, ce qui exclut les utilisateurs de la succursale pas encore autorisés." }
    c: { en: "This cmdlet displays the Allowed and Denied lists of the policy, not the accounts that used the RODC.", fr: "Cette applet de commande affiche les listes Autorisés et Refusés de la stratégie, pas les comptes qui ont utilisé le RODC." }
    d: { en: "The allow list shows the principals allowed by the policy, not those authenticated by the RODC (the auth2 list).", fr: "La liste allow montre les principaux autorisés par la stratégie, pas ceux authentifiés par le RODC (liste auth2)." }
references:
  - title: Get-ADDomainControllerPasswordReplicationPolicyUsage
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-addomaincontrollerpasswordreplicationpolicyusage
