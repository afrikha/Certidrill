id: az802-cs1a-gander-link
objective: "1.2.2"
type: single
caseStudy: az802-cs1a-munsons
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the replication requirement for the GAN site.

    What should you do?
  fr: |
    Vous devez respecter l'exigence de réplication pour le site GAN.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the replication interval of the HQ-GAN site link to 600 minutes.", fr: "Définir l'intervalle de réplication du lien de sites HQ-GAN sur 600 minutes." } }
    - { id: b, text: { en: "Increase the cost of the HQ-GAN site link.", fr: "Augmenter le coût du lien de sites HQ-GAN." } }
    - { id: c, text: { en: "Clear Bridge all site links on the IP intersite transport.", fr: "Désactiver l'option Bridge all site links du transport intersite IP." } }
    - { id: d, text: { en: "Configure the replication schedule of the HQ-GAN site link.", fr: "Configurer la planification de réplication du lien de sites HQ-GAN." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A site link is available 24 hours a day, 7 days a week by default. Its replication schedule (the `-ReplicationSchedule` parameter of `New-ADReplicationSiteLink` and `Set-ADReplicationSiteLink`) limits the days and hours during which replication can occur over the link.
    fr: |
      Par défaut, un lien de sites est disponible 24 heures sur 24, 7 jours sur 7. Sa planification de réplication (le paramètre `-ReplicationSchedule` de `New-ADReplicationSiteLink` et `Set-ADReplicationSiteLink`) limite les jours et heures pendant lesquels la réplication peut avoir lieu sur ce lien.
  options:
    a: { en: "The interval (180 minutes by default) sets how often replication occurs, not the hours during which it's allowed.", fr: "L'intervalle (180 minutes par défaut) fixe la fréquence de la réplication, pas les heures pendant lesquelles elle est autorisée." }
    b: { en: "Cost selects the preferred path between sites; HQ-GAN is the only link to GAN, and cost doesn't restrict the hours.", fr: "Le coût sert à choisir le chemin préféré entre les sites ; HQ-GAN est le seul lien vers GAN, et le coût ne restreint pas les horaires." }
    c: { en: "Site link bridging controls transitivity between site links, not when replication occurs.", fr: "Le pontage des liens de sites contrôle la transitivité entre les liens, pas le moment de la réplication." }
references:
  - title: New-ADReplicationSiteLink
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/new-adreplicationsitelink
  - title: Active Directory Replication Concepts
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/replication/active-directory-replication-concepts
