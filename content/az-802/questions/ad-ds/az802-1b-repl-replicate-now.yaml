id: az802-1b-repl-replicate-now
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    **DC1** and **DC2** are domain controllers of the **corp.contoso.com** domain in the same site. You create a user account on DC1.

    You need DC2 to receive the change from DC1 immediately.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    **DC1** et **DC2** sont des contrôleurs de domaine du domaine **corp.contoso.com** situés dans le même site. Vous créez un compte d'utilisateur sur DC1.

    DC2 doit recevoir immédiatement la modification de DC1.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run repadmin /replicate DC1 DC2 \"DC=corp,DC=contoso,DC=com\".", fr: "Exécuter repadmin /replicate DC1 DC2 \"DC=corp,DC=contoso,DC=com\"." } }
    - { id: b, text: { en: "In Active Directory Sites and Services, under the NTDS Settings of DC2, right-click the connection object from DC1, and then select Replicate Now.", fr: "Dans Sites et services Active Directory, sous les NTDS Settings de DC2, cliquer avec le bouton droit sur l'objet de connexion depuis DC1, puis sélectionner Replicate Now." } }
    - { id: c, text: { en: "Run repadmin /kcc DC2.", fr: "Exécuter repadmin /kcc DC2." } }
    - { id: d, text: { en: "Run repadmin /replicate DC2 DC1 \"DC=corp,DC=contoso,DC=com\".", fr: "Exécuter repadmin /replicate DC2 DC1 \"DC=corp,DC=contoso,DC=com\"." } }
    - { id: e, text: { en: "Run Get-ADReplicationPartnerMetadata -Target DC2.", fr: "Exécuter Get-ADReplicationPartnerMetadata -Target DC2." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Connection objects are children of the NTDS Settings object of the destination domain controller, so Replicate Now on DC2's connection from DC1 pulls the changes from DC1. repadmin /replicate takes the destination first, then the source, then the naming context, and triggers the replication immediately, without waiting for the schedule."
    fr: "Les objets de connexion sont des enfants de l'objet NTDS Settings du contrôleur de domaine de destination : Replicate Now sur la connexion de DC2 depuis DC1 tire les modifications de DC1. repadmin /replicate prend d'abord la destination, puis la source, puis le contexte de nommage, et déclenche la réplication immédiatement, sans attendre la planification."
  options:
    a: { en: "The order is reversed: this command replicates from DC2 to DC1.", fr: "L'ordre est inversé : cette commande réplique de DC2 vers DC1." }
    c: { en: "kcc recalculates the replication topology of DC2; it doesn't replicate the change.", fr: "kcc recalcule la topologie de réplication de DC2 ; il ne réplique pas la modification." }
    e: { en: "This cmdlet only reports the replication state of DC2 with its partners.", fr: "Cette applet de commande ne fait qu'afficher l'état de la réplication de DC2 avec ses partenaires." }
references:
  - title: Repadmin /replicate
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc742152(v=ws.11)
  - title: Active Directory Replication Concepts
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/replication/active-directory-replication-concepts
