id: az802-1a-fsmo-time-source
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The **adatum.com** forest contains the forest root domain adatum.com and two child domains, **na.adatum.com** and **eu.adatum.com**. Each domain has several domain controllers. All the computers use the default Windows Time hierarchy of the domain.

    You need to configure the forest to synchronize its time with an external NTP server. You must configure the minimum number of servers.

    Which server should you configure?
  fr: |
    La forêt **adatum.com** contient le domaine racine adatum.com et deux domaines enfants, **na.adatum.com** et **eu.adatum.com**. Chaque domaine possède plusieurs contrôleurs de domaine. Tous les ordinateurs utilisent la hiérarchie de temps Windows par défaut du domaine.

    Vous devez configurer la forêt pour qu'elle synchronise son heure avec un serveur NTP externe. Vous devez configurer le nombre minimal de serveurs.

    Quel serveur devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "The schema master", fr: "Le maître de schéma" } }
    - { id: b, text: { en: "The PDC emulator of each of the three domains", fr: "L'émulateur PDC de chacun des trois domaines" } }
    - { id: c, text: { en: "The PDC emulator of the adatum.com domain", fr: "L'émulateur PDC du domaine adatum.com" } }
    - { id: d, text: { en: "The RID master of the adatum.com domain", fr: "Le maître RID du domaine adatum.com" } }
answer: { optionId: c }
explanation:
  correct:
    en: The PDC emulator of the forest root domain is the authoritative time source for the whole forest. The PDC emulators of the child domains synchronize from the forest root domain through the domain hierarchy, so configuring the forest root PDC emulator with an external NTP source is enough.
    fr: "L'émulateur PDC du domaine racine de la forêt est la source de temps faisant autorité pour toute la forêt. Les émulateurs PDC des domaines enfants se synchronisent sur le domaine racine via la hiérarchie des domaines : configurer l'émulateur PDC racine avec une source NTP externe suffit."
  options:
    a: { en: "The schema master has no role in time synchronization.", fr: "Le maître de schéma ne joue aucun rôle dans la synchronisation de l'heure." }
    b: { en: "The child domain PDC emulators already follow the forest root; configuring them would exceed the minimum.", fr: "Les émulateurs PDC des domaines enfants suivent déjà la racine de la forêt ; les configurer dépasserait le minimum." }
    d: { en: "The RID master allocates RID pools and is not a time source.", fr: "Le maître RID attribue les pools RID et n'est pas une source de temps." }
references:
  - title: Active Directory Flexible Single Master Operation (FSMO) roles in Windows
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/fsmo-roles
  - title: Configure an authoritative time
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/configure-authoritative-time-server
