id: az802-1b-gpp-extensions-dragdrop
objective: "1.4.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You use Group Policy preferences in the **corp.contoso.com** domain to configure servers and user sessions.

    Which preference extension should you use for each requirement? To answer, drag the appropriate extensions to the correct requirements. Each extension may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez les préférences de stratégie de groupe du domaine **corp.contoso.com** pour configurer des serveurs et des sessions utilisateur.

    Quelle extension de préférence devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les extensions appropriées vers les exigences correspondantes. Chaque extension peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: netopt, text: Network Options }
    - { id: datasrc, text: Data Sources }
    - { id: files, text: Files }
    - { id: shares, text: Network Shares }
    - { id: folders, text: Folders }
    - { id: ini, text: Ini Files }
  targets:
    - id: t1
      text: { en: "Create a VPN connection", fr: "Créer une connexion VPN" }
    - id: t2
      text: { en: "Create an ODBC data source name", fr: "Créer un nom de source de données ODBC" }
    - id: t3
      text: { en: "Copy a configuration file to `C:\\ProgramData\\Contoso`", fr: "Copier un fichier de configuration dans `C:\\ProgramData\\Contoso`" }
    - id: t4
      text: { en: "Create a share named Scans on file servers", fr: "Créer un partage nommé Scans sur les serveurs de fichiers" }
answer:
  mapping: { t1: netopt, t2: datasrc, t3: files, t4: shares }
explanation:
  correct:
    en: Network Options creates, modifies or deletes VPN and dial-up connections. Data Sources manages ODBC data source names. Files copies files, changes their attributes, replaces or deletes them. Network Shares creates, modifies or deletes network shares.
    fr: Network Options crée, modifie ou supprime des connexions VPN et d'accès à distance. Data Sources gère les noms de sources de données ODBC. Files copie des fichiers, modifie leurs attributs, les remplace ou les supprime. Network Shares crée, modifie ou supprime des partages réseau.
  options:
    folders: { en: "Folders creates, modifies or deletes folders; it doesn't copy files into them.", fr: "Folders crée, modifie ou supprime des dossiers ; il n'y copie pas de fichiers." }
    ini: { en: "Ini Files changes sections or properties inside .ini or .inf files; it doesn't copy files.", fr: "Ini Files modifie des sections ou des propriétés dans des fichiers .ini ou .inf ; il ne copie pas de fichiers." }
references:
  - title: Group Policy preferences in Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-preferences
