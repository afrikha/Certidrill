id: az802-1b-gpo-computer-read
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In the **corp.contoso.com** domain, the **Sales-Desktop** GPO contains only User Configuration settings and is linked to the **Sales** OU, which contains user accounts. The computers of the users are in the **Workstations** OU.

    To limit the GPO to the members of the **G-Sales** group, an administrator removed **Authenticated Users** from the security filtering of Sales-Desktop and added G-Sales. Since then, `gpresult /h` on the users' computers shows that Sales-Desktop fails to apply, with an access denied error.

    You need Sales-Desktop to apply to the members of G-Sales only.

    What should you do?
  fr: |
    Dans le domaine **corp.contoso.com**, le GPO **Sales-Desktop** ne contient que des paramètres de Configuration utilisateur et est lié à l'UO **Sales**, qui contient des comptes d'utilisateur. Les ordinateurs des utilisateurs se trouvent dans l'UO **Workstations**.

    Pour limiter le GPO aux membres du groupe **G-Sales**, un administrateur a retiré **Authenticated Users** du filtrage de sécurité de Sales-Desktop et a ajouté G-Sales. Depuis, `gpresult /h` sur les ordinateurs des utilisateurs montre que Sales-Desktop ne s'applique pas, avec une erreur d'accès refusé.

    Sales-Desktop doit s'appliquer uniquement aux membres de G-Sales.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add Authenticated Users back to the security filtering of Sales-Desktop.", fr: "Rajouter Authenticated Users au filtrage de sécurité de Sales-Desktop." } }
    - { id: b, text: { en: "On the Delegation tab of Sales-Desktop, grant Domain Computers the Read permission.", fr: "Dans l'onglet Délégation de Sales-Desktop, accorder l'autorisation Lecture à Domain Computers." } }
    - { id: c, text: { en: "Link Sales-Desktop to the Workstations OU.", fr: "Lier Sales-Desktop à l'UO Workstations." } }
    - { id: d, text: { en: "Enable loopback processing in Replace mode in Sales-Desktop.", fr: "Activer le traitement par bouclage en mode Replace dans Sales-Desktop." } }
answer: { optionId: b }
explanation:
  correct:
    en: Since security update MS16-072, Windows retrieves user GPOs in the security context of the computer, so the computer accounts need Read on every GPO that applies to the signed-in user. Removing Authenticated Users from security filtering removed that Read permission. Granting Read only (without Apply group policy) to Domain Computers restores processing while G-Sales stays the only group that applies the GPO.
    fr: Depuis la mise à jour de sécurité MS16-072, Windows récupère les GPO utilisateur dans le contexte de sécurité de l'ordinateur ; les comptes d'ordinateur doivent donc avoir la Lecture sur chaque GPO qui s'applique à l'utilisateur connecté. Retirer Authenticated Users du filtrage de sécurité a supprimé cette autorisation de Lecture. Accorder seulement la Lecture (sans Appliquer la stratégie de groupe) à Domain Computers rétablit le traitement, et G-Sales reste le seul groupe qui applique le GPO.
  options:
    a: { en: "Security filtering grants Read and Apply group policy, so every user of the Sales OU would receive the GPO again.", fr: "Le filtrage de sécurité accorde Lecture et Appliquer la stratégie de groupe : tous les utilisateurs de l'UO Sales recevraient de nouveau le GPO." }
    c: { en: "The computers still couldn't read the GPO, and the user settings would then depend on loopback processing.", fr: "Les ordinateurs ne pourraient toujours pas lire le GPO, et les paramètres utilisateur dépendraient alors du traitement par bouclage." }
    d: { en: "Loopback is a computer setting that would need to apply to the computers; it doesn't fix the missing Read permission.", fr: "Le bouclage est un paramètre ordinateur qui devrait s'appliquer aux ordinateurs ; il ne corrige pas l'autorisation de Lecture manquante." }
references:
  - title: Can't apply user Group Policy settings if computer objects don't have GPO Read permissions
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/group-policy/cannot-apply-user-gpo-when-computer-objects-dont-have-read-permissions
