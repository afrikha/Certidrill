id: az802-1b-repl-syncall-switches
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The **corp.contoso.com** forest has domain controllers in the Paris, Lyon and Lille sites. On **DC1**, in the Paris site, you changed the schedule of a site link and modified several user accounts and DNS records stored in application partitions.

    You need DC1 to push its changes now to all its replication partners, in every site, for every directory partition that DC1 holds.

    Which command should you run?
  fr: |
    La forêt **corp.contoso.com** possède des contrôleurs de domaine dans les sites Paris, Lyon et Lille. Sur **DC1**, dans le site Paris, vous avez modifié la planification d'un lien de sites, ainsi que plusieurs comptes d'utilisateur et des enregistrements DNS stockés dans des partitions d'application.

    DC1 doit pousser ses modifications maintenant vers tous ses partenaires de réplication, dans tous les sites, pour chaque partition d'annuaire qu'il héberge.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "repadmin /syncall DC1 /AeP" }
    - { id: b, text: "repadmin /syncall DC1 /AP" }
    - { id: c, text: "repadmin /syncall DC1 /Ae" }
    - { id: d, text: "repadmin /syncall DC1 /eP" }
answer: { optionId: a }
explanation:
  correct:
    en: "The switches are case-sensitive: /A synchronizes all the naming contexts held by DC1, /e includes the domain controllers of the other sites (by default only the local site is synchronized), and /P pushes the changes outward from DC1 instead of pulling them."
    fr: "Les commutateurs respectent la casse : /A synchronise tous les contextes de nommage hébergés par DC1, /e inclut les contrôleurs de domaine des autres sites (par défaut seul le site local est synchronisé) et /P pousse les modifications depuis DC1 au lieu de les tirer."
  options:
    b: { en: "Without /e, only the partners in the Paris site are synchronized.", fr: "Sans /e, seuls les partenaires du site Paris sont synchronisés." }
    c: { en: "Without /P, DC1 pulls changes from its partners instead of pushing its own changes to them.", fr: "Sans /P, DC1 tire les modifications de ses partenaires au lieu de leur pousser les siennes." }
    d: { en: "Without /A and without a naming context, syncall works only on the configuration partition, so the user accounts and DNS records aren't pushed.", fr: "Sans /A et sans contexte de nommage, syncall ne traite que la partition de configuration : les comptes d'utilisateur et les enregistrements DNS ne sont pas poussés." }
references:
  - title: Repadmin /syncall
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc835086(v=ws.11)
