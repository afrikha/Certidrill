id: az802-1b-svc-gmsa-order
objective: "1.3.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    The **corp.contoso.com** forest has no KDS root key. The security group **WebFarm-Hosts** already contains the computer accounts of **WEB1**, **WEB2** and **WEB3**, and the three servers were restarted since they were added to the group.

    You need the IIS application pools of WEB1 to run as a new group managed service account named **svc-web** that WEB2 and WEB3 will also use later.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    La forêt **corp.contoso.com** n'a pas de clé racine KDS. Le groupe de sécurité **WebFarm-Hosts** contient déjà les comptes d'ordinateur de **WEB1**, **WEB2** et **WEB3**, et les trois serveurs ont été redémarrés depuis leur ajout au groupe.

    Les pools d'applications IIS de WEB1 doivent s'exécuter sous un nouveau compte de service administré de groupe nommé **svc-web**, que WEB2 et WEB3 utiliseront aussi plus tard.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: kds, text: { en: "On a domain controller, run Add-KdsRootKey -EffectiveImmediately, and then wait for the key to replicate to all the domain controllers.", fr: "Sur un contrôleur de domaine, exécuter Add-KdsRootKey -EffectiveImmediately, puis attendre que la clé soit répliquée vers tous les contrôleurs de domaine." } }
    - { id: new, text: "New-ADServiceAccount -Name svc-web -DNSHostName svc-web.corp.contoso.com -PrincipalsAllowedToRetrieveManagedPassword WebFarm-Hosts" }
    - { id: install, text: { en: "On WEB1, run Install-ADServiceAccount -Identity svc-web.", fr: "Sur WEB1, exécuter Install-ADServiceAccount -Identity svc-web." } }
    - { id: link, text: "Add-ADComputerServiceAccount -Identity WEB1 -ServiceAccount svc-web" }
    - { id: single, text: "New-ADServiceAccount -Name svc-web -RestrictToSingleComputer" }
    - { id: reset, text: { en: "On WEB1, run Reset-ADServiceAccountPassword -Identity svc-web.", fr: "Sur WEB1, exécuter Reset-ADServiceAccountPassword -Identity svc-web." } }
answer:
  sequence: [ kds, new, install ]
explanation:
  correct:
    en: "The domain controllers compute gMSA passwords from the KDS root key, so the key must exist and be available on the DCs first. You then create the gMSA with -DNSHostName and the group allowed to retrieve its password, and install it on WEB1 with Install-ADServiceAccount, which fails if PrincipalsAllowedToRetrieveManagedPassword isn't set."
    fr: "Les contrôleurs de domaine calculent les mots de passe des gMSA à partir de la clé racine KDS : la clé doit donc d'abord exister et être disponible sur les DC. Vous créez ensuite le gMSA avec -DNSHostName et le groupe autorisé à récupérer son mot de passe, puis vous l'installez sur WEB1 avec Install-ADServiceAccount, qui échoue si PrincipalsAllowedToRetrieveManagedPassword n'est pas défini."
  options:
    link: { en: "Add-ADComputerServiceAccount links a standalone MSA to its computer; a gMSA relies on the host group.", fr: "Add-ADComputerServiceAccount lie un MSA autonome à son ordinateur ; un gMSA s'appuie sur le groupe d'hôtes." }
    single: { en: "-RestrictToSingleComputer creates a standalone MSA that WEB2 and WEB3 couldn't use.", fr: "-RestrictToSingleComputer crée un MSA autonome que WEB2 et WEB3 ne pourraient pas utiliser." }
    reset: { en: "Reset-ADServiceAccountPassword applies only to standalone MSAs.", fr: "Reset-ADServiceAccountPassword ne s'applique qu'aux MSA autonomes." }
references:
  - title: Manage Group Managed Service Accounts
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-managed-service-accounts/group-managed-service-accounts/getting-started-with-group-managed-service-accounts
  - title: Install-ADServiceAccount (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/install-adserviceaccount
