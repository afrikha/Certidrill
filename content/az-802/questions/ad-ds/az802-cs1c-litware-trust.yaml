id: az802-cs1c-litware-trust
objective: "1.2.1"
type: dropdown
caseStudy: az802-cs1c-humongous
difficulty: 3
status: draft
stem:
  en: |
    You need to create a trust that meets the Litware access requirement.

    How should you configure the trust? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer une approbation qui respecte l'exigence d'accès de Litware.

    Comment devez-vous configurer l'approbation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Trust type: [[type]]

      Humongous domain in which you create the trust: [[trusting]]

      Additional configuration for the Fabrikam users: [[fab]]
    fr: |
      Type d'approbation : [[type]]

      Domaine de Humongous dans lequel vous créez l'approbation : [[trusting]]

      Configuration supplémentaire pour les utilisateurs de Fabrikam : [[fab]]
  slots:
    - id: type
      options:
        - { id: external, text: { en: "External trust", fr: "Approbation externe" } }
        - { id: forest, text: { en: "Forest trust", fr: "Approbation de forêt" } }
        - { id: shortcut, text: { en: "Shortcut trust", fr: "Approbation raccourcie" } }
        - { id: realm, text: { en: "Realm trust", fr: "Approbation de domaine Kerberos (realm)" } }
    - id: trusting
      options:
        - { id: claims, text: claims.humongousinsurance.com }
        - { id: hi, text: humongousinsurance.com }
        - { id: both, text: { en: "Both humongousinsurance.com and claims.humongousinsurance.com", fr: "humongousinsurance.com et claims.humongousinsurance.com" } }
    - id: fab
      options:
        - { id: none, text: { en: "None", fr: "Aucune" } }
        - { id: remove, text: { en: "Remove the trust between litwarebrokers.com and fabrikam.com", fr: "Supprimer l'approbation entre litwarebrokers.com et fabrikam.com" } }
        - { id: fabtrust, text: { en: "Create a one-way forest trust in which fabrikam.com trusts humongousinsurance.com", fr: "Créer une approbation de forêt unidirectionnelle dans laquelle fabrikam.com approuve humongousinsurance.com" } }
answer:
  values: { type: forest, trusting: hi, fab: none }
explanation:
  correct:
    en: |
      A forest trust links two forests and is transitive across all their domains, so Litware users can reach servers in both Humongous domains. It can only be created between the forest root domain of each forest, so you create it once, in humongousinsurance.com. As a one-way trust in which humongousinsurance.com trusts litwarebrokers.com, it gives Humongous users no access to Litware. A forest trust can't be implicitly extended to a third forest, so fabrikam.com users can't reach Humongous through Litware and no additional configuration is needed.
    fr: |
      Une approbation de forêt relie deux forêts et elle est transitive pour tous leurs domaines : les utilisateurs de Litware peuvent donc atteindre les serveurs des deux domaines de Humongous. Elle ne peut être créée qu'entre les domaines racines des deux forêts : vous la créez donc une seule fois, dans humongousinsurance.com. Configurée comme une approbation unidirectionnelle dans laquelle humongousinsurance.com approuve litwarebrokers.com, elle ne donne aux utilisateurs de Humongous aucun accès à Litware. Une approbation de forêt ne peut pas être étendue implicitement à une troisième forêt : les utilisateurs de fabrikam.com ne peuvent donc pas atteindre Humongous par Litware, et aucune configuration supplémentaire n'est nécessaire.
  options:
    external: { en: "An external trust links two specific domains; it doesn't extend to the other domains of the Humongous forest.", fr: "Une approbation externe relie deux domaines précis ; elle ne s'étend pas aux autres domaines de la forêt Humongous." }
    shortcut: { en: "A shortcut trust links two domains of the same forest to shorten the authentication path.", fr: "Une approbation raccourcie relie deux domaines d'une même forêt pour raccourcir le chemin d'authentification." }
    realm: { en: "A realm trust connects to a non-Windows Kerberos realm.", fr: "Une approbation de domaine Kerberos (realm) relie un domaine Kerberos non Windows." }
    claims: { en: "A forest trust can only be created in a forest root domain, not in a child domain.", fr: "Une approbation de forêt ne peut être créée que dans un domaine racine de forêt, pas dans un domaine enfant." }
    both: { en: "One forest trust in the forest root domain covers every domain of the forest; claims.humongousinsurance.com can't hold a forest trust.", fr: "Une seule approbation de forêt dans le domaine racine couvre tous les domaines de la forêt ; claims.humongousinsurance.com ne peut pas porter d'approbation de forêt." }
    remove: { en: "Removing this trust is unnecessary and would break the Fabrikam access to the Litware pricing application.", fr: "Supprimer cette approbation est inutile et couperait l'accès de Fabrikam à l'application de tarification de Litware." }
    fabtrust: { en: "This trust would give Humongous users access to Fabrikam; it doesn't block anything.", fr: "Cette approbation donnerait aux utilisateurs de Humongous un accès à Fabrikam ; elle ne bloque rien." }
references:
  - title: How trust relationships work for forests in Active Directory
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/concepts-forest-trust
