id: az802-cs2a-rodc-prp
objective: "1.1.4"
type: yesno_statements
caseStudy: az802-cs2a-coho-winery
difficulty: 3
status: draft
stem:
  en: |
    Lucas and Emma sign in to their computers at Saint-Emilion. RODC-SE can reach DC1 when they sign in. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Lucas et Emma ouvrent une session sur leurs ordinateurs à Saint-Emilion. RODC-SE peut joindre DC1 au moment où ils ouvrent leur session. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          After Lucas signs in, his password is cached on RODC-SE.
        fr: |
          Après l'ouverture de session de Lucas, son mot de passe est mis en cache sur RODC-SE.
    - id: s2
      text:
        en: |
          After Emma signs in, her password is cached on RODC-SE.
        fr: |
          Après l'ouverture de session d'Emma, son mot de passe est mis en cache sur RODC-SE.
    - id: s3
      text:
        en: |
          If RODC-SE is stolen, resetting Lucas's password on DC1 makes the copy cached on RODC-SE unusable to access resources in the HQ site.
        fr: |
          Si RODC-SE est volé, réinitialiser le mot de passe de Lucas sur DC1 rend la copie mise en cache sur RODC-SE inutilisable pour accéder aux ressources du site HQ.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Lucas is a member of SE-Staff, which is in the Allowed list, so RODC-SE requests his password from a writable DC and caches it after his first authentication. Emma is also a member of Backup Operators, which is in the default Denied list, and the Denied list takes precedence over the Allowed list. An RODC offers no way to erase cached passwords, but resetting a password on a writable DC makes the stolen copy useless for accessing other sites.
    fr: |
      Lucas est membre de SE-Staff, qui figure dans la liste Autorisés : RODC-SE demande son mot de passe à un contrôleur de domaine accessible en écriture et le met en cache après sa première authentification. Emma est aussi membre de Backup Operators, qui figure dans la liste Refusés par défaut, et la liste Refusés est prioritaire sur la liste Autorisés. Un RODC n'offre aucun moyen d'effacer les mots de passe mis en cache, mais réinitialiser un mot de passe sur un contrôleur de domaine accessible en écriture rend la copie volée inutilisable pour accéder aux autres sites.
references:
  - title: Password Replication Policy
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc730883(v=ws.10)
