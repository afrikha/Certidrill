id: az802-1a-azdc-dns-guidance
objective: "1.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank plans to run three domain controllers of the **woodgrove.local** domain as Azure virtual machines. The domain controllers will also run the DNS Server role, and on-premises domain controllers remain in service.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit d'exécuter trois contrôleurs de domaine du domaine **woodgrove.local** en tant que machines virtuelles Azure. Ces contrôleurs de domaine exécuteront aussi le rôle Serveur DNS, et les contrôleurs de domaine locaux restent en service.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: On each Azure domain controller, you should configure the loopback address as the primary DNS server.
        fr: Sur chaque contrôleur de domaine Azure, vous devez configurer l'adresse de bouclage comme serveur DNS principal.
    - id: s2
      text:
        en: Microsoft recommends giving the global catalog role to at least two of the Azure domain controllers.
        fr: Microsoft recommande d'attribuer le rôle de catalogue global à au moins deux des contrôleurs de domaine Azure.
    - id: s3
      text:
        en: When you promote the first Azure domain controller, its network configuration can use an on-premises domain controller as the primary DNS server.
        fr: Lors de la promotion du premier contrôleur de domaine Azure, sa configuration réseau peut utiliser un contrôleur de domaine local comme serveur DNS principal.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: The loopback address should only be a secondary or tertiary DNS server on a domain controller; pointing a domain controller to itself first can delay its startup. Microsoft recommends at least two global catalog servers among the Azure domain controllers, and notes that during the initial setup a domain controller in Azure might need to use an on-premises domain controller as its primary DNS source.
    fr: L'adresse de bouclage ne doit être que serveur DNS secondaire ou tertiaire sur un contrôleur de domaine ; faire pointer un contrôleur de domaine d'abord vers lui-même peut retarder son démarrage. Microsoft recommande au moins deux serveurs de catalogue global parmi les contrôleurs de domaine Azure, et indique que lors de la configuration initiale, un contrôleur de domaine Azure peut devoir utiliser un contrôleur de domaine local comme source DNS principale.
references:
  - title: Deploy AD DS in an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/identity/adds-extend-domain
