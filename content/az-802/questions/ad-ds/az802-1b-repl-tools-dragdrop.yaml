id: az802-1b-repl-tools-dragdrop
objective: "1.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You manage replication for the **corp.contoso.com** forest. **DC3** is a domain controller in the **Lyon** site.

    Which tool should you use for each task? To answer, drag the appropriate tools to the correct tasks. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez la réplication de la forêt **corp.contoso.com**. **DC3** est un contrôleur de domaine du site **Lyon**.

    Quel outil devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les outils appropriés vers les tâches correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: showrepl, text: "repadmin /showrepl" }
    - { id: queue, text: "repadmin /queue" }
    - { id: kcc, text: "repadmin /kcc" }
    - { id: failure, text: Get-ADReplicationFailure }
    - { id: dcdiag, text: "dcdiag /test:replications" }
    - { id: utd, text: Get-ADReplicationUpToDatenessVectorTable }
  targets:
    - id: t1
      text: { en: "Display the inbound replication partners of DC3 and the result of the last replication attempt for each partition", fr: "Afficher les partenaires de réplication entrants de DC3 et le résultat de la dernière tentative de réplication pour chaque partition" }
    - id: t2
      text: { en: "List the inbound replication requests that DC3 still has to issue", fr: "Lister les demandes de réplication entrantes que DC3 doit encore émettre" }
    - id: t3
      text: { en: "Make the KCC on DC3 recalculate the inbound replication topology immediately", fr: "Forcer le KCC de DC3 à recalculer immédiatement la topologie de réplication entrante" }
    - id: t4
      text: { en: "Return, as PowerShell objects, the recent replication failures of all the domain controllers of the Lyon site", fr: "Renvoyer, sous forme d'objets PowerShell, les échecs de réplication récents de tous les contrôleurs de domaine du site Lyon" }
answer:
  mapping: { t1: showrepl, t2: queue, t3: kcc, t4: failure }
explanation:
  correct:
    en: "repadmin /showrepl shows the status of the last inbound replication attempt for each partition and partner. repadmin /queue shows the inbound requests a DC must issue to become consistent. repadmin /kcc forces the KCC to recalculate the inbound topology now. Get-ADReplicationFailure accepts -Scope Site with the site name as -Target and returns the recent failures as objects."
    fr: "repadmin /showrepl affiche l'état de la dernière tentative de réplication entrante pour chaque partition et chaque partenaire. repadmin /queue affiche les demandes entrantes qu'un DC doit émettre pour devenir cohérent. repadmin /kcc force le KCC à recalculer maintenant la topologie entrante. Get-ADReplicationFailure accepte -Scope Site avec le nom du site comme -Target et renvoie les échecs récents sous forme d'objets."
  options:
    dcdiag: { en: "dcdiag /test:replications tests the connection objects of a DC and reports text output; it isn't needed for these tasks.", fr: "dcdiag /test:replications teste les objets de connexion d'un DC et produit une sortie texte ; il n'est pas nécessaire pour ces tâches." }
    utd: { en: "The up-to-dateness vector table shows the highest USNs received, not partners' last results, pending requests or failures.", fr: "La table du vecteur de mise à jour indique les plus hauts USN reçus, pas le dernier résultat des partenaires, les demandes en attente ni les échecs." }
references:
  - title: Repadmin
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc770963(v=ws.11)
  - title: Advanced Active Directory Replication and Topology Management Using Windows PowerShell (Level 200)
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/powershell/advanced-active-directory-replication-and-topology-management-using-windows-powershell--level-200-
