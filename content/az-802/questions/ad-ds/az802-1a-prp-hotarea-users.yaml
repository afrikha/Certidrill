id: az802-1a-prp-hotarea-users
objective: "1.1.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A read-only domain controller named **RODC1** has the following password replication policy:

    - Allow: Allowed RODC Password Replication Group, Lyon-Users
    - Deny: Denied RODC Password Replication Group, Administrators, Server Operators, Backup Operators, Account Operators

    No password was prepopulated on RODC1. The following table shows four users, their group memberships and whether they have signed in through RODC1 since it was promoted.

    Answer each prompt by selecting the appropriate user.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un contrôleur de domaine en lecture seule nommé **RODC1** a la stratégie de réplication de mot de passe suivante :

    - Autoriser : Allowed RODC Password Replication Group, Lyon-Users
    - Refuser : Denied RODC Password Replication Group, Administrators, Server Operators, Backup Operators, Account Operators

    Aucun mot de passe n'a été prérempli sur RODC1. Le tableau suivant présente quatre utilisateurs, leurs appartenances aux groupes et s'ils se sont connectés via RODC1 depuis sa promotion.

    Répondez à chaque consigne en sélectionnant l'utilisateur approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The user whose password is currently cached on RODC1", fr: "L'utilisateur dont le mot de passe est actuellement mis en cache sur RODC1" } 
    - id: p2
      text: { en: "The user whose password RODC1 can never cache because of an explicit Deny entry", fr: "L'utilisateur dont RODC1 ne peut jamais mettre en cache le mot de passe en raison d'une entrée Refuser explicite" }
  grid:
    header: [{ en: User, fr: Utilisateur }, { en: Member of, fr: Membre de }, { en: Signed in through RODC1, fr: Connecté via RODC1 }]
    rows:
      - [{ text: User1, area: u1 }, { text: Lyon-Users }, { text: { en: "No", fr: "Non" } }]
      - [{ text: User2, area: u2 }, { text: Server Operators }, { text: { en: "Yes", fr: "Oui" } }]
      - [{ text: User3, area: u3 }, { text: Lyon-Users }, { text: { en: "Yes", fr: "Oui" } }]
      - [{ text: User4, area: u4 }, { text: Paris-Users }, { text: { en: "Yes", fr: "Oui" } }]
answer:
  values: { p1: u3, p2: u2 }
explanation:
  correct:
    en: An RODC caches a password when an allowed account authenticates through it (or when it is prepopulated). User3 is allowed through Lyon-Users and has signed in, so its password is cached; User1 is allowed but has never signed in. User2 is a member of Server Operators, which is in the default Deny list. User4 is not cached because Paris-Users is not in the Allowed list, but no Deny entry applies to it.
    fr: "Un RODC met un mot de passe en cache lorsqu'un compte autorisé s'authentifie par son intermédiaire (ou lors d'un préremplissage). User3 est autorisé via Lyon-Users et s'est connecté : son mot de passe est mis en cache ; User1 est autorisé mais ne s'est jamais connecté. User2 est membre de Server Operators, qui figure dans la liste Refusés par défaut. User4 n'est pas mis en cache, car Paris-Users ne figure pas dans la liste Autorisés, mais aucune entrée Refuser ne s'applique à lui."
references:
  - title: Install a Windows Server 2012 Active Directory Read-Only Domain Controller (RODC) (Level 200)
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/rodc/install-a-windows-server-2012-active-directory-read-only-domain-controller--rodc---level-200-
  - title: Deploy Active Directory Domain Services domain controllers
    url: https://learn.microsoft.com/en-us/training/modules/deploy-manage-active-directory-domain-services-domain-controllers/4-deploy-active-directory-domain-services-controllers
