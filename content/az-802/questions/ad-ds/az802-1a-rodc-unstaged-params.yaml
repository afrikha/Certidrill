id: az802-1a-rodc-unstaged-params
objective: "1.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You are signed in as a domain administrator on a domain-joined server named **RODC7** that runs Windows Server 2025. You need to promote RODC7 to a read-only domain controller of **corp.contoso.com** in the existing site **Rennes**. The solution must meet the following requirements:

    - The passwords of the members of a group named **Rennes-Finance** must never be cached on RODC7.
    - RODC7 must not host the global catalog.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes connecté en tant qu'administrateur du domaine sur un serveur joint au domaine nommé **RODC7** qui exécute Windows Server 2025. Vous devez promouvoir RODC7 en contrôleur de domaine en lecture seule de **corp.contoso.com** dans le site existant **Rennes**. La solution doit répondre aux exigences suivantes :

    - Les mots de passe des membres d'un groupe nommé **Rennes-Finance** ne doivent jamais être mis en cache sur RODC7.
    - RODC7 ne doit pas héberger le catalogue global.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Install-ADDSDomainController -DomainName corp.contoso.com -SiteName Rennes [[mode]] `
        [[deny]] "CONTOSO\Rennes-Finance", "BUILTIN\Administrators", "BUILTIN\Server Operators", "BUILTIN\Backup Operators", "BUILTIN\Account Operators", "CONTOSO\Denied RODC Password Replication Group" `
        [[gc]] -Credential (Get-Credential)
  slots:
    - id: mode
      options:
        - { id: ro, text: -ReadOnlyReplica }
        - { id: existing, text: -UseExistingAccount }
        - { id: critical, text: -CriticalReplicationOnly }
    - id: deny
      options:
        - { id: denylist, text: -DenyPasswordReplicationAccountName }
        - { id: allowlist, text: -AllowPasswordReplicationAccountName }
        - { id: deleg, text: -DelegatedAdministratorAccountName }
    - id: gc
      options:
        - { id: nogc, text: -NoGlobalCatalog }
        - { id: nodns, text: -NoDnsOnNetwork }
        - { id: skip, text: -SkipPreChecks }
answer:
  values: { mode: ro, deny: denylist, gc: nogc }
explanation:
  correct:
    en: "-ReadOnlyReplica selects the RODC parameter set for an unstaged installation. -DenyPasswordReplicationAccountName sets the Deny list of the RODC; the command lists the default denied principals plus Rennes-Finance. -NoGlobalCatalog prevents the RODC from becoming a global catalog server, which is otherwise the default."
    fr: "-ReadOnlyReplica sélectionne le jeu de paramètres RODC pour une installation non intermédiaire. -DenyPasswordReplicationAccountName définit la liste Refusés du RODC ; la commande indique les principaux refusés par défaut plus Rennes-Finance. -NoGlobalCatalog empêche le RODC de devenir serveur de catalogue global, ce qu'il serait sinon par défaut."
  options:
    existing: { en: "-UseExistingAccount attaches a server to a staged RODC account, which does not exist here.", fr: "-UseExistingAccount attache un serveur à un compte de RODC créé à l'avance, qui n'existe pas ici." }
    allowlist: { en: "Adding these principals to the Allowed list would let their passwords be cached, the opposite of the requirement.", fr: "Ajouter ces principaux à la liste Autorisés permettrait la mise en cache de leurs mots de passe, à l'inverse de l'exigence." }
    nodns: { en: "-NoDnsOnNetwork states that no DNS server is available; it does not affect the global catalog.", fr: "-NoDnsOnNetwork indique qu'aucun serveur DNS n'est disponible ; il n'a pas d'effet sur le catalogue global." }
references:
  - title: Install-ADDSDomainController
    url: https://learn.microsoft.com/en-us/powershell/module/addsdeployment/install-addsdomaincontroller
