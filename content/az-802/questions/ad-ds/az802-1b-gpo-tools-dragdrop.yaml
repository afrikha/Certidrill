id: az802-1b-gpo-tools-dragdrop
objective: "1.4.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You manage Group Policy in the **corp.contoso.com** domain from an administrative workstation that has the Group Policy Management Console (GPMC) installed.

    Which tool should you use for each task? To answer, drag the appropriate tools to the correct tasks. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez la stratégie de groupe du domaine **corp.contoso.com** depuis un poste d'administration sur lequel la console de gestion des stratégies de groupe (GPMC) est installée.

    Quel outil devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les outils appropriés vers les tâches correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: modeling, text: { en: "Group Policy Modeling", fr: "Modélisation de stratégie de groupe (Group Policy Modeling)" } }
    - { id: results, text: { en: "Group Policy Results", fr: "Résultats de stratégie de groupe (Group Policy Results)" } }
    - { id: invoke, text: Invoke-GPUpdate }
    - { id: gpresult, text: "gpresult /r" }
    - { id: backup, text: Backup-GPO }
    - { id: gpupdate, text: "gpupdate /force" }
  targets:
    - id: t1
      text: { en: "Simulate the GPOs that would apply to a user if the account were moved to another OU", fr: "Simuler les GPO qui s'appliqueraient à un utilisateur si son compte était déplacé dans une autre UO" }
    - id: t2
      text: { en: "From the GPMC, show the settings actually applied on a remote computer and the winning GPO of each setting", fr: "Depuis la GPMC, afficher les paramètres réellement appliqués sur un ordinateur distant et le GPO gagnant de chaque paramètre" }
    - id: t3
      text: { en: "Trigger a Group Policy refresh on the remote server SRV7 from the workstation", fr: "Déclencher une actualisation de la stratégie de groupe sur le serveur distant SRV7 depuis le poste" }
    - id: t4
      text: { en: "On the local computer, display a summary of the Resultant Set of Policy data", fr: "Sur l'ordinateur local, afficher un résumé des données du jeu de stratégies résultant" }
answer:
  mapping: { t1: modeling, t2: results, t3: invoke, t4: gpresult }
explanation:
  correct:
    en: "Group Policy Modeling simulates the net effect of GPOs, including moving an object to another container, security group membership and WMI filters. Group Policy Results collects the RSoP data actually applied on the target computer. Invoke-GPUpdate can refresh the local or a remote computer, and gpresult /r displays an RSoP summary locally."
    fr: "La modélisation de stratégie de groupe simule l'effet net des GPO, y compris le déplacement d'un objet dans un autre conteneur, l'appartenance aux groupes de sécurité et les filtres WMI. Les résultats de stratégie de groupe collectent les données RSoP réellement appliquées sur l'ordinateur cible. Invoke-GPUpdate peut actualiser l'ordinateur local ou un ordinateur distant, et gpresult /r affiche localement un résumé RSoP."
  options:
    gpupdate: { en: "gpupdate refreshes only the computer on which it runs.", fr: "gpupdate n'actualise que l'ordinateur sur lequel il s'exécute." }
    backup: { en: "Backup-GPO saves GPOs to the file system; it doesn't report or refresh policy.", fr: "Backup-GPO enregistre les GPO dans le système de fichiers ; il n'affiche ni n'actualise la stratégie." }
references:
  - title: Group Policy Modeling and Results in Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-modeling-results
  - title: Group Policy processing for Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-processing
