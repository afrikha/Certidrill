id: az802-1a-fsmo-rid-unavailable
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The **corp.northwind.com** domain has two domain controllers: DC1 and DC2. DC1 holds all five operation master roles. DC1 has been shut down for 10 days for a hardware repair and will return to service next week.

    Since yesterday, help desk operators who connect to DC2 receive errors when they create new user and group accounts. Sign-ins, password changes and modifications of existing accounts work normally.

    What is the most likely cause of the errors?
  fr: |
    Le domaine **corp.northwind.com** possède deux contrôleurs de domaine : DC1 et DC2. DC1 détient les cinq rôles de maître d'opérations. DC1 est arrêté depuis 10 jours pour une réparation matérielle et reprendra du service la semaine prochaine.

    Depuis hier, les opérateurs du support qui se connectent à DC2 reçoivent des erreurs lorsqu'ils créent de nouveaux comptes d'utilisateur et de groupe. Les connexions, les changements de mot de passe et les modifications de comptes existants fonctionnent normalement.

    Quelle est la cause la plus probable des erreurs ?
body:
  options:
    - { id: a, text: { en: "DC2 has exhausted its RID pool and cannot obtain a new one from the RID master.", fr: "DC2 a épuisé son pool RID et ne peut pas en obtenir un nouveau auprès du maître RID." } }
    - { id: b, text: { en: "DC2 cannot contact the PDC emulator to process the account creation.", fr: "DC2 ne peut pas contacter l'émulateur PDC pour traiter la création des comptes." } }
    - { id: c, text: { en: "The infrastructure master cannot update the references of the new accounts.", fr: "Le maître d'infrastructure ne peut pas mettre à jour les références des nouveaux comptes." } }
    - { id: d, text: { en: "The schema master is required to create objects of the user and group classes.", fr: "Le maître de schéma est nécessaire pour créer des objets des classes user et group." } }
answer: { optionId: a }
explanation:
  correct:
    en: Each domain controller receives a pool of relative IDs (RIDs) from the RID master and uses one RID for every new security principal. While DC1 is offline, DC2 can create accounts until its current pool runs out; after that, creating users and groups fails while operations on existing accounts keep working.
    fr: Chaque contrôleur de domaine reçoit du maître RID un pool d'identificateurs relatifs (RID) et utilise un RID pour chaque nouveau principal de sécurité. Tant que DC1 est hors ligne, DC2 peut créer des comptes jusqu'à épuisement de son pool actuel ; ensuite, la création d'utilisateurs et de groupes échoue, tandis que les opérations sur les comptes existants continuent de fonctionner.
  options:
    b: { en: "The PDC emulator handles time, preferential password changes and lockouts; it does not allocate the identifiers of new accounts.", fr: "L'émulateur PDC gère l'heure, les changements de mot de passe prioritaires et les verrouillages ; il n'attribue pas les identificateurs des nouveaux comptes." }
    c: { en: "The infrastructure master updates cross-domain references; its absence does not block account creation.", fr: "Le maître d'infrastructure met à jour les références interdomaines ; son absence ne bloque pas la création de comptes." }
    d: { en: "The schema master is needed only to modify the schema, not to create objects of existing classes.", fr: "Le maître de schéma n'est nécessaire que pour modifier le schéma, pas pour créer des objets de classes existantes." }
references:
  - title: Active Directory Flexible Single Master Operation (FSMO) roles in Windows
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/fsmo-roles
