id: az802-1b-usr-disabled-multi
objective: "1.3.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An auditor asks for the list of all the disabled user accounts in the **corp.contoso.com** domain.

    Which two commands should you run? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un auditeur demande la liste de tous les comptes d'utilisateur désactivés du domaine **corp.contoso.com**.

    Quelles sont les deux commandes à exécuter ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Search-ADAccount -LockedOut -UsersOnly" }
    - { id: b, text: "Search-ADAccount -AccountDisabled -ComputersOnly" }
    - { id: c, text: "Get-ADUser -Filter 'Enabled -eq $false'" }
    - { id: d, text: "Search-ADAccount -AccountExpired -UsersOnly" }
    - { id: e, text: "Search-ADAccount -AccountDisabled -UsersOnly" }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "An account is disabled when its Enabled property is false. Search-ADAccount -AccountDisabled -UsersOnly returns the disabled accounts restricted to users, and Get-ADUser with a filter on Enabled returns the same user accounts."
    fr: "Un compte est désactivé lorsque sa propriété Enabled vaut false. Search-ADAccount -AccountDisabled -UsersOnly renvoie les comptes désactivés limités aux utilisateurs, et Get-ADUser avec un filtre sur Enabled renvoie les mêmes comptes d'utilisateur."
  options:
    a: { en: "A locked-out account is still enabled; lockout is a different state.", fr: "Un compte verrouillé reste activé ; le verrouillage est un autre état." }
    b: { en: "-ComputersOnly returns disabled computer accounts, not user accounts.", fr: "-ComputersOnly renvoie les comptes d'ordinateur désactivés, pas les comptes d'utilisateur." }
    d: { en: "An expired account has an expiration date in the past; it isn't necessarily disabled.", fr: "Un compte expiré a une date d'expiration passée ; il n'est pas forcément désactivé." }
references:
  - title: Search-ADAccount (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/search-adaccount
  - title: Get-ADUser (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-aduser
