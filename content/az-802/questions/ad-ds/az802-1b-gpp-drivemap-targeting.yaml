id: az802-1b-gpp-drivemap-targeting
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The user accounts of the **Sales** and **Finance** departments of **corp.contoso.com** are all in the **Staff** OU. Users of Sales are members of **G-Sales**, and users of Finance are members of **G-Finance**.

    You need drive **S:** to be mapped to `\\FS1\Sales` only for the members of G-Sales, and drive **F:** to be mapped to `\\FS1\Finance` only for the members of G-Finance. You must use a single GPO linked to the Staff OU and no script.

    What should you configure in the GPO?
  fr: |
    Les comptes d'utilisateur des services **Sales** et **Finance** de **corp.contoso.com** se trouvent tous dans l'UO **Staff**. Les utilisateurs de Sales sont membres de **G-Sales**, et ceux de Finance de **G-Finance**.

    Le lecteur **S:** doit être mappé sur `\\FS1\Sales` uniquement pour les membres de G-Sales, et le lecteur **F:** sur `\\FS1\Finance` uniquement pour les membres de G-Finance. Vous devez utiliser un seul GPO lié à l'UO Staff, sans script.

    Que devez-vous configurer dans le GPO ?
body:
  options:
    - { id: a, text: { en: "Two Drive Maps items, and security filtering on the GPO for G-Sales and G-Finance", fr: "Deux éléments Drive Maps, et un filtrage de sécurité du GPO pour G-Sales et G-Finance" } }
    - { id: b, text: { en: "Two Drive Maps items, and a WMI filter on the GPO", fr: "Deux éléments Drive Maps, et un filtre WMI sur le GPO" } }
    - { id: c, text: { en: "Two Drive Maps items under Computer Configuration, each with item-level targeting on an OU", fr: "Deux éléments Drive Maps sous Configuration ordinateur, chacun avec un ciblage au niveau de l'élément sur une UO" } }
    - { id: d, text: { en: "Two Drive Maps items under User Configuration, each with item-level targeting on a security group", fr: "Deux éléments Drive Maps sous Configuration utilisateur, chacun avec un ciblage au niveau de l'élément sur un groupe de sécurité" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Item-level targeting filters each preference item separately, so one GPO can hold several items aimed at different users. A Security Group targeting item applies the S: mapping only to G-Sales and the F: mapping only to G-Finance. Drive Maps is a user preference."
    fr: "Le ciblage au niveau de l'élément filtre chaque élément de préférence séparément : un seul GPO peut donc contenir plusieurs éléments destinés à des utilisateurs différents. Un élément de ciblage Groupe de sécurité applique le mappage S: uniquement à G-Sales et le mappage F: uniquement à G-Finance. Drive Maps est une préférence utilisateur."
  options:
    a: { en: "Security filtering applies to the whole GPO, so the members of both groups would receive both drives.", fr: "Le filtrage de sécurité s'applique au GPO entier : les membres des deux groupes recevraient les deux lecteurs." }
    b: { en: "A WMI filter also decides for the whole GPO, and it's evaluated on the computer, not on group membership.", fr: "Un filtre WMI décide lui aussi pour le GPO entier, et il est évalué sur l'ordinateur, pas sur l'appartenance aux groupes." }
    c: { en: "Drive Maps can be configured and applied only for users, and all the users are in the same OU.", fr: "Drive Maps ne peut être configuré et appliqué que pour les utilisateurs, et tous les utilisateurs sont dans la même UO." }
references:
  - title: Group Policy preferences in Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-preferences
