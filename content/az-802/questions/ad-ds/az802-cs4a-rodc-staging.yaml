id: az802-cs4a-rodc-staging
objective: "1.1.3"
type: dropdown
caseStudy: az802-cs4a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You sign in to DC2 as a member of T0-Admins. You need to create the RODC account for BSL-DC1 to meet the RODC requirements.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous vous connectez à DC2 en tant que membre de T0-Admins. Vous devez créer le compte RODC de BSL-DC1 pour satisfaire les exigences relatives au RODC.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Add-ADDSReadOnlyDomainControllerAccount -DomainControllerAccountName "BSL-DC1" `
        -DomainName "treyresearch.com" `
        -SiteName [[site]] `
        -DelegatedAdministratorAccountName [[deleg]] `
        -AllowPasswordReplicationAccountName [[allow]]
  slots:
    - id: site
      options:
        - { id: basel, text: '"Basel"' }
        - { id: boston, text: '"Boston"' }
        - { id: dfsn, text: '"Default-First-Site-Name"' }
    - id: deleg
      options:
        - { id: itsup, text: '"TREYRESEARCH\Basel-ITSupport"' }
        - { id: srvops, text: '"BUILTIN\Server Operators"' }
        - { id: dadm, text: '"TREYRESEARCH\Domain Admins"' }
        - { id: t0, text: '"TREYRESEARCH\T0-Admins"' }
    - id: allow
      options:
        - { id: scicomp, text: '"TREYRESEARCH\Basel-Scientists","TREYRESEARCH\Basel-Computers"' }
        - { id: sci, text: '"TREYRESEARCH\Basel-Scientists"' }
        - { id: arpg, text: '"TREYRESEARCH\Allowed RODC Password Replication Group"' }
        - { id: sciit, text: '"TREYRESEARCH\Basel-Scientists","TREYRESEARCH\Basel-ITSupport"' }
answer:
  values: { site: basel, deleg: itsup, allow: scicomp }
explanation:
  correct:
    en: |
      In a staged installation, the domain controller options, including the site, the delegated administrator and the password replication policy, are fixed when the account is created and cannot be changed during the attach phase, so the account must target the Basel site. The delegated administrator receives local administrative rights on the RODC only, without membership of Domain Admins or of the built-in Administrators group, and can attach the server to the account. The allowed list must contain both Basel-Scientists and Basel-Computers so that users and workstations can have their passwords cached.
    fr: |
      Dans une installation intermédiaire, les options du contrôleur de domaine, notamment le site, l'administrateur délégué et la stratégie de réplication de mot de passe, sont fixées à la création du compte et ne peuvent pas être modifiées pendant la phase d'attachement : le compte doit donc cibler le site Basel. L'administrateur délégué reçoit des droits d'administration locaux sur le RODC uniquement, sans appartenir à Domain Admins ni au groupe Administrators intégré, et peut attacher le serveur au compte. La liste des comptes autorisés doit contenir Basel-Scientists et Basel-Computers pour que les utilisateurs et les postes de travail puissent avoir leur mot de passe mis en cache.
  options:
    boston: { en: "BSL-DC1 is in Basel; the site set at staging cannot be changed when the server is attached.", fr: "BSL-DC1 se trouve à Bâle ; le site défini lors de la création du compte ne peut pas être modifié à l'attachement du serveur." }
    dfsn: { en: "Default-First-Site-Name is not one of the three sites of the forest and does not match the location of BSL-DC1.", fr: "Default-First-Site-Name ne fait pas partie des trois sites de la forêt et ne correspond pas à l'emplacement de BSL-DC1." }
    srvops: { en: "Server Operators is a domain-wide administrative group that is denied by the default password replication policy; it is not a delegated RODC administrator.", fr: "Server Operators est un groupe d'administration de tout le domaine, refusé par la stratégie de réplication de mot de passe par défaut ; ce n'est pas un administrateur délégué du RODC." }
    dadm: { en: "Domain Admins members can already administer every domain controller; the requirement is to delegate to Basel-ITSupport without domain rights.", fr: "Les membres de Domain Admins peuvent déjà administrer tous les contrôleurs de domaine ; l'exigence est de déléguer à Basel-ITSupport sans droits sur le domaine." }
    t0: { en: "T0-Admins members are already domain administrators; delegating to them does not let the Basel technicians install or manage BSL-DC1.", fr: "Les membres de T0-Admins sont déjà administrateurs du domaine ; leur déléguer l'administration ne permet pas aux techniciens de Bâle d'installer ou de gérer BSL-DC1." }
    sci: { en: "Without Basel-Computers, the passwords of the Basel workstations cannot be cached, and the workstations depend on a writable domain controller across the VPN.", fr: "Sans Basel-Computers, les mots de passe des postes de travail de Bâle ne peuvent pas être mis en cache, et les postes dépendent d'un contrôleur de domaine accessible en écriture via le VPN." }
    arpg: { en: "This built-in group applies to every RODC of the domain, and the case does not list Basel-Scientists or Basel-Computers among its members.", fr: "Ce groupe intégré s'applique à tous les RODC du domaine, et le cas ne cite pas Basel-Scientists ni Basel-Computers parmi ses membres." }
    sciit: { en: "Basel-ITSupport members must not have their passwords cached, and Basel-Computers is missing.", fr: "Les mots de passe des membres de Basel-ITSupport ne doivent pas être mis en cache, et Basel-Computers est absent." }
references:
  - title: Install a Windows Server 2012 Active Directory Read-Only Domain Controller (RODC) (Level 200)
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/rodc/install-a-windows-server-2012-active-directory-read-only-domain-controller--rodc---level-200-
  - title: Add-ADDomainControllerPasswordReplicationPolicy (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/add-addomaincontrollerpasswordreplicationpolicy
