id: az802-1b-svc-kds-wait
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The **corp.contoso.com** domain has 12 domain controllers in four sites, and intersite replication runs every 180 minutes. No KDS root key existed in the forest.

    On **DC1** in the Paris site, you run `Add-KdsRootKey -EffectiveImmediately`, and then you create the gMSA **svc-app** with the **APP-Hosts** group as `-PrincipalsAllowedToRetrieveManagedPassword`. Twenty minutes later, `Install-ADServiceAccount -Identity svc-app` fails on **APP2**, a member of APP-Hosts in the Lyon site that authenticates to a Lyon domain controller.

    What should you do?
  fr: |
    Le domaine **corp.contoso.com** compte 12 contrôleurs de domaine répartis sur quatre sites, et la réplication intersite s'exécute toutes les 180 minutes. Aucune clé racine KDS n'existait dans la forêt.

    Sur **DC1**, dans le site Paris, vous exécutez `Add-KdsRootKey -EffectiveImmediately`, puis vous créez le gMSA **svc-app** avec le groupe **APP-Hosts** comme `-PrincipalsAllowedToRetrieveManagedPassword`. Vingt minutes plus tard, `Install-ADServiceAccount -Identity svc-app` échoue sur **APP2**, un membre de APP-Hosts situé dans le site Lyon qui s'authentifie auprès d'un contrôleur de domaine de Lyon.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run Add-KdsRootKey -EffectiveTime ((Get-Date).AddHours(-10)) on DC1, and then retry the installation.", fr: "Exécuter Add-KdsRootKey -EffectiveTime ((Get-Date).AddHours(-10)) sur DC1, puis relancer l'installation." } }
    - { id: b, text: { en: "Run Reset-ADServiceAccountPassword -Identity svc-app on APP2, and then retry the installation.", fr: "Exécuter Reset-ADServiceAccountPassword -Identity svc-app sur APP2, puis relancer l'installation." } }
    - { id: c, text: { en: "Recreate svc-app by running New-ADServiceAccount with -RestrictToSingleComputer.", fr: "Recréer svc-app en exécutant New-ADServiceAccount avec -RestrictToSingleComputer." } }
    - { id: d, text: { en: "Wait until the KDS root key has replicated to all the domain controllers, and then retry the installation.", fr: "Attendre que la clé racine KDS soit répliquée vers tous les contrôleurs de domaine, puis relancer l'installation." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With -EffectiveImmediately, the root key is usable at once only on the DC where it was created; the other DCs can use it only after AD replication delivers it, which can take hours with a 180-minute interval. In production, domain controllers wait up to 10 hours after the key's creation precisely so that it converges everywhere, so you wait and retry."
    fr: "Avec -EffectiveImmediately, la clé racine n'est utilisable immédiatement que sur le DC où elle a été créée ; les autres DC ne peuvent l'utiliser qu'une fois qu'elle leur a été répliquée, ce qui peut prendre des heures avec un intervalle de 180 minutes. En production, les contrôleurs de domaine attendent jusqu'à 10 heures après la création de la clé justement pour qu'elle converge partout : vous attendez, puis vous réessayez."
  options:
    a: { en: "Back-dating the key is meant for a test environment with a single DC; it doesn't make the key reach the Lyon DCs any sooner.", fr: "Antidater la clé est prévu pour un environnement de test à un seul DC ; cela ne fait pas arriver la clé plus vite sur les DC de Lyon." }
    b: { en: "Reset-ADServiceAccountPassword applies only to standalone managed service accounts, not to gMSAs.", fr: "Reset-ADServiceAccountPassword ne s'applique qu'aux comptes de service administrés autonomes, pas aux gMSA." }
    c: { en: "A standalone MSA works on one computer only, and the account is meant for all the APP-Hosts servers.", fr: "Un MSA autonome ne fonctionne que sur un seul ordinateur, alors que le compte est destiné à tous les serveurs de APP-Hosts." }
references:
