id: az802-1b-gpp-first-available
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Two GPOs, **Drives-Team** and **Drives-Projects**, apply to the users of **corp.contoso.com**. Each contains a Drive Maps item with the action **Update** and the drive letter option **Use first available, starting at: E**.

    Since the GPOs were deployed, users report two problems: the drives **H:** and **M:** that they mapped manually disappear after they sign in, and only one of the two GPP drive mappings is present.

    You need users to keep their manual mappings and receive both GPP drive mappings.

    What should you do?
  fr: |
    Deux GPO, **Drives-Team** et **Drives-Projects**, s'appliquent aux utilisateurs de **corp.contoso.com**. Chacun contient un élément Drive Maps avec l'action **Update** et l'option de lettre de lecteur **Use first available, starting at: E**.

    Depuis le déploiement des GPO, les utilisateurs signalent deux problèmes : les lecteurs **H:** et **M:** qu'ils ont mappés manuellement disparaissent après leur connexion, et un seul des deux mappages GPP est présent.

    Les utilisateurs doivent conserver leurs mappages manuels et recevoir les deux mappages GPP.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Configure each Drive Maps item to use a specific drive letter.", fr: "Configurer chaque élément Drive Maps pour qu'il utilise une lettre de lecteur précise." } }
    - { id: b, text: { en: "Change the action of both Drive Maps items to Create.", fr: "Changer l'action des deux éléments Drive Maps en Create." } }
    - { id: c, text: { en: "Move both Drive Maps items into a single GPO.", fr: "Déplacer les deux éléments Drive Maps dans un seul GPO." } }
    - { id: d, text: { en: "Select Run in logged-on user's security context on both items.", fr: "Sélectionner Run in logged-on user's security context sur les deux éléments." } }
answer: { optionId: a }
explanation:
  correct:
    en: "With Use first available, starting at, the Drive Maps extension clears all the mapped drives from that letter onward before mapping, which removes H:, M: and the mapping created by the other GPO. Assigning a specific letter to each item stops this clearing, so any number of GPP drive map policies can apply without losing manual or GPP mappings."
    fr: "Avec Use first available, starting at, l'extension Drive Maps efface tous les lecteurs mappés à partir de cette lettre avant de mapper, ce qui supprime H:, M: et le mappage créé par l'autre GPO. Attribuer une lettre précise à chaque élément supprime cet effacement : autant de stratégies de mappage GPP que nécessaire peuvent s'appliquer sans perdre les mappages manuels ou GPP."
  options:
    b: { en: "The clearing comes from the drive letter option, not from the action.", fr: "L'effacement vient de l'option de lettre de lecteur, pas de l'action." }
    c: { en: "With a single GPO, both GPP drives would be kept, but H: and M: come after E and would still be cleared.", fr: "Avec un seul GPO, les deux lecteurs GPP seraient conservés, mais H: et M: viennent après E et seraient toujours effacés." }
    d: { en: "Drive Maps already uses the user's security context; this doesn't change which drives are cleared.", fr: "Drive Maps utilise déjà le contexte de sécurité de l'utilisateur ; cela ne change pas les lecteurs effacés." }
references:
  - title: Manual drive mappings are removed
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/group-policy/manual-drive-mappings-removed
  - title: Group Policy preferences in Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-preferences
