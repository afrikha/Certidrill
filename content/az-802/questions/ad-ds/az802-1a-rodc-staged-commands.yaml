id: az802-1a-rodc-staged-commands
objective: "1.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You need to deploy a read-only domain controller named **RODC5** in an existing site named **Nantes** of the **corp.fabrikam.com** domain by using a staged installation. A domain administrator will create the account from **DC1**. A local technician named Tech5, who is not a domain administrator, will then promote a workgroup server named RODC5 by using the account.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez déployer un contrôleur de domaine en lecture seule nommé **RODC5** dans un site existant nommé **Nantes** du domaine **corp.fabrikam.com** par une installation intermédiaire. Un administrateur du domaine créera le compte depuis **DC1**. Un technicien local nommé Tech5, qui n'est pas administrateur du domaine, promouvra ensuite un serveur de groupe de travail nommé RODC5 en utilisant ce compte.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    # On DC1
    [[stage]] -DomainControllerAccountName RODC5 -DomainName corp.fabrikam.com -SiteName Nantes -DelegatedAdministratorAccountName "FABRIKAM\Tech5"

    # On RODC5
    Install-WindowsFeature -Name AD-Domain-Services -IncludeManagementTools
    Install-ADDSDomainController -DomainName corp.fabrikam.com -Credential (Get-Credential "FABRIKAM\Tech5") [[attach]]
  slots:
    - id: stage
      options:
        - { id: add, text: Add-ADDSReadOnlyDomainControllerAccount }
        - { id: test, text: Test-ADDSReadOnlyDomainControllerAccountCreation }
        - { id: newcomp, text: New-ADComputer }
        - { id: inst, text: Install-ADDSDomainController }
    - id: attach
      options:
        - { id: existing, text: -UseExistingAccount }
        - { id: ro, text: -ReadOnlyReplica }
        - { id: reinstall, text: -AllowDomainControllerReinstall }
        - { id: critical, text: -CriticalReplicationOnly }
answer:
  values: { stage: add, attach: existing }
explanation:
  correct:
    en: "Add-ADDSReadOnlyDomainControllerAccount creates the unoccupied RODC account with its site and delegated administrator. On the server, which must have the same name, Install-ADDSDomainController -UseExistingAccount attaches it to that account; the delegated administrator is allowed to run this step."
    fr: "Add-ADDSReadOnlyDomainControllerAccount crée le compte de RODC inoccupé avec son site et son administrateur délégué. Sur le serveur, qui doit porter le même nom, Install-ADDSDomainController -UseExistingAccount l'attache à ce compte ; l'administrateur délégué est autorisé à exécuter cette étape."
  options:
    test: { en: "This cmdlet only runs the prerequisite checks; it does not create the account.", fr: "Cette applet de commande exécute seulement les vérifications des prérequis ; elle ne crée pas le compte." }
    newcomp: { en: "A plain computer account is not an RODC account with an NTDS Settings object and a password replication policy.", fr: "Un simple compte d'ordinateur n'est pas un compte de RODC avec un objet NTDS Settings et une stratégie de réplication de mot de passe." }
    ro: { en: "-ReadOnlyReplica performs an unstaged RODC installation and requires Domain Admins rights; it does not use the staged account.", fr: "-ReadOnlyReplica effectue une installation de RODC non intermédiaire et exige les droits Domain Admins ; il n'utilise pas le compte créé à l'avance." }
references:
  - title: Install a Windows Server 2012 Active Directory Read-Only Domain Controller (RODC) (Level 200)
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/rodc/install-a-windows-server-2012-active-directory-read-only-domain-controller--rodc---level-200-
