id: az802-1a-rodc-tools-dragdrop
objective: "1.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You manage the deployment of read-only domain controllers (RODCs) in the **adatum.com** forest.

    Which tool should you use for each task? To answer, drag the appropriate tools to the correct tasks. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez le déploiement des contrôleurs de domaine en lecture seule (RODC) dans la forêt **adatum.com**.

    Quel outil devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les outils appropriés vers les tâches correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: adprep, text: adprep /rodcprep }
    - { id: dsmgmt, text: dsmgmt }
    - { id: test, text: Test-ADDSReadOnlyDomainControllerAccountCreation }
    - { id: newsite, text: New-ADReplicationSite }
    - { id: addacct, text: Add-ADDSReadOnlyDomainControllerAccount }
    - { id: ntdsutil, text: ntdsutil }
  targets:
    - { id: t1, text: { en: "Prepare a forest that has never had an RODC before attaching a staged RODC", fr: "Préparer une forêt qui n'a jamais eu de RODC avant d'attacher un RODC créé à l'avance" } }
    - { id: t2, text: { en: "Change the local administrator role separation of an RODC that is already promoted", fr: "Modifier la séparation des rôles d'administrateur local d'un RODC déjà promu" } }
    - { id: t3, text: { en: "Run the prerequisite checks for staging an RODC account without creating anything", fr: "Exécuter les vérifications des prérequis de la création à l'avance d'un compte de RODC sans rien créer" } }
    - { id: t4, text: { en: "Create the AD DS site that a staged RODC account will reference", fr: "Créer le site AD DS que référencera un compte de RODC créé à l'avance" } }
answer:
  mapping: { t1: adprep, t2: dsmgmt, t3: test, t4: newsite }
explanation:
  correct:
    en: adprep /rodcprep prepares the forest, which the staging process does not do automatically. Administrator role separation is set during promotion or later with dsmgmt. The Test-ADDS* cmdlets run only the prerequisite checks. New-ADReplicationSite creates the site, because the staging and installation cmdlets require an existing site.
    fr: adprep /rodcprep prépare la forêt, ce que le processus de création à l'avance ne fait pas automatiquement. La séparation des rôles d'administrateur se définit pendant la promotion ou plus tard avec dsmgmt. Les applets de commande Test-ADDS* exécutent seulement les vérifications des prérequis. New-ADReplicationSite crée le site, car les applets de commande de création à l'avance et d'installation exigent un site existant.
  options:
    addacct: { en: "Add-ADDSReadOnlyDomainControllerAccount creates the staged account; it is not a check-only command and does not create sites.", fr: "Add-ADDSReadOnlyDomainControllerAccount crée le compte intermédiaire ; ce n'est pas une commande de vérification et elle ne crée pas de site." }
    ntdsutil: { en: "ntdsutil manages the directory database (roles, metadata cleanup, IFM); it is not used for these tasks.", fr: "ntdsutil gère la base de données de l'annuaire (rôles, nettoyage des métadonnées, IFM) ; il ne sert pas à ces tâches." }
references:
  - title: Install a Windows Server 2012 Active Directory Read-Only Domain Controller (RODC) (Level 200)
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/rodc/install-a-windows-server-2012-active-directory-read-only-domain-controller--rodc---level-200-
  - title: Deploy Active Directory Domain Services domain controllers
    url: https://learn.microsoft.com/en-us/training/modules/deploy-manage-active-directory-domain-services-domain-controllers/4-deploy-active-directory-domain-services-controllers
