id: az802-1b-repl-behavior
objective: "1.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    The **contoso.com** forest contains the domains **contoso.com** and **eu.contoso.com**. The following domain controllers exist:

    | Name | Domain | Site | Global catalog |
    | --- | --- | --- | --- |
    | DC1 | contoso.com | Paris | Yes |
    | DC2 | contoso.com | Paris | Yes |
    | DC5 | eu.contoso.com | Berlin | No |

    No replication setting was changed from its default value.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    La forêt **contoso.com** contient les domaines **contoso.com** et **eu.contoso.com**. Les contrôleurs de domaine suivants existent :

    | Nom | Domaine | Site | Catalogue global |
    | --- | --- | --- | --- |
    | DC1 | contoso.com | Paris | Oui |
    | DC2 | contoso.com | Paris | Oui |
    | DC5 | eu.contoso.com | Berlin | Non |

    Aucun paramètre de réplication n'a été modifié par rapport à sa valeur par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When an administrator changes an object on DC1, DC1 notifies DC2 of the change about 15 seconds later.
        fr: Lorsqu'un administrateur modifie un objet sur DC1, DC1 notifie DC2 de la modification environ 15 secondes plus tard.
    - id: s2
      text:
        en: A change to a site link made on DC1 is replicated to DC5.
        fr: Une modification d'un lien de sites effectuée sur DC1 est répliquée vers DC5.
    - id: s3
      text:
        en: A change to the attributes of a user account of contoso.com made on DC1 is replicated to DC5.
        fr: Une modification des attributs d'un compte d'utilisateur de contoso.com effectuée sur DC1 est répliquée vers DC5.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Inside a site, a domain controller waits 15 seconds by default after a change before it notifies its first partner, then 3 seconds between partners. Site links are stored in the configuration partition, which every domain controller of the forest holds. The contoso.com domain partition is held in full only by the DCs of contoso.com, and as a partial read-only replica by global catalogs; DC5 is neither.
    fr: "À l'intérieur d'un site, un contrôleur de domaine attend par défaut 15 secondes après une modification avant de notifier son premier partenaire, puis 3 secondes entre les partenaires. Les liens de sites sont stockés dans la partition de configuration, que détient chaque contrôleur de domaine de la forêt. La partition du domaine contoso.com n'est détenue en entier que par les DC de contoso.com, et sous forme de réplica partiel en lecture seule par les catalogues globaux ; DC5 n'est ni l'un ni l'autre."
references:
  - title: Modify the default intra-site DC replication interval
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/modify-default-intra-site-dc-replication-interval
  - title: Active Directory Replication Concepts
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/replication/active-directory-replication-concepts
