id: az802-1b-usr-inactive-dropdown
objective: "1.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    The **Contractors** OU of the **corp.contoso.com** domain contains user and computer accounts.

    You need to disable every user account in the Contractors OU that hasn't signed in during the last 60 days. Computer accounts must not be affected, and the accounts must remain in the directory.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'UO **Contractors** du domaine **corp.contoso.com** contient des comptes d'utilisateur et des comptes d'ordinateur.

    Vous devez désactiver chaque compte d'utilisateur de l'UO Contractors qui ne s'est pas connecté au cours des 60 derniers jours. Les comptes d'ordinateur ne doivent pas être concernés, et les comptes doivent rester dans l'annuaire.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Search-ADAccount [[cond]] -TimeSpan 60.00:00:00 -UsersOnly `
      -SearchBase "OU=Contractors,DC=corp,DC=contoso,DC=com" |
      [[act]]
  slots:
    - id: cond
      options:
        - { id: inactive, text: -AccountInactive }
        - { id: expiring, text: -AccountExpiring }
        - { id: expired, text: -AccountExpired }
        - { id: pwd, text: -PasswordExpired }
    - id: act
      options:
        - { id: disable, text: Disable-ADAccount }
        - { id: remove, text: Remove-ADUser }
        - { id: expire, text: Set-ADAccountExpiration }
        - { id: unlock, text: Unlock-ADAccount }
answer:
  values: { cond: inactive, act: disable }
explanation:
  correct:
    en: "-AccountInactive with -TimeSpan returns the accounts that haven't signed in during the interval, and -UsersOnly excludes computer accounts. Piping the result to Disable-ADAccount disables each account without deleting it."
    fr: "-AccountInactive avec -TimeSpan renvoie les comptes qui ne se sont pas connectés pendant l'intervalle, et -UsersOnly exclut les comptes d'ordinateur. Envoyer le résultat dans le pipeline vers Disable-ADAccount désactive chaque compte sans le supprimer."
  options:
    expiring: { en: "-AccountExpiring finds accounts whose expiration date falls within the interval, not inactive accounts.", fr: "-AccountExpiring trouve les comptes dont la date d'expiration tombe dans l'intervalle, pas les comptes inactifs." }
    expired: { en: "-AccountExpired finds accounts whose expiration date is already past.", fr: "-AccountExpired trouve les comptes dont la date d'expiration est déjà passée." }
    pwd: { en: "-PasswordExpired finds accounts with an expired password, which says nothing about sign-in activity.", fr: "-PasswordExpired trouve les comptes dont le mot de passe a expiré, ce qui n'indique rien sur l'activité de connexion." }
    remove: { en: "Remove-ADUser deletes the accounts; they must stay in the directory.", fr: "Remove-ADUser supprime les comptes ; ils doivent rester dans l'annuaire." }
    expire: { en: "Set-ADAccountExpiration sets an end date; it doesn't disable the accounts now.", fr: "Set-ADAccountExpiration définit une date de fin ; il ne désactive pas les comptes maintenant." }
    unlock: { en: "Unlock-ADAccount clears a lockout; it doesn't disable anything.", fr: "Unlock-ADAccount lève un verrouillage ; il ne désactive rien." }
references:
  - title: Search-ADAccount (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/search-adaccount
  - title: Disable-ADAccount (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/disable-adaccount
