id: az802-1b-xdom-nesting-multi
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The **contoso.com** forest contains the domains **contoso.com** and **eu.contoso.com**. A two-way forest trust exists between contoso.com and the **fabrikam.com** forest. **G-EU-Sales** is a global security group of eu.contoso.com.

    Which two groups can have G-EU-Sales as a member?

    NOTE: Each correct selection is worth one point.
  fr: |
    La forêt **contoso.com** contient les domaines **contoso.com** et **eu.contoso.com**. Une approbation de forêt bidirectionnelle existe entre contoso.com et la forêt **fabrikam.com**. **G-EU-Sales** est un groupe de sécurité global de eu.contoso.com.

    Quels sont les deux groupes qui peuvent avoir G-EU-Sales comme membre ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A global group of contoso.com", fr: "Un groupe global de contoso.com" } }
    - { id: b, text: { en: "A universal group of fabrikam.com", fr: "Un groupe universel de fabrikam.com" } }
    - { id: c, text: { en: "A universal group of contoso.com", fr: "Un groupe universel de contoso.com" } }
    - { id: d, text: { en: "A global group of fabrikam.com", fr: "Un groupe global de fabrikam.com" } }
    - { id: e, text: { en: "A domain local group of contoso.com", fr: "Un groupe local de domaine de contoso.com" } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: A universal group can contain global groups from any domain of its forest, and a domain local group can contain global groups from any domain or trusted domain. Both groups of contoso.com can therefore contain G-EU-Sales.
    fr: Un groupe universel peut contenir des groupes globaux de n'importe quel domaine de sa forêt, et un groupe local de domaine peut contenir des groupes globaux de n'importe quel domaine ou domaine approuvé. Les deux groupes de contoso.com peuvent donc contenir G-EU-Sales.
  options:
    a: { en: "A global group contains only global groups of its own domain; G-EU-Sales belongs to eu.contoso.com.", fr: "Un groupe global ne contient que des groupes globaux de son propre domaine ; G-EU-Sales appartient à eu.contoso.com." }
    b: { en: "A universal group contains only groups of its own forest; fabrikam.com is another forest.", fr: "Un groupe universel ne contient que des groupes de sa propre forêt ; fabrikam.com est une autre forêt." }
    d: { en: "A global group of fabrikam.com is limited to its own domain.", fr: "Un groupe global de fabrikam.com est limité à son propre domaine." }
references:
  - title: Active Directory Security Groups
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-groups
