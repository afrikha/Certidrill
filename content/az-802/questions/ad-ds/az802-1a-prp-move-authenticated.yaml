id: az802-1a-prp-move-authenticated
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A read-only domain controller named **RODC3** has been in production for two months. Its Allowed list contains only the Allowed RODC Password Replication Group, which has no members. You created an empty global group named **Branch3-Cache**.

    You need to make the passwords of all the accounts that have already authenticated through RODC3 cacheable on RODC3 by making those accounts members of Branch3-Cache and adding Branch3-Cache to the Allowed list of RODC3. The solution must minimize administrative effort.

    Which command should you run?
  fr: |
    Un contrôleur de domaine en lecture seule nommé **RODC3** est en production depuis deux mois. Sa liste Autorisés ne contient que le groupe Allowed RODC Password Replication Group, qui n'a aucun membre. Vous avez créé un groupe global vide nommé **Branch3-Cache**.

    Vous devez permettre la mise en cache sur RODC3 des mots de passe de tous les comptes qui se sont déjà authentifiés via RODC3, en faisant de ces comptes des membres de Branch3-Cache et en ajoutant Branch3-Cache à la liste Autorisés de RODC3. La solution doit réduire au minimum l'effort d'administration.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "Add-ADDomainControllerPasswordReplicationPolicy -Identity RODC3 -AllowedList Branch3-Cache" }
    - { id: b, text: "repadmin /rodcpwdrepl RODC3 DC1 CN=Branch3-Cache,OU=Groups,DC=corp,DC=contoso,DC=com" }
    - { id: c, text: "Get-ADDomainControllerPasswordReplicationPolicyUsage -Identity RODC3 -RevealedAccounts | Add-ADGroupMember -Identity Branch3-Cache" }
    - { id: d, text: "repadmin /prp move RODC3 Branch3-Cache" }
answer: { optionId: d }
explanation:
  correct:
    en: repadmin /prp move takes the principals of the Authenticated to list of the RODC, adds them to the specified group and adds that group to the Allowed list, in a single operation.
    fr: repadmin /prp move prend les principaux de la liste Authentifiés auprès de du RODC, les ajoute au groupe indiqué et ajoute ce groupe à la liste Autorisés, en une seule opération.
  options:
    a: { en: "This adds the group to the Allowed list, but the group stays empty, so no account becomes cacheable.", fr: "Cela ajoute le groupe à la liste Autorisés, mais le groupe reste vide : aucun mot de passe ne peut être mis en cache." }
    b: { en: "repadmin /rodcpwdrepl triggers the replication of passwords to the RODC; it changes neither group membership nor the Allowed list.", fr: "repadmin /rodcpwdrepl déclenche la réplication de mots de passe vers le RODC ; il ne modifie ni l'appartenance aux groupes ni la liste Autorisés." }
    c: { en: "The revealed accounts are those whose passwords are already cached, almost none here, and the group would still not be in the Allowed list.", fr: "Les comptes révélés sont ceux dont les mots de passe sont déjà en cache, presque aucun ici, et le groupe ne serait toujours pas dans la liste Autorisés." }
references:
  - title: Repadmin /prp
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc835090(v=ws.11)
