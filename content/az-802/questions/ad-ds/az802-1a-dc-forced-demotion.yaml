id: az802-1a-dc-forced-demotion
objective: "1.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    The **corp.fabrikam.com** domain has three domain controllers named DC1, DC2 and DC3. DC4 was a fourth domain controller that holds the RID master role. DC4 was isolated in a remote site, could no longer contact any other domain controller, and was demoted by running the following command on DC4:

    `Uninstall-ADDSDomainController -ForceRemoval $true -DemoteOperationMasterRole $true`

    DC4 will never return as a domain controller. You need to restore a healthy state for the domain.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le domaine **corp.fabrikam.com** possède trois contrôleurs de domaine nommés DC1, DC2 et DC3. DC4 était un quatrième contrôleur de domaine qui détient le rôle de maître RID. DC4 a été isolé dans un site distant, ne pouvait plus contacter aucun autre contrôleur de domaine et a été rétrogradé en exécutant la commande suivante sur DC4 :

    `Uninstall-ADDSDomainController -ForceRemoval $true -DemoteOperationMasterRole $true`

    DC4 ne redeviendra jamais contrôleur de domaine. Vous devez rétablir un état sain pour le domaine.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Seize the RID master role on DC1.", fr: "Prendre de force le rôle de maître RID sur DC1." } }
    - { id: b, text: { en: "Transfer the RID master role from DC4 to DC1 by using Active Directory Users and Computers.", fr: "Transférer le rôle de maître RID de DC4 vers DC1 à l'aide de Utilisateurs et ordinateurs Active Directory." } }
    - { id: c, text: { en: "Clean up the metadata of DC4 from Active Directory.", fr: "Nettoyer les métadonnées de DC4 dans Active Directory." } }
    - { id: d, text: { en: "Perform an authoritative restore of the DC4 computer object on DC1.", fr: "Effectuer une restauration faisant autorité de l'objet ordinateur de DC4 sur DC1." } }
    - { id: e, text: { en: "Run Uninstall-ADDSDomainController -LastDomainControllerInDomain $true on DC1.", fr: "Exécuter Uninstall-ADDSDomainController -LastDomainControllerInDomain $true sur DC1." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: A forced demotion leaves orphaned metadata on the remaining domain controllers and does not hand over the roles that the server held. You must seize those roles from another domain controller immediately after the forced demotion and manually perform metadata cleanup for DC4.
    fr: Une rétrogradation forcée laisse des métadonnées orphelines sur les contrôleurs de domaine restants et ne cède pas les rôles que détenait le serveur. Vous devez prendre de force ces rôles depuis un autre contrôleur de domaine juste après la rétrogradation forcée et effectuer manuellement le nettoyage des métadonnées de DC4.
  options:
    b: { en: "A transfer needs the current role holder online and reachable; DC4 is no longer a domain controller.", fr: "Un transfert exige que le détenteur actuel du rôle soit en ligne et joignable ; DC4 n'est plus contrôleur de domaine." }
    d: { en: "Restoring the computer object of a removed domain controller would bring back the stale metadata instead of removing it.", fr: "Restaurer l'objet ordinateur d'un contrôleur de domaine supprimé réintroduirait les métadonnées obsolètes au lieu de les supprimer." }
    e: { en: "This parameter removes the last domain controller and the domain itself; DC1 is not the last domain controller.", fr: "Ce paramètre supprime le dernier contrôleur de domaine et le domaine lui-même ; DC1 n'est pas le dernier contrôleur de domaine." }
references:
  - title: Demote domain controllers and domains
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/demoting-domain-controllers-and-domains--level-200-
  - title: Transfer or seize Operation Master roles
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/transfer-or-seize-operation-master-roles-in-ad-ds
