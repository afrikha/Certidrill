id: az802-1b-usr-distribution-security
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The **corp.contoso.com** domain has a universal distribution group named **Marketing-News** that contains 120 user accounts and is used only to send email.

    You need to grant the members of Marketing-News the Read permission on the shared folder `\\FS1\Campaigns`. The solution must minimize administrative effort.

    What should you do first?
  fr: |
    Le domaine **corp.contoso.com** possède un groupe de distribution universel nommé **Marketing-News**, qui contient 120 comptes d'utilisateur et sert uniquement à envoyer des e-mails.

    Vous devez accorder aux membres de Marketing-News l'autorisation Lecture sur le dossier partagé `\\FS1\Campaigns`. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Change the scope of Marketing-News to Domain local.", fr: "Changer l'étendue de Marketing-News en Domaine local." } }
    - { id: b, text: { en: "Change the group type of Marketing-News to Security.", fr: "Changer le type du groupe Marketing-News en Sécurité." } }
    - { id: c, text: { en: "Create a security group and add the 120 user accounts to it.", fr: "Créer un groupe de sécurité et y ajouter les 120 comptes d'utilisateur." } }
    - { id: d, text: { en: "Add Marketing-News to the Domain Users group.", fr: "Ajouter Marketing-News au groupe Domain Users." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Distribution groups aren't security-enabled, so they can't appear in DACLs. Converting Marketing-News to a security group (for example with Set-ADGroup -GroupCategory Security) keeps its members, and the group can still be used for email, then you can grant it Read on the share."
    fr: "Les groupes de distribution ne sont pas activés pour la sécurité : ils ne peuvent pas figurer dans les DACL. Convertir Marketing-News en groupe de sécurité (par exemple avec Set-ADGroup -GroupCategory Security) conserve ses membres, le groupe peut toujours servir pour les e-mails, et vous pouvez ensuite lui accorder la Lecture sur le partage."
  options:
    a: { en: "The scope doesn't make a group security-enabled; a domain local distribution group still can't be used in a DACL.", fr: "L'étendue ne rend pas un groupe activé pour la sécurité : un groupe de distribution local de domaine ne peut toujours pas figurer dans une DACL." }
    c: { en: "It works, but recreating the membership of 120 users is more effort than converting the existing group.", fr: "Cela fonctionne, mais recréer l'appartenance de 120 utilisateurs demande plus d'effort que convertir le groupe existant." }
    d: { en: "Domain Users already contains all the users of the domain; the permission must target only the Marketing-News members.", fr: "Domain Users contient déjà tous les utilisateurs du domaine ; l'autorisation ne doit viser que les membres de Marketing-News." }
references:
  - title: Active Directory Security Groups
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-groups
