id: az802-1a-trust-types-facts
objective: "1.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are documenting the trust relationships that the **litware.com** forest uses or might use.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous documentez les relations d'approbation que la forêt **litware.com** utilise ou pourrait utiliser.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An external trust between litware.com and a domain of another forest is transitive.
        fr: Une approbation externe entre litware.com et un domaine d'une autre forêt est transitive.
    - id: s2
      text:
        en: When you add a new domain tree to the litware.com forest, a two-way transitive tree-root trust is created automatically.
        fr: Lorsque vous ajoutez une nouvelle arborescence de domaines à la forêt litware.com, une approbation d'arborescence racine bidirectionnelle et transitive est créée automatiquement.
    - id: s3
      text:
        en: A realm trust with a non-Windows Kerberos realm can be configured as transitive or nontransitive.
        fr: Une approbation de domaine Kerberos avec un domaine Kerberos non Windows peut être configurée comme transitive ou non transitive.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: External trusts are nontransitive and give access to a single domain in another forest. Parent-child and tree-root trusts are created automatically, two-way and transitive. A realm trust with a non-Windows Kerberos realm, such as an MIT Kerberos realm, can be one-way or two-way and transitive or nontransitive.
    fr: Les approbations externes sont non transitives et donnent accès à un seul domaine d'une autre forêt. Les approbations parent-enfant et d'arborescence racine sont créées automatiquement, bidirectionnelles et transitives. Une approbation de domaine Kerberos avec un domaine Kerberos non Windows, comme un domaine MIT Kerberos, peut être unidirectionnelle ou bidirectionnelle, transitive ou non transitive.
references:
  - title: "Trust types: Active Directory"
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2003/cc775736(v=ws.10)
