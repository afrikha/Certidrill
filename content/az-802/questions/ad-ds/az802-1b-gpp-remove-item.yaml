id: az802-1b-gpp-remove-item
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The **App-Config** GPO is linked to the **Sales** OU of **corp.contoso.com**. It contains a User Configuration Registry preference item that sets the value `HKCU\Software\Contoso\App\Server` to **SQL1**. The users don't have roaming profiles.

    Next month you will unlink App-Config from the Sales OU. When the GPO no longer applies to a user, the value must be removed from that user's registry.

    What should you configure on the preference item now?
  fr: |
    Le GPO **App-Config** est lié à l'UO **Sales** de **corp.contoso.com**. Il contient un élément de préférence Registre de Configuration utilisateur qui définit la valeur `HKCU\Software\Contoso\App\Server` sur **SQL1**. Les utilisateurs n'ont pas de profils itinérants.

    Le mois prochain, vous délierez App-Config de l'UO Sales. Lorsque le GPO ne s'appliquera plus à un utilisateur, la valeur devra être supprimée du Registre de cet utilisateur.

    Que devez-vous configurer dès maintenant sur l'élément de préférence ?
body:
  options:
    - { id: a, text: { en: "Apply once and do not reapply", fr: "Apply once and do not reapply" } }
    - { id: b, text: { en: "The Create action", fr: "L'action Create" } }
    - { id: c, text: { en: "Remove this item when it is no longer applied", fr: "Remove this item when it is no longer applied" } }
    - { id: d, text: { en: "Stop processing items in this extension if an error occurs on this item", fr: "Stop processing items in this extension if an error occurs on this item" } }
answer: { optionId: c }
explanation:
  correct:
    en: By default, preferences aren't removed when a GPO no longer applies; the value stays in place. With Remove this item when it is no longer applied, the settings applied by the item are removed when it falls out of scope; the option also sets the action to Replace. The option relies on a local history database, so it doesn't work with roaming profiles, which aren't used here.
    fr: Par défaut, les préférences ne sont pas supprimées lorsqu'un GPO ne s'applique plus ; la valeur reste en place. Avec Remove this item when it is no longer applied, les paramètres appliqués par l'élément sont supprimés lorsqu'il sort de l'étendue ; l'option fixe aussi l'action sur Replace. Elle s'appuie sur une base d'historique locale et ne fonctionne donc pas avec des profils itinérants, qui ne sont pas utilisés ici.
  options:
    a: { en: "Apply once stops the item from being reapplied at each refresh; it doesn't remove anything.", fr: "Apply once empêche l'élément d'être réappliqué à chaque actualisation ; il ne supprime rien." }
    b: { en: "The action decides what happens while the item applies, not after the GPO is out of scope.", fr: "L'action détermine ce qui se passe tant que l'élément s'applique, pas après la sortie de l'étendue du GPO." }
    d: { en: "This option only stops processing the following items of the extension after an error.", fr: "Cette option ne fait qu'arrêter le traitement des éléments suivants de l'extension après une erreur." }
references:
  - title: Group Policy preferences in Windows
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-preferences
  - title: Remove this item if it is no longer applied option
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/group-policy/remove-this-item-if-it-is-no-longer-applied-option
