id: az802-1a-site-move-dc
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The **corp.contoso.com** domain has two AD DS sites. The subnet 10.10.0.0/16 is associated with the **Paris** site and the subnet 10.30.0.0/24 with the **Lyon** site.

    A domain controller named **DC4** was shipped from Paris to the new Lyon office and its IP address was changed to 10.30.0.5. In Active Directory Sites and Services, the server object of DC4 is still under the Paris site. Clients in Lyon authenticate against domain controllers in Paris over the WAN.

    You need to ensure that DC4 is treated as a Lyon domain controller.

    Which command should you run?
  fr: |
    Le domaine **corp.contoso.com** possède deux sites AD DS. Le sous-réseau 10.10.0.0/16 est associé au site **Paris** et le sous-réseau 10.30.0.0/24 au site **Lyon**.

    Un contrôleur de domaine nommé **DC4** a été expédié de Paris vers le nouveau bureau de Lyon et son adresse IP a été remplacée par 10.30.0.5. Dans Sites et services Active Directory, l'objet serveur de DC4 se trouve toujours sous le site Paris. Les clients de Lyon s'authentifient auprès de contrôleurs de domaine de Paris à travers le WAN.

    Vous devez faire en sorte que DC4 soit traité comme un contrôleur de domaine de Lyon.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "New-ADReplicationSubnet -Name 10.30.0.0/24 -Site Lyon" }
    - { id: b, text: "Move-ADDirectoryServer -Identity DC4 -Site Lyon" }
    - { id: c, text: "Set-ADReplicationSubnet -Identity 10.10.0.0/16 -Site Lyon" }
    - { id: d, text: "Move-ADDirectoryServerOperationMasterRole -Identity DC4 -OperationMasterRole PDCEmulator" }
answer: { optionId: b }
explanation:
  correct:
    en: The site of a domain controller is defined by the location of its server object, not only by its current IP address. Move-ADDirectoryServer moves the server object of DC4 to the Lyon site, so DC4 registers its site-specific records for Lyon and Lyon clients locate it.
    fr: "Le site d'un contrôleur de domaine est défini par l'emplacement de son objet serveur, pas seulement par son adresse IP actuelle. Move-ADDirectoryServer déplace l'objet serveur de DC4 vers le site Lyon : DC4 inscrit ses enregistrements propres au site Lyon et les clients de Lyon le localisent."
  options:
    a: { en: "The 10.30.0.0/24 subnet is already associated with Lyon; the problem is the location of the server object.", fr: "Le sous-réseau 10.30.0.0/24 est déjà associé à Lyon ; le problème est l'emplacement de l'objet serveur." }
    c: { en: "Moving the Paris subnet to Lyon would send every Paris client to the Lyon site.", fr: "Déplacer le sous-réseau de Paris vers Lyon enverrait tous les clients de Paris vers le site Lyon." }
    d: { en: "Operation master roles are unrelated to the site membership of a domain controller.", fr: "Les rôles de maître d'opérations n'ont aucun rapport avec l'appartenance d'un contrôleur de domaine à un site." }
references:
  - title: Migrate a domain controller to a new site
    url: https://learn.microsoft.com/en-us/training/modules/deploy-manage-active-directory-domain-services-domain-controllers/5-migrate-domain-controller-new-site
