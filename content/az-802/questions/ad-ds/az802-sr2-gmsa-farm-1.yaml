id: az802-sr2-gmsa-farm-1
objective: "1.3.3"
type: series_yesno
series: az802-sr2-gmsa-farm
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You create a standalone managed service account and install it on the three servers.
  fr: |
    Vous créez un compte de service administré autonome et l'installez sur les trois serveurs.
body:
  solution:
    en: |
      You run `New-ADServiceAccount -Name msaApp1 -RestrictToSingleComputer`. On Web1, Web2 and Web3, you install the account by running `Install-ADServiceAccount -Identity msaApp1`, and you configure App1 to log on as **CONTOSO\msaApp1$** with a blank password.
    fr: |
      Vous exécutez `New-ADServiceAccount -Name msaApp1 -RestrictToSingleComputer`. Sur Web1, Web2 et Web3, vous installez le compte en exécutant `Install-ADServiceAccount -Identity msaApp1`, puis vous configurez App1 pour qu'il ouvre une session en tant que **CONTOSO\msaApp1$** avec un mot de passe vide.
answer: { value: false }
explanation:
  correct:
    en: |
      The RestrictToSingleComputer switch creates a standalone managed service account (sMSA), which is linked to one specific computer and cannot be reused across several servers. App1 could run under msaApp1 on one server only; a farm of three servers needs a gMSA.
    fr: |
      Le commutateur RestrictToSingleComputer crée un compte de service administré autonome (sMSA), lié à un ordinateur précis et qui ne peut pas être réutilisé sur plusieurs serveurs. App1 ne pourrait s'exécuter sous msaApp1 que sur un seul serveur : une batterie de trois serveurs nécessite un gMSA.
