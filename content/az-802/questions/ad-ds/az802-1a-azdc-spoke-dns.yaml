id: az802-1a-azdc-spoke-dns
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have the following Azure virtual networks:

    | Name | Configuration |
    | --- | --- |
    | VNet-Hub | Contains the domain controllers VM-DC1 (10.1.0.4) and VM-DC2 (10.1.0.5), which also run the DNS Server role. DNS servers of the virtual network: 10.1.0.4, 10.1.0.5 |
    | VNet-App | Peered with VNet-Hub. DNS servers of the virtual network: Default (Azure-provided) |

    You deploy a virtual machine named **VM-App1** in VNet-App. When you try to join VM-App1 to the **corp.contoso.com** domain, you receive an error stating that a domain controller for the domain could not be contacted. Network traffic between the peered virtual networks is allowed.

    What should you do so that VM-App1 can join the domain?
  fr: |
    Vous disposez des réseaux virtuels Azure suivants :

    | Nom | Configuration |
    | --- | --- |
    | VNet-Hub | Contient les contrôleurs de domaine VM-DC1 (10.1.0.4) et VM-DC2 (10.1.0.5), qui exécutent aussi le rôle Serveur DNS. Serveurs DNS du réseau virtuel : 10.1.0.4, 10.1.0.5 |
    | VNet-App | Relié à VNet-Hub par peering. Serveurs DNS du réseau virtuel : Par défaut (fourni par Azure) |

    Vous déployez une machine virtuelle nommée **VM-App1** dans VNet-App. Lorsque vous essayez de joindre VM-App1 au domaine **corp.contoso.com**, vous recevez une erreur indiquant qu'aucun contrôleur de domaine du domaine n'a pu être contacté. Le trafic réseau entre les réseaux virtuels reliés par peering est autorisé.

    Que devez-vous faire pour que VM-App1 puisse joindre le domaine ?
body:
  options:
    - { id: a, text: { en: "Set the DNS servers of VNet-App to 10.1.0.4 and 10.1.0.5, and then restart VM-App1.", fr: "Définir les serveurs DNS de VNet-App sur 10.1.0.4 et 10.1.0.5, puis redémarrer VM-App1." } }
    - { id: b, text: { en: "Create an Azure private DNS zone named corp.contoso.com and link it to VNet-App.", fr: "Créer une zone DNS privée Azure nommée corp.contoso.com et la lier à VNet-App." } }
    - { id: c, text: { en: "Enable gateway transit on the peering between VNet-Hub and VNet-App.", fr: "Activer le transit par passerelle sur le peering entre VNet-Hub et VNet-App." } }
    - { id: d, text: { en: "Add an AD DS subnet object for the address space of VNet-App to the site of the domain controllers.", fr: "Ajouter un objet sous-réseau AD DS pour l'espace d'adressage de VNet-App au site des contrôleurs de domaine." } }
answer: { optionId: a }
explanation:
  correct:
    en: Domain join locates a domain controller through the DNS SRV records hosted on the domain controllers' DNS servers. VNet-App uses Azure-provided DNS, which does not hold those records, so you configure the domain controllers as custom DNS servers on every virtual network that must resolve AD DS names, including peered networks. The virtual machine picks up the new DNS servers after a restart.
    fr: "La jonction au domaine localise un contrôleur de domaine grâce aux enregistrements SRV hébergés sur les serveurs DNS des contrôleurs de domaine. VNet-App utilise le DNS fourni par Azure, qui ne contient pas ces enregistrements : vous configurez donc les contrôleurs de domaine comme serveurs DNS personnalisés sur chaque réseau virtuel qui doit résoudre les noms AD DS, y compris les réseaux reliés par peering. La machine virtuelle prend en compte les nouveaux serveurs DNS après un redémarrage."
  options:
    b: { en: "An Azure private DNS zone would not contain the SRV records that the domain controllers register dynamically in their AD-integrated zone.", fr: "Une zone DNS privée Azure ne contiendrait pas les enregistrements SRV que les contrôleurs de domaine inscrivent dynamiquement dans leur zone intégrée à AD." }
    c: { en: "Gateway transit shares a VPN or ExpressRoute gateway; the problem is name resolution, not routing.", fr: "Le transit par passerelle partage une passerelle VPN ou ExpressRoute ; le problème est la résolution de noms, pas le routage." }
    d: { en: "A subnet object maps clients to a site for DC selection, but the client must first resolve the domain's SRV records through DNS.", fr: "Un objet sous-réseau associe les clients à un site pour le choix du contrôleur de domaine, mais le client doit d'abord résoudre les enregistrements SRV du domaine par DNS." }
references:
  - title: Deploy AD DS in an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/identity/adds-extend-domain
