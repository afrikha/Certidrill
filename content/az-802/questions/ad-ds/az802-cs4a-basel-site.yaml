id: az802-cs4a-basel-site
objective: "1.2.2"
type: dropdown
caseStudy: az802-cs4a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the requirements for the Basel workstations and for replication to the Basel site.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire les exigences concernant les postes de travail de Bâle et la réplication vers le site Basel.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    New-ADReplicationSubnet -Name [[subnet]] -Site "Basel"

    Set-ADReplicationSiteLink -Identity "Boston-Basel" [[link]]
  slots:
    - id: subnet
      options:
        - { id: mask, text: '"10.20.0.0 255.255.0.0"' }
        - { id: cidr, text: '"10.20.0.0/16"' }
        - { id: range, text: '"10.20.0.0-10.20.255.255"' }
    - id: link
      options:
        - { id: freq, text: "-ReplicationFrequencyInMinutes 15" }
        - { id: cost, text: "-Cost 1" }
        - { id: notify, text: "-Replace @{'options'=1}" }
answer:
  values: { subnet: cidr, link: notify }
explanation:
  correct:
    en: |
      Computers are mapped to sites through subnet objects, whose names use the CIDR form network/bits; associating 10.20.0.0/16 with the Basel site lets the Basel workstations locate the domain controllers of that site. Between sites, replication normally waits for the interval of the site link; setting the `options` attribute of the site link to 1 enables change notification, so changes replicate as soon as they are made, as within a site.
    fr: |
      Les ordinateurs sont associés aux sites par des objets sous-réseau, dont le nom utilise la forme CIDR réseau/bits ; associer 10.20.0.0/16 au site Basel permet aux postes de travail de Bâle de localiser les contrôleurs de domaine de ce site. Entre des sites, la réplication attend normalement l'intervalle du lien de sites ; définir l'attribut `options` du lien de sites à 1 active la notification des modifications, si bien que les modifications sont répliquées dès qu'elles sont effectuées, comme au sein d'un site.
  options:
    mask: { en: "A subnet object name must use the CIDR form, not a dotted subnet mask.", fr: "Le nom d'un objet sous-réseau doit utiliser la forme CIDR, pas un masque de sous-réseau en notation décimale pointée." }
    range: { en: "A subnet object name is a network and a prefix length, not an address range.", fr: "Le nom d'un objet sous-réseau est un réseau suivi d'une longueur de préfixe, pas une plage d'adresses." }
    freq: { en: "A shorter interval still makes Basel wait for the next replication cycle instead of replicating each change as it is made.", fr: "Un intervalle plus court fait toujours attendre le prochain cycle de réplication à Basel au lieu de répliquer chaque modification dès qu'elle est effectuée." }
    cost: { en: "The cost only influences which site links replication uses; it does not change when replication occurs.", fr: "Le coût influe seulement sur les liens de sites qu'emprunte la réplication ; il ne change pas le moment de la réplication." }
references:
  - title: New-ADReplicationSubnet (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/new-adreplicationsubnet
  - title: Set-ADReplicationSiteLink (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/set-adreplicationsitelink
