id: az802-1a-site-link-cost
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The **fabrikam.com** domain has three sites named Paris, Lyon and Marseille, each with domain controllers. The network is fully routed and **Bridge all site links** is enabled. The following site links exist:

    | Site link | Sites | Cost | WAN connection |
    | --- | --- | --- | --- |
    | PAR-LYS | Paris, Lyon | 100 | Fiber |
    | LYS-MRS | Lyon, Marseille | 100 | Fiber |
    | PAR-MRS | Paris, Marseille | 100 | Slow satellite link |

    Replication between Paris and Marseille must use the path through Lyon. The satellite link must be used for replication only if the Lyon domain controllers are unavailable.

    What should you do?
  fr: |
    Le domaine **fabrikam.com** possède trois sites nommés Paris, Lyon et Marseille, chacun avec des contrôleurs de domaine. Le réseau est entièrement routé et l'option **Bridge all site links** est activée. Les liens de sites suivants existent :

    | Lien de sites | Sites | Coût | Connexion WAN |
    | --- | --- | --- | --- |
    | PAR-LYS | Paris, Lyon | 100 | Fibre |
    | LYS-MRS | Lyon, Marseille | 100 | Fibre |
    | PAR-MRS | Paris, Marseille | 100 | Liaison satellite lente |

    La réplication entre Paris et Marseille doit emprunter le chemin passant par Lyon. La liaison satellite ne doit être utilisée pour la réplication que si les contrôleurs de domaine de Lyon sont indisponibles.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Delete the PAR-MRS site link.", fr: "Supprimer le lien de sites PAR-MRS." } }
    - { id: b, text: { en: "Clear Bridge all site links on the IP intersite transport.", fr: "Désactiver l'option Bridge all site links du transport intersite IP." } }
    - { id: c, text: { en: "Set the replication interval of PAR-MRS to 15 minutes.", fr: "Définir l'intervalle de réplication de PAR-MRS sur 15 minutes." } }
    - { id: d, text: { en: "Set the cost of PAR-MRS to 500.", fr: "Définir le coût de PAR-MRS sur 500." } }
answer: { optionId: d }
explanation:
  correct:
    en: The KCC builds the intersite topology along the lowest-cost paths. With PAR-MRS at 500, the path Paris–Lyon–Marseille (100 + 100 = 200) is preferred; PAR-MRS stays available, so the KCC can use it when the Lyon domain controllers are unavailable.
    fr: Le KCC construit la topologie intersite selon les chemins de moindre coût. Avec PAR-MRS à 500, le chemin Paris–Lyon–Marseille (100 + 100 = 200) est préféré ; PAR-MRS reste disponible, et le KCC peut l'utiliser lorsque les contrôleurs de domaine de Lyon sont indisponibles.
  options:
    a: { en: "Without PAR-MRS, there would be no fallback path when the Lyon domain controllers are down.", fr: "Sans PAR-MRS, il n'existerait aucun chemin de secours lorsque les contrôleurs de domaine de Lyon sont arrêtés." }
    b: { en: "Disabling bridging removes transitivity between site links, which does not make the path through Lyon cheaper than the direct link.", fr: "Désactiver le pontage supprime la transitivité entre les liens de sites, ce qui ne rend pas le chemin via Lyon moins coûteux que le lien direct." }
    c: { en: "The interval sets how often replication occurs over the link, not which path is preferred; it would increase traffic on the satellite link.", fr: "L'intervalle fixe la fréquence de réplication sur le lien, pas le chemin préféré ; il augmenterait le trafic sur la liaison satellite." }
references:
