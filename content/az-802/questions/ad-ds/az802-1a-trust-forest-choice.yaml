id: az802-1a-trust-forest-choice
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. acquired Fabrikam, Inc. The **contoso.com** forest contains three domains and the **fabrikam.com** forest contains two domains. Both forests run Windows Server 2025 domain controllers.

    Users in every domain of each forest must be able to be granted access to resources in every domain of the other forest by using Kerberos authentication. You must create the minimum number of trusts.

    Which type of trust should you create?
  fr: |
    Contoso, Ltd. a racheté Fabrikam, Inc. La forêt **contoso.com** contient trois domaines et la forêt **fabrikam.com** en contient deux. Les deux forêts exécutent des contrôleurs de domaine Windows Server 2025.

    Les utilisateurs de chaque domaine de chaque forêt doivent pouvoir obtenir l'accès aux ressources de chaque domaine de l'autre forêt avec l'authentification Kerberos. Vous devez créer le nombre minimal d'approbations.

    Quel type d'approbation devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A two-way external trust", fr: "Une approbation externe bidirectionnelle" } }
    - { id: b, text: { en: "A two-way shortcut trust", fr: "Une approbation raccourcie bidirectionnelle" } }
    - { id: c, text: { en: "A two-way realm trust", fr: "Une approbation de domaine Kerberos bidirectionnelle" } }
    - { id: d, text: { en: "A two-way forest trust", fr: "Une approbation de forêt bidirectionnelle" } }
answer: { optionId: d }
explanation:
  correct:
    en: A forest trust is created between the two forest root domains and is transitive, so a single two-way forest trust extends authentication to every domain of both forests.
    fr: "Une approbation de forêt est créée entre les deux domaines racines des forêts et elle est transitive : une seule approbation de forêt bidirectionnelle étend l'authentification à tous les domaines des deux forêts."
  options:
    a: { en: "An external trust is nontransitive and links only two domains, so you would need one trust per pair of domains.", fr: "Une approbation externe est non transitive et ne relie que deux domaines : il faudrait une approbation par paire de domaines." }
    b: { en: "A shortcut trust shortens the authentication path between two domains of the same forest.", fr: "Une approbation raccourcie raccourcit le chemin d'authentification entre deux domaines d'une même forêt." }
    c: { en: "A realm trust connects a domain to a non-Windows Kerberos realm.", fr: "Une approbation de domaine Kerberos relie un domaine à un domaine Kerberos non Windows." }
references:
  - title: "Trust types: Active Directory"
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2003/cc775736(v=ws.10)
  - title: How trust relationships work for forests in Active Directory
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/concepts-forest-trust
