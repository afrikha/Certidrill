id: az802-1a-rodc-rodcprep
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The **wingtiptoys.com** forest contains one domain. All the domain controllers are writable and run Windows Server 2022 or Windows Server 2025. The forest has never contained a read-only domain controller.

    A domain administrator ran `Add-ADDSReadOnlyDomainControllerAccount` to stage an account named **RODC1**. When the branch technician attaches the server named RODC1 by running `Install-ADDSDomainController -UseExistingAccount`, the prerequisite check fails and states that a read-only domain controller cannot be installed in the domain.

    You need to complete the deployment of RODC1 by using the staged account.

    What should you do first?
  fr: |
    La forêt **wingtiptoys.com** contient un domaine. Tous les contrôleurs de domaine sont accessibles en écriture et exécutent Windows Server 2022 ou Windows Server 2025. La forêt n'a jamais contenu de contrôleur de domaine en lecture seule.

    Un administrateur du domaine a exécuté `Add-ADDSReadOnlyDomainControllerAccount` pour créer à l'avance un compte nommé **RODC1**. Lorsque le technicien de la succursale attache le serveur nommé RODC1 en exécutant `Install-ADDSDomainController -UseExistingAccount`, la vérification des prérequis échoue et indique qu'un contrôleur de domaine en lecture seule ne peut pas être installé dans le domaine.

    Vous devez terminer le déploiement de RODC1 en utilisant le compte créé à l'avance.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Add the technician's account to the Enterprise Admins group.", fr: "Ajouter le compte du technicien au groupe Enterprise Admins." } }
    - { id: b, text: { en: "Run adprep.exe /rodcprep.", fr: "Exécuter adprep.exe /rodcprep." } }
    - { id: c, text: { en: "Raise the forest functional level to Windows Server 2025.", fr: "Élever le niveau fonctionnel de la forêt à Windows Server 2025." } }
    - { id: d, text: { en: "Run Install-ADDSDomainController -UseExistingAccount with -SkipPreChecks.", fr: "Exécuter Install-ADDSDomainController -UseExistingAccount avec -SkipPreChecks." } }
answer: { optionId: b }
explanation:
  correct:
    en: The staging process does not run the automatic RODC preparation that an unstaged installation performs. If the forest has never been prepared, you must run adprep /rodcprep manually (or first deploy an unstaged RODC) before a staged RODC can be attached.
    fr: Le processus de création à l'avance n'exécute pas la préparation automatique des RODC qu'effectue une installation non intermédiaire. Si la forêt n'a jamais été préparée, vous devez exécuter adprep /rodcprep manuellement (ou déployer d'abord un RODC non intermédiaire) avant de pouvoir attacher un RODC créé à l'avance.
  options:
    a: { en: "The attach operation requires Domain Admins or the delegated account; more privileges do not prepare the forest.", fr: "L'attachement exige Domain Admins ou le compte délégué ; davantage de privilèges ne préparent pas la forêt." }
    c: { en: "The Windows Server 2025 functional level is unrelated to RODC preparation and would require every domain controller to run Windows Server 2025.", fr: "Le niveau fonctionnel Windows Server 2025 n'a aucun rapport avec la préparation des RODC et exigerait que tous les contrôleurs de domaine exécutent Windows Server 2025." }
    d: { en: "Skipping the checks does not prepare the forest and can leave a partially promoted server or a damaged forest.", fr: "Ignorer les vérifications ne prépare pas la forêt et peut laisser un serveur partiellement promu ou une forêt endommagée." }
references:
