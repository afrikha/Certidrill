id: az802-sr1-sales-ou-1
objective: "7.3.1"
type: series_yesno
series: az802-sr1-sales-ou
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: You restore the 25 user accounts first, and then you restore the Sales OU.
  fr: Vous restaurez d'abord les 25 comptes d'utilisateur, puis l'UO Sales.
body:
  solution:
    en: |
      In Active Directory Administrative Center, you open the **Deleted Objects** container of northwind.com. You select the 25 user accounts and select **Restore**. You then select the Sales OU and select **Restore**.
    fr: |
      Dans le Centre d'administration Active Directory, vous ouvrez le conteneur **Deleted Objects** de northwind.com. Vous sélectionnez les 25 comptes d'utilisateur et sélectionnez **Restore**. Vous sélectionnez ensuite l'UO Sales et sélectionnez **Restore**.
answer: { value: false }
explanation:
  correct:
    en: |
      **Restore** returns an object to its last known parent, and the parent of the 25 accounts is the Sales OU, which is still deleted. The restore of the accounts fails because the parent of the objects is uninstantiated or deleted. Restoring the OU afterwards leaves it empty.
    fr: |
      **Restore** replace un objet dans son dernier parent connu, et le parent des 25 comptes est l'UO Sales, qui est toujours supprimée. La restauration des comptes échoue, car le parent des objets n'est pas instancié ou est supprimé. La restauration de l'UO qui suit la laisse vide.
references:
  - title: Advanced AD DS Management Using Active Directory Administrative Center (Level 200)
