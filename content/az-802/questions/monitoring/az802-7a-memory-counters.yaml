id: az802-7a-memory-counters
objective: "7.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A server named **APP1** runs Windows Server 2022. Users report that APP1 becomes slow every afternoon. You suspect that APP1 runs short of memory.

    You plan to add counters to Performance Monitor to confirm a memory shortage.

    Which two counters should you add? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur nommé **APP1** exécute Windows Server 2022. Les utilisateurs signalent qu'APP1 devient lent chaque après-midi. Vous soupçonnez qu'APP1 manque de mémoire.

    Vous prévoyez d'ajouter des compteurs à l'Analyseur de performances pour confirmer un manque de mémoire.

    Quels sont les deux compteurs à ajouter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: '\LogicalDisk(*)\Avg. Disk sec/Read'
    - id: b
      text: '\Memory\Available MBytes'
    - id: c
      text: '\Processor Information(*)\% Privileged Time'
    - id: d
      text: '\Memory\% Committed Bytes In Use'
    - id: e
      text: '\Network Interface(*)\Bytes Total/sec'
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "`Available MBytes` shows how much physical memory is free; less than 10% free is a warning and less than 500 MB is critical. `% Committed Bytes In Use` shows how much of the virtual memory (RAM plus page file) is committed; above 80% is critical. Together they confirm a memory shortage."
    fr: "`Available MBytes` indique la quantité de mémoire physique libre ; moins de 10 % libre est un avertissement et moins de 500 Mo est critique. `% Committed Bytes In Use` indique la part de la mémoire virtuelle (RAM et fichier d'échange) qui est validée ; au-delà de 80 %, la situation est critique. Ensemble, ils confirment un manque de mémoire."
  options:
    a: { en: "Avg. Disk sec/Read measures disk latency, a storage counter.", fr: "Avg. Disk sec/Read mesure la latence du disque ; c'est un compteur de stockage." }
    c: { en: "% Privileged Time measures processor time spent in kernel mode.", fr: "% Privileged Time mesure le temps processeur passé en mode noyau." }
    e: { en: "Bytes Total/sec measures network adapter throughput.", fr: "Bytes Total/sec mesure le débit de la carte réseau." }
references:
  - title: Troubleshoot performance problems in Windows
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/performance/troubleshoot-performance-problems-in-windows
