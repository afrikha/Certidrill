id: az802-7b-pdc-transfer-time
objective: "7.2.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Your network contains a single-domain AD DS forest named **contoso.com** with three domain controllers: DC1, DC2, and DC3. All member servers use the default time configuration of domain members.

    DC1 holds the PDC emulator role and was configured by running the following command:

    `w32tm /config /manualpeerlist:"time.windows.com,0x8" /syncfromflags:manual /reliable:yes /update`

    You transfer the PDC emulator role to DC2. DC1 remains a domain controller.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient une forêt AD DS à domaine unique nommée **contoso.com** avec trois contrôleurs de domaine : DC1, DC2 et DC3. Tous les serveurs membres utilisent la configuration de temps par défaut des membres d'un domaine.

    DC1 détient le rôle d'émulateur PDC et a été configuré en exécutant la commande suivante :

    `w32tm /config /manualpeerlist:"time.windows.com,0x8" /syncfromflags:manual /reliable:yes /update`

    Vous transférez le rôle d'émulateur PDC à DC2. DC1 reste un contrôleur de domaine.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: DC2 must be configured to synchronize its time from an external time source.
        fr: DC2 doit être configuré pour synchroniser son heure sur une source de temps externe.
    - id: s2
      text:
        en: "You should run `w32tm /config /syncfromflags:domhier /reliable:no /update` on DC1."
        fr: "Vous devez exécuter `w32tm /config /syncfromflags:domhier /reliable:no /update` sur DC1."
    - id: s3
      text:
        en: You must configure each member server to use DC2 as a manual peer.
        fr: Vous devez configurer chaque serveur membre pour qu'il utilise DC2 comme homologue manuel.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "The PDC emulator of the forest root domain is the only computer that is configured to synchronize with an external source, so DC2 now needs that configuration. DC1 keeps its manual settings after the transfer and must return to the domain hierarchy and stop advertising itself as reliable, otherwise the forest has two reliable sources. Member servers synchronize through the domain hierarchy automatically, so they need no change."
    fr: "L'émulateur PDC du domaine racine de la forêt est le seul ordinateur configuré pour se synchroniser sur une source externe : DC2 a donc besoin de cette configuration. DC1 conserve ses paramètres manuels après le transfert et doit revenir à la hiérarchie du domaine et cesser de s'annoncer comme fiable, sinon la forêt a deux sources fiables. Les serveurs membres se synchronisent automatiquement par la hiérarchie du domaine : ils n'ont besoin d'aucune modification."
references:
  - title: Windows Time service tools and settings
    url: https://learn.microsoft.com/en-us/windows-server/networking/windows-time-service/windows-time-service-tools-and-settings
