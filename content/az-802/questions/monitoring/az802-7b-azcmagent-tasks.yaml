id: az802-7b-azcmagent-tasks
objective: "7.2.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have an on-premises server named **SRV5** that is connected to Azure Arc. Extension deployments to SRV5 have started to fail, and you plan to troubleshoot the Connected Machine agent locally.

    Which `azcmagent` command should you run for each task? To answer, drag the appropriate commands to the correct tasks. Each command may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur local nommé **SRV5** connecté à Azure Arc. Les déploiements d'extensions sur SRV5 ont commencé à échouer, et vous prévoyez de dépanner l'agent Connected Machine localement.

    Quelle commande `azcmagent` devez-vous exécuter pour chaque tâche ? Pour répondre, faites glisser les commandes appropriées vers les tâches correspondantes. Chaque commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: show, text: azcmagent show }
    - { id: check, text: azcmagent check }
    - { id: logs, text: azcmagent logs }
    - { id: config, text: azcmagent config list }
    - { id: version, text: azcmagent version }
    - { id: disconnect, text: azcmagent disconnect }
  targets:
    - id: t1
      text: { en: "Run network connectivity checks against the Azure Arc endpoints", fr: "Exécuter des tests de connectivité réseau vers les points de terminaison Azure Arc" }
    - id: t2
      text: { en: "Display the agent status, including its connection state", fr: "Afficher l'état de l'agent, y compris son état de connexion" }
    - id: t3
      text: { en: "Collect the agent logs to send them to Microsoft Support", fr: "Collecter les journaux de l'agent pour les envoyer au support Microsoft" }
    - id: t4
      text: { en: "Review the local settings, such as the extension allowlist", fr: "Consulter les paramètres locaux, comme la liste d'autorisation des extensions" }
answer:
  mapping: { t1: check, t2: show, t3: logs, t4: config }
explanation:
  correct:
    en: "`azcmagent check` runs network connectivity checks for the Azure Arc endpoints, `azcmagent show` displays the agent status, `azcmagent logs` collects the logs used to troubleshoot agent issues, and `azcmagent config list` shows the local agent settings, including the extension allowlist and blocklist. `azcmagent version` only shows the agent version, and `azcmagent disconnect` removes the server from Azure Arc."
    fr: "`azcmagent check` exécute des tests de connectivité réseau vers les points de terminaison Azure Arc, `azcmagent show` affiche l'état de l'agent, `azcmagent logs` collecte les journaux servant au dépannage de l'agent, et `azcmagent config list` affiche les paramètres locaux de l'agent, dont la liste d'autorisation et la liste de blocage des extensions. `azcmagent version` affiche seulement la version de l'agent, et `azcmagent disconnect` retire le serveur d'Azure Arc."
references:
  - title: azcmagent CLI reference
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/azcmagent
  - title: Extensions security for Azure Arc-enabled servers
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/security-extensions
