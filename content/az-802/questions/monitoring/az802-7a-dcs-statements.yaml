id: az802-7a-dcs-statements
objective: "7.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You manage a server named **SRV5** that runs Windows Server 2025. Operators use data collector sets on SRV5 to troubleshoot performance issues.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez un serveur nommé **SRV5** qui exécute Windows Server 2025. Les opérateurs utilisent des jeux de collecteurs de données sur SRV5 pour résoudre des problèmes de performances.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A counter data collector created by running `logman create counter` with `-rf 01:00:00` collects data for one hour.
        fr: Un collecteur de données de compteur créé en exécutant `logman create counter` avec `-rf 01:00:00` collecte des données pendant une heure.
    - id: s2
      text:
        en: A member of the Performance Log Users group on SRV5 can create a new data collector set.
        fr: Un membre du groupe Performance Log Users sur SRV5 peut créer un nouveau jeu de collecteurs de données.
    - id: s3
      text:
        en: For members of Performance Log Users to start data logging, the group must be assigned the Log on as a batch job user right.
        fr: Pour que les membres de Performance Log Users puissent démarrer une journalisation de données, le groupe doit disposer du droit d'utilisateur Log on as a batch job.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "The `-rf` option runs the data collector for the specified period, here one hour. Since Windows Server 2016, members of Performance Log Users can't create data collector sets: the attempt fails with access denied. To let them start logging or modify data collector sets, assign the group the Log on as a batch job user right."
    fr: "L'option `-rf` exécute le collecteur de données pendant la durée indiquée, ici une heure. Depuis Windows Server 2016, les membres de Performance Log Users ne peuvent pas créer de jeux de collecteurs de données : la tentative échoue avec un accès refusé. Pour leur permettre de démarrer une journalisation ou de modifier des jeux de collecteurs, attribuez au groupe le droit d'utilisateur Log on as a batch job."
references:
  - title: Active Directory Security Groups
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-groups
  - title: logman create counter
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/logman-create-counter
