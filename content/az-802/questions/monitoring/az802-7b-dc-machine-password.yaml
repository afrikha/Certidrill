id: az802-7b-dc-machine-password
objective: "7.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your AD DS domain named **contoso.com** has two domain controllers: DC1 and DC2. After a storage incident on DC2, the machine account password of DC2 is out of sync with its copy in AD DS, and DC2 can no longer establish a secure channel. DC1 is healthy.

    You need to reset the machine account password of DC2.

    What should you do?
  fr: |
    Votre domaine AD DS nommé **contoso.com** compte deux contrôleurs de domaine : DC1 et DC2. Après un incident de stockage sur DC2, le mot de passe du compte d'ordinateur de DC2 est désynchronisé de sa copie dans AD DS, et DC2 ne parvient plus à établir de canal sécurisé. DC1 est sain.

    Vous devez réinitialiser le mot de passe du compte d'ordinateur de DC2.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "On DC1, run `netdom resetpwd /server:DC2 /userd:CONTOSO\\admin1 /passwordd:*`.", fr: "Sur DC1, exécuter `netdom resetpwd /server:DC2 /userd:CONTOSO\\admin1 /passwordd:*`." } }
    - { id: b, text: { en: "On DC2, run `Test-ComputerSecureChannel -Repair`.", fr: "Sur DC2, exécuter `Test-ComputerSecureChannel -Repair`." } }
    - { id: c, text: { en: "On DC2, run `netdom resetpwd /server:DC1 /userd:CONTOSO\\admin1 /passwordd:*`.", fr: "Sur DC2, exécuter `netdom resetpwd /server:DC1 /userd:CONTOSO\\admin1 /passwordd:*`." } }
    - { id: d, text: { en: "On DC1, run `nltest /sc_change_pwd:contoso.com`.", fr: "Sur DC1, exécuter `nltest /sc_change_pwd:contoso.com`." } }
answer: { optionId: c }
explanation:
  correct:
    en: "`netdom resetpwd` resets the machine account password of a domain controller. It must run, from an elevated prompt, on the domain controller whose password you reset (DC2), and `/server` names the domain controller used to set the password (DC1). It doesn't support resetting the password of a remote computer."
    fr: "`netdom resetpwd` réinitialise le mot de passe du compte d'ordinateur d'un contrôleur de domaine. Il doit s'exécuter, depuis une invite élevée, sur le contrôleur de domaine dont vous réinitialisez le mot de passe (DC2), et `/server` désigne le contrôleur de domaine utilisé pour définir le mot de passe (DC1). Il ne prend pas en charge la réinitialisation du mot de passe d'un ordinateur distant."
  options:
    a: { en: "netdom resetpwd can't reset the password of a remote computer; it must run on DC2 itself.", fr: "netdom resetpwd ne peut pas réinitialiser le mot de passe d'un ordinateur distant ; il doit s'exécuter sur DC2 lui-même." }
    b: { en: "Test-ComputerSecureChannel works only on domain members and returns false results on domain controllers; use netdom or nltest there.", fr: "Test-ComputerSecureChannel ne fonctionne que sur les membres du domaine et renvoie des résultats erronés sur les contrôleurs de domaine ; utilisez-y netdom ou nltest." }
    d: { en: "Run on DC1, this command changes the computer account password of DC1, not the one of DC2.", fr: "Exécutée sur DC1, cette commande change le mot de passe du compte d'ordinateur de DC1, pas celui de DC2." }
references:
  - title: netdom resetpwd
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netdom-resetpwd
  - title: Test-ComputerSecureChannel (Microsoft.PowerShell.Management)
    url: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/test-computersecurechannel
