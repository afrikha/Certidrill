id: az802-7b-failed-dc-metadata
objective: "7.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Your AD DS domain has four domain controllers: DC1, DC2, DC3, and DC4. DC4 suffered a hardware failure and won't be repaired. It doesn't hold any operations master role and was never demoted.

    Since the failure, DC1, DC2, and DC3 log replication error 8524, "The DSA operation is unable to proceed because of a DNS lookup failure", for DC4.

    You need to remove the references to DC4 from AD DS.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre domaine AD DS compte quatre contrôleurs de domaine : DC1, DC2, DC3 et DC4. DC4 a subi une panne matérielle et ne sera pas réparé. Il ne détient aucun rôle de maître d'opérations et n'a jamais été rétrogradé.

    Depuis la panne, DC1, DC2 et DC3 journalisent l'erreur de réplication 8524, « The DSA operation is unable to proceed because of a DNS lookup failure », pour DC4.

    Vous devez supprimer les références à DC4 dans AD DS.

    Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In Active Directory Users and Computers, delete the DC4 computer account from the Domain Controllers OU.", fr: "Dans Utilisateurs et ordinateurs Active Directory, supprimer le compte d'ordinateur de DC4 de l'UO Domain Controllers." } }
    - { id: b, text: { en: "In DNS Manager, delete the host (A) record of DC4 and its CNAME record in the _msdcs zone.", fr: "Dans le Gestionnaire DNS, supprimer l'enregistrement d'hôte (A) de DC4 et son enregistrement CNAME dans la zone _msdcs." } }
    - { id: c, text: { en: "In Active Directory Sites and Services, delete the NTDS Settings object below the DC4 server object.", fr: "Dans Sites et services Active Directory, supprimer l'objet NTDS Settings situé sous l'objet serveur de DC4." } }
    - { id: d, text: { en: "On DC1, run `repadmin /syncall DC1` to resynchronize the remaining domain controllers.", fr: "Sur DC1, exécuter `repadmin /syncall DC1` pour resynchroniser les contrôleurs de domaine restants." } }
    - { id: e, text: { en: "In Active Directory Users and Computers, reset the DC4 computer account.", fr: "Dans Utilisateurs et ordinateurs Active Directory, réinitialiser le compte d'ordinateur de DC4." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A domain controller that no longer exists but whose NTDS Settings object remains causes 8524 errors on its partners; the fix is metadata cleanup. Deleting the domain controller's computer account from the Domain Controllers OU in Active Directory Users and Computers performs the cleanup automatically, and so does deleting its NTDS Settings object first in Active Directory Sites and Services."
    fr: "Un contrôleur de domaine qui n'existe plus mais dont l'objet NTDS Settings subsiste provoque des erreurs 8524 chez ses partenaires ; la correction est le nettoyage des métadonnées. Supprimer le compte d'ordinateur du contrôleur de domaine de l'UO Domain Controllers dans Utilisateurs et ordinateurs Active Directory effectue ce nettoyage automatiquement, tout comme supprimer d'abord son objet NTDS Settings dans Sites et services Active Directory."
  options:
    b: { en: "Removing DNS records doesn't remove the NTDS Settings object, so the partners keep trying to replicate with DC4.", fr: "Supprimer des enregistrements DNS ne supprime pas l'objet NTDS Settings : les partenaires continuent de tenter de répliquer avec DC4." }
    d: { en: "Replication can't remove the metadata of DC4; the errors would continue.", fr: "La réplication ne peut pas supprimer les métadonnées de DC4 ; les erreurs continueraient." }
    e: { en: "Resetting the account keeps DC4 registered as a domain controller in the replication topology.", fr: "Réinitialiser le compte laisse DC4 inscrit comme contrôleur de domaine dans la topologie de réplication." }
references:
  - title: Clean up Active Directory Domain Controller server metadata
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/ad-ds-metadata-cleanup
  - title: Active Directory Replication fails with Win32 error 8524
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/replication-error-8524
