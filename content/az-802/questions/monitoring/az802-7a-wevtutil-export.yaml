id: az802-7a-wevtutil-export
objective: "7.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A server named **SRV8** runs Windows Server 2025. Microsoft Support asks for a copy of the **System** log of SRV8 as an .evtx file.

    You need to provide the file. The events must remain in the System log of SRV8.

    Which command should you run?
  fr: |
    Un serveur nommé **SRV8** exécute Windows Server 2025. Le support Microsoft demande une copie du journal **Système** de SRV8 sous forme de fichier .evtx.

    Vous devez fournir le fichier. Les événements doivent rester dans le journal Système de SRV8.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: 'wevtutil cl System /bu:C:\Support\System.evtx' }
    - { id: b, text: 'wevtutil sl System /lfn:C:\Support\System.evtx' }
    - { id: c, text: 'wevtutil gli System /lf:C:\Support\System.evtx' }
    - { id: d, text: 'wevtutil epl System C:\Support\System.evtx' }
answer: { optionId: d }
explanation:
  correct:
    en: "`wevtutil epl` (export-log) exports the events of a log to the specified file without changing the log, so the events stay in the System log."
    fr: "`wevtutil epl` (export-log) exporte les événements d'un journal vers le fichier indiqué sans modifier le journal : les événements restent dans le journal Système."
  options:
    a: { en: "cl (clear-log) with /bu saves the events to a backup file but then clears the System log.", fr: "cl (clear-log) avec /bu enregistre les événements dans un fichier de sauvegarde, puis efface le journal Système." }
    b: { en: "sl with /lfn changes the path where the log file is stored; it doesn't create a copy for support.", fr: "sl avec /lfn modifie le chemin où le fichier journal est stocké ; il ne crée pas de copie pour le support." }
    c: { en: "gli displays status information about a log or log file; it doesn't export events.", fr: "gli affiche des informations d'état sur un journal ou un fichier journal ; il n'exporte pas d'événements." }
references:
  - title: wevtutil
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
