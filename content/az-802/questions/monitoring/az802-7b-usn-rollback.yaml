id: az802-7b-usn-rollback
objective: "7.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Your AD DS domain has five domain controllers. After a storage failure, an administrator brought a domain controller named **DC6** back by starting it from a copy of its virtual hard disk saved three weeks ago. No system state backup of DC6 exists.

    DC6 now logs Directory Services event 2095, the Net Logon service on DC6 is paused, and the `Dsa Not Writable` registry entry on DC6 is set to 0x4. `repadmin` reports no replication errors.

    You need to return the domain to a supported state.

    What should you do?
  fr: |
    Votre domaine AD DS compte cinq contrôleurs de domaine. Après une panne de stockage, un administrateur a remis en service un contrôleur de domaine nommé **DC6** en le démarrant à partir d'une copie de son disque dur virtuel enregistrée il y a trois semaines. Il n'existe aucune sauvegarde de l'état du système de DC6.

    DC6 journalise désormais l'événement Directory Services 2095, le service Netlogon de DC6 est suspendu et l'entrée de Registre `Dsa Not Writable` de DC6 a la valeur 0x4. `repadmin` ne signale aucune erreur de réplication.

    Vous devez ramener le domaine dans un état pris en charge.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Delete the `Dsa Not Writable` entry on DC6, and then resume the Net Logon service.", fr: "Supprimer l'entrée `Dsa Not Writable` sur DC6, puis reprendre le service Netlogon." } }
    - { id: b, text: { en: "Remove AD DS from DC6, and then clean up the metadata of DC6 on a healthy domain controller.", fr: "Supprimer AD DS de DC6, puis nettoyer les métadonnées de DC6 sur un contrôleur de domaine sain." } }
    - { id: c, text: { en: "Run `repadmin /removelingeringobjects` on DC6 with a healthy domain controller as the reference.", fr: "Exécuter `repadmin /removelingeringobjects` sur DC6 avec un contrôleur de domaine sain comme référence." } }
    - { id: d, text: { en: "Restart DC6 in DSRM, and then mark its domain partition as authoritative by using ntdsutil.", fr: "Redémarrer DC6 en DSRM, puis marquer sa partition de domaine comme faisant autorité avec ntdsutil." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Event 2095, the paused Net Logon service, and `Dsa Not Writable` = 4 show a USN rollback caused by starting a previously saved virtual hard disk. Without a valid system state backup, the supported recovery is to remove AD DS from DC6 so that it becomes a standalone server, clean up its metadata on a healthy domain controller, and reinstall AD DS only if required."
    fr: "L'événement 2095, le service Netlogon suspendu et `Dsa Not Writable` = 4 révèlent une restauration USN causée par le démarrage d'un disque dur virtuel enregistré auparavant. Sans sauvegarde valide de l'état du système, la récupération prise en charge consiste à supprimer AD DS de DC6 pour en faire un serveur autonome, à nettoyer ses métadonnées sur un contrôleur de domaine sain, puis à réinstaller AD DS seulement si nécessaire."
  options:
    a: { en: "Deleting or changing Dsa Not Writable removes the quarantine and puts DC6 in a permanently unsupported, inconsistent state.", fr: "Supprimer ou modifier Dsa Not Writable lève la quarantaine et place DC6 dans un état incohérent définitivement non pris en charge." }
    c: { en: "Lingering objects come from replication failures longer than the tombstone lifetime; they aren't the problem of a rolled-back DC.", fr: "Les objets persistants proviennent d'échecs de réplication plus longs que la durée de vie de désactivation ; ce n'est pas le problème d'un DC restauré à un USN antérieur." }
    d: { en: "An authoritative restore requires a supported system state backup, and it would push three-week-old data over the newer changes.", fr: "Une restauration faisant autorité exige une sauvegarde prise en charge de l'état du système, et elle imposerait des données vieilles de trois semaines aux modifications plus récentes." }
references:
  - title: How to detect and recover from a USN rollback in a Windows Server-based domain controller
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/detect-and-recover-from-usn-rollback
  - title: Virtualizing domain controllers with Hyper-V
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/virtual-dc/virtualized-domain-controllers-hyper-v
