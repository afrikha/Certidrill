id: az802-7a-resolve-srv
objective: "7.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Member servers of the contoso.com domain intermittently fail to locate a domain controller. You suspect that the DNS server at 10.0.0.4 doesn't return the domain controller locator records.

    From a server that runs Windows Server 2025, you need to query 10.0.0.4 for these records by using only the DNS protocol, so that LLMNR and NetBIOS can't answer.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les serveurs membres du domaine contoso.com ne parviennent pas toujours à localiser un contrôleur de domaine. Vous soupçonnez que le serveur DNS 10.0.0.4 ne renvoie pas les enregistrements du localisateur de contrôleurs de domaine.

    Depuis un serveur qui exécute Windows Server 2025, vous devez interroger 10.0.0.4 pour obtenir ces enregistrements en utilisant uniquement le protocole DNS, afin que LLMNR et NetBIOS ne puissent pas répondre.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Resolve-DnsName -Name _ldap._tcp.dc._msdcs.contoso.com -Type [[type]] [[server]] 10.0.0.4 [[proto]]
  slots:
    - id: type
      options:
        - { id: a, text: A }
        - { id: ptr, text: PTR }
        - { id: srv, text: SRV }
        - { id: cname, text: CNAME }
    - id: server
      options:
        - { id: server, text: -Server }
        - { id: noRec, text: -NoRecursion }
        - { id: cache, text: -CacheOnly }
    - id: proto
      options:
        - { id: llmnr, text: -LlmnrNetbiosOnly }
        - { id: dnsonly, text: -DnsOnly }
        - { id: fallback, text: -LlmnrFallback }
        - { id: tcp, text: -QuickTimeout }
answer:
  values: { type: srv, server: server, proto: dnsonly }
explanation:
  correct:
    en: "Domain controllers are located through service (SRV) records such as `_ldap._tcp.dc._msdcs.<domain>`. `-Server` sends the query to a specific DNS server, and `-DnsOnly` resolves the query by using only the DNS protocol."
    fr: "Les contrôleurs de domaine sont localisés grâce aux enregistrements de service (SRV) comme `_ldap._tcp.dc._msdcs.<domaine>`. `-Server` envoie la requête à un serveur DNS précis, et `-DnsOnly` résout la requête en utilisant uniquement le protocole DNS."
  options:
    a: { en: "An A record maps a host name to an IPv4 address; the locator records are SRV records.", fr: "Un enregistrement A associe un nom d'hôte à une adresse IPv4 ; les enregistrements du localisateur sont des SRV." }
    noRec: { en: "-NoRecursion is a switch that asks the server not to recurse; it doesn't take a server address.", fr: "-NoRecursion est un commutateur qui demande au serveur de ne pas effectuer de récursivité ; il n'accepte pas d'adresse de serveur." }
    cache: { en: "-CacheOnly answers from the local cache only, without querying any server.", fr: "-CacheOnly répond uniquement à partir du cache local, sans interroger de serveur." }
    llmnr: { en: "-LlmnrNetbiosOnly does the opposite of what is required: it uses only LLMNR or NetBIOS.", fr: "-LlmnrNetbiosOnly fait l'inverse de ce qui est demandé : il utilise uniquement LLMNR ou NetBIOS." }
    tcp: { en: "-QuickTimeout only shortens the timeouts of the query; it doesn't restrict the protocols used.", fr: "-QuickTimeout raccourcit seulement les délais d'attente de la requête ; il ne restreint pas les protocoles utilisés." }
    fallback: { en: "-LlmnrFallback allows LLMNR to answer when DNS fails, which the requirement excludes.", fr: "-LlmnrFallback permet à LLMNR de répondre quand DNS échoue, ce que l'exigence exclut." }
references:
  - title: Resolve-DnsName (DnsClient)
    url: https://learn.microsoft.com/en-us/powershell/module/dnsclient/resolve-dnsname
