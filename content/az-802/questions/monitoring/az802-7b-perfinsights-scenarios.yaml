id: az802-7b-perfinsights-scenarios
objective: "7.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You manage Azure virtual machines that run Windows Server 2022. You plan to use Performance Diagnostics (PerfInsights) on demand to investigate several performance complaints.

    Which troubleshooting scenario should you run for each requirement? To answer, drag the appropriate scenarios to the correct requirements. Each scenario may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez des machines virtuelles Azure qui exécutent Windows Server 2022. Vous prévoyez d'utiliser les diagnostics de performances (PerfInsights) à la demande pour examiner plusieurs plaintes liées aux performances.

    Quel scénario de dépannage devez-vous exécuter pour chaque exigence ? Pour répondre, faites glisser les scénarios appropriés vers les exigences correspondantes. Chaque scénario peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: quick, text: Quick analysis }
    - { id: perf, text: Performance analysis }
    - { id: advanced, text: Advanced performance analysis }
    - { id: bench, text: Benchmarking }
    - { id: files, text: Azure Files analysis }
  targets:
    - id: t1
      text: { en: "Measure the IOPS and MBps that every attached drive of a test VM can deliver", fr: "Mesurer les IOPS et les Mo/s que peut fournir chaque disque connecté d'une machine virtuelle de test" }
    - id: t2
      text: { en: "Collect latency, IO size, and queue length of SMB client shares together with a network trace", fr: "Collecter la latence, la taille des E/S et la longueur de file d'attente des partages clients SMB avec une trace réseau" }
    - id: t3
      text: { en: "Gather disk configuration, event logs, and firewall settings of a production VM without affecting it", fr: "Recueillir la configuration des disques, les journaux des événements et les paramètres du pare-feu d'une machine virtuelle de production sans l'affecter" }
    - id: t4
      text: { en: "Run Xperf, network, and StorPort traces in parallel on a test VM", fr: "Exécuter en parallèle des traces Xperf, réseau et StorPort sur une machine virtuelle de test" }
answer:
  mapping: { t1: bench, t2: files, t3: quick, t4: advanced }
explanation:
  correct:
    en: "Benchmarking runs Diskspd against all attached drives to measure IOPS and MBps. Azure Files analysis captures SMB client share counters with a network trace. Quick analysis is a passive collection of configuration, event logs, and firewall settings that shouldn't affect the system. Advanced performance analysis runs selected traces such as Xperf, network, and StorPort in parallel; like Benchmarking, it shouldn't be run on a live production system. Performance analysis runs a performance counter trace only."
    fr: "Benchmarking exécute Diskspd sur tous les disques connectés pour mesurer les IOPS et les Mo/s. Azure Files analysis capture les compteurs des partages clients SMB avec une trace réseau. Quick analysis est une collecte passive de la configuration, des journaux des événements et des paramètres du pare-feu, qui ne devrait pas affecter le système. Advanced performance analysis exécute en parallèle des traces choisies, comme Xperf, réseau et StorPort ; comme Benchmarking, il ne doit pas être exécuté sur un système de production actif. Performance analysis exécute seulement une trace de compteurs de performances."
references:
  - title: Run performance diagnostics reports on Azure virtual machines
    url: https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-machines/windows/how-to-use-perfinsights
