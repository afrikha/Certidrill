id: az802-7a-vminsights-otel
objective: "7.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You plan to enable enhanced monitoring (VM insights) for 50 new Azure virtual machines that run Windows Server 2025. No dashboard, query or alert uses the `InsightsMetrics` table today.

    You need to collect guest performance metrics, including per-process CPU and memory usage. The solution must minimize the cost of storing the metrics.

    Which metrics option and destination should you use?
  fr: |
    Vous prévoyez d'activer la supervision renforcée (VM insights) pour 50 nouvelles machines virtuelles Azure qui exécutent Windows Server 2025. Aucun tableau de bord, aucune requête et aucune alerte n'utilisent aujourd'hui la table `InsightsMetrics`.

    Vous devez collecter les métriques de performances de l'invité, y compris l'utilisation du processeur et de la mémoire par processus. La solution doit réduire au minimum le coût de stockage des métriques.

    Quelle option de métriques et quelle destination devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Logs-based metrics sent to a Log Analytics workspace", fr: "Des métriques basées sur les journaux envoyées vers un espace de travail Log Analytics" } }
    - { id: b, text: { en: "OpenTelemetry metrics sent to an Azure Monitor workspace", fr: "Des métriques OpenTelemetry envoyées vers un espace de travail Azure Monitor" } }
    - { id: c, text: { en: "Host platform metrics analyzed in metrics explorer", fr: "Des métriques de plateforme de l'hôte analysées dans Metrics Explorer" } }
    - { id: d, text: { en: "Dependency agent data sent to a Log Analytics workspace", fr: "Des données de l'agent Dependency envoyées vers un espace de travail Log Analytics" } }
answer: { optionId: b }
explanation:
  correct:
    en: OpenTelemetry metrics are the recommended option for new deployments. They're stored in an Azure Monitor workspace, which is cheaper and faster to query for time series than a Log Analytics workspace, and they can include per-process CPU, disk I/O and memory metrics.
    fr: Les métriques OpenTelemetry sont l'option recommandée pour les nouveaux déploiements. Elles sont stockées dans un espace de travail Azure Monitor, moins coûteux et plus rapide à interroger pour les séries chronologiques qu'un espace de travail Log Analytics, et elles peuvent inclure des métriques par processus (processeur, E/S disque, mémoire).
  options:
    a: { en: "Logs-based metrics (InsightsMetrics) are the classic experience, kept mainly for existing queries and dashboards; they incur Log Analytics ingestion costs.", fr: "Les métriques basées sur les journaux (InsightsMetrics) sont l'expérience classique, conservée surtout pour les requêtes et tableaux de bord existants ; elles entraînent des coûts d'ingestion Log Analytics." }
    c: { en: "Host metrics are seen from the hypervisor; they don't contain guest memory or per-process data.", fr: "Les métriques de l'hôte sont vues depuis l'hyperviseur ; elles ne contiennent ni la mémoire de l'invité ni de données par processus." }
    d: { en: "The Dependency agent fed the deprecated Map feature (processes and connections), not performance metrics.", fr: "L'agent Dependency alimentait la fonctionnalité Map dépréciée (processus et connexions), pas des métriques de performances." }
references:
  - title: Metrics experience for virtual machines in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/metrics-opentelemetry-guest
  - title: Enable VM monitoring in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vm-enable-monitoring
