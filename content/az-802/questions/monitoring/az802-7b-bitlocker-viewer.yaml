id: az802-7b-bitlocker-viewer
objective: "7.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your AD DS domain stores the BitLocker recovery passwords of all servers. A help desk technician named **Tech1** has been delegated read access to the BitLocker recovery information.

    Tech1 opens Active Directory Users and Computers on a management server named **MGMT1** and opens the properties of a computer object, but no **BitLocker Recovery** tab appears.

    You need Tech1 to be able to retrieve recovery passwords from MGMT1.

    What should you do?
  fr: |
    Votre domaine AD DS stocke les mots de passe de récupération BitLocker de tous les serveurs. Un technicien du support nommé **Tech1** a reçu par délégation l'accès en lecture aux informations de récupération BitLocker.

    Tech1 ouvre Utilisateurs et ordinateurs Active Directory sur un serveur d'administration nommé **MGMT1** et affiche les propriétés d'un objet ordinateur, mais aucun onglet **BitLocker Recovery** n'apparaît.

    Tech1 doit pouvoir récupérer des mots de passe de récupération depuis MGMT1.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add Tech1 to the Domain Admins group.", fr: "Ajouter Tech1 au groupe Domain Admins." } }
    - { id: b, text: { en: "Install the BitLocker Network Unlock feature on MGMT1.", fr: "Installer la fonctionnalité Déverrouillage réseau BitLocker sur MGMT1." } }
    - { id: c, text: { en: "Install BitLocker Recovery Password Viewer on MGMT1.", fr: "Installer BitLocker Recovery Password Viewer sur MGMT1." } }
    - { id: d, text: { en: "Enable **Advanced Features** in the **View** menu of the console.", fr: "Activer **Advanced Features** dans le menu **View** de la console." } }
answer: { optionId: c }
explanation:
  correct:
    en: "BitLocker Recovery Password Viewer is an extension of the Active Directory Users and Computers snap-in, included with the Remote Server Administration Tools. Once it's installed, computer objects show a **BitLocker Recovery** tab, and the domain container offers **Find BitLocker Recovery Password**, which searches by the first eight characters of the password ID."
    fr: "BitLocker Recovery Password Viewer est une extension du composant logiciel enfichable Utilisateurs et ordinateurs Active Directory, incluse dans les outils d'administration de serveur distant (RSAT). Une fois installée, les objets ordinateur affichent un onglet **BitLocker Recovery**, et le conteneur du domaine propose **Find BitLocker Recovery Password**, qui recherche à partir des huit premiers caractères de l'ID du mot de passe."
  options:
    a: { en: "Tech1 already has the read access it needs, and more privileges don't add the missing tab.", fr: "Tech1 a déjà l'accès en lecture nécessaire, et davantage de privilèges n'ajoutent pas l'onglet manquant." }
    b: { en: "Network Unlock unlocks operating system volumes at startup on a trusted network; it has nothing to do with viewing recovery passwords.", fr: "Le déverrouillage réseau déverrouille les volumes du système d'exploitation au démarrage sur un réseau approuvé ; il n'a aucun rapport avec la consultation des mots de passe de récupération." }
    d: { en: "Advanced Features shows system containers and extra tabs such as Attribute Editor, but not the BitLocker Recovery tab, which comes from the viewer extension.", fr: "Advanced Features affiche les conteneurs système et des onglets supplémentaires comme Attribute Editor, mais pas l'onglet BitLocker Recovery, qui provient de l'extension du visualiseur." }
references:
  - title: BitLocker recovery process
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/recovery-process
