id: az802-7a-logman-alert
objective: "7.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A server named **SQL3** runs Windows Server 2022. A user-defined data collector set named **Diag-CPU** and a scheduled task named **NotifyOps** already exist on SQL3.

    You need to create a data collector that, when the total processor time exceeds 90%, starts Diag-CPU and runs NotifyOps.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur nommé **SQL3** exécute Windows Server 2022. Un jeu de collecteurs de données défini par l'utilisateur nommé **Diag-CPU** et une tâche planifiée nommée **NotifyOps** existent déjà sur SQL3.

    Vous devez créer un collecteur de données qui, lorsque le temps processeur total dépasse 90 %, démarre Diag-CPU et exécute NotifyOps.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    logman create [[type]] CpuHigh -th "\Processor(_Total)\% Processor Time>90" -si 00:00:30 [[dcs]] Diag-CPU [[task]] NotifyOps
  slots:
    - id: type
      options:
        - { id: counter, text: counter }
        - { id: alert, text: alert }
        - { id: trace, text: trace }
        - { id: cfg, text: cfg }
    - id: dcs
      options:
        - { id: rc, text: -rc }
        - { id: cf, text: -cf }
        - { id: rdcs, text: -rdcs }
        - { id: tn1, text: -tn }
    - id: task
      options:
        - { id: tn, text: -tn }
        - { id: targ, text: -targ }
        - { id: el, text: -el }
        - { id: rdcs2, text: -rdcs }
answer:
  values: { type: alert, dcs: rdcs, task: tn }
explanation:
  correct:
    en: "`logman create alert` creates a performance counter alert whose thresholds are set with `-th`. When the alert fires, `-rdcs` names the data collector set to start and `-tn` names the task to run."
    fr: "`logman create alert` crée une alerte de compteur de performance dont les seuils sont définis par `-th`. Quand l'alerte se déclenche, `-rdcs` désigne le jeu de collecteurs de données à démarrer et `-tn` la tâche à exécuter."
  options:
    counter: { en: "A counter data collector records values to a log; it has no threshold or alert actions.", fr: "Un collecteur de données de compteur enregistre des valeurs dans un journal ; il n'a ni seuil ni actions d'alerte." }
    rc: { en: "-rc runs a command each time the log is closed, not when a threshold is crossed.", fr: "-rc exécute une commande à chaque fermeture du journal, pas lors du franchissement d'un seuil." }
    cf: { en: "-cf names a file that lists the counters to collect.", fr: "-cf désigne un fichier qui liste les compteurs à collecter." }
    targ: { en: "-targ supplies arguments to the task named by -tn; it doesn't name the task.", fr: "-targ fournit les arguments de la tâche désignée par -tn ; il ne désigne pas la tâche." }
    el: { en: "-el enables or disables event log reporting.", fr: "-el active ou désactive la journalisation dans le journal des événements." }
references:
  - title: logman create alert
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/logman-create-alert
