id: az802-cs1b-volume-forecast
objective: "7.1.4"
type: single
caseStudy: az802-cs1b-southridge
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the capacity requirement for FS-MTL1.

    What should you use?
  fr: |
    Vous devez respecter l'exigence de capacité pour FS-MTL1.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Total storage consumption forecasting capability of System Insights", fr: "La fonctionnalité Total storage consumption forecasting de System Insights" } }
    - { id: b, text: { en: "VM Insights with a data collection rule that sends disk metrics to a Log Analytics workspace", fr: "VM Insights avec une règle de collecte de données qui envoie les métriques de disque vers un espace de travail Log Analytics" } }
    - { id: c, text: { en: "The Volume consumption forecasting capability of System Insights", fr: "La fonctionnalité Volume consumption forecasting de System Insights" } }
    - { id: d, text: { en: "A Performance Monitor data collector set that logs the LogicalDisk(*)\\% Free Space counter", fr: "Un jeu de collecteurs de données de l'Analyseur de performances qui enregistre le compteur LogicalDisk(*)\\% Free Space" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      System Insights runs entirely on Windows Server 2019 and later: it collects, stores and analyzes data locally. Its Volume consumption forecasting capability forecasts storage consumption for each volume, which is the granularity the requirement asks for.
    fr: |
      System Insights s'exécute entièrement sur Windows Server 2019 et versions ultérieures : il collecte, stocke et analyse les données localement. Sa fonctionnalité Volume consumption forecasting prévoit la consommation de stockage de chaque volume, la granularité demandée par l'exigence.
  options:
    a: { en: "Total storage consumption forecasting forecasts consumption across all local drives, not for each volume.", fr: "Total storage consumption forecasting prévoit la consommation de l'ensemble des lecteurs locaux, pas celle de chaque volume." }
    b: { en: "VM Insights sends the data to Azure Monitor, so the data isn't collected and analyzed only on FS-MTL1.", fr: "VM Insights envoie les données vers Azure Monitor : elles ne sont donc pas collectées et analysées uniquement sur FS-MTL1." }
    d: { en: "A data collector set records counter values but doesn't produce a forecast.", fr: "Un jeu de collecteurs de données enregistre des valeurs de compteurs mais ne produit pas de prévision." }
references:
  - title: What is System Insights?
    url: https://learn.microsoft.com/en-us/windows-server/manage/system-insights/overview
