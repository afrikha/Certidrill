id: az802-7b-replsummary-errors
objective: "7.3.4"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Your AD DS forest contains several domain controllers. You run `repadmin /replsummary` on DC1 and receive the source DSA section shown in the following table.

    Answer each prompt by selecting the source domain controller that matches it.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre forêt AD DS contient plusieurs contrôleurs de domaine. Vous exécutez `repadmin /replsummary` sur DC1 et obtenez la section des DSA sources présentée dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le contrôleur de domaine source qui y correspond.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "You should run `dcdiag /test:CheckSecurityError` on the destination and on this source.", fr: "Vous devez exécuter `dcdiag /test:CheckSecurityError` sur la destination et sur cette source." }
    - id: p2
      text: { en: "Its partners have stopped replicating with it, and lingering objects must be removed before replication is allowed again.", fr: "Ses partenaires ont cessé de répliquer avec elle, et les objets persistants doivent être supprimés avant d'autoriser de nouveau la réplication." }
  grid:
    header: [Source DSA, { en: "Largest delta", fr: "Plus grand écart" }, { en: "Fails/Total", fr: "Échecs/Total" }, { en: Error, fr: Erreur }]
    rows:
      - [{ text: DC2, area: dc2 }, { text: "15m:02s" }, { text: "0 / 10" }, { text: "-" }]
      - [{ text: DC3, area: dc3 }, { text: "03h:41m:09s" }, { text: "5 / 5" }, { text: "8524" }]
      - [{ text: DC4, area: dc4 }, { text: "193d.06h:12m:40s" }, { text: "5 / 5" }, { text: "8614" }]
      - [{ text: DC5, area: dc5 }, { text: "02h:05m:51s" }, { text: "3 / 5" }, { text: "8453" }]
answer:
  values: { p1: dc5, p2: dc4 }
explanation:
  correct:
    en: "Error 8453 means that replication access was denied: you check the permissions with `dcdiag /test:CheckSecurityError` on both the destination and the source, which points to DC5. Error 8614 means that the time since the last replication with the source exceeded the tombstone lifetime, so replication with DC4 is quarantined; you remove lingering objects before allowing replication with the divergent partner. DC3 has a DNS lookup failure (8524), and DC2 replicates normally."
    fr: "L'erreur 8453 signifie que l'accès à la réplication a été refusé : vous vérifiez les autorisations avec `dcdiag /test:CheckSecurityError` sur la destination et sur la source, ce qui désigne DC5. L'erreur 8614 signifie que le temps écoulé depuis la dernière réplication avec la source a dépassé la durée de vie de désactivation : la réplication avec DC4 est mise en quarantaine, et vous supprimez les objets persistants avant d'autoriser la réplication avec le partenaire divergent. DC3 présente un échec de recherche DNS (8524), et DC2 réplique normalement."
references:
  - title: Active Directory replication error 8453
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/replication-error-8453
  - title: Troubleshoot replication error 8614
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/replication-error-8614
