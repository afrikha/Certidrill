id: az802-7a-logman-csv-order
objective: "7.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A server named **WEB1** runs Windows Server 2025. A load test will run on WEB1 tomorrow. Its start time isn't known in advance.

    You need to record performance counters of WEB1 only while the test runs, in binary format (.blg) so that you can review the log in Performance Monitor. After the test, you must give the application team the same data as a CSV file.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un serveur nommé **WEB1** exécute Windows Server 2025. Un test de charge aura lieu demain sur WEB1. Son heure de début n'est pas connue à l'avance.

    Vous devez enregistrer les compteurs de performances de WEB1 uniquement pendant le test, au format binaire (.blg), afin de pouvoir consulter le journal dans l'Analyseur de performances. Après le test, vous devez fournir les mêmes données à l'équipe applicative sous forme de fichier CSV.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Run `logman create counter` with `-f bin`, the counters and the output path.", fr: "Exécuter `logman create counter` avec `-f bin`, les compteurs et le chemin de sortie." } }
    - { id: start, text: { en: "Run `logman start` when the load test begins.", fr: "Exécuter `logman start` au début du test de charge." } }
    - { id: stop, text: { en: "Run `logman stop` when the load test ends.", fr: "Exécuter `logman stop` à la fin du test de charge." } }
    - { id: relog, text: { en: "Run `relog` with `-f csv` on the .blg file.", fr: "Exécuter `relog` avec `-f csv` sur le fichier .blg." } }
    - { id: export, text: { en: "Run `logman export` with `-xml` on the data collector.", fr: "Exécuter `logman export` avec `-xml` sur le collecteur de données." } }
    - { id: wev, text: { en: "Run `wevtutil epl` on the Application log.", fr: "Exécuter `wevtutil epl` sur le journal Application." } }
answer:
  sequence: [ create, start, stop, relog ]
explanation:
  correct:
    en: |
      `logman create counter` defines the data collector; without begin and end times, `logman start` and `logman stop` control it manually, which fits a test whose time isn't known. With `-f bin` the collector writes a binary log, and `relog -f csv` extracts the counters of that log into a CSV file for the application team.
    fr: |
      `logman create counter` définit le collecteur de données ; sans heures de début et de fin, `logman start` et `logman stop` le pilotent manuellement, ce qui convient à un test dont l'heure n'est pas connue. Avec `-f bin`, le collecteur écrit un journal binaire, et `relog -f csv` extrait les compteurs de ce journal dans un fichier CSV pour l'équipe applicative.
  options:
    export: { en: "logman export saves the data collector set definition as XML, not the collected data.", fr: "logman export enregistre la définition du jeu de collecteurs au format XML, pas les données collectées." }
    wev: { en: "wevtutil epl exports event log entries, not performance counter data.", fr: "wevtutil epl exporte des événements d'un journal, pas des données de compteurs de performances." }
references:
  - title: logman start and logman stop
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/logman-start-stop
  - title: relog
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/relog
