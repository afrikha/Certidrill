id: az802-7a-netlogon-srv
objective: "7.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named contoso.com. After a DNS administrator recreated the _msdcs.contoso.com zone, the domain controller locator records of a domain controller named **DC2** are missing from the zone. The host (A) record of DC2 is present. Dynamic updates are allowed on the zone.

    You need to register the missing records of DC2 as quickly as possible.

    What should you do on DC2?
  fr: |
    Votre réseau contient un domaine Active Directory nommé contoso.com. Après qu'un administrateur DNS a recréé la zone _msdcs.contoso.com, les enregistrements du localisateur de contrôleurs de domaine d'un contrôleur de domaine nommé **DC2** sont absents de la zone. L'enregistrement d'hôte (A) de DC2 est présent. Les mises à jour dynamiques sont autorisées sur la zone.

    Vous devez inscrire le plus rapidement possible les enregistrements manquants de DC2.

    Que devez-vous faire sur DC2 ?
body:
  options:
    - { id: a, text: { en: "Run ipconfig /registerdns.", fr: "Exécuter ipconfig /registerdns." } }
    - { id: b, text: { en: "Restart the Netlogon service.", fr: "Redémarrer le service Netlogon." } }
    - { id: c, text: { en: "Run Clear-DnsClientCache.", fr: "Exécuter Clear-DnsClientCache." } }
    - { id: d, text: { en: "Restart the DNS Client service.", fr: "Redémarrer le service Client DNS." } }
answer: { optionId: b }
explanation:
  correct:
    en: The domain controller locator resource records (the SRV records under _msdcs) are registered by the Netlogon service. Stopping and starting Netlogon (`net stop netlogon && net start netlogon`) initiates their registration manually; then run `dcdiag /test:dns` to confirm.
    fr: "Les enregistrements de ressources du localisateur de contrôleurs de domaine (les enregistrements SRV sous _msdcs) sont inscrits par le service Netlogon. Arrêter puis démarrer Netlogon (`net stop netlogon && net start netlogon`) déclenche manuellement leur inscription ; exécutez ensuite `dcdiag /test:dns` pour le vérifier."
  options:
    a: { en: "ipconfig /registerdns registers the host (A) records of the computer, which are already present, not the locator records.", fr: "ipconfig /registerdns inscrit les enregistrements d'hôte (A) de l'ordinateur, déjà présents, pas les enregistrements du localisateur." }
    c: { en: "Clearing the client cache removes cached answers; it doesn't register any record.", fr: "Vider le cache du client supprime les réponses en cache ; cela n'inscrit aucun enregistrement." }
    d: { en: "The DNS Client service resolves names and registers host records; the locator records come from Netlogon.", fr: "Le service Client DNS résout les noms et inscrit les enregistrements d'hôte ; les enregistrements du localisateur proviennent de Netlogon." }
references:
  - title: Verify DNS Functionality to Support Directory Replication
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/troubleshoot/verify-dns-functionality-to-support-directory-replication
