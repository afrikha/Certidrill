id: az802-7b-recycle-bin-facts
objective: "7.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an AD DS forest named **fabrikam.com** that has two domains: fabrikam.com and sales.fabrikam.com. The forest functional level is Windows Server 2016. Active Directory Recycle Bin was enabled on March 1, 2026.

    The following events occurred:

    - On February 20, 2026, an administrator deleted a user account named **User1** from fabrikam.com.
    - Ten days ago, an administrator deleted a user account named **User2** from fabrikam.com. User2 was a member of groups in both domains.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient une forêt AD DS nommée **fabrikam.com** qui comporte deux domaines : fabrikam.com et sales.fabrikam.com. Le niveau fonctionnel de la forêt est Windows Server 2016. La Corbeille Active Directory a été activée le 1er mars 2026.

    Les événements suivants se sont produits :

    - Le 20 février 2026, un administrateur a supprimé un compte d'utilisateur nommé **User1** de fabrikam.com.
    - Il y a dix jours, un administrateur a supprimé un compte d'utilisateur nommé **User2** de fabrikam.com. User2 était membre de groupes des deux domaines.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can restore User1 from the Deleted Objects container by using Active Directory Administrative Center.
        fr: Vous pouvez restaurer User1 depuis le conteneur Deleted Objects à l'aide du Centre d'administration Active Directory.
    - id: s2
      text:
        en: After you restore User2 by using the Recycle Bin, User2 is again a member of its groups in both domains.
        fr: Après la restauration de User2 avec la Corbeille, User2 est de nouveau membre de ses groupes dans les deux domaines.
    - id: s3
      text:
        en: You can disable the Recycle Bin later to reduce the size of the AD DS database.
        fr: Vous pouvez désactiver la Corbeille plus tard pour réduire la taille de la base de données AD DS.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Only objects deleted after the Recycle Bin was enabled can be restored with it; User1 became a recycled object when the feature was enabled and can only come back through an authoritative restore of a backup taken before March 1. The Recycle Bin preserves all link-valued and non-link-valued attributes, so a restored user regains its group memberships within and across domains. Enabling the Recycle Bin is irreversible."
    fr: "Seuls les objets supprimés après l'activation de la Corbeille peuvent être restaurés avec elle ; User1 est devenu un objet recyclé lors de l'activation et ne peut revenir que par une restauration faisant autorité d'une sauvegarde antérieure au 1er mars. La Corbeille conserve tous les attributs à valeur liée et non liée : un utilisateur restauré retrouve ses appartenances aux groupes, dans son domaine et dans les autres. L'activation de la Corbeille est irréversible."
references:
  - title: Enable and use Active Directory Recycle Bin
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/adac/active-directory-recycle-bin
  - title: Enable-ADOptionalFeature (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/enable-adoptionalfeature
