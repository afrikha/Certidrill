id: az802-7b-vm-agent-facts
objective: "7.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named **VM3** that runs Windows Server 2022. The Custom Script Extension fails to install on VM3, and you sign in to VM3 to investigate the Azure Windows VM Agent.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **VM3** qui exécute Windows Server 2022. L'extension Custom Script Extension ne s'installe pas sur VM3, et vous vous connectez à VM3 pour examiner l'agent de machine virtuelle Azure pour Windows.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The Windows Azure Guest Agent service writes its log to `C:\\WindowsAzure\\Logs\\WaAppAgent.log`."
        fr: "Le service Windows Azure Guest Agent écrit son journal dans `C:\\WindowsAzure\\Logs\\WaAppAgent.log`."
    - id: s2
      text:
        en: An outbound rule that allows TCP 443 to 168.63.129.16 is enough for the Guest Agent to communicate with WireServer.
        fr: Une règle sortante autorisant TCP 443 vers 168.63.129.16 suffit pour que l'agent invité communique avec WireServer.
    - id: s3
      text:
        en: The RdAgent service is responsible for the installation of the Guest Agent.
        fr: Le service RdAgent est responsable de l'installation de l'agent invité.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "The Windows Azure Guest Agent service configures extensions, communicates with the host, and collects its logs in `WaAppAgent.log` under `C:\\WindowsAzure\\Logs`. The Guest Agent needs the WireServer address 168.63.129.16 on ports 80 and 32526, not 443. RdAgent is the service that installs the Guest Agent."
    fr: "Le service Windows Azure Guest Agent configure les extensions, communique avec l'hôte et consigne ses journaux dans `WaAppAgent.log` sous `C:\\WindowsAzure\\Logs`. L'agent invité a besoin de l'adresse WireServer 168.63.129.16 sur les ports 80 et 32526, pas 443. RdAgent est le service qui installe l'agent invité."
references:
  - title: Troubleshoot Azure Windows VM Agent issues
    url: https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-machines/windows/windows-azure-guest-agent
