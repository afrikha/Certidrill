id: az802-cs2c-insights-forecast
objective: "7.1.4"
type: dropdown
caseStudy: az802-cs2c-graphic-design-institute
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the render farm capacity requirement. You plan to run the following commands on each node of GPUCLUS.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence de capacité de la ferme de rendu. Vous prévoyez d'exécuter les commandes suivantes sur chaque nœud de GPUCLUS.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $Cred = Get-Credential
    [[cmd]] -Name [[cap]] -Daily -DaysInterval 2 -At 2:00AM
    Set-InsightsCapabilityAction -Name "CPU capacity forecasting" -Type [[type]] `
        -Action "C:\Scripts\Rebalance.ps1" -ActionCredential $Cred
  slots:
    - id: cmd
      options:
        - { id: invoke, text: Invoke-InsightsCapability }
        - { id: enable, text: Enable-InsightsCapabilitySchedule }
        - { id: set, text: Set-InsightsCapabilitySchedule }
        - { id: cap1, text: Enable-InsightsCapability }
    - id: cap
      options:
        - { id: total, text: "\"Total storage consumption forecasting\"" }
        - { id: cpu, text: "\"CPU capacity forecasting\"" }
        - { id: net, text: "\"Networking capacity forecasting\"" }
    - id: type
      options:
        - { id: warning, text: Warning }
        - { id: error, text: Error }
        - { id: critical, text: Critical }
answer:
  values: { cmd: set, cap: cpu, type: critical }
explanation:
  correct:
    en: |
      System Insights runs locally on Windows Server and needs no cloud connectivity. The CPU capacity forecasting capability predicts CPU usage, and `Set-InsightsCapabilitySchedule` with `-Daily -DaysInterval 2 -At 2:00AM` replaces its default daily schedule at 3:00 AM. `Set-InsightsCapabilityAction -Type Critical` runs the script, with the given credentials, whenever a prediction returns the Critical status.
    fr: |
      System Insights s'exécute localement sur Windows Server et n'a besoin d'aucune connectivité cloud. La fonctionnalité CPU capacity forecasting prévoit l'utilisation du processeur, et `Set-InsightsCapabilitySchedule` avec `-Daily -DaysInterval 2 -At 2:00AM` remplace sa planification quotidienne par défaut à 3 h 00. `Set-InsightsCapabilityAction -Type Critical` exécute le script, avec les informations d'identification fournies, chaque fois qu'une prévision renvoie l'état Critical.
  options:
    invoke:
      en: '`Invoke-InsightsCapability` runs one prediction immediately; it does not define a schedule.'
      fr: '`Invoke-InsightsCapability` exécute une prévision immédiatement ; il ne définit pas de planification.'
    enable:
      en: '`Enable-InsightsCapabilitySchedule` turns the existing schedule on, but it does not change its days or time.'
      fr: '`Enable-InsightsCapabilitySchedule` active la planification existante, mais ne modifie ni ses jours ni son heure.'
    warning:
      en: |
        A Warning action would run the script before the forecast reaches the Critical status.
      fr: |
        Une action Warning exécuterait le script avant que la prévision n'atteigne l'état Critical.
references:
  - title: Manage System Insights capabilities in Windows Admin Center
    url: https://learn.microsoft.com/en-us/windows-server/manage/system-insights/managing-capabilities
  - title: What is System Insights?
    url: https://learn.microsoft.com/en-us/windows-server/manage/system-insights/overview
