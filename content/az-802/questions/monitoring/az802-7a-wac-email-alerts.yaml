id: az802-7a-wac-email-alerts
objective: "7.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You manage an on-premises server named **SRV1** that runs Windows Server 2022 by using a Windows Admin Center gateway. Windows Admin Center isn't registered with Azure yet. You have an Azure subscription.

    You need the operations team to receive an email when the available memory of SRV1 stays below 500 MB.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez un serveur local nommé **SRV1** qui exécute Windows Server 2022 à l'aide d'une passerelle Windows Admin Center. Windows Admin Center n'est pas encore inscrit auprès d'Azure. Vous disposez d'un abonnement Azure.

    L'équipe d'exploitation doit recevoir un e-mail lorsque la mémoire disponible de SRV1 reste inférieure à 500 Mo.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "From the Azure Monitor tool, register with Azure and complete the setup of SRV1.", fr: "Depuis l'outil Azure Monitor, s'inscrire auprès d'Azure et terminer la configuration de SRV1." } }
    - { id: b, text: { en: "From the Overview tool, enable disk metrics on SRV1.", fr: "Depuis l'outil Overview, activer les métriques de disque sur SRV1." } }
    - { id: c, text: { en: "From the Performance Monitor tool, add the Available MBytes counter of SRV1.", fr: "Depuis l'outil Performance Monitor, ajouter le compteur Available MBytes de SRV1." } }
    - { id: d, text: { en: "From the System Insights tool, run CPU capacity forecasting on SRV1.", fr: "Depuis l'outil System Insights, exécuter CPU capacity forecasting sur SRV1." } }
    - { id: e, text: { en: "In the Azure portal, create an alert rule for SRV1 with an email action group.", fr: "Dans le portail Azure, créer une règle d'alerte pour SRV1 avec un groupe d'actions qui envoie un e-mail." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: Windows Admin Center has no alerting engine of its own. Its Azure Monitor tool registers the gateway with Azure and connects the server to a Log Analytics workspace, which starts the collection of performance counters. The email itself comes from an Azure Monitor alert rule created in the Azure portal, with an action group that notifies the team.
    fr: "Windows Admin Center n'a pas de moteur d'alertes propre. Son outil Azure Monitor inscrit la passerelle auprès d'Azure et connecte le serveur à un espace de travail Log Analytics, ce qui démarre la collecte des compteurs de performances. L'e-mail provient d'une règle d'alerte Azure Monitor créée dans le portail Azure, avec un groupe d'actions qui avertit l'équipe."
  options:
    b: { en: "Disk metrics add disk activity to the Overview page; they don't send any notification and don't concern memory.", fr: "Les métriques de disque ajoutent l'activité des disques à la page Overview ; elles n'envoient aucune notification et ne concernent pas la mémoire." }
    c: { en: "The Performance Monitor tool displays counters interactively; it doesn't send email when a value stays below a threshold.", fr: "L'outil Performance Monitor affiche des compteurs de manière interactive ; il n'envoie pas d'e-mail quand une valeur reste sous un seuil." }
    d: { en: "System Insights forecasts capacity; CPU capacity forecasting predicts processor usage, not current low memory.", fr: "System Insights prévoit la capacité ; CPU capacity forecasting prévoit l'utilisation du processeur, pas un manque de mémoire actuel." }
references:
  - title: Monitor servers and configure alerts with Azure Monitor from Windows Admin Center
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/azure/azure-monitor
