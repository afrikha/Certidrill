id: az802-7b-sysvol-nonauth
objective: "7.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Your AD DS domain has four domain controllers, and SYSVOL is replicated by DFS Replication. On a domain controller named **DC2**, several Group Policy template folders are missing from SYSVOL. SYSVOL is healthy on the other domain controllers.

    You need to perform a nonauthoritative synchronization of SYSVOL on DC2. You open the `CN=SYSVOL Subscription,CN=Domain System Volume,CN=DFSR-LocalSettings,CN=DC2,OU=Domain Controllers,DC=contoso,DC=com` object in ADSI Edit.

    How should you complete the procedure? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre domaine AD DS compte quatre contrôleurs de domaine, et SYSVOL est répliqué par la réplication DFS. Sur un contrôleur de domaine nommé **DC2**, plusieurs dossiers de modèles de stratégie de groupe manquent dans SYSVOL. SYSVOL est sain sur les autres contrôleurs de domaine.

    Vous devez effectuer une synchronisation de SYSVOL ne faisant pas autorité sur DC2. Vous ouvrez l'objet `CN=SYSVOL Subscription,CN=Domain System Volume,CN=DFSR-LocalSettings,CN=DC2,OU=Domain Controllers,DC=contoso,DC=com` dans ADSI Edit.

    Comment devez-vous compléter la procédure ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      1. Set [[attr]] to FALSE, force Active Directory replication, and then run [[cmd]] on DC2.
      2. Wait for event [[evt]] in the DFS Replication log of DC2.
      3. Set the attribute back to TRUE, force Active Directory replication, run the same command again, and wait for events 4614 and 4604.
    fr: |
      1. Définir [[attr]] sur FALSE, forcer la réplication Active Directory, puis exécuter [[cmd]] sur DC2.
      2. Attendre l'événement [[evt]] dans le journal DFS Replication de DC2.
      3. Remettre l'attribut sur TRUE, forcer la réplication Active Directory, exécuter de nouveau la même commande, puis attendre les événements 4614 et 4604.
  slots:
    - id: attr
      options:
        - { id: options, text: msDFSR-Options }
        - { id: enabled, text: msDFSR-Enabled }
    - id: cmd
      options:
        - { id: gpupdate, text: "gpupdate /force" }
        - { id: syncall, text: "repadmin /syncall" }
        - { id: pollad, text: "dfsrdiag pollad" }
    - id: evt
      options:
        - { id: e4602, text: "4602" }
        - { id: e4114, text: "4114" }
        - { id: e2042, text: "2042" }
answer:
  values: { attr: enabled, cmd: pollad, evt: e4114 }
explanation:
  correct:
    en: "A nonauthoritative synchronization disables SYSVOL replication on DC2 by setting `msDFSR-Enabled` to FALSE, makes DFSR read the change from AD DS with `dfsrdiag pollad`, and waits for event 4114, which shows that SYSVOL is no longer replicated. When the attribute returns to TRUE, events 4614 and 4604 show that DC2 initialized SYSVOL again from a healthy partner."
    fr: "Une synchronisation ne faisant pas autorité désactive la réplication de SYSVOL sur DC2 en définissant `msDFSR-Enabled` sur FALSE, fait lire la modification dans AD DS par DFSR avec `dfsrdiag pollad`, puis attend l'événement 4114, qui indique que SYSVOL n'est plus répliqué. Quand l'attribut revient à TRUE, les événements 4614 et 4604 montrent que DC2 a de nouveau initialisé SYSVOL depuis un partenaire sain."
  options:
    options: { en: "Setting msDFSR-Options to 1 marks a domain controller as authoritative, the opposite of what DC2 needs.", fr: "Définir msDFSR-Options sur 1 marque un contrôleur de domaine comme faisant autorité, l'inverse de ce dont DC2 a besoin." }
    syncall: { en: "repadmin /syncall forces AD replication, but DFSR still has to poll AD DS to pick up the change.", fr: "repadmin /syncall force la réplication AD, mais DFSR doit encore interroger AD DS pour prendre en compte la modification." }
    e2042: { en: "Event 2042 is an NTDS replication event about the tombstone lifetime, not a DFS Replication event.", fr: "L'événement 2042 est un événement de réplication NTDS lié à la durée de vie de désactivation, pas un événement de la réplication DFS." }
    e4602: { en: "Event 4602 marks the initialization of an authoritative SYSVOL.", fr: "L'événement 4602 signale l'initialisation d'un SYSVOL faisant autorité." }
references:
  - title: How to force authoritative and non-authoritative synchronization for DFSR-replicated sysvol replication
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/group-policy/force-authoritative-non-authoritative-synchronization
