id: az802-7a-wu-errors-match
objective: "7.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Several servers that run Windows Server 2022 fail to scan for or install updates. Each server reports a different error code.

    Which action should you perform first for each error code? To answer, drag the appropriate actions to the correct error codes. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Plusieurs serveurs qui exécutent Windows Server 2022 ne parviennent pas à rechercher ou à installer des mises à jour. Chaque serveur signale un code d'erreur différent.

    Quelle action devez-vous effectuer en premier pour chaque code d'erreur ? Pour répondre, faites glisser les actions appropriées vers les codes d'erreur correspondants. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: svc, text: { en: "Check that the Windows Update service is running.", fr: "Vérifier que le service Windows Update est en cours d'exécution." } }
    - { id: net, text: { en: "Check that the server can reach its update source, such as the WSUS server.", fr: "Vérifier que le serveur peut joindre sa source de mises à jour, comme le serveur WSUS." } }
    - { id: dism, text: { en: "Repair the component store with DISM RestoreHealth, then run sfc /scannow.", fr: "Réparer le magasin de composants avec DISM RestoreHealth, puis exécuter sfc /scannow." } }
    - { id: tls, text: { en: "Configure TLS 1.2 correctly on the server.", fr: "Configurer correctement TLS 1.2 sur le serveur." } }
    - { id: cbs, text: { en: "Search CBS.log for the object whose permissions deny access.", fr: "Rechercher dans CBS.log l'objet dont les autorisations refusent l'accès." } }
  targets:
    - { id: e422, text: "0x80070422" }
    - { id: e2ee2, text: "0x80072EE2" }
    - { id: e81f, text: "0x800f081f" }
    - { id: e2f8f, text: "0x80072F8F" }
answer:
  mapping: { e422: svc, e2ee2: net, e81f: dism, e2f8f: tls }
explanation:
  correct:
    en: 0x80070422 (ERROR_SERVICE_DISABLED) occurs when the Windows Update service isn't running. 0x80072EE2 (WININET_E_TIMEOUT) means the agent couldn't connect to Windows Update, WSUS or another update source. 0x800f081f (CBS_E_SOURCE_MISSING) indicates component store corruption, fixed with DISM RestoreHealth followed by sfc /scannow. 0x80072F8F (WININET_E_DECODING_FAILED) means TLS 1.2 isn't configured correctly.
    fr: 0x80070422 (ERROR_SERVICE_DISABLED) survient lorsque le service Windows Update ne s'exécute pas. 0x80072EE2 (WININET_E_TIMEOUT) signifie que l'agent n'a pas pu se connecter à Windows Update, à WSUS ou à une autre source de mises à jour. 0x800f081f (CBS_E_SOURCE_MISSING) indique un endommagement du magasin de composants, corrigé par DISM RestoreHealth suivi de sfc /scannow. 0x80072F8F (WININET_E_DECODING_FAILED) signifie que TLS 1.2 n'est pas configuré correctement.
  options:
    cbs: { en: "Searching CBS.log for an access denial is the first step for 0x80070005 (E_ACCESSDENIED), which isn't listed.", fr: "Rechercher un refus d'accès dans CBS.log est la première étape pour 0x80070005 (E_ACCESSDENIED), qui ne figure pas dans la liste." }
references:
  - title: Common Windows Update errors
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-client/installing-updates-features-roles/common-windows-update-errors
