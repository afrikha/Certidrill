id: az802-7a-get-counter-remote
objective: "7.1.1"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You manage two servers named **SQL1** and **SQL2** that run Windows Server 2022.

    From a management server, you need to sample the available memory of both servers every 10 seconds for 5 minutes, without configuring PowerShell remoting on SQL1 and SQL2.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez deux serveurs nommés **SQL1** et **SQL2** qui exécutent Windows Server 2022.

    Depuis un serveur d'administration, vous devez échantillonner la mémoire disponible des deux serveurs toutes les 10 secondes pendant 5 minutes, sans configurer la communication à distance PowerShell sur SQL1 et SQL2.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Get-Counter -ComputerName SQL1, SQL2 -Counter [[ctr]] -SampleInterval 10 [[count]] [[num]]
  slots:
    - id: ctr
      options:
        - { id: pages, text: '"\Memory\Pages/sec"' }
        - { id: cpu, text: '"\Processor(_Total)\% Processor Time"' }
        - { id: avail, text: '"\Memory\Available MBytes"' }
        - { id: queue, text: '"\System\Processor Queue Length"' }
    - id: count
      options:
        - { id: cont, text: -Continuous }
        - { id: max, text: -MaxSamples }
        - { id: list, text: -ListSet }
    - id: num
      options:
        - { id: n5, text: "5" }
        - { id: n10, text: "10" }
        - { id: n30, text: "30" }
        - { id: n300, text: "300" }
answer:
  values: { ctr: avail, count: max, num: n30 }
explanation:
  correct:
    en: "`Get-Counter -ComputerName` queries remote computers without relying on PowerShell remoting. `\\Memory\\Available MBytes` measures free physical memory. `-MaxSamples 30` with `-SampleInterval 10` takes 30 samples, 10 seconds apart, which covers 5 minutes."
    fr: "`Get-Counter -ComputerName` interroge des ordinateurs distants sans dépendre de la communication à distance PowerShell. `\\Memory\\Available MBytes` mesure la mémoire physique libre. `-MaxSamples 30` avec `-SampleInterval 10` prend 30 échantillons espacés de 10 secondes, soit 5 minutes."
  options:
    n300: { en: "300 samples 10 seconds apart would last 50 minutes, not 5.", fr: "300 échantillons espacés de 10 secondes dureraient 50 minutes, pas 5." }
    n5: { en: "5 samples 10 seconds apart cover less than one minute.", fr: "5 échantillons espacés de 10 secondes couvrent moins d'une minute." }
    pages: { en: "Pages/sec measures paging activity, not the amount of available memory.", fr: "Pages/sec mesure l'activité de pagination, pas la quantité de mémoire disponible." }
    cont: { en: "-Continuous samples until you press CTRL+C and doesn't take a sample count.", fr: "-Continuous échantillonne jusqu'à ce que vous appuyiez sur CTRL+C et ne prend pas de nombre d'échantillons." }
    list: { en: "-ListSet lists counter sets; it can't be combined with sampling parameters.", fr: "-ListSet liste les jeux de compteurs ; il ne peut pas être combiné avec les paramètres d'échantillonnage." }
references:
  - title: Get-Counter (Microsoft.PowerShell.Diagnostics)
    url: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.diagnostics/get-counter
