id: az802-7a-vminsights-arc-prereq
objective: "7.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your on-premises Hyper-V cluster hosts 12 virtual machines that run Windows Server 2022. You have an Azure subscription.

    You need to analyze the performance of the 12 virtual machines in VM insights together with your Azure virtual machines.

    What should you install first on each on-premises virtual machine?
  fr: |
    Votre cluster Hyper-V local héberge 12 machines virtuelles qui exécutent Windows Server 2022. Vous disposez d'un abonnement Azure.

    Vous devez analyser les performances des 12 machines virtuelles dans VM insights avec vos machines virtuelles Azure.

    Que devez-vous installer en premier sur chaque machine virtuelle locale ?
body:
  options:
    - { id: a, text: { en: "The Azure Connected Machine agent", fr: "L'agent Azure Connected Machine" } }
    - { id: b, text: { en: "The Log Analytics agent", fr: "L'agent Log Analytics" } }
    - { id: c, text: { en: "The Dependency agent", fr: "L'agent Dependency" } }
    - { id: d, text: { en: "The Azure VM agent", fr: "L'agent de machine virtuelle Azure" } }
answer: { optionId: a }
explanation:
  correct:
    en: Machines hosted outside Azure must first be connected to Azure Arc with the Connected Machine agent. Once they're Azure Arc-enabled servers, the Azure Monitor Agent can be installed and associated with the VM insights data collection rule, like on Azure virtual machines.
    fr: Les machines hébergées hors d'Azure doivent d'abord être connectées à Azure Arc avec l'agent Connected Machine. Une fois devenues des serveurs avec Azure Arc, elles peuvent recevoir l'agent Azure Monitor et être associées à la règle de collecte de données de VM insights, comme les machines virtuelles Azure.
  options:
    b: { en: "The Log Analytics agent is retired; VM insights uses the Azure Monitor Agent.", fr: "L'agent Log Analytics est mis hors service ; VM insights utilise l'agent Azure Monitor." }
    c: { en: "The Dependency agent only feeds the Map feature, which retires with it on June 30, 2028, and it doesn't connect a machine to Azure.", fr: "L'agent Dependency alimente seulement la fonctionnalité Map, mise hors service avec lui le 30 juin 2028, et il ne connecte pas une machine à Azure." }
    d: { en: "The Azure VM agent runs on Azure virtual machines; on-premises machines are managed through the Connected Machine agent.", fr: "L'agent de machine virtuelle Azure s'exécute sur les machines virtuelles Azure ; les machines locales sont gérées par l'agent Connected Machine." }
references:
  - title: Enable VM monitoring in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vm-enable-monitoring
