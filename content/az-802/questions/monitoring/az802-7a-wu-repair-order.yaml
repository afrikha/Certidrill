id: az802-7a-wu-repair-order
objective: "7.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A server named **SRV12** runs Windows Server 2025 and has internet access. The installation of a cumulative update fails with error **0x800f0831** (CBS_E_STORE_CORRUPTION).

    You need to repair the server so that the update can be installed.

    Which three actions should you perform in sequence before you retry the update? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un serveur nommé **SRV12** exécute Windows Server 2025 et dispose d'un accès à Internet. L'installation d'une mise à jour cumulative échoue avec l'erreur **0x800f0831** (CBS_E_STORE_CORRUPTION).

    Vous devez réparer le serveur pour que la mise à jour puisse être installée.

    Quelles sont les trois actions à effectuer dans l'ordre avant de relancer la mise à jour ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: dism, text: { en: "Run `Dism.exe /Online /Cleanup-Image /RestoreHealth` from an elevated prompt.", fr: "Exécuter `Dism.exe /Online /Cleanup-Image /RestoreHealth` depuis une invite avec élévation." } }
    - { id: sfc, text: { en: "Run `sfc /scannow` from an elevated prompt.", fr: "Exécuter `sfc /scannow` depuis une invite avec élévation." } }
    - { id: restart, text: { en: "Restart SRV12.", fr: "Redémarrer SRV12." } }
    - { id: chkdsk, text: { en: "Run `chkdsk C: /f` and schedule it at the next restart.", fr: "Exécuter `chkdsk C: /f` et le planifier au prochain redémarrage." } }
    - { id: log, text: { en: "Run `Get-WindowsUpdateLog`.", fr: "Exécuter `Get-WindowsUpdateLog`." } }
    - { id: svc, text: { en: "Set the startup type of the Windows Update service to Disabled.", fr: "Définir le type de démarrage du service Windows Update sur Disabled." } }
answer:
  sequence: [ dism, sfc, restart ]
explanation:
  correct:
    en: |
      Error 0x800f0831 means that the Windows component store is corrupted. Microsoft's mitigation is to repair the component store with `Dism /Online /Cleanup-Image /RestoreHealth` first, then run `sfc /scannow`, which relies on the repaired store to fix protected system files, and finally restart the server before retrying the update.
    fr: |
      L'erreur 0x800f0831 signifie que le magasin de composants Windows est endommagé. La correction recommandée par Microsoft consiste à réparer d'abord le magasin de composants avec `Dism /Online /Cleanup-Image /RestoreHealth`, puis à exécuter `sfc /scannow`, qui s'appuie sur le magasin réparé pour corriger les fichiers système protégés, et enfin à redémarrer le serveur avant de relancer la mise à jour.
  options:
    chkdsk: { en: "chkdsk repairs file system errors on a volume, not corruption of the component store.", fr: "chkdsk répare les erreurs du système de fichiers d'un volume, pas l'endommagement du magasin de composants." }
    log: { en: "Get-WindowsUpdateLog only produces a log to analyze; it repairs nothing.", fr: "Get-WindowsUpdateLog produit seulement un journal à analyser ; il ne répare rien." }
    svc: { en: "A disabled Windows Update service makes updates fail with 0x80070422.", fr: "Un service Windows Update désactivé fait échouer les mises à jour avec 0x80070422." }
references:
  - title: Common Windows Update errors
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-client/installing-updates-features-roles/common-windows-update-errors
