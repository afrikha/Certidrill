id: az802-cs3a-restore-ou
objective: "7.3.1"
type: single
caseStudy: az802-cs3a-bellows-college
difficulty: 1
status: draft
stem:
  en: |
    You need to recover the Research OU and its user accounts, including their group memberships. The solution must meet the recovery requirement. What should you do first?
  fr: |
    Vous devez récupérer l'UO Research et ses comptes d'utilisateur, y compris leurs appartenances aux groupes. La solution doit respecter l'exigence de récupération. Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Restore the deleted Research OU object by running Restore-ADObject", fr: "Restaurer l'objet UO Research supprimé en exécutant Restore-ADObject" } }
    - { id: b, text: { en: "Restore the 25 deleted user objects by running Restore-ADObject", fr: "Restaurer les 25 objets utilisateur supprimés en exécutant Restore-ADObject" } }
    - { id: c, text: { en: "Perform an authoritative restore of the Research OU by using ntdsutil", fr: "Effectuer une restauration faisant autorité de l'UO Research à l'aide de ntdsutil" } }
    - { id: d, text: { en: "Enable the Recycle Bin feature by running Enable-ADOptionalFeature", fr: "Activer la fonctionnalité Corbeille en exécutant Enable-ADOptionalFeature" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Active Directory Recycle Bin was enabled before the deletion, so the OU and its users are deleted objects that keep all their attributes, including group memberships. A child object can be restored only into an existing parent, so you restore the Research OU first and then the user objects whose lastKnownParent is that OU, without restarting any domain controller.
    fr: |
      La Corbeille Active Directory était activée avant la suppression : l'UO et ses utilisateurs sont donc des objets supprimés qui conservent tous leurs attributs, y compris les appartenances aux groupes. Un objet enfant ne peut être restauré que dans un parent existant : vous restaurez donc d'abord l'UO Research, puis les objets utilisateur dont lastKnownParent est cette UO, sans redémarrer aucun contrôleur de domaine.
  options:
    b:
      en: |
        The users cannot be restored before their parent container exists again; the Research OU must be restored first.
      fr: |
        Les utilisateurs ne peuvent pas être restaurés avant que leur conteneur parent existe de nouveau ; l'UO Research doit être restaurée en premier.
    c:
      en: |
        An authoritative restore requires starting a domain controller in Directory Services Restore Mode, which violates the recovery requirement.
      fr: |
        Une restauration faisant autorité impose de démarrer un contrôleur de domaine en mode de restauration des services d'annuaire, ce qui enfreint l'exigence de récupération.
    d:
      en: |
        The Recycle Bin was enabled in 2023 and cannot be enabled twice; it is already available.
      fr: |
        La Corbeille a été activée en 2023 et ne peut pas être activée une seconde fois ; elle est déjà disponible.
references:
  - title: Enable Active Directory Recycle Bin in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/adac/active-directory-recycle-bin
