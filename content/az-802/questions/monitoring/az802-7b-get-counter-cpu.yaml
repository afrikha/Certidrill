id: az802-7b-get-counter-cpu
objective: "7.2.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Users report that an application on a server named **APP1** becomes slow for a few minutes several times a day. You are signed in to a management server named **MGMT1**.

    You need to collect the total processor usage of APP1 from MGMT1 every 10 seconds for five minutes.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les utilisateurs signalent qu'une application d'un serveur nommé **APP1** devient lente pendant quelques minutes plusieurs fois par jour. Vous êtes connecté à un serveur d'administration nommé **MGMT1**.

    Vous devez collecter depuis MGMT1 l'utilisation totale du processeur d'APP1 toutes les 10 secondes pendant cinq minutes.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Get-Counter -Counter [[path]] -ComputerName APP1 [[interval]] 10 [[count]] 30
  slots:
    - id: path
      options:
        - { id: mem, text: "\"\\Memory\\Available MBytes\"" }
        - { id: cpu, text: "\"\\Processor(_Total)\\% Processor Time\"" }
        - { id: queue, text: "\"\\PhysicalDisk(_Total)\\Avg. Disk Queue Length\"" }
    - id: interval
      options:
        - { id: max, text: -MaxSamples }
        - { id: continuous, text: -Continuous }
        - { id: sample, text: -SampleInterval }
    - id: count
      options:
        - { id: max2, text: -MaxSamples }
        - { id: sample2, text: -SampleInterval }
        - { id: listset, text: -ListSet }
answer:
  values: { path: cpu, interval: sample, count: max2 }
explanation:
  correct:
    en: "`\\Processor(_Total)\\% Processor Time` measures the total processor usage. `-SampleInterval 10` sets 10 seconds between samples (the default is one second), and `-MaxSamples 30` stops after 30 samples, which covers five minutes. `-ComputerName` queries the remote server without PowerShell remoting."
    fr: "`\\Processor(_Total)\\% Processor Time` mesure l'utilisation totale du processeur. `-SampleInterval 10` fixe 10 secondes entre les échantillons (la valeur par défaut est d'une seconde), et `-MaxSamples 30` s'arrête après 30 échantillons, soit cinq minutes. `-ComputerName` interroge le serveur distant sans communication à distance PowerShell."
  options:
    continuous: { en: "-Continuous is a switch that collects until you press CTRL+C; it takes no value.", fr: "-Continuous est un commutateur qui collecte jusqu'à ce que vous appuyiez sur CTRL+C ; il ne prend pas de valeur." }
    listset: { en: "-ListSet lists counter sets instead of collecting samples.", fr: "-ListSet liste des jeux de compteurs au lieu de collecter des échantillons." }
    mem: { en: "Available MBytes measures free memory, not processor usage.", fr: "Available MBytes mesure la mémoire disponible, pas l'utilisation du processeur." }
    queue: { en: "The disk queue length measures storage pressure, not processor usage.", fr: "La longueur de file d'attente du disque mesure la pression sur le stockage, pas l'utilisation du processeur." }
references:
  - title: Get-Counter (Microsoft.PowerShell.Diagnostics)
    url: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.diagnostics/get-counter
