id: az802-7a-wac-insights-version
objective: "7.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You use Windows Admin Center to manage the following file servers.

    | Server | Operating system |
    | --- | --- |
    | FS1 | Windows Server 2016 |
    | FS2 | Windows Server 2019 |
    | FS3 | Windows Server 2022 |

    You need to see, from Windows Admin Center, a forecast of the storage consumption of each volume on every file server. The forecast must be computed locally on the servers, without sending data to the cloud.

    What should you do first?
  fr: |
    Vous utilisez Windows Admin Center pour gérer les serveurs de fichiers suivants.

    | Serveur | Système d'exploitation |
    | --- | --- |
    | FS1 | Windows Server 2016 |
    | FS2 | Windows Server 2019 |
    | FS3 | Windows Server 2022 |

    Vous devez voir, depuis Windows Admin Center, une prévision de la consommation de stockage de chaque volume sur tous les serveurs de fichiers. La prévision doit être calculée localement sur les serveurs, sans envoyer de données vers le cloud.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Register Windows Admin Center with Azure and connect FS1 to Azure Monitor.", fr: "Inscrire Windows Admin Center auprès d'Azure et connecter FS1 à Azure Monitor." } }
    - { id: b, text: { en: "Upgrade FS1 to Windows Server 2019 or later.", fr: "Mettre à niveau FS1 vers Windows Server 2019 ou une version ultérieure." } }
    - { id: c, text: { en: "Create a performance counter data collector set on FS1.", fr: "Créer un jeu de collecteurs de données de compteur de performance sur FS1." } }
    - { id: d, text: { en: "Enable disk metrics on FS1 from the Overview tool.", fr: "Activer les métriques de disque sur FS1 depuis l'outil Overview." } }
answer: { optionId: b }
explanation:
  correct:
    en: The volume consumption forecast comes from System Insights, which runs locally and requires Windows Server 2019 or later. FS2 and FS3 already support it; FS1 must be upgraded before the System Insights tool can show its forecasts.
    fr: La prévision de consommation des volumes provient de System Insights, qui s'exécute localement et exige Windows Server 2019 ou une version ultérieure. FS2 et FS3 le prennent déjà en charge ; FS1 doit être mis à niveau avant que l'outil System Insights puisse afficher ses prévisions.
  options:
    a:
      en: Azure Monitor collects and analyzes data in the cloud, which the requirement excludes, and it doesn't add System Insights to Windows Server 2016.
      fr: Azure Monitor collecte et analyse les données dans le cloud, ce que l'exigence exclut, et il n'ajoute pas System Insights à Windows Server 2016.
    c:
      en: A data collector set records counters but doesn't forecast future consumption.
      fr: Un jeu de collecteurs de données enregistre des compteurs mais ne prévoit pas la consommation future.
    d:
      en: Disk metrics show current disk activity on the Overview page, not a forecast of volume consumption.
      fr: Les métriques de disque affichent l'activité actuelle des disques sur la page Overview, pas une prévision de consommation des volumes.
references:
  - title: What is System Insights?
    url: https://learn.microsoft.com/en-us/windows-server/manage/system-insights/overview
  - title: Manage Servers with Windows Admin Center
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/use/manage-servers
