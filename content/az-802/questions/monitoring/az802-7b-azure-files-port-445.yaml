id: az802-7b-azure-files-port-445
objective: "7.2.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an on-premises server named **Server6** that runs Windows Server 2022. You try to map an Azure file share named **share1** in a storage account named **stcontoso** by running `net use Z: \\stcontoso.file.core.windows.net\share1`, and you receive "System error 53 has occurred. The network path was not found."

    On Server6, `Test-NetConnection -ComputerName stcontoso.file.core.windows.net -Port 445` returns `TcpTestSucceeded : False`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur local nommé **Server6** qui exécute Windows Server 2022. Vous tentez de mapper un partage de fichiers Azure nommé **share1** d'un compte de stockage nommé **stcontoso** en exécutant `net use Z: \\stcontoso.file.core.windows.net\share1`, et vous recevez « System error 53 has occurred. The network path was not found. »

    Sur Server6, `Test-NetConnection -ComputerName stcontoso.file.core.windows.net -Port 445` renvoie `TcpTestSucceeded : False`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The error can be caused by your ISP or by your perimeter firewall blocking outbound TCP 445.
        fr: L'erreur peut être due à votre fournisseur d'accès Internet ou à votre pare-feu de périmètre qui bloque le port TCP 445 sortant.
    - id: s2
      text:
        en: Allowing outbound TCP 443 to Azure lets Server6 map share1 by using SMB.
        fr: Autoriser le port TCP 443 sortant vers Azure permet à Server6 de mapper share1 avec SMB.
    - id: s3
      text:
        en: A site-to-site VPN to Azure, with share1 exposed through a private endpoint, lets Server6 reach share1 without sending SMB traffic over the internet.
        fr: Un VPN site à site vers Azure, avec share1 exposé par un point de terminaison privé, permet à Server6 d'atteindre share1 sans envoyer de trafic SMB sur Internet.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "System error 53 or 67 occurs when outbound communication on port 445 to the Azure Files datacenter is blocked, which the failed `Test-NetConnection` confirms. SMB always uses port 445, so opening 443 only helps REST-based tools, not `net use`. With a VPN or ExpressRoute and a private endpoint, the SMB traffic goes through the tunnel to an internal address instead of the internet."
    fr: "Les erreurs système 53 ou 67 surviennent lorsque la communication sortante sur le port 445 vers le centre de données Azure Files est bloquée, ce que confirme l'échec de `Test-NetConnection`. SMB utilise toujours le port 445 : ouvrir le port 443 n'aide que les outils basés sur REST, pas `net use`. Avec un VPN ou ExpressRoute et un point de terminaison privé, le trafic SMB passe par le tunnel vers une adresse interne au lieu d'Internet."
references:
  - title: Troubleshoot Azure Files connectivity and access problems (SMB)
    url: https://learn.microsoft.com/en-us/troubleshoot/azure/azure-storage/files/connectivity/files-troubleshoot-smb-connectivity
