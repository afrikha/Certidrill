id: az802-7b-auth-restore-order
objective: "7.3.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Your AD DS domain named **contoso.com** has three domain controllers: DC1, DC2, and DC3. Active Directory Recycle Bin isn't enabled.

    This morning, an administrator deleted the **Sales** OU and all the objects it contained. The deletion has replicated to all the domain controllers. You have a system state backup of DC1 taken last night.

    You need to recover the Sales OU and its objects by using the backup.

    Which four actions should you perform in sequence on DC1? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Votre domaine AD DS nommé **contoso.com** compte trois contrôleurs de domaine : DC1, DC2 et DC3. La Corbeille Active Directory n'est pas activée.

    Ce matin, un administrateur a supprimé l'UO **Sales** et tous les objets qu'elle contenait. La suppression a été répliquée sur tous les contrôleurs de domaine. Vous disposez d'une sauvegarde de l'état du système de DC1 effectuée la nuit dernière.

    Vous devez récupérer l'UO Sales et ses objets à l'aide de la sauvegarde.

    Quelles sont les quatre actions à effectuer dans l'ordre sur DC1 ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: dsrm, text: { en: "Restart DC1 in Directory Services Restore Mode and sign in by using the DSRM password.", fr: "Redémarrer DC1 en mode de restauration des services d'annuaire et se connecter avec le mot de passe DSRM." } }
    - { id: restore, text: { en: "Restore the system state backup by using Windows Server Backup, without restarting.", fr: "Restaurer la sauvegarde de l'état du système avec la Sauvegarde Windows Server, sans redémarrer." } }
    - { id: mark, text: { en: "Run ntdsutil to mark the Sales OU and its contents as authoritative.", fr: "Exécuter ntdsutil pour marquer l'UO Sales et son contenu comme faisant autorité." } }
    - { id: restart, text: { en: "Restart DC1 normally.", fr: "Redémarrer DC1 normalement." } }
    - { id: stopntds, text: { en: "Stop the Active Directory Domain Services service on DC1.", fr: "Arrêter le service Services de domaine Active Directory sur DC1." } }
    - { id: rb, text: { en: "Enable the Recycle Bin, and then run Restore-ADObject for the Sales OU.", fr: "Activer la Corbeille, puis exécuter Restore-ADObject pour l'UO Sales." } }
answer:
  sequence: [ dsrm, restore, mark, restart ]
explanation:
  correct:
    en: "Restoring AD DS requires full access to the database files, so DC1 restarts in DSRM, where you sign in as Administrator with the DSRM password. A normal restore alone would be overwritten by the deletion replicated from DC2 and DC3, so before restarting you mark the restored objects as authoritative with ntdsutil, which raises their version numbers above those of the other domain controllers. Then you restart DC1 normally and the objects replicate out."
    fr: "La restauration d'AD DS exige un accès complet aux fichiers de la base : DC1 redémarre donc en DSRM, où vous vous connectez en tant qu'Administrator avec le mot de passe DSRM. Une restauration normale seule serait écrasée par la suppression répliquée depuis DC2 et DC3 : avant de redémarrer, vous marquez donc les objets restaurés comme faisant autorité avec ntdsutil, ce qui élève leurs numéros de version au-dessus de ceux des autres contrôleurs de domaine. Vous redémarrez ensuite DC1 normalement et les objets se répliquent."
  options:
    stopntds: { en: "The AD DS Stopped state of restartable AD DS isn't the state used to restore the directory from a backup; restoring requires DSRM.", fr: "L'état AD DS arrêté d'AD DS redémarrable n'est pas l'état utilisé pour restaurer l'annuaire depuis une sauvegarde ; la restauration exige le DSRM." }
    rb: { en: "Objects deleted before the Recycle Bin is enabled can't be recovered with it.", fr: "Les objets supprimés avant l'activation de la Corbeille ne peuvent pas être récupérés avec elle." }
references:
  - title: Recover the AD DS database
    url: https://learn.microsoft.com/en-us/training/modules/troubleshoot-active-directory/3-recover-active-directory-domain-services-database
  - title: Enable-ADOptionalFeature (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/enable-adoptionalfeature
