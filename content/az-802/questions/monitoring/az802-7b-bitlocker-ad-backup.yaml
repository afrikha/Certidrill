id: az802-7b-bitlocker-ad-backup
objective: "7.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a domain-joined file server named **FS2** that runs Windows Server 2022. The operating system volume of FS2 was encrypted by using BitLocker before your team linked a GPO that saves BitLocker recovery information to AD DS.

    When FS2 entered BitLocker recovery last week, the help desk couldn't find its recovery password in AD DS.

    You need to store the existing recovery password of the operating system volume in AD DS. The solution must not change the key protectors of the volume.

    Which cmdlet should you run on FS2 after you retrieve the ID of the recovery password protector?
  fr: |
    Vous disposez d'un serveur de fichiers joint au domaine nommé **FS2** qui exécute Windows Server 2022. Le volume du système d'exploitation de FS2 a été chiffré avec BitLocker avant que votre équipe lie un GPO qui enregistre les informations de récupération BitLocker dans AD DS.

    Lorsque FS2 est passé en récupération BitLocker la semaine dernière, le support technique n'a pas trouvé son mot de passe de récupération dans AD DS.

    Vous devez stocker dans AD DS le mot de passe de récupération existant du volume du système d'exploitation. La solution ne doit pas modifier les protecteurs de clé du volume.

    Quelle cmdlet devez-vous exécuter sur FS2 après avoir récupéré l'ID du protecteur de mot de passe de récupération ?
body:
  options:
    - { id: a, text: "BackupToAAD-BitLockerKeyProtector" }
    - { id: b, text: "Backup-BitLockerKeyProtector" }
    - { id: c, text: "Add-BitLockerKeyProtector" }
    - { id: d, text: "Resume-BitLocker" }
answer: { optionId: b }
explanation:
  correct:
    en: "Recovery password backup should be configured before BitLocker is enabled, but it can also be done after encryption. You get the ID of the RecoveryPassword protector from `Get-BitLockerVolume`, then run `Backup-BitLockerKeyProtector -MountPoint $env:SystemDrive -KeyProtectorId \"{ID}\"` to save that existing password in AD DS."
    fr: "La sauvegarde du mot de passe de récupération doit être configurée avant l'activation de BitLocker, mais elle peut aussi être faite après le chiffrement. Vous obtenez l'ID du protecteur RecoveryPassword avec `Get-BitLockerVolume`, puis vous exécutez `Backup-BitLockerKeyProtector -MountPoint $env:SystemDrive -KeyProtectorId \"{ID}\"` pour enregistrer ce mot de passe existant dans AD DS."
  options:
    a: { en: "This cmdlet backs up the protector to Microsoft Entra ID, not to AD DS.", fr: "Cette cmdlet sauvegarde le protecteur dans Microsoft Entra ID, pas dans AD DS." }
    c: { en: "Adding a protector changes the key protectors of the volume, which the requirement forbids.", fr: "Ajouter un protecteur modifie les protecteurs de clé du volume, ce que l'exigence interdit." }
    d: { en: "Resume-BitLocker re-enables a suspended protection; it doesn't copy anything to AD DS.", fr: "Resume-BitLocker réactive une protection suspendue ; il ne copie rien dans AD DS." }
references:
  - title: BitLocker operations guide
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/operations-guide
  - title: BitLocker recovery overview
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/recovery-overview
