id: az802-7b-hyperv-dc-time
objective: "7.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your AD DS domain named contoso.com contains a domain controller named **DC2** that runs as a virtual machine on a Hyper-V host named **HV1**. DC2 doesn't hold the PDC emulator role. HV1 is a workgroup server whose clock is often several minutes fast.

    The clock of DC2 follows the clock of HV1. On DC2, `w32tm /query /source` returns `VM IC Time Synchronization Provider`, and `w32tm /query /configuration` shows `Type: NT5DS`.

    You need DC2 to synchronize its time from the domain hierarchy.

    What should you do?
  fr: |
    Votre domaine AD DS nommé contoso.com contient un contrôleur de domaine nommé **DC2** qui s'exécute comme machine virtuelle sur un hôte Hyper-V nommé **HV1**. DC2 ne détient pas le rôle d'émulateur PDC. HV1 est un serveur de groupe de travail dont l'horloge avance souvent de plusieurs minutes.

    L'horloge de DC2 suit celle de HV1. Sur DC2, `w32tm /query /source` renvoie `VM IC Time Synchronization Provider`, et `w32tm /query /configuration` affiche `Type: NT5DS`.

    DC2 doit synchroniser son heure sur la hiérarchie du domaine.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In the settings of the DC2 virtual machine, clear **Time synchronization** under **Integration Services**.", fr: "Dans les paramètres de la machine virtuelle DC2, décocher **Time synchronization** sous **Integration Services**." } }
    - { id: b, text: { en: "On DC2, run `w32tm /config /reliable:yes /update`.", fr: "Sur DC2, exécuter `w32tm /config /reliable:yes /update`." } }
    - { id: c, text: { en: "On DC2, run `w32tm /config /syncfromflags:domhier /update`.", fr: "Sur DC2, exécuter `w32tm /config /syncfromflags:domhier /update`." } }
    - { id: d, text: { en: "In the Default Domain Policy, increase **Maximum tolerance for computer clock synchronization**.", fr: "Dans la stratégie Default Domain Policy, augmenter **Maximum tolerance for computer clock synchronization**." } }
answer: { optionId: a }
explanation:
  correct:
    en: "DC2 already uses the domain hierarchy (NT5DS), but the Hyper-V time synchronization provider keeps correcting its clock from HV1. Microsoft recommends disabling host-to-guest time synchronization for virtual machines that are domain controllers: turn the VM off and clear **Time synchronization** in its Integration Services, so the guest synchronizes with the domain hierarchy instead."
    fr: "DC2 utilise déjà la hiérarchie du domaine (NT5DS), mais le fournisseur de synchronisation de l'heure de Hyper-V continue de corriger son horloge à partir de HV1. Microsoft recommande de désactiver la synchronisation de l'heure entre l'hôte et l'invité pour les machines virtuelles qui sont des contrôleurs de domaine : arrêtez la machine virtuelle et décochez **Time synchronization** dans ses services d'intégration, afin que l'invité se synchronise sur la hiérarchie du domaine."
  options:
    c: { en: "DC2 is already configured for the domain hierarchy (NT5DS); the host provider is what overrides it.", fr: "DC2 est déjà configuré sur la hiérarchie du domaine (NT5DS) ; c'est le fournisseur de l'hôte qui prend le dessus." }
    b: { en: "Marking DC2 as a reliable source doesn't stop it from taking its time from HV1, and only the forest root PDC emulator should be the reliable source.", fr: "Marquer DC2 comme source fiable ne l'empêche pas de prendre son heure sur HV1, et seul l'émulateur PDC du domaine racine de la forêt doit être la source fiable." }
    d: { en: "A larger Kerberos tolerance hides the symptom and weakens security; the clock of DC2 would still be wrong.", fr: "Une tolérance Kerberos plus grande masque le symptôme et affaiblit la sécurité ; l'horloge de DC2 resterait fausse." }
references:
  - title: Virtualizing domain controllers with Hyper-V
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/virtual-dc/virtualized-domain-controllers-hyper-v
  - title: Time sync for Windows VMs in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/time-sync
