id: az802-7a-insights-warning
objective: "7.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A server named **FS4** runs Windows Server 2025. You run the following command on FS4.

    ```powershell
    Get-InsightsCapabilityResult -Name "Volume consumption forecasting"
    ```

    The result has the status **Warning**.

    What does this status mean?
  fr: |
    Un serveur nommé **FS4** exécute Windows Server 2025. Vous exécutez la commande suivante sur FS4.

    ```powershell
    Get-InsightsCapabilityResult -Name "Volume consumption forecasting"
    ```

    Le résultat a l'état **Warning**.

    Que signifie cet état ?
body:
  options:
    - { id: a, text: { en: "The forecast exceeds the capacity of a volume within the next 7 days.", fr: "La prévision dépasse la capacité d'un volume dans les 7 prochains jours." } }
    - { id: b, text: { en: "The forecast exceeds the capacity of a volume within the next 30 days.", fr: "La prévision dépasse la capacité d'un volume dans les 30 prochains jours." } }
    - { id: c, text: { en: "There isn't enough data yet to make a prediction for the volumes.", fr: "Il n'y a pas encore assez de données pour établir une prévision des volumes." } }
    - { id: d, text: { en: "The capability ran into an unexpected error during the prediction.", fr: "La fonctionnalité a rencontré une erreur inattendue pendant la prévision." } }
answer: { optionId: b }
explanation:
  correct:
    en: "System Insights reports Warning when the forecast exceeds the available capacity in the next 30 days. The other statuses are OK (no capacity exceeded), Critical (capacity exceeded in the next 7 days), Error (unexpected error) and None (not enough data or no recent data)."
    fr: "System Insights signale Warning lorsque la prévision dépasse la capacité disponible dans les 30 prochains jours. Les autres états sont OK (aucun dépassement), Critical (dépassement dans les 7 prochains jours), Error (erreur inattendue) et None (données insuffisantes ou aucune donnée récente)."
  options:
    a: { en: "A forecast that exceeds capacity within 7 days has the Critical status.", fr: "Une prévision qui dépasse la capacité dans les 7 jours a l'état Critical." }
    c: { en: "Not enough data gives the None status.", fr: "Des données insuffisantes donnent l'état None." }
    d: { en: "An unexpected error gives the Error status.", fr: "Une erreur inattendue donne l'état Error." }
references:
  - title: System Insights capabilities in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/manage/system-insights/understanding-capabilities
