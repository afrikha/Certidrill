id: az802-7b-kerberos-facts
objective: "7.3.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Your AD DS domain uses the default Kerberos policy settings. You are troubleshooting intermittent authentication failures between client computers, domain controllers, and application servers.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre domaine AD DS utilise les paramètres de stratégie Kerberos par défaut. Vous dépannez des échecs d'authentification intermittents entre des ordinateurs clients, des contrôleurs de domaine et des serveurs d'applications.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Kerberos authentication can fail when the clock of a client differs from the clock of a domain controller by seven minutes.
        fr: L'authentification Kerberos peut échouer lorsque l'horloge d'un client diffère de sept minutes de celle d'un contrôleur de domaine.
    - id: s2
      text:
        en: "The error `KRB_AP_ERR_SKEW` indicates that a service principal name is registered on two accounts."
        fr: "L'erreur `KRB_AP_ERR_SKEW` indique qu'un nom de principal du service est inscrit sur deux comptes."
    - id: s3
      text:
        en: Resource-based constrained delegation is configured on the account of the back-end service.
        fr: La délégation contrainte basée sur les ressources se configure sur le compte du service back-end.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "The time difference between the domain controller and the client or the target server must be less than five minutes, so a seven-minute skew breaks Kerberos. `KRB_AP_ERR_SKEW` means that the clocks are out of sync; a duplicate SPN produces `KDC_ERR_PRINCIPAL_NOT_UNIQUE`. With resource-based constrained delegation, the back-end service maintains the list of front-end services allowed to delegate to it."
    fr: "L'écart d'heure entre le contrôleur de domaine et le client ou le serveur cible doit être inférieur à cinq minutes : un décalage de sept minutes fait échouer Kerberos. `KRB_AP_ERR_SKEW` signifie que les horloges sont désynchronisées ; un SPN en double produit `KDC_ERR_PRINCIPAL_NOT_UNIQUE`. Avec la délégation contrainte basée sur les ressources, le service back-end tient la liste des services frontaux autorisés à déléguer vers lui."
references:
  - title: Kerberos authentication troubleshooting guidance
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/windows-security/kerberos-authentication-troubleshooting-guidance
