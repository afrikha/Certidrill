id: az802-7b-cross-domain-delegation
objective: "7.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Your AD DS forest contains two domains: contoso.com and fabrikam.contoso.com. A web server named **WEB1** in contoso.com hosts an intranet application that uses Windows authentication. The application queries a SQL Server instance on a server named **SQL1** in fabrikam.contoso.com by using the identity of the signed-in user.

    Users can sign in to the application, but every database query fails with a login failure for NT AUTHORITY\ANONYMOUS LOGON. Kerberos works for both servers, and their SPNs are correct.

    You need users' identities to flow from WEB1 to SQL1. The solution must not let WEB1 delegate to any other service.

    What should you do?
  fr: |
    Votre forêt AD DS contient deux domaines : contoso.com et fabrikam.contoso.com. Un serveur web nommé **WEB1** dans contoso.com héberge une application intranet qui utilise l'authentification Windows. L'application interroge une instance SQL Server sur un serveur nommé **SQL1** dans fabrikam.contoso.com en utilisant l'identité de l'utilisateur connecté.

    Les utilisateurs peuvent se connecter à l'application, mais chaque requête de base de données échoue avec un échec de connexion pour NT AUTHORITY\ANONYMOUS LOGON. Kerberos fonctionne pour les deux serveurs, et leurs SPN sont corrects.

    Les identités des utilisateurs doivent être transmises de WEB1 à SQL1. La solution ne doit pas permettre à WEB1 de déléguer vers un autre service.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "On the SQL1 computer account, set PrincipalsAllowedToDelegateToAccount to the WEB1 computer account.", fr: "Sur le compte d'ordinateur de SQL1, définir PrincipalsAllowedToDelegateToAccount sur le compte d'ordinateur de WEB1." } }
    - { id: b, text: { en: "On the WEB1 computer account, set PrincipalsAllowedToDelegateToAccount to the SQL1 computer account.", fr: "Sur le compte d'ordinateur de WEB1, définir PrincipalsAllowedToDelegateToAccount sur le compte d'ordinateur de SQL1." } }
    - { id: c, text: { en: "On the WEB1 computer account, select **Trust this computer for delegation to any service**.", fr: "Sur le compte d'ordinateur de WEB1, sélectionner **Trust this computer for delegation to any service**." } }
    - { id: d, text: { en: "On the WEB1 computer account, configure constrained delegation to the MSSQLSvc SPN of SQL1.", fr: "Sur le compte d'ordinateur de WEB1, configurer la délégation contrainte vers le SPN MSSQLSvc de SQL1." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The anonymous login shows a failed second hop: WEB1 can't delegate the user's credentials to SQL1. Because the front-end and back-end services are in different domains, only resource-based constrained delegation (or unconstrained delegation, which is excluded) is supported. You configure it on the back-end account with `Set-ADComputer` and the `PrincipalsAllowedToDelegateToAccount` parameter, listing WEB1."
    fr: "La connexion anonyme révèle un échec du deuxième saut : WEB1 ne peut pas déléguer les informations d'identification de l'utilisateur à SQL1. Comme les services frontal et back-end se trouvent dans des domaines différents, seule la délégation contrainte basée sur les ressources (ou la délégation non contrainte, exclue ici) est prise en charge. Vous la configurez sur le compte du back-end avec `Set-ADComputer` et le paramètre `PrincipalsAllowedToDelegateToAccount`, en indiquant WEB1."
  options:
    d: { en: "Classic constrained delegation isn't supported when the front-end and back-end services are in different domains.", fr: "La délégation contrainte classique n'est pas prise en charge lorsque les services frontal et back-end sont dans des domaines différents." }
    b: { en: "The allow list belongs on the back-end resource; set on WEB1, it would let SQL1 delegate to WEB1.", fr: "La liste d'autorisation se place sur la ressource back-end ; définie sur WEB1, elle permettrait à SQL1 de déléguer vers WEB1." }
    c: { en: "Unconstrained delegation lets WEB1 delegate to any service, which the requirement forbids.", fr: "La délégation non contrainte permet à WEB1 de déléguer vers n'importe quel service, ce que l'exigence interdit." }
references:
  - title: Kerberos Constrained Delegation Overview
    url: https://learn.microsoft.com/en-us/windows-server/security/kerberos/kerberos-constrained-delegation-overview
  - title: Kerberos authentication troubleshooting guidance
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/windows-security/kerberos-authentication-troubleshooting-guidance
