id: az802-7a-ipconfig-hotarea
objective: "7.2.1"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    The network of Fabrikam uses the subnet 10.20.1.0/24 with the router 10.20.1.1 and a DHCP server. You run `ipconfig /all` on four servers that run Windows Server 2022 and are connected to this subnet. The relevant values are shown in the following table.

    Answer each prompt by selecting the appropriate server.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le réseau de Fabrikam utilise le sous-réseau 10.20.1.0/24 avec le routeur 10.20.1.1 et un serveur DHCP. Vous exécutez `ipconfig /all` sur quatre serveurs qui exécutent Windows Server 2022 et sont connectés à ce sous-réseau. Les valeurs utiles figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le serveur approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The server that couldn't obtain an address from the DHCP server", fr: "Le serveur qui n'a pas pu obtenir d'adresse du serveur DHCP" } 
    - id: p2
      text: { en: "The server that can communicate on its subnet but can't reach other subnets because of its configuration", fr: "Le serveur qui peut communiquer sur son sous-réseau mais ne peut pas joindre d'autres sous-réseaux à cause de sa configuration" }
  grid:
    header: [{ en: "Server", fr: "Serveur" }, { en: "DHCP enabled", fr: "DHCP activé" }, { en: "IPv4 address", fr: "Adresse IPv4" }, { en: "Subnet mask", fr: "Masque de sous-réseau" }, { en: "Default gateway", fr: "Passerelle par défaut" }]
    rows:
      - [{ text: SRV11, area: srv11 }, { text: "Yes" }, { text: 10.20.1.35 }, { text: 255.255.255.0 }, { text: 10.20.1.1 }]
      - [{ text: SRV12, area: srv12 }, { text: "Yes" }, { text: 169.254.48.12 }, { text: 255.255.0.0 }, { text: { en: "(none)", fr: "(aucune)" } }]
      - [{ text: SRV13, area: srv13 }, { text: "No" }, { text: 10.20.1.40 }, { text: 255.255.255.0 }, { text: 10.20.2.1 }]
      - [{ text: SRV14, area: srv14 }, { text: "No" }, { text: 10.20.1.41 }, { text: 255.255.255.0 }, { text: 10.20.1.1 }]
answer:
  values: { p1: srv12, p2: srv13 }
explanation:
  correct:
    en: "An address in 169.254.0.0/16 is an Automatic Private IP Addressing (APIPA) address: SRV12 has DHCP enabled but didn't get a lease, so it assigned itself an address and can't communicate with other subnets. SRV13 has a valid static address, but its default gateway 10.20.2.1 isn't on its subnet, so traffic to other subnets can't be routed; SRV11 and SRV14 are correctly configured."
    fr: "Une adresse de la plage 169.254.0.0/16 est une adresse APIPA (adressage IP privé automatique) : SRV12 a DHCP activé mais n'a pas obtenu de bail ; il s'est donc attribué une adresse et ne peut pas communiquer avec d'autres sous-réseaux. SRV13 a une adresse statique valide, mais sa passerelle par défaut 10.20.2.1 n'est pas sur son sous-réseau : le trafic vers les autres sous-réseaux ne peut pas être routé ; SRV11 et SRV14 sont correctement configurés."
references:
  - title: How to use automatic TCP/IP addressing without a DHCP server
    url: https://learn.microsoft.com/en-us/windows-server/troubleshoot/how-to-use-automatic-tcpip-addressing-without-a-dh
  - title: Troubleshooting DNS clients
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/troubleshoot/troubleshoot-dns-client
