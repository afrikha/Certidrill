id: az802-7a-dcr-region
objective: "7.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure subscription that contains a Log Analytics workspace named **Workspace1** in the West Europe region. The subscription also contains Azure virtual machines in the East US region and Azure Arc-enabled servers whose metadata is stored in the North Europe region.

    You need to create a data collection rule (DCR) that collects Windows events from all these machines and sends them to Workspace1.

    In which region should you create the DCR?
  fr: |
    Vous disposez d'un abonnement Azure qui contient un espace de travail Log Analytics nommé **Workspace1** dans la région West Europe. L'abonnement contient aussi des machines virtuelles Azure dans la région East US et des serveurs avec Azure Arc dont les métadonnées sont stockées dans la région North Europe.

    Vous devez créer une règle de collecte de données (DCR) qui collecte les événements Windows de toutes ces machines et les envoie vers Workspace1.

    Dans quelle région devez-vous créer la DCR ?
body:
  options:
    - { id: a, text: East US }
    - { id: b, text: North Europe }
    - { id: c, text: West Europe }
    - { id: d, text: { en: "Any region, because a DCR is a global resource", fr: "N'importe quelle région, car une DCR est une ressource globale" } }
answer: { optionId: c }
explanation:
  correct:
    en: A DCR must be created in the same region as any Log Analytics workspace or Azure Monitor workspace used as its destination, so it goes in West Europe. The DCR can then be associated with machines from any subscription or resource group of the tenant, whatever their region.
    fr: Une DCR doit être créée dans la même région que tout espace de travail Log Analytics ou Azure Monitor utilisé comme destination ; elle va donc dans West Europe. La DCR peut ensuite être associée à des machines de n'importe quel abonnement ou groupe de ressources du locataire, quelle que soit leur région.
  options:
    a: { en: "The region of the virtual machines doesn't decide where the DCR goes; the destination workspace does.", fr: "La région des machines virtuelles ne détermine pas l'emplacement de la DCR ; c'est l'espace de travail de destination qui le détermine." }
    b: { en: "The region of the Arc resources doesn't decide where the DCR goes; the destination workspace does.", fr: "La région des ressources Arc ne détermine pas l'emplacement de la DCR ; c'est l'espace de travail de destination qui le détermine." }
    d: { en: "A DCR is a regional resource; its region must match its workspace destinations.", fr: "Une DCR est une ressource régionale ; sa région doit correspondre à celle de ses espaces de travail de destination." }
references:
  - title: Collect log data from virtual machines with Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection
