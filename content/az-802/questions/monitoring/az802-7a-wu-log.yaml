id: az802-7a-wu-log
objective: "7.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Windows Update fails to install the monthly cumulative update on a server named **SRV10** that runs Windows Server 2022. A support engineer asks you for the WindowsUpdate.log file of SRV10. The file doesn't exist in the Windows folder.

    You need to produce a readable WindowsUpdate.log file.

    What should you run?
  fr: |
    Windows Update n'installe pas la mise à jour cumulative mensuelle sur un serveur nommé **SRV10** qui exécute Windows Server 2022. Un ingénieur du support vous demande le fichier WindowsUpdate.log de SRV10. Le fichier n'existe pas dans le dossier Windows.

    Vous devez produire un fichier WindowsUpdate.log lisible.

    Que devez-vous exécuter ?
body:
  options:
    - { id: a, text: Get-WindowsUpdateLog }
    - { id: b, text: 'wevtutil epl System C:\Temp\WindowsUpdate.log' }
    - { id: c, text: sfc /scannow }
    - { id: d, text: 'relog C:\Windows\Logs\WindowsUpdate\*.etl -f csv' }
answer: { optionId: a }
explanation:
  correct:
    en: Windows Update no longer writes WindowsUpdate.log directly; the Windows Update Agent writes Event Tracing for Windows (.etl) files. `Get-WindowsUpdateLog` merges and converts these files into a single readable WindowsUpdate.log file.
    fr: Windows Update n'écrit plus directement WindowsUpdate.log ; l'agent Windows Update produit des fichiers de suivi d'événements pour Windows (.etl). `Get-WindowsUpdateLog` fusionne et convertit ces fichiers en un seul fichier WindowsUpdate.log lisible.
  options:
    b: { en: "wevtutil epl exports event log entries in .evtx format, not the Windows Update ETW traces.", fr: "wevtutil epl exporte des événements au format .evtx, pas les traces ETW de Windows Update." }
    c: { en: "sfc /scannow checks and repairs protected system files; it doesn't create a log of Windows Update.", fr: "sfc /scannow vérifie et répare les fichiers système protégés ; il ne crée pas de journal de Windows Update." }
    d: { en: "relog converts performance counter logs, not ETW trace files of Windows Update.", fr: "relog convertit des journaux de compteurs de performances, pas les fichiers de suivi ETW de Windows Update." }
references:
  - title: Get-WindowsUpdateLog (WindowsUpdate)
    url: https://learn.microsoft.com/en-us/powershell/module/windowsupdate/get-windowsupdatelog
