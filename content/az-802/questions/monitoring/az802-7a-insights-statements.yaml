id: az802-7a-insights-statements
objective: "7.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A server named **HV1** runs Windows Server 2025. You use System Insights on HV1 to anticipate capacity problems.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur nommé **HV1** exécute Windows Server 2025. Vous utilisez System Insights sur HV1 pour anticiper les problèmes de capacité.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: System Insights sends the performance data of HV1 to Azure to train its forecasting models.
        fr: System Insights envoie les données de performances de HV1 vers Azure pour entraîner ses modèles de prévision.
    - id: s2
      text:
        en: Running `Get-InsightsCapabilityResult` with `-History` returns previous prediction results of a capability.
        fr: L'exécution de `Get-InsightsCapabilityResult` avec `-History` renvoie les résultats de prévision précédents d'une fonctionnalité.
    - id: s3
      text:
        en: A capability can run one remediation script when its status is Warning and a different script when its status is Critical.
        fr: Une fonctionnalité peut exécuter un script correctif quand son état est Warning et un autre script quand son état est Critical.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "System Insights runs completely locally: data collection, forecasting and models stay on the server, with no cloud connectivity. `Get-InsightsCapabilityResult -History` returns up to the last 30 results. `Set-InsightsCapabilityAction` accepts a `-Type` (prediction status) and an `-Action` script, so each status of each capability can have its own script."
    fr: "System Insights s'exécute entièrement en local : la collecte, les prévisions et les modèles restent sur le serveur, sans connectivité cloud. `Get-InsightsCapabilityResult -History` renvoie jusqu'aux 30 derniers résultats. `Set-InsightsCapabilityAction` accepte un `-Type` (état de prévision) et un script `-Action` : chaque état de chaque fonctionnalité peut avoir son propre script."
references:
  - title: Manage System Insights capabilities in Windows Admin Center
    url: https://learn.microsoft.com/en-us/windows-server/manage/system-insights/managing-capabilities
  - title: What is System Insights?
    url: https://learn.microsoft.com/en-us/windows-server/manage/system-insights/overview
