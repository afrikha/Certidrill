id: az802-7a-alert-maintenance
objective: "7.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure subscription that contains a resource group named **RG-Servers** with 25 Azure virtual machines that run Windows Server 2022. Several alert rules, some of which also cover virtual machines in other resource groups, send notifications through an action group named **AG-Ops**.

    The virtual machines in RG-Servers are patched every Saturday between 22:00 and 02:00. You need to prevent notifications for alerts fired on RG-Servers during this window, while keeping notifications for the other resource groups.

    What should you create?
  fr: |
    Vous disposez d'un abonnement Azure qui contient un groupe de ressources nommé **RG-Servers** avec 25 machines virtuelles Azure qui exécutent Windows Server 2022. Plusieurs règles d'alerte, dont certaines couvrent aussi des machines virtuelles d'autres groupes de ressources, envoient des notifications par un groupe d'actions nommé **AG-Ops**.

    Les machines virtuelles de RG-Servers reçoivent des correctifs chaque samedi entre 22:00 et 02:00. Vous devez empêcher les notifications des alertes déclenchées sur RG-Servers pendant cette fenêtre, tout en conservant les notifications des autres groupes de ressources.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An alert processing rule scoped to RG-Servers that suppresses action groups on a weekly schedule", fr: "Une règle de traitement des alertes limitée à RG-Servers qui supprime les groupes d'actions selon une planification hebdomadaire" } }
    - { id: b, text: { en: "An Azure Automation runbook that disables the alert rules on Saturday at 22:00 and enables them at 02:00", fr: "Un runbook Azure Automation qui désactive les règles d'alerte le samedi à 22:00 et les réactive à 02:00" } }
    - { id: c, text: { en: "A second action group that has no notification and is added to every alert rule", fr: "Un second groupe d'actions sans notification ajouté à chaque règle d'alerte" } }
    - { id: d, text: { en: "A resource lock on RG-Servers that is applied during the patching window", fr: "Un verrou de ressource sur RG-Servers appliqué pendant la fenêtre de correctifs" } }
answer: { optionId: a }
explanation:
  correct:
    en: Alert processing rules modify fired alerts. A rule scoped to RG-Servers with a recurring weekly schedule removes (suppresses) the action groups of alerts fired on those resources during the window; alerts still fire and are visible, and other resource groups are unaffected.
    fr: Les règles de traitement des alertes modifient les alertes déclenchées. Une règle limitée à RG-Servers avec une planification hebdomadaire récurrente supprime les groupes d'actions des alertes déclenchées sur ces ressources pendant la fenêtre ; les alertes restent déclenchées et visibles, et les autres groupes de ressources ne sont pas affectés.
  options:
    b: { en: "Disabling the rules also stops alerts for the virtual machines of other resource groups covered by the same rules, and it requires custom code.", fr: "Désactiver les règles arrête aussi les alertes des machines virtuelles des autres groupes de ressources couvertes par les mêmes règles, et exige du code." }
    c: { en: "Adding an action group adds actions; it doesn't stop AG-Ops from notifying.", fr: "Ajouter un groupe d'actions ajoute des actions ; cela n'empêche pas AG-Ops de notifier." }
    d: { en: "A resource lock prevents deletion or changes of resources; it has no effect on alert notifications.", fr: "Un verrou empêche la suppression ou la modification des ressources ; il n'a aucun effet sur les notifications d'alerte." }
references:
  - title: Alert processing rules for Azure Monitor alerts
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-processing-rules
