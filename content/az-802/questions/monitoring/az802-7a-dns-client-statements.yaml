id: az802-7a-dns-client-statements
objective: "7.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You troubleshoot name resolution on a server named **SRV9** that runs Windows Server 2025. SRV9 uses the DNS Client service with the default settings.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous résolvez un problème de résolution de noms sur un serveur nommé **SRV9** qui exécute Windows Server 2025. SRV9 utilise le service Client DNS avec les paramètres par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When you run nslookup on SRV9, the answer can come from the DNS client cache of SRV9.
        fr: Lorsque vous exécutez nslookup sur SRV9, la réponse peut provenir du cache du client DNS de SRV9.
    - id: s2
      text:
        en: The name-to-address mappings of the hosts file of SRV9 are loaded into the DNS client cache when the DNS Client service starts.
        fr: Les correspondances nom-adresse du fichier hosts de SRV9 sont chargées dans le cache du client DNS au démarrage du service Client DNS.
    - id: s3
      text:
        en: Running `Resolve-DnsName` with `-NoHostsFile` on SRV9 skips the hosts file when resolving the name.
        fr: L'exécution de `Resolve-DnsName` avec `-NoHostsFile` sur SRV9 ignore le fichier hosts lors de la résolution du nom.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: nslookup doesn't use the client's DNS cache; it sends its query to the configured DNS server. The local resolver cache contains the hosts file mappings, loaded when the DNS Client service starts, and the records of previous answers kept for their TTL. `Resolve-DnsName -NoHostsFile` skips the hosts file for that query.
    fr: nslookup n'utilise pas le cache DNS du client ; il envoie sa requête au serveur DNS configuré. Le cache local du résolveur contient les correspondances du fichier hosts, chargées au démarrage du service Client DNS, et les enregistrements des réponses précédentes conservés pendant leur TTL. `Resolve-DnsName -NoHostsFile` ignore le fichier hosts pour cette requête.
references:
  - title: DNS Queries and Lookups in Windows and Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/queries-lookups
  - title: Troubleshooting DNS clients
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/troubleshoot/troubleshoot-dns-client
