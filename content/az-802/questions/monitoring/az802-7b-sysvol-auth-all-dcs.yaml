id: az802-7b-sysvol-auth-all-dcs
objective: "7.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Your AD DS domain has three domain controllers: DC1, DC2, and DC3. DC1 holds the PDC emulator role. SYSVOL is replicated by DFS Replication.

    A faulty script deleted most GPO folders from SYSVOL, and the deletion replicated to all the domain controllers. You performed a bare metal restore of DC1 from a backup taken before the deletion. You then set the startup type of the DFS Replication service to Manual and stopped the service on all three domain controllers.

    You need the restored SYSVOL of DC1 to replace the SYSVOL content of DC2 and DC3.

    What should you do next?
  fr: |
    Votre domaine AD DS compte trois contrôleurs de domaine : DC1, DC2 et DC3. DC1 détient le rôle d'émulateur PDC. SYSVOL est répliqué par la réplication DFS.

    Un script défectueux a supprimé la plupart des dossiers de GPO de SYSVOL, et la suppression a été répliquée sur tous les contrôleurs de domaine. Vous avez effectué une restauration complète (bare metal) de DC1 à partir d'une sauvegarde antérieure à la suppression. Vous avez ensuite défini le type de démarrage du service DFS Replication sur Manuel et arrêté le service sur les trois contrôleurs de domaine.

    Le SYSVOL restauré de DC1 doit remplacer le contenu SYSVOL de DC2 et DC3.

    Que devez-vous faire ensuite ?
body:
  options:
    - { id: a, text: { en: "On DC1, set msDFSR-Options to 1. Leave the SYSVOL Subscription objects of DC2 and DC3 unchanged.", fr: "Sur DC1, définir msDFSR-Options sur 1. Laisser inchangés les objets SYSVOL Subscription de DC2 et DC3." } }
    - { id: b, text: { en: "On DC1, set msDFSR-Enabled to FALSE. On DC2 and DC3, set msDFSR-Options to 1 and msDFSR-Enabled to FALSE.", fr: "Sur DC1, définir msDFSR-Enabled sur FALSE. Sur DC2 et DC3, définir msDFSR-Options sur 1 et msDFSR-Enabled sur FALSE." } }
    - { id: c, text: { en: "On DC1, set msDFSR-Options to 1 and msDFSR-Enabled to FALSE. On DC2 and DC3, set msDFSR-Enabled to FALSE.", fr: "Sur DC1, définir msDFSR-Options sur 1 et msDFSR-Enabled sur FALSE. Sur DC2 et DC3, définir msDFSR-Enabled sur FALSE." } }
    - { id: d, text: { en: "In DFS Management, make DC1 the primary member of the Domain System Volume replication group.", fr: "Dans Gestion DFS, faire de DC1 le membre principal du groupe de réplication Domain System Volume." } }
answer: { optionId: c }
explanation:
  correct:
    en: "An authoritative synchronization sets `msDFSR-Options` to 1 and `msDFSR-Enabled` to FALSE on the authoritative domain controller (preferably the PDC emulator), and `msDFSR-Enabled` to FALSE on all the other domain controllers of the domain. After AD replication, you start DFSR on DC1 and re-enable it, then on DC2 and DC3, which then accept the copy of DC1. A bare metal restore requires this attribute method instead of `wbadmin -authsysvol`."
    fr: "Une synchronisation faisant autorité définit `msDFSR-Options` sur 1 et `msDFSR-Enabled` sur FALSE sur le contrôleur de domaine faisant autorité (de préférence l'émulateur PDC), et `msDFSR-Enabled` sur FALSE sur tous les autres contrôleurs de domaine du domaine. Après la réplication AD, vous démarrez DFSR sur DC1 et le réactivez, puis sur DC2 et DC3, qui acceptent alors la copie de DC1. Une restauration complète (bare metal) impose cette méthode par attributs au lieu de `wbadmin -authsysvol`."
  options:
    a: { en: "Every other domain controller must also be made nonauthoritative; otherwise DC2 and DC3 keep their own content and conflicts occur.", fr: "Tous les autres contrôleurs de domaine doivent aussi être rendus non faisant autorité ; sinon DC2 et DC3 gardent leur propre contenu et des conflits se produisent." }
    b: { en: "This makes DC2 and DC3 authoritative, so their damaged SYSVOL would win over the restored copy of DC1.", fr: "Cela rend DC2 et DC3 faisant autorité : leur SYSVOL endommagé l'emporterait sur la copie restaurée de DC1." }
    d: { en: "SYSVOL replication is protected from editing through DFS Management and Dfsradmin.", fr: "La réplication de SYSVOL est protégée contre toute modification par Gestion DFS et Dfsradmin." }
references:
  - title: How to force authoritative and non-authoritative synchronization for DFSR-replicated sysvol replication
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/group-policy/force-authoritative-non-authoritative-synchronization
  - title: Recover SYSVOL
    url: https://learn.microsoft.com/en-us/training/modules/troubleshoot-active-directory/4-recover-sysvol
