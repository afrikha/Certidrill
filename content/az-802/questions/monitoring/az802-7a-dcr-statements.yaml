id: az802-7a-dcr-statements
objective: "7.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You use the Azure Monitor Agent and data collection rules (DCRs) to collect data from 60 Azure virtual machines that run Windows Server 2025.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez l'agent Azure Monitor et des règles de collecte de données (DCR) pour collecter les données de 60 machines virtuelles Azure qui exécutent Windows Server 2025.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A virtual machine can be associated with several DCRs that each collect different data.
        fr: Une machine virtuelle peut être associée à plusieurs DCR qui collectent chacune des données différentes.
    - id: s2
      text:
        en: A DCR that has a Windows Event Logs data source can send the events to an Azure Monitor workspace.
        fr: Une DCR qui possède une source de données Windows Event Logs peut envoyer les événements vers un espace de travail Azure Monitor.
    - id: s3
      text:
        en: A Windows Event Logs data source can collect events from the Analytic and Debug channels of the virtual machines.
        fr: Une source de données Windows Event Logs peut collecter des événements des canaux Analytique et Débogage des machines virtuelles.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "The agent is installed once and can use any number of DCRs, each collecting different data. Windows event data can only be sent to a Log Analytics workspace, where it's stored in the Event table. The agent subscribes to event logs with the EvtSubscribe API, which doesn't allow subscribing to Analytic and Debug channels, so these channels can't be collected."
    fr: "L'agent est installé une seule fois et peut utiliser un nombre quelconque de DCR, chacune collectant des données différentes. Les événements Windows ne peuvent être envoyés que vers un espace de travail Log Analytics, où ils sont stockés dans la table Event. L'agent s'abonne aux journaux avec l'API EvtSubscribe, qui ne permet pas de s'abonner aux canaux Analytique et Débogage : ces canaux ne peuvent pas être collectés."
references:
  - title: Collect Windows events from virtual machines with Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events
  - title: Enable VM monitoring in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vm-enable-monitoring
