id: az802-7b-recycle-bin-enable
objective: "7.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Your network contains a single-domain AD DS forest named **contoso.com**. The forest and domain functional levels are Windows Server 2016. Active Directory Recycle Bin isn't enabled.

    The operations master roles are held as shown in the following table.

    | Domain controller | Roles |
    | --- | --- |
    | DC1 | Schema master, PDC emulator |
    | DC2 | Domain naming master |
    | DC3 | RID master, Infrastructure master |

    Yesterday, an administrator tried to enable the Recycle Bin by connecting to DC3, and the operation failed. You need to enable the Recycle Bin.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient une forêt AD DS à domaine unique nommée **contoso.com**. Les niveaux fonctionnels de la forêt et du domaine sont Windows Server 2016. La Corbeille Active Directory n'est pas activée.

    Les rôles de maître d'opérations sont répartis comme indiqué dans le tableau suivant.

    | Contrôleur de domaine | Rôles |
    | --- | --- |
    | DC1 | Maître de schéma, émulateur PDC |
    | DC2 | Maître d'attribution de noms de domaine |
    | DC3 | Maître RID, maître d'infrastructure |

    Hier, un administrateur a tenté d'activer la Corbeille en se connectant à DC3, et l'opération a échoué. Vous devez activer la Corbeille.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    [[cmd]] -Identity 'Recycle Bin Feature' -Scope ForestOrConfigurationSet -Target 'contoso.com' -Server [[srv]]
  slots:
    - id: cmd
      options:
        - { id: setforest, text: Set-ADForestMode }
        - { id: enable, text: Enable-ADOptionalFeature }
        - { id: restore, text: Restore-ADObject }
    - id: srv
      options:
        - { id: dc1, text: DC1 }
        - { id: dc2, text: DC2 }
        - { id: dc3, text: DC3 }
answer:
  values: { cmd: enable, srv: dc2 }
explanation:
  correct:
    en: "The Recycle Bin is an optional feature that you enable with `Enable-ADOptionalFeature` once the forest functional level is Windows Server 2008 R2 or higher, which is already the case. The operation must be performed on the domain controller that holds the domain naming master role, DC2."
    fr: "La Corbeille est une fonctionnalité facultative que vous activez avec `Enable-ADOptionalFeature` une fois le niveau fonctionnel de la forêt à Windows Server 2008 R2 ou supérieur, ce qui est déjà le cas. L'opération doit être effectuée sur le contrôleur de domaine qui détient le rôle de maître d'attribution de noms de domaine, DC2."
  options:
    setforest: { en: "The forest functional level is already high enough; Set-ADForestMode changes the level, not the optional features.", fr: "Le niveau fonctionnel de la forêt est déjà suffisant ; Set-ADForestMode change le niveau, pas les fonctionnalités facultatives." }
    restore: { en: "Restore-ADObject restores deleted objects once the Recycle Bin is enabled.", fr: "Restore-ADObject restaure des objets supprimés une fois la Corbeille activée." }
    dc1: { en: "DC1 holds the schema master role, but the operation requires the domain naming master.", fr: "DC1 détient le rôle de maître de schéma, mais l'opération exige le maître d'attribution de noms de domaine." }
    dc3: { en: "DC3 holds neither role that matters here; that's why the first attempt failed.", fr: "DC3 ne détient pas le rôle requis ; c'est pourquoi la première tentative a échoué." }
references:
  - title: Enable-ADOptionalFeature (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/enable-adoptionalfeature
  - title: Enable and use Active Directory Recycle Bin
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/adac/active-directory-recycle-bin
