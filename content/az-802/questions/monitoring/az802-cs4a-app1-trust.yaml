id: az802-cs4a-app1-trust
objective: "7.3.7"
type: multi
caseStudy: az802-cs4a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the requirement for APP1. You have the credentials of a domain account that has permission to reset computer account passwords.

    Which two commands can you run? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence concernant APP1. Vous disposez des informations d'identification d'un compte de domaine autorisé à réinitialiser les mots de passe des comptes d'ordinateur.

    Quelles sont les deux commandes que vous pouvez exécuter ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "On APP1: `Test-ComputerSecureChannel -Server DC2 -Verbose`", fr: "Sur APP1 : `Test-ComputerSecureChannel -Server DC2 -Verbose`" } }
    - { id: b, text: { en: "On APP1: `Test-ComputerSecureChannel -Repair -Credential (Get-Credential)`", fr: "Sur APP1 : `Test-ComputerSecureChannel -Repair -Credential (Get-Credential)`" } }
    - { id: c, text: { en: "On DC2: `Test-ComputerSecureChannel -Repair -Credential (Get-Credential)`", fr: "Sur DC2 : `Test-ComputerSecureChannel -Repair -Credential (Get-Credential)`" } }
    - { id: d, text: { en: "On APP1: `Reset-ComputerMachinePassword -Server DC2 -Credential (Get-Credential)`", fr: "Sur APP1 : `Reset-ComputerMachinePassword -Server DC2 -Credential (Get-Credential)`" } }
    - { id: e, text: { en: "On APP1: `Remove-Computer -UnjoinDomainCredential (Get-Credential) -Restart`", fr: "Sur APP1 : `Remove-Computer -UnjoinDomainCredential (Get-Credential) -Restart`" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      The restored backup contains an old computer account password, so the secure channel between APP1 and the domain is broken. Run locally on APP1, `Test-ComputerSecureChannel -Repair` removes and rebuilds the secure channel established by the Netlogon service, and `Reset-ComputerMachinePassword` resets the computer account password through a domain controller. Both run as the local Administrator with a domain credential, keep the computer account and do not restart APP1.
    fr: |
      La sauvegarde restaurée contient un ancien mot de passe du compte d'ordinateur : le canal sécurisé entre APP1 et le domaine est rompu. Exécutée localement sur APP1, `Test-ComputerSecureChannel -Repair` supprime et reconstruit le canal sécurisé établi par le service Netlogon, et `Reset-ComputerMachinePassword` réinitialise le mot de passe du compte d'ordinateur via un contrôleur de domaine. Les deux s'exécutent en tant qu'Administrator local avec des informations d'identification de domaine, conservent le compte d'ordinateur et ne redémarrent pas APP1.
  options:
    a:
      en: Without -Repair, the cmdlet only tests the secure channel and returns False; it does not fix it.
      fr: Sans -Repair, l'applet de commande teste seulement le canal sécurisé et renvoie False ; elle ne le répare pas.
    c:
      en: The cmdlet acts on the secure channel of the computer where it runs, and on domain controllers it returns false positives; it would not repair APP1.
      fr: L'applet de commande agit sur le canal sécurisé de l'ordinateur où elle s'exécute, et elle renvoie de faux positifs sur les contrôleurs de domaine ; elle ne réparerait pas APP1.
    e:
      en: Leaving the domain requires a restart and does not restore the trust; rejoining would need another restart, which the batch job forbids.
      fr: Quitter le domaine nécessite un redémarrage et ne rétablit pas l'approbation ; rejoindre le domaine exigerait un autre redémarrage, ce que le traitement par lots interdit.
references:
  - title: Test-ComputerSecureChannel (Microsoft.PowerShell.Management)
    url: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/test-computersecurechannel
  - title: Reset-ComputerMachinePassword (Microsoft.PowerShell.Management)
    url: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/reset-computermachinepassword
