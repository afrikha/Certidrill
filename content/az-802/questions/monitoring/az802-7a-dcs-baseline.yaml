id: az802-7a-dcs-baseline
objective: "7.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A file server named **FS1** runs Windows Server 2022.

    You need to record processor, memory and disk counters of FS1 every 15 seconds for seven days, starting next Monday at 08:00, to build a performance baseline. The recording must stop automatically.

    What should you create?
  fr: |
    Un serveur de fichiers nommé **FS1** exécute Windows Server 2022.

    Vous devez enregistrer les compteurs de processeur, de mémoire et de disque de FS1 toutes les 15 secondes pendant sept jours, à partir de lundi prochain à 08:00, afin d'établir une référence de performances. L'enregistrement doit s'arrêter automatiquement.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A data collector set with a performance counter data collector, a schedule and a stop condition", fr: "Un jeu de collecteurs de données avec un collecteur de données de compteur de performance, une planification et une condition d'arrêt" } }
    - { id: b, text: { en: "A data collector set with a performance counter alert and a sample interval of 15 seconds", fr: "Un jeu de collecteurs de données avec une alerte de compteur de performance et un intervalle d'échantillonnage de 15 secondes" } }
    - { id: c, text: { en: "A custom view in Event Viewer that filters the System log for seven days", fr: "Un affichage personnalisé dans l'Observateur d'événements qui filtre le journal Système sur sept jours" } }
    - { id: d, text: { en: "A Performance Monitor graph in Report view with an update interval of 15 seconds", fr: "Un graphique de l'Analyseur de performances en affichage Rapport avec un intervalle de mise à jour de 15 secondes" } }
answer: { optionId: a }
explanation:
  correct:
    en: A performance counter data collector records counter values at the chosen sample interval in a log file. The data collector set's schedule starts it at the planned time and its stop condition (an overall duration of seven days) ends it automatically, which gives a baseline you can review later.
    fr: Un collecteur de données de compteur de performance enregistre les valeurs des compteurs dans un fichier journal, à l'intervalle d'échantillonnage choisi. La planification du jeu de collecteurs de données le démarre à l'heure prévue et sa condition d'arrêt (une durée totale de sept jours) l'arrête automatiquement, ce qui fournit une référence consultable ensuite.
  options:
    b:
      en: A performance counter alert acts when a threshold is crossed (event log entry, data collector set, task); it doesn't keep a history of counter values.
      fr: Une alerte de compteur de performance agit quand un seuil est franchi (entrée dans le journal, jeu de collecteurs, tâche) ; elle ne conserve pas d'historique des valeurs.
    c:
      en: A custom view filters events; it doesn't record performance counters.
      fr: Un affichage personnalisé filtre des événements ; il n'enregistre pas de compteurs de performances.
    d:
      en: The live Performance Monitor display isn't saved and stops when the console closes; it can't record seven days of data on a schedule.
      fr: L'affichage en direct de l'Analyseur de performances n'est pas enregistré et s'arrête à la fermeture de la console ; il ne peut pas enregistrer sept jours de données selon une planification.
references:
  - title: logman create counter
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/logman-create-counter
  - title: Troubleshoot performance problems in Windows
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/performance/troubleshoot-performance-problems-in-windows
