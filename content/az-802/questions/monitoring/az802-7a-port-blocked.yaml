id: az802-7a-port-blocked
objective: "7.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A server named **APP4** runs Windows Server 2025 and hosts a web service on TCP port 8443. Clients on another subnet report that they can't reach the service. From a client, you run the following command.

    ```powershell
    Test-NetConnection APP4 -Port 8443
    ```

    The output shows `RemoteAddress: 10.30.2.14`, `PingSucceeded: True` and `TcpTestSucceeded: False`. On APP4, `Get-NetTCPConnection -State Listen -LocalPort 8443` returns one entry with the local address 0.0.0.0. The DNS record of APP4 is correct.

    What is the most likely cause of the issue?
  fr: |
    Un serveur nommé **APP4** exécute Windows Server 2025 et héberge un service web sur le port TCP 8443. Les clients d'un autre sous-réseau signalent qu'ils ne peuvent pas joindre le service. Depuis un client, vous exécutez la commande suivante.

    ```powershell
    Test-NetConnection APP4 -Port 8443
    ```

    La sortie indique `RemoteAddress: 10.30.2.14`, `PingSucceeded: True` et `TcpTestSucceeded: False`. Sur APP4, `Get-NetTCPConnection -State Listen -LocalPort 8443` renvoie une entrée avec l'adresse locale 0.0.0.0. L'enregistrement DNS d'APP4 est correct.

    Quelle est la cause la plus probable du problème ?
body:
  options:
    - { id: a, text: { en: "The client resolves APP4 to a wrong IP address.", fr: "Le client résout APP4 vers une adresse IP incorrecte." } }
    - { id: b, text: { en: "The web service on APP4 isn't listening on port 8443.", fr: "Le service web d'APP4 n'écoute pas sur le port 8443." } }
    - { id: c, text: { en: "A firewall rule blocks inbound TCP 8443 to APP4.", fr: "Une règle de pare-feu bloque le trafic TCP 8443 entrant vers APP4." } }
    - { id: d, text: { en: "There's no route between the client subnet and APP4.", fr: "Il n'existe aucun itinéraire entre le sous-réseau du client et APP4." } }
answer: { optionId: c }
explanation:
  correct:
    en: The ping succeeds, so the name resolves to a reachable address and routing works in both directions. APP4 listens on port 8443 on all addresses, so the service is up. A TCP test that fails while ICMP passes and the port listens points to filtering of TCP 8443, typically the inbound rules of Windows Defender Firewall on APP4 or a network firewall.
    fr: Le ping réussit ; le nom se résout donc vers une adresse joignable et le routage fonctionne dans les deux sens. APP4 écoute sur le port 8443 sur toutes ses adresses ; le service fonctionne donc. Un test TCP qui échoue alors qu'ICMP passe et que le port écoute indique un filtrage du TCP 8443, en général les règles de trafic entrant du Pare-feu Windows Defender d'APP4 ou un pare-feu réseau.
  options:
    a: { en: "The DNS record is correct and the ping to the resolved address succeeds.", fr: "L'enregistrement DNS est correct et le ping vers l'adresse résolue réussit." }
    b: { en: "Get-NetTCPConnection shows a listener on port 8443 bound to 0.0.0.0 (all IPv4 addresses).", fr: "Get-NetTCPConnection montre un écouteur sur le port 8443 lié à 0.0.0.0 (toutes les adresses IPv4)." }
    d: { en: "The successful ping proves that packets are routed between the two subnets.", fr: "Le ping réussi prouve que les paquets sont routés entre les deux sous-réseaux." }
references:
