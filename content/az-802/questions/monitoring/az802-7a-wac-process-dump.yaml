id: az802-7a-wac-process-dump
objective: "7.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You manage a server named **APP2** that runs Windows Server 2022 by using Windows Admin Center.

    An application process on APP2 regularly stops responding. The developers ask you for a dump file of the process while it's hung.

    Which Windows Admin Center tool should you use?
  fr: |
    Vous gérez un serveur nommé **APP2** qui exécute Windows Server 2022 à l'aide de Windows Admin Center.

    Un processus applicatif d'APP2 cesse régulièrement de répondre. Les développeurs vous demandent un fichier de vidage du processus pendant qu'il est bloqué.

    Quel outil de Windows Admin Center devez-vous utiliser ?
body:
  options:
    - { id: a, text: Overview }
    - { id: b, text: Performance Monitor }
    - { id: c, text: Processes }
    - { id: d, text: Events }
answer: { optionId: c }
explanation:
  correct:
    en: The Processes tool lists the running processes of the server and lets you view their details, end them, find their handles and create a process dump, which is what the developers need.
    fr: L'outil Processes liste les processus en cours d'exécution du serveur et permet d'afficher leurs détails, de les arrêter, de trouver leurs handles et de créer un vidage de processus, ce dont les développeurs ont besoin.
  options:
    a:
      en: Overview shows CPU, memory and network activity and lets you restart or shut down the server; it doesn't work on individual processes.
      fr: Overview affiche l'activité du processeur, de la mémoire et du réseau et permet de redémarrer ou d'arrêter le serveur ; il n'agit pas sur des processus individuels.
    b:
      en: Performance Monitor displays performance counters and reports; it can't capture a dump.
      fr: Performance Monitor affiche des compteurs de performances et des rapports ; il ne peut pas capturer de vidage.
    d:
      en: Events lets you browse, search, clear and export event logs; it doesn't capture process memory.
      fr: Events permet de parcourir, rechercher, effacer et exporter les journaux des événements ; il ne capture pas la mémoire d'un processus.
references:
  - title: Manage Servers with Windows Admin Center
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/use/manage-servers
