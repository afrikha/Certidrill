id: az802-7b-member-cmos-clock
objective: "7.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a member server named **Server3** in an AD DS domain named contoso.com. Two years ago, an administrator configured Server3 to synchronize its clock from a standalone NTP appliance. The appliance was decommissioned last month.

    Users who connect to Server3 now report authentication failures. On Server3, `w32tm /query /source` returns `Local CMOS Clock`.

    You need Server3 to obtain its time from the domain hierarchy, like the other member servers.

    Which command should you run on Server3 first?
  fr: |
    Vous disposez d'un serveur membre nommé **Server3** dans un domaine AD DS nommé contoso.com. Il y a deux ans, un administrateur a configuré Server3 pour synchroniser son horloge sur une appliance NTP autonome. L'appliance a été mise hors service le mois dernier.

    Les utilisateurs qui se connectent à Server3 signalent désormais des échecs d'authentification. Sur Server3, `w32tm /query /source` renvoie `Local CMOS Clock`.

    Server3 doit obtenir son heure de la hiérarchie du domaine, comme les autres serveurs membres.

    Quelle commande devez-vous exécuter en premier sur Server3 ?
body:
  options:
    - { id: a, text: "w32tm /config /syncfromflags:domhier /update" }
    - { id: b, text: "w32tm /config /reliable:yes /update" }
    - { id: c, text: "w32tm /resync /nowait" }
    - { id: d, text: "w32tm /stripchart /computer:dc1.contoso.com /samples:5" }
answer: { optionId: a }
explanation:
  correct:
    en: "`Local CMOS Clock` means the clock isn't synchronized: Server3 still points to the appliance that no longer exists. `/syncfromflags:domhier` makes it synchronize from a domain controller of its domain, and `/update` applies the change; you can then run `w32tm /resync` to synchronize immediately."
    fr: "`Local CMOS Clock` signifie que l'horloge n'est pas synchronisée : Server3 pointe toujours vers l'appliance qui n'existe plus. `/syncfromflags:domhier` le fait synchroniser sur un contrôleur de domaine de son domaine, et `/update` applique la modification ; vous pouvez ensuite exécuter `w32tm /resync` pour synchroniser immédiatement."
  options:
    c: { en: "A resynchronization still uses the configured source, which is the decommissioned appliance.", fr: "Une resynchronisation utilise toujours la source configurée, c'est-à-dire l'appliance mise hors service." }
    b: { en: "The reliable flag is meaningful only on domain controllers and doesn't change where Server3 gets its time.", fr: "L'indicateur de source fiable n'a de sens que sur les contrôleurs de domaine et ne change pas la source de temps de Server3." }
    d: { en: "The strip chart only measures the offset from DC1; it doesn't change the configuration.", fr: "Le graphique stripchart mesure seulement le décalage par rapport à DC1 ; il ne modifie pas la configuration." }
references:
  - title: Windows Time service tools and settings
    url: https://learn.microsoft.com/en-us/windows-server/networking/windows-time-service/windows-time-service-tools-and-settings
  - title: Time sync for Windows VMs in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/time-sync
