id: az802-7b-checkpoint-trust
objective: "7.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Hyper-V virtual machine named **Server8** that is a member server of an AD DS domain and uses the default domain member settings. To undo a failed application update, you apply a checkpoint of Server8 that was created two months ago.

    After the restart, domain users can't sign in to Server8 and receive the message "The trust relationship between this workstation and the primary domain failed." Local accounts can sign in.

    What is the most likely cause?
  fr: |
    Vous disposez d'une machine virtuelle Hyper-V nommée **Server8**, serveur membre d'un domaine AD DS, qui utilise les paramètres par défaut des membres du domaine. Pour annuler une mise à jour d'application qui a échoué, vous appliquez un point de contrôle de Server8 créé il y a deux mois.

    Après le redémarrage, les utilisateurs du domaine ne peuvent pas se connecter à Server8 et reçoivent le message « The trust relationship between this workstation and the primary domain failed. » Les comptes locaux peuvent se connecter.

    Quelle est la cause la plus probable ?
body:
  options:
    - { id: a, text: { en: "The clock of Server8 differs from the domain controllers by more than five minutes.", fr: "L'horloge de Server8 diffère de plus de cinq minutes de celle des contrôleurs de domaine." } }
    - { id: b, text: { en: "The SPNs of Server8 are also registered on another computer account.", fr: "Les SPN de Server8 sont aussi inscrits sur un autre compte d'ordinateur." } }
    - { id: c, text: { en: "The DNS host record of Server8 was removed while the checkpoint was applied.", fr: "L'enregistrement d'hôte DNS de Server8 a été supprimé pendant l'application du point de contrôle." } }
    - { id: d, text: { en: "The computer account password stored on Server8 no longer matches the one in AD DS.", fr: "Le mot de passe du compte d'ordinateur stocké sur Server8 ne correspond plus à celui d'AD DS." } }
answer: { optionId: d }
explanation:
  correct:
    en: "By default, domain members submit a computer account password change every 30 days. The two-month-old checkpoint brought back an older password, so the secure channel that Net Logon builds with the computer account fails. You can repair it on the member with `Test-ComputerSecureChannel -Repair`."
    fr: "Par défaut, les membres du domaine changent le mot de passe de leur compte d'ordinateur tous les 30 jours. Le point de contrôle vieux de deux mois a remis en place un ancien mot de passe : le canal sécurisé que Netlogon établit avec le compte d'ordinateur échoue donc. Vous pouvez le réparer sur le membre avec `Test-ComputerSecureChannel -Repair`."
  options:
    a: { en: "A clock skew produces Kerberos time errors such as KRB_AP_ERR_SKEW, not a broken trust relationship.", fr: "Un décalage d'horloge produit des erreurs de temps Kerberos comme KRB_AP_ERR_SKEW, pas une relation d'approbation rompue." }
    b: { en: "Duplicate SPNs break Kerberos access to a service, not the trust relationship of the computer with its domain.", fr: "Des SPN en double empêchent l'accès Kerberos à un service, pas la relation d'approbation de l'ordinateur avec son domaine." }
    c: { en: "Applying a checkpoint doesn't change DNS on the servers, and name resolution problems wouldn't report a failed trust relationship.", fr: "Appliquer un point de contrôle ne modifie pas le DNS des serveurs, et un problème de résolution de noms ne signalerait pas une relation d'approbation rompue." }
references:
  - title: "Domain member: Maximum machine account password age"
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/domain-member-maximum-machine-account-password-age
  - title: Test-ComputerSecureChannel (Microsoft.PowerShell.Management)
    url: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/test-computersecurechannel
