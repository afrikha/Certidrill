id: az802-7a-wef-collector-security
objective: "7.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named contoso.com that has two domain controllers named **DC1** and **DC2**. A member server named **COL1** runs Windows Server 2025.

    On COL1, you ran `wecutil qc` and created a collector-initiated subscription that collects events from the **Security** log of DC1 and DC2. The subscription uses the computer account of COL1. A security baseline GPO linked to the Domain Controllers OU sets the startup type of the Windows Remote Management (WS-Management) service to Disabled. No events arrive in the Forwarded Events log of COL1.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine Active Directory nommé contoso.com qui comporte deux contrôleurs de domaine nommés **DC1** et **DC2**. Un serveur membre nommé **COL1** exécute Windows Server 2025.

    Sur COL1, vous avez exécuté `wecutil qc` et créé un abonnement initié par le collecteur qui collecte les événements du journal **Sécurité** de DC1 et DC2. L'abonnement utilise le compte d'ordinateur de COL1. Un GPO de base de sécurité lié à l'UO Domain Controllers définit le type de démarrage du service Windows Remote Management (WS-Management) sur Disabled. Aucun événement n'arrive dans le journal Événements transférés de COL1.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run wecutil qc on DC1 and DC2.", fr: "Exécuter wecutil qc sur DC1 et DC2." } }
    - { id: b, text: { en: "Add the Network Service account to the Event Log Readers group on COL1.", fr: "Ajouter le compte Network Service au groupe Event Log Readers sur COL1." } }
    - { id: c, text: { en: "Change the GPO so that the WinRM service starts automatically on DC1 and DC2.", fr: "Modifier le GPO pour que le service WinRM démarre automatiquement sur DC1 et DC2." } }
    - { id: d, text: { en: "Add the computer account of COL1 to the Event Log Readers group of the domain.", fr: "Ajouter le compte d'ordinateur de COL1 au groupe Event Log Readers du domaine." } }
    - { id: e, text: { en: "Link a GPO to the Domain Controllers OU that sets COL1 as the target subscription manager.", fr: "Lier à l'UO Domain Controllers un GPO qui définit COL1 comme gestionnaire d'abonnements cible." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: "In a collector-initiated subscription, COL1 connects to the sources through WinRM, so the WinRM service, disabled by the baseline GPO, must run on DC1 and DC2. The credential used by the subscription must be able to read the event logs of the sources, normally by adding it to Event Log Readers; on domain controllers this group is the domain's built-in group, and it grants read access to secured channels such as Security."
    fr: "Dans un abonnement initié par le collecteur, COL1 se connecte aux sources via WinRM : le service WinRM, désactivé par le GPO de base, doit donc s'exécuter sur DC1 et DC2. Les informations d'identification utilisées par l'abonnement doivent pouvoir lire les journaux des sources, en général en les ajoutant à Event Log Readers ; sur les contrôleurs de domaine, ce groupe est le groupe intégré du domaine, et il donne accès en lecture aux canaux sécurisés comme Sécurité."
  options:
    a: { en: "wecutil qc configures the Windows Event Collector service; it's needed on the collector, where it already ran, not on the sources.", fr: "wecutil qc configure le service Collecteur d'événements de Windows ; il est nécessaire sur le collecteur, où il a déjà été exécuté, pas sur les sources." }
    b: { en: "Network Service needs Event Log Readers on the source computers in source-initiated forwarding, not on the collector.", fr: "Network Service doit être membre d'Event Log Readers sur les ordinateurs sources dans le transfert initié par la source, pas sur le collecteur." }
    e: { en: "A target subscription manager GPO configures source-initiated forwarding; it doesn't fix a collector-initiated subscription.", fr: "Un GPO de gestionnaire d'abonnements cible configure le transfert initié par la source ; il ne corrige pas un abonnement initié par le collecteur." }
references:
  - title: Use Windows Event Forwarding to help with intrusion detection
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/device-management/use-windows-event-forwarding-to-assist-in-intrusion-detection
  - title: wecutil
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wecutil
