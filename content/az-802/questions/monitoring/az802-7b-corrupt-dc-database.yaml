id: az802-7b-corrupt-dc-database
objective: "7.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your AD DS domain has four domain controllers. After a storage failure, the directory database on a domain controller named **DC3** is corrupted and AD DS fails to start on DC3. The other domain controllers are healthy, and the corruption hasn't spread to them.

    You have a system state backup of DC3 taken two days ago. Since then, administrators created and modified many accounts on the other domain controllers.

    You need to recover DC3 by using the backup. The solution must keep all the changes made since the backup.

    What should you do?
  fr: |
    Votre domaine AD DS compte quatre contrôleurs de domaine. Après une panne de stockage, la base de données de l'annuaire d'un contrôleur de domaine nommé **DC3** est corrompue et AD DS ne démarre plus sur DC3. Les autres contrôleurs de domaine sont sains, et la corruption ne s'est pas propagée.

    Vous disposez d'une sauvegarde de l'état du système de DC3 effectuée il y a deux jours. Depuis, les administrateurs ont créé et modifié de nombreux comptes sur les autres contrôleurs de domaine.

    Vous devez récupérer DC3 à l'aide de la sauvegarde. La solution doit conserver toutes les modifications effectuées depuis la sauvegarde.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Restart DC3 in DSRM, restore the system state, and then restart DC3 normally.", fr: "Redémarrer DC3 en DSRM, restaurer l'état du système, puis redémarrer DC3 normalement." } }
    - { id: b, text: { en: "Restart DC3 in DSRM, restore the system state, and then mark the whole domain partition as authoritative.", fr: "Redémarrer DC3 en DSRM, restaurer l'état du système, puis marquer toute la partition de domaine comme faisant autorité." } }
    - { id: c, text: { en: "Stop the AD DS service on DC3, restore the system state, and then start the service.", fr: "Arrêter le service AD DS sur DC3, restaurer l'état du système, puis démarrer le service." } }
    - { id: d, text: { en: "Enable the Recycle Bin, and then restore the objects of DC3 by using Restore-ADObject.", fr: "Activer la Corbeille, puis restaurer les objets de DC3 avec Restore-ADObject." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A normal (nonauthoritative) restore fits a domain controller whose directory is damaged when the problem hasn't spread. DC3 rolls back to the backup, and after a normal restart, replication from the healthy domain controllers brings every change made since the backup."
    fr: "Une restauration normale (ne faisant pas autorité) convient à un contrôleur de domaine dont l'annuaire est endommagé lorsque le problème ne s'est pas propagé. DC3 revient à l'état de la sauvegarde, et après un redémarrage normal, la réplication depuis les contrôleurs de domaine sains apporte toutes les modifications effectuées depuis la sauvegarde."
  options:
    b: { en: "Authoritative objects get version numbers higher than on all other domain controllers, so the two-day-old data would overwrite the recent changes.", fr: "Les objets faisant autorité reçoivent des numéros de version supérieurs à ceux de tous les autres contrôleurs de domaine : les données vieilles de deux jours écraseraient les modifications récentes." }
    c: { en: "Restoring AD DS requires full access to the database files, which requires restarting the domain controller in DSRM.", fr: "Restaurer AD DS exige un accès complet aux fichiers de la base, ce qui impose de redémarrer le contrôleur de domaine en DSRM." }
    d: { en: "The Recycle Bin restores deleted objects; it can't repair a corrupted database.", fr: "La Corbeille restaure des objets supprimés ; elle ne peut pas réparer une base corrompue." }
references:
  - title: Recover the AD DS database
    url: https://learn.microsoft.com/en-us/training/modules/troubleshoot-active-directory/3-recover-active-directory-domain-services-database
