id: az802-7b-arc-monitor-mode
objective: "7.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an on-premises server named **SRV2** that is onboarded to Azure Arc. The Azure Monitor Agent extension is installed on SRV2.

    An administrator tries to deploy the Custom Script Extension to SRV2 from the Azure portal, and the deployment fails. On SRV2, `azcmagent config list` shows that `config.mode` is set to `monitor`.

    You need to allow only the Azure Monitor Agent and the Custom Script Extension to be installed on SRV2.

    What should you do first on SRV2?
  fr: |
    Vous disposez d'un serveur local nommé **SRV2** intégré à Azure Arc. L'extension Azure Monitor Agent est installée sur SRV2.

    Un administrateur tente de déployer l'extension Custom Script Extension sur SRV2 depuis le portail Azure, et le déploiement échoue. Sur SRV2, `azcmagent config list` indique que `config.mode` a la valeur `monitor`.

    Seuls l'agent Azure Monitor et l'extension Custom Script Extension doivent pouvoir être installés sur SRV2.

    Que devez-vous faire en premier sur SRV2 ?
body:
  options:
    - { id: a, text: { en: "Run `azcmagent config set extensions.allowlist` with both extensions.", fr: "Exécuter `azcmagent config set extensions.allowlist` avec les deux extensions." } }
    - { id: b, text: { en: "Run `azcmagent config set extensions.enabled true`.", fr: "Exécuter `azcmagent config set extensions.enabled true`." } }
    - { id: c, text: { en: "Run `azcmagent config set config.mode full`.", fr: "Exécuter `azcmagent config set config.mode full`." } }
    - { id: d, text: { en: "Run `azcmagent disconnect`, and then run `azcmagent connect`.", fr: "Exécuter `azcmagent disconnect`, puis `azcmagent connect`." } }
answer: { optionId: c }
explanation:
  correct:
    en: "In monitor mode the Connected Machine agent allows only monitoring and security extensions and blocks extensions that can run scripts, such as the Custom Script Extension. You can't modify the allowlist or the blocklist while the agent is in monitor mode, so you first switch back to full mode and then set your own allowlist with the two extensions."
    fr: "En mode supervision (monitor), l'agent Connected Machine n'autorise que les extensions de supervision et de sécurité et bloque celles qui peuvent exécuter des scripts, comme Custom Script Extension. Vous ne pouvez pas modifier la liste d'autorisation ni la liste de blocage tant que l'agent est en mode supervision : vous revenez donc d'abord en mode complet (full), puis vous définissez votre propre liste d'autorisation avec les deux extensions."
  options:
    a: { en: "The allowlist can't be changed while the agent is in monitor mode; this is the second step.", fr: "La liste d'autorisation ne peut pas être modifiée tant que l'agent est en mode supervision ; c'est la deuxième étape." }
    b: { en: "The extension manager is already enabled, since the Azure Monitor Agent runs; the mode is what blocks the script extension.", fr: "Le gestionnaire d'extensions est déjà activé, puisque l'agent Azure Monitor s'exécute ; c'est le mode qui bloque l'extension de script." }
    d: { en: "Reconnecting the server doesn't change the local agent configuration and needlessly removes its Azure resource.", fr: "Reconnecter le serveur ne change pas la configuration locale de l'agent et supprime inutilement sa ressource Azure." }
references:
  - title: Extensions security for Azure Arc-enabled servers
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/security-extensions
