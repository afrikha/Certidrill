id: az802-7a-wevtutil-archive
objective: "7.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A server named **DC3** runs Windows Server 2022. The auditors require that no event of the **Security** log of DC3 is ever overwritten.

    You need to configure the Security log with a maximum size of 1 GB (1,073,741,824 bytes). When the log is full, it must be backed up automatically.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur nommé **DC3** exécute Windows Server 2022. Les auditeurs exigent qu'aucun événement du journal **Sécurité** de DC3 ne soit jamais remplacé.

    Vous devez configurer le journal Sécurité avec une taille maximale de 1 Go (1 073 741 824 octets). Lorsque le journal est plein, il doit être sauvegardé automatiquement.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    wevtutil [[verb]] Security /ms:1073741824 /rt:[[rt]] /ab:[[ab]]
  slots:
    - id: verb
      options:
        - { id: gl, text: gl }
        - { id: sl, text: sl }
        - { id: epl, text: epl }
        - { id: cl, text: cl }
    - id: rt
      options:
        - { id: rtf, text: "false" }
        - { id: rtt, text: "true" }
    - id: ab
      options:
        - { id: abt, text: "true" }
        - { id: abf, text: "false" }
answer:
  values: { verb: sl, rt: rtt, ab: abt }
explanation:
  correct:
    en: "`wevtutil sl` (set-log) changes the configuration of a log. With `/rt:true`, existing events are retained when the log reaches its maximum size instead of being overwritten. `/ab:true` backs up the log automatically when it's full, and it requires `/rt:true`."
    fr: "`wevtutil sl` (set-log) modifie la configuration d'un journal. Avec `/rt:true`, les événements existants sont conservés quand le journal atteint sa taille maximale au lieu d'être remplacés. `/ab:true` sauvegarde automatiquement le journal quand il est plein, et exige `/rt:true`."
  options:
    gl: { en: "gl (get-log) only displays the configuration of a log.", fr: "gl (get-log) affiche seulement la configuration d'un journal." }
    epl: { en: "epl (export-log) exports events to a file; it doesn't change the log settings.", fr: "epl (export-log) exporte des événements vers un fichier ; il ne modifie pas les paramètres du journal." }
    cl: { en: "cl (clear-log) clears the log, optionally after a backup.", fr: "cl (clear-log) efface le journal, éventuellement après une sauvegarde." }
    rtf: { en: "With /rt:false, incoming events overwrite the oldest events when the log is full.", fr: "Avec /rt:false, les nouveaux événements remplacent les plus anciens quand le journal est plein." }
    abf: { en: "With /ab:false, the full log isn't backed up automatically.", fr: "Avec /ab:false, le journal plein n'est pas sauvegardé automatiquement." }
references:
  - title: wevtutil
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
