id: az802-cs4b-dcr-xpath
objective: "7.1.6"
type: dragdrop
caseStudy: az802-cs4b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    You create data collection rules with a **Windows Event Logs** data source of type **Custom** to meet the event collection requirement.

    Which XPath query should you use for each set of events? To answer, drag the appropriate queries to the correct sets of events. Each query may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez des règles de collecte de données avec une source de données **Windows Event Logs** de type **Custom** pour satisfaire l'exigence de collecte des événements.

    Quelle requête XPath devez-vous utiliser pour chaque ensemble d'événements ? Pour répondre, faites glisser les requêtes appropriées vers les ensembles d'événements correspondants. Chaque requête peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sys12, text: "System!*[System[(Level=1 or Level=2)]]" }
    - { id: sys23, text: "System!*[System[(Level=2 or Level=3)]]" }
    - { id: sys123, text: "System!*[System[(Level=1 or Level=2 or Level=3)]]" }
    - { id: sec4740, text: "Security!*[System[(EventID=4740)]]" }
    - { id: contains, text: "Security!*[System[contains(EventID,'4740')]]" }
    - { id: app12, text: "Application!*[System[(Level=1 or Level=2)]]" }
  targets:
    - { id: fs, text: { en: "FS1, FS2 and FS3: Critical and Error events of the System log", fr: "FS1, FS2 et FS3 : événements critiques et d'erreur du journal System" } }
    - { id: dcsec, text: { en: "DC1, DC2 and DC3: events with Event ID 4740 of the Security log", fr: "DC1, DC2 et DC3 : événements d'ID 4740 du journal Security" } }
    - { id: dcsys, text: { en: "DC1, DC2 and DC3: Critical, Error and Warning events of the System log", fr: "DC1, DC2 et DC3 : événements critiques, d'erreur et d'avertissement du journal System" } }
answer:
  mapping: { fs: sys12, dcsec: sec4740, dcsys: sys123 }
explanation:
  correct:
    en: |
      A custom XPath query of a data collection rule has the form `LogName!XPathQuery`. Level 1 is Critical, 2 is Error and 3 is Warning, so the file servers need levels 1 and 2 and the domain controllers need levels 1 to 3 of the System log. The Security events are filtered on `EventID=4740`. Without Microsoft Sentinel, all these events are stored in the Event table of LAW-Lucerne.
    fr: |
      Une requête XPath personnalisée d'une règle de collecte de données a la forme `LogName!XPathQuery`. Le niveau 1 correspond à Critique, 2 à Erreur et 3 à Avertissement : les serveurs de fichiers ont besoin des niveaux 1 et 2, et les contrôleurs de domaine des niveaux 1 à 3 du journal System. Les événements Security sont filtrés sur `EventID=4740`. Sans Microsoft Sentinel, tous ces événements sont stockés dans la table Event de LAW-Lucerne.
  options:
    sys23: { en: "Levels 2 and 3 are Error and Warning; this query misses the Critical events.", fr: "Les niveaux 2 et 3 correspondent à Erreur et Avertissement ; cette requête omet les événements critiques." }
    contains: { en: "Windows event log XPath is limited to XPath 1.0 and does not support the contains function.", fr: "Le XPath des journaux des événements Windows est limité à XPath 1.0 et ne prend pas en charge la fonction contains." }
    app12: { en: "This query reads the Application log, not the System log.", fr: "Cette requête lit le journal Application, pas le journal System." }
references:
  - title: Collect Windows events from virtual machines with Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events
