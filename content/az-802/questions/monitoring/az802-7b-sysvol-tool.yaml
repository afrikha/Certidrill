id: az802-7b-sysvol-tool
objective: "7.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your AD DS domain uses DFS Replication for SYSVOL. The SYSVOL folder of a domain controller named **DC3** is damaged, while SYSVOL is healthy on the other domain controllers.

    You need to change the attribute that disables SYSVOL replication on DC3 so that you can perform a nonauthoritative synchronization.

    Which tool should you use?
  fr: |
    Votre domaine AD DS utilise la réplication DFS pour SYSVOL. Le dossier SYSVOL d'un contrôleur de domaine nommé **DC3** est endommagé, alors que SYSVOL est sain sur les autres contrôleurs de domaine.

    Vous devez modifier l'attribut qui désactive la réplication de SYSVOL sur DC3 afin d'effectuer une synchronisation ne faisant pas autorité.

    Quel outil devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The DFS Management console", fr: "La console Gestion DFS" } }
    - { id: b, text: { en: "ADSI Edit", fr: "ADSI Edit" } }
    - { id: c, text: { en: "The Dfsradmin command-line tool", fr: "L'outil en ligne de commande Dfsradmin" } }
    - { id: d, text: { en: "The Group Policy Management console", fr: "La console Gestion des stratégies de groupe" } }
answer: { optionId: b }
explanation:
  correct:
    en: "You set `msDFSR-Enabled` to FALSE on the SYSVOL Subscription object of DC3 in ADSI Edit (or in the Attribute Editor of Active Directory Users and Computers with Advanced Features). SYSVOL replication is intentionally protected from editing through its management interfaces."
    fr: "Vous définissez `msDFSR-Enabled` sur FALSE sur l'objet SYSVOL Subscription de DC3 dans ADSI Edit (ou dans l'Attribute Editor d'Utilisateurs et ordinateurs Active Directory avec Advanced Features). La réplication de SYSVOL est volontairement protégée contre toute modification par ses interfaces de gestion."
  options:
    a: { en: "The DFS Management snap-in can't force a nonauthoritative synchronization of SYSVOL.", fr: "Le composant logiciel enfichable Gestion DFS ne peut pas forcer une synchronisation de SYSVOL ne faisant pas autorité." }
    c: { en: "Dfsradmin can't modify SYSVOL replication, which is protected against edits from the DFSR management tools.", fr: "Dfsradmin ne peut pas modifier la réplication de SYSVOL, protégée contre les modifications par les outils de gestion de DFSR." }
    d: { en: "Group Policy Management manages GPOs; it doesn't control how DFSR replicates SYSVOL.", fr: "Gestion des stratégies de groupe gère les GPO ; elle ne contrôle pas la façon dont DFSR réplique SYSVOL." }
references:
  - title: How to force authoritative and non-authoritative synchronization for DFSR-replicated sysvol replication
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/group-policy/force-authoritative-non-authoritative-synchronization
