id: az802-7a-perf-bottleneck
objective: "7.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    A server named **SRV4** runs Windows Server 2025 and has 32 GB of RAM. A data collector set recorded the following average values during a slowdown that lasted 20 minutes.

    | Counter | Average value |
    | --- | --- |
    | `\LogicalDisk(D:)\Avg. Disk sec/Write` | 0.012 (12 ms) |
    | `\Processor Information(_Total)\% Idle Time` | 46% |
    | `\Processor Information(_Total)\% Privileged Time` | 18% |
    | `\Memory\Available MBytes` | 310 |
    | `\Memory\% Committed Bytes In Use` | 93% |

    You need to identify the resource that causes the slowdown and the next counter to add to find which application is responsible.

    Which options should you select? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur nommé **SRV4** exécute Windows Server 2025 et dispose de 32 Go de RAM. Un jeu de collecteurs de données a enregistré les valeurs moyennes suivantes pendant un ralentissement de 20 minutes.

    | Compteur | Valeur moyenne |
    | --- | --- |
    | `\LogicalDisk(D:)\Avg. Disk sec/Write` | 0,012 (12 ms) |
    | `\Processor Information(_Total)\% Idle Time` | 46 % |
    | `\Processor Information(_Total)\% Privileged Time` | 18 % |
    | `\Memory\Available MBytes` | 310 |
    | `\Memory\% Committed Bytes In Use` | 93 % |

    Vous devez identifier la ressource qui provoque le ralentissement et le prochain compteur à ajouter pour trouver l'application responsable.

    Quelles options devez-vous sélectionner ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Resource that causes the slowdown: [[res]]

      Counter to add next: [[ctr]]
    fr: |
      Ressource qui provoque le ralentissement : [[res]]

      Compteur à ajouter ensuite : [[ctr]]
  slots:
    - id: res
      options:
        - { id: disk, text: { en: "Storage", fr: "Stockage" } }
        - { id: cpu, text: { en: "Processor", fr: "Processeur" } }
        - { id: mem, text: { en: "Memory", fr: "Mémoire" } }
        - { id: net, text: { en: "Network", fr: "Réseau" } }
    - id: ctr
      options:
        - { id: ws, text: '\Process(*)\Working Set' }
        - { id: io, text: '\Process(*)\IO Write Operations/sec' }
        - { id: ut, text: '\Process(*)\% User Time' }
        - { id: pool, text: '\Memory\Pool Nonpaged Bytes' }
answer:
  values: { res: mem, ctr: ws }
explanation:
  correct:
    en: "Disk latency below 15 ms, more than 20% idle processor time and privileged time below 30% are healthy values. Less than 500 MB of available memory and more than 80% committed bytes in use are critical, so memory is the bottleneck. `\\Process(*)\\Working Set` shows how much RAM each process uses; relate it to Available MBytes to find the top consumer."
    fr: "Une latence disque inférieure à 15 ms, plus de 20 % de temps processeur inactif et un temps privilégié inférieur à 30 % sont des valeurs saines. Moins de 500 Mo de mémoire disponible et plus de 80 % d'octets validés en cours d'utilisation sont critiques : la mémoire est le goulot d'étranglement. `\\Process(*)\\Working Set` indique la RAM utilisée par chaque processus ; rapprochez-le d'Available MBytes pour trouver le plus gros consommateur."
  options:
    disk: { en: "12 ms of write latency is in the healthy range (under 15 ms).", fr: "12 ms de latence en écriture se situent dans la plage saine (moins de 15 ms)." }
    cpu: { en: "46% idle time and 18% privileged time are healthy processor values.", fr: "46 % de temps inactif et 18 % de temps privilégié sont des valeurs saines pour le processeur." }
    io: { en: "IO Write Operations/sec correlates disk activity with processes, but the disk isn't the bottleneck.", fr: "IO Write Operations/sec relie l'activité disque aux processus, mais le disque n'est pas le goulot d'étranglement." }
    ut: { en: "% User Time per process identifies processor consumers, not memory consumers.", fr: "% User Time par processus identifie les consommateurs de processeur, pas de mémoire." }
    pool: { en: "Nonpaged pool is a kernel resource used mainly by drivers; it doesn't show which application uses the memory.", fr: "La réserve non paginée est une ressource du noyau utilisée surtout par les pilotes ; elle n'indique pas quelle application utilise la mémoire." }
references:
  - title: Troubleshoot performance problems in Windows
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/performance/troubleshoot-performance-problems-in-windows
