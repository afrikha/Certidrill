id: az802-7b-vm-iops-cap
objective: "7.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure virtual machine named **SQLVM1** that runs Windows Server 2022. SQLVM1 has the following configuration:

    | Component | Configuration | Limit |
    | --- | --- | --- |
    | VM size | Standard_D8s_v3 | 12,800 uncached IOPS |
    | Data disks | Four P30 disks in a Storage Spaces simple volume, no host caching | 5,000 IOPS per disk |

    During batch jobs, the database requests about 15,000 IOPS on the data volume. Storage latency increases sharply and the volume never exceeds about 12,800 IOPS. Processor and memory usage stay below 40 percent.

    You need the batch jobs to get the IOPS they request.

    What should you do?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **SQLVM1** qui exécute Windows Server 2022. SQLVM1 a la configuration suivante :

    | Composant | Configuration | Limite |
    | --- | --- | --- |
    | Taille de machine virtuelle | Standard_D8s_v3 | 12 800 IOPS sans cache |
    | Disques de données | Quatre disques P30 dans un volume simple d'espaces de stockage, sans mise en cache de l'hôte | 5 000 IOPS par disque |

    Pendant les traitements par lots, la base de données demande environ 15 000 IOPS sur le volume de données. La latence du stockage augmente fortement et le volume ne dépasse jamais 12 800 IOPS environ. L'utilisation du processeur et de la mémoire reste inférieure à 40 %.

    Les traitements par lots doivent obtenir les IOPS qu'ils demandent.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a fifth P30 data disk to the volume.", fr: "Ajouter un cinquième disque de données P30 au volume." } }
    - { id: b, text: { en: "Replace the four P30 disks with P40 disks.", fr: "Remplacer les quatre disques P30 par des disques P40." } }
    - { id: c, text: { en: "Enable Accelerated Networking on the network interface.", fr: "Activer la mise en réseau accélérée sur l'interface réseau." } }
    - { id: d, text: { en: "Resize SQLVM1 to a size with a higher uncached IOPS limit.", fr: "Redimensionner SQLVM1 vers une taille dont la limite d'IOPS sans cache est plus élevée." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The four disks can deliver 20,000 IOPS together, but the Standard_D8s_v3 size is provisioned for only 12,800 uncached IOPS, so the virtual machine caps the workload at that level. Only a VM size with a higher uncached limit removes the bottleneck; changing the disks can't raise a VM-level cap."
    fr: "Les quatre disques peuvent fournir 20 000 IOPS ensemble, mais la taille Standard_D8s_v3 n'est provisionnée que pour 12 800 IOPS sans cache : la machine virtuelle plafonne donc la charge de travail à ce niveau. Seule une taille de machine virtuelle dont la limite sans cache est plus élevée supprime le goulot d'étranglement ; modifier les disques ne peut pas relever un plafond fixé par la machine virtuelle."
  options:
    a: { en: "More disks raise the disk-level capacity, which is already above the 12,800 IOPS that the VM size allows.", fr: "Davantage de disques augmentent la capacité au niveau des disques, déjà supérieure aux 12 800 IOPS qu'autorise la taille de machine virtuelle." }
    b: { en: "Faster disks don't help when the VM size limit is the bottleneck.", fr: "Des disques plus rapides n'aident pas quand la limite de la taille de machine virtuelle est le goulot d'étranglement." }
    c: { en: "Accelerated Networking improves network throughput and latency; managed disk IOPS are limited by the VM size.", fr: "La mise en réseau accélérée améliore le débit et la latence du réseau ; les IOPS des disques managés sont limitées par la taille de machine virtuelle." }
references:
  - title: Virtual machine and disk performance
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-performance
