id: az802-7b-duplicate-spn-fix
objective: "7.3.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A web application at **http://app1.contoso.com** runs under a domain account named **CONTOSO\svc-app1**. After an administrator reused an old configuration script, users can no longer authenticate to the application by using Kerberos, and the client logs show `KDC_ERR_PRINCIPAL_NOT_UNIQUE`. You suspect that the SPN HTTP/app1.contoso.com is also registered on a retired account.

    You need to restore Kerberos authentication to the application.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une application web accessible à l'adresse **http://app1.contoso.com** s'exécute sous un compte de domaine nommé **CONTOSO\svc-app1**. Après qu'un administrateur a réutilisé un ancien script de configuration, les utilisateurs ne peuvent plus s'authentifier auprès de l'application avec Kerberos, et les journaux des clients indiquent `KDC_ERR_PRINCIPAL_NOT_UNIQUE`. Vous soupçonnez que le SPN HTTP/app1.contoso.com est aussi inscrit sur un compte retiré.

    Vous devez rétablir l'authentification Kerberos auprès de l'application.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: find, text: { en: "Run `setspn -X` to find the accounts that hold duplicate SPNs.", fr: "Exécuter `setspn -X` pour trouver les comptes qui portent des SPN en double." } }
    - { id: delete, text: { en: "Run `setspn -D` to delete the SPN from the retired account.", fr: "Exécuter `setspn -D` pour supprimer le SPN du compte retiré." } }
    - { id: purge, text: { en: "Run `klist purge` on the affected client computers.", fr: "Exécuter `klist purge` sur les ordinateurs clients concernés." } }
    - { id: add, text: { en: "Run `setspn -A` to add the SPN to CONTOSO\\svc-app1.", fr: "Exécuter `setspn -A` pour ajouter le SPN à CONTOSO\\svc-app1." } }
    - { id: reset, text: { en: "Run `setspn -R` to reset the default SPNs of the web server.", fr: "Exécuter `setspn -R` pour réinitialiser les SPN par défaut du serveur web." } }
    - { id: list, text: { en: "Run `setspn -L` to list the SPNs of CONTOSO\\svc-app1.", fr: "Exécuter `setspn -L` pour lister les SPN de CONTOSO\\svc-app1." } }
answer:
  sequence: [ find, delete, purge ]
explanation:
  correct:
    en: "`KDC_ERR_PRINCIPAL_NOT_UNIQUE` means the requested SPN is associated with more than one account. `setspn -X` searches for duplicate SPNs and shows which accounts hold them, `setspn -D` deletes the SPN from the wrong account, and `klist purge` clears the cached tickets on the clients so they request new ones for the corrected SPN."
    fr: "`KDC_ERR_PRINCIPAL_NOT_UNIQUE` signifie que le SPN demandé est associé à plusieurs comptes. `setspn -X` recherche les SPN en double et indique les comptes qui les portent, `setspn -D` supprime le SPN du mauvais compte, et `klist purge` vide les tickets en cache des clients pour qu'ils en demandent de nouveaux pour le SPN corrigé."
  options:
    add: { en: "svc-app1 already has the SPN; adding it again doesn't remove the duplicate, and -S should be used instead of -A because it checks for duplicates.", fr: "svc-app1 porte déjà le SPN ; l'ajouter de nouveau ne supprime pas le doublon, et -S doit être préféré à -A, car il vérifie l'absence de doublons." }
    reset: { en: "-R resets the default host SPNs of a computer; it doesn't touch the duplicate HTTP SPN on the retired account.", fr: "-R réinitialise les SPN d'hôte par défaut d'un ordinateur ; il ne touche pas au SPN HTTP en double du compte retiré." }
    list: { en: "Listing the SPNs of svc-app1 doesn't reveal the other account that holds the same SPN.", fr: "Lister les SPN de svc-app1 ne révèle pas l'autre compte qui porte le même SPN." }
references:
  - title: Setspn
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc731241(v=ws.11)
  - title: Kerberos authentication troubleshooting guidance
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/windows-security/kerberos-authentication-troubleshooting-guidance
