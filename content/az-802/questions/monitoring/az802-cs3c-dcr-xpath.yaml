id: az802-cs3c-dcr-xpath
objective: "7.1.6"
type: dropdown
caseStudy: az802-cs3c-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    You are creating a data collection rule (DCR) to meet the monitoring requirement. You first test the query on HV1. How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une règle de collecte de données (DCR) pour satisfaire l'exigence de supervision. Vous testez d'abord la requête sur HV1. Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    # XPath entry of the DCR
    [[log]]!*[System[([[levels]])]]

    # Local test on HV1: $LogName holds the part before "!", $XPath the part after it
    Get-WinEvent -LogName $LogName -[[param]] $XPath
  slots:
    - id: log
      options:
        - { id: event, text: "Event" }
        - { id: system, text: "System" }
        - { id: setup, text: "Setup" }
    - id: levels
      options:
        - { id: l12, text: "Level=1 or Level=2" }
        - { id: l23, text: "Level=2 or Level=3" }
        - { id: l34, text: "Level=3 or Level=4" }
    - id: param
      options:
        - { id: hashtable, text: "FilterHashtable" }
        - { id: xpath, text: "FilterXPath" }
        - { id: xml, text: "FilterXml" }
answer:
  values: { log: system, levels: l12, param: xpath }
explanation:
  correct:
    en: |
      A DCR XPath entry has the form LogName!XPathQuery, and Level 1 is Critical and Level 2 is Error. To test it locally, you pass the log name (the part before the exclamation mark) to -LogName and the rest of the query to the FilterXPath parameter of Get-WinEvent; returned events prove that the query is valid.
    fr: |
      Une entrée XPath de DCR a la forme NomDuJournal!RequêteXPath, et le niveau 1 correspond à Critique et le niveau 2 à Erreur. Pour la tester localement, vous passez le nom du journal (la partie avant le point d'exclamation) à -LogName et le reste de la requête au paramètre FilterXPath de Get-WinEvent ; si des événements sont renvoyés, la requête est valide.
  options:
    event:
      en: |
        Event is the Log Analytics table that receives Windows events; the XPath entry starts with the name of the Windows event log to read.
      fr: |
        Event est la table Log Analytics qui reçoit les événements Windows ; l'entrée XPath commence par le nom du journal des événements Windows à lire.
    l23:
      en: |
        Level 3 is Warning, which the requirement does not ask for, and Level 1 (Critical) would be missing.
      fr: |
        Le niveau 3 correspond à Avertissement, que l'exigence ne demande pas, et le niveau 1 (Critique) manquerait.
    hashtable:
      en: |
        FilterHashtable expects a hash table of keys such as LogName and Level, not an XPath string.
      fr: |
        FilterHashtable attend une table de hachage de clés telles que LogName et Level, pas une chaîne XPath.
    xml:
      en: |
        FilterXml expects a complete structured XML query, not the XPath expression copied from the DCR.
      fr: |
        FilterXml attend une requête XML structurée complète, pas l'expression XPath copiée depuis la DCR.
references:
  - title: Collect Windows events from virtual machines with Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events
