id: az802-7a-dcr-security-duplicate
objective: "7.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Log Analytics workspace named **Workspace2** on which Microsoft Sentinel is enabled. The **Windows Security Events via AMA** connector of Sentinel collects the Security log of 30 domain controllers that run Windows Server 2022. The Sentinel analytics rules query the **SecurityEvent** table.

    A data collection rule named **DCR-Servers** is also associated with the domain controllers. DCR-Servers has a Windows Event Logs data source that collects the System, Application and Security logs and sends them to Workspace2.

    You discover that ingestion costs are higher than expected because the same security events are stored twice. You need to stop the duplication without affecting the Sentinel analytics rules. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Log Analytics nommé **Workspace2** sur lequel Microsoft Sentinel est activé. Le connecteur Sentinel **Windows Security Events via AMA** collecte le journal Sécurité de 30 contrôleurs de domaine qui exécutent Windows Server 2022. Les règles analytiques de Sentinel interrogent la table **SecurityEvent**.

    Une règle de collecte de données nommée **DCR-Servers** est aussi associée aux contrôleurs de domaine. DCR-Servers possède une source de données Windows Event Logs qui collecte les journaux Système, Application et Sécurité et les envoie vers Workspace2.

    Vous constatez que les coûts d'ingestion sont plus élevés que prévu parce que les mêmes événements de sécurité sont stockés deux fois. Vous devez mettre fin à la duplication sans affecter les règles analytiques de Sentinel. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Remove the Security log from the Windows Event Logs data source of DCR-Servers.", fr: "Retirer le journal Sécurité de la source de données Windows Event Logs de DCR-Servers." } }
    - { id: b, text: { en: "Disconnect the Windows Security Events via AMA connector in Sentinel.", fr: "Déconnecter le connecteur Windows Security Events via AMA dans Sentinel." } }
    - { id: c, text: { en: "Change the destination of DCR-Servers to a second Log Analytics workspace.", fr: "Remplacer la destination de DCR-Servers par un second espace de travail Log Analytics." } }
    - { id: d, text: { en: "Remove the association between DCR-Servers and the domain controllers.", fr: "Supprimer l'association entre DCR-Servers et les contrôleurs de domaine." } }
answer: { optionId: a }
explanation:
  correct:
    en: When a DCR collects the Security log, the events go to the Event table, while the Sentinel connector uses the same Azure Monitor Agent to send the same events to the SecurityEvent table. Removing Security from DCR-Servers stops the copy in Event and keeps SecurityEvent, which the analytics rules use, while System and Application collection continues.
    fr: Lorsqu'une DCR collecte le journal Sécurité, les événements vont dans la table Event, tandis que le connecteur Sentinel utilise le même agent Azure Monitor pour envoyer les mêmes événements dans la table SecurityEvent. Retirer Sécurité de DCR-Servers supprime la copie dans Event et conserve SecurityEvent, utilisée par les règles analytiques, tout en maintenant la collecte de Système et Application.
  options:
    b: { en: "Disconnecting the connector stops the SecurityEvent data that the Sentinel analytics rules query.", fr: "Déconnecter le connecteur arrête les données SecurityEvent qu'interrogent les règles analytiques de Sentinel." }
    c: { en: "Sending the events to another workspace still ingests them twice and adds cost.", fr: "Envoyer les événements vers un autre espace de travail les ingère toujours deux fois et ajoute des coûts." }
    d: { en: "Removing the association also stops the System and Application collection from the domain controllers.", fr: "Supprimer l'association arrête aussi la collecte de Système et Application sur les contrôleurs de domaine." }
references:
  - title: Collect Windows events from virtual machines with Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events
