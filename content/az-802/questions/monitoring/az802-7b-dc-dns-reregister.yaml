id: az802-7b-dc-dns-reregister
objective: "7.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Your AD DS forest root domain is **contoso.com**. An administrator cleaning up the DNS zones accidentally deleted the host (A) record of a domain controller named **DC3** and the CNAME record of DC3 in the _msdcs.contoso.com zone. The other domain controllers now fail to replicate from DC3.

    You need to re-create both records by having DC3 register them again.

    Which two commands should you run on DC3? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le domaine racine de votre forêt AD DS est **contoso.com**. En nettoyant les zones DNS, un administrateur a supprimé par erreur l'enregistrement d'hôte (A) d'un contrôleur de domaine nommé **DC3** et l'enregistrement CNAME de DC3 dans la zone _msdcs.contoso.com. Les autres contrôleurs de domaine ne parviennent plus à répliquer depuis DC3.

    Vous devez recréer les deux enregistrements en faisant en sorte que DC3 les inscrive de nouveau.

    Quelles sont les deux commandes que vous devez exécuter sur DC3 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "ipconfig /flushdns" }
    - { id: b, text: "net stop netlogon & net start netlogon" }
    - { id: c, text: "repadmin /syncall DC3" }
    - { id: d, text: "ipconfig /registerdns" }
    - { id: e, text: "dcdiag /test:dns" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "`ipconfig /registerdns` dynamically registers the host (A) record of the computer. The CNAME record of a domain controller in the _msdcs zone of the forest root is registered by the Net Logon service, so restarting Net Logon on the source domain controller registers it again. Destination domain controllers can then resolve DC3 and replicate."
    fr: "`ipconfig /registerdns` inscrit dynamiquement l'enregistrement d'hôte (A) de l'ordinateur. L'enregistrement CNAME d'un contrôleur de domaine dans la zone _msdcs de la racine de la forêt est inscrit par le service Netlogon : redémarrer Netlogon sur le contrôleur de domaine source l'inscrit donc de nouveau. Les contrôleurs de domaine de destination peuvent ensuite résoudre DC3 et répliquer."
  options:
    a: { en: "Flushing the resolver cache of DC3 doesn't register any record.", fr: "Vider le cache du résolveur de DC3 n'inscrit aucun enregistrement." }
    c: { en: "Replication still fails while the partners can't resolve DC3; it doesn't create DNS records.", fr: "La réplication échoue tant que les partenaires ne peuvent pas résoudre DC3 ; elle ne crée pas d'enregistrements DNS." }
    e: { en: "dcdiag /test:dns checks the DNS health of the domain controller but doesn't register the missing records.", fr: "dcdiag /test:dns vérifie l'état DNS du contrôleur de domaine mais n'inscrit pas les enregistrements manquants." }
references:
  - title: Active Directory Replication fails with Win32 error 8524
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/replication-error-8524
