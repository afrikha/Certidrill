id: az802-7a-dcr-arc-order
objective: "7.1.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Your on-premises network contains a server named **SRV1** that runs Windows Server 2022. SRV1 isn't connected to Azure. You have an Azure subscription that contains a Log Analytics workspace named **Workspace1**.

    You need to collect the Critical and Error events of the Application log of SRV1 in Workspace1 by using Azure Monitor. You plan to perform the configuration from the Azure portal. The solution must minimize the number of actions.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Votre réseau local contient un serveur nommé **SRV1** qui exécute Windows Server 2022. SRV1 n'est pas connecté à Azure. Vous disposez d'un abonnement Azure qui contient un espace de travail Log Analytics nommé **Workspace1**.

    Vous devez collecter dans Workspace1 les événements Critique et Erreur du journal Application de SRV1 à l'aide d'Azure Monitor. Vous prévoyez d'effectuer la configuration depuis le portail Azure. La solution doit réduire au minimum le nombre d'actions.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: arc, text: { en: "Install the Azure Connected Machine agent on SRV1 and connect it to Azure Arc.", fr: "Installer l'agent Azure Connected Machine sur SRV1 et le connecter à Azure Arc." } }
    - { id: dcr, text: { en: "Create a DCR that has a Windows Event Logs data source and Workspace1 as the destination.", fr: "Créer une DCR avec une source de données Windows Event Logs et Workspace1 comme destination." } }
    - { id: assoc, text: { en: "Add SRV1 as a resource of the DCR.", fr: "Ajouter SRV1 comme ressource de la DCR." } }
    - { id: dce, text: { en: "Create a data collection endpoint (DCE) and select it in the DCR.", fr: "Créer un point de terminaison de collecte de données (DCE) et le sélectionner dans la DCR." } }
    - { id: mma, text: { en: "Install the Log Analytics agent on SRV1 and enter the workspace ID and key.", fr: "Installer l'agent Log Analytics sur SRV1 et saisir l'ID et la clé de l'espace de travail." } }
    - { id: dep, text: { en: "Install the Dependency agent on SRV1.", fr: "Installer l'agent Dependency sur SRV1." } }
answer:
  sequence: [ arc, dcr, assoc ]
explanation:
  correct:
    en: |
      A machine outside Azure must first be connected to Azure Arc with the Connected Machine agent before the Azure Monitor Agent can be installed. Then the DCR defines what to collect (Windows events filtered by log and level) and where to send it. Adding SRV1 as a resource of the DCR in the portal installs the Azure Monitor Agent if needed and creates the association, so the agent downloads the DCR and starts collecting.
    fr: |
      Une machine hors d'Azure doit d'abord être connectée à Azure Arc avec l'agent Connected Machine avant de pouvoir installer l'agent Azure Monitor. La DCR définit ensuite ce qu'il faut collecter (événements Windows filtrés par journal et niveau) et où l'envoyer. Ajouter SRV1 comme ressource de la DCR dans le portail installe l'agent Azure Monitor si nécessaire et crée l'association : l'agent télécharge la DCR et commence la collecte.
  options:
    mma: { en: "The Log Analytics agent was retired on August 31, 2024; new collections use the Azure Monitor Agent and DCRs.", fr: "L'agent Log Analytics a été mis hors service le 31 août 2024 ; les nouvelles collectes utilisent l'agent Azure Monitor et des DCR." }
    dce: { en: "A DCE is required only for data sources that need one; Windows events don't.", fr: "Un DCE n'est nécessaire que pour les sources de données qui l'exigent ; ce n'est pas le cas des événements Windows." }
    dep: { en: "The Dependency agent served the VM insights Map feature, which is deprecated; it doesn't collect event logs.", fr: "L'agent Dependency servait la fonctionnalité Map de VM insights, qui est dépréciée ; il ne collecte pas les journaux des événements." }
references:
  - title: Collect log data from virtual machines with Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection
  - title: Collect Windows events from virtual machines with Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events
