id: az802-7a-dns-stale-cache
objective: "7.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named contoso.com. A DNS server named **DNS1** hosts the contoso.com zone. A server named **SRV1** runs Windows Server 2022 and uses DNS1 as its only DNS server.

    Ten minutes ago, you changed the A record of **web1.contoso.com** on DNS1 from 10.0.5.15 to 10.0.5.25. On SRV1, you obtain the following results:

    - `nslookup web1.contoso.com` returns 10.0.5.25.
    - `ping web1.contoso.com` sends packets to 10.0.5.15.
    - The hosts file of SRV1 contains only the default comment lines.

    You need SRV1 to connect to the new address of web1.contoso.com immediately.

    What should you run?
  fr: |
    Votre réseau contient un domaine Active Directory nommé contoso.com. Un serveur DNS nommé **DNS1** héberge la zone contoso.com. Un serveur nommé **SRV1** exécute Windows Server 2022 et utilise DNS1 comme unique serveur DNS.

    Il y a dix minutes, vous avez modifié l'enregistrement A de **web1.contoso.com** sur DNS1, de 10.0.5.15 en 10.0.5.25. Sur SRV1, vous obtenez les résultats suivants :

    - `nslookup web1.contoso.com` renvoie 10.0.5.25.
    - `ping web1.contoso.com` envoie les paquets vers 10.0.5.15.
    - Le fichier hosts de SRV1 ne contient que les lignes de commentaire par défaut.

    SRV1 doit se connecter immédiatement à la nouvelle adresse de web1.contoso.com.

    Que devez-vous exécuter ?
body:
  options:
    - { id: a, text: { en: "Clear-DnsServerCache on DNS1", fr: "Clear-DnsServerCache sur DNS1" } }
    - { id: b, text: { en: "Register-DnsClient on SRV1", fr: "Register-DnsClient sur SRV1" } }
    - { id: c, text: { en: "Restart-Service DNS on DNS1", fr: "Restart-Service DNS sur DNS1" } }
    - { id: d, text: { en: "Clear-DnsClientCache on SRV1", fr: "Clear-DnsClientCache sur SRV1" } }
answer: { optionId: d }
explanation:
  correct:
    en: "nslookup doesn't use the client's DNS cache: it queries DNS1 directly and gets the new address, so the server side is correct. Applications such as ping use the DNS Client service, which first checks its local cache; the hosts file is empty, so the old address comes from a cached response whose TTL hasn't expired. `Clear-DnsClientCache` (equivalent to `ipconfig /flushdns`) deletes the cache contents."
    fr: "nslookup n'utilise pas le cache DNS du client : il interroge directement DNS1 et obtient la nouvelle adresse ; le côté serveur est donc correct. Les applications comme ping utilisent le service Client DNS, qui consulte d'abord son cache local ; le fichier hosts étant vide, l'ancienne adresse provient d'une réponse en cache dont la durée de vie (TTL) n'a pas expiré. `Clear-DnsClientCache` (équivalent à `ipconfig /flushdns`) supprime le contenu du cache."
  options:
    a: { en: "DNS1 already answers with the new address, as nslookup shows; its cache isn't involved.", fr: "DNS1 répond déjà avec la nouvelle adresse, comme le montre nslookup ; son cache n'est pas en cause." }
    b: { en: "Register-DnsClient updates the DNS records of SRV1 itself; it doesn't clear cached answers about other names.", fr: "Register-DnsClient met à jour les enregistrements DNS de SRV1 lui-même ; il ne vide pas les réponses en cache concernant d'autres noms." }
    c: { en: "Restarting the DNS Server service on DNS1 doesn't change the cache of the SRV1 client.", fr: "Redémarrer le service Serveur DNS sur DNS1 ne modifie pas le cache du client SRV1." }
references:
  - title: Troubleshooting DNS clients
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/troubleshoot/troubleshoot-dns-client
  - title: DNS Queries and Lookups in Windows and Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/networking/dns/queries-lookups
