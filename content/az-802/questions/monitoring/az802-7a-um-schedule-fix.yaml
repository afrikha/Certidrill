id: az802-7a-um-schedule-fix
objective: "7.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure virtual machine named **VM5** that runs Windows Server 2022. You use Azure Update Manager to patch VM5 with a maintenance configuration that runs every Sunday from 01:00 to 04:00. VM5 is attached to the maintenance configuration.

    The following information applies to VM5:

    - The patch orchestration of VM5 is set to **AutomaticByOS** (Windows automatic updates).
    - To reduce costs, an automation job deallocates VM5 every day at 20:00 and starts it at 00:55.

    No scheduled update has ever run on VM5. You need the Sunday schedule to patch VM5.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **VM5** qui exécute Windows Server 2022. Vous utilisez le Gestionnaire de mise à jour Azure pour corriger VM5 avec une configuration de maintenance qui s'exécute chaque dimanche de 01:00 à 04:00. VM5 est attachée à la configuration de maintenance.

    Les informations suivantes s'appliquent à VM5 :

    - L'orchestration des correctifs de VM5 est définie sur **AutomaticByOS** (Windows automatic updates).
    - Pour réduire les coûts, une tâche d'automatisation libère VM5 chaque jour à 20:00 et la démarre à 00:55.

    Aucune mise à jour planifiée ne s'est jamais exécutée sur VM5. La planification du dimanche doit corriger VM5.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Register the subscription to the Microsoft.Compute resource provider.", fr: "Inscrire l'abonnement auprès du fournisseur de ressources Microsoft.Compute." } }
    - { id: b, text: { en: "Set the patch orchestration of VM5 to Customer Managed Schedules.", fr: "Définir l'orchestration des correctifs de VM5 sur Customer Managed Schedules." } }
    - { id: c, text: { en: "Extend the maintenance window so that it ends at 06:00.", fr: "Prolonger la fenêtre de maintenance pour qu'elle se termine à 06:00." } }
    - { id: d, text: { en: "Configure VM5 to use a WSUS server as its update source.", fr: "Configurer VM5 pour utiliser un serveur WSUS comme source de mises à jour." } }
    - { id: e, text: { en: "Change the automation job so that VM5 starts at least 15 minutes before 01:00.", fr: "Modifier la tâche d'automatisation pour que VM5 démarre au moins 15 minutes avant 01:00." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: Scheduled patching of Azure machines requires the patch orchestration to be set to Customer Managed Schedules. Machines must also be turned on at least 15 minutes before the scheduled update; VM5 starts only 5 minutes before the window, so the schedule can't run.
    fr: L'application planifiée de correctifs sur les machines Azure exige que l'orchestration des correctifs soit définie sur Customer Managed Schedules. Les machines doivent aussi être allumées au moins 15 minutes avant la mise à jour planifiée ; VM5 ne démarre que 5 minutes avant la fenêtre, la planification ne peut donc pas s'exécuter.
  options:
    a: { en: "Registering Microsoft.Compute is a fix for the periodic assessment of Azure Arc-enabled servers, not for Azure VM schedules.", fr: "L'inscription de Microsoft.Compute corrige l'évaluation périodique des serveurs avec Azure Arc, pas les planifications des machines virtuelles Azure." }
    c: { en: "The window length isn't the issue: the schedule never starts because of the orchestration mode and the late start of VM5.", fr: "La durée de la fenêtre n'est pas en cause : la planification ne démarre jamais en raison du mode d'orchestration et du démarrage tardif de VM5." }
    d: { en: "Changing the update source doesn't make Update Manager run the schedule.", fr: "Changer la source de mises à jour ne fait pas exécuter la planification par le Gestionnaire de mise à jour." }
references:
  - title: Scheduling Recurring Updates in Azure Update Manager
    url: https://learn.microsoft.com/en-us/azure/update-manager/scheduled-patching
  - title: Troubleshoot Known Issues with Azure Update Manager
    url: https://learn.microsoft.com/en-us/azure/update-manager/troubleshoot
