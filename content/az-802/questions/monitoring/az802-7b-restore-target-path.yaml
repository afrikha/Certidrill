id: az802-7b-restore-target-path
objective: "7.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your AD DS domain named **contoso.com** has Active Directory Recycle Bin enabled.

    Last week, an administrator deleted the **Contractors** OU and all the user accounts it contained, because the contract ended. Today, one of these contractors, **ben**, is hired as an employee. The Contractors OU must not be restored.

    You need to restore the user account of ben, with its group memberships, into the existing **Staff** OU.

    Which command should you run?
  fr: |
    La Corbeille Active Directory est activée dans votre domaine AD DS nommé **contoso.com**.

    La semaine dernière, un administrateur a supprimé l'UO **Contractors** et tous les comptes d'utilisateur qu'elle contenait, car le contrat avait pris fin. Aujourd'hui, l'un de ces prestataires, **ben**, est embauché comme salarié. L'UO Contractors ne doit pas être restaurée.

    Vous devez restaurer le compte d'utilisateur de ben, avec ses appartenances aux groupes, dans l'UO **Staff** existante.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "Get-ADObject -Filter 'samAccountName -eq \"ben\"' -IncludeDeletedObjects | Restore-ADObject" }
    - { id: b, text: "Get-ADObject -Filter 'samAccountName -eq \"ben\"' -IncludeDeletedObjects | Restore-ADObject -NewName \"OU=Staff,DC=contoso,DC=com\"" }
    - { id: c, text: "Get-ADObject -Filter 'samAccountName -eq \"ben\"' -IncludeDeletedObjects | Restore-ADObject -TargetPath \"OU=Staff,DC=contoso,DC=com\"" }
    - { id: d, text: "Get-ADObject -Filter 'samAccountName -eq \"ben\"' -IncludeDeletedObjects | Move-ADObject -TargetPath \"OU=Staff,DC=contoso,DC=com\"" }
answer: { optionId: c }
explanation:
  correct:
    en: "`Get-ADObject -IncludeDeletedObjects` finds the deleted user, and `Restore-ADObject` restores it with all its attributes, including group memberships. `-TargetPath` sets the new location of the restored object; without it, the cmdlet uses the `lastKnownParent` attribute, which points to the deleted Contractors OU."
    fr: "`Get-ADObject -IncludeDeletedObjects` trouve l'utilisateur supprimé, et `Restore-ADObject` le restaure avec tous ses attributs, y compris ses appartenances aux groupes. `-TargetPath` définit le nouvel emplacement de l'objet restauré ; sans ce paramètre, la cmdlet utilise l'attribut `lastKnownParent`, qui désigne l'UO Contractors supprimée."
  options:
    a: { en: "Without -TargetPath, the object goes back to lastKnownParent, the deleted Contractors OU, which must not be restored.", fr: "Sans -TargetPath, l'objet retourne dans lastKnownParent, l'UO Contractors supprimée, qui ne doit pas être restaurée." }
    b: { en: "-NewName sets the name of the restored object, not its location.", fr: "-NewName définit le nom de l'objet restauré, pas son emplacement." }
    d: { en: "Move-ADObject moves existing objects; it doesn't restore a deleted object.", fr: "Move-ADObject déplace des objets existants ; il ne restaure pas un objet supprimé." }
references:
  - title: Restore-ADObject (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/restore-adobject
