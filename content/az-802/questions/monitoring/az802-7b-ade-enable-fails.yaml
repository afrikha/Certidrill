id: az802-7b-ade-enable-fails
objective: "7.2.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Your company uses Azure Disk Encryption (ADE) on existing Azure virtual machines until they are migrated to encryption at host before the ADE retirement date.

    You have a virtual machine named **VM4** in the West Europe region of a subscription named Sub1. You try to enable ADE on VM4 by using a key vault named **KV1** that is enabled for disk encryption. The operation fails, and the extension status of VM4 isn't available.

    Which two issues could cause the failure?

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre entreprise utilise Azure Disk Encryption (ADE) sur des machines virtuelles Azure existantes jusqu'à leur migration vers le chiffrement sur l'hôte avant la date de mise hors service d'ADE.

    Vous disposez d'une machine virtuelle nommée **VM4** dans la région West Europe d'un abonnement nommé Sub1. Vous tentez d'activer ADE sur VM4 avec un coffre de clés nommé **KV1** activé pour le chiffrement de disque. L'opération échoue, et l'état de l'extension de VM4 n'est pas disponible.

    Quelles sont les deux causes possibles de l'échec ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "KV1 is in the North Europe region of Sub1.", fr: "KV1 se trouve dans la région North Europe de Sub1." } }
    - { id: b, text: { en: "VM4 uses Premium SSD managed disks.", fr: "VM4 utilise des disques managés SSD Premium." } }
    - { id: c, text: { en: "A proxy on VM4 adds an X-Forwarded-For header to HTTP traffic sent to 168.63.129.16.", fr: "Un proxy sur VM4 ajoute un en-tête X-Forwarded-For au trafic HTTP envoyé à 168.63.129.16." } }
    - { id: d, text: { en: "Soft delete is enabled on KV1.", fr: "La suppression réversible est activée sur KV1." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "ADE requires the key vault to be in the same region and subscription as the virtual machine; otherwise sending the disk encryption data fails. The VM must also reach the Instance Metadata Service (169.254.169.254) and 168.63.129.16, and proxy configurations that alter local HTTP traffic to these addresses, such as adding an X-Forwarded-For header, aren't supported."
    fr: "ADE exige que le coffre de clés se trouve dans la même région et le même abonnement que la machine virtuelle ; sinon, l'envoi des données de chiffrement de disque échoue. La machine virtuelle doit aussi joindre le service de métadonnées d'instance (169.254.169.254) et 168.63.129.16, et les configurations de proxy qui modifient le trafic HTTP local vers ces adresses, par exemple en ajoutant un en-tête X-Forwarded-For, ne sont pas prises en charge."
  options:
    b: { en: "ADE encrypts managed disks of the supported disk types; Premium SSD isn't a cause of failure.", fr: "ADE chiffre les disques managés des types pris en charge ; le SSD Premium n'est pas une cause d'échec." }
    d: { en: "Soft delete is a normal protection of key vaults and doesn't prevent ADE from using KV1.", fr: "La suppression réversible est une protection normale des coffres de clés et n'empêche pas ADE d'utiliser KV1." }
references:
  - title: Azure Disk Encryption troubleshooting guide
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disk-encryption-troubleshooting
