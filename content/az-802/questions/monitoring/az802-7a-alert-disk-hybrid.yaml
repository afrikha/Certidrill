id: az802-7a-alert-disk-hybrid
objective: "7.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have 20 Azure virtual machines and 15 Azure Arc-enabled on-premises servers. All of them run Windows Server 2022, have the Azure Monitor Agent installed and send data to a Log Analytics workspace named **Workspace3**. VM insights isn't enabled.

    You need to be alerted when the free space of any logical disk of any of these machines drops below 10%. The solution must minimize the number of alert rules.

    What should you do?
  fr: |
    Vous disposez de 20 machines virtuelles Azure et de 15 serveurs locaux avec Azure Arc. Tous exécutent Windows Server 2022, ont l'agent Azure Monitor installé et envoient des données vers un espace de travail Log Analytics nommé **Workspace3**. VM insights n'est pas activé.

    Vous devez être alerté lorsque l'espace libre d'un disque logique de l'une de ces machines descend sous 10 %. La solution doit réduire au minimum le nombre de règles d'alerte.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable the recommended alert rules from the Alerts page of each of the 35 machines.", fr: "Activer les règles d'alerte recommandées depuis la page Alertes de chacune des 35 machines." } }
    - { id: b, text: { en: "Create one metric alert rule on a host disk metric of the machines, scoped to the subscription.", fr: "Créer une règle d'alerte de métrique sur une métrique de disque de l'hôte des machines, limitée à l'abonnement." } }
    - { id: c, text: { en: "Collect the free space counter with a DCR and create one log search alert rule on Workspace3.", fr: "Collecter le compteur d'espace libre avec une DCR et créer une règle d'alerte de recherche dans les journaux sur Workspace3." } }
    - { id: d, text: { en: "Create one activity log alert rule on the Resource Health events of all the machines.", fr: "Créer une règle d'alerte de journal d'activité sur les événements Resource Health de toutes les machines." } }
answer: { optionId: c }
explanation:
  correct:
    en: Free space of a logical disk is a guest performance counter, so it must be collected by the Azure Monitor Agent with a DCR. A log search alert rule whose target is the workspace sees the data of every machine, Azure or Arc, and splitting by dimension (_ResourceId) creates a separate alert per machine with a single rule.
    fr: L'espace libre d'un disque logique est un compteur de performances de l'invité ; il doit donc être collecté par l'agent Azure Monitor avec une DCR. Une règle d'alerte de recherche dans les journaux dont la cible est l'espace de travail voit les données de toutes les machines, Azure ou Arc, et le fractionnement par dimension (_ResourceId) crée une alerte distincte par machine avec une seule règle.
  options:
    a: { en: "Recommended alert rules apply only to Azure virtual machines, use only host metrics and create rules per machine.", fr: "Les règles d'alerte recommandées s'appliquent uniquement aux machines virtuelles Azure, n'utilisent que des métriques d'hôte et créent des règles par machine." }
    b: { en: "Host metrics don't include the free space of guest logical disks and don't exist for Arc-enabled servers.", fr: "Les métriques d'hôte n'incluent pas l'espace libre des disques logiques de l'invité et n'existent pas pour les serveurs avec Arc." }
    d: { en: "Resource Health reports the availability of the resource, not the free space inside the operating system.", fr: "Resource Health indique la disponibilité de la ressource, pas l'espace libre dans le système d'exploitation." }
references:
  - title: "Monitor virtual machines with Azure Monitor: Alerts"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/monitor-virtual-machine-alerts
