id: az802-7b-perfdiag-permissions
objective: "7.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named **VM5** that runs Windows Server 2025 and a storage account named **stdiag5** that uses access key authentication.

    A user named **Admin1** must run Performance diagnostics on VM5 from the Azure portal and store the reports in stdiag5. Admin1 has the following role assignments:

    | Scope | Role |
    | --- | --- |
    | VM5 | Virtual Machine Contributor |
    | stdiag5 | Storage Account Contributor |

    When Admin1 selects **Run diagnostics**, the operation fails because of insufficient permissions.

    Which additional role assignment should you grant Admin1?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **VM5** qui exécute Windows Server 2025 et d'un compte de stockage nommé **stdiag5** qui utilise l'authentification par clé d'accès.

    Un utilisateur nommé **Admin1** doit exécuter les diagnostics de performances sur VM5 depuis le portail Azure et stocker les rapports dans stdiag5. Admin1 dispose des attributions de rôles suivantes :

    | Étendue | Rôle |
    | --- | --- |
    | VM5 | Virtual Machine Contributor |
    | stdiag5 | Storage Account Contributor |

    Lorsqu'Admin1 sélectionne **Run diagnostics**, l'opération échoue faute d'autorisations suffisantes.

    Quelle attribution de rôle supplémentaire devez-vous accorder à Admin1 ?
body:
  options:
    - { id: a, text: { en: "Owner on VM5", fr: "Owner sur VM5" } }
    - { id: b, text: { en: "Virtual Machine Administrator Login on VM5", fr: "Virtual Machine Administrator Login sur VM5" } }
    - { id: c, text: { en: "Storage Blob Data Contributor on stdiag5", fr: "Storage Blob Data Contributor sur stdiag5" } }
    - { id: d, text: { en: "Reader on the resource group of VM5", fr: "Reader sur le groupe de ressources de VM5" } }
answer: { optionId: a }
explanation:
  correct:
    en: "To run Performance diagnostics with access key authentication, the user needs the Owner role on the VM and a role that includes `Microsoft.Storage/storageAccounts/listkeys/action` on the storage account. Storage Account Contributor already provides access to the account keys, so the missing permission is Owner on VM5."
    fr: "Pour exécuter les diagnostics de performances avec l'authentification par clé d'accès, l'utilisateur a besoin du rôle Owner sur la machine virtuelle et d'un rôle incluant `Microsoft.Storage/storageAccounts/listkeys/action` sur le compte de stockage. Storage Account Contributor donne déjà accès aux clés du compte : l'autorisation manquante est donc Owner sur VM5."
  options:
    c: { en: "A data-plane blob role isn't what the tool checks; with access keys it needs listkeys, which Admin1 already has.", fr: "Le contrôle ne porte pas sur un rôle de plan de données blob ; avec les clés d'accès, il faut listkeys, qu'Admin1 a déjà." }
    b: { en: "This role allows signing in to the VM with Microsoft Entra credentials; it doesn't grant the VM permissions the tool requires.", fr: "Ce rôle permet de se connecter à la machine virtuelle avec des informations d'identification Microsoft Entra ; il n'accorde pas les autorisations sur la machine virtuelle exigées par l'outil." }
    d: { en: "Reader grants view-only access and adds nothing to Virtual Machine Contributor.", fr: "Reader accorde un accès en lecture seule et n'ajoute rien à Virtual Machine Contributor." }
references:
  - title: Run performance diagnostics reports on Azure virtual machines
    url: https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-machines/windows/how-to-use-perfinsights
