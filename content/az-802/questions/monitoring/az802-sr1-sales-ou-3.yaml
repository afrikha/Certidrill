id: az802-sr1-sales-ou-3
objective: "7.3.1"
type: series_yesno
series: az802-sr1-sales-ou
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You restore the Sales OU first, and then you restore the 25 user accounts.
  fr: Vous restaurez d'abord l'UO Sales, puis les 25 comptes d'utilisateur.
body:
  solution:
    en: |
      In Active Directory Administrative Center, you open the **Deleted Objects** container of northwind.com. You select the Sales OU and select **Restore**. You refresh the console, select the 25 user accounts, and select **Restore**.
    fr: |
      Dans le Centre d'administration Active Directory, vous ouvrez le conteneur **Deleted Objects** de northwind.com. Vous sélectionnez l'UO Sales et sélectionnez **Restore**. Vous actualisez la console, sélectionnez les 25 comptes d'utilisateur et sélectionnez **Restore**.
answer: { value: true }
explanation:
  correct:
    en: |
      A deleted hierarchy is restored from the top: first the parent OU, then its children. Once Sales is back in its original location, the 25 accounts return to it, and because the Recycle Bin preserves all their attributes, including link-valued ones, they get their group memberships back. The objects were deleted three days ago, well within the default deleted object lifetime, and no domain controller is restarted.
    fr: |
      Une hiérarchie supprimée se restaure par le haut : d'abord l'UO parente, puis ses enfants. Une fois Sales revenue à son emplacement d'origine, les 25 comptes y retournent et, comme la Corbeille conserve tous leurs attributs, y compris les attributs à valeur de lien, ils retrouvent leurs appartenances aux groupes. Les objets ont été supprimés il y a trois jours, bien en deçà de la durée de vie par défaut des objets supprimés, et aucun contrôleur de domaine n'est redémarré.
references:
  - title: Advanced AD DS Management Using Active Directory Administrative Center (Level 200)
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/adac/advanced-ad-ds-management-using-active-directory-administrative-center--level-200-
