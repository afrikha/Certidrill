id: az802-7b-bitlocker-unlock-data
objective: "7.2.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a server named **FS3** that runs Windows Server 2025. The operating system volume of FS3 is protected by BitLocker.

    You move a BitLocker-encrypted data disk from a failed server to FS3. The disk appears as volume E: and is locked. You retrieve its 48-digit recovery password from AD DS.

    You need to unlock E: now and make sure that E: unlocks without user intervention each time FS3 starts.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur nommé **FS3** qui exécute Windows Server 2025. Le volume du système d'exploitation de FS3 est protégé par BitLocker.

    Vous déplacez un disque de données chiffré par BitLocker d'un serveur en panne vers FS3. Le disque apparaît comme le volume E: et il est verrouillé. Vous récupérez son mot de passe de récupération à 48 chiffres dans AD DS.

    Vous devez déverrouiller E: maintenant et faire en sorte que E: se déverrouille sans intervention à chaque démarrage de FS3.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    [[unlock]] -MountPoint "E:" [[cred]] "111111-222222-333333-444444-555555-666666-777777-888888"
    [[auto]] -MountPoint "E:"
  slots:
    - id: unlock
      options:
        - { id: resume, text: Resume-BitLocker }
        - { id: unlock, text: Unlock-BitLocker }
        - { id: disable, text: Disable-BitLocker }
        - { id: enable, text: Enable-BitLocker }
    - id: cred
      options:
        - { id: pwd, text: -Password }
        - { id: keypath, text: -RecoveryKeyPath }
        - { id: recpwd, text: -RecoveryPassword }
    - id: auto
      options:
        - { id: autounlock, text: Enable-BitLockerAutoUnlock }
        - { id: resume2, text: Resume-BitLocker }
        - { id: suspend, text: Suspend-BitLocker }
        - { id: addkp, text: Add-BitLockerKeyProtector }
answer:
  values: { unlock: unlock, cred: recpwd, auto: autounlock }
explanation:
  correct:
    en: "`Unlock-BitLocker` with `-RecoveryPassword` unlocks the volume by using the 48-digit recovery password. `Enable-BitLockerAutoUnlock` then enables automatic unlocking of the data volume: after the operating system volume is unlocked at startup, BitLocker uses encrypted information stored in the registry and in the volume metadata to unlock E:."
    fr: "`Unlock-BitLocker` avec `-RecoveryPassword` déverrouille le volume à l'aide du mot de passe de récupération à 48 chiffres. `Enable-BitLockerAutoUnlock` active ensuite le déverrouillage automatique du volume de données : après le déverrouillage du volume du système d'exploitation au démarrage, BitLocker utilise des informations chiffrées stockées dans le Registre et dans les métadonnées du volume pour déverrouiller E:."
  options:
    resume: { en: "Resume-BitLocker re-enables a suspended protection; it can't open a locked volume.", fr: "Resume-BitLocker réactive une protection suspendue ; il ne peut pas ouvrir un volume verrouillé." }
    disable: { en: "Disable-BitLocker decrypts the volume, which isn't required and doesn't unlock it automatically later.", fr: "Disable-BitLocker déchiffre le volume, ce qui n'est pas demandé et ne le déverrouille pas automatiquement ensuite." }
    pwd: { en: "-Password is for a volume protected by a password protector, not for the 48-digit recovery password.", fr: "-Password concerne un volume protégé par un protecteur de mot de passe, pas le mot de passe de récupération à 48 chiffres." }
    keypath: { en: "-RecoveryKeyPath expects the folder of a recovery key file (.bek), not a recovery password.", fr: "-RecoveryKeyPath attend le dossier d'un fichier de clé de récupération (.bek), pas un mot de passe de récupération." }
    suspend: { en: "Suspending protection doesn't make a data volume unlock at each startup.", fr: "Suspendre la protection ne fait pas déverrouiller un volume de données à chaque démarrage." }
references:
  - title: Enable-BitLockerAutoUnlock (BitLocker)
    url: https://learn.microsoft.com/en-us/powershell/module/bitlocker/enable-bitlockerautounlock
  - title: BitLocker operations guide
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/operations-guide
