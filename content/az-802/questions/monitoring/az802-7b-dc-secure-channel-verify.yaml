id: az802-7b-dc-secure-channel-verify
objective: "7.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your AD DS domain named **contoso.com** contains a domain controller named **DC3**. Administrators report intermittent authentication errors when DC3 contacts the other domain controllers.

    You need to check the status of the secure channel of DC3 and, if it doesn't work, rebuild it. The solution must give reliable results.

    Which command should you run on DC3?
  fr: |
    Votre domaine AD DS nommé **contoso.com** contient un contrôleur de domaine nommé **DC3**. Les administrateurs signalent des erreurs d'authentification intermittentes lorsque DC3 contacte les autres contrôleurs de domaine.

    Vous devez vérifier l'état du canal sécurisé de DC3 et, s'il ne fonctionne pas, le reconstruire. La solution doit donner des résultats fiables.

    Quelle commande devez-vous exécuter sur DC3 ?
body:
  options:
    - { id: a, text: "Test-ComputerSecureChannel -Repair" }
    - { id: b, text: "nltest /sc_verify:contoso.com" }
    - { id: c, text: "nltest /sc_query:contoso.com" }
    - { id: d, text: "nltest /dsgetdc:contoso.com /force" }
answer: { optionId: b }
explanation:
  correct:
    en: "`nltest /sc_verify` checks the status of the secure channel established by the Net Logon service; if the channel doesn't work, it removes it and builds a new one. On domain controllers, Microsoft recommends netdom or nltest to verify and reset secure channels."
    fr: "`nltest /sc_verify` vérifie l'état du canal sécurisé établi par le service Netlogon ; si le canal ne fonctionne pas, il le supprime et en crée un nouveau. Sur les contrôleurs de domaine, Microsoft recommande netdom ou nltest pour vérifier et réinitialiser les canaux sécurisés."
  options:
    a: { en: "Test-ComputerSecureChannel works only on domain members; on domain controllers it returns false positive errors.", fr: "Test-ComputerSecureChannel ne fonctionne que sur les membres du domaine ; sur les contrôleurs de domaine, il renvoie de faux positifs." }
    c: { en: "/sc_query only reports the state of the secure channel the last time it was used; it doesn't rebuild it.", fr: "/sc_query indique seulement l'état du canal sécurisé lors de sa dernière utilisation ; il ne le reconstruit pas." }
    d: { en: "/dsgetdc locates domain controllers through DNS; it doesn't test the secure channel.", fr: "/dsgetdc localise des contrôleurs de domaine par le DNS ; il ne teste pas le canal sécurisé." }
references:
  - title: Nltest
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc731935(v=ws.11)
  - title: Test-ComputerSecureChannel (Microsoft.PowerShell.Management)
    url: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/test-computersecurechannel
