id: az802-sr1-sales-ou-2
objective: "7.3.1"
type: series_yesno
series: az802-sr1-sales-ou
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You restore only the Sales OU.
  fr: Vous restaurez uniquement l'UO Sales.
body:
  solution:
    en: |
      In Active Directory Administrative Center, you open the **Deleted Objects** container of northwind.com. You select the Sales OU and select **Restore**.
    fr: |
      Dans le Centre d'administration Active Directory, vous ouvrez le conteneur **Deleted Objects** de northwind.com. Vous sélectionnez l'UO Sales et sélectionnez **Restore**.
answer: { value: false }
explanation:
  correct:
    en: |
      Active Directory Administrative Center cannot restore a deleted tree in one action. Restoring the Sales OU brings back the OU alone; the 25 user accounts stay in the Deleted Objects container until you restore them too.
    fr: |
      Le Centre d'administration Active Directory ne peut pas restaurer une arborescence supprimée en une seule action. La restauration de l'UO Sales ne ramène que l'UO ; les 25 comptes d'utilisateur restent dans le conteneur Deleted Objects jusqu'à ce que vous les restauriez également.
references:
  - title: Advanced AD DS Management Using Active Directory Administrative Center (Level 200)
