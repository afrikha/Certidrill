id: az802-cs1c-replication-grid
objective: "7.3.4"
type: dropdown
caseStudy: az802-cs1c-humongous
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the replication requirement. You open Windows PowerShell as an administrator on DC1.

    How should you complete the command and the analysis? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter l'exigence relative à la réplication. Vous ouvrez Windows PowerShell en tant qu'administrateur sur DC1.

    Comment devez-vous compléter la commande et l'analyse ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Command: repadmin [[sub]] * /csv | [[conv]] | Out-GridView

      Column to filter on to list the errors to fix: [[col]]
    fr: |
      Commande : repadmin [[sub]] * /csv | [[conv]] | Out-GridView

      Colonne à filtrer pour lister les erreurs à corriger : [[col]]
  slots:
    - id: sub
      options:
        - { id: kcc, text: /kcc }
        - { id: showrepl, text: /showrepl }
        - { id: syncall, text: /syncall }
    - id: conv
      options:
        - { id: to, text: ConvertTo-Csv }
        - { id: export, text: Export-Csv }
        - { id: from, text: ConvertFrom-Csv }
    - id: col
      options:
        - { id: status, text: Last Failure Status }
        - { id: success, text: Last Success Time }
        - { id: source, text: Source DSA }
answer:
  values: { sub: showrepl, conv: from, col: status }
explanation:
  correct:
    en: |
      `repadmin /showrepl * /csv` reports the replication status of every domain controller in CSV format. `ConvertFrom-Csv` turns that text into objects that `Out-GridView` shows as a sortable, filterable table. The Last Failure Status column lists the errors to fix; Last Success Time helps sort the partners from the oldest successful replication.
    fr: |
      `repadmin /showrepl * /csv` renvoie l'état de la réplication de chaque contrôleur de domaine au format CSV. `ConvertFrom-Csv` transforme ce texte en objets que `Out-GridView` affiche dans un tableau triable et filtrable. La colonne Last Failure Status liste les erreurs à corriger ; Last Success Time permet de trier les partenaires depuis la plus ancienne réplication réussie.
  options:
    kcc: { en: "/kcc makes the KCC recalculate the replication topology; it doesn't report replication status.", fr: "/kcc fait recalculer la topologie de réplication par le KCC ; il ne renvoie pas l'état de la réplication." }
    syncall: { en: "/syncall starts replication; it doesn't produce a status report of all partners.", fr: "/syncall lance la réplication ; il ne produit pas de rapport d'état de tous les partenaires." }
    to: { en: "ConvertTo-Csv converts objects to CSV text; the repadmin output is already CSV text.", fr: "ConvertTo-Csv convertit des objets en texte CSV ; la sortie de repadmin est déjà du texte CSV." }
    export: { en: "Export-Csv writes objects to a file and sends nothing down the pipeline to Out-GridView.", fr: "Export-Csv écrit des objets dans un fichier et n'envoie rien dans le pipeline vers Out-GridView." }
    success: { en: "Last Success Time shows when replication last worked, not which error to fix.", fr: "Last Success Time indique quand la réplication a fonctionné pour la dernière fois, pas l'erreur à corriger." }
    source: { en: "Source DSA identifies the replication partner, not the error.", fr: "Source DSA identifie le partenaire de réplication, pas l'erreur." }
references:
  - title: Diagnose Active Directory replication failures
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/diagnose-replication-failures
