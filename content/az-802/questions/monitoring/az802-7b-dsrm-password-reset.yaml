id: az802-7b-dsrm-password-reset
objective: "7.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a domain controller named **DC4** that runs Windows Server 2022. You plan to restart DC4 in Directory Services Restore Mode (DSRM) tonight to restore its database.

    Nobody knows the DSRM password that was set when DC4 was promoted. DC4 is currently running normally and you are signed in as a member of Domain Admins.

    You need to set a new DSRM password on DC4.

    What should you use?
  fr: |
    Vous disposez d'un contrôleur de domaine nommé **DC4** qui exécute Windows Server 2022. Vous prévoyez de redémarrer DC4 ce soir en mode de restauration des services d'annuaire (DSRM) pour restaurer sa base de données.

    Personne ne connaît le mot de passe DSRM défini lors de la promotion de DC4. DC4 fonctionne actuellement normalement et vous êtes connecté en tant que membre de Domain Admins.

    Vous devez définir un nouveau mot de passe DSRM sur DC4.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The `Set-ADAccountPassword` cmdlet for the Administrator account", fr: "La cmdlet `Set-ADAccountPassword` pour le compte Administrator" } }
    - { id: b, text: { en: "The `Reset-ComputerMachinePassword` cmdlet on DC4", fr: "La cmdlet `Reset-ComputerMachinePassword` sur DC4" } }
    - { id: c, text: { en: "The `set dsrm password` context of ntdsutil", fr: "Le contexte `set dsrm password` de ntdsutil" } }
    - { id: d, text: { en: "The `semantic database analysis` context of ntdsutil", fr: "Le contexte `semantic database analysis` de ntdsutil" } }
answer: { optionId: c }
explanation:
  correct:
    en: "The DSRM password belongs to a local Administrator account used only in DSRM; it's set when the domain controller is configured. If you forget it, you reset it with `ntdsutil` and its `set dsrm password` context (for the local server, `reset password on server null`)."
    fr: "Le mot de passe DSRM appartient à un compte Administrator local utilisé uniquement en DSRM ; il est défini lors de la configuration du contrôleur de domaine. Si vous l'oubliez, vous le réinitialisez avec `ntdsutil` et son contexte `set dsrm password` (pour le serveur local, `reset password on server null`)."
  options:
    a: { en: "This changes the password of the domain Administrator account in AD DS, not the DSRM password.", fr: "Cela change le mot de passe du compte Administrator du domaine dans AD DS, pas le mot de passe DSRM." }
    b: { en: "This resets the computer account password used by the secure channel.", fr: "Cela réinitialise le mot de passe du compte d'ordinateur utilisé par le canal sécurisé." }
    d: { en: "Semantic database analysis checks the consistency of the directory database; it doesn't manage passwords.", fr: "L'analyse sémantique de la base vérifie la cohérence de la base de l'annuaire ; elle ne gère pas les mots de passe." }
references:
  - title: Recover the AD DS database
    url: https://learn.microsoft.com/en-us/training/modules/troubleshoot-active-directory/3-recover-active-directory-domain-services-database
