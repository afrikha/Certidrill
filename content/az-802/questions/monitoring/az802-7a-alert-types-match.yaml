id: az802-7a-alert-types-match
objective: "7.1.7"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have Azure virtual machines that run Windows Server 2025. The Azure Monitor Agent sends their System log events to a Log Analytics workspace by using a data collection rule.

    You need to create an alert rule for each of the following requirements.

    Which type of alert rule should you use for each requirement? To answer, drag the appropriate alert rule types to the correct requirements. Each alert rule type may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de machines virtuelles Azure qui exécutent Windows Server 2025. L'agent Azure Monitor envoie les événements de leur journal Système vers un espace de travail Log Analytics à l'aide d'une règle de collecte de données.

    Vous devez créer une règle d'alerte pour chacune des exigences suivantes.

    Quel type de règle d'alerte devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les types de règles d'alerte appropriés vers les exigences correspondantes. Chaque type peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: metric, text: { en: "Metric alert", fr: "Alerte de métrique" } }
    - { id: log, text: { en: "Log search alert", fr: "Alerte de recherche dans les journaux" } }
    - { id: activity, text: { en: "Activity log alert", fr: "Alerte de journal d'activité" } }
    - { id: smart, text: { en: "Smart detection alert", fr: "Alerte de détection intelligente" } }
  targets:
    - { id: cpu, text: { en: "The Percentage CPU host metric of a virtual machine stays above 85% for 15 minutes.", fr: "La métrique d'hôte Percentage CPU d'une machine virtuelle reste au-dessus de 85 % pendant 15 minutes." } }
    - { id: event, text: { en: "Event ID 7031 (service terminated unexpectedly) is logged in the System log of any virtual machine.", fr: "L'événement 7031 (arrêt inattendu d'un service) est journalisé dans le journal Système d'une machine virtuelle." } }
    - { id: delete, text: { en: "Someone deletes a virtual machine from the resource group.", fr: "Quelqu'un supprime une machine virtuelle du groupe de ressources." } }
    - { id: health, text: { en: "A Service Health incident affects virtual machines in the region.", fr: "Un incident Service Health affecte les machines virtuelles de la région." } }
answer:
  mapping: { cpu: metric, event: log, delete: activity, health: activity }
explanation:
  correct:
    en: Host metrics such as Percentage CPU are collected automatically and are evaluated by metric alert rules. Windows events stored in the Event table of the workspace are found by a log search alert that runs a query. Deleting a resource is a control plane operation recorded in the activity log, and Service Health and Resource Health alerts are activity log alerts too.
    fr: Les métriques d'hôte comme Percentage CPU sont collectées automatiquement et évaluées par des règles d'alerte de métrique. Les événements Windows stockés dans la table Event de l'espace de travail sont détectés par une alerte de recherche dans les journaux qui exécute une requête. La suppression d'une ressource est une opération du plan de contrôle enregistrée dans le journal d'activité, et les alertes Service Health et Resource Health sont aussi des alertes de journal d'activité.
  options:
    smart: { en: "Smart detection alerts come from Application Insights and detect application anomalies; they don't apply to these requirements.", fr: "Les alertes de détection intelligente proviennent d'Application Insights et détectent des anomalies applicatives ; elles ne correspondent pas à ces exigences." }
references:
  - title: Types of Azure Monitor alerts
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
  - title: Overview of Azure Monitor alerts
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-overview
