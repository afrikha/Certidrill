id: az802-7a-net-tools-match
objective: "7.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You troubleshoot network issues on servers that run Windows Server 2025.

    Which tool should you use for each task? To answer, drag the appropriate tools to the correct tasks. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous résolvez des problèmes réseau sur des serveurs qui exécutent Windows Server 2025.

    Quel outil devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les outils appropriés vers les tâches correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: tnc, text: Test-NetConnection -Port }
    - { id: pathping, text: pathping }
    - { id: gntc, text: Get-NetTCPConnection }
    - { id: pktmon, text: pktmon }
    - { id: resolve, text: Resolve-DnsName }
    - { id: gnic, text: Get-NetIPConfiguration }
  targets:
    - { id: t1, text: { en: "Measure the packet loss at each router between SRV1 and a branch server", fr: "Mesurer la perte de paquets sur chaque routeur entre SRV1 et un serveur d'agence" } }
    - { id: t2, text: { en: "List the established connections of SRV1 and the ID of the process that owns each one", fr: "Lister les connexions établies de SRV1 et l'ID du processus propriétaire de chacune" } }
    - { id: t3, text: { en: "Capture the packets that cross the network stack of SRV1 and detect where they're dropped", fr: "Capturer les paquets qui traversent la pile réseau de SRV1 et détecter où ils sont abandonnés" } }
    - { id: t4, text: { en: "Check from SRV1 that TCP port 5986 of a remote server accepts connections", fr: "Vérifier depuis SRV1 que le port TCP 5986 d'un serveur distant accepte les connexions" } }
answer:
  mapping: { t1: pathping, t2: gntc, t3: pktmon, t4: tnc }
explanation:
  correct:
    en: "`pathping` sends pings to every router on the path over a period of time and shows the loss at each hop. `Get-NetTCPConnection` lists TCP connections with their state and owning process. Packet Monitor (`pktmon`) captures packets, filters and counts them, and detects drops in the networking stack. `Test-NetConnection -Port` attempts a TCP connection to a remote port."
    fr: "`pathping` envoie des pings à chaque routeur du chemin pendant une durée donnée et indique la perte à chaque saut. `Get-NetTCPConnection` liste les connexions TCP avec leur état et leur processus propriétaire. Packet Monitor (`pktmon`) capture les paquets, les filtre et les compte, et détecte les abandons dans la pile réseau. `Test-NetConnection -Port` tente une connexion TCP vers un port distant."
  options:
    resolve: { en: "Resolve-DnsName tests name resolution, which none of the tasks requires.", fr: "Resolve-DnsName teste la résolution de noms, ce qu'aucune tâche ne demande." }
    gnic: { en: "Get-NetIPConfiguration shows the local IP configuration (addresses, gateway, DNS servers).", fr: "Get-NetIPConfiguration affiche la configuration IP locale (adresses, passerelle, serveurs DNS)." }
references:
  - title: pathping
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/pathping
  - title: Packet Monitor (Pktmon)
    url: https://learn.microsoft.com/en-us/windows-server/networking/technologies/pktmon/pktmon
