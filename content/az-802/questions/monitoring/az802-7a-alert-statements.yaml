id: az802-7a-alert-statements
objective: "7.1.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure subscription that contains Azure virtual machines in the West Europe and North Europe regions. You configure Azure Monitor alerts for these virtual machines.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un abonnement Azure qui contient des machines virtuelles Azure dans les régions West Europe et North Europe. Vous configurez des alertes Azure Monitor pour ces machines virtuelles.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An activity log alert fires each time a matching activity log event occurs, even if it fired previously.
        fr: Une alerte de journal d'activité se déclenche chaque fois qu'un événement correspondant du journal d'activité se produit, même si elle s'est déjà déclenchée.
    - id: s2
      text:
        en: A single metric alert rule scoped to the subscription can monitor the virtual machines of both regions.
        fr: Une seule règle d'alerte de métrique limitée à l'abonnement peut surveiller les machines virtuelles des deux régions.
    - id: s3
      text:
        en: An alert processing rule can suppress the notifications of Service Health alerts during a maintenance window.
        fr: Une règle de traitement des alertes peut supprimer les notifications des alertes Service Health pendant une fenêtre de maintenance.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: All activity log alerts are stateless, so they fire each time the condition is met. A metric alert rule can monitor several resources of the same type only when they're in the same Azure region, so you need one rule per region. Alert processing rules don't affect Azure Service Health alerts.
    fr: "Toutes les alertes de journal d'activité sont sans état ; elles se déclenchent donc chaque fois que la condition est remplie. Une règle d'alerte de métrique ne peut surveiller plusieurs ressources du même type que si elles se trouvent dans la même région Azure : il faut une règle par région. Les règles de traitement des alertes n'affectent pas les alertes Azure Service Health."
references:
  - title: Overview of Azure Monitor alerts
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-overview
  - title: Types of Azure Monitor alerts
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
