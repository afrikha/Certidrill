id: az802-7b-repair-volume-spotfix
objective: "7.2.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a file server named **FS4** that runs Windows Server 2022. The System log of FS4 contains NTFS errors that report file system corruption on volume E:, which hosts several busy shares.

    You need to find and repair the corruption on E:. The solution must keep E: online during the analysis and minimize the time E: is offline.

    Which two commands should you run? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur de fichiers nommé **FS4** qui exécute Windows Server 2022. Le journal Système de FS4 contient des erreurs NTFS signalant une corruption du système de fichiers sur le volume E:, qui héberge plusieurs partages très utilisés.

    Vous devez détecter et réparer la corruption sur E:. La solution doit laisser E: en ligne pendant l'analyse et réduire au minimum la durée pendant laquelle E: est hors connexion.

    Quelles sont les deux commandes que vous devez exécuter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Repair-Volume -DriveLetter E -OfflineScanAndFix" }
    - { id: b, text: "Repair-Volume -DriveLetter E -Scan" }
    - { id: c, text: "Optimize-Volume -DriveLetter E -Defrag" }
    - { id: d, text: "Repair-Volume -DriveLetter E -SpotFix" }
    - { id: e, text: "Format-Volume -DriveLetter E -FileSystem NTFS" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "`-Scan` analyzes the volume while it stays online and records every corruption it finds in the `$corrupt` system file (like `chkdsk /scan`). `-SpotFix` then takes the volume offline only briefly and fixes just the issues logged in `$corrupt` (like `chkdsk /spotfix`)."
    fr: "`-Scan` analyse le volume pendant qu'il reste en ligne et enregistre chaque corruption trouvée dans le fichier système `$corrupt` (comme `chkdsk /scan`). `-SpotFix` met ensuite le volume hors connexion pendant un court instant seulement et corrige uniquement les problèmes consignés dans `$corrupt` (comme `chkdsk /spotfix`)."
  options:
    a: { en: "-OfflineScanAndFix takes the volume offline for the whole scan and repair (like chkdsk /f), which doesn't minimize downtime.", fr: "-OfflineScanAndFix met le volume hors connexion pendant toute l'analyse et la réparation (comme chkdsk /f), ce qui ne réduit pas l'interruption au minimum." }
    c: { en: "Defragmentation reorganizes file fragments; it doesn't detect or repair corruption.", fr: "La défragmentation réorganise les fragments de fichiers ; elle ne détecte ni ne répare la corruption." }
    e: { en: "Formatting erases all the data on the volume.", fr: "Le formatage efface toutes les données du volume." }
references:
  - title: Repair-Volume (Storage)
    url: https://learn.microsoft.com/en-us/powershell/module/storage/repair-volume
