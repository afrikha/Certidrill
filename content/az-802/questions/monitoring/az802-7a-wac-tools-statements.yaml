id: az802-7a-wac-tools-statements
objective: "7.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You use Windows Admin Center to monitor a server named **SRV3** that runs Windows Server 2025. SRV3 isn't connected to Azure.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez Windows Admin Center pour surveiller un serveur nommé **SRV3** qui exécute Windows Server 2025. SRV3 n'est pas connecté à Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To display disk activity on the Overview page of SRV3, you must first enable disk metrics on the server.
        fr: Pour afficher l'activité des disques sur la page Overview de SRV3, vous devez d'abord activer les métriques de disque sur le serveur.
    - id: s2
      text:
        en: The Events tool can send an email to the operations team when a specific event ID is logged on SRV3.
        fr: L'outil Events peut envoyer un e-mail à l'équipe d'exploitation lorsqu'un ID d'événement précis est journalisé sur SRV3.
    - id: s3
      text:
        en: The Events tool can export the events of a log of SRV3.
        fr: L'outil Events peut exporter les événements d'un journal de SRV3.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The Overview tool shows CPU, memory and network activity, and disk metrics appear once you enable them on the server. The Events tool browses, searches, clears and exports event logs, but Windows Admin Center doesn't send notifications itself; email alerts require connecting the server to Azure Monitor and creating an alert rule in the Azure portal.
    fr: "L'outil Overview affiche l'activité du processeur, de la mémoire et du réseau, et les métriques de disque apparaissent une fois activées sur le serveur. L'outil Events parcourt, recherche, efface et exporte les journaux des événements, mais Windows Admin Center n'envoie pas lui-même de notifications : les alertes par e-mail exigent de connecter le serveur à Azure Monitor et de créer une règle d'alerte dans le portail Azure."
references:
  - title: Manage Servers with Windows Admin Center
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/use/manage-servers
  - title: Monitor servers and configure alerts with Azure Monitor from Windows Admin Center
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/azure/azure-monitor
