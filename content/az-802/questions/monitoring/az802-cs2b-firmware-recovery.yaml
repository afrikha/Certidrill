id: az802-cs2b-firmware-recovery
objective: "7.2.7"
type: single
caseStudy: az802-cs2b-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You need to prepare FS1 for tonight's firmware update. The solution must meet the firmware requirement.

    Which command should you run on FS1 before the update starts?
  fr: |
    Vous devez préparer FS1 pour la mise à jour du microprogramme de ce soir. La solution doit satisfaire l'exigence relative au microprogramme.

    Quelle commande devez-vous exécuter sur FS1 avant le début de la mise à jour ?
body:
  options:
    - { id: a, text: "Suspend-BitLocker -MountPoint \"C:\" -RebootCount 0" }
    - { id: b, text: "Suspend-BitLocker -MountPoint \"C:\" -RebootCount 2" }
    - { id: c, text: "Disable-BitLocker -MountPoint \"C:\"" }
    - { id: d, text: "Backup-BitLockerKeyProtector -MountPoint \"C:\" -KeyProtectorId $id" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A UEFI firmware update changes the measurements that the TPM validates at startup, which triggered the recovery screen last month. Suspending BitLocker keeps the volume encrypted but stops the integrity check, and `-RebootCount 2` resumes protection automatically after the two restarts of the update.
    fr: |
      Une mise à jour du microprogramme UEFI modifie les mesures que le TPM valide au démarrage, ce qui a déclenché l'écran de récupération le mois dernier. Suspendre BitLocker laisse le volume chiffré mais arrête la vérification d'intégrité, et `-RebootCount 2` rétablit automatiquement la protection après les deux redémarrages de la mise à jour.
  options:
    a:
      en: |
        A reboot count of 0 suspends protection until an administrator runs `Resume-BitLocker`, so protection would not resume automatically.
      fr: |
        Un nombre de redémarrages égal à 0 suspend la protection jusqu'à ce qu'un administrateur exécute `Resume-BitLocker` : la protection ne reprendrait pas automatiquement.
    c:
      en: '`Disable-BitLocker` decrypts the volume; protection would not resume after the update.'
      fr: '`Disable-BitLocker` déchiffre le volume ; la protection ne reprendrait pas après la mise à jour.'
    d:
      en: |
        Backing up a key protector to AD DS helps recovery, but FS1 would still start on the recovery screen.
      fr: |
        Sauvegarder un protecteur de clé dans AD DS facilite la récupération, mais FS1 démarrerait toujours sur l'écran de récupération.
references:
  - title: Suspend-BitLocker (BitLocker)
    url: https://learn.microsoft.com/en-us/powershell/module/bitlocker/suspend-bitlocker
  - title: BitLocker recovery overview
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/recovery-overview
