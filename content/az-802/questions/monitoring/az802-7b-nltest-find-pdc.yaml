id: az802-7b-nltest-find-pdc
objective: "7.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your AD DS domain named **contoso.com** has six domain controllers. Yesterday, you transferred the PDC emulator role to a new domain controller named **DC6** and changed the DNS records of the domain.

    On a member server named **Server7**, users report that password changes are slow to apply. You need to confirm which domain controller Server7 locates as the PDC emulator by querying DNS instead of using cached information.

    Which command should you run on Server7?
  fr: |
    Votre domaine AD DS nommé **contoso.com** compte six contrôleurs de domaine. Hier, vous avez transféré le rôle d'émulateur PDC à un nouveau contrôleur de domaine nommé **DC6** et modifié les enregistrements DNS du domaine.

    Sur un serveur membre nommé **Server7**, les utilisateurs signalent que les changements de mot de passe tardent à s'appliquer. Vous devez confirmer quel contrôleur de domaine Server7 localise comme émulateur PDC en interrogeant le DNS au lieu d'utiliser les informations en cache.

    Quelle commande devez-vous exécuter sur Server7 ?
body:
  options:
    - { id: a, text: "nltest /dclist:contoso.com" }
    - { id: b, text: "nltest /sc_query:contoso.com" }
    - { id: c, text: "nltest /dsregdns" }
    - { id: d, text: "nltest /dsgetdc:contoso.com /pdc /force" }
answer: { optionId: d }
explanation:
  correct:
    en: "`nltest /dsgetdc` queries DNS for the domain controllers of the domain and checks connectivity to them. `/pdc` returns only the domain controller designated as the PDC emulator, and `/force` makes the command query the DNS server instead of looking in the cache."
    fr: "`nltest /dsgetdc` interroge le DNS pour obtenir les contrôleurs de domaine du domaine et vérifie la connectivité avec eux. `/pdc` ne renvoie que le contrôleur de domaine désigné comme émulateur PDC, et `/force` oblige la commande à interroger le serveur DNS au lieu de consulter le cache."
  options:
    a: { en: "/dclist lists all the domain controllers of the domain without showing which one Server7 locates as the PDC emulator.", fr: "/dclist liste tous les contrôleurs de domaine du domaine sans indiquer lequel Server7 localise comme émulateur PDC." }
    b: { en: "/sc_query reports the state of the secure channel and the domain controller it uses, not the PDC emulator.", fr: "/sc_query indique l'état du canal sécurisé et le contrôleur de domaine qu'il utilise, pas l'émulateur PDC." }
    c: { en: "/dsregdns refreshes the DNS registration of a domain controller's records; it doesn't locate one.", fr: "/dsregdns actualise l'inscription DNS des enregistrements d'un contrôleur de domaine ; il n'en localise aucun." }
references:
  - title: Nltest
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc731935(v=ws.11)
