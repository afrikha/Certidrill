id: az802-7a-vminsights-statements
objective: "7.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are evaluating VM insights to monitor the performance of Azure virtual machines and Azure Arc-enabled servers that run Windows Server 2022.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez VM insights pour surveiller les performances de machines virtuelles Azure et de serveurs avec Azure Arc qui exécutent Windows Server 2022.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Host metrics such as CPU, disk and network are collected for Azure VMs without any configuration.", fr: "Les métriques d'hôte (processeur, disques, réseau) sont collectées pour les machines virtuelles Azure sans aucune configuration." } }
    - { id: b, text: { en: "The OpenTelemetry metrics option stores its data in the InsightsMetrics table of a Log Analytics workspace.", fr: "L'option de métriques OpenTelemetry stocke ses données dans la table InsightsMetrics d'un espace de travail Log Analytics." } }
    - { id: c, text: { en: "The classic logs-based metrics option stores its default metrics in the InsightsMetrics table.", fr: "L'option classique de métriques basées sur les journaux stocke ses métriques par défaut dans la table InsightsMetrics." } }
    - { id: d, text: { en: "VM insights supports only Azure virtual machines and virtual machine scale sets.", fr: "VM insights prend en charge uniquement les machines virtuelles Azure et les groupes de machines virtuelles identiques." } }
    - { id: e, text: { en: "The Dependency agent must be installed for the Performance view to display data.", fr: "L'agent Dependency doit être installé pour que la vue Performance affiche des données." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Azure Monitor collects host (platform) metrics and the activity log of Azure virtual machines automatically. With the classic logs-based option, the default VM insights metrics go to the InsightsMetrics table of a Log Analytics workspace, while the OpenTelemetry option sends metrics to an Azure Monitor workspace.
    fr: Azure Monitor collecte automatiquement les métriques d'hôte (de plateforme) et le journal d'activité des machines virtuelles Azure. Avec l'option classique basée sur les journaux, les métriques par défaut de VM insights vont dans la table InsightsMetrics d'un espace de travail Log Analytics, tandis que l'option OpenTelemetry envoie les métriques vers un espace de travail Azure Monitor.
  options:
    b: { en: "OpenTelemetry metrics are stored in an Azure Monitor workspace, not in a Log Analytics table.", fr: "Les métriques OpenTelemetry sont stockées dans un espace de travail Azure Monitor, pas dans une table Log Analytics." }
    d: { en: "VM insights supports Azure virtual machines, scale sets and Azure Arc-enabled servers.", fr: "VM insights prend en charge les machines virtuelles Azure, les groupes identiques et les serveurs avec Azure Arc." }
    e: { en: "The Dependency agent only feeds the Map feature (both retire on June 30, 2028); performance data comes from the Azure Monitor Agent.", fr: "L'agent Dependency alimente uniquement la fonctionnalité Map (tous deux mis hors service le 30 juin 2028) ; les données de performances proviennent de l'agent Azure Monitor." }
references:
  - title: "Monitor virtual machines with Azure Monitor: Collect data"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/monitor-virtual-machine-data-collection
  - title: Metrics experience for virtual machines in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/metrics-opentelemetry-guest
