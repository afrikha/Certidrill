id: az802-7a-perfmon-users-group
objective: "7.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an Active Directory Domain Services (AD DS) domain named contoso.com. A member server named **SRV1** runs Windows Server 2025.

    A help desk user named **User1** must view real-time performance counters of SRV1 from Performance Monitor on his own computer. User1 must not be able to create or modify data collector sets on SRV1. The solution must follow the principle of least privilege.

    To which local group on SRV1 should you add User1?
  fr: |
    Votre réseau contient un domaine Active Directory Domain Services (AD DS) nommé contoso.com. Un serveur membre nommé **SRV1** exécute Windows Server 2025.

    Un utilisateur du support nommé **User1** doit afficher les compteurs de performances en temps réel de SRV1 depuis l'Analyseur de performances de son propre ordinateur. User1 ne doit pas pouvoir créer ni modifier de jeux de collecteurs de données sur SRV1. La solution doit respecter le principe du moindre privilège.

    À quel groupe local de SRV1 devez-vous ajouter User1 ?
body:
  options:
    - { id: a, text: Performance Log Users }
    - { id: b, text: Event Log Readers }
    - { id: c, text: Remote Management Users }
    - { id: d, text: Performance Monitor Users }
answer: { optionId: d }
explanation:
  correct:
    en: Members of Performance Monitor Users can view real-time performance counter data, locally and from remote computers, without being administrators. They can't create or modify data collector sets, which matches the requirement exactly.
    fr: Les membres de Performance Monitor Users peuvent afficher les données des compteurs de performances en temps réel, localement et depuis des ordinateurs distants, sans être administrateurs. Ils ne peuvent pas créer ni modifier de jeux de collecteurs de données, ce qui correspond exactement à l'exigence.
  options:
    a:
      en: Performance Log Users includes every right of Performance Monitor Users and adds the management of logs and alerts, so it grants more than required.
      fr: Performance Log Users inclut tous les droits de Performance Monitor Users et ajoute la gestion des journaux et des alertes ; il accorde donc plus que nécessaire.
    b:
      en: Event Log Readers grants read access to event logs, not to performance counters.
      fr: Event Log Readers accorde la lecture des journaux des événements, pas des compteurs de performances.
    c:
      en: Remote Management Users allows WinRM and PowerShell remoting connections; it doesn't grant access to performance counter data.
      fr: Remote Management Users autorise les connexions WinRM et la communication à distance PowerShell ; il ne donne pas accès aux données des compteurs de performances.
references:
  - title: Active Directory Security Groups
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-groups
