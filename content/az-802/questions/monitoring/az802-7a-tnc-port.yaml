id: az802-7a-tnc-port
objective: "7.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application on a server named **APP3** can't connect to a SQL Server instance on a server named **SQL1**. The instance listens on TCP port 1433. Both servers run Windows Server 2022. ICMP is blocked between the subnets of APP3 and SQL1.

    From APP3, you need to verify whether a TCP connection can be established to the SQL Server port of SQL1.

    Which command should you run?
  fr: |
    Une application d'un serveur nommé **APP3** ne parvient pas à se connecter à une instance SQL Server d'un serveur nommé **SQL1**. L'instance écoute sur le port TCP 1433. Les deux serveurs exécutent Windows Server 2022. ICMP est bloqué entre les sous-réseaux d'APP3 et de SQL1.

    Depuis APP3, vous devez vérifier si une connexion TCP peut être établie vers le port SQL Server de SQL1.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: Test-NetConnection SQL1 -TraceRoute }
    - { id: b, text: Get-NetTCPConnection -RemotePort 1433 }
    - { id: c, text: Test-NetConnection SQL1 -Port 1433 }
    - { id: d, text: Resolve-DnsName SQL1 -Type A }
answer: { optionId: c }
explanation:
  correct:
    en: "`Test-NetConnection` with `-Port` attempts a TCP connection to the specified port of the remote computer and reports whether it succeeded (TcpTestSucceeded), which works even when ICMP is blocked."
    fr: "`Test-NetConnection` avec `-Port` tente une connexion TCP vers le port indiqué de l'ordinateur distant et indique si elle a réussi (TcpTestSucceeded), ce qui fonctionne même quand ICMP est bloqué."
  options:
    a: { en: "-TraceRoute lists the hops on the path by using ICMP, which is blocked, and doesn't test the TCP port.", fr: "-TraceRoute liste les sauts du chemin à l'aide d'ICMP, qui est bloqué, et ne teste pas le port TCP." }
    b: { en: "Get-NetTCPConnection lists the existing TCP connections of the local computer; it doesn't try to open a new one.", fr: "Get-NetTCPConnection liste les connexions TCP existantes de l'ordinateur local ; il n'essaie pas d'en ouvrir une nouvelle." }
    d: { en: "Resolve-DnsName checks name resolution only, not whether the port is reachable.", fr: "Resolve-DnsName vérifie seulement la résolution de noms, pas l'accessibilité du port." }
references:
  - title: Test-NetConnection (NetTCPIP)
    url: https://learn.microsoft.com/en-us/powershell/module/nettcpip/test-netconnection
