id: az802-7b-repadmin-tasks
objective: "7.3.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Your AD DS forest contains 12 domain controllers in four sites. Users at the Lyon site report that recent password changes don't apply there. You plan to troubleshoot replication from a domain controller named **DC2** in Lyon.

    Which `repadmin` command should you use for each task? To answer, drag the appropriate commands to the correct tasks. Each command may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre forêt AD DS contient 12 contrôleurs de domaine répartis sur quatre sites. Les utilisateurs du site de Lyon signalent que les changements de mot de passe récents ne s'y appliquent pas. Vous prévoyez de dépanner la réplication depuis un contrôleur de domaine nommé **DC2** situé à Lyon.

    Quelle commande `repadmin` devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les commandes appropriées vers les tâches correspondantes. Chaque commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: summary, text: repadmin /replsummary }
    - { id: showrepl, text: repadmin /showrepl }
    - { id: syncall, text: repadmin /syncall }
    - { id: replicate, text: repadmin /replicate }
    - { id: lingering, text: repadmin /removelingeringobjects }
    - { id: regkey, text: repadmin /regkey }
  targets:
    - id: t1
      text: { en: "Identify all the domain controllers that fail inbound or outbound replication, in a summary report", fr: "Identifier tous les contrôleurs de domaine en échec de réplication entrante ou sortante, dans un rapport de synthèse" }
    - id: t2
      text: { en: "Display the result of the last inbound replication attempt of DC2 for each partition", fr: "Afficher le résultat de la dernière tentative de réplication entrante de DC2 pour chaque partition" }
    - id: t3
      text: { en: "Synchronize DC2 with all its replication partners", fr: "Synchroniser DC2 avec tous ses partenaires de réplication" }
    - id: t4
      text: { en: "Immediately replicate one directory partition from DC1 to DC2", fr: "Répliquer immédiatement une partition d'annuaire de DC1 vers DC2" }
answer:
  mapping: { t1: summary, t2: showrepl, t3: syncall, t4: replicate }
explanation:
  correct:
    en: "`/replsummary` identifies the domain controllers that fail inbound or outbound replication and summarizes the results. `/showrepl` displays the status of the last inbound replication attempt of a domain controller for its partitions. `/syncall` synchronizes a domain controller with all its partners, and `/replicate` triggers the immediate replication of a given partition from a source to a destination domain controller."
    fr: "`/replsummary` identifie les contrôleurs de domaine en échec de réplication entrante ou sortante et résume les résultats. `/showrepl` affiche l'état de la dernière tentative de réplication entrante d'un contrôleur de domaine pour ses partitions. `/syncall` synchronise un contrôleur de domaine avec tous ses partenaires, et `/replicate` déclenche la réplication immédiate d'une partition donnée d'un contrôleur de domaine source vers un contrôleur de domaine de destination."
  options:
    lingering: { en: "This command removes lingering objects after long replication failures; it doesn't report or trigger replication.", fr: "Cette commande supprime les objets persistants après de longs échecs de réplication ; elle ne signale ni ne déclenche la réplication." }
    regkey: { en: "This command changes replication registry settings such as strict replication consistency.", fr: "Cette commande modifie des paramètres de réplication du Registre, comme la cohérence stricte de la réplication." }
references:
  - title: Troubleshoot AD DS replication
    url: https://learn.microsoft.com/en-us/training/modules/troubleshoot-active-directory/5-troubleshoot-active-directory-domain-services-replication
