id: az802-7a-insights-aggregate
objective: "7.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Your company has 40 file servers that run Windows Server 2022. All the servers are members of an Active Directory domain and are Azure Arc-enabled servers. System Insights runs on each server with the default capabilities.

    You need to review in one central location every Warning and Critical prediction produced by the servers. The solution must not require custom scripts.

    What are two possible ways to achieve this goal? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre entreprise possède 40 serveurs de fichiers qui exécutent Windows Server 2022. Tous les serveurs sont membres d'un domaine Active Directory et sont des serveurs avec Azure Arc. System Insights s'exécute sur chaque serveur avec les fonctionnalités par défaut.

    Vous devez consulter en un seul endroit toutes les prévisions Warning et Critical produites par les serveurs. La solution ne doit pas nécessiter de scripts personnalisés.

    Quelles sont les deux façons possibles d'atteindre cet objectif ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run Set-InsightsCapabilitySchedule on each server so that every capability runs every hour.", fr: "Exécuter Set-InsightsCapabilitySchedule sur chaque serveur pour que chaque fonctionnalité s'exécute toutes les heures." } }
    - { id: b, text: { en: "Forward events 148 and 150 to a collector server with a source-initiated subscription.", fr: "Transférer les événements 148 et 150 vers un serveur collecteur avec un abonnement initié par la source." } }
    - { id: c, text: { en: "Collect events 148 and 150 in a Log Analytics workspace with a data collection rule.", fr: "Collecter les événements 148 et 150 dans un espace de travail Log Analytics avec une règle de collecte de données." } }
    - { id: d, text: { en: "Create a performance counter alert on each server for the volume free space counter.", fr: "Créer une alerte de compteur de performance sur chaque serveur pour le compteur d'espace libre des volumes." } }
    - { id: e, text: { en: "Enable VM insights on the servers and open the Performance view of the Log Analytics workspace.", fr: "Activer VM insights sur les serveurs et ouvrir la vue Performance de l'espace de travail Log Analytics." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: System Insights writes each prediction result to the event log (event 148 for Warning, 150 for Critical), so the results can be aggregated across machines. Windows Event Forwarding brings them to a collector server, and the Azure Monitor Agent with a data collection rule brings them to a Log Analytics workspace; both are configuration only.
    fr: "System Insights écrit chaque résultat de prévision dans le journal des événements (événement 148 pour Warning, 150 pour Critical) : les résultats peuvent donc être agrégés entre machines. Le transfert d'événements Windows les amène sur un serveur collecteur, et l'agent Azure Monitor avec une règle de collecte de données les envoie vers un espace de travail Log Analytics ; les deux reposent uniquement sur de la configuration."
  options:
    a: { en: "Changing the schedule makes predictions more frequent but keeps the results on each server.", fr: "Modifier la planification rend les prévisions plus fréquentes mais laisse les résultats sur chaque serveur." }
    d: { en: "A counter alert reacts to the current value of a counter; it doesn't collect System Insights predictions.", fr: "Une alerte de compteur réagit à la valeur actuelle d'un compteur ; elle ne collecte pas les prévisions de System Insights." }
    e: { en: "VM insights collects current performance data; it doesn't contain System Insights forecasts.", fr: "VM insights collecte des données de performances actuelles ; il ne contient pas les prévisions de System Insights." }
references:
  - title: Manage System Insights capabilities in Windows Admin Center
    url: https://learn.microsoft.com/en-us/windows-server/manage/system-insights/managing-capabilities
  - title: What is System Insights?
    url: https://learn.microsoft.com/en-us/windows-server/manage/system-insights/overview
