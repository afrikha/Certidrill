id: az802-7b-w32tm-root-pdc
objective: "7.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an AD DS forest named **contoso.com** that has two domains: contoso.com and east.contoso.com. A domain controller named **DC1** holds the PDC emulator role of contoso.com.

    Users report Kerberos authentication failures. You discover that DC1 currently uses its local CMOS clock as its time source.

    You need to configure DC1 to synchronize its clock only from time.windows.com and to advertise itself as a reliable time source. The new settings must take effect without restarting the Windows Time service.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient une forêt AD DS nommée **contoso.com** qui comporte deux domaines : contoso.com et east.contoso.com. Un contrôleur de domaine nommé **DC1** détient le rôle d'émulateur PDC de contoso.com.

    Des utilisateurs signalent des échecs d'authentification Kerberos. Vous constatez que DC1 utilise actuellement son horloge CMOS locale comme source de temps.

    Vous devez configurer DC1 pour qu'il synchronise son horloge uniquement sur time.windows.com et qu'il s'annonce comme source de temps fiable. Les nouveaux paramètres doivent prendre effet sans redémarrer le service de temps Windows.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    w32tm [[op]] /manualpeerlist:"time.windows.com,0x8" /syncfromflags:[[flags]] /reliable:yes [[apply]]
  slots:
    - id: op
      options:
        - { id: config, text: /config }
        - { id: resync, text: /resync }
        - { id: register, text: /register }
        - { id: stripchart, text: /stripchart }
    - id: flags
      options:
        - { id: domhier, text: DOMHIER }
        - { id: both, text: "MANUAL,DOMHIER" }
        - { id: manual, text: MANUAL }
    - id: apply
      options:
        - { id: rediscover, text: /rediscover }
        - { id: update, text: /update }
        - { id: nowait, text: /nowait }
answer:
  values: { op: config, flags: manual, apply: update }
explanation:
  correct:
    en: "The PDC emulator of the forest root domain is the top of the domain time hierarchy, so it must take its time from an external source. `w32tm /config` changes the settings, `/syncfromflags:MANUAL` restricts the sources to the manual peer list, and `/update` tells the Windows Time service that its configuration changed so the settings apply immediately."
    fr: "L'émulateur PDC du domaine racine de la forêt est le sommet de la hiérarchie de temps du domaine : il doit donc prendre son heure sur une source externe. `w32tm /config` modifie les paramètres, `/syncfromflags:MANUAL` limite les sources à la liste manuelle d'homologues, et `/update` indique au service de temps Windows que sa configuration a changé, ce qui applique les paramètres immédiatement."
  options:
    resync: { en: "/resync forces an immediate synchronization with the configured sources; it can't set the peer list or the reliable flag.", fr: "/resync force une synchronisation immédiate avec les sources configurées ; il ne peut définir ni la liste d'homologues ni l'indicateur de source fiable." }
    register: { en: "/register registers W32Time as a service with its default configuration; it doesn't accept these settings.", fr: "/register inscrit W32Time comme service avec sa configuration par défaut ; il n'accepte pas ces paramètres." }
    stripchart: { en: "/stripchart only displays the offset between this computer and another one.", fr: "/stripchart affiche seulement le décalage entre cet ordinateur et un autre." }
    domhier: { en: "DOMHIER makes DC1 synchronize from the domain hierarchy, but DC1 is the top of that hierarchy and must use the external source.", fr: "DOMHIER fait synchroniser DC1 sur la hiérarchie du domaine, mais DC1 en est le sommet et doit utiliser la source externe." }
    both: { en: "Adding DOMHIER would let DC1 use domain peers too, while the requirement is time.windows.com only.", fr: "Ajouter DOMHIER permettrait à DC1 d'utiliser aussi des homologues du domaine, alors que l'exigence impose time.windows.com uniquement." }
    rediscover: { en: "/rediscover is an option of /resync, not of /config.", fr: "/rediscover est une option de /resync, pas de /config." }
    nowait: { en: "/nowait is an option of /resync; without /update the new configuration isn't applied.", fr: "/nowait est une option de /resync ; sans /update, la nouvelle configuration n'est pas appliquée." }
references:
  - title: Windows Time service tools and settings
    url: https://learn.microsoft.com/en-us/windows-server/networking/windows-time-service/windows-time-service-tools-and-settings
