id: az802-7b-pool-replace-disk
objective: "7.2.8"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a stand-alone server named **FS5** that runs Windows Server 2022 and doesn't use Storage Spaces Direct. FS5 has a storage pool named **Pool1** that contains a two-way mirror virtual disk named **Data1**.

    A physical disk named **PD3** in Pool1 failed, and Data1 now reports the **Degraded** operational status. Pool1 has no free capacity. You attach a new disk named **PD5** to FS5; `Get-PhysicalDisk` shows that PD5 can be pooled.

    You need to restore the resiliency of Data1 and remove PD3 from Pool1.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un serveur autonome nommé **FS5** qui exécute Windows Server 2022 et n'utilise pas les espaces de stockage direct. FS5 possède un pool de stockage nommé **Pool1** qui contient un disque virtuel en miroir double nommé **Data1**.

    Un disque physique nommé **PD3** de Pool1 est tombé en panne, et Data1 affiche désormais l'état opérationnel **Degraded**. Pool1 n'a plus de capacité libre. Vous connectez un nouveau disque nommé **PD5** à FS5 ; `Get-PhysicalDisk` indique que PD5 peut être ajouté à un pool.

    Vous devez restaurer la résilience de Data1 et retirer PD3 de Pool1.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: remove, text: { en: "Run `Remove-PhysicalDisk` to remove PD3 from Pool1.", fr: "Exécuter `Remove-PhysicalDisk` pour retirer PD3 de Pool1." } }
    - { id: add, text: { en: "Run `Add-PhysicalDisk` to add PD5 to Pool1.", fr: "Exécuter `Add-PhysicalDisk` pour ajouter PD5 à Pool1." } }
    - { id: repair, text: { en: "Run `Repair-VirtualDisk` on Data1.", fr: "Exécuter `Repair-VirtualDisk` sur Data1." } }
    - { id: optimize, text: { en: "Run `Optimize-StoragePool` on Pool1.", fr: "Exécuter `Optimize-StoragePool` sur Pool1." } }
    - { id: online, text: { en: "Run `Set-Disk -IsOffline $false` on PD3.", fr: "Exécuter `Set-Disk -IsOffline $false` sur PD3." } }
    - { id: repvol, text: { en: "Run `Repair-Volume -Scan` on the volume of Data1.", fr: "Exécuter `Repair-Volume -Scan` sur le volume de Data1." } }
answer:
  sequence: [ add, repair, remove ]
explanation:
  correct:
    en: "Pool1 has no free capacity, so the repair needs the new disk first: you add PD5 to the pool. Without Storage Spaces Direct, repairs don't start automatically, so you run `Repair-VirtualDisk` to rebuild the missing copy of Data1 on the available capacity. When Data1 is healthy again, you remove the failed PD3 from the pool with `Remove-PhysicalDisk`."
    fr: "Pool1 n'a plus de capacité libre : la réparation a d'abord besoin du nouveau disque, que vous ajoutez au pool. Sans les espaces de stockage direct, les réparations ne démarrent pas automatiquement : vous exécutez `Repair-VirtualDisk` pour reconstruire la copie manquante de Data1 sur la capacité disponible. Une fois Data1 de nouveau sain, vous retirez du pool le disque PD3 en panne avec `Remove-PhysicalDisk`."
  options:
    optimize: { en: "Rebalancing data across the disks doesn't restore the missing mirror copy.", fr: "Rééquilibrer les données entre les disques ne restaure pas la copie miroir manquante." }
    online: { en: "PD3 failed; bringing a disk online doesn't repair a failed drive or the virtual disk.", fr: "PD3 est en panne ; mettre un disque en ligne ne répare ni un disque défaillant ni le disque virtuel." }
    repvol: { en: "Repair-Volume checks the file system; the problem is the lost resiliency of the virtual disk.", fr: "Repair-Volume vérifie le système de fichiers ; le problème est la perte de résilience du disque virtuel." }
references:
  - title: Storage Spaces and Storage Spaces Direct health and operational states
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/storage-spaces-states
