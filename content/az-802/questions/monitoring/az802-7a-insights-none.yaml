id: az802-7a-insights-none
objective: "7.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You deployed a server named **SRV7** that runs Windows Server 2022 four days ago. System Insights is enabled with its default capabilities, and their schedules are enabled.

    The CPU capacity forecasting capability of SRV7 returns the status **None**.

    What is the most likely cause?
  fr: |
    Vous avez déployé il y a quatre jours un serveur nommé **SRV7** qui exécute Windows Server 2022. System Insights est activé avec ses fonctionnalités par défaut, et leurs planifications sont activées.

    La fonctionnalité CPU capacity forecasting de SRV7 renvoie l'état **None**.

    Quelle est la cause la plus probable ?
body:
  options:
    - { id: a, text: { en: "SRV7 isn't registered with Azure, so the forecasting model can't be trained.", fr: "SRV7 n'est pas inscrit auprès d'Azure ; le modèle de prévision ne peut donc pas être entraîné." } }
    - { id: b, text: { en: "The processor usage of SRV7 will exceed its capacity within seven days.", fr: "L'utilisation du processeur de SRV7 dépassera sa capacité dans les sept jours." } }
    - { id: c, text: { en: "No remediation action is configured for the capability on SRV7.", fr: "Aucune action corrective n'est configurée pour la fonctionnalité sur SRV7." } }
    - { id: d, text: { en: "SRV7 hasn't collected enough data, so no prediction is made yet.", fr: "SRV7 n'a pas collecté assez de données ; aucune prévision n'est donc encore faite." } }
answer: { optionId: d }
explanation:
  correct:
    en: With 0 to 5 days of input data, System Insights makes no prediction, and the result status is None. After six days it starts forecasting (with a basic linear trend until three weeks of data are available), so the status will change without any action.
    fr: "Avec 0 à 5 jours de données, System Insights ne fait aucune prévision et l'état du résultat est None. À partir de six jours, il commence à prévoir (avec une tendance linéaire simple jusqu'à disposer de trois semaines de données) : l'état changera sans intervention."
  options:
    a: { en: "System Insights runs completely locally and doesn't need any cloud connectivity or retraining in the cloud.", fr: "System Insights s'exécute entièrement en local et n'a besoin d'aucune connectivité cloud ni d'entraînement dans le cloud." }
    b: { en: "A forecast that exceeds capacity within seven days has the Critical status, not None.", fr: "Une prévision qui dépasse la capacité dans les sept jours a l'état Critical, pas None." }
    c: { en: "Remediation actions are optional scripts run for a status; they don't affect whether a prediction is made.", fr: "Les actions correctives sont des scripts facultatifs exécutés pour un état ; elles n'influent pas sur la production d'une prévision." }
references:
  - title: System Insights capabilities in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/manage/system-insights/understanding-capabilities
