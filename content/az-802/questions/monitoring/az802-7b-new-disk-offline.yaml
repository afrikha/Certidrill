id: az802-7b-new-disk-offline
objective: "7.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You add a new disk to a server named **Server4** that runs Windows Server 2022. The disk doesn't appear in File Explorer.

    You run `Get-Disk` and receive the following information for the new disk.

    | Number | OperationalStatus | IsReadOnly | PartitionStyle |
    | --- | --- | --- | --- |
    | 3 | Offline | False | RAW |

    You need to create an NTFS volume on the disk.

    Which command should you run first?
  fr: |
    Vous ajoutez un nouveau disque à un serveur nommé **Server4** qui exécute Windows Server 2022. Le disque n'apparaît pas dans l'Explorateur de fichiers.

    Vous exécutez `Get-Disk` et obtenez les informations suivantes pour le nouveau disque.

    | Number | OperationalStatus | IsReadOnly | PartitionStyle |
    | --- | --- | --- | --- |
    | 3 | Offline | False | RAW |

    Vous devez créer un volume NTFS sur le disque.

    Quelle commande devez-vous exécuter en premier ?
body:
  options:
    - { id: a, text: "Set-Disk -Number 3 -IsReadOnly $false" }
    - { id: b, text: "Initialize-Disk -Number 3 -PartitionStyle GPT" }
    - { id: c, text: "New-Partition -DiskNumber 3 -UseMaximumSize" }
    - { id: d, text: "Set-Disk -Number 3 -IsOffline $false" }
answer: { optionId: d }
explanation:
  correct:
    en: "The disk is offline, so Windows can't initialize or partition it yet. `Set-Disk -IsOffline $false` brings it online; you can then initialize it (it's RAW), create a partition, and format the volume."
    fr: "Le disque est hors connexion : Windows ne peut pas encore l'initialiser ni le partitionner. `Set-Disk -IsOffline $false` le met en ligne ; vous pouvez ensuite l'initialiser (il est RAW), créer une partition et formater le volume."
  options:
    a: { en: "IsReadOnly is already False; the blocking state is Offline.", fr: "IsReadOnly vaut déjà False ; l'état bloquant est Offline." }
    b: { en: "Initialization is the next step, once the disk is online.", fr: "L'initialisation est l'étape suivante, une fois le disque en ligne." }
    c: { en: "A partition can be created only after the disk is online and initialized.", fr: "Une partition ne peut être créée qu'après la mise en ligne et l'initialisation du disque." }
references:
  - title: Set-Disk (Storage)
    url: https://learn.microsoft.com/en-us/powershell/module/storage/set-disk
