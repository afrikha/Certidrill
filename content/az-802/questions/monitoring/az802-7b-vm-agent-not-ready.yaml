id: az802-7b-vm-agent-not-ready
objective: "7.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named **VM1** that runs Windows Server 2025. Last week, a security team applied a hardening baseline to VM1.

    Since then, the Azure portal shows the VM agent status of VM1 as **Not ready**, and every attempt to install the Azure Monitor Agent extension on VM1 fails. You can still connect to VM1 by using Azure Bastion.

    Which two issues could cause this behavior?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **VM1** qui exécute Windows Server 2025. La semaine dernière, une équipe de sécurité a appliqué une base de référence de durcissement à VM1.

    Depuis, le portail Azure affiche l'état de l'agent de machine virtuelle de VM1 à **Not ready**, et chaque tentative d'installation de l'extension Azure Monitor Agent sur VM1 échoue. Vous pouvez toujours vous connecter à VM1 avec Azure Bastion.

    Quelles sont les deux causes possibles de ce comportement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Boot diagnostics is disabled on VM1.", fr: "Les diagnostics de démarrage sont désactivés sur VM1." } }
    - { id: b, text: { en: "The Windows Azure Guest Agent service is disabled on VM1.", fr: "Le service Windows Azure Guest Agent est désactivé sur VM1." } }
    - { id: c, text: { en: "The network security group of VM1 has no inbound rule that allows RDP.", fr: "Le groupe de sécurité réseau de VM1 n'a aucune règle entrante autorisant RDP." } }
    - { id: d, text: { en: "Windows Defender Firewall on VM1 blocks outbound traffic to 168.63.129.16.", fr: "Le Pare-feu Windows Defender de VM1 bloque le trafic sortant vers 168.63.129.16." } }
    - { id: e, text: { en: "The serial console is disabled for the subscription.", fr: "La console série est désactivée pour l'abonnement." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The Windows Azure Guest Agent service configures extensions and communicates with the host; if it doesn't run, the agent is reported as Not ready and extensions can't be processed. The Guest Agent also needs connectivity to the WireServer address 168.63.129.16 on ports 80 and 32526, which a guest firewall rule can block."
    fr: "Le service Windows Azure Guest Agent configure les extensions et communique avec l'hôte ; s'il ne s'exécute pas, l'agent est signalé Not ready et les extensions ne peuvent pas être traitées. L'agent invité a aussi besoin de joindre l'adresse WireServer 168.63.129.16 sur les ports 80 et 32526, ce qu'une règle du pare-feu de l'invité peut bloquer."
  options:
    a: { en: "Boot diagnostics only captures screenshots and serial logs; the agent doesn't depend on it.", fr: "Les diagnostics de démarrage capturent seulement des captures d'écran et des journaux série ; l'agent n'en dépend pas." }
    c: { en: "Inbound RDP rules affect remote sessions, not the agent's outbound communication with the host.", fr: "Les règles RDP entrantes concernent les sessions à distance, pas la communication sortante de l'agent avec l'hôte." }
    e: { en: "The serial console is a troubleshooting access method; disabling it doesn't affect the VM agent.", fr: "La console série est un moyen d'accès de dépannage ; la désactiver n'affecte pas l'agent de machine virtuelle." }
references:
  - title: Troubleshoot Azure Windows VM Agent issues
    url: https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-machines/windows/windows-azure-guest-agent
