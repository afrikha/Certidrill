id: az802-7a-wef-source-initiated
objective: "7.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named contoso.com. An organizational unit (OU) named **Branch-Servers** contains 300 servers that run Windows Server 2022. A server named **COL1** runs the Windows Event Collector service.

    You need to forward the System log errors of every server in Branch-Servers to COL1. Servers added to the OU later must forward their events automatically. The solution must minimize administrative effort.

    What should you configure?
  fr: |
    Votre réseau contient un domaine Active Directory nommé contoso.com. Une unité d'organisation (UO) nommée **Branch-Servers** contient 300 serveurs qui exécutent Windows Server 2022. Un serveur nommé **COL1** exécute le service Collecteur d'événements de Windows.

    Vous devez transférer vers COL1 les erreurs du journal Système de tous les serveurs de Branch-Servers. Les serveurs ajoutés ultérieurement à l'UO doivent transférer leurs événements automatiquement. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A collector-initiated subscription on COL1 that lists each server of the OU", fr: "Un abonnement initié par le collecteur sur COL1 qui liste chaque serveur de l'UO" } }
    - { id: b, text: { en: "A source-initiated subscription on COL1 and a GPO linked to the OU that targets COL1", fr: "Un abonnement initié par la source sur COL1 et un GPO lié à l'UO qui cible COL1" } }
    - { id: c, text: { en: "A data collector set on COL1 that collects event trace data from each server of the OU", fr: "Un jeu de collecteurs de données sur COL1 qui collecte des données de suivi d'événements de chaque serveur de l'UO" } }
    - { id: d, text: { en: "A task attached to the error events on each server that copies the System log to COL1", fr: "Une tâche jointe aux événements d'erreur sur chaque serveur qui copie le journal Système vers COL1" } }
answer: { optionId: b }
explanation:
  correct:
    en: A source-initiated (push) subscription is the most scalable Windows Event Forwarding design. The forwarding client of each server is configured by a GPO, so every server in the OU, including new ones, starts forwarding to COL1 without changing the subscription.
    fr: Un abonnement initié par la source (envoi) est la conception de transfert d'événements Windows la plus évolutive. Le client de transfert de chaque serveur est configuré par un GPO ; tous les serveurs de l'UO, y compris les nouveaux, commencent donc à transférer vers COL1 sans modifier l'abonnement.
  options:
    a:
      en: A collector-initiated (pull) subscription is preconfigured with the names of the source computers, so you would have to edit it for every new server.
      fr: Un abonnement initié par le collecteur (extraction) est préconfiguré avec les noms des ordinateurs sources ; il faudrait le modifier pour chaque nouveau serveur.
    c:
      en: Data collector sets record performance data and traces on a computer; they don't forward event log entries to a collector.
      fr: Les jeux de collecteurs de données enregistrent des données de performances et des traces sur un ordinateur ; ils ne transfèrent pas d'événements vers un collecteur.
    d:
      en: Tasks attached to events must be created on every server and copying whole logs doesn't scale; it's custom work, not event forwarding.
      fr: Les tâches jointes aux événements doivent être créées sur chaque serveur et copier des journaux entiers n'est pas évolutif ; c'est un développement spécifique, pas un transfert d'événements.
references:
  - title: Use Windows Event Forwarding to help with intrusion detection
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/device-management/use-windows-event-forwarding-to-assist-in-intrusion-detection
