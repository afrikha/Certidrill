id: az802-5b-smbd-yesno
objective: "5.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A Hyper-V host named **HV3** and a file server named **FS12** run Windows Server 2025. Each server has two RDMA-capable network adapters. HV3 runs virtual machines whose files are stored on FS12.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un hôte Hyper-V nommé **HV3** et un serveur de fichiers nommé **FS12** exécutent Windows Server 2025. Chaque serveur possède deux cartes réseau compatibles RDMA. HV3 exécute des machines virtuelles dont les fichiers sont stockés sur FS12.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A virtual machine on HV3 whose network adapter connects to a virtual switch bound to an RDMA-capable adapter can use SMB Direct to access shares on FS12.
        fr: |
          Une machine virtuelle de HV3 dont la carte réseau est connectée à un commutateur virtuel lié à une carte compatible RDMA peut utiliser SMB Direct pour accéder aux partages de FS12.
    - id: s2
      text:
        en: |
          You can team the RDMA-capable adapters of HV3 by using Switch Embedded Teaming (SET) and keep using SMB Direct from the management operating system.
        fr: |
          Vous pouvez associer les cartes compatibles RDMA de HV3 avec Switch Embedded Teaming (SET) et continuer à utiliser SMB Direct depuis le système d'exploitation de gestion.
    - id: s3
      text:
        en: |
          Requiring SMB encryption on the shares of FS12 makes the SMB traffic between HV3 and FS12 fall back from RDMA to TCP/IP.
        fr: |
          Exiger le chiffrement SMB sur les partages de FS12 fait repasser le trafic SMB entre HV3 et FS12 de RDMA à TCP/IP.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      RDMA-capable adapters aren't exposed to virtual machines, and a virtual machine's network adapter can't use RDMA even when the physical adapter behind the virtual switch supports it; SMB Direct is used by the management operating system, for example for Hyper-V over SMB. RDMA-capable adapters can be teamed with SET since Windows Server 2016. Since Windows Server 2022, SMB Direct supports encryption, so encrypted traffic keeps using RDMA.
    fr: |
      Les cartes compatibles RDMA ne sont pas exposées aux machines virtuelles, et la carte réseau d'une machine virtuelle ne peut pas utiliser RDMA, même lorsque la carte physique derrière le commutateur virtuel le prend en charge ; SMB Direct est utilisé par le système d'exploitation de gestion, par exemple pour Hyper-V sur SMB. Les cartes compatibles RDMA peuvent être associées avec SET depuis Windows Server 2016. Depuis Windows Server 2022, SMB Direct prend en charge le chiffrement : le trafic chiffré continue donc d'utiliser RDMA.
references:
  - title: Improve performance of a file server with SMB Direct
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-direct
