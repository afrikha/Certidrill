id: az802-5b-spaces-newvd-dropdown
objective: "5.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A server named **FS5** runs Windows Server 2025. FS5 has a storage pool named **Pool1** that contains six physical disks. No hot spare is configured.

    You need to create a 2-TB virtual disk named **Data1** in Pool1. Data1 must remain available if two physical disks fail at the same time.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur nommé **FS5** exécute Windows Server 2025. FS5 possède un pool de stockage nommé **Pool1** qui contient six disques physiques. Aucun disque de secours n'est configuré.

    Vous devez créer dans Pool1 un disque virtuel de 2 To nommé **Data1**. Data1 doit rester disponible si deux disques physiques tombent en panne en même temps.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    [[cmd]] -StoragePoolFriendlyName Pool1 -FriendlyName Data1 `
      -ResiliencySettingName [[res]] -NumberOfDataCopies [[copies]] -Size 2TB -ProvisioningType Thin
  slots:
    - id: cmd
      options:
        - { id: newvd, text: New-VirtualDisk }
        - { id: newpool, text: New-StoragePool }
        - { id: newpart, text: New-Partition }
    - id: res
      options:
        - { id: mirror, text: Mirror }
        - { id: parity, text: Parity }
        - { id: simple, text: Simple }
    - id: copies
      options:
        - { id: c2, text: "2" }
        - { id: c3, text: "3" }
        - { id: c4, text: "4" }
answer:
  values: { cmd: newvd, res: mirror, copies: c3 }
explanation:
  correct:
    en: "`New-VirtualDisk` creates a storage space in an existing pool. A mirror with three data copies (three-way mirror) protects against two simultaneous disk failures and needs at least five disks, which the six-disk pool provides."
    fr: "`New-VirtualDisk` crée un espace de stockage dans un pool existant. Un miroir à trois copies de données (miroir tridirectionnel) protège contre deux pannes de disque simultanées et nécessite au moins cinq disques, ce que fournit le pool de six disques."
  options:
    newpool: { en: "New-StoragePool creates a pool from physical disks; Pool1 already exists.", fr: "New-StoragePool crée un pool à partir de disques physiques ; Pool1 existe déjà." }
    newpart: { en: "New-Partition creates a partition on a disk; it doesn't create a storage space in a pool.", fr: "New-Partition crée une partition sur un disque ; il ne crée pas d'espace de stockage dans un pool." }
    parity: { en: "A parity space protects against a single disk failure.", fr: "Un espace à parité protège contre la panne d'un seul disque." }
    simple: { en: "A simple space has no redundancy and fails with the first disk.", fr: "Un espace simple n'a aucune redondance et tombe en panne avec le premier disque." }
    c2: { en: "Two data copies form a two-way mirror, which survives only one disk failure.", fr: "Deux copies de données forment un miroir bidirectionnel, qui ne supporte qu'une seule panne de disque." }
references:
  - title: Deploy Storage Spaces on a stand-alone server
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/deploy-standalone-storage-spaces
