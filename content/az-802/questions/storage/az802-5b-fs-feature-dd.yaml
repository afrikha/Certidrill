id: az802-5b-fs-feature-dd
objective: "5.3.8"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are planning the volumes of a server named **HV5** that runs Windows Server 2025 Datacenter.

    Which file system should you use for each volume? To answer, drag the appropriate file systems to the correct volumes. Each file system may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez les volumes d'un serveur nommé **HV5** qui exécute Windows Server 2025 Datacenter.

    Quel système de fichiers devez-vous utiliser pour chaque volume ? Pour répondre, faites glisser les systèmes de fichiers appropriés vers les volumes correspondants. Chaque système de fichiers peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: ntfs, text: NTFS }
    - { id: refs, text: ReFS }
    - { id: exfat, text: exFAT }
    - { id: fat32, text: FAT32 }
  targets:
    - id: boot
      text: { en: "The operating system volume on which Windows is installed", fr: "Le volume du système d'exploitation sur lequel Windows est installé" }
    - id: quota
      text: { en: "A data volume on which each user gets a disk quota", fr: "Un volume de données sur lequel chaque utilisateur reçoit un quota de disque" }
    - id: clone
      text: { en: "A volume for VHDX files on which checkpoint merges use block cloning", fr: "Un volume de fichiers VHDX sur lequel les fusions de points de contrôle utilisent le clonage de blocs" }
    - id: vdl
      text: { en: "A volume on which fixed-size VHDX files are created in seconds by using sparse VDL", fr: "Un volume sur lequel les fichiers VHDX de taille fixe sont créés en quelques secondes grâce au VDL fragmenté" }
answer:
  mapping: { boot: ntfs, quota: ntfs, clone: refs, vdl: refs }
explanation:
  correct:
    en: |
      ReFS can't be used for bootable volumes and doesn't support disk quotas, so the operating system volume and the quota volume use NTFS. Block cloning, which accelerates copies and checkpoint merges, and sparse VDL, which creates fixed VHDX files in seconds, are ReFS-only features.
    fr: |
      ReFS ne peut pas être utilisé pour des volumes de démarrage et ne prend pas en charge les quotas de disque : le volume du système d'exploitation et le volume avec quotas utilisent donc NTFS. Le clonage de blocs, qui accélère les copies et les fusions de points de contrôle, et le VDL fragmenté, qui crée des fichiers VHDX fixes en quelques secondes, sont des fonctionnalités propres à ReFS.
  options:
    exfat:
      en: |
        exFAT offers no disk quotas and none of the ReFS virtualization features.
      fr: |
        exFAT n'offre ni quotas de disque ni aucune des fonctionnalités de virtualisation de ReFS.
    fat32:
      en: |
        FAT32 offers neither disk quotas nor block cloning, and it isn't used for the Windows volume of a server.
      fr: |
        FAT32 n'offre ni quotas de disque ni clonage de blocs, et il n'est pas utilisé pour le volume Windows d'un serveur.
references:
  - title: Resilient File System (ReFS) overview
    url: https://learn.microsoft.com/en-us/windows-server/storage/refs/refs-overview
