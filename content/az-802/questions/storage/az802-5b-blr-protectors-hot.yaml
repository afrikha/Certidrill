id: az802-5b-blr-protectors-hot
objective: "5.3.11"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    A server named **SRV11** runs Windows Server 2025. You run `manage-bde -protectors -get C:` on SRV11. The key protectors of C: are shown in the following table.

    Answer each prompt by selecting the key protector that matches it.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur nommé **SRV11** exécute Windows Server 2025. Vous exécutez `manage-bde -protectors -get C:` sur SRV11. Les protecteurs de clé de C: figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le protecteur de clé qui lui correspond.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Unlocks C: at startup without user input while the boot components are unchanged", fr: "Déverrouille C: au démarrage sans intervention de l'utilisateur tant que les composants de démarrage ne changent pas" }
    - id: p2
      text: { en: "The 48-digit value that the help desk reads to an administrator who is at the BitLocker recovery screen", fr: "La valeur à 48 chiffres que le support communique à un administrateur qui se trouve devant l'écran de récupération BitLocker" }
  grid:
    header: [{ en: "Key protector type", fr: "Type de protecteur de clé" }, ID]
    rows:
      - [{ text: TPM, area: tpm }, { text: "{5A1B2C3D-0E4F-4A6B-8C9D-1E2F3A4B5C6D}" }]
      - [{ text: Numerical Password, area: numpwd }, { text: "{9F3C7B21-6D4E-4F8A-9B0C-2D3E4F5A6B7C}" }]
      - [{ text: External Key, area: extkey }, { text: "{C27E8D10-3A5B-4C7D-8E9F-0A1B2C3D4E5F}" }]
answer:
  values: { p1: tpm, p2: numpwd }
explanation:
  correct:
    en: |
      The TPM protector releases the key at startup when the platform measurements are unchanged, without user input. The Numerical Password protector is the 48-digit recovery password, entered at the recovery screen. The External Key protector is a recovery key stored in a .bek file on removable media, not a value typed by the user.
    fr: |
      Le protecteur TPM libère la clé au démarrage lorsque les mesures de la plateforme n'ont pas changé, sans intervention de l'utilisateur. Le protecteur Numerical Password est le mot de passe de récupération à 48 chiffres, saisi sur l'écran de récupération. Le protecteur External Key est une clé de récupération stockée dans un fichier .bek sur un support amovible, pas une valeur tapée par l'utilisateur.
references:
  - title: BitLocker recovery overview
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/recovery-overview
