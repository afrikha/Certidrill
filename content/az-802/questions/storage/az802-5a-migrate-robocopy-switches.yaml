id: az802-5a-migrate-robocopy-switches
objective: "5.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are migrating the folder D:\Shares\Legal on a server named **FS1** to an Azure file share. The share is mounted on FS1 as drive Z: by using the storage account key. You will run the same command several times before the cutover.

    The command must meet the following requirements:

    - Copy files even when your account has no NTFS permission on them.
    - On later runs, delete from Z: the items that were removed from the source.
    - Preserve the data, attributes, timestamps, NTFS ACLs and owner of each file.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous migrez le dossier D:\Shares\Legal d'un serveur nommé **FS1** vers un partage de fichiers Azure. Le partage est monté sur FS1 comme lecteur Z: avec la clé du compte de stockage. Vous exécuterez la même commande plusieurs fois avant le basculement final.

    La commande doit répondre aux exigences suivantes :

    - Copier les fichiers même quand votre compte n'a aucune autorisation NTFS sur eux.
    - Lors des exécutions suivantes, supprimer de Z: les éléments supprimés de la source.
    - Conserver les données, les attributs, les horodatages, les listes ACL NTFS et le propriétaire de chaque fichier.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    robocopy D:\Shares\Legal Z:\ /MT:16 /R:2 /W:1 [[mode]] [[mirror]] /IT [[copy]] /DCOPY:DAT /NP /XD "System Volume Information" /UNILOG:C:\Logs\legal.log
  slots:
    - id: mode
      options:
        - { id: z, text: /Z }
        - { id: b, text: /B }
        - { id: j, text: /J }
    - id: mirror
      options:
        - { id: e, text: /E }
        - { id: mov, text: /MOV }
        - { id: mir, text: /MIR }
    - id: copy
      options:
        - { id: datso, text: "/COPY:DATSO" }
        - { id: dat, text: "/COPY:DAT" }
        - { id: datsou, text: "/COPY:DATSOU" }
answer:
  values: { mode: b, mirror: mir, copy: datso }
explanation:
  correct:
    en: "/B runs Robocopy in backup mode from an elevated console, which copies files that your account has no permission on. /MIR mirrors the source to the target: later runs copy only the changes and purge from the target the items that no longer exist at the source. /COPY:DATSO copies data, attributes, timestamps, security (NTFS ACLs) and owner information."
    fr: "/B exécute Robocopy en mode sauvegarde depuis une console élevée, ce qui copie les fichiers sur lesquels votre compte n'a aucune autorisation. /MIR met la cible en miroir de la source : les exécutions suivantes ne copient que les modifications et suppriment de la cible les éléments qui n'existent plus à la source. /COPY:DATSO copie les données, les attributs, les horodatages, la sécurité (listes ACL NTFS) et les informations de propriétaire."
  options:
    z: { en: "/Z copies in restartable mode; it does not bypass NTFS permissions.", fr: "/Z copie en mode redémarrable ; il ne contourne pas les autorisations NTFS." }
    j: { en: "/J uses unbuffered I/O for large files; it does not bypass NTFS permissions.", fr: "/J utilise des E/S sans mise en mémoire tampon pour les gros fichiers ; il ne contourne pas les autorisations NTFS." }
    e: { en: "/E copies subdirectories but never deletes items from the target.", fr: "/E copie les sous-répertoires mais ne supprime jamais d'éléments de la cible." }
    mov: { en: "/MOV deletes files from the source after copying them, which would destroy the production data.", fr: "/MOV supprime les fichiers de la source après les avoir copiés, ce qui détruirait les données de production." }
    dat: { en: "/COPY:DAT is the default and does not copy NTFS ACLs or owner information.", fr: "/COPY:DAT est la valeur par défaut et ne copie ni les listes ACL NTFS ni les informations de propriétaire." }
    datsou: { en: "The U flag copies auditing information, which an Azure file share cannot store.", fr: "L'indicateur U copie les informations d'audit, qu'un partage de fichiers Azure ne peut pas stocker." }
references:
  - title: Migrate to Azure Files Using RoboCopy
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-migration-robocopy
