id: az802-5a-fsrm-refs-volume
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A file server named **FS3** has two data volumes: D: is formatted with NTFS and E: is formatted with ReFS. FSRM quotas and file screens work on the folders of D:. When you try to create a quota on E:\Shares\Design, FSRM does not accept the path.

    You need to apply an FSRM quota to the Design data.

    What should you do?
  fr: |
    Un serveur de fichiers nommé **FS3** possède deux volumes de données : D: est formaté en NTFS et E: en ReFS. Les quotas et les filtres de fichiers FSRM fonctionnent sur les dossiers de D:. Quand vous essayez de créer un quota sur E:\Shares\Design, FSRM n'accepte pas le chemin.

    Vous devez appliquer un quota FSRM aux données de Design.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Move the Design data to a folder on volume D: and create the quota there.", fr: "Déplacer les données de Design vers un dossier du volume D: et y créer le quota." } }
    - { id: b, text: { en: "Restart the File Server Resource Manager service and create the quota again.", fr: "Redémarrer le service Gestionnaire de ressources du serveur de fichiers et créer de nouveau le quota." } }
    - { id: c, text: { en: "Create the quota from a quota template instead of a custom quota.", fr: "Créer le quota à partir d'un modèle de quota plutôt qu'en quota personnalisé." } }
    - { id: d, text: { en: "Create an auto apply quota on E:\\Shares instead of a quota on E:\\Shares\\Design.", fr: "Créer un quota à application automatique sur E:\\Shares au lieu d'un quota sur E:\\Shares\\Design." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      FSRM supports only volumes formatted with NTFS; ReFS volumes are not supported. To apply an FSRM quota, the data must be on an NTFS volume such as D:.
    fr: |
      FSRM ne prend en charge que les volumes formatés en NTFS ; les volumes ReFS ne sont pas pris en charge. Pour appliquer un quota FSRM, les données doivent se trouver sur un volume NTFS comme D:.
  options:
    b:
      en: |
        The service works on D:; restarting it does not add support for ReFS.
      fr: |
        Le service fonctionne sur D: ; le redémarrer n'ajoute pas la prise en charge de ReFS.
    c:
      en: |
        Templates simplify quota management but are subject to the same NTFS requirement.
      fr: |
        Les modèles simplifient la gestion des quotas mais sont soumis à la même exigence NTFS.
    d:
      en: |
        Auto apply quotas are also FSRM quotas and cannot be created on a ReFS volume.
      fr: |
        Les quotas à application automatique sont aussi des quotas FSRM et ne peuvent pas être créés sur un volume ReFS.
references:
  - title: File Server Resource Manager (FSRM) overview
    url: https://learn.microsoft.com/en-us/windows-server/storage/fsrm/fsrm-overview
