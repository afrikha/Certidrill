id: az802-5b-bl-netunlock
objective: "5.3.10"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named contoso.com. Twenty domain-joined servers run Windows Server 2025 on UEFI hardware with a TPM. Their operating system volumes are protected by BitLocker with TPM + PIN protectors. A DHCP server named **DHCP1** serves the server network, and an enterprise certification authority is available.

    Monthly updates require restarts, and an administrator must currently type the PIN at each restart.

    You need the servers to restart without a PIN when they are connected to the wired corporate network. A PIN must still be required when a server starts outside the corporate network.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine Active Directory nommé contoso.com. Vingt serveurs joints au domaine exécutent Windows Server 2025 sur du matériel UEFI avec un TPM. Leurs volumes du système d'exploitation sont protégés par BitLocker avec des protecteurs TPM + code PIN. Un serveur DHCP nommé **DHCP1** dessert le réseau des serveurs, et une autorité de certification d'entreprise est disponible.

    Les mises à jour mensuelles exigent des redémarrages, et un administrateur doit actuellement taper le code PIN à chaque redémarrage.

    Les serveurs doivent redémarrer sans code PIN lorsqu'ils sont connectés au réseau filaire de l'entreprise. Un code PIN doit toujours être exigé lorsqu'un serveur démarre en dehors du réseau de l'entreprise.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "On a server other than DHCP1, install the WDS role and the BitLocker Network Unlock feature, and import the Network Unlock certificate with its private key.", fr: "Sur un serveur autre que DHCP1, installer le rôle WDS et la fonctionnalité Déverrouillage réseau BitLocker, puis importer le certificat de déverrouillage réseau avec sa clé privée." } }
    - { id: b, text: { en: "In a GPO linked to the domain, enable Allow Network Unlock at startup and add the public Network Unlock certificate.", fr: "Dans un objet de stratégie de groupe lié au domaine, activer Autoriser le déverrouillage réseau au démarrage et ajouter le certificat public de déverrouillage réseau." } }
    - { id: c, text: { en: "On each server, replace the TPM + PIN protector of the operating system volume with a TPM-only protector, and keep the recovery password.", fr: "Sur chaque serveur, remplacer le protecteur TPM + code PIN du volume du système d'exploitation par un protecteur TPM seul, et conserver le mot de passe de récupération." } }
    - { id: d, text: { en: "On each server, add an Active Directory account protector for the computer account to the operating system volume.", fr: "Sur chaque serveur, ajouter au volume du système d'exploitation un protecteur de compte Active Directory pour le compte d'ordinateur." } }
    - { id: e, text: { en: "In a GPO linked to the domain, require the recovery passwords of operating system drives to be stored in AD DS before BitLocker is enabled.", fr: "Dans un objet de stratégie de groupe lié au domaine, exiger le stockage des mots de passe de récupération des lecteurs du système d'exploitation dans AD DS avant l'activation de BitLocker." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Network Unlock needs a WDS server, separate from the DHCP server, with the BitLocker Network Unlock feature and the certificate's private key, plus Group Policy that enables Allow Network Unlock at startup and distributes the public certificate. After a restart, the servers get a Network (Certificate Based) protector; when they can't reach the WDS server, BitLocker falls back to the TPM + PIN prompt.
    fr: |
      Le déverrouillage réseau nécessite un serveur WDS, distinct du serveur DHCP, avec la fonctionnalité Déverrouillage réseau BitLocker et la clé privée du certificat, ainsi qu'une stratégie de groupe qui active Autoriser le déverrouillage réseau au démarrage et distribue le certificat public. Après un redémarrage, les serveurs reçoivent un protecteur Network (Certificate Based) ; lorsqu'ils ne peuvent pas joindre le serveur WDS, BitLocker revient à l'invite TPM + code PIN.
  options:
    c:
      en: |
        A TPM-only protector removes the PIN everywhere, including outside the corporate network.
      fr: |
        Un protecteur TPM seul supprime le code PIN partout, y compris en dehors du réseau de l'entreprise.
    d:
      en: |
        An Active Directory account protector unlocks data volumes through domain authentication; operating system volumes can't use this type of protector.
      fr: |
        Un protecteur de compte Active Directory déverrouille des volumes de données par l'authentification de domaine ; les volumes du système d'exploitation ne peuvent pas utiliser ce type de protecteur.
    e:
      en: |
        Storing recovery passwords in AD DS helps recovery but doesn't remove the PIN prompt at restart.
      fr: |
        Stocker les mots de passe de récupération dans AD DS facilite la récupération mais ne supprime pas l'invite du code PIN au redémarrage.
