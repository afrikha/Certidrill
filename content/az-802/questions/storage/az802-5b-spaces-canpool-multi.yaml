id: az802-5b-spaces-canpool-multi
objective: "5.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A stand-alone server named **FS6** runs Windows Server 2025. The disks are connected to a SAS HBA in non-RAID mode. The following table shows the disks that you plan to add to a new storage pool named **Pool1**.

    | Disk | Bus type | Size | Content |
    | --- | --- | --- | --- |
    | Disk1 | SAS | 4 TB | Blank |
    | Disk2 | SATA | 3 GB | Blank |
    | Disk3 | SAS | 4 TB | One NTFS volume |
    | Disk4 | SATA | 500 GB | Blank |
    | Disk5 | SATA | 8 TB | Blank |

    Which two disks can't be added to Pool1 in their current state?

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur autonome nommé **FS6** exécute Windows Server 2025. Les disques sont connectés à un HBA SAS en mode non-RAID. Le tableau suivant présente les disques que vous prévoyez d'ajouter à un nouveau pool de stockage nommé **Pool1**.

    | Disque | Type de bus | Taille | Contenu |
    | --- | --- | --- | --- |
    | Disk1 | SAS | 4 To | Vierge |
    | Disk2 | SATA | 3 Go | Vierge |
    | Disk3 | SAS | 4 To | Un volume NTFS |
    | Disk4 | SATA | 500 Go | Vierge |
    | Disk5 | SATA | 8 To | Vierge |

    Quels sont les deux disques qui ne peuvent pas être ajoutés à Pool1 dans leur état actuel ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Disk1 }
    - { id: b, text: Disk2 }
    - { id: c, text: Disk3 }
    - { id: d, text: Disk4 }
    - { id: e, text: Disk5 }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Physical disks added to a storage pool must be at least 4 GB and must be blank and unformatted. Disk2 is too small, and Disk3 already contains a volume; you would have to clear Disk3 before pooling it.
    fr: |
      Les disques physiques ajoutés à un pool de stockage doivent faire au moins 4 Go et être vierges et non formatés. Disk2 est trop petit, et Disk3 contient déjà un volume ; il faudrait effacer Disk3 avant de l'ajouter au pool.
  options:
    a:
      en: |
        Disk1 is a blank SAS disk larger than 4 GB, so it is eligible.
      fr: |
        Disk1 est un disque SAS vierge de plus de 4 Go : il est éligible.
    d:
      en: |
        Disk4 is a blank SATA disk larger than 4 GB; disks of different sizes can be mixed in a pool.
      fr: |
        Disk4 est un disque SATA vierge de plus de 4 Go ; des disques de tailles différentes peuvent coexister dans un pool.
    e:
      en: |
        Disk5 is a blank SATA disk, which meets the requirements.
      fr: |
        Disk5 est un disque SATA vierge, ce qui respecte les exigences.
references:
  - title: Deploy Storage Spaces on a stand-alone server
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/deploy-standalone-storage-spaces
