id: az802-5b-qos-policy-dropdown
objective: "5.3.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Hyper-V hosts store the virtual machines of a web farm on a Scale-Out File Server named **SOFS2**. All servers run Windows Server 2025. The web VMs are named Web1 to Web8.

    You need to limit each virtual disk of the web VMs to 1,000 normalized IOPS and 100 MB per second. No minimum must be reserved.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Des hôtes Hyper-V stockent les machines virtuelles d'une batterie web sur un serveur de fichiers avec montée en puissance parallèle nommé **SOFS2**. Tous les serveurs exécutent Windows Server 2025. Les VM web s'appellent Web1 à Web8.

    Vous devez limiter chaque disque virtuel des VM web à 1 000 IOPS normalisées et à 100 Mo par seconde. Aucun minimum ne doit être réservé.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    # On SOFS2
    $policy = New-StorageQosPolicy -Name Web -PolicyType Dedicated -[[p1]] 1000 -[[p2]] 100MB
    $policy.PolicyId

    # On each Hyper-V host, with $webPolicyId set to the PolicyId returned above
    Get-VM -Name Web* | Get-VMHardDiskDrive | [[cmd]] -QoSPolicyID $webPolicyId
  slots:
    - id: p1
      options:
        - { id: maxiops, text: MaximumIops }
        - { id: miniops, text: MinimumIops }
        - { id: maxbw, text: MaximumIOBandwidth }
    - id: p2
      options:
        - { id: maxiops, text: MaximumIops }
        - { id: miniops, text: MinimumIops }
        - { id: maxbw, text: MaximumIOBandwidth }
    - id: cmd
      options:
        - { id: setdrive, text: Set-VMHardDiskDrive }
        - { id: setvm, text: Set-VM }
        - { id: setvhd, text: Set-VHD }
        - { id: setpolicy, text: Set-StorageQosPolicy }
answer:
  values: { p1: maxiops, p2: maxbw, cmd: setdrive }
explanation:
  correct:
    en: |
      MaximumIops sets the limit in normalized IOPS, and MaximumIOBandwidth sets a limit in bytes per second (100MB is stored as 104857600); whichever limit is reached first applies. The policy is created on the Scale-Out File Server and assigned on the Hyper-V hosts with Set-VMHardDiskDrive -QoSPolicyID. A Dedicated policy applies the limits to each virtual disk.
    fr: |
      MaximumIops définit la limite en IOPS normalisées, et MaximumIOBandwidth une limite en octets par seconde (100MB est stocké sous la forme 104857600) ; la première limite atteinte s'applique. La stratégie est créée sur le serveur de fichiers avec montée en puissance parallèle et attribuée sur les hôtes Hyper-V avec Set-VMHardDiskDrive -QoSPolicyID. Une stratégie Dedicated applique les limites à chaque disque virtuel.
  options:
    miniops: { en: "MinimumIops reserves IOPS, which the requirements exclude.", fr: "MinimumIops réserve des IOPS, ce que les exigences excluent." }
    setvm: { en: "Set-VM configures VM-level settings; Storage QoS policies are assigned per virtual hard disk drive.", fr: "Set-VM configure des paramètres au niveau de la VM ; les stratégies de qualité de service du stockage s'attribuent par lecteur de disque dur virtuel." }
    setvhd: { en: "Set-VHD changes properties of a VHD file, such as its parent path; it doesn't assign a QoS policy.", fr: "Set-VHD modifie des propriétés d'un fichier VHD, comme son chemin parent ; il n'attribue pas de stratégie QoS." }
    setpolicy: { en: "Set-StorageQosPolicy runs on the file server to change a policy's values; it doesn't assign the policy to disks.", fr: "Set-StorageQosPolicy s'exécute sur le serveur de fichiers pour modifier les valeurs d'une stratégie ; il n'attribue pas la stratégie aux disques." }
references:
  - title: Storage Quality of Service
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-qos/storage-qos-overview
