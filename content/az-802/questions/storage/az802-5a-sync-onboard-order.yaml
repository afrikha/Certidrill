id: az802-5a-sync-onboard-order
objective: "5.1.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Northwind has a Windows Server 2022 file server named **FS1**. The folder D:\Shares\Sales is on an NTFS volume. In Azure, a Storage Sync Service named **sss-northwind** contains a sync group named **Sales** whose cloud endpoint points to the Azure file share sales. Nothing related to Azure File Sync is installed on FS1.

    You need D:\Shares\Sales to sync with the sales share.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind dispose d'un serveur de fichiers Windows Server 2022 nommé **FS1**. Le dossier D:\Shares\Sales se trouve sur un volume NTFS. Dans Azure, un service de synchronisation de stockage nommé **sss-northwind** contient un groupe de synchronisation nommé **Sales** dont le point de terminaison cloud pointe vers le partage de fichiers Azure sales. Aucun composant d'Azure File Sync n'est installé sur FS1.

    D:\Shares\Sales doit se synchroniser avec le partage sales.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: agent, text: { en: "Install the Azure File Sync agent on FS1.", fr: "Installer l'agent Azure File Sync sur FS1." } }
    - { id: register, text: { en: "Register FS1 with sss-northwind.", fr: "Inscrire FS1 auprès de sss-northwind." } }
    - { id: endpoint, text: { en: "Add a server endpoint for D:\\Shares\\Sales on FS1 to the Sales sync group.", fr: "Ajouter au groupe de synchronisation Sales un point de terminaison de serveur pour D:\\Shares\\Sales sur FS1." } }
    - { id: cloud2, text: { en: "Add a second cloud endpoint to the Sales sync group.", fr: "Ajouter un second point de terminaison cloud au groupe de synchronisation Sales." } }
    - { id: mapkey, text: { en: "Map the sales share on FS1 by using the storage account key.", fr: "Mapper le partage sales sur FS1 avec la clé du compte de stockage." } }
    - { id: dfsr, text: { en: "Install the DFS Replication role service on FS1.", fr: "Installer le service de rôle Réplication DFS sur FS1." } }
answer:
  sequence: [ agent, register, endpoint ]
explanation:
  correct:
    en: |
      The server registration tool comes with the Azure File Sync agent, so the agent is installed first. Registering FS1 creates the trust with the Storage Sync Service, and only a registered server can provide a server endpoint, which you then add to the existing sync group.
    fr: |
      L'outil d'inscription du serveur est fourni avec l'agent Azure File Sync : l'agent s'installe donc en premier. L'inscription de FS1 crée la relation d'approbation avec le service de synchronisation de stockage, et seul un serveur inscrit peut fournir un point de terminaison de serveur, que vous ajoutez ensuite au groupe de synchronisation existant.
  options:
    cloud2: { en: "A sync group has exactly one cloud endpoint, which already exists.", fr: "Un groupe de synchronisation a exactement un point de terminaison cloud, qui existe déjà." }
    mapkey: { en: "Azure File Sync uses its own HTTPS protocol; the server does not mount the share over SMB.", fr: "Azure File Sync utilise son propre protocole HTTPS ; le serveur ne monte pas le partage en SMB." }
    dfsr: { en: "DFS Replication is not a prerequisite of Azure File Sync.", fr: "La réplication DFS n'est pas un prérequis d'Azure File Sync." }
references:
  - title: Deploy Azure File Sync
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide
