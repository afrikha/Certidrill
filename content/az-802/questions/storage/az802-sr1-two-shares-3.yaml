id: az802-sr1-two-shares-3
objective: "5.1.3"
type: series_yesno
series: az802-sr1-two-shares
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You deploy a second Storage Sync Service for the finance file share and register FS1 with it.
  fr: Vous déployez un second service de synchronisation de stockage pour le partage de fichiers finance et y inscrivez FS1.
body:
  solution:
    en: |
      In Sync1, you create a sync group named **SG-Projects** with a cloud endpoint for the projects file share and a server endpoint for **D:\Projects** on FS1. You deploy a second Storage Sync Service named **Sync2** in West Europe, register FS1 with Sync2, and create a sync group named **SG-Finance** in Sync2 with a cloud endpoint for the finance file share and a server endpoint for **D:\Finance** on FS1.
    fr: |
      Dans Sync1, vous créez un groupe de synchronisation nommé **SG-Projects** avec un point de terminaison cloud pour le partage de fichiers projects et un point de terminaison de serveur pour **D:\Projects** sur FS1. Vous déployez un second service de synchronisation de stockage nommé **Sync2** dans la région West Europe, vous inscrivez FS1 auprès de Sync2, puis vous créez dans Sync2 un groupe de synchronisation nommé **SG-Finance** avec un point de terminaison cloud pour le partage de fichiers finance et un point de terminaison de serveur pour **D:\Finance** sur FS1.
answer: { value: false }
explanation:
  correct:
    en: |
      A server can be registered with only one Storage Sync Service at a time. FS1 is already registered with Sync1, so it cannot also be registered with Sync2, and SG-Finance cannot get a server endpoint on FS1. A second sync group in Sync1 is enough to sync the second folder.
    fr: |
      Un serveur ne peut être inscrit qu'auprès d'un seul service de synchronisation de stockage à la fois. FS1 est déjà inscrit auprès de Sync1 : il ne peut pas être inscrit également auprès de Sync2, et SG-Finance ne peut pas obtenir de point de terminaison de serveur sur FS1. Un second groupe de synchronisation dans Sync1 suffit pour synchroniser le second dossier.
references:
  - title: Deploy Azure File Sync
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide
