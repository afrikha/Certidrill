id: az802-5b-spaces-thin
objective: "5.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A file server named **FS4** runs Windows Server 2025. FS4 has a storage pool named **Pool1** that has 4 TB of free capacity.

    You plan to create one virtual disk per department in Pool1, for a total size of 12 TB. You will add physical disks to Pool1 as the data grows. Pool capacity must be consumed only when data is written to the virtual disks.

    What should you configure when you create the virtual disks?
  fr: |
    Un serveur de fichiers nommé **FS4** exécute Windows Server 2025. FS4 possède un pool de stockage nommé **Pool1** qui dispose de 4 To de capacité libre.

    Vous prévoyez de créer dans Pool1 un disque virtuel par service, pour une taille totale de 12 To. Vous ajouterez des disques physiques à Pool1 au fur et à mesure que les données augmenteront. La capacité du pool ne doit être consommée que lorsque des données sont écrites sur les disques virtuels.

    Que devez-vous configurer lors de la création des disques virtuels ?
body:
  options:
    - { id: a, text: { en: "The Fixed provisioning type", fr: "Le type de provisionnement fixe (Fixed)" } }
    - { id: b, text: { en: "The Thin provisioning type", fr: "Le type de provisionnement dynamique (Thin)" } }
    - { id: c, text: { en: "The Simple resiliency type", fr: "Le type de résilience simple (Simple)" } }
    - { id: d, text: { en: "A hot spare disk in Pool1", fr: "Un disque de secours (hot spare) dans Pool1" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Thin provisioning allocates pool space on demand as data is written, so you can create virtual disks whose total size exceeds the pool's free capacity. Because the pool can be over-allocated, you must monitor its free space and add disks before it fills up.
    fr: |
      Le provisionnement dynamique alloue l'espace du pool à la demande, au fur et à mesure de l'écriture des données ; vous pouvez donc créer des disques virtuels dont la taille totale dépasse la capacité libre du pool. Comme le pool permet la surallocation, vous devez surveiller son espace libre et ajouter des disques avant qu'il ne soit plein.
  options:
    a:
      en: |
        Fixed provisioning takes the full size of the virtual disk from the pool at creation, so 12 TB can't be created from 4 TB of free space.
      fr: |
        Le provisionnement fixe prend toute la taille du disque virtuel dans le pool dès la création ; 12 To ne peuvent donc pas être créés à partir de 4 To d'espace libre.
    c:
      en: |
        The resiliency type controls data copies or parity, not when pool space is allocated.
      fr: |
        Le type de résilience détermine les copies ou la parité des données, pas le moment où l'espace du pool est alloué.
    d:
      en: |
        A hot spare replaces a failed disk; it adds no capacity to the virtual disks and doesn't change how space is allocated.
      fr: |
        Un disque de secours remplace un disque défaillant ; il n'ajoute pas de capacité aux disques virtuels et ne change pas la façon dont l'espace est alloué.
references:
  - title: Deploy Storage Spaces on a stand-alone server
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/deploy-standalone-storage-spaces
