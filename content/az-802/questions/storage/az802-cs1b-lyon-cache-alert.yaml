id: az802-cs1b-lyon-cache-alert
objective: "5.1.4"
type: single
caseStudy: az802-cs1b-southridge
difficulty: 2
status: draft
stem:
  en: |
    You need to create an Azure Monitor alert rule on sss-southridge to meet the Lyon cache requirement.

    Which metric should you use in the alert rule?
  fr: |
    Vous devez créer une règle d'alerte Azure Monitor sur sss-southridge pour respecter l'exigence relative au cache de Lyon.

    Quelle métrique devez-vous utiliser dans la règle d'alerte ?
body:
  options:
    - { id: a, text: Cloud tiering recall size }
    - { id: b, text: Cloud tiering cache hit rate }
    - { id: c, text: Bytes synced }
    - { id: d, text: Files not syncing }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Cloud tiering cache hit rate is the percentage of bytes served from the local cache of the server endpoint rather than recalled from the Azure file share. An alert when this value drops below 80 for FS-LYO1 matches the requirement.
    fr: |
      Cloud tiering cache hit rate est le pourcentage d'octets servis depuis le cache local du point de terminaison de serveur plutôt que rappelés depuis le partage de fichiers Azure. Une alerte quand cette valeur passe sous 80 pour FS-LYO1 correspond à l'exigence.
  options:
    a: { en: "Recall size is an amount of data recalled from the cloud, not a percentage of the bytes served from the cache.", fr: "Recall size est une quantité de données rappelées depuis le cloud, pas un pourcentage des octets servis depuis le cache." }
    c: { en: "Bytes synced measures the data transferred by sync (upload and download), not cache efficiency.", fr: "Bytes synced mesure les données transférées par la synchronisation (envoi et téléchargement), pas l'efficacité du cache." }
    d: { en: "Files not syncing counts files that fail to sync; it says nothing about cache hits.", fr: "Files not syncing compte les fichiers dont la synchronisation échoue ; il n'indique rien sur les accès au cache." }
references:
  - title: Monitor Azure File Sync
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-monitoring
