id: az802-5a-quic-kdc-proxy
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A file server named **FSEDGE1** in the contoso.com domain runs Windows Server 2025 and accepts SMB over QUIC connections at fsedge1.contoso.com. Remote users connect from domain-joined Windows 11 laptops that cannot reach any domain controller, so they currently authenticate with NTLMv2 inside the QUIC tunnel.

    You need the remote users to authenticate with Kerberos. Domain controllers must not be reachable from the internet.

    What should you do?
  fr: |
    Un serveur de fichiers nommé **FSEDGE1**, membre du domaine contoso.com, exécute Windows Server 2025 et accepte les connexions SMB sur QUIC à l'adresse fsedge1.contoso.com. Les utilisateurs distants se connectent depuis des ordinateurs portables Windows 11 joints au domaine qui ne peuvent joindre aucun contrôleur de domaine : ils s'authentifient donc actuellement en NTLMv2 dans le tunnel QUIC.

    Les utilisateurs distants doivent s'authentifier avec Kerberos. Les contrôleurs de domaine ne doivent pas être accessibles depuis Internet.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Configure the KDC Proxy service on FSEDGE1, and deploy the Specify KDC proxy servers for Kerberos clients policy to the laptops.", fr: "Configurer le service KDC Proxy sur FSEDGE1, et déployer la stratégie Specify KDC proxy servers for Kerberos clients sur les ordinateurs portables." }
    - id: b
      text: { en: "Run Set-SmbClientConfiguration -BlockNTLM $true on the laptops so that they must use Kerberos with FSEDGE1.", fr: "Exécuter Set-SmbClientConfiguration -BlockNTLM $true sur les ordinateurs portables pour qu'ils doivent utiliser Kerberos avec FSEDGE1." }
    - id: c
      text: { en: "Add the public IP address of FSEDGE1 to the SAN of its certificate, and have the users connect by IP address.", fr: "Ajouter l'adresse IP publique de FSEDGE1 au SAN de son certificat, et faire se connecter les utilisateurs par adresse IP." }
    - id: d
      text: { en: "Publish TCP and UDP port 88 of a domain controller on the edge firewall for the users' IP addresses.", fr: "Publier les ports TCP et UDP 88 d'un contrôleur de domaine sur le pare-feu de périmètre pour les adresses IP des utilisateurs." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Without access to a domain controller, SMB over QUIC clients fall back to NTLMv2. The KDC proxy on the file server forwards Kerberos ticket requests to an internal domain controller over HTTPS on port 443, and the Specify KDC proxy servers for Kerberos clients policy maps the AD DS realm to the external name of the server, so domain controllers stay unreachable from the internet.
    fr: |
      Sans accès à un contrôleur de domaine, les clients SMB sur QUIC se rabattent sur NTLMv2. Le proxy KDC du serveur de fichiers transfère les demandes de tickets Kerberos à un contrôleur de domaine interne en HTTPS sur le port 443, et la stratégie Specify KDC proxy servers for Kerberos clients associe le domaine AD DS au nom externe du serveur : les contrôleurs de domaine restent inaccessibles depuis Internet.
  options:
    b:
      en: |
        Blocking NTLM without a way to reach a KDC makes the connections fail instead of switching them to Kerberos.
      fr: |
        Bloquer NTLM sans moyen de joindre un centre de distribution de clés fait échouer les connexions au lieu de les faire passer à Kerberos.
    c:
      en: |
        Connecting by IP address requires NTLM, even when Kerberos is available.
      fr: |
        Une connexion par adresse IP impose NTLM, même quand Kerberos est disponible.
    d:
      en: |
        Publishing a domain controller to the internet violates the requirement.
      fr: |
        Publier un contrôleur de domaine sur Internet enfreint l'exigence.
references:
  - title: SMB over QUIC
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-over-quic
