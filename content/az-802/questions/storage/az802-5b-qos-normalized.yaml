id: az802-5b-qos-normalized
objective: "5.3.7"
type: single
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    A Hyper-V cluster stores virtual machines on Cluster Shared Volumes. All nodes run Windows Server 2025. The Storage QoS IOPS normalization size is the default value.

    A virtual machine named **VM5** has one virtual disk that is assigned a Dedicated policy with MaximumIops set to 400. The application on VM5 issues only 64-KB I/O requests, as fast as the storage allows.

    What is the maximum number of 64-KB I/O requests per second that the virtual disk of VM5 can complete?
  fr: |
    Un cluster Hyper-V stocke des machines virtuelles sur des volumes partagés de cluster. Tous les nœuds exécutent Windows Server 2025. La taille de normalisation des IOPS de la qualité de service du stockage a sa valeur par défaut.

    Une machine virtuelle nommée **VM5** possède un disque virtuel auquel est attribuée une stratégie Dedicated dont MaximumIops vaut 400. L'application de VM5 n'émet que des requêtes d'E/S de 64 Ko, aussi vite que le stockage le permet.

    Quel est le nombre maximal de requêtes d'E/S de 64 Ko par seconde que le disque virtuel de VM5 peut traiter ?
body:
  options:
    - { id: a, text: "50" }
    - { id: b, text: "100" }
    - { id: c, text: "400" }
    - { id: d, text: "3,200" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      By default, Storage QoS normalizes IOPS in 8-KB units, so each 64-KB request counts as 8 normalized IOPS. A limit of 400 normalized IOPS therefore allows 400 / 8 = 50 requests of 64 KB per second.
    fr: |
      Par défaut, la qualité de service du stockage normalise les IOPS par unités de 8 Ko : chaque requête de 64 Ko compte pour 8 IOPS normalisées. Une limite de 400 IOPS normalisées autorise donc 400 / 8 = 50 requêtes de 64 Ko par seconde.
  options:
    b:
      en: |
        This value would correspond to a 16-KB normalization size, not the 8-KB default.
      fr: |
        Cette valeur correspondrait à une taille de normalisation de 16 Ko, pas aux 8 Ko par défaut.
    c:
      en: |
        The limit is expressed in normalized IOPS, and a 64-KB request counts as more than one normalized I/O.
      fr: |
        La limite s'exprime en IOPS normalisées, et une requête de 64 Ko compte pour plus d'une E/S normalisée.
    d:
      en: |
        This value multiplies the limit by 8 instead of dividing it.
      fr: |
        Cette valeur multiplie la limite par 8 au lieu de la diviser.
references:
  - title: Storage Quality of Service
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-qos/storage-qos-overview
