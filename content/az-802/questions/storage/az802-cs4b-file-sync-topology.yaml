id: az802-cs4b-file-sync-topology
objective: "5.1.3"
type: yesno_statements
caseStudy: az802-cs4b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    You are planning the Azure File Sync deployment for FS1 and FS2. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez le déploiement d'Azure File Sync pour FS1 et FS2. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          FS1 can have a server endpoint for D:\Manuscripts in one sync group and a server endpoint for C:\Templates in another sync group.
        fr: |
          FS1 peut avoir un point de terminaison de serveur pour D:\Manuscripts dans un groupe de synchronisation et un point de terminaison de serveur pour C:\Templates dans un autre groupe de synchronisation.
    - id: s2
      text:
        en: |
          You can enable cloud tiering on the server endpoint for C:\Templates to free space on FS1.
        fr: |
          Vous pouvez activer la hiérarchisation cloud sur le point de terminaison de serveur de C:\Templates pour libérer de l'espace sur FS1.
    - id: s3
      text:
        en: |
          You can register FS2 with the Storage Sync Service of FS1 and with a second Storage Sync Service that a London team manages.
        fr: |
          Vous pouvez inscrire FS2 auprès du service de synchronisation de stockage de FS1 et auprès d'un second service de synchronisation de stockage géré par une équipe de Londres.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A server can have server endpoints in several sync groups as long as each uses a different path, and a sync group accepts only one server endpoint per registered server. Server endpoints on the system volume, here C:, cannot use cloud tiering. A server can be registered with only one Storage Sync Service, and servers registered with different Storage Sync Services cannot sync with each other.
    fr: |
      Un serveur peut avoir des points de terminaison de serveur dans plusieurs groupes de synchronisation, à condition que chacun utilise un chemin différent, et un groupe de synchronisation n'accepte qu'un point de terminaison de serveur par serveur inscrit. Les points de terminaison de serveur du volume système, ici C:, ne peuvent pas utiliser la hiérarchisation cloud. Un serveur ne peut être inscrit qu'auprès d'un seul service de synchronisation de stockage, et des serveurs inscrits auprès de services différents ne peuvent pas se synchroniser entre eux.
references:
  - title: Deploy Azure File Sync
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide
