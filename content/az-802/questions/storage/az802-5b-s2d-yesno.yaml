id: az802-5b-s2d-yesno
objective: "5.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a three-node failover cluster named **Cluster2** that runs Windows Server 2025 Datacenter. Storage Spaces Direct is enabled on Cluster2, and each node has the same number and type of drives.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un cluster de basculement à trois nœuds nommé **Cluster2** qui exécute Windows Server 2025 Datacenter. Les espaces de stockage direct sont activés sur Cluster2, et chaque nœud possède le même nombre et le même type de lecteurs.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A three-way mirror volume on Cluster2 has a storage efficiency of 33.3 %.
        fr: |
          Un volume en miroir tridirectionnel sur Cluster2 a une efficacité de stockage de 33,3 %.
    - id: s2
      text:
        en: |
          You can create a dual parity volume on Cluster2.
        fr: |
          Vous pouvez créer un volume à double parité sur Cluster2.
    - id: s3
      text:
        en: |
          New-Volume creates the virtual disk, formats the volume and adds it to Cluster Shared Volumes in one operation.
        fr: |
          New-Volume crée le disque virtuel, formate le volume et l'ajoute aux volumes partagés de cluster en une seule opération.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A three-way mirror keeps three copies of the data on three servers, so a third of the raw capacity is usable; it needs at least three servers. Dual parity needs at least four servers (fault domains), so Cluster2 can't host it. New-Volume handles the virtual disk, partition, formatting and Cluster Shared Volume steps together.
    fr: |
      Un miroir tridirectionnel conserve trois copies des données sur trois serveurs : un tiers de la capacité brute est utilisable ; il nécessite au moins trois serveurs. La double parité nécessite au moins quatre serveurs (domaines d'erreur) : Cluster2 ne peut donc pas l'héberger. New-Volume réalise ensemble les étapes de disque virtuel, de partition, de formatage et de volume partagé de cluster.
references:
  - title: Fault tolerance and storage efficiency on Azure Local and Windows Server clusters
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/fault-tolerance
  - title: Deploy Storage Spaces Direct on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/deploy-storage-spaces-direct
