id: az802-5a-files-ssd-zrs-account
objective: "5.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You need to create a storage account named **fabrikamfs01** in West Europe and a classic file share named **engineering** that two Windows Server file servers will sync by using Azure File Sync. The solution must meet the following requirements:

    - The share uses SSD media.
    - The share stays available if one availability zone of the region fails.
    - Storage, IOPS and throughput are provisioned and billed separately (provisioned v2).

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer un compte de stockage nommé **fabrikamfs01** dans la région West Europe et un partage de fichiers classique nommé **engineering** que deux serveurs de fichiers Windows Server synchroniseront à l'aide d'Azure File Sync. La solution doit répondre aux exigences suivantes :

    - Le partage utilise un support SSD.
    - Le partage reste disponible si une zone de disponibilité de la région tombe en panne.
    - Le stockage, les IOPS et le débit sont provisionnés et facturés séparément (provisionné v2).

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    New-AzStorageAccount -ResourceGroupName RG-Files -Name fabrikamfs01 -Location westeurope `
      -Kind [[kind]] -SkuName [[sku]] -EnableHttpsTrafficOnly $true -MinimumTlsVersion TLS1_2
    New-AzRmStorageShare -ResourceGroupName RG-Files -StorageAccountName fabrikamfs01 `
      -Name engineering -QuotaGiB 2048 -EnabledProtocol [[proto]]
  slots:
    - id: kind
      options:
        - { id: filestorage, text: FileStorage }
        - { id: storagev2, text: StorageV2 }
        - { id: blockblob, text: BlockBlobStorage }
    - id: sku
      options:
        - { id: premv2zrs, text: PremiumV2_ZRS }
        - { id: premzrs, text: Premium_ZRS }
        - { id: premv2lrs, text: PremiumV2_LRS }
        - { id: stdv2zrs, text: StandardV2_ZRS }
    - id: proto
      options:
        - { id: smb, text: SMB }
        - { id: nfs, text: NFS }
answer:
  values: { kind: filestorage, sku: premv2zrs, proto: smb }
explanation:
  correct:
    en: "Provisioned file shares require a FileStorage account. PremiumV2_ZRS combines SSD media, provisioned v2 billing and zone-redundant storage, which survives the loss of one availability zone. Azure File Sync syncs only SMB classic file shares, so the share uses the SMB protocol."
    fr: "Les partages de fichiers provisionnés exigent un compte FileStorage. PremiumV2_ZRS combine un support SSD, la facturation provisionnée v2 et le stockage redondant interzone, qui résiste à la perte d'une zone de disponibilité. Azure File Sync ne synchronise que des partages de fichiers classiques SMB : le partage utilise donc le protocole SMB."
  options:
    storagev2: { en: "StorageV2 accounts host only pay-as-you-go HDD file shares.", fr: "Les comptes StorageV2 n'hébergent que des partages de fichiers HDD avec paiement à l'utilisation." }
    blockblob: { en: "BlockBlobStorage accounts are for premium block blobs, not file shares.", fr: "Les comptes BlockBlobStorage servent aux objets blob de blocs Premium, pas aux partages de fichiers." }
    premzrs: { en: "Premium_ZRS is SSD provisioned v1, where IOPS and throughput follow the provisioned size.", fr: "Premium_ZRS correspond au SSD provisionné v1, où les IOPS et le débit dépendent de la taille provisionnée." }
    premv2lrs: { en: "LRS keeps all copies in one datacenter, so a zone failure can make the share unavailable.", fr: "LRS conserve toutes les copies dans un seul centre de données : une panne de zone peut rendre le partage indisponible." }
    stdv2zrs: { en: "StandardV2 SKUs are HDD provisioned v2, not SSD.", fr: "Les références SKU StandardV2 correspondent au HDD provisionné v2, pas au SSD." }
    nfs: { en: "Azure File Sync does not support NFS file shares.", fr: "Azure File Sync ne prend pas en charge les partages de fichiers NFS." }
references:
  - title: Create a classic file share - Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/create-classic-file-share
  - title: Plan an Azure File Sync deployment
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-planning
