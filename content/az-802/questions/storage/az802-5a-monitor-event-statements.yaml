id: az802-5a-monitor-event-statements
objective: "5.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    On a server named **FS2**, the Telemetry event log of Azure File Sync contains the following event for the last upload session of the server endpoint D:\Docs:

    ```text
    Event ID: 9102
    HResult = 0
    PerItemErrorCount = 12
    AppliedFileCount = 4518
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Sur un serveur nommé **FS2**, le journal des événements Telemetry d'Azure File Sync contient l'événement suivant pour la dernière session de chargement du point de terminaison de serveur D:\Docs :

    ```text
    Event ID: 9102
    HResult = 0
    PerItemErrorCount = 12
    AppliedFileCount = 4518
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The sync session completed successfully.
        fr: |
          La session de synchronisation s'est terminée avec succès.
    - id: s2
      text:
        en: |
          Every file changed in D:\Docs since the previous session was uploaded to the Azure file share.
        fr: |
          Chaque fichier modifié dans D:\Docs depuis la session précédente a été chargé dans le partage de fichiers Azure.
    - id: s3
      text:
        en: |
          Event ID 9121 entries logged after the session identify the errors that affect the files that failed to sync.
        fr: |
          Les événements 9121 journalisés après la session identifient les erreurs qui touchent les fichiers non synchronisés.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Event ID 9102 marks the end of a sync session, and HResult = 0 means that the session succeeded. A non-zero PerItemErrorCount means that some items, here 12, failed to sync while the others were applied. Event ID 9121 is logged for each per-item error once the session completes, with persistent and transient counts, and the portal shows these errors in the server endpoint properties.
    fr: |
      L'événement 9102 marque la fin d'une session de synchronisation, et HResult = 0 signifie que la session a réussi. Un PerItemErrorCount non nul signifie que certains éléments, ici 12, n'ont pas pu être synchronisés alors que les autres ont été appliqués. L'événement 9121 est journalisé pour chaque erreur par élément à la fin de la session, avec des compteurs persistants et temporaires, et le portail affiche ces erreurs dans les propriétés du point de terminaison de serveur.
references:
  - title: Monitor Azure File Sync
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-monitoring
