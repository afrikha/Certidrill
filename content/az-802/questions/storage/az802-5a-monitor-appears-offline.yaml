id: az802-5a-monitor-appears-offline
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In the Storage Sync Service **sss-fabrikam**, the registered server **FS3** shows the state **Appears Offline**. The other registered servers of the same site are healthy, and no network change was made.

    What should you check first on FS3?
  fr: |
    Dans le service de synchronisation de stockage **sss-fabrikam**, le serveur inscrit **FS3** affiche l'état **Appears Offline**. Les autres serveurs inscrits du même site sont sains, et aucune modification réseau n'a été effectuée.

    Que devez-vous vérifier en premier sur FS3 ?
body:
  options:
    - { id: a, text: { en: "Whether Event ID 9121 lists per-item errors in the Telemetry log", fr: "Si l'événement 9121 indique des erreurs par élément dans le journal Telemetry" } }
    - { id: b, text: { en: "Whether outbound TCP port 445 to the storage account is open", fr: "Si le port TCP 445 sortant vers le compte de stockage est ouvert" } }
    - { id: c, text: { en: "Whether cloud tiering is enabled on its server endpoints", fr: "Si la hiérarchisation cloud est activée sur ses points de terminaison de serveur" } }
    - { id: d, text: { en: "Whether the AzureStorageSyncMonitor.exe process is running", fr: "Si le processus AzureStorageSyncMonitor.exe est en cours d'exécution" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A registered server shows Appears Offline when the Storage Sync Monitor process (AzureStorageSyncMonitor.exe) is not running or the server cannot reach the Azure File Sync service. Because the network did not change and the other servers are healthy, the monitor process on FS3 is the first thing to check.
    fr: |
      Un serveur inscrit affiche Appears Offline quand le processus Storage Sync Monitor (AzureStorageSyncMonitor.exe) ne s'exécute pas ou que le serveur ne peut pas joindre le service Azure File Sync. Comme le réseau n'a pas changé et que les autres serveurs sont sains, le processus de supervision de FS3 est le premier point à vérifier.
  options:
    a:
      en: |
        Event ID 9121 describes files that failed to sync during a session; per-item errors do not make the whole server appear offline.
      fr: |
        L'événement 9121 décrit les fichiers qui n'ont pas pu être synchronisés pendant une session ; des erreurs par élément ne font pas apparaître tout le serveur hors connexion.
    b:
      en: |
        The agent communicates with the service and the share over HTTPS on port 443, not SMB.
      fr: |
        L'agent communique avec le service et le partage en HTTPS sur le port 443, pas en SMB.
    c:
      en: |
        Cloud tiering settings affect local caching, not the online state of the registered server.
      fr: |
        Les paramètres de hiérarchisation cloud concernent le cache local, pas l'état en ligne du serveur inscrit.
references:
  - title: Monitor Azure File Sync
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-monitoring
