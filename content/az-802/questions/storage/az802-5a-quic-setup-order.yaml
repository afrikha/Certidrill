id: az802-5a-quic-setup-order
objective: "5.2.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A domain-joined file server named **FSEDGE1** runs Windows Server 2025 Standard. Remote users reach it at fsedge1.contoso.com from Windows 11 devices. The edge firewall and Windows Firewall already allow UDP port 443 inbound to FSEDGE1.

    You need to configure SMB over QUIC on FSEDGE1 and confirm that a client connects over QUIC.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un serveur de fichiers joint au domaine nommé **FSEDGE1** exécute Windows Server 2025 Standard. Les utilisateurs distants le joignent à l'adresse fsedge1.contoso.com depuis des appareils Windows 11. Le pare-feu de périmètre et le Pare-feu Windows autorisent déjà le port UDP 443 entrant vers FSEDGE1.

    Vous devez configurer SMB sur QUIC sur FSEDGE1 et vérifier qu'un client se connecte par QUIC.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: cert, text: { en: "Install in the computer store of FSEDGE1 a CA-issued certificate with the Server Authentication EKU and the SAN fsedge1.contoso.com.", fr: "Installer dans le magasin de l'ordinateur de FSEDGE1 un certificat émis par une autorité de certification avec l'utilisation améliorée de la clé Server Authentication et le SAN fsedge1.contoso.com." } }
    - { id: map, text: { en: "Run New-SmbServerCertificateMapping on FSEDGE1 with the thumbprint of the certificate.", fr: "Exécuter New-SmbServerCertificateMapping sur FSEDGE1 avec l'empreinte du certificat." } }
    - { id: client, text: { en: "On a Windows 11 device, run New-SmbMapping with -TransportType QUIC for a share of fsedge1.contoso.com.", fr: "Sur un appareil Windows 11, exécuter New-SmbMapping avec -TransportType QUIC pour un partage de fsedge1.contoso.com." } }
    - { id: wac, text: { en: "Enable SMB over QUIC on FSEDGE1 from the Files & file sharing tool of Windows Admin Center.", fr: "Activer SMB sur QUIC sur FSEDGE1 à partir de l'outil Files & file sharing de Windows Admin Center." } }
    - { id: tcp445, text: { en: "Allow TCP port 445 inbound to FSEDGE1 on the edge firewall.", fr: "Autoriser le port TCP 445 entrant vers FSEDGE1 sur le pare-feu de périmètre." } }
    - { id: ipsan, text: { en: "Add the public IP address of FSEDGE1 to the SAN of the certificate.", fr: "Ajouter l'adresse IP publique de FSEDGE1 au SAN du certificat." } }
answer:
  sequence: [ cert, map, client ]
explanation:
  correct:
    en: |
      SMB over QUIC needs a certificate with the Server Authentication EKU and a SAN entry for each DNS name that clients use. On Windows Server 2025, you enable it with PowerShell by mapping the certificate thumbprint with New-SmbServerCertificateMapping. Clients try TCP first by default, so New-SmbMapping -TransportType QUIC (or NET USE /TRANSPORT:QUIC) forces and confirms a QUIC connection.
    fr: |
      SMB sur QUIC exige un certificat avec l'utilisation améliorée de la clé Server Authentication et une entrée SAN pour chaque nom DNS utilisé par les clients. Sur Windows Server 2025, vous l'activez avec PowerShell en mappant l'empreinte du certificat avec New-SmbServerCertificateMapping. Les clients essaient d'abord TCP par défaut : New-SmbMapping -TransportType QUIC (ou NET USE /TRANSPORT:QUIC) force et confirme une connexion QUIC.
  options:
    wac: { en: "The Windows Admin Center method is not currently supported for Windows Server 2025; use PowerShell.", fr: "La méthode Windows Admin Center n'est actuellement pas prise en charge pour Windows Server 2025 : utilisez PowerShell." }
    tcp445: { en: "TCP port 445 must not be allowed inbound to an SMB over QUIC server from the internet.", fr: "Le port TCP 445 ne doit pas être autorisé en entrée depuis Internet vers un serveur SMB sur QUIC." }
    ipsan: { en: "IP addresses should not be used as SANs for SMB over QUIC; they force NTLM.", fr: "Les adresses IP ne doivent pas être utilisées comme SAN pour SMB sur QUIC ; elles imposent NTLM." }
references:
  - title: SMB over QUIC
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-over-quic
