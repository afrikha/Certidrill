id: az802-5a-dfsr-final-tiering
objective: "5.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You finished migrating a DFS Replication deployment to Azure File Sync. The server endpoints for D:\Projects on **FS1**, **FS2** and **FS3** sync without errors, cloud tiering is disabled on all of them, and DFS Replication is retired.

    Volume D: on FS2 is now 92 percent full. Users of FS2 must keep seeing every file and folder of D:\Projects.

    What should you do?
  fr: |
    Vous avez terminé la migration d'un déploiement de réplication DFS vers Azure File Sync. Les points de terminaison de serveur de D:\Projects sur **FS1**, **FS2** et **FS3** se synchronisent sans erreur, la hiérarchisation cloud est désactivée sur chacun d'eux, et la réplication DFS est mise hors service.

    Le volume D: de FS2 est maintenant plein à 92 %. Les utilisateurs de FS2 doivent continuer à voir chaque fichier et chaque dossier de D:\Projects.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the local cache mode of the FS2 server endpoint to DownloadNewAndModifiedFiles.", fr: "Définir le mode de cache local du point de terminaison de serveur de FS2 sur DownloadNewAndModifiedFiles." } }
    - { id: b, text: { en: "Run Invoke-StorageSyncFileRecall on FS2 for D:\\Projects.", fr: "Exécuter Invoke-StorageSyncFileRecall sur FS2 pour D:\\Projects." } }
    - { id: c, text: { en: "Delete the server endpoint of FS2 and keep the local files.", fr: "Supprimer le point de terminaison de serveur de FS2 et conserver les fichiers locaux." } }
    - { id: d, text: { en: "Enable cloud tiering on the server endpoint of FS2 with a volume free space policy.", fr: "Activer la hiérarchisation cloud sur le point de terminaison de serveur de FS2 avec une stratégie d'espace libre sur le volume." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Cloud tiering is the last step of a DFS Replication migration and can now be enabled on any server endpoint. It keeps the whole namespace on FS2 but replaces the content of cool files with pointers to the Azure file share, and the volume free space policy keeps the requested percentage of D: free.
    fr: |
      La hiérarchisation cloud est la dernière étape d'une migration de la réplication DFS et peut maintenant être activée sur n'importe quel point de terminaison de serveur. Elle conserve tout l'espace de noms sur FS2 mais remplace le contenu des fichiers peu utilisés par des pointeurs vers le partage de fichiers Azure, et la stratégie d'espace libre sur le volume maintient le pourcentage demandé d'espace libre sur D:.
  options:
    a:
      en: |
        Proactive recall downloads more files from the Azure file share, which uses more space on D:.
      fr: |
        Le rappel proactif télécharge davantage de fichiers depuis le partage de fichiers Azure, ce qui consomme plus d'espace sur D:.
    b:
      en: |
        Recalling files downloads tiered content back to the server, which uses more space.
      fr: |
        Le rappel de fichiers rapatrie sur le serveur du contenu hiérarchisé, ce qui consomme plus d'espace.
    c:
      en: |
        Without a server endpoint, FS2 no longer syncs, so its users stop seeing changes made on the other servers.
      fr: |
        Sans point de terminaison de serveur, FS2 ne se synchronise plus : ses utilisateurs ne voient plus les modifications faites sur les autres serveurs.
references:
  - title: Deploy Azure File Sync
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide
  - title: Understand Azure File Sync Cloud Tiering
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-cloud-tiering-overview
