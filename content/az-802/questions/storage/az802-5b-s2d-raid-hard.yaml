id: az802-5b-s2d-raid-hard
objective: "5.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have four servers named **N1**, **N2**, **N3** and **N4** that run Windows Server 2025 Datacenter. The servers were previously used as stand-alone file servers. You create a failover cluster named **S2D2** by running `New-Cluster -NoStorage`.

    The following table shows the data drives that Windows reports on each server.

    | Server | Data drives reported by Windows |
    | --- | --- |
    | N1 | Four SSDs, bus type SAS, partition style RAW |
    | N2 | Four SSDs, bus type SAS, each with partitions from the earlier deployment |
    | N3 | One logical disk, bus type RAID |
    | N4 | Four SSDs, bus type SAS, partition style RAW |

    You need to ensure that `Enable-ClusterStorageSpacesDirect` can claim four drives from every server.

    What should you do before you run the cmdlet?
  fr: |
    Vous disposez de quatre serveurs nommés **N1**, **N2**, **N3** et **N4** qui exécutent Windows Server 2025 Datacenter. Les serveurs étaient auparavant des serveurs de fichiers autonomes. Vous créez un cluster de basculement nommé **S2D2** en exécutant `New-Cluster -NoStorage`.

    Le tableau suivant présente les lecteurs de données signalés par Windows sur chaque serveur.

    | Serveur | Lecteurs de données signalés par Windows |
    | --- | --- |
    | N1 | Quatre SSD, type de bus SAS, style de partition RAW |
    | N2 | Quatre SSD, type de bus SAS, chacun avec des partitions du déploiement précédent |
    | N3 | Un disque logique, type de bus RAID |
    | N4 | Quatre SSD, type de bus SAS, style de partition RAW |

    Vous devez faire en sorte que `Enable-ClusterStorageSpacesDirect` puisse prendre en charge quatre lecteurs sur chaque serveur.

    Que devez-vous faire avant d'exécuter la cmdlet ?
body:
  options:
    - { id: a, text: { en: "Run Clear-Disk -RemoveData -RemoveOEM on the data drives of N2 and N3.", fr: "Exécuter Clear-Disk -RemoveData -RemoveOEM sur les lecteurs de données de N2 et N3." } }
    - { id: b, text: { en: "Set the storage controller of N3 to HBA pass-through mode, and initialize the data drives of N2 as GPT.", fr: "Configurer le contrôleur de stockage de N3 en mode HBA direct, et initialiser les lecteurs de données de N2 en GPT." } }
    - { id: c, text: { en: "Set the storage controller of N3 to HBA pass-through mode, and run Clear-Disk -RemoveData -RemoveOEM on the data drives of N2.", fr: "Configurer le contrôleur de stockage de N3 en mode HBA direct, et exécuter Clear-Disk -RemoveData -RemoveOEM sur les lecteurs de données de N2." } }
    - { id: d, text: { en: "Create a storage pool on N2 and N3 by using New-StoragePool, and add the pools to the cluster.", fr: "Créer un pool de stockage sur N2 et N3 avec New-StoragePool, puis ajouter les pools au cluster." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Two separate problems block the deployment. Storage Spaces Direct doesn't support RAID controllers that hide the physical drives, so N3 must present its four SSDs through a controller in simple pass-through mode. Drives that still carry partitions aren't eligible, so the drives of N2 must be cleaned (the deployment script runs Clear-Disk -RemoveData -RemoveOEM on every non-boot drive that isn't RAW).
    fr: |
      Deux problèmes distincts bloquent le déploiement. Les espaces de stockage direct ne prennent pas en charge les contrôleurs RAID qui masquent les lecteurs physiques : N3 doit présenter ses quatre SSD par un contrôleur en mode direct simple. Les lecteurs qui contiennent encore des partitions ne sont pas éligibles : les lecteurs de N2 doivent être nettoyés (le script de déploiement exécute Clear-Disk -RemoveData -RemoveOEM sur chaque lecteur non RAW autre que celui de démarrage).
  options:
    a:
      en: |
        Clearing the RAID logical disk of N3 doesn't expose its physical drives; the controller still hides them.
      fr: |
        Effacer le disque logique RAID de N3 n'expose pas ses lecteurs physiques ; le contrôleur continue de les masquer.
    b:
      en: |
        Initializing the N2 drives leaves them with a partition style other than RAW and doesn't remove the old partitions; the drives must be cleaned instead.
      fr: |
        Initialiser les lecteurs de N2 leur laisse un style de partition autre que RAW et ne supprime pas les anciennes partitions ; les lecteurs doivent plutôt être nettoyés.
    d:
      en: |
        Storage Spaces Direct builds one pool for the whole cluster; per-server pools can't be added to it.
      fr: |
        Les espaces de stockage direct construisent un pool unique pour tout le cluster ; des pools par serveur ne peuvent pas y être ajoutés.
references:
