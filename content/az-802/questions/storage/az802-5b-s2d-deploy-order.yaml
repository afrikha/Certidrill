id: az802-5b-s2d-deploy-order
objective: "5.3.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have four servers named **N1**, **N2**, **N3** and **N4** that run Windows Server 2025 Datacenter and are joined to the contoso.com domain. The Failover Clustering and Hyper-V features are installed on each server. The RDMA network is configured, and every drive other than the boot drive is clean.

    You need to deploy a hyperconverged Storage Spaces Direct cluster named **S2D1** and create its first volume.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez de quatre serveurs nommés **N1**, **N2**, **N3** et **N4** qui exécutent Windows Server 2025 Datacenter et sont joints au domaine contoso.com. Les fonctionnalités Clustering de basculement et Hyper-V sont installées sur chaque serveur. Le réseau RDMA est configuré, et tous les lecteurs autres que le lecteur de démarrage sont vierges.

    Vous devez déployer un cluster d'espaces de stockage direct hyperconvergé nommé **S2D1** et créer son premier volume.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: test, text: { en: "Run Test-Cluster and include the Storage Spaces Direct, Inventory, Network and System Configuration tests.", fr: "Exécuter Test-Cluster en incluant les tests Storage Spaces Direct, Inventory, Network et System Configuration." } }
    - { id: cluster, text: { en: "Run New-Cluster with the -NoStorage parameter.", fr: "Exécuter New-Cluster avec le paramètre -NoStorage." } }
    - { id: enable, text: { en: "Run Enable-ClusterStorageSpacesDirect.", fr: "Exécuter Enable-ClusterStorageSpacesDirect." } }
    - { id: volume, text: { en: "Run New-Volume to create a volume in the pool.", fr: "Exécuter New-Volume pour créer un volume dans le pool." } }
    - { id: pool, text: { en: "Run New-StoragePool on each server to pool its local drives.", fr: "Exécuter New-StoragePool sur chaque serveur pour regrouper ses lecteurs locaux." } }
    - { id: adddisk, text: { en: "Run Get-ClusterAvailableDisk | Add-ClusterDisk.", fr: "Exécuter Get-ClusterAvailableDisk | Add-ClusterDisk." } }
    - { id: raid, text: { en: "Create a RAID 1 logical drive from the capacity drives of each server.", fr: "Créer un lecteur logique RAID 1 à partir des lecteurs de capacité de chaque serveur." } }
answer:
  sequence: [ test, cluster, enable, volume ]
explanation:
  correct:
    en: |
      You validate the servers with the Storage Spaces Direct tests, create the cluster without storage, and then enable Storage Spaces Direct, which builds a single pool from the eligible drives of all nodes, configures the cache and creates the default tiers. New-Volume then creates the virtual disk, partitions and formats it, and adds it to Cluster Shared Volumes.
    fr: |
      Vous validez les serveurs avec les tests Storage Spaces Direct, créez le cluster sans stockage, puis activez les espaces de stockage direct, qui construisent un pool unique à partir des lecteurs éligibles de tous les nœuds, configurent le cache et créent les niveaux par défaut. New-Volume crée ensuite le disque virtuel, le partitionne, le formate et l'ajoute aux volumes partagés de cluster.
  options:
    pool:
      en: |
        Enable-ClusterStorageSpacesDirect creates one pool that spans all the nodes; per-server pools aren't used.
      fr: |
        Enable-ClusterStorageSpacesDirect crée un pool unique qui couvre tous les nœuds ; aucun pool par serveur n'est utilisé.
    adddisk:
      en: |
        Local drives aren't added as cluster disks; the cluster is created without storage so that Storage Spaces Direct claims them.
      fr: |
        Les lecteurs locaux ne sont pas ajoutés comme disques de cluster ; le cluster est créé sans stockage pour que les espaces de stockage direct les prennent en charge.
    raid:
      en: |
        Storage Spaces Direct needs drives presented directly through an HBA in pass-through mode, not RAID logical drives.
      fr: |
        Les espaces de stockage direct ont besoin de lecteurs présentés directement par un HBA en mode direct, pas de lecteurs logiques RAID.
references:
  - title: Deploy Storage Spaces Direct on Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/deploy-storage-spaces-direct
