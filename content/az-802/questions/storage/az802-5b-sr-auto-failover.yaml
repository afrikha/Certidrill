id: az802-5b-sr-auto-failover
objective: "5.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has two datacenters named **Paris** and **Lyon**. Each datacenter has two servers that run Windows Server 2025 Datacenter and its own SAN.

    You need to replicate the volumes of a clustered file server between the datacenters by using Storage Replica. If the Paris datacenter fails, the file server role must fail over to Lyon automatically.

    Which Storage Replica scenario should you implement?
  fr: |
    Contoso possède deux centres de données nommés **Paris** et **Lyon**. Chaque centre de données dispose de deux serveurs qui exécutent Windows Server 2025 Datacenter et de son propre SAN.

    Vous devez répliquer les volumes d'un serveur de fichiers en cluster entre les centres de données à l'aide du réplica de stockage. En cas de panne du centre de données de Paris, le rôle de serveur de fichiers doit basculer automatiquement vers Lyon.

    Quel scénario de réplica de stockage devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "Stretch cluster replication", fr: "Réplication de cluster étendu" } }
    - { id: b, text: { en: "Cluster-to-cluster replication", fr: "Réplication de cluster à cluster" } }
    - { id: c, text: { en: "Server-to-server replication", fr: "Réplication de serveur à serveur" } }
    - { id: d, text: { en: "Server-to-self replication", fr: "Réplication d'un serveur vers lui-même" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In a stretch cluster, the nodes of both sites belong to one failover cluster and Storage Replica replicates between the two sets of storage, so the cluster can fail the workload over automatically. Cluster-to-cluster and server-to-server replication require a manual failover.
    fr: |
      Dans un cluster étendu, les nœuds des deux sites appartiennent à un même cluster de basculement et le réplica de stockage réplique entre les deux ensembles de stockage ; le cluster peut donc basculer automatiquement la charge de travail. La réplication de cluster à cluster et de serveur à serveur exige un basculement manuel.
  options:
    c:
      en: |
        Server-to-server replication protects stand-alone servers and needs a manual failover.
      fr: |
        La réplication de serveur à serveur protège des serveurs autonomes et exige un basculement manuel.
    b:
      en: |
        Cluster-to-cluster replication uses two separate clusters, and failover between them is manual.
      fr: |
        La réplication de cluster à cluster utilise deux clusters distincts, et le basculement entre eux est manuel.
    d:
      en: |
        Server-to-self replication copies volumes within one computer, so it can't protect against the loss of a datacenter.
      fr: |
        La réplication d'un serveur vers lui-même copie des volumes au sein d'un seul ordinateur : elle ne peut pas protéger contre la perte d'un centre de données.
references:
  - title: Storage Replica overview
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-replica/storage-replica-overview
