id: az802-5a-smb-hardening-ps
objective: "5.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A file server named **FS2** runs Windows Server 2025. You need to configure the SMB server of FS2 to meet the following requirements:

    - Reject connections that negotiate a dialect older than SMB 3.1.1.
    - Require signing on all inbound SMB connections.
    - Wait 5 seconds after each failed NTLM authentication attempt before responding, to slow down password guessing.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur de fichiers nommé **FS2** exécute Windows Server 2025. Vous devez configurer le serveur SMB de FS2 pour répondre aux exigences suivantes :

    - Rejeter les connexions qui négocient un dialecte antérieur à SMB 3.1.1.
    - Exiger la signature sur toutes les connexions SMB entrantes.
    - Attendre 5 secondes après chaque tentative d'authentification NTLM échouée avant de répondre, pour ralentir la recherche de mots de passe.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Set-SmbServerConfiguration [[dialect]] SMB311 [[signing]] $true [[delay]] 5000 -Force
  slots:
    - id: dialect
      options:
        - { id: max, text: -Smb2DialectMax }
        - { id: min, text: -Smb2DialectMin }
        - { id: enable2, text: -EnableSMB2Protocol }
    - id: signing
      options:
        - { id: enablesig, text: -EnableSecuritySignature }
        - { id: encrypt, text: -EncryptData }
        - { id: requiresig, text: -RequireSecuritySignature }
    - id: delay
      options:
        - { id: invalid, text: -InvalidAuthenticationDelayTimeInMs }
        - { id: pending, text: -PendingClientTimeoutInSeconds }
        - { id: durable, text: -DurableHandleV2TimeoutInSeconds }
answer:
  values: { dialect: min, signing: requiresig, delay: invalid }
explanation:
  correct:
    en: "-Smb2DialectMin SMB311 sets the minimum dialect, which blocks older SMB 2 and SMB 3 dialects; setting a minimum of 3.1.1 effectively also makes it the maximum. -RequireSecuritySignature $true on the server requires signing for inbound connections. The SMB authentication rate limiter is set with -InvalidAuthenticationDelayTimeInMs, in milliseconds (multiples of 100 from 0 to 10000, default 2000)."
    fr: "-Smb2DialectMin SMB311 définit le dialecte minimal, ce qui bloque les dialectes SMB 2 et SMB 3 plus anciens ; un minimum de 3.1.1 en fait aussi, de fait, le maximum. -RequireSecuritySignature $true sur le serveur exige la signature des connexions entrantes. Le limiteur de débit d'authentification SMB se règle avec -InvalidAuthenticationDelayTimeInMs, en millisecondes (multiples de 100 entre 0 et 10000, 2000 par défaut)."
  options:
    max: { en: "-Smb2DialectMax only caps the highest dialect; older dialects stay allowed.", fr: "-Smb2DialectMax plafonne seulement le dialecte le plus élevé ; les dialectes plus anciens restent autorisés." }
    enable2: { en: "-EnableSMB2Protocol enables or disables the SMB2 protocol as a whole; it does not take a dialect value.", fr: "-EnableSMB2Protocol active ou désactive le protocole SMB2 dans son ensemble ; il ne prend pas de valeur de dialecte." }
    enablesig: { en: "-EnableSecuritySignature indicates whether signing is enabled; requiring signing for inbound connections is the role of -RequireSecuritySignature.", fr: "-EnableSecuritySignature indique si la signature est activée ; exiger la signature des connexions entrantes est le rôle de -RequireSecuritySignature." }
    encrypt: { en: "-EncryptData enables encryption of the server's traffic; it is not the setting that requires signing.", fr: "-EncryptData active le chiffrement du trafic du serveur ; ce n'est pas le paramètre qui exige la signature." }
    pending: { en: "-PendingClientTimeoutInSeconds is not related to failed authentication attempts.", fr: "-PendingClientTimeoutInSeconds n'a aucun rapport avec les tentatives d'authentification échouées." }
    durable: { en: "-DurableHandleV2TimeoutInSeconds sets the time-out of durable handles, not a delay after failed authentication.", fr: "-DurableHandleV2TimeoutInSeconds définit le délai d'expiration des handles durables, pas un délai après un échec d'authentification." }
references:
  - title: Manage SMB dialects in Windows and Windows Server 2025
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/manage-smb-dialects
  - title: Configure SMB authentication rate limiter for Windows
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/configure-smb-authentication-rate-limiter
