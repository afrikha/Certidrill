id: az802-5b-iscsi-features-dd
objective: "5.3.9"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A server named **ISCSI3** runs iSCSI Target Server on Windows Server 2025. Two servers named **SQL1** and **SQL2** will use a target named **SqlDisks** on ISCSI3. Each SQL server has two network adapters on the iSCSI network.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur nommé **ISCSI3** exécute le serveur cible iSCSI sur Windows Server 2025. Deux serveurs nommés **SQL1** et **SQL2** utiliseront une cible nommée **SqlDisks** sur ISCSI3. Chaque serveur SQL possède deux cartes réseau sur le réseau iSCSI.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: oneway, text: { en: "One-way CHAP", fr: "CHAP unidirectionnel" } }
    - { id: mutual, text: { en: "Mutual CHAP", fr: "CHAP mutuel" } }
    - { id: mpio, text: "Multipath I/O (MPIO)" }
    - { id: persistent, text: { en: "Persistent connection (-IsPersistent $true)", fr: "Connexion persistante (-IsPersistent $true)" } }
    - { id: initiators, text: { en: "Initiator IDs assigned to the target", fr: "ID d'initiateur attribués à la cible" } }
  targets:
    - id: auth
      text: { en: "ISCSI3 authenticates SQL1 and SQL2, and SQL1 and SQL2 authenticate ISCSI3.", fr: "ISCSI3 authentifie SQL1 et SQL2, et SQL1 et SQL2 authentifient ISCSI3." }
    - id: paths
      text: { en: "SQL1 keeps access to its disks if one of its two iSCSI network adapters fails.", fr: "SQL1 conserve l'accès à ses disques si l'une de ses deux cartes réseau iSCSI tombe en panne." }
    - id: reboot
      text: { en: "SQL2 reconnects to SqlDisks automatically after each restart.", fr: "SQL2 se reconnecte automatiquement à SqlDisks après chaque redémarrage." }
    - id: restrict
      text: { en: "Only SQL1 and SQL2 can connect to SqlDisks, based on their IQNs.", fr: "Seuls SQL1 et SQL2 peuvent se connecter à SqlDisks, d'après leur IQN." }
answer:
  mapping: { auth: mutual, paths: mpio, reboot: persistent, restrict: initiators }
explanation:
  correct:
    en: |
      Mutual CHAP adds authentication of the target by the initiator to the one-way CHAP authentication of the initiator by the target. MPIO uses several network paths to the same LUN (up to 4 paths with iSCSI Target Server). A persistent connection is restored after each restart. The initiator IDs of a target, such as IQN values, define which initiators may connect.
    fr: |
      Le CHAP mutuel ajoute l'authentification de la cible par l'initiateur à l'authentification unidirectionnelle de l'initiateur par la cible. MPIO utilise plusieurs chemins réseau vers le même LUN (jusqu'à 4 chemins avec le serveur cible iSCSI). Une connexion persistante est rétablie après chaque redémarrage. Les ID d'initiateur d'une cible, comme des valeurs IQN, définissent les initiateurs autorisés à se connecter.
  options:
    oneway:
      en: |
        One-way CHAP only lets the target authenticate the initiator.
      fr: |
        Le CHAP unidirectionnel permet seulement à la cible d'authentifier l'initiateur.
references:
  - title: Connect-IscsiTarget
    url: https://learn.microsoft.com/en-us/powershell/module/iscsi/connect-iscsitarget
  - title: iSCSI Target Server Scalability Limits
    url: https://learn.microsoft.com/en-us/windows-server/storage/iscsi/iscsi-target-server-limits
