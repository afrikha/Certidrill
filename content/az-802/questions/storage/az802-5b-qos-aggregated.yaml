id: az802-5b-qos-aggregated
objective: "5.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a Hyper-V cluster that stores virtual machines on a Scale-Out File Server named **SOFS1**. All servers run Windows Server 2025. Five SQL Server virtual machines each have one data virtual disk on SOFS1.

    You need to configure Storage QoS so that the five data disks together are guaranteed 2,000 IOPS and limited to 5,000 IOPS. Any VM must be able to use the share of the IOPS that the other VMs don't use.

    Which Storage QoS policy should you create and assign to the five data disks?
  fr: |
    Fabrikam dispose d'un cluster Hyper-V qui stocke des machines virtuelles sur un serveur de fichiers avec montée en puissance parallèle nommé **SOFS1**. Tous les serveurs exécutent Windows Server 2025. Cinq machines virtuelles SQL Server ont chacune un disque virtuel de données sur SOFS1.

    Vous devez configurer la qualité de service du stockage pour que les cinq disques de données disposent ensemble d'une garantie de 2 000 IOPS et d'une limite de 5 000 IOPS. Chaque VM doit pouvoir utiliser la part d'IOPS que les autres VM n'utilisent pas.

    Quelle stratégie de qualité de service du stockage devez-vous créer et attribuer aux cinq disques de données ?
body:
  options:
    - { id: a, text: { en: "A Dedicated policy with MinimumIops 400 and MaximumIops 1000", fr: "Une stratégie Dedicated avec MinimumIops 400 et MaximumIops 1000" } }
    - { id: b, text: { en: "A Dedicated policy with MinimumIops 2000 and MaximumIops 5000", fr: "Une stratégie Dedicated avec MinimumIops 2000 et MaximumIops 5000" } }
    - { id: c, text: { en: "An Aggregated policy with MinimumIops 400 and MaximumIops 1000", fr: "Une stratégie Aggregated avec MinimumIops 400 et MaximumIops 1000" } }
    - { id: d, text: { en: "An Aggregated policy with MinimumIops 2000 and MaximumIops 5000", fr: "Une stratégie Aggregated avec MinimumIops 2000 et MaximumIops 5000" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An Aggregated policy shares its minimum and maximum among all the virtual disks assigned to it, so the five disks together get at least 2,000 and at most 5,000 IOPS, and an idle VM leaves its share to the others.
    fr: |
      Une stratégie Aggregated partage son minimum et son maximum entre tous les disques virtuels qui lui sont attribués : les cinq disques obtiennent ensemble au moins 2 000 et au plus 5 000 IOPS, et une VM inactive laisse sa part aux autres.
  options:
    a:
      en: |
        A Dedicated policy applies the values to each disk separately; each VM would be capped at 1,000 IOPS even when the others are idle.
      fr: |
        Une stratégie Dedicated applique les valeurs à chaque disque séparément ; chaque VM serait plafonnée à 1 000 IOPS même lorsque les autres sont inactives.
    b:
      en: |
        As a Dedicated policy, these values would apply to each disk, for a total limit of 25,000 IOPS.
      fr: |
        Dans une stratégie Dedicated, ces valeurs s'appliqueraient à chaque disque, soit une limite totale de 25 000 IOPS.
    c:
      en: |
        An Aggregated policy shares the values, so the five disks together would be limited to 1,000 IOPS.
      fr: |
        Une stratégie Aggregated partage les valeurs : les cinq disques seraient ensemble limités à 1 000 IOPS.
references:
  - title: Storage Quality of Service
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-qos/storage-qos-overview
