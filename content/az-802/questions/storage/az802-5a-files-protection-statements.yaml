id: az802-5a-files-protection-statements
objective: "5.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a storage account named **fabrikamfs02** that has the following configuration:

    | Setting | Value |
    | --- | --- |
    | Kind | FileStorage |
    | SKU | StandardV2_GRS |
    | Soft delete for classic file shares | Enabled, 14 days |
    | Classic file share | records (SMB) |
    | Share snapshots of records | Created every Sunday |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un compte de stockage nommé **fabrikamfs02** dont la configuration est la suivante :

    | Paramètre | Valeur |
    | --- | --- |
    | Type | FileStorage |
    | Référence SKU | StandardV2_GRS |
    | Suppression réversible des partages de fichiers classiques | Activée, 14 jours |
    | Partage de fichiers classique | records (SMB) |
    | Instantanés de partage de records | Créés chaque dimanche |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If an administrator deletes the records share, undeleting it within 14 days also brings back its share snapshots.
        fr: |
          Si un administrateur supprime le partage records, sa restauration dans les 14 jours restaure aussi ses instantanés de partage.
    - id: s2
      text:
        en: |
          If a user deletes a file from the records share, you can recover the file from the soft-deleted items of fabrikamfs02.
        fr: |
          Si un utilisateur supprime un fichier du partage records, vous pouvez récupérer le fichier à partir des éléments supprimés de manière réversible de fabrikamfs02.
    - id: s3
      text:
        en: |
          The share snapshots of records are also stored in the paired region of the storage account.
        fr: |
          Les instantanés de partage de records sont aussi stockés dans la région jumelée du compte de stockage.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Undeleting a soft-deleted share restores the share and all its contents, including its snapshots, to their state before deletion. Soft delete works only at the share level, so individual files are recovered from share snapshots instead. Share snapshots have the same redundancy as their share, so with a geo-redundant SKU they are also stored in the paired region.
    fr: |
      La restauration d'un partage supprimé de manière réversible rétablit le partage et tout son contenu, y compris ses instantanés, dans leur état antérieur à la suppression. La suppression réversible fonctionne uniquement au niveau du partage : les fichiers individuels se récupèrent plutôt à partir des instantanés de partage. Les instantanés de partage ont la même redondance que leur partage ; avec une référence SKU géoredondante, ils sont donc aussi stockés dans la région jumelée.
references:
  - title: Azure File Share Soft Delete
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-prevent-file-share-deletion
  - title: Use Azure Files Share Snapshots
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-snapshots-files
