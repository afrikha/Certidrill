id: az802-5a-fsrm-smtp
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    On a file server named **FS2**, you create FSRM quotas from a template whose 85 percent threshold sends an email to the user and writes an entry to the event log. When users reach the threshold, the event log entries appear, but nobody has ever received the email.

    What should you configure?
  fr: |
    Sur un serveur de fichiers nommé **FS2**, vous créez des quotas FSRM à partir d'un modèle dont le seuil de 85 % envoie un e-mail à l'utilisateur et écrit une entrée dans le journal des événements. Quand les utilisateurs atteignent le seuil, les entrées du journal des événements apparaissent, mais personne n'a jamais reçu l'e-mail.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "The e-mail notification limit in the FSRM options", fr: "La limite des notifications par e-mail dans les options de FSRM" } }
    - { id: b, text: { en: "The SMTP server in the FSRM options", fr: "Le serveur SMTP dans les options de FSRM" } }
    - { id: c, text: { en: "A hard limit in the quota template", fr: "Une limite inconditionnelle dans le modèle de quota" } }
    - { id: d, text: { en: "A passive file screen on the quota paths", fr: "Un filtre de fichiers passif sur les chemins des quotas" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      FSRM sends email notifications and storage reports through an SMTP server that you must specify in the FSRM options (E-mail Notifications tab, or Set-FsrmSetting -SmtpServer). Without it, the other notification types such as event log entries work, but no email leaves the server.
    fr: |
      FSRM envoie les notifications par e-mail et les rapports de stockage par un serveur SMTP que vous devez indiquer dans les options de FSRM (onglet E-mail Notifications, ou Set-FsrmSetting -SmtpServer). Sans lui, les autres types de notification comme les entrées du journal des événements fonctionnent, mais aucun e-mail ne quitte le serveur.
  options:
    a:
      en: |
        Notification limits only space out repeated notifications; the first email would still be sent if an SMTP server were configured.
      fr: |
        Les limites de notification espacent seulement les notifications répétées ; le premier e-mail serait quand même envoyé si un serveur SMTP était configuré.
    c:
      en: |
        A hard limit blocks writes beyond the quota; it does not change how notifications are delivered.
      fr: |
        Une limite inconditionnelle bloque les écritures au-delà du quota ; elle ne change pas la manière dont les notifications sont remises.
    d:
      en: |
        A passive file screen monitors file types; it has nothing to do with quota notifications.
      fr: |
        Un filtre de fichiers passif surveille des types de fichiers ; il n'a aucun rapport avec les notifications de quota.
references:
  - title: Configure E-Mail Notifications
    url: https://learn.microsoft.com/en-us/windows-server/storage/fsrm/configure-email-notifications
