id: az802-5b-bl-csv
objective: "5.3.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a four-node failover cluster named **CL2** that runs Windows Server 2025 Datacenter. The BitLocker feature is installed on every node, and the nodes were restarted. The Cluster Shared Volume **Cluster Disk 1** is mounted at C:\ClusterStorage\Volume1, and Node1 owns it.

    You need to encrypt Cluster Disk 1 by running `Enable-BitLocker` with a recovery password protector on Node1.

    What should you do before you run Enable-BitLocker?
  fr: |
    Vous disposez d'un cluster de basculement à quatre nœuds nommé **CL2** qui exécute Windows Server 2025 Datacenter. La fonctionnalité BitLocker est installée sur chaque nœud, et les nœuds ont été redémarrés. Le volume partagé de cluster **Cluster Disk 1** est monté dans C:\ClusterStorage\Volume1, et Node1 en est le propriétaire.

    Vous devez chiffrer Cluster Disk 1 en exécutant `Enable-BitLocker` avec un protecteur de mot de passe de récupération sur Node1.

    Que devez-vous faire avant d'exécuter Enable-BitLocker ?
body:
  options:
    - { id: a, text: { en: "Take Cluster Disk 1 offline by running Stop-ClusterResource.", fr: "Mettre Cluster Disk 1 hors connexion en exécutant Stop-ClusterResource." } }
    - { id: b, text: { en: "Put Cluster Disk 1 into maintenance mode by running Suspend-ClusterResource.", fr: "Mettre Cluster Disk 1 en mode maintenance en exécutant Suspend-ClusterResource." } }
    - { id: c, text: { en: "Assign a drive letter to Cluster Disk 1 by using Disk Management on Node1.", fr: "Attribuer une lettre de lecteur à Cluster Disk 1 avec la Gestion des disques sur Node1." } }
    - { id: d, text: { en: "Drain the roles from Node1 by running Suspend-ClusterNode -Drain.", fr: "Vider les rôles de Node1 en exécutant Suspend-ClusterNode -Drain." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Before you enable BitLocker on a CSV, you put the resource into maintenance mode with Suspend-ClusterResource on the node that owns it. You then run Enable-BitLocker against the CSV mount point, store the protector ID and recovery password in the BitLockerProtectorInfo cluster parameter, and bring the resource out of maintenance mode with Resume-ClusterResource.
    fr: |
      Avant d'activer BitLocker sur un CSV, vous mettez la ressource en mode maintenance avec Suspend-ClusterResource sur le nœud qui en est propriétaire. Vous exécutez ensuite Enable-BitLocker sur le point de montage du CSV, stockez l'ID du protecteur et le mot de passe de récupération dans le paramètre de cluster BitLockerProtectorInfo, puis sortez la ressource du mode maintenance avec Resume-ClusterResource.
  options:
    a:
      en: |
        An offline disk isn't mounted, so BitLocker can't encrypt it through its mount point; the documented procedure uses maintenance mode.
      fr: |
        Un disque hors connexion n'est pas monté : BitLocker ne peut pas le chiffrer par son point de montage ; la procédure documentée utilise le mode maintenance.
    c:
      en: |
        CSVs are mount points without drive letters; you target C:\ClusterStorage\Volume1 with PowerShell or manage-bde.
      fr: |
        Les CSV sont des points de montage sans lettre de lecteur ; vous ciblez C:\ClusterStorage\Volume1 avec PowerShell ou manage-bde.
    d:
      en: |
        Draining Node1 moves its roles to other nodes and doesn't prepare the disk resource for encryption.
      fr: |
        Vider Node1 déplace ses rôles vers d'autres nœuds et ne prépare pas la ressource disque au chiffrement.
references:
  - title: Use BitLocker with Cluster Shared Volumes (CSV)
    url: https://learn.microsoft.com/en-us/windows-server/failover-clustering/bitlocker-on-csv-in-ws-2022
