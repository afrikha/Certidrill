id: az802-5a-files-port-445-blocked
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Users in a Litware branch office must map an SMB Azure file share named **docs** in a storage account named **litwarefs01**. When a user runs `Test-NetConnection -ComputerName litwarefs01.file.core.windows.net -Port 445`, the TcpTestSucceeded value is False. The internet service provider of the branch blocks outbound TCP port 445, and you cannot change provider.

    You need to enable the users to mount docs over SMB.

    What should you do?
  fr: |
    Les utilisateurs d'une succursale de Litware doivent mapper un partage de fichiers Azure SMB nommé **docs** situé dans un compte de stockage nommé **litwarefs01**. Quand un utilisateur exécute `Test-NetConnection -ComputerName litwarefs01.file.core.windows.net -Port 445`, la valeur TcpTestSucceeded est False. Le fournisseur d'accès à Internet de la succursale bloque le port TCP 445 sortant, et vous ne pouvez pas changer de fournisseur.

    Vous devez permettre aux utilisateurs de monter docs en SMB.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Disable the Secure transfer required setting of litwarefs01, and then remount docs from the branch.", fr: "Désactiver le paramètre Secure transfer required de litwarefs01, puis remonter docs depuis la succursale." } }
    - { id: b, text: { en: "Mount docs by using the storage account key of litwarefs01 instead of an AD DS identity.", fr: "Monter docs avec la clé du compte de stockage litwarefs01 au lieu d'une identité AD DS." } }
    - { id: c, text: { en: "Enable large file shares on litwarefs01, and then remount docs from the branch.", fr: "Activer le paramètre Large file shares sur litwarefs01, puis remonter docs depuis la succursale." } }
    - { id: d, text: { en: "Connect the branch to Azure by using a site-to-site VPN, and reach docs through a private endpoint.", fr: "Connecter la succursale à Azure par un VPN site à site et accéder à docs par un point de terminaison privé." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      SMB requires TCP port 445, and connections fail when the ISP blocks it. To mount the share from outside Azure without opening port 445 to the internet, you tunnel the SMB traffic over a VPN (point-to-site or site-to-site) or ExpressRoute, typically with a private endpoint for the storage account.
    fr: |
      SMB exige le port TCP 445, et les connexions échouent quand le fournisseur d'accès le bloque. Pour monter le partage depuis l'extérieur d'Azure sans ouvrir le port 445 vers Internet, vous faites passer le trafic SMB dans un VPN (point à site ou site à site) ou ExpressRoute, généralement avec un point de terminaison privé pour le compte de stockage.
  options:
    a:
      en: |
        Secure transfer controls encryption requirements; the traffic still uses TCP port 445, which stays blocked.
      fr: |
        Le transfert sécurisé contrôle les exigences de chiffrement ; le trafic utilise toujours le port TCP 445, qui reste bloqué.
    b:
      en: |
        The authentication method does not change the port; a key-based mount also uses TCP port 445.
      fr: |
        La méthode d'authentification ne change pas le port : un montage avec la clé utilise aussi le port TCP 445.
    c:
      en: |
        Large file shares raise the capacity limit of pay-as-you-go shares; they have no effect on the network port.
      fr: |
        Les partages de fichiers volumineux augmentent la limite de capacité des partages avec paiement à l'utilisation ; ils n'ont aucun effet sur le port réseau.
references:
  - title: Mount SMB Azure File Share on Windows
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-how-to-use-files-windows
