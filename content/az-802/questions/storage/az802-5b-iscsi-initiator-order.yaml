id: az802-5b-iscsi-initiator-order
objective: "5.3.9"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A server named **ISCSI1** runs iSCSI Target Server on Windows Server 2025 and listens on 10.0.10.5. On ISCSI1, a target named **AppDisks** lists the IQN of a server named **APP1** as an allowed initiator, and an iSCSI virtual disk is mapped to AppDisks.

    APP1 runs Windows Server 2025. The Microsoft iSCSI Initiator service on APP1 is running and set to start automatically. On APP1, new disks are presented offline, and the LUN will appear as disk 4.

    You need APP1 to use the iSCSI virtual disk as a GPT disk, and the connection must be restored automatically after each restart of APP1.

    Which four commands should you run on APP1 in sequence? To answer, move the appropriate commands from the list of commands to the answer area and arrange them in the correct order.
  fr: |
    Un serveur nommé **ISCSI1** exécute le serveur cible iSCSI sur Windows Server 2025 et écoute sur 10.0.10.5. Sur ISCSI1, une cible nommée **AppDisks** répertorie l'IQN d'un serveur nommé **APP1** comme initiateur autorisé, et un disque virtuel iSCSI est mappé à AppDisks.

    APP1 exécute Windows Server 2025. Le service Initiateur iSCSI de Microsoft d'APP1 est démarré et configuré pour démarrer automatiquement. Sur APP1, les nouveaux disques sont présentés hors connexion, et le LUN apparaîtra comme disque 4.

    APP1 doit utiliser le disque virtuel iSCSI comme disque GPT, et la connexion doit être rétablie automatiquement après chaque redémarrage d'APP1.

    Quelles sont les quatre commandes à exécuter sur APP1 dans l'ordre ? Pour répondre, déplacez les commandes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: portal, text: "New-IscsiTargetPortal -TargetPortalAddress 10.0.10.5" }
    - { id: connect, text: "Get-IscsiTarget | Connect-IscsiTarget -IsPersistent $true" }
    - { id: online, text: "Set-Disk -Number 4 -IsOffline $false" }
    - { id: init, text: "Initialize-Disk -Number 4 -PartitionStyle GPT" }
    - { id: target, text: "New-IscsiServerTarget -TargetName AppDisks -InitiatorIds \"IQN:iqn.1991-05.com.microsoft:app1.contoso.com\"" }
    - { id: vdisk, text: "New-IscsiVirtualDisk -Path E:\\iSCSI\\App1.vhdx -SizeBytes 500GB" }
answer:
  sequence: [ portal, connect, online, init ]
explanation:
  correct:
    en: |
      The initiator first adds ISCSI1 as a target portal (TCP 3260 by default) to discover its targets, then connects to the target; -IsPersistent $true makes the session reconnect after each restart. The LUN then appears as disk 4, offline, so you bring it online before you initialize it as GPT.
    fr: |
      L'initiateur ajoute d'abord ISCSI1 comme portail cible (TCP 3260 par défaut) pour découvrir ses cibles, puis se connecte à la cible ; -IsPersistent $true rétablit la session après chaque redémarrage. Le LUN apparaît ensuite comme disque 4, hors connexion : vous le mettez en ligne avant de l'initialiser en GPT.
  options:
    target:
      en: |
        New-IscsiServerTarget runs on the iSCSI Target Server, where the target already exists.
      fr: |
        New-IscsiServerTarget s'exécute sur le serveur cible iSCSI, où la cible existe déjà.
    vdisk:
      en: |
        New-IscsiVirtualDisk creates a virtual disk on the target server; the virtual disk is already mapped to AppDisks.
      fr: |
        New-IscsiVirtualDisk crée un disque virtuel sur le serveur cible ; le disque virtuel est déjà mappé à AppDisks.
references:
  - title: Connect-IscsiTarget
    url: https://learn.microsoft.com/en-us/powershell/module/iscsi/connect-iscsitarget
  - title: New-IscsiTargetPortal
    url: https://learn.microsoft.com/en-us/powershell/module/iscsi/new-iscsitargetportal
