id: az802-5b-disk-extend-dropdown
objective: "5.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A virtual machine named **VM1** runs Windows Server 2025. Volume **E:** is partition 2 on disk 1. You increase the size of the virtual disk by 500 GB, and the new unallocated space appears immediately after volume E:.

    You need to extend E: to use all the unallocated space by using PowerShell.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une machine virtuelle nommée **VM1** exécute Windows Server 2025. Le volume **E:** correspond à la partition 2 du disque 1. Vous augmentez la taille du disque virtuel de 500 Go, et le nouvel espace non alloué apparaît juste après le volume E:.

    Vous devez étendre E: pour qu'il utilise tout l'espace non alloué, à l'aide de PowerShell.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $size = [[get]] -DiskNumber 1 -PartitionNumber 2
    [[cmd]] -DiskNumber 1 -PartitionNumber 2 -Size $size.[[prop]]
  slots:
    - id: get
      options:
        - { id: supported, text: Get-PartitionSupportedSize }
        - { id: partition, text: Get-Partition }
        - { id: volume, text: Get-Volume }
        - { id: disk, text: Get-Disk }
    - id: cmd
      options:
        - { id: resize, text: Resize-Partition }
        - { id: setpart, text: Set-Partition }
        - { id: resizevhd, text: Resize-VHD }
        - { id: setvol, text: Set-Volume }
    - id: prop
      options:
        - { id: max, text: SizeMax }
        - { id: min, text: SizeMin }
        - { id: size, text: Size }
answer:
  values: { get: supported, cmd: resize, prop: max }
explanation:
  correct:
    en: "`Get-PartitionSupportedSize` returns the range of sizes the partition can take; its `SizeMax` property is the largest size, which includes the adjacent unallocated space. `Resize-Partition` resizes the partition and its file system to the value passed to `-Size`."
    fr: "`Get-PartitionSupportedSize` renvoie la plage de tailles possibles pour la partition ; sa propriété `SizeMax` est la taille maximale, qui inclut l'espace non alloué adjacent. `Resize-Partition` redimensionne la partition et son système de fichiers à la valeur passée à `-Size`."
  options:
    partition: { en: "Get-Partition returns the current partition, whose Size is its present size, not the maximum it can reach.", fr: "Get-Partition renvoie la partition actuelle, dont Size est la taille présente, pas la taille maximale possible." }
    setpart: { en: "Set-Partition changes partition attributes such as the drive letter; it doesn't resize.", fr: "Set-Partition modifie des attributs de partition comme la lettre de lecteur ; il ne redimensionne pas." }
    resizevhd: { en: "Resize-VHD changes the size of a virtual hard disk file on a Hyper-V host, which is already done.", fr: "Resize-VHD modifie la taille d'un fichier de disque dur virtuel sur un hôte Hyper-V, ce qui est déjà fait." }
    min: { en: "SizeMin is the smallest supported size, which would shrink the partition.", fr: "SizeMin est la plus petite taille prise en charge, ce qui réduirait la partition." }
references:
  - title: Resize-Partition
    url: https://learn.microsoft.com/en-us/powershell/module/storage/resize-partition
  - title: Extend a basic or dynamic volume
    url: https://learn.microsoft.com/en-us/windows-server/storage/disk-management/extend-a-basic-volume
