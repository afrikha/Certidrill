id: az802-5b-fs-refs-yesno
objective: "5.3.8"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You plan to use ReFS for several data volumes on servers that run Windows Server 2025.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser ReFS pour plusieurs volumes de données sur des serveurs qui exécutent Windows Server 2025.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can shrink a ReFS volume to free space for another volume.
        fr: |
          Vous pouvez réduire un volume ReFS pour libérer de l'espace pour un autre volume.
    - id: s2
      text:
        en: |
          You can enable Data Deduplication on a ReFS volume.
        fr: |
          Vous pouvez activer la déduplication des données sur un volume ReFS.
    - id: s3
      text:
        en: |
          ReFS is the recommended file system for a Cluster Shared Volume on a Fibre Channel SAN that must use Direct I/O.
        fr: |
          ReFS est le système de fichiers recommandé pour un volume partagé de cluster sur un SAN Fibre Channel qui doit utiliser les E/S directes.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Shrinking isn't available on ReFS. Data Deduplication supports ReFS since Windows Server 2019. ReFS Cluster Shared Volumes don't use Direct I/O with Storage Spaces, Storage Spaces Direct or SAN storage, so NTFS is the choice when a SAN CSV needs Direct I/O.
    fr: |
      La réduction n'est pas disponible sur ReFS. La déduplication des données prend en charge ReFS depuis Windows Server 2019. Les volumes partagés de cluster ReFS n'utilisent pas les E/S directes avec les espaces de stockage, les espaces de stockage direct ou un SAN : NTFS est donc le choix lorsqu'un CSV sur SAN a besoin des E/S directes.
references:
  - title: Resilient File System (ReFS) overview
    url: https://learn.microsoft.com/en-us/windows-server/storage/refs/refs-overview
