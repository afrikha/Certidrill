id: az802-5a-sync-change-detection
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A server named **FS1** has a server endpoint in a sync group whose cloud endpoint is the Azure file share **projects**. One hour ago, a script that runs on an Azure virtual machine copied 3,000 new files directly into projects over SMB. The files do not appear on FS1 yet.

    Users of FS1 must see the new files as soon as possible.

    What should you do?
  fr: |
    Un serveur nommé **FS1** possède un point de terminaison de serveur dans un groupe de synchronisation dont le point de terminaison cloud est le partage de fichiers Azure **projects**. Il y a une heure, un script exécuté sur une machine virtuelle Azure a copié 3 000 nouveaux fichiers directement dans projects en SMB. Les fichiers n'apparaissent pas encore sur FS1.

    Les utilisateurs de FS1 doivent voir les nouveaux fichiers le plus tôt possible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run Invoke-StorageSyncFileRecall on FS1 for the server endpoint path.", fr: "Exécuter Invoke-StorageSyncFileRecall sur FS1 pour le chemin du point de terminaison de serveur." } }
    - { id: b, text: { en: "Run Invoke-AzStorageSyncChangeDetection for the cloud endpoint of the sync group.", fr: "Exécuter Invoke-AzStorageSyncChangeDetection pour le point de terminaison cloud du groupe de synchronisation." } }
    - { id: c, text: { en: "Run Set-AzStorageSyncServerEndpoint -LocalCacheMode DownloadNewAndModifiedFiles for FS1.", fr: "Exécuter Set-AzStorageSyncServerEndpoint -LocalCacheMode DownloadNewAndModifiedFiles pour FS1." } }
    - { id: d, text: { en: "Run Invoke-AzStorageSyncCompatibilityCheck on FS1.", fr: "Exécuter Invoke-AzStorageSyncCompatibilityCheck sur FS1." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Changes made directly in the Azure file share are discovered by a change detection job that starts only once every 24 hours. Invoke-AzStorageSyncChangeDetection starts change detection on the cloud endpoint immediately, after which the new files sync down to FS1.
    fr: |
      Les modifications faites directement dans le partage de fichiers Azure sont découvertes par un travail de détection des modifications qui ne démarre qu'une fois toutes les 24 heures. Invoke-AzStorageSyncChangeDetection lance immédiatement la détection des modifications sur le point de terminaison cloud, après quoi les nouveaux fichiers se synchronisent vers FS1.
  options:
    a:
      en: |
        Invoke-StorageSyncFileRecall brings the content of tiered files back to the server; it cannot download files that sync has not discovered yet.
      fr: |
        Invoke-StorageSyncFileRecall rapatrie sur le serveur le contenu des fichiers hiérarchisés ; il ne peut pas télécharger des fichiers que la synchronisation n'a pas encore découverts.
    c:
      en: |
        Proactive recall downloads new and changed files once sync knows about them; it does not shorten the 24-hour change detection of the cloud endpoint.
      fr: |
        Le rappel proactif télécharge les fichiers nouveaux et modifiés une fois que la synchronisation les connaît ; il ne raccourcit pas la détection des modifications de 24 heures du point de terminaison cloud.
    d:
      en: |
        The compatibility check evaluates whether a server and its data are compatible with Azure File Sync; it does not trigger sync.
      fr: |
        La vérification de compatibilité évalue si un serveur et ses données sont compatibles avec Azure File Sync ; elle ne déclenche pas de synchronisation.
references:
  - title: Deploy Azure File Sync
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide
  - title: Invoke-AzStorageSyncChangeDetection (Az.StorageSync)
    url: https://learn.microsoft.com/en-us/powershell/module/az.storagesync/invoke-azstoragesyncchangedetection
