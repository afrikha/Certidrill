id: az802-cs4b-smb-quic
objective: "5.2.4"
type: single
caseStudy: az802-cs4b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the requirement for the editors who work from home. Which change to FS3 is required before you can enable SMB over QUIC on it?
  fr: |
    Vous devez satisfaire l'exigence concernant les rédacteurs qui travaillent depuis leur domicile. Quelle modification de FS3 est nécessaire avant de pouvoir y activer SMB over QUIC ?
body:
  options:
    - { id: a, text: { en: "Configure FS3 as a KDC proxy for the editors' Kerberos requests.", fr: "Configurer FS3 comme proxy KDC pour les demandes Kerberos des rédacteurs." } }
    - { id: b, text: { en: "Allow inbound TCP port 445 to FS3 from the editors' IP addresses.", fr: "Autoriser le port TCP 445 entrant vers FS3 depuis les adresses IP des rédacteurs." } }
    - { id: c, text: { en: "Join FS3 to Microsoft Entra ID instead of lucernepublishing.com.", fr: "Joindre FS3 à Microsoft Entra ID au lieu de lucernepublishing.com." } }
    - { id: d, text: { en: "Upgrade the operating system of FS3 to Windows Server 2025.", fr: "Mettre à niveau le système d'exploitation de FS3 vers Windows Server 2025." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An SMB over QUIC server must run Windows Server 2022 Datacenter Azure Edition or any edition of Windows Server 2025. FS3 runs Windows Server 2022 Standard on-premises, so it must be upgraded. You then install a TLS certificate with the Server Authentication EKU and allow UDP port 443 inbound.
    fr: |
      Un serveur SMB over QUIC doit exécuter Windows Server 2022 Datacenter Azure Edition ou n'importe quelle édition de Windows Server 2025. FS3 exécute Windows Server 2022 Standard en local : il doit être mis à niveau. Vous installez ensuite un certificat TLS avec l'EKU Server Authentication et autorisez le port UDP 443 entrant.
  options:
    a:
      en: |
        A KDC proxy is optional; without it, clients that cannot reach a domain controller authenticate with NTLMv2.
      fr: |
        Un proxy KDC est facultatif ; sans lui, les clients qui ne peuvent pas joindre un contrôleur de domaine s'authentifient avec NTLMv2.
    b:
      en: |
        SMB over QUIC uses UDP port 443; TCP port 445 must stay blocked from the internet.
      fr: |
        SMB over QUIC utilise le port UDP 443 ; le port TCP 445 doit rester bloqué depuis Internet.
    c:
      en: |
        Active Directory is recommended for SMB over QUIC, and Microsoft Entra joined servers are supported only for Azure IaaS VMs.
      fr: |
        Active Directory est recommandé pour SMB over QUIC, et les serveurs joints à Microsoft Entra ne sont pris en charge que pour les machines virtuelles IaaS Azure.
references:
  - title: SMB over QUIC
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-over-quic
