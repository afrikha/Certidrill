id: az802-5b-fs-ntfs-cluster
objective: "5.3.8"
type: single
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    A server named **FS14** runs Windows Server 2025. You create a 40-TB virtual disk on FS14 and initialize it as GPT.

    You need to format a single NTFS volume that uses the entire disk. The solution must use the smallest cluster size that supports the volume.

    Which cluster size should you use?
  fr: |
    Un serveur nommé **FS14** exécute Windows Server 2025. Vous créez sur FS14 un disque virtuel de 40 To et l'initialisez en GPT.

    Vous devez formater un volume NTFS unique qui utilise tout le disque. La solution doit utiliser la plus petite taille de cluster qui prend en charge le volume.

    Quelle taille de cluster devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "4 KB", fr: "4 Ko" } }
    - { id: b, text: { en: "8 KB", fr: "8 Ko" } }
    - { id: c, text: { en: "16 KB", fr: "16 Ko" } }
    - { id: d, text: { en: "64 KB", fr: "64 Ko" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The cluster size sets the maximum NTFS volume size, because NTFS supports up to 2^32 − 1 clusters. A 16-KB cluster supports volumes of up to 64 TB, which is the smallest size that covers 40 TB.
    fr: |
      La taille de cluster détermine la taille maximale d'un volume NTFS, car NTFS prend en charge jusqu'à 2^32 − 1 clusters. Un cluster de 16 Ko prend en charge des volumes jusqu'à 64 To ; c'est la plus petite taille qui couvre 40 To.
  options:
    a:
      en: |
        The default 4-KB cluster size limits the volume to 16 TB.
      fr: |
        La taille de cluster par défaut de 4 Ko limite le volume à 16 To.
    b:
      en: |
        An 8-KB cluster size limits the volume to 32 TB.
      fr: |
        Une taille de cluster de 8 Ko limite le volume à 32 To.
    d:
      en: |
        A 64-KB cluster size supports up to 256 TB, but it isn't the smallest size that supports 40 TB.
      fr: |
        Une taille de cluster de 64 Ko prend en charge jusqu'à 256 To, mais ce n'est pas la plus petite taille qui prend en charge 40 To.
references:
  - title: NTFS overview
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/ntfs-overview
