id: az802-5a-fsrm-screen-ps
objective: "5.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    On a file server named **FS1**, users must not be able to save disk image files (\*.iso and \*.vhdx) anywhere under D:\Shares\Projects. No built-in file group matches exactly these two extensions.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Sur un serveur de fichiers nommé **FS1**, les utilisateurs ne doivent pas pouvoir enregistrer de fichiers d'image disque (\*.iso et \*.vhdx) dans l'arborescence de D:\Shares\Projects. Aucun groupe de fichiers intégré ne correspond exactement à ces deux extensions.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    New-FsrmFileGroup -Name "Disk Images" [[pattern]] @("*.iso", "*.vhdx")
    New-FsrmFileScreen -Path "D:\Shares\Projects" [[group]] "Disk Images" [[mode]]
  slots:
    - id: pattern
      options:
        - { id: exclude, text: -ExcludePattern }
        - { id: include, text: -IncludePattern }
        - { id: includegroup, text: -IncludeGroup }
    - id: group
      options:
        - { id: includegroup, text: -IncludeGroup }
        - { id: template, text: -Template }
        - { id: include, text: -IncludePattern }
    - id: mode
      options:
        - { id: passive, text: "-Active:$false" }
        - { id: active, text: -Active }
        - { id: notification, text: -Notification }
answer:
  values: { pattern: include, group: includegroup, mode: active }
explanation:
  correct:
    en: "A file group lists the file name patterns to screen with -IncludePattern (-ExcludePattern lists exceptions inside the group). A file screen references file groups with -IncludeGroup, and -Active makes the server fail any write that violates the screen; -Active:$false would create a passive screen that only monitors."
    fr: "Un groupe de fichiers indique les modèles de noms de fichiers à filtrer avec -IncludePattern (-ExcludePattern indique des exceptions au sein du groupe). Un filtre de fichiers référence des groupes de fichiers avec -IncludeGroup, et -Active fait échouer toute écriture qui enfreint le filtre ; -Active:$false créerait un filtre passif qui surveille seulement."
  options:
    exclude: { en: "-ExcludePattern lists the files that the group does not include.", fr: "-ExcludePattern indique les fichiers que le groupe n'inclut pas." }
    template: { en: "-Template names a file screen template, not a file group.", fr: "-Template désigne un modèle de filtre de fichiers, pas un groupe de fichiers." }
    passive: { en: "A passive screen allows the save and only notifies.", fr: "Un filtre passif autorise l'enregistrement et se contente de notifier." }
    notification: { en: "-Notification defines the actions run when the screen is triggered; it does not make the screen block files.", fr: "-Notification définit les actions exécutées quand le filtre se déclenche ; il ne fait pas bloquer les fichiers par le filtre." }
references:
  - title: New-FsrmFileScreen (FileServerResourceManager)
    url: https://learn.microsoft.com/en-us/powershell/module/fileserverresourcemanager/new-fsrmfilescreen
  - title: Define File Groups for Screening
    url: https://learn.microsoft.com/en-us/windows-server/storage/fsrm/define-file-groups-for-screening
