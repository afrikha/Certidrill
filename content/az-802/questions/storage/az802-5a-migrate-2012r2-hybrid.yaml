id: az802-5a-migrate-2012r2-hybrid
objective: "5.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has a file server named **FS-OLD** that runs Windows Server 2012 R2 and hosts 6 TB of SMB shares on NTFS volumes. You plan to migrate the shares to Azure Files and then decommission FS-OLD.

    The solution must meet the following requirements:

    - After the migration, users in the office access the data through a local Windows Server cache, while the full copy is stored in Azure file shares.
    - File ACLs, timestamps and attributes are preserved.

    What should you do?
  fr: |
    Litware dispose d'un serveur de fichiers nommé **FS-OLD** qui exécute Windows Server 2012 R2 et héberge 6 To de partages SMB sur des volumes NTFS. Vous prévoyez de migrer les partages vers Azure Files, puis de mettre FS-OLD hors service.

    La solution doit répondre aux exigences suivantes :

    - Après la migration, les utilisateurs du bureau accèdent aux données par un cache Windows Server local, tandis que la copie complète est stockée dans des partages de fichiers Azure.
    - Les listes ACL, les horodatages et les attributs des fichiers sont conservés.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Install the Azure File Sync agent on FS-OLD, create server endpoints for its shares, and then move the endpoints to a new server.", fr: "Installer l'agent Azure File Sync sur FS-OLD, créer des points de terminaison de serveur pour ses partages, puis déplacer les points de terminaison vers un nouveau serveur." }
    - id: b
      text: { en: "Copy the shares to the Azure file shares by using Azure Storage Explorer, and then deploy Azure File Sync on a new Windows Server 2022 server.", fr: "Copier les partages vers les partages de fichiers Azure avec l'Explorateur Stockage Azure, puis déployer Azure File Sync sur un nouveau serveur Windows Server 2022." }
    - id: c
      text: { en: "Deploy a new Windows Server 2022 server with Azure File Sync server endpoints, and copy the shares from FS-OLD to it by using Robocopy.", fr: "Déployer un nouveau serveur Windows Server 2022 avec des points de terminaison de serveur Azure File Sync, et y copier les partages de FS-OLD avec Robocopy." }
    - id: d
      text: { en: "Copy the shares to the Azure file shares by using AzCopy sync, and then install Azure File Sync on FS-OLD to cache them.", fr: "Copier les partages vers les partages de fichiers Azure avec AzCopy sync, puis installer Azure File Sync sur FS-OLD pour les mettre en cache." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure File Sync does not support Windows Server 2012 R2, so for a hybrid target the old server is treated like a NAS. You deploy a Windows Server 2016 or later server with Azure File Sync and copy the data to its server endpoints with Robocopy, which preserves full fidelity; Azure File Sync then uploads the data to the Azure file shares and the new server stays as the cache.
    fr: |
      Azure File Sync ne prend pas en charge Windows Server 2012 R2 : pour une cible hybride, l'ancien serveur est traité comme un NAS. Vous déployez un serveur Windows Server 2016 ou version ultérieure avec Azure File Sync et copiez les données vers ses points de terminaison de serveur avec Robocopy, qui conserve toute la fidélité ; Azure File Sync charge ensuite les données dans les partages de fichiers Azure et le nouveau serveur reste le cache.
  options:
    a:
      en: |
        The Azure File Sync agent requires Windows Server 2016 or later and cannot be installed on FS-OLD.
      fr: |
        L'agent Azure File Sync exige Windows Server 2016 ou version ultérieure et ne peut pas être installé sur FS-OLD.
    b:
      en: |
        Azure Storage Explorer loses most file fidelity, such as ACLs.
      fr: |
        L'Explorateur Stockage Azure perd la plupart de la fidélité des fichiers, comme les listes ACL.
    d:
      en: |
        AzCopy can lose some file fidelity, and FS-OLD cannot run the Azure File Sync agent.
      fr: |
        AzCopy peut perdre une partie de la fidélité des fichiers, et FS-OLD ne peut pas exécuter l'agent Azure File Sync.
references:
  - title: Migration Overview for SMB Azure File Shares
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-migration-overview
  - title: On-premises NAS migration to Azure File Sync
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-migration-nas-hybrid
