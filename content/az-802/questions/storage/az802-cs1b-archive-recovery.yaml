id: az802-cs1b-archive-recovery
objective: "5.3.10"
type: ordering
caseStudy: az802-cs1b-southridge
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the recovery requirement for volume E: on FS-MTL1.

    Which three commands should you run in sequence? To answer, move the appropriate commands from the list of commands to the answer area and arrange them in the correct order.
  fr: |
    Vous devez respecter l'exigence de récupération du volume E: de FS-MTL1.

    Quelles sont les trois commandes à exécuter dans l'ordre ? Pour répondre, déplacez les commandes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: get, text: "$BLV = Get-BitLockerVolume -MountPoint \"E:\"" }
    - { id: add, text: "Add-BitLockerKeyProtector -MountPoint \"E:\" -RecoveryPasswordProtector" }
    - { id: backup, text: "Backup-BitLockerKeyProtector -MountPoint \"E:\" -KeyProtectorId $BLV.KeyProtector[1].KeyProtectorId" }
    - { id: aad, text: "BackupToAAD-BitLockerKeyProtector -MountPoint \"E:\" -KeyProtectorId $BLV.KeyProtector[1].KeyProtectorId" }
    - { id: disable, text: "Disable-BitLocker -MountPoint \"E:\"" }
    - { id: unlock, text: "Unlock-BitLocker -MountPoint \"E:\" -Password (Read-Host -AsSecureString)" }
answer:
  sequence: [ add, get, backup ]
explanation:
  correct:
    en: |
      Volume E: has no recovery password yet, so you first add one as a new key protector; the volume stays encrypted. You then read the volume again with `Get-BitLockerVolume` so that `$BLV.KeyProtector` includes the new protector (index 1, after the password protector). Finally, `Backup-BitLockerKeyProtector` saves the recovery password key protector, identified by its ID, to AD DS.
    fr: |
      Le volume E: n'a pas encore de mot de passe de récupération : vous en ajoutez d'abord un comme nouveau protecteur de clé ; le volume reste chiffré. Vous relisez ensuite le volume avec `Get-BitLockerVolume` pour que `$BLV.KeyProtector` contienne le nouveau protecteur (index 1, après le protecteur par mot de passe). Enfin, `Backup-BitLockerKeyProtector` enregistre dans AD DS le protecteur de clé mot de passe de récupération, identifié par son ID.
  options:
    aad: { en: "BackupToAAD-BitLockerKeyProtector saves the key protector to Microsoft Entra ID, not to AD DS.", fr: "BackupToAAD-BitLockerKeyProtector enregistre le protecteur de clé dans Microsoft Entra ID, pas dans AD DS." }
    disable: { en: "Disable-BitLocker decrypts the volume, which the requirement forbids.", fr: "Disable-BitLocker déchiffre le volume, ce que l'exigence interdit." }
    unlock: { en: "E: is already in use on FS-MTL1; unlocking it doesn't create or back up a recovery password.", fr: "E: est déjà utilisé sur FS-MTL1 ; le déverrouiller ne crée ni ne sauvegarde de mot de passe de récupération." }
references:
  - title: Backup-BitLockerKeyProtector
    url: https://learn.microsoft.com/en-us/powershell/module/bitlocker/backup-bitlockerkeyprotector
  - title: BitLocker operations guide
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/operations-guide
