id: az802-5b-sr-reverse
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Two servers named **SRV1** and **SRV2** run Windows Server 2025 Datacenter. A Storage Replica server-to-server partnership replicates volume F: from replication group **RG01** on SRV1 to replication group **RG02** on SRV2. The initial block copy is complete.

    SRV1 will be shut down for planned maintenance. Users must work on SRV2 during the maintenance, and changes must replicate back to SRV1 afterward.

    You need to make SRV2 the source of the replication. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Deux serveurs nommés **SRV1** et **SRV2** exécutent Windows Server 2025 Datacenter. Un partenariat de réplica de stockage de serveur à serveur réplique le volume F: du groupe de réplication **RG01** de SRV1 vers le groupe de réplication **RG02** de SRV2. La copie initiale des blocs est terminée.

    SRV1 va être arrêté pour une maintenance planifiée. Les utilisateurs doivent travailler sur SRV2 pendant la maintenance, et les modifications doivent ensuite être répliquées vers SRV1.

    Vous devez faire de SRV2 la source de la réplication. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run Remove-SRPartnership, and then run New-SRPartnership with SRV2 as the source computer.", fr: "Exécuter Remove-SRPartnership, puis exécuter New-SRPartnership avec SRV2 comme ordinateur source." } }
    - { id: b, text: { en: "Run Set-SRPartnership with SRV2 as the new source computer and RG02 as the source group.", fr: "Exécuter Set-SRPartnership avec SRV2 comme nouvel ordinateur source et RG02 comme groupe source." } }
    - { id: c, text: { en: "Assign a drive letter to the replicated volume on SRV2 by using Disk Management.", fr: "Attribuer une lettre de lecteur au volume répliqué de SRV2 avec la Gestion des disques." } }
    - { id: d, text: { en: "Run Test-SRTopology with SRV2 as the source computer and SRV1 as the destination.", fr: "Exécuter Test-SRTopology avec SRV2 comme ordinateur source et SRV1 comme destination." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Set-SRPartnership with -NewSourceComputerName SRV2, -SourceRGName RG02, -DestinationComputerName SRV1 and -DestinationRGName RG01 switches the replication direction in one command. SRV2 mounts F: as the writable source, and its changes then replicate to SRV1. Direction changes are blocked until the initial sync completes, which is already the case here.
    fr: |
      Set-SRPartnership avec -NewSourceComputerName SRV2, -SourceRGName RG02, -DestinationComputerName SRV1 et -DestinationRGName RG01 inverse le sens de la réplication en une seule commande. SRV2 monte F: comme source accessible en écriture, et ses modifications sont ensuite répliquées vers SRV1. Les changements de sens sont bloqués tant que la synchronisation initiale n'est pas terminée, ce qui est déjà le cas ici.
  options:
    a:
      en: |
        Removing and recreating the partnership takes several commands (including Remove-SRGroup on both servers) and starts a new initial replication, so it doesn't minimize effort.
      fr: |
        Supprimer et recréer le partenariat demande plusieurs commandes (dont Remove-SRGroup sur les deux serveurs) et lance une nouvelle réplication initiale : cela ne réduit pas l'effort.
    c:
      en: |
        Storage Replica keeps the destination volume dismounted by design; a drive letter doesn't make it usable or change the direction.
      fr: |
        Le réplica de stockage maintient le volume de destination démonté par conception ; une lettre de lecteur ne le rend pas utilisable et ne change pas le sens.
    d:
      en: |
        Test-SRTopology only validates and reports on a proposed topology.
      fr: |
        Test-SRTopology se contente de valider une topologie envisagée et d'en produire un rapport.
references:
  - title: Set up server-to-server storage replication by using Storage Replica
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-replica/server-to-server-storage-replication
