id: az802-5a-share-settings-hotarea
objective: "5.2.1"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    A server named **FS3** has a share named **Teams**. The output of `Get-SmbShare -Name Teams | Format-List` includes the following properties.

    You need to meet the requirements below by changing one property for each requirement.

    Which property should you change for each requirement? To answer, select the appropriate value in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur nommé **FS3** possède un partage nommé **Teams**. La sortie de `Get-SmbShare -Name Teams | Format-List` contient les propriétés suivantes.

    Vous devez répondre aux exigences ci-dessous en modifiant une propriété pour chaque exigence.

    Quelle propriété devez-vous modifier pour chaque exigence ? Pour répondre, sélectionnez la valeur appropriée dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - { id: p1, text: { en: "Users must see only the folders of Teams that they have permission to open.", fr: "Les utilisateurs ne doivent voir que les dossiers de Teams qu'ils ont l'autorisation d'ouvrir." } }
    - { id: p2, text: { en: "Client computers must not keep offline copies of the files of Teams.", fr: "Les ordinateurs clients ne doivent pas conserver de copies hors connexion des fichiers de Teams." } }
  grid:
    header: [{ en: "Property", fr: "Propriété" }, { en: "Value", fr: "Valeur" }]
    rows:
      - [{ text: Name }, { text: Teams }]
      - [{ text: Path }, { text: "D:\\Shares\\Teams" }]
      - [{ text: CachingMode }, { text: Manual, area: caching }]
      - [{ text: ConcurrentUserLimit }, { text: "0", area: limit }]
      - [{ text: ContinuouslyAvailable }, { text: "False", area: ca }]
      - [{ text: EncryptData }, { text: "False", area: encrypt }]
      - [{ text: FolderEnumerationMode }, { text: Unrestricted, area: enum }]
answer:
  values: { p1: enum, p2: caching }
explanation:
  correct:
    en: "FolderEnumerationMode set to AccessBased enables access-based enumeration, which hides the folders that a user has no permission to access. CachingMode controls offline files: Manual lets users choose files to make available offline, and None prevents clients from keeping offline copies."
    fr: "FolderEnumerationMode défini sur AccessBased active l'énumération basée sur l'accès, qui masque les dossiers auxquels un utilisateur n'a pas accès. CachingMode contrôle les fichiers hors connexion : Manual permet aux utilisateurs de choisir les fichiers à rendre disponibles hors connexion, et None empêche les clients de conserver des copies hors connexion."
references:
  - title: New-SmbShare (SmbShare)
    url: https://learn.microsoft.com/en-us/powershell/module/smbshare/new-smbshare
