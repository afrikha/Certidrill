id: az802-5b-iscsi-new-node
objective: "5.3.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A server named **ISCSI2** runs iSCSI Target Server on Windows Server 2025. A guest failover cluster that contains **Node1** and **Node2** uses the iSCSI virtual disks mapped to a target named **T1** on ISCSI2. The initiators of T1 are identified by their IQNs.

    You add a third node named **Node3** to the cluster. On Node3, you add ISCSI2 as a target portal, but Node3 can't connect to T1. Node1 and Node2 still access the disks.

    You need Node3 to access the disks of T1.

    What should you do?
  fr: |
    Un serveur nommé **ISCSI2** exécute le serveur cible iSCSI sur Windows Server 2025. Un cluster de basculement invité qui contient **Node1** et **Node2** utilise les disques virtuels iSCSI mappés à une cible nommée **T1** sur ISCSI2. Les initiateurs de T1 sont identifiés par leur IQN.

    Vous ajoutez au cluster un troisième nœud nommé **Node3**. Sur Node3, vous ajoutez ISCSI2 comme portail cible, mais Node3 ne parvient pas à se connecter à T1. Node1 et Node2 accèdent toujours aux disques.

    Node3 doit accéder aux disques de T1.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "On Node3, connect to T1 by running Connect-IscsiTarget with -IsMultipathEnabled $true.", fr: "Sur Node3, se connecter à T1 en exécutant Connect-IscsiTarget avec -IsMultipathEnabled $true." } }
    - { id: b, text: { en: "On ISCSI2, enable reverse CHAP on T1 by running Set-IscsiServerTarget -EnableReverseChap $true.", fr: "Sur ISCSI2, activer le CHAP inverse sur T1 en exécutant Set-IscsiServerTarget -EnableReverseChap $true." } }
    - { id: c, text: { en: "On ISCSI2, create a new iSCSI virtual disk and map it to T1.", fr: "Sur ISCSI2, créer un nouveau disque virtuel iSCSI et le mapper à T1." } }
    - { id: d, text: { en: "On ISCSI2, add the IQN of Node3 to the initiator IDs of T1 by running Set-IscsiServerTarget.", fr: "Sur ISCSI2, ajouter l'IQN de Node3 aux ID d'initiateur de T1 en exécutant Set-IscsiServerTarget." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A target only accepts the initiators whose IDs (IQN, DNS name, IP address or MAC address, in the IdType:Value format) are assigned to it. Adding Node3's IQN to the initiator IDs of T1, together with the existing nodes, lets Node3 connect to the same disks.
    fr: |
      Une cible n'accepte que les initiateurs dont les ID (IQN, nom DNS, adresse IP ou adresse MAC, au format IdType:Value) lui sont attribués. Ajouter l'IQN de Node3 aux ID d'initiateur de T1, avec ceux des nœuds existants, permet à Node3 de se connecter aux mêmes disques.
  options:
    a:
      en: |
        MPIO adds redundant paths for an initiator that is already allowed; it doesn't grant access to the target.
      fr: |
        MPIO ajoute des chemins redondants pour un initiateur déjà autorisé ; il n'accorde pas l'accès à la cible.
    b:
      en: |
        Reverse CHAP lets the initiator authenticate the target; it doesn't add Node3 to the allowed initiators.
      fr: |
        Le CHAP inverse permet à l'initiateur d'authentifier la cible ; il n'ajoute pas Node3 aux initiateurs autorisés.
    c:
      en: |
        A new virtual disk doesn't change which initiators can connect to T1, and the cluster needs the existing disks.
      fr: |
        Un nouveau disque virtuel ne change pas les initiateurs autorisés à se connecter à T1, et le cluster a besoin des disques existants.
references:
  - title: Set-IscsiServerTarget
    url: https://learn.microsoft.com/en-us/powershell/module/iscsitarget/set-iscsiservertarget
  - title: New-IscsiServerTarget
    url: https://learn.microsoft.com/en-us/powershell/module/iscsitarget/new-iscsiservertarget
