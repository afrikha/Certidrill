id: az802-sr1-two-shares-2
objective: "5.1.3"
type: series_yesno
series: az802-sr1-two-shares
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You create two sync groups in Sync1, one for each file share.
  fr: Vous créez deux groupes de synchronisation dans Sync1, un pour chaque partage de fichiers.
body:
  solution:
    en: |
      In Sync1, you create a sync group named **SG-Projects** with a cloud endpoint for the projects file share and a server endpoint for **D:\Projects** on FS1. You then create a sync group named **SG-Finance** with a cloud endpoint for the finance file share and a server endpoint for **D:\Finance** on FS1.
    fr: |
      Dans Sync1, vous créez un groupe de synchronisation nommé **SG-Projects** avec un point de terminaison cloud pour le partage de fichiers projects et un point de terminaison de serveur pour **D:\Projects** sur FS1. Vous créez ensuite un groupe de synchronisation nommé **SG-Finance** avec un point de terminaison cloud pour le partage de fichiers finance et un point de terminaison de serveur pour **D:\Finance** sur FS1.
answer: { value: true }
explanation:
  correct:
    en: |
      Each sync group has one cloud endpoint and one server endpoint on FS1, which respects the topology rules. A registered server can have several server endpoints and can take part in several sync groups of its Storage Sync Service, so FS1 syncs each folder with its own file share. The storage account and Sync1 are in the same region, as Azure File Sync requires.
    fr: |
      Chaque groupe de synchronisation comporte un point de terminaison cloud et un point de terminaison de serveur sur FS1, ce qui respecte les règles de topologie. Un serveur inscrit peut avoir plusieurs points de terminaison de serveur et participer à plusieurs groupes de synchronisation de son service de synchronisation de stockage : FS1 synchronise donc chaque dossier avec son propre partage de fichiers. Le compte de stockage et Sync1 se trouvent dans la même région, comme l'exige Azure File Sync.
references:
  - title: Deploy Azure File Sync
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide
