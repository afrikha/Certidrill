id: az802-cs3c-smb-quic
objective: "5.2.4"
type: single
caseStudy: az802-cs3c-lucerne-publishing
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the remote editors requirement. Which firewall rule and which certificate should you use for FS-EDGE?
  fr: |
    Vous devez satisfaire l'exigence relative aux éditeurs à distance. Quelle règle de pare-feu et quel certificat devez-vous utiliser pour FS-EDGE ?
body:
  options:
    - { id: a, text: { en: "Allow inbound TCP 445; certificate whose subject alternative name contains files.lucernepublishing.com", fr: "Autoriser TCP 445 en entrée ; certificat dont l'autre nom de l'objet contient files.lucernepublishing.com" } }
    - { id: b, text: { en: "Allow inbound UDP 443; certificate whose subject alternative name contains 203.0.113.10", fr: "Autoriser UDP 443 en entrée ; certificat dont l'autre nom de l'objet contient 203.0.113.10" } }
    - { id: c, text: { en: "Allow inbound TCP 443; certificate whose subject alternative name contains files.lucernepublishing.com", fr: "Autoriser TCP 443 en entrée ; certificat dont l'autre nom de l'objet contient files.lucernepublishing.com" } }
    - { id: d, text: { en: "Allow inbound UDP 443; certificate whose subject alternative name contains files.lucernepublishing.com", fr: "Autoriser UDP 443 en entrée ; certificat dont l'autre nom de l'objet contient files.lucernepublishing.com" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      SMB over QUIC uses UDP 443 inbound by default, and TCP 445 must stay closed to the internet. FS-EDGE runs Windows Server 2025, whose editions all support SMB over QUIC. The server certificate needs the Server Authentication EKU and a DNS name entry in the subject alternative name for each name that clients use, here files.lucernepublishing.com.
    fr: |
      SMB sur QUIC utilise par défaut UDP 443 en entrée, et TCP 445 doit rester fermé vers Internet. FS-EDGE exécute Windows Server 2025, dont toutes les éditions prennent en charge SMB sur QUIC. Le certificat du serveur doit comporter l'EKU Authentification du serveur et, dans l'autre nom de l'objet, une entrée de nom DNS pour chaque nom utilisé par les clients, ici files.lucernepublishing.com.
  options:
    a:
      en: |
        TCP 445 is classic SMB over TCP; it must not be opened to the internet and is not the QUIC transport.
      fr: |
        TCP 445 correspond au SMB classique sur TCP ; il ne doit pas être ouvert vers Internet et ce n'est pas le transport QUIC.
    b:
      en: |
        Clients connect by name, and an IP address in the subject alternative name forces NTLM; the certificate must list the DNS name.
      fr: |
        Les clients se connectent par nom, et une adresse IP dans l'autre nom de l'objet force NTLM ; le certificat doit indiquer le nom DNS.
    c:
      en: |
        QUIC runs over UDP, not TCP, so a TCP 443 rule does not let the connection through.
      fr: |
        QUIC fonctionne sur UDP, pas sur TCP : une règle TCP 443 ne laisse donc pas passer la connexion.
references:
  - title: SMB over QUIC
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-over-quic
