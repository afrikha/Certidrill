id: az802-5b-dedup-quota
objective: "5.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A file server named **FS10** runs Windows Server 2025. Volume F: has a capacity of 6 TB and stores home folders under F:\Home. Data Deduplication is enabled on F: with the Default usage type. To cap the total data on the volume, an administrator created a 4-TB hard quota on the root folder F:\ by using File Server Resource Manager.

    Since the quota was created, optimization jobs on F: fail repeatedly.

    You need to ensure that optimization jobs complete. The solution must keep a limit on the space that users consume.

    What should you do?
  fr: |
    Un serveur de fichiers nommé **FS10** exécute Windows Server 2025. Le volume F: a une capacité de 6 To et stocke des dossiers de base sous F:\Home. La déduplication des données est activée sur F: avec le type d'utilisation Default. Pour plafonner le volume total de données, un administrateur a créé un quota inconditionnel de 4 To sur le dossier racine F:\ avec le Gestionnaire de ressources du serveur de fichiers.

    Depuis la création du quota, les tâches d'optimisation de F: échouent régulièrement.

    Vous devez faire en sorte que les tâches d'optimisation se terminent. La solution doit conserver une limite sur l'espace consommé par les utilisateurs.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the usage type of F: to Backup.", fr: "Remplacer le type d'utilisation de F: par Backup." } }
    - { id: b, text: { en: "Replace the hard quota on F:\\ with hard quotas on the folders under F:\\Home.", fr: "Remplacer le quota inconditionnel de F:\\ par des quotas inconditionnels sur les dossiers situés sous F:\\Home." } }
    - { id: c, text: { en: "Run Start-DedupJob -Volume F: -Type GarbageCollection -Full.", fr: "Exécuter Start-DedupJob -Volume F: -Type GarbageCollection -Full." } }
    - { id: d, text: { en: "Exclude F:\\Home from optimization by using Set-DedupVolume -ExcludeFolder.", fr: "Exclure F:\\Home de l'optimisation avec Set-DedupVolume -ExcludeFolder." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A hard quota on the root folder of a deduplicated volume isn't supported, because the gap between the real free space and the quota-restricted space can make optimization jobs fail. Quotas on subfolders (or a soft quota on the root) work with deduplication and still limit what users store; quotas are based on logical file size.
    fr: |
      Un quota inconditionnel sur le dossier racine d'un volume dédupliqué n'est pas pris en charge, car l'écart entre l'espace libre réel et l'espace limité par le quota peut faire échouer les tâches d'optimisation. Des quotas sur des sous-dossiers (ou un quota conditionnel sur la racine) fonctionnent avec la déduplication et limitent toujours ce que les utilisateurs stockent ; les quotas se basent sur la taille logique des fichiers.
  options:
    a:
      en: |
        The Backup usage type is tuned for virtualized backup applications such as DPM, and the hard quota on the root would still break optimization.
      fr: |
        Le type d'utilisation Backup est adapté aux applications de sauvegarde virtualisées comme DPM, et le quota inconditionnel sur la racine continuerait de bloquer l'optimisation.
    c:
      en: |
        A full Garbage Collection reclaims unreferenced chunks; it doesn't remove the unsupported quota configuration.
      fr: |
        Un Garbage Collection complet récupère les blocs non référencés ; il ne supprime pas la configuration de quota non prise en charge.
    d:
      en: |
        Excluding the home folders stops deduplicating almost all the data on F:, which defeats the purpose instead of fixing the quota.
      fr: |
        Exclure les dossiers de base arrête la déduplication de presque toutes les données de F:, ce qui va à l'encontre de l'objectif au lieu de corriger le quota.
references:
  - title: Data Deduplication interoperability in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/storage/data-deduplication/interop
