id: az802-cs3a-fsrm-rules
objective: "5.2.2"
type: dragdrop
caseStudy: az802-cs3a-bellows-college
difficulty: 1
status: draft
stem:
  en: |
    You need to configure FSRM on FS1 to meet the requirements. What should you configure for each folder? To answer, drag the appropriate FSRM objects to the correct folders. Each FSRM object may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer FSRM sur FS1 pour satisfaire les exigences. Que devez-vous configurer pour chaque dossier ? Pour répondre, faites glisser les objets FSRM appropriés vers les dossiers corrects. Chaque objet FSRM peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: hard, text: { en: "A quota with a hard limit", fr: "Un quota avec une limite inconditionnelle" } }
    - { id: soft, text: { en: "A quota with a soft limit", fr: "Un quota avec une limite conditionnelle" } }
    - { id: active, text: { en: "A file screen that uses active screening", fr: "Un filtre de fichiers qui utilise le filtrage actif" } }
    - { id: passive, text: { en: "A file screen that uses passive screening", fr: "Un filtre de fichiers qui utilise le filtrage passif" } }
    - { id: exception, text: { en: "A file screen exception", fr: "Une exception de filtre de fichiers" } }
  targets:
    - { id: home, text: { en: "Each folder in D:\\Home", fr: "Chaque dossier de D:\\Home" } }
    - { id: research, text: "D:\\Research" }
    - { id: coursework, text: "D:\\Coursework" }
    - { id: media, text: "D:\\Media" }
answer:
  mapping: { home: hard, research: soft, coursework: active, media: passive }
explanation:
  correct:
    en: |
      A hard limit blocks writes once the 2 GB limit of a home folder is reached, while a soft limit only reports usage and runs the threshold actions, such as the email for D:\Research, without blocking writes. Active screening makes the server fail any write that violates the screen, which keeps executables out of D:\Coursework; passive screening only monitors and notifies, so the video files in D:\Media are saved and reported.
    fr: |
      Une limite inconditionnelle bloque les écritures dès que la limite de 2 Go d'un dossier de base est atteinte, alors qu'une limite conditionnelle se contente de signaler l'utilisation et d'exécuter les actions de seuil, comme l'e-mail pour D:\Research, sans bloquer les écritures. Le filtrage actif fait échouer toute écriture qui enfreint le filtre, ce qui empêche les exécutables d'arriver dans D:\Coursework ; le filtrage passif ne fait que surveiller et notifier, si bien que les fichiers vidéo de D:\Media sont enregistrés et signalés.
  options:
    exception:
      en: |
        A file screen exception allows blocked file types in a subfolder of a screened folder; no requirement asks for it.
      fr: |
        Une exception de filtre de fichiers autorise des types de fichiers bloqués dans un sous-dossier d'un dossier filtré ; aucune exigence ne la demande.
references:
  - title: New-FsrmQuota (FileServerResourceManager)
    url: https://learn.microsoft.com/en-us/powershell/module/fileserverresourcemanager/new-fsrmquota
  - title: New-FsrmFileScreen (FileServerResourceManager)
    url: https://learn.microsoft.com/en-us/powershell/module/fileserverresourcemanager/new-fsrmfilescreen
