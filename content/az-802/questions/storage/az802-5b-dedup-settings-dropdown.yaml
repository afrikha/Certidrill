id: az802-5b-dedup-settings-dropdown
objective: "5.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A file server named **FS9** runs Windows Server 2025. Data Deduplication is enabled on volume E: with the Default usage type.

    You need to modify the deduplication policy of E: to meet the following requirements:

    - Only files that are at least seven days old are optimized.
    - Files in the E:\Shares\Media folder are never optimized.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur de fichiers nommé **FS9** exécute Windows Server 2025. La déduplication des données est activée sur le volume E: avec le type d'utilisation Default.

    Vous devez modifier la stratégie de déduplication de E: pour respecter les exigences suivantes :

    - Seuls les fichiers âgés d'au moins sept jours sont optimisés.
    - Les fichiers du dossier E:\Shares\Media ne sont jamais optimisés.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Set-DedupVolume -Volume E: -[[age]] 7 -[[excl]] "E:\Shares\Media"
  slots:
    - id: age
      options:
        - { id: minage, text: MinimumFileAgeDays }
        - { id: minsize, text: MinimumFileSize }
        - { id: chunk, text: ChunkRedundancyThreshold }
    - id: excl
      options:
        - { id: folder, text: ExcludeFolder }
        - { id: type, text: ExcludeFileType }
        - { id: nocomp, text: NoCompressionFileType }
answer:
  values: { age: minage, excl: folder }
explanation:
  correct:
    en: |
      MinimumFileAgeDays sets how many days must pass before a file is in policy (3 by default for the Default usage type). ExcludeFolder takes an array of folder paths that optimization skips.
    fr: |
      MinimumFileAgeDays définit le nombre de jours qui doivent s'écouler avant qu'un fichier entre dans la stratégie (3 par défaut pour le type d'utilisation Default). ExcludeFolder accepte un tableau de chemins de dossiers que l'optimisation ignore.
  options:
    minsize: { en: "MinimumFileSize is a size in bytes, not an age.", fr: "MinimumFileSize est une taille en octets, pas un âge." }
    chunk: { en: "ChunkRedundancyThreshold sets how many references a chunk needs before extra copies are kept.", fr: "ChunkRedundancyThreshold définit le nombre de références à partir duquel des copies supplémentaires d'un bloc sont conservées." }
    type: { en: "ExcludeFileType excludes file extensions, not a folder.", fr: "ExcludeFileType exclut des extensions de fichier, pas un dossier." }
    nocomp: { en: "NoCompressionFileType only disables compression of chunks for some extensions; those files are still deduplicated.", fr: "NoCompressionFileType désactive seulement la compression des blocs pour certaines extensions ; ces fichiers restent dédupliqués." }
references:
  - title: Advanced Data Deduplication settings
    url: https://learn.microsoft.com/en-us/windows-server/storage/data-deduplication/advanced-settings
