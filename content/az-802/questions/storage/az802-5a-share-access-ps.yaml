id: az802-5a-share-access-ps
objective: "5.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A server named **FS1** has a share named **Finance** whose share permissions grant Everyone Read. You need to change the share permissions as follows:

    - Grant the CONTOSO\Finance-Users group the Change share permission.
    - Remove the Everyone entry from the share permissions without adding a deny entry.
    - Keep the existing share and its open connections.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur nommé **FS1** possède un partage nommé **Finance** dont les autorisations de partage accordent Lecture à Everyone. Vous devez modifier les autorisations de partage comme suit :

    - Accorder l'autorisation de partage Modifier au groupe CONTOSO\Finance-Users.
    - Retirer l'entrée Everyone des autorisations de partage sans ajouter d'entrée de refus.
    - Conserver le partage existant et ses connexions ouvertes.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    [[grant]] -Name Finance -AccountName "CONTOSO\Finance-Users" -AccessRight [[right]] -Force
    [[remove]] -Name Finance -AccountName "Everyone" -Force
  slots:
    - id: grant
      options:
        - { id: setshare, text: Set-SmbShare }
        - { id: grantaccess, text: Grant-SmbShareAccess }
        - { id: newshare, text: New-SmbShare }
    - id: right
      options:
        - { id: full, text: Full }
        - { id: read, text: Read }
        - { id: change, text: Change }
    - id: remove
      options:
        - { id: block, text: Block-SmbShareAccess }
        - { id: unblock, text: Unblock-SmbShareAccess }
        - { id: revoke, text: Revoke-SmbShareAccess }
answer:
  values: { grant: grantaccess, right: change, remove: revoke }
explanation:
  correct:
    en: |
      Grant-SmbShareAccess adds an allow entry to the security descriptor of an existing share, and its -AccessRight parameter accepts Full, Change or Read. Revoke-SmbShareAccess removes all the allow entries of a trustee from the share's security descriptor, which removes Everyone without creating a deny entry.
    fr: |
      Grant-SmbShareAccess ajoute une entrée d'autorisation au descripteur de sécurité d'un partage existant, et son paramètre -AccessRight accepte Full, Change ou Read. Revoke-SmbShareAccess retire toutes les entrées d'autorisation d'un bénéficiaire du descripteur de sécurité du partage, ce qui retire Everyone sans créer d'entrée de refus.
  options:
    setshare: { en: "Set-SmbShare changes share properties such as caching or encryption; it has no -AccountName or -AccessRight parameter.", fr: "Set-SmbShare modifie des propriétés du partage comme la mise en cache ou le chiffrement ; il n'a pas de paramètre -AccountName ni -AccessRight." }
    newshare: { en: "New-SmbShare creates a share; the existing share must be kept.", fr: "New-SmbShare crée un partage ; le partage existant doit être conservé." }
    full: { en: "Full exceeds the required Change permission.", fr: "Full dépasse l'autorisation Modifier demandée." }
    read: { en: "Read does not let the group change files.", fr: "Read ne permet pas au groupe de modifier les fichiers." }
    block: { en: "Block-SmbShareAccess adds a deny entry, which the requirement forbids.", fr: "Block-SmbShareAccess ajoute une entrée de refus, ce que l'exigence interdit." }
    unblock: { en: "Unblock-SmbShareAccess removes deny entries; Everyone has an allow entry.", fr: "Unblock-SmbShareAccess retire des entrées de refus ; Everyone a une entrée d'autorisation." }
references:
  - title: Grant-SmbShareAccess (SmbShare)
    url: https://learn.microsoft.com/en-us/powershell/module/smbshare/grant-smbshareaccess
  - title: Revoke-SmbShareAccess (SmbShare)
    url: https://learn.microsoft.com/en-us/powershell/module/smbshare/revoke-smbshareaccess
