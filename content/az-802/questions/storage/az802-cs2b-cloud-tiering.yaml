id: az802-cs2b-cloud-tiering
objective: "5.1.3"
type: yesno_statements
caseStudy: az802-cs2b-lamna-healthcare
difficulty: 3
status: draft
stem:
  en: |
    You create the two server endpoints on CL-FS1 as planned. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez les deux points de terminaison de serveur sur CL-FS1 comme prévu. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Azure File Sync starts tiering files on volume E: when its free space drops below 35%.
        fr: |
          Azure File Sync commence à hiérarchiser des fichiers sur le volume E: quand son espace libre descend sous 35 %.
    - id: s2
      text:
        en: |
          A file in E:\Imaging that was last accessed 10 days ago always stays cached on CL-FS1.
        fr: |
          Un fichier de E:\Imaging dont le dernier accès date de 10 jours reste toujours en cache sur CL-FS1.
    - id: s3
      text:
        en: |
          A file in E:\Imaging that was last accessed 45 days ago is tiered even when volume E: has more than 35% free space.
        fr: |
          Un fichier de E:\Imaging dont le dernier accès date de 45 jours est hiérarchisé même quand le volume E: dispose de plus de 35 % d'espace libre.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      When several server endpoints on the same volume have different volume free space values, the largest one applies to the whole volume, so tiering starts below 35% of free space. The volume free space policy always takes precedence over the date policy, so even recently accessed files can be tiered when space runs short. The date policy of E:\Imaging tiers the files that were not accessed for 30 days, whatever the free space.
    fr: |
      Quand plusieurs points de terminaison de serveur d'un même volume ont des valeurs d'espace libre différentes, la plus élevée s'applique à tout le volume : la hiérarchisation commence sous 35 % d'espace libre. La stratégie d'espace libre du volume est toujours prioritaire sur la stratégie de date, si bien que même des fichiers consultés récemment peuvent être hiérarchisés quand l'espace manque. La stratégie de date de E:\Imaging hiérarchise les fichiers qui n'ont pas été consultés depuis 30 jours, quel que soit l'espace libre.
references:
  - title: Azure File Sync cloud tiering policies
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-cloud-tiering-policy
