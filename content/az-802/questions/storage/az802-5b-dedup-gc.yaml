id: az802-5b-dedup-gc
objective: "5.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A file server named **FS8** runs Windows Server 2025. Data Deduplication is enabled on volume E: with the Default usage type, and the default job schedules are used.

    On Monday morning, users delete 800 GB of old project files from E:. The free space on E: doesn't increase.

    You need to reclaim the space as soon as possible.

    Which command should you run?
  fr: |
    Un serveur de fichiers nommé **FS8** exécute Windows Server 2025. La déduplication des données est activée sur le volume E: avec le type d'utilisation Default, et les planifications de tâches par défaut sont utilisées.

    Le lundi matin, les utilisateurs suppriment 800 Go d'anciens fichiers de projet de E:. L'espace libre de E: n'augmente pas.

    Vous devez récupérer l'espace le plus rapidement possible.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "Start-DedupJob -Volume E: -Type Optimization" }
    - { id: b, text: "Start-DedupJob -Volume E: -Type Scrubbing" }
    - { id: c, text: "Start-DedupJob -Volume E: -Type Unoptimization" }
    - { id: d, text: "Start-DedupJob -Volume E: -Type GarbageCollection" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Deleted files release their chunks only when a Garbage Collection job removes the chunks that are no longer referenced. By default, Garbage Collection runs only on Saturday at 2:35 AM, so you start the job manually to free the space now.
    fr: |
      Les fichiers supprimés ne libèrent leurs blocs que lorsqu'une tâche Garbage Collection supprime les blocs qui ne sont plus référencés. Par défaut, Garbage Collection ne s'exécute que le samedi à 2 h 35 ; vous lancez donc la tâche manuellement pour libérer l'espace dès maintenant.
  options:
    a:
      en: |
        Optimization chunks and stores new data in the chunk store; it doesn't remove unreferenced chunks.
      fr: |
        Optimization découpe et stocke les nouvelles données dans le magasin de blocs ; elle ne supprime pas les blocs non référencés.
    b:
      en: |
        Scrubbing (Integrity Scrubbing) detects and repairs corruption in the chunk store; it doesn't reclaim space.
      fr: |
        Scrubbing (Integrity Scrubbing) détecte et répare la corruption du magasin de blocs ; elle ne récupère pas d'espace.
    c:
      en: |
        Unoptimization undoes deduplication and disables it on the volume; rehydrating the files consumes more space instead of reclaiming it.
      fr: |
        Unoptimization annule la déduplication et la désactive sur le volume ; la réhydratation des fichiers consomme davantage d'espace au lieu d'en récupérer.
references:
  - title: Understanding Data Deduplication
    url: https://learn.microsoft.com/en-us/windows-server/storage/data-deduplication/understand
