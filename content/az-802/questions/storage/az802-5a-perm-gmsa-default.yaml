id: az802-5a-perm-gmsa-default
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an AD DS domain named contoso.com that is synced to a Microsoft Entra tenant. A storage account named **contosofs01** is joined to contoso.com for AD DS authentication. On its file share **reports**, the synced group Report-Editors has the Storage File Data SMB Share Contributor role. The default share-level permission of contosofs01 is None.

    A service on a server named APP1 runs as a group managed service account (gMSA) named **gmsaReports**. gMSAs are not synced to Microsoft Entra ID. The service must write files to reports. The solution must not use the storage account key.

    What should you do?
  fr: |
    Contoso dispose d'un domaine AD DS nommé contoso.com synchronisé avec un locataire Microsoft Entra. Un compte de stockage nommé **contosofs01** est joint à contoso.com pour l'authentification AD DS. Sur son partage de fichiers **reports**, le groupe synchronisé Report-Editors a le rôle Storage File Data SMB Share Contributor. L'autorisation par défaut au niveau du partage de contosofs01 est None.

    Un service d'un serveur nommé APP1 s'exécute sous un compte de service administré de groupe (gMSA) nommé **gmsaReports**. Les gMSA ne sont pas synchronisés avec Microsoft Entra ID. Le service doit écrire des fichiers dans reports. La solution ne doit pas utiliser la clé du compte de stockage.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Assign Storage File Data SMB Share Contributor on reports to the computer account of APP1, and grant APP1$ Modify in the Windows ACLs.", fr: "Attribuer Storage File Data SMB Share Contributor sur reports au compte d'ordinateur d'APP1, et accorder Modification à APP1$ dans les listes ACL Windows." }
    - id: b
      text: { en: "Set the default share-level permission to Storage File Data SMB Share Contributor, and grant gmsaReports Modify in the Windows ACLs.", fr: "Définir l'autorisation par défaut au niveau du partage sur Storage File Data SMB Share Contributor, et accorder Modification à gmsaReports dans les listes ACL Windows." }
    - id: c
      text: { en: "Assign Storage File Data SMB Share Elevated Contributor on reports to gmsaReports, and grant gmsaReports Modify in the Windows ACLs.", fr: "Attribuer Storage File Data SMB Share Elevated Contributor sur reports à gmsaReports, et accorder Modification à gmsaReports dans les listes ACL Windows." }
    - id: d
      text: { en: "Enable Microsoft Entra Kerberos as a second identity source on contosofs01, and grant gmsaReports Modify in the Windows ACLs.", fr: "Activer Microsoft Entra Kerberos comme seconde source d'identité sur contosofs01, et accorder Modification à gmsaReports dans les listes ACL Windows." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Share-level role assignments target Microsoft Entra identities, and identities that exist only in AD DS, such as gMSAs, sMSAs and computer accounts, cannot receive them. A default share-level permission applies to every identity that authenticates against the AD DS domain of the storage account, so gmsaReports gets share-level access, and the Windows ACLs still decide what each identity can do in the share.
    fr: |
      Les attributions de rôles au niveau du partage ciblent des identités Microsoft Entra, et les identités qui n'existent que dans AD DS, comme les gMSA, les sMSA et les comptes d'ordinateur, ne peuvent pas les recevoir. Une autorisation par défaut au niveau du partage s'applique à toute identité qui s'authentifie auprès du domaine AD DS du compte de stockage : gmsaReports obtient ainsi l'accès au niveau du partage, et les listes ACL Windows décident toujours de ce que chaque identité peut faire dans le partage.
  options:
    a:
      en: |
        Computer accounts have no identity in Microsoft Entra ID, so you cannot assign them an Azure RBAC role.
      fr: |
        Les comptes d'ordinateur n'ont pas d'identité dans Microsoft Entra ID : vous ne pouvez pas leur attribuer de rôle Azure RBAC.
    c:
      en: |
        gmsaReports is not synced to Microsoft Entra ID, so it cannot be the target of a role assignment, whatever the role.
      fr: |
        gmsaReports n'est pas synchronisé avec Microsoft Entra ID : il ne peut pas être la cible d'une attribution de rôle, quel que soit le rôle.
    d:
      en: |
        A storage account uses only one identity source for SMB authentication, and Microsoft Entra Kerberos would still need identities known to Microsoft Entra ID.
      fr: |
        Un compte de stockage n'utilise qu'une seule source d'identité pour l'authentification SMB, et Microsoft Entra Kerberos exigerait toujours des identités connues de Microsoft Entra ID.
references:
  - title: Assign Share-Level Permissions for Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions
