id: az802-5b-dedup-interop-yesno
objective: "5.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to enable Data Deduplication on several servers that run Windows Server 2025.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit d'activer la déduplication des données sur plusieurs serveurs qui exécutent Windows Server 2025.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          To use deduplication on a Cluster Shared Volume of a two-node failover cluster, you must install the Data Deduplication feature on both nodes.
        fr: |
          Pour utiliser la déduplication sur un volume partagé de cluster d'un cluster de basculement à deux nœuds, vous devez installer la fonctionnalité Déduplication des données sur les deux nœuds.
    - id: s2
      text:
        en: |
          When Storage Replica replicates a deduplicated volume from SRV1 to SRV2, you should configure deduplication to also run on the destination copy on SRV2.
        fr: |
          Lorsque le réplica de stockage réplique un volume dédupliqué de SRV1 vers SRV2, vous devez configurer la déduplication pour qu'elle s'exécute aussi sur la copie de destination de SRV2.
    - id: s3
      text:
        en: |
          Windows Search returns complete results for files stored on a deduplicated volume.
        fr: |
          Windows Search renvoie des résultats complets pour les fichiers stockés sur un volume dédupliqué.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Deduplication is fully supported on failover clusters when every node has the feature installed. With Storage Replica, deduplication is supported, but you configure it not to run on the secondary copy. Windows Search isn't supported with deduplication because it skips the reparse points of optimized files, so results can be incomplete.
    fr: |
      La déduplication est entièrement prise en charge sur les clusters de basculement lorsque la fonctionnalité est installée sur chaque nœud. Avec le réplica de stockage, la déduplication est prise en charge, mais vous la configurez pour qu'elle ne s'exécute pas sur la copie secondaire. Windows Search n'est pas pris en charge avec la déduplication, car il ignore les points d'analyse des fichiers optimisés : les résultats peuvent être incomplets.
references:
  - title: Data Deduplication interoperability in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/storage/data-deduplication/interop
