id: az802-5a-dfsr-migration-prereqs
objective: "5.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    DFS Replication replicates the folder D:\Projects between three servers:

    | Server | Operating system | .NET Framework | Volume D: |
    | --- | --- | --- | --- |
    | FS1 | Windows Server 2016 Standard | 4.6.2 | NTFS |
    | FS2 | Windows Server 2019 Datacenter | 4.7.2 | NTFS |
    | FS3 | Windows Server 2012 R2 Standard | 4.8 | NTFS |

    You plan to migrate this deployment to Azure File Sync, and each of the three office locations must keep a server endpoint.

    Which two actions must you perform before you install the Azure File Sync agent? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    La réplication DFS réplique le dossier D:\Projects entre trois serveurs :

    | Serveur | Système d'exploitation | .NET Framework | Volume D: |
    | --- | --- | --- | --- |
    | FS1 | Windows Server 2016 Standard | 4.6.2 | NTFS |
    | FS2 | Windows Server 2019 Datacenter | 4.7.2 | NTFS |
    | FS3 | Windows Server 2012 R2 Standard | 4.8 | NTFS |

    Vous prévoyez de migrer ce déploiement vers Azure File Sync, et chacun des trois sites doit conserver un point de terminaison de serveur.

    Quelles sont les deux actions à effectuer avant d'installer l'agent Azure File Sync ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Upgrade FS2 to Windows Server 2022.", fr: "Mettre à niveau FS2 vers Windows Server 2022." } }
    - { id: b, text: { en: "Install .NET Framework 4.7.2 or later on FS1.", fr: "Installer .NET Framework 4.7.2 ou version ultérieure sur FS1." } }
    - { id: c, text: { en: "Reformat volume D: of each server with ReFS.", fr: "Reformater le volume D: de chaque serveur en ReFS." } }
    - { id: d, text: { en: "Replace FS3 with a server that runs Windows Server 2016 or later.", fr: "Remplacer FS3 par un serveur qui exécute Windows Server 2016 ou version ultérieure." } }
    - { id: e, text: { en: "Remove D:\\Projects from the DFS namespace.", fr: "Retirer D:\\Projects de l'espace de noms DFS." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The Azure File Sync agent requires .NET Framework 4.7.2 or later; Windows Server 2019 and later include it, but Windows Server 2016 may not, so FS1 needs an update. Azure File Sync supports Windows Server 2016 to Windows Server 2025, so FS3, which runs Windows Server 2012 R2, must be replaced or upgraded.
    fr: |
      L'agent Azure File Sync exige .NET Framework 4.7.2 ou version ultérieure ; Windows Server 2019 et versions ultérieures l'incluent, mais pas forcément Windows Server 2016 : FS1 doit donc être mis à jour. Azure File Sync prend en charge Windows Server 2016 à Windows Server 2025 : FS3, qui exécute Windows Server 2012 R2, doit être remplacé ou mis à niveau.
  options:
    a: { en: "Windows Server 2019 Datacenter is supported and already includes .NET Framework 4.7.2.", fr: "Windows Server 2019 Datacenter est pris en charge et inclut déjà .NET Framework 4.7.2." }
    c: { en: "Azure File Sync supports only NTFS volumes; ReFS is not supported.", fr: "Azure File Sync ne prend en charge que les volumes NTFS ; ReFS n'est pas pris en charge." }
    e: { en: "Azure File Sync works with DFS Namespaces, which can keep the existing paths.", fr: "Azure File Sync fonctionne avec les espaces de noms DFS, qui peuvent conserver les chemins existants." }
references:
  - title: Plan an Azure File Sync deployment
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-planning
