id: az802-cs1b-pool-resiliency
objective: "5.3.2"
type: yesno_statements
caseStudy: az802-cs1b-southridge
difficulty: 2
status: draft
stem:
  en: |
    You plan the virtual disks of Pool1 on FS-MTL1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez les disques virtuels de Pool1 sur FS-MTL1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A two-way mirror virtual disk in Pool1 meets the media library requirement.
        fr: Un disque virtuel en miroir double de Pool1 respecte l'exigence de la médiathèque.
    - id: s2
      text:
        en: Pool1 contains enough physical disks to create a three-way mirror virtual disk.
        fr: Pool1 contient assez de disques physiques pour créer un disque virtuel en miroir triple.
    - id: s3
      text:
        en: A parity virtual disk in Pool1 keeps its data available if one disk of Pool1 fails.
        fr: Un disque virtuel à parité de Pool1 conserve ses données disponibles si un disque de Pool1 tombe en panne.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A two-way mirror protects against a single disk failure only, so it doesn't meet a two-failure requirement. A three-way mirror protects against two simultaneous disk failures and needs at least five disks; Pool1 has six. A parity space needs at least three disks and protects against a single disk failure; it suits highly sequential workloads such as archives.
    fr: |
      Un miroir double ne protège que contre la panne d'un seul disque : il ne respecte donc pas une exigence de deux pannes. Un miroir triple protège contre deux pannes de disque simultanées et nécessite au moins cinq disques ; Pool1 en compte six. Un espace à parité nécessite au moins trois disques et protège contre la panne d'un seul disque ; il convient aux charges de travail très séquentielles comme les archives.
references:
  - title: Deploy Storage Spaces on a stand-alone server
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/deploy-standalone-storage-spaces
