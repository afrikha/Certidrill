id: az802-5b-s2d-nested
objective: "5.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a two-node failover cluster named **Cluster1** that runs Windows Server 2025 Datacenter. Storage Spaces Direct is enabled on Cluster1, and each node has six capacity drives. A cloud witness is configured.

    You need to create a volume for virtual machines. The volume must stay online while one node is down for maintenance and a capacity drive fails in the other node.

    Which resiliency type should you use for the volume?
  fr: |
    Vous disposez d'un cluster de basculement à deux nœuds nommé **Cluster1** qui exécute Windows Server 2025 Datacenter. Les espaces de stockage direct sont activés sur Cluster1, et chaque nœud possède six lecteurs de capacité. Un témoin cloud est configuré.

    Vous devez créer un volume pour des machines virtuelles. Le volume doit rester en ligne pendant qu'un nœud est arrêté pour maintenance et qu'un lecteur de capacité tombe en panne dans l'autre nœud.

    Quel type de résilience devez-vous utiliser pour le volume ?
body:
  options:
    - { id: a, text: { en: "Nested two-way mirror", fr: "Miroir bidirectionnel imbriqué" } }
    - { id: b, text: { en: "Three-way mirror", fr: "Miroir tridirectionnel" } }
    - { id: c, text: { en: "Two-way mirror", fr: "Miroir bidirectionnel" } }
    - { id: d, text: { en: "Dual parity", fr: "Double parité" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Nested resiliency exists for two-server clusters only (Windows Server 2019 or later) and keeps volumes online through multiple simultaneous failures, such as one server down plus one drive failure. A nested two-way mirror writes four copies of the data, for a capacity efficiency of 25 %.
    fr: |
      La résilience imbriquée est réservée aux clusters à deux serveurs (Windows Server 2019 ou ultérieur) et maintient les volumes en ligne malgré plusieurs pannes simultanées, comme un serveur arrêté et un lecteur défaillant. Un miroir bidirectionnel imbriqué écrit quatre copies des données, pour une efficacité de capacité de 25 %.
  options:
    c:
      en: |
        A two-way mirror tolerates only one failure at a time; with one node down, a drive failure in the other node takes the volume offline.
      fr: |
        Un miroir bidirectionnel ne tolère qu'une panne à la fois ; avec un nœud arrêté, la panne d'un lecteur dans l'autre nœud met le volume hors connexion.
    b:
      en: |
        A three-way mirror needs at least three servers (fault domains).
      fr: |
        Un miroir tridirectionnel nécessite au moins trois serveurs (domaines d'erreur).
    d:
      en: |
        Dual parity needs at least four servers.
      fr: |
        La double parité nécessite au moins quatre serveurs.
references:
  - title: Nested resiliency for Storage Spaces Direct
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/nested-resiliency
