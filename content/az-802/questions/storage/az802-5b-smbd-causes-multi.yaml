id: az802-5b-smbd-causes-multi
objective: "5.3.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A Hyper-V host named **HV4** stores virtual machines on a file server named **FS13**. Both servers run Windows Server 2025 Datacenter and have RDMA-capable network adapters. SMB traffic between HV4 and FS13 uses TCP/IP instead of SMB Direct.

    The following table shows the configuration of both servers.

    | Setting | HV4 | FS13 |
    | --- | --- | --- |
    | RDMA enabled on the adapters (`Get-NetAdapterRdma`) | True | True |
    | NetworkDirect global offload setting | Disabled | Enabled |
    | SMB client EnableMultiChannel | True | True |
    | SMB server EnableMultiChannel | True | False |
    | RDMA adapters teamed by using Switch Embedded Teaming (SET) | Yes | No |
    | SMB encryption required on the VM share | Not applicable | Yes |

    Which two settings prevent the use of SMB Direct between HV4 and FS13?

    NOTE: Each correct selection is worth one point.
  fr: |
    Un hôte Hyper-V nommé **HV4** stocke des machines virtuelles sur un serveur de fichiers nommé **FS13**. Les deux serveurs exécutent Windows Server 2025 Datacenter et possèdent des cartes réseau compatibles RDMA. Le trafic SMB entre HV4 et FS13 utilise TCP/IP au lieu de SMB Direct.

    Le tableau suivant présente la configuration des deux serveurs.

    | Paramètre | HV4 | FS13 |
    | --- | --- | --- |
    | RDMA activé sur les cartes (`Get-NetAdapterRdma`) | True | True |
    | Paramètre global de déchargement NetworkDirect | Disabled | Enabled |
    | EnableMultiChannel du client SMB | True | True |
    | EnableMultiChannel du serveur SMB | True | False |
    | Cartes RDMA associées avec Switch Embedded Teaming (SET) | Oui | Non |
    | Chiffrement SMB exigé sur le partage des VM | Sans objet | Oui |

    Quels sont les deux paramètres qui empêchent l'utilisation de SMB Direct entre HV4 et FS13 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The NetworkDirect global offload setting on HV4", fr: "Le paramètre global de déchargement NetworkDirect de HV4" } }
    - { id: b, text: { en: "The SET team on HV4", fr: "L'association SET de HV4" } }
    - { id: c, text: { en: "The SMB server EnableMultiChannel setting on FS13", fr: "Le paramètre EnableMultiChannel du serveur SMB de FS13" } }
    - { id: d, text: { en: "The SMB encryption requirement on FS13", fr: "L'exigence de chiffrement SMB de FS13" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Disabling NetworkDirect with Set-NetOffloadGlobalSetting turns off RDMA for the computer, and when RDMA is disabled on either the client or the server, they can't use it. SMB Multichannel detects RDMA capability, so disabling it on the SMB server of FS13 also disables SMB Direct for every client.
    fr: |
      Désactiver NetworkDirect avec Set-NetOffloadGlobalSetting désactive RDMA pour l'ordinateur, et lorsque RDMA est désactivé sur le client ou sur le serveur, ils ne peuvent pas l'utiliser. SMB Multichannel détecte la compatibilité RDMA : le désactiver sur le serveur SMB de FS13 désactive donc aussi SMB Direct pour tous les clients.
  options:
    b:
      en: |
        RDMA-capable adapters can be teamed with SET, which supports SMB Direct.
      fr: |
        Les cartes compatibles RDMA peuvent être associées avec SET, qui prend en charge SMB Direct.
    d:
      en: |
        Since Windows Server 2022, SMB Direct supports encryption without falling back to TCP/IP.
      fr: |
        Depuis Windows Server 2022, SMB Direct prend en charge le chiffrement sans revenir à TCP/IP.
references:
  - title: Improve performance of a file server with SMB Direct
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-direct
