id: az802-5a-quic-client-access
objective: "5.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Windows Server 2025 file server named **FSEDGE1** uses SMB over QUIC client access control. You previously ran the following commands on FSEDGE1:

    ```powershell
    Set-SmbServerCertificateMapping -Name fsedge1.contoso.com -RequireClientAuthentication $true
    Grant-SmbClientAccessToServer -Name FSEDGE1 -IdentifierType ISSUER -Identifier "CN=Contoso Device CA, DC=contoso, DC=com"
    Block-SmbClientAccessToServer -Name FSEDGE1 -IdentifierType SHA256 -Identifier $laptop12Hash
    ```

    The variable $laptop12Hash contains the SHA256 hash of the client certificate of a device named LAPTOP12, issued by Contoso Device CA. LAPTOP12 was blocked while it was reported lost. It has been found and must connect again. Access for all the other devices must stay unchanged.

    What should you run on FSEDGE1?
  fr: |
    Un serveur de fichiers Windows Server 2025 nommé **FSEDGE1** utilise le contrôle d'accès client de SMB sur QUIC. Vous avez précédemment exécuté les commandes suivantes sur FSEDGE1 :

    ```powershell
    Set-SmbServerCertificateMapping -Name fsedge1.contoso.com -RequireClientAuthentication $true
    Grant-SmbClientAccessToServer -Name FSEDGE1 -IdentifierType ISSUER -Identifier "CN=Contoso Device CA, DC=contoso, DC=com"
    Block-SmbClientAccessToServer -Name FSEDGE1 -IdentifierType SHA256 -Identifier $laptop12Hash
    ```

    La variable $laptop12Hash contient le hachage SHA256 du certificat client d'un appareil nommé LAPTOP12, émis par Contoso Device CA. LAPTOP12 a été bloqué pendant qu'il était déclaré perdu. Il a été retrouvé et doit pouvoir se connecter de nouveau. L'accès de tous les autres appareils doit rester inchangé.

    Que devez-vous exécuter sur FSEDGE1 ?
body:
  options:
    - { id: a, text: "Grant-SmbClientAccessToServer -Name FSEDGE1 -IdentifierType SHA256 -Identifier $laptop12Hash" }
    - { id: b, text: "Unblock-SmbClientAccessToServer -Name FSEDGE1 -IdentifierType SHA256 -Identifier $laptop12Hash" }
    - { id: c, text: "Set-SmbServerCertificateMapping -Name fsedge1.contoso.com -SkipClientCertificateAccessCheck $true" }
    - { id: d, text: "Revoke-SmbClientAccessToServer -Name FSEDGE1 -IdentifierType SHA256 -Identifier $laptop12Hash" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A client is granted access when no certificate in its chain is denied and at least one is allowed. LAPTOP12 is still allowed through the issuer entry, so removing its deny entry with Unblock-SmbClientAccessToServer restores its access without changing the other devices.
    fr: |
      Un client obtient l'accès quand aucun certificat de sa chaîne n'est refusé et qu'au moins un est autorisé. LAPTOP12 reste autorisé par l'entrée de l'émetteur : retirer son entrée de refus avec Unblock-SmbClientAccessToServer rétablit son accès sans modifier les autres appareils.
  options:
    a:
      en: |
        Any deny entry in the certificate chain takes priority over allow entries, so adding an allow entry for the leaf certificate does not override the block.
      fr: |
        Toute entrée de refus de la chaîne de certificats est prioritaire sur les entrées d'autorisation : ajouter une entrée d'autorisation pour le certificat feuille ne lève pas le blocage.
    c:
      en: |
        With SkipClientCertificateAccessCheck, the server stops performing access control checks for every client, which changes access for all the devices.
      fr: |
        Avec SkipClientCertificateAccessCheck, le serveur n'effectue plus aucun contrôle d'accès pour tous les clients, ce qui modifie l'accès de tous les appareils.
    d:
      en: |
        Revoke-SmbClientAccessToServer removes allow entries; LAPTOP12 has a deny entry, which would remain.
      fr: |
        Revoke-SmbClientAccessToServer retire des entrées d'autorisation ; LAPTOP12 a une entrée de refus, qui resterait en place.
references:
  - title: Configure SMB over QUIC client access control in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/configure-smb-over-quic-client-access-control
