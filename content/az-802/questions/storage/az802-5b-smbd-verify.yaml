id: az802-5b-smbd-verify
objective: "5.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A file server named **FS11** runs Windows Server 2025 and has two RDMA-capable network adapters. Hyper-V hosts store virtual machine files in SMB shares on FS11.

    You need to verify that the SMB server on FS11 reports its network interfaces as RDMA capable.

    Which cmdlet should you run on FS11?
  fr: |
    Un serveur de fichiers nommé **FS11** exécute Windows Server 2025 et possède deux cartes réseau compatibles RDMA. Des hôtes Hyper-V stockent des fichiers de machines virtuelles dans des partages SMB de FS11.

    Vous devez vérifier que le serveur SMB de FS11 signale ses interfaces réseau comme compatibles RDMA.

    Quelle cmdlet devez-vous exécuter sur FS11 ?
body:
  options:
    - { id: a, text: Get-SmbServerConfiguration }
    - { id: b, text: Get-SmbServerNetworkInterface }
    - { id: c, text: Get-SmbShare }
    - { id: d, text: Get-SmbSession }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Get-SmbServerNetworkInterface lists the interfaces that the SMB server uses and shows whether each one is RDMA capable. On the Hyper-V hosts, Get-SmbClientNetworkInterface gives the same view for the SMB client.
    fr: |
      Get-SmbServerNetworkInterface répertorie les interfaces utilisées par le serveur SMB et indique si chacune est compatible RDMA. Sur les hôtes Hyper-V, Get-SmbClientNetworkInterface donne la même vue pour le client SMB.
  options:
    a:
      en: |
        Get-SmbServerConfiguration shows server-wide settings such as SMB Multichannel or encryption, not the RDMA capability of each interface.
      fr: |
        Get-SmbServerConfiguration affiche des paramètres globaux du serveur, comme SMB Multichannel ou le chiffrement, pas la compatibilité RDMA de chaque interface.
    c:
      en: |
        Get-SmbShare lists the shares and their properties, not network interfaces.
      fr: |
        Get-SmbShare répertorie les partages et leurs propriétés, pas les interfaces réseau.
    d:
      en: |
        Get-SmbSession lists the client sessions connected to the server, without the RDMA capability of the interfaces.
      fr: |
        Get-SmbSession répertorie les sessions clientes connectées au serveur, sans la compatibilité RDMA des interfaces.
references:
  - title: Improve performance of a file server with SMB Direct
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-direct
