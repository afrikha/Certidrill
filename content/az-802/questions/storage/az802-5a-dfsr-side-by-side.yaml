id: az802-5a-dfsr-side-by-side
objective: "5.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a hub file server named **HUB1** and two branch servers named **BR1** and **BR2** that cannot connect to the internet. DFS Replication replicates the folder D:\Branches between BR1, BR2 and HUB1. HUB1 also hosts E:\Catalog, a read-only replicated folder of another replication group.

    You plan to sync HUB1 with an Azure file share by using Azure File Sync while DFS Replication keeps running.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un serveur de fichiers central nommé **HUB1** et de deux serveurs de succursale nommés **BR1** et **BR2** qui ne peuvent pas se connecter à Internet. La réplication DFS réplique le dossier D:\Branches entre BR1, BR2 et HUB1. HUB1 héberge aussi E:\Catalog, un dossier répliqué en lecture seule d'un autre groupe de réplication.

    Vous prévoyez de synchroniser HUB1 avec un partage de fichiers Azure à l'aide d'Azure File Sync pendant que la réplication DFS continue de fonctionner.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A server endpoint for D:\Branches on HUB1 is a supported configuration.
        fr: |
          Un point de terminaison de serveur pour D:\Branches sur HUB1 est une configuration prise en charge.
    - id: s2
      text:
        en: |
          Enabling cloud tiering on the server endpoint for D:\Branches is a supported way to save space on HUB1.
        fr: |
          Activer la hiérarchisation cloud sur le point de terminaison de serveur de D:\Branches est un moyen pris en charge de libérer de l'espace sur HUB1.
    - id: s3
      text:
        en: |
          A second server endpoint on HUB1 for E:\Catalog is a supported configuration.
        fr: |
          Un second point de terminaison de serveur sur HUB1 pour E:\Catalog est une configuration prise en charge.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Keeping DFS Replication next to Azure File Sync is supported when some servers cannot reach the internet or when branches consolidate onto a hub that syncs with Azure. In that case, one server endpoint can overlap a DFS Replication location, cloud tiering must be disabled on volumes with replicated folders, and you should not create server endpoints on read-only replicated folders.
    fr: |
      Conserver la réplication DFS à côté d'Azure File Sync est pris en charge quand certains serveurs ne peuvent pas joindre Internet ou quand des succursales se regroupent sur un serveur central synchronisé avec Azure. Dans ce cas, un seul point de terminaison de serveur peut chevaucher un emplacement répliqué par DFS, la hiérarchisation cloud doit être désactivée sur les volumes qui contiennent des dossiers répliqués, et vous ne devez pas créer de point de terminaison de serveur sur des dossiers répliqués en lecture seule.
references:
  - title: Plan an Azure File Sync deployment
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-planning
