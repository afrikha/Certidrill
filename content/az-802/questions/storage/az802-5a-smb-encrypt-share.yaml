id: az802-5a-smb-encrypt-share
objective: "5.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A file server named **FS1** runs Windows Server 2025 and hosts several shares, including a share named **Payroll**. All the clients support SMB 3.1.1.

    You need to ensure that the data exchanged with Payroll cannot be read if it is captured on the network. The other shares of FS1 must not be affected.

    What should you run?
  fr: |
    Un serveur de fichiers nommé **FS1** exécute Windows Server 2025 et héberge plusieurs partages, dont un partage nommé **Payroll**. Tous les clients prennent en charge SMB 3.1.1.

    Vous devez vous assurer que les données échangées avec Payroll ne peuvent pas être lues si elles sont capturées sur le réseau. Les autres partages de FS1 ne doivent pas être affectés.

    Que devez-vous exécuter ?
body:
  options:
    - { id: a, text: "Set-SmbServerConfiguration -EncryptData $true" }
    - { id: b, text: "Set-SmbShare -Name Payroll -EncryptData $true" }
    - { id: c, text: "Set-SmbServerConfiguration -RejectUnencryptedAccess $true" }
    - { id: d, text: "Enable-BitLocker -MountPoint D: -RecoveryPasswordProtector" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      SMB encryption can be enabled for one share with Set-SmbShare -EncryptData $true, or for the whole server with Set-SmbServerConfiguration -EncryptData $true. Enabling it on Payroll only protects that share's traffic in transit and leaves the other shares unchanged.
    fr: |
      Le chiffrement SMB peut être activé pour un partage avec Set-SmbShare -EncryptData $true, ou pour tout le serveur avec Set-SmbServerConfiguration -EncryptData $true. L'activer sur Payroll uniquement protège le trafic de ce partage en transit et laisse les autres partages inchangés.
  options:
    a:
      en: |
        Enabling encryption at the server level applies it to every share of FS1.
      fr: |
        Activer le chiffrement au niveau du serveur l'applique à tous les partages de FS1.
    c:
      en: |
        RejectUnencryptedAccess is already $true by default; it rejects clients that cannot encrypt but does not turn on encryption.
      fr: |
        RejectUnencryptedAccess vaut déjà $true par défaut ; il rejette les clients incapables de chiffrer mais n'active pas le chiffrement.
    d:
      en: |
        BitLocker encrypts data at rest on the volume; SMB encryption is unrelated to BitLocker and protects data in transit.
      fr: |
        BitLocker chiffre les données au repos sur le volume ; le chiffrement SMB est indépendant de BitLocker et protège les données en transit.
references:
  - title: SMB Security Enhancements
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-security
