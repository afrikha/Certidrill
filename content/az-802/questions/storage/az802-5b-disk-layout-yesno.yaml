id: az802-5b-disk-layout-yesno
objective: "5.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A server named **FS1** runs Windows Server 2025. Disk 1 on FS1 is a 2-TB basic disk that uses the GPT partition style. The following table shows the layout of Disk 1, from the start of the disk to the end.

    | Position | Content | Size | File system |
    | --- | --- | --- | --- |
    | 1 | Volume D: | 500 GB | NTFS |
    | 2 | Volume E: | 300 GB | ReFS |
    | 3 | Unallocated | 400 GB | — |
    | 4 | Volume F: | 600 GB | NTFS |
    | 5 | Unallocated | 200 GB | — |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur nommé **FS1** exécute Windows Server 2025. Le Disque 1 de FS1 est un disque de base de 2 To qui utilise le style de partition GPT. Le tableau suivant présente l'organisation du Disque 1, du début à la fin du disque.

    | Position | Contenu | Taille | Système de fichiers |
    | --- | --- | --- | --- |
    | 1 | Volume D: | 500 Go | NTFS |
    | 2 | Volume E: | 300 Go | ReFS |
    | 3 | Non alloué | 400 Go | — |
    | 4 | Volume F: | 600 Go | NTFS |
    | 5 | Non alloué | 200 Go | — |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can extend volume E: into the 400 GB of unallocated space.
        fr: |
          Vous pouvez étendre le volume E: dans les 400 Go d'espace non alloué.
    - id: s2
      text:
        en: |
          You can extend volume D: into the 400 GB of unallocated space by using Extend Volume in Disk Management.
        fr: |
          Vous pouvez étendre le volume D: dans les 400 Go d'espace non alloué avec Étendre le volume dans la Gestion des disques.
    - id: s3
      text:
        en: |
          You can shrink volume E: to free 100 GB for a new volume.
        fr: |
          Vous pouvez réduire le volume E: pour libérer 100 Go destinés à un nouveau volume.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A volume can be extended only into unallocated space located immediately after it on the same disk, and only if it uses NTFS or ReFS; E: meets both conditions. D: can't use the 400 GB because volume E: sits between D: and the unallocated space. Shrinking is available for NTFS and raw volumes, and ReFS volumes can't be shrunk.
    fr: |
      Un volume ne peut être étendu que dans l'espace non alloué situé juste après lui sur le même disque, et seulement s'il utilise NTFS ou ReFS ; E: remplit les deux conditions. D: ne peut pas utiliser les 400 Go, car le volume E: se trouve entre D: et l'espace non alloué. La réduction est possible pour les volumes NTFS et bruts, et les volumes ReFS ne peuvent pas être réduits.
references:
  - title: Extend a basic or dynamic volume
    url: https://learn.microsoft.com/en-us/windows-server/storage/disk-management/extend-a-basic-volume
  - title: Resilient File System (ReFS) overview
    url: https://learn.microsoft.com/en-us/windows-server/storage/refs/refs-overview
