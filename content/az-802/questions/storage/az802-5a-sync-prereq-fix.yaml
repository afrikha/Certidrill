id: az802-5a-sync-prereq-fix
objective: "5.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have the following environment:

    - A server named **FS1** runs Windows Server 2022 Standard. Its folder E:\Data is on a volume formatted with ReFS.
    - A Storage Sync Service named **sss1** is deployed in East US. FS1 is registered with sss1.
    - A storage account named **contosodata01** in West US contains an SMB Azure file share named **data**.

    You need to sync the content of E:\Data with an Azure file share by using sss1.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de l'environnement suivant :

    - Un serveur nommé **FS1** exécute Windows Server 2022 Standard. Son dossier E:\Data se trouve sur un volume formaté en ReFS.
    - Un service de synchronisation de stockage nommé **sss1** est déployé dans la région East US. FS1 est inscrit auprès de sss1.
    - Un compte de stockage nommé **contosodata01**, situé dans la région West US, contient un partage de fichiers Azure SMB nommé **data**.

    Vous devez synchroniser le contenu de E:\Data avec un partage de fichiers Azure à l'aide de sss1.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Move the data to a volume of FS1 that is formatted with NTFS.", fr: "Déplacer les données vers un volume de FS1 formaté en NTFS." } }
    - { id: b, text: { en: "Allow outbound TCP port 445 from FS1 to contosodata01.", fr: "Autoriser le port TCP 445 sortant de FS1 vers contosodata01." } }
    - { id: c, text: { en: "Use an Azure file share in a storage account located in East US.", fr: "Utiliser un partage de fichiers Azure situé dans un compte de stockage de la région East US." } }
    - { id: d, text: { en: "Assign Storage File Data SMB Share Contributor on data to the computer account of FS1.", fr: "Attribuer Storage File Data SMB Share Contributor sur data au compte d'ordinateur de FS1." } }
    - { id: e, text: { en: "Upgrade FS1 to Windows Server 2022 Datacenter.", fr: "Mettre à niveau FS1 vers Windows Server 2022 Datacenter." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Azure File Sync supports only directly attached NTFS volumes; ReFS, FAT and FAT32 are not supported, so the data must be on an NTFS volume. The storage account of the cloud endpoint must be in the same region as the Storage Sync Service, so the share must be in East US.
    fr: |
      Azure File Sync ne prend en charge que les volumes NTFS en attachement direct ; ReFS, FAT et FAT32 ne sont pas pris en charge : les données doivent donc se trouver sur un volume NTFS. Le compte de stockage du point de terminaison cloud doit être dans la même région que le service de synchronisation de stockage : le partage doit donc se trouver dans la région East US.
  options:
    b: { en: "Azure File Sync uploads and downloads data over HTTPS on port 443; it never uses SMB between the server and the share.", fr: "Azure File Sync charge et télécharge les données en HTTPS sur le port 443 ; il n'utilise jamais SMB entre le serveur et le partage." }
    d: { en: "The registered server uses its own identity with the Storage Sync Service; SMB share-level roles are not involved, and computer accounts cannot receive them.", fr: "Le serveur inscrit utilise sa propre identité auprès du service de synchronisation de stockage ; les rôles au niveau du partage SMB n'interviennent pas, et les comptes d'ordinateur ne peuvent pas les recevoir." }
    e: { en: "Azure File Sync supports the Standard edition of Windows Server 2022.", fr: "Azure File Sync prend en charge l'édition Standard de Windows Server 2022." }
references:
  - title: Plan an Azure File Sync deployment
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-planning
  - title: Deploy Azure File Sync
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide
