id: az802-5a-perm-effective-statements
objective: "5.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    A storage account named **adatumfs01** uses AD DS authentication. All the users below are synced to Microsoft Entra ID and are members of Domain Users. User1 is a member of the synced group Design-Team; User2 is not.

    | Layer | Configuration |
    | --- | --- |
    | Default share-level permission of adatumfs01 | Storage File Data SMB Share Reader |
    | Role assignment on the share design | Design-Team: Storage File Data SMB Share Contributor |
    | Windows ACL of the root of design (inherited by all items) | Design-Team: Modify; Domain Users: Read & execute |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un compte de stockage nommé **adatumfs01** utilise l'authentification AD DS. Tous les utilisateurs ci-dessous sont synchronisés avec Microsoft Entra ID et sont membres de Domain Users. User1 est membre du groupe synchronisé Design-Team ; User2 ne l'est pas.

    | Niveau | Configuration |
    | --- | --- |
    | Autorisation par défaut au niveau du partage d'adatumfs01 | Storage File Data SMB Share Reader |
    | Attribution de rôle sur le partage design | Design-Team : Storage File Data SMB Share Contributor |
    | Liste ACL Windows de la racine de design (héritée par tous les éléments) | Design-Team : Modification ; Domain Users : Lecture et exécution |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          User1 can create and modify files in the design share.
        fr: |
          User1 peut créer et modifier des fichiers dans le partage design.
    - id: s2
      text:
        en: |
          User2 can open the files in the design share.
        fr: |
          User2 peut ouvrir les fichiers du partage design.
    - id: s3
      text:
        en: |
          User1 can change the Windows ACLs of the files in the design share.
        fr: |
          User1 peut modifier les listes ACL Windows des fichiers du partage design.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      When both a default share-level permission and a role assignment apply, the user gets the higher one, and then the most restrictive of the share-level and Windows ACL permissions applies. User1 has Contributor at the share level and Modify in the ACL, so User1 can create and modify files. User2 gets Reader from the default share-level permission and Read & execute from the ACL, so User2 can open files. Changing ACLs requires a share-level role such as Storage File Data SMB Share Elevated Contributor, which Contributor does not include.
    fr: "Quand une autorisation par défaut au niveau du partage et une attribution de rôle s'appliquent toutes les deux, l'utilisateur obtient la plus élevée, puis la plus restrictive des autorisations au niveau du partage et des listes ACL Windows s'applique. User1 a Contributor au niveau du partage et Modification dans la liste ACL : il peut créer et modifier des fichiers. User2 obtient Reader par l'autorisation par défaut au niveau du partage et Lecture et exécution par la liste ACL : il peut ouvrir les fichiers. Modifier les listes ACL exige un rôle au niveau du partage comme Storage File Data SMB Share Elevated Contributor, que Contributor n'inclut pas."
references:
  - title: Assign Share-Level Permissions for Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions
  - title: Configure Directory and File-Level Permissions for Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-configure-file-level-permissions
