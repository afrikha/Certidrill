id: az802-5a-dfsr-unsupported-locations
objective: "5.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to replicate data between two file servers, **FS1** and **FS2**, by using DFS Replication. FS1 is a node of a failover cluster. You consider the following locations for the replicated folder on FS1.

    Which two locations cannot host the replicated folder?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de répliquer des données entre deux serveurs de fichiers, **FS1** et **FS2**, à l'aide de la réplication DFS. FS1 est un nœud d'un cluster de basculement. Vous envisagez les emplacements suivants pour le dossier répliqué sur FS1.

    Quels sont les deux emplacements qui ne peuvent pas héberger le dossier répliqué ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A folder on volume E:, which is formatted with ReFS", fr: "Un dossier du volume E:, formaté en ReFS" } }
    - { id: b, text: { en: "A folder on volume D:, which is formatted with NTFS and is not shared", fr: "Un dossier du volume D:, formaté en NTFS et non partagé" } }
    - { id: c, text: { en: "A folder on a Cluster Shared Volume of the cluster", fr: "Un dossier d'un volume partagé de cluster (CSV) du cluster" } }
    - { id: d, text: { en: "A folder on volume F:, which is formatted with NTFS and is a folder target in a DFS namespace", fr: "Un dossier du volume F:, formaté en NTFS et cible de dossier d'un espace de noms DFS" } }
    - { id: e, text: { en: "A folder on volume G:, which is formatted with NTFS and already stores a different replicated folder in another path", fr: "Un dossier du volume G:, formaté en NTFS, qui stocke déjà un autre dossier répliqué dans un autre chemin" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      DFS Replication requires NTFS because it relies on the NTFS change journal, so ReFS and FAT volumes are not supported. DFS Replication also does not support replicating files on Cluster Shared Volumes.
    fr: |
      La réplication DFS exige NTFS car elle s'appuie sur le journal des modifications NTFS : les volumes ReFS et FAT ne sont pas pris en charge. La réplication DFS ne prend pas non plus en charge la réplication de fichiers situés sur des volumes partagés de cluster.
  options:
    b: { en: "Replicated folders do not need to be shared folders or part of a namespace.", fr: "Les dossiers répliqués n'ont pas besoin d'être des dossiers partagés ni de faire partie d'un espace de noms." }
    d: { en: "Replicating folder targets of a namespace is a common DFS Replication use.", fr: "Répliquer les cibles de dossier d'un espace de noms est un usage courant de la réplication DFS." }
    e: { en: "A member can store several replicated folders, on the same or on different volumes.", fr: "Un membre peut stocker plusieurs dossiers répliqués, sur le même volume ou sur des volumes différents." }
references:
  - title: DFS Replication - FAQ
    url: https://learn.microsoft.com/en-us/windows-server/storage/dfs-replication/dfsr-faq
  - title: Distributed File System (DFS) Replication
    url: https://learn.microsoft.com/en-us/windows-server/storage/dfs-replication/dfs-replication-overview
