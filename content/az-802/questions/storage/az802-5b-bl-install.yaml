id: az802-5b-bl-install
objective: "5.3.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A server named **SRV10** runs Windows Server 2025 Datacenter and has a TPM 2.0. You plan to encrypt the operating system volume of SRV10 by using BitLocker Drive Encryption.

    On SRV10, the `Enable-BitLocker` cmdlet isn't recognized, and BitLocker Drive Encryption doesn't appear in Control Panel.

    What should you do first?
  fr: |
    Un serveur nommé **SRV10** exécute Windows Server 2025 Datacenter et possède un TPM 2.0. Vous prévoyez de chiffrer le volume du système d'exploitation de SRV10 avec le chiffrement de lecteur BitLocker.

    Sur SRV10, la cmdlet `Enable-BitLocker` n'est pas reconnue, et Chiffrement de lecteur BitLocker n'apparaît pas dans le Panneau de configuration.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Install the BitLocker feature, and then restart SRV10.", fr: "Installer la fonctionnalité BitLocker, puis redémarrer SRV10." } }
    - { id: b, text: { en: "Install the BitLocker Network Unlock feature, and then restart SRV10.", fr: "Installer la fonctionnalité Déverrouillage réseau BitLocker, puis redémarrer SRV10." } }
    - { id: c, text: { en: "Clear the TPM by running Clear-Tpm, and then restart SRV10.", fr: "Effacer le TPM en exécutant Clear-Tpm, puis redémarrer SRV10." } }
    - { id: d, text: { en: "Import the BitLocker module by running Import-Module, and then restart SRV10.", fr: "Importer le module BitLocker en exécutant Import-Module, puis redémarrer SRV10." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      On Windows Server, BitLocker is an optional feature. You install it, for example with Install-WindowsFeature -Name BitLocker -IncludeAllSubFeature -IncludeManagementTools, and restart the server; the BitLocker cmdlets and management tools are then available.
    fr: |
      Sur Windows Server, BitLocker est une fonctionnalité facultative. Vous l'installez, par exemple avec Install-WindowsFeature -Name BitLocker -IncludeAllSubFeature -IncludeManagementTools, puis vous redémarrez le serveur ; les cmdlets et les outils de gestion de BitLocker sont alors disponibles.
  options:
    c:
      en: |
        Clearing the TPM removes its keys and doesn't install BitLocker; on an encrypted computer, it would also trigger recovery.
      fr: |
        Effacer le TPM supprime ses clés et n'installe pas BitLocker ; sur un ordinateur chiffré, cela déclencherait en outre la récupération.
    b:
      en: |
        The BitLocker Network Unlock feature is installed on the WDS server that unlocks clients at startup; it doesn't add BitLocker to SRV10.
      fr: |
        La fonctionnalité Déverrouillage réseau BitLocker s'installe sur le serveur WDS qui déverrouille les clients au démarrage ; elle n'ajoute pas BitLocker à SRV10.
    d:
      en: |
        The BitLocker module isn't present until the BitLocker feature is installed.
      fr: |
        Le module BitLocker n'est présent qu'une fois la fonctionnalité BitLocker installée.
references:
  - title: Use BitLocker with Cluster Shared Volumes (CSV)
    url: https://learn.microsoft.com/en-us/windows-server/failover-clustering/bitlocker-on-csv-in-ws-2022
