id: az802-5b-fs-format-dropdown
objective: "5.3.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A server named **FS15** runs Windows Server 2025. You plan to format a new 20-TB volume **F:** that will meet the following requirements:

    - Store VHDX files that are larger than 1 TB.
    - Use Data Deduplication.
    - Support per-user disk quotas.

    You need to format F: by using the file system and options that Microsoft recommends for this use.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur nommé **FS15** exécute Windows Server 2025. Vous prévoyez de formater un nouveau volume **F:** de 20 To qui doit respecter les exigences suivantes :

    - Stocker des fichiers VHDX de plus de 1 To.
    - Utiliser la déduplication des données.
    - Prendre en charge des quotas de disque par utilisateur.

    Vous devez formater F: avec le système de fichiers et les options que Microsoft recommande pour cet usage.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Format-Volume -DriveLetter F -FileSystem [[fs]] -AllocationUnitSize [[au]] [[opt]]
  slots:
    - id: fs
      options:
        - { id: ntfs, text: NTFS }
        - { id: refs, text: ReFS }
        - { id: exfat, text: exFAT }
    - id: au
      options:
        - { id: a4k, text: "4096" }
        - { id: a64k, text: "65536" }
        - { id: a2m, text: "2097152" }
    - id: opt
      options:
        - { id: frs, text: -UseLargeFRS }
        - { id: integrity, text: "-SetIntegrityStreams $true" }
        - { id: compress, text: -Compress }
answer:
  values: { fs: ntfs, au: a64k, opt: frs }
explanation:
  correct:
    en: |
      Disk quotas aren't available on ReFS, so the volume must use NTFS. For NTFS volumes that host large VHDX files or use Data Deduplication, Microsoft recommends a 64-KB allocation unit size (65536) with large file record segments (-UseLargeFRS).
    fr: |
      Les quotas de disque ne sont pas disponibles sur ReFS : le volume doit donc utiliser NTFS. Pour les volumes NTFS qui hébergent de gros fichiers VHDX ou utilisent la déduplication des données, Microsoft recommande une taille d'unité d'allocation de 64 Ko (65536) avec de grands segments d'enregistrement de fichier (-UseLargeFRS).
  options:
    refs: { en: "ReFS doesn't support disk quotas.", fr: "ReFS ne prend pas en charge les quotas de disque." }
    exfat: { en: "exFAT supports neither disk quotas nor Data Deduplication.", fr: "exFAT ne prend en charge ni les quotas de disque ni la déduplication des données." }
    a4k: { en: "A 4-KB allocation unit limits an NTFS volume to 16 TB and isn't the recommendation for large files.", fr: "Une unité d'allocation de 4 Ko limite un volume NTFS à 16 To et n'est pas la recommandation pour les gros fichiers." }
    a2m: { en: "A 2-MB allocation unit isn't the recommended size for deduplicated or large-VHDX volumes.", fr: "Une unité d'allocation de 2 Mo n'est pas la taille recommandée pour les volumes dédupliqués ou contenant de gros VHDX." }
    integrity: { en: "Integrity streams are a ReFS feature.", fr: "Les flux d'intégrité sont une fonctionnalité de ReFS." }
    compress: { en: "-Compress enables NTFS compression of all files, which isn't the recommendation for this workload.", fr: "-Compress active la compression NTFS de tous les fichiers, ce qui n'est pas la recommandation pour cette charge de travail." }
references:
  - title: NTFS overview
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/ntfs-overview
  - title: Format-Volume
    url: https://learn.microsoft.com/en-us/powershell/module/storage/format-volume
