id: az802-5b-disk-gpt-large
objective: "5.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a server named **Server1** that runs Windows Server 2025. You attach a new 6-TB data disk to Server1. In Disk Management, the disk appears as **Disk 2**, online and not initialized.

    You need to create a single NTFS volume named **E:** that uses the entire capacity of Disk 2.

    What should you do first?
  fr: |
    Vous disposez d'un serveur nommé **Server1** qui exécute Windows Server 2025. Vous attachez un nouveau disque de données de 6 To à Server1. Dans la Gestion des disques, le disque apparaît sous le nom **Disque 2**, en ligne et non initialisé.

    Vous devez créer un volume NTFS unique nommé **E:** qui utilise toute la capacité du Disque 2.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Initialize Disk 2 with the MBR partition style.", fr: "Initialiser le Disque 2 avec le style de partition MBR." } }
    - { id: b, text: { en: "Initialize Disk 2 with the MBR partition style, and then create an extended partition.", fr: "Initialiser le Disque 2 avec le style de partition MBR, puis créer une partition étendue." } }
    - { id: c, text: { en: "Initialize Disk 2 with the GPT partition style.", fr: "Initialiser le Disque 2 avec le style de partition GPT." } }
    - { id: d, text: { en: "Format Disk 2 with NTFS and a 64-KB allocation unit size.", fr: "Formater le Disque 2 en NTFS avec une taille d'unité d'allocation de 64 Ko." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A new disk must be initialized before you can create a volume on it. GPT is the partition style that supports volumes larger than 2 TB, so it is the only style that lets a single volume use all 6 TB.
    fr: |
      Un nouveau disque doit être initialisé avant que vous puissiez y créer un volume. GPT est le style de partition qui prend en charge les volumes de plus de 2 To ; c'est donc le seul qui permet à un volume unique d'utiliser les 6 To.
  options:
    a:
      en: |
        MBR doesn't support volumes larger than 2 TB, so most of the disk would stay unusable for a single volume.
      fr: |
        MBR ne prend pas en charge les volumes de plus de 2 To ; la majeure partie du disque resterait inutilisable pour un volume unique.
    b:
      en: |
        An extended partition doesn't remove the 2-TB limit of the MBR partition style.
      fr: |
        Une partition étendue ne supprime pas la limite de 2 To du style de partition MBR.
    d:
      en: |
        A disk that isn't initialized has no partition, so there is no volume to format yet.
      fr: |
        Un disque non initialisé n'a aucune partition : il n'existe encore aucun volume à formater.
references:
  - title: Initialize new disks
    url: https://learn.microsoft.com/en-us/windows-server/storage/disk-management/initialize-new-disks
