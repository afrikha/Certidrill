id: az802-5b-blr-helpdesk-multi
objective: "5.3.11"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named contoso.com. A Group Policy setting backs up the BitLocker recovery passwords of all servers to AD DS, and members of Domain Admins can see them.

    Members of a group named **HelpDesk** use Active Directory Users and Computers on their administrative workstations. They see no BitLocker Recovery tab on computer objects.

    You need HelpDesk members to be able to find the recovery password of a server from the password ID shown on its recovery screen. The solution must follow the principle of least privilege.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine Active Directory nommé contoso.com. Un paramètre de stratégie de groupe sauvegarde dans AD DS les mots de passe de récupération BitLocker de tous les serveurs, et les membres de Domain Admins peuvent les voir.

    Les membres d'un groupe nommé **HelpDesk** utilisent Utilisateurs et ordinateurs Active Directory sur leurs stations de travail d'administration. Ils ne voient aucun onglet BitLocker Recovery sur les objets ordinateur.

    Les membres de HelpDesk doivent pouvoir trouver le mot de passe de récupération d'un serveur à partir de l'ID de mot de passe affiché sur son écran de récupération. La solution doit respecter le principe du moindre privilège.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install the BitLocker Recovery Password Viewer on the HelpDesk workstations.", fr: "Installer la visionneuse de mots de passe de récupération BitLocker sur les stations de travail de HelpDesk." } }
    - { id: b, text: { en: "Add the HelpDesk group to the Domain Admins group.", fr: "Ajouter le groupe HelpDesk au groupe Domain Admins." } }
    - { id: c, text: { en: "Delegate read access to the BitLocker recovery information objects to HelpDesk.", fr: "Déléguer à HelpDesk l'accès en lecture aux objets d'informations de récupération BitLocker." } }
    - { id: d, text: { en: "Add the HelpDesk group to the Backup Operators group of the domain.", fr: "Ajouter le groupe HelpDesk au groupe Backup Operators du domaine." } }
    - { id: e, text: { en: "Configure the Group Policy setting to also back up recovery passwords to Microsoft Entra ID.", fr: "Configurer le paramètre de stratégie de groupe pour sauvegarder aussi les mots de passe de récupération dans Microsoft Entra ID." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The BitLocker Recovery Password Viewer is an RSAT extension of Active Directory Users and Computers that adds the BitLocker Recovery tab and the Find BitLocker Recovery Password search by the first eight characters of the password ID. By default, only Domain Admins can read the recovery information, so you delegate read access to HelpDesk.
    fr: |
      La visionneuse de mots de passe de récupération BitLocker est une extension RSAT d'Utilisateurs et ordinateurs Active Directory qui ajoute l'onglet BitLocker Recovery et la recherche Find BitLocker Recovery Password par les huit premiers caractères de l'ID de mot de passe. Par défaut, seuls les Domain Admins peuvent lire les informations de récupération : vous déléguez donc l'accès en lecture à HelpDesk.
  options:
    b:
      en: |
        Domain Admins can read the recovery information, but membership grants far more than required.
      fr: |
        Les Domain Admins peuvent lire les informations de récupération, mais cette appartenance accorde bien plus que nécessaire.
    d:
      en: |
        By default, only Domain Admins can read BitLocker recovery information in AD DS; Backup Operators membership doesn't grant it.
      fr: |
        Par défaut, seuls les Domain Admins peuvent lire les informations de récupération BitLocker dans AD DS ; l'appartenance à Backup Operators ne l'accorde pas.
    e:
      en: |
        The help desk uses AD DS, where the passwords are already stored; Microsoft Entra ID adds nothing to their tools.
      fr: |
        Le support utilise AD DS, où les mots de passe sont déjà stockés ; Microsoft Entra ID n'apporte rien à ses outils.
references:
  - title: BitLocker recovery process
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/recovery-process
