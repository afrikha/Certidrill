id: az802-cs3a-dfsr-migration
objective: "5.1.5"
type: ordering
caseStudy: az802-cs3a-bellows-college
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the file sync requirement. Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez satisfaire l'exigence de synchronisation de fichiers. Quelles sont les quatre actions que vous devez effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et classez-les dans l'ordre correct.
body:
  count: 4
  actions:
    - id: fs1-endpoint
      text: { en: "Create a server endpoint for D:\\Courses on FS1 without cloud tiering", fr: "Créer un point de terminaison de serveur pour D:\\Courses sur FS1 sans hiérarchisation cloud" }
    - id: wait-upload
      text: { en: "Wait until all the data of FS1 has synced to the courses file share", fr: "Attendre que toutes les données de FS1 soient synchronisées vers le partage de fichiers courses" }
    - id: disable-dfsr
      text: { en: "Disable DFS Replication for RG-Courses", fr: "Désactiver la réplication DFS pour RG-Courses" }
    - id: other-endpoints
      text: { en: "Create server endpoints for D:\\Courses on FS2 and FS3 without cloud tiering", fr: "Créer des points de terminaison de serveur pour D:\\Courses sur FS2 et FS3 sans hiérarchisation cloud" }
    - id: all-endpoints
      text: { en: "Create server endpoints for D:\\Courses on FS1, FS2 and FS3 at the same time", fr: "Créer en même temps des points de terminaison de serveur pour D:\\Courses sur FS1, FS2 et FS3" }
    - id: tiering-fs1
      text: { en: "Enable cloud tiering on the server endpoint of FS1", fr: "Activer la hiérarchisation cloud sur le point de terminaison de serveur de FS1" }
    - id: remove-namespace
      text: { en: "Remove the FS2 and FS3 folder targets from the DFS namespace", fr: "Supprimer les cibles de dossier FS2 et FS3 de l'espace de noms DFS" }
answer:
  sequence: [fs1-endpoint, wait-upload, disable-dfsr, other-endpoints]
explanation:
  correct:
    en: |
      The recommended migration starts with a server endpoint on the server that holds the full data set (FS1), without cloud tiering, and waits until all its data has synced to the cloud endpoint. You then disable DFS Replication and only afterwards create server endpoints on the remaining servers, again without cloud tiering; DFS-R is retired once sync has finished, and cloud tiering can be enabled at the very end.
    fr: |
      La migration recommandée commence par un point de terminaison de serveur sur le serveur qui détient le jeu de données complet (FS1), sans hiérarchisation cloud, puis attend que toutes ses données soient synchronisées vers le point de terminaison cloud. Vous désactivez ensuite la réplication DFS, puis seulement après vous créez les points de terminaison de serveur sur les autres serveurs, toujours sans hiérarchisation cloud ; DFS-R est retiré une fois la synchronisation terminée, et la hiérarchisation cloud peut être activée tout à la fin.
  options:
    all-endpoints:
      en: |
        Creating every server endpoint at once makes DFS-R and Azure File Sync replicate the same files at the same time, which the procedure avoids by starting with the server that has the full data set.
      fr: |
        Créer tous les points de terminaison de serveur en même temps fait répliquer les mêmes fichiers par DFS-R et Azure File Sync simultanément, ce que la procédure évite en commençant par le serveur qui détient le jeu de données complet.
    tiering-fs1:
      en: |
        Cloud tiering must stay disabled during the migration; it can be enabled only after DFS-R is retired.
      fr: |
        La hiérarchisation cloud doit rester désactivée pendant la migration ; elle ne peut être activée qu'après le retrait de DFS-R.
    remove-namespace:
      en: |
        The DFS namespace can keep its folder targets, because FS2 and FS3 keep serving D:\Courses through Azure File Sync.
      fr: |
        L'espace de noms DFS peut conserver ses cibles de dossier, car FS2 et FS3 continuent de servir D:\Courses grâce à Azure File Sync.
references:
  - title: Deploy Azure File Sync
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide
