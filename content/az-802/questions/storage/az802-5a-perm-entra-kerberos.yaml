id: az802-5a-perm-entra-kerberos
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has an AD DS forest whose users are synced to Microsoft Entra ID. Field engineers use Microsoft Entra joined Windows 11 laptops that never connect to the corporate network, so they cannot reach any domain controller. Outbound TCP port 445 is allowed from the networks they use.

    You need the engineers to access an SMB Azure file share named **manuals** with their hybrid identities. Access inside manuals must still be controlled by Windows ACLs.

    Which identity source should you enable on the storage account?
  fr: |
    Tailspin Toys dispose d'une forêt AD DS dont les utilisateurs sont synchronisés avec Microsoft Entra ID. Les techniciens itinérants utilisent des ordinateurs portables Windows 11 joints à Microsoft Entra qui ne se connectent jamais au réseau de l'entreprise : ils ne peuvent joindre aucun contrôleur de domaine. Le port TCP 445 sortant est autorisé depuis les réseaux qu'ils utilisent.

    Les techniciens doivent accéder à un partage de fichiers Azure SMB nommé **manuals** avec leurs identités hybrides. L'accès dans manuals doit toujours être contrôlé par des listes ACL Windows.

    Quelle source d'identité devez-vous activer sur le compte de stockage ?
body:
  options:
    - { id: a, text: "On-premises AD DS" }
    - { id: b, text: "Microsoft Entra Domain Services" }
    - { id: c, text: "Microsoft Entra Kerberos" }
    - { id: d, text: { en: "Microsoft Entra ID authorization over the REST API (OAuth)", fr: "Autorisation Microsoft Entra ID sur l'API REST (OAuth)" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With Microsoft Entra Kerberos, Microsoft Entra ID issues the Kerberos tickets for the file share, so Microsoft Entra joined or hybrid joined clients can use hybrid identities without network connectivity to domain controllers. Share-level permissions and Windows ACLs still apply.
    fr: |
      Avec Microsoft Entra Kerberos, Microsoft Entra ID émet les tickets Kerberos pour le partage de fichiers : les clients joints ou joints en mode hybride à Microsoft Entra peuvent utiliser des identités hybrides sans connectivité réseau vers les contrôleurs de domaine. Les autorisations au niveau du partage et les listes ACL Windows s'appliquent toujours.
  options:
    a:
      en: |
        AD DS authentication requires clients to have unimpeded network connectivity to the domain controllers.
      fr: |
        L'authentification AD DS exige que les clients disposent d'une connectivité réseau directe vers les contrôleurs de domaine.
    b:
      en: |
        Microsoft Entra Domain Services requires clients joined to the managed domain, or connectivity to its domain controllers.
      fr: |
        Microsoft Entra Domain Services exige des clients joints au domaine managé, ou une connectivité vers ses contrôleurs de domaine.
    d:
      en: |
        OAuth over REST is not used to mount a share over SMB from Windows clients.
      fr: |
        OAuth sur REST ne sert pas à monter un partage en SMB depuis des clients Windows.
references:
  - title: Overview - Azure Files Identity-Based Authentication
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-active-directory-overview
