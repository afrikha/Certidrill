id: az802-5a-dfs-namespace-type
objective: "5.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an AD DS domain named adatum.com at the Windows Server 2016 domain and forest functional levels. You plan a DFS namespace named **Public** on two Windows Server 2025 servers, **NS1** and **NS2**.

    The namespace must meet the following requirements:

    - The namespace path does not contain the name of a server.
    - The namespace stays available if NS1 or NS2 fails, without a failover cluster.
    - Users see only the DFS folders that they have permission to access.

    Which type of namespace should you create?
  fr: |
    Adatum dispose d'un domaine AD DS nommé adatum.com aux niveaux fonctionnels de domaine et de forêt Windows Server 2016. Vous prévoyez un espace de noms DFS nommé **Public** sur deux serveurs Windows Server 2025, **NS1** et **NS2**.

    L'espace de noms doit répondre aux exigences suivantes :

    - Le chemin de l'espace de noms ne contient pas le nom d'un serveur.
    - L'espace de noms reste disponible si NS1 ou NS2 tombe en panne, sans cluster de basculement.
    - Les utilisateurs ne voient que les dossiers DFS auxquels ils ont l'autorisation d'accéder.

    Quel type d'espace de noms devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A stand-alone namespace hosted on a failover cluster of NS1 and NS2", fr: "Un espace de noms autonome hébergé sur un cluster de basculement de NS1 et NS2" } }
    - { id: b, text: { en: "A domain-based namespace in Windows 2000 Server mode on NS1 and NS2", fr: "Un espace de noms de domaine en mode Windows 2000 Server sur NS1 et NS2" } }
    - { id: c, text: { en: "A domain-based namespace in Windows Server 2008 mode on NS1 and NS2", fr: "Un espace de noms de domaine en mode Windows Server 2008 sur NS1 et NS2" } }
    - { id: d, text: { en: "Two stand-alone namespaces, one on NS1 and one on NS2", fr: "Deux espaces de noms autonomes, l'un sur NS1 et l'autre sur NS2" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A domain-based namespace uses a path such as \\adatum.com\Public, which hides the server names, and several namespace servers in the same domain keep it available. Only the Windows Server 2008 mode supports access-based enumeration; it requires the Windows Server 2003 forest functional level and the Windows Server 2008 domain functional level, which adatum.com exceeds.
    fr: |
      Un espace de noms de domaine utilise un chemin comme \\adatum.com\Public, qui masque les noms des serveurs, et plusieurs serveurs d'espaces de noms du même domaine le maintiennent disponible. Seul le mode Windows Server 2008 prend en charge l'énumération basée sur l'accès ; il exige le niveau fonctionnel de forêt Windows Server 2003 et le niveau fonctionnel de domaine Windows Server 2008, qu'adatum.com dépasse.
  options:
    a:
      en: |
        A stand-alone namespace path contains the server or cluster name, and the requirement excludes a failover cluster.
      fr: |
        Le chemin d'un espace de noms autonome contient le nom du serveur ou du cluster, et l'exigence exclut un cluster de basculement.
    b:
      en: |
        The Windows 2000 Server mode does not support access-based enumeration.
      fr: |
        Le mode Windows 2000 Server ne prend pas en charge l'énumération basée sur l'accès.
    d:
      en: |
        Two stand-alone namespaces have two different paths that contain server names, and neither one protects the other.
      fr: |
        Deux espaces de noms autonomes ont deux chemins différents qui contiennent des noms de serveurs, et aucun ne protège l'autre.
references:
  - title: Choose a Namespace Type
    url: https://learn.microsoft.com/en-us/windows-server/storage/dfs-namespaces/choose-a-namespace-type
