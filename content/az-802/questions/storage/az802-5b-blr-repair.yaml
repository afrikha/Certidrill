id: az802-5b-blr-repair
objective: "5.3.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A server named **SRV12** runs Windows Server 2025. Data volume E: is encrypted by BitLocker and is on a failing disk. The BitLocker metadata of E: is corrupted, and unlocking E: with its recovery password fails.

    You have the recovery password of E:. You retrieved the key package of E: from AD DS and saved it to F:\Pkg. Volume G: is a new, empty volume that is larger than E:.

    You need to recover the data of E: to G:.

    Which command should you run?
  fr: |
    Un serveur nommé **SRV12** exécute Windows Server 2025. Le volume de données E: est chiffré par BitLocker et se trouve sur un disque défaillant. Les métadonnées BitLocker de E: sont endommagées, et le déverrouillage de E: avec son mot de passe de récupération échoue.

    Vous disposez du mot de passe de récupération de E:. Vous avez récupéré le package de clé de E: dans AD DS et l'avez enregistré dans F:\Pkg. Le volume G: est un nouveau volume vide plus grand que E:.

    Vous devez récupérer les données de E: vers G:.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "repair-bde G: E: -rp 111111-222222-333333-444444-555555-666666-777777-888888 -kp F:\\Pkg" }
    - { id: b, text: "repair-bde E: G: -rp 111111-222222-333333-444444-555555-666666-777777-888888" }
    - { id: c, text: "repair-bde E: G: -rp 111111-222222-333333-444444-555555-666666-777777-888888 -kp F:\\Pkg" }
    - { id: d, text: "manage-bde -unlock E: -RecoveryPassword 111111-222222-333333-444444-555555-666666-777777-888888" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      repair-bde takes the damaged BitLocker volume first and the output volume second, and writes the decrypted content to the output volume. When the BitLocker metadata is corrupted, you must supply the backup key package (-kp) in addition to the recovery password (-rp) or recovery key.
    fr: |
      repair-bde prend d'abord le volume BitLocker endommagé, puis le volume de sortie, et écrit le contenu déchiffré sur le volume de sortie. Lorsque les métadonnées BitLocker sont endommagées, vous devez fournir le package de clé de sauvegarde (-kp) en plus du mot de passe de récupération (-rp) ou de la clé de récupération.
  options:
    a:
      en: |
        This command treats G: as the damaged volume and E: as the output volume, and repair-bde completely overwrites the output volume.
      fr: |
        Cette commande traite G: comme le volume endommagé et E: comme le volume de sortie, et repair-bde écrase entièrement le volume de sortie.
    b:
      en: |
        Without -kp, repair-bde searches E: itself for a key package, and the metadata of E: is corrupted, so the backup key package is required.
      fr: |
        Sans -kp, repair-bde cherche un package de clé sur E: même, dont les métadonnées sont endommagées : le package de clé de sauvegarde est donc nécessaire.
    d:
      en: |
        Unlocking with the recovery password has already failed because the metadata is corrupted.
      fr: |
        Le déverrouillage avec le mot de passe de récupération a déjà échoué, car les métadonnées sont endommagées.
references:
  - title: repair-bde
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/repair-bde
