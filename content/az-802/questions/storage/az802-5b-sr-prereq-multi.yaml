id: az802-5b-sr-prereq-multi
objective: "5.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Two servers named **SRV3** and **SRV4** run Windows Server 2025 Datacenter and are in different sites. You plan a synchronous Storage Replica partnership for volume D:. The following table shows the volumes that you prepared.

    | Server | Volume | Role | Size | Partition style | Media |
    | --- | --- | --- | --- | --- | --- |
    | SRV3 | D: | Data | 2 TB | GPT | HDD |
    | SRV3 | L: | Log | 20 GB | GPT | SSD |
    | SRV4 | D: | Data | 2.5 TB | GPT | HDD |
    | SRV4 | L: | Log | 20 GB | MBR | SSD |

    All data disks use the same sector size, and all log disks use the same sector size. The average round-trip latency between the sites is 2 ms, and TCP 445 is allowed in both directions.

    Which two issues must you correct before you create the partnership?

    NOTE: Each correct selection is worth one point.
  fr: |
    Deux serveurs nommés **SRV3** et **SRV4** exécutent Windows Server 2025 Datacenter et se trouvent dans des sites différents. Vous prévoyez un partenariat de réplica de stockage synchrone pour le volume D:. Le tableau suivant présente les volumes que vous avez préparés.

    | Serveur | Volume | Rôle | Taille | Style de partition | Support |
    | --- | --- | --- | --- | --- | --- |
    | SRV3 | D: | Données | 2 To | GPT | HDD |
    | SRV3 | L: | Journal | 20 Go | GPT | SSD |
    | SRV4 | D: | Données | 2,5 To | GPT | HDD |
    | SRV4 | L: | Journal | 20 Go | MBR | SSD |

    Tous les disques de données utilisent la même taille de secteur, et tous les disques de journal utilisent la même taille de secteur. La latence aller-retour moyenne entre les sites est de 2 ms, et TCP 445 est autorisé dans les deux sens.

    Quels sont les deux problèmes à corriger avant de créer le partenariat ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The data volumes don't have the same size.", fr: "Les volumes de données n'ont pas la même taille." } }
    - { id: b, text: { en: "The log volumes are smaller than the minimum size.", fr: "Les volumes de journal sont plus petits que la taille minimale." } }
    - { id: c, text: { en: "The log disk of SRV4 uses the MBR partition style.", fr: "Le disque de journal de SRV4 utilise le style de partition MBR." } }
    - { id: d, text: { en: "The data volumes are on HDDs instead of SSDs.", fr: "Les volumes de données se trouvent sur des HDD et non sur des SSD." } }
    - { id: e, text: { en: "The round-trip latency is too high for synchronous replication.", fr: "La latence aller-retour est trop élevée pour la réplication synchrone." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The two data volumes of a partnership must be identical in size, and both data and log disks must be initialized as GPT, not MBR. The other values meet the requirements.
    fr: |
      Les deux volumes de données d'un partenariat doivent avoir une taille identique, et les disques de données comme de journal doivent être initialisés en GPT, pas en MBR. Les autres valeurs respectent les exigences.
  options:
    b:
      en: |
        Log volumes must be at least 10 GB; 20 GB is enough (the log itself defaults to 8 GB).
      fr: |
        Les volumes de journal doivent faire au moins 10 Go ; 20 Go suffisent (le journal lui-même fait 8 Go par défaut).
    d:
      en: |
        Flash storage is recommended for the log volumes, which are on SSDs here; data volumes can use HDDs.
      fr: |
        Le stockage flash est recommandé pour les volumes de journal, qui sont ici sur des SSD ; les volumes de données peuvent utiliser des HDD.
    e:
      en: |
        Synchronous replication is recommended for an average round-trip latency of 5 ms or less, so 2 ms is suitable.
      fr: |
        La réplication synchrone est recommandée pour une latence aller-retour moyenne de 5 ms ou moins : 2 ms conviennent.
references:
  - title: Set up server-to-server storage replication by using Storage Replica
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-replica/server-to-server-storage-replication
