id: az802-sr1-two-shares-1
objective: "5.1.3"
type: series_yesno
series: az802-sr1-two-shares
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You create one sync group that contains both file shares and both folders.
  fr: Vous créez un groupe de synchronisation qui contient les deux partages de fichiers et les deux dossiers.
body:
  solution:
    en: |
      In Sync1, you create a sync group named **SG1**. You add a cloud endpoint for the projects file share and a cloud endpoint for the finance file share. You then add a server endpoint for **D:\Projects** on FS1 and a server endpoint for **D:\Finance** on FS1.
    fr: |
      Dans Sync1, vous créez un groupe de synchronisation nommé **SG1**. Vous ajoutez un point de terminaison cloud pour le partage de fichiers projects et un point de terminaison cloud pour le partage de fichiers finance. Vous ajoutez ensuite un point de terminaison de serveur pour **D:\Projects** sur FS1 et un point de terminaison de serveur pour **D:\Finance** sur FS1.
answer: { value: false }
explanation:
  correct:
    en: |
      A sync group contains exactly one cloud endpoint, which acts as the hub of the sync topology, and only one server endpoint per registered server. SG1 can therefore hold neither the second file share nor the second folder of FS1, and mixing them in one topology would not keep the content separate anyway.
    fr: |
      Un groupe de synchronisation contient exactement un point de terminaison cloud, qui sert de hub à la topologie de synchronisation, et un seul point de terminaison de serveur par serveur inscrit. SG1 ne peut donc contenir ni le second partage de fichiers ni le second dossier de FS1, et les réunir dans une même topologie ne garderait de toute façon pas le contenu séparé.
references:
  - title: Deploy Azure File Sync
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide
