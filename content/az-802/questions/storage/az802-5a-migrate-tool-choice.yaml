id: az802-5a-migrate-tool-choice
objective: "5.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans several migrations of SMB file shares to Azure Files. File ACLs, timestamps and attributes must be preserved in every case.

    Which tool should you use for each migration? To answer, drag the appropriate tools to the correct migrations. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit plusieurs migrations de partages de fichiers SMB vers Azure Files. Les listes ACL, les horodatages et les attributs des fichiers doivent être conservés dans tous les cas.

    Quel outil devez-vous utiliser pour chaque migration ? Pour répondre, faites glisser les outils appropriés vers les migrations correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mover, text: Azure Storage Mover }
    - { id: databox, text: Azure Data Box }
    - { id: afs, text: Azure File Sync }
    - { id: robocopy, text: Robocopy }
    - { id: azcopy, text: AzCopy }
    - { id: explorer, text: { en: "Azure Storage Explorer", fr: "Explorateur Stockage Azure" } }
  targets:
    - { id: nas, text: { en: "Move the shares of a NAS to Azure file shares only, with a fully managed migration service and a migration agent near the source.", fr: "Déplacer les partages d'un NAS vers des partages de fichiers Azure uniquement, avec un service de migration entièrement managé et un agent de migration proche de la source." } }
    - { id: offline, text: { en: "Transfer 300 TiB without using the WAN link, which is too slow for the migration window.", fr: "Transférer 300 Tio sans utiliser la liaison WAN, trop lente pour la fenêtre de migration." } }
    - { id: cache, text: { en: "Keep a Windows Server 2022 file server as an on-premises cache of the Azure file share after the migration.", fr: "Conserver un serveur de fichiers Windows Server 2022 comme cache local du partage de fichiers Azure après la migration." } }
    - { id: mirror, text: { en: "Run repeated mirror passes from a Windows server to a mounted Azure file share to shorten the cutover.", fr: "Exécuter des passes de mise en miroir répétées depuis un serveur Windows vers un partage de fichiers Azure monté pour raccourcir le basculement final." } }
answer:
  mapping: { nas: mover, offline: databox, cache: afs, mirror: robocopy }
explanation:
  correct:
    en: |
      Azure Storage Mover is a fully managed migration service whose agent runs near the source share. Azure Data Box moves large data sets offline and preserves ACLs, timestamps and attributes. Azure File Sync keeps Windows Server as a cache of the share (hybrid deployment). Robocopy with /MIR can be rerun so that only the changes are copied before the cutover. AzCopy can lose some file fidelity, and Azure Storage Explorer loses most of it, such as ACLs.
    fr: |
      Azure Storage Mover est un service de migration entièrement managé dont l'agent s'exécute près du partage source. Azure Data Box déplace hors connexion de grands volumes de données et conserve les listes ACL, les horodatages et les attributs. Azure File Sync conserve Windows Server comme cache du partage (déploiement hybride). Robocopy avec /MIR peut être réexécuté pour ne copier que les modifications avant le basculement final. AzCopy peut perdre une partie de la fidélité des fichiers, et l'Explorateur Stockage Azure en perd la plupart, comme les listes ACL.
references:
  - title: Migration Overview for SMB Azure File Shares
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-migration-overview
  - title: Introduction to Azure Storage Mover
    url: https://learn.microsoft.com/en-us/azure/storage-mover/service-overview
