id: az802-5a-share-effective-statements
objective: "5.2.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    A server named **FS2** shares D:\Projects as **Projects**. The permissions are configured as follows. All the NTFS entries are explicit entries on D:\Projects and are inherited by its content.

    | Layer | Group | Permission |
    | --- | --- | --- |
    | Share | Everyone | Read (Allow) |
    | Share | Engineers | Change (Allow) |
    | NTFS | Engineers | Modify (Allow) |
    | NTFS | Managers | Read & execute (Allow) |
    | NTFS | Managers | Write (Deny) |

    User1 is a member of Engineers. User2 is a member of Engineers and Managers. User3 is a member of Managers only.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur nommé **FS2** partage D:\Projects sous le nom **Projects**. Les autorisations sont configurées comme suit. Toutes les entrées NTFS sont des entrées explicites sur D:\Projects, héritées par son contenu.

    | Niveau | Groupe | Autorisation |
    | --- | --- | --- |
    | Partage | Everyone | Lecture (Autoriser) |
    | Partage | Engineers | Modifier (Autoriser) |
    | NTFS | Engineers | Modification (Autoriser) |
    | NTFS | Managers | Lecture et exécution (Autoriser) |
    | NTFS | Managers | Écriture (Refuser) |

    User1 est membre d'Engineers. User2 est membre d'Engineers et de Managers. User3 est membre de Managers uniquement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          User1 can modify files through \\FS2\Projects.
        fr: |
          User1 peut modifier des fichiers par \\FS2\Projects.
    - id: s2
      text:
        en: |
          User2 can create files through \\FS2\Projects.
        fr: |
          User2 peut créer des fichiers par \\FS2\Projects.
    - id: s3
      text:
        en: |
          User3 can open files through \\FS2\Projects.
        fr: |
          User3 peut ouvrir des fichiers par \\FS2\Projects.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Within each layer, the permissions of a user's groups add up and an explicit deny overrides an allow; over the network, the more restrictive of the two layers applies. User1 gets Change at the share and Modify in NTFS, so User1 can modify files. User2 gets Change at the share, but the Write deny of Managers blocks creating files in NTFS. User3 gets Read at the share through Everyone and Read & execute in NTFS, so User3 can open files.
    fr: |
      Dans chaque niveau, les autorisations des groupes d'un utilisateur s'additionnent et un refus explicite l'emporte sur une autorisation ; par le réseau, c'est le plus restrictif des deux niveaux qui s'applique. User1 obtient Modifier sur le partage et Modification en NTFS : il peut modifier des fichiers. User2 obtient Modifier sur le partage, mais le refus d'Écriture de Managers l'empêche de créer des fichiers en NTFS. User3 obtient Lecture sur le partage par Everyone et Lecture et exécution en NTFS : il peut ouvrir des fichiers.
references:
  - title: Share and NTFS Permissions on a File Server
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc754178(v=ws.11)
