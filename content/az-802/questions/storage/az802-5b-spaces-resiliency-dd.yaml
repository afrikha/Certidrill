id: az802-5b-spaces-resiliency-dd
objective: "5.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A stand-alone server named **FS7** runs Windows Server 2025. FS7 has a storage pool named **Pool1** that contains six physical disks.

    You need to create three virtual disks in Pool1 that meet the requirements shown in the answer area.

    Which resiliency type should you use for each virtual disk? To answer, drag the appropriate resiliency types to the correct virtual disks. Each resiliency type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur autonome nommé **FS7** exécute Windows Server 2025. FS7 possède un pool de stockage nommé **Pool1** qui contient six disques physiques.

    Vous devez créer dans Pool1 trois disques virtuels qui respectent les exigences présentées dans la zone de réponse.

    Quel type de résilience devez-vous utiliser pour chaque disque virtuel ? Pour répondre, faites glisser les types de résilience appropriés vers les disques virtuels correspondants. Chaque type de résilience peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: simple, text: { en: "Simple", fr: "Simple" } }
    - { id: two, text: { en: "Two-way mirror", fr: "Miroir bidirectionnel" } }
    - { id: three, text: { en: "Three-way mirror", fr: "Miroir tridirectionnel" } }
    - { id: parity, text: { en: "Parity", fr: "Parité" } }
  targets:
    - id: scratch
      text: { en: "Scratch: temporary render files recreated every night; maximize capacity and throughput", fr: "Scratch : fichiers de rendu temporaires recréés chaque nuit ; maximiser la capacité et le débit" }
    - id: archive
      text: { en: "Archive: backup files written sequentially; survive one disk failure; maximize usable capacity", fr: "Archive : fichiers de sauvegarde écrits séquentiellement ; supporter la panne d'un disque ; maximiser la capacité utile" }
    - id: finance
      text: { en: "Finance: departmental share; survive two simultaneous disk failures", fr: "Finance : partage de service ; supporter deux pannes de disque simultanées" }
answer:
  mapping: { scratch: simple, archive: parity, finance: three }
explanation:
  correct:
    en: |
      A simple space stripes data without redundancy, which gives the most capacity and throughput for data that is easy to recreate. Parity protects against one disk failure with less capacity overhead than a mirror and suits highly sequential workloads such as archives and backups. Only a three-way mirror, which needs at least five disks, survives two simultaneous disk failures.
    fr: |
      Un espace simple entrelace les données sans redondance, ce qui offre le plus de capacité et de débit pour des données faciles à recréer. La parité protège contre la panne d'un disque avec un surcoût de capacité inférieur à celui d'un miroir et convient aux charges très séquentielles comme les archives et les sauvegardes. Seul un miroir tridirectionnel, qui nécessite au moins cinq disques, supporte deux pannes de disque simultanées.
  options:
    two:
      en: |
        A two-way mirror survives one disk failure but uses half of the raw capacity, so it neither maximizes capacity for the archive nor protects against two failures.
      fr: |
        Un miroir bidirectionnel supporte la panne d'un disque mais utilise la moitié de la capacité brute : il ne maximise pas la capacité de l'archive et ne protège pas contre deux pannes.
references:
  - title: Deploy Storage Spaces on a stand-alone server
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/deploy-standalone-storage-spaces
