id: az802-5a-fsrm-feature-mapping
objective: "5.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    File Server Resource Manager (FSRM) is installed on a file server named **FS1**. You need to meet the following requirements on FS1.

    Which FSRM object should you configure for each requirement? To answer, drag the appropriate objects to the correct requirements. Each object may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le Gestionnaire de ressources du serveur de fichiers (FSRM) est installé sur un serveur de fichiers nommé **FS1**. Vous devez répondre aux exigences suivantes sur FS1.

    Quel objet FSRM devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les objets appropriés vers les exigences correspondantes. Chaque objet peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: classrule, text: { en: "A classification rule", fr: "Une règle de classification" } }
    - { id: fmtask, text: { en: "A file management task", fr: "Une tâche de gestion de fichiers" } }
    - { id: report, text: { en: "A scheduled storage report", fr: "Un rapport de stockage planifié" } }
    - { id: autoquota, text: { en: "An auto apply quota", fr: "Un quota à application automatique" } }
    - { id: screen, text: { en: "A file screen", fr: "Un filtre de fichiers" } }
    - { id: exception, text: { en: "A file screen exception", fr: "Une exception de filtre de fichiers" } }
  targets:
    - { id: tag, text: { en: "Mark every file that contains at least 10 credit card numbers as Confidential.", fr: "Marquer comme Confidential chaque fichier qui contient au moins 10 numéros de carte bancaire." } }
    - { id: expire, text: { en: "Move to an archive folder the files of D:\\Contracts that have not been modified for seven years.", fr: "Déplacer vers un dossier d'archive les fichiers de D:\\Contracts qui n'ont pas été modifiés depuis sept ans." } }
    - { id: weekly, text: { en: "Email the administrators a list of duplicate files and large files every Monday.", fr: "Envoyer par e-mail aux administrateurs une liste des fichiers en double et des fichiers volumineux chaque lundi." } }
    - { id: home, text: { en: "Give each existing and future subfolder of D:\\Home its own 2 GB limit.", fr: "Attribuer à chaque sous-dossier existant et futur de D:\\Home sa propre limite de 2 Go." } }
answer:
  mapping: { tag: classrule, expire: fmtask, weekly: report, home: autoquota }
explanation:
  correct:
    en: |
      Classification rules set classification properties on files, for example from their content. File management tasks act on files selected by location, classification or dates; they can expire files by moving them to another folder. Storage reports, which can be scheduled and emailed, include duplicate and large file reports. An auto apply quota applies a quota template to every existing subfolder of a path and to the subfolders created later.
    fr: |
      Les règles de classification définissent des propriétés de classification sur les fichiers, par exemple à partir de leur contenu. Les tâches de gestion de fichiers agissent sur des fichiers sélectionnés par emplacement, classification ou dates ; elles peuvent faire expirer des fichiers en les déplaçant vers un autre dossier. Les rapports de stockage, qui peuvent être planifiés et envoyés par e-mail, incluent des rapports de fichiers en double et de fichiers volumineux. Un quota à application automatique applique un modèle de quota à chaque sous-dossier existant d'un chemin et aux sous-dossiers créés ensuite.
  options:
    screen: { en: "A file screen controls which file types can be saved; it does not tag, move or report on files.", fr: "Un filtre de fichiers contrôle les types de fichiers qui peuvent être enregistrés ; il ne marque, ne déplace ni ne signale de fichiers." }
    exception: { en: "A file screen exception allows blocked file groups in a subfolder; none of the requirements needs it.", fr: "Une exception de filtre de fichiers autorise des groupes de fichiers bloqués dans un sous-dossier ; aucune exigence n'en a besoin." }
references:
  - title: File Server Resource Manager (FSRM) overview
    url: https://learn.microsoft.com/en-us/windows-server/storage/fsrm/fsrm-overview
  - title: Create an Auto Apply Quota
    url: https://learn.microsoft.com/en-us/windows-server/storage/fsrm/create-auto-apply-quota
