id: az802-5a-perm-adds-order
objective: "5.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a storage account named **adatumfs01** that contains an SMB Azure file share named **hr**. Adatum has an AD DS domain that is synced to Microsoft Entra ID. No identity source is enabled on adatumfs01.

    You need domain users to map hr with their AD DS credentials from domain-joined computers. Access must be granted to groups at the share level and controlled per folder by Windows ACLs.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un compte de stockage nommé **adatumfs01** qui contient un partage de fichiers Azure SMB nommé **hr**. Adatum dispose d'un domaine AD DS synchronisé avec Microsoft Entra ID. Aucune source d'identité n'est activée sur adatumfs01.

    Les utilisateurs du domaine doivent mapper hr avec leurs informations d'identification AD DS depuis des ordinateurs joints au domaine. L'accès doit être accordé à des groupes au niveau du partage et contrôlé par dossier avec des listes ACL Windows.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: join, text: { en: "Run Join-AzStorageAccount from a domain-joined computer to enable AD DS authentication on adatumfs01.", fr: "Exécuter Join-AzStorageAccount depuis un ordinateur joint au domaine pour activer l'authentification AD DS sur adatumfs01." } }
    - { id: rbac, text: { en: "Assign Storage File Data SMB Share Contributor on hr to the synced groups.", fr: "Attribuer Storage File Data SMB Share Contributor sur hr aux groupes synchronisés." } }
    - { id: acl, text: { en: "Mount hr with administrative access and configure the Windows ACLs of its folders.", fr: "Monter hr avec un accès administratif et configurer les listes ACL Windows de ses dossiers." } }
    - { id: mount, text: { en: "Map hr on the users' domain-joined computers.", fr: "Mapper hr sur les ordinateurs des utilisateurs joints au domaine." } }
    - { id: kerb, text: { en: "Enable Microsoft Entra Kerberos authentication on adatumfs01.", fr: "Activer l'authentification Microsoft Entra Kerberos sur adatumfs01." } }
    - { id: dds, text: { en: "Deploy Microsoft Entra Domain Services and join the users' computers to the managed domain.", fr: "Déployer Microsoft Entra Domain Services et joindre les ordinateurs des utilisateurs au domaine managé." } }
answer:
  sequence: [ join, rbac, acl, mount ]
explanation:
  correct:
    en: |
      AD DS authentication for Azure Files follows this order. You first enable AD DS as the identity source, which Join-AzStorageAccount does by creating an account that represents the storage account in AD DS. You then assign share-level permissions to the synced groups, configure Windows ACLs on directories and files, and finally mount the share from domain-joined computers.
    fr: "L'authentification AD DS pour Azure Files suit cet ordre. Vous activez d'abord AD DS comme source d'identité, ce que fait Join-AzStorageAccount en créant dans AD DS un compte qui représente le compte de stockage. Vous attribuez ensuite les autorisations au niveau du partage aux groupes synchronisés, configurez les listes ACL Windows sur les répertoires et les fichiers, puis montez le partage depuis des ordinateurs joints au domaine."
  options:
    kerb: { en: "A storage account uses one identity source; the requirement is AD DS authentication from domain-joined computers.", fr: "Un compte de stockage utilise une seule source d'identité ; l'exigence est l'authentification AD DS depuis des ordinateurs joints au domaine." }
    dds: { en: "Microsoft Entra Domain Services is a different identity source, and the users must keep their AD DS domain.", fr: "Microsoft Entra Domain Services est une autre source d'identité, et les utilisateurs doivent conserver leur domaine AD DS." }
references:
  - title: On-Premises AD DS Authentication for Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-ad-ds-overview
  - title: Enable AD DS Authentication for Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-ad-ds-enable
