id: az802-5b-qos-unknown
objective: "5.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Hyper-V hosts store virtual machines on a Scale-Out File Server named **SOFS3**. All servers run Windows Server 2025. A Storage QoS policy named **Gold** was assigned to the virtual disks of four SQL Server VMs.

    An administrator deleted the Gold policy on SOFS3 without changing the VMs. `Get-StorageQosFlow` now shows the status **UnknownPolicyId** for the flows of the four VMs, and their I/O is no longer limited. You know the PolicyId and the settings of the deleted policy.

    You need to apply the Gold settings to the four VMs again. The solution must not require any change on the Hyper-V hosts.

    What should you do on SOFS3?
  fr: |
    Des hôtes Hyper-V stockent des machines virtuelles sur un serveur de fichiers avec montée en puissance parallèle nommé **SOFS3**. Tous les serveurs exécutent Windows Server 2025. Une stratégie de qualité de service du stockage nommée **Gold** était attribuée aux disques virtuels de quatre VM SQL Server.

    Un administrateur a supprimé la stratégie Gold sur SOFS3 sans modifier les VM. `Get-StorageQosFlow` affiche désormais l'état **UnknownPolicyId** pour les flux des quatre VM, et leurs E/S ne sont plus limitées. Vous connaissez le PolicyId et les paramètres de la stratégie supprimée.

    Vous devez appliquer à nouveau les paramètres de Gold aux quatre VM. La solution ne doit exiger aucune modification sur les hôtes Hyper-V.

    Que devez-vous faire sur SOFS3 ?
body:
  options:
    - { id: a, text: { en: "Run New-StorageQosPolicy with the name Gold and the original settings.", fr: "Exécuter New-StorageQosPolicy avec le nom Gold et les paramètres d'origine." } }
    - { id: b, text: { en: "Run New-StorageQosPolicy with -PolicyId set to the old GUID and the original settings.", fr: "Exécuter New-StorageQosPolicy avec -PolicyId défini sur l'ancien GUID et les paramètres d'origine." } }
    - { id: c, text: { en: "Run Set-StorageQosPolicyStore with the original IOPS normalization size.", fr: "Exécuter Set-StorageQosPolicyStore avec la taille de normalisation des IOPS d'origine." } }
    - { id: d, text: { en: "Run Debug-StorageSubSystem on the clustered storage subsystem to repair the policy.", fr: "Exécuter Debug-StorageSubSystem sur le sous-système de stockage en cluster pour réparer la stratégie." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The virtual disks still reference the PolicyId (GUID) of the deleted policy, which is why their flows show UnknownPolicyId. Creating a policy with -PolicyId set to that GUID makes the reference valid again, and the limits apply within seconds without touching the Hyper-V hosts.
    fr: |
      Les disques virtuels référencent toujours le PolicyId (GUID) de la stratégie supprimée, d'où l'état UnknownPolicyId de leurs flux. Créer une stratégie avec -PolicyId défini sur ce GUID rend la référence de nouveau valide, et les limites s'appliquent en quelques secondes sans intervenir sur les hôtes Hyper-V.
  options:
    a:
      en: |
        A new policy gets a new PolicyId; the VMs would still reference the old GUID unless you reassign the policy on the Hyper-V hosts.
      fr: |
        Une nouvelle stratégie reçoit un nouveau PolicyId ; les VM référenceraient toujours l'ancien GUID, sauf à réattribuer la stratégie sur les hôtes Hyper-V.
    c:
      en: |
        The policy store setting controls the size used to normalize IOPS for the cluster; it doesn't recreate a policy.
      fr: |
        Le paramètre du magasin de stratégies contrôle la taille utilisée pour normaliser les IOPS du cluster ; il ne recrée pas de stratégie.
    d:
      en: |
        Debug-StorageSubSystem reports the fault (a missing policy) and recommends recreating it, but it doesn't recreate the policy.
      fr: |
        Debug-StorageSubSystem signale l'erreur (une stratégie manquante) et recommande de la recréer, mais il ne recrée pas la stratégie.
references:
  - title: Storage Quality of Service
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-qos/storage-qos-overview
