id: az802-cs3c-storage-replica
objective: "5.3.4"
type: single
caseStudy: az802-cs3c-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    You need to configure Storage Replica to meet the disaster recovery requirement. Which replication mode should you use, and where should the replication logs be stored?
  fr: |
    Vous devez configurer le réplica de stockage pour satisfaire l'exigence de reprise d'activité. Quel mode de réplication devez-vous utiliser, et où les journaux de réplication doivent-ils être stockés ?
body:
  options:
    - { id: a, text: { en: "Synchronous replication; logs on a dedicated log volume on each server", fr: "Réplication synchrone ; journaux sur un volume de journaux dédié sur chaque serveur" } }
    - { id: b, text: { en: "Asynchronous replication; logs on a dedicated log volume on each server", fr: "Réplication asynchrone ; journaux sur un volume de journaux dédié sur chaque serveur" } }
    - { id: c, text: { en: "Synchronous replication; logs on the E: data volume of each server", fr: "Réplication synchrone ; journaux sur le volume de données E: de chaque serveur" } }
    - { id: d, text: { en: "Asynchronous replication; logs on the E: data volume of each server", fr: "Réplication asynchrone ; journaux sur le volume de données E: de chaque serveur" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Synchronous replication needs an average round-trip latency of 5 ms or less, so the 25 ms Boston–Chicago link calls for asynchronous replication. Storage Replica needs a log volume on the source and on the destination, and log volumes must never be used for other workloads. The Standard edition is enough because only one volume of 1.5 TB is replicated, within its single-volume, 2 TB limit.
    fr: |
      La réplication synchrone exige une latence aller-retour moyenne de 5 ms au plus : la liaison Boston–Chicago à 25 ms impose donc la réplication asynchrone. Le réplica de stockage exige un volume de journaux sur la source et sur la destination, et les volumes de journaux ne doivent jamais servir à d'autres charges de travail. L'édition Standard suffit, car un seul volume de 1,5 To est répliqué, ce qui respecte sa limite d'un volume de 2 To.
  options:
    a:
      en: |
        The 25 ms latency exceeds the 5 ms round trip recommended for synchronous replication.
      fr: |
        La latence de 25 ms dépasse l'aller-retour de 5 ms recommandé pour la réplication synchrone.
    c:
      en: |
        The latency rules out synchronous replication, and the logs cannot share the replicated data volume.
      fr: |
        La latence exclut la réplication synchrone, et les journaux ne peuvent pas partager le volume de données répliqué.
    d:
      en: |
        The mode is correct, but the logs need their own volume that no other workload uses.
      fr: |
        Le mode est correct, mais les journaux ont besoin de leur propre volume, qu'aucune autre charge de travail n'utilise.
references:
  - title: Storage Replica Overview
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-replica/storage-replica-overview
