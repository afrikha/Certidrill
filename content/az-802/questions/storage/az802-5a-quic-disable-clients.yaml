id: az802-5a-quic-disable-clients
objective: "5.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Windows Server 2025 file server named **FSEDGE1** that accepts SMB over QUIC connections from Windows 11 devices. A security review requires that the Windows 11 devices of the Finance department never use SMB over QUIC. All the other devices must keep using SMB over QUIC to reach FSEDGE1.

    Which two actions each meet the requirement? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un serveur de fichiers Windows Server 2025 nommé **FSEDGE1** qui accepte les connexions SMB sur QUIC depuis des appareils Windows 11. Un audit de sécurité exige que les appareils Windows 11 du service Finance n'utilisent jamais SMB sur QUIC. Tous les autres appareils doivent continuer à utiliser SMB sur QUIC pour joindre FSEDGE1.

    Quelles sont les deux actions qui répondent chacune à l'exigence ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "On each Finance device, run Set-SmbClientConfiguration -EnableSMBQUIC $false.", fr: "Sur chaque appareil Finance, exécuter Set-SmbClientConfiguration -EnableSMBQUIC $false." } }
    - { id: b, text: { en: "On each Finance device, run Set-SmbServerConfiguration -EnableSMBQUIC $false.", fr: "Sur chaque appareil Finance, exécuter Set-SmbServerConfiguration -EnableSMBQUIC $false." } }
    - { id: c, text: { en: "Link to the Finance devices a GPO that disables Enable SMB over QUIC under Network\\Lanman Workstation.", fr: "Lier aux appareils Finance un objet de stratégie de groupe qui désactive Enable SMB over QUIC sous Network\\Lanman Workstation." } }
    - { id: d, text: { en: "Link to the Finance devices a GPO that disables Enable SMB over QUIC under Network\\Lanman Server.", fr: "Lier aux appareils Finance un objet de stratégie de groupe qui désactive Enable SMB over QUIC sous Network\\Lanman Server." } }
    - { id: e, text: { en: "On FSEDGE1, run Remove-SmbServerCertificateMapping for fsedge1.contoso.com.", fr: "Sur FSEDGE1, exécuter Remove-SmbServerCertificateMapping pour fsedge1.contoso.com." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Using SMB over QUIC as a client is controlled by the SMB client configuration. Set-SmbClientConfiguration -EnableSMBQUIC $false disables it on a device, and the Enable SMB over QUIC policy under Lanman Workstation does the same through Group Policy.
    fr: |
      L'utilisation de SMB sur QUIC en tant que client est contrôlée par la configuration du client SMB. Set-SmbClientConfiguration -EnableSMBQUIC $false la désactive sur un appareil, et la stratégie Enable SMB over QUIC sous Lanman Workstation fait de même par une stratégie de groupe.
  options:
    b: { en: "Set-SmbServerConfiguration disables the SMB over QUIC server role of the device, not its outbound client connections.", fr: "Set-SmbServerConfiguration désactive le rôle de serveur SMB sur QUIC de l'appareil, pas ses connexions clientes sortantes." }
    d: { en: "The Lanman Server policy controls the SMB server side, not the client connections that the Finance devices make.", fr: "La stratégie Lanman Server contrôle le côté serveur SMB, pas les connexions clientes établies par les appareils Finance." }
    e: { en: "Removing the certificate mapping stops SMB over QUIC on FSEDGE1 for every device, including those that must keep using it.", fr: "Supprimer le mappage de certificat arrête SMB sur QUIC sur FSEDGE1 pour tous les appareils, y compris ceux qui doivent continuer à l'utiliser." }
references:
  - title: SMB over QUIC
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-over-quic
