id: az802-5a-dfsr-conflict-restore
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    DFS Replication replicates D:\Sales between **FS1** in Paris and **FS2** in Lyon. At 10:02, a user in Paris saved Forecast.xlsx on FS1. At 10:03, before the Paris version replicated, a user in Lyon saved a different version of the same file on FS2. FS1 then logged a DFS Replication conflict event for Forecast.xlsx, and only the Lyon version remains in D:\Sales on both servers.

    You need to recover the Paris version. No backup or shadow copy exists.

    What should you do?
  fr: |
    La réplication DFS réplique D:\Sales entre **FS1** à Paris et **FS2** à Lyon. À 10 h 02, un utilisateur de Paris a enregistré Forecast.xlsx sur FS1. À 10 h 03, avant la réplication de la version de Paris, un utilisateur de Lyon a enregistré une autre version du même fichier sur FS2. FS1 a ensuite journalisé un événement de conflit de réplication DFS pour Forecast.xlsx, et seule la version de Lyon reste dans D:\Sales sur les deux serveurs.

    Vous devez récupérer la version de Paris. Il n'existe ni sauvegarde ni cliché instantané.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "On FS2, restore the file from the DfsrPrivate\\PreExisting folder by using Restore-DfsrPreservedFiles.", fr: "Sur FS2, restaurer le fichier à partir du dossier DfsrPrivate\\PreExisting avec Restore-DfsrPreservedFiles." }
    - id: b
      text: { en: "On FS1, restore the file from the DfsrPrivate\\ConflictAndDeleted folder by using Restore-DfsrPreservedFiles.", fr: "Sur FS1, restaurer le fichier à partir du dossier DfsrPrivate\\ConflictAndDeleted avec Restore-DfsrPreservedFiles." }
    - id: c
      text: { en: "On FS2, restore the file from the DfsrPrivate\\ConflictAndDeleted folder by using Restore-DfsrPreservedFiles.", fr: "Sur FS2, restaurer le fichier à partir du dossier DfsrPrivate\\ConflictAndDeleted avec Restore-DfsrPreservedFiles." }
    - id: d
      text: { en: "On FS1, designate FS1 as the primary member of the replicated folder so that its version wins.", fr: "Sur FS1, désigner FS1 comme membre principal du dossier répliqué pour que sa version l'emporte." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When DFS Replication detects a conflict, it keeps the last saved version and moves the other one to the hidden DfsrPrivate\ConflictAndDeleted folder on the member that resolved the conflict, here FS1. That folder is not replicated, so you recover the Paris version on FS1 with Get-DfsrPreservedFiles and Restore-DfsrPreservedFiles.
    fr: |
      Quand la réplication DFS détecte un conflit, elle conserve la dernière version enregistrée et déplace l'autre dans le dossier masqué DfsrPrivate\ConflictAndDeleted du membre qui a résolu le conflit, ici FS1. Ce dossier n'est pas répliqué : vous récupérez donc la version de Paris sur FS1 avec Get-DfsrPreservedFiles et Restore-DfsrPreservedFiles.
  options:
    a:
      en: |
        The PreExisting folder holds files that existed on a member before its initial replication, not versions lost in a conflict.
      fr: |
        Le dossier PreExisting contient les fichiers présents sur un membre avant sa réplication initiale, pas des versions perdues lors d'un conflit.
    c:
      en: |
        The ConflictAndDeleted folder is not replicated; the losing version is on the member that resolved the conflict, FS1.
      fr: |
        Le dossier ConflictAndDeleted n'est pas répliqué ; la version perdante se trouve sur le membre qui a résolu le conflit, FS1.
    d:
      en: |
        The primary member only matters during initial replication, and setting it afterwards can turn the server into a rogue primary that causes more conflicts.
      fr: |
        Le membre principal ne compte que pendant la réplication initiale, et le définir ensuite peut faire du serveur un membre principal indésirable qui cause d'autres conflits.
references:
  - title: DFS Replication - FAQ
    url: https://learn.microsoft.com/en-us/windows-server/storage/dfs-replication/dfsr-faq
  - title: Restore-DfsrPreservedFiles (DFSR)
    url: https://learn.microsoft.com/en-us/powershell/module/dfsr/restore-dfsrpreservedfiles
