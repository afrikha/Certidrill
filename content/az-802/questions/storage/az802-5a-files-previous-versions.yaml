id: az802-5a-files-previous-versions
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a storage account named **contosofs01** that contains an SMB Azure file share named **projects**. Users map projects as drive P: on Windows 11 computers by using their AD DS identities. A scheduled task creates a share snapshot of projects every night.

    This morning, a user deleted a folder named **Budget** from the share. The user must restore the folder as it was last night, without help from an administrator.

    What should the user do?
  fr: |
    Contoso dispose d'un compte de stockage nommé **contosofs01** qui contient un partage de fichiers Azure SMB nommé **projects**. Les utilisateurs mappent projects comme lecteur P: sur des ordinateurs Windows 11 à l'aide de leurs identités AD DS. Une tâche planifiée crée chaque nuit un instantané de partage de projects.

    Ce matin, un utilisateur a supprimé du partage un dossier nommé **Budget**. L'utilisateur doit restaurer le dossier dans son état de la nuit dernière, sans l'aide d'un administrateur.

    Que doit faire l'utilisateur ?
body:
  options:
    - { id: a, text: { en: "Undelete the projects share from the deleted shares of the storage account.", fr: "Restaurer le partage projects à partir des partages supprimés du compte de stockage." } }
    - { id: b, text: { en: "Restore the storage account to last night by using point-in-time restore.", fr: "Restaurer le compte de stockage à la nuit dernière à l'aide de la restauration à un point dans le temps." } }
    - { id: c, text: { en: "Open the Previous Versions tab of drive P: in File Explorer and restore Budget.", fr: "Ouvrir l'onglet Versions précédentes du lecteur P: dans l'Explorateur de fichiers et restaurer Budget." } }
    - { id: d, text: { en: "Enable soft delete on the storage account and then undelete the Budget folder.", fr: "Activer la suppression réversible sur le compte de stockage, puis restaurer le dossier Budget." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A share snapshot is a read-only, point-in-time copy of the share. On Windows, the snapshots of a mounted SMB Azure file share appear in the Previous Versions tab of File Explorer, so the user can copy or restore the Budget folder from last night's snapshot without administrative help.
    fr: |
      Un instantané de partage est une copie en lecture seule du partage à un moment donné. Sous Windows, les instantanés d'un partage de fichiers Azure SMB monté apparaissent dans l'onglet Versions précédentes de l'Explorateur de fichiers : l'utilisateur peut donc copier ou restaurer le dossier Budget à partir de l'instantané de la nuit dernière sans aide d'un administrateur.
  options:
    a:
      en: |
        Soft delete works only at the share level and restores a deleted share; the projects share was not deleted.
      fr: |
        La suppression réversible fonctionne uniquement au niveau du partage et restaure un partage supprimé ; le partage projects n'a pas été supprimé.
    b:
      en: |
        Point-in-time restore applies to block blobs, not to Azure file shares, and it would roll back far more than one folder.
      fr: |
        La restauration à un point dans le temps s'applique aux objets blob de blocs, pas aux partages de fichiers Azure, et elle restaurerait bien plus qu'un dossier.
    d:
      en: |
        Soft delete for Azure Files protects whole shares, not individual files or folders, and enabling it now cannot recover data deleted earlier.
      fr: |
        La suppression réversible d'Azure Files protège des partages entiers, pas des fichiers ou des dossiers, et l'activer maintenant ne récupère pas des données supprimées auparavant.
references:
  - title: Use Azure Files Share Snapshots
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-snapshots-files
  - title: Azure File Share Soft Delete
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-prevent-file-share-deletion
