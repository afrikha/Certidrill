id: az802-5a-smb-ntlm-exception
objective: "5.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A GPO linked to the Servers OU of the contoso.com domain enables the **Block NTLM (LM, NTLM, NTLMv2)** policy under Computer Configuration\Administrative Templates\Network\Lanman Workstation. A Windows Server 2025 server named **APP1** in that OU must copy files every night to \\NAS1\backup. NAS1 is a third-party SMB device that is not joined to any domain and authenticates SMB users with NTLM only. The copy job now fails.

    APP1 must reach NAS1, and APP1 must keep blocking NTLM for every other SMB server.

    What should you do?
  fr: |
    Un objet de stratégie de groupe lié à l'unité d'organisation Servers du domaine contoso.com active la stratégie **Block NTLM (LM, NTLM, NTLMv2)** sous Computer Configuration\Administrative Templates\Network\Lanman Workstation. Un serveur Windows Server 2025 nommé **APP1**, situé dans cette unité d'organisation, doit copier des fichiers chaque nuit vers \\NAS1\backup. NAS1 est un appareil SMB tiers qui n'est joint à aucun domaine et authentifie les utilisateurs SMB uniquement avec NTLM. Le travail de copie échoue désormais.

    APP1 doit joindre NAS1, et APP1 doit continuer à bloquer NTLM pour tous les autres serveurs SMB.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Run Set-SmbClientConfiguration -BlockNTLM $false on APP1.", fr: "Exécuter Set-SmbClientConfiguration -BlockNTLM $false sur APP1." }
    - id: b
      text: { en: "Map the share on APP1 by running NET USE \\\\NAS1\\backup /BLOCKNTLM.", fr: "Mapper le partage sur APP1 en exécutant NET USE \\\\NAS1\\backup /BLOCKNTLM." }
    - id: c
      text: { en: "Enable the Block NTLM Server Exception List policy for APP1 and add NAS1 to the list.", fr: "Activer la stratégie Block NTLM Server Exception List pour APP1 et ajouter NAS1 à la liste." }
    - id: d
      text: { en: "Run Set-SmbServerConfiguration -RequireSecuritySignature $false on APP1.", fr: "Exécuter Set-SmbServerConfiguration -RequireSecuritySignature $false sur APP1." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      NAS1 is not joined to a domain, so APP1 cannot use Kerberos with it and must fall back to NTLM, which the SMB client NTLM blocking policy prevents. The Block NTLM Server Exception List policy, also under Lanman Workstation, lists the IP addresses, NetBIOS names or FQDNs of servers to which the SMB client may still use NTLM, so only NAS1 is exempted.
    fr: |
      NAS1 n'est joint à aucun domaine : APP1 ne peut pas utiliser Kerberos avec lui et doit se rabattre sur NTLM, ce que la stratégie de blocage NTLM du client SMB empêche. La stratégie Block NTLM Server Exception List, également sous Lanman Workstation, répertorie les adresses IP, noms NetBIOS ou noms de domaine complets des serveurs avec lesquels le client SMB peut encore utiliser NTLM : seul NAS1 est ainsi exempté.
  options:
    a:
      en: |
        Turning NTLM blocking off on APP1 allows NTLM to every SMB server, and the GPO would set it again.
      fr: |
        Désactiver le blocage NTLM sur APP1 autorise NTLM vers tous les serveurs SMB, et l'objet de stratégie de groupe le rétablirait.
    b:
      en: |
        /BLOCKNTLM blocks NTLM for that mapping; it cannot make NTLM available.
      fr: |
        /BLOCKNTLM bloque NTLM pour ce mappage ; il ne peut pas rendre NTLM disponible.
    d:
      en: |
        Server-side signing settings of APP1 do not affect the outbound authentication of its SMB client.
      fr: |
        Les paramètres de signature côté serveur d'APP1 n'affectent pas l'authentification sortante de son client SMB.
references:
  - title: Block NTLM connections on SMB in Windows Server 2025
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-ntlm-blocking
