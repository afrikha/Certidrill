id: az802-cs4a-storage-replica
objective: "5.3.4"
type: single
caseStudy: az802-cs4a-trey-research
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the replication requirement for FS1 and FS2. What should you do?
  fr: |
    Vous devez satisfaire l'exigence de réplication concernant FS1 et FS2. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Keep Windows Server 2025 Standard on both servers, and create a server-to-server partnership for D: and E: in synchronous mode."
        fr: "Conserver Windows Server 2025 Standard sur les deux serveurs, puis créer un partenariat de serveur à serveur pour D: et E: en mode synchrone."
    - id: b
      text:
        en: "Keep Windows Server 2025 Standard, split E: into two 1.5-TB volumes, and create a synchronous partnership for each volume."
        fr: "Conserver Windows Server 2025 Standard, scinder E: en deux volumes de 1,5 To, puis créer un partenariat synchrone pour chaque volume."
    - id: c
      text:
        en: "Upgrade both servers to Windows Server 2025 Datacenter, and create a server-to-server partnership for D: and E: in synchronous mode."
        fr: "Mettre à niveau les deux serveurs vers Windows Server 2025 Datacenter, puis créer un partenariat de serveur à serveur pour D: et E: en mode synchrone."
    - id: d
      text:
        en: "Keep Windows Server 2025 Standard on both servers, and create a server-to-server partnership for D: and E: in asynchronous mode."
        fr: "Conserver Windows Server 2025 Standard sur les deux serveurs, puis créer un partenariat de serveur à serveur pour D: et E: en mode asynchrone."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Storage Replica on Windows Server Standard replicates a single volume of up to 2 TB. FS1 must replicate two volumes, one of them 3 TB, so both servers need the Datacenter edition, which has no such limits. Synchronous mode gives zero data loss, and the 1-ms latency is within the 5-ms average round trip recommended for synchronous replication.
    fr: |
      Sur Windows Server Standard, Réplica de stockage réplique un seul volume de 2 To au maximum. FS1 doit répliquer deux volumes, dont un de 3 To : les deux serveurs ont besoin de l'édition Datacenter, qui n'a pas ces limites. Le mode synchrone n'entraîne aucune perte de données, et la latence de 1 ms respecte l'aller-retour moyen de 5 ms recommandé pour la réplication synchrone.
  options:
    a:
      en: |
        Standard edition replicates only one volume, of 2 TB at most, so it cannot replicate D: and the 3-TB volume E:.
      fr: |
        L'édition Standard ne réplique qu'un seul volume, de 2 To au maximum : elle ne peut pas répliquer D: et le volume E: de 3 To.
    b:
      en: |
        Smaller volumes solve the size limit but not the single-volume limit of Standard edition, and the requirement also covers D:.
      fr: |
        Des volumes plus petits règlent la limite de taille mais pas la limite d'un seul volume de l'édition Standard, et l'exigence porte aussi sur D:.
    d:
      en: |
        Asynchronous mode does not lift the Standard edition limits, and its recovery point objective is above zero, so data can be lost.
      fr: |
        Le mode asynchrone ne lève pas les limites de l'édition Standard, et son objectif de point de récupération est supérieur à zéro : des données peuvent être perdues.
references:
  - title: Storage Replica Overview
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-replica/storage-replica-overview
