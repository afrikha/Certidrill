id: az802-sr2-fsrm-screen-2
objective: "5.2.2"
type: series_yesno
series: az802-sr2-fsrm-screen
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    You create a passive file screen on D:\Projects and a file screen exception on D:\Projects\Media.
  fr: |
    Vous créez un filtre de fichiers passif sur D:\Projects et une exception de filtre de fichiers sur D:\Projects\Media.
body:
  solution:
    en: |
      You create a file screen on **D:\Projects** that uses **Passive screening** and the MediaFiles file group, with an email notification to the administrators. You then create a file screen exception on **D:\Projects\Media** that allows the MediaFiles file group.
    fr: |
      Vous créez sur **D:\Projects** un filtre de fichiers qui utilise l'option **Passive screening** et le groupe de fichiers MediaFiles, avec une notification par e-mail aux administrateurs. Vous créez ensuite sur **D:\Projects\Media** une exception de filtre de fichiers qui autorise le groupe de fichiers MediaFiles.
answer: { value: false }
explanation:
  correct:
    en: |
      Passive screening only sends the configured notifications; it does not prevent users from saving the files. Users could still save MP3, MP4 and WAV files anywhere in D:\Projects. Blocking requires active screening.
    fr: |
      Le filtrage passif envoie seulement les notifications configurées : il n'empêche pas les utilisateurs d'enregistrer les fichiers. Les utilisateurs pourraient toujours enregistrer des fichiers MP3, MP4 et WAV partout dans D:\Projects. Le blocage nécessite le filtrage actif.
references:
  - title: Create a File Screen
    url: https://learn.microsoft.com/en-us/windows-server/storage/fsrm/create-file-screen
