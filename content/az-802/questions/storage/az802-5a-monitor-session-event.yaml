id: az802-5a-monitor-session-event
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A server named **FS1** runs the Azure File Sync agent. You need to determine on FS1 whether the last completed sync session of a server endpoint succeeded and how many files failed to sync during that session.

    Which event should you review in the Telemetry event log under Applications and Services\Microsoft\FileSync\Agent?
  fr: |
    Un serveur nommé **FS1** exécute l'agent Azure File Sync. Vous devez déterminer sur FS1 si la dernière session de synchronisation terminée d'un point de terminaison de serveur a réussi et combien de fichiers n'ont pas pu être synchronisés pendant cette session.

    Quel événement devez-vous examiner dans le journal des événements Telemetry, sous Applications and Services\Microsoft\FileSync\Agent ?
body:
  options:
    - { id: a, text: { en: "Event ID 9302", fr: "L'événement 9302" } }
    - { id: b, text: { en: "Event ID 9301", fr: "L'événement 9301" } }
    - { id: c, text: { en: "Event ID 9102", fr: "L'événement 9102" } }
    - { id: d, text: { en: "Event ID 9016", fr: "L'événement 9016" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Event ID 9102 is logged once a sync session completes. Its HResult field shows whether the session succeeded (0 means success) and its PerItemErrorCount field shows how many items failed to sync.
    fr: |
      L'événement 9102 est journalisé à la fin d'une session de synchronisation. Son champ HResult indique si la session a réussi (0 signifie succès) et son champ PerItemErrorCount indique combien d'éléments n'ont pas pu être synchronisés.
  options:
    a:
      en: |
        Event ID 9302 reports the progress of a session that is still running, every 5 to 10 minutes.
      fr: |
        L'événement 9302 rend compte, toutes les 5 à 10 minutes, de la progression d'une session encore en cours.
    b:
      en: |
        Event ID 9301 is logged every 30 seconds when the server polls the service for jobs; it shows connectivity, not session results.
      fr: |
        L'événement 9301 est journalisé toutes les 30 secondes quand le serveur interroge le service pour obtenir des travaux ; il montre la connectivité, pas le résultat des sessions.
    d:
      en: |
        Event ID 9016 provides the cloud tiering (ghosting) results for a volume, not sync results.
      fr: |
        L'événement 9016 fournit les résultats de la hiérarchisation cloud pour un volume, pas ceux de la synchronisation.
references:
  - title: Monitor Azure File Sync
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-monitoring
