id: az802-5a-monitor-alert-metrics
objective: "5.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are creating Azure Monitor alert rules for a Storage Sync Service named **sss-woodgrove**. Each rule must detect one of the following situations.

    Which metric should you use for each situation? To answer, drag the appropriate metrics to the correct situations. Each metric may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez des règles d'alerte Azure Monitor pour un service de synchronisation de stockage nommé **sss-woodgrove**. Chaque règle doit détecter l'une des situations suivantes.

    Quelle métrique devez-vous utiliser pour chaque situation ? Pour répondre, faites glisser les métriques appropriées vers les situations correspondantes. Chaque métrique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: online, text: Server online status }
    - { id: notsyncing, text: Files not syncing }
    - { id: session, text: Sync session result }
    - { id: recall, text: Cloud tiering recall size }
    - { id: lowdisk, text: Cloud tiering low disk space mode }
    - { id: bytes, text: Bytes synced }
  targets:
    - { id: heartbeat, text: { en: "A registered server stops sending heartbeats to the service.", fr: "Un serveur inscrit cesse d'envoyer des pulsations au service." } }
    - { id: peritem, text: { en: "Individual files keep failing to sync because of per-item errors.", fr: "Des fichiers individuels échouent sans cesse à se synchroniser à cause d'erreurs par élément." } }
    - { id: antivirus, text: { en: "An antivirus scan brings back more than 500 GiB of tiered files in one day.", fr: "Une analyse antivirus rapatrie plus de 500 Gio de fichiers hiérarchisés en une journée." } }
    - { id: space, text: { en: "A server endpoint changes its behavior to protect a nearly full volume.", fr: "Un point de terminaison de serveur modifie son comportement pour protéger un volume presque plein." } }
answer:
  mapping: { heartbeat: online, peritem: notsyncing, antivirus: recall, space: lowdisk }
explanation:
  correct:
    en: |
      Server online status counts the heartbeats received from a server. Files not syncing counts the files that fail to sync. Cloud tiering recall size measures the data recalled, which the recommended 500 GiB-per-day alert uses. Cloud tiering low disk space mode reports a server endpoint that has entered low disk space mode. Sync session result tracks whether sync sessions succeed, and Bytes synced only measures transferred data.
    fr: |
      Server online status compte les pulsations reçues d'un serveur. Files not syncing compte les fichiers qui ne parviennent pas à se synchroniser. Cloud tiering recall size mesure les données rappelées, que l'alerte recommandée de 500 Gio par jour utilise. Cloud tiering low disk space mode signale un point de terminaison de serveur passé en mode espace disque faible. Sync session result indique si les sessions de synchronisation réussissent, et Bytes synced mesure seulement les données transférées.
references:
  - title: Monitor Azure File Sync
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-monitoring
