id: az802-cs2b-dedup-usage
objective: "5.3.5"
type: dropdown
caseStudy: az802-cs2b-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the storage efficiency requirement.

    What should you run first for each volume? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence d'efficacité du stockage.

    Que devez-vous exécuter en premier pour chaque volume ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Volume F: on FS1: [[f]]

      Volume H: on HV2: [[h]]

      Volume B: on BK1: [[b]]

      Volume S: on DB1: [[s]]
    fr: |
      Volume F: sur FS1 : [[f]]

      Volume H: sur HV2 : [[h]]

      Volume B: sur BK1 : [[b]]

      Volume S: sur DB1 : [[s]]
  slots:
    - id: f
      options:
        - { id: default, text: "Enable-DedupVolume -UsageType Default" }
        - { id: hyperv, text: "Enable-DedupVolume -UsageType HyperV" }
        - { id: backup, text: "Enable-DedupVolume -UsageType Backup" }
        - { id: eval, text: "DDPEval.exe" }
    - id: h
      options:
        - { id: default, text: "Enable-DedupVolume -UsageType Default" }
        - { id: hyperv, text: "Enable-DedupVolume -UsageType HyperV" }
        - { id: backup, text: "Enable-DedupVolume -UsageType Backup" }
        - { id: eval, text: "DDPEval.exe" }
    - id: b
      options:
        - { id: default, text: "Enable-DedupVolume -UsageType Default" }
        - { id: hyperv, text: "Enable-DedupVolume -UsageType HyperV" }
        - { id: backup, text: "Enable-DedupVolume -UsageType Backup" }
        - { id: eval, text: "DDPEval.exe" }
    - id: s
      options:
        - { id: default, text: "Enable-DedupVolume -UsageType Default" }
        - { id: hyperv, text: "Enable-DedupVolume -UsageType HyperV" }
        - { id: backup, text: "Enable-DedupVolume -UsageType Backup" }
        - { id: eval, text: "DDPEval.exe" }
answer:
  values: { f: default, h: eval, b: backup, s: eval }
explanation:
  correct:
    en: |
      Microsoft recommends Data Deduplication without prior evaluation for general purpose file servers, VDI servers and virtualized backup applications, so F: gets the Default usage type and B: the Backup usage type. General purpose Hyper-V hosts and SQL Server are workloads to evaluate first: DDPEval.exe estimates the savings, and the impact of their I/O must be tested. The HyperV usage type is tuned for VDI storage, and the deduplicating computer cannot be the Hyper-V host that runs the VMs.
    fr: |
      Microsoft recommande la déduplication des données sans évaluation préalable pour les serveurs de fichiers à usage général, les serveurs VDI et les applications de sauvegarde virtualisées : F: reçoit le type d'utilisation Default et B: le type Backup. Les hôtes Hyper-V à usage général et SQL Server sont des charges de travail à évaluer d'abord : DDPEval.exe estime le gain, et l'impact de leurs E/S doit être testé. Le type d'utilisation HyperV est adapté au stockage VDI, et l'ordinateur qui déduplique ne peut pas être l'hôte Hyper-V qui exécute les machines virtuelles.
references:
  - title: Install and enable Data Deduplication
    url: https://learn.microsoft.com/en-us/windows-server/storage/data-deduplication/install-enable
  - title: Enable-DedupVolume (Deduplication)
    url: https://learn.microsoft.com/en-us/powershell/module/deduplication/enable-dedupvolume
