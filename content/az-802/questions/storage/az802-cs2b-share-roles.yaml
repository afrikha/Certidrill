id: az802-cs2b-share-roles
objective: "5.1.2"
type: dragdrop
caseStudy: az802-cs2b-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You need to assign share-level permissions on the records share to meet the share permissions requirement.

    Which role should you assign to each group? To answer, drag the appropriate roles to the correct groups. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez attribuer les autorisations au niveau du partage records pour satisfaire l'exigence relative aux autorisations de partage.

    Quel rôle devez-vous attribuer à chaque groupe ? Pour répondre, faites glisser les rôles appropriés vers les groupes correspondants. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: reader, text: Storage File Data SMB Share Reader }
    - { id: contrib, text: Storage File Data SMB Share Contributor }
    - { id: elevated, text: Storage File Data SMB Share Elevated Contributor }
    - { id: privcontrib, text: Storage File Data Privileged Contributor }
    - { id: privreader, text: Storage File Data Privileged Reader }
  targets:
    - { id: nurses, text: Nurses }
    - { id: admins, text: Records-Admins }
    - { id: auditors, text: Auditors }
answer:
  mapping: { nurses: contrib, admins: elevated, auditors: reader }
explanation:
  correct:
    en: |
      Storage File Data SMB Share Contributor allows reading, writing and deleting files. Storage File Data SMB Share Elevated Contributor adds the right to modify NTFS ACLs, which Records-Admins needs. Storage File Data SMB Share Reader allows read access only. The three roles still apply the NTFS permissions of the files and folders.
    fr: |
      Storage File Data SMB Share Contributor permet de lire, d'écrire et de supprimer des fichiers. Storage File Data SMB Share Elevated Contributor ajoute le droit de modifier les ACL NTFS, dont Records-Admins a besoin. Storage File Data SMB Share Reader n'accorde que la lecture. Ces trois rôles continuent d'appliquer les autorisations NTFS des fichiers et des dossiers.
  options:
    privcontrib:
      en: |
        Storage File Data Privileged Contributor can modify ACLs but overrides the existing NTFS permissions, which the requirement forbids.
      fr: |
        Storage File Data Privileged Contributor peut modifier les ACL, mais passe outre les autorisations NTFS existantes, ce que l'exigence interdit.
    privreader:
      en: |
        Storage File Data Privileged Reader reads files while overriding the existing NTFS permissions.
      fr: |
        Storage File Data Privileged Reader lit les fichiers en passant outre les autorisations NTFS existantes.
references:
  - title: Assign share-level permissions for Azure file shares
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions
