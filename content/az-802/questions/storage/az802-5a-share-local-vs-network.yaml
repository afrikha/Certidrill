id: az802-5a-share-local-vs-network
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A file server named **FS1** shares the folder D:\Data as **Data**. User1 is a member of the Accounting group, and the NTFS permissions of D:\Data grant Accounting the Modify permission.

    When User1 signs in to FS1 locally, she can edit the files in D:\Data. When she opens \\FS1\Data from her computer, she can open the files but cannot save changes.

    What should you modify?
  fr: |
    Un serveur de fichiers nommé **FS1** partage le dossier D:\Data sous le nom **Data**. User1 est membre du groupe Accounting, et les autorisations NTFS de D:\Data accordent l'autorisation Modification à Accounting.

    Quand User1 se connecte localement à FS1, elle peut modifier les fichiers de D:\Data. Quand elle ouvre \\FS1\Data depuis son ordinateur, elle peut ouvrir les fichiers mais ne peut pas enregistrer les modifications.

    Que devez-vous modifier ?
body:
  options:
    - { id: a, text: { en: "The NTFS permissions of D:\\Data, to grant Accounting Full control", fr: "Les autorisations NTFS de D:\\Data, pour accorder Contrôle total à Accounting" } }
    - { id: b, text: { en: "The share permissions of Data, to grant Accounting Change", fr: "Les autorisations de partage de Data, pour accorder Modifier à Accounting" } }
    - { id: c, text: { en: "The access-based enumeration setting of Data", fr: "Le paramètre d'énumération basée sur l'accès de Data" } }
    - { id: d, text: { en: "The offline settings (caching mode) of Data", fr: "Les paramètres hors connexion (mode de mise en cache) de Data" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Share permissions apply only to access over the network and do not restrict users who sign in locally. Over the network, the more restrictive of the share and NTFS permissions applies, so User1 is limited by a Read share permission; granting Accounting Change at the share lets the NTFS Modify permission take effect.
    fr: |
      Les autorisations de partage ne s'appliquent qu'à l'accès par le réseau et ne limitent pas les utilisateurs connectés localement. Par le réseau, c'est la plus restrictive des autorisations de partage et NTFS qui s'applique : User1 est donc limitée par une autorisation de partage Lecture ; accorder Modifier à Accounting sur le partage permet à l'autorisation NTFS Modification de s'appliquer.
  options:
    a:
      en: |
        User1 can already edit locally, so the NTFS permissions are sufficient; the limit comes from the share permissions.
      fr: |
        User1 peut déjà modifier en local : les autorisations NTFS suffisent ; la limite vient des autorisations de partage.
    c:
      en: |
        Access-based enumeration only hides folders that users cannot access; it does not grant write access.
      fr: |
        L'énumération basée sur l'accès masque seulement les dossiers auxquels les utilisateurs n'ont pas accès ; elle n'accorde pas l'accès en écriture.
    d:
      en: |
        Offline settings control client-side caching of files, not permissions.
      fr: |
        Les paramètres hors connexion contrôlent la mise en cache des fichiers côté client, pas les autorisations.
references:
  - title: Share and NTFS Permissions on a File Server
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/cc754178(v=ws.11)
