id: az802-5a-migrate-cutover-practices
objective: "5.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to migrate the shares of a Windows Server 2022 file server named **FS1** to an Azure file share by using Robocopy. The shares contain 12 million files. No on-premises cache is required after the migration.

    You need to minimize the time during which users cannot work at cutover, and avoid a long propagation of permission changes after the copy.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de migrer les partages d'un serveur de fichiers Windows Server 2022 nommé **FS1** vers un partage de fichiers Azure à l'aide de Robocopy. Les partages contiennent 12 millions de fichiers. Aucun cache local n'est nécessaire après la migration.

    Vous devez réduire au minimum le temps pendant lequel les utilisateurs ne peuvent pas travailler lors du basculement final, et éviter une longue propagation des modifications d'autorisations après la copie.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure the root directory ACL of the Azure file share before the first Robocopy run.", fr: "Configurer la liste ACL du répertoire racine du partage de fichiers Azure avant la première exécution de Robocopy." } }
    - { id: b, text: { en: "Use AzCopy sync for the final pass so that files deleted at the source are removed from the target.", fr: "Utiliser AzCopy sync pour la dernière passe afin de supprimer de la cible les fichiers supprimés à la source." } }
    - { id: c, text: { en: "Run Robocopy with /MIR while users keep working, and run a final /MIR pass after you block access to FS1.", fr: "Exécuter Robocopy avec /MIR pendant que les utilisateurs continuent de travailler, puis une dernière passe /MIR après avoir bloqué l'accès à FS1." } }
    - { id: d, text: { en: "Copy the files with /COPY:DAT, and apply the NTFS ACLs to the Azure file share after the last pass.", fr: "Copier les fichiers avec /COPY:DAT, puis appliquer les listes ACL NTFS au partage de fichiers Azure après la dernière passe." } }
    - { id: e, text: { en: "Copy the initial data by using Azure Storage Explorer, and then run Robocopy for the changes.", fr: "Copier les données initiales avec l'Explorateur Stockage Azure, puis exécuter Robocopy pour les modifications." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Changing the root ACL after a large copy takes a long time to propagate, so set it before copying many files. Robocopy /MIR can run several times on the same source and target; each later run copies only the changes, so the final pass after users are stopped is short.
    fr: |
      Modifier la liste ACL de la racine après une copie volumineuse prend beaucoup de temps à se propager : définissez-la avant de copier un grand nombre de fichiers. Robocopy /MIR peut s'exécuter plusieurs fois sur la même source et la même cible ; chaque exécution suivante ne copie que les modifications, de sorte que la dernière passe, après l'arrêt des utilisateurs, est courte.
  options:
    b: { en: "AzCopy sync does not remove from the target the files deleted at the source, which makes it incomplete for this migration.", fr: "AzCopy sync ne supprime pas de la cible les fichiers supprimés à la source, ce qui le rend incomplet pour cette migration." }
    d: { en: "Applying ACLs to millions of files after the copy is exactly the slow propagation to avoid; /COPY:DATSO copies them during the migration.", fr: "Appliquer des listes ACL à des millions de fichiers après la copie est justement la propagation lente à éviter ; /COPY:DATSO les copie pendant la migration." }
    e: { en: "Azure Storage Explorer loses most file fidelity, such as ACLs.", fr: "L'Explorateur Stockage Azure perd la plupart de la fidélité des fichiers, comme les listes ACL." }
references:
  - title: Migration Overview for SMB Azure File Shares
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-migration-overview
  - title: Migrate to Azure Files Using RoboCopy
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-migration-robocopy
