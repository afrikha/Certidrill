id: az802-sr2-fsrm-screen-3
objective: "5.2.2"
type: series_yesno
series: az802-sr2-fsrm-screen
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: |
    You create an active file screen on D:\Projects and a file screen exception on D:\Projects\Media.
  fr: |
    Vous créez un filtre de fichiers actif sur D:\Projects et une exception de filtre de fichiers sur D:\Projects\Media.
body:
  solution:
    en: |
      You create a file screen on **D:\Projects** that uses **Active screening** and the MediaFiles file group. You then create a file screen exception on **D:\Projects\Media** that allows the MediaFiles file group.
    fr: |
      Vous créez sur **D:\Projects** un filtre de fichiers qui utilise l'option **Active screening** et le groupe de fichiers MediaFiles. Vous créez ensuite sur **D:\Projects\Media** une exception de filtre de fichiers qui autorise le groupe de fichiers MediaFiles.
answer: { value: true }
explanation:
  correct:
    en: |
      Active screening prevents users from saving files of the blocked file groups in the screened folder and all its subfolders. A file screen exception overrides the screening derived from a parent folder for the exception path and its subfolders, so MediaFiles can be saved in D:\Projects\Media only.
    fr: |
      Le filtrage actif empêche les utilisateurs d'enregistrer des fichiers des groupes bloqués dans le dossier filtré et tous ses sous-dossiers. Une exception de filtre de fichiers remplace le filtrage hérité d'un dossier parent pour le chemin de l'exception et ses sous-dossiers : les fichiers MediaFiles peuvent être enregistrés uniquement dans D:\Projects\Media.
references:
  - title: Create a File Screen Exception
    url: https://learn.microsoft.com/en-us/windows-server/storage/fsrm/create-file-screen-exception
  - title: Create a File Screen
    url: https://learn.microsoft.com/en-us/windows-server/storage/fsrm/create-file-screen
