id: az802-sr2-fsrm-screen-1
objective: "5.2.2"
type: series_yesno
series: az802-sr2-fsrm-screen
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: |
    You create an active file screen on D:\Projects and a passive file screen on D:\Projects\Media.
  fr: |
    Vous créez un filtre de fichiers actif sur D:\Projects et un filtre de fichiers passif sur D:\Projects\Media.
body:
  solution:
    en: |
      You create a file screen on **D:\Projects** that uses **Active screening** and the MediaFiles file group. You then create a second file screen on **D:\Projects\Media** that uses **Passive screening** and the MediaFiles file group.
    fr: |
      Vous créez sur **D:\Projects** un filtre de fichiers qui utilise l'option **Active screening** et le groupe de fichiers MediaFiles. Vous créez ensuite sur **D:\Projects\Media** un second filtre de fichiers qui utilise l'option **Passive screening** et le groupe de fichiers MediaFiles.
answer: { value: false }
explanation:
  correct:
    en: |
      The active file screen on D:\Projects applies to the folder and all its subfolders, including D:\Projects\Media. A second, passive screen on the subfolder adds notifications but does not lift the block; only a file screen exception overrides the screening derived from a parent folder.
    fr: |
      Le filtre de fichiers actif sur D:\Projects s'applique au dossier et à tous ses sous-dossiers, y compris D:\Projects\Media. Un second filtre, passif, sur le sous-dossier ajoute des notifications mais ne lève pas le blocage : seule une exception de filtre de fichiers remplace le filtrage hérité d'un dossier parent.
references:
