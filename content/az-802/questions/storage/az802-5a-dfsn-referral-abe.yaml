id: az802-5a-dfsn-referral-abe
objective: "5.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a domain-based namespace in Windows Server 2008 mode named \\contoso.com\Public. Access-based enumeration is enabled on the namespace. The DFS folder Tools has two folder targets, \\LDN-FS1\Tools in the London site and \\NYC-FS1\Tools in the New York site. No replication is configured between the two targets.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un espace de noms de domaine en mode Windows Server 2008 nommé \\contoso.com\Public. L'énumération basée sur l'accès est activée sur l'espace de noms. Le dossier DFS Tools possède deux cibles de dossier, \\LDN-FS1\Tools dans le site London et \\NYC-FS1\Tools dans le site New York. Aucune réplication n'est configurée entre les deux cibles.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A user who has no permission on the Tools DFS folder but types \\contoso.com\Public\Tools still receives a referral to a folder target.
        fr: |
          Un utilisateur qui n'a aucune autorisation sur le dossier DFS Tools mais qui saisit \\contoso.com\Public\Tools reçoit quand même une référence vers une cible de dossier.
    - id: s2
      text:
        en: |
          A file that a London user saves in \\contoso.com\Public\Tools becomes available to the users in New York.
        fr: |
          Un fichier qu'un utilisateur de London enregistre dans \\contoso.com\Public\Tools devient disponible pour les utilisateurs de New York.
    - id: s3
      text:
        en: |
          A client in the London site receives \\LDN-FS1\Tools first in its referral.
        fr: |
          Un client du site London reçoit \\LDN-FS1\Tools en premier dans sa référence.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Access-based enumeration only hides DFS folders; it does not prevent users who know the path from getting a referral, and only the share and NTFS permissions of the target control access. DFS Namespaces provides one path but does not copy data, so without DFS Replication a file saved through the London target is not copied to the New York target. Targets in the client's site are always listed first in a referral.
    fr: |
      L'énumération basée sur l'accès masque seulement les dossiers DFS ; elle n'empêche pas les utilisateurs qui connaissent le chemin d'obtenir une référence, et seules les autorisations de partage et NTFS de la cible contrôlent l'accès. Les espaces de noms DFS fournissent un chemin unique mais ne copient pas de données : sans réplication DFS, un fichier enregistré par la cible de London n'est pas copié vers la cible de New York. Les cibles situées dans le site du client sont toujours listées en premier dans une référence.
references:
  - title: Enable Access-based Enumeration on a Namespace
    url: https://learn.microsoft.com/en-us/windows-server/storage/dfs-namespaces/enable-access-based-enumeration-on-a-namespace
  - title: Set the Ordering Method for Targets in Referrals
    url: https://learn.microsoft.com/en-us/windows-server/storage/dfs-namespaces/set-the-ordering-method-for-targets-in-referrals
