id: az802-5a-dfsr-keep-namespace
objective: "5.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam users open department data through the domain-based namespace \\fabrikam.com\Data. Its folder targets are on two file servers, **FS1** and **FS2**, which keep the data identical by using DFS Replication.

    You plan to replace this deployment with Azure File Sync, with FS1 and FS2 as server endpoints of the same sync group. Users must keep the same UNC paths, and administrative effort must be minimized.

    What should you do with the DFS components after the migration?
  fr: |
    Les utilisateurs de Fabrikam ouvrent les données des services par l'espace de noms de domaine \\fabrikam.com\Data. Ses cibles de dossier se trouvent sur deux serveurs de fichiers, **FS1** et **FS2**, qui gardent les données identiques grâce à la réplication DFS.

    Vous prévoyez de remplacer ce déploiement par Azure File Sync, avec FS1 et FS2 comme points de terminaison de serveur du même groupe de synchronisation. Les utilisateurs doivent conserver les mêmes chemins UNC, et l'effort d'administration doit être réduit au minimum.

    Que devez-vous faire des composants DFS après la migration ?
body:
  options:
    - { id: a, text: { en: "Keep DFS Replication between FS1 and FS2, and remove the DFS namespace.", fr: "Conserver la réplication DFS entre FS1 et FS2, et supprimer l'espace de noms DFS." } }
    - { id: b, text: { en: "Keep the DFS namespace and its folder targets on FS1 and FS2, and retire DFS Replication.", fr: "Conserver l'espace de noms DFS et ses cibles de dossier sur FS1 et FS2, et mettre hors service la réplication DFS." } }
    - { id: c, text: { en: "Remove both, and map the Azure file share directly on every client.", fr: "Supprimer les deux, et mapper directement le partage de fichiers Azure sur chaque client." } }
    - { id: d, text: { en: "Keep both, and enable cloud tiering on the replicated folders.", fr: "Conserver les deux, et activer la hiérarchisation cloud sur les dossiers répliqués." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure File Sync and DFS Replication are both replication engines, so Azure File Sync replaces DFS Replication in most cases. Azure File Sync works fully with DFS Namespaces, which keeps providing the existing UNC paths that point to the shares on FS1 and FS2.
    fr: |
      Azure File Sync et la réplication DFS sont deux moteurs de réplication : Azure File Sync remplace donc la réplication DFS dans la plupart des cas. Azure File Sync fonctionne pleinement avec les espaces de noms DFS, qui continuent de fournir les chemins UNC existants pointant vers les partages de FS1 et FS2.
  options:
    a:
      en: |
        Keeping two replication engines on the same data is not the goal, and removing the namespace breaks the users' UNC paths.
      fr: |
        Conserver deux moteurs de réplication sur les mêmes données n'est pas l'objectif, et supprimer l'espace de noms casse les chemins UNC des utilisateurs.
    c:
      en: |
        Mapping the Azure file share changes the UNC paths and bypasses the local servers that cache the data.
      fr: |
        Mapper le partage de fichiers Azure change les chemins UNC et contourne les serveurs locaux qui mettent les données en cache.
    d:
      en: |
        Cloud tiering must be disabled on volumes that contain DFS Replication replicated folders.
      fr: |
        La hiérarchisation cloud doit être désactivée sur les volumes qui contiennent des dossiers répliqués par la réplication DFS.
references:
  - title: Plan an Azure File Sync deployment
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-planning
