id: az802-cs1b-vdi-dedup
objective: "5.3.5"
type: single
caseStudy: az802-cs1b-southridge
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the desktop requirement on VDI-HV1.

    Which command should you run?
  fr: |
    Vous devez respecter l'exigence relative aux bureaux sur VDI-HV1.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "Enable-DedupVolume -Volume \"V:\" -UsageType Default" }
    - { id: b, text: "Enable-DedupVolume -Volume \"V:\" -UsageType Backup" }
    - { id: c, text: "Start-DedupJob -Volume \"V:\" -Type Optimization" }
    - { id: d, text: "Enable-DedupVolume -Volume \"V:\" -UsageType HyperV" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Data Deduplication offers three usage types. The Hyper-V usage type is tuned for VDI servers, which are a recommended deduplication workload. You enable it on the volume with `Enable-DedupVolume` and the `-UsageType` parameter.
    fr: |
      La déduplication des données propose trois types d'utilisation. Le type Hyper-V est adapté aux serveurs VDI, qui font partie des charges de travail recommandées pour la déduplication. Vous l'activez sur le volume avec `Enable-DedupVolume` et le paramètre `-UsageType`.
  options:
    a: { en: "The Default usage type is tuned for general purpose file servers, not for VDI.", fr: "Le type Default est adapté aux serveurs de fichiers à usage général, pas au VDI." }
    b: { en: "The Backup usage type is tuned for virtualized backup applications such as DPM.", fr: "Le type Backup est adapté aux applications de sauvegarde virtualisées comme DPM." }
    c: { en: "An optimization job only processes a volume on which deduplication is already enabled; V: isn't enabled yet.", fr: "Un travail d'optimisation ne traite qu'un volume sur lequel la déduplication est déjà activée ; V: ne l'est pas encore." }
references:
  - title: Install and enable Data Deduplication
    url: https://learn.microsoft.com/en-us/windows-server/storage/data-deduplication/install-enable
