id: az802-5b-sr-remove-dropdown
objective: "5.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Two servers named **SRV1** and **SRV2** run Windows Server 2025 Datacenter. A Storage Replica server-to-server partnership replicates volume F: from SRV1 (source) to SRV2 (destination).

    You need to permanently remove the replication.

    How should you complete the procedure? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Deux serveurs nommés **SRV1** et **SRV2** exécutent Windows Server 2025 Datacenter. Un partenariat de réplica de stockage de serveur à serveur réplique le volume F: de SRV1 (source) vers SRV2 (destination).

    Vous devez supprimer définitivement la réplication.

    Comment devez-vous compléter la procédure ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Step 1: Run [[cmd]] on [[where1]].

      Step 2: Run Remove-SRGroup on [[where2]].
    fr: |
      Étape 1 : exécuter [[cmd]] sur [[where1]].

      Étape 2 : exécuter Remove-SRGroup sur [[where2]].
  slots:
    - id: cmd
      options:
        - { id: remove, text: Remove-SRPartnership }
        - { id: set, text: Set-SRPartnership }
        - { id: test, text: Test-SRTopology }
    - id: where1
      options:
        - { id: src, text: { en: "SRV1 only", fr: "SRV1 uniquement" } }
        - { id: dst, text: { en: "SRV2 only", fr: "SRV2 uniquement" } }
        - { id: both, text: { en: "both SRV1 and SRV2", fr: "SRV1 et SRV2" } }
    - id: where2
      options:
        - { id: src, text: { en: "SRV1 only", fr: "SRV1 uniquement" } }
        - { id: dst, text: { en: "SRV2 only", fr: "SRV2 uniquement" } }
        - { id: both, text: { en: "both SRV1 and SRV2", fr: "SRV1 et SRV2" } }
answer:
  values: { cmd: remove, where1: src, where2: both }
explanation:
  correct:
    en: |
      To remove replication, you run Remove-SRPartnership only on the current source server, and then you run Remove-SRGroup on both servers to delete the replication groups.
    fr: |
      Pour supprimer la réplication, vous exécutez Remove-SRPartnership uniquement sur le serveur source actuel, puis vous exécutez Remove-SRGroup sur les deux serveurs pour supprimer les groupes de réplication.
  options:
    set: { en: "Set-SRPartnership changes a partnership, for example to reverse the replication direction.", fr: "Set-SRPartnership modifie un partenariat, par exemple pour inverser le sens de la réplication." }
    test: { en: "Test-SRTopology validates a proposed configuration; it doesn't remove anything.", fr: "Test-SRTopology valide une configuration envisagée ; il ne supprime rien." }
    dst: { en: "Remove-SRPartnership must not be run on the destination; each server keeps its own replication group, so Remove-SRGroup runs on both.", fr: "Remove-SRPartnership ne doit pas être exécuté sur la destination ; chaque serveur conserve son propre groupe de réplication : Remove-SRGroup s'exécute donc sur les deux." }
references:
  - title: Set up server-to-server storage replication by using Storage Replica
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-replica/server-to-server-storage-replication
