id: az802-5b-smbd-multichannel
objective: "5.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Hyper-V host named **HV2** stores virtual machines on a file server named **FS11**. Both servers run Windows Server 2025 and have RDMA-capable network adapters. SMB Direct worked until an administrator ran the following command on HV2 during a troubleshooting session:

    `Set-SmbClientConfiguration -EnableMultiChannel $false`

    Since then, SMB traffic between HV2 and FS11 uses TCP/IP. On HV2, `Get-NetAdapterRdma` shows RDMA enabled on both adapters, and the NetworkDirect global offload setting is enabled.

    You need to restore SMB Direct between HV2 and FS11.

    What should you do?
  fr: |
    Un hôte Hyper-V nommé **HV2** stocke des machines virtuelles sur un serveur de fichiers nommé **FS11**. Les deux serveurs exécutent Windows Server 2025 et possèdent des cartes réseau compatibles RDMA. SMB Direct fonctionnait jusqu'à ce qu'un administrateur exécute la commande suivante sur HV2 lors d'une session de dépannage :

    `Set-SmbClientConfiguration -EnableMultiChannel $false`

    Depuis, le trafic SMB entre HV2 et FS11 utilise TCP/IP. Sur HV2, `Get-NetAdapterRdma` indique que RDMA est activé sur les deux cartes, et le paramètre global de déchargement NetworkDirect est activé.

    Vous devez rétablir SMB Direct entre HV2 et FS11.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "On HV2, run Enable-NetAdapterRdma for both adapters.", fr: "Sur HV2, exécuter Enable-NetAdapterRdma pour les deux cartes." } }
    - { id: b, text: { en: "On FS11, run Set-SmbServerConfiguration -EnableMultiChannel $true.", fr: "Sur FS11, exécuter Set-SmbServerConfiguration -EnableMultiChannel $true." } }
    - { id: c, text: { en: "On HV2, run Set-NetOffloadGlobalSetting -NetworkDirect Enabled.", fr: "Sur HV2, exécuter Set-NetOffloadGlobalSetting -NetworkDirect Enabled." } }
    - { id: d, text: { en: "On HV2, run Set-SmbClientConfiguration -EnableMultiChannel $true.", fr: "Sur HV2, exécuter Set-SmbClientConfiguration -EnableMultiChannel $true." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      SMB Multichannel is the component that detects RDMA capability and creates the RDMA connections, so disabling it on the SMB client also disables SMB Direct. Re-enabling Multichannel in the SMB client configuration of HV2 restores RDMA connections.
    fr: |
      SMB Multichannel est le composant qui détecte la compatibilité RDMA et crée les connexions RDMA ; le désactiver sur le client SMB désactive donc aussi SMB Direct. Réactiver Multichannel dans la configuration du client SMB de HV2 rétablit les connexions RDMA.
  options:
    a:
      en: |
        RDMA is already enabled on the adapters of HV2.
      fr: |
        RDMA est déjà activé sur les cartes de HV2.
    b:
      en: |
        The change was made on the SMB client of HV2; the SMB server configuration of FS11 wasn't modified.
      fr: |
        La modification a été faite sur le client SMB de HV2 ; la configuration du serveur SMB de FS11 n'a pas été modifiée.
    c:
      en: |
        The NetworkDirect global setting is already enabled on HV2.
      fr: |
        Le paramètre global NetworkDirect est déjà activé sur HV2.
references:
  - title: Improve performance of a file server with SMB Direct
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-direct
