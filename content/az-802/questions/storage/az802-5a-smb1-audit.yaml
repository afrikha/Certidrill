id: az802-5a-smb1-audit
objective: "5.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A file server named **FS4** was upgraded in place over several Windows Server versions and still has the SMB 1.0 server enabled. Before you disable SMB 1.0 on FS4, you need to identify the clients that still connect to it by using SMBv1.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur de fichiers nommé **FS4** a été mis à niveau sur place à travers plusieurs versions de Windows Server et le serveur SMB 1.0 y est toujours activé. Avant de désactiver SMB 1.0 sur FS4, vous devez identifier les clients qui s'y connectent encore en SMBv1.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run Set-SmbServerConfiguration -AuditSmb1Access $true on FS4.", fr: "Exécuter Set-SmbServerConfiguration -AuditSmb1Access $true sur FS4." } }
    - { id: b, text: { en: "Review the events with ID 1003 in the Microsoft-Windows-SmbServer/Operational log.", fr: "Examiner les événements 1003 du journal Microsoft-Windows-SmbServer/Operational." } }
    - { id: c, text: { en: "Run Set-SmbServerConfiguration -EnableSMB1Protocol $false on FS4.", fr: "Exécuter Set-SmbServerConfiguration -EnableSMB1Protocol $false sur FS4." } }
    - { id: d, text: { en: "Review the events with ID 3000 in the Microsoft-Windows-SMBServer/Audit log.", fr: "Examiner les événements 3000 du journal Microsoft-Windows-SMBServer/Audit." } }
    - { id: e, text: { en: "Run Set-SmbServerConfiguration -AuditClientDoesNotSupportSigning $true on FS4.", fr: "Exécuter Set-SmbServerConfiguration -AuditClientDoesNotSupportSigning $true sur FS4." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Set-SmbServerConfiguration -AuditSmb1Access $true enables SMBv1 access auditing on the server. Each time a client tries to connect by using SMBv1, an event with ID 3000 is written to the Microsoft-Windows-SMBServer/Audit log, which identifies the clients to update before you disable SMB 1.0.
    fr: |
      Set-SmbServerConfiguration -AuditSmb1Access $true active l'audit des accès SMBv1 sur le serveur. Chaque fois qu'un client tente de se connecter en SMBv1, un événement 3000 est écrit dans le journal Microsoft-Windows-SMBServer/Audit, ce qui identifie les clients à mettre à jour avant de désactiver SMB 1.0.
  options:
    b: { en: "Event ID 1003 in the Operational log records clients rejected because they cannot use SMB encryption.", fr: "L'événement 1003 du journal Operational enregistre les clients rejetés parce qu'ils ne peuvent pas utiliser le chiffrement SMB." }
    c: { en: "Disabling SMB 1.0 now would cut off the clients before you know which ones they are.", fr: "Désactiver SMB 1.0 maintenant couperait les clients avant que vous sachiez lesquels sont concernés." }
    e: { en: "This setting audits clients that do not support signing, not SMBv1 connections.", fr: "Ce paramètre audite les clients qui ne prennent pas en charge la signature, pas les connexions SMBv1." }
references:
  - title: Detect, enable, and disable SMBv1, SMBv2, and SMBv3 in Windows
    url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3
