id: az802-5b-disk-online-order
objective: "5.3.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A server named **Server2** runs Windows Server 2025 Datacenter. You add a new 2-TB disk to Server2. `Get-Disk` shows the disk as number 3, with the operational status **Offline** and the partition style **RAW**.

    You need to make the disk available as an NTFS volume named **G:** that uses all the disk capacity.

    Which four commands should you run in sequence? To answer, move the appropriate commands from the list of commands to the answer area and arrange them in the correct order.
  fr: |
    Un serveur nommé **Server2** exécute Windows Server 2025 Datacenter. Vous ajoutez un nouveau disque de 2 To à Server2. `Get-Disk` affiche le disque sous le numéro 3, avec l'état opérationnel **Offline** et le style de partition **RAW**.

    Vous devez rendre le disque disponible sous la forme d'un volume NTFS nommé **G:** qui utilise toute la capacité du disque.

    Quelles sont les quatre commandes à exécuter dans l'ordre ? Pour répondre, déplacez les commandes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: online, text: "Set-Disk -Number 3 -IsOffline $false" }
    - { id: init, text: "Initialize-Disk -Number 3 -PartitionStyle GPT" }
    - { id: part, text: "New-Partition -DiskNumber 3 -UseMaximumSize -DriveLetter G" }
    - { id: format, text: "Format-Volume -DriveLetter G -FileSystem NTFS" }
    - { id: pool, text: "New-StoragePool -FriendlyName Pool1 -StorageSubSystemFriendlyName \"Windows Storage*\" -PhysicalDisks (Get-PhysicalDisk -CanPool $true)" }
    - { id: resize, text: "Resize-Partition -DriveLetter G -Size 2TB" }
answer:
  sequence: [ online, init, part, format ]
explanation:
  correct:
    en: |
      An offline disk must be brought online before you can initialize it. Initializing writes the partition style (GPT is the default and supports volumes larger than 2 TB), then you create a partition that uses the maximum size with the drive letter G, and finally you format it with NTFS.
    fr: |
      Un disque hors connexion doit être mis en ligne avant de pouvoir être initialisé. L'initialisation écrit le style de partition (GPT est le style par défaut et prend en charge les volumes de plus de 2 To), puis vous créez une partition de taille maximale avec la lettre G, et enfin vous la formatez en NTFS.
  options:
    pool:
      en: |
        A storage pool isn't required to use a single disk, and it would consume the disk instead of creating G: directly.
      fr: |
        Un pool de stockage n'est pas nécessaire pour utiliser un seul disque, et il consommerait le disque au lieu de créer G: directement.
    resize:
      en: |
        The partition created with -UseMaximumSize already uses all the available space; there is nothing to resize.
      fr: |
        La partition créée avec -UseMaximumSize utilise déjà tout l'espace disponible : il n'y a rien à redimensionner.
references:
  - title: Initialize new disks
    url: https://learn.microsoft.com/en-us/windows-server/storage/disk-management/initialize-new-disks
