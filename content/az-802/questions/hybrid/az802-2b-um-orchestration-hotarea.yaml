id: az802-2b-um-orchestration-hotarea
objective: "2.2.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. manages the machines shown in the following table by using Azure Update Manager. The on-premises servers are Generation 2 Hyper-V virtual machines with Secure Boot enabled and virtualization-based security running, and they run a supported build of their operating system.

    You create a maintenance configuration named **MC1** that installs Critical and Security updates every Saturday, and you associate all four machines with MC1. You don't change any other setting.

    Answer each prompt by selecting the appropriate machine.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. gère les machines présentées dans le tableau suivant à l'aide du Gestionnaire de mise à jour Azure. Les serveurs locaux sont des machines virtuelles Hyper-V de génération 2 avec le démarrage sécurisé activé et la sécurité basée sur la virtualisation en cours d'exécution, et ils exécutent une build prise en charge de leur système d'exploitation.

    Vous créez une configuration de maintenance nommée **MC1** qui installe les mises à jour Critical et Security chaque samedi, puis vous associez les quatre machines à MC1. Vous ne modifiez aucun autre paramètre.

    Répondez à chaque consigne en sélectionnant la machine appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The machine that MC1 won't patch until you change its patch orchestration setting", fr: "La machine que MC1 ne mettra pas à jour tant que vous n'aurez pas modifié son paramètre d'orchestration des correctifs" }
    - id: p2
      text: { en: "The machine on which you can enable Hotpatch from its Hotpatch page in Azure Arc", fr: "La machine sur laquelle vous pouvez activer Hotpatch depuis sa page Hotpatch dans Azure Arc" }
  grid:
    header: [{ en: "Machine", fr: "Machine" }, { en: "Location", fr: "Emplacement" }, { en: "Operating system", fr: "Système d'exploitation" }, { en: "Patch orchestration", fr: "Orchestration des correctifs" }]
    rows:
      - [{ text: VM1, area: vm1 }, { text: { en: "Azure VM", fr: "Machine virtuelle Azure" } }, { text: Windows Server 2022 Datacenter }, { text: Customer Managed Schedules }]
      - [{ text: VM2, area: vm2 }, { text: { en: "Azure VM", fr: "Machine virtuelle Azure" } }, { text: Windows Server 2025 Datacenter }, { text: Windows Automatic Updates }]
      - [{ text: SRV1, area: srv1 }, { text: { en: "On-premises, Azure Arc-enabled", fr: "Local, activé pour Azure Arc" } }, { text: Windows Server 2022 Standard }, { text: Windows Automatic Updates }]
      - [{ text: SRV2, area: srv2 }, { text: { en: "On-premises, Azure Arc-enabled", fr: "Local, activé pour Azure Arc" } }, { text: Windows Server 2025 Standard }, { text: Windows Automatic Updates }]
answer:
  values: { p1: vm2, p2: srv2 }
explanation:
  correct:
    en: |
      Scheduled patching requires Azure VMs to use the Customer Managed Schedules patch orchestration, so VM2 isn't patched by MC1 until you change it; VM1 already uses it, and the setting isn't a requirement for Azure Arc-enabled machines such as SRV1 and SRV2. Hotpatch for Arc-enabled servers supports Windows Server 2025 Standard and Datacenter on UEFI with Secure Boot and virtualization-based security, and it's enabled from the machine's Hotpatch page in Azure Arc: only SRV2 qualifies. SRV1 runs Windows Server 2022.
    fr: |
      L'application planifiée des correctifs exige que les machines virtuelles Azure utilisent l'orchestration des correctifs Customer Managed Schedules : MC1 ne met donc pas à jour VM2 tant que vous ne la modifiez pas ; VM1 l'utilise déjà, et ce paramètre n'est pas obligatoire pour les machines activées pour Azure Arc comme SRV1 et SRV2. Hotpatch pour les serveurs activés pour Azure Arc prend en charge Windows Server 2025 Standard et Datacenter sur UEFI avec démarrage sécurisé et sécurité basée sur la virtualisation, et s'active depuis la page Hotpatch de la machine dans Azure Arc : seul SRV2 remplit ces conditions. SRV1 exécute Windows Server 2022.
  options:
    vm1: { en: "VM1 already uses Customer Managed Schedules, and it's an Azure VM, not an Arc-enabled machine.", fr: "VM1 utilise déjà Customer Managed Schedules, et c'est une machine virtuelle Azure, pas une machine activée pour Azure Arc." }
    srv1: { en: "Arc-enabled machines don't need Customer Managed Schedules, and Windows Server 2022 isn't supported by Hotpatch for Arc-enabled servers.", fr: "Les machines activées pour Azure Arc n'ont pas besoin de Customer Managed Schedules, et Windows Server 2022 n'est pas pris en charge par Hotpatch pour les serveurs activés pour Azure Arc." }
references:
  - title: Scheduling Recurring Updates in Azure Update Manager
    url: https://learn.microsoft.com/en-us/azure/update-manager/scheduled-patching
  - title: Enable Hotpatch for Azure Arc-enabled servers
    url: https://learn.microsoft.com/en-us/windows-server/get-started/enable-hotpatch-azure-arc-enabled-servers
