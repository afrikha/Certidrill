id: az802-2b-mc-local-control
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has an on-premises server named **SRV1** that runs Windows Server 2025 and is onboarded to Azure Arc. The Azure Connected Machine agent runs in full mode with the default extension settings.

    A local administrator of SRV1 runs the following command on SRV1:

    `azcmagent config set guestconfiguration.enabled false`

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un serveur local nommé **SRV1** qui exécute Windows Server 2025 et qui est intégré à Azure Arc. L'agent Azure Connected Machine fonctionne en mode complet avec les paramètres d'extension par défaut.

    Un administrateur local de SRV1 exécute la commande suivante sur SRV1 :

    `azcmagent config set guestconfiguration.enabled false`

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A user who has the Owner role on the subscription can turn machine configuration back on for SRV1 from the Azure portal.
        fr: Un utilisateur qui dispose du rôle Owner sur l'abonnement peut réactiver la configuration de machine pour SRV1 depuis le portail Azure.
    - id: s2
      text:
        en: An administrator can still deploy the Azure Monitor Agent extension to SRV1 from Azure.
        fr: Un administrateur peut toujours déployer l'extension Azure Monitor Agent sur SRV1 depuis Azure.
    - id: s3
      text:
        en: Switching the agent of a server to monitor mode by running `azcmagent config set config.mode monitor` also disables its guest configuration policy agent.
        fr: Le passage de l'agent d'un serveur en mode surveillance avec `azcmagent config set config.mode monitor` désactive aussi son agent de stratégie de configuration d'invité.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The agent's local security settings can only be changed by running `azcmagent` on the server itself; nobody, not even an Owner in Azure, can override them from the cloud. Disabling guest configuration doesn't disable the extension manager, so extensions such as the Azure Monitor Agent can still be deployed. Monitor mode allows only monitoring and security extensions and also disables the guest configuration policy agent.
    fr: |
      Les paramètres de sécurité locaux de l'agent ne peuvent être modifiés qu'en exécutant `azcmagent` sur le serveur lui-même ; personne, pas même un Owner dans Azure, ne peut les remplacer depuis le cloud. La désactivation de la configuration d'invité ne désactive pas le gestionnaire d'extensions : des extensions comme l'agent Azure Monitor peuvent toujours être déployées. Le mode surveillance n'autorise que les extensions de surveillance et de sécurité, et il désactive aussi l'agent de stratégie de configuration d'invité.
references:
  - title: Extensions security for Azure Arc-enabled servers
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/security-extensions
