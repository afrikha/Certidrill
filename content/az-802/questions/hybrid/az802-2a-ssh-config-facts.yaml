id: az802-2a-ssh-config-facts
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a server named **SRV6** that runs Windows Server 2022. OpenSSH Server is installed on SRV6 with the default configuration. You plan to change the configuration of the SSH server.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un serveur nommé **SRV6** qui exécute Windows Server 2022. OpenSSH Server est installé sur SRV6 avec la configuration par défaut. Vous prévoyez de modifier la configuration du serveur SSH.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          To write sshd logs to files under `%programdata%\ssh\logs`, you set `SyslogFacility LOCAL0` in sshd_config.
        fr: |-
          Pour écrire les journaux de sshd dans des fichiers sous `%programdata%\ssh\logs`, vous définissez `SyslogFacility LOCAL0` dans sshd_config.
    - id: s2
      text:
        en: |-
          To prevent members of the Administrators group from signing in over SSH, you set `PermitRootLogin no` in sshd_config.
        fr: |-
          Pour empêcher les membres du groupe Administrators de se connecter via SSH, vous définissez `PermitRootLogin no` dans sshd_config.
    - id: s3
      text:
        en: |-
          Until you set the `DefaultShell` string value under `HKLM:\SOFTWARE\OpenSSH`, SSH sessions on SRV6 open in cmd.exe.
        fr: |-
          Tant que vous ne définissez pas la valeur de chaîne `DefaultShell` sous `HKLM:\SOFTWARE\OpenSSH`, les sessions SSH sur SRV6 s'ouvrent dans cmd.exe.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      With `SyslogFacility LOCAL0`, sshd writes file-based logs under `%programdata%\ssh\logs`; any other value sends logging to ETW. PermitRootLogin doesn't apply on Windows: to block administrators, use `DenyGroups administrators`. The initial default shell is cmd.exe, and you change it with the DefaultShell value under HKLM\SOFTWARE\OpenSSH.
    fr: |
      Avec `SyslogFacility LOCAL0`, sshd écrit des journaux dans des fichiers sous `%programdata%\ssh\logs` ; toute autre valeur envoie la journalisation vers ETW. PermitRootLogin ne s'applique pas sous Windows : pour bloquer les administrateurs, utilisez `DenyGroups administrators`. Le shell par défaut initial est cmd.exe, et vous le modifiez avec la valeur DefaultShell sous HKLM\SOFTWARE\OpenSSH.
references:
  - title: OpenSSH Server Configuration for Windows
    url: https://learn.microsoft.com/en-us/windows-server/administration/openssh/openssh-server-configuration
