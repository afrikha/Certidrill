id: az802-2a-ssh-key-session-network
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a member server named **SRV5** that runs Windows Server 2025 with OpenSSH Server enabled. A domain user named **User1** isn't an administrator of SRV5. User1's public key is stored in `C:\Users\user1\.ssh\authorized_keys` on SRV5.

    User1 connects to SRV5 by using key-based authentication and signs in successfully. In the session, `dir \\FS1\Reports` returns an access denied error, although User1 has Read permissions on the share. When User1 connects to SRV5 by using password authentication, the same command succeeds.

    What causes the issue?
  fr: |
    Contoso, Ltd. dispose d'un serveur membre nommé **SRV5** qui exécute Windows Server 2025 avec OpenSSH Server activé. Un utilisateur de domaine nommé **User1** n'est pas administrateur de SRV5. La clé publique de User1 est stockée dans `C:\Users\user1\.ssh\authorized_keys` sur SRV5.

    User1 se connecte à SRV5 avec l'authentification par clé et la connexion réussit. Dans la session, `dir \\FS1\Reports` renvoie une erreur d'accès refusé, bien que User1 dispose de l'autorisation Lecture sur le partage. Lorsque User1 se connecte à SRV5 avec l'authentification par mot de passe, la même commande réussit.

    Quelle est la cause du problème ?
body:
  options:
    - { id: a, text: { en: "The public key must be stored in the administrators_authorized_keys file.", fr: "La clé publique doit être stockée dans le fichier administrators_authorized_keys." } }
    - { id: b, text: { en: "The session opened with the key has no user credentials for outbound authentication.", fr: "La session ouverte avec la clé n'a pas d'informations d'identification pour l'authentification sortante." } }
    - { id: c, text: { en: "The default cmd.exe shell of OpenSSH can't open UNC paths.", fr: "Le shell cmd.exe par défaut d'OpenSSH ne peut pas ouvrir de chemins UNC." } }
    - { id: d, text: { en: "The OpenSSH-Server-In-TCP firewall rule blocks SMB traffic from SRV5.", fr: "La règle de pare-feu OpenSSH-Server-In-TCP bloque le trafic SMB depuis SRV5." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A remote session opened with key-based authentication has no associated user credentials, so it can't authenticate to other computers as the user; this behavior is by design. With password authentication, the session has User1's credentials and can access the share on FS1.
    fr: |
      Une session à distance ouverte avec l'authentification par clé n'a pas d'informations d'identification associées : elle ne peut donc pas s'authentifier auprès d'autres ordinateurs en tant qu'utilisateur ; ce comportement est voulu. Avec l'authentification par mot de passe, la session dispose des informations d'identification de User1 et peut accéder au partage de FS1.
  options:
    a:
      en: administrators_authorized_keys is only for members of the Administrators group; User1 is a standard user, and the key sign-in already works.
      fr: administrators_authorized_keys est réservé aux membres du groupe Administrators ; User1 est un utilisateur standard, et la connexion par clé fonctionne déjà.
    c:
      en: The shell is the same with both authentication methods, and the command works with password authentication.
      fr: Le shell est le même avec les deux méthodes d'authentification, et la commande fonctionne avec l'authentification par mot de passe.
    d:
      en: OpenSSH-Server-In-TCP is an inbound rule for TCP port 22; it doesn't block outbound SMB, which works with password authentication.
      fr: OpenSSH-Server-In-TCP est une règle entrante pour le port TCP 22 ; elle ne bloque pas le trafic SMB sortant, qui fonctionne avec l'authentification par mot de passe.
references:
  - title: Key-Based Authentication in OpenSSH for Windows
    url: https://learn.microsoft.com/en-us/windows-server/administration/openssh/openssh_keymanagement
