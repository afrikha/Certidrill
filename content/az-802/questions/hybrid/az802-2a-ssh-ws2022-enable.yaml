id: az802-2a-ssh-ws2022-enable
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a server named **SRV2** that runs Windows Server 2022. On SRV2, `Get-WindowsCapability -Online | Where-Object Name -like 'OpenSSH*'` shows that **OpenSSH.Server~~~~0.0.1.0** has the state **NotPresent**.

    You need to allow administrators to connect to SRV2 by using SSH.

    Which command should you run first on SRV2?
  fr: |
    Contoso, Ltd. dispose d'un serveur nommé **SRV2** qui exécute Windows Server 2022. Sur SRV2, `Get-WindowsCapability -Online | Where-Object Name -like 'OpenSSH*'` indique que **OpenSSH.Server~~~~0.0.1.0** a l'état **NotPresent**.

    Vous devez permettre aux administrateurs de se connecter à SRV2 à l'aide de SSH.

    Quelle commande devez-vous exécuter en premier sur SRV2 ?
body:
  options:
    - { id: c, text: "Start-Service sshd" }
    - { id: b, text: "Enable-PSRemoting -Force" }
    - { id: a, text: "Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0" }
    - { id: d, text: "Set-Service -Name ssh-agent -StartupType Automatic" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      On Windows Server 2019 and 2022, OpenSSH Server is an optional capability that you add first, for example with Add-WindowsCapability. You then start the sshd service and set it to start automatically; the installation creates the OpenSSH-Server-In-TCP firewall rule for TCP port 22. Only Windows Server 2025 has OpenSSH installed by default.
    fr: |
      Sur Windows Server 2019 et 2022, OpenSSH Server est une fonctionnalité facultative que vous ajoutez d'abord, par exemple avec Add-WindowsCapability. Vous démarrez ensuite le service sshd et le configurez en démarrage automatique ; l'installation crée la règle de pare-feu OpenSSH-Server-In-TCP pour le port TCP 22. Seul Windows Server 2025 a OpenSSH installé par défaut.
  options:
    c:
      en: The sshd service doesn't exist until OpenSSH Server is installed.
      fr: Le service sshd n'existe pas tant qu'OpenSSH Server n'est pas installé.
    b:
      en: Enable-PSRemoting configures WinRM-based PowerShell remoting, not the SSH server.
      fr: Enable-PSRemoting configure la communication à distance PowerShell basée sur WinRM, pas le serveur SSH.
    d:
      en: ssh-agent stores private keys for the SSH client; it doesn't accept incoming SSH connections.
      fr: ssh-agent stocke les clés privées pour le client SSH ; il n'accepte pas de connexions SSH entrantes.
references:
  - title: Get started with OpenSSH Server for Windows
    url: https://learn.microsoft.com/en-us/windows-server/administration/openssh/openssh_install_firstuse
