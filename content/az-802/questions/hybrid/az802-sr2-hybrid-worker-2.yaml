id: az802-sr2-hybrid-worker-2
objective: "2.2.5"
type: series_yesno
series: az802-sr2-hybrid-worker
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You install the Log Analytics agent on FS1 and register FS1 as an agent-based Hybrid Runbook Worker.
  fr: |
    Vous installez l'agent Log Analytics sur FS1 et inscrivez FS1 comme Runbook Worker hybride basé sur un agent.
body:
  solution:
    en: |
      You install the Log Analytics agent on FS1 and connect it to a Log Analytics workspace linked to Auto1. You register FS1 as an agent-based user Hybrid Runbook Worker in a group named **HWG1**, link a daily schedule at 01:00 to Clear-Staging and set **Run on** to **Hybrid Worker** with HWG1 selected.
    fr: |
      Vous installez l'agent Log Analytics sur FS1 et le connectez à un espace de travail Log Analytics lié à Auto1. Vous inscrivez FS1 comme Runbook Worker hybride utilisateur basé sur un agent dans un groupe nommé **HWG1**, liez une planification quotidienne à 01:00 à Clear-Staging et définissez **Run on** sur **Hybrid Worker** en sélectionnant HWG1.
answer: { value: false }
explanation:
  correct:
    en: |
      The agent-based user Hybrid Runbook Worker retired on 31 August 2024, and jobs on agent-based workers have been stopped since 1 April 2025. The supported platform is the extension-based worker, which does not depend on the Log Analytics agent and requires the Connected Machine agent on non-Azure machines.
    fr: |
      Le Runbook Worker hybride utilisateur basé sur un agent a été mis hors service le 31 août 2024, et les travaux sur les Workers basés sur un agent sont arrêtés depuis le 1er avril 2025. La plateforme prise en charge est le Worker basé sur une extension, qui ne dépend pas de l'agent Log Analytics et nécessite l'agent Connected Machine sur les machines non Azure.
references:
  - title: Azure Automation Hybrid Runbook Worker Overview
    url: https://learn.microsoft.com/en-us/azure/automation/automation-hybrid-runbook-worker
