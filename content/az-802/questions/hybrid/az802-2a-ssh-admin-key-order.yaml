id: az802-2a-ssh-admin-key-order
objective: "2.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a server named **SRV3** that runs Windows Server 2025 with OpenSSH Server enabled, and a computer named **Client1** that runs Windows 11. A user named **Admin1** is a member of the Administrators group on SRV3.

    You need to configure key-based SSH authentication from Client1 to SRV3 for Admin1.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso, Ltd. dispose d'un serveur nommé **SRV3** qui exécute Windows Server 2025 avec OpenSSH Server activé, et d'un ordinateur nommé **Client1** qui exécute Windows 11. Un utilisateur nommé **Admin1** est membre du groupe Administrators de SRV3.

    Vous devez configurer l'authentification SSH par clé de Client1 vers SRV3 pour Admin1.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: keygen
      text:
        en: |-
          On Client1, run `ssh-keygen -t ecdsa` as Admin1.
        fr: |-
          Sur Client1, exécuter `ssh-keygen -t ecdsa` en tant qu'Admin1.
    - id: adminkeys
      text:
        en: |-
          Append the content of the .pub file to `C:\ProgramData\ssh\administrators_authorized_keys` on SRV3.
        fr: |-
          Ajouter le contenu du fichier .pub à `C:\ProgramData\ssh\administrators_authorized_keys` sur SRV3.
    - id: acl
      text:
        en: |-
          On SRV3, use icacls to remove inheritance from that file and grant Full Control only to Administrators and SYSTEM.
        fr: |-
          Sur SRV3, utiliser icacls pour supprimer l'héritage sur ce fichier et accorder Contrôle total uniquement à Administrators et SYSTEM.
    - id: userkeys
      text:
        en: |-
          Append the content of the .pub file to `C:\Users\admin1\.ssh\authorized_keys` on SRV3.
        fr: |-
          Ajouter le contenu du fichier .pub à `C:\Users\admin1\.ssh\authorized_keys` sur SRV3.
    - id: private
      text:
        en: |-
          Copy the private key file from Client1 to `C:\ProgramData\ssh` on SRV3.
        fr: |-
          Copier le fichier de clé privée de Client1 vers `C:\ProgramData\ssh` sur SRV3.
    - id: agent
      text:
        en: |-
          On SRV3, set the ssh-agent service to start automatically, and then start it.
        fr: |-
          Sur SRV3, configurer le service ssh-agent en démarrage automatique, puis le démarrer.
answer:
  sequence: [ keygen, adminkeys, acl ]
explanation:
  correct:
    en: |
      The key pair is generated on the client. For a member of the Administrators group, sshd reads the public key from `administrators_authorized_keys` in `C:\ProgramData\ssh` instead of the user's profile, and that file must only have permission entries for Administrators and SYSTEM, or key authentication fails.
    fr: |
      La paire de clés est générée sur le client. Pour un membre du groupe Administrators, sshd lit la clé publique dans `administrators_authorized_keys`, sous `C:\ProgramData\ssh`, au lieu du profil de l'utilisateur, et ce fichier ne doit contenir que des entrées d'autorisation pour Administrators et SYSTEM, sinon l'authentification par clé échoue.
  options:
    userkeys: { en: "The per-user authorized_keys file applies to standard users; administrators must use administrators_authorized_keys.", fr: "Le fichier authorized_keys du profil s'applique aux utilisateurs standard ; les administrateurs doivent utiliser administrators_authorized_keys." }
    private: { en: "The private key stays on the client and must be protected like a password; only the public key goes to the server.", fr: "La clé privée reste sur le client et doit être protégée comme un mot de passe ; seule la clé publique va sur le serveur." }
    agent: { en: "ssh-agent optionally stores private keys on the client side; it isn't needed on the server.", fr: "ssh-agent stocke éventuellement les clés privées côté client ; il n'est pas nécessaire sur le serveur." }
references:
  - title: Key-Based Authentication in OpenSSH for Windows
    url: https://learn.microsoft.com/en-us/windows-server/administration/openssh/openssh_keymanagement
