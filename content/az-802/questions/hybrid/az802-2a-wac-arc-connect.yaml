id: az802-2a-wac-arc-connect
objective: "2.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. has an on-premises server named **ARC1** that runs Windows Server 2022, has 8 GB of memory, and is connected to Azure Arc with a current version of the Azure Connected Machine agent. The **Microsoft.HybridConnectivity** resource provider is registered in the subscription.

    The perimeter firewall blocks all inbound traffic to ARC1. Outbound, it allows HTTPS from ARC1 only to the endpoints that the Connected Machine agent always requires.

    A user named **User1** has the Reader role on ARC1 and no other role assignment. User1 must install Windows Admin Center on ARC1 from the Azure portal and then manage ARC1 by using it. The solution must follow the principle of least privilege.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose d'un serveur local nommé **ARC1** qui exécute Windows Server 2022, dispose de 8 Go de mémoire et est connecté à Azure Arc avec une version actuelle de l'agent Azure Connected Machine. Le fournisseur de ressources **Microsoft.HybridConnectivity** est inscrit dans l'abonnement.

    Le pare-feu de périmètre bloque tout le trafic entrant vers ARC1. En sortie, il autorise le trafic HTTPS d'ARC1 uniquement vers les points de terminaison dont l'agent Connected Machine a toujours besoin.

    Un utilisateur nommé **User1** a le rôle Reader sur ARC1 et aucune autre attribution de rôle. User1 doit installer Windows Admin Center sur ARC1 depuis le portail Azure, puis gérer ARC1 avec cet outil. La solution doit respecter le principe du privilège minimum.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Allow outbound HTTPS from ARC1 to the WindowsAdminCenter service tag.", fr: "Autoriser le trafic HTTPS sortant d'ARC1 vers l'étiquette de service WindowsAdminCenter." } }
    - { id: b, text: { en: "Allow inbound TCP 6516 from the internet to ARC1 on the perimeter firewall.", fr: "Autoriser le trafic TCP 6516 entrant depuis Internet vers ARC1 sur le pare-feu de périmètre." } }
    - { id: c, text: { en: "Assign the Azure Connected Machine Resource Administrator role on ARC1 to User1.", fr: "Attribuer le rôle Azure Connected Machine Resource Administrator sur ARC1 à User1." } }
    - { id: d, text: { en: "Assign the Windows Admin Center Administrator Login role on ARC1 to User1.", fr: "Attribuer le rôle Windows Admin Center Administrator Login sur ARC1 à User1." } }
    - { id: e, text: { en: "Add User1 to the local Administrators group of ARC1.", fr: "Ajouter User1 au groupe local Administrators d'ARC1." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Windows Admin Center for Arc-enabled servers needs outbound HTTPS to `*.waconazure.com` or the WindowsAdminCenter service tag, which isn't among the endpoints the agent always requires; `pas.windows.net` and `*.servicebus.windows.net` are already allowed. The Windows Admin Center Administrator Login role lets User1 install the extension, and together with Reader it lets User1 connect, without granting other management rights.
    fr: |
      Windows Admin Center pour les serveurs activés pour Arc demande un accès HTTPS sortant vers `*.waconazure.com` ou l'étiquette de service WindowsAdminCenter, qui ne fait pas partie des points de terminaison toujours requis par l'agent ; `pas.windows.net` et `*.servicebus.windows.net` sont déjà autorisés. Le rôle Windows Admin Center Administrator Login permet à User1 d'installer l'extension et, avec Reader, de se connecter, sans accorder d'autres droits de gestion.
  options:
    b:
      en: No inbound port is required for Windows Admin Center on an Arc-enabled server; the portal reaches the machine through the agent's outbound connectivity.
      fr: Aucun port entrant n'est nécessaire pour Windows Admin Center sur un serveur activé pour Arc ; le portail atteint la machine par la connectivité sortante de l'agent.
    c:
      en: Azure Connected Machine Resource Administrator manages Arc resources and extensions in general; it's broader than needed and doesn't grant the Windows Admin Center sign-in.
      fr: Azure Connected Machine Resource Administrator gère les ressources Arc et leurs extensions en général ; il est plus large que nécessaire et n'accorde pas la connexion à Windows Admin Center.
    e:
      en: Windows Admin Center in Azure uses Microsoft Entra ID-based authentication for hybrid machines; access is controlled by the Azure role, not by local group membership.
      fr: Windows Admin Center dans Azure utilise l'authentification basée sur Microsoft Entra ID pour les machines hybrides ; l'accès est contrôlé par le rôle Azure, pas par l'appartenance à un groupe local.
references:
  - title: Manage Azure Arc-enabled Servers using Windows Admin Center in Azure
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/azure/manage-arc-hybrid-machines
  - title: Connected Machine Agent Network Requirements
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/network-requirements
