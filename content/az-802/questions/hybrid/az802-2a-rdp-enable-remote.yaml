id: az802-2a-rdp-enable-remote
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a member server named **SRV15** that runs a Server Core installation of Windows Server 2025. Remote Desktop is disabled on SRV15, and its Windows Firewall rules use the default configuration.

    From a management server, you open a session by running `Enter-PSSession -ComputerName SRV15`. You need to enable Remote Desktop connections to SRV15 from that session.

    Which two commands should you run? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un serveur membre nommé **SRV15** qui exécute une installation Server Core de Windows Server 2025. Le Bureau à distance est désactivé sur SRV15, et ses règles du Pare-feu Windows utilisent la configuration par défaut.

    Depuis un serveur de gestion, vous ouvrez une session en exécutant `Enter-PSSession -ComputerName SRV15`. Vous devez activer les connexions Bureau à distance vers SRV15 depuis cette session.

    Quelles sont les deux commandes à exécuter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: |-
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - id: b
      text: |-
        SConfig
    - id: c
      text: |-
        Enable-NetFirewallRule -DisplayGroup "Windows Remote Management"
    - id: d
      text: |-
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 1
    - id: e
      text: |-
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      Setting fDenyTSConnections to 0 allows Remote Desktop connections, and enabling the built-in Remote Desktop firewall rule group opens TCP and UDP 3389. Both commands work in a remote PowerShell session.
    fr: |
      Définir fDenyTSConnections sur 0 autorise les connexions Bureau à distance, et l'activation du groupe de règles de pare-feu intégré Remote Desktop ouvre les ports TCP et UDP 3389. Les deux commandes fonctionnent dans une session PowerShell à distance.
  options:
    b:
      en: SConfig can be used locally or over Remote Desktop, but not in a remote PowerShell session.
      fr: SConfig s'utilise localement ou par le Bureau à distance, mais pas dans une session PowerShell à distance.
    c:
      en: The Windows Remote Management rules already allow your PowerShell session; they don't open the Remote Desktop port.
      fr: Les règles Windows Remote Management autorisent déjà votre session PowerShell ; elles n'ouvrent pas le port du Bureau à distance.
    d:
      en: A value of 1 denies Remote Desktop connections.
      fr: La valeur 1 refuse les connexions Bureau à distance.
references:
  - title: Configure a Server Core installation of Windows Server and Azure Local with the Server Configuration tool (SConfig)
    url: https://learn.microsoft.com/en-us/windows-server/administration/server-core/server-core-sconfig
