id: az802-cs1a-plant-patching
objective: "2.2.4"
type: multi
caseStudy: az802-cs1a-munsons
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the update requirement by using Azure Update Manager.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter l'exigence relative aux mises à jour à l'aide du Gestionnaire de mise à jour Azure.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add MON-APP1, TRU-APP1 and GAN-APP1 to the maintenance configuration as selected machines.", fr: "Ajouter MON-APP1, TRU-APP1 et GAN-APP1 à la configuration de maintenance comme machines sélectionnées." } }
    - { id: b, text: { en: "Create a maintenance configuration with a weekly recurrence on Saturday at 23:00 and the Critical and Security classifications.", fr: "Créer une configuration de maintenance avec une périodicité hebdomadaire le samedi à 23 h 00 et les classifications Critical et Security." } }
    - { id: c, text: { en: "Enable periodic assessment on the plant servers.", fr: "Activer l'évaluation périodique sur les serveurs des usines." } }
    - { id: d, text: { en: "Add a dynamic scope to the maintenance configuration that filters Azure Arc-enabled servers on the tag Role=PlantServer.", fr: "Ajouter à la configuration de maintenance une étendue dynamique qui filtre les serveurs activés pour Azure Arc sur l'étiquette Role=PlantServer." } }
    - { id: e, text: { en: "Run a one-time update on the plant servers every Saturday.", fr: "Exécuter une mise à jour ponctuelle sur les serveurs des usines chaque samedi." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Update Manager saves recurring schedules as maintenance configurations, which define when updates install and which classifications apply. A dynamic scope groups machines by criteria such as tags and is evaluated at the scheduled run time, so new Arc-enabled servers tagged Role=PlantServer are patched without editing the schedule. Scheduled patching of Arc-enabled servers doesn't require the Customer Managed Schedules patch orchestration setting that Azure VMs need.
    fr: |
      Le Gestionnaire de mise à jour enregistre les planifications récurrentes sous forme de configurations de maintenance, qui définissent quand les mises à jour s'installent et quelles classifications s'appliquent. Une étendue dynamique regroupe les machines selon des critères comme les étiquettes et elle est évaluée à l'heure d'exécution planifiée : les nouveaux serveurs Arc portant l'étiquette Role=PlantServer sont donc mis à jour sans modifier la planification. La mise à jour planifiée des serveurs activés pour Azure Arc n'exige pas le paramètre d'orchestration des correctifs Customer Managed Schedules requis pour les machines virtuelles Azure.
  options:
    a: { en: "A static list of machines doesn't include servers onboarded later; you would have to edit the schedule.", fr: "Une liste statique de machines n'inclut pas les serveurs intégrés plus tard ; il faudrait modifier la planification." }
    c: { en: "Periodic assessment only checks for missing updates; it doesn't install them.", fr: "L'évaluation périodique recherche seulement les mises à jour manquantes ; elle ne les installe pas." }
    e: { en: "A one-time update must be started manually each time, which doesn't minimize administrative effort.", fr: "Une mise à jour ponctuelle doit être lancée manuellement à chaque fois, ce qui ne réduit pas l'effort d'administration." }
references:
  - title: Schedule recurring updates for machines by using the Azure portal and Azure Policy
    url: https://learn.microsoft.com/en-us/azure/update-manager/scheduled-patching
  - title: About dynamic scoping
    url: https://learn.microsoft.com/en-us/azure/update-manager/dynamic-scope-overview
