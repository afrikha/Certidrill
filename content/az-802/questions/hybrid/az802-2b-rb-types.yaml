id: az802-2b-rb-types
objective: "2.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation is creating runbooks in an Azure Automation account. Each runbook has the requirement shown in the answer area.

    Which runbook type and runtime should you use for each runbook? To answer, drag the appropriate runbook types to the correct runbooks. Each runbook type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation crée des runbooks dans un compte Azure Automation. Chaque runbook a l'exigence indiquée dans la zone de réponse.

    Quel type de runbook et quel runtime devez-vous utiliser pour chaque runbook ? Pour répondre, faites glisser les types de runbook appropriés vers les runbooks correspondants. Chaque type de runbook peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ps74, text: { en: "PowerShell, runtime 7.4", fr: "PowerShell, runtime 7.4" } }
    - { id: ps51, text: { en: "PowerShell, runtime 5.1", fr: "PowerShell, runtime 5.1" } }
    - { id: py, text: { en: "Python, runtime 3.10", fr: "Python, runtime 3.10" } }
    - { id: graph, text: { en: "Graphical", fr: "Graphique (Graphical)" } }
    - { id: wf, text: { en: "PowerShell Workflow", fr: "PowerShell Workflow" } }
  targets:
    - id: parallel
      text: { en: "RB1: uses ForEach-Object -Parallel, a PowerShell 7 feature", fr: "RB1 : utilise ForEach-Object -Parallel, une fonctionnalité de PowerShell 7" }
    - id: nocode
      text: { en: "RB2: built by operators who link activities in the Azure portal without writing code", fr: "RB2 : créé par des opérateurs qui relient des activités dans le portail Azure sans écrire de code" }
    - id: linux
      text: { en: "RB3: runs on a Linux Hybrid Runbook Worker and uses Python packages", fr: "RB3 : s'exécute sur un Hybrid Runbook Worker Linux et utilise des packages Python" }
    - id: checkpoint
      text: { en: "RB4: an existing runbook that resumes from a checkpoint after a job interruption", fr: "RB4 : un runbook existant qui reprend à partir d'un point de contrôle après une interruption de la tâche" }
answer:
  mapping: { parallel: ps74, nocode: graph, linux: py, checkpoint: wf }
explanation:
  correct:
    en: |
      PowerShell 7 features need a PowerShell runbook on a 7.x runtime such as 7.4. Graphical runbooks are created and edited only in the portal's graphical editor, by linking activities. Python 3.10 runbooks suit Python code, and graphical or PowerShell Workflow runbooks can't run on a Linux Hybrid Runbook Worker. Checkpoints are a feature of PowerShell Workflow runbooks, which aren't recommended for new work and aren't supported in PowerShell 7.
    fr: |
      Les fonctionnalités de PowerShell 7 exigent un runbook PowerShell avec un runtime 7.x comme 7.4. Les runbooks graphiques se créent et se modifient uniquement dans l'éditeur graphique du portail, en reliant des activités. Les runbooks Python 3.10 conviennent au code Python, et les runbooks graphiques ou PowerShell Workflow ne peuvent pas s'exécuter sur un Hybrid Runbook Worker Linux. Les points de contrôle sont une fonctionnalité des runbooks PowerShell Workflow, qui ne sont pas recommandés pour les nouveaux développements et ne sont pas pris en charge dans PowerShell 7.
  options:
    ps51: { en: "Runtime 5.1 is Windows PowerShell, which doesn't have ForEach-Object -Parallel.", fr: "Le runtime 5.1 correspond à Windows PowerShell, qui ne dispose pas de ForEach-Object -Parallel." }
references:
  - title: Azure Automation Runbook Types
    url: https://learn.microsoft.com/en-us/azure/automation/automation-runbook-types
