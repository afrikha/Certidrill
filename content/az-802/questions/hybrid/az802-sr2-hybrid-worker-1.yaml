id: az802-sr2-hybrid-worker-1
objective: "2.2.5"
type: series_yesno
series: az802-sr2-hybrid-worker
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: |
    You link a schedule to the runbook, keep Run on set to Azure and target FS1 by using Invoke-Command.
  fr: |
    Vous liez une planification au runbook, conservez Run on sur Azure et ciblez FS1 à l'aide d'Invoke-Command.
body:
  solution:
    en: |
      You modify Clear-Staging so that it runs its cleanup commands inside `Invoke-Command -ComputerName FS1.contoso.com`. You link a daily schedule at 01:00 to the runbook and leave **Run on** set to **Azure**.
    fr: |
      Vous modifiez Clear-Staging pour qu'il exécute ses commandes de nettoyage dans `Invoke-Command -ComputerName FS1.contoso.com`. Vous liez une planification quotidienne à 01:00 au runbook et laissez **Run on** sur **Azure**.
answer: { value: false }
explanation:
  correct:
    en: |
      A runbook that runs on Azure runs in an Azure sandbox on the Azure cloud platform, which has no access to resources in the on-premises environment. The sandbox cannot resolve or reach FS1, and the firewall blocks inbound connections anyway, so the remote session fails. Local resources are managed from a Hybrid Runbook Worker.
    fr: |
      Un runbook qui s'exécute sur Azure s'exécute dans un bac à sable Azure, sur la plateforme cloud Azure, qui n'a pas accès aux ressources de l'environnement local. Le bac à sable ne peut ni résoudre ni joindre FS1, et le pare-feu bloque de toute façon les connexions entrantes : la session distante échoue. Les ressources locales se gèrent depuis un Runbook Worker hybride.
references:
  - title: Azure Automation Hybrid Runbook Worker Overview
    url: https://learn.microsoft.com/en-us/azure/automation/automation-hybrid-runbook-worker
