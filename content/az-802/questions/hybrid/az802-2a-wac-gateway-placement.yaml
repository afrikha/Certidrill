id: az802-2a-wac-gateway-placement
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has an AD DS domain named **contoso.com** that contains the computers shown in the following table.

    | Name | Operating system | Role |
    | --- | --- | --- |
    | DC1 | Windows Server 2022 | Domain controller |
    | MGMT1 | Windows Server 2025 | Member server, no server roles |
    | PC1 | Windows 11 | Workstation of an administrator named Admin1 |

    Five administrators must manage all the servers of the domain with Windows Admin Center from the browsers on their own computers by using a single shared URL. The solution must use a supported configuration and minimize the number of Windows Admin Center installations.

    Where should you install Windows Admin Center?
  fr: |
    Contoso, Ltd. dispose d'un domaine AD DS nommé **contoso.com** qui contient les ordinateurs présentés dans le tableau suivant.

    | Nom | Système d'exploitation | Rôle |
    | --- | --- | --- |
    | DC1 | Windows Server 2022 | Contrôleur de domaine |
    | MGMT1 | Windows Server 2025 | Serveur membre, aucun rôle serveur |
    | PC1 | Windows 11 | Station de travail d'un administrateur nommé Admin1 |

    Cinq administrateurs doivent gérer tous les serveurs du domaine avec Windows Admin Center depuis le navigateur de leur propre ordinateur, à l'aide d'une seule URL partagée. La solution doit utiliser une configuration prise en charge et réduire au minimum le nombre d'installations de Windows Admin Center.

    Où devez-vous installer Windows Admin Center ?
body:
  options:
    - { id: a, text: { en: "On DC1, as a gateway server", fr: "Sur DC1, en tant que serveur de passerelle" } }
    - { id: b, text: { en: "On PC1, as a local client", fr: "Sur PC1, en tant que client local" } }
    - { id: c, text: { en: "On MGMT1, as a gateway server", fr: "Sur MGMT1, en tant que serveur de passerelle" } }
    - { id: d, text: { en: "On each server, as a managed server", fr: "Sur chaque serveur, en tant que serveur géré" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A gateway server installation on Windows Server 2016 or later gives several administrators shared access from any browser that reaches the gateway URL, and one installation manages all the servers. MGMT1 is a member server running Windows Server 2025, a supported platform for the gateway server topology.
    fr: |
      Une installation en serveur de passerelle sur Windows Server 2016 ou ultérieur donne à plusieurs administrateurs un accès partagé depuis tout navigateur qui atteint l'URL de la passerelle, et une seule installation gère tous les serveurs. MGMT1 est un serveur membre qui exécute Windows Server 2025, une plateforme prise en charge pour la topologie de serveur de passerelle.
  options:
    a:
      en: Installing Windows Admin Center on a domain controller isn't supported.
      fr: L'installation de Windows Admin Center sur un contrôleur de domaine n'est pas prise en charge.
    b:
      en: A local client installation on Windows 11 is opened at https://localhost:6516 by one administrator; it's meant for quick setups and small-scale management, not for shared access.
      fr: Une installation en client local sur Windows 11 s'ouvre sur https://localhost:6516 par un seul administrateur ; elle est prévue pour une mise en route rapide et une gestion à petite échelle, pas pour un accès partagé.
    d:
      en: Installing on every server multiplies the installations and gives no single shared URL; Microsoft also doesn't recommend using Windows Admin Center to manage the server it's installed on.
      fr: Une installation sur chaque serveur multiplie les installations et ne donne pas d'URL partagée unique ; Microsoft déconseille en outre d'utiliser Windows Admin Center pour gérer le serveur sur lequel il est installé.
references:
  - title: "Windows Admin Center: Choose an Installation"
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/plan/installation-options
