id: az802-2a-wac-entra-mfa
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a Windows Admin Center gateway on a server named **GW1**. Gateway access is currently controlled by Active Directory groups. Contoso has a Microsoft Entra tenant.

    A new security policy requires that access to the gateway is subject to the Conditional Access policies and multifactor authentication (MFA) of the Microsoft Entra tenant.

    What should you configure?
  fr: |
    Contoso, Ltd. dispose d'une passerelle Windows Admin Center sur un serveur nommé **GW1**. L'accès à la passerelle est actuellement contrôlé par des groupes Active Directory. Contoso dispose d'un locataire Microsoft Entra.

    Une nouvelle stratégie de sécurité exige que l'accès à la passerelle soit soumis aux stratégies d'accès conditionnel et à l'authentification multifacteur (MFA) du locataire Microsoft Entra.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Add a smart card security group as a required group on the Users tab of the gateway", fr: "Ajouter un groupe de sécurité de carte à puce comme groupe requis dans l'onglet Users de la passerelle" } }
    - { id: b, text: { en: "Apply Windows Admin Center role-based access control to each managed server", fr: "Appliquer le contrôle d'accès en fonction du rôle de Windows Admin Center à chaque serveur géré" } }
    - { id: c, text: { en: "Add a RequiredGroups condition to a JEA session configuration on GW1", fr: "Ajouter une condition RequiredGroups à une configuration de session JEA sur GW1" } }
    - { id: d, text: { en: "Change the gateway access control to Microsoft Entra ID in the Access settings", fr: "Remplacer le contrôle d'accès de la passerelle par Microsoft Entra ID dans les paramètres Access" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Gateway administrators can choose Microsoft Entra ID as the identity provider for gateway access. The gateway is registered with Azure, users then authenticate with Microsoft Entra ID, and the tenant's Conditional Access and MFA apply; user and administrator access is then managed from the Microsoft Entra application in the Azure portal.
    fr: |
      Les administrateurs de la passerelle peuvent choisir Microsoft Entra ID comme fournisseur d'identité pour l'accès à la passerelle. La passerelle est inscrite auprès d'Azure, les utilisateurs s'authentifient alors avec Microsoft Entra ID, et l'accès conditionnel et la MFA du locataire s'appliquent ; l'accès des utilisateurs et des administrateurs se gère ensuite depuis l'application Microsoft Entra dans le portail Azure.
  options:
    a:
      en: Smart card groups enforce smart card sign-in with Active Directory groups, but they don't apply Microsoft Entra Conditional Access policies.
      fr: Les groupes de carte à puce imposent la connexion par carte à puce avec des groupes Active Directory, mais n'appliquent pas les stratégies d'accès conditionnel Microsoft Entra.
    b:
      en: Role-based access control limits what users can do on each managed server; it doesn't change how users authenticate to the gateway.
      fr: Le contrôle d'accès en fonction du rôle limite ce que les utilisateurs peuvent faire sur chaque serveur géré ; il ne change pas la façon dont ils s'authentifient auprès de la passerelle.
    c:
      en: RequiredGroups adds group conditions to a PowerShell JEA endpoint; it doesn't control sign-in to the Windows Admin Center gateway.
      fr: RequiredGroups ajoute des conditions d'appartenance à un point de terminaison JEA PowerShell ; il ne contrôle pas la connexion à la passerelle Windows Admin Center.
references:
  - title: Configuring user access control and permissions
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/configure/user-access-control
