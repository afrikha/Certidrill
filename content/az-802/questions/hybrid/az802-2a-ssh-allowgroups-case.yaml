id: az802-2a-ssh-allowgroups-case
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has an AD DS domain named **contoso.com** (NetBIOS name **CONTOSO**) and a member server named **SRV4** that runs Windows Server 2022. OpenSSH Server is installed on SRV4, and the sshd service is running.

    You need to ensure that only the members of a domain group named **SSH-Admins** can connect to SRV4 by using SSH.

    What should you do?
  fr: |
    Contoso, Ltd. dispose d'un domaine AD DS nommé **contoso.com** (nom NetBIOS **CONTOSO**) et d'un serveur membre nommé **SRV4** qui exécute Windows Server 2022. OpenSSH Server est installé sur SRV4, et le service sshd est en cours d'exécution.

    Vous devez faire en sorte que seuls les membres d'un groupe de domaine nommé **SSH-Admins** puissent se connecter à SRV4 à l'aide de SSH.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |-
          Add `AllowGroups CONTOSO\SSH-Admins` to sshd_config, and then restart the sshd service.
        fr: |-
          Ajouter `AllowGroups CONTOSO\SSH-Admins` à sshd_config, puis redémarrer le service sshd.
    - id: b
      text:
        en: |-
          Add `AllowGroups ssh-admins@contoso.com` to sshd_config, and then restart the sshd service.
        fr: |-
          Ajouter `AllowGroups ssh-admins@contoso.com` à sshd_config, puis redémarrer le service sshd.
    - id: c
      text:
        en: |-
          Add `AllowGroups contoso\ssh-admins` to sshd_config, and let the next connection apply it without a restart.
        fr: |-
          Ajouter `AllowGroups contoso\ssh-admins` à sshd_config, et laisser la prochaine connexion l'appliquer sans redémarrage.
    - id: d
      text:
        en: |-
          Add `AllowGroups contoso\ssh-admins` to sshd_config, and then restart the sshd service.
        fr: |-
          Ajouter `AllowGroups contoso\ssh-admins` à sshd_config, puis redémarrer le service sshd.
answer: { optionId: d }
explanation:
  correct:
    en: |
      In sshd_config on Windows, domain groups are written in the `domain_short_name\group_name` format, and all account names must be in lowercase. sshd reads `%programdata%\ssh\sshd_config` only when the service starts, so any change requires restarting sshd.
    fr: |
      Dans sshd_config sous Windows, les groupes de domaine s'écrivent au format `nom_court_du_domaine\nom_du_groupe`, et tous les noms de compte doivent être en minuscules. sshd ne lit `%programdata%\ssh\sshd_config` qu'au démarrage du service : toute modification demande donc de redémarrer sshd.
  options:
    a:
      en: The format is right, but account and group names in the allow and deny directives must be specified in lowercase.
      fr: Le format est correct, mais les noms de compte et de groupe des directives d'autorisation et de refus doivent être indiqués en minuscules.
    b:
      en: Domain principals resolve to the NameSamCompatible format (domain\name); the @ character conflicts with the user@host syntax and isn't the documented format.
      fr: Les principaux de domaine se résolvent au format NameSamCompatible (domaine\nom) ; le caractère @ entre en conflit avec la syntaxe utilisateur@hôte et n'est pas le format documenté.
    c:
      en: sshd reads its configuration file when the service starts; without a restart, the new directive isn't applied.
      fr: sshd lit son fichier de configuration au démarrage du service ; sans redémarrage, la nouvelle directive n'est pas appliquée.
references:
  - title: OpenSSH Server Configuration for Windows
    url: https://learn.microsoft.com/en-us/windows-server/administration/openssh/openssh-server-configuration
