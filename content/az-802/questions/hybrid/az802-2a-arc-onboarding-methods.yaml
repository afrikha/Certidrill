id: az802-2a-arc-onboarding-methods
objective: "2.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. must onboard the following servers to Azure Arc:

    - **SRV30**: a single server that runs Windows Server 2025 with the Desktop Experience. A local administrator wants to connect it from a wizard on the server itself, without running a script.
    - **Branch servers**: 300 servers that run Windows Server 2019, are joined to AD DS, and are in one OU. No one can sign in to Azure interactively on these servers.
    - **Lab servers**: two servers that run Windows Server 2016 in a workgroup. An administrator will sign in to Azure interactively during onboarding.

    Which onboarding method should you use for each set of servers? To answer, drag the appropriate methods to the correct servers. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. doit intégrer les serveurs suivants à Azure Arc :

    - **SRV30** : un serveur unique qui exécute Windows Server 2025 avec l'Expérience de bureau. Un administrateur local veut le connecter depuis un Assistant sur le serveur lui-même, sans exécuter de script ;
    - **Serveurs des agences** : 300 serveurs qui exécutent Windows Server 2019, sont joints à AD DS et se trouvent dans une même UO. Personne ne peut se connecter à Azure de manière interactive sur ces serveurs ;
    - **Serveurs de laboratoire** : deux serveurs qui exécutent Windows Server 2016 dans un groupe de travail. Un administrateur se connectera à Azure de manière interactive pendant l'intégration.

    Quelle méthode d'intégration devez-vous utiliser pour chaque ensemble de serveurs ? Pour répondre, faites glisser les méthodes appropriées vers les serveurs correspondants. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: setup, text: { en: "Azure Arc Setup", fr: "Azure Arc Setup" } }
    - { id: script, text: { en: "Deployment script generated in the Azure portal, with interactive sign-in", fr: "Script de déploiement généré dans le portail Azure, avec connexion interactive" } }
    - { id: gpo, text: { en: "Group Policy with DeployGPO.ps1 and a service principal", fr: "Stratégie de groupe avec DeployGPO.ps1 et un principal de service" } }
    - { id: migrate, text: { en: "Azure Migrate", fr: "Azure Migrate" } }
  targets:
    - { id: srv30, text: { en: "SRV30", fr: "SRV30" } }
    - { id: branch, text: { en: "Branch servers", fr: "Serveurs des agences" } }
    - { id: lab, text: { en: "Lab servers", fr: "Serveurs de laboratoire" } }
answer:
  mapping: { srv30: setup, branch: gpo, lab: script }
explanation:
  correct:
    en: |
      Azure Arc Setup is a wizard built into Windows Server 2022 and later, launched from the system tray icon, Server Manager or the Start menu, and it installs and connects the agent with an interactive sign-in. Group Policy onboards AD-joined Windows machines at scale with a service principal, without interactive sign-in. For a few servers that don't have Azure Arc Setup and aren't domain-joined, the portal-generated script with interactive sign-in fits.
    fr: |
      Azure Arc Setup est un Assistant intégré à Windows Server 2022 et versions ultérieures, lancé depuis l'icône de la zone de notification, le Gestionnaire de serveur ou le menu Démarrer, qui installe et connecte l'agent avec une connexion interactive. La stratégie de groupe intègre à grande échelle des machines Windows jointes à AD avec un principal de service, sans connexion interactive. Pour quelques serveurs qui ne disposent pas d'Azure Arc Setup et ne sont pas joints à un domaine, le script généré dans le portail avec connexion interactive convient.
  options:
    migrate:
      en: Azure Migrate assesses and migrates servers to Azure; it isn't an Azure Arc onboarding method.
      fr: Azure Migrate évalue et migre des serveurs vers Azure ; ce n'est pas une méthode d'intégration à Azure Arc.
references:
  - title: Azure Connected Machine Agent Deployment Options
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/deployment-options
  - title: Connect Windows Server machines to Azure through Azure Arc Setup
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/onboard-windows-server
