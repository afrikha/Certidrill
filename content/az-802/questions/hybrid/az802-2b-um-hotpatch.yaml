id: az802-2b-um-hotpatch
objective: "2.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank plans to use Hotpatch to install security updates without restarts on its Windows Server machines. The company has on-premises Hyper-V hosts and an Azure subscription. Azure Update Manager is used to schedule updates.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit d'utiliser Hotpatch pour installer les mises à jour de sécurité sans redémarrage sur ses machines Windows Server. L'entreprise dispose d'hôtes Hyper-V locaux et d'un abonnement Azure. Le Gestionnaire de mise à jour Azure sert à planifier les mises à jour.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An on-premises virtual machine that runs Windows Server 2025 Standard must be a Generation 2 virtual machine to use Hotpatch through Azure Arc.
        fr: Une machine virtuelle locale qui exécute Windows Server 2025 Standard doit être une machine virtuelle de génération 2 pour utiliser Hotpatch par l'intermédiaire d'Azure Arc.
    - id: s2
      text:
        en: After Hotpatch is enabled on an Arc-enabled server, hotpatches can be installed on it only by using Azure Update Manager.
        fr: Une fois Hotpatch activé sur un serveur activé pour Azure Arc, les correctifs à chaud ne peuvent y être installés qu'avec le Gestionnaire de mise à jour Azure.
    - id: s3
      text:
        en: An Azure VM that runs Windows Server 2025 Datacenter Azure Edition must be connected to Azure Arc before it can receive hotpatches.
        fr: Une machine virtuelle Azure qui exécute Windows Server 2025 Datacenter Azure Edition doit être connectée à Azure Arc avant de pouvoir recevoir des correctifs à chaud.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Hotpatch requires virtualization-based security, so the machine must use UEFI with Secure Boot, which on Hyper-V means a Generation 2 virtual machine. Update Manager is an optional way to automate hotpatch installation; other update management tools can install them too. Windows Server 2025 Datacenter Azure Edition doesn't need to be Arc-enabled, because Hotpatch is already enabled by default on that edition.
    fr: |
      Hotpatch exige la sécurité basée sur la virtualisation : la machine doit donc utiliser UEFI avec le démarrage sécurisé, ce qui, sur Hyper-V, signifie une machine virtuelle de génération 2. Le Gestionnaire de mise à jour est un moyen facultatif d'automatiser l'installation des correctifs à chaud ; d'autres outils de gestion des mises à jour peuvent aussi les installer. Windows Server 2025 Datacenter Azure Edition n'a pas besoin d'être activé pour Azure Arc, car Hotpatch est déjà activé par défaut sur cette édition.
references:
  - title: Enable Hotpatch for Azure Arc-enabled servers
    url: https://learn.microsoft.com/en-us/windows-server/get-started/enable-hotpatch-azure-arc-enabled-servers
