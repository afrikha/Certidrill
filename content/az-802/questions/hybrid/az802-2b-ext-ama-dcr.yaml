id: az802-2b-ext-ama-dcr
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has 50 on-premises servers that run Windows Server 2022 and are onboarded to Azure Arc. No VM extensions are installed. The company has a Log Analytics workspace named **LAW1**.

    You need to collect the Security event log of the servers in LAW1.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose de 50 serveurs locaux qui exécutent Windows Server 2022 et sont intégrés à Azure Arc. Aucune extension de machine virtuelle n'est installée. L'entreprise dispose d'un espace de travail Log Analytics nommé **LAW1**.

    Vous devez collecter le journal des événements Sécurité des serveurs dans LAW1.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install the Log Analytics agent on the servers and connect it to LAW1.", fr: "Installer l'agent Log Analytics sur les serveurs et le connecter à LAW1." } }
    - { id: b, text: { en: "Deploy the Azure Monitor Agent extension to the servers.", fr: "Déployer l'extension Azure Monitor Agent sur les serveurs." } }
    - { id: c, text: { en: "Create a diagnostic setting on each Arc-enabled server resource that sends logs to LAW1.", fr: "Créer un paramètre de diagnostic sur chaque ressource de serveur activé pour Azure Arc qui envoie les journaux vers LAW1." } }
    - { id: d, text: { en: "Create a data collection rule that collects Security events into LAW1 and associate it with the servers.", fr: "Créer une règle de collecte de données qui collecte les événements Sécurité dans LAW1 et l'associer aux serveurs." } }
    - { id: e, text: { en: "Deploy the Dependency agent extension to the servers.", fr: "Déployer l'extension de l'agent Dependency sur les serveurs." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      The Azure Monitor Agent is deployed to Arc-enabled servers as a VM extension (Microsoft.Azure.Monitor/AzureMonitorWindowsAgent). The agent collects data according to the data collection rules associated with the machine, which define what is collected, such as Windows Security events, and where it's sent.
    fr: |
      L'agent Azure Monitor est déployé sur les serveurs activés pour Azure Arc en tant qu'extension de machine virtuelle (Microsoft.Azure.Monitor/AzureMonitorWindowsAgent). L'agent collecte les données selon les règles de collecte de données associées à la machine, qui définissent ce qui est collecté, par exemple les événements Sécurité de Windows, et la destination.
  options:
    a: { en: "The Log Analytics agent (MMA) is retired; the Azure Monitor Agent replaces it.", fr: "L'agent Log Analytics (MMA) est mis hors service ; l'agent Azure Monitor le remplace." }
    c: { en: "Diagnostic settings export resource logs and metrics of Azure resources; they don't read the event logs inside the operating system.", fr: "Les paramètres de diagnostic exportent les journaux de ressources et les métriques des ressources Azure ; ils ne lisent pas les journaux d'événements du système d'exploitation." }
    e: { en: "The Dependency agent maps processes and connections for VM insights; it doesn't collect event logs.", fr: "L'agent Dependency cartographie les processus et les connexions pour VM insights ; il ne collecte pas les journaux d'événements." }
references:
  - title: Azure Monitor Agent Overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-overview
  - title: VM Extension Management with Azure Arc-Enabled Servers
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/manage-vm-extensions
