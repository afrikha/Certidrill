id: az802-2b-mc-remediate-existing
objective: "2.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has 30 on-premises servers that run Windows Server 2022. The servers were onboarded to Azure Arc in a resource group named **RG-Servers** three months ago.

    You publish a custom machine configuration package to a blob container in a storage account named **stwgconfig**. Anonymous blob access is disabled on stwgconfig and must stay disabled. You generate a policy definition by running `New-GuestConfigurationPolicy` with the `-UseSystemAssignedIdentity` switch and the mode `ApplyAndAutoCorrect`, and you assign it to RG-Servers. No other action is taken.

    One week later, none of the 30 servers has applied the configuration.

    You need to ensure that the configuration is applied to the 30 servers. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose de 30 serveurs locaux qui exécutent Windows Server 2022. Les serveurs ont été intégrés à Azure Arc dans un groupe de ressources nommé **RG-Servers** il y a trois mois.

    Vous publiez un package de configuration de machine personnalisé dans un conteneur d'objets blob d'un compte de stockage nommé **stwgconfig**. L'accès anonyme aux objets blob est désactivé sur stwgconfig et doit le rester. Vous générez une définition de stratégie en exécutant `New-GuestConfigurationPolicy` avec le commutateur `-UseSystemAssignedIdentity` et le mode `ApplyAndAutoCorrect`, puis vous l'attribuez à RG-Servers. Aucune autre action n'est effectuée.

    Une semaine plus tard, aucun des 30 serveurs n'a appliqué la configuration.

    Vous devez faire en sorte que la configuration soit appliquée aux 30 serveurs. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign the Storage Blob Data Reader role on stwgconfig to the system-assigned managed identity of each server.", fr: "Attribuer le rôle Storage Blob Data Reader sur stwgconfig à l'identité managée affectée par le système de chaque serveur." } }
    - { id: b, text: { en: "Install the machine configuration extension on each server by using an Azure Policy initiative.", fr: "Installer l'extension de configuration de machine sur chaque serveur à l'aide d'une initiative Azure Policy." } }
    - { id: c, text: { en: "Create a remediation task for the policy assignment that targets the non-compliant servers.", fr: "Créer une tâche de correction pour l'attribution de stratégie qui cible les serveurs non conformes." } }
    - { id: d, text: { en: "Add the tag CustomGuestConfigurationSetPolicy with the value disable to each server.", fr: "Ajouter l'étiquette CustomGuestConfigurationSetPolicy avec la valeur disable à chaque serveur." } }
    - { id: e, text: { en: "Assign the Storage Account Contributor role on stwgconfig to the managed identity of the policy assignment.", fr: "Attribuer le rôle Storage Account Contributor sur stwgconfig à l'identité managée de l'attribution de stratégie." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      Machine configuration uses the DeployIfNotExists effect, which only acts automatically on resources created or updated after the assignment; servers that already existed need a remediation task. Because the package is downloaded with the machines' system-assigned managed identity and anonymous access is disabled, each server's identity also needs the Storage Blob Data Reader role on the storage account.
    fr: |
      La configuration de machine utilise l'effet DeployIfNotExists, qui n'agit automatiquement que sur les ressources créées ou mises à jour après l'attribution ; les serveurs qui existaient déjà ont besoin d'une tâche de correction. Comme le package est téléchargé avec l'identité managée affectée par le système des machines et que l'accès anonyme est désactivé, l'identité de chaque serveur a aussi besoin du rôle Storage Blob Data Reader sur le compte de stockage.
  options:
    b: { en: "The extension is required only for Azure VMs; Arc-enabled servers include machine configuration in the Connected Machine agent.", fr: "L'extension n'est obligatoire que pour les machines virtuelles Azure ; les serveurs activés pour Azure Arc incluent la configuration de machine dans l'agent Connected Machine." }
    d: { en: "This tag disables remediation of custom packages on the machine, the opposite of the goal.", fr: "Cette étiquette désactive la correction des packages personnalisés sur la machine, soit l'inverse de l'objectif." }
    e: { en: "The package is downloaded by each machine's identity, not by the assignment's identity, and Storage Account Contributor manages the account rather than reading blob data.", fr: "Le package est téléchargé par l'identité de chaque machine, pas par celle de l'attribution, et Storage Account Contributor gère le compte au lieu de lire les données des objets blob." }
references:
  - title: Remediation options for machine configuration
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/concepts/remediation-options
  - title: How to create custom machine configuration policy definitions
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/how-to/create-policy-definition
