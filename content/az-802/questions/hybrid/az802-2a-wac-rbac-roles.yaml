id: az802-2a-wac-rbac-roles
objective: "2.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. manages a Hyper-V host named **HV1** that runs Windows Server 2025 by using a Windows Admin Center gateway. Role-based access control was applied to HV1 from the **Role-based access control** page, and its status is **Applied**. None of the team members is a local administrator of HV1.

    Each team must receive only the access it needs through Windows Admin Center:

    - **Support**: view the settings and events of HV1 without changing anything.
    - **Virtualization**: create and change virtual machines and virtual switches on HV1; the other tools must stay read-only.
    - **Operations**: use most of the Windows Admin Center tools on HV1, but without access to PowerShell or Remote Desktop.

    To which local group of HV1 should you add each team? To answer, drag the appropriate groups to the correct teams. Each group may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. gère un hôte Hyper-V nommé **HV1** qui exécute Windows Server 2025 à l'aide d'une passerelle Windows Admin Center. Le contrôle d'accès en fonction du rôle a été appliqué à HV1 depuis la page **Role-based access control**, et son état est **Applied**. Aucun membre des équipes n'est administrateur local de HV1.

    Chaque équipe ne doit recevoir que l'accès dont elle a besoin par l'intermédiaire de Windows Admin Center :

    - **Support** : consulter les paramètres et les événements de HV1 sans rien modifier ;
    - **Virtualisation** : créer et modifier des machines virtuelles et des commutateurs virtuels sur HV1, les autres outils devant rester en lecture seule ;
    - **Exploitation** : utiliser la plupart des outils de Windows Admin Center sur HV1, mais sans accès à PowerShell ni au Bureau à distance.

    À quel groupe local de HV1 devez-vous ajouter chaque équipe ? Pour répondre, faites glisser les groupes appropriés vers les équipes correspondantes. Chaque groupe peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: wadm, text: Windows Admin Center Administrators }
    - { id: wread, text: Windows Admin Center Readers }
    - { id: whv, text: Windows Admin Center Hyper-V Administrators }
    - { id: ladm, text: Administrators }
    - { id: rdu, text: Remote Desktop Users }
  targets:
    - { id: support, text: { en: "Support", fr: "Support" } }
    - { id: virt, text: { en: "Virtualization", fr: "Virtualisation" } }
    - { id: ops, text: { en: "Operations", fr: "Exploitation" } }
answer:
  mapping: { support: wread, virt: whv, ops: wadm }
explanation:
  correct:
    en: |
      Applying role-based access control creates a JEA endpoint and three local groups. Windows Admin Center Readers can view information and settings without making changes. Windows Admin Center Hyper-V Administrators can change virtual machines and switches, with the other features read-only. Windows Admin Center Administrators can use most features but get no PowerShell or Remote Desktop access, which suits jump-server scenarios.
    fr: |
      L'application du contrôle d'accès en fonction du rôle crée un point de terminaison JEA et trois groupes locaux. Windows Admin Center Readers permet de consulter les informations et les paramètres sans rien modifier. Windows Admin Center Hyper-V Administrators permet de modifier les machines virtuelles et les commutateurs, les autres fonctionnalités restant en lecture seule. Windows Admin Center Administrators permet d'utiliser la plupart des fonctionnalités, sans accès à PowerShell ni au Bureau à distance, ce qui convient aux scénarios de serveur de rebond.
  options:
    ladm:
      en: Local administrators get the full Windows Admin Center experience with no restriction, including PowerShell and Remote Desktop.
      fr: Les administrateurs locaux obtiennent l'expérience Windows Admin Center complète sans restriction, y compris PowerShell et le Bureau à distance.
    rdu:
      en: Remote Desktop Users grants Remote Desktop sign-in, not a Windows Admin Center role.
      fr: Remote Desktop Users accorde la connexion Bureau à distance, pas un rôle Windows Admin Center.
references:
  - title: User access options with Windows Admin Center
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/plan/user-access-options
  - title: Configuring user access control and permissions
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/configure/user-access-control
