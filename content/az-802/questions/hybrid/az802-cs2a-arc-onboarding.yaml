id: az802-cs2a-arc-onboarding
objective: "2.2.1"
type: single
caseStudy: az802-cs2a-coho-winery
difficulty: 1
status: draft
stem:
  en: |
    Coho Winery has an Azure subscription that contains a resource group named **RG-Arc**. The required resource providers are registered. You plan to connect the servers to Azure Arc by running a script that calls `azcmagent connect`.

    You need to provide an identity for the script that meets the hybrid management requirement. What should you use?
  fr: |
    Coho Winery dispose d'un abonnement Azure qui contient un groupe de ressources nommé **RG-Arc**. Les fournisseurs de ressources nécessaires sont inscrits. Vous prévoyez de connecter les serveurs à Azure Arc en exécutant un script qui appelle `azcmagent connect`.

    Vous devez fournir au script une identité qui satisfait l'exigence de gestion hybride. Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A service principal that has the Contributor role on the subscription", fr: "Un principal de service qui a le rôle Contributor sur l'abonnement" } }
    - { id: b, text: { en: "A user-assigned managed identity that has the Contributor role on RG-Arc", fr: "Une identité managée affectée par l'utilisateur qui a le rôle Contributor sur RG-Arc" } }
    - { id: c, text: { en: "A service principal that has the Azure Connected Machine Resource Administrator role on RG-Arc", fr: "Un principal de service qui a le rôle Azure Connected Machine Resource Administrator sur RG-Arc" } }
    - { id: d, text: { en: "A service principal that has the Azure Connected Machine Onboarding role on RG-Arc", fr: "Un principal de service qui a le rôle Azure Connected Machine Onboarding sur RG-Arc" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      To onboard servers at scale, you create a service principal and pass its ID and secret to `azcmagent connect`. The Azure Connected Machine Onboarding role contains only the permissions needed to connect machines, and scoping it to RG-Arc limits it to the resource group that receives the servers.
    fr: |
      Pour intégrer des serveurs à grande échelle, vous créez un principal de service et vous passez son ID et son secret à `azcmagent connect`. Le rôle Azure Connected Machine Onboarding contient uniquement les autorisations nécessaires pour connecter des machines, et son étendue limitée à RG-Arc le restreint au groupe de ressources qui reçoit les serveurs.
  options:
    a:
      en: |
        Contributor on the subscription works, but it grants far more permissions than onboarding needs, on a wider scope.
      fr: |
        Contributor sur l'abonnement fonctionne, mais il accorde bien plus d'autorisations que l'intégration n'en demande, sur une étendue plus large.
    b:
      en: |
        An on-premises server cannot use an Azure managed identity before it is connected to Azure Arc; Contributor is also broader than needed.
      fr: |
        Un serveur local ne peut pas utiliser d'identité managée Azure avant d'être connecté à Azure Arc ; Contributor est en outre plus large que nécessaire.
    c:
      en: |
        Azure Connected Machine Resource Administrator manages existing Arc-enabled server resources and grants more than the onboarding permissions.
      fr: |
        Azure Connected Machine Resource Administrator gère les ressources de serveurs activés pour Azure Arc existantes et accorde plus que les autorisations d'intégration.
references:
  - title: Connect hybrid machines to Azure at scale
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/onboard-service-principal
