id: az802-2a-rdp-users-group
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a member server named **SRV10** that runs Windows Server 2025. Remote Desktop is enabled on SRV10 and requires Network Level Authentication.

    The members of a domain group named **G-Ops** must be able to sign in to SRV10 by using Remote Desktop Connection. The solution must follow the principle of least privilege.

    To which local group of SRV10 should you add G-Ops?
  fr: |
    Contoso, Ltd. dispose d'un serveur membre nommé **SRV10** qui exécute Windows Server 2025. Le Bureau à distance est activé sur SRV10 et exige l'authentification au niveau du réseau.

    Les membres d'un groupe de domaine nommé **G-Ops** doivent pouvoir se connecter à SRV10 à l'aide de Connexion Bureau à distance. La solution doit respecter le principe du privilège minimum.

    À quel groupe local de SRV10 devez-vous ajouter G-Ops ?
body:
  options:
    - { id: a, text: Remote Management Users }
    - { id: b, text: Distributed COM Users }
    - { id: c, text: Administrators }
    - { id: d, text: Remote Desktop Users }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Members of the Administrators group and of the Remote Desktop Users group can connect by using Remote Desktop. Remote Desktop Users grants the sign-in without administrative rights, which meets the least privilege requirement.
    fr: |
      Les membres du groupe Administrators et du groupe Remote Desktop Users peuvent se connecter avec le Bureau à distance. Remote Desktop Users accorde la connexion sans droits d'administration, ce qui respecte l'exigence de privilège minimum.
  options:
    a:
      en: Remote Management Users allows access through WinRM (PowerShell remoting), not Remote Desktop sign-in.
      fr: Remote Management Users autorise l'accès via WinRM (communication à distance PowerShell), pas la connexion Bureau à distance.
    b:
      en: Distributed COM Users allows launching and activating DCOM objects; it doesn't grant Remote Desktop sign-in.
      fr: Distributed COM Users permet de lancer et d'activer des objets DCOM ; il n'accorde pas la connexion Bureau à distance.
    c:
      en: Administrators can connect, but the group grants full control of the server, which exceeds the requirement.
      fr: Administrators peut se connecter, mais ce groupe accorde le contrôle total du serveur, ce qui dépasse l'exigence.
references:
  - title: Enable Remote Desktop on your PC
    url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access
  - title: Remote Credential Guard
