id: az802-2b-ext-requirements
objective: "2.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has on-premises servers that run Windows Server 2025 and are onboarded to Azure Arc. You plan to deploy VM extensions to the servers to meet the following requirements.

    Which extension should you deploy for each requirement? To answer, drag the appropriate extensions to the correct requirements. Each extension may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose de serveurs locaux qui exécutent Windows Server 2025 et qui sont intégrés à Azure Arc. Vous prévoyez de déployer des extensions de machine virtuelle sur les serveurs pour répondre aux exigences suivantes.

    Quelle extension devez-vous déployer pour chaque exigence ? Pour répondre, faites glisser les extensions appropriées vers les exigences correspondantes. Chaque extension peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ama, text: AzureMonitorWindowsAgent }
    - { id: dep, text: DependencyAgentWindows }
    - { id: cse, text: CustomScriptExtension }
    - { id: hrw, text: HybridWorkerForWindows }
    - { id: mde, text: MDE.Windows }
    - { id: wac, text: AdminCenter }
  targets:
    - id: logs
      text: { en: "Send Windows event logs to a Log Analytics workspace as defined by a data collection rule", fr: "Envoyer les journaux d'événements Windows vers un espace de travail Log Analytics selon une règle de collecte de données" }
    - id: map
      text: { en: "Show the processes and the network connections between servers on the VM insights Map", fr: "Afficher les processus et les connexions réseau entre serveurs dans la carte (Map) de VM insights" }
    - id: runbook
      text: { en: "Run Azure Automation runbooks that access file shares on the local network", fr: "Exécuter des runbooks Azure Automation qui accèdent à des partages de fichiers du réseau local" }
    - id: portal
      text: { en: "Manage roles, services and files of the server from the Azure portal", fr: "Gérer les rôles, services et fichiers du serveur depuis le portail Azure" }
answer:
  mapping: { logs: ama, map: dep, runbook: hrw, portal: wac }
explanation:
  correct:
    en: |
      The Azure Monitor Agent collects data according to data collection rules. The Map feature of VM insights also needs the Dependency agent, which runs with the Azure Monitor Agent. The Hybrid Runbook Worker extension (HybridWorkerForWindows) lets runbooks run on the server, inside the local network. The Windows Admin Center extension (Microsoft.AdminCenter/AdminCenter) provides server management tools in the Azure portal.
    fr: |
      L'agent Azure Monitor collecte les données selon des règles de collecte de données. La fonctionnalité Map de VM insights a en plus besoin de l'agent Dependency, qui fonctionne avec l'agent Azure Monitor. L'extension Hybrid Runbook Worker (HybridWorkerForWindows) permet d'exécuter des runbooks sur le serveur, dans le réseau local. L'extension Windows Admin Center (Microsoft.AdminCenter/AdminCenter) fournit les outils de gestion du serveur dans le portail Azure.
  options:
    cse: { en: "The Custom Script Extension runs a one-off script; it meets none of the requirements by itself.", fr: "L'extension de script personnalisé exécute un script ponctuel ; elle ne répond seule à aucune des exigences." }
    mde: { en: "MDE.Windows onboards the server to Microsoft Defender for Endpoint.", fr: "MDE.Windows intègre le serveur à Microsoft Defender for Endpoint." }
references:
  - title: VM Extension Management with Azure Arc-Enabled Servers
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/manage-vm-extensions
