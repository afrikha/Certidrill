id: az802-2b-rb-webhook-python
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure Automation account named **AA1** that contains a published Python 3.10 runbook named **Reset-Queue**. A third-party monitoring system can only call an HTTPS URL when an alert fires; it can't authenticate to Microsoft Entra ID.

    You need the monitoring system to start the logic of Reset-Queue and pass it the name of the affected queue. What should you do?
  fr: |
    Northwind Traders dispose d'un compte Azure Automation nommé **AA1** qui contient un runbook Python 3.10 publié nommé **Reset-Queue**. Un système de surveillance tiers peut uniquement appeler une URL HTTPS lorsqu'une alerte se déclenche ; il ne peut pas s'authentifier auprès de Microsoft Entra ID.

    Le système de surveillance doit démarrer la logique de Reset-Queue et lui transmettre le nom de la file d'attente concernée. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a webhook for Reset-Queue and read the queue name from the WebhookData parameter.", fr: "Créer un webhook pour Reset-Queue et lire le nom de la file d'attente dans le paramètre WebhookData." } }
    - { id: b, text: { en: "Rewrite the logic as a PowerShell runbook, publish it and create a webhook for it.", fr: "Réécrire la logique sous forme de runbook PowerShell, le publier et créer un webhook pour celui-ci." } }
    - { id: c, text: { en: "Link Reset-Queue to a schedule and make the monitoring system update the schedule.", fr: "Lier Reset-Queue à une planification et faire modifier la planification par le système de surveillance." } }
    - { id: d, text: { en: "Have the monitoring system run Start-AzAutomationRunbook against AA1.", fr: "Faire exécuter Start-AzAutomationRunbook sur AA1 par le système de surveillance." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A webhook lets a client start a published runbook with a single HTTPS POST, the token in the URL acting as its authentication, and the runbook receives the request body through the WebhookData parameter. Starting a Python runbook with a webhook isn't supported, so the logic must be moved to a PowerShell runbook.
    fr: |
      Un webhook permet à un client de démarrer un runbook publié avec une seule requête HTTPS POST, le jeton présent dans l'URL servant d'authentification, et le runbook reçoit le corps de la requête par le paramètre WebhookData. Le démarrage d'un runbook Python par un webhook n'est pas pris en charge : la logique doit donc être déplacée dans un runbook PowerShell.
  options:
    a: { en: "Webhooks can't start Python runbooks.", fr: "Les webhooks ne peuvent pas démarrer de runbooks Python." }
    c: { en: "Changing a schedule requires authenticated Azure calls and doesn't start a job when an alert fires.", fr: "La modification d'une planification exige des appels Azure authentifiés et ne démarre pas de tâche au déclenchement d'une alerte." }
    d: { en: "Start-AzAutomationRunbook needs an authenticated Azure session, which the monitoring system can't open.", fr: "Start-AzAutomationRunbook nécessite une session Azure authentifiée, que le système de surveillance ne peut pas ouvrir." }
references:
  - title: Start an Azure Automation Runbook from a Webhook
    url: https://learn.microsoft.com/en-us/azure/automation/automation-webhooks
  - title: Azure Automation Runbook Types
    url: https://learn.microsoft.com/en-us/azure/automation/automation-runbook-types
