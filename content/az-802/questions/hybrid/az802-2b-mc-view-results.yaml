id: az802-2b-mc-view-results
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders assigns a built-in machine configuration policy that audits Windows security baseline settings to a resource group that contains Azure Arc-enabled servers. In Azure Policy, an Arc-enabled server named **SRV3** is shown as **Non-compliant**.

    You need to identify which individual settings inside SRV3 don't match the baseline. Which page should you use?
  fr: |
    Northwind Traders attribue une stratégie intégrée de configuration de machine qui audite les paramètres de la base de référence de sécurité Windows à un groupe de ressources contenant des serveurs activés pour Azure Arc. Dans Azure Policy, un serveur activé pour Azure Arc nommé **SRV3** apparaît comme **Non conforme**.

    Vous devez identifier les paramètres individuels de SRV3 qui ne correspondent pas à la base de référence. Quelle page devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Extensions page of SRV3", fr: "La page Extensions de SRV3" } }
    - { id: b, text: { en: "The Activity log page of SRV3", fr: "La page Journal d'activité de SRV3" } }
    - { id: c, text: { en: "The Change Tracking and Inventory page of SRV3", fr: "La page Change Tracking and Inventory de SRV3" } }
    - { id: d, text: { en: "The Guest assignments page of SRV3", fr: "La page Guest assignments de SRV3" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Machine configuration reports per-setting results in the Guest assignments page. From Azure Policy, the Last evaluated resource link on the compliance details page leads to the same guest assignment, which lists each setting and its reason for non-compliance.
    fr: |
      La configuration de machine présente les résultats par paramètre dans la page Guest assignments. Depuis Azure Policy, le lien Last evaluated resource de la page des détails de conformité mène à la même attribution d'invité, qui liste chaque paramètre et la raison de sa non-conformité.
  options:
    a: { en: "Machine configuration on Arc-enabled servers is built into the agent; it isn't listed as an extension with per-setting results.", fr: "Sur les serveurs activés pour Azure Arc, la configuration de machine est intégrée à l'agent ; elle n'apparaît pas comme une extension avec des résultats par paramètre." }
    b: { en: "The activity log records control-plane operations on the resource, not the settings inside the operating system.", fr: "Le journal d'activité enregistre les opérations du plan de contrôle sur la ressource, pas les paramètres du système d'exploitation." }
    c: { en: "Change Tracking and Inventory shows changes to software, files, registry and services; it doesn't compare settings with a baseline.", fr: "Change Tracking and Inventory montre les modifications des logiciels, fichiers, Registre et services ; il ne compare pas les paramètres à une base de référence." }
references:
  - title: What is Azure Machine Configuration?
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
