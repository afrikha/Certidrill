id: az802-2b-mc-azure-vm-prereq
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has an Azure subscription named **Sub1** that contains:

    - ten on-premises servers named **SRV1** to **SRV10** that are onboarded to Azure Arc;
    - five Azure virtual machines named **VM1** to **VM5** that run Windows Server 2022. The VMs have no managed identity and no VM extensions.

    You assign a built-in machine configuration policy definition that audits a Windows setting to Sub1. A day later, SRV1 to SRV10 report their compliance state, but VM1 to VM5 have no guest assignment results.

    You need the VMs to report their compliance state. What should you do?
  fr: |
    Contoso, Ltd. dispose d'un abonnement Azure nommé **Sub1** qui contient :

    - dix serveurs locaux nommés **SRV1** à **SRV10**, intégrés à Azure Arc ;
    - cinq machines virtuelles Azure nommées **VM1** à **VM5** qui exécutent Windows Server 2022. Les machines virtuelles n'ont ni identité managée ni extension de machine virtuelle.

    Vous attribuez à Sub1 une définition de stratégie intégrée de configuration de machine qui audite un paramètre Windows. Un jour plus tard, SRV1 à SRV10 signalent leur état de conformité, mais VM1 à VM5 n'ont aucun résultat d'attribution d'invité.

    Les machines virtuelles doivent signaler leur état de conformité. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Register the Microsoft.GuestConfiguration resource provider in Sub1.", fr: "Inscrire le fournisseur de ressources Microsoft.GuestConfiguration dans Sub1." } }
    - { id: b, text: { en: "Install the Azure Connected Machine agent on VM1 to VM5.", fr: "Installer l'agent Azure Connected Machine sur VM1 à VM5." } }
    - { id: c, text: { en: "Assign the Deploy prerequisites to enable Guest Configuration policies on virtual machines initiative and remediate the VMs.", fr: "Attribuer l'initiative Deploy prerequisites to enable Guest Configuration policies on virtual machines et corriger les machines virtuelles." } }
    - { id: d, text: { en: "Install the Azure Monitor Agent on VM1 to VM5 and associate them with a data collection rule.", fr: "Installer l'agent Azure Monitor sur VM1 à VM5 et les associer à une règle de collecte de données." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure VMs need the machine configuration (guest configuration) extension and a system-assigned managed identity before machine configuration can evaluate settings inside them. The built-in initiative Deploy prerequisites to enable Guest Configuration policies on virtual machines deploys both. Arc-enabled servers don't need the extension because the service is included in the Connected Machine agent, which is why SRV1 to SRV10 already report.
    fr: |
      Les machines virtuelles Azure ont besoin de l'extension de configuration de machine (configuration d'invité) et d'une identité managée affectée par le système avant que la configuration de machine puisse évaluer leurs paramètres. L'initiative intégrée Deploy prerequisites to enable Guest Configuration policies on virtual machines déploie les deux. Les serveurs activés pour Azure Arc n'ont pas besoin de l'extension, car le service est inclus dans l'agent Connected Machine : c'est pourquoi SRV1 à SRV10 signalent déjà leur état.
  options:
    a: { en: "The Arc-enabled servers already report results, so the resource provider is registered.", fr: "Les serveurs activés pour Azure Arc signalent déjà des résultats : le fournisseur de ressources est donc inscrit." }
    b: { en: "The Connected Machine agent isn't supported on Azure VMs, except to simulate on-premises machines in a lab.", fr: "L'agent Connected Machine n'est pas pris en charge sur les machines virtuelles Azure, sauf pour simuler des machines locales dans un laboratoire." }
    d: { en: "The Azure Monitor Agent collects logs and metrics; machine configuration doesn't depend on it.", fr: "L'agent Azure Monitor collecte des journaux et des métriques ; la configuration de machine n'en dépend pas." }
references:
  - title: Azure Machine Configuration prerequisites
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview/02-setup-prerequisites
