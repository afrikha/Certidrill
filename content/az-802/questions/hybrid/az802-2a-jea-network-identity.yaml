id: az802-2a-jea-network-identity
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a server named **SRV1** that runs Windows Server 2025. Help desk operators connect to a JEA endpoint on SRV1 to run a function that copies log files from SRV1 to a shared folder named **\\FS1\Logs**.

    The session configuration file of the endpoint contains `RunAsVirtualAccount = $true`. The function runs, but the copy to \\FS1\Logs fails with an access denied error.

    A group managed service account (gMSA) named **CONTOSO\gmsaJEA** has Modify permissions on \\FS1\Logs, and SRV1 is allowed to use it. A new audit requirement states that the activity of each JEA session must be recorded to a file on SRV1.

    You need to update the session configuration file.

    Which two settings should you include? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un serveur nommé **SRV1** qui exécute Windows Server 2025. Les opérateurs du support se connectent à un point de terminaison JEA sur SRV1 pour exécuter une fonction qui copie des fichiers journaux de SRV1 vers un dossier partagé nommé **\\FS1\Logs**.

    Le fichier de configuration de session du point de terminaison contient `RunAsVirtualAccount = $true`. La fonction s'exécute, mais la copie vers \\FS1\Logs échoue avec une erreur d'accès refusé.

    Un compte de service administré de groupe (gMSA) nommé **CONTOSO\gmsaJEA** dispose de l'autorisation Modification sur \\FS1\Logs, et SRV1 est autorisé à l'utiliser. Une nouvelle exigence d'audit impose que l'activité de chaque session JEA soit enregistrée dans un fichier sur SRV1.

    Vous devez mettre à jour le fichier de configuration de session.

    Quels sont les deux paramètres à inclure ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: |-
        RunAsVirtualAccountGroups = 'Backup Operators'
    - id: b
      text: |-
        MountUserDrive = $true
    - id: c
      text: |-
        GroupManagedServiceAccount = 'CONTOSO\gmsaJEA'
    - id: d
      text: |-
        RequiredGroups = @{ And = 'CONTOSO\G-HelpDesk' }
    - id: e
      text: |-
        TranscriptDirectory = 'C:\ProgramData\JEA\Transcripts'
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      A gMSA is the run-as identity to use when JEA users need domain network resources such as file shares, because a virtual account is a local identity. TranscriptDirectory writes a transcript of each session to the folder, which meets the audit requirement; restrict access to that folder.
    fr: |
      Un gMSA est l'identité run-as à utiliser lorsque les utilisateurs JEA ont besoin de ressources réseau du domaine, comme des partages de fichiers, car un compte virtuel est une identité locale. TranscriptDirectory écrit une transcription de chaque session dans le dossier, ce qui satisfait l'exigence d'audit ; limitez l'accès à ce dossier.
  options:
    a:
      en: RunAsVirtualAccountGroups only reduces the local groups of the virtual account; it gives the session no domain identity for the share.
      fr: RunAsVirtualAccountGroups ne fait que réduire les groupes locaux du compte virtuel ; il ne donne à la session aucune identité de domaine pour le partage.
    b:
      en: MountUserDrive creates a per-user drive for copying files to and from the session; it neither grants access to \\FS1\Logs nor records the session.
      fr: MountUserDrive crée un lecteur par utilisateur pour copier des fichiers vers et depuis la session ; il n'accorde pas l'accès à \\FS1\Logs et n'enregistre pas la session.
    d:
      en: RequiredGroups adds a membership condition to connect to the endpoint; it doesn't change the run-as identity or log the session.
      fr: RequiredGroups ajoute une condition d'appartenance pour se connecter au point de terminaison ; il ne change pas l'identité run-as et n'enregistre pas la session.
references:
  - title: JEA Session Configurations
    url: https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/jea/session-configurations
