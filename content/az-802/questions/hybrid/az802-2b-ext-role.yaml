id: az802-2b-ext-role
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has 25 on-premises servers onboarded to Azure Arc in a resource group named **RG-Hybrid**. A member of the operations team named **Ops1** must deploy, update and remove VM extensions on these servers.

    You need to grant Ops1 the required permissions on RG-Hybrid. The solution must follow the principle of least privilege.

    Which role should you assign to Ops1?
  fr: |
    Adatum Corporation dispose de 25 serveurs locaux intégrés à Azure Arc dans un groupe de ressources nommé **RG-Hybrid**. Un membre de l'équipe d'exploitation nommé **Ops1** doit déployer, mettre à jour et supprimer des extensions de machine virtuelle sur ces serveurs.

    Vous devez accorder à Ops1 les autorisations requises sur RG-Hybrid. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à Ops1 ?
body:
  options:
    - { id: a, text: Azure Connected Machine Onboarding }
    - { id: b, text: Virtual Machine Contributor }
    - { id: c, text: Contributor }
    - { id: d, text: Azure Connected Machine Resource Administrator }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Deploying an extension to an Arc-enabled server needs the `Microsoft.HybridCompute/machines/extensions/write` permission, plus read access to the machine and its extensions. The Azure Connected Machine Resource Administrator role includes these permissions for Arc-enabled server resources, without granting rights on other resource types.
    fr: |
      Le déploiement d'une extension sur un serveur activé pour Azure Arc exige l'autorisation `Microsoft.HybridCompute/machines/extensions/write`, ainsi qu'un accès en lecture à la machine et à ses extensions. Le rôle Azure Connected Machine Resource Administrator comprend ces autorisations pour les ressources des serveurs activés pour Azure Arc, sans accorder de droits sur les autres types de ressources.
  options:
    a: { en: "Azure Connected Machine Onboarding is meant to connect machines to Azure Arc; it doesn't let you manage their extensions.", fr: "Azure Connected Machine Onboarding sert à connecter des machines à Azure Arc ; il ne permet pas de gérer leurs extensions." }
    b: { en: "Virtual Machine Contributor manages Azure VMs (Microsoft.Compute), not Arc-enabled machines (Microsoft.HybridCompute).", fr: "Virtual Machine Contributor gère les machines virtuelles Azure (Microsoft.Compute), pas les machines activées pour Azure Arc (Microsoft.HybridCompute)." }
    c: { en: "Contributor would work but grants rights on every resource type in the resource group.", fr: "Contributor fonctionnerait, mais accorde des droits sur tous les types de ressources du groupe de ressources." }
references:
  - title: VM Extension Management with Azure Arc-Enabled Servers
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/manage-vm-extensions
