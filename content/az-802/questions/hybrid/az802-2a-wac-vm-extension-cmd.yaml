id: az802-2a-wac-vm-extension-cmd
objective: "2.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has an Azure virtual machine named **VM2** that runs Windows Server 2025 in a resource group named **RG1**.

    You need to install Windows Admin Center on VM2 by using Azure PowerShell so that administrators can manage VM2 from the Azure portal. Windows Admin Center must listen on the default port that the Azure portal uses for Windows Admin Center.

    How should you complete the script? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'une machine virtuelle Azure nommée **VM2** qui exécute Windows Server 2025 dans un groupe de ressources nommé **RG1**.

    Vous devez installer Windows Admin Center sur VM2 à l'aide d'Azure PowerShell pour que les administrateurs puissent gérer VM2 depuis le portail Azure. Windows Admin Center doit écouter sur le port par défaut que le portail Azure utilise pour Windows Admin Center.

    Comment devez-vous compléter le script ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $settings = @{ "port" = "[[port]]" }
    [[cmd]] -ResourceGroupName RG1 -VMName VM2 -Location westeurope `
        -ExtensionName AdminCenter -ExtensionType AdminCenter `
        -Publisher [[pub]] -TypeHandlerVersion "0.0" -Settings $settings
  slots:
    - id: port
      options:
        - { id: p443, text: "443" }
        - { id: p3389, text: "3389" }
        - { id: p5986, text: "5986" }
        - { id: p6516, text: "6516" }
    - id: cmd
      options:
        - { id: setvmext, text: Set-AzVMExtension }
        - { id: setcse, text: Set-AzVMCustomScriptExtension }
        - { id: newarcext, text: New-AzConnectedMachineExtension }
        - { id: setdomain, text: Set-AzVMADDomainExtension }
    - id: pub
      options:
        - { id: admincenter, text: Microsoft.AdminCenter }
        - { id: compute, text: Microsoft.Compute }
        - { id: hybrid, text: Microsoft.HybridCompute }
        - { id: aad, text: Microsoft.Azure.ActiveDirectory }
answer:
  values: { port: p6516, cmd: setvmext, pub: admincenter }
explanation:
  correct:
    en: |
      Windows Admin Center in the Azure portal is the `AdminCenter` extension from the publisher `Microsoft.AdminCenter`, installed on an Azure VM with `Set-AzVMExtension`. Its default port is 6516, which is also the destination port of the inbound rule the portal can create.
    fr: |
      Windows Admin Center dans le portail Azure est l'extension `AdminCenter` de l'éditeur `Microsoft.AdminCenter`, installée sur une machine virtuelle Azure avec `Set-AzVMExtension`. Son port par défaut est 6516, qui est aussi le port de destination de la règle entrante que le portail peut créer.
  options:
    p443: { en: "TCP 443 is the outbound port the VM uses to reach the Windows Admin Center service, not the listening port.", fr: "Le port TCP 443 est le port sortant que la machine virtuelle utilise pour joindre le service Windows Admin Center, pas le port d'écoute." }
    p3389: { en: "TCP 3389 is the Remote Desktop port.", fr: "Le port TCP 3389 est celui du Bureau à distance." }
    p5986: { en: "TCP 5986 is the WinRM HTTPS port used by PowerShell remoting.", fr: "Le port TCP 5986 est le port HTTPS de WinRM utilisé par la communication à distance PowerShell." }
    setcse: { en: "Set-AzVMCustomScriptExtension deploys the Custom Script Extension only.", fr: "Set-AzVMCustomScriptExtension déploie uniquement l'extension de script personnalisé." }
    newarcext: { en: "New-AzConnectedMachineExtension targets Azure Arc-enabled servers, not Azure VMs.", fr: "New-AzConnectedMachineExtension cible les serveurs activés pour Azure Arc, pas les machines virtuelles Azure." }
    setdomain: { en: "Set-AzVMADDomainExtension joins a VM to a domain.", fr: "Set-AzVMADDomainExtension joint une machine virtuelle à un domaine." }
references:
  - title: Manage a Windows VMs using Windows Admin Center in Azure
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/azure/manage-vm
