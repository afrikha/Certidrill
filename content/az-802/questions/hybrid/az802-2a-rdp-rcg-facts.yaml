id: az802-2a-rdp-rcg-facts
objective: "2.1.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has an AD DS domain that contains a member server named **SRV14** that runs Windows Server 2025. No Remote Desktop Services role is installed on SRV14. The policy **Remote host allows delegation of nonexportable credentials** is enabled on SRV14.

    A user named **Admin3** is a member of the Remote Desktop Users group of SRV14 and isn't a member of its Administrators group. Admin3 uses a domain-joined computer that runs Windows 11 and connects with Remote Desktop Connection (mstsc.exe).

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un domaine AD DS qui contient un serveur membre nommé **SRV14** qui exécute Windows Server 2025. Aucun rôle Services Bureau à distance n'est installé sur SRV14. La stratégie **Remote host allows delegation of nonexportable credentials** est activée sur SRV14.

    Un utilisateur nommé **Admin3** est membre du groupe Remote Desktop Users de SRV14 et n'est pas membre de son groupe Administrators. Admin3 utilise un ordinateur joint au domaine qui exécute Windows 11 et se connecte avec Connexion Bureau à distance (mstsc.exe).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Admin3 can connect to SRV14 with Remote Credential Guard by running `mstsc.exe /remoteGuard`.
        fr: Admin3 peut se connecter à SRV14 avec Remote Credential Guard en exécutant `mstsc.exe /remoteGuard`.
    - id: s2
      text:
        en: If SRV14 is reachable only through a Remote Desktop Gateway, Admin3 can still use Remote Credential Guard for the connection.
        fr: Si SRV14 n'est accessible que par une passerelle Bureau à distance (RD Gateway), Admin3 peut tout de même utiliser Remote Credential Guard pour la connexion.
    - id: s3
      text:
        en: If Kerberos authentication to SRV14 fails, the Remote Credential Guard connection falls back to NTLM.
        fr: Si l'authentification Kerberos auprès de SRV14 échoue, la connexion Remote Credential Guard se replie sur NTLM.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Remote Credential Guard grants RDP access through the Remote Desktop Users group, and the remote host already allows delegation of nonexportable credentials; the administrator requirement applies only when the server hosts the RD Session Host role. Remote Credential Guard supports direct connections only, not connections through Remote Desktop Gateway or Connection Broker. It uses Kerberos only and doesn't allow NTLM fallback.
    fr: |
      Remote Credential Guard accorde l'accès RDP par le groupe Remote Desktop Users, et l'hôte distant autorise déjà la délégation d'informations d'identification non exportables ; l'exigence d'être administrateur ne s'applique que lorsque le serveur héberge le rôle Hôte de session Bureau à distance. Remote Credential Guard ne prend en charge que les connexions directes, pas les connexions par une passerelle RD Gateway ou un service Broker pour les connexions Bureau à distance. Il utilise uniquement Kerberos et n'autorise pas de repli sur NTLM.
references:
  - title: Remote Credential Guard
    url: https://learn.microsoft.com/en-us/windows/security/identity-protection/remote-credential-guard
