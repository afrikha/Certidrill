id: az802-2a-rdp-credential-modes
objective: "2.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has an AD DS domain. All the clients and servers support Kerberos authentication, and the policy **Remote host allows delegation of nonexportable credentials** is enabled on every server and workstation.

    You need to choose how each group of users connects by using Remote Desktop:

    - **Help desk**: technicians are local administrators of the user workstations they support. If a workstation is compromised, the session on it must not be able to authenticate to other systems as the technician, and the credentials must not be usable after disconnection.
    - **Server admins**: they're members of Remote Desktop Users, not Administrators, on a server named SRV11. From the session, they must open \\FS2\Scripts as themselves, without their credentials being sent to SRV11.
    - **Contractors**: they connect through Remote Desktop Gateway to a server named SRV12, where they're members of Remote Desktop Users.

    Which connection option should each group use? To answer, drag the appropriate options to the correct groups. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un domaine AD DS. Tous les clients et serveurs prennent en charge l'authentification Kerberos, et la stratégie **Remote host allows delegation of nonexportable credentials** est activée sur chaque serveur et chaque station de travail.

    Vous devez choisir comment chaque groupe d'utilisateurs se connecte avec le Bureau à distance :

    - **Support** : les techniciens sont administrateurs locaux des stations de travail des utilisateurs qu'ils assistent. Si une station de travail est compromise, la session ouverte sur elle ne doit pas pouvoir s'authentifier auprès d'autres systèmes en tant que technicien, et les informations d'identification ne doivent pas être utilisables après la déconnexion ;
    - **Administrateurs de serveurs** : ils sont membres de Remote Desktop Users, et non d'Administrators, sur un serveur nommé SRV11. Depuis la session, ils doivent ouvrir \\FS2\Scripts sous leur propre identité, sans que leurs informations d'identification soient envoyées à SRV11 ;
    - **Prestataires** : ils se connectent par l'intermédiaire d'une passerelle des services Bureau à distance (RD Gateway) à un serveur nommé SRV12, où ils sont membres de Remote Desktop Users.

    Quelle option de connexion chaque groupe doit-il utiliser ? Pour répondre, faites glisser les options appropriées vers les groupes correspondants. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rcg, text: { en: "Remote Credential Guard (mstsc /remoteGuard)", fr: "Remote Credential Guard (mstsc /remoteGuard)" } }
    - { id: ra, text: { en: "Restricted Admin mode (mstsc /restrictedAdmin)", fr: "Mode Administration restreinte (mstsc /restrictedAdmin)" } }
    - { id: std, text: { en: "Standard Remote Desktop connection", fr: "Connexion Bureau à distance standard" } }
    - { id: cg, text: { en: "Credential Guard on the client", fr: "Credential Guard sur le client" } }
  targets:
    - { id: helpdesk, text: { en: "Help desk", fr: "Support" } }
    - { id: srvadmins, text: { en: "Server admins", fr: "Administrateurs de serveurs" } }
    - { id: contractors, text: { en: "Contractors", fr: "Prestataires" } }
answer:
  mapping: { helpdesk: ra, srvadmins: rcg, contractors: std }
explanation:
  correct:
    en: |
      Restricted Admin mode prevents the use of credentials after disconnection and gives no single sign-on to other systems, which is why Microsoft recommends it for help desk administrative connections; it requires membership in the Administrators group of the target. Remote Credential Guard keeps credentials on the client while giving single sign-on as the user, and Remote Desktop Users membership is enough. Remote Credential Guard doesn't support connections through Remote Desktop Gateway, and Restricted Admin mode needs Administrators membership, so the contractors use a standard connection.
    fr: |
      Le mode Administration restreinte empêche l'utilisation des informations d'identification après la déconnexion et ne donne pas d'authentification unique vers d'autres systèmes, raison pour laquelle Microsoft le recommande pour les connexions d'administration du support ; il exige l'appartenance au groupe Administrators de la cible. Remote Credential Guard conserve les informations d'identification sur le client tout en offrant l'authentification unique en tant qu'utilisateur, et l'appartenance à Remote Desktop Users suffit. Remote Credential Guard ne fonctionne pas par une passerelle RD Gateway, et le mode Administration restreinte exige Administrators : les prestataires utilisent donc une connexion standard.
  options:
    cg:
      en: Credential Guard protects secrets on the local device; it doesn't control how credentials are delegated over Remote Desktop.
      fr: Credential Guard protège les secrets sur l'appareil local ; il ne contrôle pas la délégation des informations d'identification via le Bureau à distance.
references:
  - title: Remote Credential Guard
    url: https://learn.microsoft.com/en-us/windows/security/identity-protection/remote-credential-guard
