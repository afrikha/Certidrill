id: az802-cs1c-clm1-ssh
objective: "2.1.3"
type: yesno_statements
caseStudy: az802-cs1c-humongous
difficulty: 2
status: draft
stem:
  en: |
    You are preparing CLM1 to meet the SSH requirement.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez CLM1 pour respecter l'exigence SSH.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You must first install OpenSSH Server from Optional Features on CLM1, and then enable the sshd service.
        fr: Vous devez d'abord installer OpenSSH Server depuis les fonctionnalités facultatives de CLM1, puis activer le service sshd.
    - id: s2
      text:
        en: You can restrict SSH access to CLM1 to the members of CL-Ops by adding CL-Ops to the OpenSSH Users group of CLM1.
        fr: Vous pouvez restreindre l'accès SSH à CLM1 aux membres de CL-Ops en ajoutant CL-Ops au groupe OpenSSH Users de CLM1.
    - id: s3
      text:
        en: The Linux workstations connect to CLM1 on TCP port 22, which the OpenSSH-Server-In-TCP firewall rule allows.
        fr: Les stations de travail Linux se connectent à CLM1 sur le port TCP 22, que la règle de pare-feu OpenSSH-Server-In-TCP autorise.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Beginning with Windows Server 2025, OpenSSH is installed by default; you only enable it, for example with Remote SSH Access in the Local Server properties of Server Manager. To allow or restrict users or groups, you add them to the OpenSSH Users group. The firewall rule OpenSSH-Server-In-TCP allows inbound SSH on port 22.
    fr: |
      À partir de Windows Server 2025, OpenSSH est installé par défaut ; il suffit de l'activer, par exemple avec Remote SSH Access dans les propriétés de Local Server du Gestionnaire de serveur. Pour autoriser ou restreindre des utilisateurs ou des groupes, vous les ajoutez au groupe OpenSSH Users. La règle de pare-feu OpenSSH-Server-In-TCP autorise le trafic SSH entrant sur le port 22.
references:
  - title: Get started with OpenSSH for Windows
    url: https://learn.microsoft.com/en-us/windows-server/administration/openssh/openssh_install_firstuse
