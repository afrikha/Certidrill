id: az802-2a-rdp-port-change
objective: "2.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a server named **SRV13** that runs Windows Server 2025. Remote Desktop is enabled on SRV13 and listens on the default port.

    A security requirement states that Remote Desktop on SRV13 must listen on TCP port **3390**, and that clients must be able to reach the new port through Windows Firewall.

    How should you complete the PowerShell commands? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un serveur nommé **SRV13** qui exécute Windows Server 2025. Le Bureau à distance est activé sur SRV13 et écoute sur le port par défaut.

    Une exigence de sécurité impose que le Bureau à distance de SRV13 écoute sur le port TCP **3390**, et que les clients puissent atteindre le nouveau port à travers le Pare-feu Windows.

    Comment devez-vous compléter les commandes PowerShell ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Set-ItemProperty -Path '[[path]]' -Name '[[name]]' -Value 3390
    [[fw]] -DisplayName 'RDP-3390-TCP-In' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3390
  slots:
    - id: path
      options:
        - id: rdptcp
          text: |-
            HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
        - id: ts
          text: |-
            HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server
        - id: lsa
          text: |-
            HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        - id: policies
          text: |-
            HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
    - id: name
      options:
        - { id: portnumber, text: PortNumber }
        - { id: fdeny, text: fDenyTSConnections }
        - { id: userauth, text: UserAuthentication }
        - { id: seclayer, text: SecurityLayer }
    - id: fw
      options:
        - { id: newrule, text: New-NetFirewallRule }
        - { id: enablerule, text: Enable-NetFirewallRule }
        - { id: setprofile, text: Set-NetFirewallProfile }
        - { id: ipsec, text: New-NetIPsecRule }
answer:
  values: { path: rdptcp, name: portnumber, fw: newrule }
explanation:
  correct:
    en: |
      The Remote Desktop listening port is the PortNumber value (3389 by default) under the RDP-Tcp key in WinStations. Because no built-in rule covers TCP 3390, you create an inbound rule with New-NetFirewallRule; clients then connect with the host name followed by a colon and the port, such as srv13.contoso.com:3390.
    fr: |
      Le port d'écoute du Bureau à distance est la valeur PortNumber (3389 par défaut) sous la clé RDP-Tcp de WinStations. Comme aucune règle intégrée ne couvre le port TCP 3390, vous créez une règle entrante avec New-NetFirewallRule ; les clients se connectent ensuite avec le nom d'hôte suivi de deux-points et du port, par exemple srv13.contoso.com:3390.
  options:
    ts: { en: "The Terminal Server key holds settings such as fDenyTSConnections, not the listener port.", fr: "La clé Terminal Server contient des paramètres comme fDenyTSConnections, pas le port de l'écouteur." }
    fdeny: { en: "fDenyTSConnections enables or disables Remote Desktop connections.", fr: "fDenyTSConnections active ou désactive les connexions Bureau à distance." }
    userauth: { en: "UserAuthentication controls Network Level Authentication.", fr: "UserAuthentication contrôle l'authentification au niveau du réseau." }
    enablerule: { en: "Enable-NetFirewallRule enables existing rules, and the built-in Remote Desktop rules allow port 3389 only.", fr: "Enable-NetFirewallRule active des règles existantes, et les règles intégrées du Bureau à distance autorisent uniquement le port 3389." }
references:
  - title: Change Remote Desktop listening port on Windows and Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/clients/change-listening-port
