id: az802-2b-rb-hybrid-credentials
objective: "2.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Automation account named **AA1** and an extension-based Hybrid Runbook Worker group named **HRW-Lyon** that contains two Azure Arc-enabled servers. The group uses the default Hybrid Worker credentials. The domain is **woodgrove.local**.

    A runbook that runs on HRW-Lyon must write reports to the share `\\FS1\Reports`. Only the domain account **WOODGROVE\svc-reports** has write permission on the share, and the share permissions must not be changed. svc-reports already has the folder permissions that a custom Hybrid Worker credential needs on the workers.

    You need the runbook jobs to write to the share. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un compte Azure Automation nommé **AA1** et d'un groupe Hybrid Runbook Worker basé sur une extension nommé **HRW-Lyon**, qui contient deux serveurs activés pour Azure Arc. Le groupe utilise les informations d'identification Hybrid Worker par défaut. Le domaine est **woodgrove.local**.

    Un runbook qui s'exécute sur HRW-Lyon doit écrire des rapports dans le partage `\\FS1\Reports`. Seul le compte de domaine **WOODGROVE\svc-reports** dispose de l'autorisation d'écriture sur le partage, et les autorisations du partage ne doivent pas être modifiées. svc-reports dispose déjà des autorisations de dossier qu'une information d'identification Hybrid Worker personnalisée exige sur les workers.

    Les tâches du runbook doivent pouvoir écrire dans le partage. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a credential asset in AA1 that contains the user name and password of svc-reports.", fr: "Créer dans AA1 une ressource d'informations d'identification qui contient le nom d'utilisateur et le mot de passe de svc-reports." } }
    - { id: b, text: { en: "Enable the system-assigned managed identity of AA1 and grant it access to FS1.", fr: "Activer l'identité managée affectée par le système d'AA1 et lui accorder l'accès à FS1." } }
    - { id: c, text: { en: "Set the Hybrid Worker credentials of HRW-Lyon to Custom and select the credential asset.", fr: "Définir les informations d'identification Hybrid Worker de HRW-Lyon sur Custom et sélectionner la ressource d'informations d'identification." } }
    - { id: d, text: { en: "Add svc-reports to the local Administrators group of the two workers.", fr: "Ajouter svc-reports au groupe Administrateurs local des deux workers." } }
    - { id: e, text: { en: "Change the runbook to run in the Azure sandbox instead of on HRW-Lyon.", fr: "Modifier le runbook pour qu'il s'exécute dans le bac à sable Azure au lieu de HRW-Lyon." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      With the default setting, jobs on a Windows Hybrid Runbook Worker run as the local system account, which reaches the network as the server's computer account and has no write access to the share. To run jobs as svc-reports, you store its credentials in a credential asset and select that asset as the Custom Hybrid Worker credentials of the group.
    fr: |
      Avec le paramètre par défaut, les tâches d'un Hybrid Runbook Worker Windows s'exécutent sous le compte système local, qui accède au réseau avec le compte d'ordinateur du serveur et n'a pas d'accès en écriture au partage. Pour exécuter les tâches sous svc-reports, vous stockez ses informations d'identification dans une ressource d'informations d'identification et vous sélectionnez cette ressource comme informations d'identification Hybrid Worker personnalisées (Custom) du groupe.
  options:
    b: { en: "A managed identity authenticates to Microsoft Entra ID and Azure resources, not to an SMB share of an AD DS domain.", fr: "Une identité managée s'authentifie auprès de Microsoft Entra ID et des ressources Azure, pas auprès d'un partage SMB d'un domaine AD DS." }
    d: { en: "Local group membership doesn't change the account the jobs run as.", fr: "L'appartenance à un groupe local ne change pas le compte sous lequel les tâches s'exécutent." }
    e: { en: "A cloud job runs in Azure and can't reach a share on the internal network.", fr: "Une tâche cloud s'exécute dans Azure et ne peut pas atteindre un partage du réseau interne." }
references:
  - title: Deploy an extension-based Windows or Linux User Hybrid Runbook Worker in Azure Automation
    url: https://learn.microsoft.com/en-us/azure/automation/extension-based-hybrid-runbook-worker-install
