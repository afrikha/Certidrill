id: az802-2b-um-periodic-policy
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has an Azure subscription named **Sub1** that contains 120 Azure Arc-enabled servers that run Windows Server. New servers are onboarded to Azure Arc every week.

    You need Azure Update Manager to check every server for missing updates automatically every 24 hours, including the servers that will be onboarded later. Updates must not be installed. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Tailspin Toys dispose d'un abonnement Azure nommé **Sub1** qui contient 120 serveurs activés pour Azure Arc qui exécutent Windows Server. De nouveaux serveurs sont intégrés à Azure Arc chaque semaine.

    Le Gestionnaire de mise à jour Azure doit rechercher automatiquement les mises à jour manquantes sur chaque serveur toutes les 24 heures, y compris sur les serveurs qui seront intégrés plus tard. Les mises à jour ne doivent pas être installées. La solution doit réduire l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Machines should be configured to periodically check for missing system updates policy to Sub1.", fr: "Attribuer à Sub1 la stratégie Machines should be configured to periodically check for missing system updates." } }
    - { id: b, text: { en: "Assign the Configure periodic checking for missing system updates on Azure Arc-enabled servers policy to Sub1 with a remediation task.", fr: "Attribuer à Sub1 la stratégie Configure periodic checking for missing system updates on Azure Arc-enabled servers avec une tâche de correction." } }
    - { id: c, text: { en: "Create a maintenance configuration with a daily recurrence and a dynamic scope that includes all the Arc-enabled servers in Sub1.", fr: "Créer une configuration de maintenance avec une périodicité quotidienne et une étendue dynamique qui inclut tous les serveurs activés pour Azure Arc de Sub1." } }
    - { id: d, text: { en: "Select all the servers in Update Manager and run Check for updates, then repeat it each time servers are onboarded.", fr: "Sélectionner tous les serveurs dans le Gestionnaire de mise à jour et exécuter Check for updates, puis recommencer à chaque intégration de serveurs." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Periodic assessment makes Update Manager check a machine for available updates once every 24 hours. The built-in policy Configure periodic checking for missing system updates on Azure Arc-enabled servers turns the setting on for new machines in scope, and a remediation task enables it on the existing servers.
    fr: |
      L'évaluation périodique fait rechercher par le Gestionnaire de mise à jour les mises à jour disponibles sur une machine une fois toutes les 24 heures. La stratégie intégrée Configure periodic checking for missing system updates on Azure Arc-enabled servers active ce paramètre sur les nouvelles machines de l'étendue, et une tâche de correction l'active sur les serveurs existants.
  options:
    a: { en: "This policy only reports which machines don't have periodic assessment enabled; it doesn't enable it.", fr: "Cette stratégie signale seulement les machines sur lesquelles l'évaluation périodique n'est pas activée ; elle ne l'active pas." }
    c: { en: "A maintenance configuration schedules the installation of updates, which the requirement forbids.", fr: "Une configuration de maintenance planifie l'installation des mises à jour, ce que l'exigence interdit." }
    d: { en: "Check for updates is an on-demand assessment; repeating it manually doesn't minimize administrative effort.", fr: "Check for updates est une évaluation à la demande ; la répéter manuellement ne réduit pas l'effort d'administration." }
references:
  - title: Enable Periodic Assessment Using Policy
    url: https://learn.microsoft.com/en-us/azure/update-manager/periodic-assessment-at-scale
