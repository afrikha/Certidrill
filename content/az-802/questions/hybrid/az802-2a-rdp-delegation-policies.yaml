id: az802-2a-rdp-delegation-policies
objective: "2.1.4"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a member server named **SRV12** that runs Windows Server 2025. Administrators connect to SRV12 from Windows 11 workstations by using Remote Desktop Connection.

    You need to configure Group Policy so that administrators must use Remote Credential Guard when they connect to remote hosts, and so that SRV12 supports these connections.

    Which setting should you configure for each requirement? To answer, select the appropriate setting in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un serveur membre nommé **SRV12** qui exécute Windows Server 2025. Les administrateurs se connectent à SRV12 depuis des stations de travail Windows 11 à l'aide de Connexion Bureau à distance.

    Vous devez configurer la stratégie de groupe pour que les administrateurs soient obligés d'utiliser Remote Credential Guard lorsqu'ils se connectent à des hôtes distants, et pour que SRV12 prenne en charge ces connexions.

    Quel paramètre devez-vous configurer pour chaque exigence ? Pour répondre, sélectionnez le paramètre approprié dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - { id: host, text: { en: "Setting to enable in a GPO that applies to SRV12", fr: "Paramètre à activer dans un GPO qui s'applique à SRV12" } }
    - { id: client, text: { en: "Setting to configure in a GPO that applies to the administrators' workstations", fr: "Paramètre à configurer dans un GPO qui s'applique aux stations de travail des administrateurs" } }
  grid:
    header: [ { en: "Setting", fr: "Paramètre" }, { en: "Administrative Templates category", fr: "Catégorie des modèles d'administration" } ]
    rows:
      - [ { text: Allow delegating fresh credentials, area: fresh }, { text: System > Credentials Delegation } ]
      - [ { text: Remote host allows delegation of nonexportable credentials, area: nonexport }, { text: System > Credentials Delegation } ]
      - [ { text: Restrict delegation of credentials to remote servers, area: restrict }, { text: System > Credentials Delegation } ]
      - [ { text: Require user authentication for remote connections by using Network Level Authentication, area: nla }, { text: Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security } ]
      - [ { text: Allow users to connect remotely by using Remote Desktop Services, area: allowrds }, { text: Windows Components > Remote Desktop Services > Remote Desktop Session Host > Connections } ]
answer:
  values: { host: nonexport, client: restrict }
explanation:
  correct:
    en: |
      The remote host must allow delegation of nonexportable credentials; without this policy, Restricted Admin and Remote Credential Guard aren't supported on it. On the clients, Restrict delegation of credentials to remote servers set to Require Remote Credential Guard forces that mode; the Restrict Credential Delegation option would also accept Restricted Admin as a fallback.
    fr: |
      L'hôte distant doit autoriser la délégation d'informations d'identification non exportables ; sans cette stratégie, Restricted Admin et Remote Credential Guard n'y sont pas pris en charge. Sur les clients, Restrict delegation of credentials to remote servers défini sur Require Remote Credential Guard impose ce mode ; l'option Restrict Credential Delegation accepterait aussi Restricted Admin en repli.
  options:
    fresh: { en: "Allow delegating fresh credentials sends the user's credentials to the listed servers, the opposite of the goal.", fr: "Allow delegating fresh credentials envoie les informations d'identification de l'utilisateur aux serveurs listés, l'inverse de l'objectif." }
    nla: { en: "NLA makes users authenticate before a session is created; it doesn't protect credentials from the remote host.", fr: "NLA oblige les utilisateurs à s'authentifier avant la création d'une session ; il ne protège pas les informations d'identification vis-à-vis de l'hôte distant." }
    allowrds: { en: "This setting enables or disables Remote Desktop connections; it doesn't choose a credential protection mode.", fr: "Ce paramètre active ou désactive les connexions Bureau à distance ; il ne choisit pas de mode de protection des informations d'identification." }
references:
  - title: Remote Credential Guard
    url: https://learn.microsoft.com/en-us/windows/security/identity-protection/remote-credential-guard
