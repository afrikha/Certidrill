id: az802-sr1-share-hop-2
objective: "2.1.2"
type: series_yesno
series: az802-sr1-share-hop
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You configure resource-based Kerberos constrained delegation on the computer account of FS1.
  fr: Vous configurez la délégation Kerberos contrainte basée sur les ressources sur le compte d'ordinateur de FS1.
body:
  solution:
    en: |
      You run the following command on a computer that has the Active Directory module for Windows PowerShell, and then you run `klist purge -li 0x3e7` on Server1:

      ```powershell
      Set-ADComputer -Identity FS1 -PrincipalsAllowedToDelegateToAccount (Get-ADComputer -Identity Server1)
      ```
    fr: |
      Vous exécutez la commande suivante sur un ordinateur qui dispose du module Active Directory pour Windows PowerShell, puis vous exécutez `klist purge -li 0x3e7` sur Server1 :

      ```powershell
      Set-ADComputer -Identity FS1 -PrincipalsAllowedToDelegateToAccount (Get-ADComputer -Identity Server1)
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      Setting `PrincipalsAllowedToDelegateToAccount` on FS1 allows Server1 to obtain Kerberos tickets to FS1 on behalf of the users connected to it, so the SMB access from the remote session succeeds. No credentials are sent to or stored on Server1. Purging the system ticket cache on Server1 clears the access denial that the KDC caches for 15 minutes.
    fr: |
      Définir `PrincipalsAllowedToDelegateToAccount` sur FS1 autorise Server1 à obtenir des tickets Kerberos vers FS1 pour le compte des utilisateurs qui s'y connectent : l'accès SMB depuis la session à distance réussit. Aucune information d'identification n'est envoyée à Server1 ni stockée sur Server1. Le vidage du cache de tickets système sur Server1 supprime le refus d'accès que le KDC met en cache pendant 15 minutes.
references:
  - title: Making the second hop in PowerShell Remoting
    url: https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/ps-remoting-second-hop
