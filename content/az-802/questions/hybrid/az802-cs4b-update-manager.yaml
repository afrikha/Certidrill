id: az802-cs4b-update-manager
objective: "2.2.4"
type: single
caseStudy: az802-cs4b-lucerne-publishing
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the update requirements for the Arc-enabled servers. What should you do?
  fr: |
    Vous devez satisfaire les exigences de mise à jour concernant les serveurs avec Azure Arc. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |
          In Azure Update Manager, enable periodic assessment and create a maintenance configuration with a monthly schedule that targets the servers.
        fr: |
          Dans Azure Update Manager, activer l'évaluation périodique et créer une configuration de maintenance avec une planification mensuelle qui cible les serveurs.
    - id: b
      text:
        en: |
          Create a Group Policy Object that schedules automatic installation of updates, and link it to the organizational units of the servers.
        fr: |
          Créer un objet de stratégie de groupe qui planifie l'installation automatique des mises à jour, puis le lier aux unités d'organisation des serveurs.
    - id: c
      text:
        en: |
          Install the Azure Monitor Agent on the servers, and create a data collection rule that sends the Windows Update events to LAW-Lucerne.
        fr: |
          Installer l'Agent Azure Monitor sur les serveurs, puis créer une règle de collecte de données qui envoie les événements Windows Update vers LAW-Lucerne.
    - id: d
      text:
        en: |
          Create an Azure Automation account linked to LAW-Lucerne, and schedule a runbook that installs the updates on the servers every month.
        fr: |
          Créer un compte Azure Automation lié à LAW-Lucerne, puis planifier un runbook qui installe les mises à jour sur les serveurs chaque mois.
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Update Manager manages updates for Azure VMs and Azure Arc-enabled servers with no dependency on Log Analytics or Azure Automation. Periodic assessment checks for missing updates every 24 hours, and a maintenance configuration installs them in a customer-defined window, such as the second Saturday of the month at 22:00. Compliance is shown in the Azure portal.
    fr: |
      Azure Update Manager gère les mises à jour des machines virtuelles Azure et des serveurs avec Azure Arc, sans dépendre de Log Analytics ni d'Azure Automation. L'évaluation périodique recherche les mises à jour manquantes toutes les 24 heures, et une configuration de maintenance les installe dans une fenêtre définie par le client, comme le deuxième samedi du mois à 22 h 00. La conformité est affichée dans le portail Azure.
  options:
    b:
      en: |
        A GPO can schedule installations on the servers, but the update compliance of the servers would not be visible in the Azure portal.
      fr: |
        Un objet de stratégie de groupe peut planifier les installations sur les serveurs, mais la conformité des mises à jour des serveurs ne serait pas visible dans le portail Azure.
    c:
      en: |
        Collecting events only stores log data; it neither assesses missing updates nor installs them.
      fr: |
        La collecte d'événements ne fait que stocker des données de journal ; elle n'évalue pas les mises à jour manquantes et ne les installe pas.
    d:
      en: |
        A custom runbook and an Automation account add components to build and maintain, and they give no daily assessment, which does not minimize administrative effort.
      fr: |
        Un runbook personnalisé et un compte Automation ajoutent des composants à créer et à maintenir, et ils ne fournissent pas d'évaluation quotidienne, ce qui ne réduit pas l'effort d'administration au minimum.
references:
  - title: Azure Update Manager Overview
    url: https://learn.microsoft.com/en-us/azure/update-manager/overview
