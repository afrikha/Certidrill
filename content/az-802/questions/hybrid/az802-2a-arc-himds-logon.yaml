id: az802-2a-arc-himds-logon
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. installs the Azure Connected Machine agent on servers that run Windows Server 2022. On the 30 servers in an OU named **Tier1**, the Azure Hybrid Instance Metadata Service doesn't start and `azcmagent connect` fails. The servers in the other OUs connect successfully.

    A GPO named **Tier1-Hardening** is linked to the Tier1 OU. It configures the user rights assignment **Log on as a service** with a list of specific accounts.

    You need to ensure that the agent can run on the Tier1 servers.

    What should you do?
  fr: |
    Contoso, Ltd. installe l'agent Azure Connected Machine sur des serveurs qui exécutent Windows Server 2022. Sur les 30 serveurs d'une UO nommée **Tier1**, le service Azure Hybrid Instance Metadata Service ne démarre pas et `azcmagent connect` échoue. Les serveurs des autres UO se connectent correctement.

    Un GPO nommé **Tier1-Hardening** est lié à l'UO Tier1. Il configure l'attribution des droits utilisateur **Log on as a service** avec une liste de comptes précis.

    Vous devez faire en sorte que l'agent puisse s'exécuter sur les serveurs Tier1.

    Que devez-vous faire ?
body:
  options:
    - id: b
      text:
        en: |-
          In Tier1-Hardening, add `NT SERVICE\himds` to the **Log on as a batch job** user right.
        fr: |-
          Dans Tier1-Hardening, ajouter `NT SERVICE\himds` au droit utilisateur **Log on as a batch job**.
    - id: a
      text:
        en: |-
          In Tier1-Hardening, add `NT SERVICE\himds` to the **Log on as a service** user right.
        fr: |-
          Dans Tier1-Hardening, ajouter `NT SERVICE\himds` au droit utilisateur **Log on as a service**.
    - id: c
      text:
        en: |-
          On each Tier1 server, add the computer account to the **Hybrid agent extension applications** group.
        fr: |-
          Sur chaque serveur Tier1, ajouter le compte d'ordinateur au groupe **Hybrid agent extension applications**.
    - id: d
      text:
        en: |-
          On each Tier1 server, configure the himds service to run as the Local System account.
        fr: |-
          Sur chaque serveur Tier1, configurer le service himds pour qu'il s'exécute sous le compte Local System.
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Hybrid Instance Metadata Service runs under the low-privileged virtual account `NT SERVICE\himds`, which needs the Log on as a service right. Virtual accounts get this right by default, but a GPO that defines the list replaces it, so you add `NT SERVICE\himds` (or `NT SERVICE\ALL SERVICES`) to the policy, preferably editing it from a computer that has the agent installed so the name resolves.
    fr: |
      Le service Hybrid Instance Metadata Service s'exécute sous le compte virtuel peu privilégié `NT SERVICE\himds`, qui a besoin du droit Log on as a service. Les comptes virtuels reçoivent ce droit par défaut, mais un GPO qui définit la liste la remplace : vous ajoutez donc `NT SERVICE\himds` (ou `NT SERVICE\ALL SERVICES`) à la stratégie, de préférence en la modifiant depuis un ordinateur où l'agent est installé pour que le nom se résolve.
  options:
    b:
      en: A service needs the Log on as a service right; Log on as a batch job applies to scheduled tasks.
      fr: Un service a besoin du droit Log on as a service ; Log on as a batch job s'applique aux tâches planifiées.
    c:
      en: Members of Hybrid agent extension applications can request Microsoft Entra tokens for the system-assigned managed identity; the group doesn't let himds start.
      fr: Les membres de Hybrid agent extension applications peuvent demander des jetons Microsoft Entra pour l'identité managée affectée par le système ; ce groupe ne permet pas à himds de démarrer.
    d:
      en: The agent is designed to run himds as an unprivileged virtual account; changing it to Local System weakens security and isn't a supported fix.
      fr: L'agent est conçu pour exécuter himds sous un compte virtuel non privilégié ; le passer sous Local System affaiblit la sécurité et n'est pas une correction prise en charge.
references:
