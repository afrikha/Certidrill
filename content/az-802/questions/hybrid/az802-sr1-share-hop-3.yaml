id: az802-sr1-share-hop-3
objective: "2.1.2"
type: series_yesno
series: az802-sr1-share-hop
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You enable CredSSP on Client1 and Server1, and Admin1 connects by using CredSSP authentication.
  fr: Vous activez CredSSP sur Client1 et Server1, et Admin1 se connecte à l'aide de l'authentification CredSSP.
body:
  solution:
    en: |
      You run the first command on Client1 and the second command on Server1. Admin1 then connects by running the third command on Client1.

      ```powershell
      Enable-WSManCredSSP -Role Client -DelegateComputer server1.fabrikam.com
      Enable-WSManCredSSP -Role Server
      Enter-PSSession -ComputerName server1.fabrikam.com -Authentication CredSSP -Credential fabrikam\Admin1
      ```
    fr: |
      Vous exécutez la première commande sur Client1 et la deuxième sur Server1. Admin1 se connecte ensuite en exécutant la troisième commande sur Client1.

      ```powershell
      Enable-WSManCredSSP -Role Client -DelegateComputer server1.fabrikam.com
      Enable-WSManCredSSP -Role Server
      Enter-PSSession -ComputerName server1.fabrikam.com -Authentication CredSSP -Credential fabrikam\Admin1
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      CredSSP solves the second hop by delegating the user's credentials from Client1 to Server1, which then uses them to reach FS1. Admin1 would be able to read the share, but sending the credentials to Server1 is exactly what the requirement forbids: if Server1 were compromised, the credentials could be reused.
    fr: |
      CredSSP résout le second saut en déléguant les informations d'identification de l'utilisateur de Client1 vers Server1, qui les utilise ensuite pour atteindre FS1. Admin1 pourrait lire le partage, mais l'envoi des informations d'identification à Server1 est précisément ce que l'exigence interdit : si Server1 était compromis, ces informations pourraient être réutilisées.
references:
