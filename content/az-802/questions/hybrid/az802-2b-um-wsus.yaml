id: az802-2b-um-wsus
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has 20 on-premises servers that run Windows Server 2022 and are onboarded to Azure Arc. A Group Policy Object configures the servers to get updates from a WSUS server named **WSUS1** and enables **Do not connect to any Windows Update Internet locations**.

    You create a maintenance configuration in Azure Update Manager that installs Critical and Security updates every Sunday and associate the 20 servers with it. After the first run, the security team reports that this month's cumulative security update isn't installed on any server. In WSUS1, the update is listed with the approval status **Not approved**.

    You need the next scheduled run to install the update. The servers must keep using WSUS1. What should you do?
  fr: |
    Adatum Corporation dispose de 20 serveurs locaux qui exécutent Windows Server 2022 et sont intégrés à Azure Arc. Un objet de stratégie de groupe configure les serveurs pour qu'ils obtiennent les mises à jour d'un serveur WSUS nommé **WSUS1** et active **Ne pas se connecter à des emplacements Internet Windows Update**.

    Vous créez dans le Gestionnaire de mise à jour Azure une configuration de maintenance qui installe les mises à jour Critical et Security chaque dimanche, et vous y associez les 20 serveurs. Après la première exécution, l'équipe de sécurité signale que la mise à jour cumulative de sécurité de ce mois n'est installée sur aucun serveur. Dans WSUS1, la mise à jour apparaît avec l'état d'approbation **Not approved**.

    La prochaine exécution planifiée doit installer la mise à jour. Les serveurs doivent continuer à utiliser WSUS1. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the KB number of the update to the include list of the maintenance configuration.", fr: "Ajouter le numéro de KB de la mise à jour à la liste d'inclusion de la configuration de maintenance." } }
    - { id: b, text: { en: "Set the patch orchestration of the 20 servers to Customer Managed Schedules.", fr: "Définir l'orchestration des correctifs des 20 serveurs sur Customer Managed Schedules." } }
    - { id: c, text: { en: "Approve the update for installation on the computer group of the servers in WSUS1.", fr: "Approuver l'installation de la mise à jour pour le groupe d'ordinateurs des serveurs dans WSUS1." } }
    - { id: d, text: { en: "Change the update source of the servers to Microsoft Update from Update settings in Update Manager.", fr: "Remplacer la source de mise à jour des serveurs par Microsoft Update depuis Update settings dans le Gestionnaire de mise à jour." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Update Manager installs updates from the source configured on each machine. When Group Policy points the machines to WSUS, updates must be approved in WSUS, otherwise the Update Manager deployment can't install them. Approving the update for the servers' computer group makes it available to the next scheduled run.
    fr: |
      Le Gestionnaire de mise à jour installe les mises à jour depuis la source configurée sur chaque machine. Quand une stratégie de groupe dirige les machines vers WSUS, les mises à jour doivent être approuvées dans WSUS, sinon le déploiement du Gestionnaire de mise à jour ne peut pas les installer. L'approbation de la mise à jour pour le groupe d'ordinateurs des serveurs la rend disponible pour la prochaine exécution planifiée.
  options:
    a: { en: "Including a KB in the schedule doesn't make WSUS offer an update that isn't approved.", fr: "Inclure un KB dans la planification ne fait pas proposer par WSUS une mise à jour non approuvée." }
    b: { en: "Customer Managed Schedules is a prerequisite for Azure VMs, not for Arc-enabled machines, and the schedule already ran.", fr: "Customer Managed Schedules est un prérequis pour les machines virtuelles Azure, pas pour les machines activées pour Azure Arc, et la planification s'est déjà exécutée." }
    d: { en: "The patch source is changed in Windows settings or Group Policy, not in Update Manager, and the servers must keep using WSUS1.", fr: "La source des correctifs se modifie dans les paramètres Windows ou par stratégie de groupe, pas dans le Gestionnaire de mise à jour, et les serveurs doivent continuer à utiliser WSUS1." }
references:
  - title: Configure Windows Update Settings in Azure Update Manager
    url: https://learn.microsoft.com/en-us/azure/update-manager/configure-wu-agent
