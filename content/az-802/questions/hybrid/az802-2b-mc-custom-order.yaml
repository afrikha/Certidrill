id: az802-2b-mc-custom-order
objective: "2.2.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has 60 on-premises servers that run Windows Server 2022 and are onboarded to Azure Arc. On an administrative workstation that has PowerShell 7 and the GuestConfiguration module, you write a DSC configuration script named `SecureProtocols.ps1` that disables legacy protocols.

    You need to create a custom Azure Policy definition that applies this configuration to the Arc-enabled servers.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware, Inc. dispose de 60 serveurs locaux qui exécutent Windows Server 2022 et sont intégrés à Azure Arc. Sur une station de travail d'administration équipée de PowerShell 7 et du module GuestConfiguration, vous écrivez un script de configuration DSC nommé `SecureProtocols.ps1` qui désactive des protocoles hérités.

    Vous devez créer une définition Azure Policy personnalisée qui applique cette configuration aux serveurs activés pour Azure Arc.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: compile, text: { en: "Run SecureProtocols.ps1 to compile the configuration into a MOF file.", fr: "Exécuter SecureProtocols.ps1 pour compiler la configuration dans un fichier MOF." } }
    - { id: pkg, text: { en: "Run New-GuestConfigurationPackage with the type AuditAndSet.", fr: "Exécuter New-GuestConfigurationPackage avec le type AuditAndSet." } }
    - { id: upload, text: { en: "Upload the .zip package to a blob container and get its URI.", fr: "Charger le package .zip dans un conteneur d'objets blob et obtenir son URI." } }
    - { id: policy, text: { en: "Run New-GuestConfigurationPolicy with the package URI and a mode.", fr: "Exécuter New-GuestConfigurationPolicy avec l'URI du package et un mode." } }
    - { id: def, text: { en: "Run New-AzPolicyDefinition with the generated JSON file.", fr: "Exécuter New-AzPolicyDefinition avec le fichier JSON généré." } }
    - { id: dsc, text: { en: "Run Publish-AzVMDscConfiguration to upload the script to storage.", fr: "Exécuter Publish-AzVMDscConfiguration pour charger le script dans le stockage." } }
    - { id: ext, text: { en: "Install the machine configuration extension on each server.", fr: "Installer l'extension de configuration de machine sur chaque serveur." } }
answer:
  sequence: [ compile, pkg, upload, policy, def ]
explanation:
  correct:
    en: |
      Running the configuration script compiles it into a MOF file, which `New-GuestConfigurationPackage` turns into a .zip package (AuditAndSet so it can change the machine). The package must be published to a location the machines can reach, such as a blob container, because `New-GuestConfigurationPolicy` needs its content URI to generate the policy definition JSON. `New-AzPolicyDefinition` then creates the definition in Azure, ready to be assigned.
    fr: |
      L'exécution du script de configuration le compile dans un fichier MOF, que `New-GuestConfigurationPackage` transforme en package .zip (AuditAndSet pour qu'il puisse modifier la machine). Le package doit être publié à un emplacement accessible aux machines, par exemple un conteneur d'objets blob, car `New-GuestConfigurationPolicy` a besoin de son URI de contenu pour générer le JSON de la définition de stratégie. `New-AzPolicyDefinition` crée ensuite la définition dans Azure, prête à être attribuée.
  options:
    dsc: { en: "Publish-AzVMDscConfiguration prepares configurations for the DSC VM extension, which isn't available for Arc-enabled servers.", fr: "Publish-AzVMDscConfiguration prépare des configurations pour l'extension de machine virtuelle DSC, qui n'est pas disponible pour les serveurs activés pour Azure Arc." }
    ext: { en: "Arc-enabled servers don't need the extension: machine configuration is included in the Connected Machine agent.", fr: "Les serveurs activés pour Azure Arc n'ont pas besoin de l'extension : la configuration de machine est incluse dans l'agent Connected Machine." }
references:
  - title: How to create custom machine configuration package artifacts
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/how-to/develop-custom-package/2-create-package
  - title: How to create custom machine configuration policy definitions
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/how-to/create-policy-definition
