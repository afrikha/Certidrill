id: az802-2a-wac-azure-vm-login
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has an Azure subscription that contains a resource group named **RG1**. RG1 contains a virtual machine named **VM1** that runs Windows Server 2022. The on-premises network is connected to the virtual network of VM1 by a site-to-site VPN.

    An administrator named Admin1 installed Windows Admin Center on VM1 from the Azure portal on port 6516. Admin1 can connect to VM1 from the **Windows Admin Center** page of VM1 by using its private IP address.

    A user named **User2** has the Contributor role on RG1. When User2 selects **Connect** on the same page from the same network, User2 receives a "Failed to connect" message.

    You need to ensure that User2 can manage VM1 by using Windows Admin Center in the Azure portal. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Contoso, Ltd. dispose d'un abonnement Azure qui contient un groupe de ressources nommé **RG1**. RG1 contient une machine virtuelle nommée **VM1** qui exécute Windows Server 2022. Le réseau local est relié au réseau virtuel de VM1 par un VPN site à site.

    Un administrateur nommé Admin1 a installé Windows Admin Center sur VM1 depuis le portail Azure, sur le port 6516. Admin1 peut se connecter à VM1 depuis la page **Windows Admin Center** de VM1 en utilisant son adresse IP privée.

    Un utilisateur nommé **User2** a le rôle Contributor sur RG1. Lorsque User2 sélectionne **Connect** sur la même page depuis le même réseau, User2 reçoit le message « Failed to connect ».

    Vous devez faire en sorte que User2 puisse gérer VM1 à l'aide de Windows Admin Center dans le portail Azure. La solution doit respecter le principe du privilège minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Virtual Machine Administrator Login role on VM1 to User2.", fr: "Attribuer le rôle Virtual Machine Administrator Login sur VM1 à User2." } }
    - { id: b, text: { en: "Assign the Windows Admin Center Administrator Login role on VM1 to User2.", fr: "Attribuer le rôle Windows Admin Center Administrator Login sur VM1 à User2." } }
    - { id: c, text: { en: "Assign the Owner role on RG1 to User2.", fr: "Attribuer le rôle Owner sur RG1 à User2." } }
    - { id: d, text: { en: "Add User2 to the local Administrators group of VM1.", fr: "Ajouter User2 au groupe local Administrators de VM1." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Connecting to Windows Admin Center in the Azure portal requires the Reader and Windows Admin Center Administrator Login roles on the VM. Contributor already includes read access, so only Windows Admin Center Administrator Login is missing. Owner or Contributor lets a user install the extension but doesn't grant sign-in to the VM through Windows Admin Center.
    fr: |
      La connexion à Windows Admin Center dans le portail Azure demande les rôles Reader et Windows Admin Center Administrator Login sur la machine virtuelle. Contributor inclut déjà l'accès en lecture : seul Windows Admin Center Administrator Login manque. Owner ou Contributor permet d'installer l'extension, mais n'accorde pas la connexion à la machine virtuelle par Windows Admin Center.
  options:
    a:
      en: Virtual Machine Administrator Login is used to sign in to a VM with Microsoft Entra credentials, not to connect through Windows Admin Center.
      fr: Virtual Machine Administrator Login sert à se connecter à une machine virtuelle avec des informations d'identification Microsoft Entra, pas à se connecter par Windows Admin Center.
    c:
      en: An Owner or Contributor of a VM doesn't automatically have privileges to sign in to it through Windows Admin Center, and Owner is far broader than needed.
      fr: Un Owner ou un Contributor d'une machine virtuelle n'a pas automatiquement le privilège de s'y connecter par Windows Admin Center, et Owner est bien plus large que nécessaire.
    d:
      en: Access through Windows Admin Center in Azure is controlled by an Azure role; the connection deploys a virtual account in the Administrators group of the VM.
      fr: L'accès par Windows Admin Center dans Azure est contrôlé par un rôle Azure ; la connexion déploie un compte virtuel dans le groupe Administrators de la machine virtuelle.
references:
  - title: Manage a Windows VMs using Windows Admin Center in Azure
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/azure/manage-vm
