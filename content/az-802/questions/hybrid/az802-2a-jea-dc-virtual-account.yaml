id: az802-2a-jea-dc-virtual-account
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a domain controller named **DC1** that runs Windows Server 2025. You register a JEA endpoint named **DnsOps** on DC1. The session configuration file contains `SessionType = 'RestrictedRemoteServer'` and `RunAsVirtualAccount = $true`, and it doesn't contain RunAsVirtualAccountGroups.

    A security auditor asks which privileges the commands run in DnsOps sessions have.

    What should you answer?
  fr: |
    Contoso, Ltd. dispose d'un contrôleur de domaine nommé **DC1** qui exécute Windows Server 2025. Vous inscrivez un point de terminaison JEA nommé **DnsOps** sur DC1. Le fichier de configuration de session contient `SessionType = 'RestrictedRemoteServer'` et `RunAsVirtualAccount = $true`, et il ne contient pas RunAsVirtualAccountGroups.

    Un auditeur de sécurité demande de quels privilèges disposent les commandes exécutées dans les sessions DnsOps.

    Que devez-vous répondre ?
body:
  options:
    - { id: b, text: { en: "The privileges of the user who connects to the endpoint", fr: "Les privilèges de l'utilisateur qui se connecte au point de terminaison" } }
    - { id: a, text: { en: "The privileges of a member of the Domain Admins group", fr: "Les privilèges d'un membre du groupe Domain Admins" } }
    - { id: c, text: { en: "The privileges of a member of the DnsAdmins group only", fr: "Les privilèges d'un membre du groupe DnsAdmins uniquement" } }
    - { id: d, text: { en: "The privileges of a member of the Remote Management Users group", fr: "Les privilèges d'un membre du groupe Remote Management Users" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A JEA virtual account is a temporary account unique to each session. On a member server it belongs to the local Administrators group, and on a domain controller it belongs to the domain's Domain Admins group. The visible commands limit what users can run, but those commands run with Domain Admins privileges.
    fr: |
      Un compte virtuel JEA est un compte temporaire propre à chaque session. Sur un serveur membre, il appartient au groupe local Administrators, et sur un contrôleur de domaine, il appartient au groupe Domain Admins du domaine. Les commandes visibles limitent ce que les utilisateurs peuvent exécuter, mais ces commandes s'exécutent avec les privilèges de Domain Admins.
  options:
    b:
      en: With a run-as virtual account, commands don't run under the connecting user's identity; that is what lets non-administrators perform privileged tasks.
      fr: Avec un compte virtuel run-as, les commandes ne s'exécutent pas sous l'identité de l'utilisateur qui se connecte ; c'est ce qui permet à des non-administrateurs d'effectuer des tâches privilégiées.
    c:
      en: The virtual account is limited to specific groups only when RunAsVirtualAccountGroups lists them.
      fr: Le compte virtuel n'est limité à des groupes précis que lorsque RunAsVirtualAccountGroups les liste.
    d:
      en: Remote Management Users allows users to connect through WinRM; it isn't the group of the JEA run-as account.
      fr: Remote Management Users permet aux utilisateurs de se connecter via WinRM ; ce n'est pas le groupe du compte run-as JEA.
references:
  - title: JEA Session Configurations
    url: https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/jea/session-configurations
