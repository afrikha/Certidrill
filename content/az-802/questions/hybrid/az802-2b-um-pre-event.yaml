id: az802-2b-um-pre-event
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys patches its Azure Arc-enabled application servers by using a maintenance configuration named **MC-App** in Azure Update Manager. The company has two Azure Automation runbooks: one stops the application service on the servers and one starts it again.

    You need the first runbook to run automatically before each scheduled maintenance of MC-App and the second runbook to run after the updates are installed.

    What should you configure?
  fr: |
    Wingtip Toys met à jour ses serveurs d'applications activés pour Azure Arc à l'aide d'une configuration de maintenance nommée **MC-App** dans le Gestionnaire de mise à jour Azure. L'entreprise dispose de deux runbooks Azure Automation : l'un arrête le service applicatif sur les serveurs et l'autre le redémarre.

    Le premier runbook doit s'exécuter automatiquement avant chaque maintenance planifiée de MC-App et le second après l'installation des mises à jour.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Pre and post events on MC-App that call webhooks of the two runbooks", fr: "Des événements pré et post sur MC-App qui appellent des webhooks des deux runbooks" } }
    - { id: b, text: { en: "Two Automation schedules that start the runbooks before and after the maintenance window", fr: "Deux planifications Automation qui démarrent les runbooks avant et après la fenêtre de maintenance" } }
    - { id: c, text: { en: "Pre-scripts and post-scripts in an update deployment of Automation Update Management", fr: "Des pré-scripts et post-scripts dans un déploiement de mises à jour d'Automation Update Management" } }
    - { id: d, text: { en: "A machine configuration assignment that stops the service during the maintenance window", fr: "Une attribution de configuration de machine qui arrête le service pendant la fenêtre de maintenance" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Update Manager uses Event Grid to create pre and post events on a scheduled maintenance configuration. An event subscription can use a webhook handler linked to an Automation runbook; the pre-event runs before the maintenance window and the post-event runs immediately after the updates are installed. This works for Azure Arc-enabled servers.
    fr: |
      Le Gestionnaire de mise à jour utilise Event Grid pour créer des événements pré et post sur une configuration de maintenance planifiée. Un abonnement aux événements peut utiliser un gestionnaire webhook lié à un runbook Automation ; l'événement pré s'exécute avant la fenêtre de maintenance et l'événement post juste après l'installation des mises à jour. Cela fonctionne pour les serveurs activés pour Azure Arc.
  options:
    b: { en: "Independent schedules aren't tied to the maintenance run: the start runbook can't wait for the updates to finish.", fr: "Des planifications indépendantes ne sont pas liées à l'exécution de la maintenance : le runbook de redémarrage ne peut pas attendre la fin des mises à jour." }
    c: { en: "Automation Update Management is retired and replaced by Azure Update Manager.", fr: "Automation Update Management est mis hors service et remplacé par le Gestionnaire de mise à jour Azure." }
    d: { en: "Machine configuration enforces settings continuously; it can't run actions around a maintenance window.", fr: "La configuration de machine impose des paramètres en continu ; elle ne peut pas exécuter d'actions autour d'une fenêtre de maintenance." }
references:
  - title: An Overview of Pre and Post Events in your Azure Update Manager
    url: https://learn.microsoft.com/en-us/azure/update-manager/pre-post-scripts-overview
