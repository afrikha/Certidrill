id: az802-2a-rbcd-winrm-hop
objective: "2.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. has an AD DS domain named **fabrikam.com** that contains a computer named **Client1** and two member servers named **SRV1** and **SRV2**. All the servers run Windows Server 2025. A user named **Admin1** is an administrator of SRV1 and SRV2.

    An administrator who has permissions to modify computer objects in the domain runs the following commands, and then waits 15 minutes:

    ```powershell
    $SRV1 = Get-ADComputer -Identity SRV1
    Set-ADComputer -Identity SRV2 -PrincipalsAllowedToDelegateToAccount $SRV1
    ```

    From Client1, Admin1 runs `Enter-PSSession -ComputerName SRV1`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose d'un domaine AD DS nommé **fabrikam.com** qui contient un ordinateur nommé **Client1** et deux serveurs membres nommés **SRV1** et **SRV2**. Tous les serveurs exécutent Windows Server 2025. Un utilisateur nommé **Admin1** est administrateur de SRV1 et de SRV2.

    Un administrateur qui dispose des autorisations de modifier les objets ordinateur du domaine exécute les commandes suivantes, puis attend 15 minutes :

    ```powershell
    $SRV1 = Get-ADComputer -Identity SRV1
    Set-ADComputer -Identity SRV2 -PrincipalsAllowedToDelegateToAccount $SRV1
    ```

    À partir de Client1, Admin1 exécute `Enter-PSSession -ComputerName SRV1`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In the session on SRV1, Admin1 can run `Enter-PSSession -ComputerName SRV2` to open a nested remote session on SRV2.
        fr: Dans la session sur SRV1, Admin1 peut exécuter `Enter-PSSession -ComputerName SRV2` pour ouvrir une session à distance imbriquée sur SRV2.
    - id: s2
      text:
        en: If SRV1 were in another domain of a trusted forest, the same delegation method could be configured on SRV2.
        fr: Si SRV1 se trouvait dans un autre domaine d'une forêt approuvée, la même méthode de délégation pourrait être configurée sur SRV2.
    - id: s3
      text:
        en: Running the `Set-ADComputer` command required membership in the Domain Admins group.
        fr: L'exécution de la commande `Set-ADComputer` a nécessité l'appartenance au groupe Domain Admins.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The command configures resource-based Kerberos constrained delegation on SRV2, the resource, so that SRV1 can delegate to it. This method works across domains and forests (use the Server parameter to query the other domain) and needs rights to update objects and SPNs, not Domain Admins. It doesn't support the second hop for WinRM, so a nested PowerShell remoting session from SRV1 to SRV2 still fails, even though access to resources such as file shares works.
    fr: |
      La commande configure la délégation Kerberos contrainte basée sur les ressources sur SRV2, la ressource, pour que SRV1 puisse déléguer vers lui. Cette méthode fonctionne entre domaines et entre forêts (utilisez le paramètre Server pour interroger l'autre domaine) et demande les droits de mettre à jour les objets et les SPN, pas Domain Admins. Elle ne prend pas en charge le second saut pour WinRM : une session de communication à distance PowerShell imbriquée de SRV1 vers SRV2 échoue donc toujours, même si l'accès à des ressources comme des partages de fichiers fonctionne.
references:
  - title: Making the second hop in PowerShell Remoting
    url: https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/ps-remoting-second-hop
