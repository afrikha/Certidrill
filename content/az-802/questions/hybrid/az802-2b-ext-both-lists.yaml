id: az802-2b-ext-both-lists
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. has an Azure Arc-enabled server named **SRV2** that runs Windows Server 2025. The Azure Key Vault extension for Windows was installed on SRV2 last month. Yesterday, a local administrator ran the following commands on SRV2:

    ```powershell
    azcmagent config set extensions.allowlist "Microsoft.Azure.Monitor/AzureMonitorWindowsAgent,Microsoft.Compute/CustomScriptExtension"
    azcmagent config set extensions.blocklist "Microsoft.Compute/CustomScriptExtension"
    ```

    Today, a user who has the Owner role on the subscription performs operations on SRV2 from the Azure portal.

    Which operation succeeds?
  fr: |
    Fabrikam, Inc. dispose d'un serveur activé pour Azure Arc nommé **SRV2** qui exécute Windows Server 2025. L'extension Azure Key Vault pour Windows a été installée sur SRV2 le mois dernier. Hier, un administrateur local a exécuté les commandes suivantes sur SRV2 :

    ```powershell
    azcmagent config set extensions.allowlist "Microsoft.Azure.Monitor/AzureMonitorWindowsAgent,Microsoft.Compute/CustomScriptExtension"
    azcmagent config set extensions.blocklist "Microsoft.Compute/CustomScriptExtension"
    ```

    Aujourd'hui, un utilisateur qui dispose du rôle Owner sur l'abonnement effectue des opérations sur SRV2 depuis le portail Azure.

    Quelle opération réussit ?
body:
  options:
    - { id: a, text: { en: "Installing the Custom Script Extension", fr: "L'installation de l'extension de script personnalisé" } }
    - { id: b, text: { en: "Installing the Dependency agent extension", fr: "L'installation de l'extension de l'agent Dependency" } }
    - { id: c, text: { en: "Removing the Azure Key Vault extension", fr: "La suppression de l'extension Azure Key Vault" } }
    - { id: d, text: { en: "Installing the Microsoft Defender for Endpoint extension", fr: "L'installation de l'extension Microsoft Defender for Endpoint" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Delete requests are always accepted, so an extension installed before the lists were configured can be removed. When an allowlist exists, any extension that isn't on it is blocked, and an extension that is on both the allowlist and the blocklist is blocked too. These local rules apply even to an Owner, because they can't be changed from Azure.
    fr: |
      Les demandes de suppression sont toujours acceptées : une extension installée avant la configuration des listes peut donc être supprimée. Quand une liste d'autorisation existe, toute extension qui n'y figure pas est bloquée, et une extension présente à la fois dans la liste d'autorisation et dans la liste de blocage est bloquée elle aussi. Ces règles locales s'appliquent même à un Owner, car elles ne peuvent pas être modifiées depuis Azure.
  options:
    a: { en: "The Custom Script Extension is in both lists, and the block list wins.", fr: "L'extension de script personnalisé figure dans les deux listes, et la liste de blocage l'emporte." }
    b: { en: "The Dependency agent isn't on the allowlist, so its installation is blocked.", fr: "L'agent Dependency ne figure pas dans la liste d'autorisation : son installation est bloquée." }
    d: { en: "MDE.Windows isn't on the allowlist, so its installation is blocked, whoever requests it.", fr: "MDE.Windows ne figure pas dans la liste d'autorisation : son installation est bloquée, quel que soit le demandeur." }
references:
  - title: Extensions security for Azure Arc-enabled servers
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/security-extensions
