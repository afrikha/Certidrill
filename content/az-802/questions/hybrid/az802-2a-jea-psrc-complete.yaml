id: az802-2a-jea-psrc-complete
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a print server named **PRN1** that runs Windows Server 2025. You are creating a JEA role capability file named **PrintOps.psrc** for the operators of PRN1. A module named **ContosoJEA** already exists in `C:\Program Files\WindowsPowerShell\Modules`.

    The role must meet the following requirements:

    - Operators can run `Restart-Service` only for the service named **Spooler**.
    - Operators can run `C:\Windows\System32\whoami.exe`.
    - JEA must find the role capability when a session configuration references the role **PrintOps**.

    How should you complete the file and its location? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un serveur d'impression nommé **PRN1** qui exécute Windows Server 2025. Vous créez un fichier de capacité de rôle JEA nommé **PrintOps.psrc** pour les opérateurs de PRN1. Un module nommé **ContosoJEA** existe déjà dans `C:\Program Files\WindowsPowerShell\Modules`.

    Le rôle doit satisfaire les exigences suivantes :

    - les opérateurs peuvent exécuter `Restart-Service` uniquement pour le service nommé **Spooler** ;
    - les opérateurs peuvent exécuter `C:\Windows\System32\whoami.exe` ;
    - JEA doit trouver la capacité de rôle lorsqu'une configuration de session référence le rôle **PrintOps**.

    Comment devez-vous compléter le fichier et son emplacement ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    # File: C:\Program Files\WindowsPowerShell\Modules\ContosoJEA\[[folder]]\PrintOps.psrc
    @{
        VisibleCmdlets = @{
            Name       = 'Restart-Service'
            Parameters = @{ Name = 'Name'; [[val]] = 'Spooler' }
        }
        [[ext]] = 'C:\Windows\System32\whoami.exe'
    }
  slots:
    - id: folder
      options:
        - { id: rolecap, text: RoleCapabilities }
        - { id: roledef, text: RoleDefinitions }
        - { id: sesscfg, text: SessionConfigurations }
        - { id: scripts, text: Scripts }
    - id: val
      options:
        - { id: vset, text: ValidateSet }
        - { id: vrange, text: ValidateRange }
        - { id: vlength, text: ValidateLength }
        - { id: mandatory, text: Mandatory }
    - id: ext
      options:
        - { id: visext, text: VisibleExternalCommands }
        - { id: visprov, text: VisibleProviders }
        - { id: visfunc, text: VisibleFunctions }
        - { id: visalias, text: VisibleAliases }
answer:
  values: { folder: rolecap, val: vset, ext: visext }
explanation:
  correct:
    en: |
      JEA searches the paths of `$env:PSModulePath` for modules that contain a `RoleCapabilities` folder, and the role name is the base name of the .psrc file. In VisibleCmdlets, a parameter entry can restrict values with `ValidateSet`. Executables are exposed with `VisibleExternalCommands` and their full path.
    fr: |
      JEA parcourt les chemins de `$env:PSModulePath` à la recherche de modules qui contiennent un dossier `RoleCapabilities`, et le nom du rôle est le nom de base du fichier .psrc. Dans VisibleCmdlets, une entrée de paramètre peut restreindre les valeurs avec `ValidateSet`. Les exécutables s'exposent avec `VisibleExternalCommands` et leur chemin complet.
  options:
    roledef: { en: "RoleDefinitions is a key of the session configuration file that maps users to roles, not a module folder.", fr: "RoleDefinitions est une clé du fichier de configuration de session qui associe les utilisateurs aux rôles, pas un dossier de module." }
    vrange: { en: "JEA parameter entries support ValidateSet and ValidatePattern; ValidateRange isn't one of them.", fr: "Les entrées de paramètre JEA prennent en charge ValidateSet et ValidatePattern ; ValidateRange n'en fait pas partie." }
    visprov: { en: "VisibleProviders exposes PowerShell providers such as Registry, not executables.", fr: "VisibleProviders expose des fournisseurs PowerShell comme Registry, pas des exécutables." }
    visfunc: { en: "VisibleFunctions exposes PowerShell functions, not external programs.", fr: "VisibleFunctions expose des fonctions PowerShell, pas des programmes externes." }
references:
  - title: JEA Role Capabilities
    url: https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/jea/role-capabilities
