id: az802-2a-arc-gpo-onboard-order
objective: "2.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has an AD DS domain named **fabrikam.com**. An organizational unit (OU) named **Servers-Arc** contains 200 member servers that run Windows Server 2019 and Windows Server 2022. The servers meet the Azure Arc network requirements.

    You plan to onboard the servers to Azure Arc by using Group Policy. A remote share named **\\FS1\AzureArcOnBoard** already has the required permissions and contains the Azure Connected Machine agent Windows Installer package and the ArcEnabledServersGroupPolicy scripts.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam, Inc. dispose d'un domaine AD DS nommé **fabrikam.com**. Une unité d'organisation (UO) nommée **Servers-Arc** contient 200 serveurs membres qui exécutent Windows Server 2019 et Windows Server 2022. Les serveurs respectent la configuration réseau requise par Azure Arc.

    Vous prévoyez d'intégrer les serveurs à Azure Arc à l'aide de la stratégie de groupe. Un partage distant nommé **\\FS1\AzureArcOnBoard** dispose déjà des autorisations nécessaires et contient le package Windows Installer de l'agent Azure Connected Machine ainsi que les scripts ArcEnabledServersGroupPolicy.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: sp, text: { en: "Create a service principal that has the Azure Connected Machine Onboarding role on the target resource group.", fr: "Créer un principal de service qui a le rôle Azure Connected Machine Onboarding sur le groupe de ressources cible." } }
    - { id: deploy, text: { en: "On a domain controller, run DeployGPO.ps1 with the ID and secret of the service principal.", fr: "Sur un contrôleur de domaine, exécuter DeployGPO.ps1 avec l'ID et le secret du principal de service." } }
    - { id: link, text: { en: "Link the [MSFT] Azure Arc Servers GPO to the Servers-Arc OU.", fr: "Lier le GPO [MSFT] Azure Arc Servers à l'UO Servers-Arc." } }
    - { id: disable, text: { en: "After the servers appear in Azure Arc, disable the GPO.", fr: "Une fois les serveurs visibles dans Azure Arc, désactiver le GPO." } }
    - { id: spadmin, text: { en: "Create a service principal that has the Azure Connected Machine Resource Administrator role on the target resource group.", fr: "Créer un principal de service qui a le rôle Azure Connected Machine Resource Administrator sur le groupe de ressources cible." } }
    - { id: interactive, text: { en: "Run azcmagent connect interactively on each server.", fr: "Exécuter azcmagent connect de manière interactive sur chaque serveur." } }
    - { id: loopback, text: { en: "Enable loopback processing in the GPO.", fr: "Activer le traitement par bouclage dans le GPO." } }
answer:
  sequence: [ sp, deploy, link, disable ]
explanation:
  correct:
    en: |
      The GPO uses a service principal with the Azure Connected Machine Onboarding role, whose ID and secret are passed to DeployGPO.ps1. The script, run on a domain controller, creates the [MSFT] Azure Arc Servers GPO with a scheduled task that onboards the machines. You link the GPO to the OU, and once the servers are connected, you disable it so that the task doesn't run again at restart or policy refresh.
    fr: |
      Le GPO utilise un principal de service doté du rôle Azure Connected Machine Onboarding, dont l'ID et le secret sont passés à DeployGPO.ps1. Le script, exécuté sur un contrôleur de domaine, crée le GPO [MSFT] Azure Arc Servers avec une tâche planifiée qui intègre les machines. Vous liez le GPO à l'UO, puis, une fois les serveurs connectés, vous le désactivez pour que la tâche ne s'exécute plus au redémarrage ou à l'actualisation de la stratégie.
  options:
    spadmin: { en: "Onboarding needs only the Azure Connected Machine Onboarding role; Resource Administrator grants more than required.", fr: "L'intégration ne demande que le rôle Azure Connected Machine Onboarding ; Resource Administrator accorde plus que nécessaire." }
    interactive: { en: "Interactive connection on each of 200 servers is what the Group Policy method avoids.", fr: "La connexion interactive sur chacun des 200 serveurs est précisément ce que la méthode par stratégie de groupe évite." }
    loopback: { en: "The GPO targets computers through a scheduled task; loopback processing concerns user settings and isn't required.", fr: "Le GPO cible des ordinateurs par une tâche planifiée ; le traitement par bouclage concerne les paramètres utilisateur et n'est pas nécessaire." }
references:
  - title: Connect machines at scale using Group Policy with a PowerShell script
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/onboard-group-policy-powershell
