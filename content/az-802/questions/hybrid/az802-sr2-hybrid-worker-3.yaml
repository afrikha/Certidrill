id: az802-sr2-hybrid-worker-3
objective: "2.2.5"
type: series_yesno
series: az802-sr2-hybrid-worker
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You onboard FS1 to Azure Arc, add it to an extension-based Hybrid Runbook Worker group and schedule the runbook on that group.
  fr: |
    Vous intégrez FS1 à Azure Arc, l'ajoutez à un groupe de Runbook Workers hybrides basé sur une extension et planifiez le runbook sur ce groupe.
body:
  solution:
    en: |
      You install the Azure Connected Machine agent on FS1 to make it an Azure Arc-enabled server. In Auto1, you create a hybrid worker group named **HWG1** and add FS1 to it, which deploys the **HybridWorkerForWindows** extension. You link a daily schedule at 01:00 to Clear-Staging and set **Run on** to **Hybrid Worker** with HWG1 selected.
    fr: |
      Vous installez l'agent Azure Connected Machine sur FS1 pour en faire un serveur activé pour Azure Arc. Dans Auto1, vous créez un groupe de Workers hybrides nommé **HWG1** et vous y ajoutez FS1, ce qui déploie l'extension **HybridWorkerForWindows**. Vous liez une planification quotidienne à 01:00 à Clear-Staging et définissez **Run on** sur **Hybrid Worker** en sélectionnant HWG1.
answer: { value: true }
explanation:
  correct:
    en: |
      A runbook started on a Hybrid Runbook Worker group runs on a worker of the group, so Clear-Staging runs locally on FS1 (as Local System by default) and can delete files in D:\Staging. Non-Azure machines need the Connected Machine agent for the extension-based worker, and the worker only needs outbound HTTPS (port 443) to Azure Automation, which the firewall allows.
    fr: |
      Un runbook démarré sur un groupe de Runbook Workers hybrides s'exécute sur un Worker du groupe : Clear-Staging s'exécute donc localement sur FS1 (en tant que Système local par défaut) et peut supprimer les fichiers de D:\Staging. Les machines non Azure ont besoin de l'agent Connected Machine pour le Worker basé sur une extension, et le Worker n'a besoin que du HTTPS sortant (port 443) vers Azure Automation, que le pare-feu autorise.
references:
  - title: Deploy an extension-based Windows or Linux User Hybrid Runbook Worker in Azure Automation
    url: https://learn.microsoft.com/en-us/azure/automation/extension-based-hybrid-runbook-worker-install
  - title: Run Azure Automation Runbooks on a Hybrid Runbook Worker
