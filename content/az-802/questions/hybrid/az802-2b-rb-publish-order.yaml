id: az802-2b-rb-publish-order
objective: "2.2.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. has an Azure Automation account named **AA-Ops** that has a system-assigned managed identity with the required Azure roles. An administrator gives you a PowerShell script named `Remove-OldSnapshots.ps1` that deletes old disk snapshots in Azure.

    You need the script to run automatically every Sunday at 02:00 as a runbook in AA-Ops. You must verify that the script works before it runs on its schedule.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam, Inc. dispose d'un compte Azure Automation nommé **AA-Ops** doté d'une identité managée affectée par le système qui possède les rôles Azure nécessaires. Un administrateur vous remet un script PowerShell nommé `Remove-OldSnapshots.ps1` qui supprime les anciens instantanés de disque dans Azure.

    Le script doit s'exécuter automatiquement chaque dimanche à 02 h 00 en tant que runbook dans AA-Ops. Vous devez vérifier que le script fonctionne avant qu'il s'exécute selon sa planification.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: import, text: { en: "Import the script as a PowerShell runbook with runtime version 7.4.", fr: "Importer le script en tant que runbook PowerShell avec la version de runtime 7.4." } }
    - { id: test, text: { en: "Start the draft runbook in the Test pane and review its output.", fr: "Démarrer le runbook brouillon dans le volet Test et examiner sa sortie." } }
    - { id: publish, text: { en: "Publish the runbook.", fr: "Publier le runbook." } }
    - { id: schedule, text: { en: "Create a weekly schedule and link it to the runbook.", fr: "Créer une planification hebdomadaire et la lier au runbook." } }
    - { id: webhook, text: { en: "Create a webhook for the runbook.", fr: "Créer un webhook pour le runbook." } }
    - { id: hrw, text: { en: "Create a Hybrid Runbook Worker group in AA-Ops.", fr: "Créer un groupe Hybrid Runbook Worker dans AA-Ops." } }
answer:
  sequence: [ import, test, publish, schedule ]
explanation:
  correct:
    en: |
      An imported runbook starts as a draft, which you can run from the Test pane to check its output without affecting the published version. Only a published runbook can be started by a schedule, so you publish it before you link the weekly schedule.
    fr: |
      Un runbook importé commence à l'état de brouillon, que vous pouvez exécuter depuis le volet Test pour vérifier sa sortie sans toucher à la version publiée. Seul un runbook publié peut être démarré par une planification : vous le publiez donc avant de lier la planification hebdomadaire.
  options:
    webhook: { en: "A webhook lets an external system start the runbook over HTTPS; a schedule is what runs it every Sunday.", fr: "Un webhook permet à un système externe de démarrer le runbook en HTTPS ; c'est une planification qui l'exécute chaque dimanche." }
    hrw: { en: "The script manages Azure resources, so it can run in the Azure sandbox; no Hybrid Runbook Worker is needed.", fr: "Le script gère des ressources Azure : il peut s'exécuter dans le bac à sable Azure, sans Hybrid Runbook Worker." }
references:
  - title: Azure Automation Runbook Types
    url: https://learn.microsoft.com/en-us/azure/automation/automation-runbook-types
  - title: Start an Azure Automation Runbook from a Webhook
    url: https://learn.microsoft.com/en-us/azure/automation/automation-webhooks
