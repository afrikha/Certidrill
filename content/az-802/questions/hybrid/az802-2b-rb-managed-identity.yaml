id: az802-2b-rb-managed-identity
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. has an Azure Automation account named **AA1** and a resource group named **RG-Dev** that contains test virtual machines. You create a PowerShell runbook in AA1 that stops the virtual machines in RG-Dev every evening.

    You need to configure how the runbook authenticates to Azure. The solution must not store any password, secret or certificate, and must follow the principle of least privilege.

    What should you do?
  fr: |
    Proseware, Inc. dispose d'un compte Azure Automation nommé **AA1** et d'un groupe de ressources nommé **RG-Dev** qui contient des machines virtuelles de test. Vous créez dans AA1 un runbook PowerShell qui arrête chaque soir les machines virtuelles de RG-Dev.

    Vous devez configurer la façon dont le runbook s'authentifie auprès d'Azure. La solution ne doit stocker aucun mot de passe, secret ni certificat, et doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a Run As account in AA1 and assign it the Contributor role on the subscription.", fr: "Créer un compte d'identification (Run As) dans AA1 et lui attribuer le rôle Contributor sur l'abonnement." } }
    - { id: b, text: { en: "Store a user's credentials in a credential asset of AA1 and run Connect-AzAccount -Credential.", fr: "Stocker les informations d'identification d'un utilisateur dans une ressource d'informations d'identification d'AA1 et exécuter Connect-AzAccount -Credential." } }
    - { id: c, text: { en: "Enable the system-assigned managed identity of AA1, assign it Virtual Machine Contributor on RG-Dev and run Connect-AzAccount -Identity.", fr: "Activer l'identité managée affectée par le système d'AA1, lui attribuer Virtual Machine Contributor sur RG-Dev et exécuter Connect-AzAccount -Identity." } }
    - { id: d, text: { en: "Create a service principal with a client secret stored in an encrypted variable of AA1 and assign it Virtual Machine Contributor on RG-Dev.", fr: "Créer un principal de service avec une clé secrète client stockée dans une variable chiffrée d'AA1 et lui attribuer Virtual Machine Contributor sur RG-Dev." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A managed identity lets the runbook get tokens from Microsoft Entra ID without any stored secret. You enable the system-assigned identity of the Automation account, grant it only the role it needs on the target scope, and the runbook signs in with `Connect-AzAccount -Identity`. Virtual Machine Contributor on RG-Dev is enough to stop the VMs.
    fr: |
      Une identité managée permet au runbook d'obtenir des jetons auprès de Microsoft Entra ID sans aucun secret stocké. Vous activez l'identité affectée par le système du compte Automation, vous lui accordez uniquement le rôle nécessaire sur l'étendue cible, et le runbook se connecte avec `Connect-AzAccount -Identity`. Virtual Machine Contributor sur RG-Dev suffit pour arrêter les machines virtuelles.
  options:
    a: { en: "Run As accounts are retired and relied on a certificate; Contributor on the subscription also exceeds the need.", fr: "Les comptes d'identification (Run As) sont mis hors service et reposaient sur un certificat ; Contributor sur l'abonnement dépasse aussi le besoin." }
    b: { en: "A credential asset stores a password, which the requirement forbids.", fr: "Une ressource d'informations d'identification stocke un mot de passe, ce que l'exigence interdit." }
    d: { en: "A client secret is a stored secret, even in an encrypted variable.", fr: "Une clé secrète client est un secret stocké, même dans une variable chiffrée." }
references:
  - title: Using a system-assigned managed identity for an Azure Automation account
    url: https://learn.microsoft.com/en-us/azure/automation/enable-managed-identity-for-automation
