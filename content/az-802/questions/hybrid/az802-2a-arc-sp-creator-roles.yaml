id: az802-2a-arc-sp-creator-roles
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft Entra tenant and an Azure subscription named **Sub1**. In the tenant, the user setting that lets users register applications is set to **No**.

    An administrator named **Admin5** must create a service principal for Azure Arc at-scale onboarding by running the following command:

    ```bash
    az ad sp create-for-rbac --name "Arc onboarding" --role "Azure Connected Machine Onboarding" --scopes "/subscriptions/<Sub1-id>"
    ```

    Admin5 currently has the Reader role on Sub1 and no Microsoft Entra role. You need to grant Admin5 the required permissions. The solution must follow the principle of least privilege.

    Which two roles should you assign to Admin5? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un locataire Microsoft Entra et d'un abonnement Azure nommé **Sub1**. Dans le locataire, le paramètre utilisateur qui permet aux utilisateurs d'inscrire des applications est défini sur **Non**.

    Un administrateur nommé **Admin5** doit créer un principal de service pour l'intégration à grande échelle dans Azure Arc en exécutant la commande suivante :

    ```bash
    az ad sp create-for-rbac --name "Arc onboarding" --role "Azure Connected Machine Onboarding" --scopes "/subscriptions/<Sub1-id>"
    ```

    Admin5 dispose actuellement du rôle Reader sur Sub1 et d'aucun rôle Microsoft Entra. Vous devez accorder à Admin5 les autorisations nécessaires. La solution doit respecter le principe du privilège minimum.

    Quels sont les deux rôles à attribuer à Admin5 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Contributor on Sub1", fr: "Contributor sur Sub1" } }
    - { id: b, text: { en: "Cloud Application Administrator in Microsoft Entra ID", fr: "Cloud Application Administrator dans Microsoft Entra ID" } }
    - { id: c, text: { en: "Azure Connected Machine Onboarding on Sub1", fr: "Azure Connected Machine Onboarding sur Sub1" } }
    - { id: d, text: { en: "User Access Administrator on Sub1", fr: "User Access Administrator sur Sub1" } }
    - { id: e, text: { en: "Azure Connected Machine Resource Administrator on Sub1", fr: "Azure Connected Machine Resource Administrator sur Sub1" } }
    - { id: f, text: { en: "Global Reader in Microsoft Entra ID", fr: "Global Reader dans Microsoft Entra ID" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Creating a service principal requires that the tenant lets users register applications; otherwise, the account must be an Application Administrator or a Cloud Application Administrator. Assigning the Azure Connected Machine Onboarding role to the service principal requires the Owner or User Access Administrator role on the subscription, and User Access Administrator is the narrower of the two.
    fr: |
      La création d'un principal de service exige que le locataire autorise les utilisateurs à inscrire des applications ; sinon, le compte doit être Application Administrator ou Cloud Application Administrator. L'attribution du rôle Azure Connected Machine Onboarding au principal de service demande le rôle Owner ou User Access Administrator sur l'abonnement, et User Access Administrator est le plus restreint des deux.
  options:
    a:
      en: Contributor can't assign roles, so it can't give the service principal the onboarding role.
      fr: |
        Contributor ne peut pas attribuer de rôles : il ne peut donc pas donner le rôle d'intégration au principal de service.
    c:
      en: Azure Connected Machine Onboarding is the role the service principal receives; it doesn't let Admin5 create applications or assign roles.
      fr: Azure Connected Machine Onboarding est le rôle que reçoit le principal de service ; il ne permet pas à Admin5 de créer des applications ni d'attribuer des rôles.
    e:
      en: Azure Connected Machine Resource Administrator manages Arc-enabled server resources; it can't assign roles.
      fr: Azure Connected Machine Resource Administrator gère les ressources de serveurs activés pour Arc ; il ne peut pas attribuer de rôles.
    f:
      en: Global Reader is read-only and can't register applications.
      fr: Global Reader est en lecture seule et ne peut pas inscrire d'applications.
references:
  - title: Connect hybrid machines to Azure at scale
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/onboard-service-principal
