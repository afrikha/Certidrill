id: az802-2a-jea-implicit-remoting
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a Hyper-V host named **HV1** that runs Windows Server 2025. A JEA endpoint named **VMOps** on HV1 lets operators run `Get-VM` and `Start-VM`.

    An operator connects by using `Enter-PSSession -ComputerName HV1 -ConfigurationName VMOps`. In the session, the command `$vm = Get-VM -Name SQL01` fails.

    The operator wants to run a script stored on the operator's own computer that uses variables and tab completion. The commands must still run on HV1 through the VMOps endpoint with the same restrictions.

    What should the operator do?
  fr: |
    Contoso, Ltd. dispose d'un hôte Hyper-V nommé **HV1** qui exécute Windows Server 2025. Un point de terminaison JEA nommé **VMOps** sur HV1 permet aux opérateurs d'exécuter `Get-VM` et `Start-VM`.

    Un opérateur se connecte à l'aide de `Enter-PSSession -ComputerName HV1 -ConfigurationName VMOps`. Dans la session, la commande `$vm = Get-VM -Name SQL01` échoue.

    L'opérateur veut exécuter un script stocké sur son propre ordinateur qui utilise des variables et la saisie semi-automatique par tabulation. Les commandes doivent toujours s'exécuter sur HV1 par le point de terminaison VMOps avec les mêmes restrictions.

    Que doit faire l'opérateur ?
body:
  options:
    - { id: b, text: { en: "Ask an administrator to set LanguageMode to FullLanguage in the VMOps session configuration.", fr: "Demander à un administrateur de définir LanguageMode sur FullLanguage dans la configuration de session VMOps." } }
    - { id: a, text: { en: "Create a session with New-PSSession -ConfigurationName VMOps, and then run Import-PSSession.", fr: "Créer une session avec New-PSSession -ConfigurationName VMOps, puis exécuter Import-PSSession." } }
    - { id: c, text: { en: "Connect with Enter-PSSession -VMName SQL01 -ConfigurationName VMOps from HV1.", fr: "Se connecter avec Enter-PSSession -VMName SQL01 -ConfigurationName VMOps depuis HV1." } }
    - { id: d, text: { en: "Ask an administrator to add the operator to the Hyper-V Administrators group on HV1.", fr: "Demander à un administrateur d'ajouter l'opérateur au groupe Hyper-V Administrators de HV1." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      JEA sessions run in NoLanguage mode, so variables don't work in an interactive session. Implicit remoting imports the commands of the JEA session as local proxy functions: the operator gets full language mode, variables, tab completion and local scripts, while each command still runs remotely through the endpoint.
    fr: |
      Les sessions JEA s'exécutent en mode NoLanguage : les variables ne fonctionnent pas dans une session interactive. La communication à distance implicite importe les commandes de la session JEA sous forme de fonctions proxy locales : l'opérateur dispose du mode de langage complet, des variables, de la saisie semi-automatique et des scripts locaux, tandis que chaque commande s'exécute toujours à distance par le point de terminaison.
  options:
    b:
      en: FullLanguage in a JEA session lets users escape the restrictions, which breaks the security model of the endpoint.
      fr: Le mode FullLanguage dans une session JEA permet aux utilisateurs de contourner les restrictions, ce qui casse le modèle de sécurité du point de terminaison.
    c:
      en: PowerShell Direct with -VMName connects to the guest operating system of SQL01, not to the VMOps endpoint of HV1.
      fr: PowerShell Direct avec -VMName se connecte au système d'exploitation invité de SQL01, pas au point de terminaison VMOps de HV1.
    d:
      en: Hyper-V Administrators grants direct, unrestricted Hyper-V management instead of the restricted JEA role.
      fr: Hyper-V Administrators accorde une gestion Hyper-V directe et sans restriction au lieu du rôle JEA restreint.
references:
  - title: Using JEA
    url: https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/jea/using-jea
