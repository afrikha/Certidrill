id: az802-2a-ssh-ps-subsystem
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a server named **SRV8** that runs Windows Server 2025 with OpenSSH Server enabled. PowerShell 7 is installed in its default folder on SRV8 and on a computer named **Client1**.

    You need to configure PowerShell remoting over SSH from Client1 to SRV8 with key-based authentication. You will restart sshd after you edit sshd_config.

    How should you complete the configuration and the command? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un serveur nommé **SRV8** qui exécute Windows Server 2025 avec OpenSSH Server activé. PowerShell 7 est installé dans son dossier par défaut sur SRV8 et sur un ordinateur nommé **Client1**.

    Vous devez configurer la communication à distance PowerShell via SSH de Client1 vers SRV8 avec l'authentification par clé. Vous redémarrerez sshd après avoir modifié sshd_config.

    Comment devez-vous compléter la configuration et la commande ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    # C:\ProgramData\ssh\sshd_config on SRV8
    PubkeyAuthentication yes
    [[kw]] powershell [[path]] -sshs

    # On Client1, in PowerShell 7
    Enter-PSSession [[param]] SRV8 -UserName contoso\admin8 -KeyFilePath $HOME\.ssh\id_ed25519
  slots:
    - id: kw
      options:
        - { id: subsystem, text: Subsystem }
        - { id: forcecmd, text: ForceCommand }
        - { id: match, text: Match }
        - { id: allowgroups, text: AllowGroups }
    - id: path
      options:
        - { id: short, text: "c:/progra~1/powershell/7/pwsh.exe" }
        - { id: long, text: "c:/Program Files/PowerShell/7/pwsh.exe" }
        - { id: winps, text: "c:/windows/system32/windowspowershell/v1.0/powershell.exe" }
        - { id: cmd, text: "c:/windows/system32/cmd.exe" }
    - id: param
      options:
        - { id: hostname, text: -HostName }
        - { id: computername, text: -ComputerName }
        - { id: vmname, text: -VMName }
        - { id: uri, text: -ConnectionUri }
answer:
  values: { kw: subsystem, path: short, param: hostname }
explanation:
  correct:
    en: |
      PowerShell remoting over SSH needs a `Subsystem powershell` line in sshd_config that starts pwsh.exe in SSH server mode with `-sshs`. A path that contains spaces must use the 8.3 short name because of an OpenSSH for Windows bug. On the client, the SSH transport is selected with -HostName (with -UserName and -KeyFilePath), whereas -ComputerName uses WinRM.
    fr: |
      La communication à distance PowerShell via SSH demande une ligne `Subsystem powershell` dans sshd_config qui démarre pwsh.exe en mode serveur SSH avec `-sshs`. Un chemin qui contient des espaces doit utiliser le nom court 8.3, à cause d'un bogue d'OpenSSH pour Windows. Sur le client, le transport SSH se sélectionne avec -HostName (avec -UserName et -KeyFilePath), alors que -ComputerName utilise WinRM.
  options:
    long: { en: "Paths with spaces must use the 8.3 short name in the Subsystem line.", fr: "Les chemins avec des espaces doivent utiliser le nom court 8.3 dans la ligne Subsystem." }
    winps: { en: "SSH remoting requires PowerShell 6 or later; Windows PowerShell 5.1 isn't supported.", fr: "La communication à distance via SSH demande PowerShell 6 ou ultérieur ; Windows PowerShell 5.1 n'est pas pris en charge." }
    computername: { en: "-ComputerName connects over WinRM, not SSH.", fr: "-ComputerName se connecte via WinRM, pas via SSH." }
    vmname: { en: "-VMName uses PowerShell Direct to a Hyper-V guest.", fr: "-VMName utilise PowerShell Direct vers un invité Hyper-V." }
references:
  - title: PowerShell remoting over SSH
    url: https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/ssh-remoting-in-powershell
