id: az802-2b-ext-cse-command
objective: "2.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has an on-premises server named **SRV1** that runs Windows Server 2022. SRV1 is onboarded to Azure Arc in a resource group named **RG-Arc** in the West Europe region.

    You need to use Azure PowerShell to run a one-time command on SRV1 that restarts the Windows Time service.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un serveur local nommé **SRV1** qui exécute Windows Server 2022. SRV1 est intégré à Azure Arc dans un groupe de ressources nommé **RG-Arc**, dans la région Europe Ouest.

    Vous devez utiliser Azure PowerShell pour exécuter une seule fois sur SRV1 une commande qui redémarre le service Temps Windows.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $Setting = @{ "commandToExecute" = "powershell.exe -c Restart-Service -Name W32Time" }
    [[cmd]] -Name "custom" -ResourceGroupName "RG-Arc" -MachineName "SRV1" `
        -Location "westeurope" -Publisher "[[pub]]" -ExtensionType [[type]] -Settings $Setting
  slots:
    - id: cmd
      options:
        - { id: setvm, text: Set-AzVMExtension }
        - { id: newarc, text: New-AzConnectedMachineExtension }
        - { id: setcse, text: Set-AzVMCustomScriptExtension }
    - id: pub
      options:
        - { id: hybrid, text: Microsoft.HybridCompute }
        - { id: azext, text: Microsoft.Azure.Extensions }
        - { id: compute, text: Microsoft.Compute }
    - id: type
      options:
        - { id: cse, text: CustomScriptExtension }
        - { id: cslinux, text: CustomScript }
        - { id: runcmd, text: RunCommandHandlerWindows }
answer:
  values: { cmd: newarc, pub: compute, type: cse }
explanation:
  correct:
    en: |
      Extensions on Azure Arc-enabled servers are managed with the Az.ConnectedMachine module, so `New-AzConnectedMachineExtension` deploys the extension and takes `-MachineName`. The Windows Custom Script Extension keeps the same publisher and type as on Azure VMs: `Microsoft.Compute` and `CustomScriptExtension`. Its `commandToExecute` setting runs the command once.
    fr: |
      Les extensions des serveurs activés pour Azure Arc se gèrent avec le module Az.ConnectedMachine : `New-AzConnectedMachineExtension` déploie l'extension et accepte `-MachineName`. L'extension de script personnalisé pour Windows garde le même éditeur et le même type que sur les machines virtuelles Azure : `Microsoft.Compute` et `CustomScriptExtension`. Son paramètre `commandToExecute` exécute la commande une seule fois.
  options:
    setvm: { en: "Set-AzVMExtension targets Azure VMs (Microsoft.Compute/virtualMachines), not Arc-enabled machines.", fr: "Set-AzVMExtension cible les machines virtuelles Azure (Microsoft.Compute/virtualMachines), pas les machines activées pour Azure Arc." }
    setcse: { en: "Set-AzVMCustomScriptExtension also targets Azure VMs only.", fr: "Set-AzVMCustomScriptExtension cible lui aussi uniquement les machines virtuelles Azure." }
    hybrid: { en: "Microsoft.HybridCompute is the resource provider of Arc-enabled servers, not the publisher of the extension.", fr: "Microsoft.HybridCompute est le fournisseur de ressources des serveurs activés pour Azure Arc, pas l'éditeur de l'extension." }
    azext: { en: "Microsoft.Azure.Extensions is the publisher of the Linux Custom Script Extension.", fr: "Microsoft.Azure.Extensions est l'éditeur de l'extension de script personnalisé pour Linux." }
    cslinux: { en: "CustomScript is the type of the Linux version of the extension.", fr: "CustomScript est le type de la version Linux de l'extension." }
    runcmd: { en: "RunCommandHandlerWindows is the Run Command handler, published by Microsoft.CPlat.Core, not the Custom Script Extension.", fr: "RunCommandHandlerWindows est le gestionnaire Run Command, publié par Microsoft.CPlat.Core, pas l'extension de script personnalisé." }
references:
  - title: Enable VM Extensions Using Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/manage-vm-extensions-powershell
  - title: New-AzConnectedMachineExtension (Az.ConnectedMachine)
    url: https://learn.microsoft.com/en-us/powershell/module/az.connectedmachine/new-azconnectedmachineextension
