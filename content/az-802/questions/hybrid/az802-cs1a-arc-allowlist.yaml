id: az802-cs1a-arc-allowlist
objective: "2.2.3"
type: dropdown
caseStudy: az802-cs1a-munsons
difficulty: 3
status: draft
stem:
  en: |
    You need to configure the plant servers to meet the extensions requirement. The Azure Monitor Agent extension is already installed on each plant server.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer les serveurs des usines pour respecter l'exigence relative aux extensions. L'extension Azure Monitor Agent est déjà installée sur chaque serveur d'usine.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template:
    en: |
      # Run from: [[where]]
      azcmagent config set [[list]] "Microsoft.Azure.Monitor/AzureMonitorWindowsAgent"
      azcmagent config set [[gc]] false
    fr: |
      # Exécuter depuis : [[where]]
      azcmagent config set [[list]] "Microsoft.Azure.Monitor/AzureMonitorWindowsAgent"
      azcmagent config set [[gc]] false
  slots:
    - id: where
      options:
        - { id: local, text: { en: "Each plant server, locally", fr: "Chaque serveur d'usine, localement" } }
        - { id: shell, text: { en: "Azure Cloud Shell in Sub-Ops", fr: "Azure Cloud Shell dans Sub-Ops" } }
        - { id: policy, text: { en: "An Azure Policy assignment on RG-Plants", fr: "Une attribution Azure Policy sur RG-Plants" } }
    - id: list
      options:
        - { id: block, text: extensions.blocklist }
        - { id: allow, text: extensions.allowlist }
        - { id: mode, text: config.mode }
    - id: gc
      options:
        - { id: guest, text: guestconfiguration.enabled }
        - { id: ext, text: extensions.enabled }
        - { id: mode2, text: config.mode }
answer:
  values: { where: local, list: allow, gc: guest }
explanation:
  correct:
    en: |
      The extension allow list and block list of the Connected Machine agent are set locally on each server with `azcmagent config set`; they can't be changed from Azure, so even an Owner of the subscription can't override them. An allow list is exclusive: only the listed extensions (publisher/type) can be installed. Setting `guestconfiguration.enabled` to `false` prevents custom guest configuration policies from running.
    fr: |
      La liste d'autorisation et la liste de blocage des extensions de l'agent Connected Machine se définissent localement sur chaque serveur avec `azcmagent config set` ; elles ne peuvent pas être modifiées depuis Azure, si bien que même un propriétaire de l'abonnement ne peut pas les contourner. Une liste d'autorisation est exclusive : seules les extensions listées (éditeur/type) peuvent être installées. Définir `guestconfiguration.enabled` sur `false` empêche l'exécution des stratégies de configuration d'invité personnalisées.
  options:
    shell: { en: "These controls can only be configured by running the command on the server itself.", fr: "Ces contrôles ne peuvent être configurés qu'en exécutant la commande sur le serveur lui-même." }
    policy: { en: "An Azure Policy restriction can be changed or removed by anyone who can modify policy assignments, such as an Owner.", fr: "Une restriction Azure Policy peut être modifiée ou supprimée par toute personne autorisée à modifier les attributions de stratégie, comme un propriétaire (Owner)." }
    block: { en: "A block list would block only the Azure Monitor Agent and allow every other extension.", fr: "Une liste de blocage bloquerait uniquement Azure Monitor Agent et autoriserait toutes les autres extensions." }
    mode: { en: "config.mode takes full or monitor, not an extension name; monitor mode also allows other monitoring and security extensions such as Microsoft Defender for Cloud.", fr: "config.mode prend la valeur full ou monitor, pas un nom d'extension ; le mode monitor autorise aussi d'autres extensions de supervision et de sécurité comme Microsoft Defender for Cloud." }
    ext: { en: "Disabling the extension manager stops extensions hosted by it, including the Azure Monitor Agent.", fr: "Désactiver le gestionnaire d'extensions arrête les extensions qu'il héberge, y compris Azure Monitor Agent." }
    mode2: { en: "config.mode doesn't take true or false; it switches the agent between full and monitor mode.", fr: "config.mode n'accepte pas true ou false ; il bascule l'agent entre les modes full et monitor." }
references:
  - title: Extensions security for Azure Arc-enabled servers
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/security-extensions
