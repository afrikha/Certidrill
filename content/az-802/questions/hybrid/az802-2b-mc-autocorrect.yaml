id: az802-2b-mc-autocorrect
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. has 40 on-premises servers that run Windows Server 2022. All the servers are onboarded to Azure Arc.

    The security team requires a specific registry value on every server. If a local administrator changes the value, it must be set back to the required value automatically, without any action from the operations team.

    What should you use?
  fr: |
    Fabrikam, Inc. dispose de 40 serveurs locaux qui exécutent Windows Server 2022. Tous les serveurs sont intégrés à Azure Arc.

    L'équipe de sécurité exige une valeur de Registre précise sur chaque serveur. Si un administrateur local modifie la valeur, elle doit être rétablie automatiquement à la valeur requise, sans aucune action de l'équipe d'exploitation.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A machine configuration assignment of type ApplyAndMonitor", fr: "Une attribution de configuration de machine de type ApplyAndMonitor" } }
    - { id: b, text: { en: "A machine configuration assignment of type ApplyAndAutoCorrect", fr: "Une attribution de configuration de machine de type ApplyAndAutoCorrect" } }
    - { id: c, text: { en: "The Custom Script Extension with a script that sets the registry value", fr: "L'extension de script personnalisé avec un script qui définit la valeur de Registre" } }
    - { id: d, text: { en: "The Desired State Configuration (DSC) VM extension with a configuration", fr: "L'extension de machine virtuelle Desired State Configuration (DSC) avec une configuration" } }
answer: { optionId: b }
explanation:
  correct:
    en: Machine configuration applies settings inside Arc-enabled servers through the Connected Machine agent. With the ApplyAndAutoCorrect assignment type, the configuration is applied and, if the machine drifts, the local service corrects it at the next evaluation, with no manual remediation.
    fr: La configuration de machine applique des paramètres à l'intérieur des serveurs activés pour Azure Arc par l'intermédiaire de l'agent Connected Machine. Avec le type d'attribution ApplyAndAutoCorrect, la configuration est appliquée et, en cas de dérive, le service local la corrige à l'évaluation suivante, sans correction manuelle.
  options:
    a: { en: "ApplyAndMonitor applies the configuration once and then only reports drift as NonCompliant until a remediation is triggered.", fr: "ApplyAndMonitor applique la configuration une fois, puis signale seulement la dérive comme NonCompliant jusqu'au déclenchement d'une correction." }
    c: { en: "The Custom Script Extension runs a script once; it doesn't detect or correct later changes.", fr: "L'extension de script personnalisé exécute un script une seule fois ; elle ne détecte ni ne corrige les modifications ultérieures." }
    d: { en: "The DSC VM extension is no longer available for Azure Arc-enabled servers; Microsoft recommends machine configuration instead.", fr: "L'extension de machine virtuelle DSC n'est plus disponible pour les serveurs activés pour Azure Arc ; Microsoft recommande la configuration de machine à la place." }
references:
  - title: Remediation options for machine configuration
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/concepts/remediation-options
  - title: VM Extension Management with Azure Arc-Enabled Servers
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/manage-vm-extensions
