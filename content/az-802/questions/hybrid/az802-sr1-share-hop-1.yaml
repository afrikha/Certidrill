id: az802-sr1-share-hop-1
objective: "2.1.2"
type: series_yesno
series: az802-sr1-share-hop
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: You configure resource-based Kerberos constrained delegation on the computer account of Server1.
  fr: Vous configurez la délégation Kerberos contrainte basée sur les ressources sur le compte d'ordinateur de Server1.
body:
  solution:
    en: |
      You run the following command on a computer that has the Active Directory module for Windows PowerShell, and then you run `klist purge -li 0x3e7` on Server1:

      ```powershell
      Set-ADComputer -Identity Server1 -PrincipalsAllowedToDelegateToAccount (Get-ADComputer -Identity FS1)
      ```
    fr: |
      Vous exécutez la commande suivante sur un ordinateur qui dispose du module Active Directory pour Windows PowerShell, puis vous exécutez `klist purge -li 0x3e7` sur Server1 :

      ```powershell
      Set-ADComputer -Identity Server1 -PrincipalsAllowedToDelegateToAccount (Get-ADComputer -Identity FS1)
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      Resource-based Kerberos constrained delegation is configured on the resource server of the second hop, here FS1, and lists the intermediate server allowed to delegate to it. This command does the opposite: it allows FS1 to delegate to Server1, so Server1 still cannot obtain a ticket to FS1 on behalf of Admin1 and the access denied error remains.
    fr: |
      La délégation Kerberos contrainte basée sur les ressources se configure sur le serveur de ressources du second saut, ici FS1, et liste le serveur intermédiaire autorisé à déléguer vers lui. Cette commande fait l'inverse : elle autorise FS1 à déléguer vers Server1. Server1 ne peut donc toujours pas obtenir de ticket vers FS1 pour le compte d'Admin1, et l'erreur d'accès refusé persiste.
references:
  - title: Making the second hop in PowerShell Remoting
    url: https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/ps-remoting-second-hop
