id: az802-2a-arc-requirements-facts
objective: "2.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has an Azure subscription named **Sub1** and the servers shown in the following table.

    | Name | Operating system | Location |
    | --- | --- | --- |
    | SRV21 | Windows Server 2019 | On-premises Hyper-V host |
    | VM-AZ1 | Windows Server 2022 | Azure virtual machine in Sub1 |

    You plan to manage the servers by using Azure Arc-enabled servers.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un abonnement Azure nommé **Sub1** et des serveurs présentés dans le tableau suivant.

    | Nom | Système d'exploitation | Emplacement |
    | --- | --- | --- |
    | SRV21 | Windows Server 2019 | Hôte Hyper-V local |
    | VM-AZ1 | Windows Server 2022 | Machine virtuelle Azure dans Sub1 |

    Vous prévoyez de gérer les serveurs à l'aide des serveurs activés pour Azure Arc.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can install the Azure Connected Machine agent on VM-AZ1 to manage it in production the same way as SRV21.
        fr: Vous pouvez installer l'agent Azure Connected Machine sur VM-AZ1 pour le gérer en production de la même manière que SRV21.
    - id: s2
      text:
        en: The Microsoft.HybridCompute, Microsoft.GuestConfiguration and Microsoft.HybridConnectivity resource providers must be registered in Sub1.
        fr: Les fournisseurs de ressources Microsoft.HybridCompute, Microsoft.GuestConfiguration et Microsoft.HybridConnectivity doivent être inscrits dans Sub1.
    - id: s3
      text:
        en: The firewall in front of SRV21 must allow inbound TCP 443 from Azure to SRV21.
        fr: Le pare-feu situé devant SRV21 doit autoriser le trafic TCP 443 entrant depuis Azure vers SRV21.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The Connected Machine agent isn't installed on Azure VMs, which already have similar capabilities; the installation script detects an Azure VM and rolls back, and an Azure VM can only simulate an on-premises server for testing. Microsoft.HybridCompute, Microsoft.GuestConfiguration and Microsoft.HybridConnectivity must be registered in the subscription. The agent communicates outbound only, over TCP 443.
    fr: |
      L'agent Connected Machine ne s'installe pas sur les machines virtuelles Azure, qui disposent déjà de fonctionnalités similaires ; le script d'installation détecte une machine virtuelle Azure et annule l'installation, et une machine virtuelle Azure ne peut simuler un serveur local qu'à des fins de test. Microsoft.HybridCompute, Microsoft.GuestConfiguration et Microsoft.HybridConnectivity doivent être inscrits dans l'abonnement. L'agent communique uniquement en sortie, sur le port TCP 443.
references:
  - title: Connected Machine agent prerequisites
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/prerequisites
  - title: Connected Machine Agent Network Requirements
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/network-requirements
