id: az802-2a-jea-update-order
objective: "2.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a server named **SRV4** that runs Windows Server 2025. A JEA endpoint named **HelpDesk** is registered on SRV4 from a session configuration file named **HelpDesk.pssc**.

    You need to give a group named **G-Tier2** the role capability **Tier2** on the HelpDesk endpoint. The Tier2.psrc file is already in the RoleCapabilities folder of a module on SRV4. The solution must minimize the time during which the HelpDesk endpoint is unavailable.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso, Ltd. dispose d'un serveur nommé **SRV4** qui exécute Windows Server 2025. Un point de terminaison JEA nommé **HelpDesk** est inscrit sur SRV4 à partir d'un fichier de configuration de session nommé **HelpDesk.pssc**.

    Vous devez donner à un groupe nommé **G-Tier2** la capacité de rôle **Tier2** sur le point de terminaison HelpDesk. Le fichier Tier2.psrc se trouve déjà dans le dossier RoleCapabilities d'un module sur SRV4. La solution doit réduire au minimum la durée pendant laquelle le point de terminaison HelpDesk est indisponible.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: edit, text: { en: "Create an updated HelpDesk.pssc file that adds G-Tier2 with the Tier2 role to RoleDefinitions.", fr: "Créer un fichier HelpDesk.pssc mis à jour qui ajoute G-Tier2 avec le rôle Tier2 dans RoleDefinitions." } }
    - { id: test, text: { en: "Run Test-PSSessionConfigurationFile on the updated file.", fr: "Exécuter Test-PSSessionConfigurationFile sur le fichier mis à jour." } }
    - { id: unreg, text: { en: "Run Unregister-PSSessionConfiguration -Name HelpDesk.", fr: "Exécuter Unregister-PSSessionConfiguration -Name HelpDesk." } }
    - { id: reg, text: { en: "Run Register-PSSessionConfiguration -Name HelpDesk with the updated file.", fr: "Exécuter Register-PSSessionConfiguration -Name HelpDesk avec le fichier mis à jour." } }
    - { id: winrm, text: { en: "Run Restart-Service WinRM.", fr: "Exécuter Restart-Service WinRM." } }
    - { id: newpsrc, text: { en: "Run New-PSRoleCapabilityFile to create a new HelpDesk file.", fr: "Exécuter New-PSRoleCapabilityFile pour créer un nouveau fichier HelpDesk." } }
    - { id: enable, text: { en: "Run Enable-PSRemoting -Force.", fr: "Exécuter Enable-PSRemoting -Force." } }
answer:
  sequence: [ edit, test, unreg, reg ]
explanation:
  correct:
    en: |
      To change an existing JEA configuration, including role mappings, you unregister it and register it again with the updated file. A session configuration file that fails validation can't be registered, so you test it before removing the working endpoint. Unregistering immediately before registering keeps the outage short; both operations restart WinRM.
    fr: |
      Pour modifier une configuration JEA existante, y compris les associations de rôles, vous la désinscrivez puis vous l'inscrivez de nouveau avec le fichier mis à jour. Un fichier de configuration de session qui échoue à la validation ne peut pas être inscrit : vous le testez donc avant de supprimer le point de terminaison opérationnel. Désinscrire juste avant d'inscrire limite l'interruption ; les deux opérations redémarrent WinRM.
  options:
    winrm: { en: "Registering and unregistering already restart WinRM; another restart only interrupts sessions.", fr: "L'inscription et la désinscription redémarrent déjà WinRM ; un redémarrage supplémentaire ne fait qu'interrompre les sessions." }
    newpsrc: { en: "New-PSRoleCapabilityFile creates a .psrc role capability file; role mappings live in the .pssc session configuration file.", fr: "New-PSRoleCapabilityFile crée un fichier de capacité de rôle .psrc ; les associations de rôles se trouvent dans le fichier de configuration de session .pssc." }
    enable: { en: "Remoting is already enabled because the endpoint is registered and in use.", fr: "La communication à distance est déjà activée puisque le point de terminaison est inscrit et utilisé." }
references:
  - title: Registering JEA Configurations
    url: https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/jea/register-jea
  - title: JEA Session Configurations
    url: https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/jea/session-configurations
