id: az802-2b-rb-start-hybrid
objective: "2.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has an Azure Automation account named **AA-Ops** in a resource group named **RG-Ops**. AA-Ops contains a published runbook named **Clear-PrintQueue** that has a parameter named **ServerName**, and an extension-based Hybrid Runbook Worker group named **HRW-Paris** whose members are **HRW1** and **HRW2**.

    You need to run Clear-PrintQueue once, now, against a print server named **PRN1** that is reachable only from the on-premises network. Any available worker of HRW-Paris must be able to take the job.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un compte Azure Automation nommé **AA-Ops** dans un groupe de ressources nommé **RG-Ops**. AA-Ops contient un runbook publié nommé **Clear-PrintQueue**, doté d'un paramètre nommé **ServerName**, ainsi qu'un groupe Hybrid Runbook Worker basé sur une extension nommé **HRW-Paris**, dont les membres sont **HRW1** et **HRW2**.

    Vous devez exécuter Clear-PrintQueue une fois, maintenant, sur un serveur d'impression nommé **PRN1** accessible uniquement depuis le réseau local. N'importe quel worker disponible de HRW-Paris doit pouvoir prendre en charge la tâche.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    [[cmd]] -AutomationAccountName "AA-Ops" -ResourceGroupName "RG-Ops" `
        -Name "Clear-PrintQueue" [[param]] "[[target]]" -Parameters @{ ServerName = "PRN1" }
  slots:
    - id: cmd
      options:
        - { id: start, text: Start-AzAutomationRunbook }
        - { id: register, text: Register-AzAutomationScheduledRunbook }
        - { id: import, text: Import-AzAutomationRunbook }
    - id: param
      options:
        - { id: runon, text: -RunOn }
        - { id: schedname, text: -ScheduleName }
        - { id: maxwait, text: -MaxWaitSeconds }
    - id: target
      options:
        - { id: group, text: HRW-Paris }
        - { id: worker, text: HRW1 }
        - { id: prn, text: PRN1 }
answer:
  values: { cmd: start, param: runon, target: group }
explanation:
  correct:
    en: |
      `Start-AzAutomationRunbook` starts a job immediately, and `-Parameters` passes the runbook's input values. `-RunOn` names the Hybrid Runbook Worker group on which the runbook runs; you target the group, HRW-Paris, and any worker in it can pick up the job. Without `-RunOn`, the job runs in an Azure sandbox, which can't reach PRN1.
    fr: |
      `Start-AzAutomationRunbook` démarre une tâche immédiatement, et `-Parameters` transmet les valeurs d'entrée du runbook. `-RunOn` désigne le groupe Hybrid Runbook Worker sur lequel le runbook s'exécute ; vous ciblez le groupe, HRW-Paris, et n'importe quel worker du groupe peut prendre la tâche. Sans `-RunOn`, la tâche s'exécute dans un bac à sable Azure, qui ne peut pas atteindre PRN1.
  options:
    register: { en: "Register-AzAutomationScheduledRunbook links a runbook to a schedule; it doesn't start a job now.", fr: "Register-AzAutomationScheduledRunbook lie un runbook à une planification ; il ne démarre pas de tâche maintenant." }
    import: { en: "Import-AzAutomationRunbook imports a script into the account; the runbook is already published.", fr: "Import-AzAutomationRunbook importe un script dans le compte ; le runbook est déjà publié." }
    schedname: { en: "-ScheduleName isn't a parameter of Start-AzAutomationRunbook and doesn't select where the job runs.", fr: "-ScheduleName n'est pas un paramètre de Start-AzAutomationRunbook et ne choisit pas où la tâche s'exécute." }
    maxwait: { en: "-MaxWaitSeconds sets how long the cmdlet waits with -Wait; it takes a number, not a target.", fr: "-MaxWaitSeconds définit la durée d'attente du cmdlet avec -Wait ; il attend un nombre, pas une cible." }
    worker: { en: "Jobs are started on a worker group, not on an individual worker; targeting one machine would also remove the failover between workers.", fr: "Les tâches sont démarrées sur un groupe de workers, pas sur un worker précis ; cibler une seule machine supprimerait aussi le basculement entre workers." }
    prn: { en: "PRN1 is the target of the runbook's logic, passed through -Parameters, not a Hybrid Runbook Worker group.", fr: "PRN1 est la cible de la logique du runbook, transmise par -Parameters, pas un groupe Hybrid Runbook Worker." }
references:
  - title: Start-AzAutomationRunbook (Az.Automation)
    url: https://learn.microsoft.com/en-us/powershell/module/az.automation/start-azautomationrunbook
