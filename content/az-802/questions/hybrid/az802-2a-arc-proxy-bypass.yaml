id: az802-2a-arc-proxy-bypass
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. connects on-premises servers to Azure Arc through an Azure Arc private link scope. A private endpoint for the scope is reachable from the on-premises network. Internet access is available only through a proxy server named **proxy1.contoso.com** on port 8080.

    On a server named **SRV20**, you need to configure the Azure Connected Machine agent so that:

    - Microsoft Entra ID and Azure Resource Manager traffic goes through proxy1 to the public endpoints;
    - Azure Arc service traffic skips the proxy and uses the private endpoint.

    How should you complete the commands? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. connecte des serveurs locaux à Azure Arc par une étendue de liaison privée Azure Arc (private link scope). Un point de terminaison privé de l'étendue est accessible depuis le réseau local. L'accès à Internet n'est disponible que par un serveur proxy nommé **proxy1.contoso.com** sur le port 8080.

    Sur un serveur nommé **SRV20**, vous devez configurer l'agent Azure Connected Machine pour que :

    - le trafic Microsoft Entra ID et Azure Resource Manager passe par proxy1 vers les points de terminaison publics ;
    - le trafic du service Azure Arc contourne le proxy et utilise le point de terminaison privé.

    Comment devez-vous compléter les commandes ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    azcmagent config set [[k1]] "http://proxy1.contoso.com:8080"
    azcmagent config set [[k2]] "[[v]]"
  slots:
    - id: k1
      options:
        - { id: url1, text: proxy.url }
        - { id: bypass1, text: proxy.bypass }
        - { id: ports1, text: incomingconnections.ports }
        - { id: allow1, text: extensions.allowlist }
    - id: k2
      options:
        - { id: url2, text: proxy.url }
        - { id: bypass2, text: proxy.bypass }
        - { id: ports2, text: incomingconnections.ports }
        - { id: allow2, text: extensions.allowlist }
    - id: v
      options:
        - { id: arc, text: Arc }
        - { id: aad, text: AAD }
        - { id: arm, text: ARM }
        - { id: aadarm, text: "AAD,ARM" }
answer:
  values: { k1: url1, k2: bypass2, v: arc }
explanation:
  correct:
    en: |
      `proxy.url` sets the agent-specific proxy server. `proxy.bypass` lists the services that must not use that proxy, by service name rather than URL: the value `Arc` covers the Azure Arc endpoints (his.arc.azure.com and guestconfiguration.azure.com), so they reach the private endpoint while Microsoft Entra ID and Azure Resource Manager traffic keeps using the proxy. No service restart is needed after `azcmagent config`.
    fr: |
      `proxy.url` définit le serveur proxy propre à l'agent. `proxy.bypass` liste les services qui ne doivent pas utiliser ce proxy, par nom de service et non par URL : la valeur `Arc` couvre les points de terminaison Azure Arc (his.arc.azure.com et guestconfiguration.azure.com), qui atteignent ainsi le point de terminaison privé, tandis que le trafic Microsoft Entra ID et Azure Resource Manager continue de passer par le proxy. Aucun redémarrage de service n'est nécessaire après `azcmagent config`.
  options:
    aad: { en: "Bypassing AAD would send Microsoft Entra ID traffic around the proxy, the opposite of the requirement.", fr: "Contourner AAD enverrait le trafic Microsoft Entra ID hors du proxy, l'inverse de l'exigence." }
    arm: { en: "Bypassing ARM would send Azure Resource Manager traffic around the proxy.", fr: "Contourner ARM enverrait le trafic Azure Resource Manager hors du proxy." }
    ports1: { en: "incomingconnections.ports allows ports for incoming connections such as Windows Admin Center or SSH through the agent; it isn't a proxy setting.", fr: "incomingconnections.ports autorise des ports pour des connexions entrantes comme Windows Admin Center ou SSH via l'agent ; ce n'est pas un paramètre de proxy." }
    allow1: { en: "extensions.allowlist controls which extensions can be installed.", fr: "extensions.allowlist contrôle les extensions qui peuvent être installées." }
references:
  - title: Manage and maintain Azure Connected Machine agent proxy settings
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/manage-agent-proxy-settings
