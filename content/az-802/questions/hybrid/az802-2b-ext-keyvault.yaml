id: az802-2b-ext-keyvault
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. has an on-premises web server named **WEB1** that runs Windows Server 2022 and IIS. WEB1 is onboarded to Azure Arc. The TLS certificate of the website is stored in an Azure key vault named **kv-proseware** and is renewed in the key vault every 90 days.

    You need WEB1 to install each new version of the certificate in its local certificate store automatically. The solution must not store any secret on WEB1.

    What should you deploy to WEB1?
  fr: |
    Proseware, Inc. dispose d'un serveur web local nommé **WEB1** qui exécute Windows Server 2022 et IIS. WEB1 est intégré à Azure Arc. Le certificat TLS du site web est stocké dans un coffre de clés Azure nommé **kv-proseware** et il est renouvelé dans le coffre de clés tous les 90 jours.

    WEB1 doit installer automatiquement chaque nouvelle version du certificat dans son magasin de certificats local. La solution ne doit stocker aucun secret sur WEB1.

    Que devez-vous déployer sur WEB1 ?
body:
  options:
    - { id: a, text: { en: "The Azure Key Vault extension for Windows", fr: "L'extension Azure Key Vault pour Windows" } }
    - { id: b, text: { en: "The Custom Script Extension with a certificate import script", fr: "L'extension de script personnalisé avec un script d'importation de certificat" } }
    - { id: c, text: { en: "The Windows Admin Center extension", fr: "L'extension Windows Admin Center" } }
    - { id: d, text: { en: "The Azure Monitor Agent extension", fr: "L'extension Azure Monitor Agent" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Key Vault extension (KeyVaultForWindows) polls the key vault for the observed certificates and installs new versions in the local certificate store automatically. On an Arc-enabled server it authenticates with the server's system-assigned managed identity through the local identity endpoint, so no secret is stored on the server; the identity only needs read access to the certificates in the key vault.
    fr: |
      L'extension Key Vault (KeyVaultForWindows) interroge le coffre de clés pour les certificats observés et installe automatiquement les nouvelles versions dans le magasin de certificats local. Sur un serveur activé pour Azure Arc, elle s'authentifie avec l'identité managée affectée par le système du serveur par le point de terminaison d'identité local : aucun secret n'est stocké sur le serveur ; l'identité a seulement besoin d'un accès en lecture aux certificats du coffre de clés.
  options:
    b: { en: "The Custom Script Extension runs a script once; it doesn't track new certificate versions, and the script would need credentials to reach the key vault.", fr: "L'extension de script personnalisé exécute un script une seule fois ; elle ne suit pas les nouvelles versions du certificat, et le script aurait besoin d'informations d'identification pour accéder au coffre de clés." }
    c: { en: "Windows Admin Center lets you manage the server from the Azure portal; it doesn't synchronize certificates.", fr: "Windows Admin Center permet de gérer le serveur depuis le portail Azure ; il ne synchronise pas les certificats." }
    d: { en: "The Azure Monitor Agent collects monitoring data; it doesn't install certificates.", fr: "L'agent Azure Monitor collecte des données de surveillance ; il n'installe pas de certificats." }
references:
  - title: Enable VM Extensions Using Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/manage-vm-extensions-powershell
  - title: VM Extension Management with Azure Arc-Enabled Servers
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/manage-vm-extensions
