id: az802-2a-wac-gateway-access
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a Windows Admin Center gateway installed on a member server named **GW1** that runs Windows Server 2025. Gateway access is controlled by Active Directory groups:

    - The **Users** tab lists a group named **G-WAC-Users**.
    - The **Administrators** tab lists a group named **G-WAC-Admins**.

    Role-based access control isn't applied on any managed server. The domain contains the users shown in the following table.

    | User | Group membership |
    | --- | --- |
    | User1 | G-WAC-Users |
    | User2 | Administrators group of GW1 (not a member of G-WAC-Admins) |
    | User3 | G-WAC-Users, Administrators group of a member server named SRV2 |

    User1 isn't an administrator on any server.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'une passerelle Windows Admin Center installée sur un serveur membre nommé **GW1** qui exécute Windows Server 2025. L'accès à la passerelle est contrôlé par des groupes Active Directory :

    - l'onglet **Users** liste un groupe nommé **G-WAC-Users** ;
    - l'onglet **Administrators** liste un groupe nommé **G-WAC-Admins**.

    Le contrôle d'accès en fonction du rôle n'est appliqué sur aucun serveur géré. Le domaine contient les utilisateurs présentés dans le tableau suivant.

    | Utilisateur | Appartenance aux groupes |
    | --- | --- |
    | User1 | G-WAC-Users |
    | User2 | Groupe Administrators de GW1 (pas membre de G-WAC-Admins) |
    | User3 | G-WAC-Users, groupe Administrators d'un serveur membre nommé SRV2 |

    User1 n'est administrateur d'aucun serveur.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: User1 can sign in to GW1 and manage the services of SRV2 through the gateway.
        fr: User1 peut se connecter à GW1 et gérer les services de SRV2 par l'intermédiaire de la passerelle.
    - id: s2
      text:
        en: User2 can change the Access settings of the gateway on GW1.
        fr: User2 peut modifier les paramètres Access de la passerelle sur GW1.
    - id: s3
      text:
        en: User3 can manage SRV2 through GW1.
        fr: User3 peut gérer SRV2 par l'intermédiaire de GW1.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Gateway access doesn't grant access to the managed servers: User1 can sign in to the gateway, but managing SRV2 needs credentials with administrative rights on SRV2 or a Windows Admin Center RBAC role, and neither applies. Local administrators of the gateway machine are always gateway administrators, so User2 can change the Access settings even without G-WAC-Admins. User3 is a gateway user and an administrator of SRV2, which is enough to manage it.
    fr: |
      L'accès à la passerelle ne donne pas accès aux serveurs gérés : User1 peut se connecter à la passerelle, mais gérer SRV2 demande des informations d'identification disposant de droits d'administration sur SRV2 ou un rôle RBAC de Windows Admin Center, et aucun des deux ne s'applique. Les administrateurs locaux de la machine de passerelle sont toujours administrateurs de la passerelle : User2 peut donc modifier les paramètres Access même sans G-WAC-Admins. User3 est utilisateur de la passerelle et administrateur de SRV2, ce qui suffit pour le gérer.
references:
  - title: Configuring user access control and permissions
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/configure/user-access-control
