id: az802-2a-ps-trustedhosts
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a computer named **Client1** that runs Windows 11 and is joined to the **contoso.com** domain. A server named **WG1** runs Windows Server 2025, belongs to a workgroup, and has the IP address 10.0.0.5. PowerShell remoting is enabled on WG1 with the default HTTP listener.

    On Client1, an administrator runs `Enter-PSSession -ComputerName 10.0.0.5 -Credential WG1\Administrator` and receives an error stating that HTTPS must be used or the destination must be added to the TrustedHosts configuration.

    You need to ensure that the administrator can connect to WG1 over HTTP.

    What should you do?
  fr: |
    Contoso, Ltd. dispose d'un ordinateur nommé **Client1** qui exécute Windows 11 et est joint au domaine **contoso.com**. Un serveur nommé **WG1** exécute Windows Server 2025, appartient à un groupe de travail et a l'adresse IP 10.0.0.5. La communication à distance PowerShell est activée sur WG1 avec l'écouteur HTTP par défaut.

    Sur Client1, un administrateur exécute `Enter-PSSession -ComputerName 10.0.0.5 -Credential WG1\Administrator` et reçoit une erreur indiquant que HTTPS doit être utilisé ou que la destination doit être ajoutée à la configuration TrustedHosts.

    Vous devez faire en sorte que l'administrateur puisse se connecter à WG1 via HTTP.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |-
          On WG1, run `Set-Item WSMan:\localhost\Client\TrustedHosts -Value Client1`.
        fr: |-
          Sur WG1, exécuter `Set-Item WSMan:\localhost\Client\TrustedHosts -Value Client1`.
    - id: b
      text:
        en: |-
          On Client1, run `Enable-WSManCredSSP -Role Client -DelegateComputer 10.0.0.5`.
        fr: |-
          Sur Client1, exécuter `Enable-WSManCredSSP -Role Client -DelegateComputer 10.0.0.5`.
    - id: c
      text:
        en: |-
          On Client1, run `Set-Item WSMan:\localhost\Client\TrustedHosts -Value 10.0.0.5`.
        fr: |-
          Sur Client1, exécuter `Set-Item WSMan:\localhost\Client\TrustedHosts -Value 10.0.0.5`.
    - id: d
      text:
        en: |-
          On WG1, run `Enable-PSRemoting -SkipNetworkProfileCheck -Force`.
        fr: |-
          Sur WG1, exécuter `Enable-PSRemoting -SkipNetworkProfileCheck -Force`.
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kerberos doesn't support IP addresses or computers outside the domain, so the connection uses NTLM. Over HTTP, the client must then list the destination in its own TrustedHosts setting. TrustedHosts is a client-side setting, configured on the computer that starts the connection, and it accepts IP addresses.
    fr: |
      Kerberos ne prend en charge ni les adresses IP ni les ordinateurs hors du domaine : la connexion utilise donc NTLM. Via HTTP, le client doit alors lister la destination dans son propre paramètre TrustedHosts. TrustedHosts est un paramètre côté client, configuré sur l'ordinateur qui démarre la connexion, et il accepte les adresses IP.
  options:
    a:
      en: TrustedHosts must be set on the computer that initiates the connection (Client1), and it must list the destination, not the source.
      fr: TrustedHosts doit être défini sur l'ordinateur qui démarre la connexion (Client1) et doit lister la destination, pas la source.
    b:
      en: CredSSP delegates credentials for a second hop; it doesn't remove the TrustedHosts or HTTPS requirement for NTLM connections.
      fr: CredSSP délègue les informations d'identification pour un second saut ; il ne supprime pas l'exigence TrustedHosts ou HTTPS des connexions NTLM.
    d:
      en: Remoting is already enabled on WG1; the error comes from the client's authentication requirements, not from the listener.
      fr: La communication à distance est déjà activée sur WG1 ; l'erreur vient des exigences d'authentification du client, pas de l'écouteur.
references:
  - title: about_Remote_Troubleshooting
    url: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_remote_troubleshooting
