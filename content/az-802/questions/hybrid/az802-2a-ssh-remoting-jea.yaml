id: az802-2a-ssh-remoting-jea
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a server named **SRV7** that runs Windows Server 2025 and PowerShell 7. OpenSSH Server is enabled on SRV7, and sshd_config contains a `Subsystem powershell` line. Network administrators manage SRV7 from Windows 11 computers that run PowerShell 7 by using `Enter-PSSession -HostName SRV7`.

    You register a JEA endpoint named **NetOps** on SRV7. You need to ensure that when the network administrators manage SRV7 by using PowerShell remoting, they're limited to the commands of the NetOps endpoint.

    What should you do?
  fr: |
    Contoso, Ltd. dispose d'un serveur nommé **SRV7** qui exécute Windows Server 2025 et PowerShell 7. OpenSSH Server est activé sur SRV7, et sshd_config contient une ligne `Subsystem powershell`. Les administrateurs réseau gèrent SRV7 depuis des ordinateurs Windows 11 qui exécutent PowerShell 7, à l'aide de `Enter-PSSession -HostName SRV7`.

    Vous inscrivez un point de terminaison JEA nommé **NetOps** sur SRV7. Vous devez faire en sorte que, lorsque les administrateurs réseau gèrent SRV7 par la communication à distance PowerShell, ils soient limités aux commandes du point de terminaison NetOps.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Have them add -ConfigurationName NetOps to their Enter-PSSession -HostName command.", fr: "Leur faire ajouter -ConfigurationName NetOps à leur commande Enter-PSSession -HostName." } }
    - { id: b, text: { en: "Set the DefaultShell value of OpenSSH on SRV7 to the path of pwsh.exe.", fr: "Définir la valeur DefaultShell d'OpenSSH sur SRV7 sur le chemin de pwsh.exe." } }
    - { id: c, text: { en: "Have them connect with Enter-PSSession -ComputerName SRV7 -ConfigurationName NetOps.", fr: "Leur faire utiliser Enter-PSSession -ComputerName SRV7 -ConfigurationName NetOps." } }
    - { id: d, text: { en: "Add the network administrators to the OpenSSH Users group on SRV7.", fr: "Ajouter les administrateurs réseau au groupe OpenSSH Users de SRV7." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      SSH-based PowerShell remoting doesn't support remote endpoint configuration or JEA. JEA endpoints are WinRM session configurations, so the administrators must connect over WinRM with -ComputerName and select the endpoint with -ConfigurationName.
    fr: |
      La communication à distance PowerShell via SSH ne prend en charge ni la configuration de points de terminaison distants ni JEA. Les points de terminaison JEA sont des configurations de session WinRM : les administrateurs doivent donc se connecter via WinRM avec -ComputerName et sélectionner le point de terminaison avec -ConfigurationName.
  options:
    a:
      en: Over SSH, the session starts from the PowerShell subsystem; remote endpoint configurations such as JEA aren't supported on that transport.
      fr: Via SSH, la session démarre depuis le sous-système PowerShell ; les configurations de points de terminaison distants comme JEA ne sont pas prises en charge sur ce transport.
    b:
      en: DefaultShell only changes the interactive shell of ssh sessions; users keep their full privileges.
      fr: DefaultShell change uniquement le shell interactif des sessions ssh ; les utilisateurs conservent tous leurs privilèges.
    d:
      en: The OpenSSH Users group controls who can connect over SSH, not which commands they can run.
      fr: Le groupe OpenSSH Users contrôle qui peut se connecter via SSH, pas les commandes que les utilisateurs peuvent exécuter.
references:
  - title: PowerShell remoting over SSH
    url: https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/ssh-remoting-in-powershell
