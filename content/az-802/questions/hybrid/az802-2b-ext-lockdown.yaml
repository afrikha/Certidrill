id: az802-2b-ext-lockdown
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has Azure Arc-enabled servers that run Windows Server 2022 in a perimeter network. The Azure Monitor Agent and the Custom Script Extension are installed on each server. The security team wants to restrict which VM extensions can run on these servers.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose de serveurs activés pour Azure Arc qui exécutent Windows Server 2022 dans un réseau de périmètre. L'agent Azure Monitor et l'extension de script personnalisé sont installés sur chaque serveur. L'équipe de sécurité veut restreindre les extensions de machine virtuelle qui peuvent s'exécuter sur ces serveurs.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If you restrict extensions by using an Azure Policy assignment, a user who can modify policy assignments can remove the restriction.
        fr: Si vous restreignez les extensions à l'aide d'une attribution Azure Policy, un utilisateur qui peut modifier les attributions de stratégie peut supprimer la restriction.
    - id: s2
      text:
        en: Setting an allowlist that contains only the Azure Monitor Agent uninstalls the Custom Script Extension from the servers.
        fr: La définition d'une liste d'autorisation qui ne contient que l'agent Azure Monitor désinstalle l'extension de script personnalisé des serveurs.
    - id: s3
      text:
        en: Running `azcmagent config set extensions.enabled false` on a server stops the Azure Monitor Agent from running on that server.
        fr: L'exécution de `azcmagent config set extensions.enabled false` sur un serveur empêche l'agent Azure Monitor de s'exécuter sur ce serveur.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Azure Policy can restrict extensions from the cloud, but anyone with permission to modify policy assignments can override or remove that protection; the local `azcmagent` settings can't be changed from Azure. An allowlist or blocklist doesn't remove extensions that are already installed: you must delete them from Azure. Disabling the extension manager doesn't uninstall extensions, but the extensions it hosts, such as the Azure Monitor Agent, no longer run.
    fr: |
      Azure Policy peut restreindre les extensions depuis le cloud, mais toute personne autorisée à modifier les attributions de stratégie peut contourner ou supprimer cette protection ; les paramètres locaux `azcmagent` ne peuvent pas être modifiés depuis Azure. Une liste d'autorisation ou de blocage ne supprime pas les extensions déjà installées : vous devez les supprimer depuis Azure. La désactivation du gestionnaire d'extensions ne désinstalle pas les extensions, mais celles qu'il héberge, comme l'agent Azure Monitor, ne s'exécutent plus.
references:
  - title: Extensions security for Azure Arc-enabled servers
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/security-extensions
