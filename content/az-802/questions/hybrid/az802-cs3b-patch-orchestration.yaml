id: az802-cs3b-patch-orchestration
objective: "2.2.4"
type: single
caseStudy: az802-cs3b-blue-yonder
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You are preparing the machines for MC-Sat2. For which machines must you set the patch orchestration to Customer Managed Schedules before the schedule can install updates?
  fr: |
    Vous préparez les machines pour MC-Sat2. Pour quelles machines devez-vous définir l'orchestration des correctifs sur Customer Managed Schedules avant que la planification puisse installer des mises à jour ?
body:
  options:
    - { id: a, text: { en: "AZDC1 and AZDC2 only", fr: "AZDC1 et AZDC2 uniquement" } }
    - { id: b, text: { en: "The Arc-enabled servers only", fr: "Les serveurs activés pour Azure Arc uniquement" } }
    - { id: c, text: { en: "AZDC1, AZDC2 and the Arc-enabled servers", fr: "AZDC1, AZDC2 et les serveurs activés pour Azure Arc" } }
    - { id: d, text: { en: "None of the machines", fr: "Aucune des machines" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Scheduled patching requires the patch orchestration of Azure virtual machines to be set to Customer Managed Schedules, so AZDC1 and AZDC2 need this setting. For Azure Arc-enabled machines, this setting is not a requirement, so the on-premises servers can be associated with MC-Sat2 as they are.
    fr: |
      L'application planifiée des correctifs exige que l'orchestration des correctifs des machines virtuelles Azure soit définie sur Customer Managed Schedules : AZDC1 et AZDC2 ont donc besoin de ce paramètre. Pour les machines activées pour Azure Arc, ce paramètre n'est pas obligatoire : les serveurs locaux peuvent donc être associés à MC-Sat2 tels quels.
  options:
    b:
      en: |
        The setting is required for Azure VMs and not for Arc-enabled machines, which is the opposite of this option.
      fr: |
        Le paramètre est obligatoire pour les machines virtuelles Azure et pas pour les machines activées pour Azure Arc, soit l'inverse de cette option.
    c:
      en: |
        Arc-enabled machines do not need the Customer Managed Schedules setting to be patched by a schedule.
      fr: |
        Les machines activées pour Azure Arc n'ont pas besoin du paramètre Customer Managed Schedules pour être corrigées par une planification.
    d:
      en: |
        Without Customer Managed Schedules, the Azure VMs AZDC1 and AZDC2 are not patched by the maintenance configuration.
      fr: |
        Sans Customer Managed Schedules, les machines virtuelles Azure AZDC1 et AZDC2 ne sont pas corrigées par la configuration de maintenance.
references:
  - title: Scheduling Recurring Updates in Azure Update Manager
    url: https://learn.microsoft.com/en-us/azure/update-manager/scheduled-patching
