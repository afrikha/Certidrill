id: az802-2a-arc-cloned-429
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys created a reference virtual machine named **TEMPLATE1** that runs Windows Server 2022 on a Hyper-V host. An administrator installed the Azure Connected Machine agent on TEMPLATE1, ran `azcmagent connect`, and then used TEMPLATE1 as a golden image to create 20 virtual machines.

    The Azure portal shows a single Arc-enabled server resource named TEMPLATE1, and the agents on the 20 virtual machines report 429 errors.

    You need to ensure that each of the 20 virtual machines appears as its own Arc-enabled server.

    What should you do on each virtual machine?
  fr: |
    Tailspin Toys a créé une machine virtuelle de référence nommée **TEMPLATE1** qui exécute Windows Server 2022 sur un hôte Hyper-V. Un administrateur a installé l'agent Azure Connected Machine sur TEMPLATE1, a exécuté `azcmagent connect`, puis a utilisé TEMPLATE1 comme image de référence (golden image) pour créer 20 machines virtuelles.

    Le portail Azure affiche une seule ressource de serveur activé pour Arc nommée TEMPLATE1, et les agents des 20 machines virtuelles signalent des erreurs 429.

    Vous devez faire en sorte que chacune des 20 machines virtuelles apparaisse comme son propre serveur activé pour Arc.

    Que devez-vous faire sur chaque machine virtuelle ?
body:
  options:
    - { id: a, text: { en: "Run azcmagent disconnect without parameters, and then run azcmagent connect.", fr: "Exécuter azcmagent disconnect sans paramètre, puis exécuter azcmagent connect." } }
    - { id: b, text: { en: "Restart the himds service, and then run azcmagent check.", fr: "Redémarrer le service himds, puis exécuter azcmagent check." } }
    - { id: c, text: { en: "Run azcmagent disconnect --force-local-only, and then run azcmagent connect.", fr: "Exécuter azcmagent disconnect --force-local-only, puis exécuter azcmagent connect." } }
    - { id: d, text: { en: "Rename the computer, and then restart the himds service.", fr: "Renommer l'ordinateur, puis redémarrer le service himds." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A machine cloned from a connected golden image keeps the resource information of the image, so all clones send heartbeats to the same Azure resource, which causes 429 errors. Microsoft's fix is to run `azcmagent disconnect --force-local-only` on each clone, which resets the local agent configuration without touching Azure, and then to rerun `azcmagent connect` with a unique resource name.
    fr: |
      Une machine clonée à partir d'une image de référence connectée conserve les informations de ressource de l'image : tous les clones envoient donc leurs pulsations à la même ressource Azure, ce qui provoque des erreurs 429. La correction indiquée par Microsoft consiste à exécuter `azcmagent disconnect --force-local-only` sur chaque clone, ce qui réinitialise la configuration locale de l'agent sans toucher à Azure, puis à exécuter de nouveau `azcmagent connect` avec un nom de ressource unique.
  options:
    a:
      en: Without --force-local-only, disconnect deletes the Azure resource; after the first clone deletes the shared TEMPLATE1 resource, the other clones point to a resource that no longer exists.
      fr: Sans --force-local-only, disconnect supprime la ressource Azure ; une fois que le premier clone a supprimé la ressource TEMPLATE1 partagée, les autres clones pointent vers une ressource qui n'existe plus.
    b:
      en: Restarting himds keeps the same resource identity, and azcmagent check only tests network connectivity to the endpoints.
      fr: Redémarrer himds conserve la même identité de ressource, et azcmagent check ne fait que tester la connectivité réseau vers les points de terminaison.
    d:
      en: The resource information is recorded in the agent configuration, not derived from the computer name, so renaming doesn't create a new resource.
      fr: |
        Les informations de ressource sont enregistrées dans la configuration de l'agent et ne dépendent pas du nom de l'ordinateur : le renommer ne crée pas de nouvelle ressource.
references:
  - title: Overview of the Azure Connected Machine agent
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/agent-overview
