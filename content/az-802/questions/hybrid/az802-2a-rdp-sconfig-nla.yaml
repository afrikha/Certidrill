id: az802-2a-rdp-sconfig-nla
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a server named **SRV9** that runs a Server Core installation of Windows Server 2025. You're signed in to the console of SRV9, and SConfig is open.

    You need to enable Remote Desktop on SRV9. Only clients that support Network Level Authentication (NLA) must be able to connect.

    What should you do in SConfig?
  fr: |
    Contoso, Ltd. dispose d'un serveur nommé **SRV9** qui exécute une installation Server Core de Windows Server 2025. Vous êtes connecté à la console de SRV9, et SConfig est ouvert.

    Vous devez activer le Bureau à distance sur SRV9. Seuls les clients qui prennent en charge l'authentification au niveau du réseau (NLA) doivent pouvoir se connecter.

    Que devez-vous faire dans SConfig ?
body:
  options:
    - { id: a, text: { en: "Select option 4, and then select 1 to enable remote management.", fr: "Sélectionner l'option 4, puis 1 pour activer la gestion à distance." } }
    - { id: b, text: { en: "Select option 7, select E to enable, and then select 2.", fr: "Sélectionner l'option 7, puis E pour activer, puis 2." } }
    - { id: c, text: { en: "Select option 7, select E to enable, and then select 1.", fr: "Sélectionner l'option 7, puis E pour activer, puis 1." } }
    - { id: d, text: { en: "Exit SConfig, and then run Configure-SMRemoting.exe -Enable.", fr: "Quitter SConfig, puis exécuter Configure-SMRemoting.exe -Enable." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Option 7 of SConfig opens the Remote desktop settings. After you type E to enable Remote Desktop, choice 1 allows only clients running Remote Desktop with Network Level Authentication (more secure), and choice 2 allows clients running any version.
    fr: |
      L'option 7 de SConfig ouvre les paramètres du Bureau à distance. Après avoir tapé E pour activer le Bureau à distance, le choix 1 autorise uniquement les clients qui exécutent le Bureau à distance avec l'authentification au niveau du réseau (plus sûr), et le choix 2 autorise les clients de toute version.
  options:
    a:
      en: Option 4 configures remote management (PowerShell remoting, Windows Admin Center, some MMC snap-ins), not Remote Desktop.
      fr: L'option 4 configure la gestion à distance (communication à distance PowerShell, Windows Admin Center, certains composants logiciels enfichables MMC), pas le Bureau à distance.
    b:
      en: Choice 2 also accepts clients that don't use Network Level Authentication.
      fr: Le choix 2 accepte aussi les clients qui n'utilisent pas l'authentification au niveau du réseau.
    d:
      en: Configure-SMRemoting.exe lets Server Manager on another server manage SRV9; it doesn't enable Remote Desktop.
      fr: Configure-SMRemoting.exe permet au Gestionnaire de serveur d'un autre serveur de gérer SRV9 ; il n'active pas le Bureau à distance.
references:
  - title: Configure a Server Core installation of Windows Server and Azure Local with the Server Configuration tool (SConfig)
    url: https://learn.microsoft.com/en-us/windows-server/administration/server-core/server-core-sconfig
