id: az802-3b-avail-domains
objective: "3.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You create an availability set named **AS-Front** with 2 fault domains and 5 update domains. You then deploy seven Azure virtual machines in AS-Front, in order from VM1 to VM7, without stopping any VM between deployments.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un groupe à haute disponibilité nommé **AS-Front** avec 2 domaines d'erreur et 5 domaines de mise à jour. Vous déployez ensuite sept machines virtuelles Azure dans AS-Front, dans l'ordre de VM1 à VM7, sans arrêter de machine virtuelle entre les déploiements.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A failure of the hardware of one fault domain affects at most two of the VMs.", fr: "Une panne du matériel d'un domaine d'erreur touche au plus deux des machines virtuelles." } }
    - { id: b, text: { en: "VM6 is in the same update domain as VM1.", fr: "VM6 se trouve dans le même domaine de mise à jour que VM1." } }
    - { id: c, text: { en: "You can increase the number of update domains of AS-Front to 10 without recreating the VMs.", fr: "Vous pouvez porter le nombre de domaines de mise à jour d'AS-Front à 10 sans recréer les machines virtuelles." } }
    - { id: d, text: { en: "During planned maintenance, at most two of the VMs restart at the same time.", fr: "Pendant une maintenance planifiée, au plus deux des machines virtuelles redémarrent en même temps." } }
    - { id: e, text: { en: "AS-Front keeps at least one VM running if the datacenter that hosts it loses power.", fr: "AS-Front conserve au moins une machine virtuelle en fonctionnement si le centre de données qui l'héberge perd son alimentation." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      With five update domains, the sixth VM is placed in the same update domain as the first and the seventh with the second, so the update domains hold {VM1, VM6}, {VM2, VM7}, {VM3}, {VM4} and {VM5}. Only one update domain restarts at a time during planned maintenance, so at most two VMs restart together.
    fr: |
      Avec cinq domaines de mise à jour, la sixième machine virtuelle est placée dans le même domaine de mise à jour que la première et la septième avec la deuxième : les domaines de mise à jour contiennent {VM1, VM6}, {VM2, VM7}, {VM3}, {VM4} et {VM5}. Un seul domaine de mise à jour redémarre à la fois pendant une maintenance planifiée : au plus deux machines virtuelles redémarrent ensemble.
  options:
    a:
      en: |
        Seven VMs spread across two fault domains put at least four VMs in one of them, so a fault domain failure can affect four VMs.
      fr: |
        Sept machines virtuelles réparties sur deux domaines d'erreur en placent au moins quatre dans l'un d'eux : la panne d'un domaine d'erreur peut toucher quatre machines virtuelles.
    c:
      en: |
        Fault domain and update domain counts can't be changed after the availability set is created.
      fr: |
        Les nombres de domaines d'erreur et de domaines de mise à jour ne peuvent pas être modifiés après la création du groupe à haute disponibilité.
    e:
      en: |
        An availability set protects against failures inside a datacenter; a datacenter-level outage can affect all its fault domains. Availability zones address that risk.
      fr: |
        Un groupe à haute disponibilité protège contre les pannes au sein d'un centre de données ; une panne à l'échelle du centre de données peut toucher tous ses domaines d'erreur. Les zones de disponibilité répondent à ce risque.
references:
  - title: Availability sets overview
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
