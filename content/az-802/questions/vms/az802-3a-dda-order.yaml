id: az802-3a-dda-order
objective: "3.1.6"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have a standalone Hyper-V host named **HV6** that runs Windows Server 2025. HV6 has an NVIDIA data center GPU that is currently used by HV6. The GPU vendor does not provide a device mitigation driver.

    HV6 hosts a virtual machine named **VM20** that runs Windows Server 2025. VM20 is turned off. You already ran `Set-VM -Name VM20 -AutomaticStopAction TurnOff` and configured the MMIO space of VM20. The PCIe location path of the GPU is stored in the variable `$locationPath`.

    You need to give VM20 exclusive, direct access to the GPU by using Discrete Device Assignment.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un hôte Hyper-V autonome nommé **HV6** qui exécute Windows Server 2025. HV6 dispose d'un GPU de centre de données NVIDIA actuellement utilisé par HV6. Le fabricant du GPU ne fournit pas de pilote d'atténuation de l'appareil.

    HV6 héberge une machine virtuelle nommée **VM20** qui exécute Windows Server 2025. VM20 est arrêtée. Vous avez déjà exécuté `Set-VM -Name VM20 -AutomaticStopAction TurnOff` et configuré l'espace MMIO de VM20. Le chemin d'emplacement PCIe du GPU est stocké dans la variable `$locationPath`.

    Vous devez donner à VM20 un accès exclusif et direct au GPU avec l'attribution discrète d'appareil.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: add, text: { en: "Run Add-VMAssignableDevice -LocationPath $locationPath -VMName VM20.", fr: "Exécuter Add-VMAssignableDevice -LocationPath $locationPath -VMName VM20." } }
    - { id: mount, text: { en: "Run Mount-VMHostAssignableDevice -LocationPath $locationPath.", fr: "Exécuter Mount-VMHostAssignableDevice -LocationPath $locationPath." } }
    - { id: disable, text: { en: "Disable the GPU on HV6 by using Disable-PnpDevice.", fr: "Désactiver le GPU sur HV6 avec Disable-PnpDevice." } }
    - { id: start, text: { en: "Start VM20 and install the GPU vendor's driver in the guest.", fr: "Démarrer VM20 et installer le pilote du fabricant du GPU dans l'invité." } }
    - { id: gpup, text: { en: "Run Add-VMGpuPartitionAdapter -VMName VM20.", fr: "Exécuter Add-VMGpuPartitionAdapter -VMName VM20." } }
    - { id: dismount, text: { en: "Run Dismount-VMHostAssignableDevice -Force -LocationPath $locationPath.", fr: "Exécuter Dismount-VMHostAssignableDevice -Force -LocationPath $locationPath." } }
    - { id: dynmem, text: { en: "Enable Dynamic Memory for VM20.", fr: "Activer la mémoire dynamique pour VM20." } }
answer:
  sequence: [ disable, dismount, add, start ]
explanation:
  correct:
    en: |
      The device must leave the host before it can be passed through: you disable it in the host operating system, then dismount it from the host. Without a vendor mitigation driver, Dismount-VMHostAssignableDevice requires -Force. You then assign the device to VM20 with Add-VMAssignableDevice, start the VM and install the vendor driver in the guest.
    fr: |
      L'appareil doit quitter l'hôte avant d'être transmis : vous le désactivez dans le système d'exploitation de l'hôte, puis vous le démontez de l'hôte. Sans pilote d'atténuation du fabricant, Dismount-VMHostAssignableDevice exige -Force. Vous attribuez ensuite l'appareil à VM20 avec Add-VMAssignableDevice, démarrez la machine virtuelle et installez le pilote du fabricant dans l'invité.
  options:
    mount: { en: "Mount-VMHostAssignableDevice gives a device back to the host after it is removed from a VM.", fr: "Mount-VMHostAssignableDevice rend un appareil à l'hôte après son retrait d'une machine virtuelle." }
    gpup: { en: "Add-VMGpuPartitionAdapter assigns a GPU partition (GPU partitioning), not a whole GPU by DDA.", fr: "Add-VMGpuPartitionAdapter attribue une partition de GPU (partitionnement GPU), pas un GPU entier par DDA." }
    dynmem: { en: "Dynamic Memory cannot be used while a device is assigned by DDA.", fr: "La mémoire dynamique est inutilisable tant qu'un appareil est attribué par DDA." }
references:
  - title: Deploy graphics devices by using Discrete Device Assignment
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/deploy/deploying-graphics-devices-using-dda
