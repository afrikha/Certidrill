id: az802-3a-mem-dynamic-cmd
objective: "3.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV5** that runs Windows Server 2025. HV5 hosts a virtual machine named **VM13** that is turned off and uses static memory.

    You need to configure the memory of VM13 to meet the following requirements:

    - VM13 receives 2 GB of memory when it starts.
    - Hyper-V never reduces the memory of VM13 below 1 GB.
    - VM13 can grow up to 8 GB.
    - Hyper-V keeps 20 percent of memory available in addition to the current demand of VM13.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV5** qui exécute Windows Server 2025. HV5 héberge une machine virtuelle nommée **VM13** qui est arrêtée et utilise de la mémoire statique.

    Vous devez configurer la mémoire de VM13 pour satisfaire les exigences suivantes :

    - VM13 reçoit 2 Go de mémoire à son démarrage ;
    - Hyper-V ne réduit jamais la mémoire de VM13 en dessous de 1 Go ;
    - VM13 peut monter jusqu'à 8 Go ;
    - Hyper-V garde 20 % de mémoire disponible en plus de la demande actuelle de VM13.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Set-VMMemory -VMName VM13 [[dyn]] $true -StartupBytes 2GB [[min]] 1GB -MaximumBytes 8GB [[buf]] 20
  slots:
    - id: dyn
      options:
        - { id: dynmem, text: "-DynamicMemory" }
        - { id: pool, text: "-ResourcePoolName" }
        - { id: dynen, text: "-DynamicMemoryEnabled" }
    - id: min
      options:
        - { id: minb, text: "-MinimumBytes" }
        - { id: numa, text: "-MaximumAmountPerNumaNodeBytes" }
        - { id: minprio, text: "-Priority" }
    - id: buf
      options:
        - { id: prio, text: "-Priority" }
        - { id: buffer, text: "-Buffer" }
        - { id: bufnuma, text: "-MaximumAmountPerNumaNodeBytes" }
answer:
  values: { dyn: dynen, min: minb, buf: buffer }
explanation:
  correct:
    en: |
      `-DynamicMemoryEnabled $true` turns on Dynamic Memory for VM13. With Dynamic Memory, `-StartupBytes` is the memory at startup, `-MinimumBytes` the floor and `-MaximumBytes` the ceiling. `-Buffer` is the percentage of memory reserved in addition to the demand, from 5 to 2000.
    fr: |
      `-DynamicMemoryEnabled $true` active la mémoire dynamique de VM13. Avec la mémoire dynamique, `-StartupBytes` est la mémoire au démarrage, `-MinimumBytes` le plancher et `-MaximumBytes` le plafond. `-Buffer` est le pourcentage de mémoire réservé en plus de la demande, de 5 à 2000.
  options:
    dynmem: { en: "-DynamicMemory is a switch of Set-VM, not a Boolean parameter of Set-VMMemory.", fr: "-DynamicMemory est un commutateur de Set-VM, pas un paramètre booléen de Set-VMMemory." }
    numa: { en: "-MaximumAmountPerNumaNodeBytes caps the memory per virtual NUMA node; it is not the Dynamic Memory floor.", fr: "-MaximumAmountPerNumaNodeBytes plafonne la mémoire par nœud NUMA virtuel ; ce n'est pas le plancher de la mémoire dynamique." }
    prio: { en: "-Priority (0 to 100) sets which VMs get memory first when the host is short, not a buffer.", fr: "-Priority (0 à 100) détermine quelles machines virtuelles obtiennent la mémoire en premier quand l'hôte en manque, pas une mémoire tampon." }
references:
  - title: Set-VMMemory (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vmmemory
