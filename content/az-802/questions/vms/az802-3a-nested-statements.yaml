id: az802-3a-nested-statements
objective: "3.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. is planning nested virtualization for several training labs, both on-premises and in Azure.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. planifie la virtualisation imbriquée pour plusieurs labos de formation, en local et dans Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A virtual machine with configuration version 8.0 on a Windows Server 2016 Hyper-V host with Intel VT-x and EPT processors meets the nested virtualization prerequisites.
        fr: Une machine virtuelle de version de configuration 8.0 sur un hôte Hyper-V Windows Server 2016 doté de processeurs Intel VT-x et EPT remplit les prérequis de la virtualisation imbriquée.
    - id: s2
      text:
        en: You can run Set-VMProcessor -ExposeVirtualizationExtensions $true on a running virtual machine, and the setting takes effect at the next restart of the VM.
        fr: Vous pouvez exécuter Set-VMProcessor -ExposeVirtualizationExtensions $true sur une machine virtuelle en cours d'exécution, et le paramètre prend effet au prochain redémarrage de la machine virtuelle.
    - id: s3
      text:
        en: To run Hyper-V inside an Azure virtual machine, you set the security type of the Azure VM to Standard.
        fr: Pour exécuter Hyper-V dans une machine virtuelle Azure, vous définissez le type de sécurité de la machine virtuelle Azure sur Standard.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Intel VT-x with EPT processors need a Windows Server 2016 or later host and a configuration version of 8.0 or higher, so the first configuration qualifies. The virtualization extensions must be exposed while the VM is powered off; the cmdlet is not a pending change for the next restart. For Azure VMs, Learn requires the security type to be set to Standard.
    fr: |
      Les processeurs Intel VT-x avec EPT exigent un hôte Windows Server 2016 ou ultérieur et une version de configuration 8.0 ou supérieure : la première configuration convient. Les extensions de virtualisation doivent être exposées pendant que la machine virtuelle est arrêtée ; la cmdlet n'enregistre pas de modification en attente pour le prochain redémarrage. Pour les machines virtuelles Azure, Learn exige de définir le type de sécurité sur Standard.
references:
  - title: Run Hyper-V in a Virtual Machine with Nested Virtualization
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/enable-nested-virtualization
