id: az802-3a-dda-mmio
objective: "3.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a standalone Hyper-V host named **HV8** that runs Windows Server 2025. You assign a GPU to a new virtual machine named **VM22** by using Discrete Device Assignment. You set the automatic stop action of VM22 to TurnOff, dismount the GPU from HV8 and run Add-VMAssignableDevice. You keep all the other settings of VM22 at their default values.

    You start VM22 and install the vendor's driver. Device Manager in VM22 shows that the GPU cannot start because it cannot find enough free resources.

    You need to make the GPU usable in VM22.

    What should you do?
  fr: |
    Vous disposez d'un hôte Hyper-V autonome nommé **HV8** qui exécute Windows Server 2025. Vous attribuez un GPU à une nouvelle machine virtuelle nommée **VM22** avec l'attribution discrète d'appareil. Vous définissez l'action d'arrêt automatique de VM22 sur TurnOff, démontez le GPU de HV8 et exécutez Add-VMAssignableDevice. Vous laissez tous les autres paramètres de VM22 à leur valeur par défaut.

    Vous démarrez VM22 et installez le pilote du fabricant. Le Gestionnaire de périphériques de VM22 indique que le GPU ne peut pas démarrer, car il ne trouve pas suffisamment de ressources libres.

    Vous devez rendre le GPU utilisable dans VM22.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn off VM22, and then run Set-VMMemory -VMName VM22 -DynamicMemoryEnabled $true.", fr: "Arrêter VM22, puis exécuter Set-VMMemory -VMName VM22 -DynamicMemoryEnabled $true." } }
    - { id: b, text: { en: "Turn off VM22, and then run Dismount-VMHostAssignableDevice -Force -LocationPath $locationPath.", fr: "Arrêter VM22, puis exécuter Dismount-VMHostAssignableDevice -Force -LocationPath $locationPath." } }
    - { id: c, text: { en: "Turn off VM22, and then run Set-VM -Name VM22 -AutomaticStopAction ShutDown.", fr: "Arrêter VM22, puis exécuter Set-VM -Name VM22 -AutomaticStopAction ShutDown." } }
    - { id: d, text: { en: "Turn off VM22, and then run Set-VM -VMName VM22 -HighMemoryMappedIoSpace 33280MB.", fr: "Arrêter VM22, puis exécuter Set-VM -VMName VM22 -HighMemoryMappedIoSpace 33280MB." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      By default, a VM gets 128 MB of low MMIO space and 512 MB of high MMIO space, and GPUs usually need more. When an assigned device reports a resource error after the VM starts, you increase the MMIO space; 33280 MB of high MMIO is the starting value that Learn gives for a single GPU, alongside GuestControlledCacheTypes and 3 GB of low MMIO.
    fr: |
      Par défaut, une machine virtuelle reçoit 128 Mo d'espace MMIO bas et 512 Mo d'espace MMIO haut, et les GPU en demandent généralement plus. Quand un appareil attribué signale une erreur de ressources après le démarrage de la machine virtuelle, vous augmentez l'espace MMIO ; 33280 Mo de MMIO haut est la valeur de départ que donne Learn pour un seul GPU, avec GuestControlledCacheTypes et 3 Go de MMIO bas.
  options:
    a: { en: "Dynamic Memory is not available while a device is assigned by DDA, and RAM is not the missing resource.", fr: "La mémoire dynamique est indisponible tant qu'un appareil est attribué par DDA, et la RAM n'est pas la ressource manquante." }
    b: { en: "The GPU is already dismounted from the host and assigned to VM22; dismounting again does not add MMIO space.", fr: "Le GPU est déjà démonté de l'hôte et attribué à VM22 ; le démonter de nouveau n'ajoute pas d'espace MMIO." }
    c: { en: "DDA requires the automatic stop action TurnOff; changing it does not affect device resources.", fr: "DDA exige l'action d'arrêt automatique TurnOff ; la modifier n'agit pas sur les ressources de l'appareil." }
references:
  - title: Deploy graphics devices by using Discrete Device Assignment
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/deploy/deploying-graphics-devices-using-dda
  - title: Deploy devices by using Discrete Device Assignment
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/plan/plan-for-deploying-devices-using-discrete-device-assignment
