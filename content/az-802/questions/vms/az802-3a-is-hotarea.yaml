id: az802-3a-is-hotarea
objective: "3.1.5"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV1** that runs Windows Server 2025. HV1 hosts a virtual machine named **VM17** that runs Windows Server 2022.

    You run `Get-VMIntegrationService -VMName VM17` on HV1 and get the output shown in the following table.

    Administrators report the following issues:

    - `Copy-VMFile` fails when they copy a file from HV1 into VM17.
    - When they select **Shut Down** for VM17 in Hyper-V Manager, the guest operating system of VM17 does not shut down cleanly.

    Answer each prompt by selecting the integration service that you must enable.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV1** qui exécute Windows Server 2025. HV1 héberge une machine virtuelle nommée **VM17** qui exécute Windows Server 2022.

    Vous exécutez `Get-VMIntegrationService -VMName VM17` sur HV1 et obtenez la sortie présentée dans le tableau suivant.

    Les administrateurs signalent les problèmes suivants :

    - `Copy-VMFile` échoue quand ils copient un fichier de HV1 vers VM17 ;
    - quand ils sélectionnent **Shut Down** pour VM17 dans le Gestionnaire Hyper-V, le système d'exploitation invité de VM17 ne s'arrête pas proprement.

    Répondez à chaque consigne en sélectionnant le service d'intégration que vous devez activer.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Service to enable so that Copy-VMFile succeeds", fr: "Service à activer pour que Copy-VMFile réussisse" }
    - id: p2
      text: { en: "Service to enable so that VM17 can be shut down cleanly from Hyper-V Manager", fr: "Service à activer pour que VM17 puisse être arrêtée proprement depuis le Gestionnaire Hyper-V" }
  grid:
    header: [VMName, Name, Enabled]
    rows:
      - [{ text: VM17 }, { text: Guest Service Interface, area: gsi }, { text: "False" }]
      - [{ text: VM17 }, { text: Heartbeat, area: hb }, { text: "True" }]
      - [{ text: VM17 }, { text: Key-Value Pair Exchange, area: kvp }, { text: "True" }]
      - [{ text: VM17 }, { text: Shutdown, area: sd }, { text: "False" }]
      - [{ text: VM17 }, { text: Time Synchronization, area: ts }, { text: "True" }]
      - [{ text: VM17 }, { text: VSS, area: vss }, { text: "True" }]
answer:
  values: { p1: gsi, p2: sd }
explanation:
  correct:
    en: |
      Copy-VMFile copies files from the host into the guest through the Guest Service Interface integration service, which is the only integration service that is off by default on Windows guests. The Shutdown integration service (Hyper-V Guest Shutdown Service in the guest) lets the host ask the guest operating system to shut down cleanly; it is disabled for VM17. Enable both from the host, for example with Enable-VMIntegrationService.
    fr: |
      Copy-VMFile copie des fichiers de l'hôte vers l'invité grâce au service d'intégration Guest Service Interface, le seul service d'intégration désactivé par défaut sur les invités Windows. Le service d'intégration Shutdown (Hyper-V Guest Shutdown Service dans l'invité) permet à l'hôte de demander au système d'exploitation invité de s'arrêter proprement ; il est désactivé pour VM17. Activez les deux depuis l'hôte, par exemple avec Enable-VMIntegrationService.
references:
  - title: Manage Hyper-V Integration Services
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/manage/manage-hyper-v-integration-services
  - title: Copy-VMFile (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/copy-vmfile
