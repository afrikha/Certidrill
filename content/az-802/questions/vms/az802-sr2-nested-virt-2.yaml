id: az802-sr2-nested-virt-2
objective: "3.1.3"
type: series_yesno
series: az802-sr2-nested-virt
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    While VM1 is running, you expose the virtualization extensions, enable MAC address spoofing and use an external switch in VM1.
  fr: |
    Pendant que VM1 s'exécute, vous exposez les extensions de virtualisation, activez l'usurpation d'adresses MAC et utilisez un commutateur externe dans VM1.
body:
  solution:
    en: |
      Without stopping VM1, you run `Set-VMProcessor -VMName VM1 -ExposeVirtualizationExtensions $true` and `Get-VMNetworkAdapter -VMName VM1 | Set-VMNetworkAdapter -MacAddressSpoofing On` on Server1. You install the Hyper-V role in VM1, and create in VM1 an external virtual switch bound to its network adapter for the nested virtual machines.
    fr: |
      Sans arrêter VM1, vous exécutez `Set-VMProcessor -VMName VM1 -ExposeVirtualizationExtensions $true` et `Get-VMNetworkAdapter -VMName VM1 | Set-VMNetworkAdapter -MacAddressSpoofing On` sur Server1. Vous installez le rôle Hyper-V dans VM1, puis créez dans VM1 un commutateur virtuel externe lié à sa carte réseau pour les machines virtuelles imbriquées.
answer: { value: false }
explanation:
  correct:
    en: |
      The virtualization extensions can be exposed to a virtual machine only while it is in the Off state. Because VM1 is running, the setting cannot be applied: VM1 does not get the virtualization extensions, so Hyper-V inside VM1 cannot run the nested virtual machines.
    fr: |
      Les extensions de virtualisation ne peuvent être exposées à une machine virtuelle que lorsqu'elle est à l'état arrêté. VM1 étant en cours d'exécution, le paramètre ne peut pas être appliqué : VM1 ne reçoit pas les extensions de virtualisation, et Hyper-V dans VM1 ne peut donc pas exécuter les machines virtuelles imbriquées.
references:
  - title: Run Hyper-V in a Virtual Machine with Nested Virtualization
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/enable-nested-virtualization
