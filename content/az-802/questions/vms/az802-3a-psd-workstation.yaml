id: az802-3a-psd-workstation
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV1** that runs Windows Server 2025. HV1 hosts a running virtual machine named **VM5** that runs Windows Server 2022. The only network adapter of VM5 is connected to a private virtual switch.

    You are a member of the Hyper-V Administrators group on HV1. On your workstation **ADMIN1**, which runs Windows 11 and the Hyper-V PowerShell module, you run the following command and provide the credentials of a local administrator of VM5.

    `Enter-PSSession -VMName VM5 -Credential (Get-Credential)`

    The command fails.

    You need to open an interactive PowerShell session in VM5. VM5 must remain connected to the private switch only.

    What should you do?
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV1** qui exécute Windows Server 2025. HV1 héberge une machine virtuelle en cours d'exécution nommée **VM5** qui exécute Windows Server 2022. La seule carte réseau de VM5 est connectée à un commutateur virtuel privé.

    Vous êtes membre du groupe Hyper-V Administrators sur HV1. Sur votre poste de travail **ADMIN1**, qui exécute Windows 11 et le module PowerShell Hyper-V, vous exécutez la commande suivante et fournissez les informations d'identification d'un administrateur local de VM5.

    `Enter-PSSession -VMName VM5 -Credential (Get-Credential)`

    La commande échoue.

    Vous devez ouvrir une session PowerShell interactive dans VM5. VM5 doit rester connectée uniquement au commutateur privé.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run Enable-PSRemoting -Force in VM5, and then run the command again from ADMIN1.", fr: "Exécuter Enable-PSRemoting -Force dans VM5, puis exécuter de nouveau la commande depuis ADMIN1." } }
    - { id: b, text: { en: "Add the -RunAsAdministrator parameter, and then run the command again from ADMIN1.", fr: "Ajouter le paramètre -RunAsAdministrator, puis exécuter de nouveau la commande depuis ADMIN1." } }
    - { id: c, text: { en: "Sign in to HV1, and then run the same command on HV1.", fr: "Se connecter à HV1, puis exécuter la même commande sur HV1." } }
    - { id: d, text: { en: "Enable the Guest Service Interface integration service of VM5, and then run the command again from ADMIN1.", fr: "Activer le service d'intégration Guest Service Interface de VM5, puis exécuter de nouveau la commande depuis ADMIN1." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `-VMName` makes Enter-PSSession use PowerShell Direct, which connects over the VMBus and works only when the virtual machine runs on the local host. Running the command on HV1, as a Hyper-V administrator with guest credentials, opens the session whatever the network configuration of VM5.
    fr: |
      `-VMName` fait utiliser PowerShell Direct à Enter-PSSession : la connexion passe par le VMBus et ne fonctionne que si la machine virtuelle s'exécute sur l'hôte local. Exécuter la commande sur HV1, en tant qu'administrateur Hyper-V avec des informations d'identification de l'invité, ouvre la session quelle que soit la configuration réseau de VM5.
  options:
    a: { en: "WinRM remoting needs network connectivity to VM5, which a private switch does not give ADMIN1; PowerShell Direct does not depend on it.", fr: "La communication à distance WinRM a besoin d'une connectivité réseau vers VM5, qu'un commutateur privé ne donne pas à ADMIN1 ; PowerShell Direct n'en dépend pas." }
    b: { en: "-RunAsAdministrator cannot be used with virtual machines, and the session would still need to start on the host of VM5.", fr: "-RunAsAdministrator est inutilisable avec les machines virtuelles, et la session devrait toujours démarrer sur l'hôte de VM5." }
    d: { en: "Guest Service Interface is used by Copy-VMFile; PowerShell Direct relies on the Hyper-V PowerShell Direct Service in the guest.", fr: "Guest Service Interface sert à Copy-VMFile ; PowerShell Direct s'appuie sur le service Hyper-V PowerShell Direct Service de l'invité." }
references:
  - title: Manage Windows virtual machines with PowerShell Direct
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/manage/manage-windows-virtual-machines-with-powershell-direct
