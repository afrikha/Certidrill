id: az802-3b-nic-legacy-pxe
objective: "3.1.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV1** that runs Windows Server 2025. HV1 hosts a generation 1 virtual machine named **Kiosk3** that is shut down. Kiosk3 has one network adapter, of the standard (synthetic) type, connected to a virtual switch named External1.

    You need Kiosk3 to boot from the network by using a PXE server on the physical network.

    What should you do?
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV1** qui exécute Windows Server 2025. HV1 héberge une machine virtuelle de génération 1 nommée **Kiosk3**, qui est arrêtée. Kiosk3 possède une carte réseau de type standard (synthétique) connectée à un commutateur virtuel nommé External1.

    Vous devez faire en sorte que Kiosk3 démarre à partir du réseau en utilisant un serveur PXE du réseau physique.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run Set-VMFirmware to make the existing network adapter the first boot device.", fr: "Exécuter Set-VMFirmware pour placer la carte réseau existante en premier périphérique de démarrage." } }
    - { id: b, text: { en: "Enable MAC address spoofing on the existing network adapter.", fr: "Activer l'usurpation d'adresses MAC sur la carte réseau existante." } }
    - { id: c, text: { en: "Set DeviceNaming to On on the existing network adapter.", fr: "Définir DeviceNaming sur On pour la carte réseau existante." } }
    - { id: d, text: { en: "Add a legacy network adapter connected to External1 and place it first in the startup order.", fr: "Ajouter une carte réseau héritée connectée à External1 et la placer en premier dans l'ordre de démarrage." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A generation 1 VM can PXE boot only from a legacy network adapter, which emulates a physical card that the BIOS can use. Add one (`Add-VMNetworkAdapter -IsLegacy $true`) and put it first in the startup order (`Set-VMBios -StartupOrder`). On generation 2, the standard adapter can PXE boot.
    fr: |
      Une machine virtuelle de génération 1 ne peut démarrer en PXE qu'à partir d'une carte réseau héritée, qui émule une carte physique utilisable par le BIOS. Ajoutez-en une (`Add-VMNetworkAdapter -IsLegacy $true`) et placez-la en premier dans l'ordre de démarrage (`Set-VMBios -StartupOrder`). En génération 2, la carte standard peut démarrer en PXE.
  options:
    a:
      en: |
        `Set-VMFirmware` configures the firmware of generation 2 VMs only, and the standard adapter of a generation 1 VM can't PXE boot.
      fr: |
        `Set-VMFirmware` configure uniquement le microprogramme des machines virtuelles de génération 2, et la carte standard d'une machine virtuelle de génération 1 ne peut pas démarrer en PXE.
    b:
      en: |
        MAC address spoofing lets the guest send frames with another MAC address (for example for nested VMs); it doesn't add network boot.
      fr: |
        L'usurpation d'adresses MAC permet à l'invité d'émettre des trames avec une autre adresse MAC (par exemple pour des machines virtuelles imbriquées) ; elle n'ajoute pas le démarrage réseau.
    c:
      en: |
        DeviceNaming exposes the adapter name to the guest operating system; it has no effect on network boot.
      fr: |
        DeviceNaming expose le nom de la carte au système d'exploitation invité ; ce paramètre n'a aucun effet sur le démarrage réseau.
references:
  - title: Should I create a generation 1 or 2 virtual machine in Hyper-V?
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/plan/should-i-create-a-generation-1-or-2-virtual-machine-in-hyper-v
