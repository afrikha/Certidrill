id: az802-3b-azdisk-facts
objective: "3.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You have a running Azure virtual machine named **VM3** that runs Windows Server 2025. The size of VM3 supports Premium storage. VM3 has the following managed disks:

    | Disk | Role | Type | Size |
    | --- | --- | --- | --- |
    | VM3-os | OS disk | Standard SSD | 127 GiB |
    | VM3-data1 | Data disk | Premium SSD | 512 GiB |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle Azure en cours d'exécution nommée **VM3** qui exécute Windows Server 2025. La taille de VM3 prend en charge le stockage Premium. VM3 possède les disques managés suivants :

    | Disque | Rôle | Type | Taille |
    | --- | --- | --- | --- |
    | VM3-os | Disque de système d'exploitation | SSD Standard | 127 Gio |
    | VM3-data1 | Disque de données | SSD Premium | 512 Gio |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can attach a new empty data disk to VM3 while VM3 is running.
        fr: Vous pouvez attacher un nouveau disque de données vide à VM3 pendant que VM3 s'exécute.
    - id: s2
      text:
        en: You can reduce the size of VM3-data1 to 256 GiB from the Azure portal.
        fr: Vous pouvez réduire la taille de VM3-data1 à 256 Gio depuis le portail Azure.
    - id: s3
      text:
        en: To change VM3-os from Standard SSD to Premium SSD, you must first deallocate VM3.
        fr: Pour faire passer VM3-os de SSD Standard à SSD Premium, vous devez d'abord libérer VM3.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Data disks can be attached to a running VM (`Add-AzVMDataDisk` then `Update-AzVM`). Shrinking a managed disk isn't supported and could cause data loss. Changing the disk type between Standard HDD, Standard SSD and Premium SSD requires the VM to be stopped and deallocated, and can be done at most twice per day.
    fr: |
      Des disques de données peuvent être attachés à une machine virtuelle en cours d'exécution (`Add-AzVMDataDisk` puis `Update-AzVM`). La réduction d'un disque managé n'est pas prise en charge et pourrait entraîner une perte de données. Le changement de type de disque entre HDD Standard, SSD Standard et SSD Premium exige que la machine virtuelle soit arrêtée et libérée, et ne peut se faire que deux fois par jour au maximum.
references:
  - title: Convert managed disks storage between different disk types
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-convert-types
  - title: Expand Virtual Hard Disks Attached to a Windows VM in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/expand-disks
