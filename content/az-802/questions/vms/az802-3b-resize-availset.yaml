id: az802-3b-resize-availset
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an availability set named **AS-SQL** that contains two running Azure virtual machines, **SQL1** and **SQL2**. Both VMs run Windows Server 2025 and use the Standard_E8s_v5 size.

    You need to resize SQL1 to a memory-optimized size that is available in the region. When you run `Get-AzVMSize -ResourceGroupName RG1 -VMName SQL1`, the target size isn't in the list.

    What should you do?
  fr: |
    Vous disposez d'un groupe à haute disponibilité nommé **AS-SQL** qui contient deux machines virtuelles Azure en cours d'exécution, **SQL1** et **SQL2**. Les deux machines virtuelles exécutent Windows Server 2025 et utilisent la taille Standard_E8s_v5.

    Vous devez redimensionner SQL1 vers une taille à mémoire optimisée disponible dans la région. Quand vous exécutez `Get-AzVMSize -ResourceGroupName RG1 -VMName SQL1`, la taille cible ne figure pas dans la liste.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Stop and deallocate SQL1 only, resize SQL1, and then start SQL1.", fr: "Arrêter et libérer SQL1 uniquement, redimensionner SQL1, puis démarrer SQL1." } }
    - { id: b, text: { en: "Remove SQL1 from AS-SQL, resize SQL1, and then add SQL1 back to AS-SQL.", fr: "Retirer SQL1 d'AS-SQL, redimensionner SQL1, puis rajouter SQL1 à AS-SQL." } }
    - { id: c, text: { en: "Stop and deallocate SQL1 and SQL2, resize SQL1, and then start both VMs.", fr: "Arrêter et libérer SQL1 et SQL2, redimensionner SQL1, puis démarrer les deux machines virtuelles." } }
    - { id: d, text: { en: "Resize SQL1 while it is running; Azure moves it to another hardware cluster.", fr: "Redimensionner SQL1 pendant son exécution ; Azure la déplace vers un autre cluster matériel." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `Get-AzVMSize -VMName` lists the sizes available on the hardware cluster that currently hosts the VM. When the new size of a VM in an availability set isn't available on that cluster, you must deallocate all the VMs of the availability set before you resize, and then start them again.
    fr: |
      `Get-AzVMSize -VMName` liste les tailles disponibles sur le cluster matériel qui héberge actuellement la machine virtuelle. Quand la nouvelle taille d'une machine virtuelle d'un groupe à haute disponibilité n'est pas disponible sur ce cluster, vous devez libérer toutes les machines virtuelles du groupe avant de redimensionner, puis les redémarrer.
  options:
    a:
      en: |
        Deallocating only one VM of an availability set isn't enough when the size isn't available on the current cluster: all the VMs of the set must be deallocated.
      fr: |
        Libérer une seule machine virtuelle d'un groupe à haute disponibilité ne suffit pas quand la taille n'est pas disponible sur le cluster actuel : toutes les machines virtuelles du groupe doivent être libérées.
    b:
      en: |
        A VM's availability set is chosen at creation; you can't remove a VM from the set and add it back without recreating it.
      fr: |
        Le groupe à haute disponibilité d'une machine virtuelle est choisi à sa création ; vous ne pouvez pas retirer une machine virtuelle du groupe et l'y rajouter sans la recréer.
    d:
      en: |
        A running VM can be resized only to a size available on its current hardware cluster; otherwise deallocation is required.
      fr: |
        Une machine virtuelle en cours d'exécution ne peut être redimensionnée que vers une taille disponible sur son cluster matériel actuel ; sinon, la libération est nécessaire.
references:
  - title: Resize a virtual machine
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/resize-vm
