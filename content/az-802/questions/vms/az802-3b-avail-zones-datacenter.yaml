id: az802-3b-avail-zones-datacenter
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You plan to deploy two Azure virtual machines named **Web1** and **Web2** that run Windows Server 2025 and host the same web application behind a load balancer. The region you use supports availability zones.

    You need to ensure that the application remains available if an entire datacenter in the region fails.

    What should you do when you create the VMs?
  fr: |
    Vous prévoyez de déployer deux machines virtuelles Azure nommées **Web1** et **Web2**, qui exécutent Windows Server 2025 et hébergent la même application web derrière un équilibreur de charge. La région utilisée prend en charge les zones de disponibilité.

    Vous devez faire en sorte que l'application reste disponible en cas de panne d'un centre de données entier de la région.

    Que devez-vous faire lors de la création des machines virtuelles ?
body:
  options:
    - { id: a, text: { en: "Place both VMs in an availability set that has three fault domains.", fr: "Placer les deux machines virtuelles dans un groupe à haute disponibilité doté de trois domaines d'erreur." } }
    - { id: b, text: { en: "Place both VMs in an availability set that has 20 update domains.", fr: "Placer les deux machines virtuelles dans un groupe à haute disponibilité doté de 20 domaines de mise à jour." } }
    - { id: c, text: { en: "Place both VMs in the same proximity placement group.", fr: "Placer les deux machines virtuelles dans le même groupe de placement de proximité." } }
    - { id: d, text: { en: "Deploy Web1 and Web2 in two different availability zones.", fr: "Déployer Web1 et Web2 dans deux zones de disponibilité différentes." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Availability zones are physically separate groups of datacenters in a region, so VMs in different zones survive the loss of one datacenter. An availability set only spreads VMs across fault domains inside one datacenter.
    fr: |
      Les zones de disponibilité sont des groupes de centres de données physiquement séparés dans une région : des machines virtuelles réparties dans des zones différentes survivent à la perte d'un centre de données. Un groupe à haute disponibilité ne répartit les machines virtuelles qu'entre des domaines d'erreur d'un même centre de données.
  options:
    a:
      en: |
        Fault domains separate racks, power and network switches inside one datacenter; a datacenter-level outage can affect several fault domains.
      fr: |
        Les domaines d'erreur séparent les racks, l'alimentation et les commutateurs réseau au sein d'un centre de données ; une panne à l'échelle du centre de données peut toucher plusieurs domaines d'erreur.
    b:
      en: |
        Update domains limit the VMs restarted together during planned maintenance; they don't protect against a datacenter failure.
      fr: |
        Les domaines de mise à jour limitent les machines virtuelles redémarrées ensemble pendant une maintenance planifiée ; ils ne protègent pas contre la panne d'un centre de données.
    c:
      en: |
        A proximity placement group places VMs close to each other to reduce latency, which is the opposite of spreading them across datacenters.
      fr: |
        Un groupe de placement de proximité rapproche les machines virtuelles pour réduire la latence, ce qui est l'inverse de leur répartition entre centres de données.
references:
  - title: Availability options for Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability
  - title: Availability sets overview
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
