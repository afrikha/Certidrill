id: az802-3a-is-timesync-host
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV2** that runs Windows Server 2025. HV2 hosts a virtual machine named **VM18** that runs Windows Server 2022.

    VM18 must get its time only from an NTP server on the network, never from HV2. An administrator stopped the **Hyper-V Time Synchronization Service** in VM18 by using the Services console, but shortly afterwards the service is running again.

    You need to stop VM18 from synchronizing its clock with HV2. The other integration services of VM18 must keep working.

    What should you do?
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV2** qui exécute Windows Server 2025. HV2 héberge une machine virtuelle nommée **VM18** qui exécute Windows Server 2022.

    VM18 doit obtenir l'heure uniquement d'un serveur NTP du réseau, jamais de HV2. Un administrateur a arrêté le service **Hyper-V Time Synchronization Service** dans VM18 depuis la console Services, mais peu après le service s'exécute de nouveau.

    Vous devez empêcher VM18 de synchroniser son horloge avec HV2. Les autres services d'intégration de VM18 doivent continuer à fonctionner.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "On HV2, run Disable-VMIntegrationService -VMName VM18 -Name \"Key-Value Pair Exchange\".", fr: "Sur HV2, exécuter Disable-VMIntegrationService -VMName VM18 -Name \"Key-Value Pair Exchange\"." } }
    - { id: b, text: { en: "In VM18, run Stop-Service -Name vmictimesync, and then restart VM18.", fr: "Dans VM18, exécuter Stop-Service -Name vmictimesync, puis redémarrer VM18." } }
    - { id: c, text: { en: "On HV2, run Disable-VMIntegrationService -VMName VM18 -Name \"Time Synchronization\".", fr: "Sur HV2, exécuter Disable-VMIntegrationService -VMName VM18 -Name \"Time Synchronization\"." } }
    - { id: d, text: { en: "On HV2, run Disable-VMIntegrationService -VMName VM18 -Name \"Heartbeat\".", fr: "Sur HV2, exécuter Disable-VMIntegrationService -VMName VM18 -Name \"Heartbeat\"." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Integration services are meant to be controlled from Hyper-V, not from the guest. When a service is enabled on the host, Hyper-V restarts it if it is stopped in the guest, which explains the behavior. Disabling Time Synchronization on HV2 for VM18 stops the corresponding guest service and leaves the other integration services untouched.
    fr: |
      Les services d'intégration se contrôlent depuis Hyper-V, pas depuis l'invité. Quand un service est activé sur l'hôte, Hyper-V le redémarre s'il est arrêté dans l'invité, ce qui explique le comportement observé. Désactiver Time Synchronization sur HV2 pour VM18 arrête le service correspondant de l'invité et laisse les autres services d'intégration intacts.
  options:
    a: { en: "Key-Value Pair Exchange (Data Exchange) exchanges metadata between host and guest; it does not set the guest clock.", fr: "Key-Value Pair Exchange (Échange de données) échange des métadonnées entre l'hôte et l'invité ; il ne règle pas l'horloge de l'invité." }
    b: { en: "The service is still enabled on the host, so Hyper-V starts it again in the guest.", fr: "Le service est toujours activé sur l'hôte : Hyper-V le redémarre dans l'invité." }
    d: { en: "Heartbeat reports the health of the guest; disabling it does not stop time synchronization and breaks a working service.", fr: "Heartbeat signale l'état de l'invité ; le désactiver n'arrête pas la synchronisation de l'heure et casse un service qui fonctionne." }
references:
  - title: Manage Hyper-V Integration Services
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/manage/manage-hyper-v-integration-services
