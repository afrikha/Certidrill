id: az802-sr1-nested-amd-2
objective: "3.1.3"
type: series_yesno
series: az802-sr1-nested-amd
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You upgrade the configuration version of VM1 and expose the virtualization extensions.
  fr: Vous mettez à niveau la version de configuration de VM1 et exposez les extensions de virtualisation.
body:
  solution:
    en: |
      You run the following commands on Host1. You then install the Hyper-V server role in VM1 and create an external virtual switch in VM1.

      ```powershell
      Stop-VM -Name VM1
      Update-VMVersion VM1
      Set-VMProcessor -VMName VM1 -ExposeVirtualizationExtensions $true
      Start-VM -Name VM1
      ```
    fr: |
      Vous exécutez les commandes suivantes sur Host1. Vous installez ensuite le rôle serveur Hyper-V dans VM1 et créez un commutateur virtuel externe dans VM1.

      ```powershell
      Stop-VM -Name VM1
      Update-VMVersion VM1
      Set-VMProcessor -VMName VM1 -ExposeVirtualizationExtensions $true
      Start-VM -Name VM1
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      The upgraded configuration version and the exposed virtualization extensions let VM1 run Hyper-V, so the first requirement is met. However, the packets of the nested virtual machines must cross two virtual switches with their own MAC addresses, which requires MAC address spoofing on the network adapter of VM1. Without it, the nested virtual machines cannot reach the physical network through the external switch.
    fr: |
      La version de configuration mise à niveau et les extensions de virtualisation exposées permettent à VM1 d'exécuter Hyper-V : la première exigence est remplie. En revanche, les paquets des machines virtuelles imbriquées doivent traverser deux commutateurs virtuels avec leurs propres adresses MAC, ce qui exige l'usurpation d'adresses MAC sur la carte réseau de VM1. Sans elle, les machines virtuelles imbriquées ne peuvent pas atteindre le réseau physique par le commutateur externe.
references:
  - title: Run Hyper-V in a Virtual Machine with Nested Virtualization
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/enable-nested-virtualization
