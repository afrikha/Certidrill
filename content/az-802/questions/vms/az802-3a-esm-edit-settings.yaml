id: az802-3a-esm-edit-settings
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV4** that hosts a virtual machine named **VM4**. Enhanced Session Mode works for VM4.

    Last week, when Admin1 connected to VM4 by using Virtual Machine Connection (VMConnect), Admin1 selected **Save my settings for future connections to this virtual machine**. VMConnect now connects to VM4 without showing the connection settings.

    Admin1 needs to make drive E: of HV4 available in the next sessions to VM4.

    What should Admin1 run on HV4?
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV4** qui héberge une machine virtuelle nommée **VM4**. Le mode de session amélioré fonctionne pour VM4.

    La semaine dernière, en se connectant à VM4 avec Connexion à une machine virtuelle (VMConnect), Admin1 a sélectionné **Save my settings for future connections to this virtual machine**. VMConnect se connecte désormais à VM4 sans afficher les paramètres de connexion.

    Admin1 doit rendre le lecteur E: de HV4 disponible dans les prochaines sessions vers VM4.

    Que doit exécuter Admin1 sur HV4 ?
body:
  options:
    - { id: a, text: "Set-VMHost -EnableEnhancedSessionMode $true" }
    - { id: b, text: "Grant-VMConnectAccess -VMName VM4 -UserName Admin1" }
    - { id: c, text: "Enable-VMIntegrationService -VMName VM4 -Name \"Guest Service Interface\"" }
    - { id: d, text: "vmconnect.exe HV4 VM4 /edit" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The `/edit` switch of `VMConnect.exe <ServerName> <VMName>` opens the connection settings of the virtual machine again, so Admin1 can select **Local resources > More**, add drive E:, and save the settings. The drive is then available in the enhanced sessions to VM4.
    fr: |
      Le commutateur `/edit` de `VMConnect.exe <ServerName> <VMName>` rouvre les paramètres de connexion de la machine virtuelle : Admin1 peut sélectionner **Local resources > More**, ajouter le lecteur E: et enregistrer les paramètres. Le lecteur est alors disponible dans les sessions améliorées vers VM4.
  options:
    a: { en: "The host policy is already on, because Enhanced Session Mode works; the command does not change which drives are shared.", fr: "La stratégie de l'hôte est déjà activée, puisque le mode de session amélioré fonctionne ; la commande ne change pas les lecteurs partagés." }
    b: { en: "Grant-VMConnectAccess controls who may open VMConnect, not which local resources a session uses.", fr: "Grant-VMConnectAccess contrôle qui peut ouvrir VMConnect, pas les ressources locales qu'utilise une session." }
    c: { en: "Guest Service Interface enables Copy-VMFile; it does not share drives in a VMConnect session.", fr: "Guest Service Interface active Copy-VMFile ; il ne partage pas de lecteurs dans une session VMConnect." }
references:
  - title: Use local resources on Hyper-V virtual machine with VMConnect
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/learn-more/use-local-resources-on-hyper-v-virtual-machine-with-vmconnect
