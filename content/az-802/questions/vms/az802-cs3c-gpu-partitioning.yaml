id: az802-cs3c-gpu-partitioning
objective: "3.1.7"
type: yesno_statements
caseStudy: az802-cs3c-lucerne-publishing
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If HV1 fails unexpectedly, HVC1 can restart the VM-Design VMs of HV1 on HV2 with a GPU partition.
        fr: |
          Si HV1 tombe en panne de manière inattendue, HVC1 peut redémarrer les machines virtuelles VM-Design de HV1 sur HV2 avec une partition GPU.
    - id: s2
      text:
        en: |
          VM-Render can be live migrated from HV3 to another Windows Server 2025 host while its GPU partition remains assigned.
        fr: |
          VM-Render peut être migrée dynamiquement de HV3 vers un autre hôte Windows Server 2025 pendant que sa partition GPU reste attribuée.
    - id: s3
      text:
        en: |
          You can assign a second GPU partition to VM-Design1 to give it more GPU capacity.
        fr: |
          Vous pouvez attribuer une deuxième partition GPU à VM-Design1 pour lui donner plus de capacité GPU.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Clustering GPU-partitioned VMs to handle unplanned downtime requires Windows Server 2025 Datacenter, which HV1 and HV2 run with homogeneous GPUs, so HVC1 can restart the VMs on HV2. Live migration with a GPU partition requires processors with IOMMU DMA bit tracking; the AMD EPYC 7002 series of HV3 supports GPU partitioning but not live migration with it. A VM can currently be assigned only a single GPU partition.
    fr: |
      La mise en cluster de machines virtuelles à partitions GPU pour gérer les interruptions non planifiées exige Windows Server 2025 Datacenter, que HV1 et HV2 exécutent avec des GPU homogènes : HVC1 peut donc redémarrer les machines virtuelles sur HV2. La migration dynamique avec une partition GPU exige des processeurs dotés du suivi des bits DMA par l'IOMMU ; la série AMD EPYC 7002 de HV3 prend en charge le partitionnement GPU, mais pas la migration dynamique avec celui-ci. Une machine virtuelle ne peut actuellement recevoir qu'une seule partition GPU.
references:
  - title: Partition and share GPUs with virtual machines on Hyper-V
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/gpu-partitioning
  - title: Partition and assign GPUs to a virtual machine in Hyper-V
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/partition-assign-vm-gpu
