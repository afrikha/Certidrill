id: az802-3b-team-set-facts
objective: "3.1.12"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV6** that runs Windows Server 2025. HV6 has a virtual switch named **SETswitch** that uses Switch Embedded Teaming (SET) with two members, NIC1 and NIC2. NIC1 and NIC2 are 25-GbE adapters of the same make and model.

    HV6 also contains two unused adapters: NIC3, identical to NIC1, and NIC4, a 10-GbE adapter of another vendor.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV6** qui exécute Windows Server 2025. HV6 possède un commutateur virtuel nommé **SETswitch** qui utilise Switch Embedded Teaming (SET) avec deux membres, NIC1 et NIC2. NIC1 et NIC2 sont des cartes 25 GbE de même marque et de même modèle.

    HV6 contient aussi deux cartes inutilisées : NIC3, identique à NIC1, et NIC4, une carte 10 GbE d'un autre fabricant.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can configure SETswitch to use the LACP teaming mode by running Set-VMSwitchTeam.
        fr: Vous pouvez configurer SETswitch pour utiliser le mode d'association LACP en exécutant Set-VMSwitchTeam.
    - id: s2
      text:
        en: You can add NIC3 to SETswitch by running Add-VMSwitchTeamMember.
        fr: Vous pouvez ajouter NIC3 à SETswitch en exécutant Add-VMSwitchTeamMember.
    - id: s3
      text:
        en: Adding NIC4 as a third member of SETswitch is a supported configuration.
        fr: L'ajout de NIC4 comme troisième membre de SETswitch est une configuration prise en charge.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      SET supports only the switch-independent teaming mode, with the Dynamic or Hyper-V Port load-balancing algorithm; `Set-VMSwitchTeam -TeamingMode` accepts only SwitchIndependent. A SET team holds up to eight adapters, and `Add-VMSwitchTeamMember` adds an identical one. SET requires symmetric adapters (same make, model, speed and configuration), so a 10-GbE adapter of another vendor isn't supported.
    fr: |
      SET ne prend en charge que le mode d'association indépendant du commutateur, avec l'algorithme d'équilibrage de charge Dynamic ou Hyper-V Port ; `Set-VMSwitchTeam -TeamingMode` n'accepte que SwitchIndependent. Une association SET contient jusqu'à huit cartes, et `Add-VMSwitchTeamMember` en ajoute une identique. SET exige des cartes symétriques (même marque, même modèle, même vitesse et même configuration) : une carte 10 GbE d'un autre fabricant n'est pas prise en charge.
references:
  - title: Host network requirements for Azure Local
    url: https://learn.microsoft.com/en-us/azure/azure-local/concepts/host-network-requirements
  - title: Set-VMSwitchTeam (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vmswitchteam
