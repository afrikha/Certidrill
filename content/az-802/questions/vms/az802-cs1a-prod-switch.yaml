id: az802-cs1a-prod-switch
objective: "3.1.13"
type: dropdown
caseStudy: az802-cs1a-munsons
difficulty: 2
status: draft
stem:
  en: |
    You need to create vSwitch-Prod on HV1 to meet the host networking requirement.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer vSwitch-Prod sur HV1 pour respecter l'exigence relative au réseau des hôtes.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    New-VMSwitch -Name "vSwitch-Prod" [[adapters]] "NIC1","NIC2" [[team]] $true -AllowManagementOS $true
  slots:
    - id: adapters
      options:
        - { id: type, text: -SwitchType }
        - { id: name, text: -NetAdapterName }
        - { id: desc, text: -NetAdapterInterfaceDescription }
    - id: team
      options:
        - { id: iov, text: -EnableIov }
        - { id: pd, text: -EnablePacketDirect }
        - { id: set, text: -EnableEmbeddedTeaming }
answer:
  values: { adapters: name, team: set }
explanation:
  correct:
    en: |
      `-NetAdapterName` binds the switch to the named physical adapters, which implicitly creates an External switch. `-EnableEmbeddedTeaming $true` teams the adapters inside the virtual switch (Switch Embedded Teaming), so traffic continues on the remaining adapter if one fails. `-AllowManagementOS $true` gives the management operating system access through the switch.
    fr: |
      `-NetAdapterName` lie le commutateur aux cartes physiques nommées, ce qui crée implicitement un commutateur externe. `-EnableEmbeddedTeaming $true` associe les cartes en équipe au sein du commutateur virtuel (Switch Embedded Teaming) : le trafic continue sur la carte restante si l'une d'elles tombe en panne. `-AllowManagementOS $true` donne au système d'exploitation de gestion un accès par le commutateur.
  options:
    type: { en: "-SwitchType accepts only Internal or Private; it doesn't bind physical adapters.", fr: "-SwitchType n'accepte que Internal ou Private ; il ne lie aucune carte physique." }
    desc: { en: "-NetAdapterInterfaceDescription expects the interface descriptions of the adapters, not their names NIC1 and NIC2.", fr: "-NetAdapterInterfaceDescription attend les descriptions d'interface des cartes, pas leurs noms NIC1 et NIC2." }
    iov: { en: "-EnableIov enables I/O virtualization (SR-IOV) on the switch; it doesn't team the adapters.", fr: "-EnableIov active la virtualisation d'E/S (SR-IOV) sur le commutateur ; il n'associe pas les cartes en équipe." }
    pd: { en: "-EnablePacketDirect enables the packet direct path through the switch; it doesn't provide adapter redundancy.", fr: "-EnablePacketDirect active le chemin Packet Direct dans le commutateur ; il n'apporte pas de redondance des cartes." }
references:
  - title: New-VMSwitch
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/new-vmswitch
