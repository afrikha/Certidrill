id: az802-3b-replica-cert-auth
objective: "3.1.14"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have the following Hyper-V hosts that run Windows Server 2025:

    | Name | Location | Membership |
    | --- | --- | --- |
    | HV-DMZ1 | Perimeter network | Workgroup |
    | HV-CORE1 | Datacenter | contoso.com domain |

    You need to replicate a virtual machine named **WEB1** from HV-DMZ1 to HV-CORE1 by using Hyper-V Replica. The replication traffic must be encrypted. The default ports must be used.

    Which two actions should you perform on HV-CORE1 before you enable replication of WEB1? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez des hôtes Hyper-V suivants, qui exécutent Windows Server 2025 :

    | Nom | Emplacement | Appartenance |
    | --- | --- | --- |
    | HV-DMZ1 | Réseau de périmètre | Groupe de travail |
    | HV-CORE1 | Centre de données | Domaine contoso.com |

    Vous devez répliquer une machine virtuelle nommée **WEB1** de HV-DMZ1 vers HV-CORE1 avec Hyper-V Réplica. Le trafic de réplication doit être chiffré. Les ports par défaut doivent être utilisés.

    Quelles sont les deux actions à effectuer sur HV-CORE1 avant d'activer la réplication de WEB1 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure the Replica server to use Kerberos authentication (HTTP) with compression.", fr: "Configurer le serveur réplica pour utiliser l'authentification Kerberos (HTTP) avec compression." } }
    - { id: b, text: { en: "Enable the Hyper-V Replica HTTPS Listener (TCP-In) firewall rule.", fr: "Activer la règle de pare-feu Hyper-V Replica HTTPS Listener (TCP-In)." } }
    - { id: c, text: { en: "Create the Hyper-V Replica Broker role.", fr: "Créer le rôle Hyper-V Replica Broker." } }
    - { id: d, text: { en: "Configure the Replica server to use certificate-based authentication (HTTPS).", fr: "Configurer le serveur réplica pour utiliser l'authentification basée sur un certificat (HTTPS)." } }
    - { id: e, text: { en: "Enable the Hyper-V Replica HTTP Listener (TCP-In) firewall rule.", fr: "Activer la règle de pare-feu Hyper-V Replica HTTP Listener (TCP-In)." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Kerberos requires both hosts to be domain members and doesn't encrypt the traffic, so a workgroup primary and an encryption requirement both point to certificate-based authentication over HTTPS (port 443 by default). Hyper-V creates the listener firewall rules disabled, so you must enable the HTTPS listener rule on the receiving host.
    fr: |
      Kerberos exige que les deux hôtes soient membres du domaine et ne chiffre pas le trafic : un serveur principal en groupe de travail et une exigence de chiffrement conduisent tous deux à l'authentification basée sur un certificat via HTTPS (port 443 par défaut). Hyper-V crée les règles de pare-feu d'écoute désactivées : vous devez activer la règle d'écoute HTTPS sur l'hôte récepteur.
  options:
    a:
      en: |
        Compression reduces bandwidth but doesn't encrypt, and Kerberos isn't available because HV-DMZ1 is in a workgroup.
      fr: |
        La compression réduit la bande passante, mais ne chiffre pas, et Kerberos n'est pas utilisable, car HV-DMZ1 est dans un groupe de travail.
    c:
      en: |
        The Replica Broker is needed only when the replica server is a failover cluster; HV-CORE1 is a standalone host.
      fr: |
        Le Replica Broker n'est nécessaire que si le serveur réplica est un cluster de basculement ; HV-CORE1 est un hôte autonome.
    e:
      en: |
        The HTTP listener (port 80) serves Kerberos authentication, not certificate-based authentication over HTTPS.
      fr: |
        L'écouteur HTTP (port 80) sert l'authentification Kerberos, pas l'authentification basée sur un certificat via HTTPS.
references:
