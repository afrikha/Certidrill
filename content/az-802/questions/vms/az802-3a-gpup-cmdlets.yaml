id: az802-3a-gpup-cmdlets
objective: "3.1.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV11** that runs Windows Server 2025. A GPU in HV11 is configured for GPU partitioning. You manage GPU partitions for the virtual machines on HV11 by using PowerShell.

    Which cmdlet should you use for each task? To answer, drag the appropriate cmdlets to the correct tasks. Each cmdlet may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV11** qui exécute Windows Server 2025. Un GPU de HV11 est configuré pour le partitionnement GPU. Vous gérez les partitions GPU des machines virtuelles de HV11 avec PowerShell.

    Quelle cmdlet devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les cmdlets appropriées vers les tâches correspondantes. Chaque cmdlet peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: addp, text: Add-VMGpuPartitionAdapter }
    - { id: getp, text: Get-VMGpuPartitionAdapter }
    - { id: remp, text: Remove-VMGpuPartitionAdapter }
    - { id: adda, text: Add-VMAssignableDevice }
    - { id: dism, text: Dismount-VMHostAssignableDevice }
    - { id: geta, text: Get-VMHostAssignableDevice }
  targets:
    - id: t1
      text: { en: "Assign a GPU partition to a VM", fr: "Attribuer une partition GPU à une machine virtuelle" }
    - id: t2
      text: { en: "View the GPU partition assigned to a VM", fr: "Afficher la partition GPU attribuée à une machine virtuelle" }
    - id: t3
      text: { en: "Unassign the GPU partition from a VM", fr: "Retirer la partition GPU d'une machine virtuelle" }
answer:
  mapping: { t1: addp, t2: getp, t3: remp }
explanation:
  correct:
    en: |
      The VMGpuPartitionAdapter cmdlets manage GPU partitions: Add-VMGpuPartitionAdapter assigns a partition to a VM, Get-VMGpuPartitionAdapter shows the assignment, and Remove-VMGpuPartitionAdapter unassigns it. The assignable device cmdlets belong to Discrete Device Assignment, which gives a whole GPU to one VM; a GPU uses one method or the other, not both.
    fr: |
      Les cmdlets VMGpuPartitionAdapter gèrent les partitions GPU : Add-VMGpuPartitionAdapter attribue une partition à une machine virtuelle, Get-VMGpuPartitionAdapter affiche l'attribution et Remove-VMGpuPartitionAdapter la retire. Les cmdlets d'appareils attribuables relèvent de l'attribution discrète d'appareil, qui donne un GPU entier à une seule machine virtuelle ; un GPU utilise l'une ou l'autre méthode, pas les deux.
references:
  - title: Partition and assign GPUs to a virtual machine in Hyper-V
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/partition-assign-vm-gpu
