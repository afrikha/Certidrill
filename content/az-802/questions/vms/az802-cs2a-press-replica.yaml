id: az802-cs2a-press-replica
objective: "3.1.14"
type: dropdown
caseStudy: az802-cs2a-coho-winery
difficulty: 2
status: draft
stem:
  en: |
    You need to configure replication for VM-PRESS to meet the disaster recovery requirement.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer la réplication de VM-PRESS pour satisfaire l'exigence de reprise d'activité.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Configure on HVCLUS before you enable replication: [[cluster]]

      Authentication type: [[auth]]

      Replication frequency: [[freq]]
    fr: |
      À configurer sur HVCLUS avant d'activer la réplication : [[cluster]]

      Type d'authentification : [[auth]]

      Fréquence de réplication : [[freq]]
  slots:
    - id: cluster
      options:
        - { id: broker, text: { en: "The Hyper-V Replica Broker role", fr: "Le rôle Hyper-V Replica Broker" } }
        - { id: sofs, text: { en: "The Scale-Out File Server role", fr: "Le rôle Serveur de fichiers avec montée en puissance parallèle" } }
        - { id: cau, text: { en: "The Cluster-Aware Updating role", fr: "Le rôle Mise à jour adaptée aux clusters" } }
    - id: auth
      options:
        - { id: kerb, text: { en: "Kerberos (HTTP)", fr: "Kerberos (HTTP)" } }
        - { id: kerbc, text: { en: "Kerberos (HTTP) with compression", fr: "Kerberos (HTTP) avec compression" } }
        - { id: cert, text: { en: "Certificate-based (HTTPS)", fr: "Basée sur un certificat (HTTPS)" } }
    - id: freq
      options:
        - { id: f30s, text: { en: "30 seconds", fr: "30 secondes" } }
        - { id: f5m, text: { en: "5 minutes", fr: "5 minutes" } }
        - { id: f15m, text: { en: "15 minutes", fr: "15 minutes" } }
answer:
  values: { cluster: broker, auth: cert, freq: f15m }
explanation:
  correct:
    en: |
      When the replica server is a failover cluster, the Hyper-V Replica Broker role redirects replication requests to the node that owns the replica VM, and you manage replication from Failover Cluster Manager. Kerberos authentication is available because HV-SE is a domain member, but it does not encrypt the traffic; certificate-based authentication over HTTPS does. A 15-minute frequency is the least frequent interval and stays within the accepted loss of 15 minutes.
    fr: |
      Quand le serveur de réplication est un cluster de basculement, le rôle Hyper-V Replica Broker redirige les demandes de réplication vers le nœud propriétaire de la machine virtuelle réplica, et vous gérez la réplication depuis le Gestionnaire du cluster de basculement. L'authentification Kerberos est possible, car HV-SE est membre du domaine, mais elle ne chiffre pas le trafic ; l'authentification basée sur un certificat via HTTPS le chiffre. Une fréquence de 15 minutes est l'intervalle le moins fréquent et respecte la perte acceptée de 15 minutes.
  options:
    kerbc:
      en: |
        Compression reduces the bandwidth used, but the traffic is still sent over HTTP without encryption.
      fr: |
        La compression réduit la bande passante utilisée, mais le trafic est toujours envoyé en HTTP sans chiffrement.
    f5m:
      en: |
        Five minutes would also meet the loss objective, but it replicates three times as often as required.
      fr: |
        Cinq minutes respecteraient aussi l'objectif de perte, mais la réplication serait trois fois plus fréquente que nécessaire.
references:
  - title: Hyper-V Replica overview
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/manage/set-up-hyper-v-replica
