id: az802-3a-mem-true-statements
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are documenting the memory settings of the virtual machines on a Hyper-V host named **HV7** that runs Windows Server 2025.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous documentez les paramètres de mémoire des machines virtuelles d'un hôte Hyper-V nommé **HV7** qui exécute Windows Server 2025.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The -Priority parameter of Set-VMMemory accepts values from 1 to 10000.", fr: "Le paramètre -Priority de Set-VMMemory accepte des valeurs de 1 à 10000." } }
    - { id: b, text: { en: "The -Buffer parameter of Set-VMMemory accepts values from 5 to 2000 percent.", fr: "Le paramètre -Buffer de Set-VMMemory accepte des valeurs de 5 à 2000 %." } }
    - { id: c, text: { en: "The -MaximumBytes parameter of Set-VMMemory caps the memory of a VM that uses static memory.", fr: "Le paramètre -MaximumBytes de Set-VMMemory plafonne la mémoire d'une machine virtuelle qui utilise de la mémoire statique." } }
    - { id: d, text: { en: "Dynamic Memory is unavailable for a VM while a device is assigned to it by using Discrete Device Assignment.", fr: "La mémoire dynamique est indisponible pour une machine virtuelle tant qu'un appareil lui est attribué par attribution discrète d'appareil." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The memory buffer is a percentage from 5 to 2000 that Hyper-V reserves for the VM in addition to its demand. Discrete Device Assignment removes Dynamic Memory, along with save/restore, live migration and adding the VM to a high availability cluster, while a device is attached.
    fr: |
      La mémoire tampon est un pourcentage de 5 à 2000 qu'Hyper-V réserve à la machine virtuelle en plus de sa demande. L'attribution discrète d'appareil supprime la mémoire dynamique, ainsi que l'enregistrement/restauration, la migration dynamique et l'ajout de la machine virtuelle à un cluster haute disponibilité, tant qu'un appareil est attaché.
  options:
    a: { en: "Memory priority ranges from 0 to 100; 1 to 10000 is the range of the processor RelativeWeight of Set-VMProcessor.", fr: "La priorité de la mémoire va de 0 à 100 ; 1 à 10000 est la plage du RelativeWeight processeur de Set-VMProcessor." }
    c: { en: "MaximumBytes applies only when Dynamic Memory is enabled; with static memory, StartupBytes is the total memory of the VM.", fr: "MaximumBytes ne s'applique qu'avec la mémoire dynamique activée ; avec la mémoire statique, StartupBytes est la mémoire totale de la machine virtuelle." }
references:
  - title: Set-VMMemory (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vmmemory
  - title: Deploy devices by using Discrete Device Assignment
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/plan/plan-for-deploying-devices-using-discrete-device-assignment
