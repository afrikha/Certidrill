id: az802-sr1-nested-amd-3
objective: "3.1.3"
type: series_yesno
series: az802-sr1-nested-amd
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You upgrade the configuration version of VM1, expose the virtualization extensions, and enable MAC address spoofing.
  fr: Vous mettez à niveau la version de configuration de VM1, exposez les extensions de virtualisation et activez l'usurpation d'adresses MAC.
body:
  solution:
    en: |
      You run the following commands on Host1. You then install the Hyper-V server role in VM1 and create an external virtual switch in VM1.

      ```powershell
      Stop-VM -Name VM1
      Update-VMVersion VM1
      Set-VMProcessor -VMName VM1 -ExposeVirtualizationExtensions $true
      Get-VMNetworkAdapter -VMName VM1 | Set-VMNetworkAdapter -MacAddressSpoofing On
      Start-VM -Name VM1
      ```
    fr: |
      Vous exécutez les commandes suivantes sur Host1. Vous installez ensuite le rôle serveur Hyper-V dans VM1 et créez un commutateur virtuel externe dans VM1.

      ```powershell
      Stop-VM -Name VM1
      Update-VMVersion VM1
      Set-VMProcessor -VMName VM1 -ExposeVirtualizationExtensions $true
      Get-VMNetworkAdapter -VMName VM1 | Set-VMNetworkAdapter -MacAddressSpoofing On
      Start-VM -Name VM1
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      `Update-VMVersion` raises VM1 to the latest configuration version that Host1 supports (Windows Server 2025 supports up to 12.0), which meets the 9.3 minimum for AMD processors; the upgrade cannot be reversed. The virtualization extensions are exposed while VM1 is off, as required, and MAC address spoofing lets the nested virtual machines reach the physical network through two virtual switches without NAT.
    fr: |
      `Update-VMVersion` fait passer VM1 à la dernière version de configuration prise en charge par Host1 (Windows Server 2025 prend en charge jusqu'à la version 12.0), ce qui respecte le minimum de 9.3 exigé pour les processeurs AMD ; la mise à niveau est irréversible. Les extensions de virtualisation sont exposées pendant que VM1 est arrêtée, comme il se doit, et l'usurpation d'adresses MAC permet aux machines virtuelles imbriquées d'atteindre le réseau physique à travers deux commutateurs virtuels sans NAT.
references:
