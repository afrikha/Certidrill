id: az802-3b-nic-settings-dragdrop
objective: "3.1.11"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV3** that runs Windows Server 2025. HV3 has an external virtual switch named **Prod** that was created with `-MinimumBandwidthMode Weight`. All the virtual machines in the following requirements are connected to Prod.

    You need to configure the network adapters of the virtual machines to meet the requirements.

    Which `Set-VMNetworkAdapter` setting should you configure for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV3** qui exécute Windows Server 2025. HV3 possède un commutateur virtuel externe nommé **Prod**, créé avec `-MinimumBandwidthMode Weight`. Toutes les machines virtuelles des exigences suivantes sont connectées à Prod.

    Vous devez configurer les cartes réseau des machines virtuelles pour satisfaire les exigences.

    Quel paramètre de `Set-VMNetworkAdapter` devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: pmsrc, text: -PortMirroring Source }
    - { id: pmdst, text: -PortMirroring Destination }
    - { id: dhcp, text: -DhcpGuard On }
    - { id: router, text: -RouterGuard On }
    - { id: spoof, text: -MacAddressSpoofing On }
    - { id: minbw, text: -MinimumBandwidthWeight 20 }
  targets:
    - id: mon
      text: { en: "On the adapter of Mon1: receive a copy of all the packets that the adapter of App1 already set as a source sends and receives", fr: "Sur la carte de Mon1 : recevoir une copie de tous les paquets envoyés et reçus par la carte d'App1, déjà définie comme source" }
    - id: test
      text: { en: "On the adapter of Test4: drop the IP address offers that a DHCP server role installed by mistake in Test4 sends", fr: "Sur la carte de Test4 : supprimer les offres d'adresses IP envoyées par un rôle serveur DHCP installé par erreur dans Test4" }
    - id: nest
      text: { en: "On the adapter of Nest1: let the nested virtual machines that Nest1 hosts reach the network through it", fr: "Sur la carte de Nest1 : permettre aux machines virtuelles imbriquées hébergées par Nest1 d'accéder au réseau par cette carte" }
    - id: backup
      text: { en: "On the adapter of Backup2: guarantee a share of the bandwidth of Prod relative to the other virtual machines", fr: "Sur la carte de Backup2 : garantir une part de la bande passante de Prod relative aux autres machines virtuelles" }
answer:
  mapping: { mon: pmdst, test: dhcp, nest: spoof, backup: minbw }
explanation:
  correct:
    en: |
      Port mirroring copies the traffic of a Source adapter to a Destination adapter on the same switch, so Mon1 is the destination. DHCP guard drops DHCP server messages from the VM that claims to be a server; it is set on that VM's adapter. Nested VMs send frames with their own MAC addresses, which requires MAC address spoofing on the adapter of the VM that hosts them. A minimum bandwidth weight (0 to 100) guarantees a relative share on a switch created in Weight mode.
    fr: |
      La mise en miroir de ports copie le trafic d'une carte Source vers une carte Destination du même commutateur : Mon1 est donc la destination. La protection DHCP supprime les messages de serveur DHCP émis par la machine virtuelle qui prétend être un serveur ; elle se configure sur la carte de cette machine virtuelle. Les machines virtuelles imbriquées émettent des trames avec leurs propres adresses MAC, ce qui exige l'usurpation d'adresses MAC sur la carte de la machine virtuelle qui les héberge. Un poids de bande passante minimale (0 à 100) garantit une part relative sur un commutateur créé en mode Weight.
  options:
    pmsrc:
      en: |
        Source is the adapter whose traffic is copied (App1), not the monitoring adapter that receives the copy.
      fr: |
        Source est la carte dont le trafic est copié (App1), pas la carte de supervision qui reçoit la copie.
    router:
      en: |
        Router guard drops router advertisement and redirection messages, not DHCP offers.
      fr: |
        La protection du routeur supprime les messages d'annonce de routeur et de redirection, pas les offres DHCP.
references:
  - title: Set-VMNetworkAdapter (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vmnetworkadapter
  - title: Run Hyper-V in a Virtual Machine with Nested Virtualization
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/enable-nested-virtualization
