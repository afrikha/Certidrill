id: az802-3a-ha-cluster-order
objective: "3.1.9"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have two Hyper-V hosts named **HV15** and **HV16** that run Windows Server 2025 Datacenter. Both hosts are members of the contoso.com domain, have the Failover Clustering feature installed, and are connected to the same iSCSI disk. No cluster exists yet.

    A virtual machine named **VM30** runs on HV15. The files of VM30 are stored on the local D: volume of HV15.

    You need to ensure that VM30 restarts automatically on HV16 if HV15 fails.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez de deux hôtes Hyper-V nommés **HV15** et **HV16** qui exécutent Windows Server 2025 Datacenter. Les deux hôtes sont membres du domaine contoso.com, la fonctionnalité Clustering de basculement y est installée, et ils sont connectés au même disque iSCSI. Aucun cluster n'existe encore.

    Une machine virtuelle nommée **VM30** s'exécute sur HV15. Les fichiers de VM30 sont stockés sur le volume local D: de HV15.

    Vous devez faire en sorte que VM30 redémarre automatiquement sur HV16 si HV15 tombe en panne.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: csv, text: { en: "Run Add-ClusterSharedVolume -Name \"Cluster Disk 1\".", fr: "Exécuter Add-ClusterSharedVolume -Name \"Cluster Disk 1\"." } }
    - { id: replica, text: { en: "Enable Hyper-V Replica for VM30 from HV15 to HV16.", fr: "Activer le réplica Hyper-V pour VM30 de HV15 vers HV16." } }
    - { id: test, text: { en: "Run Test-Cluster -Node HV15, HV16.", fr: "Exécuter Test-Cluster -Node HV15, HV16." } }
    - { id: role, text: { en: "Run Add-ClusterVirtualMachineRole -VirtualMachine VM30.", fr: "Exécuter Add-ClusterVirtualMachineRole -VirtualMachine VM30." } }
    - { id: move, text: { en: "Move the storage of VM30 to C:\\ClusterStorage\\Volume1 by using Move-VMStorage.", fr: "Déplacer le stockage de VM30 vers C:\\ClusterStorage\\Volume1 avec Move-VMStorage." } }
    - { id: kerb, text: { en: "Run Set-VMHost -VirtualMachineMigrationAuthenticationType Kerberos on both hosts.", fr: "Exécuter Set-VMHost -VirtualMachineMigrationAuthenticationType Kerberos sur les deux hôtes." } }
    - { id: new, text: { en: "Run New-Cluster -Name HVCLU1 -Node HV15, HV16 -StaticAddress 10.0.0.50.", fr: "Exécuter New-Cluster -Name HVCLU1 -Node HV15, HV16 -StaticAddress 10.0.0.50." } }
answer:
  sequence: [ test, new, csv, move, role ]
explanation:
  correct:
    en: |
      You validate the configuration, then create the cluster, which adds the shared iSCSI disk to Available Storage. Add-ClusterSharedVolume turns that disk into a Cluster Shared Volume that both nodes can read and write. The virtual hard disk of a clustered VM must be on the clustered disk it uses, so you move the storage of VM30 to the CSV before Add-ClusterVirtualMachineRole makes VM30 a clustered role that fails over to HV16.
    fr: |
      Vous validez la configuration, puis créez le cluster, ce qui ajoute le disque iSCSI partagé au stockage disponible. Add-ClusterSharedVolume transforme ce disque en volume partagé de cluster que les deux nœuds peuvent lire et écrire. Le disque dur virtuel d'une machine virtuelle en cluster doit se trouver sur le disque en cluster qu'elle utilise : vous déplacez donc le stockage de VM30 vers le CSV avant qu'Add-ClusterVirtualMachineRole fasse de VM30 un rôle en cluster qui bascule sur HV16.
  options:
    replica: { en: "Hyper-V Replica keeps an asynchronous copy that you fail over to manually; it does not restart VM30 automatically.", fr: "Le réplica Hyper-V conserve une copie asynchrone vers laquelle vous basculez manuellement ; il ne redémarre pas VM30 automatiquement." }
    kerb: { en: "Kerberos authentication is a live migration setting of standalone hosts; it is not needed for cluster failover.", fr: "L'authentification Kerberos est un paramètre de migration dynamique des hôtes autonomes ; elle n'est pas nécessaire au basculement du cluster." }
references:
  - title: Add-ClusterVirtualMachineRole (FailoverClusters)
    url: https://learn.microsoft.com/en-us/powershell/module/failoverclusters/add-clustervirtualmachinerole
  - title: Add-ClusterSharedVolume (FailoverClusters)
    url: https://learn.microsoft.com/en-us/powershell/module/failoverclusters/add-clustersharedvolume
