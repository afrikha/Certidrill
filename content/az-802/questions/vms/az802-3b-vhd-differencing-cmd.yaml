id: az802-3b-vhd-differencing-cmd
objective: "3.1.10"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV1** that runs Windows Server 2025. HV1 contains a generalized Windows Server 2025 disk named `D:\VMs\Base.vhdx`.

    You create a generation 2 virtual machine named **Web2** that has no virtual hard disk.

    You need to create a virtual hard disk for Web2 that stores only the changes made by Web2, leaves Base.vhdx unchanged, and is attached to Web2 so that Web2 can boot from it.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV1** qui exécute Windows Server 2025. HV1 contient un disque Windows Server 2025 généralisé nommé `D:\VMs\Base.vhdx`.

    Vous créez une machine virtuelle de génération 2 nommée **Web2** qui n'a aucun disque dur virtuel.

    Vous devez créer pour Web2 un disque dur virtuel qui stocke uniquement les modifications effectuées par Web2, laisse Base.vhdx inchangé et est attaché à Web2 pour que Web2 puisse démarrer sur ce disque.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    New-VHD -Path D:\VMs\Web2.vhdx [[parent]] D:\VMs\Base.vhdx [[type]]
    [[attach]] -VMName Web2 -ControllerType SCSI -Path D:\VMs\Web2.vhdx
  slots:
    - id: parent
      options:
        - { id: parentpath, text: -ParentPath }
        - { id: source, text: -SourceDisk }
        - { id: block, text: -BlockSizeBytes }
    - id: type
      options:
        - { id: fixed, text: -Fixed }
        - { id: dynamic, text: -Dynamic }
        - { id: diff, text: -Differencing }
    - id: attach
      options:
        - { id: setdrive, text: Set-VMHardDiskDrive }
        - { id: adddrive, text: Add-VMHardDiskDrive }
        - { id: mount, text: Mount-VHD }
        - { id: addscsi, text: Add-VMScsiController }
answer:
  values: { parent: parentpath, type: diff, attach: adddrive }
explanation:
  correct:
    en: |
      A differencing disk is created with `New-VHD -ParentPath <parent> -Differencing`: it records only the changes, and the parent disk stays unchanged. `Add-VMHardDiskDrive` attaches the new file to Web2; a generation 2 VM boots from a SCSI controller.
    fr: |
      Un disque de différenciation se crée avec `New-VHD -ParentPath <parent> -Differencing` : il n'enregistre que les modifications, et le disque parent reste inchangé. `Add-VMHardDiskDrive` attache le nouveau fichier à Web2 ; une machine virtuelle de génération 2 démarre sur un contrôleur SCSI.
  options:
    source:
      en: |
        `-SourceDisk` takes the number of a physical disk whose data populates a new fixed or dynamic disk; it doesn't link to a parent .vhdx file.
      fr: |
        `-SourceDisk` attend le numéro d'un disque physique dont les données remplissent un nouveau disque fixe ou dynamique ; il ne crée pas de lien avec un fichier .vhdx parent.
    dynamic:
      en: |
        A dynamically expanding disk is an independent empty disk; it doesn't store only the changes from Base.vhdx.
      fr: |
        Un disque dynamiquement extensible est un disque vide indépendant ; il ne stocke pas uniquement les modifications par rapport à Base.vhdx.
    mount:
      en: |
        `Mount-VHD` mounts the disk on the host, not in the virtual machine.
      fr: |
        `Mount-VHD` monte le disque sur l'hôte, pas dans la machine virtuelle.
    setdrive:
      en: |
        `Set-VMHardDiskDrive` changes an existing drive of the VM, and Web2 has none.
      fr: |
        `Set-VMHardDiskDrive` modifie un lecteur existant de la machine virtuelle, et Web2 n'en a aucun.
references:
  - title: New-VHD (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/new-vhd
  - title: Should I create a generation 1 or 2 virtual machine in Hyper-V?
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/plan/should-i-create-a-generation-1-or-2-virtual-machine-in-hyper-v
