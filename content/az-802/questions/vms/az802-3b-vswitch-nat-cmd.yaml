id: az802-3b-vswitch-nat-cmd
objective: "3.1.13"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV8** that runs Windows Server 2025 and has internet access.

    You need to create a virtual switch named **NatSw** for lab virtual machines. The VMs will use addresses in 192.168.50.0/24 with 192.168.50.1 as their default gateway. They must reach the internet through HV8 by using network address translation (NAT), and they must not be connected directly to the physical network.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV8** qui exécute Windows Server 2025 et a accès à Internet.

    Vous devez créer un commutateur virtuel nommé **NatSw** pour des machines virtuelles de laboratoire. Les machines virtuelles utiliseront des adresses de 192.168.50.0/24 avec 192.168.50.1 comme passerelle par défaut. Elles doivent accéder à Internet par HV8 grâce à la traduction d'adresses réseau (NAT) et ne doivent pas être connectées directement au réseau physique.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    New-VMSwitch -Name NatSw [[type]] Internal
    [[gw]] -IPAddress 192.168.50.1 -PrefixLength 24 -InterfaceAlias "vEthernet (NatSw)"
    [[nat]] -Name LabNat -InternalIPInterfaceAddressPrefix 192.168.50.0/24
  slots:
    - id: type
      options:
        - { id: netadapter, text: -NetAdapterName }
        - { id: switchtype, text: -SwitchType }
        - { id: bwmode, text: -MinimumBandwidthMode }
    - id: gw
      options:
        - { id: newroute, text: New-NetRoute }
        - { id: setif, text: Set-NetIPInterface }
        - { id: newip, text: New-NetIPAddress }
    - id: nat
      options:
        - { id: newnat, text: New-NetNat }
        - { id: mapping, text: Add-NetNatStaticMapping }
        - { id: fwrule, text: New-NetFirewallRule }
answer:
  values: { type: switchtype, gw: newip, nat: newnat }
explanation:
  correct:
    en: |
      A NAT network uses an internal switch (`-SwitchType Internal`), which creates a host adapter named `vEthernet (NatSw)` but no link to a physical adapter. `New-NetIPAddress` gives that host adapter the gateway address of the VMs, and `New-NetNat` defines the internal prefix that HV8 translates.
    fr: |
      Un réseau NAT utilise un commutateur interne (`-SwitchType Internal`), qui crée une carte de l'hôte nommée `vEthernet (NatSw)` sans lien avec une carte physique. `New-NetIPAddress` attribue à cette carte de l'hôte l'adresse de passerelle des machines virtuelles, et `New-NetNat` définit le préfixe interne que HV8 traduit.
  options:
    netadapter:
      en: |
        `-NetAdapterName` binds the switch to a physical adapter and makes it external, which connects the VMs directly to the physical network.
      fr: |
        `-NetAdapterName` lie le commutateur à une carte physique et le rend externe, ce qui connecte directement les machines virtuelles au réseau physique.
    newroute:
      en: |
        `New-NetRoute` adds a route; it doesn't assign the gateway address to the host adapter.
      fr: |
        `New-NetRoute` ajoute un itinéraire ; il n'attribue pas l'adresse de passerelle à la carte de l'hôte.
    mapping:
      en: |
        `Add-NetNatStaticMapping` publishes a port of an internal address on an existing NAT network; it doesn't create the NAT network.
      fr: |
        `Add-NetNatStaticMapping` publie un port d'une adresse interne sur un réseau NAT existant ; il ne crée pas le réseau NAT.
references:
  - title: Set up a NAT network
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/setup-nat-network
  - title: New-VMSwitch (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/new-vmswitch
