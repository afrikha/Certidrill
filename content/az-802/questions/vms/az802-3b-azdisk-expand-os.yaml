id: az802-3b-azdisk-expand-os
objective: "3.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named **VM1** that runs Windows Server 2025. VM1 has a 127-GiB Premium SSD OS disk partitioned with GPT. The C: volume uses all the space of the disk.

    You need the C: volume of VM1 to have a size of 256 GiB.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **VM1** qui exécute Windows Server 2025. VM1 possède un disque de système d'exploitation SSD Premium de 127 Gio partitionné en GPT. Le volume C: utilise tout l'espace du disque.

    Vous devez faire en sorte que le volume C: de VM1 ait une taille de 256 Gio.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: stop, text: { en: "Stop VM1 so that it is deallocated.", fr: "Arrêter VM1 pour qu'elle soit libérée." } }
    - { id: size, text: { en: "Set the size of the OS disk to 256 GiB.", fr: "Définir la taille du disque de système d'exploitation sur 256 Gio." } }
    - { id: start, text: { en: "Start VM1.", fr: "Démarrer VM1." } }
    - { id: extend, text: { en: "In Disk Management on VM1, extend the C: volume.", fr: "Dans Gestion des disques sur VM1, étendre le volume C:." } }
    - { id: detach, text: { en: "Detach the OS disk from VM1.", fr: "Détacher le disque de système d'exploitation de VM1." } }
    - { id: init, text: { en: "In Disk Management on VM1, initialize the disk with the GPT partition style.", fr: "Dans Gestion des disques sur VM1, initialiser le disque avec le style de partition GPT." } }
answer:
  sequence: [ stop, size, start, extend ]
explanation:
  correct:
    en: |
      Only eligible data disks can be expanded while the VM runs; an OS disk requires the VM to be deallocated. After you increase the managed disk size and start the VM, the new space is unallocated, so you extend the C: volume inside Windows (Disk Management or DiskPart).
    fr: |
      Seuls les disques de données éligibles peuvent être agrandis pendant que la machine virtuelle s'exécute ; un disque de système d'exploitation exige que la machine virtuelle soit libérée. Une fois la taille du disque managé augmentée et la machine virtuelle démarrée, le nouvel espace n'est pas alloué : vous étendez le volume C: dans Windows (Gestion des disques ou DiskPart).
  options:
    detach:
      en: |
        An OS disk can't be detached from a VM; deallocating the VM is enough to resize it.
      fr: |
        Un disque de système d'exploitation ne peut pas être détaché d'une machine virtuelle ; libérer la machine virtuelle suffit pour le redimensionner.
    init:
      en: |
        Initializing applies to a new empty disk. The OS disk is already initialized with GPT and contains the system volume.
      fr: |
        L'initialisation s'applique à un nouveau disque vide. Le disque de système d'exploitation est déjà initialisé en GPT et contient le volume système.
references:
  - title: Expand Virtual Hard Disks Attached to a Windows VM in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/expand-disks
