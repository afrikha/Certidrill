id: az802-cs3c-checkpoint-types
objective: "3.1.8"
type: dragdrop
caseStudy: az802-cs3c-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the checkpoint settings to meet the checkpoint requirements. Which value of the CheckpointType parameter of Set-VM should you use for each VM? To answer, drag the appropriate values to the correct VMs. Each value may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer les paramètres de points de contrôle pour satisfaire les exigences relatives aux points de contrôle. Quelle valeur du paramètre CheckpointType de Set-VM devez-vous utiliser pour chaque machine virtuelle ? Pour répondre, faites glisser les valeurs appropriées vers les machines virtuelles correctes. Chaque valeur peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: disabled, text: "Disabled" }
    - { id: standard, text: "Standard" }
    - { id: production, text: "Production" }
    - { id: productiononly, text: "ProductionOnly" }
  targets:
    - { id: sql, text: "VM-SQL1" }
    - { id: lab, text: "VM-Lab" }
    - { id: lic, text: "VM-LIC" }
    - { id: wiki, text: "VM-Wiki" }
answer:
  mapping: { sql: productiononly, lab: standard, lic: disabled, wiki: production }
explanation:
  correct:
    en: |
      ProductionOnly creates a production checkpoint and fails if the guest cannot provide one, which is what VM-SQL1 needs. Standard checkpoints capture the memory state of the running VM, so VM-Lab returns to its exact running state. Disabled blocks the creation of checkpoints on VM-LIC. Production creates a production checkpoint when the guest supports it and falls back to a standard checkpoint otherwise, so VM-Wiki always gets a checkpoint.
    fr: |
      ProductionOnly crée un point de contrôle de production et échoue si l'invité ne peut pas en fournir un, ce dont VM-SQL1 a besoin. Les points de contrôle standard capturent l'état de la mémoire de la machine virtuelle en cours d'exécution : VM-Lab revient donc à son état d'exécution exact. Disabled bloque la création de points de contrôle sur VM-LIC. Production crée un point de contrôle de production quand l'invité le prend en charge et se rabat sinon sur un point de contrôle standard : VM-Wiki obtient donc toujours un point de contrôle.
  options:
    production:
      en: |
        For VM-SQL1, Production is wrong because it silently falls back to a standard checkpoint, which is not application-consistent.
      fr: |
        Pour VM-SQL1, Production ne convient pas, car il se rabat sans prévenir sur un point de contrôle standard, qui n'est pas cohérent avec les applications.
    productiononly:
      en: |
        For VM-Wiki, ProductionOnly is wrong because the operation fails when a production checkpoint cannot be created.
      fr: |
        Pour VM-Wiki, ProductionOnly ne convient pas, car l'opération échoue quand un point de contrôle de production ne peut pas être créé.
references:
  - title: Set-VM (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vm
