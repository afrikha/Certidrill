id: az802-3a-dda-limitations
objective: "3.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a standalone Hyper-V host named **HV7** that runs Windows Server 2025. A virtual machine named **VM21** on HV7 uses static memory and runs a rendering application. You assign a GPU to VM21 by using Discrete Device Assignment.

    Which two operations are unavailable for VM21 while the GPU is assigned?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un hôte Hyper-V autonome nommé **HV7** qui exécute Windows Server 2025. Une machine virtuelle nommée **VM21** sur HV7 utilise de la mémoire statique et exécute une application de rendu. Vous attribuez un GPU à VM21 avec l'attribution discrète d'appareil.

    Quelles sont les deux opérations indisponibles pour VM21 tant que le GPU est attribué ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Installing the GPU vendor's driver in the guest operating system of VM21", fr: "Installer le pilote du fabricant du GPU dans le système d'exploitation invité de VM21" } }
    - { id: b, text: { en: "Saving the state of VM21 and restoring it later", fr: "Enregistrer l'état de VM21 et le restaurer plus tard" } }
    - { id: c, text: { en: "Connecting to VM21 by using Remote Desktop from a workstation", fr: "Se connecter à VM21 par le Bureau à distance depuis un poste de travail" } }
    - { id: d, text: { en: "Live migrating VM21 to another Hyper-V host", fr: "Déplacer VM21 vers un autre hôte Hyper-V par migration dynamique" } }
    - { id: e, text: { en: "Running PowerShell commands in VM21 from HV7 by using PowerShell Direct", fr: "Exécuter des commandes PowerShell dans VM21 depuis HV7 avec PowerShell Direct" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      While a device is attached by Discrete Device Assignment, the VM loses save/restore, live migration, Dynamic Memory and the ability to be added to a high availability cluster. The guest owns the physical device, so its state cannot be saved or moved to another host.
    fr: |
      Tant qu'un appareil est attaché par attribution discrète d'appareil, la machine virtuelle perd l'enregistrement/restauration, la migration dynamique, la mémoire dynamique et la possibilité d'être ajoutée à un cluster haute disponibilité. L'invité possède l'appareil physique : son état ne peut ni être enregistré ni être déplacé vers un autre hôte.
  options:
    a: { en: "Installing the vendor driver in the guest is a required step of DDA, not a restricted operation.", fr: "Installer le pilote du fabricant dans l'invité est une étape obligatoire de DDA, pas une opération restreinte." }
    c: { en: "Remote Desktop works through the network of the guest and is not affected by DDA.", fr: "Le Bureau à distance passe par le réseau de l'invité et n'est pas affecté par DDA." }
    e: { en: "PowerShell Direct only needs the VM to run on the local host with a supported guest; DDA does not block it.", fr: "PowerShell Direct exige seulement que la machine virtuelle s'exécute sur l'hôte local avec un invité pris en charge ; DDA ne le bloque pas." }
references:
  - title: Deploy devices by using Discrete Device Assignment
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/plan/plan-for-deploying-devices-using-discrete-device-assignment
