id: az802-3b-aznic-second-nic
objective: "3.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a running Azure virtual machine named **APP9** that runs Windows Server 2025. APP9 has one network interface connected to the Front subnet of a virtual network named VNet1. The size of APP9 supports up to four network interfaces.

    You create a network interface named **NIC2** in the Back subnet of VNet1, in the same region and subscription as APP9.

    You need APP9 to use NIC2 in addition to its current network interface.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle Azure en cours d'exécution nommée **APP9** qui exécute Windows Server 2025. APP9 possède une interface réseau connectée au sous-réseau Front d'un réseau virtuel nommé VNet1. La taille d'APP9 prend en charge jusqu'à quatre interfaces réseau.

    Vous créez une interface réseau nommée **NIC2** dans le sous-réseau Back de VNet1, dans la même région et le même abonnement qu'APP9.

    Vous devez faire en sorte qu'APP9 utilise NIC2 en plus de son interface réseau actuelle.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable IP forwarding on NIC2.", fr: "Activer le transfert IP sur NIC2." } }
    - { id: b, text: { en: "Attach NIC2 to APP9 while it runs, and then restart Windows.", fr: "Attacher NIC2 à APP9 pendant son exécution, puis redémarrer Windows." } }
    - { id: c, text: { en: "Stop APP9 so that it is deallocated.", fr: "Arrêter APP9 pour qu'elle soit libérée." } }
    - { id: d, text: { en: "Set NIC2 as the primary network interface of APP9.", fr: "Définir NIC2 comme interface réseau principale d'APP9." } }
    - { id: e, text: { en: "Attach NIC2 to APP9, and then start APP9.", fr: "Attacher NIC2 à APP9, puis démarrer APP9." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      To add a network interface to an existing VM, you deallocate the VM, attach the interface, and then start the VM. All the network interfaces of a VM must be in the same virtual network, which is the case for the Front and Back subnets of VNet1, and the VM size limits their number.
    fr: |
      Pour ajouter une interface réseau à une machine virtuelle existante, vous libérez la machine virtuelle, attachez l'interface, puis démarrez la machine virtuelle. Toutes les interfaces réseau d'une machine virtuelle doivent se trouver dans le même réseau virtuel, ce qui est le cas des sous-réseaux Front et Back de VNet1, et la taille de la machine virtuelle limite leur nombre.
  options:
    a:
      en: |
        IP forwarding is needed only when the VM routes traffic for other destinations, such as a network virtual appliance.
      fr: |
        Le transfert IP n'est nécessaire que si la machine virtuelle route du trafic pour d'autres destinations, comme une appliance virtuelle réseau.
    b:
      en: |
        A network interface is added to an existing VM while it is deallocated, not while it runs; restarting Windows doesn't deallocate the VM.
      fr: |
        Une interface réseau s'ajoute à une machine virtuelle existante pendant qu'elle est libérée, pas pendant son exécution ; redémarrer Windows ne libère pas la machine virtuelle.
    d:
      en: |
        The existing network interface is already primary; a multi-NIC VM needs one primary interface, and NIC2 can stay secondary.
      fr: |
        L'interface réseau existante est déjà principale ; une machine virtuelle à plusieurs interfaces a besoin d'une interface principale, et NIC2 peut rester secondaire.
references:
  - title: Create and manage Windows VMs in Azure that use multiple NICs
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/multiple-nics
