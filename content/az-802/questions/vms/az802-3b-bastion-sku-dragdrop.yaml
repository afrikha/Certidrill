id: az802-3b-bastion-sku-dragdrop
objective: "3.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Your company plans to deploy Azure Bastion for four projects. Each project has its own virtual network that contains Windows Server 2025 virtual machines.

    For each project, you need to choose the Azure Bastion SKU that meets the requirement at the lowest cost.

    Which SKU should you choose for each project? To answer, drag the appropriate SKUs to the correct projects. Each SKU may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre entreprise prévoit de déployer Azure Bastion pour quatre projets. Chaque projet possède son propre réseau virtuel qui contient des machines virtuelles Windows Server 2025.

    Pour chaque projet, vous devez choisir la référence SKU d'Azure Bastion qui répond à l'exigence au coût le plus bas.

    Quelle référence SKU devez-vous choisir pour chaque projet ? Pour répondre, faites glisser les références SKU appropriées vers les projets correspondants. Chaque référence SKU peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: dev, text: Developer }
    - { id: basic, text: Basic }
    - { id: std, text: Standard }
    - { id: prem, text: Premium }
  targets:
    - id: lab
      text: { en: "Lab: an administrator occasionally connects to one VM at a time from the Azure portal. All the VMs are in the same virtual network as Bastion.", fr: "Lab : un administrateur se connecte de temps en temps à une machine virtuelle à la fois depuis le portail Azure. Toutes les machines virtuelles sont dans le même réseau virtuel que Bastion." }
    - id: hub
      text: { en: "Hub: administrators connect from the Azure portal to VMs in two spoke virtual networks peered with the hub.", fr: "Hub : des administrateurs se connectent depuis le portail Azure à des machines virtuelles de deux réseaux virtuels spoke reliés au hub par peering." }
    - id: ops
      text: { en: "Ops: administrators connect by using the Remote Desktop client installed on their computers and upload files to the VMs.", fr: "Ops : des administrateurs se connectent avec le client Bureau à distance installé sur leurs ordinateurs et chargent des fichiers sur les machines virtuelles." }
    - id: fin
      text: { en: "Finance: the Bastion deployment must not have a public IP address.", fr: "Finance : le déploiement Bastion ne doit pas avoir d'adresse IP publique." }
answer:
  mapping: { lab: dev, hub: basic, ops: std, fin: prem }
explanation:
  correct:
    en: |
      Developer is free and connects from the portal to one VM at a time in the same virtual network, without a dedicated host. Basic is the lowest paid SKU and adds virtual network peering support. Connecting with the native client and uploading or downloading files require Standard. Only Premium supports a private-only deployment, without a public IP address.
    fr: |
      Developer est gratuit et permet de se connecter depuis le portail à une machine virtuelle à la fois dans le même réseau virtuel, sans hôte dédié. Basic est la référence payante la moins chère et ajoute la prise en charge du peering de réseaux virtuels. La connexion avec le client natif et le chargement ou le téléchargement de fichiers exigent Standard. Seul Premium prend en charge un déploiement privé uniquement, sans adresse IP publique.
  options:
    dev:
      en: |
        Developer doesn't support peered virtual networks, the native client or private-only deployment.
      fr: |
        Developer ne prend pas en charge les réseaux virtuels reliés par peering, le client natif ni le déploiement privé uniquement.
    basic:
      en: |
        Basic doesn't support the native client, file transfer or private-only deployment.
      fr: |
        Basic ne prend pas en charge le client natif, le transfert de fichiers ni le déploiement privé uniquement.
references:
  - title: Choose the right Azure Bastion SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
