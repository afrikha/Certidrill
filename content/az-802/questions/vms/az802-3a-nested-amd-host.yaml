id: az802-3a-nested-amd-host
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a physical server named **HV4** that has AMD EPYC processors, runs Windows Server 2019 Datacenter, and has the Hyper-V server role installed. HV4 hosts a virtual machine named **VM10** that has a configuration version of **9.0**.

    You turn off VM10 and run `Set-VMProcessor -VMName VM10 -ExposeVirtualizationExtensions $true`. After you start VM10, the installation of the Hyper-V role in VM10 fails because the processor does not provide the required virtualization capabilities.

    You need to run nested virtual machines in VM10.

    What should you do?
  fr: |
    Vous disposez d'un serveur physique nommé **HV4** qui dispose de processeurs AMD EPYC, exécute Windows Server 2019 Datacenter et sur lequel le rôle serveur Hyper-V est installé. HV4 héberge une machine virtuelle nommée **VM10** dont la version de configuration est **9.0**.

    Vous arrêtez VM10 et exécutez `Set-VMProcessor -VMName VM10 -ExposeVirtualizationExtensions $true`. Après le démarrage de VM10, l'installation du rôle Hyper-V dans VM10 échoue, car le processeur ne fournit pas les capacités de virtualisation nécessaires.

    Vous devez exécuter des machines virtuelles imbriquées dans VM10.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable MAC address spoofing on the network adapter of VM10, and then install the Hyper-V role in VM10 again.", fr: "Activer l'usurpation d'adresses MAC sur la carte réseau de VM10, puis installer de nouveau le rôle Hyper-V dans VM10." } }
    - { id: b, text: { en: "Upgrade HV4 to Windows Server 2025, and then upgrade the configuration version of VM10.", fr: "Mettre à niveau HV4 vers Windows Server 2025, puis mettre à niveau la version de configuration de VM10." } }
    - { id: c, text: { en: "Upgrade the configuration version of VM10 on HV4, and then expose the virtualization extensions again.", fr: "Mettre à niveau la version de configuration de VM10 sur HV4, puis exposer de nouveau les extensions de virtualisation." } }
    - { id: d, text: { en: "Upgrade HV4 to Windows Server 2025, and then expose the virtualization extensions of VM10 again.", fr: "Mettre à niveau HV4 vers Windows Server 2025, puis exposer de nouveau les extensions de virtualisation de VM10." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      On AMD EPYC or Ryzen processors, nested virtualization requires a Hyper-V host that runs Windows Server 2022 or later and a VM configuration version of 9.3 or higher. HV4 fails both conditions, so you upgrade the host first and then upgrade the configuration version of VM10 with Update-VMVersion while it is turned off.
    fr: |
      Avec des processeurs AMD EPYC ou Ryzen, la virtualisation imbriquée exige un hôte Hyper-V sous Windows Server 2022 ou ultérieur et une version de configuration de machine virtuelle 9.3 ou supérieure. HV4 ne remplit aucune des deux conditions : vous mettez d'abord l'hôte à niveau, puis la version de configuration de VM10 avec Update-VMVersion pendant qu'elle est arrêtée.
  options:
    a: { en: "MAC address spoofing only gives the nested virtual machines network access; it does not provide virtualization capabilities.", fr: "L'usurpation d'adresses MAC donne seulement l'accès réseau aux machines virtuelles imbriquées ; elle ne fournit pas les capacités de virtualisation." }
    c: { en: "A host that runs Windows Server 2019 does not meet the AMD host requirement of Windows Server 2022 or later, whatever the configuration version.", fr: "Un hôte sous Windows Server 2019 ne remplit pas l'exigence AMD d'un hôte Windows Server 2022 ou ultérieur, quelle que soit la version de configuration." }
    d: { en: "After the host upgrade, VM10 keeps configuration version 9.0, which is below the 9.3 minimum for AMD processors.", fr: "Après la mise à niveau de l'hôte, VM10 garde la version de configuration 9.0, inférieure au minimum de 9.3 pour les processeurs AMD." }
references:
  - title: Run Hyper-V in a Virtual Machine with Nested Virtualization
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/enable-nested-virtualization
  - title: Upgrade virtual machine version in Hyper-V on Windows or Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/deploy/upgrade-virtual-machine-version-in-hyper-v-on-windows-or-windows-server
