id: az802-3b-replica-extended-frequency
objective: "3.1.14"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You have three Hyper-V hosts that run Windows Server 2025: **HV-PAR1**, **HV-LYO1** and **HV-MRS1**. A virtual machine named **SALES1** runs on HV-PAR1 and replicates to HV-LYO1 every 30 seconds by using Hyper-V Replica.

    You need to configure extended replication of SALES1 from HV-LYO1 to HV-MRS1. The copy on HV-MRS1 must be as current as possible.

    Which replication frequency should you select for the extended replication?
  fr: |
    Vous disposez de trois hôtes Hyper-V qui exécutent Windows Server 2025 : **HV-PAR1**, **HV-LYO1** et **HV-MRS1**. Une machine virtuelle nommée **SALES1** s'exécute sur HV-PAR1 et est répliquée vers HV-LYO1 toutes les 30 secondes avec Hyper-V Réplica.

    Vous devez configurer la réplication étendue de SALES1 de HV-LYO1 vers HV-MRS1. La copie sur HV-MRS1 doit être aussi à jour que possible.

    Quelle fréquence de réplication devez-vous sélectionner pour la réplication étendue ?
body:
  options:
    - { id: s30, text: { en: "30 seconds", fr: "30 secondes" } }
    - { id: m5, text: { en: "5 minutes", fr: "5 minutes" } }
    - { id: m15, text: { en: "15 minutes", fr: "15 minutes" } }
answer: { optionId: m5 }
explanation:
  correct:
    en: |
      Extended replication copies a VM from the replica server to a third server. It supports only the 5-minute and 15-minute frequencies, not 30 seconds, so 5 minutes is the most frequent interval available for the HV-LYO1 to HV-MRS1 link.
    fr: |
      La réplication étendue copie une machine virtuelle du serveur réplica vers un troisième serveur. Elle ne prend en charge que les fréquences de 5 minutes et de 15 minutes, pas 30 secondes : 5 minutes est donc l'intervalle le plus fréquent disponible pour la liaison de HV-LYO1 vers HV-MRS1.
  options:
    s30:
      en: |
        30 seconds is available for the first replication relationship only; extended replication doesn't support it.
      fr: |
        30 secondes n'est disponible que pour la première relation de réplication ; la réplication étendue ne le prend pas en charge.
    m15:
      en: |
        15 minutes is supported but replicates less often than 5 minutes, so the copy is less current.
      fr: |
        15 minutes est pris en charge, mais réplique moins souvent que 5 minutes : la copie est moins à jour.
references:
  - title: Replicate a virtual machine with Hyper-V Replica
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/replication-virtual-machines
