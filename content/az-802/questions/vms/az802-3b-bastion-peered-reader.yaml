id: az802-3b-bastion-peered-reader
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure subscription that contains the following resources:

    - A virtual network named **VNet-Hub** that contains an Azure Bastion host named **Bastion1** that uses the Standard SKU
    - A virtual network named **VNet-Spoke1** that is peered with VNet-Hub
    - A virtual machine named **VM5** that runs Windows Server 2025 and is connected to VNet-Spoke1

    A user named User1 has the Reader role on VM5, on the network interface of VM5 and on Bastion1. User1 is a member of the Remote Desktop Users group on VM5. User1 can't connect to VM5 through Bastion1.

    You need to ensure that User1 can connect to VM5 through Bastion1. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez d'un abonnement Azure qui contient les ressources suivantes :

    - Un réseau virtuel nommé **VNet-Hub** qui contient un hôte Azure Bastion nommé **Bastion1** utilisant la référence SKU Standard
    - Un réseau virtuel nommé **VNet-Spoke1** relié à VNet-Hub par peering
    - Une machine virtuelle nommée **VM5** qui exécute Windows Server 2025 et est connectée à VNet-Spoke1

    Un utilisateur nommé User1 dispose du rôle Reader sur VM5, sur l'interface réseau de VM5 et sur Bastion1. User1 est membre du groupe Utilisateurs du Bureau à distance sur VM5. User1 ne parvient pas à se connecter à VM5 par Bastion1.

    Vous devez faire en sorte qu'User1 puisse se connecter à VM5 par Bastion1. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign User1 the Reader role on VNet-Spoke1.", fr: "Attribuer à User1 le rôle Reader sur VNet-Spoke1." } }
    - { id: b, text: { en: "Assign User1 the Virtual Machine Contributor role on VM5.", fr: "Attribuer à User1 le rôle Virtual Machine Contributor sur VM5." } }
    - { id: c, text: { en: "Assign User1 the Network Contributor role on VNet-Hub.", fr: "Attribuer à User1 le rôle Network Contributor sur VNet-Hub." } }
    - { id: d, text: { en: "Upgrade Bastion1 to the Premium SKU.", fr: "Mettre à niveau Bastion1 vers la référence SKU Premium." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      To connect through Bastion, a user needs the Reader role on the VM, on its network interface and on the Bastion resource. When Bastion is deployed in a peered virtual network, the user also needs Reader on the virtual network of the target VM, which is VNet-Spoke1 here.
    fr: |
      Pour se connecter par Bastion, un utilisateur a besoin du rôle Reader sur la machine virtuelle, sur son interface réseau et sur la ressource Bastion. Quand Bastion est déployé dans un réseau virtuel relié par peering, l'utilisateur a aussi besoin du rôle Reader sur le réseau virtuel de la machine virtuelle cible, ici VNet-Spoke1.
  options:
    b:
      en: |
        Virtual Machine Contributor grants management permissions that the connection doesn't need, and it doesn't cover the virtual network of the VM.
      fr: |
        Virtual Machine Contributor accorde des autorisations de gestion dont la connexion n'a pas besoin, et il ne couvre pas le réseau virtuel de la machine virtuelle.
    c:
      en: |
        The missing permission is read access on the virtual network of the target VM (VNet-Spoke1), and a Contributor role exceeds least privilege.
      fr: |
        L'autorisation manquante est l'accès en lecture au réseau virtuel de la machine virtuelle cible (VNet-Spoke1), et un rôle Contributor dépasse le moindre privilège.
    d:
      en: |
        The Basic and Standard SKUs already support VMs in peered virtual networks; the problem is a missing role assignment.
      fr: |
        Les références SKU Basic et Standard prennent déjà en charge les machines virtuelles des réseaux virtuels reliés par peering ; le problème est une attribution de rôle manquante.
references:
  - title: Azure Bastion FAQ
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-faq
