id: az802-3b-aznic-static-ip
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure virtual machine named **DNS1** that runs Windows Server 2025 and the DNS Server role. DNS1 is connected to a subnet with the range 10.0.1.0/24 and currently has the dynamically assigned private IP address 10.0.1.4. The virtual network uses 10.0.1.4 as its custom DNS server.

    You need to ensure that DNS1 keeps the IP address 10.0.1.4, including after it is deallocated.

    What should you do?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **DNS1** qui exécute Windows Server 2025 et le rôle Serveur DNS. DNS1 est connectée à un sous-réseau de plage 10.0.1.0/24 et possède actuellement l'adresse IP privée attribuée dynamiquement 10.0.1.4. Le réseau virtuel utilise 10.0.1.4 comme serveur DNS personnalisé.

    Vous devez faire en sorte que DNS1 conserve l'adresse IP 10.0.1.4, y compris après sa libération.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In Windows on DNS1, assign the static IPv4 address 10.0.1.4 to the network adapter.", fr: "Dans Windows sur DNS1, attribuer l'adresse IPv4 statique 10.0.1.4 à la carte réseau." } }
    - { id: b, text: { en: "Associate a static Standard SKU public IP address with the network interface of DNS1.", fr: "Associer une adresse IP publique statique de référence SKU Standard à l'interface réseau de DNS1." } }
    - { id: c, text: { en: "Set the allocation of the IP configuration of the DNS1 network interface to Static.", fr: "Définir l'allocation de la configuration IP de l'interface réseau de DNS1 sur Statique." } }
    - { id: d, text: { en: "Create a reservation for 10.0.1.4 on a Windows Server DHCP server deployed in the subnet.", fr: "Créer une réservation pour 10.0.1.4 sur un serveur DHCP Windows Server déployé dans le sous-réseau." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Private IP addresses of Azure VMs are assigned by Azure DHCP from the IP configuration of the network interface. Deallocating a VM releases a dynamic address; a Static allocation keeps the address until the network interface is deleted, and Azure DHCP still delivers it to Windows.
    fr: |
      Les adresses IP privées des machines virtuelles Azure sont attribuées par le service DHCP d'Azure à partir de la configuration IP de l'interface réseau. La libération d'une machine virtuelle libère une adresse dynamique ; une allocation Statique conserve l'adresse jusqu'à la suppression de l'interface réseau, et le DHCP d'Azure la fournit toujours à Windows.
  options:
    a:
      en: |
        You should never set the primary IP address manually inside the guest: Azure still allocates the address dynamically and can give it to another resource after deallocation, which breaks connectivity.
      fr: |
        Vous ne devez jamais définir manuellement l'adresse IP principale dans l'invité : Azure alloue toujours l'adresse dynamiquement et peut l'attribuer à une autre ressource après la libération, ce qui coupe la connectivité.
    b:
      en: |
        A public IP address doesn't change the private address that the other VMs use as their DNS server.
      fr: |
        Une adresse IP publique ne modifie pas l'adresse privée que les autres machines virtuelles utilisent comme serveur DNS.
    d:
      en: |
        Azure VMs get their private addresses from Azure DHCP, not from a DHCP server that runs in the virtual network.
      fr: |
        Les machines virtuelles Azure obtiennent leurs adresses privées du DHCP d'Azure, pas d'un serveur DHCP exécuté dans le réseau virtuel.
references:
  - title: Private IP addresses in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/private-ip-addresses
  - title: Configure IP addresses for an Azure network interface
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/virtual-network-network-interface-addresses
