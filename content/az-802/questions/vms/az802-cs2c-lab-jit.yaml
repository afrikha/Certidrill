id: az802-cs2c-lab-jit
objective: "3.2.4"
type: single
caseStudy: az802-cs2c-graphic-design-institute
difficulty: 1
status: draft
stem:
  en: |
    You need to enable JIT VM access for VM-LAB1 and VM-LAB2 to meet the lab access requirement.

    What should you do first?
  fr: |
    Vous devez activer l'accès JIT aux machines virtuelles pour VM-LAB1 et VM-LAB2 afin de satisfaire l'exigence d'accès aux laboratoires.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Enable Microsoft Defender for Servers Plan 2 on the subscription.", fr: "Activer Microsoft Defender pour les serveurs Plan 2 sur l'abonnement." } }
    - { id: b, text: { en: "Deploy Azure Bastion in VNet-Hub.", fr: "Déployer Azure Bastion dans VNet-Hub." } }
    - { id: c, text: { en: "Associate a second network security group with the network interfaces of the VMs.", fr: "Associer un deuxième groupe de sécurité réseau aux interfaces réseau des machines virtuelles." } }
    - { id: d, text: { en: "Enable the Defender Cloud Security Posture Management (CSPM) plan on the subscription.", fr: "Activer le plan Defender Cloud Security Posture Management (CSPM) sur l'abonnement." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      JIT VM access is a feature of Microsoft Defender for Servers Plan 2, and the subscription has only Plan 1. The VMs already meet the other prerequisite, because NSG-Lab protects snet-lab and JIT can manage its rules.
    fr: |
      L'accès JIT aux machines virtuelles est une fonctionnalité de Microsoft Defender pour les serveurs Plan 2, et l'abonnement ne dispose que du Plan 1. Les machines virtuelles satisfont déjà l'autre prérequis, car NSG-Lab protège snet-lab et JIT peut gérer ses règles.
  options:
    b:
      en: |
        Azure Bastion provides browser-based RDP without exposing the VMs, but it is not JIT VM access and does not enable it.
      fr: |
        Azure Bastion fournit un accès RDP par le navigateur sans exposer les machines virtuelles, mais ce n'est pas l'accès JIT et il ne l'active pas.
    c:
      en: |
        JIT needs a network security group or an Azure Firewall, and NSG-Lab already protects the subnet.
      fr: |
        JIT a besoin d'un groupe de sécurité réseau ou d'un pare-feu Azure Firewall, et NSG-Lab protège déjà le sous-réseau.
    d:
      en: |
        The Defender CSPM plan does not include JIT VM access, which requires Defender for Servers Plan 2.
      fr: |
        Le plan Defender CSPM n'inclut pas l'accès JIT aux machines virtuelles, qui exige Defender pour les serveurs Plan 2.
references:
  - title: Enable just-in-time access
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-usage
