id: az802-3a-psd-not-hv-admin
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV2** that runs Windows Server 2025. HV2 hosts a virtual machine named **VM7** that runs Windows Server 2025. VM7 is running and connected to an external virtual switch.

    A user named **User1** is a member of the Remote Desktop Users group on HV2 and is not a member of any other local group on HV2. User1 knows the password of the local Administrator account of VM7.

    User1 signs in to HV2 by using Remote Desktop and runs the following command.

    `Invoke-Command -VMName VM7 -Credential VM7\Administrator -ScriptBlock { Get-Service }`

    The command fails with an error stating that the VMName parameter does not resolve to any virtual machine. When a Hyper-V administrator runs `Get-VM` on HV2, VM7 is listed as running.

    You need to ensure that User1 can run commands in VM7 by using PowerShell Direct. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV2** qui exécute Windows Server 2025. HV2 héberge une machine virtuelle nommée **VM7** qui exécute Windows Server 2025. VM7 est en cours d'exécution et connectée à un commutateur virtuel externe.

    Un utilisateur nommé **User1** est membre du groupe Remote Desktop Users sur HV2 et n'est membre d'aucun autre groupe local de HV2. User1 connaît le mot de passe du compte Administrator local de VM7.

    User1 se connecte à HV2 par le Bureau à distance et exécute la commande suivante.

    `Invoke-Command -VMName VM7 -Credential VM7\Administrator -ScriptBlock { Get-Service }`

    La commande échoue avec une erreur indiquant que le paramètre VMName ne correspond à aucune machine virtuelle. Quand un administrateur Hyper-V exécute `Get-VM` sur HV2, VM7 apparaît en cours d'exécution.

    Vous devez faire en sorte que User1 puisse exécuter des commandes dans VM7 avec PowerShell Direct. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add User1 to the Remote Management Users group in VM7.", fr: "Ajouter User1 au groupe Remote Management Users dans VM7." } }
    - { id: b, text: { en: "Add User1 to the Hyper-V Administrators group on HV2.", fr: "Ajouter User1 au groupe Hyper-V Administrators sur HV2." } }
    - { id: c, text: { en: "Add User1 to the Administrators group on HV2.", fr: "Ajouter User1 au groupe Administrators sur HV2." } }
    - { id: d, text: { en: "Run Enable-PSRemoting -Force in VM7.", fr: "Exécuter Enable-PSRemoting -Force dans VM7." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      PowerShell Direct requires the user to be signed in to the host as a Hyper-V administrator, in addition to valid guest credentials. When the user is not one, the VM name cannot be resolved, which matches the error even though VM7 exists and runs. Membership in Hyper-V Administrators grants that right without making User1 a full administrator of HV2.
    fr: |
      PowerShell Direct exige que l'utilisateur soit connecté à l'hôte en tant qu'administrateur Hyper-V, en plus d'informations d'identification valides de l'invité. Quand ce n'est pas le cas, le nom de la machine virtuelle ne peut pas être résolu, ce qui correspond à l'erreur alors que VM7 existe et s'exécute. L'appartenance à Hyper-V Administrators accorde ce droit sans faire de User1 un administrateur complet de HV2.
  options:
    a: { en: "Rights in the guest are already provided by the VM7\\Administrator credentials; the failure is on the host side.", fr: "Les droits dans l'invité sont déjà fournis par les informations d'identification VM7\\Administrator ; l'échec se produit côté hôte." }
    c: { en: "Administrators on HV2 would work, but it grants far more than Hyper-V Administrators and breaks least privilege.", fr: "Administrators sur HV2 fonctionnerait, mais accorde bien plus que Hyper-V Administrators et ne respecte pas le moindre privilège." }
    d: { en: "PowerShell Direct does not use WinRM remoting in the guest, so enabling it does not fix a host-side permission problem.", fr: "PowerShell Direct n'utilise pas la communication à distance WinRM de l'invité : l'activer ne corrige pas un problème d'autorisation côté hôte." }
references:
  - title: Manage Windows virtual machines with PowerShell Direct
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/manage/manage-windows-virtual-machines-with-powershell-direct
