id: az802-3a-mem-priority
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV6** that runs Windows Server 2025. HV6 hosts 12 virtual machines that use Dynamic Memory. During peak hours, the virtual machines request more memory than HV6 can provide.

    You need to ensure that a virtual machine named **VM-SQL1** receives memory before the other virtual machines when HV6 runs short of memory.

    What should you run on HV6?
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV6** qui exécute Windows Server 2025. HV6 héberge 12 machines virtuelles qui utilisent la mémoire dynamique. Aux heures de pointe, les machines virtuelles demandent plus de mémoire que HV6 ne peut en fournir.

    Vous devez faire en sorte qu'une machine virtuelle nommée **VM-SQL1** reçoive de la mémoire avant les autres machines virtuelles quand HV6 manque de mémoire.

    Que devez-vous exécuter sur HV6 ?
body:
  options:
    - { id: a, text: "Set-VMProcessor -VMName VM-SQL1 -RelativeWeight 10000" }
    - { id: b, text: "Set-VMMemory -VMName VM-SQL1 -Buffer 100" }
    - { id: c, text: "Set-VMMemory -VMName VM-SQL1 -MaximumBytes 64GB" }
    - { id: d, text: "Set-VMMemory -VMName VM-SQL1 -Priority 100" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `-Priority` of Set-VMMemory sets the memory weight of a VM, from 0 to 100, relative to the other virtual machines on the host. When the host cannot satisfy every request, VMs with a higher weight receive memory first, so VM-SQL1 gets the highest value.
    fr: |
      `-Priority` de Set-VMMemory définit le poids de la mémoire d'une machine virtuelle, de 0 à 100, par rapport aux autres machines virtuelles de l'hôte. Quand l'hôte ne peut pas satisfaire toutes les demandes, les machines virtuelles de poids plus élevé reçoivent la mémoire en premier : VM-SQL1 reçoit la valeur la plus haute.
  options:
    a: { en: "RelativeWeight prioritizes processor time, not memory.", fr: "RelativeWeight donne la priorité au temps processeur, pas à la mémoire." }
    b: { en: "The buffer asks for extra memory above demand, but it does not rank VM-SQL1 ahead of the other VMs when memory is scarce.", fr: "La mémoire tampon demande de la mémoire en plus de la demande, mais ne place pas VM-SQL1 devant les autres machines virtuelles quand la mémoire manque." }
    c: { en: "A higher maximum only raises the ceiling; the host is already unable to satisfy current requests.", fr: "Un maximum plus élevé ne fait que relever le plafond ; l'hôte ne peut déjà pas satisfaire les demandes actuelles." }
references:
  - title: Set-VMMemory (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vmmemory
