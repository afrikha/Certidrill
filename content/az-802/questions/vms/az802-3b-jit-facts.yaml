id: az802-3b-jit-facts
objective: "3.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure subscription that has Microsoft Defender for Servers Plan 2 enabled. The subscription contains a virtual machine named **VM1** that runs Windows Server 2025. A network security group named **NSG1** is associated with the network interface of VM1. NSG1 has no custom rule for port 3389.

    You enable just-in-time (JIT) VM access on VM1 for port 3389 with the default settings.

    A user named Admin1 then requests access to port 3389 of VM1 for two hours from the IP address 203.0.113.10, and the request is approved.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un abonnement Azure dans lequel Microsoft Defender pour les serveurs Plan 2 est activé. L'abonnement contient une machine virtuelle nommée **VM1** qui exécute Windows Server 2025. Un groupe de sécurité réseau nommé **NSG1** est associé à l'interface réseau de VM1. NSG1 n'a aucune règle personnalisée pour le port 3389.

    Vous activez l'accès juste-à-temps (JIT) aux machines virtuelles sur VM1 pour le port 3389 avec les paramètres par défaut.

    Un utilisateur nommé Admin1 demande ensuite l'accès au port 3389 de VM1 pendant deux heures depuis l'adresse IP 203.0.113.10, et la demande est approuvée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Before the request of Admin1, NSG1 contains a rule that denies inbound traffic to port 3389.
        fr: Avant la demande d'Admin1, NSG1 contient une règle qui refuse le trafic entrant vers le port 3389.
    - id: s2
      text:
        en: During the two hours, NSG1 allows RDP connections to VM1 from 198.51.100.20.
        fr: Pendant les deux heures, NSG1 autorise les connexions RDP vers VM1 depuis 198.51.100.20.
    - id: s3
      text:
        en: An RDP session that Admin1 opens 10 minutes before the end of the two hours is disconnected when the access period expires.
        fr: Une session RDP qu'Admin1 ouvre 10 minutes avant la fin des deux heures est déconnectée à l'expiration de la période d'accès.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      When JIT is enabled, Defender for Cloud ensures that deny all inbound rules exist for the selected ports in the NSG. An approved request adds allow rules for the requested ports from the requester's IP address only, for the requested time. When the period expires, the NSG rules are restored, but connections that are already established aren't interrupted.
    fr: |
      Quand JIT est activé, Defender pour le cloud s'assure que des règles de refus de tout le trafic entrant existent pour les ports sélectionnés dans le groupe de sécurité réseau. Une demande approuvée ajoute des règles d'autorisation pour les ports demandés depuis la seule adresse IP du demandeur, pendant la durée demandée. À l'expiration de la période, les règles du groupe de sécurité réseau sont restaurées, mais les connexions déjà établies ne sont pas interrompues.
references:
  - title: Understand Just-in-time Virtual Machine Access
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-overview
