id: az802-3b-avail-existing-vm
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named **App3** that runs Windows Server 2025 in a resource group named RG1. App3 uses managed disks and isn't in an availability set.

    You create an availability set named **AS-App** in RG1. You need App3 to be a member of AS-App. App3 must keep its OS disk and data disks.

    What should you do?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **App3** qui exécute Windows Server 2025 dans un groupe de ressources nommé RG1. App3 utilise des disques managés et n'appartient à aucun groupe à haute disponibilité.

    Vous créez un groupe à haute disponibilité nommé **AS-App** dans RG1. Vous devez faire en sorte qu'App3 soit membre d'AS-App. App3 doit conserver son disque de système d'exploitation et ses disques de données.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Stop and deallocate App3, and then change its availability set to AS-App in the Azure portal.", fr: "Arrêter et libérer App3, puis remplacer son groupe à haute disponibilité par AS-App dans le portail Azure." } }
    - { id: b, text: { en: "Delete App3 without deleting its disks, and then recreate App3 in AS-App from its existing disks.", fr: "Supprimer App3 sans supprimer ses disques, puis recréer App3 dans AS-App à partir de ses disques existants." } }
    - { id: c, text: { en: "Move App3 to AS-App by using the Move operation of the Azure portal.", fr: "Déplacer App3 vers AS-App avec l'opération Move du portail Azure." } }
    - { id: d, text: { en: "Redeploy App3, and then select AS-App when the redeployment completes.", fr: "Redéployer App3, puis sélectionner AS-App à la fin du redéploiement." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A VM can be added to an availability set only when the VM is created. To change it, you delete the VM while keeping its disks and network interface, and then create the VM again in the availability set by attaching the existing OS disk and data disks.
    fr: |
      Une machine virtuelle ne peut être ajoutée à un groupe à haute disponibilité qu'à sa création. Pour changer cela, vous supprimez la machine virtuelle en conservant ses disques et son interface réseau, puis vous la recréez dans le groupe à haute disponibilité en attachant le disque de système d'exploitation et les disques de données existants.
  options:
    a:
      en: |
        Deallocation doesn't make the availability set editable: the setting can't be changed on an existing VM.
      fr: |
        La libération ne rend pas le groupe à haute disponibilité modifiable : ce paramètre ne peut pas être changé sur une machine virtuelle existante.
    c:
      en: |
        The Move operation moves resources to another resource group or subscription; it doesn't place a VM in an availability set.
      fr: |
        L'opération Move déplace des ressources vers un autre groupe de ressources ou un autre abonnement ; elle ne place pas une machine virtuelle dans un groupe à haute disponibilité.
    d:
      en: |
        Redeploying moves the VM to a new host in Azure, but its availability set membership still can't be changed afterward.
      fr: |
        Le redéploiement déplace la machine virtuelle vers un nouvel hôte dans Azure, mais son appartenance à un groupe à haute disponibilité ne peut toujours pas être changée ensuite.
references:
  - title: Change a VM's availability set by using Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/change-availability-set
