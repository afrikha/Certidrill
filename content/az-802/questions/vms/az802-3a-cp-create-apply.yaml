id: az802-3a-cp-create-apply
objective: "3.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV1** that hosts a virtual machine named **VM26**. VM26 has a checkpoint named **Baseline**.

    You need to return VM26 to the Baseline checkpoint to repeat a test. You must be able to return VM26 to its current state later.

    In Hyper-V Manager, you right-click Baseline and select **Apply**. Which option should you select in the Apply Checkpoint dialog box?
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV1** qui héberge une machine virtuelle nommée **VM26**. VM26 possède un point de contrôle nommé **Baseline**.

    Vous devez ramener VM26 au point de contrôle Baseline pour répéter un test. Vous devez pouvoir ramener ensuite VM26 à son état actuel.

    Dans le Gestionnaire Hyper-V, vous cliquez avec le bouton droit sur Baseline et sélectionnez **Apply**. Quelle option devez-vous sélectionner dans la boîte de dialogue Apply Checkpoint ?
body:
  options:
    - { id: a, text: "Apply" }
    - { id: b, text: "Create Checkpoint and Apply" }
    - { id: c, text: "Cancel" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      **Create Checkpoint and Apply** first creates a new checkpoint of the current state of VM26, then applies Baseline. You can later apply the new checkpoint to return to the current state.
    fr: |
      **Create Checkpoint and Apply** crée d'abord un nouveau point de contrôle de l'état actuel de VM26, puis applique Baseline. Vous pourrez ensuite appliquer le nouveau point de contrôle pour revenir à l'état actuel.
  options:
    a: { en: "Apply reverts VM26 without saving its current state, and the operation cannot be undone.", fr: "Apply rétablit VM26 sans enregistrer son état actuel, et l'opération est irréversible." }
    c: { en: "Cancel closes the dialog box without applying Baseline.", fr: "Cancel ferme la boîte de dialogue sans appliquer Baseline." }
references:
  - title: Using checkpoints
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/manage/enable-or-disable-checkpoints-in-hyper-v
