id: az802-3b-vswitch-sriov
objective: "3.1.13"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV9** that runs Windows Server 2025. HV9 has an SR-IOV-capable network adapter named Slot2, and SR-IOV is enabled in the firmware of HV9.

    Last year, an administrator created an external virtual switch by running `New-VMSwitch -Name ExtFast -NetAdapterName "Slot2" -AllowManagementOS $false`.

    A generation 2 virtual machine named **DB9** that runs Windows Server 2025 has a network adapter connected to ExtFast with an `IovWeight` of 100. `Get-VMSwitch -Name ExtFast` shows that `IovEnabled` is False.

    You need the network traffic of DB9 to use SR-IOV.

    What should you do?
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV9** qui exécute Windows Server 2025. HV9 possède une carte réseau compatible SR-IOV nommée Slot2, et SR-IOV est activé dans le microprogramme de HV9.

    L'an dernier, un administrateur a créé un commutateur virtuel externe en exécutant `New-VMSwitch -Name ExtFast -NetAdapterName "Slot2" -AllowManagementOS $false`.

    Une machine virtuelle de génération 2 nommée **DB9**, qui exécute Windows Server 2025, possède une carte réseau connectée à ExtFast avec une valeur `IovWeight` de 100. `Get-VMSwitch -Name ExtFast` indique que `IovEnabled` vaut False.

    Vous devez faire en sorte que le trafic réseau de DB9 utilise SR-IOV.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run Set-VMSwitch -Name ExtFast -NetAdapterName \"Slot2\" to bind the switch to the adapter again.", fr: "Exécuter Set-VMSwitch -Name ExtFast -NetAdapterName \"Slot2\" pour lier de nouveau le commutateur à la carte." } }
    - { id: b, text: { en: "Run Set-VMNetworkAdapter -VMName DB9 -VmqWeight 100, and then restart DB9.", fr: "Exécuter Set-VMNetworkAdapter -VMName DB9 -VmqWeight 100, puis redémarrer DB9." } }
    - { id: c, text: { en: "Run Set-VMSwitch -Name ExtFast -AllowManagementOS $true, and then restart DB9.", fr: "Exécuter Set-VMSwitch -Name ExtFast -AllowManagementOS $true, puis redémarrer DB9." } }
    - { id: d, text: { en: "Remove ExtFast, create it again by using New-VMSwitch -EnableIov $true, and reconnect DB9.", fr: "Supprimer ExtFast, le recréer avec New-VMSwitch -EnableIov $true et reconnecter DB9." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      I/O virtualization is a property chosen when the switch is created: `New-VMSwitch` has the `-EnableIov` parameter, and `Set-VMSwitch` offers no setting to turn it on later. Because ExtFast was created without it, you must recreate the switch with `-EnableIov $true` and reconnect the adapter of DB9, whose nonzero `IovWeight` then requests a virtual function.
    fr: |
      La virtualisation d'E/S est une propriété choisie à la création du commutateur : `New-VMSwitch` possède le paramètre `-EnableIov`, et `Set-VMSwitch` n'offre aucun paramètre pour l'activer ensuite. Comme ExtFast a été créé sans ce paramètre, vous devez recréer le commutateur avec `-EnableIov $true` et reconnecter la carte de DB9, dont la valeur `IovWeight` non nulle demande alors une fonction virtuelle.
  options:
    a:
      en: |
        Binding the switch to the same adapter again doesn't change its IOV setting, which can't be modified on an existing switch.
      fr: |
        Lier de nouveau le commutateur à la même carte ne modifie pas son paramètre IOV, qui ne peut pas être changé sur un commutateur existant.
    b:
      en: |
        VMQ is a different offload; its weight doesn't enable SR-IOV on a switch whose IOV is disabled.
      fr: |
        VMQ est un autre mécanisme de déchargement ; son poids n'active pas SR-IOV sur un commutateur dont l'IOV est désactivé.
    c:
      en: |
        Sharing the adapter with the management operating system gives the host a virtual adapter on the switch; it doesn't enable SR-IOV.
      fr: |
        Partager la carte avec le système d'exploitation de gestion donne à l'hôte une carte virtuelle sur le commutateur ; cela n'active pas SR-IOV.
references:
  - title: New-VMSwitch (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/new-vmswitch
  - title: Set-VMNetworkAdapter (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vmnetworkadapter
