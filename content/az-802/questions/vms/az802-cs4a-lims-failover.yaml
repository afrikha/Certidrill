id: az802-cs4a-lims-failover
objective: "3.1.14"
type: dragdrop
caseStudy: az802-cs4a-trey-research
difficulty: 1
status: draft
stem:
  en: |
    You are writing the disaster recovery procedures of LIMS-VM1.

    Which Hyper-V Replica operation should you use for each situation? To answer, drag the appropriate operations to the correct situations. Each operation may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous rédigez les procédures de reprise d'activité de LIMS-VM1.

    Quelle opération Réplica Hyper-V devez-vous utiliser dans chaque situation ? Pour répondre, faites glisser les opérations appropriées vers les situations correspondantes. Chaque opération peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: test, text: { en: "Test failover", fr: "Test de basculement" } }
    - { id: planned, text: { en: "Planned failover", fr: "Basculement planifié" } }
    - { id: unplanned, text: { en: "Unplanned failover", fr: "Basculement non planifié" } }
    - { id: reverse, text: { en: "Reverse replication", fr: "Inversion de la réplication" } }
    - { id: extended, text: { en: "Extended replication", fr: "Réplication étendue" } }
    - { id: broker, text: { en: "Hyper-V Replica Broker", fr: "Hyper-V Replica Broker" } }
  targets:
    - id: drill
      text: { en: "Monthly drill: start a copy of LIMS-VM1 on HV3 without stopping LIMS-VM1 on HV1 and without interrupting replication", fr: "Exercice mensuel : démarrer une copie de LIMS-VM1 sur HV3 sans arrêter LIMS-VM1 sur HV1 ni interrompre la réplication" }
    - id: maint
      text: { en: "Scheduled power work in Boston: run LIMS-VM1 on HV3 during the work, with no data loss", fr: "Travaux électriques programmés à Boston : exécuter LIMS-VM1 sur HV3 pendant les travaux, sans perte de données" }
    - id: outage
      text: { en: "HV1 is destroyed by a fire: start LIMS-VM1 on HV3 from the latest recovery point", fr: "HV1 est détruit par un incendie : démarrer LIMS-VM1 sur HV3 à partir du dernier point de récupération" }
    - id: back
      text: { en: "After the work in Boston: send the changes made on HV3 back to HV1 before LIMS-VM1 returns to HV1", fr: "Après les travaux à Boston : renvoyer vers HV1 les modifications faites sur HV3 avant le retour de LIMS-VM1 sur HV1" }
answer:
  mapping: { drill: test, maint: planned, outage: unplanned, back: reverse }
explanation:
  correct:
    en: |
      A test failover starts a temporary, isolated copy of the VM on the replica host and affects neither the production VM nor replication. A planned failover, started from the primary host, shuts down the primary VM, replicates the remaining changes and switches the roles, so no data is lost. An unplanned failover, started from the replica host, starts the replica without shutting down the primary, which is the only option when HV1 is gone. After a failover, reverse replication sends the changes back to the original primary so that the VM can return to it.
    fr: |
      Un test de basculement démarre une copie temporaire et isolée de la machine virtuelle sur l'hôte réplica, sans affecter la machine virtuelle de production ni la réplication. Un basculement planifié, lancé depuis l'hôte principal, arrête la machine virtuelle principale, réplique les dernières modifications et inverse les rôles : aucune donnée n'est perdue. Un basculement non planifié, lancé depuis l'hôte réplica, démarre le réplica sans arrêter la machine principale ; c'est la seule option quand HV1 n'existe plus. Après un basculement, l'inversion de la réplication renvoie les modifications vers l'hôte principal d'origine pour que la machine virtuelle puisse y revenir.
  options:
    extended: { en: "Extended replication adds a third host that receives replication from the replica server; it is not a failover operation.", fr: "La réplication étendue ajoute un troisième hôte qui reçoit la réplication du serveur réplica ; ce n'est pas une opération de basculement." }
    broker: { en: "The Hyper-V Replica Broker is used only when the hosts are cluster nodes; HV1 and HV3 are standalone hosts.", fr: "Hyper-V Replica Broker n'est utilisé que quand les hôtes sont des nœuds de cluster ; HV1 et HV3 sont des hôtes autonomes." }
references:
  - title: Hyper-V Replica overview
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/manage/set-up-hyper-v-replica
