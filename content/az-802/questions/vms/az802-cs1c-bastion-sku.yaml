id: az802-cs1c-bastion-sku
objective: "3.2.4"
type: single
caseStudy: az802-cs1c-humongous
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You plan to deploy Azure Bastion to VNet-Claims to meet the Azure access requirement.

    Which SKU should you choose?
  fr: |
    Vous prévoyez de déployer Azure Bastion dans VNet-Claims pour respecter l'exigence d'accès Azure.

    Quelle référence SKU devez-vous choisir ?
body:
  options:
    - { id: dev, text: Developer }
    - { id: basic, text: Basic }
    - { id: std, text: Standard }
    - { id: prem, text: Premium }
answer: { optionId: prem }
explanation:
  correct:
    en: |
      Session recording requires the Premium SKU of Azure Bastion. Because recording is mandatory, Premium is also the lowest-cost SKU that meets the requirement.
    fr: |
      L'enregistrement des sessions exige la référence SKU Premium d'Azure Bastion. Comme l'enregistrement est obligatoire, Premium est aussi la référence la moins coûteuse qui respecte l'exigence.
  options:
    dev: { en: "The Developer SKU doesn't support session recording.", fr: "La référence Developer ne prend pas en charge l'enregistrement des sessions." }
    basic: { en: "The Basic SKU doesn't support session recording.", fr: "La référence Basic ne prend pas en charge l'enregistrement des sessions." }
    std: { en: "Standard adds features such as host scaling, custom ports and shareable links, but session recording requires Premium.", fr: "Standard ajoute des fonctionnalités comme la mise à l'échelle de l'hôte, les ports personnalisés et les liens partageables, mais l'enregistrement des sessions exige Premium." }
references:
  - title: About Azure Bastion configuration settings
    url: https://learn.microsoft.com/en-us/azure/bastion/configuration-settings
