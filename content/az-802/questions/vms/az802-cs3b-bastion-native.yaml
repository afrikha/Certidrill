id: az802-cs3b-bastion-native
objective: "3.2.4"
type: single
caseStudy: az802-cs3b-blue-yonder
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the administration requirement. What should you deploy in VNet-Hub?
  fr: |
    Vous devez satisfaire l'exigence d'administration. Que devez-vous déployer dans VNet-Hub ?
body:
  options:
    - { id: a, text: { en: "Azure Bastion with the Developer SKU", fr: "Azure Bastion avec la référence SKU Developer" } }
    - { id: b, text: { en: "Azure Bastion with the Basic SKU", fr: "Azure Bastion avec la référence SKU Basic" } }
    - { id: c, text: { en: "Azure Bastion with the Standard SKU and native client support enabled", fr: "Azure Bastion avec la référence SKU Standard et la prise en charge du client natif activée" } }
    - { id: d, text: { en: "Azure Bastion with the Premium SKU and native client support enabled", fr: "Azure Bastion avec la référence SKU Premium et la prise en charge du client natif activée" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Connecting through Azure Bastion with the native Remote Desktop client requires the Native Client Support setting, which is available from the Standard SKU. The VMs keep only private IP addresses, and Standard is the least expensive SKU that meets the requirement.
    fr: |
      Se connecter via Azure Bastion avec le client Bureau à distance natif exige le paramètre Native Client Support, disponible à partir de la référence SKU Standard. Les machines virtuelles gardent uniquement des adresses IP privées, et Standard est la référence SKU la moins chère qui satisfait l'exigence.
  options:
    a:
      en: |
        The Developer SKU offers only browser-based connections from the Azure portal, without native client support.
      fr: |
        La référence SKU Developer n'offre que des connexions dans le navigateur depuis le portail Azure, sans prise en charge du client natif.
    b:
      en: |
        Native client support requires the Standard SKU or higher; the Basic SKU supports only connections from the Azure portal.
      fr: |
        La prise en charge du client natif exige la référence SKU Standard ou supérieure ; la référence SKU Basic ne prend en charge que les connexions depuis le portail Azure.
    d:
      en: |
        The Premium SKU also supports native clients, but it costs more than Standard and adds features the requirement does not ask for.
      fr: |
        La référence SKU Premium prend aussi en charge le client natif, mais elle coûte plus cher que Standard et ajoute des fonctionnalités que l'exigence ne demande pas.
references:
  - title: Configure Bastion for native client connections
    url: https://learn.microsoft.com/en-us/azure/bastion/native-client
