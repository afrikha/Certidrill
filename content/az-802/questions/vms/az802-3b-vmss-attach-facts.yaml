id: az802-3b-vmss-attach-facts
objective: "3.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have the following Virtual Machine Scale Sets in a resource group named **RG-Web**. Neither scale set uses availability zones.

    | Name | Orchestration mode | Platform fault domain count | singlePlacementGroup |
    | --- | --- | --- | --- |
    | VMSS-Web | Flexible | 1 | false |
    | VMSS-Batch | Uniform | 5 | false |

    RG-Web also contains the following Windows Server 2025 virtual machines. Both VMs use managed disks and no availability zone.

    | Name | Availability set |
    | --- | --- |
    | VM-A | None |
    | VM-B | AS-Legacy |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez des groupes de machines virtuelles identiques suivants dans un groupe de ressources nommé **RG-Web**. Aucun des deux n'utilise de zones de disponibilité.

    | Nom | Mode d'orchestration | Nombre de domaines d'erreur de la plateforme | singlePlacementGroup |
    | --- | --- | --- | --- |
    | VMSS-Web | Flexible | 1 | false |
    | VMSS-Batch | Uniform | 5 | false |

    RG-Web contient aussi les machines virtuelles Windows Server 2025 suivantes. Les deux machines virtuelles utilisent des disques managés et aucune zone de disponibilité.

    | Nom | Groupe à haute disponibilité |
    | --- | --- |
    | VM-A | Aucun |
    | VM-B | AS-Legacy |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can attach VM-A to VMSS-Web.
        fr: Vous pouvez attacher VM-A à VMSS-Web.
    - id: s2
      text:
        en: You can attach VM-B to VMSS-Web.
        fr: Vous pouvez attacher VM-B à VMSS-Web.
    - id: s3
      text:
        en: You can attach VM-A to VMSS-Batch.
        fr: Vous pouvez attacher VM-A à VMSS-Batch.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Only scale sets in Flexible orchestration mode accept existing VMs, and the scale set must have a platform fault domain count of 1 and `singlePlacementGroup` set to false. VM-A meets the other requirements (same resource group, regional like the scale set, managed disks), so it can be attached to VMSS-Web. A VM that belongs to an availability set can't be attached, so VM-B can't. VMSS-Batch uses Uniform orchestration, which doesn't support adding existing VMs.
    fr: |
      Seuls les groupes identiques en mode d'orchestration Flexible acceptent des machines virtuelles existantes, et le groupe doit avoir un nombre de domaines d'erreur de la plateforme de 1 et `singlePlacementGroup` défini sur false. VM-A remplit les autres conditions (même groupe de ressources, régionale comme le groupe identique, disques managés) : elle peut être attachée à VMSS-Web. Une machine virtuelle membre d'un groupe à haute disponibilité ne peut pas être attachée : VM-B ne le peut pas. VMSS-Batch utilise l'orchestration Uniform, qui ne permet pas d'ajouter des machines virtuelles existantes.
references:
  - title: Attach or detach a virtual machine to or from a Virtual Machine Scale Set
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-attach-detach-vm
  - title: Orchestration modes for Virtual Machine Scale Sets in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-orchestration-modes
