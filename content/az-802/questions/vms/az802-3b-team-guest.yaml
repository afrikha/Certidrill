id: az802-3b-team-guest
objective: "3.1.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV7** that runs Windows Server 2025. HV7 has an external virtual switch named **Ext1** bound to a single physical adapter.

    HV7 hosts a virtual machine named **APP7** that runs Windows Server 2025. APP7 has two network adapters, both connected to Ext1. A vendor requires the two adapters of APP7 to be members of a NIC team created inside the guest operating system.

    You plan to create the team by running `New-NetLbfoTeam` inside APP7.

    What should you run on HV7 first?
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV7** qui exécute Windows Server 2025. HV7 possède un commutateur virtuel externe nommé **Ext1**, lié à une seule carte physique.

    HV7 héberge une machine virtuelle nommée **APP7** qui exécute Windows Server 2025. APP7 possède deux cartes réseau, toutes deux connectées à Ext1. Un éditeur exige que les deux cartes d'APP7 soient membres d'une association de cartes réseau créée dans le système d'exploitation invité.

    Vous prévoyez de créer l'association en exécutant `New-NetLbfoTeam` dans APP7.

    Que devez-vous exécuter en premier sur HV7 ?
body:
  options:
    - { id: a, text: "Set-VMNetworkAdapter -VMName APP7 -DeviceNaming On" }
    - { id: b, text: "Set-VMSwitchTeam -Name Ext1 -LoadBalancingAlgorithm HyperVPort" }
    - { id: c, text: "Set-VMNetworkAdapter -VMName APP7 -AllowTeaming On" }
    - { id: d, text: "Set-VMNetworkAdapter -VMName APP7 -VmqWeight 0" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Teaming inside a virtual machine must first be allowed on its virtual network adapters from the host with `Set-VMNetworkAdapter -AllowTeaming On`, which lets an adapter be teamed with other adapters connected to the same virtual switch. You then create the team in the guest with `New-NetLbfoTeam`.
    fr: |
      L'association dans une machine virtuelle doit d'abord être autorisée sur ses cartes réseau virtuelles depuis l'hôte avec `Set-VMNetworkAdapter -AllowTeaming On`, qui permet d'associer une carte à d'autres cartes connectées au même commutateur virtuel. Vous créez ensuite l'association dans l'invité avec `New-NetLbfoTeam`.
  options:
    a:
      en: |
        DeviceNaming exposes the adapter name to the guest; it doesn't allow teaming.
      fr: |
        DeviceNaming expose le nom de la carte à l'invité ; il n'autorise pas l'association.
    b:
      en: |
        `Set-VMSwitchTeam` configures a Switch Embedded Teaming switch. Ext1 is bound to a single adapter, and the team is in the guest, not on the host.
      fr: |
        `Set-VMSwitchTeam` configure un commutateur Switch Embedded Teaming. Ext1 est lié à une seule carte, et l'association se trouve dans l'invité, pas sur l'hôte.
    d:
      en: |
        A VMQ weight of 0 disables virtual machine queue on the adapter; it has nothing to do with guest teaming.
      fr: |
        Un poids VMQ de 0 désactive la file d'attente de machine virtuelle sur la carte ; il n'a aucun rapport avec l'association dans l'invité.
references:
  - title: New-NetLbfoTeam (NetLbfo)
    url: https://learn.microsoft.com/en-us/powershell/module/netlbfo/new-netlbfoteam
  - title: Set-VMNetworkAdapter (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vmnetworkadapter
