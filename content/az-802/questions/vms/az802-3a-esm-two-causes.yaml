id: az802-3a-esm-two-causes
objective: "3.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV3** that runs Windows Server 2025. HV3 hosts a virtual machine named **VM3** that runs Windows Server 2019. VM3 is connected to a private virtual switch only.

    The current configuration is shown in the following table.

    | Setting | Value |
    | --- | --- |
    | Enhanced session mode policy (Hyper-V Settings, Server section, HV3) | Selected |
    | Use enhanced session mode (Hyper-V Settings, User section, for the user Admin1) | Cleared |
    | Remote Desktop in VM3 | Disabled |

    Admin1 signs in to HV3 and connects to VM3 by using Virtual Machine Connection (VMConnect). Admin1 must be able to paste text from the clipboard of HV3 into VM3 and to access the local drives of HV3 from VM3. VM3 must remain connected to the private switch only.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV3** qui exécute Windows Server 2025. HV3 héberge une machine virtuelle nommée **VM3** qui exécute Windows Server 2019. VM3 est connectée uniquement à un commutateur virtuel privé.

    La configuration actuelle figure dans le tableau suivant.

    | Paramètre | Valeur |
    | --- | --- |
    | Enhanced session mode policy (paramètres Hyper-V, section Server, HV3) | Sélectionné |
    | Use enhanced session mode (paramètres Hyper-V, section User, pour l'utilisateur Admin1) | Désélectionné |
    | Bureau à distance dans VM3 | Désactivé |

    Admin1 se connecte à HV3 et ouvre VM3 avec Connexion à une machine virtuelle (VMConnect). Admin1 doit pouvoir coller du texte du Presse-papiers de HV3 dans VM3 et accéder aux lecteurs locaux de HV3 depuis VM3. VM3 doit rester connectée uniquement au commutateur privé.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In Hyper-V Settings on HV3, select Use enhanced session mode in the User section for Admin1.", fr: "Dans les paramètres Hyper-V de HV3, sélectionner Use enhanced session mode dans la section User pour Admin1." } }
    - { id: b, text: { en: "On HV3, run Set-VMHost -EnableEnhancedSessionMode $true.", fr: "Sur HV3, exécuter Set-VMHost -EnableEnhancedSessionMode $true." } }
    - { id: c, text: { en: "On HV3, enable the Guest Service Interface integration service of VM3.", fr: "Sur HV3, activer le service d'intégration Guest Service Interface de VM3." } }
    - { id: d, text: { en: "In VM3, enable Remote Desktop.", fr: "Dans VM3, activer le Bureau à distance." } }
    - { id: e, text: { en: "On HV3, add a network adapter connected to an external switch to VM3.", fr: "Sur HV3, ajouter à VM3 une carte réseau connectée à un commutateur externe." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Enhanced Session Mode needs both host settings and Remote Desktop Services enabled in a Windows 10 / Windows Server 2016 or later guest. Here two conditions fail at the same time: the user setting is cleared for Admin1 and Remote Desktop is disabled in VM3. Fixing only one of them still leaves a basic session, so you must select the user setting and enable Remote Desktop in VM3.
    fr: |
      Le mode de session amélioré exige les deux paramètres de l'hôte et les services Bureau à distance activés dans un invité Windows 10 / Windows Server 2016 ou ultérieur. Ici, deux conditions échouent en même temps : le paramètre utilisateur est désélectionné pour Admin1 et le Bureau à distance est désactivé dans VM3. N'en corriger qu'une laisse une session de base : vous devez sélectionner le paramètre utilisateur et activer le Bureau à distance dans VM3.
  options:
    b: { en: "This command sets the server policy, which is already selected on HV3.", fr: "Cette commande définit la stratégie du serveur, déjà sélectionnée sur HV3." }
    c: { en: "Guest Service Interface is used for file copies with Copy-VMFile, not for enhanced sessions.", fr: "Guest Service Interface sert aux copies de fichiers avec Copy-VMFile, pas aux sessions améliorées." }
    e: { en: "An enhanced session uses the VMBus, not the VM network, and the requirement forbids a new network connection.", fr: "Une session améliorée utilise le VMBus, pas le réseau de la machine virtuelle, et l'exigence interdit toute nouvelle connexion réseau." }
references:
  - title: Use local resources on Hyper-V virtual machine with VMConnect
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/learn-more/use-local-resources-on-hyper-v-virtual-machine-with-vmconnect
