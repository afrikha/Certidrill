id: az802-sr1-nested-amd-1
objective: "3.1.3"
type: series_yesno
series: az802-sr1-nested-amd
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: You expose the virtualization extensions of VM1 and enable MAC address spoofing.
  fr: Vous exposez les extensions de virtualisation de VM1 et activez l'usurpation d'adresses MAC.
body:
  solution:
    en: |
      You run the following commands on Host1. You then install the Hyper-V server role in VM1 and create an external virtual switch in VM1.

      ```powershell
      Stop-VM -Name VM1
      Set-VMProcessor -VMName VM1 -ExposeVirtualizationExtensions $true
      Get-VMNetworkAdapter -VMName VM1 | Set-VMNetworkAdapter -MacAddressSpoofing On
      Start-VM -Name VM1
      ```
    fr: |
      Vous exécutez les commandes suivantes sur Host1. Vous installez ensuite le rôle serveur Hyper-V dans VM1 et créez un commutateur virtuel externe dans VM1.

      ```powershell
      Stop-VM -Name VM1
      Set-VMProcessor -VMName VM1 -ExposeVirtualizationExtensions $true
      Get-VMNetworkAdapter -VMName VM1 | Set-VMNetworkAdapter -MacAddressSpoofing On
      Start-VM -Name VM1
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      On a host with AMD EPYC or Ryzen processors, nested virtualization requires Windows Server 2022 or later on the host and a virtual machine configuration version of 9.3 or higher. VM1 is still at version 9.0, so it does not meet the prerequisite and cannot run Hyper-V, even though the commands themselves are correct. Version 8.0 would be enough only on an Intel host with VT-x and EPT.
    fr: |
      Sur un hôte doté de processeurs AMD EPYC ou Ryzen, la virtualisation imbriquée exige Windows Server 2022 ou version ultérieure sur l'hôte et une version de configuration de machine virtuelle 9.3 ou supérieure. VM1 est toujours en version 9.0 : elle ne remplit pas ce prérequis et ne peut pas exécuter Hyper-V, même si les commandes elles-mêmes sont correctes. La version 8.0 suffirait uniquement sur un hôte Intel avec VT-x et EPT.
references:
  - title: Run Hyper-V in a Virtual Machine with Nested Virtualization
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/enable-nested-virtualization
