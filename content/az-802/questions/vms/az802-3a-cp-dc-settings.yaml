id: az802-3a-cp-dc-settings
objective: "3.1.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV3** that hosts a virtual machine named **DC28**. DC28 is a domain controller for contoso.com.

    You need to configure checkpoints for DC28 to meet the following requirements:

    - Checkpoints of DC28 must be data-consistent and must never capture the memory state.
    - If the guest cannot create a data-consistent checkpoint, the checkpoint operation must fail.
    - Hyper-V must not create checkpoints of DC28 automatically.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV3** qui héberge une machine virtuelle nommée **DC28**. DC28 est un contrôleur de domaine de contoso.com.

    Vous devez configurer les points de contrôle de DC28 pour satisfaire les exigences suivantes :

    - les points de contrôle de DC28 doivent être cohérents au niveau des données et ne jamais capturer l'état de la mémoire ;
    - si l'invité ne peut pas créer un point de contrôle cohérent, l'opération de point de contrôle doit échouer ;
    - Hyper-V ne doit pas créer automatiquement de points de contrôle de DC28.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Set-VM -Name DC28 -CheckpointType [[type]] [[auto]] $false
  slots:
    - id: type
      options:
        - { id: production, text: "Production" }
        - { id: standard, text: "Standard" }
        - { id: productiononly, text: "ProductionOnly" }
        - { id: disabled, text: "Disabled" }
    - id: auto
      options:
        - { id: autostart, text: "-AutomaticStartAction" }
        - { id: autocp, text: "-AutomaticCheckpointsEnabled" }
        - { id: cache, text: "-GuestControlledCacheTypes" }
answer:
  values: { type: productiononly, auto: autocp }
explanation:
  correct:
    en: |
      Production checkpoints use VSS in the guest and do not capture memory, which avoids the consistency problems that standard checkpoints can cause on replicating systems such as Active Directory. ProductionOnly creates a production checkpoint and fails when the guest cannot create one. `-AutomaticCheckpointsEnabled $false` stops Hyper-V from creating checkpoints automatically.
    fr: |
      Les points de contrôle de production utilisent VSS dans l'invité et ne capturent pas la mémoire, ce qui évite les problèmes de cohérence que les points de contrôle standard peuvent causer sur les systèmes répliqués comme Active Directory. ProductionOnly crée un point de contrôle de production et échoue quand l'invité ne peut pas en créer un. `-AutomaticCheckpointsEnabled $false` empêche Hyper-V de créer des points de contrôle automatiquement.
  options:
    production: { en: "Production falls back to a standard checkpoint, with memory state, when the guest cannot create a production checkpoint.", fr: "Production se rabat sur un point de contrôle standard, avec l'état de la mémoire, quand l'invité ne peut pas créer de point de contrôle de production." }
    standard: { en: "Standard checkpoints capture memory and can cause consistency problems on domain controllers.", fr: "Les points de contrôle standard capturent la mémoire et peuvent causer des problèmes de cohérence sur les contrôleurs de domaine." }
    disabled: { en: "Disabled blocks every checkpoint, but DC28 must still support manual data-consistent checkpoints.", fr: "Disabled bloque tous les points de contrôle, alors que DC28 doit toujours accepter des points de contrôle manuels cohérents." }
    autostart: { en: "AutomaticStartAction defines what the VM does when the host starts and takes Nothing, StartIfRunning or Start, not a Boolean.", fr: "AutomaticStartAction définit ce que fait la machine virtuelle au démarrage de l'hôte et prend Nothing, StartIfRunning ou Start, pas un booléen." }
    cache: { en: "GuestControlledCacheTypes is a setting used for Discrete Device Assignment, unrelated to checkpoints.", fr: "GuestControlledCacheTypes est un paramètre utilisé pour l'attribution discrète d'appareil, sans rapport avec les points de contrôle." }
references:
  - title: Set-VM (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vm
  - title: Using checkpoints
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/manage/enable-or-disable-checkpoints-in-hyper-v
