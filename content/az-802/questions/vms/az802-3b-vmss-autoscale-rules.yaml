id: az802-3b-vmss-autoscale-rules
objective: "3.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a Virtual Machine Scale Set named **VMSS-App** that runs Windows Server 2025. VMSS-App has an autoscale setting with the following configuration:

    - Instance limits: minimum 2, maximum 10, default 2
    - One rule: when the average Percentage CPU is greater than 75 % over 10 minutes, increase the count by 2

    After a busy morning, VMSS-App keeps 10 instances all night, although the average CPU stays below 20 %.

    You need to ensure that the number of instances decreases when the load drops. VMSS-App must never run fewer than 4 instances.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un groupe de machines virtuelles identiques nommé **VMSS-App** qui exécute Windows Server 2025. VMSS-App possède un paramètre de mise à l'échelle automatique configuré ainsi :

    - Limites d'instances : minimum 2, maximum 10, par défaut 2
    - Une règle : quand la moyenne de Percentage CPU dépasse 75 % sur 10 minutes, augmenter le nombre de 2

    Après une matinée chargée, VMSS-App conserve 10 instances toute la nuit, alors que l'utilisation moyenne du processeur reste inférieure à 20 %.

    Vous devez faire en sorte que le nombre d'instances diminue quand la charge baisse. VMSS-App ne doit jamais exécuter moins de 4 instances.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the default instance count to 4.", fr: "Définir le nombre d'instances par défaut sur 4." } }
    - { id: b, text: { en: "Set the scale-in policy to NewestVM.", fr: "Définir la stratégie de scale-in sur NewestVM." } }
    - { id: c, text: { en: "Add a rule that decreases the count when the average Percentage CPU is less than 30 %.", fr: "Ajouter une règle qui diminue le nombre quand la moyenne de Percentage CPU est inférieure à 30 %." } }
    - { id: d, text: { en: "Set the minimum instance count to 4.", fr: "Définir le nombre minimal d'instances sur 4." } }
    - { id: e, text: { en: "Reduce the cool down of the existing rule to 1 minute.", fr: "Réduire la période de refroidissement (cool down) de la règle existante à 1 minute." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      Autoscale only performs the actions that its rules define: with a single scale-out rule, the count never decreases, so you must pair it with a scale-in rule. The minimum instance limit is the bound below which autoscale never scales in, so setting it to 4 keeps at least four instances.
    fr: |
      La mise à l'échelle automatique n'effectue que les actions définies par ses règles : avec une seule règle d'augmentation, le nombre ne diminue jamais ; vous devez donc lui associer une règle de diminution. La limite minimale d'instances est le seuil en dessous duquel la mise à l'échelle automatique ne descend jamais : la définir sur 4 conserve au moins quatre instances.
  options:
    a:
      en: |
        The default count isn't a floor: autoscale can still scale in down to the minimum of 2.
      fr: |
        Le nombre par défaut n'est pas un plancher : la mise à l'échelle automatique peut toujours descendre jusqu'au minimum de 2.
    b:
      en: |
        The scale-in policy only chooses which instances are removed during a scale-in; without a scale-in rule, no instance is removed.
      fr: |
        La stratégie de scale-in choisit seulement les instances supprimées lors d'une diminution ; sans règle de diminution, aucune instance n'est supprimée.
    e:
      en: |
        The cool down only delays the next scale-out action; it doesn't add any scale-in action.
      fr: |
        La période de refroidissement retarde seulement l'action d'augmentation suivante ; il n'ajoute aucune action de diminution.
references:
  - title: Autoscale Virtual Machine Scale Sets in the Azure portal
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-autoscale-portal
  - title: Use scale-in policies with Azure Virtual Machine Scale Sets
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-scale-in-policy
