id: az802-cs2c-vmconnect-session
objective: "3.1.1"
type: single
caseStudy: az802-cs2c-graphic-design-institute
difficulty: 1
status: draft
stem:
  en: |
    The students report that VMConnect opens VM-TRAIN2 only in a basic session, without access to their local resources.

    You need to meet the training requirement. What should you do?
  fr: |
    Les étudiants signalent que VMConnect ouvre VM-TRAIN2 uniquement en session de base, sans accès à leurs ressources locales.

    Vous devez satisfaire l'exigence de formation. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Connect VM-TRAIN2 to an external virtual switch.", fr: "Connecter VM-TRAIN2 à un commutateur virtuel externe." } }
    - { id: b, text: { en: "Enable the Guest Service Interface integration service of VM-TRAIN2.", fr: "Activer le service d'intégration Guest Service Interface de VM-TRAIN2." } }
    - { id: c, text: { en: "Turn on the Enhanced session mode policy on HVLAB1.", fr: "Activer le paramètre Enhanced session mode policy sur HVLAB1." } }
    - { id: d, text: { en: "Enable Remote Desktop inside VM-TRAIN2.", fr: "Activer le Bureau à distance dans VM-TRAIN2." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Enhanced session mode redirects the clipboard, drives, USB devices and other local resources into the VMConnect session. It needs both host settings, which are already on, a Windows 10 or Windows Server 2016 or later client and guest, and Remote Desktop Services enabled in the guest. Remote Desktop is disabled in VM-TRAIN2, so the session falls back to basic mode. Enhanced session mode does not need a network connection to the VM.
    fr: |
      Le mode de session amélioré redirige le Presse-papiers, les lecteurs, les périphériques USB et d'autres ressources locales vers la session VMConnect. Il exige les deux paramètres de l'hôte, déjà activés, un client et un invité Windows 10 ou Windows Server 2016 ou ultérieur, et les services Bureau à distance activés dans l'invité. Le Bureau à distance est désactivé dans VM-TRAIN2 : la session revient en mode de base. Le mode de session amélioré n'a pas besoin de connexion réseau vers la machine virtuelle.
  options:
    a:
      en: |
        Enhanced session mode works over the VM connection without a network path to the guest, and the requirement keeps VM-TRAIN2 on its private switch.
      fr: |
        Le mode de session amélioré fonctionne par la connexion à la machine virtuelle sans chemin réseau vers l'invité, et l'exigence maintient VM-TRAIN2 sur son commutateur privé.
    b:
      en: |
        Guest Service Interface lets the host copy files into the VM with `Copy-VMFile`; it does not turn on enhanced session mode.
      fr: |
        Guest Service Interface permet à l'hôte de copier des fichiers dans la machine virtuelle avec `Copy-VMFile` ; il n'active pas le mode de session amélioré.
    c:
      en: |
        Both enhanced session mode settings are already turned on for HVLAB1.
      fr: |
        Les deux paramètres du mode de session amélioré sont déjà activés sur HVLAB1.
references:
  - title: Use local resources on Hyper-V virtual machine with VMConnect
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/learn-more/use-local-resources-on-hyper-v-virtual-machine-with-vmconnect
