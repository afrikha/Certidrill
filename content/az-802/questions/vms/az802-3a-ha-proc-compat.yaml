id: az802-3a-ha-proc-compat
objective: "3.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have two standalone Hyper-V hosts named **HV13** and **HV14** that run Windows Server 2025 and are configured for live migration with Kerberos authentication.

    HV13 has older-generation Intel Xeon processors. HV14 has newer-generation Intel Xeon processors. A virtual machine named **VM29** was created on HV14 with the default settings.

    Live migrating VM29 from HV14 to HV13 fails because of processor feature differences. VM29 can be shut down during tonight's maintenance window.

    You need to ensure that VM29 can be live migrated between HV13 and HV14 in both directions.

    What should you run on HV14 while VM29 is shut down?
  fr: |
    Vous disposez de deux hôtes Hyper-V autonomes nommés **HV13** et **HV14** qui exécutent Windows Server 2025 et sont configurés pour la migration dynamique avec l'authentification Kerberos.

    HV13 dispose de processeurs Intel Xeon d'ancienne génération. HV14 dispose de processeurs Intel Xeon de génération plus récente. Une machine virtuelle nommée **VM29** a été créée sur HV14 avec les paramètres par défaut.

    La migration dynamique de VM29 de HV14 vers HV13 échoue en raison de différences de fonctionnalités des processeurs. VM29 peut être arrêtée pendant la fenêtre de maintenance de ce soir.

    Vous devez faire en sorte que VM29 puisse être déplacée par migration dynamique entre HV13 et HV14 dans les deux sens.

    Que devez-vous exécuter sur HV14 pendant que VM29 est arrêtée ?
body:
  options:
    - { id: a, text: "Set-VMProcessor -VMName VM29 -CompatibilityForOlderOperatingSystemsEnabled $true" }
    - { id: b, text: "Set-VMHost -VirtualMachineMigrationPerformanceOption SMB" }
    - { id: c, text: "Set-VMProcessor -VMName VM29 -ExposeVirtualizationExtensions $true" }
    - { id: d, text: "Set-VMProcessor -VMName VM29 -CompatibilityForMigrationEnabled $true" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Processor compatibility mode limits the processor features that a VM sees so that it can move between hosts with different processor capabilities of the same manufacturer. It is not enabled by default, so you enable it on VM29 with `-CompatibilityForMigrationEnabled $true`. The dynamic mode of Windows Server 2025 computes the features common to cluster nodes, so it does not apply to these standalone hosts.
    fr: |
      Le mode de compatibilité du processeur limite les fonctionnalités de processeur que voit une machine virtuelle pour qu'elle puisse passer entre des hôtes aux capacités de processeur différentes, du même fabricant. Il n'est pas activé par défaut : vous l'activez sur VM29 avec `-CompatibilityForMigrationEnabled $true`. Le mode dynamique de Windows Server 2025 calcule les fonctionnalités communes aux nœuds d'un cluster : il ne s'applique pas à ces hôtes autonomes.
  options:
    a: { en: "CompatibilityForOlderOperatingSystemsEnabled is for running older guest operating systems, not for migrating between processor generations.", fr: "CompatibilityForOlderOperatingSystemsEnabled sert à exécuter d'anciens systèmes d'exploitation invités, pas à migrer entre générations de processeurs." }
    b: { en: "The performance option changes how memory is copied during live migration, not which processor features the VM uses.", fr: "L'option de performances change la manière dont la mémoire est copiée pendant la migration dynamique, pas les fonctionnalités de processeur qu'utilise la machine virtuelle." }
    c: { en: "Exposing virtualization extensions enables nested virtualization; it does not hide processor feature differences.", fr: "Exposer les extensions de virtualisation active la virtualisation imbriquée ; cela ne masque pas les différences de fonctionnalités des processeurs." }
references:
  - title: Processor compatibility for Hyper-V virtual machines
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/manage/processor-compatibility-mode-hyper-v
  - title: Set-VMProcessor (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vmprocessor
