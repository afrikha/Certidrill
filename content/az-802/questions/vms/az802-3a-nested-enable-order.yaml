id: az802-3a-nested-enable-order
objective: "3.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV3** that runs Windows Server 2025 and has Intel processors with VT-x and EPT. HV3 hosts a generation 2 virtual machine named **VM9** that runs Windows Server 2025. VM9 was created on HV3 with the default configuration version and is running.

    You need to run virtual machines inside VM9 for a training lab. The virtual machines inside VM9 will connect only to a private virtual switch created in VM9.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV3** qui exécute Windows Server 2025 et dispose de processeurs Intel avec VT-x et EPT. HV3 héberge une machine virtuelle de génération 2 nommée **VM9** qui exécute Windows Server 2025. VM9 a été créée sur HV3 avec la version de configuration par défaut et est en cours d'exécution.

    Vous devez exécuter des machines virtuelles dans VM9 pour un labo de formation. Les machines virtuelles de VM9 se connecteront uniquement à un commutateur virtuel privé créé dans VM9.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: start, text: { en: "On HV3, start VM9.", fr: "Sur HV3, démarrer VM9." } }
    - { id: dynmem, text: { en: "On HV3, enable Dynamic Memory for VM9.", fr: "Sur HV3, activer la mémoire dynamique pour VM9." } }
    - { id: role, text: { en: "In VM9, install the Hyper-V server role.", fr: "Dans VM9, installer le rôle serveur Hyper-V." } }
    - { id: stop, text: { en: "On HV3, turn off VM9.", fr: "Sur HV3, arrêter VM9." } }
    - { id: gsi, text: { en: "On HV3, enable the Guest Service Interface integration service of VM9.", fr: "Sur HV3, activer le service d'intégration Guest Service Interface de VM9." } }
    - { id: expose, text: { en: "On HV3, run Set-VMProcessor -VMName VM9 -ExposeVirtualizationExtensions $true.", fr: "Sur HV3, exécuter Set-VMProcessor -VMName VM9 -ExposeVirtualizationExtensions $true." } }
answer:
  sequence: [ stop, expose, start, role ]
explanation:
  correct:
    en: |
      HV3 and VM9 already meet the Intel prerequisites (Windows Server 2016 or later host, configuration version 8.0 or higher). The virtualization extensions can be exposed only while the VM is powered off, so you turn off VM9, run Set-VMProcessor on the host, start VM9, and then install Hyper-V inside it as on a physical server. The nested virtual machines use a private switch, so no MAC address spoofing is needed for this lab.
    fr: |
      HV3 et VM9 remplissent déjà les prérequis Intel (hôte Windows Server 2016 ou ultérieur, version de configuration 8.0 ou supérieure). Les extensions de virtualisation ne peuvent être exposées que pendant que la machine virtuelle est arrêtée : vous arrêtez VM9, exécutez Set-VMProcessor sur l'hôte, démarrez VM9, puis installez Hyper-V à l'intérieur comme sur un serveur physique. Les machines virtuelles imbriquées utilisent un commutateur privé : aucune usurpation d'adresses MAC n'est nécessaire pour ce labo.
  options:
    dynmem: { en: "Dynamic Memory is not a prerequisite of nested virtualization.", fr: "La mémoire dynamique n'est pas un prérequis de la virtualisation imbriquée." }
    gsi: { en: "Guest Service Interface enables file copies with Copy-VMFile and plays no role in nested virtualization.", fr: "Guest Service Interface permet les copies de fichiers avec Copy-VMFile et ne joue aucun rôle dans la virtualisation imbriquée." }
references:
  - title: Run Hyper-V in a Virtual Machine with Nested Virtualization
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/enable-nested-virtualization
