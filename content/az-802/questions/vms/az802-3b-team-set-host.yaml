id: az802-3b-team-set-host
objective: "3.1.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You deploy a server named **HV5** that runs Windows Server 2025 Datacenter and has the Hyper-V role installed. HV5 has two identical 25-GbE network adapters named NIC1 and NIC2.

    You need to configure HV5 to meet the following requirements:

    - Virtual machines connect to the physical network through a Hyper-V virtual switch.
    - The traffic of the switch is distributed across NIC1 and NIC2, and continues if either adapter fails.
    - The management operating system shares the switch.

    What should you run?
  fr: |
    Vous déployez un serveur nommé **HV5** qui exécute Windows Server 2025 Datacenter avec le rôle Hyper-V. HV5 possède deux cartes réseau 25 GbE identiques nommées NIC1 et NIC2.

    Vous devez configurer HV5 pour satisfaire les exigences suivantes :

    - Les machines virtuelles se connectent au réseau physique par un commutateur virtuel Hyper-V.
    - Le trafic du commutateur est réparti entre NIC1 et NIC2 et continue si l'une des cartes tombe en panne.
    - Le système d'exploitation de gestion partage le commutateur.

    Que devez-vous exécuter ?
body:
  options:
    - id: a
      text:
        en: "`New-NetLbfoTeam -Name Team1 -TeamMembers NIC1,NIC2 -TeamingMode SwitchIndependent`, then `New-VMSwitch -Name Ext1 -NetAdapterName Team1 -AllowManagementOS $true`"
        fr: "`New-NetLbfoTeam -Name Team1 -TeamMembers NIC1,NIC2 -TeamingMode SwitchIndependent`, puis `New-VMSwitch -Name Ext1 -NetAdapterName Team1 -AllowManagementOS $true`"
    - id: b
      text:
        en: "`New-VMSwitch -Name Ext1 -NetAdapterName NIC1,NIC2 -EnableEmbeddedTeaming $true -AllowManagementOS $true`"
        fr: "`New-VMSwitch -Name Ext1 -NetAdapterName NIC1,NIC2 -EnableEmbeddedTeaming $true -AllowManagementOS $true`"
    - id: c
      text:
        en: "`New-NetLbfoTeam -Name Team1 -TeamMembers NIC1,NIC2 -TeamingMode Lacp`, then `New-VMSwitch -Name Ext1 -NetAdapterName Team1 -AllowManagementOS $true`"
        fr: "`New-NetLbfoTeam -Name Team1 -TeamMembers NIC1,NIC2 -TeamingMode Lacp`, puis `New-VMSwitch -Name Ext1 -NetAdapterName Team1 -AllowManagementOS $true`"
    - id: d
      text:
        en: "`New-VMSwitch -Name Ext1 -NetAdapterName NIC1 -AllowManagementOS $true`, then `New-VMSwitch -Name Ext2 -NetAdapterName NIC2 -AllowManagementOS $true`"
        fr: "`New-VMSwitch -Name Ext1 -NetAdapterName NIC1 -AllowManagementOS $true`, puis `New-VMSwitch -Name Ext2 -NetAdapterName NIC2 -AllowManagementOS $true`"
answer: { optionId: b }
explanation:
  correct:
    en: |
      Since Windows Server 2022, a Hyper-V virtual switch can no longer be bound to an LBFO team; teaming under a Hyper-V switch is done with Switch Embedded Teaming (SET). `New-VMSwitch -EnableEmbeddedTeaming $true` with several identical adapters creates the SET switch, and `-AllowManagementOS $true` gives the host a virtual adapter on it.
    fr: |
      Depuis Windows Server 2022, un commutateur virtuel Hyper-V ne peut plus être lié à une association LBFO ; l'association sous un commutateur Hyper-V se fait avec Switch Embedded Teaming (SET). `New-VMSwitch -EnableEmbeddedTeaming $true` avec plusieurs cartes identiques crée le commutateur SET, et `-AllowManagementOS $true` donne à l'hôte une carte virtuelle sur ce commutateur.
  options:
    a:
      en: |
        The LBFO team can be created, but Windows Server 2022 and later don't support binding a Hyper-V virtual switch to it.
      fr: |
        L'association LBFO peut être créée, mais Windows Server 2022 et les versions ultérieures ne permettent pas d'y lier un commutateur virtuel Hyper-V.
    c:
      en: |
        LACP changes the teaming mode of the LBFO team, but the Hyper-V switch still can't be bound to an LBFO team.
      fr: |
        LACP change le mode d'association LBFO, mais le commutateur Hyper-V ne peut toujours pas être lié à une association LBFO.
    d:
      en: |
        Two separate switches each depend on one adapter: a VM connected to Ext1 loses connectivity when NIC1 fails.
      fr: |
        Deux commutateurs distincts dépendent chacun d'une seule carte : une machine virtuelle connectée à Ext1 perd la connectivité si NIC1 tombe en panne.
references:
  - title: Features Removed or No Longer Developed in Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/get-started/removed-deprecated-features-windows-server
  - title: New-VMSwitch (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/new-vmswitch
