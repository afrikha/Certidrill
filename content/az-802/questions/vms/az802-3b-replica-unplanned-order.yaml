id: az802-3b-replica-unplanned-order
objective: "3.1.14"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have two standalone Hyper-V hosts that run Windows Server 2025: **HV-PAR1** in Paris and **HV-LYO1** in Lyon. A virtual machine named **ERP1** replicates from HV-PAR1 to HV-LYO1 by using Hyper-V Replica.

    A power failure takes the Paris site offline for several days.

    You need to run ERP1 on HV-LYO1 now from the latest recovery point and keep it there permanently. When HV-PAR1 is repaired, you will configure replication of ERP1 back to HV-PAR1; another administrator will then start the initial replication.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez de deux hôtes Hyper-V autonomes qui exécutent Windows Server 2025 : **HV-PAR1** à Paris et **HV-LYO1** à Lyon. Une machine virtuelle nommée **ERP1** est répliquée de HV-PAR1 vers HV-LYO1 avec Hyper-V Réplica.

    Une panne de courant met le site de Paris hors service pendant plusieurs jours.

    Vous devez exécuter ERP1 sur HV-LYO1 dès maintenant à partir du dernier point de récupération et l'y conserver définitivement. Quand HV-PAR1 sera réparé, vous configurerez la réplication d'ERP1 en retour vers HV-PAR1 ; un autre administrateur démarrera ensuite la réplication initiale.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: failover, text: { en: "On HV-LYO1, run Start-VMFailover -VMName ERP1.", fr: "Sur HV-LYO1, exécuter Start-VMFailover -VMName ERP1." } }
    - { id: startvm, text: { en: "On HV-LYO1, run Start-VM -Name ERP1 and verify the application.", fr: "Sur HV-LYO1, exécuter Start-VM -Name ERP1 et vérifier l'application." } }
    - { id: complete, text: { en: "On HV-LYO1, run Complete-VMFailover -VMName ERP1.", fr: "Sur HV-LYO1, exécuter Complete-VMFailover -VMName ERP1." } }
    - { id: asreplica, text: { en: "On HV-PAR1, run Set-VMReplication -VMName ERP1 -AsReplica.", fr: "Sur HV-PAR1, exécuter Set-VMReplication -VMName ERP1 -AsReplica." } }
    - { id: reverse, text: { en: "On HV-LYO1, run Set-VMReplication -VMName ERP1 -Reverse -ReplicaServerName HV-PAR1.", fr: "Sur HV-LYO1, exécuter Set-VMReplication -VMName ERP1 -Reverse -ReplicaServerName HV-PAR1." } }
    - { id: prepare, text: { en: "On HV-PAR1, run Start-VMFailover -VMName ERP1 -Prepare.", fr: "Sur HV-PAR1, exécuter Start-VMFailover -VMName ERP1 -Prepare." } }
    - { id: stop, text: { en: "On HV-LYO1, run Stop-VMFailover -VMName ERP1.", fr: "Sur HV-LYO1, exécuter Stop-VMFailover -VMName ERP1." } }
answer:
  sequence: [ failover, startvm, complete, asreplica, reverse ]
explanation:
  correct:
    en: |
      An unplanned failover starts on the replica host: `Start-VMFailover` (latest recovery point by default), then `Start-VM` to test the VM. `Complete-VMFailover` removes the recovery points and merges the checkpoint, which commits the choice. Before replication can be reversed, the original primary VM must be marked as a replica target with `Set-VMReplication -AsReplica` on HV-PAR1; then `Set-VMReplication -Reverse` on HV-LYO1 configures replication back to HV-PAR1.
    fr: |
      Un basculement non planifié commence sur l'hôte réplica : `Start-VMFailover` (dernier point de récupération par défaut), puis `Start-VM` pour tester la machine virtuelle. `Complete-VMFailover` supprime les points de récupération et fusionne le point de contrôle, ce qui valide le choix. Avant de pouvoir inverser la réplication, la machine virtuelle primaire d'origine doit être désignée comme cible de réplication avec `Set-VMReplication -AsReplica` sur HV-PAR1 ; ensuite, `Set-VMReplication -Reverse` sur HV-LYO1 configure la réplication en retour vers HV-PAR1.
  options:
    prepare:
      en: |
        `-Prepare` on the primary belongs to a planned failover, which requires the primary host to be available; HV-PAR1 is offline when you fail over.
      fr: |
        `-Prepare` sur le serveur principal appartient au basculement planifié, qui exige que l'hôte principal soit disponible ; HV-PAR1 est hors service au moment du basculement.
    stop:
      en: |
        `Stop-VMFailover` cancels a failover or ends a test failover; it would undo the failover instead of keeping ERP1 on HV-LYO1.
      fr: |
        `Stop-VMFailover` annule un basculement ou termine un test de basculement ; il défairait le basculement au lieu de conserver ERP1 sur HV-LYO1.
references:
  - title: Fail over a virtual machine with Hyper-V Replica
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/replication-failover
