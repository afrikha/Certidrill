id: az802-3a-esm-host-policy
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV1** that runs Windows Server 2025. HV1 hosts a virtual machine named **VM1** that runs Windows Server 2022. Remote Desktop is enabled in VM1.

    In Hyper-V Settings on HV1, **Enhanced session mode** is selected in the **User** section, and **Enhanced session mode policy** is cleared in the **Server** section.

    When administrators connect to VM1 by using Virtual Machine Connection (VMConnect) on HV1, they cannot use the clipboard to copy text from HV1 to VM1.

    You need to ensure that the administrators can use the clipboard in their VMConnect sessions to VM1.

    What should you do?
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV1** qui exécute Windows Server 2025. HV1 héberge une machine virtuelle nommée **VM1** qui exécute Windows Server 2022. Le Bureau à distance est activé dans VM1.

    Dans les paramètres Hyper-V de HV1, **Enhanced session mode** est sélectionné dans la section **User**, et **Enhanced session mode policy** est désélectionné dans la section **Server**.

    Quand les administrateurs se connectent à VM1 avec Connexion à une machine virtuelle (VMConnect) sur HV1, ils ne peuvent pas utiliser le Presse-papiers pour copier du texte de HV1 vers VM1.

    Vous devez faire en sorte que les administrateurs puissent utiliser le Presse-papiers dans leurs sessions VMConnect vers VM1.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "On HV1, run Enable-VMIntegrationService -VMName VM1 -Name \"Guest Service Interface\".", fr: "Sur HV1, exécuter Enable-VMIntegrationService -VMName VM1 -Name \"Guest Service Interface\"." } }
    - { id: b, text: { en: "On HV1, run Set-VMHost -EnableEnhancedSessionMode $true.", fr: "Sur HV1, exécuter Set-VMHost -EnableEnhancedSessionMode $true." } }
    - { id: c, text: { en: "On HV1, run Grant-VMConnectAccess -VMName VM1 -UserName CONTOSO\\HVAdmins.", fr: "Sur HV1, exécuter Grant-VMConnectAccess -VMName VM1 -UserName CONTOSO\\HVAdmins." } }
    - { id: d, text: { en: "On HV1, connect the network adapter of VM1 to an external virtual switch.", fr: "Sur HV1, connecter la carte réseau de VM1 à un commutateur virtuel externe." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Local resources such as the clipboard are available only in an enhanced session, which requires both the Enhanced session mode policy and the Enhanced session mode user setting on the Hyper-V host. The guest and the client already meet the Windows 10 / Windows Server 2016 or later requirement and Remote Desktop is enabled in VM1, so only the server policy is missing. `Set-VMHost -EnableEnhancedSessionMode $true` turns that policy on.
    fr: |
      Les ressources locales comme le Presse-papiers ne sont disponibles que dans une session améliorée, qui exige à la fois la stratégie Enhanced session mode policy et le paramètre utilisateur Enhanced session mode sur l'hôte Hyper-V. L'invité et le client remplissent déjà la condition Windows 10 / Windows Server 2016 ou ultérieur et le Bureau à distance est activé dans VM1 : seule la stratégie du serveur manque. `Set-VMHost -EnableEnhancedSessionMode $true` active cette stratégie.
  options:
    a: { en: "Guest Service Interface is used by Copy-VMFile; it does not enable enhanced sessions or clipboard redirection.", fr: "Guest Service Interface sert à Copy-VMFile ; il n'active ni les sessions améliorées ni la redirection du Presse-papiers." }
    c: { en: "Grant-VMConnectAccess lets users who are not administrators open VMConnect; the administrators can already connect, and the session stays basic.", fr: "Grant-VMConnectAccess permet à des utilisateurs non administrateurs d'ouvrir VMConnect ; les administrateurs peuvent déjà se connecter, et la session reste de base." }
    d: { en: "An enhanced session runs over the VMBus and needs no network connectivity to the VM.", fr: "Une session améliorée passe par le VMBus et n'a besoin d'aucune connectivité réseau vers la machine virtuelle." }
references:
  - title: Use local resources on Hyper-V virtual machine with VMConnect
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/learn-more/use-local-resources-on-hyper-v-virtual-machine-with-vmconnect
  - title: Set-VMHost (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vmhost
