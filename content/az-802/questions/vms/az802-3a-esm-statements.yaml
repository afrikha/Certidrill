id: az802-3a-esm-statements
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV2** that runs Windows Server 2025. On HV2, the Enhanced session mode policy and the Enhanced session mode user setting are both turned on.

    HV2 hosts the virtual machines shown in the following table.

    | Name | Guest operating system | Remote Desktop in the guest | Network adapter |
    | --- | --- | --- | --- |
    | VM1 | Windows Server 2022 | Enabled | None |
    | VM2 | Windows Server 2012 R2 | Enabled | Connected to an external switch |

    An administrator uses Virtual Machine Connection (VMConnect) on a computer named **ADMIN1** that runs Windows 11 to connect to the virtual machines on HV2.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV2** qui exécute Windows Server 2025. Sur HV2, la stratégie Enhanced session mode policy et le paramètre utilisateur Enhanced session mode sont tous deux activés.

    HV2 héberge les machines virtuelles du tableau suivant.

    | Nom | Système d'exploitation invité | Bureau à distance dans l'invité | Carte réseau |
    | --- | --- | --- | --- |
    | VM1 | Windows Server 2022 | Activé | Aucune |
    | VM2 | Windows Server 2012 R2 | Activé | Connectée à un commutateur externe |

    Un administrateur utilise Connexion à une machine virtuelle (VMConnect) sur un ordinateur nommé **ADMIN1** qui exécute Windows 11 pour se connecter aux machines virtuelles de HV2.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The administrator can share a local drive of ADMIN1 with VM1 in a VMConnect session.
        fr: L'administrateur peut partager un lecteur local d'ADMIN1 avec VM1 dans une session VMConnect.
    - id: s2
      text:
        en: The administrator can redirect a USB smart card reader of ADMIN1 to VM2 in a VMConnect session.
        fr: L'administrateur peut rediriger un lecteur de cartes à puce USB d'ADMIN1 vers VM2 dans une session VMConnect.
    - id: s3
      text:
        en: VMConnect sessions to VM1 can use local resources of ADMIN1 only while Remote Desktop Services is enabled in VM1.
        fr: Les sessions VMConnect vers VM1 ne peuvent utiliser les ressources locales d'ADMIN1 que tant que les services Bureau à distance sont activés dans VM1.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      VM1 meets every requirement of Enhanced Session Mode (host settings on, Windows 10 / Windows Server 2016 or later guest and client, Remote Desktop Services enabled), and an enhanced session runs over the VMBus, so VM1 needs no network adapter to receive drives, the clipboard or USB devices. VM2 runs Windows Server 2012 R2, which is older than the minimum guest version, so its sessions stay basic whatever its network. Because Remote Desktop Services in the guest is a requirement, turning it off in VM1 removes local resource redirection.
    fr: |
      VM1 remplit toutes les conditions du mode de session amélioré (paramètres de l'hôte activés, invité et client Windows 10 / Windows Server 2016 ou ultérieur, services Bureau à distance activés), et une session améliorée passe par le VMBus : VM1 n'a besoin d'aucune carte réseau pour recevoir les lecteurs, le Presse-papiers ou les périphériques USB. VM2 exécute Windows Server 2012 R2, antérieur à la version minimale de l'invité : ses sessions restent de base, quel que soit son réseau. Comme les services Bureau à distance dans l'invité sont une condition, les désactiver dans VM1 supprime la redirection des ressources locales.
references:
  - title: Use local resources on Hyper-V virtual machine with VMConnect
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/learn-more/use-local-resources-on-hyper-v-virtual-machine-with-vmconnect
