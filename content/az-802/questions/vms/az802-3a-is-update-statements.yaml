id: az802-3a-is-update-statements
objective: "3.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV3** that runs Windows Server 2025. HV3 hosts the virtual machines shown in the following table.

    | Name | Guest operating system | Updates |
    | --- | --- | --- |
    | VM-A | Windows Server 2022 | Receives important updates from Windows Update |
    | VM-B | Ubuntu 22.04 LTS | Runs a current kernel |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV3** qui exécute Windows Server 2025. HV3 héberge les machines virtuelles du tableau suivant.

    | Nom | Système d'exploitation invité | Mises à jour |
    | --- | --- | --- |
    | VM-A | Windows Server 2022 | Reçoit les mises à jour importantes de Windows Update |
    | VM-B | Ubuntu 22.04 LTS | Exécute un noyau à jour |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The integration services of VM-A are updated through Windows Update.
        fr: Les services d'intégration de VM-A sont mis à jour par Windows Update.
    - id: s2
      text:
        en: To update the integration services of VM-A, you select Insert Integration Services Setup Disk in Virtual Machine Connection.
        fr: Pour mettre à jour les services d'intégration de VM-A, vous sélectionnez Insert Integration Services Setup Disk dans Connexion à une machine virtuelle.
    - id: s3
      text:
        en: You get the latest integration services components for VM-B by updating its Linux kernel.
        fr: Vous obtenez les derniers composants des services d'intégration pour VM-B en mettant à jour son noyau Linux.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Windows guests receive integration services updates through Windows Update when they get important updates. The Integration Services Setup Disk applies only to Hyper-V hosts earlier than Windows Server 2016 and Windows 10, so it is not used on HV3. Current Linux kernels include the integration services, and updating the kernel brings the latest components.
    fr: |
      Les invités Windows reçoivent les mises à jour des services d'intégration par Windows Update quand ils obtiennent les mises à jour importantes. Le disque d'installation des services d'intégration ne concerne que les hôtes Hyper-V antérieurs à Windows Server 2016 et Windows 10 : il ne sert pas sur HV3. Les noyaux Linux actuels incluent les services d'intégration, et mettre à jour le noyau apporte les derniers composants.
references:
  - title: Manage Hyper-V Integration Services
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/manage/manage-hyper-v-integration-services
