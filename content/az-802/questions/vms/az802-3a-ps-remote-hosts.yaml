id: az802-3a-ps-remote-hosts
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have two Hyper-V hosts named **HV1** and **HV2** that run Windows Server 2025. You have a workstation named **ADMIN1** that runs Windows 11 and has the Hyper-V PowerShell module installed. You are a member of the Hyper-V Administrators group on both hosts.

    You need to list the running virtual machines of HV1 and HV2 from ADMIN1 by using a single command. You must not sign in to the hosts.

    Which command should you run on ADMIN1?
  fr: |
    Vous disposez de deux hôtes Hyper-V nommés **HV1** et **HV2** qui exécutent Windows Server 2025. Vous disposez d'un poste de travail nommé **ADMIN1** qui exécute Windows 11 et sur lequel le module PowerShell Hyper-V est installé. Vous êtes membre du groupe Hyper-V Administrators sur les deux hôtes.

    Vous devez afficher depuis ADMIN1 la liste des machines virtuelles en cours d'exécution de HV1 et HV2 avec une seule commande. Vous ne devez pas vous connecter aux hôtes.

    Quelle commande devez-vous exécuter sur ADMIN1 ?
body:
  options:
    - { id: a, text: "Get-VM -Name HV1, HV2 | Where-Object State -eq 'Running'" }
    - { id: b, text: "Invoke-Command -VMName HV1, HV2 -ScriptBlock { Get-VM }" }
    - { id: c, text: "Enter-PSSession -VMName HV1, HV2" }
    - { id: d, text: "Get-VM -ComputerName HV1, HV2 | Where-Object State -eq 'Running'" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Hyper-V cmdlets accept `-ComputerName` with one or more Hyper-V hosts, so `Get-VM -ComputerName HV1, HV2` retrieves the virtual machines of both hosts remotely. Filtering on the State property keeps only the running ones.
    fr: |
      Les cmdlets Hyper-V acceptent `-ComputerName` avec un ou plusieurs hôtes Hyper-V : `Get-VM -ComputerName HV1, HV2` récupère à distance les machines virtuelles des deux hôtes. Le filtre sur la propriété State ne garde que celles en cours d'exécution.
  options:
    a: { en: "-Name filters on virtual machine names on the local computer; HV1 and HV2 are hosts, not VMs.", fr: "-Name filtre sur les noms de machines virtuelles de l'ordinateur local ; HV1 et HV2 sont des hôtes, pas des machines virtuelles." }
    b: { en: "-VMName uses PowerShell Direct, which targets VMs running on the local host, not remote Hyper-V hosts.", fr: "-VMName utilise PowerShell Direct, qui cible des machines virtuelles de l'hôte local, pas des hôtes Hyper-V distants." }
    c: { en: "Enter-PSSession opens one interactive session to a single VM through PowerShell Direct; it does not target hosts.", fr: "Enter-PSSession ouvre une session interactive vers une seule machine virtuelle avec PowerShell Direct ; il ne cible pas des hôtes." }
references:
  - title: Get-VM (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/get-vm
