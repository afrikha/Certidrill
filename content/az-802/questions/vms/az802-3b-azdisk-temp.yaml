id: az802-3b-azdisk-temp
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure virtual machine named **VM2** that runs Windows Server 2025. VM2 has an OS disk (C:) and a local temporary disk (D:). An application on VM2 writes export files to D:.

    Every Friday evening, an automation task stops VM2 so that it is deallocated, and starts it on Monday morning. On Monday, the export files are missing.

    You need the export files to persist when VM2 is deallocated. The solution must not use the OS disk.

    What should you do?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **VM2** qui exécute Windows Server 2025. VM2 possède un disque de système d'exploitation (C:) et un disque temporaire local (D:). Une application de VM2 écrit des fichiers d'exportation sur D:.

    Chaque vendredi soir, une tâche d'automatisation arrête VM2 pour qu'elle soit libérée, puis la démarre le lundi matin. Le lundi, les fichiers d'exportation ont disparu.

    Vous devez faire en sorte que les fichiers d'exportation soient conservés quand VM2 est libérée. La solution ne doit pas utiliser le disque de système d'exploitation.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Attach a managed data disk to VM2 and store the files on it.", fr: "Attacher un disque de données managé à VM2 et y stocker les fichiers." } }
    - { id: b, text: { en: "Resize VM2 to a size that has a larger temporary disk.", fr: "Redimensionner VM2 vers une taille dotée d'un disque temporaire plus grand." } }
    - { id: c, text: { en: "Create a snapshot of the temporary disk every Friday.", fr: "Créer un instantané du disque temporaire chaque vendredi." } }
    - { id: d, text: { en: "Set the host caching of the temporary disk to Read/write.", fr: "Définir la mise en cache de l'hôte du disque temporaire sur Lecture/écriture." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The temporary disk isn't a managed disk: its data can be lost during maintenance, redeployment or when the VM is stopped, and it survives only a standard restart. A managed data disk is persistent storage that stays attached across deallocation.
    fr: |
      Le disque temporaire n'est pas un disque managé : ses données peuvent être perdues lors d'une maintenance, d'un redéploiement ou de l'arrêt de la machine virtuelle, et elles ne survivent qu'à un redémarrage standard. Un disque de données managé est un stockage persistant qui reste attaché après la libération.
  options:
    b:
      en: |
        A larger temporary disk is still temporary: its content is still lost when the VM is deallocated.
      fr: |
        Un disque temporaire plus grand reste temporaire : son contenu est toujours perdu quand la machine virtuelle est libérée.
    c:
      en: |
        Snapshots apply to managed disks; the temporary disk isn't a managed disk.
      fr: |
        Les instantanés s'appliquent aux disques managés ; le disque temporaire n'est pas un disque managé.
    d:
      en: |
        Host caching is a setting of managed OS and data disks; it doesn't make the temporary disk persistent.
      fr: |
        La mise en cache de l'hôte est un paramètre des disques managés de système d'exploitation et de données ; elle ne rend pas le disque temporaire persistant.
references:
  - title: Overview of Azure Disk Storage
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/managed-disks-overview
