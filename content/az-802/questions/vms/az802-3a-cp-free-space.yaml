id: az802-3a-cp-free-space
objective: "3.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV2** that hosts a virtual machine named **VM27**. VM27 has a chain of five checkpoints created during the last six months. The volume that stores VM27 is almost full because of the checkpoint files.

    You need to free space on the volume. VM27 must keep its current state, and none of the checkpoints is still needed.

    What should you do?
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV2** qui héberge une machine virtuelle nommée **VM27**. VM27 possède une chaîne de cinq points de contrôle créés au cours des six derniers mois. Le volume qui stocke VM27 est presque plein à cause des fichiers des points de contrôle.

    Vous devez libérer de l'espace sur le volume. VM27 doit conserver son état actuel, et aucun des points de contrôle n'est encore utile.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Delete the .avhdx files of VM27 by using File Explorer.", fr: "Supprimer les fichiers .avhdx de VM27 avec l'Explorateur de fichiers." } }
    - { id: b, text: { en: "Apply the oldest checkpoint, and then delete all the checkpoints.", fr: "Appliquer le point de contrôle le plus ancien, puis supprimer tous les points de contrôle." } }
    - { id: c, text: { en: "In Hyper-V Manager, select Delete Checkpoint Subtree on the oldest checkpoint.", fr: "Dans le Gestionnaire Hyper-V, sélectionner Delete Checkpoint Subtree sur le point de contrôle le plus ancien." } }
    - { id: d, text: { en: "Run Set-VM -Name VM27 -AutomaticCheckpointsEnabled $false.", fr: "Exécuter Set-VM -Name VM27 -AutomaticCheckpointsEnabled $false." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Delete Checkpoint Subtree deletes a checkpoint and all the checkpoints created after it. When checkpoints are deleted from Hyper-V, the .avhdx differencing disks are merged into the parent disk and then removed, so the current state of VM27 is kept and the space of the chain is released.
    fr: |
      Delete Checkpoint Subtree supprime un point de contrôle et tous les points de contrôle créés après lui. Quand des points de contrôle sont supprimés depuis Hyper-V, les disques de différenciation .avhdx sont fusionnés dans le disque parent, puis retirés : l'état actuel de VM27 est conservé et l'espace de la chaîne est libéré.
  options:
    a: { en: "Never delete .avhdx files directly: the current state of VM27 depends on them, and only Hyper-V merges them safely.", fr: "Ne supprimez jamais directement des fichiers .avhdx : l'état actuel de VM27 en dépend, et seul Hyper-V les fusionne sans risque." }
    b: { en: "Applying the oldest checkpoint replaces the current state of VM27, which must be kept.", fr: "Appliquer le point de contrôle le plus ancien remplace l'état actuel de VM27, qui doit être conservé." }
    d: { en: "Disabling automatic checkpoints prevents new automatic checkpoints but leaves the existing chain on the volume.", fr: "Désactiver les points de contrôle automatiques empêche de nouveaux points de contrôle automatiques, mais laisse la chaîne existante sur le volume." }
references:
  - title: Using checkpoints
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/manage/enable-or-disable-checkpoints-in-hyper-v
