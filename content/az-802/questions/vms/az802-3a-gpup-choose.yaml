id: az802-3a-gpup-choose
objective: "3.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have two standalone Hyper-V hosts named **HV9** and **HV10** that run Windows Server 2025 Datacenter. Each host has two NVIDIA A16 GPUs and 4th Gen Intel Xeon Scalable processors with IOMMU DMA bit tracking. The hosts use the NVIDIA vGPU software v18 driver.

    You plan to deploy 16 virtual desktop VMs on HV9. Every VM must have GPU acceleration, and the VMs must be live migrated to HV10 during planned maintenance of HV9.

    Which feature should you use?
  fr: |
    Vous disposez de deux hôtes Hyper-V autonomes nommés **HV9** et **HV10** qui exécutent Windows Server 2025 Datacenter. Chaque hôte dispose de deux GPU NVIDIA A16 et de processeurs Intel Xeon Scalable de 4e génération avec suivi des bits DMA IOMMU. Les hôtes utilisent le pilote NVIDIA vGPU software v18.

    Vous prévoyez de déployer 16 machines virtuelles de bureau virtuel sur HV9. Chaque machine virtuelle doit disposer de l'accélération GPU, et les machines virtuelles doivent être déplacées vers HV10 par migration dynamique pendant la maintenance planifiée de HV9.

    Quelle fonctionnalité devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Discrete Device Assignment", fr: "Attribution discrète d'appareil" } }
    - { id: b, text: { en: "Nested virtualization", fr: "Virtualisation imbriquée" } }
    - { id: c, text: { en: "GPU partitioning", fr: "Partitionnement GPU" } }
    - { id: d, text: { en: "Single-root I/O virtualization (SR-IOV) on the virtual switch", fr: "Virtualisation d'E/S d'une racine unique (SR-IOV) sur le commutateur virtuel" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      GPU partitioning shares each physical GPU between several VMs, each VM getting a dedicated fraction through SR-IOV, so four GPUs can serve 16 desktops. The A16 is on the supported list, and Windows Server 2025 supports live migration of VMs with a GPU partition when the processors support IOMMU DMA bit tracking and the NVIDIA driver is vGPU software v18 or later.
    fr: |
      Le partitionnement GPU partage chaque GPU physique entre plusieurs machines virtuelles, chacune recevant une fraction dédiée par SR-IOV : quatre GPU peuvent servir 16 bureaux. L'A16 figure dans la liste prise en charge, et Windows Server 2025 prend en charge la migration dynamique des machines virtuelles dotées d'une partition GPU quand les processeurs prennent en charge le suivi des bits DMA IOMMU et que le pilote NVIDIA est vGPU software v18 ou ultérieur.
  options:
    a: { en: "DDA gives a whole GPU to one VM, so two GPUs per host cannot serve 16 VMs, and DDA blocks live migration.", fr: "DDA donne un GPU entier à une seule machine virtuelle : deux GPU par hôte ne peuvent pas servir 16 machines virtuelles, et DDA bloque la migration dynamique." }
    b: { en: "Nested virtualization exposes processor virtualization extensions to a VM; it gives no GPU access.", fr: "La virtualisation imbriquée expose les extensions de virtualisation du processeur à une machine virtuelle ; elle ne donne aucun accès GPU." }
    d: { en: "SR-IOV on a virtual switch accelerates networking for VMs; it does not share a GPU.", fr: "SR-IOV sur un commutateur virtuel accélère le réseau des machines virtuelles ; il ne partage pas de GPU." }
references:
  - title: Partition and share GPUs with virtual machines on Hyper-V
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/gpu-partitioning
