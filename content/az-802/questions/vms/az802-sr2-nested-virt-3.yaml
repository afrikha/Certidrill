id: az802-sr2-nested-virt-3
objective: "3.1.3"
type: series_yesno
series: az802-sr2-nested-virt
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You stop VM1, expose the virtualization extensions and connect the nested virtual machines to a NAT network in VM1.
  fr: |
    Vous arrêtez VM1, exposez les extensions de virtualisation et connectez les machines virtuelles imbriquées à un réseau NAT dans VM1.
body:
  solution:
    en: |
      You shut down VM1, run `Set-VMProcessor -VMName VM1 -ExposeVirtualizationExtensions $true` on Server1 and start VM1. You install the Hyper-V role in VM1. In VM1, you run `New-VMSwitch -Name VmNAT -SwitchType Internal` and `New-NetNat -Name LocalNAT -InternalIPInterfaceAddressPrefix "192.168.100.0/24"`, assign 192.168.100.1 to the vEthernet (VmNAT) adapter, and connect the nested virtual machines to VmNAT.
    fr: |
      Vous arrêtez VM1, exécutez `Set-VMProcessor -VMName VM1 -ExposeVirtualizationExtensions $true` sur Server1 et démarrez VM1. Vous installez le rôle Hyper-V dans VM1. Dans VM1, vous exécutez `New-VMSwitch -Name VmNAT -SwitchType Internal` et `New-NetNat -Name LocalNAT -InternalIPInterfaceAddressPrefix "192.168.100.0/24"`, attribuez 192.168.100.1 à la carte vEthernet (VmNAT), puis connectez les machines virtuelles imbriquées à VmNAT.
answer: { value: false }
explanation:
  correct:
    en: |
      Nested virtualization works, but the NAT option places the nested virtual machines on a private 192.168.100.0/24 network behind VM1, where each one receives a static address and uses 192.168.100.1 as its gateway. Their DHCP requests never reach the corporate network. NAT is meant for cases where MAC address spoofing is not possible, such as a public cloud.
    fr: |
      La virtualisation imbriquée fonctionne, mais l'option NAT place les machines virtuelles imbriquées sur un réseau privé 192.168.100.0/24 derrière VM1, où chacune reçoit une adresse statique et utilise 192.168.100.1 comme passerelle. Leurs requêtes DHCP n'atteignent jamais le réseau de l'entreprise. Le NAT est destiné aux cas où l'usurpation d'adresses MAC n'est pas possible, comme dans un cloud public.
references:
  - title: Run Hyper-V in a Virtual Machine with Nested Virtualization
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/enable-nested-virtualization
