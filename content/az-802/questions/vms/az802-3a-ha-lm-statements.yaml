id: az802-3a-ha-lm-statements
objective: "3.1.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have two standalone Hyper-V hosts named **HV17** and **HV18** that are members of the contoso.com domain. You plan to configure live migration between the hosts without failover clustering.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de deux hôtes Hyper-V autonomes nommés **HV17** et **HV18** membres du domaine contoso.com. Vous prévoyez de configurer la migration dynamique entre les hôtes sans clustering de basculement.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Kerberos authentication works without any change to the computer accounts of HV17 and HV18.", fr: "L'authentification Kerberos fonctionne sans aucune modification des comptes d'ordinateur de HV17 et HV18." } }
    - { id: b, text: { en: "With CredSSP authentication, you must be signed in to the source server to start a live migration.", fr: "Avec l'authentification CredSSP, vous devez être connecté au serveur source pour lancer une migration dynamique." } }
    - { id: c, text: { en: "The default number of simultaneous live migrations is 4.", fr: "Le nombre par défaut de migrations dynamiques simultanées est 4." } }
    - { id: d, text: { en: "Compression is the default performance option.", fr: "Compression est l'option de performances par défaut." } }
    - { id: e, text: { en: "After the hosts are upgraded to Windows Server 2025, CredSSP-based live migration keeps working with the default settings.", fr: "Après la mise à niveau des hôtes vers Windows Server 2025, la migration dynamique avec CredSSP continue de fonctionner avec les paramètres par défaut." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      CredSSP needs no delegation, but you must be signed in to the source server through a console, Remote Desktop or remote PowerShell session. By default, memory is compressed before it is copied over TCP/IP; the other options are TCP/IP and SMB.
    fr: |
      CredSSP n'exige aucune délégation, mais vous devez être connecté au serveur source par une session console, Bureau à distance ou PowerShell à distance. Par défaut, la mémoire est compressée avant d'être copiée sur TCP/IP ; les autres options sont TCP/IP et SMB.
  options:
    a: { en: "Kerberos requires constrained delegation on each computer account to the cifs and Microsoft Virtual System Migration Service services of the other host.", fr: "Kerberos exige une délégation contrainte sur chaque compte d'ordinateur vers les services cifs et Microsoft Virtual System Migration Service de l'autre hôte." }
    c: { en: "The default number of simultaneous live migrations is 2.", fr: "Le nombre par défaut de migrations dynamiques simultanées est 2." }
    e: { en: "Credential Guard is enabled by default on domain-joined Windows Server 2025 servers that are not domain controllers, so CredSSP live migration stops working; use Kerberos constrained delegation.", fr: "Credential Guard est activé par défaut sur les serveurs Windows Server 2025 joints à un domaine qui ne sont pas contrôleurs de domaine : la migration dynamique CredSSP cesse de fonctionner ; utilisez la délégation Kerberos contrainte." }
references:
  - title: Setting Up Hosts for Live Migration Without Failover Clustering
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/deploy/set-up-hosts-for-live-migration-without-failover-clustering
