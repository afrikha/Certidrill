id: az802-3a-gpup-statements
objective: "3.1.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV12** that runs Windows Server 2025. HV12 has a GPU that is configured for GPU partitioning with four partitions. HV12 hosts a virtual machine named **VM25** that runs Windows 11 and has the GPU vendor's driver installed.

    You manage GPU partitions by using Windows Admin Center.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV12** qui exécute Windows Server 2025. HV12 dispose d'un GPU configuré pour le partitionnement GPU avec quatre partitions. HV12 héberge une machine virtuelle nommée **VM25** qui exécute Windows 11 et sur laquelle le pilote du fabricant du GPU est installé.

    Vous gérez les partitions GPU avec Windows Admin Center.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can assign two partitions of the GPU to VM25 to double its GPU resources.
        fr: Vous pouvez attribuer deux partitions du GPU à VM25 pour doubler ses ressources GPU.
    - id: s2
      text:
        en: If VM25 is running when you assign a partition, Windows Admin Center turns VM25 off, assigns the partition, and turns VM25 back on.
        fr: Si VM25 est en cours d'exécution quand vous attribuez une partition, Windows Admin Center arrête VM25, attribue la partition, puis redémarre VM25.
    - id: s3
      text:
        en: You can choose which of the four partitions is assigned to VM25.
        fr: Vous pouvez choisir laquelle des quatre partitions est attribuée à VM25.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Currently, only a single GPU partition can be assigned to a VM, and the VM and its partition must be on the same host. When you assign a partition to a running VM, Windows Admin Center turns the VM off, makes the change and turns it back on, so save the workloads first. Partitions are assigned automatically; you cannot pick a specific partition for a VM.
    fr: |
      Actuellement, une seule partition GPU peut être attribuée à une machine virtuelle, et la machine virtuelle et sa partition doivent se trouver sur le même hôte. Quand vous attribuez une partition à une machine virtuelle en cours d'exécution, Windows Admin Center arrête la machine virtuelle, effectue la modification et la redémarre : enregistrez d'abord les charges de travail. Les partitions sont attribuées automatiquement ; vous ne pouvez pas choisir une partition précise pour une machine virtuelle.
references:
  - title: Partition and assign GPUs to a virtual machine in Hyper-V
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/partition-assign-vm-gpu
  - title: Partition and share GPUs with virtual machines on Hyper-V
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/gpu-partitioning
