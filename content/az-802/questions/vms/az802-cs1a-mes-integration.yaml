id: az802-cs1a-mes-integration
objective: "3.1.5"
type: yesno_statements
caseStudy: az802-cs1a-munsons
difficulty: 2
status: draft
stem:
  en: |
    You are evaluating how to meet the file transfer requirement for VM-MES1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez comment respecter l'exigence de transfert de fichiers pour VM-MES1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An administrator can run Copy-VMFile on HV1 to copy a package into VM-MES1 without changing the integration services of VM-MES1.
        fr: Un administrateur peut exécuter Copy-VMFile sur HV1 pour copier un package dans VM-MES1 sans modifier les services d'intégration de VM-MES1.
    - id: s2
      text:
        en: From HV1, an administrator can manage VM-MES1 by using PowerShell Direct even though HV1 has no network connection to the OT network.
        fr: Depuis HV1, un administrateur peut gérer VM-MES1 avec PowerShell Direct, bien que HV1 n'ait aucune connexion réseau avec le réseau OT.
    - id: s3
      text:
        en: If you disable the Data Exchange integration service of VM-MES1, VM-MES1 can no longer be backed up by using VSS while it runs.
        fr: Si vous désactivez le service d'intégration Data Exchange de VM-MES1, VM-MES1 ne peut plus être sauvegardée avec VSS pendant son exécution.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Copy-VMFile relies on the Guest Service Interface integration service, which is disabled by default, so you must enable it first (for example with `Enable-VMIntegrationService -VMName VM-MES1 -Name "Guest Service Interface"`). PowerShell Direct lets the host manage a VM without a virtual network connection. Online VSS backups depend on the Volume Shadow Copy Requestor service, not on Data Exchange (KVP), which only exchanges key-value metadata.
    fr: |
      Copy-VMFile s'appuie sur le service d'intégration Guest Service Interface, désactivé par défaut ; vous devez donc d'abord l'activer (par exemple avec `Enable-VMIntegrationService -VMName VM-MES1 -Name "Guest Service Interface"`). PowerShell Direct permet à l'hôte de gérer une machine virtuelle sans connexion réseau virtuelle. Les sauvegardes VSS en ligne dépendent du service Volume Shadow Copy Requestor, pas de Data Exchange (KVP), qui n'échange que des métadonnées clé-valeur.
references:
  - title: Hyper-V Integration Services
    url: https://learn.microsoft.com/en-us/virtualization/hyper-v-on-windows/reference/integration-services
  - title: Copy-VMFile
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/copy-vmfile
