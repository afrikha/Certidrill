id: az802-3b-nic-vlan-trunk
objective: "3.1.11"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV2** that runs Windows Server 2025. The physical switch port of HV2 is an 802.1q trunk. HV2 hosts a firewall appliance virtual machine named **FW1** that has a network adapter named **Inside**.

    You need to meet the following requirements:

    - The Inside adapter of FW1 must send and receive traffic tagged with VLANs 10 through 30. Untagged traffic must be treated as VLAN 10.
    - The management operating system of HV2 must tag its traffic with VLAN 5.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV2** qui exécute Windows Server 2025. Le port du commutateur physique de HV2 est un trunk 802.1q. HV2 héberge une machine virtuelle de type appliance de pare-feu nommée **FW1**, qui possède une carte réseau nommée **Inside**.

    Vous devez satisfaire les exigences suivantes :

    - La carte Inside de FW1 doit envoyer et recevoir le trafic marqué avec les VLAN 10 à 30. Le trafic non marqué doit être traité comme appartenant au VLAN 10.
    - Le système d'exploitation de gestion de HV2 doit marquer son trafic avec le VLAN 5.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Set-VMNetworkAdapterVlan -VMName FW1 -VMNetworkAdapterName Inside [[mode]] -AllowedVlanIdList 10-30 [[native]] 10
    Set-VMNetworkAdapterVlan [[host]] -Access -VlanId 5
  slots:
    - id: mode
      options:
        - { id: access, text: -Access }
        - { id: trunk, text: -Trunk }
        - { id: promisc, text: -Promiscuous }
        - { id: untagged, text: -Untagged }
    - id: native
      options:
        - { id: vlanid, text: -VlanId }
        - { id: primary, text: -PrimaryVlanId }
        - { id: nativeid, text: -NativeVlanId }
    - id: host
      options:
        - { id: mgmt, text: -ManagementOS }
        - { id: vmname, text: -VMName HV2 }
        - { id: computer, text: -ComputerName HV2 }
answer:
  values: { mode: trunk, native: nativeid, host: mgmt }
explanation:
  correct:
    en: |
      Trunk mode lets one adapter carry several VLANs: `-Trunk` is used with `-AllowedVlanIdList` and `-NativeVlanId`, the VLAN given to untagged traffic. The host's own virtual adapter is targeted with `-ManagementOS`, here in access mode with VLAN 5.
    fr: |
      Le mode trunk permet à une seule carte de transporter plusieurs VLAN : `-Trunk` s'utilise avec `-AllowedVlanIdList` et `-NativeVlanId`, le VLAN attribué au trafic non marqué. La carte virtuelle de l'hôte lui-même se cible avec `-ManagementOS`, ici en mode accès avec le VLAN 5.
  options:
    access:
      en: |
        Access mode tags all the traffic of the adapter with a single VLAN and is used with `-VlanId`, not with a list of VLANs.
      fr: |
        Le mode accès marque tout le trafic de la carte avec un seul VLAN et s'utilise avec `-VlanId`, pas avec une liste de VLAN.
    promisc:
      en: |
        Promiscuous is a private VLAN mode used with a primary VLAN and secondary VLANs, not a trunk.
      fr: |
        Promiscuous est un mode de VLAN privé utilisé avec un VLAN principal et des VLAN secondaires, pas un trunk.
    primary:
      en: |
        `-PrimaryVlanId` belongs to the private VLAN modes (isolated, community, promiscuous).
      fr: |
        `-PrimaryVlanId` appartient aux modes de VLAN privé (isolated, community, promiscuous).
    computer:
      en: |
        `-ComputerName` selects the Hyper-V host that runs the command; it doesn't select the management operating system adapter.
      fr: |
        `-ComputerName` sélectionne l'hôte Hyper-V qui exécute la commande ; il ne sélectionne pas la carte du système d'exploitation de gestion.
references:
  - title: Set-VMNetworkAdapterVlan (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vmnetworkadaptervlan
