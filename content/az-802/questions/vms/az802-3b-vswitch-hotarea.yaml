id: az802-3b-vswitch-hotarea
objective: "3.1.13"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV10** that runs Windows Server 2025. HV10 has the virtual switches shown in the following table.

    You plan to deploy two virtual machines on HV10:

    - **VM-TEST1** must communicate with other virtual machines on HV10 and with HV10 itself, but never with the physical network.
    - **VM-WEB1** must reach the physical network through a physical adapter that the operating system of HV10 doesn't use.

    Answer each prompt by selecting the virtual switch to which you should connect the virtual machine.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV10** qui exécute Windows Server 2025. HV10 possède les commutateurs virtuels présentés dans le tableau suivant.

    Vous prévoyez de déployer deux machines virtuelles sur HV10 :

    - **VM-TEST1** doit communiquer avec les autres machines virtuelles de HV10 et avec HV10 lui-même, mais jamais avec le réseau physique.
    - **VM-WEB1** doit accéder au réseau physique par une carte physique que le système d'exploitation de HV10 n'utilise pas.

    Répondez à chaque consigne en sélectionnant le commutateur virtuel auquel vous devez connecter la machine virtuelle.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Switch for VM-TEST1", fr: "Commutateur pour VM-TEST1" }
    - id: p2
      text: { en: "Switch for VM-WEB1", fr: "Commutateur pour VM-WEB1" }
  grid:
    header:
      - { en: Name, fr: Nom }
      - { en: Switch type, fr: Type de commutateur }
      - { en: Physical adapter, fr: Carte physique }
      - { en: "Allow management operating system to share this network adapter", fr: "Autoriser le système d'exploitation de gestion à partager cette carte réseau" }
    rows:
      - [{ text: Corp, area: corp }, { text: { en: External, fr: Externe } }, { text: NIC1 }, { text: { en: Selected, fr: Coché } }]
      - [{ text: DMZ, area: dmz }, { text: { en: External, fr: Externe } }, { text: NIC2 }, { text: { en: Cleared, fr: Décoché } }]
      - [{ text: HostLab, area: hostlab }, { text: { en: Internal, fr: Interne } }, { text: { en: None, fr: Aucune } }, { text: { en: Not applicable, fr: Non applicable } }]
      - [{ text: Isolated, area: isolated }, { text: { en: Private, fr: Privé } }, { text: { en: None, fr: Aucune } }, { text: { en: Not applicable, fr: Non applicable } }]
answer:
  values: { p1: hostlab, p2: dmz }
explanation:
  correct:
    en: |
      An internal switch connects the virtual machines of the host to each other and to the host through a host virtual adapter, without any physical adapter, so HostLab fits VM-TEST1. A private switch (Isolated) would exclude the host. An external switch whose management operating system sharing is cleared gives the VMs a physical adapter that the host doesn't use, so DMZ fits VM-WEB1; Corp shares NIC1 with the host.
    fr: |
      Un commutateur interne relie les machines virtuelles de l'hôte entre elles et à l'hôte par une carte virtuelle de l'hôte, sans carte physique : HostLab convient à VM-TEST1. Un commutateur privé (Isolated) exclurait l'hôte. Un commutateur externe dont le partage avec le système d'exploitation de gestion est décoché donne aux machines virtuelles une carte physique que l'hôte n'utilise pas : DMZ convient à VM-WEB1 ; Corp partage NIC1 avec l'hôte.
references:
  - title: Create and configure a virtual switch with Hyper-V
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/get-started/create-a-virtual-switch-for-hyper-v-virtual-machines
  - title: New-VMSwitch (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/new-vmswitch
