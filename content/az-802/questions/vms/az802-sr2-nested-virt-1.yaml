id: az802-sr2-nested-virt-1
objective: "3.1.3"
type: series_yesno
series: az802-sr2-nested-virt
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You stop VM1, expose the virtualization extensions, enable MAC address spoofing and use an external switch in VM1.
  fr: |
    Vous arrêtez VM1, exposez les extensions de virtualisation, activez l'usurpation d'adresses MAC et utilisez un commutateur externe dans VM1.
body:
  solution:
    en: |
      You shut down VM1. On Server1, you run `Set-VMProcessor -VMName VM1 -ExposeVirtualizationExtensions $true` and `Get-VMNetworkAdapter -VMName VM1 | Set-VMNetworkAdapter -MacAddressSpoofing On`. You start VM1, install the Hyper-V role in VM1, and create in VM1 an external virtual switch bound to its network adapter for the nested virtual machines.
    fr: |
      Vous arrêtez VM1. Sur Server1, vous exécutez `Set-VMProcessor -VMName VM1 -ExposeVirtualizationExtensions $true` et `Get-VMNetworkAdapter -VMName VM1 | Set-VMNetworkAdapter -MacAddressSpoofing On`. Vous démarrez VM1, installez le rôle Hyper-V dans VM1, puis créez dans VM1 un commutateur virtuel externe lié à sa carte réseau pour les machines virtuelles imbriquées.
answer: { value: true }
explanation:
  correct:
    en: |
      Server1 meets the Intel prerequisites (Windows Server 2016 or later, configuration version 8.0 or higher), and the virtualization extensions are exposed while VM1 is off. Packets of the nested virtual machines cross two virtual switches, so MAC address spoofing must be enabled on the adapter of VM1 on the first-level switch; the nested virtual machines then reach the corporate network and its DHCP server.
    fr: |
      Server1 remplit les prérequis Intel (Windows Server 2016 ou ultérieur, version de configuration 8.0 ou supérieure), et les extensions de virtualisation sont exposées pendant que VM1 est arrêtée. Les paquets des machines virtuelles imbriquées traversent deux commutateurs virtuels : l'usurpation d'adresses MAC doit être activée sur la carte de VM1 au niveau du premier commutateur. Les machines virtuelles imbriquées atteignent alors le réseau de l'entreprise et son serveur DHCP.
references:
  - title: Run Hyper-V in a Virtual Machine with Nested Virtualization
    url: https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/enable-nested-virtualization
