id: az802-3b-vhd-compact
objective: "3.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Hyper-V host named **HV1** that runs Windows Server 2025. HV1 hosts a virtual machine named **FS1** that has a dynamically expanding data disk stored in `D:\VMs\FS1-data.vhdx`.

    An administrator deletes 400 GB of files inside FS1. The `FS1-data.vhdx` file on HV1 still occupies 900 GB. You shut down FS1.

    You need to reduce the space that `FS1-data.vhdx` uses on the volume of HV1. The maximum size of the disk seen by FS1 must not change.

    Which cmdlet should you run?
  fr: |
    Vous disposez d'un hôte Hyper-V nommé **HV1** qui exécute Windows Server 2025. HV1 héberge une machine virtuelle nommée **FS1** dont le disque de données dynamiquement extensible est stocké dans `D:\VMs\FS1-data.vhdx`.

    Un administrateur supprime 400 Go de fichiers dans FS1. Le fichier `FS1-data.vhdx` occupe toujours 900 Go sur HV1. Vous arrêtez FS1.

    Vous devez réduire l'espace qu'occupe `FS1-data.vhdx` sur le volume de HV1. La taille maximale du disque vue par FS1 ne doit pas changer.

    Quelle applet de commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: Resize-VHD }
    - { id: b, text: Convert-VHD }
    - { id: c, text: Optimize-VHD }
    - { id: d, text: Merge-VHD }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `Optimize-VHD` compacts a dynamic or differencing disk: it reclaims unused blocks and packs the remaining ones, which reduces the size of the file on the host. It doesn't change the maximum size of the disk. The disk must not be attached, or must be attached read-only, which is the case once FS1 is shut down.
    fr: |
      `Optimize-VHD` compacte un disque dynamique ou de différenciation : il récupère les blocs inutilisés et regroupe les autres, ce qui réduit la taille du fichier sur l'hôte. Il ne modifie pas la taille maximale du disque. Le disque ne doit pas être attaché, ou doit l'être en lecture seule, ce qui est le cas une fois FS1 arrêtée.
  options:
    a:
      en: |
        `Resize-VHD` changes the maximum size of the disk seen by the guest, which the requirement forbids, and it doesn't remove empty blocks from a dynamic disk.
      fr: |
        `Resize-VHD` modifie la taille maximale du disque vue par l'invité, ce que l'exigence interdit, et il ne supprime pas les blocs vides d'un disque dynamique.
    b:
      en: |
        `Convert-VHD` changes the format or the type of a disk into a new file; it isn't the tool that reclaims unused space.
      fr: |
        `Convert-VHD` change le format ou le type d'un disque dans un nouveau fichier ; ce n'est pas l'outil qui récupère l'espace inutilisé.
    d:
      en: |
        `Merge-VHD` merges a differencing disk into its parent. FS1-data.vhdx is a dynamically expanding disk, not a differencing chain.
      fr: |
        `Merge-VHD` fusionne un disque de différenciation dans son parent. FS1-data.vhdx est un disque dynamiquement extensible, pas une chaîne de différenciation.
references:
  - title: Optimize-VHD (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/optimize-vhd
  - title: Resize-VHD (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/resize-vhd
