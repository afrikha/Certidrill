id: az802-3a-mem-settings-dragdrop
objective: "3.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are configuring Dynamic Memory for a virtual machine named **VM16** by using Set-VMMemory.

    Which parameter should you use for each setting? To answer, drag the appropriate parameters to the correct settings. Each parameter may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez la mémoire dynamique d'une machine virtuelle nommée **VM16** avec Set-VMMemory.

    Quel paramètre devez-vous utiliser pour chaque réglage ? Pour répondre, faites glisser les paramètres appropriés vers les réglages correspondants. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: startup, text: "-StartupBytes" }
    - { id: minimum, text: "-MinimumBytes" }
    - { id: maximum, text: "-MaximumBytes" }
    - { id: buffer, text: "-Buffer" }
    - { id: priority, text: "-Priority" }
    - { id: numa, text: "-MaximumAmountPerNumaNodeBytes" }
  targets:
    - id: t1
      text: { en: "Amount of memory allocated to VM16 when it starts", fr: "Quantité de mémoire allouée à VM16 à son démarrage" }
    - id: t2
      text: { en: "Lowest amount of memory that VM16 can have while it runs", fr: "Quantité de mémoire la plus basse dont VM16 peut disposer pendant son exécution" }
    - id: t3
      text: { en: "Percentage of memory reserved for VM16 in addition to its demand", fr: "Pourcentage de mémoire réservé à VM16 en plus de sa demande" }
    - id: t4
      text: { en: "Importance of VM16 relative to the other VMs when host memory is allocated", fr: "Importance de VM16 par rapport aux autres machines virtuelles lors de l'allocation de la mémoire de l'hôte" }
answer:
  mapping: { t1: startup, t2: minimum, t3: buffer, t4: priority }
explanation:
  correct:
    en: |
      With Dynamic Memory, StartupBytes is the initial memory, MinimumBytes the lowest value Hyper-V can reduce the VM to, and MaximumBytes the highest it can grow to. Buffer is a percentage (5 to 2000) reserved above demand, and Priority (0 to 100) ranks the VM against the others on the host for memory availability.
    fr: |
      Avec la mémoire dynamique, StartupBytes est la mémoire initiale, MinimumBytes la valeur la plus basse à laquelle Hyper-V peut réduire la machine virtuelle, et MaximumBytes la plus haute qu'elle peut atteindre. Buffer est un pourcentage (5 à 2000) réservé en plus de la demande, et Priority (0 à 100) classe la machine virtuelle par rapport aux autres de l'hôte pour la disponibilité de la mémoire.
  options:
    maximum: { en: "MaximumBytes is the ceiling of Dynamic Memory, which none of the settings asks for.", fr: "MaximumBytes est le plafond de la mémoire dynamique, qu'aucun des réglages ne demande." }
    numa: { en: "MaximumAmountPerNumaNodeBytes limits memory per NUMA node; it is not one of the Dynamic Memory settings listed.", fr: "MaximumAmountPerNumaNodeBytes limite la mémoire par nœud NUMA ; ce n'est pas l'un des réglages de mémoire dynamique listés." }
references:
  - title: Set-VMMemory (Hyper-V)
    url: https://learn.microsoft.com/en-us/powershell/module/hyper-v/set-vmmemory
