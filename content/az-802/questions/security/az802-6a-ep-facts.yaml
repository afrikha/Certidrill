id: az802-6a-ep-facts
objective: "6.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a server named **Server2** that runs Windows Server 2025. You review its exploit protection configuration by running the following command.

    ```powershell
    Get-ProcessMitigation -Name app2.exe
    ```

    The output shows the value **NOTSET** for the **Heap** settings of app2.exe. No Group Policy setting for exploit protection applies to Server2.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur nommé **Server2** qui exécute Windows Server 2025. Vous examinez sa configuration de protection contre les attaques (exploit protection) en exécutant la commande suivante.

    ```powershell
    Get-ProcessMitigation -Name app2.exe
    ```

    La sortie affiche la valeur **NOTSET** pour les paramètres **Heap** d'app2.exe. Aucun paramètre de stratégie de groupe relatif à la protection contre les attaques ne s'applique à Server2.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: For app2.exe, the heap integrity mitigation is turned off regardless of the system-level setting.
        fr: Pour app2.exe, l'atténuation d'intégrité du tas est désactivée, quel que soit le paramètre de niveau système.
    - id: s2
      text:
        en: You can run Validate heap integrity in audit mode for app2.exe before you enforce it.
        fr: Vous pouvez exécuter Validate heap integrity en mode audit pour app2.exe avant de l'appliquer.
    - id: s3
      text:
        en: If you later deploy an exploit protection XML file to Server2 by using Group Policy, its settings override the mitigations configured locally in Windows Security.
        fr: Si vous déployez ultérieurement un fichier XML de protection contre les attaques sur Server2 à l'aide d'une stratégie de groupe, ses paramètres remplacent les atténuations configurées localement dans Sécurité Windows.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: "For an app-level setting, NOTSET means that the system-level value of the mitigation applies to that program. Validate heap integrity is one of the system-and-app mitigations that have no audit mode. Changes deployed through Group Policy override the local exploit protection configuration."
    fr: "Pour un paramètre de niveau application, NOTSET signifie que la valeur de niveau système de l'atténuation s'applique à ce programme. Validate heap integrity fait partie des atténuations de niveau système et application qui n'ont pas de mode audit. Les modifications déployées par stratégie de groupe remplacent la configuration locale de la protection contre les attaques."
  options:
    s1:
      en: "NOTSET doesn't disable the mitigation: app2.exe inherits the system-level value."
      fr: "NOTSET ne désactive pas l'atténuation : app2.exe hérite de la valeur de niveau système."
    s2:
      en: "Audit mode exists only for some app-only mitigations, such as Arbitrary code guard or Don't allow child processes."
      fr: "Le mode audit n'existe que pour certaines atténuations propres aux applications, comme Arbitrary code guard ou Don't allow child processes."
references:
  - title: Customize exploit protection
    url: https://learn.microsoft.com/en-us/defender-endpoint/customize-exploit-protection
