id: az802-6a-laps-passphrase
objective: "6.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You manage Windows LAPS for member servers that run Windows Server 2025 by using a GPO named **GPO-LAPS**. GPO-LAPS already backs up the passwords to Active Directory.

    The help desk reads passwords over the phone and asks that the managed local administrator passwords be replaced by passphrases of eight long words.

    Which two settings should you configure in GPO-LAPS? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez Windows LAPS pour des serveurs membres qui exécutent Windows Server 2025 à l'aide d'un objet de stratégie de groupe nommé **GPO-LAPS**. GPO-LAPS sauvegarde déjà les mots de passe dans Active Directory.

    Le support technique lit les mots de passe au téléphone et demande que les mots de passe de l'administrateur local géré soient remplacés par des phrases secrètes de huit mots longs.

    Quels sont les deux paramètres à configurer dans GPO-LAPS ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "PasswordComplexity: 5" }
    - { id: b, text: "PasswordComplexity: 6" }
    - { id: c, text: "PasswordLength: 8" }
    - { id: d, text: "PassphraseLength: 8" }
    - { id: e, text: "ADEncryptedPasswordHistorySize: 8" }
answer:
  optionIds: [ b, d ]
explanation:
  correct:
    en: "PasswordComplexity 6 generates passphrases made of long words, and PassphraseLength sets the number of words, from 3 to 10. Both require Windows 11 version 24H2, Windows Server 2025 or later; on an older OS, an unsupported value silently falls back to the default."
    fr: "PasswordComplexity 6 génère des phrases secrètes composées de mots longs, et PassphraseLength définit le nombre de mots, de 3 à 10. Les deux nécessitent Windows 11 version 24H2, Windows Server 2025 ou une version ultérieure ; sur un système plus ancien, une valeur non prise en charge revient silencieusement à la valeur par défaut."
  options:
    a:
      en: "PasswordComplexity 5 generates a password with improved readability, not a passphrase."
      fr: "PasswordComplexity 5 génère un mot de passe plus lisible, pas une phrase secrète."
    c:
      en: "PasswordLength counts characters and is ignored when PasswordComplexity selects a passphrase option."
      fr: "PasswordLength compte des caractères et est ignoré lorsque PasswordComplexity sélectionne une option de phrase secrète."
    e:
      en: "ADEncryptedPasswordHistorySize sets how many previous encrypted passwords are kept in AD DS."
      fr: "ADEncryptedPasswordHistorySize définit le nombre d'anciens mots de passe chiffrés conservés dans AD DS."
references:
  - title: Configure Policy Settings for Windows LAPS
    url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-management-policy-settings
