id: az802-6b-admin-deny-gpo-link
objective: "6.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named adatum.com. The domain contains OUs named **Servers**, **Workstations** and **Admins**. The built-in Administrator account of the domain is in the Users container.

    You create a GPO named **GPO-DenyAdmin** that adds ADATUM\Administrator to the following user rights: Deny access to this computer from the network, Deny log on as a batch job, Deny log on as a service and Deny log on through Remote Desktop Services.

    You need to apply GPO-DenyAdmin by following Microsoft's guidance for securing the built-in Administrator account. Where should you link GPO-DenyAdmin?
  fr: |
    Votre réseau contient un domaine Active Directory nommé adatum.com. Le domaine contient des UO nommées **Servers**, **Workstations** et **Admins**. Le compte Administrator intégré du domaine se trouve dans le conteneur Users.

    Vous créez un GPO nommé **GPO-DenyAdmin** qui ajoute ADATUM\Administrator aux droits utilisateur suivants : Deny access to this computer from the network, Deny log on as a batch job, Deny log on as a service et Deny log on through Remote Desktop Services.

    Vous devez appliquer GPO-DenyAdmin en suivant les recommandations de Microsoft pour la sécurisation du compte Administrator intégré. Où devez-vous lier GPO-DenyAdmin ?
body:
  options:
    - { id: a, text: { en: "To the adatum.com domain", fr: "Au domaine adatum.com" } }
    - { id: b, text: { en: "To the Admins OU", fr: "À l'UO Admins" } }
    - { id: c, text: { en: "To the Servers OU and the Workstations OU", fr: "Aux UO Servers et Workstations" } }
    - { id: d, text: { en: "To the site that contains the domain controllers", fr: "Au site qui contient les contrôleurs de domaine" } }
answer: { optionId: c }
explanation:
  correct:
    en: User rights apply to the computers in the scope of the GPO, so the GPO must be linked to every OU that contains member servers or workstations. Microsoft states that this GPO should never be linked at the domain level, because it could make the built-in Administrator account unusable, even for disaster recovery.
    fr: Les droits utilisateur s'appliquent aux ordinateurs situés dans l'étendue du GPO ; celui-ci doit donc être lié à chaque UO qui contient des serveurs membres ou des postes de travail. Microsoft indique que ce GPO ne doit jamais être lié au niveau du domaine, car il pourrait rendre le compte Administrator intégré inutilisable, même pour une reprise après sinistre.
  options:
    a: { en: "Linking at the domain level is explicitly discouraged: it would also reach the domain controllers and could make the account unusable.", fr: "La liaison au niveau du domaine est explicitement déconseillée : elle atteindrait aussi les contrôleurs de domaine et pourrait rendre le compte inutilisable." }
    b: { en: "User rights apply to computers; an OU that contains user accounts does not restrict where those accounts sign in.", fr: "Les droits utilisateur s'appliquent aux ordinateurs ; une UO qui contient des comptes d'utilisateur ne limite pas les ordinateurs où ces comptes se connectent." }
    d: { en: "A site link would apply the deny rights to the domain controllers and any computer in the site, not specifically to member servers and workstations.", fr: "Une liaison au site appliquerait les droits de refus aux contrôleurs de domaine et à tout ordinateur du site, et pas spécifiquement aux serveurs membres et postes de travail." }
references:
  - title: Appendix D - Securing Built-In Administrator Accounts in Active Directory
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/appendix-d--securing-built-in-administrator-accounts-in-active-directory
