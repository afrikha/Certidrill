id: az802-6a-cg-verify-running
objective: "6.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You configured Credential Guard by using Group Policy on a server named **Server7** that runs Windows Server 2025, and you restarted Server7.

    You need to confirm by using PowerShell that Credential Guard is actually running on Server7, not only configured.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous avez configuré Credential Guard par stratégie de groupe sur un serveur nommé **Server7** qui exécute Windows Server 2025, puis vous avez redémarré Server7.

    Vous devez confirmer à l'aide de PowerShell que Credential Guard est réellement en cours d'exécution sur Server7, et pas seulement configuré.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    (Get-CimInstance -ClassName [[cls]] -Namespace root\Microsoft\Windows\DeviceGuard).[[prop]]
  slots:
    - id: cls
      options:
        - { id: dg, text: Win32_DeviceGuard }
        - { id: tpm, text: Win32_Tpm }
        - { id: cs, text: Win32_ComputerSystem }
        - { id: os, text: Win32_OperatingSystem }
    - id: prop
      options:
        - { id: run, text: SecurityServicesRunning }
        - { id: conf, text: SecurityServicesConfigured }
        - { id: req, text: RequiredSecurityProperties }
        - { id: avail, text: AvailableSecurityProperties }
answer:
  values: { cls: dg, prop: run }
explanation:
  correct:
    en: "The Win32_DeviceGuard class in the root\\Microsoft\\Windows\\DeviceGuard namespace reports the state of virtualization-based security services. Its SecurityServicesRunning property contains 1 when Credential Guard is running. You can also check System Information or event 13 from the WinInit source in the System log."
    fr: "La classe Win32_DeviceGuard de l'espace de noms root\\Microsoft\\Windows\\DeviceGuard indique l'état des services de sécurité basée sur la virtualisation. Sa propriété SecurityServicesRunning contient 1 lorsque Credential Guard est en cours d'exécution. Vous pouvez aussi consulter Informations système ou l'événement 13 de la source WinInit dans le journal Système."
  options:
    conf:
      en: "SecurityServicesConfigured shows which services are configured, not whether Credential Guard actually started."
      fr: "SecurityServicesConfigured indique les services configurés, pas si Credential Guard a réellement démarré."
    tpm:
      en: "Win32_Tpm describes the TPM and doesn't belong to the DeviceGuard namespace."
      fr: "Win32_Tpm décrit le TPM et n'appartient pas à l'espace de noms DeviceGuard."
    avail:
      en: "AvailableSecurityProperties lists the hardware security properties available, such as Secure Boot, not the running services."
      fr: "AvailableSecurityProperties répertorie les propriétés de sécurité matérielles disponibles, comme le démarrage sécurisé, pas les services en cours d'exécution."
references:
  - title: Configure Credential Guard
    url: https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/configure
