id: az802-6b-lm-auth-level
objective: "6.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named contoso.com. The domain controllers run Windows Server 2022. All client computers support NTLMv2.

    You need to configure the domain controllers to refuse LM and NTLMv1 authentication while still accepting NTLMv2. Which value should you set for **Network security: LAN Manager authentication level** in the Default Domain Controllers Policy GPO?
  fr: |
    Votre réseau contient un domaine Active Directory nommé contoso.com. Les contrôleurs de domaine exécutent Windows Server 2022. Tous les ordinateurs clients prennent en charge NTLMv2.

    Vous devez configurer les contrôleurs de domaine pour qu'ils refusent l'authentification LM et NTLMv1 tout en acceptant NTLMv2. Quelle valeur devez-vous définir pour **Network security: LAN Manager authentication level** dans le GPO Default Domain Controllers Policy ?
body:
  options:
    - { id: a, text: Send NTLMv2 response only }
    - { id: b, text: Send NTLMv2 response only. Refuse LM }
    - { id: c, text: "Send NTLMv2 response only. Refuse LM & NTLM" }
    - { id: d, text: Send NTLM response only }
answer: { optionId: c }
explanation:
  correct:
    en: At the level Send NTLMv2 response only. Refuse LM & NTLM, domain controllers refuse LM and NTLM (NTLMv1) authentication and accept only NTLMv2, while the computers themselves send only NTLMv2 responses.
    fr: Au niveau Send NTLMv2 response only. Refuse LM & NTLM, les contrôleurs de domaine refusent l'authentification LM et NTLM (NTLMv1) et n'acceptent que NTLMv2, tandis que les ordinateurs eux-mêmes n'envoient que des réponses NTLMv2.
  options:
    a: { en: "With this value, domain controllers still accept LM, NTLM and NTLMv2; only what the computer sends changes.", fr: "Avec cette valeur, les contrôleurs de domaine acceptent toujours LM, NTLM et NTLMv2 ; seul ce que l'ordinateur envoie change." }
    b: { en: "Domain controllers refuse LM but still accept NTLMv1.", fr: "Les contrôleurs de domaine refusent LM mais acceptent toujours NTLMv1." }
    d: { en: "The computer sends NTLMv1 responses, and domain controllers still accept LM, NTLM and NTLMv2.", fr: "L'ordinateur envoie des réponses NTLMv1, et les contrôleurs de domaine acceptent toujours LM, NTLM et NTLMv2." }
references:
  - title: "Network security: LAN Manager authentication level"
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/network-security-lan-manager-authentication-level
