id: az802-6a-ss-settings-dragdrop
objective: "6.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are creating a GPO for servers that run Windows Server 2025 and Microsoft Edge. The Microsoft Edge administrative templates are installed in the central store.

    You need to configure Microsoft Defender SmartScreen to meet the following requirements:

    - Users can't turn off SmartScreen in Microsoft Edge.
    - Users can't continue to a website that SmartScreen flags as potentially malicious.
    - Users can't keep a file that SmartScreen flags as unverified when they download it in Microsoft Edge.
    - Users can install downloaded apps only from the Microsoft Store.

    Which setting should you enable for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un objet de stratégie de groupe pour des serveurs qui exécutent Windows Server 2025 et Microsoft Edge. Les modèles d'administration de Microsoft Edge sont installés dans le magasin central.

    Vous devez configurer Microsoft Defender SmartScreen pour répondre aux exigences suivantes :

    - Les utilisateurs ne peuvent pas désactiver SmartScreen dans Microsoft Edge.
    - Les utilisateurs ne peuvent pas continuer vers un site web que SmartScreen signale comme potentiellement malveillant.
    - Les utilisateurs ne peuvent pas conserver un fichier que SmartScreen signale comme non vérifié lorsqu'ils le téléchargent dans Microsoft Edge.
    - Les utilisateurs ne peuvent installer des applications téléchargées que depuis le Microsoft Store.

    Quel paramètre devez-vous activer pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: edge, text: Configure Microsoft Defender SmartScreen }
    - { id: sites, text: Prevent bypassing Windows Defender SmartScreen prompts for sites }
    - { id: dl, text: Prevent bypassing of Microsoft Defender SmartScreen warnings about downloads }
    - { id: install, text: Configure App Install Control }
    - { id: explorer, text: Configure Windows Defender SmartScreen }
  targets:
    - { id: t1, text: { en: "Users can't turn off SmartScreen in Microsoft Edge.", fr: "Les utilisateurs ne peuvent pas désactiver SmartScreen dans Microsoft Edge." } }
    - { id: t2, text: { en: "Users can't continue to a flagged website.", fr: "Les utilisateurs ne peuvent pas continuer vers un site web signalé." } }
    - { id: t3, text: { en: "Users can't keep an unverified file downloaded in Microsoft Edge.", fr: "Les utilisateurs ne peuvent pas conserver un fichier non vérifié téléchargé dans Microsoft Edge." } }
    - { id: t4, text: { en: "Users can install downloaded apps only from the Microsoft Store.", fr: "Les utilisateurs ne peuvent installer des applications téléchargées que depuis le Microsoft Store." } }
answer:
  mapping: { t1: edge, t2: sites, t3: dl, t4: install }
explanation:
  correct:
    en: "Under Microsoft Edge > SmartScreen settings, Configure Microsoft Defender SmartScreen turns SmartScreen on and prevents users from turning it off, and the two Prevent bypassing settings block access to flagged sites and unverified downloads. Configure App Install Control, under Windows Components > Windows Defender SmartScreen > Explorer, controls whether users can install apps from outside the Microsoft Store."
    fr: "Sous Microsoft Edge > SmartScreen settings, Configure Microsoft Defender SmartScreen active SmartScreen et empêche les utilisateurs de le désactiver, et les deux paramètres Prevent bypassing bloquent l'accès aux sites signalés et aux téléchargements non vérifiés. Configure App Install Control, sous Windows Components > Windows Defender SmartScreen > Explorer, contrôle si les utilisateurs peuvent installer des applications provenant d'ailleurs que du Microsoft Store."
  options:
    explorer:
      en: "Configure Windows Defender SmartScreen in the Explorer node controls the reputation check of apps and files run in Windows, not the Edge behavior or Store-only installation."
      fr: "Configure Windows Defender SmartScreen dans le nœud Explorer contrôle la vérification de réputation des applications et fichiers exécutés dans Windows, pas le comportement d'Edge ni l'installation limitée au Store."
references:
  - title: Available Microsoft Defender SmartScreen settings
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/virus-and-threat-protection/microsoft-defender-smartscreen/available-settings
