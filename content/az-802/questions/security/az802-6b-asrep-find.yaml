id: az802-6b-asrep-find
objective: "6.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named litware.com. A penetration test shows that an attacker requested Kerberos AS-REP messages for several user accounts without knowing their passwords, and then cracked the passwords offline.

    You need to list all the user accounts that are exposed to this attack.

    Which command should you run?
  fr: |
    Votre réseau contient un domaine Active Directory nommé litware.com. Un test d'intrusion montre qu'un attaquant a demandé des messages Kerberos AS-REP pour plusieurs comptes d'utilisateur sans connaître leurs mots de passe, puis a cassé les mots de passe hors ligne.

    Vous devez lister tous les comptes d'utilisateur exposés à cette attaque.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "Get-ADUser -Filter 'TrustedForDelegation -eq $true' -Properties TrustedForDelegation" }
    - { id: b, text: "Get-ADUser -Filter 'AllowReversiblePasswordEncryption -eq $true' -Properties AllowReversiblePasswordEncryption" }
    - { id: c, text: "Search-ADAccount -PasswordNeverExpires -UsersOnly" }
    - { id: d, text: "Get-ADUser -Filter 'DoesNotRequirePreAuth -eq $true' -Properties DoesNotRequirePreAuth" }
answer: { optionId: d }
explanation:
  correct:
    en: The attack is AS-REP roasting. It works only against accounts for which Kerberos preauthentication is not required (Do not require Kerberos preauthentication), because the KDC then returns an AS-REP encrypted with a key derived from the password without first verifying the requester. Filtering on DoesNotRequirePreAuth lists those accounts; you then clear the flag, for example with `Set-ADAccountControl -DoesNotRequirePreAuth $false`.
    fr: "Il s'agit d'AS-REP roasting. L'attaque ne fonctionne que contre les comptes pour lesquels la pré-authentification Kerberos n'est pas exigée (Do not require Kerberos preauthentication), car le KDC renvoie alors un AS-REP chiffré avec une clé dérivée du mot de passe sans vérifier d'abord le demandeur. Le filtre sur DoesNotRequirePreAuth liste ces comptes ; vous désactivez ensuite l'indicateur, par exemple avec `Set-ADAccountControl -DoesNotRequirePreAuth $false`."
  options:
    a: { en: "TrustedForDelegation identifies accounts trusted for unconstrained delegation, a different risk.", fr: "TrustedForDelegation identifie les comptes approuvés pour la délégation non contrainte, un autre risque." }
    b: { en: "Reversible encryption stores a recoverable password in the directory; it does not let anyone request an AS-REP without preauthentication.", fr: "Le chiffrement réversible stocke un mot de passe récupérable dans l'annuaire ; il ne permet à personne de demander un AS-REP sans pré-authentification." }
    c: { en: "A password that never expires increases exposure over time but does not enable this attack.", fr: "Un mot de passe qui n'expire jamais augmente l'exposition dans le temps, mais ne permet pas cette attaque." }
references:
  - title: Set-ADAccountControl (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/set-adaccountcontrol
  - title: Get-ADUser (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-aduser
