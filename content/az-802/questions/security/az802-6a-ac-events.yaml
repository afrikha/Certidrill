id: az802-6a-ac-events
objective: "6.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a server named **Server5** that runs Windows Server 2025. You deployed an App Control for Business policy to Server5 in audit mode. Next week, you will switch the policy to enforcement mode.

    You need to know where to look for the files that the policy affects.

    How should you complete the sentences? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur nommé **Server5** qui exécute Windows Server 2025. Vous avez déployé une stratégie App Control for Business sur Server5 en mode audit. La semaine prochaine, vous passerez la stratégie en mode application.

    Vous devez savoir où rechercher les fichiers concernés par la stratégie.

    Comment devez-vous compléter les phrases ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The events are written to the [[log]] log.
      In audit mode, a file that the policy would block generates event ID [[audit]].
      In enforcement mode, a blocked file generates event ID [[enforce]].
    fr: |
      Les événements sont écrits dans le journal [[log]].
      En mode audit, un fichier que la stratégie bloquerait génère l'ID d'événement [[audit]].
      En mode application, un fichier bloqué génère l'ID d'événement [[enforce]].
  slots:
    - id: log
      options:
        - { id: ci, text: "Applications and Services Logs\\Microsoft\\Windows\\CodeIntegrity\\Operational" }
        - { id: mit, text: "Applications and Services Logs\\Microsoft\\Windows\\Security-Mitigations\\KernelMode" }
        - { id: sys, text: "Windows Logs\\System" }
        - { id: sec, text: "Windows Logs\\Security" }
    - id: audit
      options:
        - { id: a3076, text: "3076" }
        - { id: a3077, text: "3077" }
        - { id: a1000, text: "1000" }
    - id: enforce
      options:
        - { id: e3076, text: "3076" }
        - { id: e3077, text: "3077" }
        - { id: e1000, text: "1000" }
answer:
  values: { log: ci, audit: a3076, enforce: e3077 }
explanation:
  correct:
    en: "App Control for Business writes its events to the CodeIntegrity Operational log under Applications and Services Logs. Event 3076 records a file that would have been blocked in audit mode, and event 3077 records a file that was blocked in enforcement mode. Reviewing the 3076 events before switching modes lets you create supplemental policies for legitimate applications."
    fr: "App Control for Business écrit ses événements dans le journal CodeIntegrity Operational, sous Journaux des applications et des services. L'événement 3076 enregistre un fichier qui aurait été bloqué en mode audit, et l'événement 3077 un fichier bloqué en mode application. Examiner les événements 3076 avant de changer de mode permet de créer des stratégies supplémentaires pour les applications légitimes."
  options:
    mit:
      en: "The Security-Mitigations logs record exploit protection events, not App Control events."
      fr: "Les journaux Security-Mitigations enregistrent les événements de la protection contre les attaques, pas ceux d'App Control."
    a1000:
      en: "Event 1000 records an application crash, not a code integrity decision."
      fr: "L'événement 1000 enregistre un plantage d'application, pas une décision d'intégrité du code."
references:
  - title: Configure App Control for Business by using OSConfig
    url: https://learn.microsoft.com/en-us/windows-server/security/osconfig/osconfig-how-to-configure-app-control-for-business
