id: az802-6b-pu-which-account
objective: "6.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named adatum.com. The domain functional level is Windows Server 2016.

    You plan to add accounts to the **Protected Users** group by following Microsoft guidance.

    Which account should you add to the group?
  fr: |
    Votre réseau contient un domaine Active Directory nommé adatum.com. Le niveau fonctionnel du domaine est Windows Server 2016.

    Vous prévoyez d'ajouter des comptes au groupe **Protected Users** en suivant les recommandations de Microsoft.

    Quel compte devez-vous ajouter au groupe ?
body:
  options:
    - { id: a, text: { en: "svc-sql, a user account that runs the SQL Server service", fr: "svc-sql, un compte d'utilisateur qui exécute le service SQL Server" } }
    - { id: b, text: { en: "gmsa-web$, a group managed service account used by IIS", fr: "gmsa-web$, un compte de service administré de groupe utilisé par IIS" } }
    - { id: c, text: { en: "PAW01$, the computer account of a privileged access workstation", fr: "PAW01$, le compte d'ordinateur d'une station de travail à accès privilégié" } }
    - { id: d, text: { en: "adm-nina, a user account that an administrator uses to sign in", fr: "adm-nina, un compte d'utilisateur avec lequel un administrateur se connecte" } }
answer: { optionId: d }
explanation:
  correct:
    en: Protected Users is designed for the accounts of people, especially privileged users, whose credentials could be stolen from the devices they sign in to. Microsoft recommends testing privileged accounts first, then adding them so that they lose NTLM, delegation, weak Kerberos encryption and credential caching.
    fr: Protected Users est conçu pour les comptes de personnes, en particulier les utilisateurs privilégiés, dont les informations d'identification pourraient être volées sur les appareils auxquels ils se connectent. Microsoft recommande de tester d'abord les comptes privilégiés, puis de les ajouter pour qu'ils perdent NTLM, la délégation, le chiffrement Kerberos faible et la mise en cache des informations d'identification.
  options:
    a: { en: "Service accounts must never be added: membership gives no local protection because the credentials are always available on the host, and authentication to the service can fail.", fr: "Les comptes de service ne doivent jamais être ajoutés : l'appartenance n'apporte aucune protection locale, car les informations d'identification sont toujours disponibles sur l'hôte, et l'authentification auprès du service peut échouer." }
    b: { en: "A gMSA is a service account; service accounts must never be added to Protected Users.", fr: "Un gMSA est un compte de service ; les comptes de service ne doivent jamais être ajoutés à Protected Users." }
    c: { en: "Computer accounts must never be added to Protected Users.", fr: "Les comptes d'ordinateur ne doivent jamais être ajoutés à Protected Users." }
references:
  - title: Protected Users security group
    url: https://learn.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/protected-users-security-group
  - title: Authentication Policies and Authentication Policy Silos
    url: https://learn.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/authentication-policies-and-authentication-policy-silos
