id: az802-6a-osc-baseline-facts
objective: "6.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a member server named **Server9** that runs Windows Server 2025. Server9 hosts file shares accessed by a Linux appliance that supports only SMB 2.1. You plan to run the following command on Server9.

    ```powershell
    Set-OSConfigDesiredConfiguration -Scenario SecurityBaseline/WindowsServer/2025/MemberServer -Default
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur membre nommé **Server9** qui exécute Windows Server 2025. Server9 héberge des partages de fichiers auxquels accède une appliance Linux qui ne prend en charge que SMB 2.1. Vous prévoyez d'exécuter la commande suivante sur Server9.

    ```powershell
    Set-OSConfigDesiredConfiguration -Scenario SecurityBaseline/WindowsServer/2025/MemberServer -Default
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After you apply the baseline, the Linux appliance can still access the file shares on Server9 without any change to the baseline.
        fr: Après l'application de la base de référence, l'appliance Linux peut toujours accéder aux partages de fichiers de Server9 sans aucune modification de la base de référence.
    - id: s2
      text:
        en: After you apply the baseline, you must restart Server9 and change the password of its local administrator account.
        fr: Après l'application de la base de référence, vous devez redémarrer Server9 et changer le mot de passe de son compte d'administrateur local.
    - id: s3
      text:
        en: If you later remove the baseline, OSConfig guarantees that every setting returns to the value it had before the baseline was applied.
        fr: Si vous supprimez ultérieurement la base de référence, OSConfig garantit que chaque paramètre retrouve la valeur qu'il avait avant l'application de la base de référence.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "The Windows Server 2025 baseline requires SMB 3.0 at minimum, so a client limited to SMB 2.1 breaks unless you adjust the baseline. After applying a baseline on a member server or workgroup member, you restart the server and change the local administrator password, which must be at least 14 characters. On removal, OSConfig can't guarantee that settings return to their pre-managed values."
    fr: "La base de référence Windows Server 2025 exige au minimum SMB 3.0 : un client limité à SMB 2.1 cesse de fonctionner, sauf si vous ajustez la base de référence. Après l'application d'une base de référence sur un serveur membre ou un membre de groupe de travail, vous redémarrez le serveur et changez le mot de passe de l'administrateur local, qui doit comporter au moins 14 caractères. Lors de la suppression, OSConfig ne peut pas garantir que les paramètres retrouvent leurs valeurs d'avant la gestion."
  options:
    s1:
      en: "The baseline sets SMB 3.0 as the minimum; non-Windows systems such as Samba must support SMB 3.0, or you must adjust the baseline."
      fr: "La base de référence fixe SMB 3.0 comme minimum ; les systèmes non Windows comme Samba doivent prendre en charge SMB 3.0, sinon vous devez ajuster la base de référence."
    s3:
      en: "The result of removal depends on each setting; Microsoft doesn't guarantee a return to the previous values."
      fr: "Le résultat de la suppression dépend de chaque paramètre ; Microsoft ne garantit pas le retour aux valeurs précédentes."
references:
  - title: Deploy Windows Server 2025 security baselines locally with OSConfig
    url: https://learn.microsoft.com/en-us/windows-server/security/osconfig/osconfig-how-to-configure-security-baselines
