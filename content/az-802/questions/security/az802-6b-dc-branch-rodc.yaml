id: az802-6b-dc-branch-rodc
objective: "6.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named tailspintoys.com. You plan to deploy a domain controller in a new branch office so that users can authenticate locally when the WAN link is down.

    The branch office has no locked server room, and the server will be installed in a shared storage area that other staff can enter.

    You need to reduce the risk to the domain if the server is stolen. Which type of domain controller should you deploy?
  fr: |
    Votre réseau contient un domaine Active Directory nommé tailspintoys.com. Vous prévoyez de déployer un contrôleur de domaine dans une nouvelle succursale afin que les utilisateurs puissent s'authentifier localement quand la liaison WAN est coupée.

    La succursale ne dispose d'aucune salle de serveurs fermée à clé, et le serveur sera installé dans un local de stockage partagé auquel d'autres employés ont accès.

    Vous devez réduire le risque pour le domaine si le serveur est volé. Quel type de contrôleur de domaine devez-vous déployer ?
body:
  options:
    - { id: a, text: { en: "A read-only domain controller (RODC)", fr: "Un contrôleur de domaine en lecture seule (RODC)" } }
    - { id: b, text: { en: "A writable domain controller configured as a global catalog server", fr: "Un contrôleur de domaine accessible en écriture configuré comme serveur de catalogue global" } }
    - { id: c, text: { en: "A writable domain controller that holds the PDC emulator role", fr: "Un contrôleur de domaine accessible en écriture qui détient le rôle d'émulateur PDC" } }
    - { id: d, text: { en: "A writable domain controller that uses the Desktop Experience option", fr: "Un contrôleur de domaine accessible en écriture qui utilise l'option Expérience de bureau (Desktop Experience)" } }
answer: { optionId: a }
explanation:
  correct:
    en: Microsoft recommends deploying read-only domain controllers in branch locations where a domain controller cannot be stored in a locked room. An RODC holds a read-only copy of the directory and caches only the passwords allowed by its password replication policy, so a stolen RODC exposes far fewer credentials. BitLocker on all volumes further protects the disk contents.
    fr: |
      Microsoft recommande de déployer des contrôleurs de domaine en lecture seule dans les succursales où un contrôleur de domaine ne peut pas être placé dans une salle fermée à clé. Un RODC détient une copie en lecture seule de l'annuaire et ne met en cache que les mots de passe autorisés par sa stratégie de réplication des mots de passe : un RODC volé expose beaucoup moins d'informations d'identification. BitLocker sur tous les volumes protège en plus le contenu des disques.
  options:
    b: { en: "A writable global catalog server stores every password of the domain and a partial copy of the whole forest; theft exposes more, not less.", fr: "Un serveur de catalogue global accessible en écriture stocke tous les mots de passe du domaine et une copie partielle de toute la forêt ; son vol expose davantage, pas moins." }
    c: { en: "The PDC emulator role is an operations master role; it adds no protection and is unsuitable for an unsecured branch.", fr: "Le rôle d'émulateur PDC est un rôle de maître d'opérations ; il n'apporte aucune protection et ne convient pas à une succursale non sécurisée." }
    d: { en: "Desktop Experience increases the attack surface; Microsoft recommends Server Core for domain controllers.", fr: "L'Expérience de bureau augmente la surface d'attaque ; Microsoft recommande Server Core pour les contrôleurs de domaine." }
references:
  - title: Securing domain controllers against attack
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/securing-domain-controllers-against-attack
