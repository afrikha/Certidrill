id: az802-6a-dfs-onprem-arc
objective: "6.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has 20 on-premises servers that run Windows Server 2022 and an Azure subscription named **Sub2** on which Microsoft Defender for Servers Plan 2 is enabled.

    You need the on-premises servers to be protected by Defender for Servers in Sub2, including OS system updates assessment.

    What should you do first on the servers?
  fr: |
    Contoso dispose de 20 serveurs locaux qui exécutent Windows Server 2022 et d'un abonnement Azure nommé **Sub2** sur lequel Microsoft Defender pour les serveurs Plan 2 est activé.

    Vous devez faire en sorte que les serveurs locaux soient protégés par Defender pour les serveurs dans Sub2, y compris l'évaluation des mises à jour système du système d'exploitation.

    Que devez-vous faire en premier sur les serveurs ?
body:
  options:
    - { id: a, text: { en: "Apply the SecurityBaseline/WindowsServer/2025/MemberServer scenario by using OSConfig.", fr: "Appliquer le scénario SecurityBaseline/WindowsServer/2025/MemberServer à l'aide d'OSConfig." } }
    - { id: b, text: { en: "Install the Azure Monitor Agent and associate a data collection rule from Sub2.", fr: "Installer l'agent Azure Monitor et associer une règle de collecte de données de Sub2." } }
    - { id: c, text: { en: "Join the servers to Microsoft Entra ID and enroll them in Microsoft Intune.", fr: "Joindre les serveurs à Microsoft Entra ID et les inscrire dans Microsoft Intune." } }
    - { id: d, text: { en: "Install the Azure Connected Machine agent to onboard the servers to Azure Arc in Sub2.", fr: "Installer l'agent Azure Connected Machine pour intégrer les serveurs à Azure Arc dans Sub2." } }
answer:
  optionId: d
explanation:
  correct:
    en: "Defender for Servers protects on-premises machines that are connected to Defender for Cloud, and features such as OS system updates and OS baseline misconfigurations apply only to machines onboarded with Azure Arc. Installing the Azure Connected Machine agent creates an Arc-enabled server resource in Sub2, which the Plan 2 subscription setting then covers."
    fr: "Defender pour les serveurs protège les machines locales connectées à Defender for Cloud, et des fonctionnalités comme les mises à jour système du système d'exploitation ou les erreurs de configuration de la base de référence ne s'appliquent qu'aux machines intégrées avec Azure Arc. Installer l'agent Azure Connected Machine crée une ressource de serveur Arc dans Sub2, que le paramètre Plan 2 de l'abonnement couvre ensuite."
  options:
    b:
      en: "The Azure Monitor Agent collects monitoring data; it doesn't create the Azure resource that Defender for Servers protects."
      fr: "L'agent Azure Monitor collecte des données de supervision ; il ne crée pas la ressource Azure que protège Defender pour les serveurs."
    c:
      en: "Microsoft Entra join and Intune enrollment don't connect a server to Defender for Cloud."
      fr: "La jonction à Microsoft Entra ID et l'inscription dans Intune ne connectent pas un serveur à Defender for Cloud."
    a:
      en: "OSConfig is available only on Windows Server 2025 and doesn't onboard a server to Defender for Cloud."
      fr: "OSConfig n'est disponible que sur Windows Server 2025 et n'intègre pas un serveur à Defender for Cloud."
references:
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
