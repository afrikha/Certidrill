id: az802-6a-gpo-security-options
objective: "6.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an AD DS domain named **contoso.com**. You are creating a GPO named **GPO-DCHardening** that will be linked to the Domain Controllers OU. All the domain controllers run Windows Server 2025. GPO-DCHardening must meet the following requirements:

    - Before a user signs in to a domain controller, a legal notice must be displayed.
    - The domain controllers must accept NTLMv2 responses and refuse LM and NTLM responses.

    Which two settings should you configure in Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine AD DS nommé **contoso.com**. Vous créez un objet de stratégie de groupe nommé **GPO-DCHardening** qui sera lié à l'UO Domain Controllers. Tous les contrôleurs de domaine exécutent Windows Server 2025. GPO-DCHardening doit répondre aux exigences suivantes :

    - Avant qu'un utilisateur se connecte à un contrôleur de domaine, un avis juridique doit s'afficher.
    - Les contrôleurs de domaine doivent accepter les réponses NTLMv2 et refuser les réponses LM et NTLM.

    Quels sont les deux paramètres à configurer dans Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Network security: Restrict NTLM: Incoming NTLM traffic" }
    - { id: b, text: "Network security: LAN Manager authentication level" }
    - { id: c, text: "Network security: Do not store LAN Manager hash value on next password change" }
    - { id: d, text: "Interactive logon: Message text for users attempting to log on" }
    - { id: e, text: "Accounts: Rename administrator account" }
answer:
  optionIds: [ b, d ]
explanation:
  correct:
    en: "Interactive logon: Message text for users attempting to log on displays a message that users must acknowledge before they sign in. Network security: LAN Manager authentication level set to Send NTLMv2 responses only. Refuse LM & NTLM makes the domain controllers refuse LM and NTLM authentication and accept only NTLMv2."
    fr: "Interactive logon: Message text for users attempting to log on affiche un message que les utilisateurs doivent valider avant de se connecter. Network security: LAN Manager authentication level défini sur Send NTLMv2 responses only. Refuse LM & NTLM fait que les contrôleurs de domaine refusent l'authentification LM et NTLM et n'acceptent que NTLMv2."
  options:
    c:
      en: "This setting prevents the storage of the weak LM hash of new passwords; it doesn't control which responses the domain controllers accept."
      fr: "Ce paramètre empêche le stockage du hachage LM faible des nouveaux mots de passe ; il ne contrôle pas les réponses acceptées par les contrôleurs de domaine."
    a:
      en: "Restrict NTLM: Incoming NTLM traffic can audit or deny incoming NTLM traffic as a whole, NTLMv2 included; it doesn't accept NTLMv2 while refusing LM and NTLM."
      fr: "Restrict NTLM: Incoming NTLM traffic peut auditer ou refuser le trafic NTLM entrant dans son ensemble, NTLMv2 compris ; il n'accepte pas NTLMv2 tout en refusant LM et NTLM."
    e:
      en: "Renaming the Administrator account is a hardening measure unrelated to both requirements."
      fr: "Renommer le compte Administrator est une mesure de renforcement sans rapport avec les deux exigences."
references:
  - title: Network security LAN Manager authentication level
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/network-security-lan-manager-authentication-level
