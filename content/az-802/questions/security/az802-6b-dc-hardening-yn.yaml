id: az802-6b-dc-hardening-yn
objective: "6.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named woodgrovebank.com. The security team drafts the following hardening baseline for the domain controllers, and you compare each item with Microsoft's guidance for securing domain controllers.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine Active Directory nommé woodgrovebank.com. L'équipe de sécurité rédige la base de référence de durcissement suivante pour les contrôleurs de domaine, et vous comparez chaque élément aux recommandations de Microsoft pour la sécurisation des contrôleurs de domaine.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Installing new domain controllers by using the Server Core installation option follows Microsoft's guidance.
        fr: Installer les nouveaux contrôleurs de domaine avec l'option d'installation Server Core est conforme aux recommandations de Microsoft.
    - id: s2
      text:
        en: Patching the domain controllers through the same enterprise configuration management system as the workstations follows Microsoft's guidance.
        fr: Mettre à jour les contrôleurs de domaine avec le même système de gestion de configuration d'entreprise que les postes de travail est conforme aux recommandations de Microsoft.
    - id: s3
      text:
        en: Allowing administrators to browse vendor websites from the domain controllers to download drivers follows Microsoft's guidance.
        fr: Autoriser les administrateurs à consulter des sites web de fournisseurs depuis les contrôleurs de domaine pour télécharger des pilotes est conforme aux recommandations de Microsoft.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Microsoft recommends the Server Core installation option for domain controllers and remote administration from privileged access workstations or secure administrative hosts. Domain controllers should be patched and managed separately from the general infrastructure, because a compromised enterprise management system could be used to compromise every system it manages. No web browser should be used on domain controllers, and their internet access should be strictly restricted.
    fr: Microsoft recommande l'option d'installation Server Core pour les contrôleurs de domaine et une administration à distance depuis des stations de travail à accès privilégié ou des hôtes d'administration sécurisés. Les contrôleurs de domaine doivent être mis à jour et gérés séparément de l'infrastructure générale, car un système de gestion d'entreprise compromis pourrait servir à compromettre tous les systèmes qu'il gère. Aucun navigateur web ne doit être utilisé sur les contrôleurs de domaine, et leur accès à Internet doit être strictement limité.
references:
  - title: Securing domain controllers against attack
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/securing-domain-controllers-against-attack
