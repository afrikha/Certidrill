id: az802-6a-ss-policy-facts
objective: "6.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are reviewing the Microsoft Defender SmartScreen settings of a GPO that applies to servers running Windows Server 2025.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez les paramètres Microsoft Defender SmartScreen d'un objet de stratégie de groupe qui s'applique à des serveurs exécutant Windows Server 2025.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When a downloaded program has an established reputation, SmartScreen runs it without displaying a warning.
        fr: Lorsqu'un programme téléchargé a une réputation établie, SmartScreen l'exécute sans afficher d'avertissement.
    - id: s2
      text:
        en: If Configure Windows Defender SmartScreen is set to Disabled, users can still turn on SmartScreen for apps and files on their own.
        fr: Si Configure Windows Defender SmartScreen est défini sur Disabled, les utilisateurs peuvent toujours activer eux-mêmes SmartScreen pour les applications et les fichiers.
    - id: s3
      text:
        en: If Prevent bypassing Windows Defender SmartScreen prompts for sites is not configured, users can ignore the warning and continue to a flagged site.
        fr: Si Prevent bypassing Windows Defender SmartScreen prompts for sites n'est pas configuré, les utilisateurs peuvent ignorer l'avertissement et continuer vers un site signalé.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "SmartScreen warns only when a URL, file, app or certificate has no established reputation or is known to be malicious. Disabled turns SmartScreen off and prevents users from turning it on. By default, users can bypass SmartScreen warnings, which is why Microsoft recommends enabling the Prevent bypassing settings."
    fr: "SmartScreen n'avertit que lorsqu'une URL, un fichier, une application ou un certificat n'a pas de réputation établie ou est connu comme malveillant. Disabled désactive SmartScreen et empêche les utilisateurs de l'activer. Par défaut, les utilisateurs peuvent ignorer les avertissements SmartScreen : c'est pourquoi Microsoft recommande d'activer les paramètres Prevent bypassing."
  options:
    s2:
      en: "Users choose only when the setting is Not configured; Disabled turns SmartScreen off and users can't turn it on."
      fr: "Les utilisateurs ne choisissent que lorsque le paramètre est Not configured ; Disabled désactive SmartScreen et les utilisateurs ne peuvent pas l'activer."
references:
  - title: Available Microsoft Defender SmartScreen settings
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/virus-and-threat-protection/microsoft-defender-smartscreen/available-settings
  - title: Microsoft Defender SmartScreen overview
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/virus-and-threat-protection/microsoft-defender-smartscreen/
