id: az802-6b-pu-effects
objective: "6.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named fabrikam.com. The domain functional level is Windows Server 2016.

    You add a user account named **adm-julia** to the **Protected Users** group. A web application on a server named **WEB1** is configured for Kerberos constrained delegation to a back-end SQL Server instance on **SQL1**. A file server named **FS1** has the IP address 10.1.2.15.

    Which two statements are true for adm-julia after she signs in again?

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine Active Directory nommé fabrikam.com. Le niveau fonctionnel du domaine est Windows Server 2016.

    Vous ajoutez un compte d'utilisateur nommé **adm-julia** au groupe **Protected Users**. Une application web d'un serveur nommé **WEB1** est configurée pour la délégation Kerberos contrainte vers une instance SQL Server principale sur **SQL1**. Un serveur de fichiers nommé **FS1** a l'adresse IP 10.1.2.15.

    Quelles sont les deux affirmations vraies pour adm-julia après sa nouvelle connexion ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "WEB1 cannot use her identity to access SQL1 on her behalf.", fr: "WEB1 ne peut pas utiliser son identité pour accéder à SQL1 en son nom." } }
    - { id: b, text: { en: "She must sign in to every computer by using a smart card.", fr: "Elle doit se connecter à chaque ordinateur avec une carte à puce." } }
    - { id: c, text: { en: "Her access to the share `\\\\10.1.2.15\\Tools` by using her domain credentials fails.", fr: "Son accès au partage `\\\\10.1.2.15\\Tools` avec ses informations d'identification de domaine échoue." } }
    - { id: d, text: { en: "Help desk operators can no longer reset her password.", fr: "Les opérateurs du support ne peuvent plus réinitialiser son mot de passe." } }
    - { id: e, text: { en: "She can still authenticate by using RC4 Kerberos keys from older devices.", fr: "Elle peut toujours s'authentifier avec des clés Kerberos RC4 depuis des appareils plus anciens." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Domain controllers do not allow Protected Users members to be delegated with constrained or unconstrained delegation, so WEB1 cannot impersonate adm-julia toward SQL1. Members also cannot authenticate with NTLM. Accessing a share by IP address does not match a Kerberos service principal name, so Windows falls back to NTLM, which the domain controller rejects; using the server name FS1 works with Kerberos.
    fr: "Les contrôleurs de domaine n'autorisent pas la délégation, contrainte ou non contrainte, des membres de Protected Users : WEB1 ne peut donc pas emprunter l'identité d'adm-julia auprès de SQL1. Les membres ne peuvent pas non plus s'authentifier avec NTLM. L'accès à un partage par adresse IP ne correspond à aucun nom de principal de service Kerberos : Windows se rabat sur NTLM, que le contrôleur de domaine refuse ; l'utilisation du nom du serveur FS1 fonctionne avec Kerberos."
  options:
    b: { en: "Protected Users does not require smart cards; that is a separate account option.", fr: "Protected Users n'exige pas de carte à puce ; c'est une option de compte distincte." }
    d: { en: "Membership does not change who can reset the password.", fr: "L'appartenance au groupe ne change pas qui peut réinitialiser le mot de passe." }
    e: { en: "Kerberos preauthentication with DES or RC4 is refused for members; they must use AES.", fr: "La pré-authentification Kerberos avec DES ou RC4 est refusée pour les membres ; ils doivent utiliser AES." }
references:
  - title: Protected Users security group
    url: https://learn.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/protected-users-security-group
