id: az802-6b-dc-rdp-restrict
objective: "6.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named adatum.com. The domain contains the following organizational units (OUs):

    - **Domain Controllers**: all the domain controllers
    - **Tier0-JumpServers**: two jump servers, JMP1 (10.0.10.11) and JMP2 (10.0.10.12)
    - **Servers**: all the other member servers

    The Tier 0 administrators are members of a group named **Tier0-Admins**. You need to meet the following requirements:

    - The members of Tier0-Admins must not be able to sign in to the servers in the Servers OU by using Remote Desktop.
    - Remote Desktop connections to the domain controllers must be possible only from JMP1 and JMP2.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine Active Directory nommé adatum.com. Le domaine contient les unités d'organisation (UO) suivantes :

    - **Domain Controllers** : tous les contrôleurs de domaine
    - **Tier0-JumpServers** : deux serveurs de rebond, JMP1 (10.0.10.11) et JMP2 (10.0.10.12)
    - **Servers** : tous les autres serveurs membres

    Les administrateurs du niveau 0 sont membres d'un groupe nommé **Tier0-Admins**. Vous devez satisfaire les exigences suivantes :

    - Les membres de Tier0-Admins ne doivent pas pouvoir se connecter aux serveurs de l'UO Servers avec le Bureau à distance.
    - Les connexions Bureau à distance vers les contrôleurs de domaine ne doivent être possibles que depuis JMP1 et JMP2.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      1. In a GPO, assign the user right [[right]] to Tier0-Admins, and link the GPO to [[link]].
      2. In a GPO linked to the Domain Controllers OU, configure [[fw]].
    fr: |
      1. Dans un GPO, attribuer le droit utilisateur [[right]] à Tier0-Admins, et lier le GPO à [[link]].
      2. Dans un GPO lié à l'UO Domain Controllers, configurer [[fw]].
  slots:
    - id: right
      options:
        - { id: denyrds, text: Deny log on through Remote Desktop Services }
        - { id: allowrds, text: Allow log on through Remote Desktop Services }
        - { id: denylocal, text: Deny log on locally }
        - { id: denybatch, text: Deny log on as a batch job }
    - id: link
      options:
        - { id: servers, text: { en: "the Servers OU", fr: "l'UO Servers" } }
        - { id: domain, text: { en: "the domain", fr: "le domaine" } }
        - { id: jump, text: { en: "the Tier0-JumpServers OU", fr: "l'UO Tier0-JumpServers" } }
        - { id: dcou, text: { en: "the Domain Controllers OU", fr: "l'UO Domain Controllers" } }
    - id: fw
      options:
        - { id: inbound, text: { en: "an inbound Windows Firewall rule that allows TCP 3389 only from 10.0.10.11 and 10.0.10.12", fr: "une règle de Pare-feu Windows entrante qui n'autorise TCP 3389 que depuis 10.0.10.11 et 10.0.10.12" } }
        - { id: outbound, text: { en: "an outbound Windows Firewall rule that blocks TCP 3389 to every address except 10.0.10.11 and 10.0.10.12", fr: "une règle de Pare-feu Windows sortante qui bloque TCP 3389 vers toutes les adresses sauf 10.0.10.11 et 10.0.10.12" } }
        - { id: exempt, text: { en: "an authentication exemption connection security rule for 10.0.10.11 and 10.0.10.12", fr: "une règle de sécurité de connexion d'exemption d'authentification pour 10.0.10.11 et 10.0.10.12" } }
        - { id: nla, text: { en: "the requirement for Network Level Authentication for Remote Desktop connections", fr: "l'exigence d'authentification au niveau du réseau pour les connexions Bureau à distance" } }
answer:
  values: { right: denyrds, link: servers, fw: inbound }
explanation:
  correct:
    en: The Deny log on through Remote Desktop Services right, linked to the OU of the lower-tier servers, keeps Tier 0 credentials off those servers while the jump servers and domain controllers are not affected. Microsoft recommends that GPOs linked to the domain controllers allow RDP only from authorized systems such as jump servers, by combining user rights with Windows Firewall rules; an inbound rule scoped to the jump servers' addresses enforces the second requirement.
    fr: "Le droit Deny log on through Remote Desktop Services, lié à l'UO des serveurs de niveau inférieur, tient les informations d'identification du niveau 0 à l'écart de ces serveurs sans toucher aux serveurs de rebond ni aux contrôleurs de domaine. Microsoft recommande que les GPO liés aux contrôleurs de domaine n'autorisent le RDP que depuis des systèmes autorisés comme les serveurs de rebond, en combinant droits utilisateur et règles du Pare-feu Windows ; une règle entrante limitée aux adresses des serveurs de rebond impose la seconde exigence."
  options:
    allowrds: { en: "Granting the Allow right does not stop the administrators from using RDP on the servers.", fr: "Accorder le droit Allow n'empêche pas les administrateurs d'utiliser le RDP sur les serveurs." }
    denylocal: { en: "Deny log on locally blocks console sign-in, not Remote Desktop sign-in.", fr: "Deny log on locally bloque la connexion à la console, pas la connexion Bureau à distance." }
    denybatch: { en: "Deny log on as a batch job affects scheduled tasks, not Remote Desktop.", fr: "Deny log on as a batch job concerne les tâches planifiées, pas le Bureau à distance." }
    domain: { en: "A GPO linked to the domain would also apply to the domain controllers and jump servers, locking the administrators out.", fr: "Un GPO lié au domaine s'appliquerait aussi aux contrôleurs de domaine et aux serveurs de rebond, et bloquerait les administrateurs." }
    jump: { en: "The administrators must still use the jump servers; the deny right belongs on the lower-tier servers.", fr: "Les administrateurs doivent toujours utiliser les serveurs de rebond ; le droit de refus s'applique aux serveurs de niveau inférieur." }
    dcou: { en: "Denying RDP on the domain controllers would prevent the Tier 0 administration the second requirement keeps.", fr: "Refuser le RDP sur les contrôleurs de domaine empêcherait l'administration du niveau 0 que la seconde exigence conserve." }
    outbound: { en: "Outbound rules on the domain controllers do not filter incoming RDP connections.", fr: "Les règles sortantes des contrôleurs de domaine ne filtrent pas les connexions RDP entrantes." }
    exempt: { en: "An exemption rule removes the IPsec authentication requirement; it does not restrict who can connect.", fr: "Une règle d'exemption supprime l'exigence d'authentification IPsec ; elle ne limite pas qui peut se connecter." }
    nla: { en: "Network Level Authentication requires authentication before the session is created but does not limit the source computers.", fr: "L'authentification au niveau du réseau exige l'authentification avant la création de la session, mais ne limite pas les ordinateurs sources." }
references:
  - title: Securing domain controllers against attack
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/securing-domain-controllers-against-attack
  - title: Allow log on through Remote Desktop Services
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/allow-log-on-through-remote-desktop-services
