id: az802-6a-gpo-deny-rdp
objective: "6.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an AD DS domain named **adatum.com**. The domain contains an organizational unit (OU) named **AppServers** that contains 25 member servers running Windows Server 2025, and a group named **Contractors**. Members of Contractors are also members of the Remote Desktop Users group on the servers.

    You need to prevent members of Contractors from signing in to the servers in AppServers by using Remote Desktop. Members of Contractors must still be able to access the file shares on the servers.

    Which user right should you configure in a GPO linked to AppServers?
  fr: |
    Votre réseau contient un domaine AD DS nommé **adatum.com**. Le domaine contient une unité d'organisation (UO) nommée **AppServers** qui contient 25 serveurs membres exécutant Windows Server 2025, ainsi qu'un groupe nommé **Contractors**. Les membres de Contractors sont également membres du groupe Remote Desktop Users sur les serveurs.

    Vous devez empêcher les membres de Contractors de se connecter aux serveurs d'AppServers à l'aide du Bureau à distance. Les membres de Contractors doivent toujours pouvoir accéder aux partages de fichiers des serveurs.

    Quel droit utilisateur devez-vous configurer dans un objet de stratégie de groupe lié à AppServers ?
body:
  options:
    - { id: a, text: Deny log on locally }
    - { id: b, text: Deny access to this computer from the network }
    - { id: c, text: Deny log on through Remote Desktop Services }
    - { id: d, text: Deny log on as a batch job }
answer:
  optionId: c
explanation:
  correct:
    en: "Deny log on through Remote Desktop Services, under Local Policies > User Rights Assignment, prevents the listed accounts from signing in through a Remote Desktop connection. When an account is subject to both this setting and Allow log on through Remote Desktop Services, the deny setting wins, so membership in Remote Desktop Users no longer helps."
    fr: "Deny log on through Remote Desktop Services, sous Local Policies > User Rights Assignment, empêche les comptes répertoriés de se connecter par une connexion Bureau à distance. Lorsqu'un compte est soumis à ce paramètre et à Allow log on through Remote Desktop Services, le refus l'emporte : l'appartenance à Remote Desktop Users ne suffit donc plus."
  options:
    a:
      en: "Deny log on locally blocks interactive sign-in at the console; it isn't the right that controls Remote Desktop sign-in."
      fr: "Deny log on locally bloque l'ouverture de session interactive sur la console ; ce n'est pas le droit qui contrôle la connexion Bureau à distance."
    b:
      en: "Deny access to this computer from the network would also block access to the file shares, which must keep working."
      fr: "Deny access to this computer from the network bloquerait aussi l'accès aux partages de fichiers, qui doit continuer de fonctionner."
    d:
      en: "Deny log on as a batch job concerns scheduled tasks and batch-queue logons, not Remote Desktop sessions."
      fr: "Deny log on as a batch job concerne les tâches planifiées et les ouvertures de session par file d'attente de traitement par lots, pas les sessions Bureau à distance."
references:
  - title: Deny log on through Remote Desktop Services
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/deny-log-on-through-remote-desktop-services
