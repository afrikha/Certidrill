id: az802-6b-fw-cs-exemption
objective: "6.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named fabrikam.com. You deploy domain isolation by using a Group Policy Object that contains a connection security rule. The rule requires authentication for inbound connections and requests authentication for outbound connections.

    Two network monitoring appliances at 10.0.0.50 and 10.0.0.51 cannot join the domain or use IPsec. The appliances must continue to connect to the isolated servers.

    You need to add a connection security rule to the GPO. Which type of rule should you create?
  fr: |
    Votre réseau contient un domaine Active Directory nommé fabrikam.com. Vous déployez l'isolation de domaine au moyen d'un objet de stratégie de groupe qui contient une règle de sécurité de connexion. Cette règle exige l'authentification pour les connexions entrantes et la demande pour les connexions sortantes.

    Deux appliances de supervision réseau aux adresses 10.0.0.50 et 10.0.0.51 ne peuvent ni rejoindre le domaine ni utiliser IPsec. Elles doivent continuer à se connecter aux serveurs isolés.

    Vous devez ajouter une règle de sécurité de connexion au GPO. Quel type de règle devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "Isolation", fr: "Isolation" } }
    - { id: b, text: { en: "Server-to-server", fr: "De serveur à serveur" } }
    - { id: c, text: { en: "Authentication exemption", fr: "Exemption d'authentification" } }
    - { id: d, text: { en: "Tunnel", fr: "Tunnel" } }
answer: { optionId: c }
explanation:
  correct:
    en: An authentication exemption rule lists computers, by IP address, that must be able to communicate without IPsec authentication. It is used for devices that cannot authenticate, such as appliances, or for infrastructure servers like DHCP, DNS and domain controllers that domain members contact before they can authenticate.
    fr: Une règle d'exemption d'authentification liste les ordinateurs, par adresse IP, qui doivent pouvoir communiquer sans authentification IPsec. Elle sert pour les appareils qui ne peuvent pas s'authentifier, comme des appliances, ou pour les serveurs d'infrastructure tels que DHCP, DNS et contrôleurs de domaine, que les membres du domaine contactent avant de pouvoir s'authentifier.
  options:
    a: { en: "An isolation rule requires or requests authentication; it would not let devices without IPsec through.", fr: "Une règle d'isolation exige ou demande l'authentification ; elle ne laisserait pas passer des appareils sans IPsec." }
    b: { en: "A server-to-server rule authenticates traffic between specific endpoints; the appliances still cannot authenticate.", fr: "Une règle de serveur à serveur authentifie le trafic entre des points de terminaison précis ; les appliances ne peuvent toujours pas s'authentifier." }
    d: { en: "A tunnel rule protects traffic between two IPsec gateways; it does not exempt hosts from authentication.", fr: "Une règle de tunnel protège le trafic entre deux passerelles IPsec ; elle n'exempte pas des hôtes de l'authentification." }
references:
  - title: Create an Authentication Exemption List Rule on Windows 8, Windows 7, Windows Vista, Windows Server 2012, Windows Server 2008, and Windows Server 2008 R2
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/create-an-authentication-exemption-list-rule
