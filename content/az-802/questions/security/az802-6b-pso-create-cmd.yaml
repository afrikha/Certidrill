id: az802-6b-pso-create-cmd
objective: "6.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named adatum.com. The help desk staff are members of a global security group named **GG-Helpdesk**.

    You need to:

    - require a minimum password length of 15 characters for the members of GG-Helpdesk only, and lock their accounts for 30 minutes after five failed sign-in attempts;
    - confirm which password policy applies to a help desk user named **lena**.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine Active Directory nommé adatum.com. Les membres du support technique appartiennent à un groupe de sécurité global nommé **GG-Helpdesk**.

    Vous devez :

    - exiger une longueur minimale de mot de passe de 15 caractères pour les seuls membres de GG-Helpdesk, et verrouiller leurs comptes pendant 30 minutes après cinq tentatives de connexion infructueuses ;
    - confirmer quelle stratégie de mot de passe s'applique à un utilisateur du support nommé **lena**.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    [[create]] -Name "PSO-Helpdesk" -Precedence 15 -MinPasswordLength 15 -ComplexityEnabled $true `
      -LockoutThreshold 5 -LockoutDuration "00:30:00" -LockoutObservationWindow "00:30:00"
    [[apply]] -Identity "PSO-Helpdesk" -Subjects "GG-Helpdesk"
    [[check]] -Identity "lena"
  slots:
    - id: create
      options:
        - { id: newpso, text: New-ADFineGrainedPasswordPolicy }
        - { id: setdef, text: Set-ADDefaultDomainPasswordPolicy }
        - { id: newauth, text: New-ADAuthenticationPolicy }
        - { id: newgpo, text: New-GPO }
    - id: apply
      options:
        - { id: subject, text: Add-ADFineGrainedPasswordPolicySubject }
        - { id: member, text: Add-ADGroupMember }
        - { id: silo, text: Set-ADAccountAuthenticationPolicySilo }
        - { id: princ, text: Add-ADPrincipalGroupMembership }
    - id: check
      options:
        - { id: getpso, text: Get-ADFineGrainedPasswordPolicy }
        - { id: resultant, text: Get-ADUserResultantPasswordPolicy }
        - { id: getdef, text: Get-ADDefaultDomainPasswordPolicy }
        - { id: rodc, text: Get-ADAccountResultantPasswordReplicationPolicy }
answer:
  values: { create: newpso, apply: subject, check: resultant }
explanation:
  correct:
    en: "`New-ADFineGrainedPasswordPolicy` creates a password settings object with its own precedence, password and lockout settings. `Add-ADFineGrainedPasswordPolicySubject` applies it to users or global security groups, here GG-Helpdesk. `Get-ADUserResultantPasswordPolicy` returns the PSO that actually applies to lena, which accounts for precedence when several PSOs apply."
    fr: "`New-ADFineGrainedPasswordPolicy` crée un objet de paramètres de mot de passe avec sa propre priorité et ses paramètres de mot de passe et de verrouillage. `Add-ADFineGrainedPasswordPolicySubject` l'applique à des utilisateurs ou à des groupes de sécurité globaux, ici GG-Helpdesk. `Get-ADUserResultantPasswordPolicy` renvoie le PSO qui s'applique réellement à lena, en tenant compte de la priorité quand plusieurs PSO s'appliquent."
  options:
    setdef: { en: "Set-ADDefaultDomainPasswordPolicy changes the policy of every domain account and has no Name or Precedence parameter.", fr: "Set-ADDefaultDomainPasswordPolicy modifie la stratégie de tous les comptes du domaine et n'a pas de paramètre Name ni Precedence." }
    newauth: { en: "An authentication policy controls Kerberos TGT lifetime and sign-in restrictions, not password rules.", fr: "Une stratégie d'authentification contrôle la durée de vie du TGT Kerberos et les restrictions de connexion, pas les règles de mot de passe." }
    newgpo: { en: "Password settings in a GPO apply to domain accounts only from a GPO linked to the domain, so they cannot target one group.", fr: "Les paramètres de mot de passe d'un GPO ne s'appliquent aux comptes du domaine que depuis un GPO lié au domaine : ils ne peuvent pas cibler un groupe." }
    member: { en: "Add-ADGroupMember adds members to a group; it does not link a PSO to the group.", fr: "Add-ADGroupMember ajoute des membres à un groupe ; il ne lie pas un PSO au groupe." }
    getpso: { en: "Get-ADFineGrainedPasswordPolicy lists PSOs but does not resolve which one applies to a user.", fr: "Get-ADFineGrainedPasswordPolicy liste les PSO mais ne détermine pas celui qui s'applique à un utilisateur." }
    rodc: { en: "This cmdlet reports the RODC password replication policy of an account, not its password policy.", fr: "Cette applet de commande indique la stratégie de réplication des mots de passe RODC d'un compte, pas sa stratégie de mot de passe." }
references:
  - title: New-ADFineGrainedPasswordPolicy (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/new-adfinegrainedpasswordpolicy
  - title: Get-ADUserResultantPasswordPolicy (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-aduserresultantpasswordpolicy
