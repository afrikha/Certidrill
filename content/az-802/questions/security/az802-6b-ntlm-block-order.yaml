id: az802-6b-ntlm-block-order
objective: "6.2.9"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named fabrikam.com. The domain controllers run Windows Server 2022.

    You need to block NTLM authentication for the domain. A legacy application server named **APP-LEG01** must keep accepting NTLM authentication. The solution must minimize the risk of disrupting other applications.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Votre réseau contient un domaine Active Directory nommé fabrikam.com. Les contrôleurs de domaine exécutent Windows Server 2022.

    Vous devez bloquer l'authentification NTLM pour le domaine. Un serveur d'applications hérité nommé **APP-LEG01** doit continuer à accepter l'authentification NTLM. La solution doit réduire au minimum le risque de perturber d'autres applications.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: audit, text: { en: "In a GPO linked to the Domain Controllers OU, set **Network security: Restrict NTLM: Audit NTLM authentication in this domain** to **Enable all**.", fr: "Dans un GPO lié à l'UO Domain Controllers, définir **Network security: Restrict NTLM: Audit NTLM authentication in this domain** sur **Enable all**." } }
    - { id: review, text: { en: "On the domain controllers, review the events in the **Microsoft\\Windows\\NTLM\\Operational** log.", fr: "Sur les contrôleurs de domaine, examiner les événements du journal **Microsoft\\Windows\\NTLM\\Operational**." } }
    - { id: except, text: { en: "Add APP-LEG01 to **Network security: Restrict NTLM: Add server exceptions in this domain**.", fr: "Ajouter APP-LEG01 à **Network security: Restrict NTLM: Add server exceptions in this domain**." } }
    - { id: deny, text: { en: "Set **Network security: Restrict NTLM: NTLM authentication in this domain** to **Deny all**.", fr: "Définir **Network security: Restrict NTLM: NTLM authentication in this domain** sur **Deny all**." } }
    - { id: lmlevel, text: { en: "Set **Network security: LAN Manager authentication level** to **Send LM & NTLM responses**.", fr: "Définir **Network security: LAN Manager authentication level** sur **Send LM & NTLM responses**." } }
    - { id: pu, text: { en: "Add all the user accounts of the domain to the Protected Users group.", fr: "Ajouter tous les comptes d'utilisateur du domaine au groupe Protected Users." } }
    - { id: security, text: { en: "Enable **Audit Credential Validation** and review the Security log for NTLM events.", fr: "Activer **Audit Credential Validation** et examiner le journal Sécurité pour y trouver les événements NTLM." } }
answer:
  sequence: [ audit, review, except, deny ]
explanation:
  correct:
    en: Microsoft recommends auditing first by setting the audit policy to the same option you plan to enforce, then reviewing the NTLM operational log to find the servers that still receive NTLM requests. You then add the servers that must keep NTLM to the exception list, and only after that set the deny policy on the domain controllers. Blocking NTLM without this audit phase can cause many authentication failures.
    fr: "Microsoft recommande d'auditer d'abord, en réglant la stratégie d'audit sur l'option que vous prévoyez d'appliquer, puis d'examiner le journal opérationnel NTLM pour trouver les serveurs qui reçoivent encore des requêtes NTLM. Vous ajoutez ensuite à la liste d'exceptions les serveurs qui doivent garder NTLM, et seulement après vous appliquez la stratégie de refus sur les contrôleurs de domaine. Bloquer NTLM sans cette phase d'audit peut provoquer de nombreux échecs d'authentification."
  options:
    lmlevel: { en: "This value weakens authentication by allowing LM and NTLMv1; it does not block NTLM.", fr: "Cette valeur affaiblit l'authentification en autorisant LM et NTLMv1 ; elle ne bloque pas NTLM." }
    pu: { en: "Protected Users is meant for privileged people, not for every account, and it would also deny NTLM to APP-LEG01's users.", fr: "Protected Users est destiné aux personnes privilégiées, pas à tous les comptes, et il refuserait aussi NTLM aux utilisateurs d'APP-LEG01." }
    security: { en: "The Restrict NTLM audit and block events are written to the NTLM operational log; there is no security audit policy for them.", fr: "Les événements d'audit et de blocage de Restrict NTLM sont écrits dans le journal opérationnel NTLM ; il n'existe pas de stratégie d'audit de sécurité pour eux." }
references:
  - title: "Network security: Restrict NTLM: NTLM authentication in this domain"
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/network-security-restrict-ntlm-ntlm-authentication-in-this-domain
