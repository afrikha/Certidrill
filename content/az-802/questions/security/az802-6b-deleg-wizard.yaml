id: az802-6b-deleg-wizard
objective: "6.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named contoso.com. The user accounts of the Lyon office are in an OU named **Lyon**.

    The members of a group named **HD-Lyon** must be able to reset the passwords of the users in the Lyon OU and force them to change their password at the next sign-in. The solution must follow the principle of least privilege and minimize administrative effort.

    What should you do?
  fr: |
    Votre réseau contient un domaine Active Directory nommé contoso.com. Les comptes d'utilisateur du site de Lyon se trouvent dans une UO nommée **Lyon**.

    Les membres d'un groupe nommé **HD-Lyon** doivent pouvoir réinitialiser les mots de passe des utilisateurs de l'UO Lyon et les obliger à changer de mot de passe à la prochaine connexion. La solution doit respecter le principe du moindre privilège et réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add HD-Lyon to the Account Operators group.", fr: "Ajouter HD-Lyon au groupe Account Operators." } }
    - { id: b, text: { en: "On the Delegation tab of the GPO linked to the Lyon OU, grant HD-Lyon the Edit settings permission.", fr: "Dans l'onglet Délégation du GPO lié à l'UO Lyon, accorder à HD-Lyon l'autorisation Modifier les paramètres." } }
    - { id: c, text: { en: "Add HD-Lyon to the Domain Admins group, and then add HD-Lyon to the Protected Users group.", fr: "Ajouter HD-Lyon au groupe Domain Admins, puis ajouter HD-Lyon au groupe Protected Users." } }
    - { id: d, text: { en: "Run the Delegation of Control Wizard on the Lyon OU for HD-Lyon, and select the task to reset user passwords.", fr: "Exécuter l'Assistant Délégation de contrôle sur l'UO Lyon pour HD-Lyon, et sélectionner la tâche de réinitialisation des mots de passe utilisateur." } }
answer: { optionId: d }
explanation:
  correct:
    en: The Delegation of Control Wizard grants a group a predefined set of permissions on an OU. Its common task Reset user passwords and force password change at next logon gives HD-Lyon exactly the required rights, inherited by the user objects of the OU, and nothing on the rest of the domain.
    fr: "L'Assistant Délégation de contrôle accorde à un groupe un ensemble prédéfini d'autorisations sur une UO. Sa tâche courante de réinitialisation des mots de passe utilisateur avec obligation de changement à la prochaine ouverture de session donne à HD-Lyon exactement les droits requis, hérités par les objets utilisateur de l'UO, et rien sur le reste du domaine."
  options:
    a: { en: "Account Operators can manage most accounts of the whole domain and sign in to domain controllers; this is far beyond the requirement.", fr: "Account Operators peut gérer la plupart des comptes de tout le domaine et se connecter aux contrôleurs de domaine ; c'est bien au-delà de l'exigence." }
    b: { en: "GPO permissions control who can edit Group Policy settings, not who can reset passwords.", fr: "Les autorisations d'un GPO contrôlent qui peut modifier les paramètres de stratégie de groupe, pas qui peut réinitialiser les mots de passe." }
    c: { en: "Domain Admins grants full control of the domain, and Protected Users does not reduce those permissions.", fr: "Domain Admins accorde le contrôle total du domaine, et Protected Users ne réduit pas ces autorisations." }
references:
  - title: Delegating Administration by Using OU Objects
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/delegating-administration-by-using-ou-objects
