id: az802-6b-pso-settings
objective: "6.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named litware.com. You plan to create a password settings object (PSO) for the members of a group named **GG-Contractors**.

    Which two settings can you configure in the PSO?

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine Active Directory nommé litware.com. Vous prévoyez de créer un objet de paramètres de mot de passe (PSO) pour les membres d'un groupe nommé **GG-Contractors**.

    Quels sont les deux paramètres que vous pouvez configurer dans le PSO ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Maximum lifetime for user ticket", fr: "Durée de vie maximale du ticket utilisateur" } }
    - { id: b, text: { en: "Account lockout duration", fr: "Durée du verrouillage des comptes" } }
    - { id: c, text: { en: "Logon hours", fr: "Horaires d'accès" } }
    - { id: d, text: { en: "Store passwords using reversible encryption", fr: "Enregistrer les mots de passe en utilisant un chiffrement réversible" } }
    - { id: e, text: { en: "Interactive logon: Number of previous logons to cache", fr: "Ouverture de session interactive : nombre d'ouvertures de session précédentes à mettre en cache" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: A PSO holds the password settings (history, maximum and minimum age, minimum length, complexity, reversible encryption) and the account lockout settings (threshold, duration, observation window), plus its precedence. These are the parameters of New-ADFineGrainedPasswordPolicy, such as LockoutDuration and ReversibleEncryptionEnabled.
    fr: Un PSO contient les paramètres de mot de passe (historique, durées de vie maximale et minimale, longueur minimale, complexité, chiffrement réversible) et les paramètres de verrouillage des comptes (seuil, durée, fenêtre d'observation), ainsi que sa priorité. Ce sont les paramètres de New-ADFineGrainedPasswordPolicy, comme LockoutDuration et ReversibleEncryptionEnabled.
  options:
    a: { en: "Kerberos ticket lifetimes come from the domain Kerberos policy or from an authentication policy, not from a PSO.", fr: "Les durées de vie des tickets Kerberos proviennent de la stratégie Kerberos du domaine ou d'une stratégie d'authentification, pas d'un PSO." }
    c: { en: "Logon hours are an attribute of each user account, not a PSO setting.", fr: "Les horaires d'accès sont un attribut de chaque compte d'utilisateur, pas un paramètre de PSO." }
    e: { en: "Cached logons are a security option of the computer, set by Group Policy.", fr: "La mise en cache des ouvertures de session est une option de sécurité de l'ordinateur, définie par stratégie de groupe." }
references:
  - title: New-ADFineGrainedPasswordPolicy (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/new-adfinegrainedpasswordpolicy
