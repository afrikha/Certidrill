id: az802-6b-logon-workstations
objective: "6.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named wingtiptoys.com. A user account named **kiosk-lobby** is used on two computers named KIOSK1 and KIOSK2 in the lobby.

    You need to ensure that kiosk-lobby can sign in only to KIOSK1 and KIOSK2. The solution must not affect any other account and must minimize administrative effort.

    What should you configure?
  fr: |
    Votre réseau contient un domaine Active Directory nommé wingtiptoys.com. Un compte d'utilisateur nommé **kiosk-lobby** est utilisé sur deux ordinateurs nommés KIOSK1 et KIOSK2 dans le hall d'accueil.

    Vous devez faire en sorte que kiosk-lobby ne puisse se connecter qu'à KIOSK1 et KIOSK2. La solution ne doit affecter aucun autre compte et doit réduire au minimum l'effort d'administration.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "The Logon Hours setting of kiosk-lobby", fr: "Le paramètre Horaires d'accès de kiosk-lobby" } }
    - { id: b, text: { en: "The Log On To setting of kiosk-lobby", fr: "Le paramètre Se connecter à de kiosk-lobby" } }
    - { id: c, text: { en: "The Account expires setting of kiosk-lobby", fr: "Le paramètre Date d'expiration du compte de kiosk-lobby" } }
    - { id: d, text: { en: "The Allow log on locally user right in the Default Domain Policy", fr: "Le droit utilisateur Allow log on locally dans la Default Domain Policy" } }
answer: { optionId: b }
explanation:
  correct:
    en: The Log On To setting on the Account tab of the user (the LogonWorkstations property in PowerShell) lists the only computers that the account can sign in to. It is configured once on the account and affects no other user.
    fr: "Le paramètre Se connecter à de l'onglet Compte de l'utilisateur (la propriété LogonWorkstations en PowerShell) liste les seuls ordinateurs auxquels le compte peut se connecter. Il se configure une seule fois sur le compte et n'affecte aucun autre utilisateur."
  options:
    a: { en: "Logon hours restrict when the account can sign in, not where.", fr: "Les horaires d'accès limitent quand le compte peut se connecter, pas où." }
    c: { en: "An expiration date disables the account after a date; it does not restrict computers.", fr: "Une date d'expiration désactive le compte après une date ; elle ne limite pas les ordinateurs." }
    d: { en: "A user right in a GPO linked to the domain applies to every computer in the domain and changes sign-in for other accounts too.", fr: "Un droit utilisateur dans un GPO lié au domaine s'applique à tous les ordinateurs du domaine et modifie aussi la connexion des autres comptes." }
references:
  - title: Set-ADUser (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/set-aduser
