id: az802-cs3a-pso-precedence
objective: "6.2.1"
type: yesno_statements
caseStudy: az802-cs3a-bellows-college
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A user who is a member of both Staff and IT-Admins must use a password of at least 16 characters.
        fr: |
          Un utilisateur membre à la fois de Staff et d'IT-Admins doit utiliser un mot de passe d'au moins 16 caractères.
    - id: s2
      text:
        en: |
          The labadmin account must use a password of at least 16 characters.
        fr: |
          Le compte labadmin doit utiliser un mot de passe d'au moins 16 caractères.
    - id: s3
      text:
        en: |
          A user account in the Staff OU that is not a member of any group to which a PSO applies can use a password of 6 characters.
        fr: |
          Un compte d'utilisateur de l'UO Staff qui n'est membre d'aucun groupe auquel s'applique un PSO peut utiliser un mot de passe de 6 caractères.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      When several PSOs reach a user through global groups, the PSO with the lowest precedence value wins, so PSO-Admins (10) beats PSO-Staff (20). A PSO applied directly to the user account takes priority over any PSO inherited through a group, so labadmin gets PSO-Lab (14 characters) despite its higher precedence value. Password settings in a GPO linked to an OU do not apply to domain accounts; without a PSO, the user gets the Default Domain Policy (10 characters).
    fr: |
      Lorsque plusieurs PSO atteignent un utilisateur par des groupes globaux, c'est le PSO dont la valeur de priorité est la plus basse qui l'emporte : PSO-Admins (10) l'emporte donc sur PSO-Staff (20). Un PSO appliqué directement au compte d'utilisateur prime sur tout PSO hérité d'un groupe : labadmin reçoit donc PSO-Lab (14 caractères) malgré sa valeur de priorité plus élevée. Les paramètres de mot de passe d'un GPO lié à une UO ne s'appliquent pas aux comptes de domaine ; sans PSO, l'utilisateur reçoit la stratégie Default Domain Policy (10 caractères).
references:
  - title: Get-ADUserResultantPasswordPolicy (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-aduserresultantpasswordpolicy
