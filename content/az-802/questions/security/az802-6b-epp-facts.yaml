id: az802-6b-epp-facts
objective: "6.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an Active Directory forest named fabrikam.com that syncs with a Microsoft Entra tenant. You deploy Microsoft Entra Password Protection as follows:

    - The proxy service is installed and registered on two member servers that have outbound HTTPS access.
    - The DC agent is installed on all the domain controllers. The domain controllers have no internet access.
    - In the Microsoft Entra admin center, the mode is set to **Enforced**, and the custom banned password list contains the term **fabrikam**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient une forêt Active Directory nommée fabrikam.com synchronisée avec un locataire Microsoft Entra. Vous déployez la protection par mot de passe Microsoft Entra comme suit :

    - Le service proxy est installé et inscrit sur deux serveurs membres qui disposent d'un accès HTTPS sortant.
    - L'agent DC est installé sur tous les contrôleurs de domaine. Les contrôleurs de domaine n'ont pas accès à Internet.
    - Dans le Centre d'administration Microsoft Entra, le mode est défini sur **Enforced** (Appliqué) et la liste personnalisée de mots de passe interdits contient le terme **fabrikam**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A user whose current password is Fabrikam1! is forced to change it at the next sign-in.
        fr: Un utilisateur dont le mot de passe actuel est Fabrikam1! est obligé de le changer à la prochaine connexion.
    - id: s2
      text:
        en: When a help desk operator resets a user's password to Fabrikam1! in Active Directory Users and Computers, the reset is rejected.
        fr: Quand un opérateur du support réinitialise le mot de passe d'un utilisateur en Fabrikam1! dans Utilisateurs et ordinateurs Active Directory, la réinitialisation est refusée.
    - id: s3
      text:
        en: The DC agents obtain the password policy directly from Microsoft Entra ID over HTTPS.
        fr: Les agents DC obtiennent la stratégie de mot de passe directement auprès de Microsoft Entra ID via HTTPS.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Passwords are evaluated only when they are changed or reset on a domain controller that runs the DC agent; existing passwords are not checked and no change is forced. An administrative reset is a password set operation, which is validated like a change, so a password built from a banned term plus a few characters is rejected in Enforced mode. Domain controllers never communicate with the internet: the proxy service forwards policy requests to Microsoft Entra ID, and the DC agents share the policy through SYSVOL.
    fr: "Les mots de passe ne sont évalués que lorsqu'ils sont modifiés ou réinitialisés sur un contrôleur de domaine qui exécute l'agent DC ; les mots de passe existants ne sont pas vérifiés et aucun changement n'est imposé. Une réinitialisation par un administrateur est une opération de définition de mot de passe, validée comme une modification : un mot de passe formé d'un terme interdit et de quelques caractères est refusé en mode Enforced. Les contrôleurs de domaine ne communiquent jamais avec Internet : le service proxy transmet les demandes de stratégie à Microsoft Entra ID et les agents DC partagent la stratégie par SYSVOL."
references:
  - title: Enforce on-premises Microsoft Entra Password Protection for Active Directory Domain Services
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-password-ban-bad-on-premises
