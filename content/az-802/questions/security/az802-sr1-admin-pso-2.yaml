id: az802-sr1-admin-pso-2
objective: "6.2.1"
type: series_yesno
series: az802-sr1-admin-pso
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You link a Group Policy Object that contains the password and lockout settings to the Admins OU.
  fr: Vous liez à l'UO Admins un objet de stratégie de groupe qui contient les paramètres de mot de passe et de verrouillage.
body:
  solution:
    en: |
      You create a Group Policy Object (GPO) named **GPO-Admins**. In **Computer Configuration\Windows Settings\Security Settings\Account Policies**, you set **Minimum password length** to 15 and **Account lockout threshold** to 5. You link GPO-Admins to the Admins OU.
    fr: |
      Vous créez un objet de stratégie de groupe (GPO) nommé **GPO-Admins**. Dans **Computer Configuration\Windows Settings\Security Settings\Account Policies**, vous définissez **Minimum password length** sur 15 et **Account lockout threshold** sur 5. Vous liez GPO-Admins à l'UO Admins.
answer: { value: false }
explanation:
  correct:
    en: |
      Account policies for domain accounts are applied at the domain level, so a GPO linked to an OU does not change the password or lockout requirements of the domain user accounts stored in that OU. The IT administrators keep the Default Domain Policy settings. A fine-grained password policy is the feature that gives a group of users different settings.
    fr: |
      Les stratégies de compte des comptes de domaine s'appliquent au niveau du domaine : un GPO lié à une UO ne modifie pas les exigences de mot de passe ni de verrouillage des comptes d'utilisateur de domaine stockés dans cette UO. Les administrateurs informatiques conservent les paramètres de la stratégie Default Domain Policy. C'est une stratégie de mot de passe affinée qui permet d'attribuer des paramètres différents à un groupe d'utilisateurs.
references:
  - title: Password Policy
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/password-policy
