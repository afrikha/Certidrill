id: az802-cs1c-claims-credguard
objective: "6.1.3"
type: yesno_statements
caseStudy: az802-cs1c-humongous
difficulty: 2
status: draft
stem:
  en: |
    You are evaluating Credential Guard for the credentials requirement.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez Credential Guard pour l'exigence relative aux informations d'identification.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Credential Guard is already enabled on CLM1 and CLM2.
        fr: Credential Guard est déjà activé sur CLM1 et CLM2.
    - id: s2
      text:
        en: You should also enable Credential Guard on DC1 and DC2 to protect the Active Directory database.
        fr: Vous devez aussi activer Credential Guard sur DC1 et DC2 pour protéger la base de données Active Directory.
    - id: s3
      text:
        en: A claims application on CLM1 that relies on Kerberos unconstrained delegation stops working when Credential Guard runs on CLM1.
        fr: Une application de gestion des sinistres sur CLM1 qui repose sur la délégation Kerberos non contrainte cesse de fonctionner quand Credential Guard s'exécute sur CLM1.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Starting with Windows Server 2025, Credential Guard is enabled by default, without UEFI lock, on domain-joined servers that aren't domain controllers and meet the hardware requirements. Credential Guard doesn't protect the Active Directory database or the SAM, and Microsoft doesn't recommend enabling it on domain controllers. Applications that require Kerberos unconstrained delegation, Kerberos DES or NTLMv1 break when Credential Guard is enabled.
    fr: |
      À partir de Windows Server 2025, Credential Guard est activé par défaut, sans verrou UEFI, sur les serveurs joints à un domaine qui ne sont pas des contrôleurs de domaine et qui respectent la configuration matérielle requise. Credential Guard ne protège ni la base de données Active Directory ni la base SAM, et Microsoft ne recommande pas de l'activer sur les contrôleurs de domaine. Les applications qui exigent la délégation Kerberos non contrainte, le chiffrement Kerberos DES ou NTLMv1 cessent de fonctionner quand Credential Guard est activé.
references:
  - title: Credential Guard overview
    url: https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/
