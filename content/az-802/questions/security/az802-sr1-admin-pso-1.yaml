id: az802-sr1-admin-pso-1
objective: "6.2.1"
type: series_yesno
series: az802-sr1-admin-pso
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You create a fine-grained password policy and apply it to the IT-Admins group.
  fr: Vous créez une stratégie de mot de passe affinée et l'appliquez au groupe IT-Admins.
body:
  solution:
    en: |
      You run the following commands:

      ```powershell
      New-ADFineGrainedPasswordPolicy -Name "ITAdminsPSO" -Precedence 10 -MinPasswordLength 15 -ComplexityEnabled $true -LockoutThreshold 5 -LockoutDuration "0.00:30:00" -LockoutObservationWindow "0.00:30:00"
      Add-ADFineGrainedPasswordPolicySubject -Identity "ITAdminsPSO" -Subjects "IT-Admins"
      ```
    fr: |
      Vous exécutez les commandes suivantes :

      ```powershell
      New-ADFineGrainedPasswordPolicy -Name "ITAdminsPSO" -Precedence 10 -MinPasswordLength 15 -ComplexityEnabled $true -LockoutThreshold 5 -LockoutDuration "0.00:30:00" -LockoutObservationWindow "0.00:30:00"
      Add-ADFineGrainedPasswordPolicySubject -Identity "ITAdminsPSO" -Subjects "IT-Admins"
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      A fine-grained password policy (password settings object) defines password and account lockout settings for selected users of a domain. It applies to user objects and global security groups, so applying it to IT-Admins reaches exactly the IT administrator accounts, while every other account keeps the Default Domain Policy. The lockout duration is equal to the observation window, as the cmdlet requires.
    fr: |
      Une stratégie de mot de passe affinée (objet de paramètres de mot de passe) définit des paramètres de mot de passe et de verrouillage de compte pour des utilisateurs choisis d'un domaine. Elle s'applique aux objets utilisateur et aux groupes de sécurité globaux : l'appliquer à IT-Admins atteint exactement les comptes des administrateurs informatiques, tandis que tous les autres comptes conservent la stratégie Default Domain Policy. La durée de verrouillage est égale à la fenêtre d'observation, comme l'exige l'applet de commande.
