id: az802-6a-laps-no-backup
objective: "6.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an AD DS domain named **proseware.com** at the Windows Server 2016 domain functional level. You ran Update-LapsADSchema and Set-LapsADComputerSelfPermission for an organizational unit (OU) named **Servers**.

    You link a GPO named **GPO-LAPS** to the Servers OU. In **System > LAPS**, GPO-LAPS configures only **PasswordLength** (20), **PasswordComplexity** (4) and **PasswordAgeDays** (15). Two days later, no Windows LAPS password is stored in AD DS for any server in the OU, and Get-LapsADPassword returns no password.

    What should you do to resolve the issue?
  fr: |
    Votre réseau contient un domaine AD DS nommé **proseware.com** au niveau fonctionnel de domaine Windows Server 2016. Vous avez exécuté Update-LapsADSchema et Set-LapsADComputerSelfPermission pour une unité d'organisation (UO) nommée **Servers**.

    Vous liez un objet de stratégie de groupe nommé **GPO-LAPS** à l'UO Servers. Dans **System > LAPS**, GPO-LAPS configure uniquement **PasswordLength** (20), **PasswordComplexity** (4) et **PasswordAgeDays** (15). Deux jours plus tard, aucun mot de passe Windows LAPS n'est stocké dans AD DS pour les serveurs de l'UO, et Get-LapsADPassword ne renvoie aucun mot de passe.

    Que devez-vous faire pour résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Wait until the passwords reach their PasswordAgeDays value of 15 days.", fr: "Attendre que les mots de passe atteignent leur valeur PasswordAgeDays de 15 jours." } }
    - { id: b, text: { en: "In GPO-LAPS, configure AdministratorAccountName with the name of the built-in Administrator account.", fr: "Dans GPO-LAPS, configurer AdministratorAccountName avec le nom du compte Administrator intégré." } }
    - { id: c, text: { en: "In GPO-LAPS, configure BackupDirectory to back up passwords to Active Directory.", fr: "Dans GPO-LAPS, configurer BackupDirectory pour sauvegarder les mots de passe dans Active Directory." } }
    - { id: d, text: { en: "Raise the domain functional level so that ADPasswordEncryptionEnabled can be used.", fr: "Augmenter le niveau fonctionnel du domaine pour pouvoir utiliser ADPasswordEncryptionEnabled." } }
answer:
  optionId: c
explanation:
  correct:
    en: "BackupDirectory defaults to Disabled, and when it is Disabled all the other Windows LAPS settings are ignored. At a minimum, you must set BackupDirectory to Active Directory (value 2) for the servers to back up their passwords to AD DS."
    fr: "BackupDirectory a pour valeur par défaut Disabled, et lorsqu'il est désactivé, tous les autres paramètres Windows LAPS sont ignorés. Vous devez au minimum définir BackupDirectory sur Active Directory (valeur 2) pour que les serveurs sauvegardent leurs mots de passe dans AD DS."
  options:
    b:
      en: "Without AdministratorAccountName, Windows LAPS manages the built-in administrator account, identified by its well-known RID; that isn't the missing setting."
      fr: "Sans AdministratorAccountName, Windows LAPS gère le compte d'administrateur intégré, identifié par son RID connu ; ce n'est pas le paramètre manquant."
    a:
      en: "Password age decides when a stored password is rotated; with backup disabled, nothing is ever stored, however long you wait."
      fr: "L'âge du mot de passe détermine quand un mot de passe stocké est changé ; avec la sauvegarde désactivée, rien n'est jamais stocké, quelle que soit la durée d'attente."
    d:
      en: "The domain is already at the Windows Server 2016 functional level, which supports password encryption, enabled by default."
      fr: "Le domaine est déjà au niveau fonctionnel Windows Server 2016, qui prend en charge le chiffrement des mots de passe, activé par défaut."
references:
