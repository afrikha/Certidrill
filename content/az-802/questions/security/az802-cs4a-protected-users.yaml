id: az802-cs4a-protected-users
objective: "6.2.3"
type: yesno_statements
caseStudy: az802-cs4a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You add the user accounts of T0-Admins to the Protected Users group as required. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ajoutez les comptes d'utilisateur de T0-Admins au groupe Protected Users comme demandé. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The T0-Admins members can still sign in to ChemTrack on APP1 with their own accounts.
        fr: |
          Les membres de T0-Admins peuvent toujours se connecter à ChemTrack sur APP1 avec leur propre compte.
    - id: s2
      text:
        en: |
          The domain functional level of treyresearch.com is high enough for the domain controllers to apply the Protected Users protections.
        fr: |
          Le niveau fonctionnel du domaine treyresearch.com est suffisant pour que les contrôleurs de domaine appliquent les protections de Protected Users.
    - id: s3
      text:
        en: |
          A T0-Admins member who signs in at 08:00 keeps the same Kerberos TGT, renewed by the domain controllers, until the end of the work day.
        fr: |
          Un membre de T0-Admins qui se connecte à 8 h 00 conserve le même TGT Kerberos, renouvelé par les contrôleurs de domaine, jusqu'à la fin de la journée de travail.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Members of Protected Users cannot authenticate with NTLM, so they lose access to ChemTrack, which supports only NTLM. The domain-controller protections require the Windows Server 2012 R2 domain functional level or later, and treyresearch.com is at Windows Server 2016. The TGT lifetime of a member is fixed at four hours (240 minutes) and cannot be renewed beyond it, so the member must authenticate again during the day.
    fr: |
      Les membres de Protected Users ne peuvent pas s'authentifier avec NTLM : ils perdent l'accès à ChemTrack, qui ne prend en charge que NTLM. Les protections appliquées par les contrôleurs de domaine exigent le niveau fonctionnel de domaine Windows Server 2012 R2 ou ultérieur, et treyresearch.com est au niveau Windows Server 2016. La durée de vie du TGT d'un membre est fixée à quatre heures (240 minutes) et ne peut pas être renouvelée au-delà : le membre doit s'authentifier de nouveau dans la journée.
references:
  - title: Protected Users security group
    url: https://learn.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/protected-users-security-group
