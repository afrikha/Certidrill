id: az802-6a-gpo-lgpo-workgroup
objective: "6.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have 12 servers that run Windows Server 2022 in a perimeter network. The servers are members of a workgroup and will never be joined to a domain. You downloaded the Microsoft Security Compliance Toolkit, including the Windows Server 2022 security baseline GPO backups.

    You need to apply the security baseline to the local policy of each server by using a command-line tool.

    Which tool should you use?
  fr: |
    Vous disposez de 12 serveurs qui exécutent Windows Server 2022 dans un réseau de périmètre. Les serveurs sont membres d'un groupe de travail et ne seront jamais joints à un domaine. Vous avez téléchargé Microsoft Security Compliance Toolkit, y compris les sauvegardes d'objets de stratégie de groupe de la base de référence de sécurité Windows Server 2022.

    Vous devez appliquer la base de référence de sécurité à la stratégie locale de chaque serveur à l'aide d'un outil en ligne de commande.

    Quel outil devez-vous utiliser ?
body:
  options:
    - { id: a, text: Policy Analyzer }
    - { id: b, text: LGPO.exe }
    - { id: c, text: SetObjectSecurity.exe }
    - { id: d, text: Set-OSConfigDesiredConfiguration }
answer:
  optionId: b
explanation:
  correct:
    en: "LGPO.exe is the command-line tool of the Security Compliance Toolkit that automates the management of local Group Policy. It can import and apply the Registry.pol files, security templates and advanced auditing backup files that make up a baseline, which makes it suitable for non-domain-joined servers."
    fr: "LGPO.exe est l'outil en ligne de commande de Security Compliance Toolkit qui automatise la gestion de la stratégie de groupe locale. Il peut importer et appliquer les fichiers Registry.pol, modèles de sécurité et fichiers de sauvegarde d'audit avancé qui composent une base de référence, ce qui le rend adapté aux serveurs non joints à un domaine."
  options:
    a:
      en: "Policy Analyzer compares sets of GPOs with each other or with the local policy; it doesn't apply settings."
      fr: "Policy Analyzer compare des ensembles d'objets de stratégie de groupe entre eux ou avec la stratégie locale ; il n'applique pas de paramètres."
    c:
      en: "SetObjectSecurity.exe sets the security descriptor of objects such as files, registry keys or services; it doesn't import a baseline."
      fr: "SetObjectSecurity.exe définit le descripteur de sécurité d'objets tels que des fichiers, des clés de Registre ou des services ; il n'importe pas de base de référence."
    d:
      en: "OSConfig and its cmdlets are available only on Windows Server 2025, not on Windows Server 2022."
      fr: "OSConfig et ses applets de commande ne sont disponibles que sur Windows Server 2025, pas sur Windows Server 2022."
references:
  - title: Microsoft Security Compliance Toolkit - How to use
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/device-management/windows-security-configuration-framework/security-compliance-toolkit-10
