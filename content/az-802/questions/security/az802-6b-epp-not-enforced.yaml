id: az802-6b-epp-not-enforced
objective: "6.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named litware.com that has three domain controllers named DC1, DC2 and DC3. DC3 was promoted last week. Microsoft Entra Password Protection was deployed last month; the proxy service runs on two member servers.

    Users report that they can still set passwords that contain terms from the custom banned password list. On a proxy server, you run `Get-AzureADPasswordProtectionSummaryReport`. The report shows a growing number of PasswordChangeAuditOnlyFailures for DC1 and DC2, and no data for DC3.

    You need to ensure that banned passwords are rejected on every domain controller.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine Active Directory nommé litware.com qui comporte trois contrôleurs de domaine nommés DC1, DC2 et DC3. DC3 a été promu la semaine dernière. La protection par mot de passe Microsoft Entra a été déployée le mois dernier ; le service proxy s'exécute sur deux serveurs membres.

    Des utilisateurs signalent qu'ils peuvent encore définir des mots de passe qui contiennent des termes de la liste personnalisée de mots de passe interdits. Sur un serveur proxy, vous exécutez `Get-AzureADPasswordProtectionSummaryReport`. Le rapport montre un nombre croissant de PasswordChangeAuditOnlyFailures pour DC1 et DC2, et aucune donnée pour DC3.

    Vous devez faire en sorte que les mots de passe interdits soient refusés sur chaque contrôleur de domaine.

    Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run Register-AzureADPasswordProtectionForest on a proxy server.", fr: "Exécuter Register-AzureADPasswordProtectionForest sur un serveur proxy." } }
    - { id: b, text: { en: "Install the DC agent on DC3, and then restart DC3.", fr: "Installer l'agent DC sur DC3, puis redémarrer DC3." } }
    - { id: c, text: { en: "Install the proxy service on DC3, and then restart DC3.", fr: "Installer le service proxy sur DC3, puis redémarrer DC3." } }
    - { id: d, text: { en: "Set the password protection mode to Enforced in the Microsoft Entra admin center.", fr: "Définir le mode de protection par mot de passe sur Enforced dans le Centre d'administration Microsoft Entra." } }
    - { id: e, text: { en: "Enable password hash synchronization for the tenant.", fr: "Activer la synchronisation de hachage de mot de passe pour le locataire." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Audit-only failures mean that the DC agents on DC1 and DC2 have the policy but run in Audit mode, where bad passwords are logged and still accepted; switching the mode to Enforced makes them reject those passwords. DC3 reports nothing because the new domain controller has no DC agent, and the policy is enforced only where the agent is installed. Installing the agent requires a restart, because the password filter DLL loads only at startup.
    fr: "Les échecs en mode audit indiquent que les agents DC de DC1 et DC2 disposent de la stratégie mais fonctionnent en mode Audit, où les mauvais mots de passe sont journalisés puis acceptés ; passer en mode Enforced leur fait refuser ces mots de passe. DC3 ne remonte rien, car le nouveau contrôleur de domaine n'a pas d'agent DC, et la stratégie n'est appliquée que là où l'agent est installé. L'installation de l'agent exige un redémarrage, car la DLL de filtre de mot de passe n'est chargée qu'au démarrage."
  options:
    a: { en: "The forest is already registered: DC1 and DC2 evaluate passwords against the downloaded policy.", fr: "La forêt est déjà inscrite : DC1 et DC2 évaluent les mots de passe d'après la stratégie téléchargée." }
    c: { en: "The proxy service does not validate passwords; a domain controller needs the DC agent, and a proxy on a domain controller is for testing only.", fr: "Le service proxy ne valide pas les mots de passe ; un contrôleur de domaine a besoin de l'agent DC, et un proxy sur un contrôleur de domaine est réservé aux tests." }
    e: { en: "Password Protection does not depend on password hash synchronization.", fr: "La protection par mot de passe ne dépend pas de la synchronisation de hachage de mot de passe." }
references:
  - title: Monitor and review logs for on-premises Microsoft Entra Password Protection environments
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-password-ban-bad-on-premises-monitor
  - title: Enable on-premises Microsoft Entra Password Protection
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-password-ban-bad-on-premises-operations
