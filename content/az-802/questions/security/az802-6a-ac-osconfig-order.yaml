id: az802-6a-ac-osconfig-order
objective: "6.1.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have a server named **Server4** that runs a production-signed build of Windows Server 2025. The Microsoft.OSConfig PowerShell module is installed on Server4. A third-party line-of-business application named **App1** runs on Server4. You have a client computer named **Client1** on which the App Control Wizard is installed.

    You need to enforce the default App Control for Business policy provided by OSConfig on Server4. App1 must never be blocked.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un serveur nommé **Server4** qui exécute une build de production signée de Windows Server 2025. Le module PowerShell Microsoft.OSConfig est installé sur Server4. Une application métier tierce nommée **App1** s'exécute sur Server4. Vous disposez d'un ordinateur client nommé **Client1** sur lequel l'Assistant App Control est installé.

    Vous devez appliquer sur Server4 la stratégie App Control for Business par défaut fournie par OSConfig. App1 ne doit jamais être bloquée.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste d'actions vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: audit, text: { en: "On Server4, apply the AppControl\\WS2025\\DefaultPolicy\\Audit scenario with Set-OSConfigDesiredConfiguration -Default.", fr: "Sur Server4, appliquer le scénario AppControl\\WS2025\\DefaultPolicy\\Audit avec Set-OSConfigDesiredConfiguration -Default." } }
    - { id: log, text: { en: "Run App1, then save the CodeIntegrity Operational log that contains the 3076 events as an .evtx file and copy it to Client1.", fr: "Exécuter App1, puis enregistrer le journal CodeIntegrity Operational qui contient les événements 3076 dans un fichier .evtx et le copier sur Client1." } }
    - { id: wizard, text: { en: "On Client1, use Convert Event Logs to a Policy in the App Control Wizard to create an XML policy that allows App1.", fr: "Sur Client1, utiliser Convert Event Logs to a Policy dans l'Assistant App Control pour créer une stratégie XML qui autorise App1." } }
    - { id: supp, text: { en: "On Server4, set the XML policy as a supplement of the base policy with Set-CIPolicyIdInfo -SupplementsBasePolicyID, then apply it with Set-OSConfigDesiredConfiguration -Scenario AppControl -Name Policies.", fr: "Sur Server4, définir la stratégie XML comme supplément de la stratégie de base avec Set-CIPolicyIdInfo -SupplementsBasePolicyID, puis l'appliquer avec Set-OSConfigDesiredConfiguration -Scenario AppControl -Name Policies." } }
    - { id: enforce, text: { en: "On Server4, apply the AppControl\\WS2025\\DefaultPolicy\\Enforce scenario with Set-OSConfigDesiredConfiguration -Default.", fr: "Sur Server4, appliquer le scénario AppControl\\WS2025\\DefaultPolicy\\Enforce avec Set-OSConfigDesiredConfiguration -Default." } }
    - { id: enforcefirst, text: { en: "Run App1 and collect the 3077 events from the CodeIntegrity Operational log.", fr: "Exécuter App1 et collecter les événements 3077 du journal CodeIntegrity Operational." } }
    - { id: gpo, text: { en: "Convert the XML policy to binary with ConvertFrom-CIPolicy and deploy it to Server4 by using Group Policy.", fr: "Convertir la stratégie XML en binaire avec ConvertFrom-CIPolicy et la déployer sur Server4 à l'aide d'une stratégie de groupe." } }
answer:
  sequence: [ audit, log, wizard, supp, enforce ]
explanation:
  correct:
    en: "In audit mode, App Control logs event 3076 for each file that the policy would block, without blocking it. The App Control Wizard converts that log into a policy that allows App1; on Server4 you make it a supplemental policy of the OSConfig base policy and apply it through the AppControl scenario. Only then do you switch to enforcement, so App1 is never blocked."
    fr: "En mode audit, App Control enregistre l'événement 3076 pour chaque fichier que la stratégie bloquerait, sans le bloquer. L'Assistant App Control convertit ce journal en stratégie qui autorise App1 ; sur Server4, vous en faites une stratégie supplémentaire de la stratégie de base OSConfig et l'appliquez par le scénario AppControl. Ce n'est qu'ensuite que vous passez en mode application : App1 n'est ainsi jamais bloquée."
  options:
    enforcefirst:
      en: "Event 3077 is logged when a file is blocked in enforcement mode, so collecting it means App1 has already been blocked."
      fr: "L'événement 3077 est enregistré lorsqu'un fichier est bloqué en mode application : le collecter signifie qu'App1 a déjà été bloquée."
    gpo:
      en: "Group Policy deployment supports only the single-policy format on Windows Server 2016 and 2019; on Windows Server 2025 the supplemental policy is applied through OSConfig."
      fr: "Le déploiement par stratégie de groupe ne prend en charge que le format à stratégie unique sur Windows Server 2016 et 2019 ; sur Windows Server 2025, la stratégie supplémentaire est appliquée par OSConfig."
references:
  - title: Configure App Control for Business by using OSConfig
    url: https://learn.microsoft.com/en-us/windows-server/security/osconfig/osconfig-how-to-configure-app-control-for-business
