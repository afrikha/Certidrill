id: az802-6a-ac-ws2022-deploy
objective: "6.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a server named **Server6** that runs Windows Server 2022. You created an unsigned App Control for Business policy in the multiple policy format and converted it to a binary file named **{A1B2C3D4-0000-4E5F-9A8B-112233445566}.cip** by using ConvertFrom-CIPolicy.

    You need to activate the policy on Server6 by using a script. The solution must not require a restart of Server6.

    What should the script do?
  fr: |
    Vous disposez d'un serveur nommé **Server6** qui exécute Windows Server 2022. Vous avez créé une stratégie App Control for Business non signée au format à stratégies multiples et l'avez convertie en un fichier binaire nommé **{A1B2C3D4-0000-4E5F-9A8B-112233445566}.cip** à l'aide de ConvertFrom-CIPolicy.

    Vous devez activer la stratégie sur Server6 à l'aide d'un script. La solution ne doit pas nécessiter de redémarrage de Server6.

    Que doit faire le script ?
body:
  options:
    - { id: a, text: { en: "Run CiTool --update-policy with the path of the .cip file.", fr: "Exécuter CiTool --update-policy avec le chemin du fichier .cip." } }
    - { id: b, text: { en: "Copy the .cip file to %windir%\\System32\\CodeIntegrity\\CIPolicies\\Active, then run RefreshPolicy.exe.", fr: "Copier le fichier .cip dans %windir%\\System32\\CodeIntegrity\\CIPolicies\\Active, puis exécuter RefreshPolicy.exe." } }
    - { id: c, text: { en: "Run Set-OSConfigDesiredConfiguration -Scenario AppControl -Name Policies with the path of the policy.", fr: "Exécuter Set-OSConfigDesiredConfiguration -Scenario AppControl -Name Policies avec le chemin de la stratégie." } }
    - { id: d, text: { en: "Copy the .cip file to the EFI\\Microsoft\\Boot\\CiPolicies\\Active folder of the EFI system partition.", fr: "Copier le fichier .cip dans le dossier EFI\\Microsoft\\Boot\\CiPolicies\\Active de la partition système EFI." } }
answer:
  optionId: b
explanation:
  correct:
    en: "On Windows Server 2022, a multiple-format policy is activated by copying the {PolicyId}.cip file to the CIPolicies\\Active folder and running RefreshPolicy.exe, which refreshes all App Control policies without a restart. CiTool is documented for Windows 11 version 22H2 and Windows Server 2025, not for Windows Server 2022."
    fr: "Sur Windows Server 2022, une stratégie au format multiple s'active en copiant le fichier {PolicyId}.cip dans le dossier CIPolicies\\Active puis en exécutant RefreshPolicy.exe, qui actualise toutes les stratégies App Control sans redémarrage. CiTool est documenté pour Windows 11 version 22H2 et Windows Server 2025, pas pour Windows Server 2022."
  options:
    a:
      en: "CiTool can deploy policies on Windows 11 version 22H2 and Windows Server 2025; it isn't the method documented for Windows Server 2022."
      fr: "CiTool peut déployer des stratégies sur Windows 11 version 22H2 et Windows Server 2025 ; ce n'est pas la méthode documentée pour Windows Server 2022."
    c:
      en: "OSConfig, and its AppControl scenario, is available only on Windows Server 2025."
      fr: "OSConfig, et son scénario AppControl, n'est disponible que sur Windows Server 2025."
    d:
      en: "The EFI system partition is used for signed policies, and that method requires a restart."
      fr: "La partition système EFI est utilisée pour les stratégies signées, et cette méthode nécessite un redémarrage."
references:
