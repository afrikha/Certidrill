id: az802-6a-laps-settings-dragdrop
objective: "6.1.7"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an AD DS domain named **northwind.com** at the Windows Server 2016 domain functional level. A GPO named **GPO-LAPS-DC** applies to the domain controllers, which run Windows Server 2025. GPO-LAPS-DC already sets **BackupDirectory** to Active Directory and keeps password encryption enabled.

    You need to configure GPO-LAPS-DC to meet the following requirements:

    - The Directory Services Restore Mode (DSRM) password of each domain controller is managed and backed up.
    - The 12 previous passwords are kept in AD DS.
    - Eight hours after the managed password is used to sign in, the password is reset and the server restarts.

    Which setting should you configure for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine AD DS nommé **northwind.com** au niveau fonctionnel de domaine Windows Server 2016. Un objet de stratégie de groupe nommé **GPO-LAPS-DC** s'applique aux contrôleurs de domaine, qui exécutent Windows Server 2025. GPO-LAPS-DC définit déjà **BackupDirectory** sur Active Directory et laisse le chiffrement des mots de passe activé.

    Vous devez configurer GPO-LAPS-DC pour répondre aux exigences suivantes :

    - Le mot de passe du mode de restauration des services d'annuaire (DSRM) de chaque contrôleur de domaine est géré et sauvegardé.
    - Les 12 mots de passe précédents sont conservés dans AD DS.
    - Huit heures après l'utilisation du mot de passe géré pour se connecter, le mot de passe est réinitialisé et le serveur redémarre.

    Quel paramètre devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dsrm, text: "ADBackupDSRMPassword: Enabled" }
    - { id: hist, text: "ADEncryptedPasswordHistorySize: 12" }
    - { id: post, text: "PostAuthenticationActions: 5, with PostAuthenticationResetDelay: 8" }
    - { id: post3, text: "PostAuthenticationActions: 3, with PostAuthenticationResetDelay: 8" }
    - { id: age, text: "PasswordAgeDays: 12" }
    - { id: name, text: "AdministratorAccountName: DSRM" }
  targets:
    - { id: t1, text: { en: "Manage and back up the DSRM password", fr: "Gérer et sauvegarder le mot de passe DSRM" } }
    - { id: t2, text: { en: "Keep the 12 previous passwords", fr: "Conserver les 12 mots de passe précédents" } }
    - { id: t3, text: { en: "Reset the password and restart eight hours after use", fr: "Réinitialiser le mot de passe et redémarrer huit heures après utilisation" } }
answer:
  mapping: { t1: dsrm, t2: hist, t3: post }
explanation:
  correct:
    en: "On domain controllers, ADBackupDSRMPassword makes Windows LAPS manage and back up the DSRM password; it requires password encryption. ADEncryptedPasswordHistorySize keeps from 0 to 12 previous encrypted passwords. PostAuthenticationActions 5 resets the password and reboots, and PostAuthenticationResetDelay sets the number of hours, from 0 to 24, before the action runs."
    fr: "Sur les contrôleurs de domaine, ADBackupDSRMPassword fait gérer et sauvegarder le mot de passe DSRM par Windows LAPS ; il nécessite le chiffrement des mots de passe. ADEncryptedPasswordHistorySize conserve de 0 à 12 anciens mots de passe chiffrés. PostAuthenticationActions 5 réinitialise le mot de passe et redémarre, et PostAuthenticationResetDelay définit le nombre d'heures, de 0 à 24, avant l'exécution de l'action."
  options:
    post3:
      en: "Action 3 resets the password and signs out the account; it doesn't restart the server."
      fr: "L'action 3 réinitialise le mot de passe et déconnecte le compte ; elle ne redémarre pas le serveur."
    age:
      en: "PasswordAgeDays sets the maximum age of the current password; it doesn't keep any history."
      fr: "PasswordAgeDays définit l'âge maximal du mot de passe actuel ; il ne conserve aucun historique."
    name:
      en: "AdministratorAccountName selects a custom local account to manage; DSRM is handled by ADBackupDSRMPassword."
      fr: "AdministratorAccountName sélectionne un compte local personnalisé à gérer ; le DSRM est géré par ADBackupDSRMPassword."
references:
  - title: Configure Policy Settings for Windows LAPS
    url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-management-policy-settings
