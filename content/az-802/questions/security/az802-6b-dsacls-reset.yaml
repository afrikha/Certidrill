id: az802-6b-dsacls-reset
objective: "6.2.8"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named contoso.com. An OU named **Lyon** contains user accounts and two child OUs that also contain user accounts.

    You need to use `dsacls` to grant a group named **HD-Lyon** the right to reset the passwords of all the user accounts in Lyon and its child OUs. The solution must follow the principle of least privilege, and the existing permissions on Lyon must be kept.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine Active Directory nommé contoso.com. Une UO nommée **Lyon** contient des comptes d'utilisateur et deux UO enfants qui contiennent elles aussi des comptes d'utilisateur.

    Vous devez utiliser `dsacls` pour accorder à un groupe nommé **HD-Lyon** le droit de réinitialiser les mots de passe de tous les comptes d'utilisateur de Lyon et de ses UO enfants. La solution doit respecter le principe du moindre privilège, et les autorisations existantes sur Lyon doivent être conservées.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    dsacls "OU=Lyon,DC=contoso,DC=com" [[scope]] [[op]] "CONTOSO\HD-Lyon:[[perm]];Reset Password;user"
  slots:
    - id: scope
      options:
        - { id: is, text: "/I:S" }
        - { id: ip, text: "/I:P" }
        - { id: py, text: "/P:Y" }
        - { id: n, text: "/N" }
    - id: op
      options:
        - { id: g, text: "/G" }
        - { id: d, text: "/D" }
        - { id: r, text: "/R" }
        - { id: s, text: "/S" }
    - id: perm
      options:
        - { id: ca, text: CA }
        - { id: wp, text: WP }
        - { id: ga, text: GA }
        - { id: rp, text: RP }
answer:
  values: { scope: is, op: g, perm: ca }
explanation:
  correct:
    en: "`/I:S` makes the new ACE apply to child objects only, at every level below the OU, and the inherited object type `user` limits it to user accounts. `/G` grants the permission and adds it to the existing ACEs. Reset Password is an extended right, so the permission code is `CA` (control access) followed by the name of the right."
    fr: "`/I:S` fait s'appliquer la nouvelle ACE aux seuls objets enfants, à tous les niveaux sous l'UO, et le type d'objet hérité `user` la limite aux comptes d'utilisateur. `/G` accorde l'autorisation et l'ajoute aux ACE existantes. Reset Password est un droit étendu : le code d'autorisation est donc `CA` (contrôle d'accès) suivi du nom du droit."
  options:
    ip: { en: "/I:P propagates the permission down one level only, so the users in the child OUs would not be covered.", fr: "/I:P ne propage l'autorisation que sur un niveau : les utilisateurs des UO enfants ne seraient pas couverts." }
    py: { en: "/P:Y changes the OU's own inheritance flag and protects it from inheriting permissions; it does not set the ACE scope.", fr: "/P:Y modifie l'indicateur d'héritage de l'UO elle-même et la protège de l'héritage ; il ne définit pas la portée de l'ACE." }
    n: { en: "/N replaces the current ACEs instead of adding one, which would not keep the existing permissions.", fr: "/N remplace les ACE actuelles au lieu d'en ajouter une, ce qui ne conserverait pas les autorisations existantes." }
    d: { en: "/D denies the permission instead of granting it.", fr: "/D refuse l'autorisation au lieu de l'accorder." }
    r: { en: "/R deletes all the ACEs of the specified users or groups.", fr: "/R supprime toutes les ACE des utilisateurs ou groupes indiqués." }
    s: { en: "/S restores the default security of the object class from the schema.", fr: "/S rétablit la sécurité par défaut de la classe d'objet définie dans le schéma." }
    wp: { en: "WP writes properties; a password reset is an extended right that requires CA.", fr: "WP permet d'écrire des propriétés ; la réinitialisation de mot de passe est un droit étendu qui exige CA." }
    ga: { en: "GA (generic all) would grant full control of the user objects, which violates least privilege.", fr: "GA (tous les droits génériques) accorderait le contrôle total des objets utilisateur, ce qui viole le moindre privilège." }
    rp: { en: "RP only reads properties.", fr: "RP ne permet que de lire des propriétés." }
references:
  - title: Dsacls
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc771151(v=ws.11)
