id: az802-cs2b-laps-operations
objective: "6.1.7"
type: dragdrop
caseStudy: az802-cs2b-lamna-healthcare
difficulty: 1
status: draft
stem:
  en: |
    You need to perform three Windows LAPS tasks.

    Which cmdlet should you use for each task? To answer, drag the appropriate cmdlets to the correct tasks. Each cmdlet may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez effectuer trois tâches Windows LAPS.

    Quelle applet de commande devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les applets de commande appropriées vers les tâches correspondantes. Chaque applet de commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: get, text: Get-LapsADPassword }
    - { id: exp, text: Set-LapsADPasswordExpirationTime }
    - { id: reset, text: Reset-LapsPassword }
    - { id: inv, text: Invoke-LapsPolicyProcessing }
    - { id: resetperm, text: Set-LapsADResetPasswordPermission }
    - { id: find, text: Find-LapsADExtendedRights }
  targets:
    - { id: t1, text: { en: "On MGMT1, display the current password of FS1 in clear text.", fr: "Sur MGMT1, afficher en clair le mot de passe actuel de FS1." } }
    - { id: t2, text: { en: "On MGMT1, make CL-FS1 change its password the next time it processes the Windows LAPS policy.", fr: "Sur MGMT1, faire en sorte que CL-FS1 change son mot de passe lors du prochain traitement de la stratégie Windows LAPS." } }
    - { id: t3, text: { en: "On FS1, change the password of FS1 right away.", fr: "Sur FS1, changer immédiatement le mot de passe de FS1." } }
answer:
  mapping: { t1: get, t2: exp, t3: reset }
explanation:
  correct:
    en: '`Get-LapsADPassword` with `-AsPlainText` retrieves the password stored in AD DS. `Set-LapsADPasswordExpirationTime` sets the expiration time of the password in AD DS, so the device rotates the password at its next policy processing. `Reset-LapsPassword` runs locally on the managed device and rotates the password immediately.'
    fr: '`Get-LapsADPassword` avec `-AsPlainText` récupère le mot de passe stocké dans AD DS. `Set-LapsADPasswordExpirationTime` définit la date d''expiration du mot de passe dans AD DS : l''appareil change le mot de passe lors de son prochain traitement de la stratégie. `Reset-LapsPassword` s''exécute localement sur l''appareil géré et change immédiatement le mot de passe.'
  options:
    inv:
      en: '`Invoke-LapsPolicyProcessing` applies the policy now, but it does not mark the current password as expired.'
      fr: '`Invoke-LapsPolicyProcessing` applique la stratégie immédiatement, mais ne marque pas le mot de passe actuel comme expiré.'
    resetperm:
      en: '`Set-LapsADResetPasswordPermission` grants a group the right to set the expiration time; it does not expire a password.'
      fr: '`Set-LapsADResetPasswordPermission` accorde à un groupe le droit de définir la date d''expiration ; il ne fait expirer aucun mot de passe.'
    find:
      en: '`Find-LapsADExtendedRights` audits who has extended rights on an OU; it does not manage passwords.'
      fr: '`Find-LapsADExtendedRights` audite qui dispose de droits étendus sur une UO ; il ne gère pas les mots de passe.'
references:
  - title: Get started with Windows LAPS and Windows Server Active Directory
    url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-scenarios-windows-server-active-directory
