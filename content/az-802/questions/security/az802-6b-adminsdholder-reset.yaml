id: az802-6b-adminsdholder-reset
objective: "6.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named contoso.com. A help desk group named **HD-Paris** was delegated the **Reset user passwords and force password change at next logon** task on an OU named **Paris** by using the Delegation of Control Wizard.

    HD-Paris members can reset the password of every user in the Paris OU except **u-marc**, who is a member of the **Server Operators** group. Yesterday, you granted HD-Paris the Reset Password permission directly on the u-marc account. This morning, HD-Paris members again receive an access denied error when they reset the password of u-marc, and the permission you added is gone.

    What is the cause of the issue?
  fr: |
    Votre réseau contient un domaine Active Directory nommé contoso.com. Un groupe du support nommé **HD-Paris** a reçu la délégation de la tâche **Réinitialiser les mots de passe utilisateur et forcer le changement de mot de passe à la prochaine ouverture de session** sur une UO nommée **Paris** au moyen de l'Assistant Délégation de contrôle.

    Les membres de HD-Paris peuvent réinitialiser le mot de passe de tous les utilisateurs de l'UO Paris, sauf **u-marc**, membre du groupe **Server Operators**. Hier, vous avez accordé à HD-Paris l'autorisation Reset Password directement sur le compte u-marc. Ce matin, les membres de HD-Paris reçoivent de nouveau une erreur d'accès refusé quand ils réinitialisent le mot de passe d'u-marc, et l'autorisation que vous aviez ajoutée a disparu.

    Quelle est la cause du problème ?
body:
  options:
    - { id: a, text: { en: "The Delegation of Control Wizard applies its permissions only to user accounts created after the delegation.", fr: "L'Assistant Délégation de contrôle n'applique ses autorisations qu'aux comptes d'utilisateur créés après la délégation." } }
    - { id: b, text: { en: "The SDProp process replaced the permissions of u-marc with those of the AdminSDHolder object.", fr: "Le processus SDProp a remplacé les autorisations d'u-marc par celles de l'objet AdminSDHolder." } }
    - { id: c, text: { en: "The Default Domain Controllers Policy GPO removes explicit permissions from accounts every 90 minutes.", fr: "Le GPO Default Domain Controllers Policy supprime les autorisations explicites des comptes toutes les 90 minutes." } }
    - { id: d, text: { en: "The change was made on a domain controller that does not hold the RID master role and was overwritten during replication.", fr: "La modification a été faite sur un contrôleur de domaine qui ne détient pas le rôle de maître RID et a été écrasée pendant la réplication." } }
answer: { optionId: b }
explanation:
  correct:
    en: Server Operators is a protected group, so u-marc is a protected account with permission inheritance disabled; the delegation on the Paris OU never reaches it. Every 60 minutes by default, SDProp on the PDC emulator compares protected accounts with the AdminSDHolder object and resets any difference, which removed the permission you added. Microsoft recommends keeping operator groups such as Server Operators empty; removing u-marc from the group is the lasting fix.
    fr: "Server Operators est un groupe protégé : u-marc est donc un compte protégé dont l'héritage des autorisations est désactivé, et la délégation sur l'UO Paris ne l'atteint jamais. Toutes les 60 minutes par défaut, SDProp, sur l'émulateur PDC, compare les comptes protégés à l'objet AdminSDHolder et rétablit toute différence, ce qui a supprimé l'autorisation que vous aviez ajoutée. Microsoft recommande de laisser vides les groupes d'opérateurs comme Server Operators ; retirer u-marc du groupe est la correction durable."
  options:
    a: { en: "Permissions delegated on an OU are inherited by existing and new child objects that allow inheritance.", fr: "Les autorisations déléguées sur une UO sont héritées par les objets enfants existants et nouveaux qui autorisent l'héritage." }
    c: { en: "Group Policy does not rewrite the permissions of directory objects; the GPO refresh interval is unrelated.", fr: "La stratégie de groupe ne réécrit pas les autorisations des objets de l'annuaire ; l'intervalle d'actualisation des GPO n'a aucun rapport." }
    d: { en: "Permission changes replicate from any writable domain controller; the RID master only allocates RID pools.", fr: "Les modifications d'autorisations se répliquent depuis n'importe quel contrôleur de domaine accessible en écriture ; le maître RID ne fait qu'allouer des pools de RID." }
references:
  - title: Appendix C - Protected Accounts and Groups in Active Directory
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/appendix-c--protected-accounts-and-groups-in-active-directory
