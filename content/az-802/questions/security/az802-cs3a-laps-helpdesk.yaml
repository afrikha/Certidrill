id: az802-cs3a-laps-helpdesk
objective: "6.1.7"
type: multi
caseStudy: az802-cs3a-bellows-college
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the lab servers requirement. Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence relative aux serveurs de laboratoire. Quelles sont les trois actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Run Set-LapsADComputerSelfPermission for the Lab-Servers OU", fr: "Exécuter Set-LapsADComputerSelfPermission pour l'UO Lab-Servers" } }
    - { id: b, text: { en: "Run Set-LapsADResetPasswordPermission for the Lab-Servers OU with HelpDesk as the allowed principal", fr: "Exécuter Set-LapsADResetPasswordPermission pour l'UO Lab-Servers avec HelpDesk comme principal autorisé" } }
    - { id: c, text: { en: "Run Set-LapsADReadPasswordPermission for the Lab-Servers OU with HelpDesk as the allowed principal", fr: "Exécuter Set-LapsADReadPasswordPermission pour l'UO Lab-Servers avec HelpDesk comme principal autorisé" } }
    - { id: d, text: { en: "Run Update-LapsADSchema on a domain controller of the research center", fr: "Exécuter Update-LapsADSchema sur un contrôleur de domaine du centre de recherche" } }
    - { id: e, text: { en: "In LAPS-Labs, set ADPasswordEncryptionPrincipal to the HelpDesk group", fr: "Dans LAPS-Labs, définir ADPasswordEncryptionPrincipal sur le groupe HelpDesk" } }
    - { id: f, text: { en: "In LAPS-Labs, disable the encryption of the backed-up passwords", fr: "Dans LAPS-Labs, désactiver le chiffrement des mots de passe sauvegardés" } }
answer:
  optionIds: [a, c, e]
explanation:
  correct:
    en: |
      Set-LapsADComputerSelfPermission lets the lab servers write their own passwords to AD DS, and Set-LapsADReadPasswordPermission gives HelpDesk the right to query them. Because LAPS-Labs encrypts the passwords, query rights are not enough to read them: ADPasswordEncryptionPrincipal decides who can decrypt, and it defaults to Domain Admins.
    fr: |
      Set-LapsADComputerSelfPermission permet aux serveurs de laboratoire d'écrire leur propre mot de passe dans AD DS, et Set-LapsADReadPasswordPermission donne à HelpDesk le droit de les interroger. Comme LAPS-Labs chiffre les mots de passe, le droit d'interrogation ne suffit pas pour les lire : ADPasswordEncryptionPrincipal détermine qui peut les déchiffrer, et sa valeur par défaut est Domain Admins.
  options:
    b:
      en: |
        Set-LapsADResetPasswordPermission lets a group force password expiration; it does not grant the right to read the passwords, so it exceeds what the requirement needs.
      fr: |
        Set-LapsADResetPasswordPermission permet à un groupe de forcer l'expiration du mot de passe ; il n'accorde pas le droit de lire les mots de passe, et dépasse donc ce que l'exigence demande.
    d:
      en: |
        The schema extension is a one-time, forest-wide operation that has already been performed.
      fr: |
        L'extension du schéma est une opération unique à l'échelle de la forêt, déjà effectuée.
    f:
      en: |
        Disabling encryption would store the passwords in clear text protected only by ACLs; it weakens security instead of granting HelpDesk a scoped right.
      fr: |
        Désactiver le chiffrement stockerait les mots de passe en clair, protégés uniquement par des ACL ; cela affaiblit la sécurité au lieu d'accorder à HelpDesk un droit limité.
references:
  - title: Get started with Windows LAPS and Windows Server Active Directory
    url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-scenarios-windows-server-active-directory
  - title: Configure Policy Settings for Windows LAPS
    url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-management-policy-settings
