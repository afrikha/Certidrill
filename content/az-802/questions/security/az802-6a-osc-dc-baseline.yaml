id: az802-6a-osc-dc-baseline
objective: "6.1.6"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a domain controller named **DC3** that runs Windows Server 2025. The OSConfig PowerShell module isn't installed on DC3.

    You need to apply the Microsoft security baseline for domain controllers to DC3 by using OSConfig.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un contrôleur de domaine nommé **DC3** qui exécute Windows Server 2025. Le module PowerShell OSConfig n'est pas installé sur DC3.

    Vous devez appliquer la base de référence de sécurité Microsoft pour les contrôleurs de domaine à DC3 à l'aide d'OSConfig.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Install-Module -Name [[mod]] -Scope AllUsers -Force
    [[cmd]] -Scenario [[scn]] -Default
  slots:
    - id: mod
      options:
        - { id: osc, text: Microsoft.OSConfig }
        - { id: gp, text: GroupPolicy }
        - { id: pm, text: ProcessMitigations }
    - id: cmd
      options:
        - { id: set, text: Set-OSConfigDesiredConfiguration }
        - { id: get, text: Get-OSConfigDesiredConfiguration }
        - { id: setgp, text: Set-GPRegistryValue }
    - id: scn
      options:
        - { id: dc, text: SecurityBaseline/WindowsServer/2025/DomainController }
        - { id: ms, text: SecurityBaseline/WindowsServer/2025/MemberServer }
        - { id: wg, text: SecurityBaseline/WindowsServer/2025/WorkgroupMember }
        - { id: sc, text: SecuredCore }
answer:
  values: { mod: osc, cmd: set, scn: dc }
explanation:
  correct:
    en: "OSConfig is delivered as the Microsoft.OSConfig module from the PowerShell Gallery. Set-OSConfigDesiredConfiguration with -Default applies a scenario with its default values, and the baseline for a domain controller is SecurityBaseline/WindowsServer/2025/DomainController. Run the commands in an elevated session and restart DC3 after the baseline is applied."
    fr: "OSConfig est fourni sous la forme du module Microsoft.OSConfig de PowerShell Gallery. Set-OSConfigDesiredConfiguration avec -Default applique un scénario avec ses valeurs par défaut, et la base de référence d'un contrôleur de domaine est SecurityBaseline/WindowsServer/2025/DomainController. Exécutez les commandes dans une session avec élévation de privilèges et redémarrez DC3 après l'application de la base de référence."
  options:
    get:
      en: "Get-OSConfigDesiredConfiguration reads the configuration and compliance of a scenario; it doesn't apply it."
      fr: "Get-OSConfigDesiredConfiguration lit la configuration et la conformité d'un scénario ; il ne l'applique pas."
    ms:
      en: "The MemberServer scenario targets domain member servers; each server role has its own baseline scenario."
      fr: "Le scénario MemberServer cible les serveurs membres d'un domaine ; chaque rôle de serveur a son propre scénario de base de référence."
    sc:
      en: "SecuredCore configures the secured-core server features, not the role-based security baseline."
      fr: "SecuredCore configure les fonctionnalités de serveur secured-core, pas la base de référence de sécurité propre au rôle."
references:
  - title: Deploy Windows Server 2025 security baselines locally with OSConfig
    url: https://learn.microsoft.com/en-us/windows-server/security/osconfig/osconfig-how-to-configure-security-baselines
