id: az802-6b-pso-domain-local
objective: "6.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named contoso.com. The domain functional level is Windows Server 2016.

    You create a password settings object (PSO) named **PSO-Finance** that sets a minimum password length of 14 characters, with a precedence of 20. You apply PSO-Finance to a group named **DL-Finance**, a domain local security group that contains the user accounts of the finance department.

    When you run `Get-ADUserResultantPasswordPolicy` for a member of DL-Finance, the cmdlet returns no PSO, and the users can still set 8-character passwords.

    You need PSO-Finance to apply to the finance users through group membership. What should you do?
  fr: |
    Votre réseau contient un domaine Active Directory nommé contoso.com. Le niveau fonctionnel du domaine est Windows Server 2016.

    Vous créez un objet de paramètres de mot de passe (PSO) nommé **PSO-Finance** qui impose une longueur minimale de 14 caractères, avec une priorité (precedence) de 20. Vous appliquez PSO-Finance à un groupe nommé **DL-Finance**, un groupe de sécurité local de domaine qui contient les comptes d'utilisateur du service financier.

    Quand vous exécutez `Get-ADUserResultantPasswordPolicy` pour un membre de DL-Finance, l'applet de commande ne renvoie aucun PSO, et les utilisateurs peuvent toujours définir des mots de passe de 8 caractères.

    Vous devez faire en sorte que PSO-Finance s'applique aux utilisateurs du service financier par l'appartenance à un groupe. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the precedence of PSO-Finance to 1.", fr: "Remplacer la priorité de PSO-Finance par 1." } }
    - { id: b, text: { en: "Apply PSO-Finance to a global security group that contains the finance users.", fr: "Appliquer PSO-Finance à un groupe de sécurité global qui contient les utilisateurs du service financier." } }
    - { id: c, text: { en: "Apply PSO-Finance to the Finance OU that contains the finance users.", fr: "Appliquer PSO-Finance à l'UO Finance qui contient les utilisateurs du service financier." } }
    - { id: d, text: { en: "Raise the domain functional level to Windows Server 2025.", fr: "Élever le niveau fonctionnel du domaine à Windows Server 2025." } }
answer: { optionId: b }
explanation:
  correct:
    en: Fine-grained password policies apply only to user objects and global security groups. A PSO linked to a domain local group has no effect on its members, so the users fall back to the domain password policy. Applying the PSO to a global security group that contains the users makes it their resultant policy.
    fr: "Les stratégies de mot de passe affinées ne s'appliquent qu'aux objets utilisateur et aux groupes de sécurité globaux. Un PSO lié à un groupe local de domaine n'a aucun effet sur ses membres : les utilisateurs reçoivent donc la stratégie de mot de passe du domaine. Appliquer le PSO à un groupe de sécurité global qui contient les utilisateurs en fait leur stratégie résultante."
  options:
    a: { en: "Precedence only arbitrates between PSOs that apply to a user; here no PSO applies at all.", fr: "La priorité ne fait que départager les PSO qui s'appliquent à un utilisateur ; ici, aucun PSO ne s'applique." }
    c: { en: "A PSO cannot be applied to an OU; to target an OU, you use a shadow group.", fr: "Un PSO ne peut pas être appliqué à une UO ; pour cibler une UO, on utilise un groupe fantôme (shadow group)." }
    d: { en: "Fine-grained password policies already work at the current domain functional level.", fr: "Les stratégies de mot de passe affinées fonctionnent déjà au niveau fonctionnel actuel du domaine." }
references:
