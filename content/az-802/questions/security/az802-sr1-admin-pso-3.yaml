id: az802-sr1-admin-pso-3
objective: "6.2.1"
type: series_yesno
series: az802-sr1-admin-pso
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You create a password settings object and apply it directly to the Admins OU.
  fr: Vous créez un objet de paramètres de mot de passe et l'appliquez directement à l'UO Admins.
body:
  solution:
    en: |
      In Active Directory Administrative Center, you create a password settings object (PSO) in the **Password Settings Container** with a precedence of 10, a minimum password length of 15, and an account lockout threshold of 5. You apply the PSO directly to the Admins OU.
    fr: |
      Dans le Centre d'administration Active Directory, vous créez un objet de paramètres de mot de passe (PSO) dans le conteneur **Password Settings Container** avec une priorité de 10, une longueur minimale de mot de passe de 15 et un seuil de verrouillage de compte de 5. Vous appliquez le PSO directement à l'UO Admins.
answer: { value: false }
explanation:
  correct:
    en: |
      The values of the PSO match the requirement, but a fine-grained password policy cannot be applied to an OU directly: it applies only to user objects and global security groups. To target the accounts of an OU, you apply the PSO to a group that contains them, such as IT-Admins (a shadow group).
    fr: |
      Les valeurs du PSO correspondent à l'exigence, mais une stratégie de mot de passe affinée ne peut pas être appliquée directement à une UO : elle s'applique uniquement aux objets utilisateur et aux groupes de sécurité globaux. Pour cibler les comptes d'une UO, vous appliquez le PSO à un groupe qui les contient, comme IT-Admins (groupe fantôme, ou shadow group).
references:
  - title: Password Policy
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/password-policy
