id: az802-cs2c-password-protection
objective: "6.2.2"
type: ordering
caseStudy: az802-cs2c-graphic-design-institute
difficulty: 2
status: draft
stem:
  en: |
    You need to deploy Microsoft Entra Password Protection to meet the passwords requirement.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez déployer la protection par mot de passe Microsoft Entra pour satisfaire l'exigence relative aux mots de passe.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: proxy, text: { en: "Install the Password Protection proxy service on MGMT1.", fr: "Installer le service proxy de protection par mot de passe sur MGMT1." } }
    - { id: regproxy, text: { en: "Run `Register-AzureADPasswordProtectionProxy` on MGMT1.", fr: "Exécuter `Register-AzureADPasswordProtectionProxy` sur MGMT1." } }
    - { id: regforest, text: { en: "Run `Register-AzureADPasswordProtectionForest` on MGMT1.", fr: "Exécuter `Register-AzureADPasswordProtectionForest` sur MGMT1." } }
    - { id: agent, text: { en: "Install the DC agent on DC1 and DC2, and then restart them.", fr: "Installer l'agent DC sur DC1 et DC2, puis les redémarrer." } }
    - { id: proxydc, text: { en: "Install the Password Protection proxy service on DC1.", fr: "Installer le service proxy de protection par mot de passe sur DC1." } }
    - { id: rodc, text: { en: "Install the DC agent on RODC-LIB, and then restart it.", fr: "Installer l'agent DC sur RODC-LIB, puis le redémarrer." } }
answer:
  sequence: [ proxy, regproxy, regforest, agent ]
explanation:
  correct:
    en: |
      The proxy service runs on a member server with outbound HTTPS access, because the DC agents never talk to Microsoft Entra ID directly. You install the proxy, register it with the tenant, register the forest, and then install the DC agent on each writable DC. The DC agent loads a password filter, so every DC must restart after the installation. The policy starts in audit mode.
    fr: |
      Le service proxy s'exécute sur un serveur membre disposant d'un accès HTTPS sortant, car les agents DC ne communiquent jamais directement avec Microsoft Entra ID. Vous installez le proxy, vous l'inscrivez auprès du locataire, vous inscrivez la forêt, puis vous installez l'agent DC sur chaque contrôleur de domaine accessible en écriture. L'agent DC charge un filtre de mots de passe : chaque contrôleur de domaine doit redémarrer après l'installation. La stratégie démarre en mode audit.
  options:
    proxydc:
      en: |
        A proxy on a DC is supported only for testing, and DC1 would need internet access, which the requirement forbids.
      fr: |
        Un proxy sur un contrôleur de domaine n'est pris en charge que pour les tests, et DC1 aurait besoin d'un accès à Internet, ce que l'exigence interdit.
    rodc:
      en: |
        The DC agent must not be installed on an RODC; password changes are forwarded to the writable DCs, which validate them.
      fr: |
        L'agent DC ne doit pas être installé sur un RODC ; les changements de mot de passe sont transférés aux contrôleurs de domaine accessibles en écriture, qui les valident.
references:
  - title: Plan and deploy on-premises Microsoft Entra Password Protection
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-password-ban-bad-on-premises-deploy
