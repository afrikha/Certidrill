id: az802-6a-cg-remote-disable
objective: "6.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an AD DS domain named **contoso.com**. A GPO named **GPO-CG** is linked to an organizational unit that contains 30 member servers running Windows Server 2025. Credential Guard was explicitly disabled on these servers when they were deployed.

    You need to turn on Credential Guard on the servers by configuring GPO-CG. If an application compatibility issue appears later, administrators must be able to turn Credential Guard off again from GPO-CG without visiting the servers.

    In the Turn On Virtualization Based Security policy setting, which value should you select for Credential Guard Configuration?
  fr: |
    Votre réseau contient un domaine AD DS nommé **contoso.com**. Un objet de stratégie de groupe nommé **GPO-CG** est lié à une unité d'organisation qui contient 30 serveurs membres exécutant Windows Server 2025. Credential Guard a été explicitement désactivé sur ces serveurs lors de leur déploiement.

    Vous devez activer Credential Guard sur les serveurs en configurant GPO-CG. Si un problème de compatibilité d'application apparaît plus tard, les administrateurs doivent pouvoir désactiver de nouveau Credential Guard depuis GPO-CG sans se rendre devant les serveurs.

    Dans le paramètre de stratégie Turn On Virtualization Based Security, quelle valeur devez-vous sélectionner pour Credential Guard Configuration ?
body:
  options:
    - { id: a, text: Enabled with UEFI lock }
    - { id: b, text: Disabled }
    - { id: c, text: Enabled without lock }
    - { id: d, text: Not Configured }
answer:
  optionId: c
explanation:
  correct:
    en: "Enabled without lock turns on Credential Guard and keeps its configuration in the registry, so setting the policy to Disabled later turns it off remotely after a restart. Microsoft recommends this value when you need to be able to turn off Credential Guard remotely."
    fr: "Enabled without lock active Credential Guard et conserve sa configuration dans le Registre : définir plus tard la stratégie sur Disabled le désactive à distance après un redémarrage. Microsoft recommande cette valeur lorsque vous devez pouvoir désactiver Credential Guard à distance."
  options:
    a:
      en: "With UEFI lock, the configuration is stored in EFI firmware variables; turning it off requires a boot-time procedure with someone physically present to confirm the change."
      fr: "Avec le verrou UEFI, la configuration est stockée dans des variables du microprogramme EFI ; la désactivation nécessite une procédure au démarrage avec une personne physiquement présente pour confirmer la modification."
    b:
      en: "Disabled turns Credential Guard off; it doesn't meet the requirement to turn it on."
      fr: "Disabled désactive Credential Guard ; cela ne répond pas à l'exigence de l'activer."
    d:
      en: "The servers were explicitly disabled, so leaving the policy not configured doesn't turn Credential Guard on: an explicit setting overrides default enablement."
      fr: "Credential Guard a été explicitement désactivé sur ces serveurs : laisser la stratégie non configurée ne l'active pas, car un paramètre explicite prévaut sur l'activation par défaut."
references:
  - title: Configure Credential Guard
    url: https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/configure
