id: az802-6b-silo-tgt-order
objective: "6.2.5"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named contoso.com. The domain functional level is Windows Server 2016. All domain controllers run Windows Server 2022. No authentication policy or authentication policy silo exists.

    The Tier 0 administrators sign in with accounts that are members of a group named **Tier0-Admins**. You need the Kerberos TGTs issued to those accounts to be limited to 120 minutes. The restriction must be enforced, and it must not affect any other account.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Votre réseau contient un domaine Active Directory nommé contoso.com. Le niveau fonctionnel du domaine est Windows Server 2016. Tous les contrôleurs de domaine exécutent Windows Server 2022. Il n'existe aucune stratégie d'authentification ni aucun silo de stratégies d'authentification.

    Les administrateurs du niveau 0 se connectent avec des comptes membres d'un groupe nommé **Tier0-Admins**. Vous devez limiter à 120 minutes les TGT Kerberos émis pour ces comptes. La restriction doit être appliquée et ne doit concerner aucun autre compte.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: kdc, text: { en: "In the Default Domain Controllers Policy GPO, enable **KDC support for claims, compound authentication and Kerberos armoring**.", fr: "Dans le GPO Default Domain Controllers Policy, activer **KDC support for claims, compound authentication and Kerberos armoring**." } }
    - { id: pol, text: { en: "Run `New-ADAuthenticationPolicy -Name Tier0-Pol -UserTGTLifetimeMins 120 -Enforce`.", fr: "Exécuter `New-ADAuthenticationPolicy -Name Tier0-Pol -UserTGTLifetimeMins 120 -Enforce`." } }
    - { id: silo, text: { en: "Run `New-ADAuthenticationPolicySilo -Name Tier0-Silo -UserAuthenticationPolicy Tier0-Pol -Enforce`.", fr: "Exécuter `New-ADAuthenticationPolicySilo -Name Tier0-Silo -UserAuthenticationPolicy Tier0-Pol -Enforce`." } }
    - { id: assign, text: { en: "For each Tier 0 account, run `Grant-ADAuthenticationPolicySiloAccess` and `Set-ADAccountAuthenticationPolicySilo` with Tier0-Silo.", fr: "Pour chaque compte du niveau 0, exécuter `Grant-ADAuthenticationPolicySiloAccess` et `Set-ADAccountAuthenticationPolicySilo` avec Tier0-Silo." } }
    - { id: pu, text: { en: "Add the members of Tier0-Admins to the Protected Users group.", fr: "Ajouter les membres de Tier0-Admins au groupe Protected Users." } }
    - { id: dfl, text: { en: "Raise the domain functional level to Windows Server 2025.", fr: "Élever le niveau fonctionnel du domaine à Windows Server 2025." } }
    - { id: ddp, text: { en: "In the Default Domain Policy GPO, set **Maximum lifetime for user ticket** to 2 hours.", fr: "Dans le GPO Default Domain Policy, définir **Maximum lifetime for user ticket** sur 2 heures." } }
    - { id: pso, text: { en: "Create a password settings object and apply it to Tier0-Admins.", fr: "Créer un objet de paramètres de mot de passe et l'appliquer à Tier0-Admins." } }
answer:
  sequence: [ kdc, pol, silo, assign ]
explanation:
  correct:
    en: Authentication policies need the Windows Server 2012 R2 domain functional level, which is already met, and domain controllers that support claims, compound authentication and Kerberos armoring, enabled in a GPO that applies to all domain controllers. You then create the enforced policy with the user TGT lifetime, create the enforced silo that references it, and finally make each account a member of the silo and assign the silo to it. Without -Enforce, the policy and the silo would only audit.
    fr: "Les stratégies d'authentification exigent le niveau fonctionnel de domaine Windows Server 2012 R2, déjà atteint, et des contrôleurs de domaine qui prennent en charge les revendications, l'authentification composée et le blindage Kerberos, activés dans un GPO qui s'applique à tous les contrôleurs de domaine. Vous créez ensuite la stratégie appliquée avec la durée de vie du TGT utilisateur, puis le silo appliqué qui la référence, et enfin vous rendez chaque compte membre du silo et le lui attribuez. Sans -Enforce, la stratégie et le silo se contenteraient d'auditer."
  options:
    pu: { en: "Protected Users sets a fixed four-hour TGT lifetime; it cannot set 120 minutes.", fr: "Protected Users impose une durée de vie fixe de quatre heures au TGT ; il ne permet pas de définir 120 minutes." }
    dfl: { en: "The current domain functional level already meets the requirement.", fr: "Le niveau fonctionnel actuel du domaine satisfait déjà le prérequis." }
    ddp: { en: "The domain Kerberos policy would change the ticket lifetime of every account in the domain.", fr: "La stratégie Kerberos du domaine modifierait la durée de vie des tickets de tous les comptes du domaine." }
    pso: { en: "A PSO controls password and lockout settings, not Kerberos tickets.", fr: "Un PSO contrôle les paramètres de mot de passe et de verrouillage, pas les tickets Kerberos." }
references:
  - title: Authentication Policies and Authentication Policy Silos
    url: https://learn.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/authentication-policies-and-authentication-policy-silos
  - title: New-ADAuthenticationPolicy (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/new-adauthenticationpolicy
