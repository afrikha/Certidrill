id: az802-6a-cg-default-state
objective: "6.1.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Your network contains an AD DS domain named **fabrikam.com**. You deploy the following servers. All of them run Windows Server 2025, meet the hardware requirements of Credential Guard unless otherwise stated, and receive no Credential Guard or virtualization-based security setting from any policy.

    | Server | Configuration |
    | --- | --- |
    | DC1 | Physical server, domain controller of fabrikam.com |
    | SRV1 | Physical server, member of fabrikam.com |
    | SRV2 | Physical server, member of a workgroup |
    | VM1 | Generation 1 virtual machine on a Hyper-V host that has an IOMMU, member of fabrikam.com |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine AD DS nommé **fabrikam.com**. Vous déployez les serveurs suivants. Tous exécutent Windows Server 2025, répondent à la configuration matérielle requise de Credential Guard sauf indication contraire et ne reçoivent aucun paramètre Credential Guard ou de sécurité basée sur la virtualisation d'une stratégie.

    | Serveur | Configuration |
    | --- | --- |
    | DC1 | Serveur physique, contrôleur de domaine de fabrikam.com |
    | SRV1 | Serveur physique, membre de fabrikam.com |
    | SRV2 | Serveur physique, membre d'un groupe de travail |
    | VM1 | Machine virtuelle de génération 1 sur un hôte Hyper-V doté d'une IOMMU, membre de fabrikam.com |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Credential Guard is enabled by default on SRV1, and you can turn it off later by using Group Policy without being physically present at the server.
        fr: Credential Guard est activé par défaut sur SRV1, et vous pouvez le désactiver ultérieurement par stratégie de groupe sans être physiquement présent devant le serveur.
    - id: s2
      text:
        en: Credential Guard is enabled by default on DC1 and SRV2.
        fr: Credential Guard est activé par défaut sur DC1 et SRV2.
    - id: s3
      text:
        en: You can enable Credential Guard on VM1 by configuring the Turn On Virtualization Based Security policy setting in VM1.
        fr: Vous pouvez activer Credential Guard sur VM1 en configurant le paramètre de stratégie Turn On Virtualization Based Security dans VM1.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Starting with Windows Server 2025, Credential Guard is enabled by default on domain-joined servers that aren't domain controllers and that meet the requirements. Default enablement doesn't use UEFI lock, so it can be turned off remotely. Credential Guard isn't supported on generation 1 virtual machines."
    fr: "À partir de Windows Server 2025, Credential Guard est activé par défaut sur les serveurs joints à un domaine qui ne sont pas des contrôleurs de domaine et qui répondent à la configuration requise. L'activation par défaut n'utilise pas le verrou UEFI : elle peut donc être désactivée à distance. Credential Guard n'est pas pris en charge sur les machines virtuelles de génération 1."
  options:
    s2:
      en: "Default enablement excludes domain controllers and applies only to domain-joined systems, so neither DC1 nor the workgroup server SRV2 qualifies."
      fr: "L'activation par défaut exclut les contrôleurs de domaine et ne concerne que les systèmes joints à un domaine : ni DC1 ni le serveur de groupe de travail SRV2 ne sont concernés."
    s3:
      en: "A Hyper-V virtual machine must be generation 2 and run on a host with an IOMMU; a policy setting inside a generation 1 VM can't make Credential Guard run."
      fr: "Une machine virtuelle Hyper-V doit être de génération 2 et s'exécuter sur un hôte doté d'une IOMMU ; un paramètre de stratégie dans une machine virtuelle de génération 1 ne peut pas faire fonctionner Credential Guard."
references:
  - title: Credential Guard overview
    url: https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/
