id: az802-6b-uac-options-dd
objective: "6.2.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named contoso.com. You review the user accounts shown in the following table.

    | Account | Use | Requirement |
    | --- | --- | --- |
    | adm-nora | Domain administration | A service on APP1, which is trusted for delegation, must never be able to impersonate the account. |
    | adm-omar | Domain administration | Interactive sign-in must use a certificate on a smart card, never a typed password. |
    | u-claire | Standard user | A security scan reports that the account's password can be recovered from Active Directory as plaintext. |
    | svc-report | Application account | The account must obtain Kerberos tickets encrypted with AES-256 after RC4 is disabled. |

    Which account option should you select or clear for each account? To answer, drag the appropriate options to the correct accounts. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine Active Directory nommé contoso.com. Vous examinez les comptes d'utilisateur présentés dans le tableau suivant.

    | Compte | Usage | Exigence |
    | --- | --- | --- |
    | adm-nora | Administration du domaine | Un service d'APP1, approuvé pour la délégation, ne doit jamais pouvoir emprunter l'identité du compte. |
    | adm-omar | Administration du domaine | La connexion interactive doit utiliser un certificat sur carte à puce, jamais un mot de passe saisi. |
    | u-claire | Utilisateur standard | Une analyse de sécurité signale que le mot de passe du compte peut être récupéré en clair depuis Active Directory. |
    | svc-report | Compte d'application | Le compte doit obtenir des tickets Kerberos chiffrés en AES-256 une fois RC4 désactivé. |

    Quelle option de compte devez-vous sélectionner ou désélectionner pour chaque compte ? Pour répondre, faites glisser les options appropriées vers les comptes correspondants. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sensitive, text: Account is sensitive and cannot be delegated }
    - { id: smartcard, text: Smart card is required for interactive logon }
    - { id: reversible, text: Store password using reversible encryption }
    - { id: aes, text: This account supports Kerberos AES 256 bit encryption }
    - { id: preauth, text: Do not require Kerberos preauthentication }
    - { id: never, text: Password never expires }
  targets:
    - { id: nora, text: adm-nora }
    - { id: omar, text: adm-omar }
    - { id: claire, text: u-claire }
    - { id: report, text: svc-report }
answer:
  mapping: { nora: sensitive, omar: smartcard, claire: reversible, report: aes }
explanation:
  correct:
    en: Account is sensitive and cannot be delegated prevents any service, even one trusted for delegation, from using the account's security context. Smart card is required for interactive logon forces certificate-based sign-in. A password stored with reversible encryption is equivalent to a plaintext copy, so you clear that option and reset the password. This account supports Kerberos AES 256 bit encryption lets the KDC issue AES-256 tickets for the account once RC4 is no longer allowed.
    fr: "Account is sensitive and cannot be delegated empêche tout service, même approuvé pour la délégation, d'utiliser le contexte de sécurité du compte. Smart card is required for interactive logon impose la connexion par certificat. Un mot de passe stocké avec un chiffrement réversible équivaut à une copie en clair : vous désélectionnez cette option et réinitialisez le mot de passe. This account supports Kerberos AES 256 bit encryption permet au KDC d'émettre des tickets AES-256 pour le compte quand RC4 n'est plus autorisé."
  options:
    preauth: { en: "Not requiring preauthentication exposes the account to offline cracking of the AS-REP; it meets none of the requirements.", fr: "Ne pas exiger la pré-authentification expose le compte au cassage hors ligne de l'AS-REP ; cela ne satisfait aucune exigence." }
    never: { en: "Password never expires only stops password expiration; it meets none of the requirements.", fr: "Password never expires empêche seulement l'expiration du mot de passe ; cela ne satisfait aucune exigence." }
references:
  - title: Set-ADAccountControl (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/set-adaccountcontrol
