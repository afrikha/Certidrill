id: az802-6b-epp-proxy-host
objective: "6.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your network contains an Active Directory forest named contoso.com that has one domain. The domain contains the servers shown in the following table.

    | Name | Role | Internet access |
    | --- | --- | --- |
    | DC1, DC2 | Writable domain controllers | None |
    | RODC1 | Read-only domain controller | Outbound HTTPS |
    | MGMT1 | Member server | Outbound HTTPS |

    You plan to deploy Microsoft Entra Password Protection. The domain controllers must not be given internet access.

    On which server should you install the Microsoft Entra Password Protection proxy service?
  fr: |
    Votre réseau contient une forêt Active Directory nommée contoso.com qui comporte un seul domaine. Le domaine contient les serveurs présentés dans le tableau suivant.

    | Nom | Rôle | Accès Internet |
    | --- | --- | --- |
    | DC1, DC2 | Contrôleurs de domaine accessibles en écriture | Aucun |
    | RODC1 | Contrôleur de domaine en lecture seule | HTTPS sortant |
    | MGMT1 | Serveur membre | HTTPS sortant |

    Vous prévoyez de déployer la protection par mot de passe Microsoft Entra. Les contrôleurs de domaine ne doivent pas recevoir d'accès à Internet.

    Sur quel serveur devez-vous installer le service proxy de protection par mot de passe Microsoft Entra ?
body:
  options:
    - { id: a, text: DC1 }
    - { id: b, text: DC2 }
    - { id: c, text: RODC1 }
    - { id: d, text: MGMT1 }
answer: { optionId: d }
explanation:
  correct:
    en: The proxy service runs on any domain-joined computer of the forest and needs outbound HTTPS to Microsoft Entra ID. MGMT1 is a member server that already has that access, so the domain controllers keep no internet connectivity; for redundancy, Microsoft recommends at least two proxy servers per forest.
    fr: Le service proxy s'exécute sur n'importe quel ordinateur joint au domaine de la forêt et a besoin d'un accès HTTPS sortant vers Microsoft Entra ID. MGMT1 est un serveur membre qui dispose déjà de cet accès, et les contrôleurs de domaine restent sans connectivité Internet ; pour la redondance, Microsoft recommande au moins deux serveurs proxy par forêt.
  options:
    a: { en: "A proxy on a domain controller is supported for testing only, and it would require internet access on that domain controller.", fr: "Un proxy sur un contrôleur de domaine n'est pris en charge que pour des tests, et il exigerait un accès Internet sur ce contrôleur de domaine." }
    b: { en: "A proxy on a domain controller is supported for testing only, and it would require internet access on that domain controller.", fr: "Un proxy sur un contrôleur de domaine n'est pris en charge que pour des tests, et il exigerait un accès Internet sur ce contrôleur de domaine." }
    c: { en: "Running the proxy service on a read-only domain controller is not supported.", fr: "L'exécution du service proxy sur un contrôleur de domaine en lecture seule n'est pas prise en charge." }
references:
  - title: Plan and deploy on-premises Microsoft Entra Password Protection
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-password-ban-bad-on-premises-deploy
