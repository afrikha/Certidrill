id: az802-6b-auth-settings-dd
objective: "6.2.9"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named northwindtraders.com. You are creating a GPO to harden authentication on the domain controllers and the member computers.

    Which Security Options setting should you configure for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine Active Directory nommé northwindtraders.com. Vous créez un GPO pour durcir l'authentification sur les contrôleurs de domaine et les ordinateurs membres.

    Quel paramètre des options de sécurité devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: signing, text: "Domain controller: LDAP server signing requirements" }
    - { id: cbt, text: "Domain controller: LDAP server channel binding token requirements" }
    - { id: enctypes, text: "Network security: Configure encryption types allowed for Kerberos" }
    - { id: lmlevel, text: "Network security: LAN Manager authentication level" }
    - { id: ntlmdeny, text: "Network security: Restrict NTLM: NTLM authentication in this domain" }
  targets:
    - id: t1
      text: { en: "Domain controllers must reject LDAP simple binds sent over TCP 389 without TLS.", fr: "Les contrôleurs de domaine doivent rejeter les liaisons LDAP simples envoyées sur TCP 389 sans TLS." }
    - id: t2
      text: { en: "Computers must use only AES128 and AES256 for Kerberos, never DES or RC4.", fr: "Les ordinateurs ne doivent utiliser qu'AES128 et AES256 pour Kerberos, jamais DES ni RC4." }
    - id: t3
      text: { en: "Domain controllers must reject LDAPS binds from clients that do not send channel binding tokens.", fr: "Les contrôleurs de domaine doivent rejeter les liaisons LDAPS des clients qui n'envoient pas de jetons de liaison de canal." }
answer:
  mapping: { t1: signing, t2: enctypes, t3: cbt }
explanation:
  correct:
    en: When LDAP server signing requirements is set to Require signature, the domain controller rejects LDAP simple binds that do not use SSL/TLS on TCP 389. Configure encryption types allowed for Kerberos lists the only encryption types a computer may use; a type that is not selected is not allowed. LDAP server channel binding token requirements set to Always makes domain controllers reject LDAP over TLS binds that carry no channel binding token, which protects them against relay attacks.
    fr: "Quand LDAP server signing requirements est défini sur Require signature, le contrôleur de domaine rejette les liaisons LDAP simples qui n'utilisent pas SSL/TLS sur TCP 389. Configure encryption types allowed for Kerberos liste les seuls types de chiffrement qu'un ordinateur peut utiliser ; un type non sélectionné n'est pas autorisé. LDAP server channel binding token requirements défini sur Always fait rejeter par les contrôleurs de domaine les liaisons LDAP sur TLS qui ne portent pas de jeton de liaison de canal, ce qui les protège contre les attaques par relais."
  options:
    lmlevel: { en: "The LAN Manager authentication level controls which LM and NTLM variants are sent and accepted; it does not affect LDAP or Kerberos.", fr: "Le niveau d'authentification LAN Manager contrôle les variantes LM et NTLM envoyées et acceptées ; il n'affecte ni LDAP ni Kerberos." }
    ntlmdeny: { en: "This setting blocks NTLM pass-through authentication on the domain controllers; it does not affect LDAP binds or Kerberos encryption types.", fr: "Ce paramètre bloque l'authentification NTLM directe sur les contrôleurs de domaine ; il n'affecte ni les liaisons LDAP ni les types de chiffrement Kerberos." }
references:
  - title: "Domain controller: LDAP server signing requirements"
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/domain-controller-ldap-server-signing-requirements
  - title: "Network security: Configure encryption types allowed for Kerberos"
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/network-security-configure-encryption-types-allowed-for-kerberos
