id: az802-6a-ep-audit-child
objective: "6.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a server named **Server1** that runs Windows Server 2025. Server1 hosts a line-of-business application installed in **C:\Apps\Lob\lob.exe**.

    The security team wants exploit protection to stop lob.exe from creating child processes. Before the mitigation is enforced, you must identify whether lob.exe starts child processes during normal operation. The application must keep working without any change in behavior during the evaluation.

    Which command should you run on Server1?
  fr: |
    Vous disposez d'un serveur nommé **Server1** qui exécute Windows Server 2025. Server1 héberge une application métier installée dans **C:\Apps\Lob\lob.exe**.

    L'équipe de sécurité souhaite que la protection contre les attaques (exploit protection) empêche lob.exe de créer des processus enfants. Avant que l'atténuation soit appliquée, vous devez déterminer si lob.exe démarre des processus enfants pendant son fonctionnement normal. L'application doit continuer de fonctionner sans aucun changement de comportement pendant l'évaluation.

    Quelle commande devez-vous exécuter sur Server1 ?
body:
  options:
    - { id: a, text: "Set-ProcessMitigation -Name C:\\Apps\\Lob\\lob.exe -Enable DisallowChildProcessCreation" }
    - { id: b, text: "Set-ProcessMitigation -Name C:\\Apps\\Lob\\lob.exe -Enable AuditChildProcess" }
    - { id: c, text: "Set-ProcessMitigation -Name C:\\Apps\\Lob\\lob.exe -Enable AuditDynamicCode" }
    - { id: d, text: "Set-ProcessMitigation -System -Enable DisallowChildProcessCreation" }
answer:
  optionId: b
explanation:
  correct:
    en: "Don't allow child processes is an app-level mitigation that supports audit mode. Enabling AuditChildProcess for lob.exe only records the child process creations that the mitigation would block, in the Security-Mitigations event log, without blocking anything. You can then enforce DisallowChildProcessCreation once the events show it is safe."
    fr: "Don't allow child processes est une atténuation de niveau application qui prend en charge le mode audit. Activer AuditChildProcess pour lob.exe enregistre seulement, dans le journal d'événements Security-Mitigations, les créations de processus enfants que l'atténuation bloquerait, sans rien bloquer. Vous pouvez ensuite appliquer DisallowChildProcessCreation une fois que les événements montrent que c'est sans risque."
  options:
    a:
      en: "DisallowChildProcessCreation enforces the mitigation and blocks child processes immediately, which changes the behavior of the application during the evaluation."
      fr: "DisallowChildProcessCreation applique l'atténuation et bloque immédiatement les processus enfants, ce qui modifie le comportement de l'application pendant l'évaluation."
    c:
      en: "AuditDynamicCode audits Arbitrary code guard (ACG), which concerns dynamically generated code, not the creation of child processes."
      fr: "AuditDynamicCode audite Arbitrary code guard (ACG), qui concerne le code généré dynamiquement, pas la création de processus enfants."
    d:
      en: "Don't allow child processes is an app-only mitigation that can't be set at the system level, and the command would enforce it rather than audit it."
      fr: "Don't allow child processes est une atténuation propre aux applications qui ne peut pas être définie au niveau du système, et la commande l'appliquerait au lieu de l'auditer."
references:
  - title: Customize exploit protection
    url: https://learn.microsoft.com/en-us/defender-endpoint/customize-exploit-protection
  - title: Evaluate exploit protection
    url: https://learn.microsoft.com/en-us/defender-endpoint/evaluate-exploit-protection
