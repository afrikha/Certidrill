id: az802-6a-laps-policy-root
objective: "6.1.7"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Your network contains an AD DS domain named **tailspin.com**. A member server named **Server10** runs Windows Server 2025. The legacy Microsoft LAPS client isn't installed on Server10.

    The following GPOs apply to Server10:

    - **GPO-LegacyLAPS** configures the legacy Microsoft LAPS settings: password length 20, password age 30 days.
    - **GPO-WinLAPS** configures only two Windows LAPS settings under **System > LAPS**: **BackupDirectory** set to Active Directory and **PasswordAgeDays** set to 21.

    How many characters will the passwords that Windows LAPS generates for Server10 contain?
  fr: |
    Votre réseau contient un domaine AD DS nommé **tailspin.com**. Un serveur membre nommé **Server10** exécute Windows Server 2025. Le client Microsoft LAPS hérité n'est pas installé sur Server10.

    Les objets de stratégie de groupe suivants s'appliquent à Server10 :

    - **GPO-LegacyLAPS** configure les paramètres de Microsoft LAPS hérité : longueur de mot de passe 20, âge du mot de passe 30 jours.
    - **GPO-WinLAPS** configure seulement deux paramètres Windows LAPS sous **System > LAPS** : **BackupDirectory** défini sur Active Directory et **PasswordAgeDays** défini sur 21.

    Combien de caractères contiendront les mots de passe que Windows LAPS génère pour Server10 ?
body:
  options:
    - { id: a, text: "8" }
    - { id: b, text: "14" }
    - { id: c, text: "20" }
    - { id: d, text: "64" }
answer:
  optionId: b
explanation:
  correct:
    en: "Windows LAPS reads its policy roots in order (CSP, Windows LAPS Group Policy, local configuration, legacy Microsoft LAPS) and uses the first root that contains at least one setting. GPO-WinLAPS populates the Windows LAPS Group Policy root, so the legacy settings are ignored, and the settings missing from that root, such as PasswordLength, take their default value of 14. Settings are never merged across roots."
    fr: "Windows LAPS lit ses racines de stratégie dans l'ordre (CSP, stratégie de groupe Windows LAPS, configuration locale, Microsoft LAPS hérité) et utilise la première racine qui contient au moins un paramètre. GPO-WinLAPS renseigne la racine de stratégie de groupe Windows LAPS : les paramètres hérités sont ignorés, et les paramètres absents de cette racine, comme PasswordLength, prennent leur valeur par défaut, 14. Les paramètres ne sont jamais fusionnés entre racines."
  options:
    a:
      en: "8 is the minimum allowed value of PasswordLength, not its default."
      fr: "8 est la valeur minimale autorisée de PasswordLength, pas sa valeur par défaut."
    c:
      en: "The legacy Microsoft LAPS root is used only when no higher-priority root contains a setting; settings aren't inherited from it."
      fr: "La racine Microsoft LAPS hérité n'est utilisée que si aucune racine prioritaire ne contient de paramètre ; aucun paramètre n'en est hérité."
    d:
      en: "64 is the maximum allowed value of PasswordLength, not its default."
      fr: "64 est la valeur maximale autorisée de PasswordLength, pas sa valeur par défaut."
references:
  - title: Configure Policy Settings for Windows LAPS
    url: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-management-policy-settings
