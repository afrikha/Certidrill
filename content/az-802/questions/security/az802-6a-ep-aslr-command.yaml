id: az802-6a-ep-aslr-command
objective: "6.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a server named **Server3** that runs Windows Server 2025.

    You need to configure exploit protection on Server3 to force the relocation of all images (Mandatory ASLR) for every process, and then display the resulting system-level configuration.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur nommé **Server3** qui exécute Windows Server 2025.

    Vous devez configurer la protection contre les attaques (exploit protection) sur Server3 pour forcer la relocalisation de toutes les images (Mandatory ASLR) pour chaque processus, puis afficher la configuration de niveau système obtenue.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Set-ProcessMitigation [[scope]] -Enable [[mit]]
    Get-ProcessMitigation [[get]]
  slots:
    - id: scope
      options:
        - { id: sys, text: -System }
        - { id: name, text: "-Name svchost.exe" }
        - { id: pol, text: -PolicyFilePath }
    - id: mit
      options:
        - { id: bottom, text: BottomUp }
        - { id: force, text: ForceRelocateImages }
        - { id: high, text: HighEntropy }
        - { id: sehop, text: SEHOP }
    - id: get
      options:
        - { id: gsys, text: -System }
        - { id: greg, text: "-RegistryConfigFilePath C:\\ep.xml" }
        - { id: gname, text: "-Name Server3" }
answer:
  values: { scope: sys, mit: force, get: gsys }
explanation:
  correct:
    en: "The -System scope applies a mitigation to every process on the server. In the ProcessMitigation cmdlets, Force randomization for images (Mandatory ASLR) is named ForceRelocateImages. Get-ProcessMitigation -System displays the system-level settings. A system-level change takes effect after a restart."
    fr: "L'étendue -System applique une atténuation à tous les processus du serveur. Dans les applets de commande ProcessMitigation, Force randomization for images (Mandatory ASLR) se nomme ForceRelocateImages. Get-ProcessMitigation -System affiche les paramètres de niveau système. Une modification de niveau système prend effet après un redémarrage."
  options:
    bottom:
      en: "BottomUp is Randomize memory allocations (Bottom-up ASLR), a different mitigation."
      fr: "BottomUp correspond à Randomize memory allocations (Bottom-up ASLR), une autre atténuation."
    high:
      en: "HighEntropy is an option of Bottom-up ASLR, not Mandatory ASLR."
      fr: "HighEntropy est une option de Bottom-up ASLR, pas de Mandatory ASLR."
    sehop:
      en: "SEHOP validates exception chains; it doesn't relocate images."
      fr: "SEHOP valide les chaînes d'exceptions ; il ne relocalise pas les images."
    greg:
      en: "-RegistryConfigFilePath exports the configuration to an XML file instead of displaying it."
      fr: "-RegistryConfigFilePath exporte la configuration dans un fichier XML au lieu de l'afficher."
references:
  - title: Customize exploit protection
    url: https://learn.microsoft.com/en-us/defender-endpoint/customize-exploit-protection
  - title: Enable exploit protection in Windows
    url: https://learn.microsoft.com/en-us/defender-endpoint/enable-exploit-protection
