id: az802-6b-pu-offline-logon
objective: "6.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named contoso.com. The domain functional level is Windows Server 2016. All computers run Windows 11 or Windows Server 2022.

    An administrator named **adm-ravi** uses a laptop named **LT07**. Yesterday, you added adm-ravi to the **Protected Users** group. Today, adm-ravi signs in to LT07 successfully at the office. In the evening, at home and without a connection to the corporate network, adm-ravi can no longer sign in to LT07 with his domain account. He could do so before he was added to the group.

    What is the cause of the issue?
  fr: |
    Votre réseau contient un domaine Active Directory nommé contoso.com. Le niveau fonctionnel du domaine est Windows Server 2016. Tous les ordinateurs exécutent Windows 11 ou Windows Server 2022.

    Un administrateur nommé **adm-ravi** utilise un ordinateur portable nommé **LT07**. Hier, vous avez ajouté adm-ravi au groupe **Protected Users**. Aujourd'hui, adm-ravi se connecte à LT07 au bureau sans problème. Le soir, chez lui et sans connexion au réseau de l'entreprise, adm-ravi ne parvient plus à se connecter à LT07 avec son compte de domaine. Il le pouvait avant d'être ajouté au groupe.

    Quelle est la cause du problème ?
body:
  options:
    - { id: a, text: { en: "The Kerberos TGT of adm-ravi expired after four hours and cannot be renewed.", fr: "Le TGT Kerberos d'adm-ravi a expiré au bout de quatre heures et ne peut pas être renouvelé." } }
    - { id: b, text: { en: "The computer account of LT07 must also be a member of Protected Users.", fr: "Le compte d'ordinateur de LT07 doit lui aussi être membre de Protected Users." } }
    - { id: c, text: { en: "LT07 no longer creates a cached verifier for adm-ravi, so offline sign-in is not supported.", fr: "LT07 ne crée plus de vérificateur mis en cache pour adm-ravi : l'ouverture de session hors connexion n'est donc pas prise en charge." } }
    - { id: d, text: { en: "The domain functional level must be raised to Windows Server 2025 for Protected Users members to sign in offline.", fr: "Le niveau fonctionnel du domaine doit être élevé à Windows Server 2025 pour que les membres de Protected Users puissent se connecter hors connexion." } }
answer: { optionId: c }
explanation:
  correct:
    en: For a member of Protected Users, the device does not create a cached verifier at sign-in or unlock, so member computers no longer support offline sign-in. Without a domain controller, LT07 has nothing to validate adm-ravi's credentials against. This is by design; accounts that need offline sign-in, such as on laptops, must be considered before you add them to the group.
    fr: "Pour un membre de Protected Users, l'appareil ne crée pas de vérificateur mis en cache à la connexion ou au déverrouillage : les ordinateurs membres ne prennent donc plus en charge l'ouverture de session hors connexion. Sans contrôleur de domaine, LT07 n'a rien pour valider les informations d'identification d'adm-ravi. C'est le comportement prévu ; les comptes qui ont besoin de se connecter hors connexion, par exemple sur des portables, doivent être étudiés avant leur ajout au groupe."
  options:
    a: { en: "The four-hour, non-renewable TGT limits access to network resources; it is not used to validate an offline sign-in.", fr: "Le TGT de quatre heures non renouvelable limite l'accès aux ressources réseau ; il ne sert pas à valider une ouverture de session hors connexion." }
    b: { en: "Computer accounts must never be added to Protected Users; the protections apply to the user account.", fr: "Les comptes d'ordinateur ne doivent jamais être ajoutés à Protected Users ; les protections s'appliquent au compte d'utilisateur." }
    d: { en: "The domain functional level is already above the Windows Server 2012 R2 requirement, and no level re-enables offline sign-in for members.", fr: "Le niveau fonctionnel du domaine dépasse déjà le prérequis Windows Server 2012 R2, et aucun niveau ne réactive l'ouverture de session hors connexion pour les membres." }
references:
  - title: Protected Users security group
    url: https://learn.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/protected-users-security-group
