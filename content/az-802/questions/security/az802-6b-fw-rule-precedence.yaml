id: az802-6b-fw-rule-precedence
objective: "6.1.9"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A server named **SQL1** runs Windows Server 2025 and is joined to the contoso.com domain. The Domain profile is active. A connection security rule deployed by Group Policy requests IPsec authentication with Kerberos (computer) for all inbound and outbound traffic.

    The following table shows all the inbound firewall rules on SQL1 that match TCP port 1433. The computer account of **APP1** (10.20.7.21) is a member of the **GG-SqlClients** group. No other rule matches TCP port 1433.

    Answer each prompt by selecting the rule that determines the outcome of the connection.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur nommé **SQL1** exécute Windows Server 2025 et est joint au domaine contoso.com. Le profil Domaine est actif. Une règle de sécurité de connexion déployée par stratégie de groupe demande l'authentification IPsec par Kerberos (ordinateur) pour tout le trafic entrant et sortant.

    Le tableau suivant présente toutes les règles de pare-feu entrantes de SQL1 qui correspondent au port TCP 1433. Le compte d'ordinateur d'**APP1** (10.20.7.21) est membre du groupe **GG-SqlClients**. Aucune autre règle ne correspond au port TCP 1433.

    Répondez à chaque consigne en sélectionnant la règle qui détermine le résultat de la connexion.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "A connection to TCP 1433 from 10.20.5.10, a computer that is not a domain member and cannot authenticate by using IPsec", fr: "Une connexion vers TCP 1433 depuis 10.20.5.10, un ordinateur qui n'est pas membre du domaine et ne peut pas s'authentifier avec IPsec" }
    - id: p2
      text: { en: "A connection to TCP 1433 from APP1, authenticated by IPsec", fr: "Une connexion vers TCP 1433 depuis APP1, authentifiée par IPsec" }
  grid:
    caption: { en: "Inbound rules on SQL1 (TCP 1433)", fr: "Règles entrantes de SQL1 (TCP 1433)" }
    header: [{ en: Name, fr: Nom }, Action, { en: "Remote address", fr: "Adresse distante" }, { en: "Additional settings", fr: "Paramètres supplémentaires" }]
    rows:
      - [{ text: Allow-SQL-All, area: r1 }, { text: { en: "Allow the connection", fr: "Autoriser la connexion" } }, { text: Any }, { text: { en: "None", fr: "Aucun" } }]
      - [{ text: Block-SQL-Lab, area: r2 }, { text: { en: "Block the connection", fr: "Bloquer la connexion" } }, { text: 10.20.0.0/16 }, { text: { en: "None", fr: "Aucun" } }]
      - [{ text: Allow-SQL-Host, area: r3 }, { text: { en: "Allow the connection", fr: "Autoriser la connexion" } }, { text: 10.20.5.10 }, { text: { en: "None", fr: "Aucun" } }]
      - [{ text: Allow-SQL-Secure, area: r4 }, { text: { en: "Allow the connection if it is secure", fr: "Autoriser la connexion si elle est sécurisée" } }, { text: Any }, { text: { en: "Require authentication; Override block rules; Authorized computers: GG-SqlClients", fr: "Exiger l'authentification ; Remplacer les règles de blocage ; Ordinateurs autorisés : GG-SqlClients" } }]
answer:
  values: { p1: r2, p2: r4 }
explanation:
  correct:
    en: Explicit block rules take precedence over conflicting allow rules, even an allow rule that is more specific, such as Allow-SQL-Host for the single address 10.20.5.10. The only rule that wins over a block rule is an authenticated bypass rule, that is, an "allow if secure" rule with Override block rules and a list of authorized computers or users. APP1 is authenticated by IPsec and its computer account is in GG-SqlClients, so Allow-SQL-Secure lets its connection through despite Block-SQL-Lab.
    fr: "Les règles de blocage explicites l'emportent sur les règles d'autorisation en conflit, même sur une règle d'autorisation plus spécifique comme Allow-SQL-Host pour l'adresse unique 10.20.5.10. La seule règle qui l'emporte sur une règle de blocage est une règle de contournement authentifié, c'est-à-dire une règle « autoriser si sécurisée » avec l'option Remplacer les règles de blocage et une liste d'ordinateurs ou d'utilisateurs autorisés. APP1 est authentifié par IPsec et son compte d'ordinateur appartient à GG-SqlClients : Allow-SQL-Secure laisse donc passer sa connexion malgré Block-SQL-Lab."
  options:
    r1: { en: "Allow-SQL-All matches both connections, but it is a plain allow rule: it loses to the block rule for the 10.20.0.0/16 range.", fr: "Allow-SQL-All correspond aux deux connexions, mais c'est une simple règle d'autorisation : elle perd face à la règle de blocage de la plage 10.20.0.0/16." }
    r3: { en: "Specificity decides between rules of the same kind; it never lets an allow rule beat an explicit block rule.", fr: "La spécificité départage des règles de même nature ; elle ne permet jamais à une règle d'autorisation de l'emporter sur une règle de blocage explicite." }
references:
  - title: Windows Firewall Rules
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/rules
  - title: New-NetFirewallRule (NetSecurity)
    url: https://learn.microsoft.com/en-us/powershell/module/netsecurity/new-netfirewallrule
