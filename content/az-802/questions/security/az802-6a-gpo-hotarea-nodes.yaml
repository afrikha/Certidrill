id: az802-6a-gpo-hotarea-nodes
objective: "6.1.5"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an AD DS domain named **litware.com**. You are editing a GPO named **GPO-FileServers** that is linked to an organizational unit containing file servers that run Windows Server 2025. You need to meet the following requirements:

    - The local Administrators group of each file server must contain only the **FS-Admins** domain group. Any other member added manually must be removed when Group Policy refreshes.
    - Every access to a file or folder on the shared folders of the file servers must be audited with the **Detailed File Share** subcategory.

    Which node under **Computer Configuration > Policies > Windows Settings > Security Settings** should you use for each requirement? Answer each prompt by selecting the appropriate node.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine AD DS nommé **litware.com**. Vous modifiez un objet de stratégie de groupe nommé **GPO-FileServers** lié à une unité d'organisation qui contient des serveurs de fichiers exécutant Windows Server 2025. Vous devez répondre aux exigences suivantes :

    - Le groupe local Administrators de chaque serveur de fichiers doit contenir uniquement le groupe de domaine **FS-Admins**. Tout autre membre ajouté manuellement doit être supprimé lors de l'actualisation de la stratégie de groupe.
    - Chaque accès à un fichier ou à un dossier des dossiers partagés des serveurs de fichiers doit être audité avec la sous-catégorie **Detailed File Share**.

    Quel nœud sous **Computer Configuration > Policies > Windows Settings > Security Settings** devez-vous utiliser pour chaque exigence ? Répondez à chaque consigne en sélectionnant le nœud approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Membership of the local Administrators group", fr: "Appartenance au groupe local Administrators" }
    - id: p2
      text: { en: "Auditing with the Detailed File Share subcategory", fr: "Audit avec la sous-catégorie Detailed File Share" }
  grid:
    caption: Security Settings
    header: [{ en: Node, fr: Nœud }]
    rows:
      - [{ text: Account Policies, area: acct }]
      - [{ text: "Local Policies > Audit Policy", area: audit }]
      - [{ text: "Local Policies > User Rights Assignment", area: ura }]
      - [{ text: "Local Policies > Security Options", area: secopt }]
      - [{ text: Restricted Groups, area: rg }]
      - [{ text: System Services, area: svc }]
      - [{ text: Advanced Audit Policy Configuration, area: adv }]
answer:
  values: { p1: rg, p2: adv }
explanation:
  correct:
    en: "Restricted Groups enforces the membership of a local group such as Administrators: members that aren't listed in the policy are removed when the policy is applied. Detailed File Share is a subcategory of the Object Access category, and subcategories are configured only in Advanced Audit Policy Configuration; it logs event 5145 for each access to a shared file or folder."
    fr: "Restricted Groups impose l'appartenance d'un groupe local tel qu'Administrators : les membres qui ne figurent pas dans la stratégie sont supprimés lorsque la stratégie est appliquée. Detailed File Share est une sous-catégorie de la catégorie Object Access, et les sous-catégories se configurent uniquement dans Advanced Audit Policy Configuration ; elle enregistre l'événement 5145 pour chaque accès à un fichier ou dossier partagé."
  options:
    audit:
      en: "Local Policies > Audit Policy contains only the nine legacy audit categories; it can't select the Detailed File Share subcategory."
      fr: "Local Policies > Audit Policy ne contient que les neuf catégories d'audit héritées ; il ne permet pas de sélectionner la sous-catégorie Detailed File Share."
    ura:
      en: "User Rights Assignment grants rights such as Allow log on locally; it doesn't control group membership."
      fr: "User Rights Assignment accorde des droits tels qu'Allow log on locally ; il ne contrôle pas l'appartenance aux groupes."
references:
  - title: Audit Detailed File Share
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/audit-detailed-file-share
