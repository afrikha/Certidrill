id: az802-6b-fw-secure-rule-cmd
objective: "6.1.9"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A server named **SQL2** runs Windows Server 2022. A Group Policy Object already deploys a connection security rule that negotiates IPsec with Kerberos between SQL2 and the application servers.

    You need to create a Windows Firewall rule on SQL2 that admits connections to the SQL Server instance on TCP port 1433 only when the traffic is both authenticated and encrypted by IPsec.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur nommé **SQL2** exécute Windows Server 2022. Un objet de stratégie de groupe déploie déjà une règle de sécurité de connexion qui négocie IPsec avec Kerberos entre SQL2 et les serveurs d'applications.

    Vous devez créer sur SQL2 une règle du Pare-feu Windows qui n'admet les connexions vers l'instance SQL Server sur le port TCP 1433 que si le trafic est à la fois authentifié et chiffré par IPsec.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    New-NetFirewallRule -DisplayName "SQL 1433 secure" -Direction [[dir]] -Protocol TCP `
      [[port]] 1433 [[sec]] -Action Allow
  slots:
    - id: dir
      options:
        - { id: in, text: Inbound }
        - { id: out, text: Outbound }
    - id: port
      options:
        - { id: local, text: -LocalPort }
        - { id: remote, text: -RemotePort }
        - { id: icmp, text: -IcmpType }
    - id: sec
      options:
        - { id: reqreq, text: "-Authentication Required -Encryption Required" }
        - { id: noencap, text: "-Authentication NoEncap -Encryption NotRequired" }
        - { id: dynamic, text: "-Authentication Required -Encryption Dynamic" }
        - { id: override, text: "-OverrideBlockRules $true" }
answer:
  values: { dir: in, port: local, sec: reqreq }
explanation:
  correct:
    en: "The clients connect to SQL2, so the rule is inbound and the port 1433 is the local port on SQL2. `-Authentication Required -Encryption Required` creates an \"allow the connection if it is secure\" rule that admits only traffic protected by an IPsec security association that both authenticates and encrypts. The connection security rule negotiates IPsec; the firewall rule is what opens the port."
    fr: "Les clients se connectent à SQL2 : la règle est donc entrante et le port 1433 est le port local de SQL2. `-Authentication Required -Encryption Required` crée une règle « autoriser la connexion si elle est sécurisée » qui n'admet que le trafic protégé par une association de sécurité IPsec qui authentifie et chiffre. La règle de sécurité de connexion négocie IPsec ; c'est la règle de pare-feu qui ouvre le port."
  options:
    out: { en: "Outbound rules filter connections that SQL2 initiates, not connections to its SQL Server instance.", fr: "Les règles sortantes filtrent les connexions établies par SQL2, pas les connexions vers son instance SQL Server." }
    remote: { en: "For inbound traffic to SQL2, 1433 is the local port; the remote port is the client's ephemeral port.", fr: "Pour le trafic entrant vers SQL2, 1433 est le port local ; le port distant est le port éphémère du client." }
    icmp: { en: "IcmpType applies to ICMP traffic, not to a TCP port.", fr: "IcmpType s'applique au trafic ICMP, pas à un port TCP." }
    noencap: { en: "NoEncap authenticates the connection without IPsec encapsulation and without encryption.", fr: "NoEncap authentifie la connexion sans encapsulation IPsec et sans chiffrement." }
    dynamic: { en: "Dynamic lets the computers negotiate encryption, so it does not guarantee that the admitted traffic is encrypted.", fr: "Dynamic laisse les ordinateurs négocier le chiffrement : il ne garantit pas que le trafic admis est chiffré." }
    override: { en: "OverrideBlockRules turns an allow rule into an authenticated bypass rule that wins over block rules; on its own it does not require encryption.", fr: "OverrideBlockRules transforme une règle d'autorisation en règle de contournement authentifié qui l'emporte sur les règles de blocage ; à lui seul, il n'exige pas le chiffrement." }
references:
  - title: New-NetFirewallRule (NetSecurity)
    url: https://learn.microsoft.com/en-us/powershell/module/netsecurity/new-netfirewallrule
