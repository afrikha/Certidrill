id: az802-6a-ac-per-group
objective: "6.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a server named **RDS1** that runs Windows Server 2025 and the Remote Desktop Session Host role service. Two groups sign in to RDS1: **Finance-Users** and **Engineering-Users**.

    You need to allow members of Finance-Users to run only the accounting applications, while members of Engineering-Users can run only the engineering tools. Both sets of rules must apply on RDS1 at the same time.

    What should you use?
  fr: |
    Vous disposez d'un serveur nommé **RDS1** qui exécute Windows Server 2025 et le service de rôle Hôte de session Bureau à distance. Deux groupes se connectent à RDS1 : **Finance-Users** et **Engineering-Users**.

    Vous devez autoriser les membres de Finance-Users à exécuter uniquement les applications de comptabilité, tandis que les membres d'Engineering-Users ne peuvent exécuter que les outils d'ingénierie. Les deux ensembles de règles doivent s'appliquer simultanément sur RDS1.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "An App Control for Business base policy that contains both sets of rules", fr: "Une stratégie de base App Control for Business qui contient les deux ensembles de règles" } }
    - { id: b, text: { en: "An App Control for Business base policy and one supplemental policy per group", fr: "Une stratégie de base App Control for Business et une stratégie supplémentaire par groupe" } }
    - { id: c, text: { en: "AppLocker rules that target Finance-Users and Engineering-Users", fr: "Des règles AppLocker qui ciblent Finance-Users et Engineering-Users" } }
    - { id: d, text: { en: "Exploit protection program settings with Code integrity guard for each application", fr: "Des paramètres de programme de la protection contre les attaques avec Code integrity guard pour chaque application" } }
answer:
  optionId: c
explanation:
  correct:
    en: "App Control for Business policies apply to the whole device and affect every user of it. AppLocker rules can target individual users or groups, which is the scenario Microsoft names for AppLocker: shared computers on which different users or groups need different rules. AppLocker can complement an App Control policy that sets the device-wide baseline."
    fr: "Les stratégies App Control for Business s'appliquent à l'ensemble de l'appareil et concernent tous ses utilisateurs. Les règles AppLocker peuvent cibler des utilisateurs ou des groupes, ce qui correspond au scénario que Microsoft cite pour AppLocker : des ordinateurs partagés sur lesquels différents utilisateurs ou groupes ont besoin de règles différentes. AppLocker peut compléter une stratégie App Control qui définit la base commune à l'appareil."
  options:
    a:
      en: "An App Control policy can't scope rules to users or groups: every rule applies to all the users of RDS1."
      fr: "Une stratégie App Control ne peut pas limiter des règles à des utilisateurs ou à des groupes : chaque règle s'applique à tous les utilisateurs de RDS1."
    b:
      en: "Supplemental policies extend what the base policy allows for the whole device; they don't target a group of users."
      fr: "Les stratégies supplémentaires étendent ce que la stratégie de base autorise pour l'ensemble de l'appareil ; elles ne ciblent pas un groupe d'utilisateurs."
    d:
      en: "Code integrity guard restricts the images a process can load to Microsoft-signed binaries; it doesn't decide which applications a user can start."
      fr: "Code integrity guard limite les images qu'un processus peut charger aux binaires signés par Microsoft ; il ne décide pas des applications qu'un utilisateur peut démarrer."
references:
  - title: App Control for Business and AppLocker Overview
    url: https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/appcontrol-and-applocker-overview
