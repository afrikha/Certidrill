id: az802-6a-osc-gpo-conflict
objective: "6.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a member server named **Server8** that runs Windows Server 2025. You applied the **SecurityBaseline/WindowsServer/2025/MemberServer** scenario to Server8 by using OSConfig.

    A GPO linked to the organizational unit of Server8 configures one of the baseline's audit settings with a different value. Since then, the value of this setting on Server8 changes back and forth.

    You need the setting to keep a single, stable value. The rest of the baseline must stay protected against drift.

    What should you do?
  fr: |
    Vous disposez d'un serveur membre nommé **Server8** qui exécute Windows Server 2025. Vous avez appliqué le scénario **SecurityBaseline/WindowsServer/2025/MemberServer** à Server8 à l'aide d'OSConfig.

    Un objet de stratégie de groupe lié à l'unité d'organisation de Server8 configure l'un des paramètres d'audit de la base de référence avec une valeur différente. Depuis, la valeur de ce paramètre sur Server8 change sans cesse.

    Vous devez faire en sorte que le paramètre conserve une valeur unique et stable. Le reste de la base de référence doit rester protégé contre la dérive.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enforce the GPO link, then restart Server8 so that Group Policy processing runs before OSConfig.", fr: "Appliquer (Enforced) la liaison de l'objet de stratégie de groupe, puis redémarrer Server8 pour que le traitement de la stratégie de groupe s'exécute avant OSConfig." } }
    - { id: b, text: { en: "Run gpupdate /force on Server8 so that the GPO value takes precedence over OSConfig.", fr: "Exécuter gpupdate /force sur Server8 pour que la valeur de l'objet de stratégie de groupe l'emporte sur OSConfig." } }
    - { id: c, text: { en: "Reapply the MemberServer scenario with Set-OSConfigDesiredConfiguration -Default, then restart Server8.", fr: "Réappliquer le scénario MemberServer avec Set-OSConfigDesiredConfiguration -Default, puis redémarrer Server8." } }
    - { id: d, text: { en: "Configure the setting from only one source, for example by removing it from the GPO.", fr: "Configurer le paramètre depuis une seule source, par exemple en le supprimant de l'objet de stratégie de groupe." } }
answer:
  optionId: d
explanation:
  correct:
    en: "OSConfig corrects any change that deviates from the desired state. When two sources, such as OSConfig and Group Policy, configure the same setting with different values, Microsoft says you must remove one of the sources, otherwise the value keeps flipping. If the GPO value is the one you want, customize it in OSConfig with Set-OSConfigDesiredConfiguration -Setting -Value, so drift control stays on for the whole baseline."
    fr: "OSConfig corrige toute modification qui s'écarte de l'état souhaité. Lorsque deux sources, comme OSConfig et la stratégie de groupe, configurent le même paramètre avec des valeurs différentes, Microsoft indique qu'il faut supprimer l'une des sources, sinon la valeur continue de basculer. Si la valeur de l'objet de stratégie de groupe est celle que vous voulez, personnalisez-la dans OSConfig avec Set-OSConfigDesiredConfiguration -Setting -Value : le contrôle de dérive reste actif pour toute la base de référence."
  options:
    b:
      en: "Forcing a refresh applies the GPO value again, but OSConfig's drift control then reverts it: the conflict remains."
      fr: "Forcer une actualisation applique de nouveau la valeur de l'objet de stratégie de groupe, mais le contrôle de dérive d'OSConfig la rétablit ensuite : le conflit subsiste."
    c:
      en: "Reapplying the baseline doesn't remove the GPO, which keeps writing its own value."
      fr: "Réappliquer la base de référence ne supprime pas l'objet de stratégie de groupe, qui continue d'écrire sa propre valeur."
    a:
      en: "Enforcing a GPO link only changes precedence between GPOs; it doesn't stop OSConfig from correcting the setting."
      fr: "Appliquer une liaison d'objet de stratégie de groupe ne modifie que la priorité entre objets de stratégie de groupe ; cela n'empêche pas OSConfig de corriger le paramètre."
references:
  - title: Deploy Windows Server 2025 security baselines locally with OSConfig
    url: https://learn.microsoft.com/en-us/windows-server/security/osconfig/osconfig-how-to-configure-security-baselines
