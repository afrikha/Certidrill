id: az802-6a-osc-arc-compliance
objective: "6.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has 60 on-premises member servers that run Windows Server 2025. All the servers are connected to Azure through Azure Arc.

    You need to apply the Windows Server 2025 security baseline to the servers and view their compliance score from the Azure portal. The solution must minimize administrative effort.

    What should you use?
  fr: |
    Woodgrove Bank dispose de 60 serveurs membres locaux qui exécutent Windows Server 2025. Tous les serveurs sont connectés à Azure par Azure Arc.

    Vous devez appliquer la base de référence de sécurité Windows Server 2025 aux serveurs et consulter leur score de conformité depuis le portail Azure. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A GPO imported from the Security Compliance Toolkit baseline backup", fr: "Un objet de stratégie de groupe importé depuis la sauvegarde de base de référence de Security Compliance Toolkit" } }
    - { id: b, text: { en: "A script that runs Set-OSConfigDesiredConfiguration on each server through Invoke-Command", fr: "Un script qui exécute Set-OSConfigDesiredConfiguration sur chaque serveur par Invoke-Command" } }
    - { id: c, text: { en: "Azure Policy machine configuration assignments", fr: "Des attributions Azure Policy machine configuration" } }
    - { id: d, text: { en: "Microsoft Defender for Servers Plan 1 on the subscription", fr: "Microsoft Defender pour les serveurs Plan 1 sur l'abonnement" } }
answer:
  optionId: c
explanation:
  correct:
    en: "For at-scale operations, Microsoft recommends Azure Policy and Azure Policy machine configuration to apply the OSConfig baseline to Azure Arc-connected Windows Server 2025 machines, monitor compliance and view the compliance score. One assignment covers all the servers in its scope."
    fr: "Pour les opérations à grande échelle, Microsoft recommande Azure Policy et Azure Policy machine configuration pour appliquer la base de référence OSConfig aux machines Windows Server 2025 connectées à Azure Arc, surveiller la conformité et consulter le score de conformité. Une seule attribution couvre tous les serveurs de son étendue."
  options:
    b:
      en: "A remote script applies the baseline but gives no compliance view in Azure and requires more effort to maintain."
      fr: "Un script distant applique la base de référence, mais n'offre aucune vue de conformité dans Azure et demande plus d'effort de maintenance."
    a:
      en: "A GPO can deliver baseline settings, but it doesn't report compliance in the Azure portal."
      fr: "Un objet de stratégie de groupe peut fournir les paramètres de base de référence, mais il ne signale pas la conformité dans le portail Azure."
    d:
      en: "Defender for Servers doesn't apply the baseline, and its OS baseline misconfiguration assessment is a Plan 2 feature."
      fr: "Defender pour les serveurs n'applique pas la base de référence, et son évaluation des erreurs de configuration de la base de référence du système d'exploitation est une fonctionnalité du Plan 2."
references:
  - title: Deploy Windows Server 2025 security baselines locally with OSConfig
    url: https://learn.microsoft.com/en-us/windows-server/security/osconfig/osconfig-how-to-configure-security-baselines
  - title: OSConfig security configuration for Windows Server
    url: https://learn.microsoft.com/en-us/windows-server/security/osconfig/osconfig-overview
