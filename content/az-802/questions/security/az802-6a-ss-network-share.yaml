id: az802-6a-ss-network-share
objective: "6.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a server named **RDS2** that runs Windows Server 2025. A GPO enables **Configure Windows Defender SmartScreen** with **Warn and prevent bypass** on RDS2.

    A user on RDS2 runs a malicious executable named **Tool.exe** from the shared folder **\\\\FS2\\Tools** on the internal network. No SmartScreen warning appears. When another user downloads the same file from the internet in Microsoft Edge and runs it, SmartScreen blocks it.

    What explains why SmartScreen didn't warn the first user?
  fr: |
    Vous disposez d'un serveur nommé **RDS2** qui exécute Windows Server 2025. Un objet de stratégie de groupe active **Configure Windows Defender SmartScreen** avec **Warn and prevent bypass** sur RDS2.

    Un utilisateur de RDS2 exécute un exécutable malveillant nommé **Tool.exe** depuis le dossier partagé **\\\\FS2\\Tools** du réseau interne. Aucun avertissement SmartScreen n'apparaît. Lorsqu'un autre utilisateur télécharge le même fichier depuis Internet dans Microsoft Edge et l'exécute, SmartScreen le bloque.

    Qu'est-ce qui explique que SmartScreen n'a pas averti le premier utilisateur ?
body:
  options:
    - { id: a, text: { en: "SmartScreen evaluates only files that Microsoft Edge downloads.", fr: "SmartScreen évalue uniquement les fichiers téléchargés par Microsoft Edge." } }
    - { id: b, text: { en: "SmartScreen doesn't protect against files on internal locations such as UNC shares.", fr: "SmartScreen ne protège pas contre les fichiers situés dans des emplacements internes tels que les partages UNC." } }
    - { id: c, text: { en: "The Configure App Install Control setting must also be enabled on RDS2.", fr: "Le paramètre Configure App Install Control doit aussi être activé sur RDS2." } }
    - { id: d, text: { en: "Warn and prevent bypass applies only to users who aren't local administrators.", fr: "Warn and prevent bypass ne s'applique qu'aux utilisateurs qui ne sont pas administrateurs locaux." } }
answer:
  optionId: b
explanation:
  correct:
    en: "SmartScreen protects against malicious files that come from the internet. It doesn't protect against malicious files stored on internal locations or network shares, such as shared folders reached by a UNC path. To control what can run from internal shares, use an application control solution such as App Control for Business."
    fr: "SmartScreen protège contre les fichiers malveillants provenant d'Internet. Il ne protège pas contre les fichiers malveillants stockés dans des emplacements internes ou des partages réseau, comme les dossiers partagés atteints par un chemin UNC. Pour contrôler ce qui peut s'exécuter depuis des partages internes, utilisez une solution de contrôle d'application telle qu'App Control for Business."
  options:
    a:
      en: "SmartScreen in Windows checks files that any app downloads and runs, including third-party browsers and email clients."
      fr: "SmartScreen dans Windows vérifie les fichiers que toute application télécharge et exécute, y compris les navigateurs tiers et les clients de messagerie."
    c:
      en: "App Install Control concerns the installation of downloaded apps from outside the Microsoft Store and doesn't apply to files opened from local network shares."
      fr: "Configure App Install Control concerne l'installation d'applications téléchargées hors du Microsoft Store et ne s'applique pas aux fichiers ouverts depuis des partages du réseau local."
    d:
      en: "The policy setting applies to all users of the device; the scenario's difference comes from the file's location, not from the user's rights."
      fr: "Le paramètre de stratégie s'applique à tous les utilisateurs de l'appareil ; la différence du scénario vient de l'emplacement du fichier, pas des droits de l'utilisateur."
references:
