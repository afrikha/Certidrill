id: az802-6b-dc-hardening-multi
objective: "6.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named northwindtraders.com. You are deploying a new physical domain controller named **DC5** in a datacenter. DC5 uses locally attached disks and runs Windows Server 2025.

    You need to harden DC5 by following Microsoft's guidance for securing domain controllers.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine Active Directory nommé northwindtraders.com. Vous déployez un nouveau contrôleur de domaine physique nommé **DC5** dans un centre de données. DC5 utilise des disques attachés localement et exécute Windows Server 2025.

    Vous devez durcir DC5 en suivant les recommandations de Microsoft pour la sécurisation des contrôleurs de domaine.

    Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Protect all the volumes of DC5 by using BitLocker Drive Encryption.", fr: "Protéger tous les volumes de DC5 avec le chiffrement de lecteur BitLocker." } }
    - { id: b, text: { en: "Move the AD DS database of DC5 to a NAS share to simplify backups.", fr: "Déplacer la base de données AD DS de DC5 vers un partage NAS pour simplifier les sauvegardes." } }
    - { id: c, text: { en: "Block outbound connections from DC5 to the internet at the perimeter firewall.", fr: "Bloquer au pare-feu de périmètre les connexions sortantes de DC5 vers Internet." } }
    - { id: d, text: { en: "Allow Remote Desktop connections to DC5 from all domain-joined workstations.", fr: "Autoriser les connexions Bureau à distance vers DC5 depuis tous les postes de travail joints au domaine." } }
    - { id: e, text: { en: "Place DC5 in the same rack as the general-purpose file servers.", fr: "Placer DC5 dans la même baie que les serveurs de fichiers généralistes." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Microsoft recommends a TPM and BitLocker Drive Encryption on all the volumes of a domain controller, which works with locally attached storage. Perimeter firewalls should block outbound connections from domain controllers to the internet, so that a compromised domain controller cannot reach attacker infrastructure and browsing is impossible.
    fr: Microsoft recommande un TPM et le chiffrement de lecteur BitLocker sur tous les volumes d'un contrôleur de domaine, ce qui fonctionne avec un stockage attaché localement. Les pare-feu de périmètre doivent bloquer les connexions sortantes des contrôleurs de domaine vers Internet, afin qu'un contrôleur de domaine compromis ne puisse pas joindre l'infrastructure d'un attaquant et que la navigation soit impossible.
  options:
    b: { en: "Locally attached storage is recommended; BitLocker cannot be implemented on SAN or NAS storage.", fr: "Le stockage attaché localement est recommandé ; BitLocker ne peut pas être mis en œuvre sur un stockage SAN ou NAS." }
    d: { en: "RDP to domain controllers should be allowed only from authorized users and systems, such as jump servers.", fr: "Le RDP vers les contrôleurs de domaine ne doit être autorisé que depuis des utilisateurs et systèmes autorisés, comme des serveurs de rebond." }
    e: { en: "Physical domain controllers belong in dedicated secure racks or cages separate from the general server population.", fr: "Les contrôleurs de domaine physiques doivent se trouver dans des baies ou cages sécurisées dédiées, séparées des autres serveurs." }
references:
  - title: Securing domain controllers against attack
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/securing-domain-controllers-against-attack
