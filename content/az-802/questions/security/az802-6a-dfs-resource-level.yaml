id: az802-6a-dfs-resource-level
objective: "6.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure subscription named **Sub1** that contains 30 Azure virtual machines running Windows Server 2025. Microsoft Defender for Servers isn't enabled on Sub1.

    You need to protect only a virtual machine named **VM1** with Microsoft Defender for Endpoint EDR and agent-based vulnerability scanning through Defender for Servers. The other virtual machines must not be billed for Defender for Servers. The solution must minimize cost.

    What should you do?
  fr: |
    Vous disposez d'un abonnement Azure nommé **Sub1** qui contient 30 machines virtuelles Azure exécutant Windows Server 2025. Microsoft Defender pour les serveurs n'est pas activé sur Sub1.

    Vous devez protéger uniquement une machine virtuelle nommée **VM1** avec la fonctionnalité EDR de Microsoft Defender pour point de terminaison et l'analyse des vulnérabilités basée sur un agent, par Defender pour les serveurs. Les autres machines virtuelles ne doivent pas être facturées pour Defender pour les serveurs. La solution doit réduire les coûts au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable Defender for Servers Plan 1 on VM1 only.", fr: "Activer Defender pour les serveurs Plan 1 uniquement sur VM1." } }
    - { id: b, text: { en: "Enable Defender for Servers Plan 2 on VM1 only.", fr: "Activer Defender pour les serveurs Plan 2 uniquement sur VM1." } }
    - { id: c, text: { en: "Enable Defender for Servers Plan 1 on Sub1.", fr: "Activer Defender pour les serveurs Plan 1 sur Sub1." } }
    - { id: d, text: { en: "Enable Defender for Servers Plan 2 on Sub1.", fr: "Activer Defender pour les serveurs Plan 2 sur Sub1." } }
answer:
  optionId: a
explanation:
  correct:
    en: "Defender for Endpoint EDR and agent-based vulnerability scanning are included in Plan 1. Plan 1 can be enabled and disabled for an individual server, so you can protect only VM1 without paying for the other 29 virtual machines."
    fr: "La fonctionnalité EDR de Defender pour point de terminaison et l'analyse des vulnérabilités basée sur un agent sont incluses dans le Plan 1. Le Plan 1 peut être activé et désactivé pour un serveur individuel : vous pouvez donc protéger uniquement VM1 sans payer pour les 29 autres machines virtuelles."
  options:
    b:
      en: "Plan 2 can't be enabled at the resource level; it can only be disabled for individual resources after it's enabled on the subscription."
      fr: "Le Plan 2 ne peut pas être activé au niveau d'une ressource ; il peut seulement être désactivé pour des ressources individuelles après son activation sur l'abonnement."
    c:
      en: "Enabling Plan 1 on Sub1 bills every server in the subscription, not only VM1."
      fr: "Activer le Plan 1 sur Sub1 facture tous les serveurs de l'abonnement, pas seulement VM1."
    d:
      en: "Plan 2 on the subscription covers all 30 virtual machines and costs more than Plan 1, whose features are enough here."
      fr: "Le Plan 2 sur l'abonnement couvre les 30 machines virtuelles et coûte plus cher que le Plan 1, dont les fonctionnalités suffisent ici."
references:
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
