id: az802-6a-cg-broken-auth
objective: "6.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a member server named **APP1** that runs Windows Server 2025 in an AD DS domain. You plan to turn on Credential Guard on APP1. The applications and services on APP1 use the following authentication methods:

    - **Web1** impersonates users and accesses a back-end SQL Server by using Kerberos unconstrained delegation.
    - **Web2** accesses a back-end file share by using Kerberos constrained delegation.
    - **Legacy1** uses single sign-on with NTLMv1.
    - Administrators connect to APP1 by using Remote Desktop with Kerberos authentication.
    - **Sync1** accesses SMB shares on FS1 by using Kerberos.

    Which two items will stop working after Credential Guard runs on APP1?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur membre nommé **APP1** qui exécute Windows Server 2025 dans un domaine AD DS. Vous prévoyez d'activer Credential Guard sur APP1. Les applications et services d'APP1 utilisent les méthodes d'authentification suivantes :

    - **Web1** emprunte l'identité des utilisateurs et accède à un serveur SQL Server principal à l'aide de la délégation Kerberos non contrainte.
    - **Web2** accède à un partage de fichiers principal à l'aide de la délégation Kerberos contrainte.
    - **Legacy1** utilise l'authentification unique avec NTLMv1.
    - Les administrateurs se connectent à APP1 par Bureau à distance avec l'authentification Kerberos.
    - **Sync1** accède aux partages SMB de FS1 à l'aide de Kerberos.

    Quels sont les deux éléments qui cesseront de fonctionner une fois Credential Guard actif sur APP1 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Web1 }
    - { id: b, text: Web2 }
    - { id: c, text: Legacy1 }
    - { id: d, text: { en: "Remote Desktop connections", fr: "Connexions Bureau à distance" } }
    - { id: e, text: Sync1 }
answer:
  optionIds: [ a, c ]
explanation:
  correct:
    en: "Credential Guard blocks Kerberos unconstrained delegation and Kerberos DES, and NTLMv1 can no longer be used for single sign-on, so Web1 and Legacy1 break. Microsoft recommends Kerberos constrained delegation or resource-based constrained delegation instead of unconstrained delegation."
    fr: "Credential Guard bloque la délégation Kerberos non contrainte et Kerberos DES, et NTLMv1 ne peut plus être utilisé pour l'authentification unique : Web1 et Legacy1 cessent de fonctionner. Microsoft recommande la délégation Kerberos contrainte ou la délégation contrainte basée sur les ressources à la place de la délégation non contrainte."
  options:
    b:
      en: "Kerberos constrained delegation is the recommended alternative and keeps working with Credential Guard."
      fr: "La délégation Kerberos contrainte est l'alternative recommandée et continue de fonctionner avec Credential Guard."
    d:
      en: "Services that rely on Kerberos, such as Remote Desktop, aren't affected by Credential Guard."
      fr: "Les services qui reposent sur Kerberos, comme Bureau à distance, ne sont pas affectés par Credential Guard."
    e:
      en: "File share access with Kerberos continues to work with Credential Guard."
      fr: "L'accès aux partages de fichiers avec Kerberos continue de fonctionner avec Credential Guard."
references:
  - title: Credential Guard overview
    url: https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/
  - title: Considerations and known issues when using Credential Guard
    url: https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/considerations-known-issues
