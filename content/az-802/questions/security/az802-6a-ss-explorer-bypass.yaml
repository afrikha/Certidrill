id: az802-6a-ss-explorer-bypass
objective: "6.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You manage a pool of Remote Desktop Session Host servers that run Windows Server 2025. Users download tools from the internet by using a third-party browser and then run them from File Explorer.

    You need to ensure that when Microsoft Defender SmartScreen flags a downloaded program as unrecognized or malicious, users can't run it. Users must still be able to run downloaded programs that have an established reputation.

    Which Group Policy setting should you configure?
  fr: |
    Vous gérez un pool de serveurs Hôte de session Bureau à distance qui exécutent Windows Server 2025. Les utilisateurs téléchargent des outils depuis Internet avec un navigateur tiers, puis les exécutent depuis l'Explorateur de fichiers.

    Vous devez faire en sorte que, lorsque Microsoft Defender SmartScreen signale un programme téléchargé comme non reconnu ou malveillant, les utilisateurs ne puissent pas l'exécuter. Les utilisateurs doivent toujours pouvoir exécuter les programmes téléchargés qui ont une réputation établie.

    Quel paramètre de stratégie de groupe devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Windows Defender SmartScreen > Explorer > Configure Windows Defender SmartScreen: Enabled, with Warn and prevent bypass", fr: "Windows Defender SmartScreen > Explorer > Configure Windows Defender SmartScreen : Enabled, avec Warn and prevent bypass" } }
    - { id: b, text: { en: "Windows Defender SmartScreen > Explorer > Configure App Install Control: Enabled", fr: "Windows Defender SmartScreen > Explorer > Configure App Install Control : Enabled" } }
    - { id: c, text: { en: "Microsoft Edge > SmartScreen settings > Prevent bypassing of Microsoft Defender SmartScreen warnings about downloads: Enabled", fr: "Microsoft Edge > SmartScreen settings > Prevent bypassing of Microsoft Defender SmartScreen warnings about downloads : Enabled" } }
    - { id: d, text: { en: "Microsoft Edge > SmartScreen settings > Configure Microsoft Defender SmartScreen: Enabled", fr: "Microsoft Edge > SmartScreen settings > Configure Microsoft Defender SmartScreen : Enabled" } }
answer:
  optionId: a
explanation:
  correct:
    en: "The Explorer setting Configure Windows Defender SmartScreen controls the reputation check of apps and files that users run, whatever browser downloaded them. Enabling it with Warn and prevent bypass stops users from ignoring the warning, while programs with an established reputation run without any prompt."
    fr: "Le paramètre Explorer Configure Windows Defender SmartScreen contrôle la vérification de réputation des applications et fichiers exécutés par les utilisateurs, quel que soit le navigateur qui les a téléchargés. L'activer avec Warn and prevent bypass empêche les utilisateurs d'ignorer l'avertissement, tandis que les programmes à réputation établie s'exécutent sans invite."
  options:
    b:
      en: "App Install Control can block the installation of every downloaded app from outside the Microsoft Store, including apps with an established reputation; it isn't a reputation check."
      fr: "Configure App Install Control peut bloquer l'installation de toute application téléchargée hors du Microsoft Store, y compris celles qui ont une réputation établie ; ce n'est pas une vérification de réputation."
    c:
      en: "This Edge setting applies to downloads made in Microsoft Edge, not to files downloaded by a third-party browser."
      fr: "Ce paramètre Edge s'applique aux téléchargements effectués dans Microsoft Edge, pas aux fichiers téléchargés par un navigateur tiers."
    d:
      en: "This setting only turns SmartScreen on in Microsoft Edge; users can still bypass warnings, and it doesn't cover programs run from File Explorer."
      fr: "Ce paramètre active seulement SmartScreen dans Microsoft Edge ; les utilisateurs peuvent toujours ignorer les avertissements, et il ne couvre pas les programmes exécutés depuis l'Explorateur de fichiers."
references:
  - title: Available Microsoft Defender SmartScreen settings
    url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/virus-and-threat-protection/microsoft-defender-smartscreen/available-settings
