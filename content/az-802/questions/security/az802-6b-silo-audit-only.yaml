id: az802-6b-silo-audit-only
objective: "6.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named fabrikam.com. Kerberos armoring support is enabled on all the domain controllers and clients.

    To restrict the Tier 0 accounts to privileged access workstations, you ran the following commands, and then added the account **adm-lea** and the computers PAW1 and PAW2 to Tier0-Silo and assigned the silo to them.

    ```powershell
    New-ADAuthenticationPolicy -Name Tier0-Pol -UserTGTLifetimeMins 240 -UserAllowedToAuthenticateFrom $sddl
    New-ADAuthenticationPolicySilo -Name Tier0-Silo -UserAuthenticationPolicy Tier0-Pol -ComputerAuthenticationPolicy Tier0-Pol
    ```

    The `$sddl` condition allows only devices that are members of Tier0-Silo. adm-lea can still sign in to a workstation named **WS-200**, which is not in the silo. Event ID 305 is logged in the AuthenticationPolicyFailures-DomainController log.

    You need to block adm-lea from signing in to WS-200. What should you do?
  fr: |
    Votre réseau contient un domaine Active Directory nommé fabrikam.com. La prise en charge du blindage Kerberos est activée sur tous les contrôleurs de domaine et tous les clients.

    Pour limiter les comptes du niveau 0 aux stations de travail à accès privilégié, vous avez exécuté les commandes suivantes, puis ajouté le compte **adm-lea** et les ordinateurs PAW1 et PAW2 à Tier0-Silo et leur avez attribué le silo.

    ```powershell
    New-ADAuthenticationPolicy -Name Tier0-Pol -UserTGTLifetimeMins 240 -UserAllowedToAuthenticateFrom $sddl
    New-ADAuthenticationPolicySilo -Name Tier0-Silo -UserAuthenticationPolicy Tier0-Pol -ComputerAuthenticationPolicy Tier0-Pol
    ```

    La condition `$sddl` n'autorise que les appareils membres de Tier0-Silo. adm-lea peut toujours se connecter à un poste de travail nommé **WS-200**, qui n'appartient pas au silo. L'événement 305 est journalisé dans le journal AuthenticationPolicyFailures-DomainController.

    Vous devez empêcher adm-lea de se connecter à WS-200. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable Kerberos armoring in the Default Domain Controllers Policy GPO.", fr: "Activer le blindage Kerberos dans le GPO Default Domain Controllers Policy." } }
    - { id: b, text: { en: "Add adm-lea to the Protected Users group.", fr: "Ajouter adm-lea au groupe Protected Users." } }
    - { id: c, text: { en: "Configure Tier0-Pol and Tier0-Silo to be enforced.", fr: "Configurer Tier0-Pol et Tier0-Silo pour qu'ils soient appliqués." } }
    - { id: d, text: { en: "Grant WS-200 access to Tier0-Silo.", fr: "Accorder à WS-200 l'accès à Tier0-Silo." } }
answer: { optionId: c }
explanation:
  correct:
    en: Both objects were created without -Enforce, so they are in audit mode. In audit mode, the domain controller logs informational event 305 to show that the TGT would be denied, but it still issues the ticket. Enforcing the policy and the silo makes the domain controller refuse the TGT when adm-lea signs in from a device outside the silo.
    fr: "Les deux objets ont été créés sans -Enforce : ils sont donc en mode audit. Dans ce mode, le contrôleur de domaine journalise l'événement informatif 305 pour indiquer que le TGT serait refusé, mais il émet quand même le ticket. L'application de la stratégie et du silo amène le contrôleur de domaine à refuser le TGT quand adm-lea se connecte depuis un appareil hors du silo."
  options:
    a: { en: "Armoring support is already enabled, and the audit event proves the domain controllers already evaluate the policy.", fr: "La prise en charge du blindage est déjà activée, et l'événement d'audit prouve que les contrôleurs de domaine évaluent déjà la stratégie." }
    b: { en: "Protected Users blocks NTLM and delegation but does not restrict the devices an account can sign in from.", fr: "Protected Users bloque NTLM et la délégation, mais ne limite pas les appareils depuis lesquels un compte peut se connecter." }
    d: { en: "Adding WS-200 to the silo would allow the sign-in instead of blocking it.", fr: "Ajouter WS-200 au silo autoriserait la connexion au lieu de la bloquer." }
references:
  - title: Authentication Policies and Authentication Policy Silos
    url: https://learn.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/authentication-policies-and-authentication-policy-silos
  - title: New-ADAuthenticationPolicySilo (ActiveDirectory)
    url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/new-adauthenticationpolicysilo
