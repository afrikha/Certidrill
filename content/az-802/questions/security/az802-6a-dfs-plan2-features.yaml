id: az802-6a-dfs-plan2-features
objective: "6.1.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an Azure subscription named **Sub3** that contains 50 Azure virtual machines running Windows Server 2025. Microsoft Defender for Servers Plan 1 is enabled on Sub3.

    The security team lists the following requirements:

    - Detect malware on the VM disks without relying on an agent inside the VMs.
    - Open management ports on a VM only on request and for a limited time.
    - Investigate endpoint detection and response (EDR) alerts in the Microsoft Defender portal.
    - Inventory the software installed on the VMs.
    - Scan the VMs for vulnerabilities by using the Defender for Endpoint agent.

    Which two requirements force you to switch Sub3 to Plan 2?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un abonnement Azure nommé **Sub3** qui contient 50 machines virtuelles Azure exécutant Windows Server 2025. Microsoft Defender pour les serveurs Plan 1 est activé sur Sub3.

    L'équipe de sécurité liste les exigences suivantes :

    - Détecter les programmes malveillants sur les disques des machines virtuelles sans dépendre d'un agent dans les machines virtuelles.
    - Ouvrir les ports de gestion d'une machine virtuelle uniquement sur demande et pour une durée limitée.
    - Examiner les alertes de détection et de réponse des points de terminaison (EDR) dans le portail Microsoft Defender.
    - Inventorier les logiciels installés sur les machines virtuelles.
    - Analyser les vulnérabilités des machines virtuelles à l'aide de l'agent Defender pour point de terminaison.

    Quelles sont les deux exigences qui vous obligent à passer Sub3 au Plan 2 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Agentless malware detection on the VM disks", fr: "Détection sans agent des programmes malveillants sur les disques des machines virtuelles" } }
    - { id: b, text: { en: "Agent-based vulnerability scanning", fr: "Analyse des vulnérabilités basée sur un agent" } }
    - { id: c, text: { en: "EDR alerts in the Microsoft Defender portal", fr: "Alertes EDR dans le portail Microsoft Defender" } }
    - { id: d, text: { en: "Software inventory of the VMs", fr: "Inventaire des logiciels des machines virtuelles" } }
    - { id: e, text: { en: "Opening management ports on request for a limited time", fr: "Ouverture des ports de gestion sur demande pour une durée limitée" } }
answer:
  optionIds: [ a, e ]
explanation:
  correct:
    en: "Agentless malware scanning and just-in-time virtual machine access are available only in Defender for Servers Plan 2. Plan 1 already includes Defender for Endpoint EDR, software inventory discovery and agent-based vulnerability scanning."
    fr: "L'analyse sans agent des programmes malveillants et l'accès juste-à-temps aux machines virtuelles ne sont disponibles que dans Defender pour les serveurs Plan 2. Le Plan 1 inclut déjà l'EDR de Defender pour point de terminaison, la découverte de l'inventaire logiciel et l'analyse des vulnérabilités basée sur un agent."
  options:
    c:
      en: "Defender for Endpoint EDR is included in both plans."
      fr: "L'EDR de Defender pour point de terminaison est inclus dans les deux plans."
    d:
      en: "Software inventory discovery is included in both plans."
      fr: "La découverte de l'inventaire logiciel est incluse dans les deux plans."
    b:
      en: "Agent-based vulnerability scanning is included in both plans; only agentless scanning requires Plan 2."
      fr: "L'analyse des vulnérabilités basée sur un agent est incluse dans les deux plans ; seule l'analyse sans agent nécessite le Plan 2."
references:
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
