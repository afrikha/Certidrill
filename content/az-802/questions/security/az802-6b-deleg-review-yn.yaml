id: az802-6b-deleg-review-yn
objective: "6.2.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named contoso.com. Last year, the Reset Password permission on the user objects of an OU named **Lyon** was delegated to a group named **HD-Lyon**. The permission was configured as inheritable.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine Active Directory nommé contoso.com. L'année dernière, l'autorisation Reset Password sur les objets utilisateur d'une UO nommée **Lyon** a été déléguée à un groupe nommé **HD-Lyon**. L'autorisation a été configurée comme héritable.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The users in a new OU created under Lyon receive the delegated permission without any additional configuration.
        fr: Les utilisateurs d'une nouvelle UO créée sous Lyon reçoivent l'autorisation déléguée sans configuration supplémentaire.
    - id: s2
      text:
        en: To give a new help desk technician the same rights, Microsoft recommends adding the technician's user account directly to the ACL of the Lyon OU.
        fr: Pour accorder les mêmes droits à un nouveau technicien du support, Microsoft recommande d'ajouter son compte d'utilisateur directement à la liste ACL de l'UO Lyon.
    - id: s3
      text:
        en: Running `dsacls "OU=Lyon,DC=contoso,DC=com" /R CONTOSO\HD-Lyon` deletes all the ACEs of HD-Lyon from the Lyon OU.
        fr: L'exécution de `dsacls "OU=Lyon,DC=contoso,DC=com" /R CONTOSO\HD-Lyon` supprime toutes les ACE de HD-Lyon de l'UO Lyon.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Inheritable permissions delegated on an OU apply to the OUs placed in its subtree, so a new child OU and its users receive them. Microsoft recommends delegating to a group and managing who has the rights through group membership, so you add the technician to HD-Lyon instead of editing the ACL. The dsacls /R switch deletes all the ACEs of the specified users or groups, which is how you revoke a delegation from the command line.
    fr: "Les autorisations héritables déléguées sur une UO s'appliquent aux UO placées dans sa sous-arborescence : une nouvelle UO enfant et ses utilisateurs les reçoivent. Microsoft recommande de déléguer à un groupe et de gérer les détenteurs des droits par l'appartenance au groupe : vous ajoutez le technicien à HD-Lyon au lieu de modifier la liste ACL. Le commutateur /R de dsacls supprime toutes les ACE des utilisateurs ou groupes indiqués : c'est ainsi que l'on révoque une délégation en ligne de commande."
references:
  - title: Delegating Administration by Using OU Objects
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/delegating-administration-by-using-ou-objects
  - title: Dsacls
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc771151(v=ws.11)
