id: az802-6b-builtin-groups-yn
objective: "6.2.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an Active Directory domain named fabrikam.com. The domain controllers use the default user rights assignments. You are reviewing the security of the built-in administrative groups and accounts.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre réseau contient un domaine Active Directory nommé fabrikam.com. Les contrôleurs de domaine utilisent les attributions de droits utilisateur par défaut. Vous examinez la sécurité des groupes et comptes d'administration intégrés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A member of Backup Operators can restore files on a domain controller, including files for which the member has no NTFS permission.
        fr: Un membre de Backup Operators peut restaurer des fichiers sur un contrôleur de domaine, y compris des fichiers sur lesquels il n'a aucune autorisation NTFS.
    - id: s2
      text:
        en: By default, every domain controller runs SDProp every 60 minutes to reset the permissions of protected accounts.
        fr: Par défaut, chaque contrôleur de domaine exécute SDProp toutes les 60 minutes pour rétablir les autorisations des comptes protégés.
    - id: s3
      text:
        en: Microsoft recommends enabling Smart card is required for interactive logon on the built-in Administrator account of the domain.
        fr: Microsoft recommande d'activer Smart card is required for interactive logon sur le compte Administrator intégré du domaine.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: On domain controllers, Backup Operators hold the back up and restore files and directories rights, which bypass file permissions; this is why Microsoft recommends keeping the group empty. SDProp runs every 60 minutes by default, but only on the domain controller that holds the PDC emulator role. For the built-in Administrator account, Microsoft recommends the Account is sensitive and cannot be delegated and Smart card is required for interactive logon flags, plus deny rights on member servers and workstations.
    fr: "Sur les contrôleurs de domaine, Backup Operators détient les droits de sauvegarde et de restauration des fichiers et répertoires, qui contournent les autorisations des fichiers ; c'est pourquoi Microsoft recommande de laisser ce groupe vide. SDProp s'exécute toutes les 60 minutes par défaut, mais uniquement sur le contrôleur de domaine qui détient le rôle d'émulateur PDC. Pour le compte Administrator intégré, Microsoft recommande les indicateurs Account is sensitive and cannot be delegated et Smart card is required for interactive logon, ainsi que des droits de refus sur les serveurs membres et les postes de travail."
references:
  - title: Appendix C - Protected Accounts and Groups in Active Directory
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/appendix-c--protected-accounts-and-groups-in-active-directory
  - title: Appendix D - Securing Built-In Administrator Accounts in Active Directory
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/appendix-d--securing-built-in-administrator-accounts-in-active-directory
