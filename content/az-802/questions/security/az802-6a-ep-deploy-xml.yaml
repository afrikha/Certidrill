id: az802-6a-ep-deploy-xml
objective: "6.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Your network contains an AD DS domain named **contoso.com**. The domain contains 40 servers that run Windows Server 2025 in an organizational unit (OU) named **Servers**, a reference server named **SRV-REF**, and a file server named **FS1** that has a share named **EP** that all servers can read.

    You need to apply the same set of exploit protection mitigations, at both the system level and the program level, to all the servers in the Servers OU. The solution must minimize administrative effort.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Votre réseau contient un domaine AD DS nommé **contoso.com**. Le domaine contient 40 serveurs qui exécutent Windows Server 2025 dans une unité d'organisation (UO) nommée **Servers**, un serveur de référence nommé **SRV-REF** et un serveur de fichiers nommé **FS1** qui possède un partage nommé **EP** accessible en lecture à tous les serveurs.

    Vous devez appliquer le même ensemble d'atténuations de la protection contre les attaques (exploit protection), au niveau du système et au niveau des programmes, à tous les serveurs de l'UO Servers. La solution doit réduire au minimum l'effort d'administration.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste d'actions vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: conf, text: { en: "On SRV-REF, configure the mitigations in Windows Security on the System settings and Program settings tabs.", fr: "Sur SRV-REF, configurer les atténuations dans Sécurité Windows sous les onglets System settings et Program settings." } }
    - { id: export, text: { en: "On SRV-REF, run Get-ProcessMitigation -RegistryConfigFilePath C:\\Temp\\ep.xml.", fr: "Sur SRV-REF, exécuter Get-ProcessMitigation -RegistryConfigFilePath C:\\Temp\\ep.xml." } }
    - { id: copy, text: { en: "Copy ep.xml to \\\\FS1\\EP.", fr: "Copier ep.xml dans \\\\FS1\\EP." } }
    - { id: gpo, text: { en: "Create a GPO linked to the Servers OU and enable Use a common set of exploit protection settings with the path \\\\FS1\\EP\\ep.xml.", fr: "Créer un objet de stratégie de groupe lié à l'UO Servers et activer Use a common set of exploit protection settings avec le chemin \\\\FS1\\EP\\ep.xml." } }
    - { id: import, text: { en: "On each server, run Set-ProcessMitigation -PolicyFilePath \\\\FS1\\EP\\ep.xml.", fr: "Sur chaque serveur, exécuter Set-ProcessMitigation -PolicyFilePath \\\\FS1\\EP\\ep.xml." } }
    - { id: local, text: { en: "Create a GPO linked to the Servers OU and enable Use a common set of exploit protection settings with the path C:\\Temp\\ep.xml.", fr: "Créer un objet de stratégie de groupe lié à l'UO Servers et activer Use a common set of exploit protection settings avec le chemin C:\\Temp\\ep.xml." } }
answer:
  sequence: [ conf, export, copy, gpo ]
explanation:
  correct:
    en: "You first build the configuration on a reference server, then export it to an XML file; the export contains both the system-level and the app-level mitigations. The file must be in a location that every target server can reach, such as a UNC path, and the Group Policy setting Use a common set of exploit protection settings, under Windows Components > Microsoft Defender Exploit Guard > Exploit Protection, points the servers to that file."
    fr: "Vous créez d'abord la configuration sur un serveur de référence, puis vous l'exportez dans un fichier XML ; l'exportation contient les atténuations de niveau système et de niveau application. Le fichier doit se trouver dans un emplacement accessible par chaque serveur cible, par exemple un chemin UNC, et le paramètre de stratégie de groupe Use a common set of exploit protection settings, sous Windows Components > Microsoft Defender Exploit Guard > Exploit Protection, indique ce fichier aux serveurs."
  options:
    import:
      en: "Importing the file manually on 40 servers works but doesn't minimize administrative effort compared to a GPO."
      fr: "Importer le fichier manuellement sur 40 serveurs fonctionne, mais ne réduit pas l'effort d'administration au minimum par rapport à un objet de stratégie de groupe."
    local:
      en: "C:\\Temp\\ep.xml exists only on SRV-REF; each target server would look for the file on its own local disk and wouldn't find it."
      fr: "C:\\Temp\\ep.xml n'existe que sur SRV-REF ; chaque serveur cible chercherait le fichier sur son propre disque local et ne le trouverait pas."
references:
  - title: Import, export, and deploy exploit protection configurations
    url: https://learn.microsoft.com/en-us/defender-endpoint/import-export-exploit-protection-emet-xml
