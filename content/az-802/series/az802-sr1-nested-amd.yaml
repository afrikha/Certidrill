id: az802-sr1-nested-amd
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware, Inc. has a physical server named **Host1** that runs Windows Server 2025 Datacenter and has the Hyper-V server role installed. Host1 has **AMD EPYC** processors and an external virtual switch named **vSwitch-Ext**.

    Host1 hosts a Generation 2 virtual machine named **VM1** that runs Windows Server 2025. VM1 was imported from an older host and has a configuration version of **9.0**. VM1 has one network adapter connected to vSwitch-Ext. VM1 is running.

    You need to install the Hyper-V server role in VM1 and run virtual machines inside VM1. The virtual machines inside VM1 must connect to the physical network through an external virtual switch created in VM1. NAT must not be used.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware, Inc. dispose d'un serveur physique nommé **Host1** qui exécute Windows Server 2025 Datacenter et sur lequel le rôle serveur Hyper-V est installé. Host1 dispose de processeurs **AMD EPYC** et d'un commutateur virtuel externe nommé **vSwitch-Ext**.

    Host1 héberge une machine virtuelle de génération 2 nommée **VM1** qui exécute Windows Server 2025. VM1 a été importée depuis un hôte plus ancien et sa version de configuration est **9.0**. VM1 dispose d'une carte réseau connectée à vSwitch-Ext. VM1 est en cours d'exécution.

    Vous devez installer le rôle serveur Hyper-V dans VM1 et exécuter des machines virtuelles dans VM1. Les machines virtuelles de VM1 doivent se connecter au réseau physique par l'intermédiaire d'un commutateur virtuel externe créé dans VM1. La traduction d'adresses réseau (NAT) ne doit pas être utilisée.
