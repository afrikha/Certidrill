id: az802-sr2-nested-virt
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have a physical Hyper-V host named **Server1** that runs Windows Server 2022 and has an Intel processor with VT-x and EPT. Server1 has an external virtual switch named **vSwitch1** that is bound to the corporate network.

    Server1 hosts a virtual machine named **VM1** that runs Windows Server 2022. VM1 has configuration version 10.0, static memory and one network adapter connected to vSwitch1. VM1 is running.

    You need to install the Hyper-V role in VM1 and run nested virtual machines in VM1. The nested virtual machines must obtain IP addresses from the DHCP server of the corporate network.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez d'un hôte Hyper-V physique nommé **Server1** qui exécute Windows Server 2022 et possède un processeur Intel avec VT-x et EPT. Server1 dispose d'un commutateur virtuel externe nommé **vSwitch1** lié au réseau de l'entreprise.

    Server1 héberge une machine virtuelle nommée **VM1** qui exécute Windows Server 2022. VM1 a la version de configuration 10.0, de la mémoire statique et une carte réseau connectée à vSwitch1. VM1 est en cours d'exécution.

    Vous devez installer le rôle Hyper-V dans VM1 et exécuter des machines virtuelles imbriquées dans VM1. Les machines virtuelles imbriquées doivent obtenir leurs adresses IP auprès du serveur DHCP du réseau de l'entreprise.
