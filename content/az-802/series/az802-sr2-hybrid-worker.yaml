id: az802-sr2-hybrid-worker
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso, Ltd. has an on-premises file server named **FS1** that runs Windows Server 2022 and is a member of the **contoso.com** domain. The perimeter firewall allows outbound HTTPS connections to the internet and blocks all inbound connections from the internet.

    Contoso has an Azure subscription that contains an Azure Automation account named **Auto1**. Auto1 contains a PowerShell runbook named **Clear-Staging** that deletes the files older than 30 days from the local folder **D:\Staging** on the server where the runbook runs.

    You need to ensure that Clear-Staging runs against D:\Staging on FS1 every night at 01:00.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso, Ltd. dispose d'un serveur de fichiers local nommé **FS1** qui exécute Windows Server 2022 et est membre du domaine **contoso.com**. Le pare-feu de périmètre autorise les connexions HTTPS sortantes vers Internet et bloque toutes les connexions entrantes depuis Internet.

    Contoso dispose d'un abonnement Azure qui contient un compte Azure Automation nommé **Auto1**. Auto1 contient un runbook PowerShell nommé **Clear-Staging** qui supprime les fichiers de plus de 30 jours du dossier local **D:\Staging** du serveur sur lequel le runbook s'exécute.

    Vous devez vous assurer que Clear-Staging s'exécute sur le dossier D:\Staging de FS1 chaque nuit à 01:00.
