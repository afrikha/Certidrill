id: az802-sr1-share-hop
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam, Inc. has an AD DS domain named **fabrikam.com** that contains a computer named **Client1** that runs Windows 11 and two member servers named **Server1** and **FS1** that run Windows Server 2025. FS1 hosts a shared folder named **Scripts**.

    A user named **Admin1** is a local administrator on Server1 and has Read permissions on Scripts. Admin1 is not a member of the Protected Users group, and the account is not marked as sensitive.

    From Client1, Admin1 runs `Enter-PSSession -ComputerName Server1`. In the remote session, Admin1 runs `Get-ChildItem \\FS1\Scripts` and receives an access denied error. The same command succeeds when Admin1 runs it locally on Client1.

    You need to ensure that Admin1 can access \\FS1\Scripts from PowerShell remote sessions on Server1. The solution must not send the credentials of Admin1 to Server1.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam, Inc. dispose d'un domaine AD DS nommé **fabrikam.com** qui contient un ordinateur nommé **Client1** qui exécute Windows 11 et deux serveurs membres nommés **Server1** et **FS1** qui exécutent Windows Server 2025. FS1 héberge un dossier partagé nommé **Scripts**.

    Un utilisateur nommé **Admin1** est administrateur local de Server1 et dispose de l'autorisation Lecture sur Scripts. Admin1 n'est pas membre du groupe Protected Users, et le compte n'est pas marqué comme sensible.

    À partir de Client1, Admin1 exécute `Enter-PSSession -ComputerName Server1`. Dans la session à distance, Admin1 exécute `Get-ChildItem \\FS1\Scripts` et reçoit une erreur d'accès refusé. La même commande réussit lorsque Admin1 l'exécute localement sur Client1.

    Vous devez faire en sorte qu'Admin1 puisse accéder à \\FS1\Scripts à partir de sessions PowerShell à distance sur Server1. La solution ne doit pas envoyer les informations d'identification d'Admin1 à Server1.
