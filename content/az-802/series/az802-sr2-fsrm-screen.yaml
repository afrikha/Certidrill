id: az802-sr2-fsrm-screen
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have a file server named **FS1** that runs Windows Server 2022 and has the File Server Resource Manager (FSRM) role service installed. FS1 shares the folder **D:\Projects**, which contains a subfolder named **D:\Projects\Media**.

    In FSRM, you created a file group named **MediaFiles** that includes the `*.mp3`, `*.mp4` and `*.wav` file name patterns. No file screen is configured on FS1.

    You need to prevent users from saving files that match MediaFiles anywhere in D:\Projects, except in D:\Projects\Media and its subfolders, where users must be able to save those files.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez d'un serveur de fichiers nommé **FS1** qui exécute Windows Server 2022 et sur lequel le service de rôle Gestionnaire de ressources du serveur de fichiers (FSRM) est installé. FS1 partage le dossier **D:\Projects**, qui contient un sous-dossier nommé **D:\Projects\Media**.

    Dans FSRM, vous avez créé un groupe de fichiers nommé **MediaFiles** qui inclut les modèles de noms de fichiers `*.mp3`, `*.mp4` et `*.wav`. Aucun filtre de fichiers n'est configuré sur FS1.

    Vous devez empêcher les utilisateurs d'enregistrer des fichiers correspondant à MediaFiles partout dans D:\Projects, sauf dans D:\Projects\Media et ses sous-dossiers, où les utilisateurs doivent pouvoir enregistrer ces fichiers.
