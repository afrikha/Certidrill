id: az802-sr1-admin-pso
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum Corporation has an AD DS domain named **adatum.com**. The domain functional level is Windows Server 2016. The Default Domain Policy sets a minimum password length of 10 characters and does not configure account lockout.

    The user accounts of the IT administrators are stored in an organizational unit (OU) named **Admins**. These accounts are the only members of a global security group named **IT-Admins**.

    You need to ensure that the IT administrator accounts require passwords of at least **15** characters and are locked out after **5** failed sign-in attempts. All the other user accounts in the domain must keep the settings of the Default Domain Policy. You are a member of the Domain Admins group.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum Corporation dispose d'un domaine AD DS nommé **adatum.com**. Le niveau fonctionnel du domaine est Windows Server 2016. La stratégie Default Domain Policy définit une longueur minimale de mot de passe de 10 caractères et ne configure pas le verrouillage de compte.

    Les comptes d'utilisateur des administrateurs informatiques sont stockés dans une unité d'organisation (UO) nommée **Admins**. Ces comptes sont les seuls membres d'un groupe de sécurité global nommé **IT-Admins**.

    Vous devez faire en sorte que les comptes des administrateurs informatiques exigent des mots de passe d'au moins **15** caractères et soient verrouillés après **5** tentatives de connexion infructueuses. Tous les autres comptes d'utilisateur du domaine doivent conserver les paramètres de la stratégie Default Domain Policy. Vous êtes membre du groupe Domain Admins.
