id: az802-sr1-rid-seize
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso, Ltd. has an Active Directory Domain Services (AD DS) domain named **contoso.com** that contains three domain controllers named **DC1**, **DC2**, and **DC3**. All the domain controllers run Windows Server 2025. DC1 holds the **RID master** role.

    DC1 suffers a hardware failure. The company decides to decommission DC1, and DC1 will never be brought back online. DC2 and DC3 are healthy and replicate with each other.

    You sign in to DC2 as a member of the Domain Admins group. You need to ensure that DC2 holds the RID master role.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso, Ltd. dispose d'un domaine Active Directory Domain Services (AD DS) nommé **contoso.com** qui contient trois contrôleurs de domaine nommés **DC1**, **DC2** et **DC3**. Tous les contrôleurs de domaine exécutent Windows Server 2025. DC1 détient le rôle **maître RID** (RID master).

    DC1 subit une panne matérielle. L'entreprise décide de mettre DC1 hors service, et DC1 ne sera jamais remis en ligne. DC2 et DC3 sont sains et se répliquent entre eux.

    Vous vous connectez à DC2 en tant que membre du groupe Domain Admins. Vous devez faire en sorte que DC2 détienne le rôle maître RID.
