id: az802-sr2-dns-subnet-policy
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Your network contains a DNS server named **DNS1** that runs Windows Server 2022 and has a single network interface with the IP address **10.10.0.53**. DNS1 hosts a standard primary zone named **contoso.com** that contains many records, including an A record named **app** that resolves to **10.10.5.10**.

    The headquarters clients use the **10.10.0.0/16** subnet and the clients of a branch office named Branch1 use the **10.20.0.0/16** subnet. All the clients use DNS1 directly as their only DNS server.

    You need to ensure that the Branch1 clients resolve **app.contoso.com** to **10.20.5.10**. All the other names of contoso.com, and app.contoso.com for all the other clients, must resolve as they do today.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Votre réseau contient un serveur DNS nommé **DNS1** qui exécute Windows Server 2022 et possède une seule interface réseau avec l'adresse IP **10.10.0.53**. DNS1 héberge une zone principale standard nommée **contoso.com** qui contient de nombreux enregistrements, dont un enregistrement A nommé **app** qui est résolu en **10.10.5.10**.

    Les clients du siège utilisent le sous-réseau **10.10.0.0/16** et les clients d'une succursale nommée Branch1 utilisent le sous-réseau **10.20.0.0/16**. Tous les clients utilisent directement DNS1 comme seul serveur DNS.

    Vous devez vous assurer que les clients de Branch1 résolvent **app.contoso.com** en **10.20.5.10**. Tous les autres noms de contoso.com, ainsi que app.contoso.com pour tous les autres clients, doivent être résolus comme aujourd'hui.
