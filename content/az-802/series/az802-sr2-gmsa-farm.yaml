id: az802-sr2-gmsa-farm
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Your network contains an Active Directory Domain Services (AD DS) domain named **contoso.com**. The domain and forest functional levels are Windows Server 2016. A Key Distribution Service (KDS) root key was created in the forest two weeks ago, and AD DS replication is healthy.

    The domain contains three member servers named **Web1**, **Web2** and **Web3** that run Windows Server 2022. The servers are members of a global security group named **WebServers** and host a Windows service named **App1** behind Network Load Balancing.

    You need to configure App1 to run under the same domain identity on Web1, Web2 and Web3. The password of the identity must be changed automatically, without administrator intervention.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Votre réseau contient un domaine Active Directory Domain Services (AD DS) nommé **contoso.com**. Les niveaux fonctionnels du domaine et de la forêt sont Windows Server 2016. Une clé racine KDS (Key Distribution Service) a été créée dans la forêt il y a deux semaines, et la réplication AD DS est saine.

    Le domaine contient trois serveurs membres nommés **Web1**, **Web2** et **Web3** qui exécutent Windows Server 2022. Les serveurs sont membres d'un groupe de sécurité global nommé **WebServers** et hébergent un service Windows nommé **App1** derrière l'équilibrage de la charge réseau (NLB).

    Vous devez configurer App1 pour qu'il s'exécute sous la même identité de domaine sur Web1, Web2 et Web3. Le mot de passe de cette identité doit être changé automatiquement, sans intervention d'un administrateur.
