id: az802-sr1-sales-ou
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has a single-domain AD DS forest named **northwind.com**. The forest functional level is Windows Server 2016. Active Directory Recycle Bin was enabled in 2024, and the deleted object lifetime uses the default value.

    Three days ago, an administrator accidentally deleted an organizational unit (OU) named **Sales**. The Sales OU contained 25 user accounts and no other objects.

    You need to restore the Sales OU to its original location and restore the 25 user accounts to the Sales OU with their group memberships. No domain controller can be restarted.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose d'une forêt AD DS à domaine unique nommée **northwind.com**. Le niveau fonctionnel de la forêt est Windows Server 2016. La Corbeille Active Directory a été activée en 2024, et la durée de vie des objets supprimés utilise la valeur par défaut.

    Il y a trois jours, un administrateur a supprimé par erreur une unité d'organisation (UO) nommée **Sales**. L'UO Sales contenait 25 comptes d'utilisateur et aucun autre objet.

    Vous devez restaurer l'UO Sales à son emplacement d'origine et restaurer les 25 comptes d'utilisateur dans l'UO Sales avec leurs appartenances aux groupes. Aucun contrôleur de domaine ne peut être redémarré.
