id: az802-sr1-two-shares
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has a file server named **FS1** that runs Windows Server 2022. FS1 stores two folders named **D:\Projects** and **D:\Finance** on the same data volume.

    Tailspin Toys has an Azure subscription that contains a storage account named **sttailspin1** in the West Europe region. sttailspin1 contains two Azure file shares named **projects** and **finance**. The subscription also contains a Storage Sync Service named **Sync1** in the West Europe region.

    You installed the Azure File Sync agent on FS1 and registered FS1 with Sync1.

    You need to ensure that D:\Projects syncs with the projects file share and that D:\Finance syncs with the finance file share. The content of the two folders must remain separate.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'un serveur de fichiers nommé **FS1** qui exécute Windows Server 2022. FS1 stocke deux dossiers nommés **D:\Projects** et **D:\Finance** sur le même volume de données.

    Tailspin Toys dispose d'un abonnement Azure qui contient un compte de stockage nommé **sttailspin1** dans la région West Europe. sttailspin1 contient deux partages de fichiers Azure nommés **projects** et **finance**. L'abonnement contient également un service de synchronisation de stockage (Storage Sync Service) nommé **Sync1** dans la région West Europe.

    Vous avez installé l'agent Azure File Sync sur FS1 et inscrit FS1 auprès de Sync1.

    Vous devez faire en sorte que D:\Projects se synchronise avec le partage de fichiers projects et que D:\Finance se synchronise avec le partage de fichiers finance. Le contenu des deux dossiers doit rester séparé.
