# Google Cloud Professional Cloud Architect (gcp-pca)
# Everything describing the exam is data: changing it requires no code change.
# Sources (checked on 2026-11-27):
#   - Certification page: https://cloud.google.com/learn/certification/cloud-architect (standard exam: 2 hours,
#     50–60 questions, multiple choice and multiple select, $200, English and Japanese, 2 case studies per exam making
#     up 20–30 % of the questions, shown on a split screen; online or test-centre proctoring; valid 2 years; no
#     prerequisite; 3+ years of industry experience including 1+ year on Google Cloud recommended).
#   - Exam guide (standard): services.google.com/fh/files/misc/professional_cloud_architect_exam_guide_english.pdf
#     (no date printed): sections ~25 / ~17.5 / ~17.5 / ~15 / ~12.5 / ~12.5 %, four published case studies
#     (Altostrat Media, Cymbal Retail, EHR Healthcare, KnightMotives Automotive).
# Google publishes a pass/fail result, no score and no passing score: the mock exam scores in percent and passes at
# 70 % (Certidrill's assumption, stated in the results screen like the CNCF score note).
# Case studies: Google's four published case studies are read by candidates before the exam. Certidrill does NOT
# reproduce them: its case studies are original, in the same format (company overview, solution concept, existing
# technical environment, business and technical requirements, executive statement).
# Languages offered by the vendor: English and Japanese -> Certidrill: English only.
# Readiness and progression: the KCNA rules moved to a 70 % pass mark (minScore 76, scale 55–82, mastery 62/70/82).
# active: false until the bank and the course are reviewed and published.
certification:
  code: gcp-pca
  title: Google Cloud Professional Cloud Architect
  vendor: Google Cloud
  languages: [en]
  active: false
blueprint:
  version: '2026-11-27'
  durationMin: 120
  questionCount:
    min: 50
    max: 60
  passScore: 70
  maxScore: 100
  # Google gives no partial credit information for multiple select: scored as a whole.
  scoring:
    multi: all_or_nothing
    dragdrop: all_or_nothing
  typeMix:
    single:
      min: 0.75
      max: 0.85
    multi:
      min: 0.15
      max: 0.25
  difficultyMix:
    easy: 0.2
    medium: 0.5
    hard: 0.3
  structure:
    caseStudies:
      count:
        min: 2
        max: 2
      questionsEach:
        min: 5
        max: 8
      placement: random
    series:
      count:
        min: 0
        max: 0
      questionsEach:
        min: 0
        max: 0
    maxPerObjective: 2
    warningsMin:
    - 10
    - 5
    readiness:
      minAttempts: 3
      consecutive: 3
      minScore: 76
      domainFloor: 62
      recent: 3
      window: 5
      scale:
        from: 55
        to: 82
      weights:
        level: 0.5
        consistency: 0.2
        domains: 0.2
        freshness: 0.1
      bands:
        progressing: 50
        almost: 70
        ready: 85
      freshness:
        staleDays: 30
        zeroDays: 90
        minNewShare: 0.5
    progression:
      xp:
        base: 50
        scoreFrom: 40
        perPoint: 5
        knownShare: 0.5
        passBonus: 100
        bestBonus: 75
        domainBonus: 50
        domainGain: 5
      levels:
      - xp: 0
        title:
          en: Console clicker
      - xp: 150
        title:
          en: Project planner
      - xp: 400
        title:
          en: VPC drawer
      - xp: 750
        title:
          en: IAM binder
      - xp: 1200
        title:
          en: Load balancer tuner
      - xp: 1750
        title:
          en: Migration mapper
      - xp: 2400
        title:
          en: Resilience designer
      - xp: 3150
        title:
          en: Cost optimizer
      - xp: 4000
        title:
          en: Solution architect
      - xp: 5000
        title:
          en: Cloud architect
      mastery:
        bronze: 62
        silver: 70
        gold: 82
      badges:
        hatTrick:
          count: 3
          min: 76
        regular:
          weeks: 4
        comeback:
          gain: 15
domains:
- code: design
  order: 1
  weight: {min: 0.25, max: 0.25}
  title:
    en: Designing and planning a cloud solution architecture
- code: provisioning
  order: 2
  weight: {min: 0.175, max: 0.175}
  title:
    en: Managing and provisioning a cloud solution infrastructure
- code: security
  order: 3
  weight: {min: 0.175, max: 0.175}
  title:
    en: Designing for security and compliance
- code: processes
  order: 4
  weight: {min: 0.15, max: 0.15}
