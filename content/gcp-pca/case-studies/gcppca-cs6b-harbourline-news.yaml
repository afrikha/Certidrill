id: gcppca-cs6b-harbourline-news
status: draft
title:
  en: Harbourline News Group
tabs:
  - key: overview
    title: { en: "Company overview" }
    body:
      en: |
        Harbourline News Group is a news publisher headquartered in Manchester, with 2,600 employees. It publishes a national news site, 12 regional titles and a mobile app, read by 38 million people a month in the United Kingdom and Ireland. It has 420,000 digital subscribers.

        Half of Harbourline's revenue comes from advertising sold by its own ad platform, Harbourline Ads, which serves 3 billion ad impressions a month for 1,200 advertisers that book campaigns directly with Harbourline.
  - key: solution
    title: { en: "Solution concept" }
    body:
      en: |
        Harbourline will move its websites and its ad platform to Google Cloud, in the `europe-west2` region:

        - The content management system (CMS) will render article pages behind a global external Application Load Balancer with Cloud CDN.
        - The ad selection service will run on GKE.
        - Ad events will be stored in BigQuery, and large advertisers will be able to measure their campaigns against Harbourline's audience data.
        - A new archive product will offer summaries and topic tags for 1.9 million historical articles, generated with Gemini models.
  - key: existing
    title: { en: "Existing technical environment" }
    body:
      en: |
        **Websites**

        The CMS runs on 12 virtual machines in a London colocation datacenter and renders every article page on each request. A third-party CDN caches only images. When a major story breaks, traffic rises 15 times within five minutes; twice last year the CMS servers were saturated and the sites went down. Editors publish about 40 new articles and updates an hour, including corrections that must reach readers quickly.

        Article pages are the same for all anonymous readers. For signed-in subscribers, the CMS currently renders the subscriber's name and account menu in the page header.

        **Ad selection**

        For each ad slot of a page, the ad selection service chooses a booked campaign within 40 ms, based on targeting rules and on the pacing counters of each campaign. Last quarter, a new version of the ranking model was rolled out to 10 % of the traffic. For two days, it under-delivered campaigns by 18 %, and Harbourline refunded the affected advertisers.

        **Ad events**

        Impression and click events, which include the reader's IP address and device identifier, are kept for five years in an on-premises Hadoop cluster. Campaign reports are computed from them every night.

        **Advertiser measurement**

        Large advertisers, such as retailers and banks, want to know how many of their customers Harbourline's campaigns reached. Harbourline's data protection officer refuses to send subscriber lists to advertisers, and the advertisers refuse to send their customer lists to Harbourline.

        **Archive**

        The text of 1.9 million articles published between 1890 and 2015 was digitized and stored in a BigQuery table, one row per article.
  - key: business
    title: { en: "Business requirements" }
    body:
      en: |
        - Keep the sites available when a major story breaks, show corrections to readers within 2 minutes of publication, and keep serving cached articles if the CMS is unavailable for a few minutes.
        - Never show a subscriber's personal information to another reader.
        - Validate every new version of the ad selection service against real production traffic before it can affect any ad that is served.
        - Let advertisers measure the overlap between their customers and Harbourline's audience without either party seeing the other party's individual records. Advertisers pay for their own analysis.
        - Delete raw ad events no later than 14 months after collection. Keep aggregated campaign reports, which contain no personal data, for five years.
        - Launch the archive product within six weeks, at the lowest possible cost. Summaries are generated once; there is no real-time requirement.
  - key: technical
    title: { en: "Technical requirements" }
    body:
      en: |
        - In the new site design, the browser loads the personalized header of signed-in subscribers from a separate account API; article pages contain no personal information.
        - The ad selection service runs on GKE, behind the global external Application Load Balancer, with standalone zonal network endpoint groups (NEGs). The platform team manages the URL map of the load balancer directly. Each version of the service is a separate backend service.
        - A version under validation must not update the pacing counters of the campaigns; it writes its decisions to a BigQuery table for comparison.
        - Raw ad events land in BigQuery tables partitioned by day.
        - Use Gemini models through Gemini Enterprise Agent Platform, without operating model-serving infrastructure.
        - Minimize operational overhead.
  - key: executive
    title: { en: "Executive statement" }
    body:
      en: |
        "Our biggest stories are the moments when our sites fail and our ad platform makes mistakes that cost us money. We need sites that get stronger as traffic grows, an ad platform we can change without gambling with advertisers' budgets, and a way to prove our value to advertisers without ever handing over our readers' data." — Chief Executive Officer, Harbourline News Group
