id: gcppca-cs2c-quillon
status: draft
title:
  en: Quillon Therapeutics
tabs:
  - key: overview
    title: { en: "Company overview" }
    body:
      en: |
        Quillon Therapeutics is a pharmaceutical research company headquartered in Boston, Massachusetts, with 900 employees. It discovers and develops treatments for rare neuromuscular diseases. Its research combines structural biology, large-scale molecular simulations and clinical trials; two candidate drugs are in Phase II trials. Quillon works with about 30 university laboratories that test compounds and share assay results with its scientists.
  - key: solution
    title: { en: "Solution concept" }
    body:
      en: |
        Quillon will build a research computing platform on Google Cloud in the `us-east4` region. The platform will store the imaging data of its microscopes, run its molecular simulation campaigns, host the analysis of clinical trial data, and publish its partner portal to university collaborators. Because some of these systems support regulated activities, the platform must follow Quillon's good practice (GxP) quality procedures.
  - key: existing
    title: { en: "Existing technical environment" }
    body:
      en: |
        **Imaging.** Cryo-electron microscopes in the Boston laboratory produce 1 to 2 TB of images every day, in files of 200 MB to 4 GB. An archive of 250 TB is stored on an on-premises NAS whose support contract ends in eight weeks. The laboratory's internet link is 1 Gbps, but at most 300 Mbps can be used for data transfers without disrupting laboratory operations. The link will not be upgraded, and Quillon has no presence in a colocation facility.

        **Image access.** Scientists read a new dataset intensively for four to six weeks. Afterwards most datasets are rarely read, but scientists reopen old datasets at unpredictable times when a new target protein is studied. Images must be kept for 15 years.

        **Simulations.** A 200-node on-premises cluster runs molecular dynamics campaigns four times a year. Each campaign has 20,000 independent jobs; each job runs for two to six hours on 32 vCPUs and writes a checkpoint every 15 minutes. A campaign coordinator, a single virtual machine with a PostgreSQL database, assigns the jobs and tracks their state; if it stops, the whole campaign stops.

        **Clinical trial data.** A contract research organization delivers trial data as CSV files that contain patient identifiers such as the subject number, initials and date of birth. Today, only two statisticians are allowed to open these files.

        **Partner portal.** The **AssayHub** web application lets university collaborators upload and read assay results. Collaborators reach it through a VPN with accounts that are shared by each laboratory. Each collaborator has a Google Account managed by their university's Google Workspace.

        **Infrastructure management.** Two administrators make infrastructure changes by hand in consoles. During the last audit, the quality assurance team could not show which changes had been made to a validated system, by whom, or who had approved them.
  - key: business
    title: { en: "Business requirements" }
    body:
      en: |
        - Move the image archive to Google Cloud within six weeks so that the NAS can be decommissioned.
        - Minimize the storage cost of images without restricting scientists' access to old datasets and without unpredictable retrieval charges.
        - Cut the cost of each simulation campaign by at least 60 % while finishing a campaign within 10 days.
        - Let data scientists analyze trial data without seeing patient identities. The pharmacovigilance team must be able to identify a patient when a serious adverse event requires it.
        - Give collaborators access to AssayHub without a VPN and without shared accounts, and make it possible to revoke one person's access.
        - Every change to the infrastructure of a validated system must be reviewed, approved, traceable and reproducible between the qualification and production environments.
  - key: technical
    title: { en: "Technical requirements" }
    body:
      en: |
        - Images will be stored in Cloud Storage in `us-east4`. The storage team will not write or maintain rules that move objects between storage classes.
        - Simulation jobs will run on Compute Engine. A job that is interrupted can restart from its last checkpoint; checkpoints will be written to Cloud Storage. The campaign coordinator must not be interrupted.
        - Trial datasets will be loaded into BigQuery. Data scientists must be able to join records of the same patient across datasets and across deliveries.
        - AssayHub will run on a managed instance group of Compute Engine virtual machines in `us-east4` and must be reachable over HTTPS.
        - Infrastructure will be described as Terraform configurations. Prefer managed services to self-hosted tools.
  - key: executive
    title: { en: "Executive statement" }
    body:
      en: |
        "Our scientists spend too much time waiting for compute and too little time doing science, and our partners still share VPN passwords to work with us. I want elastic computing that costs us only what our research actually uses, data that our collaborators and data scientists can reach safely, and a platform our quality team can defend in front of any auditor." — Chief Scientific Officer, Quillon Therapeutics
