id: gcppca-cs1b-halden-mutual
status: draft
title:
  en: Halden Mutual Insurance
tabs:
  - key: overview
    title: { en: "Company overview" }
    body:
      en: |
        Halden Mutual is a property and motor insurer owned by its 3.1 million policyholders in Germany and Austria. It has 6,500 employees and handles about 900,000 claims per year. Halden Mutual is supervised by the national insurance regulator, which audits it every year.
  - key: solution
    title: { en: "Solution concept" }
    body:
      en: |
        Halden Mutual will close its Munich datacenter and move to Google Cloud in two phases:

        1. Move the existing virtual machines to Google Cloud quickly, without changing them.
        2. Build a new claims intake API on Cloud Run with a Cloud SQL for PostgreSQL database, and replace the on-premises data warehouse with BigQuery for fraud analytics.

        The organization in Google Cloud has two folders, **Insurance-Prod** and **Insurance-NonProd**. Developers can also create sandbox projects directly under the organization node. The claims data will be stored in BigQuery datasets and Cloud Storage buckets of a project named **claims-data-prod**, in the europe-west3 region.
  - key: existing
    title: { en: "Existing technical environment" }
    body:
      en: |
        **Munich datacenter**

        The datacenter runs 650 virtual machines (Windows Server and Red Hat Enterprise Linux) on VMware vSphere 7 with NSX. The policy administration system is supplied by a vendor that supports it only on VMware vSphere. About 40 partner systems, such as repair shops and loss adjusters, reach Halden Mutual's applications through firewalls that allow specific IP addresses.

        **Network**

        Halden Mutual's network provider has routers in two colocation facilities in two different metropolitan areas. Each facility is a Dedicated Interconnect location with two edge availability domains.

        **Data**

        - Claims documents and photos: 300 TB on a NAS. They contain personal data of policyholders and third parties.
        - Data warehouse: an on-premises relational database used by 60 fraud analysts.
  - key: business
    title: { en: "Business requirements" }
    body:
      en: |
        - Leave the Munich datacenter within 10 months.
        - Keep the policy administration system on a platform that its vendor supports.
        - Avoid any change for the partner systems during the migration.
        - Meet the regulator's requirement that the data of every project of the organization, including sandbox projects, is stored in the European Union, with the least administrative effort.
        - Prove to the regulator that claims data cannot be copied out of the claims environment, even by an employee whose credentials are valid.
  - key: technical
    title: { en: "Technical requirements" }
    body:
      en: |
        **Connectivity**

        - Connect the on-premises network to Google Cloud with private connections that do not cross the public internet.
        - Obtain a 99.99 % availability SLA, and keep the connectivity available if one metropolitan area loses all its connections.

        **Claims data protection**

        - Analysts must access the claims data in BigQuery and Cloud Storage only from the corporate network.
        - BigQuery and Cloud Storage must encrypt the claims data with customer-managed encryption keys (CMEK) that are rotated every 90 days.
        - The security team manages the keys and must have no access to the claims data. Neither the claims platform team nor the analysts may manage the keys or use them directly.

        **Claims intake API**

        - The Cloud SQL database runs in europe-west3 and must have a recovery point objective (RPO) of 5 minutes and a recovery time objective (RTO) of 1 hour if the region becomes unavailable.
        - The application must keep the same database connection configuration after a regional failover.
        - A disaster recovery test every quarter must move the database to europe-west4 and back to europe-west3 without data loss.
  - key: executive
    title: { en: "Executive statement" }
    body:
      en: |
        "Our datacenter lease will not be renewed, so the first phase must be fast and safe. After that, the cloud must make us better at paying claims and catching fraud. None of this matters if we lose the trust of our policyholders or of our regulator, so data protection is not negotiable." — Chief Executive Officer, Halden Mutual Insurance
