id: gcppca-cs3b-norvale-revenue
status: draft
title:
  en: Norvale Revenue Authority
tabs:
  - key: overview
    title: { en: "Company overview" }
    body:
      en: |
        The Norvale Revenue Authority (NRA) is the national tax administration of Norvale, a member state of the European Union. Its 4,200 staff collect income tax and value-added tax from 7 million individual taxpayers and 650,000 businesses.

        Income tax returns are due on 30 April. Seventy percent of the returns are filed in the six weeks before the deadline, and on the last day the e-filing portal receives 40 times its average traffic.
  - key: solution
    title: { en: "Solution concept" }
    body:
      en: |
        The NRA will move its e-filing portal and its taxpayer data to Google Cloud, in the `europe-west3` region:

        - The portal will run on a managed container platform behind a global external Application Load Balancer.
        - Risk analysts will use BigQuery to detect fraud.
        - Filed returns and their attachments will be stored in Cloud Storage.

        The NRA will keep control of the encryption keys that protect taxpayer data.
  - key: existing
    title: { en: "Existing technical environment" }
    body:
      en: |
        **Datacenters**

        The NRA runs two government-owned datacenters. Both are connected by Dedicated Interconnect to a VPC network in `europe-west3`.

        **E-filing portal**

        The portal consists of 14 stateless Java services packaged as container images. They run on virtual machines sized for the last day before the deadline, which are almost idle for ten months of the year. The development team of nine engineers has no Kubernetes experience, and the NRA has no team to operate clusters.

        **Sign-in**

        Taxpayers sign in to the portal with the national electronic ID. During the last filing season, automated clients sent thousands of sign-in attempts per minute, each from a single IP address, and slowed the portal down for every taxpayer.

        **Keys**

        The NRA operates a key manager from one of the partners supported by Cloud External Key Manager in both of its datacenters. The key manager is reachable only from the NRA's private network. The national cybersecurity regulation forbids sending key requests over the internet.

        **Returns archive**

        About 400 TB of scanned paper returns, PDF returns and attachments are stored on a NAS. An amended return or a new attachment can be added up to four years after the end of the tax year.
  - key: business
    title: { en: "Business requirements" }
    body:
      en: |
        - Pay for the portal in proportion to its traffic, without infrastructure for the development team to operate.
        - Keep the portal responsive for taxpayers during automated sign-in attacks.
        - Keep control of the keys: the key material must never leave the NRA's key manager, and the NRA must be able to stop all decryption of taxpayer data at any time.
        - Keep each return and its attachments until 10 years after the end of their tax year, and delete them when that period ends.
  - key: technical
    title: { en: "Technical requirements" }
    body:
      en: |
        - The portal services must run as containers and scale from a few instances to 40 times the average load.
        - Any client IP address that sends more than 60 requests to the sign-in page in one minute must be blocked for 30 minutes before its requests reach the portal. Other clients must not be affected.
        - Taxpayer data must be stored in `europe-west3`. BigQuery datasets and Cloud Storage buckets that hold taxpayer data must use customer-managed encryption keys, and no key request between Google Cloud and the key manager may cross the internet.
        - Returns of every tax year are stored in one bucket. Nobody, including the NRA's administrators, can delete a document or shorten its retention before the end of its retention period.
  - key: executive
    title: { en: "Executive statement" }
    body:
      en: |
        "Every spring, the whole country files its taxes in a few weeks, and every year we pay all year round for those few weeks. Taxpayers trust us with their most sensitive information, so we must be able to prove that we alone hold the keys to it, and that no record disappears before the law allows." — Commissioner General, Norvale Revenue Authority
