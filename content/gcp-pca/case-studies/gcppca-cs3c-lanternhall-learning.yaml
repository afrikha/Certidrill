id: gcppca-cs3c-lanternhall-learning
status: draft
title:
  en: Lanternhall Learning
tabs:
  - key: overview
    title: { en: "Company overview" }
    body:
      en: |
        Lanternhall Learning runs an online learning platform used by 5.5 million learners in 60 countries. It hosts online degrees and certificates for 140 partner universities, and its own short courses for independent learners. Programming courses make up a third of its enrollments.

        Lanternhall has run on Google Cloud since 2021. It plans to double its number of partner universities in three years.
  - key: solution
    title: { en: "Solution concept" }
    body:
      en: |
        Lanternhall will extend its platform with:

        - Single sign-on for the students of each partner university.
        - A new code grading service for programming assignments.
        - Captions for its whole lecture archive.
        - **Lantern**, an AI tutor that answers learners' questions about their courses.

        Lanternhall also wants its analytics costs under control.
  - key: existing
    title: { en: "Existing technical environment" }
    body:
      en: |
        **Platform**

        The platform runs on GKE Standard clusters in `us-central1` and `europe-west1`. The platform team manages the node pools, and deploys every workload with Helm charts.

        **Sign-in**

        Learners sign in with an email address and a password stored in Lanternhall's own user database. For each university, Lanternhall maintains a custom SAML integration with the university's identity provider; adding a university takes about six weeks of development.

        **Code grading**

        Learners submit code in Python, Java and C. Each submission is compiled, run and graded on its own Compute Engine VM, created for the submission and deleted afterward. Starting a VM takes about 90 seconds. Near assignment deadlines, up to 20,000 submissions arrive in ten minutes.

        **Lecture archive**

        About 60,000 hours of recorded lectures, 45 to 120 minutes each, are stored in Cloud Storage; each recording has a video file and a FLAC audio file. They are in about 30 languages, and the metadata of each recording gives its language. None of them has captions.

        **Analytics**

        Analysts query learning data in BigQuery with on-demand pricing. Over the last year, the monthly BigQuery bill varied by a factor of three.

        **Lantern prototype**

        The prototype of Lantern calls a Gemini model on Gemini Enterprise Agent Platform. Its system instructions include the course materials, including the answer keys of graded quizzes. During testing, learners got the tutor to reveal answer keys by asking it to ignore its instructions, and the tutor repeated phone numbers and national ID numbers that learners had pasted into their questions.
  - key: business
    title: { en: "Business requirements" }
    body:
      en: |
        - Onboard a new partner university in days, not weeks. Each university's administrators must manage only their own students.
        - Return grading results within 30 seconds of a submission, even near deadlines.
        - Publish captions for every recorded lecture in the language of the lecture, to meet accessibility law, with minimal development effort.
        - Give the finance team a fixed monthly analytics cost.
        - Protect the integrity of graded quizzes and the personal data of learners in Lantern.
  - key: technical
    title: { en: "Technical requirements" }
    body:
      en: |
        - Students of a partner university sign in with their university's SAML identity provider; independent learners keep signing in with an email address and a password. Lanternhall does not want to build or maintain its own identity federation code.
        - Submitted code is untrusted: it must not be able to interact directly with the kernel of the node that runs it.
        - The grading service must run as Kubernetes Jobs deployed with the existing Helm charts, and the platform team does not want to manage nodes for new workloads.
        - Captions must be WebVTT files stored in Cloud Storage next to each recording, and no model may be trained or fine-tuned.
        - Analytics queries may run slower during busy periods, but no query may be rejected because of a cost control.
        - Every learner question must be screened for prompt injection and jailbreak attempts before it reaches the model, and every answer must be screened for personal data before it reaches the learner.
  - key: executive
    title: { en: "Executive statement" }
    body:
      en: |
        "Universities choose us because we let them put a degree online in a semester. Each manual integration, each slow grade and each surprise on the bill works against that promise. As we add AI to our courses, we must be able to show universities that their exams and their students' data are safe with us." — Chief Executive Officer, Lanternhall Learning
