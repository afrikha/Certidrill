id: gcppca-cs7b-veldhaven-genomics
status: draft
title:
  en: Veldhaven Institute for Genome Research
tabs:
  - key: overview
    title: { en: "Company overview" }
    body:
      en: |
        The Veldhaven Institute for Genome Research is a non-profit research institute in the Netherlands, with 650 staff in 40 research groups. Its sequencing facility runs six high-throughput sequencers. Veldhaven leads a European rare disease programme that has sequenced the genomes of 120,000 participants, and it shares the programme's data with a consortium of 12 university hospitals in the European Union.

        Each research group is funded by grants. Funders require each grant's spending to stay within its allocation.
  - key: solution
    title: { en: "Solution concept" }
    body:
      en: |
        Veldhaven will move its genomics analysis to Google Cloud in the `europe-west4` region and retire its on-premises compute cluster within two years:

        - Raw sequencing files and pipeline outputs will be stored in Cloud Storage.
        - The analysis pipelines will run on Google Cloud.
        - The programme's variant data will be stored in BigQuery and made available to the consortium partners.
        - Each grant will have its own Google Cloud project.
  - key: existing
    title: { en: "Existing technical environment" }
    body:
      en: |
        **Sequencing data**

        The sequencers produce about 8 TB of raw files every day. The files are written to an on-premises NAS and copied to tape every night. Last year, a cleanup script deleted the folders of 200 sequencing runs; restoring them from tape took three weeks, and the samples could not be sequenced again.

        **Compute**

        The analysis pipelines are written in Nextflow, and each step runs a container image of a bioinformatics tool. Each task runs for 20 minutes to 3 hours and can be rerun from its input files without side effects. The pipelines run on a 140-node Slurm cluster whose queue is four weeks long. The research computing team has four people, who spend most of their time patching and repairing nodes.

        **Pipeline changes**

        Bioinformaticians update tool versions themselves and push the images with tags such as `latest`. Last year, a tool update changed the variant calls without anyone noticing; 900 participant samples had to be analyzed again.

        **Consortium data**

        Veldhaven sends copies of variant files to consortium partners over SFTP and no longer knows how many copies exist. Each partner has its own Google Cloud organization.
  - key: business
    title: { en: "Business requirements" }
    body:
      en: |
        - Return the results of a clinical research sample within five days of sequencing.
        - Consortium partners query the programme's variant data, pay for their own queries, and never get a copy of the data. Veldhaven ends a partner's access when the partner's approval by the data access committee ends.
        - When a grant reaches its allocation, its compute workloads stop automatically; its data in Cloud Storage and BigQuery is kept.
        - Validate every change to a pipeline against reference samples with known variants before the changed pipeline analyzes any participant sample.
        - When a participant withdraws consent, delete the participant's raw files within 60 days.
        - Keep all participant data in the European Union.
  - key: technical
    title: { en: "Technical requirements" }
    body:
      en: |
        - No compute cluster to operate or patch, and no compute cost when no pipeline runs. Keep the compute cost as low as possible.
        - Keep the Nextflow pipelines.
        - A deleted or overwritten raw file must be recoverable for 30 days, even if its whole bucket is deleted.
        - The loss of a Google Cloud region must not lose raw files written more than 15 minutes before the outage.
  - key: executive
    title: { en: "Executive statement" }
    body:
      en: |
        "Our participants gave us their genomes to help find diagnoses for children who have none. We owe them two things: results that our clinicians can trust, and data that never leaves our control. I want our scientists to wait for answers, not for a free slot on a cluster." — Director, Veldhaven Institute for Genome Research
