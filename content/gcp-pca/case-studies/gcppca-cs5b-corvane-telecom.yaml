id: gcppca-cs5b-corvane-telecom
status: draft
title:
  en: Corvane Telecom
tabs:
  - key: overview
    title: { en: "Company overview" }
    body:
      en: |
        Corvane Telecom is a mobile and fixed-line operator in Spain and Portugal, with 7,000 employees, 11 million mobile subscribers and 2.4 million broadband customers. It also sells IoT connectivity to logistics and utility companies, a business that is growing quickly.

        Corvane wants to close its two corporate datacenters by the end of 2028 and launch a new packet core for its IoT customers. Its switching sites and their network equipment stay on-premises.
  - key: solution
    title: { en: "Solution concept" }
    body:
      en: |
        Corvane will run its IT workloads in a primary and a secondary Google Cloud region in the EU, both of which offer every service that the design uses:

        - The billing system will move to Google Cloud without changes to its code.
        - Call detail records (CDRs) will be collected in Cloud Storage by the on-premises mediation servers.
        - The IoT packet core will run as containerized network functions (CNFs) on GKE.
        - The switching sites will connect to Google Cloud through Corvane's routers in two colocation facilities.
  - key: existing
    title: { en: "Existing technical environment" }
    body:
      en: |
        **Billing**

        The billing application runs on Linux VMs and uses an Oracle Database 19c database of 60 TB on a four-node Oracle Real Application Clusters (RAC) system on Oracle Exadata in the Madrid datacenter. The billing logic is mostly written in PL/SQL. Corvane owns Oracle Database Enterprise Edition and RAC licenses, with a support contract that runs until 2029. Today, a Data Guard standby in a second datacenter is used for disaster recovery.

        **Mediation**

        Twenty-four Linux mediation servers in the switching sites collect CDRs from the network elements and upload files every five minutes. Each server has an X.509 client certificate issued by an issuing CA of Corvane's internal PKI, under Corvane's root CA. Certificates are valid for one year and are renewed automatically.

        **Network**

        Corvane has routers with 100-Gbps ports in two colocation facilities where Dedicated Interconnect is available. The traffic between the switching sites and Google Cloud will reach up to 140 Gbps at month end.

        **IoT packet core**

        The packet core vendor delivers its user plane function and session management function as CNFs for Kubernetes. Each user plane Pod needs one interface for signalling and management traffic and a separate interface for subscriber traffic, which uses DPDK. The vendor's design requires each of these interfaces to be in its own VPC network.
  - key: business
    title: { en: "Business requirements" }
    body:
      en: |
        - Move the billing system without rewriting it, and reuse the Oracle licenses that Corvane already pays support for.
        - Pay for all cloud services, including database services, through one Google Cloud invoice.
        - After the loss of the primary region, restore billing within 4 hours with no more than 15 minutes of data loss. The telecom regulator requires a disaster recovery test twice a year.
        - Launch the IoT packet core within nine months.
  - key: technical
    title: { en: "Technical requirements" }
    body:
      en: |
        - The billing database must keep running on RAC and Exadata, in the same region as the billing application VMs on Compute Engine.
        - Traffic between Corvane's routers and Google's edge routers must be encrypted at Layer 2, at the full speed of the connections. The network team does not want to operate IPsec tunnels.
        - The mediation servers must authenticate to Google Cloud with their existing certificates. No service account keys or other long-lived secrets may be stored on servers.
        - The packet core CNFs must run on GKE with the vendor's network design.
  - key: executive
    title: { en: "Executive statement" }
    body:
      en: |
        "Our network is our product, and IT should stop being the reason we launch late. We will keep what works, like a billing system that bills 13 million customers correctly every month, move it to a platform we do not have to rack and patch, and put our engineers on the IoT services our customers are asking for." — Chief Technology Officer, Corvane Telecom
