id: gcppca-cs7c-corrin-bay-transit
status: draft
title:
  en: Corrin Bay Regional Transit Authority
tabs:
  - key: overview
    title: { en: "Company overview" }
    body:
      en: |
        The Corrin Bay Regional Transit Authority (CBRTA) is the public transit agency of Corrin Bay, a metropolitan area of 2.3 million people on the west coast of the United States. It runs 1,100 buses and 90 light-rail vehicles on 140 routes, and carries 640,000 passengers on an average weekday. CBRTA is part of the city's smart-city program and uses the city's Google Cloud organization.

        CBRTA has 2,900 drivers, represented by a union, and 60 dispatchers in its Operations Control Center.
  - key: solution
    title: { en: "Solution concept" }
    body:
      en: |
        CBRTA will replace its on-premises systems with services on Google Cloud in the `us-west1` region:

        - A new computer-aided dispatch and vehicle location system (CAD/AVL) with a web dispatch console.
        - A feed generator on Cloud Run that writes the GTFS Realtime files (vehicle positions and arrival predictions) to a Cloud Storage bucket every 10 seconds. The bucket will be the only resource of a new project, `cbrta-opendata`, in the `transit` folder. Third-party apps will download the files directly from Cloud Storage.
        - A ridership data warehouse in BigQuery that receives the fare tap records.
  - key: existing
    title: { en: "Existing technical environment" }
    body:
      en: |
        **Vehicle location and dispatch**

        On-board units on every vehicle send their position every 10 seconds over the cellular network to a vendor CAD/AVL server in the Operations Control Center. Vendor support for the server ends in 14 months. The on-board units can send their positions to two destinations at the same time. Dispatchers use the CAD/AVL console to manage incidents, detours and replacement vehicles.

        **Open data**

        An on-premises server generates the GTFS Realtime feeds and publishes them on the city website. About 250 third-party apps download the feeds every 10 to 30 seconds. During last winter's snowstorm, the server could not cope with the traffic.

        **Fare data**

        Riders tap contactless fare cards on board. Each tap record contains the card number, the route, the stop and the time of the trip. Vehicles upload their tap records over Wi-Fi when they return to a depot, which can be up to five days after the trip.

        **Ridership planning**

        CBRTA keeps ten years of daily ridership per route, which will be loaded into BigQuery. The ridership planning team forecasts the demand of each route in spreadsheets. The analysts are skilled in SQL; CBRTA has no data scientists.

        **City IT policies**

        The city's IT department enforces the `storage.publicAccessPrevention` and `storage.uniformBucketLevelAccess` organization policy constraints on the organization node. CBRTA's projects are in the `transit` folder. The city will decommission its remote access VPN next year.
  - key: business
    title: { en: "Business requirements" }
    body:
      en: |
        - Publish the GTFS Realtime feeds as open data, at a stable URL that apps can read without authentication. Vehicle positions must never be more than 30 seconds old when an app reads them.
        - No other CBRTA data can be made public.
        - Delete each trip-level fare record automatically 90 days after the date of the trip, to meet the city's privacy ordinance. Keep daily ridership per route and stop indefinitely.
        - Give planners forecasts of daily ridership for each route for the next 12 weeks, including the effect of public holidays. The planners must build and refresh the forecasts themselves.
        - Replace the CAD/AVL system before vendor support ends, without disrupting service. The union agreement requires every dispatcher to be trained on a new system before using it in operations.
        - Dispatch supervisors work from home during storms. They must reach the dispatch console from city-managed laptops only, without a VPN.
  - key: technical
    title: { en: "Technical requirements" }
    body:
      en: |
        - Use managed services: CBRTA's IT team has seven people.
        - Grant any exception to a city-wide policy at the smallest possible scope.
        - The dispatch console runs on Cloud Run behind an external Application Load Balancer.
        - City-managed laptops are enrolled in the city's device management, and the city has Chrome Enterprise Premium licenses.
  - key: executive
    title: { en: "Executive statement" }
    body:
      en: |
        "Riders judge us at the bus stop: if the app says the bus is two minutes away, it had better be. We want our data to work for the public, our dispatchers to have tools that do not fail in a storm, and our riders to trust that we do not keep their travel history a day longer than the law allows." — General Manager, Corrin Bay Regional Transit Authority
