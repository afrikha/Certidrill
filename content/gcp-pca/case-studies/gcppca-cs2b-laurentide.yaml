id: gcppca-cs2b-laurentide
status: draft
title:
  en: Laurentide Savings Bank
tabs:
  - key: overview
    title: { en: "Company overview" }
    body:
      en: |
        Laurentide Savings Bank is a regional bank with 140 branches in Québec and Ontario and 1.2 million retail and small-business customers. It offers deposit accounts, mortgages, consumer loans and a mobile banking app. Laurentide's board has approved a five-year plan to move most of its applications to Google Cloud while keeping its core banking system on premises.
  - key: solution
    title: { en: "Solution concept" }
    body:
      en: |
        Laurentide will create a Google Cloud organization for all its workloads. Applications will run in the `northamerica-northeast1` (Montréal) and `northamerica-northeast2` (Toronto) regions. The bank will move its customer data warehouse to BigQuery, rehost its loan origination application on Compute Engine, and run the back end of its mobile app on Google Cloud, connected privately to the core banking system that stays in its datacenters.
  - key: existing
    title: { en: "Existing technical environment" }
    body:
      en: |
        **Datacenters.** Laurentide has a primary datacenter in Montréal and a secondary datacenter in Toronto. Both are in colocation facilities where Google Cloud offers Dedicated Interconnect. The two datacenters are linked by a private fiber circuit.

        **Core banking.** The core banking system runs on a mainframe in the Montréal datacenter and will stay on premises for at least five years. Cloud applications will call its APIs, with traffic that peaks at 15 Gbps during the nightly batch window.

        **Loan origination.** The **LoanDesk** application runs on 12 Windows Server virtual machines with SQL Server Enterprise on VMware. Laurentide owns Windows Server Datacenter licenses, and its SQL Server Enterprise core licenses are covered by Software Assurance with License Mobility rights.

        **Customer data.** A data warehouse appliance holds account, transaction and identity data for every customer. It will be replaced by BigQuery datasets and Cloud Storage buckets in a project named `prj-customer-data`.

        **Mobile banking.** The API back end of the mobile app has an availability service level objective (SLO) of 99.9 % of successful requests over 30 days. Today the on-call engineers receive an alert every time the error rate exceeds a fixed threshold for one minute, and most of these alerts resolve on their own.

        **Google Cloud.** The new organization contains only a few test projects. No production resources exist yet.
  - key: business
    title: { en: "Business requirements" }
    body:
      en: |
        - All customer data and every Google Cloud resource of the bank must stay in Canada, including in projects that will be created later.
        - Customer data must not leave the bank's controlled environment, even through users or applications that hold valid credentials.
        - The bank's records policy requires keeping the audit logs of every Google Cloud project for 12 years in a form that nobody, including organization administrators, can modify or delete before the end of the period.
        - Reduce licensing costs by reusing the licenses that Laurentide already owns wherever its license terms allow it.
        - Reduce alert fatigue for the on-call engineers without missing incidents that threaten the mobile banking SLO.
  - key: technical
    title: { en: "Technical requirements" }
    body:
      en: |
        - **Hybrid connectivity.** Private connectivity between both datacenters and Google Cloud that does not traverse the public internet, with at least 20 Gbps of capacity and a 99.99 % availability SLA. Connectivity must remain available if every connection in one metropolitan area fails.
        - **Encryption.** The keys that protect customer data in BigQuery and Cloud Storage must be generated and stored in FIPS 140-2 Level 3 validated hardware security modules located in Canada. The bank's security team must control their rotation and be able to disable them.
        - **LoanDesk.** Rehost LoanDesk on Compute Engine without changing the application. The platform team will not manage dedicated hosts or sole-tenant capacity.
        - **Audit logs.** New projects must be covered automatically. Storage costs for logs must be minimized.
        - **Mobile banking alerting.** Page the on-call engineer quickly when a severe incident is consuming the error budget fast, and open a ticket when a slower degradation would exhaust the budget before the end of the 30-day period.
  - key: executive
    title: { en: "Executive statement" }
    body:
      en: |
        "Our customers trust us with their savings, and our regulator expects us to prove at any moment where their data is and who touched it. Moving to the cloud must make those guarantees stronger, not weaker. At the same time, we cannot keep paying twice for software we already own, and our engineers should be woken up only when our customers are actually affected." — Chief Information Officer, Laurentide Savings Bank
