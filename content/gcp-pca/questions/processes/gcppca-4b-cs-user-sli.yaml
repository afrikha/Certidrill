id: gcppca-4b-cs-user-sli
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A SaaS company's largest customer complains that the web application is often slow. The company's dashboards show CPU usage below 40% on every Compute Engine instance behind its global external Application Load Balancer, so the operations team reports the service as healthy. The customer success manager wants success to be measured the way the customer experiences the service.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Create an alerting policy that fires when the CPU utilization of any instance exceeds 80%, and report the number of alerts to the customer each month." }
    - id: b
      text: { en: "Report the uptime percentage of the Compute Engine instances to the customer as the success measure of the service." }
    - id: c
      text: { en: "Increase the machine type of every instance so that the application has spare capacity for traffic peaks." }
    - id: d
      text: { en: "Define latency and success-ratio SLIs measured at the load balancer, agree on SLOs for them with the customer, and review compliance with the customer regularly." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Google recommends reliability measures that reflect what users experience, such as request latency and success ratio, collected as close to the user as possible; the load balancer is the closest point when client-side data is not available. SLOs on these SLIs, agreed with the customer, give both sides a shared definition of success.
  options:
    a:
      en: |
        CPU is a server-centric metric; the instances are already below 40% while users see slow responses, so it does not reflect the customer's experience.
    b:
      en: |
        Instances can be up while requests are slow or failing, so VM uptime does not measure what the customer experiences.
    c:
      en: |
        Bigger machines treat a symptom without measuring it; with CPU below 40%, they may not even help.
references:
  - title: Define reliability based on user-experience goals
    url: https://docs.cloud.google.com/architecture/framework/reliability/define-reliability-based-on-user-experience-goals
  - title: Concepts in service monitoring
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/slo-monitoring
