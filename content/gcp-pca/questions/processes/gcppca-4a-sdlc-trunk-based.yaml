id: gcppca-4a-sdlc-trunk-based
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company's 40 developers each work on a feature branch for several weeks. Merging the branches before the monthly release takes days and often breaks the build. Leadership wants to release small changes several times a week and to reduce merge conflicts, following the practices that DORA research associates with high software delivery performance.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Adopt trunk-based development with short-lived branches that are merged into the main branch at least daily, and hide unfinished features behind feature flags.
    - id: b
      text:
        en: |-
          Adopt a branching model with a long-lived develop branch and one release branch per sprint, and freeze the code for one week before each release.
    - id: c
      text:
        en: |-
          Keep the feature branches, and add a nightly job that rebases each feature branch on the release branch and emails the conflicts to its developer.
    - id: d
      text:
        en: |-
          Create an integration team that merges all the feature branches into the release branch during the last week of each month and fixes the conflicts.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Trunk-based development is one of the technical capabilities that DORA research links to higher delivery performance: developers work in small batches on short-lived branches and merge into the trunk frequently, at least daily, so integration problems stay small and no long merge phase or code freeze is needed. Feature flags let incomplete work be merged without exposing it to users, which enables frequent releases.
  options:
    b:
      en: |-
        Long-lived branches and code freezes keep integration late and batches large, which slows delivery instead of enabling several releases a week.
    c:
      en: |-
        The job only reports conflicts earlier; the branches still live for weeks, so integration stays late and painful.
    d:
      en: |-
        A dedicated integration team concentrates the merge pain at the end of the month and keeps monthly batches.
references:
  - title: "DevOps capabilities"
    url: https://docs.cloud.google.com/architecture/devops
