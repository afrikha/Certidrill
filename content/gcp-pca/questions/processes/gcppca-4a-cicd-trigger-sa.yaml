id: gcppca-4a-cicd-trigger-sa
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company created its Google Cloud project in 2025. Its Cloud Build triggers run as the Compute Engine default service account, which security considers too broadly privileged. Security now requires that the frontend trigger can only deploy to the frontend Cloud Run service and that the data trigger can only write to one Cloud Storage bucket.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Add a serviceAccount field to each trigger's build configuration file, and keep the triggers configured with the Compute Engine default service account.
    - id: b
      text:
        en: |-
          Remove the Editor role from the Compute Engine default service account, and grant it only the roles that the two triggers need between them.
    - id: c
      text:
        en: |-
          Create a dedicated service account for each trigger with only the roles that the trigger needs, and specify that service account in the trigger settings.
    - id: d
      text:
        en: |-
          Switch both triggers to the Cloud Build legacy service account, and grant it the roles that the two triggers need between them.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Builds started by a trigger run as the service account specified on the trigger, so a user-specified service account per trigger, with only the roles that trigger needs, gives each pipeline least privilege. Google describes a user-specified service account as the most secure option, because default service accounts may be broader than needed. Users who manage the trigger need permission to act as that service account.
  options:
    a:
      en: |-
        For triggered builds, only the service account specified on the trigger is used; a service account set in the build configuration file is ignored.
    b:
      en: |-
        One shared account would hold the permissions of both triggers, so each trigger could still do what the other one is allowed to do, and other workloads use that account too.
    d:
      en: |-
        A single legacy account shared by both triggers still combines their permissions, so neither trigger is limited to its own task.
references:
  - title: "Create and manage build triggers"
    url: https://docs.cloud.google.com/build/docs/automating-builds/create-manage-triggers
  - title: "Cloud Build default service account change"
    url: https://docs.cloud.google.com/build/docs/cloud-build-service-account-updates
