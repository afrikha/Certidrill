id: gcppca-4b-bc-turbo-replication
objective: "4.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A broadcaster stores uploaded video files in a Cloud Storage bucket. Its business continuity plan requires that, if a region becomes unavailable, at most 15 minutes of newly uploaded files be at risk. For regulatory reasons, the data must stay in two EU regions that the broadcaster chooses. The solution must not require custom replication code.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Store the files in a dual-region bucket in the two chosen EU regions, and enable turbo replication." }
    - id: b
      text: { en: "Store the files in a regional bucket and run a Storage Transfer Service job every 15 minutes to a bucket in a second EU region." }
    - id: c
      text: { en: "Store the files in a bucket in the EU multi-region, which replicates the data across several EU regions." }
    - id: d
      text: { en: "Store the files in a regional bucket with Object Versioning enabled, so that no uploaded file is lost." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A dual-region bucket stores data redundantly in two regions that you can choose, and turbo replication, available only for dual-region buckets, targets replicating newly written objects to both regions within 15 minutes. This meets the 15-minute RPO without custom code.
  options:
    b:
      en: |
        The scheduled transfers are a custom replication process to run and monitor, which the requirements exclude.
    c:
      en: |
        Default replication targets 12 hours, and Cloud Storage, not the broadcaster, chooses the data centers within a multi-region.
    d:
      en: |
        Object Versioning protects against overwrites and deletions, not against the loss of the only region that holds the data.
references:
  - title: Data availability and durability
    url: https://docs.cloud.google.com/storage/docs/availability-durability
