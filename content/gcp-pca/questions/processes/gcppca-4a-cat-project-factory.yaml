id: gcppca-4a-cat-project-factory
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A large retailer's teams request new Google Cloud projects through tickets, and the central cloud team takes two weeks to create each one by hand. Projects end up with inconsistent folders, labels, budgets, and Shared VPC attachments. The company wants project provisioning within hours, with every project created with the same guardrails and an auditable approval, and without giving the teams permission to create projects.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the Project Creator role to all developers at the organization level, and publish a wiki page that describes the required folders, labels, and budgets.
    - id: b
      text:
        en: |-
          Grant the Project Creator role to team leads on their business unit folder, and run a weekly script that reports the projects that miss labels or budgets.
    - id: c
      text:
        en: |-
          Give each team the Admin basic role on a dedicated folder, so that the team can create and configure its own projects through the console whenever it needs one.
    - id: d
      text:
        en: |-
          Have teams request projects by pull request to a Terraform project factory, applied after review by a pipeline whose service account alone can create projects.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A Terraform module that creates projects with the required folder, labels, budget, and Shared VPC attachment applies the same guardrails to every project. Teams request a project with a pull request, the review provides the auditable approval, and the pipeline applies the change with a dedicated, least-privileged service account, as in the enterprise foundations blueprint's GitOps model, so teams never hold project creation permissions.
  options:
    a:
      en: |-
        Developers would hold project creation permissions, and a wiki page does not enforce any guardrail.
    b:
      en: |-
        Team leads would create projects themselves, and a weekly report only detects inconsistencies after the fact.
    c:
      en: |-
        Admin on a folder grants project creation and much more, with no consistency or approval.
references:
  - title: "Deployment methodology"
    url: https://docs.cloud.google.com/architecture/blueprints/security-foundations/deployment-methodology
