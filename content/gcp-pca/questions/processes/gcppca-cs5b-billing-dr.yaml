id: gcppca-cs5b-billing-dr
objective: "4.1.6"
type: single
caseStudy: gcppca-cs5b-corvane-telecom
difficulty: 2
status: draft
stem:
  en: |
    After the migration, the billing database runs on RAC and Exadata in the primary region, as the technical requirements demand. You need to define the disaster recovery process for billing. The process must meet the business requirement about the loss of the primary region.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Rely on the redundancy of the Exadata infrastructure and of the RAC nodes in the primary region, and document a procedure that restarts the billing VMs in another zone of that region." } }
    - { id: b, text: { en: "Back up the database every night to object storage, and document a procedure that creates Exadata infrastructure in the secondary region and restores the latest backup after a disaster." } }
    - { id: c, text: { en: "Create standby Exadata infrastructure in the secondary region, replicate with Oracle Data Guard, keep a passive copy of the billing VMs there, and run a failover test twice a year." } }
    - { id: d, text: { en: "Extend the RAC cluster with nodes in the secondary region so that both regions serve the database, and run a test twice a year in which the primary nodes are stopped." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For a regional outage, Google's reference architecture for Oracle Exadata recommends a passive replica of the application stack in another region, with standby Exadata infrastructure and Oracle Data Guard replicating the data and failing over to the standby databases. Continuous replication keeps data loss far below 15 minutes, the passive stack can take over within 4 hours, and the twice-yearly failover tests meet the regulator's requirement and prove the procedure works.
  options:
    a:
      en: Redundancy inside the primary region protects against the loss of a server or a zone, not against the loss of the region itself.
    b:
      en: A nightly backup can lose up to 24 hours of billing data, and creating Exadata infrastructure and restoring 60 TB after the disaster puts the 4-hour recovery at risk.
    d:
      en: An Exadata VM cluster, which runs the RAC nodes, is created in the same region and zone as its Exadata infrastructure, so it cannot have nodes in the secondary region; the reference architecture protects against a regional outage with Data Guard to standby Exadata infrastructure instead.
references:
  - title: Enterprise application on Compute Engine with Oracle Exadata
    url: https://docs.cloud.google.com/architecture/enterprise-app-oracle-exadata-database-compute-engine
  - title: Create Exadata VM Cluster
    url: https://docs.cloud.google.com/oracle/database/docs/create-clusters
