id: gcppca-4a-dr-gke-backup
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs a stateful application on a GKE cluster in europe-west1. The application's state is stored in persistent volumes backed by Persistent Disk. For a regional outage, the company must be able to restore the application's Kubernetes resources and volume data into a standby cluster in europe-west4, with a managed service and scheduled backups.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Store the Kubernetes manifests in a Git repository, and apply them to the standby cluster with a CI/CD pipeline during a disaster.
    - id: b
      text:
        en: |-
          Take scheduled snapshots of the Persistent Disk volumes, and copy them to europe-west4 with a daily Cloud Scheduler job.
    - id: c
      text:
        en: |-
          Create a Backup for GKE backup plan for the application's namespaces, and a restore plan that targets the standby cluster in europe-west4.
    - id: d
      text:
        en: |-
          Install an open source Kubernetes backup tool on the cluster, and store its backups in a Cloud Storage bucket in europe-west4.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Backup for GKE is a managed service that backs up both the Kubernetes resource manifests and snapshots of Persistent Disk volumes on a schedule defined in a backup plan. A restore plan restores those backups into an existing target cluster, including a cluster in another region, which is the documented disaster recovery scenario.
  options:
    a:
      en: |-
        Manifests in Git recreate the Kubernetes resources, but not the data in the persistent volumes.
    b:
      en: |-
        Disk snapshots hold the data, but not the Kubernetes resources, and the copy job is custom work to maintain.
    d:
      en: |-
        A self-installed tool can work, but the company would operate it itself instead of using a managed service.
references:
  - title: "Backup for GKE overview"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/add-on/backup-for-gke/concepts/backup-for-gke
