id: gcppca-4b-chg-deploy-freeze
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company delivers its storefront to a production GKE cluster through a Cloud Deploy delivery pipeline. The change advisory board has approved a change freeze for production from November 20 to December 2 every year. The freeze must start and end automatically, without anyone editing the pipeline on those dates, and the on-call SRE group must still be able to push an emergency fix to production during the freeze without lifting it for the other teams.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Set `suspended: true` in the delivery pipeline configuration on November 20, and remove it on December 2 or whenever the SRE group needs to deploy an emergency fix." }
    - id: b
      text: { en: "Set `requireApproval: true` on the production target and grant `roles/clouddeploy.approver` to the on-call SRE group so that they approve only emergency fixes during the freeze." }
    - id: c
      text: { en: "Create a deploy policy with a `rolloutRestriction` rule and a time window for the freeze period that selects the production target, and grant `roles/clouddeploy.policyOverrider` to the on-call SRE group." }
    - id: d
      text: { en: "Create a Cloud Scheduler job that disables the Cloud Build trigger that creates releases on November 20 and enables it again on December 2." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Cloud Deploy deploy policy restricts rollout actions on the selected pipelines or targets during the time windows it defines, so the freeze starts and ends on its own every year. Users who hold the `clouddeploy.deployPolicies.override` permission, which `roles/clouddeploy.policyOverrider` includes, can override the policy for one action, so the SRE group can ship a fix while the freeze stays in force for everyone else.
  options:
    a:
      en: |
        A suspended pipeline blocks every team, and someone must edit the configuration on each date. Resuming it for an emergency fix lifts the freeze for all teams, which the requirements forbid.
    b:
      en: |
        An approval gate does not freeze anything: any rollout can still be approved, and nothing ties the gate to the freeze dates. It also adds an approval step to every production rollout all year.
    d:
      en: |
        Disabling one trigger does not stop anyone from creating or promoting releases with `gcloud` or the console, so the freeze is not enforced, and the scheduled jobs are custom tooling to maintain.
references:
  - title: Restrict deploy behavior using policies
    url: https://docs.cloud.google.com/deploy/docs/deploy-policy
  - title: Suspend a delivery pipeline
    url: https://docs.cloud.google.com/deploy/docs/suspend-pipeline
