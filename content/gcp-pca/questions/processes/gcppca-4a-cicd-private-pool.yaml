id: gcppca-4a-cicd-private-pool
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company runs its CI builds with Cloud Build. The integration tests must reach an internal package server and a test database that run on Compute Engine VMs without external IP addresses in the VPC network lab-net. Security requires that the build workers have no access to the public internet.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Cloud Build private pool that is peered with lab-net and has public egress disabled, and run the builds in that pool.
    - id: b
      text:
        en: |-
          Run the builds in the default pool, and create a Serverless VPC Access connector in lab-net for the build steps to use.
    - id: c
      text:
        en: |-
          Assign external IP addresses to the two VMs, and add firewall rules that allow ingress to them only on the ports that the tests use.
    - id: d
      text:
        en: |-
          Run the builds in the default pool, and create a Cloud NAT gateway in lab-net so that the build workers can reach the VMs.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Private pools are dedicated Cloud Build workers in a Google-owned service producer network that you connect to your VPC network with VPC Network Peering, so builds can reach private IP addresses in lab-net. Public internet access is configurable for private pools and can be disabled, which meets the security requirement.
  options:
    b:
      en: |-
        Serverless VPC Access connectors are used by services such as Cloud Run and App Engine, not by Cloud Build default pool builds.
    c:
      en: |-
        Exposing the VMs with external IP addresses contradicts the private design, and the default pool workers keep their access to the public internet.
    d:
      en: |-
        The default pool does not run in your VPC network, and Cloud NAT only provides outbound internet access for resources in your network; it does not connect outside workers to your VMs.
references:
  - title: "Private pools overview"
    url: https://docs.cloud.google.com/build/docs/private-pools/private-pools-overview
