id: gcppca-4a-test-web-security-scanner
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company runs a public web application on GKE. Before each release, the security team wants to test the new version for vulnerabilities such as cross-site scripting and outdated JavaScript libraries. The new version is first deployed to a staging environment that is reachable from the internet and has a dedicated test account. The team wants a Google Cloud managed tool and must not put production data at risk.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Web Security Scanner custom scan that targets the staging URL and signs in with the test account, and review the findings before each release.
    - id: b
      text:
        en: |-
          Enable Google Cloud Armor preconfigured WAF rules for cross-site scripting on the production load balancer, and review the blocked requests.
    - id: c
      text:
        en: |-
          Rely on the weekly managed Web Security Scanner scans of the production application, and fix the findings after each release.
    - id: d
      text:
        en: |-
          Enable Artifact Analysis scanning on the repository that stores the application's images, and fail the release on critical findings.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Web Security Scanner crawls web applications on App Engine, GKE, and Compute Engine and detects issues such as cross-site scripting, outdated libraries, and mixed content. Because a scan can submit forms and change state, Google recommends scanning a test environment with a test account. A custom scan of the staging URL finds these issues before each release.
  options:
    b:
      en: |-
        Cloud Armor blocks attack requests at runtime in production; it does not find the vulnerabilities in the new version before release.
    c:
      en: |-
        Managed scans run weekly against production with unauthenticated GET requests, so they test after release and do not cover pages behind sign-in.
    d:
      en: |-
        Artifact Analysis reports known vulnerabilities in packages of container images; it does not test the running application for cross-site scripting.
references:
  - title: "Overview of Web Security Scanner"
    url: https://docs.cloud.google.com/security-command-center/docs/concepts-web-security-scanner-overview
