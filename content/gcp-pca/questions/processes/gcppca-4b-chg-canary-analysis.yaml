id: gcppca-4b-chg-canary-analysis
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company deploys a Cloud Run service with Cloud Deploy. Twice this year a new version caused errors for all users at once. The product owner now requires that each new version first receive a small share of the traffic, that the rollout stop automatically if the error rate rises, and that a healthy version reach 100% of the traffic without anyone intervening.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Use a canary strategy on the Cloud Run target with a few traffic percentages, add an analysis job based on a Cloud Monitoring alerting policy for the error rate to each phase, and add an advance rollout automation rule." }
    - id: b
      text: { en: "Deploy each new revision with no traffic, and have the release manager move traffic with `gcloud run services update-traffic` after checking the error-rate dashboard." }
    - id: c
      text: { en: "Set `requireApproval: true` on the production target so that the release manager checks the staging results before each rollout to production." }
    - id: d
      text: { en: "Deploy each new revision to 100% of the traffic, and create a Cloud Monitoring alerting policy on the error rate that pages the on-call engineer to roll back." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Cloud Deploy canary splits traffic between the deployed version and the new one in phases. An analysis job in a phase watches Google Cloud Observability alerting policies, and the rollout fails if an alert fires; the advance rollout automation moves a healthy rollout to the next phase and then to the stable 100% phase without human action.
  options:
    b:
      en: |
        The traffic split exists, but every step and the error check are manual, which fails the no-intervention requirement.
    c:
      en: |
        An approval happens before the rollout; the approved version then receives all the traffic at once, and nothing stops it automatically.
    d:
      en: |
        All users receive the faulty version before the alert fires, and the rollback depends on a person.
references:
  - title: Use a canary deployment strategy
    url: https://docs.cloud.google.com/deploy/docs/deployment-strategies/canary
  - title: Run analysis jobs in Cloud Deploy
    url: https://docs.cloud.google.com/deploy/docs/analysis
