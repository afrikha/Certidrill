id: gcppca-cs7c-stale-feed
objective: "4.1.3"
type: single
caseStudy: gcppca-cs7c-corrin-bay-transit
difficulty: 2
status: draft
stem:
  en: |
    The new feeds are now public. Several apps report vehicle positions that are up to an hour old, although the feed generator logs a successful write every 10 seconds and the object's update time in Cloud Storage is always recent. The feed generator does not set any object metadata.

    What should you do to meet the business requirement for the feeds?
body:
  options:
    - { id: a, text: { en: "Have the feed generator set the Cache-Control metadata of each file to public with a max-age of 15 seconds." } }
    - { id: b, text: { en: "Have the feed generator write each update to a new object name, because Cloud Storage returns overwritten objects with eventual consistency." } }
    - { id: c, text: { en: "Move the feed bucket to a dual-region location with turbo replication so that every read gets the latest version of the files." } }
    - { id: d, text: { en: "Set a minimum number of instances on the feed generator's Cloud Run service so that it writes the files without cold starts." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Cached objects that are publicly readable might not be strongly consistent: when an object changes while it is cached, readers get the cached copy until its cache lifetime expires, and without Cache-Control metadata a public object can be cached for up to 60 minutes. Setting a max-age of 15 seconds on each file keeps the cached positions within the 30-second limit while still letting the cache absorb the polling of the apps. The stable URL of the files does not change.
  options:
    b:
      en: Cloud Storage reads after a write, including an overwrite, are strongly consistent; the stale data comes from caching, and new object names would break the stable URL that apps use.
    c:
      en: Turbo replication shortens the replication RPO between the two regions of a dual-region; it does not change how long a public object is cached.
    d:
      en: The generator already writes every 10 seconds, as its logs and the update times show, so cold starts are not the cause of the stale positions.
references:
  - title: Cloud Storage consistency
    url: https://docs.cloud.google.com/storage/docs/consistency
  - title: Caching with Cloud Storage built-in cache
    url: https://docs.cloud.google.com/storage/docs/caching
