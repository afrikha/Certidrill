id: gcppca-4b-bc-pattern-tiers
objective: "4.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A business impact analysis at an online retailer produced these objectives:

    | Workload | RTO | RPO |
    | --- | --- | --- |
    | Checkout service (customer-facing) | Near zero | Near zero |
    | Order email notifications | 4 hours | 1 hour |
    | Historical compliance archive | 5 days | 24 hours |

    The retailer wants to meet each objective at the lowest cost.

    Which recovery pattern should you assign to each workload?
body:
  options:
    - id: a
      text: { en: "Hot for all three workloads, so that the plan uses a single recovery design." }
    - id: b
      text: { en: "Warm for the checkout service, hot for the email notifications, and cold for the compliance archive." }
    - id: c
      text: { en: "Hot for the checkout service, warm for the email notifications, and cold for the compliance archive." }
    - id: d
      text: { en: "Cold for all three workloads, and invoke the recovery procedures manually when a region fails." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Google's planning guide matches each workload to a pattern by its RTO and RPO: a customer-facing service with near-zero objectives needs a hot pattern, notifications that tolerate hours of delay fit a warm pattern, and historical compliance data can use a cold pattern. Tighter patterns cost more, so using them only where the objectives demand it minimizes cost.
  options:
    a:
      en: |
        A hot pattern for every workload meets the objectives but pays for continuous standby capacity that two of the workloads do not need.
    b:
      en: |
        A warm pattern requires a recovery step, so it cannot meet the near-zero objectives of the checkout service, while the notifications get a hot pattern they do not need.
    d:
      en: |
        A cold pattern takes far too long to recover the checkout service and the notifications.
references:
  - title: Disaster recovery planning guide
    url: https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide
