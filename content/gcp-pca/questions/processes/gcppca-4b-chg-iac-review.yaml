id: gcppca-4b-chg-iac-review
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company's platform team manages its landing zone with Terraform, which engineers run from their laptops. Two outages last quarter were caused by changes that nobody else had reviewed and that were hard to trace. The new change process requires that a second engineer review the exact infrastructure changes before they are applied, that every applied change be traceable and revertible, and that the team not operate its own Terraform runners or state storage.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Keep running Terraform from laptops, store the state in a Cloud Storage bucket with Object Versioning, and ask engineers to post a summary of each change in the team chat." }
    - id: b
      text: { en: "Export Cloud Asset Inventory snapshots every day, compare them with the previous day, and open an incident for every change that was not announced." }
    - id: c
      text: { en: "Grant the engineers `roles/reader` only, and have one administrator apply all landing zone changes from the Google Cloud console after a ticket is approved." }
    - id: d
      text: { en: "Require an approving review on every pull request to a Git repository, create an Infrastructure Manager preview for each pull request, and apply with Infrastructure Manager after the merge." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Version control with mandatory pull-request reviews gives the second-engineer review, the history of who changed what, and the ability to revert. An Infrastructure Manager preview shows the reviewer exactly what Terraform would change, and Infrastructure Manager runs Terraform in a managed Cloud Build environment and keeps a revision with logs and state for each update, so the team runs no runners and stores no state itself.
  options:
    a:
      en: |
        Nobody reviews the change before it is applied, and the team still runs Terraform on laptops; versioned state helps recovery but not review or traceability of who applied what.
    b:
      en: |
        Snapshots detect changes after they happen; they provide no review before a change is applied.
    c:
      en: |
        Manual console changes are neither reviewable as code nor easy to revert, and a single administrator becomes a bottleneck and a single point of failure.
references:
  - title: Infrastructure Manager overview
    url: https://docs.cloud.google.com/infrastructure-manager/docs/overview
  - title: Automate and manage change
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/automate-and-manage-change
