id: gcppca-4b-chg-approval-gate
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A financial services company uses a Cloud Deploy delivery pipeline with three targets: dev, staging, and prod. Its change management process requires that a member of the change-managers group approve each rollout to prod before it is deployed. Developers must keep promoting releases through the pipeline themselves.

    What should you configure?
body:
  options:
    - id: a
      text: { en: "Add a canary strategy to the prod target and grant the change-managers group the permission to advance each canary phase of a rollout." }
    - id: b
      text: { en: "Create a deploy policy with a `rolloutRestriction` rule on the prod target and grant `roles/clouddeploy.policyAdmin` to the change-managers group." }
    - id: c
      text: { en: "Grant `roles/clouddeploy.releaser` to the change-managers group only, and remove it from the developers on the prod target." }
    - id: d
      text: { en: "Set `requireApproval: true` in the prod target configuration and grant `roles/clouddeploy.approver` to the change-managers group." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With `requireApproval: true` on a target, every rollout to that target waits in a pending-approval state until someone with `roles/clouddeploy.approver` approves or rejects it. Developers still promote releases, and a rejected rollout is never deployed. Cloud Deploy also publishes approval requests to the `clouddeploy-approvals` Pub/Sub topic, so a ticketing tool can be integrated.
  options:
    a:
      en: |
        A canary starts sending part of the traffic to the new version before anyone approves it, so the change reaches production users before approval.
    b:
      en: |
        A deploy policy blocks actions during the time windows it defines; it does not route each rollout to the change managers for approval.
    c:
      en: |
        This takes promotion away from developers, which the requirements forbid, and it replaces an approval step with a change of who deploys.
references:
  - title: Promote your release and manage approvals
    url: https://docs.cloud.google.com/deploy/docs/promote-release
