id: gcppca-4a-rca-mitigate-first
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Ten minutes after a release was rolled out to production with Cloud Deploy, the error rate of a payment API jumps from 0.1 % to 20 %. The on-call engineer suspects the release but does not yet know the root cause, and customers are failing to pay. The company follows Google-recommended incident management practices.

    What should the on-call engineer do first?
body:
  options:
    - id: a
      text:
        en: |-
          Roll back the production target to the previous release to restore the service, and keep the logs and metrics for the investigation.
    - id: b
      text:
        en: |-
          Wait until the error rate has stayed high for an hour, so that the metrics provide a clear signal for the root cause analysis.
    - id: c
      text:
        en: |-
          Keep the new release in production, and debug it live until the faulty code path is found, so that the evidence is not lost.
    - id: d
      text:
        en: |-
          Write the postmortem document first, so that the timeline of the incident is recorded before anyone changes the system.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      During an incident, the priority is to restore the service; root cause analysis comes afterward. Rolling back the suspected change is the fastest low-risk mitigation, and Cloud Deploy redeploys the last successful release. Logs, metrics, and the rollout history remain available, so the team can still find the root cause and run a blameless postmortem.
  options:
    b:
      en: |-
        Waiting extends the customer impact without adding information that the first ten minutes have not already given.
    c:
      en: |-
        Debugging in production while customers fail to pay prolongs the impact; the evidence is preserved by the logs and metrics anyway.
    d:
      en: |-
        The postmortem follows the incident; writing it before mitigation delays recovery.
references:
  - title: "Manage incidents and problems"
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/manage-incidents-and-problems
  - title: "Overview of Cloud Deploy"
    url: https://docs.cloud.google.com/deploy/docs/overview
