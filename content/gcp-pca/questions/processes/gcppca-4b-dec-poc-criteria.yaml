id: gcppca-4b-dec-poc-criteria
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An online gaming company must choose the database for a new player-inventory service. The architecture board is split between Spanner and AlloyDB for PostgreSQL, and both sides quote performance and cost figures from different sources. The CTO wants a decision within six weeks that the board will accept and that future teams can understand.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Let the board vote on the two options, and adopt the option that wins the majority." }
    - id: b
      text: { en: "Agree on success criteria for latency, scale, and cost first, run a time-boxed proof of concept of both options with a representative workload, and record the outcome in an ADR." }
    - id: c
      text: { en: "Choose the option with the lowest list price in the pricing calculator, because cost can be measured objectively." }
    - id: d
      text: { en: "Choose the option with the longest feature list, so that the service can meet any future requirement." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Criteria agreed before the test make the decision objective, and a time-boxed proof of concept with a representative workload produces data that both sides accept. Recording the requirements, options, and results in an architecture decision record lets future teams understand why the choice was made.
  options:
    a:
      en: |
        A vote settles the disagreement without data, so the losing side has no reason to accept it and the rationale is not documented.
    c:
      en: |
        List price ignores the latency and scale requirements and the real usage pattern of the workload.
    d:
      en: |
        A feature count is not tied to the service's requirements and can lead to an unnecessarily complex and expensive choice.
references:
  - title: Architecture decision records overview
    url: https://docs.cloud.google.com/architecture/architecture-decision-records
  - title: "Migrate to Google Cloud: Assess and discover your workloads"
    url: https://docs.cloud.google.com/architecture/migration-to-gcp-assessing-and-discovering-your-workloads
