id: gcppca-4a-cicd-multi-target
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A streaming company runs its API on three production GKE clusters in us-central1, europe-west1, and asia-east1, and deploys with Cloud Deploy. Today the pipeline has one prod target per cluster, so each release must be promoted three times in sequence. The company wants a single promotion to deploy the release to the three clusters at the same time, with a different replica count in each region, and to keep one release per version.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the three prod targets in sequence, and add an automation with a promoteReleaseRule that promotes each release to the next region without waiting.
    - id: b
      text:
        en: |-
          Create one delivery pipeline per region, and have the CI system create a separate release in each pipeline with the replica count of that region.
    - id: c
      text:
        en: |-
          Create a multi-target whose child targets are the three clusters, use it as the prod stage, and match per-region deploy parameters to the child targets' labels.
    - id: d
      text:
        en: |-
          Replace the prod targets with a Cloud Build step that runs kubectl apply against the three clusters with a manifest that has a different replica count for each cluster.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A Cloud Deploy multi-target lists child targets, and a rollout to it creates a controller rollout that deploys to all child targets in parallel. Deploy parameters in the pipeline can be matched to child target labels, so each regional cluster receives its own values, such as the replica count, from the same release.
  options:
    a:
      en: |-
        The rollouts would still run one after the other, and each region would need its own rollout to complete before the next promotion.
    b:
      en: |-
        Separate releases per region break the requirement of one release per version and let the regions drift apart.
    d:
      en: |-
        A custom kubectl step loses Cloud Deploy's release tracking, approvals, and rollback, and adds scripts to maintain.
references:
  - title: "Deploy an app to multiple targets at the same time"
    url: https://docs.cloud.google.com/deploy/docs/deploy-app-parallel
