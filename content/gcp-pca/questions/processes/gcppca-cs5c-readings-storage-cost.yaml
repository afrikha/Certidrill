id: gcppca-cs5c-readings-storage-cost
objective: "4.2.6"
type: single
caseStudy: gcppca-cs5c-ashgrove-power
difficulty: 2
status: draft
stem:
  en: |
    The finance director asks you how to reduce the cost of the readings dataset, which is growing every month. Your recommendation must meet the business requirement about the readings dataset.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Switch the readings dataset to the physical storage billing model, and check the time travel bytes that the model bills separately." } }
    - { id: b, text: { en: "Set a partition expiration of seven years on the readings tables so that BigQuery deletes each partition when it no longer has to be kept." } }
    - { id: c, text: { en: "Export the partitions that are older than one year to Cloud Storage Archive, delete them from BigQuery, and define external tables over the exported files." } }
    - { id: d, text: { en: "Buy an additional Enterprise edition slot commitment, and assign it to the reservation of the projects that query the readings dataset." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The physical storage billing model bills the compressed bytes on disk instead of the uncompressed logical bytes; the readings compress about 9 to 1, which more than offsets the higher price per GiB. The change is made per dataset, only changes metering, and does not move data or affect queries. Under that model, time travel and fail-safe bytes are billed separately, which stays small for append-only tables.
  options:
    b:
      en: An expiration only deletes partitions older than seven years; it does not lower the cost of the seven years of readings that the regulator requires Ashgrove to keep, which make up the bill.
    c:
      en: Analysts and auditors would have to query exported files through external tables with different performance, and the data would leave BigQuery's managed storage, which breaks the requirement to keep the readings queryable with the current queries.
    d:
      en: Slot commitments reduce the cost of query compute, not of storage. Commitments bought with a BigQuery edition, unlike legacy flat-rate commitments, do not prevent the dataset from using physical storage billing.
references:
  - title: Introduction to datasets
    url: https://docs.cloud.google.com/bigquery/docs/datasets-intro
