id: gcppca-4b-chg-people-adoption
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An insurance company is moving its application teams to a new Google Cloud platform. Six months in, few teams use it: developers say they hear about changes too late, and team leads say the move is an IT project with no clear goal for them. The CIO asks you how to drive adoption, following Google's guidance on managing change in the cloud.

    Which two actions should you recommend? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Have the platform team migrate every application without involving the application teams, so that developers do not need to change how they work." }
    - id: b
      text: { en: "Obtain sponsorship from senior leadership that gives early adopter teams a mandate, and publish the adoption objectives and KPIs from the start." }
    - id: c
      text: { en: "Keep the migration plan confidential until most workloads have moved, so that early setbacks do not increase resistance." }
    - id: d
      text: { en: "Require every developer to pass the Professional Cloud Architect certification before granting access to the platform." }
    - id: e
      text: { en: "Identify champions in the application teams, and share frequent, small updates on progress instead of occasional large announcements." }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Google's change guidance starts with sponsorship: senior leaders give early adopters a mandate, and objectives and KPIs are stated openly so that progress can be measured. It also recommends champions who promote the change inside the teams and frequent, small communications, because people overloaded with information tend to stick to the status quo.
  options:
    a:
      en: |
        Excluding the application teams leaves them without the skills and ownership they need to run on the platform; the problem is people, not migration capacity.
    c:
      en: |
        Hiding the plan is the opposite of the transparent, consistent communication that reduces resistance.
    d:
      en: |
        A professional architect certification for every developer is a disproportionate gate that slows adoption instead of supporting it.
references:
  - title: Managing Change in the Cloud
    url: https://services.google.com/fh/files/misc/managing_change_in_the_cloud.pdf
