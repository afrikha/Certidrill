id: gcppca-4a-dr-rto-rpo
objective: "4.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    During a disaster recovery workshop, the business owner of an order management application says: "After a major outage, we can accept losing at most the last 15 minutes of orders, and the application must be available again within 2 hours."

    How should you record these requirements?
body:
  options:
    - id: a
      text:
        en: |-
          An RTO of 15 minutes and an RPO of 2 hours
    - id: b
      text:
        en: |-
          An RPO of 15 minutes and an SLA of 2 hours
    - id: c
      text:
        en: |-
          An RTO of 15 minutes and an SLO of 2 hours
    - id: d
      text:
        en: |-
          An RPO of 15 minutes and an RTO of 2 hours
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The recovery point objective (RPO) is the longest period of data loss that the application can tolerate, here 15 minutes of orders. The recovery time objective (RTO) is the longest time the application can stay offline before it must be recovered, here 2 hours. Both drive the choice and cost of the DR pattern.
  options:
    a:
      en: |-
        The two values are swapped: data loss is the RPO and downtime is the RTO.
    b:
      en: |-
        An SLA is a contractual commitment on service levels; the maximum time to recover is the RTO.
    c:
      en: |-
        15 minutes of data loss is an RPO, and an SLO is a reliability target, not the maximum recovery time.
references:
  - title: "Disaster recovery planning guide"
    url: https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide
