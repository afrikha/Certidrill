id: gcppca-4b-cost-resource-cud
objective: "4.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A chemicals company runs SAP HANA on M2 memory-optimized Compute Engine VMs in a single region. The landscape is sized for the next three years, and there are no plans to change region or machine series. The CFO wants the deepest discount on these VMs and accepts a long-term commitment.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Purchase a 1-year compute flexible commitment, and renew it every year so that the company keeps its flexibility." }
    - id: b
      text: { en: "Purchase a 3-year compute flexible commitment at the Cloud Billing account level for the hourly spend on the VMs." }
    - id: c
      text: { en: "Purchase no commitment and rely on sustained use discounts, which apply to M2 VMs that run the entire month." }
    - id: d
      text: { en: "Purchase a 3-year resource-based commitment for the M2 vCPUs and memory in that region." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Resource-based commitments are designed for predictable, steady-state usage in one region and give the largest discounts, up to 70% for memory-optimized series with a 3-year term. Because the region and machine series will not change, the flexibility of a spend-based commitment is not worth its lower rate.
  options:
    a:
      en: |
        A 1-year compute flexible commitment gives no discount at all on memory-optimized M1 to M4 vCPUs and memory.
    b:
      en: |
        A 3-year compute flexible commitment covers memory-optimized machines, but at 63%, which is less than a 3-year resource-based commitment; its flexibility is not needed here.
    c:
      en: |
        Sustained use discounts are smaller than commitment discounts, so they do not give the deepest discount for a steady three-year workload.
references:
  - title: Committed use discounts (CUDs) for Compute Engine
    url: https://docs.cloud.google.com/compute/docs/instances/committed-use-discounts-overview
