id: gcppca-4a-sh-scope-change
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Midway through a migration whose deadline is fixed by the end of a data center contract, the head of marketing asks the team to add a real-time personalization feature to the first release. The team is already fully allocated, and the head of marketing is an influential stakeholder.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Accept the request, and ask the team to work extra hours, so that the stakeholder keeps supporting the program.
    - id: b
      text:
        en: |-
          Assess the impact on schedule, cost, and risk, and present the options, such as a later release, to the sponsor for a decision.
    - id: c
      text:
        en: |-
          Decline the request, and tell the head of marketing that the scope cannot change once the program has started.
    - id: d
      text:
        en: |-
          Add the feature quietly to the backlog, and drop other tasks if needed without informing the other stakeholders.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A scope change that threatens a fixed deadline is a trade-off for the people accountable for the program. Assessing its impact and presenting clear options, such as delivering it in a later release or adding capacity, lets the sponsor decide with full information and keeps the requester involved. The decision and its rationale should be recorded and communicated.
  options:
    a:
      en: |-
        Overloading the team risks the contract deadline and hides the trade-off from the sponsor.
    c:
      en: |-
        A flat refusal damages the relationship with an influential stakeholder without exploring options.
    d:
      en: |-
        Changing priorities without telling the stakeholders destroys trust and transparency.
references:
  - title: "Ensure operational readiness and performance using CloudOps"
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/operational-readiness-and-performance-using-cloudops
  - title: "Migrate to Google Cloud: Get started"
    url: https://docs.cloud.google.com/architecture/migration-to-gcp-getting-started
