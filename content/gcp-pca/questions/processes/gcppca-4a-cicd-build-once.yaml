id: gcppca-4a-cicd-build-once
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company's pipeline builds a container image from the main branch separately for each environment: once when it deploys to test, and again when it deploys to production after approval. An incident showed that the production image contained a library version that was never tested, because the library was updated between the two builds.

    What should you change?
body:
  options:
    - id: a
      text:
        en: |-
          Pin the base image by tag in the Dockerfile, and keep rebuilding the image for each environment from the same commit of the main branch.
    - id: b
      text:
        en: |-
          Build the image once, push it to Artifact Registry, and have Cloud Deploy promote that release, which references the image by digest, to production.
    - id: c
      text:
        en: |-
          Tag the tested image as latest after the tests pass, and configure the production deployment to always pull the image that is tagged latest.
    - id: d
      text:
        en: |-
          Rebuild the image for production only during a change freeze, when the team does not merge any library updates into the main branch of the repository.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Building the artifact once and promoting that same artifact guarantees that production runs exactly what was tested. In Cloud Deploy, a release holds the rendered manifests for each target, and promoting it creates a rollout of the same release on the next target; referencing the image by digest rather than by a mutable tag pins the exact image content.
  options:
    a:
      en: |-
        Each rebuild can still resolve different dependency versions; pinning the base image does not pin the libraries that the build downloads.
    c:
      en: |-
        latest is a mutable tag: another push can change what it points to before production pulls it.
    d:
      en: |-
        The library came from upstream, not from a merge, so a freeze on merges does not stop the rebuilt image from differing.
references:
  - title: "Overview of Cloud Deploy"
    url: https://docs.cloud.google.com/deploy/docs/overview
