id: gcppca-4b-cs-platform-product
objective: "4.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A media group's platform team provides a shared GKE platform to 25 internal application teams. A survey shows that application teams find the platform hard to use and that several of them now deploy outside it. The platform team reports success as delivering its yearly roadmap on time and on budget. The head of engineering asks how the platform team should manage the success of its internal customers, following Google's guidance on designing cloud teams.

    Which two changes should you recommend? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Block deployments outside the platform with an organization policy, and keep the current roadmap unchanged." }
    - id: b
      text: { en: "Measure the platform's success by the number of support tickets that the platform team closes each month." }
    - id: c
      text: { en: "Run the platform like a product: collect feedback from the application teams and measure success by their engagement and satisfaction." }
    - id: d
      text: { en: "Define SLOs and error budgets for the platform services that the application teams depend on." }
    - id: e
      text: { en: "Deliver all requested features in one large annual release, so that application teams only adapt once a year." }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      Google's guidance says platform teams should design, build, and operate the platform like a product, with user feedback, and measure success by user engagement and satisfaction rather than a fixed timeline or budget. Platforms run as products also use SLOs and error budgets, which give the application teams a clear, measurable service commitment.
  options:
    a:
      en: |
        Forcing usage hides the dissatisfaction instead of addressing it, and leaves the platform as hard to use as before.
    b:
      en: |
        Ticket counts measure the platform team's activity, not whether its internal customers succeed; more tickets can even signal a worse platform.
    e:
      en: |
        Large annual releases delay feedback for a year, which is the opposite of iterating with users.
references:
  - title: Designing Cloud Teams
    url: https://services.google.com/fh/files/misc/cloud_center_of_excellence.pdf
