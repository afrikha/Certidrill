id: gcppca-4b-chg-orgpolicy-dryrun
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The security team of a manufacturing company wrote a custom organization policy constraint that will apply to every project in the organization. The change management process requires evidence of which existing workflows the constraint would block before it is enforced. No team may be disrupted while this evidence is collected.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Enforce the policy on a test folder for two weeks and collect the errors that the teams in that folder report before you enforce it at the organization node." }
    - id: b
      text: { en: "Create a dry-run organization policy for the custom constraint at the organization node, and review the violations that are recorded in the audit logs." }
    - id: c
      text: { en: "Run a Policy Analyzer query at the organization node to list the principals that can create the resources the constraint applies to." }
    - id: d
      text: { en: "Enforce the policy at the organization node with a tag-based condition that exempts every project, then remove the exemption from one project at a time." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A dry-run organization policy is evaluated like an enforced policy, but violating requests are only recorded in the audit logs, not denied. Custom constraints support dry run, so you can review the would-be violations across the whole organization (in Logs Explorer or through a sink to BigQuery) before you enforce the policy.
  options:
    a:
      en: |
        Enforcing the policy on a folder disrupts the teams in that folder, and the result says nothing about the workflows of the rest of the organization.
    c:
      en: |
        Policy Analyzer answers who has which IAM access; it does not evaluate organization policy constraints against real requests.
    d:
      en: |
        Each removed exemption enforces the constraint on a project, so teams can be disrupted, and the process is slow and error-prone compared with a dry run.
references:
  - title: Test organization policies
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/dry-run-policy
