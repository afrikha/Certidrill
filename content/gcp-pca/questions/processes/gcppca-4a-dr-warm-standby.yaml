id: gcppca-4a-dr-warm-standby
objective: "4.1.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A logistics company is designing a warm standby DR environment in a second region for an application that runs on Compute Engine managed instance groups behind a load balancer. During a regional outage, the managed instance groups in the DR region must scale out to full production size within the RTO, and users must be sent to the DR region without DNS changes.

    Which two actions should you take? Choose two.
body:
  options:
    - id: a
      text:
        en: |-
          Rely on on-demand capacity in the DR region, and request the machine types that the application needs only when a failover starts.
    - id: b
      text:
        en: |-
          Create reservations for the required machine types in the DR region's zones, so that the capacity is available during a failover.
    - id: c
      text:
        en: |-
          Use a regional external passthrough Network Load Balancer in the primary region, with the DR instance groups added as its backends.
    - id: d
      text:
        en: |-
          Write the failover runbook with general instructions only, so that the responders can adapt them to the situation during the outage.
    - id: e
      text:
        en: |-
          Use a global external Application Load Balancer with backends in both regions, so that health checks send traffic to the DR region.
  choose: 2
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Google recommends creating reservations in the DR zones because on-demand capacity might not be available when many customers fail over, which would break the RTO. A global external Application Load Balancer serves one anycast IP address in front of backends in several regions, and its health checks keep traffic away from failing backends, so users reach the DR region without DNS changes.
  options:
    a:
      en: |-
        On-demand capacity is not guaranteed during a regional event, so the instance groups might not reach full size within the RTO.
    c:
      en: |-
        A regional load balancer has backends in its own region only and fails with the primary region.
    d:
      en: |-
        The DR planning guide recommends specific, concrete tasks; vague instructions slow responders during an outage.
references:
  - title: "Disaster recovery building blocks"
    url: https://docs.cloud.google.com/architecture/dr-scenarios-building-blocks
  - title: "Disaster recovery planning guide"
    url: https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide
