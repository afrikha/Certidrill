id: gcppca-4b-cs-support-premium
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A global bank runs critical trading workloads on Google Cloud. Its operations director requires a 15-minute initial response from Google for P1 cases and a named Technical Account Manager who knows the bank's environment.

    Which Customer Care offering should the bank purchase?
body:
  options:
    - id: a
      text: { en: "Standard Support" }
    - id: b
      text: { en: "Enhanced Support" }
    - id: c
      text: { en: "Premium Support" }
    - id: d
      text: { en: "Basic Support" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Premium Support is the Customer Care offering for enterprises with critical workloads: it has a 15-minute initial response time for P1 cases and includes a Technical Account Manager.
  options:
    a:
      en: |
        Standard Support targets workloads under development; it has no P1 response target and no Technical Account Manager.
    b:
      en: |
        Enhanced Support has a 1-hour initial response for P1 cases and does not include a Technical Account Manager.
    d:
      en: |
        Basic Support covers documentation, community forums, billing assistance, and Active Assist; it includes no technical support cases.
references:
  - title: Customer Care
    url: https://cloud.google.com/support
