id: gcppca-cs7c-dispatch-cutover
objective: "4.2.2"
type: single
caseStudy: gcppca-cs7c-corrin-bay-transit
difficulty: 1
status: draft
stem:
  en: |
    The new CAD/AVL system passed its acceptance tests. You need to plan the move of dispatch operations to the new system. The plan must meet the business requirement for the CAD/AVL replacement.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Switch all dispatchers to the new system on a single night shortly before vendor support ends, and give them online training material to complete during their first week on the new system." } }
    - { id: b, text: { en: "Let each dispatcher choose, at the start of each shift, whether to use the legacy system or the new system, until every dispatcher prefers the new one." } }
    - { id: c, text: { en: "Have the on-board units feed both systems, train dispatchers on the new system while it runs in parallel without dispatching, then move operations in stages with a tested fallback." } }
    - { id: d, text: { en: "Move the on-board units to the new system one route at a time, and have dispatchers use whichever system shows the vehicles of the route they manage." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Because the on-board units can send positions to two destinations, the new system can run in parallel on live data without affecting operations, and dispatchers can be trained on it before they use it, as the union agreement requires. Moving operations in small stages first, with a rollback to the legacy system prepared and tested for each step, limits the impact of a problem on service, and the plan leaves time before vendor support ends.
  options:
    a:
      en: A single-night cutover risks disrupting service with no fallback, and training after the switch violates the union agreement.
    b:
      en: Two systems used for live dispatching at the same time give conflicting views of incidents and detours, and dispatchers could use the new system before being trained.
    d:
      en: Splitting the vehicles between two systems forces dispatchers to switch consoles during incidents that span routes, and nothing ensures training before use.
references:
  - title: "Migrate to Google Cloud: Best practices for validating a migration plan"
    url: https://docs.cloud.google.com/architecture/migration-to-google-cloud-best-practices
