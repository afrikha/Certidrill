id: gcppca-4b-cost-spot-batch
objective: "4.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An animation studio renders frames every night on Compute Engine. The render jobs are fault tolerant: they checkpoint their progress, and an interrupted frame is simply rendered again. The amount of rendering varies a lot from night to night. The studio wants to minimize the cost of the render farm.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Run the render workers as Spot VMs in a managed instance group that scales with the queue of frames to render." }
    - id: b
      text: { en: "Purchase a 3-year resource-based commitment for the render workers' peak number of vCPUs." }
    - id: c
      text: { en: "Run the render workers on sole-tenant nodes so that no other customer's workloads share the hosts." }
    - id: d
      text: { en: "Run a fixed number of standard VMs sized for the busiest night, and keep them running during the day." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Spot VMs use excess Compute Engine capacity at discounts of up to 91% and suit fault-tolerant batch work that can tolerate preemption. A managed instance group recreates preempted VMs when capacity is available and scales the farm with the amount of work.
  options:
    b:
      en: |
        A commitment is billed for the whole term whether or not it is used, so committing to the peak of a highly variable workload wastes money.
    c:
      en: |
        Sole-tenant nodes add cost for host isolation, which the studio does not need.
    d:
      en: |
        Capacity sized for the peak and running all day is mostly idle, which is the opposite of minimizing cost.
references:
  - title: Spot VMs
    url: https://docs.cloud.google.com/compute/docs/instances/spot
