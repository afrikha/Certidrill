id: gcppca-cs6c-ledger-recovery
objective: "4.1.6"
type: multi
caseStudy: gcppca-cs6c-aldermoor-horizon
difficulty: 3
status: draft
stem:
  en: |
    You are writing the recovery procedure for the new ledger in case an error corrupts balances, like the faulty batch job of last year. The procedure must meet the business requirement for corrupted balances.

    Which two actions should you include? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the version retention period of the ledger database to 7 days." } }
    - { id: b, text: { en: "Rely on the replicas of the multi-region instance configuration to recover the values from before the error." } }
    - { id: c, text: { en: "Create a daily backup, and restore the last backup taken before the error over the live ledger database." } }
    - { id: d, text: { en: "Read the affected members' rows at a timestamp before the error, and write the correct values to the live database." } }
    - { id: e, text: { en: "Keep the default version retention period, and export the database at a timestamp before the error into a new database." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Spanner point-in-time recovery keeps every version of the data for the version retention period, one hour by default and up to seven days, which covers an error found three days later. A stale read at a timestamp before the error, with a condition on the affected members, returns their earlier values, which the team writes back to the live database while the ledger keeps serving all other members. Point-in-time recovery has no extra charge, although the longer retention can increase storage costs.
  options:
    b:
      en: Replicas protect against the loss of a zone or region; they apply the faulty writes too, so they hold the same corrupted values.
    c:
      en: A Spanner backup cannot be restored into an existing database, and restoring a whole copy would also discard the valid transactions of every member since the backup.
    e:
      en: The default retention keeps versions for one hour only, so data from before an error found days later is no longer available.
references:
  - title: Point-in-time recovery (PITR) overview
    url: https://docs.cloud.google.com/spanner/docs/pitr
