id: gcppca-cs7a-platform-skills
objective: "4.2.3"
type: single
caseStudy: gcppca-cs7a-sablepoint-payments
difficulty: 1
status: draft
stem:
  en: |
    You assessed the skills of Sablepoint's platform team against the work needed to run the platform. The CTO asks you how to close the gap while meeting the business requirement for the platform team and the technical requirements.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Keep the GKE Standard cluster, send the three platform engineers to a Kubernetes administration course, and have them automate node pool upgrades with scripts." } }
    - { id: b, text: { en: "Rewrite the 14 microservices as Cloud Run functions so that the platform team no longer needs Kubernetes skills, and retire the Helm charts." } }
    - { id: c, text: { en: "Move the microservices to managed instance groups of Container-Optimized OS VMs, and have the platform team manage OS updates with VM Manager." } }
    - { id: d, text: { en: "Move the microservices to GKE Autopilot clusters, keep the existing manifests and Helm charts, and train the platform team on the requirements that Autopilot applies to workloads." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In Autopilot, Google manages the nodes, their scaling, security patches, upgrades and repairs, and every cluster is enrolled in a release channel, so the node maintenance that the three engineers cannot sustain disappears. Compatible Kubernetes workloads run unchanged, so developers keep their manifests and Helm charts. The training then targets the narrow gap that remains: Autopilot's workload requirements, not node administration.
  options:
    a:
      en: Training and scripts keep the node maintenance with the platform team, which the business requirement asks to remove; the team would still spend its time on nodes instead of the PCI DSS program.
    b:
      en: Rewriting 14 microservices is a large development effort, and it drops the manifests and Helm charts that the technical requirements say developers keep.
    c:
      en: Managed instance groups drop Kubernetes, so developers lose their manifests and Helm charts, and the platform team still has to operate the VMs and their updates.
references:
  - title: GKE Autopilot overview
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview
