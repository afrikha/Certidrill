id: gcppca-4a-sh-facilitation
objective: "4.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are facilitating a design workshop with representatives of security, networking, finance, and two application teams, who disagree on how the new platform should connect to the on-premises data centers. Previous meetings ended without decisions, and some participants felt they were not heard.

    Which two practices should you apply? Choose two.
body:
  options:
    - id: a
      text:
        en: |-
          Agree at the start on the decision criteria and on who makes the final decision if the group cannot reach consensus.
    - id: b
      text:
        en: |-
          Let the most senior participant speak first and propose a decision, so that the meeting ends on time.
    - id: c
      text:
        en: |-
          Give every group time to present its constraints, and record the decisions and action items with owners, then share them.
    - id: d
      text:
        en: |-
          Invite only the participants who already support the preferred design, so that the discussion stays focused.
    - id: e
      text:
        en: |-
          Avoid writing down the disagreements, so that no participant feels that the meeting has criticized their position.
  choose: 2
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Agreeing on the criteria and the decision-maker up front gives the group a way to conclude even without consensus. Hearing every group and recording the decisions, action items, and owners, then sharing them, makes participants feel heard and turns the workshop into commitments that can be followed up, in the same way that decision records keep the reasoning visible.
  options:
    b:
      en: |-
        Anchoring on the most senior person's view discourages others from sharing constraints, which caused the earlier frustration.
    d:
      en: |-
        Excluding dissenting stakeholders produces a decision that they will not support.
    e:
      en: |-
        Unrecorded disagreements resurface later and leave no trace of how the decision was reached.
references:
  - title: "Architecture decision records overview"
    url: https://docs.cloud.google.com/architecture/architecture-decision-records
  - title: "Adoption Framework"
    url: https://cloud.google.com/adoption-framework
