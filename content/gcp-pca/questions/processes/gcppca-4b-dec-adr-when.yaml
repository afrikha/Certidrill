id: gcppca-4b-dec-adr-when
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company has asked its teams to write architecture decision records (ADRs) for their Google Cloud workloads. A team lead asks you which of this week's decisions deserves an ADR, following Google's recommendations.

    Which decision should the team document in an ADR?
body:
  options:
    - id: a
      text: { en: "Applying this month's operating system patches to the VMs, as the standard patching runbook describes." }
    - id: b
      text: { en: "Restarting a Compute Engine VM that stopped responding during last night's batch run." }
    - id: c
      text: { en: "Choosing between Pub/Sub and Cloud Tasks for the asynchronous processing of customer orders." }
    - id: d
      text: { en: "Renaming a Cloud Storage bucket label to match the company's existing labeling convention." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Google recommends writing an ADR when there are two or more viable engineering options and no existing basis for the decision; choosing between Pub/Sub and Cloud Tasks is one of the examples it gives. The ADR records the requirements, the options considered, and why one was chosen.
  options:
    a:
      en: |
        The decision is already documented in a standard runbook, so there is nothing new to record.
    b:
      en: |
        Restarting a VM is an operational action, not an architecture decision between options.
    d:
      en: |
        The convention already exists; following it is not a new design decision.
references:
  - title: Architecture decision records overview
    url: https://docs.cloud.google.com/architecture/architecture-decision-records
