id: gcppca-4b-dec-adr-storage
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    New engineers on a payments team cannot find out why the team configured its Cloud SQL instances for high availability with a particular maintenance window. The reasoning exists only in old email threads. The team wants its architecture decision records to sit close to the application code and to keep a reviewable history of every change.

    Where should the team store its ADRs?
body:
  options:
    - id: a
      text: { en: "As Markdown files in the same version control repository as the application code." }
    - id: b
      text: { en: "In the email threads, which are forwarded to every new engineer during onboarding." }
    - id: c
      text: { en: "As log entries written to Cloud Logging each time the team deploys the application." }
    - id: d
      text: { en: "In each engineer's personal notes, which are shared on request." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Google recommends storing ADRs close to the application code, ideally as Markdown in the same version control system, so they are easy to find and their version history shows how decisions evolved. Key decisions can also be mirrored to a wiki for wider audiences.
  options:
    b:
      en: |
        Email is how the knowledge got lost: it is not next to the code, is hard to search, and has no reviewable change history.
    c:
      en: |
        Logs expire according to their retention period and are made for operational events, not for design rationale.
    d:
      en: |
        Personal notes are not accessible to the team and disappear when an engineer leaves.
references:
  - title: Architecture decision records overview
    url: https://docs.cloud.google.com/architecture/architecture-decision-records
