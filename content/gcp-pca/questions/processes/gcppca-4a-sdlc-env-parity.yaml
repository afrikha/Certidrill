id: gcppca-4a-sdlc-env-parity
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company's releases often pass every test in staging and then fail in production. An investigation shows that staging was built by hand from the console months ago, uses different machine types and network settings than production, and runs container images that were rebuilt with environment-specific settings baked in. The company wants staging to be a reliable predictor of production behaviour.

    Which two actions should you take? Choose two.
body:
  options:
    - id: a
      text:
        en: |-
          Provision staging and production from the same Terraform modules, and limit the differences between them to explicit input variables.
    - id: b
      text:
        en: |-
          Keep staging smaller than production by replacing its managed database with a local database that runs in a container next to the application.
    - id: c
      text:
        en: |-
          Rebuild staging from a fresh console copy of production once a quarter, and document the differences that remain after each copy.
    - id: d
      text:
        en: |-
          Build environment-neutral images, and supply the environment-specific settings at deploy time through configuration and Secret Manager.
    - id: e
      text:
        en: |-
          Build a separate container image for each environment, so that each image contains the exact settings that the environment requires.
  choose: 2
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Defining both environments with the same infrastructure-as-code modules makes them reproducible and keeps the differences deliberate and reviewable. Building one environment-neutral image and injecting configuration and secrets at deploy time means that the artifact tested in staging is the one that runs in production, so test results carry over.
  options:
    b:
      en: |-
        Replacing the managed database with a different engine removes exactly the production behaviour that tests should exercise.
    c:
      en: |-
        Manual console copies drift again immediately and are not repeatable or reviewable.
    e:
      en: |-
        Per-environment images mean that production runs an artifact that was never tested, which is one of the causes of the failures.
references:
  - title: "Automate and manage change"
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/automate-and-manage-change
  - title: "Deployment methodology"
    url: https://docs.cloud.google.com/architecture/blueprints/security-foundations/deployment-methodology
