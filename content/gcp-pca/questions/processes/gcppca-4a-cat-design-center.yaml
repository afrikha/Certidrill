id: gcppca-4a-cat-design-center
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A platform team wants to offer development teams approved application templates, such as a Cloud Run service with a Cloud SQL database and the required service accounts. Each development team must work in its own isolated area, where it can customize a shared template on a visual canvas, add Google-provided components, and deploy the resulting application. The platform team wants to update the templates centrally and notify teams of changes. The product must be generally available.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Application Design Center, with templates published in the platform team's space catalog and shared into each development team's space.
    - id: b
      text:
        en: |-
          Service Catalog, with each template added as a Terraform solution and the catalog shared with each development team's folder.
    - id: c
      text:
        en: |-
          Infrastructure Manager, with one deployment per template and the Terraform configurations stored in a shared Git repository.
    - id: d
      text:
        en: |-
          Cloud Deploy, with one delivery pipeline per template and targets that point to each development team's projects.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Application Design Center, generally available since December 2025, gives each team a space; platform teams publish templates to their space's catalog and share them into development teams' spaces, where developers modify and deploy them. Templates are composed of Google-provided components on a design canvas, and platform teams can update templates and notify developers to apply the changes.
  options:
    b:
      en: |-
        Service Catalog distributes curated solutions that users launch with parameters, but it offers no isolated team spaces for composing and customizing applications on a canvas.
    c:
      en: |-
        Infrastructure Manager deploys Terraform configurations, but it provides no catalog, sharing model, or visual design of applications.
    d:
      en: |-
        Cloud Deploy delivers application releases to targets; it does not design or share infrastructure templates.
references:
  - title: "Application Design Center overview"
    url: https://docs.cloud.google.com/application-design-center/docs/overview
