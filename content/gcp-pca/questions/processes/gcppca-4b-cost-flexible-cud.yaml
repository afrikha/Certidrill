id: gcppca-4b-cost-flexible-cud
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company has run a steady baseline of Compute Engine and GKE Standard workloads in three regions for two years, and expects the same total spend for the next three years. Over that period it plans to move workloads between regions and from N2 to C3 machines as the application is modernized. Finance wants the largest discount that stays valid after these moves.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Purchase 3-year resource-based commitments for N2 vCPUs and memory in each of the three current regions." }
    - id: b
      text: { en: "Purchase a 3-year compute flexible commitment at the Cloud Billing account level for the steady hourly spend." }
    - id: c
      text: { en: "Purchase no commitments, and rely on sustained use discounts, which apply automatically to the steady workloads." }
    - id: d
      text: { en: "Move the baseline workloads to Spot VMs, which have a larger discount than any commitment." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Compute flexible commitments are spend-based commitments bought at the Cloud Billing account level that cover eligible Compute Engine, GKE, and Cloud Run usage in any project or region and across machine series. A 3-year term gives a higher discount (46% for most general-purpose series such as N2 and C3) and keeps applying when workloads move.
  options:
    a:
      en: |
        Resource-based commitments cover resources only in the region they were bought for, and you pay for them until the end of the term even after the workloads move to other regions or machine series.
    c:
      en: |
        Sustained use discounts reach at most 30% and apply only to some series such as N2; C3 is not eligible, so the discount would shrink after the move.
    d:
      en: |
        Spot VMs can be preempted at any time and have no SLA, so they do not suit a production baseline.
references:
  - title: Committed use discounts (CUDs) for Compute Engine
    url: https://docs.cloud.google.com/compute/docs/instances/committed-use-discounts-overview
  - title: Sustained use discounts
    url: https://docs.cloud.google.com/compute/docs/sustained-use-discounts
