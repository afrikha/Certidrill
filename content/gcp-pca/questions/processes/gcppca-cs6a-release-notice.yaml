id: gcppca-cs6a-release-notice
objective: "4.2.5"
type: single
caseStudy: gcppca-cs6a-brindlewood-hr
difficulty: 2
status: draft
stem:
  en: |
    Brindlewood's product leadership asks you how releases should work on the multi-tenant platform. The process must meet the business requirements for deployments and for Enterprise customers.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Group all changes into a quarterly release approved by a change advisory board, and send the release notes to Enterprise customers 60 days before each release reaches production." } }
    - { id: b, text: { en: "Let each Enterprise customer pin its tenant to a product version and choose when to move to the next one, and deploy new versions several times a week for the other tenants." } }
    - { id: c, text: { en: "Deploy several times a week to a canary of 5 % of the tenants chosen at random, and roll the release back automatically when the error rate of the canary tenants rises." } }
    - { id: d, text: { en: "Deploy several times a week with new behavior off behind per-tenant flags, ship breaking API changes as a new API version, announce them 60 days ahead, and enable them first in customer sandbox tenants." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Feature flags separate deployment from release: the code reaches all tenants several times a week as one version, while a changed workflow stays off until Brindlewood turns it on for a tenant. Publishing breaking API changes as a new version that runs beside the current one, announcing them 60 days ahead and enabling them first in a sandbox tenant lets Enterprise customers test their integrations before anything changes in their production tenant. Small, frequent deployments are a core continuous delivery practice, and the notice keeps the trust of the customers who run payroll on the platform.
  options:
    a:
      en: A quarterly release breaks the requirement to deploy several times a week and makes each release larger and riskier.
    b:
      en: Pinned tenants bring back several product versions in production, which breaks the requirement for a single version and recreates today's upgrade burden.
    c:
      en: A canary limits the impact of defects, but customers in the canary still get changes without notice and cannot try them first, which is what broke their integrations last year.
references:
  - title: DevOps capabilities
    url: https://docs.cloud.google.com/architecture/devops
