id: gcppca-4a-cat-consumer-role
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator has created a Service Catalog catalog of approved solutions and shared it with the folder that contains the analytics team's projects. The analytics engineers must be able to browse the catalog and launch its solutions, but must not create, modify, or share solutions or catalogs.

    Which role should you grant to the analytics engineers?
body:
  options:
    - id: a
      text:
        en: |-
          Catalog Manager (roles/cloudprivatecatalogproducer.manager)
    - id: b
      text:
        en: |-
          Catalog Consumer (roles/cloudprivatecatalog.consumer)
    - id: c
      text:
        en: |-
          Catalog Admin (roles/cloudprivatecatalogproducer.admin)
    - id: d
      text:
        en: |-
          Catalog Org Admin (roles/cloudprivatecatalogproducer.orgAdmin)
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Catalog Consumer role lets users browse catalogs and view and launch solutions, without any permission to create or manage them. It is the least privileged role that meets the requirement.
  options:
    a:
      en: |-
        Catalog Manager views solutions and catalogs and shares catalogs with users, which the engineers must not do.
    c:
      en: |-
        Catalog Admin creates and manages solutions and catalogs, far more than the engineers need.
    d:
      en: |-
        Catalog Org Admin manages Service Catalog settings at the organization level.
references:
  - title: "Access control with IAM"
    url: https://docs.cloud.google.com/service-catalog/docs/access-control
