id: gcppca-4b-skl-cloud-team
objective: "4.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A telecom company is forming the team that will build its shared Google Cloud platform and help application teams adopt it. Earlier attempts failed: a 30-person committee drawn part-time from every department met weekly, and the security office reviewed each design only at the end. You must recommend how to staff the new team, following Google's guidance on designing cloud teams.

    Which two recommendations should you make? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Start with a small team of about five people who are dedicated to cloud work for most of their week, and keep it under ten members." }
    - id: b
      text: { en: "Include a security representative from the CISO's office as a core member of the team instead of an outside reviewer." }
    - id: c
      text: { en: "Staff the team with one part-time representative from each department so that every department has a voice in every decision." }
    - id: d
      text: { en: "Make the team the mandatory approver of every application team's design so that all workloads follow the same standards." }
    - id: e
      text: { en: "Select only network specialists for the team, because the landing zone network is the hardest part of the platform." }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Google's guidance recommends small teams, starting at about five and never more than ten members, dedicated to cloud work for most of their time and cross-functional. Stakeholders such as the CISO should be core members, because outside approvals add wait time and slow delivery.
  options:
    c:
      en: |
        A large part-time committee is the model that already failed; members need to be dedicated, and the team must stay small.
    d:
      en: |
        The guidance warns against gatekeeping: enabling teams earn influence through value, and standards are captured in code rather than in sign-offs.
    e:
      en: |
        The team must be cross-functional; a team of one specialty cannot build and support a whole platform.
references:
  - title: Designing Cloud Teams
    url: https://services.google.com/fh/files/misc/cloud_center_of_excellence.pdf
