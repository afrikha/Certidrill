id: gcppca-4a-cat-solution-bucket-access
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cloud administrator added a Terraform configuration solution to Service Catalog. The configuration's zip file is stored in a Cloud Storage bucket in the catalog-admin project. Developers who launch the solution into the catalog-admin project succeed, but developers who launch it into their own team projects get a permission error when the deployment tries to read the configuration. You must fix the issue with the least privilege.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the Storage Admin role on the catalog-admin project to every developer who launches the solution.
    - id: b
      text:
        en: |-
          Grant the Storage Object Viewer role on the bucket to the Cloud Build service accounts of the team projects.
    - id: c
      text:
        en: |-
          Grant the Catalog Admin role to the developers, so that they can manage the solution and its storage.
    - id: d
      text:
        en: |-
          Make the bucket readable by allUsers, so that every deployment can download the configuration's zip file.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Service Catalog runs Terraform solutions with Cloud Build in the project where the user deploys, so the Cloud Build service account of that project must be able to read the configuration in the bucket. In the bucket's own project it already can; for other projects, Google's documentation says to grant Storage Object Viewer to their Cloud Build service accounts, which is read-only access to the objects.
  options:
    a:
      en: |-
        The read is done by the Cloud Build service account, not the developer, and Storage Admin on the whole project is far broader than read access.
    c:
      en: |-
        Catalog Admin manages Service Catalog resources; it does not give the Cloud Build service accounts read access to the bucket.
    d:
      en: |-
        Public access exposes the company's configurations to anyone on the internet.
references:
  - title: "Creating a Terraform configuration"
    url: https://docs.cloud.google.com/service-catalog/docs/terraform-configuration
