id: gcppca-cs6a-tenant-cost
objective: "4.2.6"
type: multi
caseStudy: gcppca-cs6a-brindlewood-hr
difficulty: 2
status: draft
stem:
  en: |
    Finance needs the GKE costs of each Enterprise customer's namespace for the monthly cost and margin report described in the business requirements. You must provide the data with the least custom tooling and without changing the cluster design of the solution concept.

    Which two actions should you take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable GKE cost allocation on each GKE Standard cluster of the platform." } }
    - { id: b, text: { en: "Add a `customer` label to each GKE cluster so that Cloud Billing reports show the cost of each customer." } }
    - { id: c, text: { en: "Export detailed usage cost data to BigQuery, and group the cluster costs by the `k8s-namespace` label." } }
    - { id: d, text: { en: "Compute each namespace's share of CPU usage from Cloud Monitoring, and apply it to the cluster's invoice total." } }
    - { id: e, text: { en: "Move each Enterprise customer's namespace to its own GKE cluster in a project dedicated to the customer." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      GKE cost allocation adds Kubernetes context, such as the namespace, the workload and the Pod labels, to the Cloud Billing line items of a cluster. This data appears only in the detailed usage cost export to BigQuery, where Finance can sum the costs by the `k8s-namespace` label and join them with revenue per customer. The allocation is based on the resource requests of the Pods, so it reflects what each customer reserves on the shared nodes.
  options:
    b:
      en: A cluster label applies to the whole cluster, which every Enterprise customer of the jurisdiction shares, so it cannot split the cost per customer.
    d:
      en: This is custom tooling, and an estimate from CPU usage ignores memory, discounts and the other line items of the invoice.
    e:
      en: A cluster per customer changes the cluster design of the solution concept and multiplies the clusters to operate by 180, only to obtain a cost report.
references:
  - title: Get key spending insights for your GKE resource allocation and cluster costs
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/cost-allocations
