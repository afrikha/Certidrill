id: gcppca-4b-skl-maturity-assess
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The CIO of an energy company wants a baseline of the organization's readiness for Google Cloud before planning the adoption program. The baseline must cover people and processes, such as training, leadership sponsorship, automation, and security practices, not only the servers to migrate.

    What should you do first?
body:
  options:
    - id: a
      text: { en: "Run Migration Center discovery on the data centers to build an inventory of servers, databases, and their utilization." }
    - id: b
      text: { en: "Count the Google Cloud certifications held by IT staff and set a target number of certifications for each team." }
    - id: c
      text: { en: "Enable Security Command Center on a pilot project and use its findings as the readiness score of the organization." }
    - id: d
      text: { en: "Survey the stakeholders against the Learn, Lead, Scale, and Secure themes of the Google Cloud Adoption Framework to place each theme on the cloud maturity scale." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Adoption Framework's cloud maturity scale rates the four themes (Learn, Lead, Scale, Secure) as tactical, strategic, or transformational, across people, process, and technology. Reviewing the theme attributes with stakeholders, ideally through a survey, gives the baseline from which you choose the target phase and plan the program.
  options:
    a:
      en: |
        Migration Center inventories technical assets; it says nothing about training, sponsorship, or operating practices.
    b:
      en: |
        Certifications measure one part of the Learn theme only, and ignore leadership, automation, and security practices.
    c:
      en: |
        Security Command Center reports security findings on resources; it does not assess organizational readiness.
references:
  - title: The Google Cloud Adoption Framework
    url: https://services.google.com/fh/files/misc/google_cloud_adoption_framework_whitepaper.pdf
