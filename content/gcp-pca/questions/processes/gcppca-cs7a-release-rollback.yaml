id: gcppca-cs7a-release-rollback
objective: "4.1.2"
type: multi
caseStudy: gcppca-cs7a-sablepoint-payments
difficulty: 2
status: draft
stem:
  en: |
    You are redesigning Sablepoint's release process after last month's incident. The process must meet the business requirements for rollback and for changes to production.

    Which two actions should you take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add an Artifact Registry cleanup policy that keeps the 20 most recent versions of each image in the Docker repository." } }
    - { id: b, text: { en: "Enable immutable tags on the Artifact Registry Docker repository, and tag each build with a unique version that the release references." } }
    - { id: c, text: { en: "Schedule Backup for GKE to back up the cluster's workloads every hour, and restore the latest backup taken before a faulty release." } }
    - { id: d, text: { en: "Enforce a Binary Authorization policy on the cluster that admits only images with an attestation created by the GitHub Actions build." } }
    - { id: e, text: { en: "Deploy through a Cloud Deploy delivery pipeline whose production target requires approval, grant the Cloud Deploy Approver role to the release managers, and remove the engineers' write access to the cluster." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Immutable tags forbid pushing an image with a tag already used by another version, so each release keeps pointing to the exact image it was built with and the previous release can be redeployed as it was. A Cloud Deploy target with requireApproval set to true deploys a rollout only after a principal with roles/clouddeploy.approver approves it, and Cloud Deploy can roll a target back to the previous release in minutes. Removing the engineers' write access to the cluster makes the pipeline the only way to change production.
  options:
    a:
      en: A cleanup policy deletes or keeps image versions, but it does not stop the release tag from moving to another image, which is what made the previous image hard to find.
    c:
      en: Restoring a cluster backup is slower than redeploying the previous release and rolls back every workload to the time of the backup; it does not control who changes production either.
    d:
      en: Binary Authorization checks that an image was attested, but engineers with cluster access could still deploy attested images without a release manager's approval, and it does not speed up rollback.
references:
  - title: Container concepts
    url: https://docs.cloud.google.com/artifact-registry/docs/container-concepts
  - title: Promote your release and manage approvals
    url: https://docs.cloud.google.com/deploy/docs/promote-release
