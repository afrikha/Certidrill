id: gcppca-4a-sdlc-provenance
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company must show auditors that every container image that runs on its production GKE clusters and Cloud Run services was built from its source repository by a trusted build service, with build provenance that developers cannot forge. An image built on a developer workstation must never run in production, even if someone pushes it to the production Artifact Registry repository.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Allow only the Cloud Build service account to write to the production repository, and run a weekly script that compares the running image digests with the repository contents.
    - id: b
      text:
        en: |-
          Build the images with Cloud Build, which generates signed build provenance, and enforce a Binary Authorization policy on GKE and Cloud Run that admits only attested images.
    - id: c
      text:
        en: |-
          Sign the images on the developer workstations with a key stored in Cloud KMS, and add a GKE admission webhook that checks the naming convention of the image tags.
    - id: d
      text:
        en: |-
          Enable Artifact Analysis scanning on the production repository, and block deployments manually when a scan reports an image that Cloud Build did not build.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Cloud Build generates authenticated, non-falsifiable build provenance and supports SLSA Level 3 builds for container images, which gives auditors evidence of how each image was built. Binary Authorization checks its policy at deploy time on GKE and Cloud Run and blocks images that lack the required attestations, so an image built elsewhere cannot run even if it reaches the repository; blocked attempts are written to Cloud Audit Logs.
  options:
    a:
      en: |-
        Repository permissions do not stop a deployment that references an image from another registry, and a weekly comparison only detects violations after the image has run.
    c:
      en: |-
        Signing on developer workstations is exactly the build path that must be excluded, and a tag naming convention proves nothing about how an image was built.
    d:
      en: |-
        Vulnerability scanning reports known vulnerabilities; it does not prove which system built an image, and manual blocking is neither enforced nor immediate.
references:
  - title: "Software supply chain security"
    url: https://docs.cloud.google.com/software-supply-chain-security/docs/overview
  - title: "Binary Authorization overview"
    url: https://docs.cloud.google.com/binary-authorization/docs/overview
