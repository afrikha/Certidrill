id: gcppca-4b-cost-tco-capex
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company buys new servers every five years and books them as capital expenditure (CapEx). The servers are sized for the year-end peak and are mostly idle the rest of the year. The CFO asks you to build the business case for moving these workloads to Google Cloud, where costs become operating expenditure (OpEx).

    Which approach should you use for the business case?
body:
  options:
    - id: a
      text: { en: "Compare the purchase price of the next server refresh with the on-demand price of Google Cloud VMs of the same size running all year." }
    - id: b
      text: { en: "Assume that the workloads run on Google Cloud with the current peak capacity around the clock, so that the comparison stays like-for-like." }
    - id: c
      text: { en: "Compare the total cost of ownership, including data center power, cooling, maintenance, and network costs, with Google Cloud costs that reflect rightsizing and autoscaling." }
    - id: d
      text: { en: "Plan to purchase 3-year commitments for the full peak capacity on the first day, so that cloud costs are fixed like the current CapEx." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Google's migration guidance says to compare total cost of ownership: not only hardware and software, but also the operational costs of running your own data center, such as power, cooling, and maintenance, and the often-overlooked network costs. On Google Cloud, elastic scaling and rightsizing let you pay for the capacity you use instead of the year-end peak.
  options:
    a:
      en: |
        Hardware price alone leaves out the data center operating costs and ignores that cloud capacity can shrink outside the peak.
    b:
      en: |
        Running peak capacity all year reproduces the waste of the current model and hides the main benefit of consumption-based pricing.
    d:
      en: |
        Committing to the peak for three years pays for idle capacity for most of the year, recreating fixed costs without the savings.
references:
  - title: "Migrate to Google Cloud: Assess and discover your workloads"
    url: https://docs.cloud.google.com/architecture/migration-to-gcp-assessing-and-discovering-your-workloads
