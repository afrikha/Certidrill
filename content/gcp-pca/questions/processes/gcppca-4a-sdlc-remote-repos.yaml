id: gcppca-4a-sdlc-remote-repos
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company's builds download Maven and npm dependencies directly from the public registries. During an upstream outage, builds failed for half a day, and the security team found that a build had once pulled a public npm package that had the same name as an internal package. The company wants dependency downloads to keep working during upstream outages and internal packages to take precedence over public packages of the same name, with minimal operational overhead.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create Artifact Registry remote repositories for Maven Central and npm, and combine them with the internal repositories in virtual repositories that rank the internal ones first.
    - id: b
      text:
        en: |-
          Run a self-managed Nexus server on a Compute Engine managed instance group that proxies the public registries, and point the build tools at the server.
    - id: c
      text:
        en: |-
          Copy the required public packages into a Cloud Storage bucket every night, and configure the build tools to download their dependencies from the bucket.
    - id: d
      text:
        en: |-
          Upload each approved public package manually to an Artifact Registry standard repository, and block access to the public registries with firewall rules.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An Artifact Registry remote repository caches each package version on first request and keeps serving the cached copy if the public upstream is unavailable. A virtual repository gives the build tools a single endpoint over several repositories and lets you rank the private repositories ahead of the remote ones, which protects against dependency confusion attacks. Both are managed by Google.
  options:
    b:
      en: |-
        A Nexus proxy can cache packages, but the company would operate and patch the servers itself, which fails the minimal operational overhead requirement.
    c:
      en: |-
        A nightly copy is a custom process to maintain, misses new versions until the next run, and does not solve the precedence of internal packages.
    d:
      en: |-
        Manual uploads of every dependency create high operational overhead and delay every new dependency version.
references:
  - title: "Remote repositories overview"
    url: https://docs.cloud.google.com/artifact-registry/docs/repositories/remote-overview
