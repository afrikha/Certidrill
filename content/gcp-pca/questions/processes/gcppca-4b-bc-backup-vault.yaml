id: gcppca-4b-bc-backup-vault
objective: "4.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A hospital group backs up its Compute Engine VMs and Cloud SQL instances. Its business continuity plan must assume that an attacker could take over a project administrator account and try to delete the backups before encrypting the data. Each backup must be impossible to delete, by anyone, for 30 days after it is taken. The team wants a managed solution with minimal operational effort.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create snapshot schedules for the persistent disks and enable automated backups with point-in-time recovery on the Cloud SQL instances in the same projects." }
    - id: b
      text: { en: "Export the backups every night to a Cloud Storage bucket with Object Versioning enabled in the same project as the workloads." }
    - id: c
      text: { en: "Grant `roles/reader` instead of `roles/owner` to the project administrators, and keep the current backup configuration." }
    - id: d
      text: { en: "Protect the workloads with Backup and DR backup plans that store backups in a backup vault with a minimum enforced retention of 30 days." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Backup vaults in Backup and DR are Google-managed storage that is isolated from the source projects and keeps backups immutable and indelible: during the minimum enforced retention period, no backup can be deleted by you, any other user, or Google. Backup plans protect Compute Engine instances and Cloud SQL instances from the console, so the team manages schedules and retention without custom tooling.
  options:
    a:
      en: |
        Snapshots and Cloud SQL backups stay under the control of the projects' administrators, who can delete the snapshots or the instances with their backups, which is exactly the attack the plan must withstand.
    b:
      en: |
        An administrator of the project can delete noncurrent object versions or the bucket itself, and the nightly exports are custom tooling to maintain.
    c:
      en: |
        Removing privileges reduces the risk but does not make backups impossible to delete; another privileged account could still delete them, and administrators can no longer do their work.
references:
  - title: Overview of backup vaults
    url: https://docs.cloud.google.com/backup-disaster-recovery/docs/concepts/backup-vault
