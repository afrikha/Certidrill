id: gcppca-4b-skl-first-workload
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A regional bank's infrastructure team has just completed its Google Cloud fundamentals training. Nobody on the team has run a production workload on Google Cloud yet. Management wants the first migration to build the team's experience while keeping business risk low.

    Which workload should the team migrate first?
body:
  options:
    - id: a
      text: { en: "The core payments platform, because it has the highest business value and justifies the effort of the first migration." }
    - id: b
      text: { en: "The customer data warehouse, because it has the most dependencies and teaches the team the hardest problems first." }
    - id: c
      text: { en: "An internal reporting application with few dependencies, which is not business critical." }
    - id: d
      text: { en: "All workloads at once in a single cutover, so that the team learns every migration pattern during one event." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Google recommends that the first workloads be simple and not business critical, so the team gains hands-on experience on a low-risk migration. More complex applications follow as the team's capabilities mature.
  options:
    a:
      en: |
        The payments platform is business critical, so mistakes made by an inexperienced team would be very costly.
    b:
      en: |
        A workload with many dependencies is complex to migrate and is a poor first project for a team without experience.
    d:
      en: |
        A single cutover of every workload maximizes risk and gives the team no chance to learn before the critical systems move.
references:
  - title: The Google Cloud Adoption Framework
    url: https://services.google.com/fh/files/misc/google_cloud_adoption_framework_whitepaper.pdf
  - title: "Migrate to Google Cloud: Assess and discover your workloads"
    url: https://docs.cloud.google.com/architecture/migration-to-gcp-assessing-and-discovering-your-workloads
