id: gcppca-cs6b-shadow-ad-selection
objective: "4.1.4"
type: single
caseStudy: gcppca-cs6b-harbourline-news
difficulty: 2
status: draft
stem:
  en: |
    The ad platform team has built a new version of the ad selection service and deployed it as a new backend service. You need to define how the team validates each new version. The process must meet the business requirement for the ad selection service and the technical requirements.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Add a weighted route that sends 1 % of the ad requests to the new backend service, and raise the share step by step while campaign delivery stays within its targets." } }
    - { id: b, text: { en: "Add a request mirroring policy to the route that sends a copy of each ad request to the new backend service, and compare its decisions in BigQuery with those of the current version." } }
    - { id: c, text: { en: "Deploy the new version to a staging cluster, and run a load test with synthetic ad requests generated from the targeting rules of the current campaigns." } }
    - { id: d, text: { en: "Route all ad requests to the new backend service at night, when traffic is lowest, and keep the current backend service ready so that the route can be switched back." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Request mirroring makes the load balancer send an identical copy of each request to a mirror backend service on a fire-and-forget basis: readers get the response of the current version only, so the new version sees real production traffic without affecting any ad that is served. Mirroring is supported when both backend services use zonal NEGs, as here. The load balancer does not log mirrored requests, so the new version writes its decisions to BigQuery for the comparison, and it does not update the pacing counters, so the copies have no side effects.
  options:
    a:
      en: The new version serves 1 % of the ads, so a defect affects real campaigns before it is detected, which is what caused last quarter's refunds.
    c:
      en: Synthetic requests are not real production traffic and miss the patterns of real readers and pages that the requirement asks to test.
    d:
      en: The new version serves every ad at night, so any defect affects real campaigns until someone notices it and switches the route back.
references:
  - title: Traffic management overview for global external Application Load Balancers
    url: https://docs.cloud.google.com/load-balancing/docs/https/traffic-management-global
