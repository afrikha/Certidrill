id: gcppca-4a-sh-cost-communication
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Product owners at a media company want to understand how their design decisions affect cloud costs. The finance department does not allow raw billing data to be shared outside the finance team. You need to keep the product owners informed so that they can take cost into account in their decisions.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the Billing Account Viewer role to all product owners, so that they can explore the raw billing data by themselves.
    - id: b
      text:
        en: |-
          Send the product owners the total amount of the monthly invoice, so that they can follow the overall cloud spending.
    - id: c
      text:
        en: |-
          Postpone the cost discussions until the end of the fiscal year, when finance publishes its annual cost report.
    - id: d
      text:
        en: |-
          Share dashboards and periodic reports with aggregated unit metrics, such as cost per transaction, and alerts on budget thresholds.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The Well-Architected Framework recommends sharing cost information with everyone whose decisions affect costs, through dashboards, periodic reports, and alerts. When raw cost data must stay restricted, it suggests aggregated or relative metrics such as cost per transaction or per user, which respect the finance policy while connecting costs to the product owners' decisions.
  options:
    a:
      en: |-
        This shares the raw billing data that finance does not allow outside its team.
    b:
      en: |-
        A single total cannot be linked to any product owner's design decisions.
    c:
      en: |-
        Yearly information arrives far too late to influence design decisions.
references:
  - title: "Foster a culture of cost awareness"
    url: https://docs.cloud.google.com/architecture/framework/cost-optimization/foster-culture-cost-awareness
