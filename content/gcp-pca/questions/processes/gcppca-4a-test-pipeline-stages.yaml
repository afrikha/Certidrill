id: gcppca-4a-test-pipeline-stages
objective: "4.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A startup is designing the automated testing strategy of its new CI/CD pipeline, built with Cloud Build and Cloud Deploy. It wants fast feedback for developers and confidence before each promotion to production, following Google-recommended practices.

    Which three practices should you include? Choose three.
body:
  options:
    - id: a
      text:
        en: |-
          Run the unit tests automatically on every commit, and fail the build when a test fails.
    - id: b
      text:
        en: |-
          Run all the tests only once a night, so that the pipeline stays fast during the day.
    - id: c
      text:
        en: |-
          Run integration tests in the pipeline against emulators or an ephemeral test environment.
    - id: d
      text:
        en: |-
          Replace the automated tests with a manual QA sign-off for every commit before it is merged.
    - id: e
      text:
        en: |-
          Skip testing before production, and rely only on production monitoring to detect defects.
    - id: f
      text:
        en: |-
          Run automated end-to-end tests in staging, and promote to production only when they pass.
  choose: 3
answer: { optionIds: [ a, c, f ] }
explanation:
  correct:
    en: |-
      The Well-Architected Framework recommends running unit, integration, and end-to-end tests automatically in CI/CD pipelines, guided by a strategy that defines the test types, their frequency, and pass/fail criteria. Unit tests on every commit give fast feedback, integration tests against emulators or ephemeral environments catch interaction problems without shared resources, and end-to-end tests in staging gate the promotion to production.
  options:
    b:
      en: |-
        Nightly runs delay feedback by hours, so defects are found long after they are introduced.
    d:
      en: |-
        Manual sign-off on every commit is slow and inconsistent; test automation is the DORA capability.
    e:
      en: |-
        Monitoring detects defects after users are affected; it does not replace pre-production testing.
references:
  - title: "Automate and manage change"
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/automate-and-manage-change
  - title: "DevOps capabilities"
    url: https://docs.cloud.google.com/architecture/devops
