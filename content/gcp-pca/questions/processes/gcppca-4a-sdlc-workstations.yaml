id: gcppca-4a-sdlc-workstations
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank is onboarding 200 contract developers who use their own laptops. Security requires that source code never be stored on contractor devices and that development environments run inside the bank's VPC network. The platform team wants a managed service, a development environment defined once as a container image, and automatic shutdown of unused environments to control costs.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Compute Engine VM for each contractor from a shared custom image, and have the contractors connect to it through IAP TCP forwarding.
    - id: b
      text:
        en: |-
          Have the contractors use Cloud Shell, and clone the bank's repositories into their Cloud Shell home directories.
    - id: c
      text:
        en: |-
          Distribute a standard dev container definition that the contractors run with Docker on their laptops over a VPN connection.
    - id: d
      text:
        en: |-
          Use Cloud Workstations with a workstation configuration that sets the container image and an idle timeout, in a cluster attached to the bank's VPC.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Cloud Workstations provides managed development environments that run on Compute Engine VMs in your project. A workstation configuration defines the machine type, storage, container image, and IDE once for everyone, the workstation cluster attaches the workstations to your VPC network, and idle or running timeouts shut down unused workstations. Developers connect with a browser-based or local IDE, so the code stays in Google Cloud.
  options:
    a:
      en: |-
        Individual VMs work, but the bank would manage the images, patching, and shutdown scheduling of 200 VMs itself, which fails the managed-service requirement.
    b:
      en: |-
        Cloud Shell is a personal, Google-managed environment that does not run in the bank's VPC network and is not built from an image that the platform team defines.
    c:
      en: |-
        The source code would be cloned onto the contractors' laptops, which security forbids.
references:
  - title: "Cloud Workstations overview"
    url: https://docs.cloud.google.com/workstations/docs/overview
