id: gcppca-4a-rca-connectivity-tests
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    After a network change, a Compute Engine VM can no longer reach an application server on TCP port 8443 in a peered VPC network. Several firewall rules, custom routes, and the peering connection could be involved. You need to identify quickly which configuration element drops the traffic, without installing anything on the VMs.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Enable VPC Flow Logs on both subnets, and wait for sampled records of the failed connections to appear in Cloud Logging.
    - id: b
      text:
        en: |-
          Run a Connectivity Tests analysis from the VM to the server on TCP port 8443, and review the trace of the simulated path.
    - id: c
      text:
        en: |-
          Instrument the client application with OpenTelemetry, and review the latency of its calls to the server in Cloud Trace.
    - id: d
      text:
        en: |-
          Open the Performance Dashboard, and compare the packet loss between the zones of the two VMs over the last day.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Connectivity Tests simulates the expected forwarding path of a packet from the source to the destination, evaluating firewall rules, routes, and VPC Network Peering along the way, and reports where the packet would be dropped. It needs no agent on the VMs and gives the answer in minutes.
  options:
    a:
      en: |-
        Flow logs record samples of flows, not an evaluation of the firewall, route, and peering configuration, so they do not say which element drops the packets.
    c:
      en: |-
        Cloud Trace measures request latency inside applications; it requires code changes and cannot explain a network path that never connects.
    d:
      en: |-
        The Performance Dashboard shows aggregate packet loss and latency of Google's network, not the configuration of one path.
references:
  - title: "Connectivity Tests overview"
    url: https://docs.cloud.google.com/network-intelligence-center/docs/connectivity-tests/concepts/overview
