id: gcppca-4a-sdlc-db-change
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company deploys its application code through an automated pipeline, but database administrators apply schema changes to the Cloud SQL databases by hand, from emails sent by developers. The test and production schemas regularly differ, and several releases have failed because of a missing column. The company wants to apply the DORA practice of database change management.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Ask the developers to attach the SQL scripts to the release ticket, so that the database administrators can review them before applying them by hand.
    - id: b
      text:
        en: |-
          Take a full export of the production database before each release, so that the database can be restored if a schema change fails.
    - id: c
      text:
        en: |-
          Store versioned migration scripts in the application's repository, and have the pipeline apply them automatically to each environment before the code is deployed.
    - id: d
      text:
        en: |-
          Give the developers the Cloud SQL Admin role in production, so that they can apply their own schema changes when they deploy the code.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Database change management treats schema changes like code: migration scripts are kept in version control with the application and applied by the same automated pipeline in every environment. Each environment then receives the same ordered changes, schemas stop drifting, and a release cannot reach production without the schema changes it depends on.
  options:
    a:
      en: |-
        Changes are still applied by hand, so test and production can still drift and releases can still miss a change.
    b:
      en: |-
        An export helps recovery after a failure, but it does nothing to keep the schemas consistent between environments.
    d:
      en: |-
        Manual changes by more people increase drift and break least privilege in production.
references:
  - title: "DevOps capabilities"
    url: https://docs.cloud.google.com/architecture/devops
