id: gcppca-cs7b-grant-budget
objective: "4.2.6"
type: single
caseStudy: gcppca-cs7b-veldhaven-genomics
difficulty: 3
status: draft
stem:
  en: |
    Veldhaven's finance office asks you how to enforce grant allocations on Google Cloud. The solution must meet the business requirement for grants, and the pipelines run on Compute Engine VMs created by Batch.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Create a budget for each grant project with programmatic notifications to Pub/Sub, and trigger a Cloud Run function that stops the project's Batch jobs and VMs when the actual cost reaches the allocation." } }
    - { id: b, text: { en: "Create a spend cap budget for each grant project set to the allocation, so that Google Cloud pauses the project's usage when the cap is reached." } }
    - { id: c, text: { en: "Create a budget for each grant project with programmatic notifications to Pub/Sub, and trigger a Cloud Run function that removes the project's billing account when the actual cost reaches the allocation." } }
    - { id: d, text: { en: "Set a Compute Engine vCPU quota on each grant project that matches its allocation, and send budget alerts by email to the grant holder at 50 %, 90 % and 100 % of the allocation." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A budget alone does not cap spending, but its programmatic notifications let a Cloud Run function act on the cost data. A function that stops the grant project's compute resources when the actual cost passes the allocation cuts the compute spending while the data in Cloud Storage and BigQuery stays in place. Because cost data reaches budgets with a delay, the budget amount can be set slightly below the allocation.
  options:
    b:
      en: Spend cap budgets cover only Gemini API, Gemini Enterprise Agent Platform, Cloud Run and Cloud Run functions in a single project; Batch jobs run on Compute Engine VMs, which a spend cap does not stop.
    c:
      en: Removing the billing account terminates every service of the project, including storage, and resources might be irretrievably deleted, which violates the requirement to keep the grant's data.
    d:
      en: A vCPU quota limits how many VMs run at the same time, not how much the grant spends over time, and email alerts do not stop any workload.
references:
  - title: Control resource usage with notifications
    url: https://docs.cloud.google.com/billing/docs/how-to/control-usage
  - title: Manage spend cap budgets
    url: https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps
