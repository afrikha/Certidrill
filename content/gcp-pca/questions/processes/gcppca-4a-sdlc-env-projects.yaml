id: gcppca-4a-sdlc-env-projects
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A fintech startup runs its development, test, and production workloads in a single Google Cloud project. Last week, a developer deleted a production Pub/Sub subscription while cleaning up test resources. The company wants strong isolation between environments, with separate IAM policies, quotas, and enabled APIs for each environment, and a structure that its CI/CD pipeline can deploy consistently.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the single project, add an environment label to every resource, and filter the console views by label so that developers see only test resources.
    - id: b
      text:
        en: |-
          Keep the single project, create a separate VPC network for each environment, and add firewall rules that block traffic between the networks.
    - id: c
      text:
        en: |-
          Create a separate project for each environment under environment folders, and deploy every environment from the same infrastructure-as-code definitions.
    - id: d
      text:
        en: |-
          Create one project per developer for development work, and keep the test and production resources together in the existing shared project.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The project is the boundary for IAM policies, quotas, enabled APIs, and billing, so one project per environment, grouped under folders such as development, nonproduction, and production as in the enterprise foundations blueprint, isolates the environments. Deploying all of them from the same infrastructure-as-code definitions through the pipeline keeps them consistent while each environment keeps its own access controls.
  options:
    a:
      en: |-
        Labels are metadata for organizing resources and reports; they are not an access boundary, and all environments would still share one IAM policy, one set of quotas, and the same enabled APIs.
    b:
      en: |-
        A VPC network isolates network traffic only. The deletion was an API call, and IAM policies, quotas, and APIs would still be shared by the three environments.
    d:
      en: |-
        Production would remain mixed with test resources in one project, which is exactly the situation that allowed the incident.
references:
  - title: "Deployment methodology"
    url: https://docs.cloud.google.com/architecture/blueprints/security-foundations/deployment-methodology
