id: gcppca-4b-cs-support-enhanced
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A startup has just launched its first production workload on Google Cloud and spends about $8,000 per month. It needs technical support around the clock for critical incidents, with an initial response within one hour. It does not need a Technical Account Manager, and it wants to minimize the cost of support.

    Which Customer Care offering should you recommend?
body:
  options:
    - id: a
      text: { en: "Enhanced Support" }
    - id: b
      text: { en: "Standard Support" }
    - id: c
      text: { en: "Premium Support" }
    - id: d
      text: { en: "Basic Support with the Active Assist recommendations" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Enhanced Support is designed for production workloads: it offers 24/7 response for high- and critical-impact issues with a 1-hour initial response for P1 cases, at a lower price than Premium Support.
  options:
    b:
      en: |
        Standard Support is for workloads under development: it has no P1 response target and handles high-impact issues during business hours (8/5) only.
    c:
      en: |
        Premium Support meets the response requirement, but its minimum monthly charge is far higher, and its Technical Account Manager is not needed, so it does not minimize cost.
    d:
      en: |
        Basic Support does not include technical support cases, so it cannot provide any incident response.
references:
  - title: Customer Care
    url: https://cloud.google.com/support
