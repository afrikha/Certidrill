id: gcppca-cs1c-readings-table-cost
objective: "4.2.6"
type: single
caseStudy: gcppca-cs1c-furrowline-agtech
difficulty: 1
status: draft
stem:
  en: |
    You need to reorganize the readings table in BigQuery. The new table must meet the business requirement for analysis.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a table partitioned by ingestion time and clustered by farm ID, and require a partition filter on the table." } }
    - { id: b, text: { en: "Create a table partitioned by day on the reading timestamp and clustered by farm ID, and require a partition filter on the table." } }
    - { id: c, text: { en: "Create a table clustered by the reading timestamp and the farm ID, without partitioning, and set a custom quota on the bytes each analyst can query per day." } }
    - { id: d, text: { en: "Export the readings older than one year to Coldline Cloud Storage files, and query them through an external table with the recent readings." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Partitioning by day on the reading timestamp lets BigQuery scan only the partitions that match the analysts' timestamp filters, and clustering by farm ID reduces the bytes read inside each partition. Requiring a partition filter rejects every query that has no filter on the partitioning column, so no query can scan five years of readings; five years of daily partitions stay well under the limit of 10,000 partitions per table.
  options:
    a:
      en: Gateways upload buffered readings days late, so the ingestion time does not match the reading timestamp that the analysts filter on, and their filters would not prune partitions.
    c:
      en: Without partitioning there is no partition filter to require, so a query without a timestamp filter can still scan the whole table; a quota only stops an analyst after the cost is incurred.
    d:
      en: The readings table stays unpartitioned and the external table requires no filter, so a query without a timestamp filter still reads all five years, and reading Coldline files adds retrieval fees.
references:
  - title: Introduction to partitioned tables
    url: https://docs.cloud.google.com/bigquery/docs/partitioned-tables
  - title: Create partitioned tables
    url: https://docs.cloud.google.com/bigquery/docs/creating-partitioned-tables
