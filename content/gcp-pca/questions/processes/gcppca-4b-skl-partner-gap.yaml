id: gcppca-4b-skl-partner-gap
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retailer must exit its data center in nine months, when the hosting contract ends. The internal team will operate the migrated GKE workloads afterward, but today it has little Kubernetes or SRE experience, and a full training program would take longer than the deadline allows. The CTO wants to meet the deadline without depending on outsiders to run the platform in the long term.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Engage a Google Cloud partner to work alongside the internal engineers on the first migrations while the engineers follow a role-based learning path, with knowledge-transfer milestones." }
    - id: b
      text: { en: "Postpone the migration until every engineer on the team holds a Google Cloud professional certification." }
    - id: c
      text: { en: "Outsource the migration and the ongoing operations to a contractor, and grant the contractor the Admin basic role on the organization to remove access delays." }
    - id: d
      text: { en: "Have the internal team migrate the workloads alone after reading the documentation, and engage a partner only if the first production incident occurs." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Partners are best used to fill specific knowledge gaps while the internal team is upskilled through a structured learning plan. Pairing on the first migrations meets the deadline and transfers the skills, so the internal team can run the platform afterward.
  options:
    b:
      en: |
        Waiting for certifications misses the fixed contract deadline.
    c:
      en: |
        This creates the long-term dependency the CTO wants to avoid, and organization-wide Admin access for a third party breaks least privilege.
    d:
      en: |
        An inexperienced team working alone puts the deadline and production at risk, and waiting for an incident is reactive.
references:
  - title: The Google Cloud Adoption Framework
    url: https://services.google.com/fh/files/misc/google_cloud_adoption_framework_whitepaper.pdf
