id: gcppca-cs4b-linecheck-upgrades
objective: "4.2.2"
type: single
caseStudy: gcppca-cs4b-corvane-components
difficulty: 3
status: draft
stem:
  en: |
    Corvane's change advisory board asks you to define how LineCheck's GKE cluster will receive version changes. The process must meet the business requirement about the model-year launch and the technical requirements for the cluster.

    What should you configure on the cluster?
body:
  options:
    - { id: a, text: { en: "A recurring maintenance window on Sundays from 06:00 to 12:00 UTC, and a maintenance exclusion with the \"No upgrades\" scope that covers the eight weeks of the launch." } }
    - { id: b, text: { en: "A recurring maintenance window on Sundays from 06:00 to 12:00 UTC, and a maintenance exclusion with the \"No minor upgrades\" scope that covers the eight weeks of the launch." } }
    - { id: c, text: { en: "A recurring maintenance window on Sundays from 06:00 to 12:00 UTC, and a maintenance exclusion with the \"No minor or node upgrades\" scope that covers the eight weeks of the launch." } }
    - { id: d, text: { en: "Unenroll the cluster from its release channel, disable node auto-upgrade on its node pools, and have the platform team upgrade the nodes on Sundays outside the launch." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The maintenance window limits automatic upgrades to the Sunday slot outside the launch. The "No minor or node upgrades" scope blocks minor upgrades of the control plane and every node upgrade, so no automatic node change restarts LineCheck's Pods, while it still allows patch upgrades of the control plane, as the security requirement demands. Scoped exclusions are available because the cluster is enrolled in a release channel.
  options:
    a:
      en: The "No upgrades" scope also blocks patch upgrades of the control plane, which must keep receiving them during the launch.
    b:
      en: The "No minor upgrades" scope still allows patch upgrades of the nodes, which recreate the nodes and restart LineCheck's Pods during the launch.
    d:
      en: Manual node upgrades contradict the requirement that the platform team does not plan or start upgrades, and without a release channel only the "No upgrades" scope remains available for exclusions.
references:
  - title: Maintenance windows and exclusions
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/maintenance-windows-and-exclusions
