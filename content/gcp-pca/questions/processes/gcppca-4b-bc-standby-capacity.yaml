id: gcppca-4b-bc-standby-capacity
objective: "4.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A ticketing company's booking service runs on a regional managed instance group in one region behind a global external Application Load Balancer. The business continuity plan requires the service to recover within five minutes from the loss of the whole region. The current runbook creates the instances in a second region with Compute Engine API calls only after the outage is declared.

    What should you change?
body:
  options:
    - id: a
      text: { en: "Keep a running managed instance group in a second region as another backend of the load balancer, so that health checks move traffic without any provisioning." }
    - id: b
      text: { en: "Reserve the required machine types in a zone of the second region, and keep the runbook that creates the instances there after the outage is declared." }
    - id: c
      text: { en: "Script the instance creation in the second region with `gcloud` and an instance template, so that the runbook runs faster." }
    - id: d
      text: { en: "Take snapshots of the instances' disks every hour, and restore them in the second region when the outage is declared." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Google recommends keeping business-critical recovery paths free of management-plane operations such as creating VMs, because those calls and the capacity they need may not be available during a regional outage. A running backend in a second region behind the global load balancer receives the traffic as soon as health checks mark the failed region unhealthy, which meets the five-minute objective.
  options:
    b:
      en: |
        A reservation secures the capacity, but the recovery still depends on creating instances and attaching them to the load balancer during the outage, which are management-plane operations that may fail and take time.
    c:
      en: |
        A faster script still depends on creating VMs during the outage, a management-plane operation that may fail or find no capacity.
    d:
      en: |
        Restoring disks and creating instances during the outage depends on management-plane operations and is unlikely to finish in five minutes.
references:
  - title: Architecting disaster recovery for cloud infrastructure outages
    url: https://docs.cloud.google.com/architecture/disaster-recovery
