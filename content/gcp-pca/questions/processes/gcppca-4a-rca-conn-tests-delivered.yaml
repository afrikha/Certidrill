id: gcppca-4a-rca-conn-tests-delivered
objective: "4.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Clients on a Compute Engine VM cannot open TCP connections to a service on port 8443 of another VM in the same VPC network. A Connectivity Tests configuration analysis between the two VMs on that port returns "Packet could be delivered". The service process is running on the destination VM.

    Which two issues could explain the failure? Choose two.
body:
  options:
    - id: a
      text:
        en: |-
          A firewall inside the guest operating system of the destination VM blocks inbound connections on TCP port 8443.
    - id: b
      text:
        en: |-
          An ingress VPC firewall rule with a higher priority than the allow rule denies TCP port 8443 to the destination VM.
    - id: c
      text:
        en: |-
          The service on the destination VM listens only on the loopback address 127.0.0.1 instead of the VM's internal IP address.
    - id: d
      text:
        en: |-
          The subnet route to the destination VM's subnet is missing from the routing table of the VPC network.
    - id: e
      text:
        en: |-
          No Cloud NAT gateway is configured for the region of the subnet that contains the client VM.
  choose: 2
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      A configuration analysis models Google Cloud configuration such as VPC firewall rules, routes, and peering; its result does not reflect what happens inside the VMs, so "Packet could be delivered" does not guarantee that traffic passes. A guest OS firewall and a service bound only to the loopback interface are outside that model and both make connections fail. Live data plane analysis, where supported, and checks inside the VM confirm such causes.
  options:
    b:
      en: |-
        The configuration analysis evaluates VPC firewall rules by priority, so a higher-priority deny rule would have made it report a drop.
    d:
      en: |-
        Routes are part of the analysis; a missing route would have been reported as the reason for a drop.
    e:
      en: |-
        Cloud NAT provides outbound internet access; traffic between internal IP addresses in the same VPC network does not use it.
references:
  - title: "Connectivity Tests overview"
    url: https://docs.cloud.google.com/network-intelligence-center/docs/connectivity-tests/concepts/overview
