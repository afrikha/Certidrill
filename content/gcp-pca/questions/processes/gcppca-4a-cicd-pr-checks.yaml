id: gcppca-4a-cicd-pr-checks
objective: "4.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A startup hosts its code on GitHub and uses Cloud Build for CI. Today, builds and unit tests run only after changes are merged into the main branch, so broken code regularly reaches main. The team wants each proposed change to be built and tested before it is merged, and wants merges into main to be blocked when the build fails.

    Which two actions should you take? Choose two.
body:
  options:
    - id: a
      text:
        en: |-
          Create a Cloud Build trigger for the pull request event on the main branch that builds the code and runs the unit tests.
    - id: b
      text:
        en: |-
          Create a Cloud Build trigger for the push to branch event on main that runs the unit tests a second time after each merge.
    - id: c
      text:
        en: |-
          Add a branch protection rule on main in GitHub that requires the Cloud Build check to pass before a pull request can be merged.
    - id: d
      text:
        en: |-
          Configure the existing Cloud Build trigger to require approval, so that a reviewer approves each build before it runs.
    - id: e
      text:
        en: |-
          Create a scheduled Cloud Build trigger that builds the main branch every night and emails the failed tests to the team.
  choose: 2
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      A trigger on the pull request event builds and tests the commits of each pull request before it is merged, which gives developers feedback on the proposed change. Making that Cloud Build check required in a GitHub branch protection rule blocks the merge until the build passes, so broken code cannot reach main.
  options:
    b:
      en: |-
        A trigger on pushes to main still runs after the merge, when the broken code is already on main.
    d:
      en: |-
        Build approval gates when a build may start; it does not test changes before merge or block failing merges.
    e:
      en: |-
        A nightly build reports failures hours after the merge, which is the current problem.
references:
  - title: "Create and manage build triggers"
    url: https://docs.cloud.google.com/build/docs/automating-builds/create-manage-triggers
