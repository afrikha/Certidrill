id: gcppca-4b-cost-showback
objective: "4.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A university's central IT department pays for all Google Cloud usage from one Cloud Billing account. Finance wants a monthly showback report of costs by department, and the cost of individual resources to investigate the largest items. Projects are shared between departments, so the project alone does not identify the department.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Export Cloud Asset Inventory snapshots to BigQuery every month and join them with the invoice totals." }
    - id: b
      text: { en: "Enable Data Access audit logs for all services and count the requests made by each department's users." }
    - id: c
      text: { en: "Enable the export of detailed usage cost data from the Cloud Billing account to a BigQuery dataset." }
    - id: d
      text: { en: "Apply a `department` label to every resource consistently, for example through the infrastructure as code modules." }
    - id: e
      text: { en: "Enable only the export of pricing data to BigQuery and multiply the list prices by each department's resource count." }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      The detailed usage cost export to BigQuery contains everything in the standard export plus resource-level cost data, and it includes the labels of the resources. With a consistent `department` label, finance can group costs by department even inside shared projects and drill down to individual resources. Google recommends enabling the export early because history is only partly backfilled.
  options:
    a:
      en: |
        Cloud Asset Inventory lists resources and their metadata, not their costs, so joining it with invoice totals cannot attribute costs accurately.
    b:
      en: |
        Audit logs record API activity, not costs, and they add logging charges.
    e:
      en: |
        Pricing data holds list prices and SKUs, not actual usage, discounts, or credits, so it cannot produce a cost report.
references:
  - title: Export Cloud Billing data to BigQuery
    url: https://docs.cloud.google.com/billing/docs/how-to/export-data-bigquery
