id: gcppca-4b-dec-error-budget
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    At a travel booking company, the product team wants to keep releasing features every week, while the SRE team asks for a release freeze after each incident. Each disagreement is escalated to the VP of Engineering, and decisions differ from one incident to the next. The VP wants a decision rule that both teams agree on in advance.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Freeze all releases for two weeks after every production incident, whatever its impact on users." }
    - id: b
      text: { en: "Let the product team decide on each release, and let the SRE team decide on each rollback, without a shared rule." }
    - id: c
      text: { en: "Define SLOs with the product owners and a documented error budget policy: releases continue while budget remains, and the teams shift to reliability work when the budget is exhausted." }
    - id: d
      text: { en: "Set the availability SLO to 100% so that any incident automatically stops releases until the root cause is fixed." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An SLO turns the trade-off into data: while error budget remains, the team ships features; when it is spent, effort goes to reliability. Writing this in an error budget policy agreed by product, development, and SRE in advance makes the outcome predictable and removes case-by-case escalations.
  options:
    a:
      en: |
        A fixed freeze after every incident ignores how much unreliability users actually experienced and slows delivery needlessly.
    b:
      en: |
        Without a shared rule, the same disagreements continue and still need escalation.
    d:
      en: |
        A 100% target leaves no error budget at all, so every minor failure would block releases; Google advises against 100% reliability targets.
references:
  - title: Set realistic targets for reliability
    url: https://docs.cloud.google.com/architecture/framework/reliability/set-targets
  - title: Consequences of SLO violations—CRE life lessons
    url: https://cloud.google.com/blog/products/gcp/consequences-of-slo-violations-cre-life-lessons
