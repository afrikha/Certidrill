id: gcppca-4a-sh-resistant-ops
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's on-premises operations team openly resists the move to Google Cloud. Its members fear that their skills will become obsolete and that their jobs will disappear, and they delay the requests of the migration team. Their knowledge of the existing systems is critical to the migration.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the operations team's tasks with contractors, so that its resistance no longer affects the migration schedule.
    - id: b
      text:
        en: |-
          Ask the CIO to send a memo that orders the operations team to support the migration team's requests immediately.
    - id: c
      text:
        en: |-
          Postpone the migration of the systems that the operations team manages until its members have left the company.
    - id: d
      text:
        en: |-
          Hear the team's concerns, involve it in designing the new operating model, and offer learning paths for its future roles.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Resistance driven by fear is best addressed by listening and involving people: giving the operations team a role in designing how cloud workloads will be operated uses its knowledge and gives it a future in the program. The Adoption Framework's Learn theme stresses upskilling existing IT staff, and Google offers role-based learning paths for infrastructure operators.
  options:
    a:
      en: |-
        Sidelining the team loses the knowledge that the migration needs and confirms its fears.
    b:
      en: |-
        An order may force compliance, but it does not address the concerns and keeps the knowledge locked away.
    c:
      en: |-
        Waiting for people to leave delays the program and wastes their critical knowledge.
references:
  - title: "Adoption Framework"
    url: https://cloud.google.com/adoption-framework
  - title: "Migrate to Google Cloud: Assess and discover your workloads"
    url: https://docs.cloud.google.com/architecture/migration-to-gcp-assessing-and-discovering-your-workloads
