id: gcppca-4a-sh-conflicting-goals
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Two business units share a new order platform. The sales unit insists on a multi-region active-active design for maximum availability, and the finance unit insists on a single-region design to minimize cost. Both escalate to you, the lead architect, and the executive sponsor asks you to facilitate a decision that both units will support.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Choose the multi-region design, and explain to the finance unit that availability always matters more than cost for systems that customers use.
    - id: b
      text:
        en: |-
          Run a workshop that quantifies the cost of downtime and of each option, agree on reliability targets, and document the decision and the rejected options.
    - id: c
      text:
        en: |-
          Let each business unit build, operate, and pay for its own version of the platform, so that each unit gets exactly the design that it asked for.
    - id: d
      text:
        en: |-
          Choose the single-region design, because the finance unit controls the budget, and revisit the decision after the first major outage.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Facilitation turns opposing positions into shared criteria: quantifying what downtime costs the business and what each design costs lets both units agree on a target that is just reliable enough, as the Well-Architected Framework recommends, rather than defaulting to the maximum. Recording the decision and the alternatives that were rejected, for example in an architecture decision record, keeps the agreement visible and revisitable.
  options:
    a:
      en: |-
        Imposing one side's position ignores the cost-benefit trade-off and loses the finance unit's support.
    c:
      en: |-
        Duplicating the platform multiplies costs and operations to avoid a decision instead of facilitating one.
    d:
      en: |-
        Deciding by budget ownership alone ignores the business impact of downtime and loses the sales unit's support.
references:
  - title: "Set realistic targets for reliability"
    url: https://docs.cloud.google.com/architecture/framework/reliability/set-targets
  - title: "Architecture decision records overview"
    url: https://docs.cloud.google.com/architecture/architecture-decision-records
