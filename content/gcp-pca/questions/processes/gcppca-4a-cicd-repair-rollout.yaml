id: gcppca-4a-cicd-repair-rollout
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retailer deploys to a production GKE target with Cloud Deploy, and deployment verification is enabled on that target. Verification sometimes fails transiently because a dependency is slow to warm up. The SRE team wants Cloud Deploy to retry a failed rollout once after five minutes and, if the retry also fails, to roll back automatically to the last successful release, without writing or hosting any custom code.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Add an automation with a repairRolloutRule for the production target that retries once after a five-minute wait and then rolls back.
    - id: b
      text:
        en: |-
          Create a Cloud Monitoring alert on failed rollouts that triggers a Cloud Run function, which calls the Cloud Deploy API to roll back the target.
    - id: c
      text:
        en: |-
          Create a deploy policy on the production target that restricts rollouts when the verify job fails, and suspend the delivery pipeline.
    - id: d
      text:
        en: |-
          Add an automation with a promoteReleaseRule and a five-minute wait, so that the next release is promoted automatically after a failure.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A repairRolloutRule automation retries a failed rollout after the configured wait, for the configured number of attempts. If all retries fail, Cloud Deploy creates a new rollout that rolls back to the most recent successful release on the target. A failed verify job fails the rollout, so the rule covers this case with configuration only.
  options:
    b:
      en: |-
        This works, but it requires writing, deploying, and maintaining custom code, which the team wants to avoid.
    c:
      en: |-
        Deploy policies restrict actions during time windows; they do not react to verification results, retry rollouts, or roll back.
    d:
      en: |-
        promoteReleaseRule promotes a release to the next target after a successful rollout; it does not repair or roll back a failed one.
references:
  - title: "Automate your deployment"
    url: https://docs.cloud.google.com/deploy/docs/automation
  - title: "Verify your deployment"
    url: https://docs.cloud.google.com/deploy/docs/verify-deployment
