id: gcppca-cs1b-claims-db-dr
objective: "4.1.6"
type: single
caseStudy: gcppca-cs1b-halden-mutual
difficulty: 3
status: draft
stem:
  en: |
    You need to design the disaster recovery of the claims intake database. The design must meet the technical requirements for the claims intake API.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Use a Cloud SQL Enterprise Plus instance with a designated DR replica in europe-west4, connect the application through the instance's write endpoint, and run the quarterly tests with a switchover." } }
    - { id: b, text: { en: "Use a Cloud SQL Enterprise edition instance with high availability in europe-west3, and run the quarterly tests by failing over the instance to its standby." } }
    - { id: c, text: { en: "Use a Cloud SQL Enterprise edition instance with a cross-region read replica in europe-west4, and run the quarterly tests by promoting the replica and creating a new replica in europe-west3." } }
    - { id: d, text: { en: "Use a Cloud SQL Enterprise Plus instance with automated backups stored in the EU multi-region, and run the quarterly tests by restoring the latest backup to a new instance in europe-west4." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Advanced disaster recovery, available with Cloud SQL Enterprise Plus, keeps a designated DR replica in another region. A replica failover promotes it after a regional outage, and a switchover swaps the primary and the replica only once replication lag reaches zero, so the quarterly tests move the database to europe-west4 and back without data loss. The write endpoint is a DNS name that always resolves to the current primary, so the application keeps its connection configuration.
  options:
    b:
      en: High availability places the standby in another zone of the same region, so it does not protect against the loss of europe-west3 and never moves the database to europe-west4.
    c:
      en: Promoting a regular cross-region replica breaks replication, makes falling back a manual multi-step task, and changes the address the application connects to.
    d:
      en: Restoring a backup to a new instance gives an RPO equal to the time since the last backup and can take hours for a large database, and the application must point to the new instance.
references:
  - title: About disaster recovery (DR) in Cloud SQL
    url: https://docs.cloud.google.com/sql/docs/postgres/intro-to-cloud-sql-disaster-recovery
