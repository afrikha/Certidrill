id: gcppca-4a-test-backup-restore
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retailer takes nightly backups of its Cloud SQL databases and Compute Engine VMs, and every backup job reports success. No backup has ever been restored. Auditors now ask for evidence that the backups can be used to recover the services within the RPO stated in the disaster recovery plan.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Restore the backups on a regular schedule into an isolated test project, and check the data's consistency and recency against the RPO.
    - id: b
      text:
        en: |-
          Increase the backup frequency to every hour, so that each backup is closer to the RPO stated in the plan.
    - id: c
      text:
        en: |-
          Copy every backup to a second region, so that a valid copy exists even if the primary region becomes unavailable.
    - id: d
      text:
        en: |-
          Export the success status of every backup job from the console each month, and give the report to the auditors as evidence.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Google recommends testing data recovery, not just backup creation: restore from backups regularly, check that the restored data is consistent and recent enough to meet the RPO, and confirm that the backup recovery path actually works. Restoring into an isolated project tests the procedure without affecting production and produces evidence for the auditors.
  options:
    b:
      en: |-
        More frequent backups may improve the RPO, but they still prove nothing about whether recovery works.
    c:
      en: |-
        A second copy improves resilience, but an untested copy is no more proven than the first one.
    d:
      en: |-
        A successful backup job does not prove that the backup can be restored or that the restored data is usable.
references:
  - title: "Perform testing for recovery from failures"
    url: https://docs.cloud.google.com/architecture/framework/reliability/perform-testing-for-recovery-from-failures
  - title: "Disaster recovery planning guide"
    url: https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide
