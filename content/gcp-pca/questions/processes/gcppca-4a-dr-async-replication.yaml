id: gcppca-4a-dr-async-replication
objective: "4.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A manufacturer migrated a legacy application to a Compute Engine VM that writes to three Hyperdisk Balanced data disks, which must stay consistent with each other. For a regional outage, the business requires an RPO of about one minute and an RTO of under one hour, in a second region on the same continent. The application cannot be changed.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a snapshot schedule that takes hourly snapshots of the three disks and stores them in a multi-region location.
    - id: b
      text:
        en: |-
          Replace the data disks with Hyperdisk Balanced High Availability disks that are replicated across two zones of the region.
    - id: c
      text:
        en: |-
          Protect the VM with a Backup and DR backup plan that runs every four hours and stores backups in a cross-region vault.
    - id: d
      text:
        en: |-
          Enable Asynchronous Replication of the three disks to the second region, and add the primary disks to one consistency group.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Asynchronous Replication replicates disks, including Hyperdisk Balanced, to a secondary region on the same continent with a target RPO of one minute and an RTO typically of a few minutes for failover. A consistency group keeps the replication of several disks aligned to a common point in time, so the three data disks stay consistent with each other in the secondary region.
  options:
    a:
      en: |-
        Hourly snapshots give an RPO of up to an hour, far above one minute.
    b:
      en: |-
        High availability disks replicate between two zones of one region, so they do not survive a regional outage.
    c:
      en: |-
        A four-hour backup schedule gives an RPO of up to four hours.
references:
  - title: "About Asynchronous Replication"
    url: https://docs.cloud.google.com/compute/docs/disks/async-pd/about
