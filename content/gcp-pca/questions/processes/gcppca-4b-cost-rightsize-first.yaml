id: gcppca-4b-cost-rightsize-first
objective: "4.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Three months after a lift-and-shift migration, a retail company runs 400 Compute Engine VMs. Many were copied with their on-premises sizes, and some are no longer used. Finance plans to purchase 3-year commitments next month to cover the current footprint. The application owners agree to resize or remove VMs only when they see evidence based on actual usage.

    What should you do first?
body:
  options:
    - id: a
      text: { en: "Purchase the commitments now for the current footprint, and resize the VMs later, because the commitment discount starts the day after purchase." }
    - id: b
      text: { en: "Review the idle VM and machine type recommendations with the application owners, apply them, and then size the commitments on the optimized usage." }
    - id: c
      text: { en: "Purchase commitments for the peak usage observed during the last three months, so that future growth is covered." }
    - id: d
      text: { en: "Change all VMs to E2 machine types so that they receive sustained use discounts, and skip the commitments." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The idle VM and VM machine type recommenders analyze actual usage and suggest removing unused VMs and resizing oversized ones, which is the evidence the owners ask for; the FinOps hub surfaces these recommendations for billing managers. Commitments are billed for the whole term whether or not they are used, so you size them on the optimized baseline after rightsizing.
  options:
    a:
      en: |
        Committing first locks in the cost of oversized and unused VMs for three years; commitments cannot be cancelled.
    c:
      en: |
        Committing to the peak of an unoptimized footprint pays for capacity that is not used most of the time.
    d:
      en: |
        E2 machine types are not eligible for sustained use discounts, and a blanket change ignores the usage evidence the owners require.
references:
  - title: Recommenders
    url: https://docs.cloud.google.com/recommender/docs/recommenders
  - title: Committed use discounts (CUDs) for Compute Engine
    url: https://docs.cloud.google.com/compute/docs/instances/committed-use-discounts-overview
