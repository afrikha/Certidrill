id: gcppca-4a-dr-spanner-dual-region
objective: "4.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payment company is designing a new relational ledger database. Regulations require that the data stay within one country, in which Google Cloud offers two regions and a Spanner dual-region configuration. The database must survive the loss of a whole region without losing any committed transaction, and needs strong consistency.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          A Spanner instance with a dual-region configuration that places its replicas in the two regions of the country
    - id: b
      text:
        en: |-
          A Spanner instance with a regional configuration in one of the two regions, with daily backups copied to the other region
    - id: c
      text:
        en: |-
          A Cloud SQL for PostgreSQL Enterprise Plus instance with high availability and a cross-region DR replica
    - id: d
      text:
        en: |-
          A Spanner instance with a multi-region configuration that places its replicas in several countries of the continent
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A Spanner dual-region configuration keeps replicas in two regions of one country, with writes requiring voting replicas in both regions, so data replicates with strong consistency and Google documents a zero recovery point objective for a regional outage. It also offers 99.999 % availability while keeping the data in the country.
  options:
    b:
      en: |-
        A regional configuration survives zone failures only, and restoring a daily backup loses up to a day of transactions.
    c:
      en: |-
        Cloud SQL cross-region replication is asynchronous, so a failover after a regional outage can lose recent transactions.
    d:
      en: |-
        A multi-region configuration across several countries breaks the data residency requirement.
references:
  - title: "Regional, dual-region, and multi-region configurations"
    url: https://docs.cloud.google.com/spanner/docs/instance-configurations
  - title: "About disaster recovery (DR) in Cloud SQL"
    url: https://docs.cloud.google.com/sql/docs/mysql/intro-to-cloud-sql-disaster-recovery
