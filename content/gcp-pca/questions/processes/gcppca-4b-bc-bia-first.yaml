id: gcppca-4b-bc-bia-first
objective: "4.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company is writing its first business continuity plan for 40 applications that it runs on Google Cloud. The board asks how long each application can be unavailable and how much data each can afford to lose, but nobody has defined these values yet.

    What should you do first?
body:
  options:
    - id: a
      text: { en: "Deploy every application in an active-active configuration across two regions, so that the plan covers the worst case." }
    - id: b
      text: { en: "Run a business impact analysis with the application owners to define the RTO and RPO of each application." }
    - id: c
      text: { en: "Replicate every database to a multi-region configuration, and define the objectives later from the replication lag." }
    - id: d
      text: { en: "Purchase Premium Support, so that Google defines the recovery objectives of each application." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Disaster recovery is a subset of business continuity planning, and it begins with a business impact analysis that defines two key metrics: the recovery time objective (RTO), the maximum acceptable time offline, and the recovery point objective (RPO), the maximum acceptable period of data loss. Only then can you choose a recovery design for each application.
  options:
    a:
      en: |
        Designing before defining the objectives over-engineers most applications; tighter objectives cost more to meet.
    c:
      en: |
        The objectives are business requirements that drive the design, not values derived from a technology chosen in advance.
    d:
      en: |
        Customer Care helps with support cases; recovery objectives are business decisions that the company's application owners must make.
references:
  - title: Disaster recovery planning guide
    url: https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide
