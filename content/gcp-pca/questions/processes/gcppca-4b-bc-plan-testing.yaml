id: gcppca-4b-bc-plan-testing
objective: "4.2.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A payment processor has written a recovery plan for a regional outage of its Google Cloud workloads. The plan has never been tested, and several steps say only "restore the database" or "repoint the traffic". The COO wants the plan to work during a real outage and asks you how to prepare and test it, following Google's recommendations.

    Which three actions should you recommend? Choose three.
body:
  choose: 3
  options:
    - id: a
      text: { en: "Rewrite each task of the plan as one or more concrete, unambiguous commands or actions." }
    - id: b
      text: { en: "Include a test scenario in which the usual access path to Google Cloud, such as the corporate VPN or identity provider, is unavailable." }
    - id: c
      text: { en: "Verify during each test that the permissions in the recovery environment match those in production." }
    - id: d
      text: { en: "Test the plan once before go-live, and afterward only after a real outage has occurred." }
    - id: e
      text: { en: "Run the tests in a lab environment that grants broader permissions than production, so that access problems do not interrupt the tests." }
    - id: f
      text: { en: "Skip regional failover tests, because the workloads already use regional managed services spread across zones." }
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: |
      Google's planning guide recommends making every task of a recovery plan concrete and unambiguous, testing the plan regularly, and including tests where the usual access path to Google Cloud is not available. It also recommends verifying that the permissions in the recovery environment match production, so that the recovery is not blocked by missing access.
  options:
    d:
      en: |
        Plans must be tested regularly and adjusted after each test; waiting for a real outage reveals the gaps when it is too late.
    e:
      en: |
        Broader permissions hide exactly the access problems that would block a real recovery.
    f:
      en: |
        Regional services protect against zone failures, not against the loss of a whole region, so the regional failover must still be tested.
references:
  - title: Disaster recovery planning guide
    url: https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide
  - title: Architecting disaster recovery for cloud infrastructure outages
    url: https://docs.cloud.google.com/architecture/disaster-recovery
