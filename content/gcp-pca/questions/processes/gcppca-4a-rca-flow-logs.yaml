id: gcppca-4a-rca-flow-logs
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company's monthly bill shows that internet egress from one production VPC network has tripled. About 300 Compute Engine VMs and several GKE clusters run in that network. The finance team asks you to find which instances are sending the traffic and to which external destinations, so that the cause can be fixed.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run a Connectivity Tests analysis from each VM to the internet, and compare the forwarding paths that the tests report.
    - id: b
      text:
        en: |-
          Enable Data Access audit logs for Compute Engine, and look for the API calls that created the outbound connections.
    - id: c
      text:
        en: |-
          Review the Cloud Billing report grouped by SKU, and sort the projects by their network internet egress cost.
    - id: d
      text:
        en: |-
          Enable VPC Flow Logs on the network's subnets, and analyze the logged flows by source instance and external destination.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      VPC Flow Logs sample the packets sent and received by VM instances, including GKE nodes, and aggregate them into flows with their endpoints and estimated byte counts. Analyzing those flows in Cloud Logging by source instance and external destination shows which workloads generate the egress; the documentation lists network forensics and expense optimization among its uses.
  options:
    a:
      en: |-
        Connectivity Tests checks whether a path is possible; it does not measure the traffic that instances actually send.
    b:
      en: |-
        Audit logs record API calls to Google Cloud services, not the network connections that workloads open.
    c:
      en: |-
        The billing report confirms the cost at project and SKU level, but it does not identify the instances or the destinations.
references:
  - title: "VPC Flow Logs"
    url: https://docs.cloud.google.com/vpc/docs/flow-logs
