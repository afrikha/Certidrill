id: gcppca-4a-rca-error-reporting
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company runs about 30 services on Cloud Run and GKE that write exceptions with stack traces to Cloud Logging. After each release, engineers search the logs by hand to find out whether new kinds of exceptions have appeared, and the same exception often produces thousands of entries. The team wants a managed way to see the top and new errors of its running services so that it can fix root causes faster.

    What should you use?
body:
  options:
    - id: a
      text:
        en: |-
          Cloud Profiler, with the profiling agent added to each service
    - id: b
      text:
        en: |-
          Cloud Trace, with the services instrumented with OpenTelemetry
    - id: c
      text:
        en: |-
          Error Reporting, with the exceptions that the services already log
    - id: d
      text:
        en: |-
          Connectivity Tests, with one test between each pair of services
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Error Reporting aggregates and displays the errors produced by running cloud services, so engineers see the top and new errors instead of thousands of individual log entries. Services can report errors by writing formatted errors to Cloud Logging, which these services already do, or through the Error Reporting API.
  options:
    a:
      en: |-
        Cloud Profiler shows where code consumes CPU and memory; it does not collect or group exceptions.
    b:
      en: |-
        Cloud Trace shows request latency across services; it does not aggregate exceptions into errors to fix.
    d:
      en: |-
        Connectivity Tests diagnoses network reachability, not application exceptions.
references:
  - title: "Error Reporting documentation"
    url: https://docs.cloud.google.com/error-reporting/docs
