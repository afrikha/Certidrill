id: gcppca-4b-skl-learning-program
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company assessed its cloud maturity with the Google Cloud Adoption Framework. For the Learn theme, the result is tactical: engineers upskill on their own time when they feel motivated, and third-party contractors with broad privileged access do most of the essential cloud work. The CIO wants the Learn theme to reach the strategic phase within a year.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Run a program-managed learning plan for every IT role involved in the adoption, with scheduled classes and budgeted certifications, and use partners to fill specific knowledge gaps." }
    - id: b
      text: { en: "Let each engineer study on their own with free trial accounts, and reimburse any certification exam that an engineer chooses to take." }
    - id: c
      text: { en: "Make internal hackathons and public tech talks the main way that engineers learn, and use partners mainly as staff augmentation." }
    - id: d
      text: { en: "Replace the current contractors with a larger partner that can take over all cloud work, and grant it organization-level access to move faster." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In the Adoption Framework, the strategic phase of the Learn theme means upskilling is program-managed for every IT role involved: a published learning plan, regular classes, and budgeted certifications. Partners are then used to fill specific knowledge gaps instead of doing the essential work with wide privileged access.
  options:
    b:
      en: |
        Self-study on a best-effort basis is exactly the tactical phase the company wants to leave.
    c:
      en: |
        Hackathons, public thought leadership, and partners as staff augmentation describe the transformational phase, which builds on an organized program that the company does not have yet.
    d:
      en: |
        This deepens the reliance on third parties and their privileged access, which keeps the Learn theme tactical and weakens security.
references:
  - title: The Google Cloud Adoption Framework
    url: https://services.google.com/fh/files/misc/google_cloud_adoption_framework_whitepaper.pdf
