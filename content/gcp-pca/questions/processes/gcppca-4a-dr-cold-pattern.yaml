id: gcppca-4a-dr-cold-pattern
objective: "4.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An HR company runs an internal reporting application on Compute Engine and Cloud SQL in one region. After a regional outage, the business accepts an RTO of 24 hours and an RPO of 24 hours. Management wants the lowest-cost DR design that meets these objectives, and the whole environment is already defined in Terraform.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Run a scaled-down copy of the application in a second region with a cross-region Cloud SQL replica, and scale it out during a failover.
    - id: b
      text:
        en: |-
          Run the application active-active in two regions behind a global external Application Load Balancer, with a multi-region database.
    - id: c
      text:
        en: |-
          Store daily backups of the VMs and the database in a cross-region backup vault, and recreate the environment in the second region with Terraform when needed.
    - id: d
      text:
        en: |-
          Enable high availability on the Cloud SQL instance and use a regional managed instance group, so that the application survives a zonal failure.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With RTO and RPO of a day, a cold pattern is enough: nothing runs in the DR region until a disaster, daily backups stored in another region give an RPO of up to 24 hours, and Terraform rebuilds the environment there within the RTO. It costs only the backup storage, which makes it cheaper than warm or hot patterns.
  options:
    a:
      en: |-
        A warm standby with a continuous replica meets much tighter objectives than required and costs more than necessary.
    b:
      en: |-
        An active-active design is a hot pattern, the most expensive option, for objectives measured in hours.
    d:
      en: |-
        Zonal high availability does not protect against a regional outage.
references:
  - title: "Disaster recovery planning guide"
    url: https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide
  - title: "Overview of backup vaults"
    url: https://docs.cloud.google.com/backup-disaster-recovery/docs/concepts/backup-vault
