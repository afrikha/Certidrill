id: gcppca-4b-dec-adr-change
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A year ago, a logistics team recorded in an architecture decision record (ADR) its choice of Cloud SQL for PostgreSQL for its tracking service. New analytical query requirements now lead the team to move to AlloyDB for PostgreSQL. Auditors and future team members must be able to understand both decisions.

    How should the team handle the ADR?
body:
  options:
    - id: a
      text: { en: "Delete the old ADR and write a new one for AlloyDB, so that nobody follows an outdated decision." }
    - id: b
      text: { en: "Edit the old ADR so that it names AlloyDB as the decision, without mentioning Cloud SQL, to keep the record short." }
    - id: c
      text: { en: "Leave the old ADR unchanged and announce the AlloyDB decision in the team's chat channel." }
    - id: d
      text: { en: "Record the AlloyDB decision with its new requirements, and keep the previous Cloud SQL decision with the reason for the change." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Google's ADR guidance says that when you adjust a decision, you include the previous decision and why the change was made. Keeping both, with the version history of the repository, lets auditors and newcomers follow how and why the architecture evolved.
  options:
    a:
      en: |
        Deleting the record loses the history of the original decision and its context.
    b:
      en: |
        Overwriting the record without the previous decision hides why the architecture changed.
    c:
      en: |
        The ADR would then document a decision that is no longer true, and the new reasoning would be lost in chat.
references:
  - title: Architecture decision records overview
    url: https://docs.cloud.google.com/architecture/architecture-decision-records
