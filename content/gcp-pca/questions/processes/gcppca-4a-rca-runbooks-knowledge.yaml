id: gcppca-4a-rca-runbooks-knowledge
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An insurance company's on-call engineers spend a long time on recurring incidents, because the fixes found during earlier incidents live in personal notes and chat threads. Incidents are also tracked in three different tools, and nobody knows who owns which task during an incident. The operations director wants to shorten the time to resolve incidents, following the Well-Architected Framework.

    Which two actions should you recommend? Choose two.
body:
  options:
    - id: a
      text:
        en: |-
          Maintain a shared knowledge base of known issues, runbooks, and troubleshooting guides, and update it from the trends found in incident reports.
    - id: b
      text:
        en: |-
          Ask each on-call engineer to keep a personal log of the fixes they apply, so that they can reuse those fixes during their next on-call shift.
    - id: c
      text:
        en: |-
          Track every incident in one central incident management system that assigns tasks and integrates with monitoring and ticketing.
    - id: d
      text:
        en: |-
          Let each team keep its own incident tool, so that engineers always use the tool they know best when they respond to an incident.
    - id: e
      text:
        en: |-
          Escalate every incident directly to the most senior engineer, so that the fix is always found by the most experienced person available.
  choose: 2
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      The Well-Architected Framework recommends a knowledge base of known issues, solutions, and troubleshooting guides, kept accessible and updated from incident trends, so that common problems are resolved faster with fewer escalations. It also recommends one centralized system that tracks the whole incident lifecycle, with task assignment and integrations, which makes ownership and coordination clear.
  options:
    b:
      en: |-
        Personal logs keep the knowledge siloed, which is the current problem.
    d:
      en: |-
        Separate tools per team fragment incident tracking further and blur ownership.
    e:
      en: |-
        Routing everything to one person creates a bottleneck and does not capture the knowledge for others.
references:
  - title: "Manage incidents and problems"
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/manage-incidents-and-problems
