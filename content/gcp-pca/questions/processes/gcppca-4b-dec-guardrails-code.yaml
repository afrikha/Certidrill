id: gcppca-4b-dec-guardrails-code
objective: "4.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    At a pharmaceutical company, every application team must get each Google Cloud design approved by a central architecture board. Approvals now take about three weeks, and some teams have started to work around the board. The CTO wants teams to decide faster while staying within the company's security and network standards.

    Which two actions should you recommend? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Encode the standards as organization policies and reusable infrastructure as code modules, so that compliant choices are the default for every team." }
    - id: b
      text: { en: "Add a second review board for network designs, so that the main board can focus on the other topics." }
    - id: c
      text: { en: "Grant the Admin basic role on their folders to all application teams, so that no decision needs a review." }
    - id: d
      text: { en: "Embed security and network experts in the application teams, so that decisions are made with them during the design work." }
    - id: e
      text: { en: "Require teams to submit their designs by email every Monday, so that the board can review them in one weekly batch." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Google's guidance on cloud teams recommends capturing expertise in code and embedding key stakeholders in the teams, because outside approvals add wait time. Organization policies and shared IaC modules enforce the standards automatically, and embedded experts let teams make sound decisions without waiting for a board.
  options:
    b:
      en: |
        Another approval layer adds wait time instead of removing it.
    c:
      en: |
        Broad Admin access removes the guardrails and breaks least privilege, so the standards are no longer enforced.
    e:
      en: |
        Batching submissions keeps the central approval bottleneck and can make teams wait even longer.
references:
  - title: Designing Cloud Teams
    url: https://services.google.com/fh/files/misc/cloud_center_of_excellence.pdf
