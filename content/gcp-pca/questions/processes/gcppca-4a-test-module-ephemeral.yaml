id: gcppca-4a-test-module-ephemeral
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A platform team publishes Terraform modules that 50 application teams use. A new module version passed terraform validate and a terraform plan in the team's sandbox, but terraform apply then failed in many application projects because of errors returned by Google Cloud APIs. The team wants to catch such failures before each module release, without affecting any development or production environment.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run terraform plan with the new module version against every application project, and release the module only when all 50 plans succeed.
    - id: b
      text:
        en: |-
          Add more linters and static analysis checks to the module repository, and release the module only when every check passes.
    - id: c
      text:
        en: |-
          Ask two application teams to apply each new module version in their development projects first, and wait a week for their feedback.
    - id: d
      text:
        en: |-
          Add integration tests that deploy the module into a fresh, isolated test project for each run, verify the resources, and then destroy them.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Static checks and plans do not call the APIs that create resources, so errors that only appear at apply time are missed. Google's Terraform testing practices recommend module integration tests that deploy the module into a fresh project or folder separate from development and production, verify the resulting resources, and clean up afterward, for example with the blueprint testing framework.
  options:
    a:
      en: |-
        A plan does not create resources, so it cannot reveal errors that the APIs return during apply; running plans against 50 projects also requires broad access.
    b:
      en: |-
        Static analysis checks syntax and structure without deploying anything, which already proved insufficient.
    c:
      en: |-
        This uses real development environments of other teams as test beds and delays every release.
references:
  - title: "Best practices for testing"
    url: https://docs.cloud.google.com/docs/terraform/best-practices/testing
