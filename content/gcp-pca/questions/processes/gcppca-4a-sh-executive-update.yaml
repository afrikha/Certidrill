id: gcppca-4a-sh-executive-update
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You lead a cloud migration program and present its status to a monthly steering committee with the CIO, the CFO, and two business unit heads. Your last update was 40 slides of architecture diagrams and infrastructure metrics, and the executives disengaged before the end. The CIO asks you to make the next update more useful to the committee.

    Which two changes should you make? Choose two.
body:
  options:
    - id: a
      text:
        en: |-
          Report the progress of the program against the business outcomes and KPIs that the committee agreed on at the start.
    - id: b
      text:
        en: |-
          Add more technical detail and appendix slides, so that the executives can find the answer to any question they ask.
    - id: c
      text:
        en: |-
          Replace the meeting with links to the Cloud Monitoring dashboards, so that the executives can check any metric they want.
    - id: d
      text:
        en: |-
          Stop presenting status until the migration is complete, and present the final results to the committee in one session.
    - id: e
      text:
        en: |-
          Highlight the main risks with their mitigations, and state clearly the decisions that you need the committee to make.
  choose: 2
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      Effective stakeholder communication is tailored to the audience. A steering committee needs to know whether the program delivers the business goals it sponsors, which risks need its attention, and which decisions it must make; technical detail belongs in design reviews with the engineering teams. This keeps the leadership mandate that a cloud adoption depends on.
  options:
    b:
      en: |-
        More technical detail makes the update even less relevant to executives who need business outcomes and decisions.
    c:
      en: |-
        Raw infrastructure dashboards do not tell executives whether business goals are met or what decisions are needed.
    d:
      en: |-
        Going silent loses the executives' engagement and removes their chance to resolve risks during the program.
references:
  - title: "Adoption Framework"
    url: https://cloud.google.com/adoption-framework
  - title: "Ensure operational readiness and performance using CloudOps"
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/operational-readiness-and-performance-using-cloudops
