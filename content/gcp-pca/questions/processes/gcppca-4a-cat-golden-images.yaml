id: gcppca-4a-cat-golden-images
objective: "4.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A bank's security team builds a hardened Compute Engine image every month. Application teams must create VMs only from these approved images, and their instance templates must pick up the latest approved image without being edited every month. The bank wants to enforce the restriction across all projects of the organization.

    Which two actions should you take? Choose two.
body:
  options:
    - id: a
      text:
        en: |-
          Publish each hardened image in a central image project as part of an image family, and have the teams reference the image family in their instance templates.
    - id: b
      text:
        en: |-
          Add an approved label to each hardened image, and ask the teams to choose only labeled images when they create VMs or instance templates.
    - id: c
      text:
        en: |-
          Set the compute.trustedImageProjects organization policy constraint to allow only the central image project and the Google projects that are required.
    - id: d
      text:
        en: |-
          Export each hardened image to a Cloud Storage bucket, and let the teams import the image file into their own projects every month.
    - id: e
      text:
        en: |-
          Have the teams reference each image by its exact name in their instance templates, and update the templates when a new image is published.
  choose: 2
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      An image family lets instance templates reference the family instead of a specific image, so new VMs use the latest image of the family and the templates do not change monthly. The trusted image projects constraint, set at the organization, controls which image projects principals can create boot and persistent disks from, so the teams cannot use other public or shared images.
  options:
    b:
      en: |-
        A label is metadata; it does not prevent anyone from creating VMs from other images.
    d:
      en: |-
        Imported copies live in each team's project, and the trusted image policy does not restrict images in a local project or image files in buckets.
    e:
      en: |-
        Exact image names force a monthly template update, which the requirement rules out.
references:
  - title: "Setting up trusted image policies"
    url: https://docs.cloud.google.com/compute/docs/images/restricting-image-access
  - title: "Image families best practices"
    url: https://docs.cloud.google.com/compute/docs/images/image-families-best-practices
