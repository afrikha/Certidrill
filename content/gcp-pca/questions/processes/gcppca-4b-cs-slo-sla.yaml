id: gcppca-4b-cs-slo-sla
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics software vendor's contracts promise customers 99.9% monthly availability for its tracking API, with service credits if the commitment is missed. Last quarter, the vendor paid credits twice and learned about each breach from customer complaints. The vendor wants an early warning that gives engineers time to act before the contractual commitment is missed, without paging them for every short error spike.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Create an SLO of 99.9% availability, identical to the contract, and alert when the monthly compliance drops below it." }
    - id: b
      text: { en: "Create an SLO of 99.95% availability, and alert on the burn rate of its error budget." }
    - id: c
      text: { en: "Create an SLO of 99.5% availability to reduce alert noise, and alert when the compliance drops below it." }
    - id: d
      text: { en: "Create an SLO of 100% availability, and alert on every failed request so that no error goes unnoticed." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Google recommends an SLO that is tighter than the public or contractual commitment, so that missing the SLO is an early warning before the contract is breached. Alerting on how fast the error budget is consumed (burn rate) catches real threats to the budget while ignoring short spikes that do not endanger it.
  options:
    a:
      en: |
        With the SLO equal to the contract, the alert fires only when the commitment is already missed, which gives no early warning.
    c:
      en: |
        A target looser than the contract fires after the customers' commitment has been breached.
    d:
      en: |
        A 100% SLO leaves no error budget and pages for every single failure, which is the noise the vendor wants to avoid.
references:
  - title: Concepts in service monitoring
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/slo-monitoring
