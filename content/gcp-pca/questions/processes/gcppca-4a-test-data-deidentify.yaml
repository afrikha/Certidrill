id: gcppca-4a-test-data-deidentify
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Developers at an insurance company copy production customer tables from BigQuery into their test projects so that integration tests use realistic data. Compliance has ruled that test environments must not contain personal data, which appears both in dedicated columns and inside free-text claim descriptions. The tests need tables with the same structure as production.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Keep copying the tables, and restrict the test datasets with column-level access control so that only senior developers can read the sensitive columns.
    - id: b
      text:
        en: |-
          Create authorized views in production that exclude the personal data columns, and let the tests query the views instead of copied tables.
    - id: c
      text:
        en: |-
          Create the test tables by applying Sensitive Data Protection de-identification to the production data, so that detected personal data is masked or replaced.
    - id: d
      text:
        en: |-
          Generate random values for every column of the test tables, and discard the production data so that no customer information is involved.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Sensitive Data Protection detects personal data by infoType, in structured columns and in free text, and its de-identification transformations mask, replace, or redact the matches while keeping the table structure. The resulting test tables contain no personal data but remain realistic enough for integration tests, which is the test data management practice compliance requires.
  options:
    a:
      en: |-
        The personal data would still be copied into test environments, which compliance forbids.
    b:
      en: |-
        Views that drop columns cannot remove personal data embedded in free-text descriptions, and tests would run against production.
    d:
      en: |-
        Purely random values lose the realistic formats and relationships that the integration tests need.
references:
  - title: "De-identifying sensitive data"
    url: https://docs.cloud.google.com/sensitive-data-protection/docs/deidentify-sensitive-data
