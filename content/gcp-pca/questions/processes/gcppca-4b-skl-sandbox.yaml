id: gcppca-4b-skl-sandbox
objective: "4.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A publishing company's operations engineers are new to Google Cloud. Their manager wants them to practice hands-on with labs and small proofs of concept before the first migration. The practice must not put production workloads at risk, and the manager must know early if practice spending grows beyond the training budget.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Grant the engineers `roles/writer` on the production projects so that they learn on real workloads under supervision." }
    - id: b
      text: { en: "Create sandbox projects for the engineers in a dedicated folder that is separate from the production folders." }
    - id: c
      text: { en: "Create a Cloud Billing budget scoped to the sandbox projects, with alert thresholds that notify the manager." }
    - id: d
      text: { en: "Create one service account key with `roles/admin` that all engineers share for their labs." }
    - id: e
      text: { en: "Grant the engineers `roles/reader` on the production projects and have them learn by observing the existing configuration." }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Google's migration guidance stresses that a free environment for testing and learning is critical to how staff learn; separate sandbox projects in their own folder keep experiments away from production and let you apply looser policies there only. A budget on those projects sends alerts at the thresholds you set, so the manager sees overspending early.
  options:
    a:
      en: |
        Editing production resources while learning puts production workloads at risk.
    d:
      en: |
        A shared, highly privileged service account key is a security risk and removes individual accountability.
    e:
      en: |
        Read-only access to production gives no hands-on practice and does not cover labs or proofs of concept.
references:
  - title: "Migrate to Google Cloud: Assess and discover your workloads"
    url: https://docs.cloud.google.com/architecture/migration-to-gcp-assessing-and-discovering-your-workloads
  - title: Create, edit, or delete budgets and budget alerts
    url: https://docs.cloud.google.com/billing/docs/how-to/budgets
