id: gcppca-4a-test-policy-validation
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial services company deploys its landing zone with Terraform through Cloud Build, following the enterprise foundations blueprint. Organization policy constraints already block external IP addresses on VMs, but engineers discover violations only when terraform apply fails in the pipeline, sometimes after part of the change has been applied. The company wants violations of its security rules reported on the pull request, before any resource is created or changed.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Add more organization policy constraints at the organization node, so that every violation of the security rules is blocked during terraform apply.
    - id: b
      text:
        en: |-
          Validate the Terraform plan against the company's policy constraints in the pipeline's plan step, and fail the build before the apply step runs.
    - id: c
      text:
        en: |-
          Enable Security Command Center, and send the engineers a notification when a misconfiguration finding appears after a deployment.
    - id: d
      text:
        en: |-
          Run terraform validate on each pull request, and configure the pipeline to run terraform apply only when the validation succeeds.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      In the blueprint's pipeline, the plan step runs a Terraform plan and checks it against policy constraints written as code (Open Policy Agent constraints, enforced with the Google Cloud CLI's policy validation). If the plan violates a constraint, the build fails and the apply step deploys nothing, so engineers see the violation on the pull request. Organization policies remain as the runtime guardrail.
  options:
    a:
      en: |-
        Organization policies are evaluated when the API call is made during apply, which is the late feedback the company wants to avoid.
    c:
      en: |-
        Security Command Center reports misconfigurations after the resources exist, not before the change.
    d:
      en: |-
        terraform validate checks syntax and internal consistency; it does not evaluate the company's security rules.
references:
  - title: "Deployment methodology"
    url: https://docs.cloud.google.com/architecture/blueprints/security-foundations/deployment-methodology
  - title: "Implement shift-left security"
    url: https://docs.cloud.google.com/architecture/framework/security/implement-shift-left-security
