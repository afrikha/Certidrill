id: gcppca-cs4c-booking-rca
objective: "4.1.3"
type: single
caseStudy: gcppca-cs4c-saltroute-travel
difficulty: 2
status: draft
stem:
  en: |
    The engineering director asks you to define how teams will troubleshoot booking incidents after the move to Google Cloud. The approach must meet the business requirement about failed and slow bookings and the technical requirement about monitoring.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Raise the log level of the seven booking services to DEBUG during peak periods, and route the logs of every service to one log bucket that all teams can search." } }
    - { id: b, text: { en: "Enable Error Reporting for the seven booking services, and give each team an alerting policy and a dashboard for the errors of its own service." } }
    - { id: c, text: { en: "Create an uptime check on the health endpoint of each booking service, and page the team that owns a service when its check fails." } }
    - { id: d, text: { en: "Instrument the booking services with OpenTelemetry, propagate the trace context on every call, export the spans to Cloud Trace, and write logs that carry the trace ID." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Distributed tracing shows the path of one booking across every service and outgoing call, with the latency and status of each span, so the failing or slow step is visible in one trace. Google recommends OpenTelemetry for instrumentation, and log entries that carry the trace and span IDs are linked to the trace, so engineers move from the slow span to the matching log entries of every service.
  options:
    a:
      en: One bucket gathers the logs, but no identifier links the entries of the same booking across services, which is what made the last incident take four days; DEBUG logging also adds cost.
    b:
      en: Error Reporting groups the exceptions of each service, but it does not show which call in a booking's path failed or was slow, and slow bookings may raise no error at all.
    c:
      en: Uptime checks detect a service that is down, not intermittent failures or slow calls inside a booking that the health endpoint does not exercise.
references:
  - title: Cloud Trace overview
    url: https://docs.cloud.google.com/trace/docs/overview
  - title: Link log entries with traces
    url: https://docs.cloud.google.com/trace/docs/trace-log-integration
