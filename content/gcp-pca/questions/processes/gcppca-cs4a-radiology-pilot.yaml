id: gcppca-cs4a-radiology-pilot
objective: "4.2.1"
type: single
caseStudy: gcppca-cs4a-marrowfield-health
difficulty: 1
status: draft
stem:
  en: |
    The imaging archive is ready for its first hospital. Three radiology department chiefs still oppose the migration because they expect prior studies to open more slowly. You need to obtain the support that the chief medical officer requires, as described in the executive statement.

    What should you do first?
body:
  options:
    - { id: a, text: { en: "Ask the chief medical officer to announce that the archive migration is mandatory for every hospital, and schedule training for radiologists after the first cutover." } }
    - { id: b, text: { en: "Present the Cloud Healthcare API SLA and the reference architecture of the archive to the radiology chiefs, and ask them to approve the migration plan." } }
    - { id: c, text: { en: "Agree with the radiology chiefs on measurable criteria, such as the time to open a prior study, and run a pilot in one hospital that measures them before any archive is decommissioned." } }
    - { id: d, text: { en: "Migrate the archives of the hospitals whose chiefs support the project first, and migrate the three other hospitals at the end, when the storage arrays reach their end of support." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The radiology chiefs' concern is a measurable expectation, so the way to influence them is to make them define the success criteria and to show results on their own workload. Google's migration guidance recommends proofs of concept with a precise scope, expected outputs and measurable impact to validate assumptions; a pilot that measures the time to open prior studies gives the evidence the executive statement asks for before any archive is decommissioned.
  options:
    a:
      en: A mandate ignores the chief medical officer's requirement to obtain the chiefs' support and the request for evidence, and is likely to increase resistance.
    b:
      en: An SLA describes availability, not the speed at which a viewer opens a study; slides are what the executive statement explicitly rejects.
    d:
      en: Postponing the opposing hospitals avoids the discussion instead of answering it, and leaves their migrations at risk of missing the end of support of the storage arrays.
references:
  - title: "Migrate to Google Cloud: Assess and discover your workloads"
    url: https://docs.cloud.google.com/architecture/migration-to-gcp-assessing-and-discovering-your-workloads
