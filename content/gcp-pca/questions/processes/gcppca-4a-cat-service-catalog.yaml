id: gcppca-4a-cat-service-catalog
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company's cloud platform team maintains approved Terraform configurations for a hardened Cloud SQL instance and a standard GKE cluster. It wants developers in two folders to discover these configurations in the Google Cloud console and deploy them into their own projects by choosing a few parameters, while developers in other folders must not see them. The team wants a managed Google Cloud service for this.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Add the configurations as Terraform solutions in Service Catalog, assign them to a catalog, and share the catalog with the two folders.
    - id: b
      text:
        en: |-
          Publish the configurations as public listings in Cloud Marketplace, and ask the developers in the two folders to search for the listings.
    - id: c
      text:
        en: |-
          Store the configurations as Deployment Manager templates in a shared project, and grant the developers of the two folders access to that project.
    - id: d
      text:
        en: |-
          Upload the configurations to a Cloud Storage bucket, and send the developers of the two folders a link to the bucket and the instructions.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Service Catalog lets administrators curate solutions, including Terraform configurations, into catalogs that they share at the organization, folder, or project level. Only users who can see a shared catalog discover its solutions in the console, choose parameters, and deploy them into their projects, with Cloud Build running the Terraform commands.
  options:
    b:
      en: |-
        Cloud Marketplace public listings are for software vendors offering products to all Google Cloud customers, not for internal configurations limited to two folders.
    c:
      en: |-
        Deployment Manager reached end of support in 2026 and is being turned down, and sharing a project offers no curated discovery.
    d:
      en: |-
        A bucket link offers no discovery in the console, no parameters, and no governance of who deploys what.
references:
  - title: "Overview of Service Catalog"
    url: https://docs.cloud.google.com/service-catalog/docs/overview
  - title: "Creating a Terraform configuration"
    url: https://docs.cloud.google.com/service-catalog/docs/terraform-configuration
