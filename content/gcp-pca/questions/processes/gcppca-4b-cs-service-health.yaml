id: gcppca-4b-cs-service-health
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A managed service provider hosts its clients' applications in projects of its Google Cloud organization. Its customer success team wants to warn affected clients quickly when a Google Cloud incident impacts the products and locations that their projects use. The solution must be automated and must not report incidents that do not affect the provider's projects.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Assign an operator to check the public Google Cloud Service Health dashboard every hour and email the clients about any new incident." }
    - id: b
      text: { en: "Create Cloud Monitoring uptime checks on public Google endpoints and notify the clients when a check fails." }
    - id: c
      text: { en: "Configure alerts in Personalized Service Health for incidents that affect the organization's projects, and route the notifications to the customer success team." }
    - id: d
      text: { en: "Enable Security Command Center notifications to Pub/Sub, and forward every new finding to the clients that own the project." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Personalized Service Health shows the Google Cloud incidents that are relevant to your projects, including an organization-wide view. It logs Service Health events in Cloud Logging and lets you set alerts on them, so the team is notified automatically about incidents that affect the products and locations its projects use.
  options:
    a:
      en: |
        Manual checks are not automated, and the public dashboard lists incidents that may not affect the provider's projects.
    b:
      en: |
        Uptime checks on public endpoints say nothing about the specific products and locations that the clients' projects use.
    d:
      en: |
        Security Command Center reports security findings on resources, not Google Cloud service incidents.
references:
  - title: Personalized Service Health overview
    url: https://docs.cloud.google.com/service-health/docs/overview
