id: gcppca-5b-spanner-emulator-gcloud-config
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Developers at an insurance company run the Spanner emulator on their laptops. They want to use gcloud spanner commands to create instances, databases and schemas in the emulator, and then return to their normal production work with one command. Commands meant for the emulator must never reach the production Spanner API by mistake.

    What should each developer configure?
body:
  options:
    - id: a
      text: { en: "In the default configuration, set api_endpoint_overrides/spanner to http://localhost:9020/ while testing, and unset the property when returning to production work." }
    - id: b
      text: { en: "A dedicated configuration whose project property is an ID that does not exist in Google Cloud, so that gcloud sends Spanner commands to the local emulator." }
    - id: c
      text: { en: "A dedicated configuration with auth/disable_credentials set to true, a project, and api_endpoint_overrides/spanner set to http://localhost:9020/, activated only for emulator work." }
    - id: d
      text: { en: "A dedicated configuration with the developer's account and api_endpoint_overrides/spanner set to http://localhost:9010/, activated only for emulator work." }
answer: { optionId: c }
explanation:
  correct:
    en: "Google's procedure creates a separate gcloud configuration for the emulator: credentials disabled (the emulator does not support authentication), a project, and the Spanner endpoint overridden to the emulator's REST port 9020. `gcloud config configurations activate` then switches between the emulator and the default configuration in one command."
  options:
    a: { en: "Changing the default configuration requires several commands each time, and forgetting to unset the property is exactly the kind of mistake the developers want to avoid." }
    b: { en: "The project ID does not change the API endpoint: without an endpoint override, gcloud keeps calling the production Spanner API." }
    d: { en: "Port 9010 is the emulator's gRPC port used by client libraries; gcloud uses the REST port 9020, and keeping credentials enabled is not needed for the emulator." }
references:
  - title: Emulate Spanner locally
    url: https://docs.cloud.google.com/spanner/docs/emulator
