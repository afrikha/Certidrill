id: gcppca-5a-open-in-cloud-shell-tutorial
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A training company runs a workshop on a sample application stored in a public GitHub repository. Attendees click a link in the course page. The link must open Cloud Shell, clone the repository, open the file `main.py` in the Cloud Shell Editor, and start the step-by-step guide stored in `tutorial.md` in the repository.

    Which parameters should the Open in Cloud Shell URL contain?
body:
  options:
  - id: a
    text:
      en: '`cloudshell_git_repo`, `cloudshell_open_in_editor=main.py`, and `cloudshell_tutorial=tutorial.md`'
  - id: b
    text:
      en: '`cloudshell_git_repo`, `cloudshell_working_dir=main.py`, and `cloudshell_print=tutorial.md`'
  - id: c
    text:
      en: '`cloudshell_image`, `cloudshell_open_in_editor=main.py`, and `cloudshell_tutorial=tutorial.md`'
  - id: d
    text:
      en: '`cloudshell_git_repo`, `cloudshell_workspace=main.py`, and `ephemeral=true` for the tutorial'
answer:
  optionId: a
explanation:
  correct:
    en: |
      `cloudshell_git_repo` is the required parameter that names the repository to clone, `cloudshell_open_in_editor` opens files in editor tabs, and `cloudshell_tutorial` launches a tutorial Markdown file from the repository.
  options:
    b:
      en: '`cloudshell_working_dir` is deprecated and sets a directory, not a file to edit, and `cloudshell_print` prints a file in the terminal instead of starting a tutorial.'
    c:
      en: '`cloudshell_image` runs a custom container image; without `cloudshell_git_repo`, the repository is not cloned.'
    d:
      en: '`cloudshell_workspace` sets the working directory, and `ephemeral` only uses a scratch home directory; neither opens the file or the tutorial.'
references:
- title: Open in Cloud Shell
  url: https://docs.cloud.google.com/shell/docs/open-in-cloud-shell
