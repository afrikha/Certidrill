id: gcppca-5b-infra-manager-service-account
objective: "5.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company adopts Infrastructure Manager to deploy a Terraform configuration that creates a VPC network, subnets and Cloud NAT in the project net-prod. Network engineers can already manage Infrastructure Manager deployments in that project. A user-managed service account named infra-deployer was created in net-prod for the deployments.

    You need to set up permissions so that the engineers can create and update the deployment, following the principle of least privilege. What should you do?
body:
  options:
    - id: a
      text: { en: "Grant infra-deployer the Admin basic role on net-prod, and grant the engineers the Service Account User role on infra-deployer." }
    - id: b
      text: { en: "Grant infra-deployer the Infra Manager Agent role only, and rely on the Infrastructure Manager service agent to create the network resources." }
    - id: c
      text: { en: "Grant the engineers the Compute Network Admin role on net-prod, and run the deployment without a service account so that it uses their identity." }
    - id: d
      text: { en: "Grant infra-deployer the Infra Manager Agent role and the Compute Network Admin role on net-prod, and grant the engineers the Service Account User role on infra-deployer." }
answer: { optionId: d }
explanation:
  correct:
    en: Infrastructure Manager runs Terraform with the identity of the deployment's service account, which needs the Infra Manager Agent role (roles/config.agent) plus the permissions for every resource in the configuration, here network resources. Users who create or update deployments need the Service Account User role on that service account.
  options:
    a: { en: "Admin gives far more than the network permissions the configuration needs, which is not least privilege." }
    b: { en: "The service account itself must hold the permissions for the resources in the configuration; the Agent role alone does not let it create networks." }
    c: { en: "Infrastructure Manager executes Terraform as a service account, not as the user who starts the deployment." }
references:
  - title: Configure the service account
    url: https://docs.cloud.google.com/infrastructure-manager/docs/configure-service-account
