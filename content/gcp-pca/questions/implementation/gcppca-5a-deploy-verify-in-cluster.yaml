id: gcppca-5a-deploy-verify-in-cluster
objective: "5.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company promotes releases of a microservices application to a GKE `staging` target with Cloud Deploy. Deployment verification is enabled, and the verify container defined in `skaffold.yaml` runs the integration tests. The tests fail because they call internal services exposed only as ClusterIP Services. The security team does not allow these services to be exposed outside the cluster.

    What should you do?
body:
  options:
  - id: a
    text:
      en: Set `executionMode` to `kubernetesCluster` for the verify container in `skaffold.yaml`.
  - id: b
    text:
      en: Change the internal services to type LoadBalancer so that the verify container can reach them.
  - id: c
    text:
      en: Run the verify job in an execution environment that uses a Cloud Build private pool peered with the VPC.
  - id: d
    text:
      en: Run the integration tests from a Cloud Build trigger that starts when the staging rollout completes.
answer:
  optionId: a
explanation:
  correct:
    en: |
      By default, verification runs in the Cloud Deploy execution environment, outside the cluster. Skaffold's `executionMode.kubernetesCluster` option runs the verify containers on the application cluster itself, where ClusterIP Services are reachable, and a failed test still fails the rollout. This option is available for GKE targets.
  options:
    b:
      en: A LoadBalancer Service exposes the services outside the cluster, which the security team forbids.
    c:
      en: A private pool runs in the VPC network, but ClusterIP addresses are reachable only from inside the cluster.
    d:
      en: A separate trigger runs outside Cloud Deploy, so a test failure would not fail the rollout, and it still runs outside the cluster.
references:
- title: Verify your deployment
  url: https://docs.cloud.google.com/deploy/docs/verify-deployment
