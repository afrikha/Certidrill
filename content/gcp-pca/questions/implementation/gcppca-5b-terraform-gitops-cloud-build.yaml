id: gcppca-5b-terraform-gitops-cloud-build
objective: "5.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's platform team stores its Terraform code for a dev and a prod environment in one GitHub repository. The team's requirements are:

    - Every proposed change shows its Terraform plan to reviewers before it is merged.
    - A change reaches prod only after it was applied and tested in dev.
    - Terraform always runs in the same automated environment, never from workstations.
    - Each environment is changed with the least privilege, without service account keys.

    Which design should you recommend?
body:
  options:
    - id: a
      text: { en: "Reviewers approve pull requests to main; after approval, each engineer runs terraform apply for dev and then prod from a workstation with impersonation of a deployment service account." }
    - id: b
      text: { en: "Cloud Build runs terraform plan for feature branches and pull requests, and plan and apply on pushes to dev and prod branches, using one service account per environment with only the roles it needs." }
    - id: c
      text: { en: "Cloud Build runs terraform apply -auto-approve on every push to any branch for both environments, using one service account with the Writer basic role on both projects." }
    - id: d
      text: { en: "A GitHub Actions workflow runs terraform apply for dev and prod on each merge to main, using a service account key stored as a repository secret." }
answer: { optionId: b }
explanation:
  correct:
    en: In Google's GitOps pattern with Cloud Build, pushes to feature branches only run terraform plan and report it on the pull request, while pushes to the dev and prod branches run plan and apply; prod is updated by merging dev into prod after testing. Running as a dedicated service account per environment with only the needed roles meets least privilege without keys.
  options:
    a: { en: "Running apply from workstations breaks the requirement of one consistent automated environment, and reviewers never see a plan in the pull request." }
    c: { en: "Applying on every push skips review and the dev-before-prod promotion, and Writer on both projects is not least privilege." }
    d: { en: "A key stored as a repository secret violates the no-key requirement, and applying both environments on one merge skips testing in dev first." }
references:
  - title: Managing infrastructure as code with Terraform, Cloud Build, and GitOps
    url: https://docs.cloud.google.com/docs/terraform/resource-management/managing-infrastructure-as-code
  - title: Best practices for Terraform operations
    url: https://docs.cloud.google.com/docs/terraform/best-practices/operations
