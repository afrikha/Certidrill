id: gcppca-5a-gca-residency-cmek
objective: "5.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A European insurer has three projects: `claims-eu`, whose data must stay in the EU under a data residency requirement; `payments`, which must use customer-managed encryption keys (CMEK) for all stored data; and `dev-sandbox`, which has neither requirement. The insurer wants to enable Gemini Cloud Assist and follow Google's guidance.

    Which projects should you enable Gemini Cloud Assist for?
body:
  options:
  - id: a
    text:
      en: '`claims-eu`, `payments`, and `dev-sandbox`'
  - id: b
    text:
      en: '`claims-eu` and `dev-sandbox`'
  - id: c
    text:
      en: '`payments` and `dev-sandbox`'
  - id: d
    text:
      en: '`dev-sandbox` only'
answer:
  optionId: d
explanation:
  correct:
    en: |
      Google warns that Gemini Cloud Assist can store data in any Google Cloud data center worldwide, and recommends not enabling its API for projects with data residency or CMEK requirements. Only `dev-sandbox` has neither requirement. Gemini Cloud Assist is a Preview offering.
  options:
    a:
      en: Both `claims-eu` and `payments` have requirements that Google's guidance says rule out enabling the API.
    b:
      en: '`claims-eu` has a data residency requirement, and Gemini Cloud Assist can store data outside the EU.'
    c:
      en: '`payments` has a CMEK requirement, and Google''s guidance says not to enable the API for such projects.'
references:
- title: Set up Gemini Cloud Assist
  url: https://docs.cloud.google.com/cloud-assist/set-up-gemini
