id: gcppca-5a-gca-investigation-logs
objective: "5.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company has a Premium Support contract and has set up Gemini Cloud Assist for its production project. An on-call engineer sees a burst of error log entries from a GKE workload in Logs Explorer. The engineer wants an AI-assisted root-cause analysis that reviews the related logs, configurations, and metrics and returns probable causes with recommended next steps.

    What should the engineer do?
body:
  options:
  - id: a
    text:
      en: Open the Gemini Code Assist chat in the IDE, and paste the error messages into the prompt.
  - id: b
    text:
      en: Click Investigate on one of the error log entries to start a Gemini Cloud Assist investigation.
  - id: c
    text:
      en: Create a log-based metric for the errors, and add an alerting policy that notifies the on-call engineer.
  - id: d
    text:
      en: Route the logs to a log bucket upgraded to Observability Analytics, and write SQL queries that group the errors by resource.
answer:
  optionId: b
explanation:
  correct:
    en: |
      Gemini Cloud Assist investigations perform root-cause analysis across infrastructure and applications. Starting one from a Warning-or-higher log entry in Logs Explorer produces observations based on logs, configurations, and metrics, hypotheses about the probable cause, and recommended steps. Since April 2026, creating investigations requires a Premium Support contract or access requested through the account team. Gemini Cloud Assist is a Preview offering.
  options:
    a:
      en: Gemini Code Assist helps write and explain code in the IDE; it does not analyze the project's logs, configurations, and metrics.
    c:
      en: An alert tells the team that errors occur; it does not analyze their cause.
    d:
      en: Observability Analytics lets the engineer query logs manually, without the cross-signal analysis and hypotheses that were asked for.
references:
- title: Troubleshoot issues with Gemini Cloud Assist investigations
  url: https://docs.cloud.google.com/cloud-assist/investigations
