id: gcppca-5b-adc-quota-project
objective: "5.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Data scientists at an energy company run Python notebooks on their workstations. The notebooks use Cloud Client Libraries with Application Default Credentials set up with `gcloud auth application-default login`. Calls to one API fail because a quota project cannot be identified for the requests. The company wants quota and billing for these calls to be attributed to the project ds-tools, and the data scientists currently have only data access roles in it.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Have each data scientist run gcloud auth application-default set-quota-project ds-tools on the workstation." }
    - id: b
      text: { en: "Have each data scientist set the billing/quota_project property of the gcloud CLI to ds-tools." }
    - id: c
      text: { en: "Grant the data scientists the Billing Account User role on the billing account linked to ds-tools." }
    - id: d
      text: { en: "Grant the data scientists the Service Usage Consumer role on the ds-tools project." }
    - id: e
      text: { en: "Create an API key in ds-tools and pass it to the client libraries in place of the user credentials." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: The quota project for user credentials used by ADC is stored in the local ADC file and set with `gcloud auth application-default set-quota-project`. To use a project as the quota project, the principal needs the serviceusage.services.use permission, which is in the Service Usage Consumer role.
  options:
    b: { en: "The billing/quota_project property applies to gcloud CLI commands; the client libraries in the notebooks read the ADC file instead." }
    c: { en: "Billing Account User lets a principal link projects to a billing account; it does not grant serviceusage.services.use on the project." }
    e: { en: "An API key does not identify the data scientist as a principal, so the data access granted through IAM would no longer apply." }
references:
  - title: Set the quota project
    url: https://docs.cloud.google.com/docs/quotas/set-quota-project
