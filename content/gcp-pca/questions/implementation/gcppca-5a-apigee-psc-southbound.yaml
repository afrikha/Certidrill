id: gcppca-5a-apigee-psc-southbound
objective: "5.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A retailer provisioned its Apigee organization without VPC peering. A new inventory API proxy must call a backend that runs behind a regional internal Application Load Balancer in the VPC network of another project. The backend must not be reachable from the internet.

    What should you do? Choose two.
body:
  choose: 2
  options:
  - id: a
    text:
      en: Create a VPC Network Peering connection between the Apigee network and the backend's VPC network.
  - id: b
    text:
      en: Publish the internal load balancer with a Private Service Connect service attachment that accepts the Apigee project.
  - id: c
    text:
      en: Put the backend behind an external passthrough Network Load Balancer that allows only Apigee's egress addresses.
  - id: d
    text:
      en: Create an Apigee endpoint attachment that references the service attachment, and use its host as the proxy's target.
  - id: e
    text:
      en: Configure a Cloud NAT gateway in the backend's VPC network so that Apigee can reach the load balancer.
answer:
  optionIds:
  - b
  - d
explanation:
  correct:
    en: |
      Southbound Private Service Connect uses two pieces: a service attachment on the load balancer in the target's VPC network, set to accept connections from the Apigee project, and an endpoint attachment in Apigee that points to it. The proxy's target URL then uses the endpoint attachment's host IP or a DNS name, and this works for instances provisioned with or without VPC peering.
  options:
    a:
      en: The organization was provisioned without VPC peering, so peering is not available; Private Service Connect is the private path.
    c:
      en: An external load balancer exposes the backend to the internet, which the requirement forbids.
    e:
      en: Cloud NAT gives outbound internet access to resources in a VPC network; it does not create a private path from Apigee to the backend.
references:
- title: Southbound networking patterns
  url: https://docs.cloud.google.com/apigee/docs/api-platform/architecture/southbound-networking-patterns-endpoints
