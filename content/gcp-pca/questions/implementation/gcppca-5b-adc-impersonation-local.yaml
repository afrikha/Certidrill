id: gcppca-5b-adc-impersonation-local
objective: "5.2.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Developers at a telecom company write Python code with Cloud Client Libraries on their laptops. In production, the code runs on Cloud Run as the service account billing-app. Before each release, developers must run the code locally with exactly the permissions of billing-app, to catch missing IAM roles early. Service account keys are forbidden by an organization policy.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Have developers run gcloud auth application-default login --impersonate-service-account with the email of billing-app." }
    - id: b
      text: { en: "Have developers run gcloud auth login so that the client libraries use the account they signed in to the gcloud CLI with." }
    - id: c
      text: { en: "Grant the developers the Service Account User role on billing-app so that their code can act as the service account." }
    - id: d
      text: { en: "Grant the developers the Service Account Token Creator role on billing-app." }
    - id: e
      text: { en: "Grant the developers the same IAM roles as billing-app and have them use their own user credentials with ADC." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "`gcloud auth application-default login --impersonate-service-account` creates a local ADC file that the client libraries use to obtain short-lived tokens for billing-app, so the code runs with that account's permissions and no key. Impersonation requires the Service Account Token Creator role, which contains iam.serviceAccounts.getAccessToken, on the service account."
  options:
    b: { en: "gcloud auth login sets the credentials of the gcloud CLI; client libraries read Application Default Credentials, which this command does not create." }
    c: { en: "Service Account User lets a principal attach the service account to resources; it does not contain the permission to generate access tokens for impersonation." }
    e: { en: "User credentials carry the developers' own permissions, which can differ from billing-app's, so missing roles of the service account would not be detected." }
references:
  - title: Use service account impersonation
    url: https://docs.cloud.google.com/docs/authentication/use-service-account-impersonation
  - title: Authenticate with client libraries
    url: https://docs.cloud.google.com/docs/authentication/client-libraries
