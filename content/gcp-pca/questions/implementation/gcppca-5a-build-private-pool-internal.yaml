id: gcppca-5a-build-private-pool-internal
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company builds its applications with Cloud Build. Each build downloads dependencies from an internal package repository that runs on a Compute Engine VM in the VPC network `build-net`. The VM has only an internal IP address, and the security team forbids giving it an external IP address. Builds that run in the default pool cannot reach the repository.

    What should you do?
body:
  options:
  - id: a
    text:
      en: Enable Private Google Access on the subnet of `build-net` that hosts the package repository VM.
  - id: b
    text:
      en: Create a Cloud Build private pool peered with `build-net`, and run the builds in that pool.
  - id: c
    text:
      en: Create a Cloud NAT gateway for `build-net` so that the default pool can reach the VM.
  - id: d
    text:
      en: Add a firewall rule in `build-net` that allows ingress to the VM from all source ranges.
answer:
  optionId: b
explanation:
  correct:
    en: |
      Private pools are dedicated, Google-managed worker pools that can be connected to your VPC network through a private VPC peering connection with the service producer network. Builds that run in the pool then reach internal IP addresses in `build-net`, and the repository VM keeps having no external IP address.
  options:
    a:
      en: Private Google Access lets VMs without external IP addresses reach Google APIs; it does not let Cloud Build workers reach the VM.
    c:
      en: Cloud NAT provides outbound internet access for VMs; it does not create an inbound path from the default pool to an internal address.
    d:
      en: The default pool has no network path to internal addresses in `build-net`, so a firewall rule cannot help, and allowing all sources weakens security.
references:
- title: Private pools overview
  url: https://docs.cloud.google.com/build/docs/private-pools/private-pools-overview
