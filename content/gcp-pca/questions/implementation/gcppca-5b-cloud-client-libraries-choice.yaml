id: gcppca-5b-cloud-client-libraries-choice
objective: "5.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A news company is starting a new Go service on Cloud Run that reads objects from Cloud Storage and publishes messages to Pub/Sub. The developers want idiomatic code, installation through the language's package manager, and the access method that Google recommends for calling Cloud APIs programmatically.

    Which approach should they use?
body:
  options:
    - id: a
      text: { en: "The Google API Client Libraries generated from the APIs' discovery documents." }
    - id: b
      text: { en: "Hand-written HTTPS calls to the REST endpoints with tokens fetched by the service." }
    - id: c
      text: { en: "The Cloud Client Libraries for Go for Cloud Storage and for Pub/Sub." }
    - id: d
      text: { en: "gRPC stubs that the team generates itself from the APIs' protocol buffer files." }
answer: { optionId: c }
explanation:
  correct:
    en: Google presents the Cloud Client Libraries as the recommended way to access Cloud APIs programmatically. They provide idiomatic code for each language, a consistent style across services, installation through package managers, and they handle low-level details such as authentication, using gRPC under the hood for some APIs.
  options:
    a: { en: "The Google API Client Libraries are the earlier model, meant for languages or APIs without a Cloud Client Library; they only reach the REST interface." }
    b: { en: "Hand-written REST calls are possible for experienced developers but leave authentication, retries and serialization to the team, and are not the recommended option." }
    d: { en: "Generating your own gRPC clients is an advanced option that is less idiomatic and more work than the published Cloud Client Libraries." }
references:
  - title: Client libraries and Cloud APIs explained
    url: https://docs.cloud.google.com/apis/docs/client-libraries-explained
