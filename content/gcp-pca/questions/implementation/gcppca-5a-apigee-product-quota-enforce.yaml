id: gcppca-5a-apigee-product-quota-enforce
objective: "5.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A payments company exposes one API proxy through two Apigee API products: `gold` allows 10,000 calls per day and `silver` allows 1,000 calls per day, as set in each product's quota settings. Partner apps authenticate with API keys. Monitoring shows that `silver` apps regularly make more than 1,000 calls per day. The product team wants to keep changing the limits in the API products without editing the proxy.

    What should you do? Choose two.
body:
  choose: 2
  options:
  - id: a
    text:
      en: Add a VerifyAPIKey policy to the request flow so that Apigee identifies the app and the API product of each call.
  - id: b
    text:
      en: Add a SpikeArrest policy with a rate of 1,000 calls per day to the proxy's request PreFlow.
  - id: c
    text:
      en: Add a Quota policy that uses the API product's quota configuration and references the VerifyAPIKey step.
  - id: d
    text:
      en: Create a second API proxy for `silver` apps, with a Quota policy whose allowed count is set to 1,000.
  - id: e
    text:
      en: Change the access setting of the `silver` API product to Private so that its quota is enforced.
answer:
  optionIds:
  - a
  - c
explanation:
  correct:
    en: |
      Quota settings on an API product are not enforced by themselves: a Quota policy in the proxy must apply them. VerifyAPIKey identifies the app and its API product, and a Quota policy with `UseQuotaConfigInAPIProduct` that references that step takes its limits from the product, which take precedence over the policy's own values.
  options:
    b:
      en: SpikeArrest smooths short bursts across all consumers and keeps no accurate count, so it cannot enforce a daily limit per app.
    d:
      en: A separate proxy with a hard-coded count duplicates the API and forces proxy edits whenever the product team changes a limit.
    e:
      en: The access setting controls which developers can see the product; it has no effect on quota enforcement.
references:
- title: Introduction to API products
  url: https://docs.cloud.google.com/apigee/docs/api-platform/publish/what-api-product
- title: Quota policy
  url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/quota-policy
