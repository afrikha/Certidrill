id: gcppca-5a-run-rollback-revision
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company deploys its checkout API with `gcloud run deploy` to a Cloud Run service named `checkout`. The latest release created revision `checkout-00042`, which now receives 100% of the traffic. Ten minutes later, the error rate rises sharply. The previous revision, `checkout-00041`, is still available. You must restore the previous behavior as fast as possible without building or deploying a new revision.

    What should you do?
body:
  options:
  - id: a
    text:
      en: Run `gcloud run services update-traffic checkout --to-revisions=checkout-00041=100`.
  - id: b
    text:
      en: Run `gcloud run deploy checkout` with the container image of revision `checkout-00041`.
  - id: c
    text:
      en: Run `gcloud run services update-traffic checkout --to-latest` to reset the traffic routing.
  - id: d
    text:
      en: Delete revision `checkout-00042` so that Cloud Run sends the traffic to the previous revision.
answer:
  optionId: a
explanation:
  correct:
    en: |
      In Cloud Run, a rollback is a traffic change: `update-traffic --to-revisions=checkout-00041=100` routes all requests to the earlier revision without any new deployment. The documentation notes that this change does not re-run deployment health checks, which makes it the fastest way back to a known-good revision.
  options:
    b:
      en: Deploying the old image creates a new revision, which is the deployment the requirement rules out, and it is slower than a traffic change.
    c:
      en: '`--to-latest` sends all traffic to the newest revision, which is the failing `checkout-00042`.'
    d:
      en: Cloud Run lets you delete a revision only when it has a 0% traffic allocation, so the serving revision cannot be deleted.
references:
- title: Rollbacks, gradual rollouts, and traffic migration
  url: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
