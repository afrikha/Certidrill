id: gcppca-5a-gca-role-picker
objective: "5.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A security administrator at a logistics company uses the Help me choose roles option on the IAM page of the Google Cloud console to get role suggestions from Gemini for a new data engineer. The administrator must apply the principle of least privilege.

    Which two statements about this role picker are true? Choose two.
body:
  choose: 2
  options:
  - id: a
    text:
      en: It suggests predefined roles; custom role suggestions require the Policy Assist API or the Gemini Cloud Assist chat panel.
  - id: b
    text:
      en: It always returns the least-privileged predefined roles, so its suggestions can be granted without review.
  - id: c
    text:
      en: It often suggests a service's Admin, Editor, or Viewer roles unless the prompt asks for the narrowest access.
  - id: d
    text:
      en: It can suggest roles for several principals at once when they are listed in the same prompt.
  - id: e
    text:
      en: It requires the administrator to enable the Policy Assist API in the project before it can be used.
answer:
  optionIds:
  - a
  - c
explanation:
  correct:
    en: |
      The console role picker suggests predefined roles for one principal from a description of the actions needed. By default, Gemini often suggests a service's Admin, Editor, or Viewer roles; prompts that ask for the least-privileged or narrowest access give more granular roles, which should still be checked against the roles reference.
  options:
    b:
      en: Suggestions are not least privilege by default, and Google recommends validating them before granting.
    d:
      en: The role picker works for individual principals only and does not handle several principals in one prompt.
    e:
      en: The console role picker needs no API enablement; the Policy Assist API is only for the REST method, which is in Preview.
references:
- title: Get predefined role suggestions with Gemini assistance
  url: https://docs.cloud.google.com/iam/docs/role-picker-gemini
