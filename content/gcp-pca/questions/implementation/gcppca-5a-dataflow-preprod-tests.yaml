id: gcppca-5a-dataflow-preprod-tests
objective: "5.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A healthcare analytics company runs a batch Dataflow pipeline that processes patient records. Before each major release, the team wants an end-to-end test that shows how the pipeline behaves under production-like conditions. Patient data must not be exposed in non-production projects.

    What should you do? Choose two.
body:
  choose: 2
  options:
  - id: a
    text:
      en: Run the test on the Dataflow Runner in a preproduction project whose configuration, including quotas, matches production.
  - id: b
    text:
      en: Run the test on the Direct Runner on a developer workstation with the full volume of production records.
  - id: c
    text:
      en: Copy the raw production records to the preproduction project so that the test data is fully realistic.
  - id: d
    text:
      en: Use an extract of production data that was de-identified with Sensitive Data Protection as the test input.
  - id: e
    text:
      en: Skip small-scale runs, and start with a full-volume run so that the test reproduces production load at once.
answer:
  optionIds:
  - a
  - d
explanation:
  correct:
    en: |
      Google recommends end-to-end tests on the Dataflow Runner in a preproduction environment kept as close to production as possible, including quotas. When the data is sensitive, the test input should be a de-identified production extract, for example one produced with Sensitive Data Protection.
  options:
    b:
      en: The Direct Runner runs locally and is meant for small test data; it does not reproduce production conditions on Dataflow.
    c:
      en: Raw patient records in a non-production project break the requirement that patient data not be exposed there.
    e:
      en: Google recommends starting with small-scale runs on a small share of the dataset, such as one percent, before a full-volume test.
references:
- title: Develop and test Dataflow pipelines
  url: https://docs.cloud.google.com/dataflow/docs/guides/develop-and-test-pipelines
