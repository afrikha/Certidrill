id: gcppca-5a-cloud-code-k8s-watch
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer builds a containerized Node.js application for GKE and tests it on a local minikube cluster. The developer wants every saved code change to be rebuilt and redeployed to the cluster automatically, with the pod logs streamed in the IDE, using VS Code.

    What should you recommend?
body:
  options:
  - id: a
    text:
      en: Create a Cloud Build trigger that builds the image and deploys it to minikube on each commit.
  - id: b
    text:
      en: Create a Cloud Deploy delivery pipeline with the minikube cluster as its first target.
  - id: c
    text:
      en: Run `kubectl apply -f` from the VS Code terminal after each change to redeploy the manifests.
  - id: d
    text:
      en: 'Install Cloud Code for VS Code, and run the Cloud Code: Run on Kubernetes command in watch mode.'
answer:
  optionId: d
explanation:
  correct:
    en: |
      Cloud Code for VS Code runs Kubernetes applications with `skaffold dev`: it builds the images, applies the manifests to the chosen context, such as minikube, and waits for the rollout. In watch mode, it rebuilds and redeploys after each change, and pod logs stream in the output.
  options:
    a:
      en: A build trigger reacts to commits in a repository, not to saved files, and Cloud Build cannot reach a cluster on the laptop.
    b:
      en: Cloud Deploy promotes releases through registered targets; it is not an inner-loop tool for a local cluster.
    c:
      en: Running `kubectl apply` by hand does not rebuild the image, and it is the manual step the developer wants to remove.
references:
- title: Get started with Cloud Code for VS Code for Kubernetes
  url: https://docs.cloud.google.com/code/docs/vscode/running-an-application
