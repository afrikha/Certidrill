id: gcppca-5a-mig-recreate-keep-names
objective: "5.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An engineering firm runs a licensed simulation tool on a zonal managed instance group (MIG) of 12 VMs. The license server identifies each VM by its instance name, so names must not change. You must roll out a new instance template, `sim-v5`, to all VMs automatically, replacing at most two VMs at a time.

    Which command should you run?
body:
  options:
  - id: a
    text:
      en: '`rolling-action start-update` with `--version=template=sim-v5`, `--replacement-method=substitute`, `--max-surge=2`, and `--max-unavailable=0`.'
  - id: b
    text:
      en: '`rolling-action start-update` with `--version=template=sim-v5`, `--replacement-method=recreate`, `--max-surge=2`, and `--max-unavailable=2`.'
  - id: c
    text:
      en: '`rolling-action start-update` with `--version=template=sim-v5`, `--replacement-method=recreate`, `--max-surge=0`, and `--max-unavailable=2`.'
  - id: d
    text:
      en: '`set-instance-template` with `--template=sim-v5`, followed by an opportunistic update of the MIG''s update policy.'
answer:
  optionId: c
explanation:
  correct:
    en: |
      With the RECREATE replacement method, the MIG deletes each VM and recreates it with the same name from the new template, which is what the license server needs. RECREATE requires `maxSurge` set to 0, because no extra VM can exist with the same name, so `maxUnavailable=2` sets the pace of two VMs at a time.
  options:
    a:
      en: SUBSTITUTE, the default method, creates new VMs before deleting the old ones, so the instance names change.
    b:
      en: 'RECREATE cannot be combined with a surge: it requires `maxSurge` set to 0.'
    d:
      en: An opportunistic update does not replace existing VMs; the template is applied only when VMs are recreated or added, so the rollout is not automatic.
references:
- title: Automatically apply VM configuration updates in a MIG
  url: https://docs.cloud.google.com/compute/docs/instance-groups/rolling-out-updates-to-managed-instance-groups
