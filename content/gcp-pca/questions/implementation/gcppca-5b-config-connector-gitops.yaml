id: gcppca-5b-config-connector-gitops
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company runs all its services on GKE. Application teams deploy with kubectl and a GitOps tool that applies Kubernetes manifests from Git. The teams now want to declare the Pub/Sub topics, Cloud Storage buckets and Cloud SQL instances their services need in the same manifests, use Kubernetes RBAC to control who can change them, and have the platform continuously reconcile those resources to the declared state.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Install Config Connector and describe the Google Cloud resources as Kubernetes custom resources in the application manifests." }
    - id: b
      text: { en: "Store Terraform configurations next to the manifests and run them with Infrastructure Manager when the manifests change." }
    - id: c
      text: { en: "Package the Google Cloud resources in a Helm chart and install the chart with the GitOps tool in each namespace." }
    - id: d
      text: { en: "Add a Cloud Build trigger on the repository that runs gcloud commands to create the resources described in a YAML file." }
answer: { optionId: a }
explanation:
  correct:
    en: Config Connector is a Kubernetes add-on whose custom resource definitions and controllers let a cluster create and manage Google Cloud resources. The resources live in the same manifests, benefit from Kubernetes RBAC, and are reconciled asynchronously toward the declared state.
  options:
    b: { en: "Infrastructure Manager runs Terraform, not Kubernetes manifests: teams would maintain a second language and Kubernetes RBAC would not govern the resources." }
    c: { en: "Helm installs Kubernetes objects only; without Config Connector's resource definitions it cannot create Pub/Sub topics, buckets or Cloud SQL instances." }
    d: { en: "A trigger that runs gcloud commands is imperative scripting: it gives no continuous reconciliation and no Kubernetes RBAC on the resources." }
references:
  - title: Config Connector overview
    url: https://docs.cloud.google.com/config-connector/docs/overview
