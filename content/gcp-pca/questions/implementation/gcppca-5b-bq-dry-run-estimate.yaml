id: gcppca-5b-bq-dry-run-estimate
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company uses BigQuery with on-demand pricing. An analyst wrote a new GoogleSQL query in a shell script that calls the bq command-line tool. Before the query is scheduled, the finance team wants to know how many bytes it will process.

    The check must not run the query and must not incur any query charge. What should the analyst do?
body:
  options:
    - id: a
      text: { en: "Run the query once with a LIMIT 10 clause and read the bytes billed shown in the job details." }
    - id: b
      text: { en: "Run bq show on each table that the query reads and add up the numBytes values of the tables." }
    - id: c
      text: { en: "Run the query with the --maximum_bytes_billed flag set to a low value and read the error message." }
    - id: d
      text: { en: "Run the query with the --dry_run flag of bq query and read the number of bytes that it reports." }
answer: { optionId: d }
explanation:
  correct:
    en: A dry run validates the query and returns an estimate of the bytes it would process, without running it. Dry runs use no query slots and are not charged, which meets both constraints.
  options:
    a: { en: "On a table that is not clustered, LIMIT does not reduce the data read, and the query actually runs and is billed." }
    b: { en: "Table sizes ignore column pruning and partition filters, so they do not give the bytes that this query processes." }
    c: { en: "This setting makes a query fail when its estimate is over the limit, but if the estimate is under the limit the query runs and is billed, so it is not a safe way to measure." }
references:
  - title: Run a query
    url: https://docs.cloud.google.com/bigquery/docs/running-queries
