id: gcppca-5b-gcloud-named-configurations
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A consultant at an IT services company works on Google Cloud for three clients. Each client gave her a different Google account, and each client has its own default project and default Compute Engine region. She uses the gcloud CLI on one laptop and often moves between clients during the day.

    She wants to switch the account, project and region used by gcloud with a single command, without retyping settings each time.

    What should she do?
body:
  options:
    - id: a
      text: { en: "Keep the default configuration and run gcloud config set for the account, project and compute/region properties each time she changes client." }
    - id: b
      text: { en: "Download a service account key for each client and point the GOOGLE_APPLICATION_CREDENTIALS environment variable at the key of the current client." }
    - id: c
      text: { en: "Create one named configuration per client with gcloud config configurations create, set its properties once, and switch with gcloud config configurations activate." }
    - id: d
      text: { en: "Install a separate copy of the gcloud CLI per client in different directories and change the PATH variable when she changes client." }
answer: { optionId: c }
explanation:
  correct:
    en: A gcloud configuration is a named set of properties (account, project, region, zone…). After creating one configuration per client and setting its properties once, `gcloud config configurations activate NAME` switches all of them in one command; the `--configuration` flag or the CLOUDSDK_ACTIVE_CONFIG_NAME variable can also select one for a single command or terminal.
  options:
    a: { en: "Setting each property again on the default configuration works but takes several commands every time, which is what the consultant wants to avoid." }
    b: { en: "GOOGLE_APPLICATION_CREDENTIALS is read by Application Default Credentials (client libraries), not used to select the gcloud account, and it adds service account keys that Google recommends avoiding." }
    d: { en: "Several installations are unnecessary: one gcloud CLI supports several named configurations, and changing PATH is more work than one activate command." }
references:
  - title: Managing gcloud CLI configurations
    url: https://docs.cloud.google.com/sdk/docs/configurations
