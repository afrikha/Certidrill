id: gcppca-5a-gcloud-storage-small-copy
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An analyst at a market research company needs to copy 40 survey export files, about 15 GB in total, from a workstation in the office to a Cloud Storage bucket once, today. The office has a 1 Gbps internet connection. The analyst wants the simplest tool for this one-time copy.

    What should you recommend?
body:
  options:
  - id: a
    text:
      en: Order a Transfer Appliance, copy the files to it, and ship it back to Google.
  - id: b
    text:
      en: Install Storage Transfer Service agents on the workstation, and create an agent-based transfer job.
  - id: c
    text:
      en: Copy the files with the `gcloud storage cp` command from the workstation.
  - id: d
    text:
      en: Create a BigQuery Data Transfer Service transfer that loads the files into a dataset.
answer:
  optionId: c
explanation:
  correct:
    en: |
      `gcloud storage` is the standard tool for small to medium online transfers over a typical enterprise network, and it suits one-time, on-demand copies of a few files. 15 GB over a 1 Gbps link takes minutes, with nothing to install or configure beyond the Google Cloud CLI.
  options:
    a:
      en: Transfer Appliance is for large datasets when bandwidth is too limited; shipping hardware for 15 GB makes no sense.
    b:
      en: Storage Transfer Service is optimized for transfers of more than 1 TiB, and agents add setup that a one-time 15 GB copy does not need.
    d:
      en: BigQuery Data Transfer Service loads data into BigQuery tables; the requirement is to copy files to a bucket.
references:
- title: 'Migrate to Google Cloud: Transfer your large datasets'
  url: https://docs.cloud.google.com/architecture/migration-to-google-cloud-transferring-your-large-datasets
- title: Storage Transfer Service
  url: https://docs.cloud.google.com/storage-transfer/docs/overview
