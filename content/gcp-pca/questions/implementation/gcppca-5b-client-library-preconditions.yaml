id: gcppca-5b-client-library-preconditions
objective: "5.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A ride-hailing company runs several Java workers that use the Cloud Storage Cloud Client Library with its default retry settings. Each worker reads the object pricing/zones.json, changes it, and writes it back. When a write fails with a transient 503 error, the library does not retry it. The team also found that, during peaks, one worker sometimes overwrites another worker's update.

    You need writes to be retried automatically and to never overwrite a newer version of the object. What should you do?
body:
  options:
    - id: a
      text: { en: "Write a custom retry loop with exponential backoff around each write, and keep the default retry settings of the library for reads." }
    - id: b
      text: { en: "Change the retry settings of the library so that it retries all operations on 503 errors, whether they are idempotent or not." }
    - id: c
      text: { en: "Add an ifGenerationMatch precondition with the generation that the worker read, so that the library retries the write safely." }
    - id: d
      text: { en: "Enable Object Versioning on the bucket so that an overwritten version of the object can be restored after a conflicting write." }
answer: { optionId: c }
explanation:
  correct:
    en: In the Java library, uploads are conditionally idempotent and are retried by default only when they carry a precondition. An ifGenerationMatch with the generation the worker read makes the write fail if another worker updated the object first, and makes automatic retries safe.
  options:
    a: { en: "A custom loop adds code and still lets one worker overwrite another's update, because nothing checks the object's generation." }
    b: { en: "Retrying non-idempotent operations can cause race conditions, and it does not prevent overwriting a newer version." }
    d: { en: "Object Versioning keeps old versions for recovery but does not prevent the overwrite and does not change the retry behavior." }
references:
  - title: Retry strategy
    url: https://docs.cloud.google.com/storage/docs/retry-strategy
