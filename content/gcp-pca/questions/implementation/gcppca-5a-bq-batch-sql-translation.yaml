id: gcppca-5a-bq-batch-sql-translation
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A telecom company is migrating its Teradata data warehouse to BigQuery. It has about 4,000 SQL scripts and stored queries written in Teradata SQL. The team wants to convert them to GoogleSQL in bulk, get a report of the issues that need manual work, and improve the accuracy of the conversion by using the warehouse's schema information.

    What should you do?
body:
  options:
  - id: a
    text:
      en: Paste each script into the interactive SQL translator in the BigQuery console, and save each converted query.
  - id: b
    text:
      en: Load the Teradata tables with BigQuery Data Transfer Service, and run the existing scripts against BigQuery unchanged.
  - id: c
    text:
      en: Upload the scripts to Cloud Storage with metadata from `dwh-migration-dumper`, and run a batch SQL translation job.
  - id: d
    text:
      en: Use Database Migration Service with a conversion workspace to convert the Teradata scripts to GoogleSQL.
answer:
  optionId: c
explanation:
  correct:
    en: |
      The batch SQL translator of the BigQuery Migration Service converts scripts from other SQL dialects into GoogleSQL in bulk. Input files are uploaded to Cloud Storage, metadata extracted with `dwh-migration-dumper` improves accuracy, and the output folder contains the translated SQL and a `translation_report.csv` summary of the issues.
  options:
    a:
      en: The interactive translator converts one query at a time; 4,000 scripts call for the batch translator and its summary report.
    b:
      en: Teradata SQL is not GoogleSQL, so moving the data does not make the scripts run unchanged.
    d:
      en: Database Migration Service migrates operational databases such as Oracle to PostgreSQL targets; it does not translate data warehouse SQL to BigQuery.
references:
- title: Migrate code with the batch SQL translator
  url: https://docs.cloud.google.com/bigquery/docs/batch-sql-translator
- title: Introduction to BigQuery migration
  url: https://docs.cloud.google.com/bigquery/docs/migration-intro
