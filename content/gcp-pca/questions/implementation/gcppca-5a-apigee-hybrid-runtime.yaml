id: gcppca-5a-apigee-hybrid-runtime
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank wants a single API management platform for the APIs of its two data centers. A regulator requires that API traffic and runtime data, such as API keys and key value maps, be processed and stored only in the bank's data centers, where it already runs Kubernetes clusters. The bank prefers Google to operate the management UI, management APIs, and analytics.

    What should you recommend?
body:
  options:
  - id: a
    text:
      en: Apigee in a Google Cloud region near the data centers, connected to the backends through Cloud Interconnect.
  - id: b
    text:
      en: API Gateway in a Google Cloud region, with an API config that routes calls to the backends in the data centers.
  - id: c
    text:
      en: Apigee with Private Service Connect endpoint attachments that point to load balancers in front of the backends.
  - id: d
    text:
      en: Apigee hybrid, with the runtime plane installed on the bank's Kubernetes clusters in both data centers.
answer:
  optionId: d
explanation:
  correct:
    en: |
      Apigee hybrid splits the platform in two: Google hosts and maintains the management plane (UI, APIs, analytics) in Google Cloud, and you install and run the runtime plane on your own Kubernetes clusters. API traffic is processed inside your network, and runtime data such as API products, apps, and key value maps is stored in the runtime plane.
  options:
    a:
      en: With Apigee, the runtime runs in Google Cloud, so the API traffic is processed outside the bank's data centers.
    b:
      en: API Gateway also processes traffic in Google Cloud, and it is not deployed in the bank's data centers.
    c:
      en: Endpoint attachments only connect the Google-hosted Apigee runtime to backends; the traffic is still processed in Google Cloud.
references:
- title: What is Apigee hybrid?
  url: https://docs.cloud.google.com/apigee/docs/hybrid/latest/what-is-hybrid
