id: gcppca-5a-load-test-logs-bigquery
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company load tests a Cloud Run service with sudden traffic spikes. The Cloud Monitoring summary charts show that latency settles after each spike, but the team needs a second-by-second analysis of request latencies and instance start events during the first minute of each spike, using SQL queries.

    What should you do?
body:
  options:
  - id: a
    text:
      en: Create a log sink that routes the service's request and system logs to a BigQuery dataset, and query them there.
  - id: b
    text:
      en: Enable Cloud Profiler for the service, and compare the CPU profiles that were collected during each spike.
  - id: c
    text:
      en: Create an uptime check on the service URL, and analyze the check latency that it reports during each spike.
  - id: d
    text:
      en: Add a dashboard chart for the service's instance count, and read the values of each spike from that chart.
answer:
  optionId: a
explanation:
  correct:
    en: |
      Cloud Run's load testing guidance notes that summary charts are not enough to understand the response to rapid spikes and recommends exporting the logs to BigQuery with a log sink. Each request and instance event then becomes a row with its timestamp, which SQL can analyze second by second.
  options:
    b:
      en: Cloud Profiler shows where code spends CPU and memory; it does not record each request's latency or instance starts.
    c:
      en: An uptime check sends occasional probes, not the real requests of the test, so it cannot give second-by-second data for the load.
    d:
      en: A dashboard chart shows aligned summary values, which is the coarse view the team already has, and it cannot be queried with SQL.
references:
- title: Load testing best practices
  url: https://docs.cloud.google.com/run/docs/about-load-testing
