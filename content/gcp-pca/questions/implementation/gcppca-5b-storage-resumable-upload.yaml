id: gcppca-5b-storage-resumable-upload
objective: "5.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An architecture firm has an upload tool, written with the Cloud Storage Cloud Client Library, that sends 3 GB to 8 GB project archives from branch offices to a bucket. The branch connections are slow and often drop. Today, an interrupted upload starts again from the beginning, and some archives take a whole day to arrive.

    You need interrupted uploads to continue where they stopped, with the least custom code. What should you do?
body:
  options:
    - id: a
      text: { en: "Use a single-request upload for each archive and wrap it in a retry loop with exponential backoff." }
    - id: b
      text: { en: "Split each archive into 32 MiB parts uploaded as separate objects, then combine them with compose requests." }
    - id: c
      text: { en: "Raise the request timeout of the client library to several hours so that the connection is not closed." }
    - id: d
      text: { en: "Use a resumable upload so that the transfer continues from the last data persisted after a failure." }
answer: { optionId: d }
explanation:
  correct:
    en: Google recommends resumable uploads for large files and slow connections; after a communication failure, the transfer resumes instead of restarting. Cloud Client Libraries use resumable uploads automatically above a size threshold (or always, depending on the language), and a session stays valid for one week.
  options:
    a: { en: "Retrying a single-request upload restarts the whole archive each time, which is the current problem." }
    b: { en: "Splitting and composing requires custom code to track and combine parts, and Google advises avoiding chunking unless it is needed." }
    c: { en: "A longer timeout does not help when the network connection itself drops; the upload still restarts from zero." }
references:
  - title: Resumable uploads
    url: https://docs.cloud.google.com/storage/docs/resumable-uploads
