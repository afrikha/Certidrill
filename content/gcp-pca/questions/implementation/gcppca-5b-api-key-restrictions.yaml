id: gcppca-5b-api-key-restrictions
objective: "5.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A language-learning company publishes an Android app that calls a Google Cloud API that accepts API keys. The app sends a standard API key with each request. A security review warns that the key can be extracted from the app package and used by other apps or from servers to call any API that accepts keys in the project.

    You need to limit what an extracted key can be used for, without adding a backend. What should you do?
body:
  options:
    - id: a
      text: { en: "Add an Android apps application restriction with the app's package name and SHA-1 certificate fingerprint, and an API restriction to the one API." }
    - id: b
      text: { en: "Add an IP addresses application restriction with the address ranges of the main mobile carriers, and an API restriction to the one API." }
    - id: c
      text: { en: "Keep the key unrestricted, send it in the URL query string instead of a header, and rotate it every 30 days." }
    - id: d
      text: { en: "Add a websites application restriction with the company's domain as the HTTP referrer, and an API restriction to the one API." }
answer: { optionId: a }
explanation:
  correct:
    en: An Android apps restriction limits the key to requests from the app identified by its package name and SHA-1 certificate fingerprint, and an API restriction limits it to the API the app needs. Together they reduce what an extracted key can do, which is Google's first recommendation for API keys.
  options:
    b: { en: "Mobile devices change addresses constantly, and carrier ranges are shared with everyone, so an IP restriction would either break the app or protect nothing." }
    c: { en: "An unrestricted key can be used against every API that accepts keys, and Google recommends sending keys in the x-goog-api-key header rather than in URLs." }
    d: { en: "The websites restriction is for keys used from browsers on given sites; it does not fit requests sent by an Android app." }
references:
  - title: Manage API keys
    url: https://docs.cloud.google.com/docs/authentication/api-keys
  - title: Best practices for managing API keys
    url: https://docs.cloud.google.com/docs/authentication/api-keys-best-practices
