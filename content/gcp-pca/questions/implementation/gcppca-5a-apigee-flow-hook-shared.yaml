id: gcppca-5a-apigee-flow-hook-shared
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company has about 60 API proxies deployed in its Apigee `prod` environment, built by several teams. The security team requires that every request to any proxy in `prod`, including proxies created in the future, go through the same token validation and audit logging before the proxy's own logic runs. The security team wants to manage this logic in one place, without editing each proxy.

    What should you do?
body:
  options:
  - id: a
    text:
      en: Put the logic in a shared flow, and add a FlowCallout policy to the request PreFlow of each proxy.
  - id: b
    text:
      en: Put the logic in a shared flow, and attach it to the Post-target flow hook of the `prod` environment.
  - id: c
    text:
      en: Put the logic in a shared flow, and attach it to the Pre-proxy flow hook of the `prod` environment.
  - id: d
    text:
      en: Create an API product that bundles all proxies of `prod`, and require apps to use that API product.
answer:
  optionId: c
explanation:
  correct:
    en: |
      A shared flow attached to a flow hook runs at the hook's point for every proxy deployed to the environment, including future ones, and is maintained in one place. The Pre-proxy hook runs before the proxy endpoint executes, which is where token validation and request logging must happen.
  options:
    a:
      en: FlowCallout reuses the shared flow, but every proxy must be edited, and a new proxy is not covered until its team adds the callout.
    b:
      en: The Post-target hook runs after the target response, too late to validate the token before the proxy's logic and the backend call.
    d:
      en: An API product controls which apps can call which operations; it does not run validation or logging policies.
references:
- title: Attaching a shared flow using a flow hook
  url: https://docs.cloud.google.com/apigee/docs/api-platform/fundamentals/flow-hooks
