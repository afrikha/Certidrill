id: gcppca-5a-functions-framework-local
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer maintains two Cloud Run functions in Python: an HTTP function and a function triggered by Pub/Sub messages. Before each commit, the developer wants to run both functions on a laptop and send them test requests with `curl`, without deploying them and without rebuilding a container image after each change.

    What should you recommend?
body:
  options:
  - id: a
    text:
      en: Deploy each change to a test project with `gcloud run deploy`, and send the requests to the function URLs.
  - id: b
    text:
      en: Run the Pub/Sub emulator locally, and publish the test messages to a topic created in the emulator.
  - id: c
    text:
      en: Build a container image with Docker after each change, and run the image locally with `docker run`.
  - id: d
    text:
      en: Install the Functions Framework, start each function locally, and send HTTP or CloudEvent requests.
answer:
  optionId: d
explanation:
  correct:
    en: |
      The Functions Framework runs a function locally as a small web server, so you can test code without rebuilding the function container. HTTP functions receive plain requests such as `curl localhost:8080`, and event-driven functions receive POST requests with CloudEvent headers such as `ce-type` and `ce-source`.
  options:
    a:
      en: Deploying each change is exactly what the developer wants to avoid, and it is much slower than a local run.
    b:
      en: The emulator emulates the Pub/Sub service; it does not run the function code, which still needs a local runtime.
    c:
      en: Rebuilding an image after each change is the step the developer wants to skip.
references:
- title: Local functions development
  url: https://docs.cloud.google.com/run/docs/local-dev-functions
