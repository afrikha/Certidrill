id: gcppca-5b-workload-identity-federation-aws
objective: "5.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A streaming company runs a release pipeline on Amazon EC2 instances in AWS. The instances assume an AWS IAM role named release-runner. The pipeline must upload build artifacts to a Cloud Storage bucket in Google Cloud. Other teams run workloads in the same AWS account under different IAM roles.

    You need to give the pipeline access without any long-lived Google credential, and only workloads running as release-runner must be able to obtain access. What should you do?
body:
  options:
    - id: a
      text: { en: "Create a service account key, store it in AWS Secrets Manager with rotation every 90 days, and grant the service account access to the bucket." }
    - id: b
      text: { en: "Create a workload identity pool with an AWS provider for the account, and grant bucket access to every identity in the pool with a principalSet binding." }
    - id: c
      text: { en: "Create an API key with an IP address restriction for the Elastic IP addresses of the EC2 instances, and use it to call the Cloud Storage API." }
    - id: d
      text: { en: "Create a workload identity pool with an AWS provider that has an attribute condition accepting only the release-runner role, and grant bucket access to the federated identity." }
answer: { optionId: d }
explanation:
  correct:
    en: Workload Identity Federation lets workloads on AWS exchange their AWS credentials for short-lived Google Cloud tokens, removing service account keys. An attribute condition on the provider accepts only credentials that match release-runner, and granting access directly to that federated identity on the bucket is the approach Google recommends when the API supports it.
  options:
    a: { en: "A service account key is a long-lived credential, even when rotated and stored in a secrets manager, so it fails the main requirement." }
    b: { en: "Without an attribute condition and with a binding for every identity in the pool, workloads under the other AWS roles of the account could also get access." }
    c: { en: "A standard API key does not identify a principal for IAM, so it cannot be granted access to a private bucket, and it is itself a long-lived credential." }
references:
  - title: Workload Identity Federation
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation
