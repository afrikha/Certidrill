id: gcppca-5a-dms-oracle-alloydb
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturer wants to move an on-premises Oracle database that supports its order management system to AlloyDB for PostgreSQL, to stop paying Oracle licenses. The schema contains tables, views, and PL/SQL stored procedures. The application must stay online while data is copied, and downtime must be limited to the final switchover.

    What should you do?
body:
  options:
  - id: a
    text:
      en: Use Database Migration Service with a conversion workspace to convert the schema and code, then run a continuous migration job.
  - id: b
    text:
      en: Create a Datastream stream from Oracle to AlloyDB for PostgreSQL, and recreate the schema manually before the stream starts.
  - id: c
    text:
      en: Migrate the Oracle server to Compute Engine with Migrate to Virtual Machines, and switch to AlloyDB later.
  - id: d
    text:
      en: Export the Oracle tables to CSV files in Cloud Storage, and import them into AlloyDB during a weekend outage.
answer:
  optionId: a
explanation:
  correct:
    en: |
      Database Migration Service supports heterogeneous migrations from Oracle to AlloyDB for PostgreSQL. Its conversion workspace converts the schema and code objects automatically, with an SQL editor and Gemini assistance to fix what remains. A continuous migration then uses change data capture, so the source stays operational until you finalize the switchover.
  options:
    b:
      en: Datastream replicates changes to destinations such as BigQuery and Cloud Storage; it does not convert Oracle schema and PL/SQL code to PostgreSQL.
    c:
      en: Rehosting the Oracle server keeps Oracle and its licenses, and it does not move the data to AlloyDB.
    d:
      en: A CSV export and import needs a long outage, and it does not convert views and stored procedures.
references:
- title: Database Migration Service overview
  url: https://docs.cloud.google.com/database-migration/docs/overview
