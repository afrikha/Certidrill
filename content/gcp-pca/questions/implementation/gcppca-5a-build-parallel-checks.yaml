id: gcppca-5a-build-parallel-checks
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company's `cloudbuild.yaml` runs four steps in order: lint (3 minutes), unit tests (8 minutes), a dependency scan (5 minutes), and a container image build. None of the first three steps depends on another. The team wants to shorten the build by running the three checks at the same time, and the image build must start only after all three checks succeed.

    What should you do?
body:
  options:
  - id: a
    text:
      en: 'Add `waitFor: [''-'']` to all four steps so that every step starts as soon as the build starts.'
  - id: b
    text:
      en: 'Give the three checks an `id` and `waitFor: [''-'']`, and list their ids in the image build step''s `waitFor`.'
  - id: c
    text:
      en: Run the build in a private pool with a larger machine type, and keep the four steps in sequence.
  - id: d
    text:
      en: Split the three checks into three build triggers on the same commit, and run the image build in the last one.
answer:
  optionId: b
explanation:
  correct:
    en: |
      Build steps run sequentially by default. A step with `waitFor: ['-']` starts when the build starts, so the three checks run concurrently. Listing their ids in the `waitFor` field of the image build step makes it wait until each of them completes successfully.
  options:
    a:
      en: The image build would also start immediately, before the checks have succeeded.
    c:
      en: A larger machine may speed up each step, but the steps still run one after the other, so the 16 minutes of checks remain sequential.
    d:
      en: Separate triggers run independently, so the last one cannot know whether the other checks succeeded before it builds the image.
references:
- title: Configuring the order of build steps
  url: https://docs.cloud.google.com/build/docs/configuring-builds/configure-build-step-order
