id: gcppca-5b-pubsub-emulator-env
objective: "5.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at a ticketing company is building a Java service that publishes events with the Pub/Sub Cloud Client Library. He installed the Pub/Sub emulator and started it with `gcloud beta emulators pubsub start --project=local-test`. When he starts the service in another terminal, it still sends requests to the production Pub/Sub API.

    You need the service to use the local emulator without code changes. What should the developer do?
body:
  options:
    - id: a
      text: { en: "Set the api_endpoint_overrides/pubsub property of his gcloud configuration to the address of the emulator before he starts the service." }
    - id: b
      text: { en: "Run $(gcloud beta emulators pubsub env-init) in the terminal that starts the service so that PUBSUB_EMULATOR_HOST is set." }
    - id: c
      text: { en: "Set the GOOGLE_CLOUD_PROJECT environment variable to local-test so that the client library sends its requests to the emulator." }
    - id: d
      text: { en: "Run gcloud auth application-default revoke so that the client library cannot reach production and falls back to the emulator." }
answer: { optionId: b }
explanation:
  correct:
    en: The Pub/Sub client libraries connect to the emulator when the PUBSUB_EMULATOR_HOST environment variable is set. `gcloud beta emulators pubsub env-init` prints the right value; it must be run again each time the emulator starts because its port can change.
  options:
    a: { en: "gcloud properties only affect gcloud CLI commands; the client library in the service does not read them." }
    c: { en: "The project ID only names the project; it does not change the endpoint, so the library keeps calling the production API." }
    d: { en: "Client libraries do not fall back to an emulator; without credentials the production calls simply fail." }
references:
  - title: Testing apps locally with the emulator
    url: https://docs.cloud.google.com/pubsub/docs/emulator
