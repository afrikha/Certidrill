id: gcppca-5b-bigtable-emulator-admin
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An IoT company wants its integration tests for a Bigtable-based time-series service to run on the Bigtable emulator in CI instead of a production instance. The current test setup first calls the instance admin API to create an instance and a cluster, then creates the tables and column families, then writes and reads rows. Against the emulator, the setup fails at the first step.

    You need the tests to run on the emulator with the fewest changes. What should you do?
body:
  options:
    - id: a
      text: { en: "Remove the instance and cluster creation step, and let the tests connect with any project and instance ID before creating the tables." }
    - id: b
      text: { en: "Create the instance and the cluster with the HBase shell connected to the emulator before the tests start." }
    - id: c
      text: { en: "Configure the instance admin client to use a TLS connection to the emulator, which the emulator requires for administrative calls." }
    - id: d
      text: { en: "Keep the setup unchanged and run the tests against a one-node production instance that the pipeline creates and deletes." }
answer: { optionId: a }
explanation:
  correct:
    en: The Bigtable emulator has no administrative APIs for instances and clusters; a client can connect to it with any project and instance name and create tables directly. Removing the instance step, with BIGTABLE_EMULATOR_HOST set, is the smallest change.
  options:
    b: { en: "The emulator cannot be used from the HBase shell, and it still has no instances or clusters to create." }
    c: { en: "The emulator does not support secure connections, and the missing feature is the instance admin API itself, not the transport." }
    d: { en: "A production instance brings back the cost and the cloud dependency that the move to the emulator is meant to remove." }
references:
  - title: Test using the emulator
    url: https://docs.cloud.google.com/bigtable/docs/emulator
