id: gcppca-5b-firestore-emulator-reset
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A food delivery company runs several hundred integration tests for its Node.js backend against the Firestore emulator, started once per CI job with `gcloud emulators firestore start`. Each test must begin with an empty database. Restarting the emulator between tests made the job too slow.

    You need to give each test an empty database without restarting the emulator. What should you do?
body:
  options:
    - id: a
      text: { en: "Send an HTTP POST request to the emulator's /shutdown endpoint after each test, and let the CI job start the emulator again." }
    - id: b
      text: { en: "Disable local persistence in the client SDK settings so that documents written by one test are not visible to the next test." }
    - id: c
      text: { en: "Point each test at a collection with a unique name in the Firestore database of a test project in Google Cloud." }
    - id: d
      text: { en: "Send an HTTP DELETE request to the emulator's /emulator/v1/projects/PROJECT_ID/databases/(default)/documents endpoint before each test." }
answer: { optionId: d }
explanation:
  correct:
    en: The Firestore emulator exposes a REST endpoint that clears all its data when it receives a DELETE request, without restarting the process. Calling it in each test's setup gives every test an empty database and keeps the job fast.
  options:
    a: { en: "Shutting the emulator down and starting it again is the restart that made the job too slow." }
    b: { en: "Offline persistence is a cache in client SDKs; disabling it does not remove the documents stored in the emulator." }
    c: { en: "This moves the tests off the emulator to a cloud database, adding cost and network dependency, and does not give an empty database." }
references:
  - title: Use Firestore emulator locally
    url: https://docs.cloud.google.com/firestore/native/docs/emulator
