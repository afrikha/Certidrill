id: gcppca-5a-shell-editor-extensions
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team develops Cloud Run services in the Cloud Shell Editor. The team now needs a third-party code-quality extension that its new coding standard requires, together with the Cloud Code features it already uses, such as running services in the Cloud Run Emulator.

    What should you recommend?
body:
  options:
  - id: a
    text:
      en: Install the extension from the Extensions view of the Cloud Shell Editor.
  - id: b
    text:
      en: Install the extension in a `$HOME/.customize_environment` script so that it is added at each boot.
  - id: c
    text:
      en: Install VS Code on the developers' workstations with the extension and the Cloud Code extension.
  - id: d
    text:
      en: Open the editor at `ide.cloud.google.com` instead of from the Cloud Shell toolbar, and install it there.
answer:
  optionId: c
explanation:
  correct:
    en: |
      Custom extensions cannot be installed in the Cloud Shell Editor. Cloud Code is also available as an extension for VS Code (and IntelliJ), where developers can add other extensions and still run services in the Cloud Run Emulator before deploying them.
  options:
    a:
      en: Cloud Shell does not allow custom editor extensions to be installed.
    b:
      en: The customization script installs operating system packages; it does not lift the restriction on editor extensions.
    d:
      en: '`ide.cloud.google.com` opens the same Cloud Shell Editor, with the same restriction on extensions.'
references:
- title: Cloud Shell Quotas and limits
  url: https://docs.cloud.google.com/shell/docs/limitations
- title: Develop a Cloud Run service locally in Cloud Code for VS Code
  url: https://docs.cloud.google.com/code/docs/vscode/develop-service
