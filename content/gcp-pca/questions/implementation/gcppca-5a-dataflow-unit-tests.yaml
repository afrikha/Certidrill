id: gcppca-5a-dataflow-unit-tests
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data team develops an Apache Beam pipeline that runs on Dataflow. Its continuous integration system must check the logic of each `DoFn` and composite transform on every commit, in a few seconds, without creating any Google Cloud resources.

    What should you do?
body:
  options:
  - id: a
    text:
      en: Run the full pipeline on the Dataflow Runner in a staging project, and compare its output tables with expected tables.
  - id: b
    text:
      en: Write tests that apply each transform to small, known inputs with `TestPipeline` and check the results with `PAssert`.
  - id: c
    text:
      en: Run the production pipeline on the Direct Runner against a full copy of the production input data.
  - id: d
    text:
      en: Deploy each commit as a Dataflow job in production, and roll it back if its error metrics increase.
answer:
  optionId: b
explanation:
  correct:
    en: |
      Google recommends unit testing `DoFn` and composite transforms with `TestPipeline` and `PAssert` on the Direct Runner, using test data small enough to fit in local memory. These tests run in the CI system in seconds and need no Dataflow job.
  options:
    a:
      en: 'A staging run on the Dataflow Runner is an end-to-end test: it is slow, creates resources, and is not meant for every commit.'
    c:
      en: The Direct Runner runs on the local machine, so a full copy of production data does not fit the fast, small-input tests that CI needs.
    d:
      en: Testing in production exposes users to defects and does not check transform logic before deployment.
references:
- title: Develop and test Dataflow pipelines
  url: https://docs.cloud.google.com/dataflow/docs/guides/develop-and-test-pipelines
