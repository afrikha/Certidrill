id: gcppca-5b-terraform-structure-practices
objective: "5.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company manages its whole Google Cloud estate with a single Terraform root configuration of about 900 resources that serves the dev, staging and prod environments. Every plan takes a long time, and a change meant for dev once modified prod. The platform team is restructuring the code according to Google's Terraform best practices.

    Which two practices should the team adopt? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Create one root configuration per environment in an environments directory, each with its own backend, and share code through modules." }
    - id: b
      text: { en: "Generate the CI pipeline's service account key with a google_service_account_key resource and expose it as a module output." }
    - id: c
      text: { en: "Edit the state file by hand to remove the entries of resources that were deleted outside Terraform during the restructuring." }
    - id: d
      text: { en: "Split the estate into small root configurations per service and environment, each with far fewer than a hundred resources." }
    - id: e
      text: { en: "Delete the existing state and run terraform import for every existing resource so that the new layout takes over all of them." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Google recommends a modules directory for shared code and an environments directory with one root configuration and backend per environment, which isolates prod from dev changes. It also advises keeping root configurations small, no more than 100 resources per state and ideally a few dozen, because every resource is refreshed on each run.
  options:
    b: { en: "Service account keys created by Terraform are stored in plaintext in the state, and Google advises against keys and secrets in state." }
    c: { en: "Manual edits can corrupt the state; Google recommends the terraform state commands instead." }
    e: { en: "Google advises avoiding terraform import where possible; discarding the state and importing every resource again is risky and unnecessary for a restructuring." }
references:
  - title: Best practices for root modules
    url: https://docs.cloud.google.com/docs/terraform/best-practices/root-modules
  - title: Best practices for Terraform operations
    url: https://docs.cloud.google.com/docs/terraform/best-practices/operations
