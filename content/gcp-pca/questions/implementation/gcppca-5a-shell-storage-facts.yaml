id: gcppca-5a-shell-storage-facts
objective: "5.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A consulting firm plans to make Cloud Shell the standard tool of its consultants for administering client projects. Before writing the guidelines, you review how Cloud Shell stores data and how long its VMs run.

    Which two statements are true? Choose two.
body:
  choose: 2
  options:
  - id: a
    text:
      en: Each user gets 5 GB of persistent storage for `$HOME`, which is the same in every project the user opens.
  - id: b
    text:
      en: The persistent disk of `$HOME` can be resized to 50 GB for consultants who keep large datasets.
  - id: c
    text:
      en: Packages installed outside `$HOME` are kept for 120 days, like the files in the home directory.
  - id: d
    text:
      en: The VM is discarded after 40 minutes of inactivity, but the files in `$HOME` are kept.
  - id: e
    text:
      en: Cloud Shell has no weekly usage limit, so consultants can keep sessions open for several days.
answer:
  optionIds:
  - a
  - d
explanation:
  correct:
    en: |
      Cloud Shell gives each user 5 GB of persistent `$HOME` storage, private to the user and shared across projects. The VM behind a session is terminated after 40 minutes of inactivity, and changes outside `$HOME` are lost, but the home directory persists; it is deleted only after 120 days without access.
  options:
    b:
      en: The 5 GB home disk cannot be expanded.
    c:
      en: Anything installed outside `$HOME` is lost when the VM terminates; the 120-day rule applies to the home directory.
    e:
      en: Cloud Shell has a weekly quota of 50 hours, and a session ends after 12 hours at most.
references:
- title: Cloud Shell Quotas and limits
  url: https://docs.cloud.google.com/shell/docs/limitations
- title: How Cloud Shell works
  url: https://docs.cloud.google.com/shell/docs/how-cloud-shell-works
