id: gcppca-5b-pubsub-flow-control
objective: "5.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A sports betting company runs a Java subscriber on a fixed pool of GKE Pods that uses the Pub/Sub Cloud Client Library with streaming pull. A few times a day, short bursts of messages arrive and the Pods run out of memory because the client holds too many unacknowledged messages. Outside these bursts, the Pods keep up with the load.

    You need to absorb the bursts without adding Pods and with a small code change. What should you do?
body:
  options:
    - id: a
      text: { en: "Increase the acknowledgment deadline of the subscription so that messages held by the client are not redelivered during the bursts." }
    - id: b
      text: { en: "Configure flow control in the subscriber client with limits on outstanding messages and outstanding bytes that fit the memory of the Pods." }
    - id: c
      text: { en: "Enable exactly-once delivery on the subscription so that the client receives each message only once during the bursts." }
    - id: d
      text: { en: "Increase the message retention duration of the subscription so that messages that cannot be processed during the bursts are kept longer." }
answer: { optionId: b }
explanation:
  correct:
    en: Subscriber flow control in the high-level client library caps the number and total size of messages that are delivered but not yet acknowledged; when a limit is reached, the client stops pulling until messages are acknowledged. Google recommends it for transient spikes, sized to the capacity of the client machines.
  options:
    a: { en: "A longer acknowledgment deadline does not limit how many messages the client pulls, so memory still runs out." }
    c: { en: "Exactly-once delivery prevents redelivery of acknowledged messages; it does not limit the number of outstanding messages in memory." }
    d: { en: "Retention controls how long unacknowledged messages stay in the subscription, not how many the client pulls into memory at once." }
references:
  - title: Handle transient spikes with flow control
    url: https://docs.cloud.google.com/pubsub/docs/flow-control
