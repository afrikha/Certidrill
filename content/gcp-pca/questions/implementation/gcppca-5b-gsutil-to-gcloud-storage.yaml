id: gcppca-5b-gsutil-to-gcloud-storage
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company runs nightly shell scripts on an on-premises server. The scripts use `gsutil -m cp` and `gsutil rsync` to copy exported video metadata to Cloud Storage. The storage team now wants to enable soft delete and use managed folders on the destination buckets, and the platform team wants the scripts to keep working when the Google Cloud CLI package stops including gsutil.

    You need to follow Google's recommendation for the command-line tool while keeping the scripts' logic unchanged. What should you do?
body:
  options:
    - id: a
      text: { en: "Rewrite the commands as gcloud storage cp and gcloud storage rsync, which are the recommended Cloud Storage commands of the Google Cloud CLI." }
    - id: b
      text: { en: "Keep the gsutil commands and enable the shim that translates gsutil commands into gcloud storage commands at run time." }
    - id: c
      text: { en: "Install gsutil as a standalone tool from PyPI and pin its version so that the scripts keep running after the CLI change." }
    - id: d
      text: { en: "Replace the scripts with an agent-based Storage Transfer Service job that runs every night from the on-premises server." }
answer: { optionId: a }
explanation:
  correct:
    en: Google describes gsutil as a legacy, minimally maintained CLI that lacks newer features such as soft delete and managed folders, and recommends migrating to `gcloud storage` commands, which also need less manual tuning to reach the fastest transfer rates. `gcloud storage cp` and `gcloud storage rsync` map directly to the existing commands, so the scripts' logic stays the same.
  options:
    b: { en: "The documentation states that the gsutil-to-gcloud shim is no longer recommended; the scripts would still depend on gsutil." }
    c: { en: "A standalone gsutil keeps the scripts running but stays legacy and still lacks support for features such as managed folders, so it does not follow the recommendation." }
    d: { en: "Storage Transfer Service with on-premises agents replaces the scripts entirely: it changes the solution instead of keeping the scripts' logic." }
references:
  - title: gsutil tool
    url: https://docs.cloud.google.com/storage/docs/gsutil
