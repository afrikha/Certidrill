id: gcppca-5b-deployment-manager-migration
objective: "5.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturing company still manages its VPC networks, Compute Engine instance templates and Cloud SQL instances with Cloud Deployment Manager templates. Deployment Manager has reached end of support. The company wants a Google-managed service that runs infrastructure as code deployments for it, keeps a history of revisions, and lets reviewers preview changes before they are applied. The team does not want to operate its own build servers.

    Which service should you recommend?
body:
  options:
    - id: a
      text: { en: "Config Connector installed on a GKE cluster, with the resources described as Kubernetes manifests." }
    - id: b
      text: { en: "Infrastructure Manager, with the templates converted to Terraform configurations." }
    - id: c
      text: { en: "Cloud Deploy, with a delivery pipeline that promotes the templates from staging to production." }
    - id: d
      text: { en: "Terraform installed on a Compute Engine VM, with the state stored on its persistent disk." }
answer: { optionId: b }
explanation:
  correct:
    en: Google directs Deployment Manager users to Infrastructure Manager, a managed service that runs Terraform configurations in ephemeral Cloud Build jobs, stores revisions and state, and supports preview deployments before changes are applied. No build server has to be operated.
  options:
    a: { en: "Config Connector manages Google Cloud resources through Kubernetes, so the team would have to run and maintain a cluster just for infrastructure." }
    c: { en: "Cloud Deploy delivers applications to targets such as GKE and Cloud Run; it does not provision infrastructure from templates." }
    d: { en: "A self-managed VM running Terraform is the build server the team does not want to operate, and local state on a disk is hard to share safely." }
references:
  - title: Infrastructure Manager overview
    url: https://docs.cloud.google.com/infrastructure-manager/docs/overview
  - title: Deployment Manager deprecation
    url: https://docs.cloud.google.com/deployment-manager/docs/deprecations
