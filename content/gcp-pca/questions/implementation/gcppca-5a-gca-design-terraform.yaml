id: gcppca-5a-gca-design-terraform
objective: "5.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An architect at a retail company must propose an infrastructure for a new batch pipeline in one region. The architect wants to describe the business requirements in natural language, get an architecture diagram that follows Google Cloud practices, refine it over several prompts, and then obtain Terraform code that the team can deploy.

    What should you recommend?
body:
  options:
  - id: a
    text:
      en: Use Gemini Cloud Assist with Application Design Center to create the design, refine it, and get the Terraform code.
  - id: b
    text:
      en: Use Migration Center to assess the requirements and generate a target architecture with Terraform code.
  - id: c
    text:
      en: Use Gemini Code Assist in the IDE to write the Terraform configuration from scratch, one resource at a time.
  - id: d
    text:
      en: Use Infrastructure Manager to generate a design from the requirements and deploy it as a new deployment.
answer:
  optionId: a
explanation:
  correct:
    en: |
      In Gemini Cloud Assist chat, you can describe requirements as products or business outcomes, and Gemini suggests an architecture with a diagram and an explanation of each resource. The design keeps its context across prompts and canvas edits in Application Design Center, and you can download the Terraform code or deploy an application from the template. Gemini Cloud Assist is a Preview offering; Application Design Center itself is generally available.
  options:
    b:
      en: Migration Center discovers and assesses existing assets for migration; it does not design a new application from requirements.
    c:
      en: Gemini Code Assist can suggest code, but writing each resource by hand gives no architecture diagram or guided design.
    d:
      en: Infrastructure Manager deploys Terraform configurations that already exist; it does not design an architecture from requirements.
references:
- title: Design an application with Gemini assistance
  url: https://docs.cloud.google.com/cloud-assist/design-application
