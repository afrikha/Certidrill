id: gcppca-5a-deploy-multi-target-prod
objective: "5.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A streaming company runs the same API on three GKE clusters in `us-central1`, `europe-west1`, and `asia-southeast1`, and deploys it with Cloud Deploy. Today, the production stage promotes each release to the three cluster targets one after the other, and each one requires a separate approval. The company wants each release to be deployed to the three clusters at the same time, after a single approval by the release manager.

    What should you do? Choose two.
body:
  choose: 2
  options:
  - id: a
    text:
      en: 'Set `requireApproval: true` on each of the three child targets, and remove it from the pipeline stage.'
  - id: b
    text:
      en: Create a multi-target whose `multiTarget.targetIds` list the three GKE cluster targets, and use it as the production stage.
  - id: c
    text:
      en: Create three delivery pipelines, one per region, and promote each release in all three pipelines from a script.
  - id: d
    text:
      en: 'Set `requireApproval: true` on the multi-target, so that one approval covers the deployment to all three clusters.'
  - id: e
    text:
      en: Add a Cloud Run target in `us-east1` to the same multi-target, so that the release also deploys there in parallel.
answer:
  optionIds:
  - b
  - d
explanation:
  correct:
    en: |
      A multi-target is one pipeline stage that points to child targets; when a release reaches it, Cloud Deploy creates a controller rollout and child rollouts that deploy to each cluster in parallel. With parallel deployment, approval can be configured only on the multi-target, and that single decision applies to all child targets.
  options:
    a:
      en: Child targets of a multi-target cannot require approval; approval is set on the multi-target only.
    c:
      en: Separate pipelines duplicate configuration and still need an approval per pipeline, which is the opposite of the goal.
    e:
      en: All child targets of one multi-target must use the same runtime, so a Cloud Run target cannot join GKE child targets.
references:
- title: Deploy to multiple targets at the same time
  url: https://docs.cloud.google.com/deploy/docs/parallel
