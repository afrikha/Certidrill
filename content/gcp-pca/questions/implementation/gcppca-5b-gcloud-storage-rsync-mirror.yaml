id: gcppca-5b-gcloud-storage-rsync-mirror
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineering firm keeps CAD exports in a directory tree on a build server. A nightly job must make a Cloud Storage bucket path an exact mirror of that directory tree: new and changed files are uploaded, and files deleted from the server are deleted from the bucket. Unchanged files must not be uploaded again.

    You want to use the current recommended command-line tool. Which command should the job run?
body:
  options:
    - id: a
      text: { en: "gcloud storage cp --recursive /exports gs://cad-mirror/exports" }
    - id: b
      text: { en: "gcloud storage rsync --recursive /exports gs://cad-mirror/exports" }
    - id: c
      text: { en: "gsutil -m rsync -r -d /exports gs://cad-mirror/exports" }
    - id: d
      text: { en: "gcloud storage rsync --recursive --delete-unmatched-destination-objects /exports gs://cad-mirror/exports" }
answer: { optionId: d }
explanation:
  correct:
    en: "`gcloud storage rsync` copies only new or changed files and updates the destination to match the source; `--recursive` includes subdirectories and `--delete-unmatched-destination-objects` removes destination objects that no longer exist in the source. Because that flag can delete data quickly with a wrong source or destination, running the command once with `--dry-run` first is a good practice."
  options:
    a: { en: "cp copies every file each night and never deletes objects removed from the server, so the bucket is not a mirror." }
    b: { en: "Without --delete-unmatched-destination-objects (off by default), rsync never deletes objects, so files removed from the server stay in the bucket." }
    c: { en: "This gsutil command mirrors the directory, but gsutil is a legacy tool that Google no longer recommends; gcloud storage is the current tool." }
references:
  - title: gcloud storage rsync
    url: https://docs.cloud.google.com/sdk/gcloud/reference/storage/rsync
