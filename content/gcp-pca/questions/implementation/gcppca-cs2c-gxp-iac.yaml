id: gcppca-cs2c-gxp-iac
objective: "5.2.4"
type: single
caseStudy: gcppca-cs2c-quillon
difficulty: 2
status: draft
stem:
  en: |
    Quillon's quality assurance team asks you to define how infrastructure changes to the validated systems will be made on Google Cloud. The process must meet the business requirement about infrastructure changes and the technical requirement about infrastructure tooling.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Keep the Terraform configurations in a Git repository where changes are approved by pull request, and apply them with Infrastructure Manager to separate qualification and production deployments." }
    - id: b
      text: { en: "Keep the Terraform configurations in a Git repository, and have the two administrators run terraform apply from their workstations with the state files stored on their local disks." }
    - id: c
      text: { en: "Let the administrators keep making changes in the Google Cloud console, and give the quality assurance team access to the Admin Activity audit logs as the record of each change." }
    - id: d
      text: { en: "Install Terraform and a self-hosted CI server on a Compute Engine virtual machine that applies the configurations from a Git repository and stores the state on the virtual machine's disk." }
answer: { optionId: a }
explanation:
  correct:
    en: "Pull requests give a reviewed and approved record of every change, and Infrastructure Manager is a managed service that runs Terraform in Cloud Build and stores the configuration, logs and state of every revision. Applying the same configurations to separate qualification and production deployments makes the environments reproducible, and previews show the effect of a change before it is approved."
  options:
    b: { en: "Local state files and applies from workstations leave no central, traceable record and let the two environments drift apart without review." }
    c: { en: "Audit logs record changes after they happen, but console changes are neither reviewed beforehand nor reproducible in another environment." }
    d: { en: "A self-hosted CI server and Terraform installation are self-managed tools that the requirements ask to avoid when a managed service exists." }
references:
  - title: Infrastructure Manager overview
    url: https://docs.cloud.google.com/infrastructure-manager/docs/overview
