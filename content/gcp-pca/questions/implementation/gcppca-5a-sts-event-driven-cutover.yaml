id: gcppca-5a-sts-event-driven-cutover
objective: "5.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A photo-sharing company is moving 300 TB of user images from Amazon S3 to Cloud Storage, and its application will switch to Cloud Storage in one week. An initial batch transfer job has already copied the existing objects. Until the switchover, users keep uploading new images to S3, and the company wants new objects to reach Cloud Storage within minutes so that the switchover causes only minutes of downtime.

    What should you do?
body:
  options:
  - id: a
    text:
      en: Change the existing transfer job to run every hour until the switchover, and then run it one last time.
  - id: b
    text:
      en: Create an event-driven Storage Transfer Service job that reads S3 event notifications from an Amazon SQS queue.
  - id: c
    text:
      en: Run `gcloud storage rsync` in a loop on a Compute Engine VM until the switchover is complete.
  - id: d
    text:
      en: Order a Transfer Appliance for the new objects, and ship it back to Google on the day of the switchover.
answer:
  optionId: b
explanation:
  correct:
    en: |
      Event-driven transfers react to change events instead of listing the source: for Amazon S3, Storage Transfer Service reads S3 event notifications sent to Amazon SQS and copies new objects in near real time. Google lists low-downtime live migration after a one-time batch transfer as a use case. Note that object deletions are not propagated.
  options:
    a:
      en: An hourly schedule leaves up to an hour of new objects to copy and lists the whole 300 TB bucket each run, so the gap is not minutes.
    c:
      en: A VM loop is infrastructure to manage, and each `rsync` pass must list the whole bucket, which takes long at this scale.
    d:
      en: An appliance takes days to ship and load, so objects uploaded until the switchover would arrive far too late.
references:
- title: Event-driven transfers
  url: https://docs.cloud.google.com/storage-transfer/docs/event-driven-transfers
