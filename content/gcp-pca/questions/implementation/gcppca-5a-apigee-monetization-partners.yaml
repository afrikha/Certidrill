id: gcppca-5a-apigee-monetization-partners
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A weather data company exposes REST APIs on Cloud Run. It now wants to sell access to partners: each partner discovers the APIs and their documentation in a developer portal, buys a plan with a monthly fee plus a charge per call, and pays in advance from a balance. The company wants a Google Cloud managed product for this.

    What should you recommend?
body:
  options:
  - id: a
    text:
      en: API Gateway in front of the Cloud Run services, with API keys and per-consumer quotas for each partner.
  - id: b
    text:
      en: Apigee, with API products that carry monetization rate plans and prepaid billing for the partners.
  - id: c
    text:
      en: An external Application Load Balancer with Cloud Armor rate limiting rules for each partner's IP range.
  - id: d
    text:
      en: Identity-Aware Proxy in front of the Cloud Run services, with one access level for each paying partner.
answer:
  optionId: b
explanation:
  correct:
    en: |
      Apigee is Google Cloud's API management platform: it provides API proxies, a developer portal where client developers discover the APIs, and monetization. Monetization attaches rate plans with setup, recurring, and per-transaction fees to API products, and prepaid billing deducts charges from each developer's wallet.
  options:
    a:
      en: API Gateway authenticates and monitors calls to backends defined in an OpenAPI spec, but it has no rate plans or billing for API consumers.
    c:
      en: Cloud Armor rate limiting protects the backend from excess traffic; it provides no developer portal, plans, or billing.
    d:
      en: IAP controls access for authenticated users; it does not publish APIs to developers or charge for their use.
references:
- title: Overview of Apigee monetization
  url: https://docs.cloud.google.com/apigee/docs/api-platform/monetization/overview
- title: What is Apigee?
  url: https://docs.cloud.google.com/apigee/docs/api-platform/get-started/what-apigee
