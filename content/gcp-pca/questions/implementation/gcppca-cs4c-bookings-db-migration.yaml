id: gcppca-cs4c-bookings-db-migration
objective: "5.1.4"
type: multi
caseStudy: gcppca-cs4c-saltroute-travel
difficulty: 3
status: draft
stem:
  en: |
    You are planning the migration of the bookings database to AlloyDB for PostgreSQL. The plan must meet the business requirement about booking downtime and the technical requirements for the database migration.

    Which two actions should you take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a primary key to each of the fourteen tables that have none, before the migration job starts." } }
    - { id: b, text: { en: "Exclude the fourteen tables from the migration job, and copy them with pg_dump and pg_restore during the downtime window." } }
    - { id: c, text: { en: "Create a continuous Database Migration Service job from the RDS instance to AlloyDB, and start it during the downtime window so that the full dump reflects the final data." } }
    - { id: d, text: { en: "Create a continuous Database Migration Service job from the RDS instance to AlloyDB, and promote it in the window after writes stop and the replication delay reaches zero." } }
    - { id: e, text: { en: "Export the RDS database with pg_dump during the window, copy the file with Storage Transfer Service, and import it into AlloyDB with pg_restore." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A continuous Database Migration Service job copies the database with a full dump and then replicates changes; at cutover, writes to the source stop, the replication delay drops to zero, and promotion makes AlloyDB the writable primary, so downtime lasts minutes. For tables without a primary key, the service migrates only the initial snapshot and the INSERT statements of the change data capture phase, so the fourteen tables, which receive updates and deletes all day, need a primary key before the job starts.
  options:
    b:
      en: The downtime would include a dump and restore whose duration depends on the size of the fourteen tables, which nothing in the case limits to 20 minutes, and the migration would no longer be done with the managed service alone.
    c:
      en: A full dump of 3.5 TB that starts in the window cannot complete and catch up within 20 minutes; the job must run before the window.
    e:
      en: Dumping, copying and restoring 3.5 TB during the window takes hours, far more than 20 minutes, and does not use a managed migration service.
references:
  - title: Known limitations
    url: https://docs.cloud.google.com/database-migration/docs/postgresql-to-alloydb/known-limitations
  - title: Promote a migration
    url: https://docs.cloud.google.com/database-migration/docs/postgresql-to-alloydb/promote-migration
