id: gcppca-5a-shell-customize-environment
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator uses Cloud Shell every day and installs a Debian package that is not preinstalled with `sudo apt-get install`. The next morning, the package is gone. The administrator wants the package to be installed automatically each time the Cloud Shell VM starts, rather than each time a new terminal tab opens.

    What should you do?
body:
  options:
  - id: a
    text:
      en: Add the `apt-get install` command to `$HOME/.bashrc` so that it runs in every new terminal tab.
  - id: b
    text:
      en: Add the `apt-get install` command to a `$HOME/.customize_environment` script.
  - id: c
    text:
      en: Switch Cloud Shell to ephemeral mode so that the VM keeps the installed packages.
  - id: d
    text:
      en: Install the package in `/usr/local` instead of the default location used by `apt-get`.
answer:
  optionId: b
explanation:
  correct:
    en: |
      Cloud Shell runs `$HOME/.customize_environment` automatically, as root, once each time the VM boots, so it can install Debian packages for every session. Because the script is in `$HOME`, which is a 5 GB persistent disk, it survives when the VM is discarded.
  options:
    a:
      en: '`.bashrc` runs at each shell login, so the package would be reinstalled in every new tab, which the administrator wants to avoid.'
    c:
      en: 'Ephemeral mode has no persistent disk at all: every file of the session is lost when it ends.'
    d:
      en: Only `$HOME` persists between sessions; anything installed elsewhere on the VM, including `/usr/local`, is lost.
references:
- title: Configure Cloud Shell
  url: https://docs.cloud.google.com/shell/docs/configuring-cloud-shell
- title: How Cloud Shell works
  url: https://docs.cloud.google.com/shell/docs/how-cloud-shell-works
