id: gcppca-5a-run-deploy-from-source
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup has a Python web application with no Dockerfile. Its developers do not have Docker installed on their laptops. The team wants to deploy the application to Cloud Run with a single command, and the container images must be stored in Artifact Registry.

    What should you recommend?
body:
  options:
  - id: a
    text:
      en: Write a Dockerfile, build and push the image with Docker, and then run `gcloud run deploy --image`.
  - id: b
    text:
      en: Create a Cloud Deploy delivery pipeline with a Cloud Run target, and run `gcloud deploy releases create`.
  - id: c
    text:
      en: Run the Cloud Code command Run on Cloud Run Emulator from the application directory in VS Code.
  - id: d
    text:
      en: Run `gcloud run deploy --source .` from the application directory to build and deploy the service.
answer:
  optionId: d
explanation:
  correct:
    en: |
      A source deployment uploads the code, builds it with Cloud Build, and uses Google Cloud's buildpacks to detect the language when no Dockerfile is present. The built image is stored in Artifact Registry (in a `cloud-run-source-deploy` repository if none exists), and the service is deployed, all from one command and without Docker on the laptop.
  options:
    a:
      en: This requires Docker on each laptop and several commands, which the team wants to avoid.
    b:
      en: A delivery pipeline deploys releases of images that were already built; it adds setup and does not build the source by itself.
    c:
      en: The emulator runs the service locally for development; it does not deploy anything to Cloud Run.
references:
- title: Deploy services from source code
  url: https://docs.cloud.google.com/run/docs/deploying-source-code
