id: gcppca-5a-gca-finops-insights
objective: "5.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The FinOps lead of a media company reviews Cloud Billing every week. She wants a short summary of the main cost drivers in each cost report, a summary of the largest wasted-usage insights, and a draft email that she can send to the engineering teams, with as little manual analysis as possible.

    What should you recommend?
body:
  options:
  - id: a
    text:
      en: Export the billing data to BigQuery, and build a Looker Studio report that the teams can open each week.
  - id: b
    text:
      en: Create budgets with alert thresholds for each project, and forward the budget alert emails to the teams.
  - id: c
    text:
      en: Query the Recommender API from a scheduled script, and send the list of recommendations to the teams.
  - id: d
    text:
      en: Use Gemini Cloud Assist in Cloud Billing to summarize the reports and FinOps hub insights and draft the email.
answer:
  optionId: d
explanation:
  correct:
    en: |
      Gemini Cloud Assist in Cloud Billing adds summaries of up to three key insights to each cost report, such as cost trends and drivers. On the FinOps hub Utilization insights dashboard, Gemini summarizes the top wasted-usage insights and can draft an email report for your teams. Gemini Cloud Assist in Cloud Billing is a Preview offering.
  options:
    a:
      en: A report shows the data, but the lead would still analyze it and write the summary herself.
    b:
      en: Budget alerts say that spending crossed a threshold; they do not summarize cost drivers or waste.
    c:
      en: A custom script is code to maintain, and a raw list of recommendations is not a summary or a ready email.
references:
- title: Gemini Cloud Assist in Cloud Billing
  url: https://docs.cloud.google.com/billing/docs/how-to/gemini/overview
