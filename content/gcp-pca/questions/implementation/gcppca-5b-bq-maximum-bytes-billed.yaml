id: gcppca-5b-bq-maximum-bytes-billed
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company uses BigQuery with on-demand pricing. About forty shell scripts run bq query commands from a shared batch server under one Linux user account. Last month, one script ran a query without a partition filter that processed several hundred terabytes.

    You need every individual query started by these scripts to fail, without any charge, when it would bill more than 2 TB. Queries under that limit must keep running normally, and you must not edit the scripts. What should you do?
body:
  options:
    - id: a
      text: { en: "Create a custom quota on query usage per day for the project, set to 2 TB, so that queries stop when the quota is reached." }
    - id: b
      text: { en: "Add a default maximum_bytes_billed value of 2 TB for the query command in the .bigqueryrc file of the Linux user that runs the scripts." }
    - id: c
      text: { en: "Create a Cloud Billing budget of the monthly expected amount with a Pub/Sub notification that disables billing for the project." }
    - id: d
      text: { en: "Add a default dry_run setting for the query command in the .bigqueryrc file of the Linux user that runs the scripts." }
answer: { optionId: b }
explanation:
  correct:
    en: With on-demand pricing, the maximum bytes billed setting makes a query fail without charge when its estimate is above the limit, and queries under the limit run normally. The bq tool reads default flags for each command from the user's .bigqueryrc file, so the limit applies to every script without editing them.
  options:
    a: { en: "A custom daily quota caps the total processed per day, not each query: one large query can still run if the quota is not yet used, and normal queries are blocked once the daily total is reached." }
    c: { en: "A budget acts on monthly spend after the fact; disabling billing stops the whole project instead of failing the single oversized query." }
    d: { en: "A default dry run would stop every query from running, including the normal ones under the limit." }
references:
  - title: Estimate and control costs
    url: https://docs.cloud.google.com/bigquery/docs/best-practices-costs
  - title: bq command-line tool reference
    url: https://docs.cloud.google.com/bigquery/docs/reference/bq-cli-reference
