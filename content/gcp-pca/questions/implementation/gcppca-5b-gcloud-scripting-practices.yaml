id: gcppca-5b-gcloud-scripting-practices
objective: "5.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A fintech company has a CI job that runs a Bash script with gcloud CLI commands. The script lists Compute Engine instances, extracts their names by parsing the default table output with awk, and deletes the instances that carry a cleanup label. After a gcloud CLI update, the parsing broke. The job also hangs because a delete command waits for a confirmation answer.

    You need to make the script reliable by following Google's recommendations for scripting the gcloud CLI. Which two changes should you make? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Detect failures by searching the messages that gcloud writes to standard error for words such as ERROR." }
    - id: b
      text: { en: "Request an explicit output format, for example --format=\"value(name)\" combined with --filter, instead of parsing the default output." }
    - id: c
      text: { en: "Run each delete command as a parallel background job so that the script finishes before the job timeout." }
    - id: d
      text: { en: "Add the --quiet flag, or set the core/disable_prompts property, so that gcloud uses default answers instead of prompting." }
    - id: e
      text: { en: "Switch the list and delete commands to the gcloud beta track so that their output format stays the same between releases." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Google recommends pinning the output with `--format` (and selecting resources with `--filter`) because the default human-readable output may change between releases, and disabling prompts with `--quiet` or the disable_prompts property so that commands use their default answers in automation. The script should then check each command's exit status.
  options:
    a: { en: "Google advises against depending on messages printed to standard error, whose wording can change; check the exit status instead." }
    c: { en: "Running several gcloud commands in parallel is not supported according to the scripting guidance." }
    e: { en: "Beta commands can change without notice; the beta track gives no more stable output than the GA commands." }
references:
  - title: Scripting gcloud CLI commands
    url: https://docs.cloud.google.com/sdk/docs/scripting-gcloud
  - title: gcloud topic formats
    url: https://docs.cloud.google.com/sdk/gcloud/reference/topic/formats
