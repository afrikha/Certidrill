id: gcppca-5b-api-retry-backoff
objective: "5.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A photo-sharing company has a batch service that calls the Cloud Storage JSON API directly over HTTPS with its own HTTP client. During peak hours, some requests fail with HTTP 429 and 503 responses. The current code retries every failed request immediately, in a loop, until it succeeds, and the failures get worse during peaks.

    You need to change the retry logic according to Google's recommendations for calling Google APIs. Which two changes should you make? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Retry with exponentially increasing waits between attempts, add random jitter to each wait, and stop at a maximum backoff time." }
    - id: b
      text: { en: "Retry at a fixed interval of one second so that every instance of the service retries at the same predictable pace." }
    - id: c
      text: { en: "Retry only requests that are idempotent, or made conditionally idempotent with a precondition such as ifGenerationMatch." }
    - id: d
      text: { en: "Treat every 4xx response, including 403 and 404, as retryable in the same way as 429 and 503 responses." }
    - id: e
      text: { en: "Send each failed request again from several threads in parallel so that at least one attempt succeeds quickly." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Google recommends exponential backoff with jitter for responses such as 408, 429 and 5xx: waits grow exponentially up to a maximum, and randomness keeps clients from retrying in sync. Only idempotent requests should be retried automatically; operations such as object uploads become safe to retry when they carry a precondition like ifGenerationMatch."
  options:
    b: { en: "A fixed interval with no jitter makes all instances retry in step, which keeps the overload going instead of spreading the load." }
    d: { en: "403 and 404 are permanent errors that need a fix, such as permissions or a correct name; retrying them does not help." }
    e: { en: "Parallel retries multiply the load on a service that is already throttling the client, and can cause conflicting writes." }
references:
  - title: Retry strategy
    url: https://docs.cloud.google.com/storage/docs/retry-strategy
