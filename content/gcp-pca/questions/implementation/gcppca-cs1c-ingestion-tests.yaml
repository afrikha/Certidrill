id: gcppca-cs1c-ingestion-tests
objective: "5.2.3"
type: multi
caseStudy: gcppca-cs1c-furrowline-agtech
difficulty: 2
status: draft
stem:
  en: |
    The ingestion service now reads messages from Pub/Sub and writes the readings to Bigtable. You need to change its integration tests to meet the technical requirements for testing.

    Which two actions should you take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "In each test run, start the Bigtable emulator with gcloud beta emulators bigtable start and set BIGTABLE_EMULATOR_HOST before the tests start." } }
    - { id: b, text: { en: "In each test run, start the Pub/Sub emulator, set PUBSUB_EMULATOR_HOST from the output of gcloud beta emulators pubsub env-init, and create the topics and subscriptions with the client library." } }
    - { id: c, text: { en: "In each test run, start the Pub/Sub emulator and create the topics and subscriptions with gcloud pubsub topics create and gcloud pubsub subscriptions create." } }
    - { id: d, text: { en: "In each test run, create a Bigtable instance in the shared test project with a name that includes the run ID, and delete it when the tests end." } }
    - { id: e, text: { en: "Store a key of a test service account in the CI secrets, and have each test run use its own Pub/Sub topic in the shared test project." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      The Bigtable and Pub/Sub emulators run locally, keep their data in memory and need no real Google Cloud project, so every test run starts from an empty, isolated environment. The client libraries connect to them when BIGTABLE_EMULATOR_HOST and PUBSUB_EMULATOR_HOST are set; env-init prints the Pub/Sub value, whose port can change at each start. The Pub/Sub emulator is managed through the client libraries, which create the topics and subscriptions.
  options:
    c:
      en: The Pub/Sub emulator does not support gcloud pubsub commands, so the topics and subscriptions must be created with the client library.
    d:
      en: A Bigtable instance in the shared test project still uses a Google Cloud project, which the testing requirement rules out.
    e:
      en: Service account keys are forbidden by the enforced organization policy, and the tests would still use a Google Cloud project.
references:
  - title: Test using the emulator
    url: https://docs.cloud.google.com/bigtable/docs/emulator
  - title: Testing apps locally with the emulator
    url: https://docs.cloud.google.com/pubsub/docs/emulator
