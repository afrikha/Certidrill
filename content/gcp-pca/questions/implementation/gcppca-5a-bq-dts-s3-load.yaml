id: gcppca-5a-bq-dts-s3-load
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company's partner drops daily CSV files of ad impressions in an Amazon S3 bucket. The company's analysts need the data in a BigQuery table every morning. The company wants the fewest components to build and operate, with no code and no servers.

    What should you do?
body:
  options:
  - id: a
    text:
      en: Create a Storage Transfer Service job from the S3 bucket to Cloud Storage, and let analysts query the bucket.
  - id: b
    text:
      en: Create a Datastream stream with the S3 bucket as the source and the BigQuery dataset as the destination.
  - id: c
    text:
      en: Run a Compute Engine VM with a cron job that downloads the files and loads them with the `bq load` command.
  - id: d
    text:
      en: Create a BigQuery Data Transfer Service transfer for Amazon S3 that loads the files into the table on a schedule.
answer:
  optionId: d
explanation:
  correct:
    en: |
      BigQuery Data Transfer Service for Amazon S3 automates recurring load jobs from an S3 bucket into BigQuery tables. One scheduled transfer configuration replaces any copy-and-load chain, with no code or server to operate.
  options:
    a:
      en: Storage Transfer Service only copies the files to a bucket; a separate load step would still be needed to put the data in a BigQuery table.
    b:
      en: Datastream captures changes from databases and some applications; it does not read files from an S3 bucket.
    c:
      en: A VM with a cron job is a server to operate and custom code to maintain.
references:
- title: Introduction to Amazon S3 data transfers
  url: https://docs.cloud.google.com/bigquery/docs/s3-transfer-intro
