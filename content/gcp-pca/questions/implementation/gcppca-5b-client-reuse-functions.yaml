id: gcppca-5b-client-reuse-functions
objective: "5.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company deployed an HTTP Cloud Run function in Node.js that writes each incoming order to Firestore. The handler creates a new Firestore client object at the start of every invocation. Under load, latency is high, and some requests fail with authentication errors caused by rate limiting.

    You need to fix the problem with a minimal code change. What should you do?
body:
  options:
    - id: a
      text: { en: "Increase the memory and CPU allocated to the function so that the client created in each invocation initializes faster." }
    - id: b
      text: { en: "Declare the client in global scope, initialized once and lazily if needed, and reuse it in every invocation that the instance serves." }
    - id: c
      text: { en: "Pass a service account key file to the client created in each invocation so that it does not need to call the metadata server." }
    - id: d
      text: { en: "Close the client at the end of each invocation so that its connections and credentials are released before the next request." }
answer: { optionId: b }
explanation:
  correct:
    en: Google recommends reusing client objects for many requests, because clients from one instance share credentials and the first authentication can take seconds over the network; creating many clients quickly can trigger rate limiting. In Cloud Run functions, objects in global scope are reused across invocations of an instance, so API clients should be cached there.
  options:
    a: { en: "More resources do not remove the network round trips of each new client's authentication, nor the rate limiting caused by creating many clients." }
    c: { en: "Service account keys are a security risk Google advises against, and a new client per invocation still repeats the credential setup." }
    d: { en: "Closing the client each time still creates a new client and a new authentication for every request, so the problem stays." }
references:
  - title: Client libraries best practices
    url: https://docs.cloud.google.com/apis/docs/client-libraries-best-practices
  - title: Functions best practices
    url: https://docs.cloud.google.com/run/docs/tips/functions-best-practices
