id: gcppca-cs5a-orders-db-migration
objective: "5.1.4"
type: single
caseStudy: gcppca-cs5a-brambleway-grocers
difficulty: 2
status: draft
stem:
  en: |
    You are advising the database team on the migration of the order and loyalty database. The migration must meet the business requirement about the migration window and the technical requirement for the database.

    Which approach should you recommend?
body:
  options:
    - { id: a, text: { en: "During the maintenance window, export the database to a BACPAC file, upload it to Cloud Storage, and import it into a Cloud SQL for SQL Server instance." } }
    - { id: b, text: { en: "Create a Datastream stream from the SQL Server database to the Cloud SQL for SQL Server instance, and switch the applications to Cloud SQL when the stream has no backlog." } }
    - { id: c, text: { en: "Migrate the Windows Server VMs to Compute Engine with Migrate to Virtual Machines, and switch the applications to the migrated VMs during the maintenance window." } }
    - { id: d, text: { en: "Create a Database Migration Service job that loads the full backup and then the transaction log backups uploaded to Cloud Storage, and promote the Cloud SQL for SQL Server instance after the final log backup." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Database Migration Service for SQL Server reads the full backup and then detects and applies each new transaction log backup uploaded to the Cloud Storage bucket, so the 11-hour initial load happens while the applications still use the source database. In the maintenance window, the team stops writes, uploads the final log backup, waits for the job to be ready to promote, and promotes the Cloud SQL for SQL Server instance.
  options:
    a:
      en: Exporting and importing 3 TB during the window repeats the full-copy problem of the restore test, which took 11 hours, far beyond the one-hour window.
    b:
      en: Datastream writes change streams directly to BigQuery or Cloud Storage; Cloud SQL is not a direct Datastream destination and can be reached only by building an additional Dataflow pipeline, whereas Database Migration Service is the managed tool for homogeneous migrations to Cloud SQL for SQL Server.
    c:
      en: Rehosting the VMs keeps a self-managed SQL Server on Compute Engine, which does not meet the requirement to run the database on Cloud SQL for SQL Server.
references:
  - title: Migrate your SQL Server databases to Cloud SQL for SQL Server
    url: https://docs.cloud.google.com/database-migration/docs/sqlserver
