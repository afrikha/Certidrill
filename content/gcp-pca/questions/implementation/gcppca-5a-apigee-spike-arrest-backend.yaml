id: gcppca-5a-apigee-spike-arrest-backend
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company publishes a shipment tracking API through Apigee to about 300 partner apps. Each partner already has a monthly call allowance enforced in Apigee. The legacy backend fails when the combined traffic from all partners exceeds about 200 requests per second for a few seconds, which happens when several partners run batch jobs at the same time. You need to protect the backend from these short bursts, whichever apps send them.

    What should you do?
body:
  options:
  - id: a
    text:
      en: Add a Quota policy with a one-minute interval that counts requests per developer app.
  - id: b
    text:
      en: Lower the monthly quota of the API products that the partner apps are associated with.
  - id: c
    text:
      en: Add a SpikeArrest policy at the start of the proxy endpoint's request PreFlow.
  - id: d
    text:
      en: Add a Cloud Armor rate limiting rule per client IP address on the Apigee load balancer.
answer:
  optionId: c
explanation:
  correct:
    en: |
      SpikeArrest limits the calls that reach an API proxy across all consumers over a short period, smoothing bursts so the backend is protected. Google recommends placing it at the very start of the ProxyEndpoint request PreFlow, before other processing.
  options:
    a:
      en: A Quota policy counts calls per app or developer, so 300 apps each within their own limit can still overwhelm the backend together.
    b:
      en: A monthly allowance controls long-term consumption per app; it does nothing against a burst of a few seconds.
    d:
      en: A per-IP rule limits each client separately, so the combined burst from many partners still reaches the backend.
references:
- title: Comparing rate-limiting policies
  url: https://docs.cloud.google.com/apigee/docs/api-platform/develop/comparing-quota-and-spike-arrest-policies
