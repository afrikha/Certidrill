id: gcppca-5b-private-google-access
objective: "5.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A pharmaceutical company runs data-processing VMs that have only internal IP addresses in the subnet lab-subnet of a custom-mode VPC network. The VMs must call the Cloud Storage and BigQuery APIs. Company policy forbids giving the VMs external IP addresses or any path to other internet destinations.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create a Cloud NAT gateway for the region of lab-subnet so that the VMs can reach the Google API endpoints." }
    - id: b
      text: { en: "Enable Private Google Access on lab-subnet so that the VMs can reach Google APIs with their internal IP addresses." }
    - id: c
      text: { en: "Configure private services access on the VPC network by allocating an IP range and creating a private connection." }
    - id: d
      text: { en: "Assign ephemeral external IP addresses to the VMs and allow egress only to Google API ranges with firewall rules." }
answer: { optionId: b }
explanation:
  correct:
    en: Private Google Access is enabled per subnet and lets VMs that have only internal IP addresses reach Google APIs and services such as Cloud Storage and BigQuery. It gives no access to other internet destinations, which matches the policy.
  options:
    a: { en: "Cloud NAT gives the VMs outbound access to the internet in general, which the policy forbids." }
    c: { en: "Private services access connects to services published in Google-managed producer networks, such as Cloud SQL private IP, not to Google APIs like Cloud Storage and BigQuery." }
    d: { en: "External IP addresses on the VMs are explicitly forbidden by the policy." }
references:
  - title: Private Google Access
    url: https://docs.cloud.google.com/vpc/docs/private-google-access
