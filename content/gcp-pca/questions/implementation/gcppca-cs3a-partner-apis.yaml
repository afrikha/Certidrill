id: gcppca-cs3a-partner-apis
objective: "5.1.2"
type: single
caseStudy: gcppca-cs3a-tidemark-logistics
difficulty: 2
status: draft
stem:
  en: |
    You are advising the integration team on the platform for the partner API program. The solution must meet the business requirements for the partner API program and the technical requirement for the APIs.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Deploy the APIs behind API Gateway, create an API key for each partner on request, and set the call limits of each tier in the API configuration." } }
    - { id: b, text: { en: "Deploy the APIs behind Apigee, bundle them in a Basic and a Premium API product with different quotas, publish the products in a developer portal, and attach a rate plan to the Premium product." } }
    - { id: c, text: { en: "Deploy the APIs behind a global external Application Load Balancer, add Cloud Armor rate limiting keyed on the API key header, and build usage reports from the load balancer logs." } }
    - { id: d, text: { en: "Deploy the APIs on Cloud Run, require IAM authentication, grant each partner's service account the Cloud Run Invoker role, and set a maximum number of instances for each tier." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Apigee bundles API proxies into API products whose quotas differ by tier. Partner developers register in the developer portal, create apps and receive keys for the products without contacting Tidemark. Apigee monetization charges developers through a rate plan attached to the Premium product, and Apigee analytics reports the traffic of each developer app.
  options:
    a:
      en: API Gateway authenticates calls with API keys, but it offers no self-service developer portal and no monetization, so Tidemark would create keys by hand and could not bill Premium partners per call.
    c:
      en: A load balancer with Cloud Armor can limit request rates, but it provides no partner registration, no key issuance, no tiers and no billing.
    d:
      en: Granting IAM roles to partner service accounts requires Tidemark to onboard each partner, and a maximum number of instances limits capacity for everyone, not the call quota of a tier.
references:
  - title: Introduction to API products
    url: https://docs.cloud.google.com/apigee/docs/api-platform/publish/what-api-product
  - title: Overview of Apigee monetization
    url: https://docs.cloud.google.com/apigee/docs/api-platform/monetization/overview
