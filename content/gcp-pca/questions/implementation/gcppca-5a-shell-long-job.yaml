id: gcppca-5a-shell-long-job
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer starts a script in Cloud Shell that copies and transforms files between Cloud Storage buckets for about three hours. The engineer then works in other applications. Each time, the script stops after less than an hour, before it finishes. The script must run to completion with no one watching it.

    What should you do?
body:
  options:
  - id: a
    text:
      en: Run the script as a Cloud Run job, or on a Compute Engine VM, instead of in Cloud Shell.
  - id: b
    text:
      en: Start the script with `nohup` in Cloud Shell so that it keeps running after the terminal tab is closed.
  - id: c
    text:
      en: Move the script and its working files into `$HOME` so that Cloud Shell keeps them across sessions.
  - id: d
    text:
      en: Open Cloud Shell through an Open in Cloud Shell link with `ephemeral=true` for the script's session.
answer:
  optionId: a
explanation:
  correct:
    en: |
      Cloud Shell is meant for interactive use: non-interactive sessions are ended after 40 minutes, and the VM is terminated after 40 minutes of inactivity. A job that must run unattended for hours belongs on a compute service such as a Cloud Run job or a Compute Engine VM.
  options:
    b:
      en: '`nohup` does not keep the Cloud Shell VM alive; when the inactive session ends, the VM and its processes are discarded.'
    c:
      en: Files in `$HOME` persist, but running processes do not; the VM still terminates during the script.
    d:
      en: Ephemeral mode only removes the persistent home directory; the session limits are the same.
references:
- title: Cloud Shell Quotas and limits
  url: https://docs.cloud.google.com/shell/docs/limitations
