id: gcppca-5b-spanner-emulator-limits
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company runs its integration tests against the Spanner emulator in a Docker container on the CI runners, which keeps the tests fast and free of cloud charges. The database team now wants two new CI checks before each release: verify the query execution plans of the ten most frequent queries after schema changes, and measure the latency of concurrent read-write transactions.

    You need these checks to give results that are representative of production, while keeping the existing tests on the emulator. What should you do?
body:
  options:
    - id: a
      text: { en: "Run the two new checks in the emulator with the query mode set to PROFILE and with more CPU and memory given to the container." }
    - id: b
      text: { en: "Start the emulator with the gcloud emulators spanner start command instead of Docker so that it uses the production query optimizer." }
    - id: c
      text: { en: "Run the two new checks against a small Spanner instance in a dedicated test project, and keep the other tests on the emulator." }
    - id: d
      text: { en: "Deploy the emulator container to Cloud Run so that the two new checks run on Google Cloud infrastructure instead of the CI runners." }
answer: { optionId: c }
explanation:
  correct:
    en: The Spanner emulator returns empty query plans in PLAN and PROFILE modes, does not match production performance, and locks the whole database during read-write transactions. Plan and concurrency checks therefore need a real Spanner instance, here a small one in a test project, while functional tests stay on the free emulator.
  options:
    a: { en: "The emulator returns an empty plan in PROFILE mode, and more resources do not make its locking or performance behave like production." }
    b: { en: "The gcloud command and the Docker image start the same emulator; neither uses the production optimizer or gives representative plans." }
    d: { en: "Hosting the emulator elsewhere does not change its behavior: plans stay empty and transactions still lock the whole database." }
references:
  - title: Emulate Spanner locally
    url: https://docs.cloud.google.com/spanner/docs/emulator
