id: gcppca-5a-gca-user-roles
objective: "5.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team has enabled the Gemini Cloud Assist API and its required APIs in the project `ops-prod`. The members of the group `sre-team` already have the roles that they need to view the project's resources. You must let them use Gemini Cloud Assist in `ops-prod` while following the principle of least privilege.

    Which roles should you grant to `sre-team` on the project?
body:
  options:
  - id: a
    text:
      en: Writer (`roles/writer`), which covers every service that the group might ask Gemini Cloud Assist about
  - id: b
    text:
      en: Agent Platform User (`roles/aiplatform.user`) and Logs Viewer (`roles/logging.viewer`)
  - id: c
    text:
      en: Gemini Cloud Assist User (`roles/geminicloudassist.user`) and Cloud Asset Viewer (`roles/cloudasset.viewer`)
  - id: d
    text:
      en: Project IAM Admin (`roles/resourcemanager.projectIamAdmin`) and Service Usage Admin (`roles/serviceusage.serviceUsageAdmin`)
answer:
  optionId: c
explanation:
  correct:
    en: |
      Google's setup guide asks you to grant each principal the Gemini Cloud Assist User role and the Cloud Asset Viewer role on the project (or folder). Cloud Asset Viewer lets Gemini Cloud Assist see the resources the user asks about; other roles are needed only for products the user cannot already access. Gemini Cloud Assist is a Preview offering.
  options:
    a:
      en: Writer is a broad basic role that grants far more than using Gemini Cloud Assist requires.
    b:
      en: Agent Platform User (formerly Vertex AI User) is for Gemini Enterprise Agent Platform resources; neither role grants access to Gemini Cloud Assist.
    d:
      en: These roles manage IAM policies and service enablement, which is administration, not use of Gemini Cloud Assist.
references:
- title: Set up Gemini Cloud Assist
  url: https://docs.cloud.google.com/cloud-assist/set-up-gemini
