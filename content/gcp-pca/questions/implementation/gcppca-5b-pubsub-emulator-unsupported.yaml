id: gcppca-5b-pubsub-emulator-unsupported
objective: "5.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A travel company plans to move the tests of its event pipeline from a shared Google Cloud test project to the Pub/Sub emulator running on each developer laptop. The test suite contains the tests listed below.

    Which two tests will not behave as they do against the Pub/Sub service and must stay in the test project? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "A test that publishes 500 messages with attributes and checks that a streaming pull subscriber receives all of them." }
    - id: b
      text: { en: "A test that checks that a service account without the Pub/Sub Subscriber role is denied when it pulls from a subscription." }
    - id: c
      text: { en: "A test that creates a topic and a subscription, then publishes a message and acknowledges it from a pull subscriber." }
    - id: d
      text: { en: "A test that checks that messages delivered through a BigQuery subscription appear as rows in a BigQuery table." }
    - id: e
      text: { en: "A test that uses the Pub/Sub Cloud Client Library for Python with the PUBSUB_EMULATOR_HOST variable set." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: The Pub/Sub emulator does not support IAM operations, so permission checks cannot be tested on it. BigQuery subscriptions can be created in the emulator but do not send messages to BigQuery. Both tests must keep running against the real service in the test project.
  options:
    a: { en: "Publishing messages with attributes and receiving them with a streaming pull subscriber is core functionality that the emulator supports." }
    c: { en: "Creating topics and subscriptions, publishing, pulling and acknowledging messages all work in the emulator." }
    e: { en: "The client libraries are designed to work with the emulator when PUBSUB_EMULATOR_HOST is set; this is the normal way to use it." }
references:
  - title: Testing apps locally with the emulator
    url: https://docs.cloud.google.com/pubsub/docs/emulator
