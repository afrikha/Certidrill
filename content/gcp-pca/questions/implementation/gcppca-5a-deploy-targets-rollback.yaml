id: gcppca-5a-deploy-targets-rollback
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company deploys its matchmaking service to GKE with a Cloud Deploy delivery pipeline named `match-pipeline`. The rollout of release `rel-118` to the `prod` target failed at its verification step after the new Pods started, and the service now returns timeouts. Release `rel-117` is the last release with a successful rollout to `prod`. The team must return `prod` to the previous release quickly, and Cloud Deploy must keep showing which release runs on each target.

    What should you do?
body:
  options:
  - id: a
    text:
      en: Run `gcloud deploy targets rollback prod --delivery-pipeline=match-pipeline`.
  - id: b
    text:
      en: Run `kubectl rollout undo` on the matchmaking Deployment in the production cluster.
  - id: c
    text:
      en: Run `gcloud deploy releases abandon rel-118 --delivery-pipeline=match-pipeline`.
  - id: d
    text:
      en: Rebuild the image from the commit of `rel-117`, and create a new release from it.
answer:
  optionId: a
explanation:
  correct:
    en: |
      `gcloud deploy targets rollback` creates a new rollout on the target from a previous release; by default it uses the last release that had a successful rollout to that target, here `rel-117`, because the rollout of `rel-118` failed. Because the rollback is a Cloud Deploy rollout, the pipeline keeps an accurate record of what runs on `prod`.
  options:
    b:
      en: Undoing the rollout directly in the cluster bypasses Cloud Deploy, which would still report `rel-118` on `prod`.
    c:
      en: Abandoning a release prevents it from being promoted further, but it does not change what is deployed on `prod`.
    d:
      en: Rebuilding and creating a new release takes much longer than redeploying the existing release `rel-117`.
references:
- title: Roll back a target
  url: https://docs.cloud.google.com/deploy/docs/roll-back
