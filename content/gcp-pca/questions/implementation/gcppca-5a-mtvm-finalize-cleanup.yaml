id: gcppca-5a-mtvm-finalize-cleanup
objective: "5.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A university migrated 20 VMware VMs to Compute Engine with Migrate to Virtual Machines. During testing, the team created several test-clone instances. The cut-over of every VM succeeded, and the new production instances run correctly. The team now wants to stop paying for the replication storage and remove every resource that is no longer needed, while keeping the production instances.

    What should you do? Choose two.
body:
  choose: 2
  options:
  - id: a
    text:
      en: Finalize the migration of each VM to delete its replication data and associated storage resources.
  - id: b
    text:
      en: Pause replication for each migrated VM, and keep the replicated disks as a fallback.
  - id: c
    text:
      en: Delete the test-clone Compute Engine instances, because finalizing does not delete them.
  - id: d
    text:
      en: Run a new test-clone for each VM so that the replication data is merged into the instances.
  - id: e
    text:
      en: Delete the production instances and run cut-over again so that the migration ends cleanly.
answer:
  optionIds:
  - a
  - c
explanation:
  correct:
    en: |
      Finalize is the last step after a successful cut-over: it deletes all replication data and the other storage resources of the migrated VM. Finalize does not delete Compute Engine instances that run a migrated VM, so test-clone instances must be deleted separately.
  options:
    b:
      en: Keeping replicated disks keeps paying for the storage that the team wants to remove.
    d:
      en: A test-clone creates another instance from the replication data; it merges nothing and adds cost.
    e:
      en: The production instances must be kept, and a second cut-over is unnecessary after a successful one.
references:
- title: VM migration process
  url: https://docs.cloud.google.com/migrate/virtual-machines/docs/5.0/discover/lifecycle
