id: gcppca-5b-terraform-remote-state
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Six engineers at a healthcare analytics company run Terraform from their workstations against the same Google Cloud projects. Each engineer keeps a local terraform.tfstate file. Last week two engineers applied changes at the same time and one state file was lost, which left resources unmanaged.

    You need a shared state that prevents concurrent runs from overwriting each other, keeps a history of previous state versions, and keeps state out of version control. What should you do?
body:
  options:
    - id: a
      text: { en: "Commit terraform.tfstate to the Git repository of the configuration and require engineers to pull before each run." }
    - id: b
      text: { en: "Store terraform.tfstate on a Filestore share that every workstation mounts, and use the local backend pointing at that share." }
    - id: c
      text: { en: "Store terraform.tfstate as a secret in Secret Manager and have each engineer download the latest version before running Terraform." }
    - id: d
      text: { en: "Configure the gcs backend with a Cloud Storage bucket that has Object Versioning enabled and access limited to the engineers and the build system." }
answer: { optionId: d }
explanation:
  correct:
    en: Google recommends remote state in a Cloud Storage bucket. The gcs backend supports state locking, so concurrent runs cannot overwrite each other; Object Versioning keeps previous state versions, and restricting bucket access keeps sensitive state out of version control.
  options:
    a: { en: "State in Git exposes sensitive values in version control and gives no locking, so simultaneous runs can still conflict." }
    b: { en: "A shared file system with the local backend gives no Terraform state locking and no version history, and Google's guidance is to use a remote Cloud Storage backend." }
    c: { en: "Secret Manager is not a Terraform backend: manual downloads give no locking, and engineers can still overwrite each other's changes." }
references:
  - title: Best practices for security
    url: https://docs.cloud.google.com/docs/terraform/best-practices/security
  - title: Store Terraform state in a Cloud Storage bucket
    url: https://docs.cloud.google.com/docs/terraform/resource-management/store-state
