id: gcppca-5b-attached-service-account
objective: "5.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A market research company runs a reporting application on Compute Engine instances that loads results into BigQuery with the Cloud Client Library for Python. A service account key file is baked into the instance image and referenced by the GOOGLE_APPLICATION_CREDENTIALS variable. The security team wants to remove all service account keys and keep the application's access limited to the BigQuery permissions it needs.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Store the key file in Secret Manager, have the startup script download it at boot, and keep the GOOGLE_APPLICATION_CREDENTIALS variable." }
    - id: b
      text: { en: "Remove the key and the variable, and let the instances use the Compute Engine default service account with its default Editor role." }
    - id: c
      text: { en: "Remove the key and the variable, and attach a user-managed service account with only the required BigQuery roles to the instances." }
    - id: d
      text: { en: "Remove the key and the variable, and create an API key restricted to the BigQuery API for the application to send with its requests." }
answer: { optionId: c }
explanation:
  correct:
    en: Attaching a user-managed service account to the resource and using Application Default Credentials is Google's recommended way to authenticate production code on Google Cloud. Once the variable is removed, ADC obtains short-lived tokens for the attached service account from the metadata server, with no key to manage, and the account holds only the roles the application needs.
  options:
    a: { en: "The key still exists and is still a long-lived credential; moving it to Secret Manager does not meet the requirement to remove keys." }
    b: { en: "Google does not recommend the default service account because it is highly privileged by default; Editor, a legacy basic role, is far more than BigQuery access." }
    d: { en: "A standard API key does not identify a principal, so IAM cannot grant it BigQuery permissions; it is not a replacement for a service account." }
references:
  - title: Authentication for Google Cloud APIs and services
    url: https://docs.cloud.google.com/docs/authentication
  - title: How Application Default Credentials works
    url: https://docs.cloud.google.com/docs/authentication/application-default-credentials
