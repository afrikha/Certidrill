id: gcppca-1c-ip-plan-overlap
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank plans to connect its data centers to Google Cloud with Cloud Interconnect and to exchange routes through Cloud Router. On premises, it uses the entire 10.0.0.0/8 range for internal networks. It is now creating the first VPC network for migrated workloads.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create an auto mode VPC network and keep the subnet ranges that it creates by default" }
    - id: b
      text: { en: "Create an auto mode VPC network and convert it to custom mode once Interconnect is ready" }
    - id: c
      text: { en: "Create a custom mode VPC network with subnets in 172.16.0.0/12 ranges unused on premises" }
    - id: d
      text: { en: "Create a custom mode VPC network with subnets in 10.0.0.0/8 and let Cloud Router choose routes" }
answer: { optionId: c }
explanation:
  correct:
    en: For hybrid connectivity, the subnet ranges in Google Cloud must not overlap the on-premises ranges, otherwise routes conflict and some hosts become unreachable. A custom mode VPC network lets you choose ranges that fit the bank's IP address plan, which Google recommends for enterprises from the start.
  options:
    a: { en: "Auto mode subnets use predefined ranges inside 10.128.0.0/9, which overlap the on-premises 10.0.0.0/8 networks." }
    b: { en: "Converting to custom mode keeps the existing auto mode subnets and their 10.128.0.0/9 ranges, so the overlap remains." }
    d: { en: "Overlapping ranges cannot be fixed by route selection: hosts with the same addresses on both sides cannot reach each other reliably." }
references:
  - title: Best practices and reference architectures for VPC design
    url: https://docs.cloud.google.com/architecture/best-practices-vpc-design
