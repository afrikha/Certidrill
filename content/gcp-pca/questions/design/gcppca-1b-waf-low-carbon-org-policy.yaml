id: gcppca-1b-waf-low-carbon-org-policy
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A US logistics company applies the sustainability pillar of the Google Cloud Well-Architected Framework to a new analytics platform. The only location requirement is that data stays in the United States. The company wants to guarantee that teams can create resources only in US locations that Google identifies as low-carbon, in every project of the organization.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Ask each team to check the Low CO2 indicator in the console location selector before it creates resources.
    - id: b
      text:
        en: |-
          Use the Google Cloud Region Picker to choose one low-carbon region, and document that region in the project templates.
    - id: c
      text:
        en: |-
          Set the resource locations organization policy constraint on the organization node with the in:us-low-carbon-locations value group.
    - id: d
      text:
        en: |-
          Deploy every resource to the US multi-region so that Google places the data in the region with the most carbon-free energy.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The sustainability pillar recommends enforcing location limits with the resource locations organization policy constraint, and the in:us-low-carbon-locations value group restricts resource creation to US low-carbon locations. Set on the organization node, the policy is inherited by every folder and project, so it is enforced rather than advised.
  options:
    a:
      en: |-
        The Low CO2 indicator helps people choose a region, but nothing prevents a team from ignoring it.
    b:
      en: |-
        The Region Picker helps compare regions, and a documented choice in templates is a convention, not an enforced control.
    d:
      en: |-
        A multi-region location is not selected by carbon-free energy, and it does not restrict where teams create other resources.
references:
  - title: "Use regions that consume low-carbon energy"
    url: https://docs.cloud.google.com/architecture/framework/sustainability/low-carbon-regions
