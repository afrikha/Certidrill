id: gcppca-1a-rolling-slo-window
objective: "1.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A streaming company measures the success of its platform with an availability SLO in Cloud Monitoring, and it freezes risky releases while the error budget is exhausted. The SLO uses a calendar-month compliance period, so a major incident on the 30th of a month no longer blocks releases on the 1st of the next month. The product owner wants the release decision to always reflect the last 30 days of service behavior.

    What should you change?
body:
  options:
    - id: a
      text:
        en: |-
          Lower the SLO goal so that the error budget for each month is larger.
    - id: b
      text:
        en: |-
          Change the SLI from request-based to windows-based evaluation.
    - id: c
      text:
        en: |-
          Change the compliance period to a rolling period of 30 days.
    - id: d
      text:
        en: |-
          Change the compliance period to a calendar week.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A calendar-based compliance period resets at fixed boundaries, so the budget consumed on the 30th disappears on the 1st. A rolling period measures the last n days, from 1 to 30, at any moment, so the incident keeps counting against the budget until it is 30 days old.
  options:
    a:
      en: |-
        A lower goal changes how much failure is tolerated, not when the measurement resets, so the incident would still stop counting on the 1st.
    b:
      en: |-
        Windows-based or request-based evaluation changes how good and bad service is counted; it doesn't change the compliance period.
    d:
      en: |-
        A calendar week also resets at a fixed boundary, and more often, which makes the problem worse.
references:
  - title: "Concepts in service monitoring | Google Cloud Observability | Google Cloud Documentation"
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/slo-monitoring
