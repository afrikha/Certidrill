id: gcppca-1b-global-alb-multi-region-failover
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A travel company serves its booking API from VMs in us-central1. The API must keep serving if the whole region becomes unavailable, with automatic failover to us-east1. Clients must keep using the same IP address, and failover must not depend on DNS changes propagating.

    Which actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a regional external Application Load Balancer in us-central1, and add the VMs of both regions to its backend service.
    - id: b
      text:
        en: |-
          Create a Cloud DNS failover routing policy that switches the API's record from a us-central1 load balancer to a us-east1 load balancer.
    - id: c
      text:
        en: |-
          Create managed instance groups with health checks in us-central1 and in us-east1.
    - id: d
      text:
        en: |-
          Reserve a Standard Tier external IP address in each region, and publish both addresses to the clients.
    - id: e
      text:
        en: |-
          Add both managed instance groups as backends of one backend service behind a global external Application Load Balancer with a single anycast IP address.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      A global external Application Load Balancer exposes one anycast IP address and sends each request to a healthy backend, so when the us-central1 group fails its health checks, traffic goes to the us-east1 group automatically. Managed instance groups with health checks in both regions provide the capacity that the load balancer fails over to.
  options:
    a:
      en: |-
        A regional load balancer serves backends in its own region and depends on that region, so it cannot fail over to us-east1.
    b:
      en: |-
        DNS-based failover depends on record caching and gives clients a different IP address, which the requirements exclude.
    d:
      en: |-
        Standard Tier supports only regional load balancing, and clients would have to switch between two addresses.
references:
  - title: "Request distribution for external Application Load Balancers"
    url: https://docs.cloud.google.com/load-balancing/docs/https/request-distribution
  - title: "Network Service Tiers overview"
    url: https://docs.cloud.google.com/network-tiers/docs/overview
