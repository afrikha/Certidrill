id: gcppca-1a-mysql-requirements-cloud-sql
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is moving an internal inventory application that uses a 3 TB MySQL 8.0 database. The requirements are: no change to the application's MySQL code, automatic failover if a zone fails, backups and patching handled by the provider, and the lowest cost that meets these requirements. All users are in one country, and the business accepts that a regional outage is handled by restoring from backups.

    Which database should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Spanner with a regional instance configuration and the GoogleSQL dialect
    - id: b
      text:
        en: |-
          MySQL on a Compute Engine VM with a regional persistent disk and scripted backups
    - id: c
      text:
        en: |-
          Cloud SQL for MySQL with the high availability configuration enabled
    - id: d
      text:
        en: |-
          AlloyDB for PostgreSQL with a primary instance and a read pool instance
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Cloud SQL for MySQL keeps MySQL compatibility and manages backups, patching and maintenance. Its high availability configuration adds a standby in another zone of the region with automatic failover, which covers the zonal requirement without paying for cross-region capabilities that the business doesn't need.
  options:
    a:
      en: |-
        Spanner isn't MySQL: the application's SQL and data access code would have to change, and it costs more than needed for a single-region workload of this size.
    b:
      en: |-
        A self-managed VM leaves patching, backups and failover to the company, which contradicts the requirement that the provider handles them.
    d:
      en: |-
        AlloyDB is PostgreSQL-compatible, not MySQL-compatible, so the application code would have to change.
references:
  - title: "About high availability | Cloud SQL for MySQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sql/docs/mysql/high-availability
  - title: "Cloud SQL overview | Cloud SQL for MySQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sql/docs/mysql/introduction
