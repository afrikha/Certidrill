id: gcppca-1b-ha-vpn-99-99
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A company must connect an on-premises network to a VPC network over the internet with IPsec encryption within one week. The connection must qualify for a 99.99% availability SLA. The on-premises site has two VPN devices that support BGP.

    What should you configure?
body:
  options:
    - id: a
      text:
        en: |-
          A Classic VPN gateway with two tunnels that use static routes, one tunnel to each on-premises device
    - id: b
      text:
        en: |-
          An HA VPN gateway that uses only one of its interfaces, with one tunnel to each on-premises device
    - id: c
      text:
        en: |-
          Two Classic VPN gateways in different regions, each with policy-based routing to one on-premises device
    - id: d
      text:
        en: |-
          An HA VPN gateway with tunnels from both of its interfaces to the two on-premises devices, and BGP sessions on a Cloud Router
answer: { optionId: d }
explanation:
  correct:
    en: |-
      HA VPN can provide a 99.99% availability SLA when it is configured in a redundant topology: tunnels from both gateway interfaces to a redundant peer. HA VPN supports only dynamic routing, so Cloud Router exchanges routes with the on-premises devices over BGP.
  options:
    a:
      en: |-
        Classic VPN offers a 99.9% SLA, not 99.99%.
    b:
      en: |-
        Using a single interface removes the redundancy that the 99.99% SLA requires.
    c:
      en: |-
        Classic VPN gateways, even in two regions, are covered only by the 99.9% Classic VPN SLA.
references:
  - title: "Cloud VPN overview"
    url: https://docs.cloud.google.com/network-connectivity/docs/vpn/concepts/overview
