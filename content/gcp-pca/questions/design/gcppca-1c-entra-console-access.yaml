id: gcppca-1c-entra-console-access
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A consultancy manages its 2,000 employees in Microsoft Entra ID. Engineers need single sign-on to the Google Cloud console and the gcloud CLI, with access granted according to their Entra ID group membership. A company policy forbids copying user identities into another directory.

    What should you configure?
body:
  options:
    - id: a
      text: { en: "Workforce Identity Federation with a workforce identity pool and an Entra ID provider" }
    - id: b
      text: { en: "Google Cloud Directory Sync to provision users and groups into Cloud Identity, with SAML SSO" }
    - id: c
      text: { en: "Workload Identity Federation with a workload identity pool and an Entra ID OIDC provider" }
    - id: d
      text: { en: "Managed Service for Microsoft Active Directory with a trust to the company's directory" }
answer: { optionId: a }
explanation:
  correct:
    en: Workforce Identity Federation lets users of an external identity provider such as Microsoft Entra ID sign in to Google Cloud with single sign-on, without being synchronized into Cloud Identity. Allow policies can grant roles to groups or attributes mapped from Entra ID, so group membership drives access.
  options:
    b: { en: "Google Cloud Directory Sync copies users and groups into Cloud Identity, which the policy forbids." }
    c: { en: "Workload Identity Federation is for software workloads, not for people signing in to the console." }
    d: { en: "Managed Microsoft AD provides domain services for Windows workloads; it does not give users single sign-on to the Google Cloud console." }
references:
  - title: Workforce Identity Federation
    url: https://docs.cloud.google.com/iam/docs/workforce-identity-federation
