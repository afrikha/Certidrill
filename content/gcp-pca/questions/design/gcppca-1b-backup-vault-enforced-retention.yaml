id: gcppca-1b-backup-vault-enforced-retention
objective: "1.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A healthcare company backs up its Compute Engine VMs and Cloud SQL instances. After a ransomware incident at a competitor, the company requires that nobody, including project owners, can delete a backup during its first 30 days. Backups must be taken daily.

    Which actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create snapshot schedules with a 30-day retention policy, and remove the Compute Storage Admin role from the operations team.
    - id: b
      text:
        en: |-
          Enable deletion protection on the VMs and on the Cloud SQL instances.
    - id: c
      text:
        en: |-
          Create a Backup and DR backup vault with a minimum enforced retention of 30 days, and lock the setting with an effective time.
    - id: d
      text:
        en: |-
          Export the Cloud SQL databases to a Cloud Storage bucket every day, and enable Object Versioning on the bucket.
    - id: e
      text:
        en: |-
          Create a backup plan with a daily rule that keeps backups for at least 30 days, store them in the vault, and apply the plan to the VMs and Cloud SQL instances.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      A backup vault provides immutable, indelible storage: no backup can be deleted before the minimum enforced retention expires, not by users and not by Google, and after the effective time the retention can only be increased. A backup plan defines the daily schedule and a retention at least equal to the vault minimum, and it is associated with Compute Engine and Cloud SQL resources.
  options:
    a:
      en: |-
        Snapshots remain deletable by any principal with the right permissions, such as a project owner.
    b:
      en: |-
        Deletion protection prevents deleting the VMs and instances, not their backups.
    d:
      en: |-
        Object versions can still be deleted by a project owner, because versioning alone enforces no retention.
references:
  - title: "Overview of backup vaults"
    url: https://docs.cloud.google.com/backup-disaster-recovery/docs/concepts/backup-vault
  - title: "Backup plans overview"
    url: https://docs.cloud.google.com/backup-disaster-recovery/docs/concepts/backup-plan
