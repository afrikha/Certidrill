id: gcppca-1c-iac-immutable
objective: "1.5.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A logistics company is adopting a cloud-first operating model. Today, administrators create resources in the Google Cloud console and patch VMs over SSH, and the environments have drifted apart. The company wants reproducible environments, infrastructure changes that can be reviewed before they are applied, and no manual changes to running VMs.

    Which two practices should you recommend? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Record every console change in a shared runbook after it is made" } }
    - { id: b, text: { en: "Define the infrastructure as Terraform configurations deployed with Infrastructure Manager" } }
    - { id: c, text: { en: "Run a scheduled script that connects to every running VM over SSH and patches it in place" } }
    - { id: d, text: { en: "Build new VM images in Cloud Build and roll them out to managed instance groups with rolling updates" } }
    - { id: e, text: { en: "Take nightly snapshots of every VM disk to restore the last known good configuration" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Infrastructure Manager deploys Terraform configurations through a managed Cloud Build toolchain and keeps the state and revisions of each deployment, so environments are reproducible and changes can be reviewed as code. Building new images in a pipeline and replacing instances with rolling updates applies changes without touching running VMs, which removes configuration drift.
  options:
    a: { en: "Documenting changes after the fact still allows manual drift and offers no review before changes are applied." }
    c: { en: "Patching running VMs over SSH is the manual, in-place change the company wants to stop, even when it is scripted." }
    e: { en: "Snapshots are backups; they do not make environments reproducible or changes reviewable." }
references:
  - title: Infrastructure Manager overview
    url: https://docs.cloud.google.com/infrastructure-manager/docs/overview
  - title: Google Cloud Well-Architected Framework
    url: https://docs.cloud.google.com/architecture/framework
