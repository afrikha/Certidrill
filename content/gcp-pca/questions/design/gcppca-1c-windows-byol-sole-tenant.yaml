id: gcppca-1c-windows-byol-sole-tenant
objective: "1.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A manufacturer owns perpetual Windows Server Datacenter licenses without Software Assurance. It wants to use these licenses for 40 Windows Server VMs on Compute Engine instead of paying for license-included images. Its license terms are based on physical cores, so the company must keep the number of physical servers it uses low and report their usage.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Import the VM images with the BYOL option and run them on sole-tenant nodes with restart in place" }
    - id: b
      text: { en: "Use Microsoft License Mobility to run the existing licenses on multi-tenant VMs" }
    - id: c
      text: { en: "Import the VM images with the BYOL option and run them on standard multi-tenant VMs" }
    - id: d
      text: { en: "Create the VMs from Google-provided Windows Server premium images and remove the license" }
answer: { optionId: a }
explanation:
  correct:
    en: Windows Server BYOL licenses must run on sole-tenant nodes, which dedicate physical servers to the customer. For licenses counted per physical core, Google recommends a node group with the restart-in-place (or migrate-within-node-group) maintenance policy to limit the physical servers used, and provides tools to track physical core usage for reporting.
  options:
    b: { en: "License Mobility covers some server applications such as SQL Server and requires Software Assurance; it does not let Windows Server licenses run on shared hosts." }
    c: { en: "Windows Server BYOL is not allowed on multi-tenant VMs; it requires dedicated hardware such as sole-tenant nodes." }
    d: { en: "Premium images are billed with the license included and are not eligible for BYOL, so the company would pay for Windows Server again." }
references:
  - title: Bring your own licenses
    url: https://docs.cloud.google.com/compute/docs/nodes/bringing-your-own-licenses
  - title: About licenses
    url: https://docs.cloud.google.com/compute/docs/licenses/about
