id: gcppca-1a-bigquery-managed-dr
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial services company runs critical reporting in BigQuery in us-east4 on Enterprise Plus edition reservations. The business continuity plan requires that, if us-east4 suffers a total outage, reporting resumes in us-west1 within minutes, with at most about 15 minutes of data loss, and that the company can keep writing to the recovered datasets.

    What should you configure?
body:
  options:
    - id: a
      text:
        en: |-
          Cross-region dataset replication with a secondary replica in us-west1, which you promote to primary when us-east4 is unavailable
    - id: b
      text:
        en: |-
          A daily job that creates snapshots of the critical tables and copies them to a dataset located in us-west1
    - id: c
      text:
        en: |-
          Hourly exports of the tables to a dual-region Cloud Storage bucket with turbo replication, reloaded into us-west1 after an outage
    - id: d
      text:
        en: |-
          Managed disaster recovery with an Enterprise Plus failover reservation whose secondary location is us-west1, with the datasets attached
answer: { optionId: d }
explanation:
  correct:
    en: |-
      BigQuery managed disaster recovery combines cross-region dataset replication with an Enterprise Plus failover reservation. During a total regional outage, a hard failover promotes the secondary location even if the primary is offline; the documented RTO is five minutes after failover starts and the RPO aims at 15 minutes, and the promoted datasets accept writes.
  options:
    a:
      en: |-
        Cross-region dataset replication isn't intended as a disaster recovery plan for a total regional outage: the secondary replica can't be promoted while the primary region is down.
    b:
      en: |-
        Daily copies give an RPO of up to a day, far beyond 15 minutes.
    c:
      en: |-
        Hourly exports exceed the RPO, and reloading large tables after an outage takes far longer than a few minutes.
references:
  - title: "Managed disaster recovery | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/managed-disaster-recovery
  - title: "Cross-region dataset replication | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/data-replication
