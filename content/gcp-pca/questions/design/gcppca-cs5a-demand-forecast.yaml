id: gcppca-cs5a-demand-forecast
objective: "1.3.2"
type: single
caseStudy: gcppca-cs5a-brambleway-grocers
difficulty: 2
status: draft
stem:
  en: |
    You are designing the demand forecasting solution for the planners. The design must meet the business requirement about forecasts and the technical requirement for forecasting.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Export the sales history to Cloud Storage every night and run a serverless training job on Gemini Enterprise Agent Platform with GPUs that trains a forecasting model and writes its predictions back to BigQuery." } }
    - { id: b, text: { en: "Create one ARIMA_PLUS model in BigQuery ML with a column that combines product and fulfilment centre as the time series ID column, retrain it every night, and query ML.FORECAST with a 14-day horizon." } }
    - { id: c, text: { en: "Send each product's sales history to a Gemini model every night with a prompt that asks for the next 14 days of demand per fulfilment centre, and store the answers in BigQuery." } }
    - { id: d, text: { en: "Create one ARIMA_PLUS model in BigQuery ML for each product and fulfilment centre combination, with a scheduled script that runs a CREATE MODEL statement for every combination each night." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      BigQuery ML forecasts time series with SQL where the sales history already is. A single ARIMA_PLUS CREATE MODEL statement with a time series ID column fits a separate model for each series, here each product in each fulfilment centre, and ML.FORECAST returns the forecast for the chosen horizon with prediction intervals. The planners write SQL only and manage no infrastructure.
  options:
    a:
      en: A serverless training job (formerly custom training) needs machine learning engineers to build and maintain the model, and the data is moved out of BigQuery, which the technical requirements exclude.
    c:
      en: Prompting a language model for every product is not a time series model; it gives no prediction intervals, cannot be evaluated like a forecasting model, and its results are not reproducible for the planners.
    d:
      en: One CREATE MODEL statement per series means 350,000 models and statements to manage each night; the time series ID column does the same in one statement.
references:
  - title: Forecast multiple time series with an ARIMA_PLUS univariate model
    url: https://docs.cloud.google.com/bigquery/docs/arima-multiple-time-series-forecasting-tutorial
