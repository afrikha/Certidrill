id: gcppca-1c-oracle-cdc-bigquery
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank runs an Oracle database on premises that is connected to Google Cloud through Cloud Interconnect. Analysts need changes to the transactional tables to appear in BigQuery within a few minutes. The data team wants the fewest components to operate, no custom code, and the ability to control the trade-off between data freshness and BigQuery merge cost.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create a Datastream stream from Oracle to Cloud Storage, and run a Dataflow template that loads the files into BigQuery" }
    - id: b
      text: { en: "Use Database Migration Service to replicate Oracle to Cloud SQL for PostgreSQL, and query it from BigQuery with federated queries" }
    - id: c
      text: { en: "Schedule a Dataflow batch pipeline every five minutes that reads the full tables over JDBC and overwrites the BigQuery tables" }
    - id: d
      text: { en: "Create a Datastream stream from Oracle to a BigQuery destination, and tune the max_staleness option of the target tables" }
answer: { optionId: d }
explanation:
  correct:
    en: Datastream captures changes from Oracle and replicates them directly into BigQuery tables for near real-time analytics, with no pipeline to build. The `max_staleness` setting of the BigQuery tables is the documented lever between freshness and cost, because a lower value runs merge operations more often.
  options:
    a: { en: "This path works, but it adds a Cloud Storage staging area and a Dataflow job to operate, which fails the fewest-components requirement when Datastream can write to BigQuery directly." }
    b: { en: "Database Migration Service targets Cloud SQL and AlloyDB, not BigQuery; this design adds a PostgreSQL database to operate and leaves BigQuery reading through federation." }
    c: { en: "Full table reads every five minutes are not change data capture: they load the source database, cost more as tables grow, and add a custom pipeline to maintain." }
references:
  - title: BigQuery destination
    url: https://docs.cloud.google.com/datastream/docs/destination-bigquery
  - title: Datastream overview
    url: https://docs.cloud.google.com/datastream/docs/overview
