id: gcppca-1b-grounding-agent-search
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    An insurance company is building an assistant with a Gemini model that answers employees' questions about 50,000 internal policy documents, which change every week. Answers must be based on the current documents and must show which documents support them. The company wants to avoid retraining a model whenever the documents change.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Fine-tune a Gemini model on the documents every week.
    - id: b
      text:
        en: |-
          Create an Agent Search data store with the documents, ground the Gemini responses on it, and use the grounding metadata to cite the sources.
    - id: c
      text:
        en: |-
          Enable Grounding with Google Search on the Gemini requests.
    - id: d
      text:
        en: |-
          Put the full text of all the documents in the system instruction of every request.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Grounding with Agent Search connects Gemini to the company's own data stores for retrieval-augmented generation, so answers use the current documents without retraining. Grounded responses include grounding metadata, the chunks and supports that tie parts of the answer to the documents, which the assistant uses to show its sources.
  options:
    a:
      en: |-
        Weekly tuning is costly, leaves the model stale between runs, and does not provide citations to the source documents.
    c:
      en: |-
        Grounding with Google Search uses public web content, not the internal policy documents.
    d:
      en: |-
        50,000 documents do not fit in a request, and sending them with every request would be very costly.
references:
  - title: "Grounding with Agent Search"
    url: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/grounding/grounding-with-vertex-ai-search
  - title: "Grounding overview"
    url: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/grounding/overview
