id: gcppca-1a-tls-termination-in-region
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank serves an HTTPS customer portal from a Cloud Run service in europe-west3. A new compliance requirement states that customers' TLS connections must be terminated only on infrastructure located in that region, because decrypted traffic must not be processed anywhere else. The bank wants to keep a managed load balancer in front of the service, with its own certificate for the portal domain.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Use a global external Application Load Balancer with a serverless NEG for the service, and keep Cloud CDN disabled.
    - id: b
      text:
        en: |-
          Use a global external Application Load Balancer whose only backend service points to a serverless NEG in europe-west3.
    - id: c
      text:
        en: |-
          Use an external passthrough Network Load Balancer in europe-west3, with the Cloud Run service as its backend.
    - id: d
      text:
        en: |-
          Use a regional external Application Load Balancer in europe-west3, with a serverless NEG for the Cloud Run service.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A regional external Application Load Balancer runs in a single region and terminates client connections there, which is the documented choice for jurisdictional compliance requirements where traffic termination must stay in a specific region. Its serverless setup supports Cloud Run backends through a serverless NEG.
  options:
    a:
      en: |-
        A global external Application Load Balancer terminates HTTP(S) traffic on Google Front Ends close to each user, anywhere in the world, so TLS isn't guaranteed to end in europe-west3.
    b:
      en: |-
        Placing the backend in europe-west3 doesn't change where the global load balancer terminates TLS: that still happens on Google Front Ends near the users.
    c:
      en: |-
        A passthrough Network Load Balancer doesn't terminate TLS and doesn't use serverless NEGs, so it can't front a Cloud Run service.
references:
  - title: "Application Load Balancer overview | Cloud Load Balancing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/load-balancing/docs/application-load-balancer
