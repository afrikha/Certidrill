id: gcppca-1b-ncc-vpc-spokes-mesh
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    After an acquisition, a company has six VPC networks in projects that belong to two different organizations, with no overlapping subnet ranges. Every network must reach every other network over internal IP addresses. The company peered one network with the five others, but those five networks still cannot reach each other. The company wants a managed solution that scales as more networks are added.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Network Connectivity Center hub, and attach the six VPC networks to it as VPC spokes.
    - id: b
      text:
        en: |-
          Enable custom route export and import on the existing peering connections of the first network.
    - id: c
      text:
        en: |-
          Make the first network a Shared VPC network, and attach the other projects to it as service projects.
    - id: d
      text:
        en: |-
          Create HA VPN tunnels with Cloud Routers between every pair of VPC networks.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Network Connectivity Center VPC spokes exchange subnet routes through a hub, which gives full connectivity between the workloads of all spoke networks. VPC spokes can be in different projects, including projects of different organizations, and adding a network only means attaching one more spoke.
  options:
    b:
      en: |-
        VPC Network Peering is not transitive: exporting custom routes does not let two networks that are peered only with the first one reach each other.
    c:
      en: |-
        Shared VPC requires the host and service projects to be in the same organization, and it does not connect existing VPC networks.
    d:
      en: |-
        A full mesh of VPN tunnels needs 15 pairs of gateways for six networks and grows quickly, which adds operational overhead.
references:
  - title: "VPC spokes overview"
    url: https://docs.cloud.google.com/network-connectivity/docs/network-connectivity-center/concepts/vpc-spokes-overview
  - title: "VPC Network Peering"
    url: https://docs.cloud.google.com/vpc/docs/vpc-peering
