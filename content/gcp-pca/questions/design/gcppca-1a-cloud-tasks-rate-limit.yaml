id: gcppca-1a-cloud-tasks-rate-limit
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A travel platform sends booking confirmations to a partner airline's REST API. The partner's contract allows at most 50 requests per second. Some requests must be sent at a precise future time, when a fare hold expires. The booking service chooses the target endpoint of each request, and when it retries the creation of a request after a timeout, the partner must not receive the request twice.

    What should you use to dispatch these calls?
body:
  options:
    - id: a
      text:
        en: |-
          A Pub/Sub topic with a push subscription whose endpoint is the partner API, and a dead-letter topic for failures
    - id: b
      text:
        en: |-
          A Cloud Scheduler job created for each booking, with the partner API as the HTTP target of the job
    - id: c
      text:
        en: |-
          A Cloud Tasks queue with a maximum dispatch rate of 50 per second, using task schedule times and task deduplication
    - id: d
      text:
        en: |-
          An Eventarc trigger that routes each booking event from the booking service directly to the partner API
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Cloud Tasks uses explicit invocation: the publisher sets the endpoint of each task. Queues have explicit rate controls, tasks can be scheduled for delivery at a given time, and Cloud Tasks deduplicates task creation, so a retried creation doesn't produce a second call. Pub/Sub offers none of these three features.
  options:
    a:
      en: |-
        Pub/Sub uses implicit invocation and has no per-queue dispatch rate limit, no scheduled delivery and no deduplication of publishes.
    b:
      en: |-
        Cloud Scheduler is for recurring cron-style jobs; one job per booking doesn't scale, gives no global rate limit and no deduplication of retried creations.
    d:
      en: |-
        Eventarc routes events as they occur; it has no dispatch rate limit for a downstream API and no delivery at a chosen future time.
references:
  - title: "Choose Cloud Tasks or Pub/Sub | Google Cloud Documentation"
    url: https://docs.cloud.google.com/tasks/docs/comp-pub-sub
