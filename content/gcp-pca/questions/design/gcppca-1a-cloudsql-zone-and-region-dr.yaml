id: gcppca-1a-cloudsql-zone-and-region-dr
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An online travel agency runs its booking database on a standalone Cloud SQL for MySQL instance in europe-west1. The business continuity plan sets two requirements: a zone failure must be handled automatically without operator action, and the company must be able to resume operations in europe-west4 within an hour if europe-west1 becomes unavailable, losing at most a few minutes of data.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a read replica of the instance in another zone of europe-west1.
    - id: b
      text:
        en: |-
          Enable high availability so that a standby instance runs in another zone of the region.
    - id: c
      text:
        en: |-
          Take on-demand backups every 6 hours and store them in a multi-region location.
    - id: d
      text:
        en: |-
          Enable point-in-time recovery and keep the binary logs for 7 days.
    - id: e
      text:
        en: |-
          Create a cross-region read replica in europe-west4, and document how to promote it during an outage.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      The high availability configuration adds a standby in another zone and fails over automatically when the zone or the primary becomes unavailable. A cross-region read replica in europe-west4 is kept up to date asynchronously and is promoted manually for disaster recovery, so operations can resume there quickly and the data lost is limited to the replication lag at the time of the outage.
  options:
    a:
      en: |-
        A read replica doesn't take over automatically, and a replica in the same region doesn't help if europe-west1 becomes unavailable.
    c:
      en: |-
        Backups every 6 hours can lose up to 6 hours of bookings, and restoring a large database is slow; it provides no automatic zonal failover either.
    d:
      en: |-
        Point-in-time recovery restores data to a new instance after a logical error; it is neither an automatic zonal failover nor a ready copy in europe-west4.
references:
  - title: "About high availability | Cloud SQL for MySQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sql/docs/mysql/high-availability
  - title: "Promote replicas for regional migration or disaster recovery | Cloud SQL for MySQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sql/docs/mysql/replication/cross-region-replicas
