id: gcppca-cs5b-billing-database
objective: "1.4.4"
type: single
caseStudy: gcppca-cs5b-corvane-telecom
difficulty: 3
status: draft
stem:
  en: |
    You are planning the migration of the billing database. The plan must meet the business requirements about the billing system, the Oracle licenses and invoicing, and the technical requirement for the billing database.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Install Oracle Database 19c on Compute Engine VMs in the primary region, bring the existing licenses, and migrate the data with Oracle Data Guard." } }
    - { id: b, text: { en: "Migrate the database to AlloyDB for PostgreSQL in the primary region with Database Migration Service, and convert the PL/SQL code with the conversion workspace." } }
    - { id: c, text: { en: "Deploy Exadata Database Service in Oracle Database@Google Cloud in the primary region, order it through Cloud Marketplace, choose the bring-your-own-license type for the VM cluster, and run RAC on it." } }
    - { id: d, text: { en: "Deploy Exadata Database Service in Oracle Database@Google Cloud in the primary region, order it through Cloud Marketplace, choose the license-included type for the VM cluster, and run RAC on it." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Oracle Database@Google Cloud runs Exadata infrastructure, set up and managed by Oracle, in a Google Cloud region, so the billing database keeps RAC and Exadata next to the billing VMs on Compute Engine with no code change. It is ordered through Cloud Marketplace and billed as line items of the Google Cloud invoice. The license type is chosen when the Exadata VM cluster is created, and bring your own license (BYOL) reuses the licenses Corvane already pays support for.
  options:
    a:
      en: Self-managed Oracle on Compute Engine VMs is the option when RAC is not needed; the technical requirements keep the database on RAC and Exadata.
    b:
      en: Moving to AlloyDB means converting and testing the PL/SQL billing logic, which breaks the requirement to move billing without rewriting it, and it abandons the Oracle licenses.
    d:
      en: The license-included type pays again for Oracle licenses that Corvane already owns, which fails the business requirement to reuse them.
references:
  - title: Enterprise application on Compute Engine with Oracle Exadata
    url: https://docs.cloud.google.com/architecture/enterprise-app-oracle-exadata-database-compute-engine
  - title: Purchase and billing
    url: https://docs.cloud.google.com/oracle/database/docs/purchase-and-billing
