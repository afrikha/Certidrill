id: gcppca-1c-gpu-transcoding
objective: "1.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A video platform is moving live-stream transcoding and the serving of small vision models to Compute Engine. The workload needs NVIDIA GPUs. Finance wants the most cost-effective GPU machine series that Google recommends for video transcoding and inference, not a series aimed at training large models.

    Which machine series should you choose?
body:
  options:
    - id: a
      text: { en: "A3 High, with NVIDIA H100 GPUs" }
    - id: b
      text: { en: "H3, from the compute-optimized family" }
    - id: c
      text: { en: "G2, with NVIDIA L4 GPUs" }
    - id: d
      text: { en: "M3, from the memory-optimized family" }
answer: { optionId: c }
explanation:
  correct:
    en: The G2 series, from the accelerator-optimized family, comes with NVIDIA L4 GPUs. Google lists it for video transcoding, inference and graphics workloads, at a lower cost than the H100-based series designed for large-scale training and serving.
  options:
    a: { en: "A3 High VMs carry H100 GPUs sized for large models and high-throughput training or serving, which is far more expensive than this profile needs." }
    b: { en: "H3 VMs are CPU-based machines for HPC; they come with no GPUs." }
    d: { en: "M3 VMs provide large amounts of memory for memory-intensive workloads such as in-memory databases; they come with no GPUs." }
references:
  - title: GPU machines in accelerator-optimized machine family
    url: https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines
