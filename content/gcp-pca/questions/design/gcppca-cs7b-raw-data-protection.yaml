id: gcppca-cs7b-raw-data-protection
objective: "1.2.7"
type: multi
caseStudy: gcppca-cs7b-veldhaven-genomics
difficulty: 3
status: draft
stem:
  en: |
    You are designing the Cloud Storage buckets for raw sequencing files. The design must meet the technical requirements for raw files and the business requirements for consent withdrawal and data location.

    Which two actions should you take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create the buckets in the EUR4 dual-region, and enable turbo replication." } }
    - { id: b, text: { en: "Create the buckets in the EU multi-region, and keep the default replication." } }
    - { id: c, text: { en: "Set a 10-year retention policy on the buckets, and lock it with Bucket Lock." } }
    - { id: d, text: { en: "Set the soft delete retention duration of the buckets to 30 days." } }
    - { id: e, text: { en: "Enable Object Versioning, and delete noncurrent versions after 30 days with a lifecycle rule." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      EUR4 pairs the Netherlands (europe-west4) and Finland (europe-north1), so the data stays in the EU, and turbo replication is designed to copy every new object to both regions within a 15-minute RPO; it is available for dual-regions only. Soft delete keeps deleted and overwritten objects, and deleted buckets, recoverable for the retention duration, which can be set from 3 to 90 days. When a participant withdraws consent, a deleted raw file is permanently removed once its 30 days of soft delete end, well within 60 days.
  options:
    b:
      en: Default replication has an RPO of 12 hours, even though most objects replicate within an hour, so a regional outage could lose files written more than 15 minutes earlier.
    c:
      en: A locked retention policy prevents anyone from deleting a file for 10 years, so the files of a participant who withdraws consent could not be deleted within 60 days.
    e:
      en: Noncurrent versions protect deleted and overwritten objects inside the bucket, but they do not survive the deletion of the bucket; with the default soft delete duration of 7 days, a deleted bucket would be recoverable for 7 days only, not 30.
references:
  - title: Soft delete overview
    url: https://docs.cloud.google.com/storage/docs/soft-delete
  - title: Data availability and durability
    url: https://docs.cloud.google.com/storage/docs/availability-durability
