id: gcppca-1c-hadoop-jobs-minimal-change
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retailer runs 300 Apache Hive and Apache Spark jobs every night on an on-premises Hadoop cluster that sits idle for 18 hours a day. The jobs read and write Parquet files stored in HDFS. The company wants to move the jobs to Google Cloud with minimal code changes and stop paying for idle compute capacity.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Rewrite the jobs as Apache Beam pipelines and run them each night on Dataflow in batch mode with autoscaling" }
    - id: b
      text: { en: "Convert the Hive and Spark logic to BigQuery SQL and run it each night as BigQuery scheduled queries" }
    - id: c
      text: { en: "Keep the data in Cloud Storage and run the jobs on Managed Service for Apache Spark clusters created per nightly run" }
    - id: d
      text: { en: "Install Hadoop on a Compute Engine managed instance group and keep the data in HDFS on Persistent Disk volumes" }
answer: { optionId: c }
explanation:
  correct:
    en: Managed Service for Apache Spark (formerly Dataproc) runs the open source Spark and Hadoop ecosystem, so existing Hive and Spark jobs move with minimal code changes. Keeping the data in Cloud Storage instead of HDFS separates storage from compute, so a cluster can be created for the nightly run and deleted when the jobs finish, and the company pays only while the jobs run.
  options:
    a: { en: "Rewriting 300 jobs as Apache Beam pipelines is a large code change, which fails the minimal-change requirement." }
    b: { en: "Translating Hive and Spark logic into BigQuery SQL is a rewrite of every job, which fails the minimal-change requirement." }
    d: { en: "A self-managed Hadoop cluster keeps the operational burden, and HDFS on Persistent Disk ties the data to VMs that must keep running, so the company still pays for idle capacity." }
references:
  - title: Compare Managed Service for Apache Spark serverless and cluster deployments
    url: https://docs.cloud.google.com/managed-spark/docs/concepts/overview
