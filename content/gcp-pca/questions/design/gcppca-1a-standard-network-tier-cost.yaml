id: gcppca-1a-standard-network-tier-cost
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A regional newspaper serves its website from Compute Engine VMs in europe-west9 behind a load balancer. Almost all readers are in France, the site has no caching requirement, and the finance team wants to reduce the cost of internet data transfer. The newspaper accepts that traffic may travel over ISP networks for a longer part of its path than today.

    Which design should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          A global external Application Load Balancer on Premium Tier, with Cloud CDN enabled on the backend service
    - id: b
      text:
        en: |-
          A global external Application Load Balancer on Premium Tier, with the VMs in a regional managed instance group
    - id: c
      text:
        en: |-
          A global external Application Load Balancer with a Standard Tier IP address and the VMs as its backends
    - id: d
      text:
        en: |-
          A regional external Application Load Balancer in europe-west9, with a Standard Tier IP address
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Standard Tier is priced lower than Premium Tier: traffic uses Google's network only up to a peering point near the region and then ISP or transit networks, which the newspaper accepts. Standard Tier is regional, so it works with a regional external Application Load Balancer, which suits an audience concentrated near one region.
  options:
    a:
      en: |-
        Premium Tier is the more expensive tier, and Cloud CDN always uses Premium Tier, so this keeps or increases the data transfer cost without a caching need.
    b:
      en: |-
        Changing the instance group doesn't change the network tier, so the data transfer price stays the same.
    c:
      en: |-
        The global external Application Load Balancer requires Premium Tier; Standard Tier doesn't support it.
references:
  - title: "Network Service Tiers overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-tiers/docs/overview
