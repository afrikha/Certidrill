id: gcppca-cs2c-instrument-transfer
objective: "1.1.7"
type: single
caseStudy: gcppca-cs2c-quillon
difficulty: 1
status: draft
stem:
  en: |
    You need to plan how Quillon moves its 250-TB image archive from the NAS to Cloud Storage. The plan must meet the business requirement about the image archive and respect the constraints of the laboratory's network.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Install Storage Transfer Service agents on servers in the laboratory and run a transfer job from the NAS to Cloud Storage with a bandwidth limit of 300 Mbps." }
    - id: b
      text: { en: "Order a Transfer Appliance, copy the archive from the NAS to the appliance in the laboratory, and ship it back to Google for upload to Cloud Storage." }
    - id: c
      text: { en: "Run gcloud storage rsync with parallel composite uploads from a server in the laboratory to the bucket, throttled to 300 Mbps during working hours." }
    - id: d
      text: { en: "Order a Dedicated Interconnect connection for the laboratory, and run a Storage Transfer Service job from the NAS to Cloud Storage over that connection." }
answer: { optionId: b }
explanation:
  correct:
    en: "At 300 Mbps, 250 TB takes about 77 days to upload (2,000,000 Gb ÷ 0.3 Gbps ≈ 6.7 million seconds), far beyond six weeks. Google recommends Transfer Appliance when an online transfer would take more than a week; a single TA300 holds up to 300 TB, and the data is uploaded to the Cloud Storage bucket after the appliance is returned."
  options:
    a: { en: "Storage Transfer Service is still limited by the 300 Mbps the laboratory can spare, so the transfer would take about 77 days." }
    c: { en: "Any online tool is bounded by the same 300 Mbps, and throttling to working hours only makes the transfer longer than 77 days." }
    d: { en: "Dedicated Interconnect requires a presence in a colocation facility, which Quillon does not have, and the laboratory link will not be upgraded." }
references:
  - title: Transfer Appliance
    url: https://docs.cloud.google.com/transfer-appliance/docs/4.0/overview
  - title: Specifications
    url: https://docs.cloud.google.com/transfer-appliance/docs/4.0/specifications
