id: gcppca-1b-waf-graceful-degradation
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    An online retailer's product page calls a recommendation service. When the recommendation service fails, the whole product page returns an error. An architect proposes that the page keep showing products and prices and simply hide the recommendations while the recommendation service is failing.

    Which Google Cloud Well-Architected Framework principle does this proposal apply?
body:
  options:
    - id: a
      text:
        en: |-
          Design for graceful degradation, from the reliability pillar
    - id: b
      text:
        en: |-
          Take advantage of elasticity, from the performance optimization pillar
    - id: c
      text:
        en: |-
          Build high availability through redundancy, from the reliability pillar
    - id: d
      text:
        en: |-
          Manage incidents and problems, from the operational excellence pillar
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Graceful degradation means that a system under stress or partial failure keeps providing reduced but useful functions instead of failing completely. Showing products and prices without recommendations is exactly that: the page loses a non-essential feature but stays usable.
  options:
    b:
      en: |-
        Elasticity scales resources up and down with demand; it does not keep the page working when a dependency fails.
    c:
      en: |-
        Redundancy duplicates resources so that one failed component does not stop the service; the proposal does not add instances, it accepts reduced function.
    d:
      en: |-
        Incident and problem management covers response procedures and retrospectives; the proposal is a design choice in the application itself.
references:
  - title: "Well-Architected Framework: Reliability pillar"
    url: https://docs.cloud.google.com/architecture/framework/reliability
