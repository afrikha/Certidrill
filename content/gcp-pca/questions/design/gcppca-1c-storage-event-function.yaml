id: gcppca-1c-storage-event-function
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A real estate portal stores listing photos in a Cloud Storage bucket. Each time a photo is uploaded, a 40-line Python routine must create a thumbnail within a few seconds. Uploads arrive irregularly. The team wants to deploy only the source code, without building container images, and it does not want to poll the bucket.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Deploy the routine as a Cloud Run job that Cloud Scheduler runs every minute to scan the bucket" }
    - id: b
      text: { en: "Deploy the routine in a GKE CronJob that lists the new objects in the bucket every minute" }
    - id: c
      text: { en: "Deploy the routine as a Cloud Run function with a Cloud Storage trigger on the object finalized event" }
    - id: d
      text: { en: "Run the routine on a Compute Engine VM that watches the bucket in a gcloud storage loop" }
answer: { optionId: c }
explanation:
  correct:
    en: Cloud Run functions deploy from source code and run in response to events. An Eventarc trigger on the `google.cloud.storage.object.v1.finalized` event invokes the function as soon as an object is created or overwritten, so thumbnails are produced within seconds without polling, and the function scales with the upload rate.
  options:
    a: { en: "A scheduled job polls the bucket, which the team rejects, and a one-minute schedule can miss the few-seconds target." }
    b: { en: "A GKE CronJob also polls on a schedule and adds a cluster and container images to manage." }
    d: { en: "A VM loop is polling code that runs and costs money all the time, and the team must manage the VM." }
references:
  - title: Create triggers from Cloud Storage events
    url: https://docs.cloud.google.com/run/docs/triggering/storage-triggers
