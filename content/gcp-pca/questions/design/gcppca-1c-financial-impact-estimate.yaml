id: gcppca-1c-financial-impact-estimate
objective: "1.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A hospital group is building the business case for moving its on-premises workloads to Google Cloud. The CFO wants a total cost of ownership comparison between the current data center and Google Cloud based on the discovered servers, plus a detailed monthly estimate of the target architecture that the architects can adjust. No workloads run on Google Cloud yet.

    Which two tools should you use? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Cloud Billing export to BigQuery" } }
    - { id: b, text: { en: "Migration Center cost estimates and TCO reports" } }
    - { id: c, text: { en: "Active Assist recommendations for idle resources" } }
    - { id: d, text: { en: "Google Cloud Pricing Calculator" } }
    - { id: e, text: { en: "Cloud Billing budgets with alert thresholds" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Migration Center uses the discovered on-premises assets to produce cost estimates and total cost of ownership reports that compare the current environment with Google Cloud. The Google Cloud Pricing Calculator builds a configurable, product-by-product monthly estimate of the target architecture that the team can adjust and share.
  options:
    a: { en: "The billing export analyzes actual Google Cloud charges, and there are none before the migration." }
    c: { en: "Idle resource recommendations analyze resources that already run on Google Cloud, so they cannot help before migration." }
    e: { en: "Budgets alert on actual or forecast Google Cloud spend; they neither estimate the target architecture nor compare it with the data center." }
references:
  - title: Migration Center overview
    url: https://docs.cloud.google.com/migration-center/docs/migration-center-overview
  - title: Google Cloud Pricing Calculator
    url: https://cloud.google.com/products/calculator
