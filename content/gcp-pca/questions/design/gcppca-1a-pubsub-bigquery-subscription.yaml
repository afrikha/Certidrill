id: gcppca-1a-pubsub-bigquery-subscription
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company publishes point-of-sale transactions as Avro messages to a Pub/Sub topic that has a schema. The analytics team wants each message written as a row into an existing BigQuery table as soon as it arrives. No transformation, aggregation or windowing is needed, and occasional duplicate rows can be removed later in BigQuery. The team wants the fewest components to operate.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run a Dataflow streaming job based on the Pub/Sub to BigQuery template.
    - id: b
      text:
        en: |-
          Deploy a Cloud Run service that pulls the messages and inserts the rows.
    - id: c
      text:
        en: |-
          Create a BigQuery subscription on the topic that uses the topic schema.
    - id: d
      text:
        en: |-
          Create a Cloud Storage subscription, and load the files every hour.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A BigQuery subscription writes messages directly to an existing BigQuery table as they arrive, with no subscriber client or pipeline to run. With the "use topic schema" option, the Avro fields map to the table columns. It offers at-least-once delivery, which is acceptable because duplicates can be removed later.
  options:
    a:
      en: |-
        Dataflow is recommended for complex transformations, windowing or aggregation; for a plain copy it adds a job to run and pay for.
    b:
      en: |-
        A custom subscriber is code and infrastructure to maintain, which doesn't minimize the components to operate.
    d:
      en: |-
        Batching to files and loading them every hour adds a load process and delays the data, so rows don't arrive as soon as the messages do.
references:
  - title: "BigQuery subscriptions | Pub/Sub | Google Cloud Documentation"
    url: https://docs.cloud.google.com/pubsub/docs/bigquery
