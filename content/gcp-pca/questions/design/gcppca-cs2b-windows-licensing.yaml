id: gcppca-cs2b-windows-licensing
objective: "1.4.4"
type: single
caseStudy: gcppca-cs2b-laurentide
difficulty: 3
status: draft
stem:
  en: |
    You are planning the rehosting of LoanDesk on Compute Engine. The plan must meet the LoanDesk technical requirements and the business requirement about licensing costs, and it must comply with Microsoft's license terms.

    How should you license the LoanDesk virtual machines?
body:
  options:
    - id: a
      text: { en: "Import Windows Server images that use the bank's own licenses, run them on sole-tenant nodes, and install SQL Server Enterprise with the bank's own licenses on them." }
    - id: b
      text: { en: "Import Windows Server images that use the bank's own licenses, run them on default-tenancy virtual machines, and install SQL Server Enterprise through License Mobility." }
    - id: c
      text: { en: "Create default-tenancy virtual machines from Google's SQL Server Enterprise public images, which include pay-as-you-go licenses for both Windows Server and SQL Server." }
    - id: d
      text: { en: "Create default-tenancy virtual machines from Google's Windows Server public images with pay-as-you-go licenses, and install SQL Server Enterprise through License Mobility." }
answer: { optionId: d }
explanation:
  correct:
    en: "SQL Server licenses with License Mobility through Software Assurance can run on default multi-tenant Compute Engine instances, provided that the operating system does not itself require sole-tenant nodes. A Windows Server image from Google with an on-demand license meets that condition, so the bank reuses its SQL Server licenses without managing dedicated hosts. The owned Windows Server licenses cannot be reused without sole-tenant nodes."
  options:
    a: { en: "Sole-tenant nodes would let the bank bring its Windows Server licenses, but the platform team will not manage dedicated hosts or sole-tenant capacity." }
    b: { en: "Windows Server licenses can be brought only under rights that require sole-tenant nodes, so a bring-your-own-license Windows Server image cannot run on default tenancy." }
    c: { en: "Pay-as-you-go SQL Server images charge again for SQL Server licenses that the bank already owns, which fails the requirement to reuse its licenses." }
references:
  - title: Microsoft licensing on Google Cloud FAQ
    url: https://docs.cloud.google.com/compute/docs/instances/windows/ms-licensing-faq
  - title: Bring your own licenses
    url: https://docs.cloud.google.com/compute/docs/nodes/bringing-your-own-licenses
