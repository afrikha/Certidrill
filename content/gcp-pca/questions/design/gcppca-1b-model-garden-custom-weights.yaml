id: gcppca-1b-model-garden-custom-weights
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A legal-tech company has fine-tuned an open Gemma model on its own contract data. It wants to serve this model, with its custom weights, on managed Google Cloud endpoints instead of building and operating its own serving infrastructure.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Call a Gemini model through Model as a Service on Gemini Enterprise Agent Platform with a system instruction that contains sample contracts.
    - id: b
      text:
        en: |-
          Index the contracts in Agent Search, and ground the responses of a Gemini model on the data store.
    - id: c
      text:
        en: |-
          Deploy the model with its custom weights from Model Garden to a Gemini Enterprise Agent Platform endpoint.
    - id: d
      text:
        en: |-
          Create a GKE Standard cluster with GPU node pools, and write a custom inference server for the model.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Model Garden is the single place to discover, customize and deploy models from Google, partners and open sources such as Gemma. Its self-deployment options include deploying models with custom weights to Gemini Enterprise Agent Platform endpoints, which serve the company's fine-tuned model without serving infrastructure to build.
  options:
    a:
      en: |-
        This uses a Gemini model instead of the company's fine-tuned Gemma model.
    b:
      en: |-
        Grounding adds the contract data to another model's answers; it does not serve the fine-tuned model.
    d:
      en: |-
        This serves the model, but the company would build and operate the serving infrastructure itself.
references:
  - title: "Overview of Model Garden"
    url: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/model-garden/explore-models
