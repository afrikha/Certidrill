id: gcppca-1a-pubsub-ordering-keys
objective: "1.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A bank publishes account events, such as deposits and withdrawals, to an existing Pub/Sub topic from an application in europe-west1. A new ledger service currently reads them through an existing pull subscription without message ordering. The ledger must process the events of each account in the order they were published, while the events of different accounts are processed in parallel to keep up with the volume.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Publish every event with the account ID as its ordering key.
    - id: b
      text:
        en: |-
          Update the existing subscription to turn on message ordering.
    - id: c
      text:
        en: |-
          Publish all events with one shared ordering key for the topic.
    - id: d
      text:
        en: |-
          Create a new subscription with message ordering, and switch the ledger service to it.
    - id: e
      text:
        en: |-
          Turn on exactly-once delivery so that messages arrive in their publish order.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Messages that share an ordering key and are published from the same region are delivered in order to a subscription that has message ordering enabled; using the account ID keeps each account in order while different accounts flow in parallel. The ordering property can't be changed after a subscription is created, so the ledger needs a new subscription with ordering enabled.
  options:
    b:
      en: |-
        The message ordering property of a subscription can't be changed after creation, so the existing subscription can't be updated.
    c:
      en: |-
        A single ordering key serializes all events and is limited to 1 MBps of publishing throughput, which removes the parallelism that the ledger needs.
    e:
      en: |-
        Exactly-once delivery prevents redelivery of acknowledged messages; it provides no ordering guarantee.
references:
  - title: "Order messages | Pub/Sub | Google Cloud Documentation"
    url: https://docs.cloud.google.com/pubsub/docs/ordering
