id: gcppca-1b-trace-cross-service-latency
objective: "1.1.12"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A retail company runs a checkout flow made of eight microservices on Cloud Run. Customers report that some checkout requests take more than five seconds, but the CPU and memory metrics of every service look normal. The SRE team needs to see how long each individual request spends in each service so that it can find the slow hop.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Cloud Monitoring dashboard that charts the request latency metric of each Cloud Run service side by side.
    - id: b
      text:
        en: |-
          Create log-based metrics from the request logs of each service, and alert when the 95th percentile latency exceeds five seconds.
    - id: c
      text:
        en: |-
          Instrument the services with OpenTelemetry, propagate the trace context between them, and analyze the spans in Cloud Trace.
    - id: d
      text:
        en: |-
          Enable Data Access audit logs for Cloud Run, and correlate the log entries of the eight services by timestamp in the Logs Explorer.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Cloud Trace is Google Cloud's distributed tracing service: it collects latency data as spans, and the spans of one request, linked by the propagated trace context, show the time spent in each service. Google recommends OpenTelemetry to instrument applications, and Trace Explorer lets the team filter the slow traces and see which hop adds the latency.
  options:
    a:
      en: |-
        Per-service latency charts show which services are slow on average, but they cannot follow one request across the eight services to show where its time goes.
    b:
      en: |-
        An alert tells the team that requests are slow; it does not show in which service of the chain the time is spent.
    d:
      en: |-
        Audit logs record who called which API, not the latency of each hop, and matching entries of different services by timestamp is unreliable under load.
references:
  - title: "Cloud Trace overview"
    url: https://docs.cloud.google.com/trace/docs/overview
