id: gcppca-1a-saas-marketplace-listing
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company sells a log-analytics SaaS product that runs in its own Google Cloud projects. Next year's sales strategy targets large enterprises that already have Google Cloud agreements. These customers want to buy the product through Google Cloud and see the charges on their Google Cloud bill instead of signing a separate purchasing contract with the vendor.

    What should the company do?
body:
  options:
    - id: a
      text:
        en: |-
          Publish the product as a container image in a public Artifact Registry repository so that customers can deploy it in their own projects.
    - id: b
      text:
        en: |-
          List the product as a SaaS offering on Google Cloud Marketplace, and integrate its sign-up and account linking with Cloud Marketplace.
    - id: c
      text:
        en: |-
          Publish the product's reports as listings in a public BigQuery sharing exchange that customers can subscribe to from their projects.
    - id: d
      text:
        en: |-
          Create a Private Service Connect service attachment so that customers can reach the product privately from their VPC networks.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      SaaS products on Cloud Marketplace run on the partner's infrastructure and are billed by Google, so customers buy them through Google Cloud and pay on their Google Cloud bill. The partner selects a pricing model, integrates the product so that Marketplace users get accounts linked to their Google identities, and publishes the listing after review.
  options:
    a:
      en: |-
        A public image lets customers run the software themselves, but it changes the product into self-managed software and gives no purchasing or billing through Google Cloud.
    c:
      en: |-
        BigQuery sharing distributes datasets and Pub/Sub topics; it doesn't sell access to a hosted application, which is what the sales strategy is about.
    d:
      en: |-
        Private Service Connect solves private network access to a producer service; it doesn't provide purchasing, contracts or billing.
references:
  - title: "Offering software as a service (SaaS) products | Google Cloud Marketplace Partners | Google Cloud Documentation"
    url: https://docs.cloud.google.com/marketplace/docs/partners/integrated-saas
