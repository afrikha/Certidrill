id: gcppca-cs7a-vault-connectivity
objective: "1.3.3"
type: single
caseStudy: gcppca-cs7a-sablepoint-payments
difficulty: 2
status: draft
stem:
  en: |
    You are designing the network connectivity between the payment services in `sp-prod` and the new CDE. The design must meet the technical requirement for the token vault.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Publish the tokenization service's internal load balancer with a Private Service Connect service attachment that accepts only sp-prod, and create a Private Service Connect endpoint in the sp-prod network." } }
    - { id: b, text: { en: "Peer the CDE network with the sp-prod network by using VPC Network Peering, and create firewall rules in the CDE network that allow only the tokenization API port from the sp-prod subnets." } }
    - { id: c, text: { en: "Make the CDE project a service project of a Shared VPC hosted by sp-prod, and create firewall rules that allow only the tokenization API port from the payment services' subnets." } }
    - { id: d, text: { en: "Connect the CDE network and the sp-prod network with HA VPN, and configure Cloud Router to advertise only the subnet of the tokenization service to sp-prod." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With Private Service Connect, the consumer in sp-prod reaches the published service through an endpoint, an internal IP address in its own network, and the traffic can reach only that service rather than a whole network. The CDE network keeps no route to sp-prod or any other network, and the service attachment's consumer accept list limits connections to the sp-prod project. Connections are initiated by the consumer only, so the CDE cannot open connections to sp-prod.
  options:
    b:
      en: VPC Network Peering exchanges subnet routes in both directions, so the CDE network gets routes to sp-prod; only firewall rules would stand between the two networks, which fails the no-route requirement.
    c:
      en: In a Shared VPC, the CDE resources would sit in the same VPC network as the payment services, which contradicts the requirement that the token vault has its own network with no route to others.
    d:
      en: HA VPN with Cloud Router exchanges routes between the two networks; the CDE network learns the sp-prod routes unless more filtering is added, and the payment services reach a whole subnet of the CDE rather than only the tokenization API.
references:
  - title: Private Service Connect
    url: https://docs.cloud.google.com/vpc/docs/private-service-connect
