id: gcppca-1c-stateless-sessions
objective: "1.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retailer is redesigning its web tier for Google Cloud. The current application keeps shopping-cart sessions in each server's local memory, so users lose their carts when a server is removed. The new web tier will run in an autoscaled managed instance group that adds and removes VMs at any time.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Store the sessions in Memorystore and keep the VMs of the group stateless" }
    - id: b
      text: { en: "Disable scale-in on the managed instance group so that VMs are never removed" }
    - id: c
      text: { en: "Store the sessions on a Local SSD attached to each VM of the group" }
    - id: d
      text: { en: "Enable session affinity on the backend service of the load balancer" }
answer: { optionId: a }
explanation:
  correct:
    en: The Well-Architected Framework recommends a stateless architecture in which components keep no local state and use shared storage or a cache service instead. With sessions in Memorystore, any VM can serve any user, and the group can add or remove VMs without losing carts.
  options:
    b: { en: "Preventing scale-in removes the cost benefit of autoscaling, and carts are still lost when a VM fails or is recreated." }
    c: { en: "A Local SSD is attached to one VM, so its sessions disappear with the VM and other VMs cannot read them." }
    d: { en: "Session affinity sends a user back to the same VM, but the session is still lost when the autoscaler removes that VM." }
references:
  - title: Google Cloud Well-Architected Framework
    url: https://docs.cloud.google.com/architecture/framework
  - title: Memorystore for Redis overview
    url: https://docs.cloud.google.com/memorystore/docs/redis/memorystore-for-redis-overview
