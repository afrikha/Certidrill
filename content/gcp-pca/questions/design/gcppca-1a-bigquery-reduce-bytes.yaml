id: gcppca-1a-bigquery-reduce-bytes
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A marketing team runs queries with on-demand pricing on a 40 TB BigQuery table of web events that is neither partitioned nor clustered. Most queries use SELECT * with LIMIT 1000 to analyze a few columns of the events of the last 7 days, and the monthly bill is growing quickly. The team must keep getting the same results.

    Which two changes reduce the bytes processed by these queries? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Keep SELECT * in the queries, and lower the LIMIT clause from 1,000 rows to 100 rows.
    - id: b
      text:
        en: |-
          Set a maximum bytes billed value of 1 TB on every query that the team runs.
    - id: c
      text:
        en: |-
          Select only the columns that the analysis needs instead of using SELECT *.
    - id: d
      text:
        en: |-
          Export the table to Cloud Storage as CSV files, and query them through an external table.
    - id: e
      text:
        en: |-
          Recreate the table partitioned by event date, and filter the queries on the partitioning column.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      BigQuery stores data by column, so selecting only the needed columns reduces the data read. Partitioning by event date lets a filter on the partitioning column prune the partitions outside the last 7 days, so the queries scan only the matching partitions; both changes lower the bytes processed while returning the same results.
  options:
    a:
      en: |-
        A LIMIT clause on a SELECT * query doesn't change the amount of data read on a non-clustered table, whatever the number of rows.
    b:
      en: |-
        A maximum bytes billed value makes the larger queries fail instead of running; it caps charges but doesn't make the queries read less data or return their results.
    d:
      en: |-
        CSV is a row format that can't be read column by column, so external queries over CSV files read at least as much data and lose BigQuery's native storage optimizations.
references:
  - title: "Optimize query computation | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/best-practices-performance-compute
  - title: "Introduction to partitioned tables | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/partitioned-tables
