id: gcppca-1a-bcp-rto-rpo-mapping
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    During a business continuity workshop, the head of e-commerce at a retailer says: "If the order system goes down, we can be offline for at most 2 hours, and we can afford to lose at most the last 5 minutes of orders."

    How should you record these requirements in the business continuity plan?
body:
  options:
    - id: a
      text:
        en: |-
          A recovery time objective of 5 minutes and a recovery point objective of 2 hours
    - id: b
      text:
        en: |-
          An availability SLO of 99.5% and a recovery point objective of 2 hours
    - id: c
      text:
        en: |-
          A recovery time objective of 2 hours and a recovery point objective of 5 minutes
    - id: d
      text:
        en: |-
          A recovery point objective of 2 hours and an error budget of 5 minutes
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The recovery time objective (RTO) is the maximum acceptable length of time that the application can be offline: 2 hours here. The recovery point objective (RPO) is the maximum acceptable period during which data might be lost after an incident: the last 5 minutes of orders.
  options:
    a:
      en: |-
        This inverts the two objectives: the 2 hours of tolerated downtime is the RTO, and the 5 minutes of tolerated data loss is the RPO.
    b:
      en: |-
        The stakeholder gave a tolerated outage and data-loss window, not an availability target over a period, and 2 hours is the downtime tolerance, not the RPO.
    d:
      en: |-
        An error budget derives from an SLO over a compliance period; it doesn't express tolerated data loss, and 2 hours is the RTO rather than the RPO.
references:
  - title: "Disaster recovery planning guide | Cloud Architecture Center | Google Cloud Documentation"
    url: https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide
