id: gcppca-cs6c-mainframe-reports
objective: "1.4.1"
type: single
caseStudy: gcppca-cs6c-aldermoor-horizon
difficulty: 1
status: draft
stem:
  en: |
    You are designing how the data of the marketing reports reaches BigQuery during the transition. The design must meet the business requirement for marketing reports.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Add Mainframe Connector steps to the nightly JCL batch that transcode the QSAM extracts with their copybooks, copy them to Cloud Storage, and load them into BigQuery." } }
    - { id: b, text: { en: "Replicate the loyalty tables from Db2 to BigQuery with Datastream over the Dedicated Interconnect connection, and run the marketing reports on the replicated tables." } }
    - { id: c, text: { en: "Transfer the QSAM extracts to Cloud Storage with FTP every night, and load the files into BigQuery with the `bq load` command as CSV files with a fixed schema." } }
    - { id: d, text: { en: "Rewrite the COBOL extract programs so that they send each member and transaction record to BigQuery with the streaming API instead of writing QSAM extracts." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Mainframe Connector runs as steps of existing JCL jobs: it converts EBCDIC data of QSAM or VSAM datasets, described by COBOL copybooks, to ORC, copies the result to Cloud Storage and loads it into BigQuery with the `bq load` command. The COBOL programs that write the extracts do not change, and the reports then run in BigQuery instead of consuming mainframe processor capacity at month end.
  options:
    b:
      en: Datastream does not support Db2 as a source; its database sources are MySQL, PostgreSQL, Oracle, SQL Server, MongoDB and Spanner.
    c:
      en: The extracts are EBCDIC records laid out by copybooks, possibly with binary or packed-decimal fields; BigQuery cannot load them as CSV without transcoding them first.
    d:
      en: Rewriting the extract programs changes the COBOL programs, which the business requirement forbids during the transition.
references:
  - title: Mainframe Connector overview
    url: https://docs.cloud.google.com/mainframe-connector/docs/overview
  - title: Move data transcoded locally on the mainframe to Google Cloud
    url: https://docs.cloud.google.com/mainframe-connector/docs/local-transcoding
