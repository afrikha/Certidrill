id: gcppca-1c-hyperdisk-iops
objective: "1.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company runs a database on a C3 Compute Engine VM. To get the IOPS it needs, it provisioned a 4 TB SSD Persistent Disk even though the data uses only 600 GB, so it pays for unused capacity. It wants to size the disk for its data, pay only for the performance it needs, and adjust that performance as the load changes.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Move the data to a Hyperdisk Balanced volume and provision its IOPS and throughput" }
    - id: b
      text: { en: "Move the data to Local SSD disks attached to the VM for higher IOPS" }
    - id: c
      text: { en: "Stripe several smaller Persistent Disks together with RAID 0 inside the VM" }
    - id: d
      text: { en: "Move the data to a larger SSD Persistent Disk to raise the per-GB performance limit" }
answer: { optionId: a }
explanation:
  correct:
    en: With Hyperdisk, you configure IOPS and throughput separately from the volume size, and you can increase or decrease them while the volume is in use. The company can size the volume for 600 GB, provision the IOPS the database needs, and pay for capacity plus provisioned performance above the baseline.
  options:
    b: { en: "Local SSD data does not persist like a durable disk, which makes it unsuitable as the only storage of a database." }
    c: { en: "Striping still ties performance to the total provisioned capacity and adds complexity inside the VM." }
    d: { en: "Persistent Disk performance scales with size, so a larger disk means paying for even more unused capacity." }
references:
  - title: Google Cloud Hyperdisk overview
    url: https://docs.cloud.google.com/compute/docs/disks/hyperdisks
