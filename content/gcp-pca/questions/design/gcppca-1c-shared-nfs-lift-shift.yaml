id: gcppca-1c-shared-nfs-lift-shift
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An engineering firm is moving a legacy CAD rendering application to Compute Engine. Twelve VMs must read and write the same project files at the same time over NFSv3, and the application cannot be modified.

    Which storage option should you use?
body:
  options:
    - id: a
      text: { en: "A Cloud Storage bucket that the application accesses through the JSON API" }
    - id: b
      text: { en: "A Local SSD attached to each VM, synchronized with the others every night" }
    - id: c
      text: { en: "A Bigtable instance that stores each project file as a row" }
    - id: d
      text: { en: "A Filestore instance whose file share is mounted on each VM" }
answer: { optionId: d }
explanation:
  correct:
    en: Filestore is a managed NFS file server. Many Compute Engine clients can mount the same file share and read and write it concurrently, and NFSv3 is supported on every service tier, so the application runs unchanged.
  options:
    a: { en: "Cloud Storage is object storage; using its JSON API would require modifying the application, which is not allowed." }
    b: { en: "Local SSDs are attached to a single VM and are not shared; nightly synchronization cannot give twelve VMs concurrent access to the same files." }
    c: { en: "Bigtable is a wide-column NoSQL database, not a file system; the application would have to be rewritten to use it." }
references:
  - title: Filestore overview
    url: https://docs.cloud.google.com/filestore/docs/overview
