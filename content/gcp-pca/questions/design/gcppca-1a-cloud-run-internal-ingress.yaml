id: gcppca-1a-cloud-run-internal-ingress
objective: "1.1.11"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an internal HR API as a Cloud Run service that currently allows unauthenticated invocations. Only two applications may call it: a batch application on premises that reaches it through an internal Application Load Balancer over Cloud Interconnect, and a GKE workload in a VPC network of the same project. Requests from the internet must be blocked even if the service URL leaks, every caller must be authenticated, and you must use the most restrictive network setting that supports both callers.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set the ingress setting of the service to Internal.
    - id: b
      text:
        en: |-
          Keep the ingress setting All, and protect the service with a Cloud Armor policy.
    - id: c
      text:
        en: |-
          Remove allUsers from the Cloud Run Invoker role, and grant the role only to the callers' service accounts.
    - id: d
      text:
        en: |-
          Set the ingress setting of the service to Internal and Cloud Load Balancing.
    - id: e
      text:
        en: |-
          Create a VPC Service Controls perimeter around the project in dry run mode.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      The Internal ingress setting is the most restrictive one: it accepts requests from internal Application Load Balancers and from VPC networks of the project, and blocks internet requests before IAM is even evaluated. Ingress is a network control, so authentication requires a separate IAM change: removing allUsers and granting the Cloud Run Invoker role only to the callers' identities.
  options:
    b:
      en: |-
        With the All setting, the run.app URL stays reachable from the internet, and a Cloud Armor policy on a load balancer doesn't protect direct requests to that URL.
    d:
      en: |-
        This setting also accepts traffic from external Application Load Balancers, so it is less restrictive than Internal, which already supports both callers.
    e:
      en: |-
        Dry run mode only logs the requests that a perimeter would block; it doesn't block anything.
references:
  - title: "Restrict network endpoint ingress for Cloud Run services and instances | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/securing/ingress
