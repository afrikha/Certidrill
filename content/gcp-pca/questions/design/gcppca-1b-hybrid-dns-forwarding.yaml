id: gcppca-1b-hybrid-dns-forwarding
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A company connects its data center to a VPC network with Cloud Interconnect. VMs in the VPC network must resolve names in the on-premises zone corp.example.com, and on-premises clients must resolve names in the Cloud DNS private zone gcp.example.com.

    Which actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a Cloud DNS forwarding zone for corp.example.com that targets the on-premises DNS servers, and advertise 35.199.192.0/19 to the on-premises network from Cloud Router.
    - id: b
      text:
        en: |-
          Configure zone transfers of gcp.example.com from Cloud DNS to the on-premises DNS servers.
    - id: c
      text:
        en: |-
          Create a Cloud DNS peering zone for corp.example.com that targets the on-premises network.
    - id: d
      text:
        en: |-
          Create a DNS server policy with inbound forwarding in the VPC network, and configure conditional forwarding to its inbound forwarding addresses on the on-premises DNS servers.
    - id: e
      text:
        en: |-
          Make gcp.example.com a public zone so that on-premises clients can resolve it through the internet.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      A forwarding zone sends the VMs' queries for corp.example.com to the on-premises DNS servers; Cloud DNS sends those queries from 35.199.192.0/19, so Cloud Router must advertise that range for the answers to come back. An inbound server policy gives forwarding addresses in the VPC network, and conditional forwarding on the on-premises servers sends gcp.example.com queries to them.
  options:
    b:
      en: |-
        Cloud DNS does not support zone transfers.
    c:
      en: |-
        DNS peering resolves names from another VPC network's DNS configuration; it cannot target an on-premises network.
    e:
      en: |-
        Publishing internal names in a public zone exposes them on the internet and does not use the private zone.
references:
  - title: "Best practices for Cloud DNS"
    url: https://docs.cloud.google.com/dns/docs/best-practices
