id: gcppca-1c-release-velocity
objective: "1.5.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A travel company's booking platform is a set of Cloud Run services that call each other synchronously. The business now wants to release features weekly instead of quarterly. An outage of the loyalty-points service must no longer block bookings, and each new release must receive a small share of traffic before the full rollout.

    Which two changes should you recommend? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Merge the services into one larger Cloud Run service to simplify releases" } }
    - { id: b, text: { en: "Publish booking events to Pub/Sub and let the loyalty-points service consume them asynchronously" } }
    - { id: c, text: { en: "Raise the request timeout of the booking service so that it waits longer for loyalty points" } }
    - { id: d, text: { en: "Deploy new revisions to all traffic at once during a quarterly maintenance window" } }
    - { id: e, text: { en: "Use Cloud Deploy with a canary strategy to roll out new Cloud Run revisions in phases" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: Publishing booking events to Pub/Sub decouples the services, so bookings complete even when the loyalty-points service is down and the events are processed when it recovers. A Cloud Deploy canary strategy for Cloud Run sends a percentage of traffic to the new revision in successive phases before the stable 100 % phase, which supports frequent, low-risk releases.
  options:
    a: { en: "A single service couples every feature into one release and one failure domain, which slows releases and spreads outages." }
    c: { en: "A longer timeout keeps bookings waiting on the loyalty-points service, so its outages still block bookings." }
    d: { en: "Quarterly all-at-once releases contradict both the weekly cadence and the partial-traffic requirement." }
references:
  - title: Use a canary deployment strategy
    url: https://docs.cloud.google.com/deploy/docs/deployment-strategies/canary
  - title: What is Pub/Sub?
    url: https://docs.cloud.google.com/pubsub/docs/overview
