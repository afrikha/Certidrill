id: gcppca-1b-provisioned-throughput
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A bank launches a customer-facing chatbot built on a Gemini model on Gemini Enterprise Agent Platform. Traffic is steady and high during business hours. The bank needs consistent, predictable capacity for its users and a fixed, predictable cost.

    Which consumption option should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Pay-as-you-go usage of the model, with client-side retries when requests fail
    - id: b
      text:
        en: |-
          Batch inference jobs that process the user messages every hour
    - id: c
      text:
        en: |-
          Self-deployment of the Gemini model on GPU VMs from Model Garden
    - id: d
      text:
        en: |-
          Provisioned Throughput for the model in the locations where the chatbot runs
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Provisioned Throughput is a fixed-cost, fixed-term subscription that reserves throughput for a supported model in the locations you choose. Google positions it for real-time production applications such as chatbots and agents that need consistently high throughput, a predictable user experience and deterministic costs.
  options:
    a:
      en: |-
        Pay-as-you-go usage reserves no throughput, so capacity is not guaranteed and the cost varies with usage.
    b:
      en: |-
        Batch inference is asynchronous, so users of a chatbot would not get real-time answers.
    c:
      en: |-
        Gemini models are offered as managed models through the API; self-deployment from Model Garden applies to open models.
references:
  - title: "Provisioned Throughput overview"
    url: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/provisioned-throughput/overview
