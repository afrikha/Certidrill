id: gcppca-cs1a-viewer-telemetry
objective: "1.3.4"
type: multi
caseStudy: gcppca-cs1a-lumora-streaming
difficulty: 2
status: draft
stem:
  en: |
    You are replacing the Kafka cluster and the nightly batch job. The new telemetry pipeline must give the content team the concurrent viewers per title and per country and meet the technical requirements for heartbeats.

    Which two components should you include in the design? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A Pub/Sub topic to which the telemetry endpoint publishes every heartbeat as it is received" } }
    - { id: b, text: { en: "A Pub/Sub BigQuery subscription that writes every heartbeat to a table that the content team queries directly" } }
    - { id: c, text: { en: "A Dataflow streaming pipeline that removes duplicates by event ID and counts viewers in one-minute event-time windows that accept data up to 5 minutes late, then writes the results to BigQuery" } }
    - { id: d, text: { en: "A Cloud Storage bucket that receives the heartbeats as files, with a BigQuery load job that runs every hour" } }
    - { id: e, text: { en: "A Cloud Run function, triggered by every heartbeat, that increments a counter document per title and per country in Firestore" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Pub/Sub ingests the heartbeats of millions of players as a decoupled, scalable stream. Dataflow is the recommended choice when messages must be windowed or aggregated before they reach BigQuery: it can deduplicate on the event ID, assign heartbeats to one-minute windows by their client timestamp and accept late data for 5 minutes, so the per-minute counts are complete and available within the 2-minute target.
  options:
    b:
      en: A BigQuery subscription writes each message as it is, with at-least-once delivery; it neither removes the resent heartbeats nor aggregates them per minute.
    d:
      en: An hourly load job delivers the data about an hour late, far beyond the 2-minute target.
    e:
      en: Incrementing a counter per message counts resent heartbeats twice, assigns late heartbeats to the wrong minute, and concentrates very frequent writes on a few documents during popular premieres.
references:
  - title: BigQuery subscriptions
    url: https://docs.cloud.google.com/pubsub/docs/bigquery
