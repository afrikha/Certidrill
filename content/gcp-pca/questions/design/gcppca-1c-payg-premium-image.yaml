id: gcppca-1c-payg-premium-image
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A marketing agency needs 10 Windows Server VMs on Compute Engine for a four-month campaign. It owns no Windows Server licenses and does not want to buy any.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create the VMs from Google-provided Windows Server premium images" }
    - id: b
      text: { en: "Import a Windows Server image with the BYOL option and activate it" }
    - id: c
      text: { en: "Buy a 1-year resource-based commitment for Windows Server licenses" }
    - id: d
      text: { en: "Purchase Windows Server licenses and run the VMs on sole-tenant nodes" }
answer: { optionId: a }
explanation:
  correct:
    en: Google-provided Windows Server images are premium images with pay-as-you-go licensing. Google Cloud bills the license with VM usage, so the agency pays only while the VMs exist and buys no licenses.
  options:
    b: { en: "BYOL requires licenses that the agency does not own, and Windows Server BYOL must run on sole-tenant nodes." }
    c: { en: "License commitments are offered for some Linux premium operating systems such as SLES and RHEL, not Windows Server, and a one-year term outlasts the campaign." }
    d: { en: "Buying licenses is exactly what the agency wants to avoid, and sole-tenant nodes add cost for a short campaign." }
references:
  - title: About licenses
    url: https://docs.cloud.google.com/compute/docs/licenses/about
