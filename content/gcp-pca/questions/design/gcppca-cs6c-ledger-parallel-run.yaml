id: gcppca-cs6c-ledger-parallel-run
objective: "1.4.3"
type: single
caseStudy: gcppca-cs6c-aldermoor-horizon
difficulty: 2
status: draft
stem:
  en: |
    You are writing the testing section of the ledger migration plan. The plan must meet the business requirement for testing the new ledger and the technical requirements.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Move 1 % of the members to the new ledger first, compare their balances in both systems for a month, and then move the other members in waves." } }
    - { id: b, text: { en: "Test the new ledger in a staging environment with synthetic transactions that cover every earning and redemption rule, and move all members once the tests pass." } }
    - { id: c, text: { en: "Copy the Db2 data to the new ledger, move all members in one weekend, and keep the mainframe ready for a rollback if members report wrong balances." } }
    - { id: d, text: { en: "Run the new ledger in parallel with the mainframe, feed it the same production transactions, and compare balances and tier status automatically before moving any member." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In a parallel run, the new ledger receives the same real production inputs as the mainframe, which stays the system of record, and the outputs of both systems are compared: with the same input, the balances and tier status must match. Members keep seeing the mainframe's balances, so a difference found during the test affects no one and can be analyzed and fixed before the first member moves. Google Cloud applies the same approach to mainframe modernization with Dual Run, which replays live production events on the modernized application.
  options:
    a:
      en: The first 1 % of members are moved before the new ledger has been proved, so they can see wrong balances during the test.
    b:
      en: Synthetic transactions are not real member activity, and they can miss the data and rule combinations accumulated over 30 years.
    c:
      en: Members would discover the errors themselves, which breaks the requirement that no member sees a wrong balance.
references:
  - title: Dual Run overview
    url: https://docs.cloud.google.com/mainframe-dual-run/docs/dual-run-overview
