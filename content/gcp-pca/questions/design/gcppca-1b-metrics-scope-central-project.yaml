id: gcppca-1b-metrics-scope-central-project
objective: "1.1.12"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A media company runs its video pipeline in 12 projects, one per team and environment. The operations team wants one set of Cloud Monitoring dashboards and alerting policies that covers the VMs and GKE clusters of all 12 projects. The operations team must not receive permissions that let it change resources in the 12 projects.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create the dashboards and alerting policies in one of the production projects, add the other 11 projects to its metrics scope, and grant the operations team the Writer basic role on that project.
    - id: b
      text:
        en: |-
          Create a new project without workloads, add the 12 projects to its metrics scope, create the dashboards and alerting policies there, and grant the operations team Monitoring roles on that project only.
    - id: c
      text:
        en: |-
          Export the metrics of the 12 projects to BigQuery every hour, and build the dashboards and threshold reports in Looker Studio.
    - id: d
      text:
        en: |-
          Deploy a self-managed Prometheus and Grafana stack in a new project that scrapes the workloads of the 12 projects over VPC Network Peering.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A metrics scope lets a scoping project chart and alert on the time series of the projects it monitors, and the scoping project stores the dashboards and alerting policies. Google recommends a new project, or one without resources, as the scoping project; viewing the data requires only Monitoring roles on that project, so the operations team gets no permission on the workload projects.
  options:
    a:
      en: |-
        The Writer role on a production project lets the operations team change that project's resources, which the requirement forbids.
    c:
      en: |-
        Hourly exports to BigQuery give delayed data and no Cloud Monitoring alerting policies, and they add a pipeline to maintain.
    d:
      en: |-
        A self-managed monitoring stack adds infrastructure to operate and duplicates what a metrics scope provides natively.
references:
  - title: "Metrics scopes overview"
    url: https://docs.cloud.google.com/monitoring/settings
