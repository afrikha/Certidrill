id: gcppca-1a-store-edge-distributed-cloud
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A grocery chain plans to run computer-vision checkout applications in 300 of its large stores. The applications need the lowest attainable latency to the in-store cameras, and privacy regulations require that the video stays on the store premises. The IT team wants the Kubernetes software to be monitored, updated and secured by Google and managed centrally through Google Cloud, and it wants to run both containers and some virtual machines.

    Which solution should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Run the applications on GKE clusters in the Google Cloud region nearest to each store, connected to the stores through HA VPN.
    - id: b
      text:
        en: |-
          Run the applications on Compute Engine VMs in the nearest region, and stream the video to them over Partner Interconnect.
    - id: c
      text:
        en: |-
          Deploy Google Distributed Cloud connected in each store, and run the applications on its locally hosted GKE clusters.
    - id: d
      text:
        en: |-
          Run the applications as Cloud Run services in the nearest region, and send the video to them through a global load balancer.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Google Distributed Cloud connected runs GKE clusters, for containers and virtual machines, on dedicated hardware installed on the customer's premises, while Google remotely monitors and maintains the software through Google Cloud. It is designed for the lowest attainable latency and for keeping data on premises or within a jurisdiction, which matches both the use case and the regulation.
  options:
    a:
      en: |-
        Cloud regions are remote from the stores: the video would leave the premises, which breaks the privacy requirement, and latency would depend on the VPN path.
    b:
      en: |-
        Streaming video to a region sends it off the premises, and VMs in the cloud can't give the latency of compute installed next to the cameras.
    d:
      en: |-
        Cloud Run runs in Google Cloud regions, so the video would leave the store, and the round trip to the region adds latency.
references:
  - title: "Overview of connected deployments of Google Distributed Cloud | Google Distributed Cloud connected | Google Cloud Documentation"
    url: https://docs.cloud.google.com/distributed-cloud/edge/latest/docs/overview
