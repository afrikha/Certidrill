id: gcppca-cs5c-vee-rules
objective: "1.3.4"
type: single
caseStudy: gcppca-cs5c-ashgrove-power
difficulty: 1
status: draft
stem:
  en: |
    You are choosing how to run the VEE rules in Google Cloud. The solution must meet the business requirement about billing and the technical requirement for the VEE rules.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Create one BigQuery scheduled query per script, and schedule each query a few minutes after the queries whose output it uses." } }
    - { id: b, text: { en: "Rewrite the scripts as an Apache Beam pipeline in Java that runs on Dataflow every 30 minutes, with its code stored in GitHub." } }
    - { id: c, text: { en: "Run the scripts as Spark SQL jobs on a Managed Service for Apache Spark cluster, orchestrated every 30 minutes by a Managed Service for Apache Airflow environment." } }
    - { id: d, text: { en: "Convert the scripts to SQLX files in a Dataform repository connected to GitHub, declare dependencies with ref and data quality checks with assertions, and schedule a workflow configuration every 30 minutes." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Dataform develops, tests, versions and schedules SQL transformation workflows in BigQuery. The ref function builds the dependency graph so that each script runs after the ones whose output it uses, assertions test data quality as part of that graph, the repository connects to GitHub, and a workflow configuration schedules the runs. The team keeps writing SQL and manages no servers.
  options:
    a:
      en: Independent schedules do not enforce dependencies or stop downstream queries when a check fails, so readings that failed validation can still reach billing; scheduled queries are not version-controlled in GitHub either.
    b:
      en: Rewriting the rules in Java does not keep them in SQL, and the meter data team knows SQL only.
    c:
      en: Managed Service for Apache Spark (formerly Dataproc) clusters and a Managed Service for Apache Airflow (formerly Cloud Composer) environment are infrastructure for the team to size and manage, which the technical requirements exclude.
references:
  - title: Dataform overview
    url: https://docs.cloud.google.com/dataform/docs/overview
