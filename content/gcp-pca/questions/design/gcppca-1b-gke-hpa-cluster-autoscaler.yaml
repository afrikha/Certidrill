id: gcppca-1b-gke-hpa-cluster-autoscaler
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A company runs a stateless API on a GKE Standard cluster with one node pool. During promotions, request volume triples within minutes, the existing Pods reach their CPU limits, and latency rises. The company wants both the number of Pods and the number of nodes to follow demand automatically.

    Which actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Configure a HorizontalPodAutoscaler for the Deployment that targets an average CPU utilization.
    - id: b
      text:
        en: |-
          Configure a VerticalPodAutoscaler in Auto mode for the Deployment so that its Pods get larger CPU requests.
    - id: c
      text:
        en: |-
          Enable cluster autoscaler on the node pool with a minimum and a maximum number of nodes.
    - id: d
      text:
        en: |-
          Enable node auto-repair on the node pool.
    - id: e
      text:
        en: |-
          Increase the maxSurge value in the surge upgrade settings of the node pool.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      The HorizontalPodAutoscaler changes the number of Pods of the Deployment based on CPU, memory or custom metrics, but it does not add nodes. Cluster autoscaler adds nodes to the node pool, within its minimum and maximum, when new Pods cannot be scheduled because of their resource requests, so the two together scale Pods and nodes.
  options:
    b:
      en: |-
        VerticalPodAutoscaler adjusts the resource requests of Pods instead of adding replicas, and it should not be combined with an HPA that acts on CPU.
    d:
      en: |-
        Auto-repair replaces unhealthy nodes; it does not add capacity under load.
    e:
      en: |-
        maxSurge controls how many extra nodes are created during an upgrade, not during traffic peaks.
references:
  - title: "About GKE cluster autoscaling"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/cluster-autoscaler
  - title: "Horizontal Pod autoscaling"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/horizontalpodautoscaler
