id: gcppca-1b-spanner-dual-region-zero-rpo
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A bank runs a payments ledger on a relational database. Regulators require the data to stay in the bank's country, which has two Google Cloud regions where all the database options below, including their multi-location configurations, are available. A full regional outage must not lose any committed transaction, writes must continue without manual action, and transactions must be strongly consistent.

    Which design should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Cloud SQL for PostgreSQL with high availability in one region and a cross-region read replica in the other region, promoted during an outage.
    - id: b
      text:
        en: |-
          Spanner Enterprise Plus edition with a dual-region instance configuration that spans the two regions of the country.
    - id: c
      text:
        en: |-
          AlloyDB for PostgreSQL with a primary cluster in one region and a secondary cluster in the other region.
    - id: d
      text:
        en: |-
          Spanner with a regional instance configuration that places read-write replicas in three zones of one region.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Spanner dual-region configuration keeps two read-write replicas and a witness replica in each of two regions of the same country, replicates with strong consistency, and provides a zero recovery point objective when a region fails. It requires the Enterprise Plus edition, keeps the data in the country, and offers 99.999% availability.
  options:
    a:
      en: |-
        The cross-region replica is asynchronous, so a regional outage can lose committed transactions, and its promotion is a manual action.
    c:
      en: |-
        AlloyDB replicates to a secondary cluster asynchronously, and the secondary cluster must be promoted by an operator.
    d:
      en: |-
        A regional configuration survives zone failures but not the loss of its region.
references:
  - title: "Regional, dual-region, and multi-region configurations"
    url: https://docs.cloud.google.com/spanner/docs/instance-configurations
  - title: "Cross-region replication overview"
    url: https://docs.cloud.google.com/alloydb/docs/cross-region-replication/about-cross-region-replication
