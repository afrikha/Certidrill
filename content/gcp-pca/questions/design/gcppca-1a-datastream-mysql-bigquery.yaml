id: gcppca-1a-datastream-mysql-bigquery
objective: "1.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A subscription business runs a self-managed MySQL 8.0 database on Compute Engine. Analysts need the orders and customers tables replicated continuously into BigQuery, with changes visible within minutes. The company doesn't want to write or operate pipeline code, and the database administrators can change the MySQL server configuration.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set binlog_format to ROW and binlog_row_image to FULL on the MySQL server, and keep the binary logs for 7 days.
    - id: b
      text:
        en: |-
          Schedule a nightly mysqldump export to Cloud Storage, and load the files with a BigQuery load job.
    - id: c
      text:
        en: |-
          Create a BigQuery connection for federated queries that read the MySQL tables on the VM directly.
    - id: d
      text:
        en: |-
          Enable GTID-based replication, and create a Cloud SQL read replica that copies the database on the VM.
    - id: e
      text:
        en: |-
          Create a Datastream stream from a MySQL connection profile to BigQuery that includes the two tables.
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      Datastream is a serverless change data capture service that replicates MySQL changes into BigQuery in near real time, with no pipeline code. It reads the binary log, so a self-managed source needs row-based logging (binlog_format=ROW, binlog_row_image=FULL) and log retention, 7 days in the documented setup, plus a user with replication privileges.
  options:
    b:
      en: |-
        A nightly dump makes the data up to a day old, which doesn't meet the requirement of changes visible within minutes.
    c:
      en: |-
        Federated queries read the source database at query time and don't replicate the data into BigQuery; besides, they are generally available for Cloud SQL, AlloyDB and Spanner, while connections to other MySQL servers are only in Preview.
    d:
      en: |-
        A Cloud SQL replica creates another MySQL copy; it doesn't bring the data into BigQuery for the analysts.
references:
  - title: "Datastream overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/datastream/docs/overview
  - title: "Configure a self-managed MySQL database for CDC | Datastream | Google Cloud Documentation"
    url: https://docs.cloud.google.com/datastream/docs/configure-self-managed-mysql
