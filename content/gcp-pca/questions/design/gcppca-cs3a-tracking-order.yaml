id: gcppca-cs3a-tracking-order
objective: "1.3.4"
type: single
caseStudy: gcppca-cs3a-tidemark-logistics
difficulty: 2
status: draft
stem:
  en: |
    You are designing the ingestion of tracker events for the new tracking platform. The design must meet the business requirement for alarms and the technical requirements for event processing.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Publish the events to a Pub/Sub topic without an ordering key, enable exactly-once delivery on the subscription, and process the events with many workers." } }
    - { id: b, text: { en: "Publish the events to a Pub/Sub topic with the same ordering key for every event, enable message ordering on the subscription, and process the events with many workers." } }
    - { id: c, text: { en: "Publish the events to a Pub/Sub topic with the container ID as the ordering key, enable message ordering on the subscription, and process the events with many workers." } }
    - { id: d, text: { en: "Publish the events to a Pub/Sub topic without an ordering key, and have each worker buffer events for 10 seconds and sort them by tracker timestamp before processing them." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Pub/Sub delivers messages that share an ordering key in the order in which they were published in one region, when message ordering is enabled on the subscription. Messages with different keys are not ordered relative to each other, so using the container ID as the key keeps each container's events in order while the 1.6 million containers are spread across many workers. The gateway publishes from a single region, as the ordering guarantee requires.
  options:
    a:
      en: Exactly-once delivery prevents redelivery of acknowledged messages but does not order them; two events of the same container can be processed out of order by two workers.
    b:
      en: A single ordering key orders every event of the platform, which serializes the processing and caps publishing at the per-key throughput limit, so the platform cannot scale to 30,000 events per second.
    d:
      en: Each worker only sorts the events it receives; events of the same container can still reach different workers, and the 10-second buffer adds latency without guaranteeing order.
references:
  - title: Order messages
    url: https://docs.cloud.google.com/pubsub/docs/ordering
