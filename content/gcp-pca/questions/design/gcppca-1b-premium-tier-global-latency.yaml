id: gcppca-1b-premium-tier-global-latency
objective: "1.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A fintech company exposes a JSON API from backends that must run only in us-central1 because of a contractual requirement. Every response is personalized and cannot be cached. Most API clients are in Europe and Asia, and the company wants the lowest possible latency for them.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Use a regional external Application Load Balancer in us-central1 with a Standard Tier IP address.
    - id: b
      text:
        en: |-
          Enable Cloud CDN on the backend service, and cache all responses with a forced caching mode.
    - id: c
      text:
        en: |-
          Use a global external Application Load Balancer with a Premium Tier IP address so that client traffic enters Google's network at the point of presence closest to each client.
    - id: d
      text:
        en: |-
          Use an external passthrough Network Load Balancer in us-central1 so that the backends receive the clients' IP addresses.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With Premium Tier, client traffic enters Google's network at the point of presence nearest the user and travels on Google's backbone to us-central1, instead of crossing public ISP networks. The global external Application Load Balancer runs only on Premium Tier, so it is the lowest-latency option when the backends must stay in one region.
  options:
    a:
      en: |-
        Standard Tier lets traffic enter Google's network near the region, so more of the path from Europe and Asia crosses the public internet: it optimizes cost, not latency.
    b:
      en: |-
        The responses are personalized, so forcing the cache would serve one client's data to another client.
    d:
      en: |-
        A passthrough load balancer preserves client IP addresses, but it does not shorten the network path for distant clients.
references:
  - title: "Network Service Tiers overview"
    url: https://docs.cloud.google.com/network-tiers/docs/overview
  - title: "Choose a load balancer"
    url: https://docs.cloud.google.com/load-balancing/docs/choosing-load-balancer
