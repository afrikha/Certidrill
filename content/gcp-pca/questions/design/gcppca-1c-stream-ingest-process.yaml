id: gcppca-1c-stream-ingest-process
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A logistics company receives telemetry from 40,000 delivery vehicles. The event rate varies from a few hundred messages per second at night to 200,000 messages per second at peak. The company must compute rolling per-vehicle averages within seconds and write the results to BigQuery without duplicate results. The operations team does not want to provision or manage clusters.

    Which two services should you include in the design? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A Pub/Sub topic that receives the vehicle events and buffers them for downstream processing" } }
    - { id: b, text: { en: "A Cloud Tasks queue that dispatches each vehicle event to an HTTP handler that computes the averages" } }
    - { id: c, text: { en: "A Dataflow streaming pipeline built with Apache Beam that aggregates the events and writes them to BigQuery" } }
    - { id: d, text: { en: "A long-running Managed Service for Apache Spark cluster that runs a Spark Structured Streaming job" } }
    - { id: e, text: { en: "A Storage Transfer Service job that copies the vehicle event files into BigQuery every minute" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Pub/Sub is the managed, autoscaling ingestion layer that decouples the vehicles from the processing tier and absorbs bursts. Dataflow runs Apache Beam streaming pipelines on workers that it provisions and autoscales itself, provides exactly-once processing by default, and can write aggregated results to BigQuery with low latency. Neither service requires a cluster to manage.
  options:
    b: { en: "Cloud Tasks dispatches individual asynchronous calls to handlers; it is not a stream analytics engine, and per-event handlers cannot compute rolling aggregates across events without building custom state management." }
    d: { en: "Spark Structured Streaming can compute the averages, but the cluster deployment must be created, sized and operated by the team, which the operations team wants to avoid." }
    e: { en: "Storage Transfer Service moves objects between storage systems into Cloud Storage; it neither ingests messages nor computes aggregations, and minute-level copies miss the seconds-level latency requirement." }
references:
  - title: Dataflow overview
    url: https://docs.cloud.google.com/dataflow/docs/overview
  - title: What is Pub/Sub?
    url: https://docs.cloud.google.com/pubsub/docs/overview
