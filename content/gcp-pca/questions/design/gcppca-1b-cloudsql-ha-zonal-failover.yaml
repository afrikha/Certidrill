id: gcppca-1b-cloudsql-ha-zonal-failover
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    An insurance company runs its policy database on a Cloud SQL for MySQL instance in europe-west1 without high availability. The database must recover automatically from a zone failure within a few minutes, and no committed transaction may be lost when this happens. Region failures are covered by a separate disaster recovery plan.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Enable high availability on the instance so that Cloud SQL keeps a standby instance in another zone of the region with synchronous replication.
    - id: b
      text:
        en: |-
          Create a read replica in another zone of europe-west1, and promote it with a script when the primary instance becomes unavailable.
    - id: c
      text:
        en: |-
          Create a cross-region read replica in europe-west4, and point the application to it when the primary zone fails.
    - id: d
      text:
        en: |-
          Take an on-demand backup every 15 minutes, and restore the latest backup to a new instance in another zone after a failure.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A high availability Cloud SQL instance is a regional instance with a primary and a standby in different zones; each write is replicated synchronously to both zones before the transaction is reported as committed. A heartbeat detects the failure of the primary and Cloud SQL fails over to the standby automatically, typically in about a minute, without losing committed transactions.
  options:
    b:
      en: |-
        Read replicas replicate asynchronously, so recent transactions can be lost, and the promotion depends on a custom script.
    c:
      en: |-
        A cross-region replica is asynchronous and serves region-level disaster recovery; switching to it is manual and can lose data.
    d:
      en: |-
        Restoring a backup loses up to 15 minutes of transactions and takes longer than a few minutes for most databases.
references:
  - title: "About high availability"
    url: https://docs.cloud.google.com/sql/docs/mysql/high-availability
