id: gcppca-1b-model-armor-prompt-screening
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A retailer runs a customer service agent built on Gemini Enterprise Agent Platform. A security review finds that users can embed instructions in their messages that make the agent ignore its rules, and that some responses contain customers' payment card numbers. The retailer wants a managed service that screens both prompts and responses for these risks and blocks them.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Configure Model Armor templates with the prompt injection and jailbreak filter and the sensitive data protection filter in inspect-and-block mode, and apply them to prompts and responses.
    - id: b
      text:
        en: |-
          Place the agent's endpoint behind Google Cloud Armor with preconfigured WAF rules that detect injection attacks.
    - id: c
      text:
        en: |-
          Create a VPC Service Controls perimeter around the project that hosts the agent and its data.
    - id: d
      text:
        en: |-
          Run Sensitive Data Protection inspection jobs on the conversation logs every night, and redact the card numbers that they find.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Model Armor screens the prompts sent to models and the responses they return, with filters for prompt injection and jailbreak attempts, sensitive data, malicious URLs and responsible AI categories. Templates choose the filters and thresholds and can inspect and block, and Model Armor integrates with Agent Platform.
  options:
    b:
      en: |-
        Cloud Armor WAF rules inspect HTTP requests for attack signatures; they do not understand instructions hidden in natural language and do not screen model responses.
    c:
      en: |-
        VPC Service Controls limits data exfiltration through Google APIs; it does not inspect prompt or response content.
    d:
      en: |-
        Nightly inspection of logs finds card numbers after they have been shown to users, and it does not block prompt injection.
references:
  - title: "Model Armor overview"
    url: https://docs.cloud.google.com/model-armor/overview
