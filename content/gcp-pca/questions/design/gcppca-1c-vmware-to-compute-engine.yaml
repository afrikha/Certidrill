id: gcppca-1c-vmware-to-compute-engine
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A publisher wants to move 150 VMware vSphere VMs to Google Cloud and run them as native Compute Engine instances so that it can stop paying for VMware licenses. The VMs must keep running on premises while their data is copied, and the downtime at cut-over must be short.

    What should you use?
body:
  options:
    - id: a
      text: { en: "Migrate to Virtual Machines, with continuous replication and a scheduled cut-over" }
    - id: b
      text: { en: "Google Cloud VMware Engine, with VMware HCX to move the VMs" }
    - id: c
      text: { en: "OVF exports of each VM, imported as Compute Engine images" }
    - id: d
      text: { en: "Transfer Appliance, to ship the VMDK files and create disks from them" }
answer: { optionId: a }
explanation:
  correct:
    en: Migrate to Virtual Machines replicates the disks of running source VMs to Google Cloud in the background, then creates Compute Engine instances at cut-over. Cut-over stops the source VM, runs a final replication and starts the instance, so downtime is short and can be scheduled in a maintenance window.
  options:
    b: { en: "VMware Engine runs the VMs on a VMware private cloud in Google Cloud, so the publisher keeps the VMware stack and does not get native Compute Engine instances." }
    c: { en: "Exporting and importing each VM is an offline copy with no continuous replication, so downtime lasts for the whole export, upload and import." }
    d: { en: "Shipping disk files is an offline transfer that takes days, so the copied data is stale and downtime is long." }
references:
  - title: VM migration process
    url: https://docs.cloud.google.com/migrate/virtual-machines/docs/5.0/concepts/lifecycle
