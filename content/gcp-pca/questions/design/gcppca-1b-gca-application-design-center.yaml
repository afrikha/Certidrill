id: gcppca-1b-gca-application-design-center
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A platform team wants developers to describe a new three-tier application in natural language, get a proposed architecture built from the organization's approved templates, and deploy the resulting application from the same tool.

    Which Google Cloud capability should the platform team use?
body:
  options:
    - id: a
      text:
        en: |-
          Application Design Center with Gemini Cloud Assist
    - id: b
      text:
        en: |-
          Gemini Cloud Assist investigations
    - id: c
      text:
        en: |-
          Flow Analyzer in Network Intelligence Center
    - id: d
      text:
        en: |-
          Active Assist recommenders
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Application Design Center lets platform teams publish approved templates in catalogs, and developers customize them into application drafts that they deploy. Gemini Cloud Assist adds natural language design, which builds a first architecture from the developers' requirements in Application Design Center. Application Design Center is generally available, while Gemini Cloud Assist is a Preview offering.
  options:
    b:
      en: |-
        Investigations perform root-cause analysis of problems in running resources; they do not design or deploy applications.
    c:
      en: |-
        Flow Analyzer analyzes network traffic flows of existing resources.
    d:
      en: |-
        Recommenders suggest optimizations for existing resources; they do not design new applications from templates.
references:
  - title: "Application Design Center overview"
    url: https://docs.cloud.google.com/application-design-center/docs/overview
  - title: "Gemini Cloud Assist overview"
    url: https://docs.cloud.google.com/cloud-assist/overview
