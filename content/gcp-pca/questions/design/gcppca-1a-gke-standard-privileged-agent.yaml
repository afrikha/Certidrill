id: gcppca-1a-gke-standard-privileged-agent
objective: "1.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company must run a third-party runtime security agent as a DaemonSet on every Kubernetes node. The agent needs privileged containers and access to host namespaces, and its vendor isn't a verified Google Cloud partner for GKE Autopilot. The other workloads are stateless microservices, and the company otherwise wants the lowest node-management overhead it can get.

    Which design should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          A GKE Autopilot cluster, with the security agent deployed as a DaemonSet in the kube-system namespace
    - id: b
      text:
        en: |-
          A GKE Standard cluster with node auto-provisioning and auto-upgrade, running the agent as a privileged DaemonSet
    - id: c
      text:
        en: |-
          A GKE Autopilot cluster created with the workload policy that allows the NET_ADMIN capability for the agent
    - id: d
      text:
        en: |-
          Cloud Run services for the microservices, with the security agent added to each service as a sidecar container
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Autopilot blocks privileged containers and host namespaces, except for workloads of verified Google Cloud partners, so this agent can only run on a Standard cluster. Enabling auto-upgrade and node auto-provisioning keeps node management as low as possible while allowing the privileged DaemonSet.
  options:
    a:
      en: |-
        Autopilot enforces its security measures whatever the namespace that you choose, so the privileged agent is rejected in kube-system too.
    c:
      en: |-
        Allowing NET_ADMIN adds one Linux capability; it doesn't permit privileged containers or host namespaces.
    d:
      en: |-
        Cloud Run doesn't give containers privileged access to the host, and the requirement is an agent on every Kubernetes node.
references:
  - title: "GKE Autopilot security measures | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-security
  - title: "Compare features in Autopilot and Standard clusters | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/resources/autopilot-standard-feature-comparison
