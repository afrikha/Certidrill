id: gcppca-1a-apigee-partner-products
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company wants to open its shipment-tracking APIs to about 300 partner companies. Partners must sign up in a portal, read the API documentation, register apps to get API keys, and choose between a free plan limited to 1,000 calls a day and a premium plan with a higher quota. The company wants usage analytics for each partner and plans to add OAuth 2.0 later.

    Which solution should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          API Gateway with an OpenAPI specification, and API keys created in the Google Cloud console for each partner
    - id: b
      text:
        en: |-
          Apigee, with a free and a premium API product that set different quotas, published in an Apigee developer portal
    - id: c
      text:
        en: |-
          A global external Application Load Balancer, with Cloud Armor rate-limiting rules for the IP ranges of each partner
    - id: d
      text:
        en: |-
          Cloud Run functions that check a partner token stored in Secret Manager and count each partner's calls in Firestore
answer: { optionId: b }
explanation:
  correct:
    en: |-
      In Apigee, API products bundle API operations with quota settings, so a free and a premium product can offer different request limits. Public products are offered to developers through a developer portal, where they register apps and receive keys for the products, and Apigee analytics reports usage; OAuth 2.0 policies can be added later in the proxies.
  options:
    a:
      en: |-
        API Gateway can require API keys, but it has no self-service developer portal and no API products with per-plan quotas, so key management and plans would be manual.
    c:
      en: |-
        Cloud Armor rate limits by client traffic characteristics; it provides no developer sign-up, documentation, API keys or per-partner analytics.
    d:
      en: |-
        Building token checks, quotas and usage counting in functions is custom API management code that the company would have to develop and operate.
references:
  - title: "Introduction to API products | Apigee | Google Cloud Documentation"
    url: https://docs.cloud.google.com/apigee/docs/api-platform/publish/what-api-product
  - title: "Developer portal solutions | Apigee | Google Cloud Documentation"
    url: https://docs.cloud.google.com/apigee/docs/api-platform/publish/intro-portals
