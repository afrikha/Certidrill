id: gcppca-1c-hybrid-dns
objective: "1.4.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company connects its data center to a VPC network with HA VPN. Compute Engine VMs must resolve names in the on-premises zone corp.example.com, and on-premises servers must resolve records in the Cloud DNS private zone gcp.example.com. The VMs must keep resolving Compute Engine internal DNS names and public names through Cloud DNS.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a DNS server policy with alternative name servers that sends every VM query to the on-premises DNS servers" } }
    - { id: b, text: { en: "Create a Cloud DNS forwarding zone for corp.example.com that targets the on-premises DNS servers" } }
    - { id: c, text: { en: "Create a DNS peering zone for corp.example.com that targets the VPC network" } }
    - { id: d, text: { en: "Create a DNS server policy with inbound forwarding and point on-premises forwarders for gcp.example.com at it" } }
    - { id: e, text: { en: "Publish gcp.example.com as a Cloud DNS public zone so that on-premises servers can resolve it" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: A forwarding zone sends only queries for corp.example.com to the on-premises DNS servers, so Cloud DNS still answers internal and public names; the on-premises side must allow and route the Cloud DNS source range 35.199.192.0/19. A server policy with inbound forwarding creates entry points in the VPC network that on-premises resolvers forward gcp.example.com queries to, giving them access to the private zone.
  options:
    a: { en: "Alternative name servers receive all VM queries, bypassing Cloud DNS, so the VMs lose the Compute Engine internal names; Google recommends a forwarding zone instead." }
    c: { en: "DNS peering lets one VPC network use the name resolution of another VPC network; it cannot target on-premises DNS servers." }
    e: { en: "A public zone publishes the internal records on the internet instead of resolving them privately over the VPN, which exposes internal names." }
references:
  - title: Best practices for Cloud DNS
    url: https://docs.cloud.google.com/dns/docs/best-practices
