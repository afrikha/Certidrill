id: gcppca-cs6a-eu-database-dr
objective: "1.2.2"
type: single
caseStudy: gcppca-cs6a-brindlewood-hr
difficulty: 3
status: draft
stem:
  en: |
    You are designing the disaster recovery of the AlloyDB for PostgreSQL database of EU customers, whose primary cluster runs in `europe-west3`. The design must meet the business requirements for data location and for the loss of a region.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Configure a high-availability primary instance and a read pool instance in the primary cluster, so that AlloyDB fails over automatically to the standby when its zone fails." } }
    - { id: b, text: { en: "Create a secondary cluster in `europe-west1` that replicates from the primary cluster, and promote the secondary cluster to a primary cluster if `europe-west3` becomes unavailable." } }
    - { id: c, text: { en: "Create a secondary cluster in `europe-west1` that replicates from the primary cluster, and run a switchover to the secondary cluster if `europe-west3` becomes unavailable." } }
    - { id: d, text: { en: "Export the database every night to a bucket in the EU multi-region, and import the latest export into a new cluster in `europe-west1` if `europe-west3` becomes unavailable." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A secondary cluster in another region receives the changes of the primary cluster through asynchronous replication, so it stays close behind the primary, and both regions are in the European Union. If `europe-west3` fails, promoting the secondary turns it into a standalone primary cluster that accepts reads and writes, which restores service well within 2 hours and loses only the writes that had not replicated yet.
  options:
    a:
      en: A high-availability instance protects against the failure of a zone; both zones are in `europe-west3`, so the loss of the region stops the database.
    c:
      en: A switchover reverses the roles of two healthy clusters for drills, failback or planned migrations, and requires both regions to be online; it cannot be used when the primary region is down.
    d:
      en: A nightly export can lose up to a day of data, far beyond 15 minutes, and importing a large database into a new cluster can exceed the 2-hour recovery time.
references:
  - title: Cross-region replication overview
    url: https://docs.cloud.google.com/alloydb/docs/cross-region-replication/about-cross-region-replication
  - title: Work with cross-region replication
    url: https://docs.cloud.google.com/alloydb/docs/cross-region-replication/work-with-cross-region-replication
