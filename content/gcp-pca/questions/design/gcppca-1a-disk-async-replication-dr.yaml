id: gcppca-1a-disk-async-replication-dr
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturer runs a stateful inventory application on three Compute Engine VMs that use Balanced Persistent Disks in europe-west1. The business continuity plan requires that the application can be recovered in europe-west4 after a regional outage, with a recovery point objective of a few minutes and a recovery time objective of less than one hour. The data disks of the three VMs must be recovered to the same point in time, and the application can't be modified.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Replicate the disks to europe-west4 with Asynchronous Replication, using one consistency group for the three disks.
    - id: b
      text:
        en: |-
          Create an hourly snapshot schedule for each disk, and store the snapshots in the EU multi-region storage location.
    - id: c
      text:
        en: |-
          Convert the disks to regional persistent disks that replicate synchronously across two zones of europe-west1.
    - id: d
      text:
        en: |-
          Create a machine image of each VM every night, and store all the machine images in the europe-west4 region.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Asynchronous Replication copies block storage between two regions of the same continent for active-passive disaster recovery, with a target RPO of about one minute. A consistency group keeps the replicated disks at a common point in time, and failing over consists of stopping replication and attaching the secondary disks to VMs in the secondary region, which fits an RTO of under an hour.
  options:
    b:
      en: |-
        Hourly snapshots give an RPO of up to an hour, and independent schedules don't guarantee that the three disks reflect the same point in time.
    c:
      en: |-
        Regional persistent disks protect against a zone failure inside europe-west1; they provide no copy in europe-west4 for a regional outage.
    d:
      en: |-
        Nightly machine images give an RPO of up to 24 hours, far more than a few minutes.
references:
  - title: "About Asynchronous Replication | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/disks/async-pd/about
