id: gcppca-1b-spanner-managed-autoscaler
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A company runs its order database on a Spanner Enterprise edition regional instance. Load follows a daily pattern, with peaks five times higher than the night-time load, and the team resizes the instance by hand twice a day. The company wants compute capacity to follow the load automatically, with a ceiling that caps cost, and it does not want to deploy or maintain any additional component.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Enable the Spanner managed autoscaler with minimum and maximum node limits and a high-priority CPU utilization target.
    - id: b
      text:
        en: |-
          Deploy the open source Autoscaler tool for Spanner on Cloud Run functions, triggered by Cloud Scheduler every few minutes.
    - id: c
      text:
        en: |-
          Create two Cloud Scheduler jobs that call the Spanner API to set the node count every morning and every evening.
    - id: d
      text:
        en: |-
          Migrate the database to Bigtable, and enable Bigtable autoscaling on the cluster.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The managed autoscaler is built into Spanner Enterprise and Enterprise Plus editions: it sizes the instance from high-priority CPU, total CPU and storage utilization targets, within the minimum and maximum you set. The maximum caps cost, and the 5x peak fits within the rule that the maximum can be at most 10 times the minimum.
  options:
    b:
      en: |-
        The open source Autoscaler works, but it adds functions, schedules and state to deploy and maintain, which the company wants to avoid.
    c:
      en: |-
        Fixed schedules do not follow the real load and still add jobs to maintain.
    d:
      en: |-
        Bigtable is not a relational database, so moving the order database would require a redesign of the application.
references:
  - title: "Managed autoscaler"
    url: https://docs.cloud.google.com/spanner/docs/managed-autoscaler
