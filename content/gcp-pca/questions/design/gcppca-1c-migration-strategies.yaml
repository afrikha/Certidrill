id: gcppca-1c-migration-strategies
objective: "1.4.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An insurer must leave its data center in four months. Workload A is a custom Java application on VMs that must move before the exit date with no code changes. Workload B is a commercial CRM installed on premises; its vendor now offers a SaaS edition that meets the insurer's requirements. Leadership wants the least migration effort for both workloads.

    Which two migration approaches should you recommend? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Refactor workload A into microservices on GKE before the exit date" } }
    - { id: b, text: { en: "Rehost workload A on Compute Engine with Migrate to Virtual Machines" } }
    - { id: c, text: { en: "Rebuild workload B as a custom application on Cloud Run" } }
    - { id: d, text: { en: "Replatform workload A into containers on GKE Autopilot" } }
    - { id: e, text: { en: "Repurchase workload B by moving to the vendor's SaaS edition" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: Rehosting (lift and shift) moves a workload with minimal or no changes and is the fastest approach, which fits the deadline and the no-code-change rule for workload A. Repurchasing replaces purchased on-premises software with an equivalent SaaS offering, which removes the need to migrate workload B's infrastructure at all.
  options:
    a: { en: "Refactoring changes the code and takes longer, which breaks the no-code-change rule and endangers the deadline." }
    c: { en: "Rebuilding a commercial CRM from scratch is the most effort of all approaches when an equivalent SaaS edition exists." }
    d: { en: "Replatforming into containers takes more work and testing than rehosting, which does not meet the least-effort goal under a fixed deadline." }
references:
  - title: "Migrate to Google Cloud: Get started"
    url: https://docs.cloud.google.com/architecture/migration-to-gcp-getting-started
