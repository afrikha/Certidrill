id: gcppca-1c-autopilot-autoclass
objective: "1.5.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company is reviewing its platform for improvements. Its GKE Standard clusters average 35 % node utilization, and the team spends time sizing node pools and planning upgrades. Separately, a 2 PB Cloud Storage bucket holds assets whose access is unpredictable: old assets sometimes become popular again. The company wants to cut operational effort and storage cost without having to predict access patterns.

    Which two changes should you recommend? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable the cluster autoscaler on each node pool of the Standard clusters" } }
    - { id: b, text: { en: "Add a lifecycle rule that moves every object to Archive storage after 30 days" } }
    - { id: c, text: { en: "Move the workloads to GKE Autopilot clusters" } }
    - { id: d, text: { en: "Enable Autoclass on the bucket" } }
    - { id: e, text: { en: "Change the default storage class of the bucket to Coldline" } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: In Autopilot, Google manages the nodes, their scaling and upgrades, and general-purpose Pods are billed for what they request rather than for underused nodes. Autoclass moves each object to colder classes when it is not read and back to Standard storage when it is read, with retrieval and early deletion fees generally waived, so cost follows real access without predictions.
  options:
    a: { en: "The cluster autoscaler adjusts node counts, but the team still manages node pools and upgrades, which does not remove the operational work." }
    b: { en: "Archive storage has a 365-day minimum duration and retrieval fees, which become costly when old assets are read again." }
    e: { en: "The default class only applies to new objects that specify no class, and Coldline retrieval fees and its 90-day minimum penalize assets that become popular again." }
references:
  - title: GKE Autopilot overview
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview
  - title: Autoclass
    url: https://docs.cloud.google.com/storage/docs/autoclass
