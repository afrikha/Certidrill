id: gcppca-1a-requester-pays-dataset
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A genomics institute shares a 1 PB reference dataset in a Cloud Storage bucket with researchers from other universities, who read large parts of it from their own Google Cloud projects. The network charges for these reads now exceed the institute's storage costs. The institute wants to keep sharing the data from the same bucket while each research group pays for the data that it reads.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Enable Requester Pays on the bucket, and tell researchers to include their own billing project in their requests.
    - id: b
      text:
        en: |-
          Change the storage class of the dataset to Archive storage so that the institute pays less for each GB it stores.
    - id: c
      text:
        en: |-
          Put a global external Application Load Balancer with Cloud CDN in front of the bucket to cache the popular objects.
    - id: d
      text:
        en: |-
          Move the dataset to a multi-region bucket so that the researchers read the data from a location close to them.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With Requester Pays, the requester's billing project is charged for network usage and data processing (operations and retrieval) when it reads the data, while the bucket owner keeps paying only for storage. Requesters must specify a billing project in which they have the serviceusage.services.use permission, and they still need read permissions on the data.
  options:
    b:
      en: |-
        Archive storage lowers storage cost, which isn't the main expense, and adds retrieval fees that the institute would pay for every read.
    c:
      en: |-
        Cloud CDN can lower latency and origin reads, but the institute still pays for the data delivered to the researchers.
    d:
      en: |-
        Reads from a multi-region bucket always incur outbound data transfer charges, still billed to the institute.
references:
  - title: "Requester Pays | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/requester-pays
