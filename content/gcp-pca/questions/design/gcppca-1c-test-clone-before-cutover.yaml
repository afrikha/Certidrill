id: gcppca-1c-test-clone-before-cutover
objective: "1.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retailer is migrating an order processing VM from VMware to Compute Engine with Migrate to Virtual Machines. The first replication cycle has completed. Before cut-over, the team must test the migrated VM with a recent copy of its data, without stopping the source VM, and the test instance must not send messages to production systems.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Run the cut-over now, and restart the source VM to roll back if the tests fail" }
    - id: b
      text: { en: "Create a test-clone and attach it to a VPC network that is isolated from production" }
    - id: c
      text: { en: "Create a test-clone in the production VPC network with the source VM's IP address" }
    - id: d
      text: { en: "Pause replication, snapshot the replicated disks, and boot a VM from them in production" }
answer: { optionId: b }
explanation:
  correct:
    en: A test-clone is a Compute Engine instance created from the last completed replication cycle, while the source VM keeps running and replication continues. Placing it in a network isolated from production lets the team test the migrated VM without it reaching production systems.
  options:
    a: { en: "Cut-over shuts down the source VM and runs a final replication, which causes downtime before any test has been run." }
    c: { en: "In the production network, the test instance could reach production systems, and reusing the source VM's address creates a conflict." }
    d: { en: "Pausing replication and building VMs from snapshots replaces the built-in test-clone step, and booting in production breaks the isolation requirement." }
references:
  - title: Migrate individual VMs
    url: https://docs.cloud.google.com/migrate/virtual-machines/docs/5.0/migrate/migrating-vms
