id: gcppca-cs4a-adt-event-hub
objective: "1.1.6"
type: single
caseStudy: gcppca-cs4a-marrowfield-health
difficulty: 3
status: draft
stem:
  en: |
    You are designing the clinical event hub. The design must meet the business requirement for bed boards and new applications, and the technical requirements for ADT messages.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Deploy the open source MLLP adapter on the GKE Autopilot cluster behind an internal load balancer, add it as an MLLP destination of the EHR, ingest the messages into an HL7v2 store, and give each consumer its own subscription to the Pub/Sub topic that receives the store's notifications." } }
    - { id: b, text: { en: "Deploy the open source MLLP adapter on the GKE Autopilot cluster behind an internal load balancer, add it as an MLLP destination of the EHR, ingest the messages into an HL7v2 store, and have BedView and each new application list the new messages of the store every 10 seconds." } }
    - { id: c, text: { en: "Add a Cloud Run function with an HTTP trigger as a destination of the EHR's interface engine, have the function publish each message to a Pub/Sub topic, and give each consumer its own subscription to the topic." } }
    - { id: d, text: { en: "Deploy the open source MLLP adapter on the GKE Autopilot cluster behind an internal load balancer, add it as an MLLP destination of the EHR, and configure the adapter to forward each message over MLLP to BedView and then to each new application." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The MLLP adapter receives HL7v2 messages over MLLP from on-premises systems and calls the Cloud Healthcare API to ingest each one into an HL7v2 store, so the only change to the EHR is a new MLLP destination. The store durably keeps every message and sends a Pub/Sub notification when a message is ingested; each consumer reads its own subscription, so bed boards are updated within seconds and new applications are added by creating a subscription, without changing the EHR or the other consumers.
  options:
    b:
      en: Polling the store couples each consumer to the store's API and adds load and delay; it is custom code that the Pub/Sub notifications of the store make unnecessary.
    c:
      en: The interface engine sends HL7v2 over MLLP, a TCP framing protocol, not HTTP requests, and the vendor allows no change other than an MLLP destination, so the function would never receive the messages.
    d:
      en: Chaining the consumers behind the adapter couples them to each other and to the adapter's configuration, and no copy of the messages is stored, so a consumer that is down loses messages.
references:
  - title: Transmitting HL7v2 messages over TCP/IP connections
    url: https://docs.cloud.google.com/healthcare-api/docs/how-tos/mllp-adapter
