id: gcppca-1a-error-budget-minutes
objective: "1.1.10"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    The product team of an internal API sets an availability SLO of 99.9%, measured over a 30-day compliance period. To explain the target to business stakeholders, you express the error budget as the total time that the API can be completely unavailable during the period.

    How much downtime does the error budget allow?
body:
  options:
    - id: a
      text:
        en: |-
          About 4.3 minutes
    - id: b
      text:
        en: |-
          About 43 minutes
    - id: c
      text:
        en: |-
          About 7.2 hours
    - id: d
      text:
        en: |-
          About 43 hours
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The error budget is (1 − SLO goal) multiplied by what is measured over the compliance period. A 30-day period has 43,200 minutes, and 0.1% of 43,200 minutes is 43.2 minutes of complete unavailability.
  options:
    a:
      en: |-
        4.3 minutes corresponds to a 99.99% SLO over 30 days, ten times stricter than the stated target.
    c:
      en: |-
        7.2 hours corresponds to a 99% SLO over 30 days, ten times looser than the stated target.
    d:
      en: |-
        43 hours corresponds to about 94% availability over 30 days.
references:
  - title: "Concepts in service monitoring | Google Cloud Observability | Google Cloud Documentation"
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/slo-monitoring
