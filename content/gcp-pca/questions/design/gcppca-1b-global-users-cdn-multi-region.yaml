id: gcppca-1b-global-users-cdn-multi-region
objective: "1.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A news company serves its website from VMs in europe-west1 behind a global external Application Load Balancer. Readers in Asia and the Americas report slow page loads. Images and scripts are the same for every reader, while article pages are generated for each reader. The company wants to reduce latency for all readers.

    Which actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Move the load balancer to Standard Tier so that traffic uses the internet path closest to each reader.
    - id: b
      text:
        en: |-
          Enable Cloud CDN on the backend service so that Google's edge locations cache the images and scripts.
    - id: c
      text:
        en: |-
          Create a Cloud NAT gateway in europe-west1 for the web VMs.
    - id: d
      text:
        en: |-
          Add managed instance groups in an Asian region and an American region to the same backend service so that pages are generated in the closest region.
    - id: e
      text:
        en: |-
          Change the web VMs in europe-west1 to a larger machine type.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Cloud CDN works with the global external Application Load Balancer and caches static content such as images and scripts close to readers. For the per-reader pages, which cannot be cached, backends in Asia and the Americas behind the same global load balancer let requests be served from the closest region with capacity.
  options:
    a:
      en: |-
        Standard Tier does not support global load balancing or Cloud CDN, and it carries more of the traffic over public ISP networks.
    c:
      en: |-
        Cloud NAT provides outbound connectivity for VMs; it does nothing for inbound reader traffic.
    e:
      en: |-
        Larger VMs do not reduce the network distance between Europe and readers in Asia or the Americas.
references:
  - title: "Cloud CDN overview"
    url: https://docs.cloud.google.com/cdn/docs/overview
  - title: "Network Service Tiers overview"
    url: https://docs.cloud.google.com/network-tiers/docs/overview
