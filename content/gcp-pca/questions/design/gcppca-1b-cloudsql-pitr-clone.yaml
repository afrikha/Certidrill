id: gcppca-1b-cloudsql-pitr-clone
objective: "1.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    At 14:05, a faulty release ran a DELETE statement without a WHERE clause on one table of a production Cloud SQL for MySQL instance. Automated backups and binary logging are enabled. Since then, the application has kept writing to the other tables. The team must recover the deleted rows as they were at 14:04 without losing the writes made to the other tables after 14:05.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Restore the latest automated backup to the production instance.
    - id: b
      text:
        en: |-
          Perform a point-in-time recovery of the production instance in place, to 14:04.
    - id: c
      text:
        en: |-
          Promote a read replica of the production instance, and point the application to it.
    - id: d
      text:
        en: |-
          Perform a point-in-time recovery to 14:04 into a new instance, and copy the deleted rows from it back into the production table.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Point-in-time recovery uses the backups and the binary logs to recover data to a timestamp, and it always creates a new instance. Recovering to 14:04 in a new instance gives the deleted rows, which the team copies back into the production table while the production instance keeps every write made since 14:05.
  options:
    a:
      en: |-
        Restoring a backup overwrites the instance and loses every change since the backup, including the writes to the other tables.
    b:
      en: |-
        Point-in-time recovery cannot target an existing instance; it always creates a new one.
    c:
      en: |-
        A read replica has already applied the DELETE statement, so it does not contain the deleted rows.
references:
  - title: "Perform point-in-time recovery (PITR)"
    url: https://docs.cloud.google.com/sql/docs/mysql/backup-recovery/pitr
