id: gcppca-1a-retail-analytics-bigquery
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company keeps 2 PB of sales history in an on-premises Hadoop cluster that is expensive to operate and to upgrade. Business analysts want to run ad hoc SQL queries on this history and connect their BI tool to it. The company's product strategy is to stop managing clusters and capacity planning for analytics.

    Which Google Cloud service should you recommend as the analytics platform?
body:
  options:
    - id: a
      text:
        en: |-
          BigQuery, with the sales history loaded into native tables
    - id: b
      text:
        en: |-
          Managed Service for Apache Spark (formerly Dataproc) clusters that run Hive on the history copied to Cloud Storage
    - id: c
      text:
        en: |-
          Cloud SQL for PostgreSQL, with read replicas for the analysts
    - id: d
      text:
        en: |-
          Bigtable, accessed through the HBase-compatible client library
answer: { optionId: a }
explanation:
  correct:
    en: |-
      BigQuery is a fully managed, serverless data warehouse: there is no infrastructure to provision or scale, it runs standard SQL over very large datasets, and it integrates with BI tools such as Looker, Tableau and Power BI. It matches both the use case (ad hoc SQL on petabytes) and the strategy of not managing clusters.
  options:
    b:
      en: |-
        Managed Service for Apache Spark is managed Hadoop and Spark, but the company still creates, sizes and operates clusters, which contradicts the goal of stopping cluster management.
    c:
      en: |-
        Cloud SQL is a transactional relational database; it is not designed for analytical scans over petabytes of history, and instances must still be sized.
    d:
      en: |-
        Bigtable is a low-latency key-value store for operational workloads; it is not an interactive SQL analytics platform for BI tools.
references:
  - title: "BigQuery overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/introduction
