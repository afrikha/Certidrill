id: gcppca-cs3b-portal-compute
objective: "1.3.6"
type: single
caseStudy: gcppca-cs3b-norvale-revenue
difficulty: 1
status: draft
stem:
  en: |
    You need to choose the platform for the e-filing portal services. The platform must meet the business requirement for the portal and the technical requirement for the portal services.

    Which platform should you recommend?
body:
  options:
    - { id: a, text: { en: "A GKE Standard cluster with the cluster autoscaler and a Horizontal Pod Autoscaler for each service" } }
    - { id: b, text: { en: "Managed instance groups of Container-Optimized OS VMs that autoscale on CPU utilization" } }
    - { id: c, text: { en: "Cloud Run services, one for each portal service, that scale on incoming requests" } }
    - { id: d, text: { en: "A GKE Autopilot cluster with a Horizontal Pod Autoscaler for each service, which scales on CPU utilization" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Cloud Run is a fully managed platform that runs container images without a cluster to create or operate, and it adds and removes instances according to incoming requests, so the NRA pays in proportion to the traffic. Cloud Run services can sit behind a global external Application Load Balancer through serverless network endpoint groups.
  options:
    a:
      en: A Standard cluster requires the team to manage nodes and Kubernetes objects, which the team has no experience of and no one to operate.
    b:
      en: The team would operate the instance groups, the VM images and the scaling policies, and VMs take longer to scale out than request-based container instances.
    d:
      en: Autopilot manages the nodes, but the team would still operate a Kubernetes cluster and its workloads, which the business requirement excludes.
references:
  - title: What is Cloud Run
    url: https://docs.cloud.google.com/run/docs/overview/what-is-cloud-run
