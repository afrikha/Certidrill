id: gcppca-1a-dora-stability-kpis
objective: "1.1.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    After moving its platform to Google Cloud, a fintech company's leadership states that the next phase of the program will be judged on how rarely releases harm customers and how quickly service is restored when they do. Delivery speed isn't a goal of this phase. You must propose KPIs taken from the DORA software delivery metrics.

    Which two metrics should you propose? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Deployment frequency
    - id: b
      text:
        en: |-
          Change failure rate
    - id: c
      text:
        en: |-
          Lead time for changes
    - id: d
      text:
        en: |-
          Average CPU utilization of production clusters
    - id: e
      text:
        en: |-
          Time to restore service after a failed change
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Change failure rate measures how often a release causes a failure in production, and time to restore measures how quickly service recovers from such a failure. These two DORA metrics describe stability, which is exactly what leadership wants to judge, and the Well-Architected Framework cites them to balance efficiency with agility.
  options:
    a:
      en: |-
        Deployment frequency measures how often the team releases, which is delivery speed, a goal excluded from this phase.
    c:
      en: |-
        Lead time for changes measures how fast a change reaches production, another speed metric that leadership excluded.
    d:
      en: |-
        CPU utilization is a resource metric, not a DORA metric, and it says nothing about the impact of releases on customers.
references:
  - title: "Align cloud spending with business value | Cloud Architecture Center | Google Cloud Documentation"
    url: https://docs.cloud.google.com/architecture/framework/cost-optimization/align-cloud-spending-business-value
