id: gcppca-1a-retire-archive-locked
objective: "1.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An insurance company has a legacy claims archive application that runs on an unsupported operating system, and its vendor no longer exists. Three auditors use it a few times a year to look up closed claims, and they can do the same work from exported PDF and CSV files. Regulations require keeping the claim records unchanged and undeletable for 10 years. The company wants the lowest ongoing cost and effort.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Rehost the application on Compute Engine from a custom image, and stop the VM between audits to save compute costs.
    - id: b
      text:
        en: |-
          Retire the application, export the records to a bucket in Archive storage, and set and lock a 10-year retention policy.
    - id: c
      text:
        en: |-
          Retire the application, export the records to a bucket in Standard storage, and enable Object Versioning on the bucket.
    - id: d
      text:
        en: |-
          Rehost the application on Google Cloud VMware Engine so that the unsupported operating system doesn't need to change.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The application can be retired because the auditors only need the records. Archive storage is the cheapest storage class for data accessed less than once a year, with a 365-day minimum storage duration that 10 years of retention far exceeds, and it still serves data within milliseconds. A locked retention policy (Bucket Lock) prevents deleting or replacing objects before 10 years, and locking can't be undone.
  options:
    a:
      en: |-
        Rehosting keeps an unsupported operating system to secure and patch, disks are billed even while the VM is stopped, and nothing makes the records undeletable.
    c:
      en: |-
        Object Versioning keeps older versions, but users with the right permissions can still delete objects and versions, and Standard storage is the most expensive class for rarely read data.
    d:
      en: |-
        VMware Engine runs dedicated private cloud infrastructure, far more costly than storing files, and it doesn't make the records undeletable.
references:
  - title: "Bucket Lock | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/bucket-lock
  - title: "Storage classes | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/storage-classes
