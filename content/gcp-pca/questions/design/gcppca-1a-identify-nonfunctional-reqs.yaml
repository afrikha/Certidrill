id: gcppca-1a-identify-nonfunctional-reqs
objective: "1.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are collecting requirements for a new claims-processing system at an insurance company. The stakeholders gave you the following list, and you must separate functional from non-functional requirements before you design the architecture.

    Which two items are non-functional requirements? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          The system must return claim status pages to 95% of users in less than 300 ms.
    - id: b
      text:
        en: |-
          Customers must be able to upload photos of the damage to an existing claim.
    - id: c
      text:
        en: |-
          Adjusters must be able to approve or reject a claim and add a comment to it.
    - id: d
      text:
        en: |-
          The system must keep serving requests when one zone of the region becomes unavailable.
    - id: e
      text:
        en: |-
          The system must send an email to the customer when the status of a claim changes.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Non-functional requirements describe qualities of the system rather than what it does: a latency target for 95% of requests is a performance requirement, and surviving the loss of a zone is an availability requirement. Both translate into measurable objectives (latency and availability SLIs) that drive architecture choices such as caching or multi-zone deployment.
  options:
    b:
      en: |-
        Uploading photos to a claim is a capability that users need, so it is a functional requirement.
    c:
      en: |-
        Approving or rejecting a claim is a business function performed by the system, so it is a functional requirement.
    e:
      en: |-
        Sending an email on a status change is a behavior of the system, so it is a functional requirement.
references:
  - title: "Concepts in service monitoring | Google Cloud Observability | Google Cloud Documentation"
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/slo-monitoring
