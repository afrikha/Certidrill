id: gcppca-1c-onprem-private-google-apis
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A manufacturer connects its data center to a VPC network with Dedicated Interconnect and Cloud Router. On-premises servers have no internet access, and they must upload files to Cloud Storage through the Interconnect connection. VPC Service Controls is not used, and the VPC network keeps its default route to the internet gateway.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Advertise 199.36.153.8/30 from Cloud Router and resolve googleapis.com to it in on-premises DNS" }
    - id: b
      text: { en: "Create a Cloud NAT gateway in the Interconnect region and route on-premises traffic to it" }
    - id: c
      text: { en: "Configure private services access to peer the VPC network with the Google services network" }
    - id: d
      text: { en: "Enable Private Google Access on the subnets of the VPC network in the Interconnect region" }
answer: { optionId: a }
explanation:
  correct:
    en: Private Google Access for on-premises hosts uses the private.googleapis.com range, 199.36.153.8/30. Cloud Router announces that range to the data center with a custom route advertisement, and on-premises DNS resolves googleapis.com names to those addresses, so API traffic travels over the Interconnect. The VPC network needs a route to that range through the default internet gateway, which the existing default route provides.
  options:
    b: { en: "Cloud NAT translates outbound traffic of resources in the VPC network; it is not a private path for on-premises hosts to reach Google APIs." }
    c: { en: "Private services access connects a VPC network to service producer networks for services such as Cloud SQL; it does not provide access to Google APIs such as Cloud Storage." }
    d: { en: "Private Google Access on a subnet applies only to VMs in that subnet that have no external IP address; it does not give on-premises hosts a path to Google APIs." }
references:
  - title: Configure Private Google Access for on-premises hosts
    url: https://docs.cloud.google.com/vpc/docs/configure-private-google-access-hybrid
