id: gcppca-1a-rpo-zero-postgres-spanner
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company runs its order ledger on a self-managed PostgreSQL cluster and is designing its replacement on Google Cloud. The non-functional requirements are: keep accepting writes if an entire Google Cloud region fails, a recovery point objective of zero, and no manual promotion step during a regional failure. The developers want to keep the PostgreSQL JDBC driver and SQL dialect, and they accept some rework of the schema and primary keys.

    Which database design should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Spanner with a PostgreSQL-dialect database in a multi-region instance configuration
    - id: b
      text:
        en: |-
          AlloyDB for PostgreSQL with a secondary cluster in another region, promoted during an outage
    - id: c
      text:
        en: |-
          Cloud SQL for PostgreSQL with high availability and a cross-region read replica
    - id: d
      text:
        en: |-
          Cloud SQL for PostgreSQL with high availability and backups stored in a multi-region
answer: { optionId: a }
explanation:
  correct:
    en: |-
      In a Spanner multi-region configuration, writes are committed by a quorum of replicas spread over several regions, and if the default leader region fails, Spanner moves leadership to the other read-write region without affecting the application; the configuration has a 99.999% availability SLA. The PostgreSQL interface lets the application keep the PostgreSQL JDBC driver and dialect, with some rework such as primary key design.
  options:
    b:
      en: |-
        An AlloyDB secondary cluster replicates asynchronously and must be promoted, so an unplanned regional failure can lose recent writes and requires a manual step.
    c:
      en: |-
        High availability protects against a zone failure only; the cross-region replica is asynchronous and is promoted manually, so neither the RPO nor the no-manual-step requirement is met.
    d:
      en: |-
        Restoring from backups after a regional failure loses the changes made since the last backup and takes a long manual recovery.
references:
  - title: "Regional, dual-region, and multi-region configurations | Spanner | Google Cloud Documentation"
    url: https://docs.cloud.google.com/spanner/docs/instance-configurations
  - title: "PostgreSQL interface | Spanner | Google Cloud Documentation"
    url: https://docs.cloud.google.com/spanner/docs/postgresql-interface
