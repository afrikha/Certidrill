id: gcppca-1c-long-batch-container
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A genomics lab packages a nightly analysis as a container image. The container reads input files from Cloud Storage, runs for about four hours, writes its results, and exits; it does not serve HTTP requests. The lab wants the lowest operational overhead and does not want to maintain a cluster.

    Which option should you use?
body:
  options:
    - id: a
      text: { en: "A Cloud Run job, with the task timeout raised and the job run nightly by Cloud Scheduler" }
    - id: b
      text: { en: "A Cloud Run service, with the request timeout set to its maximum and called nightly by Cloud Scheduler" }
    - id: c
      text: { en: "A Cloud Run function, with an HTTP trigger called nightly by Cloud Scheduler" }
    - id: d
      text: { en: "A GKE Autopilot cluster, with the analysis defined as a Kubernetes CronJob" }
answer: { optionId: a }
explanation:
  correct:
    en: Cloud Run jobs run containers that do their work and exit, without serving requests. A task can run for up to 168 hours (the default timeout of 10 minutes must be raised), and jobs can run on a schedule, with no cluster to maintain.
  options:
    b: { en: "Cloud Run services are for request-driven workloads, and a request cannot stay open for four hours: the maximum request timeout is 60 minutes." }
    c: { en: "Cloud Run functions handle events and HTTP requests with a timeout of up to 60 minutes, which is too short for a four-hour run." }
    d: { en: "Autopilot manages the nodes, but the lab still owns a cluster to create, upgrade and secure, which it wants to avoid." }
references:
  - title: Create jobs
    url: https://docs.cloud.google.com/run/docs/create-jobs
  - title: Compare Cloud Run functions
    url: https://docs.cloud.google.com/run/docs/functions/comparison
