id: gcppca-1a-crypto-shredding-tenant-keys
objective: "1.1.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A SaaS company stores each customer's documents in Cloud Storage and their metadata in BigQuery, and it keeps backups of both for one year. New contracts require that, when a customer leaves, all of that customer's data, including the copies in backups, becomes unreadable within 60 days, and the company must be able to show how this is enforced. Finding and deleting each copy in every backup is impractical.

    What should you design?
body:
  options:
    - id: a
      text:
        en: |-
          Encrypt all customers' data and backups with one Cloud KMS key, and rotate that key each time a customer leaves.
    - id: b
      text:
        en: |-
          Rely on Google's default encryption, and delete the customer's objects and table rows when the customer leaves.
    - id: c
      text:
        en: |-
          Use customer-supplied encryption keys for all the data, and ask each customer to keep its own key outside Google Cloud.
    - id: d
      text:
        en: |-
          Protect each customer's data and backups with a dedicated Cloud KMS key, and destroy its key versions when the customer leaves.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With one customer-managed key per customer, destroying the key versions makes every copy encrypted with them unreadable, including backups, a technique called crypto-shredding. Destruction is scheduled, by default 30 days, with a custom duration possible; after that period the key material can't be recovered, which meets the 60-day requirement and gives an auditable control.
  options:
    a:
      en: |-
        Rotation creates a new primary key version but keeps the older versions to decrypt existing data, so the departed customer's data stays readable.
    b:
      en: |-
        Deleting the live objects and rows leaves the copies in the backups readable, and default encryption gives the company no key it can destroy per customer.
    c:
      en: |-
        Customer-supplied encryption keys are a Cloud Storage feature, so they can't protect the BigQuery metadata, and making customers manage keys doesn't let the company enforce the deletion itself.
references:
  - title: "Destroy and restore key versions | Cloud Key Management Service | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kms/docs/destroy-restore
