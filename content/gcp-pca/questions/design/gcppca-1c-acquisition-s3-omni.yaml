id: gcppca-1c-acquisition-s3-omni
objective: "1.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail group that uses BigQuery acquires a company whose 800 TB of sales data is stored in Amazon S3 in the us-east-1 region. A contract requires the acquired data to stay in AWS for two years. Analysts must query the data with SQL and combine the aggregated results with sales data already in BigQuery.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Copy the data to Cloud Storage with Storage Transfer Service and query it through BigQuery external tables" }
    - id: b
      text: { en: "Load the data into BigQuery tables with a BigQuery Data Transfer Service transfer from Amazon S3" }
    - id: c
      text: { en: "Replicate the data from Amazon S3 into BigQuery with a Datastream stream" }
    - id: d
      text: { en: "Create BigLake tables over the S3 data with BigQuery Omni and query them from BigQuery" }
answer: { optionId: d }
explanation:
  correct:
    en: BigQuery Omni runs BigQuery queries where the data resides, in AWS regions such as us-east-1, through BigLake tables that reference the S3 bucket. The data stays in AWS, and cross-cloud joins or result transfers bring only the needed results back to combine with BigQuery data.
  options:
    a: { en: "Copying the data into Cloud Storage moves it out of AWS, which the contract forbids." }
    b: { en: "A Data Transfer Service transfer copies the data into BigQuery storage, which takes it out of AWS." }
    c: { en: "Datastream replicates changes from databases and SaaS sources, not files in S3, and it would also copy the data out of AWS." }
references:
  - title: Introduction to BigQuery Omni
    url: https://docs.cloud.google.com/bigquery/docs/omni-introduction
