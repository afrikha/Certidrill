id: gcppca-cs2a-telemetry-pipeline
objective: "1.3.4"
type: multi
caseStudy: gcppca-cs2a-emberfall
difficulty: 2
status: draft
stem:
  en: |
    You are designing the telemetry platform of Shardline 2. The game servers will send each gameplay event as soon as it occurs. The platform must meet the technical requirements for telemetry and support the business requirement for cheat detection.

    Which two components should you include in the design? (Choose two.)
body:
  options:
    - id: a
      text: { en: "A Pub/Sub topic to which the game servers publish every gameplay event, with a subscription from which the processing layer reads the events" }
    - id: b
      text: { en: "A BigQuery subscription that writes the events directly to a BigQuery table, where the anti-cheat system queries the one-minute aggregates" }
    - id: c
      text: { en: "A Dataflow streaming pipeline that computes the one-minute per-player aggregates for the anti-cheat system and writes the raw events to BigQuery" }
    - id: d
      text: { en: "A Managed Service for Apache Airflow (formerly Cloud Composer) environment that runs a workflow every minute to load the event files from Cloud Storage into BigQuery" }
    - id: e
      text: { en: "A Cloud Run function triggered by each event that updates per-player counters in a Cloud SQL database read by the anti-cheat system" }
  choose: 2
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: "Pub/Sub ingests the event stream at very high throughput without any server to manage. A Dataflow streaming pipeline reads the topic, aggregates the events per player over one-minute windows with low latency, and also writes the raw events to BigQuery. Dataflow is fully managed and processes every record exactly once by default, which meets the counting requirement."
  options:
    b: { en: "A BigQuery subscription supports only lightweight single message transforms, not windowed aggregation, and it delivers at least once, so events could be counted twice." }
    d: { en: "Loading files on a schedule is micro-batch processing that adds file and workflow latency, and a Managed Service for Apache Airflow environment is an orchestration service, not a stream processor." }
    e: { en: "Invoking a function per event at 1.5 million events per second sends that many writes to a single Cloud SQL database, and retried invocations can count events twice." }
references:
  - title: BigQuery subscriptions
    url: https://docs.cloud.google.com/pubsub/docs/bigquery
  - title: Dataflow overview
    url: https://docs.cloud.google.com/dataflow/docs/overview
