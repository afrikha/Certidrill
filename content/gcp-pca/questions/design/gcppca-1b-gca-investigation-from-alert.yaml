id: gcppca-1b-gca-investigation-from-alert
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A Cloud Monitoring alerting policy fires when the error rate of a Cloud Run service exceeds 5%. The on-call engineer wants an AI-assisted root-cause analysis that examines the service's logs, metrics and configuration, and that proposes probable causes with links to the supporting data. Gemini Cloud Assist is set up in the project, and the organization has access to investigations.

    What should the engineer do?
body:
  options:
    - id: a
      text:
        en: |-
          Ask Gemini Cloud Assist in the chat panel to generate Terraform code that redeploys the service.
    - id: b
      text:
        en: |-
          Open FinOps Hub, and review the AI-drafted summary of the service's costs and waste.
    - id: c
      text:
        en: |-
          Start a Gemini Cloud Assist investigation from the alert's Investigate button, and review its observations and hypotheses.
    - id: d
      text:
        en: |-
          Create a log-based metric for the errors, and add it to a custom dashboard.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Gemini Cloud Assist investigations perform AI-driven root-cause analysis over logs, configurations and metrics. An Investigate button appears on alerts that have a resource label, and the result lists ranked observations with links to the source data, probable causes as hypotheses, and recommended next steps. Gemini Cloud Assist is a Preview offering.
  options:
    a:
      en: |-
        Generating infrastructure code does not analyze why the service fails, and redeploying could hide the cause.
    b:
      en: |-
        FinOps Hub analyzes costs and waste, not errors in a running service.
    d:
      en: |-
        A dashboard shows the error rate the alert already reported; it does not diagnose the cause.
references:
  - title: "Troubleshoot issues with Gemini Cloud Assist investigations"
    url: https://docs.cloud.google.com/cloud-assist/investigations
