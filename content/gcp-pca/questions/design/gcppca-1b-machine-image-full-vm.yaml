id: gcppca-1b-machine-image-full-vm
objective: "1.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    Before a risky operating system upgrade, an administrator must back up a Compute Engine VM that has a boot disk and three data disks. If the upgrade fails, the administrator wants to recreate the VM with the data of all four disks and with its configuration, metadata and permissions, in a single operation.

    What should the administrator create?
body:
  options:
    - id: a
      text:
        en: |-
          A machine image of the VM
    - id: b
      text:
        en: |-
          A custom image of the boot disk
    - id: c
      text:
        en: |-
          An instance template based on the VM
    - id: d
      text:
        en: |-
          A standard snapshot of the boot disk
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A machine image stores all the configuration, metadata, permissions and data from the multiple disks of a VM, and it is meant for backup and recovery and for cloning instances. Compute Engine recommends machine images rather than disk snapshots when you need to back up an entire VM or several disks at once.
  options:
    b:
      en: |-
        A custom image captures one disk to create boot disks; it does not contain the data disks or the VM configuration.
    c:
      en: |-
        An instance template stores the VM configuration but none of the disk data.
    d:
      en: |-
        A snapshot backs up a single disk without the VM configuration, so recreating the VM would need several manual steps.
references:
  - title: "Machine images"
    url: https://docs.cloud.google.com/compute/docs/machine-images
  - title: "About archive and standard disk snapshots"
    url: https://docs.cloud.google.com/compute/docs/disks/snapshots
