id: gcppca-1c-flexible-cud
objective: "1.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A SaaS provider's baseline compute spend is steady at about $40,000 per month, split across Compute Engine VMs, GKE Autopilot workloads and Cloud Run services. Over the next three years, the platform team expects to change machine series and to move workloads between these products. Finance wants a discount on the baseline without tying it to specific machine types.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Buy a 3-year Compute flexible committed use discount sized to the steady baseline spend" }
    - id: b
      text: { en: "Buy 3-year resource-based committed use discounts for the current machine series in each region" }
    - id: c
      text: { en: "Rely on sustained use discounts for the baseline and avoid any commitment" }
    - id: d
      text: { en: "Move the baseline workloads to Spot VMs to obtain the largest discount" }
answer: { optionId: a }
explanation:
  correct:
    en: Compute flexible committed use discounts are spend-based commitments that apply to hourly spend on Compute Engine, GKE and Cloud Run, so they follow the workloads when machine series or products change. A 3-year term gives a deeper discount than a 1-year term for a baseline that is expected to stay steady.
  options:
    b: { en: "Resource-based commitments cover specific Compute Engine resources in a region and do not apply to GKE Autopilot or Cloud Run, so they do not fit a changing mix." }
    c: { en: "Sustained use discounts apply only to some Compute Engine resources and are smaller than a 3-year commitment for steady usage; they give nothing for Cloud Run." }
    d: { en: "Spot VMs can be preempted at any time and have no SLA, which does not suit a production baseline, and they do not apply to Cloud Run services." }
references:
  - title: Committed use discounts (CUDs) for Compute Engine
    url: https://docs.cloud.google.com/compute/docs/instances/committed-use-discounts-overview
