id: gcppca-1c-first-mover-workload
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company has assessed 60 workloads for migration to Google Cloud. Its operations team has little cloud experience and wants the first migration to build skills and reusable patterns without putting core operations at risk.

    Which workload should you migrate first?
body:
  options:
    - id: a
      text: { en: "The order management system, because it is the most critical workload and shows value fastest" }
    - id: b
      text: { en: "A legacy tool on an unusual operating system that has unique migration requirements" }
    - id: c
      text: { en: "The central data warehouse, because 25 other workloads depend on it and can follow it" }
    - id: d
      text: { en: "A stateless internal reporting app that has few dependencies and tolerates a short cut-over" }
answer: { optionId: d }
explanation:
  correct:
    en: Google's migration guidance recommends first-mover workloads that are not business critical, have the fewest dependencies, need minimal changes and can absorb downtime during cut-over. Stateless workloads are good candidates because they rarely need data migration, so the team learns the process at low risk.
  options:
    a: { en: "Starting with the most critical workload exposes the main line of business while the team is still learning." }
    b: { en: "Edge cases teach few patterns that apply to the other workloads, so they make poor first movers." }
    c: { en: "A workload with many dependents is complex to move and its problems spread to 25 other workloads." }
references:
  - title: "Migrate to Google Cloud: Assess and discover your workloads"
    url: https://docs.cloud.google.com/architecture/migration-to-gcp-assessing-and-discovering-your-workloads
