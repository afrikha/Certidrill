id: gcppca-cs1a-transcoding-compute
objective: "1.3.7"
type: single
caseStudy: gcppca-cs1a-lumora-streaming
difficulty: 1
status: draft
stem:
  en: |
    You are designing the compute platform for transcoding on Google Cloud. The design must meet the business and technical requirements for transcoding.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Run the encoder container on a managed instance group of standard VMs sized for the largest studio batch, covered by a three-year committed use discount." } }
    - { id: b, text: { en: "Run the encoder container on a managed instance group of Spot VMs that autoscales on the number of chunk jobs waiting in the queue." } }
    - { id: c, text: { en: "Replace the encoder with the Transcoder API and submit one transcoding job for each chunk of every new title." } }
    - { id: d, text: { en: "Run the encoder container on sole-tenant nodes reserved for Lumora and scale the node group manually before each studio batch." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Chunk jobs are independent and simply retried when they fail, so the workload tolerates the preemption of Spot VMs, which are offered at a large discount and recommended for fault-tolerant batch processing. A managed instance group that autoscales on the queue backlog adds VMs when a batch arrives and removes them when the farm would be idle, so the cost follows the volume delivered while the proprietary encoder is kept.
  options:
    a:
      en: A committed use discount is a fixed commitment for capacity sized for the peak, which stays idle about 70 % of the time; the cost does not follow the volume of titles.
    c:
      en: The technical requirements keep the proprietary per-title encoder, which a managed transcoding API would replace.
    d:
      en: Sole-tenant nodes are dedicated hosts for isolation or licensing needs that the case does not have; they cost more and manual scaling does not follow the irregular batches.
references:
  - title: Spot VMs
    url: https://docs.cloud.google.com/compute/docs/instances/spot
