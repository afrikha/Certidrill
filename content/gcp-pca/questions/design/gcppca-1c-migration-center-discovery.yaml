id: gcppca-1c-migration-center-discovery
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A distributor runs 900 VMs in two on-premises VMware data centers. Before committing to a migration, leadership wants an inventory of the servers, the dependencies between applications, and a total cost of ownership comparison with Google Cloud.

    Which Google Cloud offering should you use first?
body:
  options:
    - id: a
      text: { en: "Migrate to Virtual Machines" }
    - id: b
      text: { en: "Google Cloud VMware Engine" }
    - id: c
      text: { en: "Migration Center" }
    - id: d
      text: { en: "Database Migration Service" }
answer: { optionId: c }
explanation:
  correct:
    en: Migration Center is Google Cloud's assessment and planning hub. It discovers on-premises assets automatically or from uploaded data, identifies application and network dependencies, and produces cost estimates and total cost of ownership reports before any workload moves.
  options:
    a: { en: "Migrate to Virtual Machines replicates and moves VMs to Compute Engine; it is an execution tool, not an inventory and TCO assessment tool." }
    b: { en: "Google Cloud VMware Engine is a target platform for running VMware workloads; it does not assess the current estate or produce TCO reports." }
    d: { en: "Database Migration Service migrates databases; it does not inventory servers or compare total costs." }
references:
  - title: Migration Center overview
    url: https://docs.cloud.google.com/migration-center/docs/migration-center-overview
