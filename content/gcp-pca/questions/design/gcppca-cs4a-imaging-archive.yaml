id: gcppca-cs4a-imaging-archive
objective: "1.3.5"
type: single
caseStudy: gcppca-cs4a-marrowfield-health
difficulty: 2
status: draft
stem:
  en: |
    You are designing the enterprise imaging archive. The design must meet the business requirements about the hospital archives and the cost of the archive, and the technical requirement for the archive.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Store the studies in a Cloud Storage bucket with Autoclass enabled, and run an open source DICOM server on the GKE Autopilot cluster that receives DIMSE transfers from the PACS and serves DICOMweb requests from the bucket." } }
    - { id: b, text: { en: "Store the studies in a DICOM store of the Cloud Healthcare API, receive the PACS transfers through the open source DICOM adapter on the GKE Autopilot cluster, and move studies older than two years to the Coldline storage class of the store." } }
    - { id: c, text: { en: "Store the studies on a Filestore instance mounted by the PACS servers over the HA VPN connection, and let the viewer read the files through a Cloud Run service that converts DICOMweb requests to file reads." } }
    - { id: d, text: { en: "Store the study metadata as ImagingStudy resources in a FHIR store of the Cloud Healthcare API, store the pixel data in a Cloud Storage bucket, and add a lifecycle rule that moves objects older than two years to Coldline." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A DICOM store of the Cloud Healthcare API is a managed archive that exposes DICOMweb operations to the viewer, and the open source DICOM adapter translates the DIMSE C-STORE transfers of the PACS into the API, so radiologists keep working at their PACS workstations. The store supports the Standard, Nearline, Coldline and Archive storage classes at the study, series or instance level, so rarely opened prior studies cost less while the viewer still retrieves them through the same DICOMweb API. The adapter is stateless and runs on the existing Autopilot cluster, which the technical requirements allow.
  options:
    a:
      en: Autoclass reduces storage cost, but Marrowfield would operate its own DICOM archive and DICOMweb server on GKE, which the technical requirement for the archive excludes.
    c:
      en: Filestore is a file share, not a DICOM archive; the PACS would read and write files over the VPN instead of using DIMSE, and the custom conversion service is code that Marrowfield would have to build and maintain.
    d:
      en: A FHIR store holds clinical resources that can describe a study, but it does not serve DICOM instances through DICOMweb or accept DIMSE transfers, so neither the viewer nor the PACS could use the archive.
references:
  - title: DICOM
    url: https://docs.cloud.google.com/healthcare-api/docs/concepts/dicom
  - title: DICOM storage classes
    url: https://docs.cloud.google.com/healthcare-api/docs/dicom-storage-class
