id: gcppca-1b-org-sink-observability-analytics
objective: "1.1.12"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A financial services company has 300 projects in one organization, and new projects are created every week. The security team must run SQL queries over the Cloud Audit Logs of every project, including future projects, from one central project. The logs must stay in Cloud Logging storage, and the company wants the least ongoing administration.

    Which actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create an aggregated sink at the organization level with the include-children option and an audit log filter, and route it to a log bucket in the central project.
    - id: b
      text:
        en: |-
          Create a sink in each existing project that routes its audit logs to the central project, and add a sink creation step to the project creation pipeline.
    - id: c
      text:
        en: |-
          Route the audit logs of each project to a Pub/Sub topic in the central project, and run a Dataflow job that writes them to a Cloud Storage bucket.
    - id: d
      text:
        en: |-
          Upgrade the central log bucket to use Observability Analytics, and run the SQL queries on it or on a linked BigQuery dataset.
    - id: e
      text:
        en: |-
          Grant the security team the Logs Viewer role on every project, and query the logs of all projects from the Logs Explorer.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      An aggregated sink created at the organization with includeChildren routes the matching log entries of every current and future project to one destination, here a log bucket in the central project. Upgrading that bucket to Observability Analytics lets the team query the logs with SQL while they stay in Cloud Logging; a linked BigQuery dataset gives read access to the same data without ingesting it into BigQuery.
  options:
    b:
      en: |-
        One sink per project means 300 sinks to maintain and depends on the pipeline for every new project; an organization-level aggregated sink covers new projects automatically.
    c:
      en: |-
        This moves the logs out of Cloud Logging into Cloud Storage, which breaks the storage requirement, and it adds a Dataflow pipeline to operate.
    e:
      en: |-
        Per-project role grants must be repeated for every new project, the logs stay scattered across 300 projects, and the Logs Explorer uses the Logging query language rather than SQL.
references:
  - title: "Collate and route organization- and folder-level logs to supported destinations"
    url: https://docs.cloud.google.com/logging/docs/export/aggregated_sinks
  - title: "Analyze logs using Logs Explorer and Observability Analytics"
    url: https://docs.cloud.google.com/logging/docs/log-analytics
