id: gcppca-1c-global-static-latency
objective: "1.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online education company that served only US students has expanded to Europe and Asia. Its course videos and images are served from a Cloud Storage bucket in us-central1, and students abroad report slow loading. The company wants to reduce latency for these students with minimal changes.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create a regional external Application Load Balancer on each continent and use DNS round robin" }
    - id: b
      text: { en: "Recreate the bucket in a dual-region location with turbo replication enabled" }
    - id: c
      text: { en: "Serve the bucket through a global external Application Load Balancer with Cloud CDN" }
    - id: d
      text: { en: "Serve the bucket through an external passthrough Network Load Balancer" }
answer: { optionId: c }
explanation:
  correct:
    en: Cloud CDN works with the global external Application Load Balancer, which can use the Cloud Storage bucket as a backend bucket. Requests reach the Google edge closest to each student, and cacheable content is served from edge caches worldwide instead of from us-central1.
  options:
    a: { en: "Regional load balancers still fetch every object from the single bucket in us-central1 and add DNS and load balancer components to manage." }
    b: { en: "Turbo replication shortens the replication time between the two regions of a dual-region bucket for recovery objectives; it does not bring content closer to Asia or Europe." }
    d: { en: "A passthrough Network Load Balancer forwards TCP or UDP traffic to backend VMs; it cannot use a Cloud Storage bucket as a backend and provides no caching." }
references:
  - title: Cloud CDN overview
    url: https://docs.cloud.google.com/cdn/docs/overview
