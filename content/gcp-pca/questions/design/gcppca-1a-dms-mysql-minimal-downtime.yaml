id: gcppca-1a-dms-mysql-minimal-downtime
objective: "1.1.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company has decided to replatform its 2 TB on-premises MySQL 8.0 database to Cloud SQL for MySQL. The data center is connected to Google Cloud through HA VPN. The business accepts only a few minutes of downtime at cutover, and the schema must not change.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Export the database with mysqldump during a maintenance weekend, copy the file to Cloud Storage, and import it into Cloud SQL.
    - id: b
      text:
        en: |-
          Stream the changes into BigQuery with Datastream, and then load the BigQuery tables into the Cloud SQL instance.
    - id: c
      text:
        en: |-
          Create a continuous Database Migration Service job from the on-premises database to a Cloud SQL for MySQL destination.
    - id: d
      text:
        en: |-
          When the replication delay is near zero, stop writes to the source, promote the migration job, and repoint the applications.
    - id: e
      text:
        en: |-
          Rebuild the database in Spanner with the GoogleSQL dialect, and copy the data with a batch Dataflow pipeline.
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |-
      A continuous Database Migration Service job loads an initial snapshot into Cloud SQL and then replicates ongoing changes with change data capture, while the source keeps serving the application. At cutover, you stop writes, wait until the replication delay is at or near zero, promote the job so that the destination accepts reads and writes, and point the applications to it: downtime lasts only these final steps.
  options:
    a:
      en: |-
        A dump and import keeps the database offline for the whole export, copy and import of 2 TB, far more than a few minutes.
    b:
      en: |-
        Datastream replicates changes for analytics into BigQuery or Cloud Storage; loading BigQuery tables back into MySQL is a custom, slow process.
    e:
      en: |-
        Moving to Spanner is a refactoring that changes the schema and the application, which the replatform decision excludes.
references:
  - title: "Database Migration Service overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/database-migration/docs/overview
  - title: "Promote a migration job | Database Migration Service for MySQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/database-migration/docs/mysql/promote-migration
