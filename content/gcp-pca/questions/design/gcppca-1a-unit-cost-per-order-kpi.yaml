id: gcppca-1a-unit-cost-per-order-kpi
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online retailer's Google Cloud bill grew by 40% over the last year, and the board is worried. Over the same period, the number of orders doubled. The CTO wants one KPI for the quarterly board report that shows whether cloud spending is becoming more or less efficient as the business grows.

    Which KPI should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Total monthly Google Cloud spending compared with the annual budget
    - id: b
      text:
        en: |-
          Average CPU utilization of the production Compute Engine VMs
    - id: c
      text:
        en: |-
          Percentage of Compute Engine spending covered by commitments
    - id: d
      text:
        en: |-
          Google Cloud cost per order, tracked every month
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The Well-Architected Framework recommends unit economics: relating cloud costs to business measures such as transactions shows whether spending grows faster or slower than the business. Here the cost per order fell, because spending grew by 40% while orders doubled, which separates healthy scaling from inefficiency.
  options:
    a:
      en: |-
        Comparing spending with a budget shows that costs went up, but not whether they grew in proportion to the business.
    b:
      en: |-
        CPU utilization is a technical efficiency metric for some resources; it doesn't relate spending to business growth.
    c:
      en: |-
        Commitment coverage is a cost-optimization indicator for the platform team, not a measure of efficiency relative to business volume.
references:
  - title: "Align cloud spending with business value | Cloud Architecture Center | Google Cloud Documentation"
    url: https://docs.cloud.google.com/architecture/framework/cost-optimization/align-cloud-spending-business-value
