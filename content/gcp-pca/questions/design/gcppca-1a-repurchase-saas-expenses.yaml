id: gcppca-1a-repurchase-saas-expenses
objective: "1.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    During a migration assessment, you review a homegrown expense-reporting application that runs on aging on-premises servers. It gives the company no competitive advantage, two developers spend most of their time patching it, and a commercial SaaS product covers all of the company's requirements. Leadership wants to reduce maintenance effort as much as possible.

    Which disposition should you recommend for this workload?
body:
  options:
    - id: a
      text:
        en: |-
          Repurchase: adopt the SaaS product and decommission the application.
    - id: b
      text:
        en: |-
          Rehost: move the application VMs to Compute Engine unchanged.
    - id: c
      text:
        en: |-
          Replatform: move the application into containers on GKE.
    - id: d
      text:
        en: |-
          Rebuild: rewrite the application as microservices on Cloud Run.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Repurchasing replaces a workload with a cloud-hosted SaaS equivalent, which is the option that leaves the company the least to manage. It fits a non-differentiating application that a commercial product fully covers; the trade-off is less control over the environment.
  options:
    b:
      en: |-
        Rehosting keeps the same application and its patching effort; it only changes where it runs.
    c:
      en: |-
        Replatforming adds migration work and still leaves the company maintaining the application code.
    d:
      en: |-
        Rebuilding is the most expensive option and keeps a custom application to maintain, which contradicts the goal.
references:
  - title: "Migrate to Google Cloud: Get started | Cloud Architecture Center | Google Cloud Documentation"
    url: https://docs.cloud.google.com/architecture/migration-to-gcp-getting-started
