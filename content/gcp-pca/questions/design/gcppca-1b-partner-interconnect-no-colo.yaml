id: gcppca-1b-partner-interconnect-no-colo
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A manufacturing company needs a private connection with 2 Gbps of bandwidth between its data center and its VPC network. The data center is far from any Cloud Interconnect colocation facility, and the company does not want to install equipment in a colocation facility. The traffic must not cross the public internet.

    What should you use?
body:
  options:
    - id: a
      text:
        en: |-
          Dedicated Interconnect
    - id: b
      text:
        en: |-
          Partner Interconnect through a supported service provider
    - id: c
      text:
        en: |-
          HA VPN over the internet
    - id: d
      text:
        en: |-
          Cross-Cloud Interconnect
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Partner Interconnect connects an on-premises network to Google through a supported service provider, so the company does not need its own equipment in a colocation facility. VLAN attachments range from 50 Mbps to 50 Gbps, depending on the partner, which covers 2 Gbps.
  options:
    a:
      en: |-
        Dedicated Interconnect needs a direct physical connection between the company's router and Google's network in a colocation facility.
    c:
      en: |-
        HA VPN encrypts traffic, but the traffic crosses the public internet, which the requirement forbids.
    d:
      en: |-
        Cross-Cloud Interconnect connects Google Cloud to another cloud provider, not to an on-premises data center.
references:
  - title: "Cloud Interconnect overview"
    url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/overview
