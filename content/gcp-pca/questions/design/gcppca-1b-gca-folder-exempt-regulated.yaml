id: gcppca-1b-gca-folder-exempt-regulated
objective: "1.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A company enabled Gemini Cloud Assist for a folder that contains 40 projects. Three of these projects host workloads with data residency and customer-managed encryption key requirements, and the security team does not want Gemini Cloud Assist to be used in them. The other 37 projects must keep the feature.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run the gcloud CLI command that enables Gemini Cloud Assist for the folder again, with an exclusion list that contains the three projects.
    - id: b
      text:
        en: |-
          Apply the Restrict Resource Service Usage organization policy constraint to the three projects to deny the Gemini Cloud Assist API.
    - id: c
      text:
        en: |-
          Disable the Cloud Asset API in the three projects so that Gemini Cloud Assist cannot read their resources.
    - id: d
      text:
        en: |-
          Avoid granting the Gemini Cloud Assist User role in the three projects, and leave the API enabled in them.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Folder-level setup of Gemini Cloud Assist is done in the console, and the documented way to exempt specific projects is to apply the Restrict Resource Service Usage constraint (gcp.restrictServiceUsage) to them. Google warns that Gemini Cloud Assist can store data in any Google Cloud data center, so projects with data residency or CMEK requirements should not have the API enabled. Gemini Cloud Assist is a Preview offering.
  options:
    a:
      en: |-
        Folder-level enablement is not supported with the gcloud CLI or the API, and it has no exclusion list.
    c:
      en: |-
        The Cloud Asset API is a dependency that other tools also use; disabling it does not block the Gemini Cloud Assist API in the projects.
    d:
      en: |-
        The API would stay enabled, and any principal that already holds or later receives a suitable role could still use the feature.
references:
  - title: "Set up Gemini Cloud Assist"
    url: https://docs.cloud.google.com/cloud-assist/set-up-gemini
  - title: "Restrict service usage"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/restricting-resources
