id: gcppca-1a-redshift-to-bigquery-dts
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company is moving its analytics from Amazon Redshift to BigQuery. The 40 TB warehouse has about 600 tables. The company wants a managed Google Cloud service to migrate the schema and the data instead of writing its own UNLOAD scripts and BigQuery load jobs, and it can provide an Amazon S3 bucket for staging and network access to the Redshift cluster.

    What should you use?
body:
  options:
    - id: a
      text:
        en: |-
          BigQuery Data Transfer Service, with an Amazon Redshift migration transfer that stages the data in the S3 bucket
    - id: b
      text:
        en: |-
          Storage Transfer Service, with a transfer job that reads the Redshift cluster's tables and writes them to Cloud Storage
    - id: c
      text:
        en: |-
          Datastream, with a stream that uses the Amazon Redshift cluster as its source and BigQuery as its destination
    - id: d
      text:
        en: |-
          Database Migration Service, with a continuous migration job from the Redshift cluster to a BigQuery dataset
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The BigQuery Data Transfer Service migrates schema and data from Amazon Redshift: it triggers an unload from Redshift to a staging S3 bucket and then moves the data into the target BigQuery dataset, creating the tables for you. It needs an S3 bucket with an AWS access key and inbound access to the cluster from Google-owned IP ranges, or a VPC-based setup.
  options:
    b:
      en: |-
        Storage Transfer Service copies objects and files, for example from Amazon S3; it doesn't read tables from a Redshift cluster or migrate a schema.
    c:
      en: |-
        Amazon Redshift isn't a Datastream source; Datastream replicates operational databases such as MySQL, PostgreSQL, Oracle and SQL Server.
    d:
      en: |-
        Database Migration Service targets Cloud SQL and AlloyDB destinations; it doesn't migrate data warehouses into BigQuery.
references:
  - title: "Migrate schema and data from Amazon Redshift | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/migration/redshift
