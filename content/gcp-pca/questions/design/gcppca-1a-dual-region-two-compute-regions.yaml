id: gcppca-1a-dual-region-two-compute-regions
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media analytics company runs Managed Service for Apache Spark (formerly Dataproc) jobs in both us-east1 and us-central1 that read the same 200 TB of Parquet files several times a day. The files must stay readable from both regions if either region becomes unavailable, the jobs must not pay outbound data transfer charges when they read the files, and the team wants one bucket path and the least operational effort.

    Which bucket location should you choose?
body:
  options:
    - id: a
      text:
        en: |-
          A bucket in the US multi-region
    - id: b
      text:
        en: |-
          Two regional buckets synchronized by a transfer job
    - id: c
      text:
        en: |-
          A dual-region bucket in us-east1 and us-central1
    - id: d
      text:
        en: |-
          A regional bucket in us-central1 with turbo replication
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A dual-region bucket stores the data redundantly in the two regions you choose, keeps one bucket name during a regional outage, and lets compute in either region read without outbound data transfer charges. Its storage price and replication charges are higher than a regional bucket: that is the trade-off for availability in both compute regions.
  options:
    a:
      en: |-
        A multi-region bucket also survives a regional outage, but outbound data transfer charges always apply when reading its data, and you don't choose its regions.
    b:
      en: |-
        Two buckets mean two paths, a transfer job to operate and a copy that lags behind the source, which contradicts the single path and low effort requirements.
    d:
      en: |-
        Turbo replication exists only for dual-region buckets; a regional bucket keeps the data in one region and doesn't survive its outage.
references:
  - title: "Bucket locations | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/locations
