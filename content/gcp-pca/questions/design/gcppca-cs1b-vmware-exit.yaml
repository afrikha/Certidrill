id: gcppca-cs1b-vmware-exit
objective: "1.4.2"
type: single
caseStudy: gcppca-cs1b-halden-mutual
difficulty: 2
status: draft
stem:
  en: |
    You are planning the first phase of the migration. The plan must meet the business requirements for the Munich datacenter.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Assess the virtual machines with Migration Center, then migrate them to Compute Engine with Migrate to Virtual Machines in waves, and give the partners the new IP addresses before each wave." } }
    - { id: b, text: { en: "Deploy a Google Cloud VMware Engine private cloud, extend the on-premises networks to it with VMware HCX, and migrate the virtual machines with HCX migrations." } }
    - { id: c, text: { en: "Export the virtual machines as OVA files to Cloud Storage, import them as Compute Engine images, and recreate the partner firewall rules for the new subnets." } }
    - { id: d, text: { en: "Containerize the applications of the virtual machines with Migrate to Containers, run them on GKE Autopilot, and publish them to the partners through Private Service Connect." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Google Cloud VMware Engine runs vSphere, vCenter, vSAN, NSX and HCX on dedicated Google Cloud infrastructure, so the policy administration system stays on a platform that its vendor supports, and retiring a datacenter is one of its main use cases. HCX can extend the on-premises Layer 2 networks to the private cloud and migrate the virtual machines in bulk or with vMotion, so they keep their IP addresses and the partner firewalls need no change.
  options:
    a:
      en: Compute Engine is not VMware vSphere, so the vendor no longer supports the policy administration system, and changing the IP addresses forces every partner to change its firewall rules.
    c:
      en: Imported Compute Engine images leave the VMware platform that the vendor requires, and new subnets change the addresses that the partners allow.
    d:
      en: Containerizing 650 virtual machines is a modernization project that does not fit the 10-month deadline, and the vendor does not support its system outside vSphere.
references:
  - title: Google Cloud VMware Engine overview
    url: https://docs.cloud.google.com/vmware-engine/docs/overview
  - title: Use VMware HCX to migrate VMware VMs
    url: https://docs.cloud.google.com/vmware-engine/docs/workloads/howto-migrate-vms-using-hcx
