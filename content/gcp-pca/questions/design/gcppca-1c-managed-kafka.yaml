id: gcppca-1c-managed-kafka
objective: "1.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A ride-sharing company runs a self-managed Apache Kafka cluster on Compute Engine VMs. Its team spends many hours patching brokers, replacing failed brokers and rebalancing partitions. Dozens of producer and consumer applications use the Kafka client libraries, and the company wants to cut this operational work without changing application code.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Migrate the topics to Pub/Sub and update the applications to use the Pub/Sub client libraries" }
    - id: b
      text: { en: "Move the Kafka brokers to a GKE Standard cluster managed by an open source Kafka operator" }
    - id: c
      text: { en: "Migrate the cluster to Google Cloud Managed Service for Apache Kafka" }
    - id: d
      text: { en: "Replace the Kafka cluster with Managed Service for Apache Spark streaming jobs" }
answer: { optionId: c }
explanation:
  correct:
    en: Managed Service for Apache Kafka runs open source Apache Kafka, so existing Kafka clients keep working without code changes (only connection settings such as authentication may change). Google provisions brokers from the vCPU count you choose, replaces failed brokers, applies security patches with rolling restarts and can rebalance partitions when you scale.
  options:
    a: { en: "Pub/Sub is fully managed, but moving to its client libraries changes the code of every producer and consumer." }
    b: { en: "Running Kafka on GKE with an operator is still self-managed Kafka; the team keeps broker upgrades, sizing and cluster operations." }
    d: { en: "Spark streaming processes streams but is not a message broker; the applications would have to be redesigned." }
references:
  - title: Managed Service for Apache Kafka overview
    url: https://docs.cloud.google.com/managed-service-for-apache-kafka/docs/overview
