id: gcppca-1a-restrict-service-usage-folder
objective: "1.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company's compliance team approved a short list of Google Cloud services for workloads that process patient data. These workloads live in projects under a "clinical" folder, where developers have broad roles. The compliance team wants to prevent resources of any non-approved service from being created or used in the folder, including from the Google Cloud console, regardless of the developers' IAM roles.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the developers' roles with a custom role that contains only permissions of the approved services.
    - id: b
      text:
        en: |-
          Set the gcp.restrictServiceUsage organization policy on the clinical folder with an allowlist of approved services.
    - id: c
      text:
        en: |-
          Create a VPC Service Controls perimeter around the folder's projects that lists only the approved services as restricted.
    - id: d
      text:
        en: |-
          Run a daily Cloud Scheduler job that disables the APIs of non-approved services in each project of the folder.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The gcp.restrictServiceUsage constraint controls which services can be used in a resource hierarchy. In allowlist mode, every service that isn't allowed is denied, the policy is inherited by all projects in the folder, it also hides restricted services in the console, and it applies to runtime access to existing resources, independently of IAM roles.
  options:
    a:
      en: |-
        Custom roles depend on every grant staying correct, need constant maintenance as services change, and don't satisfy the requirement of an enforcement that applies whatever IAM roles developers hold.
    c:
      en: |-
        Restricted services are the services that the perimeter protects against data exfiltration; services left off the list remain usable, so this doesn't stop non-approved services.
    d:
      en: |-
        A scheduled job reacts after the fact, developers could enable the APIs again between runs, and the script is custom automation to maintain.
references:
  - title: "Restrict service usage | Organization Policy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/restricting-resources
