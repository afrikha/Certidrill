id: gcppca-1b-cross-cloud-interconnect-aws
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A media company renders video on Google Cloud and stores its source assets in AWS. It needs a 100 Gbps private connection between its VPC network and its AWS environment, and the traffic must not cross the public internet. The company has no presence in any colocation facility and wants Google to provision the physical connection to AWS.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          HA VPN tunnels between an HA VPN gateway and AWS virtual private gateways
    - id: b
      text:
        en: |-
          Dedicated Interconnect from a colocation facility where the company rents a rack with routers that also connect to AWS
    - id: c
      text:
        en: |-
          Cross-Cloud Interconnect connections between Google Cloud and AWS
    - id: d
      text:
        en: |-
          Partner Interconnect VLAN attachments of 100 Gbps through a service provider that also connects to AWS
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Cross-Cloud Interconnect is a dedicated physical connection, provisioned by Google, between Google's network and another cloud provider's network, including AWS. For AWS it offers 10, 100 and 400 Gbps ports, so the company gets private 100 Gbps connectivity without its own equipment in a colocation facility.
  options:
    a:
      en: |-
        HA VPN runs over the public internet, and each tunnel carries roughly 1 to 3 Gbps.
    b:
      en: |-
        The company would have to rent space and operate routers in a colocation facility, which it wants to avoid.
    d:
      en: |-
        A Partner Interconnect VLAN attachment provides at most 50 Gbps.
references:
  - title: "Cross-Cloud Interconnect overview"
    url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/cci-overview
  - title: "Cloud Interconnect overview"
    url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/overview
