id: gcppca-cs1c-readings-row-key
objective: "1.3.5"
type: single
caseStudy: gcppca-cs1c-furrowline-agtech
difficulty: 3
status: draft
stem:
  en: |
    You are designing the Bigtable table that stores the sensor readings for the dashboards. The design must meet the business requirement for the dashboards and the technical requirement for the readings.

    Which row key design should you recommend?
body:
  options:
    - { id: a, text: { en: "The reading timestamp, followed by the field ID and the sensor ID, with one row for each reading" } }
    - { id: b, text: { en: "The field ID, followed by the sensor ID and the hour of the readings, with one row for each sensor and hour that holds the readings of that hour" } }
    - { id: c, text: { en: "The sensor ID alone, with one row for each sensor that receives a new column for every reading" } }
    - { id: d, text: { en: "A hash of the sensor ID and the reading timestamp, with one row for each reading so that writes are spread evenly across the table" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Starting the key with the field ID and then the sensor ID lets the app read all the sensors of a field, or one sensor, with a prefix scan, and the hour bucket at the end limits the scan to the last 24 hours. Readings from 450,000 sensors spread over many key prefixes, and time buckets keep each row to a bounded size while giving better performance and compression than one row per reading.
  options:
    a:
      en: A timestamp at the start of the key sends all current writes to the same part of the table, which creates a hotspot; Google advises never to use a timestamp as a row key prefix.
    c:
      en: A row that receives a column every minute grows without limit past the recommended maximum row size, and the readings of a field cannot be read with one prefix scan.
    d:
      en: Hashed keys destroy the order of the rows, so reading the last 24 hours of a sensor or a field requires a scan of the whole table.
references:
  - title: Schema design for time series data
    url: https://docs.cloud.google.com/bigtable/docs/schema-design-time-series
