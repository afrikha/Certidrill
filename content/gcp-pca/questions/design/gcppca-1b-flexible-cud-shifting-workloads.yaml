id: gcppca-1b-flexible-cud-shifting-workloads
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A company spends a steady amount on compute every hour. Over the next three years, its platform team plans to move workloads from N2 VMs in us-central1 to C4 VMs in europe-west1, and part of them to GKE and Cloud Run, in several projects of one Cloud Billing account. The company wants a commitment-based discount that keeps applying as workloads move between machine series, regions, projects, and these products.

    What should you purchase?
body:
  options:
    - id: a
      text:
        en: |-
          Resource-based committed use discounts for N2 vCPUs and memory in us-central1, shared across the projects of the billing account
    - id: b
      text:
        en: |-
          Reservations of C4 VMs in europe-west1 for the capacity that the company expects to need
    - id: c
      text:
        en: |-
          Spot VMs for all workloads, combined with resource-based commitments for the GKE nodes
    - id: d
      text:
        en: |-
          Compute flexible committed use discounts for the expected minimum hourly spend, purchased on the Cloud Billing account
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Compute flexible committed use discounts are spend-based: you commit to a minimum hourly spend, and the discount is not tied to one project, region or machine configuration. They cover Compute Engine, GKE and Cloud Run and are purchased at the Cloud Billing account level, so they follow the workloads as they move.
  options:
    a:
      en: |-
        Resource-based commitments are tied to a region and to the committed resources, so they stop matching usage when workloads move to C4 in europe-west1 or to Cloud Run.
    b:
      en: |-
        Reservations secure capacity in one zone; they do not by themselves give a discount, and they do not follow workloads to other regions or products.
    c:
      en: |-
        Spot VMs can be preempted at any time, which does not suit a steady production workload, and Cloud Run usage gets no benefit from this mix.
references:
  - title: "Committed use discounts (CUDs) for Compute Engine"
    url: https://docs.cloud.google.com/compute/docs/instances/committed-use-discounts-overview
