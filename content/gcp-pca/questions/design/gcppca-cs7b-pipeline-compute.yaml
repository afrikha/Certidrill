id: gcppca-cs7b-pipeline-compute
objective: "1.3.6"
type: single
caseStudy: gcppca-cs7b-veldhaven-genomics
difficulty: 2
status: draft
stem:
  en: |
    You need to choose where Veldhaven's analysis pipelines will run on Google Cloud. The solution must meet the technical requirements for compute and for the pipelines.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Run the pipelines with the Cloud Life Sciences API, and request preemptible VMs for every task." } }
    - { id: b, text: { en: "Deploy a Slurm cluster with Cluster Toolkit, add a partition of Spot VMs, and have Nextflow submit the tasks to the Slurm controller." } }
    - { id: c, text: { en: "Use the google-batch executor of Nextflow so that each task runs as a Batch job on Spot VMs, with automatic task retries." } }
    - { id: d, text: { en: "Create a GKE Standard cluster with a Spot VM node pool and the cluster autoscaler, and have Nextflow run each task as a Kubernetes pod." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Batch is a fully managed service that schedules and runs batch jobs on Compute Engine VMs that it creates for each job, with no extra charge beyond the resources used, so there is no cluster to patch and no cost when nothing runs. Nextflow runs its tasks on Batch through its google-batch executor, so the pipelines stay as they are. Because each task can be rerun from its inputs, Spot VMs give the lowest compute price, and maxRetryCount reruns a task that was preempted.
  options:
    a:
      en: Cloud Life Sciences is deprecated and ended after July 8, 2025; its use cases moved to Batch, so it cannot host new pipelines.
    b:
      en: A Slurm cluster keeps a controller and login nodes that the research computing team must run and patch, which the technical requirements rule out, and they cost money even when no pipeline runs.
    d:
      en: In GKE Standard, the team manages the node pools and their configuration and keeps the cluster running between pipelines, which is the cluster operation that the technical requirements rule out.
references:
  - title: Get started with Batch
    url: https://docs.cloud.google.com/batch/docs/get-started
  - title: Orchestrate jobs by running Nextflow pipelines on Batch
    url: https://docs.cloud.google.com/batch/docs/nextflow
