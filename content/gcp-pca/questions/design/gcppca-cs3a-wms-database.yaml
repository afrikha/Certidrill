id: gcppca-cs3a-wms-database
objective: "1.4.2"
type: single
caseStudy: gcppca-cs3a-tidemark-logistics
difficulty: 1
status: draft
stem:
  en: |
    You are planning the migration of the WMS database. The plan must meet the business requirement for the WMS migration and the technical requirement for the WMS database.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "During the maintenance window, export the database with mysqldump to Cloud Storage, import the file into a Cloud SQL for MySQL instance, and point the WMS to the instance." } }
    - { id: b, text: { en: "Replicate the database to BigQuery with Datastream over the HA VPN connection, and point the WMS to the BigQuery dataset during the maintenance window." } }
    - { id: c, text: { en: "Create a Database Migration Service continuous migration job to Cloud SQL for MySQL over the HA VPN connection, and promote it during the maintenance window after stopping writes to the source." } }
    - { id: d, text: { en: "Migrate the database virtual machines to Compute Engine with Migrate to Virtual Machines, and switch the WMS to them during the maintenance window." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A continuous migration job of Database Migration Service copies the database to Cloud SQL for MySQL and then keeps replicating the changes, so the long initial copy happens before the window. During the window, Tidemark stops writes to the source, waits for the replication delay to reach zero and promotes the job, which makes the Cloud SQL instance available for reads and writes within the 30 minutes.
  options:
    a:
      en: An export and import of this database took 9 hours in a test, far longer than the 30-minute window.
    b:
      en: Datastream replicates changes to BigQuery for analytics; BigQuery is not a transactional database that the WMS can use, and the target must be Cloud SQL for MySQL.
    d:
      en: MySQL would keep running on self-managed Compute Engine instances, which does not meet the requirement to run the database on Cloud SQL for MySQL.
references:
  - title: Promote a migration job
    url: https://docs.cloud.google.com/database-migration/docs/mysql/promote-migration
