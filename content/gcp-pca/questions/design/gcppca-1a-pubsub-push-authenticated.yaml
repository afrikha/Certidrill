id: gcppca-1a-pubsub-push-authenticated
objective: "1.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retailer must send inventory-change events from a Pub/Sub topic to a supplier's public HTTPS webhook. The supplier wants each event delivered as soon as it is published, with automatic redelivery when its endpoint returns an error, and it must be able to verify that each request really comes from the retailer's subscription. The retailer doesn't want to write or run any delivery code.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a pull subscription, and give the supplier a service account key that it uses to pull the messages.
    - id: b
      text:
        en: |-
          Create a push subscription whose endpoint is the supplier's HTTPS webhook.
    - id: c
      text:
        en: |-
          Enable authentication on the subscription with a service account, and have the supplier validate the token in each request.
    - id: d
      text:
        en: |-
          Route the push requests through Cloud NAT with a static IP address that the supplier adds to its allowlist.
    - id: e
      text:
        en: |-
          Deploy a Cloud Run service that pulls the messages and forwards them to the webhook with an API key.
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      A push subscription delivers each message to the endpoint as an HTTPS POST; a success status code acknowledges it, and any other code makes Pub/Sub send it again. With authentication enabled, Pub/Sub signs an OpenID Connect JWT for the configured service account and sends it in the Authorization header, so the supplier can verify the signature, the audience and the service account email.
  options:
    a:
      en: |-
        Handing a long-lived service account key to a third party is a security risk, and pulling isn't the immediate delivery to the webhook that the supplier wants.
    d:
      en: |-
        Push requests are sent by the Pub/Sub service, not by VMs in the retailer's VPC network, so Cloud NAT doesn't apply to them.
    e:
      en: |-
        A forwarding service is delivery code that the retailer would have to write and run, which the requirement excludes.
references:
  - title: "Push subscriptions | Pub/Sub | Google Cloud Documentation"
    url: https://docs.cloud.google.com/pubsub/docs/push
  - title: "Authentication for push subscriptions | Pub/Sub | Google Cloud Documentation"
    url: https://docs.cloud.google.com/pubsub/docs/authenticate-push-subscriptions
