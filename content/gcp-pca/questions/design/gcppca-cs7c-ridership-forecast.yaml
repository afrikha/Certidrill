id: gcppca-cs7c-ridership-forecast
objective: "1.3.2"
type: single
caseStudy: gcppca-cs7c-corrin-bay-transit
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend how the ridership planning team will produce its forecasts from the daily ridership data in BigQuery. The solution must meet the business requirement for forecasts.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Have a contractor train a custom forecasting model with serverless training on Gemini Enterprise Agent Platform, and deploy it to an endpoint that the planners call each week." } }
    - { id: b, text: { en: "Have the planners create an ARIMA_PLUS model in BigQuery ML with the route as the time series ID and the US holiday region, and read the forecasts with ML.FORECAST." } }
    - { id: c, text: { en: "Have the planners export the ridership history to a Gemini model each week and ask it in a prompt for the daily ridership of each route over the next 12 weeks." } }
    - { id: d, text: { en: "Have the planners run a Spark MLlib regression job on Managed Service for Apache Spark that reads the ridership tables with the BigQuery connector." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      BigQuery ML builds an ARIMA_PLUS time series model with a CREATE MODEL statement in SQL, which the planners already know. The TIME_SERIES_ID_COL option fits and forecasts one time series per route in a single query, HOLIDAY_REGION adds the effect of public holidays to daily series of more than a year, and HORIZON sets the number of days to forecast. The planners can rebuild the model and read the forecasts with ML.FORECAST whenever they want.
  options:
    a:
      en: A custom model needs data science skills that CBRTA does not have, and depending on a contractor fails the requirement that the planners build and refresh the forecasts themselves.
    c:
      en: Prompting a language model gives no reproducible statistical forecast and no explicit model of holidays and seasonality; it is not a forecasting tool that planners can validate and refresh.
    d:
      en: Spark MLlib jobs require Spark programming skills that SQL analysts do not have, and a general regression model does not handle the time series and holiday effects for them.
references:
  - title: The CREATE MODEL statement for ARIMA_PLUS models
    url: https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-create-time-series
