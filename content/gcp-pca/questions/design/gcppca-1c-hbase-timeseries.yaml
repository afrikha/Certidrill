id: gcppca-1c-hbase-timeseries
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An energy utility stores smart meter readings in an on-premises Apache HBase cluster. It ingests about 1.5 million readings per second, and its customer portal reads a meter's recent readings by row key with single-digit millisecond latency. The company wants a managed service and wants to keep its HBase client code with minimal changes.

    Which database should you recommend?
body:
  options:
    - id: a
      text: { en: "Bigtable, with a row key that combines the meter ID and a timestamp" }
    - id: b
      text: { en: "BigQuery, with the readings table partitioned by reading date" }
    - id: c
      text: { en: "Spanner, with the readings stored in a table interleaved under each meter" }
    - id: d
      text: { en: "Memorystore for Redis, with one sorted set for each meter" }
answer: { optionId: a }
explanation:
  correct:
    en: Bigtable is designed for very high write throughput and low-latency reads of single-keyed data, and time series and IoT data are its typical use cases. It is reachable through an extension of the Apache HBase library for Java, so HBase client code needs few changes. A row key that starts with the meter ID keeps a meter's readings together for fast lookups.
  options:
    b: { en: "BigQuery is an analytics warehouse; it is not built to serve per-key lookups in milliseconds, and it does not offer the HBase API." }
    c: { en: "Spanner is a relational database; moving to it means rewriting the HBase data access code, which fails the minimal-change requirement." }
    d: { en: "Memorystore is an in-memory cache, not a durable primary store for years of readings, and it does not offer the HBase API." }
references:
  - title: Bigtable overview
    url: https://docs.cloud.google.com/bigtable/docs/overview
