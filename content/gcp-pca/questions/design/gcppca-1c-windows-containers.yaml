id: gcppca-1c-windows-containers
objective: "1.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An insurance company has packaged a .NET Framework 4.8 application as Windows Server container images. It wants to run the application on Kubernetes next to its existing Linux microservices, using Kubernetes Deployments and Services for both, and with the lowest operational overhead that meets these needs.

    Which platform should you choose?
body:
  options:
    - id: a
      text: { en: "A GKE Autopilot cluster that runs both the Windows and the Linux workloads" }
    - id: b
      text: { en: "Cloud Run services for both the Windows and the Linux container images" }
    - id: c
      text: { en: "Windows Server VMs with a container runtime, plus a GKE cluster for the Linux services" }
    - id: d
      text: { en: "A GKE Standard cluster with a Windows Server node pool and a Linux node pool" }
answer: { optionId: d }
explanation:
  correct:
    en: GKE supports Windows Server containers on Windows Server node pools in Standard clusters, and a cluster must also have at least one Linux node pool, which hosts the Linux microservices. Both workloads then use the same Kubernetes objects and control plane, which is the least overhead that still runs Windows containers.
  options:
    a: { en: "Windows Server node images and containers are not available in GKE Autopilot mode, so Autopilot cannot run the .NET Framework containers." }
    b: { en: "Cloud Run requires executables compiled for Linux 64-bit, so it cannot run Windows Server container images." }
    c: { en: "Running Windows containers on standalone VMs leaves them outside Kubernetes and adds VMs to manage, which fails both requirements." }
references:
  - title: Windows Server containers on GKE
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/windows-server-gke
  - title: Container runtime contract
    url: https://docs.cloud.google.com/run/docs/container-contract
