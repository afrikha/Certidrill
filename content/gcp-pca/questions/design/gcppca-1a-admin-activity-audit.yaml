id: gcppca-1a-admin-activity-audit
objective: "1.1.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A compliance auditor asks who deleted a VPC firewall rule in a production project last week. The project uses the default logging settings, and nobody has configured any audit logging or other logging for it.

    Where should you look to answer the auditor?
body:
  options:
    - id: a
      text:
        en: |-
          In the Data Access audit logs of the Compute Engine API
    - id: b
      text:
        en: |-
          In the Admin Activity audit logs of the project
    - id: c
      text:
        en: |-
          In the VPC Flow Logs of the production subnets
    - id: d
      text:
        en: |-
          In the Firewall Rules Logging entries of the rule
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Admin Activity audit logs record API calls and other actions that change the configuration or metadata of resources, such as deleting a firewall rule, together with the identity that made the call. They are always written and can't be configured, excluded or disabled, so they exist even with default settings.
  options:
    a:
      en: |-
        Data Access audit logs record reads of data and configuration, not changes, and they are disabled by default for every service except BigQuery.
    c:
      en: |-
        VPC Flow Logs record samples of network flows, not administrative changes, and nobody enabled them in this project.
    d:
      en: |-
        Firewall Rules Logging records connections matched by a rule when it is enabled on that rule; it doesn't record who deleted the rule.
references:
  - title: "Cloud Audit Logs overview | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/audit
