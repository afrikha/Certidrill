id: gcppca-1b-waf-user-centric-sli
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A SaaS company runs its customer portal on a managed instance group behind an external Application Load Balancer. Its current SLO states that the average CPU utilization of the backend VMs stays below 70% for 99.99% of the time, yet the team keeps learning about outages from customers. The company wants reliability targets that follow the reliability pillar of the Google Cloud Well-Architected Framework.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the CPU-based SLO, and add uptime checks that probe the health endpoint of each VM every minute.
    - id: b
      text:
        en: |-
          Define SLIs for the ratio of successful requests and for request latency measured at the load balancer, and set a target below 100% that reflects what users need.
    - id: c
      text:
        en: |-
          Raise the target to 100% availability of every backend VM so that the error budget is zero and no failure is tolerated.
    - id: d
      text:
        en: |-
          Define SLIs from the memory and disk utilization collected by the Ops Agent, and alert when any VM exceeds 80%.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The reliability pillar says to define reliability from user-experience goals: measure request success ratio, latency and errors, ideally on the client, otherwise as close to the edge as possible, such as at the load balancer. It also says to set realistic targets: 100% is rarely the right goal, and the gap to the target is the error budget.
  options:
    a:
      en: |-
        CPU utilization and per-VM probes are server-centric signals: a VM can look healthy while users get errors, which is the problem the team has.
    c:
      en: |-
        A 100% target is not realistic, removes the error budget, and still measures VMs rather than what users experience.
    d:
      en: |-
        Memory and disk utilization are again infrastructure metrics that do not show whether users' requests succeed.
references:
  - title: "Define reliability based on user-experience goals"
    url: https://docs.cloud.google.com/architecture/framework/reliability/define-reliability-based-on-user-experience-goals
  - title: "Set realistic targets for reliability"
    url: https://docs.cloud.google.com/architecture/framework/reliability/set-targets
