id: gcppca-1b-psc-saas-overlapping-ranges
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A SaaS provider runs its API behind an internal load balancer in its own VPC network. Hundreds of customers want to reach the API privately from their own VPC networks, and many customer networks use the same private IP ranges as the provider and as each other. The provider must approve each customer explicitly and must not expose the rest of its network.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Peer the provider's VPC network with the VPC network of each customer.
    - id: b
      text:
        en: |-
          Make the provider's project a Shared VPC host project, and attach the customers' projects as service projects.
    - id: c
      text:
        en: |-
          Expose the API through an external Application Load Balancer, and allow only the customers' Cloud NAT addresses with Cloud Armor.
    - id: d
      text:
        en: |-
          Publish the API with a Private Service Connect service attachment that uses a consumer accept list, and have each customer create a Private Service Connect endpoint.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Private Service Connect gives consumers access to a single service through an endpoint, an internal IP address in their own VPC network. The service attachment's NAT subnet removes any need to coordinate IP ranges between networks, its consumer accept list authorizes each customer explicitly, and nothing else of the producer network is reachable.
  options:
    a:
      en: |-
        Peering fails when subnet ranges overlap, and it exchanges the routes of all the provider's subnets.
    b:
      en: |-
        Shared VPC works only within one organization and would place the customers' resources in the provider's network.
    c:
      en: |-
        Traffic would reach the API over the internet, which does not meet the private access requirement.
references:
  - title: "Private Service Connect"
    url: https://docs.cloud.google.com/vpc/docs/private-service-connect
