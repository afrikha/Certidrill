id: gcppca-1b-online-changes-without-stop
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A company runs a business-critical application on a single Compute Engine VM with the n4-standard-8 machine type, a Hyperdisk Balanced boot disk, and a Hyperdisk Balanced data disk. The VM must not be stopped or restarted during business hours.

    Which two changes can you make during business hours without stopping the VM? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Change the machine type to n4-standard-16.
    - id: b
      text:
        en: |-
          Increase the size of the data disk, and then grow the file system.
    - id: c
      text:
        en: |-
          Decrease the size of the data disk to reduce its cost.
    - id: d
      text:
        en: |-
          Increase the provisioned IOPS of the data disk.
    - id: e
      text:
        en: |-
          Change the machine type to an N4 custom machine type with more memory.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      You can increase the size of a Hyperdisk volume and change its provisioned IOPS or throughput while it is attached to a running VM; after a size increase, you resize the partition and file system to use the new space. Both changes therefore happen without stopping the VM.
  options:
    a:
      en: |-
        You can change the machine type only of a stopped VM.
    c:
      en: |-
        A disk cannot be shrunk: you would have to create a smaller volume and copy the data to it.
    e:
      en: |-
        A custom machine type is still a machine type change, which requires the VM to be stopped.
references:
  - title: "Modify the size and provisioned performance of a Hyperdisk volume"
    url: https://docs.cloud.google.com/compute/docs/disks/modify-hyperdisks
  - title: "Edit the machine type of a compute instance"
    url: https://docs.cloud.google.com/compute/docs/instances/changing-machine-type-of-stopped-instance
