id: gcppca-1c-stateless-api-scale-zero
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A tourism board is launching a containerized REST API that receives heavy traffic during a few events each year and almost none the rest of the time. The container is stateless and listens for HTTP requests. The board wants to pay nothing for compute when there are no requests and does not want to manage servers or clusters.

    Which platform should you use?
body:
  options:
    - id: a
      text: { en: "A GKE Standard cluster with the cluster autoscaler enabled" }
    - id: b
      text: { en: "A Cloud Run service" }
    - id: c
      text: { en: "A Compute Engine managed instance group with autoscaling" }
    - id: d
      text: { en: "An App Engine flexible environment service" }
answer: { optionId: b }
explanation:
  correct:
    en: Cloud Run is a fully managed platform that runs containers without clusters or servers to manage. A service autoscales with incoming requests and removes all instances when there is no traffic, so an idle API costs nothing for compute.
  options:
    a: { en: "A GKE Standard cluster requires managing the cluster and its node pools, which the board wants to avoid." }
    c: { en: "A managed instance group runs VMs whose images, patching and capacity the team must manage, which fails the no-servers requirement." }
    d: { en: "The App Engine flexible environment runs on VMs and keeps at least one instance running, so it does not scale to zero cost." }
references:
  - title: What is Cloud Run
    url: https://docs.cloud.google.com/run/docs/overview/what-is-cloud-run
