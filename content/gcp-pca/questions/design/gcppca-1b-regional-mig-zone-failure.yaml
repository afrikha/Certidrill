id: gcppca-1b-regional-mig-zone-failure
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A company runs a stateless web application on a zonal managed instance group of six VMs in us-east1-b, behind an external Application Load Balancer. During a recent zone outage, the application was unavailable for two hours. The company wants the application to keep serving traffic if one zone fails, without using another region.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the size of the zonal managed instance group to 12 VMs, and enable autohealing.
    - id: b
      text:
        en: |-
          Create a machine image of one VM every hour so that you can recreate the group in another zone during an outage.
    - id: c
      text:
        en: |-
          Apply a spread placement policy so that the VMs run on different hosts and racks in us-east1-b.
    - id: d
      text:
        en: |-
          Replace the zonal managed instance group with a regional managed instance group that spreads the VMs across several zones of us-east1.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A regional managed instance group spreads its VMs across multiple zones of a region, while a zonal group is confined to one zone. When a zone fails, the VMs in the other zones keep serving, and the load balancer health checks send traffic only to them.
  options:
    a:
      en: |-
        All 12 VMs would still be in us-east1-b, so a zone outage would stop the application again.
    b:
      en: |-
        Recreating the group from an image is a manual recovery that still causes downtime during the outage.
    c:
      en: |-
        A spread placement policy protects against host or rack failures inside one zone, not against the loss of the zone.
references:
  - title: "About regional MIGs"
    url: https://docs.cloud.google.com/compute/docs/instance-groups/regional-migs
  - title: "Placement policies overview"
    url: https://docs.cloud.google.com/compute/docs/instances/placement-policies-overview
