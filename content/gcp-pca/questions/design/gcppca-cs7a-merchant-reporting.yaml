id: gcppca-cs7a-merchant-reporting
objective: "1.1.7"
type: single
caseStudy: gcppca-cs7a-sablepoint-payments
difficulty: 2
status: draft
stem:
  en: |
    You need to design how transaction data reaches BigQuery for merchant reporting. The design must meet the business requirement for merchant reports and the technical requirement for reporting data.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Create a BigQuery connection to the Cloud SQL instance, and have the merchant portal run its reports as federated queries that join the ledger tables with the marketing data." } }
    - { id: b, text: { en: "Create a Datastream stream from the Cloud SQL for PostgreSQL instance to BigQuery, and run the merchant reports on the replicated tables in BigQuery." } }
    - { id: c, text: { en: "Export the ledger tables from the Cloud SQL instance to Cloud Storage every night, and load the files into BigQuery with a scheduled BigQuery Data Transfer Service job." } }
    - { id: d, text: { en: "Change the ledger application to publish every transaction to a Pub/Sub topic, and write the messages to BigQuery with a BigQuery subscription." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Datastream is a serverless change data capture service that backfills the existing ledger tables and then replicates changes to BigQuery with minimal latency and minimal impact on the source. Reports run in BigQuery, away from the primary instance, can join the marketing data directly, and lag the ledger by minutes at most. The ledger application does not change.
  options:
    a:
      en: Federated queries are executed by the Cloud SQL instance, so the 13-month report scans would still load the primary and slow down payment authorizations at month end.
    c:
      en: A nightly export leaves the reports up to a day behind the ledger instead of a few minutes, and the export itself reads the whole tables from the instance every night.
    d:
      en: Publishing to Pub/Sub requires a change to the ledger application, which the technical requirement forbids, and it does not bring the existing history into BigQuery.
references:
  - title: Datastream overview
    url: https://docs.cloud.google.com/datastream/docs/overview
