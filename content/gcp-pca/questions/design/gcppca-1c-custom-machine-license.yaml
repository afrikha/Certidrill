id: gcppca-1c-custom-machine-license
objective: "1.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A trading firm runs a risk engine on Compute Engine. The engine is licensed per vCPU, and the firm's license covers exactly 6 vCPUs. Load tests show that the engine needs 40 GB of memory. The firm must stay within its license and avoid paying for resources it does not use.

    Which machine configuration should you choose?
body:
  options:
    - id: a
      text: { en: "An N2 custom machine type with 6 vCPUs and 40 GB of memory" }
    - id: b
      text: { en: "n2-highmem-8, with 8 vCPUs and 64 GB of memory" }
    - id: c
      text: { en: "n2-standard-4, with 4 vCPUs and extended memory added up to 40 GB" }
    - id: d
      text: { en: "n2-standard-8, with 8 vCPUs and 32 GB of memory" }
answer: { optionId: a }
explanation:
  correct:
    en: Custom machine types let you choose the number of vCPUs and the amount of memory. An N2 custom type accepts an even number of vCPUs up to 32 and between 0.5 GB and 8 GB of memory per vCPU, so 6 vCPUs with 40 GB (about 6.7 GB per vCPU) is valid and matches both the license and the memory need.
  options:
    b: { en: "Eight vCPUs exceed the license, and the firm would pay for 24 GB of memory it does not need." }
    c: { en: "Extended memory is available only on custom machine types, not on predefined types such as n2-standard-4." }
    d: { en: "Eight vCPUs exceed the 6-vCPU license, and 32 GB is less than the 40 GB the engine needs." }
references:
  - title: Create a VM with a custom machine type
    url: https://docs.cloud.google.com/compute/docs/instances/creating-instance-with-custom-machine-type
