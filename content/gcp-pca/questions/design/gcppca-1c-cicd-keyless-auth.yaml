id: gcppca-1c-cicd-keyless-auth
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company runs its deployment pipelines in GitHub Actions. The pipelines deploy to Cloud Run and authenticate to Google Cloud with a service account key stored as a repository secret. The security team wants to remove all long-lived credentials without changing the CI platform.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Store the service account key in Secret Manager and rotate it every 30 days" }
    - id: b
      text: { en: "Create a new service account key for each pipeline run and delete it at the end" }
    - id: c
      text: { en: "Configure Workforce Identity Federation for the users of the GitHub organization" }
    - id: d
      text: { en: "Configure Workload Identity Federation with a provider that trusts GitHub OIDC tokens" }
answer: { optionId: d }
explanation:
  correct:
    en: Workload Identity Federation lets workloads outside Google Cloud, including GitHub Actions pipelines, exchange their own OIDC token for a short-lived Google Cloud token. Access is granted to the federated identity directly or through service account impersonation, so no service account key is needed.
  options:
    a: { en: "A rotated key is still a long-lived credential that can leak; Secret Manager only changes where it is stored." }
    b: { en: "Creating keys on the fly still requires a credential that can create keys, and every key is a secret that can leak." }
    c: { en: "Workforce Identity Federation is for people signing in through an external identity provider; automated workloads should use Workload Identity Federation." }
references:
  - title: Workload Identity Federation
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation
