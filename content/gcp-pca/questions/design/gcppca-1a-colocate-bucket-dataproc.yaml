id: gcppca-1a-colocate-bucket-dataproc
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A genomics company runs Managed Service for Apache Spark (formerly Dataproc) clusters only in us-central1, and they read 300 TB of input files from Cloud Storage several times a day. The files can be regenerated from raw data archived elsewhere, so the business accepts that this workload stops during a regional outage. The company wants the lowest storage cost and the best read throughput for the clusters.

    Which bucket location should you choose?
body:
  options:
    - id: a
      text:
        en: |-
          A regional bucket in us-central1
    - id: b
      text:
        en: |-
          A bucket in the US multi-region
    - id: c
      text:
        en: |-
          A dual-region bucket in us-central1 and us-east1
    - id: d
      text:
        en: |-
          A regional bucket in us-east1
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A regional bucket has the lowest storage price, no replication charges and no outbound data transfer charges for reads in the same region. Colocating the data with the Managed Service for Apache Spark clusters also gives the best latency and bandwidth, and the accepted regional outage means the extra availability of other location types isn't worth paying for.
  options:
    b:
      en: |-
        A multi-region bucket costs more to store, charges for replication on writes and charges outbound data transfer on every read, for availability that the business doesn't need.
    c:
      en: |-
        A dual-region bucket is the most expensive location type to store data in, and the availability it adds isn't required here.
    d:
      en: |-
        A bucket in another region adds network charges and latency for every read from us-central1.
references:
  - title: "Bucket locations | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/locations
