id: gcppca-1c-eu-residency-orgpolicy
objective: "1.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company has signed its first public sector customers in the European Union. Every resource created for these customers must be located in the EU. The company will create a new folder for the customer projects, and the control must prevent non-compliant resources from being created rather than detect them afterward.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create a VPC Service Controls perimeter around the projects in the new folder" }
    - id: b
      text: { en: "Set the gcp.resourceLocations constraint on the folder with the value in:eu-locations" }
    - id: c
      text: { en: "Add IAM conditions to the folder's role bindings that check the region name" }
    - id: d
      text: { en: "Label every project with region=eu and audit the labels with a weekly report" }
answer: { optionId: b }
explanation:
  correct:
    en: The resource locations organization policy constraint, `gcp.resourceLocations`, restricts where new resources can be created, and the `in:eu-locations` value group covers EU locations and is kept up to date by Google. Set on the folder, it is inherited by the projects below it. It does not apply retroactively, which is not an issue for a new folder.
  options:
    a: { en: "VPC Service Controls protects against data exfiltration from Google APIs; it does not decide in which location resources are created." }
    c: { en: "IAM conditions control who can access which resources; they are not the mechanism for restricting resource locations across services." }
    d: { en: "Labels are metadata and a weekly audit detects problems after the fact, which fails the prevention requirement." }
references:
  - title: Restrict resource locations
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/defining-locations
