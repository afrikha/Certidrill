id: gcppca-1b-compact-placement-hpc
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A research institute runs a tightly coupled MPI simulation on a group of Compute Engine VMs of a machine series that supports placement policies. The VMs exchange small messages constantly, and the job runtime is dominated by the network latency between them. All VMs already run in the same zone.

    What should you do to reduce the latency between the VMs?
body:
  options:
    - id: a
      text:
        en: |-
          Apply a spread placement policy to the VMs.
    - id: b
      text:
        en: |-
          Apply a compact placement policy to the VMs.
    - id: c
      text:
        en: |-
          Spread the VMs across three zones with a regional managed instance group.
    - id: d
      text:
        en: |-
          Place the VMs behind an internal passthrough Network Load Balancer.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Without a placement policy, you control VM location only by zone. A compact placement policy places the VMs close to each other inside the zone, which reduces the network latency between them, and it is meant for HPC and ML workloads like this one.
  options:
    a:
      en: |-
        A spread placement policy places VMs apart to improve resilience, which increases rather than reduces the distance between them.
    c:
      en: |-
        Spreading tightly coupled VMs across zones adds latency between them.
    d:
      en: |-
        A load balancer distributes client connections to backends; it does not shorten VM-to-VM communication.
references:
  - title: "Placement policies overview"
    url: https://docs.cloud.google.com/compute/docs/instances/placement-policies-overview
