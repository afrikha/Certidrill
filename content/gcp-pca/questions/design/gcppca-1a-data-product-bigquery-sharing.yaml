id: gcppca-1a-data-product-bigquery-sharing
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A weather data company is launching a product line that gives retailers access to curated forecast datasets stored in BigQuery. Subscribers must always query the latest data, the company doesn't want to copy data into each subscriber's project, each subscriber must pay for its own queries, and the product team wants usage metrics for each offering. The number of subscribers is expected to grow to several hundred.

    Which solution should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Export the datasets to Cloud Storage every day and send each retailer signed URLs to download the files.
    - id: b
      text:
        en: |-
          Grant the BigQuery Data Viewer role on the datasets to a group of users for each retailer, managed in the company's project.
    - id: c
      text:
        en: |-
          Run a scheduled export of the datasets to Cloud Storage, and load the files into a dataset in each retailer's project.
    - id: d
      text:
        en: |-
          Publish the datasets as listings in a BigQuery sharing exchange that the retailers subscribe to from their own projects.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      BigQuery sharing (formerly Analytics Hub) lets a publisher organize datasets into listings in an exchange. Each subscription creates a linked dataset in the subscriber's project, so the data is queried in place without copies, subscribers pay for their own queries, and publishers can track usage metrics for their listings.
  options:
    a:
      en: |-
        Daily exports copy the data out of BigQuery and give subscribers files that are up to a day old, so they don't always query the latest data.
    b:
      en: |-
        Direct IAM grants avoid copies, but they give no per-offering usage metrics and turn access management for hundreds of subscribers into manual work for the company.
    c:
      en: |-
        Loading the data into each retailer's project copies it, lags behind the source and multiplies storage, which the company wants to avoid.
references:
  - title: "Introduction to BigQuery sharing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/analytics-hub-introduction
