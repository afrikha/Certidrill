id: gcppca-1a-pubsub-exactly-once-charges
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payment service consumes "charge requested" messages from a Pub/Sub pull subscription, with all subscribers running in us-central1. During an incident, subscribers acknowledged some messages after the acknowledgment deadline, Pub/Sub delivered them again, and a few customers were charged twice. The publisher never retries a publish, so all duplicates come from redelivery. The team wants Pub/Sub to stop redelivering messages that were acknowledged successfully, with minimal code changes; a small increase in delivery latency is acceptable.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the pull subscription with a push subscription that uses a much longer acknowledgment deadline.
    - id: b
      text:
        en: |-
          Use a pull subscription with exactly-once delivery, and acknowledge with the acknowledgment-with-response method.
    - id: c
      text:
        en: |-
          Use a pull subscription with message ordering enabled so that each message is delivered to only one subscriber.
    - id: d
      text:
        en: |-
          Attach a dead-letter topic to the subscription so that messages delivered more than once are moved aside.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With exactly-once delivery, a message that is successfully acknowledged isn't redelivered, and the acknowledgment-with-response interface of the client libraries tells the subscriber whether the ack succeeded. The guarantee applies to pull subscriptions within one region, which matches subscribers in us-central1, at the cost of higher publish-to-subscribe latency.
  options:
    a:
      en: |-
        Push subscriptions don't support exactly-once delivery, and a longer deadline only makes late acknowledgments rarer; redelivery remains possible.
    c:
      en: |-
        Message ordering delivers messages with the same ordering key in order; it doesn't prevent redelivery of messages.
    d:
      en: |-
        A dead-letter topic receives messages that repeatedly fail to be acknowledged; it doesn't stop a message from being delivered again after a late acknowledgment.
references:
  - title: "Exactly-once delivery | Pub/Sub | Google Cloud Documentation"
    url: https://docs.cloud.google.com/pubsub/docs/exactly-once-delivery
