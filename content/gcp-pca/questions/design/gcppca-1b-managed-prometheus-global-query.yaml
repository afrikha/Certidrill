id: gcppca-1b-managed-prometheus-global-query
objective: "1.1.12"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A gaming company runs 20 GKE clusters in six regions. Each cluster has its own self-managed Prometheus server, and the team maintains hundreds of PromQL alerting rules and Grafana dashboards. The team wants one query view across all clusters, metric retention of at least one year, and no Prometheus storage to operate, while keeping its PromQL queries and dashboards.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the Prometheus servers, add Thanos sidecars that upload metric blocks to a Cloud Storage bucket, and point Grafana at a Thanos query layer.
    - id: b
      text:
        en: |-
          Install the Ops Agent on every GKE node, remove the Prometheus servers, and rebuild the dashboards on the built-in Cloud Monitoring metrics.
    - id: c
      text:
        en: |-
          Configure every Prometheus server to remote-write its samples to a central Prometheus server on a Compute Engine VM with a large Hyperdisk volume.
    - id: d
      text:
        en: |-
          Enable managed collection of Google Cloud Managed Service for Prometheus on the clusters, move the alerting rules to its rule resources, and point Grafana at its query API.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Managed Service for Prometheus stores the samples in Monarch, which runs PromQL queries across all regions and projects, and keeps the data for 24 months at no additional cost. Managed collection is the recommended collection mode and removes the Prometheus servers and their storage, while Grafana and PromQL queries keep working against the global store.
  options:
    a:
      en: |-
        Thanos gives a global view, but the team would still operate sidecars, query and storage components, which it wants to stop doing.
    b:
      en: |-
        The Ops Agent is meant for Compute Engine instances; GKE nodes have built-in monitoring and should not get the agent, and the PromQL dashboards would be lost.
    c:
      en: |-
        A central Prometheus server is a single point of failure whose storage the team must still size and operate.
references:
  - title: "Google Cloud Managed Service for Prometheus"
    url: https://docs.cloud.google.com/stackdriver/docs/managed-prometheus
  - title: "Ops Agent overview"
    url: https://docs.cloud.google.com/monitoring/agent/ops-agent
