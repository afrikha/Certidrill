id: gcppca-1b-cloud-run-min-instances
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A retailer runs its checkout API on Cloud Run. Traffic drops to zero at night, and the first customers each morning wait several seconds because new instances must start. During the day, latency is acceptable. The retailer wants to remove the morning delay while keeping costs low.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the maximum number of concurrent requests that each instance can receive.
    - id: b
      text:
        en: |-
          Set the maximum number of instances of the service to the daytime peak.
    - id: c
      text:
        en: |-
          Set a minimum number of instances on the service so that some instances stay warm.
    - id: d
      text:
        en: |-
          Switch the service to instance-based billing so that CPU stays allocated outside requests.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Minimum instances keep a set number of instances warm, which removes the cold-start delay when traffic resumes from zero. With request-based billing, idle minimum instances are charged at a lower rate, and Google recommends setting the minimum at the service level.
  options:
    a:
      en: |-
        Concurrency changes how many requests one instance handles; with zero instances at night, the first requests still wait for a cold start.
    b:
      en: |-
        A maximum caps scaling; it does not keep any instance running when traffic is zero.
    d:
      en: |-
        Instance-based billing charges the full rate for the whole life of each instance, and it does not keep instances alive when the service scales to zero.
references:
  - title: "Set minimum instances for services"
    url: https://docs.cloud.google.com/run/docs/configuring/min-instances
