id: gcppca-1a-dev-vms-instance-schedule
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company runs 150 Compute Engine VMs for its development and test environments. Developers use them only from 08:00 to 19:00 on weekdays, and the VMs don't need to run outside these hours. The company wants to reduce the cost of these VMs with the least operational effort and without changing their machine types.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Purchase 1-year resource-based committed use discounts that cover the vCPUs and memory of the development VMs.
    - id: b
      text:
        en: |-
          Create an instance schedule that starts the VMs at 08:00 and stops them at 19:00 on weekdays, and attach it to the VMs.
    - id: c
      text:
        en: |-
          Recreate the development VMs as Spot VMs so that Compute Engine stops them automatically when they aren't needed.
    - id: d
      text:
        en: |-
          Write a Cloud Run job that lists all VMs every hour and stops the ones whose CPU utilization is low.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An instance schedule is a resource policy that starts and stops the VMs it is attached to at the defined times, with no code to maintain. Stopped VMs don't incur vCPU and memory charges, so the VMs are billed for compute only during working hours, about a third of the week.
  options:
    a:
      en: |-
        Commitments are billed for the full term whether or not the resources run, so paying for 24/7 capacity that is used about a third of the week doesn't minimize cost.
    c:
      en: |-
        Spot VMs are preempted when Compute Engine needs capacity, not when developers stop working; they can be stopped during working hours and still run at night.
    d:
      en: |-
        A custom job is code to write and maintain, and low CPU utilization doesn't reliably mean that nobody is using a development VM.
references:
  - title: "Scheduling a VM instance to start and stop | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/schedule-instance-start-stop
