id: gcppca-cs4b-readings-bigquery
objective: "1.3.4"
type: single
caseStudy: gcppca-cs4b-corvane-components
difficulty: 1
status: draft
stem:
  en: |
    You need to load the machine readings from the Pub/Sub topic into BigQuery. The solution must meet the business requirement about readings and the technical requirement for storing readings.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Run the Pub/Sub to BigQuery Dataflow template as a streaming job that reads a subscription of the topic and writes the readings to a BigQuery table." } }
    - { id: b, text: { en: "Create a push subscription to a Cloud Run service that decodes each reading and writes it to a BigQuery table with the BigQuery Storage Write API." } }
    - { id: c, text: { en: "Create a Cloud Storage subscription that writes the readings to Avro files, and run a scheduled BigQuery load job every hour that loads the new files into a table." } }
    - { id: d, text: { en: "Associate the Protocol Buffers schema with the topic, and create a BigQuery subscription that uses the topic schema to write the readings to a BigQuery table." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A BigQuery subscription writes messages to an existing BigQuery table as they arrive, so no subscriber client, job or service has to run between Pub/Sub and BigQuery. With the topic schema option, the fields of the Protocol Buffers schema are mapped to the table's columns; the subscription delivers at least once, which the requirement accepts, and readings are queryable within seconds.
  options:
    a:
      en: The template works, but a streaming Dataflow job adds worker costs and a job to monitor; Google recommends Dataflow when messages need transformation, which the readings do not.
    b:
      en: The Cloud Run service is custom code that Corvane would build, run and pay for, although Pub/Sub can write to BigQuery directly.
    c:
      en: Hourly load jobs make readings available up to an hour or more after their measurement, which fails the 10-minute business requirement.
references:
  - title: BigQuery subscriptions
    url: https://docs.cloud.google.com/pubsub/docs/bigquery
