id: gcppca-cs4c-search-cache
objective: "1.2.5"
type: single
caseStudy: gcppca-cs4c-saltroute-travel
difficulty: 2
status: draft
stem:
  en: |
    You are redesigning the cache of supplier results for the search service on Google Cloud. The design must meet the business requirement about supplier fees and the technical requirement for search caches.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Enable Cloud CDN on the backend services of the search service, and use the FORCE_CACHE_ALL cache mode with a 5-minute TTL." } }
    - { id: b, text: { en: "Store supplier results in a Firestore database in each region, keyed by hotel, dates and occupancy, with a TTL policy that removes each result 5 minutes after it was received." } }
    - { id: c, text: { en: "Keep the in-memory cache of each instance, and set a minimum number of 400 instances on the search service so that cached results are not lost when instances scale in." } }
    - { id: d, text: { en: "Store supplier results in a Memorystore for Valkey instance in each region, keyed by hotel, dates and occupancy, with a 5-minute expiration on each key." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Memorystore for Valkey instance is a managed in-memory store shared by all the search instances of a region, so a result received by one instance serves the searches of every other instance, and the hit rate is no longer limited by the number of instances. A key with a 5-minute expiration is no longer returned once it has expired, so no result older than 5 minutes is read, and the personalization is still applied after the cache lookup.
  options:
    a:
      en: Cloud CDN stores responses to GET requests only, so POST search requests are never cached; forcing every response into the cache would also serve one traveler's currency and loyalty discount to others.
    b:
      en: TTL policies delete expired documents typically within 24 hours, and expired documents still appear in queries until they are deleted, so the search service could show results older than 5 minutes.
    c:
      en: Each instance would still cache only the results it received itself, so the hit rate stays low, and keeping 400 instances running all the time adds cost without sharing the cache.
references:
  - title: Memorystore for Valkey overview
    url: https://docs.cloud.google.com/memorystore/docs/valkey/product-overview
  - title: Caching overview
    url: https://docs.cloud.google.com/cdn/docs/caching
