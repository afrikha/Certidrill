id: gcppca-1c-mysql-dms-continuous
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company runs a 3 TB MySQL 8.0 database on premises. It wants to move the database to Cloud SQL for MySQL. The source must keep serving orders while the data is copied, and the downtime at switchover must be limited to a few minutes.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Export the database with mysqldump, upload the file to Cloud Storage, and import it into Cloud SQL" }
    - id: b
      text: { en: "Replicate the database into BigQuery with Datastream, then export the tables into Cloud SQL" }
    - id: c
      text: { en: "Create a continuous Database Migration Service job and switch over when the destination is in sync" }
    - id: d
      text: { en: "Copy the MySQL data files to Cloud Storage with Storage Transfer Service and attach them to Cloud SQL" }
answer: { optionId: c }
explanation:
  correct:
    en: A continuous migration in Database Migration Service loads an initial snapshot, then streams changes from the source with change data capture while the source stays in service. Switching over when source and destination are in sync keeps downtime minimal.
  options:
    a: { en: "A dump and import of 3 TB is a one-time copy: writes made after the export are lost unless the application stops for the whole process, which means long downtime." }
    b: { en: "BigQuery is an analytics warehouse, not a migration path to Cloud SQL, and the extra export step is a one-time copy with no ongoing replication." }
    d: { en: "Cloud SQL is a managed service; you cannot attach raw MySQL data files to an instance." }
references:
  - title: Database Migration Service overview
    url: https://docs.cloud.google.com/database-migration/docs/overview
