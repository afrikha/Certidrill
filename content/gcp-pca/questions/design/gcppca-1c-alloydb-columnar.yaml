id: gcppca-1c-alloydb-columnar
objective: "1.5.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A fintech company runs its transactional PostgreSQL database on Cloud SQL for PostgreSQL. New dashboards run scan- and aggregation-heavy queries on the live tables. The dashboards already use a read replica, and the queries are still too slow. The company wants faster analytical queries on current data, PostgreSQL compatibility, and no ETL pipeline to build or run.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Add vCPUs and memory to the read replica and create more replicas for the dashboards" }
    - id: b
      text: { en: "Migrate to AlloyDB for PostgreSQL and enable the columnar engine for the reporting tables" }
    - id: c
      text: { en: "Export the tables to BigQuery every night and point the dashboards at BigQuery" }
    - id: d
      text: { en: "Create materialized views in Cloud SQL and refresh them every night for the dashboards" }
answer: { optionId: b }
explanation:
  correct:
    en: AlloyDB for PostgreSQL is PostgreSQL-compatible, and its columnar engine keeps selected columns in memory in a column-oriented format to speed up queries that scan, join and aggregate large amounts of data. It runs on the primary and read pool instances, so dashboards query current data without an ETL pipeline, and Database Migration Service supports PostgreSQL to AlloyDB migrations.
  options:
    a: { en: "More resources on row-oriented replicas give limited gains for large scans and aggregations, and the company already sees this approach fall short." }
    c: { en: "A nightly export is an ETL pipeline and leaves the dashboards up to a day behind, which fails the current-data requirement." }
    d: { en: "Views refreshed every night show stale data, which fails the current-data requirement." }
references:
  - title: About the AlloyDB columnar engine
    url: https://docs.cloud.google.com/alloydb/docs/columnar-engine/about
  - title: Database Migration Service overview
    url: https://docs.cloud.google.com/database-migration/docs/overview
