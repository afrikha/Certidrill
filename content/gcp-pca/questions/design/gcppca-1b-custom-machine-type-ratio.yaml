id: gcppca-1b-custom-machine-type-ratio
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A company is moving a commercial analytics engine to Compute Engine. The vendor licenses the engine per vCPU, and its sizing guide requires exactly 6 vCPUs and 60 GB of memory for the company's data volume. The company wants to minimize both license and infrastructure costs.

    Which machine configuration should you choose?
body:
  options:
    - id: a
      text:
        en: |-
          An N2 custom machine type with 6 vCPUs and 60 GB of memory, which uses extended memory
    - id: b
      text:
        en: |-
          An E2 custom machine type with 6 vCPUs and 60 GB of memory, which uses extended memory
    - id: c
      text:
        en: |-
          The n2-highmem-8 predefined machine type, which provides 8 vCPUs and 64 GB of memory
    - id: d
      text:
        en: |-
          The n2-highmem-4 predefined machine type with 4 vCPUs and 32 GB of memory, plus a swap file on a Hyperdisk volume
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Custom machine types let you set the vCPU count and memory independently, and N2 accepts 6 vCPUs. 60 GB is 10 GB per vCPU, above the 8 GB per vCPU limit of a standard N2 custom type, so it needs extended memory, which N2 supports. The company pays only for 6 licensed vCPUs; custom types cost 5% more than predefined ones, which is small next to two extra per-vCPU licenses.
  options:
    b:
      en: |-
        E2 custom machine types do not support extended memory and allow at most 8 GB per vCPU, so 60 GB with 6 vCPUs is not possible.
    c:
      en: |-
        It meets the memory need, but its 8 vCPUs require two more licenses than the sizing guide.
    d:
      en: |-
        It provides only 32 GB of memory, and swapping to disk would not meet the vendor's sizing or performance needs.
references:
  - title: "Create a VM with a custom machine type"
    url: https://docs.cloud.google.com/compute/docs/instances/creating-instance-with-custom-machine-type
