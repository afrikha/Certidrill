id: gcppca-1c-hpc-tightly-coupled
objective: "1.3.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An aerospace company runs computational fluid dynamics simulations that use MPI across 64 VMs in one region. The simulations are tightly coupled and run for up to three days, they cannot tolerate VM interruptions, and their performance depends on low network latency between the VMs.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Apply a spread placement policy to the VMs" } }
    - { id: b, text: { en: "Run the simulation on Spot VMs to reduce cost" } }
    - { id: c, text: { en: "Use H3 VMs from the compute-optimized machine family" } }
    - { id: d, text: { en: "Distribute the VMs across three zones with a regional managed instance group" } }
    - { id: e, text: { en: "Apply a compact placement policy to the VMs" } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: H3 VMs are compute-optimized machines built for HPC workloads such as computational fluid dynamics, and they support compact placement for tightly coupled multi-node applications. A compact placement policy places the VMs close together within a zone to reduce network latency between them (on a best-effort basis).
  options:
    a: { en: "A spread placement policy places VMs on separate hardware to limit the impact of localized failures, which increases distance instead of reducing latency." }
    b: { en: "Spot VMs can be preempted at any time, which the three-day simulations cannot tolerate." }
    d: { en: "Spreading tightly coupled VMs across zones adds network latency between them, which hurts MPI performance." }
references:
  - title: Compute-optimized machine family for Compute Engine
    url: https://docs.cloud.google.com/compute/docs/compute-optimized-machines
  - title: Placement policies overview
    url: https://docs.cloud.google.com/compute/docs/instances/placement-policies-overview
