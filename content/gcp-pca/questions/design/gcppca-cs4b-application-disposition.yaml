id: gcppca-cs4b-application-disposition
objective: "1.1.9"
type: single
caseStudy: gcppca-cs4b-corvane-components
difficulty: 2
status: draft
stem:
  en: |
    You are preparing the plan for the applications described in the existing technical environment. The plan must meet the business requirement about the headquarters datacenter and the chief operating officer's expectations.

    Which plan should you recommend?
body:
  options:
    - { id: a, text: { en: "Rehost ShopTrack on Compute Engine in us-central1, move PartVault to the vendor's SaaS service, and rehost ScrapStat on a Compute Engine VM." } }
    - { id: b, text: { en: "Keep ShopTrack on its plant servers, move PartVault to the vendor's SaaS service, and retire ScrapStat when the LinePulse dashboards are available." } }
    - { id: c, text: { en: "Keep ShopTrack on its plant servers, rehost PartVault on Compute Engine with its current licenses, and refactor ScrapStat into a Cloud Run service." } }
    - { id: d, text: { en: "Refactor ShopTrack onto the GKE cluster in us-central1, rehost PartVault on Compute Engine with its current licenses, and retire ScrapStat." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      ShopTrack must answer the PLCs within 20 ms and survive the loss of the plant's internet links, so it stays in the plants; it does not run at headquarters, so it does not block the datacenter closure. PartVault's self-hosted edition loses vendor support, and the vendor's SaaS service with its migration tool is the cheapest way to keep it (repurchase, a buy decision). ScrapStat's reports will be produced by LinePulse, so moving it would be wasted effort: it is retired.
  options:
    a:
      en: Running ShopTrack in a cloud region adds WAN latency between the PLCs and the MES and stops production when a plant loses its internet links; rehosting ScrapStat spends effort on an application that LinePulse replaces.
    c:
      en: Rehosting PartVault keeps a self-hosted edition whose vendor support ends, and refactoring ScrapStat spends effort on reports that LinePulse will produce.
    d:
      en: Moving ShopTrack to a cloud region puts production at risk for latency and connectivity reasons, and the self-hosted PartVault loses vendor support next year.
references:
  - title: "Migrate to Google Cloud: Get started"
    url: https://docs.cloud.google.com/architecture/migration-to-gcp-getting-started
