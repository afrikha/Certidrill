id: gcppca-1b-mig-autoscale-pubsub-backlog
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A company processes uploaded images with worker VMs in a managed instance group. The workers pull messages from a Pub/Sub subscription. Their CPU usage stays low because most of the time is spent waiting on I/O, so CPU-based autoscaling does not add VMs when the backlog grows.

    What should you configure?
body:
  options:
    - id: a
      text:
        en: |-
          Autoscaling based on the HTTP load balancing serving capacity of the group
    - id: b
      text:
        en: |-
          Autoscaling based on a Cloud Monitoring metric that counts the undelivered messages of the subscription
    - id: c
      text:
        en: |-
          Predictive autoscaling based on the CPU utilization of the group
    - id: d
      text:
        en: |-
          Autohealing with a health check that tests the worker process
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A managed instance group can autoscale on a Cloud Monitoring metric, and the message count of a Pub/Sub subscription is a typical example. The autoscaler then adds VMs when the backlog grows and removes them when it drains, regardless of the low CPU usage.
  options:
    a:
      en: |-
        The workers pull from Pub/Sub and receive no load-balanced traffic, so serving capacity does not reflect their load.
    c:
      en: |-
        Predictive autoscaling still relies on CPU utilization, which stays low for this workload.
    d:
      en: |-
        Autohealing recreates unhealthy VMs; it does not change the number of VMs in the group.
references:
  - title: "Scale based on Monitoring metrics"
    url: https://docs.cloud.google.com/compute/docs/autoscaler/scaling-cloud-monitoring-metrics
