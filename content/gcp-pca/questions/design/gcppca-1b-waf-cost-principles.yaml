id: gcppca-1b-waf-cost-principles
objective: "1.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |-
    A company's leadership asks its cloud center of excellence to base its cost governance program on the cost optimization pillar of the Google Cloud Well-Architected Framework.

    Which two principles belong to the cost optimization pillar? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Take advantage of elasticity
    - id: b
      text:
        en: |-
          Foster a culture of cost awareness
    - id: c
      text:
        en: |-
          Set realistic targets for reliability
    - id: d
      text:
        en: |-
          Optimize data and storage
    - id: e
      text:
        en: |-
          Optimize continuously
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      The cost optimization pillar has four principles: align cloud spending with business value, foster a culture of cost awareness, optimize resource usage, and optimize continuously. They align with cloud FinOps practices.
  options:
    a:
      en: |-
        Take advantage of elasticity is a principle of the performance optimization pillar.
    c:
      en: |-
        Set realistic targets for reliability is a principle of the reliability pillar.
    d:
      en: |-
        Optimize data and storage is a principle of the sustainability pillar.
references:
  - title: "Well-Architected Framework: Cost optimization pillar"
    url: https://docs.cloud.google.com/architecture/framework/cost-optimization
  - title: "Google Cloud Well-Architected Framework"
    url: https://docs.cloud.google.com/architecture/framework
