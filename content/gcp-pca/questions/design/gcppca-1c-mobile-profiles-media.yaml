id: gcppca-1c-mobile-profiles-media
objective: "1.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A fitness startup is building a mobile app for Android and iOS. User profiles and workout logs are small JSON documents that users must be able to update while offline, with changes synchronized when the device reconnects. Users also upload workout videos of up to 2 GB that are streamed back later. The startup wants fully managed storage with no instances to size.

    Which two storage services should you use? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Filestore, for the workout videos" } }
    - { id: b, text: { en: "Firestore, for the profiles and workout logs" } }
    - { id: c, text: { en: "Cloud SQL for MySQL, for the profiles and workout logs" } }
    - { id: d, text: { en: "Cloud Storage, for the workout videos" } }
    - { id: e, text: { en: "Bigtable, for the profiles and workout logs" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Firestore is a serverless document database whose Android and Apple client SDKs keep a local cache with offline persistence enabled by default, then synchronize changes when the device reconnects. Cloud Storage is serverless object storage suited to large unstructured files such as videos, which clients upload and stream directly.
  options:
    a: { en: "Filestore provides NFS file shares for VMs and GKE with provisioned capacity; it is not designed for direct uploads from mobile clients." }
    c: { en: "Cloud SQL runs on instances that you size, and it has no client SDK that provides offline persistence and synchronization." }
    e: { en: "Bigtable runs on provisioned nodes, targets very large operational and analytical workloads, and has no mobile offline synchronization." }
references:
  - title: Enable offline data
    url: https://docs.cloud.google.com/firestore/native/docs/manage-data/enable-offline
  - title: Storage classes
    url: https://docs.cloud.google.com/storage/docs/storage-classes
