id: gcppca-1c-global-relational-writes
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company is building a ledger service for customers in North America, Europe and Asia. Application instances on every continent must be able to write, transactions must be strongly consistent globally, and the database must scale horizontally with SQL and without manual sharding. The business wants the highest availability SLA that Google Cloud offers for a database.

    Which database should you choose?
body:
  options:
    - id: a
      text: { en: "Cloud SQL for PostgreSQL with cross-region read replicas on each continent" }
    - id: b
      text: { en: "Spanner with a multi-region instance configuration" }
    - id: c
      text: { en: "AlloyDB for PostgreSQL with secondary clusters in two other regions" }
    - id: d
      text: { en: "Bigtable with replicated clusters in three regions" }
answer: { optionId: b }
explanation:
  correct:
    en: Spanner is a globally distributed relational database with synchronous replication and strong consistency across regions, automatic sharding, and SQL (GoogleSQL or PostgreSQL interface). Multi-region configurations offer higher availability than regional ones, with an SLA of up to 99.999 %.
  options:
    a: { en: "Cloud SQL accepts writes only on its primary instance; cross-region read replicas serve reads and do not scale writes horizontally." }
    c: { en: "AlloyDB secondary clusters replicate across regions for disaster recovery and reads; writes still go to the single primary cluster, so writes do not scale horizontally." }
    d: { en: "Bigtable is a NoSQL wide-column store; replication between its clusters is not strongly consistent and it offers no multi-row relational transactions for a ledger." }
references:
  - title: Regional, dual-region, and multi-region configurations
    url: https://docs.cloud.google.com/spanner/docs/instance-configurations
