id: gcppca-1b-cloud-nat-private-google-access
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A security policy forbids external IP addresses on the VMs of a subnet in europe-west1. The VMs must read objects from Cloud Storage and must download operating system updates from public repositories on the internet. No connection initiated from the internet may reach the VMs.

    Which actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Assign ephemeral external IP addresses to the VMs, and block inbound traffic with firewall rules.
    - id: b
      text:
        en: |-
          Enable Private Google Access on the subnet.
    - id: c
      text:
        en: |-
          Create a Private Service Connect endpoint for each public update repository.
    - id: d
      text:
        en: |-
          Create VPC Network Peering between the VPC network and a Google-managed network that hosts Cloud Storage.
    - id: e
      text:
        en: |-
          Create a Cloud NAT gateway on a Cloud Router in europe-west1 for the subnet.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Private Google Access, enabled per subnet, lets VMs that have only internal IP addresses reach Google APIs and services such as Cloud Storage. Public NAT on Cloud NAT gives those VMs outbound internet access through shared external addresses and allows only response packets inbound, so no unsolicited connection reaches them.
  options:
    a:
      en: |-
        External IP addresses on the VMs are forbidden by the security policy.
    c:
      en: |-
        Private Service Connect endpoints reach published services and Google APIs, not arbitrary public repositories on the internet.
    d:
      en: |-
        Cloud Storage is not reached through VPC Network Peering; VMs without external addresses reach it with Private Google Access.
references:
  - title: "Private Google Access"
    url: https://docs.cloud.google.com/vpc/docs/private-google-access
  - title: "Cloud NAT overview"
    url: https://docs.cloud.google.com/nat/docs/overview
