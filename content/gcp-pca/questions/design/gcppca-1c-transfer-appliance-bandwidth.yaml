id: gcppca-1c-transfer-appliance-bandwidth
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A research institute must move 450 TB of archived instrument data from its data center in Germany to Cloud Storage within six weeks. Its internet connection is 100 Mbps and is shared with production traffic.

    What should you recommend?
body:
  options:
    - id: a
      text: { en: "Storage Transfer Service with transfer agents installed on premises" }
    - id: b
      text: { en: "Transfer Appliance" }
    - id: c
      text: { en: "Parallel uploads with gcloud storage cp from several servers" }
    - id: d
      text: { en: "BigQuery Data Transfer Service" }
answer: { optionId: b }
explanation:
  correct:
    en: At 100 Mbps, 450 TB would take more than a year to upload, far beyond six weeks. Transfer Appliance is meant for cases where a network upload would take more than a week; it is available in EU member states, and data is copied locally, shipped to Google and uploaded to Cloud Storage.
  options:
    a: { en: "Storage Transfer Service still sends the data over the 100 Mbps link, so it cannot meet the deadline." }
    c: { en: "Parallel uploads do not add bandwidth: the shared 100 Mbps link remains the bottleneck." }
    d: { en: "BigQuery Data Transfer Service loads data into BigQuery from supported sources; it does not move files from a data center to Cloud Storage." }
references:
  - title: Transfer Appliance
    url: https://docs.cloud.google.com/transfer-appliance/docs/4.0/overview
