id: gcppca-1a-bigquery-long-term-storage
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company stores 800 TB in BigQuery tables that are partitioned by day. Only the partitions of the last 30 days are modified; older partitions are queried by analysts a few times a month. To reduce storage costs, an engineer proposes to export the partitions that are older than 90 days to Coldline storage in Cloud Storage and to delete them from BigQuery. The analysts must keep querying the old data with today's performance and without extra steps.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Implement the proposal, and let the analysts query the exported files through external tables defined in BigQuery.
    - id: b
      text:
        en: |-
          Copy the partitions that are older than 90 days to a separate dataset every month so that they are billed at a lower rate.
    - id: c
      text:
        en: |-
          Keep the partitions in BigQuery, because partitions that are not modified for 90 consecutive days are billed at the long-term rate.
    - id: d
      text:
        en: |-
          Set a 90-day partition expiration on the tables, and reload old partitions from Cloud Storage when an analyst needs them.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      BigQuery bills a table or partition that hasn't been modified for 90 consecutive days at the long-term storage rate, which is about 50% lower for physical storage, with the same performance, durability and availability. Each partition is evaluated separately, and querying data doesn't reset the timer, so the old partitions get cheaper automatically and stay queryable as before.
  options:
    a:
      en: |-
        External tables over Coldline files don't keep BigQuery's native storage performance, the long-term discount doesn't apply to external sources, and reads from Coldline add retrieval charges.
    b:
      en: |-
        A copy job that writes to a destination table counts as a modification of that table, so the copies start again as active storage; the move costs effort and saves nothing.
    d:
      en: |-
        Expiring partitions deletes them, so analysts would have to wait for reloads, which adds steps and load jobs instead of keeping the data queryable.
references:
  - title: "BigQuery pricing"
    url: https://cloud.google.com/bigquery/pricing
