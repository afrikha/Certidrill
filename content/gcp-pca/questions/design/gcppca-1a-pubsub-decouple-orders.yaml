id: gcppca-1a-pubsub-decouple-orders
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online retailer's checkout service calls the invoicing, loyalty and warehouse services synchronously. When the warehouse service is slow, checkouts time out. The architect wants the checkout service to record each order once and let every downstream service process it independently at its own pace. More consumers will be added next year without changing the checkout service.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Have the checkout service write each order to a Cloud SQL table that every downstream service polls once a minute.
    - id: b
      text:
        en: |-
          Put an internal Application Load Balancer in front of the three downstream services, and call it from the checkout service.
    - id: c
      text:
        en: |-
          Create a Cloud Scheduler job for each downstream service that sends it the latest orders every minute.
    - id: d
      text:
        en: |-
          Publish each order to a Pub/Sub topic, and create one subscription for each downstream service.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Pub/Sub decouples the services that produce messages from the services that process them: the checkout service publishes the order once and doesn't wait for the consumers. Each subscription receives every message, so each downstream service processes orders at its own pace, and a new consumer only needs a new subscription.
  options:
    a:
      en: |-
        Polling a shared table couples every consumer to the checkout database schema, adds delay and load, and requires custom tracking of which orders each service has processed.
    b:
      en: |-
        A load balancer distributes synchronous requests; the checkout service would still wait for slow services and would have to call each new consumer itself.
    c:
      en: |-
        Cloud Scheduler triggers jobs on a schedule; it doesn't carry orders, and someone must still build and maintain a job per consumer.
references:
  - title: "What is Pub/Sub? | Google Cloud Documentation"
    url: https://docs.cloud.google.com/pubsub/docs/overview
