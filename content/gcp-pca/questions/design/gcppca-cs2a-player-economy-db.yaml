id: gcppca-cs2a-player-economy-db
objective: "1.3.5"
type: single
caseStudy: gcppca-cs2a-emberfall
difficulty: 2
status: draft
stem:
  en: |
    Emberfall must choose the database for the new player economy service of Shardline 2. The database must meet the technical requirements for the player economy and keep operational overhead low for the platform team.

    Which database should you recommend?
body:
  options:
    - id: a
      text: { en: "Cloud SQL for PostgreSQL Enterprise Plus edition with high availability in us-central1 and cross-region read replicas in europe-west1 and asia-east1" }
    - id: b
      text: { en: "AlloyDB for PostgreSQL with a primary cluster in us-central1 and secondary clusters in europe-west1 and asia-east1" }
    - id: c
      text: { en: "Spanner with a multi-region instance configuration that spans North America, Europe and Asia, such as nam-eur-asia1" }
    - id: d
      text: { en: "Bigtable with clusters in us-central1, europe-west1 and asia-east1 and an app profile that uses multi-cluster routing" }
answer: { optionId: c }
explanation:
  correct:
    en: "Spanner is a relational database queried with SQL that provides strongly consistent transactions and scales writes horizontally by adding compute capacity. Its multi-region configurations are designed for 99.999 % availability, compared with 99.99 % for regional configurations. The three-continent configuration nam-eur-asia1 places read-write replicas in North America and read-only replicas in Belgium and Taiwan, which serve low-latency reads to players in Europe and Asia."
  options:
    a: { en: "Cloud SQL has a single primary that scales vertically, so it cannot scale writes horizontally to 150,000 transactions per second, and its cross-region read replicas are asynchronous." }
    b: { en: "AlloyDB also writes through a single primary cluster, and its cross-region secondary clusters are asynchronous replicas, so it does not give horizontal write scaling with the required availability." }
    d: { en: "Bigtable is a NoSQL wide-column store whose transactions are limited to a single row, not a relational schema, and replication between its clusters is eventually consistent, so a purchase could be read or applied inconsistently." }
references:
  - title: Regional, dual-region, and multi-region configurations
    url: https://docs.cloud.google.com/spanner/docs/instance-configurations
