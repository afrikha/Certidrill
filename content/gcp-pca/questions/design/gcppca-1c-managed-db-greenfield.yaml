id: gcppca-1c-managed-db-greenfield
objective: "1.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup is designing a new order application on Google Cloud with a cloud-first approach. It needs a MySQL-compatible relational database that survives a zone failure with automatic failover. Its two engineers must not spend time on database replication, patching or backups.

    What should you use?
body:
  options:
    - id: a
      text: { en: "MySQL on two Compute Engine VMs in different zones, with replication scripts" }
    - id: b
      text: { en: "Bigtable, with a replicated instance that has clusters in two zones" }
    - id: c
      text: { en: "Cloud SQL for MySQL, with the high availability (regional) configuration" }
    - id: d
      text: { en: "MySQL in a StatefulSet on GKE Standard, with a zonal Persistent Disk" }
answer: { optionId: c }
explanation:
  correct:
    en: Cloud SQL is a managed database service that handles patching and automated backups. Its high availability configuration keeps a primary and a standby in two zones of the region with synchronous replication, and fails over automatically if the primary's zone fails.
  options:
    a: { en: "Self-managed MySQL on VMs leaves replication, failover, patching and backups to the engineers." }
    b: { en: "Bigtable is a NoSQL wide-column database; it is not MySQL-compatible." }
    d: { en: "A self-managed MySQL StatefulSet still leaves database operations to the team, and a zonal disk does not survive a zone failure." }
references:
  - title: About high availability
    url: https://docs.cloud.google.com/sql/docs/mysql/high-availability
