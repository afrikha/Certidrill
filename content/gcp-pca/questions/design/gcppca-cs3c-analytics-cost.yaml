id: gcppca-cs3c-analytics-cost
objective: "1.1.4"
type: single
caseStudy: gcppca-cs3c-lanternhall-learning
difficulty: 3
status: draft
stem:
  en: |
    You need to change how Lanternhall pays for BigQuery. The solution must meet the business requirement about analytics costs and the technical requirement for analytics queries.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Keep on-demand pricing, and set a custom QueryUsagePerDay quota on the analytics projects that matches the monthly budget divided by the number of days." } }
    - { id: b, text: { en: "Create an Enterprise edition reservation with a baseline of 0 slots and a maximum reservation size of 2,000 slots, and assign the analytics projects to it." } }
    - { id: c, text: { en: "Keep on-demand pricing, and create a Cloud Billing budget on the analytics projects that notifies the finance team at 50 %, 90 % and 100 % of the monthly amount." } }
    - { id: d, text: { en: "Purchase a capacity commitment of 500 Enterprise edition slots, create a reservation with a baseline of 500 slots and a maximum reservation size of 500 slots, and assign the analytics projects to it." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Baseline slots are always allocated and billed, so a reservation whose maximum size equals its baseline has no autoscaling capacity and costs the same every month; the commitment lowers the price of those slots. When the queries need more slots than the reservation has, BigQuery queues their work until slots free up, so queries run slower at busy times but are not rejected.
  options:
    a:
      en: When a custom query quota is exhausted, BigQuery returns quota exceeded errors, so queries are rejected because of a cost control.
    b:
      en: Autoscaled slots are billed while they are scaled up, so the cost varies with the analysts' activity, up to the maximum size, instead of being fixed.
    c:
      en: A budget sends notifications but does not limit or fix the cost; the bill still follows the bytes processed by the on-demand queries.
references:
  - title: Understand BigQuery editions
    url: https://docs.cloud.google.com/bigquery/docs/editions-intro
  - title: Create custom query quotas
    url: https://docs.cloud.google.com/bigquery/docs/custom-quotas
