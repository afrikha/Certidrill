id: gcppca-1a-bigquery-replica-cross-region-join
objective: "1.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's sales dataset is in BigQuery in us-central1, where the sales application keeps writing to it. A marketing team in Europe must join the sales data with a marketing dataset that has to stay in europe-west1. The team wants a read-only copy of the sales dataset in europe-west1 that BigQuery keeps up to date automatically, without building or scheduling copy jobs.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Change the location of the sales dataset to europe-west1, and point the sales application at the dataset in its new location.
    - id: b
      text:
        en: |-
          Export the sales tables to Cloud Storage every night, copy the files to a bucket in europe-west1, and reload them into a new dataset.
    - id: c
      text:
        en: |-
          Run the join queries with europe-west1 as the job location, and reference the sales dataset in us-central1 directly in the queries.
    - id: d
      text:
        en: |-
          Add a secondary replica of the sales dataset in europe-west1 with cross-region dataset replication, and run the joins in that region.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Cross-region dataset replication keeps a read-only secondary replica of a dataset in another region, updated asynchronously from the primary that keeps accepting writes. The marketing team can run read-only queries in europe-west1 that join the replica with the marketing dataset; the secondary storage and the replication are billed separately.
  options:
    a:
      en: |-
        A dataset's location can't be changed after it is created; moving it means copying or recreating it.
    b:
      en: |-
        Nightly exports and reloads are the copy jobs the team wants to avoid, and the copy is up to a day old.
    c:
      en: |-
        Every dataset in a request must match the job location, so a job in europe-west1 can't read a dataset in us-central1 and returns an error.
references:
  - title: "Cross-region dataset replication | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/data-replication
  - title: "BigQuery locations | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/locations
