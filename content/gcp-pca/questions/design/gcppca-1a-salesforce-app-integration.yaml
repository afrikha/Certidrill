id: gcppca-1a-salesforce-app-integration
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A sales organization uses Salesforce. When an opportunity is marked as won, an order must be created through the REST API of the company's ERP system on Google Cloud, and an event must be published to a Pub/Sub topic for the analytics team. The company wants a fully managed, low-code solution in which a managed connector handles the Salesforce authentication and API details, and executions are monitored in Cloud Logging.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          An Application Integration flow that uses an Integration Connectors connection to Salesforce, calls the ERP API and publishes to Pub/Sub
    - id: b
      text:
        en: |-
          A Cloud Run function that polls the Salesforce REST API every minute with OAuth credentials stored in Secret Manager
    - id: c
      text:
        en: |-
          A Datastream stream from Salesforce to BigQuery, followed by a scheduled query that sends the new orders to the ERP API
    - id: d
      text:
        en: |-
          A Workflows workflow that calls the Salesforce REST API and the ERP API in sequence, started by Cloud Scheduler
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Application Integration is Google Cloud's serverless integration platform: integrations are designed in a drag-and-drop editor with little or no code, start from event-driven triggers, map data between applications and are monitored with Cloud Logging and Cloud Monitoring. Integration Connectors provide the connection to Salesforce and handle authentication, endpoint configuration and protocol translation.
  options:
    b:
      en: |-
        A polling function is custom code: the team must handle Salesforce authentication, API changes, retries and duplicate detection itself, which isn't the low-code, connector-based solution required.
    c:
      en: |-
        Datastream replicates data for analytics, and a scheduled query can't call an external REST API, so this design doesn't create the orders.
    d:
      en: |-
        Workflows orchestrates HTTP calls, but the team must code the Salesforce authentication and polling logic; it provides no managed Salesforce connector or event trigger.
references:
  - title: "Application Integration overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/application-integration/docs/overview
  - title: "Integration Connectors overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/integration-connectors/docs/overview
