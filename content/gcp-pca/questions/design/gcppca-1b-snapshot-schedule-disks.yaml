id: gcppca-1b-snapshot-schedule-disks
objective: "1.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A company runs 50 Compute Engine VMs with Persistent Disk volumes. It wants every disk to be backed up automatically every day, with each backup kept for 14 days and then deleted. The company wants the least administrative effort and no custom scripts.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a cron job on each VM that runs the gcloud compute disks snapshot command every night.
    - id: b
      text:
        en: |-
          Copy the content of each disk to a Cloud Storage bucket every night with gcloud storage rsync, and add a lifecycle rule that deletes objects after 14 days.
    - id: c
      text:
        en: |-
          Create a snapshot schedule with a daily frequency and a 14-day retention policy, and attach it to the disks.
    - id: d
      text:
        en: |-
          Create a machine image of each VM every night with a Cloud Scheduler job that calls a Cloud Run function.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Snapshot schedules are the recommended way to back up Compute Engine disks: a schedule defines the frequency and a retention policy, and Compute Engine creates and deletes the incremental snapshots automatically. Attaching one schedule to the 50 disks needs no scripts.
  options:
    a:
      en: |-
        Cron jobs on 50 VMs are custom scripts to maintain, and they do not delete old snapshots.
    b:
      en: |-
        A file copy is not a consistent disk backup, and it is a custom process to run on every VM.
    d:
      en: |-
        A Cloud Scheduler job with a function is custom code, and it still needs logic to delete old machine images.
references:
  - title: "Create schedules for disk snapshots"
    url: https://docs.cloud.google.com/compute/docs/disks/scheduled-snapshots
  - title: "About archive and standard disk snapshots"
    url: https://docs.cloud.google.com/compute/docs/disks/snapshots
