id: gcppca-1c-spot-render-batch
objective: "1.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An animation studio renders frames in a batch queue once a week. Each frame takes about 10 minutes, the render manager automatically requeues any frame whose VM disappears, and the deadlines leave room for retries. The studio wants the lowest possible compute cost.

    Which VM option should you use?
body:
  options:
    - id: a
      text: { en: "Standard VMs covered by a 3-year resource-based committed use discount" }
    - id: b
      text: { en: "Standard VMs placed on sole-tenant nodes" }
    - id: c
      text: { en: "Spot VMs created by a managed instance group" }
    - id: d
      text: { en: "Standard VMs that receive sustained use discounts" }
answer: { optionId: c }
explanation:
  correct:
    en: Spot VMs use excess Compute Engine capacity at up to 91 % off on-demand prices. Compute Engine can preempt them at any time and they have no SLA, which is acceptable here because the render manager requeues interrupted frames. A managed instance group recreates preempted VMs when capacity returns.
  options:
    a: { en: "A 3-year commitment suits steady usage; a weekly batch would leave the committed resources idle most of the time, and commitments cannot be canceled." }
    b: { en: "Sole-tenant nodes dedicate physical hosts for isolation or licensing and cost more than shared VMs." }
    d: { en: "Sustained use discounts grow with the share of the month a resource runs, so a weekly batch earns little, and they are far smaller than Spot prices." }
references:
  - title: Spot VMs
    url: https://docs.cloud.google.com/compute/docs/instances/spot
