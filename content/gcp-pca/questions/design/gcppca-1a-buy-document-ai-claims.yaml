id: gcppca-1a-buy-document-ai-claims
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company receives 50,000 scanned claim forms every month, and clerks type the policy number, the claim amount and other fields into the claims system. The company wants to extract these fields automatically. Its strategy is to buy rather than build capabilities that don't differentiate it from competitors, and it has no machine learning team.

    Which approach should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Train a custom extraction model on GKE nodes with GPUs, using an open-source OCR library and the archive of past forms.
    - id: b
      text:
        en: |-
          Hire a data science team to build and serve a TensorFlow extraction model on Compute Engine VMs.
    - id: c
      text:
        en: |-
          Use Document AI processors to extract the fields, with a custom extractor if no pretrained processor fits the form.
    - id: d
      text:
        en: |-
          Store the scans in Cloud Storage, and build a Cloud Run web app that makes it faster for clerks to type the fields.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Document AI is a managed document processing service that extracts structured data from documents without specialized machine learning expertise. Pretrained processors such as Form Parser and Enterprise Document OCR cover common needs, and a custom extractor can be created for a specific form, which matches a "buy" disposition for a non-differentiating capability.
  options:
    a:
      en: |-
        Training and running a custom model on GKE is a "build" choice that requires machine learning skills the company doesn't have.
    b:
      en: |-
        Building a data science team and serving its own model is the most expensive "build" option for a capability that doesn't differentiate the company.
    d:
      en: |-
        A data entry app keeps the manual work, so the fields still aren't extracted automatically.
references:
  - title: "Document AI overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/document-ai/docs/overview
