id: gcppca-1a-api-gateway-partner-webhook
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company receives shipment-status webhooks from a single carrier. The webhooks call an HTTP endpoint implemented as a Cloud Run function. The company wants a managed gateway in front of the function that requires an API key from the carrier and rejects other callers, with request logging and monitoring. No developer portal, API monetization or API product catalog is needed, and the company wants the lowest cost.

    What should you use?
body:
  options:
    - id: a
      text:
        en: |-
          Apigee, with an API product for the carrier and a VerifyAPIKey policy in the API proxy
    - id: b
      text:
        en: |-
          A global external Application Load Balancer, with a Cloud Armor rule that matches a header that the carrier sends
    - id: c
      text:
        en: |-
          A public function that compares the key in each request with a value stored in an environment variable
    - id: d
      text:
        en: |-
          API Gateway, with an OpenAPI 2.0 specification that requires an API key and the function as its backend
answer: { optionId: d }
explanation:
  correct:
    en: |-
      API Gateway provides managed, secure access to backends such as Cloud Run functions through an API defined in an OpenAPI 2.0 specification. It can require API keys, and it provides logging and monitoring of latency, traffic and errors, which covers this single-partner webhook without the cost of a full API management platform.
  options:
    a:
      en: |-
        Apigee meets the requirement, but its API products, portals and analytics are capabilities the company doesn't need, at a higher cost than API Gateway.
    b:
      en: |-
        Cloud Armor filters traffic at the load balancer but doesn't issue or manage API keys; matching a static header is a weak shared secret, not key validation.
    c:
      en: |-
        Validating the key in code isn't a managed gateway, and a secret in an environment variable is custom security logic that the team must maintain.
references:
  - title: "About API Gateway | Google Cloud Documentation"
    url: https://docs.cloud.google.com/api-gateway/docs/about-api-gateway
