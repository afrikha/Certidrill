id: gcppca-1c-airflow-dags-orchestration
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company orchestrates its data pipelines with 120 Apache Airflow DAGs on a self-managed server. The DAGs start BigQuery jobs, launch Dataflow pipelines, and call an on-premises API, with dependencies and retries between tasks. The company wants to move orchestration to Google Cloud with minimal rework of the DAGs and without managing the Airflow infrastructure.

    Which service should you use?
body:
  options:
    - id: a
      text: { en: "Cloud Scheduler jobs that publish messages to Pub/Sub topics" }
    - id: b
      text: { en: "Managed Service for Apache Airflow (formerly Cloud Composer)" }
    - id: c
      text: { en: "Workflows, with one workflow definition for each DAG" }
    - id: d
      text: { en: "Dataflow Flex Templates launched on a schedule" }
answer: { optionId: b }
explanation:
  correct:
    en: Managed Service for Apache Airflow, the new name of Cloud Composer, is a fully managed workflow orchestration service built on Apache Airflow. The existing Python DAGs, with their task dependencies and retries, run on it with little change, and Google manages the Airflow environment.
  options:
    a: { en: "Cloud Scheduler triggers jobs on a timetable but has no notion of task dependencies, so the DAG logic would have to be rebuilt elsewhere." }
    c: { en: "Workflows can orchestrate Google Cloud services, but every DAG would have to be rewritten in Workflows syntax, which fails the minimal-rework requirement." }
    d: { en: "Dataflow templates run data processing pipelines; they do not orchestrate dependencies between BigQuery jobs, Dataflow jobs and API calls." }
references:
  - title: Managed Airflow overview
    url: https://docs.cloud.google.com/composer/docs/composer-3/composer-overview
