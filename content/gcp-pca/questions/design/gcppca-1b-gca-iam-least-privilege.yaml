id: gcppca-1b-gca-iam-least-privilege
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    An administrator has enabled Gemini Cloud Assist on a project. A group of developers must be able to chat with Gemini Cloud Assist about the project's resources and let it discover the assets that are relevant to their questions. The developers must not get permission to change the project's resources.

    Which roles should you grant the group on the project?
body:
  options:
    - id: a
      text:
        en: |-
          Writer
    - id: b
      text:
        en: |-
          Gemini Cloud Assist Investigation Owner
    - id: c
      text:
        en: |-
          Viewer and Cloud Asset Owner
    - id: d
      text:
        en: |-
          Gemini Cloud Assist User and Cloud Asset Viewer
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The Gemini Cloud Assist User role allows a principal to chat with Gemini Cloud Assist and invoke its agents, and the Cloud Asset Viewer role lets the agent discover the assets relevant to a question. Neither role allows changes to the project's resources, which meets the least-privilege requirement. Gemini Cloud Assist is a Preview offering.
  options:
    a:
      en: |-
        Writer is a basic role that allows changes to most resources in the project.
    b:
      en: |-
        The Investigation Owner role is granted on an individual investigation to the person who creates it; it does not provide general chat access.
    c:
      en: |-
        Viewer and Cloud Asset Owner do not include the Gemini Cloud Assist User role, and Cloud Asset Owner grants more than the read access the agent needs.
references:
  - title: "IAM requirements for using Gemini Cloud Assist"
    url: https://docs.cloud.google.com/cloud-assist/iam-requirements
  - title: "Set up Gemini Cloud Assist"
    url: https://docs.cloud.google.com/cloud-assist/set-up-gemini
