id: gcppca-1b-shared-vpc-central-network
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A company has 25 projects in one organization, one per application team. A central network team must manage the subnets, routes, firewall rules and hybrid connectivity, while application teams create VMs in their own projects, in the subnets that the network team assigns to them.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a VPC network in each project, and connect each one to a central hub VPC network with VPC Network Peering.
    - id: b
      text:
        en: |-
          Grant the network team the Compute Network Admin role on every project, and let each team keep its own VPC network.
    - id: c
      text:
        en: |-
          Create a Shared VPC host project managed by the network team, attach the 25 projects as service projects, and grant each team the Compute Network User role on its subnets.
    - id: d
      text:
        en: |-
          Create one VPC network in a central project, and grant the application teams the Writer basic role on that project.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Shared VPC lets projects in the same organization use a common VPC network in a host project, so the network team keeps central control of subnets, routes and firewall rules. Service project admins who hold the Compute Network User role on specific subnets can create VMs in those subnets from their own projects.
  options:
    a:
      en: |-
        Peered networks remain administratively separate, so each team would still control its own network, and peering is not transitive between the spokes.
    b:
      en: |-
        The network team would manage 25 separate networks instead of one shared network, with 25 sets of subnets, routes and firewall rules.
    d:
      en: |-
        Writer on the central project lets application teams change the network itself, and their VMs would no longer be in their own projects.
references:
  - title: "Shared VPC"
    url: https://docs.cloud.google.com/vpc/docs/shared-vpc
