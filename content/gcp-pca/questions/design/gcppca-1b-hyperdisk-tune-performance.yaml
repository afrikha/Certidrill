id: gcppca-1b-hyperdisk-tune-performance
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A company runs PostgreSQL on a Compute Engine VM that has a 500 GiB data disk, on a machine series that supports Hyperdisk. For two days at each month-end, the batch jobs need about three times the usual IOPS, and the data size does not grow. The company wants to pay for the extra performance only during month-end and avoid any database downtime.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Use a Persistent Disk SSD volume of 1.5 TiB so that its size-based performance covers the month-end peak.
    - id: b
      text:
        en: |-
          Add a Local SSD volume for month-end, copy the busiest tables to it, and move them back after the batch jobs.
    - id: c
      text:
        en: |-
          Use a Hyperdisk Balanced volume, raise its provisioned IOPS before month-end, and lower it afterward without changing its size.
    - id: d
      text:
        en: |-
          Stop the VM before month-end to change it to a larger machine type, and change it back after the batch jobs.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Hyperdisk volumes are sized and provisioned for performance separately, and you can increase or decrease a volume's IOPS while it is attached to a running VM, without changing its size. Hyperdisk Balanced is recommended for PostgreSQL and MySQL workloads, so the company pays for the higher IOPS only around month-end.
  options:
    a:
      en: |-
        The company would pay for three times the capacity all month, and a disk cannot be shrunk afterward.
    b:
      en: |-
        Local SSD is temporary storage, and moving tables to it and back adds manual work and a risk of data loss.
    d:
      en: |-
        Stopping the VM causes downtime, and the disk's provisioned performance, not the machine type, is the bottleneck.
references:
  - title: "Google Cloud Hyperdisk overview"
    url: https://docs.cloud.google.com/compute/docs/disks/hyperdisks
  - title: "Modify the size and provisioned performance of a Hyperdisk volume"
    url: https://docs.cloud.google.com/compute/docs/disks/modify-hyperdisks
