id: gcppca-1b-memorystore-read-cache
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    An ecommerce company stores its product catalog in Cloud SQL for PostgreSQL. Most database queries are repeated reads of the same popular products, and page latency rises during sales events because the database CPU saturates. The catalog pages can show data that is a few seconds old.

    What should you do to reduce read latency?
body:
  options:
    - id: a
      text:
        en: |-
          Enable high availability on the Cloud SQL instance.
    - id: b
      text:
        en: |-
          Move the catalog to Cloud Storage, and read each product as a JSON object.
    - id: c
      text:
        en: |-
          Increase the storage capacity of the Cloud SQL instance to raise its disk performance.
    - id: d
      text:
        en: |-
          Add a Memorystore for Redis cache in front of the database, and serve popular products from the cache.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Memorystore for Redis provides sub-millisecond, in-memory data access, and caching is its main use case. Serving the repeated reads from the cache removes most of the load from the database CPU and lowers page latency, and the application tolerates the short staleness of cached data.
  options:
    a:
      en: |-
        The high availability standby cannot serve reads, so it adds no read capacity.
    b:
      en: |-
        Object storage has higher latency than an in-memory cache, and the application would lose its query capabilities.
    c:
      en: |-
        The bottleneck is CPU spent on repeated queries, not disk performance.
references:
  - title: "Memorystore for Redis overview"
    url: https://docs.cloud.google.com/memorystore/docs/redis/memorystore-for-redis-overview
