id: gcppca-cs2c-image-storage-class
objective: "2.2.5"
type: single
caseStudy: gcppca-cs2c-quillon
difficulty: 2
status: draft
stem:
  en: |
    You are configuring the Cloud Storage bucket that will hold Quillon's microscope images. The configuration must meet the business requirement about image storage cost and the technical requirement for image storage.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create the bucket with the Archive default storage class so that every image is stored at the lowest price from the moment it is uploaded." }
    - id: b
      text: { en: "Create the bucket with the Standard default storage class and lifecycle rules that move images to Nearline after 45 days and to Archive after 365 days." }
    - id: c
      text: { en: "Create the bucket with Autoclass enabled and Archive as the terminal storage class, so that objects move to colder classes when they are not read." }
    - id: d
      text: { en: "Create the bucket with the Standard default storage class and a 15-year retention policy so that images stay in the class that gives the fastest access." }
answer: { optionId: c }
explanation:
  correct:
    en: "Autoclass suits data with unpredictable access: objects that are not read move to Nearline after 30 days, to Coldline after 90 days and to Archive after 365 days, and an object that is read returns to Standard. Retrieval and early deletion fees generally do not apply with Autoclass, and nobody has to maintain storage class rules; the images are larger than 128 KiB, so they are eligible for transitions."
  options:
    a: { en: "Scientists read new datasets intensively for weeks, and every read from the Archive class incurs retrieval charges, which fails the requirement to avoid unpredictable retrieval costs." }
    b: { en: "Lifecycle rules are storage class rules that the storage team would have to maintain, and reads of old datasets in Nearline or Archive incur retrieval fees." }
    d: { en: "Keeping 15 years of rarely read images in the Standard class does not minimize storage cost; a retention policy protects data but does not change its class." }
references:
  - title: Autoclass
    url: https://docs.cloud.google.com/storage/docs/autoclass
