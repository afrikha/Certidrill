id: gcppca-2b-training-custom-service-account
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A pharmaceutical company runs serverless training jobs on Gemini Enterprise Agent Platform with the default configuration. The jobs read data from the bucket gs://assay-raw and write models to gs://assay-models through Cloud Storage FUSE. The same project contains 30 other buckets with clinical data that the jobs must not be able to read. The security team asks for least privilege with no change to the bucket layout.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the Custom Code Service Agent Storage Object Viewer on gs://assay-raw and Storage Object Admin on gs://assay-models.
    - id: b
      text:
        en: |-
          Run the jobs as a custom service account that has Storage Object Viewer on gs://assay-raw and Storage Object Admin on gs://assay-models.
    - id: c
      text:
        en: |-
          Create a VPC Service Controls perimeter around the project, and add the Cloud Storage and Agent Platform APIs as restricted services.
    - id: d
      text:
        en: |-
          Pass signed URLs for the two buckets to the training code as arguments, and remove the jobs' access to the other buckets.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      By default, a serverless training job uses the Custom Code Service Agent, which can access every bucket in the same project. Running the job as a custom service account limits it to the buckets where that account has roles: read-only on the input bucket and object administration on the output bucket. Writes to the read-only bucket then fail with a permission error.
  options:
    a:
      en: |-
        The service agent keeps its project-wide access, so adding bucket roles to it does not stop the jobs from reading the 30 other buckets.
    c:
      en: |-
        A perimeter blocks data movement across its boundary; all the buckets are inside the same project, so the jobs could still read them.
    d:
      en: |-
        Cloud Storage FUSE authenticates with the job's identity, not with signed URLs, and the default identity keeps its access to every bucket.
references:
  - title: Use Cloud Storage as a mounted file system | Gemini Enterprise Agent Platform | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/cloud-storage-file-system
