id: gcppca-2b-pipeline-template-registry
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The ML platform team of an insurer maintains a standard training pipeline written with the Kubeflow Pipelines SDK. Data science teams in other projects must run approved versions of the pipeline, refer to the current release with a stable tag such as latest, and keep the ability to run an older version. Access to publish new versions must be limited to the platform team.

    How should the platform team publish the pipeline?
body:
  options:
    - id: a
      text:
        en: |-
          Push a container image of the pipeline to a Docker format repository in Artifact Registry and tag it latest.
    - id: b
      text:
        en: |-
          Store the compiled YAML in a Cloud Storage bucket with Object Versioning and grant the teams read access.
    - id: c
      text:
        en: |-
          Submit the compiled pipeline to the Template Gallery so that it appears next to Google's prebuilt templates.
    - id: d
      text:
        en: |-
          Upload the compiled YAML to an Artifact Registry repository in KFP format with tags, and grant the teams read access.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Pipeline templates are stored in an Artifact Registry repository that uses the Kubeflow Pipelines format. Each upload creates a version identified by a digest, tags such as v1 or latest point to versions, and runs can reference a version or a tag. Artifact Registry IAM roles control who can upload and who can only read the templates.
  options:
    a:
      en: |-
        A pipeline template is a compiled YAML definition, not a container image; Agent Platform Pipelines runs templates from a KFP format repository.
    b:
      en: |-
        A bucket can hold the files, but it offers no template versions or tags that runs can reference, so teams would track generations by hand.
    c:
      en: |-
        The Template Gallery lists prebuilt templates; it is not where an organization publishes and versions its own pipelines.
references:
  - title: Create, upload, and use a pipeline template | Gemini Enterprise Agent Platform | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/pipelines/create-pipeline-template
