id: gcppca-cs5b-upf-networking
objective: "2.3.3"
type: single
caseStudy: gcppca-cs5b-corvane-telecom
difficulty: 3
status: draft
stem:
  en: |
    You are designing the GKE environment for the IoT packet core. The design must meet the technical requirement for the packet core CNFs and the vendor's network design for the user plane Pods.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a GKE Autopilot cluster in the signalling VPC network, and expose the user plane Pods to the subscriber VPC network through an internal passthrough Network Load Balancer." } }
    - { id: b, text: { en: "Create a GKE Standard cluster with multi-network support, add a Device-type Pod network on the subscriber VPC network for DPDK, and attach the user plane Pods to it in addition to the default Pod network on the signalling VPC network." } }
    - { id: c, text: { en: "Create a GKE Standard cluster in the signalling VPC network with two node pools in two subnets, and separate the subscriber traffic from the signalling traffic with Kubernetes network policies." } }
    - { id: d, text: { en: "Create a GKE Standard cluster in the signalling VPC network, connect the subscriber VPC network to it with VPC Network Peering, and route subscriber traffic to the user plane Pods through the peering." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Multi-network support for Pods, available on GKE Standard clusters, removes the single-interface limit: a Pod can attach to several Pod networks, each tied to a VPC network. A Device-type network passes a VM network interface to the Pod, which DPDK workloads need, so the user plane Pods get a signalling interface on the default Pod network and a separate subscriber interface in its own VPC network, as the vendor requires.
  options:
    a:
      en: A load balancer forwards subscriber traffic to the Pods' single interface in the signalling VPC network, so the Pods do not get a separate interface in another VPC network, and Autopilot does not offer this multi-interface design.
    c:
      en: Node pools in two subnets of the same VPC network still give each Pod one interface, and network policies filter traffic but do not create a second interface in another VPC network.
    d:
      en: Peering lets the two VPC networks exchange routes, but each Pod still has a single interface in the signalling VPC network and no DPDK interface in the subscriber VPC network.
references:
  - title: About multi-network support for Pods
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-multinetwork-support-for-pods
