id: gcppca-2a-hyperdisk-ha-rpo-zero
objective: "2.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A clinic network runs a self-managed PostgreSQL server on a Compute Engine VM in zone us-central1-a. A standby VM can be started in us-central1-b. Management requires that a zone outage loses no committed transaction and that database storage come back within seconds on the standby VM. The application must not be changed to add database replication.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store the database on a Hyperdisk Balanced High Availability disk replicated in us-central1-a and us-central1-b." } }
    - { id: b, text: { en: "Store the database on a zonal Hyperdisk Balanced disk with an hourly snapshot schedule." } }
    - { id: c, text: { en: "Store the database on Local SSD disks in a RAID 0 array on the primary VM." } }
    - { id: d, text: { en: "On a zonal failure, force-attach the disk to the standby VM in us-central1-b and start PostgreSQL." } }
    - { id: e, text: { en: "On a zonal failure, create a new disk from the latest snapshot in us-central1-b and attach it to the standby VM." } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      Hyperdisk Balanced High Availability (like regional Persistent Disk) writes synchronously to two zones of a region, so committed data is not lost when one zone fails. Failover consists of force-attaching the disk to the standby VM in the other zone, which takes seconds for the storage, instead of the minutes needed to restore a snapshot.
  options:
    b: { en: "Hourly snapshots can lose up to an hour of transactions, so the RPO is not zero." }
    c: { en: "Local SSD data is tied to the VM and is not replicated to another zone, so a zone outage loses it." }
    e: { en: "Restoring from a snapshot loses the changes since the snapshot and takes minutes rather than seconds." }
references:
  - title: Build HA services using synchronously replicated disks
    url: https://docs.cloud.google.com/compute/docs/disks/high-availability-regional-persistent-disk
