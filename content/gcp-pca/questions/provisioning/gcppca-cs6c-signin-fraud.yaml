id: gcppca-cs6c-signin-fraud
objective: "2.1.3"
type: single
caseStudy: gcppca-cs6c-aldermoor-horizon
difficulty: 2
status: draft
stem:
  en: |
    You are designing the protection of the member website against account takeovers. The design must meet the business requirement for account takeovers and stop the kind of attack that Aldermoor suffered last quarter.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Add a Cloud Armor rate-limiting rule on the sign-in path that blocks each client IP address for an hour after 10 failed sign-in attempts in one minute." } }
    - { id: b, text: { en: "Enable the Cloud Armor preconfigured WAF rules for the OWASP Top 10 risks on the backend service of the member website, in enforcement mode on the sign-in path." } }
    - { id: c, text: { en: "Put the member website behind Identity-Aware Proxy, and require every member to sign in with a Google account before the website's own sign-in page is shown." } }
    - { id: d, text: { en: "Protect sign-in and redemption with Fraud Defense account defense, create assessments with the member's account ID, and require multi-factor verification when a sign-in is flagged as suspicious." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Account defense, a feature of Google Cloud Fraud Defense (which now includes reCAPTCHA), builds a behavioral model of each site's users from the assessments of critical actions such as sign-ins, and labels high-risk activity like credential stuffing and account takeover as suspicious. Aldermoor keeps the current sign-in method and asks only for the flagged sign-ins to complete multi-factor verification before members can redeem miles. Legitimate members who sign in normally see no extra step.
  options:
    a:
      en: The attack used residential proxies with only a few attempts from each IP address, so a per-IP threshold is not reached, and the stolen credentials were valid.
    b:
      en: WAF rules detect malicious request patterns such as SQL injection or cross-site scripting; a sign-in with valid stolen credentials contains no such pattern.
    c:
      en: Requiring a Google account changes the sign-in method of all 14 million members and adds friction for every legitimate member.
references:
  - title: Detect and prevent account-related fraudulent activities on websites
    url: https://docs.cloud.google.com/recaptcha/docs/account-defender
