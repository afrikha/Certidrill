id: gcppca-2b-gpu-flex-start
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legal-tech company fine-tunes a language model on GPU VMs a few times a year. Each run takes about 4 days and cannot resume after an interruption. The team does not know in advance when each dataset will be ready, so it wants to request the GPUs when the data is ready and can accept waiting some hours for capacity. The company wants a lower price than on-demand without any long-term commitment.

    Which consumption option should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Spot VMs, which offer the deepest discount on GPU capacity.
    - id: b
      text:
        en: |-
          A standard reservation with a 1-year committed use discount.
    - id: c
      text:
        en: |-
          Flex-start VMs, requested when each dataset is ready.
    - id: d
      text:
        en: |-
          A future reservation in calendar mode for each planned run.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Flex-start provides discounted GPU capacity for up to seven days, and the VMs are not preempted once they run. It is designed for short workloads that can wait for capacity, which matches a 4-day run that starts whenever the data is ready, and it needs no commitment.
  options:
    a:
      en: |-
        Spot VMs are the cheapest, but Compute Engine can preempt them at any time, and the run cannot resume after an interruption.
    b:
      en: |-
        The committed use discount requires a commitment of a year or more for a workload that runs a few days a year.
    d:
      en: |-
        Calendar mode reserves capacity for a future period that you choose in advance, but the team cannot plan the start dates of its runs.
references:
  - title: Consumption options for AI Hypercomputer | Google Cloud Documentation
    url: https://docs.cloud.google.com/ai-hypercomputer/docs/consumption-models
