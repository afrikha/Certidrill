id: gcppca-2a-shared-vpc-subnet-user
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company wants a central network team to own all VPC networks, firewall policies and hybrid connectivity. Application teams each have their own project in the same organization, and they deploy their own VMs.

    The analytics team must be able to create VMs only in the subnet named analytics-euw1, and in no other subnet. The solution must follow the principle of least privilege.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Set up Shared VPC with a host project, attach the analytics project as a service project, and grant the analytics team Compute Network User on the analytics-euw1 subnet." } }
    - { id: b, text: { en: "Set up Shared VPC with a host project, attach the analytics project as a service project, and grant the analytics team Compute Network User on the host project." } }
    - { id: c, text: { en: "Create a VPC network in the analytics project, and connect it to the central network with VPC Network Peering." } }
    - { id: d, text: { en: "Set up Shared VPC with a host project, attach the analytics project as a service project, and grant the analytics team Compute Network Admin on the analytics-euw1 subnet." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Shared VPC lets a host project own the networks while service projects in the same organization create resources in its subnets. Granting Compute Network User (`roles/compute.networkUser`) on a single subnet limits the service project admins to that subnet, while a project-level grant would give access to every current and future subnet.
  options:
    b: { en: "A grant on the host project gives access to all subnets of the host project, including future ones, which is more than least privilege allows." }
    c: { en: "The analytics team would own and manage its own network, firewall and routing, which defeats central network ownership." }
    d: { en: "Compute Network Admin lets the team manage network resources, which exceeds the need to create VMs in one subnet." }
references:
  - title: Shared VPC
    url: https://docs.cloud.google.com/vpc/docs/shared-vpc
