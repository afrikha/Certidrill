id: gcppca-2b-partner-model-access
objective: "2.5.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retail company wants its developers to send prompts to a partner model from Model Garden in a new project. A platform administrator will enable the model, and the developers will call it from their applications. The organization policy already allows the Cloud Commerce Consumer Procurement API, and the security team requires least privilege.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Grant the platform administrator the Consumer Procurement Entitlement Manager role, and have the administrator enable the model in Model Garden.
    - id: b
      text:
        en: |-
          Grant the developers the Admin basic role on the project so that they can enable the model and call it.
    - id: c
      text:
        en: |-
          Grant the developers the Agent Platform User role on the project so that they can send prompts to the model.
    - id: d
      text:
        en: |-
          Request a GPU quota increase in the region where the developers will send their requests.
    - id: e
      text:
        en: |-
          Deploy the partner model to a dedicated Agent Platform endpoint before the developers send prompts.
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      Google documents two roles for partner models: the Consumer Procurement Entitlement Manager role to enable a model in Model Garden, and the Agent Platform User role to send prompts to it. With the organization policy already allowing the Cloud Commerce Consumer Procurement API, these roles are all that is needed.
  options:
    b:
      en: |-
        Admin grants broad control of the project, far beyond enabling and calling one model, which violates least privilege.
    d:
      en: |-
        Partner models are serverless, so the project provisions no GPUs and needs no GPU quota.
    e:
      en: |-
        Partner models are called as managed APIs on Agent Platform endpoints; there is no model deployment step before sending prompts.
references:
  - title: Gemini Enterprise Agent Platform partner models for MaaS | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/use-partner-models
