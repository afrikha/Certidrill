id: gcppca-2a-public-access-prevention-org
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A health insurer wants to guarantee that no Cloud Storage bucket in any of its projects, including projects created in the future, can be made readable by allUsers or allAuthenticatedUsers. A partner portal hands out signed URLs for some objects, and those URLs must keep working.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Enforce the storage.uniformBucketLevelAccess organization policy constraint at the organization level." } }
    - { id: b, text: { en: "Run a scheduled Cloud Run job that removes allUsers and allAuthenticatedUsers bindings from every bucket." } }
    - { id: c, text: { en: "Enforce the storage.publicAccessPrevention organization policy constraint at the organization level." } }
    - { id: d, text: { en: "Enable public access prevention on each existing bucket in the Google Cloud console." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Enforcing the `storage.publicAccessPrevention` constraint on the organization makes every bucket that inherits the setting reject public grants, and existing public grants stop working. New projects inherit the constraint. Signed URLs are not affected by public access prevention.
  options:
    a: { en: "Uniform bucket-level access disables object ACLs, but IAM bindings for allUsers can still be added, so buckets can still be made public." }
    b: { en: "A cleanup job only reacts after a bucket has been public, and it is custom code to maintain." }
    d: { en: "A per-bucket setting does not cover buckets created later in new projects." }
references:
  - title: Public access prevention
    url: https://docs.cloud.google.com/storage/docs/public-access-prevention
