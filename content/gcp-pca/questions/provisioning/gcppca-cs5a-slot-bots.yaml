id: gcppca-cs5a-slot-bots
objective: "2.1.3"
type: multi
caseStudy: gcppca-cs5a-brambleway-grocers
difficulty: 3
status: draft
stem:
  en: |
    You need to stop the slot bots. The solution must meet the business requirement about delivery slots and the technical requirement for detecting automated clients, for both the website and the mobile apps.

    Which two actions should you take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Integrate reCAPTCHA in the clients, with session-tokens on the website and action-tokens in the iOS and Android apps." } }
    - { id: b, text: { en: "Add Cloud Armor rules that evaluate the reCAPTCHA token score of booking requests and deny the requests whose score shows an automated client." } }
    - { id: c, text: { en: "Add a Cloud Armor rule that redirects every booking request to the reCAPTCHA manual challenge page and lets clients that pass it continue with an exemption cookie." } }
    - { id: d, text: { en: "Replace the per-IP rate limiting rule with a rate-based ban rule that bans for one hour any IP address that sends more than 20 booking requests per minute." } }
    - { id: e, text: { en: "Have the booking service send each request's reCAPTCHA token to the reCAPTCHA API and reject the bookings whose assessment score is low." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Cloud Armor bot management decodes reCAPTCHA tokens at the edge, so the backends never handle them: the clients attach the tokens, and token-based security policy rules allow, deny or rate-limit requests according to the score. Frictionless assessment does not show a puzzle to real customers. Session-tokens are supported only on websites, while action-tokens work on websites, iOS and Android, so the apps use action-tokens.
  options:
    c:
      en: The manual challenge shows a puzzle to every customer, which the business requirements exclude, and it is not supported for mobile applications.
    d:
      en: The bots rotate through thousands of residential IP addresses, so each address stays under any per-IP threshold; banning addresses also risks blocking real customers who share them.
    e:
      en: Verifying the tokens in the booking service changes the backend and lets the bot traffic reach it, which the technical requirements exclude.
references:
  - title: Bot management overview
    url: https://docs.cloud.google.com/armor/docs/bot-management
