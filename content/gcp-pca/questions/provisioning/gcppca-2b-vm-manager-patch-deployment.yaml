id: gcppca-2b-vm-manager-patch-deployment
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company runs 600 Linux and Windows Compute Engine VMs, not in managed instance groups, across three zones of one project. Auditors require operating system patches to be applied every month during a Sunday maintenance window, with a compliance report of missing patches. Operations wants no more than 10% of the VMs in any zone to be rebooting at the same time, and wants to patch one zone at a time.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create an OS policy assignment in each zone with a script resource that runs the OS update tool, with a wave size of 10%.
    - id: b
      text:
        en: |-
          Add a startup script that installs updates to every VM, and restart 10% of the VMs every Sunday from a Cloud Scheduler job.
    - id: c
      text:
        en: |-
          Create a VM Manager patch deployment with a monthly schedule, a zone-by-zone rollout, and a disruption budget of 10%.
    - id: d
      text:
        en: |-
          Build a new patched image every month and roll it out to the VMs with an Infrastructure Manager deployment.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A patch deployment in VM Manager schedules recurring patch jobs across Linux and Windows VMs and reports patch compliance. Its rollout can run zone by zone, and the disruption budget limits the number or percentage of VMs per zone that are patched at the same time.
  options:
    a:
      en: |-
        OS policies keep software configuration in a desired state on a fixed check interval; they do not schedule monthly maintenance windows or report missing patches like Patch does.
    b:
      en: |-
        Startup scripts run only at boot and give no compliance reporting; restarting VMs on a schedule builds a custom patch system to maintain.
    d:
      en: |-
        Replacing standalone VMs from new images is a rebuild, not patching, and Infrastructure Manager provides neither patch compliance reports nor zone-by-zone disruption budgets.
references:
  - title: About Patch | VM Manager | Google Cloud Documentation
    url: https://docs.cloud.google.com/compute/docs/os-patch-management
  - title: Create patch jobs | VM Manager | Google Cloud Documentation
    url: https://docs.cloud.google.com/compute/docs/os-patch-management/create-patch-job
