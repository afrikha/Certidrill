id: gcppca-2b-cloud-run-gpu-inference
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A marketing company serves an open image-captioning model that fits on one NVIDIA L4 GPU. Requests arrive in bursts during campaigns, and there is often no traffic for many hours. The company wants GPU-accelerated inference, wants to pay nothing for GPUs while there is no traffic, and has no team to operate clusters or VMs.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          A GKE Standard cluster with an L4 GPU node pool and the cluster autoscaler enabled.
    - id: b
      text:
        en: |-
          A Compute Engine managed instance group of L4 GPU VMs behind an external Application Load Balancer.
    - id: c
      text:
        en: |-
          A Cloud Run service without GPUs and with a higher maximum number of instances.
    - id: d
      text:
        en: |-
          A Cloud Run service with one L4 GPU per instance and no minimum instances.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Cloud Run services can attach one NVIDIA L4 GPU per instance, with at least 4 CPUs and 16 GiB of memory, for serverless inference. GPU services require instance-based billing, but they scale to zero, so with no minimum instances nothing is billed when there is no traffic, and there are no clusters or VMs to operate.
  options:
    a:
      en: |-
        GKE can run the model on L4 nodes, but the company would operate the cluster and its GPU node pool, which it has no team for.
    b:
      en: |-
        A MIG of GPU VMs means managing images, scaling and load balancing, which is the VM operation the company wants to avoid.
    c:
      en: |-
        CPU-only instances do not give the GPU acceleration that the company requires, however many instances run.
references:
  - title: Configure GPU for Cloud Run services | Google Cloud Documentation
    url: https://docs.cloud.google.com/run/docs/configuring/services/gpu
