id: gcppca-cs3a-port-wan
objective: "2.1.1"
type: single
caseStudy: gcppca-cs3a-tidemark-logistics
difficulty: 3
status: draft
stem:
  en: |
    You need to replace the MPLS network of the port terminal offices. The design must meet the business requirement about the MPLS contract and the technical requirement for the port offices.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create HA VPN tunnels from each office firewall to HA VPN gateways in europe-west4 and asia-southeast1 in one VPC network, and enable global dynamic routing on that network." } }
    - { id: b, text: { en: "Create HA VPN tunnels from each office firewall to HA VPN gateways in europe-west4 and asia-southeast1 in one VPC network, and add the tunnels as spokes of a Network Connectivity Center hub with site-to-site data transfer enabled." } }
    - { id: c, text: { en: "Deploy SD-WAN router appliances on Compute Engine in europe-west4 and asia-southeast1, connect each office to them, and add them as router appliance spokes of a Network Connectivity Center hub." } }
    - { id: d, text: { en: "Create Classic VPN tunnels with static routes from each office firewall to a VPN gateway in each region, and add a static route for every other office's range on each firewall." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Network Connectivity Center site-to-site data transfer uses Google's network as part of the WAN between external sites: each office's HA VPN tunnels become a hybrid spoke, and the hub gives full-mesh connectivity among the spokes. HA VPN provides encrypted, highly available connections over the offices' two internet links, and no network virtual appliance has to be operated in Google Cloud.
  options:
    a:
      en: Global dynamic routing lets the offices reach every subnet of the VPC network, but without site-to-site data transfer the routes learned from one office are not re-advertised to the other offices, so the offices cannot reach each other through Google Cloud.
    c:
      en: Router appliance spokes would carry office-to-office traffic, but they require Tidemark to deploy and operate third-party virtual appliances in Google Cloud, which the technical requirements exclude.
    d:
      en: Classic VPN supports only static routing and has a 99.9 % SLA, lower than HA VPN, and static routes on the firewalls do not make Google Cloud carry traffic between offices; maintaining every route on every firewall also adds manual work.
references:
  - title: Site-to-site data transfer overview
    url: https://docs.cloud.google.com/network-connectivity/docs/network-connectivity-center/concepts/data-transfer
