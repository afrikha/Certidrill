id: gcppca-2b-gke-private-nodes-nat
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company runs a GKE cluster whose nodes have only internal IP addresses, as required by its security policy. Some workloads must pull container images from a public third-party registry on the internet. The security policy also forbids any inbound connection from the internet to the nodes.

    What should you configure?
body:
  options:
    - id: a
      text:
        en: |-
          Enable Private Google Access on the subnet that the cluster nodes use.
    - id: b
      text:
        en: |-
          Create a Cloud NAT gateway on a Cloud Router for the region and subnet of the nodes.
    - id: c
      text:
        en: |-
          Assign ephemeral external IP addresses to the nodes and restrict them with firewall rules.
    - id: d
      text:
        en: |-
          Create a Serverless VPC Access connector in the region of the cluster nodes.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Cloud NAT lets resources without external IP addresses, including GKE nodes, open outbound connections to the internet, such as image pulls from a public registry. It translates only replies to connections that the nodes initiate and does not allow unsolicited inbound connections, which meets the security policy.
  options:
    a:
      en: |-
        Private Google Access reaches only Google APIs and services, such as Artifact Registry, not a third-party registry on the internet.
    c:
      en: |-
        External IP addresses on the nodes violate the policy that the nodes have only internal IP addresses.
    d:
      en: |-
        Serverless VPC Access connectors connect serverless products to a VPC network; they do not give GKE nodes internet access.
references:
  - title: Cloud NAT overview | Google Cloud Documentation
    url: https://docs.cloud.google.com/nat/docs/overview
