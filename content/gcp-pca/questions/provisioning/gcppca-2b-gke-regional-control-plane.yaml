id: gcppca-2b-gke-regional-control-plane
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A SaaS company runs a deployment controller that calls the Kubernetes API of its GKE Standard cluster continuously. The current cluster is zonal with a node pool spread across three zones, and the controller fails during control plane upgrades and would fail during a zone outage. The company needs the Kubernetes API to stay reachable during control plane upgrades and during the loss of one zone, with no change to the controller.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Add node pools in two more zones of the region to the existing zonal cluster.
    - id: b
      text:
        en: |-
          Create a second zonal cluster in another zone and send the controller's calls to both clusters.
    - id: c
      text:
        en: |-
          Create a regional cluster with nodes in three zones, and migrate the workloads to it.
    - id: d
      text:
        en: |-
          Add a PodDisruptionBudget for the controller and a maintenance window outside business hours.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A regional cluster runs control plane replicas in several zones of the region, so the Kubernetes API stays available during control plane upgrades and when one zone fails. The controller keeps calling a single cluster endpoint, so it needs no change once the workloads run on the regional cluster.
  options:
    a:
      en: |-
        Nodes in several zones make the cluster multi-zonal, but its control plane still runs in one zone and is unavailable during its upgrades and outages.
    b:
      en: |-
        Two clusters mean two API endpoints, which requires changing the controller, and each zonal control plane still goes down during its upgrades.
    d:
      en: |-
        A PodDisruptionBudget protects Pods during voluntary disruptions, and a maintenance window only moves upgrades in time; neither keeps the control plane reachable.
references:
  - title: Regional clusters | Google Kubernetes Engine (GKE) | Google Cloud Documentation
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/regional-clusters
