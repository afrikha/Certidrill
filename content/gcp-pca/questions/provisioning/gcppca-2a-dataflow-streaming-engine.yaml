id: gcppca-2a-dataflow-streaming-engine
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs a Java Apache Beam streaming pipeline on Dataflow that reads from Pub/Sub, aggregates events in windows and writes to BigQuery. The workers use large machine types with large persistent disks, most of their resources go to holding streaming state, and autoscaling reacts slowly to traffic spikes.

    The company wants smaller workers and more responsive autoscaling without rewriting the pipeline. What should you do?
body:
  options:
    - { id: a, text: { en: "Switch the workers to a larger machine type and add persistent disk capacity for the streaming state." } }
    - { id: b, text: { en: "Enable Streaming Engine for the pipeline when you launch the job." } }
    - { id: c, text: { en: "Disable autoscaling and run a fixed number of workers sized for the peak traffic." } }
    - { id: d, text: { en: "Run the pipeline in batch mode every five minutes on the messages accumulated in Pub/Sub." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Streaming Engine moves streaming pipeline execution, including state storage, from the worker VMs to the Dataflow service backend. Workers then need less CPU, memory and persistent disk, so smaller machine types work, and horizontal autoscaling becomes more responsive. Java pipelines must enable it explicitly, whereas recent Python and Go SDKs enable it by default.
  options:
    a: { en: "Larger workers and disks increase cost and leave state on the workers, which is what slows autoscaling." }
    c: { en: "A fixed peak-sized pool removes autoscaling and pays for peak capacity all the time." }
    d: { en: "Changing to periodic batch runs alters the pipeline semantics and latency, which goes beyond tuning the existing streaming job." }
references:
  - title: Use Streaming Engine for streaming jobs
    url: https://docs.cloud.google.com/dataflow/docs/streaming-engine
