id: gcppca-2b-gemini-enterprise-workflow-builder
objective: "2.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A consulting firm has rolled out Gemini Enterprise to its employees. Business analysts want to create, launch, and manage their own multi-step agents, such as an agent that drafts a weekly client status report, directly in the Gemini Enterprise web app. The analysts do not write code, and the firm does not want developers involved in each agent.

    What should the Gemini Enterprise administrator do?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on the Enable Workflow Builder toggle on the End user features control page for the organization.
    - id: b
      text:
        en: |-
          Have developers build the agents with the Agent Development Kit, host them on Agent Runtime, and register them in Gemini Enterprise.
    - id: c
      text:
        en: |-
          Build Dialogflow agents for each report in the Dialogflow console, and register the agents in Gemini Enterprise.
    - id: d
      text:
        en: |-
          Tell the analysts to use the Deep Research agent and save their instructions as prompts in their conversations.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Workflow Builder is a no-code, low-code tool in the Gemini Enterprise web app that lets users in the organization create, launch and manage single-step and multi-step agents. An administrator must enable it with the Enable Workflow Builder toggle, and can also control how users share the agents they build.
  options:
    b:
      en: |-
        ADK agents are custom code that developers build and administrators register, which contradicts the no-code, no-developer requirement.
    c:
      en: |-
        Dialogflow agents are conversational agents that administrators register; building one for each report does not let analysts create agents themselves in the web app.
    d:
      en: |-
        Deep Research is a Google-made agent for exploring topics in depth; it does not let analysts build and manage their own agents.
references:
  - title: Agents overview | Gemini Enterprise | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini/enterprise/docs/agents-overview
