id: gcppca-cs3b-returns-retention
objective: "2.2.5"
type: multi
caseStudy: gcppca-cs3b-norvale-revenue
difficulty: 3
status: draft
stem:
  en: |
    You are configuring the Cloud Storage bucket that will hold the returns and their attachments. The configuration must meet the business requirement about returns and the technical requirement for the bucket.

    Which two actions should you take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable Object Retention Lock on the bucket." } }
    - { id: b, text: { en: "Set a 10-year retention policy on the bucket, and lock it with Bucket Lock." } }
    - { id: c, text: { en: "When each document is uploaded, set its retention configuration in Locked mode with a retain-until time of 10 years after the end of its tax year." } }
    - { id: d, text: { en: "When each document is uploaded, set its retention configuration in Unlocked mode with a retain-until time of 10 years after the end of its tax year." } }
    - { id: e, text: { en: "Place an event-based hold on each document when it is uploaded, and have a scheduled job release the holds of a tax year when its retention period ends." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Object Retention Lock lets each object in the bucket carry its own retain-until time, so documents uploaded years apart for the same tax year all become deletable at the same date, 10 years after the end of that tax year. In Locked mode, nobody can remove the retention configuration or reduce its date, which meets the requirement that even administrators cannot delete documents or shorten their retention.
  options:
    b:
      en: A bucket retention policy counts from the upload time of each object, so an amended return added four years after its tax year would be kept four years too long instead of being deleted with the other documents of its year.
    d:
      en: In Unlocked mode, authorized users can modify or remove the retention configuration, so an administrator could shorten the retention.
    e:
      en: Holds can be released by any user who has permission to update objects, so they do not stop administrators from shortening the retention, and the release job adds custom code to maintain.
references:
  - title: Object Retention Lock
    url: https://docs.cloud.google.com/storage/docs/object-lock
  - title: Bucket Lock
    url: https://docs.cloud.google.com/storage/docs/bucket-lock
