id: gcppca-2a-ha-vpn-two-peer-devices
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company connects its data center to a VPC network in us-east1 over the internet. The data center has two VPN devices, each with its own public IP address, and both devices support BGP.

    The network team must configure the Google Cloud side so that the connection qualifies for the 99.99% availability SLA of Cloud VPN.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a Classic VPN gateway with two tunnels, one to each on-premises device, and configure static routes for the on-premises ranges." } }
    - { id: b, text: { en: "Create an HA VPN gateway and an external VPN gateway with two interfaces, connect interface 0 and interface 1 to different devices, and use BGP sessions on a Cloud Router." } }
    - { id: c, text: { en: "Create an HA VPN gateway, connect two tunnels from interface 0 to the two on-premises devices, and use BGP sessions on a Cloud Router." } }
    - { id: d, text: { en: "Create an HA VPN gateway with two tunnels, one from each interface to a different device, and configure static routes for the on-premises ranges." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The 99.99% SLA requires an HA VPN gateway with at least one tunnel on each of its two interfaces. With two peer devices, the external VPN gateway resource uses the `TWO_IPS_REDUNDANCY` type and interface 0 and interface 1 each connect to a different peer address. HA VPN tunnels must use dynamic routing, so each tunnel gets a BGP session on a Cloud Router.
  options:
    a: { en: "Classic VPN supports only static routing and carries a 99.9% SLA, so it cannot meet the 99.99% requirement." }
    c: { en: "Interface 1 of the HA VPN gateway has no tunnel, so the topology does not have enough redundancy for the 99.99% SLA." }
    d: { en: "HA VPN supports only dynamic (BGP) routing; static routes cannot be used with HA VPN tunnels." }
references:
  - title: HA VPN topologies
    url: https://docs.cloud.google.com/network-connectivity/docs/vpn/concepts/topologies
  - title: Cloud VPN overview
    url: https://docs.cloud.google.com/network-connectivity/docs/vpn/concepts/overview
