id: gcppca-2a-armor-waf-throttle
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A ticketing company exposes a public web application through a global external Application Load Balancer with instance group backends. During sales, attackers send SQL injection attempts, and some clients send thousands of requests per minute.

    The company must block SQL injection attempts and limit each client IP address to 300 requests per minute. Requests above the limit must receive HTTP 429, while the same client's requests under the limit must still be served.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create VPC firewall rules on the backends that deny traffic matching SQL injection patterns." } }
    - { id: b, text: { en: "Add a Cloud Armor rule that denies requests matching evaluatePreconfiguredWaf('sqli-v422-stable')." } }
    - { id: c, text: { en: "Add a Cloud Armor rate_based_ban rule keyed on IP with a ban duration of 10 minutes." } }
    - { id: d, text: { en: "Add a Cloud Armor throttle rule keyed on IP with a threshold of 300 requests per 60 seconds and an exceed action of deny(429)." } }
    - { id: e, text: { en: "Enable Identity-Aware Proxy on the backend service and allow all authenticated users." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Cloud Armor preconfigured WAF rules, based on the OWASP ModSecurity Core Rule Set, detect SQL injection through the `evaluatePreconfiguredWaf()` expression. A throttle rule caps each client's rate: requests under the threshold are allowed and requests over it get the exceed action, here a 429 response. Both rules go in the security policy of the load balancer's backend service.
  options:
    a: { en: "VPC firewall rules match only layer 3 and layer 4 attributes, and behind a proxy load balancer the backends see the load balancer's connections, not the clients'." }
    c: { en: "A rate-based ban rejects all of the client's requests for the ban period, including those under the limit, which the requirement forbids." }
    e: { en: "IAP requires users to sign in, which does not suit a public ticketing site and neither blocks SQL injection nor limits request rates." }
references:
  - title: Preconfigured WAF rules overview
    url: https://docs.cloud.google.com/armor/docs/waf-rules
  - title: Rate limiting overview
    url: https://docs.cloud.google.com/armor/docs/rate-limiting-overview
