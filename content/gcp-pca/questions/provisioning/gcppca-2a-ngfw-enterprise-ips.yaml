id: gcppca-2a-ngfw-enterprise-ips
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payments company runs workloads on Compute Engine VMs in two zones of europe-west1. Auditors require that traffic between the VMs, and traffic from the internet to them, be inspected for exploits, malware and command-and-control activity, and that matching connections be blocked.

    The company wants a Google-managed capability and does not want to deploy or operate third-party firewall appliances.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create VPC firewall rules that deny traffic from known malicious IP ranges, and enable Firewall Rules Logging on every rule." } }
    - { id: b, text: { en: "Attach a Google Cloud Armor security policy with preconfigured WAF rules to each VM, and enable Adaptive Protection." } }
    - { id: c, text: { en: "Enable VPC Flow Logs on the subnets and review the findings that Security Command Center raises for the flows." } }
    - { id: d, text: { en: "Create a Cloud NGFW Enterprise firewall endpoint in each zone, associate it with the VPC network, and apply a threat prevention security profile group through firewall policy rules." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The intrusion prevention service is part of Cloud NGFW Enterprise. A zonal firewall endpoint, associated with the VPC network in the same zone, inspects the traffic that a firewall policy rule sends to it with the `apply_security_profile_group` action. The security profile group holds a threat prevention profile, powered by Palo Alto Networks signatures, that detects and blocks threats such as malware, spyware and command-and-control traffic.
  options:
    a: { en: "VPC firewall rules match only on layer 3 and layer 4 attributes; they cannot detect exploits or malware inside allowed connections." }
    b: { en: "Cloud Armor security policies attach to load balancer backend services, not to VMs, and they do not inspect traffic between VMs." }
    c: { en: "Flow logs record connection metadata after the fact; they neither inspect payloads nor block connections." }
references:
  - title: Intrusion detection and prevention service overview
    url: https://docs.cloud.google.com/firewall/docs/about-intrusion-prevention
  - title: Firewall endpoint overview
    url: https://docs.cloud.google.com/firewall/docs/about-firewall-endpoints
