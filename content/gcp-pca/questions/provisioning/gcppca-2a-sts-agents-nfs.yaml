id: gcppca-2a-sts-agents-nfs
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A research institute has 60 TB on an on-premises NFS server and a 10-Gbps Dedicated Interconnect connection to Google Cloud with spare capacity. It wants a managed, scheduled, resumable transfer into Cloud Storage that it can monitor from the Google Cloud console, and it wants the copy finished within a week.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install Storage Transfer Service agents in an agent pool on several on-premises machines that mount the NFS export." } }
    - { id: b, text: { en: "Mount the bucket on the NFS server with Cloud Storage FUSE and copy the files with a scheduled rsync script." } }
    - { id: c, text: { en: "Order a Transfer Appliance and copy the NFS data to it." } }
    - { id: d, text: { en: "Create a Storage Transfer Service job with a POSIX file system source that uses the agent pool." } }
    - { id: e, text: { en: "Create an agentless Storage Transfer Service job that reads the NFS export over the Interconnect." } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      Transfers from a file system need Storage Transfer Service agents, which run as containers on machines that can read the source; Google recommends at least three agents per pool, ideally on separate machines. The transfer job then names the file system source and the agent pool. At 10 Gbps, 60 TB takes well under a day of transfer time, so an online transfer meets the one-week target.
  options:
    b: { en: "A custom rsync script over Cloud Storage FUSE is not a managed transfer: it offers no transfer job to schedule, resume or monitor in the console." }
    c: { en: "Transfer Appliance is recommended when an online upload would take more than a week; here the network can move the data much faster." }
    e: { en: "Agentless transfers are not available for file system sources; agents are required." }
references:
  - title: Manage transfer agents
    url: https://docs.cloud.google.com/storage-transfer/docs/managing-on-prem-agents
