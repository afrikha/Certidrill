id: gcppca-2b-cloud-run-worker-pool-kafka
objective: "2.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A telematics company has a containerized consumer that continuously pulls messages from a third-party Kafka cluster with a pull-based client library and writes them to BigQuery. The container never receives HTTP requests and does not listen on any port. The company wants to run it on Cloud Run with a fixed number of always-running instances and no public endpoint.

    Which Cloud Run resource should you use?
body:
  options:
    - id: a
      text:
        en: |-
          A Cloud Run service with ingress set to internal and a minimum number of instances.
    - id: b
      text:
        en: |-
          A Cloud Run worker pool with the required number of instances.
    - id: c
      text:
        en: |-
          A Cloud Run job scheduled to run a new execution every few minutes.
    - id: d
      text:
        en: |-
          A Cloud Run function with an Eventarc trigger for the Kafka topic.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Worker pools are the Cloud Run resource for continuous, non-request work such as pull-based queue consumers. They have no load-balanced endpoint or URL, and the container does not need to listen on a port. You set the number of instances when you deploy the worker pool.
  options:
    a:
      en: |-
        A service is request-driven: its container must listen for requests, and it always has an endpoint, even with internal ingress.
    c:
      en: |-
        Jobs run tasks to completion; repeated executions do not give a continuously running consumer and add start-up gaps between runs.
    d:
      en: |-
        A function is deployed as a request-driven service that reacts to delivered events; it does not run the existing pull-based consumer continuously.
references:
  - title: Deployment options and resource model | Cloud Run | Google Cloud Documentation
    url: https://docs.cloud.google.com/run/docs/resource-model
  - title: Deploy worker pools to Cloud Run | Google Cloud Documentation
    url: https://docs.cloud.google.com/run/docs/deploy-worker-pools
