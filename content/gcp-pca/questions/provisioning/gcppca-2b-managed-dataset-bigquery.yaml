id: gcppca-2b-managed-dataset-bigquery
objective: "2.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A credit union stores tabular training data in a BigQuery table. Its data scientists will train a custom model with a serverless training pipeline in us-central1. They want a managed dataset so that the data splits and the lineage from dataset to model are tracked, and they want the training code to find each data split without hard-coded table names.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create the managed dataset in us-central1, the same region as the training pipeline.
    - id: b
      text:
        en: |-
          Export the BigQuery table to CSV files in a dual-region bucket, and create the dataset from those files.
    - id: c
      text:
        en: |-
          Hard-code the table name in the training code and compute the split percentages in the code.
    - id: d
      text:
        en: |-
          Mount the BigQuery table under the /gcs/ path with Cloud Storage FUSE in the training container.
    - id: e
      text:
        en: |-
          Read the AIP_TRAINING_DATA_URI, AIP_VALIDATION_DATA_URI, and AIP_TEST_DATA_URI variables in the code.
answer: { optionIds: [a, e] }
explanation:
  correct:
    en: |-
      A managed dataset and the training pipeline that uses it must be in the same region. At run time, Agent Platform passes the location of each split to the training container in environment variables; for BigQuery data they use the bq://project.dataset.table form, so the code needs no hard-coded table names.
  options:
    b:
      en: |-
        Tabular managed datasets can use a BigQuery table directly, so the export is unnecessary, and it duplicates the data.
    c:
      en: |-
        Hard-coding the table and splits loses the managed splits and lineage that the team wants, and it violates the stated requirement.
    d:
      en: |-
        Cloud Storage FUSE mounts Cloud Storage buckets, not BigQuery tables.
references:
  - title: Use managed datasets | Gemini Enterprise Agent Platform | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/using-managed-datasets
