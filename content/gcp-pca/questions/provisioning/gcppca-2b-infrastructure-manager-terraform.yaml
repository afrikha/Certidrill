id: gcppca-2b-infrastructure-manager-terraform
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A software company's platform team defines its Google Cloud resources in Terraform. Today, engineers run terraform apply from their laptops against a state bucket that the team maintains, and nobody can tell which configuration produced the current resources. The team wants a Google-managed service that runs Terraform from their Git repository, stores the state and a revision history for each deployment, and shows a preview before changes are applied. The team wants the least operational overhead.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Cloud Build trigger on the repository that runs terraform plan and terraform apply with a Cloud Storage backend for the state.
    - id: b
      text:
        en: |-
          Install Config Connector on a GKE cluster and convert the Terraform configurations into Kubernetes resource manifests.
    - id: c
      text:
        en: |-
          Convert the configurations into Cloud Deployment Manager templates and deploy them from the repository with the gcloud CLI.
    - id: d
      text:
        en: |-
          Create Infrastructure Manager deployments that use the Terraform configurations in the Git repository as their source.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Infrastructure Manager is a managed service that deploys Terraform configurations from Git, Cloud Storage or local files by running Terraform in Cloud Build. It stores a state file, logs and the configuration of each deployment and revision, and it supports preview deployments that show the effect of a change before it is applied.
  options:
    a:
      en: |-
        This runs Terraform, but the team still writes and maintains the pipeline and the state bucket, and gets no built-in revision history per deployment.
    b:
      en: |-
        Config Connector manages resources as Kubernetes objects; it requires a cluster and a rewrite of every configuration, the opposite of least overhead.
    c:
      en: |-
        Cloud Deployment Manager reached end of support on March 31, 2026, and Google points users to Infrastructure Manager instead.
references:
  - title: Infrastructure Manager overview | Google Cloud Documentation
    url: https://docs.cloud.google.com/infrastructure-manager/docs/overview
