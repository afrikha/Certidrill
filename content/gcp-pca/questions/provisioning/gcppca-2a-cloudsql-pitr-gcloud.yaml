id: gcppca-2a-cloudsql-pitr-gcloud
objective: "2.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A team created a Cloud SQL for MySQL Enterprise edition instance with the gcloud CLI, using default flags. After an accidental UPDATE statement, it learned that it could not restore the database to the moment before the statement.

    The team must be able to recover to any point in time within the last 7 days. Which two settings should you enable? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "High availability, so that a standby instance in another zone holds a synchronous copy of the data" } }
    - { id: b, text: { en: "Automated backups" } }
    - { id: c, text: { en: "A cross-region read replica of the instance" } }
    - { id: d, text: { en: "Point-in-time recovery with binary logging, retaining transaction logs for 7 days" } }
    - { id: e, text: { en: "Deletion protection on the instance" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Point-in-time recovery requires automated backups, and for MySQL it relies on binary logging (`--enable-bin-log`), with `--retained-transaction-log-days` setting the window (1 to 7 days in the Enterprise edition). Instances created with the gcloud CLI do not get PITR, or automated backups, by default in the Enterprise edition. A recovery creates a new instance at the chosen time.
  options:
    a: { en: "The HA standby replicates every change, including the accidental UPDATE, so it cannot return to an earlier point." }
    c: { en: "A read replica also applies the accidental UPDATE, and promoting it does not go back in time." }
    e: { en: "Deletion protection prevents deleting the instance; it does not protect against bad changes to data." }
references:
  - title: Configure point-in-time recovery (PITR)
    url: https://docs.cloud.google.com/sql/docs/mysql/backup-recovery/configure-pitr
