id: gcppca-2a-peering-hybrid-transit
objective: "2.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company has a VPC network named net-hub that connects to its data center through Dedicated Interconnect. The Cloud Router in net-hub uses the default advertisement mode. A second VPC network, net-app, in another project of the same organization, is connected to net-hub with VPC Network Peering. Both networks use global dynamic routing.

    VMs in net-app must reach on-premises servers, and on-premises servers must reach VMs in net-app. You must not add new hybrid connections.

    Which three actions should you take? Choose three.
body:
  choose: 3
  options:
    - { id: a, text: { en: "On the peering configuration of net-hub, enable export of custom routes." } }
    - { id: b, text: { en: "On the peering configuration of net-app, enable export of custom routes." } }
    - { id: c, text: { en: "On the peering configuration of net-app, enable import of custom routes." } }
    - { id: d, text: { en: "Create a Public NAT gateway in net-app for the subnets that host the VMs." } }
    - { id: e, text: { en: "Set the Cloud Router to custom advertisement and advertise the net-app subnet ranges in addition to the net-hub subnets." } }
    - { id: f, text: { en: "Enable Private Google Access on the subnets of net-app." } }
answer: { optionIds: [a, c, e] }
explanation:
  correct:
    en: |
      The on-premises prefixes are dynamic custom routes in net-hub. Peering does not exchange custom routes by default: net-hub must export them and net-app must import them. In the other direction, the default advertisement mode advertises only the subnets of the Cloud Router's own VPC network, so the Cloud Router must use custom advertisement to also announce the net-app subnet ranges to the data center.
  options:
    b: { en: "net-app has no on-premises routes of its own to share; the routes come from net-hub, so the export setting is needed on net-hub, not on net-app." }
    d: { en: "Cloud NAT handles outbound translation, mainly to the internet; it does not create routes to on-premises networks through a peered network." }
    f: { en: "Private Google Access lets VMs without external IP addresses reach Google APIs; it has no effect on routing to on-premises networks." }
references:
  - title: VPC Network Peering
    url: https://docs.cloud.google.com/vpc/docs/vpc-peering
  - title: Advertised routes
    url: https://docs.cloud.google.com/network-connectivity/docs/router/concepts/advertised-routes
