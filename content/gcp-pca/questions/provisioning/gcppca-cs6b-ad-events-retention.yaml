id: gcppca-cs6b-ad-events-retention
objective: "2.2.5"
type: single
caseStudy: gcppca-cs6b-harbourline-news
difficulty: 1
status: draft
stem:
  en: |
    You are configuring the retention of ad events in BigQuery. The configuration must meet the business requirement for ad events and the technical requirements.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Set a table expiration of 395 days on the raw ad event tables, and write the aggregated campaign reports to separate tables that have no expiration." } }
    - { id: b, text: { en: "Schedule a daily query that deletes the rows older than 395 days from the raw ad event tables with a DML `DELETE` statement, and keep the reports in separate tables." } }
    - { id: c, text: { en: "Set a partition expiration of 395 days on the raw ad event tables, and write the aggregated campaign reports to separate tables that have no expiration." } }
    - { id: d, text: { en: "Export the raw ad events every day to a Cloud Storage bucket with a lifecycle rule that deletes objects after 395 days, and keep the reports in separate tables." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With a partition expiration, BigQuery deletes each daily partition automatically once it is 395 days old, about 13 months, with no job to run or pay for. Expired partitions are removed asynchronously within a few days, and the data then stays recoverable only for the time travel and fail-safe periods, which keeps the deletion within 14 months. The reports, which contain no personal data, are kept in tables without expiration.
  options:
    a:
      en: A table expiration deletes the whole table, with all its events, when the table expires, instead of deleting each day's events as they reach their age limit; it also takes precedence over any partition expiration.
    b:
      en: A scheduled DML delete works but adds a job to operate and the cost of scanning the tables every day, which partition expiration avoids.
    d:
      en: The lifecycle rule deletes only the exported copies; the raw events in BigQuery are never deleted.
references:
  - title: Manage partitioned tables
    url: https://docs.cloud.google.com/bigquery/docs/managing-partitioned-tables
