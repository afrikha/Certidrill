id: gcppca-cs1c-retraining-pipeline
objective: "2.4.1"
type: single
caseStudy: gcppca-cs1c-furrowline-agtech
difficulty: 2
status: draft
stem:
  en: |
    You need to automate the weekly retraining of the irrigation model. The solution must meet the business requirement about model versions and the technical requirement for retraining.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Convert the notebook cells into a Kubeflow Pipelines definition, deploy Kubeflow Pipelines on a GKE Standard cluster, and run the pipeline every week with a Kubernetes CronJob." } }
    - { id: b, text: { en: "Copy the notebook to a Compute Engine VM, run it every week with cron, and write the trained model and a log file to a Cloud Storage bucket." } }
    - { id: c, text: { en: "Convert the notebook cells into a Kubeflow Pipelines definition, run it on Agent Platform Pipelines with a weekly schedule, and use the lineage recorded in Agent Platform ML Metadata." } }
    - { id: d, text: { en: "Keep the notebook, and have a Managed Service for Apache Airflow (formerly Cloud Composer) environment execute it every week and send the agronomists an email with the training results." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Agent Platform Pipelines runs Kubeflow Pipelines or TFX pipelines serverlessly, and its scheduler API creates recurring runs from one pipeline definition, so the weekly retraining has no manual step and no infrastructure to operate. The parameters and artifacts of every run are recorded in Agent Platform ML Metadata, whose lineage shows which data and parameters produced each model version.
  options:
    a:
      en: A GKE Standard cluster that hosts Kubeflow Pipelines is infrastructure that the team must operate, which the retraining requirement rules out.
    b:
      en: A VM is infrastructure to operate, and a log file written by a script does not provide reliable lineage between the data, the parameters and each model version.
    d:
      en: Airflow can schedule the notebook, but an email with results does not record which data and parameters produced each model version, so the company still could not prove the lineage of the production model; it also adds a separate Airflow environment to the project.
references:
  - title: Introduction to Gemini Enterprise Agent Platform Pipelines
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/pipelines/introduction
