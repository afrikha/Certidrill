id: gcppca-2b-speech-batch-recognition
objective: "2.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance call center records customer calls of up to 2 hours each and stores the audio files in a Cloud Storage bucket. Every night, the quality team wants all of the previous day's calls transcribed so that they can analyze them the next morning. Real-time results are not needed.

    How should the transcription be requested from Speech-to-Text?
body:
  options:
    - id: a
      text:
        en: |-
          Send synchronous recognition requests that embed the audio content of each call.
    - id: b
      text:
        en: |-
          Send asynchronous recognition requests that reference each call by its Cloud Storage URI.
    - id: c
      text:
        en: |-
          Open a streaming recognition session over gRPC and stream each call into it.
    - id: d
      text:
        en: |-
          Send each call to the Video Intelligence API with the speech transcription feature.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Asynchronous recognition starts a long-running operation that you poll for results, and it supports audio of up to 480 minutes, so 2-hour calls fit. The audio is referenced by its Cloud Storage URI, which suits a nightly batch.
  options:
    a:
      en: |-
        Synchronous recognition is limited to audio of 1 minute or less.
    c:
      en: |-
        Streaming recognition is designed for real-time audio, such as live microphone input, which this batch workload does not need.
    d:
      en: |-
        The Video Intelligence API is deprecated and analyzes video files; Speech-to-Text is the product for audio transcription.
references:
  - title: Cloud Speech-to-Text overview | Google Cloud Documentation
    url: https://docs.cloud.google.com/speech-to-text/docs/speech-to-text-requests
