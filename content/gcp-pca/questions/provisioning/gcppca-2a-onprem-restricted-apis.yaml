id: gcppca-2a-onprem-restricted-apis
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A manufacturer connects its plant network to a VPC network through Dedicated Interconnect and a Cloud Router. Applications in the plant must upload data to Cloud Storage and BigQuery without using the internet.

    The security team requires that on-premises hosts can reach only the Google APIs and services that support VPC Service Controls. The VPC network still has its default route to the default internet gateway.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable Private Google Access on the subnets in the region of the VLAN attachments." } }
    - { id: b, text: { en: "Configure custom advertisement on the Cloud Router to advertise 199.36.153.4/30 in addition to the subnet ranges." } }
    - { id: c, text: { en: "Configure custom advertisement on the Cloud Router to advertise 199.36.153.8/30 in addition to the subnet ranges." } }
    - { id: d, text: { en: "Create a Public NAT gateway on the Cloud Router for the subnets in the region of the VLAN attachments." } }
    - { id: e, text: { en: "Configure on-premises DNS so that *.googleapis.com is a CNAME of restricted.googleapis.com, with A records for its addresses." } }
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |
      Private Google Access for on-premises hosts needs two things. The Cloud Router advertises the range of the chosen domain (199.36.153.4/30 for `restricted.googleapis.com`) so that on-premises routers send that traffic over the Interconnect, and on-premises DNS resolves `*.googleapis.com` to that domain. `restricted.googleapis.com` gives access only to services supported by VPC Service Controls; the VPC network's default route to the default internet gateway provides the return path inside Google's network.
  options:
    a: { en: "The subnet setting enables Private Google Access for VMs without external IP addresses in that subnet; it does nothing for hosts on premises." }
    c: { en: "199.36.153.8/30 is the range of private.googleapis.com, which also reaches APIs that do not support VPC Service Controls, so it does not meet the security requirement." }
    d: { en: "Cloud NAT translates outbound traffic of Google Cloud resources; it is not used by on-premises hosts to reach Google APIs." }
references:
  - title: Configure Private Google Access for on-premises hosts
    url: https://docs.cloud.google.com/vpc/docs/configure-private-google-access-hybrid
