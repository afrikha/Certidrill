id: gcppca-2b-video-analysis-gemini
objective: "2.5.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In November 2026, a broadcaster starts a project to describe its archive of news videos stored in Cloud Storage. For each video, it wants a written summary and chapters with timestamps, so that editors can search the archive. The solution will run for at least five years, and the broadcaster wants to avoid training or maintaining its own models.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Call the Video Intelligence API with label detection and shot change detection for each video.
    - id: b
      text:
        en: |-
          Extract frames from each video and call the Cloud Vision API label detection on every frame.
    - id: c
      text:
        en: |-
          Train a custom video classification model with serverless training on Agent Platform.
    - id: d
      text:
        en: |-
          Send each video's Cloud Storage URI to a Gemini model on Gemini Enterprise Agent Platform with a prompt.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Gemini models accept video input from Cloud Storage URIs and can return summaries and chapters with timestamps from a prompt, with no model to train. Google recommends migrating video analysis to the Gemini family of models, so this choice remains supported over the project's lifetime.
  options:
    a:
      en: |-
        The Video Intelligence API is deprecated since September 14, 2026 and shuts down on September 14, 2027, so it cannot support a five-year project.
    b:
      en: |-
        Frame labels describe single images; turning them into summaries and chapters means building and maintaining a custom pipeline.
    c:
      en: |-
        A custom model means labeling data and maintaining training, which the broadcaster wants to avoid, and classification does not produce summaries.
references:
  - title: Features | Video Intelligence API | Google Cloud Documentation
    url: https://docs.cloud.google.com/video-intelligence/docs/features
  - title: Video understanding | Gemini Enterprise Agent Platform | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/capabilities/video-understanding
