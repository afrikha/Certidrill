id: gcppca-cs2a-voice-relay-lb
objective: "2.1.4"
type: single
caseStudy: gcppca-cs2a-emberfall
difficulty: 2
status: draft
stem:
  en: |
    Emberfall will run the voice relays of Shardline 2 on a regional managed instance group of virtual machines in each of the three game regions. You need to expose the relays to players so that the voice traffic is spread across the virtual machines of the group and the technical requirements for the voice relays are met.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create a global external proxy Network Load Balancer with the three managed instance groups as backends, and give the matchmaker its single anycast IP address." }
    - id: b
      text: { en: "Create an external passthrough Network Load Balancer in each region with that region's managed instance group as its backend, and give the matchmaker the three regional IP addresses." }
    - id: c
      text: { en: "Create a global external Application Load Balancer with the three managed instance groups as backends, and give the matchmaker its single anycast IP address." }
    - id: d
      text: { en: "Create an internal passthrough Network Load Balancer in each region with that region's managed instance group as its backend, and give the matchmaker the three regional IP addresses." }
answer: { optionId: b }
explanation:
  correct:
    en: "Passthrough Network Load Balancers forward UDP traffic and preserve the client's source IP address, so the relays can keep rate-limiting abusive players by IP. A regional external passthrough load balancer in each region matches the design, because the matchmaker already assigns each player a regional relay address."
  options:
    a: { en: "Proxy Network Load Balancers handle TCP only, not the UDP voice traffic, and a proxy does not preserve the client source IP address by default." }
    c: { en: "Application Load Balancers proxy HTTP and HTTPS only, so they cannot carry UDP voice traffic, and the relays would see the proxy's addresses." }
    d: { en: "An internal load balancer is reachable only from inside the VPC network and connected networks, not from players on the internet." }
references:
  - title: Choose a load balancer
    url: https://docs.cloud.google.com/load-balancing/docs/choosing-load-balancer
