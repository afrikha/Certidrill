id: gcppca-2a-backup-vault-enforced-retention
objective: "2.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    After a ransomware incident at a competitor, a logistics company wants backups of its Compute Engine VMs and Cloud SQL instances that no one can delete for 30 days, including project owners of the workload projects and backup administrators. A central team must manage the backups of all workload projects.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Attach snapshot schedules with a 30-day retention to every VM disk, and enable automated backups with 30 retained backups on each Cloud SQL instance." } }
    - { id: b, text: { en: "Export VM images and Cloud SQL dumps every night to a Cloud Storage bucket that has an unlocked 30-day retention policy." } }
    - { id: c, text: { en: "Use Backup and DR backup plans that store backups in a backup vault with a 30-day enforced minimum retention, managed from a central project." } }
    - { id: d, text: { en: "Create a cross-region read replica of each Cloud SQL instance, and take machine images of the VMs every night." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Backup and DR backup vault stores immutable, indelible backups: with an enforced minimum retention, no one, including Google, can delete a backup before the period ends. Backup plans cover Compute Engine instances and disks and Cloud SQL instances, and a centralized model keeps vaults and plans in a backup administrator project that serves many workload projects.
  options:
    a: { en: "Snapshots and Cloud SQL backups can be deleted by principals with the right permissions in the workload projects, such as project owners." }
    b: { en: "An unlocked retention policy can be removed or shortened by anyone who can update the bucket, and custom exports add operational work." }
    d: { en: "A read replica copies changes, including destructive ones, almost immediately, and machine images can be deleted by project owners." }
references:
  - title: Overview of backup vaults
    url: https://docs.cloud.google.com/backup-disaster-recovery/docs/concepts/backup-vault
