id: gcppca-2b-gemini-enterprise-connectors
objective: "2.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An engineering firm stores its project documents in Microsoft SharePoint Online, its tickets in Jira Cloud, and its design notes in Confluence Cloud. Employees want one assistant that searches all three sources and answers questions from them, and each employee must see only the content that they are allowed to open in the source system. The firm wants a managed solution rather than a custom application.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Export the documents to Cloud Storage and build a custom retrieval-augmented generation app with RAG Engine.
    - id: b
      text:
        en: |-
          Create a Gemini Notebook for business notebook for each team and upload the relevant documents as sources.
    - id: c
      text:
        en: |-
          Set up Gemini Enterprise with its prebuilt connectors for SharePoint Online, Jira Cloud, and Confluence Cloud.
    - id: d
      text:
        en: |-
          Load the content into BigQuery with scheduled transfers and let employees query it with Gemini in BigQuery.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Gemini Enterprise is a managed intranet search, assistant and agent platform with prebuilt connectors for sources such as SharePoint, Jira and Confluence. It returns access-controlled search results and generated answers, so each employee sees only content that their permissions allow.
  options:
    a:
      en: |-
        A custom RAG app is the custom application the firm wants to avoid, and exporting files to a bucket drops the source systems' permissions.
    b:
      en: |-
        Notebooks answer from sources that users upload one by one; they do not search the three systems continuously or apply their permissions.
    d:
      en: |-
        BigQuery is an analytics warehouse; copying documents into it loses source permissions and does not provide an enterprise search assistant.
references:
  - title: What is Gemini Enterprise? | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini/enterprise/docs/overview
