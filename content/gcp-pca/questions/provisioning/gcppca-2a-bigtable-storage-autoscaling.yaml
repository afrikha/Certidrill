id: gcppca-2a-bigtable-storage-autoscaling
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An IoT company stores sensor data in a single-cluster Bigtable instance on SSD storage. Read and write traffic is stable and CPU utilization stays around 30%, but stored data grows by about 3 TB every month. The operations team currently adds nodes by hand when storage per node gets close to its limit.

    The company wants the cluster to keep enough nodes for its data, within a budget ceiling, with no manual work. What should you do?
body:
  options:
    - { id: a, text: { en: "Add a second cluster in another zone with replication so that the data is spread across two clusters." } }
    - { id: b, text: { en: "Schedule a Cloud Run job that adds one node to the cluster on the first day of every month." } }
    - { id: c, text: { en: "Create an app profile with single-cluster routing for the write-heavy ingestion application." } }
    - { id: d, text: { en: "Enable autoscaling on the cluster with minimum and maximum node counts and a storage utilization target." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Bigtable autoscaling computes one node count from the CPU utilization target and another from the storage utilization target, and uses the higher of the two. As data grows, the storage target drives the node count up, while the maximum node count caps cost.
  options:
    a: { en: "Each cluster of a replicated instance holds a full copy of the data, so a second cluster does not reduce storage per node and doubles the cost." }
    b: { en: "A fixed monthly increment does not follow actual growth and is custom tooling to maintain." }
    c: { en: "App profiles route requests to clusters; they do not change the node count or the storage per node." }
references:
  - title: Autoscaling
    url: https://docs.cloud.google.com/bigtable/docs/autoscaling
