id: gcppca-cs7b-consortium-sharing
objective: "2.2.3"
type: single
caseStudy: gcppca-cs7b-veldhaven-genomics
difficulty: 2
status: draft
stem:
  en: |
    You need to give the consortium partners access to the programme's variant data in BigQuery. The solution must meet the business requirement for consortium partners.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Grant the BigQuery Data Viewer role on the variant dataset to a group of each approved partner, and remove the group's binding when the partner's approval ends." } }
    - { id: b, text: { en: "Export the variant tables to Parquet files in Cloud Storage every month, and give each approved partner signed URLs that expire when the partner's approval ends." } }
    - { id: c, text: { en: "Create authorized views on the variant tables in a separate dataset, grant each approved partner's group the BigQuery Data Viewer role on that dataset, and remove the binding when the approval ends." } }
    - { id: d, text: { en: "Publish the variant dataset as a listing in a private BigQuery sharing exchange with data egress restricted, let approved partners subscribe, and revoke a partner's subscription when its approval ends." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      BigQuery sharing (formerly Analytics Hub) creates a linked dataset in the subscriber's own project: it is a read-only pointer to the shared data, so no data is copied, and the subscriber pays for the queries it runs. With data egress restricted on the listing, subscribers cannot copy, clone, export or snapshot the shared tables, or write query results to tables. Veldhaven controls who can subscribe, and revoking a subscription when an approval ends stops the partner's access to the data.
  options:
    a:
      en: A Data Viewer can copy the tables or save query results into its own datasets, so partners could keep copies, which the business requirement forbids.
    b:
      en: Exported files are copies that partners download and keep, and partners would not query the data in BigQuery at their own cost.
    c:
      en: Authorized views limit which rows and columns partners see, but a partner can still save query results from the views into its own tables, which creates copies.
references:
  - title: Introduction to BigQuery sharing
    url: https://docs.cloud.google.com/bigquery/docs/analytics-hub-introduction
  - title: Manage subscriptions
    url: https://docs.cloud.google.com/bigquery/docs/analytics-hub-manage-subscriptions
