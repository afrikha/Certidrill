id: gcppca-2a-signed-url-invoices
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A utility company stores customer invoices as PDF files in a private Cloud Storage bucket. Its web application must let a customer download their own invoice for 24 hours after a request. Customers do not have Google accounts, and the bucket must stay private.

    What should the application do?
body:
  options:
    - { id: a, text: { en: "Grant allUsers the Storage Object Viewer role on the bucket for 24 hours, then remove the binding." } }
    - { id: b, text: { en: "Create an HMAC key for each customer and send it with the object path." } }
    - { id: c, text: { en: "Grant each customer's email address the Storage Object Viewer role on the invoice object." } }
    - { id: d, text: { en: "Generate a V4 signed URL for the object with its service account, with a 24-hour expiration." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A signed URL gives anyone who holds it time-limited access to one specific object, whether or not they have a Google account. The application signs it with a service account that can read the object, and the expiration (up to seven days for V4) limits access to 24 hours.
  options:
    a: { en: "A public binding exposes every invoice in the bucket to everyone, which breaks the privacy requirement." }
    b: { en: "HMAC keys are long-lived credentials for an account, not per-object, time-limited access, and handing them out exposes the bucket." }
    c: { en: "IAM grants require a Google identity, which the customers do not have." }
references:
  - title: Signed URLs
    url: https://docs.cloud.google.com/storage/docs/access-control/signed-urls
