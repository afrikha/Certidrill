id: gcppca-2a-snapshot-schedule-multiregion
objective: "2.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company runs 60 Compute Engine VMs with zonal Persistent Disk volumes in europe-west1. It needs a daily backup of every disk, kept for 14 days, and the backups must stay usable if the whole europe-west1 region becomes unavailable. The solution must minimize operational effort.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a daily snapshot schedule with a 14-day maximum retention and a multi-regional storage location, and attach it to the disks." } }
    - { id: b, text: { en: "Create a daily snapshot schedule with a 14-day maximum retention and the europe-west1 storage location, and attach it to the disks." } }
    - { id: c, text: { en: "Write a Cloud Scheduler job that calls a script to create a machine image of each VM every day and delete images older than 14 days." } }
    - { id: d, text: { en: "Replace the zonal disks with regional Persistent Disk volumes replicated between two zones of europe-west1." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A snapshot schedule is a resource policy that you attach to many disks; it takes snapshots on a daily schedule and deletes them after `max-retention-days`. Storing the snapshots in a multi-regional location keeps them available beyond a single region, so disks can be restored in another region.
  options:
    b: { en: "Snapshots stored only in europe-west1 would be unavailable during an outage of that region." }
    c: { en: "A scheduled script reimplements what snapshot schedules provide and must be maintained." }
    d: { en: "Regional disks replicate inside one region, so they do not survive a regional outage, and replication is not a daily backup with 14 days of history." }
references:
  - title: Create schedules for disk snapshots
    url: https://docs.cloud.google.com/compute/docs/disks/scheduled-snapshots
