id: gcppca-2a-spark-serverless-batches
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A marketing analytics team runs PySpark batch jobs a few times a week at unpredictable times. The jobs use only Spark, read from Cloud Storage and write to BigQuery. The team does not want to size, start, scale or delete clusters, and it wants to pay only while a job runs.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Create a long-running Managed Service for Apache Spark cluster with autoscaling and submit the jobs to it." } }
    - { id: b, text: { en: "Rewrite the jobs as Apache Beam pipelines and run them on Dataflow." } }
    - { id: c, text: { en: "Submit the jobs as serverless batch workloads of Managed Service for Apache Spark." } }
    - { id: d, text: { en: "Deploy the Spark operator on a GKE Standard cluster and submit the jobs as Kubernetes resources." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Managed Service for Apache Spark (formerly Dataproc, whose serverless deployment was called Serverless for Apache Spark) runs PySpark batch workloads without any cluster to provision or manage. Resources scale during the workload, and billing covers only the workload's runtime, which suits intermittent, unpredictable jobs.
  options:
    a: { en: "A long-running cluster is billed while it runs, including idle time between jobs, and the team still manages it." }
    b: { en: "Rewriting working Spark code in Apache Beam is unnecessary effort when a serverless Spark option exists." }
    d: { en: "A GKE Standard cluster and the Spark operator are infrastructure the team would have to size, upgrade and pay for between jobs." }
references:
  - title: Managed Service for Apache Spark serverless overview
    url: https://docs.cloud.google.com/dataproc-serverless/docs/overview
  - title: Compare Managed Service for Apache Spark serverless and cluster deployments
    url: https://docs.cloud.google.com/dataproc-serverless/docs/concepts/dataproc-compare
