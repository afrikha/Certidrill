id: gcppca-2b-gemini-notebook-business
objective: "2.5.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A biotech company's research team wants to summarize and brainstorm from confidential study reports with Gemini Notebook for business. The notebook data must stay in the EU, the project is protected by VPC Service Controls, and researchers sign in through the company's third-party identity provider. The security team requires least privilege for the researchers.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Grant the researchers the Writer basic role on the project so that they can create notebooks and share them with colleagues.
    - id: b
      text:
        en: |-
          Set up Gemini Notebook for business in the project in the EU multi-region location.
    - id: c
      text:
        en: |-
          Have the researchers use the consumer Gemini Notebook with personal Google Accounts and upload the reports there.
    - id: d
      text:
        en: |-
          Share the finished notebooks with external auditors through public links so that they can review the work.
    - id: e
      text:
        en: |-
          Grant the researchers the Cloud NotebookLM User role so that they can sign in and create notebooks.
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      Gemini Notebook for business keeps notebook data in the Google Cloud project, in the US or EU multi-region, and supports VPC Service Controls, CMEK and sign-in through Cloud Identity or a third-party identity provider. Google recommends granting end users only the Cloud NotebookLM User role, which lets them sign in and create notebooks.
  options:
    a:
      en: |-
        Broad project-level roles can expose every notebook in the project, which breaks least privilege.
    c:
      en: |-
        The consumer product uses personal accounts and offers none of the project's data residency, VPC Service Controls or identity provider controls.
    d:
      en: |-
        Notebooks can be shared only within the same Google Cloud project and cannot be made public.
references:
  - title: What is Gemini Notebook for business? | Gemini Notebook Enterprise | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini/enterprise/notebooklm-enterprise/docs/overview
