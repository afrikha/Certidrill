id: gcppca-2b-cloud-run-instance-billing
objective: "2.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A news site runs an API on Cloud Run with 1 GiB of memory per instance and the default billing settings. Each request returns its response immediately and then starts a background thread that sends analytics events to a partner. The partner reports that many events arrive hours late or never arrive. Traffic is steady throughout the day, and the team wants the background work to complete reliably without changing the code.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Set the minimum number of instances to 5 so that idle instances stay warm between requests.
    - id: b
      text:
        en: |-
          Raise the request timeout of the service to 60 minutes so that the background thread has more time.
    - id: c
      text:
        en: |-
          Lower the maximum concurrency to 1 so that each instance processes only one request at a time.
    - id: d
      text:
        en: |-
          Switch the service to instance-based billing by deploying it with the --no-cpu-throttling flag.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With the default request-based billing, CPU is allocated only while an instance processes requests, so work that continues after the response is sent is starved of CPU. Instance-based billing allocates CPU for the whole instance lifecycle, which suits background and asynchronous work, and with steady traffic it can even cost less. It requires at least 512 MiB of memory, which the service has.
  options:
    a:
      en: |-
        Minimum instances keep instances available, but under request-based billing their CPU is still allocated only during request processing.
    b:
      en: |-
        The timeout limits how long a request can take; the response is already sent, and CPU is not allocated to the instance after the request ends.
    c:
      en: |-
        Concurrency changes how many requests share an instance; it does not allocate CPU outside request processing.
references:
  - title: Billing settings for services | Cloud Run | Google Cloud Documentation
    url: https://docs.cloud.google.com/run/docs/configuring/billing-settings
