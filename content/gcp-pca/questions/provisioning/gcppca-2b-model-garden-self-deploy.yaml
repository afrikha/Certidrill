id: gcppca-2b-model-garden-self-deploy
objective: "2.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank has fine-tuned a Gemma open model on its own data. The model must be served on dedicated GPU machines in europe-west4 that are not shared with other customers' requests, and the bank wants to choose the machine type and the number of replicas. The ML team does not want to operate Kubernetes clusters.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy the model from Model Garden to an Agent Platform endpoint in europe-west4 with a vLLM serving container on GPUs.
    - id: b
      text:
        en: |-
          Call a managed open model through Model as a Service on the regional endpoint in europe-west4 instead.
    - id: c
      text:
        en: |-
          Deploy the model on a GKE Standard cluster in europe-west4 with a GPU node pool and a vLLM Deployment.
    - id: d
      text:
        en: |-
          Subscribe to provisioned throughput for Gemma so that the bank's requests are served on reserved capacity.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Model Garden can deploy open models to an Agent Platform endpoint with serving containers such as vLLM on GPUs or TPUs, on machine types and replica counts that you choose. The endpoint's compute is dedicated to the bank and billed for the resources it uses, and there is no Kubernetes cluster to operate.
  options:
    b:
      en: |-
        Managed open models are serverless APIs with no machines to choose, so the bank cannot pick dedicated machine types or the number of replicas.
    c:
      en: |-
        GKE gives the same control over hardware, but the team would operate the cluster, which it wants to avoid.
    d:
      en: |-
        Provisioned throughput reserves priority capacity for managed model APIs; it does not let the bank choose dedicated machine types or replicas.
references:
  - title: Overview of Model Garden | Gemini Enterprise Agent Platform | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-garden/explore-models
