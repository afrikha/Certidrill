id: gcppca-2b-gke-holiday-exclusion
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retailer runs its storefront on a GKE Standard cluster enrolled in the Regular release channel. During the eight-week holiday season, the cluster's control plane and nodes must not move to a new Kubernetes minor version, because the team cannot retest the application in that period. The security team requires the control plane and the nodes to keep receiving patch versions during the same period.

    What should you configure?
body:
  options:
    - id: a
      text:
        en: |-
          A maintenance exclusion with the No upgrades scope that covers the eight-week holiday season.
    - id: b
      text:
        en: |-
          A maintenance exclusion with the No minor or node upgrades scope that covers the holiday season.
    - id: c
      text:
        en: |-
          A maintenance exclusion with the No minor upgrades scope that covers the eight-week holiday season.
    - id: d
      text:
        en: |-
          Remove the cluster from its release channel and disable node auto-upgrade until the season ends.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The No minor upgrades scope blocks minor version upgrades of the control plane and nodes but still allows patch upgrades, which matches both requirements. Restricting the scope of an exclusion requires the cluster to be enrolled in a release channel, which is the case here.
  options:
    a:
      en: |-
        The No upgrades scope blocks all upgrades, including the patch versions that the security team requires.
    b:
      en: |-
        This scope allows control plane patch upgrades but blocks node upgrades, so the nodes would not receive patch versions.
    d:
      en: |-
        Without a release channel, only the No upgrades exclusion scope is available, and the control plane is still upgraded automatically; this also removes the patch control the team needs.
references:
  - title: Maintenance windows and exclusions | Google Kubernetes Engine (GKE) | Google Cloud Documentation
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/maintenance-windows-and-exclusions
