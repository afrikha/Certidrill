id: gcppca-2b-model-garden-partner-maas
objective: "2.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup wants to add a Mistral AI model from Model Garden to its customer support application during a three-month pilot. Request volume is low and unpredictable. The startup does not want to provision or manage any serving infrastructure and wants to pay only for what it uses.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Subscribe to provisioned throughput for the model so that its requests get priority over pay-as-you-go traffic.
    - id: b
      text:
        en: |-
          Create a GKE cluster with a GPU node pool and serve the model with a vLLM container.
    - id: c
      text:
        en: |-
          Create an Agent Platform endpoint on dedicated GPU machines and keep one replica always running.
    - id: d
      text:
        en: |-
          Enable the partner model in Model Garden and call it as a managed API with pay-as-you-go pricing.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Partner models in Model Garden are offered as managed APIs (Model as a Service): you send requests to Agent Platform endpoints, and there is no infrastructure to provision or manage. Standard pay-as-you-go pricing charges only for the requests sent, which fits a low, unpredictable pilot volume.
  options:
    a:
      en: |-
        Provisioned throughput is a fixed fee for reserved capacity that you subscribe to through sales, which does not fit low and unpredictable usage.
    b:
      en: |-
        A GKE cluster with GPUs is serving infrastructure that the startup would manage and pay for even when idle.
    c:
      en: |-
        A dedicated endpoint bills its machines while they run, so an always-on replica costs money with no traffic.
references:
  - title: Gemini Enterprise Agent Platform partner models for MaaS | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/use-partner-models
