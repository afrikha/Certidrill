id: gcppca-cs2c-simulation-spot
objective: "2.3.2"
type: single
caseStudy: gcppca-cs2c-quillon
difficulty: 2
status: draft
stem:
  en: |
    You are designing the Compute Engine resources for Quillon's simulation campaigns. The design must meet the business requirement about campaign cost and duration and the technical requirements for the simulation jobs and the campaign coordinator.

    Which design should you recommend?
body:
  options:
    - id: a
      text: { en: "Run the coordinator on a standard virtual machine, and run the simulation jobs on a managed instance group of Spot VMs that restart interrupted jobs from their last checkpoint." }
    - id: b
      text: { en: "Run the coordinator and the simulation jobs on a managed instance group of Spot VMs with a 120-second preemption notice so that each VM can save its state before it stops." }
    - id: c
      text: { en: "Run the coordinator and the simulation jobs on standard virtual machines covered by a one-year resource-based committed use discount for the vCPUs of a whole campaign." }
    - id: d
      text: { en: "Run the coordinator on a Spot VM with a 120-second preemption notice, and run the simulation jobs on a managed instance group of standard virtual machines." }
answer: { optionId: a }
explanation:
  correct:
    en: "Spot VMs use excess Compute Engine capacity at discounts of up to 91 % and suit fault-tolerant batch work: an interrupted job loses at most 15 minutes and restarts from its checkpoint in Cloud Storage. Spot VMs can be preempted at any time and have no SLA, so the coordinator, which must not be interrupted, runs on a standard virtual machine."
  options:
    b: { en: "A longer preemption notice does not prevent preemption, so the coordinator could still be stopped and halt the whole campaign." }
    c: { en: "A one-year commitment is billed for the whole term although the campaigns run only four times a year, so Quillon would pay for capacity that sits idle most of the year." }
    d: { en: "This puts the interruptible capacity on the one component that must not be interrupted and pays the full price for the 20,000 fault-tolerant jobs." }
references:
  - title: Spot VMs
    url: https://docs.cloud.google.com/compute/docs/instances/spot
