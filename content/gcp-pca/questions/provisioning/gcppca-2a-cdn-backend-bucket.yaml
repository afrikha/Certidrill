id: gcppca-2a-cdn-backend-bucket
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A furniture retailer serves product images from a regional Cloud Storage bucket in us-east1 through its public website. Customers in Europe and Asia report slow image loading, and egress from the bucket keeps growing. The images change rarely.

    The retailer wants lower latency for all regions with minimal changes to how images are stored. What should you do?
body:
  options:
    - { id: a, text: { en: "Move the images to a bucket in the ASIA multi-region and point the website to it." } }
    - { id: b, text: { en: "Copy the images to a new dual-region bucket in North America with turbo replication, and point the website to it." } }
    - { id: c, text: { en: "Enable Autoclass on the bucket so that frequently read images stay in Standard storage." } }
    - { id: d, text: { en: "Put the bucket behind a global external Application Load Balancer as a backend bucket, and enable Cloud CDN." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Cloud CDN, enabled on a global external Application Load Balancer, caches content at Google edge locations close to users. A backend bucket uses the existing Cloud Storage bucket as the origin, so cache hits are served from the edge in every region and fewer requests reach the bucket.
  options:
    a: { en: "An Asian multi-region helps only Asian users, makes European users' latency no better, and requires moving all data." }
    b: { en: "Turbo replication shortens replication between the two regions of a dual-region for recovery objectives; both regions are in North America, so users in Europe and Asia are no closer to the data." }
    c: { en: "Autoclass changes storage classes to reduce cost; it does not change where or how fast content is delivered." }
references:
  - title: Cloud CDN overview
    url: https://docs.cloud.google.com/cdn/docs/overview
