id: gcppca-2a-bigquery-autoscaling-reservation
objective: "2.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A retail group runs all BigQuery queries with on-demand pricing in about 40 projects under one folder, and its monthly bill varies widely. Daytime reporting needs about 400 slots continuously, month-end closing needs up to 1,200 slots for a few days, and finance wants a hard ceiling on compute capacity.

    You must provide a predictable baseline, burst capacity for month-end and the ceiling, and make sure that new projects created in the folder use the same capacity. Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Purchase a three-year slot commitment of 1,200 slots so that month-end peaks are always covered." } }
    - { id: b, text: { en: "Set custom quotas that limit the bytes each user can query per day in each project." } }
    - { id: c, text: { en: "Create an Enterprise edition reservation with 400 baseline slots and a maximum reservation size of 1,200 slots." } }
    - { id: d, text: { en: "Set ignore_idle_slots to true on the reservation so that it uses only its own slots." } }
    - { id: e, text: { en: "Assign the reservation to the folder that contains the projects." } }
answer: { optionIds: [c, e] }
explanation:
  correct:
    en: |
      An autoscaling reservation always allocates its baseline slots and adds autoscaled slots, in multiples of 50, only up to its maximum reservation size, which sets the ceiling. Projects that have no explicit or inherited reservation assignment fall back to on-demand pricing, so assigning the reservation to the folder covers current and future projects in it.
  options:
    a: { en: "A commitment sized for the peak pays for 1,200 slots every hour of the term although only 400 are needed most of the time." }
    b: { en: "Custom quotas cap bytes scanned under on-demand pricing; they provide neither a capacity baseline nor burst slots." }
    d: { en: "ignore_idle_slots only stops the reservation from borrowing idle slots; it neither adds burst capacity nor applies the reservation to projects." }
references:
  - title: Understand slots
    url: https://docs.cloud.google.com/bigquery/docs/slots-autoscaling-intro
