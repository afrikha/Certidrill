id: gcppca-2a-dedicated-interconnect-9999
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank runs production workloads in two Google Cloud regions, us-east4 and us-central1, in a single VPC network. It plans Dedicated Interconnect from its own routers in colocation facilities in two metropolitan areas.

    The risk committee requires the topology that Google documents for 99.99% availability across both regions, so that the failure of an entire metro does not isolate either region from the data centers.

    Which design should you recommend?
body:
  options:
    - { id: a, text: { en: "Two connections in one metro, one in each edge availability domain, with VLAN attachments in both regions and one Cloud Router per region, using regional dynamic routing." } }
    - { id: b, text: { en: "Four connections split across two metros, two per metro in the same edge availability domain, with VLAN attachments in both regions and one Cloud Router per region, using global dynamic routing." } }
    - { id: c, text: { en: "Four connections split across two metros, two per metro in different edge availability domains, with VLAN attachments in both regions and one Cloud Router per region, using global dynamic routing." } }
    - { id: d, text: { en: "Four connections split across two metros, two per metro in different edge availability domains, with VLAN attachments in both regions and one Cloud Router per region, using regional dynamic routing." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The multi-region 99.99% topology uses at least four Dedicated Interconnect connections: two metros, and in each metro one connection in each edge availability domain. At least four VLAN attachments are spread over two regions with a Cloud Router in each region. Global dynamic routing makes routes learned in one region usable in all regions, so a region keeps connectivity through the other metro if its own metro fails.
  options:
    a: { en: "Two connections in a single metro give the 99.9% topology; a metro outage would disconnect both regions." }
    b: { en: "Both connections of a metro sit in the same edge availability domain, so planned maintenance or a failure of that domain removes the whole metro; the topology requires both domains in each metro." }
    d: { en: "With regional dynamic routing, routes learned by a Cloud Router apply only in its region, so a region whose metro fails cannot use the attachments of the other region." }
references:
  - title: Establish 99.99% availability for Dedicated Interconnect
    url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/tutorials/dedicated-creating-9999-availability
