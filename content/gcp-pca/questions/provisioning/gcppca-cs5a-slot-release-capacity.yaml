id: gcppca-cs5a-slot-release-capacity
objective: "2.3.5"
type: single
caseStudy: gcppca-cs5a-brambleway-grocers
difficulty: 3
status: draft
stem:
  en: |
    You need to stop the timeouts of the slot booking service during traffic peaks. The solution must meet the business requirement about errors and timeouts and the technical requirement for booking Pods.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a PriorityClass with value -10 and preemptionPolicy Never, and run a Deployment of placeholder Pods with that class whose requests match the capacity that the extra booking Pods need." } }
    - { id: b, text: { en: "Set the cluster autoscaler profile to optimize-utilization so that the cluster adds and removes nodes faster when the booking service scales out." } }
    - { id: c, text: { en: "Raise the maximum node count of the node pools and the resource limits of node auto-provisioning so that the cluster can create enough nodes for 400 booking Pods." } }
    - { id: d, text: { en: "Scale the booking service on a custom metric of requests per second instead of CPU utilization so that the HPA adds booking Pods earlier in a peak." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Low-priority placeholder Pods keep spare nodes running in the cluster. When the HPA adds booking Pods, the scheduler evicts the placeholder Pods and starts the booking Pods on their nodes at once, without waiting the 2 minutes a new node needs. A Deployment keeps the reserve in place permanently, so it also covers unannounced peaks after push notifications, and the cluster autoscaler creates nodes again for the evicted placeholders afterwards. The HPA still sets the number of booking replicas.
  options:
    b:
      en: The optimize-utilization profile removes underused nodes more aggressively to save cost; it does not make node creation faster, so booking Pods still wait about 2 minutes for new nodes.
    c:
      en: Higher limits let the cluster grow to the needed size, but every new node still takes about 2 minutes to become ready; the problem is the delay, not the maximum size.
    d:
      en: A better scaling signal makes the HPA react sooner, but the new Pods still stay Pending until new nodes are ready, and an unannounced peak arrives faster than the metric can anticipate.
references:
  - title: Provision extra compute capacity for rapid Pod scaling
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/capacity-provisioning
