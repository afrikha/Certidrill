id: gcppca-cs1a-masters-storage
objective: "2.2.5"
type: single
caseStudy: gcppca-cs1a-lumora-streaming
difficulty: 3
status: draft
stem:
  en: |
    Lumora will copy the mezzanine masters to a Cloud Storage bucket. You need to configure the storage of the masters. The configuration must meet the business requirements.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Store the masters in the Standard class and add lifecycle rules that move objects to Coldline after 30 days and to Archive after 365 days." } }
    - { id: b, text: { en: "Enable Autoclass on the bucket with the default terminal storage class, and store the masters without a storage class." } }
    - { id: c, text: { en: "Enable Autoclass on the bucket and set Archive as the terminal storage class, and store the masters without a storage class." } }
    - { id: d, text: { en: "Store every master in the Archive class from its upload, and copy a master to a Standard bucket before it is re-encoded." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Autoclass moves each object to a colder class when it is not read and back to Standard as soon as it is read, without retrieval or early deletion fees, which suits masters whose reads cannot be predicted. With Archive as the terminal class, masters that are not read for a year end in the cheapest class, and the operations team maintains no rule per title.
  options:
    a:
      en: Lifecycle rules only move objects to colder classes. A re-released master stays in Archive and every one of its hundreds of reads incurs retrieval fees, which does not give the lowest cost.
    b:
      en: The default terminal class of Autoclass is Nearline, so masters that are not read for years never reach Coldline or Archive and cost more than necessary.
    d:
      en: Archive charges retrieval fees on every read and has a 365-day minimum storage duration, and copying masters before each re-encode is manual work tied to individual titles.
references:
  - title: Autoclass
    url: https://docs.cloud.google.com/storage/docs/autoclass
  - title: Storage classes
    url: https://docs.cloud.google.com/storage/docs/storage-classes
