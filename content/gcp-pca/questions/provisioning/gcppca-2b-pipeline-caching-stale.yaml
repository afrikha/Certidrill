id: gcppca-2b-pipeline-caching-stale
objective: "2.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's fraud team runs an Agent Platform Pipelines pipeline daily. Its first step queries a BigQuery table that is refreshed every night, using the same query parameters each day. The later feature engineering and hyperparameter tuning steps are expensive, and the team wants them to keep reusing earlier results when their inputs are unchanged. The team discovered that recent runs reused an old extract instead of querying the refreshed table.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Call set_caching_options(False) on the extraction task in the pipeline definition, and leave caching on for the other tasks.
    - id: b
      text:
        en: |-
          Pass enable_caching=False when you create the PipelineJob for each daily run of the pipeline.
    - id: c
      text:
        en: |-
          Give the pipeline a new name for each daily run so that it does not share a cache with earlier runs.
    - id: d
      text:
        en: |-
          Set a time to live of 24 hours on the cache entries that the extraction task writes to ML Metadata.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Execution caching skips a step when an earlier execution has the same cache key, which covers the step's inputs, output definitions and component specification, not the data in the table. The extraction step is not deterministic, so its caching must be disabled with set_caching_options(False), while the deterministic downstream steps keep reusing results when their inputs do not change.
  options:
    b:
      en: |-
        enable_caching=False disables caching for the whole run, so the expensive steps would always rerun.
    c:
      en: |-
        Only pipelines with the same name share a cache, so a new name disables caching for every step, including the expensive ones.
    d:
      en: |-
        Cached results have no time to live; they are reused until the entry is deleted from ML Metadata.
references:
  - title: Configure execution caching | Gemini Enterprise Agent Platform | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/pipelines/configure-caching
