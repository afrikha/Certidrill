id: gcppca-cs7a-merchant-mtls
objective: "2.1.3"
type: single
caseStudy: gcppca-cs7a-sablepoint-payments
difficulty: 3
status: draft
stem:
  en: |
    You need to replace the API keys of the server-to-server merchants. The solution must meet the technical requirement for merchant authentication and keep the current entry point of the payment API.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a CA pool in Certificate Authority Service to issue the merchant certificates, and configure the load balancer's Client Authentication policy in ALLOW_INVALID_OR_MISSING_CLIENT_CERT mode with a trust config that contains the CA's root certificate." } }
    - { id: b, text: { en: "Issue the merchant certificates from a certificate authority that runs on a Compute Engine VM, and replace the load balancer with an external passthrough Network Load Balancer so that the payment API pods validate the certificates." } }
    - { id: c, text: { en: "Create a CA pool in Certificate Authority Service to issue the merchant certificates, and configure the load balancer's Client Authentication policy in REJECT_INVALID mode with a trust config that contains the CA's root certificate." } }
    - { id: d, text: { en: "Create a CA pool in Certificate Authority Service to issue the merchant certificates, and add a Cloud Armor rule that allows only the source IP addresses registered by each merchant." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Certificate Authority Service runs Sablepoint's private CA as a managed service, so no CA software has to be installed or operated. The global external Application Load Balancer supports frontend mutual TLS: a Client Authentication (ServerTLSPolicy) resource on the target HTTPS proxy references a Certificate Manager trust config that holds the CA's root certificate. In REJECT_INVALID mode, the load balancer terminates the connection when a client certificate is missing or fails validation, so such requests never reach the payment API.
  options:
    a:
      en: In ALLOW_INVALID_OR_MISSING_CLIENT_CERT mode, the load balancer forwards requests with failed or missing certificates to the backend with headers that describe the validation result, so invalid requests still reach the payment API.
    b:
      en: Sablepoint would have to operate certificate authority software on the VM, and moving validation into the pods means invalid requests reach the payment API; it also replaces the current entry point.
    d:
      en: A Cloud Armor IP allowlist does not authenticate merchants with their client certificates; the certificates issued by the CA would never be checked.
references:
  - title: Mutual TLS overview
    url: https://docs.cloud.google.com/load-balancing/docs/mtls
  - title: Certificate Authority Service overview
    url: https://docs.cloud.google.com/certificate-authority-service/docs/ca-service-overview
