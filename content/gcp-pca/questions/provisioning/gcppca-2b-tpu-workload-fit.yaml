id: gcppca-2b-tpu-workload-fit
objective: "2.4.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A technology company is choosing hardware for several ML projects on Google Cloud. It wants to use Cloud TPU only where Google recommends TPUs over GPUs and CPUs.

    Which two workloads are good candidates for Cloud TPU? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Training a large model dominated by matrix computations that runs for several weeks.
    - id: b
      text:
        en: |-
          A scientific simulation that requires high-precision arithmetic in every step.
    - id: c
      text:
        en: |-
          A model whose main training loop calls many custom operations that must partly run on CPUs.
    - id: d
      text:
        en: |-
          Training a large recommendation model with very large embeddings and large batch sizes.
    - id: e
      text:
        en: |-
          Quick prototyping of a small model that changes several times a day.
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      Google recommends TPUs for models dominated by matrix computations, models that train for weeks or months, large models with large effective batch sizes, and models with ultra-large embeddings such as advanced ranking and recommendation workloads.
  options:
    b:
      en: |-
        Workloads that require high-precision arithmetic are listed as not suited to TPUs.
    c:
      en: |-
        Custom operations that must run at least partly on CPUs point to GPUs, and custom operations in the main training loop are not suited to TPUs.
    e:
      en: |-
        Quick prototyping of small, simple models is where Google recommends CPUs for maximum flexibility.
references:
  - title: Introduction to Cloud TPU | Google Cloud Documentation
    url: https://docs.cloud.google.com/tpu/docs/intro-to-tpu
