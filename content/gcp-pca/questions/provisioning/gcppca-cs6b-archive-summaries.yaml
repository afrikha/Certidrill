id: gcppca-cs6b-archive-summaries
objective: "2.4.3"
type: single
caseStudy: gcppca-cs6b-harbourline-news
difficulty: 1
status: draft
stem:
  en: |
    You are designing the generation of summaries and topic tags for the archive product. The design must meet the business requirement for the archive product and the technical requirements.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Build a Dataflow pipeline that reads the archive table and calls the online API of a Gemini model for each article, and purchase Provisioned Throughput for the six weeks." } }
    - { id: b, text: { en: "Deploy an open model from Model Garden to a GPU endpoint, and call the endpoint for each article from a Cloud Run job that processes the articles in parallel." } }
    - { id: c, text: { en: "Export each article to Cloud Storage as a separate file, and have a Cloud Run function triggered by each new file call the online API of a Gemini model." } }
    - { id: d, text: { en: "Build a BigQuery table of requests from the archive table, submit batch inference jobs with a Gemini model that read the table, and write the summaries and tags to BigQuery." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Batch inference with Gemini on Gemini Enterprise Agent Platform (formerly Vertex AI) costs 50 % less than real-time inference and reads its requests from BigQuery or Cloud Storage. Most jobs finish within 24 hours, which suits a one-time job with no real-time requirement and a six-week deadline. A text generation job accepts up to 200,000 requests, so the 1.9 million articles are split into about ten jobs.
  options:
    a:
      en: Online calls are billed at the full real-time price, and Provisioned Throughput reserves dedicated capacity at extra cost, which a one-time job without latency needs does not justify.
    b:
      en: A self-deployed model on GPUs is model-serving infrastructure that Harbourline would operate and pay for by the hour, which breaks the technical requirement.
    c:
      en: An online call per article is billed at the full real-time price, and the export of 1.9 million files adds components without any benefit for a one-time job.
references:
  - title: Batch inference with Gemini
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/capabilities/batch-inference
