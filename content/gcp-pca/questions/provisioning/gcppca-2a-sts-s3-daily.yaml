id: gcppca-2a-sts-s3-daily
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company keeps 200 TB of video in an Amazon S3 bucket. It must copy the bucket to Cloud Storage and then, every night, copy only new and changed objects. The company does not want to run or manage any servers for the copy.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Run gcloud storage rsync from a Compute Engine VM on a nightly cron schedule." } }
    - { id: b, text: { en: "Create a Storage Transfer Service job from Amazon S3 to Cloud Storage with a daily schedule." } }
    - { id: c, text: { en: "Order a Transfer Appliance for the initial copy and repeat the order each night." } }
    - { id: d, text: { en: "Install Storage Transfer Service agents on Amazon EC2 instances and create a nightly agent-based job." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Storage Transfer Service is a managed service for transfers from Amazon S3, among other sources, and is optimized for large transfers. A scheduled job copies the bucket and then transfers only the objects that are new or changed on each run, and S3 transfers run without any agents to install.
  options:
    a: { en: "A VM running gcloud storage is a server that the company must manage, monitor and scale." }
    c: { en: "Transfer Appliance is an offline device for data in a data center; it cannot read from Amazon S3 or support nightly increments." }
    d: { en: "Agents are needed for file system and S3-compatible sources, not for Amazon S3, and EC2 instances are servers to manage." }
references:
  - title: Storage Transfer Service
    url: https://docs.cloud.google.com/storage-transfer/docs/overview
  - title: Manage transfer agents
    url: https://docs.cloud.google.com/storage-transfer/docs/managing-on-prem-agents
