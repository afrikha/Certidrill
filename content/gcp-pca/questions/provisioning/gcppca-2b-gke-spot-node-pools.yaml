id: gcppca-2b-gke-spot-node-pools
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs a GKE Standard cluster that hosts customer-facing APIs and system components such as kube-dns. The company wants to run large nightly batch Jobs on Spot VMs to cut cost. The batch Pods must run only on Spot nodes, and the APIs and system components must never be scheduled on Spot nodes.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Convert every node pool to Spot VMs and protect the APIs with PodDisruptionBudgets that keep enough replicas running.
    - id: b
      text:
        en: |-
          Create a Spot node pool tainted with cloud.google.com/gke-spot=true:NoSchedule, and give the batch Pods a matching toleration and a nodeSelector on that label.
    - id: c
      text:
        en: |-
          Give the batch Pods a preferred node affinity for the cloud.google.com/gke-spot=true label so that they favor the Spot nodes.
    - id: d
      text:
        en: |-
          Keep at least one node pool of standard VMs in the cluster for the APIs and the system components.
    - id: e
      text:
        en: |-
          Set terminationGracePeriodSeconds to 600 on the batch Pods so that they can finish their work after a preemption notice.
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      GKE labels Spot nodes with cloud.google.com/gke-spot=true; a NoSchedule taint on the Spot pool keeps Pods without a toleration away, and the toleration plus a nodeSelector forces the batch Pods onto Spot nodes. Google recommends keeping at least one standard node pool so that system components and critical workloads keep running when Spot capacity is reclaimed.
  options:
    a:
      en: |-
        Spot reclamation is involuntary, so PodDisruptionBudgets do not protect the APIs; the requirement also forbids running the APIs on Spot nodes.
    c:
      en: |-
        A preferred (soft) affinity lets the scheduler place batch Pods on standard nodes, which is why GKE does not recommend it when Pods must run only on Spot nodes.
    e:
      en: |-
        A higher terminationGracePeriodSeconds does not extend the graceful termination of Pods on preempted Spot nodes: it is 30 seconds by default and can be extended to at most 120 seconds, far less than 600 seconds.
references:
  - title: Spot VMs | Google Kubernetes Engine (GKE) | Google Cloud Documentation
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/spot-vms
