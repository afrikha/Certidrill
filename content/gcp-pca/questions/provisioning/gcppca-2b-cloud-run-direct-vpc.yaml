id: gcppca-2b-cloud-run-direct-vpc
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A ticketing company runs its checkout API on Cloud Run. The API must read session data from a Memorystore instance that has only an internal IP address in the company's VPC network. The architects want the lowest network latency between the API and Memorystore, and they do not want to pay for or maintain any additional VM instances for this connection. All internet-bound traffic from the API must keep its current path.

    What should you configure?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Serverless VPC Access connector in the region, and attach it to the service with the private-ranges-only egress setting.
    - id: b
      text:
        en: |-
          Create a Private Service Connect endpoint for the Memorystore instance, and call that endpoint from the service.
    - id: c
      text:
        en: |-
          Create a Cloud NAT gateway on the VPC network, and point the service at the Memorystore IP through that gateway.
    - id: d
      text:
        en: |-
          Configure Direct VPC egress on a subnet of the VPC network, with the private-ranges-only egress setting.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Direct VPC egress gives Cloud Run instances network interfaces in a VPC subnet, so they reach internal IP addresses such as Memorystore with lower latency and higher throughput than a connector. It adds no VM charges, only network egress. With private-ranges-only, only traffic to internal addresses goes through the VPC network, so internet traffic keeps its current path.
  options:
    a:
      en: |-
        A connector works, but it runs on Compute Engine instances that are billed and maintained, and it has higher latency and lower throughput than Direct VPC egress.
    b:
      en: |-
        Private Service Connect publishes or consumes services across networks; it does not give a Cloud Run service a path into the VPC network, which the service needs first.
    c:
      en: |-
        Cloud NAT translates outbound traffic to the internet for resources without external IP addresses; it does not connect a serverless service to internal IP addresses.
references:
  - title: Compare Direct VPC egress and VPC connectors | Cloud Run | Google Cloud Documentation
    url: https://docs.cloud.google.com/run/docs/configuring/connecting-vpc
