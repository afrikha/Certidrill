id: gcppca-2a-psc-saas-overlapping
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A software company runs a TCP-based licensing service in its own Google Cloud organization, behind an internal passthrough Network Load Balancer. Dozens of customers, each in their own organization, must reach the service from their VPC networks over internal IP addresses.

    Many customer networks use the same RFC 1918 ranges as each other and as the company's network. Customers must be able to reach only the licensing service, not other resources in the company's network, and the company must approve which customer projects can connect.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Peer the company's VPC network with each customer VPC network and export only the subnet route of the load balancer." } }
    - { id: b, text: { en: "Add each customer VPC network as a spoke of a Network Connectivity Center hub that the company manages." } }
    - { id: c, text: { en: "Publish the service with a Private Service Connect service attachment that uses a NAT subnet and an accept list, and have customers create endpoints." } }
    - { id: d, text: { en: "Make the company's project a Shared VPC host project and attach each customer project as a service project." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Private Service Connect service attachment publishes a service that sits behind a producer load balancer. Consumer traffic is translated through the producer's NAT subnet, so consumer and producer address ranges do not need to be coordinated, and consumers reach only the service IP address. The accept list of the service attachment controls which consumer projects can connect, and each consumer creates an endpoint with an internal IP address of its own.
  options:
    a: { en: "VPC Network Peering rejects overlapping subnet ranges, and subnet routes are always exchanged in full, so peering would expose the whole network." }
    b: { en: "VPC spokes exchange subnet routes, which does not work with overlapping ranges and exposes whole networks rather than one service." }
    d: { en: "Shared VPC requires the host and service projects to be in the same organization, and it would give customers access to the company's network." }
references:
  - title: Private Service Connect
    url: https://docs.cloud.google.com/vpc/docs/private-service-connect
