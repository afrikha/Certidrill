id: gcppca-2a-autoclass-archive-terminal
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A design studio stores project assets in Cloud Storage. Access patterns are unpredictable: most assets are never read after delivery, but some are reopened years later, often in bulk. The studio wants the lowest storage cost for assets that go untouched for over a year, no retrieval or early deletion fees when an old asset is reopened, and no rules to maintain.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create lifecycle rules that move objects to Nearline at 30 days, Coldline at 90 days and Archive at 365 days." } }
    - { id: b, text: { en: "Enable Autoclass on the bucket and set the terminal storage class to Archive." } }
    - { id: c, text: { en: "Enable Autoclass on the bucket and keep Nearline as the terminal storage class." } }
    - { id: d, text: { en: "Set the bucket's default storage class to Coldline for all new uploads." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Autoclass moves objects to colder classes based on access: to Nearline after 30 days without access and, with Archive as the terminal class, to Coldline after 90 days and Archive after 365 days. Reading an object brings it back to Standard, and Autoclass charges no retrieval or early deletion fees, only a management fee.
  options:
    a: { en: "Age-based lifecycle rules charge retrieval fees when old assets are read, and objects do not move back to Standard when they become active again." }
    c: { en: "With Nearline as the terminal class, untouched objects never go below Nearline, so storage for long-idle assets costs more than with Archive." }
    d: { en: "A Coldline default charges retrieval fees and a 90-day minimum on every asset, including those read often right after upload." }
references:
  - title: Autoclass
    url: https://docs.cloud.google.com/storage/docs/autoclass
