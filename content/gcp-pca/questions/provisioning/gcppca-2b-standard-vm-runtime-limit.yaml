id: gcppca-2b-standard-vm-runtime-limit
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank runs a monthly risk calculation on 40 large Compute Engine VMs. The calculation takes about 6 hours, cannot be checkpointed, and must finish before the regulatory reporting deadline the same day, so an interruption is not acceptable. In past months, engineers forgot to delete the VMs after the run, and they kept running for days. You need to prevent the idle VMs from running up costs with the least operational overhead.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create the VMs as Spot VMs with --max-run-duration=8h and --instance-termination-action=DELETE.
    - id: b
      text:
        en: |-
          Create the VMs as standard VMs, and add a Cloud Scheduler job that calls a Cloud Run function to delete them each evening.
    - id: c
      text:
        en: |-
          Create the VMs as legacy preemptible VMs, which Compute Engine stops automatically after at most 24 hours.
    - id: d
      text:
        en: |-
          Create the VMs as standard VMs with --max-run-duration=8h and --instance-termination-action=DELETE.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Standard VMs are not preempted, which the uninterrupted calculation requires. A run-time limit with the DELETE termination action makes Compute Engine delete each VM when the limit is reached, so forgotten VMs cannot keep running; for standard VMs the termination action must be set explicitly. The limit is part of the VM itself, so no extra scheduler or code has to be maintained.
  options:
    a:
      en: |-
        The run-time limit solves the cleanup problem, but Spot VMs can be preempted at any time, and the calculation cannot be checkpointed or interrupted.
    b:
      en: |-
        This works, but it adds a scheduler job and a function to build and maintain, which is more operational overhead than a run-time limit set on the VMs.
    c:
      en: |-
        Preemptible VMs can be preempted at any time like Spot VMs, and Google recommends Spot VMs instead of the legacy preemptible model.
references:
  - title: Limit the run time of a VM | Compute Engine | Google Cloud Documentation
    url: https://docs.cloud.google.com/compute/docs/instances/limit-vm-runtime
