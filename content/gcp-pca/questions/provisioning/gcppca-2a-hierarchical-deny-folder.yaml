id: gcppca-2a-hierarchical-deny-folder
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company keeps all production projects in a folder named prod. Each project team has the Owner role on its own projects and manages its own VPC firewall rules and network firewall policies.

    The security team must ensure that SSH and RDP connections from the internet (0.0.0.0/0) never reach any VM in the prod folder, including in projects created later. Project owners must not be able to override this control.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a VPC firewall rule with priority 0 that denies TCP ports 22 and 3389 from 0.0.0.0/0 in every project in the folder." } }
    - { id: b, text: { en: "Create a global network firewall policy with a deny rule for TCP ports 22 and 3389 from 0.0.0.0/0, and associate it with every VPC network in the folder." } }
    - { id: c, text: { en: "Create a hierarchical firewall policy with a goto_next rule for TCP ports 22 and 3389 from 0.0.0.0/0, and associate it with the prod folder." } }
    - { id: d, text: { en: "Create a hierarchical firewall policy with a deny rule for TCP ports 22 and 3389 from 0.0.0.0/0, and associate it with the prod folder." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Hierarchical firewall policies attached to a folder apply to every VPC network in the projects under that folder, including future projects. They are evaluated before VPC firewall rules and network firewall policies, and a matching deny stops all rule evaluation, so nothing a project owner configures lower in the hierarchy can allow the traffic.
  options:
    a: { en: "Project owners can delete or change VPC firewall rules in their own projects, and new projects would not get the rule automatically." }
    b: { en: "Network firewall policies live in projects that the owners control, and new VPC networks would need to be associated manually." }
    c: { en: "goto_next passes evaluation to the next level of the hierarchy, where project-level rules could allow the traffic." }
references:
  - title: Evaluation order for firewall policies and rules
    url: https://docs.cloud.google.com/firewall/docs/firewall-policies-rule-eval-order
  - title: Firewall policies and rules
    url: https://docs.cloud.google.com/firewall/docs/firewall-policies-overview
