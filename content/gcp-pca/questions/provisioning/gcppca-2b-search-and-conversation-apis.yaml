id: gcppca-2b-search-and-conversation-apis
objective: "2.5.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An appliance manufacturer wants two capabilities without training its own models. First, customers must be able to search its public support website in natural language and get generated answers based on the site's pages. Second, a virtual agent must hold conversations with customers in text and voice to troubleshoot common faults.

    Which two Google Cloud products should you use? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Agent Search, with a search app built on a website data store for the support site.
    - id: b
      text:
        en: |-
          The Cloud Natural Language API, with content classification of the support pages.
    - id: c
      text:
        en: |-
          Dialogflow CX, with an agent that handles the troubleshooting conversations.
    - id: d
      text:
        en: |-
          The Cloud Vision API, with web detection on images from the support site.
    - id: e
      text:
        en: |-
          Cloud Translation Advanced, with a glossary of the manufacturer's product terms.
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      Agent Search, formerly Vertex AI Search, provides Google-quality semantic search with AI-generated answers over website data and other data stores. Dialogflow CX agents are virtual agents that hold concurrent conversations with users and turn their text or audio into structured data for the conversation flow.
  options:
    b:
      en: |-
        Content classification assigns categories to text; it does not search the site or generate answers.
    d:
      en: |-
        Web detection finds web entities and matching images; it neither searches the support site nor converses with customers.
    e:
      en: |-
        Translation with glossaries converts text between languages; it provides neither search nor a virtual agent.
references:
  - title: Agent Search | Google Cloud Documentation
    url: https://docs.cloud.google.com/generative-ai-app-builder/docs
  - title: Agents | Dialogflow CX | Google Cloud Documentation
    url: https://docs.cloud.google.com/dialogflow/cx/docs/concept/agent
