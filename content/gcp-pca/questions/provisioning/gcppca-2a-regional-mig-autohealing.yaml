id: gcppca-2a-regional-mig-autohealing
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A news site runs a stateless web tier on Compute Engine behind a global external Application Load Balancer, in us-central1. The tier must keep serving if a zone fails, scale on CPU load, and automatically replace any VM whose web server stops responding even though the VM itself is still running.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a zonal managed instance group in us-central1-a with an autoscaling policy based on CPU utilization." } }
    - { id: b, text: { en: "Create a regional managed instance group in us-central1 with an autoscaling policy based on CPU utilization." } }
    - { id: c, text: { en: "Create an unmanaged instance group in each zone and add the VMs to the backend service." } }
    - { id: d, text: { en: "Set the VMs' on-host maintenance policy to MIGRATE and enable automatic restart." } }
    - { id: e, text: { en: "Configure autohealing on the group with an application-based HTTP health check and an initial delay." } }
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |
      A regional managed instance group spreads its VMs across zones of the region, so the tier keeps serving if one zone fails, and its autoscaler can scale on CPU utilization. Autohealing with an application-based health check recreates VMs whose application reports unhealthy, after an initial delay that lets new VMs start up.
  options:
    a: { en: "A zonal group runs all VMs in one zone, so a failure of that zone stops the tier." }
    c: { en: "Unmanaged instance groups support neither autoscaling nor autohealing." }
    d: { en: "Live migration and automatic restart handle host events; they do not detect or fix a web server that stopped responding." }
references:
  - title: Set up an application-based health check and autohealing
    url: https://docs.cloud.google.com/compute/docs/instance-groups/autohealing-instances-in-migs
