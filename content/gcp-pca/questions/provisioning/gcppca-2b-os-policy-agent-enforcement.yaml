id: gcppca-2b-os-policy-agent-enforcement
objective: "2.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company runs about 300 production Compute Engine VMs labeled env=prod in four zones of one project. Each production VM must have a monitoring agent package installed, and if someone removes the package, it must be reinstalled automatically without manual work. VMs added later with the same label must get the agent too.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a startup script to the VMs' metadata that installs the agent package when the VM boots.
    - id: b
      text:
        en: |-
          Set up VM Manager in the project so that the OS Config API is enabled and the OS Config agent runs on the VMs.
    - id: c
      text:
        en: |-
          Create a VM Manager patch deployment that targets the env=prod label and includes the agent package.
    - id: d
      text:
        en: |-
          Create an Infrastructure Manager deployment that declares the agent package for every VM labeled env=prod.
    - id: e
      text:
        en: |-
          Create an OS policy assignment in each zone with an OS policy that installs the agent package on VMs labeled env=prod.
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      OS policies are declarative configurations for packages, repositories, files and scripts; an OS policy assignment applies them to a dynamic group of VMs selected by labels, OS family and zone. Assignments are zonal, so each of the four zones needs one. The OS Config agent checks the policies periodically and changes only resources that drift from the desired state, so a removed package is reinstalled and new labeled VMs are covered.
  options:
    a:
      en: |-
        A startup script runs only when the VM boots, so a package removed while the VM runs is not reinstalled.
    c:
      en: |-
        Patch deployments apply operating system updates on a schedule; they do not install and enforce an additional package.
    d:
      en: |-
        Infrastructure Manager provisions Google Cloud resources with Terraform; it does not manage software inside the guest operating system.
references:
  - title: About OS policies | VM Manager | Google Cloud Documentation
    url: https://docs.cloud.google.com/compute/docs/os-configuration-management
