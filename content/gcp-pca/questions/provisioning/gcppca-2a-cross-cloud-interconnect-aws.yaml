id: gcppca-2a-cross-cloud-interconnect-aws
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company runs its rendering pipeline on AWS and its analytics platform on Google Cloud. It needs a dedicated, private, high-bandwidth connection of 100 Gbps between an AWS VPC and a Google Cloud VPC network. The company does not want to rent colocation space or operate its own routers for this link.

    Which solution should you recommend?
body:
  options:
    - { id: a, text: { en: "Cross-Cloud Interconnect, with ports ordered from Google Cloud and AWS that Google connects together" } }
    - { id: b, text: { en: "HA VPN, with tunnels between an HA VPN gateway and AWS virtual private gateways" } }
    - { id: c, text: { en: "Dedicated Interconnect, with your own router in a colocation facility that also connects to AWS" } }
    - { id: d, text: { en: "VPC Network Peering, between the Google Cloud VPC network and the AWS VPC" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Cross-Cloud Interconnect provisions a dedicated physical connection between Google's network and another cloud provider's network. You buy ports from both providers and Google connects them, so no colocation space or customer router is needed. AWS connections are offered at 10, 100 and 400 Gbps.
  options:
    b: { en: "HA VPN runs over the internet and each tunnel carries only about 1 to 3 Gbps, so it is neither dedicated nor sized for 100 Gbps." }
    c: { en: "This design needs colocation space and customer-operated routers, which the company wants to avoid." }
    d: { en: "VPC Network Peering connects two Google Cloud VPC networks only; it cannot peer with a network in another cloud." }
references:
  - title: Cross-Cloud Interconnect overview
    url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/cci-overview
