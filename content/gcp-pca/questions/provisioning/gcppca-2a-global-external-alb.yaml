id: gcppca-2a-global-external-alb
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online learning platform serves an HTTPS web application from managed instance groups in us-central1, europe-west1 and asia-east1. Users must reach the application through a single IP address, be sent to the closest backend with available capacity, and have their TLS sessions terminated close to them.

    Which load balancer should you use?
body:
  options:
    - { id: a, text: { en: "A regional external Application Load Balancer in each region, with DNS records for the three IP addresses" } }
    - { id: b, text: { en: "A global external Application Load Balancer with a backend service that includes the three instance groups" } }
    - { id: c, text: { en: "An external passthrough Network Load Balancer with a backend service that includes the three instance groups" } }
    - { id: d, text: { en: "A cross-region internal Application Load Balancer with a backend service that includes the three instance groups" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The global external Application Load Balancer uses a single anycast IP address on Premium Tier, terminates TLS at Google front ends around the world, and sends each request to the nearest backend that has capacity. One backend service can contain instance groups from several regions.
  options:
    a: { en: "Regional load balancers give three IP addresses and terminate TLS only in their own region, so users far from a region do not get edge termination." }
    c: { en: "External passthrough Network Load Balancers are regional and do not terminate TLS; backends in other regions cannot be used." }
    d: { en: "An internal Application Load Balancer is reachable only from internal clients, not from users on the internet." }
references:
  - title: Choose a load balancer
    url: https://docs.cloud.google.com/load-balancing/docs/choosing-load-balancer
