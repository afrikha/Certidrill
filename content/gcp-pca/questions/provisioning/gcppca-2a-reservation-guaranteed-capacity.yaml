id: gcppca-2a-reservation-guaranteed-capacity
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An e-commerce company expects a two-week sales event in March. It needs 200 n2-standard-16 VMs in us-central1-a for the event and has been told that capacity for that machine type in the zone can run short during busy periods. Management requires certainty that the VMs can be created when the event starts.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Purchase a one-year resource-based committed use discount for 3,200 N2 vCPUs and the matching memory in us-central1." } }
    - { id: b, text: { en: "Request a quota increase for N2 vCPUs in us-central1 that covers 3,200 vCPUs before the event." } }
    - { id: c, text: { en: "Create a reservation for 200 n2-standard-16 VMs in us-central1-a before the event, and delete it when the event ends." } }
    - { id: d, text: { en: "Create the 200 VMs as Spot VMs when the event starts to benefit from lower prices." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When you create a reservation, Compute Engine checks that the requested capacity is available in the zone and then sets it aside for your VMs. The reservation is charged for as long as it exists, used or not, so creating it shortly before the event and deleting it afterward limits the cost.
  options:
    a: { en: "A commitment is a discount agreement; without an attached reservation it does not reserve capacity, and a one-year term far exceeds a two-week need." }
    b: { en: "Quota is a limit on what you may use, not a guarantee that the zone has the capacity." }
    d: { en: "Spot VMs use spare capacity and can be preempted at any time, which gives no certainty at all." }
references:
  - title: About reservations
    url: https://docs.cloud.google.com/compute/docs/instances/reservations-overview
  - title: Committed use discounts (CUDs) for Compute Engine
    url: https://docs.cloud.google.com/compute/docs/instances/committed-use-discounts-overview
