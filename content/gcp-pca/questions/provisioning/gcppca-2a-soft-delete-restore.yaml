id: gcppca-2a-soft-delete-restore
objective: "2.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Three days ago, an engineer at a publishing company deleted an important object from a Cloud Storage bucket by mistake. The bucket was created with default settings: Object Versioning is disabled, no backup has been configured and no retention policy exists.

    What should you do to recover the object?
body:
  options:
    - { id: a, text: { en: "Restore the noncurrent version of the object by copying it over the live object name." } }
    - { id: b, text: { en: "List the soft-deleted objects in the bucket and restore the deleted object." } }
    - { id: c, text: { en: "Restore the object from the latest backup of the bucket in a Backup and DR backup vault." } }
    - { id: d, text: { en: "Copy the object back from the cross-region replica that Cloud Storage keeps for every bucket." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Soft delete is enabled by default on buckets that support it, with a seven-day retention duration. A deleted object stays recoverable during that period and can be restored as a new live object, so an object deleted three days ago can still be recovered.
  options:
    a: { en: "Noncurrent versions exist only when Object Versioning is enabled, which it is not." }
    c: { en: "No backup has been configured, so there is nothing to restore from a backup vault." }
    d: { en: "Cloud Storage keeps redundant copies only for durability, and a delete applies to all of them; there is no separate replica to copy from." }
references:
  - title: Soft delete overview
    url: https://docs.cloud.google.com/storage/docs/soft-delete
