id: gcppca-2b-pipeline-event-trigger
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A ride-sharing company stores a compiled Agent Platform Pipelines template in Artifact Registry. The template retrains a pricing model from a BigQuery table. New rows are loaded into the table by partner jobs at irregular times, sometimes several times a day and sometimes not for a week. The company wants a training run to start soon after each load and no run when no data has been loaded.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a pipeline schedule with PipelineJob.create_schedule that runs the template every hour.
    - id: b
      text:
        en: |-
          Deploy a Cloud Run function with an Eventarc trigger for BigQuery insert jobs on the table, and have it create a pipeline run from the template.
    - id: c
      text:
        en: |-
          Run the template every hour and enable execution caching so that runs without new data reuse earlier results.
    - id: d
      text:
        en: |-
          Configure model monitoring on the deployed model, and retrain it when the monitoring job reports feature drift.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An Eventarc trigger on the BigQuery insert job event invokes a Cloud Run function each time data is loaded into the table, and the function calls the Pipelines API to create a run from the template stored in Artifact Registry. Runs start only when data arrives, which is the event-driven pattern of Google's continuous training tutorial.
  options:
    a:
      en: |-
        A schedule runs the pipeline at fixed times whether or not new data was loaded, which the company wants to avoid.
    c:
      en: |-
        The cache key covers the step's parameters and component definition, not the table's contents, so steps can be skipped even after new data is loaded, and runs still start without new data.
    d:
      en: |-
        Drift monitoring reacts to changes in serving data, not to table loads, so it neither starts a run after each load nor avoids runs.
references:
  - title: Build a pipeline for continuous model training | Gemini Enterprise Agent Platform | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/pipelines/continuous-training-tutorial
