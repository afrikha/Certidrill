id: gcppca-2a-cmek-bucket-default-key
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A government contractor creates a Cloud Storage bucket in europe-west3 for project documents. Every new object must be encrypted automatically with a Cloud KMS key whose rotation and access the security team controls. Uploaders must not have to specify a key in their requests.

    Which three actions should you take? Choose three.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Create the key in a key ring in the europe-west3 location." } }
    - { id: b, text: { en: "Create the key in a key ring in the global location." } }
    - { id: c, text: { en: "Grant the project's Cloud Storage service agent the Cloud KMS CryptoKey Encrypter/Decrypter role on the key." } }
    - { id: d, text: { en: "Grant each uploader the Cloud KMS CryptoKey Encrypter/Decrypter role on the key." } }
    - { id: e, text: { en: "Set the key as the bucket's default key with gcloud storage buckets update --default-encryption-key." } }
    - { id: f, text: { en: "Have the application send a customer-supplied encryption key with each upload request." } }
answer: { optionIds: [a, c, e] }
explanation:
  correct:
    en: |
      For CMEK, the key ring must be in the same location as the bucket's data. The Cloud Storage service agent performs encryption and decryption, so it needs `roles/cloudkms.cryptoKeyEncrypterDecrypter` on the key. A default key on the bucket encrypts every new object that does not request another key.
  options:
    b: { en: "A key in the global location does not match the europe-west3 location of the bucket, which CMEK requires." }
    d: { en: "Uploaders do not use the key themselves; the Cloud Storage service agent does, so granting them the role adds unneeded access." }
    f: { en: "Customer-supplied keys are managed outside Cloud KMS and must be sent with every request, which contradicts both requirements." }
references:
  - title: Customer-managed encryption keys
    url: https://docs.cloud.google.com/storage/docs/encryption/customer-managed-keys
  - title: Use customer-managed encryption keys
    url: https://docs.cloud.google.com/storage/docs/encryption/using-customer-managed-keys
