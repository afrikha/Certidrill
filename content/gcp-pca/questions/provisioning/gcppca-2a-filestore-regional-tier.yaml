id: gcppca-2a-filestore-regional-tier
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineering company runs a CAD application on VMs spread across three zones of europe-west1. The VMs share a 5-TiB POSIX file system over NFSv4.1. The file system must stay available if one zone fails, and the company wants a managed service.

    Which storage should you provision?
body:
  options:
    - { id: a, text: { en: "A Filestore instance in the Zonal tier" } }
    - { id: b, text: { en: "A Filestore instance in the Basic SSD tier" } }
    - { id: c, text: { en: "A regional Cloud Storage bucket mounted with Cloud Storage FUSE" } }
    - { id: d, text: { en: "A Filestore instance in the Regional tier" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Filestore Regional tier replicates the instance across zones of a region, so it survives a zone outage. It supports NFSv3 and NFSv4.1 and capacities that include 5 TiB, and Google manages the service.
  options:
    a: { en: "A Zonal tier instance lives in one zone, so a failure of that zone makes the file system unavailable." }
    b: { en: "Basic SSD is a legacy zonal tier that supports only NFSv3, so it fails both the availability and the protocol requirement." }
    c: { en: "Cloud Storage FUSE presents a bucket as files but is not an NFS server and does not provide full POSIX semantics for a shared file system." }
references:
  - title: About service tiers
    url: https://docs.cloud.google.com/filestore/docs/service-tiers
