id: gcppca-2a-passthrough-nlb-udp
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A game studio hosts real-time multiplayer servers on Compute Engine VMs in europe-west4. The game protocol uses UDP. The servers must see each player's original source IP address for anti-cheat checks and must reply to players directly, without a proxy in the path.

    Which load balancer should you recommend?
body:
  options:
    - { id: a, text: { en: "A global external proxy Network Load Balancer" } }
    - { id: b, text: { en: "A regional external proxy Network Load Balancer" } }
    - { id: c, text: { en: "A regional external passthrough Network Load Balancer" } }
    - { id: d, text: { en: "A global external Application Load Balancer" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Passthrough Network Load Balancers deliver packets to the backends unchanged, so the VMs see the client's source IP address and answer the client directly. The regional external passthrough Network Load Balancer supports UDP as well as TCP, ESP, GRE and ICMP.
  options:
    a: { en: "Proxy Network Load Balancers terminate client connections and open new ones to the backends, and they handle TCP, not UDP." }
    b: { en: "A proxy load balancer terminates client connections, so backends do not see the original client IP address by default, and it does not carry UDP." }
    d: { en: "Application Load Balancers are proxies for HTTP and HTTPS traffic; they cannot carry a custom UDP protocol." }
references:
  - title: Choose a load balancer
    url: https://docs.cloud.google.com/load-balancing/docs/choosing-load-balancer
