id: gcppca-2b-agent-platform-pipelines-choice
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail analytics team has written its model training workflow with the Kubeflow Pipelines SDK: data validation, training, evaluation, and model upload, each in its own container. The team wants to run the workflow on Google Cloud without managing any cluster or orchestration environment, and it wants the parameters and artifacts of every run tracked for lineage.

    What should the team use?
body:
  options:
    - id: a
      text:
        en: |-
          A Managed Service for Apache Airflow environment that runs the steps as Airflow tasks.
    - id: b
      text:
        en: |-
          Kubeflow Pipelines installed on a GKE Standard cluster managed by the team.
    - id: c
      text:
        en: |-
          Agent Platform Pipelines, running the compiled pipeline definition as pipeline runs.
    - id: d
      text:
        en: |-
          A Cloud Build pipeline whose build steps run each container in sequence.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Agent Platform Pipelines is a serverless service that runs pipelines defined with the Kubeflow Pipelines or TFX SDK, as a graph of containerized tasks. It stores the parameters and artifact metadata of each run in Agent Platform ML Metadata, which provides lineage, and it needs no cluster or environment.
  options:
    a:
      en: |-
        Managed Airflow suits end-to-end workflows that mix data engineering and ML, but it means running an environment and rewriting the Kubeflow pipeline as a DAG.
    b:
      en: |-
        Self-managed Kubeflow on GKE runs the same SDK, but the team would operate the cluster, which the requirement excludes.
    d:
      en: |-
        Cloud Build runs CI/CD steps; it does not track ML artifacts and their lineage across runs.
references:
  - title: Introduction to Gemini Enterprise Agent Platform Pipelines | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/pipelines/introduction
