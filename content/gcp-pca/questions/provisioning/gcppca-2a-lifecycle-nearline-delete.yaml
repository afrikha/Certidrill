id: gcppca-2a-lifecycle-nearline-delete
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A SaaS provider writes application logs to a Cloud Storage bucket in the Standard storage class. Logs are read often during their first 30 days and rarely afterward. They must be moved to Nearline storage after 30 days and deleted after 365 days, without any code to maintain.

    What should you configure?
body:
  options:
    - { id: a, text: { en: "Autoclass on the bucket, with Nearline as the terminal storage class" } }
    - { id: b, text: { en: "Object Lifecycle Management rules: SetStorageClass to NEARLINE at age 30 and Delete at age 365" } }
    - { id: c, text: { en: "A retention policy of 365 days on the bucket, with the default storage class set to Nearline" } }
    - { id: d, text: { en: "Object Versioning, with a lifecycle rule that keeps one noncurrent version per object" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Object Lifecycle Management runs rules on the bucket's objects for you. A SetStorageClass action with an age condition of 30 days moves objects from Standard to Nearline, and a Delete action with an age of 365 days removes them. Changes in class made by the rule do not incur early deletion charges.
  options:
    a: { en: "Autoclass moves objects according to access, not age, never deletes them, and cannot be combined with SetStorageClass rules." }
    c: { en: "A retention policy prevents deletion before 365 days but never deletes anything, and a Nearline default class would put new, frequently read logs in Nearline from day one." }
    d: { en: "Versioning keeps older versions of objects; it neither changes the storage class nor deletes logs after a year." }
references:
  - title: Object Lifecycle Management
    url: https://docs.cloud.google.com/storage/docs/lifecycle
