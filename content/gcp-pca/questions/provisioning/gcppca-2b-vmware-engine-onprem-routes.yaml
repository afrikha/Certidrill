id: gcppca-2b-vmware-engine-onprem-routes
objective: "2.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A hospital group connects its data center to a VPC network named transit-vpc through Dedicated Cloud Interconnect. On-premises hosts can reach Compute Engine VMs in transit-vpc. transit-vpc is connected to a standard VMware Engine network through VPC Network Peering, and a VMware Engine private cloud runs the group's migrated workloads. On-premises hosts cannot reach the private cloud's workload VMs, and those VMs cannot reach on-premises hosts.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Enable import and export of custom routes on the VPC Network Peering connection between transit-vpc and the VMware Engine network.
    - id: b
      text:
        en: |-
          Create a Cloud NAT gateway in transit-vpc for the address ranges of the private cloud's workload segments.
    - id: c
      text:
        en: |-
          Enable Private Google Access on the subnets of transit-vpc that the VMware Engine network peers with.
    - id: d
      text:
        en: |-
          Add the private cloud's address ranges as custom advertised routes on the Cloud Router that terminates the VLAN attachments.
    - id: e
      text:
        en: |-
          Create a second VLAN attachment in another edge availability domain of the same metropolitan area.
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      Traffic crosses two boundaries: on-premises to transit-vpc over Cloud Interconnect, then transit-vpc to VMware Engine over peering. Enabling custom route import and export on the peering lets the dynamic routes learned from on-premises reach the VMware Engine network. Adding the private cloud ranges as custom advertised routes on the Cloud Router announces them to the on-premises routers over the Interconnect.
  options:
    b:
      en: |-
        Cloud NAT translates outbound connections to the internet; it does not exchange routes between on-premises and the private cloud.
    c:
      en: |-
        Private Google Access lets VMs without external IP addresses reach Google APIs; it does not affect routing to on-premises networks.
    e:
      en: |-
        A second attachment adds redundancy for the existing Interconnect, but the missing routes on both boundaries remain missing.
references:
  - title: Connecting from an on-premises network to VMware Engine standard or stretched private cloud | Google Cloud VMware Engine | Google Cloud Documentation
    url: https://docs.cloud.google.com/vmware-engine/docs/networking/howto-connect-to-onpremises
