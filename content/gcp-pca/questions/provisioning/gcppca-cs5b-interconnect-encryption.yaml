id: gcppca-cs5b-interconnect-encryption
objective: "2.1.1"
type: single
caseStudy: gcppca-cs5b-corvane-telecom
difficulty: 1
status: draft
stem:
  en: |
    You are designing the connections between Corvane's colocation routers and Google Cloud. The design must meet the technical requirement for the traffic between Corvane's routers and Google's edge routers.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Order 100-Gbps Dedicated Interconnect connections in both colocation facilities and create VLAN attachments, relying on Google's default encryption in transit for the traffic on the connections." } }
    - { id: b, text: { en: "Order 100-Gbps Dedicated Interconnect connections in both colocation facilities, create encrypted VLAN attachments, and run HA VPN tunnels over them between Corvane's routers and HA VPN gateways." } }
    - { id: c, text: { en: "Create HA VPN tunnels over the internet from the routers in both colocation facilities to HA VPN gateways in the primary region, with BGP sessions on Cloud Router." } }
    - { id: d, text: { en: "Order 100-Gbps Dedicated Interconnect connections in both colocation facilities, enable MACsec on them, and configure Corvane's routers with the pre-shared keys generated for the connections." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      MACsec for Cloud Interconnect encrypts traffic at Layer 2 between the customer's router and Google's peering edge router, and it is available on 100-Gbps connections in every location at no additional cost. You generate the connectivity association key (CAK) and key name (CKN) with the gcloud CLI or the console and configure them on the routers; no IPsec tunnel is involved.
  options:
    a:
      en: Without MACsec, nothing encrypts the traffic on the Dedicated Interconnect connections at Layer 2, which the technical requirements demand.
    b:
      en: HA VPN over Cloud Interconnect encrypts at Layer 3 with IPsec tunnels that the network team does not want to operate, and an encrypted VLAN attachment is limited to 50 Gbps of combined throughput.
    c:
      en: HA VPN over the internet uses IPsec tunnels at Layer 3 and does not provide the 140 Gbps that the month-end traffic needs.
references:
  - title: MACsec for Cloud Interconnect overview
    url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/macsec-overview
  - title: HA VPN over Cloud Interconnect overview
    url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/ha-vpn-interconnect
