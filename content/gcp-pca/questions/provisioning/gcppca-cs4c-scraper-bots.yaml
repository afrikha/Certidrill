id: gcppca-cs4c-scraper-bots
objective: "2.1.3"
type: single
caseStudy: gcppca-cs4c-saltroute-travel
difficulty: 3
status: draft
stem:
  en: |
    You need to protect the search service from the price-comparison scrapers. The solution must meet the business requirement about scrapers and work with the scrapers' behavior described in the existing technical environment.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Add a Cloud Armor rate_based_ban rule keyed on the client IP address for the search path to the security policy of the load balancer, with a threshold of 100 requests per minute." } }
    - { id: b, text: { en: "Add reCAPTCHA session-tokens to Saltroute's web pages, and add a Cloud Armor rule for the search path that denies requests whose reCAPTCHA session-token score is below a threshold." } }
    - { id: c, text: { en: "Add a Cloud Armor rule for the search path that redirects every request to a reCAPTCHA manual challenge, and allow requests that carry a valid exemption cookie." } }
    - { id: d, text: { en: "Enable IAP on the backend services of the search service, and allow the allAuthenticatedUsers principal so that only signed-in visitors can search." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Cloud Armor bot management with reCAPTCHA evaluates the session-tokens that reCAPTCHA attaches to the requests of a website and decodes them inline, without an extra call to reCAPTCHA. A rule on token.recaptcha_session.score blocks automated clients by their behavior, whatever IP address they use, and real travelers never see a challenge, because the assessment is frictionless.
  options:
    a:
      en: The scrapers rotate through tens of thousands of residential IP addresses, so each address stays under a per-IP threshold, as it does with the current rate limits.
    c:
      en: A manual challenge on every search adds friction for every traveler, which the business requirement forbids.
    d:
      en: Requiring sign-in contradicts the requirement that travelers search without signing in, and scrapers can still create accounts.
references:
  - title: Bot management overview
    url: https://docs.cloud.google.com/armor/docs/bot-management
  - title: Configure bot management
    url: https://docs.cloud.google.com/armor/docs/configure-bot-management
