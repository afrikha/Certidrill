id: gcppca-2a-transfer-appliance-600tb
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A satellite imagery company must move a 600-TB archive from its data center in Germany to a Cloud Storage bucket in europe-west3 within two months. The data center's internet uplink is 200 Mbps and is shared with production traffic, and no network upgrade is possible before the deadline. The data must stay in the EU throughout.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a Storage Transfer Service job with agents in the data center, and limit its bandwidth to protect production traffic." } }
    - { id: b, text: { en: "Upload the data with gcloud storage cp using parallel composite uploads from several machines." } }
    - { id: c, text: { en: "Order Transfer Appliance, copy the archive to the appliances, and ship them back for upload to the bucket." } }
    - { id: d, text: { en: "Create an HA VPN connection and transfer the data with Storage Transfer Service over the tunnels." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      At 200 Mbps, 600 TB needs about 24 million seconds, roughly nine months, even with the whole link, so no online method meets two months. Google recommends Transfer Appliance when an upload would take more than a week. Data is encrypted on the appliance, and for EU customers who pick an EU destination region the data stays in the EU.
  options:
    a: { en: "Agents still use the 200-Mbps uplink, so the transfer would take many months, longer still with a bandwidth limit." }
    b: { en: "Parallel uploads cannot exceed the 200-Mbps uplink, so the copy would take roughly nine months." }
    d: { en: "HA VPN tunnels run over the same 200-Mbps internet uplink and add no bandwidth." }
references:
  - title: Transfer Appliance
    url: https://docs.cloud.google.com/transfer-appliance/docs/4.0/overview
