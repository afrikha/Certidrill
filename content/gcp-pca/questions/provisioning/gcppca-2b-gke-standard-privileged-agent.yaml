id: gcppca-2b-gke-standard-privileged-agent
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company is creating a new GKE cluster for its services. Its security team requires an in-house host intrusion-detection agent on every node. The agent runs as a privileged DaemonSet that uses the host PID namespace, and it is not a verified Google Cloud partner workload. The platform team otherwise wants Google to handle as much node maintenance as possible.

    Which cluster design should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          A GKE Autopilot cluster created with --workload-policies=allow-net-admin so that the agent can access the host.
    - id: b
      text:
        en: |-
          A GKE Standard cluster in a release channel with node auto-upgrade and auto-repair, running the agent as a DaemonSet.
    - id: c
      text:
        en: |-
          A GKE Autopilot cluster with a custom ComputeClass that selects a dedicated machine series for the agent's nodes.
    - id: d
      text:
        en: |-
          A GKE Autopilot cluster where the agent runs as a sidecar container in every application Pod.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Autopilot blocks privileged containers and host namespaces by default and allows them only for verified partner workloads, so the in-house agent cannot run there. A Standard cluster permits the privileged DaemonSet, and a release channel with node auto-upgrade and auto-repair still lets Google handle most node maintenance.
  options:
    a:
      en: |-
        The allow-net-admin workload policy only adds the NET_ADMIN capability; it does not allow privileged containers or the host PID namespace.
    c:
      en: |-
        A ComputeClass selects node hardware; Autopilot's security restrictions on privileged containers and host namespaces still apply on those nodes.
    d:
      en: |-
        A sidecar is still a container in an Autopilot Pod, so it cannot be privileged or use the host PID namespace, and it would not monitor the node itself.
references:
  - title: GKE Autopilot security measures | GKE security | Google Cloud Documentation
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-security
