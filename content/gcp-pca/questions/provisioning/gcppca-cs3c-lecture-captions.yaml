id: gcppca-cs3c-lecture-captions
objective: "2.5.1"
type: single
caseStudy: gcppca-cs3c-lanternhall-learning
difficulty: 1
status: draft
stem:
  en: |
    You need to produce the captions of the lecture archive. The solution must meet the business requirement about captions and the technical requirement for captions.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Send each recording to the Speech-to-Text V2 Recognize method in one synchronous request with its language code, and convert the returned transcript to WebVTT." } }
    - { id: b, text: { en: "Train a custom speech recognition model on Agent Platform with a sample of transcribed lectures, deploy it to an endpoint, and call it for each recording." } }
    - { id: c, text: { en: "Stream each recording to the Speech-to-Text V2 StreamingRecognize method in real time, and write the interim results to a WebVTT file." } }
    - { id: d, text: { en: "Transcribe the recordings from Cloud Storage with the Speech-to-Text V2 BatchRecognize method and their language codes, and request the WebVTT caption output in Cloud Storage." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      BatchRecognize is the asynchronous method for long audio files stored in Cloud Storage, up to 8 hours each, and it is the only method that can return WebVTT or SRT captions, which it can write to Cloud Storage. The prebuilt models transcribe each recording in the language given by its metadata, so no model is trained and no caption conversion code is written.
  options:
    a:
      en: Synchronous recognition handles short audio only; recordings of 45 to 120 minutes require asynchronous batch recognition, and the WebVTT conversion would be custom code.
    b:
      en: Training a custom model is development effort that the technical requirements exclude, and the prebuilt models already transcribe the lectures.
    c:
      en: Streaming recognition is meant for live audio; replaying 60,000 hours in real time is slow and costly, and caption output is available only with batch recognition.
references:
  - title: Generate WebVTT and SRT captions
    url: https://docs.cloud.google.com/speech-to-text/docs/caption-support
  - title: Transcribe long audio files into text
    url: https://docs.cloud.google.com/speech-to-text/docs/batch-recognize
