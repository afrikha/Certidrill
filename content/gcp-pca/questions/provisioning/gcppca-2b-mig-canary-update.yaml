id: gcppca-2b-mig-canary-update
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retailer serves its storefront from a regional managed instance group named web-mig that uses the instance template web-v1. A new template, web-v2, contains a new application release. The release team wants web-v2 on only 10% of the VMs first so that they can compare error rates, while the other VMs keep running web-v1.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          gcloud compute instance-groups managed rolling-action start-update web-mig --version=template=web-v1 --canary-version=template=web-v2,target-size=10% --region=us-east1
    - id: b
      text:
        en: |-
          gcloud compute instance-groups managed rolling-action start-update web-mig --version=template=web-v2 --max-surge=10% --region=us-east1
    - id: c
      text:
        en: |-
          gcloud compute instance-groups managed set-instance-template web-mig --template=web-v2 --region=us-east1
    - id: d
      text:
        en: |-
          gcloud compute instance-groups managed rolling-action replace web-mig --max-unavailable=10% --region=us-east1
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A canary update sets two versions on the MIG: the main version keeps web-v1, and the canary version applies web-v2 to the target size, here 10% of the VMs. After validation, running the update again with web-v2 as the only version rolls it forward to all VMs.
  options:
    b:
      en: |-
        This updates every VM to web-v2; --max-surge only limits how many extra VMs are created at the same time during the rollout.
    c:
      en: |-
        Setting the template switches the group to the selective (opportunistic) update type; no canary split is defined and VMs get web-v2 only when they are recreated.
    d:
      en: |-
        A replace action recreates VMs with the group's current template, web-v1; it does not apply web-v2 to any VM.
references:
  - title: Automatically apply VM configuration updates in a MIG | Compute Engine | Google Cloud Documentation
    url: https://docs.cloud.google.com/compute/docs/instance-groups/rolling-out-updates-to-managed-instance-groups
