id: gcppca-2b-gke-pod-range-sizing
objective: "2.3.3"
type: single
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    A fintech company is creating a VPC-native GKE Standard cluster in a Shared VPC service project. The cluster must scale to 500 nodes and keep the default maximum of 110 Pods per node. A network administrator in the host project must create the subnet's secondary range for Pods before the cluster is created, and IP address space is scarce.

    What is the smallest Pod secondary range that supports the cluster?
body:
  options:
    - id: a
      text: "/17"
    - id: b
      text: "/16"
    - id: c
      text: "/15"
    - id: d
      text: "/14"
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With the default of 110 Pods per node, GKE assigns each node a /24 alias range of 256 addresses. 500 nodes need 500 × 256 = 128,000 addresses, and a /15 provides 131,072 addresses, enough for 512 nodes. In a Shared VPC, GKE cannot create the secondary ranges, so the host project's network administrator must size them correctly up front.
  options:
    a:
      en: |-
        A /17 provides 32,768 addresses, enough for only 128 nodes at one /24 per node.
    b:
      en: |-
        A /16 provides 65,536 addresses, enough for only 256 nodes at one /24 per node.
    d:
      en: |-
        A /14 supports 1,024 nodes, which works but wastes scarce address space compared with a /15.
references:
  - title: VPC-native clusters | GKE networking | Google Cloud Documentation
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/alias-ips
