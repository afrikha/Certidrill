id: gcppca-2b-gke-autopilot-choice
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A small e-commerce company is moving 15 containerized microservices to Google Cloud. The team knows Kubernetes and wants to keep using Kubernetes manifests, but it has no staff to size, patch, or scale nodes. It wants to pay for the resources that its Pods request rather than for whole nodes.

    Which platform should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          A GKE Autopilot cluster in a release channel, with resource requests set on every Pod.
    - id: b
      text:
        en: |-
          A GKE Standard cluster with the cluster autoscaler and node auto-provisioning enabled.
    - id: c
      text:
        en: |-
          A self-managed Kubernetes cluster on Compute Engine managed instance groups with autoscaling.
    - id: d
      text:
        en: |-
          A GKE Standard cluster with Spot node pools and node auto-upgrade enabled.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      In Autopilot, Google manages the nodes, scales them from the Pods' requests and applies node security patches automatically, and general-purpose Pods are billed by their resource requests. Every Autopilot cluster is enrolled in a release channel, and the team keeps using standard Kubernetes manifests.
  options:
    b:
      en: |-
        Autoscaling and auto-provisioning reduce node work, but Standard clusters still bill for whole nodes and leave node configuration to the team.
    c:
      en: |-
        A self-managed cluster makes the team operate the control plane and the nodes, the opposite of the stated constraint.
    d:
      en: |-
        Spot node pools lower cost, but the team still manages the node pools and pays per node, and Spot nodes can be reclaimed at any time.
references:
  - title: GKE Autopilot overview | Google Kubernetes Engine (GKE) | Google Cloud Documentation
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview
