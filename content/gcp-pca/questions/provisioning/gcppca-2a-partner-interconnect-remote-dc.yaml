id: gcppca-2a-partner-interconnect-remote-dc
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A regional hospital group needs private connectivity between its only data center and Google Cloud. The data center is far from any Google colocation facility, and the group needs about 2 Gbps of bandwidth. Security policy states that the traffic must not traverse the public internet.

    Which connectivity option should you recommend?
body:
  options:
    - { id: a, text: { en: "Dedicated Interconnect, with a 10-Gbps connection ordered from the nearest colocation facility" } }
    - { id: b, text: { en: "HA VPN, with two tunnels from the data center routers to an HA VPN gateway" } }
    - { id: c, text: { en: "Cross-Cloud Interconnect, with a connection from the data center to the nearest Google region" } }
    - { id: d, text: { en: "Partner Interconnect, with VLAN attachments provisioned through a supported service provider" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Partner Interconnect is designed for sites that cannot reach a Dedicated Interconnect colocation facility, or whose bandwidth needs do not justify a full 10-Gbps connection. A supported service provider carries the traffic between the data center and Google over its own network, so the traffic does not cross the public internet.
  options:
    a: { en: "Dedicated Interconnect requires your own router in a Google colocation facility, which the data center cannot reach, and its smallest connection is 10 Gbps." }
    b: { en: "HA VPN tunnels run over the public internet (encrypted), which the security policy forbids." }
    c: { en: "Cross-Cloud Interconnect connects Google Cloud to another cloud provider (AWS, Azure, OCI, Alibaba Cloud), not to an on-premises data center." }
references:
  - title: Partner Interconnect overview
    url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/partner-overview
