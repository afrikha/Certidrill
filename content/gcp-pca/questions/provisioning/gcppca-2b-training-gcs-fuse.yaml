id: gcppca-2b-training-gcs-fuse
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A medical imaging startup trains a PyTorch model with distributed serverless training on Gemini Enterprise Agent Platform. Its 20 TB of training images are in a regional Cloud Storage bucket in the same region as the job. The training code reads images from local file paths, and today each replica copies the whole dataset to its disk before training, which delays every job start by hours. The team wants faster job starts without managing additional storage.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Copy the images to a Filestore instance and mount it in the training job as an NFS share.
    - id: b
      text:
        en: |-
          Move the images to a dual-region bucket to increase read throughput, and keep the copy step.
    - id: c
      text:
        en: |-
          Load the images into a BigQuery table as bytes and read them with the BigQuery Storage Read API.
    - id: d
      text:
        en: |-
          Change the training code to read the images from the /gcs/BUCKET_NAME/ path through Cloud Storage FUSE.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Serverless training jobs mount Cloud Storage buckets under the /gcs directory with Cloud Storage FUSE, so code can read gs://BUCKET_NAME/path as /gcs/BUCKET_NAME/path. Data is streamed to the job instead of being copied to each replica, which speeds up job starts, and it suits large unstructured datasets and distributed training with no extra storage to manage.
  options:
    a:
      en: |-
        An NFS share can feed training jobs, but it adds a Filestore instance to provision, pay for and keep in sync with the bucket.
    b:
      en: |-
        Throughput is not the problem, since the delay comes from copying the full dataset to each replica; dual-region buckets are also not supported by Cloud Storage FUSE in training jobs.
    c:
      en: |-
        Storing images as bytes in BigQuery means a data migration and a rewrite of the data loading code, more work than mounting the existing bucket.
references:
  - title: Use Cloud Storage as a mounted file system | Gemini Enterprise Agent Platform | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/cloud-storage-file-system
