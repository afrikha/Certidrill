id: gcppca-2b-cloud-run-jobs-batch
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company has a containerized script that reconciles booking records every night. The work splits into 200 independent chunks that can run in parallel, each chunk takes up to 2 hours, and the container does not serve any HTTP requests. The company wants a serverless platform with no cluster or VM to manage.

    Which Google Cloud product should you use?
body:
  options:
    - id: a
      text:
        en: |-
          A Cloud Run service whose request timeout is set to the maximum, called once for each chunk.
    - id: b
      text:
        en: |-
          A Cloud Run function with a Pub/Sub trigger that receives one message for each chunk.
    - id: c
      text:
        en: |-
          A Cloud Run job with 200 tasks that reads the CLOUD_RUN_TASK_INDEX variable to pick its chunk.
    - id: d
      text:
        en: |-
          A Cloud Run worker pool with 200 instances that each pull one chunk from a queue.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Cloud Run jobs run containers to completion without serving requests. A job execution can contain many tasks that run in parallel, each reading its index from CLOUD_RUN_TASK_INDEX, and a task can run for up to 168 hours, so 2-hour chunks fit.
  options:
    a:
      en: |-
        A service must answer HTTP requests, and a request can last at most 60 minutes, shorter than a 2-hour chunk.
    b:
      en: |-
        Event-driven Cloud Run functions have a maximum timeout of 9 minutes, far shorter than a 2-hour chunk.
    d:
      en: |-
        Worker pools run continuous background work with no completion; the team would have to build the queue and stop the instances when the chunks are done.
references:
  - title: Create jobs | Cloud Run | Google Cloud Documentation
    url: https://docs.cloud.google.com/run/docs/create-jobs
  - title: Compare Cloud Run functions | Google Cloud Documentation
    url: https://docs.cloud.google.com/run/docs/functions/comparison
