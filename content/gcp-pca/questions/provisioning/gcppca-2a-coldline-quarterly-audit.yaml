id: gcppca-2a-coldline-quarterly-audit
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An accounting firm stores scanned ledgers in Cloud Storage and must keep them for three years. Each quarter, an audit job reads the whole dataset once; otherwise nobody reads the files. Reads must return within milliseconds.

    Which storage class should you use to minimize total cost, including retrieval?
body:
  options:
    - { id: a, text: { en: "Standard storage" } }
    - { id: b, text: { en: "Nearline storage" } }
    - { id: c, text: { en: "Coldline storage" } }
    - { id: d, text: { en: "Archive storage" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Coldline storage targets data read at most about once a quarter, with a 90-day minimum storage duration that the three-year retention easily meets. Its storage price is lower than Nearline's, and its retrieval fee is lower than Archive's, which matters because the full dataset is read four times a year.
  options:
    a: { en: "Standard has no retrieval fee but the highest storage price, which is wasted on data read only four times a year." }
    b: { en: "Nearline suits data read about once a month; for quarterly reads its higher storage price costs more than Coldline." }
    d: { en: "Archive suits data read less than once a year; reading the full dataset every quarter makes its higher retrieval fees outweigh the cheaper storage." }
references:
  - title: Storage classes
    url: https://docs.cloud.google.com/storage/docs/storage-classes
