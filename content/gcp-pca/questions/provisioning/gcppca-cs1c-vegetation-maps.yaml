id: gcppca-cs1c-vegetation-maps
objective: "2.3.6"
type: single
caseStudy: gcppca-cs1c-furrowline-agtech
difficulty: 1
status: draft
stem:
  en: |
    You need to replace the hourly script that computes the vegetation maps. The solution must meet the business and technical requirements for drone images.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Deploy a Cloud Run function in australia-southeast1 with an Eventarc trigger on the google.cloud.storage.object.v1.finalized event of the bucket." } }
    - { id: b, text: { en: "Create a Cloud Scheduler job that starts a Cloud Run job every 10 minutes to list the new objects of the bucket and process them." } }
    - { id: c, text: { en: "Deploy a Cloud Run function in australia-southeast1 with an Eventarc trigger on the google.cloud.storage.object.v1.metadataUpdated event of the bucket." } }
    - { id: d, text: { en: "Create a managed instance group that reads Pub/Sub notifications for Cloud Storage from the bucket and autoscales on the subscription backlog." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The finalized event fires when an object is created, so Eventarc invokes the function within seconds of each upload and the map is ready well within 3 minutes. Cloud Run functions scale with the number of uploads and down to zero when there are none, so nothing is paid for processing in winter, and no virtual machine or cluster is managed. Deploying the function in the bucket's region matches the location of the event source.
  options:
    b:
      en: A 10-minute schedule can deliver a map more than 3 minutes after its upload, and the job is started and billed every 10 minutes even when nothing is uploaded.
    c:
      en: The metadataUpdated event fires when the metadata of an existing object changes, not when a new image is uploaded.
    d:
      en: A managed instance group is a set of virtual machines to manage, which the technical requirements rule out for new workloads.
references:
  - title: Create triggers from Cloud Storage events
    url: https://docs.cloud.google.com/run/docs/triggering/storage-triggers
