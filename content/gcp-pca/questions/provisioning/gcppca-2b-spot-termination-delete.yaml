id: gcppca-2b-spot-termination-delete
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A genomics company runs a custom batch scheduler that creates individual Compute Engine Spot VMs, outside any managed instance group, to process sequencing files. Workers write their results to Cloud Storage and keep no state on disk. The finance team found many preempted workers left in the TERMINATED state with their boot disks still billed, and the scheduler always creates new workers instead of restarting old ones.

    How should the scheduler create the workers?
body:
  options:
    - id: a
      text:
        en: |-
          Add --provisioning-model=SPOT and --maintenance-policy=TERMINATE to the gcloud compute instances create command.
    - id: b
      text:
        en: |-
          Add --provisioning-model=SPOT and --no-restart-on-failure to the gcloud compute instances create command.
    - id: c
      text:
        en: |-
          Add --provisioning-model=SPOT and --instance-termination-action=DELETE to the gcloud compute instances create command.
    - id: d
      text:
        en: |-
          Add --provisioning-model=SPOT and --max-run-duration=2h to the gcloud compute instances create command.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The termination action decides what Compute Engine does with a preempted Spot VM: the default STOP leaves the VM in the TERMINATED state with its persistent disks still billed, while DELETE removes the VM. Because the workers are stateless and are never restarted, DELETE removes the leftover VMs and their boot disks without a cleanup job.
  options:
    a:
      en: |-
        The maintenance policy controls host maintenance behavior; it does not change what happens to a preempted Spot VM, which is still stopped by default.
    b:
      en: |-
        Spot VMs already cannot restart automatically; this flag does not delete preempted VMs, so their disks are still billed.
    d:
      en: |-
        A run-time limit with the default stop action stops the VM at the limit and keeps its disks, and it does not change the stop action used at preemption.
references:
  - title: Spot VMs | Compute Engine | Google Cloud Documentation
    url: https://docs.cloud.google.com/compute/docs/instances/spot
  - title: Limit the run time of a VM | Compute Engine | Google Cloud Documentation
    url: https://docs.cloud.google.com/compute/docs/instances/limit-vm-runtime
