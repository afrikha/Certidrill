id: gcppca-2a-sole-tenant-byol-migrate
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An engineering firm is moving a licensed simulation application to Compute Engine and will bring its existing licenses, which are counted per physical core. The licensor requires the VMs to run on dedicated hardware and to stay on a known, fixed set of physical servers. The application is business-critical and must not be stopped for host maintenance.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Run the VMs on a sole-tenant node group that uses the default maintenance policy." } }
    - { id: b, text: { en: "Run the VMs on a sole-tenant node group with the restart in place maintenance policy." } }
    - { id: c, text: { en: "Run the VMs on standard VMs with a resource-based committed use discount for the vCPUs." } }
    - { id: d, text: { en: "Run the VMs on a sole-tenant node group with the migrate within node group maintenance policy." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Sole-tenant nodes are physical servers dedicated to your project, which suits per-core licenses. The migrate within node group maintenance policy live-migrates VMs during maintenance without downtime, while keeping them within the fixed pool of servers of the node group; Compute Engine keeps holdback nodes for this purpose.
  options:
    a: { en: "With the default policy, VMs can live-migrate to any server, so they do not stay on a fixed set of physical servers." }
    b: { en: "Restart in place keeps VMs on the same server but stops them for about an hour during maintenance." }
    c: { en: "Standard VMs run on shared hardware, which the licensor forbids; a discount changes price, not tenancy." }
references:
  - title: Sole-tenancy overview
    url: https://docs.cloud.google.com/compute/docs/nodes/sole-tenant-nodes
