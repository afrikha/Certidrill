id: gcppca-cs5c-outage-map
objective: "2.1.4"
type: multi
caseStudy: gcppca-cs5c-ashgrove-power
difficulty: 2
status: draft
stem:
  en: |
    You need to change the outage map architecture. The design must meet the business requirement about the outage map and the technical requirement about the OMS API.

    Which two actions should you take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable Cloud CDN on the backend service of the outage map, and have the Cloud Run service return the page with a Cache-Control header of public, max-age=60." } }
    - { id: b, text: { en: "Set a minimum number of Cloud Run instances high enough for storm traffic, and raise the maximum number of instances of the service." } }
    - { id: c, text: { en: "Enable Cloud CDN on the backend service of the outage map in FORCE_CACHE_ALL cache mode with a default TTL of one hour." } }
    - { id: d, text: { en: "Set the serve-while-stale option of the backend service's Cloud CDN policy to 1,800 seconds." } }
    - { id: e, text: { en: "Add a Cloud Armor rate-based ban rule on the load balancer that bans client IP addresses sending more than 60 requests per minute to the outage map." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      With Cloud CDN, the caches answer the page views, and the Cloud Run service, and therefore the OMS API, is called only when a cached copy has expired, whatever the storm traffic; max-age=60 keeps the map no more than one minute old. The serve-while-stale setting lets Cloud CDN keep serving the expired page for up to 1,800 seconds when the origin is unreachable or returns errors, so the map stays available while the OMS API fails for up to 30 minutes.
  options:
    b:
      en: More Cloud Run instances send even more calls to the OMS API, which was the component that failed, and they cannot show the map while the OMS API returns errors.
    c:
      en: A one-hour TTL lets the map show data up to an hour old in normal operation, which breaks the one-minute requirement.
    e:
      en: Banning busy IP addresses blocks real customers, for example many people behind the same mobile carrier address, and it does not keep the map available when the OMS API fails.
references:
  - title: Serve stale content
    url: https://docs.cloud.google.com/cdn/docs/serving-stale-content
