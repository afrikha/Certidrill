id: gcppca-2b-model-garden-org-policy
objective: "2.5.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A government contractor has hundreds of projects that use Gemini Enterprise Agent Platform. Its compliance office approved a short list of Model Garden models, including some partner models and some open models. Developers in every project, including projects created later, must be unable to use any other Model Garden model, while they keep using the approved ones. The control must be managed centrally.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Remove the Agent Platform User role from all developers in every project of the organization.
    - id: b
      text:
        en: |-
          Set a Model Garden organization policy at the organization node that allows only the approved models.
    - id: c
      text:
        en: |-
          Create a VPC Service Controls perimeter around all projects and restrict the Agent Platform API in it.
    - id: d
      text:
        en: |-
          Grant the Consumer Procurement Entitlement Manager role only to the compliance office in each project.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Model Garden organization policy controls access to specific models and can be set at the organization, folder or project level. Set at the organization node, it is inherited by every existing and future project, and it allows the approved models while blocking the others.
  options:
    a:
      en: |-
        Removing the Agent Platform User role stops developers from sending prompts to any model, including the approved ones.
    c:
      en: |-
        VPC Service Controls protect against data exfiltration across a perimeter; they do not choose which models developers can use.
    d:
      en: |-
        That role controls who can enable partner models; it does not block open models, and assigning it project by project is not central control.
references:
  - title: Overview of Model Garden | Gemini Enterprise Agent Platform | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-garden/explore-models
