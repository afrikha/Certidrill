id: gcppca-2a-cloudsql-storage-limit
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An events company runs Cloud SQL for MySQL with 300 GB of storage. Data grows unpredictably during ticket sales, and last year the disk filled up and caused an outage. Finance requires that storage never exceed 2 TB without a review, and the team does not want to pay for unused capacity in advance.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Increase the storage capacity to 2 TB now and disable automatic storage increase." } }
    - { id: b, text: { en: "Disable automatic storage increase, and create an alert that notifies the team when disk usage exceeds 80%." } }
    - { id: c, text: { en: "Keep automatic storage increase enabled, and set its storage increase limit to 2,048 GB." } }
    - { id: d, text: { en: "Upgrade the instance to the Enterprise Plus edition to enable the data cache." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Automatic storage increase, on by default, adds capacity when free space falls below a threshold, which prevents the instance from running out of disk. Its storage increase limit caps the size that automatic increases can reach; by default the only limit is the maximum for the instance.
  options:
    a: { en: "Provisioning 2 TB now pays for capacity long before it is needed, which finance wants to avoid." }
    b: { en: "An alert still depends on someone reacting in time, which is how last year's outage happened." }
    d: { en: "The data cache improves read performance; it does nothing about storage growth." }
references:
  - title: About instance settings
    url: https://docs.cloud.google.com/sql/docs/mysql/instance-settings
