id: gcppca-cs6b-article-caching
objective: "2.1.4"
type: multi
caseStudy: gcppca-cs6b-harbourline-news
difficulty: 3
status: draft
stem:
  en: |
    Cloud CDN is enabled on the backend service of the CMS with the default cache mode, `CACHE_ALL_STATIC`. You need to complete the caching design so that it meets the business requirements for the sites and for subscribers' personal information.

    Which two actions should you take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Have the CMS return `Cache-Control: public, max-age=60` on article pages, and have the account API return `Cache-Control: private`." } }
    - { id: b, text: { en: "Set the serve-while-stale period of the backend service, so that Cloud CDN serves expired articles while it revalidates them with the CMS." } }
    - { id: c, text: { en: "Switch the backend service to the `FORCE_CACHE_ALL` cache mode with a default TTL of one hour, so that every successful response is cached." } }
    - { id: d, text: { en: "Invalidate the `/*` path of the site after each publication, so that readers see new articles and corrections without delay." } }
    - { id: e, text: { en: "Disable request coalescing on the backend service, so that each cache miss on a popular article fetches the latest version from the CMS." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      In `CACHE_ALL_STATIC` mode, HTML responses are cached only when the origin sends valid caching directives, so the CMS must mark article pages as public with a 60-second lifetime, which absorbs breaking-news traffic at the edge and lets corrections expire within the 2-minute target. The account API marks its responses as private, so the personal header is never cached. With serve-while-stale, Cloud CDN keeps serving an expired copy while it revalidates the article in the background, so readers keep getting articles that are already cached during a short CMS outage, and request coalescing, enabled by default, sends one fill request per edge for each popular article.
  options:
    c:
      en: "`FORCE_CACHE_ALL` ignores the origin's directives and can cache private, per-user responses such as the account API's, and a one-hour TTL keeps uncorrected articles at the edge far beyond 2 minutes."
    d:
      en: Invalidating the whole site about 40 times an hour empties the cache each time and sends the traffic back to the CMS; the documentation recommends invalidating everything only when necessary.
    e:
      en: Request coalescing protects the CMS by combining simultaneous cache fills for the same article; disabling it multiplies the requests that reach the CMS during a traffic peak.
references:
  - title: Caching overview
    url: https://docs.cloud.google.com/cdn/docs/caching
  - title: Serve stale content
    url: https://docs.cloud.google.com/cdn/docs/serving-stale-content
