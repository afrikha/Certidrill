id: gcppca-cs1b-interconnect-topology
objective: "2.1.1"
type: single
caseStudy: gcppca-cs1b-halden-mutual
difficulty: 3
status: draft
stem:
  en: |
    You need to design the connectivity between the on-premises network and the production VPC network in Google Cloud. The design must meet the technical requirements for connectivity.

    Which topology should you recommend?
body:
  options:
    - { id: a, text: { en: "Two Dedicated Interconnect connections in one metropolitan area, one in each edge availability domain, with their VLAN attachments in europe-west3 and one Cloud Router in that region" } }
    - { id: b, text: { en: "Four Dedicated Interconnect connections in one metropolitan area, ordered as a connection group for a production-critical topology, with their VLAN attachments in europe-west3 and one Cloud Router in that region" } }
    - { id: c, text: { en: "Four Dedicated Interconnect connections, two in each metropolitan area and one in each edge availability domain, with VLAN attachments in europe-west3 and europe-west4, a Cloud Router in each region, and global dynamic routing" } }
    - { id: d, text: { en: "Two Dedicated Interconnect connections, one in each metropolitan area, with VLAN attachments in europe-west3, and HA VPN tunnels to europe-west4 as a backup path" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The 99.99 % topology that spans two regions requires at least four Dedicated Interconnect connections in two metropolitan areas, with connections in both edge availability domains of each metro, VLAN attachments in two regions, one Cloud Router per region and a VPC network in global dynamic routing mode. Because each metro has its own pair of connections, losing every connection of one metro leaves the other metro's pair working, and no traffic crosses the public internet.
  options:
    a:
      en: Two connections in one metro do not reach the 99.99 % topology, and the loss of that metro cuts all connectivity.
    b:
      en: Four connections in a single metro can reach 99.99 %, but all of them depend on one metropolitan area, so its loss cuts all connectivity.
    d:
      en: HA VPN tunnels cross the public internet, and two connections without redundancy inside each metro do not meet the 99.99 % topology requirements.
references:
  - title: Establish 99.99% availability for Dedicated Interconnect
    url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/tutorials/dedicated-creating-9999-availability
