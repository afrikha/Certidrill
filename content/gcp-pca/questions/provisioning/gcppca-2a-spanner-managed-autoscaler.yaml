id: gcppca-2a-spanner-managed-autoscaler
objective: "2.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments platform runs a regional Spanner instance in the Enterprise edition with 3 nodes and 6 TiB of data. Data grows by about 1 TiB per month, and traffic peaks unpredictably during promotions. The platform team wants compute capacity to follow both CPU load and data growth, with a hard upper bound, and does not want to deploy or maintain any scaling tooling.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Deploy the open-source Spanner Autoscaler on Cloud Run functions, triggered by Cloud Scheduler, with CPU and storage thresholds." } }
    - { id: b, text: { en: "Set the instance to the node count needed for the expected peak load and the data volume projected for next year." } }
    - { id: c, text: { en: "Migrate the database to Cloud SQL Enterprise Plus edition with automatic storage increase enabled." } }
    - { id: d, text: { en: "Enable the managed autoscaler with minimum and maximum node limits, a high-priority CPU utilization target and a storage utilization target." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Spanner managed autoscaler, available in the Enterprise and Enterprise Plus editions, adds or removes capacity between a minimum and a maximum limit. It scales on a high-priority CPU utilization target and on a storage utilization target, so capacity follows both load and data growth, and Spanner runs it with no tooling to deploy. The maximum can be at most ten times the minimum.
  options:
    a: { en: "The open-source autoscaler works but is tooling the team must deploy, secure and maintain, which the requirement rules out." }
    b: { en: "Static capacity sized for a projected peak pays for unused nodes most of the time and still does not react to unexpected peaks." }
    c: { en: "Cloud SQL scales writes on a single primary instance, and a migration is a far larger change than enabling autoscaling." }
references:
  - title: Managed autoscaler
    url: https://docs.cloud.google.com/spanner/docs/managed-autoscaler
