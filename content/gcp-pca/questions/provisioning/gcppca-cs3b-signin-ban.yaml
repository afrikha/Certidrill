id: gcppca-cs3b-signin-ban
objective: "2.1.3"
type: single
caseStudy: gcppca-cs3b-norvale-revenue
difficulty: 2
status: draft
stem:
  en: |
    You need to protect the sign-in page of the e-filing portal. The protection must meet the business requirement about sign-in attacks and the technical requirement for the sign-in page.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Add a Cloud Armor rule for the sign-in path with the throttle action, enforced on the IP key, with a threshold of 60 requests per 60 seconds and a deny exceed action." } }
    - { id: b, text: { en: "Enable Cloud Armor Adaptive Protection on the security policy of the portal's backend service, and alert the security team when it detects an attack." } }
    - { id: c, text: { en: "Add a Cloud Armor rule for the sign-in path with the rate-based ban action, enforced on the IP key, with a threshold of 60 requests per 60 seconds and a ban duration of 1,800 seconds." } }
    - { id: d, text: { en: "Create a hierarchical firewall policy that denies the IP addresses that a scheduled Cloud Logging query finds with more than 60 sign-in requests in one minute." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Cloud Armor rule with the rate-based ban action, attached to the security policy of the load balancer's backend service, is enforced at the edge of Google's network. A client whose IP address exceeds the threshold has all its further requests blocked for the ban duration, here 30 minutes, while the other clients are not affected.
  options:
    a:
      en: Throttling only rejects the requests above the threshold and lets the client send again as soon as its rate drops; it does not block the client for 30 minutes.
    b:
      en: Adaptive Protection detects suspected attacks and suggests rules, but it does not enforce the fixed per-IP threshold and ban that the requirement states.
    d:
      en: Firewall rules filter traffic at the VPC network level, not the requests that the external Application Load Balancer proxies to the portal, and a scheduled query reacts minutes after the attack starts.
references:
  - title: Rate limiting overview
    url: https://docs.cloud.google.com/armor/docs/rate-limiting-overview
