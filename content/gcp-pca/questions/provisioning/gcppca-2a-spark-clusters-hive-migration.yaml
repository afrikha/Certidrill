id: gcppca-2a-spark-clusters-hive-migration
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A telecom operator is migrating an on-premises Hadoop platform. Its nightly jobs combine Spark with Hive and Pig scripts and run for about three hours. The operator wants to move them with minimal code changes and avoid paying for compute during the rest of the day. The data will be stored in Cloud Storage.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Create a Managed Service for Apache Spark cluster for each nightly run, run the jobs against Cloud Storage, and delete the cluster when they finish." } }
    - { id: b, text: { en: "Run the nightly jobs as serverless batch workloads of Managed Service for Apache Spark." } }
    - { id: c, text: { en: "Create a Managed Service for Apache Spark cluster that runs all day, and store the data in HDFS on its persistent disks." } }
    - { id: d, text: { en: "Rewrite the Hive and Pig scripts as Apache Beam pipelines and run them on Dataflow." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The cluster deployment of Managed Service for Apache Spark (formerly Dataproc on Compute Engine) runs Spark together with Hadoop ecosystem tools such as Hive and Pig, which suits migrations of existing Hadoop workloads. Keeping the data in Cloud Storage separates storage from compute, so a cluster can be created for each run and deleted afterward, and compute is paid only during the run.
  options:
    b: { en: "The serverless deployment runs only Spark workloads; the Hive and Pig scripts would have to be rewritten." }
    c: { en: "A cluster that runs all day is billed for the 21 idle hours, and data in HDFS disappears with the cluster, which prevents deleting it." }
    d: { en: "Rewriting every script in Apache Beam is the opposite of a migration with minimal code changes." }
references:
  - title: Compare Managed Service for Apache Spark serverless and cluster deployments
    url: https://docs.cloud.google.com/dataproc-serverless/docs/concepts/dataproc-compare
