id: gcppca-cs7c-fare-retention
objective: "2.2.5"
type: single
caseStudy: gcppca-cs7c-corrin-bay-transit
difficulty: 3
status: draft
stem:
  en: |
    You are designing the BigQuery tables of the ridership data warehouse. The design must meet the business requirement for fare records and daily ridership without a custom deletion job.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Store the tap records and the daily ridership table in one dataset, and set a default table expiration of 90 days on the dataset." } }
    - { id: b, text: { en: "Partition the tap records table by ingestion time, set a partition expiration of 90 days, and build the daily ridership table with a scheduled query." } }
    - { id: c, text: { en: "Set a table expiration of 90 days on the tap records table, and build the daily ridership table from it with a scheduled query." } }
    - { id: d, text: { en: "Partition the tap records table by day on the trip timestamp, set a partition expiration of 90 days, and build the daily ridership table with a scheduled query." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With time-unit column partitioning, each tap record lands in the partition of its trip date, even when the vehicle uploads it days later. A partition's expiration is calculated from its partition boundary, so each day of trips expires 90 days after that day and is then deleted by BigQuery without any job to maintain. The daily ridership table has no expiration, so the aggregates are kept indefinitely.
  options:
    a:
      en: A default table expiration applies to new tables and deletes each whole table 90 days after it is created, including the daily ridership table that must be kept.
    b:
      en: Ingestion-time partitioning assigns rows by the time BigQuery ingests them, so records uploaded up to five days after the trip would be deleted up to five days later than 90 days after the trip.
    c:
      en: A table expiration deletes the whole tap records table at its expiration time, not each record 90 days after its trip, and it takes precedence over any partition expiration.
references:
  - title: Manage partitioned tables
    url: https://docs.cloud.google.com/bigquery/docs/managing-partitioned-tables
  - title: Introduction to partitioned tables
    url: https://docs.cloud.google.com/bigquery/docs/partitioned-tables
