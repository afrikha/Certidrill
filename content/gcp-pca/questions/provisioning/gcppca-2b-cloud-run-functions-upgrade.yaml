id: gcppca-2b-cloud-run-functions-upgrade
objective: "2.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An accounting firm runs an HTTP-triggered report generator on Cloud Run functions (1st gen). Some reports now take 25 minutes and fail at the 9-minute timeout. Traffic spikes at month end create thousands of instances, because each instance handles one request at a time, and the cost of cold starts is growing. The firm plans to redeploy the function as a Cloud Run function.

    Which two capabilities of Cloud Run functions address these issues? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          HTTP functions can have a timeout of up to 60 minutes.
    - id: b
      text:
        en: |-
          Event-driven functions can have a timeout of up to 60 minutes.
    - id: c
      text:
        en: |-
          Eventarc triggers can receive events from more than 90 sources through Cloud Audit Logs.
    - id: d
      text:
        en: |-
          A single instance can process up to 1,000 concurrent requests.
    - id: e
      text:
        en: |-
          Traffic can be split between function revisions for gradual rollouts.
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      Cloud Run functions allow HTTP functions to run for up to 60 minutes, which covers the 25-minute reports, compared with 9 minutes for 1st gen. They also process up to 1,000 concurrent requests per instance instead of one, so month-end spikes need far fewer instances and fewer cold starts.
  options:
    b:
      en: |-
        Event-driven Cloud Run functions keep a 9-minute maximum timeout, and the report generator is HTTP-triggered anyway.
    c:
      en: |-
        Broader event sources are a real improvement, but the function is HTTP-triggered, so this does not fix the timeout or the instance count.
    e:
      en: |-
        Traffic splitting is supported, but it helps with safe rollouts, not with long reports or the number of instances.
references:
  - title: Compare Cloud Run functions | Google Cloud Documentation
    url: https://docs.cloud.google.com/run/docs/functions/comparison
