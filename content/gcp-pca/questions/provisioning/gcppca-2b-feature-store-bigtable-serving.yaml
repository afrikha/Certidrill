id: gcppca-2b-feature-store-bigtable-serving
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An e-commerce company computes customer features daily in BigQuery tables. It is building an online recommendation model that needs the latest feature values for any of 300 million customers with low latency at prediction time. The feature values change often, the model uses no embeddings, and the solution must remain supported for several years. The team wants to avoid building its own sync pipelines.

    What should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Register the BigQuery tables as feature groups in Feature Store, and serve feature views from an online store that uses Bigtable online serving.
    - id: b
      text:
        en: |-
          Register the BigQuery tables as feature groups in Feature Store, and serve feature views from an online store that uses optimized online serving.
    - id: c
      text:
        en: |-
          Have the prediction service query the BigQuery tables directly for each request, filtered by the customer ID.
    - id: d
      text:
        en: |-
          Build a Dataflow pipeline that copies the latest values from BigQuery into Memorystore after each daily refresh.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Feature Store on Gemini Enterprise Agent Platform uses the BigQuery tables as the offline store, and feature views sync the latest values to an online store with no pipeline to build. Bigtable online serving suits large data volumes that change often and does not support embeddings, which the model does not need.
  options:
    b:
      en: |-
        Optimized online serving is deprecated, with no new features after May 17, 2026 and a sunset on February 17, 2027, so it fails the long-term support requirement.
    c:
      en: |-
        BigQuery is an analytics warehouse; querying it for each prediction does not give low-latency online serving.
    d:
      en: |-
        A custom Dataflow pipeline and a Memorystore cache could serve features, but the team wants to avoid building and running sync pipelines.
references:
  - title: About Feature Store on Gemini Enterprise Agent Platform | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/featurestore/latest/overview
