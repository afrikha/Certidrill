id: gcppca-2b-spot-batch-render
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An animation studio renders frames every night on Compute Engine. Each frame is an independent task that takes about 10 minutes, and the render scheduler automatically resubmits any task whose VM disappears. The studio wants to reduce the compute cost of the nightly render as much as possible.

    Which provisioning approach should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Run the render workers as Spot VMs in a managed instance group so that preempted workers are recreated.
    - id: b
      text:
        en: |-
          Run the render workers on standard VMs and purchase a 3-year resource-based committed use discount for them.
    - id: c
      text:
        en: |-
          Run the render workers on sole-tenant nodes so that other customers cannot reclaim their capacity.
    - id: d
      text:
        en: |-
          Run the render workers as standard VMs with a custom machine type sized exactly to each render task.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Spot VMs use spare Compute Engine capacity at a deep discount and suit fault-tolerant batch work such as independent render tasks that can be retried. Compute Engine can preempt them at any time, which is acceptable here because the scheduler resubmits lost tasks. In a managed instance group, preempted Spot VMs are recreated when capacity becomes available again.
  options:
    b:
      en: |-
        A 3-year commitment discounts standard VMs, but the workload runs only at night and is fault tolerant: Spot pricing is a much deeper discount without a long-term commitment.
    c:
      en: |-
        Sole-tenant nodes dedicate physical hosts to the project, which raises cost; they address isolation or licensing requirements, not cost reduction.
    d:
      en: |-
        A custom machine type avoids paying for unused vCPUs or memory, but standard on-demand pricing stays far above Spot pricing for a workload that tolerates interruptions.
references:
  - title: Spot VMs | Compute Engine | Google Cloud Documentation
    url: https://docs.cloud.google.com/compute/docs/instances/spot
