id: gcppca-2a-cloud-nat-static-ips
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A fintech company runs batch VMs without external IP addresses in a subnet in us-east1. The VMs must call a partner's API on the internet, and the partner allows connections only from two published IPv4 addresses. Security policy forbids external IP addresses on VMs and any unsolicited inbound connection from the internet.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Reserve two static external IP addresses and assign them to two VMs that act as forward proxies for the other VMs." } }
    - { id: b, text: { en: "Enable Private Google Access on the subnet, and route the partner's address range to the default internet gateway." } }
    - { id: c, text: { en: "Create a Private NAT gateway on a Cloud Router in us-east1 that serves the subnet." } }
    - { id: d, text: { en: "Create a Public NAT gateway on a Cloud Router in us-east1 that serves the subnet, with manual allocation of two reserved static external IP addresses." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Public NAT gateway lets VMs without external IPv4 addresses reach internet destinations through shared external addresses. With manual NAT IP allocation, the gateway uses the reserved static addresses that the partner allow-lists. Cloud NAT translates only responses to connections that the VMs start, and does not allow unsolicited inbound connections.
  options:
    a: { en: "The proxy VMs would carry external IP addresses, which the security policy forbids, and they add VMs to operate." }
    b: { en: "Private Google Access only reaches Google APIs and services; it does not give VMs without external IP addresses access to a third-party API on the internet." }
    c: { en: "Private NAT translates traffic between private networks (VPC, on-premises or other clouds); it does not provide internet access." }
references:
  - title: Cloud NAT overview
    url: https://docs.cloud.google.com/nat/docs/overview
