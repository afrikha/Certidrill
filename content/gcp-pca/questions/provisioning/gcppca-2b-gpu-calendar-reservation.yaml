id: gcppca-2b-gpu-calendar-reservation
objective: "2.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A research lab plans to pre-train a model on a cluster of 64 GPU VMs for six weeks, starting on a fixed date next quarter when its funding begins. The run cannot be interrupted, and the lab must be sure that the capacity will be available on the start date. The lab does not want to commit to the GPUs beyond the six weeks.

    Which consumption option should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          Request Flex-start VMs on the start date and resubmit the request every week.
    - id: b
      text:
        en: |-
          Create a future reservation in calendar mode for 64 VMs covering the six weeks.
    - id: c
      text:
        en: |-
          Create Spot VMs on the start date in a managed instance group with autohealing.
    - id: d
      text:
        en: |-
          Create on-demand VMs on the start date and keep them running for six weeks.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Future reservations in calendar mode reserve up to 80 VMs for up to 90 days, starting at a time you choose, with very high obtainability and a discount. They are designed for clustered GPU workloads that need reserved capacity, and the lab pays only for the reserved period.
  options:
    a:
      en: |-
        Flex-start runs last at most seven days and capacity is best effort, so the six-week run would be split and the start date is not assured.
    c:
      en: |-
        Spot VMs can be preempted at any time, and their capacity is best effort, which fails both requirements.
    d:
      en: |-
        On-demand capacity is best effort, so the 64 VMs might not be obtainable on the start date.
references:
  - title: Consumption options for AI Hypercomputer | Google Cloud Documentation
    url: https://docs.cloud.google.com/ai-hypercomputer/docs/consumption-models
