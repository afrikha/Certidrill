id: gcppca-2a-secure-tags-firewall
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retailer's security team owns the firewall configuration of a VPC network. A rule must allow HTTPS from the load balancer health check ranges to the web servers only. The operations team must decide which VMs are web servers, but must not be able to change the rule itself.

    Developers have the Compute Instance Admin role on the same project, and auditors found that developers had added the network tag used by the current rule to their test VMs to make them reachable. This must no longer be possible.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Write the rule in a global network firewall policy that targets a secure tag with the GCE_FIREWALL purpose, and grant the operations team the Tag User role on the tag value." } }
    - { id: b, text: { en: "Write the rule as a VPC firewall rule that targets a secure tag with the GCE_FIREWALL purpose, and grant the operations team the Tag User role on the tag value." } }
    - { id: c, text: { en: "Write the rule as a VPC firewall rule that targets the network tag web-server, and grant the operations team the Compute Security Admin role." } }
    - { id: d, text: { en: "Write the rule in a global network firewall policy that targets a secure tag, and grant the operations team the Compute Security Admin role on the project." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Secure tags are Resource Manager tags governed by IAM: only principals with the Tag User role on a tag value can bind it to a VM, unlike network tags, which are plain strings with no access control. The tag key needs the `GCE_FIREWALL` purpose, and secure tags are supported by hierarchical, global network and regional network firewall policies. Tag User can be granted without Compute Security Admin, so operations controls membership but not the rule.
  options:
    b: { en: "VPC firewall rules do not support secure tags; only firewall policies can use them." }
    c: { en: "Network tags have no access control, so developers with instance admin rights could keep tagging their VMs, and Compute Security Admin would let operations modify the rule." }
    d: { en: "Compute Security Admin lets the operations team modify firewall rules and policies, which the requirement forbids." }
references:
  - title: Secure tags for firewalls
    url: https://docs.cloud.google.com/firewall/docs/tags-firewalls-overview
