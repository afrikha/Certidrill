id: gcppca-2a-bq-policy-tags-ssn
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A lender stores loan applications in a single BigQuery table. Analysts in group analysts@ query all columns except national_id. Only the fraud team, group fraud@, may read national_id. Both groups already have BigQuery Data Viewer on the dataset.

    Governance forbids creating views or copies of the table for this purpose. What should you do?
body:
  options:
    - { id: a, text: { en: "Create a row-level access policy on the table that grants fraud@ access, and a second policy that grants analysts@ access." } }
    - { id: b, text: { en: "Create a taxonomy with a policy tag, attach it to national_id, enforce access control, and grant fraud@ the Fine-Grained Reader role on the policy tag." } }
    - { id: c, text: { en: "Create an authorized view without national_id for analysts@, and remove analysts@ from the dataset." } }
    - { id: d, text: { en: "Grant analysts@ BigQuery Data Viewer on the table with an IAM condition that excludes the national_id column." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Column-level access control uses policy tags from a taxonomy: once access control is enforced, only principals with the Fine-Grained Reader role (`roles/datacatalog.categoryFineGrainedReader`) on the tag can read tagged columns. Analysts can still query the other columns of the same table, without any view or copy.
  options:
    a: { en: "Row-level access policies filter rows, not columns, so they cannot hide national_id while showing the rest of a row." }
    c: { en: "An authorized view is exactly what governance forbids." }
    d: { en: "IAM conditions cannot restrict access to individual columns of a BigQuery table." }
references:
  - title: Introduction to column-level access control
    url: https://docs.cloud.google.com/bigquery/docs/column-level-security-intro
