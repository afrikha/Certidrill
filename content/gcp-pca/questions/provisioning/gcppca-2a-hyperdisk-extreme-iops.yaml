id: gcppca-2a-hyperdisk-extreme-iops
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A trading firm is moving a self-managed database to a Compute Engine VM whose machine series supports every Hyperdisk type. The data volume is 2 TiB and must sustain 250,000 IOPS on a single disk. The team wants to raise or lower provisioned performance later without changing the disk size.

    Which disk should you provision?
body:
  options:
    - { id: a, text: { en: "Hyperdisk Balanced, with 250,000 provisioned IOPS" } }
    - { id: b, text: { en: "Hyperdisk Extreme, with 250,000 provisioned IOPS" } }
    - { id: c, text: { en: "Hyperdisk Throughput, with provisioned throughput sized for 250,000 IOPS" } }
    - { id: d, text: { en: "Hyperdisk Balanced High Availability, with 250,000 provisioned IOPS" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Hyperdisk Extreme lets you provision IOPS (its throughput follows from them) up to 350,000 IOPS per volume, which covers 250,000 IOPS. Hyperdisk performance can be increased or decreased while the disk is in use, without changing its size.
  options:
    a: { en: "Hyperdisk Balanced tops out at 160,000 IOPS per volume." }
    c: { en: "Hyperdisk Throughput is provisioned by throughput for sequential workloads and reaches only 9,600 IOPS per volume." }
    d: { en: "Hyperdisk Balanced High Availability tops out at 100,000 IOPS per volume." }
references:
  - title: Google Cloud Hyperdisk overview
    url: https://docs.cloud.google.com/compute/docs/disks/hyperdisks
