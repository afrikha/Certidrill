id: gcppca-2b-gemini-enterprise-federation
objective: "2.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A law firm is connecting Microsoft SharePoint Online to Gemini Enterprise. Its data protection policy forbids copying SharePoint content into the index of any other system. Lawyers still want Gemini Enterprise to answer questions from SharePoint content, and the firm accepts that search quality may be lower than with an index.

    How should you connect SharePoint Online?
body:
  options:
    - id: a
      text:
        en: |-
          Use data ingestion with incremental syncs every 3 hours so that the content in the index stays current.
    - id: b
      text:
        en: |-
          Use data ingestion with a full sync scheduled each night so that deleted documents are removed from the index.
    - id: c
      text:
        en: |-
          Use data federation so that Gemini Enterprise retrieves the information directly from SharePoint Online.
    - id: d
      text:
        en: |-
          Export the SharePoint libraries to a Cloud Storage bucket protected with CMEK, and connect the bucket instead.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With data federation, Gemini Enterprise queries the source directly and does not copy the data into its index, which meets the policy. Because the data is not indexed, search quality may be lower, which the firm accepts; ingestion would give better results but copies the content.
  options:
    a:
      en: |-
        Ingestion copies the content into the Gemini Enterprise index, whatever the sync frequency, which the policy forbids.
    b:
      en: |-
        A full sync replaces the indexed content, but the content is still copied into the index, which the policy forbids.
    d:
      en: |-
        Exporting the libraries copies the content into another system, and connecting the bucket would index it again; CMEK does not change that.
references:
  - title: Introduction to connectors and data stores | Gemini Enterprise | Google Cloud Documentation
    url: https://docs.cloud.google.com/gemini/enterprise/docs/introduction-to-connectors-and-data-stores
