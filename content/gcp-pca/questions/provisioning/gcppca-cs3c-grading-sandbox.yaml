id: gcppca-cs3c-grading-sandbox
objective: "2.3.5"
type: single
caseStudy: gcppca-cs3c-lanternhall-learning
difficulty: 2
status: draft
stem:
  en: |
    You are designing where the new code grading service runs. The design must meet the business requirement for grading results and the technical requirements for submitted code and for the grading service.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Add a node pool of Shielded GKE Nodes with Secure Boot to the existing Standard clusters, and schedule the grading Jobs on that node pool." } }
    - { id: b, text: { en: "Run the grading Jobs on a GKE Autopilot cluster, and set the gvisor runtime class in the Pod template of the Jobs." } }
    - { id: c, text: { en: "Run the grading Jobs in a dedicated namespace of the existing Standard clusters, with a default-deny network policy and the Restricted Pod Security Standard." } }
    - { id: d, text: { en: "Run the grading Jobs on a GKE Autopilot cluster, and give the Pods a Kubernetes service account that has no IAM role through Workload Identity Federation for GKE." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      GKE Sandbox runs each Pod in a gVisor sandbox with a userspace kernel that intercepts system calls, so untrusted submissions have only limited direct access to the host kernel. gVisor is enabled by default in Autopilot clusters, so the Jobs only need the gvisor runtime class, while Google manages the nodes and the platform team keeps its Helm charts. Submissions run as Pods on nodes that Google provisions, instead of a new VM for each submission.
  options:
    a:
      en: Shielded GKE Nodes protect the integrity of the node's boot chain; they do not isolate containers from the node's kernel, and the platform team would manage another node pool.
    c:
      en: Network policies and Pod Security Standards restrict network access and Pod privileges, but the code still makes system calls directly to the node's kernel, and the team still manages the nodes.
    d:
      en: Removing IAM roles limits what the code can do in Google Cloud, but it does not isolate the code from the kernel of the node that runs it.
references:
  - title: GKE Sandbox
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/sandbox-pods
