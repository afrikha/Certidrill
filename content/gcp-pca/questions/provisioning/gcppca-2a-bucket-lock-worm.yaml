id: gcppca-2a-bucket-lock-worm
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A broker-dealer must store trade confirmations in Cloud Storage in a write-once, read-many form for six years. No one, including project owners and organization administrators, may delete an object or shorten the retention period before it expires.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Set a six-year retention policy on the bucket and leave it unlocked so that it can be extended later." } }
    - { id: b, text: { en: "Enable Object Versioning and set the soft delete retention duration to its maximum value." } }
    - { id: c, text: { en: "Set a six-year retention policy on the bucket and lock it." } }
    - { id: d, text: { en: "Create an IAM deny policy that denies storage.objects.delete on the bucket to all principals." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A bucket retention policy prevents deleting or replacing an object until it reaches the retention period. Locking the policy with Bucket Lock is irreversible: the policy can no longer be removed or shortened, only lengthened, and the bucket cannot be deleted until all objects meet the retention period.
  options:
    a: { en: "An unlocked retention policy can be removed or reduced by anyone with permission to update the bucket." }
    b: { en: "Soft delete keeps deleted objects for at most 90 days and does not stop deletion, so it cannot protect data for six years." }
    d: { en: "Administrators who manage IAM can remove or change a deny policy, so it does not make the data immutable." }
references:
  - title: Bucket Lock
    url: https://docs.cloud.google.com/storage/docs/bucket-lock
