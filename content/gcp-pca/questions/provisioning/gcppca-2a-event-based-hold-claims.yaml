id: gcppca-2a-event-based-hold-claims
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An insurer stores claim documents in a Cloud Storage bucket that has a seven-year retention policy. Regulations require that a document cannot be deleted while its claim is open and for seven years after the claim closes. Claims stay open for anywhere from a week to several years, and the claims system knows when each claim closes.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Enable default event-based holds on the bucket, and have the claims system release the hold on a claim's documents when the claim closes." } }
    - { id: b, text: { en: "Have the claims system place a temporary hold on each new document and release it when the claim closes." } }
    - { id: c, text: { en: "Lock the bucket's seven-year retention policy so that it can no longer be shortened or removed." } }
    - { id: d, text: { en: "Set each document's Custom-Time to the closure date and add a lifecycle rule that deletes objects seven years after their Custom-Time." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With a default event-based hold, every new object is held and cannot be deleted while the claim is open. When an event-based hold is released in a bucket that has a retention policy, the object's retention period starts again from the release, so each document is kept for seven years after its claim closes.
  options:
    b: { en: "Releasing a temporary hold does not restart the retention clock, so a document uploaded years before closure could be deleted shortly after the claim closes." }
    c: { en: "The retention period counts from the object's creation, so documents of claims that stay open for years could be deleted less than seven years after closure." }
    d: { en: "A lifecycle rule only deletes objects; it does not prevent anyone from deleting a document earlier." }
references:
  - title: Object holds
    url: https://docs.cloud.google.com/storage/docs/object-holds
