id: gcppca-2a-bq-partition-cluster-growth
objective: "2.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A subscription business keeps clickstream data in a single unpartitioned BigQuery table of 40 TB that grows by 2 TB per month. Almost every query filters on a range of event_date values and on one customer_id. The company uses on-demand pricing and wants to cut the bytes these queries process as the table grows, while keeping all history in a single table.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Split the data into daily tables named events_YYYYMMDD and query them with a wildcard table." } }
    - { id: b, text: { en: "Partition the table by day on the event_date column." } }
    - { id: c, text: { en: "Purchase a slot reservation and assign the project to it." } }
    - { id: d, text: { en: "Cluster the table on the customer_id column." } }
    - { id: e, text: { en: "Set a partition expiration of 400 days on the table." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Partitioning on event_date lets BigQuery skip every partition outside the queried date range. Clustering on customer_id sorts the storage blocks inside each partition, so a filter on one customer reads only the relevant blocks. Together they keep the bytes processed small as the table grows, in one table.
  options:
    a: { en: "Date-named tables break the single-table requirement and add per-table metadata and management overhead." }
    c: { en: "A reservation changes how compute is billed but does not reduce the bytes that each query reads." }
    e: { en: "Partition expiration deletes old partitions, which violates the requirement to keep all history." }
references:
  - title: Introduction to partitioned tables
    url: https://docs.cloud.google.com/bigquery/docs/partitioned-tables
  - title: Introduction to clustered tables
    url: https://docs.cloud.google.com/bigquery/docs/clustered-tables
