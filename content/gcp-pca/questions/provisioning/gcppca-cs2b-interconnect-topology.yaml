id: gcppca-cs2b-interconnect-topology
objective: "2.1.1"
type: single
caseStudy: gcppca-cs2b-laurentide
difficulty: 3
status: draft
stem:
  en: |
    You are designing the connectivity between Laurentide's datacenters and its Shared VPC network in Google Cloud. The design must meet the hybrid connectivity requirements.

    Which design should you recommend?
body:
  options:
    - id: a
      text: { en: "Order four 10-Gbps Dedicated Interconnect connections in the Toronto metro in an interconnect connection group for production-critical topology, split across both edge availability domains, with VLAN attachments in northamerica-northeast2." }
    - id: b
      text: { en: "Order two 10-Gbps Dedicated Interconnect connections in each of the Montréal and Toronto metros, one in each edge availability domain, with VLAN attachments and a Cloud Router in each region and global dynamic routing." }
    - id: c
      text: { en: "Order two 10-Gbps Dedicated Interconnect connections in the Montréal metro, one in each edge availability domain, with VLAN attachments and a Cloud Router in northamerica-northeast1 and regional dynamic routing." }
    - id: d
      text: { en: "Create HA VPN gateways in both regions with two tunnels from each datacenter to each gateway over the internet, and Cloud Routers in each region with global dynamic routing." }
answer: { optionId: b }
explanation:
  correct:
    en: "The multi-region topology for 99.99 % availability with Dedicated Interconnect uses at least four connections, two in each of two metros and in both edge availability domains of each metro, with VLAN attachments in two regions, a Cloud Router in each region and global dynamic routing. Because the connections are spread over Montréal and Toronto, the loss of every connection in one metro leaves 20 Gbps available in the other."
  options:
    a: { en: "Four connections in one metro can qualify for 99.99 % with a production-critical connection group, but all of them fail together if the Toronto metropolitan area loses its connections." }
    c: { en: "Two connections in a single metro give the 99.9 % topology, not 99.99 %, and the bank loses all connectivity if the Montréal metro fails." }
    d: { en: "HA VPN tunnels traverse the public internet, which the requirements forbid, and each tunnel carries far less than the 20 Gbps the bank needs without many parallel tunnels." }
references:
  - title: Establish 99.99% availability for Dedicated Interconnect
    url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/tutorials/dedicated-creating-9999-availability
