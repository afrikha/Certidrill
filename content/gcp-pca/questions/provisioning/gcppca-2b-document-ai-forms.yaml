id: gcppca-2b-document-ai-forms
objective: "2.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A property management company receives thousands of scanned lease applications each week as PDF files. It needs the applicant name, address, income, and the answers to each form field extracted as structured key-value pairs and tables, then loaded into BigQuery. The company has no machine learning specialists.

    Which Google Cloud product should you use?
body:
  options:
    - id: a
      text:
        en: |-
          The Cloud Vision API with the DOCUMENT_TEXT_DETECTION feature.
    - id: b
      text:
        en: |-
          Document AI with a Form Parser processor.
    - id: c
      text:
        en: |-
          The Cloud Natural Language API with entity analysis.
    - id: d
      text:
        en: |-
          Cloud Translation Advanced with batch document translation.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Document AI turns unstructured documents into structured data without ML expertise. Its Form Parser extracts key-value pairs and tables from forms after OCR, and Document AI integrates with Cloud Storage and BigQuery.
  options:
    a:
      en: |-
        Document text detection performs OCR on dense text and PDFs, but it returns text and its layout, not the form's key-value pairs and tables.
    c:
      en: |-
        Entity analysis finds entities in text that you already have; it does not read scanned PDFs or map form fields to their values.
    d:
      en: |-
        Translation converts documents from one language to another; it does not extract structured data.
references:
  - title: Document AI overview | Google Cloud Documentation
    url: https://docs.cloud.google.com/document-ai/docs/overview
