id: gcppca-2a-mig-new-template-rollout
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company's managed instance group of 12 VMs uses the instance template web-v1. A new boot image with security patches must be rolled out to all existing VMs. The group must never have fewer than 12 VMs serving during the rollout.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Edit the web-v1 instance template to use the new image, and the group applies it to the existing VMs." } }
    - { id: b, text: { en: "Create a template web-v2 with the new image, and start a rolling update to web-v2 with maxSurge 3 and maxUnavailable 0." } }
    - { id: c, text: { en: "Create a template web-v2 with the new image, and set it on the group with an opportunistic update policy." } }
    - { id: d, text: { en: "Create a template web-v2 with the new image, and start a rolling update to web-v2 with maxUnavailable set to 100%." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Instance templates cannot be updated after creation, so the new image goes in a new template. A proactive rolling update (`gcloud compute instance-groups managed rolling-action start-update`) replaces the VMs; with maxUnavailable 0 and maxSurge above 0, old VMs are removed only after their replacements are running.
  options:
    a: { en: "Instance templates are immutable; you cannot edit web-v1." }
    c: { en: "An opportunistic update applies the template only to new or manually updated VMs, so the existing VMs keep the old image." }
    d: { en: "maxUnavailable 100% allows every VM to be taken down at once, which breaks the 12-VM minimum." }
references:
  - title: Automatically apply VM configuration updates in a MIG
    url: https://docs.cloud.google.com/compute/docs/instance-groups/rolling-out-updates-to-managed-instance-groups
  - title: Instance templates
    url: https://docs.cloud.google.com/compute/docs/instance-templates
