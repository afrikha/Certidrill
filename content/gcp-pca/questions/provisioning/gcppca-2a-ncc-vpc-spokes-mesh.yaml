id: gcppca-2a-ncc-vpc-spokes-mesh
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After an acquisition, a retailer has 14 custom mode VPC networks in different projects, some in its own organization and some in the acquired company's organization. Their subnet ranges do not overlap. Every network must be able to reach every other network over internal IP addresses.

    The solution must minimize ongoing operational overhead as more networks are added.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a hub VPC network and peer each of the 14 networks with it by using VPC Network Peering." } }
    - { id: b, text: { en: "Create a Network Connectivity Center hub with a mesh topology and add each network to it as a VPC spoke." } }
    - { id: c, text: { en: "Convert one project into a Shared VPC host project and attach the other projects as service projects." } }
    - { id: d, text: { en: "Create HA VPN gateways in every network and build a full mesh of HA VPN tunnels between the networks." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Network Connectivity Center VPC spokes exchange subnet routes through the hub, so workloads in every spoke network can reach each other, which VPC Network Peering cannot do transitively. Spokes can live in other projects and in other organizations, with the hub administrator approving each proposed spoke. Adding a network later means adding one spoke, not new pairwise links.
  options:
    a: { en: "VPC Network Peering is not transitive: the 14 networks would reach the hub network but not each other." }
    c: { en: "Shared VPC host and service projects must belong to the same organization, and attaching projects does not connect their existing VPC networks; resources would have to be recreated in the shared network." }
    d: { en: "A full mesh of 14 networks needs 91 network pairs of gateways, tunnels and BGP sessions, which maximizes operational overhead." }
references:
  - title: VPC spokes overview
    url: https://docs.cloud.google.com/network-connectivity/docs/network-connectivity-center/concepts/vpc-spokes-overview
