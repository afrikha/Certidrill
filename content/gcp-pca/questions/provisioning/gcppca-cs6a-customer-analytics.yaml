id: gcppca-cs6a-customer-analytics
objective: "2.2.3"
type: single
caseStudy: gcppca-cs6a-brindlewood-hr
difficulty: 2
status: draft
stem:
  en: |
    You are designing how analytics add-on customers access the shared BigQuery table of their jurisdiction. The design must meet the business requirement for the analytics add-on and the technical requirements.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Create a dataset for each add-on customer, copy the customer's rows into it with a scheduled query every 30 minutes, and grant the customer's group the BigQuery Data Viewer role on its dataset." } }
    - { id: b, text: { en: "Grant each add-on customer's group the BigQuery Data Viewer role on the shared table, and give each customer its tenant ID to add to the WHERE clause of the queries it runs from its own project." } }
    - { id: c, text: { en: "Grant each add-on customer's group the BigQuery Data Viewer role on the shared table, and create a row-level access policy per customer that grants its group and filters on its tenant ID; customers query from their own projects." } }
    - { id: d, text: { en: "Publish the dataset of the shared table as a listing in BigQuery sharing, and let each add-on customer subscribe to the listing and query the linked dataset from its own project." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A row-level access policy filters the rows of a table for the principals in its grantee list, and principals that no policy grants see no rows at all, so each customer's group sees only the rows with its own tenant ID. The customers query the single shared table, which is refreshed every 30 minutes, without a copy per customer, and the queries run in their own projects, which pay for them. Brindlewood keeps one policy with a filter that is always true for its own data team and pipelines.
  options:
    a:
      en: A copy of the data per customer breaks the technical requirement not to keep per-customer copies, and adds 180 scheduled queries and datasets to operate.
    b:
      en: The Data Viewer role on the table lets a customer read every row; a WHERE clause that the customer writes itself does not stop it from reading other customers' rows.
    d:
      en: A linked dataset exposes the whole shared table to every subscriber, so each customer could read the rows of all other customers.
references:
  - title: Introduction to BigQuery row-level security
    url: https://docs.cloud.google.com/bigquery/docs/row-level-security-intro
