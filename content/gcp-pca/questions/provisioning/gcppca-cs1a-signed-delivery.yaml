id: gcppca-cs1a-signed-delivery
objective: "2.1.4"
type: single
caseStudy: gcppca-cs1a-lumora-streaming
difficulty: 3
status: draft
stem:
  en: |
    You are configuring how Media CDN delivers licensed titles to the players. The configuration must meet the studio contracts and the technical requirements for delivery.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Grant allUsers the Storage Object Viewer role on the bucket so that Media CDN can fetch the content, require signed requests on the routes, and have the entitlement service issue a signed cookie for the title's URL prefix." } }
    - { id: b, text: { en: "Configure origin authentication so that Media CDN reads the private bucket with a service account, require signed requests on the routes with a keyset, and have the entitlement service issue a signed cookie for the title's URL prefix that expires after a few hours." } }
    - { id: c, text: { en: "Keep the bucket private, and have the entitlement service rewrite the manifest of each session so that every segment URL is a Cloud Storage signed URL that expires after a few hours." } }
    - { id: d, text: { en: "Configure origin authentication so that Media CDN reads the private bucket with a service account, and have the entitlement service return the Media CDN hostname only to the players of active subscribers." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With origin authentication, Media CDN reads a private Cloud Storage bucket through a service account, so the content is never public. When signed requests are required on a route, every request must carry a valid signature checked against the keyset; a signed cookie must carry a URL prefix, so one cookie covers the manifests and all the segments of the title, and its expiry makes shared links stop working. The segment URLs stay identical for all subscribers and are cached once.
  options:
    a:
      en: Granting allUsers read access makes the stored content publicly readable, which the studio contracts forbid.
    c:
      en: Per-session signed URLs put subscriber-specific values in every segment URL, so the segments are no longer cached once for all subscribers, and the players would read Cloud Storage directly instead of Media CDN.
    d:
      en: Without signed requests, anyone who obtains a playback URL can keep using it, so a link shared on the internet never stops working.
references:
  - title: Use signed requests
    url: https://docs.cloud.google.com/media-cdn/docs/signed-requests
  - title: Generate signatures
    url: https://docs.cloud.google.com/media-cdn/docs/generate-signatures
