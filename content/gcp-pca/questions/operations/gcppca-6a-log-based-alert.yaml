id: gcppca-6a-log-based-alert
objective: "6.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team must be notified as soon as an entry that contains the text `ADMIN_OVERRIDE_USED` appears in the logs of a payment application on GKE. A single occurrence matters. During an incident with many occurrences, the team wants at most one notification every 15 minutes.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a user-defined distribution log-based metric on the matching entries and alert when its mean value exceeds 1." } }
    - { id: b, text: { en: "Create a log-based alerting policy with a query that matches the entries, and set the time between notifications to 15 minutes." } }
    - { id: c, text: { en: "Route the matching entries to BigQuery with a sink and run a scheduled query every 15 minutes to look for new entries." } }
    - { id: d, text: { en: "Create an uptime check on the payment application that uses content matching on the text ADMIN_OVERRIDE_USED." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A log-based alerting policy (log match condition) opens an alert when log entries match its query, which is the recommended way to be notified when specific content appears in logs. Its notification rate limit (time between notifications) sets the minimum gap between notifications while the condition keeps matching, here 15 minutes.
  options:
    a: { en: "Distribution metrics extract numeric values such as latencies; the entries contain no value to average, so this does not detect occurrences." }
    c: { en: "A scheduled query delays detection by up to 15 minutes and adds a pipeline to operate, while the team must be notified as soon as an entry appears." }
    d: { en: "Uptime checks inspect the responses of an endpoint, not the application's log entries." }
references:
  - title: "Configure log-based alerting policies"
    url: https://docs.cloud.google.com/logging/docs/alerting/log-based-alerts
