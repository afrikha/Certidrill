id: gcppca-6b-binauthz-qa-attestation
objective: "6.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deploys containers to a production GKE cluster. Its release process requires that only images that passed the QA team's manual sign-off can run in production. Any attempt to deploy another image, including with `kubectl` by an administrator, must be blocked and logged.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Enable Binary Authorization with a policy that requires an attestation from a QA attestor, and have QA attest each approved image digest." } }
    - { id: b, text: { en: "Store approved images in a separate Artifact Registry repository, and grant only the QA team the Artifact Registry Writer role on it." } }
    - { id: c, text: { en: "Enable automatic vulnerability scanning on the repository, and deploy only the images that show no critical vulnerability." } }
    - { id: d, text: { en: "Require approval on the Cloud Build trigger that builds the images, and grant the QA team the Cloud Build Approver role." } }
answer: { optionId: a }
explanation:
  correct:
    en: "An attestation is a signed record that an image digest passed a stage such as a manual QA check, and a Binary Authorization policy can require it from a specific attestor. The enforcer checks the policy at deployment time on GKE, blocks non-compliant images whatever tool deploys them, and logs the denial in Cloud Audit Logs."
  options:
    b: { en: "Restricting who writes to a repository does not stop anyone from deploying an image from another repository." }
    c: { en: "Vulnerability scanning is not the QA sign-off, and nothing blocks an administrator from deploying an unscanned image." }
    d: { en: "A build approval gates the build, not the deployment; an administrator can still deploy any image with `kubectl`." }
references:
  - title: "Binary Authorization overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/binary-authorization/docs/overview
