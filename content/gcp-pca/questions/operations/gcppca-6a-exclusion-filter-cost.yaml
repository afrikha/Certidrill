id: gcppca-6a-exclusion-filter-cost
objective: "6.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A video streaming company's development GKE clusters run in dedicated development projects and write about 4 TiB per month of DEBUG-severity container logs to the _Default log bucket. Nobody reads these logs, and the Cloud Logging bill keeps growing. Logging in production projects must not change. A team member proposes reducing the retention of the _Default bucket in the development projects to 1 day.

    What should you do instead to reduce the cost the most?
body:
  options:
    - { id: a, text: { en: "Reduce the retention of the _Default bucket in the development projects to 1 day, as the team member proposed." } }
    - { id: b, text: { en: "Add an exclusion filter that matches the DEBUG container logs to the _Default sink of the development projects." } }
    - { id: c, text: { en: "Change the _Default sink of the development projects to route the DEBUG logs to a Pub/Sub topic with no subscriber." } }
    - { id: d, text: { en: "Route the DEBUG container logs to a new user-defined log bucket with a 1-day retention in the development projects." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Cloud Logging charges for log entries when they are stored in a log bucket, and that charge already includes up to 30 days of storage. Shortening retention below 30 days therefore saves almost nothing. An exclusion filter on the _Default sink keeps the matching entries from being stored, so they are not charged, and it leaves production projects unchanged.
  options:
    a: { en: "The storage charge is paid once at ingestion and includes 30 days of retention, so a 1-day retention barely reduces the bill." }
    c: { en: "Publishing 4 TiB a month to Pub/Sub adds Pub/Sub charges and an unnecessary destination instead of simply not storing the logs." }
    d: { en: "Entries stored in a user-defined bucket are charged at ingestion like those in _Default, so a short retention there does not reduce the cost either." }
references:
  - title: "Pricing | Google Cloud Observability"
    url: https://cloud.google.com/stackdriver/pricing
  - title: "Route log entries"
    url: https://docs.cloud.google.com/logging/docs/routing/overview
