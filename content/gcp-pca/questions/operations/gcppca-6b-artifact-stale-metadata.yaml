id: gcppca-6b-artifact-stale-metadata
objective: "6.5.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company enabled automatic scanning on its Artifact Registry repositories. A long-running internal service on Compute Engine uses an image that was pushed and pulled 60 days ago and has not been pulled since. Last week, a critical vulnerability was published for an OS package in that image, but Artifact Analysis shows no new finding for the image.

    You need current vulnerability data for this image with the least effort. What should you do?
body:
  options:
    - { id: a, text: { en: "Add a new tag to the image in the repository so that automatic scanning analyzes the image again." } }
    - { id: b, text: { en: "Rebuild the image from the same Dockerfile, push it, and redeploy the service to the Compute Engine VMs." } }
    - { id: c, text: { en: "Grant the On-Demand Scanning Admin role to the service account that the Compute Engine VMs use." } }
    - { id: d, text: { en: "Pull the image from Artifact Registry again so that Artifact Analysis resumes updating its vulnerability data." } }
answer: { optionId: d }
explanation:
  correct:
    en: "After the initial scan, Artifact Analysis keeps updating vulnerability data only for images pulled within the last 30 days; older images have stale metadata. Pulling the image again makes Artifact Analysis monitor it again and refresh its findings, without any rebuild."
  options:
    a: { en: "Scanning works per image digest, so adding or changing a tag does not trigger a new scan." }
    b: { en: "A new push would be scanned, but rebuilding and redeploying is far more effort than a pull, and it changes the running service." }
    c: { en: "That role lets a principal run on-demand scans; granting it to the VMs does not refresh the stale data of the image." }
references:
  - title: "Container scanning overview | Artifact Analysis | Google Cloud Documentation"
    url: https://docs.cloud.google.com/artifact-analysis/docs/container-scanning-overview
