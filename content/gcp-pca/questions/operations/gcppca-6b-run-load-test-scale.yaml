id: gcppca-6b-run-load-test-scale
objective: "6.6.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A ticketing company will load test a Cloud Run service before a major on-sale event. The test must reach three times the expected peak, which the team estimates requires about 250 instances. The service uses the default scaling settings, and the results must show how the service behaves as load grows step by step.

    Which two actions should you take?

    Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Raise the service's maximum number of instances above the default of 100, and request a quota increase first if needed." } }
    - { id: b, text: { en: "Generate the load by publishing messages to a Pub/Sub topic whose push subscription targets the service." } }
    - { id: c, text: { en: "Run the test against a minimal hello-world container so that the results isolate Cloud Run scaling." } }
    - { id: d, text: { en: "Drive the load with a controllable tool such as JMeter on Compute Engine VMs, increasing the load in steps." } }
    - { id: e, text: { en: "Start the test directly at three times the peak so that the service scales out in a single step." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Cloud Run's default maximum is 100 instances, so a 250-instance test needs a higher setting, and a quota increase if the regional limit is too low. Google recommends a load harness whose rate and concurrency you control, such as JMeter on a Compute Engine VM, and repeating the test at increasing levels to confirm that the service scales linearly."
  options:
    b: { en: "Pub/Sub is cited by Google as a tool to avoid for load tests, because you cannot control the request rate and concurrency." }
    c: { en: "Google advises against trivial services: startup time and CPU use drive scaling, so the test must use a service comparable to the real one." }
    e: { en: "A single jump to full load does not show how the service behaves at intermediate levels or where a bottleneck appears." }
references:
  - title: "Load testing best practices | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/about-load-testing
