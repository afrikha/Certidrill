id: gcppca-6b-support-enhanced
objective: "6.4.1"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A healthcare software company has just moved its patient portal to production on Google Cloud. It needs Cloud Customer Care to respond within one hour to critical-impact (P1) cases, 24 hours a day, 7 days a week. It does not need a Technical Account Manager, and it wants the lowest-cost support offering that meets this requirement.

    Which support offering should you recommend?
body:
  options:
    - { id: a, text: { en: "Basic Support" } }
    - { id: b, text: { en: "Standard Support" } }
    - { id: c, text: { en: "Enhanced Support" } }
    - { id: d, text: { en: "Premium Support" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Enhanced Support targets production workloads: it offers a one-hour initial response for P1 cases and 24/7 coverage for high- and critical-impact issues. Premium Support also meets the response time, with 15 minutes for P1, but it adds a Technical Account Manager the company does not need and has a much higher minimum monthly charge."
  options:
    a: { en: "Basic Support covers documentation, community forums, billing assistance, and Active Assist; it includes no technical support cases." }
    b: { en: "Standard Support targets workloads under development: it lists a 4-hour response for P2 cases, covers high-impact issues 8/5, and offers no P1 response time." }
    d: { en: "Premium Support meets the response time but includes a Technical Account Manager and costs far more, so it is not the lowest-cost option." }
references:
  - title: "Customer Care | Google Cloud"
    url: https://cloud.google.com/support
