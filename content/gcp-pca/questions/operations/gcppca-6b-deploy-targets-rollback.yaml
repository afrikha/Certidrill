id: gcppca-6b-deploy-targets-rollback
objective: "6.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company deploys a GKE application with Cloud Deploy. Release rel-118 was rolled out to the prod target an hour ago and is causing errors. Release rel-117 was rolled out successfully to prod before it. The on-call engineer must restore rel-117 on prod as quickly as possible, and the change must be recorded in Cloud Deploy.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Run `gcloud deploy targets rollback prod --delivery-pipeline=PIPELINE --release=rel-117`." } }
    - { id: b, text: { en: "Run `kubectl rollout undo` on the production Deployment in the GKE cluster." } }
    - { id: c, text: { en: "Create a new release from the rel-117 source and promote it through staging to prod." } }
    - { id: d, text: { en: "Abandon release rel-118 so that Cloud Deploy redeploys the previous release." } }
answer: { optionId: a }
explanation:
  correct:
    en: "`gcloud deploy targets rollback` redeploys an earlier release to the target by creating a new rollout from it, so the rollback is fast and appears in the pipeline history. Without `--release`, it uses the most recent release that had a successful rollout to the target; naming rel-117 makes the choice explicit."
  options:
    b: { en: "`kubectl rollout undo` changes the cluster outside Cloud Deploy, so the pipeline no longer reflects what runs in prod and the change is not recorded as a rollout." }
    c: { en: "A new release that goes through staging takes much longer than redeploying the release that already ran in prod." }
    d: { en: "Abandoning a release only stops it from being used further; it does not redeploy anything to the target." }
references:
  - title: "Roll back a target | Cloud Deploy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/deploy/docs/roll-back
