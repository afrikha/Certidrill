id: gcppca-6b-deploy-verify-staging
objective: "6.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company promotes releases through dev, staging, and prod GKE targets with Cloud Deploy. After each rollout to staging, its integration test suite, packaged as a container image, must run against the deployed application. A failing suite must mark the rollout as failed. The team wants the least custom code.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Add a Cloud Build step after `gcloud deploy releases create` that runs the test container against the staging endpoint." } }
    - { id: b, text: { en: "Configure a promotion automation rule from staging to prod that runs when the rollout to staging succeeds." } }
    - { id: c, text: { en: "Create a Cloud Monitoring uptime check on the staging endpoint, and alert the team when the check fails." } }
    - { id: d, text: { en: "Define the test container as a verify task, and set `verify: true` in the strategy of the staging stage." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Deployment verification runs your test containers after the deployment finishes. Success is decided by the exit code: a non-zero code fails the verification and therefore the rollout, which is shown in the rollout details. A failed verify job can be retried or ignored."
  options:
    a: { en: "The step runs right after the release is created, not after the rollout finishes, and its result does not change the rollout's state." }
    b: { en: "A promotion rule moves a release to the next target; it does not run the integration tests." }
    c: { en: "An uptime check only tests that the endpoint answers; it does not run the integration suite or fail the rollout." }
references:
  - title: "Verify your deployment | Cloud Deploy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/deploy/docs/verify-deployment
