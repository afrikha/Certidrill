id: gcppca-6a-observability-analytics
objective: "6.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company's SRE team needs SQL queries that count HTTP errors per service and per hour over the last 30 days of logs. The logs are already stored in a user-defined log bucket created in a project, and the team does not want to copy them to another storage system.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Upgrade the log bucket to use Observability Analytics and run the SQL queries on the upgraded bucket." } }
    - { id: b, text: { en: "Write a Logs Explorer query that groups the matching log entries by service and by hour, and save it." } }
    - { id: c, text: { en: "Create a counter log-based metric with a service label and chart it per hour in Metrics Explorer." } }
    - { id: d, text: { en: "Create a sink that routes the logs to a BigQuery dataset and run the SQL queries on that dataset." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Upgrading a project-level log bucket to Observability Analytics (the SQL interface of Cloud Logging, earlier called Log Analytics) lets the team run aggregate SQL queries on the logs in place, and a linked BigQuery dataset exposes the same data to BigQuery without exporting it. Logs written before the upgrade are backfilled, so the existing 30 days become queryable.
  options:
    b: { en: "Logs Explorer is a troubleshooting interface and does not support aggregate operations such as counts per hour." }
    c: { en: "Log-based metrics are not populated retroactively, so the 30 days of logs already stored would not be counted." }
    d: { en: "A sink copies only new entries into a separate BigQuery dataset, which duplicates the data and misses the existing logs." }
references:
  - title: "Analyze logs using Logs Explorer and Observability Analytics"
    url: https://docs.cloud.google.com/logging/docs/log-analytics
  - title: "Configure log buckets"
    url: https://docs.cloud.google.com/logging/docs/buckets
