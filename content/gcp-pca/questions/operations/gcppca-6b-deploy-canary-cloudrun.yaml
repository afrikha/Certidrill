id: gcppca-6b-deploy-canary-cloudrun
objective: "6.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A fintech company uses a Cloud Deploy delivery pipeline whose last target, prod, is a Cloud Run service. The release manager wants each production release to serve 10% of the traffic, then 50%, before it serves all users. Cloud Deploy must manage the traffic split, and the team does not want to write any traffic-management configuration.

    What should you configure on the prod stage?
body:
  options:
    - { id: a, text: { en: "A standard strategy with `verify: true`, so that Cloud Deploy tests the release before it receives traffic." } }
    - { id: b, text: { en: "A custom canary strategy in which you define the traffic settings of each phase for the Cloud Run service." } }
    - { id: c, text: { en: "Two targets, prod-10 and prod-50, promoted in sequence, each pointing to a separate Cloud Run service." } }
    - { id: d, text: { en: "A canary strategy with the percentages 10 and 50, so that Cloud Deploy creates canary phases before the stable phase." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With an automated canary, you only list the percentages; Cloud Deploy creates one phase per increment (canary-10, canary-50) and a final stable phase at 100%, and it apportions the Cloud Run traffic between the old and new revisions itself. Cloud Run targets do not accept 100 as a canary percentage: the stable phase covers it."
  options:
    a: { en: "Verification runs test containers after a deployment; it does not shift traffic gradually." }
    b: { en: "A custom canary makes you configure each phase, including traffic balancing, which the team wants to avoid." }
    c: { en: "Two separate services do not split the traffic of one service; users would not be shifted progressively from one version to the next." }
references:
  - title: "Use a canary deployment strategy | Cloud Deploy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/deploy/docs/deployment-strategies/canary
