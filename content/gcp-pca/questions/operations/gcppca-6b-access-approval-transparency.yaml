id: gcppca-6b-access-approval-transparency
objective: "6.4.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An insurance company stores regulated customer data on Google Cloud and often opens support cases. Its security policy requires that every access to customer data by Google personnel, for example during a support case, is logged with the reason for the access. The policy also requires that Google personnel obtain explicit approval from the company's administrators before they access that data.

    Which two services should you enable?

    Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Data Access audit logs in Cloud Audit Logs" } }
    - { id: b, text: { en: "Access Approval" } }
    - { id: c, text: { en: "A VPC Service Controls perimeter around the projects" } }
    - { id: d, text: { en: "Access Transparency" } }
    - { id: e, text: { en: "Security Command Center Premium" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Access Transparency logs record the actions of Google personnel on customer data, with the resource, time, reason, and accessor details. Access Approval requires Google administrators, including Cloud Customer Care, to obtain approval from an authorized customer administrator before accessing customer data; Access Transparency must be enabled before Access Approval."
  options:
    a: { en: "Data Access audit logs record actions by your own organization's principals, not by Google personnel, and they do not require any approval." }
    c: { en: "VPC Service Controls limits API access and data exfiltration across a perimeter; it gives no approval workflow for Google personnel." }
    e: { en: "Security Command Center finds misconfigurations and threats; it does not log or gate access by Google personnel." }
references:
  - title: "Overview of Access Approval | Google Cloud Documentation"
    url: https://docs.cloud.google.com/assured-workloads/access-approval/docs/overview
  - title: "Overview of Access Transparency | Google Cloud Documentation"
    url: https://docs.cloud.google.com/assured-workloads/access-transparency/docs/overview
