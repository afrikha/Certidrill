id: gcppca-6b-run-tagged-revision-test
objective: "6.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company runs its storefront API as a Cloud Run service. The QA team must test each new revision through a dedicated URL, with the production configuration of the service, before any customer request reaches that revision. Customer traffic must stay on the current revision until QA signs off.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Deploy the new revision normally, then run `gcloud run services update-traffic` to send 100% of traffic back to the current revision." } }
    - { id: b, text: { en: "Deploy the new revision to a second Cloud Run service in a test project, and copy the production settings to it by hand." } }
    - { id: c, text: { en: "Deploy the new revision with `gcloud run deploy --no-traffic --tag qa`, and give the QA team the revision's tagged URL." } }
    - { id: d, text: { en: "Deploy the new revision with `--no-traffic`, and have the QA team call the service's main URL to reach that revision." } }
answer: { optionId: c }
explanation:
  correct:
    en: "`--no-traffic` creates the revision without routing any request to it, so customers stay on the current revision. `--tag qa` gives the revision its own URL, starting with the tag name, that the QA team can call before anyone moves traffic to it with `--to-tags` or `--to-revisions`."
  options:
    a: { en: "A normal deployment sends traffic to the new revision as soon as it is ready, so some customer requests reach it before the traffic is moved back." }
    b: { en: "A copy in another project is not the same service and its configuration can drift from production; it also adds manual work for every release." }
    d: { en: "The main URL follows the service's traffic split, which still sends 100% of requests to the current revision; QA would never reach the new one." }
references:
  - title: "Rollbacks, gradual rollouts, and traffic migration | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
