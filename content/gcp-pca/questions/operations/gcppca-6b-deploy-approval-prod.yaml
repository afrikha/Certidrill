id: gcppca-6b-deploy-approval-prod
objective: "6.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Example Corp uses Cloud Deploy to promote releases from a staging target to a prod target. Its compliance team requires that no rollout to prod starts until a member of the release-managers group approves it. Developers, who create and promote releases, must not be able to approve rollouts to prod.

    Which two actions should you take?

    Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add `verify: true` to the strategy of the prod stage in the delivery pipeline." } }
    - { id: b, text: { en: "Set `requireApproval: true` in the configuration of the prod target." } }
    - { id: c, text: { en: "Require approval on the Cloud Build trigger that creates each release." } }
    - { id: d, text: { en: "Grant `roles/clouddeploy.approver` to the release-managers group only." } }
    - { id: e, text: { en: "Create a deploy policy with a weekly window that blocks rollouts to prod." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "`requireApproval: true` on the prod target makes every rollout to it wait in a pending-approval state. Only principals with the Cloud Deploy Approver role (`roles/clouddeploy.approver`) can approve or reject it, so granting that role to the release-managers group, and not to developers, enforces the separation of duties."
  options:
    a: { en: "Verification runs automated tests after a deployment; it is not a human approval before the rollout." }
    c: { en: "A Cloud Build approval gates the build that creates the release, which then also reaches staging; it does not gate the rollout to prod." }
    e: { en: "A deploy policy blocks rollouts during time windows; it does not let a release manager approve an individual rollout." }
references:
  - title: "Promote your release and manage approvals | Cloud Deploy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/deploy/docs/promote-release
