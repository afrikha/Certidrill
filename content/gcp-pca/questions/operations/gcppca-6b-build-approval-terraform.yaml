id: gcppca-6b-build-approval-terraform
objective: "6.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A platform team applies Terraform changes to production with a Cloud Build trigger that runs `terraform plan` and `terraform apply`. The change management policy requires that a senior engineer approves each production run before it starts, and that approvals are recorded in Google Cloud.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Grant the senior engineers the Cloud Build Editor role so that only they can start the production trigger by hand." } }
    - { id: b, text: { en: "Add a build step that waits 30 minutes before `terraform apply` so that a senior engineer can cancel the build." } }
    - { id: c, text: { en: "Add `gcloud beta terraform vet` to the trigger so that each plan is checked against policy before it is applied." } }
    - { id: d, text: { en: "Configure the production trigger to require approval, and grant the senior engineers the Cloud Build Approver role." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A trigger that requires approval holds each build in a pending state until a principal with the Cloud Build Approver role approves it in the console or with `gcloud builds approve`; a rejected build never starts. The approval, with an optional comment, is recorded on the build."
  options:
    a: { en: "Cloud Build Editor lets users run and change builds, but the trigger can still start without anyone's approval, and Editor can even remove an approval requirement." }
    b: { en: "A delay is not an approval: if nobody acts, the change is applied anyway." }
    c: { en: "Policy validation checks the plan against constraints, not a human approval, and `gcloud beta terraform vet` is in Preview." }
references:
  - title: "Gate builds on approval | Cloud Build | Google Cloud Documentation"
    url: https://docs.cloud.google.com/build/docs/securing-builds/gate-builds-on-approval
