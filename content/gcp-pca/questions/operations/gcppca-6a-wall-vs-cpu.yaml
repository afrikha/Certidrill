id: gcppca-6a-wall-vs-cpu
objective: "6.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team profiles a Python API on Compute Engine with Cloud Profiler. For the handler `generate_report`, the wall time profile shows about 2.4 seconds per call, while the CPU time profile shows about 0.1 second per call.

    What does this most likely indicate?
body:
  options:
    - { id: a, text: { en: "The handler is CPU-bound, so moving the VM to a compute-optimized machine type would remove most of its latency." } }
    - { id: b, text: { en: "The handler spends most of its time waiting, for example on I/O, locks, or downstream calls, rather than on the CPU." } }
    - { id: c, text: { en: "The handler allocates large amounts of memory, and the resulting garbage collection pauses are counted as CPU time." } }
    - { id: d, text: { en: "The profiler agent is misconfigured, because wall time and CPU time profiles must show the same value for a handler." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      CPU time counts only the time the CPU actively executes the code, while wall time is the elapsed time from entering to leaving the function, including waiting for locks, thread synchronization, and I/O. When wall time is much higher than CPU time, the code is mostly waiting, which points to a bottleneck such as a slow dependency or contention rather than computation.
  options:
    a: { en: "Only 0.1 second of the 2.4 seconds is CPU time, so faster CPUs would barely change the latency." }
    c: { en: "A memory problem would be investigated with heap profiles; this pattern of low CPU time and high wall time shows waiting." }
    d: { en: "Wall time is expected to be higher than CPU time whenever code waits; the two profiles measure different things." }
references:
  - title: "Profiling concepts"
    url: https://docs.cloud.google.com/profiler/docs/concepts-profiling
