id: gcppca-6a-iperf-tier1
objective: "6.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A research company created two n2-standard-64 VMs with per-VM Tier_1 networking and gVNIC to move simulation data, expecting up to 75 Gbps of egress bandwidth. A benchmark that runs iperf3 with a single stream between the VMs' external IP addresses, with the VMs in two different zones, reports far lower throughput. The architect wants to measure whether the VMs reach the bandwidth that Tier_1 networking provides.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Repeat the iperf3 test with a single stream for a longer duration so that the TCP window reaches its maximum size." } }
    - { id: b, text: { en: "Switch the VMs to the VirtIO network interface, which provides higher single-stream throughput than gVNIC." } }
    - { id: c, text: { en: "Run the test between VMs in two different regions so that the traffic uses Google's Premium Tier backbone." } }
    - { id: d, text: { en: "Run iPerf version 2 with multiple parallel streams between the VMs' internal IP addresses, in the same zone and VPC network." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Google's Tier_1 benchmarking guide places both VMs in the same zone and VPC network and runs iPerf version 2 with 16 parallel streams against the internal IP addresses; iPerf 3 does not support multi-threading by design. The 75 Gbps figure applies to traffic to internal IP addresses, so a single stream to external IP addresses across zones cannot show the Tier_1 limit.
  options:
    a: { en: "A single stream cannot reach the aggregate bandwidth limit regardless of duration; the guide uses many parallel streams." }
    b: { en: "Tier_1 networking requires gVNIC; switching to VirtIO would remove the higher bandwidth tier." }
    c: { en: "Moving the VMs farther apart adds latency and leaves the single-stream and external-address problems unchanged." }
references:
  - title: "Benchmark higher network bandwidth for VM instances"
    url: https://docs.cloud.google.com/compute/docs/networking/benchmarking-higher-bandwidth-vms
