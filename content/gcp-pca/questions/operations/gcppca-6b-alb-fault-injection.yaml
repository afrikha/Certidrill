id: gcppca-6b-alb-fault-injection
objective: "6.6.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media streaming company exposes its microservices through a global external Application Load Balancer. In a controlled chaos experiment, the SRE team wants to verify that the retry and timeout logic of the mobile app copes when the catalog backend returns HTTP 503 errors or responds slowly for 5% of requests. The experiment must not require code changes in the catalog service or in the clients.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Add a `faultInjectionPolicy` with abort and delay settings to the route action of the catalog path in the load balancer's URL map." } }
    - { id: b, text: { en: "Stop 5% of the VMs in the catalog's managed instance group so that a share of the catalog requests cannot be served." } }
    - { id: c, text: { en: "Add a Cloud Armor rate-limiting rule to the catalog's backend service that throttles requests and returns HTTP 503 errors." } }
    - { id: d, text: { en: "Lower the timeout of the catalog's backend service to one second so that slow responses from the catalog are cut off." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Route actions of the global external Application Load Balancer support fault injection through `faultInjectionPolicy`: delay injection adds latency to a percentage of requests, and abort injection returns a chosen HTTP status code, such as 503, for a percentage of requests without forwarding them. The experiment is configured on the load balancer only."
  options:
    b: { en: "The load balancer sends traffic only to healthy backends, so stopped VMs do not produce a controlled 5% of errors, and no slow responses are simulated." }
    c: { en: "Rate limiting throttles clients that exceed thresholds; it does not fail a fixed percentage of requests or add latency." }
    d: { en: "A shorter timeout only cuts off responses that are already slow; it does not inject errors or delays into the experiment." }
references:
  - title: "Traffic management overview for global external Application Load Balancers"
    url: https://docs.cloud.google.com/load-balancing/docs/https/traffic-management-global
