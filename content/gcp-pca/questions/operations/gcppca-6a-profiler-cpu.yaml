id: gcppca-6a-profiler-cpu
objective: "6.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A trading analytics company runs a Java service on GKE. CPU usage doubled after the last release. The team wants to find which methods consume the most CPU in production, continuously and with low overhead, without reproducing the load in a test environment.

    Which service should you use?
body:
  options:
    - { id: a, text: { en: "Cloud Trace" } }
    - { id: b, text: { en: "Error Reporting" } }
    - { id: c, text: { en: "Cloud Profiler" } }
    - { id: d, text: { en: "Cloud Monitoring uptime checks" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Cloud Profiler is a statistical, low-overhead profiler that continuously collects CPU and memory allocation data from production applications, typically about 10 seconds per instance every minute. Its CPU time profile, supported for Java, shows which methods consume the most CPU, and comparing profiles across versions shows what the release changed.
  options:
    a: { en: "Cloud Trace measures request latency across services, not CPU consumption per method inside a process." }
    b: { en: "Error Reporting groups application errors; it does not measure CPU usage." }
    d: { en: "Uptime checks test availability from external locations and say nothing about code-level CPU consumption." }
references:
  - title: "Cloud Profiler overview"
    url: https://docs.cloud.google.com/profiler/docs/about-profiler
