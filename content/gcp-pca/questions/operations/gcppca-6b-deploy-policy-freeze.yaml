id: gcppca-6b-deploy-policy-freeze
objective: "6.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online retailer deploys every production service with Cloud Deploy, including automated promotions. Leadership requires a change freeze on all production targets from November 20 to December 2. During the freeze, the SRE lead must still be able to deploy an emergency fix.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Set `requireApproval: true` on each production target, and ask the approvers to reject every rollout until December 2." } }
    - { id: b, text: { en: "Create a deploy policy with a weekly window covering every day, and delete the policy by hand when the freeze ends." } }
    - { id: c, text: { en: "Remove the Cloud Deploy Releaser role from the developers until December 2, then grant it to them again." } }
    - { id: d, text: { en: "Create a deploy policy with a rollout restriction in a one-time window on the production targets, and grant the SRE lead `roles/clouddeploy.policyOverrider`." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A deploy policy restricts manual and automated actions on the selected pipelines or targets; a `rolloutRestriction` rule with a `oneTimeWindows` block covers a non-repeating period such as November 20 to December 2. A principal with `roles/clouddeploy.policyOverrider` can override the policy for an emergency rollout."
  options:
    a: { en: "Approvals rely on people rejecting every pending rollout correctly for two weeks; nothing enforces the freeze." }
    b: { en: "A weekly window repeats and starts blocking as soon as the policy exists, so it must be created and deleted by hand on the exact dates, and it gives the SRE lead no override path." }
    c: { en: "Removing a role from developers does not stop automated promotions, and it also blocks the emergency path unless roles are changed again." }
references:
  - title: "Restrict deploy behavior using policies | Cloud Deploy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/deploy/docs/deploy-policy
