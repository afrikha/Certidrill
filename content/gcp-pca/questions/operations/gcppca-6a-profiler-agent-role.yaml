id: gcppca-6a-profiler-agent-role
objective: "6.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company deploys a Node.js service on GKE and uses Workload Identity Federation for GKE. The Cloud Profiler agent is started in the application code with a service name, and the Cloud Profiler API is enabled in the project. No profiles appear in the Profiler interface, and the container logs show permission errors from the agent.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Grant the Monitoring Metric Writer role (roles/monitoring.metricWriter) to the service account of the node pool." } }
    - { id: b, text: { en: "Install the Ops Agent on the GKE nodes so that it forwards the collected profiles to Cloud Profiler." } }
    - { id: c, text: { en: "Grant the Cloud Profiler Agent role (roles/cloudprofiler.agent) to the principal that the workload uses." } }
    - { id: d, text: { en: "Add the heap profiling option to the agent configuration so that the agent can authenticate to the API." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When the workload uses Workload Identity, a user-created service account, or a modified default service account, the identity of the profiling agent needs the Cloud Profiler Agent role (roles/cloudprofiler.agent); without it, the project receives no profile data. With Workload Identity Federation for GKE, the role is granted to the workload's Kubernetes service account principal.
  options:
    a: { en: "Monitoring Metric Writer allows writing metrics to Cloud Monitoring, not profiles to Cloud Profiler, and the pod does not use the node identity." }
    b: { en: "The Ops Agent must not be installed manually on GKE nodes and does not forward profiles; the in-process agent sends them." }
    d: { en: "Profile type options do not affect authentication; the permission error is caused by the missing IAM role." }
references:
  - title: "Profiling Node.js applications"
    url: https://docs.cloud.google.com/profiler/docs/profiling-nodejs
