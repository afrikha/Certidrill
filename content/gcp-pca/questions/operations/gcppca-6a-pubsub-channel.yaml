id: gcppca-6a-pubsub-channel
objective: "6.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturing company wants Cloud Monitoring alerts to create tickets automatically in an internal ticketing system that runs on GKE and has no public endpoint. The integration must not depend on notification formats that Google might change.

    Which notification channel type should you use?
body:
  options:
    - { id: a, text: { en: "Email" } }
    - { id: b, text: { en: "Webhook" } }
    - { id: c, text: { en: "Slack" } }
    - { id: d, text: { en: "Pub/Sub" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      For automation that reads or acts on notifications, Google recommends the webhook or Pub/Sub channels, whose formats are meant for programmatic use. Pub/Sub does not need a public endpoint: the internal system can pull from a subscription, after Monitoring's notification service account is allowed to publish to the topic.
  options:
    a: { en: "Email notification formats can change and are not meant for automated parsing." }
    b: { en: "Webhook channels must target public endpoints, which the internal ticketing system does not have." }
    c: { en: "Slack notifications are for people in chat channels, and their format can change." }
references:
  - title: "Create and manage notification channels"
    url: https://docs.cloud.google.com/monitoring/support/notification-options
