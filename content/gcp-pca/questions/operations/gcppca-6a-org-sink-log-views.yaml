id: gcppca-6a-org-sink-log-views
objective: "6.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An insurance company has 300 projects in its organization and creates new projects every week. The security team wants the logs of all current and future projects stored in one log bucket in a central logging project. Each application team must be able to read only the logs of its own projects in that bucket.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a sink in each existing project that routes its logs to the log bucket in the central logging project." } }
    - { id: b, text: { en: "Grant each application team the Logs Viewer role (roles/logging.viewer) on the central logging project." } }
    - { id: c, text: { en: "Create one log view per team, filtered on the team's projects, and grant the team roles/logging.viewAccessor on it." } }
    - { id: d, text: { en: "Create an organization-level aggregated sink that includes child resources and routes to the central bucket." } }
    - { id: e, text: { en: "Add all the projects of the organization to the metrics scope of the central logging project so that it can read them." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      An aggregated sink at the organization level routes the log entries of the organization and all its child resources, including projects created later, to a destination such as a log bucket in another project. Log views restrict which entries of a bucket a user can see; a view filtered with the source of the team's projects, combined with roles/logging.viewAccessor granted on that view, gives each team access to its own logs only.
  options:
    a: { en: "Per-project sinks do not cover projects created later unless someone adds a sink to each new project." }
    b: { en: "Logs Viewer on the central project gives access to every view of its buckets, so each team would see every team's logs." }
    e: { en: "A metrics scope aggregates time-series metrics for Cloud Monitoring; it does not route or store logs." }
references:
  - title: "Route log entries"
    url: https://docs.cloud.google.com/logging/docs/routing/overview
  - title: "Configure log views on a log bucket"
    url: https://docs.cloud.google.com/logging/docs/logs-views
