id: gcppca-6a-iac-change-mgmt
objective: "6.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A fintech company changes its VPC networks, firewall rules, and Cloud SQL instances directly in the Google Cloud console. The test and production environments have drifted apart, and when a change breaks production, nobody can tell who made it or roll it back quickly.

    The company wants to follow the Well-Architected Framework recommendations for automating and managing change.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Define the networks, firewall rules, and Cloud SQL instances in Terraform files stored in a Git repository." } }
    - { id: b, text: { en: "Limit console access to two senior administrators and ask them to record every change in a shared change log." } }
    - { id: c, text: { en: "Apply infrastructure changes only through a Cloud Build pipeline that runs after a pull request is reviewed and merged." } }
    - { id: d, text: { en: "Export Cloud Asset Inventory snapshots every day and compare them to find drift between the two environments." } }
    - { id: e, text: { en: "Take daily backups of the Cloud SQL instances and document the firewall rules in a wiki so that they can be recreated." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The pillar recommends infrastructure as code (Terraform is its example) for consistent, repeatable deployments, version control such as Git to see who changed what and to roll back, and CI/CD pipelines such as Cloud Build that run on events like pull requests or code pushes. Defining the infrastructure as code and applying it only through the pipeline removes drift between environments and makes every change traceable and reversible.
  options:
    b: { en: "A manual change log depends on people remembering to update it and does not prevent drift or make rollback fast." }
    d: { en: "Comparing snapshots detects drift after it happens but neither prevents it nor records who made a change." }
    e: { en: "Backups and wiki pages help recovery, but changes remain manual, untraceable, and inconsistent between environments." }
references:
  - title: "Automate and manage change"
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/automate-and-manage-change
