id: gcppca-6a-slo-measurable
objective: "6.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel booking company is preparing the operational readiness of its search API, which runs on Cloud Run. The product owner wrote the objective "the search API must always be fast and available." The SRE lead wants an objective that can be tracked in Cloud Monitoring and used to decide when reliability work takes priority over new features.

    Which objective should you recommend?
body:
  options:
    - { id: a, text: { en: "100% of search requests succeed, measured with the request count metric of the Cloud Run service." } }
    - { id: b, text: { en: "99.9% of search requests over a rolling 30 days return a non-5xx response within 400 ms, tracked as an SLI." } }
    - { id: c, text: { en: "Average CPU utilization of the Cloud Run service instances stays below 60% during business hours." } }
    - { id: d, text: { en: "The search API meets the monthly uptime percentage that Google publishes in the Cloud Run SLA." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The pillar asks for SLOs that are specific, measurable, achievable, relevant, and time-bound, tracked in Cloud Monitoring through service level indicators. A 99.9% target for successful, fast requests over a rolling 30-day window measures what users experience and leaves an error budget of 0.1% that the team can use to balance reliability work against feature work.
  options:
    a: { en: "A 100% target is not achievable and leaves no error budget, so it cannot be used to decide when reliability work takes priority." }
    c: { en: "CPU utilization is a resource metric, not a measure of what users experience; requests can fail or be slow while CPU stays low." }
    d: { en: "The Cloud Run SLA is Google's contractual commitment for the platform, not an objective for the company's own API, its latency, or its code." }
references:
  - title: "Ensure operational readiness and performance using CloudOps"
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/operational-readiness-and-performance-using-cloudops
  - title: "Concepts in service monitoring"
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/slo-monitoring
