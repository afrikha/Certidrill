id: gcppca-6a-channel-redundancy
objective: "6.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A hospital network's critical alerting policies on Compute Engine VMs notify on-call staff only through a PagerDuty notification channel. Last quarter, a delivery problem delayed a critical notification. The CTO requires that critical notifications still reach staff if one delivery path fails, and that each notification includes a link to the runbook and the ID of the affected VM.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a Slack notification channel to the critical policies, alongside the existing PagerDuty channel." } }
    - { id: b, text: { en: "Add an email notification channel to the critical policies, alongside the existing PagerDuty channel." } }
    - { id: c, text: { en: "Create a second copy of each critical alerting policy that notifies the same PagerDuty channel." } }
    - { id: d, text: { en: "Add a Mobile App notification channel to the critical policies, alongside the existing PagerDuty channel." } }
    - { id: e, text: { en: "Add documentation to the policies with the runbook link and the `${resource.label.instance_id}` variable." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Google recommends pairing channels for redundancy: Mobile App, PagerDuty, webhook, and Slack notifications share one internal delivery service, so they should be paired with email or Pub/Sub. User-defined documentation adds Markdown content, including links such as a runbook URL, and variables such as `${resource.label.instance_id}` that are replaced with the affected resource's values when the notification is sent.
  options:
    a: { en: "Slack shares the same internal delivery service as PagerDuty, so it is not an independent path." }
    c: { en: "A duplicate policy uses the same channel and the same delivery path, so one failure still blocks both notifications." }
    d: { en: "Mobile App notifications share the same internal delivery service as PagerDuty, so they fail together." }
references:
  - title: "Create and manage notification channels"
    url: https://docs.cloud.google.com/monitoring/support/notification-options
  - title: "Annotate notifications with user-defined documentation"
    url: https://docs.cloud.google.com/monitoring/alerts/doc-variables
