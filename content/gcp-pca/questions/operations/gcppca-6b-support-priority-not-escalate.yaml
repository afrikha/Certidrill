id: gcppca-6b-support-priority-not-escalate
objective: "6.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company with Enhanced Support opened a P3 support case yesterday about intermittent errors on a Cloud SQL instance. This morning, the instance became unavailable, the production booking site is down, and no workaround can be put in place quickly.

    What should you do to get the fastest response from Cloud Customer Care?
body:
  options:
    - { id: a, text: { en: "Escalate the case so that an Escalation Manager is assigned to it, and keep the P3 priority so that the case history stays consistent." } }
    - { id: b, text: { en: "Close the P3 case, and open a new P2 case that describes the outage of the booking site and links to the old case." } }
    - { id: c, text: { en: "Wait until Personalized Service Health shows a related incident, then add the incident identifier to the existing P3 case." } }
    - { id: d, text: { en: "Change the case priority to P1, explain the new business impact, and attach the latest error messages and logs to the case." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A production service that is unusable, with critical business impact and no quick workaround, matches the P1 definition, and response times depend on priority. Google recommends setting the appropriate priority for high-impact issues rather than escalating, explaining how the impact changed and adding error messages and logs so that Customer Care has full context."
  options:
    a: { en: "Escalation is meant for process breaks, such as a slow response or a fix that failed; it does not raise the priority and can even slow resolution of a high-impact issue." }
    b: { en: "P2 is for degraded production with a workaround; the outage is P1, and a new case loses the context already gathered." }
    c: { en: "The outage may not be caused by a Google incident at all, and waiting delays the response while the site is down." }
references:
  - title: "Create and manage support cases | Cloud Customer Care | Google Cloud Documentation"
    url: https://docs.cloud.google.com/support/docs/customer-care-procedures
