id: gcppca-6a-fio-disk-benchmark
objective: "6.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Before migrating a database to Compute Engine, an architect must verify that a new Persistent Disk volume reaches its published IOPS and throughput limits when attached to the chosen VM shape. The results must reflect the disk's real limits.

    Which two practices should the benchmark follow? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run the raw block device tests on the production database disk so that the results reflect the real data." } }
    - { id: b, text: { en: "Use fio with direct I/O and a high I/O depth instead of dd, which uses a very low queue depth by default." } }
    - { id: c, text: { en: "Use /dev/zero as the data source so that the benchmark is not slowed down by random data generation." } }
    - { id: d, text: { en: "Run the raw block device tests on a throwaway VM and disk, because those tests overwrite the device." } }
    - { id: e, text: { en: "Use an I/O depth of 1 with 1 MB blocks to measure the maximum random IOPS of the disk." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Google's guide uses fio with direct I/O (`--direct=1`) and enough I/Os in flight, because dd uses a very low queue depth and may not measure disk performance accurately. Testing the raw block device is the way to compare against published limits, but it is destructive, so it must run on a throwaway VM and disk.
  options:
    a: { en: "Raw block device tests overwrite the target device, which would destroy the production data." }
    c: { en: "The guide recommends avoiding special devices such as /dev/zero and /dev/urandom in benchmarks." }
    e: { en: "Maximum IOPS needs a high I/O depth (256 in the guide) with small 4 KB blocks; 1 MB blocks are for throughput tests." }
references:
  - title: "Benchmark Persistent Disk performance on a Linux VM"
    url: https://docs.cloud.google.com/compute/docs/disks/benchmarking-pd-performance
