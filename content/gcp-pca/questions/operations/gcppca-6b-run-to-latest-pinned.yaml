id: gcppca-6b-run-to-latest-pinned
objective: "6.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    During an incident last week, an engineer at a media company rolled back a Cloud Run service by running `gcloud run services update-traffic news --to-revisions news-00041-abc=100`. Since then, the team has deployed two new revisions with `gcloud run deploy`. Both deployments succeeded, but every request is still served by `news-00041-abc`.

    The team wants each future deployment to receive all traffic automatically, as it did before the incident, without an extra step per deployment. What should you do?
body:
  options:
    - { id: a, text: { en: "Add `--tag latest` to the next `gcloud run deploy` command so that the newest revision becomes the serving revision." } }
    - { id: b, text: { en: "Run `gcloud run services update-traffic news --to-latest` once, so that the service routes traffic to the newest revision." } }
    - { id: c, text: { en: "Set the minimum number of instances of revision `news-00041-abc` to 0 so that it stops serving requests." } }
    - { id: d, text: { en: "After each deployment, run `update-traffic --to-revisions` to send 100% of traffic to the revision just deployed." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Pinning traffic to a revision replaces the default behavior: later deployments follow that pattern and receive no traffic. Running `update-traffic --to-latest` sends all traffic to the most recently deployed revision and restores the default, so every later deployment again receives 100% of traffic."
  options:
    a: { en: "A tag only gives a revision its own URL; it does not change how the service's traffic is split." }
    c: { en: "Minimum instances control how many instances stay warm; they do not change traffic routing, so the pinned revision keeps receiving all requests." }
    d: { en: "This works, but it adds a manual step to every deployment, which the requirement excludes." }
references:
  - title: "Rollbacks, gradual rollouts, and traffic migration | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
