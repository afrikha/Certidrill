id: gcppca-6a-retest-window
objective: "6.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An alerting policy pages on-call engineers when the CPU utilization of VMs in a managed instance group exceeds 90%. Batch steps cause CPU spikes of 20 to 40 seconds several times an hour, which open alerts that close on their own and wake engineers at night. High CPU sustained for several minutes must still page.

    What should you change?
body:
  options:
    - { id: a, text: { en: "Set the retest window of the condition to 5 minutes so that it is met only when every measurement in the window violates the threshold." } }
    - { id: b, text: { en: "Set a 60-second alignment period with a max aligner so that every CPU spike is measured more precisely by the condition." } }
    - { id: c, text: { en: "Set the missing-data handling of the condition so that missing data points are treated as values that violate the condition." } }
    - { id: d, text: { en: "Replace the condition with a forecast condition that predicts when the CPU utilization of the group will reach 100%." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The retest window (duration) prevents a condition from being met by a single measurement: a metric-threshold condition is met only when every aligned measurement in the window violates the threshold, and any non-violating measurement resets the window. Google recommends at least 180 seconds to avoid false alerts; 5 minutes ignores short spikes and still pages on sustained high CPU.
  options:
    b: { en: "A max aligner over short periods highlights spikes, which makes the noisy paging worse." }
    c: { en: "Treating missing data as violations opens more alerts and does not address short spikes in data that is present." }
    d: { en: "A forecast condition predicts future threshold violations; it does not filter out short spikes of current usage." }
references:
  - title: "Behavior of metric-based alerting policies"
    url: https://docs.cloud.google.com/monitoring/alerts/concepts-indepth
