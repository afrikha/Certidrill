id: gcppca-6a-snooze-maintenance
objective: "6.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An airline's operations team will run a planned database maintenance next Saturday from 02:00 to 04:00. During this window, eight alerting policies are expected to fire and would page engineers. Outside the window, the policies must alert normally, and nobody should have to remember to turn anything back on afterward.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Disable the eight alerting policies at 02:00 and enable them again after the maintenance ends at 04:00." } }
    - { id: b, text: { en: "Remove the notification channels from the eight policies before the window and add them back after it." } }
    - { id: c, text: { en: "Create a snooze for the eight alerting policies that starts at 02:00 with a duration of 120 minutes." } }
    - { id: d, text: { en: "Increase the retest window of the eight policies to 2 hours for the week of the planned maintenance." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A snooze applies to a list of up to 16 alerting policies for an active period defined by a start time and a duration. While it is active, Monitoring creates no alerts and sends no notifications for those policies; outside the period, it has no effect, so alerting resumes automatically. Planned maintenance is a documented use case.
  options:
    a: { en: "Someone must remember to re-enable the policies, which the requirement rules out." }
    b: { en: "Someone must restore the channels afterward, and alerts would still open without notifications reaching anyone." }
    d: { en: "A 2-hour retest window would delay real alerts all week and could still fire if the maintenance impact lasts the whole window." }
references:
  - title: "Snooze notifications and alerts"
    url: https://docs.cloud.google.com/monitoring/alerts/snooze
