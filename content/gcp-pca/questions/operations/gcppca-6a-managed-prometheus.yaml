id: gcppca-6a-managed-prometheus
objective: "6.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A SaaS company runs self-managed Prometheus servers on its GKE Standard clusters. The team spends hours every week resizing Prometheus storage and sharding scrapers, and it must keep 13 months of metrics for capacity reviews. Engineers want to keep their PromQL dashboards and minimize operational overhead.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Move to the self-deployed collection of Managed Service for Prometheus so that the existing Prometheus setup is kept." } }
    - { id: b, text: { en: "Install the Ops Agent on every GKE node to scrape the Prometheus endpoints and send the metrics to Cloud Monitoring." } }
    - { id: c, text: { en: "Replace the Prometheus metrics with log-based metrics that are created from the application logs of the workloads." } }
    - { id: d, text: { en: "Use the managed collection of Managed Service for Prometheus with PodMonitoring resources, and keep querying with PromQL." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Managed collection is Google's recommended approach for Kubernetes: an operator handles scrape configuration, scaling, and rules, and the data is stored in Monarch for 24 months at no additional cost, which covers the 13-month requirement. PodMonitoring resources define what to scrape, and PromQL keeps working in Cloud Monitoring and Grafana.
  options:
    a: { en: "With self-deployed collection, the team still manages scaling and sharding of the collectors, which is the overhead it wants to remove." }
    b: { en: "The Ops Agent must not be installed manually on GKE nodes, which have their own built-in monitoring." }
    c: { en: "Log-based metrics would require rewriting instrumentation and dashboards, and they are not a PromQL replacement for Prometheus metrics." }
references:
  - title: "Google Cloud Managed Service for Prometheus"
    url: https://docs.cloud.google.com/stackdriver/docs/managed-prometheus
  - title: "Ops Agent overview"
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/agents/ops-agent
