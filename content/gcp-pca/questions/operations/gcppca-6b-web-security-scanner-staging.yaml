id: gcppca-6b-web-security-scanner-staging
objective: "6.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a public web application on GKE behind an external Application Load Balancer, and a production-like staging copy of it on a separate public URL. The company has Security Command Center Premium. It wants recurring automated scans for vulnerabilities such as cross-site scripting, mixed content, and outdated libraries, including on pages behind the login form, without risking production data.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Rely on the Web Security Scanner managed scans that Security Command Center runs every week against the production URL." } }
    - { id: b, text: { en: "Create a Web Security Scanner custom scan of the staging URL that signs in with a test account that has no access to sensitive data." } }
    - { id: c, text: { en: "Create a Web Security Scanner custom scan of the production URL that signs in with an administrator account to reach every page." } }
    - { id: d, text: { en: "Enable the Cloud Armor preconfigured WAF rules for cross-site scripting on the backend service of the load balancer." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Custom scans can authenticate, so they reach pages behind the login form and give more detailed findings. Google recommends scanning a test environment with a test account that has no access to sensitive data or harmful operations, because the scanner can post test content, send many test emails, and affect the reliability of an application."
  options:
    a: { en: "Managed scans are unauthenticated and send only GET requests, so they never reach pages behind the login form." }
    c: { en: "Scanning production with an administrator account risks changing data, sending messages, and triggering harmful operations." }
    d: { en: "Cloud Armor WAF rules filter attacks at the load balancer; they do not find vulnerabilities in the application." }
references:
  - title: "Overview of Web Security Scanner | Security Command Center | Google Cloud Documentation"
    url: https://docs.cloud.google.com/security-command-center/docs/concepts-web-security-scanner-overview
