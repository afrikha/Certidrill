id: gcppca-6a-ssl-expiry
objective: "6.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A news site behind an external Application Load Balancer uses a certificate bought from a third-party certificate authority and uploaded as a self-managed certificate. The site had an outage when the certificate expired. An HTTPS uptime check with SSL certificate validation already exists. The team wants to be warned 30 days before any future expiration.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create an alerting policy on the `uptime_check/time_until_ssl_cert_expires` metric with a threshold of 30 days." } }
    - { id: b, text: { en: "Rely on the SSL validation of the existing uptime check, which starts to fail 30 days before the certificate expires." } }
    - { id: c, text: { en: "Create a log-based alerting policy on the load balancer request logs that matches HTTP 5xx responses." } }
    - { id: d, text: { en: "Add a forecast condition on the uptime check latency metric to predict the date when the certificate expires." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      HTTPS uptime checks report the metric `monitoring.googleapis.com/uptime_check/time_until_ssl_cert_expires`, which an alerting policy can use to warn before a certificate expires. A threshold of 30 days gives the team time to renew and upload the certificate.
  options:
    b: { en: "SSL validation makes the check fail when the certificate is already expired, self-signed, or mismatched, not 30 days in advance." }
    c: { en: "5xx responses appear only after users are affected, and an expired certificate usually breaks the TLS handshake before any HTTP response." }
    d: { en: "Latency has no relation to the certificate's expiration date, so a forecast on it cannot predict expiration." }
references:
  - title: "Create public uptime checks"
    url: https://docs.cloud.google.com/monitoring/uptime-checks
