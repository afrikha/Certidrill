id: gcppca-cs2b-slo-alerting
objective: "6.2.3"
type: single
caseStudy: gcppca-cs2b-laurentide
difficulty: 2
status: draft
stem:
  en: |
    The mobile banking back end now runs on Google Cloud, and its availability SLO is defined in Cloud Monitoring. You need to replace the current alerting to meet the business requirement about alert fatigue and the mobile banking alerting requirements.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create an alerting policy that pages the on-call engineer when the ratio of failed requests exceeds 0.1 % over a five-minute window, and a second policy that opens a ticket when it exceeds 0.05 % over one hour." }
    - id: b
      text: { en: "Create an alerting policy on the SLO that pages the on-call engineer when the remaining error budget falls below 10 %, and a second policy that opens a ticket when it falls below 50 %." }
    - id: c
      text: { en: "Create two burn-rate alerting policies on the SLO: one with a short lookback period and a high threshold that pages the on-call engineer, and one with a 24-hour lookback and a low threshold that opens a ticket." }
    - id: d
      text: { en: "Create uptime checks against the public API endpoint from several regions, and an alerting policy that pages the on-call engineer when checks from at least two regions fail." }
answer: { optionId: c }
explanation:
  correct:
    en: "A burn-rate alert measures how fast the service consumes its error budget relative to the SLO, so short spikes that do not threaten the objective do not page anyone. Google recommends a fast-burn policy, for example a threshold of 10 times the baseline over one or two hours, for severe incidents, and a slow-burn policy, for example twice the baseline over 24 hours, for degradations that would exhaust the budget before the end of the period."
  options:
    a: { en: "Fixed error-ratio thresholds over short windows are what produces the current noisy alerts; they ignore how much of the error budget is actually being consumed." }
    b: { en: "Alerts on the remaining budget fire only after most of the budget is gone, so a severe incident is not paged quickly while it is still consuming the budget." }
    d: { en: "Uptime checks probe the endpoint from outside and detect total outages, but they do not measure the share of failed user requests that the SLO is based on." }
references:
  - title: Alerting on your burn rate
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/slo-monitoring/alerting-on-budget-burn-rate
