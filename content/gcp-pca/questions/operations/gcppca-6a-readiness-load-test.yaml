id: gcppca-6a-readiness-load-test
objective: "6.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A ticketing company is moving its event sales platform to GKE. When tickets for popular concerts go on sale, traffic reaches 20 times the normal load within minutes. Leadership asks for a go-live plan that follows the operational readiness recommendations of the operational excellence pillar and minimizes the risk that the first major sale fails.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Go live with cluster autoscaler and Horizontal Pod Autoscaler enabled, and rely on them to absorb the traffic of the first major sale." } }
    - { id: b, text: { en: "Keep 20 times the normal node capacity running permanently so that the cluster never needs to scale during a ticket sale." } }
    - { id: c, text: { en: "Define SLOs for the purchase flow, load test a simulated sale spike in a production-like environment, and tune scaling and quotas." } }
    - { id: d, text: { en: "Go live with a few small events, then add CPU and memory alerts after the first incident shows which resources are constrained." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Operational readiness in the pillar combines defined SLOs, performance and load testing that simulates realistic traffic to find bottlenecks, and capacity planning that covers quotas and autoscaling settings. Testing the spike before go-live shows whether autoscaling reacts fast enough and which quotas, caches, or configurations must be adjusted, so the first major sale is not the test.
  options:
    a: { en: "Autoscaling that has never been tested against a 20-times spike may react too slowly or hit quota limits during the sale." }
    b: { en: "Permanent overprovisioning is costly, contradicts the right-sizing recommendations, and still does not reveal non-capacity bottlenecks." }
    d: { en: "Waiting for an incident to discover constraints is reactive; the pillar recommends comprehensive monitoring and testing before go-live." }
references:
  - title: "Ensure operational readiness and performance using CloudOps"
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/operational-readiness-and-performance-using-cloudops
