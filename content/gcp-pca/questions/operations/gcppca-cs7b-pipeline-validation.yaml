id: gcppca-cs7b-pipeline-validation
objective: "6.5.1"
type: single
caseStudy: gcppca-cs7b-veldhaven-genomics
difficulty: 2
status: draft
stem:
  en: |
    You need to define the quality controls for changes to Veldhaven's pipelines, so that last year's silent tool update cannot happen again. The controls must meet the business requirement for pipeline changes.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Each month, compare a random sample of the variant calls produced in production with the calls of the previous month, and reanalyze the affected samples when the calls differ." } }
    - { id: b, text: { en: "Reference images by digest, and have a Cloud Build trigger run each proposed pipeline change on the reference samples and check the calls against their known variants before release." } }
    - { id: c, text: { en: "Run each new pipeline version on 10 % of the incoming participant samples, compare its calls with those of the current version, and release it to all samples if the calls agree." } }
    - { id: d, text: { en: "Require unit tests for the scripts of each pipeline step, run them with a Cloud Build trigger on every commit, and keep pushing the tool images with the latest tag." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Referencing images by digest makes every tool version an explicit change to the pipeline code, because a digest always identifies the same image while a tag such as latest can move to another image. A Cloud Build trigger on each proposed change runs the changed pipeline on the reference samples and compares its calls with their known variants, so a change that alters the results is caught before any participant sample is analyzed.
  options:
    a:
      en: A monthly comparison detects a change after participant samples were already analyzed with it, which is what forced the reanalysis of 900 samples.
    c:
      en: The new version analyzes participant samples before it is validated, and a comparison with the current version shows differences without saying which calls are correct.
    d:
      en: Unit tests of the scripts do not check the variant calls of the whole pipeline, and a latest tag can still move to a new tool version without any change to the pipeline code.
references:
  - title: Container concepts
    url: https://docs.cloud.google.com/artifact-registry/docs/container-concepts
  - title: Create and manage build triggers
    url: https://docs.cloud.google.com/build/docs/automating-builds/create-manage-triggers
