id: gcppca-cs2a-canary-release
objective: "6.3.1"
type: single
caseStudy: gcppca-cs2a-emberfall
difficulty: 1
status: draft
stem:
  en: |
    The matchmaking service of Shardline 2 will run on GKE. You need to design its release process so that it meets the technical requirements for matchmaking releases.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create a Cloud Deploy delivery pipeline with a staging target and a production target that requires approval, and use a canary strategy with 10 and 50 percent phases on the production target." }
    - id: b
      text: { en: "Create a Cloud Build trigger that runs kubectl apply on the staging cluster and then on the production clusters, with a manual approval step and a script that scales the new Deployment in steps." }
    - id: c
      text: { en: "Configure a rolling update strategy with maxSurge at 10 percent in the Deployment manifest, and have the release manager apply the manifest to the production clusters after the staging tests." }
    - id: d
      text: { en: "Deploy each new version as a second Deployment behind a separate Service, and have the release manager shift traffic to it with weighted DNS records in Cloud DNS." }
answer: { optionId: a }
explanation:
  correct:
    en: "Cloud Deploy promotes a release through the targets of a delivery pipeline in order, so every version reaches staging first. Setting requireApproval on the production target makes a user with the Cloud Deploy Approver role approve the rollout, and a canary strategy with 10 and 50 percent phases runs the new version beside the old one before the stable phase, without custom tooling."
  options:
    b: { en: "Scripting the progressive rollout in Cloud Build is the custom deployment tooling that the requirements ask to minimize." }
    c: { en: "A rolling update replaces pods continuously until the rollout ends; it does not pause at 10 and 50 percent, and nothing enforces the release manager's approval." }
    d: { en: "Two Deployments with weighted DNS is a hand-built blue-green process that relies on manual steps, and DNS caching makes the traffic split imprecise." }
references:
  - title: Use a canary deployment strategy
    url: https://docs.cloud.google.com/deploy/docs/deployment-strategies/canary
  - title: Promote your release and manage approvals
    url: https://docs.cloud.google.com/deploy/docs/promote-release
