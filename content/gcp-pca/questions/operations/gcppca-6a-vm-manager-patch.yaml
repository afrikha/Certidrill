id: gcppca-6a-vm-manager-patch
objective: "6.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company runs 900 Compute Engine VMs with Debian and Windows Server. Each month, operators connect to every VM to install OS updates, which takes several days, and the compliance team cannot see which VMs are still missing security updates. The company wants to reduce this toil by using a configuration management tool, as recommended by the operational excellence pillar.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Install the Ops Agent on every VM and create an alerting policy that fires when a VM reports pending OS updates." } }
    - { id: b, text: { en: "Add a startup script that installs all available updates, and reboot every VM on the first day of each month." } }
    - { id: c, text: { en: "Export the VM list from Cloud Asset Inventory each month and assign the patching of each VM to an operator." } }
    - { id: d, text: { en: "Set up VM Manager with the OS Config agent, schedule patch deployments in maintenance windows, and use the Patch dashboard." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The pillar recommends configuration management tools such as VM Manager to keep resources consistent and reduce manual work. VM Manager Patch applies OS patches across a set of VMs through on-demand or scheduled patch jobs (patch deployments with maintenance windows and optional pre-patch and post-patch scripts), and its dashboard reports patch compliance per VM. It requires the OS Config API and the OS Config agent.
  options:
    a: { en: "The Ops Agent collects logs, metrics, and traces; it does not install OS patches or report patch compliance." }
    b: { en: "Rebooting every VM at once to run a startup script is disruptive, gives no compliance reporting, and gives no control over maintenance windows." }
    c: { en: "Assigning VMs to operators keeps the manual toil the company wants to remove and still gives no patch compliance view." }
references:
  - title: "Automate and manage change"
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/automate-and-manage-change
  - title: "About Patch"
    url: https://docs.cloud.google.com/compute/vm-manager/docs/patch
