id: gcppca-6a-automate-runbook
objective: "6.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online education company runs batch workers on Compute Engine. When a disk-usage alert fires, the on-call engineer follows the same runbook every time: collect diagnostic logs, move old files to Cloud Storage, and post a summary in the incident channel. The alert fires about 40 times a week, and each run takes 30 minutes. Management wants to reduce this toil, as the operational excellence pillar recommends.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Send the alert to a Pub/Sub channel that triggers a Cloud Run function to run the runbook steps and post the summary." } }
    - { id: b, text: { en: "Raise the disk-usage threshold of the alerting policy so that it fires less often, and keep the manual runbook for the remaining alerts." } }
    - { id: c, text: { en: "Add engineers to the on-call rotation so that each engineer handles fewer of the weekly disk-usage alerts." } }
    - { id: d, text: { en: "Copy the runbook into the documentation of the alerting policy so that engineers find the steps faster." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The pillar recommends automating incident response with products such as Cloud Run functions and Cloud Run: automated remediation runs predefined actions, collects diagnostics, and sends notifications consistently, which reduces toil and human error. A Pub/Sub notification channel lets the alert trigger the function without a public endpoint.
  options:
    b: { en: "A higher threshold only hides alerts and risks full disks; the remaining alerts still need the same manual work." }
    c: { en: "Spreading the work across more people keeps the total toil unchanged; the pillar recommends automating repetitive tasks." }
    d: { en: "Documentation helps responders, but each engineer still performs the 30-minute procedure by hand." }
references:
  - title: "Manage incidents and problems"
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/manage-incidents-and-problems
  - title: "Create and manage notification channels"
    url: https://docs.cloud.google.com/monitoring/support/notification-options
