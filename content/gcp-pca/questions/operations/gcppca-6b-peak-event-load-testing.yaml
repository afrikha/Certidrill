id: gcppca-6b-peak-event-load-testing
objective: "6.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retailer expects five times its normal traffic during a sales event planned in six months. Its workloads run on GKE, Cloud SQL, and Memorystore in two regions. Leadership asks for a load-testing plan that follows Google's recommendations for peak events and leaves time to fix what the tests reveal.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Run one full-scale load test in production during the week before the event, when the final code is in place." } }
    - { id: b, text: { en: "Load test the development environment at one fifth of the expected traffic, and extrapolate the results linearly." } }
    - { id: c, text: { en: "Rely on the autoscaling of GKE and Cloud SQL, and run load tests only if the event traffic forecast increases." } }
    - { id: d, text: { en: "Start load testing three to five months before the event, review quota and cost impact, and request quota increases." } }
answer: { optionId: d }
explanation:
  correct:
    en: "For peak events, Google recommends load testing critical workloads three to five months ahead, reviewing the quota and cost effects of each test, analyzing results with Capacity Planner, and requesting quota increases as needed. Starting early leaves time for architecture changes, with the account team's help if required."
  options:
    a: { en: "A test one week before the event leaves no time to obtain quota increases or change the architecture if it fails." }
    b: { en: "Scaling is not always linear: bottlenecks such as databases can appear only at higher load, so extrapolation can hide them." }
    c: { en: "Autoscaling is bounded by quotas and by components that do not scale automatically, which only a load test reveals." }
references:
  - title: "Conduct load testing | Cloud Customer Care | Google Cloud Documentation"
    url: https://docs.cloud.google.com/support/docs/peak-events/conduct-load-testing
