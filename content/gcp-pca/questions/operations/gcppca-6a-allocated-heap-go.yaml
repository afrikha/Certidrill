id: gcppca-6a-allocated-heap-go
objective: "6.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company's Go service on GKE shows latency spikes that correlate with garbage collection cycles. The in-use heap stays stable at about 300 MiB, so the team does not suspect a memory leak. The team wants to find which code paths create the most work for the garbage collector.

    Which Cloud Profiler profile type should the team examine?
body:
  options:
    - { id: a, text: { en: "Heap" } }
    - { id: b, text: { en: "Threads" } }
    - { id: c, text: { en: "Contention" } }
    - { id: d, text: { en: "Allocated heap" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The allocated heap profile, available for Go, shows the total memory allocated during the collection interval, including memory that was later freed. Code that allocates a lot of short-lived memory keeps the in-use heap stable but makes the garbage collector work hard, so this profile shows which allocations cause the GC pressure.
  options:
    a: { en: "The heap profile shows memory in use at the moment of collection, which helps find leaks; short-lived allocations that were already freed do not appear." }
    b: { en: "The threads profile helps diagnose blocked threads and thread leaks, not allocation volume." }
    c: { en: "The contention profile shows time spent waiting for shared resources such as mutexes, not garbage collection work." }
references:
  - title: "Profiling concepts"
    url: https://docs.cloud.google.com/profiler/docs/concepts-profiling
