id: gcppca-6a-chargeback-budgets
objective: "6.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A gaming company has 12 product teams that share one billing account and deploy into shared projects. Finance wants to charge each team for its own Google Cloud usage every month, and each team lead must be warned before the team's monthly spending exceeds its allocation.

    Which two actions should you recommend? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create one billing account for each team and move the shared projects between billing accounts at the end of each month." } }
    - { id: b, text: { en: "Apply a team label to every resource and use the label to break down costs in Cloud Billing reports for chargeback." } }
    - { id: c, text: { en: "Create an alerting policy on the CPU utilization of each team's VMs to warn the team lead when costs start to rise." } }
    - { id: d, text: { en: "Use the right-sizing recommendations of Recommender to calculate the amount to charge each team every month." } }
    - { id: e, text: { en: "Create a billing-account budget per team, filtered on the team label, with threshold rules that notify the team lead." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      The pillar recommends tags and labels to categorize spending, Cloud Billing reports to analyze it, chargeback to recover costs from internal customers, and Cloud Billing budgets and alerts to warn stakeholders before overruns. Because the teams share projects, a label is the only way to separate their costs; budgets created at the billing account level can filter on one label each, and a linked Monitoring email channel can notify the team lead.
  options:
    a: { en: "Moving projects between billing accounts does not split costs inside a shared project and adds risky manual work every month." }
    c: { en: "CPU utilization does not measure spending, and it ignores every non-compute cost of the team." }
    d: { en: "Recommender suggests resource changes to reduce cost; it does not allocate actual charges to teams." }
references:
  - title: "Manage and optimize cloud resources"
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/manage-and-optimize-cloud-resources
  - title: "Create, edit, or delete budgets and budget alerts"
    url: https://docs.cloud.google.com/billing/docs/how-to/budgets
