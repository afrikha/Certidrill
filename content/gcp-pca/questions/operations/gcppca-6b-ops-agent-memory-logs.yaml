id: gcppca-6b-ops-agent-memory-logs
objective: "6.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Support engineers troubleshoot a Java application that runs on Compute Engine VMs. They need memory utilization metrics in Cloud Monitoring and the application's log files in Cloud Logging. The VMs currently send no telemetry from inside the guest operating system.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Install the Ops Agent on the VMs, and configure it to collect the application's log files." } }
    - { id: b, text: { en: "Enable VPC Flow Logs on the subnet of the VMs, and analyze them in Observability Analytics." } }
    - { id: c, text: { en: "Create a Cloud Monitoring uptime check on the port that the Java application listens on." } }
    - { id: d, text: { en: "Enable Data Access audit logs for the Compute Engine API in the project that contains the VMs." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The Ops Agent is the primary agent for collecting telemetry from Compute Engine VMs. It collects system metrics such as memory, disk, and process metrics without extra configuration, and it can collect file-based logs such as the application's log files and send them to Cloud Logging."
  options:
    d: { en: "Data Access audit logs record API calls that read data or configuration; they contain no guest memory metrics or application logs." }
    b: { en: "VPC Flow Logs record network flows; they do not report memory use or application log content." }
    c: { en: "An uptime check only tests whether the endpoint responds; it collects no memory metrics or logs from the VM." }
references:
  - title: "Ops Agent overview | Google Cloud Observability | Google Cloud Documentation"
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/agents/ops-agent
