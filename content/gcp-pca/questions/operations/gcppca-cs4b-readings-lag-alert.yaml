id: gcppca-cs4b-readings-lag-alert
objective: "6.2.3"
type: single
caseStudy: gcppca-cs4b-corvane-components
difficulty: 2
status: draft
stem:
  en: |
    Readings are written to BigQuery by the BigQuery subscription of the LinePulse topic. You need to create an alerting policy that meets the business requirement about the on-call engineer.

    Which condition should you use?
body:
  options:
    - { id: a, text: { en: "A metric-threshold condition that is met when subscription/num_unacked_messages_by_region of the BigQuery subscription exceeds 5 million messages for 5 minutes." } }
    - { id: b, text: { en: "A metric-absence condition that is met when the topic receives no publish requests for 10 minutes." } }
    - { id: c, text: { en: "A metric-threshold condition that is met when subscription/oldest_unacked_message_age_by_region of the BigQuery subscription exceeds 4 minutes." } }
    - { id: d, text: { en: "An uptime check that sends a request to the BigQuery API endpoint every minute and alerts when the check fails." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The age of the oldest unacknowledged message measures how far behind the subscription is in writing readings to BigQuery, whatever the number of readings published per second. Google recommends the by_region backlog metrics, and alerting well before 10 minutes leaves time to act, because backlog metrics can arrive several minutes late.
  options:
    a:
      en: A message count does not translate into a delay when the volume changes by a factor of 10 between shifts; 5 million messages is a backlog of about 40 seconds at peak but much longer at night.
    b:
      en: An absence of publish requests detects gateways that stop publishing, not readings that are published but written late to BigQuery.
    d:
      en: The BigQuery API being reachable says nothing about whether the subscription keeps up with the readings.
references:
  - title: Monitor Pub/Sub in Cloud Monitoring
    url: https://docs.cloud.google.com/pubsub/docs/monitoring
