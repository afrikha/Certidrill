id: gcppca-6a-trace-downstream
objective: "6.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company's checkout flow calls six microservices that run on Cloud Run. The 99th percentile latency of checkout rose from 300 ms to 1.2 seconds, and the team must find which downstream call adds the delay.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Enable Cloud Profiler CPU profiling on the checkout service and compare its profiles before and after the change." } }
    - { id: b, text: { en: "Instrument the services with OpenTelemetry and analyze the spans of slow checkout requests in Cloud Trace." } }
    - { id: c, text: { en: "Create an uptime check for each of the six services and compare the latency reported by the checks." } }
    - { id: d, text: { en: "Create a counter log-based metric that counts the checkout requests that each of the six services receives." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Cloud Trace is a distributed tracing system that tracks request latency across services and shows which downstream dependencies cause delays. Google recommends OpenTelemetry instrumentation, and Cloud Run also sends latency data for incoming and outgoing HTTP requests automatically. The spans of slow requests show which of the six calls adds the time.
  options:
    a: { en: "Cloud Profiler shows resource consumption inside one process; it does not break down a request's latency across six services." }
    c: { en: "Uptime checks measure synthetic availability of each endpoint, not the path and timing of real checkout requests." }
    d: { en: "Request counts show volume, not where latency is spent along the call chain." }
references:
  - title: "Cloud Trace overview"
    url: https://docs.cloud.google.com/trace/docs/overview
