id: gcppca-6a-data-access-audit
objective: "6.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legal services company stores scanned contracts in a Cloud Storage bucket. The security team must find out which users read objects in the bucket. In Logs Explorer, they find entries for bucket configuration changes but no entries for object reads.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Enable Access Transparency for the organization so that object reads by users are written to the logs." } }
    - { id: b, text: { en: "Query the _Required log bucket of the project, which stores the Data Access audit logs of Cloud Storage." } }
    - { id: c, text: { en: "Create a sink that routes the Admin Activity audit logs of Cloud Storage to a BigQuery dataset for analysis." } }
    - { id: d, text: { en: "Enable Data Access audit logs of type DATA_READ for Cloud Storage in the audit configuration of the project." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Reading object data is recorded in Data Access audit logs, which are disabled by default for every service except BigQuery. Admin Activity audit logs, which are always written, record only configuration changes, which is why the team sees bucket changes but no reads. Enabling DATA_READ Data Access logs for Cloud Storage records object reads from then on, with possible extra log charges.
  options:
    a: { en: "Access Transparency logs record actions taken by Google personnel on customer content, not reads by the company's own users." }
    b: { en: "The _Required bucket stores Admin Activity, System Event, and Access Transparency logs; Data Access logs go to _Default, and they are not written until enabled." }
    c: { en: "Admin Activity logs contain configuration changes only; routing them elsewhere does not add object reads." }
references:
  - title: "Cloud Audit Logs overview"
    url: https://docs.cloud.google.com/logging/docs/audit
