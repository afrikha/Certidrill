id: gcppca-6b-essential-contacts-folder
objective: "6.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank organizes its Google Cloud organization with one folder per business unit. Today, Google Cloud notifications about service disruptions and maintenance go to individual project owners, and several were missed after people left the company. The payments unit wants its on-call group, payments-oncall@example.com, to receive these notifications for every current and future project in the Payments folder.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Grant the group the Owner role on the Payments folder so that it receives the notifications sent to owners." } }
    - { id: b, text: { en: "In Essential Contacts, add the group at the organization level for the Billing notification category." } }
    - { id: c, text: { en: "In Essential Contacts, add the group at the Payments folder level for the Technical notification category." } }
    - { id: d, text: { en: "Add the group as a notification channel of a Cloud Monitoring alerting policy in each project of the folder." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Essential Contacts is the directory Google Cloud services use for important notifications. Technical notifications cover service disruptions, outages, and maintenance, and a contact set on a folder receives notifications for that folder and everything nested in it, including projects created later."
  options:
    a: { en: "Owner is a broad legacy basic role that violates least privilege; IAM-based recipients are only the fallback when no Essential Contact is set." }
    b: { en: "The Billing category does not carry technical notifications, and an organization-level contact would cover every business unit, not only Payments." }
    d: { en: "Alerting policies fire on your own metrics and logs; they do not deliver Google Cloud's technical notifications, and they would have to be created in every new project." }
references:
  - title: "Essential Contacts overview | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/managing-notification-contacts
