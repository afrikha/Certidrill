id: gcppca-6a-centralize-incidents
objective: "6.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company's incident responders coordinate outages in several chat groups and track their actions in personal spreadsheets. After each incident, nobody can tell who owned which task or what the status was at each point.

    Which recommendation of the Well-Architected Framework operational excellence pillar addresses this problem?
body:
  options:
    - { id: a, text: { en: "Increase the retention of the _Default log bucket so that responders can rebuild the incident timeline from logs." } }
    - { id: b, text: { en: "Centralize incident management in one system that tracks each incident's lifecycle and assigns an owner to every task." } }
    - { id: c, text: { en: "Create one chat group for each incident severity level so that conversations stay short and focused." } }
    - { id: d, text: { en: "Require every responder to email a status report to management every hour while an incident is open." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The pillar recommends centralizing incident management: one system that tracks the incident lifecycle gives visibility into status, impact, and progress, provides a shared place for communication and task management, and assigns tasks to specific people so that ownership is clear. Integration with monitoring and ticketing tools is one of the features to look for.
  options:
    a: { en: "Logs record system events, not who owns which response task; the coordination problem remains." }
    c: { en: "More chat groups fragment the information further instead of giving one view of tasks and status." }
    d: { en: "Hourly emails add work during an incident and still do not give a single, shared record of task ownership." }
references:
  - title: "Manage incidents and problems"
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/manage-incidents-and-problems
