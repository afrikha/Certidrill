id: gcppca-6b-chaos-first-experiments
objective: "6.6.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is starting a chaos engineering practice for its order platform, which runs on GKE and Cloud SQL. The VP of engineering accepts some risk, but the first experiments must not affect customers or lose data.

    Which approach follows Google-recommended practice?
body:
  options:
    - { id: a, text: { en: "Start in a staging copy of production with mild faults, increase their severity gradually, and back up the databases first." } }
    - { id: b, text: { en: "Inject faults in production without telling the monitoring team, so that the team reacts as in a real incident." } }
    - { id: c, text: { en: "Run only load tests for now, because faults cannot be injected into GKE clusters or Cloud SQL instances." } }
    - { id: d, text: { en: "Start in production with a full zone outage, because only a large failure shows the real behavior of the platform." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Google recommends running failure tests in a staging or sandbox environment that replicates production, escalating the severity of injected failures gradually, and backing up critical databases before a test. Testing in production requires automated monitoring and rollback procedures to be ready."
  options:
    d: { en: "A full zone outage in production as a first experiment is the opposite of a gradual escalation and risks customer impact." }
    b: { en: "Tests in production need automated monitoring and rollback procedures ready; hiding the test removes these safeguards." }
    c: { en: "Faults can be injected into both, for example by shutting down a node of a GKE cluster or disabling a Cloud SQL instance." }
references:
  - title: "Perform testing for recovery from failures"
    url: https://docs.cloud.google.com/architecture/framework/reliability/perform-testing-for-recovery-from-failures
