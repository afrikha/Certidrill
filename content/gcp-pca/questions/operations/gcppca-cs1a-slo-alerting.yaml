id: gcppca-cs1a-slo-alerting
objective: "6.2.3"
type: single
caseStudy: gcppca-cs1a-lumora-streaming
difficulty: 2
status: draft
stem:
  en: |
    You have defined the availability SLO of the player API in Cloud Monitoring. You need to configure alerting for this SLO. The alerting must meet the technical requirements for on-call notifications.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create one alerting policy that pages the on-call engineer when the 5xx error ratio of the player API is above 0.1 % for one minute." } }
    - { id: b, text: { en: "Create one burn-rate alerting policy with a 30-day lookback period and a threshold of 1 that pages the on-call engineer and opens a ticket." } }
    - { id: c, text: { en: "Create a burn-rate alerting policy with a 1-hour lookback period and a high threshold that pages, and a second one with a 24-hour lookback period and a lower threshold that opens a ticket." } }
    - { id: d, text: { en: "Create an uptime check on the player API from several regions, and an alerting policy that pages the on-call engineer when the check fails from two regions." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Google recommends two burn-rate policies on an SLO. A fast-burn policy with a short lookback period and a high threshold catches outages that would exhaust the error budget soon, so it pages. A slow-burn policy with a 24-hour lookback period and a moderately elevated threshold catches degradations that would exhaust the budget before the end of the period, so a ticket is enough. Thresholds well above 1 avoid alerts on short spikes.
  options:
    a:
      en: A one-minute error-ratio threshold pages on short spikes that do not threaten the SLO, and it misses slow degradations below the threshold.
    b:
      en: A burn-rate alert cannot use a lookback period longer than 24 hours, and a single policy cannot both page quickly on outages and only open tickets for slow burns.
    d:
      en: An uptime check detects a complete outage only; it measures neither the error budget nor a slow degradation of the requests.
references:
  - title: Alerting on your burn rate
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/slo-monitoring/alerting-on-budget-burn-rate
