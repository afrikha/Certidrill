id: gcppca-6b-quality-gates-checkout
objective: "6.5.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retail company releases its checkout service several times a week. Recently, defects reached production because changes were deployed without automated tests, and broken checkout flows (sign-in, cart, payment) were reported by customers hours later. You need to catch defects before release and to detect a broken multi-step checkout flow in production within minutes.

    Which two measures should you implement?

    Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a public uptime check on the checkout home page, and alert when the check fails." } }
    - { id: b, text: { en: "Enable Data Access audit logs for the services that the checkout project uses." } }
    - { id: c, text: { en: "Run unit and integration tests as Cloud Build steps on every change, failing the build on any failure." } }
    - { id: d, text: { en: "Raise the maximum number of instances of the checkout service ahead of each release." } }
    - { id: e, text: { en: "Create a synthetic monitor that runs a scripted checkout flow on a schedule, and alert on failures." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Automated unit and integration tests in the CI pipeline stop a defective change before it is deployed, because a failing test step fails the build. A Cloud Monitoring synthetic monitor runs a sequence of tests, such as a login and checkout flow, on a schedule and alerts when it fails, so a broken flow in production is detected within minutes."
  options:
    a: { en: "An uptime check sends one request to one URL; the home page can answer while sign-in, cart, or payment are broken." }
    b: { en: "Data Access audit logs record who accessed data; they do not test the application or detect broken flows." }
    d: { en: "More instances add capacity; they neither test changes nor detect functional defects." }
references:
  - title: "Synthetic monitoring overview | Cloud Monitoring | Google Cloud Documentation"
    url: https://docs.cloud.google.com/monitoring/uptime-checks/introduction
  - title: "Build configuration file schema | Google Cloud Documentation"
    url: https://docs.cloud.google.com/build/docs/build-config-file-schema
