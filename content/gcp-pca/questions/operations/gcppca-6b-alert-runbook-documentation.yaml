id: gcppca-6b-alert-runbook-documentation
objective: "6.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An on-call team receives Cloud Monitoring alerts for a fleet of Compute Engine VMs through PagerDuty and email. Responders lose time finding which VM triggered an alert and which runbook to follow. You need every notification to show the ID of the affected VM and a link to the matching runbook, with the least effort.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Add documentation to the alerting policy, with the `${resource.label.instance_id}` variable and a Markdown link to the runbook." } }
    - { id: b, text: { en: "Create a log-based metric that extracts the VM ID, and add it as a second condition of the alerting policy." } }
    - { id: c, text: { en: "Send the alerts to Pub/Sub, and write a Cloud Run function that adds the runbook link before forwarding them." } }
    - { id: d, text: { en: "Add a label with the runbook name to each VM so that the alert notifications display the label value." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Alerting policy documentation is added to notifications in PagerDuty, email, and other channels. It supports a subset of Markdown, including links, and variables such as `${resource.label.instance_id}` that are replaced with values from the alert when the notification is sent."
  options:
    b: { en: "A second condition changes when the policy fires; it does not add the VM ID or a runbook link to the notification text." }
    c: { en: "A custom forwarding function could enrich messages, but it adds code to build and maintain when built-in documentation does the job." }
    d: { en: "VM labels do not appear in notifications by themselves; they would still have to be referenced in the policy documentation." }
references:
  - title: "Annotate notifications with user-defined documentation"
    url: https://docs.cloud.google.com/monitoring/alerts/doc-variables
