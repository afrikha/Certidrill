id: gcppca-6b-region-failover-drill
objective: "6.6.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A bank runs an active-passive application in us-east1 and us-central1 behind a global external Application Load Balancer, with its databases replicated to us-central1. The application's recovery point objective (RPO) is 5 minutes and its recovery time objective (RTO) is 30 minutes. You must design a regional failover drill that follows the Google Cloud Well-Architected Framework.

    Which two actions should the drill include?

    Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Simulate the loss of us-east1 with firewall rules or API restrictions, and check that health checks move the traffic." } }
    - { id: b, text: { en: "Delete the us-east1 production project so that the simulated outage is as realistic as possible." } }
    - { id: c, text: { en: "Measure the actual recovery time and replication lag against the RTO and RPO, and document every gap." } }
    - { id: d, text: { en: "Run the drill only once, before go-live, so that later drills do not put production at risk." } }
    - { id: e, text: { en: "Ask Cloud Customer Care to take us-east1 offline for the bank's projects during the drill." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "The framework recommends simulating a region-wide outage with firewall rules or API restrictions and confirming that load balancers and health checks shift traffic to the failover region. It also recommends checking that data is replicated recently enough to meet the RPO, measuring recovery time against the RTO, and documenting gaps to update playbooks."
  options:
    b: { en: "Deleting a production project is destructive and irreversible; a drill simulates the outage in a way that can be reverted." }
    d: { en: "Failover tests should run periodically, for example quarterly, because the architecture and the team change over time." }
    e: { en: "Customer Care does not take regions offline for customers; the drill must simulate the outage with your own controls." }
references:
  - title: "Perform testing for recovery from failures"
    url: https://docs.cloud.google.com/architecture/framework/reliability/perform-testing-for-recovery-from-failures
