id: gcppca-cs5c-pipeline-alerting
objective: "6.2.3"
type: single
caseStudy: gcppca-cs5c-ashgrove-power
difficulty: 2
status: draft
stem:
  en: |
    You need to define the alerting for the meter readings pipeline. The alerting must meet the technical requirement about readings in the streaming pipeline.

    Which alerting policy should you create?
body:
  options:
    - { id: a, text: { en: "An alert on the number of undelivered messages of the Pub/Sub subscription, triggered when the backlog exceeds 2 million messages." } }
    - { id: b, text: { en: "An alert on the CPU utilization of the Dataflow workers, triggered when it stays above 80 % for 20 minutes." } }
    - { id: c, text: { en: "An alert on the system lag of the Dataflow job, triggered when it stays above 20 minutes for 5 minutes." } }
    - { id: d, text: { en: "A log-based alert on the Dataflow worker logs, triggered when an entry with severity ERROR is written." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The system lag of a Dataflow streaming job is the maximum time that data has been waiting for processing across the pipeline, in seconds, and Cloud Monitoring can alert on it with a threshold. It measures the delay itself, so a half-hourly burst that is absorbed within 10 minutes stays under the 20-minute threshold and does not trigger an alert.
  options:
    a:
      en: Every half-hourly burst puts about 4.5 million messages in the backlog, so a count threshold of 2 million fires twice an hour although the readings are processed in time.
    b:
      en: High CPU is expected while the job autoscales during each burst; CPU utilization does not tell how long readings have been waiting.
    d:
      en: Errors in the logs do not measure delay; the pipeline can fall behind without writing errors, and transient errors that are retried would page the team for nothing.
references:
  - title: Use Cloud Monitoring for Dataflow pipelines
    url: https://docs.cloud.google.com/dataflow/docs/guides/using-cloud-monitoring
