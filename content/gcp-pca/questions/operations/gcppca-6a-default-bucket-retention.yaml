id: gcppca-6a-default-bucket-retention
objective: "6.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare analytics company stores the application logs of its production project in the _Default log bucket. A new internal policy requires that these application logs remain searchable in Logs Explorer for 365 days. The company wants the simplest change.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Change the retention period of the _Required log bucket of the project to 365 days." } }
    - { id: b, text: { en: "Create a sink that routes the application logs to a Cloud Storage bucket with a 365-day retention policy." } }
    - { id: c, text: { en: "Change the retention period of the _Default log bucket of the project to 365 days." } }
    - { id: d, text: { en: "Create a log-based metric for each application log so that the log data is kept for 365 days." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For a project, the retention of the _Default bucket is configurable from 1 to 3,650 days (30 days by default), so setting it to 365 days keeps the application logs searchable in Logs Explorer with one change. Retention beyond 30 days is billed per GiB per month.
  options:
    a: { en: "The _Required bucket has a fixed 400-day retention that cannot be changed, and it stores only Admin Activity, System Event, and Access Transparency logs, not application logs." }
    b: { en: "Logs routed to Cloud Storage are no longer searchable in Logs Explorer, which the policy requires." }
    d: { en: "A log-based metric stores time-series counts or distributions, not the log entries, and it is not populated retroactively." }
references:
  - title: "Quotas and limits"
    url: https://docs.cloud.google.com/logging/quotas
  - title: "Configure log buckets"
    url: https://docs.cloud.google.com/logging/docs/buckets
