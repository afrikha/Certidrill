id: gcppca-cs3b-season-load-test
objective: "6.6.1"
type: single
caseStudy: gcppca-cs3b-norvale-revenue
difficulty: 2
status: draft
stem:
  en: |
    The new e-filing portal will go live three months before the next filing season. The Commissioner General asks for evidence, before the season starts, that the portal and its dependencies meet the technical requirement for the load of the portal services. Taxpayers must not be affected by the test, and no real taxpayer data may be used.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Run a load test against production on a weekend night at 40 times the average load, signing in with a sample of real taxpayer accounts so that the test exercises real data." } }
    - { id: b, text: { en: "Run a load test at the average load against a staging environment, and extrapolate the measured latency and resource use to 40 times that load." } }
    - { id: c, text: { en: "Run the unit and integration tests of every portal service in the CI pipeline at each commit, and fail the build when a test exceeds its latency target." } }
    - { id: d, text: { en: "Deploy a staging environment from the same infrastructure-as-code templates as production, review its quotas and scaling limits, and replay the traffic profile of the last filing day at 40 times the average load with synthetic accounts." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A load test is only conclusive at the target load and on an environment that matches production, so the staging environment is built from the same templates and tested with the traffic profile of the busiest day at 40 times the average. Reviewing quotas and scaling limits beforehand, and using synthetic accounts, finds the limits of every dependency without touching taxpayers or their data.
  options:
    a:
      en: Testing production can degrade the service for taxpayers who file at night, and signing in with real taxpayer accounts uses real taxpayer data.
    b:
      en: Systems do not scale linearly; quotas, connection limits and scaling delays appear only at high load, so a test at the average load proves nothing about 40 times that load.
    c:
      en: Unit and integration tests check the behavior of each service, not the capacity of the whole portal and its dependencies under the season's load.
references:
  - title: Ensure operational readiness and performance using CloudOps
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/operational-readiness-and-performance-using-cloudops
