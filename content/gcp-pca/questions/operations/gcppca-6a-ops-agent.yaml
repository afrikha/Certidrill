id: gcppca-6a-ops-agent
objective: "6.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An engineering company runs a custom Java application on a fleet of Compute Engine VMs. The operations team needs guest OS memory utilization and disk usage metrics in Cloud Monitoring, and the application's log files in Cloud Logging.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Enable Google Cloud Managed Service for Prometheus managed collection in the project that hosts the VMs." } }
    - { id: b, text: { en: "Install the Ops Agent on the VMs, for example by creating an agent policy for the fleet." } }
    - { id: c, text: { en: "Do nothing, because Compute Engine sends guest disk usage metrics and application log files by default." } }
    - { id: d, text: { en: "Enable VPC Flow Logs on the subnet that hosts the VMs and create log-based metrics from the flow logs." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Ops Agent is the primary agent for collecting telemetry from Compute Engine instances: it collects logs with Fluent Bit and metrics and traces with the OpenTelemetry Collector, including guest OS metrics such as memory and disk usage and third-party application logs. Agent policies install and manage it across a fleet of VMs.
  options:
    a: { en: "Managed collection for Managed Service for Prometheus is designed for Kubernetes environments and does not collect VM log files." }
    c: { en: "Without an agent, Compute Engine does not collect guest file system usage or the application's log files; the Ops Agent collects them." }
    d: { en: "VPC Flow Logs record network flows; they contain neither guest memory metrics nor application logs." }
references:
  - title: "Ops Agent overview"
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/agents/ops-agent
