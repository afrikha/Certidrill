id: gcppca-6a-capacity-future-res
objective: "6.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company will launch an AI video-enhancement feature in seven months. The launch needs 64 A3 High VMs in us-central1 for at least one year, and the operations team is worried that the GPU capacity will not be available on launch day. The company wants to follow the capacity planning recommendations of the Well-Architected Framework.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Submit a future reservation request for the A3 High VMs with a start time before the launch date." } }
    - { id: b, text: { en: "Configure a managed instance group with autoscaling so that it creates the GPU VMs when launch traffic arrives." } }
    - { id: c, text: { en: "Plan to run the launch fleet on Spot VMs so that the GPUs cost less during the first year." } }
    - { id: d, text: { en: "Check that the project has enough GPU and VM quota well before the start time, and request quota adjustments early." } }
    - { id: e, text: { en: "Wait until the week before launch, then create on-demand reservations if capacity is still available in the zone." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      The pillar recommends planning capacity ahead for critical hardware such as GPUs by using future reservations, which can be requested up to a year in advance, and estimating quota needs early so that increases are requested before they are needed. Approved future reservations are not a quota grant: Compute Engine might provision only part of the capacity if the project lacks quota at the start time, so both actions are needed.
  options:
    b: { en: "Autoscaling adds VMs only if capacity exists when traffic arrives; it does not secure scarce GPU capacity in advance." }
    c: { en: "Spot VMs can be preempted at any time and have no availability guarantee, which is unsuitable for a production launch that must have capacity." }
    e: { en: "Waiting until the last week gives no assurance that GPU capacity will be available; the pillar recommends planning hard-to-obtain capacity well in advance." }
references:
  - title: "Ensure operational readiness and performance using CloudOps"
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/operational-readiness-and-performance-using-cloudops
  - title: "About future reservation requests"
    url: https://docs.cloud.google.com/compute/docs/instances/future-reservations-overview
