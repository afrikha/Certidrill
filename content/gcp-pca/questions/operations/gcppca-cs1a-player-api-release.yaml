id: gcppca-cs1a-player-api-release
objective: "6.3.1"
type: single
caseStudy: gcppca-cs1a-lumora-streaming
difficulty: 2
status: draft
stem:
  en: |
    The player API now runs on Cloud Run. You need to design the release process of the player API to production. The process must meet the technical requirements for releases.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Create a Cloud Build pipeline whose steps deploy a new revision with no traffic and then run gcloud run services update-traffic to send 10 %, 50 % and 100 % of the requests to it after manual approval of the build." } }
    - { id: b, text: { en: "Create a Cloud Deploy delivery pipeline whose production target requires approval and uses the standard deployment strategy, and deploy each approved release to all requests at once." } }
    - { id: c, text: { en: "Deploy each release as a new Cloud Run service behind a global external Application Load Balancer, and change the weights of the two backend services after the release manager approves." } }
    - { id: d, text: { en: "Create a Cloud Deploy delivery pipeline whose production target requires approval and whose stage uses a canary strategy with the percentages 10 and 50 before the stable phase." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Cloud Deploy target with requireApproval holds every rollout to production until a principal with the Cloud Deploy Approver role approves it. A canary strategy on a Cloud Run target makes Cloud Deploy split the traffic between the old and new revisions in phases of 10 % and 50 % before the stable phase at 100 %, with no traffic-management script to maintain.
  options:
    a:
      en: Calling update-traffic from build steps is a custom traffic-management script that the team must write and maintain.
    b:
      en: The standard strategy sends all requests to the new release at once, so a faulty release still affects every subscriber.
    c:
      en: Changing backend weights by hand or by script is custom traffic management, and running each release as a separate service adds work that Cloud Run revisions already avoid.
references:
  - title: Use a canary deployment strategy
    url: https://docs.cloud.google.com/deploy/docs/deployment-strategies/canary
  - title: Promote your release and manage approvals
    url: https://docs.cloud.google.com/deploy/docs/promote-release
