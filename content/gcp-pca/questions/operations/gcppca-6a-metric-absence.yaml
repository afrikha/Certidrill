id: gcppca-6a-metric-absence
objective: "6.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A billing company runs a message-processing worker on Compute Engine that writes the custom metric `custom.googleapis.com/worker/heartbeat` every minute while it is healthy. Last month, the worker process hung and stopped writing the metric while the VM stayed up with low CPU, and no alert fired for six hours. The team wants an alert when the worker stops reporting.

    Which condition should you configure?
body:
  options:
    - { id: a, text: { en: "A metric-threshold condition that is met when the heartbeat value is below 1 for 10 minutes." } }
    - { id: b, text: { en: "A forecast condition that predicts when the heartbeat metric will stop being reported." } }
    - { id: c, text: { en: "A metric-absence condition that is met when no heartbeat data arrives for 10 minutes." } }
    - { id: d, text: { en: "An uptime check that tests TCP port 22 on the external IP address of the worker VM." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A metric-absence condition is met when no data arrives for a time series during the retest window, which is exactly what happens when the hung worker stops writing its heartbeat. Monitoring then opens an alert even though the VM itself looks healthy.
  options:
    a: { en: "When the worker stops writing, there are no values to compare with the threshold; with the default missing-data handling, no new alert opens." }
    b: { en: "Forecast conditions predict threshold violations from existing data; they do not detect that data stopped arriving." }
    d: { en: "The VM and its SSH port stayed up while the process hung, so the uptime check would keep passing." }
references:
  - title: "Behavior of metric-based alerting policies"
    url: https://docs.cloud.google.com/monitoring/alerts/concepts-indepth
