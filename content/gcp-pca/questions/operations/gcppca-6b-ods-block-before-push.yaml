id: gcppca-6b-ods-block-before-push
objective: "6.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A fintech company builds its container images with Cloud Build and stores them in an Artifact Registry repository used by production. The security team requires that no image with a CRITICAL or HIGH vulnerability is ever stored in that repository.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Enable automatic scanning on the repository, and have the security team review the vulnerability findings every week." } }
    - { id: b, text: { en: "Add build steps that scan the image with On-Demand Scanning and fail the build on CRITICAL or HIGH findings before the push step." } }
    - { id: c, text: { en: "Enable automatic scanning on the repository, and add a cleanup policy that deletes images with critical findings." } }
    - { id: d, text: { en: "Enable Binary Authorization on the production clusters with a policy that requires an attestation for each image." } }
answer: { optionId: b }
explanation:
  correct:
    en: "On-Demand Scanning can scan an image inside a Cloud Build pipeline before it is pushed. A step that lists the vulnerabilities and exits with an error when a severity matches `CRITICAL|HIGH` fails the build, so the push step never runs and the image never reaches the repository."
  options:
    a: { en: "Automatic scanning runs when an image is uploaded, so a vulnerable image is already stored before anyone reviews the findings." }
    c: { en: "Cleanup policies select images by conditions such as tags, versions, and age, not by vulnerabilities, and the image would be stored first anyway." }
    d: { en: "Binary Authorization blocks deployment of non-compliant images; it does not stop them from being stored in the repository." }
references:
  - title: "Use On-Demand Scanning in your Cloud Build pipeline | Artifact Analysis | Google Cloud Documentation"
    url: https://docs.cloud.google.com/artifact-analysis/docs/ods-cloudbuild
