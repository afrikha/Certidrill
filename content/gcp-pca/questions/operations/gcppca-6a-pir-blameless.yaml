id: gcppca-6a-pir-blameless
objective: "6.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A payments company restored its checkout service after a two-hour outage. The same failure had already caused two shorter outages in the previous quarter. The VP of engineering wants to follow the operational excellence pillar of the Google Cloud Well-Architected Framework to stop the failure from recurring.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Run a blameless post-incident review that finds the root cause and contributing factors and shares the actions." } }
    - { id: b, text: { en: "Review the outage only if it breached the contractual SLA, and close the incident ticket otherwise." } }
    - { id: c, text: { en: "Identify the engineer whose change triggered the outage and remove that engineer's production deployment permissions." } }
    - { id: d, text: { en: "Add two engineers to the on-call rotation so that the next occurrence of the failure is resolved faster." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The operational excellence pillar recommends a post-incident review (postmortem) after every incident: build a timeline, perform root cause analysis that covers both the immediate cause and systemic issues, document the recommended actions, and share them with stakeholders. It also asks for a blameless culture so that people report problems without fear. A recurring failure is exactly what this review is meant to eliminate.
  options:
    b: { en: "The pillar recommends a review after every incident, not only after contractual SLA breaches; skipping reviews leaves the root cause in place." }
    c: { en: "Blaming an individual contradicts the blameless culture the pillar recommends and does not address the systemic cause of a failure that happened three times." }
    d: { en: "More responders may shorten recovery, but they do not identify or remove the root cause, so the failure keeps recurring." }
references:
  - title: "Manage incidents and problems"
    url: https://docs.cloud.google.com/architecture/framework/operational-excellence/manage-incidents-and-problems
