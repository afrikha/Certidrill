id: gcppca-6b-mig-canary-template
objective: "6.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company runs its matchmaking backend on a regional managed instance group (MIG) of 40 VMs created from the instance template mm-v1. A new template, mm-v2, must first run on about 10% of the VMs while the other VMs keep mm-v1, so that the team can compare error rates before a full rollout.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Run `rolling-action start-update` with `--version=template=mm-v2` and `--max-unavailable=10%`." } }
    - { id: b, text: { en: "Run `rolling-action start-update` with `--version=template=mm-v1` and `--canary-version=template=mm-v2,target-size=10%`." } }
    - { id: c, text: { en: "Set the MIG's update type to opportunistic, then set mm-v2 as the instance template of the group." } }
    - { id: d, text: { en: "Run `rolling-action replace` with `--max-unavailable=10%` after you create the mm-v2 template." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A canary update gives the MIG two instance templates: the current one in `--version` and the new one in `--canary-version` with a target size, here 10% (4 VMs). The rest of the group keeps mm-v1. To finish the rollout, you run `start-update` again with only `--version=template=mm-v2`."
  options:
    a: { en: "`--max-unavailable` only limits how many VMs are offline at a time; the update still moves all 40 VMs to mm-v2." }
    c: { en: "An opportunistic update applies the new template only to VMs that are recreated or updated manually, so the share of mm-v2 VMs is not controlled." }
    d: { en: "`rolling-action replace` recreates VMs from the template the group already uses, so no VM receives mm-v2." }
references:
  - title: "Automatically apply VM configuration updates in a MIG | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instance-groups/rolling-out-updates-to-managed-instance-groups
