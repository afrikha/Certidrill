id: gcppca-6b-error-budget-release-gate
objective: "6.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company defines a 99.9% availability SLO for its public API in Cloud Monitoring, over a rolling 28-day period. Product teams ship new features every week. The SRE team wants an objective measure, agreed with the product teams, that decides when risky releases must pause.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Pause feature releases whenever the API returns any HTTP 5xx error, and resume them after a full day without errors." } }
    - { id: b, text: { en: "Raise the SLO to 100% so that no release can ever be allowed to reduce the availability of the API." } }
    - { id: c, text: { en: "Pause feature releases when the remaining error budget of the SLO is close to depleted, and resume them when it recovers." } }
    - { id: d, text: { en: "Pause feature releases when the average CPU utilization of the API's backends rises by more than 10% after a release." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The error budget is the share of events allowed to fail under the SLO, here 0.1% over 28 days. Google's guidance is to use it to manage risky actions such as deploying new versions: while budget remains, teams can release; when it is close to depleted, pushing updates risks violating the SLO, so releases pause."
  options:
    a: { en: "A single error is expected under a 99.9% SLO; this rule ignores the error budget and would stop releases for no user-visible reason." }
    b: { en: "A 100% target leaves no error budget at all, which is unrealistic and would block every release." }
    d: { en: "CPU utilization is not a measure of user experience; releases can be healthy with more CPU or harmful with less." }
references:
  - title: "Concepts in service monitoring | Google Cloud Observability | Google Cloud Documentation"
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/slo-monitoring
