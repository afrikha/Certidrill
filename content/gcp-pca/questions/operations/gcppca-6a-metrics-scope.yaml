id: gcppca-6a-metrics-scope
objective: "6.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A bank's platform team operates 40 projects. It wants one place to build dashboards and alerting policies that cover metrics from all 40 projects, without charts that mix in metrics of the project that hosts the dashboards. Analysts must be able to view these dashboards without being granted any role on the 40 projects.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a new project with no workloads and add the 40 projects to its metrics scope." } }
    - { id: b, text: { en: "Grant the analysts the Monitoring Viewer role (roles/monitoring.viewer) on each of the 40 projects." } }
    - { id: c, text: { en: "Create an aggregated sink at the folder level that routes the metrics of the 40 projects to a new project." } }
    - { id: d, text: { en: "Grant the analysts the Monitoring Viewer role (roles/monitoring.viewer) on the new scoping project." } }
    - { id: e, text: { en: "Make one of the 40 projects a Shared VPC host project and attach the 39 other projects to it." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A scoping project's metrics scope defines which projects' time-series data it can chart and alert on, and it stores the dashboards and alerting policies. Google recommends a dedicated scoping project without resources so that its own data does not appear in charts. Viewing the data of the whole metrics scope requires only the Monitoring Viewer role on the scoping project.
  options:
    b: { en: "Granting roles on the 40 projects is unnecessary and violates the requirement that analysts receive no role on those projects." }
    c: { en: "Sinks route log entries, not metrics; metrics are combined across projects through a metrics scope." }
    e: { en: "Shared VPC shares networks between projects; it does not combine monitoring data." }
references:
  - title: "Metrics scopes overview"
    url: https://docs.cloud.google.com/monitoring/settings
