id: gcppca-6b-build-allowfailure-tests
objective: "6.5.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team's `cloudbuild.yaml` has a step that runs the unit tests, followed by a step that builds the container image and a step that pushes it to Artifact Registry. Last week, an image whose unit tests failed was pushed and deployed, and the build was reported as successful. You find that the test step was defined with `allowFailure: true` during a migration several months ago.

    You need failing unit tests to stop the image from being pushed. What should you do?
body:
  options:
    - { id: a, text: { en: "Add `waitFor: ['-']` to the push step so that it waits for the result of the test step before it runs." } }
    - { id: b, text: { en: "Move the test step after the push step so that the tests always run against the exact image that was pushed." } }
    - { id: c, text: { en: "Remove `allowFailure: true` from the test step so that a non-zero exit code of the tests fails the build." } }
    - { id: d, text: { en: "Require approval on the build trigger so that a reviewer checks the test results before each build runs." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With `allowFailure: true`, a failed step does not fail the build, so the later steps still run. Without it, a test step that exits with a non-zero code fails the build, and the following steps, which by default wait for all previous steps to succeed, never push the image."
  options:
    a: { en: "`waitFor: ['-']` makes a step start at the beginning of the build without waiting for any other step, which makes the problem worse." }
    b: { en: "Running the tests after the push means a failing image is already stored in the registry before the tests report a failure." }
    d: { en: "A build approval is given before the build starts, when no test result exists yet; it does not stop a failed test from being ignored." }
references:
  - title: "Build configuration file schema | Google Cloud Documentation"
    url: https://docs.cloud.google.com/build/docs/build-config-file-schema
  - title: "Configuring the order of build steps | Cloud Build | Google Cloud Documentation"
    url: https://docs.cloud.google.com/build/docs/configuring-builds/configure-build-step-order
