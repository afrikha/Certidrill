id: gcppca-6b-cloudsql-failover-drill
objective: "6.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company runs its policy database on a Cloud SQL for MySQL instance configured for high availability, with a cross-region read replica for disaster recovery. A quarterly drill must prove that the application reconnects automatically when the primary zone fails, and must measure the downtime. The drill must not break the replication to the cross-region replica.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Promote the cross-region read replica during the drill, and measure the time until the application serves requests again." } }
    - { id: b, text: { en: "Restart the primary instance with `gcloud sql instances restart`, and measure the time until the application serves requests again." } }
    - { id: c, text: { en: "Run `gcloud sql instances failover` on the primary instance, and measure the time until the application serves requests again." } }
    - { id: d, text: { en: "Delete the standby instance of the primary during the drill, and measure the time until Cloud SQL recreates it in another zone." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A manual failover makes the standby in the other zone the new primary, which is what happens when the primary zone fails. Clients reconnect through the same IP address and connection string, so the drill proves automatic reconnection; failover typically makes the instance unavailable for about a minute, which the team measures."
  options:
    a: { en: "Promoting the replica tests the regional disaster recovery plan, not zonal failover, and it ends replication to that replica." }
    b: { en: "A restart drains the connections, stops the instance and starts it again; it is a different operation from a failover, so it does not prove that the standby takes over when the primary zone fails." }
    d: { en: "The standby is not a separate instance that you can delete; Cloud SQL manages it as part of the high-availability configuration." }
references:
  - title: "About high availability | Cloud SQL for MySQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sql/docs/mysql/high-availability
  - title: "Enable and disable high availability | Cloud SQL for MySQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sql/docs/mysql/configure-ha
