id: gcppca-6b-patch-mig-excluded
objective: "6.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses a VM Manager patch deployment to apply OS patches every week to the Compute Engine VMs of a project. All VMs run the OS Config agent. Patch compliance reports show that the standalone VMs are patched, but the VMs of the managed instance group (MIG) that runs the web tier are not. The web tier must be patched with minimal disruption, and VMs that the MIG recreates later, for example after autohealing, must also be patched.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Add the names of the MIG's VMs to the instance filter of the weekly patch deployment so that the patch jobs include them." } }
    - { id: b, text: { en: "Build a patched image, create a new instance template from it, and roll the template out to the MIG with a rolling update." } }
    - { id: c, text: { en: "Reinstall the OS Config agent on the MIG's VMs, then run a one-time patch job that targets the zones of the web tier." } }
    - { id: d, text: { en: "Add a pre-patch script to the patch deployment that removes each VM from the MIG before it is patched." } }
answer: { optionId: b }
explanation:
  correct:
    en: "By default, VM Manager patch jobs exclude VMs that belong to a MIG. A MIG recreates VMs from its instance template, so the template must carry the patches: a new image and template rolled out with a rolling update patch the current VMs with controlled disruption and every VM created later."
  options:
    a: { en: "Even if patch jobs reached the MIG's VMs, any VM recreated by autohealing or a resize would start again from the unpatched template." }
    c: { en: "The agent is already installed; the VMs are skipped because they belong to a MIG, and a patch job would not fix the template either." }
    d: { en: "Removing VMs from the MIG breaks its autohealing and scaling, and new VMs created by the MIG would still use the unpatched template." }
references:
  - title: "About Patch | VM Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/os-patch-management
  - title: "Automatically apply VM configuration updates in a MIG | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instance-groups/rolling-out-updates-to-managed-instance-groups
