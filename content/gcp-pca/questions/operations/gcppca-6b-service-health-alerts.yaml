id: gcppca-6b-service-health-alerts
objective: "6.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The operations team of an e-commerce company wants to be notified on their mobile devices whenever Google Cloud creates or updates an incident that affects the products and locations their projects use. They no longer want to check a public status page by hand.

    What should you use?
body:
  options:
    - { id: a, text: { en: "Cloud Monitoring uptime checks against the public endpoints of the Google Cloud APIs that the projects call." } }
    - { id: b, text: { en: "Personalized Service Health, with an alerting policy on its incident logs and a mobile notification channel." } }
    - { id: c, text: { en: "A log sink that routes the Admin Activity audit logs of the projects to a Pub/Sub topic for the team." } }
    - { id: d, text: { en: "Error Reporting notifications for new errors in the applications that run in the projects." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Personalized Service Health lists the Google Cloud incidents relevant to your projects, with the affected products and locations, and it is the primary channel for incident information. Its alerts, built on logs in Cloud Logging, can notify the team when incidents are created or updated, including on a mobile device."
  options:
    a: { en: "Uptime checks test the availability of endpoints you choose; they do not report Google Cloud incidents or their scope." }
    c: { en: "Admin Activity audit logs record administrative actions on your resources, not incidents declared by Google Cloud." }
    d: { en: "Error Reporting groups errors produced by your own applications; it does not tell the team about Google Cloud incidents." }
references:
  - title: "Personalized Service Health overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/service-health/docs/overview
