id: gcppca-6a-java-heap-sampling
objective: "6.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team enabled Cloud Profiler for a Java 17 application on Compute Engine by adding `-agentpath:/opt/cprof/profiler_java_agent.so=-cprof_service=billing-api` to the JVM startup command. CPU time and wall time profiles appear in the Profiler interface, but the Heap profile type is not available for the service.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Add `-cprof_enable_heap_sampling=true` to the agent options and restart the application." } }
    - { id: b, text: { en: "Grant the Cloud Profiler Agent role (roles/cloudprofiler.agent) to the VM's service account." } }
    - { id: c, text: { en: "Upgrade the application to Java 21, because heap profiling needs the latest Java LTS version." } }
    - { id: d, text: { en: "Enable a second Cloud Profiler API in the project, because heap profiles use a separate API." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Heap profiling for Java is disabled by default; it is enabled with the agent option `-cprof_enable_heap_sampling=true` and requires Java 11 or later, which Java 17 satisfies. The agent picks up the option when the application restarts.
  options:
    b: { en: "CPU and wall time profiles already arrive, so the service account can write profiles; a missing role would stop all profile data." }
    c: { en: "Heap profiling requires Java 11 or later, so Java 17 is supported." }
    d: { en: "All profile types use the same Cloud Profiler API, which is already enabled because other profiles arrive." }
references:
  - title: "Profiling Java applications"
    url: https://docs.cloud.google.com/profiler/docs/profiling-java
