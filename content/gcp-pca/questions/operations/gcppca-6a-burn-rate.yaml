id: gcppca-6a-burn-rate
objective: "6.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company has an availability SLO of 99.9% over a rolling 30-day period for its public API, defined in Cloud Monitoring. The SRE team wants to page on-call engineers quickly when a sudden outage would exhaust the error budget within hours, and to open a lower-priority ticket when a gradual degradation would exhaust the budget before the end of the period.

    Which alerting configuration should you recommend?
body:
  options:
    - { id: a, text: { en: "One burn-rate alerting policy with a 30-day lookback period and a threshold of 1 that both pages engineers and opens a ticket." } }
    - { id: b, text: { en: "A fast-burn policy with a 24-hour lookback and a threshold of about 10 that pages, plus a slow-burn policy with a 1-hour lookback and a threshold of about 2." } }
    - { id: c, text: { en: "A fast-burn policy with a 1-hour lookback and a threshold of about 10 that pages, plus a slow-burn policy with a 24-hour lookback and a threshold of about 2." } }
    - { id: d, text: { en: "A metric-threshold policy that pages when the error rate exceeds 0.1% for one minute, plus a weekly report on SLO compliance." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Google recommends both a fast-burn and a slow-burn policy. Fast-burn uses a short lookback (1 to 2 hours) and a high threshold, about 10 times the baseline, to catch sudden spikes that would exhaust the budget soon; slow-burn uses a 24-hour lookback and a threshold of about 2 to catch consumption that would exhaust the budget before the period ends, which is less urgent.
  options:
    a: { en: "Burn-rate alerts cannot use a lookback longer than 24 hours, and a single policy cannot separate urgent pages from lower-priority tickets." }
    b: { en: "The lookbacks are reversed: a 24-hour lookback reacts too slowly to page on a sudden outage, and a 1-hour lookback is too sensitive for slow burns." }
    d: { en: "Paging on any one-minute excursion above the SLO error rate creates noisy pages and does not measure error budget consumption." }
references:
  - title: "Alerting on your burn rate"
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/slo-monitoring/alerting-on-budget-burn-rate
