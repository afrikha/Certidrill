id: gcppca-6b-mig-zero-capacity-loss
objective: "6.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A payment processor runs a zonal managed instance group (MIG) of 12 VMs that is sized exactly to its peak load. The team must roll out a new instance template during business hours, and the application must not lose any serving capacity during the update. The team does not need to keep the VM names.

    Which two settings should the rolling update use?

    Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set `maxSurge` to a value greater than 0, for example 3." } }
    - { id: b, text: { en: "Use the RECREATE replacement method for the update." } }
    - { id: c, text: { en: "Keep the default `maxUnavailable` value of the zonal MIG." } }
    - { id: d, text: { en: "Set the update type to opportunistic for the update." } }
    - { id: e, text: { en: "Set `maxUnavailable` to 0 for the update." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "With `maxUnavailable` at 0, the updater never takes a VM offline before its replacement is ready, and a `maxSurge` above 0 lets it create new VMs above the target size first. Together they keep 12 serving VMs during the whole update, with the default SUBSTITUTE method, which gives new VMs new names."
  options:
    b: { en: "RECREATE keeps VM names by deleting each VM before recreating it, and it requires `maxSurge` set to 0, so capacity drops during the update." }
    c: { en: "The zonal default for `maxUnavailable` is 1, so one VM at a time is offline and the group runs below peak capacity." }
    d: { en: "An opportunistic update does not roll the template out to existing VMs, so the new template is not deployed." }
references:
  - title: "Automatically apply VM configuration updates in a MIG | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instance-groups/rolling-out-updates-to-managed-instance-groups
