id: gcppca-6a-log-metric-counter
objective: "6.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A food delivery company's Cloud Run services write one structured log entry, with the fields `httpStatus` and `endpoint`, for every failed payment call. The team wants a Cloud Monitoring chart that shows the number of failed calls per endpoint over time.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a user-defined distribution log-based metric that extracts its values from the httpStatus field." } }
    - { id: b, text: { en: "Create a log-based alerting policy whose query matches the log entries of failed payment calls." } }
    - { id: c, text: { en: "Use the system-defined log-based metric that counts the log entries stored in the log buckets of the project." } }
    - { id: d, text: { en: "Create a counter log-based metric for the failed calls, with a label extracted from the endpoint field." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A counter log-based metric counts the log entries that match its filter, and a label extracted from the endpoint field creates one time series per endpoint, which can be charted and used in alerting policies. User-defined log-based metrics start counting from their creation; they are not filled with older entries.
  options:
    a: { en: "Distribution metrics group extracted numeric values, such as latencies, into histograms; they do not count failures per endpoint." }
    b: { en: "A log-based alerting policy notifies when entries appear but cannot derive counts to chart." }
    c: { en: "System-defined log-based metrics track Logging usage such as stored entries, not application-specific failures per endpoint." }
references:
  - title: "Log-based metrics overview"
    url: https://docs.cloud.google.com/logging/docs/logs-based-metrics
