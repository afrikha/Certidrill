id: gcppca-cs7c-supervisor-access
objective: "3.1.7"
type: single
caseStudy: gcppca-cs7c-corrin-bay-transit
difficulty: 2
status: draft
stem:
  en: |
    You need to design how dispatch supervisors reach the dispatch console from home. The design must meet the business requirement for dispatch supervisors and the technical requirements.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Add a Cloud Armor security policy to the load balancer that allows only the home IP addresses that supervisors register with the IT team." } }
    - { id: b, text: { en: "Set the Cloud Run service's ingress to internal, and give supervisors HA VPN connections from their homes to the VPC network." } }
    - { id: c, text: { en: "Enable IAP on the load balancer's backend service, and grant the IAP-secured Web App User role to the supervisors' group, and require 2-Step Verification for the supervisors' city accounts." } }
    - { id: d, text: { en: "Enable IAP on the load balancer's backend service, and grant the IAP-secured Web App User role to the supervisors' group with a condition on an access level that requires a city-managed device." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Identity-Aware Proxy checks each user's identity at the load balancer, so supervisors reach the console over the internet without a VPN. An access level in Access Context Manager that requires a city-managed device, applied as a condition on the IAP-secured Web App User role, admits supervisors only from the city's laptops. Device attributes in access levels require a Chrome Enterprise Premium license, which the city has.
  options:
    a:
      en: Home IP addresses do not prove that a supervisor uses a city-managed laptop, and home addresses change; anyone on an allowed network could reach the console.
    b:
      en: VPN connections from homes are what the city is decommissioning, and a VPN does not check that the device is a city-managed laptop.
    c:
      en: 2-Step Verification strengthens the sign-in but says nothing about the device; without an access level, IAP admits supervisors from any computer, including personal ones.
references:
  - title: Setting up context-aware access with Identity-Aware Proxy
    url: https://docs.cloud.google.com/iap/docs/cloud-iap-context-aware-access-howto
