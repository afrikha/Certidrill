id: gcppca-cs2b-exfiltration-keys
objective: "3.1.5"
type: multi
caseStudy: gcppca-cs2b-laurentide
difficulty: 3
status: draft
stem:
  en: |
    You are designing the security controls of the `prj-customer-data` project. The BigQuery datasets and Cloud Storage buckets of the project are in `northamerica-northeast1`. The controls must meet the business requirement about customer data leaving the bank's environment and the encryption requirements.

    Which two actions should you take? (Choose two.)
body:
  options:
    - id: a
      text: { en: "Create a VPC Service Controls perimeter that includes prj-customer-data and the bank's other projects that process customer data, and restrict the BigQuery and Cloud Storage APIs." }
    - id: b
      text: { en: "Encrypt the Cloud Storage objects and BigQuery tables with customer-supplied encryption keys that the security team generates and stores in the bank's on-premises key vault." }
    - id: c
      text: { en: "Create VPC firewall rules that deny all egress traffic to the internet from the subnets in which the bank's applications and analytics tools run." }
    - id: d
      text: { en: "Create Cloud KMS keys with the HSM protection level in a key ring in northamerica-northeast1, and set them as the customer-managed encryption keys of the datasets and buckets." }
    - id: e
      text: { en: "Set the iam.allowedPolicyMemberDomains organization policy constraint so that IAM roles can be granted only to identities from the bank's Cloud Identity account." }
  choose: 2
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: "A VPC Service Controls perimeter blocks API operations that would move data out of it, such as copying a table or an object to a project outside the perimeter, even for callers with valid IAM credentials. Cloud HSM keys are protected by FIPS 140-2 Level 3 validated HSMs, and as customer-managed encryption keys in the same location as the data they let the security team set rotation and disable a key version."
  options:
    b: { en: "Customer-supplied encryption keys are a Cloud Storage feature, so they cannot protect the BigQuery tables, and keys kept in an on-premises vault are not in Google Cloud HSMs; CSEK also controls no data movement." }
    c: { en: "Copies through the BigQuery and Cloud Storage APIs are performed by Google services, not by traffic leaving the VPC subnets, so firewall rules do not stop them." }
    e: { en: "Domain restricted sharing limits who can be granted roles, but a bank user with valid credentials could still copy data to a project outside the bank's environment." }
references:
  - title: Overview of VPC Service Controls
    url: https://docs.cloud.google.com/vpc-service-controls/docs/overview
  - title: Cloud HSM
    url: https://docs.cloud.google.com/kms/docs/hsm
