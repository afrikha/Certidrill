id: gcppca-3b-soc2-report-download
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: "A SaaS company hosted on Google Cloud is preparing its own SOC 2 audit. Its auditor asks for Google Cloud's most recent SOC 2 report to evaluate the controls that Google operates for the company.\n\nHow should the company obtain the report?"
body:
  options:
    - { id: a, text: { en: "Export the SOC 2 framework results from Compliance Manager in Security Command Center." } }
    - { id: b, text: { en: "Open a support case to request a SOC 2 Type I report that covers the company's projects." } }
    - { id: c, text: { en: "Download the Google Cloud SOC 2 report from Compliance Reports Manager." } }
    - { id: d, text: { en: "Create an Assured Workloads folder, which generates a SOC 2 report for its resources." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Compliance Reports Manager gives on-demand access, at no additional cost, to Google Cloud compliance resources such as ISO/IEC certificates and SOC reports, and the core Google Cloud SOC 2 report is requested there. Confidential reports are shared under the confidentiality obligations of the customer agreement."
  options:
    a:
      en: "Compliance Manager shows how the company's own configuration aligns with a framework; it is not Google's audited SOC 2 report."
    b:
      en: "Google Cloud issues SOC 2 Type II reports, not Type I, and the core report is available through Compliance Reports Manager."
    d:
      en: "Assured Workloads configures data boundaries and controls; it does not produce audit reports."
references:
  - title: "Compliance reports manager"
    url: https://cloud.google.com/security/compliance/compliance-reports-manager
  - title: "SOC 2: compliance"
    url: https://cloud.google.com/security/compliance/soc-2
