id: gcppca-3b-sdp-training-tokens
objective: "3.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: "A healthcare provider wants to fine-tune a model on patient support transcripts that contain patient names and phone numbers. Data scientists must not see these values, but the same patient must get the same token in every transcript. A small compliance team must be able to recover original values when legally required, and the security team wants the strongest cryptographic guarantees; tokens do not need to keep the original format.\n\nHow should you de-identify the transcripts before training?"
body:
  options:
    - { id: a, text: { en: "Use Sensitive Data Protection deterministic encryption (AES-SIV) with a Cloud KMS-wrapped key, and allow only the compliance team to re-identify." } }
    - { id: b, text: { en: "Use Sensitive Data Protection cryptographic hashing (HMAC-SHA-256) with a Cloud KMS-wrapped key kept in a separate security project." } }
    - { id: c, text: { en: "Use Sensitive Data Protection format-preserving encryption (FPE-FFX) with a transient key generated for each de-identification request." } }
    - { id: d, text: { en: "Use Sensitive Data Protection character masking that replaces every character of each detected value with an asterisk." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Deterministic encryption with AES-SIV gives the same token for the same input (referential integrity) and can be reversed with the key through re-identification. Sensitive Data Protection states that format-preserving encryption provides fewer security guarantees than AES-SIV, and a Cloud KMS-wrapped key is the most secure key option."
  options:
    b:
      en: "Hashing is consistent but one-way, so the compliance team could never recover the original values."
    c:
      en: "A transient key is discarded after each request, so tokens are not consistent across requests and cannot be re-identified; FPE also gives weaker guarantees than AES-SIV."
    d:
      en: "Masking gives the same output for different patients and cannot be reversed."
references:
  - title: "Pseudonymization"
    url: https://docs.cloud.google.com/sensitive-data-protection/docs/pseudonymization
