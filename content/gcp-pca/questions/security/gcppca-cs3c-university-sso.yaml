id: gcppca-cs3c-university-sso
objective: "3.1.1"
type: multi
caseStudy: gcppca-cs3c-lanternhall-learning
difficulty: 2
status: draft
stem:
  en: |
    You are redesigning the sign-in of the platform. The design must meet the business requirement about partner universities and the technical requirement for sign-in.

    Which two actions should you take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a workforce identity pool for each university, with a SAML provider for the university's identity provider." } }
    - { id: b, text: { en: "Use Identity Platform with multi-tenancy, and create one tenant for each partner university." } }
    - { id: c, text: { en: "Create a Cloud Identity user for each student, and synchronize the users from each university's directory with Google Cloud Directory Sync." } }
    - { id: d, text: { en: "Configure the university's SAML identity provider as a sign-in provider of that university's tenant." } }
    - { id: e, text: { en: "Enable Identity-Aware Proxy on the platform's load balancer, and grant each university's students the IAP-secured Web App User role." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Identity Platform adds managed sign-in to Lanternhall's own application, with email and password sign-in for independent learners and SAML federation, so Lanternhall no longer maintains federation code. With multi-tenancy, each tenant is an isolated silo of users and configuration, so each university gets its own tenant and its own SAML provider, can be onboarded by configuration, and its administrators manage only its students.
  options:
    a:
      en: Workforce Identity Federation gives an organization's workforce access to Google Cloud resources and the console; it does not provide sign-in for the end users of Lanternhall's application.
    c:
      en: Cloud Identity manages the identities of an organization's own workforce; creating and synchronizing millions of learner accounts would require work for every university and does not isolate the universities' administrators.
    e:
      en: IAP controls access to the application for identities that it authenticates, but this option does not federate each university's SAML identity provider or isolate the universities' users.
references:
  - title: Identity Platform multi-tenancy
    url: https://docs.cloud.google.com/identity-platform/docs/multi-tenancy
