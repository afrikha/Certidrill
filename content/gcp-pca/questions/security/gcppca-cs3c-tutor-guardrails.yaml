id: gcppca-cs3c-tutor-guardrails
objective: "3.1.9"
type: single
caseStudy: gcppca-cs3c-lanternhall-learning
difficulty: 2
status: draft
stem:
  en: |
    You are securing Lantern before its launch. The solution must meet the business requirement about Lantern and the technical requirement for learner questions and answers.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Set the safety settings of the Gemini model to block harassment, hate speech, sexually explicit and dangerous content at the lowest threshold." } }
    - { id: b, text: { en: "Attach a Cloud Armor security policy with the preconfigured WAF rules to the load balancer of Lantern, so that malicious questions are denied at the edge." } }
    - { id: c, text: { en: "Create a Model Armor template with the prompt injection and jailbreak filter and the Sensitive Data Protection filter, and use it to screen each question before the model and each answer before the learner." } }
    - { id: d, text: { en: "Store every conversation in BigQuery, and run a nightly Sensitive Data Protection inspection job that de-identifies the personal data found in the conversations." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Model Armor screens both prompts and model responses. Its prompt injection and jailbreak detection filter blocks questions that try to override the tutor's instructions, and its Sensitive Data Protection filter detects personal data in the answers. A template in inspect and block mode, called for each question and each answer, protects the answer keys and the learners' personal data.
  options:
    a:
      en: Safety settings filter harmful content categories; they do not detect attempts to override the instructions, and they do not detect phone numbers or ID numbers in the answers.
    b:
      en: The preconfigured WAF rules match web attack signatures such as SQL injection; they do not understand prompts, and they do not screen the model's answers.
    d:
      en: A nightly job de-identifies data after the answers have already reached the learners, and it does nothing against prompt injection.
references:
  - title: Model Armor overview
    url: https://docs.cloud.google.com/model-armor/overview
