id: gcppca-3a-rh-no-organization
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A startup created 12 projects with the personal Gmail accounts of its first employees. There is no organization resource, and some former employees are still project owners. The startup wants central ownership of all projects, folders, and organization policies. It does not use Google Workspace.

    What should you do first?
body:
  options:
    - { id: a, text: { en: "Create a folder named company in one of the projects, and move the other 11 projects into that folder." } }
    - { id: b, text: { en: "Sign up for Cloud Identity with the company domain to get an organization resource, then migrate the projects into it." } }
    - { id: c, text: { en: "Create a company billing account, and link all 12 projects to it so that they share the same policies." } }
    - { id: d, text: { en: "Grant the Admin basic role on all 12 projects to a new Gmail account that the founders share." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The organization resource is the root of the hierarchy, and accessing it requires a Google Workspace or Cloud Identity account, each associated with exactly one organization. Once the organization exists, projects can be migrated under it, and folders, allow policies, and organization policies can be managed centrally."
  options:
    a:
      en: "Folders are created under an organization or another folder, never inside a project."
    c:
      en: "A billing account pays for projects but does not provide policy inheritance or central ownership."
    d:
      en: "A shared personal account removes accountability and still provides no organization, folders, or organization policies."
references:
  - title: About resource hierarchy
    url: https://docs.cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy
