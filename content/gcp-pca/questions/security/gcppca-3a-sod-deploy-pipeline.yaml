id: gcppca-3a-sod-deploy-pipeline
objective: "3.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    In the production project, developers hold the Cloud Run Developer role and the Service Account User role on the runtime service account, so they deploy directly from their workstations. The company now requires that only its Cloud Build pipeline, which builds reviewed code, can deploy to production. Developers must keep the ability to start builds.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add an IAM condition to the Cloud Run Developer binding of the developers that allows deployments only during business hours." } }
    - { id: b, text: { en: "Enable Data Access audit logs for Cloud Run in production so that direct deployments from workstations are detected." } }
    - { id: c, text: { en: "Remove the Cloud Run Developer and Service Account User grants of the developers in the production project." } }
    - { id: d, text: { en: "Create a key for the pipeline service account, and give it to each developer so that they deploy as the pipeline." } }
    - { id: e, text: { en: "Grant the pipeline service account Cloud Run Developer in production and Service Account User on the runtime service account." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Deploying a Cloud Run service requires Cloud Run Developer on the Cloud Run resource and Service Account User on the runtime service account. Removing both from the developers and granting them only to the pipeline service account makes the reviewed pipeline the single path to production."
  options:
    a:
      en: "Developers could still deploy unreviewed code directly during business hours."
    b:
      en: "Logging detects direct deployments after the fact; it does not prevent them."
    d:
      en: "Sharing a key lets developers deploy as the pipeline from anywhere, which defeats the control and creates a long-lived credential."
references:
  - title: Attach service accounts to resources
    url: https://docs.cloud.google.com/iam/docs/attach-service-accounts
  - title: Cloud Run IAM roles
    url: https://docs.cloud.google.com/run/docs/reference/iam/roles
