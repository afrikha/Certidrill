id: gcppca-3b-assured-oss
objective: "3.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: "A healthcare software vendor builds Java and Python applications that depend on popular open-source packages. Its security policy now requires that open-source dependencies come from a source that builds them to SLSA level 3 and supplies verifiable provenance and SBOMs. The vendor does not want to rebuild the packages itself.\n\nWhich solution should you recommend?"
body:
  options:
    - { id: a, text: { en: "Create Artifact Registry remote repositories for Maven Central and PyPI, and enable vulnerability scanning on them." } }
    - { id: b, text: { en: "Consume the packages from Assured Open Source Software through an Artifact Registry remote repository." } }
    - { id: c, text: { en: "Rebuild each dependency from source in a Cloud Build private pool, and generate build provenance for each package." } }
    - { id: d, text: { en: "Scan each package with On-Demand Scanning, and accept only the versions that have no known vulnerabilities." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Assured Open Source Software provides open-source packages that Google builds and secures to SLSA level 3 requirements, with verifiable provenance and SBOMs; the free tier covers Java, Python and Go. The packages are stored in a Google-managed Artifact Registry repository that you can reach through a remote repository."
  options:
    a:
      en: "Remote repositories cache public packages as they are published upstream; they add no SLSA level 3 build, provenance or SBOM."
    c:
      en: "Rebuilding every dependency would produce provenance, but it is exactly the in-house effort the vendor wants to avoid."
    d:
      en: "Scanning finds known vulnerabilities only; it says nothing about how the packages were built."
references:
  - title: "Overview of Assured Open Source Software"
    url: https://docs.cloud.google.com/assured-open-source-software/docs/overview
