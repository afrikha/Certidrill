id: gcppca-3a-rh-inherited-grant
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The group app-admins holds the Compute Admin role on the folder retail, which contains 40 projects. In one of these projects, pos-payments, the compliance team requires that app-admins can no longer delete VM instances. The group must keep all other Compute Admin permissions in pos-payments and in the other 39 projects, and you must not change the folder-level grant.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Attach an IAM deny policy to pos-payments that denies compute.googleapis.com/instances.delete to app-admins." } }
    - { id: b, text: { en: "Remove the Compute Admin binding of app-admins from the allow policy of the pos-payments project." } }
    - { id: c, text: { en: "Grant app-admins a custom role on pos-payments that contains Compute Admin permissions without instances.delete." } }
    - { id: d, text: { en: "Enforce an organization policy on pos-payments that blocks the compute.instances.delete permission for app-admins." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Allow policies are inherited down the hierarchy, and a grant on the folder cannot be revoked by an allow policy on a project. A deny policy attached to the project is evaluated before allow policies and blocks only the denied permission for the named principal in that project, leaving the folder grant unchanged."
  options:
    b:
      en: "The role is inherited from the folder, not granted on the project, so there is no project binding to remove and the inherited access remains."
    c:
      en: "Allow policies only add permissions: the custom role cannot take away the instances.delete permission inherited from the folder."
    d:
      en: "Organization policies constrain how resources can be configured, not which permissions a principal can use; IAM controls who can act."
references:
  - title: Deny policies
    url: https://docs.cloud.google.com/iam/docs/deny-overview
  - title: About resource hierarchy
    url: https://docs.cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy
