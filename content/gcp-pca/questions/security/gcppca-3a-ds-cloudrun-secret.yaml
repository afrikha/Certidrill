id: gcppca-3a-ds-cloudrun-secret
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A Cloud Run service named orders-api reads a database password from a plain-text environment variable defined in the deployment YAML file in the source repository. The service runs as the user-managed service account orders-sa. You must remove the password from the repository, even in encrypted form, only this service may read the password, and the application code, which reads the password from an environment variable, must not change.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store the password in a Cloud Storage bucket, and grant orders-sa the Storage Object Viewer role on the bucket." } }
    - { id: b, text: { en: "Store the password as a secret in Secret Manager, and reference the secret in the Cloud Run service configuration." } }
    - { id: c, text: { en: "Grant orders-sa the Secret Manager Secret Accessor role on the project that contains the secret." } }
    - { id: d, text: { en: "Grant orders-sa the Secret Manager Secret Accessor role on that secret only." } }
    - { id: e, text: { en: "Encrypt the password with a Cloud KMS key, and keep the ciphertext in the deployment YAML file." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Google recommends storing sensitive values in Secret Manager; Cloud Run can expose a secret as an environment variable or a mounted volume. The service identity needs the Secret Manager Secret Accessor role, and granting it on the single secret, the lowest level of the hierarchy, keeps other secrets out of reach."
  options:
    a:
      en: "Cloud Run cannot inject a Cloud Storage object as an environment variable, so the application code would have to change to download the password; Google recommends Secret Manager for sensitive values."
    c:
      en: "A project-level grant gives orders-sa access to every secret in the project, not only this password."
    e:
      en: "The requirement removes the password from the repository even in encrypted form, and decrypting it would require custom code."
references:
  - title: Configure secrets for services
    url: https://docs.cloud.google.com/run/docs/configuring/services/secrets
  - title: Access control with IAM
    url: https://docs.cloud.google.com/secret-manager/docs/access-control
