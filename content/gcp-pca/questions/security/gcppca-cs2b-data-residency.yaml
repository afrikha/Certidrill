id: gcppca-cs2b-data-residency
objective: "3.2.1"
type: single
caseStudy: gcppca-cs2b-laurentide
difficulty: 1
status: draft
stem:
  en: |
    Laurentide's compliance team asks you to enforce the residency requirement for Google Cloud resources before the first production project is created. The control must prevent non-compliant resources from being created and must need no work when new projects are added.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Set the gcp.resourceLocations organization policy constraint on every existing project with the in:canada-locations value group as the only allowed value." }
    - id: b
      text: { en: "Create a VPC Service Controls perimeter around all the bank's projects and restrict every supported service, so that resources cannot be accessed from outside Canada." }
    - id: c
      text: { en: "Set the gcp.resourceLocations organization policy constraint on the organization node with the in:canada-locations value group as the only allowed value." }
    - id: d
      text: { en: "Create a Cloud Asset Inventory feed for the organization that triggers a Cloud Run function, which deletes any resource whose location is outside Canada." }
answer: { optionId: c }
explanation:
  correct:
    en: "The resource locations constraint restricts where location-based resources can be created, and the in:canada-locations value group covers all locations in Canada and is expanded by Google when new Canadian locations are added. Set on the organization node, the policy is inherited by every folder and project, including those created later. The constraint applies to new resources only, which suits an organization with no production resources yet."
  options:
    a: { en: "A policy set on each existing project does not cover projects created later, so every new project would need its own policy." }
    b: { en: "A service perimeter controls data movement across its boundary and access from outside it; it does not restrict the regions in which resources are created." }
    d: { en: "This is a detective control that reacts after a resource exists, so data could already be stored outside Canada, and it adds custom code to maintain." }
references:
  - title: Restrict resource locations
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/defining-locations
