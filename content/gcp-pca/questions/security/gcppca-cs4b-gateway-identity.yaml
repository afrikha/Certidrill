id: gcppca-cs4b-gateway-identity
objective: "3.1.7"
type: single
caseStudy: gcppca-cs4b-corvane-components
difficulty: 2
status: draft
stem:
  en: |
    You need to let the edge gateways publish readings to the LinePulse Pub/Sub topic. The solution must meet the technical requirement for gateway authentication and comply with the organization policies of Corvane's Google Cloud organization.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a service account for each plant, upload the public key of each gateway's certificate as a key of its plant's service account, and grant the service accounts the Pub/Sub Publisher role on the topic." } }
    - { id: b, text: { en: "Create a workforce identity pool with a provider for Corvane's identity provider, have a plant engineer sign in once on each gateway, and grant the pool's principals the Pub/Sub Publisher role on the topic." } }
    - { id: c, text: { en: "Create a workload identity pool with an X.509 provider with a trust store of Corvane's root and intermediate CA certificates, and let the pool's principals impersonate a service account that has the Pub/Sub Publisher role on the topic." } }
    - { id: d, text: { en: "Create a service account with the Pub/Sub Publisher role on the topic, store one of its keys as a secret in Secret Manager, and have each gateway read the key from Secret Manager every time it starts." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Workload Identity Federation with X.509 certificates lets external workloads exchange a client certificate over mutual TLS for short-lived Google Cloud credentials. The provider validates the certificate chain against the trust store, which holds Corvane's root CA and intermediate CA, so every gateway keeps its existing identity and renewed certificates keep working; the federated principals then impersonate a service account that can publish to the topic, which creates no service account key.
  options:
    a:
      en: Uploading a public key creates a service account key, which the enforced iam.disableServiceAccountKeyUpload constraint blocks and the technical requirement excludes; each renewal would also need a new upload.
    b:
      en: Workforce identity federation is for human users who sign in to Google Cloud, not for unattended gateways, and the gateways' certificates would not be used.
    d:
      en: The iam.disableServiceAccountKeyCreation constraint prevents creating the key, and the gateways would still need credentials to read the secret.
references:
  - title: Configure Workload Identity Federation with X.509 certificates
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-x509-certificates
