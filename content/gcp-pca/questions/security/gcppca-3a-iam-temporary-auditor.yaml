id: gcppca-3a-iam-temporary-auditor
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company hires an external auditor for an engagement that ends on 31 March. The auditor's Cloud Identity account must read objects in one Cloud Storage bucket that uses uniform bucket-level access. Access must stop automatically when the engagement ends, without anyone having to remember to remove it, and the auditor must not see other buckets.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Grant Storage Object Viewer on the bucket with an IAM condition on request.time that expires at the end of the engagement." } }
    - { id: b, text: { en: "Grant Storage Object Viewer on the bucket, and create a calendar reminder for an administrator to remove the binding on 31 March." } }
    - { id: c, text: { en: "Grant Storage Object Viewer on the bucket to a service account, give its key to the auditor, and delete the key on 31 March." } }
    - { id: d, text: { en: "Grant Storage Object Viewer on the project with an IAM condition on request.time, because buckets do not accept conditional bindings." } }
answer: { optionId: a }
explanation:
  correct:
    en: "IAM Conditions can grant temporary access: a condition on request.time makes the role binding stop applying after the chosen date, with no manual action. Buckets accept conditional role bindings when uniform bucket-level access is enabled, which is the case here, so the grant stays limited to the one bucket."
  options:
    b:
      en: "Removal depends on a person remembering to do it, which the requirement rules out."
    c:
      en: "A shared service account key removes individual accountability, and removal still depends on a manual action."
    d:
      en: "Buckets with uniform bucket-level access do accept conditions, and a project-level grant would let the auditor read every bucket in the project."
references:
  - title: Overview of IAM Conditions
    url: https://docs.cloud.google.com/iam/docs/conditions-overview
