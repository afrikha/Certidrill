id: gcppca-cs1b-cmek-duties
objective: "3.1.6"
type: multi
caseStudy: gcppca-cs1b-halden-mutual
difficulty: 2
status: draft
stem:
  en: |
    You are designing the encryption of the claims data. The design must meet the technical requirements for claims data protection.

    Which two actions should you take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create the key ring and keys in europe-west3 in a dedicated key project managed by the security team, grant the security team the Cloud KMS Admin role there, and set a 90-day automatic rotation period on the keys." } }
    - { id: b, text: { en: "Grant the Cloud KMS CryptoKey Encrypter/Decrypter role on the keys to the BigQuery and Cloud Storage service agents of claims-data-prod." } }
    - { id: c, text: { en: "Create the key ring and keys in claims-data-prod, and grant the claims platform team the Cloud KMS Admin role so that it can rotate the keys every 90 days." } }
    - { id: d, text: { en: "Grant the Cloud KMS CryptoKey Encrypter/Decrypter role on the keys to the fraud analysts' group so that their queries can decrypt the claims data." } }
    - { id: e, text: { en: "Have the claims applications send customer-supplied encryption keys with every request, and store the keys in Secret Manager in claims-data-prod." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Keeping the keys in a dedicated project managed by a central security team separates key management from the projects that hold the protected data, and the security team gets no role on claims-data-prod. For CMEK, the service agent of each Google Cloud service should be the only principal that can encrypt and decrypt with the key, so the claims team and the analysts read data through the services without using the keys directly. A rotation period on each key rotates it automatically.
  options:
    c:
      en: Cloud KMS Admin lets the claims platform team manage the keys, which the requirements forbid.
    d:
      en: The analysts would be able to use the keys directly, which the requirements forbid; BigQuery decrypts CMEK data through its service agent.
    e:
      en: Customer-supplied encryption keys are not CMEK and are a Cloud Storage feature that BigQuery does not offer, and keys stored in claims-data-prod would be usable by the claims platform team.
references:
  - title: Separation of duties
    url: https://docs.cloud.google.com/kms/docs/separation-of-duties
  - title: Customer-supplied encryption keys
    url: https://docs.cloud.google.com/docs/security/encryption/customer-supplied-encryption-keys
