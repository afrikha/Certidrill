id: gcppca-3b-children-data-retention
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: "An education company runs a learning app for children. To meet children's privacy rules and its data minimization policy, activity data about each child must be deleted automatically when it is 12 months old. Raw event files land in a Cloud Storage bucket without Object Versioning, and the analytics team loads them into BigQuery tables partitioned by ingestion time.\n\nWhich two actions should you take? Choose two."
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add an Object Lifecycle Management rule to the bucket with a Delete action and an age condition of 365 days." } }
    - { id: b, text: { en: "Set a 365-day retention policy on the bucket, and lock it with Bucket Lock." } }
    - { id: c, text: { en: "Enable Autoclass on the bucket so that objects that are not accessed move to colder storage classes." } }
    - { id: d, text: { en: "Enable Object Versioning on the bucket so that deleted objects can be audited for 12 months." } }
    - { id: e, text: { en: "Set a partition expiration of 365 days on the ingestion-time partitioned BigQuery tables." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "A lifecycle Delete rule with an age condition deletes each object once it reaches that age, counted from its creation. A BigQuery partition expiration deletes each partition once its partition time plus the expiration has passed, so ingestion-time partitions are removed 365 days after loading. Both deletions are asynchronous and short-lived recovery copies (soft delete, time travel) exist, which the privacy notice should account for."
  options:
    b:
      en: "A retention policy prevents deletion before 365 days; it never deletes anything, so data could be kept indefinitely."
    c:
      en: "Autoclass changes storage classes to reduce cost; it keeps the data."
    d:
      en: "Versioning keeps noncurrent copies of deleted or overwritten objects, which works against data minimization."
references:
  - title: "Object Lifecycle Management"
    url: https://docs.cloud.google.com/storage/docs/lifecycle
  - title: "Manage partitioned tables"
    url: https://docs.cloud.google.com/bigquery/docs/managing-partitioned-tables
