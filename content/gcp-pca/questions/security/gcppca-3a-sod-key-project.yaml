id: gcppca-3a-sod-key-project
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company uses CMEK for Cloud SQL and Cloud Storage in 30 application projects. Auditors found that the owners of each application project can also disable and destroy the keys, because the key rings are stored in the same projects. You need to enforce separation of duties between the people who manage keys and the people who run the applications.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Create the keys in a dedicated key project administered by the security team, and grant only the application service agents encrypt and decrypt access." } }
    - { id: b, text: { en: "Keep the keys in the application projects, remove the Owner role from the project owners, and grant them Cloud KMS Admin instead." } }
    - { id: c, text: { en: "Keep the keys in the application projects, and enable automatic rotation every 30 days so that a compromised version is short-lived." } }
    - { id: d, text: { en: "Create the keys in a dedicated key project, and grant the application project owners the Cloud KMS Admin role on that project." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Google recommends separate projects for keys and for the resources they protect, which gives greater control over IAM roles and supports separation of duties. The security team manages the key lifecycle in the key project, and the service agents of the application projects receive Cloud KMS CryptoKey Encrypter/Decrypter, so application owners can no longer disable or destroy keys."
  options:
    b:
      en: "Cloud KMS Admin still lets the application owners disable and schedule key versions for destruction, so duties stay combined."
    c:
      en: "Rotation does not change who can disable or destroy keys, so the separation of duties finding remains."
    d:
      en: "Moving the keys while granting the same people Cloud KMS Admin keeps key management and key use in the same hands."
references:
  - title: Separation of duties
    url: https://docs.cloud.google.com/kms/docs/separation-of-duties
  - title: Customer-managed encryption keys (CMEK)
    url: https://docs.cloud.google.com/kms/docs/cmek
