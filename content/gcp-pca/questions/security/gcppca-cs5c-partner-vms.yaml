id: gcppca-cs5c-partner-vms
objective: "3.1.3"
type: single
caseStudy: gcppca-cs5c-ashgrove-power
difficulty: 1
status: draft
stem:
  en: |
    You need to configure the GridShift VMs. The configuration must meet the business requirement about third-party software under the state's privacy rules and the technical requirement for GridShift's VMs.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create the VMs as Shielded VMs with Secure Boot, vTPM and integrity monitoring enabled." } }
    - { id: b, text: { en: "Create the VMs as Confidential VMs on a machine series that supports AMD SEV, such as N2D." } }
    - { id: c, text: { en: "Encrypt the VMs' persistent disks with customer-managed encryption keys stored in Cloud HSM." } }
    - { id: d, text: { en: "Create the VMs on sole-tenant nodes that are reserved for the GridShift project." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Confidential VM uses hardware-based memory encryption, with keys generated by and kept in dedicated hardware that the hypervisor cannot access, so data cannot be read or modified while in use. It is chosen when the VM is created and needs no change to the software that runs in it. AMD SEV is available on machine types such as N2D.
  options:
    a:
      en: Shielded VM verifies boot integrity against rootkits and bootkits; it does not encrypt the VM's memory.
    c:
      en: CMEK protects data at rest on the disks, not the data in use in the VM's memory.
    d:
      en: Sole-tenant nodes isolate the VMs on dedicated physical servers but do not encrypt the memory of the VMs.
references:
  - title: Confidential VM overview
    url: https://docs.cloud.google.com/confidential-computing/confidential-vm/docs/confidential-vm-overview
