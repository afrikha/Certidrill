id: gcppca-cs4c-chat-card-numbers
objective: "3.2.2"
type: single
caseStudy: gcppca-cs4c-saltroute-travel
difficulty: 2
status: draft
stem:
  en: |
    You are designing the nightly load of support chat transcripts into BigQuery. The design must meet the business requirement about the analytics platform and the technical requirement about card numbers.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Load the transcripts into BigQuery, attach a policy tag to the transcript column, and grant the Fine-Grained Reader role on the tag only to the security team." } }
    - { id: b, text: { en: "Load the transcripts into BigQuery, and configure a dynamic data masking rule on the transcript column for the analysts' group." } }
    - { id: c, text: { en: "Before loading, send each transcript to the Sensitive Data Protection de-identification method with the CREDIT_CARD_NUMBER infoType and a masking transformation, and load only the result." } }
    - { id: d, text: { en: "Load the transcripts into BigQuery, and configure Sensitive Data Protection discovery on the analytics project to profile the tables and publish the findings to Security Command Center." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Sensitive Data Protection detects card numbers with its built-in CREDIT_CARD_NUMBER infoType, so Saltroute maintains no detection pattern, and a de-identification request replaces or masks only the matched values in the text. Loading only the de-identified transcripts keeps every card number out of BigQuery, while analysts still read the rest of each conversation.
  options:
    a:
      en: Column-level access control hides the whole transcript from analysts, and the card numbers are still stored in BigQuery, which keeps the platform in PCI DSS scope.
    b:
      en: Masking applies to the whole column value at query time; analysts lose the rest of the transcript and the card numbers are still stored in BigQuery.
    d:
      en: Discovery reports where sensitive data is stored but does not remove it, so the card numbers stay in BigQuery.
references:
  - title: De-identifying sensitive data
    url: https://docs.cloud.google.com/sensitive-data-protection/docs/deidentify-sensitive-data
