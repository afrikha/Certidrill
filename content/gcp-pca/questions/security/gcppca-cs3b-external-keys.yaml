id: gcppca-cs3b-external-keys
objective: "3.1.6"
type: single
caseStudy: gcppca-cs3b-norvale-revenue
difficulty: 3
status: draft
stem:
  en: |
    You are designing the encryption of the BigQuery datasets and Cloud Storage buckets that hold taxpayer data. The design must meet the business requirement about keys and the technical requirements for taxpayer data.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create Cloud EKM keys with the EXTERNAL protection level in europe-west3 that point to keys in the NRA's key manager, and set them as the customer-managed encryption keys of the datasets and buckets." } }
    - { id: b, text: { en: "Create Cloud EKM keys with the EXTERNAL_VPC protection level in the eu multi-region, reached through an EKM connection over Dedicated Interconnect, and set them as the customer-managed encryption keys of the datasets and buckets." } }
    - { id: c, text: { en: "Create Cloud KMS keys with the HSM protection level in europe-west3 by importing key material generated by the NRA's key manager, and set them as the customer-managed encryption keys of the datasets and buckets." } }
    - { id: d, text: { en: "Create Cloud EKM keys with the EXTERNAL_VPC protection level in europe-west3, reached through an EKM connection over Dedicated Interconnect, and set them as the customer-managed encryption keys of the datasets and buckets." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With Cloud EKM, the key material stays in the NRA's key manager and is never shared with Google; Google Cloud asks the key manager for every operation, so revoking access there stops all decryption. Keys with the EXTERNAL_VPC protection level reach the key manager over a VPC network, here extended to the datacenters by Dedicated Interconnect, so key requests do not cross the internet. Cloud EKM over a VPC is available in regional locations such as europe-west3, where the data is stored.
  options:
    a:
      en: Keys with the EXTERNAL protection level reach the key manager over the internet, which the national cybersecurity regulation forbids.
    b:
      en: Cloud EKM over a VPC is not available in multi-regional locations, and the data must stay in europe-west3, where its keys must also be.
    c:
      en: Imported key material is held in Google's Cloud HSM, so the key material leaves the NRA's key manager and the NRA no longer controls it alone.
references:
  - title: Cloud External Key Manager
    url: https://docs.cloud.google.com/kms/docs/ekm
