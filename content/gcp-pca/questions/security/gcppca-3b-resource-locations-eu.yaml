id: gcppca-3b-resource-locations-eu
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: "A European e-commerce company has 300 projects under one organization. To support its GDPR data residency commitments, the data protection officer requires that no new Google Cloud resource be created outside EU locations, in any current or future project, with the least administrative effort.\n\nWhat should you do?"
body:
  options:
    - { id: a, text: { en: "Create a VPC Service Controls perimeter around all the projects, with an access level that allows only EU IP address ranges." } }
    - { id: b, text: { en: "Set the gcp.resourceLocations organization policy constraint at the organization node with the in:eu-locations value group." } }
    - { id: c, text: { en: "Add IAM conditions on resource location to the role bindings of each project so that only EU regions can be used." } }
    - { id: d, text: { en: "Create a Cloud Asset Inventory feed to Pub/Sub, and a Cloud Run function that deletes new resources created outside the EU." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The resource locations constraint restricts where new resources of supported services can be created. Set at the organization node, it is inherited by every current and future project, and the in:eu-locations value group expands automatically when Google adds EU locations."
  options:
    a:
      en: "Access levels filter where API requests come from; they do not restrict the region in which resources are created."
    c:
      en: "IAM conditions are not a location control for resource creation, and bindings in 300 projects plus every new one would have to be maintained."
    d:
      en: "A detect-and-delete workflow lets the resource exist outside the EU first, destroys data and adds custom code to maintain."
references:
  - title: "Restrict resource locations"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/defining-locations
