id: gcppca-3a-iam-workforce-federation
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company uses Microsoft Entra ID as its only identity provider. About 2,000 engineers need single sign-on to the Google Cloud console and the gcloud CLI with their Entra ID accounts. The identity team refuses to synchronize user accounts into Cloud Identity.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Provision the engineers into Cloud Identity from Entra ID, and configure SAML single sign-on with Entra ID as the identity provider." } }
    - { id: b, text: { en: "Configure Workload Identity Federation with an OIDC provider for Entra ID, and grant roles to the workload identity pool." } }
    - { id: c, text: { en: "Configure Workforce Identity Federation with a workforce pool and an Entra ID provider, and grant roles to principal sets of the pool." } }
    - { id: d, text: { en: "Create one service account per engineer, and let each engineer impersonate it after signing in to Entra ID." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Workforce Identity Federation lets users of an external identity provider such as Microsoft Entra ID sign in to Google Cloud with single sign-on over OIDC or SAML 2.0. It is sync-less: accounts are not stored in Cloud Identity. Workforce pools are configured at the organization level, and allow policies grant roles to the pool's principals or principal sets."
  options:
    a:
      en: "Provisioning users into Cloud Identity is exactly the synchronization the identity team refuses."
    b:
      en: "Workload Identity Federation federates workloads such as applications and pipelines, not human users; workforce users need Workforce Identity Federation."
    d:
      en: "Engineers would still need a Google identity to impersonate the service accounts, and 2,000 service accounts add management overhead and hide who acted."
references:
  - title: Workforce Identity Federation
    url: https://docs.cloud.google.com/iam/docs/workforce-identity-federation
