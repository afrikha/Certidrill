id: gcppca-cs3a-documents-public
objective: "3.1.5"
type: multi
caseStudy: gcppca-cs3a-tidemark-logistics
difficulty: 2
status: draft
stem:
  en: |
    You need to put controls in place for the shipment documents. The controls must meet the business requirement about shipment documents and the technical requirement for Cloud Storage data, whatever the port teams do in their projects.

    Which two actions should you take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enforce the storage.publicAccessPrevention organization policy constraint on the organization node." } }
    - { id: b, text: { en: "Create a Cloud Asset Inventory feed that triggers a Cloud Run function, which removes every grant to allUsers from the buckets." } }
    - { id: c, text: { en: "Enable Sensitive Data Protection discovery for Cloud Storage and publish the findings to Security Command Center." } }
    - { id: d, text: { en: "Enforce the storage.uniformBucketLevelAccess organization policy constraint on the organization node." } }
    - { id: e, text: { en: "Set a retention policy on every bucket that holds shipment documents, and lock it with Bucket Lock." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Public access prevention, enforced by the organization policy constraint on the organization node, stops anyone from making data public through IAM policies or ACLs in every current and future project, and overrides public grants that already exist. The uniform bucket-level access constraint requires buckets to use IAM only, with ACLs disabled, so access to new buckets is controlled with IAM alone. Both constraints are inherited by every project of the organization, including future ones.
  options:
    b:
      en: A feed and a function react after the grant is made, so the documents are public until the function runs, and the function must be maintained.
    c:
      en: Discovery finds and reports sensitive data and its exposure, but it does not prevent anyone from making a bucket public.
    e:
      en: A retention policy prevents deletion before a given age; it does not control who can read the objects.
references:
  - title: Public access prevention
    url: https://docs.cloud.google.com/storage/docs/public-access-prevention
  - title: Uniform bucket-level access
    url: https://docs.cloud.google.com/storage/docs/uniform-bucket-level-access
