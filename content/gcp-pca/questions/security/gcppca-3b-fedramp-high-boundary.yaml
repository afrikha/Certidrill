id: gcppca-3b-fedramp-high-boundary
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: "A government contractor will run a US federal agency workload on Google Cloud that must meet FedRAMP High. The agency requires that data stays in US regions, that support is provided only by US-located personnel with enhanced background checks, and that engineers cannot enable products that are outside the authorized boundary.\n\nWhat should you do?"
body:
  options:
    - { id: a, text: { en: "Set the gcp.resourceLocations constraint to in:us-locations for the workload projects, and enable Access Approval on them." } }
    - { id: b, text: { en: "Create an Assured Workloads folder with the FedRAMP Moderate data boundary, and create the workload projects in it." } }
    - { id: c, text: { en: "Create an Assured Workloads folder with the FedRAMP High data boundary, and create the workload projects in it." } }
    - { id: d, text: { en: "Apply the FedRAMP Low framework in Security Command Center Compliance Manager to the workload projects." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The Data Boundary for FedRAMP High sets US-only location controls and routes support to US-located personnel who have completed enhanced background checks. The Assured Workloads folder also sets an organization policy that restricts resource usage to the products supported by the boundary, and Assured Workloads monitors for violations."
  options:
    a:
      en: "Location and approval controls neither restrict products to the boundary nor apply support personnel requirements."
    b:
      en: "FedRAMP Moderate is a lower impact level than the FedRAMP High that the agency requires."
    d:
      en: "Compliance Manager frameworks monitor configuration without creating a boundary, and FedRAMP Low is the wrong level."
references:
  - title: "Data boundaries"
    url: https://docs.cloud.google.com/assured-workloads/docs/control-packages
  - title: "Create a new Assured Workloads folder"
    url: https://docs.cloud.google.com/assured-workloads/docs/create-folder
