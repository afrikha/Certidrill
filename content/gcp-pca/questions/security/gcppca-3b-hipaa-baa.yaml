id: gcppca-3b-hipaa-baa
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: "A US telehealth startup will store and process protected health information (PHI) on Google Cloud. Its compliance officer asks what the company must do on the Google Cloud side before any PHI is loaded.\n\nWhat should you recommend?"
body:
  options:
    - { id: a, text: { en: "Download Google Cloud's HIPAA certificate from Compliance Reports Manager, and attach it to the company's HIPAA policies." } }
    - { id: b, text: { en: "Create an Assured Workloads folder with the FedRAMP High data boundary, and place every PHI workload in it." } }
    - { id: c, text: { en: "Review and accept the Google Cloud Business Associate Agreement, and use only products that it covers for PHI." } }
    - { id: d, text: { en: "Verify that Access Transparency is enabled for the organization, so that all Google Cloud products are covered by HIPAA." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Google Cloud's Business Associate Agreement covers its infrastructure and a listed set of products; products that are not on the list are not covered and should not be used with PHI. HIPAA compliance remains a shared responsibility: the startup must still configure and secure its own environment and applications."
  options:
    a:
      en: "HHS does not offer a HIPAA certification program, so there is no HIPAA certificate to download."
    b:
      en: "FedRAMP High is a US federal authorization boundary; it does not replace the BAA for PHI."
    d:
      en: "Access Transparency logs Google personnel access to customer data; it does not create or extend HIPAA coverage."
references:
  - title: "HIPAA compliance on Google Cloud and Google Workspace"
    url: https://docs.cloud.google.com/docs/security/compliance/hipaa
