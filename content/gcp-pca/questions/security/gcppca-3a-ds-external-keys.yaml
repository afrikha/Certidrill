id: gcppca-3a-ds-external-keys
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A European bank wants to analyze data in BigQuery. Its regulator requires that the encryption keys be generated and held in a key management system operated by a third-party partner outside Google, and that key material never be shared with Google. The bank must be able to stop Google from decrypting the data by revoking access in that system.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Import the bank's key material into Cloud HSM, and grant only the BigQuery service agent access to the imported key." } }
    - { id: b, text: { en: "Use Cloud External Key Manager with a key from the supported external key manager as the CMEK of the datasets." } }
    - { id: c, text: { en: "Use customer-supplied encryption keys for the BigQuery datasets, and keep the keys in the partner's system." } }
    - { id: d, text: { en: "Use Cloud KMS software keys with a short rotation period, and destroy old key versions after every rotation." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Cloud EKM uses keys held in a supported external key manager; the key material does not leave that system and is never shared with Google. Every encryption and decryption request needs the external key, so revoking access in the external system makes the data unreadable."
  options:
    a:
      en: "Imported key material is stored in Google-owned HSMs, which breaks the requirement that key material stay outside Google."
    c:
      en: "BigQuery does not support customer-supplied encryption keys; CSEK is limited to services such as Cloud Storage."
    d:
      en: "Software keys are generated and stored in Cloud KMS, inside Google, whatever the rotation period."
references:
  - title: Cloud External Key Manager
    url: https://docs.cloud.google.com/kms/docs/ekm
