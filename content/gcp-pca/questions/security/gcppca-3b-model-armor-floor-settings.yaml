id: gcppca-3b-model-armor-floor-settings
objective: "3.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: "A bank's developers call Gemini models through the generateContent method of Gemini Enterprise Agent Platform from several applications in one production project. Some developers forget to reference Model Armor templates in their requests. The security team wants every generateContent call in the project to be screened and blocked when it violates a baseline, without relying on application code.\n\nWhat should you do?"
body:
  options:
    - { id: a, text: { en: "Configure Model Armor floor settings on the project, enable the Agent Platform integration, and set it to inspect and block violations." } }
    - { id: b, text: { en: "Create Model Armor templates, and ask each team to set promptTemplateName and responseTemplateName in every request." } }
    - { id: c, text: { en: "Set the vertexai.allowedModels organization policy so that only Gemini models approved by the security team can be called." } }
    - { id: d, text: { en: "Enable Cloud Logging for the project's model requests, and create log-based alerts for prompts that contain blocked terms." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Floor settings define a baseline of Model Armor filters. When the Agent Platform integration is enabled in a project's floor settings, every generateContent call to Gemini models is screened even if the request contains no modelArmorConfig, and inspect and block mode stops violations. This integrated-service setting is configured at the project level."
  options:
    b:
      en: "Per-request templates depend on every developer adding them, which is exactly the gap the security team wants to close."
    c:
      en: "This constraint restricts which models can be used; it does not screen the content of prompts or responses."
    d:
      en: "Logs and alerts report issues after the request has been served; nothing is blocked."
references:
  - title: "Configure floor settings"
    url: https://docs.cloud.google.com/model-armor/configure-floor-settings
  - title: "Integrate Model Armor with Gemini Enterprise Agent Platform"
    url: https://docs.cloud.google.com/model-armor/model-armor-vertex-integration
