id: gcppca-3b-iso27001-evidence
objective: "3.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: "A logistics company is preparing for its ISO/IEC 27001 surveillance audit. The auditor wants the cloud provider's independent certification for the inherited physical and infrastructure controls, and evidence of how the company's own Google Cloud resources are configured against ISO 27001 controls. The company has Security Command Center Premium.\n\nWhich two actions should you take? Choose two."
body:
  choose: 2
  options:
    - { id: a, text: { en: "Download Google Cloud's ISO/IEC 27001 certificate from Compliance Reports Manager." } }
    - { id: b, text: { en: "Export Access Transparency logs as evidence of Google's physical security controls." } }
    - { id: c, text: { en: "Create an Assured Workloads folder with the IL4 data boundary for the in-scope projects." } }
    - { id: d, text: { en: "Run an audit with the ISO 27001:2022 framework in Security Command Center Compliance Manager." } }
    - { id: e, text: { en: "Export 400 days of Admin Activity audit logs to show that the resources are compliant." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Compliance Reports Manager provides Google Cloud's latest ISO/IEC certificates, which cover the controls Google operates. Compliance Manager in Security Command Center Premium includes the ISO 27001:2022 framework and can audit the company's environment, collect evidence and generate reports."
  options:
    b:
      en: "Access Transparency records Google personnel access to customer data; it is not evidence of physical security controls."
    c:
      en: "IL4 is a US Department of Defense boundary unrelated to ISO 27001."
    e:
      en: "Admin Activity logs show who changed what; they do not assess configuration against ISO 27001 controls."
references:
  - title: "Compliance reports manager"
    url: https://cloud.google.com/security/compliance/compliance-reports-manager
  - title: "Compliance Manager overview"
    url: https://docs.cloud.google.com/security-command-center/docs/compliance-manager-overview
