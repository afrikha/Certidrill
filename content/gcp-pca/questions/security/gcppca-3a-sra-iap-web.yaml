id: gcppca-3a-sra-iap-web
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An HR portal runs on a managed instance group behind a global external Application Load Balancer. The portal must be reachable only by employees who sign in with their company Google identities and belong to the group hr-staff. Employees use only a web browser from home, without a VPN or extra client software, and the application code must not change.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a Cloud Armor security policy on the backend service that allows only the public IP ranges of the company offices." } }
    - { id: b, text: { en: "Remove the external load balancer, and ask employees to reach port 443 of the VMs through IAP TCP forwarding." } }
    - { id: c, text: { en: "Enable IAP on the backend service of the load balancer, and grant the hr-staff group the IAP-secured Web App User role." } }
    - { id: d, text: { en: "Configure a Cloud CDN signed URL key on the backend service, and send signed URLs to the hr-staff group by email." } }
answer: { optionId: c }
explanation:
  correct:
    en: "IAP adds a central authorization layer in front of applications served through Cloud Load Balancing: users authenticate with their Google identity, and only principals with the IAP-secured Web App User role reach the backend. No code change is needed; firewall rules should still restrict backend traffic to the load balancer so that IAP cannot be bypassed."
  options:
    a:
      en: "IP allowlists do not check identity or group membership, and employees work from home rather than from offices."
    b:
      en: "TCP forwarding requires each employee to install gcloud and run a tunnel, which the browser-only requirement rules out; it is meant for administrative access."
    d:
      en: "Signed URLs grant access to anyone holding the URL, without identity checks, and they suit cached content rather than an application."
references:
  - title: Identity-Aware Proxy overview
    url: https://docs.cloud.google.com/iap/docs/concepts-overview
