id: gcppca-3a-sra-wif-aws
objective: "3.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application on Amazon EC2 instances must query a BigQuery dataset in Google Cloud. The security team forbids service account keys and wants Google's recommended access model with the fewest identities to manage. BigQuery supports federated principals in its allow policies.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a service account key, store it in AWS Secrets Manager, and grant the service account BigQuery roles on the dataset." } }
    - { id: b, text: { en: "Configure Workforce Identity Federation with an AWS provider, and grant the BigQuery roles to the workforce pool." } }
    - { id: c, text: { en: "Configure Workload Identity Federation with an AWS provider, and let the federated principal impersonate a service account with BigQuery roles." } }
    - { id: d, text: { en: "Configure Workload Identity Federation with an AWS provider, and grant the BigQuery roles directly to the federated principal of the AWS role." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Workload Identity Federation lets the EC2 workload exchange its AWS credentials for a federated token without any key. Google recommends granting roles directly to the federated principal on the resource; service account impersonation is the alternative for APIs with limited support, and it adds a service account to manage."
  options:
    a:
      en: "A service account key is a long-lived credential, which the security team forbids."
    b:
      en: "Workforce Identity Federation is for human users; automated workloads should use Workload Identity Federation."
    c:
      en: "Impersonation works but adds a service account and its Workload Identity User grant; Google recommends direct resource access when the service supports it."
references:
  - title: Workload Identity Federation
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation
