id: gcppca-3b-model-garden-allowed-models
objective: "3.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: "A retail group lets teams in many projects experiment with Model Garden. Legal has approved only a short list of models for use. The cloud platform team must prevent every team in the organization, including project owners, from deploying or calling models that are not on the list, with the least ongoing effort.\n\nWhat should you do?"
body:
  options:
    - { id: a, text: { en: "Create a custom IAM role that omits the model deployment and prediction permissions, and grant it to all teams instead of their current roles." } }
    - { id: b, text: { en: "Create a Model Armor template for each model that is not approved, and enforce the templates through floor settings in each project." } }
    - { id: c, text: { en: "Place all projects in a VPC Service Controls perimeter, and add ingress rules that allow requests only to the approved models." } }
    - { id: d, text: { en: "Set the vertexai.allowedModels organization policy at the organization node, listing the approved models and the allowed actions." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The vertexai.allowedModels constraint lists allowed models in the form publishers/PUBLISHER/models/MODEL_NAME:ACTION, with actions such as predict, deploy and tune. Set at the organization node, it applies to all principals in every project below it, including project owners, and an explicit deny takes precedence over an allow."
  options:
    a:
      en: "IAM permissions are not per model: removing them blocks the approved models too, and project owners could grant the permissions back."
    b:
      en: "Model Armor screens the content of prompts and responses; it does not decide which models can be used."
    c:
      en: "VPC Service Controls rules are based on services, identities and networks, not on individual Model Garden models."
references:
  - title: "Control access to Model Garden models"
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/control-model-access
