id: gcppca-3b-compliance-manager-pci
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: "A payments company has Security Command Center Premium activated for its organization. Its security team wants to continuously monitor the configuration of the company's own Google Cloud resources against PCI DSS 4.0 and the CIS Google Cloud benchmark, and to collect evidence for its next audit.\n\nWhat should you do?"
body:
  options:
    - { id: a, text: { en: "Download Google Cloud's latest compliance reports from Compliance Reports Manager every quarter, and store them with the audit files." } }
    - { id: b, text: { en: "Create an Assured Workloads folder with the FedRAMP Moderate data boundary for the payment projects, and monitor its violations." } }
    - { id: c, text: { en: "Schedule a daily Cloud Asset Inventory export to BigQuery, and compare resource settings against a PCI DSS checklist with SQL queries." } }
    - { id: d, text: { en: "Apply the PCI DSS 4.0 and CIS benchmark frameworks in Compliance Manager, with detective controls and audits for the payment projects." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Compliance Manager in Security Command Center deploys built-in frameworks such as PCI DSS 4.0 and the CIS Google Cloud benchmark. Detective controls monitor the company's resources and report violations, and on Premium the audit capability collects evidence and generates reports."
  options:
    a:
      en: "Google's reports describe the controls that Google operates; they do not assess the company's own resources."
    b:
      en: "FedRAMP Moderate is a US federal boundary unrelated to PCI DSS."
    c:
      en: "A custom export and checklist comparison is manual work that a built-in framework already provides."
references:
  - title: "Compliance Manager overview"
    url: https://docs.cloud.google.com/security-command-center/docs/compliance-manager-overview
