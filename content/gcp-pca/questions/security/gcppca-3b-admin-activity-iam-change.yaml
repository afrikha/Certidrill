id: gcppca-3b-admin-activity-iam-change
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: "Three months ago, someone removed a security group's IAM binding from a production project. No log sinks were created and no Data Access audit logs were enabled. The security team needs to identify who made the change.\n\nWhere should the team look?"
body:
  options:
    - { id: a, text: { en: "In the Data Access audit logs of the project, filtered on the GetIamPolicy method" } }
    - { id: b, text: { en: "In the Access Transparency logs of the organization" } }
    - { id: c, text: { en: "In the Policy Denied audit logs of the project in the _Default log bucket" } }
    - { id: d, text: { en: "In the Admin Activity audit logs of the project in the _Required log bucket" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Changing an IAM policy is an administrative action recorded in Admin Activity audit logs, which are always written and cannot be disabled. They are stored in the _Required bucket, which keeps logs for 400 days, so a change made three months ago is still available without prior configuration."
  options:
    a:
      en: "Data Access logs were not enabled, and GetIamPolicy reads a policy instead of changing it."
    b:
      en: "Access Transparency records actions by Google personnel, not by the company's users."
    c:
      en: "Policy Denied logs record denied requests, whereas this change succeeded."
references:
  - title: "Cloud Audit Logs overview"
    url: https://docs.cloud.google.com/logging/docs/audit
  - title: "Quotas and limits"
    url: https://docs.cloud.google.com/logging/quotas
