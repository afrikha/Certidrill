id: gcppca-3a-cmek-key-location
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your security standard requires CMEK for all Cloud Storage buckets. A team creates a bucket in the europe-west1 region and wants to use an existing key from a key ring in the global location that already protects other workloads. The bucket creation with that key fails.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create the bucket in the EU multi-region instead, so that it can use the key ring in the global location." } }
    - { id: b, text: { en: "Move the existing key ring from the global location to europe-west1, and retry the bucket creation." } }
    - { id: c, text: { en: "Export the global key material, and import it into a new key ring in europe-west1 with an import job." } }
    - { id: d, text: { en: "Create a key ring and a key in europe-west1, and use that key as the default key of the bucket." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Cloud Storage requires the Cloud KMS key ring to be in the same location as the data it encrypts, so a europe-west1 bucket needs a key from a europe-west1 key ring."
  options:
    a:
      en: "An EU multi-region bucket needs a key ring in the eu location, not global, and it changes the bucket location."
    b:
      en: "Cloud KMS resources cannot be moved to a different location after they are created."
    c:
      en: "Cloud KMS does not let you export key material, so it cannot be imported elsewhere."
references:
  - title: Customer-managed encryption keys
    url: https://docs.cloud.google.com/storage/docs/encryption/customer-managed-keys
  - title: Cloud KMS resources
    url: https://docs.cloud.google.com/kms/docs/resource-hierarchy
