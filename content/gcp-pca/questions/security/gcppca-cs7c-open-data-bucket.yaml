id: gcppca-cs7c-open-data-bucket
objective: "3.1.5"
type: multi
caseStudy: gcppca-cs7c-corrin-bay-transit
difficulty: 3
status: draft
stem:
  en: |
    You need to make the GTFS Realtime files readable by the third-party apps. The solution must meet the business requirements for open data and for other CBRTA data, and the technical requirement for policy exceptions.

    Which two actions should you take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the storage.publicAccessPrevention organization policy of the transit folder to not enforced." } }
    - { id: b, text: { en: "Set the public access prevention setting of the feed bucket to inherited." } }
    - { id: c, text: { en: "Set the storage.publicAccessPrevention organization policy of the cbrta-opendata project to not enforced." } }
    - { id: d, text: { en: "Set the storage.uniformBucketLevelAccess organization policy of the cbrta-opendata project to not enforced, and add a public-read ACL to each feed file." } }
    - { id: e, text: { en: "Grant the Storage Object Viewer role on the feed bucket to the allUsers principal." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      A bucket whose public access prevention is inherited takes the first explicit value found in its project, folder and organization, so setting the constraint to not enforced on the cbrta-opendata project lifts the protection for that project only, whose only resource is the feed bucket. Granting Storage Object Viewer to allUsers then makes the files readable without authentication at a stable URL. Every other CBRTA project still inherits the enforced constraint from the organization.
  options:
    a:
      en: An exception on the transit folder lets every CBRTA project make data public, which fails the requirement that no other data can be made public and the smallest-scope requirement.
    b:
      en: An inherited bucket takes the first explicit value of its project, folder and organization; with the constraint enforced on the organization and no exception below it, the bucket stays protected and public grants still fail.
    d:
      en: Public access prevention blocks public ACLs as well as public IAM grants, so this adds a second policy exception without making the files public while the first constraint stays enforced.
references:
  - title: Public access prevention
    url: https://docs.cloud.google.com/storage/docs/public-access-prevention
