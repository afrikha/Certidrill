id: gcppca-3a-ds-secret-residency
objective: "3.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A French healthcare provider stores the database credentials of an application in Secret Manager. A regulation requires that secret payloads be stored only in the europe-west9 region.

    Which two configurations meet this requirement? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A regional secret created in the europe-west9 location" } }
    - { id: b, text: { en: "A global secret with automatic replication, protected by a customer-managed encryption key" } }
    - { id: c, text: { en: "A global secret with a user-managed replication policy that lists only europe-west9" } }
    - { id: d, text: { en: "A global secret with automatic replication and an IAM condition that limits access by region" } }
    - { id: e, text: { en: "A global secret in a project whose billing account is registered in France" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Regional secrets store the sensitive data within a specific location to meet data residency requirements. A global secret with user-managed replication stores its payload only in the custom set of regions you select, here europe-west9 alone."
  options:
    b:
      en: "With automatic replication, Google decides the regions, so the payload can be stored outside europe-west9 whatever key encrypts it."
    d:
      en: "IAM conditions control who can access a secret, not where its payload is stored."
    e:
      en: "The billing account location has no effect on where data is stored."
references:
  - title: Secret Manager overview
    url: https://docs.cloud.google.com/secret-manager/docs/overview
