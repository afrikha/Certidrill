id: gcppca-cs2a-signed-images
objective: "3.1.8"
type: single
caseStudy: gcppca-cs2a-emberfall
difficulty: 2
status: draft
stem:
  en: |
    Emberfall replaces Jenkins with Cloud Build and stores its container images in Artifact Registry. You need to meet the supply chain requirement for the production GKE clusters.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Enable Artifact Analysis vulnerability scanning on the Artifact Registry repository, and configure an alert that notifies the security team when a production cluster runs an image with a critical vulnerability." }
    - id: b
      text: { en: "Grant the Artifact Registry Writer role only to the Cloud Build service account, and grant engineers the Artifact Registry Reader role so that they can no longer push images." }
    - id: c
      text: { en: "Create Kubernetes RBAC roles on the production clusters so that only the Cloud Build service account can create or update Deployments, and remove that permission from engineers." }
    - id: d
      text: { en: "Add a step to the Cloud Build pipeline that creates a Binary Authorization attestation signed with a Cloud KMS key, and enforce a policy on the production clusters that requires it." }
answer: { optionId: d }
explanation:
  correct:
    en: "Binary Authorization checks every deployment against its policy at deploy time and blocks images that lack a required attestation, recording the denial in Cloud Audit Logs. A signing step in the Cloud Build pipeline creates the attestation for each image it builds, so only images built by that pipeline can run on the production clusters."
  options:
    a: { en: "Vulnerability scanning reports known vulnerabilities after the fact. It neither blocks deployments nor proves that an image was built by the Cloud Build pipeline." }
    b: { en: "Restricting who can push to one repository does not stop a deployment from referencing an image in another registry, so other images could still run." }
    c: { en: "RBAC controls who can deploy, not which images are deployed: the Cloud Build service account could still deploy an image built elsewhere, and nothing checks the image's origin." }
references:
  - title: Binary Authorization overview
    url: https://docs.cloud.google.com/binary-authorization/docs/overview
  - title: Create a Binary Authorization attestation in a Cloud Build pipeline
    url: https://docs.cloud.google.com/binary-authorization/docs/cloud-build
