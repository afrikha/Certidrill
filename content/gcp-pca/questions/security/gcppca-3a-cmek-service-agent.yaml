id: gcppca-3a-cmek-service-agent
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer tries to create a Cloud Storage bucket whose default key is a customer-managed encryption key from a key ring in the same location as the bucket. The operation fails with a permission error on the key. The developer already holds the Storage Admin role on the project.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Grant the developer the Cloud KMS Admin role on the key ring." } }
    - { id: b, text: { en: "Grant the Cloud Storage service agent of the project the Cloud KMS CryptoKey Encrypter/Decrypter role on the key." } }
    - { id: c, text: { en: "Grant the Compute Engine default service account the Cloud KMS CryptoKey Encrypter/Decrypter role on the key." } }
    - { id: d, text: { en: "Grant the developer the Cloud KMS CryptoKey Encrypter/Decrypter role on the key ring." } }
answer: { optionId: b }
explanation:
  correct:
    en: "With CMEK, the service agent of the project performs encryption and decryption on behalf of the service. As long as the Cloud Storage service agent has the CryptoKey Encrypter/Decrypter role on the key, Cloud Storage can use it; the requesting user does not need direct access to the key."
  options:
    a:
      en: "Cloud KMS Admin manages keys but does not grant cryptographic operations, and the missing permission belongs to the service agent, not the developer."
    c:
      en: "The Compute Engine default service account does not perform Cloud Storage encryption; the Cloud Storage service agent does."
    d:
      en: "Requesters do not need direct access to the key; granting it to the developer also breaks separation of duties."
references:
  - title: Customer-managed encryption keys (CMEK)
    url: https://docs.cloud.google.com/kms/docs/cmek
  - title: Customer-managed encryption keys
    url: https://docs.cloud.google.com/storage/docs/encryption/customer-managed-keys
