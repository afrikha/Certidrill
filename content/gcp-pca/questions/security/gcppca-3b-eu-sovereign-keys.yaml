id: gcppca-3b-eu-sovereign-keys
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: "A European public-sector agency is moving a citizen records system to Google Cloud. Data must stay in EU regions and support cases must be handled by personnel located in the EU. The agency must be able to approve or deny each access to its encryption keys based on the reason given by Google, and key material must stay in the agency's own key manager outside Google.\n\nWhich solution should you recommend?"
body:
  options:
    - { id: a, text: { en: "Set the gcp.resourceLocations constraint to in:eu-locations, and protect the data with CMEK keys stored in Cloud HSM in an EU region." } }
    - { id: b, text: { en: "Enable Access Approval on the organization, and protect the data with customer-supplied encryption keys (CSEK) that the agency rotates." } }
    - { id: c, text: { en: "Create an Assured Workloads folder with the EU Data Boundary, and protect the data with Cloud KMS software keys in an EU region." } }
    - { id: d, text: { en: "Create an Assured Workloads folder with the EU Data Boundary with Access Justifications, and use Cloud EKM keys with Key Access Justifications." } }
answer: { optionId: d }
explanation:
  correct:
    en: "EU Data Boundary with Access Justifications sets EU-only data location controls and routes support cases to EU personnel, and Key Access Justifications is available only with Assured Workloads, where it is enabled by default for new folders whose data boundary includes it. With Cloud EKM, key material stays in the agency's external key manager, and Key Access Justifications attaches a justification code to each key access request so that a policy can approve or deny it based on the reason."
  options:
    a:
      en: "Cloud HSM keys are held in Google's HSMs, not in the agency's key manager, and the location constraint adds no support personnel or justification-based key controls."
    b:
      en: "Access Approval governs Google personnel access to content, not each key access, and it sets no EU residency or EU support controls."
    c:
      en: "Cloud KMS software keys are held by Google, and this option gives no justification-based control over key access."
references:
  - title: "EU Data Boundary with Access Justifications"
    url: https://docs.cloud.google.com/assured-workloads/docs/control-packages/eu-data-boundary-access-justifications
  - title: "Cloud External Key Manager"
    url: https://docs.cloud.google.com/kms/docs/ekm
