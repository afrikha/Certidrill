id: gcppca-3a-ds-default-encryption
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A nonprofit stores donor reports in Cloud Storage and Cloud SQL. Its security policy requires that all data be encrypted at rest with AES-256. The nonprofit has no requirement to control, rotate, or revoke the encryption keys, and it wants the least operational overhead.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create Cloud KMS keys with automatic rotation, and configure both services to use them as customer-managed encryption keys." } }
    - { id: b, text: { en: "Generate AES-256 keys on premises, and send them as customer-supplied encryption keys with every request." } }
    - { id: c, text: { en: "Keep the default encryption at rest, which already encrypts the data with AES-256 by using keys that Google manages." } }
    - { id: d, text: { en: "Encrypt every file in the application before upload, and store the encryption key in Secret Manager." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Google Cloud encrypts all data at rest by default with AES-256, using keys that Google owns and manages. Because the nonprofit does not need to control the keys, the default encryption meets the policy with no configuration at all."
  options:
    a:
      en: "CMEK gives control over keys, which is not required here, and adds key management work and Cloud KMS costs."
    b:
      en: "Customer-supplied keys must be stored and sent by the customer, which adds the most overhead and is not supported by Cloud SQL."
    d:
      en: "Application-level encryption requires code changes and key handling that the requirement does not call for."
references:
  - title: Customer-managed encryption keys (CMEK)
    url: https://docs.cloud.google.com/kms/docs/cmek
