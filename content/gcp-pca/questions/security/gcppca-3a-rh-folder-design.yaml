id: gcppca-3a-rh-folder-design
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A holding company has three business units, each with development, test, and production workloads. Each business unit must administer its own projects. The central security team must apply a stricter set of organization policies to all production projects of every business unit, and it wants to attach that set in exactly one place in the hierarchy.

    Which resource hierarchy should you recommend?
body:
  options:
    - { id: a, text: { en: "One folder per business unit with a subfolder per environment, and the production policies attached to each production subfolder" } }
    - { id: b, text: { en: "One folder per environment with a subfolder per business unit, and the production policies attached to the production folder" } }
    - { id: c, text: { en: "One project per business unit that contains all three environments, and the production policies attached to each project" } }
    - { id: d, text: { en: "One organization per business unit, and the production policies attached to each organization resource" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Organization policies are inherited by every descendant of the resource they are attached to. With environment folders at the top, one attachment on the production folder covers the production projects of all business units, and each business unit is granted administration on its subfolders."
  options:
    a:
      en: "This also works for delegation, but the production policies must be attached to three subfolders instead of one place."
    c:
      en: "Mixing environments in one project removes the isolation between production and non-production, and policies on a project would apply to all its environments."
    d:
      en: "Separate organizations cannot share inherited policies, so the security team would have to maintain the policies in three places."
references:
  - title: About resource hierarchy
    url: https://docs.cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy
  - title: Organization Policy overview
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/overview
