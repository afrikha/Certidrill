id: gcppca-3b-data-access-gcs-reads
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: "A law firm stores case files in a Cloud Storage bucket. After an incident, auditors ask who read specific objects last week, and the security team finds that no such record exists. The firm wants these reads to be recorded from now on.\n\nWhat should you do?"
body:
  options:
    - { id: a, text: { en: "Enable Admin Activity audit logs for Cloud Storage in the project's audit configuration." } }
    - { id: b, text: { en: "Enable the DATA_READ type of Data Access audit logs for Cloud Storage." } }
    - { id: c, text: { en: "Enable Access Transparency logs for the organization." } }
    - { id: d, text: { en: "Enable VPC Flow Logs on the subnets used by the firm's workstations." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Data Access audit logs record API calls that read or modify user-provided data, such as object reads in Cloud Storage. They are disabled by default for every service except BigQuery, so the firm must enable the DATA_READ type for Cloud Storage; this can increase logging charges."
  options:
    a:
      en: "Admin Activity logs are always written and cannot be configured; they record configuration changes, not object reads."
    c:
      en: "Access Transparency records actions taken by Google personnel, not by the firm's users."
    d:
      en: "Flow logs record network flows of VM interfaces; they do not show which principal read which object through the Cloud Storage API."
references:
  - title: "Cloud Audit Logs overview"
    url: https://docs.cloud.google.com/logging/docs/audit
