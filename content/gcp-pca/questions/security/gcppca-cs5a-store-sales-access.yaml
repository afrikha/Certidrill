id: gcppca-cs5a-store-sales-access
objective: "3.1.1"
type: single
caseStudy: gcppca-cs5a-brambleway-grocers
difficulty: 2
status: draft
stem:
  en: |
    You need to give the store managers access to the sales data. The design must meet the business requirement about store sales and the technical requirement for store managers' access.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create one row access policy per store on sales.store_sales, with the store's manager as the grantee and a filter on that store's store_id, and update the policies every night from the HR export." } }
    - { id: b, text: { en: "Create one authorized view per store that selects that store's rows from sales.store_sales, and share each view with the store's manager every night from the HR export." } }
    - { id: c, text: { en: "Create one row access policy on sales.store_sales, granted to the store managers' group, with a filter that keeps the rows whose store_id the HR export maps to SESSION_USER()." } }
    - { id: d, text: { en: "Grant the store managers' group the BigQuery Data Viewer role on sales.store_sales with an IAM condition that compares the store_id of each row with the manager's email address." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A row access policy can use a subquery against a lookup table: the filter keeps the rows whose store_id appears in the HR mapping for the email address returned by SESSION_USER(). The managers query the single sales table, and when a manager moves, the nightly HR export changes the lookup table while the policy itself stays the same.
  options:
    a:
      en: Per-store policies give each manager the right rows, but someone must rewrite the policies whenever a manager moves, which the technical requirements exclude.
    b:
      en: Authorized views make managers query 320 views instead of the sales table, and the view sharing must be changed whenever a manager moves.
    d:
      en: IAM conditions are evaluated on attributes of the request and of the resource, such as the table name; they cannot filter the rows of a table.
references:
  - title: Use row-level security
    url: https://docs.cloud.google.com/bigquery/docs/managing-row-level-security
  - title: Introduction to BigQuery row-level security
    url: https://docs.cloud.google.com/bigquery/docs/row-level-security-intro
