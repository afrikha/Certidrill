id: gcppca-3a-iam-vm-service-account
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A team runs a batch application on Compute Engine VMs in the project batch-prod. The application reads objects from the bucket batch-input and publishes messages to the Pub/Sub topic batch-events. Today the VMs run as the Compute Engine default service account, which holds the Editor role on the project. You must follow Google-recommended practices for service accounts and least privilege.

    Which three actions should you take? Choose three.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Keep the default service account, and restrict the VM access scopes to Cloud Storage read-only and Pub/Sub." } }
    - { id: b, text: { en: "Create a dedicated user-managed service account for the batch application, and attach it to the VMs." } }
    - { id: c, text: { en: "Grant the new service account the Storage Object Viewer role on the batch-input bucket." } }
    - { id: d, text: { en: "Create a key for the new service account, and store it on the boot disk for the application to use." } }
    - { id: e, text: { en: "Grant the new service account the Pub/Sub Publisher role on the batch-events topic." } }
    - { id: f, text: { en: "Grant the new service account the Writer basic role on the batch-prod project so that future features keep working." } }
answer: { optionIds: [ b, c, e ] }
explanation:
  correct:
    en: "Google recommends single-purpose, user-managed service accounts attached to the resource, instead of the default service account that may receive Editor automatically. Granting Storage Object Viewer on the one bucket and Pub/Sub Publisher on the one topic gives the application exactly the access it needs, at the smallest scope."
  options:
    a:
      en: "Access scopes are too coarse for fine-grained control, and the default service account would keep the Editor role on the project."
    d:
      en: "An attached service account already provides credentials through the metadata server; a key on disk is a long-lived credential that Google recommends avoiding."
    f:
      en: "Writer is a basic role with broad access to the whole project, which breaks least privilege."
references:
  - title: Best practices for using service accounts securely
    url: https://docs.cloud.google.com/iam/docs/best-practices-service-accounts
