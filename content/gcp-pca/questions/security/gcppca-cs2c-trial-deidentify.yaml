id: gcppca-cs2c-trial-deidentify
objective: "3.2.2"
type: single
caseStudy: gcppca-cs2c-quillon
difficulty: 3
status: draft
stem:
  en: |
    You are designing the loading of clinical trial deliveries into BigQuery. The design must meet the business requirement about trial data and the technical requirement for trial datasets.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Load the files into BigQuery, protect the patient identifier columns with policy tags for column-level access control, and give data scientists access to the other columns only." }
    - id: b
      text: { en: "De-identify the patient identifiers with Sensitive Data Protection cryptographic hashing using a key wrapped by Cloud KMS before loading the files into BigQuery." }
    - id: c
      text: { en: "De-identify the patient identifiers with Sensitive Data Protection character masking that keeps only the last two characters before loading the files into BigQuery." }
    - id: d
      text: { en: "De-identify the patient identifiers with Sensitive Data Protection deterministic encryption using a key wrapped by Cloud KMS before loading the files into BigQuery." }
answer: { optionId: d }
explanation:
  correct:
    en: "Deterministic encryption with AES-SIV replaces each identifier with a token, and the same input with the same key always gives the same token, so data scientists can join a patient's records across datasets and deliveries without seeing the identity. The transformation is reversible: the pharmacovigilance team, if granted use of the Cloud KMS-wrapped key, can re-identify a patient with the reidentify method."
  options:
    a: { en: "Data scientists who cannot read the identifier columns cannot use them to join a patient's records across datasets, so the technical requirement is not met." }
    b: { en: "Cryptographic hashing keeps referential integrity, but it is not reversible, so the pharmacovigilance team could not identify a patient." }
    c: { en: "Masking is not reversible, and different patients can share the same visible characters, so records cannot be joined reliably or re-identified." }
references:
  - title: Transformation reference
    url: https://docs.cloud.google.com/sensitive-data-protection/docs/transformations-reference
  - title: Pseudonymization
    url: https://docs.cloud.google.com/sensitive-data-protection/docs/pseudonymization
