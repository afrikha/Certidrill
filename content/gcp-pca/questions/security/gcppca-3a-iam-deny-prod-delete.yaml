id: gcppca-3a-iam-deny-prod-delete
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An insurance company has 300 projects in several folders. Production projects carry the tag environment=prod. Many teams hold the Owner role on their projects, granted either on the project or inherited from a folder. The security team requires that nobody can delete a production project except the members of a break-glass group, and it does not want to change the existing allow policies.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a custom role without the project deletion permission, and ask every team to use it instead of the Owner role on its production projects." } }
    - { id: b, text: { en: "Attach a deny policy to the organization that denies projects.delete to all principals on resources tagged environment=prod, with the break-glass group as an exception." } }
    - { id: c, text: { en: "Add an IAM condition to every Owner binding so that the role applies only when the project does not carry the environment=prod tag." } }
    - { id: d, text: { en: "Move the production projects into a new folder that only the break-glass group administers, so that the inherited Owner grants no longer apply." } }
answer: { optionId: b }
explanation:
  correct:
    en: "IAM deny policies are checked before allow policies, so a denied permission stays blocked whatever roles a principal holds. A deny rule attached to the organization applies to every project below it, its condition can use resource tag functions such as matchTag to target only projects tagged environment=prod, and exception principals exempt the break-glass group. No allow policy changes."
  options:
    a:
      en: "This changes every team's allow policies, which the requirement forbids, and it depends on each team giving up the Owner role."
    c:
      en: "IAM Conditions cannot be added to the legacy basic roles Owner, Editor, and Viewer, and editing every binding also changes the allow policies."
    d:
      en: "Moving the projects changes the inherited grants that teams need to operate production, and Owner roles granted directly on the projects would still allow deletion."
references:
  - title: Deny policies
    url: https://docs.cloud.google.com/iam/docs/deny-overview
