id: gcppca-3a-rh-project-per-env
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company runs the development, staging, and production environments of its ordering application in a single project. Developers have accidentally changed production resources, and the finance team cannot separate the costs of each environment easily.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Keep the single project, and add an environment label to every resource so that developers can tell the environments apart." } }
    - { id: b, text: { en: "Keep the single project, and create one VPC network per environment with its own set of firewall rules." } }
    - { id: c, text: { en: "Create one project per environment, and grant developers access only to the development and staging projects." } }
    - { id: d, text: { en: "Create one folder per environment, and link the existing project to the three folders at the same time." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Projects are the basic boundary for IAM, quotas, and billing. Separate projects per environment let you grant developers access to non-production only, and costs are reported per project without extra work."
  options:
    a:
      en: "Labels help filtering and cost reporting, but they do not restrict IAM access, so developers can still change production."
    b:
      en: "Firewall rules control network traffic, not who can change resources through the APIs."
    d:
      en: "The hierarchy is a tree: a project has exactly one parent, so it cannot belong to three folders."
references:
  - title: About resource hierarchy
    url: https://docs.cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy
