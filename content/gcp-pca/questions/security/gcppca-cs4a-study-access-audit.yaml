id: gcppca-cs4a-study-access-audit
objective: "3.2.4"
type: multi
caseStudy: gcppca-cs4a-marrowfield-health
difficulty: 2
status: draft
stem:
  en: |
    You need to design how the compliance office will answer patient privacy requests about imaging studies. The design must meet the business requirement for the compliance office.

    Which two actions should you take? (Choose two.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable the Data Read Data Access audit logs of the Cloud Healthcare API in the audit configuration of the organization, so that every existing and future project inherits it." } }
    - { id: b, text: { en: "Enable the Data Read Data Access audit logs of the Cloud Healthcare API in the audit configuration of each imaging project when it is created." } }
    - { id: c, text: { en: "Use the Admin Activity audit logs of the Cloud Healthcare API, which are always written, and query them with the Logs Explorer of each imaging project when a request arrives." } }
    - { id: d, text: { en: "Create an aggregated sink on the organization that includes its children and routes the Cloud Healthcare API audit logs to a compliance log bucket with a 2,200-day retention, upgraded to use Observability Analytics." } }
    - { id: e, text: { en: "Enable Access Transparency for the organization, and route its logs with an organization sink to a BigQuery dataset in the compliance office's project." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Retrieving and searching DICOM studies and instances are DATA_READ operations of the Cloud Healthcare API, recorded only in Data Access audit logs, which most services do not write until you enable them; an organization-level audit configuration applies to every existing and future folder and project. An aggregated sink on the organization routes the logs of every project, including new ones, to one log bucket; a retention of 2,200 days covers six years, and upgrading the bucket to Observability Analytics (formerly Log Analytics) lets the compliance office query the entries with SQL.
  options:
    b:
      en: Configuring each project as it is created depends on a manual step, so a new project can be missed, which the requirement about projects created later does not allow.
    c:
      en: Admin Activity logs record configuration changes such as creating or deleting stores, not reads of studies, and searching each project separately does not give SQL queries across the organization.
    e:
      en: Access Transparency logs record actions taken by Google personnel on customer content, not the reads made by Marrowfield's own users and services.
references:
  - title: Cloud Healthcare API audit logging
    url: https://docs.cloud.google.com/healthcare-api/docs/how-tos/audit-logging
  - title: Enable Data Access audit logs
    url: https://docs.cloud.google.com/logging/docs/audit/configure-data-access
