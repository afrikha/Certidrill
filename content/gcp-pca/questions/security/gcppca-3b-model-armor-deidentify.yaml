id: gcppca-3b-model-armor-deidentify
objective: "3.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: "A telecom company's support assistant generates answers with a Gemini model grounded on internal documents. Testing shows that some answers contain customer phone numbers and account numbers. The company wants those values replaced in the answers, while the rest of each answer is still returned to the user. It already maintains Sensitive Data Protection templates for these infoTypes.\n\nWhat should you configure?"
body:
  options:
    - { id: a, text: { en: "A Model Armor template with the Sensitive Data Protection filter in basic mode, applied to responses in inspect and block mode." } }
    - { id: b, text: { en: "BigQuery dynamic data masking with a default masking value rule on the tables that hold the grounding documents." } }
    - { id: c, text: { en: "A Model Armor template with the Sensitive Data Protection filter in advanced mode, with an inspect and a de-identify template." } }
    - { id: d, text: { en: "A Sensitive Data Protection discovery scan on the document buckets that publishes data profiles to Security Command Center." } }
answer: { optionId: c }
explanation:
  correct:
    en: "In advanced mode, the Model Armor Sensitive Data Protection filter uses an inspect template and an optional de-identify template. With both templates, Model Armor de-identifies the infoTypes listed in them, so the sensitive values are replaced while the rest of the response can still be returned."
  options:
    a:
      en: "Basic mode detects a limited set of predefined infoTypes and reports findings; in inspect and block mode the whole answer would be blocked instead of having the values replaced."
    b:
      en: "BigQuery masking changes what users see when they query those tables; it does not change the text that the model generates."
    d:
      en: "Data profiles show where sensitive data is stored; they do not change model responses."
references:
  - title: "Create and manage templates"
    url: https://docs.cloud.google.com/model-armor/manage-templates
  - title: "Model Armor overview"
    url: https://docs.cloud.google.com/model-armor/overview
