id: gcppca-3a-cmek-autokey
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Hundreds of developers create BigQuery datasets, Cloud Storage buckets, and Compute Engine disks in projects under the folder apps. The security team requires CMEK for these resources, wants the keys kept in a separate key project and created in the same location as each resource, and does not want developers to create keys or manage IAM grants on keys.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Ask each development team to create a key ring in its own project and grant the service agents access when it creates resources." } }
    - { id: b, text: { en: "Enable Cloud KMS Autokey on the folder apps with a dedicated key project, so that keys are created on demand with each resource." } }
    - { id: c, text: { en: "Create a single key in the global location of the key project, and grant every service agent of the organization access to it." } }
    - { id: d, text: { en: "Use customer-supplied encryption keys stored in Secret Manager, and pass them with every resource creation request." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Cloud KMS Autokey automates CMEK provisioning and assignment: with dedicated-project key storage, an administrator enables it on a folder and designates a key project. When a developer creates a resource, the Autokey service agent creates the key in the same location as the resource and grants the service account encrypt and decrypt access, so developers only request keys."
  options:
    a:
      en: "Developers would create keys and manage grants themselves in their projects, which the security team does not want."
    c:
      en: "Regional resources such as a europe-west1 bucket need a key in their own location, and one shared key gives every service agent access to the same key."
    d:
      en: "Customer-supplied keys are not supported by BigQuery and add manual key handling to every request."
references:
  - title: Autokey overview
    url: https://docs.cloud.google.com/kms/docs/autokey-overview
