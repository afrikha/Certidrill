id: gcppca-3a-sc-vpcsc-dry-run
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You designed a VPC Service Controls perimeter for 20 production projects that run many data pipelines. The operations team fears that enforcing the perimeter will break cross-project integrations that nobody documented. You need to identify the requests that the perimeter would block before it blocks anything.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Enforce the perimeter during a weekend maintenance window, and remove it if any pipeline fails." } }
    - { id: b, text: { en: "Create a perimeter bridge between the 20 projects and every other project of the organization." } }
    - { id: c, text: { en: "Create the perimeter in dry run mode, and analyze the audit log entries whose metadata.dryRun field is true." } }
    - { id: d, text: { en: "Create the perimeter with an ingress rule that allows ANY_IDENTITY from any source to all services." } }
answer: { optionId: c }
explanation:
  correct:
    en: "In dry run mode, requests that violate the perimeter are logged but not denied, and the audit log entries carry metadata.dryRun set to true. You can analyze the denials, fix the configuration with ingress or egress rules, and then enforce the perimeter."
  options:
    a:
      en: "Enforcement blocks requests immediately, so production pipelines break before you learn what is missing."
    b:
      en: "Bridges connect projects across perimeters; they do not report which requests a perimeter would block, and bridging everything removes the protection."
    d:
      en: "A rule that allows everything disables the protection and produces no information about the requests that would be blocked."
references:
  - title: Dry run mode for service perimeters
    url: https://docs.cloud.google.com/vpc-service-controls/docs/dry-run-mode
