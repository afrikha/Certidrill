id: gcppca-3a-sc-hierarchical-firewall
objective: "3.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company has 120 projects in its organization, and project network administrators manage their own VPC firewall rules. The security team requires that SSH (TCP port 22) to VMs be possible only through IAP TCP forwarding in every project, that project administrators cannot override this, and that VMs serving web traffic keep their external IP addresses.

    Which two rules should you add to a hierarchical firewall policy associated with the organization? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An ingress rule with the goto_next action for TCP port 22 from 0.0.0.0/0, at a higher priority than the deny rule" } }
    - { id: b, text: { en: "An ingress rule that allows TCP port 22 from 35.235.240.0/20, at a higher priority than the deny rule" } }
    - { id: c, text: { en: "An ingress rule that denies TCP port 22 from 0.0.0.0/0 to instances with the network tag ssh-blocked" } }
    - { id: d, text: { en: "An ingress rule that denies TCP port 22 from 0.0.0.0/0" } }
    - { id: e, text: { en: "An egress rule that denies TCP port 22 to 0.0.0.0/0" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Hierarchical firewall policies associated with the organization are evaluated first, and lower-level rules cannot override them. An allow rule for 35.235.240.0/20, the range that IAP uses for TCP forwarding, evaluated before a deny rule for all other sources, leaves IAP as the only SSH path while web traffic on other ports is unaffected."
  options:
    a:
      en: "goto_next delegates the decision to lower-level policies and VPC firewall rules, so project administrators could allow SSH from the internet."
    c:
      en: "Hierarchical firewall policy rules do not support targeting by instance network tags, and project administrators control those tags."
    e:
      en: "An egress rule blocks outgoing SSH from the VMs; it does not stop inbound SSH from the internet."
references:
  - title: Hierarchical firewall policies
    url: https://docs.cloud.google.com/firewall/docs/firewall-policies
  - title: Use IAP for TCP forwarding
    url: https://docs.cloud.google.com/iap/docs/using-tcp-forwarding
