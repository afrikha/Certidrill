id: gcppca-3b-build-provenance-verified
objective: "3.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: "A software company must give auditors verifiable SLSA build provenance for every container image that it releases. Images are built with Cloud Build and stored in Artifact Registry. A review found that some releases have no provenance, and the company wants a build to fail if provenance cannot be generated.\n\nWhat should you do?"
body:
  options:
    - { id: a, text: { en: "Keep the explicit docker push step at the end of each build, and add an On-Demand Scanning step that fails the build when the scan returns no results." } }
    - { id: b, text: { en: "Add a community build step that signs a Binary Authorization attestation with a Cloud KMS key after the image is pushed to Artifact Registry." } }
    - { id: c, text: { en: "Keep the explicit docker push step at the end of each build, and set requestedVerifyOption to VERIFIED in the options section of the build config." } }
    - { id: d, text: { en: "List the images in the images field of the build config instead of using a docker push step, and set requestedVerifyOption to VERIFIED." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Cloud Build generates provenance only for images that it pushes to Artifact Registry itself through the images field; an explicit docker push step produces no provenance. Setting requestedVerifyOption to VERIFIED makes a build succeed only when provenance is generated, and auditors can inspect it with gcloud artifacts docker images describe --show-provenance or verify it with slsa-verifier."
  options:
    a:
      en: "On-Demand Scanning reports vulnerabilities; it neither creates provenance nor detects that it is missing, and the docker push step still prevents provenance."
    b:
      en: "An attestation records that an image passed a stage of your process; it is not SLSA provenance describing the sources, build steps and builder."
    c:
      en: "Cloud Build does not generate provenance for images pushed by a docker push step, so with VERIFIED every release build would fail instead of producing provenance."
references:
  - title: "Generate and validate build provenance"
    url: https://docs.cloud.google.com/build/docs/securing-builds/generate-validate-build-provenance
