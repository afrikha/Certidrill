id: gcppca-3a-sod-access-approval
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A defense contractor requires that Google support and engineering personnel never access its customer data in Google Cloud without explicit approval from the contractor's own administrators. It also wants a log of the actions that Google personnel take when they access the data.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable Access Transparency for the organization." } }
    - { id: b, text: { en: "Enable Data Access audit logs for every service in the organization." } }
    - { id: c, text: { en: "Create a VPC Service Controls perimeter around the projects that contain customer data." } }
    - { id: d, text: { en: "Protect all customer data with customer-managed keys in Cloud HSM." } }
    - { id: e, text: { en: "Enable Access Approval for the organization, and configure the approvers to be notified." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "Access Transparency logs the actions Google personnel take when they access customer data. Access Approval requires that Google personnel get explicit approval from an authorized customer administrator before access, and Access Transparency must be enabled for the organization before Access Approval can be enabled."
  options:
    b:
      en: "Data Access audit logs record API calls made by the customer's principals; they neither show Google personnel actions nor require approval."
    c:
      en: "A service perimeter limits data movement across its boundary; it does not create an approval step for Google personnel."
    d:
      en: "CMEK controls the keys but adds no approval workflow and no log of Google personnel actions."
references:
  - title: Overview of Access Approval
    url: https://docs.cloud.google.com/assured-workloads/access-approval/docs/overview
