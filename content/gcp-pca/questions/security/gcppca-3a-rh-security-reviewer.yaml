id: gcppca-3a-rh-security-reviewer
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An external audit firm must list the allow policies of every project and folder and of the organization resource of a company, including projects that are created during the audit. The auditors must not read application data or change any configuration.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Grant the Reader basic role to the auditors group on each existing project." } }
    - { id: b, text: { en: "Grant the Security Reviewer role to the auditors group on the organization resource." } }
    - { id: c, text: { en: "Grant the Organization Administrator role to the auditors group on the organization resource." } }
    - { id: d, text: { en: "Grant the Security Reviewer role to the auditors group on each existing project." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Security Reviewer (roles/iam.securityReviewer) provides permissions to list all resources and the allow policies on them. Granted on the organization, it is inherited by every folder and project, including projects created later."
  options:
    a:
      en: "Reader is a basic role that can read resource data in many services, and project grants miss the folders, the organization, and new projects."
    c:
      en: "Organization Administrator can change IAM policies, which the auditors must not be able to do."
    d:
      en: "Project grants do not cover the folders, the organization resource, or the projects created during the audit."
references:
  - title: About resource hierarchy
    url: https://docs.cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy
  - title: Identity and Access Management roles and permissions
    url: https://docs.cloud.google.com/iam/docs/roles-permissions/iam
