id: gcppca-3b-agent-platform-vpcsc
objective: "3.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: "A pharmaceutical company trains and serves models with Gemini Enterprise Agent Platform. Training data is in Cloud Storage and BigQuery in the same project. Security requires that training data, models and inference results cannot be copied to projects outside the company, even by a user with valid credentials, and that data scientists can still work from the corporate network.\n\nWhat should you do?"
body:
  options:
    - { id: a, text: { en: "Enable Private Google Access on the project's subnets, and remove the external IP addresses from all notebook and training instances." } }
    - { id: b, text: { en: "Create a VPC Service Controls perimeter around the project for Agent Platform, Cloud Storage and BigQuery, with an access level for corporate IP ranges." } }
    - { id: c, text: { en: "Encrypt the datasets, models and endpoints with customer-managed encryption keys stored in a separate security project." } }
    - { id: d, text: { en: "Create VPC firewall egress rules that deny all traffic from the project's subnets except traffic to the restricted.googleapis.com range." } }
answer: { optionId: b }
explanation:
  correct:
    en: "VPC Service Controls mitigates data exfiltration from Agent Platform: training data, models, online inference requests and batch inference results cannot leave the perimeter, and public internet access to the protected services is blocked. An access level lets requests from the corporate IP ranges in."
  options:
    a:
      en: "Private Google Access provides a private route to Google APIs, but it does not remove their public reachability or stop copies to other projects."
    c:
      en: "CMEK controls the keys that protect data at rest; a user who can read the data can still copy it to a project outside the company."
    d:
      en: "Firewall rules control VM traffic only; API calls made from outside the VPC, for example with stolen credentials, are not affected."
references:
  - title: "VPC Service Controls with Gemini Enterprise Agent Platform"
    url: https://docs.cloud.google.com/vertex-ai/docs/general/vpc-service-controls
