id: gcppca-3a-rh-sandbox-folder
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company wants its developers to create their own experimentation projects without opening tickets. These projects must never contain VMs with external IPv4 addresses, and developers must not be able to create projects anywhere else in the resource hierarchy.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a folder named sandbox, and grant the developers group the Project Creator role on that folder." } }
    - { id: b, text: { en: "Grant the developers group the Project Creator role on the organization, and ask them to select the sandbox folder." } }
    - { id: c, text: { en: "Create a custom role on the sandbox folder that combines the Project Creator and Compute Admin permissions." } }
    - { id: d, text: { en: "Set the constraint compute.vmExternalIpAccess on the sandbox folder so that it denies all values." } }
    - { id: e, text: { en: "Create a VPC firewall rule in each sandbox project that denies egress traffic to 0.0.0.0/0." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Granting Project Creator on the sandbox folder lets developers create projects only under that folder. The compute.vmExternalIpAccess list constraint defines which VMs may use external IPv4 addresses; denying all values on the folder is inherited by every sandbox project, including projects created later."
  options:
    b:
      en: "A grant on the organization lets developers create projects anywhere in the hierarchy, which the requirement forbids."
    c:
      en: "Custom roles cannot be defined at the folder level, only in an organization or a project."
    e:
      en: "A firewall rule does not prevent external IP addresses from being assigned, and project owners can delete the rule."
references:
  - title: Organization Policy overview
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/overview
  - title: Roles overview
    url: https://docs.cloud.google.com/iam/docs/roles-overview
