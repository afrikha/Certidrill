id: gcppca-3b-fpe-legacy-format
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: "A utility company must share billing data with a third-party analytics partner. The 16-digit customer account numbers must be tokenized before sharing, but the partner's software rejects any value that is not exactly 16 digits. The company's billing team must be able to convert tokens returned by the partner back to the original account numbers.\n\nWhich Sensitive Data Protection transformation should you use?"
body:
  options:
    - { id: a, text: { en: "Deterministic encryption (AES-SIV) with a key wrapped by Cloud KMS" } }
    - { id: b, text: { en: "Cryptographic hashing (HMAC-SHA-256) with a key wrapped by Cloud KMS" } }
    - { id: c, text: { en: "Replacement of each account number with the name of its infoType" } }
    - { id: d, text: { en: "Format-preserving encryption (FPE-FFX) with a key wrapped by Cloud KMS" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Format-preserving encryption keeps the length and character set of the input, so a 16-digit number becomes another 16-digit token, and it can be reversed with the same key through re-identification. A Cloud KMS-wrapped key is the most secure key option."
  options:
    a:
      en: "AES-SIV output is base64-encoded and does not keep the 16-digit format, so the partner's software would reject it."
    b:
      en: "Hashing is one-way, so the billing team could not recover account numbers, and the output is not 16 digits."
    c:
      en: "Replacing every value with the infoType name loses the link to each customer and cannot be reversed."
references:
  - title: "Pseudonymization"
    url: https://docs.cloud.google.com/sensitive-data-protection/docs/pseudonymization
