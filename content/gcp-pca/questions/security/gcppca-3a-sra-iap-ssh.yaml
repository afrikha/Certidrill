id: gcppca-3a-sra-iap-ssh
objective: "3.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Administrators need SSH access to Compute Engine VMs that have no external IP addresses. The company does not want to maintain bastion hosts or a VPN, and access must be controlled per user with IAM.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a firewall rule that allows ingress on TCP port 22 from 35.235.240.0/20 to the VMs." } }
    - { id: b, text: { en: "Configure Cloud NAT for the subnets of the VMs so that administrators can reach them from the internet." } }
    - { id: c, text: { en: "Grant the administrators the IAP-secured Web App User role on the project that contains the VMs." } }
    - { id: d, text: { en: "Grant the administrators the IAP-secured Tunnel User role, and have them connect with gcloud compute ssh." } }
    - { id: e, text: { en: "Create a firewall rule that allows ingress on TCP port 22 from 0.0.0.0/0 to the VMs." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "IAP TCP forwarding creates an encrypted tunnel to VMs without external IP addresses. The VMs must accept port 22 from 35.235.240.0/20, the range IAP uses for TCP forwarding, and users need the IAP-secured Tunnel User role; gcloud compute ssh uses IAP tunneling automatically when the VM has no external IP."
  options:
    b:
      en: "Cloud NAT provides outbound connectivity only; it does not allow inbound connections from the internet."
    c:
      en: "IAP-secured Web App User controls access to HTTPS applications behind IAP, not TCP tunnels."
    e:
      en: "Opening port 22 to the internet is unnecessary for IAP and exposes the VMs if they ever get an external address."
references:
  - title: Use IAP for TCP forwarding
    url: https://docs.cloud.google.com/iap/docs/using-tcp-forwarding
