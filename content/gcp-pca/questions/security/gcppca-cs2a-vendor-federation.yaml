id: gcppca-cs2a-vendor-federation
objective: "3.1.7"
type: single
caseStudy: gcppca-cs2a-emberfall
difficulty: 1
status: draft
stem:
  en: |
    The anti-cheat partner will send its detections for Shardline 2 to a Pub/Sub topic named `cheat-detections` in an Emberfall project. You need to give the partner's workloads access that meets the partner access requirement and the business requirement about credentials.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create a service account with the Pub/Sub Publisher role on the topic, create a key for it, and store the key in the partner's AWS Secrets Manager with automatic rotation every 30 days." }
    - id: b
      text: { en: "Create a workload identity pool with an AWS provider for the partner's AWS account, and let the partner's IAM role impersonate a service account that has the Pub/Sub Publisher role on the topic." }
    - id: c
      text: { en: "Create a push subscription on the topic that points to an HTTPS endpoint hosted by the partner, and protect the endpoint with an API key that Emberfall rotates every 30 days." }
    - id: d
      text: { en: "Add the partner's engineers to a Google group, grant the group the Pub/Sub Publisher role on the topic, and have the workloads use the engineers' user credentials." }
answer: { optionId: b }
explanation:
  correct:
    en: "Workload Identity Federation lets workloads on AWS exchange their AWS credentials for short-lived Google Cloud tokens, so no service account key has to be created, stored or rotated. Granting the Workload Identity User role on a dedicated service account to the federated identities of the partner's IAM role, and the Pub/Sub Publisher role on the topic to that service account, limits the partner to publishing on that topic."
  options:
    a: { en: "A service account key is a long-lived credential, even when it is rotated, so the partner would still hold a key to Emberfall's resources." }
    c: { en: "A push subscription delivers messages from the topic to a subscriber endpoint; it does not let the partner publish detections, and an API key is another shared secret." }
    d: { en: "Running workloads with people's user credentials is not a workload identity, ties access to individuals, and still requires the partner to store long-lived refresh tokens." }
references:
  - title: Configure Workload Identity Federation with AWS or Azure VMs
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-other-clouds
