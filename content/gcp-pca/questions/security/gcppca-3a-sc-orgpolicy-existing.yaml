id: gcppca-3a-sc-orgpolicy-existing
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Last week, the security team enforced the constraint compute.vmExternalIpAccess at the organization with no allowed values. A scan today still finds 35 VMs, created months ago, that have external IPv4 addresses. The team wants to remove this exposure.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Wait for the policy to propagate, because enforcement on existing VMs can take up to 30 days." } }
    - { id: b, text: { en: "Switch the policy to dry-run mode, which removes the external addresses of noncompliant VMs." } }
    - { id: c, text: { en: "Remove the external addresses from the 35 VMs, because new policies are usually not retroactive." } }
    - { id: d, text: { en: "Enforce the constraint again on each project, because organization policies skip existing projects." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The application of new organization policies is usually not retroactive: the constraint blocks creating or updating VMs with external IPv4 addresses, but existing noncompliant resources must be fixed manually. Removing the external addresses from the 35 VMs closes the exposure, and the policy prevents new ones."
  options:
    a:
      en: "No propagation delay makes the policy apply to existing VMs; they stay noncompliant until someone changes them."
    b:
      en: "Dry-run mode only logs violations without blocking anything; it never changes resources."
    d:
      en: "Policies at the organization are inherited by all projects, existing and new; the issue is existing VMs, not existing projects."
references:
  - title: Organization Policy overview
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/overview
