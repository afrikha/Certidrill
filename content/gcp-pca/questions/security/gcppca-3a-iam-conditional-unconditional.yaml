id: gcppca-3a-iam-conditional-unconditional
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You granted the group ops-oncall the Compute Instance Admin (v1) role on the project web-prod with an IAM condition that allows access only between 08:00 and 20:00 in the company time zone. At 23:00, an engineer of ops-oncall still stops a VM in web-prod. Policy Troubleshooter shows that the engineer is also a member of the group platform-admins, which holds Compute Instance Admin (v1) without a condition on the folder that contains web-prod.

    What should you do to make the time restriction effective for this engineer?
body:
  options:
    - { id: a, text: { en: "Move the conditional binding from the project to the folder, because project conditions are ignored when a folder grant exists." } }
    - { id: b, text: { en: "Replace the condition with a deny policy on web-prod that denies compute permissions outside working hours, because conditions ignore time zones." } }
    - { id: c, text: { en: "Recreate the conditional binding with the Owner basic role, because conditions are evaluated before inherited predefined roles." } }
    - { id: d, text: { en: "Remove the engineer from platform-admins or make that folder grant conditional too, because a conditional binding never overrides an unconditional one." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Conditional role bindings do not override unconditional ones: a principal that holds a role without a condition keeps it whatever conditions apply elsewhere. The engineer inherits the same role unconditionally from the folder through platform-admins, so that grant must be removed or made conditional as well."
  options:
    a:
      en: "Conditions on project bindings are evaluated normally; the problem is the second, unconditional grant that the engineer inherits."
    b:
      en: "Time conditions support time zones, and deny policy conditions recognize only resource tag functions, so they cannot express working hours."
    c:
      en: "IAM Conditions cannot be added to legacy basic roles such as Owner, and Owner would grant far more access."
references:
  - title: Overview of IAM Conditions
    url: https://docs.cloud.google.com/iam/docs/conditions-overview
  - title: Deny policies
    url: https://docs.cloud.google.com/iam/docs/deny-overview
