id: gcppca-3b-date-shift-health-research
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: "A hospital network shares patient encounter records with a research team. Health privacy rules require removing exact dates such as admission and discharge dates, but the researchers must still compute the length of each stay and the time between a patient's encounters. Each record contains a patient_id column.\n\nWhich Sensitive Data Protection transformation should you apply to the date columns?"
body:
  options:
    - { id: a, text: { en: "Bucketing that replaces each date with the year in which it falls." } }
    - { id: b, text: { en: "Time extraction that keeps only the month of each date." } }
    - { id: c, text: { en: "Date shifting by a random number of days, using patient_id as the context." } }
    - { id: d, text: { en: "Redaction that removes each date from the shared records." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Date shifting moves dates by a random number of days and preserves their sequence and duration. Using patient_id as the context shifts all dates of the same patient by the same amount, so stay lengths and intervals between encounters stay correct while exact dates are removed."
  options:
    a:
      en: "Generalizing to the year loses the day-level detail that the researchers need to compute durations."
    b:
      en: "Keeping only the month removes the days and years needed to compute durations and intervals."
    d:
      en: "Redacting the dates removes the data needed for any duration calculation."
references:
  - title: "Transformation reference"
    url: https://docs.cloud.google.com/sensitive-data-protection/docs/transformations-reference
