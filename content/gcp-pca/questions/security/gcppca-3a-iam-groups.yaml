id: gcppca-3a-iam-groups
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company onboards about 15 engineers per month to its data platform. Today, an administrator adds each engineer individually to the allow policies of eight projects, and access of engineers who leave is often not removed. The company wants access changes to require the least ongoing effort while keeping least privilege.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Grant the required predefined roles to one shared service account, and give its key to every engineer of the data platform." } }
    - { id: b, text: { en: "Grant the Writer basic role to the company domain principal so that every employee already has access to the eight projects." } }
    - { id: c, text: { en: "Create one custom role per engineer at the organization level that combines the permissions needed in the eight projects." } }
    - { id: d, text: { en: "Grant the required predefined roles to a Google group in each project, and manage access by changing the membership of the group." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Google recommends granting roles to groups instead of individual users. The allow policies stay stable, and onboarding or offboarding becomes a single change to the group membership, which also makes departures easy to handle."
  options:
    a:
      en: "Sharing a service account key removes individual accountability, and keys are a security risk that Google recommends avoiding."
    b:
      en: "Granting a basic role to the whole domain gives broad access to every employee, which breaks least privilege."
    c:
      en: "One custom role per engineer still requires one binding per engineer and multiplies the roles to maintain, so the effort does not decrease."
references:
  - title: Use IAM securely
    url: https://docs.cloud.google.com/iam/docs/using-iam-securely
