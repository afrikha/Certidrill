id: gcppca-cs5b-mediation-identity
objective: "3.1.7"
type: single
caseStudy: gcppca-cs5b-corvane-telecom
difficulty: 2
status: draft
stem:
  en: |
    You need to let the mediation servers upload CDR files to a Cloud Storage bucket. The solution must meet the technical requirement for the mediation servers and follow Google-recommended practices.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a workload identity pool with an X.509 provider whose trust store contains Corvane's root CA as trust anchor and the issuing CA as intermediate certificate, and grant the Storage Object Creator role on the bucket to the federated principals of the servers." } }
    - { id: b, text: { en: "Create a service account with the Storage Object Creator role on the bucket, store a service account key on each server in a file readable only by the mediation process, and rotate the keys every 90 days." } }
    - { id: c, text: { en: "Create HMAC keys for a service account with the Storage Object Creator role on the bucket, and configure the mediation servers to upload the files through the Cloud Storage XML API." } }
    - { id: d, text: { en: "Create a VPC Service Controls perimeter around the project of the bucket with an access level that allows the IP ranges of the switching sites, and allow unauthenticated uploads to the bucket from inside the perimeter." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Workload Identity Federation with X.509 certificates lets workloads that hold certificates from the company's own CA obtain short-lived Google Cloud credentials over mutual TLS, without service account keys. The trust store holds the root CA as trust anchor and the issuing CA as intermediate certificate, and Google recommends granting roles directly to the federated principals. The one-year certificates stay under the 390-day maximum lifetime of leaf certificates.
  options:
    b:
      en: A service account key is a long-lived secret stored on the servers, which the technical requirements forbid, even with regular rotation.
    c:
      en: HMAC keys are long-lived secrets as well, and they do not use the servers' existing certificates.
    d:
      en: A perimeter and an access level restrict where requests can come from but do not authenticate anyone; Cloud Storage still needs an authenticated principal with an IAM role to accept the uploads, and the certificates are not used.
references:
  - title: Configure Workload Identity Federation with X.509 certificates
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-x509-certificates
