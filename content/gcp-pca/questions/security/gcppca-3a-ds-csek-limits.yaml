id: gcppca-3a-ds-csek-limits
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A research lab encrypts sensitive objects in Cloud Storage with customer-supplied encryption keys (CSEK) that it generates on premises. The lab now wants to process these objects with Dataflow pipelines and copy them between buckets with Storage Transfer Service. It still requires control over the keys and the ability to make the data unreadable by disabling a key.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Keep CSEK, and pass the keys to the Dataflow jobs and the Storage Transfer Service jobs as job parameters." } }
    - { id: b, text: { en: "Keep CSEK, and copy the objects through a Compute Engine VM that decrypts them before each transfer." } }
    - { id: c, text: { en: "Rewrite the objects with customer-managed encryption keys in Cloud KMS, and grant the service agents access to the key." } }
    - { id: d, text: { en: "Rewrite the objects with default encryption only, which both Dataflow and Storage Transfer Service support." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Storage Transfer Service and Dataflow do not support objects encrypted with customer-supplied encryption keys. CMEK keeps the keys under the lab's control in Cloud KMS: the service agents get encrypt and decrypt access, and disabling or destroying the key makes the data inaccessible."
  options:
    a:
      en: "These services cannot read CSEK-encrypted objects, and passing raw keys as parameters would expose them."
    b:
      en: "A custom copy VM adds operational overhead, exposes the keys to more systems, and still does not let Dataflow process the objects in place."
    d:
      en: "Default encryption uses keys that Google owns and manages, so the lab loses the ability to disable the key."
references:
  - title: Customer-supplied encryption keys
    url: https://docs.cloud.google.com/storage/docs/encryption/customer-supplied-keys
  - title: Customer-managed encryption keys (CMEK)
    url: https://docs.cloud.google.com/kms/docs/cmek
