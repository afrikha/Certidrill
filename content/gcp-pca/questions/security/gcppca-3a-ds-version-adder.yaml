id: gcppca-3a-ds-version-adder
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Every quarter, a release pipeline service account must upload a new version of a signing certificate to an existing secret in Secret Manager. Security policy states that the pipeline must never read any secret payload and must never disable or destroy secret versions.

    Which role should you grant to the pipeline service account on the secret?
body:
  options:
    - { id: a, text: { en: "Secret Manager Secret Accessor" } }
    - { id: b, text: { en: "Secret Manager Secret Version Manager" } }
    - { id: c, text: { en: "Secret Manager Admin" } }
    - { id: d, text: { en: "Secret Manager Secret Version Adder" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Secret Manager Secret Version Adder (roles/secretmanager.secretVersionAdder) only allows adding new versions to existing secrets. It does not allow reading payloads or changing the state of existing versions."
  options:
    a:
      en: "Secret Accessor reads secret payloads, which the pipeline must never do, and it cannot add versions."
    b:
      en: "Secret Version Manager can also enable, disable, and destroy versions, which the policy forbids."
    c:
      en: "Secret Manager Admin has complete control, including reading payloads and deleting secrets."
references:
  - title: Access control with IAM
    url: https://docs.cloud.google.com/secret-manager/docs/access-control
