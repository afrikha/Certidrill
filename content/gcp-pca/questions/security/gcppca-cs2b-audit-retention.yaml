id: gcppca-cs2b-audit-retention
objective: "3.2.4"
type: single
caseStudy: gcppca-cs2b-laurentide
difficulty: 3
status: draft
stem:
  en: |
    You need to design the retention of Laurentide's Cloud Audit Logs. The design must meet the business requirements about audit logs and data residency, and the technical requirements for audit logs.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create an aggregated sink on the organization that includes its children and routes audit logs to a log bucket in a central logging project in northamerica-northeast1, with a 12-year retention period, and lock the bucket." }
    - id: b
      text: { en: "Create a sink in each project that routes audit logs to a BigQuery dataset in northamerica-northeast1, and set a default table expiration of 12 years on the dataset." }
    - id: c
      text: { en: "Create an aggregated sink on the organization that includes its children and routes audit logs to a Cloud Storage bucket in northamerica-northeast1 that uses the Archive class and a 12-year retention policy locked with Bucket Lock." }
    - id: d
      text: { en: "Set the retention period of the _Required log bucket of each project to 12 years, and add this step to the bank's project creation checklist so that new projects are configured the same way." }
answer: { optionId: c }
explanation:
  correct:
    en: "An aggregated sink on the organization routes the logs of every folder and project below it, including projects created later. A Cloud Storage bucket in Montréal keeps the logs in Canada, the Archive class minimizes the cost of logs that are rarely read, and a locked retention policy cannot be removed or shortened, so no object can be deleted or replaced before 12 years, even by an administrator."
  options:
    a: { en: "Log buckets accept a retention period of 1 to 3,650 days, so they cannot keep logs for 12 years." }
    b: { en: "Per-project sinks do not cover new projects automatically, and table expiration does not prevent an administrator from deleting or changing the data before the 12 years." }
    d: { en: "The retention period of the _Required log bucket cannot be changed, and a manual checklist does not cover new projects automatically." }
references:
  - title: Bucket Lock
    url: https://docs.cloud.google.com/storage/docs/bucket-lock
  - title: Configure log buckets
    url: https://docs.cloud.google.com/logging/docs/buckets
