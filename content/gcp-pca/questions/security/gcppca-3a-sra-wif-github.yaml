id: gcppca-3a-sra-wif-github
objective: "3.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A software company deploys to Google Cloud from GitHub Actions workflows. Today the workflows authenticate with a service account key stored as a GitHub secret. The security team wants to remove all long-lived credentials and ensure that only workflows from the repository example-org/billing can obtain access.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a workforce pool with a GitHub provider, and grant the deployment roles to all identities in the pool." } }
    - { id: b, text: { en: "Create a workload identity pool with a GitHub OIDC provider and an attribute condition that accepts only the example-org/billing repository." } }
    - { id: c, text: { en: "Grant the deployment roles to the principal set of the pool whose mapped repository attribute is example-org/billing." } }
    - { id: d, text: { en: "Rotate the service account key every 24 hours with a Cloud Scheduler job that also updates the GitHub secret." } }
    - { id: e, text: { en: "Grant the deployment roles to every identity in the workload identity pool by using a principalSet ending in /*." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "Workload Identity Federation exchanges the GitHub OIDC token for a short-lived federated token, so no key is stored. An attribute condition on the provider rejects tokens from other repositories, and granting roles to the principalSet that matches the repository attribute limits access further, as Google recommends."
  options:
    a:
      en: "Workforce pools federate human users, not CI workloads, and granting roles to the whole pool is overly broad."
    d:
      en: "A rotated key is still a long-lived credential stored outside Google Cloud, which the requirement forbids."
    e:
      en: "Granting access to every identity in the pool can let other workflows obtain access; Google recommends limiting access with attributes and conditions."
references:
  - title: Workload Identity Federation
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation
