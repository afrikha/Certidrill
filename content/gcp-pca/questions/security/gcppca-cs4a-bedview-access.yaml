id: gcppca-cs4a-bedview-access
objective: "3.1.5"
type: single
caseStudy: gcppca-cs4a-marrowfield-health
difficulty: 2
status: draft
stem:
  en: |
    BedView now runs on its managed instance group behind the global external Application Load Balancer. You need to replace the VPN concentrator. The solution must meet the business requirement about access to BedView and the technical requirement for BedView.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Enable IAP on BedView's backend service, and grant the clinicians group the IAP-secured Web App User role on the backend service so that every clinician signs in with Cloud Identity." } }
    - { id: b, text: { en: "Attach a Cloud Armor security policy to BedView's backend service that allows only the public IP address ranges of the hospitals and denies all other traffic." } }
    - { id: c, text: { en: "Create a VPC Service Controls perimeter around BedView's project, with an ingress rule that requires an access level whose device policy requires a company-owned device." } }
    - { id: d, text: { en: "Enable IAP on BedView's backend service, and grant the clinicians group the IAP-secured Web App User role on condition of an access level that requires a company-owned device." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      IAP authenticates every request to the load balancer's backend service with the user's Cloud Identity account, without a VPN and without changing BedView's code. Context-aware access adds an Access Context Manager access level to the IAP-secured Web App User binding as an IAM condition; with Endpoint Verification and Chrome Enterprise Premium licenses, the device policy can require a company-owned device, so only hospital-issued laptops get in, from any network.
  options:
    a:
      en: IAP alone checks the identity and group of the user but not the device, so a clinician could open BedView from a personal computer.
    b:
      en: An IP allowlist blocks clinicians who work from home or from other places, and it checks neither the user's identity nor the device.
    c:
      en: VPC Service Controls protects access to Google Cloud APIs of the services in the perimeter; it does not control access to a web application served through a load balancer.
references:
  - title: Setting up context-aware access with Identity-Aware Proxy
    url: https://docs.cloud.google.com/iap/docs/cloud-iap-context-aware-access-howto
  - title: Access level attributes
    url: https://docs.cloud.google.com/access-context-manager/docs/access-level-attributes
