id: gcppca-3a-sod-iam-admin
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A central access team manages the allow policies of 200 projects in the folder corp. The team must be able to grant and revoke roles on these projects, but it must not have direct read, write, or administrative access to the resources in the projects.

    Which role should you grant to the access team on the folder corp?
body:
  options:
    - { id: a, text: { en: "Admin" } }
    - { id: b, text: { en: "Project IAM Admin" } }
    - { id: c, text: { en: "Security Reviewer" } }
    - { id: d, text: { en: "Writer" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Project IAM Admin lets a principal modify the allow policies of projects without also giving direct read, write, and administrative access to their resources. Granted on the folder, it is inherited by the 200 projects."
  options:
    a:
      en: "The Admin basic role gives broad access to the resources in the projects, which the team must not have."
    c:
      en: "Security Reviewer only lists resources and allow policies; it cannot grant or revoke roles."
    d:
      en: "The Writer basic role gives broad write access to resources and does not allow managing allow policies."
references:
  - title: Use IAM securely
    url: https://docs.cloud.google.com/iam/docs/using-iam-securely
