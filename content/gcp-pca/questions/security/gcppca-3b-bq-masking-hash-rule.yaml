id: gcppca-3b-bq-masking-hash-rule
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: "A marketplace uses BigQuery dynamic data masking on its customer data. A new partner-analytics group must join the orders and support_tickets tables on their customer email columns, which share the same data policy, but must not see any part of an email address, including its domain. The group has the Masked Reader role on that data policy.\n\nWhich masking rule should the data policy use?"
body:
  options:
    - { id: a, text: { en: "Email mask" } }
    - { id: b, text: { en: "Hash (SHA-256)" } }
    - { id: c, text: { en: "Default masking value" } }
    - { id: d, text: { en: "Nullify" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The Hash (SHA-256) rule returns the hash of each email, which is the same for the same address in both tables, so masked values can still be joined while no part of the address is visible. BigQuery documents that hash-based rules keep values joinable, whereas nullify and default values do not."
  options:
    a:
      en: "The email mask hides the user name but keeps the domain visible, which the requirement forbids, and different addresses on the same domain become identical."
    c:
      en: "A default value is the same for every row, so joins on the column would match unrelated customers."
    d:
      en: "Nullify returns NULL, and NULL values never match in a join."
references:
  - title: "Introduction to data masking"
    url: https://docs.cloud.google.com/bigquery/docs/column-data-masking-intro
