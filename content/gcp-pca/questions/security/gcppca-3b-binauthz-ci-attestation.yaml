id: gcppca-3b-binauthz-ci-attestation
objective: "3.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: "A fintech company runs its production workloads on GKE Standard clusters. Container images are built by Cloud Build and pushed to Artifact Registry, but some teams still deploy images that they build on their workstations or pull from public registries. The security team requires that production clusters run only images produced by the approved Cloud Build pipeline, and that any other deployment is blocked at admission time.\n\nWhat should you do?"
body:
  options:
    - { id: a, text: { en: "Grant the Artifact Registry Writer role on the production repository only to the Cloud Build service account, so that no other principal can push images." } }
    - { id: b, text: { en: "Enable automatic vulnerability scanning in Artifact Analysis, and create Cloud Monitoring alerts for images that have critical findings." } }
    - { id: c, text: { en: "Add a pipeline step that signs an attestation with a Cloud KMS key, and enforce a Binary Authorization policy that requires it on the production clusters." } }
    - { id: d, text: { en: "Create a VPC Service Controls perimeter around the production project, so that the clusters pull images only from Artifact Registry inside it." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Binary Authorization enforces a policy at deploy time: with the REQUIRE_ATTESTATION evaluation mode, a Pod is admitted only if an attestor can verify a signed attestation for the image digest. Signing the attestation in the Cloud Build pipeline with a Cloud KMS key proves that the image went through that pipeline; every other image is blocked and the reason is written to Cloud Audit Logs."
  options:
    a:
      en: "Restricting who can push protects one repository, but a deployment can still reference an image in another registry, so nothing is blocked at admission time."
    b:
      en: "Scanning reports known vulnerabilities; it does not prove which pipeline built an image and it never blocks a deployment."
    d:
      en: "A perimeter protects Google APIs against data exfiltration; it does not stop nodes from pulling public images over the internet and does not check how an image was built."
references:
  - title: "Binary Authorization overview"
    url: https://docs.cloud.google.com/binary-authorization/docs/overview
  - title: "Create a Binary Authorization attestation in a Cloud Build pipeline"
    url: https://docs.cloud.google.com/binary-authorization/docs/cloud-build
