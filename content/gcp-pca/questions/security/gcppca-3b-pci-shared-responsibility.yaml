id: gcppca-3b-pci-shared-responsibility
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: "A payment services company runs its cardholder data environment on Compute Engine VMs. Its qualified security assessor notes that Google Cloud follows the PCI DSS requirements for a Level 1 Service Provider and asks which controls remain the company's responsibility.\n\nWhich task is the company's responsibility?"
body:
  options:
    - { id: a, text: { en: "Physical access controls and video monitoring at the data centers that host the VMs." } }
    - { id: b, text: { en: "Patching the operating systems and packages installed on the VMs in the cardholder data environment." } }
    - { id: c, text: { en: "Secure destruction of the physical disks that stored cardholder data when hardware is retired." } }
    - { id: d, text: { en: "Patching the hypervisor and host firmware of the physical servers that run the VMs." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Google Cloud follows the PCI DSS requirements for a Level 1 Service Provider for the infrastructure it operates, and Google's Shared Responsibility Matrix splits the requirements. Merchants remain responsible for the operating systems, packages and applications they deploy, so patching the VM operating systems and packages is the company's task."
  options:
    a:
      en: "Physical security of Google data centers is operated by Google."
    c:
      en: "Disposal of Google's physical storage media is operated by Google."
    d:
      en: "The hypervisor and host firmware belong to the infrastructure that Google manages."
references:
  - title: "PCI Data Security Standard compliance"
    url: https://docs.cloud.google.com/architecture/pci-dss-compliance-in-gcp
