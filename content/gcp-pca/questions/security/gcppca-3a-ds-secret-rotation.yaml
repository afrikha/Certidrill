id: gcppca-3a-ds-secret-rotation
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores the API credentials of a payment partner in Secret Manager. Compliance requires that the credentials be rotated every 30 days. The partner exposes an API that issues new credentials. You configured a rotation schedule of 30 days and a Pub/Sub topic on the secret.

    What else must you do so that the credentials are actually rotated?
body:
  options:
    - { id: a, text: { en: "Deploy a Cloud Run function that subscribes to the topic, handles SECRET_ROTATE messages, gets new credentials, and adds a secret version." } }
    - { id: b, text: { en: "Nothing else, because Secret Manager generates a new random secret version at each scheduled rotation time." } }
    - { id: c, text: { en: "Enable automatic rotation on the Cloud KMS key that protects the secret so that the payload changes every 30 days." } }
    - { id: d, text: { en: "Set an expiration of 30 days on the secret so that Secret Manager requests new credentials from the partner." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A rotation schedule only makes Secret Manager send notifications to the Pub/Sub topics associated with the secret at the scheduled time. You must configure a subscriber that acts on the SECRET_ROTATE messages: it obtains new credentials from the partner and adds them as a new secret version."
  options:
    b:
      en: "Secret Manager does not change the secret value itself; it only sends the rotation notification."
    c:
      en: "Rotating a Cloud KMS key creates a new key version for encryption; it does not change the stored credentials."
    d:
      en: "An expiration removes the secret at the chosen time; it does not obtain new credentials, and applications would lose access."
references:
  - title: Create rotation schedules in Secret Manager
    url: https://docs.cloud.google.com/secret-manager/docs/secret-rotation
