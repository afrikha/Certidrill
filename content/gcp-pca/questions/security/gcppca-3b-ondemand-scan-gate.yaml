id: gcppca-3b-ondemand-scan-gate
objective: "3.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: "A logistics company builds container images with Cloud Build. Its policy states that an image with a CRITICAL vulnerability must never reach Artifact Registry, and developers must get the feedback in the failed build. The company wants a Google-managed scanner.\n\nWhat should you do?"
body:
  options:
    - { id: a, text: { en: "Add build steps that scan the locally built image with On-Demand Scanning and fail the build on any CRITICAL vulnerability, before the push step." } }
    - { id: b, text: { en: "Enable automatic scanning in Artifact Analysis, and create an alert that notifies developers when a pushed image has a CRITICAL vulnerability." } }
    - { id: c, text: { en: "Create a Binary Authorization continuous validation policy with a vulnerability check that reports Pods whose images have CRITICAL vulnerabilities." } }
    - { id: d, text: { en: "Enable Container Threat Detection in Security Command Center so that containers started from vulnerable images are reported as findings." } }
answer: { optionId: a }
explanation:
  correct:
    en: "On-Demand Scanning scans an image stored locally, without pushing it first, and Google documents its use in a Cloud Build pipeline to block and fail builds based on the severity of the vulnerabilities found. Placing the scan before the push step keeps vulnerable images out of Artifact Registry."
  options:
    b:
      en: "Automatic scanning is triggered when an image is pushed, so the vulnerable image has already reached Artifact Registry when developers are notified."
    c:
      en: "Continuous validation monitors images of running Pods after deployment, and its check-based platform policies are in Preview; it does not stop the push."
    d:
      en: "Container Threat Detection detects attacks in running containers; it does not scan images during the build."
references:
  - title: "Container scanning overview"
    url: https://docs.cloud.google.com/artifact-analysis/docs/container-scanning-overview
  - title: "Artifact Analysis overview"
    url: https://docs.cloud.google.com/artifact-analysis/docs/artifact-analysis
