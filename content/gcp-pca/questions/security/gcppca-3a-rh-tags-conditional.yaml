id: gcppca-3a-rh-tags-conditional
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank must enforce Public Access Prevention on Cloud Storage only in the projects that handle cardholder data. These projects are spread across several folders owned by different business units, and the bank does not allow the folder structure to be reorganized. Other projects must not be affected.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Add the label pci=true to those projects, and set the policy at the organization with a condition on that label." } }
    - { id: b, text: { en: "Move those projects into a new folder named pci, and enforce the constraint on that folder only." } }
    - { id: c, text: { en: "Enforce the constraint on each business unit folder, and let the owners of other projects override it." } }
    - { id: d, text: { en: "Attach the tag pci=true to those projects, and set the policy at the organization with a condition on that tag." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Tags let you enforce an organization policy conditionally, depending on whether a resource has a specific tag. Setting the storage.publicAccessPrevention policy once at the organization with a condition on the pci tag covers exactly the cardholder-data projects, wherever they are in the hierarchy."
  options:
    a:
      en: "Labels are key-value metadata for filtering and cost reporting; organization policy conditions use tags, not labels."
    b:
      en: "Moving the projects reorganizes the folder structure, which the bank does not allow."
    c:
      en: "This affects every project of the business units and depends on owners overriding the policy, which also requires organization policy administrator rights."
references:
  - title: Organization Policy overview
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/overview
