id: gcppca-3b-google-access-logs-locations
objective: "3.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: "A Swiss bank must meet banking secrecy rules. It must keep a record of every action that Google personnel take on its customer data, including the reason and the accessor's location, and send it to its SIEM. It must also prevent its engineers from creating new resources outside the Zurich region (europe-west6). It does not need to approve Google access in advance.\n\nWhich two actions should you take? Choose two."
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable Data Access audit logs for all services, and route them to the SIEM with an aggregated sink." } }
    - { id: b, text: { en: "Route Access Transparency logs to the SIEM with an aggregated sink at the organization." } }
    - { id: c, text: { en: "Enable Access Approval on the organization, and forward approval requests to the SIEM through Pub/Sub." } }
    - { id: d, text: { en: "Set the gcp.resourceLocations constraint at the organization node to the in:europe-west6-locations value group." } }
    - { id: e, text: { en: "Create a VPC Service Controls perimeter with an access level that allows only Swiss IP address ranges." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Access Transparency logs record the actions that Google personnel take on customer data, with the reason, the time and details about the accessor such as location, and they can be ingested into a SIEM. The resource locations constraint set at the organization node with the Zurich value group stops new resources from being created elsewhere."
  options:
    a:
      en: "Data Access audit logs record actions by members of the bank's organization, not by Google personnel."
    c:
      en: "Access Approval adds prior approval, which the bank does not need, and approval requests are not a record of the actions that personnel took."
    e:
      en: "Access levels filter where requests come from; they do not control the region in which resources are created."
references:
  - title: "Overview of Access Transparency"
    url: https://docs.cloud.google.com/assured-workloads/access-transparency/docs/overview
  - title: "Restrict resource locations"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/defining-locations
