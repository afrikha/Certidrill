id: gcppca-3a-cmek-hsm
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A payment processor must protect the CMEK keys of its Cloud SQL instances in FIPS 140-2 Level 3 validated hardware security modules. It wants Google to operate the hardware and to keep the operational overhead as low as possible.

    Which protection level should you choose when you create the Cloud KMS keys?
body:
  options:
    - { id: a, text: "SOFTWARE" }
    - { id: b, text: "EXTERNAL" }
    - { id: c, text: "HSM" }
    - { id: d, text: "EXTERNAL_VPC" }
answer: { optionId: c }
explanation:
  correct:
    en: "Keys with the HSM protection level are stored in, and used by, Google-owned FIPS 140-2 Level 3 validated hardware security modules. Cloud HSM is a managed service, so the processor does not operate any hardware."
  options:
    a:
      en: "Software keys use FIPS 140-3 Level 1 validated cryptographic primitives, not Level 3 HSMs."
    b:
      en: "External keys live in a key manager that the customer or a partner operates, which adds operational overhead."
    d:
      en: "External keys reached over a VPC network also require operating an external key manager."
references:
  - title: Protection levels
    url: https://docs.cloud.google.com/kms/docs/protection-levels
