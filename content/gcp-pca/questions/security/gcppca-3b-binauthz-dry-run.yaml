id: gcppca-3b-binauthz-dry-run
objective: "3.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: "A retail company has enabled Binary Authorization on its GKE clusters with a permissive policy. The security team has written a stricter rule that requires attestations for every image. Before blocking anything, the team wants to see which deployments would violate the new rule, while all deployments continue to succeed.\n\nHow should you configure the new rule?"
body:
  options:
    - { id: a, text: { en: "Set evaluationMode to ALWAYS_ALLOW in the default admission rule, and review the deployment history in Artifact Registry." } }
    - { id: b, text: { en: "Set enforcementMode to DRYRUN_AUDIT_LOG_ONLY in the rule, and review the violations recorded in Cloud Audit Logs." } }
    - { id: c, text: { en: "Add the production registry path ending in ** to admissionWhitelistPatterns, and review the exempted images in the console." } }
    - { id: d, text: { en: "Set globalPolicyEvaluationMode to DISABLE, and review the Google-maintained system images that the policy now evaluates." } }
answer: { optionId: b }
explanation:
  correct:
    en: "With enforcementMode set to DRYRUN_AUDIT_LOG_ONLY, Binary Authorization evaluates the rule but lets non-conforming Pods deploy, and it logs each violation to Cloud Audit Logs. After reviewing the impact, the team switches the rule to ENFORCED_BLOCK_AND_AUDIT_LOG."
  options:
    a:
      en: "ALWAYS_ALLOW admits every image without checking attestations, so no violation of the stricter rule is ever reported."
    c:
      en: "Exempt images bypass policy evaluation entirely, so their violations would never be detected."
    d:
      en: "This setting only stops exempting Google-maintained system images; it does not make violations non-blocking and can break system workloads."
references:
  - title: "Policy YAML reference"
    url: https://docs.cloud.google.com/binary-authorization/docs/policy-yaml-reference
