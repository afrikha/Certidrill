id: gcppca-3a-sc-vpcsc-partner-ingress
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The analytics projects of a retailer are protected by a VPC Service Controls perimeter. A marketing agency runs a daily job in its own project, in another organization, that must write files to a Cloud Storage bucket in the perimeter project mkt-landing by using the agency's service account. No other access from outside the perimeter is allowed.

    What should you configure?
body:
  options:
    - { id: a, text: { en: "An ingress rule that allows the agency service account, from the agency project as a source, to use Cloud Storage in mkt-landing" } }
    - { id: b, text: { en: "A perimeter bridge between the retailer's perimeter and the agency project so that both sides can exchange data" } }
    - { id: c, text: { en: "An egress rule that allows any identity inside the perimeter to use Cloud Storage in the agency project" } }
    - { id: d, text: { en: "An ingress rule that allows ANY_IDENTITY from any access level to use all services in all perimeter projects" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Ingress rules allow clients outside the perimeter to reach resources inside it. The from block names the agency service account and the agency project as source, and the to block limits the operations to Cloud Storage and the resources to mkt-landing, so nothing else is opened."
  options:
    b:
      en: "Perimeter bridges are bidirectional and cannot be scoped to one identity, service, or project resource; Google recommends ingress and egress rules instead."
    c:
      en: "Egress rules govern requests from inside the perimeter to outside resources; the agency's job writes from outside to inside."
    d:
      en: "ANY_IDENTITY from any source to all services opens the perimeter to everyone, including unauthenticated requests."
references:
  - title: Ingress and egress rules
    url: https://docs.cloud.google.com/vpc-service-controls/docs/ingress-egress-rules
