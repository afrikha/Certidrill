id: gcppca-cs6a-external-groups
objective: "3.1.5"
type: single
caseStudy: gcppca-cs6a-brindlewood-hr
difficulty: 3
status: draft
stem:
  en: |
    The platform team tries to grant the analysts' group of the first analytics add-on customer a role on the shared table in an analytics project. The IAM policy change is rejected because of an organization policy. You need to let the add-on customers be granted roles while meeting the technical requirements.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Remove the domain restricted sharing constraint from the organization, and review every IAM grant to principals of other organizations each month with Cloud Asset Inventory." } }
    - { id: b, text: { en: "Create a VPC Service Controls perimeter around the analytics projects, and add an ingress rule that allows the add-on customers' groups to access BigQuery in the perimeter." } }
    - { id: c, text: { en: "On the analytics projects, set a domain restricted sharing policy that replaces the inherited one and allows Brindlewood's customer ID and the customer ID of each add-on customer." } }
    - { id: d, text: { en: "Create a service account in the analytics project for each add-on customer, grant it the roles on the shared table, and send the customer a key for the service account." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Domain restricted sharing rejects IAM grants to principals outside the allowed customer IDs. An organization policy set on a project can override the policy inherited from the organization, so the analytics projects can allow the customer IDs of Brindlewood and of the add-on customers, whose groups then become valid principals there, while the rest of the organization keeps the restriction. This keeps access managed with IAM grants to the customers' own groups.
  options:
    a:
      en: Removing the constraint from the organization allows external principals in every project, which breaks the requirement that only Brindlewood principals can be granted roles outside the analytics projects.
    b:
      en: VPC Service Controls rules control access to services inside a perimeter; they do not lift the organization policy that rejects the IAM grant, and IAM access is still required.
    d:
      en: Service account keys are long-lived credentials that can leak, and analysts would share one identity instead of using their own group memberships; Google recommends avoiding keys when another option exists.
references:
  - title: Restrict identities with domain-restricted sharing
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/restricting-domains
