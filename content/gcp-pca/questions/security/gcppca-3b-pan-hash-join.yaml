id: gcppca-3b-pan-hash-join
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: "An online retailer loads payment transactions into BigQuery for fraud analytics with a Dataflow pipeline. Analysts must be able to count and join transactions by card, but primary account numbers (PANs) must never be stored in the analytics environment, and no one in analytics may ever be able to recover a PAN.\n\nWhat should you do?"
body:
  options:
    - { id: a, text: { en: "Load the PANs into BigQuery, and apply a dynamic data masking policy with the Hash (SHA-256) rule to the PAN column for analysts." } }
    - { id: b, text: { en: "In the pipeline, tokenize each PAN with Sensitive Data Protection format-preserving encryption and a Cloud KMS-wrapped key before loading." } }
    - { id: c, text: { en: "In the pipeline, replace each PAN with Sensitive Data Protection cryptographic hashing and a Cloud KMS-wrapped key before loading." } }
    - { id: d, text: { en: "In the pipeline, use Sensitive Data Protection character masking to replace all but the last four digits of each PAN before loading." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Cryptographic hashing (HMAC-SHA-256) replaces each PAN with a consistent token, so transactions of the same card can still be counted and joined, and the transformation is one-way, so a PAN cannot be recovered. Applying it in the pipeline means that PANs never reach BigQuery."
  options:
    a:
      en: "Masking applies when users query the column: the raw PANs are still stored in BigQuery, which the requirement forbids."
    b:
      en: "Format-preserving encryption is reversible with the key, so a PAN could be recovered."
    d:
      en: "The last four digits are not unique to a card, so counts and joins by card would be wrong."
references:
  - title: "Pseudonymization"
    url: https://docs.cloud.google.com/sensitive-data-protection/docs/pseudonymization
  - title: "Transformation reference"
    url: https://docs.cloud.google.com/sensitive-data-protection/docs/transformations-reference
