id: gcppca-3b-private-model-endpoint
objective: "3.1.9"
type: multi
difficulty: 3
status: draft
stem:
  en: "A bank deploys an open model from Model Garden to an endpoint in project ml-serving, which is inside a VPC Service Controls perimeter. Applications in two other projects and an on-premises system connected through Cloud Interconnect must call the endpoint. The endpoint must not be exposed to the public internet, and the model and endpoint must be protected at rest with keys that the bank manages in Cloud KMS.\n\nWhich two actions should you take? Choose two."
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deploy the model with a one-click deployment to a dedicated public endpoint, and allow only the bank's principals through IAM." } }
    - { id: b, text: { en: "Deploy the model to a dedicated private endpoint based on Private Service Connect, and add the consumer projects to its allowlist." } }
    - { id: c, text: { en: "Create the Cloud KMS key in a global key ring so that the same key can protect endpoints in any region that the bank adds later." } }
    - { id: d, text: { en: "Publish the endpoint through an external Application Load Balancer with a Cloud Armor policy that allows only on-premises ranges." } }
    - { id: e, text: { en: "Create the Cloud KMS key in the endpoint's region, and grant the Agent Platform service agent the CryptoKey Encrypter/Decrypter role." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "A dedicated private endpoint based on Private Service Connect serves inference on an internal IP address to the projects in its project allowlist, and on-premises clients reach it through a hybrid connection into a consumer VPC, so traffic never crosses the public internet. For CMEK, the key must be in the same region as the resource, and the Agent Platform service agent needs the Cloud KMS CryptoKey Encrypter/Decrypter role on the key."
  options:
    a:
      en: "Model Garden one-click deployments to a dedicated public endpoint are not supported with VPC Service Controls, and a public endpoint fails the no-internet requirement."
    c:
      en: "Agent Platform expects the key and the resource in the same region; global, dual-region and multi-region key ring locations are not to be used."
    d:
      en: "An external load balancer exposes the model on the public internet, even if Cloud Armor filters the source addresses."
references:
  - title: "Use dedicated private endpoints based on Private Service Connect for online inference"
    url: https://docs.cloud.google.com/vertex-ai/docs/predictions/private-service-connect
  - title: "CMEK"
    url: https://docs.cloud.google.com/vertex-ai/docs/general/cmek
