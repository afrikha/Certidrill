id: gcppca-3b-services-in-scope
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: "A company's cardholder data environment on Google Cloud has passed its PCI DSS assessment. A team now wants to use another Google Cloud product to process cardholder data in that environment.\n\nWhat should the company do first?"
body:
  options:
    - { id: a, text: { en: "Use the product, because Google Cloud's PCI DSS assessment covers every Google Cloud product automatically." } }
    - { id: b, text: { en: "Check that the product is listed as in scope for PCI DSS on Google Cloud's services in scope page." } }
    - { id: c, text: { en: "Use the product with CMEK, because data encrypted with customer-managed keys is outside PCI DSS scope." } }
    - { id: d, text: { en: "Ask the team to enable the product's Preview features, because Preview releases are assessed first." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Google publishes, for each compliance program such as ISO 27001, SOC 1/2/3 and PCI DSS, the list of Google Cloud services in scope; some services are not marked for PCI DSS. A product that is not in scope should not process cardholder data in the assessed environment."
  options:
    a:
      en: "Scope is published per service and per compliance program, and some services are not in scope for PCI DSS."
    c:
      en: "Encryption does not take cardholder data out of scope, and it does not make an unassessed service compliant."
    d:
      en: "Preview features are not covered by compliance commitments, and they should never be used to meet a compliance requirement."
references:
  - title: "Google Cloud Platform Services in Scope by Compliance Program"
    url: https://cloud.google.com/security/compliance/services-in-scope
