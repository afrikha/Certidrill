id: gcppca-cs1b-claims-exfiltration
objective: "3.1.5"
type: single
caseStudy: gcppca-cs1b-halden-mutual
difficulty: 2
status: draft
stem:
  en: |
    The fraud analysts have the IAM roles they need on claims-data-prod. You need to add a control that meets the business requirement about copying claims data and the technical requirement about the corporate network.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Set the iam.allowedPolicyMemberDomains organization policy constraint so that only identities of Halden Mutual's domain can be granted roles on claims-data-prod." } }
    - { id: b, text: { en: "Create a VPC Service Controls service perimeter around claims-data-prod that restricts the BigQuery and Cloud Storage APIs, with an access level for the corporate network's IP ranges." } }
    - { id: c, text: { en: "Create VPC firewall rules that deny egress from claims-data-prod to the internet, and enable Private Google Access on its subnets." } }
    - { id: d, text: { en: "Replace the analysts' predefined roles with a custom role that excludes the permissions to export BigQuery tables and to create Cloud Storage buckets." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      VPC Service Controls blocks API calls that cross a service perimeter, so data in the protected BigQuery and Cloud Storage services cannot be copied to a project outside the perimeter, even by a user whose credentials and IAM roles are valid. An access level from Access Context Manager lets requests from the corporate IP ranges reach the protected services, and requests from any other network are denied.
  options:
    a:
      en: Domain restricted sharing limits who can be granted roles, but an employee could still copy data to another project in which the same employee has access, and it does not check the source network.
    c:
      en: Firewall rules control traffic of VM interfaces in the VPC network; they do not control calls to the Google APIs made from anywhere with valid credentials.
    d:
      en: A query that writes its results to a table in another project needs only read permissions on the claims data, so the data can still leave; IAM roles control neither the destination project nor the source network.
references:
  - title: Overview of VPC Service Controls
    url: https://docs.cloud.google.com/vpc-service-controls/docs/overview
