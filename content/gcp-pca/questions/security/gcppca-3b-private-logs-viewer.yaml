id: gcppca-3b-private-logs-viewer
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: "An external auditor must review all audit logs of a project in the Google Cloud console, including Data Access audit logs. The auditor must not be able to change any logging configuration or any other resource.\n\nWhich IAM role should you grant, following the principle of least privilege?"
body:
  options:
    - { id: a, text: { en: "Private Logs Viewer (roles/logging.privateLogViewer)" } }
    - { id: b, text: { en: "Logs Viewer (roles/logging.viewer)" } }
    - { id: c, text: { en: "Logging Admin (roles/logging.admin)" } }
    - { id: d, text: { en: "Reader (roles/reader)" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Private Logs Viewer gives read access to all logs in the _Required and _Default buckets, including Data Access audit logs, and it includes the Logs Viewer permissions. It grants no permission to change logging configuration."
  options:
    b:
      en: "Logs Viewer can read Admin Activity, System Event and Policy Denied audit logs, but not the Data Access audit logs in _Default."
    c:
      en: "Logging Admin can change sinks, buckets and exclusions, which exceeds read-only access."
    d:
      en: "The basic Reader role grants read access to most resources in the project, far beyond the logs the auditor needs."
references:
  - title: "Cloud Audit Logs overview"
    url: https://docs.cloud.google.com/logging/docs/audit
