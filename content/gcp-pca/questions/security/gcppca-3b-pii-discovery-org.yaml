id: gcppca-3b-pii-discovery-org
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: "After several acquisitions, a company's organization contains hundreds of projects with BigQuery datasets, Cloud SQL instances and Cloud Storage buckets. The privacy team needs to know, on an ongoing basis, which of these resources contain PII such as email addresses and national ID numbers and how sensitive each one is, and to see the results with other findings in Security Command Center.\n\nWhat should you do?"
body:
  options:
    - { id: a, text: { en: "Configure the Sensitive Data Protection discovery service at the organization level, and publish data profiles to Security Command Center." } }
    - { id: b, text: { en: "Create a Sensitive Data Protection inspection job for each table and bucket, and schedule every job to run once a month." } }
    - { id: c, text: { en: "Export Cloud Asset Inventory to BigQuery, and search the resource metadata for column and bucket names that suggest PII." } }
    - { id: d, text: { en: "Configure Model Armor floor settings at the organization node with the Sensitive Data Protection filter in advanced mode." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The discovery service is configured once at the organization, folder or project level and profiles BigQuery, Cloud SQL and Cloud Storage data, recording the infoTypes found and the sensitivity and risk levels. New data is profiled shortly after it is added, and profiles can be published to Security Command Center."
  options:
    b:
      en: "Per-resource jobs mean creating and maintaining hundreds of jobs, and new resources are missed."
    c:
      en: "Names in metadata do not reveal what the data actually contains."
    d:
      en: "Model Armor screens AI prompts and responses; it does not scan stored data."
references:
  - title: "Overview of sensitive data discovery"
    url: https://docs.cloud.google.com/sensitive-data-protection/docs/data-profiles
