id: gcppca-cs1b-eu-locations
objective: "3.2.1"
type: single
caseStudy: gcppca-cs1b-halden-mutual
difficulty: 2
status: draft
stem:
  en: |
    All the existing resources of the organization are in European Union regions. You need to ensure that new resources meet the regulator's location requirement. The solution must meet the business requirements.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Set the gcp.resourceLocations organization policy constraint on the Insurance-Prod and Insurance-NonProd folders with the allowed value in:eu-locations." } }
    - { id: b, text: { en: "Set the gcp.resourceLocations organization policy constraint on the organization node with the allowed value in:europe-locations." } }
    - { id: c, text: { en: "Create a VPC Service Controls perimeter that contains every project of the organization, with an access level that allows only European Union IP ranges." } }
    - { id: d, text: { en: "Set the gcp.resourceLocations organization policy constraint on the organization node with the allowed value in:eu-locations." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The resource locations constraint restricts where supported resources can be created, and a policy set on the organization node is inherited by every folder and project below it, including sandbox projects created later directly under the organization. The value group in:eu-locations contains only European Union locations, and Google maintains the group, so no policy has to be updated when new EU regions open.
  options:
    a:
      en: Sandbox projects created directly under the organization node are outside both folders, so they would not inherit the constraint.
    b:
      en: The in:europe-locations group also contains regions outside the European Union, such as London and Zurich.
    c:
      en: A service perimeter controls access to Google APIs across its boundary; it does not restrict the region in which resources are created.
references:
  - title: Restrict resource locations
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/defining-locations
