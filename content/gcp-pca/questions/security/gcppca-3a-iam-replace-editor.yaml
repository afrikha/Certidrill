id: gcppca-3a-iam-replace-editor
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A fintech company granted the legacy Editor basic role to its 40 developers on each production project three years ago. An internal audit now requires least privilege in production. The platform team does not know which permissions each developer group actually uses, and it must not break the deployments that the developers run today.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a custom role that contains every Editor permission except the IAM permissions, and grant it to the developer groups instead of Editor." } }
    - { id: b, text: { en: "Replace the Editor grants with the Reader basic role, and let developers request the Admin basic role from the platform team when they deploy." } }
    - { id: c, text: { en: "Review the IAM role recommendations for the Editor bindings, check them with Policy Simulator, and replace Editor with the suggested roles." } }
    - { id: d, text: { en: "Keep the Editor grants, and add an IAM deny policy that denies every permission that the developers did not use in the last 30 days." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Google recommends not granting basic roles in production. Role recommendations from the IAM recommender analyze up to 90 days of permission usage and suggest narrower predefined roles, and Policy Simulator shows whether a change would remove access that principals still use. This reaches least privilege without guessing and without breaking current deployments."
  options:
    a:
      en: "Editor without the IAM permissions is still a very broad set of permissions across almost every service, so it does not meet least privilege, and the custom role must be maintained by hand."
    b:
      en: "Reader is still a basic role, and handing out Admin for deployments grants even more access than Editor, so least privilege gets worse."
    d:
      en: "Deny policies are not generated from usage data and only some permissions can be denied; building and maintaining such a list by hand is error-prone, and the broad Editor grants remain."
references:
  - title: Overview of role recommendations
    url: https://docs.cloud.google.com/policy-intelligence/docs/role-recommendations-overview
  - title: Use IAM securely
    url: https://docs.cloud.google.com/iam/docs/using-iam-securely
