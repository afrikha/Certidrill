id: gcppca-cs2c-partner-access
objective: "3.1.7"
type: multi
caseStudy: gcppca-cs2c-quillon
difficulty: 2
status: draft
stem:
  en: |
    You are designing access to AssayHub after its move to Google Cloud. The design must meet the business requirement about collaborator access and the technical requirement for AssayHub.

    Which two actions should you take? (Choose two.)
body:
  options:
    - id: a
      text: { en: "Put the managed instance group behind an external Application Load Balancer, and enable Identity-Aware Proxy on its backend service." }
    - id: b
      text: { en: "Create an HA VPN gateway and a tunnel to the network of each university, and allow HTTPS from the tunnels to the AssayHub virtual machines." }
    - id: c
      text: { en: "Grant the IAP-secured Web App User role on the AssayHub backend service to a group that contains the collaborators' Google Accounts." }
    - id: d
      text: { en: "Give the AssayHub virtual machines external IP addresses, and create firewall rules that allow HTTPS only from the public IP ranges of the universities." }
    - id: e
      text: { en: "Create a service account for each university laboratory, and give each laboratory a key for it to authenticate to AssayHub." }
  choose: 2
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: "Identity-Aware Proxy on the load balancer's backend service authenticates every request and checks the user's IAM role before forwarding it, so collaborators reach AssayHub over HTTPS without a VPN. Granting the IAP-secured Web App User role to a group of the collaborators' own Google Accounts gives each person an individual identity, and removing one account from the group revokes that person's access."
  options:
    b: { en: "Site-to-site VPN tunnels are the VPN access the business wants to remove, and they authorize whole networks rather than individual people." }
    d: { en: "An IP allowlist authorizes every user of a university network and identifies no individual collaborator, so one person's access cannot be revoked." }
    e: { en: "A key per laboratory is a shared, long-lived credential, which is the shared account problem in another form." }
references:
  - title: Identity-Aware Proxy overview
    url: https://docs.cloud.google.com/iap/docs/concepts-overview
