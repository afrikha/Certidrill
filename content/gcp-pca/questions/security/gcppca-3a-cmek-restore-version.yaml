id: gcppca-3a-cmek-restore-version
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Yesterday, an administrator scheduled the primary version of the CMEK used by a Cloud SQL instance for destruction by mistake. The key uses the default scheduled destruction duration. The application team needs the instance data to remain accessible.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Enable the key version, because a version scheduled for destruction only needs to be enabled to be used again." } }
    - { id: b, text: { en: "Restore the key version and then enable it, because a restored version returns in the disabled state." } }
    - { id: c, text: { en: "Import the original key material into a new key version, because Cloud KMS destroys key material immediately." } }
    - { id: d, text: { en: "Create a new key version and make it primary, because the data is re-encrypted with the new version automatically." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Destruction is not immediate: by default, a key version stays scheduled for destruction for 30 days and can be restored during that time. A restored version is disabled, so it must also be enabled before the service can use it again."
  options:
    a:
      en: "A version scheduled for destruction must be restored first; enabling applies to disabled versions."
    c:
      en: "The key material still exists during the 30-day scheduled period, and Google-generated key material cannot be imported back."
    d:
      en: "A new primary version is used only for new encryption operations; existing data still needs the version scheduled for destruction."
references:
  - title: Destroy and restore key versions
    url: https://docs.cloud.google.com/kms/docs/destroy-restore
