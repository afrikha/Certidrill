id: gcppca-3b-data-access-org-exempt
objective: "3.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: "A healthcare company must record every read and write of patient files in Cloud Storage, in all current and future projects of its organization. A backup service account reads millions of objects every night; these reads are out of scope of the audit requirement, and the company does not want to pay for logging them.\n\nWhich two actions should you take? Choose two."
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable Data Access audit logs for Cloud Storage in each project when the project is created." } }
    - { id: b, text: { en: "Enable the DATA_READ and DATA_WRITE Data Access audit log types for Cloud Storage in the organization's audit configuration." } }
    - { id: c, text: { en: "Add an exclusion filter for the backup service account to the _Required sink of each project." } }
    - { id: d, text: { en: "Disable the Admin Activity audit logs of the backup service account to offset the cost of its reads." } }
    - { id: e, text: { en: "Add the backup service account as an exempted principal in the Data Access audit log configuration." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Data Access audit log configuration set in the organization's IAM policy is inherited by every current and future project, so one configuration covers the requirement. Listing the backup service account as an exempted principal stops Data Access logs from being generated for its calls, which avoids their cost."
  options:
    a:
      en: "Per-project configuration multiplies the work and can be missed for new projects, while the organization-level setting is inherited."
    c:
      en: "The _Required sink cannot be modified, and Data Access audit logs are stored in _Default, not _Required."
    d:
      en: "Admin Activity audit logs cannot be disabled."
references:
  - title: "Cloud Audit Logs overview"
    url: https://docs.cloud.google.com/logging/docs/audit
