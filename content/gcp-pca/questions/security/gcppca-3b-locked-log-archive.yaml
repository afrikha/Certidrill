id: gcppca-3b-locked-log-archive
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: "A broker-dealer must archive the audit logs of its organization for five years in write-once form: no one, including organization administrators and project owners, may delete the archived logs or shorten their retention before five years. The logs are rarely read, so cost must be minimized.\n\nWhat should you do?"
body:
  options:
    - { id: a, text: { en: "Route the logs with an aggregated sink to a log bucket with 1,825-day retention, and grant write access only to the sink's writer identity." } }
    - { id: b, text: { en: "Route the logs with an aggregated sink to a BigQuery dataset with a default table expiration of 1,825 days." } }
    - { id: c, text: { en: "Route the logs with an aggregated sink to a Cloud Storage bucket with a five-year retention policy, and limit Storage Admin to the security team." } }
    - { id: d, text: { en: "Route the logs with an aggregated sink to a Cloud Storage bucket with a five-year retention policy, and lock the retention policy." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Locking a retention policy with Bucket Lock is irreversible: the policy cannot be removed or shortened, objects cannot be deleted or replaced before they reach the retention age, and the bucket cannot be deleted while objects are retained. Cloud Storage with a cold storage class keeps rarely read archives at low cost."
  options:
    a:
      en: "An unlocked log bucket's retention can be changed and the bucket deleted by an administrator, and IAM grants can be changed by organization administrators."
    b:
      en: "Table expiration deletes data after five years but does not stop anyone from deleting it earlier."
    c:
      en: "An unlocked retention policy can be removed or shortened by a principal with enough permissions, and organization administrators can change IAM grants."
references:
  - title: "Bucket Lock"
    url: https://docs.cloud.google.com/storage/docs/bucket-lock
  - title: "Configure log buckets"
    url: https://docs.cloud.google.com/logging/docs/buckets
