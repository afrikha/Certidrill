id: gcppca-cs6b-advertiser-overlap
objective: "3.2.2"
type: single
caseStudy: gcppca-cs6b-harbourline-news
difficulty: 2
status: draft
stem:
  en: |
    You are designing the advertiser measurement service. The design must meet the business requirement for advertiser measurement and the concerns of Harbourline's data protection officer.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Export the hashed email addresses of the subscribers who saw each campaign to a Cloud Storage bucket that the advertiser can read, so that it matches them with its own hashed customer list." } }
    - { id: b, text: { en: "Ask each advertiser to load its hashed customer list into a Harbourline dataset, and have Harbourline analysts join it with the audience data and send the resulting counts to the advertiser." } }
    - { id: c, text: { en: "Create a data clean room in BigQuery sharing with an audience view protected by an aggregation threshold analysis rule, and let advertisers subscribe and join it with their own data in their projects." } }
    - { id: d, text: { en: "Create an authorized view that joins the subscriber data with the campaign exposure data, and grant the group of each advertiser the BigQuery Data Viewer role on the view." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A data clean room lets several parties join and analyze data without moving or revealing the underlying records. Harbourline contributes a view with an aggregation threshold analysis rule, so subscribers of the clean room can only run aggregation queries that return groups above the threshold, and egress controls stop them from copying the data. Each advertiser joins the view with its own customer table in its own project, so Harbourline never sees the advertiser's list, and the advertiser pays for the queries it runs.
  options:
    a:
      en: Hashed email addresses are still individual records that the advertiser can match one by one, which is exactly what the data protection officer refuses.
    b:
      en: Harbourline would receive the advertiser's individual customer records, which the advertisers refuse, and Harbourline would pay for the analysis.
    d:
      en: An authorized view exposes the rows it returns, so advertisers would read individual subscriber records joined with their exposure data.
references:
  - title: Share sensitive data with data clean rooms
    url: https://docs.cloud.google.com/bigquery/docs/data-clean-rooms
