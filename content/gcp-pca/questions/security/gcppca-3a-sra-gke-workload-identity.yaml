id: gcppca-3a-sra-gke-workload-identity
objective: "3.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Pods in the namespace invoices of a GKE Standard cluster must read objects from one Cloud Storage bucket. Today the nodes run as the Compute Engine default service account with broad permissions, so every pod on a node shares the same access. You need per-workload access without any service account key and with the least operational overhead.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a service account key, store it as a Kubernetes Secret in the namespace invoices, and mount it in the pods." } }
    - { id: b, text: { en: "Grant the node service account Storage Object Viewer on the bucket, and remove all of its other roles in the project." } }
    - { id: c, text: { en: "Enable Workload Identity Federation for GKE, and grant Storage Object Viewer on the bucket to the principal of the pods' Kubernetes ServiceAccount." } }
    - { id: d, text: { en: "Create a new workload identity pool with an OIDC provider for the cluster, and grant Storage Object Viewer on the bucket to all its identities." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Workload Identity Federation for GKE lets IAM policies name a Kubernetes ServiceAccount directly as a principal; the GKE metadata server exchanges the pod's token for a short-lived federated access token. Only pods that use that Kubernetes ServiceAccount get access to the bucket, and no key exists."
  options:
    a:
      en: "Exported keys stored as Kubernetes Secrets are a security risk that Workload Identity Federation for GKE replaces."
    b:
      en: "The node service account is shared by all workloads on the node, so access would still not be per workload."
    d:
      en: "A separate pool adds configuration that GKE already provides, and granting access to all identities in the pool is not per workload."
references:
  - title: About Workload Identity Federation for GKE
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
