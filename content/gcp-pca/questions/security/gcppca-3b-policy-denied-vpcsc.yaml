id: gcppca-3b-policy-denied-vpcsc
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: "After a VPC Service Controls perimeter was enforced around a data project, several batch jobs started failing. The security team wants to find which requests the perimeter blocked, with the caller identity and the service, without enabling any additional logging.\n\nWhich logs should the team query?"
body:
  options:
    - { id: a, text: { en: "Data Access audit logs in the _Default log bucket of the data project" } }
    - { id: b, text: { en: "Admin Activity audit logs in the _Required log bucket of the data project" } }
    - { id: c, text: { en: "Policy Denied audit logs in the _Default log bucket of the data project" } }
    - { id: d, text: { en: "Firewall Rules Logging entries for the subnets of the batch jobs" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Policy Denied audit logs record access that a Google Cloud service denies because of a security policy violation, such as a VPC Service Controls perimeter. They are generated by default and cannot be disabled (only excluded), and they are stored in the _Default bucket."
  options:
    a:
      en: "Data Access logs are disabled by default for most services and are not where security policy denials are recorded."
    b:
      en: "Admin Activity logs record configuration changes; they are not where perimeter violations are recorded."
    d:
      en: "Firewall Rules Logging covers VPC network traffic, while VPC Service Controls denies Google API requests."
references:
  - title: "Cloud Audit Logs overview"
    url: https://docs.cloud.google.com/logging/docs/audit
