id: gcppca-3b-virtual-repo-dependency-confusion
objective: "3.1.8"
type: multi
difficulty: 3
status: draft
stem:
  en: "A media company's build pipelines download Python packages directly from PyPI. The company also publishes internal Python packages, and a security review warns that an attacker could publish a public package with the same name as an internal one (dependency confusion). The company also wants builds to keep working with previously used package versions if PyPI is unavailable. Developers must configure a single package index URL.\n\nWhich two actions should you take? Choose two."
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an Artifact Registry remote repository that uses PyPI as its upstream source." } }
    - { id: b, text: { en: "Create a VPC Service Controls perimeter around Artifact Registry so that builds cannot reach upstream sources." } }
    - { id: c, text: { en: "Enable Artifact Analysis scanning so that Python packages with known vulnerabilities are flagged." } }
    - { id: d, text: { en: "Create a virtual repository that ranks the internal standard repository above the remote one, and point pip at it." } }
    - { id: e, text: { en: "Run the builds in a Cloud Build private pool with public IP addresses disabled for the workers." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A remote repository proxies PyPI and caches each package version on first download, so cached versions remain available if PyPI goes offline. A virtual repository gives developers one index URL over several upstream repositories; ranking the internal repository above the remote one makes internal package names win, which mitigates dependency confusion."
  options:
    b:
      en: "Inside a perimeter, Artifact Registry blocks upstream sources by default, which breaks public dependencies; a perimeter does not decide which repository wins when names collide."
    c:
      en: "Scanning flags known vulnerabilities; a malicious package published under an internal name has no known CVE and would still be installed."
    e:
      en: "Workers without public IPs cannot reach PyPI directly, and this provides neither caching nor a single index URL that prefers internal packages."
references:
  - title: "Remote repositories overview"
    url: https://docs.cloud.google.com/artifact-registry/docs/repositories/remote-overview
