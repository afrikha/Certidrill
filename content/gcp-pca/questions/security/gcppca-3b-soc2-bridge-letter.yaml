id: gcppca-3b-soc2-bridge-letter
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: "A healthcare SaaS provider's auditor is reviewing Google Cloud's latest SOC 2 Type II report. Its coverage period ended several weeks before the end of the provider's own audit period, and the auditor wants documentation from Google that covers the weeks after the report's end date.\n\nWhat should the provider give the auditor?"
body:
  options:
    - { id: a, text: { en: "The Google Cloud SOC 3 report" } }
    - { id: b, text: { en: "The SOC 2 bridge letter for the period after the report's end date" } }
    - { id: c, text: { en: "An Access Transparency log export for the period after the report's end date" } }
    - { id: d, text: { en: "A CSV export of the SOC 2 standard from the Security Command Center compliance page" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Google creates bridge letters that cover the gap between a SOC report's end date and a later date. The core Google Cloud SOC 2 Type II reports are issued quarterly, so a bridge letter covers the weeks after the latest report until the next one is available."
  options:
    a:
      en: "A SOC 3 report is a separate summary-level report; it does not cover the gap after the SOC 2 report's end date."
    c:
      en: "Access Transparency records Google personnel access to the provider's data; it says nothing about the design or operation of Google's controls."
    d:
      en: "That export reflects findings on the provider's own resources and is not a formal audit of Google's controls."
references:
  - title: "SOC 2: compliance"
    url: https://cloud.google.com/security/compliance/soc-2
