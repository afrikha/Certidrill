id: gcppca-3a-sod-kms-admin
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a dedicated key project, the security operations team must create keys, set rotation schedules, and disable key versions or schedule them for destruction. The team must not be able to use the keys to encrypt or decrypt any application data.

    Which role should you grant to the team on the key project?
body:
  options:
    - { id: a, text: { en: "Admin" } }
    - { id: b, text: { en: "Cloud KMS CryptoKey Encrypter/Decrypter" } }
    - { id: c, text: { en: "Cloud KMS Admin" } }
    - { id: d, text: { en: "Cloud KMS Crypto Operator" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Cloud KMS Admin (roles/cloudkms.admin) provides access to manage Cloud KMS resources except cryptographic operations. Key managers get this role, while key users such as service agents get the CryptoKey Encrypter/Decrypter role, which separates management from use."
  options:
    a:
      en: "Admin is a basic role that also grants broad access to the project, including the management of roles and permissions; Google advises avoiding basic roles for Cloud KMS."
    b:
      en: "This role only performs encrypt and decrypt operations, exactly what the team must not do, and it cannot manage keys."
    d:
      en: "Crypto Operator allows all cryptographic operations, which the team must not perform."
references:
  - title: Permissions and roles
    url: https://docs.cloud.google.com/kms/docs/reference/permissions-and-roles
