id: gcppca-3a-sod-pam-jit
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    SRE engineers occasionally need the Compute Admin role in production projects to resolve incidents. The security team requires that nobody holds this role permanently, that each elevation includes a justification and is approved by a team lead, and that access is removed automatically after a few hours.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Grant Compute Admin to the SRE group with an IAM condition that limits access to the business hours of the team." } }
    - { id: b, text: { en: "Create a break-glass user account with Compute Admin, and store its password in Secret Manager for the SRE team." } }
    - { id: c, text: { en: "Grant the SRE group Service Account Token Creator on a service account that holds Compute Admin in production." } }
    - { id: d, text: { en: "Create a Privileged Access Manager entitlement for Compute Admin with a required justification, an approver, and a maximum duration." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Privileged Access Manager provides just-in-time, temporary privilege elevation. An entitlement defines who can request which roles, whether a justification is required, the approvers, and the maximum grant duration; PAM revokes the roles when the grant ends and logs the events in Cloud Audit Logs."
  options:
    a:
      en: "A time condition gives standing access every business day, with no justification or approval."
    b:
      en: "A shared account removes individual accountability and gives permanent access to anyone who can read the password."
    c:
      en: "Impersonation rights are standing access to Compute Admin, with no justification, approval, or automatic expiry."
references:
  - title: Privileged Access Manager overview
    url: https://docs.cloud.google.com/iam/docs/pam-overview
