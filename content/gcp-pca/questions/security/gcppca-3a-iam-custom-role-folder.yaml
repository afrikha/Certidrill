id: gcppca-3a-iam-custom-role-folder
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retailer groups its 25 analytics projects under a folder named analytics. The security team designed a custom role with a narrow set of BigQuery and Cloud Storage permissions. It wants to grant this role to groups on the analytics folder so that every project in the folder inherits the grant.

    Where should you create the custom role?
body:
  options:
    - { id: a, text: { en: "In the organization resource" } }
    - { id: b, text: { en: "In the analytics folder" } }
    - { id: c, text: { en: "In each of the 25 analytics projects" } }
    - { id: d, text: { en: "In a dedicated project that holds the shared IAM definitions" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Custom roles are created either in an organization or in a project, and they can be granted only within the organization or project where they were created. Custom roles cannot be defined at the folder level, so a role that must be granted on a folder has to be created in the organization."
  options:
    b:
      en: "Folders cannot hold custom roles: you cannot define a custom role at the folder level."
    c:
      en: "A project-level custom role can be granted only in its own project, so it cannot be granted on the folder, and 25 copies would have to be kept in sync."
    d:
      en: "A custom role created in one project cannot be granted in other projects or on a folder."
references:
  - title: Roles overview
    url: https://docs.cloud.google.com/iam/docs/roles-overview
