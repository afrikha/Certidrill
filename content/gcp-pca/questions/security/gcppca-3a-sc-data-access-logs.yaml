id: gcppca-3a-sc-data-access-logs
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A law firm must know which users read each object in a Cloud Storage bucket that holds contracts. In Cloud Logging, the security team sees entries for the bucket creation and for IAM policy changes, but no entries for object reads.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Enable Access Transparency for the organization." } }
    - { id: b, text: { en: "Enable Object Versioning on the bucket that holds the contracts." } }
    - { id: c, text: { en: "Create a log sink that routes the Admin Activity audit logs to BigQuery." } }
    - { id: d, text: { en: "Enable Data Access audit logs with the DATA_READ type for Cloud Storage." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Reads of user-provided data are recorded in Data Access audit logs, which are disabled by default for every service except BigQuery because of their volume. Enabling the DATA_READ type for Cloud Storage records who read each object; Admin Activity logs only record configuration changes."
  options:
    a:
      en: "Access Transparency logs the actions of Google personnel, not of the firm's own users."
    b:
      en: "Object Versioning keeps older versions of objects when they are overwritten or deleted; it does not record reads."
    c:
      en: "Admin Activity logs record configuration changes such as bucket creation; they do not contain object reads, so routing them adds nothing."
references:
  - title: Cloud Audit Logs overview
    url: https://docs.cloud.google.com/logging/docs/audit
