id: gcppca-3b-access-approval
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: "A financial regulator requires a bank to authorize explicitly, in advance, any access by the cloud provider's support and engineering staff to the bank's customer data on Google Cloud. The bank already reviews Access Transparency logs in its SIEM.\n\nWhat should you do?"
body:
  options:
    - { id: a, text: { en: "Enable Access Approval on the organization, and configure email or Pub/Sub notifications for the bank's approvers." } }
    - { id: b, text: { en: "Enable Data Access audit logs on all services, and alert the bank's approvers on every entry written by a Google identity." } }
    - { id: c, text: { en: "Create an IAM deny policy at the organization node that denies all permissions to Google support principals." } }
    - { id: d, text: { en: "Keep Access Transparency enabled, and open a support case asking Google to request permission before each access." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Access Approval requires Google Cloud Customer Care and engineering teams to obtain explicit approval before accessing customer data. Requests are signed, approvers are notified by email or Pub/Sub, they approve or dismiss requests in the console or API, and they can revoke approvals; the prerequisite, Access Transparency, is already in place."
  options:
    b:
      en: "Data Access audit logs record actions by members of the bank's organization, and any log is an after-the-fact record, not prior authorization."
    c:
      en: "An IAM deny policy is not the mechanism that governs Google personnel access, and it provides no request-and-approve workflow."
    d:
      en: "Access Transparency gives visibility after the access; prior approval is provided by a separate product, not by a support request."
references:
  - title: "Overview of Access Approval"
    url: https://docs.cloud.google.com/assured-workloads/access-approval/docs/overview
