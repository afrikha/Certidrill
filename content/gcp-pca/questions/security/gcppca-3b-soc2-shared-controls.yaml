id: gcppca-3b-soc2-shared-controls
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: "A fintech startup runs its entire platform on Google Cloud managed services and wants its first SOC 2 Type II report. The CTO proposes to present Google Cloud's SOC 2 report and the Security Command Center compliance page, which shows all SOC 2 checks passing, as proof that the platform is SOC 2 compliant.\n\nWhat should you advise?"
body:
  options:
    - { id: a, text: { en: "Rely on Google's SOC 2 report for the controls Google operates, and implement and evidence the startup's own controls, such as access reviews and change management." } }
    - { id: b, text: { en: "Accept the proposal, because Google's SOC 2 report covers every application that is built only on Google Cloud managed services." } }
    - { id: c, text: { en: "Accept the proposal, because a compliance page in Security Command Center with every SOC 2 check passing is a SOC 2 attestation." } }
    - { id: d, text: { en: "Move the platform into an Assured Workloads folder, because workloads in a folder automatically inherit Google's SOC 2 report." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Google's SOC 2 report covers the controls that Google operates and can be relied on for that part of the system, but the startup is audited on its own controls, such as access management, logging and change management, which its auditor must test. Security Command Center states that its compliance reporting is not a formal audit and that resolving findings does not guarantee certification."
  options:
    b:
      en: "Compliance is shared: Google's report does not test the startup's application, people or processes."
    c:
      en: "The compliance page is not a formal audit and does not replace the independent auditor's opinion."
    d:
      en: "Assured Workloads configures data boundaries and controls; it does not transfer an audit report to a workload."
references:
  - title: "SOC 2: compliance"
    url: https://cloud.google.com/security/compliance/soc-2
  - title: "Assess compliance without Compliance Manager"
    url: https://docs.cloud.google.com/security-command-center/docs/compliance-management
