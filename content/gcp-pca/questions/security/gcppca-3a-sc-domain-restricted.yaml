id: gcppca-3a-sc-domain-restricted
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A consulting company discovered that employees shared Cloud Storage buckets and BigQuery datasets with personal Gmail accounts by granting IAM roles to those accounts. The company wants to prevent any principal outside its Cloud Identity account from being granted roles anywhere in the organization.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Enforce the domain restricted sharing constraint at the organization with the customer ID of the company's Cloud Identity account." } }
    - { id: b, text: { en: "Create a VPC Service Controls perimeter around all projects, with an ingress rule that admits only company identities." } }
    - { id: c, text: { en: "Enforce the Public Access Prevention constraint on Cloud Storage at the organization for all existing and new buckets." } }
    - { id: d, text: { en: "Enforce the constraint that disables service account key creation at the organization for all projects." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The domain restricted sharing constraint (iam.allowedPolicyMemberDomains) limits the identities that can be added to IAM policies to the allowed Cloud Identity or Google Workspace customer IDs. Enforced at the organization, it applies to every project and blocks new grants to personal Gmail accounts."
  options:
    b:
      en: "A perimeter controls API access across its boundary; it does not prevent granting roles to outside accounts in allow policies."
    c:
      en: "Public Access Prevention blocks grants to allUsers and allAuthenticatedUsers on Cloud Storage only; it does not block grants to individual Gmail accounts or on BigQuery."
    d:
      en: "Blocking service account keys reduces credential leaks but has no effect on roles granted to Gmail accounts."
references:
  - title: Organization policy constraints
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints
