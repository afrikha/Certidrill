id: gcppca-3a-cmek-org-policies
objective: "3.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    For all projects under the folder regulated, the security team must ensure that new Cloud Storage buckets, BigQuery datasets, and Compute Engine disks cannot be created without a customer-managed encryption key. The keys must come only from the central project sec-kms.

    Which two organization policy constraints should you enforce on the folder? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: "constraints/gcp.resourceLocations" }
    - { id: b, text: "constraints/iam.disableServiceAccountKeyCreation" }
    - { id: c, text: "constraints/gcp.restrictNonCmekServices" }
    - { id: d, text: "constraints/storage.uniformBucketLevelAccess" }
    - { id: e, text: "constraints/gcp.restrictCmekCryptoKeyProjects" }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "gcp.restrictNonCmekServices requires new resources of the listed services to be protected by a customer-managed key. gcp.restrictCmekCryptoKeyProjects limits which projects can supply the Cloud KMS keys for CMEK, here sec-kms only."
  options:
    a:
      en: "This constraint limits where location-based resources can be created; it does not require CMEK."
    b:
      en: "This constraint blocks service account key creation and has no effect on data encryption."
    d:
      en: "This constraint requires uniform bucket-level access for IAM on new buckets; it does not concern encryption keys."
references:
  - title: Organization policy constraints
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints
  - title: Customer-managed encryption keys (CMEK)
    url: https://docs.cloud.google.com/kms/docs/cmek
