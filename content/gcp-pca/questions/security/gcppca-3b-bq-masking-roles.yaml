id: gcppca-3b-bq-masking-roles
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: "A bank stores customer records in a single BigQuery table. Support agents must query the table and see a masked version of the email column, while fraud investigators must see the original email addresses. The bank does not want to maintain copies of the table or additional views.\n\nWhat should you do?"
body:
  options:
    - { id: a, text: { en: "Create an authorized view that excludes the email column for support agents, and grant fraud investigators access to the table." } }
    - { id: b, text: { en: "Use Sensitive Data Protection to create a de-identified copy of the table for support agents, and keep the original for fraud investigators." } }
    - { id: c, text: { en: "Attach a policy tag with column-level access control to the email column, and grant the Fine-Grained Reader role only to fraud investigators." } }
    - { id: d, text: { en: "Attach a policy tag with a data masking policy to the email column, with Masked Reader for support and Fine-Grained Reader for fraud." } }
answer: { optionId: d }
explanation:
  correct:
    en: "BigQuery dynamic data masking builds on column-level access control: support agents with the Masked Reader role on the data policy see masked values when they query the column, and principals with the Data Catalog Fine-Grained Reader role on the policy tag see the original data. No copy or view is needed."
  options:
    a:
      en: "A view is an extra object to maintain, and support agents would not see the column at all instead of a masked value."
    b:
      en: "A de-identified copy is a second table to keep in sync, which the bank wants to avoid."
    c:
      en: "Column-level access control alone denies the column to users without Fine-Grained Reader, so support agents' queries on it would fail instead of returning masked values."
references:
  - title: "Introduction to data masking"
    url: https://docs.cloud.google.com/bigquery/docs/column-data-masking-intro
