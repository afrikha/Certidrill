id: gcppca-3b-model-armor-injection
objective: "3.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: "An insurance company is launching a customer-facing chat assistant that sends user messages to a Gemini model. The security team wants a managed Google Cloud service that detects prompt injection, jailbreak attempts and harmful content such as harassment in user messages, and blocks those messages before they reach the model.\n\nWhich solution should you use?"
body:
  options:
    - { id: a, text: { en: "Google Cloud Armor, with preconfigured WAF rules on the load balancer in front of the chat API." } }
    - { id: b, text: { en: "Sensitive Data Protection, with hourly inspection jobs on the stored chat transcripts." } }
    - { id: c, text: { en: "VPC Service Controls, with a perimeter around the project that calls the model." } }
    - { id: d, text: { en: "Model Armor, with a template that screens prompts in inspect and block mode." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Model Armor screens the prompts and responses of AI applications. A template sets the filters, such as prompt injection and jailbreak detection and responsible AI categories like harassment and hate speech, with their confidence levels, and inspect and block mode stops a non-compliant prompt before it reaches the model."
  options:
    a:
      en: "Cloud Armor WAF rules match HTTP-level attack signatures such as SQL injection; they do not evaluate the meaning of natural-language prompts."
    b:
      en: "Inspection jobs find sensitive data in stored content after the fact; they do not detect jailbreaks or block messages in real time."
    c:
      en: "A perimeter protects Google APIs against data exfiltration; it does not inspect the content of prompts."
references:
  - title: "Model Armor overview"
    url: https://docs.cloud.google.com/model-armor/overview
