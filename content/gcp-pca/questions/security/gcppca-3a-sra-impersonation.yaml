id: gcppca-3a-sra-impersonation
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Platform engineers sometimes run gcloud commands that need the permissions of the service account infra-admin, which holds broad roles in production. Today they download keys for infra-admin. You must eliminate the keys, keep each engineer's own identity in the audit logs, and avoid granting the broad roles to the engineers directly.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Grant the engineers group Service Account Token Creator on infra-admin, and have them run gcloud with --impersonate-service-account." } }
    - { id: b, text: { en: "Grant the engineers group Service Account Token Creator on the project, and have them run gcloud with --impersonate-service-account." } }
    - { id: c, text: { en: "Grant the broad roles of infra-admin to the engineers group with an IAM condition that limits them to working hours." } }
    - { id: d, text: { en: "Store a key of infra-admin in Secret Manager, and grant the engineers group Secret Accessor on that secret only." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Impersonation lets an authenticated principal obtain short-lived credentials for a service account; it requires iam.serviceAccounts.getAccessToken, included in Service Account Token Creator. Granted on infra-admin only, it gives no key, and most audit logs record both the engineer and the impersonated service account."
  options:
    b:
      en: "A project-level grant lets the engineers impersonate every service account in the project; Google recommends granting it on the individual service account."
    c:
      en: "This grants the broad roles to the engineers directly, which the requirement forbids."
    d:
      en: "The key still exists as a long-lived credential, and actions performed with it show only the service account in the logs."
references:
  - title: Service account impersonation
    url: https://docs.cloud.google.com/iam/docs/service-account-impersonation
  - title: Best practices for using service accounts securely
    url: https://docs.cloud.google.com/iam/docs/best-practices-service-accounts
