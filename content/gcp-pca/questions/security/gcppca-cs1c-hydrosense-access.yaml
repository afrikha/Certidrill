id: gcppca-cs1c-hydrosense-access
objective: "3.1.7"
type: single
caseStudy: gcppca-cs1c-furrowline-agtech
difficulty: 2
status: draft
stem:
  en: |
    You need to give HydroSense's training jobs access to the BigQuery datasets they use. The solution must meet the technical requirements and grant access to the training jobs only.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a workforce identity pool with a provider for HydroSense's AWS account, and grant the BigQuery roles to the principals of the pool." } }
    - { id: b, text: { en: "Create a service account with the BigQuery roles, store one of its keys in AWS Secrets Manager, and allow only the hydrosense-training role to read the secret." } }
    - { id: c, text: { en: "Create a workload identity pool with an AWS provider for HydroSense's AWS account and an attribute condition on the hydrosense-training role, grant the BigQuery roles to the federated identities, and give the jobs a credential configuration file." } }
    - { id: d, text: { en: "Create a Cloud Identity user for the training jobs, grant it the BigQuery roles, and sign the jobs in once with gcloud auth login on each EC2 instance." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Workload Identity Federation lets workloads on AWS exchange their AWS credentials for short-lived Google Cloud tokens, so no service account key is needed. An attribute condition on the AWS role restricts the pool to the training jobs, and roles can be granted directly to the federated identities, or through impersonation of a service account. The credential configuration file contains no private key, and the client libraries and bq use it.
  options:
    a:
      en: Workforce Identity Federation is for human users who sign in through an external identity provider, not for workloads that run on EC2.
    b:
      en: A service account key is forbidden by the enforced iam.disableServiceAccountKeyCreation constraint, wherever it is stored.
    d:
      en: A user account signed in with gcloud auth login stores a long-lived user credential on every instance and gives the jobs a human identity instead of a workload identity limited to the training role.
references:
  - title: Configure Workload Identity Federation with AWS or Azure VMs
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-other-clouds
