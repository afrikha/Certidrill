id: gcppca-3b-audit-retention-7y
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: "A bank must keep the audit logs of all projects in its organization, including projects created in the future, for seven years, and its audit team must search them in one place. The team wants to minimize the number of configurations to maintain.\n\nWhat should you do?"
body:
  options:
    - { id: a, text: { en: "Increase the retention period of the _Required log bucket in each project to 2,555 days." } }
    - { id: b, text: { en: "Set the retention period of the organization's _Default log bucket to 2,555 days, and grant the audit team access to it." } }
    - { id: c, text: { en: "Create an organization aggregated sink with --include-children to a log bucket in a central project with 2,555-day retention." } }
    - { id: d, text: { en: "Create a sink in each project to a central Cloud Storage bucket, and add sink creation to the project creation runbook." } }
answer: { optionId: c }
explanation:
  correct:
    en: "An aggregated sink created at the organization with --include-children routes matching logs from every current and future child resource to one destination. A log bucket in a project can keep logs between 1 and 3,650 days, so 2,555 days covers seven years; the sink's writer identity must be granted permission to write to the bucket."
  options:
    a:
      en: "The _Required bucket keeps logs for 400 days, and its retention cannot be changed."
    b:
      en: "The retention of _Default buckets in folders and organizations is not configurable; logs kept beyond 30 days must be routed to a log bucket in a project."
    d:
      en: "Per-project sinks must be created for every project and can be missed for new ones, which multiplies the configurations to maintain."
references:
  - title: "Collate and route organization- and folder-level logs to supported destinations"
    url: https://docs.cloud.google.com/logging/docs/export/aggregated_sinks
  - title: "Quotas and limits"
    url: https://docs.cloud.google.com/logging/quotas
