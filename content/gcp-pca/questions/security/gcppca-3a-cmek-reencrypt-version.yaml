id: gcppca-3a-cmek-reencrypt-version
objective: "3.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank protects a Cloud Storage bucket with a CMEK that rotates automatically every 90 days. After a security incident, compliance requires that no object remain encrypted with key version 3 and that version 3 then be destroyed. Version 5 is now the primary version, and every object must remain readable.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Rewrite the objects encrypted with version 3 so that they use the primary version, and then schedule version 3 for destruction." } }
    - { id: b, text: { en: "Schedule version 3 for destruction, because Cloud Storage re-encrypts its objects with the primary version during the waiting period." } }
    - { id: c, text: { en: "Rotate the key manually, because a rotation re-encrypts all existing objects with the new primary version, and then destroy version 3." } }
    - { id: d, text: { en: "Disable version 3, because disabling a version makes Cloud Storage re-encrypt its objects with the primary version automatically." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Rotation creates a new primary version for new encryption operations, but data encrypted with earlier versions is not re-encrypted automatically. Rewriting the affected objects re-encrypts them with the current primary version; only then can version 3 be destroyed without losing data, since objects encrypted with a destroyed version can never be downloaded again."
  options:
    b:
      en: "Nothing is re-encrypted during the scheduled destruction period; once version 3 is destroyed, its objects become unreadable."
    c:
      en: "Rotation, manual or automatic, does not re-encrypt existing data."
    d:
      en: "Disabling a version only blocks its use, which makes its objects unreadable; it does not re-encrypt them."
references:
  - title: Key rotation
    url: https://docs.cloud.google.com/kms/docs/key-rotation
  - title: Customer-managed encryption keys
    url: https://docs.cloud.google.com/storage/docs/encryption/customer-managed-keys
