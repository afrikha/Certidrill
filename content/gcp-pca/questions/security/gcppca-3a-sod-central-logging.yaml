id: gcppca-3a-sod-central-logging
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payment company must keep a copy of the audit logs of its 150 projects for one year. Project owners must not be able to stop the routing of these logs or delete the stored copies, and the security team wants to query all the logs in one place.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a sink in each project that routes audit logs to a log bucket in the same project with a retention of 365 days." } }
    - { id: b, text: { en: "Rely on the _Required log bucket of each project, which stores the audit logs and cannot be deleted by project owners." } }
    - { id: c, text: { en: "Create an aggregated sink at the organization that routes audit logs to a log bucket in a logging project of the security team." } }
    - { id: d, text: { en: "Create an aggregated sink at the organization that routes audit logs to a BigQuery dataset in one application project." } }
answer: { optionId: c }
explanation:
  correct:
    en: "An aggregated sink created at the organization with child resources included routes the logs of every project, including new ones, to one destination. Because the sink and the destination log bucket live outside the application projects, project owners cannot change the sink or delete the copies, and the security team queries everything in one place."
  options:
    a:
      en: "Project owners control sinks and log buckets in their own projects, so they could stop the routing or delete the logs, and the logs stay spread across 150 projects."
    b:
      en: "The _Required bucket does not hold Data Access audit logs and stays per project, so there is no single place to query."
    d:
      en: "The owners of the application project that hosts the dataset could delete it, so separation of duties is not achieved."
references:
  - title: Collate and route organization- and folder-level logs to supported destinations
    url: https://docs.cloud.google.com/logging/docs/export/aggregated_sinks
  - title: Cloud Audit Logs overview
    url: https://docs.cloud.google.com/logging/docs/audit
