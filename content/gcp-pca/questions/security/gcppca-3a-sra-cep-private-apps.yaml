id: gcppca-3a-sra-cep-private-apps
objective: "3.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company is decommissioning its VPN. Employees must keep access to internal web applications that remain in the on-premises data center and on AWS. Access must depend on user identity and on the security posture of the device, and the company also wants data loss prevention and malware protection in the Chrome browser.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Grant employees the IAP-secured Tunnel User role, and have them open the applications through tunnels created with gcloud." } }
    - { id: b, text: { en: "Use Chrome Enterprise Premium with the On-Prem Connector, and define access levels in Access Context Manager that check device posture." } }
    - { id: c, text: { en: "Put Cloud Armor security policies that allow only the home IP ranges of employees in front of the internal applications." } }
    - { id: d, text: { en: "Replace the VPN with HA VPN tunnels from each employee laptop to a VPC network connected to the data center." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Chrome Enterprise Premium extends Chrome Enterprise Core with context-aware access based on identity and device security posture, access control for web applications on customer premises, AWS, and Azure through the On-Prem Connector, and threat and data protection in Chrome such as DLP and malware scanning. Access Context Manager defines the access levels that are enforced."
  options:
    a:
      en: "TCP tunnels through gcloud are meant for administrative access to VMs; they neither check device posture nor provide DLP in the browser."
    c:
      en: "IP allowlists do not verify identity or device posture, and home IP addresses change."
    d:
      en: "HA VPN connects networks through VPN gateways, not individual laptops, and it still relies on network location instead of identity and device posture."
references:
  - title: Chrome Enterprise Premium overview
    url: https://docs.cloud.google.com/chrome-enterprise-premium/docs/overview
  - title: Access Context Manager Overview
    url: https://docs.cloud.google.com/access-context-manager/docs/overview
