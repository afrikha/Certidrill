id: gcppca-3b-pci-scope-reduction
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: "An online retailer wants to reduce the scope of its PCI DSS assessment on Google Cloud. Today, the web storefront, the order system and the payment-processing application all run in one project and one VPC network, and the payment application stores primary account numbers (PANs) in Cloud Storage.\n\nWhich two changes reduce the PCI DSS scope? Choose two."
body:
  choose: 2
  options:
    - { id: a, text: { en: "Encrypt the Cloud Storage bucket that stores PANs with CMEK so that the bucket leaves the cardholder data environment." } }
    - { id: b, text: { en: "Move the payment-processing application to dedicated projects and a VPC network isolated from the other workloads." } }
    - { id: c, text: { en: "Rely on Google Cloud's PCI DSS Level 1 Service Provider status to cover the payment-processing application." } }
    - { id: d, text: { en: "Keep storing PANs in Cloud Storage, because Cloud Storage tokenizes card numbers automatically when objects are written." } }
    - { id: e, text: { en: "Replace stored PANs with surrogate tokens so that the retailer's systems no longer keep card numbers." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Isolating the payment environment in separate projects with a dedicated VPC network keeps the other workloads out of the cardholder data environment, as Google's PCI DSS guidance recommends. Tokenization replaces the PAN with a surrogate value, so systems that keep only tokens no longer store card numbers."
  options:
    a:
      en: "Encryption protects stored PANs, but the bucket and the systems that can decrypt them remain in scope."
    c:
      en: "Google's assessment covers the infrastructure that Google operates; the merchant stays responsible for its own applications, operating systems and packages."
    d:
      en: "Cloud Storage does not automatically tokenize, hash or truncate data; PANs written to it are stored as they are."
references:
  - title: "PCI Data Security Standard compliance"
    url: https://docs.cloud.google.com/architecture/pci-dss-compliance-in-gcp
