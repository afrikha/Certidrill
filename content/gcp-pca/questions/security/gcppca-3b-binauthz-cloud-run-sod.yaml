id: gcppca-3b-binauthz-cloud-run-sod
objective: "3.1.8"
type: multi
difficulty: 3
status: draft
stem:
  en: "A bank deploys services to Cloud Run in several application projects, where developers have the Cloud Run Developer role. The security team requires that every Cloud Run deployment is checked by Binary Authorization, that developers cannot turn this check off, and that only the security team can create or change attestors and their signing keys.\n\nWhich two actions should you take? Choose two."
body:
  choose: 2
  options:
    - { id: a, text: { en: "Ask developers to add the --binary-authorization=default flag to their gcloud run deploy commands, and review deployments monthly." } }
    - { id: b, text: { en: "Add the pipeline's Artifact Registry repository to admissionWhitelistPatterns so that its images skip policy evaluation." } }
    - { id: c, text: { en: "Enforce an organization policy that requires Binary Authorization on Cloud Run services and jobs in the application projects." } }
    - { id: d, text: { en: "Grant the developers the Binary Authorization Attestor Editor role so that they can rotate signing keys when attestations fail." } }
    - { id: e, text: { en: "Keep attestors and Cloud KMS keys in a security-owned project, and grant the deployers' Binary Authorization service agent the Attestor Verifier role there." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Binary Authorization is enabled per Cloud Run service or job, so developers who can deploy could also disable it; Google recommends requiring it with an organization policy. Keeping attestors and signing keys in a separate attestor project administered by the security team, and granting the deployer projects' Binary Authorization service agent the Attestor Verifier role on the attestors, separates who signs from who deploys."
  options:
    a:
      en: "A flag that developers add themselves can be removed by the same developers, so the check could be turned off."
    b:
      en: "Exempt images are not evaluated at all, which removes the check instead of enforcing it."
    d:
      en: "Letting developers manage attestors breaks the requirement that only the security team controls attestors and keys."
references:
  - title: "Enable Binary Authorization for Cloud Run"
    url: https://docs.cloud.google.com/binary-authorization/docs/run/enabling-binauthz-cloud-run
  - title: "Create attestors using the Google Cloud console"
    url: https://docs.cloud.google.com/binary-authorization/docs/creating-attestors-console
