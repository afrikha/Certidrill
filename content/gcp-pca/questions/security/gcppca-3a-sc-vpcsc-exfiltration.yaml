id: gcppca-3a-sc-vpcsc-exfiltration
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company stores clinical trial data in BigQuery and Cloud Storage in three projects. The security team is concerned that an employee with valid credentials and the right IAM roles could copy the data to a personal project outside the organization from any workstation. You need a control that blocks this data movement at the Google API level.

    What should you recommend?
body:
  options:
    - { id: a, text: { en: "Remove the external IP addresses from all VMs, and add egress firewall rules that deny traffic to the internet." } }
    - { id: b, text: { en: "Create a VPC Service Controls perimeter that contains the three projects and restricts the BigQuery and Cloud Storage APIs." } }
    - { id: c, text: { en: "Enforce the domain restricted sharing constraint so that only company identities can be granted roles in the organization." } }
    - { id: d, text: { en: "Encrypt the datasets and buckets with CMEK, and grant the key only to the service agents of the three projects." } }
answer: { optionId: b }
explanation:
  correct:
    en: "VPC Service Controls creates a security boundary around Google Cloud resources and blocks API requests that would move data from protected services such as BigQuery and Cloud Storage across the perimeter, even for principals whose IAM roles allow the operation. It complements IAM, which only decides who can access the data."
  options:
    a:
      en: "Firewall rules control VM traffic, but the copy is an API call that can be made from any workstation or from Cloud Shell, not from the VMs."
    c:
      en: "Domain restricted sharing limits who can be granted roles in this organization; the employee copies data with a company identity to a project the policy does not govern."
    d:
      en: "Data read by an authorized principal is decrypted transparently, so it can still be written to an outside project."
references:
  - title: Overview of VPC Service Controls
    url: https://docs.cloud.google.com/vpc-service-controls/docs/overview
