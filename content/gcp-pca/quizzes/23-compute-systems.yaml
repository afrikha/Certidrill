chapter: 23-compute-systems
questions:
  # ------------------------------------------------------------------ 1
  - id: gcppca-qz-23-01
    objective: "2.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A research team runs a fault-tolerant simulation on preemptible VMs. Some runs need about 30 hours, and the VMs are always stopped before they finish. An engineer proposes recreating the workers as Spot VMs.

        Which statement about Spot VMs is true?
    body:
      options:
        - { id: a, text: { en: "They run for at most 7 days, after which Compute Engine always stops them" } }
        - { id: b, text: { en: "They have no maximum runtime unless you set one, but can be preempted at any time" } }
        - { id: c, text: { en: "They are covered by the Compute Engine SLA once they have run for 24 hours" } }
        - { id: d, text: { en: "They are live migrated during host maintenance, so they are never preempted" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Preemptible VMs can run for up to 24 hours at a time, which is why the 30-hour runs never finish. Spot VMs, the latest version of preemptible VMs and the model Google recommends, have no minimum or maximum runtime unless you limit it, but Compute Engine can still preempt them at any time to reclaim capacity.
      options:
        a: { en: "Spot VMs have no built-in runtime limit at all; only a limit you configure yourself stops them after a set time." }
        c: { en: "Spot VMs are not covered by any Service Level Agreement, however long they run." }
        d: { en: "Spot VMs cannot live migrate to become standard VMs, and preemption can happen at any time." }
    references:
      - title: Spot VMs
        url: https://docs.cloud.google.com/compute/docs/instances/spot
      - title: Preemptible VM instances
        url: https://docs.cloud.google.com/compute/docs/instances/preemptible

  # ------------------------------------------------------------------ 2
  - id: gcppca-qz-23-02
    objective: "2.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A licensed engineering application is billed per vCPU and must run on exactly 4 vCPUs. It needs 20 GB of memory to avoid swapping. On the N2 series, n2-standard-4 provides 16 GB and n2-highmem-4 provides 32 GB. The company does not want to pay for memory that the application never uses.

        Which machine type should you choose?
    body:
      options:
        - { id: a, text: { en: "n2-highmem-4, the predefined shape with 4 vCPUs and 32 GB of memory" } }
        - { id: b, text: { en: "n2-standard-8, the predefined shape with 8 vCPUs and 32 GB of memory" } }
        - { id: c, text: { en: "A custom N2 machine type with 4 vCPUs and 20 GB of memory" } }
        - { id: d, text: { en: "n2-standard-4, the predefined shape with 4 vCPUs and 16 GB of memory" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Custom machine types let you choose the number of vCPUs and the amount of memory independently. On N2, 4 vCPUs is a valid count (multiples of 2) and 20 GB is 5 GB per vCPU, inside the 0.5 to 8 GB range, so the VM matches the need exactly. Custom types carry a 5% price premium, which is far less than paying for 12 GB of unused memory.
      options:
        a: { en: "n2-highmem-4 has the right vCPU count but 12 GB more memory than needed, which the company does not want to pay for." }
        b: { en: "Eight vCPUs would double the per-vCPU license cost and break the exactly-4-vCPUs rule." }
        d: { en: "16 GB is below the 20 GB the application needs, so it would swap." }
    references:
      - title: Create a VM with a custom machine type
        url: https://docs.cloud.google.com/compute/docs/instances/creating-instance-with-custom-machine-type

  # ------------------------------------------------------------------ 3
  - id: gcppca-qz-23-03
    objective: "2.3.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An insurer's quote API runs on Cloud Run with the default scaling settings. It receives no traffic at night, and the first request each morning takes several seconds while a container instance starts. The service level objective now requires every request, including the first one of the day, to answer within 300 ms.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Raise the maximum number of instances of the service to 100" } }
        - { id: b, text: { en: "Raise the concurrency setting of the service to 250 requests" } }
        - { id: c, text: { en: "Set the minimum number of instances of the service to 1" } }
        - { id: d, text: { en: "Switch the billing setting of the service to instance-based" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          By default, minimum instances is 0 and Cloud Run scales the service to zero when it is idle, so the next request waits for a cold start. Setting minimum instances to 1 keeps an instance warm and ready, which removes the cold start at the cost of paying for that idle instance.
      options:
        a: { en: "Maximum instances caps scale-out; it does not keep any instance running when there is no traffic." }
        b: { en: "Concurrency sets how many requests one instance handles; with zero instances running, the first request still waits for a start." }
        d: { en: "Instance-based billing changes how instances are billed, but with minimum instances at 0 the service still scales to zero overnight." }
    references:
      - title: Set minimum instances for services
        url: https://docs.cloud.google.com/run/docs/configuring/min-instances

  # ------------------------------------------------------------------ 4
  - id: gcppca-qz-23-04
    objective: "2.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A bank's Compute Engine VMs have no external IP addresses, and an organization policy prevents adding any. Administrators must open SSH sessions to the VMs from their laptops through Identity-Aware Proxy TCP forwarding, and they already have the IAP-secured Tunnel User role. The connections currently time out.

        Which firewall rule should you add to the VPC network?
    body:
      options:
        - { id: a, text: { en: "Allow ingress on TCP port 22 from 0.0.0.0/0 to the VMs" } }
        - { id: b, text: { en: "Allow ingress on TCP port 22 from 35.235.240.0/20 to the VMs" } }
        - { id: c, text: { en: "Allow egress on TCP port 22 from the VMs to 35.235.240.0/20" } }
        - { id: d, text: { en: "Allow ingress on TCP port 22 from 35.191.0.0/16 to the VMs" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          IAP TCP forwarding connects to the VM from the IP range 35.235.240.0/20, so an ingress rule must allow that range on port 22 for SSH (3389 for RDP). The VMs need no external IP address, and access stays controlled by the IAP-secured Tunnel User role.
      options:
        a: { en: "Opening port 22 to the whole internet is far broader than needed; IAP traffic only comes from 35.235.240.0/20." }
        c: { en: "IAP opens connections to the VMs, so the rule needed is an ingress rule; egress is allowed by default anyway." }
        d: { en: "35.191.0.0/16 is a range used by Google Cloud health checks, not by IAP TCP forwarding." }
    references:
      - title: Use IAP for TCP forwarding
        url: https://docs.cloud.google.com/iap/docs/using-tcp-forwarding

  # ------------------------------------------------------------------ 5
  - id: gcppca-qz-23-05
    objective: "2.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An online publisher runs an image service on a GKE Autopilot cluster. The service's Pods use the Kubernetes service account `img-reader` in the namespace `media`, and they must read objects from one Cloud Storage bucket. The security team forbids service account keys and wants only these Pods to get access, following Google's recommended method.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Create a service account key, store it in a Kubernetes Secret, and mount it into the Pods" } }
        - { id: b, text: { en: "Grant Storage Object Viewer on the bucket to the service account that the cluster's nodes use" } }
        - { id: c, text: { en: "Grant Storage Object Viewer on the bucket to the principal identifier of `media/img-reader`" } }
        - { id: d, text: { en: "Annotate `img-reader` with the email of a service account that has Storage Object Viewer" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Workload Identity Federation for GKE is always enabled in Autopilot. You grant the IAM role on the bucket directly to the Kubernetes service account through its principal identifier, and the Pods receive short-lived federated tokens through the metadata server, with no key and no change to client library code.
      options:
        a: { en: "A service account key is a long-lived credential, which the security team forbids." }
        b: { en: "The node service account is shared by every Pod scheduled on those nodes, so access would not be limited to the image service." }
        d: { en: "The annotation alone is not enough: linking to a service account also needs a Workload Identity User binding on it, and Google recommends principal identifiers instead." }
    references:
      - title: Authenticate to Google Cloud APIs from GKE workloads
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity

  # ------------------------------------------------------------------ 6
  - id: gcppca-qz-23-06
    objective: "2.3.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A platform team runs every application on GKE and applies Kubernetes manifests from a Git repository with a GitOps tool. It now wants to declare the Pub/Sub topics, Cloud SQL instances and IAM bindings that the applications use in the same repository, reviewed and applied by the same GitOps tool. If someone changes one of these resources in the console, the change must be brought back to the declared state without anyone running a pipeline.

        Which solution should you recommend?
    body:
      options:
        - { id: a, text: { en: "Infrastructure Manager deployments, created from Terraform configurations stored in the repository" } }
        - { id: b, text: { en: "Config Connector, with the resources declared in manifests stored in the repository" } }
        - { id: c, text: { en: "Cloud Deploy delivery pipelines, with the resources described in Skaffold profiles" } }
        - { id: d, text: { en: "Cloud Deployment Manager templates, deployed from the repository by Cloud Build" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Config Connector is a Kubernetes add-on that manages Google Cloud resources as Kubernetes objects, so the GitOps tool can apply them like any other manifest. Its controllers reconcile each resource with every update or periodically, working to keep the real resource as close as possible to the declared state, which corrects changes made in the console.
      options:
        a: { en: "Infrastructure Manager runs Terraform only when a deployment is created or updated: drift stays until someone triggers a new run, and the resources are not Kubernetes objects." }
        c: { en: "Cloud Deploy delivers application releases to targets such as GKE or Cloud Run; it does not create or reconcile Pub/Sub, Cloud SQL or IAM resources." }
        d: { en: "Cloud Deployment Manager reached end of support on March 31, 2026, and it only applies templates when a deployment runs." }
    references:
      - title: Config Connector overview
        url: https://docs.cloud.google.com/config-connector/docs/overview
      - title: Reconciliation strategy
        url: https://docs.cloud.google.com/config-connector/docs/concepts/reconciliation

  # ------------------------------------------------------------------ 7
  - id: gcppca-qz-23-07
    objective: "2.3.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A ticketing company runs its web tier in a regional managed instance group that autoscales on CPU utilization. Each VM boots from a public Debian image, and a startup script installs the application in about 8 minutes. Traffic ramps up steeply every weekday morning and evening, and users get errors during each ramp until new VMs are ready. The company wants capacity in place before each ramp without maintaining scaling schedules, and VMs recreated by autohealing must serve traffic within 2 minutes.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Reduce the autoscaler's initialization period to 10 seconds so that new VMs count sooner" } }
        - { id: b, text: { en: "Build a custom image with the application installed and use it in a new instance template" } }
        - { id: c, text: { en: "Add weekday scaling schedules that start 15 minutes before the usual morning and evening ramps" } }
        - { id: d, text: { en: "Enable predictive autoscaling on the group, keeping CPU utilization as the autoscaling signal" } }
        - { id: e, text: { en: "Switch the signal to load balancing serving capacity and enable predictive autoscaling on it" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Predictive autoscaling forecasts load from the group's CPU history and adds VMs ahead of daily or weekly cycles, which suits applications that take a long time to initialize. Baking the application into a custom image removes the 8-minute installation, so both scaled-out and autohealed VMs serve within the required time.
      options:
        a: { en: "The initialization period only tells the autoscaler to ignore metrics from booting VMs; shortening it does not make VMs ready faster and can cause over-scaling." }
        c: { en: "Scaling schedules would add capacity in advance, but they are exactly the schedules that the company does not want to maintain." }
        e: { en: "Predictive autoscaling works only with CPU utilization; load balancing and Cloud Monitoring metrics are not supported." }
    references:
      - title: Scaling based on predictions
        url: https://docs.cloud.google.com/compute/docs/autoscaler/predictive-autoscaling

  # ------------------------------------------------------------------ 8
  - id: gcppca-qz-23-08
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A lending company's Cloud Run service in europe-west1 calls a credit bureau's API on the internet, and the bureau accepts calls only from one allowlisted IPv4 address. The same service also calls an internal HTTP API hosted on Compute Engine VMs in the company's VPC network. The architects want the lowest latency to the internal API and do not want to pay for connector instances.

        What should you configure?
    body:
      options:
        - { id: a, text: { en: "Direct VPC egress with all-traffic egress, plus Cloud NAT with a reserved static IP" } }
        - { id: b, text: { en: "Direct VPC egress with private-ranges-only egress, plus Cloud NAT with a reserved static IP" } }
        - { id: c, text: { en: "A Serverless VPC Access connector with all-traffic egress, plus Cloud NAT with a reserved static IP" } }
        - { id: d, text: { en: "A reserved static external IP assigned to the Cloud Run service, with ingress set to all" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A Cloud Run service gets a static outbound IP by sending all its egress through the VPC network and translating it with a Cloud NAT gateway that uses a reserved static address. Direct VPC egress does this with lower latency and no connector instances to pay for, and the same path reaches the internal API.
      options:
        b: { en: "With private-ranges-only, internet-bound traffic does not go through the VPC network, so Cloud NAT never translates it and the source IP is not the static one." }
        c: { en: "A connector also works with all-traffic egress, but it adds connector instances to pay for and has higher latency than Direct VPC egress." }
        d: { en: "A static external IP cannot be assigned to a Cloud Run service for outbound traffic, and ingress settings only control incoming requests." }
    references:
      - title: Static outbound IP address
        url: https://docs.cloud.google.com/run/docs/configuring/static-outbound-ip

  # ------------------------------------------------------------------ 9
  - id: gcppca-qz-23-09
    objective: "2.3.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A media company runs a stateless transcoding API as a Deployment on a GKE Standard cluster, which it keeps because of a node-level agent. The cluster has one node pool of fixed size. During evening peaks, Pods hit their CPU limits and requests time out, and at night most nodes sit idle. The company wants the number of replicas to follow CPU load, and nodes to be added when Pods cannot be scheduled and removed when they are underused.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create a HorizontalPodAutoscaler for the Deployment that targets average CPU utilization" } }
        - { id: b, text: { en: "Enable Compute Engine autoscaling on the managed instance group behind the node pool" } }
        - { id: c, text: { en: "Add a VerticalPodAutoscaler in Auto mode to the Deployment to adjust its CPU requests" } }
        - { id: d, text: { en: "Enable the cluster autoscaler on the node pool with a minimum and a maximum number of nodes" } }
        - { id: e, text: { en: "Raise the CPU limits of the Pods to the capacity of a node so that each Pod uses idle CPU" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          The HorizontalPodAutoscaler adds and removes replicas from CPU utilization. When new replicas cannot be scheduled, the cluster autoscaler adds nodes to the node pool, within its minimum and maximum, and removes nodes with low utilization, which lowers the cost at night.
      options:
        b: { en: "Google says not to enable Compute Engine autoscaling on the node MIGs: it conflicts with the cluster autoscaler and can make the node pool fail to scale." }
        c: { en: "A VPA changing CPU requests conflicts with an HPA that scales on CPU; GKE documents other approaches to combine the two, and a VPA does not add replicas." }
        e: { en: "Larger limits do not add replicas or nodes; the Deployment would still have a fixed size and idle nodes would remain at night." }
    references:
      - title: About GKE cluster autoscaling
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/cluster-autoscaler
      - title: Vertical Pod autoscaling
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/verticalpodautoscaler

  # ------------------------------------------------------------------ 10
  - id: gcppca-qz-23-10
    objective: "2.3.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A retailer serves its public storefront API from a Cloud Run service in europe-west1. Customers do not have Google accounts. The new design must meet these requirements:

        - All internet traffic is inspected by Cloud Armor WAF rules, and requests sent from the internet directly to the service's run.app URL are rejected.
        - The Cloud SQL database accepts up to 300 connections from the API, and each instance of the service opens a pool of 20 connections.
        - The first request after a quiet night does not wait for a container instance to start.

        Which three actions should you take? Choose three.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Set ingress to internal-and-cloud-load-balancing, behind a global external Application Load Balancer with a serverless NEG and a Cloud Armor policy" } }
        - { id: b, text: { en: "Set ingress to internal, behind a global external Application Load Balancer with a serverless NEG and a Cloud Armor policy" } }
        - { id: c, text: { en: "Set the maximum number of instances of the service to 15" } }
        - { id: d, text: { en: "Set the concurrency of the service to 1 request per instance" } }
        - { id: e, text: { en: "Set the minimum number of instances of the service to 1" } }
        - { id: f, text: { en: "Remove public invoker access so that every request must be authenticated" } }
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: |
          The `internal-and-cloud-load-balancing` ingress setting accepts traffic from external Application Load Balancers, where the Cloud Armor policy applies, and rejects direct internet requests to the run.app URL. Fifteen instances with 20 connections each use at most 300 connections; maximum instances can be exceeded briefly during spikes, so the database limit should keep some headroom. One minimum instance stays warm for the first request of the morning.
      options:
        b: { en: "The `internal` setting rejects traffic from external Application Load Balancers, so internet customers could not reach the API at all." }
        d: { en: "Each instance still opens its pool of 20 connections, and one request per instance multiplies the number of instances, which makes the connection limit harder to keep." }
        f: { en: "Requiring IAM authentication on the service would reject customers, who have no Google identity to authenticate with." }
    references:
      - title: Restrict network endpoint ingress for Cloud Run services and instances
        url: https://docs.cloud.google.com/run/docs/securing/ingress
      - title: Set maximum instances for services
        url: https://docs.cloud.google.com/run/docs/configuring/max-instances
