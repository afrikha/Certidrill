chapter: 21-network-topologies
questions:
  # ------------------------------------------------------------------ 1
  - id: gcppca-qz-21-01
    objective: "2.1.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A VPC network has two subnets, app-a and app-b, in the same region. VMs without external IP addresses in app-a can upload files to a Cloud Storage bucket, but identical VMs in app-b, which use the same service account, cannot. Routes, firewall rules and DNS are the same for both subnets, and no Cloud NAT gateway is configured.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Grant the service account the Storage Object Creator role" } }
        - { id: b, text: { en: "Enable Private Google Access on the app-b subnet" } }
        - { id: c, text: { en: "Set up private services access for the VPC network" } }
        - { id: d, text: { en: "Change the VPC network's dynamic routing mode to global" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Private Google Access is enabled subnet by subnet. It lets VMs that have only internal IP addresses reach Google APIs and services such as Cloud Storage; without it, those VMs can only send traffic inside the VPC network. Since app-a works and everything else is identical, the setting is missing on app-b.
      options:
        a: { en: "The VMs in app-a upload with the same service account, so its permissions on the bucket are already sufficient." }
        c: { en: "Private services access connects to managed services such as Cloud SQL on private IPs, not to Google APIs like Cloud Storage." }
        d: { en: "The routing mode controls how Cloud Router learned routes spread across regions; both subnets are in the same region." }
    references:
      - title: Private Google Access
        url: https://docs.cloud.google.com/vpc/docs/private-google-access

  # ------------------------------------------------------------------ 2
  - id: gcppca-qz-21-02
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A company is setting up Partner Interconnect with a supported service provider. The network engineer has created a VLAN attachment on a Cloud Router in the target region.

        What must the engineer give to the service provider so that it can provision the connection?
    body:
      options:
        - { id: a, text: { en: "The LOA-CFA that Google Cloud issues for the connection" } }
        - { id: b, text: { en: "The BGP peer IP addresses of the Cloud Router" } }
        - { id: c, text: { en: "The pairing key generated for the VLAN attachment" } }
        - { id: d, text: { en: "The shared secret of the Cloud Router's BGP sessions" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          When you create a Partner Interconnect VLAN attachment, Google Cloud generates a unique pairing key. The provider uses it to provision the attachment; you then activate the attachment, and BGP is configured by you (Layer 2) or by the provider (Layer 3).
      options:
        a: { en: "The LOA-CFA is part of Dedicated Interconnect: the colocation facility uses it to run the cross-connect." }
        b: { en: "BGP details come after the provider configures the attachment, and with Layer 3 the provider sets up BGP itself." }
        d: { en: "Shared secrets authenticate VPN tunnels; Partner Interconnect provisioning relies on the pairing key." }
    references:
      - title: Partner Interconnect overview
        url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/partner-overview

  # ------------------------------------------------------------------ 3
  - id: gcppca-qz-21-03
    objective: "2.1.3"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        A company is removing the external IP addresses and the bastion host from its Linux VMs. Administrators must still open SSH sessions to the VMs from their laptops. OS Login is already configured, and the administrators already hold the OS Login roles. Access must follow the principle of least privilege.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create an ingress firewall rule that allows TCP port 22 from 35.235.240.0/20 to the VMs." } }
        - { id: b, text: { en: "Create an ingress firewall rule that allows TCP port 22 from 0.0.0.0/0 to the VMs." } }
        - { id: c, text: { en: "Grant the administrators the IAP-Secured Tunnel User role on the project or the VMs." } }
        - { id: d, text: { en: "Grant the administrators the IAP-secured Web App User role on the project or the VMs." } }
        - { id: e, text: { en: "Create a Cloud NAT gateway so that the SSH connections reach the VMs on internal IPs." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          IAP TCP forwarding reaches VMs that have no external IP address. The VMs must accept connections from IAP's range, 35.235.240.0/20, on the needed port, and the users need the IAP-Secured Tunnel User role (roles/iap.tunnelResourceAccessor), granted on the project or on specific VMs.
      options:
        b: { en: "Allowing SSH from any source is far broader than needed: only IAP's range must reach the VMs." }
        d: { en: "IAP-secured Web App User controls HTTPS applications behind IAP, not TCP tunnels for SSH." }
        e: { en: "Cloud NAT only handles outbound connections initiated by the VMs; it never accepts inbound sessions." }
    references:
      - title: Use IAP for TCP forwarding
        url: https://docs.cloud.google.com/iap/docs/using-tcp-forwarding

  # ------------------------------------------------------------------ 4
  - id: gcppca-qz-21-04
    objective: "2.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A team is creating a regional internal Application Load Balancer in europe-west1 for an internal API that runs on a managed instance group. The VPC network has one custom subnet in that region, used by the VMs. Creating the forwarding rule fails.

        What should you do before you create the forwarding rule again?
    body:
      options:
        - { id: a, text: { en: "Create a proxy-only subnet in europe-west1 with the REGIONAL_MANAGED_PROXY purpose" } }
        - { id: b, text: { en: "Create a proxy-only subnet in europe-west1 with the GLOBAL_MANAGED_PROXY purpose" } }
        - { id: c, text: { en: "Enable global access on the forwarding rule of the internal load balancer" } }
        - { id: d, text: { en: "Enable Private Google Access on the existing subnet in europe-west1" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Regional internal Application Load Balancers are Envoy-based, and their proxies take addresses from a proxy-only subnet. For regional load balancers it uses the REGIONAL_MANAGED_PROXY purpose, and it must exist in the region before you create the forwarding rule, otherwise creation fails. Backends then need a firewall rule that allows traffic from that subnet.
      options:
        b: { en: "GLOBAL_MANAGED_PROXY is the purpose for cross-region load balancers, not for a regional internal Application Load Balancer." }
        c: { en: "Global access lets clients from other regions reach the load balancer; it doesn't supply the proxy addresses that are missing." }
        d: { en: "Private Google Access lets internal-only VMs reach Google APIs; it has nothing to do with Envoy proxies." }
    references:
      - title: Proxy-only subnets for Envoy-based load balancers
        url: https://docs.cloud.google.com/load-balancing/docs/proxy-only-subnets

  # ------------------------------------------------------------------ 5
  - id: gcppca-qz-21-05
    objective: "2.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A retailer connects its data center to a VPC network through Dedicated Interconnect VLAN attachments on a Cloud Router in us-central1. The network uses the default dynamic routing mode. VMs in us-central1 reach on-premises servers, but VMs in a new europe-west1 subnet of the same network cannot, although the firewall rules allow the traffic.

        What should you do with the least effort?
    body:
      options:
        - { id: a, text: { en: "Create VLAN attachments and a Cloud Router in europe-west1 on the existing connections" } }
        - { id: b, text: { en: "Change the dynamic routing mode of the VPC network from regional to global" } }
        - { id: c, text: { en: "Set the Cloud Router to custom advertisement mode and advertise the europe-west1 subnet" } }
        - { id: d, text: { en: "Add static routes in europe-west1 with the us-central1 Cloud Router as the next hop" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In regional mode, each region only uses the routes learned by Cloud Routers in that region, so europe-west1 never receives the on-premises routes. Global dynamic routing shares the best learned paths with every region, and Cloud Router's default advertisement already includes all subnets of the network once the mode is global.
      options:
        a: { en: "Extra attachments and a Cloud Router in a second region add resources and cost, when one network setting fixes the route propagation." }
        c: { en: "Advertising the subnet tells on premises how to reach it, but the europe-west1 VMs still have no route back to on premises." }
        d: { en: "A Cloud Router is a control-plane BGP speaker, not a valid next hop for static routes." }
    references:
      - title: Learned routes
        url: https://docs.cloud.google.com/network-connectivity/docs/router/concepts/learned-routes

  # ------------------------------------------------------------------ 6
  - id: gcppca-qz-21-06
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A fintech company must replicate a database between a VPC network in us-east4 and an AWS VPC in us-east-1. The link needs about 1 Gbps, the traffic must be encrypted, and the Google Cloud side must qualify for a 99.99% availability SLA. The company wants the lowest cost and does not want to order physical ports.

        Which design should you recommend?
    body:
      options:
        - { id: a, text: { en: "An HA VPN gateway, an external VPN gateway with four AWS IP addresses, two AWS Site-to-Site VPN connections and four tunnels with BGP" } }
        - { id: b, text: { en: "An HA VPN gateway, an external VPN gateway with two AWS IP addresses, one AWS Site-to-Site VPN connection and two tunnels with BGP" } }
        - { id: c, text: { en: "Two Cross-Cloud Interconnect connections to AWS in different edge availability domains, with MACsec enabled on both connections" } }
        - { id: d, text: { en: "A Classic VPN gateway with two tunnels to an AWS virtual private gateway, using static routes for the AWS VPC ranges" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          For the 99.99% SLA with AWS, the documented topology uses an HA VPN gateway, an external peer VPN gateway that holds four AWS IP addresses, two AWS Site-to-Site VPN connections (one customer gateway per HA VPN interface) and four tunnels with BGP sessions on Cloud Router. IPsec encrypts the traffic, 1 Gbps fits VPN capacity, and no ports are ordered.
      options:
        b: { en: "One AWS connection with two tunnels doesn't build the four-tunnel topology that Google requires for the 99.99% SLA with AWS." }
        c: { en: "Cross-Cloud Interconnect means ordering dedicated ports on both clouds, far more capacity and cost than a 1 Gbps link needs." }
        d: { en: "Classic VPN uses a single interface and static routing; it isn't the design for a 99.99% SLA." }
    references:
      - title: Connect HA VPN to AWS peer gateways
        url: https://docs.cloud.google.com/network-connectivity/docs/vpn/how-to/connect-ha-vpn-aws-peer-gateway

  # ------------------------------------------------------------------ 7
  - id: gcppca-qz-21-07
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A software company runs a license server that speaks a custom TCP protocol on VMs in europe-west1, behind an internal passthrough Network Load Balancer. The server must see each client's source IP address. The VPC network uses global dynamic routing. New build agents in a us-east1 subnet of the same network, and a branch office connected through HA VPN tunnels in us-east1, cannot reach the load balancer's IP address, although firewall rules allow the traffic.

        What should you do with the fewest changes?
    body:
      options:
        - { id: a, text: { en: "Replace the load balancer with a cross-region internal Application Load Balancer that has a frontend in us-east1" } }
        - { id: b, text: { en: "Create a second internal passthrough Network Load Balancer in us-east1 that uses the europe-west1 instance groups" } }
        - { id: c, text: { en: "Replace the load balancer with a regional internal proxy Network Load Balancer in europe-west1" } }
        - { id: d, text: { en: "Enable global access on the forwarding rule of the existing internal passthrough Network Load Balancer" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          By default, an internal passthrough Network Load Balancer only serves clients in its own region, including on-premises clients whose VPN tunnels or VLAN attachments are in that region. Enabling global access on the forwarding rule lets clients in any region, and on-premises clients connected in any region, reach it. Being passthrough, it keeps delivering the client source IP to the backends.
      options:
        a: { en: "An Application Load Balancer handles HTTP-based traffic and proxies it, so a custom TCP protocol and the client source IP are lost." }
        b: { en: "An internal passthrough Network Load Balancer uses a regional backend service whose backends must be in the load balancer's region." }
        c: { en: "A proxy load balancer replaces the client source IP with a proxy-only subnet address, and the regional one doesn't solve the region restriction." }
    references:
      - title: Internal passthrough Network Load Balancer overview
        url: https://docs.cloud.google.com/load-balancing/docs/internal

  # ------------------------------------------------------------------ 8
  - id: gcppca-qz-21-08
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A health analytics company runs batch VMs in a project that also holds BigQuery datasets and Cloud Storage buckets with patient data. The VMs reach the internet through Cloud NAT, and a high-priority egress rule already allows the restricted.googleapis.com range. The VMs may call only two partner APIs, api.labs-one.example and api.labs-two.example, whose IP addresses change often; all other internet egress must be blocked.

        In addition, a user or service account with valid credentials must not be able to copy the patient data to a project outside the company. Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "In a network firewall policy, allow egress to FQDN objects for the two partner APIs on TCP 443, then deny other egress at a lower priority." } }
        - { id: b, text: { en: "In VPC firewall rules, allow egress to the partners' current IP addresses on TCP 443, and update the rules when the addresses change." } }
        - { id: c, text: { en: "Create a VPC Service Controls perimeter around the project and restrict the BigQuery and Cloud Storage APIs in it." } }
        - { id: d, text: { en: "Attach a Cloud Armor security policy that allows only the two partner domains to the backend services that the VMs use." } }
        - { id: e, text: { en: "Create a Cloud IDS endpoint with a packet mirroring policy so that copies of the patient data are detected and reported." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          FQDN objects, a Cloud NGFW Standard feature of firewall policies, let an egress rule follow the partners' domain names as their IP addresses change; a lower-priority deny then blocks everything else. Firewalls can't stop an authorized identity from copying data through Google APIs to another project: a VPC Service Controls perimeter blocks reading or copying data to resources outside it.
      options:
        b: { en: "VPC firewall rules match only IP ranges, tags and service accounts, so frequently changing partner addresses would break the allowlist." }
        d: { en: "Cloud Armor filters requests that arrive at external load balancers; it doesn't control the VMs' outbound connections." }
        e: { en: "Cloud IDS only detects and alerts on mirrored network traffic; it blocks nothing and doesn't see API-level copies between projects." }
    references:
      - title: Cloud NGFW tiers
        url: https://docs.cloud.google.com/firewall/docs/ngfw_tiers
      - title: Overview of VPC Service Controls
        url: https://docs.cloud.google.com/vpc-service-controls/docs/overview

  # ------------------------------------------------------------------ 9
  - id: gcppca-qz-21-09
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A media group terminates its Dedicated Interconnect VLAN attachments on a Cloud Router in a VPC network named transit, in the project net-hub. Twelve workload VPC networks, in other projects and partly in an acquired company's organization, must reach on premises and each other over internal IP addresses. Their ranges do not overlap, new networks are added every month, and no new Interconnect connections may be ordered.

        The design must minimize ongoing operational overhead. What should you do?
    body:
      options:
        - { id: a, text: { en: "Peer each workload network with transit, export custom routes from transit, import them in each workload network, and advertise the workload ranges on Cloud Router." } }
        - { id: b, text: { en: "Create a Network Connectivity Center hub in net-hub, add the twelve workload networks as VPC spokes, and add the VLAN attachments as hybrid spokes, keeping their default import ranges and the Cloud Router's default advertisements." } }
        - { id: c, text: { en: "Create a Network Connectivity Center hub in net-hub, add the twelve workload networks as VPC spokes, add the VLAN attachments as hybrid spokes that include all IPv4 import ranges, and advertise the imported subnet ranges on the Cloud Router's BGP sessions." } }
        - { id: d, text: { en: "Make net-hub a Shared VPC host project, attach the workload projects as service projects, and move their VMs into the transit network." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          When a hub has both VPC spokes and hybrid spokes, VPC spokes import the dynamic routes that the hybrid spokes export, so the workload networks learn the on-premises routes. In the other direction, include import ranges such as ALL_IPV4_RANGES let the hybrid spokes import the VPC spokes' subnet ranges, and subnet range advertisement on the Cloud Router's BGP sessions sends them to on premises, including the ranges of networks added later. VPC spokes can come from other projects and organizations, while the VLAN attachments and their routing network must be in the hub's project, which is why the hub goes in net-hub. Adding a network is one new spoke.
      options:
        a: { en: "Peering is not transitive: each workload network would reach on premises, but not the other workload networks peered with transit." }
        b: { en: "By default, a hybrid spoke's include import ranges contain no subnet ranges from the hub, so on premises never learns the workload subnets and can't reach them." }
        d: { en: "Shared VPC works within one organization only, and moving every VM into transit is a large migration rather than a connectivity design." }
    references:
      - title: NCC overview
        url: https://docs.cloud.google.com/network-connectivity/docs/network-connectivity-center/concepts/overview
      - title: Spoke filters overview
        url: https://docs.cloud.google.com/network-connectivity/docs/network-connectivity-center/concepts/spoke-filters-overview

  # ------------------------------------------------------------------ 10
  - id: gcppca-qz-21-10
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A logistics company connects its data center to a VPC network in us-east4 through Dedicated Interconnect VLAN attachments and, as a backup, HA VPN tunnels over the internet. All BGP sessions use Cloud Routers in us-east4, both paths carry the same prefixes, and traffic is currently spread over both paths in both directions.

        Traffic in both directions must use the Interconnect path while it is available and fall back to the VPN tunnels only when it fails. Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Set a higher base advertised route priority on the Cloud Router BGP sessions of the VLAN attachments than on those of the tunnels." } }
        - { id: b, text: { en: "Set a higher base advertised route priority on the Cloud Router BGP sessions of the HA VPN tunnels than on those of the attachments." } }
        - { id: c, text: { en: "Have the on-premises routers send a higher MED for the on-premises prefixes on the tunnel sessions than on the attachment sessions." } }
        - { id: d, text: { en: "Change the dynamic routing mode of the VPC network to global so that the Interconnect routes are preferred in every region." } }
        - { id: e, text: { en: "Enable Bidirectional Forwarding Detection on the BGP sessions of the VLAN attachments so that failures are detected faster." } }
    answer: { optionIds: [b, c] }
    explanation:
      correct:
        en: |
          Each direction is steered separately. The base advertised priority of a Cloud Router BGP session is sent as MED, and on-premises routers prefer the lowest value, so a higher value on the tunnel sessions keeps inbound traffic on the attachments. For outbound traffic, Cloud Router ranks the routes it learns by the MED it receives, lowest first, so on premises must advertise a higher MED over the tunnels.
      options:
        a: { en: "A higher priority value on the attachments makes them less preferred, which would push inbound traffic onto the VPN tunnels." }
        d: { en: "The routing mode controls whether other regions receive learned routes; all sessions are in us-east4, and it doesn't rank one path above the other." }
        e: { en: "BFD shortens failure detection, but it doesn't make one path preferred while both are up." }
    references:
      - title: Advertised routes
        url: https://docs.cloud.google.com/network-connectivity/docs/router/concepts/advertised-routes
      - title: Learned routes
        url: https://docs.cloud.google.com/network-connectivity/docs/router/concepts/learned-routes
