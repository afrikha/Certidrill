chapter: 14-network-storage-compute-design
questions:
  # ------------------------------------------------------------------ 1
  - id: gcppca-qz-14-01
    objective: "1.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A company is creating its first VPC network for an application that will run VMs in `us-east1` and `europe-west1`. The VMs in both regions must communicate over internal IP addresses, and the network team wants the simplest design.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Create one VPC network per region, and connect the two networks with VPC Network Peering." } }
        - { id: b, text: { en: "Create one custom mode VPC network with a subnet in `us-east1` and a subnet in `europe-west1`." } }
        - { id: c, text: { en: "Create one VPC network per region, and connect the two networks with HA VPN tunnels." } }
        - { id: d, text: { en: "Create one custom mode VPC network with a single subnet that spans `us-east1` and `europe-west1`." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A VPC network is global and isn't tied to a region, while its subnets are regional resources. One custom mode network with a subnet in each region lets the VMs of both regions communicate over internal IP addresses with no peering or VPN to manage.
      options:
        a: { en: "Peering works, but a second network and a peering add components that a single global VPC network doesn't need." }
        c: { en: "VPN tunnels between two of your own networks add gateways, tunnels and costs; a single VPC network already spans both regions." }
        d: { en: "Subnets are regional: a subnet can't span two regions." }
    references:
      - title: VPC networks
        url: https://docs.cloud.google.com/vpc/docs/vpc

  # ------------------------------------------------------------------ 2
  - id: gcppca-qz-14-02
    objective: "1.3.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A company is moving an inventory application from its data center to Google Cloud. The application uses a 300 GB MySQL 8.0 database with a relational schema and SQL transactions, and all its users are in one region. The company wants a managed database service that handles backups, replication and patching, with no change to the application.

        Which service should you use?
    body:
      options:
        - { id: a, text: { en: "Cloud SQL for MySQL" } }
        - { id: b, text: { en: "AlloyDB for PostgreSQL" } }
        - { id: c, text: { en: "Spanner with a GoogleSQL-dialect database" } }
        - { id: d, text: { en: "Bigtable" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Cloud SQL is a fully managed relational database service for MySQL, PostgreSQL and SQL Server that takes care of backups, replication, high availability and maintenance updates. A regional MySQL application connects to it as it would to its own MySQL server, so no application change is needed.
      options:
        b: { en: "AlloyDB is PostgreSQL-compatible, not MySQL-compatible: the schema, queries and drivers would have to change." }
        c: { en: "Spanner targets horizontal or global scale, which this regional 300 GB database doesn't need, and moving from MySQL requires schema and code changes." }
        d: { en: "Bigtable is a wide-column NoSQL database without SQL joins or multi-row transactions." }
    references:
      - title: Cloud SQL overview
        url: https://docs.cloud.google.com/sql/docs/mysql/introduction

  # ------------------------------------------------------------------ 3
  - id: gcppca-qz-14-03
    objective: "1.3.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A company runs a legacy ASP.NET application on .NET Framework 4.8 with IIS on Windows Server 2022. The vendor doesn't support running the application in containers, and the company must move it to Google Cloud within two months without changing its code. The application must scale out by adding servers behind a load balancer.

        Which platform should you choose?
    body:
      options:
        - { id: a, text: { en: "A Cloud Run service that runs the application from a Windows Server base image" } }
        - { id: b, text: { en: "Compute Engine VMs from a Windows Server image in a managed instance group" } }
        - { id: c, text: { en: "A GKE Autopilot cluster that runs the application on Windows Server nodes" } }
        - { id: d, text: { en: "Cloud Run functions that run the application's pages on a .NET runtime" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Compute Engine gives full control of the operating system, so the application runs unchanged on Windows Server VMs with IIS. A managed instance group behind a load balancer adds and replaces VMs as needed, which meets the scale-out requirement without containers.
      options:
        a: { en: "Cloud Run runs container images whose executables are compiled for Linux 64-bit, and the vendor doesn't support containers." }
        c: { en: "Windows Server node images and containers aren't available in GKE Autopilot, and the application can't be containerized." }
        d: { en: "Cloud Run functions deploy individual functions on supported runtimes in Linux containers; an IIS application on .NET Framework would have to be rewritten." }
    references:
      - title: Container runtime contract
        url: https://docs.cloud.google.com/run/docs/container-contract
      - title: Windows Server containers on GKE
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/windows-server-gke

  # ------------------------------------------------------------------ 4
  - id: gcppca-qz-14-04
    objective: "1.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A retail company's data team must build about 40 nightly pipelines that read CSV files from Cloud Storage and tables from an on-premises PostgreSQL database, join and cleanse the data, and load the results into BigQuery. The team members are data analysts who don't write code. They want to design the pipelines in a visual interface with prebuilt connectors and transformations, and they don't want to manage any cluster.

        Which service should the team use?
    body:
      options:
        - { id: a, text: { en: "Managed Service for Apache Airflow (formerly Cloud Composer)" } }
        - { id: b, text: { en: "Datastream" } }
        - { id: c, text: { en: "Cloud Data Fusion" } }
        - { id: d, text: { en: "Managed Service for Apache Spark (formerly Dataproc)" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Cloud Data Fusion is a fully managed data integration service, built on the open source CDAP project, in which users connect to sources, transform data and load destinations through a web interface. For each pipeline run, it provisions an ephemeral Managed Service for Apache Spark cluster and deletes it afterward, so the team has no cluster to manage.
      options:
        a: { en: "Airflow orchestrates tasks defined in Python DAGs; it doesn't give analysts a visual designer to transform the data itself." }
        b: { en: "Datastream replicates database changes to BigQuery or Cloud Storage; it doesn't join or cleanse data from several sources." }
        d: { en: "Spark jobs are written as code, which the analysts don't write, and clusters or batch settings remain theirs to configure." }
    references:
      - title: Cloud Data Fusion overview
        url: https://docs.cloud.google.com/data-fusion/docs/concepts/overview

  # ------------------------------------------------------------------ 5
  - id: gcppca-qz-14-05
    objective: "1.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A telecom company wants to label 3 million short customer messages per day with one of 15 internal categories, such as "billing dispute" or "roaming issue". Tests show that a Gemini model reaches the required accuracy when the prompt contains the category definitions and a few examples. The company wants the lowest cost and latency per request, with no model to train and no serving infrastructure to manage.

        What should you recommend?
    body:
      options:
        - { id: a, text: { en: "Send the prompt to a Gemini Pro model through the Agent Platform API." } }
        - { id: b, text: { en: "Train a custom text classifier with serverless training on Agent Platform." } }
        - { id: c, text: { en: "Deploy an open model from Model Garden to an endpoint on GPU machines." } }
        - { id: d, text: { en: "Send the prompt to a Gemini Flash-Lite model through the Agent Platform API." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Gemini Flash-Lite models are Google's most cost-efficient Gemini models, optimized for low latency and high-volume, cost-sensitive traffic, which fits a simple classification task that prompting already solves. Calling them through Gemini Enterprise Agent Platform (formerly Vertex AI) involves no training and no infrastructure to run.
      options:
        a: { en: "Pro models target complex reasoning and coding; they cost more and respond more slowly than needed for short-message labeling." }
        b: { en: "Prompting already meets the accuracy target, so training a custom model adds work and violates the no-training requirement." }
        c: { en: "A self-deployed endpoint on GPU machines is serving infrastructure to size and pay for, even when idle." }
    references:
      - title: Google models
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/google-models

  # ------------------------------------------------------------------ 6
  - id: gcppca-qz-14-06
    objective: "1.3.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A company serves an open model whose weights take 300 GB from 120 G2 VMs in a zonal managed instance group in `us-central1-a`. At startup, each new VM copies the weights from Cloud Storage to its own Hyperdisk Balanced volume, which takes about 15 minutes and delays scale-out during traffic peaks. The weights change only with monthly releases.

        The company wants new VMs to load the weights much faster and to stop paying for one copy of the weights per VM. What should you do?
    body:
      options:
        - { id: a, text: { en: "Create each VM's data disk from a standard snapshot of a disk that already holds the weights." } }
        - { id: b, text: { en: "Move the weights to a dual-region bucket so that each VM downloads them with more throughput." } }
        - { id: c, text: { en: "Put the weights on a Hyperdisk ML volume in `us-central1-a`, and attach it read-only to every VM." } }
        - { id: d, text: { en: "Put the weights on a Hyperdisk Extreme volume of one VM, and share it with the others over NFS." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Hyperdisk ML is the Hyperdisk type recommended for immutable machine learning data: it offers the highest throughput of all Hyperdisk types, and one volume can be attached in read-only mode to many instances in its zone (up to 2,500 for a volume of up to 512 GiB). Every VM reads the same copy of the weights without copying them, and a new volume is created for each monthly release.
      options:
        a: { en: "Restoring from a snapshot avoids the download, but every VM still gets, and pays for, its own disk with a copy of the weights." }
        b: { en: "Each VM still downloads and stores its own copy; a dual-region bucket adds geo-redundancy, not per-VM throughput." }
        d: { en: "A self-managed NFS server on one VM becomes a throughput bottleneck and a single point of failure to operate." }
    references:
      - title: About Hyperdisk ML
        url: https://docs.cloud.google.com/compute/docs/disks/hd-types/hyperdisk-ml

  # ------------------------------------------------------------------ 7
  - id: gcppca-qz-14-07
    objective: "1.3.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A gaming company runs self-managed Memcached on Compute Engine VMs as a cache for player profiles. It is also adding real-time leaderboards that must keep players ranked by score with sorted sets. The company wants one fully managed in-memory service with sub-millisecond latency for both uses, for new projects that it will create over the next two years, and it accepts switching its cache client library.

        Which service should you recommend?
    body:
      options:
        - { id: a, text: { en: "Memorystore for Memcached, with one instance for the profiles and one for the leaderboards" } }
        - { id: b, text: { en: "Bigtable, with a row key that starts with the score so that players are stored in rank order" } }
        - { id: c, text: { en: "Memorystore for Valkey, with the profiles as keys and the leaderboards as sorted sets" } }
        - { id: d, text: { en: "Firestore, with one document per player and a composite index on the score field" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Memorystore for Valkey is a fully managed Valkey service: it serves cached keys and Valkey data structures such as sorted sets from memory with sub-millisecond latency. It is also the service Google recommends for moving Memcached workloads.
      options:
        a: { en: "Memorystore for Memcached is deprecated: from February 1, 2027 it can't be created in new projects, it shuts down on January 31, 2029, and Memcached has no sorted sets." }
        b: { en: "Bigtable is a disk-based database with single-digit millisecond latency, not an in-memory cache, and keeping players ranked would mean rewriting rows whenever a score changes." }
        d: { en: "Firestore is a document database with millisecond latency, not an in-memory service with sub-millisecond reads." }
    references:
      - title: Memorystore for Valkey overview
        url: https://docs.cloud.google.com/memorystore/docs/valkey/product-overview
      - title: Memorystore for Memcached overview
        url: https://docs.cloud.google.com/memorystore/docs/memcached/memcached-overview

  # ------------------------------------------------------------------ 8
  - id: gcppca-qz-14-08
    objective: "1.3.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A bank runs 150 PySpark jobs every night on an on-premises Spark cluster. The jobs read Parquet files, which the bank is moving to Cloud Storage, and each job sets its own Spark properties. The jobs will be started by the bank's existing DAGs in Managed Service for Apache Airflow (formerly Cloud Composer). The data team wants to keep the PySpark code, pay only while jobs run, and stop sizing, configuring and deleting clusters altogether.

        What should you recommend?
    body:
      options:
        - { id: a, text: { en: "Submit each job from the DAGs as a Managed Service for Apache Spark serverless batch workload." } }
        - { id: b, text: { en: "Create a Managed Service for Apache Spark cluster for each job from the DAGs, and delete it afterward." } }
        - { id: c, text: { en: "Rewrite each job as an Apache Beam pipeline, and start it on Dataflow from the DAGs." } }
        - { id: d, text: { en: "Run all jobs on one long-running Managed Service for Apache Spark cluster with an autoscaling policy." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The serverless deployment of Managed Service for Apache Spark (formerly Serverless for Apache Spark) runs PySpark batches without any cluster to provision or manage, scales resources as needed, and charges only while the workload runs. Each batch keeps its own Spark properties, and Airflow can submit the batches from the existing DAGs.
      options:
        b: { en: "Ephemeral clusters stop idle costs, but the team still sizes, configures and deletes a cluster for every job." }
        c: { en: "Dataflow requires rewriting the PySpark code as Apache Beam pipelines, which the team wants to avoid." }
        d: { en: "A long-running cluster keeps costing money between nightly runs and is still a cluster to size and operate." }
    references:
      - title: Managed Service for Apache Spark serverless overview
        url: https://docs.cloud.google.com/dataproc-serverless/docs/overview

  # ------------------------------------------------------------------ 9
  - id: gcppca-qz-14-09
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A payments company runs connector VMs in a custom mode VPC network. The VMs have no external IP addresses and reach the internet through Cloud NAT. They must call only two partner APIs, `api.partner-one.example` and `api.partner-two.example`, whose IP addresses change several times a week, and they need no other destination. Every other egress connection must be blocked. The VPC network has no VPC firewall rules for egress, and the security team doesn't want to maintain lists of IP addresses.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create a VPC firewall rule that allows egress to the two API domain names, and rely on the implied egress rule to block the rest." } }
        - { id: b, text: { en: "Create a global network firewall policy for the VPC network with an egress allow rule whose destinations are FQDN objects for the two APIs." } }
        - { id: c, text: { en: "Configure the Cloud NAT gateway to translate only the connections whose destination domain is one of the two APIs." } }
        - { id: d, text: { en: "Add an egress deny rule for the destination range `0.0.0.0/0` to the policy, evaluated after the allow rule." } }
        - { id: e, text: { en: "Create a hierarchical firewall policy with egress allow rules that use geolocation objects for the partners' countries." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          FQDN objects are a component of firewall policy rules (Cloud NGFW Standard): Cloud NGFW periodically resolves the domain names through Cloud DNS, so the allow rule follows the partners' IP address changes without manual lists. Because the implied egress rule allows all egress, an explicit deny rule for `0.0.0.0/0`, with a higher priority number than the allow rule, is needed to block every other destination.
      options:
        a: { en: "VPC firewall rules match IP address ranges, network tags and service accounts, not domain names, and the implied egress rule allows traffic instead of blocking it." }
        c: { en: "Cloud NAT translates addresses; it doesn't filter connections by destination domain name." }
        e: { en: "Geolocation objects allow whole countries, far more than the two APIs, and don't block anything else." }
    references:
      - title: Fully qualified domain name objects overview
        url: https://docs.cloud.google.com/firewall/docs/fqdn-objects-overview
      - title: VPC firewall rules
        url: https://docs.cloud.google.com/firewall/docs/firewalls

  # ------------------------------------------------------------------ 10
  - id: gcppca-qz-14-10
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A retailer runs its inventory services in a VPC network in `us-east4` and its order systems in an AWS VPC in `us-east-1`. It needs private connectivity between the two clouds that is encrypted, uses dynamic routing, qualifies for the 99.99% HA VPN availability SLA, and spreads about 4 Gbps of traffic across several tunnels. The retailer doesn't want to pay for dedicated ports or physical connections.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "In AWS, use a virtual private gateway for the VPC so that traffic is balanced across all tunnels with ECMP." } }
        - { id: b, text: { en: "In AWS, create one Site-to-Site VPN connection whose two tunnels terminate on one HA VPN gateway interface." } }
        - { id: c, text: { en: "In Google Cloud, create an external VPN gateway with four interfaces, four HA VPN tunnels, and BGP on a Cloud Router." } }
        - { id: d, text: { en: "In AWS, attach a transit gateway to the VPC, and create two Site-to-Site VPN connections to the HA VPN gateway." } }
        - { id: e, text: { en: "Order Cross-Cloud Interconnect connections to AWS, and enable MACsec on them for encryption." } }
    answer: { optionIds: [c, d] }
    explanation:
      correct:
        en: |
          The supported topology for the 99.99% SLA with AWS uses two AWS Site-to-Site VPN connections, whose four AWS endpoints are configured as one external VPN gateway with `FOUR_IPS_REDUNDANCY`, four tunnels on the HA VPN gateway, and BGP sessions on Cloud Router. On the AWS side, only a transit gateway supports equal-cost multipath routing, which spreads the traffic across the tunnels.
      options:
        a: { en: "A virtual private gateway is supported but doesn't do ECMP, so traffic isn't spread across the tunnels." }
        b: { en: "One AWS connection gives only two tunnels to one interface, which is not the four-tunnel topology documented for the 99.99% SLA." }
        e: { en: "Cross-Cloud Interconnect is a dedicated physical connection whose ports the retailer would pay for in both clouds." }
    references:
      - title: Connect HA VPN to AWS peer gateways
        url: https://docs.cloud.google.com/network-connectivity/docs/vpn/how-to/connect-ha-vpn-aws-peer-gateway
      - title: Cross-Cloud Interconnect overview
        url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/cci-overview
