chapter: 61-operations-excellence
questions:
  # ------------------------------------------------------------------ 1
  - id: gcppca-qz-61-01
    objective: "6.1.1"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        A SaaS company's contract promises customers 99.5% monthly availability for its API, with service credits below that level. The SRE team must now set the internal availability SLO that the team tracks in Cloud Monitoring and uses to manage its error budget.

        Which SLO should the team set?
    body:
      options:
        - { id: a, text: "99.0% over a rolling 30 days" }
        - { id: b, text: "99.5% over a rolling 30 days" }
        - { id: c, text: "99.9% over a rolling 30 days" }
        - { id: d, text: "100% over a rolling 30 days" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          SLOs are typically more stringent than public or contractual commitments, so the team sees its error budget shrink and reacts before the 99.5% contract is breached. 99.9% still leaves an error budget of 0.1% of the period for releases and incidents.
      options:
        a: { en: "An SLO looser than the SLA means the contract can be breached, and credits paid, before the internal target even signals a problem." }
        b: { en: "An SLO equal to the SLA gives no early warning: the error budget runs out exactly when the penalties start." }
        d: { en: "A 100% SLO leaves no error budget at all, which Google calls bad practice: any release or incident breaks it." }
    references:
      - title: Concepts in service monitoring
        url: https://docs.cloud.google.com/stackdriver/docs/solutions/slo-monitoring

  # ------------------------------------------------------------------ 2
  - id: gcppca-qz-61-02
    objective: "6.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A global retailer runs its business-critical checkout platform on Google Cloud. Its CIO requires that Cloud Customer Care responds to critical-impact (P1) cases within 15 minutes, 24 hours a day, and that the company has a Technical Account Manager who knows its architecture.

        Which Customer Care offering meets these requirements?
    body:
      options:
        - { id: a, text: "Standard Support" }
        - { id: b, text: "Enhanced Support" }
        - { id: c, text: "Premium Support" }
        - { id: d, text: "Basic Support" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Premium Support is designed for enterprises with critical workloads: it gives a 15-minute initial response for P1 cases, 24/7 response for high- and critical-impact issues, and includes a Technical Account Manager.
      options:
        a: { en: "Standard Support targets workloads under development, with 8/5 response for high-impact issues and no P1 commitment." }
        b: { en: "Enhanced Support answers P1 cases within 1 hour, not 15 minutes, and does not include a Technical Account Manager." }
        d: { en: "Basic Support covers documentation, community and billing help; it gives no technical case response times." }
    references:
      - title: Customer Care | Google Cloud
        url: https://cloud.google.com/support

  # ------------------------------------------------------------------ 3
  - id: gcppca-qz-61-03
    objective: "6.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A platform team has moved from self-managed Prometheus to Google Cloud Managed Service for Prometheus on GKE. About 60 Prometheus alerting rules, written as PromQL expressions, still run in a self-managed Alertmanager. The team wants to manage all alerting in Cloud Monitoring and reuse the existing expressions with the least rework.

        What should the team do?
    body:
      options:
        - { id: a, text: "Rebuild each rule as a metric-threshold condition in the Cloud Monitoring console, selecting the metrics with Monitoring filters." }
        - { id: b, text: "Create log-based alerting policies on the logs that Alertmanager writes each time one of the rules fires." }
        - { id: c, text: "Keep the rules in Alertmanager, and configure it to send its alerts to a webhook notification channel of Cloud Monitoring." }
        - { id: d, text: "Migrate the rules to PromQL-based alerting policies in Cloud Monitoring, keeping each rule's PromQL expression." }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Cloud Monitoring supports PromQL-based alerting policies, whose condition is a PromQL query. Users of alerting in Managed Service for Prometheus can migrate their Prometheus alerting rules to these policies, for example with the Google Cloud CLI, and then manage all alerting policies in Monitoring.
      options:
        a: { en: "Rewriting 60 rules with Monitoring filters is the rework the team wants to avoid, and some PromQL expressions have no direct filter equivalent." }
        b: { en: "Alerting on Alertmanager's own logs keeps the self-managed Alertmanager in the path, so alerting is not managed in Cloud Monitoring." }
        c: { en: "Notification channels are where Cloud Monitoring sends its notifications; they do not receive alerts from other tools, and Alertmanager would stay self-managed." }
    references:
      - title: PromQL-based alerting policies
        url: https://docs.cloud.google.com/monitoring/promql/promql-in-alerting

  # ------------------------------------------------------------------ 4
  - id: gcppca-qz-61-04
    objective: "6.6.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A gaming company runs game servers on Compute Engine VMs whose host maintenance policy is set to live migrate. Players reported short lag spikes, and the team suspects host maintenance. The game server code watches the `maintenance-event` metadata key to pause matchmaking. Before the next season, the team wants to test the code's reaction to a host maintenance event, without waiting for Google to schedule one.

        What should the team do?
    body:
      options:
        - { id: a, text: "Run `gcloud compute instances reset` on a test VM so that the guest restarts as it does during host maintenance." }
        - { id: b, text: "Run `gcloud compute instances simulate-maintenance-event` on a test VM and watch the application's behavior." }
        - { id: c, text: "Suspend and resume a test VM with `gcloud compute instances suspend` and `resume` to reproduce a migration." }
        - { id: d, text: "Open a support case and ask Customer Care to schedule host maintenance on the hosts of the test VMs." }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `simulate-maintenance-event` tests the effects of the VM's host maintenance policy on the application. For a live-migrate policy, the `maintenance-event` metadata value changes from `NONE` to `MIGRATE_ON_HOST_MAINTENANCE` during the simulation and back to `NONE` afterward, which is exactly what the code reacts to.
      options:
        a: { en: "A reset is a hard restart of the VM: it neither live migrates nor changes the maintenance-event metadata key that the code watches." }
        c: { en: "Suspending stops the guest and preserves its memory; it is not a host maintenance event and does not change the metadata key." }
        d: { en: "Google does not schedule maintenance on request; the simulate command exists so that you can test this yourself at any time." }
    references:
      - title: Simulate a host maintenance event
        url: https://docs.cloud.google.com/compute/docs/instances/simulating-host-maintenance

  # ------------------------------------------------------------------ 5
  - id: gcppca-qz-61-05
    objective: "6.5.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A security team has written a Binary Authorization policy that will require attestations for every image deployed to the company's production GKE clusters and Cloud Run services. Before the policy blocks anything, the team must find out which current deployments would be rejected, without interrupting any release.

        What should the team do?
    body:
      options:
        - { id: a, text: "Enable the policy in dry-run mode, review the policy compliance results in Cloud Audit Logs, then turn dry-run mode off." }
        - { id: b, text: "Set the policy's default rule to allow all images, review the deployments in Cloud Audit Logs, then change the rule." }
        - { id: c, text: "Enforce the policy, and ask release engineers to add the breakglass annotation to every deployment until it passes." }
        - { id: d, text: "Turn on continuous validation for the policy so that the images already running are checked against its rules." }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          In dry-run mode, Binary Authorization lets every image deploy, even when it violates the policy, and writes the policy compliance results to Cloud Audit Logs. Administrators review the logs to see which deployments would have been blocked, fix them, and then turn off dry-run mode to enforce the policy. Dry run is available for GKE and Cloud Run.
      options:
        b: { en: "A rule that allows all images evaluates no attestation requirement, so the logs cannot show which deployments would fail the new policy." }
        c: { en: "Enforcing first blocks releases, and breakglass is an emergency bypass that hides the violations it should reveal." }
        d: { en: "Continuous validation is a Preview feature that checks running images; it is not the way to test a policy before enforcement." }
    references:
      - title: Enable dry-run mode
        url: https://docs.cloud.google.com/binary-authorization/docs/enabling-dry-run

  # ------------------------------------------------------------------ 6
  - id: gcppca-qz-61-06
    objective: "6.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A logistics company's Go API on GKE has a high 99th percentile latency under concurrent load. Cloud Trace shows that the time is spent inside the API itself, not in calls to other services. Cloud Profiler is enabled, and the CPU time profile shows low CPU usage spread evenly across functions. The team suspects that requests spend their time waiting for each other on a shared in-memory cache.

        Which Cloud Profiler profile type should the team examine to find the code that causes the waiting?
    body:
      options:
        - { id: a, text: "Wall time" }
        - { id: b, text: "Threads" }
        - { id: c, text: "Contention" }
        - { id: d, text: "Allocated heap" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The contention profile shows where a multi-threaded program spends time waiting to serialize access to a shared resource, such as a lock that protects a cache. Cloud Profiler collects contention profiles for Go, which matches a latency problem with low CPU usage and no slow downstream calls.
      options:
        a: { en: "Wall time would include waiting time, but Cloud Profiler does not collect wall time profiles for Go; it offers them for Java, Node.js and Python." }
        b: { en: "The threads profile shows how many goroutines include each frame, which detects goroutine leaks, not where goroutines wait for a shared resource." }
        d: { en: "The allocated heap profile shows which code allocates memory; it points to garbage collection pressure, not lock waiting." }
    references:
      - title: Profiling concepts
        url: https://docs.cloud.google.com/profiler/docs/concepts-profiling

  # ------------------------------------------------------------------ 7
  - id: gcppca-qz-61-07
    objective: "6.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A bank runs its payment services on a GKE Standard cluster. Last quarter, a node pool version upgrade completed with the default strategy, and a workload incompatibility appeared only afterward; the team could not return to the previous nodes. For the next upgrade, the team wants GKE to keep the original nodes while the workloads are validated on the new ones for four hours, with a fast way back if errors appear. The budget allows the node pool's cost to double during the upgrade.

        What should you recommend?
    body:
      options:
        - { id: a, text: "Use a surge upgrade with a high maxSurge value and maxUnavailable set to 0, so that many new nodes are created in parallel." }
        - { id: b, text: "Use the autoscaled blue-green upgrade strategy, so that the new pool starts empty and grows as Pods move to it." }
        - { id: c, text: "Use the blue-green upgrade strategy with a soak duration of four hours, and roll back the upgrade during the soak if needed." }
        - { id: d, text: "Use a surge upgrade with maxSurge set to 1 and maxUnavailable set to 0, so that nodes are replaced one at a time." }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A blue-green node pool upgrade creates the green nodes, cordons and drains the blue nodes in batches, then soaks before deleting the blue pool. The original environment is kept during the upgrade, so an in-progress upgrade can be rolled back, and the soak duration is configurable. It uses double the resources during the upgrade, which the budget allows.
      options:
        a: { en: "A surge upgrade, however fast, keeps no original nodes to return to: a node pool cannot be rolled back once a surge upgrade has completed, and there is no soak phase." }
        b: { en: "Autoscaled blue-green upgrades are in Preview and are meant for workloads that do not need an immediate rollback, such as batch jobs." }
        d: { en: "Replacing one node at a time is the default surge behavior that already failed: there is no soak phase and no return to the old nodes after completion." }
    references:
      - title: Node upgrade strategies
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/node-pool-upgrade-strategies

  # ------------------------------------------------------------------ 8
  - id: gcppca-qz-61-08
    objective: "6.4.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        During a security incident, an insurance company brings in an external consultant to help its support team. For the next 14 days, the consultant must read all log entries of the project claims-prod, including Data Access audit logs, and must not be able to change any logging configuration. The access must end automatically, without anyone removing it, and must follow the principle of least privilege.

        What should you do?
    body:
      options:
        - { id: a, text: "Grant the Logs Viewer role (roles/logging.viewer) on claims-prod, with an IAM condition on request.time that expires in 14 days." }
        - { id: b, text: "Grant the Private Logs Viewer role (roles/logging.privateLogViewer) on claims-prod, with an IAM condition on request.time that expires in 14 days." }
        - { id: c, text: "Grant the legacy Viewer basic role on claims-prod, with an IAM condition on request.time that expires in 14 days." }
        - { id: d, text: "Grant the Logging Admin role (roles/logging.admin) on claims-prod, with an IAM condition on request.time that expires in 14 days." }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Private Logs Viewer includes the permissions of Logs Viewer and adds read-only access to private logs such as Data Access audit logs. A conditional role binding with a date/time condition on request.time expires at the specified time, so the access ends on its own.
      options:
        a: { en: "Logs Viewer cannot read Data Access audit logs; Google says to grant Private Logs Viewer when a principal needs them." }
        c: { en: "IAM conditions cannot be used with legacy basic roles such as Viewer, and the role is far broader than log reading." }
        d: { en: "Logging Admin can change sinks, buckets and exclusions, which breaks the read-only and least-privilege requirements." }
    references:
      - title: Access control with IAM
        url: https://docs.cloud.google.com/logging/docs/access-control
      - title: Configure temporary access
        url: https://docs.cloud.google.com/iam/docs/configuring-temporary-access

  # ------------------------------------------------------------------ 9
  - id: gcppca-qz-61-09
    objective: "6.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A logistics SaaS company reviews its last three major outages. In each one, about ten engineers investigated in parallel, two of them applied conflicting configuration changes, and account managers received no status update for hours. The same five alert types cause most incidents, and each responder handles them with different, improvised steps.

        The company wants to apply the incident management recommendations of the Well-Architected Framework operational excellence pillar. Which two actions should you recommend? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: "Define incident roles, with an incident commander who coordinates the responders and their actions, and a communicator who updates stakeholders." }
        - { id: b, text: "Require responders to find and confirm the root cause before they apply any change, so that two engineers can never apply conflicting fixes." }
        - { id: c, text: "Page every engineer of the platform team for each incident, so that more people can investigate the problem in parallel from the start." }
        - { id: d, text: "Write a runbook for each of the five recurring alert types, and link each runbook from the documentation of the matching alerting policy." }
        - { id: e, text: "Hold a review after each incident that names the engineer whose change caused it, so that the same mistakes are not made again." }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          The pillar asks to define the roles and expectations of each team member, such as incident commanders, investigators and communicators, with clear communication protocols: one coordinator prevents conflicting actions, and a communicator keeps stakeholders informed. It also asks for runbooks that outline the steps at each stage of the response, which replaces improvised handling of recurring alerts.
      options:
        b: { en: "Waiting for the root cause before any change delays mitigation such as a rollback, and does not give anyone the authority to coordinate actions." }
        c: { en: "Paging more engineers without defined roles adds to the uncoordinated parallel work that caused the conflicting changes." }
        e: { en: "The pillar calls for blameless post-incident reviews that focus on learning, root causes and contributing factors, not on naming individuals." }
    references:
      - title: Manage incidents and problems
        url: https://docs.cloud.google.com/architecture/framework/operational-excellence/manage-incidents-and-problems

  # ------------------------------------------------------------------ 10
  - id: gcppca-qz-61-10
    objective: "6.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A financial group has 250 projects in its Google Cloud organization and creates new ones every month. Data Access audit logs are already enabled. Regulators require that the Admin Activity and Data Access audit logs of every project be kept for 7 years and be impossible to delete or alter during that time, at the lowest storage cost. Security analysts must also run SQL queries over the last 90 days of these audit logs, across all projects, without the company operating another system.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: "Create an aggregated sink at the organization level that includes child resources and routes the audit logs to an Archive class Cloud Storage bucket with a locked 7-year retention policy." }
        - { id: b, text: "Set the retention of the organization's _Required log bucket to 7 years, and lock the bucket so that no administrator can shorten the retention period." }
        - { id: c, text: "Create an aggregated sink at the organization level that includes child resources and routes the audit logs to a central log bucket with 90-day retention, upgraded to Observability Analytics." }
        - { id: d, text: "Set the retention of the _Default log bucket of every project to 2,555 days, and lock each bucket so that no administrator can delete it or change its settings." }
        - { id: e, text: "Create an aggregated sink at the organization level that routes the audit logs to a BigQuery dataset whose tables expire after 7 years, and let the analysts query it." }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          An organization-level aggregated sink that includes children routes the logs of every current and future project. Sent to a Cloud Storage bucket in Archive, the lowest-cost class, with a locked retention policy, the logs cannot be deleted or replaced for 7 years. A second aggregated sink to a central log bucket upgraded to Observability Analytics (formerly Log Analytics) gives the analysts SQL queries on 90 days of logs with no extra system.
      options:
        b: { en: "The _Required bucket keeps its logs 400 days and that period cannot be changed; buckets in a folder or organization cannot have their retention extended either." }
        d: { en: "Admin Activity logs go to _Required, not _Default; per-project settings miss new projects unless repeated, and 7 years in log buckets costs more than Archive storage." }
        e: { en: "Dataset administrators can still delete tables before they expire, so the logs are not protected, and 7 years of storage costs more than Archive class." }
    references:
      - title: Route log entries
        url: https://docs.cloud.google.com/logging/docs/routing/overview
      - title: Bucket Lock
        url: https://docs.cloud.google.com/storage/docs/bucket-lock
