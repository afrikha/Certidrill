chapter: 51-advising-teams
questions:
  # ------------------------------------------------------------------ 1
  - id: gcppca-qz-51-01
    objective: "5.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A team deploys a web application to a production GKE cluster with Cloud Deploy. From now on, each new release must reach only a small share of the users first, then a larger share, and then everyone, so that a faulty release affects few users and the rollout can be stopped between steps.

        Which deployment strategy should the team configure for the production stage of its delivery pipeline?
    body:
      options:
        - { id: a, text: { en: "Standard: Cloud Deploy deploys each release to the whole target in a single step." } }
        - { id: b, text: { en: "Canary: Cloud Deploy shifts traffic to the release in phases defined as percentages." } }
        - { id: c, text: { en: "Recreate: the Kubernetes Deployment stops every old Pod before it starts the new ones." } }
        - { id: d, text: { en: "Blue-green upgrade: GKE moves workloads to a new node pool, then drains the old one." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A canary deployment is a progressive rollout: Cloud Deploy splits traffic between the old and new versions in stages, with any progression of percentages you specify, and the rollout can be stopped or rolled back between phases. It limits the impact of a faulty release to the share of traffic it receives.
      options:
        a: { en: "The standard strategy is not progressive: there is no split between the old and new versions, so every user gets the release at once." }
        c: { en: "Recreate causes downtime and exposes all users to the new version at the same time." }
        d: { en: "GKE blue-green upgrades change the node pool version during cluster upgrades; they don't roll out application releases to a share of users." }
    references:
      - title: "Use a deployment strategy | Cloud Deploy | Google Cloud Documentation"
        url: https://docs.cloud.google.com/deploy/docs/deployment-strategies

  # ------------------------------------------------------------------ 2
  - id: gcppca-qz-51-02
    objective: "5.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A small company exposes a REST API, implemented as a Cloud Run service, to its own mobile app. It wants a managed gateway in front of the API, defined by an OpenAPI spec, that checks API keys. It has no partner program, no developer portal, and no monetization needs, and it does not want to deploy or operate a proxy of its own. It wants the simplest and least expensive option.

        Which product should it use?
    body:
      options:
        - { id: a, text: { en: "Apigee, with API products, developer apps, and an integrated developer portal" } }
        - { id: b, text: { en: "Apigee hybrid, with the runtime plane installed on a GKE cluster in the project" } }
        - { id: c, text: { en: "API Gateway, with an API config and a gateway in front of the Cloud Run service" } }
        - { id: d, text: { en: "Cloud Endpoints, with its OpenAPI config and the ESPv2 proxy on a separate Cloud Run service" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          API Gateway gives secure access to backends such as Cloud Run, Cloud Run functions, and App Engine through an API defined by an OpenAPI spec, with API key and token authentication, monitoring, and logging, and Google runs the gateway. It is the light option for a team's own serverless backends when full API management is not needed.
      options:
        a: { en: "Apigee's products, portal, and monetization target API programs for partners and developers; they add cost the company doesn't need." }
        b: { en: "Apigee hybrid means operating the runtime on your own Kubernetes clusters: the most operational effort, with no requirement for it." }
        d: { en: "Cloud Endpoints on Cloud Run requires deploying and maintaining the ESPv2 proxy yourself, which the company wants to avoid." }
    references:
      - title: "About API Gateway | Google Cloud Documentation"
        url: https://docs.cloud.google.com/api-gateway/docs/about-api-gateway

  # ------------------------------------------------------------------ 3
  - id: gcppca-qz-51-03
    objective: "5.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A media company must move 180 TB of archived video from its data center in Germany to Cloud Storage within six weeks. The data center's internet link can spare about 100 Mbps for the transfer, and the company does not want to buy additional network connectivity for this one-time move.

        What should you recommend?
    body:
      options:
        - { id: a, text: { en: "Install Storage Transfer Service agents in the data center, and run an agent-based transfer job to the bucket." } }
        - { id: b, text: { en: "Run `gcloud storage rsync` from several servers in parallel, so that the upload uses the whole available bandwidth." } }
        - { id: c, text: { en: "Mount the bucket with Cloud Storage FUSE on a file server in the data center, and copy the archive into it." } }
        - { id: d, text: { en: "Order a Transfer Appliance, copy the archive onto it in the data center, and ship it back to Google." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          At 100 Mbps, 180 TB takes about 167 days to upload (180 × 8 × 10^12 bits ÷ 10^8 bits per second), far beyond six weeks. Google suggests Transfer Appliance when an upload would take more than one week: the data is captured on the encrypted appliance, shipped, and typically available in Cloud Storage within about 10 business days after it arrives, and the service is offered in the EU.
      options:
        a: { en: "Storage Transfer Service is built for large online transfers, but it is still limited by the 100 Mbps link: months, not weeks." }
        b: { en: "Parallel uploads can't exceed the link's capacity; the transfer would still take about five and a half months." }
        c: { en: "Cloud Storage FUSE writes through the same internet link, so it is as slow as any other online copy." }
    references:
      - title: "Transfer Appliance | Google Cloud Documentation"
        url: https://docs.cloud.google.com/transfer-appliance/docs/4.0/overview
      - title: "Migrate to Google Cloud: Transfer your large datasets | Cloud Architecture Center | Google Cloud Documentation"
        url: https://docs.cloud.google.com/architecture/migration-to-google-cloud-transferring-your-large-datasets

  # ------------------------------------------------------------------ 4
  - id: gcppca-qz-51-04
    objective: "5.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An order service publishes messages to Pub/Sub, and a shipping service consumes them. The team wants integration tests that exercise the real publish and subscribe code of both services on every pull request in Cloud Build. The tests must not create Google Cloud resources, must not share topics with other builds that run at the same time, and must never touch production data.

        What should you recommend?
    body:
      options:
        - { id: a, text: { en: "Create topics and subscriptions in a shared test project that every build uses, and purge the messages after each run." } }
        - { id: b, text: { en: "Replace the Pub/Sub client of both services with mocks in the unit tests, so that no messaging system is needed." } }
        - { id: c, text: { en: "Publish the test messages to the production topic with a `test` attribute that the shipping service ignores." } }
        - { id: d, text: { en: "Start the Pub/Sub emulator in the build, and set `PUBSUB_EMULATOR_HOST` so that both services connect to it." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The Pub/Sub emulator runs locally for development and testing; when `PUBSUB_EMULATOR_HOST` is set, the client libraries talk to it instead of the production service (some languages need a small code change). Each build gets its own emulator, so tests are isolated, create no cloud resources, and use no production data. The emulator lacks some features, such as IAM, and is not a basis for performance results.
      options:
        a: { en: "A shared test project creates real resources and lets concurrent builds read each other's messages, making tests flaky." }
        b: { en: "Mocks test each service alone; they don't exercise the real publish and subscribe paths that integration tests must cover." }
        c: { en: "Using the production topic risks production data and consumers, which the requirements forbid." }
    references:
      - title: "Testing apps locally with the emulator | Pub/Sub | Google Cloud Documentation"
        url: https://docs.cloud.google.com/pubsub/docs/emulator

  # ------------------------------------------------------------------ 5
  - id: gcppca-qz-51-05
    objective: "5.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A software company has an Enhanced Support contract. Its platform team enabled the Gemini Cloud Assist API and its required APIs in the project `ops-prod`, and granted the SRE group the Gemini Cloud Assist User, Cloud Asset Viewer, and Gemini Cloud Assist Investigation Creator roles on the project. The SREs can chat with Gemini Cloud Assist, but they cannot create investigations to troubleshoot incidents.

        What else is required for them to create investigations?
    body:
      options:
        - { id: a, text: { en: "Grant the SRE group the Investigation Owner role (`roles/geminicloudassist.investigationOwner`) on the project." } }
        - { id: b, text: { en: "Enable the `cloudaicompanion.googleapis.com` API in the project, in addition to the Gemini Cloud Assist API." } }
        - { id: c, text: { en: "Move to a Premium Support contract, or request access to investigations through the Google Cloud account team." } }
        - { id: d, text: { en: "Set up Gemini Cloud Assist on the parent folder of the project, so that the folder settings include investigations." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Since April 10, 2026, creating, running, and editing Gemini Cloud Assist investigations is available only to customers with a Premium Support contract, or through access requested from the account team. With the roles already in place, the Enhanced Support contract is what blocks the SREs. Gemini Cloud Assist itself remains a Preview offering.
      options:
        a: { en: "The Investigation Owner role is granted automatically to the creator of each investigation; it is not what allows creating one." }
        b: { en: "Enabling the Gemini Cloud Assist API already enables `cloudaicompanion.googleapis.com`, and chat works, so the APIs are in place." }
        d: { en: "Folder setup only enables Gemini Cloud Assist for the folder's existing projects; it doesn't change which features a support contract allows." }
    references:
      - title: "Create a Gemini Cloud Assist investigation | Google Cloud Documentation"
        url: https://docs.cloud.google.com/cloud-assist/create-investigation
      - title: "Troubleshoot issues with Gemini Cloud Assist investigations | Google Cloud Documentation"
        url: https://docs.cloud.google.com/cloud-assist/investigations

  # ------------------------------------------------------------------ 6
  - id: gcppca-qz-51-06
    objective: "5.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A hospital group must leave its colocation data center in ten weeks, when the contract ends. It runs 350 VMs on VMware vSphere, and its operations team, trained only on VMware, must keep using vCenter, NSX, and its existing runbooks for at least a year. The VMs must move without converting their disks or changing their guest operating systems, and the hospital wants Google to manage the underlying hardware and infrastructure.

        What should you recommend?
    body:
      options:
        - { id: a, text: { en: "Migrate the VMs to Compute Engine with Migrate to Virtual Machines, using test clones and cut-over waves." } }
        - { id: b, text: { en: "Create a Google Cloud VMware Engine private cloud, extend the Layer 2 networks, and move the VMs with VMware HCX." } }
        - { id: c, text: { en: "Install ESXi on Compute Engine VMs that have nested virtualization enabled, and move the VMs there with vMotion." } }
        - { id: d, text: { en: "Migrate the VMs with Migrate to Virtual Machines onto Compute Engine sole-tenant nodes, to keep dedicated hardware." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Google Cloud VMware Engine runs the VMware platform (vSphere, vCenter, vSAN, NSX, HCX) on Google-managed bare metal and is compatible with existing VMware tools, skills, and processes. VMware HCX migrates the VMs as they are (bulk or vMotion) and can extend Layer 2 networks from the data center, which fits the ten-week deadline; modernization can come later.
      options:
        a: { en: "Migrate to Virtual Machines turns the VMs into Compute Engine instances: the team would leave vCenter and NSX, against the requirement." }
        c: { en: "Nested virtualization supports only Linux KVM as the hypervisor, and a self-built platform would not be managed by Google." }
        d: { en: "Sole-tenant nodes still run Compute Engine VMs converted by Migrate to Virtual Machines, so the VMware tooling is lost." }
    references:
      - title: "Google Cloud VMware Engine overview | Google Cloud Documentation"
        url: https://docs.cloud.google.com/vmware-engine/docs/overview
      - title: "Use VMware HCX to migrate VMware VMs | Google Cloud VMware Engine | Google Cloud Documentation"
        url: https://docs.cloud.google.com/vmware-engine/docs/workloads/howto-migrate-vms-using-hcx

  # ------------------------------------------------------------------ 7
  - id: gcppca-qz-51-07
    objective: "5.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A distributor exposes a product catalog API to 200 partner apps through Apigee. Each partner app subscribes to one of two API products, `standard` or `premium`, and the proxy passes the API product name to the on-premises backend, which returns that product's prices. The backend is overloaded by repeated identical requests for product details, which change at most once an hour, and partners accept data up to one hour old. You must reduce the load on the backend without rejecting or delaying any partner request, and each partner must keep receiving the prices of its own API product.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Add a ResponseCache policy with a one-hour expiry and a cache key built only from the product ID, so that all apps share each entry." } }
        - { id: b, text: { en: "Add a SpikeArrest policy to the request PreFlow, with a rate that the backend can sustain during its busiest periods." } }
        - { id: c, text: { en: "Add a ResponseCache policy with a one-hour expiry and a cache key built from the product ID and the API product of the app." } }
        - { id: d, text: { en: "Add a Quota policy that limits each partner app to the number of calls per minute that the backend can sustain." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          ResponseCache stores backend responses and returns them for repeated requests, which reduces the number of calls to the backend and the latency for partners; `TimeoutInSeconds` of 3600 matches the accepted one-hour staleness. The cache key is built from key fragments, so including the API product keeps separate entries for the `standard` and `premium` prices.
      options:
        a: { en: "A key built only from the product ID would serve the prices cached for one API product to partners of the other." }
        b: { en: "SpikeArrest protects the backend by rejecting traffic above the rate, which fails the requirement to reject no request." }
        d: { en: "Quota rejects calls beyond each app's allowance, and identical requests would still all reach the backend." }
    references:
      - title: "ResponseCache policy | Apigee | Google Cloud Documentation"
        url: https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/response-cache-policy

  # ------------------------------------------------------------------ 8
  - id: gcppca-qz-51-08
    objective: "5.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A ticketing company runs its booking API on Cloud Run with a Cloud SQL for PostgreSQL database. Before a major on-sale event, it must prove that the API meets its SLO of 95th-percentile latency under 300 ms at 2,000 requests per second. The test must not affect production users, and its results must reflect how the production system will behave, including the database.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Run the test against the production service during the night, when real traffic is lowest, and stop it if the error rate rises." } }
        - { id: b, text: { en: "Deploy a test copy of the service in a separate project, with the production settings and a database sized and loaded like production." } }
        - { id: c, text: { en: "Replace the database of the test copy with an in-memory stub, so that the measurements isolate the latency of the API code." } }
        - { id: d, text: { en: "Generate the load from Compute Engine VMs with a tool that controls request rate and concurrency, ramping up past 2,000 requests per second." } }
        - { id: e, text: { en: "Create Cloud Monitoring uptime checks with the shortest interval from every available region to generate the test traffic." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Google recommends load testing a deployed test version of the service, with settings such as minimum and maximum instances that match production, and checking downstream dependencies such as the database, which can stop the service from scaling. The load should come from a harness on Compute Engine with a tool whose rate and concurrency you control, repeated at increasing loads, so the results show where the SLO holds.
      options:
        a: { en: "Testing in production risks an outage for real users, even at night, and shares quotas and the database with them." }
        c: { en: "A stub hides the database, which is the dependency most likely to limit scaling; the results would not reflect production." }
        e: { en: "Uptime checks probe availability at intervals; they can't produce a controlled load of 2,000 requests per second." }
    references:
      - title: "Load testing best practices | Cloud Run | Google Cloud Documentation"
        url: https://docs.cloud.google.com/run/docs/about-load-testing

  # ------------------------------------------------------------------ 9
  - id: gcppca-qz-51-09
    objective: "5.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A retailer's `checkout` service on Cloud Run sends 100% of its traffic to the latest revision. For the next release, the QA team must test the new revision with the production service configuration before any customer reaches it. After QA approves, 10% of customers must use the new revision for one day before the full rollout. The team wants the least operational overhead.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Deploy the release with `gcloud run deploy checkout --no-traffic --tag=green`, and give QA the URL of the tag." } }
        - { id: b, text: { en: "Deploy the release with `gcloud run deploy checkout`, then move 90% of the traffic back to the previous revision." } }
        - { id: c, text: { en: "After QA approves, run `gcloud run services update-traffic checkout --to-tags=green=10`." } }
        - { id: d, text: { en: "After QA approves, run `gcloud run services update-traffic checkout --to-latest`." } }
        - { id: e, text: { en: "Deploy the release as a second service, `checkout-green`, and split traffic with weighted load balancer backends." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Deploying with `--no-traffic` and a tag creates the revision in the same service, with the same configuration, but sends it no user traffic; QA tests it directly at the tag's URL. `update-traffic --to-tags=green=10` then sends 10% of the traffic to the tagged revision, and `--to-latest` can complete the rollout the next day. Everything stays in one service, with no extra component.
      options:
        b: { en: "Because the service routes all traffic to the latest revision, the plain deploy gives the release 100% of the traffic before QA has tested it." }
        d: { en: "`--to-latest` sends all traffic to the new revision at once, skipping the one-day 10% phase." }
        e: { en: "A second service and load balancer weights add components to operate, and the copy can drift from the production configuration." }
    references:
      - title: "Rollbacks, gradual rollouts, and traffic migration | Cloud Run | Google Cloud Documentation"
        url: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration

  # ------------------------------------------------------------------ 10
  - id: gcppca-qz-51-10
    objective: "5.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A company runs its web front end on a regional managed instance group (MIG) of 30 VMs spread across three zones of `us-east1`. You must roll out a new instance template, `web-v8`, to all VMs automatically. The number of running VMs must never drop below 30 during the update, the project's remaining quota in the region allows only 3 additional VMs of this machine type, and the update must finish as fast as these constraints allow.

        Which flags should you add to `gcloud compute instance-groups managed rolling-action start-update` with `--version=template=web-v8`?
    body:
      options:
        - { id: a, text: "`--max-surge=1 --max-unavailable=0`" }
        - { id: b, text: "`--max-surge=3 --max-unavailable=0`" }
        - { id: c, text: "`--max-surge=30% --max-unavailable=0`" }
        - { id: d, text: "`--max-surge=3 --max-unavailable=3`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With `maxUnavailable` at 0 and a surge above 0, each old VM is removed only after its replacement is running, so capacity never drops. On a regional MIG, a fixed `maxSurge` must be 0 or at least the number of zones (3), and surge VMs need quota, so 3 is both the only valid value and the fastest one the quota allows.
      options:
        a: { en: "A surge of 1 would be slower than the quota allows, and on a regional MIG with three zones a fixed surge must be 0 or at least 3." }
        c: { en: "30% of 30 VMs is a surge of 9 VMs, which exceeds the quota for 3 additional VMs." }
        d: { en: "These are the regional defaults: up to 3 VMs can be unavailable at once, so the group drops below 30 running VMs." }
    references:
      - title: "Automatically apply VM configuration updates in a MIG | Compute Engine | Google Cloud Documentation"
        url: https://docs.cloud.google.com/compute/docs/instance-groups/rolling-out-updates-to-managed-instance-groups
