chapter: 12-business-tradeoffs
questions:
  # ------------------------------------------------------------------ 1
  - id: gcppca-qz-12-01
    objective: "1.1.7"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A company keeps 1.5 PB of media files in Amazon S3 and is moving them to Cloud Storage. It wants a managed Google Cloud service that copies the objects on a schedule until the cutover date, without installing software in either environment and without setting up a network connection between the two clouds.

        What should you use?
    body:
      options:
        - { id: a, text: { en: "Storage Transfer Service, with a transfer job from the S3 bucket to a Cloud Storage bucket" } }
        - { id: b, text: { en: "BigQuery Data Transfer Service, with a scheduled Amazon S3 transfer configuration" } }
        - { id: c, text: { en: "Datastream, with a stream that reads the S3 bucket and writes to Cloud Storage" } }
        - { id: d, text: { en: "Transfer Appliance, filled with the files after they are downloaded from Amazon S3" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Storage Transfer Service moves data from other clouds, including Amazon S3 and Azure Blob Storage, into Cloud Storage. Transfers from S3 are Google-managed (agentless): you give the service access to the bucket with an access key or a federated AWS role, and you schedule the job; nothing is installed and no private connection is needed.
      options:
        b: { en: "BigQuery Data Transfer Service loads S3 data into BigQuery tables; it doesn't copy media objects into Cloud Storage buckets." }
        c: { en: "Datastream replicates changes from databases; an S3 bucket of files isn't one of its sources." }
        d: { en: "Downloading 1.5 PB first and shipping hardware adds steps and software; a cloud-to-cloud transfer doesn't need an appliance." }
    references:
      - title: "Storage Transfer Service | Google Cloud Documentation"
        url: https://docs.cloud.google.com/storage-transfer/docs/overview
      - title: "Configure access to a source: Amazon S3 | Storage Transfer Service | Google Cloud Documentation"
        url: https://docs.cloud.google.com/storage-transfer/docs/source-amazon-s3

  # ------------------------------------------------------------------ 2
  - id: gcppca-qz-12-02
    objective: "1.1.11"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A compliance officer reviews a new analytics project that stores customer data in Cloud Storage and BigQuery. The company's security policy states that customer data must be encrypted at rest with AES-256; it sets no requirement about who creates, rotates or controls the keys. The team wants to meet the policy with the least effort.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Nothing more: Google Cloud already encrypts this data at rest with AES-256 by default." } }
        - { id: b, text: { en: "Create a Cloud KMS key, and set it as the default CMEK of the bucket and the datasets." } }
        - { id: c, text: { en: "Create keys in Cloud HSM so that hardware modules protect the keys of the bucket and datasets." } }
        - { id: d, text: { en: "Encrypt the files in the clients before upload, and store the keys in Secret Manager." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Google encrypts all customer content at rest without any action from you, at the storage layer with AES-256. Customer-managed keys are needed only when a requirement asks for control over the keys, such as managing rotation or being able to revoke access.
      options:
        b: { en: "CMEK works, but it adds keys to manage that the policy doesn't ask for, so it isn't the least effort." }
        c: { en: "Cloud HSM adds hardware protection of keys, which the policy doesn't require, at extra cost and effort." }
        d: { en: "Client-side encryption adds code and key handling to every client although default encryption already meets the policy." }
    references:
      - title: "Default encryption at rest | Security | Google Cloud Documentation"
        url: https://docs.cloud.google.com/docs/security/encryption/default-encryption

  # ------------------------------------------------------------------ 3
  - id: gcppca-qz-12-03
    objective: "1.1.12"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A Cloud Storage bucket in a production project holds salary files. Internal audit now requires a record of every user and service account that reads these files, from today onward. The project uses the default logging configuration.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Enable the DATA_READ type of Data Access audit logs for Cloud Storage in the project." } }
        - { id: b, text: { en: "Rely on the Admin Activity audit logs, which already record the reads of each object." } }
        - { id: c, text: { en: "Enable VPC Flow Logs on the subnets from which the users and workloads reach the bucket." } }
        - { id: d, text: { en: "Create a sink that routes the project's _Default bucket logs to a BigQuery dataset." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Data Access audit logs are disabled by default for every service except some BigQuery services. Enabling the DATA_READ permission type for Cloud Storage records each API call that reads object data, with the identity of the caller. These logs add volume and can add cost, so enable them only where they are needed.
      options:
        b: { en: "Admin Activity audit logs record configuration and metadata changes, not reads of object data." }
        c: { en: "Flow logs record network connections between IP addresses; they don't record which identity read which object." }
        d: { en: "A sink only routes logs that exist; the reads aren't logged until Data Access audit logs are enabled." }
    references:
      - title: "Enable Data Access audit logs | Cloud Logging | Google Cloud Documentation"
        url: https://docs.cloud.google.com/logging/docs/audit/configure-data-access

  # ------------------------------------------------------------------ 4
  - id: gcppca-qz-12-04
    objective: "1.1.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A manufacturer must leave its co-located data center in four months, when the hosting contract ends. One workload is a vendor's quality-management application that runs on VMware VMs. The company has no access to the source code, and the vendor supports the application only on its current operating systems and configuration. The company plans to modernize other applications after the exit.

        Which migration approach should you choose for this workload?
    body:
      options:
        - { id: a, text: { en: "Rehost the VMs unchanged on Compute Engine with Migrate to Virtual Machines." } }
        - { id: b, text: { en: "Replatform the application into containers on GKE, with its database in Cloud SQL." } }
        - { id: c, text: { en: "Refactor the application to run on Cloud Run and Pub/Sub before it is moved." } }
        - { id: d, text: { en: "Rebuild the application as a cloud-native service, and retire the vendor product." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Rehost (lift and shift) moves a workload with minimal or no changes and is the fastest migration type; it is the option left when you can't refactor a workload. Migrate to Virtual Machines moves VMs from vSphere to Google Cloud, so the vendor's supported configuration is kept and the data center deadline is met.
      options:
        b: { en: "Replatforming changes the runtime and the database, which the vendor doesn't support and which takes longer than rehosting." }
        c: { en: "Refactoring requires changing the code, and the company has no access to the source code." }
        d: { en: "A rewrite can't be delivered in four months, and nothing says that the vendor product should be replaced." }
    references:
      - title: "Migrate to Google Cloud: Get started | Cloud Architecture Center | Google Cloud Documentation"
        url: https://docs.cloud.google.com/architecture/migration-to-gcp-getting-started
      - title: "Migrate to Virtual Machines documentation | Google Cloud Documentation"
        url: https://docs.cloud.google.com/migrate/virtual-machines/docs/5.0/overview

  # ------------------------------------------------------------------ 5
  - id: gcppca-qz-12-05
    objective: "1.1.10"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A finance team is building the business case for moving 200 servers to Google Cloud. Its on-premises cost includes only the depreciation of the server hardware and the software licenses, and it compares this amount with a pricing calculator estimate of the Google Cloud resources. The CFO says that the comparison understates what the company pays today.

        What should the team add to its total cost of ownership model?
    body:
      options:
        - { id: a, text: { en: "The power, cooling, maintenance and support services that the data center provides for the servers" } }
        - { id: b, text: { en: "The average CPU utilization of the servers over the last 12 months, taken from the monitoring tool" } }
        - { id: c, text: { en: "The inbound data transfer charges that Google Cloud applies to the data copied during the migration" } }
        - { id: d, text: { en: "The additional revenue that the company expects from the new products it launches after the move" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A total cost of ownership model compares all the costs of running the workloads, not only hardware and software: Google's assessment guidance names data center operations such as power, cooling, maintenance and other support services. Leaving them out makes the current environment look cheaper than it is.
      options:
        b: { en: "Utilization helps size the target resources, but it is a resource metric, not a cost of the current environment." }
        c: { en: "Inbound data transfer isn't charged, and it would add to the cloud side, not to what the company pays today." }
        d: { en: "Expected revenue is a gain used in a return on investment calculation; it isn't a cost of ownership." }
    references:
      - title: "Migrate to Google Cloud: Assess and discover your workloads | Cloud Architecture Center | Google Cloud Documentation"
        url: https://docs.cloud.google.com/architecture/migration-to-gcp-assessing-and-discovering-your-workloads

  # ------------------------------------------------------------------ 6
  - id: gcppca-qz-12-06
    objective: "1.1.11"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A European bank will store customer data in BigQuery and Cloud Storage. Its regulator requires that the encryption keys are never stored in Google's infrastructure, and the bank's security team wants to allow or refuse each use of a key according to the reason given for the request. The bank already runs a key manager from a partner that Google Cloud supports, and the developers don't want to encrypt data in their own applications.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Create keys in Cloud HSM, use them as CMEK for the datasets and buckets, and review their use in Cloud Audit Logs." } }
        - { id: b, text: { en: "Use Cloud External Key Manager keys as CMEK, and set Key Access Justifications policies in the partner key manager." } }
        - { id: c, text: { en: "Send customer-supplied encryption keys with each request, and enable Access Approval on the projects of the bank." } }
        - { id: d, text: { en: "Use Cloud KMS software keys as CMEK, and enable Access Transparency logs to review each access to the keys." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With Cloud External Key Manager, the key stays in the supported external key manager and is never sent to Google, and BigQuery and Cloud Storage both support CMEK with Cloud EKM keys. With Key Access Justifications, each request carries a reason code, and a policy in the partner key manager allows or denies the request based on it.
      options:
        a: { en: "Cloud HSM keys live in Google-operated hardware modules, which fails the regulator's requirement, and audit logs only record uses after the fact." }
        c: { en: "Customer-supplied keys aren't supported by BigQuery and must be sent by the applications, and Access Approval doesn't filter each key use by its reason." }
        d: { en: "Cloud KMS software keys are stored in Google's infrastructure, and Access Transparency only logs Google staff actions; it can't refuse a request." }
    references:
      - title: "Cloud External Key Manager | Cloud Key Management Service | Google Cloud Documentation"
        url: https://docs.cloud.google.com/kms/docs/ekm

  # ------------------------------------------------------------------ 7
  - id: gcppca-qz-12-07
    objective: "1.1.12"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        The on-call engineers of an e-commerce company receive about 40 pages a week from alerting policies on the CPU utilization, memory usage and VM restarts of the checkout service, and most pages need no action. Twice last quarter, customers couldn't check out for 30 minutes while no alert fired, because the failures came from a dependency. The company wants pages only when customers are affected, early enough to protect a 99.9 % monthly availability target, and slow degradations reported before that target is missed.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Define a request-based availability SLO for the checkout service in Cloud Monitoring, from the ratio of successful requests." } }
        - { id: b, text: { en: "Create a fast-burn and a slow-burn alerting policy on the SLO's error budget, with a short and a long lookback period." } }
        - { id: c, text: { en: "Lower the thresholds of the CPU and memory policies so that engineers are paged before the VM resources are exhausted." } }
        - { id: d, text: { en: "Create an uptime check of the home page from a single region, with an alerting policy that pages after each failed check." } }
        - { id: e, text: { en: "Replace the alerting policies with a dashboard of the service's metrics that the on-call engineers review every hour." } }
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          An SLO built on the share of successful checkout requests measures what customers experience, whatever the cause of the failures. Burn-rate alerting on that SLO pages on a fast consumption of the error budget, with a short lookback, and catches a slow consumption that would exhaust the budget before the end of the period, with a longer lookback.
      options:
        c: { en: "Lower thresholds on resource metrics create even more pages and still miss failures caused by a dependency." }
        d: { en: "A home page check doesn't test checkout, and paging on each failed check from one location is noisy." }
        e: { en: "Hourly manual reviews detect incidents late and give no warning before the monthly target is missed." }
    references:
      - title: "Concepts in service monitoring | Google Cloud Observability | Google Cloud Documentation"
        url: https://docs.cloud.google.com/stackdriver/docs/solutions/slo-monitoring
      - title: "Alerting on your burn rate | Google Cloud Observability | Google Cloud Documentation"
        url: https://docs.cloud.google.com/stackdriver/docs/solutions/slo-monitoring/alerting-on-budget-burn-rate

  # ------------------------------------------------------------------ 8
  - id: gcppca-qz-12-08
    objective: "1.1.8"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A ticketing company sells concert seats to buyers on three continents. A seat must never be sold twice, even when two buyers on different continents select it at the same moment, and sales must continue without manual intervention if one Google Cloud region fails. Event description pages receive 50 times more traffic than purchases; they must load with the lowest latency for users worldwide, and the business accepts that they show changes up to 5 minutes late.

        Which two design choices should you make? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Store the seat inventory in a Spanner multi-region instance, and reserve seats in read-write transactions." } }
        - { id: b, text: { en: "Store the seat inventory in Bigtable clusters on three continents, with multi-cluster routing to the nearest one." } }
        - { id: c, text: { en: "Store the seat inventory in Cloud SQL with high availability, and add a cross-region read replica per continent." } }
        - { id: d, text: { en: "Serve event pages through a global external Application Load Balancer with Cloud CDN, cached for 5 minutes." } }
        - { id: e, text: { en: "Serve event pages from a Memorystore for Redis instance in one region, refreshed from the inventory every 5 minutes." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          The seat inventory needs strong consistency for writes from every continent and an automatic regional failover: Spanner multi-region configurations replicate synchronously across regions, and its read-write transactions prevent double sales. The event pages tolerate 5 minutes of staleness, so caching them at Google's edge with Cloud CDN gives the lowest latency worldwide at a low cost.
      options:
        b: { en: "Replication between Bigtable clusters is eventually consistent, and single-row transactions are never allowed with multi-cluster routing, so two buyers could get the same seat." }
        c: { en: "A single primary prevents double sales, but if its region fails a replica must be promoted manually, which fails the continuity requirement." }
        e: { en: "A single regional cache is far from users on the other continents, so the pages don't get the lowest worldwide latency." }
    references:
      - title: "Regional, dual-region, and multi-region configurations | Spanner | Google Cloud Documentation"
        url: https://docs.cloud.google.com/spanner/docs/instance-configurations
      - title: "App profiles overview | Bigtable | Google Cloud Documentation"
        url: https://docs.cloud.google.com/bigtable/docs/app-profiles

  # ------------------------------------------------------------------ 9
  - id: gcppca-qz-12-09
    objective: "1.1.11"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A retail group has 120 projects in one organization, created over several years in regions on three continents. A new regulation requires that, from next month, every resource of the group is located in the European Union, and the compliance team needs a list of the existing resources outside the EU so that they can be migrated. The group wants the least ongoing effort, including for the projects it will create in the future.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Set the gcp.resourceLocations constraint on the organization with the in:eu-locations value group." } }
        - { id: b, text: { en: "Search all resources of the organization with Cloud Asset Inventory, filtered on their location, to list the existing resources outside the EU." } }
        - { id: c, text: { en: "Create a VPC Service Controls perimeter around all projects so that no data can be stored outside the EU." } }
        - { id: d, text: { en: "Set the gcp.resourceLocations constraint on each existing project, and let it flag resources outside the EU." } }
        - { id: e, text: { en: "Run Sensitive Data Protection discovery on all projects to find resources outside the EU and move them." } }
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          The resource locations constraint set on the organization is inherited by every folder and project, including future ones, and the in:eu-locations value group follows the EU locations that Google adds. The constraint applies only to newly created resources and doesn't identify existing violations. A Cloud Asset Inventory search with the organization as its scope and a query on the location field lists the existing resources outside the EU, which gives the list to migrate.
      options:
        c: { en: "A service perimeter controls API access and data exfiltration; it doesn't decide where resources are created." }
        d: { en: "Per-project policies miss future projects, and the constraint never flags or moves resources that already exist." }
        e: { en: "Sensitive Data Protection finds and de-identifies personal data; it doesn't inventory resource locations or move resources." }
    references:
      - title: "Restrict resource locations | Organization Policy | Google Cloud Documentation"
        url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/defining-locations
      - title: "Search for resources | Cloud Asset Inventory | Google Cloud Documentation"
        url: https://docs.cloud.google.com/asset-inventory/docs/searching-resources

  # ------------------------------------------------------------------ 10
  - id: gcppca-qz-12-10
    objective: "1.1.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A research institute must move a 400 TB archive from its on-premises file servers to Cloud Storage within 8 weeks, when the support contract of its storage arrays ends. Transfers may use at most 500 Mbps of its internet link so that daily work isn't affected, and no new network circuit can be delivered before the deadline. After the move, about 1 TB of new files created on premises each day must reach Cloud Storage every night, with transfers that can be scheduled and monitored.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Copy the archive with Transfer Appliance, then send the new files every night with Storage Transfer Service agents limited to 500 Mbps." } }
        - { id: b, text: { en: "Send both the archive and the new files with Storage Transfer Service agents on premises, with a bandwidth limit of 500 Mbps." } }
        - { id: c, text: { en: "Copy the archive with Transfer Appliance, then ship a new appliance every week with the files created since the last shipment." } }
        - { id: d, text: { en: "Order a Dedicated Interconnect connection, and send the archive and the new files over it with Storage Transfer Service." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          At 500 Mbps, 400 TB takes about 74 days (400 TB × 8 ÷ 0.5 Gbps), beyond the 8-week deadline, and Google recommends Transfer Appliance when an upload would take more than a week; capture and shipping take a few weeks. The nightly 1 TB takes about 4.5 hours at 500 Mbps, so Storage Transfer Service agents, which copy only new or changed files on a schedule, handle it.
      options:
        b: { en: "The archive alone would need about 74 days at 500 Mbps, which misses the 8-week deadline." }
        c: { en: "Weekly shipments can't deliver the new files every night, and they are far more effort than an online transfer that the link can carry." }
        d: { en: "No new circuit can be delivered before the deadline, so the archive still couldn't move in time." }
    references:
      - title: "Transfer Appliance | Google Cloud Documentation"
        url: https://docs.cloud.google.com/transfer-appliance/docs/4.0/overview
      - title: "Manage transfer agents | Storage Transfer Service | Google Cloud Documentation"
        url: https://docs.cloud.google.com/storage-transfer/docs/on-prem-overview
