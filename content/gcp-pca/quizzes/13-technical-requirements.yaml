chapter: 13-technical-requirements
questions:
  # ------------------------------------------------------------------ 1
  - id: gcppca-qz-13-01
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The architecture review board of a logistics company wants to start every design review with a short checklist built from the five core principles of the Google Cloud Well-Architected Framework, the principles that apply to every pillar.

        Which principle belongs on this checklist?
    body:
      options:
        - { id: a, text: { en: "Take advantage of horizontal scalability" } }
        - { id: b, text: { en: "Promote modular design" } }
        - { id: c, text: { en: "Decouple your architecture" } }
        - { id: d, text: { en: "Optimize resource usage" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The five core principles of the Well-Architected Framework are design for change, document your architecture, simplify your design and use fully managed services, decouple your architecture, and use a stateless architecture. They apply across all six pillars, unlike the principles listed inside each pillar.
      options:
        a: { en: "Horizontal scalability is a principle of the reliability pillar, not one of the five core principles that apply to every pillar." }
        b: { en: "Modular design is a principle of the performance optimization pillar; the cross-pillar principle on the same theme is to decouple your architecture." }
        d: { en: "Optimizing resource usage is a principle of the cost optimization pillar (and of sustainability), not a core principle." }
    references:
      - title: Google Cloud Well-Architected Framework
        url: https://docs.cloud.google.com/architecture/framework

  # ------------------------------------------------------------------ 2
  - id: gcppca-qz-13-02
    objective: "1.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A company runs its order database on a Cloud SQL for MySQL instance with high availability enabled. A new reporting tool runs long read-only queries during business hours, and these queries slow down the application. A developer suggests sending the reports to the standby instance in the other zone, which is kept up to date.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Point the reporting tool at the standby instance, because synchronous replication keeps its data current." } }
        - { id: b, text: { en: "Create a read replica of the primary instance, and point the reporting tool at the read replica." } }
        - { id: c, text: { en: "Trigger a failover each morning so that the reports run on the former primary instance." } }
        - { id: d, text: { en: "Disable high availability, and use the freed standby capacity to run the reporting queries." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In a Cloud SQL high availability configuration, the standby instance exists only to take over during a failover and cannot be used for read queries. A read replica is the Cloud SQL feature that serves read-only traffic, so the reports no longer compete with the application on the primary instance.
      options:
        a: { en: "The standby instance cannot serve read queries; it only becomes usable after a failover." }
        c: { en: "After a failover, the former primary becomes the standby, which still serves no queries, and each failover makes the database unavailable for about a minute." }
        d: { en: "Disabling high availability removes zone-failure protection and does not create an instance that can serve reads." }
    references:
      - title: About high availability
        url: https://docs.cloud.google.com/sql/docs/mysql/high-availability

  # ------------------------------------------------------------------ 3
  - id: gcppca-qz-13-03
    objective: "1.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A company runs its web tier on N2 VMs and an image recognition service on a single G2 VM with an attached NVIDIA L4 GPU, in the same zone. During a recent host maintenance event, the web tier kept running, but the recognition service was stopped and restarted.

        What should you do so that the recognition service keeps serving during host maintenance events?
    body:
      options:
        - { id: a, text: { en: "Set the host maintenance policy of the G2 VM to live migrate, as on the N2 VMs." } }
        - { id: b, text: { en: "Run several G2 VMs in a regional managed instance group behind a load balancer." } }
        - { id: c, text: { en: "Change the G2 VM to a machine type with more GPUs so that maintenance completes faster." } }
        - { id: d, text: { en: "Recreate the G2 VM as a Spot VM so that Compute Engine moves it before maintenance." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          VMs with attached GPUs can't be live migrated: Compute Engine stops them for host maintenance, after a notice. Running several GPU VMs in a regional managed instance group behind a load balancer means that one VM stopping for maintenance doesn't stop the service, while the N2 VMs keep benefiting from live migration.
      options:
        a: { en: "GPU VMs must be set to stop (and optionally restart) during host maintenance; live migration is not available for them." }
        c: { en: "Any VM with GPUs attached is stopped for host maintenance, whatever the number of GPUs." }
        d: { en: "Spot VMs can be stopped at any time to reclaim capacity and are not live migrated either, so availability gets worse." }
    references:
      - title: Live migration process during maintenance events
        url: https://docs.cloud.google.com/compute/docs/instances/live-migration-process

  # ------------------------------------------------------------------ 4
  - id: gcppca-qz-13-04
    objective: "1.2.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An online retailer has registered its checkout system as an App Hub application. The checkout frontend runs on Cloud Run in the project `shop-web`, and its Cloud SQL database runs in the project `shop-data`. Gemini Cloud Assist is set up in both projects, and the company has a Premium Support contract. After a release, checkout requests fail intermittently. The on-call engineer wants one AI-assisted root-cause analysis that examines the logs, metrics and configuration of both the service and the database.

        What should the engineer do?
    body:
      options:
        - { id: a, text: { en: "Grant the engineer the Admin basic role on both projects, and create a Gemini Cloud Assist investigation in `shop-web`." } }
        - { id: b, text: { en: "Create a Gemini Cloud Assist investigation whose scope is the checkout App Hub application." } }
        - { id: c, text: { en: "Create a Gemini Cloud Assist investigation in `shop-data`, and attach the Cloud Run logs to it as a log sink." } }
        - { id: d, text: { en: "Open the App Hub application in the console, and ask Gemini Cloud Assist to generate Terraform code that redeploys it." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A Gemini Cloud Assist investigation is limited to one project or to one App Hub application, and an application-level investigation can analyze resources spread across several projects. Scoping the investigation to the checkout application lets it correlate the Cloud Run service and the Cloud SQL database in a single analysis, with observations and hypotheses about the root cause. Gemini Cloud Assist is a Preview offering.
      options:
        a: { en: "An investigation created in a project stays limited to that project; broader roles don't widen its scope, and Admin breaks least privilege." }
        c: { en: "A project-scoped investigation in `shop-data` doesn't cover the Cloud Run service, and investigations don't take log sinks as inputs." }
        d: { en: "Generating Infrastructure as Code redeploys the resources but doesn't analyze logs and metrics to find the root cause." }
    references:
      - title: Troubleshoot issues with Gemini Cloud Assist investigations
        url: https://docs.cloud.google.com/cloud-assist/investigations

  # ------------------------------------------------------------------ 5
  - id: gcppca-qz-13-05
    objective: "1.2.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A company is retiring an internal application whose data is in a Cloud SQL for MySQL instance with automated daily backups. Auditors require that the data can be restored for one year after the retirement. The company wants to stop paying for the instance and doesn't want to manage any other storage resource or export process.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Delete the instance, and rely on its automated backups, which stay available after the instance is deleted." } }
        - { id: b, text: { en: "Stop the instance, and start it again only when the auditors ask for the data to be restored." } }
        - { id: c, text: { en: "Delete the instance, and choose to take a final backup with a retention period of 365 days." } }
        - { id: d, text: { en: "Export the database to a bucket with a one-year retention policy, and then delete the instance." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A final backup is taken when you delete a Cloud SQL instance, and its retention can be set from 1 to 365 days for standard backups (30 days by default). The instance stops costing money, and the data stays restorable for the required year without any bucket or export job to manage.
      options:
        a: { en: "After an instance is deleted, its automated backups are deleted on a rolling basis, one backup per day, so they don't cover a year." }
        b: { en: "A stopped instance still incurs charges, for example for its storage, so the company keeps paying for the instance." }
        d: { en: "An export works, but it creates a bucket and an export process to manage, which the company wants to avoid." }
    references:
      - title: Cloud SQL backups overview
        url: https://docs.cloud.google.com/sql/docs/mysql/backup-recovery/backups

  # ------------------------------------------------------------------ 6
  - id: gcppca-qz-13-06
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A fintech company runs its payment APIs on a GKE Standard cluster whose control plane is in `us-central1-a` and whose node pool has nodes in `us-central1-a`, `us-central1-b` and `us-central1-c`. During an outage of `us-central1-a`, the Pods on the other nodes kept serving, but the team could neither deploy a fix nor change the node pool until the zone recovered. The cluster must remain a Standard cluster because a security agent runs as a privileged DaemonSet.

        The company wants deployments and cluster changes to keep working during a zone outage, without using another region, and with the least operational overhead. What should you do?
    body:
      options:
        - { id: a, text: { en: "Add `us-central1-f` to the node locations of the cluster, and enable node auto-repair on the node pool." } }
        - { id: b, text: { en: "Change the location type of the cluster from zonal to regional with the `gcloud container clusters update` command." } }
        - { id: c, text: { en: "Create a second zonal cluster with its control plane in `us-central1-b`, and split traffic with a multi-cluster Gateway." } }
        - { id: d, text: { en: "Create a regional Standard cluster in `us-central1`, move the workloads to it, and then delete the current cluster." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The current cluster is a multi-zonal cluster: its nodes span three zones, but a zonal cluster has a single control plane in one zone, so the cluster can't be configured while that zone is down. A regional cluster replicates the control plane across several zones of the region. Because a zonal cluster can't become a regional cluster, you create a regional cluster and migrate the workloads to it.
      options:
        a: { en: "More node zones keep workloads running, which already happened; the single control plane still stays in `us-central1-a`." }
        b: { en: "A zonal cluster can't be converted into a regional cluster after creation; a new cluster is required." }
        c: { en: "Two clusters can keep deployments possible, but they double the clusters to operate and add multi-cluster networking, which is more overhead than one regional cluster." }
    references:
      - title: About cluster configuration choices
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/types-of-clusters
      - title: Regional clusters
        url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/regional-clusters

  # ------------------------------------------------------------------ 7
  - id: gcppca-qz-13-07
    objective: "1.2.7"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A retailer's order database runs on a Spanner regional instance with the default version retention period. During an incident review, the team found that an engineer who holds the Cloud Spanner Database Admin role nearly dropped the production database instead of a test database. The company now requires that an accidental drop of the production database is blocked and that, if the database is lost anyway, it can be recreated with data no more than 12 hours old. The company wants managed Spanner features only, with no export pipeline to operate.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Increase the version retention period to 7 days so that point-in-time recovery can bring back a dropped database." } }
        - { id: b, text: { en: "Enable database deletion protection on the production database with the `gcloud spanner databases update` command." } }
        - { id: c, text: { en: "Move the database to a multi-region instance configuration so that a copy of the data survives in another region." } }
        - { id: d, text: { en: "Create a backup schedule that takes a full backup of the production database every 12 hours." } }
        - { id: e, text: { en: "Export the database to Cloud Storage every 12 hours with a Dataflow template that Cloud Scheduler starts." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Database deletion protection (`--enable-drop-protection`) prevents users and service accounts that have the drop permission from deleting the database by accident. Point-in-time recovery doesn't protect against a deleted database, so a backup schedule provides the recovery path: a backup continues to exist after its source database is deleted, and a full backup every 12 hours meets the 12-hour limit. Restoring a backup creates a new database.
      options:
        a: { en: "Version retention keeps earlier versions inside the live database; point-in-time recovery doesn't protect against deleting the database itself." }
        c: { en: "Replicas in other regions belong to the same database: dropping the database removes it everywhere." }
        e: { en: "Exports allow a recovery, but they add a pipeline to operate, which the company excludes, while backup schedules are a managed Spanner feature." }
    references:
      - title: Prevent accidental database deletion
        url: https://docs.cloud.google.com/spanner/docs/prevent-database-deletion
      - title: Backups overview
        url: https://docs.cloud.google.com/spanner/docs/backup

  # ------------------------------------------------------------------ 8
  - id: gcppca-qz-13-08
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A game studio runs its matchmaking servers in a managed instance group that autoscales on CPU utilization. A new VM needs about 6 minutes to load game data before it can serve. When players start tournaments, load rises in bursts that last a few minutes and come back every 20 to 40 minutes, at times that nobody can plan, on any day. After each burst, the autoscaler removes most of the VMs it added, and the next burst overloads the group while new VMs initialize.

        The studio wants to keep enough VMs between bursts and still let the group shrink when load stays low for hours. What should you do?
    body:
      options:
        - { id: a, text: { en: "Enable predictive autoscaling so that the group adds VMs ahead of each forecast burst." } }
        - { id: b, text: { en: "Create scaling schedules that raise the minimum group size during the hours of the bursts." } }
        - { id: c, text: { en: "Lower the target CPU utilization of the autoscaler from 70% to 30% for the group." } }
        - { id: d, text: { en: "Configure scale-in controls that limit how many VMs the group can remove within 60 minutes." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Scale-in controls set a maximum allowed reduction from the group's peak size within a trailing time window, so the autoscaler never scales in faster than that rate. With a 60-minute window, most VMs added for a burst stay through the gap before the next one, and the group still shrinks gradually when load stays low for hours. Google recommends them for workloads that take a long time to initialize.
      options:
        a: { en: "Predictive autoscaling forecasts daily and weekly patterns only and doesn't predict one-time events or patterns shorter than 10 minutes, so unplanned bursts aren't forecast." }
        b: { en: "Schedules need known times, and the bursts happen at times that nobody can plan." }
        c: { en: "A lower target adds VMs all the time, but the autoscaler still scales in between bursts based on the low load, so the next burst still waits for VMs to initialize." }
    references:
      - title: Understand autoscaler decisions
        url: https://docs.cloud.google.com/compute/docs/autoscaler/understanding-autoscaler-decisions
      - title: Scaling based on predictions
        url: https://docs.cloud.google.com/compute/docs/autoscaler/predictive-autoscaling

  # ------------------------------------------------------------------ 9
  - id: gcppca-qz-13-09
    objective: "1.2.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A logistics company's shipment database runs on a Spanner instance with the `nam7` multi-region configuration, whose read-write regions are Iowa (`us-central1`) and Northern Virginia (`us-east4`), with the default leader in `us-central1`. The company has moved its write-heavy dispatch services to `us-east4`, next to a partner's systems, and they must stay there. Since the move, commit latency for these services has increased.

        The database must keep its multi-region configuration, and the company doesn't want to move the data to another instance. What should you do to reduce write latency for the dispatch services?
    body:
      options:
        - { id: a, text: { en: "Add read-only replicas in `us-east4` to the instance so that the dispatch services commit locally." } }
        - { id: b, text: { en: "Set the `default_leader` option of the database to `us-east4` with an `ALTER DATABASE` statement." } }
        - { id: c, text: { en: "Add compute capacity to the instance so that it processes the commits from `us-east4` faster." } }
        - { id: d, text: { en: "Use bounded stale reads in the dispatch services so that their transactions avoid the leader." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In a multi-region configuration, the leader region handles all database writes, and Google advises placing write-heavy compute in or near the default leader region. You can move the leader to the other read-write region of the configuration with `ALTER DATABASE ... SET OPTIONS (default_leader = 'us-east4')`, which keeps the multi-region configuration and the data in place.
      options:
        a: { en: "Read-only replicas don't take part in write quorums: they help reads, not commits." }
        c: { en: "More nodes or processing units add throughput, but the round trip from `us-east4` to a leader in `us-central1` stays the same." }
        d: { en: "Stale reads lower the latency of reads only; the dispatch services' writes still go through the leader region." }
    references:
      - title: Regional, dual-region, and multi-region configurations
        url: https://docs.cloud.google.com/spanner/docs/instance-configurations
      - title: Modify the leader region of a database
        url: https://docs.cloud.google.com/spanner/docs/modifying-leader-region

  # ------------------------------------------------------------------ 10
  - id: gcppca-qz-13-10
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A ticketing company runs its event API on Cloud Run with a maximum of 1,000 instances. Each instance keeps a pool of 5 connections to a Cloud SQL for PostgreSQL instance whose `max_connections` flag is 1,000. During a ticket sale, the service scaled to 400 instances, the database refused new connections, and errors spread to every endpoint. About 90% of the requests read seat availability, which can be up to 5 seconds old; the others buy tickets and must write to the database.

        The company must keep database connections below the database limit with headroom, keep seat availability reads fast during sales, and add no Cloud SQL instance or flag change. Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Set the maximum number of instances of the service to 150." } }
        - { id: b, text: { en: "Set the minimum number of instances of the service to 150 before each sale." } }
        - { id: c, text: { en: "Cache seat availability in Memorystore for Valkey with a 5-second expiration, and serve these reads from the cache." } }
        - { id: d, text: { en: "Create a Cloud SQL read replica, and send the seat availability reads to the replica." } }
        - { id: e, text: { en: "Raise the `max_connections` flag to 2,500 so that the database accepts the connections of all instances." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          A maximum number of instances limits the connections that Cloud Run opens to a backing service: 150 instances × 5 connections = 750, which leaves headroom because the maximum can be exceeded briefly during traffic spikes. With fewer instances, reads must stop reaching the database: caching seat availability in Memorystore for Valkey for 5 seconds serves most requests from memory, so the capped service keeps answering them quickly.
      options:
        b: { en: "A minimum number of instances keeps instances warm but sets no ceiling, so the service can still scale past what the database accepts." }
        d: { en: "A read replica is an additional Cloud SQL instance, which the company excludes." }
        e: { en: "Changing the flag is excluded, and the database still has no protection against the next, larger peak." }
    references:
      - title: Set maximum instances for services
        url: https://docs.cloud.google.com/run/docs/configuring/max-instances
      - title: Memorystore for Valkey overview
        url: https://docs.cloud.google.com/memorystore/docs/valkey/product-overview
