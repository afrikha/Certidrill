chapter: 15-migration-future
questions:
  # ------------------------------------------------------------------ 1
  - id: gcppca-qz-15-01
    objective: "1.4.3"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        During a migration to Google Cloud, a platform team sets up identity management, the organization's folders and projects, and the shared networking that every migrated workload will use. The team also ranks the applications into prioritized migration waves.

        In which phase of Google's migration framework does this work take place?
    body:
      options:
        - { id: a, text: { en: "Assess" } }
        - { id: b, text: { en: "Plan" } }
        - { id: c, text: { en: "Deploy" } }
        - { id: d, text: { en: "Optimize" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The Plan phase builds the foundation, often called the landing zone: identity, resource hierarchy and networking. It also sorts the applications and sets a prioritized migration strategy. Workloads land in this foundation during the Deploy phase.
      options:
        a: { en: "Assess produces the inventory, the dependency map, the TCO and the performance baselines; it doesn't build infrastructure." }
        c: { en: "Deploy moves workloads and data into a foundation that must already exist; it may refine that foundation but doesn't create it." }
        d: { en: "Optimize improves workloads after they run in Google Cloud (autoscaling, managed services, cost, disaster recovery)." }
    references:
      - title: "Migrate to Google Cloud: Get started"
        url: https://docs.cloud.google.com/architecture/migration-to-gcp-getting-started

  # ------------------------------------------------------------------ 2
  - id: gcppca-qz-15-02
    objective: "1.5.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A training company is building a new course booking web application with a cloud-first approach. Traffic is close to zero at night and reaches ten times the daytime average during enrollment campaigns. The company does not want to manage servers or pay for idle capacity.

        Which design should you recommend?
    body:
      options:
        - { id: a, text: { en: "Compute Engine VMs sized for the campaign peak, behind an external Application Load Balancer" } }
        - { id: b, text: { en: "A managed instance group with a fixed size that matches the average daytime traffic" } }
        - { id: c, text: { en: "Container images deployed as Cloud Run services that scale with incoming requests" } }
        - { id: d, text: { en: "A GKE Standard cluster with a node pool sized for the campaign peak" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Cloud-first design starts from managed, autoscaled services and pays for use instead of sizing for the peak. Cloud Run services add instances as requests arrive, can scale to zero when idle, and with request-based billing charge only while requests are processed. There are no servers to manage.
      options:
        a: { en: "Sizing for the peak is the traditional habit: the VMs sit mostly idle at night and still have to be managed and patched." }
        b: { en: "A fixed-size group can't absorb ten times the average during campaigns, and it still runs servers that must be managed." }
        d: { en: "Node pools sized for the peak waste capacity most of the time, and GKE Standard nodes are managed by the company." }
    references:
      - title: About instance autoscaling in Cloud Run services
        url: https://docs.cloud.google.com/run/docs/about-instance-autoscaling
      - title: Google Cloud Well-Architected Framework
        url: https://docs.cloud.google.com/architecture/framework

  # ------------------------------------------------------------------ 3
  - id: gcppca-qz-15-03
    objective: "1.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A company migrated an ERP application server from vSphere with Migrate to Virtual Machines. The cut-over finished two weeks ago, the new Compute Engine instance has passed acceptance testing, and the team has decided that it will not roll back. The project still incurs storage charges for the data that the migration replicated.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Pause the replication of the migration so that no new replicated data is stored" } }
        - { id: b, text: { en: "Delete the test-clone instances that were created before the cut-over" } }
        - { id: c, text: { en: "Delete the source VM in vSphere so that its disks are no longer replicated" } }
        - { id: d, text: { en: "Finalize the migration so that its replication data and storage are deleted" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Finalize is the last step of the migration lifecycle and applies to VMs in the Cut-Over state. It deletes all replication data and its storage, which stops the storage charges, and leaves the production instance in place. After it, the migration can no longer be rolled back from the replicated data.
      options:
        a: { en: "Replication already stopped at the cut-over; pausing it doesn't delete the replication data that is still billed." }
        b: { en: "Test clones are separate Compute Engine instances; deleting them stops their own charges but leaves the replication storage." }
        c: { en: "The source VM is on premises: deleting it doesn't remove the replicated data stored in Google Cloud." }
    references:
      - title: VM migration process
        url: https://docs.cloud.google.com/migrate/virtual-machines/docs/5.0/discover/lifecycle

  # ------------------------------------------------------------------ 4
  - id: gcppca-qz-15-04
    objective: "1.4.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A bank is moving 200 Red Hat Enterprise Linux servers to Compute Engine. It holds RHEL subscriptions that are eligible for Red Hat Cloud Access and that run for three more years. The bank wants to keep using these subscriptions, must not pay Google Cloud for RHEL licenses, and wants the lowest infrastructure cost.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Enable Compute Engine in Red Hat Cloud Access, then create default-tenancy VMs from the RHEL BYOS images" } }
        - { id: b, text: { en: "Enable Compute Engine in Red Hat Cloud Access, then create VMs from the RHEL BYOS images on sole-tenant nodes" } }
        - { id: c, text: { en: "Create default-tenancy VMs from the RHEL premium images, then buy a 3-year commitment for the RHEL licenses" } }
        - { id: d, text: { en: "Create default-tenancy VMs from the RHEL premium images, then register them with the bank's own subscriptions" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          With RHEL BYOS images (project rhel-byos-cloud), the bank pays Red Hat for the subscriptions and Google Cloud only for the infrastructure. The images become usable once Compute Engine is enabled in Red Hat Cloud Access for a Google group. Linux BYOS with RHEL or SLES doesn't require sole-tenant nodes, so ordinary multi-tenant VMs are the cheapest option.
      options:
        b: { en: "Sole-tenant nodes are needed for licenses tied to physical cores, not for RHEL BYOS; paying for whole nodes raises the infrastructure cost." }
        c: { en: "Premium images bill the RHEL license with the VM; a commitment lowers that charge but the bank still pays Google for RHEL." }
        d: { en: "Registering a premium-image VM with Red Hat doesn't remove the license billed with its image, so the bank would pay for RHEL twice." }
    references:
      - title: Create a VM using a RHEL BYOS image
        url: https://docs.cloud.google.com/compute/docs/instances/create-rhel-byos-vm
      - title: Bring your own licenses
        url: https://docs.cloud.google.com/compute/docs/nodes/bringing-your-own-licenses

  # ------------------------------------------------------------------ 5
  - id: gcppca-qz-15-05
    objective: "1.5.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        After a lift-and-shift migration, a retailer runs six nightly batch scripts from crontab on a dedicated Compute Engine VM. Each script finishes in less than 40 minutes and can be packaged as a container, and the VM is idle for the rest of the day. The operations team wants to stop patching and managing the VM and to pay only while the scripts run.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Attach an instance schedule to the VM so that it starts before the scripts and stops after them" } }
        - { id: b, text: { en: "Package each script as a Cloud Run job and trigger the jobs from Cloud Scheduler on the same schedule" } }
        - { id: c, text: { en: "Recreate the VM as a Spot VM and keep the same crontab entries to run the scripts every night" } }
        - { id: d, text: { en: "Deploy a Cloud Run service with one minimum instance whose code runs the scripts on a timer" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Cloud Run jobs run containers to completion and are billed only while they execute, with no server to patch. Cloud Scheduler replaces crontab: it calls the job's run endpoint on a cron schedule with a service account that can invoke the job. This is the "cron jobs on a VM" improvement of the Optimize phase.
      options:
        a: { en: "An instance schedule cuts the idle hours, but the team still has to patch and manage the VM." }
        c: { en: "A Spot VM is cheaper but can be preempted mid-run, and it is still a VM that the team manages." }
        d: { en: "A minimum instance is billed even when no request arrives, so the company pays all day for a nightly workload." }
    references:
      - title: Execute jobs on a schedule
        url: https://docs.cloud.google.com/run/docs/execute/jobs-on-schedule

  # ------------------------------------------------------------------ 6
  - id: gcppca-qz-15-06
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A distributor will keep its on-premises Oracle order database in production for two more years while it builds a new analytics platform on BigQuery. The data center connects to a VPC network through Partner Interconnect. Analysts need the order tables in BigQuery with changes visible within minutes.

        The database team forbids extra query load on the production database and does not want to operate any replication software or servers. What should you recommend?
    body:
      options:
        - { id: a, text: { en: "Run Oracle GoldenGate on Compute Engine VMs that capture the changes and write them into BigQuery tables" } }
        - { id: b, text: { en: "Export the order tables with Data Pump every night to Cloud Storage and load the files into BigQuery" } }
        - { id: c, text: { en: "Create a Datastream stream from the Oracle database to BigQuery that uses private connectivity to the VPC network" } }
        - { id: d, text: { en: "Run a Database Migration Service continuous job to Cloud SQL for PostgreSQL and query it from BigQuery" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Datastream is a serverless change data capture service: it reads changes from the database logs with minimal impact on the source and replicates them to BigQuery in near real time. Its private connectivity uses a VPC peering connection that also reaches sources connected through VPN or Interconnect. Nothing is installed or operated by the database team, and the source stays in production.
      options:
        a: { en: "GoldenGate on VMs can replicate the changes, but it is replication software on servers that the team would have to operate." }
        b: { en: "A nightly export misses the within-minutes freshness, and a full export adds load to the production database." }
        d: { en: "Database Migration Service moves a database to a new primary before a cutover; its destination is Cloud SQL, not BigQuery, so it isn't a feed of the live Oracle tables into BigQuery." }
    references:
      - title: Datastream overview
        url: https://docs.cloud.google.com/datastream/docs/overview

  # ------------------------------------------------------------------ 7
  - id: gcppca-qz-15-07
    objective: "1.4.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        An insurer plans to move its on-premises Oracle claims database, which has hundreds of PL/SQL procedures, to AlloyDB for PostgreSQL before its Oracle licenses expire. Before the steering committee approves a migration date, it wants to know which schema and code objects convert automatically and which ones need manual rework.

        No table data may be copied out of the production database during this assessment. What should you do first?
    body:
      options:
        - { id: a, text: { en: "Run a one-time Database Migration Service job to a test AlloyDB cluster, and count the procedures that fail after the data is loaded" } }
        - { id: b, text: { en: "Create a Database Migration Service conversion workspace for the Oracle database, convert the schema, and review the objects with conversion issues" } }
        - { id: c, text: { en: "Run the Migration Center discovery client on the database servers, and read the code conversion effort from the TCO report" } }
        - { id: d, text: { en: "Create a Datastream stream from the Oracle database to BigQuery, and rewrite the PL/SQL logic as BigQuery SQL to test it" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A Database Migration Service conversion workspace connects to the Oracle database through a connection profile, pulls a snapshot of the schema, and converts the schema and code objects to PostgreSQL syntax without any migration job, so no table rows are copied. The objects that don't convert cleanly show conversion issues that the team can fix in the workspace, which gives the committee its estimate of the manual rework.
      options:
        a: { en: "A migration job copies the table data out of the production database, which the assessment must not do, and it is a migration rather than an assessment of the code." }
        c: { en: "Migration Center inventories assets and compares the costs of target products; it doesn't convert PL/SQL code or report which objects need rework." }
        d: { en: "Datastream replicates table data, which the assessment must not copy, and BigQuery isn't the PostgreSQL-compatible target that the code must run on." }
    references:
      - title: Create a conversion workspace and convert schema
        url: https://docs.cloud.google.com/database-migration/docs/oracle-to-alloydb/create-conversion-workspace
      - title: Oracle to AlloyDB for PostgreSQL migration overview
        url: https://docs.cloud.google.com/database-migration/docs/oracle-to-alloydb

  # ------------------------------------------------------------------ 8
  - id: gcppca-qz-15-08
    objective: "1.5.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A logistics company runs its tracking platform in one region, in a project whose resources were created by hand in the Google Cloud console. Its VPC network is in auto mode. The three-year plan calls for launching in four new countries, each requiring an in-country deployment within two weeks of the decision, and for acquiring regional carriers whose on-premises networks will be connected to Google Cloud.

        Which two changes should you recommend so that the design absorbs these business changes? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Describe the platform as Terraform modules that take the region as an input, and deploy them through a CI/CD pipeline." } }
        - { id: b, text: { en: "Keep the auto mode network, because it creates a subnet automatically in each new region that Google Cloud opens." } }
        - { id: c, text: { en: "Write a detailed runbook of the console steps used for the first deployment, so that each country repeats them." } }
        - { id: d, text: { en: "Move to custom mode VPC networks whose ranges come from an IP plan that keeps free blocks for regions and acquisitions." } }
        - { id: e, text: { en: "Reserve Compute Engine capacity now in every candidate region, so that each future country starts on running VMs." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Regionally deployable infrastructure as code turns a new country into a parameter change that a pipeline applies in hours, without drift between deployments. A custom mode network drawn from an IP plan with reserved space avoids overlaps with the carriers' networks; auto mode ranges are fixed and shared, and can overlap with connected on-premises networks.
      options:
        b: { en: "Auto mode ranges come from one fixed block that can overlap with the acquired carriers' networks, and Google recommends custom mode for production." }
        c: { en: "Repeating manual console steps is slow and error-prone; it doesn't guarantee identical deployments within two weeks." }
        e: { en: "Reserving capacity years ahead in regions that may never be used pays for idle resources and doesn't address addressing or repeatability." }
    references:
      - title: Best practices and reference architectures for VPC design
        url: https://docs.cloud.google.com/architecture/best-practices-vpc-design

  # ------------------------------------------------------------------ 9
  - id: gcppca-qz-15-09
    objective: "1.4.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A media company is migrating 120 on-premises VMs to Compute Engine over the next six months. Eighty of them run steady 24/7 services that will stay on N2 machines in europe-west1 for at least three years; their sizes were copied from the on-premises servers and are believed to be oversized. The other 40 run nightly rendering jobs that checkpoint their progress and can be restarted.

        Finance wants the lowest compute cost without committing to capacity that the company will not use. Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Buy a 3-year resource-based commitment now for the vCPUs and memory of the 80 VMs, as sized on premises." } }
        - { id: b, text: { en: "Run the 80 steady VMs as Spot VMs, and let a managed instance group recreate them after each preemption." } }
        - { id: c, text: { en: "Run the rendering jobs on Spot VMs, and let the jobs resume from their last checkpoint after a preemption." } }
        - { id: d, text: { en: "Buy a Compute flexible commitment sized to the spend of the rendering VMs so that their nightly runs are discounted." } }
        - { id: e, text: { en: "Rightsize the 80 VMs with machine type recommendations after migration, then buy a 3-year resource-based commitment." } }
    answer: { optionIds: [c, e] }
    explanation:
      correct:
        en: |
          Interruptible, restartable batch work is the use case for Spot VMs, which use excess capacity at a large discount. For the steady services, rightsizing first (recommendations are based on the previous 8 days of metrics) and committing afterward avoids paying for oversized capacity, because a commitment can't be cancelled once bought; a 3-year resource-based commitment fits VMs that stay on one series in one region.
      options:
        a: { en: "Committing now locks in the oversized on-premises sizes for three years, and the commitment can't be cancelled." }
        b: { en: "Spot VMs can be preempted at any time, which steady 24/7 services can't tolerate." }
        d: { en: "Compute flexible commitments can't be used for Spot or preemptible VMs, and a nightly workload isn't steady spend to commit to." }
    references:
      - title: Committed use discounts (CUDs) for Compute Engine
        url: https://docs.cloud.google.com/compute/docs/instances/committed-use-discounts-overview
      - title: Apply machine type recommendations to VM instances
        url: https://docs.cloud.google.com/compute/docs/instances/apply-machine-type-recommendations-for-instances

  # ------------------------------------------------------------------ 10
  - id: gcppca-qz-15-10
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        An insurer serves its customer portal, portal.example.com, from an on-premises monolith that is connected to a VPC network through Dedicated Interconnect, with global dynamic routing. The team has rewritten the quotes feature, under /quotes/, as a Cloud Run service and will replace the other features one at a time.

        Customers must keep the same hostname and URLs, Cloud Armor must protect every path, the monolith must not be exposed on the internet, and moving a feature must require no application code change. What should you do?
    body:
      options:
        - { id: a, text: { en: "Point portal.example.com at the Cloud Run service, and have the service forward non-quote requests to the monolith over Direct VPC egress." } }
        - { id: b, text: { en: "Create a global external Application Load Balancer with a serverless NEG for /quotes/ and an internet NEG for the monolith's public IP address." } }
        - { id: c, text: { en: "Create a Cloud DNS weighted round robin record for portal.example.com that sends part of the traffic to the Cloud Run service." } }
        - { id: d, text: { en: "Create a global external Application Load Balancer with a serverless NEG for /quotes/ and a hybrid connectivity NEG for all other paths." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          This is the strangler fig pattern: a global external Application Load Balancer keeps the hostname, and its URL map sends /quotes/ to a backend service with a serverless NEG and every other path to a backend service with a hybrid connectivity NEG that reaches the monolith over the Interconnect. Cloud Armor policies attach to both backend services. Moving the next feature is a URL map change, with no code change.
      options:
        a: { en: "All traffic would flow through the new service, and every later move would need a routing code change in it." }
        b: { en: "An internet NEG reaches the monolith through a public IP address, which exposes it on the internet." }
        c: { en: "DNS splits whole requests by weight, not by URL path, so quote and non-quote requests would both reach either backend." }
    references:
      - title: Hybrid connectivity network endpoint groups overview
        url: https://docs.cloud.google.com/load-balancing/docs/negs/hybrid-neg-concepts
      - title: Serverless network endpoint groups overview
        url: https://docs.cloud.google.com/load-balancing/docs/negs/serverless-neg-concepts
