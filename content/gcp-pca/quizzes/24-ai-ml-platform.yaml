chapter: 24-ai-ml-platform
questions:
  # ------------------------------------------------------------------ 1
  - id: gcppca-qz-24-01
    objective: "2.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A data science team runs its training workflow on Agent Platform Pipelines several times a week with different learning rates and batch sizes. The team wants to group these pipeline runs and compare their hyperparameters and evaluation metrics side by side to pick the best model.

        Which Agent Platform feature should the team use?
    body:
      options:
        - { id: a, text: { en: "Agent Platform Model Registry, with one model version registered for each run." } }
        - { id: b, text: { en: "Agent Platform Experiments, with each pipeline run linked to an experiment." } }
        - { id: c, text: { en: "Agent Platform Feature Store, with one feature view for each run." } }
        - { id: d, text: { en: "Agent Platform Model Monitoring, with one monitoring job for each run." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Agent Platform Experiments (formerly Vertex AI Experiments) groups experiment runs so that you can compare models trained with different architectures, hyperparameters and training environments. A pipeline run can be associated with an experiment or an experiment run, which is how hyperparameter variations of the same pipeline are compared.
      options:
        a: { en: "Model Registry stores and versions trained models for deployment; it does not compare the parameters and metrics of the runs that produced them." }
        c: { en: "Feature Store manages and serves feature values for training and inference; feature views have nothing to do with comparing training runs." }
        d: { en: "Model Monitoring watches deployed models for skew and drift in production; it does not compare training runs." }
    references:
      - title: Introduction to Gemini Enterprise Agent Platform Experiments | Google Cloud Documentation
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/experiments/intro-vertex-ai-experiments
      - title: Introduction to Gemini Enterprise Agent Platform Pipelines | Google Cloud Documentation
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/pipelines/introduction

  # ------------------------------------------------------------------ 2
  - id: gcppca-qz-24-02
    objective: "2.5.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A dating app lets members upload profile photos. Before a photo is published, the app must flag photos that are likely to contain adult or violent content. The company has no machine learning team and does not want to train a model.

        Which service should the app call for each uploaded photo?
    body:
      options:
        - { id: a, text: { en: "The Cloud Natural Language API, with text moderation of the photo caption." } }
        - { id: b, text: { en: "Document AI, with an OCR processor that reads the text in the photo." } }
        - { id: c, text: { en: "The Cloud Vision API, with SafeSearch detection on the photo." } }
        - { id: d, text: { en: "The Video Intelligence API, with explicit content detection on the photo." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          SafeSearch detection in the Cloud Vision API is a prebuilt feature that returns, for an image, the likelihood of five categories: adult, spoof, medical, violence and racy. The app can reject or hold photos whose likelihood is high, without training anything.
      options:
        a: { en: "Text moderation analyzes text; it never looks at the pixels of the photo, so an explicit photo with a harmless caption passes." }
        b: { en: "An OCR processor extracts text from documents and images; it does not classify the visual content of a photo." }
        d: { en: "The Video Intelligence API analyzes video files, not single photos, and it is deprecated, so it is not a choice for a new design." }
    references:
      - title: Detect explicit content (SafeSearch) | Cloud Vision API | Google Cloud Documentation
        url: https://docs.cloud.google.com/vision/docs/detecting-safe-search

  # ------------------------------------------------------------------ 3
  - id: gcppca-qz-24-03
    objective: "2.4.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A retailer serves its recommendation model on eight GPU VMs in one zone, 24 hours a day, and plans to keep this exact configuration for the next three years. When the VMs are recreated during updates or autohealing, the GPUs must be available. The company wants the lowest cost over the three years.

        Which consumption option should you recommend?
    body:
      options:
        - { id: a, text: { en: "Spot VMs for the eight serving VMs, recreated by the managed instance group after each preemption." } }
        - { id: b, text: { en: "On-demand VMs for the eight serving VMs, without any reservation or commitment." } }
        - { id: c, text: { en: "A standard reservation for the eight VMs, attached to a 3-year resource-based committed use discount." } }
        - { id: d, text: { en: "A future reservation in calendar mode for the eight VMs, requested again every 90 days for three years." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Standard reservations give very high capacity assurance with no time limit and are meant for critical production workloads; reservations are billed at the on-demand rate, and committed use discounts apply on top of them. Commitments that include GPUs require attached reservations with the same GPU numbers and types, so a reservation attached to a 3-year commitment both guarantees the GPUs and gives the lowest price for a steady three-year load.
      options:
        a: { en: "Spot VMs are best effort and can be preempted at any time, so GPUs may be missing when the VMs must be recreated; they are not suited to serving that must stay available." }
        b: { en: "On-demand VMs without a reservation get capacity on a best-effort basis when they are recreated, and they pay the full on-demand price for three years." }
        d: { en: "Calendar mode reserves capacity for at most 90 days for planned runs; repeated requests are not assured to be fulfilled and do not suit an unlimited, steady serving load." }
    references:
      - title: Consumption options for AI Hypercomputer | Google Cloud Documentation
        url: https://docs.cloud.google.com/ai-hypercomputer/docs/consumption-models
      - title: About reservations | Compute Engine | Google Cloud Documentation
        url: https://docs.cloud.google.com/compute/docs/instances/reservations-overview

  # ------------------------------------------------------------------ 4
  - id: gcppca-qz-24-04
    objective: "2.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An insurer will train a churn model on BigQuery tables that contain customer email addresses and phone numbers. Data scientists must not see these values, but the training data must still join the records of the same customer across tables. The compliance team must be able to recover the original customer identity for a flagged record.

        What should you do before the data reaches the training dataset?
    body:
      options:
        - { id: a, text: { en: "Pseudonymize the identifier columns with Sensitive Data Protection by using deterministic encryption with a Cloud KMS wrapped key." } }
        - { id: b, text: { en: "Pseudonymize the identifier columns with Sensitive Data Protection by using cryptographic hashing with a Cloud KMS wrapped key." } }
        - { id: c, text: { en: "Mask the identifier columns with Sensitive Data Protection by replacing every character with an asterisk." } }
        - { id: d, text: { en: "Encrypt the training dataset with a customer-managed encryption key that only the compliance team controls." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Deterministic encryption (AES-SIV) replaces each value with a token that is the same every time for the same input and key, so tables still join on the token. The token can be reversed with the cryptographic key, which lets the compliance team re-identify a flagged customer while the data scientists only see tokens.
      options:
        b: { en: "Cryptographic hashing keeps referential integrity, but it creates a one-way token: the compliance team could never recover the original identity." }
        c: { en: "Masking every character makes all values look the same, which breaks the joins, and the original value cannot be recovered." }
        d: { en: "CMEK protects data at rest, but anyone who is allowed to query the dataset still reads the email addresses and phone numbers in clear text." }
    references:
      - title: Pseudonymization | Sensitive Data Protection | Google Cloud Documentation
        url: https://docs.cloud.google.com/sensitive-data-protection/docs/pseudonymization

  # ------------------------------------------------------------------ 5
  - id: gcppca-qz-24-05
    objective: "2.5.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A travel company wants to add a conversational trip-planning agent to its public mobile app, used by millions of customers who are not company employees. The agent must call the company's booking APIs as tools and keep the conversation state between turns. The company wants a managed runtime with the least operational overhead.

        What should you recommend?
    body:
      options:
        - { id: a, text: { en: "Build the agent in Gemini Enterprise Workflow Builder and share it with the accounts of the app's customers." } }
        - { id: b, text: { en: "Build the agent with the Agent Development Kit, deploy it to Agent Runtime, and call it from the app's backend." } }
        - { id: c, text: { en: "Load the booking catalog into a Gemini Notebook for business notebook and share the notebook with the customers." } }
        - { id: d, text: { en: "Build the agent with the Agent Development Kit and run it on a managed instance group behind a load balancer." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Agent Runtime (formerly Agent Engine) is the fully managed Agent Platform service that deploys, operates and scales agents in production, with sessions to keep the conversation state. An ADK agent hosted there can call the booking APIs as tools and be called from the app's backend for any customer.
      options:
        a: { en: "Gemini Enterprise is the app for the organization's own users, with licenses assigned by its administrators; it is not a runtime for a customer-facing product." }
        c: { en: "Notebooks answer from uploaded sources, cannot call booking APIs, and can be shared only with users of the same project, never with the public." }
        d: { en: "The agent would work, but the team would have to operate, patch and scale VMs and build the session storage, which fails the least-overhead requirement." }
    references:
      - title: Scale your agents | Gemini Enterprise Agent Platform | Google Cloud Documentation
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale
      - title: What is Gemini Enterprise? | Google Cloud Documentation
        url: https://docs.cloud.google.com/gemini/enterprise/docs/overview

  # ------------------------------------------------------------------ 6
  - id: gcppca-qz-24-06
    objective: "2.4.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A research institute will train a model on 16 GPU VMs for about 12 days. The training code writes a checkpoint to Cloud Storage every 30 minutes, and the job orchestrator restarts the job from the latest checkpoint when VMs disappear. There is no deadline, and the institute accepts that the run might take longer than planned. The institute's main requirement is to minimize the cost of the run.

        Which consumption option should you recommend?
    body:
      options:
        - { id: a, text: { en: "Flex-start VMs for the 16 VMs, requested once for the whole run." } }
        - { id: b, text: { en: "Spot VMs for the 16 VMs, recreated as capacity becomes available." } }
        - { id: c, text: { en: "A future reservation in calendar mode for the 16 VMs and the 12 days." } }
        - { id: d, text: { en: "A standard reservation for the 16 VMs with a 1-year committed use discount." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Spot VMs give the deepest discount, up to 91 % off the on-demand price for GPUs, in exchange for possible preemption and best-effort capacity. Frequent checkpoints and automatic restarts make the training fault tolerant, and the absence of a deadline means interruptions only lengthen the run, so Spot meets the cost requirement best.
      options:
        a: { en: "Flex-start VMs run for at most seven days, so one request cannot cover a 12-day run, and their discount (up to 53 %) is smaller than Spot." }
        c: { en: "Calendar mode buys assured capacity for a planned date at a smaller discount than Spot; the institute does not need assurance, only the lowest cost." }
        d: { en: "A 1-year commitment charges for the GPUs for a full year to run a 12-day job, which is far from the lowest cost." }
    references:
      - title: Compute Engine instances provisioning models | Google Cloud Documentation
        url: https://docs.cloud.google.com/compute/docs/instances/provisioning-models
      - title: Spot VMs | Compute Engine | Google Cloud Documentation
        url: https://docs.cloud.google.com/compute/docs/instances/spot

  # ------------------------------------------------------------------ 7
  - id: gcppca-qz-24-07
    objective: "2.4.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A logistics company runs 150 Apache Airflow DAGs on a self-managed VM. Every night they load data from on-premises SFTP servers into Cloud Storage and BigQuery. The company is adding a demand forecasting model, retrained after each nightly load, and its ML team requires the lineage of every model in ML Metadata and the comparison of runs in Experiments. The company wants managed services and minimal changes to the existing DAGs.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Move the existing DAGs to Managed Service for Apache Airflow, and add a final task that submits the training pipeline run." } }
        - { id: b, text: { en: "Rewrite the existing DAGs as Kubeflow pipelines, and run all of them on Agent Platform Pipelines as one orchestrator." } }
        - { id: c, text: { en: "Write the training workflow with the Kubeflow Pipelines SDK, and run it on Agent Platform Pipelines." } }
        - { id: d, text: { en: "Add the training steps as Airflow tasks in the existing DAGs, and write each run's metrics to a log file in Cloud Storage." } }
        - { id: e, text: { en: "Install Kubeflow Pipelines on a GKE Standard cluster, and start the training workflow from Cloud Scheduler." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Managed Service for Apache Airflow (formerly Cloud Composer) is the fully managed Airflow service, so the 150 DAGs move with minimal changes, and a final task can submit the training run after the nightly load. Agent Platform Pipelines runs Kubeflow Pipelines workflows serverlessly, stores the parameters and artifacts of each run in ML Metadata for lineage, and lets runs be associated with Experiments for comparison.
      options:
        b: { en: "Rewriting 150 working DAGs contradicts the minimal-changes requirement; Agent Platform Pipelines is meant for ML workflows, not for general data orchestration." }
        d: { en: "Airflow tasks alone record neither ML Metadata lineage nor Experiments comparisons; a log file in Cloud Storage does not meet the ML team's requirement." }
        e: { en: "A self-managed Kubeflow installation on GKE has to be operated and upgraded by the company, which fails the managed-services requirement." }
    references:
      - title: Introduction to Gemini Enterprise Agent Platform Pipelines | Google Cloud Documentation
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/pipelines/introduction
      - title: Managed Airflow overview | Managed Service for Apache Airflow | Google Cloud Documentation
        url: https://docs.cloud.google.com/composer/docs/composer-3/composer-overview

  # ------------------------------------------------------------------ 8
  - id: gcppca-qz-24-08
    objective: "2.5.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A European manufacturer has a Gemini Enterprise app in the eu multi-region. Its developers built a finance agent with the Agent Development Kit, with custom Python tools, and deployed it on Agent Runtime in us-central1 in another project. Employees must use the agent from the Gemini Enterprise web app, and the agent must query BigQuery with each employee's own permissions. The developers will not rewrite the agent.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Redeploy the agent on Agent Runtime in a europe region, and register it in the app as a custom agent via Agent Runtime." } }
        - { id: b, text: { en: "Register the existing us-central1 deployment in the app, and grant the cross-project permissions that registration needs." } }
        - { id: c, text: { en: "Create an OAuth 2.0 client and an authorization with the BigQuery scope, and reference it when you register the agent." } }
        - { id: d, text: { en: "Grant the agent's service account the BigQuery Data Viewer role on every dataset that employees are allowed to query." } }
        - { id: e, text: { en: "Rebuild the agent in Workflow Builder so that it runs inside the app with the identity of each employee." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Admins register ADK agents hosted on Agent Runtime as custom agents, even from another project, but the Agent Runtime location must match the app's location: an eu app accepts only agents in europe regions. To act for each user, the registration references an authorization that holds an OAuth 2.0 client with the scopes of the APIs to call, so the agent queries BigQuery with the consent and permissions of the signed-in employee.
      options:
        b: { en: "Cross-project registration is allowed, but an app in the eu multi-region cannot use an agent deployed in a us region." }
        d: { en: "A service account role gives every employee the same access through the agent, not each employee's own permissions." }
        e: { en: "Workflow Builder builds no-code agents; rebuilding the agent there drops the custom Python tools and breaks the no-rewrite constraint." }
    references:
      - title: Register and manage ADK agents hosted on Agent Runtime | Gemini Enterprise | Google Cloud Documentation
        url: https://docs.cloud.google.com/gemini/enterprise/docs/register-and-manage-an-adk-agent
      - title: Agents overview | Gemini Enterprise | Google Cloud Documentation
        url: https://docs.cloud.google.com/gemini/enterprise/docs/agents-overview

  # ------------------------------------------------------------------ 9
  - id: gcppca-qz-24-09
    objective: "2.4.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A bank will train and serve a credit model on Agent Platform from BigQuery data staged in a Cloud Storage bucket. The regulator requires the data, the models and the endpoints to stay in europe-west4. The bank must control the encryption keys of the training jobs, models, endpoints and staged data and be able to revoke them. A user with valid credentials must not be able to copy training data or models to a project outside the bank's organization.

        Which three actions should you take? Choose three.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Create the BigQuery dataset, the bucket, the training jobs and the endpoints in europe-west4." } }
        - { id: b, text: { en: "Create a europe-west4 key ring, use its key on the bucket and the Agent Platform resources, and grant the service agents access." } }
        - { id: c, text: { en: "Create a key ring in the europe multi-region so that a single key protects the bucket and all the Agent Platform resources." } }
        - { id: d, text: { en: "Add the project to a VPC Service Controls perimeter that restricts the Agent Platform, BigQuery and Cloud Storage APIs." } }
        - { id: e, text: { en: "Add VPC egress firewall rules that deny traffic from the training jobs and endpoints to IP addresses outside of Europe." } }
        - { id: f, text: { en: "Enable CMEK on the Agent Platform resources only, since the staging bucket then inherits the same key." } }
    answer: { optionIds: [a, b, d] }
    explanation:
      correct:
        en: |
          Keeping every resource in europe-west4 meets residency. Agent Platform training supports CMEK only when the resource and the key use the same region, and CMEK on Agent Platform does not configure other products, so the bucket gets the key separately and the service agents need the CryptoKey Encrypter/Decrypter role. A VPC Service Controls perimeter keeps training data and models from leaving the protected projects even for users with valid credentials.
      options:
        c: { en: "The key ring of an Agent Platform resource cannot be dual-regional, multi-regional or global: training needs a key in the same region as the resource." }
        e: { en: "Firewall rules filter IP traffic from the VPC; they do not stop a user from copying data or models to another project through Google APIs." }
        f: { en: "Enabling CMEK for Agent Platform does not automatically configure CMEK for other Google Cloud products: the bucket would keep default encryption." }
    references:
      - title: CMEK | Gemini Enterprise Agent Platform | Google Cloud Documentation
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/cmek
      - title: VPC Service Controls with Gemini Enterprise Agent Platform | Google Cloud Documentation
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/vpc-service-controls

  # ------------------------------------------------------------------ 10
  - id: gcppca-qz-24-10
    objective: "2.5.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A health insurer has fine-tuned an open model from Model Garden and will self-deploy it to an Agent Platform endpoint in a project inside a VPC Service Controls perimeter. It is called by services on GKE and by an on-premises claims system connected through Cloud Interconnect. The endpoint must not be reachable from the internet, must stream tokens to the callers, and must accept requests that run for up to five minutes.

        Which type of endpoint should you create?
    body:
      options:
        - { id: a, text: { en: "A dedicated public endpoint, with IAM permissions on the endpoint limited to the callers' service accounts." } }
        - { id: b, text: { en: "A shared public endpoint, with an access level that admits only the callers' IP ranges." } }
        - { id: c, text: { en: "A dedicated private endpoint based on Private Service Connect, reached from the VPC and on-premises." } }
        - { id: d, text: { en: "A private services access endpoint, reached through VPC Network Peering with the VPC." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A dedicated private endpoint based on Private Service Connect is a recommended endpoint type for production: it is private, supports VPC Service Controls, allows private communication from on-premises, supports streaming and accepts request timeouts of up to one hour. It is the only option that meets every stated requirement.
      options:
        a: { en: "A dedicated public endpoint is reachable from the internet and does not support VPC Service Controls; the documentation points to a dedicated private endpoint instead." }
        b: { en: "A shared public endpoint is exposed to the internet, does not stream responses and times out after 60 seconds." }
        d: { en: "A private services access endpoint is private, but it does not support streaming and times out after 60 seconds." }
    references:
      - title: Choose an endpoint type | Gemini Enterprise Agent Platform | Google Cloud Documentation
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/predictions/choose-endpoint-type
      - title: VPC Service Controls with Gemini Enterprise Agent Platform | Google Cloud Documentation
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/vpc-service-controls
