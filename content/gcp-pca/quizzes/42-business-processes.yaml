chapter: 42-business-processes
questions:
  # ------------------------------------------------------------------ 1
  - id: gcppca-qz-42-01
    objective: "4.2.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A company runs three groups of Compute Engine VMs for the whole month, with no committed use discounts: a group of N1 VMs, a group of N2 VMs, and a group of E2 VMs. The finance team asks which of these VMs receive sustained use discounts on the monthly bill.

        What should you answer?
    body:
      options:
        - { id: a, text: { en: "All three groups receive an automatic discount of up to 30%, because every VM ran for the whole month." } }
        - { id: b, text: { en: "None of the groups receive a discount, because sustained use discounts must be purchased for 1 or 3 years." } }
        - { id: c, text: { en: "The N1 and N2 groups receive automatic discounts, of up to 30% and 20%, and the E2 group receives none." } }
        - { id: d, text: { en: "Only the E2 group receives an automatic discount, because E2 is the cost-optimized machine series." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Sustained use discounts apply automatically, with nothing to buy, to resources that run for more than 25% of the month, and only for the listed series: up to 30% for N1 and up to 20% for N2, N2D, and C2 when the VMs run the whole month. E2 and newer series are not on the list, so the E2 group is billed without this discount. Usage covered by committed use discounts would not receive them either.
      options:
        a: { en: "E2 VMs are not eligible, and the 30% maximum applies to N1 (and M1, M2), not to N2, whose maximum is 20%." }
        b: { en: "That describes committed use discounts; sustained use discounts are applied automatically without any purchase." }
        d: { en: "E2 has low list prices but is not an eligible series; N1 and N2 are the groups that receive the discount." }
    references:
      - title: "Sustained use discounts | Compute Engine | Google Cloud Documentation"
        url: https://docs.cloud.google.com/compute/docs/sustained-use-discounts

  # ------------------------------------------------------------------ 2
  - id: gcppca-qz-42-02
    objective: "4.2.7"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An insurance company has a disaster recovery plan that restores its claims applications in a second Google Cloud region. During a review, the COO asks where the company documents how call-center staff keep handling claims during an outage, how customers and the regulator are informed, and which manual workarounds apply until the systems are back.

        Which document should cover these points?
    body:
      options:
        - { id: a, text: { en: "The disaster recovery runbook that the operations team follows for the regional failover." } }
        - { id: b, text: { en: "The business continuity plan, of which the disaster recovery plan is only one part." } }
        - { id: c, text: { en: "The service level objectives document that defines the targets of the claims applications." } }
        - { id: d, text: { en: "The post-incident review template that the SRE team completes after each major outage." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Google describes disaster recovery as a subset of business continuity planning. The disaster recovery plan restores IT systems and data; the business continuity plan also covers people, roles, communication with customers and regulators, suppliers, and the manual workarounds that keep the business running during and after the disruption.
      options:
        a: { en: "The DR runbook covers the technical failover steps; staff operations and external communication belong to the broader continuity plan." }
        c: { en: "SLOs set reliability targets for the applications; they don't describe how the business operates during an outage." }
        d: { en: "A post-incident review analyzes an outage after the fact; it is not the plan that tells staff what to do during one." }
    references:
      - title: "Disaster recovery planning guide | Cloud Architecture Center | Google Cloud Documentation"
        url: https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide

  # ------------------------------------------------------------------ 3
  - id: gcppca-qz-42-03
    objective: "4.2.4"
    difficulty: 1
    status: draft
    type: multi
    stem:
      en: |
        A data platform team is writing its first architecture decision record (ADR), about its choice between Bigtable and BigQuery for storing device telemetry. The team lead wants the ADR to follow the outline that Google's Architecture Center suggests.

        Which two items should the ADR contain? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The context and the problem to solve, with the functional and non-functional requirements." } }
        - { id: b, text: { en: "The Terraform state file of the resources that were deployed after the decision was made." } }
        - { id: c, text: { en: "The main options that were considered, the chosen option, and the reasons for the choice." } }
        - { id: d, text: { en: "The step-by-step runbook that on-call engineers follow when the chosen database fails." } }
        - { id: e, text: { en: "The full recordings of the design meetings in which the team discussed the options." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Google's suggested ADR outline includes the author and team, the context and problem, the functional and non-functional requirements, any affected critical user journey, the main options considered, and the chosen option with the reasons for it. An ADR is short: it records why a decision was made so that later readers can understand it.
      options:
        b: { en: "Terraform state describes deployed resources and can contain sensitive values; it records what exists, not why it was chosen." }
        d: { en: "Operational runbooks are separate documents; the ADR records the decision and its reasoning, not operating procedures." }
        e: { en: "Meeting recordings are not a decision record; the ADR summarizes the options and the reasons in a short document." }
    references:
      - title: "Architecture decision records overview | Cloud Architecture Center | Google Cloud Documentation"
        url: https://docs.cloud.google.com/architecture/architecture-decision-records

  # ------------------------------------------------------------------ 4
  - id: gcppca-qz-42-04
    objective: "4.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A retailer's e-commerce team of four developers has packaged a stateless HTTP API as a container image. Nobody on the team has Kubernetes experience, the company has no dedicated operations staff for this product, and the API must be in production in six weeks. Traffic is close to zero at night and spikes during promotions.

        Which platform should you recommend for the API?
    body:
      options:
        - { id: a, text: { en: "GKE Autopilot, so that Google manages the nodes while the team writes and maintains the Kubernetes manifests." } }
        - { id: b, text: { en: "GKE Standard with the cluster autoscaler, so that the team controls the node pools and their upgrades." } }
        - { id: c, text: { en: "A managed instance group of Compute Engine VMs that run the container, with autoscaling on CPU usage." } }
        - { id: d, text: { en: "Cloud Run, so that the container runs without any cluster to manage and scales with requests, down to zero." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The team's skills and the lack of operations staff decide: Cloud Run is a fully managed platform where you don't create a cluster or manage infrastructure, and it scales with incoming requests, down to zero when there is no traffic. The team deploys its existing container image and needs no Kubernetes knowledge to meet the six-week deadline.
      options:
        a: { en: "Autopilot removes node management, but the team must still learn and operate Kubernetes objects, a skill it doesn't have." }
        b: { en: "GKE Standard adds node pool, upgrade, and autoscaling management to the Kubernetes learning curve: the most overhead of the options." }
        c: { en: "VMs need OS images, patching, and instance templates to maintain, and they don't scale to zero at night." }
    references:
      - title: "What is Cloud Run | Google Cloud Documentation"
        url: https://docs.cloud.google.com/run/docs/overview/what-is-cloud-run

  # ------------------------------------------------------------------ 5
  - id: gcppca-qz-42-05
    objective: "4.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A software startup is building its first product on Google Cloud, and the product will not be in production for another eight months. The developers want to open technical support cases about the issues they find during development and testing, and a response during business hours is acceptable. The startup wants to keep its support costs as low as possible.

        Which Customer Care offering should you recommend?
    body:
      options:
        - { id: a, text: { en: "Basic Support" } }
        - { id: b, text: { en: "Standard Support" } }
        - { id: c, text: { en: "Enhanced Support" } }
        - { id: d, text: { en: "Premium Support" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Standard Support is the offering Google recommends for workloads under development: it gives unlimited access to technical support with business-hours (8/5) response for high-impact issues, at the lowest price of the paid offerings. The startup can move to Enhanced or Premium Support when the product reaches production.
      options:
        a: { en: "Basic Support includes documentation, community forums, billing assistance, and Active Assist, but no technical support cases." }
        c: { en: "Enhanced Support is designed for production workloads with 24/7 response, which the startup doesn't need yet and costs more." }
        d: { en: "Premium Support targets enterprise-critical workloads, with a Technical Account Manager and the highest minimum fee." }
    references:
      - title: Customer Care
        url: https://cloud.google.com/support

  # ------------------------------------------------------------------ 6
  - id: gcppca-qz-42-06
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A regional bank plans to move its loan-processing platform to Google Cloud. The CISO's team was not involved in the design so far, and it says it will block the go-live because it doubts that customer data can be protected as the bank's security policies require. The executive sponsor wants the security team to support the design within two months, without any lowering of the bank's security requirements.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Ask the executive sponsor to instruct the security team to approve the design, because the go-live date is fixed by the business case." } }
        - { id: b, text: { en: "Send the security team Google Cloud's third-party audit reports, such as ISO/IEC 27001 and SOC 2, and ask it to approve the design on that basis." } }
        - { id: c, text: { en: "Map each of the bank's security policy requirements to Google Cloud controls, and validate them with the security team in a proof-of-concept landing zone." } }
        - { id: d, text: { en: "Migrate the workloads that hold no customer data first, and involve the security team later, when the customer data is ready to be moved." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Influencing a blocking stakeholder means addressing its own concerns with evidence: mapping each policy requirement to concrete controls (IAM, organization policies, VPC Service Controls, CMEK, audit logs) and letting the security team verify them in a proof of concept against agreed criteria. Under the shared responsibility model, the customer remains responsible for its access policies and data, so the team needs to see how the bank's configuration meets its policies.
      options:
        a: { en: "Escalating to authority doesn't resolve the security concerns, and it fails the goal of obtaining the security team's support." }
        b: { en: "Audit reports cover Google's infrastructure controls; the bank stays responsible for its own access policies and data configuration." }
        d: { en: "Postponing the security team's involvement repeats the original mistake and leaves the customer data design unvalidated." }
    references:
      - title: "Shared responsibilities and shared fate on Google Cloud | Cloud Architecture Center | Google Cloud Documentation"
        url: https://docs.cloud.google.com/architecture/framework/security/shared-responsibility-shared-fate

  # ------------------------------------------------------------------ 7
  - id: gcppca-qz-42-07
    objective: "4.2.6"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A university gives each of its 40 student teams a Google Cloud project for a one-semester course. The teams deploy Cloud Run services and keep their datasets in Cloud Storage. Each team's Cloud Run spending must stop growing automatically when it reaches $200 in a month, the team's Cloud Storage data must stay available, and the IT department does not want to write or maintain any code. A small overage caused by enforcement delays is acceptable.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Create a $200 budget for each project with alert thresholds at 50%, 90%, and 100%, and send the alerts to the team members and the instructor." } }
        - { id: b, text: { en: "Create a $200 budget for each project with Pub/Sub notifications that trigger a function to disable billing on the project at 100%." } }
        - { id: c, text: { en: "Set a quota on the number of Cloud Run instances in each project, sized so that the monthly Cloud Run cost cannot exceed $200." } }
        - { id: d, text: { en: "Create a $200 spend cap budget for the Cloud Run service in each project, so that new Cloud Run usage is paused at the cap." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A spend cap budget (generally available since October 2026 for Gemini API, Gemini Enterprise Agent Platform, Cloud Run, and Cloud Run functions) covers one service in one project and pauses all new usage of that service when estimated costs exceed the amount. Other services, such as Cloud Storage, are not affected, no code is needed, and the cap is lifted at the start of the next month. Enforcement is not instant, which the small accepted overage covers.
      options:
        a: { en: "An alerts-only budget notifies people but doesn't cap usage or spending, so Cloud Run costs keep growing." }
        b: { en: "This needs custom code to write and maintain, and disabling billing stops every paid service in the project, including Cloud Storage." }
        c: { en: "Quotas limit capacity, not monthly spending: a few instances running all month can still exceed $200, and peaks may be refused early." }
    references:
      - title: "Manage spend cap budgets | Cloud Billing | Google Cloud Documentation"
        url: https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps
      - title: "Create, edit, or delete budgets and budget alerts | Cloud Billing | Google Cloud Documentation"
        url: https://docs.cloud.google.com/billing/docs/how-to/budgets

  # ------------------------------------------------------------------ 8
  - id: gcppca-qz-42-08
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A payments company releases its Cloud Run services through Cloud Build and Cloud Deploy. Every production release waits for the weekly meeting of a change advisory board (CAB), so changes accumulate into large, risky releases. Auditors require segregation of duties: no engineer may put their own change into production without approval from another person. The CTO wants releases to reach production on the day they are ready, following DORA's research on change approval.

        What should you recommend?
    body:
      options:
        - { id: a, text: { en: "Keep the CAB but have it meet every day, so that each release waits at most one day for the board's approval before production." } }
        - { id: b, text: { en: "Set `requireApproval: true` on the production target, and grant `roles/clouddeploy.approver` only to the members of the CAB." } }
        - { id: c, text: { en: "Let engineers deploy their own changes once all automated tests pass, and have the CAB review the deployment logs every week." } }
        - { id: d, text: { en: "Require an approving review by another engineer on each pull request, recorded in the repository, and let the pipeline promote tested changes." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          DORA found that external approval bodies such as CABs hurt software delivery performance without lowering change failure rates, and recommends peer review during development, backed by automated testing. A required approving review by someone other than the author, recorded in the development platform, gives auditors the segregation-of-duties evidence while the pipeline promotes each tested change the same day.
      options:
        a: { en: "A daily CAB is still a heavyweight external approval, which DORA links to lower delivery performance and no fewer failures." }
        b: { en: "This moves the same external board into Cloud Deploy: the approval still depends on the CAB instead of peer review in development." }
        c: { en: "Engineers would release their own changes without another person's approval, which breaks the segregation-of-duties requirement." }
    references:
      - title: "DevOps capabilities | Google Cloud Documentation"
        url: https://docs.cloud.google.com/architecture/devops
      - title: "Automate and manage change | Cloud Architecture Center | Google Cloud Documentation"
        url: https://docs.cloud.google.com/architecture/framework/operational-excellence/automate-and-manage-change

  # ------------------------------------------------------------------ 9
  - id: gcppca-qz-42-09
    objective: "4.2.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        An online travel company finished migrating its booking platform to Google Cloud, and the program reported success: all 600 VMs moved on schedule and within budget. Six months later, the CEO points out that the business case promised faster booking pages and a lower infrastructure cost per booking, and asks whether the migration delivered them. Nobody can answer, because these values were never measured. You must set up how success is managed in the optimization phase that follows, as Google's migration guidance recommends.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Report the Google Cloud SLAs of the products that the platform uses as the latency and availability results of the booking platform." } }
        - { id: b, text: { en: "Draft measurable goals for each optimization iteration from the business case, such as an SLO for page latency and a cost per booking." } }
        - { id: c, text: { en: "Track the number of migrated VMs and the share of the migration budget consumed as the success measures of the next phases." } }
        - { id: d, text: { en: "Measure a baseline of these goals now, repeat the measurements after each iteration, and review the results with the business owners." } }
        - { id: e, text: { en: "Alert on VMs whose CPU utilization exceeds 70%, and report the number of these alerts each month as the main performance measure." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Google's optimization guidance starts each iteration with clearly measurable goals, for example SLOs measured by SLIs, and extends monitoring to establish a baseline that is compared after each change. Tying those goals to the outcomes of the business case and reviewing the repeated measurements with the business owners is what lets the company show whether the migration delivered value.
      options:
        a: { en: "Product SLAs are Google's commitments for each service, not a measurement of the booking pages that the users experience." }
        c: { en: "VM counts and budget consumption measure project delivery, which already looked successful; they say nothing about the promised outcomes." }
        e: { en: "CPU is a server-centric metric: high CPU doesn't mean slow pages, and it doesn't measure cost per booking." }
    references:
      - title: "Migrate to Google Cloud: Optimize your environment | Cloud Architecture Center | Google Cloud Documentation"
        url: https://docs.cloud.google.com/architecture/migration-to-google-cloud-optimizing-your-environment

  # ------------------------------------------------------------------ 10
  - id: gcppca-qz-42-10
    objective: "4.2.7"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A logistics company runs its dispatch application on a regional managed instance group of 40 N2 VMs in `europe-west1`. Its business continuity plan requires recovery in `europe-west4` within 30 minutes of a regional outage, even if many other customers fail over to that region at the same time. Because the application's license is charged for each running VM, the standby group in `europe-west4` runs only 2 VMs and is resized to 40 during a failover. The standby project's N2 CPU quota in `europe-west4` covers only the 2 running VMs, and finance accepts paying for capacity that stays idle until a failover.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Purchase a 3-year resource-based commitment for the vCPUs and memory of 38 N2 VMs in `europe-west4`." } }
        - { id: b, text: { en: "Request a quota increase so that the standby project's N2 CPU quota in `europe-west4` covers 40 VMs." } }
        - { id: c, text: { en: "Raise the maximum size of the standby group's autoscaler to 40, so that it adds VMs as soon as traffic arrives." } }
        - { id: d, text: { en: "Create reservations for 38 N2 VMs in the zones of `europe-west4` that the standby group uses." } }
        - { id: e, text: { en: "Configure the standby group to create Spot VMs during a failover, so that the 38 extra VMs cost less." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Reservations give a high level of assurance that the specified zonal capacity is available until they are deleted, which protects the plan when many customers fail over at once; reserved capacity is billed whether or not VMs use it, which finance accepts, and it is not a running VM for the license. A reservation needs unused quota for the resources it reserves and consumes that quota at creation, so the N2 CPU quota in `europe-west4` must first cover the 40 VMs.
      options:
        a: { en: "A commitment is a billing discount: without attached reservations it gives no capacity assurance in the recovery region." }
        c: { en: "Autoscaling still depends on available capacity and quota at failover time, and the quota covers only 2 VMs." }
        e: { en: "Spot VMs can be preempted at any time and come with no capacity assurance, which defeats a recovery capacity plan." }
    references:
      - title: "About reservations | Compute Engine | Google Cloud Documentation"
        url: https://docs.cloud.google.com/compute/docs/instances/reservations-overview
      - title: "Committed use discounts (CUDs) for Compute Engine | Google Cloud Documentation"
        url: https://docs.cloud.google.com/compute/docs/instances/committed-use-discounts-overview
