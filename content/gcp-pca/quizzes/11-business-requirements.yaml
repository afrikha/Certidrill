chapter: 11-business-requirements
questions:
  # ------------------------------------------------------------------ 1
  - id: gcppca-qz-11-01
    objective: "1.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A logistics company keeps a recovery copy of its parcel-tracking application in a second region. In that region, a managed instance group runs two small VMs and a Cloud SQL cross-region read replica receives the data. During a disaster, operators promote the replica and resize the instance group, and only then is the application available again.

        Which disaster recovery pattern does this design follow?
    body:
      options:
        - { id: a, text: { en: "Cold: nothing runs in the recovery region, and every resource is created after the disaster." } }
        - { id: b, text: { en: "Warm: a scaled-down copy runs in the recovery region and needs work before it takes traffic." } }
        - { id: c, text: { en: "Hot: the recovery region already serves users or takes over without any preparation." } }
        - { id: d, text: { en: "Zonal high availability: a standby in another zone of the same region takes over automatically." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A warm pattern keeps a scaled-down copy of the application ready in the recovery site: here a small instance group and a read replica. It recovers faster than a cold pattern because the data is already replicated, but the copy must be completed (replica promoted, instances added) before it serves, which is cheaper than a hot standby.
      options:
        a: { en: "In a cold pattern no resources run in the recovery site; here VMs and a replica already run in the second region." }
        c: { en: "A hot pattern needs no promotion or resizing before it serves; this design requires both steps." }
        d: { en: "Zonal high availability protects against the loss of one zone within a region; this design recovers in a second region." }
    references:
      - title: "Disaster recovery planning guide | Cloud Architecture Center | Google Cloud Documentation"
        url: https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide

  # ------------------------------------------------------------------ 2
  - id: gcppca-qz-11-02
    objective: "1.1.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A start-up has a Cloud Billing budget of USD 2,000 per month on its sandbox project, with an email alert at 100 % of actual spend. The finance team now wants the sandbox project to stop incurring charges automatically when its cost reaches the budget amount.

        What should you add?
    body:
      options:
        - { id: a, text: { en: "A Pub/Sub topic connected to the budget, and a function that disables billing on the project when notified" } }
        - { id: b, text: { en: "A second threshold rule at 100 % of forecasted spend, so that the budget stops the project earlier" } }
        - { id: c, text: { en: "A Cloud Monitoring notification channel on the budget, so that the on-call engineer gets the alert by SMS" } }
        - { id: d, text: { en: "A budget scope limited to Compute Engine, so that the project's VMs are stopped when the amount is reached" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A budget with threshold rules only sends notifications: it doesn't cap spending. To act automatically, you connect a Pub/Sub topic to the budget for programmatic notifications and run code, for example a Cloud Run function, that reads the cost in the notification and disables billing on the project. Spend cap budgets can pause new usage, but only of one eligible service per project, such as Cloud Run, so they can't stop all of the project's charges.
      options:
        b: { en: "A forecasted-spend threshold sends an earlier notification, but it still doesn't stop or disable anything." }
        c: { en: "A notification channel adds recipients for the alert; a person still has to act, so nothing happens automatically." }
        d: { en: "Narrowing the budget's scope changes which costs it tracks; Compute Engine isn't a service eligible for spend cap budgets, so no budget stops the VMs." }
    references:
      - title: "Create, edit, or delete budgets and budget alerts | Cloud Billing | Google Cloud Documentation"
        url: https://docs.cloud.google.com/billing/docs/how-to/budgets
      - title: "Manage spend cap budgets | Cloud Billing | Google Cloud Documentation"
        url: https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps

  # ------------------------------------------------------------------ 3
  - id: gcppca-qz-11-03
    objective: "1.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        During a requirements workshop for a new product-search API, the product owner says that search must "feel fast" for customers. You need to record this as a non-functional requirement that the team can design for and monitor after the launch.

        How should you write the requirement?
    body:
      options:
        - { id: a, text: { en: "95 % of search requests return results in less than 300 ms, measured over 28 days." } }
        - { id: b, text: { en: "The search API runs on compute-optimized machine types in the region closest to customers." } }
        - { id: c, text: { en: "Customers can search the catalog by keyword, category and price range from every page." } }
        - { id: d, text: { en: "The search API returns results as quickly as possible, whatever the load on the system." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A non-functional requirement must be measurable: a latency target at a percentile over a stated period can become a service level indicator and a service level objective in Cloud Monitoring. It describes how well the system behaves without prescribing how to build it.
      options:
        b: { en: "This is a design decision, not a requirement: it says how to build the API, not which latency customers must get." }
        c: { en: "This describes what the system does, so it is a functional requirement, and it says nothing about speed." }
        d: { en: "\"As quickly as possible\" can't be measured or monitored; there is no target to design for or to alert on." }
    references:
      - title: "Concepts in service monitoring | Google Cloud Observability | Google Cloud Documentation"
        url: https://docs.cloud.google.com/stackdriver/docs/solutions/slo-monitoring

  # ------------------------------------------------------------------ 4
  - id: gcppca-qz-11-04
    objective: "1.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An online retailer runs its storefront on a regional managed instance group behind a global external Application Load Balancer, with autoscaling based on CPU utilization. Each VM keeps the shopping carts of its customers in local memory. Customers report that their carts sometimes become empty, and the reports match the times when the autoscaler removes VMs. The retailer wants to keep autoscaling.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Enable session affinity on the backend service so that each customer keeps reaching the same VM." } }
        - { id: b, text: { en: "Store the carts in Memorystore for Redis so that any VM of the group can serve any customer." } }
        - { id: c, text: { en: "Set the minimum number of instances to the peak size so that the autoscaler never removes a VM." } }
        - { id: d, text: { en: "Increase the initialization period of the autoscaler so that new VMs load the carts before serving." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The Well-Architected Framework recommends a stateless architecture: when shared state lives outside the instances, VMs can be added, removed or replaced without losing data. Memorystore for Redis is a managed in-memory store commonly used for session data, so the carts survive a scale-in and every VM can serve every request.
      options:
        a: { en: "Affinity keeps a customer on one VM, but when the autoscaler removes that VM its carts are still lost." }
        c: { en: "Pinning the group at peak size stops the data loss only by giving up autoscaling, which the retailer wants to keep." }
        d: { en: "The initialization period delays scaling decisions for new VMs; the carts held by a removed VM are still lost." }
    references:
      - title: "Google Cloud Well-Architected Framework | Cloud Architecture Center | Google Cloud Documentation"
        url: https://docs.cloud.google.com/architecture/framework
      - title: "Memorystore for Redis overview | Google Cloud Documentation"
        url: https://docs.cloud.google.com/memorystore/docs/redis/memorystore-for-redis-overview

  # ------------------------------------------------------------------ 5
  - id: gcppca-qz-11-05
    objective: "1.1.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A bank uses a fraud-scoring service from a SaaS provider. The provider runs the service in its own Google Cloud project behind an internal load balancer and offers private connectivity to its customers. The bank's applications run in a VPC network whose IP ranges overlap with the provider's network. Security requires that the traffic doesn't cross the internet, that the bank can reach only the scoring service and not the rest of the provider's network, and that no IP addressing has to be coordinated with the provider.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Peer the bank's VPC network with the provider's network, and allow only the scoring service's ports in firewall rules." } }
        - { id: b, text: { en: "Create a Private Service Connect endpoint in the bank's VPC network that targets the provider's service attachment." } }
        - { id: c, text: { en: "Connect the two VPC networks with HA VPN and Cloud Router, and advertise only the load balancer's subnet." } }
        - { id: d, text: { en: "Call the service's public endpoint through Cloud NAT, and have the provider allowlist the NAT static IP address." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A Private Service Connect endpoint is an internal IP address in the consumer's VPC network that forwards to the producer's service attachment. The consumer reaches only that published service, traffic stays on Google's network, and NAT between the two sides means that no IP addressing has to be coordinated, even when ranges overlap.
      options:
        a: { en: "VPC Network Peering refuses overlapping subnet ranges, and it exchanges subnet routes of the whole network instead of exposing one service." }
        c: { en: "Routing over a VPN can't work between overlapping ranges, so the addressing must be coordinated, and it connects whole networks rather than one service." }
        d: { en: "The traffic would leave Google's network for the internet, which the security requirement forbids." }
    references:
      - title: "Private Service Connect | Virtual Private Cloud | Google Cloud Documentation"
        url: https://docs.cloud.google.com/vpc/docs/private-service-connect
      - title: "VPC Network Peering | Virtual Private Cloud | Google Cloud Documentation"
        url: https://docs.cloud.google.com/vpc/docs/vpc-peering

  # ------------------------------------------------------------------ 6
  - id: gcppca-qz-11-06
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A SaaS company serves its HR software to 400 small customers from one Google Cloud project, where all tenants share a GKE cluster and a Cloud SQL database. The product strategy adds an enterprise tier next year. Each enterprise customer requires its data and workloads to sit in a separate Google Cloud project with its own IAM policy, and the finance team must invoice each enterprise customer for the actual infrastructure cost it generates. Small customers stay on the shared platform, and the platform team must be able to onboard each new enterprise customer with the same repeatable process.

        Which design should you recommend?
    body:
      options:
        - { id: a, text: { en: "Give each enterprise customer a namespace in the shared GKE cluster, enable GKE cost allocation, and invoice the cost of each namespace from the billing export." } }
        - { id: b, text: { en: "Create a project for each enterprise customer under an enterprise folder with Terraform, and invoice each project's cost from the Cloud Billing export to BigQuery." } }
        - { id: c, text: { en: "Keep enterprise customers in the shared project, add a tenant label to the resources they use, and invoice the cost of each label from the Cloud Billing export." } }
        - { id: d, text: { en: "Create a project for each enterprise customer by copying the shared resources in the console, and invoice each customer a share of the bill based on its users." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A project per enterprise customer gives each one its own IAM policy and resources, and a folder groups these projects so that common policies are inherited. Creating them from the same Terraform code makes onboarding repeatable, and the Cloud Billing export to BigQuery records cost per project, which is the actual cost of each customer.
      options:
        a: { en: "A namespace in a shared cluster gives per-tenant cost data, but the customer's workloads stay in the shared project, which fails the separate-project requirement." }
        c: { en: "The data stays in the shared project, and a label can't split the cost of resources that several tenants share." }
        d: { en: "Manual copies in the console aren't a repeatable process, and a share based on users isn't the actual cost each customer generates." }
    references:
      - title: "About resource hierarchy | Resource Manager | Google Cloud Documentation"
        url: https://docs.cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy
      - title: "Export Cloud Billing data to BigQuery | Google Cloud Documentation"
        url: https://docs.cloud.google.com/billing/docs/how-to/export-data-bigquery

  # ------------------------------------------------------------------ 7
  - id: gcppca-qz-11-07
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A media company runs its web tier on N2 VMs in a regional managed instance group in us-central1. Twenty VMs run around the clock, and the autoscaler adds up to 40 more VMs during business hours on weekdays. Every night, a rendering job uses 50 more N2 VMs for about 4 hours; the job checkpoints its progress and can rerun any interrupted task. The company expects this architecture, machine series and region to stay the same for the next 3 years, and it wants the lowest compute cost.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Buy 3-year resource-based commitments in us-central1 that cover the vCPUs and memory of the 20 always-on VMs." } }
        - { id: b, text: { en: "Buy 3-year resource-based commitments in us-central1 that cover the vCPUs and memory of 60 VMs, the peak of the web tier." } }
        - { id: c, text: { en: "Run the nightly rendering VMs as Spot VMs, and let the job rerun the tasks of any VM that is preempted." } }
        - { id: d, text: { en: "Buy compute flexible commitments for an hourly spend that matches the cost of the nightly rendering VMs." } }
        - { id: e, text: { en: "Keep the nightly rendering VMs on demand, and let sustained use discounts lower their price each month." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          A resource-based commitment is billed every month of its term whether the resources run or not, so it should cover only the steady baseline: the 20 VMs that run all the time. Spot VMs cost up to 91 % less than on-demand VMs and can be preempted at any time, which suits a fault-tolerant batch job that checkpoints and reruns interrupted tasks.
      options:
        b: { en: "The 40 extra VMs run only during business hours, so most of the committed capacity would be paid for and unused." }
        d: { en: "A flexible commitment is an hourly spend paid for every hour of the term, so 20 hours a day would be wasted, and it doesn't apply to Spot VMs." }
        e: { en: "Sustained use discounts start only after a VM runs for more than 25 % of the month; 4 hours a day stays below that, and Spot VMs cost far less." }
    references:
      - title: "Committed use discounts (CUDs) for Compute Engine"
        url: https://docs.cloud.google.com/compute/docs/instances/committed-use-discounts-overview
      - title: "Sustained use discounts | Compute Engine | Google Cloud Documentation"
        url: https://docs.cloud.google.com/compute/docs/sustained-use-discounts

  # ------------------------------------------------------------------ 8
  - id: gcppca-qz-11-08
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A healthcare provider keeps a warm standby of its patient portal in europe-west4, with the infrastructure defined in Terraform and the data in a Cloud SQL cross-region replica. During the yearly disaster recovery test, the replica was promoted on time, but the portal stayed down for six hours: the portal's service accounts were missing IAM roles in the recovery project, and the operators couldn't sign in because they reach Google Cloud only through a corporate VPN that was part of the simulated outage. The next test must meet the one-hour recovery time objective without breaking the least-privilege policy and without paying for a second active site.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Manage the IAM policies of the production and recovery projects from the same Terraform code, and apply them before any disaster." } }
        - { id: b, text: { en: "Set up and test an access path to Google Cloud that doesn't depend on the corporate VPN, and have operators sign in during each test." } }
        - { id: c, text: { en: "Grant the operators' group the Admin basic role on the recovery project permanently so that no permission can be missing during a disaster." } }
        - { id: d, text: { en: "Replace the warm standby with an active-active deployment in both regions so that the portal never needs a failover." } }
        - { id: e, text: { en: "Replace the yearly test with a tabletop review of the runbook so that the recovery environment isn't disturbed again." } }
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          Google's disaster recovery planning guide asks you to give users and workloads the same access in the recovery environment as in production, for example by deploying the IAM policies with the same infrastructure-as-code tool, and to verify sign-in during tests. It also asks you to simulate the loss of your usual access path to Google Cloud and to keep an alternative path working.
      options:
        c: { en: "A permanent Admin grant breaks the least-privilege policy, and it doesn't fix the operators' inability to reach Google Cloud." }
        d: { en: "A second active site is exactly the extra cost that the business refuses, and the operators still need an access path." }
        e: { en: "Untested plans fail in real disasters; the guide asks for regular tests, and a tabletop review would not have found these two problems." }
    references:
      - title: "Disaster recovery planning guide | Cloud Architecture Center | Google Cloud Documentation"
        url: https://docs.cloud.google.com/architecture/dr-scenarios-planning-guide

  # ------------------------------------------------------------------ 9
  - id: gcppca-qz-11-09
    objective: "1.1.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A video-sharing start-up runs its upload API as a Cloud Run service. Mobile clients send videos of up to 4 GB in a single HTTP/1.1 POST request to the service, which writes the file to Cloud Storage and then transcodes it before it responds; transcoding takes up to 3 minutes. Uploads larger than 32 MiB are rejected, and many clients give up while they wait for the response. The company wants clients to get an answer within seconds, transcoding capacity that scales independently of the uploads, and no servers to manage.

        Which two changes should you make? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Have the API return a V4 signed URL for each upload so that the client sends the video directly to Cloud Storage." } }
        - { id: b, text: { en: "Raise the service's request timeout to 60 minutes, and give each instance more memory to buffer the uploads." } }
        - { id: c, text: { en: "Create an Eventarc trigger for finalized objects in the bucket that sends each new video to a transcoding service." } }
        - { id: d, text: { en: "Enable session affinity on the service so that the retries of a client reach the instance that holds its upload." } }
        - { id: e, text: { en: "Move the upload API to a managed instance group of VMs, which accepts request bodies of any size from clients." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          A signed URL gives the client time-limited permission to write the object, so the video goes straight to Cloud Storage and never passes through the service's request size limit. An Eventarc trigger on google.cloud.storage.object.v1.finalized events then sends each new object to a separate Cloud Run service, so the API answers at once and transcoding scales on its own.
      options:
        b: { en: "A longer timeout makes clients wait even longer, and the 32 MiB limit on HTTP/1 requests still rejects the large uploads." }
        d: { en: "Session affinity changes which instance receives a request; it doesn't lift the request size limit or make the response faster." }
        e: { en: "VMs are servers to manage, and the transcoding still runs inside the upload request, so clients keep waiting." }
    references:
      - title: "Signed URLs | Cloud Storage | Google Cloud Documentation"
        url: https://docs.cloud.google.com/storage/docs/access-control/signed-urls
      - title: "Route Cloud Storage events to Cloud Run | Eventarc Standard | Google Cloud Documentation"
        url: https://docs.cloud.google.com/eventarc/standard/docs/run/route-trigger-cloud-storage

  # ------------------------------------------------------------------ 10
  - id: gcppca-qz-11-10
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A German insurer is designing the policy database of a new claims platform on Spanner. The requirements are: data stored only in Germany, a database availability SLA of 99.999 %, no data loss if a Google Cloud region fails, failover performed by Google without operator action, and a fully managed service. The budget allows the Spanner edition that these requirements need.

        Which instance configuration should you choose?
    body:
      options:
        - { id: a, text: { en: "A regional configuration in Frankfurt (europe-west3)" } }
        - { id: b, text: { en: "The eur6 multi-region configuration (Netherlands and Frankfurt)" } }
        - { id: c, text: { en: "The dual-region configuration with Berlin and Frankfurt" } }
        - { id: d, text: { en: "A regional configuration in Frankfurt with a read-only replica in Berlin" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A dual-region configuration (here dual-region-germany1) replicates the data across two regions of one country, Berlin and Frankfurt, which meets the residency constraint. It offers 99.999 % availability, a recovery point objective of zero when a region fails, and Google-managed automatic failover. Dual-region configurations require the Enterprise Plus edition.
      options:
        a: { en: "A regional configuration offers 99.99 % availability and doesn't survive the loss of the whole region." }
        b: { en: "eur6 meets the availability target, but it stores data in the Netherlands and uses a witness in Zurich, which fails the residency requirement." }
        d: { en: "Read-only replicas serve reads; they don't change the 99.99 % SLA of a regional instance or give it a regional failover." }
    references:
      - title: "Regional, dual-region, and multi-region configurations | Spanner | Google Cloud Documentation"
        url: https://docs.cloud.google.com/spanner/docs/instance-configurations
