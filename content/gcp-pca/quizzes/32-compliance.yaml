chapter: 32-compliance
questions:
  # ------------------------------------------------------------------ 1
  - id: gcppca-qz-32-01
    objective: "3.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        During the night, the autoscaler of a Compute Engine managed instance group in a production project removed three VMs. Nobody on the team made a change, and the audit log configuration of the project was never modified.

        Which type of Cloud Audit Logs entry records the removal of these VMs?
    body:
      options:
        - { id: a, text: { en: "Admin Activity audit logs" } }
        - { id: b, text: { en: "Data Access audit logs" } }
        - { id: c, text: { en: "System Event audit logs" } }
        - { id: d, text: { en: "Policy Denied audit logs" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          System Event audit logs record configuration changes made by Google Cloud systems rather than by a user, and VMs added to or removed from a managed instance group by autoscaling are an example. They are always written and cannot be configured, excluded or disabled, so the entries exist even though nothing was set up.
      options:
        a: { en: "Admin Activity audit logs record configuration changes made by users or by API calls that a principal makes; an autoscaler decision is a change made by a Google system." }
        b: { en: "Data Access audit logs record reads of configuration or metadata and reads and writes of user data; they are off by default for Compute Engine and do not record autoscaling." }
        d: { en: "Policy Denied audit logs record requests refused by a security policy such as a VPC Service Controls perimeter; nothing was denied here." }
    references:
      - title: "Cloud Audit Logs overview"
        url: https://docs.cloud.google.com/logging/docs/audit

  # ------------------------------------------------------------------ 2
  - id: gcppca-qz-32-02
    objective: "3.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A US clinic chain has accepted the Google Cloud Business Associate Agreement and stores protected health information (PHI) only in covered products. To speed up troubleshooting, a developer proposes to put each patient's medical record number in the names of Cloud Storage buckets and in VM labels.

        What should you advise?
    body:
      options:
        - { id: a, text: { en: "Use the record numbers in names and labels, because the BAA covers all the metadata of covered products." } }
        - { id: b, text: { en: "Use the record numbers only in labels, and encrypt the buckets and VM disks with customer-managed keys." } }
        - { id: c, text: { en: "Use the record numbers only in labels, and keep the Data Access audit logs of the project disabled." } }
        - { id: d, text: { en: "Use non-identifying references in names and labels, and map them to patients inside the application." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Google's HIPAA guidance asks customers to avoid putting PHI in resource metadata, because logs might capture that information, and to keep it out of metric labels, VM labels and alerting configurations. Resource names and labels are configuration, not protected content, so a non-identifying reference that only the application maps to the patient is the right design.
      options:
        a: { en: "Compliance with HIPAA is a shared responsibility: the guidance explicitly asks customers to keep PHI out of resource metadata, which logs might capture." }
        b: { en: "Customer-managed keys encrypt the stored data; labels are metadata that appears in the console, the APIs and the logs whatever the key." }
        c: { en: "Setting labels is recorded in Admin Activity audit logs, which are always written and cannot be disabled, so the record numbers would be logged anyway." }
    references:
      - title: "HIPAA compliance on Google Cloud and Google Workspace"
        url: https://docs.cloud.google.com/docs/security/compliance/hipaa

  # ------------------------------------------------------------------ 3
  - id: gcppca-qz-32-03
    objective: "3.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A health insurer plans to give an external research partner a BigQuery table of claims. Names and member IDs have already been removed, but the table still contains the ZIP code, birth year and gender of each member. Before approving the release, the privacy officer wants a measure of how many records share each combination of these three columns, to estimate the risk that a member could be identified.

        What should you use?
    body:
      options:
        - { id: a, text: { en: "A Sensitive Data Protection discovery scan that creates data profiles for the dataset" } }
        - { id: b, text: { en: "A Sensitive Data Protection risk analysis job that computes k-anonymity on the three columns" } }
        - { id: c, text: { en: "A Sensitive Data Protection inspection job of the table with the built-in infoTypes" } }
        - { id: d, text: { en: "A BigQuery policy tag with column-level access control on the three columns" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Re-identification risk analysis measures how easily the subjects of a dataset could be identified. With k-anonymity, the ZIP code, birth year and gender are declared as quasi-identifiers, and the job reports how many records share each combination of values: small groups mean records that could be re-identified.
      options:
        a: { en: "Discovery data profiles tell which tables contain sensitive infoTypes and how sensitive they are; they do not measure how many records share combinations of quasi-identifiers." }
        c: { en: "Inspection finds values that match infoTypes, such as identifiers in a column; it does not compute a re-identification risk metric for combinations of columns." }
        d: { en: "Column-level access control restricts who can read the columns; it neither measures the re-identification risk nor helps the partner, who needs the data." }
    references:
      - title: "Re-identification risk analysis"
        url: https://docs.cloud.google.com/sensitive-data-protection/docs/concepts-risk-analysis

  # ------------------------------------------------------------------ 4
  - id: gcppca-qz-32-04
    objective: "3.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A SaaS company hosted on Google Cloud is building a public trust page for its prospects. The page must offer an independent auditor's report on the controls of Google Cloud, with the scope of Google's SOC 2 audit, that anyone can download. The company must not need to ask Google for permission to publish it.

        Which document should the company publish?
    body:
      options:
        - { id: a, text: { en: "The Google Cloud SOC 2 Type II report from Compliance Reports Manager" } }
        - { id: b, text: { en: "The most recent SOC 2 bridge letter from Compliance Reports Manager" } }
        - { id: c, text: { en: "The Google Cloud SOC 3 report from Compliance Reports Manager" } }
        - { id: d, text: { en: "A Compliance Manager audit report for the SOC 2 framework from Security Command Center" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The SOC 3 is a public report based on the same scope as the related SOC 2 report, and the core Google Cloud SOC 3 reports are downloaded from Compliance Reports Manager. Because it is a general-use report, the company can publish it for prospects.
      options:
        a: { en: "Resources marked Google Confidential Information, such as the SOC 2 report, are shared under the confidentiality obligations of the customer agreement; sharing them with third parties needs permission from Google." }
        b: { en: "A bridge letter is an attestation by Google's management that covers the gap after a SOC 2 report's period; it is not an independent auditor's report, and it is meant to be read with the SOC 2 report." }
        d: { en: "Compliance Manager evaluates the company's own Google Cloud resources against a framework; it is not an audit of the controls that Google operates." }
    references:
      - title: "SOC 3: compliance"
        url: https://cloud.google.com/security/compliance/soc-3
      - title: "Compliance reports manager"
        url: https://cloud.google.com/security/compliance/compliance-reports-manager

  # ------------------------------------------------------------------ 5
  - id: gcppca-qz-32-05
    objective: "3.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A security engineer created an aggregated sink on the organization with `--include-children`. The sink routes audit log entries to the BigQuery dataset `org_audit` in the project `sec-logs`. A day later, the dataset still contains no table, although Logs Explorer shows many entries that match the sink's filter in the child projects.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Recreate the sink with `--intercept-children` so that the child projects stop keeping their own copies." } }
        - { id: b, text: { en: "Grant the sink's writer identity the BigQuery Data Editor role on the `org_audit` dataset." } }
        - { id: c, text: { en: "Enable the Data Access audit logs of BigQuery in the audit configuration of the organization." } }
        - { id: d, text: { en: "Grant the security engineer the Private Logs Viewer role on the organization." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Each sink writes with a writer identity, a service account managed by Cloud Logging. When the destination is not a log bucket in the same project, that identity must be granted write access on the destination: BigQuery Data Editor for a BigQuery dataset. Until then, matching entries cannot be written to the dataset.
      options:
        a: { en: "Intercepting changes whether child sinks still receive the entries; it does not give the sink permission to write to the dataset." }
        c: { en: "The filter already matches entries in the child projects, so there is no missing log type; the sink lacks permission on its destination." }
        d: { en: "Private Logs Viewer lets a person read logs, including Data Access logs; the sink writes with its own writer identity, not with the engineer's permissions." }
    references:
      - title: "Collate and route organization- and folder-level logs to supported destinations"
        url: https://docs.cloud.google.com/logging/docs/export/aggregated_sinks

  # ------------------------------------------------------------------ 6
  - id: gcppca-qz-32-06
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A French public hospital operator wants to use cloud services such as GKE and BigQuery for sensitive patient data. Its regulator requires a cloud offering designed for the French SecNumCloud framework, operated by an independent French entity on infrastructure isolated from the provider's public cloud. The operator does not want to buy, host or run any hardware in its own data centers.

        Which solution should you recommend?
    body:
      options:
        - { id: a, text: { en: "Google Cloud Data Boundary in a French region, with support access restricted to personnel located in the EU" } }
        - { id: b, text: { en: "Google Distributed Cloud air-gapped, installed and operated in the hospital operator's own data centers" } }
        - { id: c, text: { en: "An Assured Workloads folder with an EU regional control package, and Cloud EKM keys held by a French key provider" } }
        - { id: d, text: { en: "Google Cloud Dedicated, delivered in France by a local partner on dedicated infrastructure" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Google Cloud Dedicated provides dedicated infrastructure with independent operations by a local partner. In France it is operated by S3NS, a standalone French entity, and the offering is designed to meet the SecNumCloud requirements, without the customer running hardware.
      options:
        a: { en: "Data Boundary applies software-defined residency, personnel and key controls on Google's public cloud; it is not isolated infrastructure operated by an independent French entity." }
        b: { en: "The air-gapped offering runs on hardware in the customer's own facilities, which the operator explicitly refuses to host and run." }
        c: { en: "Assured Workloads and Cloud EKM add guardrails and external key control to Google's public cloud, which Google still operates; they do not provide partner-operated isolated infrastructure." }
    references:
      - title: "Sovereign Cloud from Google"
        url: https://cloud.google.com/sovereign-cloud

  # ------------------------------------------------------------------ 7
  - id: gcppca-qz-32-07
    objective: "3.2.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Twenty days ago, a firewall rule of a production VPC network was changed to allow TCP port 22 from 0.0.0.0/0, and it was changed back one hour later. An auditor now asks for the identity of the principals who made both changes, and for the complete configuration of the rule, with every field, as it was while it was open. The project has no log sinks, and no Data Access audit logs are enabled.

        Which two sources should you use? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The Data Access audit logs of Compute Engine in the project's _Default log bucket" } }
        - { id: b, text: { en: "The Admin Activity audit logs of the project in its _Required log bucket" } }
        - { id: c, text: { en: "The VPC Flow Logs of the subnets that the firewall rule applies to" } }
        - { id: d, text: { en: "The Cloud Asset Inventory history of the firewall rule resource" } }
        - { id: e, text: { en: "The Access Transparency logs of the organization" } }
    answer: { optionIds: [ b, d ] }
    explanation:
      correct:
        en: |
          Changing a firewall rule is an administrative action, so both changes are in the Admin Activity audit logs with the caller identity; these logs are always written and kept 400 days in the _Required bucket. Cloud Asset Inventory keeps the create, update and delete history of assets for up to 35 days, so it returns the full configuration of the rule at any time in the last 20 days.
      options:
        a: { en: "Data Access audit logs are off by default for Compute Engine and record reads, not configuration changes; they hold nothing for this request." }
        c: { en: "VPC Flow Logs sample network flows when they are enabled; they record traffic, not who changed a rule or its configuration." }
        e: { en: "Access Transparency logs record actions taken by Google personnel on customer content, not changes made by the company's own principals." }
    references:
      - title: "Cloud Audit Logs overview"
        url: https://docs.cloud.google.com/logging/docs/audit
      - title: "Cloud Asset Inventory overview"
        url: https://docs.cloud.google.com/asset-inventory/docs/overview

  # ------------------------------------------------------------------ 8
  - id: gcppca-qz-32-08
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A payment processor keeps its cardholder data environment in two projects: a token vault in BigQuery and scanned card forms in Cloud Storage. IAM roles are already granted with least privilege. The PCI DSS assessor adds two requirements: employees with valid credentials must not be able to copy cardholder data to projects outside the environment, and the company itself must control the rotation of the keys that protect the data at rest and be able to make the data unreadable by disabling a key.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Add egress firewall rules that deny all traffic from the environment's subnets to the internet." } }
        - { id: b, text: { en: "Create a VPC Service Controls perimeter around the two projects that restricts BigQuery and Cloud Storage." } }
        - { id: c, text: { en: "Keep Google's default encryption at rest, which already rotates the encryption keys automatically." } }
        - { id: d, text: { en: "Protect the dataset and the buckets with Cloud KMS customer-managed keys that have a rotation period." } }
        - { id: e, text: { en: "Enable Access Approval so that every access to the cardholder data needs an explicit approval." } }
    answer: { optionIds: [ b, d ] }
    explanation:
      correct:
        en: |
          A VPC Service Controls perimeter blocks service operations that would copy data to resources outside the perimeter, even for clients with valid or stolen credentials, which IAM alone cannot prevent. With customer-managed encryption keys, the company sets the rotation period of its keys in Cloud KMS, and disabling or destroying a key makes the protected data inaccessible.
      options:
        a: { en: "Firewall rules filter network traffic from VMs; a user with valid credentials can still call the BigQuery or Cloud Storage API to copy data to another project." }
        c: { en: "With default encryption, Google owns and controls the keys: the company can neither set the rotation nor disable a key to make the data unreadable." }
        e: { en: "Access Approval applies to access by Google personnel, not to the company's employees, who would still be able to copy the data." }
    references:
      - title: "Overview of VPC Service Controls"
        url: https://docs.cloud.google.com/vpc-service-controls/docs/overview
      - title: "Customer-managed encryption keys (CMEK)"
        url: https://docs.cloud.google.com/kms/docs/cmek

  # ------------------------------------------------------------------ 9
  - id: gcppca-qz-32-09
    objective: "3.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        An organization has 400 projects, and Data Access audit logs are enabled for all its services. The security team must keep these logs centrally in a log bucket of the `sec-logs` project. Finance does not want them also stored and charged in the _Default bucket of every project, and project teams must not be able to route copies of them with their own sinks. Admin Activity logs must stay available in each project. The team wants the fewest configurations.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Create an aggregated sink on the organization with `--include-children` that routes Data Access audit logs to the central log bucket." } }
        - { id: b, text: { en: "Create an aggregated sink on the organization with `--intercept-children` that routes Data Access audit logs to the `sec-logs` project." } }
        - { id: c, text: { en: "Add a Data Access exclusion to the _Default sink of each project, and create a sink in each project to the central log bucket." } }
        - { id: d, text: { en: "Disable the _Default sink in the organization's default settings, and create an aggregated sink to the central log bucket." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          When an intercepting aggregated sink matches an entry, the entry is not sent to the sinks of the child resources, so it is no longer stored in their _Default buckets and project sinks cannot copy it. The entry is still sent to the _Required sink of the resource where it originates, which keeps Admin Activity logs in each project. The intercepted entries reach the `sec-logs` project, whose sinks store them in the central bucket.
      options:
        a: { en: "A non-intercepting aggregated sink copies the entries: the _Default sinks of the child projects still store them, so they are charged twice and project sinks can still route copies." }
        c: { en: "This needs two configurations in each of 400 projects, and project teams could still create their own sinks that route copies of the logs." }
        d: { en: "Default settings apply only to projects created afterward, and disabling the _Default sink stops every other log type from being stored too." }
    references:
      - title: "Route log entries"
        url: https://docs.cloud.google.com/logging/docs/routing/overview
      - title: "Collate and route organization- and folder-level logs to supported destinations"
        url: https://docs.cloud.google.com/logging/docs/export/aggregated_sinks

  # ------------------------------------------------------------------ 10
  - id: gcppca-qz-32-10
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A defense contractor runs its export-controlled workloads in an Assured Workloads folder created with the ITAR control package. For its next certification audit, the compliance team must receive an email whenever an organization policy of the folder is changed in a way that breaks the package's controls, but not for compliant changes. Each deviation that the team accepts must be recorded with a business justification on the detected violation itself. The company wants the least custom development.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Create a log-based alerting policy on Admin Activity entries that change organization policies in the folder, and record accepted deviations in the ticketing system." } }
        - { id: b, text: { en: "Activate Security Command Center Premium, and mute the Security Health Analytics findings of accepted deviations with a note that gives the justification." } }
        - { id: c, text: { en: "Use the folder's Assured Workloads monitoring, add the team to the Legal category of Essential Contacts, and mark accepted violations as exceptions with a justification." } }
        - { id: d, text: { en: "Create a Cloud Asset Inventory feed on the folder's organization policies, and have a Cloud Run function compare each change with the package and email the team." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Assured Workloads monitoring is enabled automatically for the folder and reports a violation when its organization policy settings are changed in a non-compliant way. Members of the Legal category of Essential Contacts are emailed by default, and an accepted violation can be acknowledged as an exception with a business justification, which is the record the auditor needs.
      options:
        a: { en: "The alert fires on every organization policy change, compliant or not, because it does not evaluate the package's controls; the justification lives outside the violation record." }
        b: { en: "Security Health Analytics checks resources against security benchmarks, not against the ITAR package's constraints, and muting a finding is not an exception on an Assured Workloads violation." }
        d: { en: "This rebuilds compliance evaluation in custom code that the company must write and maintain, against the least custom development requirement." }
    references:
      - title: "Monitor an Assured Workloads folder for violations"
        url: https://docs.cloud.google.com/assured-workloads/docs/monitor-folder
