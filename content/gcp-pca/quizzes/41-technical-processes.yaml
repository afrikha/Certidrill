chapter: 41-technical-processes
questions:
  # ------------------------------------------------------------------ 1
  - id: gcppca-qz-41-01
    objective: "4.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A team is setting up the CI pipeline of a new application in 2026. An old build script that it wants to reuse pushes container images to `gcr.io/<project>` in Container Registry.

        Where should the new pipeline store the container images?
    body:
      options:
        - { id: a, text: { en: "In Container Registry, as the old build script does" } }
        - { id: b, text: { en: "In a Cloud Storage bucket, as exported image archives" } }
        - { id: c, text: { en: "In a Docker repository of Artifact Registry" } }
        - { id: d, text: { en: "In a repository of Cloud Source Repositories" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Artifact Registry is the recommended service for storing and managing container images on Google Cloud. It can also serve `gcr.io` addresses through gcr.io repositories if old scripts must keep their image paths.
      options:
        a: { en: "Container Registry is deprecated and has been shut down since March 18, 2025: images can no longer be written to it." }
        b: { en: "Image archives in a bucket cannot be pulled by GKE or Cloud Run as images, and they get none of the registry features such as vulnerability scanning." }
        d: { en: "Cloud Source Repositories hosted Git source code, not container images, and it isn't available to new customers since June 17, 2024." }
    references:
      - title: "Transition from Container Registry"
        url: https://docs.cloud.google.com/artifact-registry/docs/transition/transition-from-gcr

  # ------------------------------------------------------------------ 2
  - id: gcppca-qz-41-02
    objective: "4.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        During a major outage, five engineers investigated in parallel. Two of them rolled back different components without telling the others, and the customer support team received no status update for an hour.

        Following the operational excellence pillar of the Well-Architected Framework, what should the company define for future incidents?
    body:
      options:
        - { id: a, text: { en: "A rule that only the most senior engineer on call may change production during an incident" } }
        - { id: b, text: { en: "Incident roles, such as an incident commander who coordinates and a communicator for stakeholders" } }
        - { id: c, text: { en: "A longer log retention period, so that the investigators have more history to work with" } }
        - { id: d, text: { en: "A post-incident review template, so that each incident is documented after it is resolved" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The pillar asks teams to define the roles and expectations of each member during an incident, such as incident commanders, investigators, communicators and technical experts. A commander coordinates the actions, so changes are no longer made in isolation, and a communicator keeps stakeholders informed on a regular cadence.
      options:
        a: { en: "Seniority does not organize the response: actions still lack coordination, and nobody is in charge of informing stakeholders." }
        c: { en: "More log history helps investigation, but the problems here were uncoordinated actions and missing communication." }
        d: { en: "Post-incident reviews are needed, but they happen after the incident; they do not coordinate the response or the updates while it is running." }
    references:
      - title: "Manage incidents and problems"
        url: https://docs.cloud.google.com/architecture/framework/operational-excellence/manage-incidents-and-problems

  # ------------------------------------------------------------------ 3
  - id: gcppca-qz-41-03
    objective: "4.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A platform team has deployed a new analytics environment with Terraform. Before it hands the environment over, the security team must validate exactly which users can read the BigQuery dataset `claims_raw`, including users who get access through Google groups and through roles granted on the project, the folder or the organization.

        What should the team use?
    body:
      options:
        - { id: a, text: { en: "The IAM role recommendations of the project, filtered on BigQuery roles" } }
        - { id: b, text: { en: "The BigQuery Data Access audit logs of the dataset for the last 30 days" } }
        - { id: c, text: { en: "The bindings of the dataset's own IAM policy, listed with the `bq show` command" } }
        - { id: d, text: { en: "A Policy Analyzer query on the dataset, with group expansion enabled" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Policy Analyzer finds which principals have what access to a resource. It analyzes every relevant allow policy in the scope, including policies inherited from the project, folder and organization, and group expansion lists the individual members of the groups in the results.
      options:
        a: { en: "Role recommendations suggest removing permissions that principals do not use; they do not list every principal that can read the dataset." }
        b: { en: "Audit logs show who actually read the dataset; users who have access but did not use it in the period are missing." }
        c: { en: "The dataset's own policy contains only the bindings set on the dataset: inherited grants and the members of groups are not shown." }
    references:
      - title: "Policy Analyzer for allow policies"
        url: https://docs.cloud.google.com/policy-intelligence/docs/policy-analyzer-overview

  # ------------------------------------------------------------------ 4
  - id: gcppca-qz-41-04
    objective: "4.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A team deploys a Cloud Run service through a Cloud Deploy delivery pipeline with the targets dev, staging and prod. Each environment has its own Cloud SQL database, and a container image applies the schema migrations. The migrations must run in every target as a job of the rollout, before the new revision is deployed, and they must be defined once in the delivery pipeline.

        What should the team configure?
    body:
      options:
        - { id: a, text: { en: "A `predeploy` deploy hook in the strategy of each stage, which runs the migration container" } }
        - { id: b, text: { en: "A `postdeploy` deploy hook in the strategy of each stage, which runs the migration container" } }
        - { id: c, text: { en: "A deployment verification `verify` task in the strategy of each stage, which runs the migration container" } }
        - { id: d, text: { en: "An automation with a `repairRolloutRule`, which runs the migration container when a rollout fails" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Deploy hooks are defined as container tasks in the stages of the delivery pipeline. A `predeploy` hook always runs as the first job of the phase, before the deploy job, so the schema is migrated before the new revision is deployed in each target.
      options:
        b: { en: "A `postdeploy` hook runs after the deploy job, so the new revision would start against the old schema." }
        c: { en: "Verification runs after the application is deployed, to test it; it is not meant to prepare the target before deployment." }
        d: { en: "A repair rule retries a failed rollout and can roll it back; it does not run a job before each deployment." }
    references:
      - title: "Run hooks before and after deploying"
        url: https://docs.cloud.google.com/deploy/docs/hooks

  # ------------------------------------------------------------------ 5
  - id: gcppca-qz-41-05
    objective: "4.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A platform team publishes a hardened Cloud SQL solution in Service Catalog: its Terraform configuration creates instances with a private IP address only. Application teams work in projects under the Apps folder and hold the Cloud SQL Admin role there to operate their instances. Security requires that no Cloud SQL instance in the folder ever gets a public IP address, whether it is created from the catalog, the console or the gcloud CLI.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Add a validation rule to the solution's Terraform variables that rejects any public IP setting." } }
        - { id: b, text: { en: "Enforce the `constraints/sql.restrictPublicIp` organization policy constraint on the Apps folder." } }
        - { id: c, text: { en: "Add VPC firewall rules in each project that deny ingress from 0.0.0.0/0 to the Cloud SQL instances." } }
        - { id: d, text: { en: "Notify the platform team of Security Command Center findings about public instances so that it removes them." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Guardrails for self-service provisioning belong above the teams. The Restrict Public IP access on Cloud SQL instances constraint, enforced on the folder, applies to every project below it, whatever tool creates the instance: the catalog, the console or the CLI.
      options:
        a: { en: "The check protects only instances created from the catalog solution; teams with Cloud SQL Admin can still add a public IP from the console or the CLI." }
        c: { en: "VPC firewall rules do not control whether a Cloud SQL instance gets a public IP address, so they do not meet the requirement." }
        d: { en: "Findings detect a public instance after it exists; the requirement is that no instance ever gets a public IP address." }
    references:
      - title: "Add predefined organization policies"
        url: https://docs.cloud.google.com/sql/docs/mysql/org-policy/configure-org-policy

  # ------------------------------------------------------------------ 6
  - id: gcppca-qz-41-06
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A European bank is moving its development to Google Cloud in 2026; its organization has never used Cloud Source Repositories. Its regulator requires that source code be hosted on a single-tenant managed Git service in a Google Cloud region that the bank chooses, encrypted with keys that the bank manages, and protected by the VPC Service Controls perimeter of its build projects. The bank wants the service to be managed by Google.

        Which solution should you recommend?
    body:
      options:
        - { id: a, text: { en: "Cloud Source Repositories in the build project, with the project inside the perimeter" } }
        - { id: b, text: { en: "GitHub Enterprise Cloud, connected to Cloud Build through Developer Connect" } }
        - { id: c, text: { en: "A Secure Source Manager instance in the chosen region, created with CMEK, inside the perimeter" } }
        - { id: d, text: { en: "A GitLab server on Compute Engine in the chosen region, with CMEK-encrypted disks" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Secure Source Manager is a regionally deployed, single-tenant managed source code repository on Google Cloud, generally available. An instance can be created with customer-managed encryption keys and can be used inside a VPC Service Controls perimeter to guard against data exfiltration.
      options:
        a: { en: "Cloud Source Repositories isn't available to new customers since June 17, 2024: an organization that never used it cannot enable the API." }
        b: { en: "GitHub Enterprise Cloud is a third-party service outside the bank's Google Cloud region and perimeter; Developer Connect only links it to Google Cloud." }
        d: { en: "A GitLab server on Compute Engine is self-managed: the bank must install, patch and operate it, which the requirement for a Google-managed service excludes." }
    references:
      - title: "Secure Source Manager overview"
        url: https://docs.cloud.google.com/secure-source-manager/docs/overview
      - title: "Cloud Source Repositories documentation"
        url: https://docs.cloud.google.com/source-repositories/docs

  # ------------------------------------------------------------------ 7
  - id: gcppca-qz-41-07
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A retailer's checkout was unavailable for 90 minutes after an engineer applied a Terraform change that set a wrong source range in a firewall rule. The pipeline let anyone merge network changes without a review, and nothing tested connectivity after a change. The only alerts watched VM CPU usage, so customers reported the outage 40 minutes before the on-call team noticed it. The draft post-incident review names the engineer's mistake as the root cause.

        Following the operational excellence pillar, which two action items should the review contain? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Require a second engineer's review of network changes, and add a pipeline step that tests the critical network paths in staging." } }
        - { id: b, text: { en: "Require approval by the director of engineering for every production change, network or not, before the pipeline applies it." } }
        - { id: c, text: { en: "Remove the engineer's permission to merge network changes until the engineer completes a firewall training course." } }
        - { id: d, text: { en: "Add an alerting policy on an availability SLI of the checkout, such as the error ratio measured at the load balancer." } }
        - { id: e, text: { en: "Revert all the Terraform changes of the last week, and freeze network changes until the next quarterly release." } }
    answer: { optionIds: [ a, d ] }
    explanation:
      correct:
        en: |
          A blameless review identifies the immediate cause and the systemic issues that let it happen. Here, those issues are the missing review, the missing validation of network paths and the late detection. Requiring a peer review and adding an automated test fix the process that let the change through. An alert on a user-facing availability SLI detects the next failure in minutes instead of relying on customers.
      options:
        b: { en: "A manual gate for every change slows all delivery and still does not validate network paths; it is not targeted at the factors that caused this incident." }
        c: { en: "This blames one person: anyone else could still merge an unreviewed, untested change, so the systemic cause remains." }
        e: { en: "Reverting a week of changes is not a corrective action for this cause, and a long freeze hurts delivery without adding review or validation." }
    references:
      - title: "Manage incidents and problems"
        url: https://docs.cloud.google.com/architecture/framework/operational-excellence/manage-incidents-and-problems

  # ------------------------------------------------------------------ 8
  - id: gcppca-qz-41-08
    objective: "4.1.6"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A manufacturer runs a file-based production application on a Compute Engine VM. Its data is on a Hyperdisk Balanced High Availability disk replicated across two zones, and Asynchronous Replication copies the disk to a second region with an RPO of about one minute. Last week, a faulty batch job corrupted many files at 10:00, and the team noticed it at 13:00. The business now requires that the data can be restored as it was at any full hour of the last three days.

        What should you add to the design?
    body:
      options:
        - { id: a, text: { en: "A snapshot schedule on the disk that runs every hour and keeps each snapshot for three days" } }
        - { id: b, text: { en: "A secondary region closer to the primary region, to shorten the Asynchronous Replication lag" } }
        - { id: c, text: { en: "A consistency group that contains the primary disk, to keep its replicated writes in order" } }
        - { id: d, text: { en: "A regional Persistent Disk in place of the Hyperdisk, for synchronous replication of every write" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Replicated disks copy every write, including the corrupted ones, so their replicas hold the damage within seconds or a minute. Snapshots are incremental point-in-time copies; a schedule can run every 1 to 23 hours and keeps each snapshot for the retention set in days, so an hourly schedule with three days of retention gives a restore point for every hour of the last three days.
      options:
        b: { en: "A shorter lag makes the secondary disk receive the corrupted writes even sooner; replication never keeps the earlier state." }
        c: { en: "Consistency groups make the replication of several disks consistent with one another; they do not keep any earlier version of the data." }
        d: { en: "Synchronous replication between zones is high availability, not backup: the corruption is written to both zones at once." }
    references:
      - title: "Create schedules for disk snapshots"
        url: https://docs.cloud.google.com/compute/docs/disks/scheduled-snapshots
      - title: "Build HA services using synchronously replicated disks"
        url: https://docs.cloud.google.com/compute/docs/disks/high-availability-regional-persistent-disk

  # ------------------------------------------------------------------ 9
  - id: gcppca-qz-41-09
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A company deploys a GKE application through a Cloud Deploy delivery pipeline with the targets dev, staging and prod. The prod stage uses a canary strategy with phases at 25 and 50 percent. The company has two requirements: a release whose rollout to dev succeeds must be promoted to staging automatically one hour after that success, and in prod each successful canary phase must move on to the next phase automatically after 30 minutes.

        Which two automation rules should you configure? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "A `timedPromoteReleaseRule` for dev with a cron schedule that runs every hour, to promote releases to staging" } }
        - { id: b, text: { en: "A `promoteReleaseRule` for dev with a wait of one hour, to promote releases to the next target" } }
        - { id: c, text: { en: "A `promoteReleaseRule` for prod with a wait of 30 minutes, to move rollouts to the next canary phase" } }
        - { id: d, text: { en: "An `advanceRolloutRule` for prod with a wait of 30 minutes, to move rollouts to the next canary phase" } }
        - { id: e, text: { en: "A `repairRolloutRule` for prod with a wait of 30 minutes, to move rollouts to the next canary phase" } }
    answer: { optionIds: [ b, d ] }
    explanation:
      correct:
        en: |
          A `promoteReleaseRule` promotes a release automatically after a successful rollout to its source target, with an optional `wait` delay, to the next target in the pipeline. An `advanceRolloutRule` advances a rollout from one phase to the next and is available only on targets that use a canary strategy; its `wait` sets how long each phase lasts.
      options:
        a: { en: "A timed promotion runs on its cron schedule, not one hour after each successful dev rollout, so a release could move after a few minutes or almost an hour late." }
        c: { en: "Promotion moves a release from one target to another; it does not move a rollout between the canary phases of the same target." }
        e: { en: "A repair rule retries a failed rollout and then rolls it back; it does not advance successful phases." }
    references:
      - title: "Automate your deployment"
        url: https://docs.cloud.google.com/deploy/docs/automation
      - title: "Use a canary deployment strategy"
        url: https://docs.cloud.google.com/deploy/docs/deployment-strategies/canary

  # ------------------------------------------------------------------ 10
  - id: gcppca-qz-41-10
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A company's CI pipelines run in GitLab CI, outside Google Cloud, and already authenticate through Workload Identity Federation by impersonating the service account `ci-deployer`. The pipelines must create releases in the Cloud Deploy delivery pipeline `web-app`, which renders and deploys with the execution service account `deploy-exec`. Following the principle of least privilege, `ci-deployer` must not be able to approve rollouts or change delivery pipelines and targets.

        Which two grants should you make? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Cloud Deploy Releaser (`roles/clouddeploy.releaser`) to `ci-deployer` on the project" } }
        - { id: b, text: { en: "Cloud Deploy Operator (`roles/clouddeploy.operator`) to `ci-deployer` on the project" } }
        - { id: c, text: { en: "Cloud Deploy Approver (`roles/clouddeploy.approver`) to `ci-deployer` on the project" } }
        - { id: d, text: { en: "Service Account User (`roles/iam.serviceAccountUser`) to `ci-deployer` on `deploy-exec`" } }
        - { id: e, text: { en: "Cloud Deploy Admin (`roles/clouddeploy.admin`) to `ci-deployer` on the `web-app` pipeline" } }
    answer: { optionIds: [ a, d ] }
    explanation:
      correct:
        en: |
          The Cloud Deploy Releaser role allows creating releases and rollouts without managing the pipeline configuration or approving. Creating a release also requires the `iam.serviceAccounts.actAs` permission on the service account that renders the manifest, and creating a rollout needs it on the account used to deploy. Service Account User on `deploy-exec` gives that permission on this one account only.
      options:
        b: { en: "Operator manages the deployment configuration, including delivery pipelines and targets, which `ci-deployer` must not change." }
        c: { en: "Approver approves or rejects rollouts, which is exactly the separation of duties that the requirement keeps away from the CI identity." }
        e: { en: "Admin gives full control of the Cloud Deploy resources, including changing the pipeline, far beyond creating releases." }
    references:
      - title: "IAM roles and permissions"
        url: https://docs.cloud.google.com/deploy/docs/iam-roles-permissions
