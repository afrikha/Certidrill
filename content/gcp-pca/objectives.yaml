# Google Cloud Professional Cloud Architect objectives.
# Source: Professional Cloud Architect Certification exam guide (standard exam),
# https://services.google.com/fh/files/misc/professional_cloud_architect_exam_guide_english.pdf, read on 2026-11-27
# (no version date printed). Six sections, groups = the guide's subsections (1.1, 1.2…), objectives = their bullets,
# English verbatim. Subsections 6.1 and 6.3 to 6.6 have no bullet: the subsection itself is the objective.
# Codes <section>.<subsection>.<n>; English only (the exam is offered in English and Japanese).
design:
- group:
    en: Designing a cloud solution infrastructure that meets business requirements
  objectives:
  - code: 1.1.1
    en: Business use cases and product strategy
  - code: 1.1.2
    en: Identifying functional and non-functional requirements
  - code: 1.1.3
    en: Business continuity plan
  - code: 1.1.4
    en: Cost optimization
  - code: 1.1.5
    en: Supporting the application design
  - code: 1.1.6
    en: Integration patterns with external systems
  - code: 1.1.7
    en: Movement of data
  - code: 1.1.8
    en: Design decision trade-offs
  - code: 1.1.9
    en: Workload disposition strategies (e.g., build, buy, modify, or deprecate)
  - code: 1.1.10
    en: Success measurements (e.g., key performance indicators [KPI], return on investment [ROI], and metrics)
  - code: 1.1.11
    en: Security and compliance
  - code: 1.1.12
    en: Observability
- group:
    en: Designing a cloud solution infrastructure that meets technical requirements
  objectives:
  - code: 1.2.1
    en: Familiarity with the Google Cloud Well-Architected Framework
  - code: 1.2.2
    en: High availability and fail-over design
  - code: 1.2.3
    en: Flexibility of cloud resources
  - code: 1.2.4
    en: Scalability to meet growth requirements
  - code: 1.2.5
    en: Performance and latency
  - code: 1.2.6
    en: Gemini Cloud Assist
  - code: 1.2.7
    en: Backup and recovery
- group:
    en: Designing network, storage, and compute resources
  objectives:
  - code: 1.3.1
    en: Integration with on-premises/multicloud environments
  - code: 1.3.2
    en: Google Cloud AI and machine learning solutions (e.g., Gemini LLMs, Agent Builder, Model Garden, Gemini models, and AI Hypercomputer)
  - code: 1.3.3
    en: Cloud-native networking (e.g., virtual private cloud [VPC], peering, firewalls, load balancers, routing, container networking, shared VPC, and Private Service Connect)
  - code: 1.3.4
    en: Choosing data processing solutions
  - code: 1.3.5
    en: Choosing appropriate storage types (e.g., object, file, and databases)
  - code: 1.3.6
    en: Mapping compute needs to platform products (e.g., Google Kubernetes Engine [GKE], Cloud Run, and Cloud Run functions)
  - code: 1.3.7
    en: Choosing compute resources (e.g., spot VMs, custom machine types, and specialized workload)
- group:
    en: Creating a migration plan (i.e., documents and architectural diagrams)
  objectives:
  - code: 1.4.1
    en: Integrating solutions with existing systems
  - code: 1.4.2
    en: Assessing and migrating systems and data to support the solution (e.g., Google Cloud Migration Center)
  - code: 1.4.3
    en: Using migration methodologies, workload testing, network planning, and dependency planning
  - code: 1.4.4
    en: Determining software license implications and financial impact
- group:
    en: Envisioning future solution improvements
  objectives:
  - code: 1.5.1
    en: Cloud and technology improvements
  - code: 1.5.2
    en: Evolution of business needs
  - code: 1.5.3
    en: Cloud-first design approach
provisioning:
- group:
    en: Configuring network topologies
  objectives:
  - code: 2.1.1
    en: Extending to on-premises environments (hybrid networking)
  - code: 2.1.2
    en: Extending to a multicloud environment that may include Google Cloud-to-Google Cloud communication
  - code: 2.1.3
    en: Security protection (e.g. intrusion protection, access control, and firewalls)
  - code: 2.1.4
    en: VPC design and load balancing (e.g., access to cloud, internet, and cloud adjacent services)
- group:
    en: Configuring individual storage systems
  objectives:
  - code: 2.2.1
    en: Data storage allocation
  - code: 2.2.2
    en: Data processing and compute provisioning
  - code: 2.2.3
    en: Security and access management
  - code: 2.2.4
    en: Configuration for data transfer and latency
  - code: 2.2.5
    en: Data retention and data lifecycle management
  - code: 2.2.6
    en: Data growth planning
  - code: 2.2.7
    en: Data protection (e.g., backup and recovery)
- group:
    en: Configuring compute systems
  objectives:
  - code: 2.3.1
    en: Compute resource provisioning
  - code: 2.3.2
    en: Compute volatility configuration (spot vs. standard)
  - code: 2.3.3
    en: Cloud-native network configuration for compute resources (e.g., Compute Engine, GKE, serverless networking, and Google Cloud VMware Engine)
  - code: 2.3.4
    en: Infrastructure orchestration, resource configuration, and patch management
  - code: 2.3.5
    en: Container orchestration
  - code: 2.3.6
    en: Serverless computing
- group:
    en: Leveraging Gemini Enterprise Agent Platform for end-to-end ML workflows
  objectives:
  - code: 2.4.1
    en: Using Agent Platform Pipelines to automate and orchestrate the ML lifecycle
  - code: 2.4.2
    en: Preparing for Agent Platform data integration
  - code: 2.4.3
    en: Using AI Hypercomputer (e.g., using AI Hypercomputer, Cloud Run functions, and Agent Platform for ML/AI workloads; integrating GPUs and TPUs in ML model training and serving; optimizing for different
      consumption models; running large-scale AI model trainings)
- group:
    en: Configuring prebuilt solutions or APIs with Agent Platform
  objectives:
  - code: 2.5.1
    en: Differentiating between the Google AI APIs (e.g., Search, Conversation, Vision, Image, Video, and Audio)
  - code: 2.5.2
    en: Integrating Gemini Enterprise features (AI Agents and NotebookLM) to enhance workflows
  - code: 2.5.3
    en: Integrating AI models from Model Garden into the solution
security:
- group:
    en: Designing for security
  objectives:
  - code: 3.1.1
    en: Identity and Access Management (IAM)
  - code: 3.1.2
    en: Resource hierarchy (organizations, folders, and projects)
  - code: 3.1.3
    en: Data security (key management, encryption, secret management)
  - code: 3.1.4
    en: Separation of duties
  - code: 3.1.5
    en: Security controls (e.g., auditing, VPC Service Controls, context aware access, organization policy, and hierarchical firewall policy)
  - code: 3.1.6
    en: Managing customer-managed encryption keys with Cloud Key Management Service (Cloud KMS)
  - code: 3.1.7
    en: Secure remote access (e.g., Identity-Aware Proxy, service account impersonation, Chrome Enterprise Premium, and Workload Identity Federation)
  - code: 3.1.8
    en: Securing software supply chain
  - code: 3.1.9
    en: Securing AI (e.g., Model Armor, Sensitive Data Protection, and secure model deployment)
- group:
    en: Designing for compliance
  objectives:
  - code: 3.2.1
    en: Legislation and regulation (e.g., health record privacy, children's privacy, data privacy, ownership, and data sovereignty)
  - code: 3.2.2
    en: Commercial (e.g., sensitive data such as credit card information handling and personally identifiable information [PII])
  - code: 3.2.3
    en: Industry certifications (e.g., SOC 2)
  - code: 3.2.4
    en: Audits (including logs)
processes:
- group:
    en: Analyzing and defining technical processes
  objectives:
  - code: 4.1.1
    en: Software development lifecycle (SDLC)
  - code: 4.1.2
    en: Continuous integration/continuous deployment
  - code: 4.1.3
    en: Troubleshooting/root cause analysis best practices
  - code: 4.1.4
    en: Testing and validation of software and infrastructure
  - code: 4.1.5
    en: Service catalog and provisioning
  - code: 4.1.6
    en: Disaster recovery
- group:
    en: Analyzing and defining business processes
  objectives:
  - code: 4.2.1
    en: Stakeholder management (e.g., influencing and facilitation)
  - code: 4.2.2
    en: Change management
  - code: 4.2.3
    en: Team assessment/skills readiness
  - code: 4.2.4
    en: Decision-making processes
  - code: 4.2.5
    en: Customer success management
  - code: 4.2.6
    en: Cost optimization/resource optimization (CapEx/OpEx)
  - code: 4.2.7
    en: Business continuity
implementation:
- group:
    en: Advising development and operation teams to ensure the successful deployment of the solution
  objectives:
  - code: 5.1.1
    en: Application and infrastructure deployment
  - code: 5.1.2
    en: API management best practices (e.g., Apigee)
  - code: 5.1.3
    en: Testing frameworks (load/unit/integration)
  - code: 5.1.4
    en: Data and system migration and management tooling
  - code: 5.1.5
    en: Gemini Cloud Assist
- group:
    en: Interacting with Google Cloud programmatically
  objectives:
  - code: 5.2.1
    en: Cloud Shell Editor, Cloud Code, and Cloud Shell Terminal
  - code: 5.2.2
    en: Google Cloud SDKs (e.g., gcloud, gsutil, and bq)
  - code: 5.2.3
    en: Cloud Emulators (e.g., Bigtable, Spanner, Pub/Sub, and Firestore)
  - code: 5.2.4
    en: Infrastructure as Code (e.g., IaC and Terraform)
  - code: 5.2.5
    en: Accessing Google API best practices
  - code: 5.2.6
    en: Google API client libraries
operations:
- group:
    en: Understanding the principles and recommendations of the operational excellence pillar of the Google Cloud Well-Architected Framework
  objectives:
  - code: 6.1.1
    en: Understanding the principles and recommendations of the operational excellence pillar of the Google Cloud Well-Architected Framework
- group:
    en: Familiarity with Google Cloud Observability solutions
  objectives:
  - code: 6.2.1
    en: Monitoring and logging
  - code: 6.2.2
    en: Profiling and benchmarking
  - code: 6.2.3
    en: Alerting strategies
- group:
    en: Deployment and release management
  objectives:
  - code: 6.3.1
    en: Deployment and release management
- group:
    en: Assisting with the support of deployed solutions
  objectives:
  - code: 6.4.1
    en: Assisting with the support of deployed solutions
- group:
    en: Evaluating quality control measures
  objectives:
  - code: 6.5.1
    en: Evaluating quality control measures
- group:
    en: Ensuring the reliability of solutions in production (e.g., chaos engineering, penetration testing, and load testing)
  objectives:
  - code: 6.6.1
    en: Ensuring the reliability of solutions in production (e.g., chaos engineering, penetration testing, and load testing)
