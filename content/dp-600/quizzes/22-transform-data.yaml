  # ------------------------------------------------------------------ 9
  - id: dp600-qz-22-09
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        A lakehouse named **LH-Gold** contains a Delta dimension table named **gold_dim_customer**. Its surrogate key, **CustomerKey** (bigint), was generated by notebooks. The table contains an Unknown member with the key -1, and the keys of some deleted test rows left gaps. The Delta table **silver_customer** contains every current customer, existing or new, with the same columns as gold_dim_customer except CustomerKey.

        You are writing a notebook cell that appends only the customers that aren't in gold_dim_customer yet. Each new customer must get a CustomerKey that is unique and greater than every existing key, assigned in the order of the **FirstSeenDate** column. Several new customers can share the same FirstSeenDate. Existing keys must not change.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un lakehouse nommé **LH-Gold** contient une table de dimension Delta nommée **gold_dim_customer**. Sa clé de substitution, **CustomerKey** (bigint), a été générée par des notebooks. La table contient un membre Unknown de clé -1, et les clés de quelques lignes de test supprimées ont laissé des trous. La table Delta **silver_customer** contient tous les clients actuels, existants ou nouveaux, avec les mêmes colonnes que gold_dim_customer, sauf CustomerKey.

        Vous écrivez une cellule de notebook qui ajoute uniquement les clients qui ne sont pas encore dans gold_dim_customer. Chaque nouveau client doit obtenir une CustomerKey unique et supérieure à toutes les clés existantes, attribuée dans l'ordre de la colonne **FirstSeenDate**. Plusieurs nouveaux clients peuvent avoir la même FirstSeenDate. Les clés existantes ne doivent pas changer.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        from pyspark.sql import Window, functions as F

        dim = spark.read.table("gold_dim_customer")
        new_customers = (spark.read.table("silver_customer")
            .join(dim.select("CustomerID"), on="CustomerID", how="[[how]]"))

        max_key = dim.agg(F.[[agg]]("CustomerKey")).first()[0]
        w = Window.[[win]]("FirstSeenDate")

        new_rows = new_customers.withColumn("CustomerKey", F.[[fn]]().over(w) + max_key)
        new_rows.write.mode("append").saveAsTable("gold_dim_customer")
      slots:
        - id: how
          options:
            - { id: left, text: left }
            - { id: inner, text: inner }
            - { id: leftanti, text: left_anti }
        - id: agg
          options:
            - { id: count, text: count }
            - { id: max, text: max }
            - { id: min, text: min }
        - id: win
          options:
            - { id: orderby, text: orderBy }
            - { id: partitionby, text: partitionBy }
        - id: fn
          options:
            - { id: rank, text: rank }
            - { id: denserank, text: dense_rank }
            - { id: rownumber, text: row_number }
    answer:
      values: { how: leftanti, agg: max, win: orderby, fn: rownumber }
    explanation:
      correct:
        en: |
          A `left_anti` join keeps the silver customers that have no match in the dimension, that is, the new ones. Spark has no IDENTITY column, so the keys are built from `row_number()` over a window ordered by FirstSeenDate plus the current maximum key: `row_number()` breaks ties, so customers that share a date still get distinct keys, and adding `max` keeps every new key above the existing ones despite the gaps and the -1 member.
        fr: |
          Une jointure `left_anti` conserve les clients de silver qui n'ont pas de correspondance dans la dimension, c'est-à-dire les nouveaux. Spark n'a pas de colonne IDENTITY : les clés se construisent avec `row_number()` sur une fenêtre triée par FirstSeenDate, plus la clé maximale actuelle. `row_number()` départage les égalités, donc des clients de même date obtiennent des clés distinctes, et l'ajout de `max` place chaque nouvelle clé au-dessus des clés existantes malgré les trous et le membre -1.
      options:
        left: { en: "A left join keeps every silver customer, so the existing customers would be appended a second time.", fr: "Une jointure gauche conserve tous les clients de silver : les clients existants seraient ajoutés une seconde fois." }
        inner: { en: "An inner join keeps only the customers already in the dimension, the opposite of the requirement.", fr: "Une jointure interne ne conserve que les clients déjà présents dans la dimension, l'inverse de l'exigence." }
        count: { en: "Because of the gaps and the -1 member, the row count is lower than the highest key, so new keys would collide with existing ones.", fr: "À cause des trous et du membre -1, le nombre de lignes est inférieur à la plus grande clé : les nouvelles clés entreraient en collision avec des clés existantes." }
        min: { en: "The minimum is -1, so the new keys would start at 0 and collide with existing keys.", fr: "Le minimum vaut -1 : les nouvelles clés commenceraient à 0 et entreraient en collision avec des clés existantes." }
        partitionby: { en: "row_number() needs an ordered window, and partitioning by FirstSeenDate would restart the numbering for each date.", fr: "row_number() exige une fenêtre triée, et partitionner par FirstSeenDate recommencerait la numérotation à chaque date." }
        rank: { en: "rank gives the same number to customers that share a FirstSeenDate, so they would get the same key.", fr: "rank attribue le même numéro aux clients qui partagent une FirstSeenDate : ils obtiendraient la même clé." }
        denserank: { en: "dense_rank also repeats the number for ties, so keys wouldn't be unique.", fr: "dense_rank répète aussi le numéro en cas d'égalité : les clés ne seraient pas uniques." }
    references:
      - title: row_number ranking window function
        url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/row_number
      - title: Load Tables in a Dimensional Model
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables

  # ------------------------------------------------------------------ 10
  - id: dp600-qz-22-10
    objective: "2.2.8"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        A Fabric warehouse named **WH-Logistics** contains a fact table named **dbo.FactShipment**. Its **ShipDate** column uses the `varchar(10)` data type and contains dates such as `2026-11-24`. You need ShipDate to use the `date` data type. The solution must meet the following requirements:

        - The column must keep the name ShipDate and its existing values.
        - Permissions are granted on dbo.FactShipment, so the table must not be dropped or re-created.

        Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Un entrepôt Fabric nommé **WH-Logistics** contient une table de faits nommée **dbo.FactShipment**. Sa colonne **ShipDate** utilise le type de données `varchar(10)` et contient des dates comme `2026-11-24`. Vous devez faire en sorte que ShipDate utilise le type de données `date`. La solution doit satisfaire les exigences suivantes :

        - La colonne doit garder le nom ShipDate et ses valeurs existantes.
        - Des autorisations sont accordées sur dbo.FactShipment : la table ne doit être ni supprimée ni recréée.

        Quelles quatre actions devez-vous effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste d'actions vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 4
      actions:
        - { id: alter, text: { en: "Run ALTER TABLE ... ALTER COLUMN to change ShipDate to date.", fr: "Exécuter ALTER TABLE ... ALTER COLUMN pour passer ShipDate en date." } }
        - { id: add, text: { en: "Run ALTER TABLE to add a nullable date column named ShipDateNew.", fr: "Exécuter ALTER TABLE pour ajouter une colonne date nullable nommée ShipDateNew." } }
        - { id: addnn, text: { en: "Run ALTER TABLE to add a NOT NULL date column named ShipDateNew.", fr: "Exécuter ALTER TABLE pour ajouter une colonne date NOT NULL nommée ShipDateNew." } }
        - { id: upd, text: { en: "Run an UPDATE that sets ShipDateNew to CAST(ShipDate AS date).", fr: "Exécuter un UPDATE qui affecte CAST(ShipDate AS date) à ShipDateNew." } }
        - { id: drop, text: { en: "Run ALTER TABLE to drop the ShipDate column.", fr: "Exécuter ALTER TABLE pour supprimer la colonne ShipDate." } }
        - { id: ren, text: { en: "Run sp_rename to rename ShipDateNew to ShipDate.", fr: "Exécuter sp_rename pour renommer ShipDateNew en ShipDate." } }
        - { id: ctas, text: { en: "Run CREATE TABLE AS SELECT to build dbo.FactShipment2 with CAST(ShipDate AS date).", fr: "Exécuter CREATE TABLE AS SELECT pour créer dbo.FactShipment2 avec CAST(ShipDate AS date)." } }
    answer:
      sequence: [add, upd, drop, ren]
    explanation:
      correct:
        en: |
          In a warehouse, ALTER TABLE can add only nullable columns and drop columns, and the column name is changed with sp_rename. So you add a nullable date column, copy the converted values with UPDATE, drop the varchar column, and only then rename the new column to ShipDate, because the name is free once the old column is gone. The table itself is never re-created, so its permissions stay in place.
        fr: |
          Dans un entrepôt, ALTER TABLE ne peut qu'ajouter des colonnes nullables et supprimer des colonnes, et le nom d'une colonne se change avec sp_rename. Vous ajoutez donc une colonne date nullable, copiez les valeurs converties avec UPDATE, supprimez la colonne varchar, et seulement ensuite renommez la nouvelle colonne en ShipDate, car le nom n'est libre qu'une fois l'ancienne colonne supprimée. La table elle-même n'est jamais recréée : ses autorisations restent en place.
      options:
        alter: { en: "ALTER COLUMN is in preview and supports only metadata-only changes; converting varchar to date requires the stored data to be validated and rewritten.", fr: "ALTER COLUMN est en préversion et ne prend en charge que des modifications de métadonnées seules ; convertir du varchar en date exige de valider et de réécrire les données stockées." }
        addnn: { en: "ALTER TABLE in a warehouse can only add nullable columns.", fr: "ALTER TABLE dans un entrepôt ne peut ajouter que des colonnes nullables." }
        ctas: { en: "CTAS creates a new table, so dbo.FactShipment would have to be dropped and replaced, which loses its permissions.", fr: "CTAS crée une nouvelle table : dbo.FactShipment devrait être supprimée et remplacée, ce qui fait perdre ses autorisations." }
    references:
      - title: T-SQL Surface Area in Fabric Data Warehouse
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
      - title: ALTER TABLE (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-table-transact-sql
