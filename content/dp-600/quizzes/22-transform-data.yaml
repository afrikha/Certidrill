chapter: 22-transform-data
questions:
  # ------------------------------------------------------------------ 1
  - id: dp600-qz-22-01
    objective: "2.2.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A Fabric warehouse named **WH-Shop** contains the tables **dbo.Sales2025** and **dbo.Sales2026**, which have the same columns in the same order. The tables have no unique column, and two sales can legitimately have identical values in every column.

        You need to create a view that returns every row of both tables. Which operator should the view use?
      fr: |
        Un entrepôt Fabric nommé **WH-Shop** contient les tables **dbo.Sales2025** et **dbo.Sales2026**, qui ont les mêmes colonnes dans le même ordre. Les tables n'ont aucune colonne unique, et deux ventes peuvent légitimement avoir des valeurs identiques dans toutes les colonnes.

        Vous devez créer une vue qui renvoie toutes les lignes des deux tables. Quel opérateur la vue doit-elle utiliser ?
    body:
      options:
        - { id: a, text: "`UNION`" }
        - { id: b, text: "`INTERSECT`" }
        - { id: c, text: "`FULL OUTER JOIN`" }
        - { id: d, text: "`UNION ALL`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `UNION ALL` stacks the rows of both queries and keeps the duplicates, so two identical sales both stay in the result. It also skips the work of comparing rows to remove duplicates.
        fr: |
          `UNION ALL` empile les lignes des deux requêtes et conserve les doublons : deux ventes identiques restent toutes les deux dans le résultat. Il évite aussi le travail de comparaison des lignes pour éliminer les doublons.
      options:
        a: { en: "`UNION` removes duplicate rows, so identical sales would be returned only once.", fr: "`UNION` élimine les lignes en double : des ventes identiques ne seraient renvoyées qu'une fois." }
        b: { en: "`INTERSECT` returns only the rows present in both tables.", fr: "`INTERSECT` ne renvoie que les lignes présentes dans les deux tables." }
        c: { en: "A join combines columns of matching rows side by side instead of stacking the rows, and it needs a join key.", fr: "Une jointure combine côte à côte les colonnes des lignes correspondantes au lieu d'empiler les lignes, et elle exige une clé de jointure." }
    references:
      - title: Set Operators - UNION (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/set-operators-union-transact-sql

  # ------------------------------------------------------------------ 2
  - id: dp600-qz-22-02
    objective: "2.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A Fabric warehouse contains a dimension table named **DimSalesperson** with one row per salesperson. Salespeople are sometimes moved to another sales region.

        Reports must show, on the same row, the current region of each salesperson and the region held just before the last move. Older regions aren't needed, and the table must keep one row per salesperson.

        Which type of slowly changing dimension should you use for the region?
      fr: |
        Un entrepôt Fabric contient une table de dimension nommée **DimSalesperson** avec une ligne par commercial. Les commerciaux changent parfois de région commerciale.

        Les rapports doivent afficher, sur la même ligne, la région actuelle de chaque commercial et la région occupée juste avant le dernier changement. Les régions plus anciennes ne sont pas nécessaires, et la table doit conserver une ligne par commercial.

        Quel type de dimension à variation lente devez-vous utiliser pour la région ?
    shuffle: false
    body:
      options:
        - { id: a, text: Type 1 }
        - { id: b, text: Type 2 }
        - { id: c, text: Type 3 }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Type 3 keeps limited history in extra columns: the previous region moves to a column such as PreviousRegion and the current region is overwritten. The row stays unique per salesperson, and only the last change is recorded, which is exactly the requirement.
        fr: |
          Le type 3 conserve un historique limité dans des colonnes supplémentaires : la région précédente passe dans une colonne comme PreviousRegion et la région actuelle est écrasée. La ligne reste unique par commercial, et seul le dernier changement est enregistré, ce qui correspond exactement à l'exigence.
      options:
        a: { en: "Type 1 overwrites the region and loses the previous value.", fr: "Le type 1 écrase la région et perd la valeur précédente." }
        b: { en: "Type 2 adds a row per change, so a salesperson would have several rows.", fr: "Le type 2 ajoute une ligne par changement : un commercial aurait plusieurs lignes." }
    references:
      - title: "Dimensional modeling in Microsoft Fabric Warehouse: Dimension tables"
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables

  # ------------------------------------------------------------------ 3
  - id: dp600-qz-22-03
    objective: "2.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        In a Fabric warehouse named **WH-Retail**, the following query returns one row per store and month:

        ```sql
        SELECT StoreID, MonthStart, SUM(Amount) AS TotalAmount, COUNT(*) AS OrderLines
        FROM silver.Sales
        GROUP BY ALL;
        ```

        A developer adds the CustomerID column to the SELECT list, after MonthStart, only to display it. The query now returns many more rows, and the totals are smaller.

        What explains the result?
      fr: |
        Dans un entrepôt Fabric nommé **WH-Retail**, la requête suivante renvoie une ligne par magasin et par mois :

        ```sql
        SELECT StoreID, MonthStart, SUM(Amount) AS TotalAmount, COUNT(*) AS OrderLines
        FROM silver.Sales
        GROUP BY ALL;
        ```

        Un développeur ajoute la colonne CustomerID à la liste SELECT, après MonthStart, uniquement pour l'afficher. La requête renvoie maintenant beaucoup plus de lignes, et les totaux sont plus petits.

        Qu'est-ce qui explique ce résultat ?
    body:
      options:
        - { id: a, text: { en: "GROUP BY ALL also returns the groups that the WHERE clause would exclude.", fr: "GROUP BY ALL renvoie aussi les groupes que la clause WHERE exclurait." } }
        - { id: b, text: { en: "GROUP BY ALL now also groups by CustomerID, so each store and month is split by customer.", fr: "GROUP BY ALL regroupe désormais aussi par CustomerID : chaque magasin et chaque mois sont découpés par client." } }
        - { id: c, text: { en: "GROUP BY ALL groups by every column of silver.Sales, whether it is selected or not.", fr: "GROUP BY ALL regroupe par toutes les colonnes de silver.Sales, qu'elles soient sélectionnées ou non." } }
        - { id: d, text: { en: "A non-aggregated column turns off the aggregation, so one row is returned per order line.", fr: "Une colonne non agrégée désactive l'agrégation : une ligne est renvoyée par ligne de commande." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In Fabric Data Warehouse, `GROUP BY ALL` without a column list groups by every non-aggregated expression of the SELECT list. Adding CustomerID to the SELECT list silently adds it to the grouping, which changes the grain from store and month to store, month and customer.
        fr: |
          Dans Fabric Data Warehouse, `GROUP BY ALL` sans liste de colonnes regroupe par toutes les expressions non agrégées de la liste SELECT. Ajouter CustomerID à la liste SELECT l'ajoute silencieusement au regroupement, ce qui fait passer le grain de magasin et mois à magasin, mois et client.
      options:
        a: { en: "That is the legacy GROUP BY ALL with a column list of SQL Server; the query has no WHERE clause anyway.", fr: "C'est le GROUP BY ALL hérité de SQL Server, avec liste de colonnes ; la requête n'a de toute façon pas de clause WHERE." }
        c: { en: "Only the non-aggregated expressions of the SELECT list are used, not the other columns of the table.", fr: "Seules les expressions non agrégées de la liste SELECT sont utilisées, pas les autres colonnes de la table." }
        d: { en: "The query still aggregates; it returns one row per distinct store, month and customer, not per order line.", fr: "La requête agrège toujours ; elle renvoie une ligne par combinaison distincte de magasin, mois et client, pas par ligne de commande." }
    references:
      - title: SELECT - GROUP BY clause (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-group-by-transact-sql

  # ------------------------------------------------------------------ 4
  - id: dp600-qz-22-04
    objective: "2.2.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A lakehouse named **LH-Sales** contains a 4 TB Delta table named **silver_sales** that is partitioned by an integer column named **OrderYear**. The table also has a date column named **OrderDate**. A notebook reads the 2026 sales as follows:

        ```python
        df = (spark.read.table("silver_sales")
            .filter(F.year("OrderDate") == 2026))
        ```

        The Spark UI shows that the query reads files from every partition of the table. You need the notebook to read only the data of 2026. The solution must minimize changes to the code.

        How should you change the filter?
      fr: |
        Un lakehouse nommé **LH-Sales** contient une table Delta de 4 To nommée **silver_sales**, partitionnée par une colonne entière nommée **OrderYear**. La table a aussi une colonne de date nommée **OrderDate**. Un notebook lit les ventes de 2026 ainsi :

        ```python
        df = (spark.read.table("silver_sales")
            .filter(F.year("OrderDate") == 2026))
        ```

        L'interface Spark montre que la requête lit des fichiers de toutes les partitions de la table. Vous devez faire en sorte que le notebook ne lise que les données de 2026. La solution doit réduire au minimum les modifications du code.

        Comment devez-vous modifier le filtre ?
    body:
      options:
        - { id: a, text: "`.filter(F.col(\"OrderYear\") == 2026)`" }
        - { id: b, text: "`.repartition(\"OrderYear\").filter(F.year(\"OrderDate\") == 2026)`" }
        - { id: c, text: "`.cache().filter(F.year(\"OrderDate\") == 2026)`" }
        - { id: d, text: "`.filter(F.col(\"OrderDate\").cast(\"string\").startswith(\"2026\"))`" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          With Hive-style partitioning, each OrderYear value is a separate directory, and the engine skips whole directories only when the query filters on the partition column itself. A filter on an expression of OrderDate, which isn't the partition column, doesn't tell Spark which directories to skip.
        fr: |
          Avec le partitionnement de style Hive, chaque valeur d'OrderYear est un répertoire distinct, et le moteur n'ignore des répertoires entiers que lorsque la requête filtre sur la colonne de partition elle-même. Un filtre sur une expression d'OrderDate, qui n'est pas la colonne de partition, n'indique pas à Spark quels répertoires ignorer.
      options:
        b: { en: "Repartitioning shuffles the data after it has been read; every partition is still read first.", fr: "Le repartitionnement redistribue les données après leur lecture ; toutes les partitions sont quand même lues d'abord." }
        c: { en: "Caching keeps the data that was read in memory; it doesn't reduce what the first read scans.", fr: "La mise en cache garde en mémoire les données lues ; elle ne réduit pas ce que la première lecture parcourt." }
        d: { en: "This is still an expression on OrderDate, not a filter on the partition column, so no directory is skipped.", fr: "C'est toujours une expression sur OrderDate, pas un filtre sur la colonne de partition : aucun répertoire n'est ignoré." }
    references:
      - title: Partitioning for Delta tables
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/delta-lake-partitioning

  # ------------------------------------------------------------------ 5
  - id: dp600-qz-22-05
    objective: "2.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        In a Fabric warehouse named **WH-CRM**, a view named **dbo.vCustomerAll** was created without SCHEMABINDING as `SELECT * FROM dbo.DimCustomer`. Yesterday, a developer dropped the Fax column of dbo.DimCustomer and added a Segment column. Since then, queries on the view return unexpected results.

        The view is deployed by a release process, so you must not run CREATE, ALTER or DROP statements on it.

        What should you run?
      fr: |
        Dans un entrepôt Fabric nommé **WH-CRM**, une vue nommée **dbo.vCustomerAll** a été créée sans SCHEMABINDING sous la forme `SELECT * FROM dbo.DimCustomer`. Hier, un développeur a supprimé la colonne Fax de dbo.DimCustomer et ajouté une colonne Segment. Depuis, les requêtes sur la vue renvoient des résultats inattendus.

        La vue est déployée par un processus de mise en production : vous ne devez exécuter aucune instruction CREATE, ALTER ou DROP sur elle.

        Que devez-vous exécuter ?
    body:
      options:
        - { id: a, text: "`EXEC sys.sp_refreshview N'dbo.DimCustomer';`" }
        - { id: b, text: "`DBCC CHECKIDENT ('dbo.DimCustomer', RESEED);`" }
        - { id: c, text: "`EXEC sys.sp_refreshview N'dbo.vCustomerAll';`" }
        - { id: d, text: "`UPDATE STATISTICS dbo.DimCustomer;`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The stored metadata of a view that isn't schema-bound can become outdated when its underlying table changes. `sp_refreshview`, which is supported in Fabric Warehouse, updates the metadata of the named view without re-creating it.
        fr: |
          Les métadonnées stockées d'une vue qui n'est pas liée au schéma peuvent devenir obsolètes quand sa table sous-jacente change. `sp_refreshview`, pris en charge dans l'entrepôt Fabric, met à jour les métadonnées de la vue nommée sans la recréer.
      options:
        a: { en: "sp_refreshview takes the name of a view; dbo.DimCustomer is the table, so the view's metadata isn't refreshed.", fr: "sp_refreshview prend le nom d'une vue ; dbo.DimCustomer est la table, donc les métadonnées de la vue ne sont pas actualisées." }
        b: { en: "DBCC CHECKIDENT reseeds an IDENTITY column; it doesn't touch view metadata.", fr: "DBCC CHECKIDENT réinitialise une colonne IDENTITY ; il ne touche pas aux métadonnées des vues." }
        d: { en: "Statistics help the optimizer choose a plan; they don't change the column list stored for the view.", fr: "Les statistiques aident l'optimiseur à choisir un plan ; elles ne modifient pas la liste de colonnes stockée pour la vue." }
    references:
      - title: sys.sp_refreshview (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-refreshview-transact-sql

  # ------------------------------------------------------------------ 6
  - id: dp600-qz-22-06
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A Fabric warehouse named **WH-Purchasing** contains a table named **dbo.DimSupplier** with 40,000 rows. Its business key is **SupplierID**, a varchar column, and it has no surrogate key. A stored procedure inserts new suppliers every night.

        You need to add a surrogate key named **SupplierKey** whose values are generated automatically for the existing rows and for every row that the procedure inserts later. Queries must keep using the name dbo.DimSupplier. No fact table references the dimension yet.

        What should you do?
      fr: |
        Un entrepôt Fabric nommé **WH-Purchasing** contient une table nommée **dbo.DimSupplier** de 40 000 lignes. Sa clé métier est **SupplierID**, une colonne varchar, et elle n'a pas de clé de substitution. Une procédure stockée insère de nouveaux fournisseurs chaque nuit.

        Vous devez ajouter une clé de substitution nommée **SupplierKey** dont les valeurs sont générées automatiquement pour les lignes existantes et pour toutes les lignes que la procédure insérera ensuite. Les requêtes doivent continuer d'utiliser le nom dbo.DimSupplier. Aucune table de faits ne référence encore la dimension.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run ALTER TABLE to add SupplierKey to dbo.DimSupplier as a bigint IDENTITY column.", fr: "Exécuter ALTER TABLE pour ajouter SupplierKey à dbo.DimSupplier comme colonne bigint IDENTITY." } }
        - { id: b, text: { en: "Add SupplierKey as a nullable bigint column, and fill it with ROW_NUMBER() values in an UPDATE.", fr: "Ajouter SupplierKey comme colonne bigint nullable, puis la remplir de valeurs ROW_NUMBER() dans un UPDATE." } }
        - { id: c, text: { en: "Copy the rows into a new table that has a bigint IDENTITY column, and replace dbo.DimSupplier with it.", fr: "Copier les lignes dans une nouvelle table dotée d'une colonne bigint IDENTITY, puis remplacer dbo.DimSupplier par celle-ci." } }
        - { id: d, text: { en: "Run ALTER TABLE to add SupplierKey as a uniqueidentifier column with a DEFAULT NEWID() constraint.", fr: "Exécuter ALTER TABLE pour ajouter SupplierKey comme colonne uniqueidentifier avec une contrainte DEFAULT NEWID()." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Fabric Data Warehouse doesn't support adding an IDENTITY column to an existing table with ALTER TABLE; the documented workaround is to copy the table into a new one that has the IDENTITY column. Once the new table, with SupplierKey as bigint IDENTITY, is loaded and renamed to dbo.DimSupplier, the system generates the keys of the existing rows and of every later insert.
        fr: |
          Fabric Data Warehouse ne permet pas d'ajouter une colonne IDENTITY à une table existante avec ALTER TABLE ; la solution documentée consiste à copier la table dans une nouvelle table dotée de la colonne IDENTITY. Une fois la nouvelle table, avec SupplierKey en bigint IDENTITY, chargée et renommée en dbo.DimSupplier, le système génère les clés des lignes existantes et de chaque insertion ultérieure.
      options:
        a: { en: "Adding an IDENTITY column to an existing table with ALTER TABLE isn't supported in Fabric Data Warehouse.", fr: "L'ajout d'une colonne IDENTITY à une table existante avec ALTER TABLE n'est pas pris en charge dans Fabric Data Warehouse." }
        b: { en: "The existing rows would get keys, but the rows inserted later wouldn't get a value automatically.", fr: "Les lignes existantes obtiendraient des clés, mais les lignes insérées ensuite n'obtiendraient pas de valeur automatiquement." }
        d: { en: "ALTER TABLE in a warehouse can only add nullable columns without a DEFAULT constraint, and GUID keys make poor surrogate keys.", fr: "ALTER TABLE dans un entrepôt ne peut ajouter que des colonnes nullables sans contrainte DEFAULT, et des clés GUID font de mauvaises clés de substitution." }
    references:
      - title: IDENTITY Columns in Fabric Data Warehouse
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/identity
      - title: T-SQL Surface Area in Fabric Data Warehouse
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area

  # ------------------------------------------------------------------ 7
  - id: dp600-qz-22-07
    objective: "2.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A Fabric warehouse named **WH-Retail** contains two staging tables:

        - **stg.Customer** (CustomerID, CustomerName, PostalCode, CountryCode): 500,000 rows, one per CustomerID
        - **stg.Geography** (PostalCode, CountryCode, City, Region): one row per combination of PostalCode and CountryCode. The same postal code exists in several countries.

        You created a denormalized customer dimension by running the following statement:

        ```sql
        CREATE TABLE dbo.DimCustomer AS
        SELECT c.CustomerID, c.CustomerName, g.City, g.Region
        FROM stg.Customer AS c
        LEFT JOIN stg.Geography AS g ON g.PostalCode = c.PostalCode;
        ```

        dbo.DimCustomer contains 512,000 rows, and some customers show the wrong city. You need dbo.DimCustomer to contain exactly one row per customer, with the city of the customer's country.

        What should you change?
      fr: |
        Un entrepôt Fabric nommé **WH-Retail** contient deux tables de préproduction :

        - **stg.Customer** (CustomerID, CustomerName, PostalCode, CountryCode) : 500 000 lignes, une par CustomerID
        - **stg.Geography** (PostalCode, CountryCode, City, Region) : une ligne par combinaison de PostalCode et CountryCode. Le même code postal existe dans plusieurs pays.

        Vous avez créé une dimension client dénormalisée en exécutant l'instruction suivante :

        ```sql
        CREATE TABLE dbo.DimCustomer AS
        SELECT c.CustomerID, c.CustomerName, g.City, g.Region
        FROM stg.Customer AS c
        LEFT JOIN stg.Geography AS g ON g.PostalCode = c.PostalCode;
        ```

        dbo.DimCustomer contient 512 000 lignes, et certains clients affichent une mauvaise ville. Vous devez faire en sorte que dbo.DimCustomer contienne exactement une ligne par client, avec la ville du pays du client.

        Que devez-vous modifier ?
    body:
      options:
        - { id: a, text: { en: "Replace the LEFT JOIN with an INNER JOIN on the same condition.", fr: "Remplacer le LEFT JOIN par un INNER JOIN sur la même condition." } }
        - { id: b, text: { en: "Add DISTINCT to the SELECT list of the statement.", fr: "Ajouter DISTINCT à la liste SELECT de l'instruction." } }
        - { id: c, text: { en: "Add a NOT ENFORCED primary key on CustomerID to dbo.DimCustomer.", fr: "Ajouter une clé primaire NOT ENFORCED sur CustomerID à dbo.DimCustomer." } }
        - { id: d, text: { en: "Add AND g.CountryCode = c.CountryCode to the join condition.", fr: "Ajouter AND g.CountryCode = c.CountryCode à la condition de jointure." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          stg.Geography is unique only on the pair PostalCode and CountryCode. Joining on PostalCode alone matches several geography rows for a customer whose postal code exists in several countries, which multiplies the customer rows (fan-out) and attaches cities of other countries. Joining on the full key returns at most one geography row per customer, and the LEFT JOIN still keeps the customers without a match.
        fr: |
          stg.Geography n'est unique que sur la paire PostalCode et CountryCode. Joindre sur PostalCode seul fait correspondre plusieurs lignes géographiques à un client dont le code postal existe dans plusieurs pays, ce qui multiplie les lignes du client (fan-out) et lui associe des villes d'autres pays. Joindre sur la clé complète renvoie au plus une ligne géographique par client, et le LEFT JOIN conserve toujours les clients sans correspondance.
      options:
        a: { en: "An INNER JOIN on the same condition still multiplies the rows, and it also drops the customers whose postal code has no match.", fr: "Un INNER JOIN sur la même condition multiplie toujours les lignes, et supprime en plus les clients dont le code postal n'a pas de correspondance." }
        b: { en: "The duplicated rows differ by City and Region, so DISTINCT keeps them all.", fr: "Les lignes dupliquées diffèrent par City et Region : DISTINCT les conserve toutes." }
        c: { en: "NOT ENFORCED constraints aren't checked, so they don't remove or reject the duplicate customers.", fr: "Les contraintes NOT ENFORCED ne sont pas vérifiées : elles ne suppriment ni ne rejettent les clients en double." }
    references:
      - title: Tables in Fabric Data Warehouse
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tables
      - title: "Dimensional modeling in Microsoft Fabric Warehouse: Dimension tables"
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables

  # ------------------------------------------------------------------ 8
  - id: dp600-qz-22-08
    objective: "2.2.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        A Fabric warehouse contains a staging table named **stg.Payments** with five rows. Its AmountText column (varchar) contains the values `100.00`, `250.00`, `n/a`, NULL and `150.00`.

        You run the following query:

        ```sql
        SELECT COUNT(*) AS AllRows,
               COUNT(TRY_CAST(AmountText AS decimal(10,2))) AS ValidRows,
               AVG(TRY_CAST(AmountText AS decimal(10,2))) AS AvgValid,
               AVG(COALESCE(TRY_CAST(AmountText AS decimal(10,2)), 0)) AS AvgZero
        FROM stg.Payments;
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un entrepôt Fabric contient une table de préproduction nommée **stg.Payments** de cinq lignes. Sa colonne AmountText (varchar) contient les valeurs `100.00`, `250.00`, `n/a`, NULL et `150.00`.

        Vous exécutez la requête suivante :

        ```sql
        SELECT COUNT(*) AS AllRows,
               COUNT(TRY_CAST(AmountText AS decimal(10,2))) AS ValidRows,
               AVG(TRY_CAST(AmountText AS decimal(10,2))) AS AvgValid,
               AVG(COALESCE(TRY_CAST(AmountText AS decimal(10,2)), 0)) AS AvgZero
        FROM stg.Payments;
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "AllRows returns 4."
            fr: "AllRows renvoie 4."
        - id: s2
          text:
            en: "ValidRows returns 3."
            fr: "ValidRows renvoie 3."
        - id: s3
          text:
            en: "AvgValid and AvgZero return the same value."
            fr: "AvgValid et AvgZero renvoient la même valeur."
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          `TRY_CAST` returns NULL for `n/a` instead of failing, and NULL stays NULL. `COUNT(*)` counts every row (5), while `COUNT(expression)` and `AVG` ignore nulls: ValidRows is 3 and AvgValid is 500 / 3, about 166.67. COALESCE turns the two nulls into 0, so AvgZero averages five values: 500 / 5 = 100.
        fr: |
          `TRY_CAST` renvoie NULL pour `n/a` au lieu d'échouer, et NULL reste NULL. `COUNT(*)` compte toutes les lignes (5), tandis que `COUNT(expression)` et `AVG` ignorent les valeurs null : ValidRows vaut 3 et AvgValid vaut 500 / 3, environ 166,67. COALESCE transforme les deux null en 0 : AvgZero fait donc la moyenne de cinq valeurs, 500 / 5 = 100.
      options:
        s1: { en: "COUNT(*) counts rows, including the row whose AmountText is NULL: it returns 5.", fr: "COUNT(*) compte les lignes, y compris celle dont AmountText est NULL : il renvoie 5." }
        s3: { en: "Replacing nulls with 0 adds two zeros to the average, which lowers it from about 166.67 to 100.", fr: "Remplacer les null par 0 ajoute deux zéros à la moyenne, qui passe d'environ 166,67 à 100." }
    references:
