chapter: 21-get-data
questions:
  # ------------------------------------------------------------------ 1
  - id: dp600-qz-21-01
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A Dataflow Gen2 named **DF-Payroll** merges two queries. The first query uses a connection named **Conn-HR** that reads salary data from a SharePoint list. The second query uses a connection named **Conn-Rates** that reads a public web API.

        You need Power Query to block any combination of the queries that could send the salary data to the web API.

        Which setting of Conn-HR should you configure?
      fr: |
        Un Dataflow Gen2 nommé **DF-Payroll** fusionne deux requêtes. La première requête utilise une connexion nommée **Conn-HR** qui lit des données salariales dans une liste SharePoint. La seconde requête utilise une connexion nommée **Conn-Rates** qui lit une API web publique.

        Vous devez faire en sorte que Power Query bloque toute combinaison des requêtes susceptible d'envoyer les données salariales à l'API web.

        Quel paramètre de Conn-HR devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "The authentication method", fr: "La méthode d'authentification" } }
        - { id: b, text: { en: "The privacy level", fr: "Le niveau de confidentialité" } }
        - { id: c, text: { en: "The option that allows the connection to be used with data gateways", fr: "L'option qui permet d'utiliser la connexion avec des passerelles de données" } }
        - { id: d, text: { en: "The list of users of the connection and their roles", fr: "La liste des utilisateurs de la connexion et leurs rôles" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The privacy level of a connection tells Power Query how isolated the source must stay when queries are combined. With Conn-HR set to Private, Power Query blocks any merge or folding that could pass its data to another source, such as the web API. The setting is optional and has no effect on DirectQuery connections.
        fr: |
          Le niveau de confidentialité d'une connexion indique à Power Query à quel point la source doit rester isolée quand des requêtes sont combinées. Avec Conn-HR au niveau Private, Power Query bloque toute fusion ou tout pliage susceptible de transmettre ses données à une autre source, comme l'API web. Ce paramètre est facultatif et n'a aucun effet sur les connexions DirectQuery.
      options:
        a: { en: "The authentication method decides which credentials reach SharePoint, not whether the data may flow to another source.", fr: "La méthode d'authentification détermine les informations d'identification présentées à SharePoint, pas si les données peuvent circuler vers une autre source." }
        c: { en: "This option only decides whether the connection can be used in gateway-based evaluations.", fr: "Cette option détermine seulement si la connexion peut servir dans des évaluations par une passerelle." }
        d: { en: "The access list controls who can use the connection in their items, not how Power Query combines sources.", fr: "La liste d'accès contrôle qui peut utiliser la connexion dans ses éléments, pas la manière dont Power Query combine les sources." }
    references:
      - title: Data source management
        url: https://learn.microsoft.com/en-us/fabric/data-factory/data-source-management
      - title: Privacy Levels in Power Query
        url: https://learn.microsoft.com/en-us/power-query/privacy-levels

  # ------------------------------------------------------------------ 2
  - id: dp600-qz-21-02
    objective: "2.1.3"
    difficulty: 1
    status: draft
    type: multi
    stem:
      en: |
        You plan to make data from several locations available in Fabric by using OneLake shortcuts.

        In which two types of Fabric items can you create a OneLake shortcut?

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous prévoyez de rendre disponibles dans Fabric des données de plusieurs emplacements à l'aide de raccourcis OneLake.

        Dans quels deux types d'éléments Fabric pouvez-vous créer un raccourci OneLake ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Lakehouse", fr: "Lakehouse" } }
        - { id: b, text: { en: "Warehouse", fr: "Entrepôt" } }
        - { id: c, text: { en: "KQL database", fr: "Base de données KQL" } }
        - { id: d, text: { en: "Semantic model", fr: "Modèle sémantique" } }
        - { id: e, text: { en: "Eventstream", fr: "Flux d'événements" } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Shortcuts are created in lakehouses and in KQL databases. Other items, such as a warehouse or a semantic model, can be the target of a shortcut, but the shortcut itself always lives in a lakehouse or a KQL database.
        fr: |
          Les raccourcis se créent dans les lakehouses et dans les bases de données KQL. D'autres éléments, comme un entrepôt ou un modèle sémantique, peuvent être la cible d'un raccourci, mais le raccourci lui-même se trouve toujours dans un lakehouse ou une base de données KQL.
      options:
        b: { en: "A warehouse can be the target of a shortcut created in a lakehouse, but you can't create a shortcut inside it.", fr: "Un entrepôt peut être la cible d'un raccourci créé dans un lakehouse, mais vous ne pouvez pas créer de raccourci à l'intérieur." }
        d: { en: "A semantic model can be a shortcut target (OneLake integration), not a place that holds shortcuts.", fr: "Un modèle sémantique peut être la cible d'un raccourci (intégration de OneLake), pas un emplacement qui contient des raccourcis." }
        e: { en: "An eventstream ingests and routes events; it has no folder in which to create shortcuts.", fr: "Un flux d'événements ingère et route des événements ; il n'a pas de dossier dans lequel créer des raccourcis." }
    references:
      - title: Unify Data Sources With OneLake Shortcuts
        url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts

  # ------------------------------------------------------------------ 3
  - id: dp600-qz-21-03
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has an Azure Database for PostgreSQL flexible server named **pg-orders** that is publicly accessible. Change data capture is enabled for a table named **public.orders**. A Fabric workspace contains an eventhouse with a KQL database named **KQL-Ops**.

        Each insert, update and delete in public.orders must reach KQL-Ops as an event within seconds, so that analysts can query the changes and set Activator alerts on cancelled orders. The solution must not require any code.

        What should you use?
      fr: |
        Woodgrove Bank dispose d'un serveur flexible Azure Database pour PostgreSQL nommé **pg-orders**, accessible publiquement. La capture des changements de données est activée pour une table nommée **public.orders**. Un espace de travail Fabric contient un eventhouse avec une base de données KQL nommée **KQL-Ops**.

        Chaque insertion, mise à jour et suppression dans public.orders doit arriver dans KQL-Ops sous forme d'événement en quelques secondes, afin que les analystes puissent interroger les changements et définir des alertes Activator sur les commandes annulées. La solution ne doit exiger aucun code.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "A mirrored database of pg-orders, queried from KQL-Ops through its SQL analytics endpoint", fr: "Une base de données en miroir de pg-orders, interrogée depuis KQL-Ops par son point de terminaison d'analytique SQL" } }
        - { id: b, text: { en: "A copy job that uses CDC-based incremental copy from pg-orders to a lakehouse every 15 minutes", fr: "Un travail de copie qui utilise la copie incrémentielle par CDC de pg-orders vers un lakehouse toutes les 15 minutes" } }
        - { id: c, text: { en: "The Azure DB for PostgreSQL (CDC) source of Real-Time hub, connected to an eventstream that routes to KQL-Ops", fr: "La source Azure DB for PostgreSQL (CDC) du hub Real-Time, connectée à un flux d'événements qui route vers KQL-Ops" } }
        - { id: d, text: { en: "The Explore tab of the OneLake catalog, to create a OneLake shortcut to public.orders in KQL-Ops", fr: "L'onglet Explore du catalogue OneLake, pour créer un raccourci OneLake vers public.orders dans KQL-Ops" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Real-Time hub connects streaming sources, including change data capture from Azure Database for PostgreSQL, without code. The CDC source captures the row-level changes of the selected tables into an eventstream, which routes them as events to a KQL database within seconds, where they can be queried and used by Activator alerts.
        fr: |
          Le hub Real-Time connecte des sources de streaming, dont la capture des changements de données d'Azure Database pour PostgreSQL, sans code. La source CDC capture les changements au niveau des lignes des tables choisies dans un flux d'événements, qui les route sous forme d'événements vers une base de données KQL en quelques secondes ; ils peuvent alors y être interrogés et alimenter des alertes Activator.
      options:
        a: { en: "Mirroring keeps a replica of the tables in OneLake; it doesn't deliver each change as an event to a KQL database.", fr: "La mise en miroir maintient une réplique des tables dans OneLake ; elle ne livre pas chaque changement sous forme d'événement à une base de données KQL." }
        b: { en: "A scheduled copy job applies the changes in batches to a lakehouse, not as events in KQL-Ops within seconds.", fr: "Un travail de copie planifié applique les changements par lots dans un lakehouse, pas sous forme d'événements dans KQL-Ops en quelques secondes." }
        d: { en: "The OneLake catalog lists Fabric items, and OneLake shortcuts can't point to a PostgreSQL table.", fr: "Le catalogue OneLake liste des éléments Fabric, et un raccourci OneLake ne peut pas pointer vers une table PostgreSQL." }
    references:
      - title: PostgreSQL Database CDC Source in Fabric Real-Time Hub
        url: https://learn.microsoft.com/en-us/fabric/real-time-hub/add-source-postgresql-database-cdc

  # ------------------------------------------------------------------ 4
  - id: dp600-qz-21-04
    objective: "2.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Every night, Northwind Traders must copy about 300 GB of new files from an Azure Data Lake Storage Gen2 container to the Files section of a lakehouse named **LH-Raw**. When the copy succeeds, a notebook named **NB-Clean** must process the files. If the copy or the notebook fails, the data team must receive an email.

        You need to implement the process. The solution must minimize the number of items to create.

        What should you create?
      fr: |
        Chaque nuit, Northwind Traders doit copier environ 300 Go de nouveaux fichiers d'un conteneur Azure Data Lake Storage Gen2 vers la section Files d'un lakehouse nommé **LH-Raw**. Quand la copie réussit, un notebook nommé **NB-Clean** doit traiter les fichiers. Si la copie ou le notebook échoue, l'équipe données doit recevoir un e-mail.

        Vous devez mettre en œuvre ce processus. La solution doit réduire le nombre d'éléments à créer.

        Que devez-vous créer ?
    body:
      options:
        - { id: a, text: { en: "A copy job scheduled every night, and a schedule on NB-Clean one hour later", fr: "Un travail de copie planifié chaque nuit, et une planification de NB-Clean une heure plus tard" } }
        - { id: b, text: { en: "A Dataflow Gen2 scheduled every night, and a schedule on NB-Clean one hour later", fr: "Un Dataflow Gen2 planifié chaque nuit, et une planification de NB-Clean une heure plus tard" } }
        - { id: c, text: { en: "A OneLake shortcut to the container, and a schedule on NB-Clean every night", fr: "Un raccourci OneLake vers le conteneur, et une planification de NB-Clean chaque nuit" } }
        - { id: d, text: { en: "A pipeline with a Copy activity, NB-Clean on success, and an Office 365 Outlook activity on failure", fr: "Un pipeline avec une activité de copie, NB-Clean en cas de réussite et une activité Office 365 Outlook en cas d'échec" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Pipelines are built for orchestrated ingestion: a Copy activity moves large volumes, and activity dependencies run the Notebook activity only on success and a notification activity on failure. One pipeline item covers the copy, the dependency and the error handling.
        fr: |
          Les pipelines sont conçus pour l'ingestion orchestrée : une activité de copie déplace de gros volumes, et les dépendances entre activités n'exécutent l'activité Notebook qu'en cas de réussite et une activité de notification qu'en cas d'échec. Un seul élément pipeline couvre la copie, la dépendance et la gestion des erreurs.
      options:
        a: { en: "A copy job moves the data, but two independent schedules don't make the notebook wait for a successful copy, and nothing sends the email.", fr: "Un travail de copie déplace les données, mais deux planifications indépendantes ne font pas attendre la réussite de la copie au notebook, et rien n'envoie l'e-mail." }
        b: { en: "A Dataflow Gen2 transforms data with Power Query; it adds no dependency on the notebook and no failure email.", fr: "Un Dataflow Gen2 transforme des données avec Power Query ; il n'ajoute ni dépendance avec le notebook ni e-mail en cas d'échec." }
        c: { en: "A shortcut copies nothing, so the files are never copied to LH-Raw, and the notebook still has no failure notification.", fr: "Un raccourci ne copie rien : les fichiers ne sont jamais copiés dans LH-Raw, et le notebook n'a toujours aucune notification d'échec." }
    references:
      - title: Comparing Copy Job, Mirroring, Copy Activity, and Eventstreams in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-factory/decision-guide-data-movement

  # ------------------------------------------------------------------ 5
  - id: dp600-qz-21-05
    objective: "2.1.5"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        At Litware, an eventstream feeds the **Shipments** table of a KQL database named **KQL-Logistics**. To let Spark notebooks use these events, Shipments was made available in OneLake, and a lakehouse named **LH-Analytics** reads it through a shortcut.

        Next week, an engineer will rename the table, pause its OneLake copy for maintenance and then resume it.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Chez Litware, un flux d'événements alimente la table **Shipments** d'une base de données KQL nommée **KQL-Logistics**. Pour que des notebooks Spark utilisent ces événements, Shipments a été rendue disponible dans OneLake, et un lakehouse nommé **LH-Analytics** la lit par un raccourci.

        La semaine prochaine, un ingénieur renommera la table, suspendra sa copie OneLake pour maintenance, puis la rétablira.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "To rename Shipments, the engineer must first turn off OneLake availability for the table."
            fr: "Pour renommer Shipments, l'ingénieur doit d'abord désactiver la disponibilité OneLake de la table."
        - id: s2
          text:
            en: "Turning off OneLake availability for Shipments permanently deletes its Delta files from OneLake at once."
            fr: "Désactiver la disponibilité OneLake de Shipments supprime aussitôt et définitivement ses fichiers Delta de OneLake."
        - id: s3
          text:
            en: "After OneLake availability is turned back on, LH-Analytics can read all the data of Shipments, including the rows ingested earlier."
            fr: "Une fois la disponibilité OneLake réactivée, LH-Analytics peut lire toutes les données de Shipments, y compris les lignes ingérées auparavant."
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          While OneLake availability is on, a table can't be renamed, have a column type changed, receive row-level security, or have data deleted, truncated or purged: turn availability off, make the change, then turn it back on. Turning it off soft deletes the data from OneLake, and turning it back on makes all the data available again, including the historic backfill.
        fr: |
          Tant que la disponibilité OneLake est activée, une table ne peut être ni renommée, ni modifiée dans le type d'une colonne, ni soumise à la sécurité au niveau des lignes, ni vidée de données par suppression, troncature ou purge : désactivez la disponibilité, faites la modification, puis réactivez-la. La désactiver supprime de façon réversible les données de OneLake, et la réactiver rend de nouveau toutes les données disponibles, y compris l'historique.
      options:
        s2: { en: "Turning availability off is a soft delete of the OneLake copy, not an immediate permanent deletion.", fr: "Désactiver la disponibilité supprime de façon réversible la copie OneLake ; ce n'est pas une suppression définitive immédiate." }
    references:
      - title: Turn on OneLake availability for an eventhouse
        url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-house-onelake-availability

  # ------------------------------------------------------------------ 6
  - id: dp600-qz-21-06
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum plans to keep all its sales data in a single Fabric lakehouse named **LH-Sales**, with no warehouse. Spark engineers load the Delta tables of LH-Sales from notebooks. The project lists the requirements shown in the answer area.

        Which two requirements can't be met if the data is kept only in LH-Sales?

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum prévoit de conserver toutes ses données de ventes dans un seul lakehouse Fabric nommé **LH-Sales**, sans entrepôt. Des ingénieurs Spark chargent les tables Delta de LH-Sales depuis des notebooks. Le projet liste les exigences présentées dans la zone de réponse.

        Quelles deux exigences ne peuvent pas être satisfaites si les données sont conservées uniquement dans LH-Sales ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "SQL developers correct individual fact rows by running T-SQL UPDATE statements.", fr: "Des développeurs SQL corrigent des lignes de faits une à une en exécutant des instructions T-SQL UPDATE." } }
        - { id: b, text: { en: "Analysts create T-SQL views and inline table-valued functions on the tables.", fr: "Des analystes créent des vues T-SQL et des fonctions table inline sur les tables." } }
        - { id: c, text: { en: "Raw JSON files and product images are stored next to the tables.", fr: "Des fichiers JSON bruts et des images de produits sont stockés à côté des tables." } }
        - { id: d, text: { en: "A T-SQL procedure loads one fact table and two dimension tables in a single transaction.", fr: "Une procédure T-SQL charge une table de faits et deux tables de dimension dans une seule transaction." } }
        - { id: e, text: { en: "Data scientists update customer rows by running Spark MERGE statements.", fr: "Des scientifiques des données mettent à jour des lignes clients en exécutant des instructions Spark MERGE." } }
        - { id: f, text: { en: "A Direct Lake semantic model reads the tables for Power BI reports.", fr: "Un modèle sémantique Direct Lake lit les tables pour les rapports Power BI." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          The SQL analytics endpoint of a lakehouse lets T-SQL define and query objects but not modify the data of its tables, so T-SQL UPDATE statements and a T-SQL procedure that writes three tables in one transaction both require a warehouse. Everything else in the list works in a lakehouse: T-SQL objects in the endpoint, files of any format, Spark writes and Direct Lake reads.
        fr: |
          Le point de terminaison d'analytique SQL d'un lakehouse permet à T-SQL de définir et d'interroger des objets, mais pas de modifier les données de ses tables : des instructions T-SQL UPDATE et une procédure T-SQL qui écrit trois tables dans une seule transaction exigent donc un entrepôt. Tout le reste de la liste fonctionne dans un lakehouse : objets T-SQL dans le point de terminaison, fichiers de tout format, écritures Spark et lectures Direct Lake.
      options:
        b: { en: "The SQL analytics endpoint accepts views, inline table-valued functions and procedures on top of the lakehouse tables.", fr: "Le point de terminaison d'analytique SQL accepte des vues, des fonctions table inline et des procédures au-dessus des tables du lakehouse." }
        c: { en: "The Files section of a lakehouse stores files of any format, structured or not.", fr: "La section Files d'un lakehouse stocke des fichiers de tout format, structurés ou non." }
        e: { en: "Spark writes to Delta tables, including MERGE, are how a lakehouse is meant to be updated.", fr: "Les écritures Spark dans des tables Delta, MERGE compris, sont la manière prévue de mettre à jour un lakehouse." }
        f: { en: "Direct Lake reads the Delta tables of a lakehouse directly from OneLake.", fr: "Direct Lake lit les tables Delta d'un lakehouse directement dans OneLake." }
    references:
      - title: What Is Fabric Data Warehouse?
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-warehousing

  # ------------------------------------------------------------------ 7
  - id: dp600-qz-21-07
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has a Fabric workspace named **WS-Media** that contains a lakehouse named **LH-Media**. The Files section of LH-Media contains an Amazon S3 shortcut named **s3_footage** that points to a bucket of Parquet files. Each file is between 2 GB and 3 GB, files are never modified after they are written, and a few new files arrive each week. Notebooks in WS-Media read the same files many times a day.

        Shortcut caching is turned on in the OneLake settings of WS-Media with a retention period of 7 days. However, the AWS egress charges didn't decrease.

        You need to reduce the egress charges. A copy of the data can be stored in OneLake.

        What should you do?
      fr: |
        Tailspin Toys dispose d'un espace de travail Fabric nommé **WS-Media** qui contient un lakehouse nommé **LH-Media**. La section Files de LH-Media contient un raccourci Amazon S3 nommé **s3_footage** qui pointe vers un compartiment de fichiers Parquet. Chaque fichier fait entre 2 Go et 3 Go, les fichiers ne sont jamais modifiés après leur écriture, et quelques nouveaux fichiers arrivent chaque semaine. Des notebooks de WS-Media lisent les mêmes fichiers plusieurs fois par jour.

        La mise en cache des raccourcis est activée dans les paramètres OneLake de WS-Media avec une période de rétention de 7 jours. Pourtant, les frais de sortie de données AWS n'ont pas baissé.

        Vous devez réduire les frais de sortie de données. Une copie des données peut être stockée dans OneLake.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Increase the retention period of the shortcut cache of WS-Media to 28 days.", fr: "Porter la période de rétention du cache des raccourcis de WS-Media à 28 jours." } }
        - { id: b, text: { en: "Copy each file to the Files section of LH-Media with a scheduled pipeline, and read the copies.", fr: "Copier chaque fichier dans la section Files de LH-Media avec un pipeline planifié, et lire les copies." } }
        - { id: c, text: { en: "Re-create s3_footage in the Tables section of LH-Media, so that Spark reads the files as a table.", fr: "Recréer s3_footage dans la section Tables de LH-Media, pour que Spark lise les fichiers comme une table." } }
        - { id: d, text: { en: "Re-create s3_footage as an S3 compatible shortcut to the same bucket, with the same cache settings.", fr: "Recréer s3_footage comme raccourci compatible S3 vers le même compartiment, avec les mêmes paramètres de cache." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Shortcut caching never caches an individual file larger than 1 GB, so every read of these 2-3 GB files still goes to Amazon S3, whatever the retention period. Because the files are immutable and a copy is allowed, copying each new file once into OneLake pays the egress once per file, and the notebooks then read the local copies.
        fr: |
          La mise en cache des raccourcis ne met jamais en cache un fichier de plus de 1 Go : chaque lecture de ces fichiers de 2 à 3 Go va donc toujours vers Amazon S3, quelle que soit la période de rétention. Comme les fichiers sont immuables et qu'une copie est autorisée, copier chaque nouveau fichier une seule fois dans OneLake ne paie la sortie de données qu'une fois par fichier, puis les notebooks lisent les copies locales.
      options:
        a: { en: "The retention period (1 to 28 days) doesn't matter: files over 1 GB are never cached.", fr: "La période de rétention (1 à 28 jours) n'y change rien : les fichiers de plus de 1 Go ne sont jamais mis en cache." }
        c: { en: "Parquet files that aren't in a table format such as Delta aren't recognized as a table, and the data would still be read from S3 at each query.", fr: "Des fichiers Parquet qui ne sont pas dans un format de table comme Delta ne sont pas reconnus comme une table, et les données seraient toujours lues dans S3 à chaque requête." }
        d: { en: "S3 compatible shortcuts follow the same caching rules, so files over 1 GB still aren't cached.", fr: "Les raccourcis compatibles S3 suivent les mêmes règles de mise en cache : les fichiers de plus de 1 Go ne sont toujours pas mis en cache." }
    references:
      - title: Unify Data Sources With OneLake Shortcuts
        url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts

  # ------------------------------------------------------------------ 8
  - id: dp600-qz-21-08
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has an Azure Data Lake Storage Gen2 account named **stcorpdata** that contains three containers: **finance**, **hr** and **partner-share**. A shareable cloud connection named **Conn-CorpData** authenticates as a service principal named **sp-etl** that has the Storage Blob Data Contributor role on stcorpdata. You are the owner of Conn-CorpData.

        An external contractor named **Ext1** has the Contributor role in a Fabric workspace named **WS-Partner**. Ext1 must create ADLS Gen2 shortcuts in a lakehouse of WS-Partner that point to partner-share. Through these shortcuts, no one must be able to write data or reach the finance and hr containers.

        The solution must follow the principle of least privilege. What should you do?
      fr: |
        Contoso dispose d'un compte Azure Data Lake Storage Gen2 nommé **stcorpdata** qui contient trois conteneurs : **finance**, **hr** et **partner-share**. Une connexion cloud partageable nommée **Conn-CorpData** s'authentifie en tant que principal de service nommé **sp-etl**, qui a le rôle Storage Blob Data Contributor sur stcorpdata. Vous êtes le propriétaire de Conn-CorpData.

        Un prestataire externe nommé **Ext1** a le rôle Contributor dans un espace de travail Fabric nommé **WS-Partner**. Ext1 doit créer, dans un lakehouse de WS-Partner, des raccourcis ADLS Gen2 qui pointent vers partner-share. Par ces raccourcis, personne ne doit pouvoir écrire de données ni atteindre les conteneurs finance et hr.

        La solution doit respecter le principe du moindre privilège. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add Ext1 to Conn-CorpData with the User role, and assign Ext1 the Storage Blob Data Reader role on partner-share.", fr: "Ajouter Ext1 à Conn-CorpData avec le rôle User, et attribuer à Ext1 le rôle Storage Blob Data Reader sur partner-share." } }
        - { id: b, text: { en: "Add Ext1 to Conn-CorpData with the Owner role, so that Ext1 can limit the connection path to partner-share.", fr: "Ajouter Ext1 à Conn-CorpData avec le rôle Owner, pour qu'Ext1 puisse limiter le chemin de la connexion à partner-share." } }
        - { id: c, text: { en: "Create a connection whose service principal has Storage Blob Data Reader on partner-share only, and add Ext1 with the User role.", fr: "Créer une connexion dont le principal de service a Storage Blob Data Reader sur partner-share uniquement, et y ajouter Ext1 avec le rôle User." } }
        - { id: d, text: { en: "Add Ext1 to Conn-CorpData with the User with resharing role, and change Ext1 to the Viewer role in WS-Partner.", fr: "Ajouter Ext1 à Conn-CorpData avec le rôle User with resharing, et passer Ext1 au rôle Viewer dans WS-Partner." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          An ADLS Gen2 shortcut reaches the storage with the credentials stored in its connection, not with the identity of the user. A new connection whose service principal can only read partner-share caps what any shortcut built on it can do, and the User role is the minimum that lets Ext1 bind that connection when creating the shortcuts.
        fr: |
          Un raccourci ADLS Gen2 accède au stockage avec les informations d'identification stockées dans sa connexion, pas avec l'identité de l'utilisateur. Une nouvelle connexion dont le principal de service ne peut que lire partner-share plafonne ce que peut faire tout raccourci construit sur elle, et le rôle User est le minimum qui permet à Ext1 de lier cette connexion en créant les raccourcis.
      options:
        a: { en: "The shortcuts would use sp-etl, which can write to every container; the role assigned to Ext1 in Azure isn't used by the shortcut.", fr: "Les raccourcis utiliseraient sp-etl, qui peut écrire dans tous les conteneurs ; le rôle attribué à Ext1 dans Azure n'est pas utilisé par le raccourci." }
        b: { en: "Owner lets Ext1 manage the credentials and users of Conn-CorpData, and the stored service principal still has write access to the whole account.", fr: "Owner permet à Ext1 de gérer les informations d'identification et les utilisateurs de Conn-CorpData, et le principal de service stocké garde l'accès en écriture à tout le compte." }
        d: { en: "Resharing gives more than needed, sp-etl still has full access, and the Viewer role can't create shortcuts in the lakehouse.", fr: "Le repartage donne plus que nécessaire, sp-etl garde un accès complet, et le rôle Viewer ne permet pas de créer des raccourcis dans le lakehouse." }
    references:
      - title: Data source management
        url: https://learn.microsoft.com/en-us/fabric/data-factory/data-source-management
      - title: Unify Data Sources With OneLake Shortcuts
        url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts

  # ------------------------------------------------------------------ 9
  - id: dp600-qz-21-09
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware's Azure Databricks workspace uses Unity Catalog. A catalog named **sales** contains a schema named **gold** with about 80 Delta tables stored in Azure Data Lake Storage Gen2. The Databricks team adds new tables to gold every month. External data access is enabled on the metastore, and the required Unity Catalog privileges are granted.

        Fabric analysts must query the gold tables from a SQL analytics endpoint and build Direct Lake semantic models on them. The solution must meet the following requirements:

        - The data must not be copied to OneLake.
        - Tables added to gold later must appear in Fabric without anyone having to add them.
        - Administrative effort must be minimized.

        What should you create?
      fr: |
        L'espace de travail Azure Databricks de Litware utilise Unity Catalog. Un catalogue nommé **sales** contient un schéma nommé **gold** d'environ 80 tables Delta stockées dans Azure Data Lake Storage Gen2. L'équipe Databricks ajoute de nouvelles tables à gold chaque mois. L'accès externe aux données est activé sur le metastore, et les privilèges Unity Catalog requis sont accordés.

        Les analystes Fabric doivent interroger les tables de gold depuis un point de terminaison d'analytique SQL et construire des modèles sémantiques Direct Lake dessus. La solution doit satisfaire les exigences suivantes :

        - Les données ne doivent pas être copiées dans OneLake.
        - Les tables ajoutées plus tard à gold doivent apparaître dans Fabric sans que personne ait à les ajouter.
        - L'effort administratif doit être réduit au minimum.

        Que devez-vous créer ?
    body:
      options:
        - { id: a, text: { en: "A lakehouse with one ADLS Gen2 shortcut in the Tables section for each table folder of gold", fr: "Un lakehouse avec un raccourci ADLS Gen2 dans la section Tables pour chaque dossier de table de gold" } }
        - { id: b, text: { en: "A Mirrored Azure Databricks catalog item for gold, with automatic sync of future catalog changes left on", fr: "Un élément Mirrored Azure Databricks catalog pour gold, avec la synchronisation automatique des futurs changements du catalogue laissée activée" } }
        - { id: c, text: { en: "A copy job that copies the gold tables incrementally from Azure Databricks to a lakehouse every hour", fr: "Un travail de copie qui copie les tables de gold de façon incrémentielle d'Azure Databricks vers un lakehouse toutes les heures" } }
        - { id: d, text: { en: "A lakehouse with one ADLS Gen2 shortcut in the Files section that points to the storage folder of gold", fr: "Un lakehouse avec un raccourci ADLS Gen2 dans la section Files qui pointe vers le dossier de stockage de gold" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Mirroring Azure Databricks Unity Catalog is metadata mirroring: only the catalog structure is mirrored, and the data is read in place through shortcuts that Fabric creates for each table. The option that automatically syncs future catalog changes for the selected schema is on by default, so tables added to gold appear without manual work, and the item comes with a SQL analytics endpoint usable by Direct Lake models.
        fr: |
          La mise en miroir d'Unity Catalog d'Azure Databricks est une mise en miroir des métadonnées : seule la structure du catalogue est mise en miroir, et les données sont lues sur place par des raccourcis que Fabric crée pour chaque table. L'option qui synchronise automatiquement les futurs changements du catalogue pour le schéma choisi est activée par défaut : les tables ajoutées à gold apparaissent sans travail manuel, et l'élément dispose d'un point de terminaison d'analytique SQL utilisable par les modèles Direct Lake.
      options:
        a: { en: "These shortcuts avoid a copy, but each new table of gold needs a new shortcut created by hand.", fr: "Ces raccourcis évitent une copie, mais chaque nouvelle table de gold exige un nouveau raccourci créé à la main." }
        c: { en: "A copy job copies the data into OneLake, which the first requirement forbids.", fr: "Un travail de copie copie les données dans OneLake, ce que la première exigence interdit." }
        d: { en: "Folders under Files aren't recognized as tables: the SQL analytics endpoint and Direct Lake only see the Tables section.", fr: "Les dossiers sous Files ne sont pas reconnus comme des tables : le point de terminaison d'analytique SQL et Direct Lake ne voient que la section Tables." }
    references:
      - title: Microsoft Fabric Mirrored Catalog From Azure Databricks
        url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-databricks
      - title: Mirroring
        url: https://learn.microsoft.com/en-us/fabric/mirroring/overview

  # ------------------------------------------------------------------ 10
  - id: dp600-qz-21-10
    objective: "2.1.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam has a Fabric workspace on an F64 capacity. The tenant settings required for OneLake integration are enabled. The workspace contains the following items:

        - **SM-Stock**: a semantic model that uses Direct Lake on OneLake storage mode and reads the Delta tables of a lakehouse named **LH-Stock**
        - **SM-Retail**: a semantic model in Import mode whose tables are loaded from an Azure SQL database
        - **KQL-Plant**: a KQL database whose **Readings** table is fed by an eventstream

        Data scientists use notebooks attached to a lakehouse named **LH-Science**. They need Delta tables for the data behind SM-Stock, for the tables of SM-Retail and for Readings. Data engineers will create OneLake shortcuts in LH-Science to whichever Delta tables are available. No second copy of the data may be loaded by a pipeline, a notebook or an eventstream, and administrative effort must be minimized.

        What should you do for each item? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un espace de travail Fabric sur une capacité F64. Les paramètres de locataire requis pour l'intégration de OneLake sont activés. L'espace de travail contient les éléments suivants :

        - **SM-Stock** : un modèle sémantique qui utilise le mode de stockage Direct Lake sur OneLake et lit les tables Delta d'un lakehouse nommé **LH-Stock**
        - **SM-Retail** : un modèle sémantique en mode Import dont les tables sont chargées depuis une base de données Azure SQL
        - **KQL-Plant** : une base de données KQL dont la table **Readings** est alimentée par un flux d'événements

        Des scientifiques des données utilisent des notebooks attachés à un lakehouse nommé **LH-Science**. Ils ont besoin de tables Delta pour les données derrière SM-Stock, pour les tables de SM-Retail et pour Readings. Des ingénieurs données créeront dans LH-Science des raccourcis OneLake vers les tables Delta disponibles. Aucune seconde copie des données ne peut être chargée par un pipeline, un notebook ou un flux d'événements, et l'effort administratif doit être réduit au minimum.

        Que devez-vous faire pour chaque élément ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          SM-Stock: [[stock]]

          SM-Retail: [[retail]]

          KQL-Plant: [[kql]]
        fr: |
          SM-Stock : [[stock]]

          SM-Retail : [[retail]]

          KQL-Plant : [[kql]]
      slots:
        - id: stock
          options:
            - { id: st-none, text: { en: "Change no setting: use the Delta tables that the item already reads", fr: "Ne modifier aucun paramètre : utiliser les tables Delta que l'élément lit déjà" } }
            - { id: st-smint, text: { en: "Turn on OneLake integration, and then refresh the model", fr: "Activer l'intégration de OneLake, puis actualiser le modèle" } }
            - { id: st-avail, text: { en: "Turn on OneLake availability", fr: "Activer la disponibilité OneLake" } }
            - { id: st-es, text: { en: "Add LH-Science as a destination of the eventstream", fr: "Ajouter LH-Science comme destination du flux d'événements" } }
        - id: retail
          options:
            - { id: rt-none, text: { en: "Change no setting: use the Delta tables that the item already reads", fr: "Ne modifier aucun paramètre : utiliser les tables Delta que l'élément lit déjà" } }
            - { id: rt-smint, text: { en: "Turn on OneLake integration, and then refresh the model", fr: "Activer l'intégration de OneLake, puis actualiser le modèle" } }
            - { id: rt-avail, text: { en: "Turn on OneLake availability", fr: "Activer la disponibilité OneLake" } }
            - { id: rt-es, text: { en: "Add LH-Science as a destination of the eventstream", fr: "Ajouter LH-Science comme destination du flux d'événements" } }
        - id: kql
          options:
            - { id: kq-none, text: { en: "Change no setting: use the Delta tables that the item already reads", fr: "Ne modifier aucun paramètre : utiliser les tables Delta que l'élément lit déjà" } }
            - { id: kq-smint, text: { en: "Turn on OneLake integration, and then refresh the model", fr: "Activer l'intégration de OneLake, puis actualiser le modèle" } }
            - { id: kq-avail, text: { en: "Turn on OneLake availability for the table", fr: "Activer la disponibilité OneLake pour la table" } }
            - { id: kq-es, text: { en: "Add LH-Science as a destination of the eventstream", fr: "Ajouter LH-Science comme destination du flux d'événements" } }
    answer:
      values: { stock: st-none, retail: rt-smint, kql: kq-avail }
    explanation:
      correct:
        en: |
          A Direct Lake model already reads Delta tables in OneLake, so the shortcuts can point straight to the tables of LH-Stock; OneLake integration exports Import tables only and has nothing to export for SM-Stock. SM-Retail stores imported data that exists nowhere in OneLake: turning on OneLake integration writes its Import tables as Delta tables at the next refresh. Readings becomes a Delta table in OneLake only after OneLake availability is turned on, at no extra storage cost.
        fr: |
          Un modèle Direct Lake lit déjà des tables Delta dans OneLake : les raccourcis peuvent pointer directement vers les tables de LH-Stock ; l'intégration de OneLake n'exporte que des tables Import et n'a rien à exporter pour SM-Stock. SM-Retail stocke des données importées qui n'existent nulle part dans OneLake : activer l'intégration de OneLake écrit ses tables Import sous forme de tables Delta à la prochaine actualisation. Readings ne devient une table Delta dans OneLake qu'une fois la disponibilité OneLake activée, sans coût de stockage supplémentaire.
      options:
        st-smint: { en: "OneLake integration exports Import tables; a Direct Lake model has none, and its data is already in OneLake.", fr: "L'intégration de OneLake exporte des tables Import ; un modèle Direct Lake n'en a pas, et ses données sont déjà dans OneLake." }
        rt-none: { en: "SM-Retail reads an Azure SQL database, not Delta tables: there is nothing in OneLake to point a shortcut to.", fr: "SM-Retail lit une base de données Azure SQL, pas des tables Delta : rien dans OneLake ne peut être la cible d'un raccourci." }
        kq-none: { en: "A KQL table isn't written to OneLake as Delta until OneLake availability is turned on.", fr: "Une table KQL n'est pas écrite dans OneLake au format Delta tant que la disponibilité OneLake n'est pas activée." }
        kq-es: { en: "A second destination would load another copy of the events, which the requirements forbid.", fr: "Une seconde destination chargerait une autre copie des événements, ce que les exigences interdisent." }
    references:
      - title: Learn about Microsoft OneLake Delta table integration in Power BI and Microsoft Fabric
        url: https://learn.microsoft.com/en-us/power-bi/enterprise/onelake-integration-overview
      - title: Turn on OneLake availability for an eventhouse
        url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-house-onelake-availability
