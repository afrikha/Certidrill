chapter: 11-security-governance
questions:
  # ------------------------------------------------------------------ 1
  - id: dp600-qz-11-01
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has a Fabric workspace named **WS-Sales**. In January, you assign the security group **SG-Data** the Contributor role in WS-Sales.

        In March, a data engineer creates a lakehouse named **LH-Orders** in WS-Sales, and another team creates a workspace named **WS-HR** on the same capacity.

        What access does SG-Data have in March?
      fr: |
        Contoso dispose d'un espace de travail Fabric nommé **WS-Sales**. En janvier, vous attribuez au groupe de sécurité **SG-Data** le rôle Contributor dans WS-Sales.

        En mars, un ingénieur de données crée un lakehouse nommé **LH-Orders** dans WS-Sales, et une autre équipe crée un espace de travail nommé **WS-HR** sur la même capacité.

        De quel accès SG-Data dispose-t-il en mars ?
    body:
      options:
        - { id: a, text: { en: "Contributor access to LH-Orders, and no access to WS-HR", fr: "Un accès Contributor à LH-Orders, et aucun accès à WS-HR" } }
        - { id: b, text: { en: "Contributor access to LH-Orders, and to every item of WS-HR", fr: "Un accès Contributor à LH-Orders, et à tous les éléments de WS-HR" } }
        - { id: c, text: { en: "No access to LH-Orders until it is shared, and no access to WS-HR", fr: "Aucun accès à LH-Orders tant qu'il n'est pas partagé, et aucun accès à WS-HR" } }
        - { id: d, text: { en: "Viewer access to LH-Orders, and Viewer access to every item of WS-HR", fr: "Un accès Viewer à LH-Orders, et un accès Viewer à tous les éléments de WS-HR" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A workspace role applies to all the items of its workspace, including items created after the assignment, so SG-Data is a Contributor on LH-Orders without any extra step. The role stops at the workspace boundary: it gives nothing in another workspace, even one on the same capacity.
        fr: |
          Un rôle d'espace de travail s'applique à tous les éléments de son espace de travail, y compris ceux créés après l'attribution : SG-Data est donc Contributor sur LH-Orders sans action supplémentaire. Le rôle s'arrête à la limite de l'espace de travail : il ne donne rien dans un autre espace de travail, même sur la même capacité.
      options:
        b: { en: "Sharing a capacity doesn't share access: a role in WS-Sales gives no permission in WS-HR.", fr: "Partager une capacité ne partage pas l'accès : un rôle dans WS-Sales ne donne aucune autorisation dans WS-HR." }
        c: { en: "Item sharing is needed only for users without a role; the workspace role already covers new items.", fr: "Le partage d'élément ne sert qu'aux utilisateurs sans rôle ; le rôle d'espace de travail couvre déjà les nouveaux éléments." }
        d: { en: "The role doesn't change for new items, and it never extends to another workspace.", fr: "Le rôle ne change pas pour les nouveaux éléments, et il ne s'étend jamais à un autre espace de travail." }
    references:
      - title: Roles in workspaces in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces

  # ------------------------------------------------------------------ 2
  - id: dp600-qz-11-02
    objective: "1.1.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The finance team of Fabrikam promotes a semantic model named **SM-Budget**.

        What does the Promoted badge change for the users of the organization?
      fr: |
        L'équipe finance de Fabrikam promeut un modèle sémantique nommé **SM-Budget**.

        Que change le badge Promoted pour les utilisateurs de l'organisation ?
    body:
      options:
        - { id: a, text: { en: "SM-Budget gets a visible badge and is listed first in some lists", fr: "SM-Budget reçoit un badge visible et apparaît en premier dans certaines listes" } }
        - { id: b, text: { en: "Every user of the organization gets Read permission on SM-Budget", fr: "Chaque utilisateur de l'organisation obtient l'autorisation Read sur SM-Budget" } }
        - { id: c, text: { en: "SM-Budget becomes read-only until a reviewer removes the badge", fr: "SM-Budget passe en lecture seule jusqu'à ce qu'un réviseur retire le badge" } }
        - { id: d, text: { en: "The label of SM-Budget is applied to every report built on it", fr: "L'étiquette de SM-Budget est appliquée à chaque rapport construit dessus" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Endorsement helps users find trustworthy content: endorsed items carry a badge in the user interface and some lists give them precedence. Promotion says that the creators consider the item ready to share and reuse; it doesn't change who can access or edit the item.
        fr: |
          L'approbation aide les utilisateurs à trouver du contenu fiable : les éléments approuvés portent un badge dans l'interface et certaines listes les placent en premier. La promotion indique que les créateurs jugent l'élément prêt à être partagé et réutilisé ; elle ne change pas qui peut accéder à l'élément ni le modifier.
      options:
        b: { en: "Endorsement grants no permission; users still need access to the model, through a role or an item permission.", fr: "L'approbation n'accorde aucune autorisation ; les utilisateurs ont toujours besoin d'un accès au modèle, par un rôle ou une autorisation d'élément." }
        c: { en: "A badge doesn't lock the item; users with write permission can still change the model.", fr: "Un badge ne verrouille pas l'élément ; les utilisateurs disposant de l'écriture peuvent toujours modifier le modèle." }
        d: { en: "Labels propagate through sensitivity label inheritance, which is unrelated to endorsement.", fr: "Les étiquettes se propagent par l'héritage des étiquettes de confidentialité, sans rapport avec l'approbation." }
    references:
      - title: Endorsement overview
        url: https://learn.microsoft.com/en-us/fabric/governance/endorsement-overview

  # ------------------------------------------------------------------ 3
  - id: dp600-qz-11-03
    objective: "1.1.4"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum has enabled sensitivity labels for Fabric, and the tenant setting **Automatically apply sensitivity labels to downstream content** is enabled. You are a Member of a workspace named **WS-Clinic** and you have a Power BI Pro license.

        WS-Clinic contains a lakehouse named **LH-Patients** labeled **Confidential**, and an unlabeled semantic model named **SM-Visits** that is built on LH-Patients.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum a activé les étiquettes de confidentialité pour Fabric, et le paramètre de locataire **Automatically apply sensitivity labels to downstream content** est activé. Vous êtes Member d'un espace de travail nommé **WS-Clinic** et vous disposez d'une licence Power BI Pro.

        WS-Clinic contient un lakehouse nommé **LH-Patients** étiqueté **Confidential**, et un modèle sémantique sans étiquette nommé **SM-Visits** construit sur LH-Patients.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "A notebook that you create from LH-Patients gets the Confidential label."
            fr: "Un notebook que vous créez depuis LH-Patients reçoit l'étiquette Confidential."
        - id: s2
          text:
            en: "If you change the label of SM-Visits to Highly Confidential, LH-Patients also gets Highly Confidential."
            fr: "Si vous changez l'étiquette de SM-Visits en Highly Confidential, LH-Patients reçoit aussi Highly Confidential."
        - id: s3
          text:
            en: "If you change the label of LH-Patients to Highly Confidential, SM-Visits can get Highly Confidential through downstream inheritance."
            fr: "Si vous changez l'étiquette de LH-Patients en Highly Confidential, SM-Visits peut recevoir Highly Confidential par l'héritage en aval."
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Inheritance upon creation gives a notebook, a pipeline or a shortcut created from a labeled lakehouse the label of that lakehouse. Labels only flow downstream, from an item to the items that depend on it, so labeling SM-Visits never relabels its source. Downstream inheritance from a Fabric item to a Power BI item is supported, so SM-Visits, which has no manual label, can receive the label of LH-Patients.
        fr: |
          L'héritage à la création donne à un notebook, un pipeline ou un raccourci créé depuis un lakehouse étiqueté l'étiquette de ce lakehouse. Les étiquettes ne descendent qu'en aval, d'un élément vers les éléments qui en dépendent : étiqueter SM-Visits ne réétiquette donc jamais sa source. L'héritage en aval d'un élément Fabric vers un élément Power BI est pris en charge : SM-Visits, qui n'a pas d'étiquette manuelle, peut recevoir l'étiquette de LH-Patients.
      options:
        s2: { en: "LH-Patients is upstream of SM-Visits; inheritance never goes from a child item back to its source.", fr: "LH-Patients est en amont de SM-Visits ; l'héritage ne remonte jamais d'un élément enfant vers sa source." }
    references:
      - title: Information protection in Fabric
        url: https://learn.microsoft.com/en-us/fabric/governance/information-protection

  # ------------------------------------------------------------------ 4
  - id: dp600-qz-11-04
    objective: "1.1.2"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys has a Fabric workspace named **WS-Gold** that contains a lakehouse named **LH-Gold**. A data analyst named Lena has no role in WS-Gold.

        Lena must be able to:

        - query the tables of LH-Gold with T-SQL from SQL Server Management Studio;
        - read the files of LH-Gold from Spark notebooks in her own workspace;
        - give two colleagues the same access to LH-Gold as hers.

        Lena must not modify the data of LH-Gold. You share LH-Gold with Lena.

        Which three additional permissions should you select? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un espace de travail Fabric nommé **WS-Gold** qui contient un lakehouse nommé **LH-Gold**. Une analyste de données nommée Lena n'a aucun rôle dans WS-Gold.

        Lena doit pouvoir :

        - interroger les tables de LH-Gold en T-SQL depuis SQL Server Management Studio ;
        - lire les fichiers de LH-Gold depuis des notebooks Spark de son propre espace de travail ;
        - donner à deux collègues le même accès à LH-Gold que le sien.

        Lena ne doit pas modifier les données de LH-Gold. Vous partagez LH-Gold avec Lena.

        Quelles sont les trois autorisations supplémentaires à sélectionner ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: "Read all with SQL analytics endpoint" }
        - { id: b, text: "Edit" }
        - { id: c, text: "Read all with Apache Spark" }
        - { id: d, text: "Build" }
        - { id: e, text: "Share" }
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: |
          Read all with SQL analytics endpoint (ReadData) and Read all with Apache Spark (ReadAll) are independent, so Lena needs both to use T-SQL and Spark. Share (Reshare) lets her share LH-Gold and grant permissions up to her own, so her colleagues can receive the same ReadData and ReadAll. None of these permissions allows writing: lakehouse sharing is read-only.
        fr: |
          Read all with SQL analytics endpoint (ReadData) et Read all with Apache Spark (ReadAll) sont indépendantes : Lena a besoin des deux pour utiliser T-SQL et Spark. Share (Reshare) lui permet de partager LH-Gold et d'accorder des autorisations dans la limite des siennes : ses collègues peuvent donc recevoir les mêmes ReadData et ReadAll. Aucune de ces autorisations ne permet d'écrire : le partage d'un lakehouse est en lecture seule.
      options:
        b: { en: "Lakehouse sharing never grants write access, and Lena must not modify the data anyway.", fr: "Le partage d'un lakehouse n'accorde jamais l'écriture, et Lena ne doit de toute façon pas modifier les données." }
        d: { en: "Build applies to semantic models, to create reports on them; it gives no access to lakehouse tables or files.", fr: "Build concerne les modèles sémantiques, pour créer des rapports dessus ; il ne donne aucun accès aux tables ni aux fichiers d'un lakehouse." }
    references:
      - title: Share items in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/share-items
      - title: Lakehouse sharing and permission management
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sharing

  # ------------------------------------------------------------------ 5
  - id: dp600-qz-11-05
    objective: "1.1.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders has a Fabric workspace named **WS-Sales** that contains:

        - a warehouse named **WH-Sales**, where a security policy adds a filter predicate on `dbo.FactSales` so that each user sees only the rows of their region;
        - an Import mode semantic model named **SM-Sales**, built on a lakehouse, with a row-level security (RLS) role named **West**.

        A user named Ana has the Admin role in WS-Sales and isn't listed in the region mapping table used by the predicate.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un espace de travail Fabric nommé **WS-Sales** qui contient :

        - un entrepôt nommé **WH-Sales**, où une stratégie de sécurité ajoute un prédicat de filtre sur `dbo.FactSales` pour que chaque utilisateur ne voie que les lignes de sa région ;
        - un modèle sémantique en mode Import nommé **SM-Sales**, construit sur un lakehouse, avec un rôle de sécurité au niveau des lignes (RLS) nommé **West**.

        Une utilisatrice nommée Ana a le rôle Admin dans WS-Sales et ne figure pas dans la table de correspondance des régions utilisée par le prédicat.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "When Ana queries dbo.FactSales with T-SQL, the security policy filters the rows that she sees."
            fr: "Quand Ana interroge dbo.FactSales en T-SQL, la stratégie de sécurité filtre les lignes qu'elle voit."
        - id: s2
          text:
            en: "If you add Ana to the West role, she still sees every row in the reports built on SM-Sales."
            fr: "Si vous ajoutez Ana au rôle West, elle voit toujours toutes les lignes dans les rapports construits sur SM-Sales."
        - id: s3
          text:
            en: "The security policy also filters the rows of dbo.FactReturns, a table of WH-Sales that has the same region column."
            fr: "La stratégie de sécurité filtre aussi les lignes de dbo.FactReturns, une table de WH-Sales qui a la même colonne de région."
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Warehouse security policies apply to all users, including workspace Admins; a user who must see every row has to be allowed by the predicate itself. Semantic model RLS works the other way: it filters only Viewers and users with item permissions, never Admins, Members or Contributors, who have edit permission on the model. A filter predicate protects only the table it is added on, so each table needs its own row-level security.
        fr: |
          Les stratégies de sécurité de l'entrepôt s'appliquent à tous les utilisateurs, y compris les Admins de l'espace de travail ; un utilisateur qui doit voir toutes les lignes doit être autorisé par le prédicat lui-même. La RLS du modèle sémantique fonctionne à l'inverse : elle ne filtre que les Viewers et les utilisateurs disposant d'autorisations d'élément, jamais les Admins, Members ou Contributors, qui ont l'autorisation de modification sur le modèle. Un prédicat de filtre ne protège que la table sur laquelle il est ajouté : chaque table a besoin de sa propre sécurité au niveau des lignes.
      options:
        s3: { en: "The predicate is bound to dbo.FactSales only; dbo.FactReturns stays unfiltered until a predicate is added on it.", fr: "Le prédicat n'est lié qu'à dbo.FactSales ; dbo.FactReturns reste non filtrée tant qu'aucun prédicat n'y est ajouté." }
    references:
      - title: Row-Level Security in Fabric Data Warehouse
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/row-level-security
      - title: Row-level security (RLS) with Power BI
        url: https://learn.microsoft.com/en-us/fabric/security/service-admin-row-level-security

  # ------------------------------------------------------------------ 6
  - id: dp600-qz-11-06
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware has a Fabric workspace named **WS-HR** that contains a warehouse named **WH-HR** and an Import mode semantic model named **SM-HR** that loads its tables from WH-HR. SM-HR contains an `Employee` table with a `Salary` column, and a `DeptManager` table that maps each manager's email address to a department.

        Department managers, who have the Viewer role in WS-HR, use the reports built on SM-HR. Each manager must see only the employees of their own department, and the `Salary` column and its metadata must not exist for the managers in any report.

        What should you do?
      fr: |
        Proseware dispose d'un espace de travail Fabric nommé **WS-HR** qui contient un entrepôt nommé **WH-HR** et un modèle sémantique en mode Import nommé **SM-HR** qui charge ses tables depuis WH-HR. SM-HR contient une table `Employee` avec une colonne `Salary`, et une table `DeptManager` qui associe l'adresse e-mail de chaque responsable à un service.

        Les responsables de service, qui ont le rôle Viewer dans WS-HR, utilisent les rapports construits sur SM-HR. Chaque responsable ne doit voir que les employés de son propre service, et la colonne `Salary` et ses métadonnées ne doivent exister pour les responsables dans aucun rapport.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In WH-HR, create a security policy on the department column, and grant the managers SELECT on every column except Salary.", fr: "Dans WH-HR, créer une stratégie de sécurité sur la colonne de service, et accorder aux responsables SELECT sur toutes les colonnes sauf Salary." } }
        - { id: b, text: { en: "In SM-HR, create one role that filters DeptManager on USERPRINCIPALNAME() and sets the Salary column permission to None.", fr: "Dans SM-HR, créer un rôle qui filtre DeptManager sur USERPRINCIPALNAME() et qui fixe l'autorisation de la colonne Salary à None." } }
        - { id: c, text: { en: "In SM-HR, create one role that filters DeptManager on USERPRINCIPALNAME() and adds a DAX filter that blanks the Salary column.", fr: "Dans SM-HR, créer un rôle qui filtre DeptManager sur USERPRINCIPALNAME() et qui ajoute un filtre DAX qui vide la colonne Salary." } }
        - { id: d, text: { en: "In SM-HR, create one role that filters DeptManager on USERPRINCIPALNAME(), and apply the Highly Confidential label to SM-HR.", fr: "Dans SM-HR, créer un rôle qui filtre DeptManager sur USERPRINCIPALNAME(), et appliquer l'étiquette Highly Confidential à SM-HR." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The managers read an Import model, so the rules must be defined in the model. A dynamic RLS filter on DeptManager propagates through the relationships to Employee, and object-level security with the Salary column set to None, in the TMDL view or Tabular Editor, removes the column and its metadata for the role. Both rules sit in the same role, and both apply because the managers are Viewers.
        fr: |
          Les responsables lisent un modèle en Import : les règles doivent donc être définies dans le modèle. Un filtre RLS dynamique sur DeptManager se propage par les relations jusqu'à Employee, et la sécurité au niveau de l'objet, avec la colonne Salary fixée à None dans la vue TMDL ou Tabular Editor, supprime la colonne et ses métadonnées pour le rôle. Les deux règles se trouvent dans le même rôle, et toutes deux s'appliquent car les responsables sont Viewers.
      options:
        a: { en: "Warehouse security applies to T-SQL queries; the report users read the imported data of SM-HR, which the warehouse rules don't filter.", fr: "La sécurité de l'entrepôt s'applique aux requêtes T-SQL ; les utilisateurs des rapports lisent les données importées de SM-HR, que les règles de l'entrepôt ne filtrent pas." }
        c: { en: "RLS filters rows only; it can't hide a column, and the Salary column and its metadata would still exist for the managers.", fr: "La RLS ne filtre que des lignes ; elle ne peut pas masquer une colonne, et la colonne Salary et ses métadonnées existeraient toujours pour les responsables." }
        d: { en: "A sensitivity label classifies the model and protects its exports; it doesn't hide a column from users who can read the model.", fr: "Une étiquette de confidentialité classe le modèle et protège ses exportations ; elle ne masque pas une colonne aux utilisateurs qui peuvent lire le modèle." }
    references:
      - title: Object-Level Security (OLS) with Power BI
        url: https://learn.microsoft.com/en-us/fabric/security/service-admin-object-level-security
      - title: Row-level security (RLS) with Power BI
        url: https://learn.microsoft.com/en-us/fabric/security/service-admin-row-level-security

  # ------------------------------------------------------------------ 7
  - id: dp600-qz-11-07
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has a Fabric workspace named **WS-Finance** that contains lakehouses, notebooks and a warehouse named **WH-Fin** with 30 tables. A semantic model named **SM-Budget** uses Direct Lake over WH-Fin with the default single sign-on connection and reads only `dbo.Budget`, `dbo.Actuals` and `dbo.CostCenter`. A report named **RPT-Budget** is built on SM-Budget.

        A controller named Mia has no role in WS-Finance. Mia must:

        - open RPT-Budget and see its data;
        - query the three tables used by SM-Budget with T-SQL from SQL Server Management Studio.

        Mia must not read the other tables of WH-Fin or see the other items of WS-Finance. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Contoso dispose d'un espace de travail Fabric nommé **WS-Finance** qui contient des lakehouses, des notebooks et un entrepôt nommé **WH-Fin** comportant 30 tables. Un modèle sémantique nommé **SM-Budget** utilise Direct Lake sur WH-Fin avec la connexion par authentification unique par défaut et ne lit que `dbo.Budget`, `dbo.Actuals` et `dbo.CostCenter`. Un rapport nommé **RPT-Budget** est construit sur SM-Budget.

        Une contrôleuse de gestion nommée Mia n'a aucun rôle dans WS-Finance. Mia doit :

        - ouvrir RPT-Budget et voir ses données ;
        - interroger en T-SQL, depuis SQL Server Management Studio, les trois tables utilisées par SM-Budget.

        Mia ne doit ni lire les autres tables de WH-Fin, ni voir les autres éléments de WS-Finance. La solution doit respecter le principe du privilège minimum.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Share RPT-Budget and WH-Fin with Mia and select Read all data using SQL on WH-Fin.", fr: "Partager RPT-Budget et WH-Fin avec Mia en sélectionnant Read all data using SQL sur WH-Fin." } }
        - { id: b, text: { en: "Share RPT-Budget only; sharing the report gives Mia read access to the tables of its model.", fr: "Partager uniquement RPT-Budget ; le partage du rapport donne à Mia l'accès en lecture aux tables de son modèle." } }
        - { id: c, text: { en: "Assign Mia the Viewer role in WS-Finance, and DENY SELECT on the 27 other tables of WH-Fin.", fr: "Attribuer à Mia le rôle Viewer dans WS-Finance, et exécuter DENY SELECT sur les 27 autres tables de WH-Fin." } }
        - { id: d, text: { en: "Share RPT-Budget, share WH-Fin with no extra permission, and GRANT SELECT on the three tables.", fr: "Partager RPT-Budget, partager WH-Fin sans autorisation supplémentaire, et exécuter GRANT SELECT sur les trois tables." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          With single sign-on, a Direct Lake model over a warehouse reads the data with the identity of the report user, so Mia needs ReadData or granular SQL permissions on the tables of the model. Sharing WH-Fin with no additional permission gives only Read (connect), and GRANT SELECT on the three tables then serves both the report and her T-SQL queries. Sharing the report and the warehouse exposes no other item of WS-Finance.
        fr: |
          Avec l'authentification unique, un modèle Direct Lake sur un entrepôt lit les données avec l'identité de l'utilisateur du rapport : Mia a donc besoin de ReadData ou d'autorisations SQL granulaires sur les tables du modèle. Partager WH-Fin sans autorisation supplémentaire ne donne que Read (connexion), puis GRANT SELECT sur les trois tables sert à la fois le rapport et ses requêtes T-SQL. Partager le rapport et l'entrepôt n'expose aucun autre élément de WS-Finance.
      options:
        a: { en: "ReadData reads every table and view of WH-Fin, including the 27 tables that Mia must not read.", fr: "ReadData lit toutes les tables et vues de WH-Fin, y compris les 27 tables que Mia ne doit pas lire." }
        b: { en: "A Direct Lake or DirectQuery report needs the reader to have permissions on the warehouse, and the report share gives no T-SQL access.", fr: "Un rapport en Direct Lake ou DirectQuery exige que le lecteur ait des autorisations sur l'entrepôt, et le partage du rapport ne donne aucun accès T-SQL." }
        c: { en: "A workspace role opens every item of WS-Finance, including the lakehouses and notebooks that Mia must not see.", fr: "Un rôle d'espace de travail ouvre tous les éléments de WS-Finance, y compris les lakehouses et les notebooks que Mia ne doit pas voir." }
    references:
      - title: Share Your Warehouse and Manage Permissions
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions

  # ------------------------------------------------------------------ 8
  - id: dp600-qz-11-08
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware has a Fabric workspace named **WS-Sales** that contains a semantic model named **SM-Sales** and the reports built on it. SM-Sales has a dynamic row-level security (RLS) role named **Region**, and the security group **SG-Authors** is a member of the role.

        SG-Authors has the Contributor role in WS-Sales. Its members create, edit and publish reports in WS-Sales, and they see the data of every region. Your requirements are:

        - The authors must keep creating, editing and publishing their reports in a workspace that they share.
        - Each author must see only the data of their own region, in the service and in Power BI Desktop.

        The solution must follow the principle of least privilege. What should you do?
      fr: |
        Litware dispose d'un espace de travail Fabric nommé **WS-Sales** qui contient un modèle sémantique nommé **SM-Sales** et les rapports construits dessus. SM-Sales a un rôle de sécurité au niveau des lignes (RLS) dynamique nommé **Region**, dont le groupe de sécurité **SG-Authors** est membre.

        SG-Authors a le rôle Contributor dans WS-Sales. Ses membres créent, modifient et publient des rapports dans WS-Sales, et voient les données de toutes les régions. Vos exigences sont les suivantes :

        - Les auteurs doivent continuer à créer, modifier et publier leurs rapports dans un espace de travail qu'ils partagent.
        - Chaque auteur ne doit voir que les données de sa propre région, dans le service et dans Power BI Desktop.

        La solution doit respecter le principe du privilège minimum. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Change the role of SG-Authors to Viewer in WS-Sales, and grant SG-Authors the Build permission on SM-Sales.", fr: "Remplacer le rôle de SG-Authors par Viewer dans WS-Sales, et accorder à SG-Authors l'autorisation Build sur SM-Sales." } }
        - { id: b, text: { en: "Keep the Contributor role of SG-Authors in WS-Sales, and grant SG-Authors the Build permission on SM-Sales.", fr: "Conserver le rôle Contributor de SG-Authors dans WS-Sales, et accorder à SG-Authors l'autorisation Build sur SM-Sales." } }
        - { id: c, text: { en: "Publish SM-Sales to a workspace where SG-Authors has no role, grant Build on it, and keep their Contributor role in WS-Sales.", fr: "Publier SM-Sales dans un espace de travail où SG-Authors n'a aucun rôle, y accorder Build, et garder leur rôle Contributor dans WS-Sales." } }
        - { id: d, text: { en: "Change the role of SG-Authors to Member in WS-Sales, and remove their Write permission on SM-Sales.", fr: "Remplacer le rôle de SG-Authors par Member dans WS-Sales, et retirer leur autorisation Write sur SM-Sales." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Semantic model RLS doesn't filter Admins, Members or Contributors of the model's workspace, because they have write permission on the model. With SM-Sales in a separate workspace where they have no role, the authors read it through Build only, so the Region role filters them, including in Desktop. Their Contributor role in WS-Sales still lets them create and publish thin reports that connect to SM-Sales.
        fr: |
          La RLS du modèle sémantique ne filtre pas les Admins, Members ou Contributors de l'espace de travail du modèle, car ils ont l'autorisation d'écriture sur le modèle. Avec SM-Sales dans un espace de travail distinct où ils n'ont aucun rôle, les auteurs ne le lisent que par Build : le rôle Region les filtre donc, y compris dans Desktop. Leur rôle Contributor dans WS-Sales leur permet toujours de créer et publier des rapports légers connectés à SM-Sales.
      options:
        a: { en: "Viewers are filtered by RLS, but they can't create or publish items, so the authors could no longer work in WS-Sales.", fr: "Les Viewers sont filtrés par la RLS, mais ne peuvent ni créer ni publier d'éléments : les auteurs ne pourraient plus travailler dans WS-Sales." }
        b: { en: "Contributors of the model's workspace have write permission on SM-Sales, so RLS still wouldn't filter them.", fr: "Les Contributors de l'espace de travail du modèle ont l'écriture sur SM-Sales : la RLS ne les filtrerait toujours pas." }
        d: { en: "Permissions inherited from a workspace role can't be removed on the item, and Member grants more than Contributor.", fr: "Les autorisations héritées d'un rôle d'espace de travail ne peuvent pas être retirées sur l'élément, et Member accorde plus que Contributor." }
    references:
      - title: Row-level security (RLS) with Power BI
        url: https://learn.microsoft.com/en-us/fabric/security/service-admin-row-level-security
      - title: Semantic model permissions
        url: https://learn.microsoft.com/en-us/power-bi/connect-data/service-datasets-permissions

  # ------------------------------------------------------------------ 9
  - id: dp600-qz-11-09
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Woodgrove Bank has a Fabric warehouse named **WH-Loans**. A security policy named `Security.BranchFilter`, created with the default options, adds the filter predicate function `Security.fn_branch` on `dbo.FactLoans`, so that each branch manager sees only the loans of their branch.

        An auditor named audit@woodgrove.com must now see every row of `dbo.FactLoans` with T-SQL. The branch managers must keep their current filter, and no other row-level security must be added to the table.

        Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Woodgrove Bank dispose d'un entrepôt Fabric nommé **WH-Loans**. Une stratégie de sécurité nommée `Security.BranchFilter`, créée avec les options par défaut, ajoute la fonction de prédicat de filtre `Security.fn_branch` sur `dbo.FactLoans`, pour que chaque directeur d'agence ne voie que les prêts de son agence.

        Un auditeur nommé audit@woodgrove.com doit désormais voir toutes les lignes de `dbo.FactLoans` en T-SQL. Les directeurs d'agence doivent conserver leur filtre actuel, et aucune autre sécurité au niveau des lignes ne doit être ajoutée à la table.

        Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 3
      actions:
        - { id: admin, text: { en: "Assign audit@woodgrove.com the Admin role in the workspace of WH-Loans.", fr: "Attribuer à audit@woodgrove.com le rôle Admin dans l'espace de travail de WH-Loans." } }
        - { id: drop, text: { en: "Run DROP SECURITY POLICY Security.BranchFilter.", fr: "Exécuter DROP SECURITY POLICY Security.BranchFilter." } }
        - { id: second, text: { en: "Create a second security policy that adds a filter predicate for the auditor on dbo.FactLoans.", fr: "Créer une seconde stratégie de sécurité qui ajoute un prédicat de filtre pour l'auditeur sur dbo.FactLoans." } }
        - { id: alter, text: { en: "Run ALTER FUNCTION Security.fn_branch to also return a row when USER_NAME() is audit@woodgrove.com.", fr: "Exécuter ALTER FUNCTION Security.fn_branch pour renvoyer aussi une ligne quand USER_NAME() vaut audit@woodgrove.com." } }
        - { id: create, text: { en: "Run CREATE SECURITY POLICY Security.BranchFilter with the filter predicate on dbo.FactLoans and STATE = ON.", fr: "Exécuter CREATE SECURITY POLICY Security.BranchFilter avec le prédicat de filtre sur dbo.FactLoans et STATE = ON." } }
        - { id: unmask, text: { en: "Run GRANT UNMASK ON dbo.FactLoans TO the account of the auditor.", fr: "Exécuter GRANT UNMASK ON dbo.FactLoans TO pour le compte de l'auditeur." } }
    answer:
      sequence: [drop, alter, create]
    explanation:
      correct:
        en: |
          A security policy is schema-bound by default, so a predicate function used by the policy can't be altered. You drop the policy, alter the function so that it also returns a row for the auditor, and recreate the policy with the filter predicate enabled. Security policies apply to every user, including workspace Admins, so a role change can't exempt the auditor.
        fr: |
          Une stratégie de sécurité est liée au schéma par défaut : une fonction de prédicat utilisée par la stratégie ne peut donc pas être modifiée. Vous supprimez la stratégie, modifiez la fonction pour qu'elle renvoie aussi une ligne pour l'auditeur, puis recréez la stratégie avec le prédicat de filtre activé. Les stratégies de sécurité s'appliquent à tous les utilisateurs, y compris les Admins de l'espace de travail : un changement de rôle ne peut pas exempter l'auditeur.
      options:
        admin: { en: "Security policies also filter workspace Admins; only the predicate logic can let a user see every row.", fr: "Les stratégies de sécurité filtrent aussi les Admins de l'espace de travail ; seule la logique du prédicat peut laisser un utilisateur voir toutes les lignes." }
        second: { en: "A table that already has a filter predicate can't get a second one for the same operation, and the requirement forbids it.", fr: "Une table qui a déjà un prédicat de filtre ne peut pas en recevoir un second pour la même opération, et l'exigence l'interdit." }
        unmask: { en: "UNMASK relates to dynamic data masking; it doesn't bypass row-level security.", fr: "UNMASK concerne le masquage dynamique des données ; il ne contourne pas la sécurité au niveau des lignes." }
    references:
      - title: Row-Level Security in Fabric Data Warehouse
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/row-level-security

  # ------------------------------------------------------------------ 10
  - id: dp600-qz-11-10
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has a Fabric workspace named **WS-People** that contains a lakehouse named **LH-People** with the default OneLake security roles. The table `employees` of LH-People has a column named `salary`. You have the Member role in WS-People.

        The security group **SG-Analysts** has no role in WS-People. LH-People was shared with SG-Analysts with Read all with SQL analytics endpoint and Read all with Apache Spark. To hide `salary`, you ran `DENY SELECT ON dbo.employees (salary)` for SG-Analysts in the SQL analytics endpoint, which uses its default access mode. The analysts no longer see `salary` in SQL Server Management Studio, but they still read it from Spark notebooks.

        SG-Analysts must not read `salary` from any engine, and must keep reading the other columns and tables of LH-People from SQL and Spark.

        Which three actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un espace de travail Fabric nommé **WS-People** qui contient un lakehouse nommé **LH-People** avec les rôles de sécurité OneLake par défaut. La table `employees` de LH-People a une colonne nommée `salary`. Vous avez le rôle Member dans WS-People.

        Le groupe de sécurité **SG-Analysts** n'a aucun rôle dans WS-People. LH-People a été partagé avec SG-Analysts avec Read all with SQL analytics endpoint et Read all with Apache Spark. Pour masquer `salary`, vous avez exécuté `DENY SELECT ON dbo.employees (salary)` pour SG-Analysts dans le point de terminaison d'analytique SQL, qui utilise son mode d'accès par défaut. Les analystes ne voient plus `salary` dans SQL Server Management Studio, mais le lisent toujours depuis des notebooks Spark.

        SG-Analysts ne doit lire `salary` depuis aucun moteur, et doit continuer à lire les autres colonnes et tables de LH-People depuis SQL et Spark.

        Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Create a OneLake security role that grants Read on the tables, hides the salary column, and has SG-Analysts as a member.", fr: "Créer un rôle de sécurité OneLake qui accorde Read sur les tables, masque la colonne salary et a SG-Analysts pour membre." } }
        - { id: b, text: { en: "Assign SG-Analysts the Contributor role in WS-People so that the OneLake security roles apply to its members.", fr: "Attribuer à SG-Analysts le rôle Contributor dans WS-People pour que les rôles de sécurité OneLake s'appliquent à ses membres." } }
        - { id: c, text: { en: "Remove the Read all with Apache Spark permission of SG-Analysts on LH-People.", fr: "Retirer l'autorisation Read all with Apache Spark de SG-Analysts sur LH-People." } }
        - { id: d, text: { en: "Apply the Highly Confidential sensitivity label to LH-People and to its SQL analytics endpoint.", fr: "Appliquer l'étiquette de confidentialité Highly Confidential à LH-People et à son point de terminaison d'analytique SQL." } }
        - { id: e, text: { en: "Switch the SQL analytics endpoint of LH-People to User's identity access mode.", fr: "Faire passer le point de terminaison d'analytique SQL de LH-People en mode d'accès identité de l'utilisateur." } }
        - { id: f, text: { en: "Create a security policy in the SQL analytics endpoint that filters dbo.employees for SG-Analysts.", fr: "Créer une stratégie de sécurité dans le point de terminaison d'analytique SQL qui filtre dbo.employees pour SG-Analysts." } }
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: |
          A SQL DENY protects only T-SQL queries; Spark reads the Delta files in OneLake. Column-level security in a OneLake security role is enforced for every engine, but SG-Analysts also belongs to DefaultReader through its ReadAll permission, and roles combine as a union, so removing ReadAll leaves only the restricted role. The SQL analytics endpoint enforces OneLake security only in User's identity access mode, which a Member can turn on.
        fr: |
          Un DENY SQL ne protège que les requêtes T-SQL ; Spark lit les fichiers Delta dans OneLake. La sécurité au niveau des colonnes d'un rôle de sécurité OneLake s'applique à tous les moteurs, mais SG-Analysts appartient aussi à DefaultReader par son autorisation ReadAll, et les rôles se combinent par union : retirer ReadAll ne laisse que le rôle restreint. Le point de terminaison d'analytique SQL n'applique la sécurité OneLake qu'en mode d'accès identité de l'utilisateur, qu'un Member peut activer.
      options:
        b: { en: "Contributors have write permission on the lakehouse, so OneLake security roles wouldn't restrict them at all.", fr: "Les Contributors ont l'écriture sur le lakehouse : les rôles de sécurité OneLake ne les restreindraient pas du tout." }
        d: { en: "A sensitivity label classifies the item and protects exports; it doesn't hide a column from users who can read the table.", fr: "Une étiquette de confidentialité classe l'élément et protège les exportations ; elle ne masque pas une colonne aux utilisateurs qui peuvent lire la table." }
        f: { en: "A security policy filters rows, not columns, and only for T-SQL queries; Spark would still read salary.", fr: "Une stratégie de sécurité filtre des lignes, pas des colonnes, et uniquement pour les requêtes T-SQL ; Spark lirait toujours salary." }
    references:
      - title: OneLake table, column, and row-level security
        url: https://learn.microsoft.com/en-us/fabric/onelake/security/column-level-security
      - title: OneLake Security for SQL analytics endpoints
        url: https://learn.microsoft.com/en-us/fabric/onelake/sql-analytics-endpoint-onelake-security
