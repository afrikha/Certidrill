chapter: 12-development-lifecycle
questions:
  # ------------------------------------------------------------------ 1
  - id: dp600-qz-12-01
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum plans to connect a Fabric workspace named **WS-Data** to a Git repository by using Fabric Git integration.

        Which repository can you connect WS-Data to?
      fr: |
        Adatum prévoit de connecter un espace de travail Fabric nommé **WS-Data** à un référentiel Git à l'aide de l'intégration Git de Fabric.

        À quel référentiel pouvez-vous connecter WS-Data ?
    body:
      options:
        - { id: a, text: { en: "A repository on an Azure DevOps Server that Adatum hosts in its datacenter", fr: "Un référentiel sur un serveur Azure DevOps Server qu'Adatum héberge dans son centre de données" } }
        - { id: b, text: { en: "A repository on a GitHub Enterprise Server instance that Adatum hosts", fr: "Un référentiel sur une instance GitHub Enterprise Server qu'Adatum héberge" } }
        - { id: c, text: { en: "A repository in a Bitbucket Cloud workspace of Adatum", fr: "Un référentiel dans un espace de travail Bitbucket Cloud d'Adatum" } }
        - { id: d, text: { en: "A repository in a GitHub Enterprise Cloud organization of Adatum", fr: "Un référentiel dans une organisation GitHub Enterprise Cloud d'Adatum" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Fabric Git integration supports three providers, all cloud-based only: Azure DevOps, GitHub and GitHub Enterprise. A repository in a GitHub Enterprise Cloud organization is therefore supported.
        fr: |
          L'intégration Git de Fabric prend en charge trois fournisseurs, tous uniquement dans le cloud : Azure DevOps, GitHub et GitHub Enterprise. Un référentiel d'une organisation GitHub Enterprise Cloud est donc pris en charge.
      options:
        a: { en: "Azure DevOps is supported only in its cloud service; a self-hosted Azure DevOps Server isn't.", fr: "Azure DevOps n'est pris en charge que dans son service cloud ; un Azure DevOps Server auto-hébergé ne l'est pas." }
        b: { en: "GitHub Enterprise is supported only in the cloud; a self-hosted GitHub Enterprise Server isn't.", fr: "GitHub Enterprise n'est pris en charge que dans le cloud ; un GitHub Enterprise Server auto-hébergé ne l'est pas." }
        c: { en: "Bitbucket isn't one of the Git providers that Fabric Git integration supports.", fr: "Bitbucket ne fait pas partie des fournisseurs Git pris en charge par l'intégration Git de Fabric." }
    references:
      - title: Overview of Fabric Git integration
        url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/intro-to-git-integration

  # ------------------------------------------------------------------ 2
  - id: dp600-qz-12-02
    objective: "1.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have the Contributor role in a Fabric workspace named **WS-Core** that contains a warehouse named **WH-Core**. You plan to drop a column of WH-Core.

        In the impact analysis pane of WH-Core, you need to see every item that could be affected, including the reports built on the semantic models that read WH-Core, grouped by type of item.

        Which options should you select?
      fr: |
        Vous avez le rôle Contributor dans un espace de travail Fabric nommé **WS-Core** qui contient un entrepôt nommé **WH-Core**. Vous prévoyez de supprimer une colonne de WH-Core.

        Dans le volet d'analyse d'impact de WH-Core, vous devez voir tous les éléments susceptibles d'être touchés, y compris les rapports construits sur les modèles sémantiques qui lisent WH-Core, regroupés par type d'élément.

        Quelles options devez-vous sélectionner ?
    body:
      options:
        - { id: a, text: { en: "Child items, and then Browse by item type", fr: "Éléments enfants, puis Parcourir par type d'élément" } }
        - { id: b, text: { en: "All downstream items, and then Browse by workspace", fr: "Tous les éléments en aval, puis Parcourir par espace de travail" } }
        - { id: c, text: { en: "All downstream items, and then Browse by item type", fr: "Tous les éléments en aval, puis Parcourir par type d'élément" } }
        - { id: d, text: { en: "Child items, and then Browse by workspace", fr: "Éléments enfants, puis Parcourir par espace de travail" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          All downstream items lists every dependent item, not only the direct children, so the reports built on the semantic models appear. Browse by item type then groups the affected items by type, such as semantic models and reports.
        fr: |
          Tous les éléments en aval liste chaque élément dépendant, pas seulement les enfants directs : les rapports construits sur les modèles sémantiques apparaissent donc. Parcourir par type d'élément regroupe ensuite les éléments touchés par type, comme les modèles sémantiques et les rapports.
      options:
        a: { en: "Child items shows only the direct children of WH-Core, such as the semantic models, not the reports built on them.", fr: "Éléments enfants ne montre que les enfants directs de WH-Core, comme les modèles sémantiques, pas les rapports construits dessus." }
        b: { en: "The scope is right, but Browse by workspace groups the items by workspace instead of by type.", fr: "L'étendue est correcte, mais Parcourir par espace de travail regroupe les éléments par espace de travail et non par type." }
        d: { en: "Child items misses the reports, and Browse by workspace doesn't group by type of item.", fr: "Éléments enfants omet les rapports, et Parcourir par espace de travail ne regroupe pas par type d'élément." }
    references:
      - title: Impact analysis
        url: https://learn.microsoft.com/en-us/fabric/governance/impact-analysis

  # ------------------------------------------------------------------ 3
  - id: dp600-qz-12-03
    objective: "1.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A developer clones a Git repository that contains the folders **Sales.Report** and **Sales.SemanticModel** of a Power BI project. The project's **Sales.pbip** file was never committed.

        The developer must open the report together with its semantic model in Power BI Desktop to edit them.

        Which file should the developer open?
      fr: |
        Un développeur clone un référentiel Git qui contient les dossiers **Sales.Report** et **Sales.SemanticModel** d'un projet Power BI. Le fichier **Sales.pbip** du projet n'a jamais été validé.

        Le développeur doit ouvrir le rapport et son modèle sémantique dans Power BI Desktop pour les modifier.

        Quel fichier le développeur doit-il ouvrir ?
    body:
      options:
        - { id: a, text: "Sales.SemanticModel\\definition.pbism" }
        - { id: b, text: "Sales.Report\\definition.pbir" }
        - { id: c, text: "Sales.SemanticModel\\definition\\model.tmdl" }
        - { id: d, text: "Sales.SemanticModel\\.pbi\\localSettings.json" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The .pbip file is optional: Power BI Desktop also opens a project from the definition.pbir file of a report folder. Because definition.pbir references the semantic model, Desktop opens the model for editing together with the report.
        fr: |
          Le fichier .pbip est facultatif : Power BI Desktop ouvre aussi un projet depuis le fichier definition.pbir d'un dossier de rapport. Comme definition.pbir référence le modèle sémantique, Desktop ouvre le modèle en modification avec le rapport.
      options:
        a: { en: "definition.pbism describes the semantic model folder; it isn't a file that you open in Desktop to start editing.", fr: "definition.pbism décrit le dossier du modèle sémantique ; ce n'est pas un fichier que l'on ouvre dans Desktop pour commencer à modifier." }
        c: { en: "TMDL files hold the model metadata as text for editors such as Visual Studio Code; Desktop doesn't open a project from them.", fr: "Les fichiers TMDL contiennent les métadonnées du modèle en texte pour des éditeurs comme Visual Studio Code ; Desktop n'ouvre pas un projet depuis eux." }
        d: { en: "localSettings.json holds settings of the local user and is excluded from Git by the default .gitignore.", fr: "localSettings.json contient des paramètres de l'utilisateur local et est exclu de Git par le .gitignore par défaut." }
    references:
      - title: Power BI Desktop projects (PBIP)
        url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-overview

  # ------------------------------------------------------------------ 4
  - id: dp600-qz-12-04
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has a deployment pipeline with Development, Test and Production stages. The Test and Production workspaces contain the paired items **SM-Sales** (a semantic model) and **RPT-Sales** (a report). Sensitivity labels are enabled.

        - In Test, SM-Sales has the protected label **Highly Confidential**, and RPT-Sales has the unprotected label **General**. RPT-Sales in Test was shared with the security group **SG-Testers**.
        - In Production, SM-Sales has the unprotected label **Confidential**, and RPT-Sales has the unprotected label **Confidential**.

        You deploy SM-Sales and RPT-Sales from Test to Production and confirm every prompt.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un pipeline de déploiement avec les étapes Development, Test et Production. Les espaces de travail de Test et de Production contiennent les éléments appariés **SM-Sales** (un modèle sémantique) et **RPT-Sales** (un rapport). Les étiquettes de confidentialité sont activées.

        - En Test, SM-Sales a l'étiquette protégée **Highly Confidential**, et RPT-Sales a l'étiquette non protégée **General**. RPT-Sales en Test a été partagé avec le groupe de sécurité **SG-Testers**.
        - En Production, SM-Sales a l'étiquette non protégée **Confidential**, et RPT-Sales a l'étiquette non protégée **Confidential**.

        Vous déployez SM-Sales et RPT-Sales de Test vers Production et confirmez chaque invite.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "After the deployment, SG-Testers can open RPT-Sales in Production."
            fr: "Après le déploiement, SG-Testers peut ouvrir RPT-Sales en Production."
        - id: s2
          text:
            en: "After the deployment, SM-Sales in Production has the Highly Confidential label."
            fr: "Après le déploiement, SM-Sales en Production a l'étiquette Highly Confidential."
        - id: s3
          text:
            en: "After the deployment, RPT-Sales in Production has the General label."
            fr: "Après le déploiement, RPT-Sales en Production a l'étiquette General."
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Deployment overwrites the content of the paired items but not their permissions, so the sharing of RPT-Sales in Test isn't copied. Between existing items, a label is copied only when the source label is protected and the target label isn't, after a consent prompt: SM-Sales gets Highly Confidential, while RPT-Sales, whose source label General is unprotected, keeps Confidential.
        fr: |
          Le déploiement écrase le contenu des éléments appariés mais pas leurs autorisations : le partage de RPT-Sales en Test n'est donc pas copié. Entre éléments existants, une étiquette n'est copiée que si l'étiquette source est protégée et que celle de la cible ne l'est pas, après une invite de consentement : SM-Sales reçoit Highly Confidential, tandis que RPT-Sales, dont l'étiquette source General n'est pas protégée, conserve Confidential.
      options:
        s1: { en: "Permissions of a workspace or of an item are never copied; the item keeps its own permissions in Production.", fr: "Les autorisations d'un espace de travail ou d'un élément ne sont jamais copiées ; l'élément conserve ses propres autorisations en Production." }
        s3: { en: "The source label General isn't protected, so the deployment doesn't copy it over the existing label.", fr: "L'étiquette source General n'est pas protégée : le déploiement ne la copie donc pas par-dessus l'étiquette existante." }
    references:
      - title: The Microsoft Fabric deployment pipelines process
        url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/understand-the-deployment-process

  # ------------------------------------------------------------------ 5
  - id: dp600-qz-12-05
    objective: "1.2.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The BI team of Litware distributes a Power BI template named **Sales.pbit**. Twenty-five analysts created and published reports from it, and each report imports the sales tables into its own model. When the BI team changes a measure, the reports keep the old definition.

        Every report must use one definition of the measures, and future changes must reach all the reports without the analysts republishing them. The analysts must keep designing their own reports.

        What should you do?
      fr: |
        L'équipe BI de Litware distribue un fichier de modèle Power BI nommé **Sales.pbit**. Vingt-cinq analystes ont créé et publié des rapports à partir de lui, et chaque rapport importe les tables de ventes dans son propre modèle. Quand l'équipe BI modifie une mesure, les rapports conservent l'ancienne définition.

        Chaque rapport doit utiliser une seule définition des mesures, et les modifications futures doivent atteindre tous les rapports sans que les analystes les republient. Les analystes doivent continuer à concevoir leurs propres rapports.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Export a new Sales.pbit after each change, and ask the analysts to recreate their reports from it.", fr: "Exporter un nouveau Sales.pbit après chaque modification, et demander aux analystes de recréer leurs rapports à partir de lui." } }
        - { id: b, text: { en: "Publish one semantic model, grant the analysts Build on it, and have them connect their reports to it live.", fr: "Publier un seul modèle sémantique, accorder Build aux analystes, et leur faire connecter leurs rapports en direct à ce modèle." } }
        - { id: c, text: { en: "Distribute a .pbids file so that all the reports of the analysts use the same connection to the source.", fr: "Distribuer un fichier .pbids pour que tous les rapports des analystes utilisent la même connexion à la source." } }
        - { id: d, text: { en: "Save Sales as a Power BI project in a Git repository, and give the analysts access to the repository.", fr: "Enregistrer Sales en projet Power BI dans un référentiel Git, et donner aux analystes l'accès au référentiel." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A shared semantic model is one governed model that many reports use through a live connection. When the model is republished, the reports built on it aren't overwritten but reflect its changes, so a measure changes once for every report. The analysts need Build permission on the model to create their reports on it.
        fr: |
          Un modèle sémantique partagé est un modèle gouverné unique que de nombreux rapports utilisent par une connexion active. Quand le modèle est republié, les rapports construits dessus ne sont pas écrasés mais reflètent ses modifications : une mesure change donc une seule fois pour tous les rapports. Les analystes ont besoin de l'autorisation Build sur le modèle pour créer leurs rapports dessus.
      options:
        a: { en: "A template is only a starting point: each report created from it keeps its own model, so changes never propagate.", fr: "Un modèle Power BI n'est qu'un point de départ : chaque rapport créé à partir de lui garde son propre modèle, et les modifications ne se propagent jamais." }
        c: { en: "A .pbids file holds one connection; each report would still import the data into its own model with its own measures.", fr: "Un fichier .pbids contient une connexion ; chaque rapport importerait toujours les données dans son propre modèle avec ses propres mesures." }
        d: { en: "A project versions the definitions in Git; it doesn't make the published reports share one model.", fr: "Un projet versionne les définitions dans Git ; il ne fait pas partager un seul modèle aux rapports publiés." }
    references:
      - title: Connect to semantic models in Power BI
        url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-report-lifecycle-datasets
      - title: Create and Use Report Templates in Power BI Desktop
        url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-templates

  # ------------------------------------------------------------------ 6
  - id: dp600-qz-12-06
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        The analytics team of Northwind Traders has the following requirements:

        - Restore a notebook of the workspace **WS-Dev** to the version from last week.
        - Each time notebooks are promoted to the workspace **WS-Prod**, make them use the lakehouse of WS-Prod.
        - Refresh only one partition of a semantic model from an Azure Automation runbook.
        - Let two developers change measures of the same semantic model in parallel and merge their changes line by line.
        - Give report authors a file that opens Navigator on a SQL database, with no table or report page.

        Which tool or file should you use for each requirement? To answer, drag the appropriate tools or files to the correct requirements. Each tool or file may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe d'analyse de Northwind Traders a les exigences suivantes :

        - Restaurer un notebook de l'espace de travail **WS-Dev** à sa version de la semaine dernière.
        - À chaque promotion des notebooks vers l'espace de travail **WS-Prod**, leur faire utiliser le lakehouse de WS-Prod.
        - Actualiser une seule partition d'un modèle sémantique depuis un runbook Azure Automation.
        - Permettre à deux développeurs de modifier en parallèle des mesures du même modèle sémantique et de fusionner leurs modifications ligne par ligne.
        - Donner aux auteurs de rapports un fichier qui ouvre le Navigateur sur une base de données SQL, sans table ni page de rapport.

        Quel outil ou fichier devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les outils ou fichiers appropriés vers les exigences correspondantes. Chaque outil ou fichier peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: git, text: { en: "Fabric Git integration", fr: "Intégration Git de Fabric" } }
        - { id: pipeline, text: { en: "Deployment pipeline", fr: "Pipeline de déploiement" } }
        - { id: xmla, text: { en: "XMLA endpoint", fr: "Point de terminaison XMLA" } }
        - { id: pbip, text: { en: "Power BI project (.pbip)", fr: "Projet Power BI (.pbip)" } }
        - { id: pbit, text: { en: "Power BI template (.pbit)", fr: "Modèle Power BI (.pbit)" } }
        - { id: pbids, text: { en: "Power BI data source file (.pbids)", fr: "Fichier de source de données Power BI (.pbids)" } }
      targets:
        - { id: restore, text: { en: "Restore last week's version of the notebook", fr: "Restaurer la version de la semaine dernière du notebook" } }
        - { id: promote, text: { en: "Use the WS-Prod lakehouse after each promotion", fr: "Utiliser le lakehouse de WS-Prod après chaque promotion" } }
        - { id: partition, text: { en: "Refresh one partition from a runbook", fr: "Actualiser une partition depuis un runbook" } }
        - { id: merge, text: { en: "Merge parallel changes to measures line by line", fr: "Fusionner ligne par ligne des modifications parallèles de mesures" } }
        - { id: navigator, text: { en: "Open Navigator on a SQL database, with no table or page", fr: "Ouvrir le Navigateur sur une base SQL, sans table ni page" } }
    answer:
      mapping: { restore: git, promote: pipeline, partition: xmla, merge: pbip, navigator: pbids }
    explanation:
      correct:
        en: |
          Git integration keeps the history of the item definitions of a workspace, so an earlier version of a notebook can be brought back. A deployment pipeline promotes items between stage workspaces, and a default lakehouse rule makes notebooks use the lakehouse of the target stage. The XMLA endpoint lets scripts run TMSL refresh commands on single partitions. A .pbip project saves the model as text files that Git can diff and merge, and a .pbids file holds one connection without tables, so Desktop opens Navigator.
        fr: |
          L'intégration Git conserve l'historique des définitions des éléments d'un espace de travail : une version antérieure d'un notebook peut donc être récupérée. Un pipeline de déploiement promeut les éléments entre les espaces de travail des étapes, et une règle de lakehouse par défaut fait utiliser aux notebooks le lakehouse de l'étape cible. Le point de terminaison XMLA permet à des scripts d'exécuter des commandes d'actualisation TMSL sur une seule partition. Un projet .pbip enregistre le modèle en fichiers texte que Git peut comparer et fusionner, et un fichier .pbids contient une connexion sans tables : Desktop ouvre alors le Navigateur.
      options:
        pbit: { en: "A template carries report pages, the model and its queries; it fits none of the requirements, and it would bring tables and pages to the authors.", fr: "Un modèle Power BI transporte les pages, le modèle et ses requêtes ; il ne répond à aucune exigence, et il apporterait des tables et des pages aux auteurs." }
    references:
      - title: Overview of Fabric Git integration
        url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/intro-to-git-integration
      - title: Create deployment rules for Fabric's ALM
        url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/create-rules

  # ------------------------------------------------------------------ 7
  - id: dp600-qz-12-07
    objective: "1.2.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Report authors at Tailspin Toys build reports on two sources: an Azure SQL database named **SalesDB** on the server **sql-tailspin.database.windows.net**, and the SharePoint lists of the site **https://tailspin.sharepoint.com/sites/Stores**.

        You need to give the authors ready-made connections to both sources. When an author opens a connection, Power BI Desktop must ask for the author's own credentials and let the author select the tables. The files must contain no table, query or report page.

        What should you create? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Les auteurs de rapports de Tailspin Toys créent des rapports sur deux sources : une base de données Azure SQL nommée **SalesDB** sur le serveur **sql-tailspin.database.windows.net**, et les listes SharePoint du site **https://tailspin.sharepoint.com/sites/Stores**.

        Vous devez donner aux auteurs des connexions prêtes à l'emploi vers les deux sources. Quand un auteur ouvre une connexion, Power BI Desktop doit lui demander ses propres informations d'identification et le laisser sélectionner les tables. Les fichiers ne doivent contenir ni table, ni requête, ni page de rapport.

        Que devez-vous créer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "One .pbids file whose connections array contains both SalesDB and the SharePoint site", fr: "Un seul fichier .pbids dont le tableau connections contient SalesDB et le site SharePoint" } }
        - { id: b, text: { en: "One .pbids file with the tds protocol and the server and database of SalesDB", fr: "Un fichier .pbids avec le protocole tds, et le serveur et la base de données de SalesDB" } }
        - { id: c, text: { en: "One .pbit file whose Power Query queries connect to SalesDB and to the SharePoint site", fr: "Un fichier .pbit dont les requêtes Power Query se connectent à SalesDB et au site SharePoint" } }
        - { id: d, text: { en: "One .pbids file with the sharepoint-list protocol and the URL of the Stores site", fr: "Un fichier .pbids avec le protocole sharepoint-list et l'URL du site Stores" } }
        - { id: e, text: { en: "One .pbids file for SalesDB that also stores a read-only SQL login for the authors", fr: "Un fichier .pbids pour SalesDB qui stocke aussi une connexion SQL en lecture seule pour les auteurs" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          A .pbids file describes exactly one data source, with no credentials, tables or queries, so two sources need two files. The SQL database uses the tds protocol with its server and database, and the SharePoint lists use the sharepoint-list protocol with the URL of the site. When an author opens either file, Desktop asks for credentials and opens Navigator to select the tables.
        fr: |
          Un fichier .pbids décrit exactement une source de données, sans informations d'identification, tables ni requêtes : deux sources demandent donc deux fichiers. La base SQL utilise le protocole tds avec son serveur et sa base de données, et les listes SharePoint le protocole sharepoint-list avec l'URL du site. Quand un auteur ouvre l'un des fichiers, Desktop demande ses informations d'identification et ouvre le Navigateur pour sélectionner les tables.
      options:
        a: { en: "A .pbids file supports a single data source; specifying more than one results in an error.", fr: "Un fichier .pbids ne prend en charge qu'une source de données ; en spécifier plusieurs provoque une erreur." }
        c: { en: "A template contains the query definitions and the model, which the files must not contain.", fr: "Un modèle Power BI contient les définitions de requêtes et le modèle, que les fichiers ne doivent pas contenir." }
        e: { en: "A .pbids file never contains authentication information; the author is prompted for credentials.", fr: "Un fichier .pbids ne contient jamais d'informations d'authentification ; l'auteur est invité à saisir ses informations d'identification." }
    references:
      - title: Data sources in Power BI Desktop
        url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-data-sources

  # ------------------------------------------------------------------ 8
  - id: dp600-qz-12-08
    objective: "1.2.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has two Fabric capacities named **F-Dev** and **F-Prod** whose semantic model workload settings have never been changed. The workspaces **WS-Dev** and **WS-Prod** are both assigned to F-Prod.

        Your requirements are:

        - Developers, who are Contributors in WS-Dev, must deploy model changes to WS-Dev with Tabular Editor.
        - Nobody, including the Admins of WS-Prod, must be able to change the models of WS-Prod through the XMLA endpoint.
        - Analysts must keep querying the models of WS-Prod through the XMLA endpoint with DAX Studio.

        What should you do?
      fr: |
        Contoso dispose de deux capacités Fabric nommées **F-Dev** et **F-Prod** dont les paramètres de la charge de travail des modèles sémantiques n'ont jamais été modifiés. Les espaces de travail **WS-Dev** et **WS-Prod** sont tous deux attribués à F-Prod.

        Vos exigences sont les suivantes :

        - Les développeurs, qui sont Contributors dans WS-Dev, doivent déployer des modifications de modèles dans WS-Dev avec Tabular Editor.
        - Personne, y compris les Admins de WS-Prod, ne doit pouvoir modifier les modèles de WS-Prod par le point de terminaison XMLA.
        - Les analystes doivent continuer à interroger les modèles de WS-Prod par le point de terminaison XMLA avec DAX Studio.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set XMLA Endpoint to Read Write on F-Prod, and remove the Build permission of the users of WS-Prod.", fr: "Régler XMLA Endpoint sur Read Write sur F-Prod, et retirer l'autorisation Build des utilisateurs de WS-Prod." } }
        - { id: b, text: { en: "Set XMLA Endpoint to Read Write on F-Dev only, and keep WS-Dev and WS-Prod assigned to F-Prod.", fr: "Régler XMLA Endpoint sur Read Write sur F-Dev uniquement, et laisser WS-Dev et WS-Prod attribués à F-Prod." } }
        - { id: c, text: { en: "Assign WS-Dev to F-Dev, and set XMLA Endpoint to Read Write on F-Dev only.", fr: "Attribuer WS-Dev à F-Dev, et régler XMLA Endpoint sur Read Write sur F-Dev uniquement." } }
        - { id: d, text: { en: "Set XMLA Endpoint to Read Write on F-Prod, and turn off the tenant setting that allows XMLA endpoints.", fr: "Régler XMLA Endpoint sur Read Write sur F-Prod, et désactiver le paramètre de locataire qui autorise les points de terminaison XMLA." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The XMLA Endpoint setting belongs to the capacity and applies to every workspace and semantic model assigned to it, and its default is Read. Moving WS-Dev to F-Dev and enabling Read Write there lets the developers write with Tabular Editor, while F-Prod stays read-only for everyone, so DAX Studio queries still work and no one can write to the WS-Prod models.
        fr: |
          Le paramètre XMLA Endpoint appartient à la capacité et s'applique à tous les espaces de travail et modèles sémantiques qui lui sont attribués, et sa valeur par défaut est Read. Déplacer WS-Dev vers F-Dev et y activer Read Write permet aux développeurs d'écrire avec Tabular Editor, tandis que F-Prod reste en lecture seule pour tous : les requêtes DAX Studio fonctionnent toujours et personne ne peut écrire dans les modèles de WS-Prod.
      options:
        a: { en: "Build grants read access through XMLA; writing comes from Contributor or higher, so the Admins of WS-Prod could still write, and analysts would lose their queries.", fr: "Build donne l'accès en lecture par XMLA ; l'écriture vient de Contributor ou plus : les Admins de WS-Prod pourraient toujours écrire, et les analystes perdraient leurs requêtes." }
        b: { en: "A workspace uses the XMLA setting of the capacity it is assigned to; WS-Dev would stay read-only on F-Prod.", fr: "Un espace de travail utilise le paramètre XMLA de la capacité à laquelle il est attribué ; WS-Dev resterait en lecture seule sur F-Prod." }
        d: { en: "Turning off XMLA access in the tenant would also block the developers and the DAX Studio queries.", fr: "Désactiver l'accès XMLA dans le locataire bloquerait aussi les développeurs et les requêtes DAX Studio." }
    references:
      - title: Semantic model connectivity and management with the XMLA endpoint in Power BI
        url: https://learn.microsoft.com/en-us/fabric/enterprise/powerbi/service-premium-connect-tools

  # ------------------------------------------------------------------ 9
  - id: dp600-qz-12-09
    objective: "1.2.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank promotes a semantic model named **SM-Risk** through a deployment pipeline with Development, Test and Production stages. SM-Risk was authored in Power BI Desktop and published to the Development workspace. The capacity of all three workspaces has the XMLA Endpoint setting set to **Read Write**.

        Last night, an engineer added a measure named **Net Exposure** directly to SM-Risk in Production by using Tabular Editor. Next week, the team will deploy other changes of SM-Risk from Test to Production.

        Net Exposure must still exist in Production after this and later deployments. The solution must minimize effort.

        What should you do?
      fr: |
        Woodgrove Bank promeut un modèle sémantique nommé **SM-Risk** par un pipeline de déploiement avec les étapes Development, Test et Production. SM-Risk a été créé dans Power BI Desktop et publié dans l'espace de travail de Development. La capacité des trois espaces de travail a le paramètre XMLA Endpoint réglé sur **Read Write**.

        Hier soir, un ingénieur a ajouté une mesure nommée **Net Exposure** directement à SM-Risk en Production avec Tabular Editor. La semaine prochaine, l'équipe déploiera d'autres modifications de SM-Risk de Test vers Production.

        Net Exposure doit toujours exister en Production après ce déploiement et les suivants. La solution doit réduire l'effort au minimum.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Do nothing; a deployment keeps the objects that were added to the target model through XMLA.", fr: "Ne rien faire ; un déploiement conserve les objets ajoutés au modèle cible par XMLA." } }
        - { id: b, text: { en: "Download SM-Risk from Production as a .pbix file, and publish it to the Development workspace.", fr: "Télécharger SM-Risk depuis Production en fichier .pbix, et le publier dans l'espace de travail de Development." } }
        - { id: c, text: { en: "Create a deployment rule for SM-Risk in the Production stage that keeps Net Exposure.", fr: "Créer une règle de déploiement pour SM-Risk dans l'étape Production qui conserve Net Exposure." } }
        - { id: d, text: { en: "Add Net Exposure to SM-Risk in its Development source, and deploy it through Test to Production.", fr: "Ajouter Net Exposure à SM-Risk dans sa source de Development, puis le déployer jusqu'en Production en passant par Test." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Deploying overwrites the content of the paired item in the target stage with the metadata of the source, so a measure that exists only in Production disappears at the next deployment. Adding the measure to the Development source makes it part of the content that the pipeline promotes to Test and Production.
        fr: |
          Le déploiement écrase le contenu de l'élément apparié de l'étape cible avec les métadonnées de la source : une mesure qui n'existe qu'en Production disparaît donc au déploiement suivant. Ajouter la mesure à la source de Development l'intègre au contenu que le pipeline promeut vers Test et Production.
      options:
        a: { en: "Deployment pipelines don't merge target changes; the model metadata of Production is overwritten by that of Test.", fr: "Les pipelines de déploiement ne fusionnent pas les modifications de la cible ; les métadonnées du modèle en Production sont écrasées par celles de Test." }
        b: { en: "After a write through the XMLA endpoint, a model authored in Power BI Desktop can no longer be downloaded as a .pbix file.", fr: "Après une écriture par le point de terminaison XMLA, un modèle créé dans Power BI Desktop ne peut plus être téléchargé en fichier .pbix." }
        c: { en: "Deployment rules change only data sources, parameters and default lakehouses; they can't preserve a measure.", fr: "Les règles de déploiement ne changent que des sources de données, des paramètres et des lakehouses par défaut ; elles ne peuvent pas conserver une mesure." }
    references:
      - title: The Microsoft Fabric deployment pipelines process
        url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/understand-the-deployment-process
      - title: Semantic model connectivity and management with the XMLA endpoint in Power BI
        url: https://learn.microsoft.com/en-us/fabric/enterprise/powerbi/service-premium-connect-tools

  # ------------------------------------------------------------------ 10
  - id: dp600-qz-12-10
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Fabrikam has a deployment pipeline with Development, Test and Production stages. The Development workspace contains an Import mode semantic model named **SM-Finance**, which connects to an Azure SQL database named **sqldb-dev**, and a report named **RPT-Finance** built on it. The Test workspace is assigned to the Test stage and contains no items. You are a pipeline admin and an Admin of all the workspaces.

        RPT-Finance in Test must show the data of the Azure SQL database **sqldb-test**. The Power BI service has never connected to sqldb-test.

        Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Fabrikam dispose d'un pipeline de déploiement avec les étapes Development, Test et Production. L'espace de travail de Development contient un modèle sémantique en mode Import nommé **SM-Finance**, qui se connecte à une base de données Azure SQL nommée **sqldb-dev**, et un rapport nommé **RPT-Finance** construit dessus. L'espace de travail de Test est attribué à l'étape Test et ne contient aucun élément. Vous êtes administrateur du pipeline et Admin de tous les espaces de travail.

        RPT-Finance en Test doit afficher les données de la base de données Azure SQL **sqldb-test**. Le service Power BI ne s'est jamais connecté à sqldb-test.

        Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 5
      actions:
        - { id: deploy1, text: { en: "Deploy SM-Finance and RPT-Finance from Development to Test.", fr: "Déployer SM-Finance et RPT-Finance de Development vers Test." } }
        - { id: devrule, text: { en: "In the Development stage, create a data source rule for SM-Finance that points to sqldb-test.", fr: "Dans l'étape Development, créer une règle de source de données pour SM-Finance qui pointe vers sqldb-test." } }
        - { id: rule, text: { en: "In the Test stage, create a data source rule for SM-Finance that replaces sqldb-dev with sqldb-test.", fr: "Dans l'étape Test, créer une règle de source de données pour SM-Finance qui remplace sqldb-dev par sqldb-test." } }
        - { id: deploy2, text: { en: "Deploy SM-Finance from Development to Test again.", fr: "Déployer à nouveau SM-Finance de Development vers Test." } }
        - { id: creds, text: { en: "In Test, enter the credentials of sqldb-test in the settings of SM-Finance.", fr: "En Test, saisir les informations d'identification de sqldb-test dans les paramètres de SM-Finance." } }
        - { id: refresh, text: { en: "In Test, refresh SM-Finance.", fr: "En Test, actualiser SM-Finance." } }
        - { id: report, text: { en: "Deploy only RPT-Finance to Test, and let autobinding create SM-Finance in Test.", fr: "Déployer uniquement RPT-Finance vers Test, et laisser la liaison automatique créer SM-Finance en Test." } }
    answer:
      sequence: [deploy1, rule, deploy2, creds, refresh]
    explanation:
      correct:
        en: |
          A rule is set on the item of the target stage, so SM-Finance must exist in Test first; the first deployment also makes you its owner, which rules require. A data source rule takes effect at the next deployment, so you deploy again. Deployment copies neither data nor data source credentials: you enter the credentials of sqldb-test, then refresh the model so that the report shows data.
        fr: |
          Une règle se définit sur l'élément de l'étape cible : SM-Finance doit donc d'abord exister en Test ; le premier déploiement fait aussi de vous son propriétaire, ce que les règles exigent. Une règle de source de données prend effet au déploiement suivant : vous déployez donc à nouveau. Le déploiement ne copie ni les données ni les informations d'identification des sources : vous saisissez celles de sqldb-test, puis actualisez le modèle pour que le rapport affiche des données.
      options:
        devrule: { en: "Rules can't be created in the Development stage; they are created in the stage where they apply.", fr: "Les règles ne peuvent pas être créées dans l'étape Development ; elles se créent dans l'étape où elles s'appliquent." }
        report: { en: "A deployment fails when an item depends on an item that isn't deployed and doesn't exist in the target stage.", fr: "Un déploiement échoue quand un élément dépend d'un élément qui n'est pas déployé et n'existe pas dans l'étape cible." }
    references:
      - title: Create deployment rules for Fabric's ALM
        url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/create-rules
      - title: The Microsoft Fabric deployment pipelines process
        url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/understand-the-deployment-process
