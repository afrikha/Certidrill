chapter: 23-query-analyze-data
questions:
  # ------------------------------------------------------------------ 1
  - id: dp600-qz-23-01
    objective: "2.3.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has a Fabric workspace that contains a lakehouse named **SalesLake** and a semantic model named **SalesModel** built on the tables of SalesLake. SalesModel defines the measures **Net Revenue** and **Margin %**, whose business rules exist only in the model.

        An analyst must return the net revenue and the margin of each product category by reusing the two measures exactly as they are defined.

        Which tool should the analyst use?
      fr: |
        Contoso dispose d'un espace de travail Fabric qui contient un lakehouse nommé **SalesLake** et un modèle sémantique nommé **SalesModel** construit sur les tables de SalesLake. SalesModel définit les mesures **Net Revenue** et **Margin %**, dont les règles métier n'existent que dans le modèle.

        Un analyste doit renvoyer le chiffre d'affaires net et la marge de chaque catégorie de produits en réutilisant les deux mesures exactement telles qu'elles sont définies.

        Quel outil l'analyste doit-il utiliser ?
    body:
      options:
        - { id: a, text: { en: "The SQL query editor of the SQL analytics endpoint of SalesLake", fr: "L'éditeur de requête SQL du point de terminaison d'analytique SQL de SalesLake" } }
        - { id: b, text: { en: "The visual query editor of the SQL analytics endpoint of SalesLake", fr: "L'éditeur de requête visuel du point de terminaison d'analytique SQL de SalesLake" } }
        - { id: c, text: { en: "DAX query view on SalesModel", fr: "La vue de requête DAX sur SalesModel" } }
        - { id: d, text: { en: "A notebook that reads the Delta tables of SalesLake with Spark SQL", fr: "Un notebook qui lit les tables Delta de SalesLake avec Spark SQL" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Measures exist only in the semantic model, so only a DAX query can evaluate them. DAX query view runs DAX queries against SalesModel and can reference Net Revenue and Margin % directly, for example in SUMMARIZECOLUMNS grouped by category.
        fr: |
          Les mesures n'existent que dans le modèle sémantique : seule une requête DAX peut donc les évaluer. La vue de requête DAX exécute des requêtes DAX sur SalesModel et peut référencer directement Net Revenue et Margin %, par exemple dans SUMMARIZECOLUMNS regroupé par catégorie.
      options:
        a: { en: "T-SQL on the SQL analytics endpoint reads the Delta tables and ignores the semantic model: the measure logic would have to be rewritten.", fr: "Le T-SQL sur le point de terminaison d'analytique SQL lit les tables Delta et ignore le modèle sémantique : la logique des mesures serait à réécrire." }
        b: { en: "The visual query editor generates T-SQL over the tables of the endpoint; it has no access to the measures of SalesModel.", fr: "L'éditeur de requête visuel génère du T-SQL sur les tables du point de terminaison ; il n'a pas accès aux mesures de SalesModel." }
        d: { en: "Spark SQL reads the Delta files of the lakehouse, not the semantic model, so the measures would have to be rewritten.", fr: "Spark SQL lit les fichiers Delta du lakehouse, pas le modèle sémantique : les mesures seraient à réécrire." }
    references:
      - title: Work with DAX query view
        url: https://learn.microsoft.com/en-us/power-bi/transform-model/dax-query-view

  # ------------------------------------------------------------------ 2
  - id: dp600-qz-23-02
    objective: "2.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a KQL database named **ColdChainDB** in a Fabric eventhouse. ColdChainDB contains a table named **Readings** with the columns **DeviceId**, **Timestamp**, **Site** and **TemperatureC**.

        You need a query that adds a column named **TemperatureF**, calculated from TemperatureC, to every row. The result must keep all the existing columns of Readings.

        Which operator should you use?
      fr: |
        Vous disposez d'une base de données KQL nommée **ColdChainDB** dans un eventhouse Fabric. ColdChainDB contient une table nommée **Readings** avec les colonnes **DeviceId**, **Timestamp**, **Site** et **TemperatureC**.

        Vous avez besoin d'une requête qui ajoute à chaque ligne une colonne nommée **TemperatureF**, calculée à partir de TemperatureC. Le résultat doit conserver toutes les colonnes existantes de Readings.

        Quel opérateur devez-vous utiliser ?
    body:
      options:
        - { id: a, text: "`project`" }
        - { id: b, text: "`summarize`" }
        - { id: c, text: "`project-away`" }
        - { id: d, text: "`extend`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `extend` returns a copy of its input with the calculated columns appended, so `Readings | extend TemperatureF = TemperatureC * 9 / 5 + 32` keeps DeviceId, Timestamp, Site and TemperatureC and adds TemperatureF. It plays the role of a computed column in a T-SQL `SELECT *, expression AS name`.
        fr: |
          `extend` renvoie une copie de son entrée à laquelle s'ajoutent les colonnes calculées : `Readings | extend TemperatureF = TemperatureC * 9 / 5 + 32` conserve DeviceId, Timestamp, Site et TemperatureC et ajoute TemperatureF. Il joue le rôle d'une colonne calculée dans un `SELECT *, expression AS nom` en T-SQL.
      options:
        a: { en: "`project` returns only the columns it lists: every existing column would have to be listed again to keep it.", fr: "`project` ne renvoie que les colonnes qu'il liste : il faudrait relister chaque colonne existante pour la conserver." }
        b: { en: "`summarize` aggregates the rows into groups; the row-level columns would disappear from the result.", fr: "`summarize` agrège les lignes en groupes ; les colonnes de niveau ligne disparaîtraient du résultat." }
        c: { en: "`project-away` removes the listed columns; it doesn't add a calculated column.", fr: "`project-away` supprime les colonnes listées ; il n'ajoute pas de colonne calculée." }
    references:
      - title: extend operator
        url: https://learn.microsoft.com/en-us/kusto/query/extend-operator

  # ------------------------------------------------------------------ 3
  - id: dp600-qz-23-03
    objective: "2.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind has a warehouse named **RetailWH** that contains the tables **dbo.DimCustomer** and **dbo.FactSales**. Both tables contain a CustomerKey column. Some customers have never bought anything.

        A business analyst builds a visual query: they drag both tables to the canvas, select **Merge queries as new** on DimCustomer, and select CustomerKey in each table. The result must contain every customer, with the sales rows of the customer when they exist.

        Which **Join kind** should the analyst select?
      fr: |
        Northwind dispose d'un entrepôt nommé **RetailWH** qui contient les tables **dbo.DimCustomer** et **dbo.FactSales**. Les deux tables contiennent une colonne CustomerKey. Certains clients n'ont jamais rien acheté.

        Un analyste métier crée une requête visuelle : il fait glisser les deux tables vers le canevas, sélectionne **Fusionner des requêtes comme nouvelles** sur DimCustomer, puis sélectionne CustomerKey dans chaque table. Le résultat doit contenir chaque client, avec les lignes de ventes du client quand elles existent.

        Quel **Type de jointure** l'analyste doit-il sélectionner ?
    body:
      options:
        - { id: a, text: { en: "Inner", fr: "Interne" } }
        - { id: b, text: { en: "Left anti", fr: "Anti gauche" } }
        - { id: c, text: { en: "Left outer", fr: "Externe gauche" } }
        - { id: d, text: { en: "Right outer", fr: "Externe droite" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The merge started on DimCustomer, so DimCustomer is the left table. A left outer join returns all the rows of the left table and the matching rows of the right table: customers without sales are kept with empty sales columns. The visual query editor folds this step to a SQL LEFT OUTER JOIN.
        fr: |
          La fusion a été lancée sur DimCustomer : DimCustomer est donc la table de gauche. Une jointure externe gauche renvoie toutes les lignes de la table de gauche et les lignes correspondantes de la table de droite : les clients sans ventes sont conservés avec des colonnes de ventes vides. L'éditeur de requête visuel replie cette étape en un LEFT OUTER JOIN SQL.
      options:
        a: { en: "An inner join returns only the matching rows: the customers who never bought anything would be missing.", fr: "Une jointure interne ne renvoie que les lignes correspondantes : les clients qui n'ont jamais rien acheté seraient absents." }
        b: { en: "A left anti join returns only the customers without sales, and none of the sales rows.", fr: "Une jointure anti gauche ne renvoie que les clients sans ventes, et aucune ligne de ventes." }
        d: { en: "A right outer join keeps every row of FactSales, the right table, and drops the customers without sales.", fr: "Une jointure externe droite conserve toutes les lignes de FactSales, la table de droite, et écarte les clients sans ventes." }
    references:
      - title: Query using the visual query editor
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/visual-query-editor
      - title: Merge queries overview
        url: https://learn.microsoft.com/en-us/power-query/merge-queries-overview

  # ------------------------------------------------------------------ 4
  - id: dp600-qz-23-04
    objective: "2.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a warehouse named **StoresWH** that contains a table named **dbo.StoreRevenue** with one row per store and the columns **Region**, **StoreId** and **Revenue**.

        You need a column named **RevenueRank** that ranks the stores of each region from the highest revenue to the lowest. Stores with the same revenue in a region must get the same rank, and the next store must get the next consecutive rank, for example 1, 1, 2.

        Which expression should you use in the SELECT list?
      fr: |
        Vous disposez d'un entrepôt nommé **StoresWH** qui contient une table nommée **dbo.StoreRevenue** avec une ligne par magasin et les colonnes **Region**, **StoreId** et **Revenue**.

        Vous avez besoin d'une colonne nommée **RevenueRank** qui classe les magasins de chaque région du chiffre d'affaires le plus élevé au plus bas. Les magasins d'une région qui ont le même chiffre d'affaires doivent obtenir le même rang, et le magasin suivant doit obtenir le rang consécutif suivant, par exemple 1, 1, 2.

        Quelle expression devez-vous utiliser dans la liste SELECT ?
    body:
      options:
        - { id: a, text: "`RANK() OVER (PARTITION BY Region ORDER BY Revenue DESC)`" }
        - { id: b, text: "`DENSE_RANK() OVER (PARTITION BY Region ORDER BY Revenue DESC)`" }
        - { id: c, text: "`ROW_NUMBER() OVER (PARTITION BY Region ORDER BY Revenue DESC)`" }
        - { id: d, text: "`DENSE_RANK() OVER (ORDER BY Revenue DESC)`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          DENSE_RANK gives tied rows the same rank and continues with the next consecutive value, so its ranks have no gaps. PARTITION BY Region restarts the ranking in each region, and ORDER BY Revenue DESC gives rank 1 to the highest revenue.
        fr: |
          DENSE_RANK attribue le même rang aux lignes ex aequo et continue avec la valeur consécutive suivante : ses rangs n'ont donc pas de trous. PARTITION BY Region recommence le classement dans chaque région, et ORDER BY Revenue DESC donne le rang 1 au chiffre d'affaires le plus élevé.
      options:
        a: { en: "RANK gives tied rows the same rank but skips the following values: two stores at rank 1 are followed by rank 3.", fr: "RANK attribue le même rang aux ex aequo mais saute les valeurs suivantes : deux magasins au rang 1 sont suivis du rang 3." }
        c: { en: "ROW_NUMBER numbers every row sequentially, so two stores with the same revenue get different values.", fr: "ROW_NUMBER numérote chaque ligne séquentiellement : deux magasins au même chiffre d'affaires obtiennent des valeurs différentes." }
        d: { en: "Without PARTITION BY Region, the stores are ranked across all regions instead of within each region.", fr: "Sans PARTITION BY Region, les magasins sont classés sur l'ensemble des régions au lieu de l'être dans chaque région." }
    references:
      - title: DENSE_RANK (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/functions/dense-rank-transact-sql
      - title: ROW_NUMBER (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/functions/row-number-transact-sql

  # ------------------------------------------------------------------ 5
  - id: dp600-qz-23-05
    objective: "2.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You open a Power BI Desktop file named **Finance.pbix**. Its semantic model contains 40 measures spread over several tables.

        You need to change the DAX formulas of 12 existing measures, test the new formulas together in DAX query view, and then save them to the model. The solution must minimize the effort.

        What should you do?
      fr: |
        Vous ouvrez un fichier Power BI Desktop nommé **Finance.pbix**. Son modèle sémantique contient 40 mesures réparties dans plusieurs tables.

        Vous devez modifier les formules DAX de 12 mesures existantes, tester ensemble les nouvelles formules dans la vue de requête DAX, puis les enregistrer dans le modèle. La solution doit réduire l'effort au minimum.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run the quick query **Evaluate** on each measure, edit the formulas in the queries, and then save the .pbix file.", fr: "Exécuter la requête rapide **Évaluer** sur chaque mesure, modifier les formules dans les requêtes, puis enregistrer le fichier .pbix." } }
        - { id: b, text: { en: "Copy the query of each visual from Performance analyzer, edit the formulas in the queries, and then select **Run**.", fr: "Copier la requête de chaque visuel depuis l'Analyseur de performances, modifier les formules dans les requêtes, puis sélectionner **Exécuter**." } }
        - { id: c, text: { en: "Run the quick query **Show column statistics** on each table, edit the formulas in the queries, and then select **Run**.", fr: "Exécuter la requête rapide **Afficher les statistiques de colonne** sur chaque table, modifier les formules dans les requêtes, puis sélectionner **Exécuter**." } }
        - { id: d, text: { en: "Run the quick query **Define all measures in the model**, edit the formulas in the query, and then select **Update model with changes**.", fr: "Exécuter la requête rapide **Définir toutes les mesures du modèle**, modifier les formules dans la requête, puis sélectionner **Mettre à jour le modèle avec les modifications**." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The quick query Define all measures in the model writes a DEFINE block with every measure of the model in a single query tab, so the 12 formulas can be edited and tested together. Update model with changes then adds or overwrites the model measures with the formulas of the query-scoped measures in one operation.
        fr: |
          La requête rapide Définir toutes les mesures du modèle écrit un bloc DEFINE avec toutes les mesures du modèle dans un seul onglet de requête : les 12 formules peuvent être modifiées et testées ensemble. Mettre à jour le modèle avec les modifications ajoute ou remplace ensuite, en une seule opération, les mesures du modèle par les formules des mesures définies dans la requête.
      options:
        a: { en: "Evaluate returns the values of a measure without its definition, and saving the file doesn't write DAX query changes to the model.", fr: "Évaluer renvoie les valeurs d'une mesure sans sa définition, et enregistrer le fichier n'écrit pas dans le modèle les modifications d'une requête DAX." }
        b: { en: "Visual queries contain only the measures the visuals use, and Run executes a query without updating the model.", fr: "Les requêtes des visuels ne contiennent que les mesures utilisées par les visuels, et Exécuter lance une requête sans mettre à jour le modèle." }
        c: { en: "Show column statistics profiles the columns of a table; it doesn't define measures, and Run doesn't update the model.", fr: "Afficher les statistiques de colonne profile les colonnes d'une table ; elle ne définit pas de mesures, et Exécuter ne met pas à jour le modèle." }
    references:
      - title: Work with DAX query view
        url: https://learn.microsoft.com/en-us/power-bi/transform-model/dax-query-view

  # ------------------------------------------------------------------ 6
  - id: dp600-qz-23-06
    objective: "2.3.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware has a Fabric workspace that contains the following items:

        - A warehouse named **OpsWH**
        - A mirrored database named **CrmMirror**
        - An eventhouse that contains a KQL database named **IoTDB**
        - A semantic model named **OpsModel** that contains the measures used by the operations reports

        You have the following requirements:

        - A business analyst who doesn't write code must join two tables of CrmMirror and save the result as a view.
        - An engineer must delete, with a T-SQL statement, the test rows that a load wrote to a table of OpsWH.
        - A developer who knows only T-SQL must count the events of the last hour in IoTDB without copying the data.
        - A controller must list the values of the OpsModel measures by month.

        Which tool should be used for each requirement? To answer, drag the appropriate tools to the correct requirements. Each tool may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un espace de travail Fabric qui contient les éléments suivants :

        - Un entrepôt nommé **OpsWH**
        - Une base de données mise en miroir nommée **CrmMirror**
        - Un eventhouse qui contient une base de données KQL nommée **IoTDB**
        - Un modèle sémantique nommé **OpsModel** qui contient les mesures utilisées par les rapports d'exploitation

        Vous avez les exigences suivantes :

        - Un analyste métier qui n'écrit pas de code doit joindre deux tables de CrmMirror et enregistrer le résultat en tant que vue.
        - Un ingénieur doit supprimer, avec une instruction T-SQL, les lignes de test qu'un chargement a écrites dans une table d'OpsWH.
        - Un développeur qui ne connaît que T-SQL doit compter les événements de la dernière heure dans IoTDB sans copier les données.
        - Un contrôleur de gestion doit lister les valeurs des mesures d'OpsModel par mois.

        Quel outil faut-il utiliser pour chaque exigence ? Pour répondre, faites glisser les outils appropriés vers les exigences correspondantes. Chaque outil peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: vqe, text: { en: "Visual query editor", fr: "Éditeur de requête visuel" } }
        - { id: sqled, text: { en: "SQL query editor", fr: "Éditeur de requête SQL" } }
        - { id: kqlqs, text: { en: "KQL queryset", fr: "Ensemble de requêtes KQL" } }
        - { id: daxqv, text: { en: "DAX query view", fr: "Vue de requête DAX" } }
        - { id: spark, text: { en: "Spark notebook", fr: "Notebook Spark" } }
      targets:
        - { id: t1, text: { en: "Join two tables of CrmMirror without code and save the result as a view", fr: "Joindre deux tables de CrmMirror sans code et enregistrer le résultat en tant que vue" } }
        - { id: t2, text: { en: "Delete test rows from a table of OpsWH with T-SQL", fr: "Supprimer des lignes de test d'une table d'OpsWH avec T-SQL" } }
        - { id: t3, text: { en: "Count the events of the last hour in IoTDB by using T-SQL", fr: "Compter les événements de la dernière heure dans IoTDB en utilisant T-SQL" } }
        - { id: t4, text: { en: "List the values of the OpsModel measures by month", fr: "Lister les valeurs des mesures d'OpsModel par mois" } }
    answer:
      mapping: { t1: vqe, t2: sqled, t3: kqlqs, t4: daxqv }
    explanation:
      correct:
        en: |
          The visual query editor works on warehouses, SQL analytics endpoints and mirrored databases, and Save as view creates the view without code. It only runs read-only SELECT statements, so the DELETE must run in the SQL query editor of the warehouse. A KQL queryset accepts a subset of T-SQL (DQL only) in addition to KQL, so the developer can query IoTDB in place. Measures exist only in the semantic model, which DAX query view queries.
        fr: |
          L'éditeur de requête visuel fonctionne sur les entrepôts, les points de terminaison d'analytique SQL et les bases de données mises en miroir, et Enregistrer en tant que vue crée la vue sans code. Il n'exécute que des instructions SELECT en lecture seule : le DELETE doit donc s'exécuter dans l'éditeur de requête SQL de l'entrepôt. Un ensemble de requêtes KQL accepte, en plus de KQL, un sous-ensemble de T-SQL (DQL uniquement) : le développeur peut donc interroger IoTDB sur place. Les mesures n'existent que dans le modèle sémantique, qu'interroge la vue de requête DAX.
      options:
        spark: { en: "A Spark notebook uses PySpark or Spark SQL, not the T-SQL required here, and it doesn't evaluate the measures of a semantic model by itself.", fr: "Un notebook Spark utilise PySpark ou Spark SQL, pas le T-SQL exigé ici, et il n'évalue pas à lui seul les mesures d'un modèle sémantique." }
        vqe: { en: "The visual query editor doesn't run DDL or DML statements such as DELETE, and it doesn't open KQL databases or semantic models.", fr: "L'éditeur de requête visuel n'exécute pas d'instructions DDL ou DML comme DELETE, et il n'ouvre ni les bases de données KQL ni les modèles sémantiques." }
    references:
      - title: Query using the visual query editor
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/visual-query-editor
      - title: Query data using T-SQL
        url: https://learn.microsoft.com/en-us/kusto/query/t-sql

  # ------------------------------------------------------------------ 7
  - id: dp600-qz-23-07
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You have a warehouse named **SalesWH** that contains a table named **dbo.FactOrder**. The table contains one row per order with the columns **CustomerKey**, **OrderId**, **OrderDate** and **OrderAmount**. OrderDate uses the `date` data type, and a customer can place several orders on the same day.

        You need a query that returns exactly one row per customer: an order placed on the most recent order date of the customer. When a customer placed several orders on that date, any one of them can be returned.

        How should you complete the T-SQL query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un entrepôt nommé **SalesWH** qui contient une table nommée **dbo.FactOrder**. La table contient une ligne par commande avec les colonnes **CustomerKey**, **OrderId**, **OrderDate** et **OrderAmount**. OrderDate utilise le type de données `date`, et un client peut passer plusieurs commandes le même jour.

        Vous avez besoin d'une requête qui renvoie exactement une ligne par client : une commande passée à la date de commande la plus récente du client. Quand un client a passé plusieurs commandes à cette date, n'importe laquelle peut être renvoyée.

        Comment devez-vous compléter la requête T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        WITH LatestOrder AS
        (
            SELECT CustomerKey, OrderId, OrderDate, OrderAmount,
                   [[fn]] OVER (PARTITION BY CustomerKey ORDER BY OrderDate [[dir]]) AS rn
            FROM dbo.FactOrder
        )
        SELECT CustomerKey, OrderId, OrderDate, OrderAmount
        FROM LatestOrder
        [[flt]];
      slots:
        - id: fn
          options:
            - { id: rownum, text: "ROW_NUMBER()" }
            - { id: rank, text: "RANK()" }
            - { id: dense, text: "DENSE_RANK()" }
            - { id: lag, text: "LAG(OrderId)" }
        - id: dir
          options:
            - { id: asc, text: ASC }
            - { id: desc, text: DESC }
        - id: flt
          options:
            - { id: where1, text: "WHERE rn = 1" }
            - { id: having1, text: "HAVING rn = 1" }
            - { id: wheregt, text: "WHERE rn > 1" }
    answer:
      values: { fn: rownum, dir: desc, flt: where1 }
    explanation:
      correct:
        en: |
          ROW_NUMBER numbers the orders of each customer without ties, so exactly one row of each partition gets 1, even when several orders share the latest date. ORDER BY OrderDate DESC gives number 1 to an order of the most recent date. A window function can't be referenced in the WHERE clause of the query that computes it, so the CTE computes rn and the outer query filters it with WHERE rn = 1.
        fr: |
          ROW_NUMBER numérote les commandes de chaque client sans ex aequo : exactement une ligne de chaque partition reçoit 1, même quand plusieurs commandes partagent la date la plus récente. ORDER BY OrderDate DESC donne le numéro 1 à une commande de la date la plus récente. Une fonction de fenêtre ne peut pas être référencée dans la clause WHERE de la requête qui la calcule : la CTE calcule donc rn et la requête externe le filtre avec WHERE rn = 1.
      options:
        rank: { en: "RANK gives 1 to every order placed on the latest date, so a customer with two orders that day would return two rows.", fr: "RANK donne 1 à toutes les commandes passées à la date la plus récente : un client avec deux commandes ce jour-là renverrait deux lignes." }
        dense: { en: "DENSE_RANK also gives the same value to ties: several orders of the latest date would all get 1.", fr: "DENSE_RANK donne lui aussi la même valeur aux ex aequo : plusieurs commandes de la date la plus récente obtiendraient toutes 1." }
        lag: { en: "LAG returns the OrderId of the previous row; it doesn't number the rows, so rn = 1 has no meaning.", fr: "LAG renvoie l'OrderId de la ligne précédente ; il ne numérote pas les lignes, et rn = 1 n'a donc pas de sens." }
        asc: { en: "ASC gives number 1 to the oldest order of each customer.", fr: "ASC donne le numéro 1 à la commande la plus ancienne de chaque client." }
        having1: { en: "HAVING filters groups after a GROUP BY; the outer query has no grouping, and rn is a row value.", fr: "HAVING filtre des groupes après un GROUP BY ; la requête externe n'a pas de regroupement, et rn est une valeur de ligne." }
        wheregt: { en: "rn > 1 returns all the orders except the latest one of each customer.", fr: "rn > 1 renvoie toutes les commandes sauf la plus récente de chaque client." }
    references:
      - title: ROW_NUMBER (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/functions/row-number-transact-sql
      - title: DENSE_RANK (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/functions/dense-rank-transact-sql

  # ------------------------------------------------------------------ 8
  - id: dp600-qz-23-08
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Wingtip Toys monitors the freezers of its warehouses. A Fabric eventhouse contains a KQL database named **FreezerDB** with a table named **SensorReadings**. Each row is one reading with the columns **DeviceId**, **Timestamp** and **Temperature**.

        You run the following query in a KQL queryset connected to FreezerDB.

        ```kusto
        SensorReadings
        | where Timestamp > ago(1d)
        | summarize AvgTemp = avg(Temperature), Readings = count()
            by DeviceId, Hour = bin(Timestamp, 1h)
        | where Readings >= 10
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys surveille les congélateurs de ses entrepôts. Un eventhouse Fabric contient une base de données KQL nommée **FreezerDB** avec une table nommée **SensorReadings**. Chaque ligne est un relevé avec les colonnes **DeviceId**, **Timestamp** et **Temperature**.

        Vous exécutez la requête suivante dans un ensemble de requêtes KQL connecté à FreezerDB.

        ```kusto
        SensorReadings
        | where Timestamp > ago(1d)
        | summarize AvgTemp = avg(Temperature), Readings = count()
            by DeviceId, Hour = bin(Timestamp, 1h)
        | where Readings >= 10
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The `where Readings >= 10` line filters the rows of SensorReadings before they are aggregated.", fr: "La ligne `where Readings >= 10` filtre les lignes de SensorReadings avant leur agrégation." }
        - id: s2
          text: { en: "Two readings taken by the same device at 10:05 and at 10:55 on the same day, both within the last 24 hours, are aggregated in the same group by `summarize`.", fr: "Deux relevés pris par le même appareil à 10:05 et à 10:55 le même jour, tous deux au cours des dernières 24 heures, sont agrégés dans le même groupe par `summarize`." }
        - id: s3
          text: { en: "Adding `| project DeviceId, Hour, Temperature` at the end of the query returns the temperature of each reading.", fr: "Ajouter `| project DeviceId, Hour, Temperature` à la fin de la requête renvoie la température de chaque relevé." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Each operator works on the output of the previous one. The second `where` runs after `summarize`, on the aggregated rows, like HAVING in T-SQL. `bin(Timestamp, 1h)` rounds each timestamp down to the hour, so 10:05 and 10:55 both fall in the 10:00 group of that device. The output of `summarize` contains only the `by` columns and the aggregates (DeviceId, Hour, AvgTemp, Readings): the Temperature column no longer exists after it.
        fr: |
          Chaque opérateur travaille sur la sortie du précédent. Le second `where` s'exécute après `summarize`, sur les lignes agrégées, comme HAVING en T-SQL. `bin(Timestamp, 1h)` arrondit chaque horodatage à l'heure inférieure : 10:05 et 10:55 tombent donc tous deux dans le groupe 10:00 de cet appareil. La sortie de `summarize` ne contient que les colonnes `by` et les agrégats (DeviceId, Hour, AvgTemp, Readings) : la colonne Temperature n'existe plus après lui.
      options:
        s1: { en: "Readings is created by `summarize`; the `where` placed after it filters the device-hour groups, not the raw readings.", fr: "Readings est créée par `summarize` ; le `where` placé après filtre les groupes appareil-heure, pas les relevés bruts." }
        s3: { en: "After `summarize`, the rows are groups and Temperature isn't one of their columns: the `project` fails instead of returning each reading.", fr: "Après `summarize`, les lignes sont des groupes et Temperature ne fait pas partie de leurs colonnes : le `project` échoue au lieu de renvoyer chaque relevé." }
    references:
      - title: summarize operator
        url: https://learn.microsoft.com/en-us/kusto/query/summarize-operator
      - title: bin()
        url: https://learn.microsoft.com/en-us/kusto/query/bin-function

  # ------------------------------------------------------------------ 9
  - id: dp600-qz-23-09
    objective: "2.3.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys has a semantic model named **RetailModel** that contains the tables **Product** and **Date**, related to a **Sales** fact table, and a measure named **Total Sales**. Date contains a **Year** column of the whole number data type.

        A buyer needs a DAX query that returns the 10 products with the highest sales in 2026. The rows must be displayed from the highest sales to the lowest.

        How should you complete the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un modèle sémantique nommé **RetailModel** qui contient les tables **Product** et **Date**, reliées à une table de faits **Sales**, et une mesure nommée **Total Sales**. Date contient une colonne **Year** de type nombre entier.

        Un acheteur a besoin d'une requête DAX qui renvoie les 10 produits aux ventes les plus élevées en 2026. Les lignes doivent s'afficher des ventes les plus élevées aux plus faibles.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: text
      template:
        en: |
          EVALUATE
              TOPN (
                  10,
                  SUMMARIZECOLUMNS (
                      'Product'[Product],
                      [[flt]],
                      "Sales", [Total Sales]
                  ),
                  [Sales], [[dir]]
              )
          [[ord]]
        fr: |
          EVALUATE
              TOPN (
                  10,
                  SUMMARIZECOLUMNS (
                      'Product'[Product],
                      [[flt]],
                      "Sales", [Total Sales]
                  ),
                  [Sales], [[dir]]
              )
          [[ord]]
      slots:
        - id: flt
          options:
            - { id: treatas, text: "TREATAS ( { 2026 }, 'Date'[Year] )" }
            - { id: yearcol, text: "'Date'[Year]" }
            - { id: values, text: "VALUES ( 'Date'[Year] )" }
            - { id: all, text: "ALL ( 'Date'[Year] )" }
        - id: dir
          options:
            - { id: desc, text: DESC }
            - { id: asc, text: ASC }
        - id: ord
          options:
            - { id: none, text: { en: "(no ORDER BY clause)", fr: "(pas de clause ORDER BY)" } }
            - { id: bysales, text: "ORDER BY [Sales] DESC" }
            - { id: byproduct, text: "ORDER BY 'Product'[Product]" }
    answer:
      values: { flt: treatas, dir: desc, ord: bysales }
    explanation:
      correct:
        en: |
          TREATAS applies the value 2026 as a filter on Date[Year], so SUMMARIZECOLUMNS returns one row per product with its 2026 sales. TOPN with DESC keeps the 10 rows with the highest [Sales], but TOPN doesn't guarantee any sort order for its result. The ORDER BY [Sales] DESC clause after EVALUATE sorts the returned rows.
        fr: |
          TREATAS applique la valeur 2026 comme filtre sur Date[Year] : SUMMARIZECOLUMNS renvoie donc une ligne par produit avec ses ventes de 2026. TOPN avec DESC garde les 10 lignes dont [Sales] est le plus élevé, mais TOPN ne garantit aucun ordre de tri pour son résultat. La clause ORDER BY [Sales] DESC après EVALUATE trie les lignes renvoyées.
      options:
        yearcol: { en: "A column alone is a group-by column: the query would return one row per product and year, for every year.", fr: "Une colonne seule est une colonne de regroupement : la requête renverrait une ligne par produit et par année, pour toutes les années." }
        values: { en: "VALUES ( 'Date'[Year] ) keeps every year of the current context, so the sales of all years are included.", fr: "VALUES ( 'Date'[Year] ) conserve toutes les années du contexte actuel : les ventes de toutes les années sont incluses." }
        all: { en: "ALL ( 'Date'[Year] ) returns every year and filters nothing.", fr: "ALL ( 'Date'[Year] ) renvoie toutes les années et ne filtre rien." }
        asc: { en: "ASC would keep the 10 products with the lowest sales.", fr: "ASC garderait les 10 produits aux ventes les plus faibles." }
        none: { en: "Without ORDER BY, the 10 rows come back in no guaranteed order.", fr: "Sans ORDER BY, les 10 lignes reviennent dans un ordre non garanti." }
        byproduct: { en: "Sorting by product name doesn't display the rows from the highest sales to the lowest.", fr: "Trier par nom de produit n'affiche pas les lignes des ventes les plus élevées aux plus faibles." }
    references:
      - title: TOPN
        url: https://learn.microsoft.com/en-us/dax/topn-function-dax
      - title: Work with DAX query view
        url: https://learn.microsoft.com/en-us/power-bi/transform-model/dax-query-view

  # ------------------------------------------------------------------ 10
  - id: dp600-qz-23-10
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum has a warehouse named **CrmWH** that contains the tables **dbo.DimCustomer** and **dbo.FactOrder**. FactOrder contains the orders from 2024 to 2026, with one row per order and the columns **OrderId**, **CustomerKey** and **OrderDate**. Some customers placed orders only before 2026, and some customers never placed an order.

        A colleague wrote the following query to return every customer with the number of orders the customer placed in 2026, or 0 when the customer placed no order in 2026.

        ```sql
        SELECT c.CustomerKey, c.CustomerName, COUNT(o.OrderId) AS Orders2026
        FROM dbo.DimCustomer AS c
        LEFT OUTER JOIN dbo.FactOrder AS o
            ON o.CustomerKey = c.CustomerKey
        WHERE o.OrderDate >= '2026-01-01'
        GROUP BY c.CustomerKey, c.CustomerName;
        ```

        The query returns only the customers who placed at least one order in 2026. You need to fix the query.

        What should you do?
      fr: |
        Adatum dispose d'un entrepôt nommé **CrmWH** qui contient les tables **dbo.DimCustomer** et **dbo.FactOrder**. FactOrder contient les commandes de 2024 à 2026, avec une ligne par commande et les colonnes **OrderId**, **CustomerKey** et **OrderDate**. Certains clients n'ont passé des commandes qu'avant 2026, et certains clients n'ont jamais passé de commande.

        Un collègue a écrit la requête suivante pour renvoyer chaque client avec le nombre de commandes qu'il a passées en 2026, ou 0 quand il n'a passé aucune commande en 2026.

        ```sql
        SELECT c.CustomerKey, c.CustomerName, COUNT(o.OrderId) AS Orders2026
        FROM dbo.DimCustomer AS c
        LEFT OUTER JOIN dbo.FactOrder AS o
            ON o.CustomerKey = c.CustomerKey
        WHERE o.OrderDate >= '2026-01-01'
        GROUP BY c.CustomerKey, c.CustomerName;
        ```

        La requête ne renvoie que les clients qui ont passé au moins une commande en 2026. Vous devez corriger la requête.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add `OR o.OrderDate IS NULL` to the condition of the WHERE clause.", fr: "Ajouter `OR o.OrderDate IS NULL` à la condition de la clause WHERE." } }
        - { id: b, text: { en: "Move the OrderDate condition from the WHERE clause to the ON clause.", fr: "Déplacer la condition sur OrderDate de la clause WHERE vers la clause ON." } }
        - { id: c, text: { en: "Replace `COUNT(o.OrderId)` with `COUNT(*)` in the SELECT list.", fr: "Remplacer `COUNT(o.OrderId)` par `COUNT(*)` dans la liste SELECT." } }
        - { id: d, text: { en: "Replace the WHERE clause with `HAVING MAX(o.OrderDate) >= '2026-01-01'`.", fr: "Remplacer la clause WHERE par `HAVING MAX(o.OrderDate) >= '2026-01-01'`." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The WHERE clause is applied to the result of the join: the customers without a matching order have a NULL OrderDate, so the condition removes them and the outer join behaves like an inner join. A predicate in the ON clause is applied before the join, so every customer is kept, only the 2026 orders are matched, and COUNT(o.OrderId), which skips NULLs, returns 0 for the others.
        fr: |
          La clause WHERE s'applique au résultat de la jointure : les clients sans commande correspondante ont un OrderDate NULL, la condition les élimine donc et la jointure externe se comporte comme une jointure interne. Un prédicat dans la clause ON s'applique avant la jointure : tous les clients sont conservés, seules les commandes de 2026 sont associées, et COUNT(o.OrderId), qui ignore les NULL, renvoie 0 pour les autres.
      options:
        a: { en: "This adds back the customers who never ordered, but the customers whose orders are all from before 2026 are still removed.", fr: "Cela réintègre les clients qui n'ont jamais commandé, mais les clients dont toutes les commandes datent d'avant 2026 restent éliminés." }
        c: { en: "The rows are already removed by the WHERE clause; COUNT(*) would also count 1 for a customer joined to no order.", fr: "Les lignes sont déjà éliminées par la clause WHERE ; COUNT(*) compterait en outre 1 pour un client associé à aucune commande." }
        d: { en: "HAVING filters the customers after grouping, and the count then includes the 2024 and 2025 orders of the customers it keeps.", fr: "HAVING filtre les clients après le regroupement, et le compte inclut alors les commandes de 2024 et 2025 des clients conservés." }
    references:
      - title: FROM clause plus JOIN, APPLY, PIVOT (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/queries/from-transact-sql
      - title: SELECT (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-transact-sql
