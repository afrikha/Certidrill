id: dp600-cs2c-large-format
objective: "3.1.6"
type: single
caseStudy: dp600-cs2c-blue-yonder-airlines
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the size requirement for SM-FlightOps.

    What should you do?
  fr: |
    Vous devez respecter l'exigence de taille de SM-FlightOps.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Turn on semantic model scale-out in the settings of SM-FlightOps.", fr: "Activer le scale-out du modèle sémantique dans les paramètres de SM-FlightOps." }
    - id: b
      text: { en: "Turn on Large semantic model storage format in the settings of SM-FlightOps.", fr: "Activer Large semantic model storage format dans les paramètres de SM-FlightOps." }
    - id: c
      text: { en: "Change the storage mode of FactFlightLeg to DirectQuery in SM-FlightOps.", fr: "Changer le mode de stockage de FactFlightLeg en DirectQuery dans SM-FlightOps." }
    - id: d
      text: { en: "Move SM-FlightOps to a workspace that uses the Pro license mode.", fr: "Déplacer SM-FlightOps vers un espace de travail qui utilise le mode de licence Pro." }
answer:
  optionId: b
explanation:
  correct:
    en: "With the large semantic model storage format, an Import model can grow beyond the upload limit of Power BI Desktop, up to the limit of the Fabric capacity. The setting is turned on per model in its settings (or by default for a workspace), and the next refresh loads the data in the new format. An F128 capacity supports a 30 GB model."
    fr: "Avec le format de stockage de modèle sémantique volumineux, un modèle Import peut dépasser la limite de chargement de Power BI Desktop, jusqu'à la limite de la capacité Fabric. Le paramètre s'active par modèle dans ses paramètres (ou par défaut pour un espace de travail), et l'actualisation suivante charge les données dans le nouveau format. Une capacité F128 prend en charge un modèle de 30 Go."
  options:
    a:
      en: "Semantic model scale-out adds read-only replicas to serve more concurrent queries; it does not raise the size limit, and it requires the large format anyway."
      fr: "Le scale-out du modèle sémantique ajoute des réplicas en lecture seule pour servir davantage de requêtes simultanées ; il n'augmente pas la limite de taille et nécessite de toute façon le format volumineux."
    c:
      en: "DirectQuery would no longer import the fact table, which breaks the requirement to stay in Import mode."
      fr: "DirectQuery n'importerait plus la table de faits, ce qui enfreint l'exigence de rester en mode Import."
    d:
      en: "A Pro workspace has a much lower model size limit than a Fabric capacity."
      fr: "Un espace de travail Pro a une limite de taille de modèle bien inférieure à celle d'une capacité Fabric."
references:
  - title: Large semantic models in Power BI Premium
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/service-premium-large-models
