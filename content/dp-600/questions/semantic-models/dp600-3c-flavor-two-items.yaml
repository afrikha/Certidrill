id: dp600-3c-flavor-two-items
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a lakehouse named Lakehouse1 and a warehouse named Warehouse1. Lakehouse1 contains the dimension tables and Warehouse1 contains the fact tables, all stored as Delta tables.

    You need to create one semantic model that uses Direct Lake storage mode for the tables of both items. The solution must not create shortcuts or copy data.

    What should you create?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé Lakehouse1 et un entrepôt nommé Warehouse1. Lakehouse1 contient les tables de dimension et Warehouse1 les tables de faits, toutes stockées sous forme de tables Delta.

    Vous devez créer un seul modèle sémantique qui utilise le mode de stockage Direct Lake pour les tables des deux éléments. La solution ne doit ni créer de raccourcis ni copier de données.

    Que devez-vous créer ?
body:
  options:
    - id: a
      text:
        en: "A Direct Lake on SQL analytics endpoint model that uses the SQL analytics endpoint of Lakehouse1"
        fr: "Un modèle Direct Lake sur le point de terminaison d'analytique SQL qui utilise le point de terminaison d'analytique SQL de Lakehouse1"
    - id: b
      text:
        en: "A Direct Lake on SQL analytics endpoint model that uses Warehouse1"
        fr: "Un modèle Direct Lake sur le point de terminaison d'analytique SQL qui utilise Warehouse1"
    - id: c
      text:
        en: "A Direct Lake on OneLake model that uses Lakehouse1 and Warehouse1"
        fr: "Un modèle Direct Lake sur OneLake qui utilise Lakehouse1 et Warehouse1"
    - id: d
      text:
        en: "An Import model that uses the SQL analytics endpoints of Lakehouse1 and Warehouse1"
        fr: "Un modèle Import qui utilise les points de terminaison d'analytique SQL de Lakehouse1 et de Warehouse1"
answer:
  optionId: c
explanation:
  correct:
    en: "Direct Lake on OneLake can use one or more Fabric items whose OneLake storage resolves to Delta tables, so one model can contain the tables of the lakehouse and of the warehouse. Direct Lake on SQL is limited to a single Fabric item with a SQL analytics endpoint."
    fr: "Direct Lake sur OneLake peut utiliser un ou plusieurs éléments Fabric dont le stockage OneLake se résout en tables Delta : un seul modèle peut donc contenir les tables du lakehouse et de l'entrepôt. Direct Lake sur SQL est limité à un seul élément Fabric doté d'un point de terminaison d'analytique SQL."
  options:
    a: { en: "Direct Lake on SQL uses a single source; the warehouse tables would need shortcuts in Lakehouse1.", fr: "Direct Lake sur SQL utilise une seule source ; les tables de l'entrepôt nécessiteraient des raccourcis dans Lakehouse1." }
    b: { en: "Direct Lake on SQL uses a single source, so the lakehouse tables can't be added.", fr: "Direct Lake sur SQL utilise une seule source : les tables du lakehouse ne peuvent pas être ajoutées." }
    d: { en: "Import mode copies the data into the model and doesn't use Direct Lake.", fr: "Le mode Import copie les données dans le modèle et n'utilise pas Direct Lake." }
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
