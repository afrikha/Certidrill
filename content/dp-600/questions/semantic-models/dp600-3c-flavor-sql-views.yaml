id: dp600-3c-flavor-sql-views
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a warehouse named Warehouse1. Another team owns a set of T-SQL views in Warehouse1 that contain business logic, and the views can't be materialized or rewritten.

    You need to create a semantic model that uses the tables and the views of Warehouse1. All the tables of the model must use Direct Lake storage mode.

    Which type of semantic model should you create?
  fr: |
    Vous disposez d'un entrepôt nommé Warehouse1. Une autre équipe possède un ensemble de vues T-SQL dans Warehouse1 qui contiennent de la logique métier, et ces vues ne peuvent être ni matérialisées ni réécrites.

    Vous devez créer un modèle sémantique qui utilise les tables et les vues de Warehouse1. Toutes les tables du modèle doivent utiliser le mode de stockage Direct Lake.

    Quel type de modèle sémantique devez-vous créer ?
body:
  options:
    - id: a
      text:
        en: "Direct Lake on SQL analytics endpoint"
        fr: "Direct Lake sur le point de terminaison d'analytique SQL"
    - id: b
      text:
        en: "Direct Lake on OneLake"
        fr: "Direct Lake sur OneLake"
    - id: c
      text:
        en: "Direct Lake on OneLake with the **Direct Lake behavior** property set to Automatic"
        fr: "Direct Lake sur OneLake avec la propriété **Direct Lake behavior** définie sur Automatic"
    - id: d
      text:
        en: "Direct Lake on OneLake with the views added as DirectQuery tables"
        fr: "Direct Lake sur OneLake avec les vues ajoutées comme tables DirectQuery"
answer:
  optionId: a
explanation:
  correct:
    en: "Direct Lake on SQL supports tables based on SQL analytics endpoint views: they keep the Direct Lake storage mode, and their queries automatically fall back to DirectQuery because a non-materialized view isn't a Delta table. Direct Lake on OneLake doesn't support tables based on non-materialized SQL views."
    fr: "Direct Lake sur SQL prend en charge les tables fondées sur des vues du point de terminaison d'analytique SQL : elles conservent le mode de stockage Direct Lake, et leurs requêtes basculent automatiquement en DirectQuery, car une vue non matérialisée n'est pas une table Delta. Direct Lake sur OneLake ne prend pas en charge les tables fondées sur des vues SQL non matérialisées."
  options:
    b: { en: "Direct Lake on OneLake can't use non-materialized SQL views as Direct Lake tables.", fr: "Direct Lake sur OneLake ne peut pas utiliser de vues SQL non matérialisées comme tables Direct Lake." }
    c: { en: "The Direct Lake behavior property applies only to Direct Lake on SQL; Direct Lake on OneLake never falls back to DirectQuery.", fr: "La propriété Direct Lake behavior ne s'applique qu'à Direct Lake sur SQL ; Direct Lake sur OneLake ne bascule jamais en DirectQuery." }
    d: { en: "A composite model can add the views as DirectQuery tables, but then those tables don't use Direct Lake storage mode.", fr: "Un modèle composite peut ajouter les vues comme tables DirectQuery, mais ces tables n'utilisent alors pas le mode de stockage Direct Lake." }
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
  - title: Develop Direct Lake semantic models
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-develop
