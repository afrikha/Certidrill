id: dp600-cs2b-instructor-bridge
objective: "3.1.3"
type: dropdown
caseStudy: dp600-cs2b-bellows-college
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the relationships of SM-Enrollment to meet the instructor filtering requirement. The relationship between Instructor and CourseInstructor is one-to-many with a single cross-filter direction.

    How should you configure the model? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer les relations de SM-Enrollment pour respecter l'exigence de filtrage par enseignant. La relation entre Instructor et CourseInstructor est de type un-à-plusieurs avec une direction de filtrage croisé unique.

    Comment devez-vous configurer le modèle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Cardinality of the relationship between Course and CourseInstructor: [[card]]

      Relationship that must use the Both cross-filter direction: [[both]]
    fr: |
      Cardinalité de la relation entre Course et CourseInstructor : [[card]]

      Relation qui doit utiliser la direction de filtrage croisé Both : [[both]]
  slots:
    - id: card
      options:
        - { id: onemany, text: { en: "One to many", fr: "Un-à-plusieurs" } }
        - { id: manymany, text: { en: "Many to many", fr: "Plusieurs-à-plusieurs" } }
        - { id: oneone, text: { en: "One to one", fr: "Un-à-un" } }
    - id: both
      options:
        - { id: instr, text: "Instructor – CourseInstructor" }
        - { id: course, text: "Course – CourseInstructor" }
        - { id: enroll, text: "Course – Enrollment" }
        - { id: faculty, text: "Faculty – Course" }
answer:
  values: { card: onemany, both: course }
explanation:
  correct:
    en: "CourseInstructor is a bridge table with one row per course and instructor, so Course relates to it with a one-to-many relationship. A filter on Instructor reaches CourseInstructor, but the Course – CourseInstructor relationship filters only from Course by default; setting it to Both lets the filter continue to Course, and from there along the existing one-to-many relationship to Enrollment. One bidirectional relationship is enough."
    fr: "CourseInstructor est une table de pont avec une ligne par cours et par enseignant : Course lui est donc liée par une relation un-à-plusieurs. Un filtre sur Instructor atteint CourseInstructor, mais la relation Course – CourseInstructor ne filtre par défaut qu'à partir de Course ; la définir sur Both permet au filtre de continuer jusqu'à Course, puis vers Enrollment par la relation un-à-plusieurs existante. Une seule relation bidirectionnelle suffit."
  options:
    manymany:
      en: "Course is unique in its table, so the relationship is one-to-many; Microsoft recommends a bridge table with one-to-many relationships rather than relating dimensions with many-to-many cardinality."
      fr: "Course est unique dans sa table : la relation est donc un-à-plusieurs ; Microsoft recommande une table de pont avec des relations un-à-plusieurs plutôt que de relier des dimensions avec une cardinalité plusieurs-à-plusieurs."
    instr:
      en: "Instructor already filters CourseInstructor in the single direction; making this relationship Both does not let the filter reach Course."
      fr: "Instructor filtre déjà CourseInstructor dans la direction unique ; définir cette relation sur Both ne permet pas au filtre d'atteindre Course."
    enroll:
      en: "Course already filters Enrollment in the single direction; the filter stops earlier, between CourseInstructor and Course."
      fr: "Course filtre déjà Enrollment dans la direction unique ; le filtre s'arrête plus tôt, entre CourseInstructor et Course."
    faculty:
      en: "The Faculty – Course relationship is not on the path between Instructor and Enrollment."
      fr: "La relation Faculty – Course ne se trouve pas sur le chemin entre Instructor et Enrollment."
references:
  - title: Many-to-many relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-many-to-many
