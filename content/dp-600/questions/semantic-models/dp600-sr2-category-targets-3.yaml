id: dp600-sr2-category-targets-3
objective: "3.1.3"
type: series_yesno
series: dp600-sr2-category-targets
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You create a many-to-many relationship with a Both cross-filter direction.
  fr: Vous créez une relation plusieurs-à-plusieurs avec une direction de filtrage croisé Les deux.
body:
  solution:
    en: You create a relationship between **Product[Category]** and **Target[Category]** with the **Many to many** cardinality and a **Both** cross-filter direction.
    fr: Vous créez une relation entre **Product[Category]** et **Target[Category]** avec la cardinalité **Plusieurs-à-plusieurs** et une direction de filtrage croisé **Les deux**.
answer: { value: false }
explanation:
  correct:
    en: A category slicer would filter Target, but with a Both cross-filter direction a filter on Target, such as a slicer on TargetYear, also propagates to Product and then to Sales. The second requirement forbids that propagation, so the relationship must use a single direction from Product to Target.
    fr: "Un segment de catégorie filtrerait Target, mais avec une direction de filtrage croisé Les deux, un filtre sur Target, par exemple un segment sur TargetYear, se propage aussi à Product puis à Sales. La deuxième exigence interdit cette propagation : la relation doit utiliser une direction unique de Product vers Target."
references:
  - title: Many-to-many relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-many-to-many
