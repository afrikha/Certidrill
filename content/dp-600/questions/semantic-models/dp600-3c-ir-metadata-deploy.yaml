id: dp600-3c-ir-metadata-deploy
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model named SalesModel in a workspace on a Fabric capacity, with the XMLA endpoint enabled for read-write. The FactSales table has an incremental refresh policy, and its historical partitions contain ten years of data that take hours to load. You maintain the source .pbix file of SalesModel in Power BI Desktop.

    You add a new measure to the .pbix file. You need to deploy the measure to SalesModel without losing the historical partitions and without reloading their data.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique nommé SalesModel dans un espace de travail sur une capacité Fabric, avec le point de terminaison XMLA activé en lecture-écriture. La table FactSales possède une stratégie d'actualisation incrémentielle, et ses partitions historiques contiennent dix ans de données dont le chargement prend des heures. Vous gérez le fichier .pbix source de SalesModel dans Power BI Desktop.

    Vous ajoutez une nouvelle mesure au fichier .pbix. Vous devez déployer la mesure dans SalesModel sans perdre les partitions historiques et sans recharger leurs données.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Republish the .pbix file from Power BI Desktop, and then run an incremental refresh of SalesModel."
        fr: "Republier le fichier .pbix depuis Power BI Desktop, puis lancer une actualisation incrémentielle de SalesModel."
    - id: b
      text:
        en: "Use ALM Toolkit to compare the .pbix file with SalesModel, and deploy only the new measure through the XMLA endpoint."
        fr: "Utiliser ALM Toolkit pour comparer le fichier .pbix avec SalesModel, et ne déployer que la nouvelle mesure via le point de terminaison XMLA."
    - id: c
      text:
        en: "Download SalesModel from the service as a .pbix file, add the measure, and republish the file."
        fr: "Télécharger SalesModel depuis le service sous forme de fichier .pbix, ajouter la mesure et republier le fichier."
    - id: d
      text:
        en: "Republish the .pbix file, and then send a TMSL refresh command with applyRefreshPolicy set to false."
        fr: "Republier le fichier .pbix, puis envoyer une commande d'actualisation TMSL avec applyRefreshPolicy défini sur false."
answer:
  optionId: b
explanation:
  correct:
    en: "Republishing from Power BI Desktop replaces the model, including its partitions and their data, so the next refresh must reload the whole history. A metadata-only deployment, for example with ALM Toolkit through the XMLA endpoint, adds the new measure and keeps the existing partitions and data."
    fr: "Republier depuis Power BI Desktop remplace le modèle, y compris ses partitions et leurs données : la prochaine actualisation doit alors recharger tout l'historique. Un déploiement de métadonnées uniquement, par exemple avec ALM Toolkit via le point de terminaison XMLA, ajoute la nouvelle mesure et conserve les partitions et les données existantes."
  options:
    a: { en: "Republishing removes the existing partitions and data, so the history must be loaded again.", fr: "Republier supprime les partitions et les données existantes : l'historique doit être rechargé." }
    c: { en: "A model with incremental refresh can't be downloaded back as a .pbix file after it's published.", fr: "Un modèle doté de l'actualisation incrémentielle ne peut pas être retéléchargé sous forme de fichier .pbix après sa publication." }
    d: { en: "The republish already replaced the partitions and their data; the TMSL refresh then reloads data instead of preserving it.", fr: "La republication a déjà remplacé les partitions et leurs données ; l'actualisation TMSL recharge ensuite les données au lieu de les conserver." }
references:
  - title: Advanced incremental refresh and real-time data with the XMLA endpoint
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-xmla
  - title: Configure incremental refresh and real-time data for Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-overview
