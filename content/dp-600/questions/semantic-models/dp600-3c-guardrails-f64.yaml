id: dp600-3c-guardrails-f64
objective: "3.2.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace on an F64 capacity. The workspace contains a lakehouse named Lakehouse1 and two semantic models that use the Delta table named web_events in Lakehouse1:

    - ModelA, a Direct Lake on SQL analytics endpoint model that uses the default Direct Lake behavior
    - ModelB, a Direct Lake on OneLake model

    After a month of small streaming appends, web_events contains 6,000 Parquet files. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric sur une capacité F64. L'espace de travail contient un lakehouse nommé Lakehouse1 et deux modèles sémantiques qui utilisent la table Delta nommée web_events de Lakehouse1 :

    - ModelA, un modèle Direct Lake sur le point de terminaison d'analytique SQL qui utilise le comportement Direct Lake par défaut
    - ModelB, un modèle Direct Lake sur OneLake

    Après un mois de petits ajouts en streaming, web_events contient 6 000 fichiers Parquet. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A refresh of ModelA succeeds with a warning, and the queries of ModelA return results in DirectQuery mode.
        fr: Une actualisation de ModelA réussit avec un avertissement, et les requêtes de ModelA renvoient des résultats en mode DirectQuery.
    - id: s2
      text:
        en: The queries of ModelB that use web_events are answered in DirectQuery mode through the SQL analytics endpoint of Lakehouse1.
        fr: Les requêtes de ModelB qui utilisent web_events reçoivent une réponse en mode DirectQuery via le point de terminaison d'analytique SQL de Lakehouse1.
    - id: s3
      text:
        en: Moving the workspace to an F128 capacity brings web_events within the Parquet file guardrail without any change to the table.
        fr: Déplacer l'espace de travail vers une capacité F128 fait passer web_events sous le garde-fou de fichiers Parquet sans aucune modification de la table.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The F64 and F128 SKUs both allow 5,000 Parquet files per table, so web_events exceeds the guardrail on either capacity. Direct Lake on SQL with fallback enabled refreshes with a warning and answers queries in DirectQuery mode, more slowly. Direct Lake on OneLake never falls back: its refresh fails and the model can't be queried until the Delta table is optimized, for example with OPTIMIZE, to fall within the limits.
    fr: |
      Les références SKU F64 et F128 autorisent toutes deux 5 000 fichiers Parquet par table : web_events dépasse le garde-fou sur l'une comme sur l'autre. Direct Lake sur SQL avec le basculement activé s'actualise avec un avertissement et répond aux requêtes en mode DirectQuery, plus lentement. Direct Lake sur OneLake ne bascule jamais : son actualisation échoue et le modèle ne peut plus être interrogé tant que la table Delta n'est pas optimisée, par exemple avec OPTIMIZE, pour respecter les limites.
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
