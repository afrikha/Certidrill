id: dp600-3b-perf-pa-facts
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You use Performance Analyzer to troubleshoot a report that uses a composite model. Some visuals query DirectQuery tables in an Azure SQL database. You work both in Power BI Desktop and in the Power BI service.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez l'Analyseur de performances pour dépanner un rapport qui utilise un modèle composite. Certains visuels interrogent des tables DirectQuery d'une base de données Azure SQL. Vous travaillez à la fois dans Power BI Desktop et dans le service Power BI.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          For a visual that uses a DirectQuery table, Copy query copies the DAX query and the SQL query sent to the database.
        fr: |
          Pour un visuel qui utilise une table DirectQuery, Copier la requête copie la requête DAX et la requête SQL envoyée à la base de données.
    - id: s2
      text:
        en: |
          In the Power BI service, Performance Analyzer can open the query of a visual directly in DAX query view by using Run in DAX query view.
        fr: |
          Dans le service Power BI, l'Analyseur de performances peut ouvrir directement la requête d'un visuel dans la vue de requête DAX avec Exécuter dans la vue de requête DAX.
    - id: s3
      text:
        en: |
          The duration reported for a visual can include time spent waiting behind other operations.
        fr: |
          La durée indiquée pour un visuel peut inclure du temps passé à attendre derrière d'autres opérations.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      For DirectQuery visuals, the copied query contains the DAX query and the translated SQL or KQL query. Run in DAX query view exists only in Power BI Desktop; in the service you copy the query and run it from DAX query view in web modeling. Most operations run on a single UI thread shared by several operations, so durations include time spent queued.
    fr: |
      Pour les visuels DirectQuery, la requête copiée contient la requête DAX et la requête SQL ou KQL traduite. Exécuter dans la vue de requête DAX n'existe que dans Power BI Desktop ; dans le service, vous copiez la requête et l'exécutez depuis la vue de requête DAX de la modélisation web. La plupart des opérations s'exécutent sur un seul thread d'interface partagé par plusieurs opérations : les durées incluent donc le temps passé en file d'attente.
references:
  - title: Use Performance Analyzer to examine report performance
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-performance-analyzer
