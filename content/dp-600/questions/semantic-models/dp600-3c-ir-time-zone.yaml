id: dp600-3c-ir-time-zone
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model named RetailModel in a workspace in Power BI Premium Per User mode. The FactSales table has an incremental refresh policy that refreshes the last three days, with **Only refresh complete days** turned on. A scheduled refresh runs every day at 9:00 PM Pacific Time.

    The refresh periods are calculated from the date in Coordinated Universal Time (UTC), which is already the next day at 9:00 PM Pacific Time. You need the refresh periods to be calculated from the date in Pacific Time.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique nommé RetailModel dans un espace de travail en mode Premium par utilisateur. La table FactSales possède une stratégie d'actualisation incrémentielle qui actualise les trois derniers jours, avec **Only refresh complete days** activé. Une actualisation planifiée s'exécute chaque jour à 21 h 00, heure du Pacifique.

    Les périodes d'actualisation sont calculées à partir de la date en temps universel coordonné (UTC), qui correspond déjà au lendemain à 21 h 00, heure du Pacifique. Vous devez faire en sorte que les périodes d'actualisation soient calculées à partir de la date selon l'heure du Pacifique.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "In Power Query Editor, set the current values of RangeStart and RangeEnd to Pacific Time dates, and republish RetailModel."
        fr: "Dans l'Éditeur Power Query, définir les valeurs actuelles de RangeStart et RangeEnd sur des dates de l'heure du Pacifique, et republier RetailModel."
    - id: b
      text:
        en: "Replace the scheduled refresh with a TMSL refresh command that is sent through the XMLA endpoint at the same time."
        fr: "Remplacer l'actualisation planifiée par une commande d'actualisation TMSL envoyée via le point de terminaison XMLA à la même heure."
    - id: c
      text:
        en: "In the refresh settings of RetailModel in the Power BI service, set the time zone to Pacific Time."
        fr: "Dans les paramètres d'actualisation de RetailModel dans le service Power BI, définir le fuseau horaire sur l'heure du Pacifique."
    - id: d
      text:
        en: "Turn off **Only refresh complete days** in the incremental refresh policy, and republish RetailModel."
        fr: "Désactiver **Only refresh complete days** dans la stratégie d'actualisation incrémentielle, et republier RetailModel."
answer:
  optionId: c
explanation:
  correct:
    en: "By default, incremental refresh calculates the current date in UTC at refresh time. For on-demand, scheduled and REST API refreshes, the time zone selected in the refresh settings of the semantic model is used instead, so a 9:00 PM Pacific refresh uses the Pacific date."
    fr: "Par défaut, l'actualisation incrémentielle calcule la date actuelle en UTC au moment de l'actualisation. Pour les actualisations à la demande, planifiées et par l'API REST, c'est le fuseau horaire sélectionné dans les paramètres d'actualisation du modèle sémantique qui est utilisé : une actualisation à 21 h 00, heure du Pacifique, utilise alors la date du Pacifique."
  options:
    a: { en: "The current values only filter the data in Power BI Desktop; the service overrides them for each partition, and republishing replaces the existing partitions.", fr: "Les valeurs actuelles ne filtrent les données que dans Power BI Desktop ; le service les remplace pour chaque partition, et republier remplace les partitions existantes." }
    b: { en: "Refreshes started outside the service, such as a TMSL refresh command, ignore the time zone setting and always use UTC.", fr: "Les actualisations lancées hors du service, comme une commande d'actualisation TMSL, ignorent le paramètre de fuseau horaire et utilisent toujours UTC." }
    d: { en: "Only refresh complete days excludes the incomplete day; turning it off doesn't change the time zone used to calculate the periods.", fr: "Only refresh complete days exclut le jour incomplet ; le désactiver ne change pas le fuseau horaire utilisé pour calculer les périodes." }
references:
  - title: Configure incremental refresh and real-time data for Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-overview
