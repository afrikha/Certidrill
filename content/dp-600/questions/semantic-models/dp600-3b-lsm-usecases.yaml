id: dp600-3b-lsm-usecases
objective: "3.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Your company has a Fabric workspace that is assigned to an F256 capacity. You review four semantic models to decide whether to use the large semantic model storage format for each of them.

    Which recommendation applies to each model? To answer, drag the appropriate recommendations to the correct models. Each recommendation may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre entreprise dispose d'un espace de travail Fabric attribué à une capacité F256. Vous examinez quatre modèles sémantiques pour décider s'il faut utiliser le format de stockage de modèle sémantique volumineux pour chacun d'eux.

    Quelle recommandation s'applique à chaque modèle ? Pour répondre, faites glisser les recommandations appropriées vers les modèles correspondants. Chaque recommandation peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: req, text: { en: "Required", fr: "Obligatoire" } }
    - { id: rec, text: { en: "Recommended but not required", fr: "Recommandé mais pas obligatoire" } }
    - { id: nosup, text: { en: "Not supported", fr: "Non pris en charge" } }
  targets:
    - { id: t1, text: { en: "An Import model that will reach 35 GB", fr: "Un modèle Import qui atteindra 35 Go" } }
    - { id: t2, text: { en: "A 700 MB Import model that developers change through XMLA write operations", fr: "Un modèle Import de 700 Mo que les développeurs modifient par des opérations d'écriture XMLA" } }
    - { id: t3, text: { en: "A push semantic model that receives data through the REST API", fr: "Un modèle sémantique push qui reçoit des données via l'API REST" } }
    - { id: t4, text: { en: "A new model with incremental refresh that might grow beyond 1 GB, before its first refresh", fr: "Un nouveau modèle avec actualisation incrémentielle qui pourrait dépasser 1 Go, avant sa première actualisation" } }
answer:
  mapping: { t1: req, t2: rec, t3: nosup, t4: rec }
explanation:
  correct:
    en: |
      A 35 GB model is far above the default size limit, so it can only exist with the large format. For models modified with XMLA-based write tools, the format is recommended even when they are small, because it can improve write performance. When a model with incremental refresh might grow beyond 1 GB, turning the format on before the first refresh improves refresh performance and avoids hitting size limits. Push semantic models do not support the large format.
    fr: |
      Un modèle de 35 Go dépasse largement la limite de taille par défaut : il ne peut exister qu'avec le format volumineux. Pour les modèles modifiés par des outils d'écriture XMLA, le format est recommandé même s'ils sont petits, car il peut améliorer les performances d'écriture. Quand un modèle avec actualisation incrémentielle pourrait dépasser 1 Go, activer le format avant la première actualisation améliore les performances d'actualisation et évite d'atteindre les limites de taille. Les modèles sémantiques push ne prennent pas en charge le format volumineux.
references:
  - title: Large semantic models in Power BI Premium
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/service-premium-large-models
  - title: Configure incremental refresh and real-time data for Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-overview
