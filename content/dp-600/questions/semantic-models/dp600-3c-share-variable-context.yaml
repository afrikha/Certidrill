id: dp600-3c-share-variable-context
objective: "3.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a semantic model that contains a measure named [Sales] and a table named Product. A report shows a table visual of product categories with a measure named Category Share that returns the sales of each category divided by the sales of all categories.

    You rewrite Category Share with variables to improve its performance. Categories without sales must not appear in the visual, and the measure must use the most efficient functions.

    How should you complete the DAX expression? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique qui contient une mesure nommée [Sales] et une table nommée Product. Un rapport présente un visuel de table des catégories de produits avec une mesure nommée Category Share qui renvoie les ventes de chaque catégorie divisées par les ventes de toutes les catégories.

    Vous réécrivez Category Share avec des variables pour améliorer ses performances. Les catégories sans ventes ne doivent pas apparaître dans le visuel, et la mesure doit utiliser les fonctions les plus efficaces.

    Comment devez-vous compléter l'expression DAX ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Category Share =
    VAR _Sales = [Sales]
    VAR _AllCategories =
        [[all]]
    RETURN
        [[ret]]
  slots:
    - id: all
      options:
        - id: calcmeasure
          text: |-
            CALCULATE ( [Sales], REMOVEFILTERS ( 'Product'[Category] ) )
        - id: calcvar
          text: |-
            CALCULATE ( _Sales, REMOVEFILTERS ( 'Product'[Category] ) )
        - id: sumxvar
          text: |-
            SUMX ( ALL ( 'Product'[Category] ), _Sales )
        - id: filtersales
          text: |-
            CALCULATE ( [Sales], FILTER ( Sales, TRUE () ) )
    - id: ret
      options:
        - id: divide
          text: |-
            DIVIDE ( _Sales, _AllCategories )
        - id: dividezero
          text: |-
            DIVIDE ( _Sales, _AllCategories, 0 )
        - id: iferror
          text: |-
            IFERROR ( _Sales / _AllCategories, BLANK () )
        - id: inverted
          text: |-
            DIVIDE ( _AllCategories, _Sales )
answer:
  values: { all: calcmeasure, ret: divide }
explanation:
  correct:
    en: |
      A variable is evaluated once, in the filter context where it is defined, and then behaves as a constant: CALCULATE can't change its value. The total of all categories must therefore reference the [Sales] measure inside CALCULATE with REMOVEFILTERS on the Category column. DIVIDE without an alternate result returns BLANK when there are no sales, so the visual drops those categories, and it avoids the extra storage engine scans caused by IFERROR.
    fr: |
      Une variable est évaluée une seule fois, dans le contexte de filtre où elle est définie, puis se comporte comme une constante : CALCULATE ne peut pas modifier sa valeur. Le total de toutes les catégories doit donc référencer la mesure [Sales] dans CALCULATE avec REMOVEFILTERS sur la colonne Category. DIVIDE sans résultat de remplacement renvoie BLANK quand il n'y a pas de ventes : le visuel élimine ces catégories, et l'on évite les analyses supplémentaires du moteur de stockage provoquées par IFERROR.
  options:
    calcvar: { en: "_Sales was already evaluated in the current category's context; CALCULATE doesn't re-evaluate it, so the share is always 100 %.", fr: "_Sales a déjà été évaluée dans le contexte de la catégorie en cours ; CALCULATE ne la réévalue pas, donc la part vaut toujours 100 %." }
    sumxvar: { en: "This adds the constant _Sales once per category instead of totaling the sales of all categories.", fr: "Cette expression additionne la constante _Sales une fois par catégorie au lieu de totaliser les ventes de toutes les catégories." }
    filtersales: { en: "FILTER over Sales keeps the current category filter and iterates the fact table.", fr: "FILTER sur Sales conserve le filtre de la catégorie en cours et itère la table de faits." }
    dividezero: { en: "Returning 0 makes the measure dense, so categories without sales appear in the visual.", fr: "Renvoyer 0 rend la mesure dense : les catégories sans ventes apparaissent dans le visuel." }
    iferror: { en: "IFERROR adds storage engine scans and is slower than DIVIDE.", fr: "IFERROR ajoute des analyses du moteur de stockage et est plus lent que DIVIDE." }
    inverted: { en: "The numerator and the denominator are inverted.", fr: "Le numérateur et le dénominateur sont inversés." }
references:
  - title: Use variables to improve your DAX formulas
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-variables
  - title: DIVIDE function vs. divide operator (/)
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-divide-function-operator
