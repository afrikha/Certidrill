id: dp600-3c-fallback-reason
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Direct Lake on SQL analytics endpoint semantic model named OpsModel that uses the default Direct Lake behavior. In Power BI Desktop, Performance analyzer shows a Direct query duration for several visuals that use OpsModel.

    You need to identify, for each table of OpsModel, whether it can be queried in Direct Lake mode and, if it can't, the reason.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique Direct Lake sur le point de terminaison d'analytique SQL nommé OpsModel qui utilise le comportement Direct Lake par défaut. Dans Power BI Desktop, l'Analyseur de performances affiche une durée Direct query pour plusieurs visuels qui utilisent OpsModel.

    Vous devez identifier, pour chaque table d'OpsModel, si elle peut être interrogée en mode Direct Lake et, sinon, pour quelle raison.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Run a SQL Server Profiler trace on OpsModel and review the DirectQuery_Begin and DirectQuery_End events."
        fr: "Exécuter une trace SQL Server Profiler sur OpsModel et examiner les événements DirectQuery_Begin et DirectQuery_End."
    - id: b
      text:
        en: "Run the DAX query `EVALUATE TABLETRAITS()` against OpsModel and review the DirectLakeFallbackInfo column."
        fr: "Exécuter la requête DAX `EVALUATE TABLETRAITS()` sur OpsModel et examiner la colonne DirectLakeFallbackInfo."
    - id: c
      text:
        en: "Open the refresh history of OpsModel and review the entries on the **Direct Lake** tab."
        fr: "Ouvrir l'historique d'actualisation d'OpsModel et examiner les entrées de l'onglet **Direct Lake**."
    - id: d
      text:
        en: "In Performance analyzer, select **Copy query** for each visual and review the SQL query that it contains."
        fr: "Dans l'Analyseur de performances, sélectionner **Copy query** pour chaque visuel et examiner la requête SQL qu'elle contient."
answer:
  optionId: b
explanation:
  correct:
    en: "TABLETRAITS returns one row per table of the model, and its DirectLakeFallbackInfo column gives the reason why the table falls back to DirectQuery, such as a SQL view or a guardrail, or None when the table is in Direct Lake mode."
    fr: "TABLETRAITS renvoie une ligne par table du modèle, et sa colonne DirectLakeFallbackInfo donne la raison pour laquelle la table bascule en DirectQuery, par exemple une vue SQL ou un garde-fou, ou None quand la table est en mode Direct Lake."
  options:
    a: { en: "DirectQuery events show that a query fell back, but not the reason for each table.", fr: "Les événements DirectQuery montrent qu'une requête a basculé, mais pas la raison pour chaque table." }
    c: { en: "The Direct Lake tab of the refresh history lists refresh failures, not the fallback reasons of queries.", fr: "L'onglet Direct Lake de l'historique d'actualisation liste les échecs d'actualisation, pas les raisons de basculement des requêtes." }
    d: { en: "The copied query shows the SQL sent to the endpoint for each visual, not which table caused the fallback or why.", fr: "La requête copiée montre le SQL envoyé au point de terminaison pour chaque visuel, mais pas quelle table a provoqué le basculement ni pourquoi." }
references:
  - title: How Direct Lake works
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works
  - title: Analyze query processing for Direct Lake semantic models
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-analyze-query-processing
