id: dp600-3c-is-nullable
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model in Import mode that contains a table named Sales. Because of a defect in the source application, the Sales[UnitPrice] column sometimes contains blanks, so several measures wrap their arithmetic in ISERROR and IFERROR.

    You need to remove the error functions from the measures to improve performance. Any future blank in Sales[UnitPrice] must make the semantic model refresh fail.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique en mode Import qui contient une table nommée Sales. À cause d'un défaut de l'application source, la colonne Sales[UnitPrice] contient parfois des valeurs vides : plusieurs mesures encapsulent donc leurs calculs dans ISERROR et IFERROR.

    Vous devez supprimer les fonctions d'erreur des mesures pour améliorer les performances. Toute future valeur vide dans Sales[UnitPrice] doit faire échouer l'actualisation du modèle sémantique.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add a **Replace values** step in Power Query that replaces null values in UnitPrice with 0."
        fr: "Ajouter une étape **Remplacer les valeurs** dans Power Query qui remplace les valeurs null de UnitPrice par 0."
    - id: b
      text:
        en: "Set the **Is Nullable** property of the Sales[UnitPrice] column to Off."
        fr: "Définir la propriété **Is Nullable** de la colonne Sales[UnitPrice] sur Off."
    - id: c
      text:
        en: "Set the **Summarize by** property of the Sales[UnitPrice] column to None."
        fr: "Définir la propriété **Summarize by** de la colonne Sales[UnitPrice] sur None."
    - id: d
      text:
        en: "Add a **Remove blank rows** step in Power Query to the Sales query."
        fr: "Ajouter une étape **Supprimer les lignes vides** dans Power Query à la requête Sales."
answer:
  optionId: b
explanation:
  correct:
    en: "Instead of error functions, which add storage engine scans, the guidance is to control data quality in the model. When the Is Nullable property of a column is Off, a refresh that encounters a BLANK in that column fails, and the data of the last successful refresh stays in the table."
    fr: "Plutôt que d'utiliser des fonctions d'erreur, qui ajoutent des analyses du moteur de stockage, il est recommandé de contrôler la qualité des données dans le modèle. Quand la propriété Is Nullable d'une colonne est sur Off, une actualisation qui rencontre un BLANK dans cette colonne échoue, et les données de la dernière actualisation réussie restent dans la table."
  options:
    a: { en: "Replacing the blanks hides the defect: the refresh succeeds with incorrect prices.", fr: "Remplacer les valeurs vides masque le défaut : l'actualisation réussit avec des prix incorrects." }
    c: { en: "Summarize by only sets the default aggregation of the column in visuals.", fr: "Summarize by définit seulement l'agrégation par défaut de la colonne dans les visuels." }
    d: { en: "Remove blank rows removes only rows whose columns are all empty, and the refresh still succeeds.", fr: "Supprimer les lignes vides ne supprime que les lignes dont toutes les colonnes sont vides, et l'actualisation réussit toujours." }
references:
  - title: Appropriate use of error functions
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-error-functions
