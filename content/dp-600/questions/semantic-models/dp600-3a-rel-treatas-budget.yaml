id: dp600-3a-rel-treatas-budget
objective: "3.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a semantic model that contains a **Product** dimension with a **Category** column, and a **Budget** table with the **CategoryName** and **Amount** columns. There's no relationship between Budget and Product, and the data team doesn't want to add one.

    You need a measure that returns the budget of the categories selected in a slicer on Product[Category].

    How should you complete the DAX expression? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique qui contient une dimension **Product** avec une colonne **Category**, et une table **Budget** avec les colonnes **CategoryName** et **Amount**. Il n'existe pas de relation entre Budget et Product, et l'équipe données ne veut pas en ajouter.

    Vous avez besoin d'une mesure qui renvoie le budget des catégories sélectionnées dans un segment sur Product[Category].

    Comment devez-vous compléter l'expression DAX ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Budget Amount =
    CALCULATE (
        SUM ( Budget[Amount] ),
        [[fn]] ( VALUES ( 'Product'[Category] ), [[col]] )
    )
  slots:
    - id: fn
      options:
        - { id: treatas, text: TREATAS }
        - { id: userel, text: USERELATIONSHIP }
        - { id: crossf, text: CROSSFILTER }
        - { id: intersect, text: INTERSECT }
    - id: col
      options:
        - { id: col-name, text: "Budget[CategoryName]" }
        - { id: col-cat, text: "'Product'[Category]" }
        - { id: col-amount, text: "Budget[Amount]" }
        - { id: col-key, text: "'Product'[ProductKey]" }
answer:
  values: { fn: treatas, col: col-name }
explanation:
  correct:
    en: |
      TREATAS applies the values of a table expression as filters on columns of an unrelated table. Here the selected categories become a filter on Budget[CategoryName], and CALCULATE sums the matching budget rows. Category values that don't exist in Budget are ignored.
    fr: |
      TREATAS applique les valeurs d'une expression de table comme filtres sur des colonnes d'une table non liée. Ici, les catégories sélectionnées deviennent un filtre sur Budget[CategoryName], et CALCULATE additionne les lignes de budget correspondantes. Les valeurs de catégorie absentes de Budget sont ignorées.
  options:
    userel: { en: "USERELATIONSHIP activates an existing relationship; there's no relationship to activate.", fr: "USERELATIONSHIP active une relation existante ; il n'y a aucune relation à activer." }
    crossf: { en: "CROSSFILTER changes the direction of an existing relationship.", fr: "CROSSFILTER change la direction d'une relation existante." }
    intersect: { en: "INTERSECT returns the rows common to two tables; it doesn't move a filter onto another column.", fr: "INTERSECT renvoie les lignes communes à deux tables ; il ne reporte pas un filtre sur une autre colonne." }
    col-cat: { en: "The filter must land on the Budget column, not on the column it comes from.", fr: "Le filtre doit porter sur la colonne de Budget, pas sur la colonne d'où il provient." }
    col-amount: { en: "Category names aren't amounts; the target column must hold the same values.", fr: "Des noms de catégorie ne sont pas des montants ; la colonne cible doit contenir les mêmes valeurs." }
    col-key: { en: "ProductKey doesn't hold category names, and Product isn't the table to filter.", fr: "ProductKey ne contient pas de noms de catégorie, et Product n'est pas la table à filtrer." }
references:
  - title: TREATAS function
    url: https://learn.microsoft.com/en-us/dax/treatas-function
