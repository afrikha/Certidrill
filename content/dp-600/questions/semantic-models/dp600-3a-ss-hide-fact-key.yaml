id: dp600-3a-ss-hide-fact-key
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a semantic model with a **Customer** dimension and a **Sales** fact table related one-to-many on **CustomerKey**. Both CustomerKey columns are visible in the Data pane.

    Report authors sometimes add Sales[CustomerKey] to slicers. You need to follow star schema guidance for the key columns.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique avec une dimension **Customer** et une table de faits **Sales** liées en un-à-plusieurs sur **CustomerKey**. Les deux colonnes CustomerKey sont visibles dans le volet Données.

    Les auteurs de rapports ajoutent parfois Sales[CustomerKey] à des segments. Vous devez suivre les recommandations du schéma en étoile pour les colonnes de clé.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Hide Sales[CustomerKey] and keep Customer[CustomerKey] visible only if authors need it.", fr: "Masquer Sales[CustomerKey] et ne laisser Customer[CustomerKey] visible que si les auteurs en ont besoin." } }
    - { id: b, text: { en: "Hide Customer[CustomerKey] and keep Sales[CustomerKey] visible.", fr: "Masquer Customer[CustomerKey] et laisser Sales[CustomerKey] visible." } }
    - { id: c, text: { en: "Set the cross-filter direction of the relationship to Both.", fr: "Définir la direction du filtrage croisé de la relation sur Les deux (Both)." } }
    - { id: d, text: { en: "Change the relationship cardinality to many-to-many.", fr: "Changer la cardinalité de la relation en plusieurs-à-plusieurs." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Fact tables are summarized and dimensions are used to filter and group. A key column used for reporting must stay on the one side of the relationship, and the many-side column should be hidden. Slicing on the dimension key filters the fact table through the relationship.
    fr: |
      Les tables de faits servent à synthétiser et les dimensions à filtrer et regrouper. Une colonne de clé utilisée dans les rapports doit rester du côté « un » de la relation, et la colonne du côté « plusieurs » doit être masquée. Un segment sur la clé de dimension filtre la table de faits par la relation.
  options:
    b: { en: "A slicer on the fact key doesn't filter the dimension and its other facts; the one-side column is the one to keep.", fr: "Un segment sur la clé du fait ne filtre pas la dimension ni ses autres faits ; c'est la colonne du côté « un » qu'il faut garder." }
    c: { en: "Bidirectional filtering doesn't address which column is exposed and can hurt performance.", fr: "Le filtrage bidirectionnel ne règle pas la question de la colonne exposée et peut nuire aux performances." }
    d: { en: "CustomerKey is unique in Customer, so the relationship must stay one-to-many.", fr: "CustomerKey est unique dans Customer ; la relation doit donc rester un-à-plusieurs." }
references:
  - title: Many-to-many relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-many-to-many
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
