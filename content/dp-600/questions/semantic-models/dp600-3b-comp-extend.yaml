id: dp600-3b-comp-extend
objective: "3.1.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Your company has a published semantic model named **SalesModel**. A planning analyst needs to combine SalesModel with an Excel workbook named Forecast.xlsx in a new model. SalesModel must not be copied, and the measures of SalesModel must be reused.

    How should the analyst complete the solution? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre entreprise dispose d'un modèle sémantique publié nommé **SalesModel**. Un analyste de planification doit combiner SalesModel avec un classeur Excel nommé Forecast.xlsx dans un nouveau modèle. SalesModel ne doit pas être copié, et les mesures de SalesModel doivent être réutilisées.

    Comment l'analyste doit-il compléter la solution ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In Power BI Desktop, connect to SalesModel by using the [[conn]] connector, select **Make changes to this model**, and then import Forecast.xlsx. The analyst needs the [[perm]] permission on SalesModel. In the new model, the tables of SalesModel use the [[mode]] storage mode.
    fr: |
      Dans Power BI Desktop, connectez-vous à SalesModel avec le connecteur [[conn]], sélectionnez **Apporter des modifications à ce modèle**, puis importez Forecast.xlsx. L'analyste a besoin de l'autorisation [[perm]] sur SalesModel. Dans le nouveau modèle, les tables de SalesModel utilisent le mode de stockage [[mode]].
  slots:
    - id: conn
      options:
        - { id: psm, text: { en: "Power BI semantic models", fr: "Modèles sémantiques Power BI" } }
        - { id: dataflows, text: { en: "Dataflows", fr: "Flux de données" } }
        - { id: sqlserver, text: { en: "SQL Server database", fr: "Base de données SQL Server" } }
        - { id: lakehouse, text: { en: "Lakehouses", fr: "Lakehouses" } }
    - id: perm
      options:
        - { id: read, text: Read }
        - { id: build, text: Build }
        - { id: reshare, text: Reshare }
        - { id: write, text: Write }
    - id: mode
      options:
        - { id: dq, text: DirectQuery }
        - { id: imp, text: Import }
        - { id: dual, text: Dual }
        - { id: dl, text: Direct Lake }
answer:
  values: { conn: psm, perm: build, mode: dq }
explanation:
  correct:
    en: |
      Connecting to a published model with the Power BI semantic models connector creates a live connection; Make changes to this model adds a local model and turns the connection into DirectQuery to the semantic model. The tables and measures of SalesModel stay remote and are queried, not copied. Creating such a composite model requires the Build permission on the source model.
    fr: |
      Se connecter à un modèle publié avec le connecteur Modèles sémantiques Power BI crée une connexion active ; Apporter des modifications à ce modèle ajoute un modèle local et transforme la connexion en DirectQuery vers le modèle sémantique. Les tables et les mesures de SalesModel restent distantes et sont interrogées, pas copiées. Créer un tel modèle composite exige l'autorisation Build sur le modèle source.
  options:
    dataflows: { en: "A dataflow is a data preparation item; it does not expose the measures of SalesModel.", fr: "Un flux de données est un élément de préparation des données ; il n'expose pas les mesures de SalesModel." }
    sqlserver: { en: "Querying the source database would bypass SalesModel and its measures.", fr: "Interroger la base de données source contournerait SalesModel et ses mesures." }
    lakehouse: { en: "A lakehouse connection reads Delta tables, not the semantic model and its measures.", fr: "Une connexion à un lakehouse lit des tables Delta, pas le modèle sémantique et ses mesures." }
    read: { en: "Read is enough to view reports on the composite model, not to create it.", fr: "Read suffit pour consulter des rapports sur le modèle composite, pas pour le créer." }
    reshare: { en: "Reshare lets a user share the model with others; it does not let the user build on it.", fr: "Reshare permet de partager le modèle avec d'autres ; il ne permet pas de créer du contenu à partir de celui-ci." }
    write: { en: "Write allows editing SalesModel itself, which is more than needed.", fr: "Write permet de modifier SalesModel lui-même, ce qui dépasse le besoin." }
    imp: { en: "Import would copy the data of SalesModel, which the requirement forbids.", fr: "Import copierait les données de SalesModel, ce que l'exigence interdit." }
    dual: { en: "Remote tables of a semantic model are queried with DirectQuery; they are not cached as Dual tables.", fr: "Les tables distantes d'un modèle sémantique sont interrogées en DirectQuery ; elles ne sont pas mises en cache comme des tables en mode Double." }
    dl: { en: "Direct Lake reads Delta tables in OneLake, not another semantic model.", fr: "Direct Lake lit des tables Delta dans OneLake, pas un autre modèle sémantique." }
references:
  - title: Use composite models in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-composite-models
