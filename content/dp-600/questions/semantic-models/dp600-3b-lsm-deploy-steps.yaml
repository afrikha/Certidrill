id: dp600-3b-lsm-deploy-steps
objective: "3.1.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You develop an Import semantic model named **Shipments** in Power BI Desktop. You will publish Shipments to a Fabric workspace named **WS1**, which is assigned to an F256 capacity and uses the small storage format by default.

    After the history is loaded, Shipments will be about 40 GB. Power BI Desktop must not load the full history.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous développez un modèle sémantique Import nommé **Shipments** dans Power BI Desktop. Vous publierez Shipments dans un espace de travail Fabric nommé **WS1**, qui est attribué à une capacité F256 et utilise par défaut le petit format de stockage.

    Une fois l'historique chargé, Shipments fera environ 40 Go. Power BI Desktop ne doit pas charger l'historique complet.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: policy, text: { en: "Configure an incremental refresh policy on the fact table in Power BI Desktop.", fr: "Configurer une stratégie d'actualisation incrémentielle sur la table de faits dans Power BI Desktop." } }
    - { id: publish, text: { en: "Publish Shipments to WS1.", fr: "Publier Shipments dans WS1." } }
    - { id: large, text: { en: "In the settings of Shipments, turn on Large semantic model storage format.", fr: "Dans les paramètres de Shipments, activer Large semantic model storage format." } }
    - { id: refresh, text: { en: "Run the first refresh of Shipments in the service.", fr: "Lancer la première actualisation de Shipments dans le service." } }
    - { id: fullload, text: { en: "Load the full history in Power BI Desktop.", fr: "Charger l'historique complet dans Power BI Desktop." } }
    - { id: republish, text: { en: "Publish Shipments again from Power BI Desktop.", fr: "Publier de nouveau Shipments depuis Power BI Desktop." } }
answer:
  sequence: [ policy, publish, large, refresh ]
explanation:
  correct:
    en: |
      The incremental refresh policy is defined in Power BI Desktop, where RangeStart and RangeEnd keep the data small. After publishing, you turn on the large format in the model settings before the first refresh, which then creates the partitions and loads the history in the service, beyond the 10 GB upload limit.
    fr: |
      La stratégie d'actualisation incrémentielle se définit dans Power BI Desktop, où RangeStart et RangeEnd gardent les données réduites. Après la publication, vous activez le format volumineux dans les paramètres du modèle avant la première actualisation, qui crée ensuite les partitions et charge l'historique dans le service, au-delà de la limite de chargement de 10 Go.
  options:
    fullload:
      en: |
        Loading 40 GB in Power BI Desktop is what the requirement forbids, and the file could not be published beyond 10 GB.
      fr: |
        Charger 40 Go dans Power BI Desktop est justement ce que l'exigence interdit, et le fichier ne pourrait pas être publié au-delà de 10 Go.
    republish:
      en: |
        Republishing from Power BI Desktop removes the existing partitions and data of the model.
      fr: |
        Republier depuis Power BI Desktop supprime les partitions et les données existantes du modèle.
references:
  - title: Large semantic models in Power BI Premium
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/service-premium-large-models
  - title: Configure incremental refresh and real-time data for Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-overview
