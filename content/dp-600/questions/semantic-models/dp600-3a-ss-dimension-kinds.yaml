id: dp600-3a-ss-dimension-kinds
objective: "3.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are reviewing the star schema design of a semantic model named **OrdersModel** with the data modeling team.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez avec l'équipe de modélisation la conception en schéma en étoile d'un modèle sémantique nommé **OrdersModel**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          An order number that report users filter on can stay in the fact table as a degenerate dimension.
        fr: |
          Un numéro de commande sur lequel les utilisateurs filtrent peut rester dans la table de faits en tant que dimension dégénérée.
    - id: s2
      text:
        en: |
          A junk dimension combines several low-cardinality attributes, such as order status and delivery status, into one dimension table.
        fr: |
          Une dimension fourre-tout (junk) regroupe plusieurs attributs de faible cardinalité, comme le statut de commande et le statut de livraison, dans une seule table de dimension.
    - id: s3
      text:
        en: |
          The recommended way to keep type 2 slowly changing dimension history is to build the row versions with Power Query merges during each model refresh.
        fr: |
          La méthode recommandée pour conserver l'historique d'une dimension à variation lente de type 2 consiste à créer les versions de lignes par des fusions Power Query à chaque actualisation du modèle.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      A degenerate dimension such as an order number is an accepted exception that stays in the fact table. A junk dimension consolidates many small attributes, typically as their Cartesian product with a surrogate key, to reduce model size and Data pane clutter. Type 2 history is built in the data warehouse, which expires old rows and inserts new versions; Power Query can only load a type 2 table that already exists.
    fr: |
      Une dimension dégénérée comme un numéro de commande est une exception admise qui reste dans la table de faits. Une dimension fourre-tout consolide de nombreux petits attributs, généralement sous forme de produit cartésien avec une clé de substitution, pour réduire la taille du modèle et alléger le volet Données. L'historique de type 2 se construit dans l'entrepôt de données, qui clôt les anciennes lignes et insère les nouvelles versions ; Power Query ne peut que charger une table de type 2 déjà constituée.
references:
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
