id: dp600-3c-ir-integer-key
objective: "3.2.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are configuring incremental refresh for a table named FactOrders. FactOrders has no Date/Time column; it has an integer column named OrderDateKey that stores dates in the yyyymmdd format, such as 20261117. The RangeStart and RangeEnd parameters are of type Date/Time.

    You create a function query named DateKey that converts a parameter value to the format of OrderDateKey, and you use it in the filter step of FactOrders.

    How should you complete the Power Query M code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez l'actualisation incrémentielle d'une table nommée FactOrders. FactOrders n'a pas de colonne Date/Heure ; elle a une colonne d'entiers nommée OrderDateKey qui stocke les dates au format aaaammjj, par exemple 20261117. Les paramètres RangeStart et RangeEnd sont de type Date/Heure.

    Vous créez une requête de fonction nommée DateKey qui convertit une valeur de paramètre au format d'OrderDateKey, et vous l'utilisez dans l'étape de filtre de FactOrders.

    Comment devez-vous compléter le code Power Query M ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    // Function query DateKey
    (x as [[t]]) => Date.Year(x) * [[m]] + Date.Month(x) * 100 + Date.Day(x)

    // Filter step of the FactOrders query
    Filtered = Table.SelectRows(Orders, each [OrderDateKey] >= DateKey(RangeStart) and [OrderDateKey] < DateKey(RangeEnd))
  slots:
    - id: t
      options:
        - { id: date, text: date }
        - { id: datetime, text: datetime }
        - { id: number, text: number }
        - { id: text, text: text }
    - id: m
      options:
        - { id: m100, text: "100" }
        - { id: m1000, text: "1000" }
        - { id: m10000, text: "10000" }
        - { id: m1000000, text: "1000000" }
answer:
  values: { t: datetime, m: m10000 }
explanation:
  correct:
    en: "RangeStart and RangeEnd must stay Date/Time parameters even when the source column is an integer key, so the function takes a datetime value. Multiplying the year by 10000 and the month by 100 builds the yyyymmdd integer, for example 2026 * 10000 + 11 * 100 + 17 = 20261117."
    fr: "RangeStart et RangeEnd doivent rester des paramètres Date/Heure même quand la colonne source est une clé entière : la fonction prend donc une valeur datetime. Multiplier l'année par 10000 et le mois par 100 construit l'entier aaaammjj, par exemple 2026 * 10000 + 11 * 100 + 17 = 20261117."
  options:
    date: { en: "The parameters are Date/Time values; declaring the argument as date makes the function call fail.", fr: "Les paramètres sont des valeurs Date/Heure ; déclarer l'argument comme date fait échouer l'appel de la fonction." }
    number: { en: "The function receives the Date/Time parameters, not numbers.", fr: "La fonction reçoit les paramètres Date/Heure, pas des nombres." }
    m100: { en: "With 100, the year and the month overlap and the result isn't in the yyyymmdd format.", fr: "Avec 100, l'année et le mois se chevauchent et le résultat n'est pas au format aaaammjj." }
references:
  - title: Configure incremental refresh and real-time data
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-configure
