id: dp600-3b-perf-pa-steps
objective: "3.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You open a report named **Operations** in Power BI Desktop. One page of the report loads slowly.

    You need to identify the slowest visual of the page and analyze the DAX query that it sends to the model.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous ouvrez un rapport nommé **Operations** dans Power BI Desktop. Une page du rapport se charge lentement.

    Vous devez identifier le visuel le plus lent de la page et analyser la requête DAX qu'il envoie au modèle.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: open, text: { en: "On the Optimize ribbon, open Performance analyzer.", fr: "Dans le ruban Optimiser, ouvrir l'Analyseur de performances." } }
    - { id: start, text: { en: "Select Start recording.", fr: "Sélectionner Démarrer l'enregistrement." } }
    - { id: refresh, text: { en: "Select Refresh visuals.", fr: "Sélectionner Actualiser les visuels." } }
    - { id: run, text: { en: "Expand the slowest visual and select Run in DAX query view.", fr: "Développer le visuel le plus lent et sélectionner Exécuter dans la vue de requête DAX." } }
    - { id: pause, text: { en: "Select Pause visuals on the Optimize ribbon.", fr: "Sélectionner Suspendre les visuels (Pause visuals) dans le ruban Optimiser." } }
    - { id: diag, text: { en: "In Power Query Editor, select Start Diagnostics.", fr: "Dans l'Éditeur Power Query, sélectionner Démarrer les diagnostics." } }
answer:
  sequence: [ open, start, refresh, run ]
explanation:
  correct:
    en: |
      Performance Analyzer logs only what happens while it records, so you open the pane, start recording, and then refresh the visuals of the page to capture the duration of each visual. For the slowest visual, Run in DAX query view opens its query in DAX query view, where you can analyze and rewrite it.
    fr: |
      L'Analyseur de performances n'enregistre que ce qui se passe pendant l'enregistrement : vous ouvrez le volet, démarrez l'enregistrement, puis actualisez les visuels de la page pour capturer la durée de chaque visuel. Pour le visuel le plus lent, Exécuter dans la vue de requête DAX ouvre sa requête dans la vue de requête DAX, où vous pouvez l'analyser et la réécrire.
  options:
    pause:
      en: |
        Pause visuals stops visual queries while you edit; it would prevent the measurement.
      fr: |
        Suspendre les visuels arrête les requêtes des visuels pendant la modification ; cela empêcherait la mesure.
    diag:
      en: |
        Query diagnostics trace Power Query steps during data refresh, not the DAX queries of visuals.
      fr: |
        Les diagnostics de requête tracent les étapes Power Query pendant l'actualisation des données, pas les requêtes DAX des visuels.
references:
  - title: Use Performance Analyzer to examine report performance
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-performance-analyzer
