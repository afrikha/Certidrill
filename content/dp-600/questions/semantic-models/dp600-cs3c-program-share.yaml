id: dp600-cs3c-program-share
objective: "3.1.4"
type: dropdown
caseStudy: dp600-cs3c-graphic-design-institute
difficulty: 2
status: draft
stem:
  en: |
    You are writing the Program Share measure to meet requirement 3.

    How should you complete the DAX expression? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez la mesure Program Share pour satisfaire l'exigence 3.

    Comment devez-vous compléter l'expression DAX ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Program Share =
    VAR _Program = [Enrolled Students]
    VAR _Faculty =
        CALCULATE ( [Enrolled Students], [[remove]] ( Program[ProgramName] ) )
    RETURN
        IF ( [[scope]] ( Program[ProgramName] ), [[ratio]] ( _Program, _Faculty ) )
  slots:
    - id: remove
      options:
        - { id: allsel, text: ALLSELECTED }
        - { id: values, text: VALUES }
        - { id: removef, text: REMOVEFILTERS }
        - { id: keep, text: KEEPFILTERS }
    - id: scope
      options:
        - { id: isinscope, text: ISINSCOPE }
        - { id: hasone, text: HASONEVALUE }
        - { id: isfiltered, text: ISFILTERED }
        - { id: isblank, text: ISBLANK }
    - id: ratio
      options:
        - { id: max, text: MAX }
        - { id: coalesce, text: COALESCE }
        - { id: divide, text: DIVIDE }
answer:
  values: { remove: removef, scope: isinscope, ratio: divide }
explanation:
  correct:
    en: "`REMOVEFILTERS(Program[ProgramName])` removes every filter on the program, including the slicer selection, while the filter on Program[Faculty] stays, so _Faculty is the total of the whole faculty. `ISINSCOPE(Program[ProgramName])` is TRUE only on the program rows of the matrix, so the IF returns blank on the faculty and total rows. `DIVIDE` returns the share and handles a zero denominator."
    fr: "`REMOVEFILTERS(Program[ProgramName])` supprime tous les filtres sur le programme, y compris la sélection du segment, tandis que le filtre sur Program[Faculty] reste en place : _Faculty est donc le total de toute la faculté. `ISINSCOPE(Program[ProgramName])` n'est TRUE que sur les lignes de programme de la matrice : le IF renvoie donc une valeur vide sur les lignes de faculté et de total. `DIVIDE` renvoie la proportion et gère un dénominateur nul."
  options:
    allsel: { en: "ALLSELECTED keeps the slicer selection, so the programs that are not selected would be excluded from the faculty total.", fr: "ALLSELECTED conserve la sélection du segment : les programmes non sélectionnés seraient exclus du total de la faculté." }
    values: { en: "VALUES keeps the current program as a filter, so _Faculty equals _Program.", fr: "VALUES conserve le programme courant comme filtre : _Faculty est alors égal à _Program." }
    keep: { en: "KEEPFILTERS adds to the existing filters instead of removing the program filter.", fr: "KEEPFILTERS s'ajoute aux filtres existants au lieu de supprimer le filtre sur le programme." }
    hasone: { en: "HASONEVALUE is also TRUE on the row of a faculty that offers a single program, so that faculty row would not be blank.", fr: "HASONEVALUE est aussi TRUE sur la ligne d'une faculté qui ne propose qu'un seul programme : cette ligne de faculté ne serait pas vide." }
    isfiltered: { en: "ISFILTERED is TRUE on every row while the slicer filters Program[ProgramName], including the faculty and total rows.", fr: "ISFILTERED est TRUE sur toutes les lignes dès que le segment filtre Program[ProgramName], y compris les lignes de faculté et de total." }
    isblank: { en: "ISBLANK tests whether a value is blank; it does not tell which level of the matrix is displayed.", fr: "ISBLANK teste si une valeur est vide ; il n'indique pas quel niveau de la matrice est affiché." }
    max: { en: "MAX returns the larger of the two values, not a share.", fr: "MAX renvoie la plus grande des deux valeurs, pas une proportion." }
    coalesce: { en: "COALESCE returns the first non-blank value, not a share.", fr: "COALESCE renvoie la première valeur non vide, pas une proportion." }
references:
  - title: ISINSCOPE function (DAX)
    url: https://learn.microsoft.com/en-us/dax/isinscope-function-dax
