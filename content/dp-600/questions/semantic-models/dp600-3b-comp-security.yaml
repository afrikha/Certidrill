id: dp600-3b-comp-security
objective: "3.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You create a model in Power BI Desktop that contains a DirectQuery table from an Azure SQL database named **SQL1** and an Import table from an Excel workbook that lists the names of product managers. You relate the two tables.

    Power BI Desktop displays a warning that data might be pushed from one data source to another.

    Which risk does the warning describe?
  fr: |
    Vous créez dans Power BI Desktop un modèle qui contient une table DirectQuery provenant d'une base de données Azure SQL nommée **SQL1** et une table Import provenant d'un classeur Excel qui liste les noms des chefs de produit. Vous reliez les deux tables.

    Power BI Desktop affiche un avertissement indiquant que des données peuvent être envoyées d'une source de données à une autre.

    Quel risque l'avertissement décrit-il ?
body:
  options:
    - { id: a, text: { en: "Names from the workbook can appear in queries sent to SQL1, where trace readers can see them.", fr: "Des noms du classeur peuvent apparaître dans les requêtes envoyées à SQL1, où les lecteurs des traces peuvent les voir." } }
    - { id: b, text: { en: "Rows of the workbook are written to a table of SQL1 at each refresh.", fr: "Des lignes du classeur sont écrites dans une table de SQL1 à chaque actualisation." } }
    - { id: c, text: { en: "The credentials of SQL1 are stored in the workbook connection.", fr: "Les informations d'identification de SQL1 sont stockées dans la connexion du classeur." } }
    - { id: d, text: { en: "Row-level security defined in SQL1 is turned off for the model.", fr: "La sécurité au niveau des lignes définie dans SQL1 est désactivée pour le modèle." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In a composite model, a query sent to one source can include values retrieved from another, for example product manager names from Excel in the WHERE clause of a SQL query. Database administrators who can view traces or audit logs could then see this data, and data could move from an encrypted connection to an unencrypted one.
    fr: |
      Dans un modèle composite, une requête envoyée à une source peut inclure des valeurs issues d'une autre, par exemple des noms de chefs de produit provenant d'Excel dans la clause WHERE d'une requête SQL. Les administrateurs de base de données qui peuvent consulter les traces ou les journaux d'audit pourraient alors voir ces données, et des données pourraient passer d'une connexion chiffrée à une connexion non chiffrée.
  options:
    b:
      en: |
        Power BI only reads from the sources; it does not write rows into SQL1.
      fr: |
        Power BI ne fait que lire les sources ; il n'écrit aucune ligne dans SQL1.
    c:
      en: |
        The warning is about values sent inside queries, not about credentials.
      fr: |
        L'avertissement porte sur les valeurs envoyées dans les requêtes, pas sur les informations d'identification.
    d:
      en: |
        Combining sources does not turn off security defined in the source database.
      fr: |
        Combiner des sources ne désactive pas la sécurité définie dans la base de données source.
references:
  - title: Use composite models in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-composite-models
