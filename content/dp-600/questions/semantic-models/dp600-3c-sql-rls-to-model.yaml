id: dp600-3c-sql-rls-to-model
objective: "3.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a warehouse named Warehouse1 and a Direct Lake on SQL analytics endpoint semantic model named SalesModel that uses the default Direct Lake behavior. In Warehouse1, a T-SQL security policy filters the FactSales table by the sales region of the signed-in user. Sales representatives are workspace Viewers and access the data only through reports on SalesModel.

    Queries on FactSales currently run in DirectQuery mode. You need queries on FactSales to run in Direct Lake mode, and each sales representative must still see only the rows of their region in the reports.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé Warehouse1 et d'un modèle sémantique Direct Lake sur le point de terminaison d'analytique SQL nommé SalesModel qui utilise le comportement Direct Lake par défaut. Dans Warehouse1, une stratégie de sécurité T-SQL filtre la table FactSales selon la région commerciale de l'utilisateur connecté. Les commerciaux sont des Viewers de l'espace de travail et n'accèdent aux données qu'au travers de rapports sur SalesModel.

    Les requêtes sur FactSales s'exécutent actuellement en mode DirectQuery. Vous devez faire en sorte que les requêtes sur FactSales s'exécutent en mode Direct Lake, et chaque commercial doit toujours ne voir que les lignes de sa région dans les rapports.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Drop the security policy that filters FactSales in Warehouse1."
        fr: "Supprimer la stratégie de sécurité qui filtre FactSales dans Warehouse1."
    - id: b
      text:
        en: "Set the **Direct Lake behavior** property of SalesModel to DirectLakeOnly."
        fr: "Définir la propriété **Direct Lake behavior** de SalesModel sur DirectLakeOnly."
    - id: c
      text:
        en: "Create a role in SalesModel that filters FactSales by the region of the user, and add the sales representatives to the role."
        fr: "Créer dans SalesModel un rôle qui filtre FactSales selon la région de l'utilisateur, et y ajouter les commerciaux."
    - id: d
      text:
        en: "Replace FactSales in SalesModel with a view in Warehouse1 that filters the rows by using USER_NAME()."
        fr: "Remplacer FactSales dans SalesModel par une vue de Warehouse1 qui filtre les lignes avec USER_NAME()."
    - id: e
      text:
        en: "Bind SalesModel to a fixed identity cloud connection, and keep the security policy."
        fr: "Lier SalesModel à une connexion cloud à identité fixe, et conserver la stratégie de sécurité."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A table that has SQL row-level security at the SQL analytics endpoint always makes Direct Lake on SQL fall back to DirectQuery. Removing the policy lets FactSales load in Direct Lake mode, and a role defined in the semantic model enforces the same row filter for Viewers, because semantic model row-level security is supported in Direct Lake."
    fr: "Une table dotée d'une sécurité au niveau des lignes SQL au point de terminaison d'analytique SQL fait toujours basculer Direct Lake sur SQL en DirectQuery. Supprimer la stratégie permet de charger FactSales en mode Direct Lake, et un rôle défini dans le modèle sémantique applique le même filtre de lignes aux Viewers, car la sécurité au niveau des lignes du modèle sémantique est prise en charge en Direct Lake."
  options:
    b: { en: "With DirectLakeOnly, the queries on FactSales fail with an error instead of running in Direct Lake mode.", fr: "Avec DirectLakeOnly, les requêtes sur FactSales échouent avec une erreur au lieu de s'exécuter en mode Direct Lake." }
    d: { en: "A table based on a non-materialized SQL view also falls back to DirectQuery.", fr: "Une table fondée sur une vue SQL non matérialisée bascule elle aussi en DirectQuery." }
    e: { en: "The security policy is still defined at the endpoint, so the queries still fall back, and the fixed identity would see its own rows instead of each user's rows.", fr: "La stratégie de sécurité reste définie au point de terminaison : les requêtes basculent toujours, et l'identité fixe verrait ses propres lignes au lieu de celles de chaque utilisateur." }
references:
  - title: Integrate Direct Lake security
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-security-integration
  - title: How Direct Lake works
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works
