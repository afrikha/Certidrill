id: dp600-3b-comp-limited-rel
objective: "3.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model in Power BI Desktop that contains a **Sales** table in DirectQuery mode from an Azure SQL database, and a **Region** table imported from a CSV file. You create a relationship named **R1** between Region[RegionID] and Sales[RegionID]. RegionID is unique in Region.

    Which two statements about R1 are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez dans Power BI Desktop d'un modèle sémantique qui contient une table **Sales** en mode DirectQuery provenant d'une base de données Azure SQL, et une table **Region** importée depuis un fichier CSV. Vous créez une relation nommée **R1** entre Region[RegionID] et Sales[RegionID]. RegionID est unique dans Region.

    Quelles sont les deux affirmations vraies sur R1 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Sales rows whose RegionID is missing from Region are grouped under a (Blank) region.", fr: "Les lignes de Sales dont le RegionID est absent de Region sont regroupées sous une région (Vide)." } }
    - { id: b, text: { en: "A measure can use RELATED in a SUMX over Sales to read Region[Name].", fr: "Une mesure peut utiliser RELATED dans un SUMX sur Sales pour lire Region[Name]." } }
    - { id: c, text: { en: "R1 is evaluated as a limited relationship.", fr: "R1 est évaluée comme une relation limitée." } }
    - { id: d, text: { en: "Filters propagate through R1 as fast as through a one-to-many relationship between two Import tables.", fr: "Les filtres se propagent à travers R1 aussi vite qu'à travers une relation un-à-plusieurs entre deux tables Import." } }
    - { id: e, text: { en: "R1 is created with a many-to-many cardinality by default.", fr: "R1 est créée par défaut avec une cardinalité plusieurs-à-plusieurs." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      Region is in the Import source group and Sales in the DirectQuery source group, so R1 is a cross source group relationship: it is always limited and it defaults to many-to-many, even though RegionID is unique in Region. You can change its cardinality, but it stays limited.
    fr: |
      Region appartient au groupe de sources Import et Sales au groupe de sources DirectQuery : R1 est donc une relation entre groupes de sources, toujours limitée et créée par défaut en plusieurs-à-plusieurs, même si RegionID est unique dans Region. Vous pouvez changer sa cardinalité, mais elle reste limitée.
  options:
    a:
      en: |
        Limited relationships use INNER JOIN semantics and add no blank virtual row, so unmatched Sales rows are dropped from the results.
      fr: |
        Les relations limitées utilisent une sémantique INNER JOIN et n'ajoutent pas de ligne virtuelle vide : les lignes de Sales sans correspondance disparaissent des résultats.
    b:
      en: |
        RELATED cannot retrieve one-side values through a limited relationship.
      fr: |
        RELATED ne peut pas récupérer les valeurs du côté un à travers une relation limitée.
    d:
      en: |
        Cross source group relationships are the slowest kind of filter propagation; one-to-many intra source group relationships are the fastest.
      fr: |
        Les relations entre groupes de sources sont le type de propagation de filtre le plus lent ; les relations un-à-plusieurs au sein d'un groupe de sources sont les plus rapides.
references:
  - title: Model relationships in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-relationships-understand
  - title: Use composite models in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-composite-models
