id: dp600-3a-dax-window-functions
objective: "3.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are writing DAX measures for a sales report in which a visual shows **Total Sales** by year and month.

    Which DAX function should you use as the core of each measure? To answer, drag the appropriate functions to the correct requirements. Each function may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez des mesures DAX pour un rapport de ventes dans lequel un visuel affiche **Total Sales** par année et par mois.

    Quelle fonction DAX devez-vous utiliser au cœur de chaque mesure ? Pour répondre, faites glisser les fonctions appropriées vers les exigences correspondantes. Chaque fonction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: window, text: WINDOW }
    - { id: offset, text: OFFSET }
    - { id: index, text: INDEX }
    - { id: rankx, text: RANKX }
    - { id: treatas, text: TREATAS }
    - { id: isinscope, text: ISINSCOPE }
  targets:
    - { id: t1, text: { en: "Show the sales of the last month of the selected period on every row", fr: "Afficher les ventes du dernier mois de la période sélectionnée sur chaque ligne" } }
    - { id: t2, text: { en: "Compute a three-month moving average that ends at the current month", fr: "Calculer une moyenne glissante sur trois mois qui se termine au mois actuel" } }
    - { id: t3, text: { en: "Show the sales of the same month of the previous year next to each month", fr: "Afficher les ventes du même mois de l'année précédente à côté de chaque mois" } }
    - { id: t4, text: { en: "Rank each product by its sales among all products", fr: "Classer chaque produit selon ses ventes parmi tous les produits" } }
answer:
  mapping: { t1: index, t2: window, t3: offset, t4: rankx }
explanation:
  correct:
    en: |
      INDEX returns the row at an absolute position, and INDEX(-1, ...) is the last row of the ordered relation. WINDOW returns a range of rows, such as -2 REL to 0 REL, that AVERAGEX can average. OFFSET returns the row a given number of rows before the current row, for example the same month in the previous year when the relation is partitioned by month and ordered by year. RANKX ranks a value among the values of an expression over a table such as ALL(Product). TREATAS and ISINSCOPE don't navigate or rank rows.
    fr: |
      INDEX renvoie la ligne à une position absolue, et INDEX(-1, ...) est la dernière ligne de la relation triée. WINDOW renvoie une plage de lignes, par exemple de -2 REL à 0 REL, dont AVERAGEX peut faire la moyenne. OFFSET renvoie la ligne située un nombre donné de lignes avant la ligne actuelle, par exemple le même mois de l'année précédente quand la relation est partitionnée par mois et triée par année. RANKX classe une valeur parmi les valeurs d'une expression sur une table comme ALL(Product). TREATAS et ISINSCOPE ne parcourent ni ne classent des lignes.
references:
  - title: INDEX function (DAX)
    url: https://learn.microsoft.com/en-us/dax/index-function-dax
  - title: RANKX function (DAX)
    url: https://learn.microsoft.com/en-us/dax/rankx-function-dax
