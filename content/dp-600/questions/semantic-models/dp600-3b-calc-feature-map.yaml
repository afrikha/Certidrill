id: dp600-3b-calc-feature-map
objective: "3.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are extending a semantic model named **FinanceModel** that contains 25 explicit measures and a table named **Currency** with a FormatString column. You have the following requirements:

    - Show each of the 25 measures as MTD, QTD and YTD values without creating 75 new measures.
    - Display the [Revenue] measure with the format of the currency selected in a slicer, while the other measures keep their format.
    - Always display the result of a YOY% calculation as a percentage, whatever measure it is applied to.
    - Let readers switch the rows of a matrix between Customer, Product and Region.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous enrichissez un modèle sémantique nommé **FinanceModel** qui contient 25 mesures explicites et une table nommée **Currency** avec une colonne FormatString. Vous avez les exigences suivantes :

    - Afficher chacune des 25 mesures en valeurs MTD, QTD et YTD sans créer 75 nouvelles mesures.
    - Afficher la mesure [Revenue] avec le format de la devise sélectionnée dans un segment, les autres mesures gardant leur format.
    - Toujours afficher en pourcentage le résultat d'un calcul YOY%, quelle que soit la mesure à laquelle il est appliqué.
    - Permettre aux lecteurs de changer les lignes d'une matrice entre Customer, Product et Region.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: cg, text: { en: "Calculation group with calculation items", fr: "Groupe de calcul avec des éléments de calcul" } }
    - { id: dfsm, text: { en: "Dynamic format string for a measure", fr: "Chaîne de format dynamique pour une mesure" } }
    - { id: dfsi, text: { en: "Dynamic format string on a calculation item", fr: "Chaîne de format dynamique sur un élément de calcul" } }
    - { id: fp, text: { en: "Field parameter", fr: "Paramètre de champ" } }
    - { id: cc, text: { en: "Calculated column", fr: "Colonne calculée" } }
  targets:
    - { id: t1, text: { en: "MTD, QTD and YTD for the 25 measures", fr: "MTD, QTD et YTD pour les 25 mesures" } }
    - { id: t2, text: { en: "Currency format for [Revenue] only", fr: "Format de devise pour [Revenue] uniquement" } }
    - { id: t3, text: { en: "YOY% always as a percentage", fr: "YOY% toujours en pourcentage" } }
    - { id: t4, text: { en: "Matrix rows chosen by readers", fr: "Lignes de matrice choisies par les lecteurs" } }
answer:
  mapping: { t1: cg, t2: dfsm, t3: dfsi, t4: fp }
explanation:
  correct:
    en: |
      Calculation items written with SELECTEDMEASURE() apply MTD, QTD and YTD to every explicit measure. A dynamic format string for a measure changes the format of that one measure only, for example from Currency[FormatString]. A dynamic format string set on the YOY% calculation item overrides the format of whatever measure the item is applied to. A field parameter lets readers pick the columns used on the rows of the matrix.
    fr: |
      Des éléments de calcul écrits avec SELECTEDMEASURE() appliquent MTD, QTD et YTD à chaque mesure explicite. Une chaîne de format dynamique pour une mesure ne change le format que de cette mesure, par exemple à partir de Currency[FormatString]. Une chaîne de format dynamique définie sur l'élément de calcul YOY% remplace le format de la mesure à laquelle l'élément est appliqué. Un paramètre de champ permet aux lecteurs de choisir les colonnes utilisées en lignes de la matrice.
  options:
    cc:
      en: |
        A calculated column is computed at refresh for each row; it cannot change formats or fields at query time.
      fr: |
        Une colonne calculée est calculée lors de l'actualisation pour chaque ligne ; elle ne peut pas changer de format ni de champ au moment de la requête.
references:
  - title: Create calculation groups in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/calculation-groups
  - title: Create dynamic format strings for measures
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-dynamic-format-strings
