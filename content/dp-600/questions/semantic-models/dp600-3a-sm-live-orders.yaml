id: dp600-3a-sm-live-orders
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are creating a Power BI semantic model for a dispatch dashboard. The data is in an Azure SQL database named **OrdersDB**. An order-processing application updates the **OrderStatus** table every few seconds. The data isn't copied to Fabric.

    Dispatchers must see status changes as soon as they open or interact with a report page, without waiting for a scheduled refresh.

    Which storage mode should you use for the OrderStatus table?
  fr: |
    Vous créez un modèle sémantique Power BI pour un tableau de bord de répartition. Les données se trouvent dans une base de données Azure SQL nommée **OrdersDB**. Une application de traitement des commandes met à jour la table **OrderStatus** à quelques secondes d'intervalle. Les données ne sont pas copiées dans Fabric.

    Les répartiteurs doivent voir les changements de statut dès qu'ils ouvrent une page de rapport ou interagissent avec elle, sans attendre une actualisation planifiée.

    Quel mode de stockage devez-vous utiliser pour la table OrderStatus ?
body:
  options:
    - { id: a, text: Import }
    - { id: b, text: DirectQuery }
    - { id: c, text: Direct Lake }
    - { id: d, text: { en: "Dual", fr: "Double (Dual)" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In DirectQuery mode, no data is stored in the model. Each visual sends queries, translated from DAX into SQL, to OrdersDB when it loads, so dispatchers see the current status without a refresh.
    fr: |
      En mode DirectQuery, aucune donnée n'est stockée dans le modèle. Chaque visuel envoie à OrdersDB, au moment où il se charge, des requêtes traduites de DAX en SQL ; les répartiteurs voient donc le statut actuel sans actualisation.
  options:
    a: { en: "Import stores a snapshot of the table; changes appear only after the next refresh.", fr: "Import stocke un instantané de la table ; les changements n'apparaissent qu'après l'actualisation suivante." }
    c: { en: "Direct Lake reads Delta tables in OneLake; OrderStatus stays in Azure SQL Database and isn't copied to Fabric.", fr: "Direct Lake lit des tables Delta dans OneLake ; OrderStatus reste dans Azure SQL Database et n'est pas copiée dans Fabric." }
    d: { en: "A Dual table returns cached data whenever the cache can answer the query, so it can show a stale status.", fr: "Une table en mode Double renvoie les données du cache chaque fois que le cache peut répondre à la requête ; elle peut donc afficher un statut périmé." }
references:
  - title: Table storage mode in Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-storage-mode
  - title: DirectQuery in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-directquery-about
