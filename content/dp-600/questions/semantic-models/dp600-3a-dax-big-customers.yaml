id: dp600-3a-dax-big-customers
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model in which **Customer** has a one-to-many relationship with **Sales**. The measure **Total Sales** is defined as `SUM(Sales[SalesAmount])`.

    You need a measure that a visual grouped by Store[Region] can use to return the sales of the customers whose total sales in the current filter context exceed 10,000.

    Which two DAX expressions return the correct result? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique dans lequel **Customer** a une relation un-à-plusieurs avec **Sales**. La mesure **Total Sales** est définie par `SUM(Sales[SalesAmount])`.

    Vous avez besoin d'une mesure qu'un visuel regroupé par Store[Region] peut utiliser pour renvoyer les ventes des clients dont le total des ventes dans le contexte de filtre actuel dépasse 10 000.

    Quelles sont les deux expressions DAX qui renvoient le bon résultat ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "CALCULATE ( [Total Sales], FILTER ( VALUES ( Customer[CustomerKey] ), [Total Sales] > 10000 ) )" }
    - { id: b, text: "CALCULATE ( [Total Sales], [Total Sales] > 10000 )" }
    - { id: c, text: "SUMX ( FILTER ( VALUES ( Customer[CustomerKey] ), [Total Sales] > 10000 ), [Total Sales] )" }
    - { id: d, text: "CALCULATE ( [Total Sales], Sales[SalesAmount] > 10000 )" }
    - { id: e, text: "SUMX ( VALUES ( Customer[CustomerKey] ), IF ( SUM ( Sales[SalesAmount] ) > 10000, SUM ( Sales[SalesAmount] ) ) )" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      FILTER iterates the customers of the current context and evaluates Total Sales for each one; because Total Sales is a measure, a context transition computes each customer's own total. The filtered customer list can be passed to CALCULATE as a filter, or iterated by SUMX that calls the measure again for each kept customer.
    fr: |
      FILTER parcourt les clients du contexte actuel et évalue Total Sales pour chacun ; comme Total Sales est une mesure, une transition de contexte calcule le total propre à chaque client. La liste filtrée des clients peut être passée à CALCULATE comme filtre, ou parcourue par SUMX qui rappelle la mesure pour chaque client conservé.
  options:
    b: { en: "A Boolean filter argument can't reference a measure; use FILTER when the condition depends on a measure.", fr: "Un argument de filtre booléen ne peut pas référencer une mesure ; utilisez FILTER quand la condition dépend d'une mesure." }
    d: { en: "This keeps the sales lines above 10,000, not the customers whose total exceeds 10,000.", fr: "Cette expression conserve les lignes de vente supérieures à 10 000, pas les clients dont le total dépasse 10 000." }
    e: { en: "Without CALCULATE or a measure reference, SUM isn't evaluated per customer: each iteration returns the total of all the customers in the context.", fr: "Sans CALCULATE ni référence à une mesure, SUM n'est pas évalué par client : chaque itération renvoie le total de tous les clients du contexte." }
references:
  - title: Avoid using FILTER as a filter argument in DAX
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-avoid-avoid-filter-as-filter-argument
