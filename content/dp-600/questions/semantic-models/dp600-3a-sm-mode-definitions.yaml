id: dp600-3a-sm-mode-definitions
objective: "3.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are documenting the storage modes available for the tables of the semantic models at Tailspin Toys.

    Which storage mode matches each description? To answer, drag the appropriate storage modes to the correct descriptions. Each storage mode may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous documentez les modes de stockage disponibles pour les tables des modèles sémantiques de Tailspin Toys.

    Quel mode de stockage correspond à chaque description ? Pour répondre, faites glisser les modes de stockage appropriés vers les descriptions correspondantes. Chaque mode de stockage peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: import, text: Import }
    - { id: dq, text: DirectQuery }
    - { id: dl, text: Direct Lake }
    - { id: dual, text: { en: "Dual", fr: "Double (Dual)" } }
    - { id: hybrid, text: { en: "Hybrid", fr: "Hybride" } }
  targets:
    - { id: t1, text: { en: "A refresh copies only metadata that points to the latest versions of Delta tables in OneLake.", fr: "Une actualisation ne copie que des métadonnées qui pointent vers les dernières versions de tables Delta dans OneLake." } }
    - { id: t2, text: { en: "Each visual sends queries translated from DAX into the native language of the source.", fr: "Chaque visuel envoie des requêtes traduites de DAX dans le langage natif de la source." } }
    - { id: t3, text: { en: "The table is answered from the cache or from the source, depending on the query.", fr: "La table est servie depuis le cache ou depuis la source, selon la requête." } }
    - { id: t4, text: { en: "A snapshot of the data is stored, and a refresh is needed to see changes in the source.", fr: "Un instantané des données est stocké, et une actualisation est nécessaire pour voir les changements de la source." } }
answer:
  mapping: { t1: dl, t2: dq, t3: dual, t4: import }
explanation:
  correct:
    en: |
      Direct Lake refresh (framing) is a metadata operation on Delta tables. DirectQuery translates DAX into the source's language, such as SQL, at query time. Dual acts as Import or DirectQuery depending on the query. Import stores a snapshot that must be refreshed. A hybrid table is an Import table with incremental refresh whose latest partition is in DirectQuery mode, which matches none of the descriptions.
    fr: |
      L'actualisation Direct Lake (cadrage) est une opération sur les métadonnées des tables Delta. DirectQuery traduit DAX dans le langage de la source, par exemple SQL, au moment de la requête. Le mode Double agit comme Import ou DirectQuery selon la requête. Import stocke un instantané qui doit être actualisé. Une table hybride est une table Import avec actualisation incrémentielle dont la partition la plus récente est en DirectQuery, ce qui ne correspond à aucune description.
references:
  - title: Table storage mode in Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-storage-mode
