id: dp600-3c-iferror-margin
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model that contains a measure named [Profit] and a measure named [Sales]. A measure named Profit Margin is defined as `IFERROR ( [Profit] / [Sales], BLANK () )`.

    Performance analyzer shows that visuals that use Profit Margin are slow. You need to rewrite Profit Margin to improve query performance. The measure must return the same results as the current expression.

    Which expression should you use?
  fr: |
    Vous disposez d'un modèle sémantique qui contient une mesure nommée [Profit] et une mesure nommée [Sales]. Une mesure nommée Profit Margin est définie ainsi : `IFERROR ( [Profit] / [Sales], BLANK () )`.

    L'Analyseur de performances montre que les visuels qui utilisent Profit Margin sont lents. Vous devez réécrire Profit Margin pour améliorer les performances des requêtes. La mesure doit renvoyer les mêmes résultats que l'expression actuelle.

    Quelle expression devez-vous utiliser ?
body:
  options:
    - id: a
      text: |-
        DIVIDE ( [Profit], [Sales], 0 )
    - id: b
      text: |-
        IF ( ISERROR ( [Profit] / [Sales] ), BLANK (), [Profit] / [Sales] )
    - id: c
      text: |-
        [Profit] / [Sales]
    - id: d
      text: |-
        DIVIDE ( [Profit], [Sales] )
answer:
  optionId: d
explanation:
  correct:
    en: "IFERROR and ISERROR increase the number of storage engine scans. DIVIDE is optimized to test the denominator and returns BLANK when the denominator is zero or BLANK, which is the result that the current expression returns, with better performance."
    fr: "IFERROR et ISERROR augmentent le nombre d'analyses du moteur de stockage. DIVIDE est optimisé pour tester le dénominateur et renvoie BLANK quand le dénominateur vaut zéro ou BLANK, ce qui correspond au résultat de l'expression actuelle, avec de meilleures performances."
  options:
    a: { en: "The alternate result 0 replaces BLANK with 0, which changes the results and makes the measure dense.", fr: "Le résultat de remplacement 0 remplace BLANK par 0 : les résultats changent et la mesure devient dense." }
    b: { en: "IF with ISERROR has the same performance problem as IFERROR and evaluates the division twice.", fr: "IF avec ISERROR présente le même problème de performances que IFERROR et évalue la division deux fois." }
    c: { en: "The divide operator doesn't handle a zero denominator, so it can return infinity instead of BLANK.", fr: "L'opérateur de division ne gère pas un dénominateur nul : il peut renvoyer l'infini au lieu de BLANK." }
references:
  - title: Appropriate use of error functions
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-error-functions
  - title: DIVIDE function vs. divide operator (/)
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-divide-function-operator
