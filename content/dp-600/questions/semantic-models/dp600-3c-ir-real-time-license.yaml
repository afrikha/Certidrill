id: dp600-3c-ir-real-time-license
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a semantic model named OrdersModel in a workspace that uses the Pro license mode. The FactOrders table has an incremental refresh policy that keeps three years of history and refreshes the last two days. OrdersModel is refreshed once a day.

    Users need to see the orders inserted since the last refresh without increasing the number of scheduled refreshes.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique nommé OrdersModel dans un espace de travail qui utilise le mode de licence Pro. La table FactOrders possède une stratégie d'actualisation incrémentielle qui conserve trois ans d'historique et actualise les deux derniers jours. OrdersModel est actualisé une fois par jour.

    Les utilisateurs doivent voir les commandes insérées depuis la dernière actualisation, sans augmenter le nombre d'actualisations planifiées.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Turn on **Get the latest data in real time with DirectQuery**, and republish OrdersModel to the same workspace."
        fr: "Activer **Get the latest data in real time with DirectQuery**, et republier OrdersModel dans le même espace de travail."
    - id: b
      text:
        en: "Turn on **Detect data changes** and select an audit column of FactOrders."
        fr: "Activer **Detect data changes** et sélectionner une colonne d'audit de FactOrders."
    - id: c
      text:
        en: "Change the refresh period of the policy from two days to one day."
        fr: "Ramener la période d'actualisation de la stratégie de deux jours à un jour."
    - id: d
      text:
        en: "Turn on **Get the latest data in real time with DirectQuery**, and publish OrdersModel to a workspace that uses the Premium Per User license mode."
        fr: "Activer **Get the latest data in real time with DirectQuery**, et publier OrdersModel dans un espace de travail qui utilise le mode de licence Premium par utilisateur."
answer:
  optionId: d
explanation:
  correct:
    en: "The real-time option adds a DirectQuery partition after the refresh period, so queries return the rows inserted since the last refresh. Incremental refresh works with Pro, but real-time data with DirectQuery requires Premium, Premium Per User or Power BI Embedded, and such a model can't be published to a workspace that isn't Premium."
    fr: "L'option en temps réel ajoute une partition DirectQuery après la période d'actualisation : les requêtes renvoient les lignes insérées depuis la dernière actualisation. L'actualisation incrémentielle fonctionne avec Pro, mais les données en temps réel avec DirectQuery exigent Premium, Premium par utilisateur ou Power BI Embedded, et un tel modèle ne peut pas être publié dans un espace de travail non Premium."
  options:
    a: { en: "A model with a real-time DirectQuery partition can't be published to a Pro workspace.", fr: "Un modèle doté d'une partition DirectQuery en temps réel ne peut pas être publié dans un espace de travail Pro." }
    b: { en: "Detect data changes reduces what each refresh reloads; it doesn't show data inserted after the last refresh.", fr: "Detect data changes réduit ce que recharge chaque actualisation ; il n'affiche pas les données insérées après la dernière actualisation." }
    c: { en: "A shorter refresh period doesn't make the data newer than the last refresh.", fr: "Une période d'actualisation plus courte ne rend pas les données plus récentes que la dernière actualisation." }
references:
  - title: Configure incremental refresh and real-time data for Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-overview
