id: dp600-3b-comp-dq-semantic
objective: "3.1.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You connect Power BI Desktop live to a published semantic model named **SalesModel**, select **Make changes to this model**, and import a table of exchange rates. You save the result as a model named **SalesFX**. You have the Build permission on SalesModel.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous connectez Power BI Desktop en direct à un modèle sémantique publié nommé **SalesModel**, sélectionnez **Apporter des modifications à ce modèle** et importez une table de taux de change. Vous enregistrez le résultat dans un modèle nommé **SalesFX**. Vous avez l'autorisation Build sur SalesModel.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          In SalesFX, you can change the data type of a column that comes from SalesModel.
        fr: |
          Dans SalesFX, vous pouvez changer le type de données d'une colonne provenant de SalesModel.
    - id: s2
      text:
        en: |
          In SalesFX, you can add a calculated column to a table that comes from SalesModel.
        fr: |
          Dans SalesFX, vous pouvez ajouter une colonne calculée à une table provenant de SalesModel.
    - id: s3
      text:
        en: |
          In SalesFX, you can edit the relationships between the tables that come from SalesModel.
        fr: |
          Dans SalesFX, vous pouvez modifier les relations entre les tables provenant de SalesModel.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The tables of SalesModel become remote DirectQuery tables in SalesFX. You can extend them, for example with new columns or measures, but you cannot change the data type of their columns (change it at the source or use a calculated column), and you cannot create, edit or delete relationships inside the same remote source; those changes must be made in SalesModel.
    fr: |
      Les tables de SalesModel deviennent des tables DirectQuery distantes dans SalesFX. Vous pouvez les enrichir, par exemple avec de nouvelles colonnes ou mesures, mais vous ne pouvez pas changer le type de données de leurs colonnes (changez-le à la source ou utilisez une colonne calculée), ni créer, modifier ou supprimer des relations à l'intérieur de la même source distante ; ces changements doivent être faits dans SalesModel.
references:
  - title: Use composite models in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-composite-models
