id: dp600-3c-behavior-uses
objective: "3.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have two copies of a Direct Lake on SQL analytics endpoint semantic model: SalesModel_Test, used by the development team, and SalesModel, used by business users.

    You need to configure the **Direct Lake behavior** property of each model to meet the requirements in the answer area.

    Which value should you use for each model? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de deux copies d'un modèle sémantique Direct Lake sur le point de terminaison d'analytique SQL : SalesModel_Test, utilisé par l'équipe de développement, et SalesModel, utilisé par les utilisateurs métier.

    Vous devez configurer la propriété **Direct Lake behavior** de chaque modèle pour satisfaire les exigences de la zone de réponse.

    Quelle valeur devez-vous utiliser pour chaque modèle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      SalesModel_Test must let the team measure the performance that reports would get if every query ran in DirectQuery mode: [[test]]

      SalesModel must use Direct Lake mode whenever possible and keep answering every query, even when a table can't be loaded in Direct Lake mode: [[prod]]
    fr: |
      SalesModel_Test doit permettre à l'équipe de mesurer les performances qu'obtiendraient les rapports si chaque requête s'exécutait en mode DirectQuery : [[test]]

      SalesModel doit utiliser le mode Direct Lake dès que possible et continuer à répondre à chaque requête, même quand une table ne peut pas être chargée en mode Direct Lake : [[prod]]
  slots:
    - id: test
      options:
        - { id: auto, text: Automatic }
        - { id: dlonly, text: DirectLakeOnly }
        - { id: dqonly, text: DirectQueryOnly }
    - id: prod
      options:
        - { id: auto, text: Automatic }
        - { id: dlonly, text: DirectLakeOnly }
        - { id: dqonly, text: DirectQueryOnly }
answer:
  values: { test: dqonly, prod: auto }
explanation:
  correct:
    en: "DirectQueryOnly sends every query to the SQL analytics endpoint, which lets developers measure fallback performance. Automatic, the default, falls back to DirectQuery silently when a table can't be loaded in Direct Lake, so production queries keep returning results."
    fr: "DirectQueryOnly envoie chaque requête au point de terminaison d'analytique SQL, ce qui permet aux développeurs de mesurer les performances en basculement. Automatic, la valeur par défaut, bascule silencieusement en DirectQuery quand une table ne peut pas être chargée en Direct Lake : les requêtes de production continuent de renvoyer des résultats."
  options:
    dqonly: { en: "For SalesModel, DirectQueryOnly answers every query but never uses Direct Lake mode.", fr: "Pour SalesModel, DirectQueryOnly répond à chaque requête mais n'utilise jamais le mode Direct Lake." }
    dlonly: { en: "DirectLakeOnly makes queries fail with an error when Direct Lake isn't possible; it helps find fallback causes, but it doesn't keep answering queries or measure DirectQuery performance.", fr: "DirectLakeOnly fait échouer les requêtes avec une erreur quand Direct Lake n'est pas possible ; il aide à trouver les causes de basculement, mais ne permet ni de continuer à répondre aux requêtes ni de mesurer les performances DirectQuery." }
references:
  - title: How Direct Lake works
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works
