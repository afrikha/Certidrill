id: dp600-3b-lsm-limits
objective: "3.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS1** that is assigned to an F64 capacity in the West Europe region. You turn on the large semantic model storage format for an Import semantic model named **Model1** in WS1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS1** qui est attribué à une capacité F64 de la région West Europe. Vous activez le format de stockage de modèle sémantique volumineux pour un modèle sémantique Import nommé **Model1** dans WS1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Model1 can grow larger than the memory available to a semantic model on the F64 capacity.
        fr: |
          Model1 peut devenir plus volumineux que la mémoire disponible pour un modèle sémantique sur la capacité F64.
    - id: s2
      text:
        en: |
          You can later assign WS1 to a capacity in the North Europe region.
        fr: |
          Vous pouvez ultérieurement attribuer WS1 à une capacité de la région North Europe.
    - id: s3
      text:
        en: |
          When Model1 is used again after an eviction, only the data pages needed by the queries are loaded into memory.
        fr: |
          Quand Model1 est de nouveau utilisé après une éviction, seules les pages de données nécessaires aux requêtes sont chargées en mémoire.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      The large format removes the default size limit, but a single model is still limited by the memory of the SKU or by the maximum set by the capacity administrator. Once a large model exists in a workspace, the workspace must stay in its region and cannot move to a capacity in another region. On-demand load, enabled by default for large models, loads only the needed data pages, so an evicted model is available for queries sooner.
    fr: |
      Le format volumineux supprime la limite de taille par défaut, mais un modèle reste limité par la mémoire de la référence SKU ou par le maximum fixé par l'administrateur de capacité. Dès qu'un modèle volumineux existe dans un espace de travail, celui-ci doit rester dans sa région et ne peut pas passer sur une capacité d'une autre région. Le chargement à la demande, activé par défaut pour les modèles volumineux, ne charge que les pages de données nécessaires : un modèle évincé est donc disponible plus tôt pour les requêtes.
references:
  - title: Large semantic models in Power BI Premium
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/service-premium-large-models
