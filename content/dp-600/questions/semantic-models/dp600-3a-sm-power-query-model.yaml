id: dp600-3a-sm-power-query-model
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace on an F64 capacity that contains a lakehouse named **Lakehouse1**. Lakehouse1 contains a Delta table named **Customers** that has two million rows and is updated weekly.

    Business analysts are building a semantic model that uses Customers. Inside the semantic model, they must use Power Query to merge Customers with a region mapping workbook stored in SharePoint Online and to split the address column. The analysts can't change the lakehouse or its notebooks. Visuals must respond as fast as possible.

    Which storage mode should you use for the Customers table?
  fr: |
    Vous disposez d'un espace de travail Fabric sur une capacité F64 qui contient un lakehouse nommé **Lakehouse1**. Lakehouse1 contient une table Delta nommée **Customers** qui compte deux millions de lignes et est mise à jour chaque semaine.

    Des analystes métier créent un modèle sémantique qui utilise Customers. Dans le modèle sémantique, ils doivent utiliser Power Query pour fusionner Customers avec un classeur de correspondance des régions stocké dans SharePoint Online et pour fractionner la colonne d'adresse. Les analystes ne peuvent pas modifier le lakehouse ni ses notebooks. Les visuels doivent répondre le plus vite possible.

    Quel mode de stockage devez-vous utiliser pour la table Customers ?
body:
  options:
    - { id: a, text: { en: "Direct Lake on OneLake", fr: "Direct Lake sur OneLake" } }
    - { id: b, text: { en: "Direct Lake on SQL", fr: "Direct Lake sur SQL" } }
    - { id: c, text: Import }
    - { id: d, text: DirectQuery }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Import is the mode for analysts who must prepare data with Power Query inside the model, and it serves visuals from memory. Direct Lake tables read the Delta tables as they are, so data preparation must happen upstream in Fabric, which the analysts can't change.
    fr: |
      Import est le mode adapté aux analystes qui doivent préparer les données avec Power Query dans le modèle, et il sert les visuels depuis la mémoire. Les tables Direct Lake lisent les tables Delta telles quelles : la préparation des données doit se faire en amont dans Fabric, ce que les analystes ne peuvent pas modifier.
  options:
    a: { en: "Direct Lake on OneLake doesn't run Power Query transformations on the table; preparation must happen upstream.", fr: "Direct Lake sur OneLake n'exécute pas de transformations Power Query sur la table ; la préparation doit se faire en amont." }
    b: { en: "Direct Lake on SQL also reads the Delta table as it is, without Power Query steps.", fr: "Direct Lake sur SQL lit aussi la table Delta telle quelle, sans étapes Power Query." }
    d: { en: "In DirectQuery, Power Query steps must fold into a single native query; a merge with a SharePoint workbook can't fold, and visuals would be slower.", fr: "En DirectQuery, les étapes Power Query doivent se replier en une seule requête native ; une fusion avec un classeur SharePoint ne peut pas se replier, et les visuels seraient plus lents." }
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
  - title: DirectQuery in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-directquery-about
