id: dp600-3a-sm-pro-workspace
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's finance team publishes semantic models to a workspace named **FinanceWS** that uses the Power BI Pro license mode and isn't assigned to a Fabric capacity.

    You are creating a semantic model in FinanceWS. It reads four tables from the SQL analytics endpoint of **Lakehouse1**, which is in another workspace on a Fabric capacity. The tables contain about three million rows in total and are updated once each night. Report visuals must respond as fast as possible.

    Which storage mode should you use?
  fr: |
    L'équipe financière de Fabrikam publie des modèles sémantiques dans un espace de travail nommé **FinanceWS** qui utilise le mode de licence Power BI Pro et n'est pas affecté à une capacité Fabric.

    Vous créez un modèle sémantique dans FinanceWS. Il lit quatre tables à partir du point de terminaison d'analytique SQL de **Lakehouse1**, qui se trouve dans un autre espace de travail sur une capacité Fabric. Les tables contiennent environ trois millions de lignes au total et sont mises à jour une fois par nuit. Les visuels des rapports doivent répondre le plus vite possible.

    Quel mode de stockage devez-vous utiliser ?
body:
  options:
    - { id: a, text: Import }
    - { id: b, text: DirectQuery }
    - { id: c, text: { en: "Direct Lake on OneLake", fr: "Direct Lake sur OneLake" } }
    - { id: d, text: { en: "Direct Lake on SQL", fr: "Direct Lake sur SQL" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Import works with any Fabric or Power BI license. A small model refreshed nightly is served from the in-memory cache, which gives the fastest visuals. Both Direct Lake variants are available only for models on a Fabric capacity.
    fr: |
      Import fonctionne avec toutes les licences Fabric ou Power BI. Un petit modèle actualisé chaque nuit est servi depuis le cache en mémoire, ce qui donne les visuels les plus rapides. Les deux variantes de Direct Lake ne sont disponibles que pour les modèles sur une capacité Fabric.
  options:
    b: { en: "DirectQuery is supported, but every visual queries the SQL analytics endpoint, which is slower than an in-memory model.", fr: "DirectQuery est pris en charge, mais chaque visuel interroge le point de terminaison d'analytique SQL, ce qui est plus lent qu'un modèle en mémoire." }
    c: { en: "Direct Lake on OneLake requires a Fabric capacity; FinanceWS uses Pro licensing.", fr: "Direct Lake sur OneLake exige une capacité Fabric ; FinanceWS utilise des licences Pro." }
    d: { en: "Direct Lake on SQL also requires a Fabric capacity.", fr: "Direct Lake sur SQL exige aussi une capacité Fabric." }
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
