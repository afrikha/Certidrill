id: dp600-3c-ir-bootstrap
objective: "3.2.5"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have a semantic model named TelemetryModel in Power BI Desktop. The FactTelemetry table has an incremental refresh policy that archives 10 years of data. TelemetryModel will be published to a workspace on a Fabric capacity, and the XMLA endpoint is enabled for read-write. In a test, the first refresh of TelemetryModel in the Power BI service exceeded the refresh time limit.

    You need to load the full history without exceeding the time limit and without changing the policy.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un modèle sémantique nommé TelemetryModel dans Power BI Desktop. La table FactTelemetry possède une stratégie d'actualisation incrémentielle qui archive 10 ans de données. TelemetryModel sera publié dans un espace de travail sur une capacité Fabric, et le point de terminaison XMLA est activé en lecture-écriture. Lors d'un test, la première actualisation de TelemetryModel dans le service Power BI a dépassé la durée maximale d'actualisation.

    Vous devez charger tout l'historique sans dépasser la durée maximale et sans modifier la stratégie.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: publish
      text:
        en: "Publish TelemetryModel from Power BI Desktop to the workspace."
        fr: "Publier TelemetryModel depuis Power BI Desktop dans l'espace de travail."
    - id: apply
      text:
        en: "Connect to TelemetryModel through the XMLA endpoint by using Tabular Editor, and run **Apply Refresh Policy** on FactTelemetry."
        fr: "Se connecter à TelemetryModel via le point de terminaison XMLA avec Tabular Editor, et exécuter **Apply Refresh Policy** sur FactTelemetry."
    - id: process
      text:
        en: "In SQL Server Management Studio (SSMS), process the partitions of FactTelemetry in batches."
        fr: "Dans SQL Server Management Studio (SSMS), traiter les partitions de FactTelemetry par lots."
    - id: ondemand
      text:
        en: "Run an on-demand refresh of TelemetryModel in the Power BI service."
        fr: "Lancer une actualisation à la demande de TelemetryModel dans le service Power BI."
    - id: download
      text:
        en: "Download TelemetryModel from the service as a .pbix file."
        fr: "Télécharger TelemetryModel depuis le service sous forme de fichier .pbix."
    - id: complete
      text:
        en: "Turn on **Only refresh complete days** in the policy."
        fr: "Activer **Only refresh complete days** dans la stratégie."
answer:
  sequence: [ publish, apply, process ]
explanation:
  correct:
    en: |
      Bootstrapping avoids one long initial refresh. After publishing, Apply Refresh Policy run through the XMLA endpoint creates the partitions defined by the policy without loading data. You then process the partitions individually, sequentially or in batches from SSMS, and a refresh started through the XMLA endpoint isn't subject to the time limit of refreshes started in the service.
    fr: |
      L'amorçage évite une longue actualisation initiale unique. Après la publication, Apply Refresh Policy exécuté via le point de terminaison XMLA crée les partitions définies par la stratégie sans charger de données. Vous traitez ensuite les partitions individuellement, séquentiellement ou par lots depuis SSMS, et une actualisation lancée via le point de terminaison XMLA n'est pas soumise à la durée maximale des actualisations lancées dans le service.
  options:
    ondemand: { en: "A refresh started in the service loads the whole history in one operation and hits the time limit again.", fr: "Une actualisation lancée dans le service charge tout l'historique en une seule opération et atteint de nouveau la durée maximale." }
    download: { en: "A model with incremental refresh can't be downloaded back as a .pbix file.", fr: "Un modèle doté de l'actualisation incrémentielle ne peut pas être retéléchargé sous forme de fichier .pbix." }
    complete: { en: "This setting changes the policy and doesn't reduce the size of the initial load.", fr: "Ce paramètre modifie la stratégie et ne réduit pas la taille du chargement initial." }
references:
  - title: Advanced incremental refresh and real-time data with the XMLA endpoint
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-xmla
  - title: Configure incremental refresh and real-time data for Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-overview
