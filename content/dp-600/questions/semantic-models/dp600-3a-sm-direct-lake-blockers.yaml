id: dp600-3a-sm-direct-lake-blockers
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace on an F64 capacity that contains a lakehouse named **Lakehouse1** and a warehouse named **Warehouse1**. You plan to create a semantic model that uses Direct Lake on OneLake tables based on Delta tables from both items. **FactSales** contains 800 million rows.

    The project team lists several requirements for the model.

    Which two requirements prevent the use of Direct Lake tables?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric sur une capacité F64 qui contient un lakehouse nommé **Lakehouse1** et un entrepôt nommé **Warehouse1**. Vous prévoyez de créer un modèle sémantique dont les tables Direct Lake sur OneLake reposent sur des tables Delta des deux éléments. **FactSales** contient 800 millions de lignes.

    L'équipe projet énumère plusieurs exigences pour le modèle.

    Quelles sont les deux exigences qui empêchent d'utiliser des tables Direct Lake ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The tables must be reshaped with Power Query steps defined in the semantic model.", fr: "Les tables doivent être remaniées par des étapes Power Query définies dans le modèle sémantique." } }
    - { id: b, text: { en: "Each author must be able to publish a copy of the model to their own My workspace.", fr: "Chaque auteur doit pouvoir publier une copie du modèle dans son propre Mon espace de travail." } }
    - { id: c, text: { en: "The model must combine tables from Lakehouse1 and Warehouse1.", fr: "Le modèle doit combiner des tables de Lakehouse1 et de Warehouse1." } }
    - { id: d, text: { en: "Reports must show new rows a few minutes after each load.", fr: "Les rapports doivent afficher les nouvelles lignes quelques minutes après chaque chargement." } }
    - { id: e, text: { en: "FactSales must be available in the model with all its rows.", fr: "FactSales doit être disponible dans le modèle avec toutes ses lignes." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Direct Lake tables read the Delta tables as they are, so data preparation must happen upstream (Spark, T-SQL, dataflows, pipelines), not with Power Query in the model. Direct Lake tables also can't be used in personal workspaces (My workspace).
    fr: |
      Les tables Direct Lake lisent les tables Delta telles quelles ; la préparation des données doit donc se faire en amont (Spark, T-SQL, flux de données, pipelines), et non avec Power Query dans le modèle. Les tables Direct Lake ne peuvent pas non plus être utilisées dans les espaces de travail personnels (Mon espace de travail).
  options:
    c: { en: "Direct Lake on OneLake can use tables from several Fabric items.", fr: "Direct Lake sur OneLake peut utiliser des tables de plusieurs éléments Fabric." }
    d: { en: "Direct Lake reduces latency with automatic updates or reframing, which takes seconds.", fr: "Direct Lake réduit la latence grâce aux mises à jour automatiques ou au recadrage, qui prend quelques secondes." }
    e: { en: "800 million rows is below the F64 guardrail of 1.5 billion rows per table.", fr: "800 millions de lignes restent sous le garde-fou F64 de 1,5 milliard de lignes par table." }
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
