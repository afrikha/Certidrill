id: dp600-3c-ir-partitions
objective: "3.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You publish a semantic model named OrdersModel to a workspace that uses the Premium Per User license mode. The FactOrders table of OrdersModel has an incremental refresh policy that archives three years of data and incrementally refreshes the last 10 days. A scheduled refresh runs every day.

    You are explaining to the operations team how the partitions of FactOrders are managed over time.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous publiez un modèle sémantique nommé OrdersModel dans un espace de travail qui utilise le mode de licence Premium par utilisateur. La table FactOrders d'OrdersModel possède une stratégie d'actualisation incrémentielle qui archive trois ans de données et actualise de façon incrémentielle les 10 derniers jours. Une actualisation planifiée s'exécute chaque jour.

    Vous expliquez à l'équipe d'exploitation comment les partitions de FactOrders sont gérées au fil du temps.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "For each partition, the service overrides the values of RangeStart and RangeEnd that were set in Power BI Desktop."
        fr: "Pour chaque partition, le service remplace les valeurs de RangeStart et RangeEnd définies dans Power BI Desktop."
    - id: b
      text:
        en: "The partitions are listed on the semantic model settings page of the Power BI service, where you can refresh them one by one."
        fr: "Les partitions sont listées sur la page des paramètres du modèle sémantique du service Power BI, où vous pouvez les actualiser une par une."
    - id: c
      text:
        en: "As the window rolls forward, day partitions are merged into a month partition once the month is complete."
        fr: "À mesure que la fenêtre avance, les partitions journalières sont fusionnées en une partition mensuelle une fois le mois terminé."
    - id: d
      text:
        en: "Partitions that become older than the archive period stay in the model but are no longer refreshed."
        fr: "Les partitions qui deviennent plus anciennes que la période d'archivage restent dans le modèle mais ne sont plus actualisées."
    - id: e
      text:
        en: "Each scheduled refresh reloads every historical partition and then the last 10 days."
        fr: "Chaque actualisation planifiée recharge toutes les partitions historiques, puis les 10 derniers jours."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "The parameter values set in Power BI Desktop only limit the data loaded during development; after publishing, the service sets RangeStart and RangeEnd for each partition. Partitions are managed with a rolling window: as periods close, finer partitions are merged into coarser ones, for example day partitions into a month partition."
    fr: "Les valeurs de paramètres définies dans Power BI Desktop ne limitent que les données chargées pendant le développement ; après la publication, le service définit RangeStart et RangeEnd pour chaque partition. Les partitions sont gérées selon une fenêtre glissante : à mesure que les périodes se terminent, les partitions plus fines sont fusionnées en partitions plus grossières, par exemple des partitions journalières en une partition mensuelle."
  options:
    b: { en: "Partitions aren't visible in the Power BI service; you view and refresh them individually through the XMLA endpoint, for example with SSMS.", fr: "Les partitions ne sont pas visibles dans le service Power BI ; vous les consultez et les actualisez individuellement via le point de terminaison XMLA, par exemple avec SSMS." }
    d: { en: "Partitions outside the archive period are removed from the model.", fr: "Les partitions situées hors de la période d'archivage sont supprimées du modèle." }
    e: { en: "Each refresh reloads only the refresh period; historical partitions aren't reloaded.", fr: "Chaque actualisation ne recharge que la période d'actualisation ; les partitions historiques ne sont pas rechargées." }
references:
  - title: Advanced incremental refresh and real-time data with the XMLA endpoint
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-xmla
  - title: Configure incremental refresh and real-time data for Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-overview
