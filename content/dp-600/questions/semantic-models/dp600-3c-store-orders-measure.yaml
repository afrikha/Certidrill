id: dp600-3c-store-orders-measure
objective: "3.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model that contains a table named Sales and a table named Store. Each row of Sales is an order line. The Sales[PromotionKey] column is blank for order lines that have no promotion.

    You need to create a measure that returns the store name followed by the number of order lines when exactly one store is in the filter context, and the text "Multiple" followed by the number of order lines otherwise. The solution must use the most efficient DAX functions.

    How should you complete the DAX expression? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique qui contient une table nommée Sales et une table nommée Store. Chaque ligne de Sales est une ligne de commande. La colonne Sales[PromotionKey] est vide pour les lignes de commande sans promotion.

    Vous devez créer une mesure qui renvoie le nom du magasin suivi du nombre de lignes de commande quand un seul magasin figure dans le contexte de filtre, et le texte « Multiple » suivi du nombre de lignes de commande sinon. La solution doit utiliser les fonctions DAX les plus efficaces.

    Comment devez-vous compléter l'expression DAX ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Store Order Lines =
    VAR _Store = [[store]]
    VAR _Lines = [[lines]]
    RETURN
        _Store & ": " & FORMAT ( _Lines, "#,0" )
  slots:
    - id: store
      options:
        - id: selected
          text: |-
            SELECTEDVALUE ( Store[StoreName], "Multiple" )
        - id: hasone
          text: |-
            IF ( HASONEVALUE ( Store[StoreName] ), VALUES ( Store[StoreName] ), "Multiple" )
        - id: values
          text: |-
            VALUES ( Store[StoreName] )
        - id: firstnb
          text: |-
            FIRSTNONBLANK ( Store[StoreName], 1 )
    - id: lines
      options:
        - id: countrows
          text: |-
            COUNTROWS ( Sales )
        - id: count
          text: |-
            COUNT ( Sales[PromotionKey] )
        - id: counta
          text: |-
            COUNTA ( Sales[PromotionKey] )
        - id: countblank
          text: |-
            COUNTBLANK ( Sales[PromotionKey] )
answer:
  values: { store: selected, lines: countrows }
explanation:
  correct:
    en: "SELECTEDVALUE returns the value of the column when the filter context contains exactly one value and the alternate result otherwise; it replaces the HASONEVALUE and VALUES pattern more efficiently. COUNTROWS counts the rows of the table, ignores blanks in its columns and is more efficient than counting the values of a column."
    fr: "SELECTEDVALUE renvoie la valeur de la colonne quand le contexte de filtre contient une seule valeur, et le résultat de remplacement sinon ; il remplace le modèle HASONEVALUE et VALUES de façon plus efficace. COUNTROWS compte les lignes de la table, ne tient pas compte des valeurs vides de ses colonnes et est plus efficace que le comptage des valeurs d'une colonne."
  options:
    hasone: { en: "This pattern returns the same result, but SELECTEDVALUE achieves it more efficiently.", fr: "Ce modèle renvoie le même résultat, mais SELECTEDVALUE l'obtient plus efficacement." }
    values: { en: "VALUES raises an error when several stores are in the filter context and never returns Multiple.", fr: "VALUES génère une erreur quand plusieurs magasins figurent dans le contexte de filtre et ne renvoie jamais Multiple." }
    firstnb: { en: "FIRSTNONBLANK returns a store name even when several stores are in the filter context.", fr: "FIRSTNONBLANK renvoie un nom de magasin même quand plusieurs magasins figurent dans le contexte de filtre." }
    count: { en: "COUNT ignores the blank PromotionKey values, so it misses the order lines without a promotion.", fr: "COUNT ignore les valeurs PromotionKey vides : il omet les lignes de commande sans promotion." }
    counta: { en: "COUNTA also skips the blank PromotionKey values.", fr: "COUNTA ignore lui aussi les valeurs PromotionKey vides." }
    countblank: { en: "COUNTBLANK counts only the order lines without a promotion.", fr: "COUNTBLANK ne compte que les lignes de commande sans promotion." }
references:
  - title: Use SELECTEDVALUE instead of VALUES in DAX
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-selectedvalue
  - title: Use COUNTROWS instead of COUNT in DAX
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-countrows
