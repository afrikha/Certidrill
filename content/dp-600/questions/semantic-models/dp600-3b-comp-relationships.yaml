id: dp600-3b-comp-relationships
objective: "3.1.7"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    You have a composite model that uses two Azure SQL databases, **SQL1** and **SQL2**, and an Excel workbook. The relationships of the model are shown in the following table. All the relationships are active, every foreign key column contains no null values, and foreign key constraints exist in the databases.

    Answer each prompt by selecting the appropriate relationship.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle composite qui utilise deux bases de données Azure SQL, **SQL1** et **SQL2**, et un classeur Excel. Les relations du modèle figurent dans le tableau suivant. Toutes les relations sont actives, aucune colonne de clé étrangère ne contient de valeur null, et des contraintes de clé étrangère existent dans les bases de données.

    Répondez à chaque consigne en sélectionnant la relation appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The relationship that is evaluated as a limited relationship", fr: "La relation évaluée comme une relation limitée" }
    - id: p2
      text: { en: "The relationship on which you can turn on Assume referential integrity", fr: "La relation sur laquelle vous pouvez activer Assume referential integrity" }
  grid:
    header: [{ en: "Relationship", fr: "Relation" }, { en: "Many side (mode, source)", fr: "Côté plusieurs (mode, source)" }, { en: "One side (mode, source)", fr: "Côté un (mode, source)" }, { en: "Cardinality", fr: "Cardinalité" }]
    rows:
      - [{ text: R1, area: r1 }, { text: "Sales (DirectQuery, SQL1)" }, { text: "Product (Dual, SQL1)" }, { text: { en: "Many-to-one", fr: "Plusieurs-à-un" } }]
      - [{ text: R2, area: r2 }, { text: "Sales (DirectQuery, SQL1)" }, { text: "Store (DirectQuery, SQL1)" }, { text: { en: "Many-to-one", fr: "Plusieurs-à-un" } }]
      - [{ text: R3, area: r3 }, { text: "Budget (Import, Excel)" }, { text: "Product (Dual, SQL1)" }, { text: { en: "Many-to-one", fr: "Plusieurs-à-un" } }]
      - [{ text: R4, area: r4 }, { text: "Inventory (DirectQuery, SQL2)" }, { text: "Product (Dual, SQL1)" }, { text: { en: "Many-to-one", fr: "Plusieurs-à-un" } }]
answer:
  values: { p1: r4, p2: r2 }
explanation:
  correct:
    en: |
      Inventory comes from SQL2 while Product belongs to SQL1 and to the Import cache, so R4 crosses source groups and is limited. R1 and R3 are regular: a Dual one side works both with DirectQuery tables of its source and with Import tables. Assume referential integrity requires both tables in DirectQuery mode in the same source group, which only R2 meets.
    fr: |
      Inventory provient de SQL2 alors que Product appartient à SQL1 et au cache Import : R4 traverse donc des groupes de sources et est limitée. R1 et R3 sont régulières : un côté un en mode Double fonctionne à la fois avec les tables DirectQuery de sa source et avec les tables Import. Assume referential integrity exige que les deux tables soient en mode DirectQuery dans le même groupe de sources, ce que seule R2 respecte.
references:
  - title: Model relationships in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-relationships-understand
  - title: Table storage mode in Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-storage-mode
