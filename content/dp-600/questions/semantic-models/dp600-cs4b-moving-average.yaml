id: dp600-cs4b-moving-average
objective: "3.1.4"
type: dropdown
caseStudy: dp600-cs4b-lamna-healthcare
difficulty: 3
status: draft
stem:
  en: |
    You are writing the Admissions 3M Avg measure. The solution must meet the third requirement for semantic models.

    How should you complete the DAX expression? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez la mesure Admissions 3M Avg. La solution doit satisfaire la troisième exigence relative aux modèles sémantiques.

    Comment devez-vous compléter l'expression DAX ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Admissions 3M Avg =
    [[iter]] (
        [[fn]] (
            [[from]], REL,
            0, REL,
            ALLSELECTED ( DimDate[YearMonth] ),
            ORDERBY ( DimDate[YearMonth], ASC )
        ),
        [Admissions]
    )
  slots:
    - id: iter
      options:
        - { id: sumx, text: SUMX }
        - { id: averagex, text: AVERAGEX }
        - { id: average, text: AVERAGE }
        - { id: countx, text: COUNTX }
    - id: fn
      options:
        - { id: offset, text: OFFSET }
        - { id: index, text: INDEX }
        - { id: topn, text: TOPN }
        - { id: window, text: WINDOW }
    - id: from
      options:
        - { id: m3, text: "-3" }
        - { id: m2, text: "-2" }
        - { id: zero, text: "0" }
        - { id: p2, text: "2" }
answer:
  values: { iter: averagex, fn: window, from: m2 }
explanation:
  correct:
    en: "`WINDOW` returns the rows between a start and an end position; with `-2, REL` and `0, REL` it returns the current month and the two previous months of the `ALLSELECTED` list, ordered by YearMonth, so only the months kept by the report filters and slicers are used. `AVERAGEX` then evaluates [Admissions] for each of these months and returns the average."
    fr: "`WINDOW` renvoie les lignes comprises entre une position de début et une position de fin ; avec `-2, REL` et `0, REL`, il renvoie le mois en cours et les deux mois précédents de la liste `ALLSELECTED`, triée par YearMonth : seuls les mois conservés par les filtres et les segments du rapport sont utilisés. `AVERAGEX` évalue ensuite [Admissions] pour chacun de ces mois et renvoie la moyenne."
  options:
    sumx: { en: "SUMX returns the total of the three months, not their average.", fr: "SUMX renvoie le total des trois mois, pas leur moyenne." }
    average: { en: "AVERAGE takes a single column; it cannot iterate a table and evaluate an expression for each row.", fr: "AVERAGE prend une seule colonne ; il ne peut pas itérer une table et évaluer une expression pour chaque ligne." }
    countx: { en: "COUNTX counts the rows for which the expression is not blank, here at most three.", fr: "COUNTX compte les lignes pour lesquelles l'expression n'est pas vide, ici trois au plus." }
    offset: { en: "OFFSET returns a single row at a given distance from the current row; it does not take a start and an end position.", fr: "OFFSET renvoie une seule ligne à une distance donnée de la ligne actuelle ; il ne prend pas de position de début et de fin." }
    index: { en: "INDEX returns a single row at an absolute position of the partition.", fr: "INDEX renvoie une seule ligne à une position absolue de la partition." }
    topn: { en: "TOPN returns the first N rows of a table by an order; it has no notion of a current row.", fr: "TOPN renvoie les N premières lignes d'une table selon un tri ; il n'a pas de notion de ligne actuelle." }
    m3: { en: "A start of -3 adds a fourth month to the window.", fr: "Un début à -3 ajoute un quatrième mois à la fenêtre." }
    zero: { en: "A start of 0 returns only the current month.", fr: "Un début à 0 ne renvoie que le mois en cours." }
    p2: { en: "A positive start is after the current row and after the end of the window, so the window looks forward instead of back.", fr: "Un début positif se situe après la ligne actuelle et après la fin de la fenêtre : la fenêtre regarde vers l'avant au lieu de l'arrière." }
references:
  - title: WINDOW function (DAX)
    url: https://learn.microsoft.com/en-us/dax/window-function-dax
