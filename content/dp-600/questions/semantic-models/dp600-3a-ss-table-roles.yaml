id: dp600-3a-ss-table-roles
objective: "3.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are reviewing the tables of a semantic model named **SalesModel** before you create its relationships.

    Which type of star schema table is each table? To answer, drag the appropriate table types to the correct tables. Each table type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez les tables d'un modèle sémantique nommé **SalesModel** avant de créer ses relations.

    Quel type de table de schéma en étoile est chaque table ? Pour répondre, faites glisser les types de tables appropriés vers les tables correspondantes. Chaque type de table peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dim, text: { en: "Dimension table", fr: "Table de dimension" } }
    - { id: fact, text: { en: "Fact table", fr: "Table de faits" } }
    - { id: bridge, text: { en: "Factless fact (bridging) table", fr: "Table de faits sans fait (table de pont)" } }
    - { id: junk, text: { en: "Junk dimension", fr: "Dimension fourre-tout (junk)" } }
    - { id: degen, text: { en: "Degenerate dimension", fr: "Dimension dégénérée" } }
  targets:
    - { id: product, text: { en: "Product: ProductKey (unique), Product, Color, Category", fr: "Product : ProductKey (unique), Product, Color, Category" } }
    - { id: salesline, text: { en: "SalesLine: DateKey, ProductKey, StoreKey, Quantity, Amount", fr: "SalesLine : DateKey, ProductKey, StoreKey, Quantity, Amount" } }
    - { id: spregion, text: { en: "SalespersonRegion: SalespersonKey, RegionKey (one row per assignment)", fr: "SalespersonRegion : SalespersonKey, RegionKey (une ligne par affectation)" } }
    - { id: flags, text: { en: "OrderFlags: FlagKey (unique), OrderStatus, PaymentType, DeliveryStatus (every combination of the three values)", fr: "OrderFlags : FlagKey (unique), OrderStatus, PaymentType, DeliveryStatus (toutes les combinaisons des trois valeurs)" } }
answer:
  mapping: { product: dim, salesline: fact, spregion: bridge, flags: junk }
explanation:
  correct:
    en: |
      Product has a unique key and descriptive columns, so it's a dimension. SalesLine holds dimension keys and numeric columns, so it's a fact table. SalespersonRegion has only keys and no measures, a factless fact table used as a bridge for a many-to-many relationship. OrderFlags is the Cartesian product of low-cardinality attributes with a surrogate key, a junk dimension. A degenerate dimension is an attribute kept in the fact table, such as an order number.
    fr: |
      Product a une clé unique et des colonnes descriptives : c'est une dimension. SalesLine contient des clés de dimension et des colonnes numériques : c'est une table de faits. SalespersonRegion ne contient que des clés et aucune mesure : c'est une table de faits sans fait utilisée comme pont pour une relation plusieurs-à-plusieurs. OrderFlags est le produit cartésien d'attributs de faible cardinalité avec une clé de substitution : c'est une dimension fourre-tout. Une dimension dégénérée est un attribut conservé dans la table de faits, comme un numéro de commande.
references:
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
