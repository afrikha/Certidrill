stem:
  en: You multiply the sum of Quantity by the sum of UnitPrice.
  fr: Vous multipliez la somme de Quantity par la somme de UnitPrice.
body:
  solution:
    en: |
      You create the following measure.

      ```dax
      Sales Amount =
      SUM ( Sales[Quantity] ) * SUM ( Sales[UnitPrice] )
      ```
    fr: |
      Vous créez la mesure suivante.

      ```dax
      Sales Amount =
      SUM ( Sales[Quantity] ) * SUM ( Sales[UnitPrice] )
      ```
answer: { value: false }
explanation:
  correct:
    en: The measure first aggregates each column over all the rows in the filter context and then multiplies the two totals. As soon as the context contains more than one order line, the product of the two totals is generally not equal to the sum of the line amounts.
    fr: "La mesure agrège d'abord chaque colonne sur toutes les lignes du contexte de filtre, puis multiplie les deux totaux. Dès que le contexte contient plus d'une ligne de commande, le produit des deux totaux n'est généralement pas égal à la somme des montants des lignes."
references:
  - title: SUMX function (DAX)
    url: https://learn.microsoft.com/en-us/dax/sumx-function-dax
