id: dp600-3c-flavor-requirements
objective: "3.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are documenting the Direct Lake options for the semantic models of your company. The models use lakehouses and warehouses in Fabric.

    Which Direct Lake option supports each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous documentez les options Direct Lake pour les modèles sémantiques de votre entreprise. Les modèles utilisent des lakehouses et des entrepôts dans Fabric.

    Quelle option Direct Lake prend en charge chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - id: onelake
      text:
        en: "Direct Lake on OneLake only"
        fr: "Direct Lake sur OneLake uniquement"
    - id: sql
      text:
        en: "Direct Lake on SQL analytics endpoint only"
        fr: "Direct Lake sur le point de terminaison d'analytique SQL uniquement"
    - id: both
      text:
        en: "Both options"
        fr: "Les deux options"
    - id: neither
      text:
        en: "Neither option"
        fr: "Aucune des deux options"
  targets:
    - id: degrade
      text:
        en: "Keep answering queries, more slowly, when a table temporarily exceeds the Direct Lake guardrails"
        fr: "Continuer à répondre aux requêtes, plus lentement, quand une table dépasse temporairement les garde-fous Direct Lake"
    - id: rules
      text:
        en: "Use deployment pipeline data source rules to point the model to the source item of each stage"
        fr: "Utiliser des règles de source de données du pipeline de déploiement pour faire pointer le modèle vers l'élément source de chaque étape"
    - id: hybrid
      text:
        en: "Add a hybrid table that has a real-time DirectQuery partition"
        fr: "Ajouter une table hybride dotée d'une partition DirectQuery en temps réel"
    - id: rls
      text:
        en: "Enforce row-level security roles defined in the semantic model"
        fr: "Appliquer des rôles de sécurité au niveau des lignes définis dans le modèle sémantique"
answer:
  mapping: { degrade: sql, rules: sql, hybrid: neither, rls: both }
explanation:
  correct:
    en: |
      Only Direct Lake on SQL falls back to DirectQuery when a guardrail is exceeded; Direct Lake on OneLake fails the refresh instead. Deployment pipeline data source rules are supported for Direct Lake on SQL, while Direct Lake on OneLake models use M parameters and parameter rules. Hybrid tables and model partitions aren't supported by either option, and semantic model row-level security is supported by both.
    fr: |
      Seul Direct Lake sur SQL bascule en DirectQuery quand un garde-fou est dépassé ; Direct Lake sur OneLake fait alors échouer l'actualisation. Les règles de source de données des pipelines de déploiement sont prises en charge pour Direct Lake sur SQL, tandis que les modèles Direct Lake sur OneLake utilisent des paramètres M et des règles de paramètres. Les tables hybrides et les partitions de modèle ne sont prises en charge par aucune des deux options, et la sécurité au niveau des lignes du modèle sémantique l'est par les deux.
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
