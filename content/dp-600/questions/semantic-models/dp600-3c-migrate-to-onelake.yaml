id: dp600-3c-migrate-to-onelake
objective: "3.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace on an F64 capacity that contains a lakehouse named Lakehouse1 and a Direct Lake on SQL analytics endpoint semantic model named Model1. In Model1, the Promotions table is based on a view named vw_promotions of the SQL analytics endpoint, and the FactClicks table uses a Delta table that contains 7,200 Parquet files. Queries on both tables currently fall back to DirectQuery. No SQL security is defined.

    You plan to re-create Model1 as a Direct Lake on OneLake model so that you can add tables from another lakehouse. After the migration, every table must be queryable in Direct Lake mode and the refresh must succeed.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric sur une capacité F64 qui contient un lakehouse nommé Lakehouse1 et un modèle sémantique Direct Lake sur le point de terminaison d'analytique SQL nommé Model1. Dans Model1, la table Promotions repose sur une vue du point de terminaison d'analytique SQL nommée vw_promotions, et la table FactClicks utilise une table Delta qui contient 7 200 fichiers Parquet. Les requêtes sur ces deux tables basculent actuellement en DirectQuery. Aucune sécurité SQL n'est définie.

    Vous prévoyez de recréer Model1 sous forme de modèle Direct Lake sur OneLake pour pouvoir y ajouter des tables d'un autre lakehouse. Après la migration, chaque table doit pouvoir être interrogée en mode Direct Lake et l'actualisation doit réussir.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Set the **Direct Lake behavior** property of the new model to Automatic."
        fr: "Définir la propriété **Direct Lake behavior** du nouveau modèle sur Automatic."
    - id: b
      text:
        en: "Replace vw_promotions with a materialized lake view in Lakehouse1, and base the Promotions table on it."
        fr: "Remplacer vw_promotions par une vue matérialisée de lakehouse dans Lakehouse1, et y faire reposer la table Promotions."
    - id: c
      text:
        en: "Run OPTIMIZE on the Delta table of FactClicks so that it contains fewer than 5,000 Parquet files."
        fr: "Exécuter OPTIMIZE sur la table Delta de FactClicks pour qu'elle contienne moins de 5 000 fichiers Parquet."
    - id: d
      text:
        en: "Remove the calculation groups from the model before the migration."
        fr: "Supprimer les groupes de calcul du modèle avant la migration."
    - id: e
      text:
        en: "Grant the report users the ReadData permission on the SQL analytics endpoint of Lakehouse1."
        fr: "Accorder aux utilisateurs des rapports l'autorisation ReadData sur le point de terminaison d'analytique SQL de Lakehouse1."
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Direct Lake on OneLake doesn't support tables based on non-materialized SQL views and has no DirectQuery fallback, so vw_promotions must become a Delta table, for example a materialized lake view. On F64, a table is limited to 5,000 Parquet files; with Direct Lake on OneLake, exceeding the guardrail makes the refresh fail, so FactClicks must be compacted with OPTIMIZE before it can be queried.
    fr: |
      Direct Lake sur OneLake ne prend pas en charge les tables fondées sur des vues SQL non matérialisées et n'a pas de basculement vers DirectQuery : vw_promotions doit devenir une table Delta, par exemple une vue matérialisée de lakehouse. Sur F64, une table est limitée à 5 000 fichiers Parquet ; avec Direct Lake sur OneLake, le dépassement du garde-fou fait échouer l'actualisation : FactClicks doit donc être compactée avec OPTIMIZE avant de pouvoir être interrogée.
  options:
    a: { en: "The Direct Lake behavior property applies only to Direct Lake on SQL; a OneLake model never falls back.", fr: "La propriété Direct Lake behavior ne s'applique qu'à Direct Lake sur SQL ; un modèle OneLake ne bascule jamais." }
    d: { en: "Calculation groups are supported in both types of Direct Lake models.", fr: "Les groupes de calcul sont pris en charge dans les deux types de modèles Direct Lake." }
    e: { en: "Direct Lake on OneLake reads the Delta tables through OneLake permissions, not through the SQL analytics endpoint.", fr: "Direct Lake sur OneLake lit les tables Delta avec les autorisations OneLake, pas via le point de terminaison d'analytique SQL." }
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
  - title: How Direct Lake works
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works
