id: dp600-cs2c-calc-features
objective: "3.1.5"
type: dragdrop
caseStudy: dp600-cs2c-blue-yonder-airlines
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the calculation requirements in SM-FlightOps.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter les exigences de calcul de SM-FlightOps.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: calcgroup
      text: { en: "Calculation group", fr: "Groupe de calcul" }
    - id: fieldparam
      text: { en: "Field parameter", fr: "Paramètre de champ" }
    - id: dynformat
      text: { en: "Dynamic format string for a measure", fr: "Chaîne de format dynamique pour une mesure" }
    - id: numrange
      text: { en: "Numeric range parameter", fr: "Paramètre de plage numérique" }
    - id: calctable
      text: { en: "Calculated table", fr: "Table calculée" }
  targets:
    - id: r5
      text: { en: "Requirement 5: time calculations for every measure", fr: "Exigence 5 : calculs temporels pour chaque mesure" }
    - id: r6
      text: { en: "Requirement 6: choice of the measure shown in a visual", fr: "Exigence 6 : choix de la mesure affichée dans un visuel" }
    - id: r7
      text: { en: "Requirement 7: Revenue display by magnitude", fr: "Exigence 7 : affichage de Revenue selon l'ordre de grandeur" }
answer:
  mapping: { r5: calcgroup, r6: fieldparam, r7: dynformat }
explanation:
  correct:
    en: "A calculation group applies each calculation item, written with SELECTEDMEASURE(), to any explicit measure, so three items cover the 40 measures. A field parameter lists measures or columns that a report user selects in a slicer to change what a visual shows. A dynamic format string for a measure is a DAX expression that returns the format string, so Revenue keeps a numeric value while its display changes with the magnitude."
    fr: "Un groupe de calcul applique chaque élément de calcul, écrit avec SELECTEDMEASURE(), à n'importe quelle mesure explicite : trois éléments couvrent donc les 40 mesures. Un paramètre de champ liste des mesures ou des colonnes qu'un utilisateur du rapport sélectionne dans un segment pour changer ce qu'affiche un visuel. Une chaîne de format dynamique pour une mesure est une expression DAX qui retourne la chaîne de format : Revenue garde ainsi une valeur numérique tandis que son affichage change selon l'ordre de grandeur."
  options:
    numrange:
      en: "A numeric range parameter lets users pick a number to use in a what-if calculation; it does not switch measures or apply time calculations."
      fr: "Un paramètre de plage numérique permet de choisir un nombre utilisé dans un calcul de simulation ; il ne change pas de mesure et n'applique pas de calculs temporels."
    calctable:
      en: "A calculated table stores the result of a DAX table expression at refresh; it cannot change the format or the measure of a visual at query time."
      fr: "Une table calculée stocke le résultat d'une expression de table DAX lors de l'actualisation ; elle ne peut pas changer le format ni la mesure d'un visuel au moment de la requête."
references:
  - title: Create calculation groups in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/calculation-groups
  - title: Create dynamic format strings for measures
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-dynamic-format-strings
