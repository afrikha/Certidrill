id: dp600-3c-iterator-context-transition
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a semantic model that contains a Sales fact table of 400 million rows and a Product table of 2,000 rows. Product has a one-to-many relationship with Sales on ProductKey. A measure named [Unit Price] is defined as `AVERAGE ( 'Product'[ListPrice] )`, and a measure named [Total Quantity] is defined as `SUM ( Sales[Quantity] )`.

    A measure named List Value is defined as `SUMX ( Sales, [Unit Price] * Sales[Quantity] )` and is slow. You need to rewrite List Value to reduce the query duration. The measure must return the same results in every filter context.

    Which expression should you use?
  fr: |
    Vous disposez d'un modèle sémantique qui contient une table de faits Sales de 400 millions de lignes et une table Product de 2 000 lignes. Product a une relation un-à-plusieurs avec Sales sur ProductKey. Une mesure nommée [Unit Price] est définie ainsi : `AVERAGE ( 'Product'[ListPrice] )`, et une mesure nommée [Total Quantity] ainsi : `SUM ( Sales[Quantity] )`.

    Une mesure nommée List Value est définie ainsi : `SUMX ( Sales, [Unit Price] * Sales[Quantity] )` et elle est lente. Vous devez réécrire List Value pour réduire la durée des requêtes. La mesure doit renvoyer les mêmes résultats dans tous les contextes de filtre.

    Quelle expression devez-vous utiliser ?
body:
  options:
    - id: a
      text: |-
        SUMX ( VALUES ( 'Product'[ProductKey] ), [Unit Price] * [Total Quantity] )
    - id: b
      text: |-
        SUMX ( Sales, CALCULATE ( AVERAGE ( 'Product'[ListPrice] ) ) * Sales[Quantity] )
    - id: c
      text: |-
        SUM ( 'Product'[ListPrice] ) * SUM ( Sales[Quantity] )
    - id: d
      text: |-
        AVERAGEX ( 'Product', [Unit Price] ) * [Total Quantity]
answer:
  optionId: a
explanation:
  correct:
    en: |
      Referencing a measure inside an iterator causes a context transition for each iterated row, so the current measure performs 400 million transitions. Iterating the distinct product keys performs only one transition per product: for each product, [Unit Price] returns its list price and [Total Quantity] its quantity, and the sum of these products equals the row-level total.
    fr: |
      Référencer une mesure dans un itérateur provoque une transition de contexte pour chaque ligne itérée : la mesure actuelle effectue 400 millions de transitions. Itérer les clés de produit distinctes n'effectue qu'une transition par produit : pour chaque produit, [Unit Price] renvoie son prix catalogue et [Total Quantity] sa quantité, et la somme de ces produits est égale au total calculé ligne par ligne.
  options:
    b: { en: "CALCULATE inside the iterator performs the same context transition on every Sales row, so the duration doesn't improve.", fr: "CALCULATE dans l'itérateur effectue la même transition de contexte sur chaque ligne de Sales : la durée ne s'améliore pas." }
    c: { en: "Multiplying two totals doesn't return the sum of price times quantity per product.", fr: "Multiplier deux totaux ne renvoie pas la somme du prix multiplié par la quantité de chaque produit." }
    d: { en: "Multiplying an average price by the total quantity ignores the quantity sold of each product.", fr: "Multiplier un prix moyen par la quantité totale ignore la quantité vendue de chaque produit." }
references:
  - title: CALCULATE
    url: https://learn.microsoft.com/en-us/dax/calculate-function-dax
  - title: SUMX
    url: https://learn.microsoft.com/en-us/dax/sumx-function-dax
