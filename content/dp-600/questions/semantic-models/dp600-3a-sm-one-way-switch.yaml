id: dp600-3a-sm-one-way-switch
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Power BI Desktop file named **Stock.pbix** that you edit locally. The model contains a table named **Inventory** that you added from an Azure SQL database in DirectQuery mode. Last week, you changed the storage mode of Inventory to Import and saved the file.

    The requirements have changed: Inventory must again show the data that is in the database when a visual loads.

    What should you do?
  fr: |
    Vous disposez d'un fichier Power BI Desktop nommé **Stock.pbix** que vous modifiez localement. Le modèle contient une table nommée **Inventory** que vous avez ajoutée à partir d'une base de données Azure SQL en mode DirectQuery. La semaine dernière, vous avez changé le mode de stockage d'Inventory en Import et enregistré le fichier.

    Les exigences ont changé : Inventory doit de nouveau afficher les données présentes dans la base au moment où un visuel se charge.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In Model view, set the Storage mode property of Inventory back to DirectQuery.", fr: "Dans la vue Modèle, remettre la propriété Mode de stockage d'Inventory sur DirectQuery." } }
    - { id: b, text: { en: "In Model view, set the Storage mode property of Inventory to Dual.", fr: "Dans la vue Modèle, définir la propriété Mode de stockage d'Inventory sur Double (Dual)." } }
    - { id: c, text: { en: "Select the storage mode indicator in the status bar and switch all the tables to DirectQuery.", fr: "Sélectionner l'indicateur de mode de stockage dans la barre d'état et basculer toutes les tables en DirectQuery." } }
    - { id: d, text: { en: "Delete the Inventory table, and then add it again from the database by using DirectQuery.", fr: "Supprimer la table Inventory, puis l'ajouter de nouveau à partir de la base de données en DirectQuery." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Changing a table from DirectQuery to Import is a one-way change in Power BI Desktop; only web modeling and live editing keep a version history that can reverse it. To query the source live again, you must add the table again in DirectQuery mode (and recreate its relationships and measures).
    fr: |
      Le passage d'une table de DirectQuery à Import est irréversible dans Power BI Desktop ; seules la modélisation web et la modification en direct conservent un historique de versions qui permet de revenir en arrière. Pour interroger de nouveau la source en direct, vous devez rajouter la table en mode DirectQuery (et recréer ses relations et mesures).
  options:
    a: { en: "After the change to Import, the table can't be set back to DirectQuery.", fr: "Après le passage en Import, la table ne peut pas être remise en DirectQuery." }
    b: { en: "A Dual table answers from its cache whenever it can, so visuals wouldn't always show the current data.", fr: "Une table en mode Double répond depuis son cache chaque fois que c'est possible ; les visuels n'afficheraient donc pas toujours les données actuelles." }
    c: { en: "The status bar indicator only offers to switch all the tables to Import, not to DirectQuery.", fr: "L'indicateur de la barre d'état propose seulement de basculer toutes les tables en Import, pas en DirectQuery." }
references:
  - title: Table storage mode in Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-storage-mode
  - title: Use composite models in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-composite-models
