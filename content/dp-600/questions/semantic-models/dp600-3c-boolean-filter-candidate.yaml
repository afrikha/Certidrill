id: dp600-3c-boolean-filter-candidate
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are reviewing the measures of a semantic model. Each of the following CALCULATE filter arguments uses the FILTER function.

    You need to identify the filter argument that you can replace with a Boolean filter expression to improve performance.

    Which filter argument should you identify?
  fr: |
    Vous examinez les mesures d'un modèle sémantique. Chacun des arguments de filtre de CALCULATE suivants utilise la fonction FILTER.

    Vous devez identifier l'argument de filtre que vous pouvez remplacer par une expression de filtre booléenne pour améliorer les performances.

    Quel argument de filtre devez-vous identifier ?
body:
  options:
    - id: a
      text: |-
        FILTER ( Customer, [Total Sales] > 10000 )
    - id: b
      text: |-
        FILTER ( Sales, Sales[Amount] > RELATED ( 'Product'[ListPrice] ) )
    - id: c
      text: |-
        FILTER ( 'Product', 'Product'[Color] = "Red" && CALCULATE ( SUM ( Sales[Quantity] ) ) > 0 )
    - id: d
      text: |-
        FILTER ( Store, Store[Region] = "West" )
answer:
  optionId: d
explanation:
  correct:
    en: "A Boolean filter expression can reference columns of a single table, but it can't reference a measure, use a nested CALCULATE, or scan or return a table. The condition on Store[Region] references one column of one table, so it can become `KEEPFILTERS ( Store[Region] = \"West\" )`, which keeps the same semantics and filters the column directly."
    fr: "Une expression de filtre booléenne peut référencer les colonnes d'une seule table, mais elle ne peut ni référencer une mesure, ni utiliser un CALCULATE imbriqué, ni analyser ou renvoyer une table. La condition sur Store[Region] référence une colonne d'une seule table : elle peut devenir `KEEPFILTERS ( Store[Region] = \"West\" )`, qui conserve la même sémantique et filtre directement la colonne."
  options:
    a: { en: "The condition references the [Total Sales] measure, which a Boolean filter expression can't do.", fr: "La condition référence la mesure [Total Sales], ce qu'une expression de filtre booléenne ne peut pas faire." }
    b: { en: "The condition compares columns of two tables (Sales and Product).", fr: "La condition compare des colonnes de deux tables (Sales et Product)." }
    c: { en: "The condition contains a nested CALCULATE.", fr: "La condition contient un CALCULATE imbriqué." }
references:
  - title: Avoid using FILTER as a filter argument in DAX
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-avoid-avoid-filter-as-filter-argument
  - title: CALCULATE
    url: https://learn.microsoft.com/en-us/dax/calculate-function-dax
