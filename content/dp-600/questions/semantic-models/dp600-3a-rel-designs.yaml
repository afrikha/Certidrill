id: dp600-3a-rel-designs
objective: "3.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are designing the relationships of a semantic model named **RetailModel**. Sales is the main fact table, and its active date relationship uses OrderDateKey.

    Which relationship design should you use for each requirement? To answer, drag the appropriate designs to the correct requirements. Each design may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez les relations d'un modèle sémantique nommé **RetailModel**. Sales est la table de faits principale, et sa relation de date active utilise OrderDateKey.

    Quelle conception de relation devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les conceptions appropriées vers les exigences correspondantes. Chaque conception peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: one-many, text: { en: "One-to-many, single direction", fr: "Un-à-plusieurs, direction unique" } }
    - { id: many-many, text: { en: "Many-to-many cardinality, single direction", fr: "Cardinalité plusieurs-à-plusieurs, direction unique" } }
    - { id: one-one, text: { en: "One-to-one, both directions", fr: "Un-à-un, les deux directions" } }
    - { id: inactive, text: { en: "Inactive one-to-many relationship", fr: "Relation un-à-plusieurs inactive" } }
    - { id: bridge, text: { en: "Bridging table with one bidirectional relationship", fr: "Table de pont avec une relation bidirectionnelle" } }
  targets:
    - { id: t1, text: { en: "Product (unique ProductKey) must filter Sales on ProductKey.", fr: "Product (ProductKey unique) doit filtrer Sales sur ProductKey." } }
    - { id: t2, text: { en: "Product must filter a Target table stored by product category; Category repeats in both tables.", fr: "Product doit filtrer une table Target stockée par catégorie de produit ; Category se répète dans les deux tables." } }
    - { id: t3, text: { en: "A Sales Order table derived from Sales, with exactly one row per Sales row, must relate to Sales on OrderLineID.", fr: "Une table Sales Order dérivée de Sales, avec exactement une ligne par ligne de Sales, doit être liée à Sales sur OrderLineID." } }
    - { id: t4, text: { en: "Date must filter Sales on DeliveryDateKey, but only inside one measure.", fr: "Date doit filtrer Sales sur DeliveryDateKey, mais uniquement dans une mesure." } }
answer:
  mapping: { t1: one-many, t2: many-many, t3: one-one, t4: inactive }
explanation:
  correct:
    en: |
      A dimension with a unique key filters a fact table through a single-direction one-to-many relationship. For a higher-grain fact on a non-date column such as Category, use a many-to-many relationship that filters from the dimension to the fact only. A degenerate dimension table with the same rows as the fact relates one-to-one, which always filters in both directions. A second date role used by one measure is an inactive relationship activated with USERELATIONSHIP. A bridge is for two dimensions with a many-to-many association.
    fr: |
      Une dimension à clé unique filtre une table de faits par une relation un-à-plusieurs à direction unique. Pour un fait de grain supérieur sur une colonne autre qu'une date, comme Category, utilisez une relation plusieurs-à-plusieurs qui filtre uniquement de la dimension vers le fait. Une table de dimension dégénérée qui a les mêmes lignes que le fait est liée en un-à-un, ce qui filtre toujours dans les deux directions. Un second rôle de date utilisé par une seule mesure est une relation inactive activée par USERELATIONSHIP. Un pont sert à deux dimensions liées par une association plusieurs-à-plusieurs.
references:
  - title: Many-to-many relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-many-to-many
  - title: One-to-one relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-one-to-one
