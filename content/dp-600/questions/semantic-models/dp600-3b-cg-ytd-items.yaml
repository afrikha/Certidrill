id: dp600-3b-cg-ytd-items
objective: "3.1.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a semantic model that contains a date table named **Date**, marked as a date table, and 25 explicit measures.

    You create a calculation group named **Time Intelligence**. You need to add two calculation items:

    - **YTD**: the value of any measure from the start of the year to the last date in the filter context.
    - **PY**: the value of any measure for the same period one year earlier, at any level of the date hierarchy.

    How should you complete the expressions? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique qui contient une table de dates nommée **Date**, marquée comme table de dates, et 25 mesures explicites.

    Vous créez un groupe de calcul nommé **Time Intelligence**. Vous devez ajouter deux éléments de calcul :

    - **YTD** : la valeur de n'importe quelle mesure depuis le début de l'année jusqu'à la dernière date du contexte de filtre.
    - **PY** : la valeur de n'importe quelle mesure pour la même période un an plus tôt, à n'importe quel niveau de la hiérarchie de dates.

    Comment devez-vous compléter les expressions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    YTD =
    CALCULATE ( [[m]], [[f1]] ( 'Date'[Date] ) )

    PY =
    CALCULATE ( SELECTEDMEASURE (), [[f2]] ( 'Date'[Date] ) )
  slots:
    - id: m
      options:
        - { id: sel, text: "SELECTEDMEASURE ()" }
        - { id: name, text: "SELECTEDMEASURENAME ()" }
        - { id: fmt, text: "SELECTEDMEASUREFORMATSTRING ()" }
        - { id: total, text: "[Total Sales]" }
    - id: f1
      options:
        - { id: datesytd, text: DATESYTD }
        - { id: totalytd, text: TOTALYTD }
        - { id: datesmtd, text: DATESMTD }
        - { id: prevyear, text: PREVIOUSYEAR }
    - id: f2
      options:
        - { id: spl, text: SAMEPERIODLASTYEAR }
        - { id: prevyear2, text: PREVIOUSYEAR }
        - { id: datesytd2, text: DATESYTD }
        - { id: nextyear, text: NEXTYEAR }
answer:
  values: { m: sel, f1: datesytd, f2: spl }
explanation:
  correct:
    en: |
      In a calculation item, SELECTEDMEASURE() stands for whichever measure the item is applied to, so one item serves the 25 measures. DATESYTD returns the dates from the start of the year to the last date in context, which CALCULATE uses as a filter. SAMEPERIODLASTYEAR shifts the dates in context back one year, so it works for a day, a month, a quarter or a year.
    fr: |
      Dans un élément de calcul, SELECTEDMEASURE() représente la mesure à laquelle l'élément est appliqué ; un seul élément sert donc les 25 mesures. DATESYTD renvoie les dates du début de l'année jusqu'à la dernière date du contexte, que CALCULATE utilise comme filtre. SAMEPERIODLASTYEAR décale d'un an les dates du contexte ; il fonctionne donc pour un jour, un mois, un trimestre ou une année.
  options:
    name: { en: "SELECTEDMEASURENAME() returns the name of the measure as text, not its value.", fr: "SELECTEDMEASURENAME() renvoie le nom de la mesure sous forme de texte, pas sa valeur." }
    fmt: { en: "SELECTEDMEASUREFORMATSTRING() returns the format string of the measure; it is used in format string expressions.", fr: "SELECTEDMEASUREFORMATSTRING() renvoie la chaîne de format de la mesure ; elle sert dans les expressions de chaîne de format." }
    total: { en: "A fixed measure reference would return Total Sales whatever measure the item is applied to.", fr: "Une référence fixe à une mesure renverrait Total Sales quelle que soit la mesure à laquelle l'élément est appliqué." }
    totalytd: { en: "TOTALYTD returns a scalar value, not a table of dates that CALCULATE can use as a filter argument.", fr: "TOTALYTD renvoie une valeur scalaire, pas une table de dates que CALCULATE peut utiliser comme argument de filtre." }
    datesmtd: { en: "DATESMTD returns the dates from the start of the month, not the year.", fr: "DATESMTD renvoie les dates depuis le début du mois, pas de l'année." }
    prevyear: { en: "PREVIOUSYEAR returns all the dates of the previous year, not the current year to date.", fr: "PREVIOUSYEAR renvoie toutes les dates de l'année précédente, pas l'année en cours jusqu'à la date." }
    prevyear2: { en: "PREVIOUSYEAR always returns the whole previous year, so a month would show a full year of values.", fr: "PREVIOUSYEAR renvoie toujours toute l'année précédente : un mois afficherait donc une année entière de valeurs." }
    datesytd2: { en: "DATESYTD returns the current year to date, not the previous year.", fr: "DATESYTD renvoie l'année en cours jusqu'à la date, pas l'année précédente." }
    nextyear: { en: "NEXTYEAR returns the dates of the following year.", fr: "NEXTYEAR renvoie les dates de l'année suivante." }
references:
  - title: Create calculation groups in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/calculation-groups
  - title: Calculation groups in Analysis Services tabular models
    url: https://learn.microsoft.com/en-us/analysis-services/tabular-models/calculation-groups
