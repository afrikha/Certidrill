id: dp600-3a-ss-date-table
objective: "3.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You are adding a **Date** dimension to an Import semantic model. Date has one row per day with no gaps, and contains the **DateKey** column (whole number, format yyyymmdd), the **Date** column (Date data type), and Year and Month columns. The **Sales** fact table contains **OrderDateKey** (whole number, format yyyymmdd).

    Measures will use classic time intelligence functions such as DATESYTD and SAMEPERIODLASTYEAR. Date must filter Sales.

    How should you configure the model? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ajoutez une dimension **Date** à un modèle sémantique Import. Date contient une ligne par jour, sans trou, ainsi que la colonne **DateKey** (nombre entier au format aaaammjj), la colonne **Date** (type de données Date) et des colonnes Year et Month. La table de faits **Sales** contient **OrderDateKey** (nombre entier au format aaaammjj).

    Les mesures utiliseront des fonctions Time Intelligence classiques comme DATESYTD et SAMEPERIODLASTYEAR. Date doit filtrer Sales.

    Comment devez-vous configurer le modèle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Relationship: [[rel]]
      Date table setting: [[mark]]
    fr: |
      Relation : [[rel]]
      Paramètre de table de dates : [[mark]]
  slots:
    - id: rel
      options:
        - { id: rel-1n, text: { en: "One-to-many from Date[DateKey] to Sales[OrderDateKey], single direction", fr: "Un-à-plusieurs de Date[DateKey] vers Sales[OrderDateKey], direction unique" } }
        - { id: rel-mm, text: { en: "Many-to-many between Date[Date] and Sales[OrderDateKey], both directions", fr: "Plusieurs-à-plusieurs entre Date[Date] et Sales[OrderDateKey], les deux directions" } }
        - { id: rel-11, text: { en: "One-to-one between Date[DateKey] and Sales[OrderDateKey], both directions", fr: "Un-à-un entre Date[DateKey] et Sales[OrderDateKey], les deux directions" } }
        - { id: rel-year, text: { en: "One-to-many from Date[Year] to Sales[OrderDateKey], single direction", fr: "Un-à-plusieurs de Date[Year] vers Sales[OrderDateKey], direction unique" } }
    - id: mark
      options:
        - { id: mark-date, text: { en: "Mark Date as a date table and select the Date[Date] column", fr: "Marquer Date comme table de dates et sélectionner la colonne Date[Date]" } }
        - { id: mark-key, text: { en: "Mark Date as a date table and select the Date[DateKey] column", fr: "Marquer Date comme table de dates et sélectionner la colonne Date[DateKey]" } }
        - { id: mark-auto, text: { en: "Keep Auto date/time turned on and don't mark the table", fr: "Laisser Date/heure automatique activé et ne pas marquer la table" } }
        - { id: mark-none, text: { en: "No setting is needed because the relationship uses a key column", fr: "Aucun paramètre n'est nécessaire, car la relation utilise une colonne de clé" } }
answer:
  values: { rel: rel-1n, mark: mark-date }
explanation:
  correct:
    en: |
      DateKey is unique in Date, so Date is the one side of a single-direction one-to-many relationship to the fact table. Because the relationship uses a column whose data type isn't a date, you must mark Date as a date table for time intelligence to work, and the marked column must be the Date column of data type Date (unique, no blanks, contiguous).
    fr: |
      DateKey est unique dans Date ; Date est donc le côté « un » d'une relation un-à-plusieurs à direction unique vers la table de faits. Comme la relation utilise une colonne dont le type de données n'est pas une date, vous devez marquer Date comme table de dates pour que les fonctions Time Intelligence fonctionnent, et la colonne marquée doit être la colonne Date de type Date (unique, sans valeurs vides, contiguë).
  options:
    rel-mm: { en: "Date[Date] and an integer key don't match, and a many-to-many relationship is limited.", fr: "Date[Date] et une clé entière ne correspondent pas, et une relation plusieurs-à-plusieurs est limitée." }
    rel-11: { en: "OrderDateKey repeats in Sales, so the relationship can't be one-to-one.", fr: "OrderDateKey se répète dans Sales ; la relation ne peut donc pas être un-à-un." }
    rel-year: { en: "Year doesn't match the yyyymmdd key values.", fr: "Year ne correspond pas aux valeurs de clé aaaammjj." }
    mark-key: { en: "The date column of a date table must have the Date or Date/Time data type.", fr: "La colonne de date d'une table de dates doit être de type Date ou Date/heure." }
    mark-auto: { en: "Auto date/time creates hidden tables for date columns; it doesn't make time intelligence work through an integer key.", fr: "Date/heure automatique crée des tables masquées pour les colonnes de date ; il ne fait pas fonctionner les fonctions Time Intelligence à travers une clé entière." }
    mark-none: { en: "Marking is required precisely when the relationship uses a column that isn't of a date type.", fr: "Le marquage est requis justement quand la relation utilise une colonne qui n'est pas de type date." }
references:
  - title: Set and use date tables in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-date-tables
