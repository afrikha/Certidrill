id: dp600-3c-ir-range-filter
objective: "3.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are configuring incremental refresh for a table named FactOrders in a semantic model named OrdersModel. FactOrders is loaded from an Azure SQL database and its OrderDate column is of type Date/Time. You created the two Power Query parameters that incremental refresh requires.

    You need to write the filter step of the FactOrders query. The step must fold to the source, and no row must be loaded into two partitions.

    How should you complete the Power Query M code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez l'actualisation incrémentielle d'une table nommée FactOrders dans un modèle sémantique nommé OrdersModel. FactOrders est chargée depuis une base de données Azure SQL et sa colonne OrderDate est de type Date/Heure. Vous avez créé les deux paramètres Power Query qu'exige l'actualisation incrémentielle.

    Vous devez écrire l'étape de filtre de la requête FactOrders. L'étape doit être repliée vers la source, et aucune ligne ne doit être chargée dans deux partitions.

    Comment devez-vous compléter le code Power Query M ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    let
        Source = Sql.Database("tailspin-sql.database.windows.net", "OrdersDb"),
        Orders = Source{[Schema = "dbo", Item = "FactOrders"]}[Data],
        Filtered = Table.SelectRows(Orders, each [OrderDate] >= [[start]] and [OrderDate] [[op]] [[end]])
    in
        Filtered
  slots:
    - id: start
      options:
        - { id: rangestart, text: RangeStart }
        - { id: lower, text: rangeStart }
        - { id: startdate, text: StartDate }
        - id: now
          text: |-
            DateTime.LocalNow()
    - id: op
      options:
        - { id: lt, text: "<" }
        - { id: le, text: "<=" }
        - { id: ge, text: ">=" }
        - { id: eq, text: "=" }
    - id: end
      options:
        - { id: enddate, text: EndDate }
        - { id: rangeend, text: RangeEnd }
        - { id: lowerend, text: rangeEnd }
        - id: fixednow
          text: |-
            DateTime.FixedLocalNow()
answer:
  values: { start: rangestart, op: lt, end: rangeend }
explanation:
  correct:
    en: |
      The parameters are reserved names, case sensitive, and must be spelled exactly RangeStart and RangeEnd; the service overrides their values for each partition. An equal sign must be used on only one boundary: with >= on RangeStart and < on RangeEnd, a row on a boundary belongs to exactly one partition. A Table.SelectRows step directly after the source step folds to Azure SQL Database.
    fr: |
      Les paramètres sont des noms réservés, sensibles à la casse, qui doivent s'écrire exactement RangeStart et RangeEnd ; le service remplace leurs valeurs pour chaque partition. Le signe égal ne doit figurer que sur une seule borne : avec >= sur RangeStart et < sur RangeEnd, une ligne située sur une borne appartient à une seule partition. Une étape Table.SelectRows placée juste après l'étape source est repliée vers Azure SQL Database.
  options:
    lower: { en: "Parameter names are case sensitive; rangeStart isn't recognized by incremental refresh.", fr: "Les noms de paramètres sont sensibles à la casse ; rangeStart n'est pas reconnu par l'actualisation incrémentielle." }
    now: { en: "The current date isn't a partition boundary; the service sets the boundaries through RangeStart and RangeEnd.", fr: "La date actuelle n'est pas une borne de partition ; le service définit les bornes via RangeStart et RangeEnd." }
    le: { en: "<= together with >= on RangeStart puts the boundary rows in two partitions and duplicates them.", fr: "<= combiné avec >= sur RangeStart place les lignes limites dans deux partitions et les duplique." }
    lowerend: { en: "Parameter names are case sensitive; the name must be RangeEnd.", fr: "Les noms de paramètres sont sensibles à la casse ; le nom doit être RangeEnd." }
references:
  - title: Configure incremental refresh and real-time data
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-configure
  - title: Configure incremental refresh and real-time data for Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-overview
