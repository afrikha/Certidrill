id: dp600-3a-sm-dual-dimension
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Power BI semantic model that connects to an Azure SQL database named **SalesDB**. All the tables were added in DirectQuery mode: **Sales** (1.2 billion rows), **Product** and **Date**. Product and Date have one-to-many relationships with Sales.

    Report users complain that the Product slicers load slowly. You need to improve slicer performance. The solution must meet the following requirements:

    - Sales must stay in DirectQuery mode.
    - The relationships between Product and Sales must not become limited relationships.

    Which storage mode should you set for the Product table?
  fr: |
    Vous disposez d'un modèle sémantique Power BI connecté à une base de données Azure SQL nommée **SalesDB**. Toutes les tables ont été ajoutées en mode DirectQuery : **Sales** (1,2 milliard de lignes), **Product** et **Date**. Product et Date ont des relations un-à-plusieurs avec Sales.

    Les utilisateurs se plaignent de la lenteur des segments Product. Vous devez améliorer les performances des segments. La solution doit satisfaire les exigences suivantes :

    - Sales doit rester en mode DirectQuery.
    - Les relations entre Product et Sales ne doivent pas devenir des relations limitées.

    Quel mode de stockage devez-vous définir pour la table Product ?
body:
  options:
    - { id: a, text: Import }
    - { id: b, text: { en: "Dual", fr: "Double (Dual)" } }
    - { id: c, text: DirectQuery }
    - { id: d, text: Direct Lake }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Dual table is cached, so slicers that use only Product are answered from memory. When a query combines Product with the DirectQuery Sales table from the same source, the Dual table acts as DirectQuery and the join is pushed to SalesDB, so the relationship stays regular.
    fr: |
      Une table en mode Double est mise en cache : les segments qui n'utilisent que Product sont servis depuis la mémoire. Quand une requête combine Product avec la table DirectQuery Sales de la même source, la table Double se comporte comme DirectQuery et la jointure est envoyée à SalesDB ; la relation reste donc régulière.
  options:
    a: { en: "An Import Product table and a DirectQuery Sales table are in different source groups, so their relationship becomes limited.", fr: "Une table Product en Import et une table Sales en DirectQuery appartiennent à des groupes de sources différents ; leur relation devient donc limitée." }
    c: { en: "Keeping DirectQuery sends every slicer query to SalesDB, which doesn't improve slicer performance.", fr: "Rester en DirectQuery envoie chaque requête de segment à SalesDB, ce qui n'améliore pas les performances des segments." }
    d: { en: "Direct Lake reads Delta tables in OneLake; Product is in Azure SQL Database.", fr: "Direct Lake lit des tables Delta dans OneLake ; Product se trouve dans Azure SQL Database." }
references:
  - title: Table storage mode in Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-storage-mode
  - title: Use composite models in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-composite-models
