id: dp600-3a-rel-limited
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing the relationships of several Power BI semantic models. Some report authors complain that RELATED returns errors and that unmatched fact rows disappear from visuals instead of appearing under a blank member.

    Which two conditions make Power BI evaluate a relationship as a limited relationship?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez les relations de plusieurs modèles sémantiques Power BI. Des auteurs de rapports se plaignent que RELATED renvoie des erreurs et que des lignes de faits sans correspondance disparaissent des visuels au lieu d'apparaître sous un membre vide.

    Quelles sont les deux conditions qui font que Power BI évalue une relation comme une relation limitée ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The relationship uses many-to-many cardinality.", fr: "La relation utilise une cardinalité plusieurs-à-plusieurs." } }
    - { id: b, text: { en: "The relationship is inactive.", fr: "La relation est inactive." } }
    - { id: c, text: { en: "The relationship is one-to-many and filters in both directions between two Import tables.", fr: "La relation est un-à-plusieurs et filtre dans les deux directions entre deux tables Import." } }
    - { id: d, text: { en: "The relationship relates an Import table to a DirectQuery table in a composite model.", fr: "La relation relie une table Import à une table DirectQuery dans un modèle composite." } }
    - { id: e, text: { en: "The relationship is one-to-one between two Import tables.", fr: "La relation est un-à-un entre deux tables Import." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A relationship is limited when there's no guaranteed one side, that is with many-to-many cardinality, or when it crosses source groups in a composite model (Import and DirectQuery tables are in different source groups). Limited relationships use inner joins, add no blank row, and RELATED can't retrieve one-side values through them.
    fr: |
      Une relation est limitée quand il n'existe pas de côté « un » garanti, c'est-à-dire avec une cardinalité plusieurs-à-plusieurs, ou quand elle traverse des groupes de sources dans un modèle composite (les tables Import et DirectQuery appartiennent à des groupes de sources différents). Les relations limitées utilisent des jointures internes, n'ajoutent pas de ligne vide, et RELATED ne peut pas récupérer à travers elles les valeurs du côté « un ».
  options:
    b: { en: "Active or inactive status doesn't decide whether a relationship is regular or limited.", fr: "Le statut actif ou inactif ne détermine pas si une relation est régulière ou limitée." }
    c: { en: "One-to-many relationships within a source group are regular, whatever their filter direction.", fr: "Les relations un-à-plusieurs au sein d'un groupe de sources sont régulières, quelle que soit leur direction de filtre." }
    e: { en: "One-to-one relationships within a source group are regular and expand with a full outer join.", fr: "Les relations un-à-un au sein d'un groupe de sources sont régulières et s'étendent par une jointure externe entière." }
references:
  - title: Model relationships in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-relationships-understand
