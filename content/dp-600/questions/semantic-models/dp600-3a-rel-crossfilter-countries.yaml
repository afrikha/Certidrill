id: dp600-3a-rel-crossfilter-countries
objective: "3.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a semantic model in which **Customer** and **Product** each have a one-to-many, single-direction relationship with **Sales** on CustomerKey and ProductKey. Customer contains a **Country** column.

    You need a measure that a matrix grouped by Product can use to show the number of different countries whose customers bought each product. The relationships in the model must stay single-direction.

    How should you complete the DAX expression? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique dans lequel **Customer** et **Product** ont chacune une relation un-à-plusieurs à direction unique avec **Sales** sur CustomerKey et ProductKey. Customer contient une colonne **Country**.

    Vous avez besoin d'une mesure qu'une matrice regroupée par Product peut utiliser pour afficher le nombre de pays différents dont les clients ont acheté chaque produit. Les relations du modèle doivent rester à direction unique.

    Comment devez-vous compléter l'expression DAX ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Countries Sold =
    CALCULATE (
        [[agg]] ( Customer[Country] ),
        [[fn]] ( Sales[CustomerKey], Customer[CustomerKey], [[dir]] )
    )
  slots:
    - id: agg
      options:
        - { id: distinct, text: DISTINCTCOUNT }
        - { id: count, text: COUNT }
        - { id: counta, text: COUNTA }
    - id: fn
      options:
        - { id: crossf, text: CROSSFILTER }
        - { id: userel, text: USERELATIONSHIP }
        - { id: treatas, text: TREATAS }
        - { id: keep, text: KEEPFILTERS }
    - id: dir
      options:
        - { id: both, text: Both }
        - { id: oneway, text: OneWay }
        - { id: none, text: None }
        - { id: lfr, text: OneWay_LeftFiltersRight }
answer:
  values: { agg: distinct, fn: crossf, dir: both }
explanation:
  correct:
    en: |
      The Product filter reaches Sales but, with a single-direction relationship, not Customer. CROSSFILTER with Both makes the Customer to Sales relationship filter in both directions only while this measure is evaluated, so Customer is limited to the buyers of the product, and DISTINCTCOUNT returns their number of countries.
    fr: |
      Le filtre sur Product atteint Sales mais, avec une relation à direction unique, pas Customer. CROSSFILTER avec Both fait filtrer la relation entre Customer et Sales dans les deux directions uniquement pendant l'évaluation de cette mesure : Customer est limitée aux acheteurs du produit, et DISTINCTCOUNT renvoie leur nombre de pays.
  options:
    count: { en: "COUNT returns the number of customers with a country, not the number of distinct countries.", fr: "COUNT renvoie le nombre de clients ayant un pays, pas le nombre de pays distincts." }
    counta: { en: "COUNTA also counts non-blank values, so a country with several buyers is counted several times.", fr: "COUNTA compte aussi les valeurs non vides : un pays qui a plusieurs acheteurs est compté plusieurs fois." }
    userel: { en: "USERELATIONSHIP activates a relationship but doesn't change its filter direction.", fr: "USERELATIONSHIP active une relation mais ne change pas sa direction de filtre." }
    treatas: { en: "TREATAS takes a table expression and target columns, not a relationship and a direction.", fr: "TREATAS prend une expression de table et des colonnes cibles, pas une relation et une direction." }
    keep: { en: "KEEPFILTERS changes how filter arguments combine; it doesn't take relationship columns.", fr: "KEEPFILTERS change la façon dont les arguments de filtre se combinent ; il ne prend pas de colonnes de relation." }
    oneway: { en: "OneWay keeps the model behavior: Customer filters Sales, not the reverse.", fr: "OneWay conserve le comportement du modèle : Customer filtre Sales, et non l'inverse." }
    none: { en: "None disables the relationship, so Customer isn't filtered at all.", fr: "None désactive le filtrage par la relation : Customer n'est pas filtrée du tout." }
    lfr: { en: "OneWay_LeftFiltersRight can't be used with a many-to-one relationship such as Sales to Customer.", fr: "OneWay_LeftFiltersRight ne peut pas être utilisé avec une relation plusieurs-à-un comme celle de Sales vers Customer." }
references:
  - title: CROSSFILTER function
    url: https://learn.microsoft.com/en-us/dax/crossfilter-function-dax
  - title: Bi-directional relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-bidirectional-filtering
