id: dp600-3b-perf-assume-ri
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a DirectQuery semantic model that uses an Azure SQL database named **SQL1**. The **Sales** and **Product** tables are both in DirectQuery mode and are related on ProductKey (many-to-one). In SQL1, a foreign key constraint exists between the two tables, and Sales.ProductKey contains no null values.

    The native queries sent to SQL1 for visuals that combine Sales and Product use OUTER JOIN clauses. You need to improve the performance of these queries.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique DirectQuery qui utilise une base de données Azure SQL nommée **SQL1**. Les tables **Sales** et **Product** sont toutes deux en mode DirectQuery et reliées sur ProductKey (plusieurs-à-un). Dans SQL1, une contrainte de clé étrangère existe entre les deux tables, et Sales.ProductKey ne contient aucune valeur null.

    Les requêtes natives envoyées à SQL1 pour les visuels qui combinent Sales et Product utilisent des clauses OUTER JOIN. Vous devez améliorer les performances de ces requêtes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn on Assume referential integrity for the relationship", fr: "Activer Assume referential integrity pour la relation" } }
    - { id: b, text: { en: "Set the cross-filter direction of the relationship to Both", fr: "Définir la direction du filtrage croisé de la relation sur Les deux" } }
    - { id: c, text: { en: "Change the storage mode of Product to Import", fr: "Changer le mode de stockage de Product en Import" } }
    - { id: d, text: { en: "Increase the maximum connections per data source", fr: "Augmenter le nombre maximal de connexions par source de données" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With Assume referential integrity, Power BI sends INNER JOIN instead of OUTER JOIN, which generally performs better. It is available because both tables are DirectQuery tables of the same source and the many-side column has no nulls, and it is safe because a foreign key constraint guarantees that no Sales row is lost.
    fr: |
      Avec Assume referential integrity, Power BI envoie des INNER JOIN au lieu d'OUTER JOIN, ce qui est généralement plus performant. L'option est disponible car les deux tables sont des tables DirectQuery de la même source et la colonne du côté plusieurs ne contient pas de null, et elle est sûre car une contrainte de clé étrangère garantit qu'aucune ligne de Sales n'est perdue.
  options:
    b:
      en: |
        Bidirectional filtering can produce poorly performing queries and does not change the join type.
      fr: |
        Le filtrage bidirectionnel peut produire des requêtes peu performantes et ne change pas le type de jointure.
    c:
      en: |
        An Import Product table would be in another source group, so the relationship would become limited.
      fr: |
        Une table Product en Import serait dans un autre groupe de sources : la relation deviendrait limitée.
    d:
      en: |
        More parallel connections can help many concurrent visuals, but each query would still use OUTER JOIN.
      fr: |
        Davantage de connexions parallèles peut aider quand beaucoup de visuels sont simultanés, mais chaque requête utiliserait toujours OUTER JOIN.
references:
  - title: DirectQuery model guidance in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/guidance/directquery-model-guidance
  - title: Model relationships in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-relationships-understand
