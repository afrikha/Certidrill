id: dp600-cs3a-late-routes
objective: "3.2.2"
type: single
caseStudy: dp600-cs3a-consolidated-messenger
difficulty: 3
status: draft
stem:
  en: |
    You need to rewrite Late Routes to meet requirement 4.

    Which expression should you use?
  fr: |
    Vous devez réécrire Late Routes pour satisfaire l'exigence 4.

    Quelle expression devez-vous utiliser ?
body:
  options:
    - { id: a, text: "CALCULATE([Routes], route_kpi[DelayMinutes] > 30)" }
    - { id: b, text: "CALCULATE([Routes], KEEPFILTERS(route_kpi[DelayMinutes] > 30))" }
    - { id: c, text: "CALCULATE([Routes], FILTER(ALL(route_kpi), route_kpi[DelayMinutes] > 30))" }
    - { id: d, text: "SUMX(FILTER(route_kpi, route_kpi[DelayMinutes] > 30), [Routes])" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Boolean filter on a column lets the column store filter DelayMinutes directly instead of iterating the whole route_kpi table, so it performs better than FILTER over the table. KEEPFILTERS intersects the condition with the existing filter on DelayMinutes, so a slicer selection still applies, as it did with the original FILTER version.
    fr: |
      Un filtre booléen sur une colonne permet au stockage en colonnes de filtrer DelayMinutes directement au lieu d'itérer toute la table route_kpi : il est donc plus performant que FILTER sur la table. KEEPFILTERS combine la condition avec le filtre existant sur DelayMinutes : une sélection dans le segment s'applique toujours, comme avec la version FILTER d'origine.
  options:
    a: { en: "Without KEEPFILTERS, the Boolean filter replaces the slicer filter on DelayMinutes, so the result changes when a user selects delay values.", fr: "Sans KEEPFILTERS, le filtre booléen remplace le filtre du segment sur DelayMinutes : le résultat change quand un utilisateur sélectionne des valeurs de retard." }
    c: { en: "ALL removes every filter on route_kpi, including the depot and delay slicers, so the results change, and the table is still iterated.", fr: "ALL supprime tous les filtres sur route_kpi, y compris les segments de dépôt et de retard : les résultats changent, et la table est toujours itérée." }
    d: { en: "SUMX iterates the filtered rows and evaluates [Routes] with a context transition for each row, which is slower than the original measure.", fr: "SUMX itère les lignes filtrées et évalue [Routes] avec une transition de contexte pour chaque ligne, ce qui est plus lent que la mesure d'origine." }
references:
  - title: Avoid using FILTER as a filter argument in DAX
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-avoid-avoid-filter-as-filter-argument
