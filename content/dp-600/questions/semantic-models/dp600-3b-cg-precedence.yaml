id: dp600-3b-cg-precedence
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a semantic model that contains a measure named [Sales] and two calculation groups:

    | Calculation group | Precedence | Calculation item | Expression |
    | --- | --- | --- | --- |
    | Time Intelligence | 20 | YTD | `CALCULATE ( SELECTEDMEASURE (), DATESYTD ( 'Date'[Date] ) )` |
    | Averages | 10 | Daily Average | `DIVIDE ( SELECTEDMEASURE (), COUNTROWS ( 'Date' ) )` |

    A matrix shows [Sales] by month. Slicers select the YTD item and the Daily Average item.

    Which expression does the model evaluate for each cell of the matrix?
  fr: |
    Vous disposez d'un modèle sémantique qui contient une mesure nommée [Sales] et deux groupes de calcul :

    | Groupe de calcul | Priorité (precedence) | Élément de calcul | Expression |
    | --- | --- | --- | --- |
    | Time Intelligence | 20 | YTD | `CALCULATE ( SELECTEDMEASURE (), DATESYTD ( 'Date'[Date] ) )` |
    | Averages | 10 | Daily Average | `DIVIDE ( SELECTEDMEASURE (), COUNTROWS ( 'Date' ) )` |

    Une matrice affiche [Sales] par mois. Des segments sélectionnent l'élément YTD et l'élément Daily Average.

    Quelle expression le modèle évalue-t-il pour chaque cellule de la matrice ?
body:
  options:
    - { id: a, text: "DIVIDE ( CALCULATE ( [Sales], DATESYTD ( 'Date'[Date] ) ), COUNTROWS ( 'Date' ) )" }
    - { id: b, text: "CALCULATE ( [Sales], DATESYTD ( 'Date'[Date] ) )" }
    - { id: c, text: "CALCULATE ( DIVIDE ( [Sales], COUNTROWS ( 'Date' ) ), DATESYTD ( 'Date'[Date] ) )" }
    - { id: d, text: "DIVIDE ( [Sales], COUNTROWS ( 'Date' ) )" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When several calculation groups apply to the same measure, the group with the lower precedence is applied first and the group with the higher precedence wraps the result. Daily Average (10) replaces [Sales] first, then YTD (20) replaces SELECTEDMEASURE() with that whole expression, so the YTD filter applies to both the sales and the count of days, which gives the daily average over the year to date.
    fr: |
      Quand plusieurs groupes de calcul s'appliquent à la même mesure, le groupe de priorité la plus faible est appliqué d'abord et le groupe de priorité la plus élevée enveloppe le résultat. Daily Average (10) remplace d'abord [Sales], puis YTD (20) remplace SELECTEDMEASURE() par toute cette expression : le filtre YTD s'applique donc aux ventes et au nombre de jours, ce qui donne la moyenne quotidienne depuis le début de l'année.
  options:
    a:
      en: |
        This would be the result if Averages had the higher precedence; here the YTD filter would not apply to the count of days.
      fr: |
        Ce serait le résultat si Averages avait la priorité la plus élevée ; ici, le filtre YTD ne s'appliquerait pas au nombre de jours.
    b:
      en: |
        Both calculation groups are filtered to a single item, so both items apply, not only the one with the higher precedence.
      fr: |
        Les deux groupes de calcul sont filtrés sur un seul élément ; les deux éléments s'appliquent donc, pas seulement celui de priorité la plus élevée.
    d:
      en: |
        The YTD item is selected and applies too; precedence decides the order of the items, not which one is ignored.
      fr: |
        L'élément YTD est sélectionné et s'applique aussi ; la priorité décide de l'ordre des éléments, pas de celui qui est ignoré.
references:
  - title: Calculation groups in Analysis Services tabular models
    url: https://learn.microsoft.com/en-us/analysis-services/tabular-models/calculation-groups
