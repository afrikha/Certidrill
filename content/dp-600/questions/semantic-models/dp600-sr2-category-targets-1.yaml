id: dp600-sr2-category-targets-1
objective: "3.1.3"
type: series_yesno
series: dp600-sr2-category-targets
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You create a one-to-many relationship from Product[Category] to Target[Category].
  fr: Vous créez une relation un-à-plusieurs de Product[Category] vers Target[Category].
body:
  solution:
    en: You create a relationship between **Product[Category]** and **Target[Category]** with the **One to many** cardinality, Product on the one side, and a **Single** cross-filter direction.
    fr: Vous créez une relation entre **Product[Category]** et **Target[Category]** avec la cardinalité **Un-à-plusieurs**, Product du côté « un », et une direction de filtrage croisé **Unique**.
answer: { value: false }
explanation:
  correct:
    en: The one side of a one-to-many relationship must contain unique values. Product[Category] repeats the same category for many products, so there is no one side and the relationship can't be created with this cardinality.
    fr: "Le côté « un » d'une relation un-à-plusieurs doit contenir des valeurs uniques. Product[Category] répète la même catégorie pour de nombreux produits : il n'existe pas de côté « un » et la relation ne peut pas être créée avec cette cardinalité."
references:
  - title: Many-to-many relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-many-to-many
