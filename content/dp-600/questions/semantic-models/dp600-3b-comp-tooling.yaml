id: dp600-3b-comp-tooling
objective: "3.1.7"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Your team plans three composite models in a Fabric workspace. The Direct Lake tables use Direct Lake on OneLake.

    Which tool should the team use to build each composite model? To answer, drag the appropriate tools to the correct models. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe prévoit trois modèles composites dans un espace de travail Fabric. Les tables Direct Lake utilisent Direct Lake sur OneLake.

    Quel outil l'équipe doit-elle utiliser pour créer chaque modèle composite ? Pour répondre, faites glisser les outils appropriés vers les modèles correspondants. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: desktop, text: Power BI Desktop }
    - { id: web, text: { en: "Power BI web modeling", fr: "Modélisation web Power BI" } }
    - { id: xmla, text: { en: "An XMLA-based tool", fr: "Un outil basé sur XMLA" } }
    - { id: builder, text: Power BI Report Builder }
  targets:
    - { id: t1, text: { en: "DirectQuery to a published Power BI semantic model, plus Import tables", fr: "DirectQuery vers un modèle sémantique Power BI publié, plus des tables Import" } }
    - { id: t2, text: { en: "Direct Lake tables combined with Import tables", fr: "Des tables Direct Lake combinées à des tables Import" } }
    - { id: t3, text: { en: "Direct Lake tables combined with DirectQuery tables", fr: "Des tables Direct Lake combinées à des tables DirectQuery" } }
answer:
  mapping: { t1: desktop, t2: web, t3: xmla }
explanation:
  correct:
    en: |
      DirectQuery to another Power BI semantic model, with or without Import or DirectQuery tables, is built in Power BI Desktop only. Import and Direct Lake tables can be combined only in Power BI web modeling, and DirectQuery and Direct Lake tables only through XMLA.
    fr: |
      DirectQuery vers un autre modèle sémantique Power BI, avec ou sans tables Import ou DirectQuery, se crée uniquement dans Power BI Desktop. Les tables Import et Direct Lake ne peuvent être combinées que dans la modélisation web Power BI, et les tables DirectQuery et Direct Lake uniquement via XMLA.
  options:
    builder:
      en: |
        Power BI Report Builder authors paginated reports; it does not edit semantic models.
      fr: |
        Power BI Report Builder sert à créer des rapports paginés ; il ne modifie pas les modèles sémantiques.
references:
  - title: Use composite models in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-composite-models
