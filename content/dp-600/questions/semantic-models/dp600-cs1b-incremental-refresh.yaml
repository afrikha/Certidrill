id: dp600-cs1b-incremental-refresh
objective: "3.2.5"
type: ordering
caseStudy: dp600-cs1b-woodgrove-bank
difficulty: 2
status: draft
stem:
  en: |
    You open the FinanceModel project in Power BI Desktop. You need to configure FinanceModel to meet the refresh requirement. Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous ouvrez le projet FinanceModel dans Power BI Desktop. Vous devez configurer FinanceModel pour satisfaire l'exigence d'actualisation. Quelles sont les quatre actions que vous devez effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et classez-les dans l'ordre correct.
body:
  count: 4
  actions:
    - { id: params, text: { en: "Create two Date/Time parameters named RangeStart and RangeEnd", fr: "Créer deux paramètres de type Date/Heure nommés RangeStart et RangeEnd" } }
    - { id: dateparams, text: { en: "Create two Date parameters named RangeStart and RangeEnd", fr: "Créer deux paramètres de type Date nommés RangeStart et RangeEnd" } }
    - { id: filter, text: { en: "Filter Transactions on TransactionDate >= RangeStart and TransactionDate < RangeEnd", fr: "Filtrer Transactions sur TransactionDate >= RangeStart et TransactionDate < RangeEnd" } }
    - { id: policy, text: { en: "Define an incremental refresh policy on Transactions that archives 8 years and refreshes 7 days", fr: "Définir sur Transactions une stratégie d'actualisation incrémentielle qui archive 8 ans et actualise 7 jours" } }
    - { id: realtime, text: { en: "Select Get the latest data in real time with DirectQuery in the policy", fr: "Sélectionner Get the latest data in real time with DirectQuery dans la stratégie" } }
    - { id: detect, text: { en: "Select Detect data changes and choose the TransactionDate column", fr: "Sélectionner Detect data changes et choisir la colonne TransactionDate" } }
    - { id: publish, text: { en: "Publish FinanceModel to WB-Finance", fr: "Publier FinanceModel dans WB-Finance" } }
answer:
  sequence: [params, filter, policy, publish]
explanation:
  correct:
    en: Incremental refresh needs two parameters of type Date/Time named exactly RangeStart and RangeEnd, then a filter that uses them (>= on one boundary, < on the other so that no row is counted twice). You then define the policy on the table (eight-year archive period, seven-day refresh period) and publish; the service creates the partitions and replaces the parameter values at refresh time.
    fr: L'actualisation incrémentielle exige deux paramètres de type Date/Heure nommés exactement RangeStart et RangeEnd, puis un filtre qui les utilise (>= sur une borne, < sur l'autre pour qu'aucune ligne ne soit comptée deux fois). Vous définissez ensuite la stratégie sur la table (période d'archivage de huit ans, période d'actualisation de sept jours) et vous publiez ; le service crée les partitions et remplace les valeurs des paramètres lors de l'actualisation.
  options:
    dateparams: { en: "The RangeStart and RangeEnd parameters must be of type Date/Time.", fr: "Les paramètres RangeStart et RangeEnd doivent être de type Date/Heure." }
    realtime: { en: "The real-time option adds a DirectQuery partition, but FinanceModel must remain in Import mode.", fr: "L'option temps réel ajoute une partition DirectQuery, alors que FinanceModel doit rester en mode Import." }
    detect: { en: "Detect data changes expects an audit column such as a last-modified date, not the column used to partition the data, and it is not required here.", fr: "Detect data changes attend une colonne d'audit comme une date de dernière modification, pas la colonne qui sert à partitionner les données, et n'est pas requis ici." }
references:
  - title: Configure incremental refresh and real-time data for Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-overview
