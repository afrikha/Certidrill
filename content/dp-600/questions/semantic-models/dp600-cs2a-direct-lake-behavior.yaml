id: dp600-cs2a-direct-lake-behavior
objective: "3.2.3"
type: yesno_statements
caseStudy: dp600-cs2a-coho-vineyard
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing the configuration of SM-Harvest against the semantic model requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la configuration de SM-Harvest au regard des exigences relatives aux modèles sémantiques.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "To meet requirement 5, you should set the DirectLakeBehavior property of SM-Harvest to DirectLakeOnly."
        fr: "Pour respecter l'exigence 5, vous devez définir la propriété DirectLakeBehavior de SM-Harvest sur DirectLakeOnly."
    - id: s2
      text:
        en: "To meet requirement 6, you should turn off Keep your Direct Lake data up to date for SM-Harvest and refresh SM-Harvest when the nightly notebook completes."
        fr: "Pour respecter l'exigence 6, vous devez désactiver Keep your Direct Lake data up to date pour SM-Harvest et actualiser SM-Harvest à la fin du notebook nocturne."
    - id: s3
      text:
        en: "Each refresh of SM-Harvest copies the data of the Delta tables into the model, so it takes about as long as an Import refresh of the same tables."
        fr: "Chaque actualisation de SM-Harvest copie les données des tables Delta dans le modèle : elle dure donc à peu près aussi longtemps qu'une actualisation en mode Import des mêmes tables."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "SM-Harvest uses Direct Lake on the SQL analytics endpoint, whose default DirectLakeBehavior value, Automatic, silently falls back to DirectQuery; DirectLakeOnly makes such queries fail with an error instead. Keep your Direct Lake data up to date is on by default and reframes the model whenever a Delta table changes, which would expose the tables already loaded while the notebook is still running; with the setting off, a refresh triggered at the end of the load exposes all the new data at once. A Direct Lake refresh is a framing operation that copies only metadata and usually takes a few seconds."
    fr: "SM-Harvest utilise Direct Lake sur le point de terminaison d'analytique SQL, dont la valeur par défaut de DirectLakeBehavior, Automatic, bascule silencieusement en mode DirectQuery ; DirectLakeOnly fait au contraire échouer ces requêtes avec une erreur. Keep your Direct Lake data up to date est activé par défaut et recadre le modèle dès qu'une table Delta change, ce qui exposerait les tables déjà chargées pendant que le notebook s'exécute encore ; avec ce paramètre désactivé, une actualisation déclenchée à la fin du chargement expose toutes les nouvelles données en une fois. Une actualisation Direct Lake est une opération de cadrage qui ne copie que des métadonnées et dure généralement quelques secondes."
references:
  - title: How Direct Lake works
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
