id: dp600-3b-fp-dax
objective: "3.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model that contains the tables **Customer** and **Product**. You edit the DAX of a field parameter named **Axis Field** so that report readers can group a chart by Customer, Category or Color.

    The fields must appear in the slicer in this order: Customer, Category, Color.

    How should you complete the DAX expression? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique qui contient les tables **Customer** et **Product**. Vous modifiez le DAX d'un paramètre de champ nommé **Axis Field** pour que les lecteurs du rapport puissent regrouper un graphique par Customer, Category ou Color.

    Les champs doivent apparaître dans le segment dans cet ordre : Customer, Category, Color.

    Comment devez-vous compléter l'expression DAX ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Axis Field = {
        ( "Customer", [[ref]] ( 'Customer'[Customer] ), 0 ),
        ( "Category", NAMEOF ( 'Product'[Category] ), [[ord]] ),
        ( "Color", NAMEOF ( 'Product'[Color] ), 2 )
    }
  slots:
    - id: ref
      options:
        - { id: values, text: VALUES }
        - { id: selval, text: SELECTEDVALUE }
        - { id: nameof, text: NAMEOF }
        - { id: related, text: RELATED }
    - id: ord
      options:
        - { id: o0, text: "0" }
        - { id: o1, text: "1" }
        - { id: o2, text: "2" }
        - { id: o3, text: "3" }
answer:
  values: { ref: nameof, ord: o1 }
shuffle: false
explanation:
  correct:
    en: |
      Each row of a field parameter has three values: the display name, a reference to the field returned by NAMEOF, and an order number. Category must come second, after Customer (0) and before Color (2), so its order value is 1. Values in the order column should be unique.
    fr: |
      Chaque ligne d'un paramètre de champ a trois valeurs : le nom affiché, une référence au champ renvoyée par NAMEOF et un numéro d'ordre. Category doit venir en deuxième position, après Customer (0) et avant Color (2) : sa valeur d'ordre est donc 1. Les valeurs de la colonne d'ordre doivent être uniques.
  options:
    values: { en: "VALUES returns the values of the column, not a reference to the field.", fr: "VALUES renvoie les valeurs de la colonne, pas une référence au champ." }
    selval: { en: "SELECTEDVALUE returns one value of the column in context, not the field itself.", fr: "SELECTEDVALUE renvoie une valeur de la colonne dans le contexte, pas le champ lui-même." }
    related: { en: "RELATED retrieves a value from a related table in a row context; it does not reference a field.", fr: "RELATED récupère une valeur d'une table liée dans un contexte de ligne ; il ne référence pas un champ." }
    o0: { en: "0 is already used by Customer, which must stay first.", fr: "0 est déjà utilisé par Customer, qui doit rester en premier." }
    o2: { en: "2 is used by Color, which must come after Category.", fr: "2 est utilisé par Color, qui doit venir après Category." }
    o3: { en: "3 would place Category after Color.", fr: "3 placerait Category après Color." }
references:
  - title: Use Field Parameters in Power BI Reports
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/power-bi-field-parameters
