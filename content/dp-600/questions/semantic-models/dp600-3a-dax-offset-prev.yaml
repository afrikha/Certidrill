id: dp600-3a-dax-offset-prev
objective: "3.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A matrix shows **Total Sales** by 'Date'[Year] and 'Date'[Month Number]. You need a measure that returns the sales of the previous month on each row. January must return the sales of December of the previous year.

    How should you complete the DAX expression? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une matrice affiche **Total Sales** par 'Date'[Year] et 'Date'[Month Number]. Vous avez besoin d'une mesure qui renvoie les ventes du mois précédent sur chaque ligne. Janvier doit renvoyer les ventes de décembre de l'année précédente.

    Comment devez-vous compléter l'expression DAX ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Sales Previous Month =
    CALCULATE (
        [Total Sales],
        [[fn]] (
            [[delta]],
            ALLSELECTED ( 'Date'[Year], 'Date'[Month Number] ),
            ORDERBY ( 'Date'[Year], ASC, 'Date'[Month Number], ASC )
        )
    )
  slots:
    - id: fn
      options:
        - { id: offset, text: OFFSET }
        - { id: index, text: INDEX }
        - { id: rank, text: RANK }
    - id: delta
      options:
        - { id: d-m1, text: "-1" }
        - { id: d-1, text: "1" }
        - { id: d-0, text: "0" }
answer:
  values: { fn: offset, delta: d-m1 }
explanation:
  correct:
    en: |
      OFFSET returns the row that is delta rows before (negative) or after (positive) the current row. Because the relation isn't partitioned and is ordered by year and then month, the row before January of a year is December of the previous year. CALCULATE uses that row as the filter.
    fr: |
      OFFSET renvoie la ligne située delta lignes avant (valeur négative) ou après (valeur positive) la ligne actuelle. Comme la relation n'est pas partitionnée et qu'elle est triée par année puis par mois, la ligne qui précède janvier d'une année est décembre de l'année précédente. CALCULATE utilise cette ligne comme filtre.
  options:
    index: { en: "INDEX returns the row at an absolute position, so -1 would be the last month of the selection on every row.", fr: "INDEX renvoie la ligne à une position absolue ; -1 serait donc le dernier mois de la sélection sur toutes les lignes." }
    rank: { en: "RANK returns a rank number, not a table that CALCULATE can use as a filter.", fr: "RANK renvoie un numéro de rang, pas une table que CALCULATE peut utiliser comme filtre." }
    d-1: { en: "A positive delta moves to the next month.", fr: "Un delta positif passe au mois suivant." }
    d-0: { en: "A delta of 0 returns the current month.", fr: "Un delta de 0 renvoie le mois actuel." }
references:
  - title: OFFSET function (DAX)
    url: https://learn.microsoft.com/en-us/dax/offset-function-dax
