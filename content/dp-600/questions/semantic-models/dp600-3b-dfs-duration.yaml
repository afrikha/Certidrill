id: dp600-3b-dfs-duration
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a semantic model that contains a measure named **[Duration (ms)]**, which returns a number of milliseconds. The model has no calculation groups.

    Report users want the values of [Duration (ms)] to be displayed as milliseconds, seconds, minutes or hours depending on their magnitude, for example 500 ms or 2.0 h. The measure is used in a line chart, which must keep plotting the values. No other measure must be affected.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique qui contient une mesure nommée **[Duration (ms)]**, qui renvoie un nombre de millisecondes. Le modèle ne contient aucun groupe de calcul.

    Les utilisateurs des rapports veulent que les valeurs de [Duration (ms)] s'affichent en millisecondes, secondes, minutes ou heures selon leur ordre de grandeur, par exemple 500 ms ou 2.0 h. La mesure est utilisée dans un graphique en courbes, qui doit continuer de tracer les valeurs. Aucune autre mesure ne doit être affectée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Rewrite the measure so that it returns FORMAT() of the value with the right unit", fr: "Réécrire la mesure pour qu'elle renvoie FORMAT() de la valeur avec la bonne unité" } }
    - { id: b, text: { en: "Set a static custom format string such as #,0 \"ms\" on the measure", fr: "Définir sur la mesure une chaîne de format personnalisée statique comme #,0 \"ms\"" } }
    - { id: c, text: { en: "Set Display units to Auto in the format options of the line chart", fr: "Définir Unités d'affichage sur Automatique dans les options de format du graphique en courbes" } }
    - { id: d, text: { en: "Set the Format of the measure to Dynamic and write a DAX expression that returns the format string", fr: "Définir le format de la mesure sur Dynamique et écrire une expression DAX qui renvoie la chaîne de format" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A dynamic format string for a measure (Measure tools > Format > Dynamic) is a separate DAX expression that returns the format string to use in the current context, for example with SWITCH on SELECTEDMEASURE(). The measure itself still returns a number, so the line chart keeps working, and only this measure is affected.
    fr: |
      Une chaîne de format dynamique pour une mesure (Outils de mesure > Format > Dynamique) est une expression DAX distincte qui renvoie la chaîne de format à utiliser dans le contexte actuel, par exemple avec SWITCH sur SELECTEDMEASURE(). La mesure elle-même renvoie toujours un nombre : le graphique en courbes continue de fonctionner et seule cette mesure est affectée.
  options:
    a:
      en: |
        FORMAT returns text, so the line chart could no longer plot the values as numbers.
      fr: |
        FORMAT renvoie du texte : le graphique en courbes ne pourrait plus tracer les valeurs comme des nombres.
    b:
      en: |
        A static format string applies the same unit to every value and cannot switch to seconds, minutes or hours.
      fr: |
        Une chaîne de format statique applique la même unité à toutes les valeurs et ne peut pas passer aux secondes, minutes ou heures.
    c:
      en: |
        Display units scale values by thousands or millions; they do not convert milliseconds into time units.
      fr: |
        Les unités d'affichage mettent les valeurs à l'échelle par milliers ou millions ; elles ne convertissent pas des millisecondes en unités de temps.
references:
  - title: Create dynamic format strings for measures
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-dynamic-format-strings
