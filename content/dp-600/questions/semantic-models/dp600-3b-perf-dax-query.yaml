id: dp600-3b-perf-dax-query
objective: "3.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You open a semantic model in Power BI Desktop. You rewrote the Total Sales measure to make a slow visual faster, and you want to test the new formula in DAX query view before you change the model.

    The query must return Total Sales for each year, sorted by year.

    How should you complete the DAX query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ouvrez un modèle sémantique dans Power BI Desktop. Vous avez réécrit la mesure Total Sales pour accélérer un visuel lent, et vous voulez tester la nouvelle formule dans la vue de requête DAX avant de modifier le modèle.

    La requête doit renvoyer Total Sales pour chaque année, triée par année.

    Comment devez-vous compléter la requête DAX ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    [[def]]
        MEASURE Sales[Total Sales] = SUMX ( Sales, Sales[Quantity] * Sales[Net Price] )
    [[ev]]
        SUMMARIZECOLUMNS ( 'Date'[Year], "Total Sales", [Total Sales] )
    [[ord]] 'Date'[Year]
  slots:
    - id: def
      options:
        - { id: define, text: DEFINE }
        - { id: var, text: VAR }
        - { id: calc, text: CALCULATE }
        - { id: ret, text: RETURN }
    - id: ev
      options:
        - { id: evaluate, text: EVALUATE }
        - { id: return2, text: RETURN }
        - { id: calctable, text: CALCULATETABLE }
        - { id: selcols, text: SELECTCOLUMNS }
    - id: ord
      options:
        - { id: orderby, text: ORDER BY }
        - { id: groupby, text: GROUP BY }
        - { id: startat, text: START AT }
        - { id: topn, text: TOPN }
answer:
  values: { def: define, ev: evaluate, ord: orderby }
explanation:
  correct:
    en: |
      A DAX query starts with an optional DEFINE block, where MEASURE creates a query-scoped measure that exists only for this query, so the model is not changed. EVALUATE is required and returns the table, here built by SUMMARIZECOLUMNS, and ORDER BY sorts the result.
    fr: |
      Une requête DAX commence par un bloc DEFINE facultatif, où MEASURE crée une mesure limitée à la requête qui n'existe que pour celle-ci : le modèle n'est pas modifié. EVALUATE est obligatoire et renvoie la table, construite ici par SUMMARIZECOLUMNS, et ORDER BY trie le résultat.
  options:
    var: { en: "VAR declares a variable; a query-scoped measure must be inside a DEFINE block.", fr: "VAR déclare une variable ; une mesure limitée à la requête doit se trouver dans un bloc DEFINE." }
    calc: { en: "CALCULATE is a function, not a keyword that starts a query.", fr: "CALCULATE est une fonction, pas un mot clé qui commence une requête." }
    ret: { en: "RETURN closes a VAR block in an expression; it does not start a query.", fr: "RETURN termine un bloc VAR dans une expression ; il ne commence pas une requête." }
    return2: { en: "A DAX query returns its result with EVALUATE, not RETURN.", fr: "Une requête DAX renvoie son résultat avec EVALUATE, pas RETURN." }
    calctable: { en: "CALCULATETABLE is a table function; the statement still needs EVALUATE.", fr: "CALCULATETABLE est une fonction de table ; l'instruction a quand même besoin d'EVALUATE." }
    selcols: { en: "SELECTCOLUMNS is a table function; the statement still needs EVALUATE.", fr: "SELECTCOLUMNS est une fonction de table ; l'instruction a quand même besoin d'EVALUATE." }
    groupby: { en: "GROUP BY is not a DAX query clause; grouping is done by SUMMARIZECOLUMNS.", fr: "GROUP BY n'est pas une clause de requête DAX ; le regroupement est fait par SUMMARIZECOLUMNS." }
    startat: { en: "START AT sets where an ordered result starts; it requires ORDER BY.", fr: "START AT définit où commence un résultat trié ; il exige ORDER BY." }
    topn: { en: "TOPN is a function that limits rows; it does not sort the final result.", fr: "TOPN est une fonction qui limite les lignes ; elle ne trie pas le résultat final." }
references:
  - title: DAX Query View
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/dax-query-view
