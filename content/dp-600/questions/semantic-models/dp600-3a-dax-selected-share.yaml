id: dp600-3a-dax-selected-share
objective: "3.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A report page contains a slicer on Store[Region] and a table visual that shows **Total Sales** by Store[Region].

    You need a measure named **Region Share** that returns each region's share of the sales of the regions selected in the slicer, so that the shares in the visual add up to 100 percent. The measure must return BLANK instead of an error when the denominator is zero.

    How should you complete the DAX expression? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une page de rapport contient un segment sur Store[Region] et un visuel table qui affiche **Total Sales** par Store[Region].

    Vous avez besoin d'une mesure nommée **Region Share** qui renvoie la part de chaque région dans les ventes des régions sélectionnées dans le segment, de sorte que les parts du visuel totalisent 100 %. La mesure doit renvoyer BLANK plutôt qu'une erreur quand le dénominateur est nul.

    Comment devez-vous compléter l'expression DAX ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Region Share =
    VAR _Selected =
        CALCULATE ( [Total Sales], [[fn]] ( Store[Region] ) )
    RETURN
        [[ret]]
  slots:
    - id: fn
      options:
        - { id: allselected, text: ALLSELECTED }
        - { id: all, text: ALL }
        - { id: removefilters, text: REMOVEFILTERS }
        - { id: values, text: VALUES }
    - id: ret
      options:
        - { id: div-ok, text: "DIVIDE ( [Total Sales], _Selected )" }
        - { id: div-rev, text: "DIVIDE ( _Selected, [Total Sales] )" }
        - { id: slash, text: "[Total Sales] / _Selected" }
        - { id: minus, text: "[Total Sales] - _Selected" }
answer:
  values: { fn: allselected, ret: div-ok }
explanation:
  correct:
    en: |
      ALLSELECTED removes the row filter of the visual on Region but keeps the filters that come from outside the visual, such as the slicer, so _Selected is the total of the selected regions. DIVIDE returns BLANK when the denominator is zero, whereas the / operator returns an error or infinity.
    fr: |
      ALLSELECTED supprime le filtre de ligne du visuel sur Region mais conserve les filtres venus de l'extérieur du visuel, comme le segment ; _Selected est donc le total des régions sélectionnées. DIVIDE renvoie BLANK quand le dénominateur est nul, alors que l'opérateur / renvoie une erreur ou l'infini.
  options:
    all: { en: "ALL also removes the slicer filter, so the shares would be relative to all regions.", fr: "ALL supprime aussi le filtre du segment ; les parts seraient alors calculées par rapport à toutes les régions." }
    removefilters: { en: "REMOVEFILTERS removes the slicer filter as well, like ALL.", fr: "REMOVEFILTERS supprime lui aussi le filtre du segment, comme ALL." }
    values: { en: "VALUES keeps the current region, so _Selected equals the region's own sales.", fr: "VALUES conserve la région actuelle ; _Selected serait égal aux ventes de la région elle-même." }
    div-rev: { en: "The numerator and denominator are reversed.", fr: "Le numérateur et le dénominateur sont inversés." }
    slash: { en: "The / operator doesn't return BLANK when the denominator is zero.", fr: "L'opérateur / ne renvoie pas BLANK quand le dénominateur est nul." }
    minus: { en: "A difference isn't a share.", fr: "Une différence n'est pas une part." }
references:
  - title: ALLSELECTED function (DAX)
    url: https://learn.microsoft.com/en-us/dax/allselected-function-dax
