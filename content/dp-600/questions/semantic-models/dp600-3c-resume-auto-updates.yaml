id: dp600-3c-resume-auto-updates
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Direct Lake semantic model named StockModel. **Keep your Direct Lake data up to date** is turned on. A Delta table that StockModel uses was deleted by mistake and restored a day later.

    Reports still show the data of two days ago, and the **Direct Lake** tab of the refresh history lists several failed refreshes from the time when the table was missing. You confirmed that all source tables now exist.

    You need to ensure that StockModel reflects Delta table changes automatically again. What should you do?
  fr: |
    Vous disposez d'un modèle sémantique Direct Lake nommé StockModel. **Keep your Direct Lake data up to date** est activé. Une table Delta qu'utilise StockModel a été supprimée par erreur, puis restaurée le lendemain.

    Les rapports affichent toujours les données d'il y a deux jours, et l'onglet **Direct Lake** de l'historique d'actualisation liste plusieurs actualisations en échec datant de la période où la table manquait. Vous avez vérifié que toutes les tables sources existent désormais.

    Vous devez vous assurer que StockModel reflète de nouveau automatiquement les modifications des tables Delta. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Run an on-demand refresh of StockModel and check that it completes without errors."
        fr: "Lancer une actualisation à la demande de StockModel et vérifier qu'elle se termine sans erreur."
    - id: b
      text:
        en: "Wait for the next change to the Delta tables, which restarts the automatic updates."
        fr: "Attendre la prochaine modification des tables Delta, qui redémarre les mises à jour automatiques."
    - id: c
      text:
        en: "Run OPTIMIZE on every Delta table that StockModel uses."
        fr: "Exécuter OPTIMIZE sur chaque table Delta qu'utilise StockModel."
    - id: d
      text:
        en: "Set the **Direct Lake behavior** property of StockModel to DirectQueryOnly."
        fr: "Définir la propriété **Direct Lake behavior** de StockModel sur DirectQueryOnly."
answer:
  optionId: a
explanation:
  correct:
    en: "After a non-recoverable error, such as a refresh that fails after several attempts, Power BI suspends the automatic updates of the model. They resume after a later on-demand refresh completes without errors."
    fr: "Après une erreur non récupérable, comme une actualisation qui échoue après plusieurs tentatives, Power BI suspend les mises à jour automatiques du modèle. Elles reprennent après qu'une actualisation à la demande ultérieure s'est terminée sans erreur."
  options:
    b: { en: "While automatic updates are suspended, Delta table changes don't trigger framing.", fr: "Tant que les mises à jour automatiques sont suspendues, les modifications des tables Delta ne déclenchent pas de cadrage." }
    c: { en: "OPTIMIZE compacts small Parquet files to respect the guardrails; it doesn't resume automatic updates.", fr: "OPTIMIZE compacte les petits fichiers Parquet pour respecter les garde-fous ; il ne relance pas les mises à jour automatiques." }
    d: { en: "DirectQueryOnly sends every query to the SQL analytics endpoint; it's meant to test fallback performance, not to fix refresh issues.", fr: "DirectQueryOnly envoie chaque requête au point de terminaison d'analytique SQL ; il sert à tester les performances en basculement, pas à corriger des problèmes d'actualisation." }
references:
  - title: How Direct Lake works
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works
