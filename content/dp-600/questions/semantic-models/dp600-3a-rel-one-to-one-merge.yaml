id: dp600-3a-rel-one-to-one-merge
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You import two tables from the same Azure SQL database into a semantic model: **Product** (SKU, Product, Color) and **ProductCategory** (SKU, Category). Power BI Desktop created a one-to-one relationship on SKU that filters in both directions. Some SKUs have no row in ProductCategory.

    Report authors need a Category > Product hierarchy. The solution must minimize the model size and show products without a category under an explicit label rather than BLANK.

    What should you do?
  fr: |
    Vous importez dans un modèle sémantique deux tables de la même base de données Azure SQL : **Product** (SKU, Product, Color) et **ProductCategory** (SKU, Category). Power BI Desktop a créé une relation un-à-un sur SKU qui filtre dans les deux directions. Certains SKU n'ont pas de ligne dans ProductCategory.

    Les auteurs de rapports ont besoin d'une hiérarchie Category > Product. La solution doit réduire au minimum la taille du modèle et afficher les produits sans catégorie sous une étiquette explicite plutôt que BLANK.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the relationship to one-to-many from ProductCategory to Product with a single direction, and hide SKU in Product.", fr: "Changer la relation en un-à-plusieurs de ProductCategory vers Product avec une direction unique, et masquer SKU dans Product." } }
    - { id: b, text: { en: "Add a calculated column to Product that uses RELATED to return the category, and hide ProductCategory.", fr: "Ajouter à Product une colonne calculée qui utilise RELATED pour renvoyer la catégorie, et masquer ProductCategory." } }
    - { id: c, text: { en: "Keep the one-to-one relationship, change its cross-filter direction to Single, and hide ProductCategory.", fr: "Conserver la relation un-à-un, passer sa direction de filtrage croisé à Unique et masquer ProductCategory." } }
    - { id: d, text: { en: "In Power Query, merge ProductCategory into Product with a left outer join, replace null categories with a label, and disable load for ProductCategory.", fr: "Dans Power Query, fusionner ProductCategory dans Product avec une jointure externe gauche, remplacer les catégories null par une étiquette et désactiver le chargement de ProductCategory." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      For a one-to-one relationship within the same source group, the guidance is to consolidate the tables. A left outer merge keeps every product, a replaced value such as "[Undefined]" avoids BLANK groups, and disabling load of the second query keeps it out of the model.
    fr: |
      Pour une relation un-à-un au sein d'un même groupe de sources, la recommandation est de regrouper les tables. Une fusion externe gauche conserve tous les produits, une valeur de remplacement comme « [Undefined] » évite les groupes BLANK, et désactiver le chargement de la seconde requête l'exclut du modèle.
  options:
    a: { en: "Changing the relationship doesn't consolidate the tables: the hierarchy would still span two tables, and products without a category would still show BLANK.", fr: "Modifier la relation ne regroupe pas les tables : la hiérarchie s'étendrait toujours sur deux tables, et les produits sans catégorie afficheraient toujours BLANK." }
    b: { en: "The calculated column builds the hierarchy, but ProductCategory stays loaded, which doesn't minimize the model size, and missing categories still return BLANK.", fr: "La colonne calculée permet la hiérarchie, mais ProductCategory reste chargée, ce qui ne réduit pas la taille du modèle au minimum, et les catégories manquantes renvoient toujours BLANK." }
    c: { en: "One-to-one relationships can only filter in both directions.", fr: "Les relations un-à-un ne peuvent filtrer que dans les deux directions." }
references:
  - title: One-to-one relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-one-to-one
