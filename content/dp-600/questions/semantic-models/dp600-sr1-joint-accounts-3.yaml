id: dp600-sr1-joint-accounts-3
objective: "3.1.3"
type: series_yesno
series: dp600-sr1-joint-accounts
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You set the Account to AccountHolder relationship to Both.
  fr: Vous définissez la relation entre Account et AccountHolder sur Les deux.
body:
  solution:
    en: |
      You create a one-to-many relationship from `Customer[CustomerID]` to `AccountHolder[CustomerID]` with the **Single** cross-filter direction, and a one-to-many relationship from `Account[AccountID]` to `AccountHolder[AccountID]` with the **Both** cross-filter direction.
    fr: |
      Vous créez une relation un-à-plusieurs de `Customer[CustomerID]` vers `AccountHolder[CustomerID]` avec la direction de filtrage croisé **Unique** (Single), et une relation un-à-plusieurs de `Account[AccountID]` vers `AccountHolder[AccountID]` avec la direction de filtrage croisé **Les deux** (Both).
answer: { value: true }
explanation:
  correct:
    en: |
      AccountHolder is a bridge table. The filter flows from Customer to AccountHolder, then, thanks to Both, from AccountHolder to Account, and from Account to Transaction, so each customer shows the balance of their own accounts. Only one relationship is bidirectional; customer balances are non-additive, so the total counts each joint account once.
    fr: |
      AccountHolder est une table de pont. Le filtre passe de Customer à AccountHolder, puis, grâce à Les deux, d'AccountHolder à Account, et d'Account à Transaction : chaque client affiche le solde de ses propres comptes. Une seule relation est bidirectionnelle ; les soldes par client ne sont pas additifs, et le total ne compte qu'une fois chaque compte joint.
references:
  - title: Many-to-many relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-many-to-many
