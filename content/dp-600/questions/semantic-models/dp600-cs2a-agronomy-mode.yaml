id: dp600-cs2a-agronomy-mode
objective: "3.2.4"
type: single
caseStudy: dp600-cs2a-coho-vineyard
difficulty: 3
status: draft
stem:
  en: |
    You need to create SM-Agronomy.

    Which storage mode should you use?
  fr: |
    Vous devez créer SM-Agronomy.

    Quel mode de stockage devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Direct Lake on the SQL analytics endpoint of LH-Vineyard", fr: "Direct Lake sur le point de terminaison d'analytique SQL de LH-Vineyard" }
    - id: b
      text: { en: "Direct Lake on OneLake", fr: "Direct Lake sur OneLake" }
    - id: c
      text: { en: "DirectQuery to the SQL analytics endpoint of LH-Vineyard", fr: "DirectQuery vers le point de terminaison d'analytique SQL de LH-Vineyard" }
    - id: d
      text: { en: "Import from the SQL analytics endpoint of LH-Vineyard", fr: "Import depuis le point de terminaison d'analytique SQL de LH-Vineyard" }
answer:
  optionId: b
explanation:
  correct:
    en: "Direct Lake on OneLake reads the Delta tables of one or more Fabric items, so one model can use tables of LH-Vineyard and of WH-Budget without shortcuts. It never falls back to DirectQuery: it always runs as if DirectLakeBehavior were DirectLakeOnly. No scheduled import is needed, because a refresh only reframes the model."
    fr: "Direct Lake sur OneLake lit les tables Delta d'un ou plusieurs éléments Fabric : un même modèle peut donc utiliser des tables de LH-Vineyard et de WH-Budget sans raccourcis. Il ne bascule jamais en mode DirectQuery : il s'exécute toujours comme si DirectLakeBehavior valait DirectLakeOnly. Aucune importation planifiée n'est nécessaire, car une actualisation ne fait que recadrer le modèle."
  options:
    a:
      en: "Direct Lake on SQL analytics endpoints uses a single Fabric data source, so it cannot add WH-Budget without a shortcut, and it can fall back to DirectQuery."
      fr: "Direct Lake sur les points de terminaison d'analytique SQL utilise une seule source de données Fabric : il ne peut donc pas ajouter WH-Budget sans raccourci, et il peut basculer en mode DirectQuery."
    c:
      en: "DirectQuery sends every query to the SQL analytics endpoint instead of reading the Delta tables directly."
      fr: "DirectQuery envoie chaque requête au point de terminaison d'analytique SQL au lieu de lire directement les tables Delta."
    d:
      en: "Import mode copies the data into the model and needs scheduled refreshes, which the requirement forbids."
      fr: "Le mode Import copie les données dans le modèle et nécessite des actualisations planifiées, ce que l'exigence interdit."
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
