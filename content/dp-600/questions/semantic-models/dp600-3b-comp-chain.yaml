id: dp600-3b-comp-chain
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have the following semantic models:

    | Model | Built on |
    | --- | --- |
    | SalesCore | Import tables from a warehouse |
    | SalesBudget | DirectQuery to SalesCore, plus an imported budget table |
    | SalesBudgetEU | DirectQuery to SalesBudget, plus an imported table of EU targets |

    An analyst plans to create a model named **SalesBudgetFR** by using DirectQuery to SalesBudgetEU and adding an imported table. The analyst has the Build permission on all the models.

    Which statement is true?
  fr: |
    Vous disposez des modèles sémantiques suivants :

    | Modèle | Basé sur |
    | --- | --- |
    | SalesCore | Tables Import provenant d'un entrepôt |
    | SalesBudget | DirectQuery vers SalesCore, plus une table de budget importée |
    | SalesBudgetEU | DirectQuery vers SalesBudget, plus une table importée d'objectifs UE |

    Un analyste prévoit de créer un modèle nommé **SalesBudgetFR** en utilisant DirectQuery vers SalesBudgetEU et en ajoutant une table importée. L'analyste a l'autorisation Build sur tous les modèles.

    Quelle affirmation est vraie ?
body:
  options:
    - { id: a, text: { en: "SalesBudgetFR is supported because the analyst has Build on every model of the chain.", fr: "SalesBudgetFR est pris en charge, car l'analyste a Build sur chaque modèle de la chaîne." } }
    - { id: b, text: { en: "SalesBudgetFR is supported only if all the models are in workspaces on the same capacity.", fr: "SalesBudgetFR n'est pris en charge que si tous les modèles sont dans des espaces de travail de la même capacité." } }
    - { id: c, text: { en: "SalesBudgetFR is supported once the discourage chaining flag of SalesBudgetEU is cleared.", fr: "SalesBudgetFR est pris en charge une fois l'indicateur de blocage du chaînage de SalesBudgetEU désactivé." } }
    - { id: d, text: { en: "SalesBudgetFR is not supported because the chain would contain more than three models.", fr: "SalesBudgetFR n'est pas pris en charge, car la chaîne contiendrait plus de trois modèles." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Models built on other semantic models form a chain, and the maximum supported chain length is three. SalesCore, SalesBudget and SalesBudgetEU already form a chain of three, so a fourth level returns errors; the analyst should build on SalesBudget or SalesCore instead.
    fr: |
      Les modèles construits sur d'autres modèles sémantiques forment une chaîne, et la longueur de chaîne maximale prise en charge est de trois. SalesCore, SalesBudget et SalesBudgetEU forment déjà une chaîne de trois : un quatrième niveau provoque des erreurs ; l'analyste doit plutôt partir de SalesBudget ou de SalesCore.
  options:
    a:
      en: |
        Build is required to create each link, but permissions do not lift the limit of three models in a chain.
      fr: |
        Build est nécessaire pour créer chaque maillon, mais les autorisations ne lèvent pas la limite de trois modèles par chaîne.
    b:
      en: |
        The chain length limit does not depend on where the models are hosted.
      fr: |
        La limite de longueur de chaîne ne dépend pas de l'endroit où les modèles sont hébergés.
    c:
      en: |
        The discourage chaining flag can only prevent a chain from being created or extended; clearing it does not raise the limit.
      fr: |
        L'indicateur de blocage du chaînage peut seulement empêcher de créer ou d'étendre une chaîne ; le désactiver ne relève pas la limite.
references:
  - title: Use composite models in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-composite-models
