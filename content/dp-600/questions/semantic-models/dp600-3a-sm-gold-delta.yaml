id: dp600-3a-sm-gold-delta
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named **Workspace1** that is assigned to an F64 capacity. Workspace1 contains a lakehouse named **Lakehouse1**. The gold layer of Lakehouse1 contains Delta tables, including **FactShipment**, which has 900 million rows. Spark notebooks update the tables every two hours.

    You need to create a semantic model for Power BI reports. Reports must show new data shortly after each load without a long refresh that copies the data, and query performance must be close to that of an in-memory model.

    Which storage mode should you use?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **Workspace1** affecté à une capacité F64. Workspace1 contient un lakehouse nommé **Lakehouse1**. La couche or de Lakehouse1 contient des tables Delta, dont **FactShipment**, qui compte 900 millions de lignes. Des notebooks Spark mettent à jour les tables toutes les deux heures.

    Vous devez créer un modèle sémantique pour des rapports Power BI. Les rapports doivent afficher les nouvelles données peu après chaque chargement, sans longue actualisation qui copie les données, et les performances des requêtes doivent être proches de celles d'un modèle en mémoire.

    Quel mode de stockage devez-vous utiliser ?
body:
  options:
    - { id: a, text: Import }
    - { id: b, text: DirectQuery }
    - { id: c, text: { en: "Dual", fr: "Double (Dual)" } }
    - { id: d, text: Direct Lake }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Direct Lake loads the columns of the Delta tables in OneLake into memory on demand and processes queries with the VertiPaq engine, as Import does. Its refresh (framing) only copies metadata that points to the latest Delta table versions, so it takes seconds. 900 million rows stays within the F64 guardrail of 1.5 billion rows per table.
    fr: |
      Direct Lake charge à la demande en mémoire les colonnes des tables Delta de OneLake et traite les requêtes avec le moteur VertiPaq, comme Import. Son actualisation (cadrage) ne copie que des métadonnées qui pointent vers les dernières versions des tables Delta ; elle prend donc quelques secondes. 900 millions de lignes restent dans le garde-fou F64 de 1,5 milliard de lignes par table.
  options:
    a: { en: "Import copies all the data at each refresh; with 900 million rows every two hours, the refresh is long.", fr: "Import copie toutes les données à chaque actualisation ; avec 900 millions de lignes toutes les deux heures, l'actualisation est longue." }
    b: { en: "DirectQuery sends every visual query to the SQL analytics endpoint and is generally slower than Direct Lake and Import.", fr: "DirectQuery envoie chaque requête de visuel au point de terminaison d'analytique SQL et est généralement plus lent que Direct Lake et Import." }
    c: { en: "Dual keeps an imported copy, so it still needs a full Import refresh.", fr: "Double conserve une copie importée ; il faut donc toujours une actualisation Import complète." }
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
