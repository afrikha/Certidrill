id: dp600-3a-ss-role-playing-steps
objective: "3.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Import semantic model that contains a **Flight** fact table and an **Airport** dimension table. Flight has the **DepartureAirportKey** and **ArrivalAirportKey** columns. Airport has an active relationship with Flight[ArrivalAirportKey]. You have already deleted the inactive relationship between Airport and Flight[DepartureAirportKey].

    The model uses row-level security, and report users must be able to filter flights by departure airport and by arrival airport in the same visual.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un modèle sémantique Import qui contient une table de faits **Flight** et une table de dimension **Airport**. Flight comporte les colonnes **DepartureAirportKey** et **ArrivalAirportKey**. Airport a une relation active avec Flight[ArrivalAirportKey]. Vous avez déjà supprimé la relation inactive entre Airport et Flight[DepartureAirportKey].

    Le modèle utilise la sécurité au niveau des lignes, et les utilisateurs des rapports doivent pouvoir filtrer les vols par aéroport de départ et par aéroport d'arrivée dans un même visuel.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: rename, text: { en: "Rename the Airport table to Arrival Airport.", fr: "Renommer la table Airport en Arrival Airport." } }
    - { id: calc, text: { en: "Create a calculated table by using the expression Departure Airport = 'Arrival Airport'.", fr: "Créer une table calculée avec l'expression Departure Airport = 'Arrival Airport'." } }
    - { id: rel, text: { en: "Create an active relationship between Departure Airport[AirportKey] and Flight[DepartureAirportKey].", fr: "Créer une relation active entre Departure Airport[AirportKey] et Flight[DepartureAirportKey]." } }
    - { id: userel, text: { en: "Create measures that use USERELATIONSHIP with Flight[DepartureAirportKey].", fr: "Créer des mesures qui utilisent USERELATIONSHIP avec Flight[DepartureAirportKey]." } }
    - { id: both, text: { en: "Set the cross-filter direction of the arrival relationship to Both.", fr: "Définir la direction du filtrage croisé de la relation d'arrivée sur Les deux (Both)." } }
    - { id: mm, text: { en: "Create a many-to-many relationship between Arrival Airport[AirportKey] and Flight[DepartureAirportKey].", fr: "Créer une relation plusieurs-à-plusieurs entre Arrival Airport[AirportKey] et Flight[DepartureAirportKey]." } }
answer:
  sequence: [ rename, calc, rel ]
explanation:
  correct:
    en: |
      When visuals must filter by several roles at once, and especially when RLS is defined, each role needs its own table with an active relationship. You rename the existing table after its role, duplicate it with a calculated table that references the new name, and then create the active relationship for the departure role. RLS filters propagate only through active relationships.
    fr: |
      Quand des visuels doivent filtrer par plusieurs rôles à la fois, et surtout quand une sécurité au niveau des lignes est définie, chaque rôle a besoin de sa propre table avec une relation active. Vous renommez la table existante d'après son rôle, la dupliquez par une table calculée qui référence le nouveau nom, puis créez la relation active du rôle de départ. Les filtres de sécurité au niveau des lignes ne se propagent que par les relations actives.
  options:
    userel: { en: "Inactive relationships can't filter both roles in the same visual, and RLS filters don't propagate through them.", fr: "Les relations inactives ne permettent pas de filtrer les deux rôles dans un même visuel, et les filtres de sécurité au niveau des lignes ne s'y propagent pas." }
    both: { en: "The filter direction doesn't add a departure role.", fr: "La direction du filtre n'ajoute pas de rôle de départ." }
    mm: { en: "AirportKey is unique, and a table can't have two active paths to Flight.", fr: "AirportKey est unique, et une table ne peut pas avoir deux chemins actifs vers Flight." }
references:
  - title: Active vs inactive relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-active-inactive
