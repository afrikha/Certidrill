id: dp600-3a-rel-switch-active
objective: "3.1.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a semantic model in Power BI Desktop. The **Date** table has two relationships with the **Sales** table: an active relationship on Sales[OrderDateKey] and an inactive relationship on Sales[ShipDateKey].

    The business now wants every visual to filter sales by ship date by default.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un modèle sémantique dans Power BI Desktop. La table **Date** a deux relations avec la table **Sales** : une relation active sur Sales[OrderDateKey] et une relation inactive sur Sales[ShipDateKey].

    L'entreprise veut désormais que tous les visuels filtrent les ventes par date d'expédition par défaut.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: open, text: { en: "On the Modeling tab, select Manage relationships.", fr: "Sous l'onglet Modélisation, sélectionner Gérer les relations." } }
    - { id: off, text: { en: "Edit the OrderDateKey relationship and clear Make this relationship active.", fr: "Modifier la relation sur OrderDateKey et désactiver Rendre cette relation active." } }
    - { id: on, text: { en: "Edit the ShipDateKey relationship and select Make this relationship active.", fr: "Modifier la relation sur ShipDateKey et activer Rendre cette relation active." } }
    - { id: both, text: { en: "Set the cross-filter direction of the ShipDateKey relationship to Both.", fr: "Définir la direction du filtrage croisé de la relation sur ShipDateKey sur Les deux (Both)." } }
    - { id: measure, text: { en: "Create measures that use USERELATIONSHIP with Sales[ShipDateKey].", fr: "Créer des mesures qui utilisent USERELATIONSHIP avec Sales[ShipDateKey]." } }
    - { id: autodetect, text: { en: "Select Autodetect in the Manage relationships dialog box.", fr: "Sélectionner Détection automatique dans la boîte de dialogue Gérer les relations." } }
answer:
  sequence: [ open, off, on ]
explanation:
  correct:
    en: |
      Only one relationship between two tables can be active, and it's the default filter path for visuals. To switch, you open Manage relationships, deactivate the current active relationship first, and then activate the other one.
    fr: |
      Une seule relation entre deux tables peut être active, et c'est le chemin de filtre par défaut des visuels. Pour basculer, vous ouvrez Gérer les relations, désactivez d'abord la relation active actuelle, puis activez l'autre.
  options:
    both: { en: "The filter direction doesn't make an inactive relationship active.", fr: "La direction du filtre ne rend pas active une relation inactive." }
    measure: { en: "USERELATIONSHIP only affects the measures that call it, not every visual.", fr: "USERELATIONSHIP n'affecte que les mesures qui l'appellent, pas tous les visuels." }
    autodetect: { en: "Autodetect creates missing relationships; it doesn't change which one is active.", fr: "La détection automatique crée les relations manquantes ; elle ne change pas celle qui est active." }
references:
  - title: Create and manage relationships in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-create-and-manage-relationships
