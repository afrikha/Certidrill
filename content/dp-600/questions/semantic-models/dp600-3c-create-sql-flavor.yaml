id: dp600-3c-create-sql-flavor
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a lakehouse named Lakehouse1. Its SQL analytics endpoint contains views that a new semantic model must use, so you decide to create a Direct Lake on SQL analytics endpoint model.

    You need to create the semantic model.

    What should you use?
  fr: |
    Vous disposez d'un lakehouse nommé Lakehouse1. Son point de terminaison d'analytique SQL contient des vues qu'un nouveau modèle sémantique doit utiliser : vous décidez donc de créer un modèle Direct Lake sur le point de terminaison d'analytique SQL.

    Vous devez créer le modèle sémantique.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: "In Power BI Desktop, connect to Lakehouse1 from the OneLake catalog and select the tables and views."
        fr: "Dans Power BI Desktop, se connecter à Lakehouse1 depuis le catalogue OneLake et sélectionner les tables et les vues."
    - id: b
      text:
        en: "On the page of the SQL analytics endpoint of Lakehouse1, select **New semantic model** and choose the Direct Lake on SQL option."
        fr: "Sur la page du point de terminaison d'analytique SQL de Lakehouse1, sélectionner **New semantic model** et choisir l'option Direct Lake sur SQL."
    - id: c
      text:
        en: "In the Power BI service, select **Create** > **OneLake catalog** and select Lakehouse1."
        fr: "Dans le service Power BI, sélectionner **Create** > **OneLake catalog** et sélectionner Lakehouse1."
    - id: d
      text:
        en: "In Power BI Desktop, use the SQL Server connector with the connection string of the SQL analytics endpoint and select DirectQuery."
        fr: "Dans Power BI Desktop, utiliser le connecteur SQL Server avec la chaîne de connexion du point de terminaison d'analytique SQL et sélectionner DirectQuery."
answer:
  optionId: b
explanation:
  correct:
    en: "New semantic model on the SQL analytics endpoint page is the creation experience that can produce either type, and it lets you choose Direct Lake on SQL. Power BI Desktop and the OneLake catalog in the Power BI service create Direct Lake on OneLake models."
    fr: "New semantic model sur la page du point de terminaison d'analytique SQL est l'expérience de création qui peut produire l'un ou l'autre type, et elle permet de choisir Direct Lake sur SQL. Power BI Desktop et le catalogue OneLake du service Power BI créent des modèles Direct Lake sur OneLake."
  options:
    a: { en: "Power BI Desktop creates Direct Lake on OneLake models, which don't support SQL views.", fr: "Power BI Desktop crée des modèles Direct Lake sur OneLake, qui ne prennent pas en charge les vues SQL." }
    c: { en: "The OneLake catalog entry point creates Direct Lake on OneLake models only.", fr: "Le point d'entrée du catalogue OneLake ne crée que des modèles Direct Lake sur OneLake." }
    d: { en: "This creates a DirectQuery model, not a Direct Lake model.", fr: "Cette méthode crée un modèle DirectQuery, pas un modèle Direct Lake." }
references:
  - title: Develop Direct Lake semantic models
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-develop
