id: dp600-3c-etl-auto-update
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a lakehouse named Lakehouse1 and a Direct Lake semantic model named SalesModel that uses the Delta tables of Lakehouse1. Every night, a pipeline loads the Delta tables in several stages that take two hours. SalesModel uses the default refresh settings.

    You need to ensure that reports never show the data of an incomplete load, and that the new data appears as soon as the pipeline finishes.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé Lakehouse1 et un modèle sémantique Direct Lake nommé SalesModel qui utilise les tables Delta de Lakehouse1. Chaque nuit, un pipeline charge les tables Delta en plusieurs étapes qui durent deux heures. SalesModel utilise les paramètres d'actualisation par défaut.

    Vous devez vous assurer que les rapports n'affichent jamais les données d'un chargement incomplet, et que les nouvelles données apparaissent dès la fin du pipeline.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Keep the default refresh settings, and set the **Direct Lake behavior** property of SalesModel to DirectQueryOnly."
        fr: "Conserver les paramètres d'actualisation par défaut, et définir la propriété **Direct Lake behavior** de SalesModel sur DirectQueryOnly."
    - id: b
      text:
        en: "Keep the default refresh settings, and add a scheduled refresh of SalesModel at 6:00 AM."
        fr: "Conserver les paramètres d'actualisation par défaut, et ajouter une actualisation planifiée de SalesModel à 6 h 00."
    - id: c
      text:
        en: "Turn off **Keep your Direct Lake data up to date**, and refresh SalesModel when the pipeline finishes."
        fr: "Désactiver **Keep your Direct Lake data up to date**, et actualiser SalesModel à la fin du pipeline."
    - id: d
      text:
        en: "Define an incremental refresh policy on the fact table of SalesModel with a refresh period of one day."
        fr: "Définir une stratégie d'actualisation incrémentielle sur la table de faits de SalesModel avec une période d'actualisation d'un jour."
answer:
  optionId: c
explanation:
  correct:
    en: "Keep your Direct Lake data up to date is on by default and reframes the model whenever it detects Delta table changes, including the changes of each stage of the load. When you turn it off, queries keep returning the data of the last framing, and a refresh at the end of the pipeline (from the portal, a schedule, the REST API or TOM) exposes the complete load in seconds."
    fr: "Keep your Direct Lake data up to date est activé par défaut et recadre le modèle chaque fois qu'il détecte des modifications des tables Delta, y compris celles de chaque étape du chargement. Une fois ce paramètre désactivé, les requêtes continuent de renvoyer les données du dernier cadrage, et une actualisation à la fin du pipeline (depuis le portail, une planification, l'API REST ou TOM) expose le chargement complet en quelques secondes."
  options:
    a: { en: "DirectQuery always reads the latest state of the tables, including partially loaded data, and is slower.", fr: "DirectQuery lit toujours l'état le plus récent des tables, y compris les données partiellement chargées, et il est plus lent." }
    b: { en: "Automatic updates stay on and still reframe the model during the load; a fixed time also delays the new data.", fr: "Les mises à jour automatiques restent actives et recadrent toujours le modèle pendant le chargement ; une heure fixe retarde aussi les nouvelles données." }
    d: { en: "Direct Lake models don't support model table partitions or incremental refresh policies.", fr: "Les modèles Direct Lake ne prennent en charge ni les partitions de table de modèle ni les stratégies d'actualisation incrémentielle." }
references:
  - title: How Direct Lake works
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
