id: dp600-3b-perf-direct-lake-agg
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric lakehouse named **Lakehouse1** that contains a Delta table named **fact_sales** with four billion rows. A semantic model named **Model1** uses Direct Lake on OneLake tables from Lakehouse1.

    The summary page of a report shows sales by month and by region, and its visuals are slow. A developer proposes to add an aggregation table to Model1 and to map it to fact_sales in Manage aggregations.

    What should you do instead?
  fr: |
    Vous disposez d'un lakehouse Fabric nommé **Lakehouse1** qui contient une table Delta nommée **fact_sales** de quatre milliards de lignes. Un modèle sémantique nommé **Model1** utilise des tables Direct Lake sur OneLake de Lakehouse1.

    La page de synthèse d'un rapport affiche les ventes par mois et par région, et ses visuels sont lents. Un développeur propose d'ajouter une table d'agrégation à Model1 et de la mapper à fact_sales dans Gérer les agrégations.

    Que devez-vous faire à la place ?
body:
  options:
    - { id: a, text: { en: "Turn on automatic aggregations for Model1", fr: "Activer les agrégations automatiques pour Model1" } }
    - { id: b, text: { en: "Create a monthly summary Delta table in Lakehouse1 and use it in the summary visuals", fr: "Créer dans Lakehouse1 une table Delta de synthèse mensuelle et l'utiliser dans les visuels de synthèse" } }
    - { id: c, text: { en: "Convert fact_sales in Model1 to a hybrid table with a DirectQuery partition", fr: "Convertir fact_sales dans Model1 en table hybride avec une partition DirectQuery" } }
    - { id: d, text: { en: "Split fact_sales in Model1 into one model partition per year", fr: "Diviser fact_sales dans Model1 en une partition de modèle par année" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Direct Lake models do not support user-defined aggregations, hybrid tables or model table partitions. A summary Delta table prepared upstream in the lakehouse can be added to Model1 as another Direct Lake table, so the summary visuals read far fewer rows.
    fr: |
      Les modèles Direct Lake ne prennent en charge ni les agrégations définies par l'utilisateur, ni les tables hybrides, ni les partitions de tables du modèle. Une table Delta de synthèse préparée en amont dans le lakehouse peut être ajoutée à Model1 comme une autre table Direct Lake : les visuels de synthèse lisent alors beaucoup moins de lignes.
  options:
    a:
      en: |
        Automatic aggregations are a feature of DirectQuery models, not of Direct Lake models.
      fr: |
        Les agrégations automatiques sont une fonctionnalité des modèles DirectQuery, pas des modèles Direct Lake.
    c:
      en: |
        Hybrid tables are not supported in Direct Lake models.
      fr: |
        Les tables hybrides ne sont pas prises en charge dans les modèles Direct Lake.
    d:
      en: |
        Model table partitions are not supported in Direct Lake; partitioning is done at the Delta table level.
      fr: |
        Les partitions de tables du modèle ne sont pas prises en charge dans Direct Lake ; le partitionnement se fait au niveau de la table Delta.
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
