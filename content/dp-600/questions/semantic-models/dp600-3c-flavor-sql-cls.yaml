id: dp600-3c-flavor-sql-cls
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named Warehouse1. In Warehouse1, column-level security grants most users SELECT on the Employee table except the Salary and BankAccount columns.

    You need to create a Direct Lake semantic model on Warehouse1. The model must enforce the column permissions of Warehouse1 for each user who runs a report, and the security must not be defined a second time in the model.

    Which configuration should you use?
  fr: |
    Vous disposez d'un entrepôt nommé Warehouse1. Dans Warehouse1, la sécurité au niveau des colonnes accorde à la plupart des utilisateurs SELECT sur la table Employee, sauf sur les colonnes Salary et BankAccount.

    Vous devez créer un modèle sémantique Direct Lake sur Warehouse1. Le modèle doit appliquer les autorisations de colonnes de Warehouse1 à chaque utilisateur qui exécute un rapport, et la sécurité ne doit pas être définie une seconde fois dans le modèle.

    Quelle configuration devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: "Direct Lake on OneLake with the default single sign-on connection"
        fr: "Direct Lake sur OneLake avec la connexion par authentification unique par défaut"
    - id: b
      text:
        en: "Direct Lake on OneLake with a fixed identity cloud connection"
        fr: "Direct Lake sur OneLake avec une connexion cloud à identité fixe"
    - id: c
      text:
        en: "Direct Lake on SQL analytics endpoint with a fixed identity cloud connection"
        fr: "Direct Lake sur le point de terminaison d'analytique SQL avec une connexion cloud à identité fixe"
    - id: d
      text:
        en: "Direct Lake on SQL analytics endpoint with the default single sign-on connection"
        fr: "Direct Lake sur le point de terminaison d'analytique SQL avec la connexion par authentification unique par défaut"
answer:
  optionId: d
explanation:
  correct:
    en: "Direct Lake on SQL honors the object-level and column-level security of the SQL analytics endpoint, and a query that touches a denied column returns an error. With the default single sign-on connection, Direct Lake checks the permissions of the user who runs the query."
    fr: "Direct Lake sur SQL respecte la sécurité au niveau de l'objet et au niveau des colonnes du point de terminaison d'analytique SQL, et une requête qui touche une colonne refusée renvoie une erreur. Avec la connexion par authentification unique par défaut, Direct Lake vérifie les autorisations de l'utilisateur qui exécute la requête."
  options:
    a: { en: "Direct Lake on OneLake doesn't apply the security defined at the SQL analytics endpoint; access depends on OneLake permissions.", fr: "Direct Lake sur OneLake n'applique pas la sécurité définie au point de terminaison d'analytique SQL ; l'accès dépend des autorisations OneLake." }
    b: { en: "Direct Lake on OneLake ignores SQL column-level security, and a fixed identity would also replace the user's permissions.", fr: "Direct Lake sur OneLake ignore la sécurité au niveau des colonnes SQL, et une identité fixe remplacerait aussi les autorisations de l'utilisateur." }
    c: { en: "With a fixed identity, the permissions of that identity, not those of each user, determine what the queries can read.", fr: "Avec une identité fixe, ce sont les autorisations de cette identité, et non celles de chaque utilisateur, qui déterminent ce que les requêtes peuvent lire." }
references:
  - title: Integrate Direct Lake security
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-security-integration
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
