id: dp600-cs3b-ship-date
objective: "3.1.2"
type: multi
caseStudy: dp600-cs3b-munsons
difficulty: 2
status: draft
stem:
  en: |
    You need to meet requirement 3 in SM-Sales.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence 3 dans SM-Sales.

    Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an active relationship between Sales[ShipDateKey] and 'Date'[DateKey], and set its cross-filter direction to Both.", fr: "Créer une relation active entre Sales[ShipDateKey] et 'Date'[DateKey], et définir sa direction de filtrage croisé sur Both." } }
    - { id: b, text: { en: "Create an inactive relationship between Sales[ShipDateKey] and 'Date'[DateKey].", fr: "Créer une relation inactive entre Sales[ShipDateKey] et 'Date'[DateKey]." } }
    - { id: c, text: { en: "Create a calculated table named Ship Date that returns 'Date', and relate it to Sales[ShipDateKey].", fr: "Créer une table calculée nommée Ship Date qui renvoie 'Date', et la lier à Sales[ShipDateKey]." } }
    - { id: d, text: "Sales by Ship Date = CALCULATE([Sales Amount], USERELATIONSHIP(Sales[ShipDateKey], 'Date'[DateKey]))" }
    - { id: e, text: "Sales by Ship Date = CALCULATE([Sales Amount], CROSSFILTER(Sales[ShipDateKey], 'Date'[DateKey], Both))" }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Date plays two roles for Sales. With a single date table, only one relationship between Sales and Date can be active, so the order date relationship stays active for the existing visuals and the ship date relationship is inactive. USERELATIONSHIP is the only way to use the inactive relationship, inside the CALCULATE of the measure.
    fr: |
      Date joue deux rôles pour Sales. Avec une seule table de dates, une seule relation entre Sales et Date peut être active : la relation sur la date de commande reste active pour les visuels existants et la relation sur la date d'expédition est inactive. USERELATIONSHIP est le seul moyen d'utiliser la relation inactive, dans le CALCULATE de la mesure.
  options:
    a: { en: "Only one relationship between two tables can be active, and the order date relationship must stay active for the existing visuals.", fr: "Une seule relation entre deux tables peut être active, et la relation sur la date de commande doit rester active pour les visuels existants." }
    c: { en: "A separate Ship Date table is a valid role-playing design, but the requirement asks for a single date table.", fr: "Une table Ship Date distincte est une conception valide de dimension à rôles multiples, mais l'exigence impose une seule table de dates." }
    e: { en: "CROSSFILTER changes the filter direction of a relationship; it does not activate an inactive relationship.", fr: "CROSSFILTER modifie la direction de filtrage d'une relation ; il n'active pas une relation inactive." }
references:
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
