id: dp600-3b-lsm-size-check
objective: "3.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS1** that is assigned to an F64 capacity. WS1 contains an Import semantic model named **Sales** that uses the large semantic model storage format and an incremental refresh policy. The XMLA endpoint is enabled.

    You need to find the size of the data of Sales.

    Which two methods can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS1** qui est attribué à une capacité F64. WS1 contient un modèle sémantique Import nommé **Sales** qui utilise le format de stockage de modèle sémantique volumineux et une stratégie d'actualisation incrémentielle. Le point de terminaison XMLA est activé.

    Vous devez déterminer la taille des données de Sales.

    Quelles sont les deux méthodes que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Download the .pbix file of Sales from WS1 and check the size of the file.", fr: "Télécharger le fichier .pbix de Sales depuis WS1 et vérifier la taille du fichier." } }
    - { id: b, text: { en: "Record the report visuals with Performance Analyzer and add up the DAX query durations.", fr: "Enregistrer les visuels du rapport avec l'Analyseur de performances et additionner les durées des requêtes DAX." } }
    - { id: c, text: { en: "Connect SQL Server Management Studio to the XMLA endpoint and view the estimated size in the properties of Sales.", fr: "Connecter SQL Server Management Studio au point de terminaison XMLA et consulter la taille estimée dans les propriétés de Sales." } }
    - { id: d, text: { en: "Open the refresh history of Sales in the semantic model settings.", fr: "Ouvrir l'historique d'actualisation de Sales dans les paramètres du modèle sémantique." } }
    - { id: e, text: { en: "Query the DISCOVER_STORAGE_TABLE_COLUMNS and DISCOVER_STORAGE_TABLE_COLUMN_SEGMENTS DMVs and add up the dictionary and used sizes.", fr: "Interroger les DMV DISCOVER_STORAGE_TABLE_COLUMNS et DISCOVER_STORAGE_TABLE_COLUMN_SEGMENTS et additionner les tailles de dictionnaire et utilisées." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      Through the XMLA endpoint, SSMS shows the estimated size of the model in its properties window. You can also run the two DMV queries and sum DICTIONARY_SIZE from DISCOVER_STORAGE_TABLE_COLUMNS and USED_SIZE from DISCOVER_STORAGE_TABLE_COLUMN_SEGMENTS to get the size in bytes.
    fr: |
      Via le point de terminaison XMLA, SSMS affiche la taille estimée du modèle dans sa fenêtre de propriétés. Vous pouvez aussi exécuter les deux requêtes DMV et additionner DICTIONARY_SIZE de DISCOVER_STORAGE_TABLE_COLUMNS et USED_SIZE de DISCOVER_STORAGE_TABLE_COLUMN_SEGMENTS pour obtenir la taille en octets.
  options:
    a:
      en: |
        A model that was published with an incremental refresh policy cannot be downloaded back as a .pbix file.
      fr: |
        Un modèle publié avec une stratégie d'actualisation incrémentielle ne peut pas être téléchargé de nouveau sous forme de fichier .pbix.
    b:
      en: |
        Performance Analyzer measures how long visuals take to load; durations say nothing about the size of the model.
      fr: |
        L'Analyseur de performances mesure le temps de chargement des visuels ; les durées n'indiquent rien sur la taille du modèle.
    d:
      en: |
        The refresh history shows the status and duration of refreshes, not the size of the model.
      fr: |
        L'historique d'actualisation montre l'état et la durée des actualisations, pas la taille du modèle.
references:
  - title: Large semantic models in Power BI Premium
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/service-premium-large-models
  - title: Configure incremental refresh and real-time data for Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-overview
