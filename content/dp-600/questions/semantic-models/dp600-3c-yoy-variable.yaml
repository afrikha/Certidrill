id: dp600-3c-yoy-variable
objective: "3.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a semantic model named SalesModel that contains a measure named [Sales] and a date table named Date. A measure named Sales YoY % repeats the expression that calculates the sales of the same period last year, once in the numerator and once in the denominator.

    You need to rewrite Sales YoY % so that the prior-year expression is evaluated only once.

    How should you complete the DAX expression? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique nommé SalesModel qui contient une mesure nommée [Sales] et une table de dates nommée Date. Une mesure nommée Sales YoY % répète l'expression qui calcule les ventes de la même période de l'année précédente, une fois au numérateur et une fois au dénominateur.

    Vous devez réécrire Sales YoY % pour que l'expression de l'année précédente ne soit évaluée qu'une seule fois.

    Comment devez-vous compléter l'expression DAX ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Sales YoY % =
    [[kw]] _PriorYear =
        CALCULATE ( [Sales], SAMEPERIODLASTYEAR ( 'Date'[Date] ) )
    [[ret]]
        DIVIDE ( [Sales] - _PriorYear, _PriorYear )
  slots:
    - id: kw
      options:
        - { id: var, text: VAR }
        - { id: define, text: DEFINE }
        - { id: measure, text: MEASURE }
        - { id: let, text: LET }
    - id: ret
      options:
        - { id: evaluate, text: EVALUATE }
        - { id: return, text: RETURN }
        - { id: in, text: IN }
        - { id: orderby, text: ORDER BY }
answer:
  values: { kw: var, ret: return }
explanation:
  correct:
    en: "In a measure, VAR stores the result of an expression and RETURN gives the value of the measure. The prior-year sales are calculated once and reused in the numerator and the denominator, which roughly halves the work compared with repeating the CALCULATE expression."
    fr: "Dans une mesure, VAR stocke le résultat d'une expression et RETURN donne la valeur de la mesure. Les ventes de l'année précédente sont calculées une seule fois et réutilisées au numérateur et au dénominateur, ce qui divise environ le travail par deux par rapport à la répétition de l'expression CALCULATE."
  options:
    define: { en: "DEFINE starts a block of definitions in a DAX query, not in a measure expression.", fr: "DEFINE ouvre un bloc de définitions dans une requête DAX, pas dans l'expression d'une mesure." }
    measure: { en: "MEASURE defines a query-scoped measure inside a DEFINE block of a DAX query.", fr: "MEASURE définit une mesure limitée à la requête dans un bloc DEFINE d'une requête DAX." }
    let: { en: "let ... in is Power Query M syntax, not DAX.", fr: "let ... in est une syntaxe Power Query M, pas DAX." }
    evaluate: { en: "EVALUATE introduces the table expression of a DAX query.", fr: "EVALUATE introduit l'expression de table d'une requête DAX." }
    in: { en: "IN is a DAX operator that tests membership in a list of values; it doesn't end a variable block.", fr: "IN est un opérateur DAX qui teste l'appartenance à une liste de valeurs ; il ne termine pas un bloc de variables." }
references:
  - title: Use variables to improve your DAX formulas
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-variables
