id: dp600-3b-perf-pa-categories
objective: "3.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You use Performance Analyzer in Power BI Desktop to examine a slow report. The report uses a composite model in which the Sales fact table is in DirectQuery mode and the other tables are in Import or Dual mode. You record the following results:

    | Visual | Results |
    | --- | --- |
    | Table1 | DAX query: 4,800 ms; Visual display: 60 ms; Other: 30 ms. The visual uses Import tables only, with a measure that nests FILTER over a large Import table. |
    | Scatter1 | DAX query: 90 ms; Visual display: 3,900 ms. The visual plots 40,000 points. |
    | Card7 | DAX query: 15 ms; Visual display: 10 ms; Other: 2,600 ms. The page contains 35 visuals. |
    | Matrix1 | Direct query: 5,200 ms. The visual shows Sales by month and by product category. |

    Which action should you take for each visual? To answer, drag the appropriate actions to the correct visuals. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez l'Analyseur de performances de Power BI Desktop pour examiner un rapport lent. Le rapport utilise un modèle composite dans lequel la table de faits Sales est en mode DirectQuery et les autres tables en mode Import ou Double. Vous relevez les résultats suivants :

    | Visuel | Résultats |
    | --- | --- |
    | Table1 | Requête DAX : 4 800 ms ; Affichage visuel : 60 ms ; Autre : 30 ms. Le visuel n'utilise que des tables Import, avec une mesure qui imbrique FILTER sur une grande table Import. |
    | Scatter1 | Requête DAX : 90 ms ; Affichage visuel : 3 900 ms. Le visuel trace 40 000 points. |
    | Card7 | Requête DAX : 15 ms ; Affichage visuel : 10 ms ; Autre : 2 600 ms. La page contient 35 visuels. |
    | Matrix1 | Direct query : 5 200 ms. Le visuel affiche Sales par mois et par catégorie de produits. |

    Quelle action devez-vous effectuer pour chaque visuel ? Pour répondre, faites glisser les actions appropriées vers les visuels correspondants. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dax, text: { en: "Rewrite the measure to simplify its DAX", fr: "Réécrire la mesure pour simplifier son DAX" } }
    - { id: topn, text: { en: "Apply a Top N filter to reduce the data points", fr: "Appliquer un filtre Top N pour réduire les points de données" } }
    - { id: fewer, text: { en: "Move part of the visuals to drillthrough or tooltip pages", fr: "Déplacer une partie des visuels vers des pages d'extraction ou d'info-bulle" } }
    - { id: agg, text: { en: "Add an Import aggregation table mapped to Sales", fr: "Ajouter une table d'agrégation Import mappée à Sales" } }
    - { id: pause, text: { en: "Select Pause visuals on the Optimize ribbon", fr: "Sélectionner Suspendre les visuels (Pause visuals) dans le ruban Optimiser" } }
  targets:
    - { id: t1, text: Table1 }
    - { id: t2, text: Scatter1 }
    - { id: t3, text: Card7 }
    - { id: t4, text: Matrix1 }
answer:
  mapping: { t1: dax, t2: topn, t3: fewer, t4: agg }
explanation:
  correct:
    en: |
      A long DAX query on Import tables points to the calculation, so the measure must be simplified. A long visual display time means the visual takes long to draw, here because of 40,000 points. Other is the time spent preparing queries or waiting for other visuals, so fewer visuals per page helps. A long Direct query time is the source query; an Import aggregation at month and category level can answer Matrix1 from memory.
    fr: |
      Une requête DAX longue sur des tables Import désigne le calcul : la mesure doit être simplifiée. Un affichage visuel long signifie que le visuel met du temps à se dessiner, ici à cause de 40 000 points. Autre correspond au temps de préparation des requêtes ou d'attente des autres visuels : moins de visuels par page aide. Un temps Direct query long correspond à la requête à la source ; une agrégation Import au niveau mois et catégorie peut servir Matrix1 depuis la mémoire.
  options:
    pause:
      en: |
        Pause visuals stops queries while you edit a report; it does not make any visual faster for report users.
      fr: |
        Suspendre les visuels arrête les requêtes pendant que vous modifiez un rapport ; cela n'accélère aucun visuel pour les utilisateurs.
references:
  - title: Use Performance Analyzer to examine report performance
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-performance-analyzer
  - title: Optimization guide for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/power-bi-optimization
