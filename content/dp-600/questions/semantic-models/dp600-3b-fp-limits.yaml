id: dp600-3b-fp-limits
objective: "3.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are designing a Power BI report for Contoso. A field parameter named **Breakdown** will let readers choose whether visuals group data by Customer, Product or Region.

    Which two statements about field parameters are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez un rapport Power BI pour Contoso. Un paramètre de champ nommé **Breakdown** permettra aux lecteurs de choisir si les visuels regroupent les données par Customer, Product ou Region.

    Quelles sont les deux affirmations vraies sur les paramètres de champ ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A column aggregated as an implicit measure, such as Sum of Sales[Amount], can be added to a field parameter.", fr: "Une colonne agrégée comme mesure implicite, comme Somme de Sales[Amount], peut être ajoutée à un paramètre de champ." } }
    - { id: b, text: { en: "When a reader clears every selection in the Breakdown slicer, visuals behave as if all the fields were selected.", fr: "Quand un lecteur efface toutes les sélections du segment Breakdown, les visuels se comportent comme si tous les champs étaient sélectionnés." } }
    - { id: c, text: { en: "Breakdown can be used as the linked field of a drillthrough page.", fr: "Breakdown peut être utilisé comme champ lié d'une page d'extraction." } }
    - { id: d, text: { en: "In a report that uses a live connection to a published semantic model, you must add a local model before you can create Breakdown.", fr: "Dans un rapport qui utilise une connexion active à un modèle sémantique publié, vous devez ajouter un modèle local avant de pouvoir créer Breakdown." } }
    - { id: e, text: { en: "Q&A visuals respond to the field selected in Breakdown.", fr: "Les visuels Q&R tiennent compte du champ sélectionné dans Breakdown." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Readers cannot select "no field": selecting nothing in the slicer is the same as selecting every field. Field parameters cannot be created in a live connection without a local model; with DirectQuery for Power BI semantic models (Make changes to this model), the local model makes them available.
    fr: |
      Les lecteurs ne peuvent pas sélectionner « aucun champ » : ne rien sélectionner dans le segment revient à sélectionner tous les champs. Les paramètres de champ ne peuvent pas être créés sur une connexion active sans modèle local ; avec DirectQuery pour les modèles sémantiques Power BI (Apporter des modifications à ce modèle), le modèle local les rend disponibles.
  options:
    a: { en: "Implicit measures are not supported; create an explicit measure for the aggregated column.", fr: "Les mesures implicites ne sont pas prises en charge ; créez une mesure explicite pour la colonne agrégée." }
    c: { en: "Field parameters cannot be the linked fields of drillthrough or tooltip pages; link the individual fields instead.", fr: "Les paramètres de champ ne peuvent pas être les champs liés de pages d'extraction ou d'info-bulle ; liez plutôt les champs individuels." }
    e: { en: "AI visuals and Q&A are not supported with field parameters.", fr: "Les visuels IA et Q&R ne sont pas pris en charge avec les paramètres de champ." }
references:
  - title: Use Field Parameters in Power BI Reports
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/power-bi-field-parameters
