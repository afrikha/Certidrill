id: dp600-3c-filter-arguments
objective: "3.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a semantic model named SalesModel in Import mode. SalesModel contains a measure named [Sales], a measure named [Profit], a table named Product and a date table named Date.

    You need to write three CALCULATE filter arguments for new measures. Each filter argument must return the required result and provide the best query performance.

    Which filter argument should you use for each requirement? To answer, drag the appropriate filter arguments to the correct requirements. Each filter argument may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un modèle sémantique nommé SalesModel en mode Import. SalesModel contient une mesure nommée [Sales], une mesure nommée [Profit], une table nommée Product et une table de dates nommée Date.

    Vous devez écrire trois arguments de filtre de CALCULATE pour de nouvelles mesures. Chaque argument de filtre doit renvoyer le résultat attendu et offrir les meilleures performances de requête.

    Quel argument de filtre devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les arguments de filtre appropriés vers les exigences correspondantes. Chaque argument de filtre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: bool
      text: |-
        'Product'[Color] = "Red"
    - id: keep
      text: |-
        KEEPFILTERS ( 'Product'[Color] = "Red" )
    - id: filterprod
      text: |-
        FILTER ( 'Product', 'Product'[Color] = "Red" )
    - id: filtermonth
      text: |-
        FILTER ( VALUES ( 'Date'[Month] ), [Profit] > 0 )
    - id: filtersales
      text: |-
        FILTER ( Sales, [Profit] > 0 )
  targets:
    - id: replace
      text:
        en: "Sales of red products, replacing any filter that a slicer applies to the Color column"
        fr: "Ventes des produits rouges, en remplaçant tout filtre qu'un segment applique à la colonne Color"
    - id: intersect
      text:
        en: "Sales of red products, keeping any filter that a slicer applies to the Color column"
        fr: "Ventes des produits rouges, en conservant tout filtre qu'un segment applique à la colonne Color"
    - id: profitable
      text:
        en: "Sales of the months that have a positive profit"
        fr: "Ventes des mois dont le bénéfice est positif"
answer:
  mapping: { replace: bool, intersect: keep, profitable: filtermonth }
explanation:
  correct:
    en: |
      A Boolean filter argument on one column is the fastest form, because the column store filters columns efficiently; on its own it overwrites existing filters on the Color column. Wrapping it in KEEPFILTERS keeps the existing filters on Color and intersects them with the new one. A condition that uses a measure can't be a Boolean filter argument, so FILTER is required, and iterating the distinct months returned by VALUES is much cheaper than iterating the fact table.
    fr: |
      Un argument de filtre booléen sur une seule colonne est la forme la plus rapide, car le stockage en colonnes filtre efficacement les colonnes ; seul, il remplace les filtres existants sur la colonne Color. L'encapsuler dans KEEPFILTERS conserve les filtres existants sur Color et les croise avec le nouveau. Une condition qui utilise une mesure ne peut pas être un argument de filtre booléen : FILTER est alors nécessaire, et itérer les mois distincts renvoyés par VALUES coûte beaucoup moins cher qu'itérer la table de faits.
  options:
    filterprod:
      en: "FILTER over the Product table returns the same result as KEEPFILTERS, but it evaluates the condition row by row and is less efficient."
      fr: "FILTER sur la table Product renvoie le même résultat que KEEPFILTERS, mais il évalue la condition ligne par ligne et il est moins efficace."
    filtersales:
      en: "FILTER over the Sales fact table evaluates [Profit] with a context transition for every sales row, which is slow and filters sales rows instead of months."
      fr: "FILTER sur la table de faits Sales évalue [Profit] avec une transition de contexte pour chaque ligne de ventes : c'est lent, et cela filtre des lignes de ventes au lieu de mois."
references:
  - title: Avoid using FILTER as a filter argument in DAX
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-avoid-avoid-filter-as-filter-argument
  - title: CALCULATE
    url: https://learn.microsoft.com/en-us/dax/calculate-function-dax
