id: dp600-3b-comp-viewer-perm
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your company has two Fabric workspaces, **WS-Core** and **WS-Finance**, that are assigned to an F64 capacity. WS-Core contains a semantic model named **SalesModel**. WS-Finance contains a composite model named **FinanceExt** that a developer created by using DirectQuery to SalesModel and by adding an imported budget table.

    Finance analysts have the Viewer role in WS-Finance and no access to WS-Core. When they open a report on FinanceExt, the visuals that use tables of SalesModel fail.

    You need to fix the issue. The solution must follow the principle of least privilege. What should you grant to the analysts?
  fr: |
    Votre entreprise dispose de deux espaces de travail Fabric, **WS-Core** et **WS-Finance**, attribués à une capacité F64. WS-Core contient un modèle sémantique nommé **SalesModel**. WS-Finance contient un modèle composite nommé **FinanceExt** qu'un développeur a créé en utilisant DirectQuery vers SalesModel et en ajoutant une table de budget importée.

    Les analystes financiers ont le rôle Viewer dans WS-Finance et aucun accès à WS-Core. Quand ils ouvrent un rapport basé sur FinanceExt, les visuels qui utilisent des tables de SalesModel échouent.

    Vous devez résoudre le problème. La solution doit respecter le principe du moindre privilège. Que devez-vous accorder aux analystes ?
body:
  options:
    - { id: a, text: { en: "The Read permission on SalesModel", fr: "L'autorisation Read sur SalesModel" } }
    - { id: b, text: { en: "The Build permission on SalesModel", fr: "L'autorisation Build sur SalesModel" } }
    - { id: c, text: { en: "The Viewer role in WS-Core", fr: "Le rôle Viewer dans WS-Core" } }
    - { id: d, text: { en: "The Contributor role in WS-Finance", fr: "Le rôle Contributor dans WS-Finance" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      FinanceExt queries SalesModel with the identity of each user, so viewers need Read on the composite model and on every source semantic model in the chain. The Build permission is needed by the owner who creates the composite model, not by the report viewers on a capacity.
    fr: |
      FinanceExt interroge SalesModel avec l'identité de chaque utilisateur : les lecteurs ont donc besoin de Read sur le modèle composite et sur chaque modèle sémantique source de la chaîne. L'autorisation Build est nécessaire au propriétaire qui crée le modèle composite, pas aux lecteurs des rapports sur une capacité.
  options:
    b:
      en: |
        Build lets users create content on SalesModel; viewing reports on FinanceExt only needs Read.
      fr: |
        Build permet de créer du contenu sur SalesModel ; consulter des rapports sur FinanceExt ne nécessite que Read.
    c:
      en: |
        The Viewer role would give Read access to every item of WS-Core, which is more than needed.
      fr: |
        Le rôle Viewer donnerait un accès en lecture à tous les éléments de WS-Core, ce qui dépasse le besoin.
    d:
      en: |
        A role in WS-Finance does not give any access to SalesModel, which is in WS-Core.
      fr: |
        Un rôle dans WS-Finance ne donne aucun accès à SalesModel, qui se trouve dans WS-Core.
references:
  - title: Use composite models in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-composite-models
