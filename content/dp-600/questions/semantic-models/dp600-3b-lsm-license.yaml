id: dp600-3b-lsm-license
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a workspace named **Analytics** that uses the **Pro** license mode. You plan to publish to Analytics an Import semantic model named **Claims** that will reach 18 GB after one year of incremental refreshes.

    Claims must stay in Import mode. What should you do?
  fr: |
    Vous disposez d'un espace de travail nommé **Analytics** qui utilise le mode de licence **Pro**. Vous prévoyez de publier dans Analytics un modèle sémantique Import nommé **Claims** qui atteindra 18 Go après un an d'actualisations incrémentielles.

    Claims doit rester en mode Import. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep the Pro license mode and turn on the large format for Claims", fr: "Conserver le mode de licence Pro et activer le format volumineux pour Claims" } }
    - { id: b, text: { en: "Keep the Pro license mode and partition Claims by year", fr: "Conserver le mode de licence Pro et partitionner Claims par année" } }
    - { id: c, text: { en: "Assign Analytics to an F256 capacity and turn on query scale-out for Claims", fr: "Attribuer Analytics à une capacité F256 et activer Query scale-out pour Claims" } }
    - { id: d, text: { en: "Assign Analytics to an F256 capacity and turn on the large format for Claims", fr: "Attribuer Analytics à une capacité F256 et activer le format volumineux pour Claims" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The large semantic model storage format is available on Fabric F, Premium P and Embedded A capacities and with Premium Per User. Once Analytics is on an F256 capacity, turning on the format lets Claims grow beyond the default limit, up to the memory of the capacity.
    fr: |
      Le format de stockage de modèle sémantique volumineux est disponible sur les capacités Fabric F, Premium P et Embedded A, ainsi qu'avec Premium par utilisateur. Une fois Analytics sur une capacité F256, l'activation du format permet à Claims de dépasser la limite par défaut, jusqu'à la mémoire de la capacité.
  options:
    a:
      en: |
        Semantic models in Pro workspaces stay limited to 1 GB.
      fr: |
        Les modèles sémantiques des espaces de travail Pro restent limités à 1 Go.
    b:
      en: |
        Partitions change how a table is refreshed, not the size limit; a Pro workspace still caps the model at 1 GB.
      fr: |
        Les partitions changent la façon dont une table est actualisée, pas la limite de taille ; un espace de travail Pro plafonne toujours le modèle à 1 Go.
    c:
      en: |
        Query scale-out adds read replicas; without the large format, Claims cannot grow to 18 GB.
      fr: |
        Query scale-out ajoute des réplicas en lecture ; sans le format volumineux, Claims ne peut pas atteindre 18 Go.
references:
  - title: Large semantic models in Power BI Premium
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/service-premium-large-models
