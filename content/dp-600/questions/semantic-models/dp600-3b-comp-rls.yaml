id: dp600-3b-comp-rls
objective: "3.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a semantic model named **SalesModel** that contains a **Region** table and a row-level security (RLS) role that filters Region by using USERPRINCIPALNAME(). Regional managers are members of the role.

    A developer creates a composite model named **TargetsExt** by using DirectQuery to SalesModel, then imports a table named **Targets** from an Excel workbook and relates Targets to Region. The managers must see only the targets of their own region in reports on TargetsExt.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique nommé **SalesModel** qui contient une table **Region** et un rôle de sécurité au niveau des lignes (RLS) qui filtre Region avec USERPRINCIPALNAME(). Les responsables régionaux sont membres du rôle.

    Un développeur crée un modèle composite nommé **TargetsExt** en utilisant DirectQuery vers SalesModel, puis importe une table nommée **Targets** depuis un classeur Excel et la relie à Region. Dans les rapports basés sur TargetsExt, les responsables ne doivent voir que les objectifs de leur propre région.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In TargetsExt, create a role that filters the remote Region table.", fr: "Dans TargetsExt, créer un rôle qui filtre la table distante Region." } }
    - { id: b, text: { en: "In TargetsExt, create a role that filters Targets by using USERPRINCIPALNAME().", fr: "Dans TargetsExt, créer un rôle qui filtre Targets avec USERPRINCIPALNAME()." } }
    - { id: c, text: { en: "Add Targets to SalesModel and let the existing role filter it.", fr: "Ajouter Targets à SalesModel et laisser le rôle existant la filtrer." } }
    - { id: d, text: { en: "Keep TargetsExt as is, because the role of SalesModel filters Targets.", fr: "Conserver TargetsExt tel quel, car le rôle de SalesModel filtre Targets." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In a chained model, RLS applies only in the source group where it is defined. You cannot define RLS on a table loaded from a remote model or on a local table that is related to another source group, and the role of SalesModel does not filter local tables of TargetsExt. Adding Targets to SalesModel puts it in the same model as Region, where the existing role filters it.
    fr: |
      Dans un modèle chaîné, la RLS ne s'applique que dans le groupe de sources où elle est définie. Vous ne pouvez pas définir de RLS sur une table chargée depuis un modèle distant, ni sur une table locale reliée à un autre groupe de sources, et le rôle de SalesModel ne filtre pas les tables locales de TargetsExt. Ajouter Targets à SalesModel la place dans le même modèle que Region, où le rôle existant la filtre.
  options:
    a:
      en: |
        RLS cannot be defined on tables that come from a remote semantic model.
      fr: |
        La RLS ne peut pas être définie sur des tables provenant d'un modèle sémantique distant.
    b:
      en: |
        Targets is related to a table of another source group, and RLS cannot be defined on such a local table.
      fr: |
        Targets est reliée à une table d'un autre groupe de sources, et la RLS ne peut pas être définie sur une telle table locale.
    d:
      en: |
        RLS defined in a remote model does not apply to the tables of other source groups, so every manager would see all the targets.
      fr: |
        La RLS définie dans un modèle distant ne s'applique pas aux tables des autres groupes de sources : chaque responsable verrait tous les objectifs.
