id: dp600-cs4b-staffing-composite
objective: "3.1.7"
type: single
caseStudy: dp600-cs4b-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    A finance controller opens Power BI Desktop to build the staffing report. The solution must meet the fifth requirement for semantic models.

    What should the finance controller do?
  fr: |
    Un contrôleur financier ouvre Power BI Desktop pour créer le rapport sur les effectifs. La solution doit satisfaire la cinquième exigence relative aux modèles sémantiques.

    Que doit faire le contrôleur financier ?
body:
  options:
    - { id: a, text: { en: "Connect to sqldb-ehr-reporting in DirectQuery mode, and then import StaffingBudget.xlsx into the same model.", fr: "Se connecter à sqldb-ehr-reporting en mode DirectQuery, puis importer StaffingBudget.xlsx dans le même modèle." } }
    - { id: b, text: { en: "Connect live to SM-Operations, select Make changes to this model, and then import StaffingBudget.xlsx.", fr: "Se connecter en direct à SM-Operations, sélectionner Apporter des modifications à ce modèle, puis importer StaffingBudget.xlsx." } }
    - { id: c, text: { en: "Open a Power BI template (.pbit) exported from SM-Operations, and then import StaffingBudget.xlsx.", fr: "Ouvrir un modèle Power BI (.pbit) exporté depuis SM-Operations, puis importer StaffingBudget.xlsx." } }
    - { id: d, text: { en: "Connect live to SM-Operations, and then use Get data to import StaffingBudget.xlsx into the live connection.", fr: "Se connecter en direct à SM-Operations, puis utiliser Obtenir les données pour importer StaffingBudget.xlsx dans la connexion active." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Make changes to this model adds a local model to the live connection. The tables of SM-Operations become DirectQuery tables that query the published model, so no data is copied and the RLS defined in SM-Operations still applies, and the workbook is added in Import mode. The controllers have the Build permission that this requires."
    fr: "Apporter des modifications à ce modèle ajoute un modèle local à la connexion active. Les tables de SM-Operations deviennent des tables DirectQuery qui interrogent le modèle publié : aucune donnée n'est copiée et la RLS définie dans SM-Operations s'applique toujours, et le classeur est ajouté en mode Import. Les contrôleurs ont l'autorisation Build que cela exige."
  options:
    a: { en: "Querying the source database bypasses SM-Operations: its measures and its RLS role would not apply.", fr: "Interroger la base de données source contourne SM-Operations : ses mesures et son rôle RLS ne s'appliqueraient pas." }
    c: { en: "A template recreates a copy of the model that must be refreshed and published separately, which the requirement forbids.", fr: "Un modèle .pbit recrée une copie du modèle qu'il faut actualiser et publier séparément, ce que l'exigence interdit." }
    d: { en: "A live connection cannot contain other data until it is converted to a local model with Make changes to this model.", fr: "Une connexion active ne peut pas contenir d'autres données tant qu'elle n'est pas convertie en modèle local avec Apporter des modifications à ce modèle." }
references:
  - title: Use composite models in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-directquery-datasets-azure-analysis-services
