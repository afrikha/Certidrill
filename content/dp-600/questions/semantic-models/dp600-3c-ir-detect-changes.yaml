id: dp600-3c-ir-detect-changes
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model that contains a table named FactInvoices with an incremental refresh policy. The policy keeps five years of history and refreshes the last 12 months, because invoices can be corrected up to a year after their invoice date. FactInvoices has an InvoiceDate column used for partitioning and a LastUpdated column that the source updates whenever a row changes.

    Most months don't change between two refreshes, but every refresh reloads all 12 months. You need to reduce the refresh duration while still loading the corrections of the last 12 months.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique qui contient une table nommée FactInvoices dotée d'une stratégie d'actualisation incrémentielle. La stratégie conserve cinq ans d'historique et actualise les 12 derniers mois, car les factures peuvent être corrigées jusqu'à un an après leur date de facturation. FactInvoices possède une colonne InvoiceDate utilisée pour le partitionnement et une colonne LastUpdated que la source met à jour à chaque modification d'une ligne.

    La plupart des mois ne changent pas entre deux actualisations, mais chaque actualisation recharge les 12 mois. Vous devez réduire la durée de l'actualisation tout en chargeant toujours les corrections des 12 derniers mois.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Turn on **Detect data changes** and select the InvoiceDate column."
        fr: "Activer **Detect data changes** et sélectionner la colonne InvoiceDate."
    - id: b
      text:
        en: "Change the refresh period of the policy from 12 months to one month."
        fr: "Ramener la période d'actualisation de la stratégie de 12 mois à un mois."
    - id: c
      text:
        en: "Turn on **Only refresh complete days** in the policy."
        fr: "Activer **Only refresh complete days** dans la stratégie."
    - id: d
      text:
        en: "Turn on **Detect data changes** and select the LastUpdated column."
        fr: "Activer **Detect data changes** et sélectionner la colonne LastUpdated."
answer:
  optionId: d
explanation:
  correct:
    en: "Detect data changes uses a Date/Time audit column to refresh only the periods in the refresh window whose maximum value of that column has changed since the last refresh. The audit column must not be the column used to partition the table, so LastUpdated is the right choice."
    fr: "Detect data changes utilise une colonne d'audit Date/Heure pour n'actualiser que les périodes de la fenêtre d'actualisation dont la valeur maximale de cette colonne a changé depuis la dernière actualisation. La colonne d'audit ne doit pas être celle qui partitionne la table : LastUpdated est donc le bon choix."
  options:
    a: { en: "The audit column shouldn't be the partitioning column: the maximum InvoiceDate of a month doesn't change when an invoice is corrected.", fr: "La colonne d'audit ne doit pas être la colonne de partitionnement : la valeur maximale d'InvoiceDate d'un mois ne change pas quand une facture est corrigée." }
    b: { en: "A one-month refresh period no longer loads the corrections made to older invoices of the last 12 months.", fr: "Une période d'actualisation d'un mois ne charge plus les corrections apportées aux factures plus anciennes des 12 derniers mois." }
    c: { en: "Only refresh complete days only skips the incomplete current day; the other 12 months are still reloaded.", fr: "Only refresh complete days ne fait qu'ignorer le jour en cours incomplet ; les 12 autres mois sont toujours rechargés." }
references:
  - title: Configure incremental refresh and real-time data
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-configure
