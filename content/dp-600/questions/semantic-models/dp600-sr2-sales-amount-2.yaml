stem:
  en: You multiply the total quantity by the average unit price by using variables.
  fr: Vous multipliez la quantité totale par le prix unitaire moyen à l'aide de variables.
body:
  solution:
    en: |
      You create the following measure.

      ```dax
      Sales Amount =
      VAR TotalQty = SUM ( Sales[Quantity] )
      VAR AvgPrice = AVERAGE ( Sales[UnitPrice] )
      RETURN
          TotalQty * AvgPrice
      ```
    fr: |
      Vous créez la mesure suivante.

      ```dax
      Sales Amount =
      VAR TotalQty = SUM ( Sales[Quantity] )
      VAR AvgPrice = AVERAGE ( Sales[UnitPrice] )
      RETURN
          TotalQty * AvgPrice
      ```
answer: { value: false }
explanation:
  correct:
    en: AVERAGE returns the simple average of UnitPrice across the order lines, without weighting by Quantity. Because the unit price varies between lines, the total quantity multiplied by this average is generally not equal to the sum of Quantity × UnitPrice when a context contains lines with different prices and quantities.
    fr: "AVERAGE renvoie la moyenne simple de UnitPrice sur les lignes de commande, sans pondération par Quantity. Comme le prix unitaire varie d'une ligne à l'autre, la quantité totale multipliée par cette moyenne n'est généralement pas égale à la somme de Quantity × UnitPrice lorsqu'un contexte contient des lignes avec des prix et des quantités différents."
references:
  - title: SUMX function (DAX)
    url: https://learn.microsoft.com/en-us/dax/sumx-function-dax
