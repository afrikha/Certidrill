id: dp600-3c-onelake-security
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a lakehouse named Lakehouse1. Analysts query Lakehouse1 from Spark notebooks and through its SQL analytics endpoint, and you are creating a Direct Lake semantic model on Lakehouse1 for reports.

    You need to restrict the rows of the Orders table by region. The restriction must be defined once, apply to all the engines, and the report queries must keep full Direct Lake performance.

    What should you do?
  fr: |
    Vous disposez d'un lakehouse nommé Lakehouse1. Des analystes interrogent Lakehouse1 depuis des notebooks Spark et via son point de terminaison d'analytique SQL, et vous créez un modèle sémantique Direct Lake sur Lakehouse1 pour les rapports.

    Vous devez restreindre les lignes de la table Orders par région. La restriction doit être définie une seule fois, s'appliquer à tous les moteurs, et les requêtes des rapports doivent conserver toutes les performances de Direct Lake.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Create a Direct Lake on SQL analytics endpoint model, and define a T-SQL security policy on Orders at the SQL analytics endpoint."
        fr: "Créer un modèle Direct Lake sur le point de terminaison d'analytique SQL, et définir une stratégie de sécurité T-SQL sur Orders au point de terminaison d'analytique SQL."
    - id: b
      text:
        en: "Create a Direct Lake on OneLake model, and define row-level security on Orders in a OneLake security role of Lakehouse1."
        fr: "Créer un modèle Direct Lake sur OneLake, et définir la sécurité au niveau des lignes sur Orders dans un rôle de sécurité OneLake de Lakehouse1."
    - id: c
      text:
        en: "Create a Direct Lake on OneLake model, and define a role with a DAX filter on Orders in the semantic model."
        fr: "Créer un modèle Direct Lake sur OneLake, et définir dans le modèle sémantique un rôle avec un filtre DAX sur Orders."
    - id: d
      text:
        en: "Create a Direct Lake on SQL analytics endpoint model, and define a role with a DAX filter on Orders in the semantic model."
        fr: "Créer un modèle Direct Lake sur le point de terminaison d'analytique SQL, et définir dans le modèle sémantique un rôle avec un filtre DAX sur Orders."
answer:
  optionId: b
explanation:
  correct:
    en: "OneLake security roles apply across all the compute engines that read the lakehouse, and Direct Lake on OneLake enforces them without falling back to DirectQuery. This is the recommended option for unified access control with high performance."
    fr: "Les rôles de sécurité OneLake s'appliquent à tous les moteurs de calcul qui lisent le lakehouse, et Direct Lake sur OneLake les applique sans basculer en DirectQuery. C'est l'option recommandée pour un contrôle d'accès unifié avec de hautes performances."
  options:
    a: { en: "SQL row-level security doesn't apply to Spark, and it makes Direct Lake on SQL fall back to DirectQuery.", fr: "La sécurité au niveau des lignes SQL ne s'applique pas à Spark, et elle fait basculer Direct Lake sur SQL en DirectQuery." }
    c: { en: "Semantic model roles apply only within the model, not to Spark or the SQL analytics endpoint.", fr: "Les rôles du modèle sémantique ne s'appliquent qu'au sein du modèle, pas à Spark ni au point de terminaison d'analytique SQL." }
    d: { en: "Semantic model roles apply only within the model, so the notebooks and SQL queries aren't restricted.", fr: "Les rôles du modèle sémantique ne s'appliquent qu'au sein du modèle : les notebooks et les requêtes SQL ne sont pas restreints." }
references:
  - title: Integrate Direct Lake security
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-security-integration
