id: dp600-3c-ir-tmsl-full
objective: "3.2.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a semantic model named SalesModel in a workspace on a Fabric capacity. The XMLA endpoint is enabled for read-write. The FactSales table of SalesModel has an incremental refresh policy that keeps five years of history in yearly, quarterly and monthly partitions.

    The source system restated the amounts of every year. You need to reload all the existing partitions of FactSales and recalculate the dependent objects in one command. The partition definitions must not change.

    How should you complete the TMSL command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique nommé SalesModel dans un espace de travail sur une capacité Fabric. Le point de terminaison XMLA est activé en lecture-écriture. La table FactSales de SalesModel possède une stratégie d'actualisation incrémentielle qui conserve cinq ans d'historique dans des partitions annuelles, trimestrielles et mensuelles.

    Le système source a retraité les montants de toutes les années. Vous devez recharger toutes les partitions existantes de FactSales et recalculer les objets dépendants en une seule commande. Les définitions des partitions ne doivent pas changer.

    Comment devez-vous compléter la commande TMSL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "refresh": {
        "type": "[[type]]",
        "applyRefreshPolicy": [[policy]],
        "objects": [
          {
            "database": "SalesModel",
            "table": "FactSales"
          }
        ]
      }
    }
  slots:
    - id: type
      options:
        - { id: calculate, text: calculate }
        - { id: dataonly, text: dataOnly }
        - { id: full, text: full }
        - { id: clear, text: clearValues }
    - id: policy
      options:
        - { id: "true", text: "true" }
        - { id: "false", text: "false" }
answer:
  values: { type: full, policy: "false" }
explanation:
  correct:
    en: |
      A full refresh reloads the data and recalculates the dependent objects. When applyRefreshPolicy is false, a full refresh leaves the partition definitions unchanged and fully refreshes all the partitions of the table. With the default value, true, the refresh policy is applied, so the rolling window would determine which partitions are created, merged, removed and refreshed.
    fr: |
      Une actualisation full recharge les données et recalcule les objets dépendants. Quand applyRefreshPolicy vaut false, une actualisation full laisse les définitions des partitions inchangées et actualise entièrement toutes les partitions de la table. Avec la valeur par défaut, true, la stratégie d'actualisation est appliquée : la fenêtre glissante déterminerait alors quelles partitions sont créées, fusionnées, supprimées et actualisées.
  options:
    calculate: { en: "calculate only recalculates the dependent objects; it doesn't reload data from the source.", fr: "calculate recalcule seulement les objets dépendants ; il ne recharge pas les données depuis la source." }
    dataonly: { en: "dataOnly reloads data without recalculating the dependent objects.", fr: "dataOnly recharge les données sans recalculer les objets dépendants." }
    clear: { en: "clearValues removes the data from the partitions without reloading it.", fr: "clearValues supprime les données des partitions sans les recharger." }
references:
  - title: Advanced incremental refresh and real-time data with the XMLA endpoint
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-xmla
