id: dp600-3c-framing-owner
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a lakehouse named Lakehouse1 and a Direct Lake semantic model named HRModel. HRModel uses the default single sign-on cloud connection. User1, the owner of HRModel, left the company and the account of User1 was disabled.

    Since then, every refresh of HRModel fails with an error that states that source tables don't exist or that access was denied. User2 is a member of the workspace and can read all the tables of Lakehouse1, but an on-demand refresh started by User2 also fails.

    You need to ensure that HRModel can be refreshed. What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé Lakehouse1 et un modèle sémantique Direct Lake nommé HRModel. HRModel utilise la connexion cloud par authentification unique par défaut. User1, propriétaire de HRModel, a quitté l'entreprise et son compte a été désactivé.

    Depuis, chaque actualisation de HRModel échoue avec une erreur indiquant que des tables sources n'existent pas ou que l'accès a été refusé. User2 est membre de l'espace de travail et peut lire toutes les tables de Lakehouse1, mais une actualisation à la demande lancée par User2 échoue également.

    Vous devez vous assurer que HRModel peut être actualisé. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Grant User2 the Build permission on HRModel, and then have User2 refresh HRModel."
        fr: "Accorder à User2 l'autorisation Build sur HRModel, puis demander à User2 d'actualiser HRModel."
    - id: b
      text:
        en: "Set the **Direct Lake behavior** property of HRModel to Automatic."
        fr: "Définir la propriété **Direct Lake behavior** de HRModel sur Automatic."
    - id: c
      text:
        en: "Configure a scheduled refresh of HRModel while signed in as User2."
        fr: "Configurer une actualisation planifiée de HRModel en étant connecté en tant que User2."
    - id: d
      text:
        en: "Have User2 select **Take over** in the settings of HRModel, and then refresh HRModel."
        fr: "Demander à User2 de sélectionner **Take over** dans les paramètres de HRModel, puis d'actualiser HRModel."
answer:
  optionId: d
explanation:
  correct:
    en: "During framing, Direct Lake checks that the semantic model owner can read the source tables, whoever starts the refresh. When User2 takes over HRModel, User2 becomes the owner, and because User2 can read the tables of Lakehouse1, framing succeeds."
    fr: "Pendant le cadrage, Direct Lake vérifie que le propriétaire du modèle sémantique peut lire les tables sources, quel que soit l'auteur de l'actualisation. Quand User2 prend le contrôle de HRModel, User2 en devient propriétaire, et comme User2 peut lire les tables de Lakehouse1, le cadrage réussit."
  options:
    a: { en: "Build lets User2 create reports on HRModel; the refresh still checks the access of the owner, User1.", fr: "Build permet à User2 de créer des rapports sur HRModel ; l'actualisation vérifie toujours l'accès du propriétaire, User1." }
    b: { en: "Direct Lake behavior controls DirectQuery fallback of queries; it doesn't change the access check of framing.", fr: "Direct Lake behavior contrôle le basculement des requêtes vers DirectQuery ; il ne modifie pas la vérification d'accès du cadrage." }
    c: { en: "A scheduled refresh also checks the access of the owner, so it fails like the on-demand refresh.", fr: "Une actualisation planifiée vérifie aussi l'accès du propriétaire : elle échoue comme l'actualisation à la demande." }
references:
  - title: Integrate Direct Lake security
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-security-integration
