id: dp600-cs1b-large-format
objective: "3.1.6"
type: single
caseStudy: dp600-cs1b-woodgrove-bank
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the size requirement for FinanceModel. What should you do?
  fr: |
    Vous devez satisfaire l'exigence de taille concernant FinanceModel. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn on Large semantic model storage format in the settings of FinanceModel", fr: "Activer Large semantic model storage format dans les paramètres de FinanceModel" } }
    - { id: b, text: { en: "Turn on Query scale-out in the settings of FinanceModel", fr: "Activer Query scale-out dans les paramètres de FinanceModel" } }
    - { id: c, text: { en: "Turn on Get the latest data in real time with DirectQuery in the incremental refresh policy", fr: "Activer Get the latest data in real time with DirectQuery dans la stratégie d'actualisation incrémentielle" } }
    - { id: d, text: { en: "Turn on automatic aggregations in the settings of FinanceModel", fr: "Activer les agrégations automatiques dans les paramètres de FinanceModel" } }
answer: { optionId: a }
explanation:
  correct:
    en: The large semantic model storage format lets an Import model grow beyond the default size limit, up to the limit of the capacity. It is enabled in the semantic model settings (or as the default storage format of the workspace) and is also recommended for models that are written through the XMLA endpoint.
    fr: Le format de stockage de modèle sémantique volumineux permet à un modèle Import de dépasser la limite de taille par défaut, jusqu'à la limite de la capacité. Il s'active dans les paramètres du modèle sémantique (ou comme format de stockage par défaut de l'espace de travail) et il est aussi recommandé pour les modèles modifiés via le point de terminaison XMLA.
  options:
    b:
      en: Query scale-out adds read-only replicas to spread the query load; it does not raise the maximum model size.
      fr: Query scale-out ajoute des réplicas en lecture seule pour répartir la charge des requêtes ; il n'augmente pas la taille maximale du modèle.
    c:
      en: A real-time DirectQuery partition changes part of the table to DirectQuery, but FinanceModel must remain in Import mode, and it does not raise the size limit.
      fr: Une partition DirectQuery en temps réel fait passer une partie de la table en DirectQuery, alors que FinanceModel doit rester en mode Import, et elle n'augmente pas la limite de taille.
    d:
      en: Automatic aggregations apply to DirectQuery models; they do not change the size limit of an Import model.
      fr: Les agrégations automatiques s'appliquent aux modèles DirectQuery ; elles ne modifient pas la limite de taille d'un modèle Import.
references:
  - title: Large semantic models in Power BI Premium
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/service-premium-large-models
