id: dp600-3b-perf-manage-agg
objective: "3.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a semantic model that contains a single DirectQuery table named **DriverActivity** with the columns TripDate, Region, VehicleType, Latitude, Longitude and Distance. The model has no dimension tables and no relationships.

    You import a table named **DriverActivityAgg** that groups DriverActivity by TripDate, Region and VehicleType, with the columns TotalDistance and TripCount. You need queries that group by TripDate, Region or VehicleType to use DriverActivityAgg.

    How should you configure **Manage aggregations** for DriverActivityAgg? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique qui contient une seule table DirectQuery nommée **DriverActivity** avec les colonnes TripDate, Region, VehicleType, Latitude, Longitude et Distance. Le modèle n'a ni table de dimension ni relation.

    Vous importez une table nommée **DriverActivityAgg** qui regroupe DriverActivity par TripDate, Region et VehicleType, avec les colonnes TotalDistance et TripCount. Les requêtes qui regroupent par TripDate, Region ou VehicleType doivent utiliser DriverActivityAgg.

    Comment devez-vous configurer **Gérer les agrégations** pour DriverActivityAgg ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      - TripDate, Region and VehicleType: Summarization [[s1]], with the matching detail columns of DriverActivity
      - TotalDistance: Summarization [[s2]], detail column DriverActivity[Distance]
      - TripCount: Summarization [[s3]], detail table DriverActivity
    fr: |
      - TripDate, Region et VehicleType : Synthèse [[s1]], avec les colonnes de détails correspondantes de DriverActivity
      - TotalDistance : Synthèse [[s2]], colonne de détails DriverActivity[Distance]
      - TripCount : Synthèse [[s3]], table de détails DriverActivity
  slots:
    - id: s1
      options:
        - { id: gb1, text: GroupBy }
        - { id: sum1, text: Sum }
        - { id: cnt1, text: Count }
        - { id: ctr1, text: Count table rows }
    - id: s2
      options:
        - { id: gb2, text: GroupBy }
        - { id: sum2, text: Sum }
        - { id: cnt2, text: Count }
        - { id: ctr2, text: Count table rows }
    - id: s3
      options:
        - { id: gb3, text: GroupBy }
        - { id: sum3, text: Sum }
        - { id: cnt3, text: Count }
        - { id: ctr3, text: Count table rows }
answer:
  values: { s1: gb1, s2: sum2, s3: ctr3 }
explanation:
  correct:
    en: |
      Without relationships, the model uses GroupBy-based aggregations: the GroupBy entries that map TripDate, Region and VehicleType to the detail columns are mandatory, or the aggregation is never hit. TotalDistance is the sum of Distance, and TripCount counts the rows of the detail table, which is what Count table rows maps.
    fr: |
      Sans relations, le modèle utilise des agrégations basées sur GroupBy : les entrées GroupBy qui associent TripDate, Region et VehicleType aux colonnes de détails sont obligatoires, sinon l'agrégation n'est jamais utilisée. TotalDistance est la somme de Distance, et TripCount compte les lignes de la table de détails, ce que mappe Count table rows.
  options:
    sum1: { en: "The grouping columns are not aggregated; they must be mapped as GroupBy entries.", fr: "Les colonnes de regroupement ne sont pas agrégées ; elles doivent être mappées comme entrées GroupBy." }
    cnt2: { en: "Count would count the non-blank Distance values, not add the distances.", fr: "Count compterait les valeurs Distance non vides au lieu d'additionner les distances." }
    sum3: { en: "Summing a column does not count the trips; TripCount maps the number of detail rows.", fr: "Additionner une colonne ne compte pas les trajets ; TripCount correspond au nombre de lignes de détails." }
    cnt3: { en: "Count needs a detail column and counts its values; counting the rows of the table is Count table rows.", fr: "Count exige une colonne de détails et compte ses valeurs ; compter les lignes de la table correspond à Count table rows." }
references:
  - title: User-defined aggregations
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/aggregations-advanced
