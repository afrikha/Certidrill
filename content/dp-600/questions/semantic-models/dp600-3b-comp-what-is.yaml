id: dp600-3b-comp-what-is
objective: "3.1.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You review five semantic models that Fabrikam analysts created.

    Which two models are composite models?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez cinq modèles sémantiques créés par des analystes de Fabrikam.

    Quels sont les deux modèles composites ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A model that imports tables from an Azure SQL database and from an Excel workbook", fr: "Un modèle qui importe des tables d'une base de données Azure SQL et d'un classeur Excel" } }
    - { id: b, text: { en: "A model with a DirectQuery table from an Azure SQL database and an imported Excel table", fr: "Un modèle avec une table DirectQuery provenant d'une base de données Azure SQL et une table Excel importée" } }
    - { id: c, text: { en: "A report that uses a live connection to a published semantic model, with no local model", fr: "Un rapport qui utilise une connexion active à un modèle sémantique publié, sans modèle local" } }
    - { id: d, text: { en: "A model with DirectQuery tables from an Azure SQL database and from a Snowflake database", fr: "Un modèle avec des tables DirectQuery provenant d'une base de données Azure SQL et d'une base de données Snowflake" } }
    - { id: e, text: { en: "A model with Direct Lake on OneLake tables from two lakehouses and no other table", fr: "Un modèle avec des tables Direct Lake sur OneLake provenant de deux lakehouses et aucune autre table" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A model is composite when its tables use different storage modes, such as DirectQuery and Import, or when its DirectQuery tables come from different data sources. Each DirectQuery source is its own source group, and all imported data forms one group.
    fr: |
      Un modèle est composite quand ses tables utilisent des modes de stockage différents, comme DirectQuery et Import, ou quand ses tables DirectQuery proviennent de sources de données différentes. Chaque source DirectQuery forme son propre groupe de sources, et toutes les données importées forment un seul groupe.
  options:
    a:
      en: |
        Import tables from several sources form a single source group, so the model is not composite.
      fr: |
        Des tables Import provenant de plusieurs sources forment un seul groupe de sources : le modèle n'est pas composite.
    c:
      en: |
        A live connection without a local model is a thin report on a remote model, not a composite model.
      fr: |
        Une connexion active sans modèle local est un rapport léger sur un modèle distant, pas un modèle composite.
    e:
      en: |
        Direct Lake tables from one or more sources are not a composite model until they are combined with tables in another storage mode.
      fr: |
        Des tables Direct Lake provenant d'une ou plusieurs sources ne forment pas un modèle composite tant qu'elles ne sont pas combinées à des tables d'un autre mode de stockage.
references:
  - title: Use composite models in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-composite-models
