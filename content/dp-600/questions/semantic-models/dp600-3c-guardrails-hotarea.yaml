id: dp600-3c-guardrails-hotarea
objective: "3.2.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace on an F32 capacity. The workspace contains a warehouse named Warehouse1 and a Direct Lake on SQL analytics endpoint semantic model named ReturnsModel. Queries on ReturnsModel fall back to DirectQuery mode. No SQL security or data masking is defined in Warehouse1.

    The following table shows the source objects of the tables of ReturnsModel. Answer each prompt by selecting the appropriate table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric sur une capacité F32. L'espace de travail contient un entrepôt nommé Warehouse1 et un modèle sémantique Direct Lake sur le point de terminaison d'analytique SQL nommé ReturnsModel. Les requêtes sur ReturnsModel basculent en mode DirectQuery. Aucune sécurité SQL ni aucun masquage de données n'est défini dans Warehouse1.

    Le tableau suivant présente les objets sources des tables de ReturnsModel. Répondez à chaque consigne en sélectionnant la table appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: "The table that exceeds a Direct Lake guardrail of the F32 capacity"
        fr: "La table qui dépasse un garde-fou Direct Lake de la capacité F32"
    - id: p2
      text:
        en: "The table that can't be loaded in Direct Lake mode because of the type of its source object"
        fr: "La table qui ne peut pas être chargée en mode Direct Lake à cause du type de son objet source"
  grid:
    header:
      - { en: "Table", fr: "Table" }
      - { en: "Source object", fr: "Objet source" }
      - { en: "Parquet files", fr: "Fichiers Parquet" }
      - { en: "Row groups", fr: "Groupes de lignes" }
      - { en: "Rows", fr: "Lignes" }
    rows:
      - - { text: FactSales, area: factsales }
        - { text: { en: "Table", fr: "Table" } }
        - { text: "950" }
        - { text: "980" }
        - { text: { en: "290 million", fr: "290 millions" } }
      - - { text: FactReturns, area: factreturns }
        - { text: { en: "Table", fr: "Table" } }
        - { text: "600" }
        - { text: { en: "1,150", fr: "1 150" } }
        - { text: { en: "40 million", fr: "40 millions" } }
      - - { text: DimProduct, area: dimproduct }
        - { text: { en: "Table", fr: "Table" } }
        - { text: "12" }
        - { text: "12" }
        - { text: { en: "85,000", fr: "85 000" } }
      - - { text: Promotions, area: promotions }
        - { text: { en: "View", fr: "Vue" } }
        - { text: { en: "Not applicable", fr: "Sans objet" } }
        - { text: { en: "Not applicable", fr: "Sans objet" } }
        - { text: { en: "4,500", fr: "4 500" } }
answer:
  values: { p1: factreturns, p2: promotions }
explanation:
  correct:
    en: |
      On F2 to F32 capacities, each table is limited to 1,000 Parquet files, 1,000 row groups and 300 million rows. FactReturns has only 600 files but 1,150 row groups, so it exceeds the row group guardrail, while FactSales stays just below every limit; running OPTIMIZE on FactReturns compacts it. Promotions is based on a non-materialized SQL view, which Direct Lake can't load from a Delta table, so it always falls back to DirectQuery.
    fr: |
      Sur les capacités F2 à F32, chaque table est limitée à 1 000 fichiers Parquet, 1 000 groupes de lignes et 300 millions de lignes. FactReturns n'a que 600 fichiers mais 1 150 groupes de lignes : elle dépasse le garde-fou des groupes de lignes, alors que FactSales reste juste sous chaque limite ; exécuter OPTIMIZE sur FactReturns la compacte. Promotions repose sur une vue SQL non matérialisée, que Direct Lake ne peut pas charger depuis une table Delta : elle bascule toujours en DirectQuery.
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
  - title: How Direct Lake works
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works
