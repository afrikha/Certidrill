id: dp600-3a-ss-unit-price
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are designing a star schema in a semantic model. The **SalesLine** fact table contains the **Quantity**, **SalesAmount** and **UnitPrice** columns.

    Report authors must be able to show the minimum, maximum and average unit price in their visuals. Unit prices must never be summed.

    What should you do?
  fr: |
    Vous concevez un schéma en étoile dans un modèle sémantique. La table de faits **SalesLine** contient les colonnes **Quantity**, **SalesAmount** et **UnitPrice**.

    Les auteurs de rapports doivent pouvoir afficher le prix unitaire minimal, maximal et moyen dans leurs visuels. Les prix unitaires ne doivent jamais être additionnés.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the Summarize by property of UnitPrice to Average.", fr: "Définir la propriété Summarize by de UnitPrice sur Average." } }
    - { id: b, text: { en: "Change the data type of UnitPrice to Text.", fr: "Changer le type de données de UnitPrice en Texte." } }
    - { id: c, text: { en: "Move UnitPrice to a separate dimension table related to SalesLine.", fr: "Déplacer UnitPrice dans une table de dimension distincte liée à SalesLine." } }
    - { id: d, text: { en: "Hide UnitPrice and create explicit minimum, maximum and average measures.", fr: "Masquer UnitPrice et créer des mesures explicites de minimum, de maximum et de moyenne." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When some aggregations are inappropriate, hide the column so that it can't be used as an implicit measure, and expose explicit measures for the valid aggregations only. Report authors then can't sum unit prices.
    fr: |
      Quand certaines agrégations ne conviennent pas, masquez la colonne pour qu'elle ne puisse pas servir de mesure implicite, et exposez uniquement des mesures explicites pour les agrégations valides. Les auteurs de rapports ne peuvent alors plus additionner les prix unitaires.
  options:
    a: { en: "A default summarization only sets the initial aggregation; authors can still switch the column to Sum in a visual.", fr: "Une synthèse par défaut ne définit que l'agrégation initiale ; les auteurs peuvent toujours passer la colonne en Sum dans un visuel." }
    b: { en: "A text column can't return a minimum, maximum or average price.", fr: "Une colonne de texte ne peut pas renvoyer de prix minimal, maximal ou moyen." }
    c: { en: "A numeric value is a fact measure, not a dimension attribute, and a visible numeric column can still be summed.", fr: "Une valeur numérique est une mesure de fait, pas un attribut de dimension, et une colonne numérique visible peut toujours être additionnée." }
references:
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
