id: dp600-3b-fp-measure-switch
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Power BI report that uses a semantic model named **RetailModel**. RetailModel contains the explicit measures [Sales Amount], [Gross Margin] and [Order Count].

    A report page contains a clustered bar chart. Report readers must be able to choose in a slicer which of the three measures the chart displays. The solution must minimize development effort.

    What should you create?
  fr: |
    Vous disposez d'un rapport Power BI qui utilise un modèle sémantique nommé **RetailModel**. RetailModel contient les mesures explicites [Sales Amount], [Gross Margin] et [Order Count].

    Une page du rapport contient un graphique à barres groupées. Les lecteurs du rapport doivent pouvoir choisir dans un segment laquelle des trois mesures le graphique affiche. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A field parameter that contains the three measures", fr: "Un paramètre de champ qui contient les trois mesures" } }
    - { id: b, text: { en: "A numeric range parameter with the values 1 to 3", fr: "Un paramètre de plage numérique avec les valeurs 1 à 3" } }
    - { id: c, text: { en: "Three bar charts and three bookmarks with buttons", fr: "Trois graphiques à barres et trois signets avec des boutons" } }
    - { id: d, text: { en: "A dynamic format string on each of the three measures", fr: "Une chaîne de format dynamique sur chacune des trois mesures" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A field parameter (Modeling > New parameter > Fields) creates a calculated table that lists measures or columns. Placed in the chart's values and in a slicer, it lets readers switch the measure shown without any extra DAX.
    fr: |
      Un paramètre de champ (Modélisation > Nouveau paramètre > Champs) crée une table calculée qui liste des mesures ou des colonnes. Placé dans les valeurs du graphique et dans un segment, il permet aux lecteurs de changer la mesure affichée sans DAX supplémentaire.
  options:
    b:
      en: |
        A numeric range parameter returns a number for what-if analysis; you would still need a SWITCH measure to map it to the measures.
      fr: |
        Un paramètre de plage numérique renvoie un nombre pour une analyse de scénarios ; il faudrait encore une mesure SWITCH pour l'associer aux mesures.
    c:
      en: |
        Bookmarks can toggle visuals, but three charts, three bookmarks and buttons take more effort to build and maintain, and they do not use a slicer.
      fr: |
        Les signets peuvent basculer entre des visuels, mais trois graphiques, trois signets et des boutons demandent plus d'effort à créer et à maintenir, et n'utilisent pas de segment.
    d:
      en: |
        A dynamic format string changes how a measure is displayed, not which measure a visual shows.
      fr: |
        Une chaîne de format dynamique change l'affichage d'une mesure, pas la mesure qu'affiche un visuel.
references:
  - title: Use Field Parameters in Power BI Reports
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/power-bi-field-parameters
