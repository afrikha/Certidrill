id: dp600-cs1c-storage-modes
objective: "3.1.7"
type: dragdrop
caseStudy: dp600-cs1c-litware-energy
difficulty: 3
status: draft
stem:
  en: |
    You are designing the semantic model for the Grid Quality report in Power BI Desktop. The model uses the MeterReadings, DailyUsage and Meters tables of GridDB. Meters has one-to-many relationships with MeterReadings and DailyUsage. You need to meet the report requirement. Which storage mode should you configure for each table? To answer, drag the appropriate storage modes to the correct tables. Each storage mode may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez dans Power BI Desktop le modèle sémantique du rapport Grid Quality. Le modèle utilise les tables MeterReadings, DailyUsage et Meters de GridDB. Meters a des relations un-à-plusieurs avec MeterReadings et DailyUsage. Vous devez satisfaire l'exigence concernant le rapport. Quel mode de stockage devez-vous configurer pour chaque table ? Pour répondre, faites glisser les modes de stockage appropriés vers les tables correctes. Chaque mode de stockage peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: import, text: Import }
    - { id: dq, text: DirectQuery }
    - { id: dual, text: Dual }
    - { id: dl, text: Direct Lake }
  targets:
    - { id: readings, text: MeterReadings }
    - { id: usage, text: DailyUsage }
    - { id: meters, text: Meters }
answer:
  mapping: { readings: dq, usage: import, meters: dual }
explanation:
  correct:
    en: MeterReadings must show the latest readings without a refresh, so it uses DirectQuery against GridDB. DailyUsage must be served from an in-memory copy, so it uses Import. Meters is a dimension related to both a DirectQuery table and an Import table; in Dual mode it is answered from the cache with DailyUsage and pushed to the source with MeterReadings, which avoids limited relationships and maximizes performance.
    fr: MeterReadings doit afficher les dernières mesures sans actualisation ; cette table utilise donc DirectQuery sur GridDB. DailyUsage doit être servie à partir d'une copie en mémoire ; elle utilise donc Import. Meters est une dimension liée à la fois à une table DirectQuery et à une table Import ; en mode Dual, elle est servie depuis le cache avec DailyUsage et envoyée à la source avec MeterReadings, ce qui évite les relations limitées et maximise les performances.
  options:
    dl:
      en: Direct Lake reads Delta tables in OneLake after framing; KQL tables are written to OneLake with a delay, so MeterReadings would not show the latest readings.
      fr: Direct Lake lit des tables Delta dans OneLake après le cadrage ; les tables KQL sont écrites dans OneLake avec un délai, donc MeterReadings n'afficherait pas les dernières mesures.
    import:
      en: Import for Meters would create limited relationships with the DirectQuery table MeterReadings; Import for MeterReadings would require a refresh.
      fr: Import pour Meters créerait des relations limitées avec la table DirectQuery MeterReadings ; Import pour MeterReadings exigerait une actualisation.
references:
  - title: Table storage mode in Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-storage-mode
  - title: Turn on OneLake availability for an eventhouse
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-house-onelake-availability
