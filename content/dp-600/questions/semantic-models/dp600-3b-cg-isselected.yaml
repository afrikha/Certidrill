id: dp600-3b-cg-isselected
objective: "3.1.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a semantic model that contains a date table named **Date** and a calculation group named **Averages**.

    You need to add a calculation item named **Daily Average** that divides any measure by the number of days in the filter context, except the ratio measures [Margin %] and [Discount %], which must be returned unchanged. The expression must keep working if a developer later renames [Margin %] or [Discount %].

    How should you complete the expression? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique qui contient une table de dates nommée **Date** et un groupe de calcul nommé **Averages**.

    Vous devez ajouter un élément de calcul nommé **Daily Average** qui divise n'importe quelle mesure par le nombre de jours du contexte de filtre, sauf les mesures de ratio [Margin %] et [Discount %], qui doivent être renvoyées sans modification. L'expression doit continuer de fonctionner si un développeur renomme plus tard [Margin %] ou [Discount %].

    Comment devez-vous compléter l'expression ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Daily Average =
    IF (
        [[test]] ( [Margin %], [Discount %] ),
        [[keep]],
        DIVIDE ( SELECTEDMEASURE (), [[cnt]] ( 'Date' ) )
    )
  slots:
    - id: test
      options:
        - { id: issel, text: ISSELECTEDMEASURE }
        - { id: selname, text: SELECTEDMEASURENAME }
        - { id: isfilt, text: ISFILTERED }
        - { id: hasone, text: HASONEVALUE }
    - id: keep
      options:
        - { id: selm, text: "SELECTEDMEASURE ()" }
        - { id: blank, text: "BLANK ()" }
        - { id: selfmt, text: "SELECTEDMEASUREFORMATSTRING ()" }
        - { id: margin, text: "[Margin %]" }
    - id: cnt
      options:
        - { id: countrows, text: COUNTROWS }
        - { id: count, text: COUNT }
        - { id: distinct, text: DISTINCTCOUNT }
        - { id: counta, text: COUNTA }
answer:
  values: { test: issel, keep: selm, cnt: countrows }
explanation:
  correct:
    en: |
      ISSELECTEDMEASURE returns TRUE when the measure in context is one of the measures listed, and because the measures are referenced as objects, formula fixup updates the expression when they are renamed. SELECTEDMEASURE() returns the ratio unchanged, and COUNTROWS('Date') counts the days in the filter context.
    fr: |
      ISSELECTEDMEASURE renvoie TRUE quand la mesure du contexte fait partie des mesures listées et, comme les mesures sont référencées en tant qu'objets, la correction automatique des formules met l'expression à jour quand elles sont renommées. SELECTEDMEASURE() renvoie le ratio sans modification, et COUNTROWS('Date') compte les jours du contexte de filtre.
  options:
    selname: { en: "SELECTEDMEASURENAME takes no arguments and returns a name compared as a string, which formula fixup does not update after a rename.", fr: "SELECTEDMEASURENAME ne prend aucun argument et renvoie un nom comparé comme une chaîne, que la correction automatique ne met pas à jour après un renommage." }
    isfilt: { en: "ISFILTERED tests whether a column or table is filtered; it cannot test which measure is being evaluated.", fr: "ISFILTERED teste si une colonne ou une table est filtrée ; il ne peut pas tester quelle mesure est évaluée." }
    hasone: { en: "HASONEVALUE checks whether a column has exactly one value in context; it does not accept measures.", fr: "HASONEVALUE vérifie si une colonne a exactement une valeur dans le contexte ; il n'accepte pas de mesures." }
    blank: { en: "BLANK() would hide the ratios instead of returning them unchanged.", fr: "BLANK() masquerait les ratios au lieu de les renvoyer sans modification." }
    selfmt: { en: "SELECTEDMEASUREFORMATSTRING() returns a format string, not the value of the measure.", fr: "SELECTEDMEASUREFORMATSTRING() renvoie une chaîne de format, pas la valeur de la mesure." }
    margin: { en: "[Margin %] would also be returned for [Discount %].", fr: "[Margin %] serait aussi renvoyée pour [Discount %]." }
    count: { en: "COUNT expects a column, not a table.", fr: "COUNT attend une colonne, pas une table." }
    distinct: { en: "DISTINCTCOUNT expects a column, not a table.", fr: "DISTINCTCOUNT attend une colonne, pas une table." }
    counta: { en: "COUNTA expects a column, not a table.", fr: "COUNTA attend une colonne, pas une table." }
references:
  - title: ISSELECTEDMEASURE function (DAX)
    url: https://learn.microsoft.com/en-us/dax/isselectedmeasure-function-dax
  - title: SELECTEDMEASURENAME function (DAX)
    url: https://learn.microsoft.com/en-us/dax/selectedmeasurename-function-dax
