id: dp600-3a-dax-info-functions
objective: "3.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    A report page contains a slicer on 'Product'[Category] and a matrix with 'Product'[Category] and 'Product'[Product] on rows. You are writing measures that use DAX information functions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une page de rapport contient un segment sur 'Product'[Category] et une matrice avec 'Product'[Category] et 'Product'[Product] en lignes. Vous écrivez des mesures qui utilisent des fonctions d'informations DAX.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          On the grand total row of the matrix, when the only filter is the Category slicer, ISFILTERED('Product'[Color]) returns TRUE.
        fr: |
          Sur la ligne de total général de la matrice, quand le seul filtre est le segment Category, ISFILTERED('Product'[Color]) renvoie TRUE.
    - id: s2
      text:
        en: |
          When two categories are selected in the slicer and no alternate result is specified, SELECTEDVALUE('Product'[Category]) returns BLANK on the grand total row.
        fr: |
          Quand deux catégories sont sélectionnées dans le segment et qu'aucun résultat de remplacement n'est spécifié, SELECTEDVALUE('Product'[Category]) renvoie BLANK sur la ligne de total général.
    - id: s3
      text:
        en: |
          ISINSCOPE('Product'[Product]) returns TRUE on the product rows of the matrix.
        fr: |
          ISINSCOPE('Product'[Product]) renvoie TRUE sur les lignes de produit de la matrice.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      ISFILTERED returns TRUE only for a direct filter on the column; a filter on another column of the same table makes the column cross-filtered (ISCROSSFILTERED), not filtered. SELECTEDVALUE returns its alternate result, BLANK by default, when the column has zero or several values. ISINSCOPE returns TRUE when the column is the current level of the hierarchy.
    fr: |
      ISFILTERED ne renvoie TRUE que pour un filtre direct sur la colonne ; un filtre sur une autre colonne de la même table rend la colonne filtrée de manière croisée (ISCROSSFILTERED), pas filtrée. SELECTEDVALUE renvoie son résultat de remplacement, BLANK par défaut, quand la colonne a zéro ou plusieurs valeurs. ISINSCOPE renvoie TRUE quand la colonne est le niveau actuel de la hiérarchie.
references:
  - title: ISCROSSFILTERED function (DAX)
    url: https://learn.microsoft.com/en-us/dax/iscrossfiltered-function-dax
  - title: SELECTEDVALUE function
    url: https://learn.microsoft.com/en-us/dax/selectedvalue-function
