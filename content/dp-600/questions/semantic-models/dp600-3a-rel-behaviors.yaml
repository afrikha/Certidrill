id: dp600-3a-rel-behaviors
objective: "3.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model in Power BI Desktop with a **Product** dimension and a **Sales** fact table. Some Sales rows contain a ProductKey value that doesn't exist in Product.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez dans Power BI Desktop d'un modèle sémantique avec une dimension **Product** et une table de faits **Sales**. Certaines lignes de Sales contiennent une valeur ProductKey qui n'existe pas dans Product.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If both tables are Import tables related one-to-many, the unmatched Sales rows are grouped under a blank Product member in visuals.
        fr: |
          Si les deux tables sont des tables Import liées en un-à-plusieurs, les lignes de Sales sans correspondance sont regroupées sous un membre Product vide dans les visuels.
    - id: s2
      text:
        en: |
          If the relationship uses many-to-many cardinality, a calculated column in Sales can use RELATED to return Product[Color].
        fr: |
          Si la relation utilise une cardinalité plusieurs-à-plusieurs, une colonne calculée dans Sales peut utiliser RELATED pour renvoyer Product[Color].
    - id: s3
      text:
        en: |
          If both tables are DirectQuery tables from the same database related one-to-many, enabling Assume referential integrity makes the unmatched Sales rows disappear from the results.
        fr: |
          Si les deux tables sont des tables DirectQuery de la même base liées en un-à-plusieurs, activer Supposer l'intégrité référentielle fait disparaître des résultats les lignes de Sales sans correspondance.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A regular one-to-many relationship expands with a left outer join and adds a blank virtual row to the one side for unmatched keys. Many-to-many relationships are limited, and RELATED can't retrieve one-side values through them. Assume referential integrity makes the source query use an inner join, so rows with unknown keys are dropped and results are understated.
    fr: |
      Une relation un-à-plusieurs régulière s'étend par une jointure externe gauche et ajoute une ligne virtuelle vide du côté « un » pour les clés sans correspondance. Les relations plusieurs-à-plusieurs sont limitées, et RELATED ne peut pas récupérer à travers elles les valeurs du côté « un ». Supposer l'intégrité référentielle fait utiliser une jointure interne à la requête source : les lignes aux clés inconnues sont écartées et les résultats sont sous-estimés.
references:
  - title: Model relationships in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-relationships-understand
