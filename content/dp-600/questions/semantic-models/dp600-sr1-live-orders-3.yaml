stem:
  en: You set the dimension tables to Import and keep FactOrders in DirectQuery.
  fr: Vous passez les tables de dimension en mode Import et conservez FactOrders en DirectQuery.
body:
  solution:
    en: |
      In Model view, you set the storage mode of DimProduct, DimStore and DimDate to **Import**. FactOrders stays in **DirectQuery** mode.
    fr: |
      Dans la vue Modèle, vous définissez le mode de stockage de DimProduct, DimStore et DimDate sur **Import**. FactOrders reste en mode **DirectQuery**.
answer: { value: false }
explanation:
  correct:
    en: |
      FactOrders stays current and the slicers read the cache, but relationships between Import tables and DirectQuery tables are limited relationships: the join can't be pushed to SalesDB. The third requirement isn't met; Dual mode on the dimensions keeps the relationships regular.
    fr: |
      FactOrders reste à jour et les segments lisent le cache, mais les relations entre des tables Import et des tables DirectQuery sont des relations limitées : la jointure ne peut pas être envoyée à SalesDB. La troisième exigence n'est pas satisfaite ; le mode Double sur les dimensions garde les relations régulières.
references:
  - title: Table storage mode in Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-storage-mode
