id: dp600-3b-lsm-powershell
objective: "3.1.6"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are an administrator of a Fabric capacity and of a workspace named **WS1**. WS1 contains a semantic model named **Finance** that uses the small storage format. You installed the MicrosoftPowerBIMgmt PowerShell module.

    You need a script that converts Finance to the large semantic model storage format, and then displays the storage mode that Finance uses.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes administrateur d'une capacité Fabric et d'un espace de travail nommé **WS1**. WS1 contient un modèle sémantique nommé **Finance** qui utilise le petit format de stockage. Vous avez installé le module PowerShell MicrosoftPowerBIMgmt.

    Vous avez besoin d'un script qui convertit Finance au format de stockage de modèle sémantique volumineux, puis qui affiche le mode de stockage utilisé par Finance.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Login-PowerBIServiceAccount
    [[conv]] -Id <Finance ID> -TargetStorageMode PremiumFiles
    ([[check]] -Scope Organization -Id <Finance ID> -Include actualStorage).ActualStorage
  slots:
    - id: conv
      options:
        - { id: setds, text: Set-PowerBIDataset }
        - { id: setws, text: Set-PowerBIWorkspace }
        - { id: getds1, text: Get-PowerBIDataset }
    - id: check
      options:
        - { id: getds, text: Get-PowerBIDataset }
        - { id: getws, text: Get-PowerBIWorkspace }
        - { id: getsrc, text: Get-PowerBIDatasource }
answer:
  values: { conv: setds, check: getds }
explanation:
  correct:
    en: |
      Set-PowerBIDataset with -TargetStorageMode PremiumFiles converts one semantic model to the large format; it requires capacity and workspace admin rights. Get-PowerBIDataset with -Include actualStorage returns the ActualStorage property, whose StorageMode is Abf for the small format and PremiumFiles once the conversion is done.
    fr: |
      Set-PowerBIDataset avec -TargetStorageMode PremiumFiles convertit un modèle sémantique au format volumineux ; il exige les droits d'administrateur de la capacité et de l'espace de travail. Get-PowerBIDataset avec -Include actualStorage renvoie la propriété ActualStorage, dont StorageMode vaut Abf pour le petit format et PremiumFiles une fois la conversion effectuée.
  options:
    setws:
      en: |
        Set-PowerBIWorkspace changes workspace properties; the storage mode belongs to each semantic model.
      fr: |
        Set-PowerBIWorkspace modifie les propriétés d'un espace de travail ; le mode de stockage appartient à chaque modèle sémantique.
    getds1:
      en: |
        Get-PowerBIDataset only reads semantic models; it cannot convert them.
      fr: |
        Get-PowerBIDataset ne fait que lire les modèles sémantiques ; il ne peut pas les convertir.
    getws:
      en: |
        Get-PowerBIWorkspace returns workspaces, not the storage of a semantic model.
      fr: |
        Get-PowerBIWorkspace renvoie des espaces de travail, pas le stockage d'un modèle sémantique.
    getsrc:
      en: |
        Get-PowerBIDatasource returns the data sources of a model, not its storage mode.
      fr: |
        Get-PowerBIDatasource renvoie les sources de données d'un modèle, pas son mode de stockage.
references:
  - title: Large semantic models in Power BI Premium
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/service-premium-large-models
