id: dp600-3c-flavor-statements
objective: "3.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a lakehouse named Lakehouse1 and a Direct Lake on OneLake semantic model named Model1 that uses the tables of Lakehouse1. You are evaluating whether to keep Model1 or to replace it with a Direct Lake on SQL analytics endpoint model.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé Lakehouse1 et un modèle sémantique Direct Lake sur OneLake nommé Model1 qui utilise les tables de Lakehouse1. Vous évaluez s'il faut conserver Model1 ou le remplacer par un modèle Direct Lake sur le point de terminaison d'analytique SQL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If you set the Direct Lake behavior property of Model1 to Automatic, queries that can't be answered in Direct Lake mode fall back to DirectQuery.
        fr: Si vous définissez la propriété Direct Lake behavior de Model1 sur Automatic, les requêtes auxquelles il est impossible de répondre en mode Direct Lake basculent en DirectQuery.
    - id: s2
      text:
        en: You can create a Direct Lake on SQL analytics endpoint copy of Model1 in your My workspace to test it before replacing Model1.
        fr: Vous pouvez créer une copie Direct Lake sur le point de terminaison d'analytique SQL de Model1 dans Mon espace de travail pour la tester avant de remplacer Model1.
    - id: s3
      text:
        en: Model1 and a Direct Lake on SQL analytics endpoint model both connect to their source through cloud connections and can't use an on-premises data gateway.
        fr: Model1 et un modèle Direct Lake sur le point de terminaison d'analytique SQL se connectent tous deux à leur source par des connexions cloud et ne peuvent pas utiliser de passerelle de données locale.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      The Direct Lake behavior property applies only to Direct Lake on SQL; Direct Lake on OneLake doesn't support DirectQuery fallback and always behaves as DirectLakeOnly. Creating Direct Lake models in My workspace isn't supported, whichever option you choose, so the test copy must be created in a regular workspace. Both options support only cloud connections and can't operate through any gateway.
    fr: |
      La propriété Direct Lake behavior ne s'applique qu'à Direct Lake sur SQL ; Direct Lake sur OneLake ne prend pas en charge le basculement vers DirectQuery et se comporte toujours comme DirectLakeOnly. La création de modèles Direct Lake dans Mon espace de travail n'est pas prise en charge, quelle que soit l'option choisie : la copie de test doit être créée dans un espace de travail standard. Les deux options ne prennent en charge que les connexions cloud et ne peuvent fonctionner via aucune passerelle.
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
  - title: How Direct Lake works
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works
