id: dp600-cs1a-direct-lake-behavior
objective: "3.2.3"
type: yesno_statements
caseStudy: dp600-cs1a-wingtip-toys
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing the configuration of SalesModel. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la configuration de SalesModel. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To meet the requirement for the sales targets, you can add the Excel data to SalesModel as a table in Import storage mode.
        fr: Pour satisfaire l'exigence concernant les objectifs de ventes, vous pouvez ajouter les données Excel à SalesModel sous forme de table en mode de stockage Import.
    - id: s2
      text:
        en: If gold_fact_sales exceeds the Direct Lake guardrails of the F64 capacity, SalesModel answers the queries in DirectQuery mode through the SQL analytics endpoint of LH_Retail.
        fr: Si gold_fact_sales dépasse les limites de protection Direct Lake de la capacité F64, SalesModel répond aux requêtes en mode DirectQuery via le point de terminaison d'analytique SQL de LH_Retail.
    - id: s3
      text:
        en: When the Keep your Direct Lake data up to date setting is enabled, SalesModel is reframed when data changes are detected in the gold Delta tables.
        fr: Quand le paramètre Keep your Direct Lake data up to date est activé, SalesModel est recadré lorsque des modifications de données sont détectées dans les tables Delta de la couche or.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Direct Lake on OneLake supports composite models, so Import tables such as the Excel targets can sit next to the Direct Lake tables. Direct Lake on OneLake never falls back to DirectQuery; when a table exceeds the guardrails, the refresh (framing) fails and the model can't be queried until the Delta tables are optimized. The Keep your Direct Lake data up to date setting, enabled by default, reframes the model automatically when the Delta tables change, which meets the requirement for new gold data.
    fr: |
      Direct Lake sur OneLake prend en charge les modèles composites ; des tables Import comme les objectifs Excel peuvent donc côtoyer les tables Direct Lake. Direct Lake sur OneLake ne bascule jamais en DirectQuery : quand une table dépasse les limites de protection, l'actualisation (le cadrage) échoue et le modèle ne peut plus être interrogé tant que les tables Delta ne sont pas optimisées. Le paramètre Keep your Direct Lake data up to date, activé par défaut, recadre automatiquement le modèle quand les tables Delta changent, ce qui satisfait l'exigence sur les nouvelles données de la couche or.
references:
  - title: How Direct Lake works
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
