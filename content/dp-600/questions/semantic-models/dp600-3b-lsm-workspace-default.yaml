id: dp600-3b-lsm-workspace-default
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS2** that is assigned to an F128 capacity. During the next quarter, developers will publish about 20 new semantic models to WS2.

    Every new model must use the large semantic model storage format without the developers changing any setting of their models.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS2** qui est attribué à une capacité F128. Au cours du prochain trimestre, des développeurs publieront environ 20 nouveaux modèles sémantiques dans WS2.

    Chaque nouveau modèle doit utiliser le format de stockage de modèle sémantique volumineux sans que les développeurs modifient le moindre paramètre de leurs modèles.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Ask the capacity administrator to raise the maximum memory for semantic models", fr: "Demander à l'administrateur de capacité d'augmenter la mémoire maximale des modèles sémantiques" } }
    - { id: b, text: { en: "Run Set-PowerBIDataset with -TargetStorageMode PremiumFiles for WS2", fr: "Exécuter Set-PowerBIDataset avec -TargetStorageMode PremiumFiles pour WS2" } }
    - { id: c, text: { en: "Set the XMLA endpoint of the capacity to Read Write", fr: "Définir le point de terminaison XMLA de la capacité sur Read Write" } }
    - { id: d, text: { en: "In the Premium settings of WS2, set the Default storage format", fr: "Dans les paramètres Premium de WS2, définir le format de stockage par défaut (Default storage format)" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In the workspace settings, under Premium, Default storage format can be set to Large semantic model storage format. New semantic models published to the workspace then use the large format automatically.
    fr: |
      Dans les paramètres de l'espace de travail, sous Premium, Default storage format peut être défini sur Large semantic model storage format. Les nouveaux modèles sémantiques publiés dans l'espace de travail utilisent alors automatiquement le format volumineux.
  options:
    a:
      en: |
        The maximum memory limits how large models can grow; it does not change their storage format.
      fr: |
        La mémoire maximale limite la taille que les modèles peuvent atteindre ; elle ne change pas leur format de stockage.
    b:
      en: |
        Set-PowerBIDataset converts one existing semantic model identified by its ID; it cannot target models that do not exist yet.
      fr: |
        Set-PowerBIDataset convertit un modèle sémantique existant identifié par son ID ; il ne peut pas cibler des modèles qui n'existent pas encore.
    c:
      en: |
        Read Write XMLA access allows write operations through the endpoint; it does not change the storage format of new models.
      fr: |
        L'accès XMLA Read Write autorise les opérations d'écriture par le point de terminaison ; il ne change pas le format de stockage des nouveaux modèles.
references:
  - title: Large semantic models in Power BI Premium
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/service-premium-large-models
