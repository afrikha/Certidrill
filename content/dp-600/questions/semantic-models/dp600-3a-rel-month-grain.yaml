id: dp600-3a-rel-month-grain
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Import semantic model that contains a **Date** table with one row per day, marked as a date table, and related to a **Sales** fact table. You add a **Target** table that contains the Year, MonthNumber and TargetAmount columns, with one row per month.

    You need Date to filter Target so that targets appear at the month, quarter and year levels. The relationship between Date and Target must be a regular relationship.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique Import qui contient une table **Date** avec une ligne par jour, marquée comme table de dates et liée à une table de faits **Sales**. Vous ajoutez une table **Target** qui contient les colonnes Year, MonthNumber et TargetAmount, avec une ligne par mois.

    Date doit filtrer Target afin que les objectifs apparaissent aux niveaux mois, trimestre et année. La relation entre Date et Target doit être une relation régulière.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a many-to-many relationship between Date[MonthNumber] and Target[MonthNumber] that filters from Date to Target.", fr: "Créer une relation plusieurs-à-plusieurs entre Date[MonthNumber] et Target[MonthNumber] qui filtre de Date vers Target." } }
    - { id: b, text: { en: "Add a YearMonth column to both tables and create a many-to-many relationship that filters in both directions.", fr: "Ajouter une colonne YearMonth aux deux tables et créer une relation plusieurs-à-plusieurs qui filtre dans les deux directions." } }
    - { id: c, text: { en: "Add a TargetDate column that stores the first day of each month to Target, and create a one-to-many relationship from Date[Date] to Target[TargetDate].", fr: "Ajouter à Target une colonne TargetDate qui stocke le premier jour de chaque mois, et créer une relation un-à-plusieurs de Date[Date] vers Target[TargetDate]." } }
    - { id: d, text: { en: "Create a one-to-many relationship from Target[MonthNumber] to Date[MonthNumber] that filters from Target to Date.", fr: "Créer une relation un-à-plusieurs de Target[MonthNumber] vers Date[MonthNumber] qui filtre de Target vers Date." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For a fact table at a higher time grain, store the first day of the period in a date column and relate it one-to-many to the Date table. The relationship is regular, and month, quarter and year totals work. Add a measure that returns BLANK when the day level is filtered, because targets don't exist per day.
    fr: |
      Pour une table de faits à un grain temporel supérieur, stockez le premier jour de la période dans une colonne de date et reliez-la en un-à-plusieurs à la table Date. La relation est régulière, et les totaux par mois, trimestre et année fonctionnent. Ajoutez une mesure qui renvoie BLANK quand le niveau jour est filtré, car les objectifs n'existent pas par jour.
  options:
    a: { en: "Many-to-many relationships are limited, and month numbers repeat across years, which mixes the years.", fr: "Les relations plusieurs-à-plusieurs sont limitées, et les numéros de mois se répètent d'une année à l'autre, ce qui mélange les années." }
    b: { en: "Any many-to-many cardinality relationship is limited, and a bidirectional filter isn't needed.", fr: "Toute relation de cardinalité plusieurs-à-plusieurs est limitée, et un filtre bidirectionnel n'est pas nécessaire." }
    d: { en: "MonthNumber isn't unique in Target (it repeats each year), so Target can't be the one side.", fr: "MonthNumber n'est pas unique dans Target (il se répète chaque année) ; Target ne peut donc pas être le côté « un »." }
references:
  - title: Many-to-many relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-many-to-many
  - title: Model relationships in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-relationships-understand
