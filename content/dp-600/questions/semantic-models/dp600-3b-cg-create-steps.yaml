id: dp600-3b-cg-create-steps
objective: "3.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You open a semantic model named **SalesModel** in Power BI Desktop. The Discourage implicit measures property of the model is off. The model contains a measure named [Orders] and a date table named Date.

    You need report readers to apply a YTD calculation to [Orders] and to any other measure from a slicer on a report page.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous ouvrez un modèle sémantique nommé **SalesModel** dans Power BI Desktop. La propriété Décourager les mesures implicites du modèle est désactivée. Le modèle contient une mesure nommée [Orders] et une table de dates nommée Date.

    Les lecteurs du rapport doivent pouvoir appliquer un calcul YTD à [Orders] et à toute autre mesure depuis un segment d'une page du rapport.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: discourage, text: { en: "Turn on Discourage implicit measures for the model.", fr: "Activer Décourager les mesures implicites pour le modèle." } }
    - { id: create, text: { en: "In Model view, select Calculation group on the ribbon.", fr: "Dans la vue Modèle, sélectionner Groupe de calcul dans le ruban." } }
    - { id: item, text: { en: "Add a YTD calculation item that uses SELECTEDMEASURE().", fr: "Ajouter un élément de calcul YTD qui utilise SELECTEDMEASURE()." } }
    - { id: slicer, text: { en: "Add the calculation group column to a slicer and [Orders] to a visual.", fr: "Ajouter la colonne du groupe de calcul à un segment et [Orders] à un visuel." } }
    - { id: measures, text: { en: "Create an [Orders YTD] measure for each base measure.", fr: "Créer une mesure [Orders YTD] pour chaque mesure de base." } }
    - { id: autodate, text: { en: "Turn on Auto date/time for the current file.", fr: "Activer Date/heure automatique pour le fichier actif." } }
    - { id: fieldparam, text: { en: "Create a field parameter that lists the measures.", fr: "Créer un paramètre de champ qui liste les mesures." } }
answer:
  sequence: [ discourage, create, item, slicer ]
explanation:
  correct:
    en: |
      A calculation group can be created only when implicit measures are discouraged, because calculation items apply to explicit measures only (Power BI Desktop offers to turn the property on when you select Calculation group). You then create the group, define the YTD item with SELECTEDMEASURE(), and use the calculation group column in a slicer so that the selected item applies to the measures of the visuals.
    fr: |
      Un groupe de calcul ne peut être créé que si les mesures implicites sont découragées, car les éléments de calcul ne s'appliquent qu'aux mesures explicites (Power BI Desktop propose d'activer la propriété quand vous sélectionnez Groupe de calcul). Vous créez ensuite le groupe, définissez l'élément YTD avec SELECTEDMEASURE(), puis utilisez la colonne du groupe de calcul dans un segment pour que l'élément sélectionné s'applique aux mesures des visuels.
  options:
    measures: { en: "One measure per base measure is exactly the duplication that a calculation group avoids.", fr: "Une mesure par mesure de base est justement la duplication qu'un groupe de calcul évite." }
    autodate: { en: "Auto date/time adds hidden date tables; the model already has a date table.", fr: "Date/heure automatique ajoute des tables de dates masquées ; le modèle a déjà une table de dates." }
    fieldparam: { en: "A field parameter switches the measure shown; it does not apply a YTD calculation.", fr: "Un paramètre de champ change la mesure affichée ; il n'applique pas de calcul YTD." }
references:
  - title: Create calculation groups in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/calculation-groups
