id: dp600-3b-perf-agg-rls
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a semantic model that contains a DirectQuery table named **Sales** related to the dimension tables **Date**, **Product** and **Geography**, which use the Dual storage mode. An Import aggregation table named **SalesAgg** summarizes Sales by DateKey and ProductKey and is related to Date and Product only.

    A row-level security (RLS) role filters Geography[Country]. Queries from users who are members of the role never use SalesAgg, while queries from other users do.

    The users must keep the Country filter, and their queries must use the aggregation. What should you do?
  fr: |
    Vous disposez d'un modèle sémantique qui contient une table DirectQuery nommée **Sales** reliée aux tables de dimension **Date**, **Product** et **Geography**, qui utilisent le mode de stockage Double (Dual). Une table d'agrégation Import nommée **SalesAgg** résume Sales par DateKey et ProductKey et n'est reliée qu'à Date et à Product.

    Un rôle de sécurité au niveau des lignes (RLS) filtre Geography[Country]. Les requêtes des utilisateurs membres du rôle n'utilisent jamais SalesAgg, alors que celles des autres utilisateurs l'utilisent.

    Les utilisateurs doivent conserver le filtre sur Country, et leurs requêtes doivent utiliser l'agrégation. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the role so that it filters SalesAgg instead of Geography", fr: "Modifier le rôle pour qu'il filtre SalesAgg au lieu de Geography" } }
    - { id: b, text: { en: "Add GeographyKey to the grain of SalesAgg and relate SalesAgg to Geography", fr: "Ajouter GeographyKey au grain de SalesAgg et relier SalesAgg à Geography" } }
    - { id: c, text: { en: "Change the storage mode of Geography from Dual to Import", fr: "Changer le mode de stockage de Geography de Double à Import" } }
    - { id: d, text: { en: "Increase the precedence of SalesAgg in Manage aggregations", fr: "Augmenter la priorité (precedence) de SalesAgg dans Gérer les agrégations" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      To keep aggregation hits, an RLS expression must filter both the aggregation table and the detail table. A filter on Geography reaches only Sales, so filtered queries fall back to DirectQuery. Adding GeographyKey to SalesAgg and relating it to Geography lets the role filter both tables, as a dimension related to both does.
    fr: |
      Pour conserver l'utilisation des agrégations, une expression RLS doit filtrer à la fois la table d'agrégation et la table de détails. Un filtre sur Geography n'atteint que Sales : les requêtes filtrées reviennent donc à DirectQuery. Ajouter GeographyKey à SalesAgg et la relier à Geography permet au rôle de filtrer les deux tables, comme le fait une dimension reliée aux deux.
  options:
    a:
      en: |
        An RLS filter on the aggregation table only is not allowed, and it would not filter the detail rows.
      fr: |
        Un filtre RLS sur la seule table d'agrégation n'est pas autorisé, et il ne filtrerait pas les lignes de détails.
    c:
      en: |
        An Import Geography table would create limited relationships with the DirectQuery Sales table and still would not filter SalesAgg.
      fr: |
        Une table Geography en Import créerait des relations limitées avec la table DirectQuery Sales et ne filtrerait toujours pas SalesAgg.
    d:
      en: |
        Precedence decides which aggregation table is tried first; it cannot make SalesAgg answer a query that its relationships cannot filter.
      fr: |
        La priorité décide quelle table d'agrégation est essayée en premier ; elle ne peut pas faire répondre SalesAgg à une requête que ses relations ne peuvent pas filtrer.
references:
  - title: User-defined aggregations
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/aggregations-advanced
