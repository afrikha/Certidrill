id: dp600-3a-dax-percent-parent
objective: "3.1.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    A matrix shows **Total Sales** with 'Product'[Category] on rows and 'Product'[Product] below it. The page also has a slicer on 'Product'[Product], and users usually select only some products.

    You need a measure that returns:

    - on product rows, the product's share of its category, among the selected products
    - on category rows, the category's share of the total of the selected products
    - on the grand total row, 1

    How should you complete the DAX expression? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une matrice affiche **Total Sales** avec 'Product'[Category] en lignes et 'Product'[Product] en dessous. La page comporte aussi un segment sur 'Product'[Product], et les utilisateurs ne sélectionnent généralement que certains produits.

    Vous avez besoin d'une mesure qui renvoie :

    - sur les lignes de produit, la part du produit dans sa catégorie, parmi les produits sélectionnés
    - sur les lignes de catégorie, la part de la catégorie dans le total des produits sélectionnés
    - sur la ligne de total général, 1

    Comment devez-vous compléter l'expression DAX ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    % of Parent =
    SWITCH (
        TRUE (),
        [[t1]] ( 'Product'[Product] ),
            DIVIDE (
                [Total Sales],
                CALCULATE ( [Total Sales], ALLSELECTED ( 'Product'[Product] ) )
            ),
        ISINSCOPE ( 'Product'[Category] ),
            DIVIDE (
                [Total Sales],
                CALCULATE ( [Total Sales], [[t2]] ( 'Product'[Category] ) )
            ),
        1
    )
  slots:
    - id: t1
      options:
        - { id: isinscope, text: ISINSCOPE }
        - { id: isfiltered, text: ISFILTERED }
        - { id: hasone, text: HASONEVALUE }
        - { id: iscross, text: ISCROSSFILTERED }
    - id: t2
      options:
        - { id: allselected, text: ALLSELECTED }
        - { id: values, text: VALUES }
        - { id: keep, text: KEEPFILTERS }
        - { id: selectedvalue, text: SELECTEDVALUE }
answer:
  values: { t1: isinscope, t2: allselected }
explanation:
  correct:
    en: |
      ISINSCOPE returns TRUE when the column is the current level of the hierarchy, so the product test must come first and is TRUE only on product rows. ALLSELECTED removes the row filter of the matrix on the column while keeping the slicer, so each denominator is the total of the selected products in the parent.
    fr: |
      ISINSCOPE renvoie TRUE quand la colonne est le niveau actuel de la hiérarchie ; le test sur le produit doit donc venir en premier et n'est TRUE que sur les lignes de produit. ALLSELECTED supprime le filtre de ligne de la matrice sur la colonne tout en conservant le segment ; chaque dénominateur est donc le total des produits sélectionnés dans le parent.
  options:
    isfiltered: { en: "The Product slicer makes ISFILTERED TRUE on category and total rows too.", fr: "Le segment Product rend ISFILTERED TRUE aussi sur les lignes de catégorie et de total." }
    hasone: { en: "A category row that contains a single selected product would be treated as a product row.", fr: "Une ligne de catégorie qui ne contient qu'un seul produit sélectionné serait traitée comme une ligne de produit." }
    iscross: { en: "ISCROSSFILTERED is TRUE whenever Product is filtered directly or through relationships, at every level.", fr: "ISCROSSFILTERED est TRUE dès que Product est filtré directement ou par des relations, à tous les niveaux." }
    values: { en: "VALUES keeps the current category, so the category share would always be 1.", fr: "VALUES conserve la catégorie actuelle ; la part de la catégorie vaudrait donc toujours 1." }
    keep: { en: "KEEPFILTERS takes a filter expression and keeps the current category filter.", fr: "KEEPFILTERS prend une expression de filtre et conserve le filtre de catégorie actuel." }
    selectedvalue: { en: "SELECTEDVALUE returns a scalar value, not a filter that CALCULATE can apply.", fr: "SELECTEDVALUE renvoie une valeur scalaire, pas un filtre que CALCULATE peut appliquer." }
references:
  - title: ISINSCOPE function (DAX)
    url: https://learn.microsoft.com/en-us/dax/isinscope-function-dax
  - title: ALLSELECTED function (DAX)
    url: https://learn.microsoft.com/en-us/dax/allselected-function-dax
