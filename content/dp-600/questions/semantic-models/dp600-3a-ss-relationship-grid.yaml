id: dp600-3a-ss-relationship-grid
objective: "3.1.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have an Import semantic model with the relationships shown in the following table. Report users have a Product slicer and a Customer slicer on the same page.

    Answer each prompt by selecting the appropriate relationship.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique Import dont les relations figurent dans le tableau suivant. Les utilisateurs des rapports ont un segment Product et un segment Customer sur la même page.

    Répondez à chaque consigne en sélectionnant la relation appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The relationship that a Units Shipped measure must activate with USERELATIONSHIP", fr: "La relation qu'une mesure Units Shipped doit activer avec USERELATIONSHIP" }
    - id: p2
      text: { en: "The relationship that makes the Customer slicer show only customers who bought the products selected in the Product slicer", fr: "La relation qui fait que le segment Customer n'affiche que les clients ayant acheté les produits sélectionnés dans le segment Product" }
  grid:
    header: [{ en: "Many side", fr: "Côté plusieurs" }, { en: "One side", fr: "Côté un" }, { en: "Cross-filter direction", fr: "Direction du filtrage croisé" }, { en: "Active", fr: "Active" }]
    rows:
      - [{ text: "Sales[ProductKey]", area: r1 }, { text: "Product[ProductKey]" }, { text: Single }, { text: { en: "Yes", fr: "Oui" } }]
      - [{ text: "Sales[OrderDateKey]", area: r2 }, { text: "Date[DateKey]" }, { text: Single }, { text: { en: "Yes", fr: "Oui" } }]
      - [{ text: "Sales[ShipDateKey]", area: r3 }, { text: "Date[DateKey]" }, { text: Single }, { text: { en: "No", fr: "Non" } }]
      - [{ text: "Sales[CustomerKey]", area: r4 }, { text: "Customer[CustomerKey]" }, { text: Both }, { text: { en: "Yes", fr: "Oui" } }]
      - [{ text: "Product[SubcategoryKey]", area: r5 }, { text: "Subcategory[SubcategoryKey]" }, { text: Single }, { text: { en: "Yes", fr: "Oui" } }]
answer:
  values: { p1: r3, p2: r4 }
explanation:
  correct:
    en: |
      The Sales[ShipDateKey] relationship is inactive, so a ship-date measure activates it with USERELATIONSHIP inside CALCULATE. A Product filter reaches Sales through the single-direction product relationship, and only the bidirectional Sales[CustomerKey] relationship lets that filter continue from Sales to Customer. Learn advises against this design for slicers; a visual-level filter on the slicer gives the same result with a single-direction relationship.
    fr: |
      La relation sur Sales[ShipDateKey] est inactive ; une mesure par date d'expédition l'active donc avec USERELATIONSHIP dans CALCULATE. Un filtre sur Product atteint Sales par la relation produit à direction unique, et seule la relation bidirectionnelle sur Sales[CustomerKey] permet à ce filtre de continuer de Sales vers Customer. Learn déconseille cette conception pour les segments ; un filtre au niveau du visuel sur le segment donne le même résultat avec une relation à direction unique.
references:
  - title: Bi-directional relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-bidirectional-filtering
  - title: Active vs inactive relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-active-inactive
