id: dp600-3a-rel-bridge-create
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a semantic model that contains a **Customer** table (CustomerID), an **Account** table (AccountID) and a **Transaction** fact table related to Account on AccountID. A customer can own several accounts, and an account can have several owners.

    Report users must be able to filter transactions by customer.

    What should you add to the model?
  fr: |
    Woodgrove Bank dispose d'un modèle sémantique qui contient une table **Customer** (CustomerID), une table **Account** (AccountID) et une table de faits **Transaction** liée à Account sur AccountID. Un client peut détenir plusieurs comptes, et un compte peut avoir plusieurs titulaires.

    Les utilisateurs des rapports doivent pouvoir filtrer les transactions par client.

    Que devez-vous ajouter au modèle ?
body:
  options:
    - { id: a, text: { en: "A CustomerID column in Account, and a one-to-many relationship from Customer to Account", fr: "Une colonne CustomerID dans Account, et une relation un-à-plusieurs de Customer vers Account" } }
    - { id: b, text: { en: "A one-to-one relationship between Customer[CustomerID] and Account[AccountID]", fr: "Une relation un-à-un entre Customer[CustomerID] et Account[AccountID]" } }
    - { id: c, text: { en: "A bridging table with one row per AccountID and CustomerID pair, related one-to-many to Customer and to Account", fr: "Une table de pont avec une ligne par paire AccountID et CustomerID, liée en un-à-plusieurs à Customer et à Account" } }
    - { id: d, text: { en: "A calculated column in Transaction that uses RELATED to return the CustomerID of the account", fr: "Une colonne calculée dans Transaction qui utilise RELATED pour renvoyer le CustomerID du compte" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Two dimensions with a many-to-many association are related through a bridging table (a factless fact table) that stores each valid pair. Each dimension has a one-to-many relationship to the bridge, and one of these relationships is then set to filter in both directions so that customer filters reach the transactions.
    fr: |
      Deux dimensions liées par une association plusieurs-à-plusieurs sont reliées par une table de pont (table de faits sans fait) qui stocke chaque paire valide. Chaque dimension a une relation un-à-plusieurs vers le pont, et l'une de ces relations est ensuite réglée pour filtrer dans les deux directions afin que les filtres sur les clients atteignent les transactions.
  options:
    a: { en: "An account can have several owners, so a single CustomerID column in Account can't store them.", fr: "Un compte peut avoir plusieurs titulaires ; une seule colonne CustomerID dans Account ne peut pas les stocker." }
    b: { en: "CustomerID and AccountID are different keys; a one-to-one relationship between them is meaningless.", fr: "CustomerID et AccountID sont des clés différentes ; une relation un-à-un entre elles n'a pas de sens." }
    d: { en: "RELATED returns one value from the one side; an account has several customers.", fr: "RELATED renvoie une seule valeur du côté « un » ; un compte a plusieurs clients." }
references:
  - title: Many-to-many relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-many-to-many
