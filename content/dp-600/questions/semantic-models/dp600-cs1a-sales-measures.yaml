id: dp600-cs1a-sales-measures
objective: "3.1.4"
type: dropdown
caseStudy: dp600-cs1a-wingtip-toys
difficulty: 1
status: draft
stem:
  en: |
    You need to create two measures in SalesModel that meet the semantic model requirements. gold_dim_date is marked as a date table. How should you complete the DAX expressions? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer dans SalesModel deux mesures qui satisfont les exigences relatives au modèle sémantique. gold_dim_date est marquée comme table de dates. Comment devez-vous compléter les expressions DAX ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Sales Amount =
    [[iter]](
        gold_fact_sales,
        gold_fact_sales[Quantity] * gold_fact_sales[UnitPrice]
    )

    Sales Amount PY =
    CALCULATE(
        [Sales Amount],
        [[time]](gold_dim_date[Date])
    )
  slots:
    - id: iter
      options:
        - { id: sum, text: SUM }
        - { id: sumx, text: SUMX }
        - { id: calc, text: CALCULATE }
        - { id: addcols, text: ADDCOLUMNS }
    - id: time
      options:
        - { id: ytd, text: DATESYTD }
        - { id: lastdate, text: LASTDATE }
        - { id: spl, text: SAMEPERIODLASTYEAR }
        - { id: prevday, text: PREVIOUSDAY }
answer:
  values: { iter: sumx, time: spl }
explanation:
  correct:
    en: SUMX is an iterator that evaluates Quantity × UnitPrice for each row of gold_fact_sales and sums the results, so no sales amount column has to be stored. SAMEPERIODLASTYEAR shifts the dates of the current filter context back one year, so CALCULATE returns the sales of the same period in the previous year.
    fr: SUMX est un itérateur qui évalue Quantity × UnitPrice pour chaque ligne de gold_fact_sales et additionne les résultats ; aucune colonne de montant n'a donc besoin d'être stockée. SAMEPERIODLASTYEAR décale d'un an les dates du contexte de filtre actuel ; CALCULATE renvoie donc les ventes de la même période de l'année précédente.
  options:
    sum: { en: "SUM accepts a single column, not a table and a row expression.", fr: "SUM accepte une seule colonne, pas une table et une expression évaluée ligne par ligne." }
    calc: { en: "CALCULATE expects an expression followed by filters; a table as the first argument is not valid here.", fr: "CALCULATE attend une expression suivie de filtres ; une table comme premier argument n'est pas valide ici." }
    addcols: { en: "ADDCOLUMNS returns a table with an extra column, not a scalar value for a measure.", fr: "ADDCOLUMNS renvoie une table avec une colonne supplémentaire, pas une valeur scalaire pour une mesure." }
    ytd: { en: "DATESYTD returns the dates from the start of the current year, not the dates of the previous year.", fr: "DATESYTD renvoie les dates depuis le début de l'année en cours, pas celles de l'année précédente." }
    lastdate: { en: "LASTDATE returns the last date of the current context, in the current year.", fr: "LASTDATE renvoie la dernière date du contexte actuel, dans l'année en cours." }
    prevday: { en: "PREVIOUSDAY returns the day before the first date of the context, not the same period one year earlier.", fr: "PREVIOUSDAY renvoie le jour qui précède la première date du contexte, pas la même période un an plus tôt." }
references:
  - title: SUMX function (DAX)
    url: https://learn.microsoft.com/en-us/dax/sumx-function-dax
  - title: SAMEPERIODLASTYEAR function (DAX)
    url: https://learn.microsoft.com/en-us/dax/sameperiodlastyear-function-dax
