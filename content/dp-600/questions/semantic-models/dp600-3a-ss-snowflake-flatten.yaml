id: dp600-3a-ss-snowflake-flatten
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Import semantic model that contains a fact table named **Sales** and three product tables imported from a normalized source: **Product**, **ProductSubcategory** and **ProductCategory**. Sales relates to Product, Product relates to ProductSubcategory, and ProductSubcategory relates to ProductCategory, all with many-to-one relationships.

    Report authors need a single Category > Subcategory > Product hierarchy, and you need to reduce the number of tables in the Data pane.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique Import qui contient une table de faits nommée **Sales** et trois tables de produits importées d'une source normalisée : **Product**, **ProductSubcategory** et **ProductCategory**. Sales est liée à Product, Product à ProductSubcategory et ProductSubcategory à ProductCategory, toutes par des relations plusieurs-à-un.

    Les auteurs de rapports ont besoin d'une seule hiérarchie Category > Subcategory > Product, et vous devez réduire le nombre de tables dans le volet Données.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the cross-filter direction of the two product relationships to Both.", fr: "Définir la direction du filtrage croisé des deux relations entre tables de produits sur Les deux (Both)." } }
    - { id: b, text: { en: "Hide the ProductSubcategory and ProductCategory tables in Model view.", fr: "Masquer les tables ProductSubcategory et ProductCategory dans la vue Modèle." } }
    - { id: c, text: { en: "In Power Query, merge the subcategory and category columns into the Product query and disable load for the other two queries.", fr: "Dans Power Query, fusionner les colonnes de sous-catégorie et de catégorie dans la requête Product et désactiver le chargement des deux autres requêtes." } }
    - { id: d, text: { en: "Create many-to-many relationships between ProductCategory and Sales.", fr: "Créer des relations plusieurs-à-plusieurs entre ProductCategory et Sales." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A snowflake dimension is generally better flattened into one model table. A single Product table can hold a hierarchy that spans the full grain, needs fewer tables to load, shortens filter propagation and declutters the Data pane, at the cost of some redundant storage.
    fr: |
      Une dimension en flocon est généralement mieux aplatie en une seule table du modèle. Une table Product unique peut porter une hiérarchie couvrant tout le grain, réduit le nombre de tables à charger, raccourcit la propagation des filtres et allège le volet Données, au prix d'un peu de stockage redondant.
  options:
    a: { en: "Bidirectional filters don't merge the tables, and a hierarchy can't span several tables.", fr: "Des filtres bidirectionnels ne fusionnent pas les tables, et une hiérarchie ne peut pas couvrir plusieurs tables." }
    b: { en: "Hidden tables still exist and their columns can't be part of a hierarchy defined in Product.", fr: "Les tables masquées existent toujours et leurs colonnes ne peuvent pas faire partie d'une hiérarchie définie dans Product." }
    d: { en: "Category isn't a key of Sales; a many-to-many relationship would create a limited relationship and wouldn't build the hierarchy.", fr: "Category n'est pas une clé de Sales ; une relation plusieurs-à-plusieurs créerait une relation limitée et ne construirait pas la hiérarchie." }
references:
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
