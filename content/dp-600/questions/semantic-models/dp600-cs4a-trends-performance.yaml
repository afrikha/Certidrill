id: dp600-cs4a-trends-performance
objective: "3.2.1"
type: single
caseStudy: dp600-cs4a-margies-travel
difficulty: 1
status: draft
stem:
  en: |
    You open Campaign Performance in Power BI Desktop. You need to meet the fifth requirement for semantic models and reports.

    What should you use?
  fr: |
    Vous ouvrez Campaign Performance dans Power BI Desktop. Vous devez satisfaire la cinquième exigence relative aux modèles sémantiques et aux rapports.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Query diagnostics in Power Query Editor, then the diagnostics query of each visual", fr: "Les diagnostics de requête dans l'Éditeur Power Query, puis la requête de diagnostic de chaque visuel" } }
    - { id: b, text: { en: "DAX query view, then the Run button for the measures used by each visual", fr: "La vue de requête DAX, puis le bouton Exécuter pour les mesures utilisées par chaque visuel" } }
    - { id: c, text: { en: "The Pause visuals option of the Optimize ribbon, then Refresh for each visual", fr: "L'option Suspendre les visuels du ruban Optimiser, puis Actualiser pour chaque visuel" } }
    - { id: d, text: { en: "Performance Analyzer, then Run in DAX query view for the slowest visual", fr: "L'Analyseur de performances, puis Exécuter dans la vue de requête DAX pour le visuel le plus lent" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Performance Analyzer records, for each visual that is refreshed while recording, the duration of the DAX query, of the visual display and of other processing. For any visual, it can copy the DAX query or run it directly in DAX query view, where the developers can analyze it."
    fr: "L'Analyseur de performances enregistre, pour chaque visuel actualisé pendant l'enregistrement, la durée de la requête DAX, de l'affichage du visuel et des autres traitements. Pour chaque visuel, il peut copier la requête DAX ou l'exécuter directement dans la vue de requête DAX, où les développeurs peuvent l'analyser."
  options:
    a: { en: "Query diagnostics trace the Power Query steps that run during a data refresh, not the queries that visuals send to the model.", fr: "Les diagnostics de requête tracent les étapes Power Query exécutées pendant une actualisation des données, pas les requêtes que les visuels envoient au modèle." }
    b: { en: "DAX query view runs queries that you write, but it does not capture the queries of the report visuals or the time spent drawing them.", fr: "La vue de requête DAX exécute les requêtes que vous écrivez, mais elle ne capture pas les requêtes des visuels du rapport ni le temps passé à les dessiner." }
    c: { en: "Pausing visuals stops them from sending queries while you edit the model; it does not measure any duration.", fr: "Suspendre les visuels les empêche d'envoyer des requêtes pendant que vous modifiez le modèle ; cela ne mesure aucune durée." }
references:
  - title: Use Performance Analyzer to examine report performance
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-performance-analyzer
