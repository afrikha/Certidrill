id: dp600-sr2-category-targets-2
objective: "3.1.3"
type: series_yesno
series: dp600-sr2-category-targets
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You create a many-to-many relationship in which Product filters Target.
  fr: Vous créez une relation plusieurs-à-plusieurs dans laquelle Product filtre Target.
body:
  solution:
    en: You create a relationship between **Product[Category]** and **Target[Category]** with the **Many to many** cardinality and a **Single** cross-filter direction in which Product filters Target.
    fr: Vous créez une relation entre **Product[Category]** et **Target[Category]** avec la cardinalité **Plusieurs-à-plusieurs** et une direction de filtrage croisé **Unique** dans laquelle Product filtre Target.
answer: { value: true }
explanation:
  correct:
    en: Target stores facts at a higher grain than Product, and Category is not unique in either table, so the guidance is a many-to-many relationship on Category that propagates filters in a single direction, from the dimension to the fact table. A category slicer then filters Target through this relationship and Sales through ProductKey, and Target can't filter Product.
    fr: "Target stocke des faits à un grain plus élevé que Product, et Category n'est unique dans aucune des deux tables : la recommandation est une relation plusieurs-à-plusieurs sur Category qui propage les filtres dans une seule direction, de la table de dimension vers la table de faits. Un segment de catégorie filtre alors Target par cette relation et Sales par ProductKey, et Target ne peut pas filtrer Product."
references:
  - title: Many-to-many relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-many-to-many
