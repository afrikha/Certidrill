id: dp600-3c-ir-policy-settings
objective: "3.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are defining the incremental refresh policy of a table named FactShipments in a semantic model that is published to a workspace on a Fabric capacity. Shipments are finalized at midnight, and a shipment is never changed after its shipment date.

    Which policy setting should you use for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez la stratégie d'actualisation incrémentielle d'une table nommée FactShipments dans un modèle sémantique publié dans un espace de travail sur une capacité Fabric. Les expéditions sont finalisées à minuit, et une expédition n'est jamais modifiée après sa date d'expédition.

    Quel paramètre de la stratégie devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: archive, text: Archive data starting before refresh date }
    - { id: incremental, text: Incrementally refresh data starting before refresh date }
    - { id: realtime, text: Get the latest data in real time with DirectQuery }
    - { id: complete, text: Only refresh complete days }
    - { id: detect, text: Detect data changes }
  targets:
    - id: history
      text:
        en: "Keep five years of shipments in the model."
        fr: "Conserver cinq ans d'expéditions dans le modèle."
    - id: window
      text:
        en: "Reload the shipments of the last seven days at every refresh."
        fr: "Recharger les expéditions des sept derniers jours à chaque actualisation."
    - id: partial
      text:
        en: "Never load the shipments of the current day before it ends."
        fr: "Ne jamais charger les expéditions du jour en cours avant sa fin."
    - id: live
      text:
        en: "Show in reports the shipments inserted after the last refresh."
        fr: "Afficher dans les rapports les expéditions insérées après la dernière actualisation."
answer:
  mapping: { history: archive, window: incremental, partial: complete, live: realtime }
explanation:
  correct:
    en: |
      The archive setting defines the historical period kept in the model, and the incremental setting defines the window reloaded at every refresh. Only refresh complete days skips the incomplete current day. Get the latest data in real time with DirectQuery adds a DirectQuery partition after the refresh window, which returns the rows inserted since the last refresh; it requires Premium, Premium Per User or Embedded, which a Fabric capacity provides.
    fr: |
      Le paramètre d'archivage définit la période historique conservée dans le modèle, et le paramètre incrémentiel la fenêtre rechargée à chaque actualisation. Only refresh complete days ignore le jour en cours incomplet. Get the latest data in real time with DirectQuery ajoute une partition DirectQuery après la fenêtre d'actualisation, qui renvoie les lignes insérées depuis la dernière actualisation ; il exige Premium, Premium par utilisateur ou Embedded, ce que fournit une capacité Fabric.
  options:
    detect: { en: "Detect data changes refreshes only the periods whose audit column changed; shipments never change, so it meets none of the requirements.", fr: "Detect data changes n'actualise que les périodes dont la colonne d'audit a changé ; les expéditions ne changent jamais, il ne satisfait donc aucune exigence." }
references:
  - title: Configure incremental refresh and real-time data
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-configure
