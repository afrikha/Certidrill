id: dp600-3c-fallback-causes
objective: "3.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace on an F64 capacity. The workspace contains a warehouse named Warehouse1 and a Direct Lake on SQL analytics endpoint semantic model named FinModel that uses the tables of Warehouse1. The **Direct Lake behavior** property of FinModel is set to Automatic.

    Users report that some visuals are slower than usual, and you suspect that their queries fall back to DirectQuery mode.

    Which two conditions cause queries on FinModel to fall back to DirectQuery?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric sur une capacité F64. L'espace de travail contient un entrepôt nommé Warehouse1 et un modèle sémantique Direct Lake sur le point de terminaison d'analytique SQL nommé FinModel qui utilise les tables de Warehouse1. La propriété **Direct Lake behavior** de FinModel est définie sur Automatic.

    Des utilisateurs signalent que certains visuels sont plus lents que d'habitude, et vous soupçonnez que leurs requêtes basculent en mode DirectQuery.

    Quelles sont les deux conditions qui font basculer les requêtes sur FinModel en DirectQuery ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "A dynamic data masking rule is defined on the Email column of the Customer table in Warehouse1."
        fr: "Une règle de masquage dynamique des données est définie sur la colonne Email de la table Customer dans Warehouse1."
    - id: b
      text:
        en: "A role defined in FinModel filters the Region table with a DAX expression."
        fr: "Un rôle défini dans FinModel filtre la table Region avec une expression DAX."
    - id: c
      text:
        en: "**Keep your Direct Lake data up to date** is turned off for FinModel."
        fr: "**Keep your Direct Lake data up to date** est désactivé pour FinModel."
    - id: d
      text:
        en: "A table was added to FinModel by using the Tabular Object Model (TOM), and FinModel hasn't been refreshed since."
        fr: "Une table a été ajoutée à FinModel avec le modèle objet tabulaire (TOM), et FinModel n'a pas été actualisé depuis."
    - id: e
      text:
        en: "The Delta table behind the GeneralLedger table contains 4,000 Parquet files."
        fr: "La table Delta de la table GeneralLedger contient 4 000 fichiers Parquet."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A query on Direct Lake on SQL stays in Direct Lake mode only when no referenced table has SQL row-level security, object-level security or dynamic data masking at the SQL analytics endpoint, no table is a non-materialized view or exceeds a guardrail, and the model was framed after its tables were created or modified. Dynamic data masking and a table that was never framed both cause fallback."
    fr: "Une requête Direct Lake sur SQL reste en mode Direct Lake seulement si aucune table référencée n'a de sécurité au niveau des lignes, de sécurité au niveau de l'objet ou de masquage dynamique des données au point de terminaison d'analytique SQL, si aucune table n'est une vue non matérialisée ni ne dépasse un garde-fou, et si le modèle a été cadré après la création ou la modification de ses tables. Le masquage dynamique des données et une table jamais cadrée provoquent tous deux le basculement."
  options:
    b: { en: "Row-level security defined in the semantic model is supported in Direct Lake and doesn't cause fallback.", fr: "La sécurité au niveau des lignes définie dans le modèle sémantique est prise en charge en Direct Lake et ne provoque pas de basculement." }
    c: { en: "Without automatic updates, queries return the data of the last framing; they don't fall back.", fr: "Sans mises à jour automatiques, les requêtes renvoient les données du dernier cadrage ; elles ne basculent pas." }
    e: { en: "On an F64 capacity, the guardrail is 5,000 Parquet files per table, so 4,000 files are within the limit.", fr: "Sur une capacité F64, le garde-fou est de 5 000 fichiers Parquet par table : 4 000 fichiers respectent la limite." }
references:
  - title: How Direct Lake works
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
