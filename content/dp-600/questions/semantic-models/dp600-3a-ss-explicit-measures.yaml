id: dp600-3a-ss-explicit-measures
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are designing a star schema semantic model named **RetailModel**. To keep the model small, you want to rely on implicit measures (summarized numeric columns) wherever they work, and add explicit DAX measures only where they are required.

    Which two scenarios require RetailModel to contain explicit measures?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez un modèle sémantique en schéma en étoile nommé **RetailModel**. Pour garder un modèle léger, vous voulez vous appuyer sur des mesures implicites (colonnes numériques synthétisées) partout où elles fonctionnent, et n'ajouter des mesures DAX explicites que là où elles sont requises.

    Quels sont les deux scénarios qui exigent que RetailModel contienne des mesures explicites ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Analysts use Analyze in Excel to build PivotTables on RetailModel.", fr: "Des analystes utilisent Analyser dans Excel pour créer des tableaux croisés dynamiques sur RetailModel." } }
    - { id: b, text: { en: "Report authors build table and matrix visuals in Power BI Desktop.", fr: "Des auteurs de rapports créent des visuels table et matrice dans Power BI Desktop." } }
    - { id: c, text: { en: "A paginated report queries RetailModel by using the MDX query designer.", fr: "Un rapport paginé interroge RetailModel avec le concepteur de requêtes MDX." } }
    - { id: d, text: { en: "Users ask questions about sales by using Q&A.", fr: "Des utilisateurs posent des questions sur les ventes avec Questions et réponses (Q&A)." } }
    - { id: e, text: { en: "Users pin report visuals to a dashboard.", fr: "Des utilisateurs épinglent des visuels de rapport à un tableau de bord." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Analyze in Excel issues MDX queries, and MDX can't summarize column values, so the model must provide explicit measures. Paginated reports that use the MDX query designer rely on server aggregates and also need measures defined in the model.
    fr: |
      Analyser dans Excel émet des requêtes MDX, et MDX ne peut pas synthétiser les valeurs de colonnes ; le modèle doit donc fournir des mesures explicites. Les rapports paginés qui utilisent le concepteur de requêtes MDX s'appuient sur des agrégats serveur et ont aussi besoin de mesures définies dans le modèle.
  options:
    b: { en: "Power BI visuals can summarize numeric columns directly as implicit measures.", fr: "Les visuels Power BI peuvent synthétiser directement des colonnes numériques comme mesures implicites." }
    d: { en: "Q&A can summarize numeric columns without explicit measures.", fr: "Questions et réponses (Q&A) peut synthétiser des colonnes numériques sans mesures explicites." }
    e: { en: "A pinned tile shows the result of a visual, which can use implicit measures.", fr: "Une vignette épinglée affiche le résultat d'un visuel, qui peut utiliser des mesures implicites." }
references:
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
