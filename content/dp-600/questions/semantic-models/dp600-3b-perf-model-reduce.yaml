id: dp600-3b-perf-model-reduce
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Import semantic model named **Orders** that is close to the memory limit of its capacity. Orders has the following characteristics:

    - The Sales table contains an **OrderGUID** column that is unique for each row and is not used by any report, relationship, measure or role.
    - **Auto date/time** is turned on, and the model contains a marked date table.
    - A **Margin** column is computed in Power Query.
    - Staging queries that only feed other queries have **Enable load** turned off.

    You need to reduce the size of Orders without removing any data that reports use.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique Import nommé **Orders** proche de la limite de mémoire de sa capacité. Orders présente les caractéristiques suivantes :

    - La table Sales contient une colonne **OrderGUID** unique pour chaque ligne et utilisée par aucun rapport, relation, mesure ni rôle.
    - **Date/heure automatique** est activée, et le modèle contient une table de dates marquée.
    - Une colonne **Margin** est calculée dans Power Query.
    - Les requêtes intermédiaires qui alimentent seulement d'autres requêtes ont l'option **Activer le chargement** désactivée.

    Vous devez réduire la taille d'Orders sans supprimer de données utilisées par les rapports.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Replace the Power Query Margin column with a DAX calculated column.", fr: "Remplacer la colonne Power Query Margin par une colonne calculée DAX." } }
    - { id: b, text: { en: "Remove the OrderGUID column from the Sales query.", fr: "Supprimer la colonne OrderGUID de la requête Sales." } }
    - { id: c, text: { en: "Change the data type of the OrderNumber column from Whole number to Text.", fr: "Changer le type de données de la colonne OrderNumber de Nombre entier en Texte." } }
    - { id: d, text: { en: "Turn on Enable load for the staging queries.", fr: "Activer l'option Activer le chargement pour les requêtes intermédiaires." } }
    - { id: e, text: { en: "Turn off Auto date/time.", fr: "Désactiver Date/heure automatique." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      A unique column such as a GUID has one dictionary entry per row and compresses poorly, so removing it when nothing uses it saves a lot of memory. Auto date/time creates a hidden calculated date table for each date column, which is useless when the model has its own date table.
    fr: |
      Une colonne unique comme un GUID a une entrée de dictionnaire par ligne et se compresse mal : la supprimer quand rien ne l'utilise libère beaucoup de mémoire. Date/heure automatique crée une table de dates calculée masquée pour chaque colonne de date, ce qui est inutile quand le modèle a sa propre table de dates.
  options:
    a:
      en: |
        DAX calculated columns compress less efficiently than columns computed in Power Query, and they lengthen refresh.
      fr: |
        Les colonnes calculées DAX se compressent moins bien que les colonnes calculées dans Power Query, et elles allongent l'actualisation.
    c:
      en: |
        Numeric columns use value encoding, which is more efficient than the hash encoding used for text.
      fr: |
        Les colonnes numériques utilisent l'encodage par valeur, plus efficace que l'encodage par hachage utilisé pour le texte.
    d:
      en: |
        Loading the staging queries would add tables to the model and increase its size.
      fr: |
        Charger les requêtes intermédiaires ajouterait des tables au modèle et augmenterait sa taille.
references:
  - title: Data reduction techniques for Import modeling
    url: https://learn.microsoft.com/en-us/power-bi/guidance/import-modeling-data-reduction
