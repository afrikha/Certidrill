id: dp600-3a-ss-split-extract
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You import a flat file named **SalesExtract** into a semantic model. Each row contains OrderDate, ProductCode, ProductName, Category, Color, Quantity and Amount. ProductCode identifies a product.

    You need to turn the data into a star schema that lets report authors filter by product attributes and summarize sales.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous importez dans un modèle sémantique un fichier plat nommé **SalesExtract**. Chaque ligne contient OrderDate, ProductCode, ProductName, Category, Color, Quantity et Amount. ProductCode identifie un produit.

    Vous devez transformer ces données en schéma en étoile qui permet aux auteurs de rapports de filtrer par attributs de produit et de synthétiser les ventes.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In Power Query, create a Product query with the distinct ProductCode, ProductName, Category and Color values, and relate it one-to-many to Sales on ProductCode.", fr: "Dans Power Query, créer une requête Product avec les valeurs distinctes de ProductCode, ProductName, Category et Color, et la lier en un-à-plusieurs à Sales sur ProductCode." } }
    - { id: b, text: { en: "Remove the ProductName, Category and Color columns from the Sales query.", fr: "Supprimer les colonnes ProductName, Category et Color de la requête Sales." } }
    - { id: c, text: { en: "Keep all the columns in Sales and set its relationships to filter in both directions.", fr: "Conserver toutes les colonnes dans Sales et définir ses relations pour filtrer dans les deux directions." } }
    - { id: d, text: { en: "Create a Category table related to the Product table.", fr: "Créer une table Category liée à la table Product." } }
    - { id: e, text: { en: "Relate a Product table to Sales with a many-to-many relationship on ProductName.", fr: "Lier une table Product à Sales par une relation plusieurs-à-plusieurs sur ProductName." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Source extracts are often denormalized; Power Query splits them into a dimension (Product, one row per ProductCode with its descriptive attributes) and a fact table that keeps only the key and the numeric columns. The one-to-many relationship on ProductCode lets Product filter Sales.
    fr: |
      Les extraits de source sont souvent dénormalisés ; Power Query les sépare en une dimension (Product, une ligne par ProductCode avec ses attributs descriptifs) et une table de faits qui ne garde que la clé et les colonnes numériques. La relation un-à-plusieurs sur ProductCode permet à Product de filtrer Sales.
  options:
    c: { en: "A table that mixes dimension and fact columns isn't a star schema, and bidirectional filters hurt performance.", fr: "Une table qui mêle colonnes de dimension et de fait n'est pas un schéma en étoile, et les filtres bidirectionnels nuisent aux performances." }
    d: { en: "A separate Category table snowflakes the dimension; one Product table is preferred.", fr: "Une table Category distincte transforme la dimension en flocon ; une table Product unique est préférable." }
    e: { en: "ProductCode is the unique key; a many-to-many relationship on a name creates a limited relationship.", fr: "ProductCode est la clé unique ; une relation plusieurs-à-plusieurs sur un nom crée une relation limitée." }
references:
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
