id: dp600-3b-perf-auto-agg
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a DirectQuery semantic model named **WebSales** that uses an Azure SQL database. WebSales is in a workspace that uses the Premium Per User license mode.

    Report queries are slow, and the questions that users ask change every month. You need cached aggregations that are created and adjusted to the queries that users run, without anyone designing or maintaining aggregation tables.

    What should you configure?
  fr: |
    Vous disposez d'un modèle sémantique DirectQuery nommé **WebSales** qui utilise une base de données Azure SQL. WebSales se trouve dans un espace de travail qui utilise le mode de licence Premium par utilisateur.

    Les requêtes des rapports sont lentes, et les questions des utilisateurs changent chaque mois. Vous avez besoin d'agrégations en cache créées et ajustées en fonction des requêtes des utilisateurs, sans que personne ne conçoive ni ne maintienne des tables d'agrégation.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "User-defined aggregation tables in Manage aggregations", fr: "Des tables d'agrégation définies par l'utilisateur dans Gérer les agrégations" } }
    - { id: b, text: { en: "Query caching in the semantic model settings", fr: "La mise en cache des requêtes dans les paramètres du modèle sémantique" } }
    - { id: c, text: { en: "A hybrid table with an incremental refresh policy", fr: "Une table hybride avec une stratégie d'actualisation incrémentielle" } }
    - { id: d, text: { en: "Automatic aggregations in the semantic model settings", fr: "Les agrégations automatiques dans les paramètres du modèle sémantique" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Automatic aggregations use the query log of the DirectQuery model: a training operation creates, updates or drops system aggregation tables, and scheduled refreshes load them, so frequent queries are answered from memory without manual modeling. The feature is enabled in the model settings and is available with Premium, Premium Per User and Embedded.
    fr: |
      Les agrégations automatiques utilisent le journal des requêtes du modèle DirectQuery : une opération d'entraînement crée, met à jour ou supprime des tables d'agrégation système, et les actualisations planifiées les chargent ; les requêtes fréquentes sont ainsi servies depuis la mémoire sans modélisation manuelle. La fonctionnalité s'active dans les paramètres du modèle et est disponible avec Premium, Premium par utilisateur et Embedded.
  options:
    a:
      en: |
        User-defined aggregations work, but someone must design, map and maintain each aggregation table.
      fr: |
        Les agrégations définies par l'utilisateur fonctionnent, mais quelqu'un doit concevoir, mapper et maintenir chaque table d'agrégation.
    b:
      en: |
        Query caching applies to Import models only, and only to the queries of the landing page.
      fr: |
        La mise en cache des requêtes ne s'applique qu'aux modèles Import, et seulement aux requêtes de la page d'arrivée.
    c:
      en: |
        A hybrid table combines Import partitions with a DirectQuery partition for the latest data; it does not adapt aggregations to user queries.
      fr: |
        Une table hybride combine des partitions Import avec une partition DirectQuery pour les données les plus récentes ; elle n'adapte pas d'agrégations aux requêtes des utilisateurs.
references:
  - title: Automatic aggregations overview
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/aggregations-auto
