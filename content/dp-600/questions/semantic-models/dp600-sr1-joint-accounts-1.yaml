id: dp600-sr1-joint-accounts-1
objective: "3.1.3"
type: series_yesno
series: dp600-sr1-joint-accounts
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You relate both dimensions to AccountHolder with single-direction relationships.
  fr: Vous reliez les deux dimensions à AccountHolder par des relations à direction unique.
body:
  solution:
    en: |
      You create a one-to-many relationship from `Customer[CustomerID]` to `AccountHolder[CustomerID]` and a one-to-many relationship from `Account[AccountID]` to `AccountHolder[AccountID]`. Both relationships use the **Single** cross-filter direction.
    fr: |
      Vous créez une relation un-à-plusieurs de `Customer[CustomerID]` vers `AccountHolder[CustomerID]` et une relation un-à-plusieurs de `Account[AccountID]` vers `AccountHolder[AccountID]`. Les deux relations utilisent la direction de filtrage croisé **Unique** (Single).
answer: { value: false }
explanation:
  correct:
    en: |
      A filter on Customer reaches AccountHolder, but the Account to AccountHolder relationship only propagates filters from Account to AccountHolder. The filter never reaches Account and Transaction, so every customer shows the total balance of all accounts.
    fr: |
      Un filtre sur Customer atteint AccountHolder, mais la relation entre Account et AccountHolder ne propage les filtres que d'Account vers AccountHolder. Le filtre n'atteint jamais Account ni Transaction : chaque client affiche le solde total de tous les comptes.
references:
  - title: Many-to-many relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-many-to-many
