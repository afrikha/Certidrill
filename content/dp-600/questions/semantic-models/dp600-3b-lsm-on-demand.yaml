id: dp600-3b-lsm-on-demand
objective: "3.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS1** that is assigned to an F64 capacity. WS1 contains a 6 GB Import semantic model named **Logistics** that uses the small storage format.

    Logistics is evicted from memory overnight. Each morning, the first users wait a long time before any visual displays data, whatever report page they open and whatever slicers they use.

    You need to reduce the time it takes Logistics to answer queries after an eviction. What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS1** qui est attribué à une capacité F64. WS1 contient un modèle sémantique Import de 6 Go nommé **Logistics** qui utilise le petit format de stockage.

    Logistics est évincé de la mémoire pendant la nuit. Chaque matin, les premiers utilisateurs attendent longtemps avant qu'un visuel affiche des données, quelle que soit la page du rapport qu'ils ouvrent et quels que soient les segments qu'ils utilisent.

    Vous devez réduire le temps nécessaire à Logistics pour répondre aux requêtes après une éviction. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn on query caching for Logistics", fr: "Activer la mise en cache des requêtes pour Logistics" } }
    - { id: b, text: { en: "Turn on Large semantic model storage format for Logistics", fr: "Activer Large semantic model storage format pour Logistics" } }
    - { id: c, text: { en: "Turn on automatic aggregations for Logistics", fr: "Activer les agrégations automatiques pour Logistics" } }
    - { id: d, text: { en: "Configure an incremental refresh policy for Logistics", fr: "Configurer une stratégie d'actualisation incrémentielle pour Logistics" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Large models use on-demand load, which is enabled by default: when an evicted model is used again, only the data pages that queries need are loaded, so the model becomes available for queries faster than when the whole model must be loaded first.
    fr: |
      Les modèles volumineux utilisent le chargement à la demande, activé par défaut : quand un modèle évincé est de nouveau utilisé, seules les pages de données nécessaires aux requêtes sont chargées ; le modèle est donc disponible plus vite que s'il fallait d'abord charger tout le modèle.
  options:
    a:
      en: |
        Query caching stores only the queries of the page a user lands on when opening a report, not the queries of other pages or slicer interactions.
      fr: |
        La mise en cache des requêtes ne conserve que les requêtes de la page d'arrivée à l'ouverture d'un rapport, pas celles des autres pages ni des interactions avec les segments.
    c:
      en: |
        Automatic aggregations apply to DirectQuery models; Logistics is an Import model.
      fr: |
        Les agrégations automatiques s'appliquent aux modèles DirectQuery ; Logistics est un modèle Import.
    d:
      en: |
        Incremental refresh shortens refreshes; it does not change how the model is loaded into memory before queries.
      fr: |
        L'actualisation incrémentielle raccourcit les actualisations ; elle ne change pas la façon dont le modèle est chargé en mémoire avant les requêtes.
references:
  - title: Large semantic models in Power BI Premium
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/service-premium-large-models
  - title: Query caching in Power BI Premium
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/power-bi-query-caching
