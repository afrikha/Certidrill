id: dp600-3c-behavior-tom
objective: "3.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Direct Lake on SQL analytics endpoint semantic model named OpsModel_Dev. You connect to OpsModel_Dev through the XMLA endpoint by using a C# application that uses the Tabular Object Model (TOM).

    You need to ensure that any query that can't be answered in Direct Lake mode fails with an error, so that the developers can find and fix the cause.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique Direct Lake sur le point de terminaison d'analytique SQL nommé OpsModel_Dev. Vous vous connectez à OpsModel_Dev via le point de terminaison XMLA avec une application C# qui utilise le modèle objet tabulaire (TOM).

    Vous devez vous assurer que toute requête à laquelle il est impossible de répondre en mode Direct Lake échoue avec une erreur, afin que les développeurs puissent trouver et corriger la cause.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    Database database = server.Databases.GetByName("OpsModel_Dev");
    database.[[obj]].DirectLakeBehavior = DirectLakeBehavior.[[value]];
    database.Model.SaveChanges();
  slots:
    - id: obj
      options:
        - { id: model, text: Model }
        - id: table
          text: |-
            Model.Tables["FactOrders"]
        - id: expr
          text: |-
            Model.Expressions["DatabaseQuery"]
    - id: value
      options:
        - { id: auto, text: Automatic }
        - { id: dlonly, text: DirectLakeOnly }
        - { id: dqonly, text: DirectQueryOnly }
answer:
  values: { obj: model, value: dlonly }
explanation:
  correct:
    en: "DirectLakeBehavior is a property of the Model object, so it applies to all the tables of the semantic model. DirectLakeOnly disables fallback: a query that can't run in Direct Lake mode returns an error instead of switching to DirectQuery. SaveChanges sends the change to the model."
    fr: "DirectLakeBehavior est une propriété de l'objet Model : elle s'applique à toutes les tables du modèle sémantique. DirectLakeOnly désactive le basculement : une requête qui ne peut pas s'exécuter en mode Direct Lake renvoie une erreur au lieu de passer en DirectQuery. SaveChanges envoie la modification au modèle."
  options:
    table: { en: "Fallback behavior isn't set per table; tables have no DirectLakeBehavior property.", fr: "Le comportement de basculement ne se définit pas par table ; les tables n'ont pas de propriété DirectLakeBehavior." }
    expr: { en: "The shared expression defines the connection to the source, not the fallback behavior.", fr: "L'expression partagée définit la connexion à la source, pas le comportement de basculement." }
    auto: { en: "Automatic silently falls back to DirectQuery, so the queries don't fail.", fr: "Automatic bascule silencieusement en DirectQuery : les requêtes n'échouent pas." }
    dqonly: { en: "DirectQueryOnly sends every query to DirectQuery, so no query fails.", fr: "DirectQueryOnly envoie toutes les requêtes en DirectQuery : aucune requête n'échoue." }
references:
  - title: How Direct Lake works
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works
