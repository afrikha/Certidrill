id: dp600-3b-lsm-desktop-limit
objective: "3.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS1** that is assigned to an F256 capacity. You develop an Import semantic model named **Orders** in Power BI Desktop. Orders contains five years of order history, and the .pbix file is 12 GB.

    When you publish Orders to WS1, the publication fails. Orders must contain the five years of history in the service.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS1** qui est attribué à une capacité F256. Vous développez un modèle sémantique Import nommé **Orders** dans Power BI Desktop. Orders contient cinq ans d'historique de commandes, et le fichier .pbix fait 12 Go.

    Quand vous publiez Orders dans WS1, la publication échoue. Orders doit contenir les cinq ans d'historique dans le service.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the default storage format of WS1 to the large format, and publish again.", fr: "Définir le format volumineux comme format de stockage par défaut de WS1, puis publier à nouveau." } }
    - { id: b, text: { en: "Add an incremental refresh policy, publish a short date range, and refresh in the service.", fr: "Ajouter une stratégie d'actualisation incrémentielle, publier une courte plage de dates, puis actualiser dans le service." } }
    - { id: c, text: { en: "Assign WS1 to an F512 capacity, and publish again.", fr: "Attribuer WS1 à une capacité F512, puis publier à nouveau." } }
    - { id: d, text: { en: "Keep only the last year in the model, and publish again.", fr: "Ne garder que la dernière année dans le modèle, puis publier à nouveau." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Uploads from Power BI Desktop stay limited to 10 GB, even on a large capacity with the large format. You publish a small model whose RangeStart and RangeEnd parameters filter a short period, turn on the large format, and let the first refresh in the service create the partitions and load the five years.
    fr: |
      Les chargements depuis Power BI Desktop restent limités à 10 Go, même sur une grande capacité avec le format volumineux. Vous publiez un petit modèle dont les paramètres RangeStart et RangeEnd filtrent une courte période, activez le format volumineux, puis laissez la première actualisation dans le service créer les partitions et charger les cinq ans.
  options:
    a:
      en: |
        The large format lets a model grow in the service, but it does not raise the 10 GB upload limit of Power BI Desktop.
      fr: |
        Le format volumineux permet à un modèle de grossir dans le service, mais il ne relève pas la limite de chargement de 10 Go de Power BI Desktop.
    c:
      en: |
        A larger capacity gives more memory, but the Desktop upload limit stays 10 GB.
      fr: |
        Une capacité plus grande donne plus de mémoire, mais la limite de chargement depuis Desktop reste de 10 Go.
    d:
      en: |
        Removing history would let the file publish, but the model must contain five years.
      fr: |
        Supprimer l'historique permettrait de publier le fichier, mais le modèle doit contenir cinq ans.
references:
  - title: Large semantic models in Power BI Premium
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/service-premium-large-models
  - title: Configure incremental refresh and real-time data for Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-overview
