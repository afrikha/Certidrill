id: dp600-3c-onelake-parameters
objective: "3.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a Direct Lake on OneLake semantic model named SalesModel in a development workspace. You deploy SalesModel by using a deployment pipeline that has a Development stage and a Test stage. In the Test stage, SalesModel must use the lakehouse of the test workspace.

    You edit the shared expression of SalesModel in TMDL view to add M parameters for the workspace ID and the lakehouse ID, so that you can configure a parameter rule for each value in the Test stage. The LakehouseId parameter is defined in the same way as the WorkspaceId parameter.

    How should you complete the TMDL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique Direct Lake sur OneLake nommé SalesModel dans un espace de travail de développement. Vous déployez SalesModel avec un pipeline de déploiement doté d'une étape Development et d'une étape Test. Dans l'étape Test, SalesModel doit utiliser le lakehouse de l'espace de travail de test.

    Vous modifiez l'expression partagée de SalesModel dans la vue TMDL pour ajouter des paramètres M pour l'ID de l'espace de travail et l'ID du lakehouse, afin de pouvoir configurer une règle de paramètre pour chaque valeur dans l'étape Test. Le paramètre LakehouseId est défini de la même façon que le paramètre WorkspaceId.

    Comment devez-vous compléter le script TMDL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    createOrReplace
        expression 'DirectLake - Sales' =
            let
                Source = [[conn]]("https://onelake.dfs.fabric.microsoft.com/" & WorkspaceId & "/" & LakehouseId, [HierarchicalNavigation = true])
            in
                Source

        expression WorkspaceId = "<workspace-id>" meta [IsParameterQuery = true, IsParameterQueryRequired = true, Type = [[type]]]
  slots:
    - id: conn
      options:
        - { id: datalake, text: AzureStorage.DataLake }
        - { id: sqldb, text: Sql.Database }
        - { id: sqlanalytics, text: OneLake.SqlAnalytics }
        - { id: blobs, text: AzureStorage.Blobs }
    - id: type
      options:
        - { id: any, text: "\"Any\"" }
        - { id: number, text: "\"Number\"" }
        - { id: text, text: "\"Text\"" }
        - { id: binary, text: "\"Binary\"" }
answer:
  values: { conn: datalake, type: text }
explanation:
  correct:
    en: |
      A Direct Lake on OneLake model connects to the OneLake storage location of its source items with the Azure Data Lake Storage connector, AzureStorage.DataLake. Deployment pipelines don't offer data source rules for Direct Lake on OneLake, so you replace the IDs in the URL with parameters of type Text and configure a parameter rule for each one in the target stage.
    fr: |
      Un modèle Direct Lake sur OneLake se connecte à l'emplacement de stockage OneLake de ses éléments sources avec le connecteur Azure Data Lake Storage, AzureStorage.DataLake. Les pipelines de déploiement n'offrent pas de règles de source de données pour Direct Lake sur OneLake : vous remplacez donc les ID de l'URL par des paramètres de type Text et configurez une règle de paramètre pour chacun dans l'étape cible.
  options:
    sqldb: { en: "The SQL Server connector is used by Direct Lake on SQL models, not by Direct Lake on OneLake.", fr: "Le connecteur SQL Server est utilisé par les modèles Direct Lake sur SQL, pas par Direct Lake sur OneLake." }
    sqlanalytics: { en: "OneLake.SqlAnalytics connects to a SQL analytics endpoint, which identifies a Direct Lake on SQL model.", fr: "OneLake.SqlAnalytics se connecte à un point de terminaison d'analytique SQL, ce qui caractérise un modèle Direct Lake sur SQL." }
    blobs: { en: "AzureStorage.Blobs reads Azure Blob Storage, not the OneLake DFS endpoint.", fr: "AzureStorage.Blobs lit Stockage Blob Azure, pas le point de terminaison DFS de OneLake." }
    number: { en: "The workspace and lakehouse IDs are GUID strings, and the parameters must be of type Text.", fr: "Les ID d'espace de travail et de lakehouse sont des chaînes GUID, et les paramètres doivent être de type Text." }
references:
  - title: Develop Direct Lake semantic models
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-develop
