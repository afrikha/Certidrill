id: dp600-3c-auto-date-time
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a lakehouse named Lakehouse1 that contains Delta tables with several date columns. You are creating a Direct Lake semantic model on Lakehouse1 for a team of report authors.

    The report authors require the automatic date hierarchies that Power BI creates with the Auto date/time option, and the model must use Direct Lake storage mode for all its tables.

    Which configuration should you use?
  fr: |
    Vous disposez d'un lakehouse nommé Lakehouse1 qui contient des tables Delta avec plusieurs colonnes de date. Vous créez un modèle sémantique Direct Lake sur Lakehouse1 pour une équipe d'auteurs de rapports.

    Les auteurs de rapports ont besoin des hiérarchies de dates automatiques que Power BI crée avec l'option Date/heure automatique, et le modèle doit utiliser le mode de stockage Direct Lake pour toutes ses tables.

    Quelle configuration devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: "Direct Lake on SQL analytics endpoint with the default Direct Lake behavior"
        fr: "Direct Lake sur le point de terminaison d'analytique SQL avec le comportement Direct Lake par défaut"
    - id: b
      text:
        en: "Direct Lake on SQL analytics endpoint with the **Direct Lake behavior** property set to DirectQueryOnly"
        fr: "Direct Lake sur le point de terminaison d'analytique SQL avec la propriété **Direct Lake behavior** définie sur DirectQueryOnly"
    - id: c
      text:
        en: "Direct Lake on OneLake with the default single sign-on connection"
        fr: "Direct Lake sur OneLake avec la connexion par authentification unique par défaut"
    - id: d
      text:
        en: "Direct Lake on OneLake with the date tables added in DirectQuery storage mode by using XMLA tools"
        fr: "Direct Lake sur OneLake avec les tables de dates ajoutées en mode de stockage DirectQuery à l'aide d'outils XMLA"
answer:
  optionId: c
explanation:
  correct:
    en: "Auto date/time is supported by Direct Lake on OneLake models and not by Direct Lake on SQL models. With either type, you can also mark your own date table and relate it to the date columns."
    fr: "La Date/heure automatique est prise en charge par les modèles Direct Lake sur OneLake, pas par les modèles Direct Lake sur SQL. Avec l'un ou l'autre type, vous pouvez aussi marquer votre propre table de dates et la relier aux colonnes de date."
  options:
    a: { en: "Direct Lake on SQL doesn't support Auto date/time.", fr: "Direct Lake sur SQL ne prend pas en charge la Date/heure automatique." }
    b: { en: "The fallback behavior doesn't change the feature set: Direct Lake on SQL still doesn't support Auto date/time.", fr: "Le comportement de basculement ne modifie pas les fonctionnalités : Direct Lake sur SQL ne prend toujours pas en charge la Date/heure automatique." }
    d: { en: "DirectQuery tables break the requirement that all the tables use Direct Lake storage mode, and Auto date/time works on the date columns of the Direct Lake tables anyway.", fr: "Des tables DirectQuery enfreignent l'exigence selon laquelle toutes les tables utilisent le mode de stockage Direct Lake, et la Date/heure automatique fonctionne de toute façon sur les colonnes de date des tables Direct Lake." }
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
