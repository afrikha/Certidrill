id: dp600-3a-sm-source-security
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank stores customer data in an Azure SQL database named **CustomerDB**. CustomerDB enforces row-level security based on the Microsoft Entra identity of the signed-in user. A compliance policy forbids storing copies of customer data outside CustomerDB.

    You are creating a semantic model for reports in the Power BI service. Single sign-on (SSO) with Microsoft Entra ID will be enabled for the data source connection.

    Which storage mode should you use for the customer tables?
  fr: |
    Woodgrove Bank stocke les données clients dans une base de données Azure SQL nommée **CustomerDB**. CustomerDB applique une sécurité au niveau des lignes basée sur l'identité Microsoft Entra de l'utilisateur connecté. Une stratégie de conformité interdit de stocker des copies des données clients en dehors de CustomerDB.

    Vous créez un modèle sémantique pour des rapports dans le service Power BI. L'authentification unique (SSO) avec Microsoft Entra ID sera activée pour la connexion à la source de données.

    Quel mode de stockage devez-vous utiliser pour les tables clients ?
body:
  options:
    - { id: a, text: DirectQuery }
    - { id: b, text: Import }
    - { id: c, text: { en: "Dual", fr: "Double (Dual)" } }
    - { id: d, text: Direct Lake }
answer: { optionId: a }
explanation:
  correct:
    en: |
      DirectQuery doesn't import data; publishing creates only the schema and metadata. With SSO, the identity of each report user is passed to CustomerDB, so the row-level security defined in the database stays authoritative.
    fr: |
      DirectQuery n'importe pas de données ; la publication ne crée que le schéma et les métadonnées. Avec l'authentification unique, l'identité de chaque utilisateur du rapport est transmise à CustomerDB : la sécurité au niveau des lignes définie dans la base reste celle qui fait foi.
  options:
    b: { en: "Import stores a copy of the data in the model, which the policy forbids.", fr: "Import stocke une copie des données dans le modèle, ce que la stratégie interdit." }
    c: { en: "A Dual table also keeps an imported copy of the data.", fr: "Une table en mode Double conserve elle aussi une copie importée des données." }
    d: { en: "Direct Lake requires the data to be copied to Delta tables in OneLake.", fr: "Direct Lake exige que les données soient copiées dans des tables Delta de OneLake." }
references:
  - title: DirectQuery in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-directquery-about
