id: dp600-3a-dax-variable-once
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer creates the following measure in a semantic model where **Total Sales** is `SUM(Sales[SalesAmount])`:

    ```text
    Sales All Regions =
    VAR _Sales = [Total Sales]
    RETURN
        CALCULATE ( _Sales, REMOVEFILTERS ( Store[Region] ) )
    ```

    A table visual shows Store[Region], Total Sales and Sales All Regions. The West row shows a Total Sales value of 120,000.

    What does Sales All Regions return on the West row?
  fr: |
    Un développeur crée la mesure suivante dans un modèle sémantique où **Total Sales** vaut `SUM(Sales[SalesAmount])` :

    ```text
    Sales All Regions =
    VAR _Sales = [Total Sales]
    RETURN
        CALCULATE ( _Sales, REMOVEFILTERS ( Store[Region] ) )
    ```

    Un visuel table affiche Store[Region], Total Sales et Sales All Regions. La ligne West affiche une valeur Total Sales de 120 000.

    Que renvoie Sales All Regions sur la ligne West ?
body:
  options:
    - { id: a, text: { en: "The sales of all regions", fr: "Les ventes de toutes les régions" } }
    - { id: b, text: { en: "120,000, the sales of the West region", fr: "120 000, les ventes de la région West" } }
    - { id: c, text: { en: "BLANK", fr: "BLANK" } }
    - { id: d, text: { en: "An error, because the first argument of CALCULATE must be a measure", fr: "Une erreur, car le premier argument de CALCULATE doit être une mesure" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A variable is evaluated where it's defined, outside the filters that the RETURN expression applies. _Sales already holds the West total, so CALCULATE can't change it and the measure returns 120,000. To get all regions, the measure reference must be inside CALCULATE.
    fr: |
      Une variable est évaluée là où elle est définie, en dehors des filtres appliqués par l'expression RETURN. _Sales contient déjà le total de West ; CALCULATE ne peut pas le modifier et la mesure renvoie 120 000. Pour obtenir toutes les régions, la référence à la mesure doit se trouver dans CALCULATE.
  options:
    a: { en: "REMOVEFILTERS would only affect an expression evaluated inside CALCULATE; the variable was already evaluated.", fr: "REMOVEFILTERS n'affecterait qu'une expression évaluée dans CALCULATE ; la variable a déjà été évaluée." }
    c: { en: "The variable holds a value, and CALCULATE returns it unchanged.", fr: "La variable contient une valeur, et CALCULATE la renvoie inchangée." }
    d: { en: "CALCULATE accepts any expression, including a variable.", fr: "CALCULATE accepte n'importe quelle expression, y compris une variable." }
references:
  - title: Use variables to improve your DAX formulas
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-variables
