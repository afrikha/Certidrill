id: dp600-3a-dax-iterator-revenue
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a semantic model that contains a **Sales** table with one row per order line. Each row contains a **Quantity** column and a **UnitPrice** column. The model doesn't contain a revenue column, and you must not add one.

    You need a measure that returns the correct revenue at every level of a matrix, including totals.

    Which DAX expression should you use?
  fr: |
    Vous disposez d'un modèle sémantique qui contient une table **Sales** avec une ligne par ligne de commande. Chaque ligne contient une colonne **Quantity** et une colonne **UnitPrice**. Le modèle ne contient pas de colonne de chiffre d'affaires, et vous ne devez pas en ajouter.

    Vous avez besoin d'une mesure qui renvoie le chiffre d'affaires correct à tous les niveaux d'une matrice, y compris les totaux.

    Quelle expression DAX devez-vous utiliser ?
body:
  options:
    - { id: a, text: "SUM ( Sales[Quantity] ) * SUM ( Sales[UnitPrice] )" }
    - { id: b, text: "SUM ( Sales[Quantity] * Sales[UnitPrice] )" }
    - { id: c, text: "AVERAGEX ( Sales, Sales[Quantity] ) * SUM ( Sales[UnitPrice] )" }
    - { id: d, text: "SUMX ( Sales, Sales[Quantity] * Sales[UnitPrice] )" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      SUMX is an iterator. It evaluates Quantity × UnitPrice for each row of Sales in the current filter context and then sums the results, so the revenue is correct at every level without a stored column.
    fr: |
      SUMX est un itérateur. Il évalue Quantity × UnitPrice pour chaque ligne de Sales du contexte de filtre actuel, puis additionne les résultats ; le chiffre d'affaires est donc correct à tous les niveaux sans colonne stockée.
  options:
    a: { en: "This multiplies the total quantity by the sum of all unit prices, which isn't the revenue as soon as there's more than one row.", fr: "Cette expression multiplie la quantité totale par la somme de tous les prix unitaires, ce qui n'est plus le chiffre d'affaires dès qu'il y a plus d'une ligne." }
    b: { en: "SUM accepts only a column reference, not a row-by-row expression.", fr: "SUM n'accepte qu'une référence de colonne, pas une expression évaluée ligne par ligne." }
    c: { en: "Multiplying an average quantity by a sum of prices doesn't compute the revenue of each line.", fr: "Multiplier une quantité moyenne par une somme de prix ne calcule pas le chiffre d'affaires de chaque ligne." }
references:
  - title: SUMX function (DAX)
    url: https://learn.microsoft.com/en-us/dax/sumx-function-dax
