stem:
  en: You set the dimension tables to Dual and keep FactOrders in DirectQuery.
  fr: Vous passez les tables de dimension en mode Double et conservez FactOrders en DirectQuery.
body:
  solution:
    en: |
      In Model view, you set the storage mode of DimProduct, DimStore and DimDate to **Dual**. FactOrders stays in **DirectQuery** mode.
    fr: |
      Dans la vue Modèle, vous définissez le mode de stockage de DimProduct, DimStore et DimDate sur **Double** (Dual). FactOrders reste en mode **DirectQuery**.
answer: { value: true }
explanation:
  correct:
    en: |
      FactOrders in DirectQuery returns the current rows of SalesDB at query time. A Dual table acts as Import or DirectQuery depending on the query: a slicer that uses only a dimension reads the cache, and a visual that combines a dimension with FactOrders is sent to SalesDB as one query with the join. Because the Dual tables can act as DirectQuery tables from the same source, the relationships stay regular.
    fr: |
      FactOrders en DirectQuery renvoie les lignes actuelles de SalesDB au moment de la requête. Une table en mode Double agit comme une table Import ou DirectQuery selon la requête : un segment qui n'utilise qu'une dimension lit le cache, et un visuel qui combine une dimension avec FactOrders est envoyé à SalesDB en une seule requête avec la jointure. Comme les tables en mode Double peuvent agir comme des tables DirectQuery de la même source, les relations restent régulières.
references:
  - title: Table storage mode in Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-storage-mode
