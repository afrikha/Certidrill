id: dp600-3a-ss-ship-date-measure
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Import semantic model that contains a **Sales** fact table with the **OrderDateKey** and **ShipDateKey** columns, and a **Date** dimension table. The relationship between Date[DateKey] and Sales[OrderDateKey] is active.

    You need a measure named **Units Shipped** that groups quantities by ship date. No visual needs to show order dates and ship dates as separate fields at the same time, and the model has no row-level security. The solution must minimize the model size.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique Import qui contient une table de faits **Sales** avec les colonnes **OrderDateKey** et **ShipDateKey**, et une table de dimension **Date**. La relation entre Date[DateKey] et Sales[OrderDateKey] est active.

    Vous avez besoin d'une mesure nommée **Units Shipped** qui regroupe les quantités par date d'expédition. Aucun visuel n'a besoin d'afficher en même temps les dates de commande et les dates d'expédition comme champs distincts, et le modèle n'a pas de sécurité au niveau des lignes. La solution doit réduire au minimum la taille du modèle.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an inactive relationship between Date[DateKey] and Sales[ShipDateKey], and use USERELATIONSHIP in the measure.", fr: "Créer une relation inactive entre Date[DateKey] et Sales[ShipDateKey], et utiliser USERELATIONSHIP dans la mesure." } }
    - { id: b, text: { en: "Create a calculated table named Ship Date that copies Date, and relate it to Sales[ShipDateKey] with an active relationship.", fr: "Créer une table calculée nommée Ship Date qui copie Date, et la lier à Sales[ShipDateKey] par une relation active." } }
    - { id: c, text: { en: "Create a second active relationship between Date[DateKey] and Sales[ShipDateKey].", fr: "Créer une seconde relation active entre Date[DateKey] et Sales[ShipDateKey]." } }
    - { id: d, text: { en: "Set the cross-filter direction of the OrderDateKey relationship to Both.", fr: "Définir la direction du filtrage croisé de la relation sur OrderDateKey sur Les deux (Both)." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When no visual needs both roles at once and only specific measures need the other role, an inactive relationship activated by USERELATIONSHIP in CALCULATE is the right design. It adds no table, so the model size doesn't grow.
    fr: |
      Quand aucun visuel n'a besoin des deux rôles en même temps et que seules certaines mesures ont besoin de l'autre rôle, une relation inactive activée par USERELATIONSHIP dans CALCULATE est la bonne conception. Elle n'ajoute aucune table ; la taille du modèle n'augmente donc pas.
  options:
    b: { en: "A copy of the Date table works but duplicates data, which doesn't minimize the model size.", fr: "Une copie de la table Date fonctionne mais duplique des données, ce qui ne réduit pas la taille du modèle au minimum." }
    c: { en: "Only one active filter path can exist between two tables; the second relationship must be inactive.", fr: "Un seul chemin de filtre actif peut exister entre deux tables ; la seconde relation doit être inactive." }
    d: { en: "The filter direction doesn't change which date column filters Sales.", fr: "La direction du filtre ne change pas la colonne de date qui filtre Sales." }
references:
  - title: Active vs inactive relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-active-inactive
  - title: USERELATIONSHIP function (DAX)
    url: https://learn.microsoft.com/en-us/dax/userelationship-function-dax
