id: dp600-cs3c-enrollment-view
objective: "3.2.3"
type: single
caseStudy: dp600-cs3c-graphic-design-institute
difficulty: 2
status: draft
stem:
  en: |
    You need to meet requirement 1.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence 1.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the Direct Lake behavior property of SM-Enrollment to DirectLakeOnly.", fr: "Définir la propriété Direct Lake behavior de SM-Enrollment sur DirectLakeOnly." } }
    - { id: b, text: { en: "Load the active enrollments into a Delta table of LH-Campus, and base the Enrollment table on that Delta table.", fr: "Charger les inscriptions actives dans une table Delta de LH-Campus, et baser la table Enrollment sur cette table Delta." } }
    - { id: c, text: { en: "Turn on \"Keep your Direct Lake data up to date\" in the settings of SM-Enrollment.", fr: "Activer « Keep your Direct Lake data up to date » dans les paramètres de SM-Enrollment." } }
    - { id: d, text: { en: "Assign GDI-Analytics to an F128 capacity to raise the Direct Lake guardrails.", fr: "Attribuer GDI-Analytics à une capacité F128 pour relever les garde-fous de Direct Lake." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In Direct Lake on SQL, a table based on a non-materialized SQL view is always queried in DirectQuery mode through the SQL analytics endpoint, which explains the slow visuals. Basing Enrollment on a Delta table lets Direct Lake load its columns directly from OneLake.
    fr: |
      En Direct Lake sur SQL, une table basée sur une vue SQL non matérialisée est toujours interrogée en mode DirectQuery via le point de terminaison d'analytique SQL, ce qui explique la lenteur des visuels. Baser Enrollment sur une table Delta permet à Direct Lake de charger ses colonnes directement depuis OneLake.
  options:
    a: { en: "DirectLakeOnly disables the fallback: the queries on the view-based table would fail instead of being answered in Direct Lake mode.", fr: "DirectLakeOnly désactive le basculement : les requêtes sur la table basée sur la vue échoueraient au lieu d'être traitées en mode Direct Lake." }
    c: { en: "Automatic updates control when the model reframes after changes in the Delta tables; they do not stop the fallback of a view-based table, and the setting is on by default.", fr: "Les mises à jour automatiques contrôlent quand le modèle refait le framing après des modifications des tables Delta ; elles n'empêchent pas le basculement d'une table basée sur une vue, et le paramètre est activé par défaut." }
    d: { en: "With 30 million rows, Enrollment is far below the guardrails of an F64 capacity; the fallback is caused by the view, not by the capacity size.", fr: "Avec 30 millions de lignes, Enrollment est loin des garde-fous d'une capacité F64 ; le basculement est dû à la vue, pas à la taille de la capacité." }
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
  - title: How Direct Lake works
