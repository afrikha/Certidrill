id: dp600-3a-sm-web-modeling-mix
objective: "3.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are editing a semantic model named **StockModel** by using Power BI web modeling in a Fabric workspace on an F64 capacity. StockModel uses Direct Lake on OneLake. You need to add the following tables:

    - **FactInventory**: a Delta table in Lakehouse1 with 600 million rows, updated every hour by a pipeline. Reports must show each load without a data copy refresh.
    - **ExchangeRate**: an Excel workbook stored in SharePoint Online, updated once a month. It isn't available in OneLake.

    Which storage mode should you use for each table? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous modifiez un modèle sémantique nommé **StockModel** avec la modélisation web Power BI dans un espace de travail Fabric sur une capacité F64. StockModel utilise Direct Lake sur OneLake. Vous devez ajouter les tables suivantes :

    - **FactInventory** : une table Delta de Lakehouse1 de 600 millions de lignes, mise à jour toutes les heures par un pipeline. Les rapports doivent refléter chaque chargement sans actualisation qui copie les données.
    - **ExchangeRate** : un classeur Excel stocké dans SharePoint Online, mis à jour une fois par mois. Il n'est pas disponible dans OneLake.

    Quel mode de stockage devez-vous utiliser pour chaque table ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      FactInventory: [[inv]]
      ExchangeRate: [[fx]]
    fr: |
      FactInventory : [[inv]]
      ExchangeRate : [[fx]]
  slots:
    - id: inv
      options:
        - { id: inv-import, text: Import }
        - { id: inv-dq, text: DirectQuery }
        - { id: inv-dl, text: Direct Lake }
        - { id: inv-dual, text: { en: "Dual", fr: "Double (Dual)" } }
    - id: fx
      options:
        - { id: fx-import, text: Import }
        - { id: fx-dq, text: DirectQuery }
        - { id: fx-dl, text: Direct Lake }
        - { id: fx-dual, text: { en: "Dual", fr: "Double (Dual)" } }
answer:
  values: { inv: inv-dl, fx: fx-import }
explanation:
  correct:
    en: |
      FactInventory is a Delta table in OneLake, so Direct Lake shows each load after a metadata-only reframing. ExchangeRate is an Excel workbook outside OneLake; a small table updated monthly is best imported. Direct Lake on OneLake tables can be combined with Import tables in web modeling.
    fr: |
      FactInventory est une table Delta de OneLake ; Direct Lake reflète donc chaque chargement après un recadrage qui ne porte que sur les métadonnées. ExchangeRate est un classeur Excel hors de OneLake ; une petite table mise à jour chaque mois est idéalement importée. Les tables Direct Lake sur OneLake peuvent être combinées avec des tables Import dans la modélisation web.
  options:
    inv-import: { en: "Importing 600 million rows every hour means long refreshes that copy the data.", fr: "Importer 600 millions de lignes toutes les heures implique de longues actualisations qui copient les données." }
    fx-dl: { en: "Direct Lake reads only Delta tables in OneLake; the workbook isn't in OneLake.", fr: "Direct Lake ne lit que des tables Delta de OneLake ; le classeur n'est pas dans OneLake." }
    fx-dual: { en: "Dual applies to tables that come from the same source as DirectQuery tables.", fr: "Le mode Double s'applique aux tables qui proviennent de la même source que des tables DirectQuery." }
    inv-dual: { en: "Dual keeps an imported copy, which needs a full refresh.", fr: "Le mode Double conserve une copie importée, qui exige une actualisation complète." }
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
  - title: Use composite models in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-composite-models
