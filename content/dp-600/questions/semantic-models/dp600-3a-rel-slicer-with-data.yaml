id: dp600-3a-rel-slicer-with-data
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a semantic model in which **Customer** and **Product** each have a one-to-many, single-direction relationship with **Sales**. The measure **Total Quantity** is defined as `SUM(Sales[Quantity])`.

    A report page has a Country slicer from Customer and a Product slicer. When a country is selected, the Product slicer must list only the products sold to customers in that country. You must not add bidirectional relationships to the model.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique dans lequel **Customer** et **Product** ont chacune une relation un-à-plusieurs à direction unique avec **Sales**. La mesure **Total Quantity** est définie par `SUM(Sales[Quantity])`.

    Une page de rapport comporte un segment Country issu de Customer et un segment Product. Quand un pays est sélectionné, le segment Product ne doit lister que les produits vendus aux clients de ce pays. Vous ne devez pas ajouter de relations bidirectionnelles au modèle.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a visual-level filter to the Product slicer that shows items when Total Quantity is not blank.", fr: "Ajouter au segment Product un filtre au niveau du visuel qui affiche les éléments quand Total Quantity n'est pas vide." } }
    - { id: b, text: { en: "Set the Product to Sales relationship to filter in both directions.", fr: "Régler la relation de Product vers Sales pour filtrer dans les deux directions." } }
    - { id: c, text: { en: "Enable Assume referential integrity on the Product to Sales relationship.", fr: "Activer Supposer l'intégrité référentielle sur la relation de Product vers Sales." } }
    - { id: d, text: { en: "Create a measure that uses CROSSFILTER to set the Product to Sales relationship to Both.", fr: "Créer une mesure qui utilise CROSSFILTER pour régler la relation de Product vers Sales sur Both." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Country filter reaches Sales, so Total Quantity is blank for products not sold in that country. Filtering the slicer on "is not blank" limits its items to products with data while the relationships stay single-direction, which avoids the performance cost of bidirectional filtering.
    fr: |
      Le filtre Country atteint Sales ; Total Quantity est donc vide pour les produits non vendus dans ce pays. Filtrer le segment sur « n'est pas vide » limite ses éléments aux produits qui ont des données, tandis que les relations restent à direction unique, ce qui évite le coût en performances du filtrage bidirectionnel.
  options:
    b: { en: "A bidirectional relationship would work, but the requirement forbids adding one.", fr: "Une relation bidirectionnelle fonctionnerait, mais l'exigence interdit d'en ajouter." }
    c: { en: "Assume referential integrity only applies to relationships between DirectQuery tables of the same source and changes joins, not slicer items.", fr: "Supposer l'intégrité référentielle ne s'applique qu'aux relations entre tables DirectQuery d'une même source et change les jointures, pas les éléments d'un segment." }
    d: { en: "CROSSFILTER changes the filter direction only while that measure is evaluated; on its own, it doesn't change the items that the Product slicer lists.", fr: "CROSSFILTER ne change la direction du filtre que pendant l'évaluation de cette mesure ; à lui seul, il ne change pas les éléments que liste le segment Product." }
references:
  - title: Bi-directional relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-bidirectional-filtering
