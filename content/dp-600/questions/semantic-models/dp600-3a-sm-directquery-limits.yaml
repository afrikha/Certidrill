id: dp600-3a-sm-directquery-limits
objective: "3.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You plan to build a Power BI semantic model in DirectQuery mode over an Azure SQL database named **OpsDB**, because the data changes too often for scheduled Import refreshes.

    Which two statements describe DirectQuery behaviors that you must plan for?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer un modèle sémantique Power BI en mode DirectQuery sur une base de données Azure SQL nommée **OpsDB**, car les données changent trop souvent pour des actualisations Import planifiées.

    Quelles sont les deux affirmations qui décrivent des comportements de DirectQuery dont vous devez tenir compte ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Power BI doesn't create automatic date hierarchies, so you need an explicit date table.", fr: "Power BI ne crée pas de hiérarchies de dates automatiques ; il vous faut donc une table de dates explicite." } }
    - { id: b, text: { en: "Power Query transformations must fold into a single native query sent to OpsDB.", fr: "Les transformations Power Query doivent se replier en une seule requête native envoyée à OpsDB." } }
    - { id: c, text: { en: "You can't create DAX measures in the semantic model.", fr: "Vous ne pouvez pas créer de mesures DAX dans le modèle sémantique." } }
    - { id: d, text: { en: "You can't define row-level security roles in the semantic model.", fr: "Vous ne pouvez pas définir de rôles de sécurité au niveau des lignes dans le modèle sémantique." } }
    - { id: e, text: { en: "Each refresh copies all the rows of the tables into the model.", fr: "Chaque actualisation copie toutes les lignes des tables dans le modèle." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      DirectQuery models have no automatic date/time hierarchy, so you add an explicit Date table. Power Query steps must fold into one native query; steps that can't fold aren't allowed.
    fr: |
      Les modèles DirectQuery n'ont pas de hiérarchie de date/heure automatique ; vous ajoutez donc une table Date explicite. Les étapes Power Query doivent se replier en une seule requête native ; les étapes qui ne peuvent pas se replier ne sont pas autorisées.
  options:
    c: { en: "DAX measures are supported; they are translated into queries to the source.", fr: "Les mesures DAX sont prises en charge ; elles sont traduites en requêtes vers la source." }
    d: { en: "You can define row-level security in a DirectQuery model; without SSO it is the way to restrict data, because stored credentials are used for all viewers.", fr: "Vous pouvez définir une sécurité au niveau des lignes dans un modèle DirectQuery ; sans authentification unique, c'est le moyen de restreindre les données, car les mêmes informations d'identification stockées servent pour tous les lecteurs." }
    e: { en: "DirectQuery doesn't import data; publishing creates only the schema and metadata.", fr: "DirectQuery n'importe pas de données ; la publication ne crée que le schéma et les métadonnées." }
references:
  - title: DirectQuery in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-directquery-about
