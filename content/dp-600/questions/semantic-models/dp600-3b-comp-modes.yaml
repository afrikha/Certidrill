id: dp600-3b-comp-modes
objective: "3.1.7"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are designing a semantic model for Tailspin Toys. The model contains the following tables:

    - **Sales**: two billion rows in an Azure SQL database named SQL1. Reports must show near real-time values.
    - **Date** and **Product**: dimension tables in SQL1, used in slicers and related to Sales and Budget.
    - **Budget**: a small table from an Excel workbook, related to Date and Product.

    Slicers must load quickly, and queries that combine Sales with Date or Product must use regular relationships. The solution must minimize memory use.

    Which storage mode should you use for each table? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez un modèle sémantique pour Tailspin Toys. Le modèle contient les tables suivantes :

    - **Sales** : deux milliards de lignes dans une base de données Azure SQL nommée SQL1. Les rapports doivent afficher des valeurs quasiment en temps réel.
    - **Date** et **Product** : tables de dimension de SQL1, utilisées dans des segments et reliées à Sales et à Budget.
    - **Budget** : une petite table provenant d'un classeur Excel, reliée à Date et à Product.

    Les segments doivent se charger rapidement, et les requêtes qui combinent Sales avec Date ou Product doivent utiliser des relations régulières. La solution doit réduire au minimum l'utilisation de la mémoire.

    Quel mode de stockage devez-vous utiliser pour chaque table ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      - Sales: [[sales]]
      - Date and Product: [[dims]]
      - Budget: [[budget]]
    fr: |
      - Sales : [[sales]]
      - Date et Product : [[dims]]
      - Budget : [[budget]]
  slots:
    - id: sales
      options:
        - { id: imp1, text: Import }
        - { id: dq1, text: DirectQuery }
        - { id: dual1, text: Dual }
    - id: dims
      options:
        - { id: imp2, text: Import }
        - { id: dq2, text: DirectQuery }
        - { id: dual2, text: Dual }
    - id: budget
      options:
        - { id: imp3, text: Import }
        - { id: dq3, text: DirectQuery }
        - { id: dual3, text: Dual }
answer:
  values: { sales: dq1, dims: dual2, budget: imp3 }
explanation:
  correct:
    en: |
      Sales is large and must be near real time, so it stays in DirectQuery and is not cached. Date and Product use Dual: slicers are answered from the cache, and queries that combine them with Sales are sent to SQL1 within the same source group, with regular relationships. Budget comes from Excel, which supports only Import; its relationships to the Dual tables are regular because a Dual one side can serve the Import group.
    fr: |
      Sales est volumineuse et doit être quasiment en temps réel : elle reste en DirectQuery et n'est pas mise en cache. Date et Product utilisent le mode Double (Dual) : les segments sont servis par le cache, et les requêtes qui les combinent avec Sales sont envoyées à SQL1 au sein du même groupe de sources, avec des relations régulières. Budget provient d'Excel, qui ne prend en charge que l'Import ; ses relations avec les tables en mode Double sont régulières, car un côté un en mode Double peut servir le groupe Import.
  options:
    imp1: { en: "Importing two billion rows would use a lot of memory and the values would be stale between refreshes.", fr: "Importer deux milliards de lignes consommerait beaucoup de mémoire et les valeurs seraient obsolètes entre deux actualisations." }
    dual1: { en: "Dual caches the table, which uses memory and is meant for dimensions, not for a large real-time fact table.", fr: "Le mode Double met la table en cache, ce qui consomme de la mémoire ; il est destiné aux dimensions, pas à une grande table de faits en temps réel." }
    imp2: { en: "Import dimensions would be in another source group than Sales, so their relationships to Sales would be limited.", fr: "Des dimensions en Import seraient dans un autre groupe de sources que Sales : leurs relations avec Sales seraient limitées." }
    dq2: { en: "DirectQuery dimensions would send a query to SQL1 each time a slicer loads.", fr: "Des dimensions en DirectQuery enverraient une requête à SQL1 à chaque chargement d'un segment." }
    dq3: { en: "An Excel workbook cannot be queried in DirectQuery mode.", fr: "Un classeur Excel ne peut pas être interrogé en mode DirectQuery." }
    dual3: { en: "Dual requires a source that supports DirectQuery, which an Excel workbook does not.", fr: "Le mode Double exige une source qui prend en charge DirectQuery, ce qui n'est pas le cas d'un classeur Excel." }
references:
  - title: Table storage mode in Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-storage-mode
  - title: Composite model guidance in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/guidance/composite-model-guidance
