id: dp600-3c-measure-rewrites
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are optimizing the measures of a semantic model named FinanceModel. FinanceModel contains the measures [Sales], [Profit] and [Total Cost], and a table named Sales whose OrderDate column never contains blanks.

    You need to apply rewrites that improve query performance without changing the results returned by the measures.

    Which two rewrites should you apply?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous optimisez les mesures d'un modèle sémantique nommé FinanceModel. FinanceModel contient les mesures [Sales], [Profit] et [Total Cost], ainsi qu'une table nommée Sales dont la colonne OrderDate ne contient jamais de valeurs vides.

    Vous devez appliquer des réécritures qui améliorent les performances des requêtes sans modifier les résultats renvoyés par les mesures.

    Quelles sont les deux réécritures à appliquer ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Replace `DIVIDE ( [Total Cost], 12 )` with `[Total Cost] / 12`."
        fr: "Remplacer `DIVIDE ( [Total Cost], 12 )` par `[Total Cost] / 12`."
    - id: b
      text:
        en: "Replace `DIVIDE ( [Profit], [Sales] )` with `DIVIDE ( [Profit], [Sales], 0 )`."
        fr: "Remplacer `DIVIDE ( [Profit], [Sales] )` par `DIVIDE ( [Profit], [Sales], 0 )`."
    - id: c
      text:
        en: "Replace `IF ( ISBLANK ( [Sales] ), BLANK (), [Sales] * 1.2 )` with `[Sales] * 1.2`."
        fr: "Remplacer `IF ( ISBLANK ( [Sales] ), BLANK (), [Sales] * 1.2 )` par `[Sales] * 1.2`."
    - id: d
      text:
        en: "Replace `CALCULATE ( [Sales], Store[Country] = \"France\" )` with `CALCULATE ( [Sales], FILTER ( Store, Store[Country] = \"France\" ) )`."
        fr: "Remplacer `CALCULATE ( [Sales], Store[Country] = \"France\" )` par `CALCULATE ( [Sales], FILTER ( Store, Store[Country] = \"France\" ) )`."
    - id: e
      text:
        en: "Replace `COUNTROWS ( Sales )` with `COUNT ( Sales[OrderDate] )`."
        fr: "Remplacer `COUNTROWS ( Sales )` par `COUNT ( Sales[OrderDate] )`."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "When the denominator is a non-zero constant, the division can't fail, so the divide operator avoids the unnecessary test that DIVIDE performs. A BLANK multiplied by a number returns BLANK, so the IF and ISBLANK test is redundant: removing it returns the same results and avoids evaluating [Sales] twice."
    fr: "Quand le dénominateur est une constante non nulle, la division ne peut pas échouer : l'opérateur de division évite le test inutile qu'effectue DIVIDE. Un BLANK multiplié par un nombre renvoie BLANK : le test IF et ISBLANK est redondant, et le supprimer renvoie les mêmes résultats tout en évitant d'évaluer [Sales] deux fois."
  options:
    b: { en: "The alternate result 0 replaces BLANK results with 0, which changes the results and makes visuals return every grouping.", fr: "Le résultat de remplacement 0 remplace les résultats BLANK par 0 : les résultats changent et les visuels renvoient tous les regroupements." }
    d: { en: "FILTER over the Store table is slower than a Boolean filter, and it also changes the semantics because it keeps existing filters on Country.", fr: "FILTER sur la table Store est plus lent qu'un filtre booléen, et il change aussi la sémantique, car il conserve les filtres existants sur Country." }
    e: { en: "COUNTROWS is the more efficient way to count the rows of a table; COUNT is the slower form.", fr: "COUNTROWS est la façon la plus efficace de compter les lignes d'une table ; COUNT est la forme la plus lente." }
references:
  - title: DIVIDE function vs. divide operator (/)
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-divide-function-operator
  - title: Avoid using FILTER as a filter argument in DAX
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-avoid-avoid-filter-as-filter-argument
