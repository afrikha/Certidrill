id: dp600-3a-rel-nonadditive
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank's semantic model relates Customer and Account through a bridging table named **AccountCustomer**, with the Account to AccountCustomer relationship filtering in both directions. The data is:

    | Account | Balance | Owners |
    | --- | --- | --- |
    | ACC-1 | 300 | Customer-A, Customer-B |
    | ACC-2 | 200 | Customer-B |

    A table visual shows the **Balance** measure by customer: Customer-A = 300, Customer-B = 500, and Total = 500.

    What explains the total?
  fr: |
    Le modèle sémantique de Woodgrove Bank relie Customer et Account par une table de pont nommée **AccountCustomer**, la relation d'Account vers AccountCustomer filtrant dans les deux directions. Les données sont les suivantes :

    | Compte | Solde | Titulaires |
    | --- | --- | --- |
    | ACC-1 | 300 | Customer-A, Customer-B |
    | ACC-2 | 200 | Customer-B |

    Un visuel table affiche la mesure **Balance** par client : Customer-A = 300, Customer-B = 500 et Total = 500.

    Qu'est-ce qui explique le total ?
body:
  options:
    - { id: a, text: { en: "The bridging table is missing a row for Customer-A and ACC-2.", fr: "Il manque dans la table de pont une ligne pour Customer-A et ACC-2." } }
    - { id: b, text: { en: "Customer balances are non-additive: each account is counted once in the total even though it appears under each owner.", fr: "Les soldes clients ne sont pas additifs : chaque compte n'est compté qu'une fois dans le total, même s'il apparaît sous chacun de ses titulaires." } }
    - { id: c, text: { en: "The Customer to AccountCustomer relationship must use many-to-many cardinality.", fr: "La relation de Customer vers AccountCustomer doit utiliser une cardinalité plusieurs-à-plusieurs." } }
    - { id: d, text: { en: "The total row ignores the bidirectional relationship and uses only active single-direction relationships.", fr: "La ligne de total ignore la relation bidirectionnelle et n'utilise que les relations actives à direction unique." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The model is correct. ACC-1 belongs to both customers, so it appears in both rows, but the total is evaluated for all customers together and counts each account once (300 + 200 = 500). Many-to-many customer balances are non-additive by nature.
    fr: |
      Le modèle est correct. ACC-1 appartient aux deux clients et apparaît donc sur les deux lignes, mais le total est évalué pour tous les clients ensemble et compte chaque compte une seule fois (300 + 200 = 500). Les soldes clients en plusieurs-à-plusieurs ne sont pas additifs par nature.
  options:
    a: { en: "Customer-A doesn't own ACC-2, so no row is missing.", fr: "Customer-A ne détient pas ACC-2 ; aucune ligne ne manque." }
    c: { en: "CustomerID is unique in Customer, so the one-to-many relationship to the bridge is right.", fr: "CustomerID est unique dans Customer ; la relation un-à-plusieurs vers le pont est donc correcte." }
    d: { en: "The total uses the same relationships as the other rows; only the filter context differs.", fr: "Le total utilise les mêmes relations que les autres lignes ; seul le contexte de filtre diffère." }
references:
  - title: Many-to-many relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-many-to-many
