id: dp600-3c-ir-setup-order
objective: "3.2.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You use Power BI Desktop to create an Import semantic model named OrdersModel. OrdersModel contains a table named FactOrders that is loaded from an Azure SQL database and has an OrderDate column of type Date/Time.

    You need to configure incremental refresh for FactOrders so that the Power BI service creates the partitions and loads the history.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous utilisez Power BI Desktop pour créer un modèle sémantique Import nommé OrdersModel. OrdersModel contient une table nommée FactOrders chargée depuis une base de données Azure SQL et dotée d'une colonne OrderDate de type Date/Heure.

    Vous devez configurer l'actualisation incrémentielle de FactOrders pour que le service Power BI crée les partitions et charge l'historique.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - id: params
      text:
        en: "In Power Query Editor, create the RangeStart and RangeEnd parameters of type Date/Time."
        fr: "Dans l'Éditeur Power Query, créer les paramètres RangeStart et RangeEnd de type Date/Heure."
    - id: filter
      text:
        en: "Filter the OrderDate column of the FactOrders query by using RangeStart and RangeEnd."
        fr: "Filtrer la colonne OrderDate de la requête FactOrders avec RangeStart et RangeEnd."
    - id: policy
      text:
        en: "Define the incremental refresh policy on the FactOrders table."
        fr: "Définir la stratégie d'actualisation incrémentielle sur la table FactOrders."
    - id: publish
      text:
        en: "Publish OrdersModel to the workspace."
        fr: "Publier OrdersModel dans l'espace de travail."
    - id: refresh
      text:
        en: "Run the first refresh of OrdersModel in the Power BI service."
        fr: "Lancer la première actualisation d'OrdersModel dans le service Power BI."
    - id: partitions
      text:
        en: "In Model view, create one partition per year for FactOrders."
        fr: "Dans la vue Modèle, créer une partition par année pour FactOrders."
    - id: detect
      text:
        en: "Turn on **Detect data changes** and select the OrderDate column."
        fr: "Activer **Detect data changes** et sélectionner la colonne OrderDate."
answer:
  sequence: [ params, filter, policy, publish, refresh ]
explanation:
  correct:
    en: |
      The policy can be defined only on a table whose query filters a Date/Time column with the RangeStart and RangeEnd parameters, so the parameters and the filter come first. Applying the policy in Power BI Desktop doesn't load data; after publishing, the first refresh in the service creates the partitions and loads the historical period.
    fr: |
      La stratégie ne peut être définie que sur une table dont la requête filtre une colonne Date/Heure avec les paramètres RangeStart et RangeEnd : les paramètres et le filtre viennent donc en premier. Appliquer la stratégie dans Power BI Desktop ne charge pas de données ; après la publication, la première actualisation dans le service crée les partitions et charge la période historique.
  options:
    partitions: { en: "The service creates and manages the partitions from the policy; Power BI Desktop doesn't expose them.", fr: "Le service crée et gère les partitions à partir de la stratégie ; Power BI Desktop ne les expose pas." }
    detect: { en: "Detect data changes is optional and must use an audit column, not the column used for partitioning.", fr: "Detect data changes est facultatif et doit utiliser une colonne d'audit, pas la colonne de partitionnement." }
references:
  - title: Configure incremental refresh and real-time data
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-configure
