id: dp600-cs4b-cost-yoy-performance
objective: "3.2.2"
type: multi
caseStudy: dp600-cs4b-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You need to rewrite Cost YoY %. The solution must meet the fourth requirement for semantic models.

    Which two changes should you make? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez réécrire Cost YoY %. La solution doit satisfaire la quatrième exigence relative aux modèles sémantiques.

    Quelles sont les deux modifications que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Replace the IFERROR function and the division operator with the DIVIDE function.", fr: "Remplacer la fonction IFERROR et l'opérateur de division par la fonction DIVIDE." } }
    - { id: b, text: { en: "Replace SAMEPERIODLASTYEAR ( DimDate[Date] ) with DATEADD ( DimDate[Date], -1, YEAR ).", fr: "Remplacer SAMEPERIODLASTYEAR ( DimDate[Date] ) par DATEADD ( DimDate[Date], -1, YEAR )." } }
    - { id: c, text: { en: "Replace SUM ( FactAdmission[TotalCost] ) in Total Cost with SUMX ( FactAdmission, FactAdmission[TotalCost] ).", fr: "Remplacer SUM ( FactAdmission[TotalCost] ) dans Total Cost par SUMX ( FactAdmission, FactAdmission[TotalCost] )." } }
    - { id: d, text: { en: "Store the prior-year cost in a variable and use the variable in the numerator and the denominator.", fr: "Stocker le coût de l'année précédente dans une variable et utiliser la variable au numérateur et au dénominateur." } }
    - { id: e, text: { en: "Wrap the result in IF ( ISBLANK ( ... ), 0, ... ) so that every cell returns a number.", fr: "Encapsuler le résultat dans IF ( ISBLANK ( ... ), 0, ... ) pour que chaque cellule renvoie un nombre." } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: "The measure evaluates the same prior-year CALCULATE twice; a variable is evaluated once and reused, which reduces the query time. IFERROR can significantly degrade performance because it increases the number of storage engine scans, whereas DIVIDE handles a zero or blank denominator itself and returns a blank by default."
    fr: "La mesure évalue deux fois le même CALCULATE de l'année précédente ; une variable est évaluée une seule fois puis réutilisée, ce qui réduit la durée de la requête. IFERROR peut fortement dégrader les performances, car il augmente le nombre d'analyses du moteur de stockage, alors que DIVIDE gère lui-même un dénominateur nul ou vide et renvoie une valeur vide par défaut."
  options:
    b: { en: "DATEADD with -1 YEAR returns the same set of dates as SAMEPERIODLASTYEAR; it does not remove the duplicate evaluation.", fr: "DATEADD avec -1 YEAR renvoie le même ensemble de dates que SAMEPERIODLASTYEAR ; cela ne supprime pas la double évaluation." }
    c: { en: "SUMX over a single column performs the same aggregation as SUM; the change removes neither the duplicate prior-year evaluation nor the cost of IFERROR.", fr: "SUMX sur une seule colonne effectue la même agrégation que SUM ; la modification ne supprime ni la double évaluation de l'année précédente ni le coût d'IFERROR." }
    e: { en: "Converting blanks to 0 breaks the requirement to return a blank and turns a sparse calculation into a dense one, so visuals retrieve every grouping and render more slowly.", fr: "Convertir les valeurs vides en 0 enfreint l'exigence de renvoyer une valeur vide et transforme un calcul creux en calcul dense : les visuels récupèrent tous les regroupements et s'affichent plus lentement." }
references:
  - title: Use variables to improve your DAX formulas
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-variables
  - title: Appropriate use of error functions
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-error-functions
