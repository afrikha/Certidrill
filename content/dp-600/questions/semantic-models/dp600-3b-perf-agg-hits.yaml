id: dp600-3b-perf-agg-hits
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model that contains a DirectQuery table named **Sales** and an Import aggregation table named **SalesAgg**. SalesAgg summarizes Sales by month and by product subcategory, with a Sum aggregation on SalesAmount and a Count table rows aggregation. Sales and SalesAgg are related to the **Date** and **Product** dimension tables, which use the Dual storage mode.

    Which table answers each query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique qui contient une table DirectQuery nommée **Sales** et une table d'agrégation Import nommée **SalesAgg**. SalesAgg résume Sales par mois et par sous-catégorie de produits, avec une agrégation Sum sur SalesAmount et une agrégation Count table rows. Sales et SalesAgg sont reliées aux tables de dimension **Date** et **Product**, qui utilisent le mode de stockage Double (Dual).

    Quelle table répond à chaque requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      - Sum of SalesAmount by Date[CalendarMonth]: [[q1]]
      - Sum of SalesAmount by Date[CalendarDay]: [[q2]]
      - Sum of SalesAmount by Product[ProductName]: [[q3]]
      - COUNTROWS(Sales) by Product[Subcategory]: [[q4]]
    fr: |
      - Somme de SalesAmount par Date[CalendarMonth] : [[q1]]
      - Somme de SalesAmount par Date[CalendarDay] : [[q2]]
      - Somme de SalesAmount par Product[ProductName] : [[q3]]
      - COUNTROWS(Sales) par Product[Subcategory] : [[q4]]
  slots:
    - id: q1
      options:
        - { id: agg1, text: SalesAgg }
        - { id: sales1, text: { en: "Sales (DirectQuery to the source)", fr: "Sales (DirectQuery vers la source)" } }
        - { id: date1, text: { en: "Date (Dual cache)", fr: "Date (cache Dual)" } }
    - id: q2
      options:
        - { id: agg2, text: SalesAgg }
        - { id: sales2, text: { en: "Sales (DirectQuery to the source)", fr: "Sales (DirectQuery vers la source)" } }
        - { id: date2, text: { en: "Date (Dual cache)", fr: "Date (cache Dual)" } }
    - id: q3
      options:
        - { id: agg3, text: SalesAgg }
        - { id: sales3, text: { en: "Sales (DirectQuery to the source)", fr: "Sales (DirectQuery vers la source)" } }
        - { id: prod3, text: { en: "Product (Dual cache)", fr: "Product (cache Dual)" } }
    - id: q4
      options:
        - { id: agg4, text: SalesAgg }
        - { id: sales4, text: { en: "Sales (DirectQuery to the source)", fr: "Sales (DirectQuery vers la source)" } }
        - { id: prod4, text: { en: "Product (Dual cache)", fr: "Product (cache Dual)" } }
answer:
  values: { q1: agg1, q2: sales2, q3: sales3, q4: agg4 }
explanation:
  correct:
    en: |
      An aggregation is hit only when the query asks for a granularity that the aggregation table covers. Month and subcategory are covered, so the sum by month and the row count by subcategory (thanks to the Count table rows aggregation) come from SalesAgg. Day and product name are below the grain of SalesAgg, so these queries fall back to the DirectQuery detail table.
    fr: |
      Une agrégation n'est utilisée que si la requête demande une granularité couverte par la table d'agrégation. Le mois et la sous-catégorie sont couverts : la somme par mois et le nombre de lignes par sous-catégorie (grâce à l'agrégation Count table rows) proviennent de SalesAgg. Le jour et le nom de produit sont sous le grain de SalesAgg : ces requêtes reviennent à la table de détails DirectQuery.
  options:
    date1: { en: "Dimension tables hold no sales amounts; the measure is answered by a fact or aggregation table.", fr: "Les tables de dimension ne contiennent aucun montant de ventes ; la mesure est servie par une table de faits ou d'agrégation." }
    agg2: { en: "SalesAgg has one row per month and subcategory, so it cannot give daily values.", fr: "SalesAgg a une ligne par mois et sous-catégorie : elle ne peut pas donner de valeurs quotidiennes." }
    agg3: { en: "Several products share a subcategory, so SalesAgg cannot split the amounts by product.", fr: "Plusieurs produits partagent une sous-catégorie : SalesAgg ne peut pas répartir les montants par produit." }
    sales4: { en: "The Count table rows aggregation lets SalesAgg answer COUNTROWS at the subcategory grain.", fr: "L'agrégation Count table rows permet à SalesAgg de répondre à COUNTROWS au grain de la sous-catégorie." }
references:
  - title: User-defined aggregations
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/aggregations-advanced
