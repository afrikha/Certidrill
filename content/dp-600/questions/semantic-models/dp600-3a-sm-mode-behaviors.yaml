id: dp600-3a-sm-mode-behaviors
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Power BI Desktop semantic model that contains Import, DirectQuery and Dual tables. The DirectQuery and Dual tables come from the same Azure SQL database.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique Power BI Desktop qui contient des tables Import, DirectQuery et Double (Dual). Les tables DirectQuery et Double proviennent de la même base de données Azure SQL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A Dual table returns cached data when the cache can answer the query, and otherwise sends a DirectQuery query to the source.
        fr: |
          Une table en mode Double renvoie les données du cache quand le cache peut répondre à la requête, et envoie sinon une requête DirectQuery à la source.
    - id: s2
      text:
        en: |
          In Table view, you can browse the rows of the DirectQuery tables.
        fr: |
          Dans la vue Table, vous pouvez parcourir les lignes des tables DirectQuery.
    - id: s3
      text:
        en: |
          A calculated column added to one of the Import tables can reference columns of other tables.
        fr: |
          Une colonne calculée ajoutée à l'une des tables Import peut référencer des colonnes d'autres tables.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Dual tables are answered from the cache when possible and revert to DirectQuery otherwise. Table view shows the cached data of Import and Dual tables, but only a message for DirectQuery tables. DirectQuery limits apply per table: a calculated column on an Import table can reference other tables, whereas one on a DirectQuery table can reference only its own table.
    fr: |
      Les tables en mode Double sont servies depuis le cache quand c'est possible, et repassent sinon en DirectQuery. La vue Table affiche les données en cache des tables Import et Double, mais seulement un message pour les tables DirectQuery. Les limites de DirectQuery s'appliquent table par table : une colonne calculée d'une table Import peut référencer d'autres tables, alors que celle d'une table DirectQuery ne peut référencer que sa propre table.
references:
  - title: Table storage mode in Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-storage-mode
