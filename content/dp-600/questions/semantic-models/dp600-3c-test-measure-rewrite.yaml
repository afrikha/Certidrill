id: dp600-3c-test-measure-rewrite
objective: "3.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You use Power BI Desktop to edit a report and its semantic model. A matrix visual on the Margins page is slow, and you have written a faster version of the Gross Margin measure that the visual uses.

    You need to test the new version against the query of the visual before you overwrite the measure in the model.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous utilisez Power BI Desktop pour modifier un rapport et son modèle sémantique. Un visuel de matrice de la page Margins est lent, et vous avez écrit une version plus rapide de la mesure Gross Margin qu'utilise le visuel.

    Vous devez tester la nouvelle version avec la requête du visuel avant de remplacer la mesure dans le modèle.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: record
      text:
        en: "On the Margins page, open **Performance analyzer**, select **Start recording** and then **Refresh visuals**."
        fr: "Sur la page Margins, ouvrir l'**Analyseur de performances**, sélectionner **Start recording** puis **Refresh visuals**."
    - id: run
      text:
        en: "For the matrix visual, select **Run in DAX query view**."
        fr: "Pour le visuel de matrice, sélectionner **Run in DAX query view**."
    - id: define
      text:
        en: "Add a `DEFINE MEASURE` block that contains the new Gross Margin expression, then run the query."
        fr: "Ajouter un bloc `DEFINE MEASURE` contenant la nouvelle expression de Gross Margin, puis exécuter la requête."
    - id: update
      text:
        en: "Select **Update model with changes**."
        fr: "Sélectionner **Update model with changes**."
    - id: calccol
      text:
        en: "Create a calculated column that contains the new Gross Margin expression."
        fr: "Créer une colonne calculée contenant la nouvelle expression de Gross Margin."
    - id: diag
      text:
        en: "In Power Query Editor, select **Start diagnostics** and refresh the preview."
        fr: "Dans l'Éditeur Power Query, sélectionner **Start diagnostics** et actualiser l'aperçu."
answer:
  sequence: [ record, run, define, update ]
explanation:
  correct:
    en: |
      Performance analyzer captures the DAX query that each visual sends, and Run in DAX query view opens that query in DAX query view. A measure defined with DEFINE MEASURE is scoped to the query, so you can run the visual's query with the new expression without changing the model. When the result is correct, Update model with changes writes the measure back to the model.
    fr: |
      L'Analyseur de performances capture la requête DAX qu'envoie chaque visuel, et Run in DAX query view ouvre cette requête dans la vue de requête DAX. Une mesure définie avec DEFINE MEASURE est limitée à la requête : vous pouvez exécuter la requête du visuel avec la nouvelle expression sans modifier le modèle. Quand le résultat est correct, Update model with changes réécrit la mesure dans le modèle.
  options:
    calccol: { en: "A calculated column is stored in the model and evaluated row by row at refresh; it doesn't test the measure in the visual's query.", fr: "Une colonne calculée est stockée dans le modèle et évaluée ligne par ligne à l'actualisation ; elle ne teste pas la mesure dans la requête du visuel." }
    diag: { en: "Query diagnostics analyze Power Query steps, not DAX measures.", fr: "Les diagnostics de requête analysent les étapes Power Query, pas les mesures DAX." }
references:
  - title: DAX query view
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/dax-query-view
  - title: Use Performance Analyzer to examine report performance
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-performance-analyzer
