id: dp600-3b-lsm-max-size
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS1** that is assigned to an F64 capacity. WS1 contains an Import semantic model named **Model1**.

    You turn on **Large semantic model storage format** for Model1. Model1 will grow through scheduled refreshes in the service.

    Which limit determines the maximum size of Model1?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS1** qui est attribué à une capacité F64. WS1 contient un modèle sémantique Import nommé **Model1**.

    Vous activez **Large semantic model storage format** (format de stockage de modèle sémantique volumineux) pour Model1. Model1 va grossir au fil des actualisations planifiées dans le service.

    Quelle limite détermine la taille maximale de Model1 ?
body:
  options:
    - { id: a, text: { en: "The 10 GB limit that applies to uploads from Power BI Desktop", fr: "La limite de 10 Go qui s'applique aux chargements depuis Power BI Desktop" } }
    - { id: b, text: { en: "The 1 GB limit of semantic models in Pro workspaces", fr: "La limite de 1 Go des modèles sémantiques des espaces de travail Pro" } }
    - { id: c, text: { en: "The memory of the F64 SKU, or a lower maximum set by the capacity admin", fr: "La mémoire de la référence SKU F64, ou un maximum inférieur fixé par l'administrateur de capacité" } }
    - { id: d, text: { en: "No limit, because data that does not fit in memory stays in OneLake", fr: "Aucune limite, car les données qui ne tiennent pas en mémoire restent dans OneLake" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With the large format, the size of a model is no longer capped by the default limit: it is limited by the memory of the capacity SKU (25 GB for F64) or by a lower maximum that the capacity administrator sets. Part of that memory must stay free for refreshes and queries, so the practical maximum can be lower.
    fr: |
      Avec le format volumineux, la taille d'un modèle n'est plus plafonnée par la limite par défaut : elle est limitée par la mémoire de la référence SKU de la capacité (25 Go pour F64) ou par un maximum inférieur fixé par l'administrateur de capacité. Une partie de cette mémoire doit rester libre pour les actualisations et les requêtes ; le maximum pratique peut donc être plus faible.
  options:
    a:
      en: |
        The 10 GB limit applies to publishing from Power BI Desktop; a large model can grow beyond it through refreshes in the service.
      fr: |
        La limite de 10 Go s'applique à la publication depuis Power BI Desktop ; un modèle volumineux peut la dépasser grâce aux actualisations dans le service.
    b:
      en: |
        WS1 is on an F64 capacity, not a Pro workspace.
      fr: |
        WS1 est sur une capacité F64, pas dans un espace de travail Pro.
    d:
      en: |
        An Import model is loaded in memory; it cannot exceed the memory of the SKU. Reading Delta tables from OneLake is Direct Lake, not Import.
      fr: |
        Un modèle Import est chargé en mémoire ; il ne peut pas dépasser la mémoire de la référence SKU. La lecture de tables Delta dans OneLake relève de Direct Lake, pas d'Import.
references:
