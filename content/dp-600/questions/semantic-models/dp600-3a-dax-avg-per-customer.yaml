id: dp600-3a-dax-avg-per-customer
objective: "3.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model in which **Customer** has a one-to-many relationship with **Sales**. The measure **Total Sales** is defined as `SUM(Sales[SalesAmount])`. A table visual shows one row per store region.

    You need a measure that returns, for each region, the average of the total sales of each customer who appears in the current filter context.

    How should you complete the DAX expression? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique dans lequel **Customer** a une relation un-à-plusieurs avec **Sales**. La mesure **Total Sales** est définie par `SUM(Sales[SalesAmount])`. Un visuel table affiche une ligne par région de magasins.

    Vous avez besoin d'une mesure qui renvoie, pour chaque région, la moyenne des ventes totales de chaque client présent dans le contexte de filtre actuel.

    Comment devez-vous compléter l'expression DAX ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Avg Sales per Customer =
    [[it]] (
        [[tbl]],
        [Total Sales]
    )
  slots:
    - id: it
      options:
        - { id: averagex, text: AVERAGEX }
        - { id: sumx, text: SUMX }
        - { id: countx, text: COUNTX }
        - { id: maxx, text: MAXX }
    - id: tbl
      options:
        - { id: values, text: "VALUES ( Customer[CustomerKey] )" }
        - { id: allcust, text: "ALL ( Customer )" }
        - { id: sales, text: Sales }
answer:
  values: { it: averagex, tbl: values }
explanation:
  correct:
    en: |
      AVERAGEX evaluates an expression for each row of a table and returns the mean. VALUES(Customer[CustomerKey]) returns the customers visible in the current context, and calling the Total Sales measure for each row triggers a context transition, so each iteration returns the total of one customer.
    fr: |
      AVERAGEX évalue une expression pour chaque ligne d'une table et renvoie la moyenne. VALUES(Customer[CustomerKey]) renvoie les clients visibles dans le contexte actuel, et l'appel de la mesure Total Sales pour chaque ligne déclenche une transition de contexte : chaque itération renvoie le total d'un client.
  options:
    sumx: { en: "SUMX adds the customer totals instead of averaging them.", fr: "SUMX additionne les totaux des clients au lieu d'en faire la moyenne." }
    countx: { en: "COUNTX counts the rows for which the expression isn't blank.", fr: "COUNTX compte les lignes pour lesquelles l'expression n'est pas vide." }
    maxx: { en: "MAXX returns the largest customer total.", fr: "MAXX renvoie le plus grand total client." }
    allcust: { en: "ALL(Customer) ignores the filters on Customer and iterates customers who aren't in the current context.", fr: "ALL(Customer) ignore les filtres sur Customer et parcourt des clients qui ne sont pas dans le contexte actuel." }
    sales: { en: "Iterating Sales averages per sales row, not per customer.", fr: "Parcourir Sales calcule une moyenne par ligne de vente, pas par client." }
references:
  - title: AVERAGEX function (DAX)
    url: https://learn.microsoft.com/en-us/dax/averagex-function-dax
