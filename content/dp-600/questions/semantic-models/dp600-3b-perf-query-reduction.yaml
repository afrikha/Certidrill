id: dp600-3b-perf-query-reduction
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are developing a Power BI report in Power BI Desktop. The report uses a DirectQuery semantic model and contains a page with several multi-select slicers.

    Each slicer selection sends new queries to the data source. Users must be able to make several selections before the visuals update, and cross-highlighting must be off by default. The solution must minimize development effort.

    What should you do?
  fr: |
    Vous développez un rapport Power BI dans Power BI Desktop. Le rapport utilise un modèle sémantique DirectQuery et contient une page avec plusieurs segments à sélection multiple.

    Chaque sélection dans un segment envoie de nouvelles requêtes à la source de données. Les utilisateurs doivent pouvoir faire plusieurs sélections avant la mise à jour des visuels, et la mise en surbrillance croisée doit être désactivée par défaut. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "On the Optimize ribbon, select Optimization presets > Interactivity.", fr: "Dans le ruban Optimiser, sélectionner Présélections d'optimisation (Optimization presets) > Interactivité (Interactivity)." } }
    - { id: b, text: { en: "On the Optimize ribbon, select Pause visuals.", fr: "Dans le ruban Optimiser, sélectionner Suspendre les visuels (Pause visuals)." } }
    - { id: c, text: { en: "On the Optimize ribbon, select Optimization presets > Query reduction.", fr: "Dans le ruban Optimiser, sélectionner Présélections d'optimisation (Optimization presets) > Réduction des requêtes (Query reduction)." } }
    - { id: d, text: { en: "In the page settings, turn on automatic page refresh.", fr: "Dans les paramètres de la page, activer l'actualisation automatique de la page." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Query reduction preset turns off cross-highlighting and cross-filtering by default and adds Apply buttons to slicers and to the filter pane, so queries are sent only when users select Apply. It is the preset recommended for DirectQuery reports.
    fr: |
      La présélection Réduction des requêtes désactive par défaut la mise en surbrillance croisée et le filtrage croisé, et ajoute des boutons Appliquer aux segments et au volet Filtres : les requêtes ne partent que lorsque les utilisateurs sélectionnent Appliquer. C'est la présélection recommandée pour les rapports DirectQuery.
  options:
    a:
      en: |
        Interactivity is the default preset: it keeps cross-highlighting and applies slicer changes immediately.
      fr: |
        Interactivité est la présélection par défaut : elle conserve la mise en surbrillance croisée et applique immédiatement les changements de segment.
    b:
      en: |
        Pause visuals stops queries while the author edits the report; it does not change how the published report behaves for users.
      fr: |
        Suspendre les visuels arrête les requêtes pendant que l'auteur modifie le rapport ; cela ne change pas le comportement du rapport publié pour les utilisateurs.
    d:
      en: |
        Automatic page refresh sends more queries to the source, not fewer.
      fr: |
        L'actualisation automatique de la page envoie davantage de requêtes à la source, pas moins.
references:
  - title: Optimize ribbon in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-optimize-ribbon
  - title: DirectQuery optimization scenarios with the Optimize ribbon in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-optimize-ribbon-scenarios
