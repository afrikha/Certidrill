id: dp600-3a-ss-surrogate-steps
objective: "3.1.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You are building an Import semantic model in Power BI Desktop from CSV extracts. The **Customer** query contains the Country, CustomerCode and CustomerName columns. CustomerCode is unique only within a country, so Customer has no single unique column. The **Sales** query contains Country, CustomerCode, OrderDate and Amount.

    You need a one-to-many relationship between Customer and Sales that uses a single whole number column. Every row of both queries must be kept.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous créez dans Power BI Desktop un modèle sémantique Import à partir d'extraits CSV. La requête **Customer** contient les colonnes Country, CustomerCode et CustomerName. CustomerCode n'est unique qu'au sein d'un pays ; Customer n'a donc aucune colonne unique à elle seule. La requête **Sales** contient Country, CustomerCode, OrderDate et Amount.

    Vous avez besoin d'une relation un-à-plusieurs entre Customer et Sales qui utilise une seule colonne de nombres entiers. Toutes les lignes des deux requêtes doivent être conservées.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: index, text: { en: "In the Customer query, add an index column named CustomerKey.", fr: "Dans la requête Customer, ajouter une colonne d'index nommée CustomerKey." } }
    - { id: merge, text: { en: "Merge the Sales query with the Customer query on Country and CustomerCode.", fr: "Fusionner la requête Sales avec la requête Customer sur Country et CustomerCode." } }
    - { id: expand, text: { en: "Expand only CustomerKey into Sales, and then remove Country and CustomerCode from Sales.", fr: "Développer uniquement CustomerKey dans Sales, puis supprimer Country et CustomerCode de Sales." } }
    - { id: rel, text: { en: "Create a one-to-many relationship from Customer[CustomerKey] to Sales[CustomerKey].", fr: "Créer une relation un-à-plusieurs de Customer[CustomerKey] vers Sales[CustomerKey]." } }
    - { id: dedup, text: { en: "Remove duplicates from Customer[CustomerCode].", fr: "Supprimer les doublons de Customer[CustomerCode]." } }
    - { id: mm, text: { en: "Create a many-to-many relationship between Customer[CustomerCode] and Sales[CustomerCode].", fr: "Créer une relation plusieurs-à-plusieurs entre Customer[CustomerCode] et Sales[CustomerCode]." } }
answer:
  sequence: [ index, merge, expand, rel ]
explanation:
  correct:
    en: |
      When a dimension has no unique column, add a surrogate key with an index column in Power Query. Then merge the fact query with the dimension query on the natural key columns so that the index value also lands on the many side. Once both tables carry CustomerKey, you create the one-to-many relationship.
    fr: |
      Quand une dimension n'a pas de colonne unique, ajoutez une clé de substitution avec une colonne d'index dans Power Query. Fusionnez ensuite la requête de faits avec la requête de dimension sur les colonnes de clé naturelle, afin que la valeur d'index arrive aussi du côté « plusieurs ». Une fois que les deux tables portent CustomerKey, vous créez la relation un-à-plusieurs.
  options:
    dedup: { en: "CustomerCode repeats across countries; removing duplicates would lose customers.", fr: "CustomerCode se répète d'un pays à l'autre ; supprimer les doublons ferait perdre des clients." }
    mm: { en: "A many-to-many relationship on CustomerCode is limited and mixes customers of different countries.", fr: "Une relation plusieurs-à-plusieurs sur CustomerCode est limitée et mélange les clients de pays différents." }
references:
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
