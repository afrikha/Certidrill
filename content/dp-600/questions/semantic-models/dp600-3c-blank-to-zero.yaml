id: dp600-3c-blank-to-zero
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a semantic model that contains 18,000 customers. A report page contains a table visual that groups a measure named Sales (No Blank) by customer. The measure is defined as `IF ( ISBLANK ( [Sales] ), 0, [Sales] )`.

    The visual renders slowly and lists every customer, including customers who have no sales in the selected period. You need the visual to render faster and to show only customers who have sales.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique qui contient 18 000 clients. Une page de rapport contient un visuel de table qui regroupe une mesure nommée Sales (No Blank) par client. La mesure est définie ainsi : `IF ( ISBLANK ( [Sales] ), 0, [Sales] )`.

    Le visuel s'affiche lentement et liste tous les clients, y compris ceux qui n'ont aucune vente sur la période sélectionnée. Vous devez accélérer l'affichage du visuel et n'y montrer que les clients qui ont des ventes.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Replace the measure expression with `COALESCE ( [Sales], 0 )`."
        fr: "Remplacer l'expression de la mesure par `COALESCE ( [Sales], 0 )`."
    - id: b
      text:
        en: "Enable the **Show items with no data** option on the Customer field of the visual."
        fr: "Activer l'option **Show items with no data** sur le champ Customer du visuel."
    - id: c
      text:
        en: "Change the measure so that it returns BLANK when [Sales] is BLANK."
        fr: "Modifier la mesure pour qu'elle renvoie BLANK quand [Sales] vaut BLANK."
    - id: d
      text:
        en: "Replace the measure expression with `[Sales] + 0`."
        fr: "Remplacer l'expression de la mesure par `[Sales] + 0`."
answer:
  optionId: c
explanation:
  correct:
    en: "Converting BLANK to 0 turns a sparse measure into a dense one, so the visual retrieves and renders a row for every customer. When the measure returns BLANK, visuals eliminate the groupings whose summarizations are BLANK by default, which reduces the query result and speeds up rendering."
    fr: "Convertir BLANK en 0 transforme une mesure creuse en mesure dense : le visuel récupère et affiche une ligne pour chaque client. Quand la mesure renvoie BLANK, les visuels éliminent par défaut les regroupements dont la synthèse vaut BLANK, ce qui réduit le résultat de la requête et accélère l'affichage."
  options:
    a: { en: "COALESCE still replaces BLANK with 0, so every customer is still returned.", fr: "COALESCE remplace toujours BLANK par 0 : tous les clients sont toujours renvoyés." }
    b: { en: "Show items with no data adds groupings without values; it makes the visual larger, not smaller.", fr: "Show items with no data ajoute des regroupements sans valeur ; le visuel devient plus grand, pas plus petit." }
    d: { en: "In DAX, BLANK + 0 returns 0, so the measure still returns a value for every customer.", fr: "En DAX, BLANK + 0 renvoie 0 : la mesure renvoie toujours une valeur pour chaque client." }
references:
  - title: Avoid converting BLANKs to values in DAX
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-avoid-converting-blank
