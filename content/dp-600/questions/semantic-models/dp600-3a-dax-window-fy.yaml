id: dp600-3a-dax-window-fy
objective: "3.1.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a semantic model with a **Date** table that contains the **Fiscal Year** and **Fiscal Month Number** columns. A matrix shows **Total Sales** by Fiscal Year and Fiscal Month Number.

    You need a measure that returns a running total of sales from the first month of each fiscal year up to the current month. The running total must restart at the start of every fiscal year.

    How should you complete the DAX expression? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique avec une table **Date** qui contient les colonnes **Fiscal Year** et **Fiscal Month Number**. Une matrice affiche **Total Sales** par Fiscal Year et Fiscal Month Number.

    Vous avez besoin d'une mesure qui renvoie un cumul des ventes depuis le premier mois de chaque exercice jusqu'au mois actuel. Le cumul doit repartir de zéro au début de chaque exercice.

    Comment devez-vous compléter l'expression DAX ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Running Sales FY =
    SUMX (
        WINDOW (
            [[from]], [[ftype]], 0, REL,
            ALLSELECTED ( 'Date'[Fiscal Year], 'Date'[Fiscal Month Number] ),
            ORDERBY ( 'Date'[Fiscal Month Number], ASC ),
            PARTITIONBY ( [[part]] )
        ),
        [Total Sales]
    )
  slots:
    - id: from
      options:
        - { id: from-1, text: "1" }
        - { id: from-m1, text: "-1" }
        - { id: from-m2, text: "-2" }
    - id: ftype
      options:
        - { id: abs, text: ABS }
        - { id: rel, text: REL }
    - id: part
      options:
        - { id: part-fy, text: "'Date'[Fiscal Year]" }
        - { id: part-fm, text: "'Date'[Fiscal Month Number]" }
        - { id: part-date, text: "'Date'[Date]" }
answer:
  values: { from: from-1, ftype: abs, part: part-fy }
explanation:
  correct:
    en: |
      With ABS, a from value of 1 is the first row of the partition, and 0 with REL is the current row, so the window runs from the first month to the current month. PARTITIONBY on Fiscal Year makes the window, and therefore the running total, restart for each fiscal year. SUMX then adds Total Sales over the rows of the window.
    fr: |
      Avec ABS, une valeur from de 1 désigne la première ligne de la partition, et 0 avec REL la ligne actuelle ; la fenêtre va donc du premier mois au mois actuel. PARTITIONBY sur Fiscal Year fait repartir la fenêtre, et donc le cumul, à chaque exercice. SUMX additionne ensuite Total Sales sur les lignes de la fenêtre.
  options:
    from-m1: { en: "With ABS, -1 is the last row of the partition; with REL, it's the previous row.", fr: "Avec ABS, -1 est la dernière ligne de la partition ; avec REL, c'est la ligne précédente." }
    from-m2: { en: "With REL, -2 builds a three-month moving window, not a year-to-date total.", fr: "Avec REL, -2 construit une fenêtre glissante de trois mois, pas un cumul depuis le début de l'exercice." }
    rel: { en: "With REL, the from value is counted from the current row, not from the start of the partition.", fr: "Avec REL, la valeur from est comptée à partir de la ligne actuelle, pas du début de la partition." }
    part-fm: { en: "Partitioning by month makes each month its own partition, so nothing accumulates.", fr: "Partitionner par mois fait de chaque mois sa propre partition : rien ne se cumule." }
    part-date: { en: "The partitionBy columns must come from the relation, which contains only Fiscal Year and Fiscal Month Number.", fr: "Les colonnes de partitionBy doivent provenir de la relation, qui ne contient que Fiscal Year et Fiscal Month Number." }
references:
  - title: WINDOW function (DAX)
    url: https://learn.microsoft.com/en-us/dax/window-function-dax
