id: dp600-3a-rel-bridge-direction
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model with the following relationships, all one-to-many with a single cross-filter direction:

    - Customer[CustomerID] to AccountCustomer[CustomerID]
    - Account[AccountID] to AccountCustomer[AccountID]
    - Account[AccountID] to Transaction[AccountID]

    AccountCustomer is a hidden bridging table. When users filter a report by Customer, the transaction amounts don't change.

    You need filters on Customer to filter Transaction. The solution must add as few bidirectional relationships as possible.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique avec les relations suivantes, toutes un-à-plusieurs avec une direction de filtrage croisé unique :

    - Customer[CustomerID] vers AccountCustomer[CustomerID]
    - Account[AccountID] vers AccountCustomer[AccountID]
    - Account[AccountID] vers Transaction[AccountID]

    AccountCustomer est une table de pont masquée. Quand les utilisateurs filtrent un rapport par Customer, les montants des transactions ne changent pas.

    Les filtres sur Customer doivent filtrer Transaction. La solution doit ajouter le moins possible de relations bidirectionnelles.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the Customer to AccountCustomer relationship to filter in both directions.", fr: "Régler la relation de Customer vers AccountCustomer pour filtrer dans les deux directions." } }
    - { id: b, text: { en: "Set the Account to AccountCustomer relationship to filter in both directions.", fr: "Régler la relation d'Account vers AccountCustomer pour filtrer dans les deux directions." } }
    - { id: c, text: { en: "Set the Account to Transaction relationship to filter in both directions.", fr: "Régler la relation d'Account vers Transaction pour filtrer dans les deux directions." } }
    - { id: d, text: { en: "Change the Customer to AccountCustomer relationship to many-to-many cardinality.", fr: "Changer la cardinalité de la relation de Customer vers AccountCustomer en plusieurs-à-plusieurs." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Customer filter already reaches AccountCustomer, which is on the many side. To continue, the filter must flow from the bridge up to Account, against the default direction, so the Account to AccountCustomer relationship must filter in both directions. Account then filters Transaction through its existing single-direction relationship.
    fr: |
      Un filtre sur Customer atteint déjà AccountCustomer, qui est du côté « plusieurs ». Pour aller plus loin, le filtre doit remonter du pont vers Account, à contre-sens de la direction par défaut ; la relation d'Account vers AccountCustomer doit donc filtrer dans les deux directions. Account filtre ensuite Transaction par sa relation existante à direction unique.
  options:
    a: { en: "The filter already flows from Customer to the bridge; this setting only lets the bridge filter Customer.", fr: "Le filtre va déjà de Customer vers le pont ; ce réglage permet seulement au pont de filtrer Customer." }
    c: { en: "This lets Transaction filter Account; it doesn't carry the Customer filter from the bridge to Account.", fr: "Ce réglage permet à Transaction de filtrer Account ; il ne transmet pas le filtre de Customer du pont vers Account." }
    d: { en: "CustomerID is unique in Customer; the cardinality isn't the problem, the filter direction from the bridge to Account is.", fr: "CustomerID est unique dans Customer ; le problème n'est pas la cardinalité, mais la direction du filtre du pont vers Account." }
references:
  - title: Many-to-many relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-many-to-many
