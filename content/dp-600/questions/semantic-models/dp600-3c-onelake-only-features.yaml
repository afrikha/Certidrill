id: dp600-3c-onelake-only-features
objective: "3.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Your team must choose between Direct Lake on OneLake and Direct Lake on SQL analytics endpoint for a new semantic model. You are listing the differences between the two options.

    Which two capabilities are available with Direct Lake on OneLake but not with Direct Lake on SQL analytics endpoint?

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe doit choisir entre Direct Lake sur OneLake et Direct Lake sur le point de terminaison d'analytique SQL pour un nouveau modèle sémantique. Vous dressez la liste des différences entre les deux options.

    Quelles sont les deux fonctionnalités disponibles avec Direct Lake sur OneLake, mais pas avec Direct Lake sur le point de terminaison d'analytique SQL ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Row-level security roles defined in the semantic model"
        fr: "Rôles de sécurité au niveau des lignes définis dans le modèle sémantique"
    - id: b
      text:
        en: "Tables in Import storage mode in the same model as the Direct Lake tables"
        fr: "Tables en mode de stockage Import dans le même modèle que les tables Direct Lake"
    - id: c
      text:
        en: "Automatic fallback to DirectQuery when a table can't be loaded"
        fr: "Basculement automatique vers DirectQuery quand une table ne peut pas être chargée"
    - id: d
      text:
        en: "A KQL database with OneLake availability turned on as a source"
        fr: "Une base de données KQL avec la disponibilité OneLake activée comme source"
    - id: e
      text:
        en: "User-defined aggregation tables"
        fr: "Tables d'agrégation définies par l'utilisateur"
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Direct Lake on OneLake supports composite models, so Import tables (and DirectQuery tables added with XMLA tools) can sit next to the Direct Lake tables. It can also use any Fabric item whose OneLake storage resolves to Delta tables, including a KQL database with OneLake availability turned on, which Direct Lake on SQL doesn't support."
    fr: "Direct Lake sur OneLake prend en charge les modèles composites : des tables Import (et des tables DirectQuery ajoutées avec des outils XMLA) peuvent côtoyer les tables Direct Lake. Il peut aussi utiliser tout élément Fabric dont le stockage OneLake se résout en tables Delta, y compris une base de données KQL avec la disponibilité OneLake activée, ce que Direct Lake sur SQL ne prend pas en charge."
  options:
    a: { en: "Semantic model row-level security is supported by both options.", fr: "La sécurité au niveau des lignes du modèle sémantique est prise en charge par les deux options." }
    c: { en: "Only Direct Lake on SQL falls back to DirectQuery; Direct Lake on OneLake returns an error.", fr: "Seul Direct Lake sur SQL bascule en DirectQuery ; Direct Lake sur OneLake renvoie une erreur." }
    e: { en: "Neither option supports user-defined aggregations.", fr: "Aucune des deux options ne prend en charge les agrégations définies par l'utilisateur." }
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
