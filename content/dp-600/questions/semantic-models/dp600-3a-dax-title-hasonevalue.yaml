id: dp600-3a-dax-title-hasonevalue
objective: "3.1.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    A report page contains a slicer on Store[Region] and card visuals. You need two measures:

    - **Chart Title** returns "Sales for" followed by the region when exactly one region is selected, and "Sales for all selected regions" otherwise.
    - **Region Label** returns the region when exactly one region is selected, and "Several regions" otherwise.

    How should you complete the DAX expressions? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une page de rapport contient un segment sur Store[Region] et des visuels carte. Vous avez besoin de deux mesures :

    - **Chart Title** renvoie « Sales for » suivi de la région quand une seule région est sélectionnée, et « Sales for all selected regions » sinon.
    - **Region Label** renvoie la région quand une seule région est sélectionnée, et « Several regions » sinon.

    Comment devez-vous compléter les expressions DAX ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Chart Title =
    IF (
        [[test]] ( Store[Region] ),
        "Sales for " & VALUES ( Store[Region] ),
        "Sales for all selected regions"
    )

    Region Label =
    [[fn]] ( Store[Region], "Several regions" )
  slots:
    - id: test
      options:
        - { id: hasone, text: HASONEVALUE }
        - { id: isfiltered, text: ISFILTERED }
        - { id: isblank, text: ISBLANK }
        - { id: isinscope, text: ISINSCOPE }
    - id: fn
      options:
        - { id: selected, text: SELECTEDVALUE }
        - { id: values, text: VALUES }
        - { id: firstnb, text: FIRSTNONBLANK }
answer:
  values: { test: hasone, fn: selected }
explanation:
  correct:
    en: |
      HASONEVALUE returns TRUE when the context of the column is filtered down to one distinct value, which is when VALUES can safely be concatenated as a scalar. SELECTEDVALUE returns the single value of the column, or the alternate result when there are zero or several values; it's equivalent to IF(HASONEVALUE(...), VALUES(...), alternate).
    fr: |
      HASONEVALUE renvoie TRUE quand le contexte de la colonne est filtré sur une seule valeur distincte, c'est-à-dire quand VALUES peut être concaténé sans risque comme valeur scalaire. SELECTEDVALUE renvoie la valeur unique de la colonne, ou le résultat de remplacement quand il y a zéro ou plusieurs valeurs ; il équivaut à IF(HASONEVALUE(...), VALUES(...), remplacement).
  options:
    isfiltered: { en: "ISFILTERED is also TRUE when two regions are selected; VALUES then returns several values and the measure fails.", fr: "ISFILTERED est aussi TRUE quand deux régions sont sélectionnées ; VALUES renvoie alors plusieurs valeurs et la mesure échoue." }
    isblank: { en: "ISBLANK tests a value, not the number of selected regions.", fr: "ISBLANK teste une valeur, pas le nombre de régions sélectionnées." }
    isinscope: { en: "ISINSCOPE tests the grouping level of a visual; Region isn't a grouping level in a card.", fr: "ISINSCOPE teste le niveau de regroupement d'un visuel ; Region n'est pas un niveau de regroupement dans une carte." }
    values: { en: "VALUES takes only a column or a table, and it returns a table rather than an alternate text.", fr: "VALUES ne prend qu'une colonne ou une table, et renvoie une table plutôt qu'un texte de remplacement." }
    firstnb: { en: "FIRSTNONBLANK returns the first region for which the expression isn't blank, so it never returns the alternate text.", fr: "FIRSTNONBLANK renvoie la première région pour laquelle l'expression n'est pas vide ; il ne renvoie donc jamais le texte de remplacement." }
references:
  - title: HASONEVALUE function (DAX)
    url: https://learn.microsoft.com/en-us/dax/hasonevalue-function-dax
  - title: SELECTEDVALUE function
    url: https://learn.microsoft.com/en-us/dax/selectedvalue-function
