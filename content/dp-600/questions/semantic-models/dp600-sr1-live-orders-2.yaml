id: dp600-sr1-live-orders-2
objective: "3.1.1"
type: series_yesno
series: dp600-sr1-live-orders
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You set all four tables to Import and refresh the model every hour.
  fr: Vous passez les quatre tables en mode Import et actualisez le modèle toutes les heures.
body:
  solution:
    en: |
      In Model view, you set the storage mode of all four tables to **Import**. After publication, you schedule a refresh of the model every hour.
    fr: |
      Dans la vue Modèle, vous définissez le mode de stockage des quatre tables sur **Import**. Après la publication, vous planifiez une actualisation du modèle toutes les heures.
answer: { value: false }
explanation:
  correct:
    en: |
      Import tables return the data loaded at the last refresh. Rows inserted into FactOrders after a refresh stay invisible until the next one, which breaks the first requirement even with hourly refreshes.
    fr: |
      Les tables Import renvoient les données chargées lors de la dernière actualisation. Les lignes insérées dans FactOrders après une actualisation restent invisibles jusqu'à la suivante, ce qui enfreint la première exigence, même avec une actualisation toutes les heures.
references:
  - title: Table storage mode in Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-storage-mode
