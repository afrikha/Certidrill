id: dp600-3b-comp-cross-cardinality
objective: "3.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a composite model that contains a **Sales** table in DirectQuery mode from an Azure SQL database named **SQL1**, and a **Date** table imported from an Excel workbook. Date has one row per day from 1900 to 2100 and is related to Sales on DateKey. SQL1 also contains a table named dbo.DimDate with the same rows.

    Visuals that show sales by year are slow. The SQL queries sent to SQL1 contain very long lists of DateKey values.

    You need to improve the performance of these visuals. What should you do?
  fr: |
    Vous disposez d'un modèle composite qui contient une table **Sales** en mode DirectQuery provenant d'une base de données Azure SQL nommée **SQL1**, et une table **Date** importée depuis un classeur Excel. Date contient une ligne par jour de 1900 à 2100 et est reliée à Sales sur DateKey. SQL1 contient aussi une table nommée dbo.DimDate avec les mêmes lignes.

    Les visuels qui affichent les ventes par année sont lents. Les requêtes SQL envoyées à SQL1 contiennent de très longues listes de valeurs DateKey.

    Vous devez améliorer les performances de ces visuels. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn on Assume referential integrity for the relationship", fr: "Activer Assume referential integrity pour la relation" } }
    - { id: b, text: { en: "Replace Date with dbo.DimDate from SQL1 in Dual storage mode", fr: "Remplacer Date par dbo.DimDate de SQL1 en mode de stockage Double (Dual)" } }
    - { id: c, text: { en: "Set the cross-filter direction of the relationship to Both", fr: "Définir la direction du filtrage croisé de la relation sur Les deux" } }
    - { id: d, text: { en: "Change the cardinality of the relationship to many-to-one", fr: "Changer la cardinalité de la relation en plusieurs-à-un" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Date and Sales are in different source groups, so their relationship is limited, and filters or groupings on Date are sent to SQL1 as large IN lists of DateKey values. With a Dual date table from SQL1, queries that combine Date and Sales stay in one source group: the join is done in SQL1 with a regular relationship, while slicers on Date are still served from the cache.
    fr: |
      Date et Sales sont dans des groupes de sources différents : leur relation est limitée, et les filtres ou regroupements sur Date sont envoyés à SQL1 sous forme de grandes listes IN de valeurs DateKey. Avec une table de dates en mode Double issue de SQL1, les requêtes qui combinent Date et Sales restent dans un seul groupe de sources : la jointure est faite dans SQL1 avec une relation régulière, tandis que les segments sur Date restent servis par le cache.
  options:
    a:
      en: |
        Assume referential integrity is available only when both tables are DirectQuery tables of the same source group.
      fr: |
        Assume referential integrity n'est disponible que si les deux tables sont des tables DirectQuery du même groupe de sources.
    c:
      en: |
        Bidirectional filtering adds filter paths and usually makes queries slower; the relationship would still cross source groups.
      fr: |
        Le filtrage bidirectionnel ajoute des chemins de filtre et ralentit généralement les requêtes ; la relation traverserait toujours des groupes de sources.
    d:
      en: |
        A cross source group relationship stays limited whatever its cardinality, so the queries would not change.
      fr: |
        Une relation entre groupes de sources reste limitée quelle que soit sa cardinalité : les requêtes ne changeraient pas.
references:
  - title: Composite model guidance in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/guidance/composite-model-guidance
  - title: Table storage mode in Power BI semantic models
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-storage-mode
