id: dp600-3c-framing-transcoding
objective: "3.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You have a Direct Lake semantic model named RetailModel that uses the Delta tables of a lakehouse named Lakehouse1. You are explaining to the report authors how RetailModel loads and refreshes its data.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique Direct Lake nommé RetailModel qui utilise les tables Delta d'un lakehouse nommé Lakehouse1. Vous expliquez aux auteurs de rapports comment RetailModel charge et actualise ses données.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A refresh of RetailModel updates the model to reference the latest version of the Delta tables without copying the table data into the model.
        fr: Une actualisation de RetailModel met le modèle à jour pour qu'il référence la dernière version des tables Delta, sans copier les données des tables dans le modèle.
    - id: s2
      text:
        en: After a refresh, RetailModel loads every column of every table into memory before it answers the first query.
        fr: Après une actualisation, RetailModel charge toutes les colonnes de toutes les tables en mémoire avant de répondre à la première requête.
    - id: s3
      text:
        en: A column that is loaded in memory can be removed from memory when no query has used it for some time.
        fr: Une colonne chargée en mémoire peut en être retirée quand aucune requête ne l'a utilisée depuis un certain temps.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A Direct Lake refresh is a framing operation: it reads the Delta log and points the model to the latest Parquet files, which usually takes seconds and copies only metadata. Columns are then loaded on demand (transcoding) when a query first needs them, not all at once. A resident column is evicted after framing on a changed table, after a period without use, or under memory pressure.
    fr: |
      Une actualisation Direct Lake est une opération de cadrage : elle lit le journal Delta et fait pointer le modèle vers les derniers fichiers Parquet, ce qui prend en général quelques secondes et ne copie que des métadonnées. Les colonnes sont ensuite chargées à la demande (transcodage) quand une requête en a besoin pour la première fois, pas toutes en même temps. Une colonne résidente est évincée après un cadrage sur une table modifiée, après une période sans utilisation ou sous pression mémoire.
references:
  - title: How Direct Lake works
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works
