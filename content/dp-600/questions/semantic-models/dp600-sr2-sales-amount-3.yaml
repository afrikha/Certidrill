stem:
  en: You use SUMX to iterate over the rows of Sales.
  fr: Vous utilisez SUMX pour itérer sur les lignes de Sales.
body:
  solution:
    en: |
      You create the following measure.

      ```dax
      Sales Amount =
      SUMX ( Sales, Sales[Quantity] * Sales[UnitPrice] )
      ```
    fr: |
      Vous créez la mesure suivante.

      ```dax
      Sales Amount =
      SUMX ( Sales, Sales[Quantity] * Sales[UnitPrice] )
      ```
answer: { value: true }
explanation:
  correct:
    en: SUMX evaluates Quantity × UnitPrice for each row of Sales that is visible in the filter context and then sums the results, so every total, product or month returns the sum of its line amounts. The row-by-row calculation happens inside the measure, so no calculated column is added to the model.
    fr: "SUMX évalue Quantity × UnitPrice pour chaque ligne de Sales visible dans le contexte de filtre, puis additionne les résultats : chaque total, produit ou mois renvoie la somme de ses montants de ligne. Le calcul ligne par ligne a lieu dans la mesure : aucune colonne calculée n'est ajoutée au modèle."
references:
  - title: SUMX function (DAX)
    url: https://learn.microsoft.com/en-us/dax/sumx-function-dax
