id: dp600-sr1-joint-accounts-2
objective: "3.1.3"
type: series_yesno
series: dp600-sr1-joint-accounts
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You set the Customer to AccountHolder relationship to Both.
  fr: Vous définissez la relation entre Customer et AccountHolder sur Les deux.
body:
  solution:
    en: |
      You create a one-to-many relationship from `Customer[CustomerID]` to `AccountHolder[CustomerID]` with the **Both** cross-filter direction, and a one-to-many relationship from `Account[AccountID]` to `AccountHolder[AccountID]` with the **Single** cross-filter direction.
    fr: |
      Vous créez une relation un-à-plusieurs de `Customer[CustomerID]` vers `AccountHolder[CustomerID]` avec la direction de filtrage croisé **Les deux** (Both), et une relation un-à-plusieurs de `Account[AccountID]` vers `AccountHolder[AccountID]` avec la direction de filtrage croisé **Unique** (Single).
answer: { value: false }
explanation:
  correct:
    en: |
      Customer already filters AccountHolder through a one-to-many relationship; Both on that relationship only adds a filter from AccountHolder back to Customer. The relationship that must propagate the filter from AccountHolder to Account still uses Single, so Transaction isn't filtered and every customer shows the total balance.
    fr: |
      Customer filtre déjà AccountHolder par une relation un-à-plusieurs ; Les deux sur cette relation ajoute seulement un filtre d'AccountHolder vers Customer. La relation qui doit propager le filtre d'AccountHolder vers Account reste en Unique : Transaction n'est pas filtrée et chaque client affiche le solde total.
references:
  - title: Many-to-many relationship guidance
    url: https://learn.microsoft.com/en-us/power-bi/guidance/relationships-many-to-many
