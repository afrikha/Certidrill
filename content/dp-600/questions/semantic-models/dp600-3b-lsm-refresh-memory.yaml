id: dp600-3b-lsm-refresh-memory
objective: "3.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS1** that is assigned to an F128 capacity, which allows up to 50 GB of memory per semantic model. WS1 contains a 26 GB Import semantic model named **Telemetry** that uses the large semantic model storage format.

    Queries on Telemetry perform well, but the scheduled full refresh fails because it runs out of memory. You must keep the F128 capacity and all the data of Telemetry.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS1** qui est attribué à une capacité F128, qui autorise jusqu'à 50 Go de mémoire par modèle sémantique. WS1 contient un modèle sémantique Import de 26 Go nommé **Telemetry** qui utilise le format de stockage de modèle sémantique volumineux.

    Les requêtes sur Telemetry sont performantes, mais l'actualisation complète planifiée échoue par manque de mémoire. Vous devez conserver la capacité F128 et toutes les données de Telemetry.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn off Large semantic model storage format for Telemetry", fr: "Désactiver Large semantic model storage format pour Telemetry" } }
    - { id: b, text: { en: "Turn on query scale-out for Telemetry", fr: "Activer Query scale-out pour Telemetry" } }
    - { id: c, text: { en: "Refresh tables or partitions separately through the XMLA endpoint", fr: "Actualiser les tables ou les partitions séparément via le point de terminaison XMLA" } }
    - { id: d, text: { en: "Schedule more frequent full refreshes of Telemetry", fr: "Planifier des actualisations complètes plus fréquentes de Telemetry" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A full refresh can need more than twice the memory of the model, so a model above half the memory available on the capacity can fail to refresh even though it answers queries. Refreshing tables or partitions one by one, through the XMLA endpoint or the enhanced refresh REST API, keeps the memory needed by each operation lower.
    fr: |
      Une actualisation complète peut nécessiter plus du double de la mémoire du modèle : un modèle qui dépasse la moitié de la mémoire disponible sur la capacité peut donc échouer à l'actualisation tout en répondant aux requêtes. Actualiser les tables ou les partitions une par une, via le point de terminaison XMLA ou l'API REST d'actualisation améliorée, réduit la mémoire nécessaire à chaque opération.
  options:
    a:
      en: |
        Without the large format, the model could not grow to this size at all, so the refresh would still fail.
      fr: |
        Sans le format volumineux, le modèle ne pourrait même pas atteindre cette taille : l'actualisation échouerait toujours.
    b:
      en: |
        Query scale-out adds read-only replicas for queries; it does not reduce the memory needed by a refresh.
      fr: |
        Query scale-out ajoute des réplicas en lecture seule pour les requêtes ; il ne réduit pas la mémoire nécessaire à une actualisation.
    d:
      en: |
        Each full refresh needs the same memory, so more of them would fail in the same way.
      fr: |
        Chaque actualisation complète nécessite la même mémoire : en planifier davantage les ferait échouer de la même façon.
references:
