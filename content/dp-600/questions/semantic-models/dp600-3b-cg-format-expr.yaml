id: dp600-3b-cg-format-expr
objective: "3.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model that contains a table named **DimCurrency** with the columns CurrencyName and FormatString, and a calculation group named **Currency Conversion**. The measures of the model use different format strings, such as `#,0.00` and `0.0%`.

    You need to configure the format string expression of the **Converted** calculation item to meet the following requirements:

    - When a single currency is selected, use the format string of that currency.
    - Otherwise, keep the format string of the measure that the item is applied to.

    How should you complete the expression? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique qui contient une table nommée **DimCurrency** avec les colonnes CurrencyName et FormatString, et un groupe de calcul nommé **Currency Conversion**. Les mesures du modèle utilisent des chaînes de format différentes, comme `#,0.00` et `0.0%`.

    Vous devez configurer l'expression de chaîne de format de l'élément de calcul **Converted** pour satisfaire les exigences suivantes :

    - Quand une seule devise est sélectionnée, utiliser la chaîne de format de cette devise.
    - Sinon, conserver la chaîne de format de la mesure à laquelle l'élément est appliqué.

    Comment devez-vous compléter l'expression ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    [[fn]] (
        [[col]],
        [[fallback]]
    )
  slots:
    - id: fn
      options:
        - { id: selval, text: SELECTEDVALUE }
        - { id: values, text: VALUES }
        - { id: format, text: FORMAT }
        - { id: lookup, text: LOOKUPVALUE }
    - id: col
      options:
        - { id: fs, text: "DimCurrency[FormatString]" }
        - { id: cn, text: "DimCurrency[CurrencyName]" }
        - { id: cg, text: "'Currency Conversion'[Name]" }
    - id: fallback
      options:
        - { id: smfs, text: "SELECTEDMEASUREFORMATSTRING ()" }
        - { id: smn, text: "SELECTEDMEASURENAME ()" }
        - { id: sm, text: "SELECTEDMEASURE ()" }
        - { id: lit, text: "\"#,0.00\"" }
answer:
  values: { fn: selval, col: fs, fallback: smfs }
explanation:
  correct:
    en: |
      SELECTEDVALUE returns the value of DimCurrency[FormatString] when exactly one currency is in the filter context, and its second argument otherwise. SELECTEDMEASUREFORMATSTRING() returns the format string of the measure in context, so each measure keeps its own format when zero or several currencies are selected. The expression must return a string, which both branches do.
    fr: |
      SELECTEDVALUE renvoie la valeur de DimCurrency[FormatString] quand une seule devise figure dans le contexte de filtre, et son second argument dans le cas contraire. SELECTEDMEASUREFORMATSTRING() renvoie la chaîne de format de la mesure du contexte ; chaque mesure garde donc son propre format quand aucune ou plusieurs devises sont sélectionnées. L'expression doit renvoyer une chaîne, ce que font les deux branches.
  options:
    values: { en: "VALUES returns a table of values and takes a single argument; it errors when several currencies are selected.", fr: "VALUES renvoie une table de valeurs et prend un seul argument ; il échoue quand plusieurs devises sont sélectionnées." }
    format: { en: "FORMAT converts a value to text with a given format; it does not pick a format string from the context.", fr: "FORMAT convertit une valeur en texte selon un format donné ; il ne choisit pas une chaîne de format selon le contexte." }
    lookup: { en: "LOOKUPVALUE needs search columns and values; with this argument list it is not valid.", fr: "LOOKUPVALUE a besoin de colonnes et de valeurs de recherche ; avec cette liste d'arguments, il n'est pas valide." }
    cn: { en: "The currency name is not a format string.", fr: "Le nom de la devise n'est pas une chaîne de format." }
    cg: { en: "The calculation group column contains the names of the calculation items, not format strings.", fr: "La colonne du groupe de calcul contient les noms des éléments de calcul, pas des chaînes de format." }
    smn: { en: "SELECTEDMEASURENAME() returns the measure name, which is not a valid format string.", fr: "SELECTEDMEASURENAME() renvoie le nom de la mesure, qui n'est pas une chaîne de format valide." }
    sm: { en: "SELECTEDMEASURE() returns the value of the measure, not its format string.", fr: "SELECTEDMEASURE() renvoie la valeur de la mesure, pas sa chaîne de format." }
    lit: { en: "A fixed format would turn the percentage measures into decimal numbers.", fr: "Un format fixe transformerait les mesures en pourcentage en nombres décimaux." }
references:
  - title: SELECTEDMEASUREFORMATSTRING function (DAX)
    url: https://learn.microsoft.com/en-us/dax/selectedmeasureformatstring-function-dax
  - title: Calculation groups in Analysis Services tabular models
    url: https://learn.microsoft.com/en-us/analysis-services/tabular-models/calculation-groups
