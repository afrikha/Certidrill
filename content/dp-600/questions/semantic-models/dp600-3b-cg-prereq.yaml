id: dp600-3b-cg-prereq
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a semantic model named **SalesModel**. You open SalesModel in Power BI Desktop.

    You plan to add a calculation group named **Time Intelligence** that applies YTD and PY calculations to the measures of the model.

    Which model property must be enabled before the calculation group can be created?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un modèle sémantique nommé **SalesModel**. Vous ouvrez SalesModel dans Power BI Desktop.

    Vous prévoyez d'ajouter un groupe de calcul nommé **Time Intelligence** qui applique des calculs YTD et PY aux mesures du modèle.

    Quelle propriété du modèle doit être activée avant de pouvoir créer le groupe de calcul ?
body:
  options:
    - { id: a, text: { en: "Mark as date table on the Date table", fr: "Marquer comme table de dates sur la table Date" } }
    - { id: b, text: { en: "Discourage implicit measures", fr: "Décourager les mesures implicites" } }
    - { id: c, text: { en: "Assume referential integrity on the relationships to Sales", fr: "Assume referential integrity sur les relations vers Sales" } }
    - { id: d, text: { en: "Auto date/time for the current file", fr: "Date/heure automatique pour le fichier actif" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Calculation items apply only to explicit measures, so the Discourage implicit measures property (DiscourageImplicitMeasures in TOM) must be on. When you select Calculation group in Model view and the property is off, Power BI Desktop asks you to turn it on; visuals that already use implicit measures keep working, but columns can no longer be added as aggregated values.
    fr: |
      Les éléments de calcul ne s'appliquent qu'aux mesures explicites ; la propriété Décourager les mesures implicites (DiscourageImplicitMeasures dans TOM) doit donc être activée. Quand vous sélectionnez Groupe de calcul dans la vue Modèle et que la propriété est désactivée, Power BI Desktop vous propose de l'activer ; les visuels qui utilisent déjà des mesures implicites continuent de fonctionner, mais les colonnes ne peuvent plus être ajoutées comme valeurs agrégées.
  options:
    a:
      en: |
        Time intelligence functions work better with a marked date table, but marking it is not a prerequisite for creating a calculation group.
      fr: |
        Les fonctions de time intelligence fonctionnent mieux avec une table de dates marquée, mais la marquer n'est pas un prérequis à la création d'un groupe de calcul.
    c:
      en: |
        Assume referential integrity changes the joins generated for DirectQuery relationships; it has no link to calculation groups.
      fr: |
        Assume referential integrity change les jointures générées pour les relations DirectQuery ; elle n'a aucun lien avec les groupes de calcul.
    d:
      en: |
        Auto date/time creates hidden date tables for date columns; it is not required, and it is usually turned off in enterprise models.
      fr: |
        Date/heure automatique crée des tables de dates masquées pour les colonnes de date ; elle n'est pas requise et elle est généralement désactivée dans les modèles d'entreprise.
references:
  - title: Create calculation groups in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/calculation-groups
