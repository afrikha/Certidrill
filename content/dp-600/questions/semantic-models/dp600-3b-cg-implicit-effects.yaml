id: dp600-3b-cg-implicit-effects
objective: "3.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model named **Model1** that contains explicit measures, such as [Total Sales], and several report pages whose visuals use implicit measures, such as Sum of Sales[Quantity].

    You add a calculation group named **Time Intelligence** to Model1. The calculation group contains the calculation items Current, YTD and PY.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique nommé **Model1** qui contient des mesures explicites, comme [Total Sales], et plusieurs pages de rapport dont les visuels utilisent des mesures implicites, comme Somme de Sales[Quantity].

    Vous ajoutez à Model1 un groupe de calcul nommé **Time Intelligence**. Le groupe de calcul contient les éléments de calcul Current, YTD et PY.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The existing visuals that use Sum of Sales[Quantity] continue to work.
        fr: |
          Les visuels existants qui utilisent Somme de Sales[Quantity] continuent de fonctionner.
    - id: s2
      text:
        en: |
          When the YTD item is selected in a slicer, a visual that shows Sum of Sales[Quantity] displays the year-to-date quantity.
        fr: |
          Quand l'élément YTD est sélectionné dans un segment, un visuel qui affiche Somme de Sales[Quantity] montre la quantité depuis le début de l'année.
    - id: s3
      text:
        en: |
          Reports receive the measures of Model1 with the variant data type.
        fr: |
          Les rapports reçoivent les mesures de Model1 avec le type de données variant.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Implicit measures that are already in visuals keep working after a calculation group is added, but calculation items never apply to them, only to explicit measures; you would need an explicit measure such as [Total Quantity]. Once a model contains a calculation group, reports use the variant data type for all its measures, and the original data types come back only if every calculation group is removed.
    fr: |
      Les mesures implicites déjà présentes dans des visuels continuent de fonctionner après l'ajout d'un groupe de calcul, mais les éléments de calcul ne s'appliquent jamais à elles, seulement aux mesures explicites ; il faudrait une mesure explicite comme [Total Quantity]. Dès qu'un modèle contient un groupe de calcul, les rapports utilisent le type de données variant pour toutes ses mesures, et les types d'origine ne reviennent que si tous les groupes de calcul sont supprimés.
references:
  - title: Create calculation groups in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/calculation-groups
