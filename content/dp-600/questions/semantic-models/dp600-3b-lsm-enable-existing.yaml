id: dp600-3b-lsm-enable-existing
objective: "3.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS1** that is assigned to an F64 capacity. WS1 contains a published Import semantic model named **Model1** that uses the small storage format. You are an administrator of WS1 and of the capacity.

    You need to convert Model1 to the large semantic model storage format.

    Which two actions can you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS1** qui est attribué à une capacité F64. WS1 contient un modèle sémantique Import publié nommé **Model1** qui utilise le petit format de stockage. Vous êtes administrateur de WS1 et de la capacité.

    Vous devez convertir Model1 au format de stockage de modèle sémantique volumineux.

    Quelles sont les deux actions que vous pouvez effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In the settings of WS1, set Default storage format to Large semantic model storage format.", fr: "Dans les paramètres de WS1, définir Default storage format sur Large semantic model storage format." } }
    - { id: b, text: { en: "In the settings of Model1, turn on Large semantic model storage format, and then select Apply.", fr: "Dans les paramètres de Model1, activer Large semantic model storage format, puis sélectionner Apply." } }
    - { id: c, text: { en: "Turn on Query scale-out in the settings of Model1.", fr: "Activer Query scale-out dans les paramètres de Model1." } }
    - { id: d, text: { en: "Run Set-PowerBIDataset -Id <Model1 ID> -TargetStorageMode PremiumFiles.", fr: "Exécuter Set-PowerBIDataset -Id <Model1 ID> -TargetStorageMode PremiumFiles." } }
    - { id: e, text: { en: "Set the XMLA endpoint of the capacity to Read Write.", fr: "Définir le point de terminaison XMLA de la capacité sur Read Write." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      An existing model is converted either from its settings in the service (Large semantic model storage format > On > Apply) or with the MicrosoftPowerBIMgmt module, by running Set-PowerBIDataset with -TargetStorageMode PremiumFiles, which requires capacity and workspace admin rights.
    fr: |
      Un modèle existant se convertit soit depuis ses paramètres dans le service (Large semantic model storage format > On > Apply), soit avec le module MicrosoftPowerBIMgmt, en exécutant Set-PowerBIDataset avec -TargetStorageMode PremiumFiles, ce qui exige les droits d'administrateur de la capacité et de l'espace de travail.
  options:
    a:
      en: |
        The default storage format of a workspace applies to new models only, not to Model1, which already exists.
      fr: |
        Le format de stockage par défaut d'un espace de travail ne s'applique qu'aux nouveaux modèles, pas à Model1, qui existe déjà.
    c:
      en: |
        Query scale-out creates read-only replicas; it does not change the storage format.
      fr: |
        Query scale-out crée des réplicas en lecture seule ; il ne change pas le format de stockage.
    e:
      en: |
        Read Write XMLA access allows tools to write to models; it does not convert their storage format.
      fr: |
        L'accès XMLA Read Write permet aux outils d'écrire dans les modèles ; il ne convertit pas leur format de stockage.
references:
  - title: Large semantic models in Power BI Premium
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/service-premium-large-models
