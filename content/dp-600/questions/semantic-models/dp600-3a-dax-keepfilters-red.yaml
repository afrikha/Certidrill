id: dp600-3a-dax-keepfilters-red
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have the following measure:

    ```text
    Red Sales =
    CALCULATE ( [Sales], 'Product'[Color] = "Red" )
    ```

    In a table visual grouped by 'Product'[Color], Red Sales shows the sales of red products on every row, including the Blue and Black rows. You need Red Sales to return the red sales on the Red row and BLANK on the other color rows. The solution must use a Boolean filter expression, as recommended for performance.

    How should you rewrite the filter argument?
  fr: |
    Vous disposez de la mesure suivante :

    ```text
    Red Sales =
    CALCULATE ( [Sales], 'Product'[Color] = "Red" )
    ```

    Dans un visuel table regroupé par 'Product'[Color], Red Sales affiche les ventes des produits rouges sur toutes les lignes, y compris les lignes Blue et Black. Red Sales doit renvoyer les ventes rouges sur la ligne Red et BLANK sur les autres lignes de couleur. La solution doit utiliser une expression de filtre booléenne, comme le recommandent les bonnes pratiques de performances.

    Comment devez-vous réécrire l'argument de filtre ?
body:
  options:
    - { id: a, text: "KEEPFILTERS ( 'Product'[Color] = \"Red\" )" }
    - { id: b, text: "FILTER ( ALL ( 'Product' ), 'Product'[Color] = \"Red\" )" }
    - { id: c, text: "REMOVEFILTERS ( 'Product'[Color] ), 'Product'[Color] = \"Red\"" }
    - { id: d, text: "ALLEXCEPT ( 'Product', 'Product'[Color] ), 'Product'[Color] = \"Red\"" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      By default, a filter argument of CALCULATE replaces the existing filters on the same column, so the Red filter overrides the color of each row. KEEPFILTERS intersects the new filter with the existing one instead; on the Blue row, the intersection of Blue and Red is empty and the measure returns BLANK.
    fr: |
      Par défaut, un argument de filtre de CALCULATE remplace les filtres existants sur la même colonne ; le filtre Red écrase donc la couleur de chaque ligne. KEEPFILTERS croise plutôt le nouveau filtre avec le filtre existant ; sur la ligne Blue, l'intersection de Blue et de Red est vide et la mesure renvoie BLANK.
  options:
    b: { en: "FILTER over ALL('Product') ignores the row filter too, and it is a table expression rather than a Boolean filter.", fr: "FILTER sur ALL('Product') ignore lui aussi le filtre de ligne, et il s'agit d'une expression de table plutôt que d'un filtre booléen." }
    c: { en: "Removing the color filter and then filtering on Red still shows the red sales on every row.", fr: "Supprimer le filtre de couleur puis filtrer sur Red affiche toujours les ventes rouges sur toutes les lignes." }
    d: { en: "ALLEXCEPT removes the other Product filters but the Red filter still replaces the row's color.", fr: "ALLEXCEPT supprime les autres filtres de Product, mais le filtre Red remplace toujours la couleur de la ligne." }
references:
  - title: KEEPFILTERS function (DAX)
    url: https://learn.microsoft.com/en-us/dax/keepfilters-function-dax
  - title: Avoid using FILTER as a filter argument in DAX
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-avoid-avoid-filter-as-filter-argument
