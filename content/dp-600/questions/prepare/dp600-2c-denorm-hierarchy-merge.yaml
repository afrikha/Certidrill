id: dp600-2c-denorm-hierarchy-merge
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are building an Import semantic model in Power BI Desktop. The model reads three tables from the SQL analytics endpoint of a lakehouse named **LH1**: **Product**, **ProductSubcategory** and **ProductCategory**. Each product belongs to one subcategory, and each subcategory belongs to one category.

    Report authors need a **Category > Subcategory > Product** hierarchy. The solution must minimize the number of tables in the model.

    What should you do?
  fr: |
    Vous créez un modèle sémantique en mode Import dans Power BI Desktop. Le modèle lit trois tables depuis le point de terminaison d'analytique SQL d'un lakehouse nommé **LH1** : **Product**, **ProductSubcategory** et **ProductCategory**. Chaque produit appartient à une sous-catégorie et chaque sous-catégorie appartient à une catégorie.

    Les auteurs de rapports ont besoin d'une hiérarchie **Category > Subcategory > Product**. La solution doit réduire au minimum le nombre de tables du modèle.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Load the three tables, relate them, and create the hierarchy across the three tables.", fr: "Charger les trois tables, les relier, puis créer la hiérarchie sur les trois tables." }
    - id: b
      text: { en: "Append the three queries in Power Query, and create the hierarchy in the appended table.", fr: "Ajouter les trois requêtes l'une à l'autre dans Power Query, puis créer la hiérarchie dans la table obtenue." }
    - id: c
      text: { en: "Merge the three queries in Power Query into one product query, and disable the load of the other two.", fr: "Fusionner les trois requêtes dans Power Query en une seule requête des produits, puis désactiver le chargement des deux autres." }
    - id: d
      text: { en: "Load the three tables, relate them, and hide the subcategory and category tables.", fr: "Charger les trois tables, les relier, puis masquer les tables des sous-catégories et des catégories." }
answer: { optionId: c }
explanation:
  correct:
    en: "Merging the queries flattens the snowflake into one product table that holds the category, subcategory and product columns, so the hierarchy can be built in a single table. Disabling the load of the two helper queries keeps them out of the model, which leaves one table instead of three."
    fr: "La fusion des requêtes aplatit le flocon en une seule table des produits qui contient les colonnes de catégorie, de sous-catégorie et de produit : la hiérarchie peut alors être créée dans une seule table. Désactiver le chargement des deux requêtes intermédiaires les exclut du modèle, qui ne contient plus qu'une table au lieu de trois."
  options:
    a: { en: "A hierarchy can't include columns from more than one table, and the model keeps three tables.", fr: "Une hiérarchie ne peut pas inclure des colonnes de plusieurs tables, et le modèle conserve trois tables." }
    b: { en: "Append stacks the rows of the three tables; it doesn't put the category and subcategory names on each product row.", fr: "L'ajout empile les lignes des trois tables ; il ne place pas les noms de catégorie et de sous-catégorie sur chaque ligne de produit." }
    d: { en: "Hidden tables are still loaded, and the hierarchy still can't span the three tables.", fr: "Les tables masquées sont toujours chargées, et la hiérarchie ne peut toujours pas couvrir les trois tables." }
references:
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
  - title: Merge queries overview
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-overview
