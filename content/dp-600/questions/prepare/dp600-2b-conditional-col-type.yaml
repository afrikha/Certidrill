id: dp600-2b-conditional-col-type
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Dataflow Gen2 named DF-Customers that writes a query named Customers to a lakehouse table. You add a conditional column named Tier that returns Gold, Silver or Bronze based on the TotalSpend column.

    The column header of Tier shows the Any data type. You need Tier to be written to the lakehouse table as text.

    What should you do?
  fr: |
    Vous disposez d'un Dataflow Gen2 nommé DF-Customers qui écrit une requête nommée Customers dans une table de lakehouse. Vous ajoutez une colonne conditionnelle nommée Tier qui renvoie Gold, Silver ou Bronze selon la colonne TotalSpend.

    L'en-tête de la colonne Tier affiche le type de données Any. Tier doit être écrite dans la table du lakehouse sous forme de texte.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a step that changes the data type of Tier to Text.", fr: "Ajouter une étape qui change le type de données de Tier en Texte." } }
    - { id: b, text: { en: "Enable staging for the Customers query before publishing.", fr: "Activer la mise en lots intermédiaire (staging) pour la requête Customers avant la publication." } }
    - { id: c, text: { en: "Add an index column before the conditional column.", fr: "Ajouter une colonne d'index avant la colonne conditionnelle." } }
    - { id: d, text: { en: "Change the update method of the data destination to Append.", fr: "Changer la méthode de mise à jour de la destination de données en Append." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      New conditional columns don't have a data type defined, so Power Query types them as Any. You set the type in a new step, for example by selecting the type icon in the column header or Transform > Data type, so the destination receives a text column.
    fr: |
      Les nouvelles colonnes conditionnelles n'ont pas de type de données défini : Power Query leur attribue le type Any. Vous définissez le type dans une nouvelle étape, par exemple avec l'icône de type de l'en-tête de colonne ou Transformer > Type de données, pour que la destination reçoive une colonne de texte.
  options:
    b:
      en: |
        Staging changes where the query is processed, not the data type of a column.
      fr: |
        La mise en lots intermédiaire change l'endroit où la requête est traitée, pas le type de données d'une colonne.
    c:
      en: |
        An index column adds row numbers; it doesn't type the Tier column.
      fr: |
        Une colonne d'index ajoute des numéros de ligne ; elle ne type pas la colonne Tier.
    d:
      en: |
        Append or Replace controls how rows are written, not the data type of the column.
      fr: |
        Append ou Replace contrôle la façon dont les lignes sont écrites, pas le type de données de la colonne.
references:
  - title: Add a conditional column
    url: https://learn.microsoft.com/en-us/power-query/add-conditional-column
