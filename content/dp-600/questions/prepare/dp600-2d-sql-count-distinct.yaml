id: dp600-2d-sql-count-distinct
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a table named **dbo.FactOrderLine**. The table contains one row per order line. The CustomerKey column never contains NULL, and a customer can place several orders per month.

    You need a query that returns, for each month, the exact number of different customers who placed at least one order.

    Which expression should you use in the SELECT list of the query?
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table nommée **dbo.FactOrderLine**. La table contient une ligne par ligne de commande. La colonne CustomerKey ne contient jamais NULL, et un client peut passer plusieurs commandes par mois.

    Vous avez besoin d'une requête qui renvoie, pour chaque mois, le nombre exact de clients différents qui ont passé au moins une commande.

    Quelle expression devez-vous utiliser dans la liste SELECT de la requête ?
body:
  options:
    - { id: a, text: "COUNT(*)" }
    - { id: b, text: "COUNT(CustomerKey)" }
    - { id: c, text: "COUNT(DISTINCT CustomerKey)" }
    - { id: d, text: "APPROX_COUNT_DISTINCT(CustomerKey)" }
answer: { optionId: c }
explanation:
  correct:
    en: "`COUNT(DISTINCT CustomerKey)` counts each customer once per group, whatever the number of order lines the customer has in the month, and returns an exact result."
    fr: "`COUNT(DISTINCT CustomerKey)` compte chaque client une seule fois par groupe, quel que soit le nombre de lignes de commande du client dans le mois, et renvoie un résultat exact."
  options:
    a: { en: "COUNT(*) counts the order lines, so a customer with several lines is counted several times.", fr: "COUNT(*) compte les lignes de commande : un client qui a plusieurs lignes est compté plusieurs fois." }
    b: { en: "COUNT(CustomerKey) counts the non-null values, which here is the number of order lines.", fr: "COUNT(CustomerKey) compte les valeurs non NULL, c'est-à-dire ici le nombre de lignes de commande." }
    d: { en: "APPROX_COUNT_DISTINCT returns an approximate count, but the requirement is an exact number.", fr: "APPROX_COUNT_DISTINCT renvoie un nombre approximatif, alors que l'exigence demande un nombre exact." }
references:
  - title: APPROX_COUNT_DISTINCT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/approx-count-distinct-transact-sql
  - title: SELECT - GROUP BY clause (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-group-by-transact-sql
