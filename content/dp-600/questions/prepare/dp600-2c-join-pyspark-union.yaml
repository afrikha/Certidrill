id: dp600-2c-join-pyspark-union
objective: "2.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a lakehouse that contains two Delta tables, **bronze_sales_eu** and **bronze_sales_us**. Both contain the same sales columns, but in a different order, and only bronze_sales_eu has a **VATAmount** column. bronze_sales_us contains some rows twice, with identical values in every column.

    You need a DataFrame that contains the rows of both tables, matches the columns by name, has null VATAmount values for the US rows, and contains each identical row only once.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse qui contient deux tables Delta, **bronze_sales_eu** et **bronze_sales_us**. Les deux contiennent les mêmes colonnes de ventes, mais dans un ordre différent, et seule bronze_sales_eu possède une colonne **VATAmount**. bronze_sales_us contient certaines lignes en double, avec des valeurs identiques dans toutes les colonnes.

    Vous avez besoin d'un DataFrame qui contient les lignes des deux tables, associe les colonnes par nom, a des valeurs VATAmount null pour les lignes américaines et ne contient qu'une fois chaque ligne identique.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    sales_eu = spark.read.table("bronze_sales_eu")
    sales_us = spark.read.table("bronze_sales_us")

    all_sales = (sales_eu
        .[[u]](sales_us, [[opt]]=True)
        .[[d]]())
  slots:
    - id: u
      options:
        - { id: unionbyname, text: unionByName }
        - { id: union, text: union }
        - { id: join, text: join }
        - { id: crossjoin, text: crossJoin }
    - id: opt
      options:
        - { id: allowmissing, text: allowMissingColumns }
        - { id: mergeschema, text: mergeSchema }
        - { id: overwriteschema, text: overwriteSchema }
    - id: d
      options:
        - { id: distinct, text: distinct }
        - { id: dropna, text: dropna }
        - { id: cache, text: cache }
answer:
  values: { u: unionbyname, opt: allowmissing, d: distinct }
explanation:
  correct:
    en: "`unionByName` stacks the rows and matches the columns by name instead of by position. With `allowMissingColumns=True`, a column that exists in only one DataFrame is added and filled with null for the other one. Like `UNION ALL`, a union keeps duplicates, so `distinct()` removes the rows that are identical in every column."
    fr: "`unionByName` empile les lignes et associe les colonnes par nom plutôt que par position. Avec `allowMissingColumns=True`, une colonne qui n'existe que dans un DataFrame est ajoutée et remplie de null pour l'autre. Comme `UNION ALL`, une union conserve les doublons : `distinct()` supprime les lignes identiques sur toutes les colonnes."
  options:
    union: { en: "union matches the columns by position, so columns in a different order would be mixed up.", fr: "union associe les colonnes par position : des colonnes dans un ordre différent seraient mélangées." }
    join: { en: "A join adds columns from another DataFrame; it doesn't stack rows.", fr: "Une jointure ajoute des colonnes d'un autre DataFrame ; elle n'empile pas les lignes." }
    crossjoin: { en: "crossJoin returns every combination of rows of the two DataFrames.", fr: "crossJoin renvoie toutes les combinaisons de lignes des deux DataFrames." }
    mergeschema: { en: "mergeSchema is a Delta option for reading or writing files, not a parameter of unionByName.", fr: "mergeSchema est une option Delta de lecture ou d'écriture de fichiers, pas un paramètre de unionByName." }
    overwriteschema: { en: "overwriteSchema is a Delta write option that replaces a table schema.", fr: "overwriteSchema est une option d'écriture Delta qui remplace le schéma d'une table." }
    dropna: { en: "dropna removes rows that contain nulls, which would remove every US row.", fr: "dropna supprime les lignes qui contiennent des valeurs null, ce qui supprimerait toutes les lignes américaines." }
    cache: { en: "cache keeps the DataFrame in memory; it doesn't remove duplicates.", fr: "cache conserve le DataFrame en mémoire ; il ne supprime pas les doublons." }
references:
  - title: Append queries
    url: https://learn.microsoft.com/en-us/power-query/append-queries
  - title: "Lakehouse tutorial: Prepare and transform data in the lakehouse"
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/tutorial-lakehouse-data-preparation
