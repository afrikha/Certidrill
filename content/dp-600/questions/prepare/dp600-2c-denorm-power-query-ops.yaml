id: dp600-2c-denorm-power-query-ops
objective: "2.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are shaping product data in a Dataflow Gen2 before loading it to a lakehouse. You have the following requirements:

    - Add the category name of each product to the product rows from a Category query.
    - Turn a ProductAttribute query that has one row per product and attribute (ProductID, AttributeName, AttributeValue) into one column per attribute.
    - Combine two product files from 2025 and 2026 that have the same columns.
    - Turn a target table that has one column per month (Jan to Dec) into one row per product and month.

    Which Power Query operation should you use for each requirement? To answer, drag the appropriate operations to the correct requirements. Each operation may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous mettez en forme des données de produits dans un Dataflow Gen2 avant de les charger dans un lakehouse. Vous avez les exigences suivantes :

    - Ajouter aux lignes de produits le nom de catégorie de chaque produit, à partir d'une requête Category.
    - Transformer une requête ProductAttribute qui contient une ligne par produit et par attribut (ProductID, AttributeName, AttributeValue) en une colonne par attribut.
    - Combiner deux fichiers de produits de 2025 et de 2026 qui ont les mêmes colonnes.
    - Transformer une table d'objectifs qui contient une colonne par mois (Jan à Dec) en une ligne par produit et par mois.

    Quelle opération Power Query devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les opérations appropriées vers les exigences correspondantes. Chaque opération peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: merge, text: { en: "Merge queries", fr: "Fusionner les requêtes" } }
    - { id: append, text: { en: "Append queries", fr: "Ajouter des requêtes" } }
    - { id: pivot, text: { en: "Pivot column", fr: "Colonne pivot" } }
    - { id: unpivot, text: { en: "Unpivot columns", fr: "Dépivoter les colonnes" } }
    - { id: group, text: { en: "Group by", fr: "Grouper par" } }
  targets:
    - { id: t1, text: { en: "Add the category name to each product row", fr: "Ajouter le nom de catégorie à chaque ligne de produit" } }
    - { id: t2, text: { en: "One column per attribute", fr: "Une colonne par attribut" } }
    - { id: t3, text: { en: "Combine the 2025 and 2026 files", fr: "Combiner les fichiers de 2025 et de 2026" } }
    - { id: t4, text: { en: "One row per product and month", fr: "Une ligne par produit et par mois" } }
answer:
  mapping: { t1: merge, t2: pivot, t3: append, t4: unpivot }
explanation:
  correct:
    en: "Merge queries joins two queries and adds columns from the right table, here the category name. Pivot column turns the attribute names into columns, which denormalizes the attribute rows onto the product. Append queries stacks the rows of tables that have the same columns. Unpivot columns turns the month columns into rows. Group by summarizes rows and isn't needed."
    fr: "Fusionner les requêtes joint deux requêtes et ajoute des colonnes de la table de droite, ici le nom de catégorie. Colonne pivot transforme les noms d'attributs en colonnes, ce qui dénormalise les lignes d'attributs sur le produit. Ajouter des requêtes empile les lignes de tables qui ont les mêmes colonnes. Dépivoter les colonnes transforme les colonnes de mois en lignes. Grouper par résume des lignes et n'est pas nécessaire."
references:
  - title: Merge queries overview
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-overview
  - title: Pivot columns
    url: https://learn.microsoft.com/en-us/power-query/pivot-columns
