id: dp600-2d-cast-truncate-round
objective: "2.2.8"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a table named **dbo.PriceList**. The UnitPrice column uses the `decimal(10,2)` data type. For the product named P100, UnitPrice is **24.75**.

    You run the following query.

    ```sql
    SELECT CAST(UnitPrice AS int) AS PriceInt,
           CAST(UnitPrice AS decimal(10,1)) AS PriceOneDecimal
    FROM dbo.PriceList
    WHERE ProductCode = 'P100';
    ```

    Which values does the query return for PriceInt and PriceOneDecimal?
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table nommée **dbo.PriceList**. La colonne UnitPrice utilise le type de données `decimal(10,2)`. Pour le produit nommé P100, UnitPrice vaut **24.75**.

    Vous exécutez la requête suivante.

    ```sql
    SELECT CAST(UnitPrice AS int) AS PriceInt,
           CAST(UnitPrice AS decimal(10,1)) AS PriceOneDecimal
    FROM dbo.PriceList
    WHERE ProductCode = 'P100';
    ```

    Quelles valeurs la requête renvoie-t-elle pour PriceInt et PriceOneDecimal ?
body:
  options:
    - { id: a, text: { en: "PriceInt = 24 and PriceOneDecimal = 24.7", fr: "PriceInt = 24 et PriceOneDecimal = 24.7" } }
    - { id: b, text: { en: "PriceInt = 24 and PriceOneDecimal = 24.8", fr: "PriceInt = 24 et PriceOneDecimal = 24.8" } }
    - { id: c, text: { en: "PriceInt = 25 and PriceOneDecimal = 24.7", fr: "PriceInt = 25 et PriceOneDecimal = 24.7" } }
    - { id: d, text: { en: "PriceInt = 25 and PriceOneDecimal = 24.8", fr: "PriceInt = 25 et PriceOneDecimal = 24.8" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A conversion from `decimal` to `int` truncates the fractional part, so 24.75 becomes 24. A conversion from `decimal` to a `decimal` with fewer decimal places rounds the value, so 24.75 becomes 24.8.
    fr: |
      Une conversion de `decimal` vers `int` tronque la partie décimale : 24.75 devient 24. Une conversion de `decimal` vers un `decimal` comportant moins de décimales arrondit la valeur : 24.75 devient 24.8.
  options:
    a: { en: "The conversion to decimal(10,1) rounds instead of truncating, so it returns 24.8.", fr: "La conversion en decimal(10,1) arrondit au lieu de tronquer : elle renvoie 24.8." }
    c: { en: "The conversion to int truncates, so it returns 24; the conversion to decimal(10,1) rounds to 24.8.", fr: "La conversion en int tronque : elle renvoie 24 ; la conversion en decimal(10,1) arrondit à 24.8." }
    d: { en: "The conversion from decimal to int truncates instead of rounding, so it returns 24.", fr: "La conversion de decimal vers int tronque au lieu d'arrondir : elle renvoie 24." }
references:
  - title: CAST and CONVERT (Transact-SQL)
