id: dp600-2e-dax-order-counts
objective: "2.3.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a semantic model named **RetailModel**. The **Sales** table has one row per order line: an order that contains three products has three rows with the same **OrderNumber**. The **Store** table is related to Sales.

    You need a DAX query that returns, for each region, the number of orders and the number of order lines.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique nommé **RetailModel**. La table **Sales** comporte une ligne par ligne de commande : une commande qui contient trois produits a trois lignes avec le même **OrderNumber**. La table **Store** est liée à Sales.

    Vous avez besoin d'une requête DAX qui renvoie, pour chaque région, le nombre de commandes et le nombre de lignes de commande.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    DEFINE
        MEASURE Sales[Orders] = [[orders]]
    EVALUATE
        SUMMARIZECOLUMNS (
            Store[Region],
            "Orders", [Orders],
            "Order lines", [[lines]]
        )
  slots:
    - id: orders
      options:
        - { id: count, text: "COUNT ( Sales[OrderNumber] )" }
        - { id: dcount, text: "DISTINCTCOUNT ( Sales[OrderNumber] )" }
        - { id: rows, text: "COUNTROWS ( Sales )" }
        - { id: blank, text: "COUNTBLANK ( Sales[OrderNumber] )" }
    - id: lines
      options:
        - { id: storerows, text: "COUNTROWS ( Store )" }
        - { id: linedcount, text: "DISTINCTCOUNT ( Sales[OrderNumber] )" }
        - { id: salesrows, text: "COUNTROWS ( Sales )" }
answer:
  values: { orders: dcount, lines: salesrows }
explanation:
  correct:
    en: "DISTINCTCOUNT counts the distinct values of OrderNumber, so the three lines of an order count as one order. COUNTROWS ( Sales ) counts the rows of Sales in each region, which is the number of order lines."
    fr: "DISTINCTCOUNT compte les valeurs distinctes d'OrderNumber : les trois lignes d'une commande comptent pour une seule commande. COUNTROWS ( Sales ) compte les lignes de Sales de chaque région, c'est-à-dire le nombre de lignes de commande."
  options:
    count:
      en: "COUNT counts the non-blank values of OrderNumber, which is one per order line, not one per order."
      fr: "COUNT compte les valeurs non vides d'OrderNumber, soit une par ligne de commande, et non une par commande."
    rows:
      en: "COUNTROWS ( Sales ) returns the number of order lines, not the number of orders."
      fr: "COUNTROWS ( Sales ) renvoie le nombre de lignes de commande, pas le nombre de commandes."
    blank:
      en: "COUNTBLANK counts the rows where OrderNumber is blank."
      fr: "COUNTBLANK compte les lignes où OrderNumber est vide."
    storerows:
      en: "COUNTROWS ( Store ) counts the stores of each region, not the order lines."
      fr: "COUNTROWS ( Store ) compte les magasins de chaque région, pas les lignes de commande."
    linedcount:
      en: "DISTINCTCOUNT of OrderNumber returns the number of orders, not the number of lines."
      fr: "DISTINCTCOUNT d'OrderNumber renvoie le nombre de commandes, pas le nombre de lignes."
references:
  - title: DISTINCTCOUNT function (DAX)
    url: https://learn.microsoft.com/en-us/dax/distinctcount-function-dax
  - title: DAX Queries
    url: https://learn.microsoft.com/en-us/dax/dax-queries
