id: dp600-2a-s3-shortcut-creds
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric lakehouse named LH1. You create an Amazon S3 shortcut named S3Sales in the Files section of LH1. The connection of S3Sales uses the access key ID and the secret access key of an AWS IAM user named fabric-reader.

    Data analysts read the files of S3Sales from notebooks in the same workspace.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse Fabric nommé LH1. Vous créez un raccourci Amazon S3 nommé S3Sales dans la section Files de LH1. La connexion de S3Sales utilise l'ID de clé d'accès et la clé d'accès secrète d'un utilisateur IAM AWS nommé fabric-reader.

    Des analystes de données lisent les fichiers de S3Sales depuis des notebooks du même espace de travail.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: fabric-reader needs the s3:GetObject, s3:GetBucketLocation and s3:ListBucket permissions on the target bucket.
        fr: fabric-reader a besoin des autorisations s3:GetObject, s3:GetBucketLocation et s3:ListBucket sur le compartiment cible.
    - id: s2
      text:
        en: Each analyst needs their own AWS credentials to read the files through S3Sales.
        fr: Chaque analyste a besoin de ses propres informations d'identification AWS pour lire les fichiers via S3Sales.
    - id: s3
      text:
        en: If fabric-reader is granted s3:PutObject on the bucket, the analysts can write new files to the bucket through S3Sales.
        fr: Si fabric-reader reçoit l'autorisation s3:PutObject sur le compartiment, les analystes peuvent écrire de nouveaux fichiers dans le compartiment via S3Sales.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The IAM user stored in the connection needs s3:GetObject, s3:GetBucketLocation and s3:ListBucket on the bucket. External shortcuts use delegated authentication: every access goes through the credential of the connection, so analysts need no AWS identity of their own, only access to LH1. Amazon S3 shortcuts are read-only regardless of the permissions of the IAM user.
    fr: |
      L'utilisateur IAM stocké dans la connexion a besoin de s3:GetObject, s3:GetBucketLocation et s3:ListBucket sur le compartiment. Les raccourcis externes utilisent une authentification déléguée : chaque accès passe par l'information d'identification de la connexion, donc les analystes n'ont besoin d'aucune identité AWS propre, seulement d'un accès à LH1. Les raccourcis Amazon S3 sont en lecture seule, quelles que soient les autorisations de l'utilisateur IAM.
references:
  - title: Create an Amazon S3 shortcut
    url: https://learn.microsoft.com/en-us/fabric/onelake/create-s3-shortcut
  - title: OneLake shortcut security
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcut-security
