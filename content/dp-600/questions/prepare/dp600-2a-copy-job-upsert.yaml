id: dp600-2a-copy-job-upsert
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Snowflake database that contains 40 tables. A business analyst who has never built a pipeline must load 12 of the tables into a Fabric lakehouse named LH-Bronze.

    The solution must meet the following requirements:

    - Run every four hours.
    - Load all the rows on the first run, then only new and changed rows.
    - Update the existing rows in LH-Bronze based on a key column instead of adding duplicates.
    - Minimize development effort.

    What should the analyst create?
  fr: |
    Vous disposez d'une base de données Snowflake qui contient 40 tables. Un analyste métier qui n'a jamais créé de pipeline doit charger 12 de ces tables dans un lakehouse Fabric nommé LH-Bronze.

    La solution doit répondre aux exigences suivantes :

    - S'exécuter toutes les quatre heures.
    - Charger toutes les lignes à la première exécution, puis seulement les lignes nouvelles et modifiées.
    - Mettre à jour les lignes existantes de LH-Bronze à partir d'une colonne clé au lieu d'ajouter des doublons.
    - Réduire au minimum l'effort de développement.

    Que doit créer l'analyste ?
body:
  options:
    - { id: a, text: { en: "A copy job that uses incremental copy and the Merge update method, with a schedule every four hours", fr: "Un travail de copie (Copy job) qui utilise la copie incrémentielle et la méthode de mise à jour Merge, planifié toutes les quatre heures" } }
    - { id: b, text: { en: "A mirrored Snowflake database that replicates the 12 tables", fr: "Une base de données Snowflake en miroir qui réplique les 12 tables" } }
    - { id: c, text: { en: "An eventstream that appends the changes of the 12 tables to LH-Bronze", fr: "Un flux d'événements qui ajoute les modifications des 12 tables à LH-Bronze" } }
    - { id: d, text: { en: "A notebook that runs MERGE statements, scheduled every four hours", fr: "Un notebook qui exécute des instructions MERGE, planifié toutes les quatre heures" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A copy job is a wizard-based item that supports table selection, custom schedules and incremental copy, which copies everything on the first run and then only new or changed data. The Merge update method updates existing rows by using a key column, so no pipeline or code is needed.
    fr: |
      Un travail de copie est un élément guidé par un assistant qui prend en charge la sélection des tables, les planifications personnalisées et la copie incrémentielle, qui copie tout à la première exécution, puis seulement les données nouvelles ou modifiées. La méthode de mise à jour Merge met à jour les lignes existantes à l'aide d'une colonne clé : aucun pipeline ni code n'est nécessaire.
  options:
    b:
      en: Mirroring replicates continuously into its own read-only mirrored database item, with fixed behavior and no custom schedule or LH-Bronze destination.
      fr: La mise en miroir réplique en continu dans son propre élément base de données en miroir, en lecture seule, avec un comportement fixe, sans planification personnalisée ni destination LH-Bronze.
    c:
      en: Eventstreams process streaming events and only append; they do not upsert rows on a four-hour schedule.
      fr: Les flux d'événements traitent des événements de streaming et ne font qu'ajouter ; ils ne mettent pas à jour les lignes selon une planification de quatre heures.
    d:
      en: A notebook requires writing and maintaining Spark code, which does not minimize development effort.
      fr: Un notebook exige d'écrire et de maintenir du code Spark, ce qui ne réduit pas l'effort de développement.
