id: dp600-2e-kql-top-errors
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a KQL database named **FleetDB** in a Fabric eventhouse. FleetDB contains a table named **DeviceErrors** that has one row per error and the columns **DeviceId**, **ErrorCode** and **Timestamp**.

    You write the following query in a KQL queryset.

    ```kusto
    DeviceErrors
    | where Timestamp > ago(1d)
    | summarize Errors = count() by DeviceId
    ```

    You need to complete the query so that it returns the 10 devices that had the most errors during the last day.

    Which line should you add at the end of the query?
  fr: |
    Vous disposez d'une base de données KQL nommée **FleetDB** dans un eventhouse Fabric. FleetDB contient une table nommée **DeviceErrors** qui comporte une ligne par erreur et les colonnes **DeviceId**, **ErrorCode** et **Timestamp**.

    Vous écrivez la requête suivante dans un ensemble de requêtes KQL.

    ```kusto
    DeviceErrors
    | where Timestamp > ago(1d)
    | summarize Errors = count() by DeviceId
    ```

    Vous devez compléter la requête pour qu'elle renvoie les 10 appareils qui ont eu le plus d'erreurs au cours de la dernière journée.

    Quelle ligne devez-vous ajouter à la fin de la requête ?
body:
  options:
    - { id: a, text: "| take 10" }
    - { id: b, text: "| sort by Errors asc | take 10" }
    - { id: c, text: "| top 10 by Errors asc" }
    - { id: d, text: "| top 10 by Errors" }
answer: { optionId: d }
explanation:
  correct:
    en: "`top 10 by Errors` sorts the rows by Errors and returns the first 10. When neither `asc` nor `desc` is specified, `top` sorts in descending order, so the devices with the most errors come first."
    fr: "`top 10 by Errors` trie les lignes selon Errors et renvoie les 10 premières. Quand ni `asc` ni `desc` n'est indiqué, `top` trie en ordre décroissant : les appareils ayant le plus d'erreurs arrivent en premier."
  options:
    a:
      en: "`take` returns 10 arbitrary rows: there is no guarantee which rows are returned when the data isn't sorted."
      fr: "`take` renvoie 10 lignes quelconques : rien ne garantit lesquelles sont renvoyées quand les données ne sont pas triées."
    b:
      en: "Sorting in ascending order and then taking 10 rows returns the 10 devices with the fewest errors."
      fr: "Trier en ordre croissant puis prendre 10 lignes renvoie les 10 appareils ayant le moins d'erreurs."
    c:
      en: "`asc` selects the bottom of the range: the 10 devices with the fewest errors."
      fr: "`asc` sélectionne le bas de la plage : les 10 appareils ayant le moins d'erreurs."
references:
  - title: top operator
    url: https://learn.microsoft.com/en-us/kusto/query/top-operator
  - title: take operator
    url: https://learn.microsoft.com/en-us/kusto/query/take-operator
