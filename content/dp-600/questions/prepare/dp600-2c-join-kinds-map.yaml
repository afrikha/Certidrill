id: dp600-2c-join-kinds-map
objective: "2.2.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are merging two queries in a Dataflow Gen2. **Orders** is the left table and **Products** is the right table. They are merged on ProductID.

    Which join kind should you use for each requirement? To answer, drag the appropriate join kinds to the correct requirements. Each join kind may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous fusionnez deux requêtes dans un Dataflow Gen2. **Orders** est la table de gauche et **Products** la table de droite. Elles sont fusionnées sur ProductID.

    Quel type de jointure devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les types de jointure appropriés vers les exigences correspondantes. Chaque type de jointure peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: inner, text: { en: "Inner", fr: "Jointure interne" } }
    - { id: leftouter, text: { en: "Left outer", fr: "Jointure externe gauche" } }
    - { id: rightouter, text: { en: "Right outer", fr: "Jointure externe droite" } }
    - { id: full, text: { en: "Full outer", fr: "Jointure externe complète" } }
    - { id: leftanti, text: { en: "Left anti", fr: "Anti jointure gauche" } }
    - { id: rightanti, text: { en: "Right anti", fr: "Anti jointure droite" } }
  targets:
    - { id: t1, text: { en: "Products that were never ordered", fr: "Produits qui n'ont jamais été commandés" } }
    - { id: t2, text: { en: "Only the orders whose product exists, with the product columns", fr: "Uniquement les commandes dont le produit existe, avec les colonnes du produit" } }
    - { id: t3, text: { en: "Every order and every product, matched where possible", fr: "Toutes les commandes et tous les produits, associés quand c'est possible" } }
    - { id: t4, text: { en: "Orders whose ProductID doesn't exist in Products", fr: "Commandes dont le ProductID n'existe pas dans Products" } }
answer:
  mapping: { t1: rightanti, t2: inner, t3: full, t4: leftanti }
explanation:
  correct:
    en: "Right anti keeps only the rows of the right table (Products) without a match. Inner keeps only matching rows from both tables. Full outer keeps all rows of both tables. Left anti keeps only the rows of the left table (Orders) without a match, which finds orphaned keys."
    fr: "L'anti jointure droite ne conserve que les lignes de la table de droite (Products) sans correspondance. La jointure interne ne conserve que les lignes correspondantes des deux tables. La jointure externe complète conserve toutes les lignes des deux tables. L'anti jointure gauche ne conserve que les lignes de la table de gauche (Orders) sans correspondance, ce qui permet de trouver les clés orphelines."
  options:
    leftouter: { en: "Left outer keeps every order, including those with an existing product.", fr: "La jointure externe gauche conserve toutes les commandes, y compris celles dont le produit existe." }
    rightouter: { en: "Right outer keeps every product, including those that were ordered.", fr: "La jointure externe droite conserve tous les produits, y compris ceux qui ont été commandés." }
references:
  - title: Merge queries overview
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-overview
  - title: Left anti join
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-left-anti
