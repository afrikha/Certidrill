id: dp600-2b-spark-add-column
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric notebook attached to a lakehouse. The notebook loads a table into a PySpark DataFrame named df that has numeric Amount and Discount columns. The notebook already runs `from pyspark.sql import functions as F`.

    You need to create a DataFrame named df2 that contains all the columns of df plus a NetAmount column equal to Amount minus Discount.

    Which two code segments achieve the goal? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un notebook Fabric attaché à un lakehouse. Le notebook charge une table dans un DataFrame PySpark nommé df qui a des colonnes numériques Amount et Discount. Le notebook exécute déjà `from pyspark.sql import functions as F`.

    Vous devez créer un DataFrame nommé df2 qui contient toutes les colonnes de df plus une colonne NetAmount égale à Amount moins Discount.

    Quels sont les deux segments de code qui atteignent l'objectif ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "df2 = df.withColumnRenamed(\"NetAmount\", F.col(\"Amount\") - F.col(\"Discount\"))" }
    - { id: b, text: "df2 = df.withColumn(\"NetAmount\", F.col(\"Amount\") - F.col(\"Discount\"))" }
    - { id: c, text: "df2 = df.withColumn(F.col(\"Amount\") - F.col(\"Discount\"), \"NetAmount\")" }
    - { id: d, text: "df2 = df.selectExpr(\"*\", \"Amount - Discount AS NetAmount\")" }
    - { id: e, text: "df[\"NetAmount\"] = df[\"Amount\"] - df[\"Discount\"]; df2 = df" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      withColumn takes the name of the new column first and a column expression second, and returns a new DataFrame with all the existing columns plus that column. selectExpr accepts SQL expressions, so "*" keeps every column and "Amount - Discount AS NetAmount" adds the calculated one.
    fr: |
      withColumn prend d'abord le nom de la nouvelle colonne, puis une expression de colonne, et renvoie un nouveau DataFrame avec toutes les colonnes existantes plus cette colonne. selectExpr accepte des expressions SQL : "*" conserve toutes les colonnes et "Amount - Discount AS NetAmount" ajoute la colonne calculée.
  options:
    a:
      en: |
        withColumnRenamed renames an existing column; it takes two column names, not an expression.
      fr: |
        withColumnRenamed renomme une colonne existante ; elle prend deux noms de colonnes, pas une expression.
    c:
      en: |
        The arguments are reversed; withColumn expects the column name first.
      fr: |
        Les arguments sont inversés ; withColumn attend d'abord le nom de la colonne.
    e:
      en: |
        Spark DataFrames are immutable and don't support item assignment like pandas DataFrames.
      fr: |
        Les DataFrames Spark sont immuables et ne prennent pas en charge l'affectation d'éléments comme les DataFrames pandas.
references:
