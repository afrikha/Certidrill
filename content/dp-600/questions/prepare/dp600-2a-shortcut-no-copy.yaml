id: dp600-2a-shortcut-no-copy
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application at Fabrikam writes Delta tables to an Azure Data Lake Storage Gen2 account named stdatalake. You have a Fabric lakehouse named LH-Analytics.

    Analysts must query the Delta tables through the SQL analytics endpoint of LH-Analytics. The data must not be copied to OneLake, and changes written by the application must be visible without any scheduled load.

    What should you do?
  fr: |
    Une application de Fabrikam écrit des tables Delta dans un compte Azure Data Lake Storage Gen2 nommé stdatalake. Vous disposez d'un lakehouse Fabric nommé LH-Analytics.

    Les analystes doivent interroger les tables Delta via le point de terminaison d'analytique SQL de LH-Analytics. Les données ne doivent pas être copiées dans OneLake, et les modifications écrites par l'application doivent être visibles sans aucun chargement planifié.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create ADLS Gen2 shortcuts in the Files section of LH-Analytics that point to the Delta table folders.", fr: "Créer des raccourcis ADLS Gen2 dans la section Files de LH-Analytics qui pointent vers les dossiers des tables Delta." } }
    - { id: b, text: { en: "Create a copy job that copies the tables incrementally from stdatalake to LH-Analytics.", fr: "Créer un travail de copie (Copy job) qui copie les tables de façon incrémentielle de stdatalake vers LH-Analytics." } }
    - { id: c, text: { en: "Create ADLS Gen2 shortcuts in the Tables section of LH-Analytics that point to the Delta table folders.", fr: "Créer des raccourcis ADLS Gen2 dans la section Tables de LH-Analytics qui pointent vers les dossiers des tables Delta." } }
    - { id: d, text: { en: "Create a pipeline with a Copy activity that runs every 15 minutes.", fr: "Créer un pipeline avec une activité Copy qui s'exécute toutes les 15 minutes." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A shortcut references the data where it is, so nothing is copied and every query reads the current files. A shortcut at the top level of the Tables section that points to Delta data is registered as a table automatically, and tables of the Tables section are readable through the SQL analytics endpoint.
    fr: |
      Un raccourci référence les données là où elles se trouvent : rien n'est copié et chaque requête lit les fichiers actuels. Un raccourci créé au premier niveau de la section Tables et qui pointe vers des données Delta est enregistré automatiquement comme table, et les tables de la section Tables sont lisibles via le point de terminaison d'analytique SQL.
  options:
    a:
      en: Shortcuts in the Files section are not discovered as tables, so the SQL analytics endpoint does not expose them.
      fr: "Les raccourcis de la section Files ne sont pas découverts comme tables : le point de terminaison d'analytique SQL ne les expose donc pas."
    b:
      en: A copy job copies the data into OneLake and runs on a schedule, which violates both requirements.
      fr: Un travail de copie copie les données dans OneLake et s'exécute selon une planification, ce qui enfreint les deux exigences.
    d:
      en: A Copy activity duplicates the data and only refreshes it at each scheduled run.
      fr: Une activité Copy duplique les données et ne les actualise qu'à chaque exécution planifiée.
references:
  - title: Unify Data Sources With OneLake Shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
