id: dp600-2b-scd-type-choice
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are designing a dimension table named DimCustomer in a Fabric warehouse. Customers can move to a different sales region several times.

    Reports must show each sale under the region the customer belonged to on the date of the sale, and also the current region of each customer.

    Which type of slowly changing dimension should you implement for the Region attribute?
  fr: |
    Vous concevez une table de dimension nommée DimCustomer dans un entrepôt Fabric. Les clients peuvent changer plusieurs fois de région commerciale.

    Les rapports doivent afficher chaque vente sous la région à laquelle appartenait le client à la date de la vente, ainsi que la région actuelle de chaque client.

    Quel type de dimension à variation lente devez-vous implémenter pour l'attribut Region ?
body:
  options:
    - { id: a, text: { en: "Type 1", fr: "Type 1" } }
    - { id: b, text: { en: "Type 2", fr: "Type 2" } }
    - { id: c, text: { en: "Type 3", fr: "Type 3" } }
answer: { optionId: b }
shuffle: false
explanation:
  correct:
    en: |
      An SCD type 2 adds a new row, with a new surrogate key, each time the region changes, and tracks validity dates and a current flag. Facts reference the version that was valid when they were loaded, so sales stay under their historical region, and the current flag identifies the current region.
    fr: |
      Une SCD de type 2 ajoute une nouvelle ligne, avec une nouvelle clé de substitution, à chaque changement de région, et suit des dates de validité et un indicateur de version actuelle. Les faits référencent la version valide au moment de leur chargement : les ventes restent sous leur région historique, et l'indicateur identifie la région actuelle.
  options:
    a:
      en: |
        Type 1 overwrites the region, so past sales move to the new region and history is lost.
      fr: |
        Le type 1 écrase la région : les ventes passées basculent vers la nouvelle région et l'historique est perdu.
    c:
      en: |
        Type 3 keeps only the previous value in an extra column, which can't represent several moves.
      fr: |
        Le type 3 ne conserve que la valeur précédente dans une colonne supplémentaire, ce qui ne permet pas de représenter plusieurs changements.
references:
  - title: Modeling Dimension Tables in Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
