id: dp600-2d-vqe-group-filter
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains tables named **dbo.DimCity** and **dbo.FactSale**. In a visual query, you merged DimCity with FactSale and expanded the Profit column. Each row of the result is one sale with its Country and Profit.

    You need the query to return one row per country with the total profit, only for the countries whose total profit is greater than 1,000,000.

    Which two steps should you add after the expand step? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient des tables nommées **dbo.DimCity** et **dbo.FactSale**. Dans une requête visuelle, vous avez fusionné DimCity avec FactSale et développé la colonne Profit. Chaque ligne du résultat est une vente avec son pays (Country) et son bénéfice (Profit).

    La requête doit renvoyer une ligne par pays avec le bénéfice total, uniquement pour les pays dont le bénéfice total est supérieur à 1 000 000.

    Quelles sont les deux étapes à ajouter après l'étape de développement ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A Filter rows step that keeps the rows whose Profit is greater than 1,000,000, placed before the grouping", fr: "Une étape Filtrer les lignes qui conserve les lignes dont Profit est supérieur à 1 000 000, placée avant le regroupement" } }
    - { id: b, text: { en: "A Group by step on Country with the Sum operation on Profit", fr: "Une étape Regrouper par sur Country avec l'opération Somme sur Profit" } }
    - { id: c, text: { en: "A Group by step on Country with the Count rows operation", fr: "Une étape Regrouper par sur Country avec l'opération Nombre de lignes" } }
    - { id: d, text: { en: "A Filter rows step that keeps the rows whose summed profit is greater than 1,000,000, placed after the grouping", fr: "Une étape Filtrer les lignes qui conserve les lignes dont le bénéfice additionné est supérieur à 1 000 000, placée après le regroupement" } }
    - { id: e, text: { en: "A Keep top rows step that keeps the first 1,000,000 rows", fr: "Une étape Conserver les premières lignes qui conserve les 1 000 000 premières lignes" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Group by on Country with Sum returns one row per country with its total profit. A Filter rows step placed after the grouping then works on the totals, like a HAVING clause in T-SQL, and keeps only the countries above 1,000,000.
    fr: |
      Regrouper par sur Country avec Somme renvoie une ligne par pays avec son bénéfice total. Une étape Filtrer les lignes placée après le regroupement porte alors sur les totaux, comme une clause HAVING en T-SQL, et ne conserve que les pays au-delà de 1 000 000.
  options:
    a: { en: "A filter before the grouping works on individual sales, so it keeps only the sales above 1,000,000 instead of filtering the country totals.", fr: "Un filtre avant le regroupement porte sur les ventes individuelles : il ne conserve que les ventes supérieures à 1 000 000 au lieu de filtrer les totaux par pays." }
    c: { en: "Count rows returns the number of sales, not the total profit.", fr: "Nombre de lignes renvoie le nombre de ventes, pas le bénéfice total." }
    e: { en: "Keep top rows keeps a number of rows; it doesn't filter on a value.", fr: "Conserver les premières lignes garde un nombre de lignes ; il ne filtre pas sur une valeur." }
references:
  - title: Grouping or summarizing rows
    url: https://learn.microsoft.com/en-us/power-query/group-by
  - title: Query using the visual query editor
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/visual-query-editor
