id: dp600-2a-ingest-methods
objective: "2.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is bringing several sources into Fabric. Each source has its own requirement.

    Which method should you use for each requirement? To answer, drag the appropriate methods to the correct requirements. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys amène plusieurs sources dans Fabric. Chaque source a son propre besoin.

    Quelle méthode devez-vous utiliser pour chaque besoin ? Pour répondre, faites glisser les méthodes appropriées vers les besoins correspondants. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mirror, text: { en: "Mirroring", fr: "Mise en miroir" } }
    - { id: copyjob, text: { en: "Copy job", fr: "Travail de copie (Copy job)" } }
    - { id: es, text: { en: "Eventstream", fr: "Flux d'événements (eventstream)" } }
    - { id: dfg2, text: Dataflow Gen2 }
    - { id: shortcut, text: { en: "OneLake shortcut", fr: "Raccourci OneLake" } }
    - { id: nb, text: Notebook }
  targets:
    - { id: t1, text: { en: "Replicate an Azure Cosmos DB database into OneLake continuously, with no ETL to build", fr: "Répliquer en continu une base de données Azure Cosmos DB dans OneLake, sans ETL à construire" } }
    - { id: t2, text: { en: "Ingest clickstream events from an Apache Kafka cluster continuously and filter them without code", fr: "Ingérer en continu des événements de parcours de navigation depuis un cluster Apache Kafka et les filtrer sans code" } }
    - { id: t3, text: { en: "Reshape Excel workbooks stored in SharePoint with Power Query and load them into a warehouse", fr: "Remodeler avec Power Query des classeurs Excel stockés dans SharePoint et les charger dans un entrepôt" } }
    - { id: t4, text: { en: "Copy the new and changed rows of Oracle tables every night by using a watermark column, without designing a pipeline", fr: "Copier chaque nuit les lignes nouvelles et modifiées de tables Oracle à l'aide d'une colonne de filigrane, sans concevoir de pipeline" } }
answer:
  mapping: { t1: mirror, t2: es, t3: dfg2, t4: copyjob }
explanation:
  correct:
    en: |
      Mirroring continuously replicates operational databases such as Azure Cosmos DB into OneLake with no pipeline to build. Eventstreams ingest events from sources such as Apache Kafka and apply no-code transformations such as Filter. Dataflow Gen2 is the Power Query experience and can load into a warehouse. A copy job handles scheduled incremental copies based on a watermark column from a wizard.
    fr: |
      La mise en miroir réplique en continu des bases opérationnelles comme Azure Cosmos DB dans OneLake, sans pipeline à construire. Les flux d'événements ingèrent des événements de sources comme Apache Kafka et appliquent des transformations sans code comme Filter. Dataflow Gen2 est l'expérience Power Query et peut charger dans un entrepôt. Un travail de copie gère, depuis un assistant, des copies incrémentielles planifiées basées sur une colonne de filigrane.
  options:
    shortcut:
      en: A shortcut references storage or Fabric items without copying; it doesn't replicate a database, transform data or ingest events.
      fr: Un raccourci référence du stockage ou des éléments Fabric sans copie ; il ne réplique pas de base de données, ne transforme pas de données et n'ingère pas d'événements.
    nb:
      en: A notebook could do these tasks with Spark code, but each requirement asks for a no-code or wizard-based method.
      fr: Un notebook pourrait réaliser ces tâches avec du code Spark, mais chaque besoin demande une méthode sans code ou guidée par un assistant.
references:
  - title: "Microsoft Fabric decision guide: Choose a data movement strategy"
    url: https://learn.microsoft.com/en-us/fabric/data-factory/decision-guide-data-movement
  - title: What is Mirroring in Fabric?
    url: https://learn.microsoft.com/en-us/fabric/mirroring/overview
