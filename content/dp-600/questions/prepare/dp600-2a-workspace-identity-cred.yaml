id: dp600-2a-workspace-identity-cred
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named LH1. You have an Azure Data Lake Storage Gen2 account named stmarketing in the same Microsoft Entra tenant as Fabric.

    You need to create the connection for an ADLS Gen2 shortcut in LH1 that points to stmarketing. The solution must meet the following requirements:

    - The credential must be managed by Fabric, with no secret or key to store or rotate.
    - The connection must not depend on the account of an employee.

    Which authentication kind should you use?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH1. Vous disposez d'un compte Azure Data Lake Storage Gen2 nommé stmarketing dans le même locataire Microsoft Entra que Fabric.

    Vous devez créer la connexion d'un raccourci ADLS Gen2 dans LH1 qui pointe vers stmarketing. La solution doit répondre aux exigences suivantes :

    - L'information d'identification doit être gérée par Fabric, sans secret ni clé à stocker ou à renouveler.
    - La connexion ne doit pas dépendre du compte d'un employé.

    Quel type d'authentification devez-vous utiliser ?
body:
  options:
    - { id: a, text: Service principal }
    - { id: b, text: Workspace identity }
    - { id: c, text: Organizational account }
    - { id: d, text: Shared Access Signature (SAS) }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A workspace identity is a service principal that Fabric creates and manages for the workspace, including its credentials, so nobody stores or rotates a secret. It is one of the authentication kinds of ADLS Gen2 shortcuts and works within the same Microsoft Entra tenant; it needs a Storage Blob Data role on the account.
    fr: |
      Une identité d'espace de travail est un principal de service que Fabric crée et gère pour l'espace de travail, y compris ses informations d'identification : personne ne stocke ni ne renouvelle de secret. C'est l'un des types d'authentification des raccourcis ADLS Gen2, qui fonctionne dans le même locataire Microsoft Entra ; il a besoin d'un rôle Storage Blob Data sur le compte.
  options:
    a:
      en: A service principal that you register yourself needs a client secret or certificate that you store in the connection and rotate.
      fr: Un principal de service que vous inscrivez vous-même a besoin d'une clé secrète client ou d'un certificat que vous stockez dans la connexion et renouvelez.
    c:
      en: An organizational account ties the connection to the account of a person.
      fr: Un compte professionnel lie la connexion au compte d'une personne.
    d:
      en: A SAS token is a secret stored in the connection, and it expires.
      fr: Un jeton SAS est un secret stocké dans la connexion, et il expire.
