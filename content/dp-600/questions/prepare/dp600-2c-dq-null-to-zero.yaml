id: dp600-2c-dq-null-to-zero
objective: "2.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse that contains a table named **stg.Orders** with a nullable decimal column named **Discount**.

    You need an expression that returns 0 when Discount is null and returns the Discount value otherwise.

    Which two expressions should you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric qui contient une table nommée **stg.Orders** avec une colonne décimale acceptant Null nommée **Discount**.

    Vous avez besoin d'une expression qui renvoie 0 quand Discount est null et renvoie la valeur de Discount dans les autres cas.

    Quelles sont les deux expressions à utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`NULLIF(Discount, 0)`" }
    - { id: b, text: "`ISNULL(Discount, 0)`" }
    - { id: c, text: "`IIF(Discount = NULL, 0, Discount)`" }
    - { id: d, text: "`COALESCE(Discount, 0)`" }
    - { id: e, text: "`CASE WHEN Discount <> NULL THEN Discount ELSE 0 END`" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "ISNULL returns its second argument when the first is null, and COALESCE returns the first non-null argument. With Discount and 0, both return 0 for a null discount and the discount otherwise. ISNULL keeps the data type of its first argument, while COALESCE uses the type with the highest precedence, which is decimal in both cases here."
    fr: "ISNULL renvoie son second argument quand le premier est null, et COALESCE renvoie le premier argument non null. Avec Discount et 0, les deux renvoient 0 pour une remise null et la remise dans les autres cas. ISNULL conserve le type de son premier argument, alors que COALESCE utilise le type de priorité la plus élevée, ici décimal dans les deux cas."
  options:
    a: { en: "NULLIF returns null when Discount equals 0; it does the opposite of the requirement.", fr: "NULLIF renvoie null quand Discount vaut 0 ; il fait l'inverse de l'exigence." }
    c: { en: "Discount = NULL is never true, so IIF returns Discount, including the null values.", fr: "Discount = NULL n'est jamais vrai : IIF renvoie Discount, y compris les valeurs null." }
    e: { en: "Discount <> NULL is never true, so the CASE expression always returns 0.", fr: "Discount <> NULL n'est jamais vrai : l'expression CASE renvoie toujours 0." }
references:
  - title: COALESCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/coalesce-transact-sql
