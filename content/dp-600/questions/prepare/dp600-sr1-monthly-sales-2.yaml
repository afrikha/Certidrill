stem:
  en: You create a view grouped by product, year and month.
  fr: Vous créez une vue avec un regroupement par produit, année et mois.
body:
  solution:
    en: |
      You run the following statement in WH-Sales.

      ```sql
      CREATE VIEW dbo.MonthlyProductSales
      AS
      SELECT ProductKey,
             YEAR(OrderDate) AS SalesYear,
             MONTH(OrderDate) AS SalesMonth,
             SUM(Quantity) AS TotalQuantity,
             SUM(SalesAmount) AS TotalSalesAmount
      FROM dbo.FactSales
      GROUP BY ProductKey, YEAR(OrderDate), MONTH(OrderDate);
      ```
    fr: |
      Vous exécutez l'instruction suivante dans WH-Sales.

      ```sql
      CREATE VIEW dbo.MonthlyProductSales
      AS
      SELECT ProductKey,
             YEAR(OrderDate) AS SalesYear,
             MONTH(OrderDate) AS SalesMonth,
             SUM(Quantity) AS TotalQuantity,
             SUM(SalesAmount) AS TotalSalesAmount
      FROM dbo.FactSales
      GROUP BY ProductKey, YEAR(OrderDate), MONTH(OrderDate);
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      The view returns the right grain, but a view stores only its definition. Every query on dbo.MonthlyProductSales runs the `SELECT` again and aggregates dbo.FactSales at that moment, which breaks the second requirement.
    fr: |
      La vue renvoie le bon grain, mais une vue ne stocke que sa définition. Chaque requête sur dbo.MonthlyProductSales réexécute le `SELECT` et agrège dbo.FactSales à ce moment-là, ce qui enfreint la deuxième exigence.
