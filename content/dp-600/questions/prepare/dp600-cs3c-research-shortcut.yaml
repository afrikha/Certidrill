id: dp600-cs3c-research-shortcut
objective: "2.1.3"
type: single
caseStudy: dp600-cs3c-graphic-design-institute
difficulty: 2
status: draft
stem:
  en: |
    You need to make the Trey Research files available in LH-Campus. The solution must meet requirement 6.

    What should you do?
  fr: |
    Vous devez rendre les fichiers de Trey Research disponibles dans LH-Campus. La solution doit satisfaire l'exigence 6.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon S3 shortcut in the Files section of LH-Campus, and enable shortcut caching in the OneLake settings of GDI-Analytics.", fr: "Créer un raccourci Amazon S3 dans la section Files de LH-Campus, et activer la mise en cache des raccourcis dans les paramètres OneLake de GDI-Analytics." } }
    - { id: b, text: { en: "Create an Amazon S3 shortcut in the Files section of LH-Campus, and keep the default OneLake settings of GDI-Analytics.", fr: "Créer un raccourci Amazon S3 dans la section Files de LH-Campus, et conserver les paramètres OneLake par défaut de GDI-Analytics." } }
    - { id: c, text: { en: "Create an Amazon S3 shortcut in the Tables section of LH-Campus that points to the folder of the Parquet files.", fr: "Créer un raccourci Amazon S3 dans la section Tables de LH-Campus qui pointe vers le dossier des fichiers Parquet." } }
    - { id: d, text: { en: "Create a copy job that copies the new files of the bucket to the Files section of LH-Campus every week.", fr: "Créer un copy job qui copie chaque semaine les nouveaux fichiers du compartiment vers la section Files de LH-Campus." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A shortcut in the Files section can point to data in any format without copying it. With shortcut caching enabled in the workspace OneLake settings, files read through an S3 shortcut are kept in a cache for 1 to 28 days, so the repeated reads of the data scientists do not leave AWS again; files of up to 1 GB, such as these, are cached.
    fr: |
      Un raccourci dans la section Files peut pointer vers des données de n'importe quel format sans les copier. Avec la mise en cache des raccourcis activée dans les paramètres OneLake de l'espace de travail, les fichiers lus via un raccourci S3 sont conservés dans un cache pendant 1 à 28 jours : les lectures répétées des data scientists ne sortent plus d'AWS ; les fichiers de 1 Go au plus, comme ceux-ci, sont mis en cache.
  options:
    b: { en: "Without the cache, every read goes to Amazon S3 and incurs egress costs again.", fr: "Sans le cache, chaque lecture va jusqu'à Amazon S3 et engendre de nouveau des coûts de sortie." }
    c: { en: "A shortcut in the Tables section must point to a Delta table or a schema of Delta tables, not to plain Parquet files, and it would still not reduce egress.", fr: "Un raccourci dans la section Tables doit pointer vers une table Delta ou un schéma de tables Delta, pas vers de simples fichiers Parquet, et il ne réduirait toujours pas la sortie de données." }
    d: { en: "A copy job is a scheduled copy process, which the requirement forbids.", fr: "Un copy job est un processus de copie planifié, ce que l'exigence interdit." }
references:
  - title: Unify Data Sources With OneLake Shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
