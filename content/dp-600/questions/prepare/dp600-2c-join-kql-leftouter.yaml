id: dp600-2c-join-kql-leftouter
objective: "2.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a KQL database that contains a table named **DeviceEvents** (Timestamp, DeviceId, EventType) and a table named **Devices** (Id, Model). A device usually sends many events, and some events come from devices that aren't in Devices yet.

    You need a query that returns every event of the last day, with the model of the device when it is known.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données KQL qui contient une table nommée **DeviceEvents** (Timestamp, DeviceId, EventType) et une table nommée **Devices** (Id, Model). Un appareil envoie généralement de nombreux événements, et certains événements proviennent d'appareils qui ne figurent pas encore dans Devices.

    Vous avez besoin d'une requête qui renvoie tous les événements du dernier jour, avec le modèle de l'appareil quand il est connu.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    DeviceEvents
    | where Timestamp > ago(1d)
    | join kind=[[kind]] (Devices) on [[cond]]
    | project Timestamp, DeviceId, EventType, Model
  slots:
    - id: kind
      options:
        - { id: leftouter, text: leftouter }
        - { id: innerunique, text: innerunique }
        - { id: inner, text: inner }
        - { id: leftsemi, text: leftsemi }
        - { id: leftanti, text: leftanti }
    - id: cond
      options:
        - { id: dollar, text: "$left.DeviceId == $right.Id" }
        - { id: plain, text: DeviceId == Id }
        - { id: single, text: "$left.DeviceId = $right.Id" }
answer:
  values: { kind: leftouter, cond: dollar }
explanation:
  correct:
    en: "`kind=leftouter` returns every row of the left table (the events) and the matching columns of Devices, with empty values when no device matches. When the key columns have different names, the condition uses `$left` and `$right` with the `==` operator."
    fr: "`kind=leftouter` renvoie toutes les lignes de la table de gauche (les événements) et les colonnes correspondantes de Devices, avec des valeurs vides quand aucun appareil ne correspond. Quand les colonnes clés ont des noms différents, la condition utilise `$left` et `$right` avec l'opérateur `==`."
  options:
    innerunique: { en: "innerunique, the default flavor, deduplicates the left rows on the key and drops unmatched events, so many events would be lost.", fr: "innerunique, le type par défaut, déduplique les lignes de gauche sur la clé et supprime les événements sans correspondance : de nombreux événements seraient perdus." }
    inner: { en: "inner drops the events of devices that aren't in Devices.", fr: "inner supprime les événements des appareils absents de Devices." }
    leftsemi: { en: "leftsemi returns only the matching events, without the Model column.", fr: "leftsemi ne renvoie que les événements avec correspondance, sans la colonne Model." }
    leftanti: { en: "leftanti returns only the events without a matching device.", fr: "leftanti ne renvoie que les événements sans appareil correspondant." }
    plain: { en: "Without $left and $right, the columns of the two tables can't be told apart in the join condition.", fr: "Sans $left et $right, les colonnes des deux tables ne peuvent pas être distinguées dans la condition de jointure." }
    single: { en: "KQL compares values with ==; a single = isn't a comparison operator.", fr: "KQL compare les valeurs avec == ; un seul = n'est pas un opérateur de comparaison." }
references:
  - title: join operator
    url: https://learn.microsoft.com/en-us/kusto/query/join-operator
