id: dp600-2c-dq-source-priority
objective: "2.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric warehouse named **WH1** that contains a staging table named **stg.Customer**. The table combines customers from two systems and has the columns CustomerID, SourceSystem, CustomerName and Email. SourceSystem is either **CRM** or **ERP**, and each system provides at most one row per CustomerID.

    You need a query that returns one row per CustomerID. When both systems provide the customer, the CRM row must be kept.

    Which clause should you add to `SELECT * FROM stg.Customer`?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé **WH1** qui contient une table de préproduction nommée **stg.Customer**. La table combine les clients de deux systèmes et possède les colonnes CustomerID, SourceSystem, CustomerName et Email. SourceSystem vaut **CRM** ou **ERP**, et chaque système fournit au plus une ligne par CustomerID.

    Vous avez besoin d'une requête qui renvoie une ligne par CustomerID. Quand les deux systèmes fournissent le client, la ligne CRM doit être conservée.

    Quelle clause devez-vous ajouter à `SELECT * FROM stg.Customer` ?
body:
  options:
    - id: a
      text: "`QUALIFY ROW_NUMBER() OVER (PARTITION BY CustomerID ORDER BY CASE WHEN SourceSystem = 'CRM' THEN 1 ELSE 2 END) = 1`"
    - id: b
      text: "`QUALIFY ROW_NUMBER() OVER (PARTITION BY SourceSystem ORDER BY CustomerID) = 1`"
    - id: c
      text: "`WHERE ROW_NUMBER() OVER (PARTITION BY CustomerID ORDER BY CASE WHEN SourceSystem = 'CRM' THEN 1 ELSE 2 END) = 1`"
    - id: d
      text: "`QUALIFY ROW_NUMBER() OVER (PARTITION BY CustomerID ORDER BY SourceSystem DESC) = 1`"
answer: { optionId: a }
explanation:
  correct:
    en: "ROW_NUMBER restarts at 1 for each CustomerID partition, and the CASE expression ranks the CRM row first. QUALIFY, which Fabric Data Warehouse supports, filters on the result of the window function without a subquery, so one row per customer is kept, the CRM one when it exists."
    fr: "ROW_NUMBER recommence à 1 pour chaque partition CustomerID, et l'expression CASE classe la ligne CRM en premier. QUALIFY, que Fabric Data Warehouse prend en charge, filtre sur le résultat de la fonction de fenêtrage sans sous-requête : une ligne par client est conservée, la ligne CRM quand elle existe."
  options:
    b: { en: "Partitioning by SourceSystem returns one row per system, not one row per customer.", fr: "Partitionner par SourceSystem renvoie une ligne par système, pas une ligne par client." }
    c: { en: "Window functions can't be used in a WHERE clause; WHERE is evaluated before them.", fr: "Les fonctions de fenêtrage ne peuvent pas être utilisées dans une clause WHERE ; WHERE est évalué avant elles." }
    d: { en: "In descending order, ERP sorts before CRM, so the ERP row would be kept.", fr: "En ordre décroissant, ERP est trié avant CRM : la ligne ERP serait conservée." }
references:
  - title: ROW_NUMBER (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/row-number-transact-sql
  - title: T-SQL surface area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
