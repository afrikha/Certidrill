id: dp600-2b-eh-table-level
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains an eventhouse named EH1. EH1 contains a KQL database named KQLDB1 that has 25 tables.

    Data engineers need to read the existing data of one table named Telemetry from Spark notebooks, as a Delta table in OneLake. The other tables must not be written to OneLake.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un eventhouse nommé EH1. EH1 contient une base de données KQL nommée KQLDB1 qui comporte 25 tables.

    Les ingénieurs Données doivent lire les données existantes d'une table nommée Telemetry depuis des notebooks Spark, sous forme de table Delta dans OneLake. Les autres tables ne doivent pas être écrites dans OneLake.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn on OneLake availability for KQLDB1 and select Apply to existing tables.", fr: "Activer la disponibilité OneLake pour KQLDB1 et sélectionner Apply to existing tables." } }
    - { id: b, text: { en: "Turn on OneLake availability for the Telemetry table only.", fr: "Activer la disponibilité OneLake pour la seule table Telemetry." } }
    - { id: c, text: { en: "Turn on OneLake availability for KQLDB1 without selecting Apply to existing tables.", fr: "Activer la disponibilité OneLake pour KQLDB1 sans sélectionner Apply to existing tables." } }
    - { id: d, text: { en: "In KQLDB1, create a OneLake shortcut that points to the Tables folder of a lakehouse.", fr: "Dans KQLDB1, créer un raccourci OneLake qui pointe vers le dossier Tables d'un lakehouse." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      OneLake availability can be turned on for a whole KQL database or for a single table. Turned on at the table level, only that table and its data are written to OneLake as Delta Parquet files, which meets the requirement for Telemetry and leaves the 24 other tables out.
    fr: |
      La disponibilité OneLake peut être activée pour toute une base de données KQL ou pour une seule table. Activée au niveau de la table, seules cette table et ses données sont écrites dans OneLake sous forme de fichiers Delta Parquet, ce qui satisfait l'exigence pour Telemetry et laisse de côté les 24 autres tables.
  options:
    a:
      en: |
        At the database level with Apply to existing tables, all 25 tables, with their history, are written to OneLake.
      fr: |
        Au niveau de la base de données avec Apply to existing tables, les 25 tables et leur historique sont écrites dans OneLake.
    c:
      en: |
        At the database level without Apply to existing tables, only the tables created later are made available, so the existing Telemetry table is not.
      fr: |
        Au niveau de la base de données sans Apply to existing tables, seules les tables créées ensuite sont rendues disponibles ; la table Telemetry existante ne l'est pas.
    d:
      en: |
        A shortcut in KQLDB1 lets KQL queries read lakehouse data; it does not expose Telemetry to Spark.
      fr: |
        Un raccourci dans KQLDB1 permet aux requêtes KQL de lire les données d'un lakehouse ; il n'expose pas Telemetry à Spark.
references:
  - title: Turn on OneLake availability for an eventhouse
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-house-onelake-availability
