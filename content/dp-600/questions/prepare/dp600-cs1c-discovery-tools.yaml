id: dp600-cs1c-discovery-tools
objective: "2.1.2"
type: dragdrop
caseStudy: dp600-cs1c-litware-energy
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a Fabric experience for each task of the analysts. Which experience should you recommend for each task? To answer, drag the appropriate experiences to the correct tasks. Each experience may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une expérience Fabric pour chaque tâche des analystes. Quelle expérience devez-vous recommander pour chaque tâche ? Pour répondre, faites glisser les expériences appropriées vers les tâches correctes. Chaque expérience peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: rth, text: Real-Time hub }
    - { id: catalog, text: { en: "OneLake catalog", fr: "Catalogue OneLake" } }
    - { id: monitor, text: { en: "Monitoring hub", fr: "Hub de surveillance" } }
    - { id: pipelines, text: { en: "Deployment pipelines", fr: "Pipelines de déploiement" } }
  targets:
    - { id: t1, text: { en: "Find the data streams of ES_Meters and the KQL tables they can access from a tenant-wide view", fr: "Trouver les flux de données de ES_Meters et les tables KQL auxquelles ils ont accès depuis une vue à l'échelle du locataire" } }
    - { id: t2, text: { en: "Find and explore lakehouses, warehouses and semantic models such as LH_Customers across the workspaces they can access", fr: "Trouver et explorer des lakehouses, des entrepôts et des modèles sémantiques comme LH_Customers dans les espaces de travail auxquels ils ont accès" } }
    - { id: t3, text: { en: "Subscribe to OneLake events raised when files change in LH_Customers", fr: "S'abonner aux événements OneLake déclenchés quand des fichiers changent dans LH_Customers" } }
answer:
  mapping: { t1: rth, t2: catalog, t3: rth }
explanation:
  correct:
    en: Real-Time hub is the tenant-wide catalog of data in motion; it lists the data streams of running eventstreams, the KQL tables that the user can access, and Fabric events such as OneLake events, which you can subscribe to. The OneLake catalog (Explore tab) is where users find and explore Fabric items such as lakehouses, warehouses and semantic models.
    fr: Le Real-Time hub est le catalogue des données en mouvement à l'échelle du locataire ; il liste les flux de données des eventstreams en cours d'exécution, les tables KQL auxquelles l'utilisateur a accès et les événements Fabric comme les événements OneLake, auxquels vous pouvez vous abonner. Le catalogue OneLake (onglet Explore) est l'endroit où les utilisateurs trouvent et explorent des éléments Fabric comme les lakehouses, les entrepôts et les modèles sémantiques.
  options:
    monitor:
      en: The Monitoring hub shows the runs and status of Fabric activities such as pipeline and notebook runs; it is not a data discovery catalog.
      fr: Le hub de surveillance affiche les exécutions et l'état des activités Fabric, comme les exécutions de pipelines et de notebooks ; ce n'est pas un catalogue de découverte des données.
    pipelines:
      en: Deployment pipelines move content between development, test and production stages; they do not catalog data.
      fr: Les pipelines de déploiement font passer du contenu entre les phases de développement, de test et de production ; ils ne cataloguent pas de données.
references:
  - title: Introduction to Fabric Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/real-time-hub-overview
  - title: OneLake catalog overview
    url: https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-overview
