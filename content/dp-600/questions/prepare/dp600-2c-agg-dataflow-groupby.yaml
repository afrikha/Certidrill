id: dp600-2c-agg-dataflow-groupby
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Dataflow Gen2 that contains a query named **Sales** with the columns StoreID, ProductID, OrderID and Amount.

    You need the query to return one row per store and product, with the total amount and the number of rows of each group. The solution must not require any code.

    What should you do?
  fr: |
    Vous disposez d'un Dataflow Gen2 qui contient une requête nommée **Sales** avec les colonnes StoreID, ProductID, OrderID et Amount.

    La requête doit renvoyer une ligne par magasin et par produit, avec le montant total et le nombre de lignes de chaque groupe. La solution ne doit nécessiter aucun code.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Use Group by with the Advanced option, group by StoreID and ProductID, and add Sum and Count rows aggregations.", fr: "Utiliser Grouper par avec l'option Avancé, regrouper par StoreID et ProductID, puis ajouter les agrégations Somme et Compter les lignes." }
    - id: b
      text: { en: "Use Pivot column on the StoreID column, select Amount as the values column, and keep the Sum aggregate.", fr: "Utiliser Colonne pivot sur la colonne StoreID, sélectionner Amount comme colonne de valeurs, et conserver l'agrégation Somme." }
    - id: c
      text: { en: "Merge the Sales query with itself on StoreID and ProductID, and aggregate the new nested table column.", fr: "Fusionner la requête Sales avec elle-même sur StoreID et ProductID, puis agréger la nouvelle colonne de tables imbriquées." }
    - id: d
      text: { en: "Use Remove duplicates on the StoreID and ProductID columns, and then add an index column.", fr: "Utiliser Supprimer les doublons sur les colonnes StoreID et ProductID, puis ajouter une colonne d'index." }
answer: { optionId: a }
explanation:
  correct:
    en: "The Advanced option of the Group by dialog lets you group by several columns and add several aggregations, here Sum of Amount and Count rows. The result has one row per StoreID and ProductID combination."
    fr: "L'option Avancé de la boîte de dialogue Grouper par permet de regrouper par plusieurs colonnes et d'ajouter plusieurs agrégations, ici Somme de Amount et Compter les lignes. Le résultat contient une ligne par combinaison de StoreID et de ProductID."
  options:
    b: { en: "Pivot column creates one column per store, which doesn't give one row per store and product with a row count.", fr: "Colonne pivot crée une colonne par magasin, ce qui ne donne pas une ligne par magasin et par produit avec un nombre de lignes." }
    c: { en: "Aggregating a merged column isn't available in Power Query Online, and a self-merge doesn't reduce the rows.", fr: "L'agrégation d'une colonne fusionnée n'est pas disponible dans Power Query Online, et une fusion d'une requête avec elle-même ne réduit pas les lignes." }
    d: { en: "Remove duplicates keeps one row per combination but loses the total amount and the row count.", fr: "Supprimer les doublons conserve une ligne par combinaison mais perd le montant total et le nombre de lignes." }
references:
  - title: Grouping or summarizing rows
    url: https://learn.microsoft.com/en-us/power-query/group-by
