id: dp600-2d-sql-query-statements
objective: "2.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a warehouse named **Warehouse1** and a lakehouse named **Lakehouse1**. You write T-SQL queries in the SQL query editor of Warehouse1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un entrepôt nommé **Warehouse1** et un lakehouse nommé **Lakehouse1**. Vous écrivez des requêtes T-SQL dans l'éditeur de requête SQL de Warehouse1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In Warehouse1, GROUP BY ALL groups the rows by every expression of the SELECT list that isn't inside an aggregate function.
        fr: Dans Warehouse1, GROUP BY ALL regroupe les lignes selon chaque expression de la liste SELECT qui ne figure pas dans une fonction d'agrégation.
    - id: s2
      text:
        en: A query in Warehouse1 can join a table of Warehouse1 with a table of Lakehouse1 by referencing Lakehouse1.dbo.TableName.
        fr: Une requête dans Warehouse1 peut joindre une table de Warehouse1 à une table de Lakehouse1 en référençant Lakehouse1.dbo.TableName.
    - id: s3
      text:
        en: SELECT TOP (5) without an ORDER BY clause returns the five rows with the highest values in the first column of the SELECT list.
        fr: SELECT TOP (5) sans clause ORDER BY renvoie les cinq lignes qui ont les valeurs les plus élevées dans la première colonne de la liste SELECT.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      In Fabric Data Warehouse, GROUP BY ALL is a shortcut that groups by all the non-aggregated expressions of the SELECT list. Cross-database queries use three-part names to reach the warehouses and SQL analytics endpoints of the same workspace. Without ORDER BY, TOP returns rows in an undefined order, so ORDER BY is the only way to choose which rows are returned.
    fr: |
      Dans Fabric Data Warehouse, GROUP BY ALL est un raccourci qui regroupe selon toutes les expressions non agrégées de la liste SELECT. Les requêtes entre bases utilisent des noms en trois parties pour atteindre les entrepôts et points de terminaison d'analytique SQL du même espace de travail. Sans ORDER BY, TOP renvoie des lignes dans un ordre non défini : ORDER BY est le seul moyen de choisir les lignes renvoyées.
references:
  - title: SELECT - GROUP BY clause (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-group-by-transact-sql
  - title: TOP (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/top-transact-sql
