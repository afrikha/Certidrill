id: dp600-2c-agg-weighted-price
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a lakehouse named **LH1** that contains a table named **silver_sales** with one row per order line. Each row has **ProductID**, **OrderDate**, **Quantity**, **UnitPrice** and **SalesAmount**, where SalesAmount = Quantity x UnitPrice.

    A gold table named **gold_daily_product** stores one row per product per day with the average of UnitPrice. Monthly reports average these daily values, and the results differ from the quantity-weighted average price computed from silver_sales.

    You need to change gold_daily_product so that reports can compute the correct monthly quantity-weighted average price from it, without reading silver_sales.

    Which columns should gold_daily_product store?
  fr: |
    Vous disposez d'un lakehouse nommé **LH1** qui contient une table nommée **silver_sales** avec une ligne par ligne de commande. Chaque ligne possède **ProductID**, **OrderDate**, **Quantity**, **UnitPrice** et **SalesAmount**, avec SalesAmount = Quantity x UnitPrice.

    Une table gold nommée **gold_daily_product** stocke une ligne par produit et par jour avec la moyenne de UnitPrice. Les rapports mensuels font la moyenne de ces valeurs quotidiennes, et les résultats diffèrent du prix moyen pondéré par la quantité calculé à partir de silver_sales.

    Vous devez modifier gold_daily_product pour que les rapports puissent en tirer le prix moyen mensuel pondéré par la quantité correct, sans lire silver_sales.

    Quelles colonnes gold_daily_product doit-elle stocker ?
body:
  options:
    - id: a
      text: { en: "The average of UnitPrice and the number of order lines", fr: "La moyenne de UnitPrice et le nombre de lignes de commande" }
    - id: b
      text: { en: "The sum of SalesAmount and the sum of Quantity", fr: "La somme de SalesAmount et la somme de Quantity" }
    - id: c
      text: { en: "The average of UnitPrice and the sum of Quantity", fr: "La moyenne de UnitPrice et la somme de Quantity" }
    - id: d
      text: { en: "The minimum and the maximum of UnitPrice", fr: "Le minimum et le maximum de UnitPrice" }
answer: { optionId: b }
explanation:
  correct:
    en: "A ratio isn't additive, so Learn recommends storing its components instead. The sums of SalesAmount and Quantity are additive across days: summing each over the month and dividing the first by the second gives the exact quantity-weighted average price."
    fr: "Un ratio n'est pas additif : Learn recommande d'en stocker plutôt les composants. Les sommes de SalesAmount et de Quantity sont additives d'un jour à l'autre : en additionnant chacune sur le mois puis en divisant la première par la seconde, on obtient le prix moyen exact pondéré par la quantité."
  options:
    a: { en: "Average price times line count rebuilds the sum of unit prices, which gives an average per line, not weighted by quantity.", fr: "Le prix moyen multiplié par le nombre de lignes reconstitue la somme des prix unitaires, ce qui donne une moyenne par ligne, non pondérée par la quantité." }
    c: { en: "The daily average price isn't weighted by quantity, so combining it with the quantity can't rebuild the monthly revenue.", fr: "Le prix moyen quotidien n'est pas pondéré par la quantité : le combiner avec la quantité ne permet pas de reconstituer le chiffre d'affaires mensuel." }
    d: { en: "The minimum and maximum give the price range, not an average.", fr: "Le minimum et le maximum donnent la fourchette des prix, pas une moyenne." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Fact tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-fact-tables
