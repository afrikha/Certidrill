id: dp600-2b-sm-rls-access
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a semantic model named SM-HR in a Fabric workspace named WS-HR. OneLake integration is turned on for SM-HR, and the model defines row-level security (RLS) roles that must stay in place.

    A group named HR-Analysts has Read and Build permissions on SM-HR, is a member of one RLS role, and has no workspace role in WS-HR. HR-Analysts must be able to read the Delta tables that SM-HR exports to OneLake. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique nommé SM-HR dans un espace de travail Fabric nommé WS-HR. L'intégration OneLake est activée pour SM-HR, et le modèle définit des rôles de sécurité au niveau des lignes (RLS) qui doivent être conservés.

    Un groupe nommé HR-Analysts dispose des autorisations Read et Build sur SM-HR, est membre d'un rôle RLS et n'a aucun rôle d'espace de travail dans WS-HR. HR-Analysts doit pouvoir lire les tables Delta que SM-HR exporte dans OneLake. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add HR-Analysts to the Member role of WS-HR.", fr: "Ajouter HR-Analysts au rôle Member de WS-HR." } }
    - { id: b, text: { en: "Grant HR-Analysts the Reshare permission on SM-HR.", fr: "Accorder à HR-Analysts l'autorisation Reshare sur SM-HR." } }
    - { id: c, text: { en: "Grant HR-Analysts the Write permission on SM-HR.", fr: "Accorder à HR-Analysts l'autorisation Write sur SM-HR." } }
    - { id: d, text: { en: "Add HR-Analysts to every RLS role of SM-HR.", fr: "Ajouter HR-Analysts à tous les rôles RLS de SM-HR." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When a model has RLS or OLS roles, only users with write access to the model can read its exported data in OneLake; without such roles, Read and Build would be enough. Workspace Admins, Members and Contributors also get access, but the Write permission on SM-HR alone grants it without rights on the other items of WS-HR.
    fr: |
      Quand un modèle a des rôles RLS ou OLS, seuls les utilisateurs disposant de l'accès en écriture au modèle peuvent lire ses données exportées dans OneLake ; sans ces rôles, Read et Build suffiraient. Les rôles Admin, Member et Contributor de l'espace de travail donnent aussi l'accès, mais l'autorisation Write sur SM-HR seule l'accorde sans droits sur les autres éléments de WS-HR.
  options:
    a:
      en: |
        The Member role grants access, but on every item of WS-HR, which is more than required.
      fr: |
        Le rôle Member donne l'accès, mais sur tous les éléments de WS-HR, ce qui dépasse le besoin.
    b:
      en: |
        Reshare lets users share the model with others; it is not write access, so the exported tables stay unreadable.
      fr: |
        Reshare permet de partager le modèle avec d'autres ; ce n'est pas un accès en écriture, donc les tables exportées restent illisibles.
    d:
      en: |
        RLS roles filter DAX queries on the model; they don't grant access to the exported Delta tables, which require write access when roles exist.
      fr: |
        Les rôles RLS filtrent les requêtes DAX sur le modèle ; ils ne donnent pas accès aux tables Delta exportées, qui exigent l'accès en écriture lorsque des rôles existent.
references:
  - title: Learn about Microsoft OneLake Delta table integration in Power BI and Microsoft Fabric
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/onelake-integration-overview
