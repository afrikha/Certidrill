id: dp600-2c-join-merge-no-match
objective: "2.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Dataflow Gen2 that merges a query named **Orders** with a query named **Customers** on a customer identifier by using a left outer join. Fuzzy matching isn't enabled. After you expand the merged column, many orders have null customer values, although their customers exist in the Customers query.

    Which two issues could cause this result?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un Dataflow Gen2 qui fusionne une requête nommée **Orders** avec une requête nommée **Customers** sur un identifiant de client, avec une jointure externe gauche. La correspondance approximative n'est pas activée. Après le développement de la colonne fusionnée, de nombreuses commandes ont des valeurs de client null, alors que leurs clients existent dans la requête Customers.

    Quels sont les deux problèmes qui pourraient provoquer ce résultat ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: b, text: { en: "The identifier column is named CustomerID in Orders and CustID in Customers.", fr: "La colonne d'identifiant s'appelle CustomerID dans Orders et CustID dans Customers." } }
    - { id: a, text: { en: "The identifier is a Text column in Orders and a Whole number column in Customers.", fr: "L'identifiant est une colonne de type Texte dans Orders et Nombre entier dans Customers." } }
    - { id: c, text: { en: "Some identifier values differ only by letter case, such as c-100 and C-100.", fr: "Certaines valeurs d'identifiant ne diffèrent que par la casse, comme c-100 et C-100." } }
    - { id: d, text: { en: "The Customers query contains more rows than the Orders query.", fr: "La requête Customers contient plus de lignes que la requête Orders." } }
    - { id: e, text: { en: "The merge uses a left outer join instead of an inner join.", fr: "La fusion utilise une jointure externe gauche au lieu d'une jointure interne." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "The matching columns must have the same data type, or the merge might not return correct results. Without fuzzy matching, Power Query compares values exactly and is case-sensitive, so c-100 doesn't match C-100."
    fr: "Les colonnes de correspondance doivent avoir le même type de données, sinon la fusion risque de ne pas renvoyer des résultats corrects. Sans correspondance approximative, Power Query compare les valeurs exactement et respecte la casse : c-100 ne correspond pas à C-100."
  options:
    b: { en: "The column names don't need to match; you select the matching columns in each query.", fr: "Les noms de colonnes n'ont pas besoin d'être identiques ; vous sélectionnez les colonnes de correspondance dans chaque requête." }
    d: { en: "The number of rows of the right table doesn't prevent matches.", fr: "Le nombre de lignes de la table de droite n'empêche pas les correspondances." }
    e: { en: "A left outer join keeps every order and still returns the matching customers; an inner join would only drop the unmatched orders.", fr: "Une jointure externe gauche conserve toutes les commandes et renvoie toujours les clients correspondants ; une jointure interne ne ferait que supprimer les commandes sans correspondance." }
references:
  - title: Merge queries overview
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-overview
  - title: Working with duplicate values
    url: https://learn.microsoft.com/en-us/power-query/working-with-duplicates
