id: dp600-2b-eh-accelerate-shortcut
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a KQL database named KQLDB1 and a lakehouse named Lakehouse1. Lakehouse1 contains a Delta table named SalesHistory that stores three years of data. KQLDB1 contains a OneLake shortcut named SalesHistory that points to the table.

    Real-Time dashboards run KQL queries that join the shortcut with streaming data, and they only use the last 30 days of SalesHistory. The queries are slow. You need to improve query performance. The solution must not require a pipeline or a notebook that copies data, and it must minimize administrative effort.

    What should you do?
  fr: |
    Vous disposez d'une base de données KQL nommée KQLDB1 et d'un lakehouse nommé Lakehouse1. Lakehouse1 contient une table Delta nommée SalesHistory qui stocke trois ans de données. KQLDB1 contient un raccourci OneLake nommé SalesHistory qui pointe vers cette table.

    Des tableaux de bord en temps réel exécutent des requêtes KQL qui joignent le raccourci à des données de streaming, et ils n'utilisent que les 30 derniers jours de SalesHistory. Les requêtes sont lentes. Vous devez améliorer les performances des requêtes. La solution ne doit nécessiter ni pipeline ni notebook qui copie des données, et elle doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn on OneLake availability for KQLDB1.", fr: "Activer la disponibilité OneLake pour KQLDB1." } }
    - { id: b, text: { en: "Increase the caching policy of KQLDB1 to 30 days.", fr: "Porter la stratégie de mise en cache de KQLDB1 à 30 jours." } }
    - { id: c, text: { en: "Create a pipeline that ingests SalesHistory into a KQL table every hour.", fr: "Créer un pipeline qui ingère SalesHistory dans une table KQL toutes les heures." } }
    - { id: d, text: { en: "Turn on Query acceleration for the shortcut and set a 30-day caching period.", fr: "Activer Query acceleration pour le raccourci et définir une période de mise en cache de 30 jours." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Query acceleration applies a policy to the shortcut that caches and indexes the data of the last N days, measured from the modification time in the Delta log, so KQL queries on recent data run much faster without an ingestion process. For an existing shortcut, you turn it on in Manage > Data policies and enter the number of days to cache.
    fr: |
      L'accélération des requêtes applique au raccourci une stratégie qui met en cache et indexe les données des N derniers jours, mesurés à partir de l'heure de modification du journal Delta ; les requêtes KQL sur les données récentes sont alors bien plus rapides, sans processus d'ingestion. Pour un raccourci existant, vous l'activez dans Manage > Data policies et vous saisissez le nombre de jours à mettre en cache.
  options:
    a:
      en: |
        OneLake availability writes KQL tables to OneLake for other engines; it does not speed up KQL queries over a shortcut.
      fr: |
        La disponibilité OneLake écrit les tables KQL dans OneLake pour les autres moteurs ; elle n'accélère pas les requêtes KQL sur un raccourci.
    b:
      en: |
        The database caching period is only the default caching period of accelerated shortcuts; without query acceleration, shortcut data is not cached.
      fr: |
        La période de mise en cache de la base de données n'est que la valeur par défaut des raccourcis accélérés ; sans accélération des requêtes, les données du raccourci ne sont pas mises en cache.
    c:
      en: |
        An hourly pipeline copies the data and has to be built and monitored, which the requirements exclude.
      fr: |
        Un pipeline horaire copie les données et doit être créé et surveillé, ce que les exigences excluent.
references:
