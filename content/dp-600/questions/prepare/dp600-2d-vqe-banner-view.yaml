id: dp600-2d-vqe-banner-view
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1**. You create a visual query that filters and groups the rows of a table. After you add one more step, the editor displays a banner that says the query is not supported as a warehouse view because it can't be fully translated to SQL.

    You need to save the query as a view in Warehouse1.

    What should you do first?
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1**. Vous créez une requête visuelle qui filtre et regroupe les lignes d'une table. Après l'ajout d'une étape supplémentaire, l'éditeur affiche une bannière qui indique que la requête n'est pas prise en charge en tant que vue d'entrepôt, car elle ne peut pas être entièrement traduite en SQL.

    Vous devez enregistrer la requête en tant que vue dans Warehouse1.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Ask an administrator for permission to create objects in the dbo schema.", fr: "Demander à un administrateur l'autorisation de créer des objets dans le schéma dbo." } }
    - { id: b, text: { en: "Select Save as table instead of Save as view.", fr: "Sélectionner Enregistrer en tant que table au lieu de Enregistrer en tant que vue." } }
    - { id: c, text: { en: "Select Enable load on the source table of the query.", fr: "Sélectionner Activer le chargement sur la table source de la requête." } }
    - { id: d, text: { en: "Remove the step that you added last, or replace it with another operation.", fr: "Supprimer la dernière étape ajoutée, ou la remplacer par une autre opération." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A view is a saved T-SQL SELECT statement, so every step of the visual query must fold to SQL. The banner points to a step that can't be translated; removing it or replacing it with a foldable operation lets you save the view.
    fr: |
      Une vue est une instruction SELECT T-SQL enregistrée : chaque étape de la requête visuelle doit être repliée en SQL. La bannière signale une étape qui ne peut pas être traduite ; la supprimer ou la remplacer par une opération repliable permet d'enregistrer la vue.
  options:
    b: { en: "Save as table also relies on the generated SQL, through CREATE TABLE AS SELECT, and the requirement is a view.", fr: "Enregistrer en tant que table s'appuie aussi sur le SQL généré, via CREATE TABLE AS SELECT, et l'exigence porte sur une vue." }
    c: { en: "Enable load selects which query the SQL script represents; it doesn't make a step translatable.", fr: "Activer le chargement choisit la requête que représente le script SQL ; il ne rend pas une étape traduisible." }
    a: { en: "The banner reports a translation problem, not a missing permission.", fr: "La bannière signale un problème de traduction, pas une autorisation manquante." }
references:
  - title: Query using the visual query editor
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/visual-query-editor
  - title: Query folding indicators in Power Query
    url: https://learn.microsoft.com/en-us/power-query/step-folding-indicators
