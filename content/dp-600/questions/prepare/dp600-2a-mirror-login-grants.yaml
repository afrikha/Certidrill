id: dp600-2a-mirror-login-grants
objective: "2.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named sqldb-orders on a logical server whose system-assigned managed identity is enabled as the primary identity.

    You plan to mirror sqldb-orders to Fabric. The mirroring connection will use the Basic authentication kind with a SQL login named fabric_login, which already exists in the master database.

    You need to create the database user that the connection will use in sqldb-orders. The solution must follow the principle of least privilege.

    How should you complete the Transact-SQL script? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée sqldb-orders sur un serveur logique dont l'identité managée affectée par le système est activée comme identité principale.

    Vous prévoyez de mettre en miroir sqldb-orders dans Fabric. La connexion de mise en miroir utilisera le type d'authentification Basic avec une connexion SQL (login) nommée fabric_login, qui existe déjà dans la base de données master.

    Vous devez créer dans sqldb-orders l'utilisateur de base de données que la connexion utilisera. La solution doit respecter le principe du moindre privilège.

    Comment devez-vous compléter le script Transact-SQL ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE USER [fabric_user] [[link]] [fabric_login];

    GRANT SELECT, [[perm]],
          VIEW DATABASE PERFORMANCE STATE,
          VIEW DATABASE SECURITY STATE
    TO [fabric_user];
  slots:
    - id: link
      options:
        - { id: forlogin, text: FOR LOGIN }
        - { id: external, text: FROM EXTERNAL PROVIDER }
        - { id: without, text: WITHOUT LOGIN }
    - id: perm
      options:
        - { id: control, text: CONTROL }
        - { id: mirror, text: ALTER ANY EXTERNAL MIRROR }
        - { id: extds, text: ALTER ANY EXTERNAL DATA SOURCE }
        - { id: bulk, text: ADMINISTER DATABASE BULK OPERATIONS }
answer:
  values: { link: forlogin, perm: mirror }
explanation:
  correct:
    en: |
      The user is mapped to the existing SQL login with CREATE USER ... FOR LOGIN. Mirroring needs only SELECT, ALTER ANY EXTERNAL MIRROR, VIEW DATABASE PERFORMANCE STATE and VIEW DATABASE SECURITY STATE on the source database; ALTER ANY EXTERNAL MIRROR is the permission that lets Fabric manage the mirror.
    fr: |
      L'utilisateur est associé à la connexion SQL existante avec CREATE USER ... FOR LOGIN. La mise en miroir n'a besoin que de SELECT, ALTER ANY EXTERNAL MIRROR, VIEW DATABASE PERFORMANCE STATE et VIEW DATABASE SECURITY STATE sur la base de données source ; ALTER ANY EXTERNAL MIRROR est l'autorisation qui permet à Fabric de gérer le miroir.
  options:
    external: { en: "FROM EXTERNAL PROVIDER creates a user for a Microsoft Entra principal, not for a SQL login.", fr: "FROM EXTERNAL PROVIDER crée un utilisateur pour un principal Microsoft Entra, pas pour une connexion SQL." }
    without: { en: "A user without login cannot be used by a connection that signs in with fabric_login.", fr: "Un utilisateur sans connexion ne peut pas être utilisé par une connexion qui s'authentifie avec fabric_login." }
    control: { en: "CONTROL would work but grants far more than mirroring needs.", fr: "CONTROL fonctionnerait, mais accorde bien plus que ce dont la mise en miroir a besoin." }
    extds: { en: "This permission manages external data sources, not mirroring.", fr: "Cette autorisation gère les sources de données externes, pas la mise en miroir." }
    bulk: { en: "Bulk operations permissions are for bulk loads, not for mirroring.", fr: "L'autorisation d'opérations en bloc sert aux chargements en bloc, pas à la mise en miroir." }
references:
  - title: "Tutorial: Configure Microsoft Fabric mirrored databases from Azure SQL Database"
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-sql-database-tutorial
