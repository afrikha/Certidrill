id: dp600-sr1-inactive-customers-1
objective: "2.2.6"
type: series_yesno
series: dp600-sr1-inactive-customers
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You merge Customers with Orders by using a left outer join, and then filter on null order IDs.
  fr: Vous fusionnez Customers avec Orders par une jointure externe gauche, puis vous filtrez les identifiants de commande null.
body:
  solution:
    en: |
      You select the Customers query and select **Merge queries as new**. You select Orders as the second table, match the `CustomerID` columns, and select the **Left outer** join kind. In the new query, you expand only `OrderID` from the Orders column, keep the rows where `OrderID` is null, and then remove the `OrderID` column.
    fr: |
      Vous sélectionnez la requête Customers, puis **Requêtes de fusion en tant que nouvelles** (Merge queries as new). Vous sélectionnez Orders comme deuxième table, vous associez les colonnes `CustomerID` et vous choisissez le type de jointure **Jointure externe gauche** (Left outer). Dans la nouvelle requête, vous développez uniquement `OrderID` à partir de la colonne Orders, vous conservez les lignes où `OrderID` est null, puis vous supprimez la colonne `OrderID`.
answer: { value: true }
explanation:
  correct:
    en: |
      A left outer join keeps every row of Customers, the left table. After the expansion, a customer with orders gets one row per order with a value in `OrderID`, and a customer without orders gets a single row where `OrderID` is null, because `OrderID` is never null in Orders. Keeping the null rows and removing the column returns one row per customer without orders, with the Customers columns only.
    fr: |
      Une jointure externe gauche conserve toutes les lignes de Customers, la table de gauche. Après le développement, un client qui a des commandes obtient une ligne par commande avec une valeur dans `OrderID`, et un client sans commande obtient une seule ligne où `OrderID` est null, puisque `OrderID` n'est jamais null dans Orders. Conserver les lignes null et supprimer la colonne renvoie une ligne par client sans commande, avec uniquement les colonnes de Customers.
references:
  - title: Merge queries overview
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-overview
