id: dp600-2b-sm-statements
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Import semantic model named SM-Ops in a workspace on a Fabric F64 capacity. SM-Ops is refreshed every day at 06:00. You turn on OneLake integration for SM-Ops at 14:00.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique Import nommé SM-Ops dans un espace de travail sur une capacité Fabric F64. SM-Ops est actualisé chaque jour à 06:00. Vous activez l'intégration OneLake pour SM-Ops à 14:00.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Delta tables are written to OneLake only after SM-Ops is refreshed again, manually or by the schedule.", fr: "Les tables Delta ne sont écrites dans OneLake qu'après une nouvelle actualisation de SM-Ops, manuelle ou planifiée." } }
    - { id: b, text: { en: "Changes made in the sources during the day are written to OneLake within minutes, without a refresh.", fr: "Les modifications faites dans les sources pendant la journée sont écrites dans OneLake en quelques minutes, sans actualisation." } }
    - { id: c, text: { en: "The exported tables are stored in a lakehouse that you select when you turn on the feature.", fr: "Les tables exportées sont stockées dans un lakehouse que vous sélectionnez quand vous activez la fonctionnalité." } }
    - { id: d, text: { en: "Between two refreshes, the exported tables contain the data of the last successful refresh.", fr: "Entre deux actualisations, les tables exportées contiennent les données de la dernière actualisation réussie." } }
    - { id: e, text: { en: "Previous versions of the exported Delta tables are kept for 30 days for time travel.", fr: "Les versions précédentes des tables Delta exportées sont conservées 30 jours pour le voyage dans le temps." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      After you turn on OneLake integration, at least one manual or scheduled refresh must run before the Delta tables are written. The exported tables are then rewritten at each refresh and, in between, reflect the last successful refresh, so downstream consumers must follow the refresh cadence.
    fr: |
      Après l'activation de l'intégration OneLake, au moins une actualisation manuelle ou planifiée doit s'exécuter avant que les tables Delta soient écrites. Les tables exportées sont ensuite réécrites à chaque actualisation et reflètent, entre deux, la dernière actualisation réussie : les consommateurs en aval doivent suivre ce rythme.
  options:
    b:
      en: |
        Data is exported only when the model refreshes; the export doesn't follow the sources in real time.
      fr: |
        Les données ne sont exportées qu'à l'actualisation du modèle ; l'export ne suit pas les sources en temps réel.
    c:
      en: |
        The tables are written to the model's own folder in the workspace (ending in .SemanticModel); a lakehouse reads them through a shortcut.
      fr: |
        Les tables sont écrites dans le dossier du modèle dans l'espace de travail (qui se termine par .SemanticModel) ; un lakehouse les lit par un raccourci.
    e:
      en: |
        Old versions of the exported Delta tables are deleted after three days.
      fr: |
        Les anciennes versions des tables Delta exportées sont supprimées après trois jours.
references:
  - title: Learn about Microsoft OneLake Delta table integration in Power BI and Microsoft Fabric
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/onelake-integration-overview
