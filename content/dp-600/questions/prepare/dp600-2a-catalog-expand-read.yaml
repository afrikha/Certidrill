id: dp600-2a-catalog-expand-read
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace-Prod that contains 30 items, including a lakehouse named LH-Products. You have the Admin role in Workspace-Prod.

    User2 sees LH-Products in the Explore tab of the OneLake catalog. When User2 tries to expand LH-Products to browse its schemas and tables, a message states that User2 doesn't have the required permission.

    You need to ensure that User2 can browse the tables of LH-Products. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace-Prod qui contient 30 éléments, dont un lakehouse nommé LH-Products. Vous avez le rôle Admin dans Workspace-Prod.

    User2 voit LH-Products dans l'onglet Explore du catalogue OneLake. Lorsque User2 essaie de développer LH-Products pour parcourir ses schémas et ses tables, un message indique que User2 n'a pas l'autorisation requise.

    Vous devez faire en sorte que User2 puisse parcourir les tables de LH-Products. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Share LH-Products with User2 and grant the Read permission.", fr: "Partager LH-Products avec User2 en accordant l'autorisation Read." } }
    - { id: b, text: { en: "Assign User2 the Viewer role in Workspace-Prod.", fr: "Attribuer à User2 le rôle Viewer dans Workspace-Prod." } }
    - { id: c, text: { en: "Assign User2 the Contributor role in Workspace-Prod.", fr: "Attribuer à User2 le rôle Contributor dans Workspace-Prod." } }
    - { id: d, text: { en: "Endorse LH-Products as Certified.", fr: "Approuver LH-Products avec le badge Certified." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Browsing the schemas and tables of an item in the Explore tab requires the Read permission or higher on that item. Sharing LH-Products with User2 grants Read on this lakehouse only.
    fr: |
      Parcourir les schémas et les tables d'un élément dans l'onglet Explore exige l'autorisation Read ou supérieure sur cet élément. Partager LH-Products avec User2 accorde Read sur ce seul lakehouse.
  options:
    b:
      en: The Viewer role works, but it grants read access to all 30 items of the workspace instead of one.
      fr: Le rôle Viewer fonctionne, mais il donne accès en lecture aux 30 éléments de l'espace de travail au lieu d'un seul.
    c:
      en: Contributor lets User2 create and change items in the workspace, far beyond what is needed.
      fr: Contributor permet à User2 de créer et de modifier des éléments dans l'espace de travail, bien au-delà du besoin.
    d:
      en: Endorsement does not grant any permission on the item.
      fr: L'approbation n'accorde aucune autorisation sur l'élément.
references:
  - title: Find and explore data in the OneLake catalog
    url: https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-explore
