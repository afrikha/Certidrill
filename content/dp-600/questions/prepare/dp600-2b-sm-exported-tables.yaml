id: dp600-2b-sm-exported-tables
objective: "2.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a semantic model named SM-Sales in a workspace on a Fabric F64 capacity. SM-Sales contains the tables shown in the following table.

    | Table | Configuration |
    | --- | --- |
    | Sales | Import, with an incremental refresh policy that gets the latest data in real time with DirectQuery |
    | Customer | Import |
    | Product | Import |
    | Inventory | DirectQuery |
    | Time Intelligence | Calculation group |

    You turn on OneLake integration for SM-Sales and refresh the model.

    Which two tables will be available as Delta tables in OneLake?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique nommé SM-Sales dans un espace de travail sur une capacité Fabric F64. SM-Sales contient les tables présentées dans le tableau suivant.

    | Table | Configuration |
    | --- | --- |
    | Sales | Import, avec une stratégie d'actualisation incrémentielle qui obtient les dernières données en temps réel avec DirectQuery |
    | Customer | Import |
    | Product | Import |
    | Inventory | DirectQuery |
    | Time Intelligence | Groupe de calcul |

    Vous activez l'intégration OneLake pour SM-Sales et vous actualisez le modèle.

    Quelles sont les deux tables qui seront disponibles sous forme de tables Delta dans OneLake ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Sales }
    - { id: b, text: Customer }
    - { id: c, text: Inventory }
    - { id: d, text: Product }
    - { id: e, text: Time Intelligence }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      OneLake integration writes the data of Import-mode tables to Delta tables in OneLake at each refresh. Customer and Product are plain Import tables, so they are exported. Measures, DirectQuery tables, hybrid tables, calculation group tables and system-managed aggregation tables are not exported.
    fr: |
      L'intégration OneLake écrit les données des tables en mode Import dans des tables Delta de OneLake à chaque actualisation. Customer et Product sont de simples tables Import : elles sont exportées. Les mesures, les tables DirectQuery, les tables hybrides, les tables de groupes de calcul et les tables d'agrégation gérées par le système ne sont pas exportées.
  options:
    a:
      en: |
        An incremental refresh policy with a real-time DirectQuery partition makes Sales a hybrid table, and hybrid tables are not exported.
      fr: |
        Une stratégie d'actualisation incrémentielle avec une partition DirectQuery en temps réel fait de Sales une table hybride, et les tables hybrides ne sont pas exportées.
    c:
      en: |
        A DirectQuery table holds no imported data, so it is not exported.
      fr: |
        Une table DirectQuery ne contient pas de données importées : elle n'est pas exportée.
    e:
      en: |
        Calculation group tables are not exported.
      fr: |
        Les tables de groupes de calcul ne sont pas exportées.
references:
  - title: Learn about Microsoft OneLake Delta table integration in Power BI and Microsoft Fabric
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/onelake-integration-overview
