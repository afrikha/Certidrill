id: dp600-2a-mirror-dtu-tier
objective: "2.1.3"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You have an Azure SQL database named sqldb-inventory that uses the DTU purchasing model in the Standard S1 tier (20 DTUs). The database is publicly accessible and allows Azure services.

    You plan to replicate sqldb-inventory to Fabric by using mirroring.

    You need to ensure that the database supports mirroring. The solution must minimize costs.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée sqldb-inventory qui utilise le modèle d'achat DTU au niveau Standard S1 (20 DTU). La base de données est accessible publiquement et autorise les services Azure.

    Vous prévoyez de répliquer sqldb-inventory dans Fabric à l'aide de la mise en miroir.

    Vous devez faire en sorte que la base de données prenne en charge la mise en miroir. La solution doit réduire les coûts au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Scale sqldb-inventory to Standard S2 (50 DTUs).", fr: "Mettre à l'échelle sqldb-inventory en Standard S2 (50 DTU)." } }
    - { id: b, text: { en: "Scale sqldb-inventory to Standard S3 (100 DTUs).", fr: "Mettre à l'échelle sqldb-inventory en Standard S3 (100 DTU)." } }
    - { id: c, text: { en: "Move sqldb-inventory to a Basic elastic pool.", fr: "Déplacer sqldb-inventory dans un pool élastique Basic." } }
    - { id: d, text: { en: "Configure a virtual network data gateway for the mirroring connection.", fr: "Configurer une passerelle de données de réseau virtuel pour la connexion de mise en miroir." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In the DTU purchasing model, databases in the Free, Basic or Standard tiers with fewer than 100 DTUs are not supported for mirroring. Standard S3 provides 100 DTUs, which is the smallest Standard size that is supported.
    fr: |
      Dans le modèle d'achat DTU, les bases de données des niveaux Free, Basic ou Standard de moins de 100 DTU ne sont pas prises en charge pour la mise en miroir. Standard S3 fournit 100 DTU, la plus petite taille Standard prise en charge.
  options:
    a:
      en: Standard S2 still has fewer than 100 DTUs, so mirroring is not supported.
      fr: "Standard S2 a toujours moins de 100 DTU : la mise en miroir n'est pas prise en charge."
    c:
      en: The Basic tier is not supported for mirroring.
      fr: Le niveau Basic n'est pas pris en charge pour la mise en miroir.
    d:
      en: A gateway is needed only when the database is not publicly accessible; it does not change the service tier requirement.
      fr: Une passerelle n'est nécessaire que si la base n'est pas accessible publiquement ; elle ne change pas l'exigence de niveau de service.
references:
  - title: Microsoft Fabric Mirrored Databases from Azure SQL Database
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-sql-database
