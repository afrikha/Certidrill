id: dp600-2c-dq-statements
objective: "2.2.7"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are resolving duplicate and missing values in Microsoft Fabric.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous résolvez des problèmes de valeurs en double et de valeurs manquantes dans Microsoft Fabric.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In Power Query, Remove duplicates on the CustomerID column always keeps the first row of each CustomerID in the current sort order.
        fr: Dans Power Query, Supprimer les doublons sur la colonne CustomerID conserve toujours la première ligne de chaque CustomerID dans l'ordre de tri actuel.
    - id: s2
      text:
        en: In PySpark, `df.dropna(subset=["CustomerID"])` removes the rows whose CustomerID is null, even when their other columns contain values.
        fr: En PySpark, `df.dropna(subset=["CustomerID"])` supprime les lignes dont CustomerID est null, même quand leurs autres colonnes contiennent des valeurs.
    - id: s3
      text:
        en: In KQL, summarize avg(Temperature) treats the null Temperature values of a group as 0.
        fr: En KQL, summarize avg(Temperature) traite les valeurs Temperature null d'un groupe comme des 0.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Power Query doesn't guarantee which row of a duplicate set it keeps, even after sorting, so Remove duplicates can't be used to keep the first or latest row. dropna with a subset considers only the listed columns. KQL aggregation functions ignore null values, so avg averages only the non-null temperatures."
    fr: "Power Query ne garantit pas la ligne qu'il conserve dans un ensemble de doublons, même après un tri : Supprimer les doublons ne permet pas de conserver la première ou la dernière ligne. dropna avec subset ne considère que les colonnes indiquées. Les fonctions d'agrégation KQL ignorent les valeurs null : avg ne fait la moyenne que des températures non null."
references:
  - title: Working with duplicate values
    url: https://learn.microsoft.com/en-us/power-query/working-with-duplicates
  - title: summarize operator
    url: https://learn.microsoft.com/en-us/kusto/query/summarize-operator
