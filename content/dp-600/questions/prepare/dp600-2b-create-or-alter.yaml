id: dp600-2b-create-or-alter
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You deploy T-SQL scripts to Fabric warehouses in development, test and production. A script must define an inline table-valued function named dbo.fnActiveCustomers. In some warehouses the function already exists with an older definition; in others it doesn't exist yet.

    You need the same script to succeed in every warehouse without dropping the function.

    Which statement should the script use?
  fr: |
    Vous déployez des scripts T-SQL dans des entrepôts Fabric de développement, de test et de production. Un script doit définir une fonction table inline nommée dbo.fnActiveCustomers. Dans certains entrepôts, la fonction existe déjà avec une définition plus ancienne ; dans d'autres, elle n'existe pas encore.

    Le même script doit réussir dans tous les entrepôts sans supprimer la fonction.

    Quelle instruction le script doit-il utiliser ?
body:
  options:
    - { id: a, text: CREATE OR ALTER FUNCTION dbo.fnActiveCustomers }
    - { id: b, text: ALTER FUNCTION dbo.fnActiveCustomers }
    - { id: c, text: CREATE FUNCTION dbo.fnActiveCustomers }
    - { id: d, text: EXEC sys.sp_refreshview 'dbo.fnActiveCustomers' }
answer: { optionId: a }
explanation:
  correct:
    en: |
      CREATE OR ALTER FUNCTION creates the function if it doesn't exist and alters it if it does, in a single statement, so the script is idempotent across environments.
    fr: |
      CREATE OR ALTER FUNCTION crée la fonction si elle n'existe pas et la modifie si elle existe, en une seule instruction ; le script est donc rejouable dans tous les environnements.
  options:
    b:
      en: |
        ALTER FUNCTION fails in the warehouses where the function doesn't exist yet.
      fr: |
        ALTER FUNCTION échoue dans les entrepôts où la fonction n'existe pas encore.
    c:
      en: |
        CREATE FUNCTION fails in the warehouses where the function already exists.
      fr: |
        CREATE FUNCTION échoue dans les entrepôts où la fonction existe déjà.
    d:
      en: |
        sp_refreshview refreshes the metadata of a view; it doesn't change a function definition.
      fr: |
        sp_refreshview actualise les métadonnées d'une vue ; il ne change pas la définition d'une fonction.
references:
  - title: CREATE FUNCTION (Microsoft Fabric, Azure Synapse Analytics)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-function-sql-data-warehouse
