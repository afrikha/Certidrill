id: dp600-2e-kql-october-range
objective: "2.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a KQL database named **ShopDB** in a Fabric eventhouse. ShopDB contains a table named **Orders**. The **OrderDate** column is of type `datetime`, and its values always have a time of 00:00:00 (midnight).

    You need to filter Orders to the orders placed from October 1, 2026, through October 31, 2026, including both days, and no other orders.

    Which two filters can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données KQL nommée **ShopDB** dans un eventhouse Fabric. ShopDB contient une table nommée **Orders**. La colonne **OrderDate** est de type `datetime` et ses valeurs ont toujours l'heure 00:00:00 (minuit).

    Vous devez filtrer Orders sur les commandes passées du 1er octobre 2026 au 31 octobre 2026, ces deux jours inclus, et sur aucune autre commande.

    Quels sont les deux filtres que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "| where OrderDate between (datetime(2026-10-01) .. datetime(2026-10-31))" }
    - { id: b, text: "| where OrderDate between (datetime(2026-10-01) .. datetime(2026-11-01))" }
    - { id: c, text: "| where OrderDate > datetime(2026-10-01) and OrderDate < datetime(2026-10-31)" }
    - { id: d, text: "| where OrderDate >= datetime(2026-10-01) and OrderDate < datetime(2026-11-01)" }
    - { id: e, text: "| where OrderDate in (datetime(2026-10-01), datetime(2026-10-31))" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The `between` range is inclusive: it keeps values greater than or equal to the left bound and less than or equal to the right bound, so October 31 at midnight is included. The explicit form with `>=` on October 1 and `<` on November 1 returns the same rows, and it would also be correct if the values had a time part."
    fr: "La plage de `between` est inclusive : elle conserve les valeurs supérieures ou égales à la borne gauche et inférieures ou égales à la borne droite, donc le 31 octobre à minuit est inclus. La forme explicite avec `>=` sur le 1er octobre et `<` sur le 1er novembre renvoie les mêmes lignes, et resterait correcte si les valeurs avaient une partie horaire."
  options:
    b:
      en: "Because `between` is inclusive, the orders of November 1 at midnight are also returned."
      fr: "Comme `between` est inclusif, les commandes du 1er novembre à minuit sont aussi renvoyées."
    c:
      en: "The strict comparisons exclude the orders of October 1 and October 31."
      fr: "Les comparaisons strictes excluent les commandes du 1er et du 31 octobre."
    e:
      en: "`in` keeps only the two listed values, so only the orders of October 1 and October 31 are returned."
      fr: "`in` ne conserve que les deux valeurs listées : seules les commandes du 1er et du 31 octobre sont renvoyées."
references:
  - title: The between operator
    url: https://learn.microsoft.com/en-us/kusto/query/between-operator
