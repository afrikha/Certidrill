id: dp600-2e-dax-table-functions
objective: "2.3.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are writing DAX queries in DAX query view against a semantic model named **SalesModel**. SalesModel contains the tables **Sales**, **Product** and **Customer**, and a measure named **Total Sales**.

    You need to choose the DAX function that each query uses directly after EVALUATE.

    Which function should you use for each requirement? To answer, drag the appropriate functions to the correct requirements. Each function may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez des requêtes DAX dans la vue de requête DAX sur un modèle sémantique nommé **SalesModel**. SalesModel contient les tables **Sales**, **Product** et **Customer**, ainsi qu'une mesure nommée **Total Sales**.

    Vous devez choisir la fonction DAX que chaque requête utilise directement après EVALUATE.

    Quelle fonction devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctions appropriées vers les exigences correspondantes. Chaque fonction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: topn, text: TOPN }
    - { id: summcols, text: SUMMARIZECOLUMNS }
    - { id: filter, text: FILTER }
    - { id: selcols, text: SELECTCOLUMNS }
    - { id: treatas, text: TREATAS }
    - { id: userel, text: USERELATIONSHIP }
  targets:
    - id: best
      text: { en: "Return the five products that have the highest Total Sales", fr: "Renvoyer les cinq produits qui ont la valeur de Total Sales la plus élevée" }
    - id: group
      text: { en: "Return one row per product category with its Total Sales", fr: "Renvoyer une ligne par catégorie de produits avec sa valeur de Total Sales" }
    - id: rows
      text: { en: "Return the Customer rows whose credit limit column is lower than their balance column", fr: "Renvoyer les lignes de Customer dont la colonne de limite de crédit est inférieure à la colonne de solde" }
    - id: cols
      text: { en: "Return only the name and email columns of every customer", fr: "Renvoyer uniquement les colonnes de nom et d'adresse e-mail de chaque client" }
answer:
  mapping: { best: topn, group: summcols, rows: filter, cols: selcols }
explanation:
  correct:
    en: "TOPN returns the top N rows of a table by an order expression. SUMMARIZECOLUMNS returns a summary table over the groups of its group-by columns, with the named expressions. FILTER evaluates a condition for each row, which is needed to compare two columns of the same row. SELECTCOLUMNS starts from an empty table and adds only the listed columns."
    fr: "TOPN renvoie les N premières lignes d'une table selon une expression de tri. SUMMARIZECOLUMNS renvoie une table de synthèse sur les groupes de ses colonnes de regroupement, avec les expressions nommées. FILTER évalue une condition pour chaque ligne, ce qui est nécessaire pour comparer deux colonnes de la même ligne. SELECTCOLUMNS part d'une table vide et n'ajoute que les colonnes listées."
  options:
    treatas:
      en: "TREATAS applies the values of a table expression as filters on columns of an unrelated table; it is a filter argument, not a query result."
      fr: "TREATAS applique les valeurs d'une expression de table comme filtres sur les colonnes d'une table non liée ; c'est un argument de filtre, pas le résultat d'une requête."
    userel:
      en: "USERELATIONSHIP activates an inactive relationship inside CALCULATE or CALCULATETABLE; it doesn't return rows."
      fr: "USERELATIONSHIP active une relation inactive dans CALCULATE ou CALCULATETABLE ; elle ne renvoie pas de lignes."
references:
  - title: TOPN function (DAX)
    url: https://learn.microsoft.com/en-us/dax/topn-function-dax
  - title: SELECTCOLUMNS function (DAX)
    url: https://learn.microsoft.com/en-us/dax/selectcolumns-function-dax
