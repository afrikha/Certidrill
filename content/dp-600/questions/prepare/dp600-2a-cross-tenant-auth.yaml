id: dp600-2a-cross-tenant-auth
objective: "2.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric lakehouse named LH1. You plan to create an Azure Data Lake Storage Gen2 shortcut in LH1 that points to a storage account named stpartner.

    stpartner belongs to a partner company and is in a different Microsoft Entra tenant from your Fabric tenant. The partner refuses to provide any credential that grants full access to stpartner.

    Which two authentication kinds can you use for the shortcut connection? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse Fabric nommé LH1. Vous prévoyez de créer dans LH1 un raccourci Azure Data Lake Storage Gen2 qui pointe vers un compte de stockage nommé stpartner.

    stpartner appartient à une entreprise partenaire et se trouve dans un locataire Microsoft Entra différent de votre locataire Fabric. Le partenaire refuse de fournir toute information d'identification qui donne un accès complet à stpartner.

    Quels sont les deux types d'authentification que vous pouvez utiliser pour la connexion du raccourci ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Organizational account }
    - { id: b, text: Account key }
    - { id: c, text: Shared Access Signature (SAS) }
    - { id: d, text: Service principal }
    - { id: e, text: Workspace identity }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      Across Microsoft Entra tenants, an ADLS Gen2 shortcut must use a service principal or a SAS token. A SAS needs only the Read, List and Execute permissions, and a service principal needs a Storage Blob Data role, so neither grants full access to the account.
    fr: |
      Entre locataires Microsoft Entra différents, un raccourci ADLS Gen2 doit utiliser un principal de service ou un jeton SAS. Une SAS n'a besoin que des autorisations Read, List et Execute, et un principal de service a besoin d'un rôle Storage Blob Data : aucun des deux ne donne un accès complet au compte.
  options:
    a:
      en: Organizational accounts do not work across tenants for ADLS Gen2 shortcuts.
      fr: Les comptes professionnels ne fonctionnent pas entre locataires pour les raccourcis ADLS Gen2.
    b:
      en: An account key gives full access to the storage account, which the partner refuses.
      fr: Une clé de compte donne un accès complet au compte de stockage, ce que le partenaire refuse.
    e:
      en: A workspace identity works only within the same Microsoft Entra tenant.
      fr: Une identité d'espace de travail ne fonctionne que dans le même locataire Microsoft Entra.
references:
  - title: Create an Azure Data Lake Storage Gen2 shortcut
    url: https://learn.microsoft.com/en-us/fabric/onelake/create-adls-shortcut
