id: dp600-2c-agg-import-reduce
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are building an Import semantic model in Power BI Desktop from a Fabric warehouse. The model loads a sales table that stores one row per order line, about 400 million rows.

    All the reports show sales at the month level by product and store. No report needs day-level or order-line detail.

    You need to reduce the size of the model as much as possible.

    What should you do?
  fr: |
    Vous créez un modèle sémantique en mode Import dans Power BI Desktop à partir d'un entrepôt Fabric. Le modèle charge une table des ventes qui stocke une ligne par ligne de commande, soit environ 400 millions de lignes.

    Tous les rapports affichent les ventes au niveau du mois par produit et par magasin. Aucun rapport n'a besoin du détail au jour ou à la ligne de commande.

    Vous devez réduire le plus possible la taille du modèle.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a DAX calculated table that summarizes the sales table by month, product and store.", fr: "Ajouter une table calculée DAX qui résume la table des ventes par mois, produit et magasin." }
    - id: b
      text: { en: "In Power Query, group the sales rows by month, product and store, and sum the measures.", fr: "Dans Power Query, regrouper les lignes de ventes par mois, produit et magasin, puis additionner les mesures." }
    - id: c
      text: { en: "Hide the order-line columns of the sales table from the report authors.", fr: "Masquer aux auteurs de rapports les colonnes de ligne de commande de la table des ventes." }
    - id: d
      text: { en: "Replace the implicit measures with explicit DAX measures that use SUM.", fr: "Remplacer les mesures implicites par des mesures DAX explicites qui utilisent SUM." }
answer: { optionId: b }
explanation:
  correct:
    en: "Grouping and summarizing before the load is one of the most effective data reduction techniques for Import models: the model stores one row per month, product and store instead of one row per order line. The loss of detail is acceptable because no report needs it."
    fr: "Regrouper et résumer avant le chargement est l'une des techniques de réduction des données les plus efficaces pour les modèles Import : le modèle stocke une ligne par mois, produit et magasin au lieu d'une ligne par ligne de commande. La perte de détail est acceptable, car aucun rapport n'en a besoin."
  options:
    a: { en: "A calculated table is computed from the detail table, which is still loaded, so the model grows.", fr: "Une table calculée est calculée à partir de la table de détail, qui reste chargée : le modèle grossit." }
    c: { en: "Hidden columns are still imported and stored in the model.", fr: "Les colonnes masquées sont toujours importées et stockées dans le modèle." }
    d: { en: "Measures are evaluated at query time; they don't change the number of rows stored.", fr: "Les mesures sont évaluées au moment de la requête ; elles ne changent pas le nombre de lignes stockées." }
references:
  - title: Data reduction techniques for Import modeling
    url: https://learn.microsoft.com/en-us/power-bi/guidance/import-modeling-data-reduction
