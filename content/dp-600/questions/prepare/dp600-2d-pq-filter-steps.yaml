id: dp600-2d-pq-filter-steps
objective: "2.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Dataflow Gen2 named **Dataflow1** that contains a query named **Sales**. Sales has a Category column and an Amount column.

    You need to keep only the rows in which Category is Bikes or Helmets and Amount is greater than 100. The filter must return exactly these rows.

    What should you do in Power Query?
  fr: |
    Vous disposez d'un Dataflow Gen2 nommé **Dataflow1** qui contient une requête nommée **Sales**. Sales comporte une colonne Category et une colonne Amount.

    Vous devez conserver uniquement les lignes dans lesquelles Category vaut Bikes ou Helmets et Amount est supérieur à 100. Le filtre doit renvoyer exactement ces lignes.

    Que devez-vous faire dans Power Query ?
body:
  options:
    - { id: a, text: { en: "Add one Filter rows step in Basic mode with three rules: Category equals Bikes, or Category equals Helmets, and Amount is greater than 100.", fr: "Ajouter une étape Filtrer les lignes en mode De base avec trois règles : Category égale Bikes, ou Category égale Helmets, et Amount supérieur à 100." } }
    - { id: b, text: { en: "Add one Filter rows step in Advanced mode with three clauses: Category equals Bikes, or Category equals Helmets, and Amount is greater than 100.", fr: "Ajouter une étape Filtrer les lignes en mode Avancé avec trois clauses : Category égale Bikes, ou Category égale Helmets, et Amount supérieur à 100." } }
    - { id: c, text: { en: "Add a Filter rows step on Category that keeps Bikes or Helmets, and then a second Filter rows step on Amount that keeps the values greater than 100.", fr: "Ajouter une étape Filtrer les lignes sur Category qui conserve Bikes ou Helmets, puis une seconde étape Filtrer les lignes sur Amount qui conserve les valeurs supérieures à 100." } }
    - { id: d, text: { en: "Add a Filter rows step on Amount that keeps the values greater than 100, and then use Remove duplicates on the Category column.", fr: "Ajouter une étape Filtrer les lignes sur Amount qui conserve les valeurs supérieures à 100, puis utiliser Supprimer les doublons sur la colonne Category." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      All the clauses of one Filter rows dialog are at the same level, so a condition that groups an OR inside an AND needs several filter steps. The first step keeps Bikes or Helmets, and the second step applies Amount > 100 to the remaining rows.
    fr: |
      Toutes les clauses d'une même boîte de dialogue Filtrer les lignes sont au même niveau : une condition qui regroupe un OU à l'intérieur d'un ET exige plusieurs étapes de filtre. La première étape conserve Bikes ou Helmets, la seconde applique Amount > 100 aux lignes restantes.
  options:
    a: { en: "Basic mode supports at most two rules on the selected column.", fr: "Le mode De base prend en charge au plus deux règles sur la colonne sélectionnée." }
    b: { en: "The clauses aren't grouped: and is evaluated before or, so the step returns every Bikes row plus the Helmets rows above 100.", fr: "Les clauses ne sont pas regroupées : et est évalué avant ou, l'étape renvoie donc toutes les lignes Bikes plus les lignes Helmets supérieures à 100." }
    d: { en: "Remove duplicates keeps one row per category instead of filtering on Bikes and Helmets.", fr: "Supprimer les doublons conserve une ligne par catégorie au lieu de filtrer sur Bikes et Helmets." }
references:
  - title: Filter by values in a column
    url: https://learn.microsoft.com/en-us/power-query/filter-values
