id: dp600-2b-sqlep-statements
objective: "2.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a lakehouse named Lakehouse1 that contains Delta tables named sales and products. You connect to the SQL analytics endpoint of Lakehouse1 by using SQL Server Management Studio.

    Which two statements can you run successfully?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse nommé Lakehouse1 qui contient des tables Delta nommées sales et products. Vous vous connectez au point de terminaison d'analytique SQL de Lakehouse1 avec SQL Server Management Studio.

    Quelles sont les deux instructions que vous pouvez exécuter avec succès ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "CREATE VIEW dbo.vSalesByProduct AS SELECT p.name, SUM(s.amount) AS total FROM dbo.sales AS s JOIN dbo.products AS p ON p.id = s.product_id GROUP BY p.name;" }
    - { id: b, text: "CREATE TABLE dbo.sales_summary AS SELECT product_id, SUM(amount) AS total FROM dbo.sales GROUP BY product_id;" }
    - { id: c, text: "UPDATE dbo.products SET name = UPPER(name);" }
    - { id: d, text: "CREATE PROCEDURE dbo.usp_TopProducts AS SELECT TOP 10 product_id, SUM(amount) AS total FROM dbo.sales GROUP BY product_id ORDER BY total DESC;" }
    - { id: e, text: "CREATE MATERIALIZED VIEW dbo.mvSales AS SELECT product_id, SUM(amount) AS total FROM dbo.sales GROUP BY product_id;" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      You can create T-SQL views, functions and stored procedures in the SQL analytics endpoint on top of the lakehouse Delta tables. The tables themselves are read-only there; creating tables and running INSERT, UPDATE or DELETE are supported only in a warehouse.
    fr: |
      Vous pouvez créer des vues, des fonctions et des procédures stockées T-SQL dans le point de terminaison d'analytique SQL, au-dessus des tables Delta du lakehouse. Les tables y sont en lecture seule ; la création de tables et les instructions INSERT, UPDATE ou DELETE ne sont prises en charge que dans un entrepôt.
  options:
    b:
      en: |
        CREATE TABLE AS SELECT creates a table, which the SQL analytics endpoint does not allow.
      fr: |
        CREATE TABLE AS SELECT crée une table, ce que le point de terminaison d'analytique SQL n'autorise pas.
    c:
      en: |
        Lakehouse tables are read-only through the SQL analytics endpoint; use Spark or a warehouse to modify data.
      fr: |
        Les tables du lakehouse sont en lecture seule par le point de terminaison d'analytique SQL ; utilisez Spark ou un entrepôt pour modifier les données.
    e:
      en: |
        Materialized views are not supported in Fabric Data Warehouse or the SQL analytics endpoint.
      fr: |
        Les vues matérialisées ne sont prises en charge ni dans Fabric Data Warehouse ni dans le point de terminaison d'analytique SQL.
references:
  - title: T-SQL Surface Area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
