id: dp600-2b-proc-parameter
objective: "2.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse named Warehouse1. A pipeline must reload the rows of one day in dbo.FactSales from stg.Orders. The pipeline passes the date to reload.

    You need to create the stored procedure and test it with the date 2026-11-01.

    How should you complete the T-SQL statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé Warehouse1. Un pipeline doit recharger les lignes d'une journée dans dbo.FactSales à partir de stg.Orders. Le pipeline transmet la date à recharger.

    Vous devez créer la procédure stockée et la tester avec la date 2026-11-01.

    Comment devez-vous compléter les instructions T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE PROCEDURE dbo.usp_LoadDailySales
        [[param]]
    AS
    BEGIN
        DELETE FROM dbo.FactSales WHERE OrderDate = @LoadDate;
        INSERT INTO dbo.FactSales (OrderID, OrderDate, CustomerKey, SalesAmount)
        SELECT OrderID, OrderDate, CustomerKey, Amount
        FROM stg.Orders
        WHERE OrderDate = @LoadDate;
    END;
    GO

    [[call]] dbo.usp_LoadDailySales @LoadDate = '2026-11-01';
  slots:
    - id: param
      options:
        - { id: at, text: "@LoadDate date" }
        - { id: noat, text: LoadDate date }
        - { id: declare, text: "DECLARE @LoadDate date" }
    - id: call
      options:
        - { id: exec, text: EXEC }
        - { id: select, text: SELECT * FROM }
        - { id: callkw, text: CALL }
answer:
  values: { param: at, call: exec }
explanation:
  correct:
    en: |
      Stored procedure parameters are declared after the procedure name with an @ prefix and a data type, and the procedure is run with EXEC (EXECUTE), passing named parameters. A pipeline Stored procedure activity can run it in a Fabric warehouse and pass the date as a parameter value.
    fr: |
      Les paramètres d'une procédure stockée se déclarent après son nom, avec le préfixe @ et un type de données, et la procédure s'exécute avec EXEC (EXECUTE) en passant des paramètres nommés. Une activité Stored procedure de pipeline peut l'exécuter dans un entrepôt Fabric et transmettre la date comme valeur de paramètre.
  options:
    noat: { en: "Parameter names must start with @.", fr: "Les noms de paramètres doivent commencer par @." }
    declare: { en: "DECLARE creates a local variable inside a batch; it doesn't define a procedure parameter.", fr: "DECLARE crée une variable locale dans un lot ; il ne définit pas de paramètre de procédure." }
    select: { en: "A stored procedure can't be used in a FROM clause; only views and table-valued functions can.", fr: "Une procédure stockée ne peut pas être utilisée dans une clause FROM ; seules les vues et les fonctions table le peuvent." }
    callkw: { en: "CALL is not the T-SQL statement that runs a stored procedure.", fr: "CALL n'est pas l'instruction T-SQL qui exécute une procédure stockée." }
references:
  - title: Use the Stored Procedure Activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/stored-procedure-activity
  - title: T-SQL Surface Area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
