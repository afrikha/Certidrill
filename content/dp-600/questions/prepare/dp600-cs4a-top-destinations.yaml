id: dp600-cs4a-top-destinations
objective: "2.3.2"
type: dropdown
caseStudy: dp600-cs4a-margies-travel
difficulty: 1
status: draft
stem:
  en: |
    You are writing the query that must meet the fourth data requirement.

    How should you complete the T-SQL query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez la requête qui doit satisfaire la quatrième exigence relative aux données.

    Comment devez-vous compléter la requête T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT [[top]] d.DestinationName,
           SUM(b.BookingValue) AS TotalValue
    FROM dbo.fact_booking AS b
    INNER JOIN dbo.dim_destination AS d
        ON b.DestinationKey = d.DestinationKey
    WHERE b.BookingDate >= '2026-01-01' AND b.BookingDate < '2027-01-01'
    GROUP BY d.DestinationName
    [[having]] COUNT(*) >= 500
    [[order]];
  slots:
    - id: top
      options:
        - { id: top10, text: TOP (10) }
        - { id: pct, text: TOP (10) PERCENT }
        - { id: distinct, text: DISTINCT }
        - { id: all, text: ALL }
    - id: having
      options:
        - { id: where, text: WHERE }
        - { id: and, text: AND }
        - { id: hav, text: HAVING }
    - id: order
      options:
        - { id: asc, text: ORDER BY TotalValue ASC }
        - { id: desc, text: ORDER BY TotalValue DESC }
        - { id: name, text: ORDER BY d.DestinationName DESC }
        - { id: none, text: OPTION (LABEL = 'Top10') }
answer:
  values: { top: top10, having: hav, order: desc }
explanation:
  correct:
    en: "`HAVING` filters the groups after aggregation, so `COUNT(*) >= 500` keeps only the destinations with at least 500 bookings in 2026. `TOP (10)` limits the result to 10 rows, and with `ORDER BY TotalValue DESC` these are the 10 destinations with the highest total value, listed highest first."
    fr: "`HAVING` filtre les groupes après l'agrégation : `COUNT(*) >= 500` ne conserve que les destinations qui ont au moins 500 réservations en 2026. `TOP (10)` limite le résultat à 10 lignes et, avec `ORDER BY TotalValue DESC`, ce sont les 10 destinations dont la valeur totale est la plus élevée, de la plus élevée à la plus faible."
  options:
    pct: { en: "PERCENT asks for a percentage of the rows, not for 10 rows.", fr: "PERCENT demande un pourcentage des lignes, pas 10 lignes." }
    distinct: { en: "GROUP BY already returns one row per destination; DISTINCT does not limit the result to 10 rows.", fr: "GROUP BY renvoie déjà une ligne par destination ; DISTINCT ne limite pas le résultat à 10 lignes." }
    all: { en: "ALL is the default behavior of SELECT and does not limit the number of rows.", fr: "ALL est le comportement par défaut de SELECT et ne limite pas le nombre de lignes." }
    where: { en: "WHERE filters rows before grouping, it cannot follow GROUP BY, and it cannot contain an aggregate such as COUNT(*).", fr: "WHERE filtre les lignes avant le regroupement, ne peut pas suivre GROUP BY et ne peut pas contenir d'agrégat comme COUNT(*)." }
    and: { en: "The WHERE clause is closed by GROUP BY, so AND after GROUP BY is a syntax error.", fr: "La clause WHERE se termine avant GROUP BY : un AND après GROUP BY est une erreur de syntaxe." }
    asc: { en: "With ascending order, TOP (10) returns the 10 lowest totals.", fr: "Avec un tri croissant, TOP (10) renvoie les 10 totaux les plus faibles." }
    name: { en: "Sorting by name returns the last 10 destinations in reverse alphabetical order, not the highest totals.", fr: "Trier par nom renvoie les 10 dernières destinations dans l'ordre alphabétique inverse, pas les totaux les plus élevés." }
    none: { en: "Without ORDER BY, the 10 rows returned by TOP are not guaranteed to be the highest totals or to be sorted.", fr: "Sans ORDER BY, les 10 lignes renvoyées par TOP ne sont pas forcément les totaux les plus élevés et ne sont pas triées." }
references:
  - title: TOP (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/top-transact-sql
  - title: T-SQL Surface Area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
