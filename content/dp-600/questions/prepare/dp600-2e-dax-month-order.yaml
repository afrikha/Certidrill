id: dp600-2e-dax-month-order
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model named **SalesModel**. The **Date** table contains the columns **Month Name** (January, February...) and **Month Number** (1 to 12). In the model, the Sort by column property of Month Name is set to Month Number.

    You run the following query in DAX query view.

    ```text
    EVALUATE
        SUMMARIZECOLUMNS ( 'Date'[Month Name], "Sales", [Total Sales] )
    ORDER BY 'Date'[Month Name]
    ```

    The months are returned in alphabetical order (April, August, December...). You need the query to return the months in calendar order.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique nommé **SalesModel**. La table **Date** contient les colonnes **Month Name** (January, February...) et **Month Number** (1 à 12). Dans le modèle, la propriété Trier par colonne de Month Name est définie sur Month Number.

    Vous exécutez la requête suivante dans la vue de requête DAX.

    ```text
    EVALUATE
        SUMMARIZECOLUMNS ( 'Date'[Month Name], "Sales", [Total Sales] )
    ORDER BY 'Date'[Month Name]
    ```

    Les mois sont renvoyés par ordre alphabétique (April, August, December...). Vous devez faire en sorte que la requête renvoie les mois dans l'ordre du calendrier.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add ASC after 'Date'[Month Name] in the ORDER BY clause.", fr: "Ajouter ASC après 'Date'[Month Name] dans la clause ORDER BY." }
    - id: b
      text: { en: "Set the Sort by column property again, refresh the model, and rerun the query.", fr: "Redéfinir la propriété Trier par colonne, actualiser le modèle et réexécuter la requête." }
    - id: c
      text: { en: "Wrap SUMMARIZECOLUMNS in TOPN with 12 rows ordered by 'Date'[Month Number] ASC.", fr: "Encapsuler SUMMARIZECOLUMNS dans TOPN avec 12 lignes triées selon 'Date'[Month Number] ASC." }
    - id: d
      text: { en: "Add 'Date'[Month Number] as a group-by column and sort by 'Date'[Month Number].", fr: "Ajouter 'Date'[Month Number] comme colonne de regroupement et trier selon 'Date'[Month Number]." }
answer: { optionId: d }
explanation:
  correct:
    en: "The Sort by column property of a semantic model doesn't apply to DAX query results. To use the sort column in ORDER BY, the query must include it, for example as a second group-by column of SUMMARIZECOLUMNS, and then sort on it."
    fr: "La propriété Trier par colonne d'un modèle sémantique ne s'applique pas aux résultats des requêtes DAX. Pour utiliser la colonne de tri dans ORDER BY, la requête doit l'inclure, par exemple comme deuxième colonne de regroupement de SUMMARIZECOLUMNS, puis trier selon cette colonne."
  options:
    a:
      en: "ASC is already the default; the result stays in alphabetical order."
      fr: "ASC est déjà la valeur par défaut ; le résultat reste trié par ordre alphabétique."
    c:
      en: "TOPN doesn't guarantee any sort order for its result, and Month Number isn't a column of the summarized table."
      fr: "TOPN ne garantit aucun ordre de tri pour son résultat, et Month Number n'est pas une colonne de la table résumée."
    b:
      en: "The property is already set; DAX queries ignore it whatever its value."
      fr: "La propriété est déjà définie ; les requêtes DAX l'ignorent quelle que soit sa valeur."
references:
  - title: DAX Queries
    url: https://learn.microsoft.com/en-us/dax/dax-queries
