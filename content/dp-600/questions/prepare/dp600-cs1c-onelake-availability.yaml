id: dp600-cs1c-onelake-availability
objective: "2.1.5"
type: multi
caseStudy: dp600-cs1c-litware-energy
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the requirement for NB_Consumption. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence concernant NB_Consumption. Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on OneLake availability for the MeterReadings table in GridDB", fr: "Activer la disponibilité OneLake pour la table MeterReadings de GridDB" } }
    - { id: b, text: { en: "Add LH_Customers as a destination of ES_Meters", fr: "Ajouter LH_Customers comme destination de ES_Meters" } }
    - { id: c, text: { en: "In LH_Customers, create a OneLake shortcut to the MeterReadings table", fr: "Dans LH_Customers, créer un raccourci OneLake vers la table MeterReadings" } }
    - { id: d, text: { en: "In GridDB, create a OneLake shortcut to the Tables folder of LH_Customers", fr: "Dans GridDB, créer un raccourci OneLake vers le dossier Tables de LH_Customers" } }
    - { id: e, text: { en: "Turn on OneLake integration for a semantic model that imports MeterReadings", fr: "Activer l'intégration OneLake pour un modèle sémantique qui importe MeterReadings" } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: OneLake availability creates a logical copy of the KQL table in Delta Lake format, managed by the eventhouse, at no extra storage cost. A OneLake shortcut in LH_Customers then exposes that Delta table in the lakehouse, so NB_Consumption reads it like any other table without a pipeline, an eventstream or a notebook copying the data.
    fr: La disponibilité OneLake crée une copie logique de la table KQL au format Delta Lake, gérée par l'eventhouse, sans coût de stockage supplémentaire. Un raccourci OneLake dans LH_Customers expose ensuite cette table Delta dans le lakehouse ; NB_Consumption la lit donc comme toute autre table, sans qu'un pipeline, un eventstream ou un notebook ne copie les données.
  options:
    b:
      en: A lakehouse destination makes the eventstream write a second copy of the data, which the requirement forbids.
      fr: Une destination lakehouse fait écrire par l'eventstream une seconde copie des données, ce que l'exigence interdit.
    d:
      en: A shortcut in GridDB works in the opposite direction; it lets KQL queries read the lakehouse data, not the notebook read MeterReadings.
      fr: Un raccourci dans GridDB fonctionne dans le sens inverse ; il permet aux requêtes KQL de lire les données du lakehouse, pas au notebook de lire MeterReadings.
    e:
      en: Semantic model OneLake integration writes the imported tables of a model to OneLake, which requires a refreshed copy of the data in a model.
      fr: L'intégration OneLake d'un modèle sémantique écrit les tables importées d'un modèle dans OneLake, ce qui suppose une copie actualisée des données dans un modèle.
references:
  - title: Turn on OneLake availability for an eventhouse
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-house-onelake-availability
  - title: OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
