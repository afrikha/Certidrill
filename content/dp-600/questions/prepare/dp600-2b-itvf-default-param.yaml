id: dp600-2b-itvf-default-param
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric warehouse named Warehouse1. You create the following function:

    ```sql
    CREATE FUNCTION dbo.fnSalesByYear (@Year int = 2026)
    RETURNS TABLE
    AS
    RETURN
        SELECT OrderID, OrderDate, SalesAmount
        FROM dbo.FactSales
        WHERE YEAR(OrderDate) = @Year;
    ```

    You need to write a query that returns the sales of 2026 by using the default value of the parameter.

    Which query should you use?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé Warehouse1. Vous créez la fonction suivante :

    ```sql
    CREATE FUNCTION dbo.fnSalesByYear (@Year int = 2026)
    RETURNS TABLE
    AS
    RETURN
        SELECT OrderID, OrderDate, SalesAmount
        FROM dbo.FactSales
        WHERE YEAR(OrderDate) = @Year;
    ```

    Vous devez écrire une requête qui renvoie les ventes de 2026 en utilisant la valeur par défaut du paramètre.

    Quelle requête devez-vous utiliser ?
body:
  options:
    - { id: a, text: "SELECT * FROM dbo.fnSalesByYear();" }
    - { id: b, text: "SELECT * FROM dbo.fnSalesByYear(NULL);" }
    - { id: c, text: "EXEC dbo.fnSalesByYear;" }
    - { id: d, text: "SELECT * FROM dbo.fnSalesByYear(DEFAULT);" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When a function parameter has a default value, the call must pass the DEFAULT keyword to use it. Unlike a stored procedure, omitting the argument does not apply the default.
    fr: |
      Quand un paramètre de fonction a une valeur par défaut, l'appel doit passer le mot clé DEFAULT pour l'utiliser. Contrairement à une procédure stockée, omettre l'argument n'applique pas la valeur par défaut.
  options:
    a:
      en: |
        Omitting the argument doesn't apply the default value of a function parameter; the call fails because an argument is missing.
      fr: |
        Omettre l'argument n'applique pas la valeur par défaut d'un paramètre de fonction ; l'appel échoue car un argument manque.
    b:
      en: |
        NULL is passed as the value, so YEAR(OrderDate) = NULL matches no row.
      fr: |
        NULL est transmis comme valeur ; YEAR(OrderDate) = NULL ne correspond donc à aucune ligne.
    c:
      en: |
        EXEC runs stored procedures; a table-valued function is queried in the FROM clause.
      fr: |
        EXEC exécute des procédures stockées ; une fonction table s'interroge dans la clause FROM.
references:
