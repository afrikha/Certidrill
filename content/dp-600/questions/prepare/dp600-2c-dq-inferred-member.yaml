id: dp600-2c-dq-inferred-member
objective: "2.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You load sales from a point-of-sale system into a fact table named **FactSales** in a Fabric warehouse. The point-of-sale system provides a trusted customer number for each sale. The customer details (name, city, segment) arrive from a CRM system up to three days later.

    You need to meet the following requirements:

    - Each sale must be loaded on the day it happens.
    - As soon as the customer details arrive, reports must show the sales under the correct customer.
    - Fact rows must never be updated after they are loaded.

    What should you do when a sale references a customer number that isn't in **DimCustomer**?
  fr: |
    Vous chargez des ventes d'un système de point de vente dans une table de faits nommée **FactSales** d'un entrepôt Fabric. Le système de point de vente fournit un numéro de client fiable pour chaque vente. Les détails du client (nom, ville, segment) arrivent d'un système CRM jusqu'à trois jours plus tard.

    Vous devez satisfaire les exigences suivantes :

    - Chaque vente doit être chargée le jour où elle a lieu.
    - Dès que les détails du client arrivent, les rapports doivent afficher les ventes sous le bon client.
    - Les lignes de faits ne doivent jamais être mises à jour après leur chargement.

    Que devez-vous faire quand une vente référence un numéro de client absent de **DimCustomer** ?
body:
  options:
    - id: a
      text: { en: "Store the key of the Unknown member in the fact row, and update the row when the customer arrives.", fr: "Stocker la clé du membre Unknown dans la ligne de faits, puis mettre à jour la ligne quand le client arrive." }
    - id: b
      text: { en: "Insert an inferred member with the customer number and Unknown attributes, and store its key in the fact row.", fr: "Insérer un membre déduit avec le numéro de client et des attributs Unknown, puis stocker sa clé dans la ligne de faits." }
    - id: c
      text: { en: "Keep the sale in the staging table until the customer arrives, and load it after the customer.", fr: "Garder la vente dans la table de préproduction jusqu'à l'arrivée du client, puis la charger après le client." }
    - id: d
      text: { en: "Store the key of the Unknown member, and add an SCD type 2 version of Unknown when the customer arrives.", fr: "Stocker la clé du membre Unknown, puis ajouter une version SCD de type 2 de Unknown quand le client arrive." }
answer: { optionId: b }
explanation:
  correct:
    en: "Because the customer number is trusted, the fact load can insert an inferred member known only by its natural key, with Unknown attributes and IsInferredMember set to TRUE, and store its surrogate key. When the CRM details arrive, the dimension row is updated in place and the flag is set to FALSE; the fact rows already point to the right member."
    fr: "Comme le numéro de client est fiable, le chargement des faits peut insérer un membre déduit connu uniquement par sa clé naturelle, avec des attributs Unknown et IsInferredMember à TRUE, puis stocker sa clé de substitution. Quand les détails du CRM arrivent, la ligne de dimension est mise à jour sur place et l'indicateur passe à FALSE ; les lignes de faits pointent déjà vers le bon membre."
  options:
    a: { en: "Updating the fact rows later breaks the requirement that fact rows are never updated.", fr: "Mettre à jour les lignes de faits plus tard enfreint l'exigence selon laquelle elles ne sont jamais mises à jour." }
    c: { en: "Holding the sales delays their load by up to three days.", fr: "Retenir les ventes retarde leur chargement de jusqu'à trois jours." }
    d: { en: "All the unmatched sales share the Unknown member, so a new version of it can't attribute them to their real customers.", fr: "Toutes les ventes sans correspondance partagent le membre Unknown : une nouvelle version de celui-ci ne peut pas les attribuer à leurs vrais clients." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Load tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
