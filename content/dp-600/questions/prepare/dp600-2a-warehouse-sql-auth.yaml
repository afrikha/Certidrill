id: dp600-2a-warehouse-sql-auth
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named WH1. A third-party ETL tool runs on a schedule on a server and connects to WH1 by using the SQL connection string (TDS endpoint) of WH1.

    The tool must authenticate without any interactive sign-in. The vendor documentation recommends creating a SQL login with a user name and a password for the tool.

    What should the tool use to authenticate to WH1?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé WH1. Un outil ETL tiers s'exécute selon une planification sur un serveur et se connecte à WH1 avec la chaîne de connexion SQL (point de terminaison TDS) de WH1.

    L'outil doit s'authentifier sans aucune connexion interactive. La documentation de l'éditeur recommande de créer pour l'outil une connexion SQL (login) avec un nom d'utilisateur et un mot de passe.

    Qu'est-ce que l'outil doit utiliser pour s'authentifier auprès de WH1 ?
body:
  options:
    - { id: a, text: { en: "A Microsoft Entra service principal that has access to WH1", fr: "Un principal de service Microsoft Entra qui a accès à WH1" } }
    - { id: b, text: { en: "A SQL authentication login created with CREATE LOGIN", fr: "Une connexion avec authentification SQL créée avec CREATE LOGIN" } }
    - { id: c, text: { en: "A shared access signature (SAS) for the OneLake folder of WH1", fr: "Une signature d'accès partagé (SAS) pour le dossier OneLake de WH1" } }
    - { id: d, text: { en: "A Microsoft Entra user account that signs in with multifactor authentication", fr: "Un compte d'utilisateur Microsoft Entra qui se connecte avec l'authentification multifacteur" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The TDS endpoint of a warehouse supports Microsoft Entra user principals and service principals only. A service principal authenticates with its own credentials, without an interactive sign-in, which suits a scheduled tool.
    fr: |
      Le point de terminaison TDS d'un entrepôt prend en charge uniquement les principaux d'utilisateur et les principaux de service Microsoft Entra. Un principal de service s'authentifie avec ses propres informations d'identification, sans connexion interactive, ce qui convient à un outil planifié.
  options:
    b:
      en: SQL authentication is not supported by Fabric warehouses and SQL analytics endpoints.
      fr: L'authentification SQL n'est pas prise en charge par les entrepôts et les points de terminaison d'analytique SQL Fabric.
    c:
      en: A SAS is a storage credential; a T-SQL client connecting to the TDS endpoint authenticates with Microsoft Entra ID.
      fr: Une SAS est une information d'identification de stockage ; un client T-SQL qui se connecte au point de terminaison TDS s'authentifie avec Microsoft Entra ID.
    d:
      en: Multifactor authentication requires an interactive sign-in, which the scheduled tool cannot perform.
      fr: L'authentification multifacteur exige une connexion interactive, que l'outil planifié ne peut pas effectuer.
references:
  - title: Warehouse Connectivity
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/connectivity
