id: dp600-2a-oauth-expiry
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1. A pipeline in Workspace1 copies a large table from an Azure SQL database by using a cloud connection named Conn-ERP. Conn-ERP uses the OAuth2 authentication method with the Microsoft Entra account of a data engineer.

    Runs that take several hours fail with an authentication error, while shorter runs succeed.

    You need to prevent the failures without splitting the copy into smaller runs.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1. Un pipeline de Workspace1 copie une table volumineuse depuis une base de données Azure SQL en utilisant une connexion cloud nommée Conn-ERP. Conn-ERP utilise la méthode d'authentification OAuth2 avec le compte Microsoft Entra d'un ingénieur données.

    Les exécutions qui durent plusieurs heures échouent avec une erreur d'authentification, alors que les exécutions plus courtes réussissent.

    Vous devez empêcher ces échecs sans diviser la copie en exécutions plus petites.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the privacy level of Conn-ERP to Organizational.", fr: "Définir le niveau de confidentialité de Conn-ERP sur Organizational." } }
    - { id: b, text: { en: "Increase the timeout of the Copy activity to 12 hours.", fr: "Augmenter le délai d'expiration de l'activité Copy à 12 heures." } }
    - { id: c, text: { en: "Allow Conn-ERP to be used with on-premises and VNet data gateways.", fr: "Autoriser l'utilisation de Conn-ERP avec les passerelles de données locales et de réseau virtuel." } }
    - { id: d, text: { en: "Change the authentication method of Conn-ERP to Service Principal.", fr: "Remplacer la méthode d'authentification de Conn-ERP par Service Principal." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With OAuth2, a long-running query can fail when it outlasts the expiration of the access token. A service principal authenticates with its own client credentials instead of a user's delegated token, so long copies are not cut off by the token of a user, and the connection no longer depends on the account of one engineer.
    fr: |
      Avec OAuth2, une requête de longue durée peut échouer lorsqu'elle dépasse l'expiration du jeton d'accès. Un principal de service s'authentifie avec ses propres informations d'identification client au lieu du jeton délégué d'un utilisateur : les longues copies ne sont plus interrompues par le jeton d'un utilisateur, et la connexion ne dépend plus du compte d'un seul ingénieur.
  options:
    a:
      en: The privacy level controls how Power Query combines sources; it has no effect on token lifetime.
      fr: Le niveau de confidentialité contrôle la façon dont Power Query combine les sources ; il n'a aucun effet sur la durée de vie du jeton.
    b:
      en: The activity does not time out; the authentication token expires, which a longer timeout does not fix.
      fr: L'activité n'expire pas ; c'est le jeton d'authentification qui expire, ce qu'un délai plus long ne corrige pas.
    c:
      en: The gateway setting only decides whether gateways can use the connection; it does not change how the connection authenticates.
      fr: Le paramètre de passerelle décide seulement si des passerelles peuvent utiliser la connexion ; il ne change pas la façon dont la connexion s'authentifie.
references:
  - title: Data source management
    url: https://learn.microsoft.com/en-us/fabric/data-factory/data-source-management
