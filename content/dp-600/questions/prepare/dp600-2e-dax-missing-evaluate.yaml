id: dp600-2e-dax-missing-evaluate
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a semantic model named **RetailModel** that contains the tables **Sales** and **Store**. You open RetailModel in DAX query view and write the following query.

    ```text
    DEFINE
        MEASURE Sales[Total Sales] = SUM ( Sales[SalesAmount] )

    SUMMARIZECOLUMNS (
        Store[Region],
        "Total Sales", [Total Sales]
    )
    ```

    When you run the query, it returns a syntax error.

    Which keyword should you add on the line before SUMMARIZECOLUMNS?
  fr: |
    Vous disposez d'un modèle sémantique nommé **RetailModel** qui contient les tables **Sales** et **Store**. Vous ouvrez RetailModel dans la vue de requête DAX et écrivez la requête suivante.

    ```text
    DEFINE
        MEASURE Sales[Total Sales] = SUM ( Sales[SalesAmount] )

    SUMMARIZECOLUMNS (
        Store[Region],
        "Total Sales", [Total Sales]
    )
    ```

    Lorsque vous exécutez la requête, elle renvoie une erreur de syntaxe.

    Quel mot clé devez-vous ajouter sur la ligne qui précède SUMMARIZECOLUMNS ?
body:
  options:
    - { id: a, text: EVALUATE }
    - { id: b, text: RETURN }
    - { id: c, text: VAR }
    - { id: d, text: ORDER BY }
answer: { optionId: a }
explanation:
  correct:
    en: "EVALUATE is the only required keyword of a DAX query: it is followed by the table expression whose result the query returns. A DEFINE block, when present, must come before the first EVALUATE statement."
    fr: "EVALUATE est le seul mot clé obligatoire d'une requête DAX : il est suivi de l'expression de table dont la requête renvoie le résultat. Un bloc DEFINE, s'il est présent, doit précéder la première instruction EVALUATE."
  options:
    b:
      en: "RETURN ends a VAR block inside a DAX expression; it doesn't return the result of a query."
      fr: "RETURN termine un bloc VAR dans une expression DAX ; il ne renvoie pas le résultat d'une requête."
    c:
      en: "VAR defines a variable; a query still needs EVALUATE to return a table."
      fr: "VAR définit une variable ; une requête a toujours besoin d'EVALUATE pour renvoyer une table."
    d:
      en: "ORDER BY is optional and comes after an EVALUATE statement to sort its result."
      fr: "ORDER BY est facultatif et suit une instruction EVALUATE pour en trier le résultat."
references:
  - title: DAX Queries
    url: https://learn.microsoft.com/en-us/dax/dax-queries
