id: dp600-cs3b-batch-types
objective: "2.2.8"
type: dropdown
caseStudy: dp600-cs3b-munsons
difficulty: 3
status: draft
stem:
  en: |
    You are writing the statement that creates dbo.FactBatch to meet requirement 2.

    How should you complete the T-SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez l'instruction qui crée dbo.FactBatch pour satisfaire l'exigence 2.

    Comment devez-vous compléter l'instruction T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE TABLE dbo.FactBatch
    AS
    SELECT BatchId,
           PlantCode,
           CAST(BatchStart AS [[start]]) AS BatchStart,
           CAST(BatchCost AS [[cost]]) AS BatchCost,
           CAST(JarCount AS [[jars]]) AS JarCount
    FROM stg.Batches;
  slots:
    - id: start
      options:
        - { id: datetime, text: datetime }
        - { id: smalldt, text: smalldatetime }
        - { id: dt2, text: datetime2(3) }
        - { id: date, text: date }
    - id: cost
      options:
        - { id: money, text: money }
        - { id: dec, text: "decimal(10,2)" }
        - { id: float, text: float }
        - { id: int, text: int }
    - id: jars
      options:
        - { id: tinyint, text: tinyint }
        - { id: bit, text: bit }
        - { id: smallint, text: smallint }
answer:
  values: { start: dt2, cost: dec, jars: smallint }
explanation:
  correct:
    en: "CREATE TABLE AS SELECT persists the columns, so only data types supported for warehouse tables can be used. `datetime2(3)` keeps the milliseconds and `decimal(10,2)` stores the amount exactly. tinyint is not supported in Fabric Data Warehouse tables; `smallint` is the documented alternative and holds 0 to 250."
    fr: "CREATE TABLE AS SELECT rend les colonnes persistantes : seuls les types de données pris en charge pour les tables de l'entrepôt sont utilisables. `datetime2(3)` conserve les millisecondes et `decimal(10,2)` stocke le montant exactement. tinyint n'est pas pris en charge dans les tables de Fabric Data Warehouse ; `smallint` est l'alternative documentée et contient les valeurs de 0 à 250."
  options:
    datetime: { en: "datetime is not supported in warehouse tables; use datetime2.", fr: "datetime n'est pas pris en charge dans les tables de l'entrepôt ; il faut utiliser datetime2." }
    smalldt: { en: "smalldatetime is not supported in warehouse tables and does not store milliseconds.", fr: "smalldatetime n'est pas pris en charge dans les tables de l'entrepôt et ne stocke pas les millisecondes." }
    date: { en: "date drops the time part.", fr: "date supprime la partie heure." }
    money: { en: "money is not supported in warehouse tables; use decimal.", fr: "money n'est pas pris en charge dans les tables de l'entrepôt ; il faut utiliser decimal." }
    float: { en: "float is an approximate numeric type, so amounts can lose precision.", fr: "float est un type numérique approximatif : les montants peuvent perdre en précision." }
    int: { en: "int drops the decimals of the amount.", fr: "int supprime les décimales du montant." }
    tinyint: { en: "tinyint is not supported in warehouse tables.", fr: "tinyint n'est pas pris en charge dans les tables de l'entrepôt." }
    bit: { en: "bit stores only 0 and 1.", fr: "bit ne stocke que 0 et 1." }
references:
  - title: Data Types in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-types
