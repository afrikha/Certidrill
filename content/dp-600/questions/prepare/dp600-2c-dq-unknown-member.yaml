id: dp600-2c-dq-unknown-member
objective: "2.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You load a fact table named **FactSales** in a Fabric warehouse from a staging table. During each load, the surrogate key of the customer is looked up in **DimCustomer** by the business key. Some sales reference a customer that isn't in DimCustomer yet, and the lookup fails.

    Every sale must be loaded, every fact row must relate to a dimension member, and reports must group these sales under **Unknown**. The fact rows can be corrected later by a periodic process.

    What should you do?
  fr: |
    Vous chargez une table de faits nommée **FactSales** dans un entrepôt Fabric à partir d'une table de préproduction. À chaque chargement, la clé de substitution du client est recherchée dans **DimCustomer** à partir de la clé métier. Certaines ventes référencent un client qui ne figure pas encore dans DimCustomer, et la recherche échoue.

    Toutes les ventes doivent être chargées, chaque ligne de faits doit être liée à un membre de dimension, et les rapports doivent regrouper ces ventes sous **Unknown**. Les lignes de faits peuvent être corrigées plus tard par un processus périodique.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Load the facts with an INNER JOIN to DimCustomer on the business key.", fr: "Charger les faits avec un INNER JOIN vers DimCustomer sur la clé métier." }
    - id: b
      text: { en: "Load the facts with a LEFT JOIN to DimCustomer, and keep a null customer key when the lookup fails.", fr: "Charger les faits avec un LEFT JOIN vers DimCustomer, et garder une clé de client null quand la recherche échoue." }
    - id: c
      text: { en: "Add a FOREIGN KEY ... NOT ENFORCED constraint from FactSales to DimCustomer.", fr: "Ajouter une contrainte FOREIGN KEY ... NOT ENFORCED de FactSales vers DimCustomer." }
    - id: d
      text: { en: "Add an Unknown member with the key -1 to DimCustomer, and load the facts with a LEFT JOIN and COALESCE(d.CustomerKey, -1).", fr: "Ajouter à DimCustomer un membre Unknown de clé -1, puis charger les faits avec un LEFT JOIN et COALESCE(d.CustomerKey, -1)." }
answer: { optionId: d }
explanation:
  correct:
    en: "When a dimension key lookup fails, Learn recommends storing a special Unknown member, commonly with the key -1. The LEFT JOIN keeps every sale and COALESCE assigns -1 when no customer matches, so each fact row relates to a member. A periodic process can later update these rows to the real key."
    fr: "Quand la recherche d'une clé de dimension échoue, Learn recommande de stocker un membre spécial Unknown, souvent avec la clé -1. Le LEFT JOIN conserve toutes les ventes et COALESCE attribue -1 quand aucun client ne correspond : chaque ligne de faits est liée à un membre. Un processus périodique peut ensuite mettre à jour ces lignes avec la vraie clé."
  options:
    a: { en: "An inner join drops the sales whose customer isn't found.", fr: "Une jointure interne supprime les ventes dont le client est introuvable." }
    b: { en: "A null key doesn't relate the fact row to any member; reports show a blank instead of Unknown.", fr: "Une clé null ne lie la ligne de faits à aucun membre ; les rapports affichent un vide au lieu de Unknown." }
    c: { en: "Fabric Warehouse doesn't enforce foreign keys, so the constraint neither rejects nor fixes the rows.", fr: "Fabric Warehouse n'applique pas les clés étrangères : la contrainte ne rejette ni ne corrige les lignes." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Load tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Dimension tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
