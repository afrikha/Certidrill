id: dp600-2d-try-convert-staging
objective: "2.2.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a staging table named **stg.Invoice**. All the columns of stg.Invoice use the `varchar` data type.

    The AmountText column contains decimal numbers, but some rows contain invalid values such as `n/a`. The InvoiceDateText column contains dates in the `dd/MM/yyyy` format, for example `31/12/2026`.

    You need to write a query that converts both columns. Rows that contain an invalid amount must be returned with a NULL amount instead of making the query fail.

    How should you complete the T-SQL query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table de préproduction nommée **stg.Invoice**. Toutes les colonnes de stg.Invoice utilisent le type de données `varchar`.

    La colonne AmountText contient des nombres décimaux, mais certaines lignes contiennent des valeurs non valides comme `n/a`. La colonne InvoiceDateText contient des dates au format `dd/MM/yyyy`, par exemple `31/12/2026`.

    Vous devez écrire une requête qui convertit les deux colonnes. Les lignes qui contiennent un montant non valide doivent être renvoyées avec un montant NULL au lieu de faire échouer la requête.

    Comment devez-vous compléter la requête T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT InvoiceId,
           [[fn]](AmountText AS decimal(18,2)) AS Amount,
           TRY_CONVERT(date, InvoiceDateText, [[style]]) AS InvoiceDate
    FROM stg.Invoice;
  slots:
    - id: fn
      options:
        - { id: cast, text: CAST }
        - { id: trycast, text: TRY_CAST }
        - { id: coalesce, text: COALESCE }
    - id: style
      options:
        - { id: s101, text: "101" }
        - { id: s103, text: "103" }
        - { id: s112, text: "112" }
        - { id: s126, text: "126" }
answer:
  values: { fn: trycast, style: s103 }
explanation:
  correct:
    en: "`TRY_CAST` returns NULL when a value can't be converted, so the rows with `n/a` are kept with a NULL amount. The `CONVERT` and `TRY_CONVERT` style 103 is the British/French format `dd/MM/yyyy`, which reads `31/12/2026` as December 31."
    fr: "`TRY_CAST` renvoie NULL quand une valeur ne peut pas être convertie : les lignes contenant `n/a` sont conservées avec un montant NULL. Le style 103 de `CONVERT` et `TRY_CONVERT` correspond au format britannique et français `dd/MM/yyyy`, qui lit `31/12/2026` comme le 31 décembre."
  options:
    cast: { en: "CAST raises a conversion error on the first invalid value, so the whole query fails.", fr: "CAST lève une erreur de conversion à la première valeur non valide : toute la requête échoue." }
    coalesce: { en: "COALESCE returns the first non-null argument; it doesn't convert data types and doesn't accept the AS syntax.", fr: "COALESCE renvoie le premier argument non NULL ; il ne convertit pas de type et n'accepte pas la syntaxe AS." }
    s101: { en: "Style 101 is the U.S. format MM/dd/yyyy: 31 isn't a valid month, so every such date returns NULL.", fr: "Le style 101 est le format américain MM/dd/yyyy : 31 n'est pas un mois valide, ces dates renvoient donc NULL." }
    s112: { en: "Style 112 is the ISO format yyyyMMdd without separators.", fr: "Le style 112 est le format ISO yyyyMMdd sans séparateur." }
    s126: { en: "Style 126 is the ISO 8601 format yyyy-MM-ddTHH:mm:ss.fff.", fr: "Le style 126 est le format ISO 8601 yyyy-MM-ddTHH:mm:ss.fff." }
references:
  - title: TRY_CAST (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/try-cast-transact-sql
  - title: CAST and CONVERT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/cast-and-convert-transact-sql
