id: dp600-2b-dl-sql-upstream
objective: "2.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a lakehouse named Lakehouse1 that contains a Delta table named patients. A Dataflow Gen2 named DF-Patients loads patients every night by replacing its content. A semantic model named SM-Clinic uses Direct Lake on SQL analytics endpoint storage mode and reads patients.

    Report authors need an AgeBand column (0-17, 18-64, 65+) that they can use in slicers and on visual axes. Queries on SM-Clinic must not fall back to DirectQuery.

    Which two actions achieve the goal? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse nommé Lakehouse1 qui contient une table Delta nommée patients. Un Dataflow Gen2 nommé DF-Patients charge patients chaque nuit en remplaçant son contenu. Un modèle sémantique nommé SM-Clinic utilise le mode de stockage Direct Lake sur le point de terminaison d'analytique SQL et lit patients.

    Les auteurs de rapports ont besoin d'une colonne AgeBand (0-17, 18-64, 65+) utilisable dans des segments et sur les axes des visuels. Les requêtes sur SM-Clinic ne doivent pas basculer vers DirectQuery.

    Quelles sont les deux actions qui atteignent l'objectif ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add AgeBand as a calculated column in SM-Clinic.", fr: "Ajouter AgeBand comme colonne calculée dans SM-Clinic." } }
    - { id: b, text: { en: "Add AgeBand as a conditional column in DF-Patients, and refresh the table schema in SM-Clinic.", fr: "Ajouter AgeBand comme colonne conditionnelle dans DF-Patients, puis actualiser le schéma de la table dans SM-Clinic." } }
    - { id: c, text: { en: "Create a view in the SQL analytics endpoint that adds AgeBand, and use the view in SM-Clinic instead of patients.", fr: "Créer dans le point de terminaison d'analytique SQL une vue qui ajoute AgeBand, et utiliser la vue dans SM-Clinic à la place de patients." } }
    - { id: d, text: { en: "Create a materialized lake view that adds AgeBand to patients, and use it in SM-Clinic instead of patients.", fr: "Créer une vue matérialisée de lakehouse qui ajoute AgeBand à patients, et l'utiliser dans SM-Clinic à la place de patients." } }
    - { id: e, text: { en: "Create an AgeBand measure in SM-Clinic that uses SWITCH.", fr: "Créer une mesure AgeBand dans SM-Clinic qui utilise SWITCH." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Direct Lake on SQL analytics endpoints reads Delta tables and doesn't support calculated columns. Adding AgeBand in the dataflow that loads patients writes it into the Delta table itself. A materialized lake view is also persisted as a Delta table, so the model can read it in Direct Lake mode.
    fr: |
      Direct Lake sur les points de terminaison d'analytique SQL lit des tables Delta et ne prend pas en charge les colonnes calculées. Ajouter AgeBand dans le dataflow qui charge patients l'écrit dans la table Delta elle-même. Une vue matérialisée de lakehouse est aussi conservée sous forme de table Delta : le modèle peut la lire en mode Direct Lake.
  options:
    a:
      en: |
        Calculated columns are not supported in Direct Lake on SQL analytics endpoint models.
      fr: |
        Les colonnes calculées ne sont pas prises en charge dans les modèles Direct Lake sur le point de terminaison d'analytique SQL.
    c:
      en: |
        A table based on a non-materialized SQL view makes Direct Lake on SQL fall back to DirectQuery.
      fr: |
        Une table basée sur une vue SQL non matérialisée fait basculer Direct Lake sur SQL vers DirectQuery.
    e:
      en: |
        A measure returns an aggregated value; it can't be used as a slicer field or as a category on an axis.
      fr: |
        Une mesure renvoie une valeur agrégée ; elle ne peut pas servir de champ de segment ni de catégorie sur un axe.
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
  - title: Overview of Materialized Lake Views
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/materialized-lake-views/overview-materialized-lake-view
