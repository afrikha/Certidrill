id: dp600-cs1a-dedupe-customers
objective: "2.2.7"
type: dropdown
caseStudy: dp600-cs1a-wingtip-toys
difficulty: 2
status: draft
stem:
  en: |
    You are writing the cell of NB_Gold that builds gold_dim_customer from silver_customers. You need to meet the data preparation requirements. How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez la cellule de NB_Gold qui construit gold_dim_customer à partir de silver_customers. Vous devez satisfaire les exigences de préparation des données. Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    df = spark.read.table("silver_customers")

    df_clean = (df
        .[[dedupe]](["CustomerID"])
        .[[nulls]]({"Country": "Unknown"}))

    df_clean.write.format("delta").mode([[mode]]).saveAsTable("gold_dim_customer")
  slots:
    - id: dedupe
      options:
        - { id: distinct, text: distinct }
        - { id: dropdup, text: dropDuplicates }
        - { id: dropna, text: dropna }
        - { id: groupby, text: groupBy }
    - id: nulls
      options:
        - { id: fillna, text: fillna }
        - { id: dropna, text: dropna }
        - { id: replace, text: replace }
        - { id: coalesce, text: coalesce }
    - id: mode
      options:
        - { id: append, text: "\"append\"" }
        - { id: overwrite, text: "\"overwrite\"" }
        - { id: ignore, text: "\"ignore\"" }
        - { id: error, text: "\"error\"" }
answer:
  values: { dedupe: dropdup, nulls: fillna, mode: overwrite }
explanation:
  correct:
    en: "`dropDuplicates([\"CustomerID\"])` keeps one row for each CustomerID value, even when the other columns differ. `fillna({\"Country\": \"Unknown\"})` replaces the null values of the Country column only. The `overwrite` save mode replaces the content of the Delta table at each run, which rebuilds gold_dim_customer completely."
    fr: "`dropDuplicates([\"CustomerID\"])` conserve une ligne par valeur de CustomerID, même quand les autres colonnes diffèrent. `fillna({\"Country\": \"Unknown\"})` remplace uniquement les valeurs null de la colonne Country. Le mode d'enregistrement `overwrite` remplace le contenu de la table Delta à chaque exécution, ce qui reconstruit entièrement gold_dim_customer."
  options:
    distinct: { en: "distinct() takes no column list and removes only rows that are identical in every column.", fr: "distinct() n'accepte pas de liste de colonnes et ne supprime que les lignes identiques sur toutes les colonnes." }
    dropna: { en: "dropna removes rows that contain null values; it does not remove duplicates or replace nulls with Unknown.", fr: "dropna supprime les lignes qui contiennent des valeurs null ; il ne supprime pas les doublons et ne remplace pas les valeurs null par Unknown." }
    groupby: { en: "groupBy returns grouped data that needs an aggregation; it is not followed by a DataFrame method such as fillna.", fr: "groupBy renvoie des données regroupées qui exigent une agrégation ; il ne peut pas être suivi d'une méthode de DataFrame comme fillna." }
    replace: { en: "DataFrame.replace with a dictionary maps old values to new values; it does not target the null values of a given column.", fr: "DataFrame.replace avec un dictionnaire associe d'anciennes valeurs à de nouvelles valeurs ; il ne cible pas les valeurs null d'une colonne donnée." }
    coalesce: { en: "DataFrame.coalesce reduces the number of partitions; it does not replace null values.", fr: "DataFrame.coalesce réduit le nombre de partitions ; il ne remplace pas les valeurs null." }
    append: { en: "append adds the rows to the existing table, so each run would create duplicates again.", fr: "append ajoute les lignes à la table existante ; chaque exécution recréerait donc des doublons." }
    ignore: { en: "ignore leaves the existing table unchanged when it already exists, so the table would never be rebuilt.", fr: "ignore laisse la table inchangée quand elle existe déjà ; elle ne serait donc jamais reconstruite." }
    error: { en: "error (the default) fails when the table already exists, so the second run would fail.", fr: "error (la valeur par défaut) échoue quand la table existe déjà ; la deuxième exécution échouerait donc." }
references:
  - title: "Lakehouse tutorial: Prepare and transform data in the lakehouse"
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/tutorial-lakehouse-data-preparation
