id: dp600-2c-join-composite-key
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Dataflow Gen2 that contains a query named **Sales** (ProductID, Region, Quantity) and a query named **RegionalPrices** (Region, ProductID, Price). A price is unique for each combination of ProductID and Region.

    You merge Sales with RegionalPrices. In the Merge dialog, you selected Region and then ProductID in RegionalPrices, and ProductID and then Region in Sales. The merged prices are wrong.

    You need to fix the merge.

    What should you do?
  fr: |
    Vous disposez d'un Dataflow Gen2 qui contient une requête nommée **Sales** (ProductID, Region, Quantity) et une requête nommée **RegionalPrices** (Region, ProductID, Price). Un prix est unique pour chaque combinaison de ProductID et de Region.

    Vous fusionnez Sales avec RegionalPrices. Dans la boîte de dialogue de fusion, vous avez sélectionné Region puis ProductID dans RegionalPrices, et ProductID puis Region dans Sales. Les prix fusionnés sont faux.

    Vous devez corriger la fusion.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Select the key columns in the same order in both queries, ProductID then Region.", fr: "Sélectionner les colonnes clés dans le même ordre dans les deux requêtes, ProductID puis Region." }
    - id: b
      text: { en: "Reorder the columns of RegionalPrices so that they appear in the same order as Sales.", fr: "Réorganiser les colonnes de RegionalPrices pour qu'elles apparaissent dans le même ordre que dans Sales." }
    - id: c
      text: { en: "Select the Use fuzzy matching to perform the merge check box.", fr: "Cocher la case Utiliser la correspondance approximative pour effectuer la fusion." }
    - id: d
      text: { en: "Change the join kind from Left outer to Inner.", fr: "Changer le type de jointure de Jointure externe gauche en Jointure interne." }
answer: { optionId: a }
explanation:
  correct:
    en: "When you merge on several columns, Power Query pairs the columns in the order you select them, shown by small numbers on the headers. Region was paired with ProductID, so the selection order must be the same in both queries."
    fr: "Quand vous fusionnez sur plusieurs colonnes, Power Query associe les colonnes dans l'ordre où vous les sélectionnez, indiqué par de petits numéros sur les en-têtes. Region a été associé à ProductID : l'ordre de sélection doit être le même dans les deux requêtes."
  options:
    b: { en: "The position of the columns in the table doesn't matter; the selection order in the Merge dialog does.", fr: "La position des colonnes dans la table n'a pas d'importance ; c'est l'ordre de sélection dans la boîte de dialogue de fusion qui compte." }
    c: { en: "Fuzzy matching finds similar text values; it doesn't fix columns that are paired incorrectly.", fr: "La correspondance approximative trouve des valeurs de texte similaires ; elle ne corrige pas des colonnes mal associées." }
    d: { en: "The join kind decides which rows are kept, not which columns are compared.", fr: "Le type de jointure détermine les lignes conservées, pas les colonnes comparées." }
references:
  - title: Merge queries overview
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-overview
