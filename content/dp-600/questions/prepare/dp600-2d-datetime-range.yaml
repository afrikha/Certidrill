id: dp600-2d-datetime-range
objective: "2.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a table named **dbo.FactOrder**. The OrderDate column uses the `datetime2(3)` data type and contains the date and time of each order.

    You need a query that returns all the orders placed during the calendar year 2026, and only those orders.

    Which WHERE clause should you use?
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table nommée **dbo.FactOrder**. La colonne OrderDate utilise le type de données `datetime2(3)` et contient la date et l'heure de chaque commande.

    Vous avez besoin d'une requête qui renvoie toutes les commandes passées pendant l'année civile 2026, et uniquement celles-ci.

    Quelle clause WHERE devez-vous utiliser ?
body:
  options:
    - { id: a, text: "WHERE OrderDate BETWEEN '2026-01-01' AND '2026-12-31'" }
    - { id: b, text: "WHERE OrderDate > '2025-12-31' AND OrderDate < '2027-01-01'" }
    - { id: c, text: "WHERE OrderDate > '2026-01-01' AND OrderDate <= '2026-12-31'" }
    - { id: d, text: "WHERE OrderDate >= '2026-01-01' AND OrderDate < '2027-01-01'" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The literal `'2026-12-31'` means December 31 at midnight, so an inclusive upper bound misses the orders placed later that day. A half-open range, greater than or equal to January 1, 2026 and less than January 1, 2027, returns every order of 2026 whatever its time.
    fr: |
      Le littéral `'2026-12-31'` désigne le 31 décembre à minuit : une borne supérieure incluse manque les commandes passées plus tard ce jour-là. Une plage semi-ouverte, supérieure ou égale au 1er janvier 2026 et inférieure au 1er janvier 2027, renvoie toutes les commandes de 2026 quelle que soit leur heure.
  options:
    a: { en: "BETWEEN includes both bounds, but the upper bound is December 31 at midnight, so the orders placed after midnight that day are missed.", fr: "BETWEEN inclut les deux bornes, mais la borne supérieure est le 31 décembre à minuit : les commandes passées après minuit ce jour-là sont manquées." }
    b: { en: "> '2025-12-31' keeps the orders placed after midnight on December 31, 2025.", fr: "> '2025-12-31' conserve les commandes passées après minuit le 31 décembre 2025." }
    c: { en: "This range excludes the orders placed at exactly midnight on January 1 and the orders placed after midnight on December 31.", fr: "Cette plage exclut les commandes passées exactement à minuit le 1er janvier et celles passées après minuit le 31 décembre." }
references:
  - title: datetime2 (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/data-types/datetime2-transact-sql
