id: dp600-2b-identity-gaps
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named Warehouse1 that contains a dimension table named dbo.DimProduct. Its surrogate key, ProductKey, is a bigint IDENTITY column. Several pipelines load new products in parallel, and dbo.FactSales stores ProductKey.

    An analyst reports that ProductKey values are not in insertion order and that there are large gaps between some values. You need ProductKey to remain a valid surrogate key. The solution must minimize effort.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé Warehouse1 qui contient une table de dimension nommée dbo.DimProduct. Sa clé de substitution, ProductKey, est une colonne IDENTITY bigint. Plusieurs pipelines chargent de nouveaux produits en parallèle, et dbo.FactSales stocke ProductKey.

    Un analyste signale que les valeurs de ProductKey ne suivent pas l'ordre d'insertion et qu'il existe de grands écarts entre certaines valeurs. ProductKey doit rester une clé de substitution valide. La solution doit réduire l'effort au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run DBCC CHECKIDENT ('dbo.DimProduct', RESEED) after each load.", fr: "Exécuter DBCC CHECKIDENT ('dbo.DimProduct', RESEED) après chaque chargement." } }
    - { id: b, text: { en: "Make no change, because the values are unique even when they are not sequential.", fr: "Ne rien changer, car les valeurs sont uniques même lorsqu'elles ne sont pas séquentielles." } }
    - { id: c, text: { en: "Reload dbo.DimProduct with IDENTITY_INSERT set to ON to renumber the keys without gaps.", fr: "Recharger dbo.DimProduct avec IDENTITY_INSERT sur ON pour renuméroter les clés sans écart." } }
    - { id: d, text: { en: "Load the products sequentially from a single pipeline.", fr: "Charger les produits de façon séquentielle depuis un seul pipeline." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      IDENTITY values in Fabric Data Warehouse are guaranteed unique for the lifetime of the table, but they are not guaranteed to be sequential or ordered. Ranges are allocated across compute nodes, so separate loads produce unordered ranges and gaps. A surrogate key needs uniqueness, not contiguity, so no change is needed.
    fr: |
      Les valeurs IDENTITY de Fabric Data Warehouse sont garanties uniques pendant toute la durée de vie de la table, mais pas séquentielles ni ordonnées. Les plages sont allouées entre les nœuds de calcul : des chargements distincts produisent des plages non ordonnées et des écarts. Une clé de substitution a besoin d'unicité, pas de continuité : aucune modification n'est nécessaire.
  options:
    a:
      en: |
        RESEED recalculates the next values after explicit inserts; it doesn't remove gaps or order values.
      fr: |
        RESEED recalcule les valeurs suivantes après des insertions explicites ; il ne supprime pas les écarts et n'ordonne pas les valeurs.
    c:
      en: |
        Renumbering would break the ProductKey values already stored in dbo.FactSales.
      fr: |
        Renuméroter casserait les valeurs de ProductKey déjà stockées dans dbo.FactSales.
    d:
      en: |
        Serializing the loads adds effort, and IDENTITY values are never guaranteed to be sequential or free of gaps.
      fr: |
        Sérialiser les chargements ajoute de l'effort, et les valeurs IDENTITY ne sont jamais garanties séquentielles ni sans écarts.
references:
  - title: IDENTITY Columns in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/identity
