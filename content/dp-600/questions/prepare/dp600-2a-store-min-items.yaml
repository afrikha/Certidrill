id: dp600-2a-store-min-items
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Data engineers at Adatum land CSV files, product images and Parquet files in Fabric and transform them with Spark into Delta tables.

    SQL analysts must create T-SQL views on the Delta tables and restrict the rows that each sales manager can see by using row-level security defined in T-SQL. The analysts never modify the data.

    You need to recommend a solution that minimizes the number of items to create and maintain.

    What should you recommend?
  fr: |
    Les ingénieurs données d'Adatum déposent dans Fabric des fichiers CSV, des images de produits et des fichiers Parquet, et les transforment avec Spark en tables Delta.

    Les analystes SQL doivent créer des vues T-SQL sur les tables Delta et restreindre les lignes que chaque responsable commercial peut voir à l'aide de la sécurité au niveau des lignes définie en T-SQL. Les analystes ne modifient jamais les données.

    Vous devez recommander une solution qui réduit au minimum le nombre d'éléments à créer et à maintenir.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "One lakehouse for the files and one warehouse for the views and row-level security", fr: "Un lakehouse pour les fichiers et un entrepôt pour les vues et la sécurité au niveau des lignes" } }
    - { id: b, text: { en: "One warehouse for the files, the Delta tables, the views and row-level security", fr: "Un entrepôt pour les fichiers, les tables Delta, les vues et la sécurité au niveau des lignes" } }
    - { id: c, text: { en: "One lakehouse, with the views and row-level security in its SQL analytics endpoint", fr: "Un lakehouse, avec les vues et la sécurité au niveau des lignes dans son point de terminaison d'analytique SQL" } }
    - { id: d, text: { en: "One eventhouse with OneLake availability enabled", fr: "Un eventhouse avec la disponibilité OneLake activée" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A lakehouse stores the files and the Delta tables that Spark writes. Its SQL analytics endpoint is read-only for data, but it supports T-SQL objects such as views and functions and granular SQL security, including row-level security. Because the analysts never write data, one item meets every requirement.
    fr: |
      Un lakehouse stocke les fichiers et les tables Delta écrites par Spark. Son point de terminaison d'analytique SQL est en lecture seule pour les données, mais il prend en charge des objets T-SQL comme les vues et les fonctions, ainsi que la sécurité SQL granulaire, dont la sécurité au niveau des lignes. Comme les analystes n'écrivent jamais de données, un seul élément répond à toutes les exigences.
  options:
    a:
      en: This works but adds a second item to create and maintain, which the endpoint of the lakehouse makes unnecessary.
      fr: Cela fonctionne, mais ajoute un second élément à créer et à maintenir, ce que le point de terminaison du lakehouse rend inutile.
    b:
      en: A warehouse holds structured tables only; it does not store images or raw files for Spark processing.
      fr: Un entrepôt ne contient que des tables structurées ; il ne stocke ni images ni fichiers bruts pour un traitement Spark.
    d:
      en: An eventhouse targets streaming event data with KQL, not Spark engineering on files and images.
      fr: Un eventhouse vise les données d'événements de streaming avec KQL, pas l'ingénierie Spark sur des fichiers et des images.
references:
  - title: What is the SQL analytics endpoint for a lakehouse?
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sql-analytics-endpoint
  - title: "Microsoft Fabric decision guide: Choose between Warehouse and Lakehouse"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-lakehouse-warehouse
