id: dp600-2d-sql-like-in-null
objective: "2.2.9"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a table named **dbo.DimCustomer**. Email addresses are stored in lowercase. The ClosedDate column is NULL for the customers whose account is still open.

    You need a query that returns the customers that meet the following requirements:

    - The email address ends with `@contoso.com`.
    - The Segment column is Retail or SMB.
    - The account is still open.

    How should you complete the T-SQL query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table nommée **dbo.DimCustomer**. Les adresses e-mail sont stockées en minuscules. La colonne ClosedDate vaut NULL pour les clients dont le compte est toujours ouvert.

    Vous avez besoin d'une requête qui renvoie les clients qui satisfont aux exigences suivantes :

    - L'adresse e-mail se termine par `@contoso.com`.
    - La colonne Segment vaut Retail ou SMB.
    - Le compte est toujours ouvert.

    Comment devez-vous compléter la requête T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT CustomerKey, CustomerName, Email, Segment
    FROM dbo.DimCustomer
    WHERE Email [[a]] '%@contoso.com'
      AND Segment [[b]] ('Retail', 'SMB')
      AND ClosedDate [[c]];
  slots:
    - id: a
      options:
        - { id: like, text: LIKE }
        - { id: eq, text: "=" }
        - { id: in, text: IN }
    - id: b
      options:
        - { id: in, text: IN }
        - { id: between, text: BETWEEN }
        - { id: like, text: LIKE }
    - id: c
      options:
        - { id: isnull, text: IS NULL }
        - { id: eqnull, text: "= NULL" }
        - { id: notnull, text: IS NOT NULL }
answer:
  values: { a: like, b: in, c: isnull }
explanation:
  correct:
    en: "`LIKE` with the `%` wildcard matches any characters before `@contoso.com`. `IN` keeps the rows whose value is in the list. `IS NULL` is the only way to test for a missing value, so it returns the open accounts."
    fr: "`LIKE` avec le caractère générique `%` correspond à n'importe quels caractères avant `@contoso.com`. `IN` conserve les lignes dont la valeur figure dans la liste. `IS NULL` est le seul moyen de tester une valeur manquante : il renvoie les comptes ouverts."
  options:
    eq: { en: "= compares the exact string, so % is treated as a literal character.", fr: "= compare la chaîne exacte : % y est traité comme un caractère littéral." }
    between: { en: "BETWEEN expects a lower and an upper bound joined by AND, not a list.", fr: "BETWEEN attend une borne inférieure et une borne supérieure reliées par AND, pas une liste." }
    eqnull: { en: "A comparison with NULL returns UNKNOWN, so = NULL returns no rows.", fr: "Une comparaison avec NULL renvoie UNKNOWN : = NULL ne renvoie aucune ligne." }
    notnull: { en: "IS NOT NULL returns the closed accounts.", fr: "IS NOT NULL renvoie les comptes fermés." }
references:
  - title: NULL and UNKNOWN (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/null-and-unknown-transact-sql
