id: dp600-2c-agg-kql-hourly
objective: "2.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an eventhouse that contains a KQL database with a table named **SensorReadings** (Timestamp, SiteId, DeviceId, Temperature).

    You need a KQL query that returns, for the last seven days, one row per site and hour with the average temperature and the number of different devices that sent readings.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un eventhouse qui contient une base de données KQL avec une table nommée **SensorReadings** (Timestamp, SiteId, DeviceId, Temperature).

    Vous avez besoin d'une requête KQL qui renvoie, pour les sept derniers jours, une ligne par site et par heure avec la température moyenne et le nombre d'appareils différents qui ont envoyé des relevés.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    SensorReadings
    | where Timestamp > ago(7d)
    | summarize AvgTemperature = [[avg]](Temperature),
                Devices = [[dc]](DeviceId)
        by SiteId, [[bin]]
  slots:
    - id: avg
      options:
        - { id: avg, text: avg }
        - { id: sum, text: sum }
        - { id: max, text: max }
        - { id: any, text: take_any }
    - id: dc
      options:
        - { id: dcount, text: dcount }
        - { id: count, text: count }
        - { id: makeset, text: make_set }
        - { id: countif, text: countif }
    - id: bin
      options:
        - { id: bin, text: "bin(Timestamp, 1h)" }
        - { id: day, text: startofday(Timestamp) }
        - { id: raw, text: Timestamp }
        - { id: ago, text: ago(1h) }
answer:
  values: { avg: avg, dc: dcount, bin: bin }
explanation:
  correct:
    en: "`avg` returns the average temperature of each group and ignores null values. `dcount` returns the number of distinct DeviceId values. `bin(Timestamp, 1h)` rounds each timestamp down to the hour, so `summarize` produces one row per site and hour."
    fr: "`avg` renvoie la température moyenne de chaque groupe et ignore les valeurs null. `dcount` renvoie le nombre de valeurs DeviceId distinctes. `bin(Timestamp, 1h)` arrondit chaque horodatage à l'heure inférieure : `summarize` produit alors une ligne par site et par heure."
  options:
    sum: { en: "sum adds the temperatures instead of averaging them.", fr: "sum additionne les températures au lieu d'en faire la moyenne." }
    max: { en: "max returns the highest temperature, not the average.", fr: "max renvoie la température la plus élevée, pas la moyenne." }
    any: { en: "take_any returns an arbitrary value from each group.", fr: "take_any renvoie une valeur arbitraire de chaque groupe." }
    count: { en: "count() counts rows and takes no column argument; it doesn't count distinct devices.", fr: "count() compte les lignes et n'accepte pas de colonne en argument ; il ne compte pas les appareils distincts." }
    makeset: { en: "make_set returns an array of the distinct values, not their number.", fr: "make_set renvoie un tableau des valeurs distinctes, pas leur nombre." }
    countif: { en: "countif expects a Boolean predicate and counts the rows for which it is true.", fr: "countif attend un prédicat booléen et compte les lignes pour lesquelles il est vrai." }
    day: { en: "startofday creates one group per day, not per hour.", fr: "startofday crée un groupe par jour, pas par heure." }
    raw: { en: "Grouping by the raw timestamp creates one group per distinct timestamp value.", fr: "Regrouper par l'horodatage brut crée un groupe par valeur d'horodatage distincte." }
    ago: { en: "ago(1h) is a constant point in time, so all the rows would fall into one group per site.", fr: "ago(1h) est un instant constant : toutes les lignes tomberaient dans un seul groupe par site." }
references:
  - title: summarize operator
    url: https://learn.microsoft.com/en-us/kusto/query/summarize-operator
