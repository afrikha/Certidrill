id: dp600-2e-kql-store-revenue
objective: "2.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a KQL database named **StoresRT** in a Fabric eventhouse. StoresRT contains a table named **Orders** that has one row per order and the columns **OrderId**, **StoreId**, **Amount** and **OrderDate**.

    You need a query that returns only two columns, StoreId and Revenue, for the stores whose revenue over the last 30 days is greater than 10,000. The rows must be sorted from the highest revenue to the lowest.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données KQL nommée **StoresRT** dans un eventhouse Fabric. StoresRT contient une table nommée **Orders** qui comporte une ligne par commande et les colonnes **OrderId**, **StoreId**, **Amount** et **OrderDate**.

    Vous avez besoin d'une requête qui renvoie uniquement deux colonnes, StoreId et Revenue, pour les magasins dont le chiffre d'affaires des 30 derniers jours est supérieur à 10 000. Les lignes doivent être triées du chiffre d'affaires le plus élevé au plus bas.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    Orders
    | where OrderDate >= ago(30d)
    | [[agg]] Revenue = sum(Amount), Orders = count() by StoreId
    | [[flt]] Revenue > 10000
    | [[cols]] StoreId, Revenue
    | [[ord]] by Revenue desc
  slots:
    - id: agg
      options:
        - { id: extend, text: extend }
        - { id: summarize, text: summarize }
        - { id: projectagg, text: project }
    - id: flt
      options:
        - { id: where, text: where }
        - { id: extend, text: extend }
        - { id: take, text: take }
    - id: cols
      options:
        - { id: projectaway, text: project-away }
        - { id: extend, text: extend }
        - { id: project, text: project }
    - id: ord
      options:
        - { id: sort, text: sort }
        - { id: top, text: top }
        - { id: take, text: take }
answer:
  values: { agg: summarize, flt: where, cols: project, ord: sort }
explanation:
  correct:
    en: "`summarize ... by StoreId` groups the orders and computes the revenue of each store. A `where` placed after `summarize` filters the aggregated rows, like `HAVING` in SQL. `project` keeps only the listed columns, which removes the Orders column, and `sort by Revenue desc` orders the rows from the highest revenue."
    fr: "`summarize ... by StoreId` regroupe les commandes et calcule le chiffre d'affaires de chaque magasin. Un `where` placé après `summarize` filtre les lignes agrégées, comme `HAVING` en SQL. `project` ne conserve que les colonnes listées, ce qui supprime la colonne Orders, et `sort by Revenue desc` trie les lignes à partir du chiffre d'affaires le plus élevé."
  options:
    extend:
      en: "`extend` adds a calculated column to each row; it doesn't aggregate, filter or remove columns."
      fr: "`extend` ajoute une colonne calculée à chaque ligne ; il n'agrège pas, ne filtre pas et ne supprime pas de colonnes."
    projectagg:
      en: "`project` selects or computes columns row by row; it doesn't support a `by` clause and can't aggregate."
      fr: "`project` sélectionne ou calcule des colonnes ligne par ligne ; il ne prend pas en charge de clause `by` et ne peut pas agréger."
    take:
      en: "`take` returns a number of rows; it accepts neither a condition nor a `by` clause."
      fr: "`take` renvoie un nombre de lignes ; il n'accepte ni condition ni clause `by`."
    projectaway:
      en: "`project-away StoreId, Revenue` would remove the two columns that must be kept and leave the Orders column."
      fr: "`project-away StoreId, Revenue` supprimerait les deux colonnes à conserver et laisserait la colonne Orders."
    top:
      en: "`top` requires the number of rows to return before `by`, and it would limit the result."
      fr: "`top` exige le nombre de lignes à renvoyer avant `by`, et limiterait le résultat."
references:
  - title: summarize operator
    url: https://learn.microsoft.com/en-us/kusto/query/summarize-operator
  - title: SQL to Kusto query translation
    url: https://learn.microsoft.com/en-us/kusto/query/sql-cheat-sheet
