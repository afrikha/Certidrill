id: dp600-2a-store-warehouse
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The finance team at Woodgrove is made of SQL developers. They are building an enterprise star schema for Power BI reporting with a fact table of two billion rows.

    The tables are loaded every night in batches by stored procedures that update the fact table and two dimension tables in a single transaction. No application writes to the data.

    Which Fabric data store should you recommend?
  fr: |
    L'équipe finance de Woodgrove est composée de développeurs SQL. Ils construisent un schéma en étoile d'entreprise pour le reporting Power BI, avec une table de faits de deux milliards de lignes.

    Les tables sont chargées chaque nuit par lots par des procédures stockées qui mettent à jour la table de faits et deux tables de dimension dans une seule transaction. Aucune application n'écrit dans ces données.

    Quel magasin de données Fabric devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A SQL database", fr: "Une base de données SQL" } }
    - { id: b, text: { en: "A warehouse", fr: "Un entrepôt" } }
    - { id: c, text: { en: "A lakehouse with its SQL analytics endpoint", fr: "Un lakehouse avec son point de terminaison d'analytique SQL" } }
    - { id: d, text: { en: "An eventhouse", fr: "Un eventhouse" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A warehouse is the Fabric store for enterprise data warehousing and SQL-based BI: it supports full T-SQL DML and DDL, stored procedures and multi-table transactions, and it is designed for star schemas queried at scale. SQL developers keep their T-SQL skills.
    fr: |
      Un entrepôt est le magasin Fabric pour l'entreposage de données d'entreprise et la BI basée sur SQL : il prend en charge le DML et le DDL T-SQL complets, les procédures stockées et les transactions multitables, et il est conçu pour des schémas en étoile interrogés à grande échelle. Les développeurs SQL conservent leurs compétences T-SQL.
  options:
    a:
      en: A SQL database targets operational OLTP workloads of applications, while this is an analytical star schema loaded in batches.
      fr: Une base de données SQL vise les charges de travail opérationnelles OLTP des applications, alors qu'il s'agit ici d'un schéma en étoile analytique chargé par lots.
    c:
      en: The SQL analytics endpoint of a lakehouse is read-only, so stored procedures cannot update its tables.
      fr: "Le point de terminaison d'analytique SQL d'un lakehouse est en lecture seule : des procédures stockées ne peuvent pas mettre à jour ses tables."
    d:
      en: An eventhouse is for streaming event data queried with KQL, not for a star schema loaded with T-SQL transactions.
      fr: Un eventhouse sert aux données d'événements de streaming interrogées en KQL, pas à un schéma en étoile chargé par des transactions T-SQL.
references:
  - title: "Microsoft Fabric decision guide: Choose between Warehouse and Lakehouse"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-lakehouse-warehouse
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
