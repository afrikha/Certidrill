id: dp600-cs4a-commission-store
objective: "2.1.4"
type: single
caseStudy: dp600-cs4a-margies-travel
difficulty: 2
status: draft
stem:
  en: |
    You need to choose the Fabric item that will store the commission data. The solution must meet the first data requirement.

    Which type of item should you create in MT-Analytics?
  fr: |
    Vous devez choisir l'élément Fabric qui stockera les données de commissions. La solution doit satisfaire la première exigence relative aux données.

    Quel type d'élément devez-vous créer dans MT-Analytics ?
body:
  options:
    - { id: a, text: { en: "A lakehouse", fr: "Un lakehouse" } }
    - { id: b, text: { en: "A warehouse", fr: "Un entrepôt" } }
    - { id: c, text: { en: "An eventhouse", fr: "Un eventhouse" } }
    - { id: d, text: { en: "A mirrored database", fr: "Une base de données mise en miroir" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A Fabric warehouse is the store for T-SQL developers who write data with stored procedures, and it supports multi-table transactions, so the existing procedures can keep updating the three tables in one transaction. Its tables are stored as Delta tables in OneLake, so the data engineers can still read them from their notebooks."
    fr: "Un entrepôt Fabric est le magasin des développeurs T-SQL qui écrivent les données avec des procédures stockées, et il prend en charge les transactions multitables : les procédures existantes peuvent continuer de mettre à jour les trois tables dans une seule transaction. Ses tables sont stockées en tables Delta dans OneLake, donc les ingénieurs données peuvent toujours les lire depuis leurs notebooks."
  options:
    a: { en: "A lakehouse is written with Spark. Its SQL analytics endpoint is read-only for tables, so the T-SQL procedures could not insert or update the commission tables.", fr: "Un lakehouse s'écrit avec Spark. Son point de terminaison d'analytique SQL est en lecture seule pour les tables : les procédures T-SQL ne pourraient pas insérer ni mettre à jour les tables de commissions." }
    c: { en: "An eventhouse is designed for streaming and time-series event data queried with KQL, not for T-SQL procedures that update several tables in one transaction.", fr: "Un eventhouse est conçu pour les données d'événements en streaming et les séries chronologiques interrogées en KQL, pas pour des procédures T-SQL qui mettent à jour plusieurs tables dans une transaction." }
    d: { en: "A mirrored database is a read-only replica of a source database in OneLake. The stored procedures could not write to it, and the calculation would stay on premises.", fr: "Une base de données mise en miroir est une réplique en lecture seule d'une base source dans OneLake. Les procédures stockées ne pourraient pas y écrire, et le calcul resterait en local." }
references:
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
  - title: T-SQL Surface Area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
