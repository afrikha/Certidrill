id: dp600-2c-join-result-rows
objective: "2.2.6"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    You have a Dataflow Gen2 that contains a query named **Customers** with the following rows:

    | CustomerID | CustomerName |
    | --- | --- |
    | C1 | Contoso |
    | C2 | Fabrikam |
    | C2 | Fabrikam Inc. |
    | C3 | Litware |
    | C4 | Northwind |

    The dataflow also contains a query named **Orders**, shown in the following table. You merge Orders (left) with Customers (right) on CustomerID.

    Answer each prompt by selecting the order in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un Dataflow Gen2 qui contient une requête nommée **Customers** avec les lignes suivantes :

    | CustomerID | CustomerName |
    | --- | --- |
    | C1 | Contoso |
    | C2 | Fabrikam |
    | C2 | Fabrikam Inc. |
    | C3 | Litware |
    | C4 | Northwind |

    Le dataflow contient aussi une requête nommée **Orders**, présentée dans le tableau suivant. Vous fusionnez Orders (à gauche) avec Customers (à droite) sur CustomerID.

    Répondez à chaque consigne en sélectionnant la commande dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The only order returned by a Left anti join", fr: "La seule commande renvoyée par une anti jointure gauche" } 
    - id: p2
      text: { en: "The order that appears in two rows after a Left outer join, once the Customers column is expanded", fr: "La commande qui apparaît sur deux lignes après une jointure externe gauche, une fois la colonne Customers développée" }
  grid:
    header: [OrderID, CustomerID, { en: Amount, fr: Montant }]
    rows:
      - [{ text: "1001", area: o1001 }, { text: C1 }, { text: "100" }]
      - [{ text: "1002", area: o1002 }, { text: C2 }, { text: "250" }]
      - [{ text: "1003", area: o1003 }, { text: C9 }, { text: "80" }]
      - [{ text: "1004", area: o1004 }, { text: C3 }, { text: "40" }]
answer:
  values: { p1: o1003, p2: o1002 }
explanation:
  correct:
    en: "A left anti join keeps only the left rows without a match: C9 doesn't exist in Customers, so order 1003 is the only result. CustomerID C2 appears twice in Customers, so after a left outer join and the expansion, order 1002 is repeated once for each matching customer row. That fan-out would double its amount in any sum."
    fr: "Une anti jointure gauche ne conserve que les lignes de gauche sans correspondance : C9 n'existe pas dans Customers, donc la commande 1003 est le seul résultat. Le CustomerID C2 figure deux fois dans Customers : après une jointure externe gauche et le développement, la commande 1002 est répétée une fois par ligne de client correspondante. Cette démultiplication doublerait son montant dans toute somme."
references:
  - title: Left anti join
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-left-anti
  - title: Merge queries overview
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-overview
