id: dp600-2a-conn-user-access
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1. A shareable cloud connection named Conn-SalesDB stores the credentials of a SQL login for an Azure SQL database. You are the owner of Conn-SalesDB.

    User1 has the Contributor role in Workspace1. When User1 creates a pipeline in Workspace1 and adds a Copy activity, Conn-SalesDB does not appear in the list of available connections.

    You need to ensure that User1 can use Conn-SalesDB in pipelines. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1. Une connexion cloud partageable nommée Conn-SalesDB stocke les informations d'identification d'une connexion SQL (login) pour une base de données Azure SQL. Vous êtes le propriétaire de Conn-SalesDB.

    User1 a le rôle Contributor dans Workspace1. Lorsque User1 crée un pipeline dans Workspace1 et ajoute une activité Copy, Conn-SalesDB n'apparaît pas dans la liste des connexions disponibles.

    Vous devez faire en sorte que User1 puisse utiliser Conn-SalesDB dans des pipelines. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign User1 the Admin role in Workspace1.", fr: "Attribuer à User1 le rôle Admin dans Workspace1." } }
    - { id: b, text: { en: "Add User1 to the users of Conn-SalesDB with the Owner role.", fr: "Ajouter User1 aux utilisateurs de Conn-SalesDB avec le rôle Owner." } }
    - { id: c, text: { en: "Add User1 to the users of Conn-SalesDB with the User role.", fr: "Ajouter User1 aux utilisateurs de Conn-SalesDB avec le rôle User." } }
    - { id: d, text: { en: "Create a database user for User1 in the Azure SQL database.", fr: "Créer un utilisateur de base de données pour User1 dans la base de données Azure SQL." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Each connection has its own access list, separate from workspace roles, and users only see the connections they were added to. Adding User1 with the User role in Manage connections and gateways > Manage users lets User1 use Conn-SalesDB in pipelines without being able to reshare or manage it.
    fr: |
      Chaque connexion a sa propre liste d'accès, distincte des rôles d'espace de travail, et les utilisateurs ne voient que les connexions auxquelles ils ont été ajoutés. Ajouter User1 avec le rôle User dans Gérer les connexions et les passerelles > Gérer les utilisateurs lui permet d'utiliser Conn-SalesDB dans des pipelines sans pouvoir la repartager ni la gérer.
  options:
    a:
      en: Workspace roles do not grant access to a connection; even the Admin role would not make Conn-SalesDB appear for User1, and it grants far more than needed.
      fr: Les rôles d'espace de travail n'accordent pas l'accès à une connexion ; même le rôle Admin ne ferait pas apparaître Conn-SalesDB pour User1, et il accorde bien plus que nécessaire.
    b:
      en: The Owner role would work, but it also lets User1 manage the connection, its credentials and its users, which exceeds least privilege.
      fr: Le rôle Owner fonctionnerait, mais il permet aussi à User1 de gérer la connexion, ses informations d'identification et ses utilisateurs, ce qui dépasse le moindre privilège.
    d:
      en: The pipeline reaches the database with the credentials stored in Conn-SalesDB, not with User1's identity; the problem is the access list of the connection.
      fr: Le pipeline atteint la base de données avec les informations d'identification stockées dans Conn-SalesDB, pas avec l'identité de User1 ; le problème vient de la liste d'accès de la connexion.
references:
  - title: Data source management
    url: https://learn.microsoft.com/en-us/fabric/data-factory/data-source-management
