id: dp600-2a-notebook-load
objective: "2.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric lakehouse named LH1. The Files section of LH1 contains an Amazon S3 shortcut named s3_orders that points to Parquet files.

    You need a notebook attached to LH1 that loads the files into a managed Delta table named orders. The table does not exist yet. Each run must replace the content of the table.

    How should you complete the PySpark code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse Fabric nommé LH1. La section Files de LH1 contient un raccourci Amazon S3 nommé s3_orders qui pointe vers des fichiers Parquet.

    Vous avez besoin d'un notebook attaché à LH1 qui charge les fichiers dans une table Delta managée nommée orders. La table n'existe pas encore. Chaque exécution doit remplacer le contenu de la table.

    Comment devez-vous compléter le code PySpark ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    df = spark.read.format([[fmt]]).load("Files/s3_orders")

    df.write.mode([[mode]]).format("delta").[[save]]("orders")
  slots:
    - id: fmt
      options:
        - { id: delta, text: '"delta"' }
        - { id: parquet, text: '"parquet"' }
        - { id: csv, text: '"csv"' }
    - id: mode
      options:
        - { id: append, text: '"append"' }
        - { id: ignore, text: '"ignore"' }
        - { id: overwrite, text: '"overwrite"' }
    - id: save
      options:
        - { id: sat, text: saveAsTable }
        - { id: save, text: save }
        - { id: insert, text: insertInto }
answer:
  values: { fmt: parquet, mode: overwrite, save: sat }
explanation:
  correct:
    en: |
      The shortcut exposes Parquet files, so the reader uses the parquet format. The overwrite mode replaces the content of the table at each run, and saveAsTable creates the managed Delta table in the Tables section on the first run and registers it in the metastore.
    fr: |
      Le raccourci expose des fichiers Parquet : le lecteur utilise donc le format parquet. Le mode overwrite remplace le contenu de la table à chaque exécution, et saveAsTable crée la table Delta managée dans la section Tables à la première exécution et l'enregistre dans le metastore.
  options:
    delta: { en: "The files are plain Parquet files, not a Delta table with a transaction log.", fr: "Les fichiers sont de simples fichiers Parquet, pas une table Delta avec un journal des transactions." }
    append: { en: "append adds the rows to the existing data instead of replacing it.", fr: "append ajoute les lignes aux données existantes au lieu de les remplacer." }
    save: { en: "save writes to a path and does not register a table named orders.", fr: "save écrit dans un chemin et n'enregistre pas de table nommée orders." }
    insert: { en: "insertInto requires a table that already exists.", fr: "insertInto exige une table qui existe déjà." }
references:
  - title: What is a lakehouse?
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-overview
  - title: Unify Data Sources With OneLake Shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
