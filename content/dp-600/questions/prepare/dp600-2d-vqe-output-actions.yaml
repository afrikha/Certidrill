id: dp600-2d-vqe-output-actions
objective: "2.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1**. You create a visual query that merges two tables of Warehouse1 and groups the result by region.

    You need to use the result of the visual query to meet the following requirements. Which action should you use for each requirement? To answer, drag the appropriate actions to the correct requirements. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1**. Vous créez une requête visuelle qui fusionne deux tables de Warehouse1 et regroupe le résultat par région.

    Vous devez utiliser le résultat de la requête visuelle pour satisfaire aux exigences suivantes. Quelle action devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les actions appropriées vers les exigences correspondantes. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: view, text: { en: "Save as view", fr: "Enregistrer en tant que vue" } }
    - { id: table, text: { en: "Save as table", fr: "Enregistrer en tant que table" } }
    - { id: excel, text: { en: "Download Excel file", fr: "Télécharger le fichier Excel" } }
    - { id: visualize, text: { en: "Visualize results", fr: "Visualiser les résultats" } }
    - { id: viewsql, text: { en: "View SQL", fr: "Afficher le SQL" } }
  targets:
    - { id: t1, text: { en: "Create an object that other users can query and that always returns the current data", fr: "Créer un objet que d'autres utilisateurs peuvent interroger et qui renvoie toujours les données actuelles" } }
    - { id: t2, text: { en: "Store a copy of the result in a new table of Warehouse1", fr: "Stocker une copie du résultat dans une nouvelle table de Warehouse1" } }
    - { id: t3, text: { en: "Analyze the result in a spreadsheet", fr: "Analyser le résultat dans une feuille de calcul" } }
    - { id: t4, text: { en: "Create a report from the result", fr: "Créer un rapport à partir du résultat" } }
answer:
  mapping: { t1: view, t2: table, t3: excel, t4: visualize }
explanation:
  correct:
    en: |
      Save as view stores the query definition as a view, which returns the current data whenever it's queried. Save as table runs CREATE TABLE AS SELECT and stores the result. Download Excel file opens the result in Excel, and Visualize results creates a report from the result.
    fr: |
      Enregistrer en tant que vue stocke la définition de la requête sous forme de vue, qui renvoie les données actuelles à chaque interrogation. Enregistrer en tant que table exécute CREATE TABLE AS SELECT et stocke le résultat. Télécharger le fichier Excel ouvre le résultat dans Excel, et Visualiser les résultats crée un rapport à partir du résultat.
  options:
    viewsql: { en: "View SQL only shows the T-SQL generated from the steps.", fr: "Afficher le SQL montre seulement le T-SQL généré à partir des étapes." }
references:
  - title: Query using the visual query editor
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/visual-query-editor
