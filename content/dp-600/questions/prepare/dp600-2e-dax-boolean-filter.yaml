id: dp600-2e-dax-boolean-filter
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Import semantic model named **SalesModel**. The **Sales** table has 400 million rows and a column named **Channel** whose values are Online and Store. The **Product** table is related to Sales.

    You run the following query in DAX query view. It returns the expected result but runs slowly.

    ```text
    EVALUATE
        CALCULATETABLE (
            SUMMARIZECOLUMNS ( 'Product'[Category], "Sales", [Total Sales] ),
            FILTER ( Sales, Sales[Channel] = "Online" )
        )
    ```

    You need to improve the performance of the query. The query must return the same result.

    With which expression should you replace the FILTER expression?
  fr: |
    Vous disposez d'un modèle sémantique en mode Import nommé **SalesModel**. La table **Sales** compte 400 millions de lignes et une colonne nommée **Channel** dont les valeurs sont Online et Store. La table **Product** est liée à Sales.

    Vous exécutez la requête suivante dans la vue de requête DAX. Elle renvoie le résultat attendu, mais s'exécute lentement.

    ```text
    EVALUATE
        CALCULATETABLE (
            SUMMARIZECOLUMNS ( 'Product'[Category], "Sales", [Total Sales] ),
            FILTER ( Sales, Sales[Channel] = "Online" )
        )
    ```

    Vous devez améliorer les performances de la requête. La requête doit renvoyer le même résultat.

    Par quelle expression devez-vous remplacer l'expression FILTER ?
body:
  options:
    - { id: a, text: "KEEPFILTERS ( FILTER ( Sales, Sales[Channel] = \"Online\" ) )" }
    - { id: b, text: "FILTER ( ALL ( Sales ), Sales[Channel] = \"Online\" )" }
    - { id: c, text: "FILTER ( VALUES ( Sales[Channel] ), [Total Sales] > 0 )" }
    - { id: d, text: "Sales[Channel] = \"Online\"" }
answer: { optionId: d }
explanation:
  correct:
    en: "A Boolean filter expression on a single column filters the Channel column directly, which the in-memory column store is optimized for. FILTER over the Sales table evaluates the condition row by row on 400 million rows, so Microsoft recommends passing filter arguments as Boolean expressions whenever possible."
    fr: "Une expression de filtre booléenne sur une seule colonne filtre directement la colonne Channel, ce pour quoi le stockage en colonnes en mémoire est optimisé. FILTER sur la table Sales évalue la condition ligne par ligne sur 400 millions de lignes ; Microsoft recommande donc de passer les arguments de filtre sous forme d'expressions booléennes chaque fois que possible."
  options:
    a:
      en: "KEEPFILTERS changes how the filter combines with existing filters, but FILTER still iterates the whole Sales table."
      fr: "KEEPFILTERS change la façon dont le filtre se combine avec les filtres existants, mais FILTER itère toujours toute la table Sales."
    b:
      en: "ALL removes the filters on Sales before the iteration, which still scans all 400 million rows."
      fr: "ALL supprime les filtres sur Sales avant l'itération, qui parcourt toujours les 400 millions de lignes."
    c:
      en: "This keeps every channel that has sales, Online and Store, so the result changes."
      fr: "Cette expression conserve chaque canal ayant des ventes, Online et Store : le résultat change."
references:
  - title: Avoid using FILTER as a filter argument in DAX
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-avoid-avoid-filter-as-filter-argument
  - title: CALCULATETABLE function (DAX)
    url: https://learn.microsoft.com/en-us/dax/calculatetable-function-dax
