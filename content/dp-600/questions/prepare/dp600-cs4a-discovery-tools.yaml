id: dp600-cs4a-discovery-tools
objective: "2.1.2"
type: dragdrop
caseStudy: dp600-cs4a-margies-travel
difficulty: 1
status: draft
stem:
  en: |
    You need to tell the marketing analysts and the report creators which Fabric experience to use. The solution must meet the second and third data requirements.

    Which experience should each user group use for each task? To answer, drag the appropriate experiences to the correct tasks. Each experience may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez indiquer aux analystes marketing et aux auteurs de rapports quelle expérience Fabric utiliser. La solution doit satisfaire les deuxième et troisième exigences relatives aux données.

    Quelle expérience chaque groupe d'utilisateurs doit-il utiliser pour chaque tâche ? Pour répondre, faites glisser les expériences appropriées vers les tâches correctes. Chaque expérience peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: rth, text: { en: "Real-Time hub", fr: "Hub Real-Time" } }
    - { id: catalog, text: { en: "OneLake catalog", fr: "Catalogue OneLake" } }
    - { id: monitor, text: { en: "Monitor hub", fr: "Hub de surveillance" } }
    - { id: lineage, text: { en: "Workspace lineage view", fr: "Vue de traçabilité de l'espace de travail" } }
    - { id: pipeline, text: { en: "Deployment pipelines", fr: "Pipelines de déploiement" } }
  targets:
    - { id: jobs, text: { en: "Marketing analysts: subscribe to the job events of the notebook runs in MT-Analytics", fr: "Analystes marketing : s'abonner aux événements de travail des exécutions de notebooks de MT-Analytics" } }
    - { id: blob, text: { en: "Marketing analysts: subscribe to the file events of stpartnerdrop", fr: "Analystes marketing : s'abonner aux événements de fichiers de stpartnerdrop" } }
    - { id: models, text: { en: "Report creators: find the endorsed semantic models of the Travel domain and request access", fr: "Auteurs de rapports : trouver les modèles sémantiques approuvés du domaine Travel et demander l'accès" } }
answer:
  mapping: { jobs: rth, blob: rth, models: catalog }
explanation:
  correct:
    en: "Real-Time hub is the tenant-wide place to discover and subscribe to events. It exposes Fabric events, such as the job events of notebook runs, and Azure events, such as Blob Storage events, and the user subscribes to them through an eventstream. The OneLake catalog lists the Fabric items that the user can access or request access to, including discoverable semantic models, and offers an Endorsed items filter and a domain selector."
    fr: "Le hub Real-Time est l'endroit, à l'échelle du locataire, où découvrir des événements et s'y abonner. Il expose les événements Fabric, comme les événements de travail des exécutions de notebooks, et les événements Azure, comme ceux du Stockage Blob, et l'utilisateur s'y abonne via un eventstream. Le catalogue OneLake liste les éléments Fabric auxquels l'utilisateur a accès ou peut demander l'accès, y compris les modèles sémantiques détectables, et propose un filtre des éléments approuvés et un sélecteur de domaine."
  options:
    monitor: { en: "The Monitor hub shows the status and history of runs such as notebooks, pipelines and refreshes, but it does not offer a subscription to job events or Azure events.", fr: "Le hub de surveillance affiche l'état et l'historique des exécutions, comme les notebooks, les pipelines et les actualisations, mais il ne propose pas d'abonnement aux événements de travail ni aux événements Azure." }
    lineage: { en: "The lineage view shows the upstream and downstream dependencies of the items of one workspace; it is not used to search a domain for endorsed models or to request access to them.", fr: "La vue de traçabilité montre les dépendances en amont et en aval des éléments d'un espace de travail ; elle ne sert pas à rechercher les modèles approuvés d'un domaine ni à en demander l'accès." }
    pipeline: { en: "Deployment pipelines promote content between stage workspaces; they are not a discovery tool.", fr: "Les pipelines de déploiement promeuvent le contenu entre les espaces de travail des étapes ; ce n'est pas un outil de découverte." }
references:
  - title: Introduction to Fabric Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/real-time-hub-overview
  - title: Find and explore data in the OneLake catalog
    url: https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-explore
