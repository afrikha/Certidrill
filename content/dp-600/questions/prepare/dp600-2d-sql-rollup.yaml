id: dp600-2d-sql-rollup
objective: "2.3.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a table named **dbo.FactSales** with the Region, Country and SalesAmount columns. Each country belongs to a single region.

    You need a query that returns the following rows in a single result set:

    - The total sales for each combination of region and country
    - A subtotal for each region
    - A grand total

    The result must not contain subtotals for a country across all regions.

    How should you complete the GROUP BY clause? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table nommée **dbo.FactSales** avec les colonnes Region, Country et SalesAmount. Chaque pays appartient à une seule région.

    Vous avez besoin d'une requête qui renvoie les lignes suivantes dans un seul jeu de résultats :

    - Le total des ventes de chaque combinaison de région et de pays
    - Un sous-total pour chaque région
    - Un total général

    Le résultat ne doit pas contenir de sous-totaux d'un pays sur l'ensemble des régions.

    Comment devez-vous compléter la clause GROUP BY ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT Region, Country, SUM(SalesAmount) AS Sales
    FROM dbo.FactSales
    GROUP BY [[g]]([[c1]], [[c2]]);
  slots:
    - id: g
      options:
        - { id: rollup, text: ROLLUP }
        - { id: cube, text: CUBE }
        - { id: sets, text: GROUPING SETS }
    - id: c1
      options:
        - { id: region, text: Region }
        - { id: country, text: Country }
    - id: c2
      options:
        - { id: region, text: Region }
        - { id: country, text: Country }
answer:
  values: { g: rollup, c1: region, c2: country }
explanation:
  correct:
    en: "`ROLLUP(Region, Country)` returns the (Region, Country) groups, then removes the columns from right to left: one subtotal per region (Country is NULL) and a grand total (both columns NULL). The column order matters, because ROLLUP builds the subtotals on the leading columns."
    fr: "`ROLLUP(Region, Country)` renvoie les groupes (Region, Country), puis retire les colonnes de droite à gauche : un sous-total par région (Country vaut NULL) et un total général (les deux colonnes valent NULL). L'ordre des colonnes compte, car ROLLUP construit les sous-totaux sur les premières colonnes."
  options:
    cube: { en: "CUBE returns all combinations, so it also adds a subtotal for each country across all regions.", fr: "CUBE renvoie toutes les combinaisons : il ajoute aussi un sous-total par pays sur l'ensemble des régions." }
    sets: { en: "GROUPING SETS(Region, Country) returns one grouping by region and one by country, without the detail rows or a grand total.", fr: "GROUPING SETS(Region, Country) renvoie un regroupement par région et un par pays, sans lignes de détail ni total général." }
    country: { en: "ROLLUP(Country, Region) would return a subtotal for each country instead of each region.", fr: "ROLLUP(Country, Region) renverrait un sous-total par pays au lieu d'un sous-total par région." }
references:
  - title: SELECT - GROUP BY clause (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-group-by-transact-sql
