id: dp600-2b-sm-tmsl-export
objective: "2.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Import semantic model named SM-Sales in a workspace on a Fabric capacity. OneLake integration is turned on for SM-Sales, and XMLA read-write is enabled.

    You need to write the current data of SM-Sales to OneLake on demand from SQL Server Management Studio.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique Import nommé SM-Sales dans un espace de travail sur une capacité Fabric. L'intégration OneLake est activée pour SM-Sales, et la lecture-écriture XMLA est activée.

    Vous devez écrire à la demande les données actuelles de SM-Sales dans OneLake depuis SQL Server Management Studio.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "[[cmd]]": {
        "layout": "[[layout]]",
        "type": "full",
        "objects": [
          {
            "database": "SM-Sales"
          }
        ]
      }
    }
  slots:
    - id: cmd
      options:
        - { id: export, text: export }
        - { id: refresh, text: refresh }
        - { id: backup, text: backup }
        - { id: createorreplace, text: createOrReplace }
    - id: layout
      options:
        - { id: delta, text: delta }
        - { id: parquet, text: parquet }
        - { id: csv, text: csv }
answer:
  values: { cmd: export, layout: delta }
explanation:
  correct:
    en: |
      With XMLA read-write enabled, a TMSL `export` command with the `delta` layout writes the Import tables of the model to Delta tables in OneLake, the same output as OneLake integration produces after a refresh. You can run it in SSMS or with the Tabular Object Model.
    fr: |
      Avec la lecture-écriture XMLA activée, une commande TMSL `export` avec la disposition `delta` écrit les tables Import du modèle dans des tables Delta de OneLake, comme l'intégration OneLake après une actualisation. Vous pouvez l'exécuter dans SSMS ou avec le modèle objet tabulaire (TOM).
  options:
    refresh: { en: "refresh reloads data from the sources; it is not the command that exports the model data.", fr: "refresh recharge les données depuis les sources ; ce n'est pas la commande qui exporte les données du modèle." }
    backup: { en: "backup creates an .abf backup file of the model, not Delta tables in OneLake.", fr: "backup crée un fichier de sauvegarde .abf du modèle, pas des tables Delta dans OneLake." }
    createorreplace: { en: "createOrReplace deploys model metadata; it doesn't export data.", fr: "createOrReplace déploie les métadonnées du modèle ; il n'exporte pas de données." }
    parquet: { en: "OneLake integration writes Delta tables, so the layout is delta.", fr: "L'intégration OneLake écrit des tables Delta : la disposition est delta." }
    csv: { en: "OneLake integration writes Delta tables, so the layout is delta.", fr: "L'intégration OneLake écrit des tables Delta : la disposition est delta." }
references:
  - title: Learn about Microsoft OneLake Delta table integration in Power BI and Microsoft Fabric
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/onelake-integration-overview
