difficulty: 1
status: draft
stem:
  en: You merge Customers with Orders by using a left anti join.
  fr: Vous fusionnez Customers avec Orders par une anti-jointure gauche.
body:
  solution:
    en: |
      You select the Customers query and select **Merge queries as new**. You select Orders as the second table, match the `CustomerID` columns, and select the **Left anti** join kind. In the new query, you remove the Orders column.
    fr: |
      Vous sélectionnez la requête Customers, puis **Requêtes de fusion en tant que nouvelles** (Merge queries as new). Vous sélectionnez Orders comme deuxième table, vous associez les colonnes `CustomerID` et vous choisissez le type de jointure **Anti jointure gauche** (Left anti). Dans la nouvelle requête, vous supprimez la colonne Orders.
answer: { value: true }
explanation:
  correct:
    en: |
      Customers is the left table because it is selected first. A left anti join returns only the rows of Customers that have no matching row in Orders, once each, so the result lists the customers without orders. The merge adds an Orders column of empty tables, which you remove to keep only the Customers columns.
    fr: |
      Customers est la table de gauche, car elle est sélectionnée en premier. Une anti-jointure gauche ne renvoie que les lignes de Customers sans ligne correspondante dans Orders, une fois chacune : le résultat liste les clients sans commande. La fusion ajoute une colonne Orders de tables vides, que vous supprimez pour ne garder que les colonnes de Customers.
references:
  - title: Left anti join
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-left-anti
