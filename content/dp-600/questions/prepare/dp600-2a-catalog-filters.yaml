id: dp600-2a-catalog-filters
objective: "2.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Your organization uses Fabric domains. You open the Explore tab of the OneLake catalog with All workspaces selected.

    You need to list only the certified and promoted items that belong to the Finance domain.

    Which two features should you use? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre organisation utilise des domaines Fabric. Vous ouvrez l'onglet Explore du catalogue OneLake avec All workspaces sélectionné.

    Vous devez lister uniquement les éléments certifiés et promus qui appartiennent au domaine Finance.

    Quelles sont les deux fonctionnalités que vous devez utiliser ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Endorsed items filter", fr: "Le filtre Endorsed items" } }
    - { id: b, text: { en: "The My items filter", fr: "Le filtre My items" } }
    - { id: c, text: { en: "The Favorites filter", fr: "Le filtre Favorites" } }
    - { id: d, text: { en: "The domain selector", fr: "Le sélecteur de domaine" } }
    - { id: e, text: { en: "The Govern tab", fr: "L'onglet Govern" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      The domain selector limits the catalog to the items of a domain or subdomain, and the Endorsed items filter keeps only certified and promoted items. The predefined filters work across workspaces when All workspaces is selected.
    fr: |
      Le sélecteur de domaine limite le catalogue aux éléments d'un domaine ou d'un sous-domaine, et le filtre Endorsed items ne conserve que les éléments certifiés et promus. Les filtres prédéfinis fonctionnent sur tous les espaces de travail quand All workspaces est sélectionné.
  options:
    b:
      en: My items keeps only the items you own, which is not the requirement.
      fr: My items ne conserve que les éléments dont vous êtes propriétaire, ce qui n'est pas le besoin.
    c:
      en: Favorites keeps only the items you marked as favorites.
      fr: Favorites ne conserve que les éléments que vous avez marqués comme favoris.
    e:
      en: The Govern tab shows governance insights, not a filtered list of items.
      fr: L'onglet Govern affiche des informations de gouvernance, pas une liste filtrée d'éléments.
references:
  - title: Find and explore data in the OneLake catalog
    url: https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-explore
