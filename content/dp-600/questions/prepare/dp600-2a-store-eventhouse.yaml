id: dp600-2a-store-eventhouse
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The supply chain team at Northwind receives about three billion events per day from sensors and shipment trackers. The events are JSON documents that contain free-text comments.

    Analysts need interactive queries that use time series and geospatial functions on data that is only seconds old, and dashboards that refresh quickly.

    Which Fabric data store should you recommend?
  fr: |
    L'équipe chaîne logistique de Northwind reçoit environ trois milliards d'événements par jour provenant de capteurs et de traceurs d'expédition. Les événements sont des documents JSON qui contiennent des commentaires en texte libre.

    Les analystes ont besoin de requêtes interactives qui utilisent des fonctions de séries chronologiques et géospatiales sur des données vieilles de quelques secondes seulement, et de tableaux de bord qui s'actualisent rapidement.

    Quel magasin de données Fabric devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A lakehouse", fr: "Un lakehouse" } }
    - { id: b, text: { en: "A warehouse", fr: "Un entrepôt" } }
    - { id: c, text: { en: "An eventhouse", fr: "Un eventhouse" } }
    - { id: d, text: { en: "A SQL database", fr: "Une base de données SQL" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An eventhouse is designed for streaming, time-based event data and semi-structured or free-text content, and it queries billions of events in seconds with KQL. It offers time series and geospatial analytics and fast queries for real-time dashboards.
    fr: |
      Un eventhouse est conçu pour les données d'événements de streaming horodatées et pour les contenus semi-structurés ou en texte libre, et il interroge des milliards d'événements en quelques secondes avec KQL. Il offre des analyses de séries chronologiques et géospatiales et des requêtes rapides pour les tableaux de bord en temps réel.
  options:
    a:
      en: A lakehouse suits Spark engineering on files and Delta tables, not interactive analysis of seconds-old events.
      fr: Un lakehouse convient à l'ingénierie Spark sur des fichiers et des tables Delta, pas à l'analyse interactive d'événements vieux de quelques secondes.
    b:
      en: A warehouse targets structured data in star schemas loaded with T-SQL, not high-volume semi-structured event streams.
      fr: Un entrepôt vise des données structurées en schéma en étoile chargées en T-SQL, pas des flux d'événements semi-structurés à fort volume.
    d:
      en: A SQL database is an operational OLTP store for applications, not an engine for billions of events per day.
      fr: Une base de données SQL est un magasin opérationnel OLTP pour les applications, pas un moteur pour des milliards d'événements par jour.
references:
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
  - title: Eventhouse overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/eventhouse
