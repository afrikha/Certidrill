id: dp600-2a-blob-events-gpv1
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 on a Fabric capacity in a region that supports Azure events. You have the Contributor role in Workspace1.

    You plan to use Real-Time hub to get the Azure Blob Storage events of a storage account named stlegacy01, so that an Activator alert notifies a team when blobs are deleted. You discover that stlegacy01 is a general-purpose v1 storage account.

    What should you do first?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 sur une capacité Fabric, dans une région qui prend en charge les événements Azure. Vous avez le rôle Contributor dans Workspace1.

    Vous prévoyez d'utiliser le hub Real-Time pour obtenir les événements Stockage Blob Azure d'un compte de stockage nommé stlegacy01, afin qu'une alerte Activator prévienne une équipe quand des blobs sont supprimés. Vous découvrez que stlegacy01 est un compte de stockage universel v1.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Enable the hierarchical namespace on stlegacy01.", fr: "Activer l'espace de noms hiérarchique sur stlegacy01." } }
    - { id: b, text: { en: "Request the Admin role in Workspace1.", fr: "Demander le rôle Admin dans Workspace1." } }
    - { id: c, text: { en: "Subscribe to the workspace item events of Workspace1.", fr: "S'abonner aux événements d'éléments d'espace de travail de Workspace1." } }
    - { id: d, text: { en: "Upgrade stlegacy01 to a general-purpose v2 account.", fr: "Mettre à niveau stlegacy01 vers un compte universel v2." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure Blob Storage events in Real-Time hub support StorageV2 (general-purpose v2), BlockBlobStorage and BlobStorage accounts; general-purpose v1 accounts are not supported. After the upgrade, you connect the account from the Azure events category and set the alert on the BlobDeleted event.
    fr: |
      Les événements Stockage Blob Azure du hub Real-Time prennent en charge les comptes StorageV2 (universel v2), BlockBlobStorage et BlobStorage ; les comptes universels v1 ne sont pas pris en charge. Après la mise à niveau, vous connectez le compte depuis la catégorie Azure events et définissez l'alerte sur l'événement BlobDeleted.
  options:
    a:
      en: The hierarchical namespace is not a requirement for blob events, and the account kind would still be unsupported.
      fr: L'espace de noms hiérarchique n'est pas une condition des événements de blob, et le type de compte resterait non pris en charge.
    b:
      en: The Contributor role in the workspace is already enough to get Azure Blob Storage events.
      fr: Le rôle Contributor dans l'espace de travail suffit déjà pour obtenir les événements Stockage Blob Azure.
    c:
      en: Workspace item events report changes to Fabric items, not blob operations in an Azure storage account.
      fr: Les événements d'éléments d'espace de travail signalent les modifications d'éléments Fabric, pas les opérations sur les blobs d'un compte de stockage Azure.
references:
  - title: Get Azure Blob Storage events in Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/get-azure-blob-storage-events
