id: dp600-2d-endpoint-delta-mapping
objective: "2.2.8"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have a lakehouse named **Lakehouse1**. A notebook creates a Delta table named **telemetry** in Lakehouse1. The table has the following columns:

    | Column | Delta data type |
    | --- | --- |
    | SensorLevel | TINYINT |
    | DeviceName | STRING |
    | ReadingTime | TIMESTAMP |
    | Reading | DOUBLE |

    Analysts query the table by using the SQL analytics endpoint of Lakehouse1.

    Which SQL data type does the SQL analytics endpoint show for each column? To answer, drag the appropriate data types to the correct columns. Each data type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse nommé **Lakehouse1**. Un notebook crée dans Lakehouse1 une table Delta nommée **telemetry**. La table comporte les colonnes suivantes :

    | Colonne | Type de données Delta |
    | --- | --- |
    | SensorLevel | TINYINT |
    | DeviceName | STRING |
    | ReadingTime | TIMESTAMP |
    | Reading | DOUBLE |

    Des analystes interrogent la table à l'aide du point de terminaison d'analytique SQL de Lakehouse1.

    Quel type de données SQL le point de terminaison d'analytique SQL affiche-t-il pour chaque colonne ? Pour répondre, faites glisser les types de données appropriés vers les colonnes correspondantes. Chaque type de données peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: smallint, text: smallint }
    - { id: int, text: int }
    - { id: varchar, text: varchar(8000) }
    - { id: dt2, text: datetime2 }
    - { id: float, text: float }
    - { id: real, text: real }
  targets:
    - { id: level, text: "SensorLevel (TINYINT)" }
    - { id: name, text: "DeviceName (STRING)" }
    - { id: time, text: "ReadingTime (TIMESTAMP)" }
    - { id: reading, text: "Reading (DOUBLE)" }
answer:
  mapping: { level: smallint, name: varchar, time: dt2, reading: float }
explanation:
  correct:
    en: |
      The SQL analytics endpoint generates its column types from the Delta types. TINYINT becomes `smallint` (there is no tinyint in Fabric SQL tables), STRING becomes `varchar(8000)` in a lakehouse endpoint, TIMESTAMP becomes `datetime2`, and the 8-byte DOUBLE becomes `float`. The 4-byte Delta FLOAT would become `real`.
    fr: |
      Le point de terminaison d'analytique SQL génère les types de ses colonnes à partir des types Delta. TINYINT devient `smallint` (il n'y a pas de tinyint dans les tables SQL de Fabric), STRING devient `varchar(8000)` dans le point de terminaison d'un lakehouse, TIMESTAMP devient `datetime2` et le DOUBLE sur 8 octets devient `float`. Le FLOAT Delta sur 4 octets deviendrait `real`.
  options:
    int: { en: "int is used for the Delta INT and INTEGER types.", fr: "int correspond aux types Delta INT et INTEGER." }
    real: { en: "real is used for the Delta FLOAT and REAL types, not for DOUBLE.", fr: "real correspond aux types Delta FLOAT et REAL, pas à DOUBLE." }
references:
  - title: Data Types in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-types
