id: dp600-2a-shortcut-passthrough
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have two Fabric workspaces:

    | Workspace | Item | Content |
    | --- | --- | --- |
    | WS-Sales | LH-Sales (lakehouse) | Delta tables and a OneLake shortcut named Products in the Tables section |
    | WS-Ref | LH-Ref (lakehouse) | Delta table named Products, the target of the shortcut |

    The Products shortcut was created with the default authentication. User1 has the Viewer role in WS-Sales and no access to WS-Ref or LH-Ref. User1 can preview every table of LH-Sales in the lakehouse explorer except Products.

    You need to ensure that User1 can read Products through the shortcut. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez de deux espaces de travail Fabric :

    | Espace de travail | Élément | Contenu |
    | --- | --- | --- |
    | WS-Sales | LH-Sales (lakehouse) | Des tables Delta et un raccourci OneLake nommé Products dans la section Tables |
    | WS-Ref | LH-Ref (lakehouse) | Une table Delta nommée Products, cible du raccourci |

    Le raccourci Products a été créé avec l'authentification par défaut. User1 a le rôle Viewer dans WS-Sales et aucun accès à WS-Ref ni à LH-Ref. User1 peut afficher un aperçu de toutes les tables de LH-Sales dans l'explorateur du lakehouse, sauf Products.

    Vous devez faire en sorte que User1 puisse lire Products via le raccourci. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign User1 the Contributor role in WS-Sales.", fr: "Attribuer à User1 le rôle Contributor dans WS-Sales." } }
    - { id: b, text: { en: "Grant User1 read access to the data of LH-Ref.", fr: "Accorder à User1 un accès en lecture aux données de LH-Ref." } }
    - { id: c, text: { en: "Assign User1 the Member role in WS-Ref.", fr: "Attribuer à User1 le rôle Member dans WS-Ref." } }
    - { id: d, text: { en: "Move the Products shortcut to the Files section of LH-Sales.", fr: "Déplacer le raccourci Products dans la section Files de LH-Sales." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Internal OneLake shortcuts use passthrough authentication by default: OneLake checks the identity of the caller against the target. User1 already has read access to the shortcut path in LH-Sales, so the missing permission is read access to the target data in LH-Ref.
    fr: |
      Les raccourcis OneLake internes utilisent par défaut l'authentification directe (passthrough) : OneLake vérifie l'identité de l'appelant sur la cible. User1 a déjà un accès en lecture au chemin du raccourci dans LH-Sales : l'autorisation manquante est l'accès en lecture aux données cibles de LH-Ref.
  options:
    a:
      en: A higher role in WS-Sales does not give access to the target in WS-Ref; the most restrictive permission of the two locations still applies.
      fr: Un rôle plus élevé dans WS-Sales ne donne pas accès à la cible dans WS-Ref ; l'autorisation la plus restrictive des deux emplacements s'applique toujours.
    c:
      en: Member would work but lets User1 manage the content of WS-Ref, far more than reading one table.
      fr: Member fonctionnerait, mais permet à User1 de gérer le contenu de WS-Ref, bien plus que la lecture d'une table.
    d:
      en: Moving the shortcut does not change the identity check on the target, and the table would no longer be discovered.
      fr: Déplacer le raccourci ne change pas la vérification de l'identité sur la cible, et la table ne serait plus découverte.
references:
  - title: OneLake shortcut security
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcut-security
