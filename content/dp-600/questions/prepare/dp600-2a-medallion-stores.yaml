id: dp600-2a-medallion-stores
objective: "2.1.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware is designing a medallion architecture in a Fabric workspace named Workspace1:

    - Data scientists land raw images, CSV and JSON files, and build cleansed Delta tables (silver) with Spark.
    - SQL developers build the gold star schema with T-SQL stored procedures that update a fact table and several dimension tables in one transaction. The procedures read the silver tables, which must not be copied to another item first.

    You need to recommend a design that minimizes the number of items.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware conçoit une architecture en médaillon dans un espace de travail Fabric nommé Workspace1 :

    - Les scientifiques des données déposent des images, des fichiers CSV et JSON bruts, et construisent des tables Delta nettoyées (silver) avec Spark.
    - Les développeurs SQL construisent le schéma en étoile gold avec des procédures stockées T-SQL qui mettent à jour une table de faits et plusieurs tables de dimension dans une seule transaction. Les procédures lisent les tables silver, qui ne doivent pas être copiées au préalable dans un autre élément.

    Vous devez recommander une conception qui réduit au minimum le nombre d'éléments.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Store for the raw files and the silver tables: [[raw]]
      Store for the gold star schema: [[gold]]
      In the stored procedures, read the silver tables by using: [[read]]
    fr: |
      Magasin des fichiers bruts et des tables silver : [[raw]]
      Magasin du schéma en étoile gold : [[gold]]
      Dans les procédures stockées, lire les tables silver à l'aide de : [[read]]
  slots:
    - id: raw
      options:
        - { id: lh, text: { en: "A lakehouse", fr: "Un lakehouse" } }
        - { id: whraw, text: { en: "A warehouse", fr: "Un entrepôt" } }
        - { id: eh, text: { en: "An eventhouse", fr: "Un eventhouse" } }
    - id: gold
      options:
        - { id: lhep, text: { en: "The SQL analytics endpoint of the same lakehouse", fr: "Le point de terminaison d'analytique SQL du même lakehouse" } }
        - { id: wh, text: { en: "A warehouse", fr: "Un entrepôt" } }
        - { id: eh, text: { en: "An eventhouse", fr: "Un eventhouse" } }
    - id: read
      options:
        - { id: copyinto, text: { en: "COPY INTO statements that load the Delta table folders", fr: "Des instructions COPY INTO qui chargent les dossiers des tables Delta" } }
        - { id: mirror, text: { en: "A mirrored database of the lakehouse", fr: "Une base de données en miroir du lakehouse" } }
        - { id: threepart, text: { en: "Three-part names, such as LH_Silver.dbo.Customers", fr: "Des noms en trois parties, comme LH_Silver.dbo.Customers" } }
answer:
  values: { raw: lh, gold: wh, read: threepart }
explanation:
  correct:
    en: |
      Raw files of any format and Spark-built Delta tables belong in a lakehouse. The gold layer needs T-SQL writes and multi-table transactions, which only the warehouse provides. A warehouse query can reference the Delta tables of a lakehouse in the same workspace with three-part names, so the procedures read silver directly with no copy and no extra item.
    fr: |
      Les fichiers bruts de tout format et les tables Delta construites avec Spark relèvent d'un lakehouse. La couche gold exige des écritures T-SQL et des transactions multitables, que seul l'entrepôt fournit. Une requête d'entrepôt peut référencer les tables Delta d'un lakehouse du même espace de travail avec des noms en trois parties : les procédures lisent donc silver directement, sans copie ni élément supplémentaire.
  options:
    whraw: { en: "A warehouse stores structured data only, not raw images or files.", fr: "Un entrepôt ne stocke que des données structurées, pas des images ni des fichiers bruts." }
    lhep: { en: "The SQL analytics endpoint is read-only, so stored procedures cannot update the gold tables there.", fr: "Le point de terminaison d'analytique SQL est en lecture seule : des procédures stockées ne peuvent pas y mettre à jour les tables gold." }
    copyinto: { en: "COPY INTO copies the data into the warehouse, which the requirement forbids.", fr: "COPY INTO copie les données dans l'entrepôt, ce que l'exigence interdit." }
    mirror: { en: "Mirroring replicates external databases; a lakehouse is not a mirroring source, and it would add an item.", fr: "La mise en miroir réplique des bases de données externes ; un lakehouse n'est pas une source de mise en miroir, et cela ajouterait un élément." }
references:
  - title: "Microsoft Fabric decision guide: Choose between Warehouse and Lakehouse"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-lakehouse-warehouse
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
