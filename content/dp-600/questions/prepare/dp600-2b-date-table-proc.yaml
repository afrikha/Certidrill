id: dp600-2b-date-table-proc
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named Warehouse1 that is the source of several Direct Lake semantic models. No source system provides calendar data.

    You need to add a table named dbo.DimDate to Warehouse1 that has one row per day from 2015 through 2035, with calendar and fiscal attributes. The table must be extended by several years at the start of each year by using the same logic.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé Warehouse1, source de plusieurs modèles sémantiques Direct Lake. Aucun système source ne fournit de données de calendrier.

    Vous devez ajouter à Warehouse1 une table nommée dbo.DimDate qui comporte une ligne par jour de 2015 à 2035, avec des attributs calendaires et fiscaux. La table doit être étendue de plusieurs années au début de chaque année avec la même logique.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Write the date generation logic in T-SQL in a stored procedure, and run it from a pipeline at the start of each year.", fr: "Écrire la logique de génération des dates en T-SQL dans une procédure stockée, et l'exécuter depuis un pipeline au début de chaque année." } }
    - { id: b, text: { en: "Create a calculated table that uses the DAX CALENDAR function in each semantic model.", fr: "Créer une table calculée qui utilise la fonction DAX CALENDAR dans chaque modèle sémantique." } }
    - { id: c, text: { en: "Create a view in Warehouse1 that generates the dates by using a recursive common table expression.", fr: "Créer une vue dans Warehouse1 qui génère les dates avec une expression de table commune récursive." } }
    - { id: d, text: { en: "Create a materialized view in Warehouse1 that calculates the dates and their attributes.", fr: "Créer une vue matérialisée dans Warehouse1 qui calcule les dates et leurs attributs." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A date dimension is usually generated by fixed logic rather than loaded from a source. Learn recommends writing that logic in T-SQL, encapsulating it in a stored procedure, and running it at the start of each year to extend the table. The table then lives once in Warehouse1 and every model uses the same dates.
    fr: |
      Une dimension de date est généralement générée par une logique fixe plutôt que chargée depuis une source. Learn recommande d'écrire cette logique en T-SQL, de l'encapsuler dans une procédure stockée et de l'exécuter au début de chaque année pour étendre la table. La table existe alors une seule fois dans Warehouse1 et tous les modèles utilisent les mêmes dates.
  options:
    b:
      en: |
        A DAX table lives in each model, not in Warehouse1, and duplicates the logic in every model.
      fr: |
        Une table DAX se trouve dans chaque modèle, pas dans Warehouse1, et duplique la logique dans chaque modèle.
    c:
      en: |
        Recursive queries are not supported in Fabric Data Warehouse.
      fr: |
        Les requêtes récursives ne sont pas prises en charge dans Fabric Data Warehouse.
    d:
      en: |
        Materialized views are not supported in Fabric Data Warehouse.
      fr: |
        Les vues matérialisées ne sont pas prises en charge dans Fabric Data Warehouse.
references:
  - title: Load Tables in a Dimensional Model
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
  - title: T-SQL Surface Area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
