id: dp600-2b-pq-add-column-features
objective: "2.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are enriching queries in a Dataflow Gen2 by using the Add column tab of the Power Query editor.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous enrichissez des requêtes d'un Dataflow Gen2 à l'aide de l'onglet Ajouter une colonne de l'éditeur Power Query.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: custom, text: { en: "Custom column", fr: "Colonne personnalisée" } }
    - { id: conditional, text: { en: "Conditional column", fr: "Colonne conditionnelle" } }
    - { id: examples, text: { en: "Column from examples", fr: "Colonne à partir d'exemples" } }
    - { id: index, text: { en: "Index column", fr: "Colonne d'index" } }
    - { id: duplicate, text: { en: "Duplicate column", fr: "Dupliquer la colonne" } }
  targets:
    - { id: t1, text: { en: "Number the rows 1, 2, 3 and so on", fr: "Numéroter les lignes 1, 2, 3, etc." } }
    - { id: t2, text: { en: "Type a few expected results, such as \"Enders, Maria\", and let Power Query infer the transformation", fr: "Saisir quelques résultats attendus, comme « Enders, Maria », et laisser Power Query déduire la transformation" } }
    - { id: t3, text: { en: "Define if, else if and else rules in a dialog, without writing a formula", fr: "Définir des règles si, sinon si et sinon dans une boîte de dialogue, sans écrire de formule" } }
answer:
  mapping: { t1: index, t2: examples, t3: conditional }
explanation:
  correct:
    en: |
      An index column adds position values; its Custom option sets the starting index (1) and the increment. Column from examples infers the transformation from the sample outputs you type and shows the generated M formula. A conditional column is built from clauses tested top to bottom, with a final Else value, in a dialog. A custom column requires an M formula, and Duplicate column only copies a column.
    fr: |
      Une colonne d'index ajoute des valeurs de position ; son option Personnalisé définit l'index de départ (1) et l'incrément. Colonne à partir d'exemples déduit la transformation des résultats que vous saisissez et affiche la formule M générée. Une colonne conditionnelle se construit dans une boîte de dialogue à partir de clauses testées de haut en bas, avec une valeur Sinon finale. Une colonne personnalisée exige une formule M, et Dupliquer la colonne ne fait que copier une colonne.
references:
  - title: Add a column from examples
    url: https://learn.microsoft.com/en-us/power-query/column-from-example
  - title: Add a conditional column
    url: https://learn.microsoft.com/en-us/power-query/add-conditional-column
