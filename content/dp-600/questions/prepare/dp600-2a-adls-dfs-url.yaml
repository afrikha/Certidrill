id: dp600-2a-adls-dfs-url
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric lakehouse named LH1. You have an Azure storage account named stcontosoraw that has the hierarchical namespace enabled. stcontosoraw contains a container named raw.

    You need to create a connection for an Azure Data Lake Storage Gen2 shortcut in LH1 that will point to the raw/sales directory.

    Which URL should you enter in the connection settings?
  fr: |
    Vous disposez d'un lakehouse Fabric nommé LH1. Vous disposez d'un compte de stockage Azure nommé stcontosoraw dont l'espace de noms hiérarchique est activé. stcontosoraw contient un conteneur nommé raw.

    Vous devez créer une connexion pour un raccourci Azure Data Lake Storage Gen2 dans LH1 qui pointera vers le répertoire raw/sales.

    Quelle URL devez-vous saisir dans les paramètres de la connexion ?
body:
  options:
    - { id: a, text: "https://stcontosoraw.blob.core.windows.net" }
    - { id: b, text: "https://onelake.dfs.fabric.microsoft.com/stcontosoraw" }
    - { id: c, text: "https://stcontosoraw.file.core.windows.net" }
    - { id: d, text: "https://stcontosoraw.dfs.core.windows.net" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An ADLS Gen2 shortcut must use the DFS endpoint of the storage account, in the form https://<account>.dfs.core.windows.net. You then select a target path that includes at least the container name, here raw/sales.
    fr: |
      Un raccourci ADLS Gen2 doit utiliser le point de terminaison DFS du compte de stockage, de la forme https://<compte>.dfs.core.windows.net. Vous sélectionnez ensuite un chemin cible qui inclut au moins le nom du conteneur, ici raw/sales.
  options:
    a:
      en: ADLS Gen2 shortcuts do not accept the Blob endpoint; they require the DFS endpoint.
      fr: Les raccourcis ADLS Gen2 n'acceptent pas le point de terminaison Blob ; ils exigent le point de terminaison DFS.
    b:
      en: The OneLake endpoint addresses Fabric workspaces and items, not an external storage account.
      fr: Le point de terminaison OneLake adresse des espaces de travail et des éléments Fabric, pas un compte de stockage externe.
    c:
      en: The file endpoint is for Azure Files shares, which are not an ADLS Gen2 shortcut target.
      fr: Le point de terminaison file sert aux partages Azure Files, qui ne sont pas une cible de raccourci ADLS Gen2.
references:
  - title: Create an Azure Data Lake Storage Gen2 shortcut
    url: https://learn.microsoft.com/en-us/fabric/onelake/create-adls-shortcut
