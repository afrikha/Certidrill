id: dp600-2c-denorm-junk-dimension
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named **WH1** that contains a fact table named **FactOrder**. FactOrder has three text columns with few distinct values: **OrderStatus** (5 values), **DeliveryStatus** (4 values) and **PaymentMethod** (3 values).

    You need to change the design so that the fact table has fewer columns and the semantic model shows as few dimension tables as possible. Users must still be able to filter by each of the three attributes.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé **WH1** qui contient une table de faits nommée **FactOrder**. FactOrder possède trois colonnes de texte avec peu de valeurs distinctes : **OrderStatus** (5 valeurs), **DeliveryStatus** (4 valeurs) et **PaymentMethod** (3 valeurs).

    Vous devez modifier la conception afin que la table de faits ait moins de colonnes et que le modèle sémantique affiche le moins de tables de dimension possible. Les utilisateurs doivent toujours pouvoir filtrer sur chacun des trois attributs.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create three dimension tables, one per attribute, and store three keys in FactOrder.", fr: "Créer trois tables de dimension, une par attribut, puis stocker trois clés dans FactOrder." }
    - id: b
      text: { en: "Create one dimension that holds every combination of the three attributes, and store its key in FactOrder.", fr: "Créer une dimension qui contient toutes les combinaisons des trois attributs, puis stocker sa clé dans FactOrder." }
    - id: c
      text: { en: "Keep the three columns in FactOrder, and treat each column as a degenerate dimension.", fr: "Conserver les trois colonnes dans FactOrder et traiter chaque colonne comme une dimension dégénérée." }
    - id: d
      text: { en: "Create one status dimension, and relate it to FactOrder three times as a role-playing dimension.", fr: "Créer une dimension des statuts, puis la relier trois fois à FactOrder comme dimension de rôle." }
answer: { optionId: b }
explanation:
  correct:
    en: "A junk dimension consolidates small, low-cardinality attributes into one table, typically the Cartesian product of their values (5 x 4 x 3 = 60 rows) with a surrogate key. FactOrder replaces three text columns with one key, and the model gains a single dimension table."
    fr: "Une dimension fourre-tout regroupe des attributs à faible cardinalité dans une seule table, en général le produit cartésien de leurs valeurs (5 x 4 x 3 = 60 lignes) avec une clé de substitution. FactOrder remplace trois colonnes de texte par une seule clé, et le modèle ne gagne qu'une table de dimension."
  options:
    a: { en: "Three tables and three keys don't reduce the number of fact columns and add more tables than a junk dimension.", fr: "Trois tables et trois clés ne réduisent pas le nombre de colonnes de faits et ajoutent plus de tables qu'une dimension fourre-tout." }
    c: { en: "The fact table keeps its three columns, so its width doesn't decrease.", fr: "La table de faits conserve ses trois colonnes : sa largeur ne diminue pas." }
    d: { en: "A role-playing dimension reuses one dimension for several roles of the same kind of key, such as dates; it still needs three keys.", fr: "Une dimension de rôle réutilise une dimension pour plusieurs rôles d'un même type de clé, comme les dates ; elle exige toujours trois clés." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Dimension tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
