id: dp600-2d-pq-using-locale
objective: "2.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a Dataflow Gen2 named **Dataflow1**. Dataflow1 reads a CSV file sent by a French supplier. The file contains dates such as `31/12/2026` and amounts such as `1250,50`.

    The regional settings of the dataflow are set to English (United States). When you change the type of the date column to **Date** and the amount column to **Decimal number**, most values return errors.

    You need to convert both columns correctly without changing the regional settings of the dataflow.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un Dataflow Gen2 nommé **Dataflow1**. Dataflow1 lit un fichier CSV envoyé par un fournisseur français. Le fichier contient des dates comme `31/12/2026` et des montants comme `1250,50`.

    Les paramètres régionaux du dataflow sont définis sur Anglais (États-Unis). Quand vous modifiez le type de la colonne de date en **Date** et celui de la colonne de montant en **Nombre décimal**, la plupart des valeurs renvoient des erreurs.

    Vous devez convertir correctement les deux colonnes sans modifier les paramètres régionaux du dataflow.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Use Change type > Using locale and select French (France) for both columns.", fr: "Utiliser Modifier le type > Utilisation des paramètres régionaux et sélectionner Français (France) pour les deux colonnes." } }
    - { id: b, text: { en: "Use Detect data type on both columns after the Promoted headers step.", fr: "Utiliser Détecter le type de données sur les deux colonnes après l'étape En-têtes promus." } }
    - { id: c, text: { en: "Use Replace errors on both columns after the Changed type step.", fr: "Utiliser Remplacer les erreurs sur les deux colonnes après l'étape Type modifié." } }
    - { id: d, text: { en: "Change the type of the date column to Date/Time/Timezone and the amount column to Fixed decimal number.", fr: "Modifier le type de la colonne de date en Date/Heure/Fuseau horaire et celui de la colonne de montant en Nombre décimal fixe." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The locale controls how text is interpreted during a type conversion. With English (United States), `31/12/2026` is read as month 31 and the decimal comma isn't recognized. Change type > Using locale converts a column with the culture of the source, here French (France), without changing the regional settings of the whole dataflow.
    fr: |
      Les paramètres régionaux déterminent l'interprétation du texte lors d'une conversion de type. Avec Anglais (États-Unis), `31/12/2026` est lu comme le mois 31 et la virgule décimale n'est pas reconnue. Modifier le type > Utilisation des paramètres régionaux convertit une colonne avec la culture de la source, ici Français (France), sans modifier les paramètres régionaux de tout le dataflow.
  options:
    b: { en: "Type detection still uses the dataflow's locale, so it can't read the French formats correctly.", fr: "La détection de type utilise toujours les paramètres régionaux du dataflow : elle ne peut pas lire correctement les formats français." }
    c: { en: "Replace errors hides the errors with another value; the original dates and amounts are still lost.", fr: "Remplacer les erreurs masque les erreurs par une autre valeur ; les dates et montants d'origine restent perdus." }
    d: { en: "The target type isn't the problem: any type conversion from text uses the U.S. locale and fails on these values.", fr: "Le type cible n'est pas le problème : toute conversion depuis du texte utilise les paramètres régionaux américains et échoue sur ces valeurs." }
references:
  - title: Data types in Power Query
    url: https://learn.microsoft.com/en-us/power-query/data-types
