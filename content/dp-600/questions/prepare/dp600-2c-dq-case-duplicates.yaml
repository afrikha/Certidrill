id: dp600-2c-dq-case-duplicates
objective: "2.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Dataflow Gen2 that contains a query named **Contacts**. The query has an **Email** column of type Text. You select the Email column and use **Remove duplicates**.

    The result still contains rows such as anna@contoso.com and Anna@Contoso.com, which are the same contact.

    You need to keep only one row per email address, regardless of letter case. Any of the duplicate rows can be kept.

    What should you do?
  fr: |
    Vous disposez d'un Dataflow Gen2 qui contient une requête nommée **Contacts**. La requête possède une colonne **Email** de type Texte. Vous sélectionnez la colonne Email et utilisez **Supprimer les doublons**.

    Le résultat contient toujours des lignes comme anna@contoso.com et Anna@Contoso.com, qui correspondent au même contact.

    Vous devez ne conserver qu'une ligne par adresse e-mail, quelle que soit la casse. N'importe laquelle des lignes en double peut être conservée.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Sort the Email column in ascending order before the Remove duplicates step.", fr: "Trier la colonne Email par ordre croissant avant l'étape Supprimer les doublons." }
    - id: b
      text: { en: "Transform the Email column to lowercase before the Remove duplicates step.", fr: "Transformer la colonne Email en minuscules avant l'étape Supprimer les doublons." }
    - id: c
      text: { en: "Replace the Remove duplicates step with a Keep duplicates step on Email.", fr: "Remplacer l'étape Supprimer les doublons par une étape Conserver les doublons sur Email." }
    - id: d
      text: { en: "Select every column of the query before the Remove duplicates step.", fr: "Sélectionner toutes les colonnes de la requête avant l'étape Supprimer les doublons." }
answer: { optionId: b }
explanation:
  correct:
    en: "Power Query is case-sensitive when it compares values, so Remove duplicates treats anna@contoso.com and Anna@Contoso.com as different. Converting the column to lowercase (or uppercase) first makes the values identical, and Remove duplicates then keeps one row per address."
    fr: "Power Query respecte la casse quand il compare des valeurs : Supprimer les doublons considère anna@contoso.com et Anna@Contoso.com comme différents. Convertir d'abord la colonne en minuscules (ou en majuscules) rend les valeurs identiques, et Supprimer les doublons conserve alors une ligne par adresse."
  options:
    a: { en: "Sorting changes the order of the rows but not the comparison, which stays case-sensitive.", fr: "Le tri change l'ordre des lignes mais pas la comparaison, qui respecte toujours la casse." }
    c: { en: "Keep duplicates returns only the repeated values; it doesn't reduce them to one row.", fr: "Conserver les doublons ne renvoie que les valeurs répétées ; il ne les réduit pas à une ligne." }
    d: { en: "Comparing every column removes only rows identical in all columns, and the comparison is still case-sensitive.", fr: "Comparer toutes les colonnes ne supprime que les lignes identiques sur toutes les colonnes, et la comparaison respecte toujours la casse." }
references:
  - title: Working with duplicate values
    url: https://learn.microsoft.com/en-us/power-query/working-with-duplicates
