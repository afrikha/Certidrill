stem:
  en: You build a visual query and save it as a table.
  fr: Vous créez une requête visuelle et l'enregistrez en tant que table.
body:
  solution:
    en: |
      In WH-Retail, Lena selects **New visual query** and drags dbo.DimCity and dbo.FactSale to the canvas. She performs the following actions:

      1. Select **Combine** > **Merge queries as new**, join the two tables on CityKey with the **Inner** join kind, and expand the Profit column.
      2. Select **Transform** > **Group by**, group by City and add a **Sum** aggregation of Profit.
      3. Select **Save as table** and name the table **dbo.CityProfit**.
    fr: |
      Dans WH-Retail, Lena sélectionne **Nouvelle requête visuelle** et fait glisser dbo.DimCity et dbo.FactSale sur le canevas. Elle effectue les actions suivantes :

      1. Sélectionner **Combiner** > **Fusionner des requêtes comme nouvelles**, joindre les deux tables sur CityKey avec le type de jointure **Interne**, puis développer la colonne Profit.
      2. Sélectionner **Transformer** > **Regrouper par**, regrouper par City et ajouter une agrégation **Somme** de Profit.
      3. Sélectionner **Enregistrer en tant que table** et nommer la table **dbo.CityProfit**.
answer: { value: false }
explanation:
  correct:
    en: Save as table runs a CREATE TABLE AS SELECT statement, which stores the results at the time of the save. Rows loaded into dbo.FactSale afterwards are not reflected in dbo.CityProfit unless the table is recreated, so the object does not always return current results.
    fr: "Enregistrer en tant que table exécute une instruction CREATE TABLE AS SELECT, qui stocke les résultats au moment de l'enregistrement. Les lignes chargées ensuite dans dbo.FactSale ne sont pas reflétées dans dbo.CityProfit tant que la table n'est pas recréée : l'objet ne renvoie donc pas toujours des résultats actuels."
references:
