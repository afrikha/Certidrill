id: dp600-2c-agg-groupby-operations
objective: "2.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are using the Group by dialog of a Dataflow Gen2 to group a **Deliveries** query by **StoreID**. Each row of Deliveries is one delivery and has a DeliveryHours and an OrderDate column.

    You need to add one aggregation for each of the following results.

    Which operation should you use for each result? To answer, drag the appropriate operations to the correct results. Each operation may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez la boîte de dialogue Grouper par d'un Dataflow Gen2 pour regrouper une requête **Deliveries** par **StoreID**. Chaque ligne de Deliveries est une livraison et possède une colonne DeliveryHours et une colonne OrderDate.

    Vous devez ajouter une agrégation pour chacun des résultats suivants.

    Quelle opération devez-vous utiliser pour chaque résultat ? Pour répondre, faites glisser les opérations appropriées vers les résultats correspondants. Chaque opération peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sum, text: { en: "Sum", fr: "Somme" } }
    - { id: countrows, text: { en: "Count rows", fr: "Compter les lignes" } }
    - { id: distinctrows, text: { en: "Count distinct rows", fr: "Compter le nombre de lignes distinctes" } }
    - { id: allrows, text: { en: "All rows", fr: "Toutes les lignes" } }
    - { id: median, text: Median }
    - { id: max, text: Max }
  targets:
    - { id: t1, text: { en: "Number of deliveries per store", fr: "Nombre de livraisons par magasin" } }
    - { id: t2, text: { en: "Middle value of DeliveryHours, not influenced by a few extreme values", fr: "Valeur centrale de DeliveryHours, non influencée par quelques valeurs extrêmes" } }
    - { id: t3, text: { en: "Most recent OrderDate per store", fr: "OrderDate la plus récente par magasin" } }
    - { id: t4, text: { en: "A nested table with the detail rows of each store, to process later", fr: "Une table imbriquée avec les lignes de détail de chaque magasin, à traiter ensuite" } }
answer:
  mapping: { t1: countrows, t2: median, t3: max, t4: allrows }
explanation:
  correct:
    en: "Count rows returns the number of rows of each group, here one per delivery. Median returns the middle value, which extreme values don't pull. Max on a date column returns the latest date. All rows outputs the grouped rows as a table value in each cell, with no aggregation."
    fr: "Compter les lignes renvoie le nombre de lignes de chaque groupe, ici une par livraison. Median renvoie la valeur centrale, que les valeurs extrêmes n'influencent pas. Max sur une colonne de date renvoie la date la plus récente. Toutes les lignes produit les lignes regroupées sous forme de valeur de table dans chaque cellule, sans agrégation."
  options:
    sum: { en: "Sum adds up values; none of the results is a total.", fr: "Somme additionne des valeurs ; aucun des résultats n'est un total." }
    distinctrows: { en: "Count distinct rows counts distinct rows, which can be lower than the number of deliveries when rows repeat.", fr: "Compter le nombre de lignes distinctes compte les lignes distinctes, ce qui peut être inférieur au nombre de livraisons quand des lignes se répètent." }
references:
  - title: Grouping or summarizing rows
    url: https://learn.microsoft.com/en-us/power-query/group-by
