id: dp600-2b-integration-features
objective: "2.1.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Your company uses an eventhouse, lakehouses and Import semantic models in Fabric. No requirement allows a second copy of the data to be loaded by a pipeline or an eventstream.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre entreprise utilise un eventhouse, des lakehouses et des modèles sémantiques Import dans Fabric. Aucune exigence n'autorise une seconde copie des données chargée par un pipeline ou un eventstream.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: avail, text: { en: "Eventhouse OneLake availability", fr: "Disponibilité OneLake d'Eventhouse" } }
    - { id: kqlsc, text: { en: "OneLake shortcut in a KQL database", fr: "Raccourci OneLake dans une base de données KQL" } }
    - { id: accel, text: { en: "Query acceleration", fr: "Accélération des requêtes" } }
    - { id: smint, text: { en: "Semantic model OneLake integration", fr: "Intégration OneLake des modèles sémantiques" } }
    - { id: esdest, text: { en: "Eventstream lakehouse destination", fr: "Destination lakehouse d'un eventstream" } }
  targets:
    - { id: t1, text: { en: "Spark notebooks read a KQL table as a Delta table.", fr: "Des notebooks Spark lisent une table KQL sous forme de table Delta." } }
    - { id: t2, text: { en: "KQL queries join a lakehouse Delta table that is not ingested.", fr: "Des requêtes KQL joignent une table Delta d'un lakehouse qui n'est pas ingérée." } }
    - { id: t3, text: { en: "Spark notebooks read the exact data imported into the tables of a Power BI model.", fr: "Des notebooks Spark lisent exactement les données importées dans les tables d'un modèle Power BI." } }
    - { id: t4, text: { en: "KQL queries over the last 30 days of a referenced Delta table run faster.", fr: "Les requêtes KQL sur les 30 derniers jours d'une table Delta référencée s'exécutent plus vite." } }
answer:
  mapping: { t1: avail, t2: kqlsc, t3: smint, t4: accel }
explanation:
  correct:
    en: |
      OneLake availability writes KQL tables to OneLake as Delta tables that other engines read. A OneLake shortcut in a KQL database exposes lakehouse data to KQL as an external table. Semantic model OneLake integration exports the Import tables of a model to Delta tables at each refresh. Query acceleration caches and indexes recent data of a shortcut for faster KQL queries. An eventstream destination would load a second copy of the events.
    fr: |
      La disponibilité OneLake écrit les tables KQL dans OneLake sous forme de tables Delta lues par les autres moteurs. Un raccourci OneLake dans une base de données KQL expose les données d'un lakehouse à KQL comme une table externe. L'intégration OneLake des modèles sémantiques exporte les tables Import d'un modèle vers des tables Delta à chaque actualisation. L'accélération des requêtes met en cache et indexe les données récentes d'un raccourci pour des requêtes KQL plus rapides. Une destination d'eventstream chargerait une seconde copie des événements.
references:
  - title: Turn on OneLake availability for an eventhouse
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-house-onelake-availability
  - title: Learn about Microsoft OneLake Delta table integration in Power BI and Microsoft Fabric
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/onelake-integration-overview
