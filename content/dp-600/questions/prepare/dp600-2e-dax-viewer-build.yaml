id: dp600-2e-dax-viewer-build
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **Finance** that contains a semantic model named **SalesModel**. SalesModel contains the measures **Total Sales** and **Margin %**.

    An analyst named User1 has the Viewer role in Finance and the Build permission on SalesModel. The workspace setting that lets users edit data models in the Power BI service is enabled.

    User1 needs to write and run DAX queries that use the existing measures of SalesModel. You must not grant User1 any additional role or permission.

    What should User1 do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **Finance** qui contient un modèle sémantique nommé **SalesModel**. SalesModel contient les mesures **Total Sales** et **Margin %**.

    Un analyste nommé User1 dispose du rôle Viewer dans Finance et de l'autorisation Build sur SalesModel. Le paramètre d'espace de travail qui permet aux utilisateurs de modifier les modèles de données dans le service Power BI est activé.

    User1 doit écrire et exécuter des requêtes DAX qui utilisent les mesures existantes de SalesModel. Vous ne devez accorder à User1 aucun rôle ni aucune autorisation supplémentaire.

    Que doit faire User1 ?
body:
  options:
    - id: a
      text: { en: "In the Fabric portal, select **Write DAX queries** on SalesModel.", fr: "Dans le portail Fabric, sélectionner **Écrire des requêtes DAX** sur SalesModel." }
    - id: b
      text: { en: "In Power BI Desktop, connect live to SalesModel and use DAX query view.", fr: "Dans Power BI Desktop, établir une connexion active à SalesModel et utiliser la vue de requête DAX." }
    - id: c
      text: { en: "Query the tables used by SalesModel from the SQL analytics endpoint by using T-SQL.", fr: "Interroger les tables utilisées par SalesModel depuis le point de terminaison d'analytique SQL à l'aide de T-SQL." }
    - id: d
      text: { en: "Ask an admin to set the XMLA endpoint to Read Write, then select **Write DAX queries** on SalesModel.", fr: "Demander à un administrateur de définir le point de terminaison XMLA sur Read Write, puis sélectionner **Écrire des requêtes DAX** sur SalesModel." }
answer: { optionId: b }
explanation:
  correct:
    en: "Writing DAX queries in the Power BI service or Fabric portal requires write permission on the semantic model, which a Viewer doesn't have. Microsoft's documented alternative for users with the Build permission is Power BI Desktop with a live connection to the semantic model, where DAX query view can run queries that use the model's measures."
    fr: "Écrire des requêtes DAX dans le service Power BI ou le portail Fabric exige l'autorisation d'écriture sur le modèle sémantique, dont un Viewer ne dispose pas. L'alternative documentée par Microsoft pour les utilisateurs disposant de l'autorisation Build est Power BI Desktop avec une connexion active au modèle sémantique : la vue de requête DAX peut y exécuter des requêtes qui utilisent les mesures du modèle."
  options:
    a:
      en: "Write DAX queries in the web requires write permission on the semantic model; the workspace setting alone isn't enough."
      fr: "Écrire des requêtes DAX sur le web exige l'autorisation d'écriture sur le modèle sémantique ; le paramètre d'espace de travail seul ne suffit pas."
    c:
      en: "T-SQL on the SQL analytics endpoint reads the tables directly and can't use the measures defined in the semantic model."
      fr: "T-SQL sur le point de terminaison d'analytique SQL lit directement les tables et ne peut pas utiliser les mesures définies dans le modèle sémantique."
    d:
      en: "The XMLA endpoint setting doesn't change the requirement: Write DAX queries in the web still needs write permission on the semantic model."
      fr: "Le paramètre du point de terminaison XMLA ne change pas l'exigence : Écrire des requêtes DAX sur le web nécessite toujours l'autorisation d'écriture sur le modèle sémantique."
references:
  - title: DAX Query View
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/dax-query-view
