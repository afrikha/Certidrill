id: dp600-2c-agg-statements
objective: "2.2.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are creating aggregate tables in Microsoft Fabric for a gold layer.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez des tables d'agrégats dans Microsoft Fabric pour une couche gold.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In a Fabric warehouse, you can write GROUP BY ALL instead of listing the non-aggregated columns of the SELECT list.
        fr: Dans un entrepôt Fabric, vous pouvez écrire GROUP BY ALL au lieu de lister les colonnes non agrégées de la liste SELECT.
    - id: s2
      text:
        en: In a Fabric warehouse, you can create a materialized view that stores the result of a GROUP BY query.
        fr: Dans un entrepôt Fabric, vous pouvez créer une vue matérialisée qui stocke le résultat d'une requête GROUP BY.
    - id: s3
      text:
        en: A materialized lake view that uses GROUP BY can be refreshed incrementally only if change data feed is enabled on its source tables.
        fr: Une vue matérialisée de lakehouse qui utilise GROUP BY ne peut être actualisée de façon incrémentielle que si le flux de données modifiées (change data feed) est activé sur ses tables sources.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Fabric Data Warehouse supports GROUP BY ALL without a column list. Materialized views aren't supported in the warehouse; a precomputed aggregate is stored in a table, for example with CTAS. Optimal refresh of materialized lake views supports GROUP BY aggregations, but incremental refresh requires Delta change data feed on every source table; otherwise Fabric chooses between a full refresh and skipping."
    fr: "Fabric Data Warehouse prend en charge GROUP BY ALL sans liste de colonnes. Les vues matérialisées ne sont pas prises en charge dans l'entrepôt ; un agrégat précalculé est stocké dans une table, par exemple avec CTAS. L'actualisation optimale des vues matérialisées de lakehouse prend en charge les agrégations GROUP BY, mais l'actualisation incrémentielle exige le flux de données modifiées Delta sur chaque table source ; sinon Fabric choisit entre une actualisation complète et l'absence d'actualisation."
references:
  - title: T-SQL surface area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
  - title: What are materialized lake views in Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/materialized-lake-views/overview-materialized-lake-view
