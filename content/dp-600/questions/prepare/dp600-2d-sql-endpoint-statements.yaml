id: dp600-2d-sql-endpoint-statements
objective: "2.3.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a lakehouse named **Lakehouse1** that contains a Delta table named **orders**. You connect to the SQL analytics endpoint of Lakehouse1 by using the SQL query editor.

    Which two statements can you run successfully?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse nommé **Lakehouse1** qui contient une table Delta nommée **orders**. Vous vous connectez au point de terminaison d'analytique SQL de Lakehouse1 à l'aide de l'éditeur de requête SQL.

    Quelles sont les deux instructions que vous pouvez exécuter avec succès ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "SELECT CustomerKey, SUM(Amount) AS Total FROM dbo.orders GROUP BY CustomerKey;" }
    - { id: b, text: "UPDATE dbo.orders SET Status = 'Closed' WHERE OrderDate < '2025-01-01';" }
    - { id: c, text: "CREATE VIEW dbo.v_open_orders AS SELECT * FROM dbo.orders WHERE Status = 'Open';" }
    - { id: d, text: "INSERT INTO dbo.orders SELECT * FROM dbo.orders_staging;" }
    - { id: e, text: "CREATE TABLE dbo.orders_2026 AS SELECT * FROM dbo.orders WHERE OrderYear = 2026;" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The SQL analytics endpoint exposes the Delta tables of the lakehouse for read-only T-SQL queries, including aggregations, and you can create views, functions and procedures over these tables. Creating tables and running insert, update or delete statements are supported only in a warehouse.
    fr: |
      Le point de terminaison d'analytique SQL expose les tables Delta du lakehouse pour des requêtes T-SQL en lecture seule, y compris des agrégations, et vous pouvez créer des vues, des fonctions et des procédures sur ces tables. La création de tables et les instructions d'insertion, de mise à jour ou de suppression ne sont prises en charge que dans un entrepôt.
  options:
    b: { en: "UPDATE isn't supported on the tables of the SQL analytics endpoint; the data is changed through the lakehouse, for example with Spark.", fr: "UPDATE n'est pas pris en charge sur les tables du point de terminaison d'analytique SQL ; les données se modifient par le lakehouse, par exemple avec Spark." }
    d: { en: "INSERT isn't supported on the tables of the SQL analytics endpoint.", fr: "INSERT n'est pas pris en charge sur les tables du point de terminaison d'analytique SQL." }
    e: { en: "CREATE TABLE AS SELECT creates a table, which the SQL analytics endpoint doesn't support.", fr: "CREATE TABLE AS SELECT crée une table, ce que le point de terminaison d'analytique SQL ne prend pas en charge." }
references:
  - title: T-SQL Surface Area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
