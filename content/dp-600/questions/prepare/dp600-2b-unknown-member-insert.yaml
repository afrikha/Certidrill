id: dp600-2b-unknown-member-insert
objective: "2.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric warehouse named Warehouse1 that contains a dimension table named dbo.DimProduct with the columns ProductKey (bigint IDENTITY), ProductID, ProductName and IsCurrent.

    You need to add an Unknown member whose ProductKey is -1, so that fact rows whose product lookup fails can reference it. Later inserts must keep generating unique keys.

    How should you complete the T-SQL statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé Warehouse1 qui contient une table de dimension nommée dbo.DimProduct avec les colonnes ProductKey (bigint IDENTITY), ProductID, ProductName et IsCurrent.

    Vous devez ajouter un membre Unknown dont ProductKey vaut -1, pour que les lignes de faits dont la recherche de produit échoue puissent le référencer. Les insertions suivantes doivent continuer à générer des clés uniques.

    Comment devez-vous compléter les instructions T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SET IDENTITY_INSERT dbo.DimProduct ON;
    INSERT INTO dbo.DimProduct [[cols]]
    VALUES (-1, 'N/A', 'Unknown', 1);
    SET IDENTITY_INSERT dbo.DimProduct OFF;
    DBCC CHECKIDENT ('dbo.DimProduct', [[reseed]]);
  slots:
    - id: cols
      options:
        - { id: full, text: "(ProductKey, ProductID, ProductName, IsCurrent)" }
        - { id: nokey, text: "(ProductID, ProductName, IsCurrent)" }
        - { id: none, text: { en: "(no column list)", fr: "(aucune liste de colonnes)" } }
    - id: reseed
      options:
        - { id: reseed, text: RESEED }
        - { id: reseedzero, text: "RESEED, 0" }
        - { id: noreseed, text: NORESEED }
answer:
  values: { cols: full, reseed: reseed }
explanation:
  correct:
    en: |
      With IDENTITY_INSERT set to ON, an INSERT must list its columns, including the identity column that receives the explicit value -1. After you turn it off, DBCC CHECKIDENT with RESEED scans the used and reserved ranges to determine the next values. In Fabric, RESEED is the only supported option and you can't pass a custom value.
    fr: |
      Avec IDENTITY_INSERT sur ON, un INSERT doit lister ses colonnes, y compris la colonne d'identité qui reçoit la valeur explicite -1. Après l'avoir désactivé, DBCC CHECKIDENT avec RESEED analyse les plages utilisées et réservées pour déterminer les valeurs suivantes. Dans Fabric, RESEED est la seule option prise en charge, et vous ne pouvez pas passer de valeur personnalisée.
  options:
    nokey: { en: "Without ProductKey in the list, the four values don't match the three columns and -1 can't be inserted as the key.", fr: "Sans ProductKey dans la liste, les quatre valeurs ne correspondent pas aux trois colonnes et -1 ne peut pas être inséré comme clé." }
    none: { en: "A column list is required when IDENTITY_INSERT is ON.", fr: "Une liste de colonnes est obligatoire quand IDENTITY_INSERT est sur ON." }
    reseedzero: { en: "Fabric doesn't support a custom reseed value.", fr: "Fabric ne prend pas en charge de valeur de réamorçage personnalisée." }
    noreseed: { en: "NORESEED is not supported in Fabric Data Warehouse.", fr: "NORESEED n'est pas pris en charge dans Fabric Data Warehouse." }
references:
  - title: IDENTITY Columns in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/identity
