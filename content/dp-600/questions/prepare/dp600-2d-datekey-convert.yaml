id: dp600-2d-datekey-convert
objective: "2.2.8"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a table named **dbo.FactOrder** and a date dimension named **dbo.DimDate**. The OrderDate column of FactOrder uses the `date` data type. The DateKey column of DimDate uses the `int` data type and stores values such as `20261231`.

    You need to add a DateKey column to a query on FactOrder so that it can be joined to DimDate.

    How should you complete the T-SQL expression? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table nommée **dbo.FactOrder** et une dimension de dates nommée **dbo.DimDate**. La colonne OrderDate de FactOrder utilise le type de données `date`. La colonne DateKey de DimDate utilise le type de données `int` et stocke des valeurs comme `20261231`.

    Vous devez ajouter une colonne DateKey à une requête sur FactOrder pour pouvoir la joindre à DimDate.

    Comment devez-vous compléter l'expression T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT OrderId,
           CAST(CONVERT(char(8), OrderDate, [[style]]) AS [[type]]) AS DateKey,
           Amount
    FROM dbo.FactOrder;
  slots:
    - id: style
      options:
        - { id: s23, text: "23" }
        - { id: s101, text: "101" }
        - { id: s103, text: "103" }
        - { id: s112, text: "112" }
    - id: type
      options:
        - { id: int, text: int }
        - { id: smallint, text: smallint }
        - { id: date, text: date }
        - { id: bit, text: bit }
answer:
  values: { style: s112, type: int }
explanation:
  correct:
    en: |
      Style 112 formats a date as `yyyyMMdd` without separators, so `CONVERT(char(8), OrderDate, 112)` returns `20261231`. Casting that string to `int` gives the same data type as DimDate.DateKey, which the join needs.
    fr: |
      Le style 112 met en forme une date en `yyyyMMdd` sans séparateur : `CONVERT(char(8), OrderDate, 112)` renvoie `20261231`. Convertir cette chaîne en `int` donne le même type de données que DimDate.DateKey, ce dont la jointure a besoin.
  options:
    s23: { en: "Style 23 returns yyyy-MM-dd; truncated to 8 characters it becomes 2026-12-, which can't be cast to int.", fr: "Le style 23 renvoie yyyy-MM-dd ; tronqué à 8 caractères, il devient 2026-12-, qui ne peut pas être converti en int." }
    s101: { en: "Style 101 returns MM/dd/yyyy, which contains separators.", fr: "Le style 101 renvoie MM/dd/yyyy, qui contient des séparateurs." }
    s103: { en: "Style 103 returns dd/MM/yyyy, which contains separators.", fr: "Le style 103 renvoie dd/MM/yyyy, qui contient des séparateurs." }
    smallint: { en: "smallint stops at 32,767, so 20261231 causes an overflow.", fr: "smallint s'arrête à 32 767 : 20261231 provoque un dépassement." }
    date: { en: "A date doesn't match the int data type of DimDate.DateKey.", fr: "Une date ne correspond pas au type int de DimDate.DateKey." }
    bit: { en: "bit stores only 0 and 1.", fr: "bit ne stocke que 0 et 1." }
references:
  - title: CAST and CONVERT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/cast-and-convert-transact-sql
