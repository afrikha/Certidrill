id: dp600-2b-eh-limitations
objective: "2.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a KQL database named KQLDB1 that contains a table named Telemetry. OneLake availability is turned on for Telemetry, and a lakehouse reads the table through a OneLake shortcut.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données KQL nommée KQLDB1 qui contient une table nommée Telemetry. La disponibilité OneLake est activée pour Telemetry, et un lakehouse lit la table par un raccourci OneLake.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can add a column to Telemetry without turning off OneLake availability.
        fr: |
          Vous pouvez ajouter une colonne à Telemetry sans désactiver la disponibilité OneLake.
    - id: s2
      text:
        en: |
          You can apply a row-level security policy to Telemetry without turning off OneLake availability.
        fr: |
          Vous pouvez appliquer une stratégie de sécurité au niveau des lignes à Telemetry sans désactiver la disponibilité OneLake.
    - id: s3
      text:
        en: |
          Setting TargetLatencyInMinutes to 5 for Telemetry makes queries on its Delta table in OneLake faster.
        fr: |
          Définir TargetLatencyInMinutes sur 5 pour Telemetry accélère les requêtes sur sa table Delta dans OneLake.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      While OneLake availability is on, adding or deleting a column is supported, but you can't rename the table, change a column type, apply row-level security, or delete, truncate or purge data; you turn availability off, make the change and turn it on again. A very short target latency makes the eventhouse write many small files, which produces a suboptimal Delta table and slower queries, and that read-only table can't be optimized afterwards.
    fr: |
      Tant que la disponibilité OneLake est activée, l'ajout ou la suppression d'une colonne est pris en charge, mais vous ne pouvez ni renommer la table, ni changer le type d'une colonne, ni appliquer la sécurité au niveau des lignes, ni supprimer, tronquer ou purger des données ; il faut désactiver la disponibilité, faire la modification, puis la réactiver. Une latence cible très courte fait écrire de nombreux petits fichiers, ce qui produit une table Delta sous-optimale et des requêtes plus lentes, et cette table en lecture seule ne peut pas être optimisée ensuite.
references:
  - title: Turn on OneLake availability for an eventhouse
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-house-onelake-availability
