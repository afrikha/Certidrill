id: dp600-2d-case-sensitive-filter
objective: "2.2.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a warehouse named **Warehouse1**. Warehouse1 was created with the Data Warehouse default collation of the workspace, which has never been changed.

    The Country column of the **dbo.Supplier** table contains values such as `France`, `FRANCE` and `france`. The following query returns only the rows that contain `france`.

    ```sql
    SELECT SupplierKey, SupplierName
    FROM dbo.Supplier
    WHERE Country = 'france';
    ```

    You need the query to return all the French suppliers, whatever the letter case stored in Country.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un entrepôt nommé **Warehouse1**. Warehouse1 a été créé avec le classement par défaut Data Warehouse de l'espace de travail, qui n'a jamais été modifié.

    La colonne Country de la table **dbo.Supplier** contient des valeurs comme `France`, `FRANCE` et `france`. La requête suivante ne renvoie que les lignes qui contiennent `france`.

    ```sql
    SELECT SupplierKey, SupplierName
    FROM dbo.Supplier
    WHERE Country = 'france';
    ```

    La requête doit renvoyer tous les fournisseurs français, quelle que soit la casse stockée dans Country.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the filter to WHERE UPPER(Country) = 'FRANCE'.", fr: "Remplacer le filtre par WHERE UPPER(Country) = 'FRANCE'." } }
    - { id: b, text: { en: "Change the filter to WHERE Country LIKE 'france'.", fr: "Remplacer le filtre par WHERE Country LIKE 'france'." } }
    - { id: c, text: { en: "Run ALTER DATABASE to change the collation of Warehouse1 to a case-insensitive collation.", fr: "Exécuter ALTER DATABASE pour remplacer le classement de Warehouse1 par un classement non sensible à la casse." } }
    - { id: d, text: { en: "Change the Data Warehouse collation of the workspace to case-insensitive.", fr: "Passer le classement Data Warehouse de l'espace de travail en non sensible à la casse." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The default warehouse collation, `Latin1_General_100_BIN2_UTF8`, is case-sensitive, so `=` and `LIKE` match only the exact letter case. Converting the column to uppercase and comparing it with an uppercase literal returns the rows whatever the stored case."
    fr: "Le classement par défaut de l'entrepôt, `Latin1_General_100_BIN2_UTF8`, est sensible à la casse : `=` et `LIKE` ne trouvent que la casse exacte. Convertir la colonne en majuscules et la comparer à un littéral en majuscules renvoie les lignes quelle que soit la casse stockée."
  options:
    b: { en: "LIKE uses the same case-sensitive collation, so it still matches only france.", fr: "LIKE utilise le même classement sensible à la casse : il ne trouve toujours que france." }
    c: { en: "The collation of a warehouse can't be changed after the warehouse is created.", fr: "Le classement d'un entrepôt ne peut pas être modifié après la création de l'entrepôt." }
    d: { en: "The workspace setting applies only to warehouses and SQL analytics endpoints created afterward, not to Warehouse1.", fr: "Le paramètre de l'espace de travail ne s'applique qu'aux entrepôts et points de terminaison d'analytique SQL créés ensuite, pas à Warehouse1." }
references:
  - title: Data Warehouse collation
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/collation
