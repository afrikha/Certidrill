id: dp600-2b-dimension-types
objective: "2.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are designing a star schema for sales and inventory in a Fabric warehouse named Warehouse1.

    Which type of dimension does each design describe? To answer, drag the appropriate dimension types to the correct designs. Each dimension type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez un schéma en étoile pour les ventes et les stocks dans un entrepôt Fabric nommé Warehouse1.

    Quel type de dimension chaque conception décrit-elle ? Pour répondre, faites glisser les types de dimensions appropriés vers les conceptions correspondantes. Chaque type de dimension peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: roleplaying, text: { en: "Role-playing dimension", fr: "Dimension de rôle actif" } }
    - { id: degenerate, text: { en: "Degenerate dimension", fr: "Dimension dégénérée" } }
    - { id: junk, text: { en: "Junk dimension", fr: "Dimension fourre-tout" } }
    - { id: conformed, text: { en: "Conformed dimension", fr: "Dimension conforme" } }
    - { id: outrigger, text: { en: "Outrigger dimension", fr: "Sous-dimension" } }
  targets:
    - { id: t1, text: { en: "FactSales has OrderDateKey and ShipDateKey columns that both reference DimDate.", fr: "FactSales a des colonnes OrderDateKey et ShipDateKey qui référencent toutes deux DimDate." } }
    - { id: t2, text: { en: "The sales order number is stored in FactSales and used for analysis, without a separate table.", fr: "Le numéro de commande est stocké dans FactSales et utilisé pour l'analyse, sans table distincte." } }
    - { id: t3, text: { en: "IsGift, IsExpress and PaymentType flags are combined into one table that has a surrogate key.", fr: "Les indicateurs IsGift, IsExpress et PaymentType sont combinés dans une table qui a une clé de substitution." } }
    - { id: t4, text: { en: "DimProduct is used by both FactSales and FactInventory.", fr: "DimProduct est utilisée à la fois par FactSales et FactInventory." } }
answer:
  mapping: { t1: roleplaying, t2: degenerate, t3: junk, t4: conformed }
explanation:
  correct:
    en: |
      A role-playing dimension is one physical dimension referenced several times with different roles, such as order and ship dates. A degenerate dimension is an attribute at the fact grain, such as an order number, kept in the fact table. A junk dimension consolidates small, low-cardinality flags into one table with a surrogate key. A conformed dimension is shared by several fact tables. An outrigger is a dimension referenced by other dimensions, such as a geography used by customer and salesperson.
    fr: |
      Une dimension de rôle actif est une même dimension physique référencée plusieurs fois avec des rôles différents, comme les dates de commande et d'expédition. Une dimension dégénérée est un attribut au grain des faits, comme un numéro de commande, conservé dans la table de faits. Une dimension fourre-tout regroupe de petits indicateurs à faible cardinalité dans une table avec une clé de substitution. Une dimension conforme est partagée par plusieurs tables de faits. Une sous-dimension est une dimension référencée par d'autres dimensions, comme une géographie utilisée par le client et le vendeur.
references:
  - title: Modeling Dimension Tables in Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
