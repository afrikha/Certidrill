id: dp600-2c-dq-tsql-nulls
objective: "2.2.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse that contains the staging tables **stg.Orders** (OrderID, CustomerID, ShipCountry, BillCountry) and **stg.Reviews** (ProductID, Rating). Rating is null when a customer left a comment without a rating.

    You need to write two queries:

    - The first returns the orders that have a customer, with the ship country, or the bill country when the ship country is null, or **Unknown** when both are null.
    - The second returns the average rating of each product, computed only from the reviews that have a rating.

    How should you complete the queries? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric qui contient les tables de préproduction **stg.Orders** (OrderID, CustomerID, ShipCountry, BillCountry) et **stg.Reviews** (ProductID, Rating). Rating est null quand un client a laissé un commentaire sans note.

    Vous devez écrire deux requêtes :

    - La première renvoie les commandes qui ont un client, avec le pays de livraison, ou le pays de facturation quand le pays de livraison est null, ou **Unknown** quand les deux sont null.
    - La seconde renvoie la note moyenne de chaque produit, calculée uniquement à partir des avis qui ont une note.

    Comment devez-vous compléter les requêtes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT OrderID,
           [[fn]](ShipCountry, BillCountry, 'Unknown') AS Country
    FROM stg.Orders
    WHERE CustomerID [[test]];

    SELECT ProductID, AVG([[avg]]) AS AvgRating
    FROM stg.Reviews
    GROUP BY ProductID;
  slots:
    - id: fn
      options:
        - { id: coalesce, text: COALESCE }
        - { id: isnull, text: ISNULL }
        - { id: nullif, text: NULLIF }
        - { id: concat, text: CONCAT }
    - id: test
      options:
        - { id: isnotnull, text: IS NOT NULL }
        - { id: neqnull, text: <> NULL }
        - { id: isnull_t, text: IS NULL }
    - id: avg
      options:
        - { id: rating, text: Rating }
        - { id: isnull0, text: "ISNULL(Rating, 0)" }
        - { id: distinct, text: DISTINCT Rating }
answer:
  values: { fn: coalesce, test: isnotnull, avg: rating }
explanation:
  correct:
    en: "`COALESCE` accepts any number of arguments and returns the first one that isn't null. `IS NOT NULL` is the only correct test for missing values. `AVG(Rating)` ignores null values, so the average uses only the reviews that have a rating."
    fr: "`COALESCE` accepte un nombre quelconque d'arguments et renvoie le premier qui n'est pas null. `IS NOT NULL` est le seul test correct des valeurs manquantes. `AVG(Rating)` ignore les valeurs null : la moyenne n'utilise que les avis qui ont une note."
  options:
    isnull: { en: "ISNULL takes exactly two arguments, so it can't evaluate three values.", fr: "ISNULL accepte exactement deux arguments : il ne peut pas évaluer trois valeurs." }
    nullif: { en: "NULLIF takes two arguments and returns null when they are equal.", fr: "NULLIF accepte deux arguments et renvoie null quand ils sont égaux." }
    concat: { en: "CONCAT joins the three strings instead of returning the first non-null value.", fr: "CONCAT concatène les trois chaînes au lieu de renvoyer la première valeur non null." }
    neqnull: { en: "A comparison with NULL returns unknown, so no row would be returned.", fr: "Une comparaison avec NULL renvoie inconnu : aucune ligne ne serait renvoyée." }
    isnull_t: { en: "IS NULL returns the orders without a customer, the opposite of the requirement.", fr: "IS NULL renvoie les commandes sans client, soit l'inverse de l'exigence." }
    isnull0: { en: "Replacing null ratings with 0 counts the unrated reviews and lowers the average.", fr: "Remplacer les notes null par 0 compte les avis sans note et fait baisser la moyenne." }
    distinct: { en: "AVG(DISTINCT Rating) averages each distinct rating value once, regardless of how many reviews have it.", fr: "AVG(DISTINCT Rating) fait la moyenne de chaque valeur de note distincte une seule fois, quel que soit le nombre d'avis qui l'ont." }
references:
  - title: COALESCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/coalesce-transact-sql
