id: dp600-2d-sql-clause-order
objective: "2.3.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1**. You write the following query.

    ```sql
    SELECT TOP (5) Region, SUM(Amount) AS Total
    FROM dbo.FactSales
    WHERE OrderYear = 2026
    GROUP BY Region
    HAVING SUM(Amount) > 10000
    ORDER BY Total DESC;
    ```

    You need to identify the logical processing order of the query, which explains where the Total alias can be used.

    Which five clauses are processed first? To answer, move the appropriate clauses from the list to the answer area and arrange them in the order in which they are logically processed.
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1**. Vous écrivez la requête suivante.

    ```sql
    SELECT TOP (5) Region, SUM(Amount) AS Total
    FROM dbo.FactSales
    WHERE OrderYear = 2026
    GROUP BY Region
    HAVING SUM(Amount) > 10000
    ORDER BY Total DESC;
    ```

    Vous devez déterminer l'ordre de traitement logique de la requête, qui explique où l'alias Total peut être utilisé.

    Quelles sont les cinq clauses traitées en premier ? Pour répondre, déplacez les clauses appropriées de la liste vers la zone de réponse et classez-les dans l'ordre de leur traitement logique.
body:
  count: 5
  actions:
    - { id: select, text: SELECT }
    - { id: from, text: FROM }
    - { id: orderby, text: ORDER BY }
    - { id: where, text: WHERE }
    - { id: top, text: TOP }
    - { id: groupby, text: GROUP BY }
    - { id: having, text: HAVING }
answer:
  sequence: [ from, where, groupby, having, select ]
explanation:
  correct:
    en: |
      The logical order is FROM, WHERE, GROUP BY, HAVING, SELECT, then ORDER BY and finally TOP. Because the Total alias is defined in SELECT, it can be used in ORDER BY but not in WHERE, GROUP BY or HAVING, which is why HAVING repeats SUM(Amount).
    fr: |
      L'ordre logique est FROM, WHERE, GROUP BY, HAVING, SELECT, puis ORDER BY et enfin TOP. Comme l'alias Total est défini dans SELECT, il peut être utilisé dans ORDER BY mais pas dans WHERE, GROUP BY ni HAVING : c'est pourquoi HAVING répète SUM(Amount).
  options:
    orderby: { en: "ORDER BY is processed after SELECT, which is why it can use the Total alias.", fr: "ORDER BY est traité après SELECT, ce qui lui permet d'utiliser l'alias Total." }
    top: { en: "TOP is processed last, after ORDER BY.", fr: "TOP est traité en dernier, après ORDER BY." }
references:
  - title: SELECT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-transact-sql
