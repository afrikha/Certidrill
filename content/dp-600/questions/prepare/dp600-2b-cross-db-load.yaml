id: dp600-2b-cross-db-load
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a warehouse named Warehouse1 and a lakehouse named Lakehouse1. Lakehouse1 contains a Delta table named orders in the dbo schema.

    You are writing a stored procedure in Warehouse1 that inserts the rows of orders into dbo.FactOrders. The procedure must read the lakehouse table directly. The solution must minimize development effort.

    What should the procedure use to reference the lakehouse table?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un entrepôt nommé Warehouse1 et un lakehouse nommé Lakehouse1. Lakehouse1 contient une table Delta nommée orders dans le schéma dbo.

    Vous écrivez dans Warehouse1 une procédure stockée qui insère les lignes de orders dans dbo.FactOrders. La procédure doit lire directement la table du lakehouse. La solution doit réduire au minimum l'effort de développement.

    Qu'est-ce que la procédure doit utiliser pour référencer la table du lakehouse ?
body:
  options:
    - { id: a, text: { en: "An external table created in Warehouse1 that points to the orders folder of Lakehouse1", fr: "Une table externe créée dans Warehouse1 qui pointe vers le dossier orders de Lakehouse1" } }
    - { id: b, text: { en: "The three-part name Lakehouse1.dbo.orders", fr: "Le nom en trois parties Lakehouse1.dbo.orders" } }
    - { id: c, text: { en: "A synonym created in Warehouse1 for Lakehouse1.dbo.orders", fr: "Un synonyme créé dans Warehouse1 pour Lakehouse1.dbo.orders" } }
    - { id: d, text: { en: "A materialized view created in Warehouse1 over the orders table", fr: "Une vue matérialisée créée dans Warehouse1 sur la table orders" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Cross-database queries reach the warehouses and SQL analytics endpoints of the same workspace by using three-part names (database.schema.table). The procedure can run INSERT INTO dbo.FactOrders ... SELECT ... FROM Lakehouse1.dbo.orders without moving data first.
    fr: |
      Les requêtes entre bases de données atteignent les entrepôts et les points de terminaison d'analytique SQL du même espace de travail avec des noms en trois parties (base.schéma.table). La procédure peut exécuter INSERT INTO dbo.FactOrders ... SELECT ... FROM Lakehouse1.dbo.orders sans déplacer les données au préalable.
  options:
    a:
      en: |
        External tables are not supported in Fabric Data Warehouse.
      fr: |
        Les tables externes ne sont pas prises en charge dans Fabric Data Warehouse.
    c:
      en: |
        Synonyms are not supported in Fabric Data Warehouse.
      fr: |
        Les synonymes ne sont pas pris en charge dans Fabric Data Warehouse.
    d:
      en: |
        Materialized views are not supported in Fabric Data Warehouse.
      fr: |
        Les vues matérialisées ne sont pas prises en charge dans Fabric Data Warehouse.
references:
  - title: Query the Warehouse or SQL analytics endpoint
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/query-warehouse
  - title: Tables in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tables
