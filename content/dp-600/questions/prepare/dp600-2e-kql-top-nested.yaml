id: dp600-2e-kql-top-nested
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a KQL database named **RetailRT** in a Fabric eventhouse. RetailRT contains a table named **Sales** with the columns **Region**, **Product**, **Amount** and **SaleTime**.

    You need a single query that returns the five regions with the highest total sales and, within each of those regions, the three products with the highest total sales in that region.

    Which query should you use?
  fr: |
    Vous disposez d'une base de données KQL nommée **RetailRT** dans un eventhouse Fabric. RetailRT contient une table nommée **Sales** avec les colonnes **Region**, **Product**, **Amount** et **SaleTime**.

    Vous avez besoin d'une requête unique qui renvoie les cinq régions ayant le total des ventes le plus élevé et, dans chacune de ces régions, les trois produits ayant le total des ventes le plus élevé dans cette région.

    Quelle requête devez-vous utiliser ?
body:
  options:
    - id: a
      text: |
        ```kusto
        Sales
        | summarize Revenue = sum(Amount) by Region, Product
        | top 15 by Revenue desc
        ```
    - id: b
      text: |
        ```kusto
        Sales
        | top-nested 3 of Product by sum(Amount),
          top-nested 5 of Region by sum(Amount)
        ```
    - id: c
      text: |
        ```kusto
        Sales
        | top-nested 5 of Region by sum(Amount),
          top-nested 3 of Product by sum(Amount)
        ```
    - id: d
      text: |
        ```kusto
        Sales
        | summarize arg_max(Amount, Product) by Region
        | top 5 by Amount desc
        ```
answer: { optionId: c }
explanation:
  correct:
    en: "`top-nested` performs a hierarchical aggregation: the first clause keeps the five regions with the highest `sum(Amount)`, and the second clause keeps, inside each of those regions, the three products with the highest `sum(Amount)`. The result has one column for each level's values and one for each level's aggregation."
    fr: "`top-nested` effectue une agrégation hiérarchique : la première clause conserve les cinq régions ayant la plus grande `sum(Amount)`, et la seconde conserve, dans chacune de ces régions, les trois produits ayant la plus grande `sum(Amount)`. Le résultat comporte une colonne pour les valeurs de chaque niveau et une pour l'agrégation de chaque niveau."
  options:
    a:
      en: "This returns the 15 region and product pairs with the highest sales overall; one region can have more than three products and fewer than five regions can appear."
      fr: "Cette requête renvoie les 15 couples région et produit ayant les ventes les plus élevées au total ; une région peut avoir plus de trois produits et moins de cinq régions peuvent apparaître."
    b:
      en: "The levels are reversed: this keeps the three best products overall, then the five best regions for each product."
      fr: "Les niveaux sont inversés : cette requête conserve les trois meilleurs produits au total, puis les cinq meilleures régions pour chaque produit."
    d:
      en: "`arg_max()` returns the product of the single largest sale in each region, not the products with the highest total sales."
      fr: "`arg_max()` renvoie le produit de la plus grosse vente de chaque région, pas les produits ayant le total des ventes le plus élevé."
references:
  - title: top-nested operator
    url: https://learn.microsoft.com/en-us/kusto/query/top-nested-operator
