id: dp600-2a-store-languages
objective: "2.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are documenting how data is written and read in the Fabric items used by Fabrikam.

    Which item matches each description? To answer, drag the appropriate items to the correct descriptions. Each item may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous documentez la façon dont les données sont écrites et lues dans les éléments Fabric utilisés par Fabrikam.

    Quel élément correspond à chaque description ? Pour répondre, faites glisser les éléments appropriés vers les descriptions correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: wh, text: { en: "Warehouse", fr: "Entrepôt" } }
    - { id: lh, text: Lakehouse }
    - { id: kql, text: { en: "KQL database", fr: "Base de données KQL" } }
    - { id: ep, text: { en: "SQL analytics endpoint of a lakehouse", fr: "Point de terminaison d'analytique SQL d'un lakehouse" } }
    - { id: sm, text: { en: "Semantic model", fr: "Modèle sémantique" } }
  targets:
    - { id: t1, text: { en: "Data is written with T-SQL DML, such as INSERT, UPDATE and DELETE, and with COPY INTO", fr: "Les données sont écrites avec le DML T-SQL, comme INSERT, UPDATE et DELETE, et avec COPY INTO" } }
    - { id: t2, text: { en: "Data is written with Apache Spark in PySpark, Spark SQL, Scala or R", fr: "Les données sont écrites avec Apache Spark en PySpark, Spark SQL, Scala ou R" } }
    - { id: t3, text: { en: "Data is ingested by eventstreams and queried mainly with KQL", fr: "Les données sont ingérées par des flux d'événements et interrogées principalement en KQL" } }
    - { id: t4, text: { en: "Delta tables written by Spark are queried with read-only T-SQL", fr: "Des tables Delta écrites par Spark sont interrogées en T-SQL en lecture seule" } }
answer:
  mapping: { t1: wh, t2: lh, t3: kql, t4: ep }
explanation:
  correct:
    en: |
      A warehouse supports full T-SQL DML and DDL, including COPY INTO and CREATE TABLE AS SELECT. A lakehouse is written with Spark. A KQL database in an eventhouse receives events from eventstreams and is queried with KQL. The SQL analytics endpoint of a lakehouse exposes its Delta tables to T-SQL in read-only mode.
    fr: |
      Un entrepôt prend en charge le DML et le DDL T-SQL complets, dont COPY INTO et CREATE TABLE AS SELECT. Un lakehouse s'écrit avec Spark. Une base de données KQL d'un eventhouse reçoit les événements des flux d'événements et s'interroge en KQL. Le point de terminaison d'analytique SQL d'un lakehouse expose ses tables Delta au T-SQL en lecture seule.
  options:
    sm:
      en: A semantic model serves data to reports with DAX; it is not where data is written with T-SQL, Spark or eventstreams.
      fr: Un modèle sémantique sert les données aux rapports avec DAX ; ce n'est pas là que les données sont écrites en T-SQL, avec Spark ou par des flux d'événements.
references:
  - title: "Microsoft Fabric decision guide: Choose between Warehouse and Lakehouse"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-lakehouse-warehouse
  - title: Eventhouse overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/eventhouse
