id: dp600-2b-eh-target-latency
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a KQL database named KQLDB1 that contains a table named DeviceEvents. DeviceEvents receives about 50 MB of data per day. OneLake availability is turned on for DeviceEvents, and a lakehouse named Lakehouse1 contains a OneLake shortcut to the table.

    Analysts report that new events can take up to three hours to appear in Lakehouse1. You need new events to appear in Lakehouse1 within 30 minutes. The solution must not copy the data.

    What should you do?
  fr: |
    Vous disposez d'une base de données KQL nommée KQLDB1 qui contient une table nommée DeviceEvents. DeviceEvents reçoit environ 50 Mo de données par jour. La disponibilité OneLake est activée pour DeviceEvents, et un lakehouse nommé Lakehouse1 contient un raccourci OneLake vers la table.

    Les analystes signalent que les nouveaux événements peuvent mettre jusqu'à trois heures à apparaître dans Lakehouse1. Les nouveaux événements doivent apparaître dans Lakehouse1 en moins de 30 minutes. La solution ne doit pas copier les données.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run .alter table DeviceEvents policy caching hot = 30m in KQLDB1.", fr: "Exécuter .alter table DeviceEvents policy caching hot = 30m dans KQLDB1." } }
    - { id: b, text: { en: "Run OPTIMIZE on the DeviceEvents Delta table from a notebook attached to Lakehouse1.", fr: "Exécuter OPTIMIZE sur la table Delta DeviceEvents depuis un notebook attaché à Lakehouse1." } }
    - { id: c, text: { en: "Set TargetLatencyInMinutes to 30 in the mirroring policy of DeviceEvents.", fr: "Définir TargetLatencyInMinutes sur 30 dans la stratégie de mise en miroir de DeviceEvents." } }
    - { id: d, text: { en: "Set the retention policy of DeviceEvents to 30 minutes.", fr: "Définir la stratégie de rétention de DeviceEvents sur 30 minutes." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The eventhouse batches data into large Parquet files and, by default, can wait up to three hours (or until files of about 200-256 MB exist) before writing to OneLake. With a low data volume, the three-hour limit applies. Setting TargetLatencyInMinutes (5 minutes to 3 hours) in the table's mirroring policy, for example with `.alter-merge table DeviceEvents policy mirroring dataformat=parquet with (IsEnabled=true, TargetLatencyInMinutes=30)`, shortens the delay, at the cost of smaller files.
    fr: |
      L'eventhouse regroupe les données en gros fichiers Parquet et peut, par défaut, attendre jusqu'à trois heures (ou que des fichiers d'environ 200 à 256 Mo existent) avant d'écrire dans OneLake. Avec un faible volume, c'est la limite de trois heures qui s'applique. Définir TargetLatencyInMinutes (de 5 minutes à 3 heures) dans la stratégie de mise en miroir de la table, par exemple avec `.alter-merge table DeviceEvents policy mirroring dataformat=parquet with (IsEnabled=true, TargetLatencyInMinutes=30)`, réduit ce délai, au prix de fichiers plus petits.
  options:
    a:
      en: |
        The caching policy controls which data stays in the hot cache of the eventhouse; it does not change when data is written to OneLake.
      fr: |
        La stratégie de mise en cache détermine quelles données restent dans le cache chaud de l'eventhouse ; elle ne change pas le moment où les données sont écrites dans OneLake.
    b:
      en: |
        The Delta table that OneLake availability writes is read-only and can't be optimized, and file layout does not explain data that is not written yet.
      fr: |
        La table Delta écrite par la disponibilité OneLake est en lecture seule et ne peut pas être optimisée, et la disposition des fichiers n'explique pas des données qui ne sont pas encore écrites.
    d:
      en: |
        The retention policy also deletes the data from OneLake; a 30-minute retention would remove the history instead of reducing the delay.
      fr: |
        La stratégie de rétention supprime aussi les données de OneLake ; une rétention de 30 minutes effacerait l'historique au lieu de réduire le délai.
references:
  - title: Turn on OneLake availability for an eventhouse
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-house-onelake-availability
