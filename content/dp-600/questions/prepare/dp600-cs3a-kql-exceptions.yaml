id: dp600-cs3a-kql-exceptions
objective: "2.3.3"
type: dropdown
caseStudy: dp600-cs3a-consolidated-messenger
difficulty: 2
status: draft
stem:
  en: |
    You are writing the KQL query of the dashboard that must meet requirement 2.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez la requête KQL du tableau de bord qui doit satisfaire l'exigence 2.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    Scans
    | summarize [[agg]](ScanTime, *) by [[grp]]
    | where [[cond]]
    | project ParcelId, DepotId, ScanTime
  slots:
    - id: agg
      options:
        - { id: argmin, text: arg_min }
        - { id: argmax, text: arg_max }
        - { id: max, text: max }
        - { id: any, text: take_any }
    - id: grp
      options:
        - { id: depot, text: DepotId }
        - { id: scan, text: ScanId }
        - { id: parcel, text: ParcelId }
        - { id: type, text: ScanType }
    - id: cond
      options:
        - { id: exc, text: "ScanType == \"Exception\"" }
        - { id: notdel, text: "ScanType != \"Delivered\"" }
        - { id: recent, text: "ScanTime > ago(1d)" }
answer:
  values: { agg: argmax, grp: parcel, cond: exc }
explanation:
  correct:
    en: "`arg_max(ScanTime, *) by ParcelId` returns, for each parcel, the whole row of its most recent scan. Filtering on `ScanType == \"Exception\"` after the summarize keeps the parcels whose latest scan is an exception; filtering before it would also return parcels that had an exception earlier and were delivered later."
    fr: "`arg_max(ScanTime, *) by ParcelId` renvoie, pour chaque colis, la ligne complète de son scan le plus récent. Filtrer sur `ScanType == \"Exception\"` après le summarize conserve les colis dont le dernier scan est une exception ; filtrer avant renverrait aussi les colis qui ont eu une exception puis ont été livrés."
  options:
    argmin: { en: "arg_min returns the row of the oldest scan of each parcel.", fr: "arg_min renvoie la ligne du scan le plus ancien de chaque colis." }
    max: { en: "max accepts a single expression and returns only the maximum value, not the other columns of the row.", fr: "max n'accepte qu'une expression et ne renvoie que la valeur maximale, pas les autres colonnes de la ligne." }
    any: { en: "take_any returns an arbitrary row of each group, not the most recent one.", fr: "take_any renvoie une ligne arbitraire de chaque groupe, pas la plus récente." }
    depot: { en: "Grouping by DepotId returns one scan per depot, not one per parcel.", fr: "Regrouper par DepotId renvoie un scan par dépôt, pas un par colis." }
    scan: { en: "Each ScanId is a single scan, so grouping by it keeps every scan.", fr: "Chaque ScanId correspond à un seul scan : regrouper par celui-ci conserve tous les scans." }
    type: { en: "Grouping by ScanType returns one row per scan type.", fr: "Regrouper par ScanType renvoie une ligne par type de scan." }
    notdel: { en: "This condition also keeps parcels whose latest scan is Received or OutForDelivery.", fr: "Cette condition conserve aussi les colis dont le dernier scan est Received ou OutForDelivery." }
    recent: { en: "This condition filters on time, not on the type of the latest scan.", fr: "Cette condition filtre sur le temps, pas sur le type du dernier scan." }
references:
  - title: arg_max() (aggregation function)
    url: https://learn.microsoft.com/en-us/kusto/query/arg-max-aggregation-function
