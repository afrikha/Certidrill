id: dp600-2a-dataflow-destination
objective: "2.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a Dataflow Gen2 named DF-Customers that contains a query named Customers. You are configuring a data destination for Customers: an existing table named Customers in a lakehouse named LH-Gold.

    The solution must meet the following requirements:

    - Each refresh replaces all the rows of the table.
    - The table must never be dropped and re-created, so that objects built on it keep working.
    - If the columns of the query change, publishing the dataflow must fail instead of changing the table.

    How should you configure the data destination? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un Dataflow Gen2 nommé DF-Customers qui contient une requête nommée Customers. Vous configurez une destination de données pour Customers : une table existante nommée Customers dans un lakehouse nommé LH-Gold.

    La solution doit répondre aux exigences suivantes :

    - Chaque actualisation remplace toutes les lignes de la table.
    - La table ne doit jamais être supprimée puis recréée, afin que les objets construits sur elle continuent de fonctionner.
    - Si les colonnes de la requête changent, la publication du flux de données doit échouer au lieu de modifier la table.

    Comment devez-vous configurer la destination de données ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Destination settings: [[cfg]]
      Schema option on publish: [[schema]]
    fr: |
      Paramètres de destination : [[cfg]]
      Option de schéma à la publication : [[schema]]
  slots:
    - id: cfg
      options:
        - { id: auto, text: { en: "Use automatic settings", fr: "Utiliser les paramètres automatiques" } }
        - { id: replace, text: { en: "Manual settings with the Replace update method", fr: "Paramètres manuels avec la méthode de mise à jour Replace" } }
        - { id: append, text: { en: "Manual settings with the Append update method", fr: "Paramètres manuels avec la méthode de mise à jour Append" } }
    - id: schema
      options:
        - { id: dynamic, text: { en: "Dynamic schema", fr: "Schéma dynamique (Dynamic schema)" } }
        - { id: fixed, text: { en: "Fixed schema", fr: "Schéma fixe (Fixed schema)" } }
answer:
  values: { cfg: replace, schema: fixed }
explanation:
  correct:
    en: |
      The Replace update method replaces the data of the table at each refresh. With manual settings and the Fixed schema option, only the rows are replaced, so the table and the objects built on it stay intact, and publishing fails if the query schema no longer matches the destination.
    fr: |
      La méthode de mise à jour Replace remplace les données de la table à chaque actualisation. Avec des paramètres manuels et l'option Fixed schema, seules les lignes sont remplacées : la table et les objets construits sur elle restent intacts, et la publication échoue si le schéma de la requête ne correspond plus à la destination.
  options:
    auto: { en: "Automatic settings drop and re-create the table at each refresh, which can remove relationships or measures built on it.", fr: "Les paramètres automatiques suppriment puis recréent la table à chaque actualisation, ce qui peut supprimer les relations ou les mesures construites sur elle." }
    append: { en: "Append adds rows to the existing data instead of replacing them.", fr: "Append ajoute des lignes aux données existantes au lieu de les remplacer." }
    dynamic: { en: "Dynamic schema drops and re-creates the table when the schema changes instead of failing.", fr: "Le schéma dynamique supprime puis recrée la table quand le schéma change au lieu d'échouer." }
references:
  - title: Dataflow Gen2 data destinations and managed settings
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-gen2-data-destinations-and-managed-settings
