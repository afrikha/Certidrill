id: dp600-2b-truncate-reload-dim
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric warehouse named Warehouse1. Each night, a pipeline truncates dbo.DimCustomer and reloads all the customers from the CRM system. The surrogate key, CustomerKey, is a bigint IDENTITY column. The pipeline then loads only the new sales into dbo.FactSales, with the CustomerKey looked up by CustomerID.

    Users report that sales from previous days now appear under the wrong customers or under no customer. You need to fix the design so that existing facts keep pointing to the correct customers.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé Warehouse1. Chaque nuit, un pipeline tronque dbo.DimCustomer et recharge tous les clients depuis le CRM. La clé de substitution, CustomerKey, est une colonne IDENTITY bigint. Le pipeline charge ensuite uniquement les nouvelles ventes dans dbo.FactSales, avec le CustomerKey recherché par CustomerID.

    Les utilisateurs signalent que les ventes des jours précédents apparaissent désormais sous de mauvais clients ou sous aucun client. Vous devez corriger la conception pour que les faits existants continuent de pointer vers les bons clients.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Load dbo.DimCustomer incrementally by matching rows on CustomerID.", fr: "Charger dbo.DimCustomer de façon incrémentielle en rapprochant les lignes sur CustomerID." } }
    - { id: b, text: { en: "Load dbo.FactSales before dbo.DimCustomer in the pipeline.", fr: "Charger dbo.FactSales avant dbo.DimCustomer dans le pipeline." } }
    - { id: c, text: { en: "Run DBCC CHECKIDENT with RESEED after each truncate of dbo.DimCustomer.", fr: "Exécuter DBCC CHECKIDENT avec RESEED après chaque troncation de dbo.DimCustomer." } }
    - { id: d, text: { en: "Add a NOT ENFORCED foreign key from dbo.FactSales to dbo.DimCustomer.", fr: "Ajouter une clé étrangère NOT ENFORCED de dbo.FactSales vers dbo.DimCustomer." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Learn warns never to truncate and fully reload a dimension with auto-generated surrogate keys, because each reload assigns new keys and invalidates the keys already stored in the fact table. The dimension must be processed incrementally on the business key (update changed customers, insert new ones), so existing members keep their surrogate keys.
    fr: |
      Learn recommande de ne jamais tronquer puis recharger entièrement une dimension à clés de substitution générées automatiquement : chaque rechargement attribue de nouvelles clés et invalide celles déjà stockées dans la table de faits. La dimension doit être traitée de façon incrémentielle sur la clé métier (mise à jour des clients modifiés, insertion des nouveaux), pour que les membres existants conservent leur clé de substitution.
  options:
    c:
      en: |
        RESEED doesn't restore the previous keys; IDENTITY values are never reused, so reloaded customers still get new keys.
      fr: |
        RESEED ne restaure pas les clés précédentes ; les valeurs IDENTITY ne sont jamais réutilisées, donc les clients rechargés obtiennent toujours de nouvelles clés.
    b:
      en: |
        Dimensions must be processed before facts so that the fact load can look up current keys.
      fr: |
        Les dimensions doivent être traitées avant les faits pour que le chargement des faits puisse rechercher les clés actuelles.
    d:
      en: |
        NOT ENFORCED constraints are not checked, so they can't prevent or fix invalid keys.
      fr: |
        Les contraintes NOT ENFORCED ne sont pas vérifiées : elles ne peuvent ni empêcher ni corriger des clés invalides.
references:
