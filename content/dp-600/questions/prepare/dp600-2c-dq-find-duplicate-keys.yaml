id: dp600-2c-dq-find-duplicate-keys
objective: "2.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse in which **dbo.DimProduct** has a `PRIMARY KEY NONCLUSTERED (ProductID) NOT ENFORCED` constraint. Before each load, you want to identify the ProductID values that appear more than once in the staging table **stg.Product**.

    Which query should you use?
  fr: |
    Vous disposez d'un entrepôt Fabric dans lequel **dbo.DimProduct** possède une contrainte `PRIMARY KEY NONCLUSTERED (ProductID) NOT ENFORCED`. Avant chaque chargement, vous voulez identifier les valeurs ProductID qui apparaissent plusieurs fois dans la table de préproduction **stg.Product**.

    Quelle requête devez-vous utiliser ?
body:
  options:
    - id: a
      text: "`SELECT DISTINCT ProductID FROM stg.Product;`"
    - id: b
      text: "`SELECT ProductID, COUNT(*) AS Occurrences FROM stg.Product WHERE COUNT(*) > 1 GROUP BY ProductID;`"
    - id: c
      text: "`SELECT ProductID, COUNT(*) AS Occurrences FROM stg.Product GROUP BY ProductID HAVING COUNT(*) > 1;`"
    - id: d
      text: "`SELECT ProductID, COUNT(*) AS Occurrences FROM stg.Product GROUP BY ProductID HAVING COUNT(*) = 1;`"
answer: { optionId: c }
explanation:
  correct:
    en: "Grouping by ProductID and keeping the groups with `HAVING COUNT(*) > 1` returns each duplicated key with its number of occurrences. The check is needed because a NOT ENFORCED primary key doesn't reject duplicates, and duplicate keys on the one side of a relationship break the semantic model."
    fr: "Regrouper par ProductID et conserver les groupes avec `HAVING COUNT(*) > 1` renvoie chaque clé en double avec son nombre d'occurrences. La vérification est nécessaire, car une clé primaire NOT ENFORCED ne rejette pas les doublons, et des clés en double du côté un d'une relation cassent le modèle sémantique."
  options:
    a: { en: "DISTINCT lists every key once, duplicated or not, so it doesn't identify the duplicates.", fr: "DISTINCT liste chaque clé une fois, en double ou non : il n'identifie pas les doublons." }
    b: { en: "Aggregates can't be used in the WHERE clause; group conditions go in HAVING.", fr: "Les agrégats ne peuvent pas être utilisés dans la clause WHERE ; les conditions sur les groupes vont dans HAVING." }
    d: { en: "COUNT(*) = 1 returns the keys that appear only once.", fr: "COUNT(*) = 1 renvoie les clés qui n'apparaissent qu'une fois." }
references:
  - title: T-SQL surface area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
  - title: SELECT - GROUP BY clause (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-group-by-transact-sql
