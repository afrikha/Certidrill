id: dp600-2e-dax-profitable-months
objective: "2.3.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a semantic model named **FinanceModel**. The **Date** table contains a column named **Month** with values such as `2026-01` and `2026-02`. The model contains the measures **Total Sales** and **Profit**. Profit is negative for some months.

    You need a DAX query that returns the total sales of each month, only for the months whose Profit is greater than zero.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique nommé **FinanceModel**. La table **Date** contient une colonne nommée **Month** avec des valeurs comme `2026-01` et `2026-02`. Le modèle contient les mesures **Total Sales** et **Profit**. Profit est négatif pour certains mois.

    Vous avez besoin d'une requête DAX qui renvoie le total des ventes de chaque mois, uniquement pour les mois dont Profit est supérieur à zéro.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    EVALUATE
        SUMMARIZECOLUMNS (
            'Date'[Month],
            [[fn]] ( VALUES ( 'Date'[Month] ), [[cond]] ),
            "Sales", [Total Sales]
        )
  slots:
    - id: fn
      options:
        - { id: calctable, text: CALCULATETABLE }
        - { id: treatas, text: TREATAS }
        - { id: filter, text: FILTER }
        - { id: keep, text: KEEPFILTERS }
    - id: cond
      options:
        - { id: sum, text: "SUM ( Sales[Profit] ) > 0" }
        - { id: measure, text: "[Profit] > 0" }
        - { id: column, text: "Sales[Profit] > 0" }
answer:
  values: { fn: filter, cond: measure }
explanation:
  correct:
    en: "FILTER iterates the months returned by VALUES and keeps those for which the condition is true; the resulting table is a filter argument of SUMMARIZECOLUMNS on the grouped column. A measure reference such as [Profit] performs a context transition, so Profit is evaluated for each month. A Boolean filter argument of CALCULATETABLE can't reference a measure, which is why FILTER is required here."
    fr: "FILTER itère les mois renvoyés par VALUES et conserve ceux pour lesquels la condition est vraie ; la table obtenue est un argument de filtre de SUMMARIZECOLUMNS sur la colonne regroupée. Une référence de mesure comme [Profit] effectue une transition de contexte : Profit est évalué pour chaque mois. Un argument de filtre booléen de CALCULATETABLE ne peut pas référencer de mesure, c'est pourquoi FILTER est nécessaire ici."
  options:
    calctable:
      en: "A Boolean filter argument of CALCULATETABLE can't reference a measure, so a condition on [Profit] isn't allowed there."
      fr: "Un argument de filtre booléen de CALCULATETABLE ne peut pas référencer de mesure : une condition sur [Profit] n'y est pas autorisée."
    treatas:
      en: "TREATAS applies the values of a table to existing columns; its second argument can't be a condition."
      fr: "TREATAS applique les valeurs d'une table à des colonnes existantes ; son deuxième argument ne peut pas être une condition."
    keep:
      en: "KEEPFILTERS takes a single expression and only changes how a filter combines with the existing filters."
      fr: "KEEPFILTERS prend une seule expression et ne fait que modifier la façon dont un filtre se combine avec les filtres existants."
    sum:
      en: "Without CALCULATE there is no context transition: SUM returns the profit of all months for every row, so no month is filtered out when the overall profit is positive."
      fr: "Sans CALCULATE, il n'y a pas de transition de contexte : SUM renvoie le profit de tous les mois pour chaque ligne, donc aucun mois n'est exclu si le profit global est positif."
    column:
      en: "A row of VALUES ( 'Date'[Month] ) has no single value of Sales[Profit], so this reference returns an error."
      fr: "Une ligne de VALUES ( 'Date'[Month] ) n'a pas de valeur unique de Sales[Profit] : cette référence renvoie une erreur."
references:
  - title: Avoid using FILTER as a filter argument in DAX
    url: https://learn.microsoft.com/en-us/dax/best-practices/dax-avoid-avoid-filter-as-filter-argument
  - title: FILTER function (DAX)
    url: https://learn.microsoft.com/en-us/dax/filter-function-dax
