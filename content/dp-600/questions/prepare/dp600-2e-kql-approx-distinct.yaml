id: dp600-2e-kql-approx-distinct
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric eventhouse that contains a KQL database named **WebDB**. WebDB contains a table named **PageViews** that receives about two billion rows per day. Each row has the columns **UserId**, **Country**, **Url** and **Timestamp**.

    A dashboard tile must show, for each country, the number of different users who viewed a page during the last 24 hours. An estimate with an error of about 1 percent is acceptable. The query must consume as few resources as possible.

    Which aggregation should you use in the following query?

    ```kusto
    PageViews
    | where Timestamp > ago(24h)
    | summarize Users = <aggregation> by Country
    ```
  fr: |
    Vous disposez d'un eventhouse Fabric qui contient une base de données KQL nommée **WebDB**. WebDB contient une table nommée **PageViews** qui reçoit environ deux milliards de lignes par jour. Chaque ligne comporte les colonnes **UserId**, **Country**, **Url** et **Timestamp**.

    Une vignette de tableau de bord doit afficher, pour chaque pays, le nombre d'utilisateurs différents qui ont consulté une page au cours des dernières 24 heures. Une estimation avec une erreur d'environ 1 % est acceptable. La requête doit consommer le moins de ressources possible.

    Quelle agrégation devez-vous utiliser dans la requête suivante ?

    ```kusto
    PageViews
    | where Timestamp > ago(24h)
    | summarize Users = <aggregation> by Country
    ```
body:
  options:
    - { id: a, text: "dcount(UserId)" }
    - { id: b, text: "count_distinct(UserId)" }
    - { id: c, text: "count()" }
    - { id: d, text: "array_length(make_set(UserId))" }
answer: { optionId: a }
explanation:
  correct:
    en: "`dcount()` returns an estimate of the number of distinct values by using a HyperLogLog variant. With the default accuracy level (1), the error is about 0.8 percent, and it consumes far fewer resources than an exact distinct count on billions of rows."
    fr: "`dcount()` renvoie une estimation du nombre de valeurs distinctes à l'aide d'une variante de HyperLogLog. Avec le niveau de précision par défaut (1), l'erreur est d'environ 0,8 %, et la fonction consomme beaucoup moins de ressources qu'un comptage distinct exact sur des milliards de lignes."
  options:
    b:
      en: "`count_distinct()` returns an exact count, but Microsoft recommends the less resource-consuming `dcount()` when an estimate is enough."
      fr: "`count_distinct()` renvoie un comptage exact, mais Microsoft recommande `dcount()`, qui consomme moins de ressources, quand une estimation suffit."
    c:
      en: "`count()` counts page views (rows), not different users."
      fr: "`count()` compte les pages vues (les lignes), pas les utilisateurs différents."
    d:
      en: "Building the set of every user ID of each country consumes far more memory than an estimate, the opposite of the requirement."
      fr: "Construire l'ensemble de tous les ID d'utilisateur de chaque pays consomme bien plus de mémoire qu'une estimation, l'inverse de l'exigence."
references:
  - title: dcount() (aggregation function)
    url: https://learn.microsoft.com/en-us/kusto/query/dcount-aggregation-function
  - title: count_distinct() (aggregation function) - (preview)
    url: https://learn.microsoft.com/en-us/kusto/query/count-distinct-aggregation-function
