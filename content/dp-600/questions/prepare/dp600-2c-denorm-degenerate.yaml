id: dp600-2c-denorm-degenerate
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse named **WH1** that contains a fact table named **FactSales** at the order line grain. Each row contains a **SalesOrderNumber** column. No other attribute describes the sales order.

    Report users must be able to filter sales by sales order number. The solution must minimize the number of tables and the storage used by the semantic model built from WH1.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé **WH1** qui contient une table de faits nommée **FactSales** au grain de la ligne de commande. Chaque ligne contient une colonne **SalesOrderNumber**. Aucun autre attribut ne décrit la commande.

    Les utilisateurs des rapports doivent pouvoir filtrer les ventes par numéro de commande. La solution doit réduire au minimum le nombre de tables et le stockage utilisé par le modèle sémantique construit à partir de WH1.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Keep SalesOrderNumber in FactSales as a degenerate dimension.", fr: "Conserver SalesOrderNumber dans FactSales comme dimension dégénérée." }
    - id: b
      text: { en: "Move SalesOrderNumber to a new DimSalesOrder table related to FactSales.", fr: "Déplacer SalesOrderNumber vers une nouvelle table DimSalesOrder liée à FactSales." }
    - id: c
      text: { en: "Move SalesOrderNumber to the DimCustomer table related to FactSales.", fr: "Déplacer SalesOrderNumber vers la table DimCustomer liée à FactSales." }
    - id: d
      text: { en: "Move SalesOrderNumber to a junk dimension related to FactSales.", fr: "Déplacer SalesOrderNumber vers une dimension fourre-tout liée à FactSales." }
answer: { optionId: a }
explanation:
  correct:
    en: "An attribute such as an order number that has the same grain as the facts is a degenerate dimension. Keeping it in the fact table is the accepted practice: a separate one-column table would add storage and clutter without adding information."
    fr: "Un attribut tel qu'un numéro de commande, au même grain que les faits, est une dimension dégénérée. Le conserver dans la table de faits est la pratique admise : une table distincte d'une seule colonne ajouterait du stockage et de l'encombrement sans apporter d'information."
  options:
    b: { en: "A one-column dimension table adds a table, a relationship and storage for no extra attribute.", fr: "Une table de dimension d'une seule colonne ajoute une table, une relation et du stockage sans aucun attribut supplémentaire." }
    c: { en: "A customer places many orders, so the order number doesn't belong to the customer grain.", fr: "Un client passe de nombreuses commandes : le numéro de commande n'appartient pas au grain du client." }
    d: { en: "A junk dimension combines low-cardinality flags; an order number has a value for almost every order.", fr: "Une dimension fourre-tout combine des indicateurs à faible cardinalité ; un numéro de commande a une valeur pour presque chaque commande." }
references:
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Dimension tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
