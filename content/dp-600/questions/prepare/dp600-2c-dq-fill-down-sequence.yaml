id: dp600-2c-dq-fill-down-sequence
objective: "2.2.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Dataflow Gen2 that imports an Excel sheet of sales targets. The first row of the sheet contains the column names, but Power Query didn't promote it, so the columns are named Column1, Column2 and Column3.

    In the sheet, the **Region** value appears only on the first row of each block of rows. The Region cells of the other rows of the block contain empty text, not null.

    You need every row to contain its region.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un Dataflow Gen2 qui importe une feuille Excel d'objectifs de vente. La première ligne de la feuille contient les noms de colonnes, mais Power Query ne l'a pas promue : les colonnes s'appellent Column1, Column2 et Column3.

    Dans la feuille, la valeur **Region** n'apparaît que sur la première ligne de chaque bloc de lignes. Les cellules Region des autres lignes du bloc contiennent du texte vide, et non null.

    Chaque ligne doit contenir sa région.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: headers, text: { en: "Use the first row as headers.", fr: "Utiliser la première ligne comme en-têtes." } }
    - { id: replace, text: { en: "Replace values in Region: leave Value to find empty and enter null in Replace with.", fr: "Remplacer les valeurs dans Region : laisser Valeur à rechercher vide et saisir null dans Remplacer par." } }
    - { id: down, text: { en: "Fill down the Region column.", fr: "Remplir vers le bas la colonne Region." } }
    - { id: up, text: { en: "Fill up the Region column.", fr: "Remplir vers le haut la colonne Region." } }
    - { id: blank, text: { en: "Remove blank rows.", fr: "Supprimer les lignes vides." } }
    - { id: dedup, text: { en: "Remove duplicates on the Region column.", fr: "Supprimer les doublons sur la colonne Region." } }
answer:
  sequence: [ headers, replace, down ]
explanation:
  correct:
    en: "The Region column exists by name only after the first row is promoted to headers. Fill down replaces null values only, so the empty text values must first be replaced with null. Fill down then copies each region to the rows below it until the next value."
    fr: "La colonne Region n'existe sous ce nom qu'après la promotion de la première ligne en en-têtes. Remplir vers le bas ne remplace que les valeurs null : les valeurs de texte vide doivent d'abord être remplacées par null. Remplir vers le bas copie ensuite chaque région dans les lignes suivantes jusqu'à la valeur suivante."
  options:
    up: { en: "Fill up copies values to the rows above, which would assign the next block's region.", fr: "Remplir vers le haut copie les valeurs dans les lignes précédentes, ce qui attribuerait la région du bloc suivant." }
    blank: { en: "Remove blank rows removes only rows that are entirely empty; these rows have targets.", fr: "Supprimer les lignes vides ne supprime que les lignes entièrement vides ; ces lignes ont des objectifs." }
    dedup: { en: "Removing duplicates of Region would keep one row per region and lose the targets.", fr: "Supprimer les doublons de Region conserverait une ligne par région et perdrait les objectifs." }
references:
  - title: Fill values in a column
    url: https://learn.microsoft.com/en-us/power-query/fill-values-column
  - title: Replace values and errors
    url: https://learn.microsoft.com/en-us/power-query/replace-values
