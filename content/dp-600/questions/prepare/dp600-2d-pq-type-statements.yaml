id: dp600-2d-pq-type-statements
objective: "2.2.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You use Power Query in a Dataflow Gen2 and in Power BI Desktop to prepare data from CSV files and to load it into a semantic model.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez Power Query dans un Dataflow Gen2 et dans Power BI Desktop pour préparer des données issues de fichiers CSV et les charger dans un modèle sémantique.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: By default, the automatic type detection of a CSV file is based on the values of the first 200 rows.
        fr: Par défaut, la détection automatique des types d'un fichier CSV s'appuie sur les valeurs des 200 premières lignes.
    - id: s2
      text:
        en: When you change a Date/Time column to the Date type, Power Query keeps the time part and only hides it.
        fr: Quand vous modifiez une colonne Date/Heure en type Date, Power Query conserve la partie heure et se contente de la masquer.
    - id: s3
      text:
        en: A Duration column is converted to a decimal number when it is loaded into the semantic model.
        fr: Une colonne Durée est convertie en nombre décimal quand elle est chargée dans le modèle sémantique.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      For unstructured sources such as CSV, Power Query inspects the first 200 rows and adds a Changed type step. Converting Date/Time to Date truncates the value, so the time part is lost, not hidden. Duration has no equivalent in the model and is loaded as a decimal number.
    fr: |
      Pour les sources non structurées comme les fichiers CSV, Power Query examine les 200 premières lignes et ajoute une étape Type modifié. La conversion de Date/Heure en Date tronque la valeur : la partie heure est perdue, pas masquée. Durée n'a pas d'équivalent dans le modèle et est chargée sous forme de nombre décimal.
references:
  - title: Data types in Power Query
    url: https://learn.microsoft.com/en-us/power-query/data-types
