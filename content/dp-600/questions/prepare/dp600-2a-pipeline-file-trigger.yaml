id: dp600-2a-pipeline-file-trigger
objective: "2.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a pipeline named PL-LoadSales and a lakehouse named LH-Landing. Partners upload CSV files to several folders of the Files section of LH-Landing.

    You need PL-LoadSales to run each time a file is created in the Files/sales folder only. The solution must minimize development effort.

    How should you configure the solution? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un pipeline nommé PL-LoadSales et un lakehouse nommé LH-Landing. Des partenaires chargent des fichiers CSV dans plusieurs dossiers de la section Files de LH-Landing.

    PL-LoadSales doit s'exécuter chaque fois qu'un fichier est créé dans le seul dossier Files/sales. La solution doit réduire au minimum l'effort de développement.

    Comment devez-vous configurer la solution ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Start the configuration from: [[start]]
      Event type to select: [[evt]]
      Limit the events to the folder by filtering on: [[field]]
    fr: |
      Démarrer la configuration depuis : [[start]]
      Type d'événement à sélectionner : [[evt]]
      Limiter les événements au dossier en filtrant sur : [[field]]
  slots:
    - id: start
      options:
        - { id: schedule, text: { en: "Schedule on the Home ribbon of the PL-LoadSales canvas", fr: "Planifier (Schedule) dans le ruban Accueil du canevas de PL-LoadSales" } }
        - { id: trigger, text: { en: "Trigger on the Home ribbon of the PL-LoadSales canvas", fr: "Déclencheur (Trigger) dans le ruban Accueil du canevas de PL-LoadSales" } }
        - { id: monitor, text: { en: "The Monitoring hub", fr: "Le hub de surveillance" } }
        - { id: onelakeset, text: { en: "The OneLake tab of the Workspace1 settings", fr: "L'onglet OneLake des paramètres de Workspace1" } }
    - id: evt
      options:
        - { id: foldercreated, text: Microsoft.Fabric.OneLake.FolderCreated }
        - { id: blobcreated, text: Microsoft.Storage.BlobCreated }
        - { id: filecreated, text: Microsoft.Fabric.OneLake.FileCreated }
        - { id: filerenamed, text: Microsoft.Fabric.OneLake.FileRenamed }
    - id: field
      options:
        - { id: source, text: { en: "The source field", fr: "Le champ source" } }
        - { id: type, text: { en: "The type field", fr: "Le champ type" } }
        - { id: subject, text: { en: "The subject field", fr: "Le champ subject" } }
answer:
  values: { start: trigger, evt: filecreated, field: subject }
explanation:
  correct:
    en: |
      Selecting Trigger on the pipeline canvas opens the Set alert panel, where you choose OneLake events as the source; Fabric creates the eventstream and the Activator item that runs the pipeline. FileCreated is raised when a file is created or updated, and the subject field carries the path of the file (for example /Files/sales/...), so a filter on subject restricts the trigger to one folder.
    fr: |
      Sélectionner Trigger sur le canevas du pipeline ouvre le volet Set alert, où vous choisissez les événements OneLake comme source ; Fabric crée le flux d'événements et l'élément Activator qui exécute le pipeline. FileCreated est déclenché quand un fichier est créé ou mis à jour, et le champ subject contient le chemin du fichier (par exemple /Files/sales/...) : un filtre sur subject limite le déclencheur à un dossier.
  options:
    schedule: { en: "A schedule runs the pipeline at fixed times, not when a file arrives.", fr: "Une planification exécute le pipeline à heures fixes, pas à l'arrivée d'un fichier." }
    foldercreated: { en: "FolderCreated is raised for new folders, not for files added to an existing folder.", fr: "FolderCreated est déclenché pour les nouveaux dossiers, pas pour les fichiers ajoutés à un dossier existant." }
    blobcreated: { en: "BlobCreated is an event of Azure storage accounts, not of OneLake.", fr: "BlobCreated est un événement des comptes de stockage Azure, pas de OneLake." }
    source: { en: "The source field identifies the workspace and the item, not the folder of the file.", fr: "Le champ source identifie l'espace de travail et l'élément, pas le dossier du fichier." }
references:
  - title: Run, schedule, or use events to trigger a pipeline
    url: https://learn.microsoft.com/en-us/fabric/data-factory/pipeline-storage-event-triggers
  - title: Explore OneLake events in Fabric Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/explore-fabric-onelake-events
