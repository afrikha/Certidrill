id: dp600-2c-denorm-benefits
objective: "2.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A semantic model named **SM1** contains three related tables for one business entity: **DimProduct**, **DimProductSubcategory** and **DimProductCategory**. You plan to replace them with a single denormalized product table.

    Which two benefits does the new design provide?

    NOTE: Each correct selection is worth one point.
  fr: |
    Un modèle sémantique nommé **SM1** contient trois tables liées pour une même entité métier : **DimProduct**, **DimProductSubcategory** et **DimProductCategory**. Vous prévoyez de les remplacer par une seule table dénormalisée des produits.

    Quels sont les deux avantages de la nouvelle conception ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: b, text: { en: "The category and subcategory names are stored only once, which removes redundant storage.", fr: "Les noms de catégorie et de sous-catégorie ne sont stockés qu'une fois, ce qui supprime le stockage redondant." } }
    - { id: a, text: { en: "A hierarchy can span from the category level down to the product level.", fr: "Une hiérarchie peut aller du niveau de la catégorie jusqu'au niveau du produit." } }
    - { id: d, text: { en: "History of category changes can be tracked separately from product changes.", fr: "L'historique des changements de catégorie peut être suivi séparément de celui des produits." } }
    - { id: e, text: { en: "Referential integrity between products and categories is enforced by the model.", fr: "L'intégrité référentielle entre produits et catégories est appliquée par le modèle." } }
    - { id: c, text: { en: "Filters on category reach the fact table through a shorter relationship chain.", fr: "Les filtres sur la catégorie atteignent la table de faits par une chaîne de relations plus courte." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "In one table, a hierarchy can include the category, subcategory and product columns, which isn't possible across tables. Filters no longer travel through two extra relationships, and the model loads fewer tables. The cost is some redundant storage of the category and subcategory names."
    fr: "Dans une seule table, une hiérarchie peut inclure les colonnes de catégorie, de sous-catégorie et de produit, ce qui est impossible sur plusieurs tables. Les filtres ne traversent plus deux relations supplémentaires, et le modèle charge moins de tables. La contrepartie est un peu de stockage redondant des noms de catégorie et de sous-catégorie."
  options:
    b: { en: "Denormalizing repeats the category and subcategory names on every product row; it adds redundancy.", fr: "La dénormalisation répète les noms de catégorie et de sous-catégorie sur chaque ligne de produit ; elle ajoute de la redondance." }
    d: { en: "Tracking history at the category level separately is a reason to keep a snowflake, not a benefit of flattening.", fr: "Suivre l'historique séparément au niveau de la catégorie est une raison de conserver un flocon, pas un avantage de l'aplatissement." }
    e: { en: "A single table has no relationship between products and categories to enforce.", fr: "Une table unique n'a pas de relation entre produits et catégories à faire respecter." }
references:
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
