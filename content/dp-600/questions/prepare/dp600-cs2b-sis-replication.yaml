id: dp600-cs2b-sis-replication
objective: "2.1.3"
type: single
caseStudy: dp600-cs2b-bellows-college
difficulty: 1
status: draft
stem:
  en: |
    You need to bring the data of SIS-DB into Fabric.

    What should you use?
  fr: |
    Vous devez amener les données de SIS-DB dans Fabric.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "A copy job that copies the SIS-DB tables incrementally to a lakehouse", fr: "Une tâche de copie qui copie les tables de SIS-DB de façon incrémentielle vers un lakehouse" }
    - id: b
      text: { en: "A Dataflow Gen2 that loads the SIS-DB tables to WH-Academic", fr: "Un Dataflow Gen2 qui charge les tables de SIS-DB dans WH-Academic" }
    - id: c
      text: { en: "A mirrored database that replicates SIS-DB", fr: "Une base de données mise en miroir qui réplique SIS-DB" }
    - id: d
      text: { en: "A OneLake shortcut that points to SIS-DB", fr: "Un raccourci OneLake qui pointe vers SIS-DB" }
answer:
  optionId: c
explanation:
  correct:
    en: "Mirroring continuously replicates the tables of an Azure SQL Database database into OneLake as Delta tables, with no pipeline or notebook to build. The Fabric compute that replicates the data is free; only queries on the mirrored data consume capacity. SIS-DB uses the vCore purchasing model, whose service tiers are all supported."
    fr: "La mise en miroir réplique en continu les tables d'une base de données Azure SQL Database dans OneLake sous forme de tables Delta, sans pipeline ni notebook à créer. Le calcul Fabric qui réplique les données est gratuit ; seules les requêtes sur les données mises en miroir consomment de la capacité. SIS-DB utilise le modèle d'achat vCore, dont tous les niveaux de service sont pris en charge."
  options:
    a:
      en: "A copy job is an item that the team must create and schedule, and its runs consume capacity units."
      fr: "Une tâche de copie est un élément que l'équipe doit créer et planifier, et ses exécutions consomment des unités de capacité."
    b:
      en: "A Dataflow Gen2 is an item that the team must build and maintain, and each refresh consumes capacity units."
      fr: "Un Dataflow Gen2 est un élément que l'équipe doit créer et maintenir, et chaque actualisation consomme des unités de capacité."
    d:
      en: "OneLake shortcuts point to storage locations such as other Fabric items, ADLS Gen2 or Amazon S3; they cannot point to an Azure SQL Database database."
      fr: "Les raccourcis OneLake pointent vers des emplacements de stockage tels que d'autres éléments Fabric, ADLS Gen2 ou Amazon S3 ; ils ne peuvent pas pointer vers une base de données Azure SQL Database."
references:
  - title: Microsoft Fabric Mirrored Databases from Azure SQL Database
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-sql-database
