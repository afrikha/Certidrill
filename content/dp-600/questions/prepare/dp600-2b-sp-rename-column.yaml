id: dp600-2b-sp-rename-column
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse named Warehouse1. Yesterday you added a column named CustSeg to dbo.DimCustomer and populated it.

    You need to rename the column to CustomerSegment. The values in the column must be kept.

    Which statement should you run?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé Warehouse1. Hier, vous avez ajouté une colonne nommée CustSeg à dbo.DimCustomer et vous l'avez renseignée.

    Vous devez renommer la colonne en CustomerSegment. Les valeurs de la colonne doivent être conservées.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "EXEC sp_rename 'dbo.DimCustomer.CustSeg', 'CustomerSegment', 'COLUMN';" }
    - { id: b, text: "ALTER TABLE dbo.DimCustomer ALTER COLUMN CustSeg CustomerSegment;" }
    - { id: c, text: "ALTER TABLE dbo.DimCustomer RENAME COLUMN CustSeg TO CustomerSegment;" }
    - { id: d, text: "ALTER TABLE dbo.DimCustomer DROP COLUMN CustSeg; ALTER TABLE dbo.DimCustomer ADD CustomerSegment varchar(20) NULL;" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In Fabric Data Warehouse, sp_rename renames a column in a user table and keeps its data.
    fr: |
      Dans Fabric Data Warehouse, sp_rename renomme une colonne d'une table utilisateur et conserve ses données.
  options:
    c:
      en: |
        RENAME COLUMN is not T-SQL syntax.
      fr: |
        RENAME COLUMN n'est pas une syntaxe T-SQL.
    b:
      en: |
        ALTER COLUMN changes the definition of a column, not its name.
      fr: |
        ALTER COLUMN modifie la définition d'une colonne, pas son nom.
    d:
      en: |
        Dropping the column deletes its values; the new column would be empty.
      fr: |
        Supprimer la colonne efface ses valeurs ; la nouvelle colonne serait vide.
references:
  - title: T-SQL Surface Area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
