id: dp600-2a-blob-events-steps
objective: "2.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1. Your Azure subscription contains a general-purpose v2 storage account named stinvoices.

    You need to send the Azure Blob Storage events of stinvoices to a new eventstream named ES-Invoices in Workspace1. You must start from Real-Time hub.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1. Votre abonnement Azure contient un compte de stockage universel v2 nommé stinvoices.

    Vous devez envoyer les événements Stockage Blob Azure de stinvoices vers un nouveau flux d'événements nommé ES-Invoices dans Workspace1. Vous devez partir du hub Real-Time.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: tile, text: { en: "In Real-Time hub, select Add data, and then select Connect on the Azure Blob Storage events tile.", fr: "Dans le hub Real-Time, sélectionner Add data, puis Connect sur la vignette Azure Blob Storage events." } }
    - { id: account, text: { en: "Select the Azure subscription and the stinvoices storage account.", fr: "Sélectionner l'abonnement Azure et le compte de stockage stinvoices." } }
    - { id: details, text: { en: "Select Workspace1 and enter ES-Invoices as the eventstream name.", fr: "Sélectionner Workspace1 et saisir ES-Invoices comme nom du flux d'événements." } }
    - { id: connect, text: { en: "Review the summary, and then select Connect.", fr: "Vérifier le récapitulatif, puis sélectionner Connect." } }
    - { id: shortcut, text: { en: "Create an ADLS Gen2 shortcut to stinvoices in a lakehouse.", fr: "Créer un raccourci ADLS Gen2 vers stinvoices dans un lakehouse." } }
    - { id: onelake, text: { en: "Select OneLake events on the Fabric events page.", fr: "Sélectionner OneLake events dans la page Fabric events." } }
answer:
  sequence: [ tile, account, details, connect ]
explanation:
  correct:
    en: |
      From the Add data page of Real-Time hub, the Azure events category contains the Azure Blob Storage events tile. The wizard asks first for the subscription and storage account, then for the workspace and the eventstream name (the stream name is derived from it), and creates the eventstream after Review + connect. The new stream then appears on the All data streams page.
    fr: |
      Depuis la page Add data du hub Real-Time, la catégorie Azure events contient la vignette Azure Blob Storage events. L'assistant demande d'abord l'abonnement et le compte de stockage, puis l'espace de travail et le nom du flux d'événements (le nom du flux en est dérivé), et crée le flux d'événements après Review + connect. Le nouveau flux apparaît ensuite dans la page All data streams.
  options:
    shortcut:
      en: A shortcut exposes the files of the account in OneLake; it does not deliver the blob events of the account.
      fr: Un raccourci expose les fichiers du compte dans OneLake ; il ne transmet pas les événements de blob du compte.
    onelake:
      en: OneLake events report changes in OneLake, not in an Azure storage account.
      fr: Les événements OneLake signalent les modifications dans OneLake, pas dans un compte de stockage Azure.
references:
  - title: Get Azure Blob Storage events in Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/get-azure-blob-storage-events
