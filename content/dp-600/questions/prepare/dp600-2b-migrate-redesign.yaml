id: dp600-2b-migrate-redesign
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to migrate the database objects of an Azure SQL database named SalesDB to a Fabric warehouse named Warehouse1. SalesDB contains the following objects:

    - An AFTER INSERT trigger on dbo.Orders that writes an audit row
    - A synonym named dbo.Cust that refers to dbo.Customer
    - An inline table-valued function named dbo.fnOrdersSince
    - A view named dbo.vOrderTotals
    - A stored procedure named dbo.usp_UpsertCustomer that uses MERGE

    Which two objects must you redesign because Warehouse1 does not support them?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de migrer les objets d'une base de données Azure SQL nommée SalesDB vers un entrepôt Fabric nommé Warehouse1. SalesDB contient les objets suivants :

    - Un déclencheur AFTER INSERT sur dbo.Orders qui écrit une ligne d'audit
    - Un synonyme nommé dbo.Cust qui fait référence à dbo.Customer
    - Une fonction table inline nommée dbo.fnOrdersSince
    - Une vue nommée dbo.vOrderTotals
    - Une procédure stockée nommée dbo.usp_UpsertCustomer qui utilise MERGE

    Quels sont les deux objets que vous devez reconcevoir, car Warehouse1 ne les prend pas en charge ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The AFTER INSERT trigger", fr: "Le déclencheur AFTER INSERT" } }
    - { id: b, text: { en: "The dbo.fnOrdersSince function", fr: "La fonction dbo.fnOrdersSince" } }
    - { id: c, text: { en: "The dbo.Cust synonym", fr: "Le synonyme dbo.Cust" } }
    - { id: d, text: { en: "The dbo.vOrderTotals view", fr: "La vue dbo.vOrderTotals" } }
    - { id: e, text: { en: "The dbo.usp_UpsertCustomer stored procedure", fr: "La procédure stockée dbo.usp_UpsertCustomer" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Fabric Data Warehouse doesn't support triggers or synonyms, so the audit logic must move, for example into the load procedure, and code must reference dbo.Customer directly. Views, inline table-valued functions and stored procedures are supported, and MERGE is generally available.
    fr: |
      Fabric Data Warehouse ne prend en charge ni les déclencheurs ni les synonymes : la logique d'audit doit être déplacée, par exemple dans la procédure de chargement, et le code doit référencer directement dbo.Customer. Les vues, les fonctions table inline et les procédures stockées sont prises en charge, et MERGE est en disponibilité générale.
  options:
    b:
      en: |
        Inline table-valued functions are supported in Fabric Data Warehouse.
      fr: |
        Les fonctions table inline sont prises en charge dans Fabric Data Warehouse.
    d:
      en: |
        Views are supported in Fabric Data Warehouse.
      fr: |
        Les vues sont prises en charge dans Fabric Data Warehouse.
    e:
      en: |
        Stored procedures are supported and MERGE is generally available in Fabric Data Warehouse.
      fr: |
        Les procédures stockées sont prises en charge et MERGE est en disponibilité générale dans Fabric Data Warehouse.
references:
  - title: T-SQL Surface Area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
