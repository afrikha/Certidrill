id: dp600-2e-dax-visual-query
objective: "2.3.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Power BI Desktop file that contains a semantic model and a report page with a table visual named **Visual1**. Visual1 shows sales by product category.

    You need to open the DAX query that Visual1 sends to the semantic model in DAX query view so that you can modify it and run it.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un fichier Power BI Desktop qui contient un modèle sémantique et une page de rapport avec un visuel de table nommé **Visual1**. Visual1 affiche les ventes par catégorie de produits.

    Vous devez ouvrir dans la vue de requête DAX la requête DAX que Visual1 envoie au modèle sémantique, afin de pouvoir la modifier et l'exécuter.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: open, text: { en: "In Report view, select **Optimize** > **Performance analyzer**.", fr: "Dans la vue Rapport, sélectionner **Optimiser** > **Analyseur de performances**." } }
    - { id: record, text: { en: "Select **Start recording**.", fr: "Sélectionner **Démarrer l'enregistrement**." } }
    - { id: refresh, text: { en: "Select **Refresh visuals**.", fr: "Sélectionner **Actualiser les visuels**." } }
    - { id: run, text: { en: "Expand the Visual1 entry and select **Run in DAX query view**.", fr: "Développer l'entrée de Visual1 et sélectionner **Exécuter dans la vue de requête DAX**." } }
    - { id: quick, text: { en: "In DAX query view, right-click the Sales table and select **Quick queries** > **Show top 100 rows**.", fr: "Dans la vue de requête DAX, cliquer avec le bouton droit sur la table Sales et sélectionner **Requêtes rapides** > **Afficher les 100 premières lignes**." } }
    - { id: format, text: { en: "In DAX query view, select **Format** on the ribbon.", fr: "Dans la vue de requête DAX, sélectionner **Mettre en forme** dans le ruban." } }
answer:
  sequence: [ open, record, refresh, run ]
explanation:
  correct:
    en: "Performance analyzer records the queries that visuals send when they are refreshed. You open it from the Optimize ribbon of Report view, start recording, and refresh the visuals so that Visual1 runs its query. Expanding the Visual1 entry then lets you copy its query or run it in DAX query view, where it opens in a new tab."
    fr: "L'Analyseur de performances enregistre les requêtes envoyées par les visuels lors de leur actualisation. Vous l'ouvrez depuis le ruban Optimiser de la vue Rapport, démarrez l'enregistrement, puis actualisez les visuels pour que Visual1 exécute sa requête. Développer l'entrée de Visual1 permet ensuite de copier sa requête ou de l'exécuter dans la vue de requête DAX, où elle s'ouvre dans un nouvel onglet."
  options:
    quick:
      en: "Show top 100 rows generates a query on a table; it isn't the query of Visual1."
      fr: "Afficher les 100 premières lignes génère une requête sur une table ; ce n'est pas la requête de Visual1."
    format:
      en: "Format only reformats the query that is already in the editor."
      fr: "Mettre en forme ne fait que remettre en forme la requête déjà présente dans l'éditeur."
references:
  - title: DAX Query View
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/dax-query-view
