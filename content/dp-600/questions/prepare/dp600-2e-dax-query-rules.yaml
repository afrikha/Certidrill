id: dp600-2e-dax-query-rules
objective: "2.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model named **SalesModel** that contains a measure named **Sales[Total Sales]**. You write DAX queries against SalesModel in DAX query view of Power BI Desktop.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique nommé **SalesModel** qui contient une mesure nommée **Sales[Total Sales]**. Vous écrivez des requêtes DAX sur SalesModel dans la vue de requête DAX de Power BI Desktop.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Running a query whose DEFINE block contains `MEASURE Sales[Total Sales] = SUM ( Sales[NetAmount] )` changes the formula of the Total Sales measure in the model."
        fr: "Exécuter une requête dont le bloc DEFINE contient `MEASURE Sales[Total Sales] = SUM ( Sales[NetAmount] )` modifie la formule de la mesure Total Sales dans le modèle."
    - id: s2
      text:
        en: "A single DAX query can contain several EVALUATE statements that each return a table."
        fr: "Une même requête DAX peut contenir plusieurs instructions EVALUATE qui renvoient chacune une table."
    - id: s3
      text:
        en: "SUMMARIZECOLUMNS omits the rows for which every expression returns BLANK."
        fr: "SUMMARIZECOLUMNS omet les lignes pour lesquelles toutes les expressions renvoient BLANK."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "A measure definition in a query overrides the model measure of the same name only for the duration of the query; the model measure doesn't change unless you use an update action such as Update model: Overwrite measure. A query requires at least one EVALUATE statement and can contain any number of them. SUMMARIZECOLUMNS returns only the rows for which at least one expression returns a non-blank value."
    fr: "Une définition de mesure dans une requête remplace la mesure du modèle de même nom uniquement pendant la requête ; la mesure du modèle ne change pas, sauf si vous utilisez une action de mise à jour comme Mettre à jour le modèle : remplacer la mesure. Une requête exige au moins une instruction EVALUATE et peut en contenir autant que nécessaire. SUMMARIZECOLUMNS ne renvoie que les lignes pour lesquelles au moins une expression renvoie une valeur non vide."
references:
  - title: DAX Queries
    url: https://learn.microsoft.com/en-us/dax/dax-queries
  - title: SUMMARIZECOLUMNS function (DAX)
    url: https://learn.microsoft.com/en-us/dax/summarizecolumns-function-dax
