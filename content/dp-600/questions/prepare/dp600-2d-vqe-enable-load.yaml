id: dp600-2d-vqe-enable-load
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1**. In a visual query, you drag the **dbo.DimCity** and **dbo.FactSale** tables to the canvas. On DimCity, you select **Merge queries as new**, join the tables on CityKey and expand the Profit column. The canvas now contains three queries.

    When you select **View SQL**, the script contains only a SELECT statement on DimCity.

    You need to save the merged result as a view. The view must be created from the visual query without writing T-SQL.

    What should you do before you save the view?
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1**. Dans une requête visuelle, vous faites glisser les tables **dbo.DimCity** et **dbo.FactSale** sur le canevas. Sur DimCity, vous sélectionnez **Fusionner des requêtes comme nouvelles**, vous joignez les tables sur CityKey et vous développez la colonne Profit. Le canevas contient maintenant trois requêtes.

    Quand vous sélectionnez **Afficher le SQL**, le script ne contient qu'une instruction SELECT sur DimCity.

    Vous devez enregistrer le résultat fusionné en tant que vue. La vue doit être créée à partir de la requête visuelle sans écrire de T-SQL.

    Que devez-vous faire avant d'enregistrer la vue ?
body:
  options:
    - { id: a, text: { en: "Change the join kind of the merge from Inner to Left outer.", fr: "Changer le type de jointure de la fusion de Interne en Externe gauche." } }
    - { id: b, text: { en: "Select Enable load on the merged query.", fr: "Sélectionner Activer le chargement sur la requête fusionnée." } }
    - { id: c, text: { en: "Drag FactSale to the canvas again, and then merge it with DimCity.", fr: "Faire de nouveau glisser FactSale sur le canevas, puis le fusionner avec DimCity." } }
    - { id: d, text: { en: "Remove the expand step, and then save DimCity as a view.", fr: "Supprimer l'étape de développement, puis enregistrer DimCity en tant que vue." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When a visual query contains several queries, the SQL script, and therefore the saved view, represents only the query that has load enabled. Selecting Enable load on the merged query makes the script contain the join, so Save as view creates the merged view.
    fr: |
      Quand une requête visuelle contient plusieurs requêtes, le script SQL, et donc la vue enregistrée, ne représente que la requête dont le chargement est activé. Sélectionner Activer le chargement sur la requête fusionnée fait figurer la jointure dans le script : Enregistrer en tant que vue crée la vue fusionnée.
  options:
    a: { en: "The join kind changes which rows are returned, not which query the script represents.", fr: "Le type de jointure modifie les lignes renvoyées, pas la requête que représente le script." }
    c: { en: "A second merge adds another query, and the script still represents the query that has load enabled.", fr: "Une seconde fusion ajoute une autre requête, et le script représente toujours la requête dont le chargement est activé." }
    d: { en: "A view on DimCity alone doesn't contain the merged result.", fr: "Une vue sur DimCity seule ne contient pas le résultat fusionné." }
references:
  - title: Query using the visual query editor
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/visual-query-editor
