id: dp600-2c-dq-pyspark-clean
objective: "2.2.7"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a lakehouse that contains a Delta table named **bronze_returns** with the columns ReturnID, Region, Reason and Discount. The table has the following quality issues:

    - Some rows are completely empty: every column is null.
    - Some Region values are empty strings instead of null.
    - Discount is null when no discount was granted.

    You need a DataFrame that removes the completely empty rows, stores missing regions as null, and replaces null discounts with 0 without changing any other column.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse qui contient une table Delta nommée **bronze_returns** avec les colonnes ReturnID, Region, Reason et Discount. La table présente les problèmes de qualité suivants :

    - Certaines lignes sont entièrement vides : toutes les colonnes sont null.
    - Certaines valeurs de Region sont des chaînes vides au lieu de null.
    - Discount est null quand aucune remise n'a été accordée.

    Vous avez besoin d'un DataFrame qui supprime les lignes entièrement vides, stocke les régions manquantes sous forme de null et remplace les remises null par 0 sans modifier aucune autre colonne.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    raw = spark.read.table("bronze_returns")

    clean = (raw
        .dropna(how=[[how]])
        .[[rep]]("", None, subset=["Region"])
        .fillna([[fill]]))
  slots:
    - id: how
      options:
        - { id: all, text: "\"all\"" }
        - { id: any, text: "\"any\"" }
    - id: rep
      options:
        - { id: replace, text: replace }
        - { id: fillna, text: fillna }
        - { id: dropna, text: dropna }
    - id: fill
      options:
        - { id: dict, text: "{\"Discount\": 0}" }
        - { id: zero, text: "0" }
        - { id: dictnone, text: "{\"Discount\": None}" }
answer:
  values: { how: all, rep: replace, fill: dict }
explanation:
  correct:
    en: "`dropna(how=\"all\")` removes only the rows in which every column is null. `replace(\"\", None, subset=[\"Region\"])` turns the empty strings of Region into null. `fillna({\"Discount\": 0})` replaces nulls only in the Discount column."
    fr: "`dropna(how=\"all\")` ne supprime que les lignes dont toutes les colonnes sont null. `replace(\"\", None, subset=[\"Region\"])` transforme les chaînes vides de Region en null. `fillna({\"Discount\": 0})` ne remplace les null que dans la colonne Discount."
  options:
    any: { en: "`how=\"any\"` removes every row that has at least one null, including the rows with a null Discount.", fr: "`how=\"any\"` supprime toutes les lignes qui ont au moins un null, y compris celles dont Discount est null." }
    fillna: { en: "fillna replaces null values; it doesn't turn empty strings into null.", fr: "fillna remplace des valeurs null ; il ne transforme pas des chaînes vides en null." }
    dropna: { en: "dropna removes rows; it doesn't change the empty Region values.", fr: "dropna supprime des lignes ; il ne modifie pas les valeurs Region vides." }
    zero: { en: "fillna(0) replaces nulls in every numeric column, not only Discount.", fr: "fillna(0) remplace les null dans toutes les colonnes numériques, pas seulement Discount." }
    dictnone: { en: "None isn't a replacement value; the nulls of Discount would remain.", fr: "None n'est pas une valeur de remplacement ; les null de Discount subsisteraient." }
references:
  - title: "Lakehouse tutorial: Prepare and transform data in the lakehouse"
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/tutorial-lakehouse-data-preparation
