id: dp600-2a-store-hotarea
objective: "2.1.4"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    A Fabric workspace named Workspace1 contains the items shown in the following table.

    Answer each prompt by selecting the item that meets the requirement.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un espace de travail Fabric nommé Workspace1 contient les éléments présentés dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant l'élément qui répond au besoin.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Analysts need a read-only copy of the ERP tables that stays up to date without any scheduled load or pipeline.", fr: "Les analystes ont besoin d'une copie en lecture seule des tables de l'ERP qui reste à jour sans chargement planifié ni pipeline." }
    - id: p2
      text: { en: "Operators need to query the application logs of the last ten minutes with KQL.", fr: "Les opérateurs doivent interroger en KQL les journaux d'application des dix dernières minutes." }
  grid:
    header: [{ en: "Item", fr: "Élément" }, Type, { en: "Content", fr: "Contenu" }]
    rows:
      - [{ text: LH-Raw, area: lhraw }, { text: Lakehouse }, { text: { en: "Files and Delta tables written by Spark notebooks", fr: "Fichiers et tables Delta écrits par des notebooks Spark" } }]
      - [{ text: LH-Erp, area: lherp }, { text: Lakehouse }, { text: { en: "ERP tables copied every night by a copy job", fr: "Tables de l'ERP copiées chaque nuit par un travail de copie" } }]
      - [{ text: WH-Gold, area: whgold }, { text: { en: "Warehouse", fr: "Entrepôt" } }, { text: { en: "Star schema loaded by T-SQL stored procedures", fr: "Schéma en étoile chargé par des procédures stockées T-SQL" } }]
      - [{ text: EH-Ops, area: ehops }, { text: Eventhouse }, { text: { en: "Application logs ingested by an eventstream", fr: "Journaux d'application ingérés par un flux d'événements" } }]
      - [{ text: MDB-Erp, area: mdberp }, { text: { en: "Mirrored database", fr: "Base de données en miroir" } }, { text: { en: "ERP tables replicated from SQL Server", fr: "Tables de l'ERP répliquées depuis SQL Server" } }]
answer:
  values: { p1: mdberp, p2: ehops }
explanation:
  correct:
    en: |
      A mirrored database keeps a continuously replicated, read-only copy of the source tables in OneLake, with no pipeline or schedule; LH-Erp is refreshed only once a night by a copy job. An eventhouse stores event data such as logs and is queried with KQL within seconds of ingestion.
    fr: |
      Une base de données en miroir conserve dans OneLake une copie en lecture seule, répliquée en continu, des tables sources, sans pipeline ni planification ; LH-Erp n'est actualisé qu'une fois par nuit par un travail de copie. Un eventhouse stocke des données d'événements comme les journaux et s'interroge en KQL quelques secondes après l'ingestion.
references:
  - title: What is Mirroring in Fabric?
    url: https://learn.microsoft.com/en-us/fabric/mirroring/overview
  - title: Eventhouse overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/eventhouse
