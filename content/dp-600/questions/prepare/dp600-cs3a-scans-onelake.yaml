id: dp600-cs3a-scans-onelake
objective: "2.1.5"
type: single
caseStudy: dp600-cs3a-consolidated-messenger
difficulty: 2
status: draft
stem:
  en: |
    You need to meet requirement 1.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence 1.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a lakehouse destination to ES-Scanners that writes the scanner events to a table in LH-Operations.", fr: "Ajouter à ES-Scanners une destination lakehouse qui écrit les événements des scanners dans une table de LH-Operations." } }
    - { id: b, text: { en: "Enable OneLake availability for TrackingDB without selecting Apply to existing tables, and then create a shortcut to Scans in LH-Operations.", fr: "Activer la disponibilité OneLake pour TrackingDB sans sélectionner Apply to existing tables, puis créer un raccourci vers Scans dans LH-Operations." } }
    - { id: c, text: { en: "Enable OneLake availability for TrackingDB and select Apply to existing tables, and then create a shortcut to Scans in LH-Operations.", fr: "Activer la disponibilité OneLake pour TrackingDB en sélectionnant Apply to existing tables, puis créer un raccourci vers Scans dans LH-Operations." } }
    - { id: d, text: { en: "Create a copy job that copies the Scans table from TrackingDB to LH-Operations every 15 minutes.", fr: "Créer un copy job qui copie la table Scans de TrackingDB vers LH-Operations toutes les 15 minutes." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      OneLake availability exposes the KQL database tables in OneLake as Delta tables, without copying the data, and a OneLake shortcut makes them visible in the lakehouse. When you enable it for the database, Apply to existing tables extends it to the tables that already exist, such as Scans, with a backfill of their historical data.
    fr: |
      La disponibilité OneLake expose les tables de la base de données KQL dans OneLake sous forme de tables Delta, sans copier les données, et un raccourci OneLake les rend visibles dans le lakehouse. Quand vous l'activez pour la base de données, Apply to existing tables l'étend aux tables qui existent déjà, comme Scans, avec le remplissage de leur historique.
  options:
    a: { en: "An eventstream destination copies the events into the lakehouse, which the requirement forbids, and it does not bring the two years of existing scans.", fr: "Une destination d'eventstream copie les événements dans le lakehouse, ce que l'exigence interdit, et elle n'apporte pas les deux ans de scans existants." }
    b: { en: "Enabled at the database level without Apply to existing tables, OneLake availability applies only to new tables, so the existing Scans table and its history are not made available.", fr: "Activée au niveau de la base de données sans Apply to existing tables, la disponibilité OneLake ne s'applique qu'aux nouvelles tables : la table Scans existante et son historique ne sont pas rendus disponibles." }
    d: { en: "A copy job duplicates the data into the lakehouse, which the requirement forbids.", fr: "Un copy job duplique les données dans le lakehouse, ce que l'exigence interdit." }
references:
  - title: Turn on OneLake availability for an eventhouse
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-house-onelake-availability
  - title: Unify Data Sources With OneLake Shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
