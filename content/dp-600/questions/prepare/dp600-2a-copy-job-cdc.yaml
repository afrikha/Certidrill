id: dp600-2a-copy-job-cdc
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a copy job named CJ-Orders that copies the dbo.Orders table from an Azure SQL database to a Fabric warehouse named WH-Sales. CJ-Orders uses incremental copy with ModifiedDate as the incremental column and the Merge update method.

    Rows deleted from dbo.Orders in the source database remain in WH-Sales. Change data capture (CDC) is enabled on dbo.Orders.

    You need deletions to be replicated to WH-Sales. Each run must continue to process only the changed data.

    What should you do?
  fr: |
    Vous disposez d'un travail de copie (Copy job) nommé CJ-Orders qui copie la table dbo.Orders d'une base de données Azure SQL vers un entrepôt Fabric nommé WH-Sales. CJ-Orders utilise la copie incrémentielle avec ModifiedDate comme colonne incrémentielle et la méthode de mise à jour Merge.

    Les lignes supprimées de dbo.Orders dans la base de données source restent dans WH-Sales. La capture des changements de données (CDC) est activée sur dbo.Orders.

    Vous devez répliquer les suppressions dans WH-Sales. Chaque exécution doit continuer à ne traiter que les données modifiées.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the update method of CJ-Orders to Overwrite.", fr: "Remplacer la méthode de mise à jour de CJ-Orders par Overwrite." } }
    - { id: b, text: { en: "Reset the incremental copy of dbo.Orders to a full copy.", fr: "Réinitialiser la copie incrémentielle de dbo.Orders en copie complète." } }
    - { id: c, text: { en: "Replace ModifiedDate with a ROWVERSION column as the incremental column.", fr: "Remplacer ModifiedDate par une colonne ROWVERSION comme colonne incrémentielle." } }
    - { id: d, text: { en: "Configure CJ-Orders to replicate dbo.Orders by using CDC.", fr: "Configurer CJ-Orders pour répliquer dbo.Orders à l'aide de la CDC." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Watermark-based incremental copy only tracks inserts and updates, because a deleted row no longer has a value in the incremental column. When CDC is enabled on the source, a copy job can use CDC replication, which captures inserts, updates and deletes and still copies only the changes.
    fr: |
      La copie incrémentielle basée sur un filigrane ne suit que les insertions et les mises à jour, car une ligne supprimée n'a plus de valeur dans la colonne incrémentielle. Quand la CDC est activée sur la source, un travail de copie peut utiliser la réplication CDC, qui capture les insertions, les mises à jour et les suppressions tout en ne copiant que les modifications.
  options:
    a:
      en: Overwrite replaces the destination data with what the run copies; with incremental copy, the table would keep only the last changes.
      fr: Overwrite remplace les données de destination par ce que l'exécution copie ; avec la copie incrémentielle, la table ne contiendrait plus que les dernières modifications.
    b:
      en: A reset makes the next run copy everything once, but later runs still miss deletions and the full copy processes unchanged rows.
      fr: Une réinitialisation fait tout copier une fois à l'exécution suivante, mais les exécutions suivantes ignorent toujours les suppressions, et la copie complète traite des lignes non modifiées.
    c:
      en: A ROWVERSION column is a supported watermark, but any watermark still misses rows that were deleted.
      fr: Une colonne ROWVERSION est un filigrane pris en charge, mais tout filigrane ignore toujours les lignes supprimées.
references:
  - title: What is Copy job in Data Factory for Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/data-factory/what-is-copy-job
