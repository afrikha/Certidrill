id: dp600-2b-eh-kql-shortcut
objective: "2.1.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a KQL database named KQLDB1 and a lakehouse named Lakehouse1 in the same Fabric workspace. Lakehouse1 contains a Delta table named DimDevice.

    You need KQL queries in KQLDB1 to join streaming data with DimDevice. The solution must not ingest DimDevice into KQLDB1.

    How should you complete the solution? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données KQL nommée KQLDB1 et d'un lakehouse nommé Lakehouse1 dans le même espace de travail Fabric. Lakehouse1 contient une table Delta nommée DimDevice.

    Les requêtes KQL de KQLDB1 doivent joindre des données de streaming à DimDevice. La solution ne doit pas ingérer DimDevice dans KQLDB1.

    Comment devez-vous compléter la solution ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: "In KQLDB1, create [[obj]] that points to the DimDevice table of Lakehouse1. In KQL queries, reference the data by using [[fn]]."
    fr: "Dans KQLDB1, créez [[obj]] qui pointe vers la table DimDevice de Lakehouse1. Dans les requêtes KQL, référencez les données avec [[fn]]."
  slots:
    - id: obj
      options:
        - { id: shortcut, text: { en: "a OneLake shortcut", fr: "un raccourci OneLake" } }
        - { id: mview, text: { en: "a materialized view", fr: "une vue matérialisée" } }
        - { id: update, text: { en: "an update policy", fr: "une stratégie de mise à jour" } }
        - { id: mirror, text: { en: "a mirroring policy", fr: "une stratégie de mise en miroir" } }
    - id: fn
      options:
        - { id: ext, text: "external_table('DimDevice')" }
        - { id: tbl, text: "table('DimDevice')" }
        - { id: mvfn, text: "materialized_view('DimDevice')" }
        - { id: db, text: "database('Lakehouse1').DimDevice" }
answer:
  values: { obj: shortcut, fn: ext }
explanation:
  correct:
    en: |
      A OneLake shortcut in a KQL database (New > OneLake shortcut) references a table or folder of a lakehouse, a warehouse or another KQL database without moving the data. It appears under Shortcuts in the Explorer pane and is queried as an external table, with the external_table() function.
    fr: |
      Un raccourci OneLake dans une base de données KQL (New > OneLake shortcut) référence une table ou un dossier d'un lakehouse, d'un entrepôt ou d'une autre base de données KQL sans déplacer les données. Il apparaît sous Shortcuts dans le volet Explorer et s'interroge comme une table externe, avec la fonction external_table().
  options:
    mview: { en: "A materialized view stores an aggregation of a KQL table; it doesn't point to lakehouse data.", fr: "Une vue matérialisée stocke une agrégation d'une table KQL ; elle ne pointe pas vers des données d'un lakehouse." }
    update: { en: "An update policy transforms data ingested into a KQL table; it doesn't reference external data.", fr: "Une stratégie de mise à jour transforme les données ingérées dans une table KQL ; elle ne référence pas de données externes." }
    mirror: { en: "The mirroring policy writes KQL tables to OneLake (OneLake availability), the opposite direction.", fr: "La stratégie de mise en miroir écrit les tables KQL dans OneLake (disponibilité OneLake), dans le sens inverse." }
    tbl: { en: "table() references tables of the KQL database, not shortcuts, which are external tables.", fr: "table() référence les tables de la base de données KQL, pas les raccourcis, qui sont des tables externes." }
    mvfn: { en: "materialized_view() queries a materialized view, not a shortcut.", fr: "materialized_view() interroge une vue matérialisée, pas un raccourci." }
    db: { en: "database() references another KQL database; a lakehouse is not one.", fr: "database() référence une autre base de données KQL ; un lakehouse n'en est pas une." }
references:
  - title: Create OneLake shortcuts in a KQL database
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/onelake-shortcuts
