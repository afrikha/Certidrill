id: dp600-2a-ssms-connect
objective: "2.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a warehouse named WH_Sales.

    You need to connect SQL Server Management Studio (SSMS) to WH_Sales so that the session opens directly in WH_Sales. A firewall between your computer and Fabric allows only the outbound ports that you request.

    How should you complete the connection settings? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un entrepôt nommé WH_Sales.

    Vous devez connecter SQL Server Management Studio (SSMS) à WH_Sales de sorte que la session s'ouvre directement dans WH_Sales. Un pare-feu entre votre ordinateur et Fabric n'autorise que les ports sortants que vous demandez.

    Comment devez-vous compléter les paramètres de connexion ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Server name: [[server]]
      Database (Initial Catalog): [[db]]
      Outbound TCP port to request: [[port]]
    fr: |
      Nom du serveur : [[server]]
      Base de données (Initial Catalog) : [[db]]
      Port TCP sortant à demander : [[port]]
  slots:
    - id: server
      options:
        - { id: sqlcs, text: { en: "The SQL connection string from the SQL endpoint page of the WH_Sales settings", fr: "La chaîne de connexion SQL de la page SQL endpoint des paramètres de WH_Sales" } }
        - { id: wsurl, text: { en: "The URL of Workspace1 in the Fabric portal", fr: "L'URL de Workspace1 dans le portail Fabric" } }
        - { id: onelake, text: "onelake.dfs.fabric.microsoft.com" }
        - { id: itemid, text: { en: "The item ID of WH_Sales", fr: "L'ID d'élément de WH_Sales" } }
    - id: db
      options:
        - { id: whs, text: WH_Sales }
        - { id: master, text: master }
        - { id: ws1, text: Workspace1 }
        - { id: dbo, text: dbo }
    - id: port
      options:
        - { id: p443, text: "443" }
        - { id: p1433, text: "1433" }
        - { id: p1434, text: "1434" }
        - { id: p5432, text: "5432" }
answer:
  values: { server: sqlcs, db: whs, port: p1433 }
explanation:
  correct:
    en: |
      The server name is the SQL connection string copied from the SQL endpoint page of the warehouse settings (a name ending in datawarehouse.fabric.microsoft.com). Set the warehouse name as the Initial Catalog; otherwise the session connects to master. Clients use the TDS protocol on TCP port 1433.
    fr: |
      Le nom du serveur est la chaîne de connexion SQL copiée depuis la page SQL endpoint des paramètres de l'entrepôt (un nom qui se termine par datawarehouse.fabric.microsoft.com). Indiquez le nom de l'entrepôt comme Initial Catalog ; sinon, la session se connecte à master. Les clients utilisent le protocole TDS sur le port TCP 1433.
  options:
    master: { en: "With master, the session does not open in WH_Sales; you would have to switch with USE.", fr: "Avec master, la session ne s'ouvre pas dans WH_Sales ; il faudrait basculer avec USE." }
    onelake: { en: "The OneLake endpoint serves files through the ADLS APIs, not T-SQL sessions.", fr: "Le point de terminaison OneLake sert des fichiers via les API ADLS, pas des sessions T-SQL." }
    p443: { en: "TDS traffic uses port 1433, not HTTPS on 443.", fr: "Le trafic TDS utilise le port 1433, pas HTTPS sur 443." }
references:
  - title: Connect to Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/how-to-connect
  - title: Warehouse Connectivity
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/connectivity
