id: dp600-2a-store-properties
objective: "2.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are comparing Fabric data stores for a new analytics platform at Litware.

    Which data store matches each description? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous comparez les magasins de données Fabric pour une nouvelle plateforme analytique chez Litware.

    Quel magasin de données correspond à chaque description ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Its data is available in OneLake in Delta format only after you enable an option: [[a]]
      It uses the same SQL Database Engine as Azure SQL Database: [[b]]
      It can store unstructured files, such as images and PDF documents: [[c]]
    fr: |
      Ses données ne sont disponibles dans OneLake au format Delta qu'après l'activation d'une option : [[a]]
      Il utilise le même moteur de base de données SQL qu'Azure SQL Database : [[b]]
      Il peut stocker des fichiers non structurés, comme des images et des documents PDF : [[c]]
  slots:
    - id: a
      options:
        - { id: lh, text: Lakehouse }
        - { id: wh, text: { en: "Warehouse", fr: "Entrepôt" } }
        - { id: eh, text: Eventhouse }
        - { id: sqldb, text: { en: "SQL database", fr: "Base de données SQL" } }
    - id: b
      options:
        - { id: lh, text: Lakehouse }
        - { id: wh, text: { en: "Warehouse", fr: "Entrepôt" } }
        - { id: eh, text: Eventhouse }
        - { id: sqldb, text: { en: "SQL database", fr: "Base de données SQL" } }
    - id: c
      options:
        - { id: lh, text: Lakehouse }
        - { id: wh, text: { en: "Warehouse", fr: "Entrepôt" } }
        - { id: eh, text: Eventhouse }
        - { id: sqldb, text: { en: "SQL database", fr: "Base de données SQL" } }
answer:
  values: { a: eh, b: sqldb, c: lh }
explanation:
  correct:
    en: |
      Eventhouse data is available in OneLake in an open table format only as an opt-in (OneLake availability), while lakehouses, warehouses and SQL databases use it by default. SQL database in Fabric is based on Azure SQL Database and uses the same engine. A lakehouse stores unstructured, semi-structured and structured data, whereas a warehouse stores structured data only.
    fr: |
      Les données d'un eventhouse ne sont disponibles dans OneLake dans un format de table ouvert que sur activation (disponibilité OneLake), alors que les lakehouses, les entrepôts et les bases de données SQL l'utilisent par défaut. La base de données SQL dans Fabric est basée sur Azure SQL Database et utilise le même moteur. Un lakehouse stocke des données non structurées, semi-structurées et structurées, alors qu'un entrepôt ne stocke que des données structurées.
  options:
    wh: { en: "A warehouse stores structured data in Delta tables by default and is not based on the Azure SQL Database engine.", fr: "Un entrepôt stocke par défaut des données structurées dans des tables Delta et n'est pas basé sur le moteur d'Azure SQL Database." }
references:
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
  - title: "Microsoft Fabric decision guide: Choose between Warehouse and Lakehouse"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-lakehouse-warehouse
