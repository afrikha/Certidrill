id: dp600-2c-join-statements
objective: "2.2.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are combining queries in a Dataflow Gen2.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous combinez des requêtes dans un Dataflow Gen2.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To merge two queries, the matching columns must have the same column name in both queries.
        fr: Pour fusionner deux requêtes, les colonnes de correspondance doivent porter le même nom dans les deux requêtes.
    - id: s2
      text:
        en: When you append two queries, the columns are matched by name, and the rows of a query that lacks a column get null in that column.
        fr: Quand vous ajoutez deux requêtes l'une à l'autre, les colonnes sont associées par nom, et les lignes d'une requête à laquelle il manque une colonne reçoivent null dans cette colonne.
    - id: s3
      text:
        en: A merge adds a column that contains a nested table of the matching rows of the right query, which you then expand to select fields.
        fr: Une fusion ajoute une colonne qui contient une table imbriquée des lignes correspondantes de la requête de droite, que vous développez ensuite pour sélectionner des champs.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Merge requires matching columns of the same data type, but their names can differ. Append compares the column headers, aligns columns by name, and fills missing columns with null. A merge keeps the left table's columns and adds a column of nested tables that you expand or aggregate."
    fr: "La fusion exige des colonnes de correspondance du même type de données, mais leurs noms peuvent différer. L'ajout compare les en-têtes de colonnes, aligne les colonnes par nom et remplit les colonnes manquantes avec null. Une fusion conserve les colonnes de la table de gauche et ajoute une colonne de tables imbriquées que vous développez ou agrégez."
references:
  - title: Merge queries overview
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-overview
  - title: Append queries
    url: https://learn.microsoft.com/en-us/power-query/append-queries
