id: dp600-2b-sm-eligible-model
objective: "2.1.5"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Your organization has the semantic models shown in the following table. The tenant settings required for OneLake integration are enabled.

    You plan to turn on OneLake integration for one model and then refresh it, so that Spark notebooks can read its tables as Delta tables.

    Answer the prompt by selecting the appropriate semantic model.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre organisation dispose des modèles sémantiques présentés dans le tableau suivant. Les paramètres de locataire requis pour l'intégration OneLake sont activés.

    Vous prévoyez d'activer l'intégration OneLake pour un modèle puis de l'actualiser, pour que des notebooks Spark lisent ses tables sous forme de tables Delta.

    Répondez à la consigne en sélectionnant le modèle sémantique approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The semantic model whose tables will be written to OneLake", fr: "Le modèle sémantique dont les tables seront écrites dans OneLake" }
  grid:
    header: [{ en: "Semantic model", fr: "Modèle sémantique" }, { en: "Workspace license mode", fr: "Mode de licence de l'espace de travail" }, { en: "Workspace encryption", fr: "Chiffrement de l'espace de travail" }, { en: "Storage mode of the tables", fr: "Mode de stockage des tables" }]
    rows:
      - [{ text: SM-Payroll, area: payroll }, { text: Premium Per User }, { text: { en: "Microsoft-managed keys", fr: "Clés gérées par Microsoft" } }, { text: Import }]
      - [{ text: SM-Retail, area: retail }, { text: "Premium capacity (P1)" }, { text: { en: "Bring your own key (BYOK)", fr: "Clé personnelle (BYOK)" } }, { text: Import }]
      - [{ text: SM-Inventory, area: inventory }, { text: "Fabric capacity (F64)" }, { text: { en: "Microsoft-managed keys", fr: "Clés gérées par Microsoft" } }, { text: DirectQuery }]
      - [{ text: SM-Finance, area: finance }, { text: "Fabric capacity (F32)" }, { text: { en: "Microsoft-managed keys", fr: "Clés gérées par Microsoft" } }, { text: Import }]
answer:
  values: { p1: finance }
explanation:
  correct:
    en: |
      OneLake integration works for Import tables of models in workspaces on Power BI Premium P or Fabric F capacities. SM-Finance meets every condition. Premium Per User is not supported, models in BYOK-enabled workspaces are not supported, and DirectQuery tables are never exported.
    fr: |
      L'intégration OneLake fonctionne pour les tables Import des modèles situés dans des espaces de travail sur une capacité Power BI Premium P ou Fabric F. SM-Finance remplit toutes les conditions. Premium par utilisateur n'est pas pris en charge, les modèles des espaces de travail avec BYOK ne sont pas pris en charge, et les tables DirectQuery ne sont jamais exportées.
  options:
    payroll: { en: "Premium Per User workspaces don't support OneLake integration.", fr: "Les espaces de travail Premium par utilisateur ne prennent pas en charge l'intégration OneLake." }
    retail: { en: "Semantic models in BYOK-enabled workspaces are not supported, even on a P capacity.", fr: "Les modèles sémantiques des espaces de travail avec BYOK ne sont pas pris en charge, même sur une capacité P." }
    inventory: { en: "DirectQuery tables hold no imported data and are not exported.", fr: "Les tables DirectQuery ne contiennent pas de données importées et ne sont pas exportées." }
references:
  - title: Learn about Microsoft OneLake Delta table integration in Power BI and Microsoft Fabric
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/onelake-integration-overview
