id: dp600-2d-pq-conversion-errors
objective: "2.2.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Dataflow Gen2 named **Dataflow1** that reads a CSV file. The Amount column contains decimal numbers stored as text. The only non-numeric value in the column is `N/A`.

    After you change the type of Amount to **Decimal number**, the rows that contain `N/A` show error values. Rows whose Amount can't be converted must be excluded from the output of Dataflow1. All other rows must be kept.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un Dataflow Gen2 nommé **Dataflow1** qui lit un fichier CSV. La colonne Amount contient des nombres décimaux stockés sous forme de texte. La seule valeur non numérique de la colonne est `N/A`.

    Après avoir modifié le type de Amount en **Nombre décimal**, les lignes qui contiennent `N/A` affichent des valeurs d'erreur. Les lignes dont la valeur Amount ne peut pas être convertie doivent être exclues de la sortie de Dataflow1. Toutes les autres lignes doivent être conservées.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "After the type change, select the Amount column and use Remove errors.", fr: "Après la modification du type, sélectionner la colonne Amount et utiliser Supprimer les erreurs." } }
    - { id: b, text: { en: "After the type change, select the Amount column and use Replace errors with 0.", fr: "Après la modification du type, sélectionner la colonne Amount et utiliser Remplacer les erreurs par 0." } }
    - { id: c, text: { en: "Before the type change, filter the Amount column to keep the rows that don't equal N/A.", fr: "Avant la modification du type, filtrer la colonne Amount pour conserver les lignes différentes de N/A." } }
    - { id: d, text: { en: "Replace the type change with Change type > Using locale and select English (United States).", fr: "Remplacer la modification du type par Modifier le type > Utilisation des paramètres régionaux et sélectionner Anglais (États-Unis)." } }
    - { id: e, text: { en: "Replace the type change with Detect data type on the Amount column.", fr: "Remplacer la modification du type par Détecter le type de données sur la colonne Amount." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Remove errors deletes the rows that have an error value in the selected column, so only the N/A rows disappear. Filtering out N/A before the type change gives the same result, because N/A is the only value that can't be converted.
    fr: |
      Supprimer les erreurs supprime les lignes qui ont une valeur d'erreur dans la colonne sélectionnée : seules les lignes N/A disparaissent. Exclure N/A par un filtre avant la modification du type donne le même résultat, car N/A est la seule valeur qui ne peut pas être convertie.
  options:
    b: { en: "Replace errors keeps the rows with an amount of 0, but the rows must be excluded.", fr: "Remplacer les erreurs conserve les lignes avec un montant de 0, alors qu'elles doivent être exclues." }
    d: { en: "No locale can convert N/A to a number, so the errors remain.", fr: "Aucun paramètre régional ne peut convertir N/A en nombre : les erreurs subsistent." }
    e: { en: "Detect data type only chooses a type from the values; it doesn't remove the rows that contain N/A.", fr: "Détecter le type de données se contente de choisir un type d'après les valeurs ; il ne supprime pas les lignes qui contiennent N/A." }
references:
  - title: Data types in Power Query
    url: https://learn.microsoft.com/en-us/power-query/data-types
  - title: Filter by values in a column
    url: https://learn.microsoft.com/en-us/power-query/filter-values
