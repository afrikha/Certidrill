id: dp600-2d-implicit-conversion
objective: "2.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a table named **dbo.Orders**. The OrderNumber column uses the `varchar(20)` data type. Most order numbers contain only digits, but returned orders use numbers such as `R-1002`.

    You run the following query.

    ```sql
    SELECT OrderNumber, CustomerKey, Amount
    FROM dbo.Orders
    WHERE OrderNumber = 1001;
    ```

    The query fails with a conversion error. You need the query to return the order whose number is 1001.

    How should you rewrite the WHERE clause?
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table nommée **dbo.Orders**. La colonne OrderNumber utilise le type de données `varchar(20)`. La plupart des numéros de commande ne contiennent que des chiffres, mais les commandes retournées utilisent des numéros comme `R-1002`.

    Vous exécutez la requête suivante.

    ```sql
    SELECT OrderNumber, CustomerKey, Amount
    FROM dbo.Orders
    WHERE OrderNumber = 1001;
    ```

    La requête échoue avec une erreur de conversion. Vous devez faire en sorte que la requête renvoie la commande dont le numéro est 1001.

    Comment devez-vous réécrire la clause WHERE ?
body:
  options:
    - { id: a, text: "WHERE CAST(OrderNumber AS int) = 1001" }
    - { id: b, text: "WHERE CONVERT(int, OrderNumber) = 1001" }
    - { id: c, text: "WHERE OrderNumber = CAST('1001' AS int)" }
    - { id: d, text: "WHERE OrderNumber = '1001'" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When a `varchar` column is compared with an `int`, data type precedence converts the column to `int`, and a value such as `R-1002` makes the query fail. Comparing the column with the string literal `'1001'` keeps both sides as strings, so no conversion is needed.
    fr: |
      Quand une colonne `varchar` est comparée à un `int`, la priorité des types de données convertit la colonne en `int`, et une valeur comme `R-1002` fait échouer la requête. Comparer la colonne au littéral de chaîne `'1001'` laisse les deux côtés sous forme de chaînes : aucune conversion n'est nécessaire.
  options:
    a: { en: "CAST converts every OrderNumber value to int and fails on R-1002.", fr: "CAST convertit chaque valeur de OrderNumber en int et échoue sur R-1002." }
    b: { en: "CONVERT to int fails on R-1002 for the same reason as CAST.", fr: "CONVERT en int échoue sur R-1002 pour la même raison que CAST." }
    c: { en: "The right side is still an int, so the column is still implicitly converted to int.", fr: "Le côté droit reste un int : la colonne est toujours convertie implicitement en int." }
references:
  - title: CAST and CONVERT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/cast-and-convert-transact-sql
