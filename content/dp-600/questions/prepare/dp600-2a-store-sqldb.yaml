id: dp600-2a-store-sqldb
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Developers at Wingtip build a .NET order-entry application that thousands of users access concurrently. The application performs single-row inserts and updates, requires full ACID transactions and enforced foreign keys, and must benefit from automatic index tuning.

    A reporting team must query the same data for analytics without affecting the performance of the application.

    Which Fabric data store should you recommend?
  fr: |
    Les développeurs de Wingtip créent une application .NET de saisie de commandes à laquelle des milliers d'utilisateurs accèdent simultanément. L'application effectue des insertions et des mises à jour de lignes individuelles, exige des transactions ACID complètes et des clés étrangères appliquées, et doit bénéficier du réglage automatique des index.

    Une équipe de reporting doit interroger les mêmes données pour l'analytique sans affecter les performances de l'application.

    Quel magasin de données Fabric devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A warehouse", fr: "Un entrepôt" } }
    - { id: b, text: { en: "A lakehouse", fr: "Un lakehouse" } }
    - { id: c, text: { en: "An eventhouse", fr: "Un eventhouse" } }
    - { id: d, text: { en: "A SQL database", fr: "Une base de données SQL" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      SQL database in Fabric is the transactional (OLTP) store, based on the same engine as Azure SQL Database, with high concurrency, full ACID transactions, foreign keys and automatic tuning that creates indexes. Its data is replicated automatically to OneLake, and the reporting team queries it through the SQL analytics endpoint without loading the operational database.
    fr: |
      La base de données SQL dans Fabric est le magasin transactionnel (OLTP), basé sur le même moteur qu'Azure SQL Database, avec une forte concurrence, des transactions ACID complètes, des clés étrangères et un réglage automatique qui crée des index. Ses données sont répliquées automatiquement dans OneLake, et l'équipe de reporting les interroge via le point de terminaison d'analytique SQL sans charger la base opérationnelle.
  options:
    a:
      en: A warehouse is an analytical store optimized for large scans and batch loads, not for thousands of concurrent single-row transactions.
      fr: Un entrepôt est un magasin analytique optimisé pour les grandes lectures et les chargements par lots, pas pour des milliers de transactions simultanées sur des lignes individuelles.
    b:
      en: A lakehouse is written with Spark and has no T-SQL write path or enforced foreign keys for an application.
      fr: Un lakehouse s'alimente avec Spark et n'offre ni écriture T-SQL ni clés étrangères appliquées pour une application.
    c:
      en: An eventhouse is append-optimized for event data, not for transactional updates.
      fr: Un eventhouse est optimisé pour l'ajout de données d'événements, pas pour des mises à jour transactionnelles.
references:
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
