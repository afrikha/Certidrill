id: dp600-2a-event-categories
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You plan several Activator alerts that start from Real-Time hub. Your Fabric workspace named Workspace1 contains a lakehouse named LH-Landing, a warehouse and several notebooks. Your Azure subscription contains a storage account named stinbound.

    Which category of events should you use for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez plusieurs alertes Activator créées depuis le hub Real-Time. Votre espace de travail Fabric nommé Workspace1 contient un lakehouse nommé LH-Landing, un entrepôt et plusieurs notebooks. Votre abonnement Azure contient un compte de stockage nommé stinbound.

    Quelle catégorie d'événements devez-vous utiliser pour chaque besoin ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Notify a team when a folder is deleted in the Files section of LH-Landing: [[r1]]
      Notify the operations team when a scheduled notebook run fails: [[r2]]
      Notify the security team when the warehouse is deleted from Workspace1: [[r3]]
      Start a process when a blob is created in stinbound: [[r4]]
    fr: |
      Prévenir une équipe quand un dossier est supprimé dans la section Files de LH-Landing : [[r1]]
      Prévenir l'équipe d'exploitation quand l'exécution planifiée d'un notebook échoue : [[r2]]
      Prévenir l'équipe de sécurité quand l'entrepôt est supprimé de Workspace1 : [[r3]]
      Démarrer un processus quand un blob est créé dans stinbound : [[r4]]
  slots:
    - id: r1
      options:
        - { id: onelake, text: { en: "OneLake events", fr: "Événements OneLake" } }
        - { id: job, text: { en: "Job events", fr: "Événements de travaux" } }
        - { id: item, text: { en: "Workspace item events", fr: "Événements d'éléments d'espace de travail" } }
        - { id: blob, text: { en: "Azure Blob Storage events", fr: "Événements Stockage Blob Azure" } }
    - id: r2
      options:
        - { id: onelake, text: { en: "OneLake events", fr: "Événements OneLake" } }
        - { id: job, text: { en: "Job events", fr: "Événements de travaux" } }
        - { id: item, text: { en: "Workspace item events", fr: "Événements d'éléments d'espace de travail" } }
        - { id: blob, text: { en: "Azure Blob Storage events", fr: "Événements Stockage Blob Azure" } }
    - id: r3
      options:
        - { id: onelake, text: { en: "OneLake events", fr: "Événements OneLake" } }
        - { id: job, text: { en: "Job events", fr: "Événements de travaux" } }
        - { id: item, text: { en: "Workspace item events", fr: "Événements d'éléments d'espace de travail" } }
        - { id: blob, text: { en: "Azure Blob Storage events", fr: "Événements Stockage Blob Azure" } }
    - id: r4
      options:
        - { id: onelake, text: { en: "OneLake events", fr: "Événements OneLake" } }
        - { id: job, text: { en: "Job events", fr: "Événements de travaux" } }
        - { id: item, text: { en: "Workspace item events", fr: "Événements d'éléments d'espace de travail" } }
        - { id: blob, text: { en: "Azure Blob Storage events", fr: "Événements Stockage Blob Azure" } }
answer:
  values: { r1: onelake, r2: job, r3: item, r4: blob }
explanation:
  correct:
    en: |
      OneLake events report changes to files and folders in OneLake, such as FolderDeleted. Job events are raised by jobs run by Fabric items, such as a notebook run or a pipeline run. Workspace item events report the creation, update or deletion of items such as warehouses. Azure Blob Storage events report operations on the blobs of an Azure storage account, such as BlobCreated.
    fr: |
      Les événements OneLake signalent les modifications de fichiers et de dossiers dans OneLake, comme FolderDeleted. Les événements de travaux sont déclenchés par les travaux exécutés par des éléments Fabric, comme l'exécution d'un notebook ou d'un pipeline. Les événements d'éléments d'espace de travail signalent la création, la mise à jour ou la suppression d'éléments comme les entrepôts. Les événements Stockage Blob Azure signalent les opérations sur les blobs d'un compte de stockage Azure, comme BlobCreated.
references:
  - title: Introduction to Azure and Fabric events
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/fabric-events-overview
  - title: Explore OneLake events in Fabric Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/explore-fabric-onelake-events
