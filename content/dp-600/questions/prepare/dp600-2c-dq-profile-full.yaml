id: dp600-2c-dq-profile-full
objective: "2.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Dataflow Gen2 that contains a query named **Customers** with about two million rows. You enable **Column quality** in the Power Query editor. The Phone column shows 0% Empty, but the lakehouse table loaded by the dataflow contains many rows with a missing phone number.

    You need the Column quality percentages to reflect all the rows of the query.

    What should you do?
  fr: |
    Vous disposez d'un Dataflow Gen2 qui contient une requête nommée **Customers** d'environ deux millions de lignes. Vous activez **Qualité de la colonne** dans l'éditeur Power Query. La colonne Phone affiche 0 % Vide, mais la table du lakehouse chargée par le dataflow contient de nombreuses lignes sans numéro de téléphone.

    Les pourcentages de Qualité de la colonne doivent refléter toutes les lignes de la requête.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Enable Column distribution in addition to Column quality.", fr: "Activer Distribution des colonnes en plus de Qualité de la colonne." }
    - id: b
      text: { en: "Change the status bar setting from top 1,000 rows to the entire data set.", fr: "Faire passer le paramètre de la barre d'état des 1 000 premières lignes au jeu de données entier." }
    - id: c
      text: { en: "Enable Column profile and select the Phone column.", fr: "Activer Profil de colonne et sélectionner la colonne Phone." }
    - id: d
      text: { en: "Add a Keep errors step on the Phone column.", fr: "Ajouter une étape Conserver les erreurs sur la colonne Phone." }
answer: { optionId: b }
explanation:
  correct:
    en: "By default, the data profiling tools use the first 1,000 rows. Selecting the message in the status bar and switching to column profiling based on the entire data set makes Column quality count all two million rows."
    fr: "Par défaut, les outils de profilage des données utilisent les 1 000 premières lignes. Sélectionner le message de la barre d'état et passer au profilage des colonnes basé sur le jeu de données entier fait porter Qualité de la colonne sur les deux millions de lignes."
  options:
    a: { en: "Column distribution shows distinct and unique counts, still computed on the same 1,000-row sample.", fr: "Distribution des colonnes affiche les nombres de valeurs distinctes et uniques, toujours calculés sur le même échantillon de 1 000 lignes." }
    c: { en: "Column profile gives more statistics, but it uses the same sample until you change the profiling scope.", fr: "Profil de colonne donne plus de statistiques, mais il utilise le même échantillon tant que vous ne changez pas l'étendue du profilage." }
    d: { en: "Keep errors keeps the rows with errors; missing values aren't errors.", fr: "Conserver les erreurs conserve les lignes en erreur ; des valeurs manquantes ne sont pas des erreurs." }
references:
  - title: Using the data profiling tools
    url: https://learn.microsoft.com/en-us/power-query/data-profiling-tools
