id: dp600-2d-vqe-cross-items
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have two Fabric workspaces named **Workspace1** and **Workspace2**. Workspace1 contains the following items:

    - Two warehouses named **Warehouse1** and **Warehouse2**
    - A lakehouse named **Lakehouse1**
    - An eventhouse named **Eventhouse1**
    - A semantic model named **Model1**

    Workspace2 contains a warehouse named **Warehouse3**.

    You open a visual query in Warehouse1. You need to merge a table of Warehouse1 with a table from another item in the same visual query.

    Which two items can provide the other table? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de deux espaces de travail Fabric nommés **Workspace1** et **Workspace2**. Workspace1 contient les éléments suivants :

    - Deux entrepôts nommés **Warehouse1** et **Warehouse2**
    - Un lakehouse nommé **Lakehouse1**
    - Un eventhouse nommé **Eventhouse1**
    - Un modèle sémantique nommé **Model1**

    Workspace2 contient un entrepôt nommé **Warehouse3**.

    Vous ouvrez une requête visuelle dans Warehouse1. Vous devez fusionner, dans la même requête visuelle, une table de Warehouse1 avec une table d'un autre élément.

    Quels sont les deux éléments qui peuvent fournir l'autre table ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Warehouse2 }
    - { id: b, text: { en: "The SQL analytics endpoint of Lakehouse1", fr: "Le point de terminaison d'analytique SQL de Lakehouse1" } }
    - { id: c, text: { en: "The KQL database of Eventhouse1", fr: "La base de données KQL d'Eventhouse1" } }
    - { id: d, text: Model1 }
    - { id: e, text: Warehouse3 }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Cross-database queries, including visual queries, work across the warehouses and SQL analytics endpoints of the current workspace. After you add Warehouse2 or the SQL analytics endpoint of Lakehouse1 to Explorer, you can drag its tables to the canvas and merge them with the tables of Warehouse1.
    fr: |
      Les requêtes entre bases, y compris les requêtes visuelles, fonctionnent entre les entrepôts et les points de terminaison d'analytique SQL de l'espace de travail actif. Après avoir ajouté Warehouse2 ou le point de terminaison d'analytique SQL de Lakehouse1 à l'Explorateur, vous pouvez faire glisser leurs tables sur le canevas et les fusionner avec celles de Warehouse1.
  options:
    c: { en: "A KQL database isn't a warehouse or a SQL analytics endpoint, so it can't be added to a visual query.", fr: "Une base de données KQL n'est ni un entrepôt ni un point de terminaison d'analytique SQL : elle ne peut pas être ajoutée à une requête visuelle." }
    d: { en: "A semantic model is queried with DAX, not through the visual query editor of a warehouse.", fr: "Un modèle sémantique s'interroge avec DAX, pas avec l'éditeur de requête visuel d'un entrepôt." }
    e: { en: "Warehouse3 is in another workspace, and cross-database queries are limited to the current workspace.", fr: "Warehouse3 se trouve dans un autre espace de travail, et les requêtes entre bases sont limitées à l'espace de travail actif." }
references:
  - title: Query the warehouse or SQL analytics endpoint
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/query-warehouse
  - title: Query using the visual query editor
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/visual-query-editor
