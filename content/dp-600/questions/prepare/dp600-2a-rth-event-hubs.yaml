id: dp600-2a-rth-event-hubs
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Production machines at Adatum send telemetry to an Azure Event Hubs namespace named evhn-plant in your Azure subscription. You have a Fabric workspace that contains an eventhouse.

    You need to bring the events into Fabric and route them to a KQL database by using a no-code experience that starts from a list of the streaming resources available in your Azure subscriptions.

    What should you use?
  fr: |
    Les machines de production d'Adatum envoient leur télémétrie à un espace de noms Azure Event Hubs nommé evhn-plant dans votre abonnement Azure. Vous disposez d'un espace de travail Fabric qui contient un eventhouse.

    Vous devez amener les événements dans Fabric et les acheminer vers une base de données KQL en utilisant une expérience sans code qui part d'une liste des ressources de streaming disponibles dans vos abonnements Azure.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A mirrored database that replicates evhn-plant", fr: "Une base de données en miroir qui réplique evhn-plant" } }
    - { id: b, text: { en: "The Microsoft sources page of Real-Time hub, to connect evhn-plant to a new eventstream", fr: "La page Microsoft sources du hub Real-Time, pour connecter evhn-plant à un nouveau flux d'événements" } }
    - { id: c, text: { en: "The Explore tab of the OneLake catalog, to open evhn-plant", fr: "L'onglet Explore du catalogue OneLake, pour ouvrir evhn-plant" } }
    - { id: d, text: { en: "A OneLake shortcut in the KQL database that points to evhn-plant", fr: "Un raccourci OneLake dans la base de données KQL qui pointe vers evhn-plant" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Microsoft sources page of Real-Time hub lists streaming resources from Microsoft services, such as Azure Event Hubs and Azure IoT Hub, that you can access. Connecting evhn-plant creates an eventstream, to which you add a KQL database destination, without writing code.
    fr: |
      La page Microsoft sources du hub Real-Time liste les ressources de streaming des services Microsoft auxquelles vous avez accès, comme Azure Event Hubs et Azure IoT Hub. Connecter evhn-plant crée un flux d'événements, auquel vous ajoutez une destination base de données KQL, sans écrire de code.
  options:
    a:
      en: Mirroring replicates databases such as Azure SQL Database or Snowflake, not event streams.
      fr: La mise en miroir réplique des bases de données comme Azure SQL Database ou Snowflake, pas des flux d'événements.
    c:
      en: The OneLake catalog lists Fabric items, not the Azure streaming resources of your subscriptions.
      fr: Le catalogue OneLake liste des éléments Fabric, pas les ressources de streaming Azure de vos abonnements.
    d:
      en: Shortcuts point to storage locations and Fabric items; an Event Hubs namespace is not a shortcut target.
      fr: Les raccourcis pointent vers des emplacements de stockage et des éléments Fabric ; un espace de noms Event Hubs n'est pas une cible de raccourci.
references:
  - title: Introduction to Fabric Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/real-time-hub-overview
