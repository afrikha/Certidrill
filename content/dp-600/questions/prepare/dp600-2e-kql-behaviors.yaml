id: dp600-2e-kql-behaviors
objective: "2.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a KQL database named **TelemetryDB** in a Fabric eventhouse. TelemetryDB contains a table named **Orders** that has a numeric **Revenue** column and a table named **Telemetry**. The **Status** column of Telemetry contains values such as `ok`, `warn` and `fail`.

    You run queries in a KQL queryset connected to TelemetryDB, and no data is ingested while you run them.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données KQL nommée **TelemetryDB** dans un eventhouse Fabric. TelemetryDB contient une table nommée **Orders** qui possède une colonne numérique **Revenue** et une table nommée **Telemetry**. La colonne **Status** de Telemetry contient des valeurs comme `ok`, `warn` et `fail`.

    Vous exécutez des requêtes dans un ensemble de requêtes KQL connecté à TelemetryDB, et aucune donnée n'est ingérée pendant leur exécution.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "`Orders | sort by Revenue` returns the order with the highest revenue in the first row."
        fr: "`Orders | sort by Revenue` renvoie la commande au chiffre d'affaires le plus élevé dans la première ligne."
    - id: s2
      text:
        en: "Running `Telemetry | take 5` twice returns the same five rows both times."
        fr: "Exécuter deux fois `Telemetry | take 5` renvoie les mêmes cinq lignes les deux fois."
    - id: s3
      text:
        en: "For the filter `Telemetry | where Status has \"ok\"`, Kusto finds the matching rows by using its term index."
        fr: "Pour le filtre `Telemetry | where Status has \"ok\"`, Kusto trouve les lignes correspondantes à l'aide de son index de termes."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "`sort` defaults to descending order (high to low), unlike SQL, so the highest revenue comes first. `take` gives no guarantee about which rows it returns, and the result can differ between executions even when the data hasn't changed. Kusto indexes only terms of three characters or more, so a `has` search for a two-character term such as `ok` scans the column values."
    fr: "`sort` trie par défaut en ordre décroissant (du plus grand au plus petit), contrairement à SQL : le chiffre d'affaires le plus élevé arrive en premier. `take` ne garantit pas les lignes renvoyées, et le résultat peut changer d'une exécution à l'autre même si les données n'ont pas changé. Kusto n'indexe que les termes de trois caractères ou plus : une recherche `has` sur un terme de deux caractères comme `ok` parcourt les valeurs de la colonne."
references:
  - title: sort operator
    url: https://learn.microsoft.com/en-us/kusto/query/sort-operator
  - title: String operators
    url: https://learn.microsoft.com/en-us/kusto/query/datatypes-string-operators
