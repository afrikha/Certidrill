id: dp600-2b-proc-function-rules
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are writing T-SQL objects in a Fabric warehouse named Warehouse1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez des objets T-SQL dans un entrepôt Fabric nommé Warehouse1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A stored procedure can run a DELETE on one table and an INSERT on another inside an explicit transaction, so that both changes are committed or neither is.
        fr: |
          Une procédure stockée peut exécuter un DELETE sur une table et un INSERT sur une autre dans une transaction explicite, pour que les deux modifications soient validées ou aucune.
    - id: s2
      text:
        en: |
          An inline table-valued function can contain an INSERT statement that logs each call before the function returns its rows.
        fr: |
          Une fonction table inline peut contenir une instruction INSERT qui journalise chaque appel avant que la fonction ne renvoie ses lignes.
    - id: s3
      text:
        en: |
          A parameter of an inline table-valued function can supply the name of the table that the function queries.
        fr: |
          Un paramètre d'une fonction table inline peut fournir le nom de la table que la fonction interroge.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Fabric Data Warehouse supports explicit transactions (BEGIN TRAN, COMMIT, ROLLBACK) that group changes to several tables, with snapshot isolation. An inline table-valued function contains a single SELECT statement, so it can't run DML. Function parameters can replace only constants, not table, column or other object names.
    fr: |
      Fabric Data Warehouse prend en charge les transactions explicites (BEGIN TRAN, COMMIT, ROLLBACK) qui regroupent des modifications de plusieurs tables, avec l'isolement d'instantané. Une fonction table inline contient une seule instruction SELECT : elle ne peut pas exécuter de DML. Les paramètres d'une fonction ne peuvent remplacer que des constantes, pas des noms de tables, de colonnes ou d'autres objets.
references:
  - title: Transactions in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/transactions
  - title: CREATE FUNCTION (Microsoft Fabric, Azure Synapse Analytics)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-function-sql-data-warehouse
