id: dp600-2c-denorm-merge-sequence
objective: "2.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Dataflow Gen2 that contains three queries:

    - **Product**: ProductID, ProductName, SubcategoryID
    - **Subcategory**: SubcategoryID, SubcategoryName, CategoryID
    - **Category**: CategoryID, CategoryName

    You need the Product query to return every product with its subcategory name and category name.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un Dataflow Gen2 qui contient trois requêtes :

    - **Product** : ProductID, ProductName, SubcategoryID
    - **Subcategory** : SubcategoryID, SubcategoryName, CategoryID
    - **Category** : CategoryID, CategoryName

    La requête Product doit renvoyer tous les produits avec leur nom de sous-catégorie et leur nom de catégorie.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: m1, text: { en: "Merge Product with Subcategory on SubcategoryID by using a left outer join.", fr: "Fusionner Product avec Subcategory sur SubcategoryID avec une jointure externe gauche." } }
    - { id: e1, text: { en: "Expand the new Subcategory column and select SubcategoryName and CategoryID.", fr: "Développer la nouvelle colonne Subcategory et sélectionner SubcategoryName et CategoryID." } }
    - { id: m2, text: { en: "Merge the result with Category on CategoryID by using a left outer join.", fr: "Fusionner le résultat avec Category sur CategoryID avec une jointure externe gauche." } }
    - { id: e2, text: { en: "Expand the new Category column and select CategoryName.", fr: "Développer la nouvelle colonne Category et sélectionner CategoryName." } }
    - { id: x1, text: { en: "Merge Product with Category on CategoryID by using a left outer join.", fr: "Fusionner Product avec Category sur CategoryID avec une jointure externe gauche." } }
    - { id: x2, text: { en: "Append the Subcategory query to the Product query.", fr: "Ajouter la requête Subcategory à la requête Product." } }
answer:
  sequence: [ m1, e1, m2, e2 ]
explanation:
  correct:
    en: "A merge adds a column of nested tables that you must expand to get the fields. Product has no CategoryID, so you first merge with Subcategory and expand CategoryID, then merge that result with Category and expand CategoryName. Left outer joins keep the products that have no match."
    fr: "Une fusion ajoute une colonne de tables imbriquées qu'il faut développer pour obtenir les champs. Product n'a pas de CategoryID : vous fusionnez d'abord avec Subcategory et développez CategoryID, puis vous fusionnez ce résultat avec Category et développez CategoryName. Les jointures externes gauches conservent les produits sans correspondance."
  options:
    x1: { en: "Product has no CategoryID column, so it can't be merged with Category directly.", fr: "Product n'a pas de colonne CategoryID : il ne peut pas être fusionné directement avec Category." }
    x2: { en: "Append stacks rows; it doesn't add the subcategory columns to the product rows.", fr: "L'ajout empile des lignes ; il n'ajoute pas les colonnes de la sous-catégorie aux lignes de produits." }
references:
  - title: Merge queries overview
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-overview
