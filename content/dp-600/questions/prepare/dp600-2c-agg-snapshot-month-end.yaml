id: dp600-2c-agg-snapshot-month-end
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named **WH1** that contains a periodic snapshot fact table named **FactInventory**. The table stores one row per product per day, with the **StockOnHand** quantity at the end of the day.

    You need to create an aggregate table that has one row per product per month. The table must show the stock of each product at the end of the month.

    Which value should you store for each product and month?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé **WH1** qui contient une table de faits d'instantanés périodiques nommée **FactInventory**. La table stocke une ligne par produit et par jour, avec la quantité **StockOnHand** en fin de journée.

    Vous devez créer une table d'agrégats qui contient une ligne par produit et par mois. La table doit indiquer le stock de chaque produit à la fin du mois.

    Quelle valeur devez-vous stocker pour chaque produit et chaque mois ?
body:
  options:
    - id: a
      text: { en: "The sum of StockOnHand over the days of the month", fr: "La somme de StockOnHand sur les jours du mois" }
    - id: b
      text: { en: "The maximum of StockOnHand over the days of the month", fr: "Le maximum de StockOnHand sur les jours du mois" }
    - id: c
      text: { en: "The StockOnHand value of the last day of the month", fr: "La valeur StockOnHand du dernier jour du mois" }
    - id: d
      text: { en: "The number of days of the month that have a StockOnHand value", fr: "Le nombre de jours du mois qui ont une valeur StockOnHand" }
answer: { optionId: c }
explanation:
  correct:
    en: "Measures of a periodic snapshot are semi-additive: a stock balance can be summed across products but not across time periods. The month-end stock is the balance recorded on the last day of the month."
    fr: "Les mesures d'un instantané périodique sont semi-additives : un solde de stock peut être additionné entre produits, mais pas entre périodes. Le stock de fin de mois est le solde enregistré le dernier jour du mois."
  options:
    a: { en: "Summing daily balances over time counts the same units again every day.", fr: "Additionner les soldes quotidiens dans le temps compte les mêmes unités chaque jour." }
    b: { en: "The maximum is the peak stock of the month, not the stock at the end of the month.", fr: "Le maximum est le pic de stock du mois, pas le stock à la fin du mois." }
    d: { en: "A count of days doesn't describe a stock quantity.", fr: "Un nombre de jours ne décrit pas une quantité en stock." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Fact tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-fact-tables
