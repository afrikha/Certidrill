id: dp600-2d-pyspark-filter-chain
objective: "2.2.9"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a lakehouse named **Lakehouse1** that contains a Delta table named **silver_sales**. The OrderDate column uses the DATE data type.

    In a notebook, you need to create a DataFrame that contains only the sales that meet the following requirements:

    - The Channel column is Web or Store.
    - The CustomerID column has a value.
    - The order was placed on or after January 1, 2026.

    How should you complete the PySpark code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse nommé **Lakehouse1** qui contient une table Delta nommée **silver_sales**. La colonne OrderDate utilise le type de données DATE.

    Dans un notebook, vous devez créer un DataFrame qui ne contient que les ventes qui satisfont aux exigences suivantes :

    - La colonne Channel vaut Web ou Store.
    - La colonne CustomerID a une valeur.
    - La commande a été passée le 1er janvier 2026 ou après.

    Comment devez-vous compléter le code PySpark ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from pyspark.sql import functions as F

    sales = (spark.read.table("silver_sales")
        .filter(F.col("Channel").[[a]]("Web", "Store"))
        .filter(F.col("CustomerID").[[b]]())
        .filter(F.col("OrderDate") [[c]] "2026-01-01"))
  slots:
    - id: a
      options:
        - { id: isin, text: isin }
        - { id: contains, text: contains }
        - { id: like, text: like }
    - id: b
      options:
        - { id: notnull, text: isNotNull }
        - { id: isnull, text: isNull }
        - { id: isnan, text: isnan }
    - id: c
      options:
        - { id: ge, text: ">=" }
        - { id: eq, text: "==" }
        - { id: le, text: "<=" }
answer:
  values: { a: isin, b: notnull, c: ge }
explanation:
  correct:
    en: "`isin` keeps the rows whose value is in the list, `isNotNull` keeps the rows where CustomerID has a value, and `>=` keeps the orders placed on January 1, 2026 or later. Chaining several `filter` calls combines the conditions with AND."
    fr: "`isin` conserve les lignes dont la valeur figure dans la liste, `isNotNull` conserve les lignes où CustomerID a une valeur, et `>=` conserve les commandes passées le 1er janvier 2026 ou après. Enchaîner plusieurs appels à `filter` combine les conditions avec ET."
  options:
    contains: { en: "contains tests whether a string contains one substring; it doesn't test membership in a list of values.", fr: "contains vérifie si une chaîne contient une sous-chaîne ; il ne teste pas l'appartenance à une liste de valeurs." }
    like: { en: "like takes a single SQL pattern, not a list of values.", fr: "like prend un seul modèle SQL, pas une liste de valeurs." }
    isnull: { en: "isNull keeps the rows without a CustomerID, the opposite of the requirement.", fr: "isNull conserve les lignes sans CustomerID, l'inverse de l'exigence." }
    isnan: { en: "isnan tests for the floating-point NaN value, not for missing values.", fr: "isnan teste la valeur à virgule flottante NaN, pas les valeurs manquantes." }
    eq: { en: "== keeps only the orders of January 1, 2026.", fr: "== ne conserve que les commandes du 1er janvier 2026." }
    le: { en: "<= keeps the orders placed on or before January 1, 2026.", fr: "<= conserve les commandes passées le 1er janvier 2026 ou avant." }
references:
  - title: "Tutorial: Load and transform data using Apache Spark DataFrames"
    url: https://learn.microsoft.com/en-us/azure/databricks/getting-started/dataframes
