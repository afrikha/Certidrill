id: dp600-2e-kql-case-insensitive
objective: "2.3.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a KQL database named **SupportDB** in a Fabric eventhouse. SupportDB contains a table named **Tickets**. The **Customer** column of Tickets is a string column that contains values such as `Contoso`, `CONTOSO`, `contoso`, `Contoso Pharma` and `Fabrikam`.

    You need to filter Tickets to the rows whose Customer value is `contoso` in any combination of uppercase and lowercase letters. Rows for `Contoso Pharma` must be excluded.

    Which two filters can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données KQL nommée **SupportDB** dans un eventhouse Fabric. SupportDB contient une table nommée **Tickets**. La colonne **Customer** de Tickets est une colonne de chaînes qui contient des valeurs comme `Contoso`, `CONTOSO`, `contoso`, `Contoso Pharma` et `Fabrikam`.

    Vous devez filtrer Tickets sur les lignes dont la valeur de Customer est `contoso`, quelle que soit la combinaison de majuscules et de minuscules. Les lignes de `Contoso Pharma` doivent être exclues.

    Quels sont les deux filtres que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "| where Customer == \"contoso\"" }
    - { id: b, text: "| where Customer =~ \"contoso\"" }
    - { id: c, text: "| where Customer has \"contoso\"" }
    - { id: d, text: "| where Customer in (\"contoso\")" }
    - { id: e, text: "| where Customer in~ (\"contoso\")" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "`=~` tests equality without case sensitivity, and `in~` tests equality with any element of a list without case sensitivity. Both compare the whole value, so `Contoso`, `CONTOSO` and `contoso` match while `Contoso Pharma` does not."
    fr: "`=~` teste l'égalité sans respecter la casse, et `in~` teste l'égalité avec l'un des éléments d'une liste sans respecter la casse. Les deux comparent la valeur entière : `Contoso`, `CONTOSO` et `contoso` correspondent, mais pas `Contoso Pharma`."
  options:
    a:
      en: "`==` is case-sensitive, so it returns only the rows whose value is exactly `contoso`."
      fr: "`==` respecte la casse : il ne renvoie que les lignes dont la valeur est exactement `contoso`."
    c:
      en: "`has` matches a whole term inside the value, so it also returns `Contoso Pharma`."
      fr: "`has` recherche un terme entier dans la valeur : il renvoie aussi `Contoso Pharma`."
    d:
      en: "`in` is case-sensitive, so `Contoso` and `CONTOSO` are not returned."
      fr: "`in` respecte la casse : `Contoso` et `CONTOSO` ne sont pas renvoyés."
references:
  - title: String operators
    url: https://learn.microsoft.com/en-us/kusto/query/datatypes-string-operators
