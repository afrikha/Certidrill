id: dp600-2e-kql-tsql-explain
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a KQL queryset named **QS1** connected to a KQL database named **SalesRT**. SalesRT contains a table named **Orders**.

    An analyst named User1 knows T-SQL but is learning KQL. User1 has written the following statement.

    ```sql
    SELECT TOP (10) StoreId, SUM(Amount) AS Revenue
    FROM Orders
    GROUP BY StoreId
    ORDER BY Revenue DESC
    ```

    User1 needs to see, in QS1, the KQL query that is equivalent to this statement.

    What should User1 do in QS1?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un ensemble de requêtes KQL nommé **QS1**, connecté à une base de données KQL nommée **SalesRT**. SalesRT contient une table nommée **Orders**.

    Un analyste nommé User1 connaît T-SQL mais apprend KQL. User1 a écrit l'instruction suivante.

    ```sql
    SELECT TOP (10) StoreId, SUM(Amount) AS Revenue
    FROM Orders
    GROUP BY StoreId
    ORDER BY Revenue DESC
    ```

    User1 doit voir, dans QS1, la requête KQL équivalente à cette instruction.

    Que doit faire User1 dans QS1 ?
body:
  options:
    - id: a
      text: { en: "Start the query with a line that contains only `--`, then add the statement.", fr: "Commencer la requête par une ligne qui contient uniquement `--`, puis ajouter l'instruction." }
    - id: b
      text: { en: "Start the query with a line that contains only `--`, then add `explain` and the statement.", fr: "Commencer la requête par une ligne qui contient uniquement `--`, puis ajouter `explain` et l'instruction." }
    - id: c
      text: { en: "Start the query with a line that contains only `//`, then add `explain` and the statement.", fr: "Commencer la requête par une ligne qui contient uniquement `//`, puis ajouter `explain` et l'instruction." }
    - id: d
      text: { en: "Start the query with a line that contains only `//`, then add the statement.", fr: "Commencer la requête par une ligne qui contient uniquement `//`, puis ajouter l'instruction." }
answer: { optionId: b }
explanation:
  correct:
    en: "An empty `--` comment line tells the query editor to interpret the query as T-SQL instead of KQL. Adding the `explain` keyword before a `SELECT` statement returns the equivalent KQL query instead of running the statement."
    fr: "Une ligne de commentaire `--` vide indique à l'éditeur de requête d'interpréter la requête comme du T-SQL et non du KQL. Le mot clé `explain` placé avant une instruction `SELECT` renvoie la requête KQL équivalente au lieu d'exécuter l'instruction."
  options:
    a:
      en: "The `--` line runs the statement as T-SQL and returns its results, but without `explain` it doesn't show the KQL translation."
      fr: "La ligne `--` exécute l'instruction en T-SQL et renvoie ses résultats, mais sans `explain` elle n'affiche pas la traduction KQL."
    c:
      en: "`//` is a KQL comment, so the editor treats the rest as KQL, and `explain` followed by a SELECT statement is not valid KQL."
      fr: "`//` est un commentaire KQL : l'éditeur traite la suite comme du KQL, et `explain` suivi d'une instruction SELECT n'est pas du KQL valide."
    d:
      en: "`//` is a KQL comment, so the SELECT statement is parsed as KQL and fails."
      fr: "`//` est un commentaire KQL : l'instruction SELECT est analysée comme du KQL et échoue."
references:
  - title: T-SQL
    url: https://learn.microsoft.com/en-us/kusto/query/t-sql
