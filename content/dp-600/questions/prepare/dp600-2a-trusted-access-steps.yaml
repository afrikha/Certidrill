id: dp600-2a-trusted-access-steps
objective: "2.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that is assigned to an F64 capacity and contains a lakehouse named LH-Finance. You have the Admin role in Workspace1.

    You have an Azure Data Lake Storage Gen2 account named stfinance that allows public network access only from selected virtual networks and IP addresses. A storage administrator has already added a resource instance rule for Workspace1 to stfinance.

    You need to create a shortcut in LH-Finance that points to stfinance by using trusted workspace access. No secret or key must be stored in the connection.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1, affecté à une capacité F64, qui contient un lakehouse nommé LH-Finance. Vous avez le rôle Admin dans Workspace1.

    Vous disposez d'un compte Azure Data Lake Storage Gen2 nommé stfinance qui n'autorise l'accès réseau public que depuis des réseaux virtuels et des adresses IP sélectionnés. Un administrateur du stockage a déjà ajouté à stfinance une règle d'instance de ressource pour Workspace1.

    Vous devez créer dans LH-Finance un raccourci qui pointe vers stfinance en utilisant l'accès approuvé à l'espace de travail (trusted workspace access). Aucun secret ni aucune clé ne doit être stocké dans la connexion.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: wi, text: { en: "Create a workspace identity for Workspace1.", fr: "Créer une identité d'espace de travail pour Workspace1." } }
    - { id: rbac, text: { en: "Assign the Storage Blob Data Reader role on stfinance to the workspace identity.", fr: "Attribuer à l'identité d'espace de travail le rôle Storage Blob Data Reader sur stfinance." } }
    - { id: sc, text: { en: "Create the ADLS Gen2 shortcut with the Workspace identity authentication kind.", fr: "Créer le raccourci ADLS Gen2 avec le type d'authentification Workspace identity." } }
    - { id: mpe, text: { en: "Create a managed private endpoint from Workspace1 to stfinance.", fr: "Créer un point de terminaison privé managé de Workspace1 vers stfinance." } }
    - { id: gw, text: { en: "Install an on-premises data gateway and add stfinance to its allowed sources.", fr: "Installer une passerelle de données locale et ajouter stfinance à ses sources autorisées." } }
    - { id: key, text: { en: "Create the ADLS Gen2 shortcut with the Account key authentication kind.", fr: "Créer le raccourci ADLS Gen2 avec le type d'authentification Account key." } }
answer:
  sequence: [ wi, rbac, sc ]
explanation:
  correct:
    en: |
      Trusted workspace access relies on the workspace identity, which a workspace admin creates first. The identity then needs a storage data role such as Storage Blob Data Reader on the account, and the shortcut is created with the Workspace identity authentication kind so that no secret is stored. The resource instance rule lets requests from Workspace1 through the storage firewall.
    fr: |
      L'accès approuvé à l'espace de travail repose sur l'identité d'espace de travail, qu'un administrateur de l'espace de travail crée en premier. Cette identité a ensuite besoin d'un rôle de données de stockage comme Storage Blob Data Reader sur le compte, puis le raccourci est créé avec le type d'authentification Workspace identity afin qu'aucun secret ne soit stocké. La règle d'instance de ressource laisse passer les requêtes de Workspace1 à travers le pare-feu du stockage.
  options:
    mpe:
      en: Managed private endpoints are not supported for ADLS Gen2 shortcuts.
      fr: Les points de terminaison privés managés ne sont pas pris en charge pour les raccourcis ADLS Gen2.
    gw:
      en: A gateway is not needed; trusted workspace access already lets Workspace1 through the firewall.
      fr: "Une passerelle n'est pas nécessaire : l'accès approuvé à l'espace de travail laisse déjà passer Workspace1 à travers le pare-feu."
    key:
      en: An account key is a secret stored in the connection and grants full access to the account.
      fr: Une clé de compte est un secret stocké dans la connexion et donne un accès complet au compte.
references:
  - title: Trusted workspace access in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/security/security-trusted-workspace-access
  - title: Create an Azure Data Lake Storage Gen2 shortcut
    url: https://learn.microsoft.com/en-us/fabric/onelake/create-adls-shortcut
