id: dp600-cs3c-faculty-query
objective: "2.3.4"
type: dropdown
caseStudy: dp600-cs3c-graphic-design-institute
difficulty: 2
status: draft
stem:
  en: |
    Kai is writing the DAX query of requirement 4.

    How should Kai complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Kai écrit la requête DAX de l'exigence 4.

    Comment Kai doit-il compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    EVALUATE
    [[fn]] (
        Program[Faculty],
        [[flt]] ( { "Fall 2026" }, Term[TermName] ),
        "Students", [Enrolled Students]
    )
    ORDER BY [[ord]]
  slots:
    - id: fn
      options:
        - { id: addcol, text: ADDCOLUMNS }
        - { id: summcol, text: SUMMARIZECOLUMNS }
        - { id: selcol, text: SELECTCOLUMNS }
        - { id: calctab, text: CALCULATETABLE }
    - id: flt
      options:
        - { id: treatas, text: TREATAS }
        - { id: selval, text: SELECTEDVALUE }
        - { id: lookup, text: LOOKUPVALUE }
        - { id: contains, text: CONTAINS }
    - id: ord
      options:
        - { id: asc, text: "[Students] ASC" }
        - { id: fac, text: "Program[Faculty] DESC" }
        - { id: desc, text: "[Students] DESC" }
answer:
  values: { fn: summcol, flt: treatas, ord: desc }
explanation:
  correct:
    en: "SUMMARIZECOLUMNS groups by Program[Faculty], applies its filter table arguments and adds the named expression; it returns only the rows where at least one expression is not blank, so faculties without enrolled students are not returned. `TREATAS({\"Fall 2026\"}, Term[TermName])` turns the list of values into a filter on Term[TermName]. SUMMARIZECOLUMNS does not guarantee any sort order, so `ORDER BY [Students] DESC` sorts the result from the largest number."
    fr: "SUMMARIZECOLUMNS regroupe par Program[Faculty], applique ses arguments de table de filtre et ajoute l'expression nommée ; elle ne renvoie que les lignes où au moins une expression n'est pas vide : les facultés sans étudiant inscrit ne sont donc pas renvoyées. `TREATAS({\"Fall 2026\"}, Term[TermName])` transforme la liste de valeurs en filtre sur Term[TermName]. SUMMARIZECOLUMNS ne garantit aucun ordre de tri : `ORDER BY [Students] DESC` trie donc le résultat à partir du plus grand nombre."
  options:
    addcol: { en: "ADDCOLUMNS expects a table as its first argument and has no filter table arguments.", fr: "ADDCOLUMNS attend une table comme premier argument et n'a pas d'arguments de table de filtre." }
    selcol: { en: "SELECTCOLUMNS expects a table as its first argument and does not group or filter.", fr: "SELECTCOLUMNS attend une table comme premier argument et ne regroupe ni ne filtre." }
    calctab: { en: "CALCULATETABLE expects a table expression as its first argument and does not add named columns.", fr: "CALCULATETABLE attend une expression de table comme premier argument et n'ajoute pas de colonnes nommées." }
    selval: { en: "SELECTEDVALUE returns a scalar value, not a filter table.", fr: "SELECTEDVALUE renvoie une valeur scalaire, pas une table de filtre." }
    lookup: { en: "LOOKUPVALUE returns a scalar value from a table, not a filter table.", fr: "LOOKUPVALUE renvoie une valeur scalaire d'une table, pas une table de filtre." }
    contains: { en: "CONTAINS returns TRUE or FALSE, not a filter table.", fr: "CONTAINS renvoie TRUE ou FALSE, pas une table de filtre." }
    asc: { en: "ASC sorts from the smallest number to the largest.", fr: "ASC trie du plus petit nombre au plus grand." }
    fac: { en: "Sorting by faculty name does not sort by the number of students.", fr: "Trier par nom de faculté ne trie pas par nombre d'étudiants." }
references:
  - title: SUMMARIZECOLUMNS function (DAX)
    url: https://learn.microsoft.com/en-us/dax/summarizecolumns-function-dax
