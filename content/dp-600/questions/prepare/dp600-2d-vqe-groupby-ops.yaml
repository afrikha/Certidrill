id: dp600-2d-vqe-groupby-ops
objective: "2.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a table named **dbo.FactOrder**. The table contains one row per order with the CustomerKey, OrderAmount and DiscountRate columns.

    In a visual query, you add a **Group by** step on CustomerKey with four aggregations. Which operation should you use for each aggregation? To answer, drag the appropriate operations to the correct aggregations. Each operation may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table nommée **dbo.FactOrder**. La table contient une ligne par commande avec les colonnes CustomerKey, OrderAmount et DiscountRate.

    Dans une requête visuelle, vous ajoutez une étape **Regrouper par** sur CustomerKey avec quatre agrégations. Quelle opération devez-vous utiliser pour chaque agrégation ? Pour répondre, faites glisser les opérations appropriées vers les agrégations correspondantes. Chaque opération peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sum, text: { en: "Sum", fr: "Somme" } }
    - { id: avg, text: { en: "Average", fr: "Moyenne" } }
    - { id: max, text: { en: "Max", fr: "Max" } }
    - { id: count, text: { en: "Count rows", fr: "Nombre de lignes" } }
    - { id: all, text: { en: "All rows", fr: "Toutes les lignes" } }
  targets:
    - { id: t1, text: { en: "Number of orders of the customer", fr: "Nombre de commandes du client" } }
    - { id: t2, text: { en: "Total amount ordered by the customer", fr: "Montant total commandé par le client" } }
    - { id: t3, text: { en: "Largest single order of the customer", fr: "Plus grosse commande unique du client" } }
    - { id: t4, text: { en: "Mean discount rate of the customer's orders", fr: "Taux de remise moyen des commandes du client" } }
answer:
  mapping: { t1: count, t2: sum, t3: max, t4: avg }
explanation:
  correct:
    en: |
      The table has one row per order, so Count rows returns the number of orders of each customer. Sum adds the order amounts, Max returns the largest order amount and Average returns the mean of the discount rates.
    fr: |
      La table contient une ligne par commande : Nombre de lignes renvoie le nombre de commandes de chaque client. Somme additionne les montants des commandes, Max renvoie le montant de commande le plus élevé et Moyenne renvoie la moyenne des taux de remise.
  options:
    all: { en: "All rows returns a nested table of the grouped rows instead of a value.", fr: "Toutes les lignes renvoie une table imbriquée des lignes regroupées au lieu d'une valeur." }
references:
  - title: Grouping or summarizing rows
    url: https://learn.microsoft.com/en-us/power-query/group-by
  - title: "Tutorial: Create a query with the visual query builder in a Warehouse"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tutorial-visual-query
