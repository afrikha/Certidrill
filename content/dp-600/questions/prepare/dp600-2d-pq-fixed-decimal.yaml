id: dp600-2d-pq-fixed-decimal
objective: "2.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Dataflow Gen2 named **Dataflow1** that loads exchange rates into a lakehouse table. The rates have up to four decimal places, for example `1.0846`.

    The finance team reports small precision differences in totals calculated from the rates. You need the rates to be stored exactly, without floating-point precision differences.

    Which data type should you set for the rate column in Power Query?
  fr: |
    Vous disposez d'un Dataflow Gen2 nommé **Dataflow1** qui charge des taux de change dans une table de lakehouse. Les taux comportent jusqu'à quatre décimales, par exemple `1.0846`.

    L'équipe financière signale de petites différences de précision dans les totaux calculés à partir des taux. Vous devez stocker les taux de façon exacte, sans différence de précision liée à la virgule flottante.

    Quel type de données devez-vous définir pour la colonne des taux dans Power Query ?
body:
  options:
    - { id: a, text: { en: "Decimal number", fr: "Nombre décimal" } }
    - { id: b, text: { en: "Fixed decimal number", fr: "Nombre décimal fixe" } }
    - { id: c, text: { en: "Percentage", fr: "Pourcentage" } }
    - { id: d, text: { en: "Whole number", fr: "Nombre entier" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Fixed decimal number (`Currency.Type`) always has four digits after the decimal separator and is stored precisely, which removes floating-point rounding differences for values with up to four decimal places.
    fr: |
      Le type Nombre décimal fixe (`Currency.Type`) comporte toujours quatre chiffres après le séparateur décimal et est stocké de façon précise, ce qui supprime les écarts d'arrondi liés à la virgule flottante pour des valeurs comportant jusqu'à quatre décimales.
  options:
    a: { en: "Decimal number is a 64-bit floating-point number, which is the source of the small precision differences.", fr: "Nombre décimal est un nombre à virgule flottante sur 64 bits, ce qui est à l'origine des petites différences de précision." }
    c: { en: "Percentage is a Decimal number with a percentage format, so it has the same floating-point behavior.", fr: "Pourcentage est un Nombre décimal avec un format de pourcentage : il a le même comportement à virgule flottante." }
    d: { en: "Whole number drops the decimal places of the rates.", fr: "Nombre entier supprime les décimales des taux." }
references:
  - title: Data types in Power Query
    url: https://learn.microsoft.com/en-us/power-query/data-types
