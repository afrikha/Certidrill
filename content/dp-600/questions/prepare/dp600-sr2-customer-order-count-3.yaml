stem:
  en: You use a LEFT OUTER JOIN with the date filter in the ON clause and COUNT(o.OrderKey).
  fr: Vous utilisez un LEFT OUTER JOIN avec le filtre de date dans la clause ON et COUNT(o.OrderKey).
body:
  solution:
    en: |
      You run the following query.

      ```sql
      SELECT c.CustomerKey, c.CustomerName, COUNT(o.OrderKey) AS Orders2026
      FROM dbo.DimCustomer AS c
      LEFT OUTER JOIN dbo.FactOrder AS o
          ON o.CustomerKey = c.CustomerKey
          AND o.OrderDate >= '2026-01-01' AND o.OrderDate < '2027-01-01'
      GROUP BY c.CustomerKey, c.CustomerName;
      ```
    fr: |
      Vous exécutez la requête suivante.

      ```sql
      SELECT c.CustomerKey, c.CustomerName, COUNT(o.OrderKey) AS Orders2026
      FROM dbo.DimCustomer AS c
      LEFT OUTER JOIN dbo.FactOrder AS o
          ON o.CustomerKey = c.CustomerKey
          AND o.OrderDate >= '2026-01-01' AND o.OrderDate < '2027-01-01'
      GROUP BY c.CustomerKey, c.CustomerName;
      ```
answer: { value: true }
explanation:
  correct:
    en: Because the date condition is part of the ON clause, it restricts only the orders that are joined, and the LEFT OUTER JOIN still returns every customer. A customer without a 2026 order gets one row with NULL in o.OrderKey, and COUNT(o.OrderKey) counts only non-null values, so that customer gets 0.
    fr: "Comme la condition de date fait partie de la clause ON, elle restreint uniquement les commandes jointes, et le LEFT OUTER JOIN renvoie toujours tous les clients. Un client sans commande en 2026 obtient une ligne avec NULL dans o.OrderKey, et COUNT(o.OrderKey) ne compte que les valeurs non NULL : ce client obtient 0."
references:
