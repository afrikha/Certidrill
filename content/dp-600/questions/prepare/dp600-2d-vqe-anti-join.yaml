id: dp600-2d-vqe-anti-join
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains tables named **dbo.DimProduct** and **dbo.FactSales**. Both tables contain a ProductKey column. FactSales contains an OrderDate column and contains sales for 2025 and 2026.

    You need to build a visual query that returns the products that had no sales in 2026. In the merge, DimProduct must be the left table and FactSales the right table.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient des tables nommées **dbo.DimProduct** et **dbo.FactSales**. Les deux tables contiennent une colonne ProductKey. FactSales contient une colonne OrderDate et contient des ventes de 2025 et de 2026.

    Vous devez créer une requête visuelle qui renvoie les produits sans vente en 2026. Dans la fusion, DimProduct doit être la table de gauche et FactSales la table de droite.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Merge DimProduct with FactSales on ProductKey by using a Left anti join, and then filter OrderDate to 2026.", fr: "Fusionner DimProduct avec FactSales sur ProductKey avec une jointure Anti gauche, puis filtrer OrderDate sur 2026." } }
    - { id: b, text: { en: "Filter FactSales to the 2026 orders, and then merge DimProduct with FactSales on ProductKey by using a Left anti join.", fr: "Filtrer FactSales sur les commandes de 2026, puis fusionner DimProduct avec FactSales sur ProductKey avec une jointure Anti gauche." } }
    - { id: c, text: { en: "Filter FactSales to the 2026 orders, and then merge DimProduct with FactSales on ProductKey by using a Right anti join.", fr: "Filtrer FactSales sur les commandes de 2026, puis fusionner DimProduct avec FactSales sur ProductKey avec une jointure Anti droite." } }
    - { id: d, text: { en: "Filter FactSales to the 2026 orders, and then merge DimProduct with FactSales on ProductKey by using a Left outer join.", fr: "Filtrer FactSales sur les commandes de 2026, puis fusionner DimProduct avec FactSales sur ProductKey avec une jointure Externe gauche." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Left anti join returns only the rows of the left table that have no match in the right table. The right table must first be limited to the 2026 sales, so that a product with sales only in 2025 has no match and is returned.
    fr: |
      Une jointure Anti gauche ne renvoie que les lignes de la table de gauche qui n'ont aucune correspondance dans la table de droite. La table de droite doit d'abord être limitée aux ventes de 2026, pour qu'un produit vendu uniquement en 2025 n'ait aucune correspondance et soit renvoyé.
  options:
    a: { en: "After a Left anti join, the FactSales columns are empty, so a filter on OrderDate can't keep the 2026 products; products sold only in 2025 are also already excluded.", fr: "Après une jointure Anti gauche, les colonnes de FactSales sont vides : un filtre sur OrderDate ne peut pas conserver les produits de 2026 ; les produits vendus uniquement en 2025 sont en outre déjà exclus." }
    c: { en: "A Right anti join returns the sales rows that have no matching product, not the products without sales.", fr: "Une jointure Anti droite renvoie les lignes de ventes sans produit correspondant, pas les produits sans vente." }
    d: { en: "A Left outer join returns every product, including the products that had sales in 2026.", fr: "Une jointure Externe gauche renvoie tous les produits, y compris ceux qui ont eu des ventes en 2026." }
references:
  - title: Merge queries overview
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-overview
  - title: Query using the visual query editor
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/visual-query-editor
