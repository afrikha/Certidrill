id: dp600-2e-kql-sql-mapping
objective: "2.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Your team is moving a set of T-SQL reports to KQL querysets that query a KQL database in a Fabric eventhouse.

    You need to identify the KQL operator that replaces each T-SQL clause in the reports.

    Which KQL operator should you use for each clause? To answer, drag the appropriate operators to the correct clauses. Each operator may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe migre un ensemble de rapports T-SQL vers des ensembles de requêtes KQL qui interrogent une base de données KQL d'un eventhouse Fabric.

    Vous devez identifier l'opérateur KQL qui remplace chaque clause T-SQL des rapports.

    Quel opérateur KQL devez-vous utiliser pour chaque clause ? Pour répondre, faites glisser les opérateurs appropriés vers les clauses correspondantes. Chaque opérateur peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: where, text: where }
    - { id: summarize, text: summarize }
    - { id: top, text: top }
    - { id: take, text: take }
    - { id: extend, text: extend }
    - { id: distinct, text: distinct }
  targets:
    - id: wh
      text: "WHERE Country = 'France'"
    - id: grp
      text: "SUM(Amount) ... GROUP BY StoreId"
    - id: hav
      text: "HAVING SUM(Amount) > 1000"
    - id: topn
      text: "SELECT TOP (5) ... ORDER BY Revenue DESC"
answer:
  mapping: { wh: where, grp: summarize, hav: where, topn: top }
explanation:
  correct:
    en: "`where` filters rows; placed after `summarize`, it filters the aggregated rows, which is how KQL expresses `HAVING`. `summarize ... by` replaces aggregates with `GROUP BY`. `top 5 by Revenue desc` returns the first rows by a sort expression, like `TOP` with `ORDER BY`."
    fr: "`where` filtre les lignes ; placé après `summarize`, il filtre les lignes agrégées, ce qui correspond à `HAVING` en KQL. `summarize ... by` remplace les agrégats avec `GROUP BY`. `top 5 by Revenue desc` renvoie les premières lignes selon une expression de tri, comme `TOP` avec `ORDER BY`."
  options:
    take:
      en: "`take` returns arbitrary rows without sorting, so it doesn't replace `TOP` with `ORDER BY`."
      fr: "`take` renvoie des lignes quelconques sans tri : il ne remplace pas `TOP` avec `ORDER BY`."
    extend:
      en: "`extend` adds calculated columns, like an expression with an alias in `SELECT`."
      fr: "`extend` ajoute des colonnes calculées, comme une expression avec un alias dans `SELECT`."
    distinct:
      en: "`distinct` replaces `SELECT DISTINCT`."
      fr: "`distinct` remplace `SELECT DISTINCT`."
references:
  - title: SQL to Kusto query translation
    url: https://learn.microsoft.com/en-us/kusto/query/sql-cheat-sheet
