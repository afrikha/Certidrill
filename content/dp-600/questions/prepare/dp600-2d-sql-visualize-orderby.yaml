id: dp600-2d-sql-visualize-orderby
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1**. In the SQL query editor, you write a query that returns the revenue by product category. The query ends with `ORDER BY Revenue DESC`.

    You need to create a report from the result of the query by using **Visualize results** in the SQL query editor.

    What should you do first?
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1**. Dans l'éditeur de requête SQL, vous écrivez une requête qui renvoie le chiffre d'affaires par catégorie de produits. La requête se termine par `ORDER BY Revenue DESC`.

    Vous devez créer un rapport à partir du résultat de la requête à l'aide de **Visualiser les résultats** dans l'éditeur de requête SQL.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Add TOP (100) to the SELECT clause.", fr: "Ajouter TOP (100) à la clause SELECT." } }
    - { id: b, text: { en: "Remove the ORDER BY clause from the query.", fr: "Supprimer la clause ORDER BY de la requête." } }
    - { id: c, text: { en: "Move the query into a common table expression and keep ORDER BY in the outer query.", fr: "Placer la requête dans une expression de table commune et conserver ORDER BY dans la requête externe." } }
    - { id: d, text: { en: "Select Open in Excel before you select Visualize results.", fr: "Sélectionner Ouvrir dans Excel avant de sélectionner Visualiser les résultats." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Visualize results doesn't support queries that contain an ORDER BY clause. Remove the clause and sort the visuals in the report instead.
    fr: |
      Visualiser les résultats ne prend pas en charge les requêtes qui contiennent une clause ORDER BY. Supprimez la clause et triez plutôt les visuels dans le rapport.
  options:
    a: { en: "The query still contains ORDER BY, so Visualize results still can't use it.", fr: "La requête contient toujours ORDER BY : Visualiser les résultats ne peut toujours pas l'utiliser." }
    c: { en: "The outer query still contains ORDER BY.", fr: "La requête externe contient toujours ORDER BY." }
    d: { en: "Open in Excel runs the query in Excel; it doesn't remove the ORDER BY limitation of Visualize results.", fr: "Ouvrir dans Excel exécute la requête dans Excel ; cela ne lève pas la limite de Visualiser les résultats liée à ORDER BY." }
references:
  - title: Query using the SQL query editor
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/sql-query-editor
