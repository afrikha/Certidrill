id: dp600-2a-insert-target
objective: "2.1.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains the following items:

    - A lakehouse named LHSilver that contains a Delta table named dbo.Orders written by Spark
    - A lakehouse named LHGold that contains an empty Delta table named dbo.FactOrders
    - A warehouse named WHGold that contains an empty table named dbo.FactOrders

    A SQL developer must load the 2026 orders into a FactOrders table by running T-SQL in the SQL query editor of WHGold. The Power BI team will use whichever FactOrders table is loaded.

    How should you complete the statement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient les éléments suivants :

    - Un lakehouse nommé LHSilver qui contient une table Delta nommée dbo.Orders écrite par Spark
    - Un lakehouse nommé LHGold qui contient une table Delta vide nommée dbo.FactOrders
    - Un entrepôt nommé WHGold qui contient une table vide nommée dbo.FactOrders

    Un développeur SQL doit charger les commandes de 2026 dans une table FactOrders en exécutant du T-SQL dans l'éditeur de requêtes SQL de WHGold. L'équipe Power BI utilisera la table FactOrders qui aura été chargée.

    Comment devez-vous compléter l'instruction ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    INSERT INTO [[target]] (OrderID, CustomerKey, Amount)
    SELECT OrderID, CustomerKey, Amount
    FROM [[source]]
    WHERE OrderDate >= '2026-01-01';
  slots:
    - id: target
      options:
        - { id: lhgold, text: LHGold.dbo.FactOrders }
        - { id: whgold, text: WHGold.dbo.FactOrders }
        - { id: lhsilver, text: LHSilver.dbo.FactOrders }
    - id: source
      options:
        - { id: dboorders, text: dbo.Orders }
        - { id: files, text: LHSilver.Files.Orders }
        - { id: lhorders, text: LHSilver.dbo.Orders }
        - { id: onelake, text: OneLake.LHSilver.Orders }
answer:
  values: { target: whgold, source: lhorders }
explanation:
  correct:
    en: |
      Of these items, only the warehouse accepts T-SQL writes: the SQL analytics endpoint of a lakehouse is read-only, so the target must be WHGold.dbo.FactOrders. A warehouse query reads a lakehouse table of the same workspace with a three-part name in the form item.schema.table, here LHSilver.dbo.Orders.
    fr: |
      Parmi ces éléments, seul l'entrepôt accepte les écritures T-SQL : le point de terminaison d'analytique SQL d'un lakehouse est en lecture seule, la cible doit donc être WHGold.dbo.FactOrders. Une requête d'entrepôt lit une table de lakehouse du même espace de travail avec un nom en trois parties de la forme élément.schéma.table, ici LHSilver.dbo.Orders.
  options:
    lhgold: { en: "Lakehouse tables are read-only for T-SQL; LHGold.dbo.FactOrders can be loaded only with Spark or another lakehouse write path.", fr: "Les tables de lakehouse sont en lecture seule pour le T-SQL ; LHGold.dbo.FactOrders ne peut être chargée qu'avec Spark ou un autre moyen d'écriture du lakehouse." }
    lhsilver: { en: "LHSilver contains no FactOrders table, and its tables are read-only for T-SQL anyway.", fr: "LHSilver ne contient pas de table FactOrders, et ses tables sont de toute façon en lecture seule pour le T-SQL." }
    dboorders: { en: "Without an item name, dbo.Orders refers to a table of WHGold, which doesn't exist.", fr: "Sans nom d'élément, dbo.Orders désigne une table de WHGold, qui n'existe pas." }
    files: { en: "The Files section is not a schema; T-SQL reads only the Delta tables of the Tables section.", fr: "La section Files n'est pas un schéma ; le T-SQL ne lit que les tables Delta de la section Tables." }
    onelake: { en: "OneLake is not a database name; the first part of the name is the item.", fr: "OneLake n'est pas un nom de base de données ; la première partie du nom est l'élément." }
references:
  - title: Ingest data into the warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/ingest-data
  - title: What is the SQL analytics endpoint for a lakehouse?
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sql-analytics-endpoint
