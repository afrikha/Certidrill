id: dp600-2c-agg-gold-lakehouse
objective: "2.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a lakehouse named **LH1** that contains a Delta table named **silver_sales**.

    You need a gold aggregate of silver_sales by month and region. The aggregate must be stored as a Delta table in LH1 so that any Fabric engine can read it, and it must be refreshed every day.

    Which two solutions meet the requirements? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse nommé **LH1** qui contient une table Delta nommée **silver_sales**.

    Vous avez besoin d'un agrégat gold de silver_sales par mois et par région. L'agrégat doit être stocké comme table Delta dans LH1 pour que tout moteur Fabric puisse le lire, et il doit être actualisé chaque jour.

    Quelles sont les deux solutions qui répondent aux exigences ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A view in the SQL analytics endpoint of LH1 that groups silver_sales by month and region", fr: "Une vue dans le point de terminaison d'analytique SQL de LH1 qui regroupe silver_sales par mois et par région" } }
    - { id: b, text: { en: "A materialized lake view that groups silver_sales by month and region, with a daily refresh schedule", fr: "Une vue matérialisée de lakehouse qui regroupe silver_sales par mois et par région, avec une planification d'actualisation quotidienne" } }
    - { id: c, text: { en: "A calculated table in a semantic model that summarizes silver_sales by month and region", fr: "Une table calculée dans un modèle sémantique qui résume silver_sales par mois et par région" } }
    - { id: d, text: { en: "A scheduled daily notebook that groups silver_sales by month and region and overwrites a gold Delta table", fr: "Un notebook planifié chaque jour qui regroupe silver_sales par mois et par région et remplace une table Delta gold" } }
    - { id: e, text: { en: "A CREATE TABLE AS SELECT statement run daily in the SQL analytics endpoint of LH1", fr: "Une instruction CREATE TABLE AS SELECT exécutée chaque jour dans le point de terminaison d'analytique SQL de LH1" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A materialized lake view persists its result as a Delta table in the lakehouse and is refreshed by Fabric, which can skip, run incrementally or fully rebuild it. A scheduled notebook that writes the grouped DataFrame to a Delta table also produces a stored table that every engine can read."
    fr: "Une vue matérialisée de lakehouse conserve son résultat sous forme de table Delta dans le lakehouse et est actualisée par Fabric, qui peut l'ignorer, l'actualiser de façon incrémentielle ou la reconstruire entièrement. Un notebook planifié qui écrit le DataFrame regroupé dans une table Delta produit lui aussi une table stockée que tous les moteurs peuvent lire."
  options:
    a: { en: "A view stores only its query; no Delta table is created in LH1.", fr: "Une vue ne stocke que sa requête ; aucune table Delta n'est créée dans LH1." }
    c: { en: "A calculated table lives in the semantic model, not as a Delta table in the lakehouse.", fr: "Une table calculée réside dans le modèle sémantique, et non comme table Delta dans le lakehouse." }
    e: { en: "The SQL analytics endpoint is read-only for tables: it can't create or write tables.", fr: "Le point de terminaison d'analytique SQL est en lecture seule pour les tables : il ne peut pas créer ni écrire de tables." }
references:
  - title: What are materialized lake views in Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/materialized-lake-views/overview-materialized-lake-view
  - title: T-SQL surface area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
