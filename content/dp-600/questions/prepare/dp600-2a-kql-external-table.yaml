id: dp600-2a-kql-external-table
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an eventhouse that contains a KQL database named KQLDB1. KQLDB1 contains a OneLake shortcut named SalesShortcut that points to a Delta table in a lakehouse. The table contains the OrderDate, Region and Amount columns.

    You need to write a query in KQLDB1 that returns the total amount by region for the last seven days.

    How should you complete the query? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un eventhouse qui contient une base de données KQL nommée KQLDB1. KQLDB1 contient un raccourci OneLake nommé SalesShortcut qui pointe vers une table Delta d'un lakehouse. La table contient les colonnes OrderDate, Region et Amount.

    Vous devez écrire dans KQLDB1 une requête qui renvoie le montant total par région pour les sept derniers jours.

    Comment devez-vous compléter la requête ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[src]]('SalesShortcut')
    | where OrderDate > ago(7d)
    | [[op]] Total = sum(Amount) by Region
  slots:
    - id: src
      options:
        - { id: table, text: table }
        - { id: external, text: external_table }
        - { id: mv, text: materialized_view }
        - { id: database, text: database }
    - id: op
      options:
        - { id: extend, text: extend }
        - { id: summarize, text: summarize }
        - { id: project, text: project }
        - { id: series, text: make-series }
answer:
  values: { src: external, op: summarize }
explanation:
  correct:
    en: |
      In a KQL database, shortcuts appear in the Shortcuts folder and are treated as external tables, so you query them with the external_table() function. summarize with sum() and by Region aggregates the filtered rows into one total per region.
    fr: |
      Dans une base de données KQL, les raccourcis apparaissent dans le dossier Shortcuts et sont traités comme des tables externes : vous les interrogez avec la fonction external_table(). summarize avec sum() et by Region agrège les lignes filtrées en un total par région.
  options:
    table: { en: "table() references a table of the database, not a shortcut, which is an external table.", fr: "table() référence une table de la base de données, pas un raccourci, qui est une table externe." }
    mv: { en: "materialized_view() references a materialized view, not a shortcut.", fr: "materialized_view() référence une vue matérialisée, pas un raccourci." }
    extend: { en: "extend adds a column to every row; it cannot aggregate by Region.", fr: "extend ajoute une colonne à chaque ligne ; il ne peut pas agréger par Region." }
    series: { en: "make-series needs an on clause and a step to build time series; it is not a plain aggregation.", fr: "make-series exige une clause on et un pas pour construire des séries chronologiques ; ce n'est pas une simple agrégation." }
references:
  - title: Unify Data Sources With OneLake Shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
