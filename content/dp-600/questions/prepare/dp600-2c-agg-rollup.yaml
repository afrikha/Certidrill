id: dp600-2c-agg-rollup
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric warehouse named **WH1** that contains a table named **dbo.Sales** with the columns **Region**, **Country** and **SalesAmount**. Each country belongs to one region.

    You need a single query that returns:

    - One row per region and country with the total sales.
    - One subtotal row per region.
    - One grand total row.

    The query must not return any other subtotal rows.

    Which GROUP BY clause should you use?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé **WH1** qui contient une table nommée **dbo.Sales** avec les colonnes **Region**, **Country** et **SalesAmount**. Chaque pays appartient à une seule région.

    Vous avez besoin d'une seule requête qui renvoie :

    - Une ligne par région et par pays avec le total des ventes.
    - Une ligne de sous-total par région.
    - Une ligne de total général.

    La requête ne doit renvoyer aucune autre ligne de sous-total.

    Quelle clause GROUP BY devez-vous utiliser ?
body:
  options:
    - id: a
      text: "`GROUP BY CUBE(Region, Country)`"
    - id: b
      text: "`GROUP BY ROLLUP(Country, Region)`"
    - id: c
      text: "`GROUP BY GROUPING SETS ((Region), ())`"
    - id: d
      text: "`GROUP BY ROLLUP(Region, Country)`"
answer: { optionId: d }
explanation:
  correct:
    en: "`ROLLUP(Region, Country)` produces the grouping sets (Region, Country), (Region) and the grand total (), which are exactly the three levels required. The subtotal rows have NULL in the rolled-up columns."
    fr: "`ROLLUP(Region, Country)` produit les ensembles de regroupement (Region, Country), (Region) et le total général (), soit exactement les trois niveaux exigés. Les lignes de sous-total ont NULL dans les colonnes agrégées."
  options:
    a: { en: "CUBE produces every combination, so it also returns a subtotal per country across regions.", fr: "CUBE produit toutes les combinaisons : il renvoie aussi un sous-total par pays toutes régions confondues." }
    b: { en: "ROLLUP removes columns from right to left, so this order produces subtotals per country instead of per region.", fr: "ROLLUP retire les colonnes de droite à gauche : cet ordre produit des sous-totaux par pays au lieu de par région." }
    c: { en: "These grouping sets return the region subtotals and the grand total, but not the rows per region and country.", fr: "Ces ensembles de regroupement renvoient les sous-totaux par région et le total général, mais pas les lignes par région et par pays." }
references:
  - title: SELECT - GROUP BY clause (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-group-by-transact-sql
