id: dp600-2c-join-left-outer
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Dataflow Gen2 that contains two queries named **Orders** and **Customers**. Some orders reference a CustomerID that doesn't exist in Customers.

    You need to merge the queries so that the result contains every order, with the customer name when the customer exists. Customers that have no order must not appear. Orders is the left table.

    Which join kind should you use?
  fr: |
    Vous disposez d'un Dataflow Gen2 qui contient deux requêtes nommées **Orders** et **Customers**. Certaines commandes référencent un CustomerID qui n'existe pas dans Customers.

    Vous devez fusionner les requêtes pour que le résultat contienne toutes les commandes, avec le nom du client quand le client existe. Les clients sans commande ne doivent pas apparaître. Orders est la table de gauche.

    Quel type de jointure devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Inner", fr: "Jointure interne" }
    - id: b
      text: { en: "Full outer", fr: "Jointure externe complète" }
    - id: c
      text: { en: "Left outer", fr: "Jointure externe gauche" }
    - id: d
      text: { en: "Right outer", fr: "Jointure externe droite" }
answer: { optionId: c }
explanation:
  correct:
    en: "A left outer join returns all the rows of the left table (Orders) and the matching rows of the right table (Customers). Orders without a matching customer are kept with null customer values."
    fr: "Une jointure externe gauche renvoie toutes les lignes de la table de gauche (Orders) et les lignes correspondantes de la table de droite (Customers). Les commandes sans client correspondant sont conservées avec des valeurs de client null."
  options:
    a: { en: "An inner join drops the orders whose customer doesn't exist.", fr: "Une jointure interne supprime les commandes dont le client n'existe pas." }
    b: { en: "A full outer join also returns the customers that have no order.", fr: "Une jointure externe complète renvoie aussi les clients sans commande." }
    d: { en: "A right outer join keeps all customers and drops the orders without a matching customer.", fr: "Une jointure externe droite conserve tous les clients et supprime les commandes sans client correspondant." }
references:
  - title: Merge queries overview
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-overview
