id: dp600-2c-join-fuzzy-aliases
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Dataflow Gen2 that merges an **Invoices** query with a **Suppliers** query on the supplier name, a text column. The merge uses fuzzy matching with a similarity threshold of 0.80.

    Most spelling differences now match. However, some invoices use known abbreviations, such as **NWT** for **Northwind Traders**, and these invoices still have no match.

    You need these abbreviations to match the correct supplier without lowering the similarity threshold.

    What should you configure in the fuzzy matching options?
  fr: |
    Vous disposez d'un Dataflow Gen2 qui fusionne une requête **Invoices** avec une requête **Suppliers** sur le nom du fournisseur, une colonne de texte. La fusion utilise la correspondance approximative avec un seuil de similarité de 0,80.

    La plupart des différences d'orthographe correspondent maintenant. Cependant, certaines factures utilisent des abréviations connues, comme **NWT** pour **Northwind Traders**, et ces factures n'ont toujours aucune correspondance.

    Ces abréviations doivent correspondre au bon fournisseur sans abaisser le seuil de similarité.

    Que devez-vous configurer dans les options de correspondance approximative ?
body:
  options:
    - id: a
      text: { en: "Ignore case", fr: "Ignorer la casse" }
    - id: b
      text: { en: "Match by combining text parts", fr: "Correspondance en combinant les parties de texte" }
    - id: c
      text: { en: "A transformation table with From and To columns", fr: "Un tableau de transformation avec les colonnes From et To" }
    - id: d
      text: { en: "Number of matches set to 1", fr: "Nombre de correspondances défini sur 1" }
answer: { optionId: c }
explanation:
  correct:
    en: "A transformation table maps values before the fuzzy comparison: a row with From = NWT and To = Northwind Traders makes the abbreviation match the full name. The threshold stays at 0.80 for the other values."
    fr: "Un tableau de transformation mappe des valeurs avant la comparaison approximative : une ligne avec From = NWT et To = Northwind Traders fait correspondre l'abréviation au nom complet. Le seuil reste à 0,80 pour les autres valeurs."
  options:
    a: { en: "Ignore case only removes differences of letter case.", fr: "Ignorer la casse ne supprime que les différences de majuscules et de minuscules." }
    b: { en: "Combining text parts matches values such as Micro soft and Microsoft, not abbreviations.", fr: "Combiner les parties de texte fait correspondre des valeurs comme Micro soft et Microsoft, pas des abréviations." }
    d: { en: "The number of matches limits how many rows are returned per input row; it doesn't create new matches.", fr: "Le nombre de correspondances limite le nombre de lignes renvoyées par ligne d'entrée ; il ne crée pas de nouvelles correspondances." }
references:
  - title: Fuzzy merge
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-fuzzy-match
