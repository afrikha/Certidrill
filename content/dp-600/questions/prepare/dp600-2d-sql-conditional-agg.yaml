id: dp600-2d-sql-conditional-agg
objective: "2.3.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a table named **dbo.FactSales**. The table contains one row per sale with the Region, Channel, CustomerKey and SalesAmount columns. Channel is Web or Store.

    You need a query that returns one row per region with the following columns:

    - TotalSales: the sales of all channels
    - WebSales: the sales of the Web channel
    - WebCustomers: the number of different customers who bought on the Web channel

    The query must read FactSales only once.

    How should you complete the T-SQL query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table nommée **dbo.FactSales**. La table contient une ligne par vente avec les colonnes Region, Channel, CustomerKey et SalesAmount. Channel vaut Web ou Store.

    Vous avez besoin d'une requête qui renvoie une ligne par région avec les colonnes suivantes :

    - TotalSales : les ventes de tous les canaux
    - WebSales : les ventes du canal Web
    - WebCustomers : le nombre de clients différents qui ont acheté sur le canal Web

    La requête ne doit lire FactSales qu'une seule fois.

    Comment devez-vous compléter la requête T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT Region,
           SUM(SalesAmount) AS TotalSales,
           SUM([[cond]] Channel = 'Web' THEN SalesAmount ELSE 0 END) AS WebSales,
           [[cnt]] CASE WHEN Channel = 'Web' THEN CustomerKey END) AS WebCustomers
    FROM dbo.FactSales
    GROUP BY Region;
  slots:
    - id: cond
      options:
        - { id: casewhen, text: CASE WHEN }
        - { id: where, text: WHERE }
        - { id: iif, text: "IIF(" }
    - id: cnt
      options:
        - { id: countd, text: "COUNT(DISTINCT" }
        - { id: count, text: "COUNT(" }
        - { id: sum, text: "SUM(" }
answer:
  values: { cond: casewhen, cnt: countd }
explanation:
  correct:
    en: |
      A CASE expression inside the aggregate keeps only the Web amounts while the same pass sums all the rows for TotalSales. For WebCustomers, the CASE returns CustomerKey for the Web rows and NULL for the others, and `COUNT(DISTINCT ...)` counts each Web customer once and ignores the NULL values.
    fr: |
      Une expression CASE à l'intérieur de l'agrégat ne retient que les montants Web, tandis que le même passage additionne toutes les lignes pour TotalSales. Pour WebCustomers, le CASE renvoie CustomerKey pour les lignes Web et NULL pour les autres, et `COUNT(DISTINCT ...)` compte chaque client Web une seule fois en ignorant les valeurs NULL.
  options:
    where: { en: "WHERE is a clause of the query and can't be used inside an aggregate; filtering the rows would also change TotalSales.", fr: "WHERE est une clause de la requête et ne peut pas figurer dans un agrégat ; filtrer les lignes modifierait aussi TotalSales." }
    iif: { en: "IIF takes three comma-separated arguments and doesn't use THEN, ELSE and END.", fr: "IIF prend trois arguments séparés par des virgules et n'utilise pas THEN, ELSE ni END." }
    count: { en: "COUNT counts every Web sale, so a customer with several Web purchases is counted several times.", fr: "COUNT compte chaque vente Web : un client qui a plusieurs achats Web est compté plusieurs fois." }
    sum: { en: "SUM adds the customer keys instead of counting the customers.", fr: "SUM additionne les clés de clients au lieu de compter les clients." }
references:
  - title: SELECT - GROUP BY clause (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-group-by-transact-sql
  - title: NULL and UNKNOWN (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/null-and-unknown-transact-sql
