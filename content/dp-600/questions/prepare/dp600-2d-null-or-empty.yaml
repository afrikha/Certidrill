id: dp600-2d-null-or-empty
objective: "2.2.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a table named **dbo.FactOrder**. The DiscountCode column uses the `varchar(20)` data type. Orders without a discount have either a NULL or an empty string in DiscountCode.

    You need a query that returns all the orders without a discount.

    Which two WHERE clauses can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table nommée **dbo.FactOrder**. La colonne DiscountCode utilise le type de données `varchar(20)`. Les commandes sans remise ont soit NULL, soit une chaîne vide dans DiscountCode.

    Vous avez besoin d'une requête qui renvoie toutes les commandes sans remise.

    Quelles sont les deux clauses WHERE que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "WHERE DiscountCode IS NULL OR DiscountCode = ''" }
    - { id: b, text: "WHERE DiscountCode = NULL OR DiscountCode = ''" }
    - { id: c, text: "WHERE COALESCE(DiscountCode, '') = ''" }
    - { id: d, text: "WHERE DiscountCode IN (NULL, '')" }
    - { id: e, text: "WHERE LEN(DiscountCode) = 0" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "`IS NULL` is TRUE for the missing values, and `= ''` is TRUE for the empty strings, so their OR returns both kinds of rows. `COALESCE(DiscountCode, '')` replaces NULL with an empty string before the comparison, which gives the same result."
    fr: "`IS NULL` est vrai pour les valeurs manquantes et `= ''` pour les chaînes vides : leur OU renvoie les deux types de lignes. `COALESCE(DiscountCode, '')` remplace NULL par une chaîne vide avant la comparaison, ce qui donne le même résultat."
  options:
    b: { en: "DiscountCode = NULL returns UNKNOWN for every row, so only the empty strings are returned.", fr: "DiscountCode = NULL renvoie UNKNOWN pour chaque ligne : seules les chaînes vides sont renvoyées." }
    d: { en: "IN compares with = for each value, and the comparison with NULL is never TRUE, so only the empty strings are returned.", fr: "IN compare chaque valeur avec = et la comparaison avec NULL n'est jamais vraie : seules les chaînes vides sont renvoyées." }
    e: { en: "LEN(NULL) returns NULL, so the rows with a NULL DiscountCode are excluded.", fr: "LEN(NULL) renvoie NULL : les lignes dont DiscountCode est NULL sont exclues." }
references:
  - title: NULL and UNKNOWN (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/null-and-unknown-transact-sql
