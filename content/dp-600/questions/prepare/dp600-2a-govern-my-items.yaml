id: dp600-2a-govern-my-items
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Megan owns about 40 lakehouses, warehouses and semantic models in several Fabric workspaces. She isn't a Fabric administrator, a domain admin or a capacity admin.

    Megan needs to see insights about the sensitivity label coverage and the curation state of the items she owns, together with recommended actions to improve them.

    What should Megan use?
  fr: |
    Megan est propriétaire d'environ 40 lakehouses, entrepôts et modèles sémantiques dans plusieurs espaces de travail Fabric. Elle n'est ni administratrice Fabric, ni administratrice de domaine, ni administratrice de capacité.

    Megan doit voir des informations sur la couverture des étiquettes de confidentialité et l'état de curation des éléments dont elle est propriétaire, avec des actions recommandées pour les améliorer.

    Qu'est-ce que Megan doit utiliser ?
body:
  options:
    - { id: a, text: { en: "The Explore tab of the OneLake catalog with the My items filter", fr: "L'onglet Explore du catalogue OneLake avec le filtre My items" } }
    - { id: b, text: { en: "The Govern tab of the OneLake catalog in the My items view", fr: "L'onglet Govern du catalogue OneLake dans la vue My items" } }
    - { id: c, text: { en: "The Secure tab of the OneLake catalog", fr: "L'onglet Secure du catalogue OneLake" } }
    - { id: d, text: { en: "The Fabric admin portal", fr: "Le portail d'administration Fabric" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Govern tab of the OneLake catalog shows governance insights and recommended actions. In the My items view, it scopes them to the content that the user owns, with a report on inventory, sensitivity label coverage and curation state, so no administrator role is needed.
    fr: |
      L'onglet Govern du catalogue OneLake affiche des informations de gouvernance et des actions recommandées. Dans la vue My items, il les limite au contenu dont l'utilisateur est propriétaire, avec un rapport sur l'inventaire, la couverture des étiquettes de confidentialité et l'état de curation : aucun rôle d'administrateur n'est nécessaire.
  options:
    a:
      en: The My items filter of the Explore tab lists Megan's items, but without governance insights or recommended actions.
      fr: Le filtre My items de l'onglet Explore liste les éléments de Megan, mais sans informations de gouvernance ni actions recommandées.
    c:
      en: The Secure tab focuses on workspace roles and OneLake security roles, not on label coverage or curation.
      fr: L'onglet Secure porte sur les rôles d'espace de travail et les rôles de sécurité OneLake, pas sur la couverture des étiquettes ni la curation.
    d:
      en: The admin portal is for Fabric administrators, and Megan has no administrator role.
      fr: Le portail d'administration est destiné aux administrateurs Fabric, et Megan n'a aucun rôle d'administrateur.
references:
  - title: Govern and manage your Fabric data estate with the OneLake catalog
    url: https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-govern
