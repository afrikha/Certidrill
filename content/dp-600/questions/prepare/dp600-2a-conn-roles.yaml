id: dp600-2a-conn-roles
objective: "2.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You manage a shareable cloud connection named Conn-Lake that is used by OneLake shortcuts and pipelines in several workspaces. Three users need access to Conn-Lake:

    - UserA must use Conn-Lake in the pipelines that UserA creates.
    - UserB must use Conn-Lake and share it with the other members of the UserB team.
    - UserC must update the credentials stored in Conn-Lake and manage the users of the connection.

    You need to grant access to each user. The solution must follow the principle of least privilege.

    What should you assign to each user? To answer, drag the appropriate roles to the correct users. Each role may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez une connexion cloud partageable nommée Conn-Lake, utilisée par des raccourcis OneLake et des pipelines dans plusieurs espaces de travail. Trois utilisateurs ont besoin d'accéder à Conn-Lake :

    - UserA doit utiliser Conn-Lake dans les pipelines qu'il crée.
    - UserB doit utiliser Conn-Lake et la partager avec les autres membres de son équipe.
    - UserC doit mettre à jour les informations d'identification stockées dans Conn-Lake et gérer les utilisateurs de la connexion.

    Vous devez accorder l'accès à chaque utilisateur. La solution doit respecter le principe du moindre privilège.

    Que devez-vous attribuer à chaque utilisateur ? Pour répondre, faites glisser les rôles appropriés vers les utilisateurs correspondants. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: user, text: { en: "User role on Conn-Lake", fr: "Rôle User sur Conn-Lake" } }
    - { id: reshare, text: { en: "User with resharing role on Conn-Lake", fr: "Rôle User with resharing sur Conn-Lake" } }
    - { id: owner, text: { en: "Owner role on Conn-Lake", fr: "Rôle Owner sur Conn-Lake" } }
    - { id: wscontrib, text: { en: "Contributor role in the workspaces", fr: "Rôle Contributor dans les espaces de travail" } }
    - { id: wsadmin, text: { en: "Admin role in the workspaces", fr: "Rôle Admin dans les espaces de travail" } }
  targets:
    - { id: ua, text: UserA }
    - { id: ub, text: UserB }
    - { id: uc, text: UserC }
answer:
  mapping: { ua: user, ub: reshare, uc: owner }
explanation:
  correct:
    en: |
      A connection has its own access list with three roles. User lets someone use the connection in their items, User with resharing also lets them share it with others, and Owner gives full management of the connection, including its credentials and its users. Workspace roles never grant access to a connection, so they meet none of the requirements.
    fr: |
      Une connexion a sa propre liste d'accès avec trois rôles. User permet d'utiliser la connexion dans ses éléments, User with resharing permet en plus de la partager avec d'autres, et Owner donne la gestion complète de la connexion, y compris ses informations d'identification et ses utilisateurs. Les rôles d'espace de travail n'accordent jamais l'accès à une connexion : ils ne répondent à aucun des besoins.
  options:
    wscontrib:
      en: A workspace role controls the items of the workspace, not the access list of a connection.
      fr: Un rôle d'espace de travail contrôle les éléments de l'espace de travail, pas la liste d'accès d'une connexion.
    wsadmin:
      en: Even the Admin role of a workspace does not let a user see or manage a connection that was not shared with them.
      fr: Même le rôle Admin d'un espace de travail ne permet pas de voir ou de gérer une connexion qui n'a pas été partagée avec l'utilisateur.
references:
  - title: Data source management
    url: https://learn.microsoft.com/en-us/fabric/data-factory/data-source-management
