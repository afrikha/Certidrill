id: dp600-2d-pyspark-filter-operators
objective: "2.2.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a notebook attached to a lakehouse named **Lakehouse1**. The notebook loads a Delta table into a DataFrame named **df**, and it imports the functions module as follows.

    ```python
    from pyspark.sql import functions as F
    ```

    You need a DataFrame that contains only the rows in which Country is `FR` and Amount is greater than 100.

    Which two expressions can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un notebook attaché à un lakehouse nommé **Lakehouse1**. Le notebook charge une table Delta dans un DataFrame nommé **df** et importe le module de fonctions comme suit.

    ```python
    from pyspark.sql import functions as F
    ```

    Vous avez besoin d'un DataFrame qui ne contient que les lignes dans lesquelles Country vaut `FR` et Amount est supérieur à 100.

    Quelles sont les deux expressions que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`df.filter((F.col(\"Country\") == \"FR\") & (F.col(\"Amount\") > 100))`" }
    - { id: b, text: "`df.filter(F.col(\"Country\") == \"FR\" & F.col(\"Amount\") > 100)`" }
    - { id: c, text: "`df.filter((F.col(\"Country\") == \"FR\") and (F.col(\"Amount\") > 100))`" }
    - { id: d, text: "`df.filter(\"Country = 'FR' AND Amount > 100\")`" }
    - { id: e, text: "`df.filter((F.col(\"Country\") == \"FR\") | (F.col(\"Amount\") > 100))`" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Column conditions are combined with the `&` operator, and each condition needs its own parentheses because `&` has a higher precedence than `==` and `>` in Python. `filter` also accepts a SQL expression string, so `"Country = 'FR' AND Amount > 100"` returns the same rows.
    fr: |
      Les conditions sur des colonnes se combinent avec l'opérateur `&`, et chaque condition a besoin de ses propres parenthèses, car `&` a une priorité plus élevée que `==` et `>` en Python. `filter` accepte aussi une chaîne d'expression SQL : `"Country = 'FR' AND Amount > 100"` renvoie les mêmes lignes.
  options:
    b: { en: "Without parentheses, Python evaluates \"FR\" & F.col(\"Amount\") first, so the expression fails.", fr: "Sans parenthèses, Python évalue d'abord \"FR\" & F.col(\"Amount\") : l'expression échoue." }
    c: { en: "The Python and keyword can't combine two Column objects and raises an error.", fr: "Le mot clé Python and ne peut pas combiner deux objets Column et lève une erreur." }
    e: { en: "| is the OR operator, so the rows that meet only one condition are also returned.", fr: "| est l'opérateur OU : les lignes qui ne satisfont qu'une seule condition sont aussi renvoyées." }
references:
  - title: "Tutorial: Load and transform data using Apache Spark DataFrames"
    url: https://learn.microsoft.com/en-us/azure/databricks/getting-started/dataframes
