id: dp600-2a-discovery-locations
objective: "2.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Analysts at Litware use Fabric to find and connect data. You need to tell them where to start for each task.

    Which location should you recommend for each task? To answer, drag the appropriate locations to the correct tasks. Each location may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les analystes de Litware utilisent Fabric pour trouver des données et s'y connecter. Vous devez leur indiquer par où commencer pour chaque tâche.

    Quel emplacement devez-vous recommander pour chaque tâche ? Pour répondre, faites glisser les emplacements appropriés vers les tâches correspondantes. Chaque emplacement peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rthall, text: { en: "Real-Time hub: All data streams", fr: "Hub Real-Time : All data streams" } }
    - { id: rthms, text: { en: "Real-Time hub: Microsoft sources", fr: "Hub Real-Time : Microsoft sources" } }
    - { id: rthfab, text: { en: "Real-Time hub: Fabric events", fr: "Hub Real-Time : Fabric events" } }
    - { id: catexp, text: { en: "OneLake catalog: Explore", fr: "Catalogue OneLake : Explore" } }
    - { id: catgov, text: { en: "OneLake catalog: Govern", fr: "Catalogue OneLake : Govern" } }
  targets:
    - { id: t1, text: { en: "Find the KQL tables of the tenant that they can query, with the owner and the workspace of each table", fr: "Trouver les tables KQL du locataire qu'ils peuvent interroger, avec le propriétaire et l'espace de travail de chaque table" } }
    - { id: t2, text: { en: "Connect an Azure IoT Hub of their Azure subscription to Fabric as a new stream", fr: "Connecter à Fabric un Azure IoT Hub de leur abonnement Azure en tant que nouveau flux" } }
    - { id: t3, text: { en: "Find a certified warehouse and view its lineage and permissions", fr: "Trouver un entrepôt certifié et consulter sa traçabilité et ses autorisations" } }
    - { id: t4, text: { en: "Get notified when a semantic model refresh fails", fr: "Être prévenus quand l'actualisation d'un modèle sémantique échoue" } }
answer:
  mapping: { t1: rthall, t2: rthms, t3: catexp, t4: rthfab }
explanation:
  correct:
    en: |
      All data streams lists eventstream streams and KQL tables with their source item, owner and workspace. Microsoft sources lists Azure streaming resources such as IoT Hub and Event Hubs that you can connect. The Explore tab of the OneLake catalog finds items such as warehouses and opens their details, including lineage and permissions. A semantic model refresh is a job, so the job events under Fabric events can drive an alert when it fails.
    fr: |
      All data streams liste les flux des eventstreams et les tables KQL avec leur élément source, leur propriétaire et leur espace de travail. Microsoft sources liste les ressources de streaming Azure comme IoT Hub et Event Hubs que vous pouvez connecter. L'onglet Explore du catalogue OneLake trouve des éléments comme les entrepôts et ouvre leurs détails, dont la traçabilité et les autorisations. L'actualisation d'un modèle sémantique est un travail : les événements de travaux de Fabric events peuvent donc déclencher une alerte en cas d'échec.
  options:
    catgov:
      en: The Govern tab shows governance insights and recommended actions; it is not used to find a specific item, connect a stream or raise alerts.
      fr: L'onglet Govern affiche des informations de gouvernance et des actions recommandées ; il ne sert pas à trouver un élément précis, à connecter un flux ni à déclencher des alertes.
references:
  - title: Introduction to Fabric Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/real-time-hub-overview
  - title: Find and explore data in the OneLake catalog
    url: https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-explore
