id: dp600-2d-vqe-query-statements
objective: "2.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named **Workspace1** that contains a warehouse named **Warehouse1** and a lakehouse named **Lakehouse1**. User1 has the Viewer role in Workspace1. Warehouse1 is also shared with User2, who has no role in Workspace1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **Workspace1** qui contient un entrepôt nommé **Warehouse1** et un lakehouse nommé **Lakehouse1**. User1 a le rôle Viewer dans Workspace1. Warehouse1 est aussi partagé avec User2, qui n'a aucun rôle dans Workspace1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: User1 can save a visual query of Warehouse1 in the My queries folder.
        fr: User1 peut enregistrer une requête visuelle de Warehouse1 dans le dossier Mes requêtes.
    - id: s2
      text:
        en: User2 can move a visual query of Warehouse1 to the Shared queries folder.
        fr: User2 peut déplacer une requête visuelle de Warehouse1 vers le dossier Requêtes partagées.
    - id: s3
      text:
        en: You can create a visual query in the SQL analytics endpoint of Lakehouse1.
        fr: Vous pouvez créer une requête visuelle dans le point de terminaison d'analytique SQL de Lakehouse1.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      All workspace users can save queries in My queries. Users with the Viewer workspace role and users with whom the warehouse is shared can't move queries to Shared queries. The visual query editor is available in a warehouse, a SQL analytics endpoint and a mirrored database.
    fr: |
      Tous les utilisateurs de l'espace de travail peuvent enregistrer des requêtes dans Mes requêtes. Les utilisateurs du rôle d'espace de travail Viewer et ceux avec qui l'entrepôt est partagé ne peuvent pas déplacer de requêtes vers Requêtes partagées. L'éditeur de requête visuel est disponible dans un entrepôt, un point de terminaison d'analytique SQL et une base de données mise en miroir.
references:
  - title: Query using the visual query editor
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/visual-query-editor
