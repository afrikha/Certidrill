id: dp600-2d-sql-window-functions
objective: "2.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a table named **dbo.FactOrder**. The table contains one row per order with the CustomerKey, OrderDate and OrderAmount columns.

    You are writing a query that returns every order and adds four columns. Each column uses the window clause `OVER (PARTITION BY CustomerKey ORDER BY OrderDate)`.

    Which function should you use for each column? To answer, drag the appropriate functions to the correct columns. Each function may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table nommée **dbo.FactOrder**. La table contient une ligne par commande avec les colonnes CustomerKey, OrderDate et OrderAmount.

    Vous écrivez une requête qui renvoie chaque commande et ajoute quatre colonnes. Chaque colonne utilise la clause de fenêtre `OVER (PARTITION BY CustomerKey ORDER BY OrderDate)`.

    Quelle fonction devez-vous utiliser pour chaque colonne ? Pour répondre, faites glisser les fonctions appropriées vers les colonnes correspondantes. Chaque fonction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rownum, text: "ROW_NUMBER()" }
    - { id: lag, text: "LAG(OrderAmount)" }
    - { id: lead, text: "LEAD(OrderAmount)" }
    - { id: sum, text: "SUM(OrderAmount)" }
    - { id: ntile, text: "NTILE(4)" }
    - { id: first, text: "FIRST_VALUE(OrderAmount)" }
  targets:
    - { id: seq, text: { en: "OrderSequence: 1 for the first order of the customer, 2 for the second, and so on", fr: "OrderSequence : 1 pour la première commande du client, 2 pour la deuxième, et ainsi de suite" } }
    - { id: prev, text: { en: "PreviousAmount: the amount of the customer's previous order", fr: "PreviousAmount : le montant de la commande précédente du client" } }
    - { id: next, text: { en: "NextAmount: the amount of the customer's next order", fr: "NextAmount : le montant de la commande suivante du client" } }
    - { id: cumul, text: { en: "CumulativeAmount: the total amount of the customer's orders up to the current order", fr: "CumulativeAmount : le montant total des commandes du client jusqu'à la commande actuelle" } }
answer:
  mapping: { seq: rownum, prev: lag, next: lead, cumul: sum }
explanation:
  correct:
    en: |
      ROW_NUMBER numbers the rows of each partition in the ORDER BY order. LAG returns a value from the previous row of the partition and LEAD from the next row. An aggregate such as SUM with ORDER BY in the OVER clause uses a frame from the first row to the current row by default, which gives a running total.
    fr: |
      ROW_NUMBER numérote les lignes de chaque partition selon l'ordre de ORDER BY. LAG renvoie une valeur de la ligne précédente de la partition et LEAD de la ligne suivante. Un agrégat comme SUM avec ORDER BY dans la clause OVER utilise par défaut un cadre allant de la première ligne à la ligne actuelle, ce qui donne un cumul.
  options:
    ntile: { en: "NTILE(4) splits the orders of each customer into four groups of nearly equal size.", fr: "NTILE(4) répartit les commandes de chaque client en quatre groupes de taille presque égale." }
    first: { en: "FIRST_VALUE returns the amount of the customer's first order on every row.", fr: "FIRST_VALUE renvoie le montant de la première commande du client sur chaque ligne." }
references:
  - title: SELECT - OVER clause (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-over-clause-transact-sql
  - title: Ranking Functions (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ranking-functions-transact-sql
