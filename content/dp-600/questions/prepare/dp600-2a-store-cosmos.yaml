id: dp600-2a-store-cosmos
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Developers at Contoso are building an AI application that stores a product catalog as JSON documents with a flexible schema. The application reads and writes individual documents through a NoSQL API from JavaScript and Python, and it uses vector search.

    The data must also be available in OneLake in an open table format for analytics, without building an ETL process.

    Which Fabric data store should you recommend?
  fr: |
    Les développeurs de Contoso créent une application d'IA qui stocke un catalogue de produits sous forme de documents JSON au schéma flexible. L'application lit et écrit des documents individuels via une API NoSQL depuis JavaScript et Python, et elle utilise la recherche vectorielle.

    Les données doivent aussi être disponibles dans OneLake dans un format de table ouvert pour l'analytique, sans construire de processus ETL.

    Quel magasin de données Fabric devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Cosmos DB in Fabric", fr: "Cosmos DB dans Fabric" } }
    - { id: b, text: { en: "SQL database in Fabric", fr: "Base de données SQL dans Fabric" } }
    - { id: c, text: { en: "An eventhouse", fr: "Un eventhouse" } }
    - { id: d, text: { en: "A lakehouse", fr: "Un lakehouse" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Cosmos DB in Fabric is the NoSQL database of Fabric, aimed at AI and application developers who work with documents through REST APIs and SDKs, and it supports AI scenarios with vector data. Like the other Fabric databases, its data is in OneLake in an open table format by default.
    fr: |
      Cosmos DB dans Fabric est la base de données NoSQL de Fabric, destinée aux développeurs d'IA et d'applications qui manipulent des documents via des API REST et des SDK, et elle prend en charge les scénarios d'IA avec des données vectorielles. Comme les autres bases de données Fabric, ses données sont dans OneLake dans un format de table ouvert par défaut.
  options:
    b:
      en: SQL database in Fabric also supports vectors, but it is a relational database accessed with T-SQL, not a document store with a NoSQL API.
      fr: La base de données SQL dans Fabric prend aussi en charge les vecteurs, mais c'est une base relationnelle interrogée en T-SQL, pas un magasin de documents doté d'une API NoSQL.
    c:
      en: An eventhouse analyzes streams of events with KQL; it is not an operational document store for an application.
      fr: Un eventhouse analyse des flux d'événements en KQL ; ce n'est pas un magasin de documents opérationnel pour une application.
    d:
      en: A lakehouse is for data engineering with Spark, not for low-latency reads and writes of individual documents by an application.
      fr: Un lakehouse sert à l'ingénierie des données avec Spark, pas aux lectures et écritures à faible latence de documents individuels par une application.
references:
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
