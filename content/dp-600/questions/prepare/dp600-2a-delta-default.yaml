id: dp600-2a-delta-default
objective: "2.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are designing a Fabric solution in which Spark notebooks, T-SQL queries and Direct Lake semantic models must read the same tables from OneLake.

    Which two items store their table data in OneLake in Delta format by default, without enabling any setting?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez une solution Fabric dans laquelle des notebooks Spark, des requêtes T-SQL et des modèles sémantiques Direct Lake doivent lire les mêmes tables depuis OneLake.

    Quels sont les deux éléments qui stockent par défaut les données de leurs tables dans OneLake au format Delta, sans activer aucun paramètre ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Eventhouse", fr: "Eventhouse" } }
    - { id: b, text: { en: "Warehouse", fr: "Entrepôt" } }
    - { id: c, text: { en: "Semantic model in Import mode", fr: "Modèle sémantique en mode Import" } }
    - { id: d, text: { en: "Lakehouse", fr: "Lakehouse" } }
    - { id: e, text: { en: "Eventstream", fr: "Flux d'événements (eventstream)" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Lakehouses and warehouses both store their tables as Delta tables in OneLake, so every Fabric engine can read them. Other stores need an option or don't keep tables of their own.
    fr: |
      Les lakehouses et les entrepôts stockent tous deux leurs tables sous forme de tables Delta dans OneLake : tous les moteurs Fabric peuvent donc les lire. Les autres magasins nécessitent une option ou ne conservent pas de tables propres.
  options:
    a:
      en: For an eventhouse, data in OneLake in Delta format is an opt-in (OneLake availability).
      fr: Pour un eventhouse, la présence des données dans OneLake au format Delta est facultative et s'active (disponibilité OneLake).
    c:
      en: An Import model keeps its data in its own storage; exporting Import tables to OneLake requires turning on OneLake integration.
      fr: Un modèle Import conserve ses données dans son propre stockage ; exporter les tables Import vers OneLake exige d'activer l'intégration OneLake.
    e:
      en: An eventstream routes events to destinations; it does not store tables itself.
      fr: Un flux d'événements achemine des événements vers des destinations ; il ne stocke pas de tables lui-même.
references:
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
