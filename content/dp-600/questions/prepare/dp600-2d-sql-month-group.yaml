id: dp600-2d-sql-month-group
objective: "2.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a table named **dbo.FactSales**. The OrderDate column uses the `date` data type.

    You need a query that returns one row per month with the total revenue of the month. The rows must be sorted in chronological order.

    How should you complete the T-SQL query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table nommée **dbo.FactSales**. La colonne OrderDate utilise le type de données `date`.

    Vous avez besoin d'une requête qui renvoie une ligne par mois avec le chiffre d'affaires total du mois. Les lignes doivent être triées dans l'ordre chronologique.

    Comment devez-vous compléter la requête T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT YEAR(OrderDate) AS OrderYear,
           MONTH(OrderDate) AS OrderMonth,
           SUM(SalesAmount) AS Revenue
    FROM dbo.FactSales
    GROUP BY [[grp]]
    ORDER BY [[ord]];
  slots:
    - id: grp
      options:
        - { id: alias, text: "OrderYear, OrderMonth" }
        - { id: expr, text: "YEAR(OrderDate), MONTH(OrderDate)" }
        - { id: date, text: OrderDate }
    - id: ord
      options:
        - { id: alias, text: "OrderYear, OrderMonth" }
        - { id: revenue, text: Revenue DESC }
        - { id: date, text: OrderDate }
answer:
  values: { grp: expr, ord: alias }
explanation:
  correct:
    en: |
      GROUP BY is processed before SELECT, so it must repeat the expressions `YEAR(OrderDate), MONTH(OrderDate)` instead of the aliases. ORDER BY is processed after SELECT, so it can use the OrderYear and OrderMonth aliases to sort the months chronologically.
    fr: |
      GROUP BY est traité avant SELECT : il doit répéter les expressions `YEAR(OrderDate), MONTH(OrderDate)` au lieu des alias. ORDER BY est traité après SELECT : il peut utiliser les alias OrderYear et OrderMonth pour trier les mois dans l'ordre chronologique.
  options:
    alias: { en: "In GROUP BY, the SELECT aliases aren't defined yet, so the query fails. In ORDER BY, they are valid.", fr: "Dans GROUP BY, les alias de SELECT ne sont pas encore définis : la requête échoue. Dans ORDER BY, ils sont valides." }
    date: { en: "Grouping by OrderDate returns one row per day; sorting by OrderDate fails because it isn't in the GROUP BY clause of the query.", fr: "Regrouper par OrderDate renvoie une ligne par jour ; trier par OrderDate échoue, car la colonne ne figure pas dans la clause GROUP BY de la requête." }
    revenue: { en: "Sorting by Revenue orders the months by amount, not chronologically.", fr: "Trier par Revenue ordonne les mois par montant, pas chronologiquement." }
references:
  - title: SELECT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-transact-sql
  - title: SELECT - GROUP BY clause (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-group-by-transact-sql
