stem:
  en: You use a LEFT OUTER JOIN, filter the dates in the WHERE clause and use COUNT(o.OrderKey).
  fr: Vous utilisez un LEFT OUTER JOIN, filtrez les dates dans la clause WHERE et utilisez COUNT(o.OrderKey).
body:
  solution:
    en: |
      You run the following query.

      ```sql
      SELECT c.CustomerKey, c.CustomerName, COUNT(o.OrderKey) AS Orders2026
      FROM dbo.DimCustomer AS c
      LEFT OUTER JOIN dbo.FactOrder AS o
          ON o.CustomerKey = c.CustomerKey
      WHERE o.OrderDate >= '2026-01-01' AND o.OrderDate < '2027-01-01'
      GROUP BY c.CustomerKey, c.CustomerName;
      ```
    fr: |
      Vous exécutez la requête suivante.

      ```sql
      SELECT c.CustomerKey, c.CustomerName, COUNT(o.OrderKey) AS Orders2026
      FROM dbo.DimCustomer AS c
      LEFT OUTER JOIN dbo.FactOrder AS o
          ON o.CustomerKey = c.CustomerKey
      WHERE o.OrderDate >= '2026-01-01' AND o.OrderDate < '2027-01-01'
      GROUP BY c.CustomerKey, c.CustomerName;
      ```
answer: { value: false }
explanation:
  correct:
    en: The WHERE clause is evaluated after the join. For a customer without any matching order, o.OrderDate is NULL, so the condition is not true and the row is removed; the same happens to customers whose orders are all outside 2026. The query therefore behaves like an inner join and omits every customer without a 2026 order instead of returning 0.
    fr: "La clause WHERE est évaluée après la jointure. Pour un client sans commande correspondante, o.OrderDate est NULL : la condition n'est pas vraie et la ligne est supprimée ; il en va de même pour les clients dont toutes les commandes sont hors de 2026. La requête se comporte donc comme une jointure interne et omet tous les clients sans commande en 2026 au lieu de renvoyer 0."
references:
