id: dp600-2a-ctas-from-lakehouse
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named LH_Silver and a warehouse named WH_Gold. LH_Silver contains a Delta table named dbo.Customers.

    SQL developers need a table named dbo.DimCustomer in WH_Gold that is created and loaded from LH_Silver.dbo.Customers. The load must be written in T-SQL inside a stored procedure of WH_Gold, and no additional item must be created.

    What should the stored procedure use?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH_Silver et un entrepôt nommé WH_Gold. LH_Silver contient une table Delta nommée dbo.Customers.

    Les développeurs SQL ont besoin dans WH_Gold d'une table nommée dbo.DimCustomer, créée et chargée à partir de LH_Silver.dbo.Customers. Le chargement doit être écrit en T-SQL dans une procédure stockée de WH_Gold, et aucun élément supplémentaire ne doit être créé.

    Qu'est-ce que la procédure stockée doit utiliser ?
body:
  options:
    - { id: a, text: { en: "A shortcut in WH_Gold that points to LH_Silver.dbo.Customers", fr: "Un raccourci dans WH_Gold qui pointe vers LH_Silver.dbo.Customers" } }
    - { id: b, text: { en: "An OPENROWSET query over the Parquet files of the Customers table folder", fr: "Une requête OPENROWSET sur les fichiers Parquet du dossier de la table Customers" } }
    - { id: c, text: { en: "A Dataflow Gen2 that loads LH_Silver.dbo.Customers into WH_Gold", fr: "Un Dataflow Gen2 qui charge LH_Silver.dbo.Customers dans WH_Gold" } }
    - { id: d, text: { en: "A CREATE TABLE AS SELECT statement that reads LH_Silver.dbo.Customers by using a three-part name", fr: "Une instruction CREATE TABLE AS SELECT qui lit LH_Silver.dbo.Customers à l'aide d'un nom en trois parties" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      T-SQL cross-warehouse ingestion loads data that is already in a warehouse, lakehouse or mirrored database of the same workspace by using INSERT...SELECT, SELECT INTO or CREATE TABLE AS SELECT (CTAS). A three-part name such as LH_Silver.dbo.Customers references the lakehouse table directly, so the procedure creates and loads DimCustomer without another item.
    fr: |
      L'ingestion T-SQL entre entrepôts charge des données déjà présentes dans un entrepôt, un lakehouse ou une base de données en miroir du même espace de travail avec INSERT...SELECT, SELECT INTO ou CREATE TABLE AS SELECT (CTAS). Un nom en trois parties comme LH_Silver.dbo.Customers référence directement la table du lakehouse : la procédure crée et charge DimCustomer sans autre élément.
  options:
    a:
      en: Shortcuts are created in lakehouses and KQL databases, not in a warehouse.
      fr: Les raccourcis se créent dans des lakehouses et des bases de données KQL, pas dans un entrepôt.
    b:
      en: OPENROWSET is meant for ad hoc reads of external files in ADLS Gen2 or Blob Storage; reading the Parquet files of a Delta table ignores its transaction log, and it is slower than querying the table.
      fr: OPENROWSET sert aux lectures ponctuelles de fichiers externes dans ADLS Gen2 ou le Stockage Blob ; lire les fichiers Parquet d'une table Delta ignore son journal des transactions, et c'est plus lent qu'une requête sur la table.
    c:
      en: A Dataflow Gen2 is an additional item written in Power Query, not T-SQL code inside the stored procedure.
      fr: Un Dataflow Gen2 est un élément supplémentaire écrit en Power Query, pas du code T-SQL dans la procédure stockée.
references:
  - title: Ingest data into the warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/ingest-data
