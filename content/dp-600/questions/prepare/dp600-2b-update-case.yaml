id: dp600-2b-update-case
objective: "2.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse named Warehouse1. You added a nullable column named Segment to dbo.DimCustomer.

    You need to set Segment to Enterprise for customers whose AnnualRevenue is at least 1,000,000, to Mid-market for customers whose AnnualRevenue is at least 100,000, and to SMB for all other customers.

    How should you complete the T-SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé Warehouse1. Vous avez ajouté une colonne acceptant les valeurs Null nommée Segment à dbo.DimCustomer.

    Vous devez définir Segment sur Enterprise pour les clients dont AnnualRevenue est d'au moins 1 000 000, sur Mid-market pour les clients dont AnnualRevenue est d'au moins 100 000, et sur SMB pour tous les autres clients.

    Comment devez-vous compléter l'instruction T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    UPDATE dbo.DimCustomer
    SET Segment = [[kw]]
            WHEN AnnualRevenue >= 1000000 THEN 'Enterprise'
            WHEN AnnualRevenue >= 100000 THEN 'Mid-market'
            ELSE 'SMB'
        [[end]];
  slots:
    - id: kw
      options:
        - { id: case, text: CASE }
        - { id: iif, text: IIF }
        - { id: choose, text: CHOOSE }
    - id: end
      options:
        - { id: endkw, text: END }
        - { id: endcase, text: END CASE }
        - { id: endif, text: ENDIF }
answer:
  values: { kw: case, end: endkw }
explanation:
  correct:
    en: |
      A searched CASE expression evaluates the WHEN conditions in order and returns the result of the first true one, or the ELSE value. In T-SQL, the expression starts with CASE and ends with END. The order of the WHEN clauses matters, so the highest threshold comes first.
    fr: |
      Une expression CASE de recherche évalue les conditions WHEN dans l'ordre et renvoie le résultat de la première condition vraie, ou la valeur ELSE. En T-SQL, l'expression commence par CASE et se termine par END. L'ordre des clauses WHEN compte : le seuil le plus élevé vient en premier.
  options:
    iif: { en: "IIF takes three arguments in parentheses; it doesn't use WHEN clauses.", fr: "IIF prend trois arguments entre parenthèses ; il n'utilise pas de clauses WHEN." }
    choose: { en: "CHOOSE returns an item from a list by its index; it doesn't use WHEN clauses.", fr: "CHOOSE renvoie un élément d'une liste selon son index ; il n'utilise pas de clauses WHEN." }
    endcase: { en: "END CASE is not T-SQL syntax; a CASE expression ends with END.", fr: "END CASE n'est pas une syntaxe T-SQL ; une expression CASE se termine par END." }
    endif: { en: "ENDIF is not T-SQL syntax.", fr: "ENDIF n'est pas une syntaxe T-SQL." }
references:
  - title: CASE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/case-transact-sql
