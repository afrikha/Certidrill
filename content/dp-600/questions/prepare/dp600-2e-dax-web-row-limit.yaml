id: dp600-2e-dax-web-row-limit
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named **Ops** that contains a semantic model named **InventoryModel**. You have the Contributor role in Ops, and the workspace setting that lets users edit data models in the Power BI service is enabled.

    You select **Write DAX queries** on InventoryModel in the Fabric portal and run a query that should return about 200,000 rows of three numeric columns (about 6 MB of data). The results grid shows fewer rows than expected.

    You need to see the complete result of the query in DAX query view. The query must not be split into several queries.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **Ops** qui contient un modèle sémantique nommé **InventoryModel**. Vous disposez du rôle Contributor dans Ops, et le paramètre d'espace de travail qui permet aux utilisateurs de modifier les modèles de données dans le service Power BI est activé.

    Vous sélectionnez **Écrire des requêtes DAX** sur InventoryModel dans le portail Fabric et exécutez une requête qui doit renvoyer environ 200 000 lignes de trois colonnes numériques (environ 6 Mo de données). La grille des résultats affiche moins de lignes que prévu.

    Vous devez voir le résultat complet de la requête dans la vue de requête DAX. La requête ne doit pas être divisée en plusieurs requêtes.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Wrap the query in TOPN with an N value of 200,000.", fr: "Encapsuler la requête dans TOPN avec une valeur N de 200 000." }
    - id: b
      text: { en: "Ask a workspace admin to assign you the Admin role in Ops.", fr: "Demander à un administrateur de l'espace de travail de vous attribuer le rôle Admin dans Ops." }
    - id: c
      text: { en: "Run the query in DAX query view of Power BI Desktop, connected live to InventoryModel.", fr: "Exécuter la requête dans la vue de requête DAX de Power BI Desktop, avec une connexion active à InventoryModel." }
    - id: d
      text: { en: "Remove the ORDER BY clause from the query.", fr: "Supprimer la clause ORDER BY de la requête." }
answer: { optionId: c }
explanation:
  correct:
    en: "DAX query view in the web returns at most 99,999 rows per query. In Power BI Desktop the limits are 15 MB of data and 1,000,000 values per query, so 200,000 rows of three columns (600,000 values, about 6 MB) are returned in full."
    fr: "La vue de requête DAX sur le web renvoie au maximum 99 999 lignes par requête. Dans Power BI Desktop, les limites sont de 15 Mo de données et de 1 000 000 de valeurs par requête : 200 000 lignes de trois colonnes (600 000 valeurs, environ 6 Mo) sont donc renvoyées en totalité."
  options:
    a:
      en: "TOPN only limits the rows of the result; the web limit of 99,999 rows still applies."
      fr: "TOPN ne fait que limiter les lignes du résultat ; la limite web de 99 999 lignes s'applique toujours."
    b:
      en: "The row limit of the web experience doesn't depend on the workspace role."
      fr: "La limite de lignes de l'expérience web ne dépend pas du rôle dans l'espace de travail."
    d:
      en: "ORDER BY only sorts the result; removing it doesn't change the maximum number of rows."
      fr: "ORDER BY ne fait que trier le résultat ; le supprimer ne change pas le nombre maximal de lignes."
references:
  - title: DAX Query View
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/dax-query-view
