id: dp600-2d-vqe-delete-rows
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a table named **dbo.Orders**. An analyst created a visual query that returns the obsolete rows of dbo.Orders by using a Filter rows step.

    You need to remove the obsolete rows from dbo.Orders.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table nommée **dbo.Orders**. Un analyste a créé une requête visuelle qui renvoie les lignes obsolètes de dbo.Orders à l'aide d'une étape Filtrer les lignes.

    Vous devez supprimer les lignes obsolètes de dbo.Orders.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a Remove rows step to the visual query, and then save the query.", fr: "Ajouter une étape Supprimer les lignes à la requête visuelle, puis enregistrer la requête." } }
    - { id: b, text: { en: "Save the visual query as a view, and then run the view.", fr: "Enregistrer la requête visuelle en tant que vue, puis exécuter la vue." } }
    - { id: c, text: { en: "In the SQL query editor of Warehouse1, run a DELETE statement with the same filter condition.", fr: "Dans l'éditeur de requête SQL de Warehouse1, exécuter une instruction DELETE avec la même condition de filtre." } }
    - { id: d, text: { en: "Invert the filter of the visual query, and then use Save as table with the name dbo.Orders.", fr: "Inverser le filtre de la requête visuelle, puis utiliser Enregistrer en tant que table avec le nom dbo.Orders." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The visual query editor supports only read-only SELECT queries, with no DML. Deleting rows requires a DELETE statement, which the SQL query editor of a warehouse supports.
    fr: |
      L'éditeur de requête visuel ne prend en charge que des requêtes SELECT en lecture seule, sans DML. Supprimer des lignes exige une instruction DELETE, que l'éditeur de requête SQL d'un entrepôt prend en charge.
  options:
    a: { en: "Steps of a visual query only shape the result of a SELECT; they never change the data of the table.", fr: "Les étapes d'une requête visuelle ne font que façonner le résultat d'un SELECT ; elles ne modifient jamais les données de la table." }
    b: { en: "A view only returns rows; querying it doesn't delete anything.", fr: "Une vue ne fait que renvoyer des lignes ; l'interroger ne supprime rien." }
    d: { en: "Save as table creates a new table with CREATE TABLE AS SELECT; it doesn't replace or modify an existing table.", fr: "Enregistrer en tant que table crée une nouvelle table avec CREATE TABLE AS SELECT ; il ne remplace ni ne modifie une table existante." }
references:
  - title: Query using the visual query editor
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/visual-query-editor
  - title: Query using the SQL query editor
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/sql-query-editor
