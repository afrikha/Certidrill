id: dp600-2d-qualify-rank
objective: "2.2.9"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a table named **dbo.ProductSales**. The table contains one row per product with the Category, ProductName and SalesAmount columns.

    You need to write a query that returns the best-selling products of each category. The query must meet the following requirements:

    - Products that have the same SalesAmount must all be returned or all be excluded.
    - A product must be excluded if three or more products of its category have a higher SalesAmount.
    - The query must not use a subquery or a common table expression.

    How should you complete the T-SQL query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table nommée **dbo.ProductSales**. La table contient une ligne par produit avec les colonnes Category, ProductName et SalesAmount.

    Vous devez écrire une requête qui renvoie les produits les plus vendus de chaque catégorie. La requête doit satisfaire aux exigences suivantes :

    - Les produits qui ont le même SalesAmount doivent tous être renvoyés ou tous être exclus.
    - Un produit doit être exclu si au moins trois produits de sa catégorie ont un SalesAmount supérieur.
    - La requête ne doit utiliser ni sous-requête ni expression de table commune.

    Comment devez-vous compléter la requête T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT Category, ProductName, SalesAmount
    FROM dbo.ProductSales
    [[clause]] [[fn]]() OVER (PARTITION BY Category ORDER BY SalesAmount DESC) <= 3;
  slots:
    - id: clause
      options:
        - { id: where, text: WHERE }
        - { id: having, text: HAVING }
        - { id: qualify, text: QUALIFY }
    - id: fn
      options:
        - { id: rownum, text: ROW_NUMBER }
        - { id: rank, text: RANK }
        - { id: dense, text: DENSE_RANK }
        - { id: ntile, text: NTILE }
answer:
  values: { clause: qualify, fn: rank }
explanation:
  correct:
    en: "`QUALIFY` filters rows on the result of a window function without a subquery; Fabric Data Warehouse supports it. `RANK` gives tied products the same rank and leaves a gap after them, so a product has a rank of 4 or more exactly when at least three products have higher sales. For sales of 100, 100, 90 and 80, RANK returns 1, 1, 3 and 4."
    fr: "`QUALIFY` filtre les lignes selon le résultat d'une fonction de fenêtre sans sous-requête ; Fabric Data Warehouse le prend en charge. `RANK` donne le même rang aux produits à égalité et laisse un trou après eux : un produit a un rang de 4 ou plus exactement quand au moins trois produits ont des ventes supérieures. Pour des ventes de 100, 100, 90 et 80, RANK renvoie 1, 1, 3 et 4."
  options:
    where: { en: "Window functions can't be used in a WHERE clause, which is evaluated before them.", fr: "Les fonctions de fenêtre ne peuvent pas figurer dans une clause WHERE, évaluée avant elles." }
    having: { en: "HAVING filters groups created by GROUP BY; it can't filter on a window function.", fr: "HAVING filtre les groupes créés par GROUP BY ; il ne peut pas filtrer sur une fonction de fenêtre." }
    rownum: { en: "ROW_NUMBER gives tied products different numbers, so a tie at the third position is split arbitrarily.", fr: "ROW_NUMBER donne des numéros différents aux produits à égalité : une égalité en troisième position est coupée arbitrairement." }
    dense: { en: "DENSE_RANK leaves no gap: for 100, 100, 90 and 80 it returns 1, 1, 2 and 3, so it keeps the product at 80 although three products sell more.", fr: "DENSE_RANK ne laisse pas de trou : pour 100, 100, 90 et 80, il renvoie 1, 1, 2 et 3, et conserve donc le produit à 80 alors que trois produits se vendent mieux." }
    ntile: { en: "NTILE splits the rows into buckets and requires the number of buckets as an argument.", fr: "NTILE répartit les lignes en groupes et exige le nombre de groupes en argument." }
references:
  - title: T-SQL Surface Area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
  - title: Ranking Functions (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/ranking-functions-transact-sql
