id: dp600-2d-null-not-equal
objective: "2.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a table named **dbo.Customer**. The table contains 10,000 rows. The Region column is `West` in 600 rows and NULL in 400 rows.

    You run the following query, and it returns 9,000 rows.

    ```sql
    SELECT CustomerKey, CustomerName, Region
    FROM dbo.Customer
    WHERE Region <> 'West';
    ```

    You need the query to return every customer except the customers in the West region, including the customers that have no region.

    Which WHERE clause should you use?
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table nommée **dbo.Customer**. La table contient 10 000 lignes. La colonne Region vaut `West` dans 600 lignes et NULL dans 400 lignes.

    Vous exécutez la requête suivante, qui renvoie 9 000 lignes.

    ```sql
    SELECT CustomerKey, CustomerName, Region
    FROM dbo.Customer
    WHERE Region <> 'West';
    ```

    La requête doit renvoyer tous les clients sauf ceux de la région West, y compris les clients sans région.

    Quelle clause WHERE devez-vous utiliser ?
body:
  options:
    - { id: a, text: "WHERE Region != 'West'" }
    - { id: b, text: "WHERE Region NOT IN ('West', NULL)" }
    - { id: c, text: "WHERE Region <> 'West' OR Region IS NULL" }
    - { id: d, text: "WHERE ISNULL(Region, 'West') <> 'West'" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A comparison with NULL returns UNKNOWN, and WHERE keeps only the rows for which the condition is TRUE, so `Region <> 'West'` drops the 400 rows without a region. Adding `OR Region IS NULL` makes the condition TRUE for those rows, and the query returns 9,400 rows.
    fr: |
      Une comparaison avec NULL renvoie UNKNOWN, et WHERE ne conserve que les lignes pour lesquelles la condition vaut TRUE : `Region <> 'West'` écarte les 400 lignes sans région. Ajouter `OR Region IS NULL` rend la condition vraie pour ces lignes, et la requête renvoie 9 400 lignes.
  options:
    a: { en: "!= is the same operator as <>, so the NULL rows are still excluded.", fr: "!= est le même opérateur que <> : les lignes NULL restent exclues." }
    b: { en: "NOT IN with a NULL in the list evaluates to UNKNOWN for every row, so the query returns no rows.", fr: "NOT IN avec un NULL dans la liste vaut UNKNOWN pour chaque ligne : la requête ne renvoie aucune ligne." }
    d: { en: "ISNULL replaces NULL with West, so the rows without a region are excluded again.", fr: "ISNULL remplace NULL par West : les lignes sans région sont de nouveau exclues." }
references:
  - title: NULL and UNKNOWN (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/null-and-unknown-transact-sql
