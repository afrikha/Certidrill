id: dp600-2d-vqe-merge-group
objective: "2.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains tables named **dbo.DimProduct** and **dbo.FactSales**. DimProduct contains the ProductKey and Category columns. FactSales contains the ProductKey and SalesAmount columns.

    You open a new visual query in Warehouse1. You need the query to return the total SalesAmount for each product category.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient des tables nommées **dbo.DimProduct** et **dbo.FactSales**. DimProduct contient les colonnes ProductKey et Category. FactSales contient les colonnes ProductKey et SalesAmount.

    Vous ouvrez une nouvelle requête visuelle dans Warehouse1. La requête doit renvoyer le total de SalesAmount pour chaque catégorie de produits.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: drag, text: { en: "Drag DimProduct and FactSales from Explorer to the canvas.", fr: "Faire glisser DimProduct et FactSales de l'Explorateur vers le canevas." } }
    - { id: merge, text: { en: "On DimProduct, select Merge queries as new, select ProductKey in both tables and the Inner join kind.", fr: "Sur DimProduct, sélectionner Fusionner des requêtes comme nouvelles, sélectionner ProductKey dans les deux tables et le type de jointure Interne." } }
    - { id: expand, text: { en: "Expand the FactSales column of the merged query and select SalesAmount.", fr: "Développer la colonne FactSales de la requête fusionnée et sélectionner SalesAmount." } }
    - { id: group, text: { en: "Use Group by on Category with the Sum operation on SalesAmount.", fr: "Utiliser Regrouper par sur Category avec l'opération Somme sur SalesAmount." } }
    - { id: append, text: { en: "On DimProduct, select Append queries as new and append FactSales.", fr: "Sur DimProduct, sélectionner Ajouter des requêtes comme nouvelles et ajouter FactSales." } }
    - { id: saveview, text: { en: "Save DimProduct as a view.", fr: "Enregistrer DimProduct en tant que vue." } }
answer:
  sequence: [ drag, merge, expand, group ]
explanation:
  correct:
    en: |
      The tables must be on the canvas before they can be merged. Merge queries as new joins them on ProductKey and adds a FactSales column that contains the matching rows, which you expand to get SalesAmount. Group by on Category with Sum then returns one row per category.
    fr: |
      Les tables doivent se trouver sur le canevas avant de pouvoir être fusionnées. Fusionner des requêtes comme nouvelles les joint sur ProductKey et ajoute une colonne FactSales qui contient les lignes correspondantes, que vous développez pour obtenir SalesAmount. Regrouper par sur Category avec Somme renvoie ensuite une ligne par catégorie.
  options:
    append: { en: "Append stacks the rows of the two tables instead of joining them on ProductKey.", fr: "L'ajout empile les lignes des deux tables au lieu de les joindre sur ProductKey." }
    saveview: { en: "Saving DimProduct as a view isn't needed to merge it with FactSales.", fr: "Enregistrer DimProduct en tant que vue n'est pas nécessaire pour le fusionner avec FactSales." }
references:
  - title: "Tutorial: Create a query with the visual query builder in a Warehouse"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tutorial-visual-query
