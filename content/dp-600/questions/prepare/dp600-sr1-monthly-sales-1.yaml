stem:
  en: You run CREATE TABLE AS SELECT grouped by product, year and month.
  fr: Vous exécutez CREATE TABLE AS SELECT avec un regroupement par produit, année et mois.
body:
  solution:
    en: |
      You run the following statement in WH-Sales.

      ```sql
      CREATE TABLE dbo.MonthlyProductSales
      AS
      SELECT ProductKey,
             YEAR(OrderDate) AS SalesYear,
             MONTH(OrderDate) AS SalesMonth,
             SUM(Quantity) AS TotalQuantity,
             SUM(SalesAmount) AS TotalSalesAmount
      FROM dbo.FactSales
      GROUP BY ProductKey, YEAR(OrderDate), MONTH(OrderDate);
      ```
    fr: |
      Vous exécutez l'instruction suivante dans WH-Sales.

      ```sql
      CREATE TABLE dbo.MonthlyProductSales
      AS
      SELECT ProductKey,
             YEAR(OrderDate) AS SalesYear,
             MONTH(OrderDate) AS SalesMonth,
             SUM(Quantity) AS TotalQuantity,
             SUM(SalesAmount) AS TotalSalesAmount
      FROM dbo.FactSales
      GROUP BY ProductKey, YEAR(OrderDate), MONTH(OrderDate);
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      `CREATE TABLE AS SELECT` creates a new table and fills it with the results of the query, so the totals are stored in WH-Sales. Grouping by `ProductKey`, `YEAR(OrderDate)` and `MONTH(OrderDate)` produces exactly one row per product and calendar month.
    fr: |
      `CREATE TABLE AS SELECT` crée une nouvelle table et la remplit avec les résultats de la requête : les totaux sont stockés dans WH-Sales. Le regroupement par `ProductKey`, `YEAR(OrderDate)` et `MONTH(OrderDate)` produit exactement une ligne par produit et par mois civil.
