id: dp600-cs3b-plant-batches
objective: "2.2.1"
type: single
caseStudy: dp600-cs3b-munsons
difficulty: 2
status: draft
stem:
  en: |
    You need to create dbo.PlantBatches in WH-Sales to meet requirement 1.

    Which type of object should you create?
  fr: |
    Vous devez créer dbo.PlantBatches dans WH-Sales pour satisfaire l'exigence 1.

    Quel type d'objet devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A view that filters the batches on PlantCode", fr: "Une vue qui filtre les lots sur PlantCode" } }
    - { id: b, text: { en: "A stored procedure that has a @PlantCode parameter", fr: "Une procédure stockée qui a un paramètre @PlantCode" } }
    - { id: c, text: { en: "A scalar function that has a @PlantCode parameter", fr: "Une fonction scalaire qui a un paramètre @PlantCode" } }
    - { id: d, text: { en: "An inline table-valued function that has a @PlantCode parameter", fr: "Une fonction table inline qui a un paramètre @PlantCode" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An inline table-valued function accepts parameters and returns a table, so it can be referenced in the FROM clause and joined like a table, as in the plant managers' query. Fabric Data Warehouse supports T-SQL views, stored procedures and functions.
    fr: |
      Une fonction table inline accepte des paramètres et renvoie une table : elle peut donc être référencée dans la clause FROM et jointe comme une table, comme dans la requête des responsables d'usine. Fabric Data Warehouse prend en charge les vues, les procédures stockées et les fonctions T-SQL.
  options:
    a: { en: "A view cannot take parameters, so dbo.PlantBatches('TOR1') cannot be a view.", fr: "Une vue ne peut pas recevoir de paramètres : dbo.PlantBatches('TOR1') ne peut donc pas être une vue." }
    b: { en: "A stored procedure is run with EXEC and cannot be used in the FROM clause or in a join.", fr: "Une procédure stockée s'exécute avec EXEC et ne peut pas être utilisée dans la clause FROM ni dans une jointure." }
    c: { en: "A scalar function returns a single value, not a set of rows that can be joined.", fr: "Une fonction scalaire renvoie une seule valeur, pas un ensemble de lignes qui peut être joint." }
references:
  - title: T-SQL Surface Area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
