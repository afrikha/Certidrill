id: dp600-2b-identity-definition
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are creating a dimension table named dbo.DimCustomer in a Fabric warehouse named Warehouse1. The table must have a surrogate key named CustomerKey whose values are generated automatically when rows are inserted.

    Which column definition should you use?
  fr: |
    Vous créez une table de dimension nommée dbo.DimCustomer dans un entrepôt Fabric nommé Warehouse1. La table doit avoir une clé de substitution nommée CustomerKey dont les valeurs sont générées automatiquement à l'insertion des lignes.

    Quelle définition de colonne devez-vous utiliser ?
body:
  options:
    - { id: a, text: "CustomerKey int IDENTITY(1,1) NOT NULL" }
    - { id: b, text: "CustomerKey bigint IDENTITY(1,1) NOT NULL" }
    - { id: c, text: "CustomerKey bigint IDENTITY" }
    - { id: d, text: "CustomerKey uniqueidentifier DEFAULT NEWID()" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In Fabric Data Warehouse, an IDENTITY column must use the bigint data type, and you can't specify a seed or an increment; the system manages the values, which are unique for the lifetime of the table.
    fr: |
      Dans Fabric Data Warehouse, une colonne IDENTITY doit utiliser le type de données bigint, et vous ne pouvez spécifier ni valeur de départ ni incrément ; le système gère les valeurs, qui sont uniques pendant toute la durée de vie de la table.
  options:
    a:
      en: |
        Only bigint is supported for IDENTITY columns, and seed and increment can't be specified.
      fr: |
        Seul bigint est pris en charge pour les colonnes IDENTITY, et la valeur de départ et l'incrément ne peuvent pas être spécifiés.
    b:
      en: |
        The type is correct, but a seed and an increment can't be specified.
      fr: |
        Le type est correct, mais une valeur de départ et un incrément ne peuvent pas être spécifiés.
    d:
      en: |
        DEFAULT constraints are not supported in Fabric Data Warehouse, and a GUID makes a wide, random key.
      fr: |
        Les contraintes DEFAULT ne sont pas prises en charge dans Fabric Data Warehouse, et un GUID donne une clé large et aléatoire.
references:
  - title: IDENTITY Columns in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/identity
