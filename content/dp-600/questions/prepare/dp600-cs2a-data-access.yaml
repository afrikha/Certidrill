id: dp600-cs2a-data-access
objective: "2.1.3"
type: dragdrop
caseStudy: dp600-cs2a-coho-vineyard
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the data access requirements for the soil readings, the weather forecasts and the purchase contracts.

    What should you use for each data set? To answer, drag the appropriate solutions to the correct data sets. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter les exigences d'accès aux données pour les relevés de sol, les prévisions météo et les contrats d'achat.

    Que devez-vous utiliser pour chaque jeu de données ? Pour répondre, faites glisser les solutions appropriées vers les jeux de données correspondants. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: onelake
      text: { en: "Turn on OneLake availability for SoilReadings, and then create a OneLake shortcut in LH-Vineyard", fr: "Activer la disponibilité OneLake pour SoilReadings, puis créer un raccourci OneLake dans LH-Vineyard" }
    - id: eventstream
      text: { en: "Add LH-Vineyard as a second destination of the eventstream", fr: "Ajouter LH-Vineyard comme seconde destination du flux d'événements" }
    - id: adls
      text: { en: "Create an Azure Data Lake Storage Gen2 shortcut in the Tables folder of LH-Vineyard", fr: "Créer un raccourci Azure Data Lake Storage Gen2 dans le dossier Tables de LH-Vineyard" }
    - id: copyjob
      text: { en: "Create a copy job that copies the files to the Files folder of LH-Vineyard", fr: "Créer une tâche de copie qui copie les fichiers dans le dossier Files de LH-Vineyard" }
    - id: dataflow
      text: { en: "Create a Dataflow Gen2 that has LH-Vineyard as its data destination", fr: "Créer un Dataflow Gen2 dont la destination des données est LH-Vineyard" }
  targets:
    - id: soil
      text: { en: "Soil readings", fr: "Relevés de sol" }
    - id: weather
      text: { en: "Weather forecasts", fr: "Prévisions météo" }
    - id: contracts
      text: { en: "Purchase contracts", fr: "Contrats d'achat" }
answer:
  mapping: { soil: onelake, weather: adls, contracts: dataflow }
explanation:
  correct:
    en: "OneLake availability writes the data of a KQL table to OneLake in Delta format with no second ingestion, and a OneLake shortcut in LH-Vineyard then exposes it to notebooks and to the SQL analytics endpoint. An ADLS Gen2 shortcut created in the Tables folder points to the partner's Delta tables without copying them, and the lakehouse recognizes them as tables. A Dataflow Gen2 uses Power Query, a low-code visual tool, to remove the empty rows and convert the column types before it writes to a lakehouse destination."
    fr: "La disponibilité OneLake écrit les données d'une table KQL dans OneLake au format Delta sans seconde ingestion, puis un raccourci OneLake dans LH-Vineyard les expose aux notebooks et au point de terminaison d'analytique SQL. Un raccourci ADLS Gen2 créé dans le dossier Tables pointe vers les tables Delta du partenaire sans les copier, et le lakehouse les reconnaît comme des tables. Un Dataflow Gen2 utilise Power Query, un outil visuel low-code, pour supprimer les lignes vides et convertir les types de colonnes avant d'écrire dans une destination lakehouse."
  options:
    eventstream:
      en: "A second eventstream destination ingests the soil readings a second time, which requirement 1 forbids."
      fr: "Une seconde destination du flux d'événements ingère les relevés de sol une seconde fois, ce que l'exigence 1 interdit."
    copyjob:
      en: "A copy job copies the data, which requirement 2 forbids for the forecasts, and it cannot remove empty rows or convert column types for the contracts."
      fr: "Une tâche de copie copie les données, ce que l'exigence 2 interdit pour les prévisions, et elle ne peut ni supprimer les lignes vides ni convertir les types de colonnes des contrats."
references:
  - title: Turn on OneLake availability for an eventhouse
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-house-onelake-availability
  - title: Unify Data Sources With OneLake Shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
