id: dp600-2d-wh-unsupported-types
objective: "2.2.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a warehouse named **Warehouse1**. You are migrating a table from an on-premises SQL Server database to Warehouse1.

    You write a `CREATE TABLE` statement for **dbo.Shipment** in Warehouse1 that keeps the original column data types. The statement contains the following column definitions: ShipmentId `uniqueidentifier`, ShippedAt `datetimeoffset`, Weight `decimal(9,3)`, PackageCount `tinyint`, Notes `varchar(max)`, and DeliveredAt `datetime2(6)`.

    Which two column definitions cause the statement to fail?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un entrepôt nommé **Warehouse1**. Vous migrez une table d'une base de données SQL Server locale vers Warehouse1.

    Vous écrivez une instruction `CREATE TABLE` pour **dbo.Shipment** dans Warehouse1 qui conserve les types de données d'origine des colonnes. L'instruction contient les définitions de colonnes suivantes : ShipmentId `uniqueidentifier`, ShippedAt `datetimeoffset`, Weight `decimal(9,3)`, PackageCount `tinyint`, Notes `varchar(max)` et DeliveredAt `datetime2(6)`.

    Quelles sont les deux définitions de colonnes qui font échouer l'instruction ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "ShipmentId uniqueidentifier" }
    - { id: b, text: "ShippedAt datetimeoffset" }
    - { id: c, text: "Weight decimal(9,3)" }
    - { id: d, text: "PackageCount tinyint" }
    - { id: e, text: "Notes varchar(max)" }
    - { id: f, text: "DeliveredAt datetime2(6)" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Warehouse tables accept only a subset of the SQL Server data types. `datetimeoffset` isn't supported in tables (use `datetime2`, and keep `datetimeoffset` for conversions with `AT TIME ZONE` in queries), and `tinyint` isn't supported (use `smallint`).
    fr: |
      Les tables d'un entrepôt n'acceptent qu'une partie des types de données de SQL Server. `datetimeoffset` n'est pas pris en charge dans les tables (utilisez `datetime2` et réservez `datetimeoffset` aux conversions avec `AT TIME ZONE` dans les requêtes), et `tinyint` n'est pas pris en charge (utilisez `smallint`).
  options:
    a: { en: "uniqueidentifier is supported in warehouse tables; it is stored as binary because Delta Parquet has no GUID type.", fr: "uniqueidentifier est pris en charge dans les tables de l'entrepôt ; il est stocké en binaire, car Delta Parquet n'a pas de type GUID." }
    c: { en: "decimal is a supported exact numeric type.", fr: "decimal est un type numérique exact pris en charge." }
    e: { en: "varchar(max) is supported, with a storage limit of 16 MB per value.", fr: "varchar(max) est pris en charge, avec une limite de stockage de 16 Mo par valeur." }
    f: { en: "datetime2 is supported with up to 6 digits of fractional seconds, so datetime2(6) is valid.", fr: "datetime2 est pris en charge avec jusqu'à 6 chiffres de fractions de seconde : datetime2(6) est valide." }
references:
  - title: Data Types in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-types
