id: dp600-2b-dimension-design
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are building a star schema in a Fabric warehouse named Warehouse1 from an ERP system. The ERP stores products in three normalized tables: Product, ProductSubcategory and ProductCategory. Its ProductID values are reused when a product is discontinued. Direct Lake semantic models will use a Category > Subcategory > Product hierarchy.

    You need to design the product dimension and its link to dbo.FactSales.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un schéma en étoile dans un entrepôt Fabric nommé Warehouse1 à partir d'un ERP. L'ERP stocke les produits dans trois tables normalisées : Product, ProductSubcategory et ProductCategory. Ses valeurs ProductID sont réutilisées quand un produit est abandonné. Des modèles sémantiques Direct Lake utiliseront une hiérarchie Category > Subcategory > Product.

    Vous devez concevoir la dimension produit et son lien avec dbo.FactSales.

    Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create one DimProduct table that includes the subcategory and category attributes.", fr: "Créer une seule table DimProduct qui inclut les attributs de sous-catégorie et de catégorie." } }
    - { id: b, text: { en: "Create DimProduct, DimProductSubcategory and DimProductCategory tables, and relate only DimProduct to dbo.FactSales.", fr: "Créer les tables DimProduct, DimProductSubcategory et DimProductCategory, et relier seulement DimProduct à dbo.FactSales." } }
    - { id: c, text: { en: "Store the ERP ProductID in dbo.FactSales as the product key.", fr: "Stocker le ProductID de l'ERP dans dbo.FactSales comme clé de produit." } }
    - { id: d, text: { en: "Add a surrogate key to DimProduct and store it in dbo.FactSales.", fr: "Ajouter une clé de substitution à DimProduct et la stocker dans dbo.FactSales." } }
    - { id: e, text: { en: "Add an enforced primary key on ProductID to reject reused values.", fr: "Ajouter une clé primaire appliquée sur ProductID pour rejeter les valeurs réutilisées." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Dimension tables should almost always be denormalized, and a semantic model hierarchy can only use columns of a single table, so the category and subcategory attributes belong in DimProduct. A surrogate key insulates the warehouse from source key changes such as reused ProductID values, and the fact table stores that key.
    fr: |
      Les tables de dimension doivent presque toujours être dénormalisées, et une hiérarchie de modèle sémantique ne peut utiliser que les colonnes d'une seule table : les attributs de catégorie et de sous-catégorie ont leur place dans DimProduct. Une clé de substitution isole l'entrepôt des changements de clés de la source, comme des valeurs ProductID réutilisées, et la table de faits stocke cette clé.
  options:
    b:
      en: |
        A snowflake design spreads the hierarchy over three tables, which a semantic model hierarchy can't use without a denormalizing view.
      fr: |
        Un schéma en flocon répartit la hiérarchie sur trois tables, qu'une hiérarchie de modèle sémantique ne peut pas utiliser sans vue de dénormalisation.
    c:
      en: |
        Reused ProductID values would attach old sales to new products; facts should store the surrogate key.
      fr: |
        Des valeurs ProductID réutilisées rattacheraient d'anciennes ventes à de nouveaux produits ; les faits doivent stocker la clé de substitution.
    e:
      en: |
        Fabric Data Warehouse supports primary keys only as NOT ENFORCED, so they reject nothing.
      fr: |
        Fabric Data Warehouse ne prend en charge les clés primaires qu'en NOT ENFORCED : elles ne rejettent rien.
references:
  - title: Modeling Dimension Tables in Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
