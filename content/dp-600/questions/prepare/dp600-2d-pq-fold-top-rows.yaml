id: dp600-2d-pq-fold-top-rows
objective: "2.2.9"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Dataflow Gen2 named **Dataflow1**. You are creating a query that reads a table named **dbo.FactSale** from an Azure SQL database. FactSale contains several million rows.

    You need the query to return only the 10 most recent sales based on the SaleDate column. The entire query must be folded to the data source so that only 10 rows are transferred.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un Dataflow Gen2 nommé **Dataflow1**. Vous créez une requête qui lit une table nommée **dbo.FactSale** dans une base de données Azure SQL. FactSale contient plusieurs millions de lignes.

    La requête ne doit renvoyer que les 10 ventes les plus récentes selon la colonne SaleDate. Toute la requête doit être repliée vers la source de données pour que seules 10 lignes soient transférées.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: conn, text: { en: "Connect to the database and navigate to dbo.FactSale.", fr: "Se connecter à la base de données et accéder à dbo.FactSale." } }
    - { id: sortasc, text: { en: "Sort the SaleDate column in ascending order.", fr: "Trier la colonne SaleDate dans l'ordre croissant." } }
    - { id: sortdesc, text: { en: "Sort the SaleDate column in descending order.", fr: "Trier la colonne SaleDate dans l'ordre décroissant." } }
    - { id: bottom, text: { en: "Use Keep bottom rows and enter 10.", fr: "Utiliser Conserver les dernières lignes et saisir 10." } }
    - { id: top, text: { en: "Use Keep top rows and enter 10.", fr: "Utiliser Conserver les premières lignes et saisir 10." } }
    - { id: index, text: { en: "Add an index column that starts from 1.", fr: "Ajouter une colonne d'index qui commence à 1." } }
answer:
  sequence: [ conn, sortdesc, top ]
explanation:
  correct:
    en: |
      Sorting in descending order and then keeping the top 10 rows translates to a `TOP` query with `ORDER BY ... DESC`, so the source returns only 10 rows. T-SQL has no clause for bottom rows, so Keep bottom rows can't fold and forces Power Query to download every row first.
    fr: |
      Trier dans l'ordre décroissant puis conserver les 10 premières lignes se traduit par une requête `TOP` avec `ORDER BY ... DESC` : la source ne renvoie que 10 lignes. T-SQL n'a pas de clause pour les dernières lignes : Conserver les dernières lignes ne peut pas être replié et oblige Power Query à télécharger d'abord toutes les lignes.
  options:
    sortasc: { en: "An ascending sort puts the oldest sales first, so it would need Keep bottom rows, which doesn't fold.", fr: "Un tri croissant place les ventes les plus anciennes en premier : il faudrait Conserver les dernières lignes, qui n'est pas replié." }
    bottom: { en: "Keep bottom rows can't be translated to T-SQL, so the query no longer folds.", fr: "Conserver les dernières lignes ne peut pas être traduit en T-SQL : la requête n'est plus repliée." }
    index: { en: "An index column isn't needed to keep the first rows of a sorted table.", fr: "Une colonne d'index n'est pas nécessaire pour conserver les premières lignes d'une table triée." }
references:
  - title: Query folding examples in Power Query
    url: https://learn.microsoft.com/en-us/power-query/query-folding-examples
