id: dp600-2d-vqe-which-tool
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a warehouse named **Warehouse1**. Warehouse1 contains tables named **dbo.FactSale** and **dbo.DimCity**.

    A business analyst named User1 needs to join the two tables and calculate the total sales by city in the Fabric portal. User1 doesn't know T-SQL. The solution must not require User1 to write any code.

    Which tool should User1 use?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un entrepôt nommé **Warehouse1**. Warehouse1 contient des tables nommées **dbo.FactSale** et **dbo.DimCity**.

    Un analyste métier nommé User1 doit joindre les deux tables et calculer le total des ventes par ville dans le portail Fabric. User1 ne connaît pas T-SQL. La solution ne doit pas obliger User1 à écrire du code.

    Quel outil User1 doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "The SQL query editor of Warehouse1", fr: "L'éditeur de requête SQL de Warehouse1" } }
    - { id: b, text: { en: "The visual query editor of Warehouse1", fr: "L'éditeur de requête visuel de Warehouse1" } }
    - { id: c, text: { en: "A KQL queryset", fr: "Un ensemble de requêtes KQL" } }
    - { id: d, text: { en: "The DAX query view of a semantic model", fr: "La vue de requête DAX d'un modèle sémantique" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The visual query editor is a no-code interface over a warehouse. It uses the Power Query diagram view, so User1 can drag the two tables to the canvas, merge them and group the result without writing T-SQL.
    fr: |
      L'éditeur de requête visuel est une interface sans code au-dessus d'un entrepôt. Il utilise la vue de diagramme de Power Query : User1 peut faire glisser les deux tables sur le canevas, les fusionner et regrouper le résultat sans écrire de T-SQL.
  options:
    a: { en: "The SQL query editor requires writing T-SQL statements.", fr: "L'éditeur de requête SQL exige d'écrire des instructions T-SQL." }
    c: { en: "A KQL queryset queries KQL databases with KQL code, not warehouse tables without code.", fr: "Un ensemble de requêtes KQL interroge des bases de données KQL avec du code KQL, pas des tables d'entrepôt sans code." }
    d: { en: "The DAX query view requires writing DAX queries against a semantic model.", fr: "La vue de requête DAX exige d'écrire des requêtes DAX sur un modèle sémantique." }
references:
  - title: Query using the visual query editor
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/visual-query-editor
