id: dp600-2e-kql-whole-word
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace that contains an eventhouse named **Eventhouse1**. Eventhouse1 contains a KQL database named **OpsDB** that has a table named **AppLogs**.

    The **Message** column of AppLogs contains values such as `Payment Timeout on gateway PG7`, `timeout while reading queue Q2` and `Retry timeouts exceeded`.

    You need a KQL query that returns the rows in which Message contains the word **timeout** as a whole word, in any case. The rows that contain only `timeouts` must not be returned. The solution must minimize query execution time.

    Which filter should you use?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un eventhouse nommé **Eventhouse1**. Eventhouse1 contient une base de données KQL nommée **OpsDB** qui possède une table nommée **AppLogs**.

    La colonne **Message** d'AppLogs contient des valeurs comme `Payment Timeout on gateway PG7`, `timeout while reading queue Q2` et `Retry timeouts exceeded`.

    Vous avez besoin d'une requête KQL qui renvoie les lignes dont Message contient le mot **timeout** en tant que mot entier, quelle que soit la casse. Les lignes qui contiennent uniquement `timeouts` ne doivent pas être renvoyées. La solution doit réduire au minimum le temps d'exécution de la requête.

    Quel filtre devez-vous utiliser ?
body:
  options:
    - { id: a, text: "| where Message contains \"timeout\"" }
    - { id: b, text: "| where Message has_cs \"timeout\"" }
    - { id: c, text: "| where Message has \"timeout\"" }
    - { id: d, text: "| where Message =~ \"timeout\"" }
answer: { optionId: c }
explanation:
  correct:
    en: "`has` is case-insensitive and matches the right-hand value only as a whole term, so `Payment Timeout on gateway PG7` and `timeout while reading queue Q2` match, but `Retry timeouts exceeded` does not. Because `has` is term-based, Kusto can use its term index for terms of three characters or more, which makes it faster than a substring search."
    fr: "`has` ne respecte pas la casse et ne trouve la valeur de droite qu'en tant que terme entier : `Payment Timeout on gateway PG7` et `timeout while reading queue Q2` correspondent, mais pas `Retry timeouts exceeded`. Comme `has` repose sur les termes, Kusto peut utiliser son index de termes pour les termes de trois caractères ou plus, ce qui le rend plus rapide qu'une recherche de sous-chaîne."
  options:
    a:
      en: "`contains` searches for a substring, so it also returns `Retry timeouts exceeded`, and it scans the values instead of using the term index."
      fr: "`contains` recherche une sous-chaîne : il renvoie aussi `Retry timeouts exceeded` et parcourt les valeurs au lieu d'utiliser l'index de termes."
    b:
      en: "`has_cs` is case-sensitive, so it misses `Payment Timeout on gateway PG7`."
      fr: "`has_cs` respecte la casse : il ne trouve pas `Payment Timeout on gateway PG7`."
    d:
      en: "`=~` compares the whole value with `timeout`, so none of the sample messages match."
      fr: "`=~` compare la valeur entière à `timeout` : aucun des messages d'exemple ne correspond."
references:
  - title: String operators
    url: https://learn.microsoft.com/en-us/kusto/query/datatypes-string-operators
