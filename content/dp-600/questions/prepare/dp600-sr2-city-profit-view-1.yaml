seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You build a visual query and save it as a view.
  fr: Vous créez une requête visuelle et l'enregistrez en tant que vue.
body:
  solution:
    en: |
      In WH-Retail, Lena selects **New visual query** and drags dbo.DimCity and dbo.FactSale to the canvas. She performs the following actions:

      1. Select **Combine** > **Merge queries as new**, join the two tables on CityKey with the **Inner** join kind, and expand the Profit column.
      2. Select **Transform** > **Group by**, group by City and add a **Sum** aggregation of Profit.
      3. Select **Save as view** and name the view **dbo.vCityProfit**.
    fr: |
      Dans WH-Retail, Lena sélectionne **Nouvelle requête visuelle** et fait glisser dbo.DimCity et dbo.FactSale sur le canevas. Elle effectue les actions suivantes :

      1. Sélectionner **Combiner** > **Fusionner des requêtes comme nouvelles**, joindre les deux tables sur CityKey avec le type de jointure **Interne**, puis développer la colonne Profit.
      2. Sélectionner **Transformer** > **Regrouper par**, regrouper par City et ajouter une agrégation **Somme** de Profit.
      3. Sélectionner **Enregistrer en tant que vue** et nommer la vue **dbo.vCityProfit**.
answer: { value: true }
explanation:
  correct:
    en: The visual query editor builds the merge and the Group by step without code, and both steps fold to T-SQL. Save as view creates a view in WH-Retail that other analysts can query with T-SQL, and a view runs its SELECT against the current rows every time it is queried, so no reload is needed.
    fr: "L'éditeur de requête visuel crée la fusion et l'étape Regrouper par sans code, et les deux étapes se replient en T-SQL. Enregistrer en tant que vue crée dans WH-Retail une vue que les autres analystes peuvent interroger en T-SQL, et une vue exécute son SELECT sur les lignes actuelles à chaque requête : aucun rechargement n'est nécessaire."
