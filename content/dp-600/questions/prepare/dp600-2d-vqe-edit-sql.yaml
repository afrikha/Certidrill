id: dp600-2d-vqe-edit-sql
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1**. An analyst created a visual query in Warehouse1 that merges three tables, filters the rows and groups the result by store.

    You need to add a column that ranks the stores by total sales by using the RANK function. The visual query editor doesn't offer this operation. The solution must reuse the logic of the visual query and minimize development effort.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1**. Un analyste a créé dans Warehouse1 une requête visuelle qui fusionne trois tables, filtre les lignes et regroupe le résultat par magasin.

    Vous devez ajouter une colonne qui classe les magasins selon le total des ventes à l'aide de la fonction RANK. L'éditeur de requête visuel ne propose pas cette opération. La solution doit réutiliser la logique de la requête visuelle et réduire au minimum l'effort de développement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Select View SQL, select Edit SQL script, and add the RANK function to the generated script.", fr: "Sélectionner Afficher le SQL, sélectionner Modifier le script SQL et ajouter la fonction RANK au script généré." } }
    - { id: b, text: { en: "Select Save as table, and then create a new visual query over the new table.", fr: "Sélectionner Enregistrer en tant que table, puis créer une nouvelle requête visuelle sur la nouvelle table." } }
    - { id: c, text: { en: "Select Download Excel file, and then calculate the rank in Excel.", fr: "Sélectionner Télécharger le fichier Excel, puis calculer le rang dans Excel." } }
    - { id: d, text: { en: "Open a new SQL query, and then write the joins, filters and grouping again with the RANK function.", fr: "Ouvrir une nouvelle requête SQL, puis réécrire les jointures, les filtres et le regroupement avec la fonction RANK." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      View SQL shows the T-SQL generated from the applied steps, and Edit SQL script opens that script in the SQL query editor. You keep the joins, filters and grouping and only add the RANK window function.
    fr: |
      Afficher le SQL montre le T-SQL généré à partir des étapes appliquées, et Modifier le script SQL ouvre ce script dans l'éditeur de requête SQL. Vous conservez les jointures, les filtres et le regroupement et vous ajoutez seulement la fonction de fenêtre RANK.
  options:
    b: { en: "A new visual query over the table still can't use the RANK function, and the table is a copy that must be maintained.", fr: "Une nouvelle requête visuelle sur la table ne peut toujours pas utiliser la fonction RANK, et la table est une copie à maintenir." }
    c: { en: "The rank would be calculated outside Fabric and couldn't be reused by other queries.", fr: "Le rang serait calculé hors de Fabric et ne pourrait pas être réutilisé par d'autres requêtes." }
    d: { en: "Rewriting the whole query doesn't reuse the existing logic and requires more effort.", fr: "Réécrire toute la requête ne réutilise pas la logique existante et demande plus d'effort." }
references:
  - title: Query using the visual query editor
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/visual-query-editor
