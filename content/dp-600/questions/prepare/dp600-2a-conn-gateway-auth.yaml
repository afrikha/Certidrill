id: dp600-2a-conn-gateway-auth
objective: "2.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You need to create two connections in Manage connections and gateways:

    - ConnA for a SQL Server instance named SQLPROD01 in your datacenter. SQLPROD01 is not reachable from the internet. An on-premises data gateway is installed in the datacenter.
    - ConnB for an Azure SQL database named sqldb-hr that accepts connections from the internet. ConnB must authenticate by using an app registration and its client secret.

    How should you configure the connections? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer deux connexions dans Gérer les connexions et les passerelles :

    - ConnA pour une instance SQL Server nommée SQLPROD01 dans votre centre de données. SQLPROD01 n'est pas accessible depuis Internet. Une passerelle de données locale est installée dans le centre de données.
    - ConnB pour une base de données Azure SQL nommée sqldb-hr qui accepte les connexions depuis Internet. ConnB doit s'authentifier avec une inscription d'application et sa clé secrète client.

    Comment devez-vous configurer les connexions ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Type of connection for ConnA: [[ga]]
      Type of connection for ConnB: [[gb]]
      Authentication method for ConnB: [[auth]]
    fr: |
      Type de connexion pour ConnA : [[ga]]
      Type de connexion pour ConnB : [[gb]]
      Méthode d'authentification pour ConnB : [[auth]]
  slots:
    - id: ga
      options:
        - { id: cloud, text: Cloud }
        - { id: onprem, text: { en: "On-premises (through the data gateway)", fr: "Local (via la passerelle de données)" } }
        - { id: vnet, text: { en: "Virtual network (through a VNet data gateway)", fr: "Réseau virtuel (via une passerelle de données de réseau virtuel)" } }
    - id: gb
      options:
        - { id: cloud, text: Cloud }
        - { id: onprem, text: { en: "On-premises (through the data gateway)", fr: "Local (via la passerelle de données)" } }
        - { id: vnet, text: { en: "Virtual network (through a VNet data gateway)", fr: "Réseau virtuel (via une passerelle de données de réseau virtuel)" } }
    - id: auth
      options:
        - { id: basic, text: Basic }
        - { id: oauth, text: OAuth2 }
        - { id: sp, text: Service Principal }
answer:
  values: { ga: onprem, gb: cloud, auth: sp }
explanation:
  correct:
    en: |
      A source that is reachable only inside the datacenter needs a connection that runs through the on-premises data gateway. A source reachable from the internet uses a cloud connection. An app registration with a client secret is a service principal, so ConnB uses the Service Principal authentication method.
    fr: |
      Une source accessible uniquement dans le centre de données nécessite une connexion qui passe par la passerelle de données locale. Une source accessible depuis Internet utilise une connexion cloud. Une inscription d'application avec une clé secrète client est un principal de service : ConnB utilise donc la méthode d'authentification Service Principal.
  options:
    vnet: { en: "A VNet data gateway reaches Azure resources in a virtual network, not a server in your datacenter, and it is not needed for a public endpoint.", fr: "Une passerelle de données de réseau virtuel atteint des ressources Azure dans un réseau virtuel, pas un serveur de votre centre de données, et elle n'est pas nécessaire pour un point de terminaison public." }
    basic: { en: "Basic uses a user name and a password, not an app registration.", fr: "Basic utilise un nom d'utilisateur et un mot de passe, pas une inscription d'application." }
    oauth: { en: "OAuth2 signs in with a user account, not with an app registration and its secret.", fr: "OAuth2 se connecte avec un compte d'utilisateur, pas avec une inscription d'application et son secret." }
references:
  - title: Data source management
    url: https://learn.microsoft.com/en-us/fabric/data-factory/data-source-management
