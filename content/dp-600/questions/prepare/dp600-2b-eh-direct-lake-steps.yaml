id: dp600-2b-eh-direct-lake-steps
objective: "2.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace that contains an eventhouse with a KQL database named KQLDB1 and a lakehouse named Lakehouse1. KQLDB1 contains a table named Telemetry that is fed by an eventstream.

    You need to build a Power BI semantic model that uses Direct Lake storage mode to report on Telemetry. The solution must not create a second copy of the data that you have to load or maintain.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un eventhouse avec une base de données KQL nommée KQLDB1 et un lakehouse nommé Lakehouse1. KQLDB1 contient une table nommée Telemetry alimentée par un eventstream.

    Vous devez créer un modèle sémantique Power BI en mode de stockage Direct Lake pour produire des rapports sur Telemetry. La solution ne doit pas créer de seconde copie des données que vous devriez charger ou maintenir.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: avail, text: { en: "Turn on OneLake availability for the Telemetry table in KQLDB1.", fr: "Activer la disponibilité OneLake pour la table Telemetry de KQLDB1." } }
    - { id: shortcut, text: { en: "In Lakehouse1, create a OneLake shortcut to the Telemetry table of KQLDB1.", fr: "Dans Lakehouse1, créer un raccourci OneLake vers la table Telemetry de KQLDB1." } }
    - { id: model, text: { en: "Create a semantic model from Lakehouse1 that includes the Telemetry table.", fr: "Créer un modèle sémantique à partir de Lakehouse1 qui inclut la table Telemetry." } }
    - { id: accel, text: { en: "In KQLDB1, create a OneLake shortcut to Lakehouse1 and set Accelerate to On.", fr: "Dans KQLDB1, créer un raccourci OneLake vers Lakehouse1 et définir Accelerate sur On." } }
    - { id: smint, text: { en: "Turn on OneLake integration in the settings of the semantic model.", fr: "Activer l'intégration OneLake dans les paramètres du modèle sémantique." } }
    - { id: esdest, text: { en: "Add Lakehouse1 as a destination of the eventstream that feeds Telemetry.", fr: "Ajouter Lakehouse1 comme destination de l'eventstream qui alimente Telemetry." } }
answer:
  sequence: [ avail, shortcut, model ]
explanation:
  correct:
    en: |
      OneLake availability writes the KQL table as a Delta table in OneLake, a logical copy managed by the eventhouse at no extra storage cost. A OneLake shortcut then exposes that Delta table under the Tables of Lakehouse1, and a semantic model created from the lakehouse reads it in Direct Lake mode. The shortcut can only point to the Delta table once availability is on.
    fr: |
      La disponibilité OneLake écrit la table KQL sous forme de table Delta dans OneLake, une copie logique gérée par l'eventhouse sans coût de stockage supplémentaire. Un raccourci OneLake expose ensuite cette table Delta dans les tables de Lakehouse1, et un modèle sémantique créé à partir du lakehouse la lit en mode Direct Lake. Le raccourci ne peut pointer vers la table Delta qu'une fois la disponibilité activée.
  options:
    accel: { en: "A shortcut in KQLDB1 works in the other direction: KQL queries read lakehouse data.", fr: "Un raccourci dans KQLDB1 fonctionne dans l'autre sens : les requêtes KQL lisent les données du lakehouse." }
    smint: { en: "Semantic model OneLake integration exports Import tables of a model; a Direct Lake model has nothing to export.", fr: "L'intégration OneLake d'un modèle sémantique exporte les tables Import d'un modèle ; un modèle Direct Lake n'a rien à exporter." }
    esdest: { en: "A lakehouse destination makes the eventstream write and maintain a second copy of the events.", fr: "Une destination lakehouse fait écrire et maintenir par l'eventstream une seconde copie des événements." }
references:
  - title: Turn on OneLake availability for an eventhouse
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-house-onelake-availability
