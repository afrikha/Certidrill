id: dp600-2c-agg-pyspark-daily
objective: "2.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a lakehouse named **LH1** that contains a Delta table named **silver_sales** (OrderDate, StoreID, CustomerID, Amount).

    You are writing a notebook cell that creates a table named **gold_daily_sales** with one row per date and store, the total amount, and the exact number of different customers.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse nommé **LH1** qui contient une table Delta nommée **silver_sales** (OrderDate, StoreID, CustomerID, Amount).

    Vous écrivez une cellule de notebook qui crée une table nommée **gold_daily_sales** avec une ligne par date et par magasin, le montant total et le nombre exact de clients différents.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from pyspark.sql import functions as F

    daily = (spark.read.table("silver_sales")
        .[[grp]]("OrderDate", "StoreID")
        .[[agg]](F.sum("Amount").alias("TotalAmount"),
                 F.[[dc]]("CustomerID").alias("Customers")))

    daily.write.mode("overwrite").saveAsTable("gold_daily_sales")
  slots:
    - id: grp
      options:
        - { id: groupby, text: groupBy }
        - { id: partitionby, text: partitionBy }
        - { id: orderby, text: orderBy }
        - { id: select, text: select }
    - id: agg
      options:
        - { id: agg, text: agg }
        - { id: sum, text: sum }
        - { id: withcolumn, text: withColumn }
        - { id: selectagg, text: select }
    - id: dc
      options:
        - { id: countdistinct, text: countDistinct }
        - { id: approx, text: approx_count_distinct }
        - { id: count, text: count }
        - { id: sumdc, text: sum }
answer:
  values: { grp: groupby, agg: agg, dc: countdistinct }
explanation:
  correct:
    en: "`groupBy` returns grouped data, and `agg` applies several aggregate expressions to each group in one pass. `countDistinct` returns the exact number of different CustomerID values in each group."
    fr: "`groupBy` renvoie des données regroupées, et `agg` applique plusieurs expressions d'agrégation à chaque groupe en une seule passe. `countDistinct` renvoie le nombre exact de valeurs CustomerID différentes de chaque groupe."
  options:
    partitionby: { en: "A DataFrame has no partitionBy method; partitionBy belongs to a window specification or to the writer.", fr: "Un DataFrame n'a pas de méthode partitionBy ; partitionBy appartient à une spécification de fenêtre ou au writer." }
    orderby: { en: "orderBy sorts the rows; it returns a DataFrame, not groups to aggregate.", fr: "orderBy trie les lignes ; il renvoie un DataFrame, pas des groupes à agréger." }
    sum: { en: "On grouped data, sum takes column names, not aggregate expressions such as F.sum and F.countDistinct.", fr: "Sur des données regroupées, sum accepte des noms de colonnes, pas des expressions d'agrégation comme F.sum et F.countDistinct." }
    withcolumn: { en: "withColumn adds one column to a DataFrame; grouped data has no withColumn method.", fr: "withColumn ajoute une colonne à un DataFrame ; les données regroupées n'ont pas de méthode withColumn." }
    select: { en: "select returns columns of a DataFrame; it doesn't group rows.", fr: "select renvoie des colonnes d'un DataFrame ; il ne regroupe pas les lignes." }
    selectagg: { en: "Grouped data has no select method; aggregate expressions are applied with agg.", fr: "Les données regroupées n'ont pas de méthode select ; les expressions d'agrégation s'appliquent avec agg." }
    approx: { en: "approx_count_distinct returns an estimate, not the exact count required.", fr: "approx_count_distinct renvoie une estimation, pas le nombre exact exigé." }
    sumdc: { en: "sum adds up numeric values; it doesn't count customers.", fr: "sum additionne des valeurs numériques ; il ne compte pas les clients." }
    count: { en: "count counts the non-null CustomerID values, including repeated customers.", fr: "count compte les valeurs CustomerID non null, y compris les clients répétés." }
references:
  - title: "Lakehouse tutorial: Prepare and transform data in the lakehouse"
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/tutorial-lakehouse-data-preparation
