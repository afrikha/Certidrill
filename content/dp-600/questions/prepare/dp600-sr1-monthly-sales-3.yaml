stem:
  en: You run CREATE TABLE AS SELECT grouped by product and order date.
  fr: Vous exécutez CREATE TABLE AS SELECT avec un regroupement par produit et date de commande.
body:
  solution:
    en: |
      You run the following statement in WH-Sales.

      ```sql
      CREATE TABLE dbo.MonthlyProductSales
      AS
      SELECT ProductKey,
             YEAR(OrderDate) AS SalesYear,
             MONTH(OrderDate) AS SalesMonth,
             SUM(Quantity) AS TotalQuantity,
             SUM(SalesAmount) AS TotalSalesAmount
      FROM dbo.FactSales
      GROUP BY ProductKey, OrderDate;
      ```
    fr: |
      Vous exécutez l'instruction suivante dans WH-Sales.

      ```sql
      CREATE TABLE dbo.MonthlyProductSales
      AS
      SELECT ProductKey,
             YEAR(OrderDate) AS SalesYear,
             MONTH(OrderDate) AS SalesMonth,
             SUM(Quantity) AS TotalQuantity,
             SUM(SalesAmount) AS TotalSalesAmount
      FROM dbo.FactSales
      GROUP BY ProductKey, OrderDate;
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      The statement runs, because `YEAR(OrderDate)` and `MONTH(OrderDate)` are expressions of a grouping column, but the groups are defined by `GROUP BY`, not by the `SELECT` list. The table gets one row per product and day, so a product sold on several days of a month has several rows with the same year and month.
    fr: |
      L'instruction s'exécute, car `YEAR(OrderDate)` et `MONTH(OrderDate)` sont des expressions d'une colonne de regroupement, mais ce sont les colonnes de `GROUP BY` qui définissent les groupes, et non la liste du `SELECT`. La table obtient une ligne par produit et par jour : un produit vendu plusieurs jours dans le mois a plusieurs lignes avec la même année et le même mois.
references:
  - title: SELECT - GROUP BY clause (Transact-SQL)
