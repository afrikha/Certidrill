id: dp600-cs1b-replicate-core
objective: "2.1.3"
type: single
caseStudy: dp600-cs1b-woodgrove-bank
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the data ingestion requirement. What should you create in WB-Finance?
  fr: |
    Vous devez satisfaire l'exigence d'ingestion des données. Que devez-vous créer dans WB-Finance ?
body:
  options:
    - { id: a, text: { en: "A copy job that uses incremental copy from CoreBankingDB", fr: "Un travail de copie qui utilise la copie incrémentielle depuis CoreBankingDB" } }
    - { id: b, text: { en: "A Dataflow Gen2 with incremental refresh from CoreBankingDB", fr: "Un Dataflow Gen2 avec actualisation incrémentielle depuis CoreBankingDB" } }
    - { id: c, text: { en: "A lakehouse with OneLake shortcuts to the CoreBankingDB tables", fr: "Un lakehouse avec des raccourcis OneLake vers les tables de CoreBankingDB" } }
    - { id: d, text: { en: "A mirrored Azure SQL Database item for CoreBankingDB", fr: "Un élément de base de données Azure SQL Database mise en miroir pour CoreBankingDB" } }
answer: { optionId: d }
explanation:
  correct:
    en: Mirroring continuously replicates an Azure SQL Database into OneLake as Delta tables and manages the replication itself, so there is no pipeline, notebook or schedule to maintain. It also creates a read-only SQL analytics endpoint that the WH_Finance stored procedures can query.
    fr: La mise en miroir réplique en continu une base Azure SQL Database dans OneLake sous forme de tables Delta et gère elle-même la réplication ; il n'y a donc ni pipeline, ni notebook, ni planification à maintenir. Elle crée aussi un point de terminaison d'analytique SQL en lecture seule que les procédures stockées de WH_Finance peuvent interroger.
  options:
    a:
      en: A copy job copies only the changes, but each run is triggered by a schedule or on demand, which is a job to maintain rather than continuous replication.
      fr: Un travail de copie ne copie que les modifications, mais chaque exécution est déclenchée par une planification ou à la demande ; c'est un travail à maintenir, pas une réplication continue.
    b:
      en: A dataflow must be refreshed on a schedule, and its Power Query transformations are an ETL process to maintain.
      fr: Un dataflow doit être actualisé selon une planification, et ses transformations Power Query constituent un processus ETL à maintenir.
    c:
      en: OneLake shortcuts point to Fabric items or to storage locations such as ADLS Gen2 or Amazon S3; an Azure SQL Database is not a supported shortcut target.
      fr: Les raccourcis OneLake pointent vers des éléments Fabric ou vers des emplacements de stockage comme ADLS Gen2 ou Amazon S3 ; une base Azure SQL Database n'est pas une cible de raccourci prise en charge.
references:
  - title: Microsoft Fabric Mirrored Databases from Azure SQL Database
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-sql-database
  - title: OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
