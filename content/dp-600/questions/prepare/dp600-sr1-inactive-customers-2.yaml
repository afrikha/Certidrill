stem:
  en: You merge Orders with Customers by using a left anti join.
  fr: Vous fusionnez Orders avec Customers par une anti-jointure gauche.
body:
  solution:
    en: |
      You select the Orders query and select **Merge queries as new**. You select Customers as the second table, match the `CustomerID` columns, and select the **Left anti** join kind. In the new query, you remove the Customers column.
    fr: |
      Vous sélectionnez la requête Orders, puis **Requêtes de fusion en tant que nouvelles** (Merge queries as new). Vous sélectionnez Customers comme deuxième table, vous associez les colonnes `CustomerID` et vous choisissez le type de jointure **Anti jointure gauche** (Left anti). Dans la nouvelle requête, vous supprimez la colonne Customers.
answer: { value: false }
explanation:
  correct:
    en: |
      The left table of a merge is the first table selected, here Orders. A left anti join keeps only the rows of the left table that have no match in the right table, so the query returns orders whose `CustomerID` doesn't exist in Customers, with the Orders columns, not the customers without orders.
    fr: |
      La table de gauche d'une fusion est la première table sélectionnée, ici Orders. Une anti-jointure gauche ne conserve que les lignes de la table de gauche sans correspondance dans la table de droite : la requête renvoie les commandes dont le `CustomerID` n'existe pas dans Customers, avec les colonnes d'Orders, et non les clients sans commande.
