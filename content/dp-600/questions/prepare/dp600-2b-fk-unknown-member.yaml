id: dp600-2b-fk-unknown-member
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named Warehouse1. A stored procedure loads dbo.FactSales from stg.Sales and looks up ProductKey in dbo.DimProduct by ProductID. A NOT ENFORCED foreign key exists from dbo.FactSales to dbo.DimProduct, and dbo.DimProduct contains an Unknown member with the key -1.

    Some staged rows have a ProductID that doesn't exist in dbo.DimProduct, and their ProductID values are not reliable. Every staged row must be loaded, and every fact row must relate to a row of dbo.DimProduct in the semantic model.

    What should the procedure do with the rows whose lookup fails?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé Warehouse1. Une procédure stockée charge dbo.FactSales à partir de stg.Sales et recherche ProductKey dans dbo.DimProduct par ProductID. Une clé étrangère NOT ENFORCED existe de dbo.FactSales vers dbo.DimProduct, et dbo.DimProduct contient un membre Unknown de clé -1.

    Certaines lignes en staging ont un ProductID qui n'existe pas dans dbo.DimProduct, et leurs valeurs de ProductID ne sont pas fiables. Chaque ligne en staging doit être chargée, et chaque ligne de faits doit être reliée à une ligne de dbo.DimProduct dans le modèle sémantique.

    Que doit faire la procédure des lignes dont la recherche échoue ?
body:
  options:
    - { id: a, text: { en: "Insert them unchanged and let the foreign key reject the rows that don't match.", fr: "Les insérer telles quelles et laisser la clé étrangère rejeter les lignes sans correspondance." } }
    - { id: b, text: { en: "Insert them with a NULL ProductKey.", fr: "Les insérer avec un ProductKey NULL." } }
    - { id: c, text: { en: "Skip them and write them to an error table.", fr: "Les ignorer et les écrire dans une table d'erreurs." } }
    - { id: d, text: { en: "Insert them with ProductKey set to -1.", fr: "Les insérer avec ProductKey défini sur -1." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Fabric Data Warehouse doesn't enforce foreign keys, so the load process must guarantee referential integrity. When a lookup fails, the fact row must still be inserted with a valid key; the special Unknown member (-1) gives it one, and it can be updated to the true key later. Inferred members are an option only when the natural key is trusted.
    fr: |
      Fabric Data Warehouse n'applique pas les clés étrangères : le processus de chargement doit garantir l'intégrité référentielle. Quand une recherche échoue, la ligne de faits doit tout de même être insérée avec une clé valide ; le membre spécial Unknown (-1) lui en fournit une, qui pourra être remplacée plus tard par la vraie clé. Les membres déduits ne sont une option que si la clé naturelle est fiable.
  options:
    a:
      en: |
        NOT ENFORCED constraints are not checked, so nothing is rejected and the rows keep keys that match no dimension row.
      fr: |
        Les contraintes NOT ENFORCED ne sont pas vérifiées : rien n'est rejeté et les lignes gardent des clés qui ne correspondent à aucune ligne de dimension.
    b:
      en: |
        Dimension keys in a fact table should be NOT NULL; a NULL key doesn't relate to any dimension row.
      fr: |
        Les clés de dimension d'une table de faits doivent être NOT NULL ; une clé NULL n'est reliée à aucune ligne de dimension.
    c:
      en: |
        Skipping the rows breaks the requirement to load every staged row.
      fr: |
        Ignorer les lignes enfreint l'exigence de charger chaque ligne en staging.
references:
  - title: Load Tables in a Dimensional Model
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
  - title: Modeling Dimension Tables in Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
