id: dp600-cs2c-airport-denormalize
objective: "2.2.4"
type: single
caseStudy: dp600-cs2c-blue-yonder-airlines
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the star schema requirement for the airport dimension.

    What should you do?
  fr: |
    Vous devez respecter l'exigence de schéma en étoile pour la dimension des aéroports.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "In SM-FlightOps, import the three tables, relate them, and hide DimCity and DimCountry.", fr: "Dans SM-FlightOps, importer les trois tables, les relier, puis masquer DimCity et DimCountry." }
    - id: b
      text: { en: "In SM-FlightOps, merge the three queries in Power Query into a single airport query.", fr: "Dans SM-FlightOps, fusionner les trois requêtes dans Power Query en une seule requête des aéroports." }
    - id: c
      text: { en: "In SM-FlightOps, add calculated columns to DimAirport that use RELATED to get the city and the country.", fr: "Dans SM-FlightOps, ajouter à DimAirport des colonnes calculées qui utilisent RELATED pour obtenir la ville et le pays." }
    - id: d
      text: { en: "In WH-Ops, create a view that joins the three tables, and import the view into SM-FlightOps.", fr: "Dans WH-Ops, créer une vue qui joint les trois tables, puis importer la vue dans SM-FlightOps." }
answer:
  optionId: d
explanation:
  correct:
    en: "A view in WH-Ops that joins DimAirport, DimCity and DimCountry produces one airport dimension with the city, country and region columns. The semantic model imports it as a single dimension table related to FactFlightLeg, which forms a star, and the analysts can query the same view with T-SQL."
    fr: "Une vue de WH-Ops qui joint DimAirport, DimCity et DimCountry produit une seule dimension des aéroports avec les colonnes de ville, de pays et de région. Le modèle sémantique l'importe comme une seule table de dimension liée à FactFlightLeg, ce qui forme une étoile, et les analystes peuvent interroger la même vue avec T-SQL."
  options:
    a:
      en: "Related and hidden tables still form a snowflake in the model, and nothing is flattened for the T-SQL users."
      fr: "Des tables liées et masquées forment toujours un flocon dans le modèle, et rien n'est aplati pour les utilisateurs T-SQL."
    b:
      en: "A Power Query merge flattens the dimension only inside SM-FlightOps; the analysts who use T-SQL cannot query it."
      fr: "Une fusion Power Query n'aplatit la dimension qu'à l'intérieur de SM-FlightOps ; les analystes qui utilisent T-SQL ne peuvent pas l'interroger."
    c:
      en: "Calculated columns still need DimCity and DimCountry in the model, and they are not available to T-SQL users."
      fr: "Les colonnes calculées nécessitent toujours DimCity et DimCountry dans le modèle, et elles ne sont pas disponibles pour les utilisateurs T-SQL."
references:
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
