id: dp600-2b-star-schema-statements
objective: "2.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Your team implements star schemas in a Fabric lakehouse named Lakehouse1 and in a Fabric warehouse named Warehouse1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe implémente des schémas en étoile dans un lakehouse Fabric nommé Lakehouse1 et dans un entrepôt Fabric nommé Warehouse1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          In Lakehouse1, a notebook can write the fact and dimension tables as Delta tables under Tables.
        fr: |
          Dans Lakehouse1, un notebook peut écrire les tables de faits et de dimension sous forme de tables Delta dans Tables.
    - id: s2
      text:
        en: |
          In Warehouse1, a NOT ENFORCED primary key on DimCustomer rejects inserts of duplicate CustomerKey values.
        fr: |
          Dans Warehouse1, une clé primaire NOT ENFORCED sur DimCustomer rejette l'insertion de valeurs CustomerKey en double.
    - id: s3
      text:
        en: |
          In the ETL process of Warehouse1, fact tables are processed after all the dimension tables.
        fr: |
          Dans le processus ETL de Warehouse1, les tables de faits sont traitées après toutes les tables de dimension.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      In a lakehouse, Spark notebooks build the star schema by writing Delta tables, as in the Learn lakehouse tutorial that creates fact_sale and dimension tables. Warehouse primary keys must be NOT ENFORCED, so the load process, not the engine, must guarantee uniqueness. Dimensions are processed first so that the fact load can look up their surrogate keys.
    fr: |
      Dans un lakehouse, des notebooks Spark créent le schéma en étoile en écrivant des tables Delta, comme dans le didacticiel lakehouse de Learn qui crée fact_sale et les tables de dimension. Les clés primaires de l'entrepôt doivent être NOT ENFORCED : c'est le processus de chargement, et non le moteur, qui doit garantir l'unicité. Les dimensions sont traitées en premier pour que le chargement des faits puisse rechercher leurs clés de substitution.
references:
  - title: Lakehouse tutorial - Prepare and transform lakehouse data
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/tutorial-lakehouse-data-preparation
  - title: Load Tables in a Dimensional Model
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
