id: dp600-cs3a-route-store
objective: "2.1.4"
type: single
caseStudy: dp600-cs3a-consolidated-messenger
difficulty: 1
status: draft
stem:
  en: |
    You need to choose where to store the planned routes. The solution must meet requirement 3.

    Which item should you create in CM-Operations?
  fr: |
    Vous devez choisir où stocker les tournées planifiées. La solution doit satisfaire l'exigence 3.

    Quel élément devez-vous créer dans CM-Operations ?
body:
  options:
    - { id: a, text: { en: "A lakehouse", fr: "Un lakehouse" } }
    - { id: b, text: { en: "A SQL database", fr: "Une base de données SQL" } }
    - { id: c, text: { en: "A warehouse", fr: "Un entrepôt" } }
    - { id: d, text: { en: "A second eventhouse", fr: "Un second eventhouse" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Fabric warehouse is the analytical store for SQL-based BI that T-SQL developers load with stored procedures, and it supports multi-table transactions. It matches a team that writes T-SQL only and data that serves reporting.
    fr: |
      Un entrepôt Fabric est le magasin analytique de la BI basée sur SQL que des développeurs T-SQL chargent avec des procédures stockées, et il prend en charge les transactions multitables. Il correspond à une équipe qui n'écrit que du T-SQL et à des données destinées au reporting.
  options:
    a: { en: "Lakehouse tables are written with Spark; the SQL analytics endpoint of a lakehouse is read-only for T-SQL.", fr: "Les tables d'un lakehouse s'écrivent avec Spark ; le point de terminaison d'analytique SQL d'un lakehouse est en lecture seule pour T-SQL." }
    b: { en: "A SQL database in Fabric targets operational (OLTP) workloads of applications, which the requirement excludes.", fr: "Une base de données SQL dans Fabric cible les charges opérationnelles (OLTP) des applications, ce que l'exigence exclut." }
    d: { en: "An eventhouse is designed for streaming event data queried with KQL, not for transactional T-SQL loads.", fr: "Un eventhouse est conçu pour des données d'événements en streaming interrogées en KQL, pas pour des chargements T-SQL transactionnels." }
references:
  - title: Fabric decision guide - choose a data store
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
