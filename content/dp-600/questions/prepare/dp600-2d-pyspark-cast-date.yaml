id: dp600-2d-pyspark-cast-date
objective: "2.2.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a lakehouse named **Lakehouse1** that contains a Delta table named **bronze_orders**. In bronze_orders, all the columns use the STRING data type. The Quantity column contains whole numbers, and the OrderDateText column contains dates such as `31/12/2026`.

    You need to create a DataFrame in a notebook in which Quantity uses an integer type and OrderDate uses the date type, without a time part.

    How should you complete the PySpark code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse nommé **Lakehouse1** qui contient une table Delta nommée **bronze_orders**. Dans bronze_orders, toutes les colonnes utilisent le type de données STRING. La colonne Quantity contient des nombres entiers et la colonne OrderDateText contient des dates comme `31/12/2026`.

    Vous devez créer, dans un notebook, un DataFrame dans lequel Quantity utilise un type entier et OrderDate utilise le type date, sans partie heure.

    Comment devez-vous compléter le code PySpark ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from pyspark.sql import functions as F

    orders = (spark.read.table("bronze_orders")
        .withColumn("Quantity", F.col("Quantity").[[m]]("int"))
        .withColumn("OrderDate", F.[[f]]("OrderDateText", [[fmt]])))
  slots:
    - id: m
      options:
        - { id: cast, text: cast }
        - { id: alias, text: alias }
        - { id: like, text: like }
    - id: f
      options:
        - { id: todate, text: to_date }
        - { id: tots, text: to_timestamp }
        - { id: datefmt, text: date_format }
    - id: fmt
      options:
        - { id: ddMM, text: "\"dd/MM/yyyy\"" }
        - { id: MMdd, text: "\"MM/dd/yyyy\"" }
        - { id: ddmm, text: "\"dd/mm/yyyy\"" }
answer:
  values: { m: cast, f: todate, fmt: ddMM }
explanation:
  correct:
    en: "`cast(\"int\")` changes the data type of a column. `to_date` parses a string with a datetime pattern and returns a date without a time part. In the pattern, `dd` is the day, `MM` the month and `yyyy` the year, which matches `31/12/2026`."
    fr: "`cast(\"int\")` change le type de données d'une colonne. `to_date` analyse une chaîne selon un modèle de date et renvoie une date sans partie heure. Dans le modèle, `dd` est le jour, `MM` le mois et `yyyy` l'année, ce qui correspond à `31/12/2026`."
  options:
    alias: { en: "alias renames a column expression; it doesn't change its data type.", fr: "alias renomme une expression de colonne ; il ne change pas son type de données." }
    like: { en: "like is a pattern-matching condition that returns a Boolean.", fr: "like est une condition de correspondance de modèle qui renvoie une valeur booléenne." }
    tots: { en: "to_timestamp returns a timestamp, which includes a time part.", fr: "to_timestamp renvoie un horodatage, qui contient une partie heure." }
    datefmt: { en: "date_format formats a date as a string; it doesn't return a date.", fr: "date_format met en forme une date sous forme de chaîne ; il ne renvoie pas de date." }
    MMdd: { en: "MM/dd/yyyy expects the month first, so 31 can't be parsed as a month.", fr: "MM/dd/yyyy attend d'abord le mois : 31 ne peut pas être lu comme un mois." }
    ddmm: { en: "Lowercase mm stands for minutes, not months.", fr: "mm en minuscules désigne les minutes, pas les mois." }
references:
  - title: to_date function
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/to_date
  - title: "Tutorial: Load and transform data using Apache Spark DataFrames"
    url: https://learn.microsoft.com/en-us/azure/databricks/getting-started/dataframes
