id: dp600-2c-denorm-keep-snowflake
objective: "2.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You are designing the product dimension of a Fabric warehouse named **WH1**. The source stores products, subcategories and categories in three normalized tables. By default, you plan to flatten them into a single denormalized **DimProduct** table.

    Which two conditions justify keeping the product dimension as a snowflake instead?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez la dimension des produits d'un entrepôt Fabric nommé **WH1**. La source stocke les produits, les sous-catégories et les catégories dans trois tables normalisées. Par défaut, vous prévoyez de les aplatir en une seule table dénormalisée **DimProduct**.

    Quelles sont les deux conditions qui justifient de conserver plutôt la dimension des produits sous forme de flocon ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A sales target fact table is stored at the subcategory grain and needs a subcategory key to relate to.", fr: "Une table de faits des objectifs de vente est stockée au grain de la sous-catégorie et a besoin d'une clé de sous-catégorie pour s'y relier." } }
    - { id: b, text: { en: "Report authors need a Category > Subcategory > Product hierarchy in a semantic model.", fr: "Les auteurs de rapports ont besoin d'une hiérarchie Category > Subcategory > Product dans un modèle sémantique." } }
    - { id: c, text: { en: "The dimension is extremely large, and the cost of redundant storage outweighs the query performance gain.", fr: "La dimension est extrêmement volumineuse, et le coût du stockage redondant l'emporte sur le gain de performances des requêtes." } }
    - { id: d, text: { en: "The semantic model must show as few tables as possible in the Data pane.", fr: "Le modèle sémantique doit afficher le moins de tables possible dans le volet Données." } }
    - { id: e, text: { en: "Product attributes change rarely, and no history of the changes is kept.", fr: "Les attributs des produits changent rarement, et aucun historique des changements n'est conservé." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Learn recommends denormalized dimensions in most cases and lists the exceptions for a snowflake: an extremely large dimension where storage costs outweigh query performance, keys needed to relate the dimension to facts at a higher grain (such as targets by subcategory), and history tracked at higher levels of granularity."
    fr: "Learn recommande des dimensions dénormalisées dans la plupart des cas et cite les exceptions qui justifient un flocon : une dimension extrêmement volumineuse dont le coût de stockage l'emporte sur les performances des requêtes, des clés nécessaires pour relier la dimension à des faits de grain supérieur (comme des objectifs par sous-catégorie), et un historique suivi à des niveaux de granularité supérieurs."
  options:
    b: { en: "A hierarchy can only use columns of one table, so it argues for the denormalized design.", fr: "Une hiérarchie ne peut utiliser que les colonnes d'une seule table : cela plaide pour la conception dénormalisée." }
    d: { en: "A snowflake adds tables to the Data pane; fewer tables argue for denormalizing.", fr: "Un flocon ajoute des tables au volet Données ; moins de tables plaide pour la dénormalisation." }
    e: { en: "Rarely changing attributes without history are no reason to keep separate tables.", fr: "Des attributs qui changent rarement, sans historique, ne justifient pas de conserver des tables distinctes." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Dimension tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
