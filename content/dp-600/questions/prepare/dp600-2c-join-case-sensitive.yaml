id: dp600-2c-join-case-sensitive
objective: "2.2.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric warehouse named **WH1** that was created with the default collation. WH1 contains the tables **dbo.FactSales** and **dbo.DimProduct**, which both have a **ProductCode** column.

    A query that joins the tables with an INNER JOIN on ProductCode returns fewer rows than expected. You discover that some codes differ only by letter case, such as ab-100 in FactSales and AB-100 in DimProduct.

    You need the join to match these codes.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé **WH1** créé avec le classement par défaut. WH1 contient les tables **dbo.FactSales** et **dbo.DimProduct**, qui ont toutes deux une colonne **ProductCode**.

    Une requête qui joint les tables avec un INNER JOIN sur ProductCode renvoie moins de lignes que prévu. Vous découvrez que certains codes ne diffèrent que par la casse, comme ab-100 dans FactSales et AB-100 dans DimProduct.

    La jointure doit faire correspondre ces codes.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: b, text: { en: "Change the collation of WH1 to Latin1_General_100_CI_AS_KS_WS_SC_UTF8.", fr: "Changer le classement de WH1 en Latin1_General_100_CI_AS_KS_WS_SC_UTF8." } }
    - { id: d, text: { en: "Replace the INNER JOIN with a LEFT OUTER JOIN on the same condition.", fr: "Remplacer le INNER JOIN par un LEFT OUTER JOIN sur la même condition." } }
    - { id: a, text: { en: "Compare UPPER(f.ProductCode) with UPPER(p.ProductCode) in the join condition.", fr: "Comparer UPPER(f.ProductCode) à UPPER(p.ProductCode) dans la condition de jointure." } }
    - { id: c, text: { en: "Convert ProductCode to uppercase in both tables during the load, and join on the stored values.", fr: "Convertir ProductCode en majuscules dans les deux tables pendant le chargement, puis joindre sur les valeurs stockées." } }
    - { id: e, text: { en: "Set the Data Warehouse collation of the workspace to case-insensitive.", fr: "Définir le classement Data Warehouse de l'espace de travail sur non sensible à la casse." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "The default warehouse collation, Latin1_General_100_BIN2_UTF8, is case-sensitive, so ab-100 and AB-100 are different values. Applying UPPER to both sides in the query, or storing normalized uppercase codes at load time, makes the values equal."
    fr: "Le classement par défaut de l'entrepôt, Latin1_General_100_BIN2_UTF8, respecte la casse : ab-100 et AB-100 sont des valeurs différentes. Appliquer UPPER des deux côtés dans la requête, ou stocker des codes normalisés en majuscules au chargement, rend les valeurs égales."
  options:
    b: { en: "The collation of a warehouse can't be changed after the warehouse is created.", fr: "Le classement d'un entrepôt ne peut pas être modifié après la création de l'entrepôt." }
    d: { en: "A left outer join keeps the unmatched rows but still doesn't match codes that differ by case.", fr: "Une jointure externe gauche conserve les lignes sans correspondance, mais ne fait toujours pas correspondre des codes qui diffèrent par la casse." }
    e: { en: "The workspace setting applies only to warehouses created after the change, not to WH1.", fr: "Le paramètre de l'espace de travail ne s'applique qu'aux entrepôts créés après la modification, pas à WH1." }
references:
  - title: Data Warehouse collation
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/collation
