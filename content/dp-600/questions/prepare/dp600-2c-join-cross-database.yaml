id: dp600-2c-join-cross-database
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a warehouse named **WH1** and a lakehouse named **LH1**. WH1 contains a table named **dbo.FactSales**. LH1 contains a Delta table named **customers**.

    You need to write a T-SQL query in WH1 that joins dbo.FactSales to the customers table. The solution must not copy any data.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un entrepôt nommé **WH1** et un lakehouse nommé **LH1**. WH1 contient une table nommée **dbo.FactSales**. LH1 contient une table Delta nommée **customers**.

    Vous devez écrire dans WH1 une requête T-SQL qui joint dbo.FactSales à la table customers. La solution ne doit copier aucune donnée.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a linked server in WH1 that points to the SQL analytics endpoint of LH1.", fr: "Créer dans WH1 un serveur lié qui pointe vers le point de terminaison d'analytique SQL de LH1." }
    - id: b
      text: { en: "Load the customers table into WH1 by using a COPY INTO statement.", fr: "Charger la table customers dans WH1 avec une instruction COPY INTO." }
    - id: c
      text: { en: "Copy the customers table into WH1 by using a pipeline Copy activity.", fr: "Copier la table customers dans WH1 avec une activité Copy d'un pipeline." }
    - id: d
      text: { en: "Reference the table with the three-part name LH1.dbo.customers in the query.", fr: "Référencer la table avec le nom en trois parties LH1.dbo.customers dans la requête." }
answer: { optionId: d }
explanation:
  correct:
    en: "Cross-database queries in the same workspace use three-part names (database.schema.table). The warehouse query reads the lakehouse table through its SQL analytics endpoint, and no data is copied."
    fr: "Les requêtes inter-bases de données d'un même espace de travail utilisent des noms en trois parties (base.schéma.table). La requête de l'entrepôt lit la table du lakehouse via son point de terminaison d'analytique SQL, sans copier de données."
  options:
    a: { en: "Linked servers aren't used in Fabric; items of the same workspace are queried directly with three-part names.", fr: "Les serveurs liés ne sont pas utilisés dans Fabric ; les éléments d'un même espace de travail s'interrogent directement avec des noms en trois parties." }
    b: { en: "COPY INTO loads files from external storage into a warehouse table, which copies data.", fr: "COPY INTO charge des fichiers d'un stockage externe dans une table d'entrepôt, ce qui copie des données." }
    c: { en: "A Copy activity duplicates the data in WH1, which the requirement forbids.", fr: "Une activité Copy duplique les données dans WH1, ce que l'exigence interdit." }
references:
  - title: Query the warehouse or SQL analytics endpoint
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/query-warehouse
