id: dp600-2a-catalog-certified
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Users at Contoso can access more than 200 Fabric workspaces. Before creating a new lakehouse for customer data, a data analyst named Ana wants to find the lakehouses that the data governance team has already certified, in any workspace that she can access.

    You need to recommend a solution that minimizes the effort for Ana.

    What should you recommend?
  fr: |
    Les utilisateurs de Contoso peuvent accéder à plus de 200 espaces de travail Fabric. Avant de créer un nouveau lakehouse pour les données clients, une analyste de données nommée Ana souhaite trouver les lakehouses que l'équipe de gouvernance des données a déjà certifiés, dans tous les espaces de travail auxquels elle a accès.

    Vous devez recommander une solution qui réduit au minimum l'effort d'Ana.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The All data streams page of Real-Time hub, filtered on the endorsement column", fr: "La page All data streams du hub Real-Time, filtrée sur la colonne d'approbation" } }
    - { id: b, text: { en: "The Monitoring hub, filtered on the Lakehouse item type", fr: "Le hub de surveillance, filtré sur le type d'élément Lakehouse" } }
    - { id: c, text: { en: "The Explore tab of the OneLake catalog, with the Endorsed items filter and the lakehouse item type", fr: "L'onglet Explore du catalogue OneLake, avec le filtre Endorsed items et le type d'élément lakehouse" } }
    - { id: d, text: { en: "The list view of each workspace, sorted on the endorsement column", fr: "La vue liste de chaque espace de travail, triée sur la colonne d'approbation" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Explore tab of the OneLake catalog lists the items Ana can access across all workspaces. The Endorsed items filter keeps only endorsed items (certified ones first, then promoted), and the item type selector narrows the list to lakehouses.
    fr: |
      L'onglet Explore du catalogue OneLake liste les éléments auxquels Ana a accès dans tous les espaces de travail. Le filtre Endorsed items ne conserve que les éléments approuvés (les certifiés d'abord, puis les promus), et le sélecteur de type d'élément limite la liste aux lakehouses.
  options:
    a:
      en: All data streams lists eventstream streams and KQL tables, not lakehouses.
      fr: All data streams liste les flux des eventstreams et les tables KQL, pas les lakehouses.
    b:
      en: The Monitoring hub shows activity runs such as pipeline and notebook runs; it is not a data discovery catalog.
      fr: Le hub de surveillance affiche des exécutions d'activités comme celles des pipelines et des notebooks ; ce n'est pas un catalogue de découverte des données.
    d:
      en: Opening more than 200 workspaces one by one does not minimize effort when the catalog searches all of them at once.
      fr: Ouvrir plus de 200 espaces de travail un par un ne réduit pas l'effort, alors que le catalogue les parcourt tous en une fois.
references:
  - title: Find and explore data in the OneLake catalog
    url: https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-explore
