id: dp600-2e-dax-add-measure
objective: "2.3.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You open a Power BI Desktop file that contains an Import semantic model. In DAX query view, you write the following query, and it returns the expected values.

    ```text
    DEFINE
        MEASURE Sales[Margin %] = DIVIDE ( [Total Margin], [Total Sales] )
    EVALUATE
        SUMMARIZECOLUMNS ( 'Product'[Category], "Margin %", [Margin %] )
    ```

    The Margin % measure doesn't exist in the model yet. You need to add Margin % to the semantic model so that report authors can use it.

    Which two actions can you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ouvrez un fichier Power BI Desktop qui contient un modèle sémantique en mode Import. Dans la vue de requête DAX, vous écrivez la requête suivante, qui renvoie les valeurs attendues.

    ```text
    DEFINE
        MEASURE Sales[Margin %] = DIVIDE ( [Total Margin], [Total Sales] )
    EVALUATE
        SUMMARIZECOLUMNS ( 'Product'[Category], "Margin %", [Margin %] )
    ```

    La mesure Margin % n'existe pas encore dans le modèle. Vous devez ajouter Margin % au modèle sémantique pour que les auteurs de rapports puissent l'utiliser.

    Quelles sont les deux actions que vous pouvez effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Select **Run**, and then save the Power BI Desktop file.", fr: "Sélectionner **Exécuter**, puis enregistrer le fichier Power BI Desktop." }
    - id: b
      text: { en: "Select the CodeLens **Update model: Add new measure** above the measure.", fr: "Sélectionner le CodeLens **Mettre à jour le modèle : ajouter une nouvelle mesure** au-dessus de la mesure." }
    - id: c
      text: { en: "Add a line that starts with `///` above the measure definition.", fr: "Ajouter une ligne commençant par `///` au-dessus de la définition de la mesure." }
    - id: d
      text: { en: "Select **Update model with changes** on the command bar.", fr: "Sélectionner **Mettre à jour le modèle avec les modifications** dans la barre de commandes." }
    - id: e
      text: { en: "Select **Format** on the ribbon, and then run the query again.", fr: "Sélectionner **Mettre en forme** dans le ruban, puis réexécuter la requête." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A measure defined in the DEFINE block is query-scoped and exists only while the query runs. The CodeLens Update model: Add new measure adds that measure to the model, and Update model with changes adds or overwrites every model measure from the DAX query-scoped measures of the query."
    fr: "Une mesure définie dans le bloc DEFINE est limitée à la requête et n'existe que pendant son exécution. Le CodeLens Mettre à jour le modèle : ajouter une nouvelle mesure ajoute cette mesure au modèle, et Mettre à jour le modèle avec les modifications ajoute ou remplace dans le modèle toutes les mesures définies dans la requête."
  options:
    a:
      en: "Running the query evaluates the query-scoped measure only; saving the file keeps the query tab, not a model measure."
      fr: "Exécuter la requête n'évalue que la mesure limitée à la requête ; enregistrer le fichier conserve l'onglet de requête, pas une mesure du modèle."
    c:
      en: "A `///` line becomes the measure description, but only when the measure is added to the model with an update action."
      fr: "Une ligne `///` devient la description de la mesure, mais seulement quand la mesure est ajoutée au modèle par une action de mise à jour."
    e:
      en: "Format only indents the query and changes DAX functions to uppercase."
      fr: "Mettre en forme se contente d'indenter la requête et de mettre les fonctions DAX en majuscules."
references:
  - title: DAX Query View
    url: https://learn.microsoft.com/en-us/power-bi/transform-model/dax-query-view
