id: dp600-2c-denorm-direct-lake-table
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a lakehouse named **LH1** that contains three Delta tables: **dim_product**, **dim_subcategory** and **dim_category**. A semantic model named **SM1** uses Direct Lake on SQL analytics endpoints and reads tables from LH1.

    You need SM1 to contain a single product table that includes the subcategory and category names. DAX queries on the product table must not fall back to DirectQuery.

    What should you do?
  fr: |
    Vous disposez d'un lakehouse nommé **LH1** qui contient trois tables Delta : **dim_product**, **dim_subcategory** et **dim_category**. Un modèle sémantique nommé **SM1** utilise Direct Lake sur les points de terminaison d'analytique SQL et lit des tables de LH1.

    SM1 doit contenir une seule table des produits qui inclut les noms de sous-catégorie et de catégorie. Les requêtes DAX sur la table des produits ne doivent pas basculer en mode DirectQuery.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "In the SQL analytics endpoint of LH1, create a view that joins the three tables, and add the view to SM1.", fr: "Dans le point de terminaison d'analytique SQL de LH1, créer une vue qui joint les trois tables, puis ajouter la vue à SM1." }
    - id: b
      text: { en: "In a notebook, join the three tables and save the result as a Delta table in LH1, and add the table to SM1.", fr: "Dans un notebook, joindre les trois tables et enregistrer le résultat comme table Delta dans LH1, puis ajouter la table à SM1." }
    - id: c
      text: { en: "In SM1, add calculated columns to the product table that use RELATED to return the subcategory and category names.", fr: "Dans SM1, ajouter à la table des produits des colonnes calculées qui utilisent RELATED pour renvoyer les noms de sous-catégorie et de catégorie." }
    - id: d
      text: { en: "In SM1, relate the three tables, and hide the subcategory and category tables from report authors.", fr: "Dans SM1, relier les trois tables, puis masquer les tables des sous-catégories et des catégories aux auteurs de rapports." }
answer: { optionId: b }
explanation:
  correct:
    en: "A denormalized Delta table written by the notebook is a physical table that Direct Lake loads directly from OneLake. SM1 then has one product table with the subcategory and category columns, and no SQL view is involved, so no fallback to DirectQuery is needed."
    fr: "Une table Delta dénormalisée écrite par le notebook est une table physique que Direct Lake charge directement depuis OneLake. SM1 contient alors une seule table des produits avec les colonnes de sous-catégorie et de catégorie, et aucune vue SQL n'intervient : aucun basculement en DirectQuery n'est nécessaire."
  options:
    a: { en: "Direct Lake on SQL analytics endpoints falls back to DirectQuery when a table is based on a SQL view.", fr: "Direct Lake sur les points de terminaison d'analytique SQL bascule en DirectQuery quand une table est basée sur une vue SQL." }
    c: { en: "Calculated columns aren't supported on Direct Lake tables in a Direct Lake on SQL analytics endpoints model.", fr: "Les colonnes calculées ne sont pas prises en charge sur les tables Direct Lake d'un modèle Direct Lake sur les points de terminaison d'analytique SQL." }
    d: { en: "The model still contains three related tables (a snowflake), not a single product table.", fr: "Le modèle contient toujours trois tables liées (un flocon), et non une seule table des produits." }
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Dimension tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
