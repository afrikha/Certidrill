id: dp600-2b-pq-custom-formula
objective: "2.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Dataflow Gen2 that contains a query named Sales with numeric columns named Quantity and UnitPrice. The query writes to a warehouse table.

    You need to add a LineAmount column equal to Quantity multiplied by UnitPrice. LineAmount must keep the cents of each amount.

    How should you complete the steps? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un Dataflow Gen2 qui contient une requête nommée Sales avec des colonnes numériques nommées Quantity et UnitPrice. La requête écrit dans une table d'entrepôt.

    Vous devez ajouter une colonne LineAmount égale à Quantity multipliée par UnitPrice. LineAmount doit conserver les centimes de chaque montant.

    Comment devez-vous compléter les étapes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: "On the Add column tab, select Custom column. In the Custom column formula box, enter [[formula]], and in the Data type list, select [[type]]."
    fr: "Dans l'onglet Ajouter une colonne, sélectionnez Colonne personnalisée. Dans la zone Formule de colonne personnalisée, entrez [[formula]], puis dans la liste Type de données, sélectionnez [[type]]."
  slots:
    - id: formula
      options:
        - { id: brackets, text: "[Quantity] * [UnitPrice]" }
        - { id: bare, text: "Quantity * UnitPrice" }
        - { id: quoted, text: "\"Quantity\" * \"UnitPrice\"" }
        - { id: dax, text: "SUMX(Sales, Sales[Quantity] * Sales[UnitPrice])" }
    - id: type
      options:
        - { id: currency, text: { en: "Currency", fr: "Nombre décimal fixe" } }
        - { id: whole, text: { en: "Whole number", fr: "Nombre entier" } }
        - { id: text, text: { en: "Text", fr: "Texte" } }
answer:
  values: { formula: brackets, type: currency }
explanation:
  correct:
    en: |
      A custom column uses a Power Query M formula in which column references are written in square brackets, such as [Quantity]. In Power Query Online, which Dataflow Gen2 uses, the Custom column dialog has a Data type list; Currency (fixed decimal number) keeps the cents.
    fr: |
      Une colonne personnalisée utilise une formule Power Query M dans laquelle les références de colonnes s'écrivent entre crochets, comme [Quantity]. Dans Power Query Online, qu'utilise Dataflow Gen2, la boîte de dialogue Colonne personnalisée comporte une liste Type de données ; Nombre décimal fixe (le type Devise) conserve les centimes.
  options:
    bare: { en: "Without square brackets, M treats Quantity and UnitPrice as undefined identifiers.", fr: "Sans crochets, M traite Quantity et UnitPrice comme des identificateurs non définis." }
    quoted: { en: "Quotation marks create text values, which can't be multiplied.", fr: "Les guillemets créent des valeurs de texte, qui ne peuvent pas être multipliées." }
    dax: { en: "SUMX is a DAX function; Power Query formulas are written in M, and SUMX would return one total, not a value per row.", fr: "SUMX est une fonction DAX ; les formules Power Query s'écrivent en M, et SUMX renverrait un seul total, pas une valeur par ligne." }
    whole: { en: "A whole number type drops the decimal part of the amounts.", fr: "Le type nombre entier supprime la partie décimale des montants." }
    text: { en: "A text type stores the amounts as strings, which can't be summed.", fr: "Le type texte stocke les montants sous forme de chaînes, qui ne peuvent pas être additionnées." }
references:
  - title: Add a custom column
    url: https://learn.microsoft.com/en-us/power-query/add-custom-column
