id: dp600-cs1c-kql-voltage
objective: "2.3.3"
type: dropdown
caseStudy: dp600-cs1c-litware-energy
difficulty: 2
status: draft
stem:
  en: |
    You need to write the voltage quality query in a KQL queryset connected to GridDB. How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez écrire la requête de qualité de tension dans un ensemble de requêtes KQL connecté à GridDB. Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    MeterReadings
    | where ReadingTime > [[time]](6h)
    | where Voltage < 210
    | [[op]] AvgVoltage = avg(Voltage) by MeterId, [[bucket]](ReadingTime, 15m)
  slots:
    - id: time
      options:
        - { id: ago, text: ago }
        - { id: now, text: now }
        - { id: datetime, text: datetime }
        - { id: totimespan, text: totimespan }
    - id: op
      options:
        - { id: extend, text: extend }
        - { id: project, text: project }
        - { id: summarize, text: summarize }
        - { id: top, text: top }
    - id: bucket
      options:
        - { id: bin, text: bin }
        - { id: round, text: round }
        - { id: startofday, text: startofday }
        - { id: todatetime, text: todatetime }
answer:
  values: { time: ago, op: summarize, bucket: bin }
explanation:
  correct:
    en: "`ago(6h)` returns the time six hours before the current UTC time, so the first filter keeps the last six hours. `summarize ... by` groups the filtered rows and computes one average per group, and `bin(ReadingTime, 15m)` rounds each reading time down to its 15-minute interval, giving one row per meter and interval."
    fr: "`ago(6h)` renvoie l'heure située six heures avant l'heure UTC actuelle ; le premier filtre conserve donc les six dernières heures. `summarize ... by` regroupe les lignes filtrées et calcule une moyenne par groupe, et `bin(ReadingTime, 15m)` arrondit chaque heure de mesure au début de son intervalle de 15 minutes, ce qui donne une ligne par compteur et par intervalle."
  options:
    now: { en: "now() accepts an optional offset, but now(6h) returns a time six hours in the future, so no reading would match.", fr: "now() accepte un décalage facultatif, mais now(6h) renvoie une heure située six heures dans le futur ; aucune mesure ne correspondrait." }
    datetime: { en: "datetime() expects a date and time literal, not a timespan such as 6h.", fr: "datetime() attend un littéral de date et d'heure, pas un intervalle comme 6h." }
    totimespan: { en: "totimespan returns a duration; comparing a datetime column with a duration is not valid.", fr: "totimespan renvoie une durée ; comparer une colonne datetime à une durée n'est pas valide." }
    extend: { en: "extend adds a column to every row; it does not support an aggregation with a by clause.", fr: "extend ajoute une colonne à chaque ligne ; il ne prend pas en charge une agrégation avec une clause by." }
    project: { en: "project selects or computes columns row by row; it does not group rows.", fr: "project sélectionne ou calcule des colonnes ligne par ligne ; il ne regroupe pas les lignes." }
    top: { en: "top returns the first N rows sorted by an expression; it does not aggregate.", fr: "top renvoie les N premières lignes triées selon une expression ; il n'agrège pas." }
    round: { en: "round rounds a number to a precision; it does not group datetime values into fixed intervals.", fr: "round arrondit un nombre à une précision donnée ; il ne regroupe pas des valeurs datetime en intervalles fixes." }
    startofday: { en: "startofday rounds to the start of the day, which produces daily groups, not 15-minute groups.", fr: "startofday arrondit au début de la journée, ce qui produit des groupes quotidiens, pas des groupes de 15 minutes." }
    todatetime: { en: "todatetime converts a value to datetime; it does not create intervals.", fr: "todatetime convertit une valeur en datetime ; il ne crée pas d'intervalles." }
references:
  - title: bin()
    url: https://learn.microsoft.com/en-us/kusto/query/bin-function
  - title: summarize operator
    url: https://learn.microsoft.com/en-us/kusto/query/summarize-operator
