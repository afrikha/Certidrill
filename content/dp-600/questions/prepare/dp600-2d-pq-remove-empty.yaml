id: dp600-2d-pq-remove-empty
objective: "2.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Dataflow Gen2 named **Dataflow1** that loads customer contacts into a lakehouse. In the Email column, some rows contain a null value and other rows contain an empty string.

    You need to remove the rows in which Email has no value. The solution must use a single step.

    What should you do in Power Query?
  fr: |
    Vous disposez d'un Dataflow Gen2 nommé **Dataflow1** qui charge des contacts clients dans un lakehouse. Dans la colonne Email, certaines lignes contiennent une valeur null et d'autres une chaîne vide.

    Vous devez supprimer les lignes dans lesquelles Email n'a pas de valeur. La solution doit utiliser une seule étape.

    Que devez-vous faire dans Power Query ?
body:
  options:
    - { id: a, text: { en: "Select the Email column and use Remove duplicates.", fr: "Sélectionner la colonne Email et utiliser Supprimer les doublons." } }
    - { id: b, text: { en: "Filter the Email column to keep the rows that don't equal an empty string.", fr: "Filtrer la colonne Email pour conserver les lignes différentes d'une chaîne vide." } }
    - { id: c, text: { en: "Select the Email column and use Remove errors.", fr: "Sélectionner la colonne Email et utiliser Supprimer les erreurs." } }
    - { id: d, text: { en: "Select Remove empty in the sort and filter menu of the Email column.", fr: "Sélectionner Supprimer les éléments vides dans le menu de tri et de filtre de la colonne Email." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Remove empty applies two rules in one filter step on the column, removing both null values and blank values.
    fr: |
      Supprimer les éléments vides applique deux règles dans une seule étape de filtre sur la colonne : il supprime à la fois les valeurs null et les valeurs vides.
  options:
    b: { en: "This filter removes the empty strings but keeps the null values.", fr: "Ce filtre supprime les chaînes vides mais conserve les valeurs null." }
    c: { en: "Null and empty values aren't errors, so Remove errors keeps those rows.", fr: "Les valeurs null et vides ne sont pas des erreurs : Supprimer les erreurs conserve ces lignes." }
    a: { en: "Remove duplicates keeps one row with a null value and one row with an empty string.", fr: "Supprimer les doublons conserve une ligne avec une valeur null et une ligne avec une chaîne vide." }
references:
  - title: Filter by values in a column
    url: https://learn.microsoft.com/en-us/power-query/filter-values
