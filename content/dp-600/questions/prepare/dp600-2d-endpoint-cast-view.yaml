id: dp600-2d-endpoint-cast-view
objective: "2.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a lakehouse named **Lakehouse1** and a warehouse named **Warehouse1**. Lakehouse1 contains a Delta table named **sales**. The Quantity column of sales uses the STRING data type and contains only whole numbers.

    Analysts query sales by using the SQL analytics endpoint of Lakehouse1. They need Quantity as an `int` column so that they can aggregate it. The solution must not duplicate the data and must minimize development effort.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé **Lakehouse1** et un entrepôt nommé **Warehouse1**. Lakehouse1 contient une table Delta nommée **sales**. La colonne Quantity de sales utilise le type de données STRING et ne contient que des nombres entiers.

    Des analystes interrogent sales à l'aide du point de terminaison d'analytique SQL de Lakehouse1. Ils ont besoin de Quantity sous forme de colonne `int` pour pouvoir l'agréger. La solution ne doit pas dupliquer les données et doit réduire au minimum l'effort de développement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a Dataflow Gen2 that changes the type of Quantity and writes a new table to Lakehouse1.", fr: "Créer un Dataflow Gen2 qui modifie le type de Quantity et écrit une nouvelle table dans Lakehouse1." } }
    - { id: b, text: { en: "In the SQL analytics endpoint, run ALTER TABLE to change Quantity to int.", fr: "Dans le point de terminaison d'analytique SQL, exécuter ALTER TABLE pour changer Quantity en int." } }
    - { id: c, text: { en: "In Warehouse1, run CREATE TABLE AS SELECT with CAST(Quantity AS int).", fr: "Dans Warehouse1, exécuter CREATE TABLE AS SELECT avec CAST(Quantity AS int)." } }
    - { id: d, text: { en: "In the SQL analytics endpoint, create a view that returns CAST(Quantity AS int).", fr: "Dans le point de terminaison d'analytique SQL, créer une vue qui renvoie CAST(Quantity AS int)." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The SQL analytics endpoint supports T-SQL views over the Delta tables of the lakehouse. A view that casts Quantity exposes an `int` column to the analysts without copying any data.
    fr: |
      Le point de terminaison d'analytique SQL prend en charge les vues T-SQL sur les tables Delta du lakehouse. Une vue qui convertit Quantity expose une colonne `int` aux analystes sans copier de données.
  options:
    b: { en: "Creating, altering and dropping tables is supported only in a warehouse, not in the SQL analytics endpoint of a lakehouse.", fr: "La création, la modification et la suppression de tables ne sont prises en charge que dans un entrepôt, pas dans le point de terminaison d'analytique SQL d'un lakehouse." }
    c: { en: "CREATE TABLE AS SELECT writes a second copy of the data in Warehouse1.", fr: "CREATE TABLE AS SELECT écrit une deuxième copie des données dans Warehouse1." }
    a: { en: "The dataflow writes a second copy of the data and needs more development than a view.", fr: "Le dataflow écrit une deuxième copie des données et demande plus de développement qu'une vue." }
references:
  - title: T-SQL Surface Area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
