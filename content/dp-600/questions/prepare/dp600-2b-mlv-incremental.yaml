id: dp600-2b-mlv-incremental
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a lakehouse named LH-Sales. A materialized lake view named gold.daily_sales, defined in Spark SQL, aggregates a Delta table named silver.orders with GROUP BY. silver.orders contains two billion rows and receives a few thousand new rows every hour.

    Monitoring shows that every refresh of gold.daily_sales rebuilds the whole view. You need Fabric to be able to process only the new or changed data. The solution must minimize development effort.

    What should you do?
  fr: |
    Vous disposez d'un lakehouse nommé LH-Sales. Une vue matérialisée de lakehouse nommée gold.daily_sales, définie en Spark SQL, agrège une table Delta nommée silver.orders avec GROUP BY. silver.orders contient deux milliards de lignes et reçoit quelques milliers de nouvelles lignes chaque heure.

    La supervision montre que chaque actualisation de gold.daily_sales reconstruit toute la vue. Fabric doit pouvoir traiter uniquement les données nouvelles ou modifiées. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Recreate gold.daily_sales from a notebook by using PySpark.", fr: "Recréer gold.daily_sales depuis un notebook avec PySpark." } }
    - { id: b, text: { en: "Schedule the refresh of gold.daily_sales every 15 minutes.", fr: "Planifier l'actualisation de gold.daily_sales toutes les 15 minutes." } }
    - { id: c, text: { en: "Enable Delta change data feed on silver.orders.", fr: "Activer le flux de modifications des données (change data feed) Delta sur silver.orders." } }
    - { id: d, text: { en: "Add a constraint with ON MISMATCH DROP to gold.daily_sales.", fr: "Ajouter une contrainte avec ON MISMATCH DROP à gold.daily_sales." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Fabric chooses between an incremental, a full or a skipped refresh for a materialized lake view. Change detection uses Delta change data feed, so incremental refresh requires change data feed on the source tables; without it, Fabric can only skip or fully rebuild the view. GROUP BY aggregations are supported by incremental refresh.
    fr: |
      Fabric choisit entre une actualisation incrémentielle, complète ou ignorée pour une vue matérialisée de lakehouse. La détection des modifications utilise le flux de modifications des données Delta : l'actualisation incrémentielle exige donc ce flux sur les tables sources ; sans lui, Fabric peut seulement ignorer l'actualisation ou reconstruire toute la vue. Les agrégations GROUP BY sont prises en charge par l'actualisation incrémentielle.
  options:
    a:
      en: |
        Materialized lake views authored with PySpark perform full refresh only.
      fr: |
        Les vues matérialisées de lakehouse créées avec PySpark ne font que des actualisations complètes.
    b:
      en: |
        More frequent refreshes would still be full refreshes, and would consume more compute.
      fr: |
        Des actualisations plus fréquentes resteraient complètes et consommeraient davantage de calcul.
    d:
      en: |
        A data quality constraint filters or rejects rows; it doesn't change the refresh strategy.
      fr: |
        Une contrainte de qualité des données filtre ou rejette des lignes ; elle ne change pas la stratégie d'actualisation.
references:
  - title: Overview of Materialized Lake Views
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/materialized-lake-views/overview-materialized-lake-view
