id: dp600-2e-kql-query-lines
objective: "2.3.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have a KQL database named **RetailRT** in a Fabric eventhouse. RetailRT contains a table named **Sales** that has about 50 million rows. The **Region** column contains values written with inconsistent case, such as `EMEA`, `Emea` and `emea`.

    A colleague wrote the query shown in the following table to return the 10 products with the highest total sales in the EMEA region during the last 30 days. The query returns results, but the totals are much lower than expected.

    Answer each prompt by selecting the line of the query.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données KQL nommée **RetailRT** dans un eventhouse Fabric. RetailRT contient une table nommée **Sales** d'environ 50 millions de lignes. La colonne **Region** contient des valeurs écrites avec une casse incohérente, comme `EMEA`, `Emea` et `emea`.

    Un collègue a écrit la requête présentée dans le tableau suivant pour renvoyer les 10 produits ayant le total des ventes le plus élevé dans la région EMEA au cours des 30 derniers jours. La requête renvoie des résultats, mais les totaux sont bien inférieurs à ceux attendus.

    Répondez à chaque consigne en sélectionnant la ligne de la requête.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The line that makes the query aggregate an arbitrary subset of the rows", fr: "La ligne à cause de laquelle la requête agrège un sous-ensemble arbitraire des lignes" }
    - id: p2
      text: { en: "The line to change so that the rows stored as Emea and emea are included", fr: "La ligne à modifier pour inclure les lignes stockées sous la forme Emea et emea" }
  grid:
    header: [{ en: "Line", fr: "Ligne" }, { en: "Query", fr: "Requête" }]
    rows:
      - [{ text: "1" }, { text: "Sales", area: l1 }]
      - [{ text: "2" }, { text: "| where SaleTime > ago(30d)", area: l2 }]
      - [{ text: "3" }, { text: "| take 100000", area: l3 }]
      - [{ text: "4" }, { text: "| where Region == \"EMEA\"", area: l4 }]
      - [{ text: "5" }, { text: "| summarize Revenue = sum(Amount) by Product", area: l5 }]
      - [{ text: "6" }, { text: "| top 10 by Revenue desc", area: l6 }]
answer:
  values: { p1: l3, p2: l4 }
explanation:
  correct:
    en: "`take 100000` keeps 100,000 arbitrary rows, so `summarize` computes totals on a sample instead of all the rows of the last 30 days. `==` is case-sensitive and keeps only the rows stored as `EMEA`; using `=~ \"EMEA\"` includes `Emea` and `emea`."
    fr: "`take 100000` conserve 100 000 lignes quelconques : `summarize` calcule alors les totaux sur un échantillon au lieu de toutes les lignes des 30 derniers jours. `==` respecte la casse et ne conserve que les lignes stockées sous la forme `EMEA` ; `=~ \"EMEA\"` inclut `Emea` et `emea`."
  options:
    l2:
      en: "`ago(30d)` correctly keeps the last 30 days."
      fr: "`ago(30d)` conserve correctement les 30 derniers jours."
    l6:
      en: "`top 10 by Revenue desc` correctly returns the 10 products with the highest revenue."
      fr: "`top 10 by Revenue desc` renvoie correctement les 10 produits ayant le chiffre d'affaires le plus élevé."
references:
  - title: take operator
    url: https://learn.microsoft.com/en-us/kusto/query/take-operator
  - title: String operators
    url: https://learn.microsoft.com/en-us/kusto/query/datatypes-string-operators
