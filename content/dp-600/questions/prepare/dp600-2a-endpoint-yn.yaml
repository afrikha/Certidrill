id: dp600-2a-endpoint-yn
objective: "2.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named LH1 and a warehouse named WH1. Spark notebooks write the Delta tables of LH1. SQL developers load WH1 with T-SQL.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH1 et un entrepôt nommé WH1. Des notebooks Spark écrivent les tables Delta de LH1. Les développeurs SQL alimentent WH1 en T-SQL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can create views and stored procedures in the SQL analytics endpoint of LH1.
        fr: Vous pouvez créer des vues et des procédures stockées dans le point de terminaison d'analytique SQL de LH1.
    - id: s2
      text:
        en: You can run an UPDATE statement on a table of LH1 through the SQL analytics endpoint of LH1.
        fr: Vous pouvez exécuter une instruction UPDATE sur une table de LH1 via le point de terminaison d'analytique SQL de LH1.
    - id: s3
      text:
        en: A query in WH1 can join a table of WH1 with a table of LH1 by using three-part names.
        fr: Une requête dans WH1 peut joindre une table de WH1 à une table de LH1 à l'aide de noms en trois parties.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The SQL analytics endpoint of a lakehouse supports persistent T-SQL objects such as views, functions and stored procedures. It is read-only over the Delta tables: INSERT, UPDATE and DELETE aren't supported, and data changes go through Spark. Warehouse queries can reference lakehouse tables of the same workspace with three-part names, with no data duplication.
    fr: |
      Le point de terminaison d'analytique SQL d'un lakehouse prend en charge des objets T-SQL persistants comme les vues, les fonctions et les procédures stockées. Il est en lecture seule sur les tables Delta : INSERT, UPDATE et DELETE ne sont pas pris en charge, et les modifications de données passent par Spark. Les requêtes d'un entrepôt peuvent référencer les tables d'un lakehouse du même espace de travail avec des noms en trois parties, sans duplication de données.
references:
  - title: What is the SQL analytics endpoint for a lakehouse?
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sql-analytics-endpoint
  - title: "Microsoft Fabric decision guide: Choose between Warehouse and Lakehouse"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-lakehouse-warehouse
