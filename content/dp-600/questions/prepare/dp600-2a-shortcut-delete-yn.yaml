id: dp600-2a-shortcut-delete-yn
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have the Admin role in a Fabric workspace that contains a lakehouse named LH1. In the Files section of LH1, you create an Azure Data Lake Storage Gen2 shortcut named Archive that points to a directory named archive in a storage account named starchive.

    The shortcut connection uses a service principal that has the Storage Blob Data Contributor role on starchive. The archive directory contains CSV and JSON files.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous avez le rôle Admin dans un espace de travail Fabric qui contient un lakehouse nommé LH1. Dans la section Files de LH1, vous créez un raccourci Azure Data Lake Storage Gen2 nommé Archive qui pointe vers un répertoire nommé archive dans un compte de stockage nommé starchive.

    La connexion du raccourci utilise un principal de service qui a le rôle Storage Blob Data Contributor sur starchive. Le répertoire archive contient des fichiers CSV et JSON.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If you delete the Archive shortcut from LH1, the archive directory and its files are deleted from starchive.
        fr: Si vous supprimez le raccourci Archive de LH1, le répertoire archive et ses fichiers sont supprimés de starchive.
    - id: s2
      text:
        en: If you delete a file inside the Archive shortcut from LH1, the file is deleted from starchive.
        fr: Si vous supprimez un fichier à l'intérieur du raccourci Archive depuis LH1, le fichier est supprimé de starchive.
    - id: s3
      text:
        en: The Archive shortcut exposes the CSV and JSON files even though they are not in Delta format.
        fr: Le raccourci Archive expose les fichiers CSV et JSON même s'ils ne sont pas au format Delta.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Deleting a shortcut removes only the shortcut; the target data is unchanged. Deleting a file or folder through a shortcut deletes it at the target when the identity used has write permission there, which is the case with Storage Blob Data Contributor. A shortcut in the Files section can be at any level and point to data in any format; only Tables shortcuts need Delta data.
    fr: |
      Supprimer un raccourci ne supprime que le raccourci ; les données cibles ne changent pas. Supprimer un fichier ou un dossier via un raccourci le supprime dans la cible si l'identité utilisée y a l'autorisation d'écriture, ce qui est le cas avec Storage Blob Data Contributor. Un raccourci de la section Files peut se trouver à n'importe quel niveau et pointer vers des données de tout format ; seuls les raccourcis de Tables exigent des données Delta.
references:
  - title: Unify Data Sources With OneLake Shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
