id: dp600-2d-sql-insert-target
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a lakehouse named **Lakehouse1** and a warehouse named **Warehouse1**. Lakehouse1 contains a Delta table named **sales**. Warehouse1 contains an empty table named **dbo.SalesSummary**.

    Each night, a T-SQL script must calculate the total sales by region from Lakehouse1.dbo.sales and store the result as rows of a table. The solution must use only T-SQL.

    Which statement should the script run?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé **Lakehouse1** et un entrepôt nommé **Warehouse1**. Lakehouse1 contient une table Delta nommée **sales**. Warehouse1 contient une table vide nommée **dbo.SalesSummary**.

    Chaque nuit, un script T-SQL doit calculer le total des ventes par région à partir de Lakehouse1.dbo.sales et stocker le résultat sous forme de lignes d'une table. La solution doit utiliser uniquement T-SQL.

    Quelle instruction le script doit-il exécuter ?
body:
  options:
    - { id: a, text: { en: "In Warehouse1, run INSERT INTO dbo.SalesSummary SELECT Region, SUM(Amount) FROM Lakehouse1.dbo.sales GROUP BY Region.", fr: "Dans Warehouse1, exécuter INSERT INTO dbo.SalesSummary SELECT Region, SUM(Amount) FROM Lakehouse1.dbo.sales GROUP BY Region." } }
    - { id: b, text: { en: "In the SQL analytics endpoint of Lakehouse1, run INSERT INTO dbo.sales_summary SELECT Region, SUM(Amount) FROM dbo.sales GROUP BY Region.", fr: "Dans le point de terminaison d'analytique SQL de Lakehouse1, exécuter INSERT INTO dbo.sales_summary SELECT Region, SUM(Amount) FROM dbo.sales GROUP BY Region." } }
    - { id: c, text: { en: "In the SQL analytics endpoint of Lakehouse1, run CREATE TABLE dbo.sales_summary AS SELECT Region, SUM(Amount) AS Total FROM dbo.sales GROUP BY Region.", fr: "Dans le point de terminaison d'analytique SQL de Lakehouse1, exécuter CREATE TABLE dbo.sales_summary AS SELECT Region, SUM(Amount) AS Total FROM dbo.sales GROUP BY Region." } }
    - { id: d, text: { en: "In the SQL analytics endpoint of Lakehouse1, run CREATE VIEW dbo.sales_summary AS SELECT Region, SUM(Amount) AS Total FROM dbo.sales GROUP BY Region.", fr: "Dans le point de terminaison d'analytique SQL de Lakehouse1, exécuter CREATE VIEW dbo.sales_summary AS SELECT Region, SUM(Amount) AS Total FROM dbo.sales GROUP BY Region." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A warehouse can read the SQL analytics endpoint of a lakehouse in the same workspace by using a three-part name, and it supports INSERT. Running INSERT ... SELECT in Warehouse1 aggregates the lakehouse data and writes the rows to dbo.SalesSummary.
    fr: |
      Un entrepôt peut lire le point de terminaison d'analytique SQL d'un lakehouse du même espace de travail à l'aide d'un nom en trois parties, et il prend en charge INSERT. Exécuter INSERT ... SELECT dans Warehouse1 agrège les données du lakehouse et écrit les lignes dans dbo.SalesSummary.
  options:
    b: { en: "Insert operations are supported only in a warehouse, not in the SQL analytics endpoint of a lakehouse.", fr: "Les opérations d'insertion ne sont prises en charge que dans un entrepôt, pas dans le point de terminaison d'analytique SQL d'un lakehouse." }
    c: { en: "Creating tables is supported only in a warehouse, not in the SQL analytics endpoint of a lakehouse.", fr: "La création de tables n'est prise en charge que dans un entrepôt, pas dans le point de terminaison d'analytique SQL d'un lakehouse." }
    d: { en: "A view stores only the query definition, so the result isn't stored as rows of a table.", fr: "Une vue ne stocke que la définition de la requête : le résultat n'est pas stocké sous forme de lignes d'une table." }
references:
  - title: Query the warehouse or SQL analytics endpoint
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/query-warehouse
  - title: T-SQL Surface Area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
