id: dp600-2d-filter-statements
objective: "2.2.9"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You filter data in a Fabric workspace by using Power Query in a Dataflow Gen2, PySpark in a notebook, and T-SQL in a warehouse.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous filtrez des données dans un espace de travail Fabric à l'aide de Power Query dans un Dataflow Gen2, de PySpark dans un notebook et de T-SQL dans un entrepôt.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In Power Query, the list of values in the filter menu of a column initially loads at most 1,000 distinct values.
        fr: Dans Power Query, la liste de valeurs du menu de filtre d'une colonne charge au départ au plus 1 000 valeurs distinctes.
    - id: s2
      text:
        en: In PySpark, df.where(condition) returns the same rows as df.filter(condition).
        fr: En PySpark, df.where(condition) renvoie les mêmes lignes que df.filter(condition).
    - id: s3
      text:
        en: In T-SQL, a WHERE clause can filter on SUM(Amount) when the query contains a GROUP BY clause.
        fr: En T-SQL, une clause WHERE peut filtrer sur SUM(Amount) quand la requête contient une clause GROUP BY.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      The filter menu of Power Query loads the top 1,000 distinct values and offers Load more for the next ones. In PySpark, where is an alias of filter, with the same syntax and performance. In T-SQL, WHERE is processed before GROUP BY and can't contain an aggregate; a condition on SUM(Amount) goes in HAVING.
    fr: |
      Le menu de filtre de Power Query charge les 1 000 premières valeurs distinctes et propose Charger plus pour les suivantes. En PySpark, where est un alias de filter, avec la même syntaxe et les mêmes performances. En T-SQL, WHERE est traité avant GROUP BY et ne peut pas contenir d'agrégat ; une condition sur SUM(Amount) se place dans HAVING.
references:
  - title: Filter by values in a column
    url: https://learn.microsoft.com/en-us/power-query/filter-values
  - title: SELECT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-transact-sql
