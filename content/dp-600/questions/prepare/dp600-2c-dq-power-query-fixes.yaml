id: dp600-2c-dq-power-query-fixes
objective: "2.2.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are cleaning a query named **Orders** in a Dataflow Gen2. You have the following requirements:

    - Review the rows whose OrderID appears more than once before deciding what to do with them.
    - Replace the conversion errors of the Amount column with 0.
    - Delete the rows whose Quantity value couldn't be converted to a number.
    - Show the value **Unknown** instead of null in the Region column.

    Which Power Query command should you use for each requirement? To answer, drag the appropriate commands to the correct requirements. Each command may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous nettoyez une requête nommée **Orders** dans un Dataflow Gen2. Vous avez les exigences suivantes :

    - Examiner les lignes dont l'OrderID apparaît plusieurs fois avant de décider quoi en faire.
    - Remplacer par 0 les erreurs de conversion de la colonne Amount.
    - Supprimer les lignes dont la valeur Quantity n'a pas pu être convertie en nombre.
    - Afficher la valeur **Unknown** au lieu de null dans la colonne Region.

    Quelle commande Power Query devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les commandes appropriées vers les exigences correspondantes. Chaque commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: keepdup, text: { en: "Keep duplicates", fr: "Conserver les doublons" } }
    - { id: removedup, text: { en: "Remove duplicates", fr: "Supprimer les doublons" } }
    - { id: replaceerr, text: { en: "Replace errors", fr: "Remplacer les erreurs" } }
    - { id: removeerr, text: { en: "Remove errors", fr: "Supprimer les erreurs" } }
    - { id: replaceval, text: { en: "Replace values", fr: "Remplacer les valeurs" } }
    - { id: filldown, text: { en: "Fill down", fr: "Remplir vers le bas" } }
  targets:
    - { id: t1, text: { en: "Review the repeated OrderID rows", fr: "Examiner les lignes d'OrderID répétés" } }
    - { id: t2, text: { en: "Amount errors become 0", fr: "Les erreurs de Amount deviennent 0" } }
    - { id: t3, text: { en: "Delete the rows with a Quantity error", fr: "Supprimer les lignes avec une erreur de Quantity" } }
    - { id: t4, text: { en: "Null regions become Unknown", fr: "Les régions null deviennent Unknown" } }
answer:
  mapping: { t1: keepdup, t2: replaceerr, t3: removeerr, t4: replaceval }
explanation:
  correct:
    en: "Keep duplicates on OrderID returns only the rows whose OrderID appears more than once, which is useful for review. Replace errors substitutes a value for each cell-level error, and Remove errors deletes the rows that contain an error in the selected column. Replace values replaces null with Unknown in the selected column."
    fr: "Conserver les doublons sur OrderID ne renvoie que les lignes dont l'OrderID apparaît plusieurs fois, ce qui est utile pour un examen. Remplacer les erreurs substitue une valeur à chaque erreur au niveau de la cellule, et Supprimer les erreurs supprime les lignes qui contiennent une erreur dans la colonne sélectionnée. Remplacer les valeurs remplace null par Unknown dans la colonne sélectionnée."
  options:
    removedup: { en: "Remove duplicates deletes the repeated rows instead of showing them for review.", fr: "Supprimer les doublons supprime les lignes répétées au lieu de les afficher pour examen." }
    filldown: { en: "Fill down copies the value above into null cells; it doesn't write Unknown.", fr: "Remplir vers le bas copie la valeur du dessus dans les cellules null ; il n'écrit pas Unknown." }
references:
  - title: Working with duplicate values
    url: https://learn.microsoft.com/en-us/power-query/working-with-duplicates
  - title: Dealing with errors in Power Query
    url: https://learn.microsoft.com/en-us/power-query/dealing-with-errors
