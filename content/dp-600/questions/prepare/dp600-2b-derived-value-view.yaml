id: dp600-2b-derived-value-view
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named Warehouse1 that contains a table named dbo.FactSales with SalesAmount and CostAmount columns. Rows of dbo.FactSales are sometimes corrected by UPDATE statements.

    Analysts need a Margin value equal to SalesAmount minus CostAmount. Margin must always match the current values of each row, and you must not change the existing load and correction processes.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé Warehouse1 qui contient une table nommée dbo.FactSales avec des colonnes SalesAmount et CostAmount. Des lignes de dbo.FactSales sont parfois corrigées par des instructions UPDATE.

    Les analystes ont besoin d'une valeur Margin égale à SalesAmount moins CostAmount. Margin doit toujours correspondre aux valeurs actuelles de chaque ligne, et vous ne devez pas modifier les processus existants de chargement et de correction.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add Margin to dbo.FactSales as a computed column.", fr: "Ajouter Margin à dbo.FactSales comme colonne calculée." } }
    - { id: b, text: { en: "Add Margin to dbo.FactSales as a nullable column, and populate it with a nightly UPDATE.", fr: "Ajouter Margin à dbo.FactSales comme colonne acceptant les valeurs Null, et la renseigner par un UPDATE nocturne." } }
    - { id: c, text: { en: "Create a table with CREATE TABLE AS SELECT that adds Margin to the columns of dbo.FactSales.", fr: "Créer une table avec CREATE TABLE AS SELECT qui ajoute Margin aux colonnes de dbo.FactSales." } }
    - { id: d, text: { en: "Create a view that selects the columns of dbo.FactSales and SalesAmount - CostAmount AS Margin.", fr: "Créer une vue qui sélectionne les colonnes de dbo.FactSales et SalesAmount - CostAmount AS Margin." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Fabric Data Warehouse doesn't support computed columns, so an expression in a view is the way to expose a derived value that is never stored. The view calculates Margin from the current row values at each query, so corrections are reflected immediately without changing any process.
    fr: |
      Fabric Data Warehouse ne prend pas en charge les colonnes calculées : une expression dans une vue est le moyen d'exposer une valeur dérivée jamais stockée. La vue calcule Margin à partir des valeurs actuelles des lignes à chaque requête : les corrections sont reflétées immédiatement, sans modifier aucun processus.
  options:
    a:
      en: |
        Computed columns are not supported in Fabric Data Warehouse.
      fr: |
        Les colonnes calculées ne sont pas prises en charge dans Fabric Data Warehouse.
    b:
      en: |
        A stored column filled nightly is out of date after each correction until the next run.
      fr: |
        Une colonne stockée renseignée la nuit est périmée après chaque correction, jusqu'à l'exécution suivante.
    c:
      en: |
        CTAS stores a snapshot of the data; later corrections in dbo.FactSales are not reflected in the new table.
      fr: |
        CTAS stocke un instantané des données ; les corrections ultérieures dans dbo.FactSales ne sont pas reflétées dans la nouvelle table.
references:
  - title: Tables in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tables
