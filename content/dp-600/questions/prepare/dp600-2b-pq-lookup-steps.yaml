id: dp600-2b-pq-lookup-steps
objective: "2.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Dataflow Gen2 named DF-Customers that contains two queries:

    - Customers, with columns CustomerID, Name and CountryCode. Its data destination is a lakehouse table.
    - Countries, with columns CountryCode, CountryName and Region.

    You need the Customers table in the lakehouse to include a Region column. Every customer must be kept, even when its CountryCode has no match in Countries.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un Dataflow Gen2 nommé DF-Customers qui contient deux requêtes :

    - Customers, avec les colonnes CustomerID, Name et CountryCode. Sa destination de données est une table de lakehouse.
    - Countries, avec les colonnes CountryCode, CountryName et Region.

    La table Customers du lakehouse doit inclure une colonne Region. Chaque client doit être conservé, même quand son CountryCode n'a pas de correspondance dans Countries.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: merge, text: { en: "In Customers, merge with Countries on CountryCode by using a Left outer join.", fr: "Dans Customers, fusionner avec Countries sur CountryCode en utilisant une jointure externe gauche." } }
    - { id: expand, text: { en: "Expand the new Countries column and select only Region.", fr: "Développer la nouvelle colonne Countries et ne sélectionner que Region." } }
    - { id: publish, text: { en: "Publish the dataflow.", fr: "Publier le dataflow." } }
    - { id: append, text: { en: "In Customers, append the Countries query.", fr: "Dans Customers, ajouter la requête Countries (Append)." } }
    - { id: aggregate, text: { en: "Aggregate the new Countries column to return the first Region.", fr: "Agréger la nouvelle colonne Countries pour renvoyer la première valeur de Region." } }
    - { id: inner, text: { en: "In Countries, merge with Customers on CountryCode by using an Inner join.", fr: "Dans Countries, fusionner avec Customers sur CountryCode en utilisant une jointure interne." } }
answer:
  sequence: [ merge, expand, publish ]
explanation:
  correct:
    en: |
      Merge queries keeps every column of the left table and adds a column that holds the matching rows of the right table as nested tables; a Left outer join keeps all customers. Expanding that column brings Region in as a new column. Publishing the dataflow applies the change, and the next refresh writes the new column to the destination.
    fr: |
      La fusion de requêtes conserve toutes les colonnes de la table de gauche et ajoute une colonne qui contient les lignes correspondantes de la table de droite sous forme de tables imbriquées ; une jointure externe gauche conserve tous les clients. Développer cette colonne ajoute Region comme nouvelle colonne. La publication du dataflow applique la modification, et l'actualisation suivante écrit la nouvelle colonne dans la destination.
  options:
    append: { en: "Append stacks the rows of Countries under Customers instead of adding a column.", fr: "Append empile les lignes de Countries sous celles de Customers au lieu d'ajouter une colonne." }
    aggregate: { en: "Aggregating the merged column is not available in Power Query Online, which only supports expanding it.", fr: "L'agrégation de la colonne fusionnée n'est pas disponible dans Power Query Online, qui ne permet que de la développer." }
    inner: { en: "An inner join drops the customers that have no matching country, and the result would be built in the Countries query.", fr: "Une jointure interne supprime les clients sans pays correspondant, et le résultat serait construit dans la requête Countries." }
references:
  - title: Merge Queries Overview
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-overview
