id: dp600-2d-sql-time-travel
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that uses the default data retention settings. Warehouse1 contains a table named **dbo.DimCustomer** that a pipeline updates every night.

    On November 17, 2026, an auditor asks you for the rows of dbo.DimCustomer exactly as they were on November 1, 2026, at 08:00 UTC. No backup or history table exists.

    Which query should you run?
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui utilise les paramètres de rétention des données par défaut. Warehouse1 contient une table nommée **dbo.DimCustomer** qu'un pipeline met à jour chaque nuit.

    Le 17 novembre 2026, un auditeur vous demande les lignes de dbo.DimCustomer exactement telles qu'elles étaient le 1er novembre 2026 à 08:00 UTC. Il n'existe ni sauvegarde ni table d'historique.

    Quelle requête devez-vous exécuter ?
body:
  options:
    - { id: a, text: "SELECT * FROM dbo.DimCustomer FOR SYSTEM_TIME AS OF '2026-11-01T08:00:00';" }
    - { id: b, text: "SELECT * FROM dbo.DimCustomer WHERE ModifiedDate <= '2026-11-01T08:00:00';" }
    - { id: c, text: "SELECT * FROM dbo.DimCustomer OPTION (FOR TIMESTAMP AS OF '2026-11-01T08:00:00');" }
    - { id: d, text: "SELECT * FROM dbo.DimCustomer AS OF TIMESTAMP '2026-11-01T08:00:00';" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Warehouse time travel uses the `FOR TIMESTAMP AS OF` hint in the `OPTION` clause of a SELECT statement, with a UTC timestamp. The default retention period is 30 days, so November 1 is still available on November 17.
    fr: |
      Le voyage dans le temps de l'entrepôt utilise l'indicateur `FOR TIMESTAMP AS OF` dans la clause `OPTION` d'une instruction SELECT, avec un horodatage UTC. La période de rétention par défaut est de 30 jours : le 1er novembre est encore disponible le 17 novembre.
  options:
    a: { en: "FOR SYSTEM_TIME is the syntax of system-versioned temporal tables, not the time travel syntax of a Fabric warehouse.", fr: "FOR SYSTEM_TIME est la syntaxe des tables temporelles avec contrôle de version système, pas celle du voyage dans le temps d'un entrepôt Fabric." }
    b: { en: "This filter returns the current version of the rows; the values changed since November 1 aren't restored.", fr: "Ce filtre renvoie la version actuelle des lignes ; les valeurs modifiées depuis le 1er novembre ne sont pas restaurées." }
    d: { en: "AS OF TIMESTAMP after the table name isn't the T-SQL syntax of Fabric warehouse time travel.", fr: "AS OF TIMESTAMP après le nom de la table n'est pas la syntaxe T-SQL du voyage dans le temps d'un entrepôt Fabric." }
references:
  - title: Query data as it existed in the past
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/time-travel
