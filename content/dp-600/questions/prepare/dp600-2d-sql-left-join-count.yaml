id: dp600-2d-sql-left-join-count
objective: "2.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains tables named **dbo.DimCustomer** and **dbo.FactOrder**. FactOrder contains one row per order, with the OrderId and CustomerKey columns. Some customers have never placed an order.

    You need a query that returns every customer with the number of orders the customer placed. Customers without orders must be returned with an order count of 0.

    How should you complete the T-SQL query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient des tables nommées **dbo.DimCustomer** et **dbo.FactOrder**. FactOrder contient une ligne par commande, avec les colonnes OrderId et CustomerKey. Certains clients n'ont jamais passé de commande.

    Vous avez besoin d'une requête qui renvoie chaque client avec le nombre de commandes qu'il a passées. Les clients sans commande doivent être renvoyés avec un nombre de commandes égal à 0.

    Comment devez-vous compléter la requête T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT c.CustomerKey,
           c.CustomerName,
           COUNT([[cnt]]) AS OrderCount
    FROM dbo.DimCustomer AS c
    [[join]] dbo.FactOrder AS o
        ON o.CustomerKey = c.CustomerKey
    GROUP BY c.CustomerKey, c.CustomerName;
  slots:
    - id: cnt
      options:
        - { id: star, text: "*" }
        - { id: orderid, text: o.OrderId }
        - { id: custkey, text: c.CustomerKey }
    - id: join
      options:
        - { id: inner, text: INNER JOIN }
        - { id: left, text: LEFT OUTER JOIN }
        - { id: right, text: RIGHT OUTER JOIN }
answer:
  values: { cnt: orderid, join: left }
explanation:
  correct:
    en: "`LEFT OUTER JOIN` keeps every customer, with NULL in the FactOrder columns when the customer has no order. `COUNT(o.OrderId)` ignores those NULL values, so a customer without orders gets 0 and the other customers get their number of orders."
    fr: "`LEFT OUTER JOIN` conserve chaque client, avec NULL dans les colonnes de FactOrder quand le client n'a pas de commande. `COUNT(o.OrderId)` ignore ces valeurs NULL : un client sans commande obtient 0 et les autres clients obtiennent leur nombre de commandes."
  options:
    star: { en: "COUNT(*) counts the row produced by the outer join, so a customer without orders gets 1.", fr: "COUNT(*) compte la ligne produite par la jointure externe : un client sans commande obtient 1." }
    custkey: { en: "c.CustomerKey is never NULL, so a customer without orders gets 1.", fr: "c.CustomerKey n'est jamais NULL : un client sans commande obtient 1." }
    inner: { en: "INNER JOIN removes the customers that have no matching order.", fr: "INNER JOIN supprime les clients qui n'ont aucune commande correspondante." }
    right: { en: "RIGHT OUTER JOIN keeps every order, not every customer.", fr: "RIGHT OUTER JOIN conserve chaque commande, pas chaque client." }
references:
  - title: SELECT - GROUP BY clause (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-group-by-transact-sql
  - title: NULL and UNKNOWN (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/null-and-unknown-transact-sql
