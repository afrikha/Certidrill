id: dp600-2b-ctas-new-table
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse named Warehouse1 that contains a table named dbo.FactSales.

    You need to create a new permanent table named dbo.FactSalesEnriched that contains all the columns and rows of dbo.FactSales plus a GrossAmount column (Quantity * UnitPrice) and an OrderYear column. You must create and fill the table in a single statement, and the column data types must come from the query.

    Which statement should you use?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé Warehouse1 qui contient une table nommée dbo.FactSales.

    Vous devez créer une nouvelle table permanente nommée dbo.FactSalesEnriched qui contient toutes les colonnes et lignes de dbo.FactSales, plus une colonne GrossAmount (Quantity * UnitPrice) et une colonne OrderYear. Vous devez créer et remplir la table en une seule instruction, et les types de données des colonnes doivent venir de la requête.

    Quelle instruction devez-vous utiliser ?
body:
  options:
    - { id: a, text: "CREATE VIEW dbo.FactSalesEnriched AS SELECT s.*, s.Quantity * s.UnitPrice AS GrossAmount, YEAR(s.OrderDate) AS OrderYear FROM dbo.FactSales AS s;" }
    - { id: b, text: "CREATE TABLE dbo.FactSalesEnriched AS SELECT s.*, s.Quantity * s.UnitPrice AS GrossAmount, YEAR(s.OrderDate) AS OrderYear FROM dbo.FactSales AS s;" }
    - { id: c, text: "SELECT s.*, s.Quantity * s.UnitPrice AS GrossAmount, YEAR(s.OrderDate) AS OrderYear INTO #FactSalesEnriched FROM dbo.FactSales AS s;" }
    - { id: d, text: "INSERT INTO dbo.FactSalesEnriched SELECT s.*, s.Quantity * s.UnitPrice AS GrossAmount, YEAR(s.OrderDate) AS OrderYear FROM dbo.FactSales AS s;" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      CREATE TABLE AS SELECT (CTAS) creates a new table and fills it with the result of the SELECT in one statement; the columns and their data types come from the query, so the new columns are typed automatically.
    fr: |
      CREATE TABLE AS SELECT (CTAS) crée une nouvelle table et la remplit avec le résultat du SELECT en une seule instruction ; les colonnes et leurs types de données viennent de la requête, donc les nouvelles colonnes sont typées automatiquement.
  options:
    a:
      en: |
        A view stores no data; it is not a permanent table.
      fr: |
        Une vue ne stocke pas de données ; ce n'est pas une table permanente.
    c:
      en: "#FactSalesEnriched is a session-scoped temporary table, dropped at the end of the session."
      fr: "#FactSalesEnriched est une table temporaire limitée à la session, supprimée à la fin de celle-ci."
    d:
      en: |
        INSERT INTO requires the table to exist already; it doesn't create it.
      fr: |
        INSERT INTO exige que la table existe déjà ; il ne la crée pas.
references:
  - title: Tables in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tables
