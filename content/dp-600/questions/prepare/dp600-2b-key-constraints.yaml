id: dp600-2b-key-constraints
objective: "2.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named Warehouse1 that contains the tables dbo.DimProduct and dbo.FactSales. You need to declare the primary key of dbo.DimProduct and the foreign key from dbo.FactSales, so that modeling tools such as Power BI Desktop can detect the relationship.

    How should you complete the T-SQL statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé Warehouse1 qui contient les tables dbo.DimProduct et dbo.FactSales. Vous devez déclarer la clé primaire de dbo.DimProduct et la clé étrangère depuis dbo.FactSales, pour que des outils de modélisation comme Power BI Desktop détectent la relation.

    Comment devez-vous compléter les instructions T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    ALTER TABLE dbo.DimProduct
        ADD CONSTRAINT PK_DimProduct PRIMARY KEY [[idx]] (ProductKey) [[enf]];

    ALTER TABLE dbo.FactSales
        ADD CONSTRAINT FK_FactSales_DimProduct FOREIGN KEY (ProductKey)
        REFERENCES dbo.DimProduct (ProductKey) [[fk]];
  slots:
    - id: idx
      options:
        - { id: nonclustered, text: NONCLUSTERED }
        - { id: clustered, text: CLUSTERED }
    - id: enf
      options:
        - { id: pknotenforced, text: NOT ENFORCED }
        - { id: pknocheck, text: WITH NOCHECK }
        - { id: pkdupkey, text: "WITH (IGNORE_DUP_KEY = ON)" }
    - id: fk
      options:
        - { id: fknotenforced, text: NOT ENFORCED }
        - { id: fkcascade, text: ON DELETE CASCADE }
        - { id: fknocheck, text: WITH NOCHECK }
answer:
  values: { idx: nonclustered, enf: pknotenforced, fk: fknotenforced }
explanation:
  correct:
    en: |
      Fabric Data Warehouse supports PRIMARY KEY and UNIQUE constraints only when they are NONCLUSTERED and NOT ENFORCED, and FOREIGN KEY constraints only when they are NOT ENFORCED. They are added with ALTER TABLE, not inline in CREATE TABLE. The engine doesn't check them, so the load process must guarantee uniqueness and referential integrity, but tools use them to detect relationships.
    fr: |
      Fabric Data Warehouse prend en charge les contraintes PRIMARY KEY et UNIQUE uniquement si elles sont NONCLUSTERED et NOT ENFORCED, et les contraintes FOREIGN KEY uniquement si elles sont NOT ENFORCED. Elles s'ajoutent avec ALTER TABLE, pas en ligne dans CREATE TABLE. Le moteur ne les vérifie pas : le processus de chargement doit garantir l'unicité et l'intégrité référentielle, mais les outils s'en servent pour détecter les relations.
  options:
    clustered: { en: "Primary keys must be NONCLUSTERED.", fr: "Les clés primaires doivent être NONCLUSTERED." }
    pknocheck: { en: "Constraints must be declared NOT ENFORCED.", fr: "Les contraintes doivent être déclarées NOT ENFORCED." }
    pkdupkey: { en: "Constraints must be declared NOT ENFORCED; index options don't apply.", fr: "Les contraintes doivent être déclarées NOT ENFORCED ; les options d'index ne s'appliquent pas." }
    fkcascade: { en: "Foreign keys are not enforced, so cascading actions can't apply; the constraint must be NOT ENFORCED.", fr: "Les clés étrangères ne sont pas appliquées : les actions en cascade ne peuvent pas s'appliquer ; la contrainte doit être NOT ENFORCED." }
    fknocheck: { en: "Foreign keys must be declared NOT ENFORCED.", fr: "Les clés étrangères doivent être déclarées NOT ENFORCED." }
references:
  - title: Primary, Foreign, and Unique Keys
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/table-constraints
