id: dp600-2b-enrich-statements
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are adding columns and tables to a Fabric warehouse named Warehouse1 by using T-SQL.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ajoutez des colonnes et des tables à un entrepôt Fabric nommé Warehouse1 avec T-SQL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A table created with CREATE TABLE AS SELECT gets its columns and their data types from the SELECT statement.
        fr: |
          Une table créée avec CREATE TABLE AS SELECT obtient ses colonnes et leurs types de données de l'instruction SELECT.
    - id: s2
      text:
        en: |
          You can remove a column from a table by using ALTER TABLE ... DROP COLUMN.
        fr: |
          Vous pouvez supprimer une colonne d'une table avec ALTER TABLE ... DROP COLUMN.
    - id: s3
      text:
        en: |
          You can add a column with a DEFAULT constraint so that existing rows receive a value.
        fr: |
          Vous pouvez ajouter une colonne avec une contrainte DEFAULT pour que les lignes existantes reçoivent une valeur.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      CTAS creates and fills a table whose columns and data types come from the query. ALTER TABLE in Fabric Data Warehouse supports adding nullable columns and DROP COLUMN. DEFAULT constraints are not supported, so you populate a new column with an UPDATE.
    fr: |
      CTAS crée et remplit une table dont les colonnes et les types de données viennent de la requête. ALTER TABLE dans Fabric Data Warehouse permet d'ajouter des colonnes acceptant les valeurs Null et de supprimer des colonnes avec DROP COLUMN. Les contraintes DEFAULT ne sont pas prises en charge : vous renseignez une nouvelle colonne avec un UPDATE.
references:
  - title: T-SQL Surface Area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
  - title: Primary, Foreign, and Unique Keys
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/table-constraints
