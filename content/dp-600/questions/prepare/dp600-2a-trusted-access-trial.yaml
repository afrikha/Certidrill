id: dp600-2a-trusted-access-trial
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace2 that is assigned to a Fabric trial capacity. Workspace2 has a workspace identity that has the Storage Blob Data Contributor role on an Azure Data Lake Storage Gen2 account named stlogs.

    Public network access is disabled on stlogs. A resource instance rule for Workspace2 was added to stlogs by using an ARM template.

    When you try to create an ADLS Gen2 shortcut to stlogs in a lakehouse of Workspace2 by using the Workspace identity authentication kind, access is denied.

    You need to create the shortcut by using trusted workspace access.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace2, affecté à une capacité d'évaluation (trial) Fabric. Workspace2 possède une identité d'espace de travail qui a le rôle Storage Blob Data Contributor sur un compte Azure Data Lake Storage Gen2 nommé stlogs.

    L'accès réseau public est désactivé sur stlogs. Une règle d'instance de ressource pour Workspace2 a été ajoutée à stlogs à l'aide d'un modèle ARM.

    Lorsque vous essayez de créer un raccourci ADLS Gen2 vers stlogs dans un lakehouse de Workspace2 avec le type d'authentification Workspace identity, l'accès est refusé.

    Vous devez créer le raccourci en utilisant l'accès approuvé à l'espace de travail (trusted workspace access).

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the workspace identity the Contributor role on stlogs.", fr: "Attribuer à l'identité d'espace de travail le rôle Contributor sur stlogs." } }
    - { id: b, text: { en: "Assign Workspace2 to a purchased Fabric F SKU capacity.", fr: "Affecter Workspace2 à une capacité Fabric F SKU achetée." } }
    - { id: c, text: { en: "Create the shortcut with the Organizational account authentication kind.", fr: "Créer le raccourci avec le type d'authentification Organizational account." } }
    - { id: d, text: { en: "Enable the trusted service exception on the firewall of stlogs.", fr: "Activer l'exception de service approuvé sur le pare-feu de stlogs." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Trusted workspace access works only for workspaces on a purchased F SKU capacity; trial capacities are not supported. The identity, its data role and the resource instance rule are already correct, so moving Workspace2 to an F SKU capacity is the missing requirement.
    fr: |
      L'accès approuvé à l'espace de travail ne fonctionne que pour les espaces de travail affectés à une capacité F SKU achetée ; les capacités d'évaluation ne sont pas prises en charge. L'identité, son rôle de données et la règle d'instance de ressource sont déjà corrects : affecter Workspace2 à une capacité F SKU est la condition manquante.
  options:
    a:
      en: Contributor is a management-plane role; the identity already has a data role (Storage Blob Data Contributor), which is what shortcuts need.
      fr: Contributor est un rôle du plan de gestion ; l'identité a déjà un rôle de données (Storage Blob Data Contributor), qui est ce dont les raccourcis ont besoin.
    c:
      en: The authentication kind does not change the network path; the request is still blocked because the capacity does not support trusted workspace access.
      fr: Le type d'authentification ne change pas le chemin réseau ; la requête reste bloquée, car la capacité ne prend pas en charge l'accès approuvé à l'espace de travail.
    d:
      en: The trusted service exception also applies only to workspaces on F SKU capacities, and Microsoft recommends resource instance rules instead.
      fr: L'exception de service approuvé ne s'applique elle aussi qu'aux espaces de travail sur des capacités F SKU, et Microsoft recommande plutôt les règles d'instance de ressource.
references:
  - title: Trusted workspace access in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/security/security-trusted-workspace-access
