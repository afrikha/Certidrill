id: dp600-2c-agg-monthly-sequence
objective: "2.2.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Dataflow Gen2 that contains a query named **Sales** imported from CSV files. The query has the columns StoreID, OrderDate and Amount. OrderDate is currently a text column.

    You need the query to return one row per store and calendar month, with the total amount, and to keep only the rows whose total amount exceeds 1,000. The month must be represented by a column named **MonthStart** that contains the first day of the month.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un Dataflow Gen2 qui contient une requête nommée **Sales** importée depuis des fichiers CSV. La requête possède les colonnes StoreID, OrderDate et Amount. OrderDate est actuellement une colonne de texte.

    La requête doit renvoyer une ligne par magasin et par mois civil, avec le montant total, et ne conserver que les lignes dont le montant total dépasse 1 000. Le mois doit être représenté par une colonne nommée **MonthStart** qui contient le premier jour du mois.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: type, text: { en: "Change the type of OrderDate to Date.", fr: "Changer le type de OrderDate en Date." } }
    - { id: month, text: { en: "Add a custom column named MonthStart that returns Date.StartOfMonth([OrderDate]).", fr: "Ajouter une colonne personnalisée nommée MonthStart qui renvoie Date.StartOfMonth([OrderDate])." } }
    - { id: group, text: { en: "Group by StoreID and MonthStart, with a Sum of Amount named TotalAmount.", fr: "Grouper par StoreID et MonthStart, avec une Somme de Amount nommée TotalAmount." } }
    - { id: filter, text: { en: "Filter the rows to keep those where TotalAmount is greater than 1,000.", fr: "Filtrer les lignes pour conserver celles dont TotalAmount est supérieur à 1 000." } }
    - { id: pivot, text: { en: "Pivot the MonthStart column by using Amount as the values column.", fr: "Faire pivoter la colonne MonthStart en utilisant Amount comme colonne de valeurs." } }
    - { id: dedup, text: { en: "Remove the duplicates of the StoreID column.", fr: "Supprimer les doublons de la colonne StoreID." } }
answer:
  sequence: [ type, month, group, filter ]
explanation:
  correct:
    en: "Date.StartOfMonth needs a date value, so OrderDate must be converted first. The MonthStart column must exist before you can group by it. The filter uses TotalAmount, which only exists after the Group by step, so it comes last; it filters groups, like HAVING in SQL."
    fr: "Date.StartOfMonth exige une valeur de date : OrderDate doit d'abord être converti. La colonne MonthStart doit exister avant de pouvoir regrouper sur elle. Le filtre utilise TotalAmount, qui n'existe qu'après l'étape Grouper par : il vient donc en dernier et filtre des groupes, comme HAVING en SQL."
  options:
    pivot: { en: "Pivoting creates one column per month instead of one row per store and month.", fr: "Le pivot crée une colonne par mois au lieu d'une ligne par magasin et par mois." }
    dedup: { en: "Removing duplicates keeps one arbitrary row per store and loses the amounts of the other rows.", fr: "Supprimer les doublons conserve une ligne arbitraire par magasin et perd les montants des autres lignes." }
references:
  - title: Grouping or summarizing rows
    url: https://learn.microsoft.com/en-us/power-query/group-by
