id: dp600-2c-denorm-header-detail
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse named **WH1** that contains two staging tables loaded from an order system:

    - **stg.SalesOrderHeader**: SalesOrderID, OrderDate, CustomerID
    - **stg.SalesOrderDetail**: SalesOrderID, LineNumber, ProductID, Quantity, LineAmount

    You need to design a star schema fact table for sales. Users must analyze sales amounts by product, order date and customer, and each dimension must relate directly to the fact table.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé **WH1** qui contient deux tables de préproduction chargées depuis un système de commandes :

    - **stg.SalesOrderHeader** : SalesOrderID, OrderDate, CustomerID
    - **stg.SalesOrderDetail** : SalesOrderID, LineNumber, ProductID, Quantity, LineAmount

    Vous devez concevoir une table de faits de schéma en étoile pour les ventes. Les utilisateurs doivent analyser les montants des ventes par produit, date de commande et client, et chaque dimension doit être liée directement à la table de faits.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a DimSalesOrder table from the header table, and relate it to a fact table built from the detail table.", fr: "Créer une table DimSalesOrder à partir de la table d'en-têtes, puis la relier à une table de faits construite à partir de la table de détail." }
    - id: b
      text: { en: "Aggregate the detail table to one row per order, and join the result to the header table to build the fact table.", fr: "Agréger la table de détail à une ligne par commande, puis joindre le résultat à la table d'en-têtes pour construire la table de faits." }
    - id: c
      text: { en: "Append the header table to the detail table, and use the combined table as the fact table.", fr: "Ajouter la table d'en-têtes à la table de détail, puis utiliser la table combinée comme table de faits." }
    - id: d
      text: { en: "Join the detail table to the header table, and store the order date and customer keys on each order line row.", fr: "Joindre la table de détail à la table d'en-têtes, puis stocker les clés de date de commande et de client sur chaque ligne de commande." }
answer: { optionId: d }
explanation:
  correct:
    en: "The fact table keeps the order line grain, which product analysis needs, and the header attributes are pushed down to each line. The date, customer and product dimensions then all relate directly to the fact table, which forms a star."
    fr: "La table de faits conserve le grain de la ligne de commande, nécessaire à l'analyse par produit, et les attributs de l'en-tête sont reportés sur chaque ligne. Les dimensions de date, de client et de produit sont alors toutes liées directement à la table de faits, ce qui forme une étoile."
  options:
    a: { en: "The customer and date would relate to DimSalesOrder, not directly to the fact table, which creates a snowflake.", fr: "Le client et la date seraient liés à DimSalesOrder et non directement à la table de faits, ce qui crée un flocon." }
    b: { en: "Aggregating to one row per order loses the product of each line, so sales can't be analyzed by product.", fr: "L'agrégation à une ligne par commande perd le produit de chaque ligne : les ventes ne peuvent plus être analysées par produit." }
    c: { en: "Append stacks rows of tables with the same columns; it doesn't add the header columns to the detail rows.", fr: "L'ajout empile les lignes de tables aux colonnes identiques ; il n'ajoute pas les colonnes d'en-tête aux lignes de détail." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Fact tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-fact-tables
  - title: Understand star schema and the importance for Power BI
    url: https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
