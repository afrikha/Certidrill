id: dp600-2b-proc-temp-table
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are writing a stored procedure in a Fabric warehouse named Warehouse1. The procedure must store an intermediate result set, use it in two later statements, and discard it automatically when the session ends. Other sessions must not see the intermediate data.

    What should you use to store the intermediate result set?
  fr: |
    Vous écrivez une procédure stockée dans un entrepôt Fabric nommé Warehouse1. La procédure doit stocker un jeu de résultats intermédiaire, l'utiliser dans deux instructions ultérieures et le supprimer automatiquement à la fin de la session. Les autres sessions ne doivent pas voir les données intermédiaires.

    Que devez-vous utiliser pour stocker le jeu de résultats intermédiaire ?
body:
  options:
    - { id: a, text: { en: "A global temporary table, such as ##OrdersStage", fr: "Une table temporaire globale, comme ##OrdersStage" } }
    - { id: b, text: { en: "A table in a schema named stg, such as stg.OrdersStage", fr: "Une table d'un schéma nommé stg, comme stg.OrdersStage" } }
    - { id: c, text: { en: "A view, such as dbo.vOrdersStage", fr: "Une vue, comme dbo.vOrdersStage" } }
    - { id: d, text: { en: "A session-scoped temporary table, such as #OrdersStage", fr: "Une table temporaire de session, comme #OrdersStage" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Fabric Data Warehouse supports session-scoped #temp tables. They are visible only to the session that creates them and are dropped when the session ends.
    fr: |
      Fabric Data Warehouse prend en charge les tables temporaires #temp limitées à la session. Elles ne sont visibles que par la session qui les crée et sont supprimées à la fin de celle-ci.
  options:
    a:
      en: |
        Global temporary tables are not supported in Fabric Data Warehouse, and they would be visible to other sessions.
      fr: |
        Les tables temporaires globales ne sont pas prises en charge dans Fabric Data Warehouse, et elles seraient visibles par les autres sessions.
    b:
      en: |
        A permanent staging table persists after the session and is visible to other sessions with access to the schema.
      fr: |
        Une table de staging permanente subsiste après la session et est visible par les autres sessions qui ont accès au schéma.
    c:
      en: |
        A view stores no data; it would rerun its query each time and is visible to other users.
      fr: |
        Une vue ne stocke pas de données ; elle réexécuterait sa requête à chaque fois et elle est visible par les autres utilisateurs.
references:
  - title: Tables in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tables
