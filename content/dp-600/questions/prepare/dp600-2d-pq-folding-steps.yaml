id: dp600-2d-pq-folding-steps
objective: "2.2.9"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have a Dataflow Gen2 named **Dataflow1** that contains a query on the **dbo.Sales** table of an Azure SQL database. The applied steps of the query are shown in the following table.

    The query takes a long time to refresh because Power Query downloads every row of dbo.Sales.

    Answer each prompt by selecting the appropriate step.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un Dataflow Gen2 nommé **Dataflow1** qui contient une requête sur la table **dbo.Sales** d'une base de données Azure SQL. Les étapes appliquées de la requête figurent dans le tableau suivant.

    L'actualisation de la requête est longue, car Power Query télécharge toutes les lignes de dbo.Sales.

    Répondez à chaque consigne en sélectionnant l'étape appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The first step that the data source can't evaluate", fr: "La première étape que la source de données ne peut pas évaluer" }
    - id: p2
      text: { en: "The step to move before that step so that fewer rows are transferred", fr: "L'étape à placer avant cette étape pour transférer moins de lignes" }
  grid:
    header: [{ en: "Order", fr: "Ordre" }, { en: "Applied step", fr: "Étape appliquée" }, { en: "Operation", fr: "Opération" }]
    rows:
      - [{ text: "1" }, { text: Source, area: source }, { text: { en: "Connect to the Azure SQL database", fr: "Connexion à la base de données Azure SQL" } }]
      - [{ text: "2" }, { text: Navigation, area: nav }, { text: { en: "Select the dbo.Sales table", fr: "Sélection de la table dbo.Sales" } }]
      - [{ text: "3" }, { text: Removed other columns, area: cols }, { text: { en: "Keep six columns", fr: "Conservation de six colonnes" } }]
      - [{ text: "4" }, { text: Capitalized each word, area: caps }, { text: { en: "Capitalize each word in CustomerName", fr: "Mise en majuscule de chaque mot de CustomerName" } }]
      - [{ text: "5" }, { text: Filtered rows, area: filter }, { text: { en: "Keep the rows where OrderDate is on or after 2026-01-01", fr: "Conservation des lignes où OrderDate est postérieur ou égal au 2026-01-01" } }]
answer:
  values: { p1: caps, p2: filter }
explanation:
  correct:
    en: |
      Capitalize each word can't be translated to a native SQL query, so it doesn't fold, and every step that depends on it, including Filtered rows, runs in the Power Query engine after all the rows are downloaded. Moving Filtered rows before Capitalized each word lets the source apply the date filter, so only the 2026 rows are transferred.
    fr: |
      Mettre en majuscule chaque mot ne peut pas être traduit en requête SQL native : l'étape n'est pas repliée, et toutes les étapes qui en dépendent, dont Filtered rows, s'exécutent dans le moteur Power Query après le téléchargement de toutes les lignes. Placer Filtered rows avant Capitalized each word permet à la source d'appliquer le filtre de date : seules les lignes de 2026 sont transférées.
references:
  - title: Query folding indicators in Power Query
    url: https://learn.microsoft.com/en-us/power-query/step-folding-indicators
  - title: Overview of query evaluation and query folding in Power Query
    url: https://learn.microsoft.com/en-us/power-query/query-folding-basics
