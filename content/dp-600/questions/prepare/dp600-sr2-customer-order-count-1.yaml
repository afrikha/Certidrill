stem:
  en: You use a LEFT OUTER JOIN with the date filter in the ON clause and COUNT(*).
  fr: Vous utilisez un LEFT OUTER JOIN avec le filtre de date dans la clause ON et COUNT(*).
body:
  solution:
    en: |
      You run the following query.

      ```sql
      SELECT c.CustomerKey, c.CustomerName, COUNT(*) AS Orders2026
      FROM dbo.DimCustomer AS c
      LEFT OUTER JOIN dbo.FactOrder AS o
          ON o.CustomerKey = c.CustomerKey
          AND o.OrderDate >= '2026-01-01' AND o.OrderDate < '2027-01-01'
      GROUP BY c.CustomerKey, c.CustomerName;
      ```
    fr: |
      Vous exécutez la requête suivante.

      ```sql
      SELECT c.CustomerKey, c.CustomerName, COUNT(*) AS Orders2026
      FROM dbo.DimCustomer AS c
      LEFT OUTER JOIN dbo.FactOrder AS o
          ON o.CustomerKey = c.CustomerKey
          AND o.OrderDate >= '2026-01-01' AND o.OrderDate < '2027-01-01'
      GROUP BY c.CustomerKey, c.CustomerName;
      ```
answer: { value: false }
explanation:
  correct:
    en: The LEFT OUTER JOIN keeps every customer, and a customer without a 2026 order gets one row whose FactOrder columns are NULL. COUNT(*) counts rows, including rows that contain NULL values, so these customers are returned with 1 instead of 0. COUNT(o.OrderKey) would count only the matched orders.
    fr: "Le LEFT OUTER JOIN conserve tous les clients, et un client sans commande en 2026 obtient une ligne dont les colonnes de FactOrder sont NULL. COUNT(*) compte les lignes, y compris celles qui contiennent des valeurs NULL : ces clients sont renvoyés avec 1 au lieu de 0. COUNT(o.OrderKey) ne compterait que les commandes correspondantes."
references:
  - title: COUNT (Transact-SQL)
