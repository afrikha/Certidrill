id: dp600-2d-directlake-binary-key
objective: "2.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a lakehouse named **Lakehouse1** that contains two Delta tables named **orders** and **customer**. A notebook loads both tables. In orders, the CustomerGuid column uses the BINARY data type. In customer, the CustomerGuid column uses the STRING data type.

    You create a Direct Lake on SQL semantic model named **Model1** from the SQL analytics endpoint of Lakehouse1. You need to create a relationship between the two tables on CustomerGuid. The queries of Model1 must not fall back to DirectQuery.

    What should you do?
  fr: |
    Vous disposez d'un lakehouse nommé **Lakehouse1** qui contient deux tables Delta nommées **orders** et **customer**. Un notebook charge les deux tables. Dans orders, la colonne CustomerGuid utilise le type de données BINARY. Dans customer, la colonne CustomerGuid utilise le type de données STRING.

    Vous créez un modèle sémantique Direct Lake sur SQL nommé **Model1** à partir du point de terminaison d'analytique SQL de Lakehouse1. Vous devez créer une relation entre les deux tables sur CustomerGuid. Les requêtes de Model1 ne doivent pas basculer en DirectQuery.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Modify the notebook so that it writes CustomerGuid in orders as a STRING column, and reload the table.", fr: "Modifier le notebook pour qu'il écrive CustomerGuid dans orders sous forme de colonne STRING, puis recharger la table." } }
    - { id: b, text: { en: "Add a calculated column to the orders table of Model1 that converts CustomerGuid to text.", fr: "Ajouter à la table orders de Model1 une colonne calculée qui convertit CustomerGuid en texte." } }
    - { id: c, text: { en: "Create a view in the SQL analytics endpoint that casts CustomerGuid to varchar, and use the view in Model1.", fr: "Créer dans le point de terminaison d'analytique SQL une vue qui convertit CustomerGuid en varchar, puis utiliser la vue dans Model1." } }
    - { id: d, text: { en: "Create the relationship and set its cross-filter direction to Both.", fr: "Créer la relation et définir sa direction de filtrage croisé sur Les deux." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Direct Lake doesn't support binary or GUID columns, and the columns of a relationship must have matching data types. Converting the column to a string in the Delta table, upstream of the model, gives both tables a STRING key that Direct Lake can read without fallback.
    fr: |
      Direct Lake ne prend pas en charge les colonnes binaires ou GUID, et les colonnes d'une relation doivent avoir des types de données identiques. Convertir la colonne en chaîne dans la table Delta, en amont du modèle, donne aux deux tables une clé STRING que Direct Lake peut lire sans basculement.
  options:
    b: { en: "Calculated columns that reference Direct Lake tables aren't supported in a Direct Lake on SQL model.", fr: "Les colonnes calculées qui référencent des tables Direct Lake ne sont pas prises en charge dans un modèle Direct Lake sur SQL." }
    c: { en: "A table based on a SQL view makes Direct Lake on SQL fall back to DirectQuery, which the requirement forbids.", fr: "Une table basée sur une vue SQL fait basculer Direct Lake sur SQL en DirectQuery, ce que l'exigence interdit." }
    d: { en: "The filter direction doesn't change the data types: the binary column is still unsupported and the key types still differ.", fr: "La direction de filtrage ne change pas les types de données : la colonne binaire reste non prise en charge et les types des clés restent différents." }
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
