id: dp600-2a-secure-tab
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You manage several lakehouses in multiple Fabric workspaces. Some of the lakehouses use OneLake security roles to restrict access to tables.

    You need a single experience where you can review the workspace roles and the OneLake security roles across these items, and edit the OneLake security roles.

    What should you use?
  fr: |
    Vous gérez plusieurs lakehouses dans plusieurs espaces de travail Fabric. Certains de ces lakehouses utilisent des rôles de sécurité OneLake pour restreindre l'accès aux tables.

    Vous avez besoin d'une expérience unique où vous pouvez examiner les rôles d'espace de travail et les rôles de sécurité OneLake de ces éléments, et modifier les rôles de sécurité OneLake.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Govern tab of the OneLake catalog", fr: "L'onglet Govern du catalogue OneLake" } }
    - { id: b, text: { en: "The Monitoring hub", fr: "Le hub de surveillance" } }
    - { id: c, text: { en: "The Secure tab of the OneLake catalog", fr: "L'onglet Secure du catalogue OneLake" } }
    - { id: d, text: { en: "The Fabric events page of Real-Time hub", fr: "La page Fabric events du hub Real-Time" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Secure tab of the OneLake catalog gives a unified view of workspace roles and OneLake security roles. From it, you can review access, audit permissions and create, edit or delete security roles.
    fr: |
      L'onglet Secure du catalogue OneLake offre une vue unifiée des rôles d'espace de travail et des rôles de sécurité OneLake. Il permet d'examiner les accès, d'auditer les autorisations et de créer, modifier ou supprimer des rôles de sécurité.
  options:
    a:
      en: The Govern tab shows governance insights and recommended actions, not a view of security roles that you can edit.
      fr: L'onglet Govern affiche des informations de gouvernance et des actions recommandées, pas une vue des rôles de sécurité modifiables.
    b:
      en: The Monitoring hub tracks the runs of Fabric activities; it does not manage access.
      fr: Le hub de surveillance suit les exécutions des activités Fabric ; il ne gère pas les accès.
    d:
      en: Fabric events let you react to events such as item changes or jobs; they do not show or edit roles.
      fr: Les événements Fabric permettent de réagir à des événements comme les modifications d'éléments ou les travaux ; ils n'affichent ni ne modifient les rôles.
references:
  - title: OneLake catalog overview
    url: https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-overview
