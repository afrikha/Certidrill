id: dp600-2b-object-choice
objective: "2.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are designing T-SQL objects for a Fabric warehouse named Warehouse1 that contains dbo.FactSales, dbo.DimProduct and dbo.DimStore.

    Which object should you create for each requirement? To answer, drag the appropriate objects to the correct requirements. Each object may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez des objets T-SQL pour un entrepôt Fabric nommé Warehouse1 qui contient dbo.FactSales, dbo.DimProduct et dbo.DimStore.

    Quel objet devez-vous créer pour chaque exigence ? Pour répondre, faites glisser les objets appropriés vers les exigences correspondantes. Chaque objet peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: view, text: { en: "View", fr: "Vue" } }
    - { id: itvf, text: { en: "Inline table-valued function", fr: "Fonction table inline" } }
    - { id: proc, text: { en: "Stored procedure", fr: "Procédure stockée" } }
    - { id: mlv, text: { en: "Materialized lake view", fr: "Vue matérialisée de lakehouse" } }
    - { id: scalar, text: { en: "Scalar function", fr: "Fonction scalaire" } }
  targets:
    - { id: t1, text: { en: "Expose the join of FactSales and DimProduct under one stable name, always current, without parameters", fr: "Exposer la jointure de FactSales et DimProduct sous un nom stable, toujours à jour, sans paramètre" } }
    - { id: t2, text: { en: "Return the sales rows of one store passed by the caller, as a row set that queries join to DimStore", fr: "Renvoyer les lignes de ventes d'un magasin transmis par l'appelant, sous forme d'ensemble de lignes que les requêtes joignent à DimStore" } }
    - { id: t3, text: { en: "Delete and reinsert the rows of one day in FactSales, called by a pipeline", fr: "Supprimer et réinsérer les lignes d'une journée dans FactSales, appelé par un pipeline" } }
answer:
  mapping: { t1: view, t2: itvf, t3: proc }
explanation:
  correct:
    en: |
      A view is a named, reusable query that stores no data and always returns current rows. An inline table-valued function is a parameterized query used in FROM and joins. A stored procedure accepts parameters and runs several statements, including DML, and a pipeline can call it with the Stored procedure activity. Materialized lake views exist only in lakehouses, and a scalar function returns a single value.
    fr: |
      Une vue est une requête nommée et réutilisable qui ne stocke pas de données et renvoie toujours les lignes actuelles. Une fonction table inline est une requête paramétrée utilisée dans FROM et dans les jointures. Une procédure stockée accepte des paramètres et exécute plusieurs instructions, y compris du DML, et un pipeline peut l'appeler avec l'activité Stored procedure. Les vues matérialisées de lakehouse n'existent que dans les lakehouses, et une fonction scalaire renvoie une seule valeur.
references:
  - title: T-SQL Surface Area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
  - title: Use the Stored Procedure Activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/stored-procedure-activity
