id: dp600-2e-dax-topn-six-rows
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model named **SalesModel** that contains a measure named **Total Sales**. You run the following query in DAX query view.

    ```text
    EVALUATE
        TOPN (
            5,
            SUMMARIZECOLUMNS ( 'Product'[Product], "Sales", [Total Sales] ),
            [Sales], DESC
        )
    ORDER BY [Sales] DESC
    ```

    The query returns six rows.

    What is the cause?
  fr: |
    Vous disposez d'un modèle sémantique nommé **SalesModel** qui contient une mesure nommée **Total Sales**. Vous exécutez la requête suivante dans la vue de requête DAX.

    ```text
    EVALUATE
        TOPN (
            5,
            SUMMARIZECOLUMNS ( 'Product'[Product], "Sales", [Total Sales] ),
            [Sales], DESC
        )
    ORDER BY [Sales] DESC
    ```

    La requête renvoie six lignes.

    Quelle en est la cause ?
body:
  options:
    - id: a
      text: { en: "SUMMARIZECOLUMNS adds a grand total row to the table that TOPN receives.", fr: "SUMMARIZECOLUMNS ajoute une ligne de total général à la table reçue par TOPN." }
    - id: b
      text: { en: "ORDER BY is applied after TOPN and adds the row with a blank product.", fr: "ORDER BY est appliqué après TOPN et ajoute la ligne dont le produit est vide." }
    - id: c
      text: { en: "Two products have the same value of Sales at the fifth position.", fr: "Deux produits ont la même valeur de Sales en cinquième position." }
    - id: d
      text: { en: "TOPN treats its first argument as the index of the last row, starting at zero.", fr: "TOPN traite son premier argument comme l'index de la dernière ligne, en partant de zéro." }
answer: { optionId: c }
explanation:
  correct:
    en: "When rows are tied on the order expression at the N-th position, TOPN returns all the tied rows, so it can return more than N rows. Here two products share the fifth-highest value of Sales."
    fr: "Quand des lignes sont à égalité sur l'expression de tri à la N-ième position, TOPN renvoie toutes les lignes à égalité : il peut donc renvoyer plus de N lignes. Ici, deux produits partagent la cinquième valeur la plus élevée de Sales."
  options:
    a:
      en: "SUMMARIZECOLUMNS adds subtotal rows only when you use ROLLUPADDISSUBTOTAL."
      fr: "SUMMARIZECOLUMNS n'ajoute des lignes de sous-total que si vous utilisez ROLLUPADDISSUBTOTAL."
    b:
      en: "ORDER BY only sorts the rows that TOPN returned; it never adds rows."
      fr: "ORDER BY trie seulement les lignes renvoyées par TOPN ; il n'ajoute jamais de lignes."
    d:
      en: "The first argument of TOPN is the number of rows to return; a value of 0 or less returns an empty table."
      fr: "Le premier argument de TOPN est le nombre de lignes à renvoyer ; une valeur inférieure ou égale à 0 renvoie une table vide."
references:
  - title: TOPN function (DAX)
    url: https://learn.microsoft.com/en-us/dax/topn-function-dax
