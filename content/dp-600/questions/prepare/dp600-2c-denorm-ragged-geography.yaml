id: dp600-2c-denorm-ragged-geography
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You are loading a denormalized dimension table named **DimGeography** in a Fabric warehouse. The table has the columns **Country**, **StateProvince** and **City**, and a semantic model uses them in a **Country > StateProvince > City** hierarchy.

    Some countries in the source, such as New Zealand, have no state or province, so StateProvince is null for their cities.

    Users must be able to drill down from every country to its cities without seeing a blank member or an **Unknown** member. All the cities must stay in the dimension.

    What should you do during the load?
  fr: |
    Vous chargez une table de dimension dénormalisée nommée **DimGeography** dans un entrepôt Fabric. La table possède les colonnes **Country**, **StateProvince** et **City**, et un modèle sémantique les utilise dans une hiérarchie **Country > StateProvince > City**.

    Certains pays de la source, comme la Nouvelle-Zélande, n'ont ni État ni province : StateProvince est null pour leurs villes.

    Les utilisateurs doivent pouvoir descendre de chaque pays jusqu'à ses villes sans voir de membre vide ni de membre **Unknown**. Toutes les villes doivent rester dans la dimension.

    Que devez-vous faire pendant le chargement ?
body:
  options:
    - id: a
      text: { en: "When StateProvince is null, store the value Unknown in StateProvince.", fr: "Quand StateProvince est null, stocker la valeur Unknown dans StateProvince." }
    - id: b
      text: { en: "When StateProvince is null, exclude the row from the dimension.", fr: "Quand StateProvince est null, exclure la ligne de la dimension." }
    - id: c
      text: { en: "When StateProvince is null, store the country name in StateProvince.", fr: "Quand StateProvince est null, stocker le nom du pays dans StateProvince." }
    - id: d
      text: { en: "Move StateProvince to a separate table related to DimGeography.", fr: "Déplacer StateProvince vers une table distincte liée à DimGeography." }
answer: { optionId: c }
explanation:
  correct:
    en: "This is a ragged hierarchy: a city's parent isn't at the level immediately above. Learn recommends repeating the parent's value in the missing level, so for New Zealand the country name is stored in StateProvince and the drill-down shows no blank or Unknown member."
    fr: "Il s'agit d'une hiérarchie déséquilibrée en profondeur (ragged) : le parent d'une ville ne se trouve pas au niveau immédiatement supérieur. Learn recommande de répéter la valeur du parent dans le niveau manquant : pour la Nouvelle-Zélande, le nom du pays est stocké dans StateProvince et l'exploration n'affiche aucun membre vide ni Unknown."
  options:
    a: { en: "The hierarchy would show an Unknown member under New Zealand, which the requirement forbids.", fr: "La hiérarchie afficherait un membre Unknown sous la Nouvelle-Zélande, ce que l'exigence interdit." }
    b: { en: "Excluding the rows removes the cities of those countries from the dimension.", fr: "Exclure les lignes supprime de la dimension les villes de ces pays." }
    d: { en: "A separate table creates a snowflake, and a hierarchy can't use columns from two tables; the null value also remains.", fr: "Une table distincte crée un flocon, et une hiérarchie ne peut pas utiliser les colonnes de deux tables ; la valeur null subsiste en outre." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Dimension tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
