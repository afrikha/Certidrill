id: dp600-2b-sm-shortcut-consume
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a semantic model named SM-Finance that uses Import mode. OneLake integration is turned on for SM-Finance, and the model was refreshed. A lakehouse named Lakehouse1 is in the same workspace.

    Data engineers need to read the Budget table of SM-Finance from a Spark notebook attached to Lakehouse1, as a table under Tables. The solution must not copy the data.

    What should you do?
  fr: |
    Vous disposez d'un modèle sémantique nommé SM-Finance en mode Import. L'intégration OneLake est activée pour SM-Finance, et le modèle a été actualisé. Un lakehouse nommé Lakehouse1 se trouve dans le même espace de travail.

    Les ingénieurs Données doivent lire la table Budget de SM-Finance depuis un notebook Spark attaché à Lakehouse1, sous forme de table dans Tables. La solution ne doit pas copier les données.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run the TMSL export command on SM-Finance by using the XMLA endpoint.", fr: "Exécuter la commande TMSL export sur SM-Finance par le point de terminaison XMLA." } }
    - { id: b, text: { en: "Under Tables in Lakehouse1, create a Microsoft OneLake shortcut to the Budget table of SM-Finance.", fr: "Sous Tables dans Lakehouse1, créer un raccourci Microsoft OneLake vers la table Budget de SM-Finance." } }
    - { id: c, text: { en: "Create a pipeline Copy activity from the SM-Finance folder in OneLake to Lakehouse1.", fr: "Créer une activité Copy de pipeline depuis le dossier SM-Finance de OneLake vers Lakehouse1." } }
    - { id: d, text: { en: "Create a Dataflow Gen2 that reads Budget from SM-Finance and writes it to Lakehouse1.", fr: "Créer un Dataflow Gen2 qui lit Budget dans SM-Finance et l'écrit dans Lakehouse1." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      OneLake integration writes each Import table to a Delta table in the model's folder (ending in .SemanticModel) in OneLake. In Lakehouse explorer, New shortcut > Microsoft OneLake lets you select the semantic model and its tables, which gives the notebook live access to Budget without copying data.
    fr: |
      L'intégration OneLake écrit chaque table Import dans une table Delta du dossier du modèle (qui se termine par .SemanticModel) dans OneLake. Dans l'explorateur du lakehouse, New shortcut > Microsoft OneLake permet de choisir le modèle sémantique et ses tables, ce qui donne au notebook un accès direct à Budget sans copier les données.
  options:
    a:
      en: |
        The export command writes the model data to OneLake, which is already done at each refresh; it doesn't make the table appear in Lakehouse1.
      fr: |
        La commande export écrit les données du modèle dans OneLake, ce qui est déjà fait à chaque actualisation ; elle ne fait pas apparaître la table dans Lakehouse1.
    c:
      en: |
        A Copy activity duplicates the data into the lakehouse, which the requirement forbids.
      fr: |
        Une activité Copy duplique les données dans le lakehouse, ce que l'exigence interdit.
    d:
      en: |
        A dataflow also writes a second copy of the data into the lakehouse.
      fr: |
        Un dataflow écrit lui aussi une seconde copie des données dans le lakehouse.
references:
  - title: Learn about Microsoft OneLake Delta table integration in Power BI and Microsoft Fabric
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/onelake-integration-overview
