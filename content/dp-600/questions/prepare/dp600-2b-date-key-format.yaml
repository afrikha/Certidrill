id: dp600-2b-date-key-format
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are creating a date dimension table named dbo.DimDate in a Fabric warehouse named Warehouse1. The table has one row per day, and fact tables will reference it by its surrogate key, DateKey.

    You need to choose the data type and format of DateKey by following the Microsoft Learn guidance for dimensional modeling in Fabric Warehouse.

    What should you use?
  fr: |
    Vous créez une table de dimension de date nommée dbo.DimDate dans un entrepôt Fabric nommé Warehouse1. La table comporte une ligne par jour, et les tables de faits la référenceront par sa clé de substitution, DateKey.

    Vous devez choisir le type de données et le format de DateKey en suivant les recommandations de Microsoft Learn sur la modélisation dimensionnelle dans Fabric Warehouse.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "bigint IDENTITY values generated when the rows are inserted", fr: "Des valeurs bigint IDENTITY générées à l'insertion des lignes" } }
    - { id: b, text: { en: "varchar(10) values in the dd/MM/yyyy format", fr: "Des valeurs varchar(10) au format dd/MM/yyyy" } }
    - { id: c, text: { en: "datetime2 values that include the time of day", fr: "Des valeurs datetime2 qui incluent l'heure du jour" } }
    - { id: d, text: { en: "int values in the YYYYMMDD format", fr: "Des valeurs int au format YYYYMMDD" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Learn recommends an int surrogate key in the YYYYMMDD format for the date dimension. It is compact, sorts in date order, follows ISO 8601, and can be computed directly from the date during fact loads without a lookup. The natural key uses the date data type, and time of day belongs in a separate time dimension.
    fr: |
      Learn recommande pour la dimension de date une clé de substitution int au format YYYYMMDD. Elle est compacte, se trie dans l'ordre des dates, suit la norme ISO 8601 et peut être calculée directement à partir de la date lors du chargement des faits, sans recherche. La clé naturelle utilise le type de données date, et l'heure du jour relève d'une dimension de temps distincte.
  options:
    a:
      en: |
        Generated keys would require a lookup for every fact row and would not sort in date order.
      fr: |
        Des clés générées exigeraient une recherche pour chaque ligne de faits et ne se trieraient pas dans l'ordre des dates.
    b:
      en: |
        A text key in dd/MM/yyyy format is wider and doesn't sort in date order.
      fr: |
        Une clé texte au format dd/MM/yyyy est plus large et ne se trie pas dans l'ordre des dates.
    c:
      en: |
        The date dimension has one row per day, so it must not include the time of day.
      fr: |
        La dimension de date comporte une ligne par jour : elle ne doit pas inclure l'heure du jour.
references:
  - title: Modeling Dimension Tables in Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
