id: dp600-2b-alter-add-nullable
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named Warehouse1 that contains a table named dbo.DimCustomer with 12 million rows. You need to add a column named LoyaltyTier to dbo.DimCustomer and fill it for every existing row from the AnnualRevenue column. The table must keep its name.

    You run the following statement, and it fails:

    ```sql
    ALTER TABLE dbo.DimCustomer ADD LoyaltyTier varchar(10) NOT NULL;
    ```

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé Warehouse1 qui contient une table nommée dbo.DimCustomer de 12 millions de lignes. Vous devez ajouter une colonne nommée LoyaltyTier à dbo.DimCustomer et la renseigner pour chaque ligne existante à partir de la colonne AnnualRevenue. La table doit conserver son nom.

    Vous exécutez l'instruction suivante, qui échoue :

    ```sql
    ALTER TABLE dbo.DimCustomer ADD LoyaltyTier varchar(10) NOT NULL;
    ```

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add LoyaltyTier as a computed column defined by a CASE expression on AnnualRevenue.", fr: "Ajouter LoyaltyTier comme colonne calculée définie par une expression CASE sur AnnualRevenue." } }
    - { id: b, text: { en: "Add LoyaltyTier by using ALTER TABLE ... ALTER COLUMN with the NOT NULL option.", fr: "Ajouter LoyaltyTier avec ALTER TABLE ... ALTER COLUMN et l'option NOT NULL." } }
    - { id: c, text: { en: "Add LoyaltyTier as a nullable column, and then populate it by using an UPDATE statement.", fr: "Ajouter LoyaltyTier comme colonne acceptant les valeurs Null, puis la renseigner avec une instruction UPDATE." } }
    - { id: d, text: { en: "Add LoyaltyTier as NOT NULL inside an explicit transaction.", fr: "Ajouter LoyaltyTier comme NOT NULL dans une transaction explicite." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In Fabric Data Warehouse, ALTER TABLE ... ADD supports only nullable columns. You add LoyaltyTier as NULL, then run an UPDATE with a CASE expression on AnnualRevenue to set the value of every row. Creating a new table with CREATE TABLE AS SELECT is the alternative when a new table name is acceptable.
    fr: |
      Dans Fabric Data Warehouse, ALTER TABLE ... ADD ne prend en charge que les colonnes acceptant les valeurs Null. Vous ajoutez LoyaltyTier en NULL, puis vous exécutez un UPDATE avec une expression CASE sur AnnualRevenue pour renseigner chaque ligne. Créer une nouvelle table avec CREATE TABLE AS SELECT est l'alternative quand un nouveau nom de table est acceptable.
  options:
    a:
      en: |
        Computed columns are not supported in Fabric Data Warehouse.
      fr: |
        Les colonnes calculées ne sont pas prises en charge dans Fabric Data Warehouse.
    b:
      en: |
        ALTER COLUMN changes an existing column; it can't add a new one.
      fr: |
        ALTER COLUMN modifie une colonne existante ; elle ne peut pas en ajouter une nouvelle.
    d:
      en: |
        A transaction doesn't lift the restriction; ADD still accepts only nullable columns.
      fr: |
        Une transaction ne lève pas la restriction ; ADD n'accepte toujours que des colonnes acceptant les valeurs Null.
references:
  - title: T-SQL Surface Area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
