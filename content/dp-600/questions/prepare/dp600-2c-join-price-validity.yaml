id: dp600-2c-join-price-validity
objective: "2.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric warehouse named **WH1** that contains the following tables:

    - **dbo.FactSales**: OrderID, ProductID, OrderDate, Quantity
    - **dbo.ProductPrice**: ProductID, Price, ValidFrom, ValidTo. Each product has one row per price period. The current row has ValidTo = '9999-12-31'.

    A query joins the two tables with `INNER JOIN ... ON p.ProductID = s.ProductID` and computes `SUM(s.Quantity * p.Price)`. The total is higher than expected for products whose price changed.

    You need each sale to be valued at the price that was valid on its order date.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé **WH1** qui contient les tables suivantes :

    - **dbo.FactSales** : OrderID, ProductID, OrderDate, Quantity
    - **dbo.ProductPrice** : ProductID, Price, ValidFrom, ValidTo. Chaque produit a une ligne par période de prix. La ligne actuelle a ValidTo = '9999-12-31'.

    Une requête joint les deux tables avec `INNER JOIN ... ON p.ProductID = s.ProductID` et calcule `SUM(s.Quantity * p.Price)`. Le total est plus élevé que prévu pour les produits dont le prix a changé.

    Chaque vente doit être valorisée au prix valide à sa date de commande.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add `AND s.OrderDate >= p.ValidFrom AND s.OrderDate < p.ValidTo` to the join condition.", fr: "Ajouter `AND s.OrderDate >= p.ValidFrom AND s.OrderDate < p.ValidTo` à la condition de jointure." }
    - id: b
      text: { en: "Replace the `INNER JOIN` with a `LEFT OUTER JOIN` on the same condition.", fr: "Remplacer le `INNER JOIN` par un `LEFT OUTER JOIN` sur la même condition." }
    - id: c
      text: { en: "Add `DISTINCT` to the query that reads the joined rows.", fr: "Ajouter `DISTINCT` à la requête qui lit les lignes jointes." }
    - id: d
      text: { en: "Add `AND p.ValidTo = '9999-12-31'` to the join condition.", fr: "Ajouter `AND p.ValidTo = '9999-12-31'` à la condition de jointure." }
answer: { optionId: a }
explanation:
  correct:
    en: "ProductID isn't unique in ProductPrice, so each sale matches every price period of its product and is counted several times (fan-out). Adding the validity range to the join makes each sale match exactly one price row, the one valid on its order date."
    fr: "ProductID n'est pas unique dans ProductPrice : chaque vente correspond à toutes les périodes de prix de son produit et est comptée plusieurs fois (démultiplication). Ajouter la plage de validité à la jointure fait correspondre chaque vente à exactement une ligne de prix, celle valide à sa date de commande."
  options:
    b: { en: "A left outer join keeps the same multiple matches, so the rows are still duplicated.", fr: "Une jointure externe gauche conserve les mêmes correspondances multiples : les lignes restent démultipliées." }
    c: { en: "DISTINCT doesn't pick the right price, and it also merges legitimate identical rows.", fr: "DISTINCT ne choisit pas le bon prix, et il fusionne aussi des lignes identiques légitimes." }
    d: { en: "Keeping only the current price values past sales at today's price, not at the price of their order date.", fr: "Ne garder que le prix actuel valorise les ventes passées au prix d'aujourd'hui, et non au prix de leur date de commande." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Load tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
