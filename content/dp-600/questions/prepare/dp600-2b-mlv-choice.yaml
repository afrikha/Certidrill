id: dp600-2b-mlv-choice
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a schema-enabled lakehouse named LH-Retail that implements a medallion architecture. Data engineers write Spark SQL.

    You need to build silver and gold tables from the bronze tables. The results must be stored as Delta tables that any Fabric engine can query, Fabric must determine the refresh order from the dependencies between the tables, and rows that break data quality rules must be dropped. The solution must minimize development effort.

    What should you create?
  fr: |
    Vous disposez d'un lakehouse avec schémas nommé LH-Retail qui implémente une architecture en médaillon. Les ingénieurs Données écrivent en Spark SQL.

    Vous devez créer des tables argent et or à partir des tables bronze. Les résultats doivent être stockés sous forme de tables Delta interrogeables par tous les moteurs Fabric, Fabric doit déterminer l'ordre d'actualisation à partir des dépendances entre les tables, et les lignes qui enfreignent les règles de qualité des données doivent être supprimées. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "Views in the SQL analytics endpoint of LH-Retail", fr: "Des vues dans le point de terminaison d'analytique SQL de LH-Retail" } }
    - { id: b, text: { en: "Stored procedures in the SQL analytics endpoint of LH-Retail", fr: "Des procédures stockées dans le point de terminaison d'analytique SQL de LH-Retail" } }
    - { id: c, text: { en: "Materialized lake views in LH-Retail", fr: "Des vues matérialisées de lakehouse dans LH-Retail" } }
    - { id: d, text: { en: "Notebooks that write the tables with saveAsTable, run by a pipeline", fr: "Des notebooks qui écrivent les tables avec saveAsTable, exécutés par un pipeline" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Materialized lake views are declared in Spark SQL, persisted as Delta tables, and refreshed by Fabric, which tracks the dependencies between views and orders the refreshes. Data quality constraints with ON MISMATCH DROP remove failing rows, and lineage shows the violation counts.
    fr: |
      Les vues matérialisées de lakehouse se déclarent en Spark SQL, sont conservées sous forme de tables Delta et actualisées par Fabric, qui suit les dépendances entre les vues et ordonne les actualisations. Les contraintes de qualité des données avec ON MISMATCH DROP suppriment les lignes en échec, et la traçabilité affiche le nombre de violations.
  options:
    a:
      en: |
        Views store no data, so they are not Delta tables that other engines can read.
      fr: |
        Les vues ne stockent pas de données : ce ne sont pas des tables Delta lisibles par les autres moteurs.
    b:
      en: |
        The SQL analytics endpoint is read-only for lakehouse tables, so a procedure there can't write the silver and gold tables.
      fr: |
        Le point de terminaison d'analytique SQL est en lecture seule pour les tables du lakehouse : une procédure ne peut pas y écrire les tables argent et or.
    d:
      en: |
        Notebooks work, but you must code the quality rules and maintain the execution order in the pipeline yourself.
      fr: |
        Des notebooks fonctionnent, mais vous devez coder les règles de qualité et maintenir vous-même l'ordre d'exécution dans le pipeline.
references:
  - title: Overview of Materialized Lake Views
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/materialized-lake-views/overview-materialized-lake-view
