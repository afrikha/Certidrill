id: dp600-2b-eh-retention
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a KQL database named KQLDB1 that contains a table named MeterReadings. The retention policy of MeterReadings is 30 days. OneLake availability is turned on for the table, and a lakehouse named Lakehouse1 contains a OneLake shortcut to it.

    Data scientists who use Lakehouse1 report that the table contains only the last 30 days of readings. From now on, Lakehouse1 must keep two years of readings. KQL queries in KQLDB1 must keep working on the same table. The solution must minimize development effort.

    What should you do?
  fr: |
    Vous disposez d'une base de données KQL nommée KQLDB1 qui contient une table nommée MeterReadings. La stratégie de rétention de MeterReadings est de 30 jours. La disponibilité OneLake est activée pour la table, et un lakehouse nommé Lakehouse1 contient un raccourci OneLake vers celle-ci.

    Les scientifiques des données qui utilisent Lakehouse1 signalent que la table ne contient que les 30 derniers jours de relevés. Désormais, Lakehouse1 doit conserver deux ans de relevés. Les requêtes KQL de KQLDB1 doivent continuer à fonctionner sur la même table. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the retention policy of MeterReadings to two years.", fr: "Passer la stratégie de rétention de MeterReadings à deux ans." } }
    - { id: b, text: { en: "Turn OneLake availability off and on again, and select Apply to existing tables.", fr: "Désactiver puis réactiver la disponibilité OneLake en sélectionnant Apply to existing tables." } }
    - { id: c, text: { en: "Set TargetLatencyInMinutes to 180 in the mirroring policy of MeterReadings.", fr: "Définir TargetLatencyInMinutes sur 180 dans la stratégie de mise en miroir de MeterReadings." } }
    - { id: d, text: { en: "Turn on query acceleration with a caching period of 730 days.", fr: "Activer l'accélération des requêtes avec une période de mise en cache de 730 jours." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The data retention policy of the KQL database also applies to the OneLake copy; data removed from the table at the end of its retention period is also removed from OneLake. Extending the retention of MeterReadings to two years keeps two years in both KQLDB1 and Lakehouse1, with no new process to build.
    fr: |
      La stratégie de rétention des données de la base KQL s'applique aussi à la copie OneLake ; les données supprimées de la table à la fin de leur période de rétention sont aussi supprimées de OneLake. Porter la rétention de MeterReadings à deux ans conserve deux ans de données à la fois dans KQLDB1 et dans Lakehouse1, sans nouveau processus à créer.
  options:
    b:
      en: |
        Turning availability on again restores what the table contains; it can't bring back readings that retention already removed from the table.
      fr: |
        Réactiver la disponibilité restaure ce que contient la table ; elle ne peut pas faire revenir des relevés que la rétention a déjà supprimés de la table.
    c:
      en: |
        TargetLatencyInMinutes controls the delay before data is written to OneLake, not how long it is kept.
      fr: |
        TargetLatencyInMinutes contrôle le délai avant l'écriture des données dans OneLake, pas leur durée de conservation.
    d:
      en: |
        Query acceleration caches data of OneLake shortcuts in an eventhouse; it doesn't apply to the OneLake copy of a KQL table read by a lakehouse.
      fr: |
        L'accélération des requêtes met en cache les données des raccourcis OneLake d'un eventhouse ; elle ne s'applique pas à la copie OneLake d'une table KQL lue par un lakehouse.
references:
  - title: Turn on OneLake availability for an eventhouse
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-house-onelake-availability
