id: dp600-2b-view-schemabinding
objective: "2.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric warehouse named Warehouse1 that contains a table named dbo.DimProduct. Several semantic models read a view named dbo.vProductCatalog that selects four columns of dbo.DimProduct.

    Developers sometimes drop or alter columns of dbo.DimProduct, which breaks the view. You need to recreate the view so that Warehouse1 rejects any change to dbo.DimProduct that would affect the view definition.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé Warehouse1 qui contient une table nommée dbo.DimProduct. Plusieurs modèles sémantiques lisent une vue nommée dbo.vProductCatalog qui sélectionne quatre colonnes de dbo.DimProduct.

    Des développeurs suppriment ou modifient parfois des colonnes de dbo.DimProduct, ce qui casse la vue. Vous devez recréer la vue pour que Warehouse1 rejette toute modification de dbo.DimProduct qui affecterait la définition de la vue.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE OR ALTER VIEW dbo.vProductCatalog
    [[opt]]
    AS
    SELECT p.ProductKey, p.ProductName, p.Category, p.ListPrice
    FROM [[src]] AS p;
  slots:
    - id: opt
      options:
        - { id: schemabinding, text: WITH SCHEMABINDING }
        - { id: viewmeta, text: WITH VIEW_METADATA }
        - { id: encryption, text: WITH ENCRYPTION }
    - id: src
      options:
        - { id: twopart, text: dbo.DimProduct }
        - { id: onepart, text: DimProduct }
        - { id: threepart, text: Warehouse1.dbo.DimProduct }
answer:
  values: { opt: schemabinding, src: twopart }
explanation:
  correct:
    en: |
      A view created WITH SCHEMABINDING blocks changes to the underlying objects that would affect its definition. Schema binding requires two-part names (schema.object) for every referenced table, view or function, all in the same database. Without it, you would have to run sys.sp_refreshview or fix the view after each change.
    fr: |
      Une vue créée WITH SCHEMABINDING bloque les modifications des objets sous-jacents qui affecteraient sa définition. La liaison au schéma exige des noms en deux parties (schéma.objet) pour chaque table, vue ou fonction référencée, toutes dans la même base de données. Sans elle, il faudrait exécuter sys.sp_refreshview ou corriger la vue après chaque modification.
  options:
    viewmeta: { en: "The Fabric syntax of CREATE VIEW accepts only SCHEMABINDING as a view attribute, and VIEW_METADATA doesn't protect the definition.", fr: "La syntaxe Fabric de CREATE VIEW n'accepte que SCHEMABINDING comme attribut de vue, et VIEW_METADATA ne protège pas la définition." }
    encryption: { en: "The Fabric syntax of CREATE VIEW accepts only SCHEMABINDING, and encryption hides the definition instead of protecting it.", fr: "La syntaxe Fabric de CREATE VIEW n'accepte que SCHEMABINDING, et le chiffrement masque la définition au lieu de la protéger." }
    onepart: { en: "A schema-bound view must reference objects by two-part names.", fr: "Une vue liée au schéma doit référencer les objets par des noms en deux parties." }
    threepart: { en: "A schema-bound view must use two-part names; three-part names are not allowed.", fr: "Une vue liée au schéma doit utiliser des noms en deux parties ; les noms en trois parties ne sont pas autorisés." }
references:
  - title: CREATE VIEW (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-view-transact-sql
  - title: Tables in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tables
