id: dp600-2d-vqe-item-support
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains the following items:

    - A lakehouse named **Lakehouse1**
    - A warehouse named **Warehouse1**
    - A mirrored database named **MirroredDb1**
    - An eventhouse named **Eventhouse1** that contains a KQL database

    A business analyst plans to build no-code queries by using the visual query editor on the data of each item.

    For which item must the analyst use a different query tool?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient les éléments suivants :

    - Un lakehouse nommé **Lakehouse1**
    - Un entrepôt nommé **Warehouse1**
    - Une base de données mise en miroir nommée **MirroredDb1**
    - Un eventhouse nommé **Eventhouse1** qui contient une base de données KQL

    Un analyste métier prévoit de créer des requêtes sans code à l'aide de l'éditeur de requête visuel sur les données de chaque élément.

    Pour quel élément l'analyste doit-il utiliser un autre outil de requête ?
body:
  options:
    - { id: a, text: Lakehouse1 }
    - { id: b, text: Warehouse1 }
    - { id: c, text: MirroredDb1 }
    - { id: d, text: Eventhouse1 }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The visual query editor is available in a warehouse, in the SQL analytics endpoint of a lakehouse and in a mirrored database. A KQL database in an eventhouse is queried with a KQL queryset instead.
    fr: |
      L'éditeur de requête visuel est disponible dans un entrepôt, dans le point de terminaison d'analytique SQL d'un lakehouse et dans une base de données mise en miroir. Une base de données KQL d'un eventhouse s'interroge plutôt avec un ensemble de requêtes KQL.
  options:
    a: { en: "The analyst can use the visual query editor in the SQL analytics endpoint of Lakehouse1.", fr: "L'analyste peut utiliser l'éditeur de requête visuel dans le point de terminaison d'analytique SQL de Lakehouse1." }
    b: { en: "The visual query editor is available in a warehouse.", fr: "L'éditeur de requête visuel est disponible dans un entrepôt." }
    c: { en: "The visual query editor is available in a mirrored database.", fr: "L'éditeur de requête visuel est disponible dans une base de données mise en miroir." }
references:
  - title: Query using the visual query editor
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/visual-query-editor
