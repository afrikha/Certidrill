id: dp600-2a-discoverable-model
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace-Fin that contains a semantic model named SM-Finance.

    User1 has no role in Workspace-Fin, and SM-Finance has not been shared with User1. However, when User1 opens the Explore tab of the OneLake catalog, SM-Finance appears in the list of items, and User1 can request access to it.

    Which configuration of SM-Finance explains this behavior?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace-Fin qui contient un modèle sémantique nommé SM-Finance.

    User1 n'a aucun rôle dans Workspace-Fin, et SM-Finance n'a pas été partagé avec User1. Pourtant, lorsque User1 ouvre l'onglet Explore du catalogue OneLake, SM-Finance apparaît dans la liste des éléments, et User1 peut en demander l'accès.

    Quelle configuration de SM-Finance explique ce comportement ?
body:
  options:
    - { id: a, text: { en: "SM-Finance is endorsed as Promoted.", fr: "SM-Finance est approuvé avec le badge Promoted." } }
    - { id: b, text: { en: "SM-Finance has the General sensitivity label.", fr: "SM-Finance porte l'étiquette de confidentialité General." } }
    - { id: c, text: { en: "SM-Finance is assigned to a domain.", fr: "SM-Finance est affecté à un domaine." } }
    - { id: d, text: { en: "SM-Finance is configured as discoverable.", fr: "SM-Finance est configuré comme détectable." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Explore tab lists the items that you can access or directly request access to, and also the semantic models configured as discoverable, even if you have no access to them. Discoverability lets users find a model and request access without seeing its data.
    fr: |
      L'onglet Explore liste les éléments auxquels vous avez accès ou dont vous pouvez demander directement l'accès, ainsi que les modèles sémantiques configurés comme détectables, même si vous n'y avez pas accès. La détectabilité permet aux utilisateurs de trouver un modèle et d'en demander l'accès sans voir ses données.
  options:
    a:
      en: Endorsement signals quality and trust; it does not make an item visible to users who have no access.
      fr: L'approbation signale la qualité et la confiance ; elle ne rend pas un élément visible aux utilisateurs qui n'y ont pas accès.
    b:
      en: A sensitivity label classifies and protects content; it does not grant visibility in the catalog.
      fr: Une étiquette de confidentialité classe et protège le contenu ; elle n'accorde pas de visibilité dans le catalogue.
    c:
      en: Domains group items for governance and filtering; belonging to a domain does not expose an item to users without access.
      fr: Les domaines regroupent des éléments pour la gouvernance et le filtrage ; appartenir à un domaine n'expose pas un élément aux utilisateurs sans accès.
references:
  - title: Find and explore data in the OneLake catalog
    url: https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-explore
