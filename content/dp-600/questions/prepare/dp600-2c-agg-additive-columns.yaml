id: dp600-2c-agg-additive-columns
objective: "2.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a lakehouse table named **gold_daily_store** with one row per store per day. It contains the following columns, computed from the order-level detail:

    - **TotalSales**: the sum of the order amounts
    - **OrderCount**: the number of orders
    - **DistinctCustomers**: the number of different customers
    - **AvgOrderValue**: the average order amount
    - **LargestOrder**: the largest order amount

    A monthly report will sum gold_daily_store columns across the days of each month.

    Which two columns give correct monthly values when they are summed?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une table de lakehouse nommée **gold_daily_store** avec une ligne par magasin et par jour. Elle contient les colonnes suivantes, calculées à partir du détail des commandes :

    - **TotalSales** : la somme des montants des commandes
    - **OrderCount** : le nombre de commandes
    - **DistinctCustomers** : le nombre de clients différents
    - **AvgOrderValue** : le montant moyen des commandes
    - **LargestOrder** : le montant de la plus grosse commande

    Un rapport mensuel additionnera des colonnes de gold_daily_store sur les jours de chaque mois.

    Quelles sont les deux colonnes qui donnent des valeurs mensuelles correctes quand elles sont additionnées ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: b, text: DistinctCustomers }
    - { id: d, text: AvgOrderValue }
    - { id: a, text: TotalSales }
    - { id: e, text: LargestOrder }
    - { id: c, text: OrderCount }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Sums and counts of events are additive: the monthly total is the sum of the daily totals, and the monthly number of orders is the sum of the daily counts. Distinct counts, averages and maximums aren't additive across days."
    fr: "Les sommes et les nombres d'événements sont additifs : le total mensuel est la somme des totaux quotidiens, et le nombre mensuel de commandes est la somme des nombres quotidiens. Les comptages distincts, les moyennes et les maximums ne sont pas additifs d'un jour à l'autre."
  options:
    b: { en: "A customer who orders on several days would be counted once per day.", fr: "Un client qui commande plusieurs jours serait compté une fois par jour." }
    d: { en: "A sum of averages isn't an average; the monthly average is TotalSales divided by OrderCount.", fr: "Une somme de moyennes n'est pas une moyenne ; la moyenne mensuelle est TotalSales divisé par OrderCount." }
    e: { en: "The monthly largest order is the maximum of the daily values, not their sum.", fr: "La plus grosse commande du mois est le maximum des valeurs quotidiennes, pas leur somme." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Fact tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-fact-tables
