id: dp600-2a-store-lakehouse
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineering team at Proseware processes several terabytes of data per day with PySpark notebooks. The data arrives as Parquet, CSV and JSON files. A group of SQL analysts only needs to read the curated tables with T-SQL.

    You need to recommend a single Fabric data store for the team.

    What should you recommend?
  fr: |
    Une équipe d'ingénierie des données de Proseware traite plusieurs téraoctets de données par jour avec des notebooks PySpark. Les données arrivent sous forme de fichiers Parquet, CSV et JSON. Un groupe d'analystes SQL a seulement besoin de lire les tables organisées en T-SQL.

    Vous devez recommander un seul magasin de données Fabric pour l'équipe.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A lakehouse", fr: "Un lakehouse" } }
    - { id: b, text: { en: "A warehouse", fr: "Un entrepôt" } }
    - { id: c, text: { en: "An eventhouse", fr: "Un eventhouse" } }
    - { id: d, text: { en: "A SQL database", fr: "Une base de données SQL" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A lakehouse stores files of any format and Delta tables, and data engineers work on it with Spark. Its SQL analytics endpoint lets T-SQL users query the Delta tables in read-only mode, which is all the analysts need.
    fr: |
      Un lakehouse stocke des fichiers de tout format et des tables Delta, et les ingénieurs données y travaillent avec Spark. Son point de terminaison d'analytique SQL permet aux utilisateurs T-SQL d'interroger les tables Delta en lecture seule, ce qui suffit aux analystes.
  options:
    b:
      en: A warehouse is written with T-SQL and holds structured data only; it does not store raw files for Spark processing.
      fr: Un entrepôt s'alimente en T-SQL et ne contient que des données structurées ; il ne stocke pas de fichiers bruts pour un traitement Spark.
    c:
      en: An eventhouse targets streaming event data queried with KQL, not batch Spark engineering on files.
      fr: Un eventhouse vise les données d'événements de streaming interrogées en KQL, pas l'ingénierie Spark par lots sur des fichiers.
    d:
      en: A SQL database is an operational store for applications, not a store for terabytes of files processed with Spark.
      fr: Une base de données SQL est un magasin opérationnel pour les applications, pas un magasin pour des téraoctets de fichiers traités avec Spark.
references:
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
