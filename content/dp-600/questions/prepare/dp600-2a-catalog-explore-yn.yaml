id: dp600-2a-catalog-explore-yn
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Users at Fabrikam use the Explore tab of the OneLake catalog to find data before they build new items. The organization uses Fabric domains and endorsement.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les utilisateurs de Fabrikam utilisent l'onglet Explore du catalogue OneLake pour trouver des données avant de créer de nouveaux éléments. L'organisation utilise les domaines Fabric et l'approbation.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Endorsed items filter lists certified items first, followed by promoted items.
        fr: Le filtre Endorsed items liste d'abord les éléments certifiés, puis les éléments promus.
    - id: s2
      text:
        en: The Explore tab lists only the items of workspaces in which the user has a workspace role.
        fr: L'onglet Explore ne liste que les éléments des espaces de travail dans lesquels l'utilisateur a un rôle d'espace de travail.
    - id: s3
      text:
        en: The domain that a user selects in the domain selector stays selected the next time the user opens the OneLake catalog.
        fr: Le domaine qu'un utilisateur sélectionne dans le sélecteur de domaine reste sélectionné la prochaine fois que l'utilisateur ouvre le catalogue OneLake.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The Endorsed items filter shows certified items first, then promoted ones. The Explore tab lists every item the user can access or request access to, including items shared directly with the user and discoverable semantic models, not only items of workspaces where the user has a role. The domain selection persists across sessions.
    fr: |
      Le filtre Endorsed items affiche d'abord les éléments certifiés, puis les éléments promus. L'onglet Explore liste tous les éléments auxquels l'utilisateur a accès ou dont il peut demander l'accès, y compris les éléments partagés directement avec lui et les modèles sémantiques détectables, et pas seulement les éléments des espaces de travail où il a un rôle. La sélection de domaine est conservée d'une session à l'autre.
references:
  - title: Find and explore data in the OneLake catalog
    url: https://learn.microsoft.com/en-us/fabric/governance/onelake-catalog-explore
