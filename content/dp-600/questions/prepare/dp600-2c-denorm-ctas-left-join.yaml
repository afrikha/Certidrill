id: dp600-2c-denorm-ctas-left-join
objective: "2.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named **WH1** that contains the staging tables **stg.Product**, **stg.Subcategory** and **stg.Category**. Some products have a null **SubcategoryID**.

    You need to create a denormalized table named **dbo.DimProduct** that contains one row for every product, with the subcategory and category names. Products without a subcategory must show the value **Not assigned** in the Subcategory column.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé **WH1** qui contient les tables de préproduction **stg.Product**, **stg.Subcategory** et **stg.Category**. Certains produits ont une valeur **SubcategoryID** null.

    Vous devez créer une table dénormalisée nommée **dbo.DimProduct** qui contient une ligne pour chaque produit, avec les noms de sous-catégorie et de catégorie. Les produits sans sous-catégorie doivent afficher la valeur **Not assigned** dans la colonne Subcategory.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE TABLE dbo.DimProduct
    [[ctas]]
    SELECT p.ProductID,
           p.ProductName,
           [[fn]](sc.SubcategoryName, 'Not assigned') AS Subcategory,
           c.CategoryName AS Category
    FROM stg.Product AS p
    [[j1]] stg.Subcategory AS sc
        ON sc.SubcategoryID = p.SubcategoryID
    [[j2]] stg.Category AS c
        ON c.CategoryID = sc.CategoryID;
  slots:
    - id: ctas
      options:
        - { id: as, text: AS }
        - { id: with, text: WITH }
        - { id: into, text: INTO }
        - { id: from, text: FROM }
    - id: fn
      options:
        - { id: coalesce, text: COALESCE }
        - { id: nullif, text: NULLIF }
        - { id: concat, text: CONCAT }
        - { id: trycast, text: TRY_CAST }
    - id: j1
      options:
        - { id: left, text: LEFT OUTER JOIN }
        - { id: inner, text: INNER JOIN }
        - { id: full, text: FULL OUTER JOIN }
        - { id: cross, text: CROSS JOIN }
    - id: j2
      options:
        - { id: left, text: LEFT OUTER JOIN }
        - { id: inner, text: INNER JOIN }
        - { id: full, text: FULL OUTER JOIN }
        - { id: cross, text: CROSS JOIN }
answer:
  values: { ctas: as, fn: coalesce, j1: left, j2: left }
explanation:
  correct:
    en: "`CREATE TABLE ... AS SELECT` (CTAS) creates and fills the table in one statement. Both joins must be `LEFT OUTER JOIN`: a product without a subcategory has a null CategoryID after the first join, so an inner join to Category would drop it. `COALESCE` returns 'Not assigned' when the subcategory name is null."
    fr: "`CREATE TABLE ... AS SELECT` (CTAS) crée et remplit la table en une seule instruction. Les deux jointures doivent être des `LEFT OUTER JOIN` : un produit sans sous-catégorie a un CategoryID null après la première jointure, et une jointure interne vers Category le supprimerait. `COALESCE` renvoie 'Not assigned' quand le nom de sous-catégorie est null."
  options:
    inner: { en: "An inner join removes the products that have no matching subcategory or category.", fr: "Une jointure interne supprime les produits qui n'ont pas de sous-catégorie ou de catégorie correspondante." }
    full: { en: "A full outer join also adds rows for subcategories or categories that have no product, with a null ProductID.", fr: "Une jointure externe complète ajoute aussi des lignes pour les sous-catégories ou catégories sans produit, avec un ProductID null." }
    cross: { en: "A cross join returns every combination of rows and takes no ON condition.", fr: "Une jointure croisée renvoie toutes les combinaisons de lignes et n'accepte pas de condition ON." }
    nullif: { en: "NULLIF returns null when its two arguments are equal; it doesn't replace null values.", fr: "NULLIF renvoie null quand ses deux arguments sont égaux ; il ne remplace pas les valeurs null." }
    concat: { en: "CONCAT would append 'Not assigned' to every subcategory name.", fr: "CONCAT ajouterait 'Not assigned' à la fin de chaque nom de sous-catégorie." }
    into: { en: "INTO belongs to SELECT ... INTO, which is written after the column list, not after CREATE TABLE.", fr: "INTO appartient à SELECT ... INTO, qui s'écrit après la liste des colonnes, pas après CREATE TABLE." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Load tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
  - title: COALESCE (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/coalesce-transact-sql
