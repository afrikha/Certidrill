id: dp600-2a-copy-into-wsid
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named WH1 in a workspace named Workspace1. Workspace1 has a workspace identity that has the Storage Blob Data Reader role on an Azure Data Lake Storage Gen2 account named stcontosoraw.

    You need to load the Parquet files of the raw/orders folder of stcontosoraw into the dbo.Orders table of WH1 by using T-SQL. The statement must use the workspace identity to read the files, and no secret must appear in the code.

    How should you complete the statement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé WH1 dans un espace de travail nommé Workspace1. Workspace1 possède une identité d'espace de travail qui a le rôle Storage Blob Data Reader sur un compte Azure Data Lake Storage Gen2 nommé stcontosoraw.

    Vous devez charger les fichiers Parquet du dossier raw/orders de stcontosoraw dans la table dbo.Orders de WH1 en T-SQL. L'instruction doit utiliser l'identité d'espace de travail pour lire les fichiers, et aucun secret ne doit apparaître dans le code.

    Comment devez-vous compléter l'instruction ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    COPY INTO dbo.Orders
    FROM 'https://stcontosoraw.dfs.core.windows.net/raw/orders/*.parquet'
    WITH (
        FILE_TYPE = [[ft]],
        CREDENTIAL = ([[cred]])
    );
  slots:
    - id: ft
      options:
        - { id: csv, text: "'CSV'" }
        - { id: delta, text: "'DELTA'" }
        - { id: parquet, text: "'PARQUET'" }
        - { id: jsonl, text: "'JSONL'" }
    - id: cred
      options:
        - { id: sas, text: "IDENTITY = 'Shared Access Signature'" }
        - { id: wsid, text: "IDENTITY = 'Workspace Identity'" }
        - { id: key, text: "IDENTITY = 'Storage Account Key'" }
answer:
  values: { ft: parquet, cred: wsid }
explanation:
  correct:
    en: |
      COPY INTO loads CSV, JSONL and Parquet files from ADLS Gen2, Blob Storage or OneLake, so FILE_TYPE = 'PARQUET' matches the files. CREDENTIAL = (IDENTITY = 'Workspace Identity') reads the source with the identity of the workspace that contains WH1 while the statement still runs in the security context of the user, with no secret in the code.
    fr: |
      COPY INTO charge des fichiers CSV, JSONL et Parquet depuis ADLS Gen2, le Stockage Blob ou OneLake : FILE_TYPE = 'PARQUET' correspond aux fichiers. CREDENTIAL = (IDENTITY = 'Workspace Identity') lit la source avec l'identité de l'espace de travail qui contient WH1, tandis que l'instruction s'exécute toujours dans le contexte de sécurité de l'utilisateur, sans secret dans le code.
  options:
    delta: { en: "DELTA is not a file type of COPY INTO.", fr: "DELTA n'est pas un type de fichier de COPY INTO." }
    sas: { en: "A SAS credential requires a SECRET value in the statement.", fr: "Une information d'identification SAS exige une valeur SECRET dans l'instruction." }
    key: { en: "A storage account key credential requires the key as a SECRET in the statement.", fr: "Une information d'identification par clé de compte de stockage exige la clé comme SECRET dans l'instruction." }
references:
  - title: Ingest data into the warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/ingest-data
