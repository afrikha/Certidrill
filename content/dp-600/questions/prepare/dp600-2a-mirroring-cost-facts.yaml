id: dp600-2a-mirroring-cost-facts
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that is assigned to an F64 capacity. You plan to mirror an Azure SQL Managed Instance database named mi-finance into Workspace1 by using database mirroring.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1, affecté à une capacité F64. Vous prévoyez de mettre en miroir une base de données Azure SQL Managed Instance nommée mi-finance dans Workspace1 à l'aide de la mise en miroir de base de données.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Replication continues while the F64 capacity is paused.", fr: "La réplication continue pendant que la capacité F64 est suspendue." } }
    - { id: b, text: { en: "The compute that replicates the data into OneLake does not consume capacity units.", fr: "Le calcul qui réplique les données dans OneLake ne consomme pas d'unités de capacité." } }
    - { id: c, text: { en: "You can update the mirrored tables by running UPDATE statements in the SQL analytics endpoint.", fr: "Vous pouvez mettre à jour les tables en miroir en exécutant des instructions UPDATE dans le point de terminaison d'analytique SQL." } }
    - { id: d, text: { en: "Queries on the mirrored data through the SQL analytics endpoint consume capacity units.", fr: "Les requêtes sur les données en miroir via le point de terminaison d'analytique SQL consomment des unités de capacité." } }
    - { id: e, text: { en: "Mirroring storage is free with no size limit on an F64 capacity.", fr: "Le stockage de mise en miroir est gratuit sans limite de taille sur une capacité F64." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The background compute that replicates data into OneLake is free and doesn't consume capacity, but querying the mirrored data with SQL, Power BI or Spark is billed at the usual rates. Replica storage is free only up to 1 TB per capacity unit (64 TB for an F64), and the capacity must be running for data to replicate.
    fr: |
      Le calcul en arrière-plan qui réplique les données dans OneLake est gratuit et ne consomme pas de capacité, mais l'interrogation des données en miroir avec SQL, Power BI ou Spark est facturée aux tarifs habituels. Le stockage du réplica n'est gratuit que jusqu'à 1 To par unité de capacité (64 To pour une F64), et la capacité doit être en cours d'exécution pour que les données soient répliquées.
  options:
    a:
      en: When the capacity is paused, no data is replicated.
      fr: Quand la capacité est suspendue, aucune donnée n'est répliquée.
    c:
      en: The SQL analytics endpoint of a mirrored database is read-only; you can create views and procedures but not modify the replicated data.
      fr: Le point de terminaison d'analytique SQL d'une base de données en miroir est en lecture seule ; vous pouvez créer des vues et des procédures, mais pas modifier les données répliquées.
    e:
      en: The free mirroring storage is limited to 1 TB per capacity unit, so 64 TB for an F64.
      fr: Le stockage gratuit de mise en miroir est limité à 1 To par unité de capacité, soit 64 To pour une F64.
references:
  - title: What is Mirroring in Fabric?
    url: https://learn.microsoft.com/en-us/fabric/mirroring/overview
  - title: Microsoft Fabric Mirrored Databases from Azure SQL Database
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-sql-database
