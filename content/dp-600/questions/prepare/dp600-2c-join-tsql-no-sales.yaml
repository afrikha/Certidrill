id: dp600-2c-join-tsql-no-sales
objective: "2.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named **WH1** that contains the tables **dbo.DimCustomer** (CustomerKey, CustomerID, CustomerName) and **dbo.FactSales** (SalesKey, CustomerKey, SalesAmount).

    You need a query that returns the customers that have no row in FactSales.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé **WH1** qui contient les tables **dbo.DimCustomer** (CustomerKey, CustomerID, CustomerName) et **dbo.FactSales** (SalesKey, CustomerKey, SalesAmount).

    Vous avez besoin d'une requête qui renvoie les clients qui n'ont aucune ligne dans FactSales.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT c.CustomerID, c.CustomerName
    FROM dbo.DimCustomer AS c
    [[join]] dbo.FactSales AS s
        ON s.CustomerKey = c.CustomerKey
    WHERE [[cond]];
  slots:
    - id: join
      options:
        - { id: left, text: LEFT OUTER JOIN }
        - { id: inner, text: INNER JOIN }
        - { id: right, text: RIGHT OUTER JOIN }
        - { id: cross, text: CROSS JOIN }
    - id: cond
      options:
        - { id: snull, text: s.CustomerKey IS NULL }
        - { id: eqnull, text: s.CustomerKey = NULL }
        - { id: cnull, text: c.CustomerKey IS NULL }
        - { id: neq, text: s.CustomerKey <> c.CustomerKey }
answer:
  values: { join: left, cond: snull }
explanation:
  correct:
    en: "A `LEFT OUTER JOIN` from DimCustomer keeps every customer and returns NULL in the FactSales columns when no sale matches. Filtering on `s.CustomerKey IS NULL` keeps only those unmatched customers, which works like a left anti join."
    fr: "Un `LEFT OUTER JOIN` depuis DimCustomer conserve tous les clients et renvoie NULL dans les colonnes de FactSales quand aucune vente ne correspond. Filtrer sur `s.CustomerKey IS NULL` ne conserve que ces clients sans correspondance, comme une anti-jointure gauche."
  options:
    inner: { en: "An inner join returns only customers that have sales.", fr: "Une jointure interne ne renvoie que les clients qui ont des ventes." }
    right: { en: "A right outer join keeps every sale, not every customer.", fr: "Une jointure externe droite conserve toutes les ventes, pas tous les clients." }
    cross: { en: "A cross join pairs every customer with every sale and takes no ON condition.", fr: "Une jointure croisée associe chaque client à chaque vente et n'accepte pas de condition ON." }
    eqnull: { en: "A comparison with = NULL is never true; use IS NULL.", fr: "Une comparaison avec = NULL n'est jamais vraie ; utilisez IS NULL." }
    cnull: { en: "The customer key from DimCustomer is never null in the result of this join.", fr: "La clé de client de DimCustomer n'est jamais null dans le résultat de cette jointure." }
    neq: { en: "The join already requires equal keys, so this condition is never true for a matched row and unknown for an unmatched one.", fr: "La jointure exige déjà des clés égales : cette condition n'est jamais vraie pour une ligne associée et inconnue pour une ligne sans correspondance." }
references:
  - title: Query the warehouse or SQL analytics endpoint
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/query-warehouse
  - title: Left anti join
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-left-anti
