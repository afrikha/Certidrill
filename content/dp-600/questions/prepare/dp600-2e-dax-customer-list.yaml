id: dp600-2e-dax-customer-list
objective: "2.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model named **CrmModel** that contains a table named **Customer** with the columns **Name**, **City**, **Country** and **Segment**. The values of Segment are Retail, Wholesale and Government.

    You need a DAX query that returns the name and the city of the customers located in France whose segment is Retail or Wholesale. The result must contain only the Name and City columns.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique nommé **CrmModel** qui contient une table nommée **Customer** avec les colonnes **Name**, **City**, **Country** et **Segment**. Les valeurs de Segment sont Retail, Wholesale et Government.

    Vous avez besoin d'une requête DAX qui renvoie le nom et la ville des clients situés en France dont le segment est Retail ou Wholesale. Le résultat doit contenir uniquement les colonnes Name et City.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    EVALUATE
        [[outer]] (
            [[cols]] ( Customer, "Name", Customer[Name], "City", Customer[City] ),
            Customer[Country] = "France",
            [[seg]]
        )
  slots:
    - id: outer
      options:
        - { id: filter, text: FILTER }
        - { id: calctable, text: CALCULATETABLE }
        - { id: addcols, text: ADDCOLUMNS }
        - { id: summcols, text: SUMMARIZECOLUMNS }
    - id: cols
      options:
        - { id: addcolumns, text: ADDCOLUMNS }
        - { id: selectcolumns, text: SELECTCOLUMNS }
        - { id: filter, text: FILTER }
    - id: seg
      options:
        - { id: and, text: "Customer[Segment] = \"Retail\" && Customer[Segment] = \"Wholesale\"" }
        - { id: in, text: "Customer[Segment] IN { \"Retail\", \"Wholesale\" }" }
        - { id: contains, text: "CONTAINSSTRING ( Customer[Segment], \"Retail\" )" }
answer:
  values: { outer: calctable, cols: selectcolumns, seg: in }
explanation:
  correct:
    en: "CALCULATETABLE evaluates a table expression in a filter context modified by its filter arguments, here two Boolean expressions that each reference a single column. SELECTCOLUMNS starts from an empty table and adds only the listed columns, so the result has just Name and City. The IN operator keeps the customers whose segment is either of the two values."
    fr: "CALCULATETABLE évalue une expression de table dans un contexte de filtre modifié par ses arguments de filtre, ici deux expressions booléennes qui référencent chacune une seule colonne. SELECTCOLUMNS part d'une table vide et n'ajoute que les colonnes listées : le résultat ne contient que Name et City. L'opérateur IN conserve les clients dont le segment est l'une des deux valeurs."
  options:
    filter:
      en: "FILTER takes exactly two arguments, a table and one condition; more arguments return an error."
      fr: "FILTER prend exactement deux arguments, une table et une condition ; davantage d'arguments renvoient une erreur."
    addcols:
      en: "ADDCOLUMNS adds calculated columns to a table; it has no filter arguments."
      fr: "ADDCOLUMNS ajoute des colonnes calculées à une table ; il n'a pas d'arguments de filtre."
    summcols:
      en: "SUMMARIZECOLUMNS expects group-by columns, filter tables and name and expression pairs, not a table expression followed by Boolean conditions."
      fr: "SUMMARIZECOLUMNS attend des colonnes de regroupement, des tables de filtre et des paires nom et expression, pas une expression de table suivie de conditions booléennes."
    addcolumns:
      en: "ADDCOLUMNS keeps all the columns of Customer and adds the new ones, so Country and Segment would also be returned."
      fr: "ADDCOLUMNS conserve toutes les colonnes de Customer et ajoute les nouvelles : Country et Segment seraient aussi renvoyés."
    and:
      en: "A customer can't have both segments, so this condition returns no rows."
      fr: "Un client ne peut pas avoir les deux segments : cette condition ne renvoie aucune ligne."
    contains:
      en: "This condition keeps only the Retail customers."
      fr: "Cette condition ne conserve que les clients Retail."
references:
  - title: CALCULATETABLE function (DAX)
    url: https://learn.microsoft.com/en-us/dax/calculatetable-function-dax
  - title: SELECTCOLUMNS function (DAX)
    url: https://learn.microsoft.com/en-us/dax/selectcolumns-function-dax
