seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You build a visual query and visualize the results.
  fr: Vous créez une requête visuelle et visualisez les résultats.
body:
  solution:
    en: |
      In WH-Retail, Lena selects **New visual query** and drags dbo.DimCity and dbo.FactSale to the canvas. She performs the following actions:

      1. Select **Combine** > **Merge queries as new**, join the two tables on CityKey with the **Inner** join kind, and expand the Profit column.
      2. Select **Transform** > **Group by**, group by City and add a **Sum** aggregation of Profit.
      3. Select **Visualize results**, build a table visual of the results and save the report in Retail-WS.
    fr: |
      Dans WH-Retail, Lena sélectionne **Nouvelle requête visuelle** et fait glisser dbo.DimCity et dbo.FactSale sur le canevas. Elle effectue les actions suivantes :

      1. Sélectionner **Combiner** > **Fusionner des requêtes comme nouvelles**, joindre les deux tables sur CityKey avec le type de jointure **Interne**, puis développer la colonne Profit.
      2. Sélectionner **Transformer** > **Regrouper par**, regrouper par City et ajouter une agrégation **Somme** de Profit.
      3. Sélectionner **Visualiser les résultats**, créer un visuel de table des résultats et enregistrer le rapport dans Retail-WS.
answer: { value: false }
explanation:
  correct:
    en: Visualize results creates a Power BI report, which is an item of the workspace and not an object of WH-Retail. Other analysts can't query a report with T-SQL, so the first requirement isn't met.
    fr: "Visualiser les résultats crée un rapport Power BI, qui est un élément de l'espace de travail et non un objet de WH-Retail. Les autres analystes ne peuvent pas interroger un rapport en T-SQL : la première exigence n'est pas remplie."
references:
