id: dp600-2c-denorm-statements
objective: "2.2.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are denormalizing data for a star schema in Microsoft Fabric.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous dénormalisez des données pour un schéma en étoile dans Microsoft Fabric.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A view in a Fabric warehouse that joins DimProduct, DimSubcategory and DimCategory stores the joined rows in the warehouse.
        fr: Une vue d'un entrepôt Fabric qui joint DimProduct, DimSubcategory et DimCategory stocke les lignes jointes dans l'entrepôt.
    - id: s2
      text:
        en: Dimension tables in a Fabric warehouse should almost always be denormalized, because they are generally small compared with fact tables.
        fr: Les tables de dimension d'un entrepôt Fabric doivent presque toujours être dénormalisées, car elles sont généralement petites par rapport aux tables de faits.
    - id: s3
      text:
        en: In Power Query, pivoting an attribute column with the Don't aggregate option returns an error in a cell when two rows have the same product and the same attribute.
        fr: Dans Power Query, faire pivoter une colonne d'attributs avec l'option Ne pas agréger renvoie une erreur dans une cellule quand deux lignes ont le même produit et le même attribut.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "A regular view stores only its query; the join runs each time the view is read, and the warehouse doesn't support materialized views. Learn recommends denormalized dimensions because the redundant storage of small dimension tables is outweighed by better query performance and usability. With Don't aggregate, each cell takes a single value, so duplicate combinations return an Expression.Error."
    fr: "Une vue ordinaire ne stocke que sa requête ; la jointure s'exécute à chaque lecture de la vue, et l'entrepôt ne prend pas en charge les vues matérialisées. Learn recommande des dimensions dénormalisées, car le stockage redondant de tables de dimension petites est compensé par de meilleures performances et une meilleure facilité d'utilisation. Avec Ne pas agréger, chaque cellule prend une seule valeur : les combinaisons en double renvoient une erreur Expression.Error."
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Dimension tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
  - title: Pivot columns
    url: https://learn.microsoft.com/en-us/power-query/pivot-columns
