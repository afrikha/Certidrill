id: dp600-2d-sql-approx-count
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **Warehouse1** that contains a table named **dbo.PageView**. The table contains four billion rows, one row per page view, with the ViewDate and VisitorId columns.

    A dashboard runs a query that returns the number of unique visitors per day. The business accepts an error of up to 2 percent in this number. You need to minimize the memory used by the query and its response time.

    Which aggregate function should you use?
  fr: |
    Vous disposez d'un entrepôt nommé **Warehouse1** qui contient une table nommée **dbo.PageView**. La table contient quatre milliards de lignes, une ligne par page vue, avec les colonnes ViewDate et VisitorId.

    Un tableau de bord exécute une requête qui renvoie le nombre de visiteurs uniques par jour. Le métier accepte une erreur allant jusqu'à 2 % sur ce nombre. Vous devez réduire au minimum la mémoire utilisée par la requête et son temps de réponse.

    Quelle fonction d'agrégation devez-vous utiliser ?
body:
  options:
    - { id: a, text: "COUNT(DISTINCT VisitorId)" }
    - { id: b, text: "APPROX_COUNT_DISTINCT(VisitorId)" }
    - { id: c, text: "COUNT_BIG(VisitorId)" }
    - { id: d, text: "COUNT(*)" }
answer: { optionId: b }
explanation:
  correct:
    en: "`APPROX_COUNT_DISTINCT` returns the approximate number of unique non-null values in a group. It uses the HyperLogLog algorithm, guarantees an error rate of up to 2 percent with a 97 percent probability, and needs less memory than `COUNT(DISTINCT)` on very large tables."
    fr: "`APPROX_COUNT_DISTINCT` renvoie le nombre approximatif de valeurs uniques non NULL d'un groupe. Elle utilise l'algorithme HyperLogLog, garantit un taux d'erreur de 2 % au plus avec une probabilité de 97 % et demande moins de mémoire que `COUNT(DISTINCT)` sur de très grandes tables."
  options:
    a: { en: "COUNT(DISTINCT) returns the exact number but needs more memory and can spill on billions of rows.", fr: "COUNT(DISTINCT) renvoie le nombre exact mais demande plus de mémoire et peut déborder sur disque avec des milliards de lignes." }
    c: { en: "COUNT_BIG(VisitorId) counts the page views that have a visitor, not the unique visitors.", fr: "COUNT_BIG(VisitorId) compte les pages vues qui ont un visiteur, pas les visiteurs uniques." }
    d: { en: "COUNT(*) counts the page views, not the unique visitors.", fr: "COUNT(*) compte les pages vues, pas les visiteurs uniques." }
references:
  - title: APPROX_COUNT_DISTINCT (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/approx-count-distinct-transact-sql
