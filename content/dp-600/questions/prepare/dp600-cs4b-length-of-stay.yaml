id: dp600-cs4b-length-of-stay
objective: "2.2.1"
type: dropdown
caseStudy: dp600-cs4b-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You are writing dbo.fn_LengthOfStay. The solution must meet the data preparation requirement.

    How should you complete the T-SQL code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez dbo.fn_LengthOfStay. La solution doit satisfaire l'exigence relative à la préparation des données.

    Comment devez-vous compléter le code T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE FUNCTION dbo.fn_LengthOfStay (@HospitalId INT)
    RETURNS [[ret]]
    AS
    RETURN
    (
        SELECT a.AdmissionId,
               a.PatientId,
               [[diff]](day, a.AdmitDate, a.DischargeDate) AS LengthOfStayDays
        FROM dbo.FactAdmission AS a
        WHERE a.HospitalId = @HospitalId
          AND a.DischargeDate [[nul]]
    );
  slots:
    - id: ret
      options:
        - { id: int, text: INT }
        - { id: table, text: TABLE }
        - { id: tvar, text: "@Result TABLE (AdmissionId INT, PatientId INT, LengthOfStayDays INT)" }
        - { id: view, text: VIEW }
    - id: diff
      options:
        - { id: dateadd, text: DATEADD }
        - { id: datepart, text: DATEPART }
        - { id: datediff, text: DATEDIFF }
        - { id: bucket, text: DATE_BUCKET }
    - id: nul
      options:
        - { id: isnull, text: IS NULL }
        - { id: neq, text: "<> NULL" }
        - { id: notnull, text: IS NOT NULL }
        - { id: gt, text: "> a.AdmitDate OR a.DischargeDate IS NULL" }
answer:
  values: { ret: table, diff: datediff, nul: notnull }
explanation:
  correct:
    en: "`RETURNS TABLE` with a single `SELECT` in `RETURN` creates an inline table-valued function, which can be used in a FROM clause and joined like a table. `DATEDIFF(day, AdmitDate, DischargeDate)` returns the number of day boundaries between the two dates, and `DischargeDate IS NOT NULL` keeps only the completed admissions."
    fr: "`RETURNS TABLE` avec un seul `SELECT` dans `RETURN` crée une fonction table inline, utilisable dans une clause FROM et joignable comme une table. `DATEDIFF(day, AdmitDate, DischargeDate)` renvoie le nombre de limites de jour entre les deux dates, et `DischargeDate IS NOT NULL` ne conserve que les admissions terminées."
  options:
    int: { en: "A scalar function returns one value per call; it cannot return one row per admission or be used in a FROM clause.", fr: "Une fonction scalaire renvoie une valeur par appel ; elle ne peut pas renvoyer une ligne par admission ni être utilisée dans une clause FROM." }
    tvar: { en: "A table variable return type defines a multi-statement function with a BEGIN...END body; Fabric Data Warehouse supports only the inline form with RETURNS TABLE.", fr: "Un type de retour variable de table définit une fonction à instructions multiples avec un corps BEGIN...END ; l'entrepôt Fabric ne prend en charge que la forme inline avec RETURNS TABLE." }
    view: { en: "VIEW is not a return type; a view cannot take a parameter.", fr: "VIEW n'est pas un type de retour ; une vue ne peut pas recevoir de paramètre." }
    dateadd: { en: "DATEADD adds an interval to a date and returns a date, not a number of days.", fr: "DATEADD ajoute un intervalle à une date et renvoie une date, pas un nombre de jours." }
    datepart: { en: "DATEPART returns one part of a single date and accepts only two arguments.", fr: "DATEPART renvoie une partie d'une seule date et n'accepte que deux arguments." }
    bucket: { en: "DATE_BUCKET returns the start of the time bucket that contains a date, not the difference between two dates.", fr: "DATE_BUCKET renvoie le début de l'intervalle de temps qui contient une date, pas l'écart entre deux dates." }
    isnull: { en: "IS NULL keeps only the patients who are still in hospital, the opposite of the requirement.", fr: "IS NULL ne conserve que les patients encore hospitalisés, l'inverse de l'exigence." }
    neq: { en: "A comparison with NULL by using <> returns UNKNOWN, so the query returns no rows.", fr: "Une comparaison avec NULL à l'aide de <> renvoie UNKNOWN : la requête ne renvoie aucune ligne." }
    gt: { en: "The OR condition keeps the admissions with a NULL DischargeDate, which must be excluded.", fr: "La condition OR conserve les admissions dont DischargeDate est NULL, qui doivent être exclues." }
references:
  - title: CREATE FUNCTION (Microsoft Fabric, Azure Synapse Analytics)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-function-sql-data-warehouse
  - title: DATEDIFF (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/functions/datediff-transact-sql
