id: dp600-2a-shared-conn-facts
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Your organization uses shareable cloud connections in Fabric for pipelines and OneLake shortcuts. You are reviewing how access to these connections is controlled.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre organisation utilise des connexions cloud partageables dans Fabric pour les pipelines et les raccourcis OneLake. Vous examinez la façon dont l'accès à ces connexions est contrôlé.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A user who can use a connection reaches the data source with the credentials stored in the connection.", fr: "Un utilisateur qui peut utiliser une connexion atteint la source de données avec les informations d'identification stockées dans la connexion." } }
    - { id: b, text: { en: "A tenant administrator sees every connection of the tenant in Manage connections and gateways.", fr: "Un administrateur du locataire voit toutes les connexions du locataire dans Gérer les connexions et les passerelles." } }
    - { id: c, text: { en: "The Contributor role in a workspace grants the use of every connection used by the items of that workspace.", fr: "Le rôle Contributor dans un espace de travail accorde l'utilisation de toutes les connexions utilisées par les éléments de cet espace de travail." } }
    - { id: d, text: { en: "Each connection has its own list of users, so access must be granted on each connection separately.", fr: "Chaque connexion a sa propre liste d'utilisateurs : l'accès doit donc être accordé séparément sur chaque connexion." } }
    - { id: e, text: { en: "Removing a connection leaves the items that use it working with cached credentials.", fr: "La suppression d'une connexion laisse fonctionner les éléments qui l'utilisent avec des informations d'identification mises en cache." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Anyone added to a connection uses the source with the credentials or SSO stored in it, which is why Microsoft recommends sharing connections only with trusted users and storing a narrowly scoped account. Access is managed per connection: users must be added to each connection separately.
    fr: |
      Toute personne ajoutée à une connexion utilise la source avec les informations d'identification ou l'authentification unique stockées dans celle-ci ; c'est pourquoi Microsoft recommande de ne partager les connexions qu'avec des utilisateurs de confiance et d'y stocker un compte aux droits restreints. L'accès se gère par connexion : les utilisateurs doivent être ajoutés à chaque connexion séparément.
  options:
    b:
      en: Users see only the connections they have access to, and this applies to tenant administrators too.
      fr: Les utilisateurs ne voient que les connexions auxquelles ils ont accès, et cela s'applique aussi aux administrateurs du locataire.
    c:
      en: Workspace roles do not grant access to connections; the access list of each connection does.
      fr: Les rôles d'espace de travail n'accordent pas l'accès aux connexions ; c'est la liste d'accès de chaque connexion qui le fait.
    e:
      en: Removing a data source connection breaks the items that depend on it.
      fr: La suppression d'une connexion de source de données casse les éléments qui en dépendent.
references:
  - title: Data source management
    url: https://learn.microsoft.com/en-us/fabric/data-factory/data-source-management
