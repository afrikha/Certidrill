id: dp600-2a-mirror-prereqs
objective: "2.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have the Contributor role in a Fabric workspace named Workspace1. You have an Azure SQL database named sqldb-crm on a logical server named sql-crm. sqldb-crm uses the vCore General Purpose tier, is publicly accessible and allows Azure services. No managed identity is enabled on sql-crm.

    A SQL login and a database user that have the permissions required for mirroring already exist.

    You need to create a mirrored database for sqldb-crm in Workspace1.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous avez le rôle Contributor dans un espace de travail Fabric nommé Workspace1. Vous disposez d'une base de données Azure SQL nommée sqldb-crm sur un serveur logique nommé sql-crm. sqldb-crm utilise le niveau vCore General Purpose, est accessible publiquement et autorise les services Azure. Aucune identité managée n'est activée sur sql-crm.

    Une connexion SQL (login) et un utilisateur de base de données disposant des autorisations nécessaires à la mise en miroir existent déjà.

    Vous devez créer une base de données en miroir pour sqldb-crm dans Workspace1.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install a virtual network data gateway for the mirroring connection.", fr: "Installer une passerelle de données de réseau virtuel pour la connexion de mise en miroir." } }
    - { id: b, text: { en: "Enable the system-assigned managed identity of sql-crm as its primary identity.", fr: "Activer l'identité managée affectée par le système de sql-crm comme identité principale." } }
    - { id: c, text: { en: "Migrate sqldb-crm to the Hyperscale service tier.", fr: "Migrer sqldb-crm vers le niveau de service Hyperscale." } }
    - { id: d, text: { en: "Obtain the Member or Admin role in Workspace1.", fr: "Obtenir le rôle Member ou Admin dans Workspace1." } }
    - { id: e, text: { en: "Create a workspace identity for Workspace1.", fr: "Créer une identité d'espace de travail pour Workspace1." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Mirroring Azure SQL Database requires a system-assigned or user-assigned managed identity that is the primary identity of the logical server. Creating the mirrored database also requires the Member or Admin role in the workspace, because the Contributor role lacks the Reshare permission needed during creation.
    fr: |
      La mise en miroir d'Azure SQL Database exige une identité managée affectée par le système ou par l'utilisateur qui est l'identité principale du serveur logique. La création de la base de données en miroir exige aussi le rôle Member ou Admin dans l'espace de travail, car le rôle Contributor n'a pas l'autorisation Reshare nécessaire pendant la création.
  options:
    a:
      en: A gateway is needed only when the database isn't publicly accessible or doesn't allow Azure services.
      fr: Une passerelle n'est nécessaire que si la base n'est pas accessible publiquement ou n'autorise pas les services Azure.
    c:
      en: All vCore service tiers are supported, including General Purpose.
      fr: Tous les niveaux de service vCore sont pris en charge, dont General Purpose.
    e:
      en: The connection can use the existing SQL login with the Basic authentication kind; a workspace identity is optional.
      fr: La connexion peut utiliser la connexion SQL existante avec le type d'authentification Basic ; une identité d'espace de travail est facultative.
references:
  - title: "Tutorial: Configure Microsoft Fabric mirrored databases from Azure SQL Database"
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-sql-database-tutorial
  - title: Microsoft Fabric Mirrored Databases from Azure SQL Database
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-sql-database
