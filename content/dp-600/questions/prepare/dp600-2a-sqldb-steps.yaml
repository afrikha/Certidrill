id: dp600-2a-sqldb-steps
objective: "2.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Wingtip is moving the operational database of its order-entry application to Fabric. You chose SQL database in Fabric as the store. The existing data is in an Azure SQL database, and a reporting team must analyze the data without loading the operational database.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip déplace vers Fabric la base de données opérationnelle de son application de saisie de commandes. Vous avez choisi la base de données SQL dans Fabric comme magasin. Les données existantes se trouvent dans une base de données Azure SQL, et une équipe de reporting doit analyser les données sans charger la base opérationnelle.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create a SQL database named DB-Orders in a Fabric workspace.", fr: "Créer une base de données SQL nommée DB-Orders dans un espace de travail Fabric." } }
    - { id: schema, text: { en: "Create the tables, keys and foreign keys of the application in DB-Orders by using T-SQL.", fr: "Créer en T-SQL les tables, les clés et les clés étrangères de l'application dans DB-Orders." } }
    - { id: load, text: { en: "Load the existing data into the tables by using a pipeline with a Copy activity.", fr: "Charger les données existantes dans les tables à l'aide d'un pipeline avec une activité Copy." } }
    - { id: query, text: { en: "Give the reporting team access to query the data through the SQL analytics endpoint of DB-Orders.", fr: "Donner à l'équipe de reporting l'accès pour interroger les données via le point de terminaison d'analytique SQL de DB-Orders." } }
    - { id: mirror, text: { en: "Configure mirroring from DB-Orders to OneLake.", fr: "Configurer la mise en miroir de DB-Orders vers OneLake." } }
    - { id: availability, text: { en: "Enable OneLake availability on DB-Orders.", fr: "Activer la disponibilité OneLake sur DB-Orders." } }
answer:
  sequence: [ create, schema, load, query ]
explanation:
  correct:
    en: |
      You create the SQL database, define the schema of the application with T-SQL, and then load the existing data with a Data Factory pipeline. The data of a SQL database is replicated to OneLake automatically, and the SQL analytics endpoint created with the database lets the reporting team query it without affecting transactional performance.
    fr: |
      Vous créez la base de données SQL, définissez le schéma de l'application en T-SQL, puis chargez les données existantes avec un pipeline Data Factory. Les données d'une base de données SQL sont répliquées automatiquement dans OneLake, et le point de terminaison d'analytique SQL créé avec la base permet à l'équipe de reporting de les interroger sans affecter les performances transactionnelles.
  options:
    mirror:
      en: Replication of a SQL database to OneLake is automatic; there is nothing to configure.
      fr: La réplication d'une base de données SQL vers OneLake est automatique ; il n'y a rien à configurer.
    availability:
      en: OneLake availability is a setting of eventhouse KQL databases, not of SQL databases.
      fr: La disponibilité OneLake est un paramètre des bases de données KQL d'un eventhouse, pas des bases de données SQL.
references:
  - title: SQL database Overview
    url: https://learn.microsoft.com/en-us/fabric/database/sql/overview
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
