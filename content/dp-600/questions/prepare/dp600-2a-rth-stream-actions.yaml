id: dp600-2a-rth-stream-actions
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    On the All data streams page of Real-Time hub, you find a stream named sensors-stream. Its source item is an eventstream named ES-Sensors.

    Which two actions can you perform from the More options (...) menu of sensors-stream?

    NOTE: Each correct selection is worth one point.
  fr: |
    Dans la page All data streams du hub Real-Time, vous trouvez un flux nommé sensors-stream. Son élément source est un flux d'événements nommé ES-Sensors.

    Quelles sont les deux actions que vous pouvez effectuer depuis le menu Autres options (...) de sensors-stream ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Apply a sensitivity label to ES-Sensors", fr: "Appliquer une étiquette de confidentialité à ES-Sensors" } }
    - { id: b, text: { en: "Preview the data of the stream", fr: "Afficher un aperçu des données du flux" } }
    - { id: c, text: { en: "Create a OneLake shortcut to the stream", fr: "Créer un raccourci OneLake vers le flux" } }
    - { id: d, text: { en: "Endorse ES-Sensors", fr: "Approuver ES-Sensors" } }
    - { id: e, text: { en: "Enable OneLake availability for the stream", fr: "Activer la disponibilité OneLake pour le flux" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      For a stream of an eventstream, the All data streams page offers Preview data, Open eventstream and Endorse. Preview shows the events flowing in the stream, and Endorse endorses the parent eventstream so that other users can trust it.
    fr: |
      Pour un flux issu d'un flux d'événements, la page All data streams propose Preview data, Open eventstream et Endorse. L'aperçu montre les événements qui circulent dans le flux, et Endorse approuve le flux d'événements parent pour que les autres utilisateurs puissent s'y fier.
  options:
    a:
      en: The page shows the sensitivity of the parent item in a column, but labeling is not one of the stream actions.
      fr: La page affiche la confidentialité de l'élément parent dans une colonne, mais l'étiquetage ne fait pas partie des actions du flux.
    c:
      en: A stream is not a shortcut target; shortcuts point to storage and Fabric items such as lakehouses or KQL databases.
      fr: Un flux n'est pas une cible de raccourci ; les raccourcis pointent vers du stockage et des éléments Fabric comme des lakehouses ou des bases de données KQL.
    e:
      en: OneLake availability is a setting of KQL databases and tables in an eventhouse, not of an eventstream stream.
      fr: La disponibilité OneLake est un paramètre des bases de données et des tables KQL d'un eventhouse, pas d'un flux d'eventstream.
references:
  - title: Explore All data streams in Fabric Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/explore-data-streams
