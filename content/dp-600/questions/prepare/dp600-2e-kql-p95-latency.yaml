id: dp600-2e-kql-p95-latency
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a KQL database named **ApiDB** in a Fabric eventhouse. ApiDB contains a table named **Requests** with the columns **Endpoint**, **DurationMs** and **Timestamp**.

    You need a query that returns, for each endpoint, the response time below which 95 percent of the requests of the last hour complete.

    How should you complete the following query?

    ```kusto
    Requests
    | where Timestamp > ago(1h)
    | summarize P95 = <aggregation> by Endpoint
    ```
  fr: |
    Vous disposez d'une base de données KQL nommée **ApiDB** dans un eventhouse Fabric. ApiDB contient une table nommée **Requests** avec les colonnes **Endpoint**, **DurationMs** et **Timestamp**.

    Vous avez besoin d'une requête qui renvoie, pour chaque point de terminaison, le temps de réponse en dessous duquel se terminent 95 % des requêtes de la dernière heure.

    Comment devez-vous compléter la requête suivante ?

    ```kusto
    Requests
    | where Timestamp > ago(1h)
    | summarize P95 = <aggregation> by Endpoint
    ```
body:
  options:
    - { id: a, text: "max(DurationMs) * 0.95" }
    - { id: b, text: "avgif(DurationMs, DurationMs < 95)" }
    - { id: c, text: "percentile(DurationMs, 95)" }
    - { id: d, text: "countif(DurationMs < 95)" }
answer: { optionId: c }
explanation:
  correct:
    en: "`percentile(DurationMs, 95)` returns, per summary group, an estimate of the value below or equal to which 95 percent of the durations fall. It is the standard way to compute a P95 latency in KQL."
    fr: "`percentile(DurationMs, 95)` renvoie, pour chaque groupe, une estimation de la valeur inférieure ou égale à laquelle se situent 95 % des durées. C'est la méthode standard pour calculer une latence P95 en KQL."
  options:
    a:
      en: "95 percent of the maximum is not a percentile: one very slow request changes the value completely."
      fr: "95 % du maximum n'est pas un centile : une seule requête très lente change complètement la valeur."
    b:
      en: "This averages only the requests that last less than 95 ms; 95 is a percentile rank, not a duration."
      fr: "Cette expression fait la moyenne des seules requêtes de moins de 95 ms ; 95 est un rang de centile, pas une durée."
    d:
      en: "`countif()` returns a number of requests, not a response time."
      fr: "`countif()` renvoie un nombre de requêtes, pas un temps de réponse."
references:
  - title: percentile(), percentiles() (aggregation function)
    url: https://learn.microsoft.com/en-us/kusto/query/percentiles-aggregation-function
