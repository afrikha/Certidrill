id: dp600-1c-ia-downstream-chain
objective: "1.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have the Fabric items shown in the following table.

    | Item | Type | Workspace | Gets data from |
    | --- | --- | --- | --- |
    | DF1 | Dataflow | WS-Prep | An Azure SQL database |
    | SM1 | Semantic model | WS-Prep | DF1, by using the Dataflows connector in Get data |
    | SM2 | Semantic model | WS-Finance | DF1, by using the Dataflows connector in Get data |
    | R1 | Report | WS-Prep | SM1 |
    | R2 | Report | WS-Finance | SM2 |

    You open impact analysis on DF1 and compare the **Child items** tab with the **All downstream items** tab.

    Which two items appear only on the All downstream items tab?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez des éléments Fabric indiqués dans le tableau suivant.

    | Élément | Type | Espace de travail | Obtient ses données de |
    | --- | --- | --- | --- |
    | DF1 | Flux de données | WS-Prep | Une base de données Azure SQL |
    | SM1 | Modèle sémantique | WS-Prep | DF1, avec le connecteur Dataflows dans Obtenir les données |
    | SM2 | Modèle sémantique | WS-Finance | DF1, avec le connecteur Dataflows dans Obtenir les données |
    | R1 | Rapport | WS-Prep | SM1 |
    | R2 | Rapport | WS-Finance | SM2 |

    Vous ouvrez l'analyse d'impact de DF1 et comparez l'onglet **Éléments enfants** à l'onglet **Tous les éléments en aval**.

    Quels sont les deux éléments qui n'apparaissent que dans l'onglet Tous les éléments en aval ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: SM1 }
    - { id: b, text: SM2 }
    - { id: c, text: R1 }
    - { id: d, text: R2 }
    - { id: e, text: { en: "The Azure SQL database", fr: "La base de données Azure SQL" } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: "Child items lists only the direct children of DF1: SM1 and SM2, whatever their workspace. All downstream items adds the items that depend on those children, so the reports R1 and R2 appear only there. Connecting through the Dataflows connector in Get data is the setup for which lineage between semantic models and dataflows is guaranteed."
    fr: "Éléments enfants ne liste que les enfants directs de DF1 : SM1 et SM2, quel que soit leur espace de travail. Tous les éléments en aval ajoute les éléments qui dépendent de ces enfants : les rapports R1 et R2 n'apparaissent donc que là. La connexion avec le connecteur Dataflows dans Obtenir les données est la configuration pour laquelle la traçabilité entre modèles sémantiques et flux de données est garantie."
  options:
    a:
      en: "SM1 reads DF1 directly, so it appears on both tabs."
      fr: "SM1 lit DF1 directement : il apparaît dans les deux onglets."
    b:
      en: "SM2 is a direct child even though it's in another workspace, so it appears on both tabs."
      fr: "SM2 est un enfant direct même s'il se trouve dans un autre espace de travail : il apparaît dans les deux onglets."
    e:
      en: "The database is upstream of DF1; impact analysis shows only downstream items."
      fr: "La base de données est en amont de DF1 ; l'analyse d'impact n'affiche que les éléments en aval."
references:
  - title: Impact analysis
    url: https://learn.microsoft.com/en-us/fabric/governance/impact-analysis
  - title: Lineage in Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/lineage
