id: dp600-cs2b-impact-analysis
objective: "1.2.4"
type: single
caseStudy: dp600-cs2b-bellows-college
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the requirement for schema changes in WH-Academic.

    What should you do?
  fr: |
    Vous devez respecter l'exigence relative aux modifications de schéma de WH-Academic.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Open the impact analysis of WH-Academic, select All downstream items, and then select Notify contacts.", fr: "Ouvrir l'analyse d'impact de WH-Academic, sélectionner All downstream items, puis sélectionner Notify contacts." }
    - id: b
      text: { en: "Open the impact analysis of WH-Academic, select Child items, and then select Notify contacts.", fr: "Ouvrir l'analyse d'impact de WH-Academic, sélectionner Child items, puis sélectionner Notify contacts." }
    - id: c
      text: { en: "Search the OneLake catalog for the items that use WH-Academic, and then email the owners of these items.", fr: "Rechercher dans le catalogue OneLake les éléments qui utilisent WH-Academic, puis envoyer un e-mail à leurs propriétaires." }
    - id: d
      text: { en: "Compare the Test and Production stages of Academic Pipeline, and then email the admins of Academic-Prod.", fr: "Comparer les phases Test et Production d'Academic Pipeline, puis envoyer un e-mail aux administrateurs d'Academic-Prod." }
answer:
  optionId: a
explanation:
  correct:
    en: "Impact analysis lists the items and workspaces that depend on an item, and the All downstream items scope includes the faculty reports built on SM-Enrollment, not only its direct children. Items in workspaces that you cannot access are shown with limited access, and Notify contacts still sends the email to the contact lists of all the impacted workspaces."
    fr: "L'analyse d'impact liste les éléments et les espaces de travail qui dépendent d'un élément, et l'étendue All downstream items inclut les rapports des facultés créés sur SM-Enrollment, pas seulement ses enfants directs. Les éléments des espaces de travail auxquels vous n'avez pas accès sont affichés avec un accès limité, et Notify contacts envoie quand même l'e-mail aux listes de contacts de tous les espaces de travail concernés."
  options:
    b:
      en: "Child items shows only the direct children of WH-Academic, such as SM-Enrollment, and misses the faculty reports that depend on SM-Enrollment."
      fr: "Child items n'affiche que les enfants directs de WH-Academic, comme SM-Enrollment, et omet les rapports des facultés qui dépendent de SM-Enrollment."
    c:
      en: "A catalog search finds items by name and metadata, not by dependency on WH-Academic, and it shows only the items that the BI team can access, so the faculty items are missed."
      fr: "Une recherche dans le catalogue trouve des éléments par nom et par métadonnées, pas par dépendance envers WH-Academic, et n'affiche que les éléments auxquels l'équipe décisionnelle a accès : les éléments des facultés sont donc omis."
    d:
      en: "Comparing pipeline stages shows the differences between the items of two stages, not the items that depend on WH-Academic in other workspaces."
      fr: "La comparaison des phases d'un pipeline montre les différences entre les éléments de deux phases, pas les éléments qui dépendent de WH-Academic dans d'autres espaces de travail."
references:
  - title: Impact analysis
    url: https://learn.microsoft.com/en-us/fabric/governance/impact-analysis
