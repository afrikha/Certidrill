id: dp600-1c-ra-template-values
objective: "1.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Power BI Desktop file named **Accounts.pbix** that imports customer data. One report page has a page-level filter set to Customer = Woodgrove Bank, and a slicer on another page has three customer names selected.

    You need to give a partner company a reusable file that contains the report pages, the model and the queries of Accounts.pbix. The file must not reveal the name of any customer.

    What should you do?
  fr: |
    Vous disposez d'un fichier Power BI Desktop nommé **Accounts.pbix** qui importe des données clients. Une page du rapport a un filtre au niveau de la page défini sur Customer = Woodgrove Bank, et un segment d'une autre page a trois noms de clients sélectionnés.

    Vous devez fournir à une entreprise partenaire un fichier réutilisable qui contient les pages du rapport, le modèle et les requêtes d'Accounts.pbix. Le fichier ne doit révéler le nom d'aucun client.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Export a Power BI template (.pbit) without changing the report.", fr: "Exporter un modèle Power BI (.pbit) sans modifier le rapport." } }
    - { id: b, text: { en: "Save the report as a Power BI project (.pbip), and then delete the cache.abf file.", fr: "Enregistrer le rapport en tant que projet Power BI (.pbip), puis supprimer le fichier cache.abf." } }
    - { id: c, text: { en: "Export a Power BI data source (.pbids) file from the data source settings.", fr: "Exporter un fichier de source de données Power BI (.pbids) depuis les paramètres de la source de données." } }
    - { id: d, text: { en: "Clear the filter and slicer selections, and then export a Power BI template (.pbit).", fr: "Effacer les sélections du filtre et du segment, puis exporter un modèle Power BI (.pbit)." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A template contains no data, but the report metadata can still hold values from the model: a filter on a customer persists the customer name, and slicer selections persist too. Clearing those selections before exporting the template keeps the pages, model and queries without revealing any customer."
    fr: "Un modèle de rapport ne contient aucune donnée, mais les métadonnées du rapport peuvent conserver des valeurs du modèle : un filtre sur un client conserve le nom de ce client, et les sélections des segments sont aussi conservées. Effacer ces sélections avant d'exporter le modèle garde les pages, le modèle et les requêtes sans révéler de client."
  options:
    a:
      en: "The filter value Woodgrove Bank and the slicer selections persist in the report metadata of the template."
      fr: "La valeur de filtre Woodgrove Bank et les sélections du segment sont conservées dans les métadonnées du rapport du modèle."
    b:
      en: "Removing the cache removes the data, but the report definition still stores the filter and slicer values."
      fr: "Supprimer le cache supprime les données, mais la définition du rapport conserve toujours les valeurs du filtre et du segment."
    c:
      en: "A .pbids file contains only one data source connection, not the report pages, the model or the queries."
      fr: "Un fichier .pbids ne contient qu'une connexion de source de données, ni les pages du rapport, ni le modèle, ni les requêtes."
references:
  - title: Create and use report templates in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-templates
