id: dp600-1a-dls-sql-rls-scope
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has a Fabric warehouse named **WH-Clinics**. Data analysts query WH-Clinics with T-SQL from SQL Server Management Studio and from the SQL query editor.

    Each analyst must see only the rows of the `dbo.Visits` table for the clinics they manage, whatever tool they use to query the warehouse.

    What should you create?
  fr: |
    Proseware dispose d'un entrepôt Fabric nommé **WH-Clinics**. Les analystes de données interrogent WH-Clinics en T-SQL depuis SQL Server Management Studio et depuis l'éditeur de requête SQL.

    Chaque analyste ne doit voir que les lignes de la table `dbo.Visits` des cliniques qu'il gère, quel que soit l'outil utilisé pour interroger l'entrepôt.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A row-level security role with a DAX filter in a semantic model on WH-Clinics", fr: "Un rôle de sécurité au niveau des lignes avec un filtre DAX dans un modèle sémantique sur WH-Clinics" } }
    - { id: b, text: { en: "A dynamic data masking rule on the ClinicID column of dbo.Visits", fr: "Une règle de masquage dynamique des données sur la colonne ClinicID de dbo.Visits" } }
    - { id: c, text: { en: "An object-level security role that hides dbo.Visits", fr: "Un rôle de sécurité au niveau de l'objet qui masque dbo.Visits" } }
    - { id: d, text: { en: "A security policy with a filter predicate function on dbo.Visits", fr: "Une stratégie de sécurité avec une fonction de prédicat de filtre sur dbo.Visits" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Row-level security in a Fabric warehouse is defined with an inline table-valued predicate function and a security policy. The database tier applies it to every T-SQL query, whatever the client tool."
    fr: "La sécurité au niveau des lignes d'un entrepôt Fabric se définit avec une fonction de prédicat table inline et une stratégie de sécurité. Le niveau base de données l'applique à chaque requête T-SQL, quel que soit l'outil client."
  options:
    a: { en: "Semantic model RLS filters queries through the model and its reports, not T-SQL queries on the warehouse.", fr: "La RLS du modèle sémantique filtre les requêtes passant par le modèle et ses rapports, pas les requêtes T-SQL sur l'entrepôt." }
    b: { en: "Dynamic data masking changes how column values are displayed; it doesn't remove rows.", fr: "Le masquage dynamique des données change l'affichage des valeurs de colonnes ; il ne retire pas de lignes." }
    c: { en: "OLS is a semantic model feature that hides whole tables or columns, not individual rows.", fr: "L'OLS est une fonctionnalité de modèle sémantique qui masque des tables ou des colonnes entières, pas des lignes." }
references:
  - title: Row-level security in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/row-level-security
