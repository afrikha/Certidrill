id: dp600-1c-ia-entry-points
objective: "1.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Ops** that contains a warehouse named **WH-Ops**. You have the Contributor role in WS-Ops.

    You need to run impact analysis on WH-Ops.

    From which two places can you start impact analysis? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Ops** qui contient un entrepôt nommé **WH-Ops**. Vous avez le rôle Contributor dans WS-Ops.

    Vous devez lancer une analyse d'impact sur WH-Ops.

    À partir de quels deux emplacements pouvez-vous lancer l'analyse d'impact ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Monitoring hub", fr: "Le hub de surveillance" } }
    - { id: b, text: { en: "The card of WH-Ops in the lineage view of WS-Ops", fr: "La carte de WH-Ops dans la vue de traçabilité de WS-Ops" } }
    - { id: c, text: { en: "The settings of WS-Ops", fr: "Les paramètres de WS-Ops" } }
    - { id: d, text: { en: "The details page of WH-Ops, under the Lineage option", fr: "La page de détails de WH-Ops, sous l'option Traçabilité" } }
    - { id: e, text: { en: "The deployment pipeline that contains WS-Ops", fr: "Le pipeline de déploiement qui contient WS-Ops" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Impact analysis opens from the impact analysis button on an item's card in the lineage view, or from the details page of the item, under the Lineage option. Both open the same side pane."
    fr: "L'analyse d'impact s'ouvre à partir du bouton d'analyse d'impact de la carte d'un élément dans la vue de traçabilité, ou à partir de la page de détails de l'élément, sous l'option Traçabilité. Les deux ouvrent le même volet latéral."
  options:
    a:
      en: "The Monitoring hub tracks activity runs; it has no impact analysis."
      fr: "Le hub de surveillance suit les exécutions d'activités ; il ne propose pas d'analyse d'impact."
    c:
      en: "Workspace settings configure the workspace, such as its contact list and Git integration, not the dependencies of an item."
      fr: "Les paramètres de l'espace de travail configurent l'espace, par exemple sa liste de contacts et l'intégration Git, pas les dépendances d'un élément."
    e:
      en: "A deployment pipeline compares and deploys stage content; it doesn't analyze downstream dependencies across workspaces."
      fr: "Un pipeline de déploiement compare et déploie le contenu des étapes ; il n'analyse pas les dépendances en aval entre espaces de travail."
references:
  - title: Impact analysis
    url: https://learn.microsoft.com/en-us/fabric/governance/impact-analysis
