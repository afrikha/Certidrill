id: dp600-1c-ia-notify-steps
objective: "1.2.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Core** that contains a warehouse named **WH-Core**. You have the Contributor role in WS-Core. The contact lists of all the workspaces in the tenant are up to date.

    You plan to remove a table from WH-Core. Before the change, you need to warn the contacts of every workspace that contains items affected by the change.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Core** qui contient un entrepôt nommé **WH-Core**. Vous avez le rôle Contributor dans WS-Core. Les listes de contacts de tous les espaces de travail du locataire sont à jour.

    Vous prévoyez de supprimer une table de WH-Core. Avant la modification, vous devez prévenir les contacts de chaque espace de travail qui contient des éléments affectés par la modification.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: lineage, text: { en: "Open the lineage view of WS-Core.", fr: "Ouvrir la vue de traçabilité de WS-Core." } }
    - { id: impact, text: { en: "Select the impact analysis button on the WH-Core card.", fr: "Sélectionner le bouton d'analyse d'impact de la carte de WH-Core." } }
    - { id: notify, text: { en: "Select Notify contacts.", fr: "Sélectionner Notifier les contacts." } }
    - { id: send, text: { en: "Describe the planned change, and then select Send.", fr: "Décrire la modification prévue, puis sélectionner Envoyer." } }
    - { id: settings, text: { en: "Open the settings of WS-Core and add the affected users to the contact list.", fr: "Ouvrir les paramètres de WS-Core et ajouter les utilisateurs concernés à la liste de contacts." } }
    - { id: share, text: { en: "Share WH-Core with the owners of the affected items.", fr: "Partager WH-Core avec les propriétaires des éléments affectés." } }
answer:
  sequence: [ lineage, impact, notify, send ]
explanation:
  correct:
    en: "Impact analysis opens from the item's card in the lineage view. The Notify contacts button of the impact analysis pane opens a dialog where you describe the change; Send emails it to the contact lists of all the impacted workspaces."
    fr: "L'analyse d'impact s'ouvre depuis la carte de l'élément dans la vue de traçabilité. Le bouton Notifier les contacts du volet d'analyse d'impact ouvre une boîte de dialogue où vous décrivez la modification ; Envoyer l'adresse par e-mail aux listes de contacts de tous les espaces de travail touchés."
  options:
    settings:
      en: "The message goes to the contact lists of the impacted workspaces, which are already up to date; the contact list of WS-Core doesn't decide who is warned in the other workspaces."
      fr: "Le message est envoyé aux listes de contacts des espaces de travail touchés, qui sont déjà à jour ; la liste de contacts de WS-Core ne détermine pas qui est prévenu dans les autres espaces de travail."
    share:
      en: "Sharing grants access to the warehouse; it neither identifies the affected items nor sends a message."
      fr: "Le partage accorde un accès à l'entrepôt ; il n'identifie pas les éléments affectés et n'envoie aucun message."
references:
  - title: Impact analysis
    url: https://learn.microsoft.com/en-us/fabric/governance/impact-analysis
