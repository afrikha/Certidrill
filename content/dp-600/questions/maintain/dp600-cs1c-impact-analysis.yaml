id: dp600-cs1c-impact-analysis
objective: "1.2.4"
type: single
caseStudy: dp600-cs1c-litware-energy
difficulty: 2
status: draft
stem:
  en: |
    A member of SG-CustomerAnalytics plans to change the schema of the customers table. You need to meet the requirement that applies before the change. The solution must minimize effort. What should the member do?
  fr: |
    Un membre de SG-CustomerAnalytics prévoit de modifier le schéma de la table customers. Vous devez satisfaire l'exigence qui s'applique avant la modification. La solution doit réduire l'effort au minimum. Que doit faire ce membre ?
body:
  options:
    - { id: a, text: { en: "Filter the OneLake catalog on semantic models and open the details of each model to check its sources", fr: "Filtrer le catalogue OneLake sur les modèles sémantiques et ouvrir les détails de chaque modèle pour vérifier ses sources" } }
    - { id: b, text: { en: "Open impact analysis for LH_Customers, review all downstream items and use Notify contacts", fr: "Ouvrir l'analyse d'impact de LH_Customers, examiner tous les éléments en aval et utiliser Notify contacts" } }
    - { id: c, text: { en: "Open the Monitoring hub and list the semantic model refreshes that read LH_Customers", fr: "Ouvrir le hub de surveillance et lister les actualisations de modèles sémantiques qui lisent LH_Customers" } }
    - { id: d, text: { en: "Set the endorsement of LH_Customers to Master data so that the owners of dependent items are alerted", fr: "Définir l'approbation de LH_Customers sur Données de référence (Master data) pour que les propriétaires des éléments dépendants soient alertés" } }
answer: { optionId: b }
explanation:
  correct:
    en: Impact analysis lists the workspaces and items that depend on LH_Customers, including items in other workspaces, and can show all downstream items instead of only direct children. Its Notify contacts option sends a message to the contact lists of the affected workspaces, even workspaces that the user can't access. Running it requires write permission on LH_Customers, which the Member role in LE-Customer provides.
    fr: L'analyse d'impact liste les espaces de travail et les éléments qui dépendent de LH_Customers, y compris dans d'autres espaces de travail, et peut afficher tous les éléments en aval au lieu des seuls enfants directs. Son option Notify contacts envoie un message aux listes de contacts des espaces de travail concernés, même ceux auxquels l'utilisateur n'a pas accès. Son exécution exige l'autorisation d'écriture sur LH_Customers, que fournit le rôle Member dans LE-Customer.
  options:
    a:
      en: Opening each model is manual work, it misses the models the user can't access, and it does not notify anyone.
      fr: Ouvrir chaque modèle est un travail manuel, qui ignore les modèles auxquels l'utilisateur n'a pas accès et ne prévient personne.
    c:
      en: The Monitoring hub shows activity runs, not the dependencies between items, and only models refreshed recently would appear.
      fr: Le hub de surveillance affiche les exécutions d'activités, pas les dépendances entre éléments, et seuls les modèles actualisés récemment apparaîtraient.
    d:
      en: An endorsement badge helps users find trusted data; it does not identify dependent items or send notifications.
      fr: Un badge d'approbation aide les utilisateurs à trouver des données fiables ; il n'identifie pas les éléments dépendants et n'envoie pas de notification.
references:
  - title: Impact analysis
    url: https://learn.microsoft.com/en-us/fabric/governance/impact-analysis
