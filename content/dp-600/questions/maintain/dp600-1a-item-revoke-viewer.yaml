id: dp600-1a-item-revoke-viewer
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a Fabric workspace named **WS-Sales** that contains a report named **Quota**. A user named Jonas has the Viewer role in WS-Sales, and Quota was also shared with him directly.

    Jonas moved to another department. Yesterday, you removed his direct access to Quota from the Manage permissions page. Today, Jonas can still open Quota.

    Jonas must lose access to all the content of WS-Sales. What should you do?
  fr: |
    Tailspin Toys dispose d'un espace de travail Fabric nommé **WS-Sales** qui contient un rapport nommé **Quota**. Un utilisateur nommé Jonas a le rôle Viewer dans WS-Sales, et Quota a aussi été partagé directement avec lui.

    Jonas a changé de service. Hier, vous avez retiré son accès direct à Quota depuis la page Manage permissions. Aujourd'hui, Jonas peut toujours ouvrir Quota.

    Jonas doit perdre l'accès à tout le contenu de WS-Sales. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Wait up to two hours for the permission change to propagate", fr: "Attendre jusqu'à deux heures que la modification d'autorisation se propage" } }
    - { id: b, text: { en: "Remove the Reshare permission of Jonas on Quota", fr: "Retirer l'autorisation Reshare de Jonas sur Quota" } }
    - { id: c, text: { en: "Remove Jonas from the row-level security roles of the semantic model", fr: "Retirer Jonas des rôles de sécurité au niveau des lignes du modèle sémantique" } }
    - { id: d, text: { en: "Remove Jonas from the Viewer role of WS-Sales", fr: "Retirer Jonas du rôle Viewer de WS-Sales" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Workspace roles and item permissions are separate layers. Removing the item permission doesn't remove the access that the Viewer role gives to every item of the workspace. You must also remove the workspace role; permissions inherited from a role can't be removed on the Manage permissions page."
    fr: "Les rôles d'espace de travail et les autorisations d'élément sont des couches distinctes. Retirer l'autorisation d'élément ne retire pas l'accès que le rôle Viewer donne à tous les éléments de l'espace de travail. Vous devez aussi retirer le rôle d'espace de travail ; les autorisations héritées d'un rôle ne peuvent pas être retirées depuis la page Manage permissions."
  options:
    a: { en: "The two-hour delay has passed, and the Viewer role would keep granting access anyway.", fr: "Le délai de deux heures est écoulé, et le rôle Viewer continuerait de toute façon à accorder l'accès." }
    b: { en: "Reshare only controls whether Jonas can share the report onward.", fr: "Reshare détermine seulement si Jonas peut repartager le rapport." }
    c: { en: "RLS roles filter rows; removing Jonas from them doesn't remove his access to the report or the workspace.", fr: "Les rôles RLS filtrent des lignes ; en retirer Jonas ne supprime pas son accès au rapport ni à l'espace de travail." }
references:
  - title: Permission model
    url: https://learn.microsoft.com/en-us/fabric/security/permission-model
  - title: Share items in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/share-items
