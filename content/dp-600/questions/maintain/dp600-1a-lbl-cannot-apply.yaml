id: dp600-1a-lbl-cannot-apply
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has enabled sensitivity labels for Fabric. A Fabric workspace named **WS-Legal** contains a report named **Contracts**. A user named Mia has a Power BI Pro license.

    Mia must apply the **Confidential** label to Contracts, but she can't select it.

    Which two issues could cause this?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso a activé les étiquettes de confidentialité pour Fabric. Un espace de travail Fabric nommé **WS-Legal** contient un rapport nommé **Contracts**. Une utilisatrice nommée Mia dispose d'une licence Power BI Pro.

    Mia doit appliquer l'étiquette **Confidential** à Contracts, mais elle ne peut pas la sélectionner.

    Quels sont les deux problèmes qui pourraient en être la cause ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Confidential label isn't published to Mia in a Microsoft Purview label policy.", fr: "L'étiquette Confidential n'est pas publiée pour Mia dans une stratégie d'étiquette Microsoft Purview." } }
    - { id: b, text: { en: "Contracts isn't endorsed as Promoted or Certified.", fr: "Contracts n'est pas approuvé comme Promoted ou Certified." } }
    - { id: c, text: { en: "Mia has only the Read permission on Contracts.", fr: "Mia n'a que l'autorisation Read sur Contracts." } }
    - { id: d, text: { en: "The semantic model of Contracts uses Direct Lake.", fr: "Le modèle sémantique de Contracts utilise Direct Lake." } }
    - { id: e, text: { en: "The Automatically apply sensitivity labels to downstream content tenant setting is disabled.", fr: "Le paramètre de locataire Automatically apply sensitivity labels to downstream content est désactivé." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Applying a label requires a Power BI Pro or PPU license and edit permission on the item, so a user with Read only can't label it. The label must also be published to the user in a Microsoft Purview label policy; a label that isn't available to the user appears greyed out."
    fr: "Appliquer une étiquette demande une licence Power BI Pro ou PPU et l'autorisation de modification sur l'élément : un utilisateur qui n'a que Read ne peut pas l'étiqueter. L'étiquette doit aussi être publiée pour l'utilisateur dans une stratégie d'étiquette Microsoft Purview ; une étiquette qui ne lui est pas disponible apparaît grisée."
  options:
    b: { en: "Endorsement and sensitivity labels are independent.", fr: "L'approbation et les étiquettes de confidentialité sont indépendantes." }
    d: { en: "The storage mode of the model doesn't affect manual labeling.", fr: "Le mode de stockage du modèle n'a pas d'incidence sur l'étiquetage manuel." }
    e: { en: "This setting controls the propagation of labels to downstream items, not manual labeling.", fr: "Ce paramètre contrôle la propagation des étiquettes vers les éléments en aval, pas l'étiquetage manuel." }
references:
  - title: Apply sensitivity labels to Fabric items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/apply-sensitivity-labels
  - title: Information protection in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/information-protection
