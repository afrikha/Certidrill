id: dp600-1b-promote-report
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a report named SalesReport. You have the Contributor role in Workspace1.

    Your organization has not enabled certification or master data endorsement. You need to signal to other users that SalesReport is ready to be shared and reused. The solution must not require any action from a Fabric administrator.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un rapport nommé SalesReport. Vous avez le rôle Contributor dans Workspace1.

    Votre organisation n'a activé ni la certification ni l'approbation des données de référence. Vous devez signaler aux autres utilisateurs que SalesReport est prêt à être partagé et réutilisé. La solution ne doit demander aucune action d'un administrateur Fabric.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Apply a sensitivity label to SalesReport.", fr: "Appliquer une étiquette de confidentialité à SalesReport." } }
    - { id: b, text: { en: "Add SalesReport to the featured content of the workspace app.", fr: "Ajouter SalesReport au contenu en vedette de l'application de l'espace de travail." } }
    - { id: c, text: { en: "Set the endorsement of SalesReport to Promoted.", fr: "Définir l'approbation de SalesReport sur Promoted." } }
    - { id: d, text: { en: "Set the endorsement of SalesReport to Certified.", fr: "Définir l'approbation de SalesReport sur Certified." } }
answer: { optionId: c }
explanation:
  correct:
    en: The Promoted badge means that the item's creators think it is ready to share and reuse. Any user with write permission on the item, such as a Contributor, can promote it from the item's Settings > Endorsement, and no tenant setting is required.
    fr: Le badge Promoted indique que les créateurs de l'élément le jugent prêt à être partagé et réutilisé. Tout utilisateur qui a l'autorisation d'écriture sur l'élément, comme un Contributor, peut le promouvoir depuis Paramètres > Approbation de l'élément, et aucun paramètre de locataire n'est nécessaire.
  options:
    a:
      en: A sensitivity label classifies and protects the content; it is not an endorsement and does not tell users that the report is ready to reuse.
      fr: Une étiquette de confidentialité classe et protège le contenu ; ce n'est pas une approbation et elle n'indique pas que le rapport est prêt à être réutilisé.
    b:
      en: Featuring content in an app changes how the app presents it; it does not add an endorsement badge to the report.
      fr: Mettre du contenu en vedette dans une application change sa présentation dans l'application ; cela n'ajoute pas de badge d'approbation au rapport.
    d:
      en: Certification must be enabled by a Fabric administrator, and only the users the administrator authorizes can certify items.
      fr: La certification doit être activée par un administrateur Fabric, et seuls les utilisateurs que l'administrateur autorise peuvent certifier des éléments.
references:
  - title: Endorse Fabric and Power BI items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/endorsement-promote-certify
