id: dp600-1c-xmla-client-tools
objective: "1.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model named **SM-Claims** in a Fabric workspace whose capacity has the XMLA Endpoint setting set to **Read Write**. You have the Contributor role in the workspace.

    You need to perform the tasks described in the answer area through the XMLA endpoint.

    Which tool should you use for each task? To answer, drag the appropriate tools to the correct tasks. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique nommé **SM-Claims** dans un espace de travail Fabric dont la capacité a le paramètre XMLA Endpoint défini sur **Read Write**. Vous avez le rôle Contributor dans l'espace de travail.

    Vous devez effectuer par le point de terminaison XMLA les tâches décrites dans la zone de réponse.

    Quel outil devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les outils appropriés vers les tâches correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: profiler, text: SQL Server Profiler }
    - { id: alm, text: ALM Toolkit }
    - { id: ssms, text: SQL Server Management Studio }
    - { id: daxstudio, text: DAX Studio }
    - { id: excel, text: Microsoft Excel }
    - { id: rb, text: Power BI Report Builder }
  targets:
    - { id: trace, text: { en: "Capture the events that SM-Claims raises while reports query it", fr: "Capturer les événements que SM-Claims déclenche pendant que des rapports l'interrogent" } }
    - { id: compare, text: { en: "Compare SM-Claims with a model in another workspace and deploy only the differences", fr: "Comparer SM-Claims à un modèle d'un autre espace de travail et déployer uniquement les différences" } }
    - { id: script, text: { en: "Run a TMSL script that refreshes one table of SM-Claims", fr: "Exécuter un script TMSL qui actualise une table de SM-Claims" } }
    - { id: perf, text: { en: "Author a DAX query and analyze its performance", fr: "Écrire une requête DAX et analyser ses performances" } }
answer:
  mapping: { trace: profiler, compare: alm, script: ssms, perf: daxstudio }
explanation:
  correct:
    en: "SQL Server Profiler traces and debugs model events. ALM Toolkit compares schemas and deploys the differences between environments. SQL Server Management Studio runs TMSL scripts and fine-grained refreshes. DAX Studio is a read-only tool for DAX authoring, tracing and performance analysis. Excel and Power BI Report Builder only read the model, to build PivotTables and paginated reports."
    fr: "SQL Server Profiler trace et débogue les événements du modèle. ALM Toolkit compare les schémas et déploie les différences entre environnements. SQL Server Management Studio exécute des scripts TMSL et des actualisations granulaires. DAX Studio est un outil en lecture seule pour l'écriture de DAX, le traçage et l'analyse des performances. Excel et Power BI Report Builder ne font que lire le modèle, pour créer des tableaux croisés dynamiques et des rapports paginés."
references:
  - title: Semantic model connectivity and management with the XMLA endpoint in Power BI
    url: https://learn.microsoft.com/en-us/fabric/enterprise/powerbi/service-premium-connect-tools
