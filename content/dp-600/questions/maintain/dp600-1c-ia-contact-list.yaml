id: dp600-1c-ia-contact-list
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Finance** that contains reports built on semantic models from other workspaces. WS-Finance was created by an employee who has left the company. No workspace settings were changed after its creation.

    Data engineers use **Notify contacts** in impact analysis before they change the upstream items. You discover that their messages don't reach the Microsoft Entra group **FinanceBI**, which supports the reports of WS-Finance.

    You need to ensure that FinanceBI receives these messages. The solution must not change anyone's access.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Finance** qui contient des rapports reposant sur des modèles sémantiques d'autres espaces de travail. WS-Finance a été créé par un employé qui a quitté l'entreprise. Aucun paramètre de l'espace de travail n'a été modifié depuis sa création.

    Les ingénieurs Données utilisent **Notifier les contacts** dans l'analyse d'impact avant de modifier les éléments en amont. Vous découvrez que leurs messages n'atteignent pas le groupe Microsoft Entra **FinanceBI**, qui assure le support des rapports de WS-Finance.

    Vous devez faire en sorte que FinanceBI reçoive ces messages. La solution ne doit modifier l'accès de personne.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign FinanceBI the Viewer role in WS-Finance.", fr: "Attribuer à FinanceBI le rôle Viewer dans WS-Finance." } }
    - { id: b, text: { en: "Add FinanceBI to the contact list in the settings of WS-Finance.", fr: "Ajouter FinanceBI à la liste de contacts dans les paramètres de WS-Finance." } }
    - { id: c, text: { en: "Subscribe FinanceBI to every report in WS-Finance.", fr: "Abonner FinanceBI à chaque rapport de WS-Finance." } }
    - { id: d, text: { en: "Assign FinanceBI the Admin role in WS-Finance.", fr: "Attribuer à FinanceBI le rôle Admin dans WS-Finance." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Notify contacts sends the email to the contact lists of the impacted workspaces. By default, the contact list contains the person who created the workspace, here a former employee. Adding the FinanceBI group to the contact list in the workspace settings routes the messages to the group without granting any access."
    fr: "Notifier les contacts envoie l'e-mail aux listes de contacts des espaces de travail touchés. Par défaut, la liste de contacts contient la personne qui a créé l'espace de travail, ici un ancien employé. Ajouter le groupe FinanceBI à la liste de contacts dans les paramètres de l'espace de travail envoie les messages au groupe sans accorder d'accès."
  options:
    a:
      en: "A workspace role grants access, which the requirement forbids, and it doesn't add the group to the contact list."
      fr: "Un rôle d'espace de travail accorde un accès, ce que l'exigence interdit, et il n'ajoute pas le groupe à la liste de contacts."
    c:
      en: "Report subscriptions email report snapshots on a schedule; they don't deliver impact analysis notifications."
      fr: "Les abonnements aux rapports envoient des captures de rapports selon une planification ; ils ne transmettent pas les notifications de l'analyse d'impact."
    d:
      en: "The Admin role grants full access, and being an admin doesn't put the group on the contact list."
      fr: "Le rôle Admin accorde un accès complet, et le fait d'être administrateur ne place pas le groupe dans la liste de contacts."
references:
  - title: Impact analysis
    url: https://learn.microsoft.com/en-us/fabric/governance/impact-analysis
  - title: Workspaces in Microsoft Fabric and Power BI
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/workspaces
