id: dp600-1b-enable-certification
objective: "1.1.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are a Fabric administrator. You need to enable certification so that only the members of the data governance team can certify items.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes administrateur Fabric. Vous devez activer la certification afin que seuls les membres de l'équipe de gouvernance des données puissent certifier des éléments.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      1. In the OneLake catalog, select Govern > Configurations > [[loc]].
      2. Under Export and sharing settings, expand Certification and set the toggle to Enabled.
      3. Authorize the team by specifying [[who]].
      4. Select Apply.
    fr: |
      1. Dans le catalogue OneLake, sélectionnez Govern > Configurations > [[loc]].
      2. Sous Export and sharing settings, développez Certification et activez le bouton bascule (Enabled).
      3. Autorisez l'équipe en indiquant [[who]].
      4. Sélectionnez Apply.
  slots:
    - id: loc
      options:
        - { id: cap, text: Capacity settings }
        - { id: tenant, text: Tenant settings }
        - { id: dom, text: Domains }
        - { id: ws, text: Workspaces }
    - id: who
      options:
        - { id: users, text: { en: "the user accounts of the team members", fr: "les comptes d'utilisateur des membres de l'équipe" } }
        - { id: role, text: { en: "a workspace role", fr: "un rôle d'espace de travail" } }
        - { id: sg, text: { en: "a security group that contains the team members", fr: "un groupe de sécurité qui contient les membres de l'équipe" } }
answer:
  values: { loc: tenant, who: sg }
explanation:
  correct:
    en: Certification is a tenant setting, found in the Export and sharing settings section of the tenant settings. Authorized certifiers are specified as one or more security groups; individual users can't be entered.
    fr: La certification est un paramètre de locataire, dans la section Export and sharing settings des paramètres de locataire. Les certificateurs autorisés sont indiqués sous forme d'un ou plusieurs groupes de sécurité ; il est impossible de saisir des utilisateurs individuels.
  options:
    cap: { en: "Capacity settings manage capacities and their workloads, not endorsement.", fr: "Les paramètres de capacité gèrent les capacités et leurs charges de travail, pas l'approbation." }
    dom: { en: "Domain administrators can override certification only if the tenant setting delegates it; certification is enabled in the tenant settings.", fr: "Les administrateurs de domaine ne peuvent remplacer la certification que si le paramètre de locataire le délègue ; la certification s'active dans les paramètres de locataire." }
    users: { en: "The Certification setting accepts security groups only.", fr: "Le paramètre Certification n'accepte que des groupes de sécurité." }
    role: { en: "Workspace roles give write permission on items but don't authorize certification.", fr: "Les rôles d'espace de travail donnent l'autorisation d'écriture sur les éléments, mais n'autorisent pas la certification." }
references:
  - title: Enable item certification
    url: https://learn.microsoft.com/en-us/fabric/admin/endorsement-setup
