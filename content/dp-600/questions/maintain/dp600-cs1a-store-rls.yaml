id: dp600-cs1a-store-rls
objective: "1.1.3"
type: single
caseStudy: dp600-cs1a-wingtip-toys
difficulty: 3
status: draft
stem:
  en: |
    SalesModel and the Store Sales report have been deployed to WT-Prod. You need to meet the security requirement for the store managers. What should you do?
  fr: |
    SalesModel et le rapport Store Sales ont été déployés dans WT-Prod. Vous devez satisfaire l'exigence de sécurité concernant les directeurs de magasin. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In SalesModel, create a role that filters gold_dim_store on ManagerEmail = USERPRINCIPALNAME(), add SG-StoreManagers to the role and share the Store Sales report with the group", fr: "Dans SalesModel, créer un rôle qui filtre gold_dim_store sur ManagerEmail = USERPRINCIPALNAME(), ajouter SG-StoreManagers au rôle et partager le rapport Store Sales avec le groupe" } }
    - { id: b, text: { en: "In SalesModel, create a role that filters gold_dim_store on ManagerEmail = USERPRINCIPALNAME(), add SG-StoreManagers to the role and grant the group the Contributor role on WT-Prod", fr: "Dans SalesModel, créer un rôle qui filtre gold_dim_store sur ManagerEmail = USERPRINCIPALNAME(), ajouter SG-StoreManagers au rôle et accorder au groupe le rôle Contributor sur WT-Prod" } }
    - { id: c, text: { en: "In the SQL analytics endpoint of LH_Retail, create a security policy that filters gold_fact_sales by store manager and share the Store Sales report with SG-StoreManagers", fr: "Dans le point de terminaison d'analytique SQL de LH_Retail, créer une stratégie de sécurité qui filtre gold_fact_sales par directeur de magasin et partager le rapport Store Sales avec SG-StoreManagers" } }
    - { id: d, text: { en: "In the SQL analytics endpoint of LH_Retail, create a view that filters gold_fact_sales on USER_NAME() and share the Store Sales report with SG-StoreManagers", fr: "Dans le point de terminaison d'analytique SQL de LH_Retail, créer une vue qui filtre gold_fact_sales sur USER_NAME() et partager le rapport Store Sales avec SG-StoreManagers" } }
answer: { optionId: a }
explanation:
  correct:
    en: SalesModel is a Direct Lake on OneLake model, so row-level security must be defined in the semantic model. A dynamic rule on gold_dim_store compares ManagerEmail with USERPRINCIPALNAME() and filters the sales through the relationship. Sharing the report gives the managers read access to the report and its model without a workspace role; RLS filters users who only have read access, and the managers get no direct access to the lakehouse.
    fr: SalesModel est un modèle Direct Lake sur OneLake ; la sécurité au niveau des lignes doit donc être définie dans le modèle sémantique. Une règle dynamique sur gold_dim_store compare ManagerEmail avec USERPRINCIPALNAME() et filtre les ventes via la relation. Le partage du rapport donne aux directeurs un accès en lecture au rapport et à son modèle sans rôle d'espace de travail ; la sécurité au niveau des lignes filtre les utilisateurs qui n'ont qu'un accès en lecture, et les directeurs n'obtiennent aucun accès direct au lakehouse.
  options:
    b:
      en: Admin, Member and Contributor have edit permission on the semantic model, so RLS does not filter their data; Contributor also gives more access than needed.
      fr: Admin, Member et Contributor disposent de l'autorisation de modification sur le modèle sémantique ; la sécurité au niveau des lignes ne filtre donc pas leurs données. Contributor donne en outre plus d'accès que nécessaire.
    c:
      en: Direct Lake on OneLake does not apply RLS defined at the SQL analytics endpoint; it reads the Delta files in OneLake directly.
      fr: Direct Lake sur OneLake n'applique pas la sécurité au niveau des lignes définie dans le point de terminaison d'analytique SQL ; il lit directement les fichiers Delta dans OneLake.
    d:
      en: A Direct Lake on OneLake model can't be built on a non-materialized SQL view, and the report uses the model tables, not the view.
      fr: Un modèle Direct Lake sur OneLake ne peut pas être construit sur une vue SQL non matérialisée, et le rapport utilise les tables du modèle, pas la vue.
references:
  - title: Row-level security (RLS) with Power BI
    url: https://learn.microsoft.com/en-us/fabric/security/service-admin-row-level-security
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
