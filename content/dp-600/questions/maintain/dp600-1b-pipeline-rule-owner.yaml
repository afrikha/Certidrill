id: dp600-1b-pipeline-rule-owner
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a deployment pipeline named Pipeline1 that has Development, Test and Production stages. You are a pipeline admin and you have the Admin role in all three workspaces.

    The Test workspace contains an Import mode semantic model named SM-Finance that connects to an Azure SQL database named sqldb-dev. User2 is the owner of SM-Finance in every stage, is a pipeline admin, and has the Member role in all three workspaces. User2 must remain the owner of SM-Finance.

    SM-Finance in Production must connect to a database named sqldb-prod on the same server. When you open the deployment rules of the Production stage, the data source rule of SM-Finance is unavailable.

    What should you do?
  fr: |
    Vous disposez d'un pipeline de déploiement nommé Pipeline1 qui comporte les étapes Development, Test et Production. Vous êtes administrateur du pipeline et vous avez le rôle Admin dans les trois espaces de travail.

    L'espace de travail de Test contient un modèle sémantique en mode Import nommé SM-Finance qui se connecte à une base de données Azure SQL nommée sqldb-dev. User2 est le propriétaire de SM-Finance dans chaque étape, est administrateur du pipeline et a le rôle Member dans les trois espaces de travail. User2 doit rester propriétaire de SM-Finance.

    En Production, SM-Finance doit se connecter à une base de données nommée sqldb-prod sur le même serveur. Quand vous ouvrez les règles de déploiement de l'étape Production, la règle de source de données de SM-Finance n'est pas disponible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Ask User2 to create the data source rule in the Production stage, and then redeploy SM-Finance.", fr: "Demander à User2 de créer la règle de source de données dans l'étape Production, puis redéployer SM-Finance." } }
    - { id: b, text: { en: "Create the data source rule in the Development stage, and then deploy SM-Finance through each stage.", fr: "Créer la règle de source de données dans l'étape Development, puis déployer SM-Finance à travers chaque étape." } }
    - { id: c, text: { en: "Create a parameter rule for SM-Finance in the Production stage, and then redeploy SM-Finance.", fr: "Créer une règle de paramètre pour SM-Finance dans l'étape Production, puis redéployer SM-Finance." } }
    - { id: d, text: { en: "Change the data source of SM-Finance in the Test workspace, and then redeploy SM-Finance.", fr: "Modifier la source de données de SM-Finance dans l'espace de travail de Test, puis redéployer SM-Finance." } }
answer: { optionId: a }
explanation:
  correct:
    en: Only the owner of an item can create deployment rules for it, and data source rules are greyed out for other users, even workspace Admins. User2 owns SM-Finance and has the other required permissions, so User2 creates the rule in the target stage; the rule takes effect at the next deployment to Production.
    fr: |
      Seul le propriétaire d'un élément peut créer des règles de déploiement pour celui-ci, et les règles de source de données sont grisées pour les autres utilisateurs, même Admins de l'espace de travail. User2 est propriétaire de SM-Finance et a les autres autorisations nécessaires : User2 crée la règle dans l'étape cible ; elle prend effet au déploiement suivant vers Production.
  options:
    b: { en: "Deployment rules can't be created in the development stage; they are defined in the stage that receives the deployment.", fr: "Les règles de déploiement ne peuvent pas être créées dans l'étape de développement ; elles sont définies dans l'étape qui reçoit le déploiement." }
    c: { en: "SM-Finance isn't parameterized, and parameter rules have the same ownership requirement as data source rules.", fr: "SM-Finance n'est pas paramétré, et les règles de paramètre ont la même exigence de propriété que les règles de source de données." }
    d: { en: "Changing the source in Test would also make Test use the production database, and Production would still have no rule.", fr: "Modifier la source en Test ferait aussi utiliser la base de production par Test, et Production n'aurait toujours aucune règle." }
references:
  - title: Create deployment rules for Fabric's ALM
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/create-rules
