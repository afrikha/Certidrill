id: dp600-1a-lbl-datasource-import
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has an Azure SQL Database named **SalesDB** whose tables are labeled **Confidential** by using Microsoft Purview. In Fabric, the tenant setting **Apply sensitivity labels from data sources to their data in Power BI** is enabled.

    A semantic model named **SalesModel** connects to SalesDB in DirectQuery mode through a cloud connection. The owner of SalesModel has a Power BI Pro license, and the Confidential label is published to the owner. SalesModel remains unlabeled.

    SalesModel must get the label of SalesDB automatically. What should you do?
  fr: |
    Adatum dispose d'une base de données Azure SQL Database nommée **SalesDB** dont les tables sont étiquetées **Confidential** avec Microsoft Purview. Dans Fabric, le paramètre de locataire **Apply sensitivity labels from data sources to their data in Power BI** est activé.

    Un modèle sémantique nommé **SalesModel** se connecte à SalesDB en mode DirectQuery via une connexion cloud. Le propriétaire de SalesModel dispose d'une licence Power BI Pro, et l'étiquette Confidential est publiée pour lui. SalesModel reste sans étiquette.

    SalesModel doit recevoir automatiquement l'étiquette de SalesDB. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the storage mode of the SalesModel tables to Import", fr: "Passer le mode de stockage des tables de SalesModel en Import" } }
    - { id: b, text: { en: "Ask a Fabric administrator to enable Automatically apply sensitivity labels to downstream content", fr: "Demander à un administrateur Fabric d'activer Automatically apply sensitivity labels to downstream content" } }
    - { id: c, text: { en: "Connect SalesModel to SalesDB through an on-premises data gateway", fr: "Connecter SalesModel à SalesDB via une passerelle de données locale" } }
    - { id: d, text: { en: "Endorse SalesModel as Certified", fr: "Approuver SalesModel comme Certified" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Label inheritance from data sources works for Power BI semantic models that import data from supported sources, such as Azure SQL Database. Live connection and DirectQuery aren't supported, so switching the tables to Import makes SalesModel inherit Confidential at the next refresh."
    fr: "L'héritage d'étiquettes depuis les sources de données fonctionne pour les modèles sémantiques Power BI qui importent les données de sources prises en charge, comme Azure SQL Database. La connexion active et DirectQuery ne sont pas pris en charge : passer les tables en Import fait hériter Confidential à SalesModel lors de la prochaine actualisation."
  options:
    b: { en: "This setting propagates labels from labeled Fabric and Power BI items to downstream items; it doesn't read labels from SalesDB.", fr: "Ce paramètre propage les étiquettes d'éléments Fabric et Power BI étiquetés vers les éléments en aval ; il ne lit pas les étiquettes de SalesDB." }
    c: { en: "Connections through a gateway aren't supported for label inheritance from data sources.", fr: "Les connexions via une passerelle ne sont pas prises en charge pour l'héritage d'étiquettes depuis les sources de données." }
    d: { en: "Endorsement doesn't apply or inherit sensitivity labels.", fr: "L'approbation n'applique ni n'hérite d'étiquettes de confidentialité." }
references:
  - title: Sensitivity label inheritance from data sources in Power BI
    url: https://learn.microsoft.com/en-us/fabric/governance/service-security-sensitivity-label-inheritance-from-data-sources
