id: dp600-cs1a-pipeline-binding
objective: "1.2.3"
type: single
caseStudy: dp600-cs1a-wingtip-toys
difficulty: 3
status: draft
stem:
  en: |
    You create WT-Pipeline and assign WT-Dev, WT-Test and WT-Prod to the Development, Test and Production stages. You deploy LH_Retail and SalesModel to the Test stage. You need to meet the lifecycle requirement for SalesModel in the Test and Production stages. What should you do?
  fr: |
    Vous créez WT-Pipeline et attribuez WT-Dev, WT-Test et WT-Prod aux phases Development, Test et Production. Vous déployez LH_Retail et SalesModel dans la phase Test. Vous devez satisfaire l'exigence de cycle de vie concernant SalesModel dans les phases Test et Production. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Nothing, because autobinding connects SalesModel to the LH_Retail lakehouse of each target stage", fr: "Rien, car la liaison automatique connecte SalesModel au lakehouse LH_Retail de chaque phase cible" } }
    - { id: b, text: { en: "Create a data source rule on SalesModel in the Test and Production stages", fr: "Créer une règle de source de données sur SalesModel dans les phases Test et Production" } }
    - { id: c, text: { en: "Parameterize the workspace and lakehouse IDs in SalesModel and create parameter rules in the Test and Production stages", fr: "Paramétrer les ID d'espace de travail et de lakehouse dans SalesModel et créer des règles de paramètre dans les phases Test et Production" } }
    - { id: d, text: { en: "Create a default lakehouse rule on SalesModel in the Test and Production stages", fr: "Créer une règle de lakehouse par défaut sur SalesModel dans les phases Test et Production" } }
answer: { optionId: c }
explanation:
  correct:
    en: A Direct Lake semantic model is not autobound to the lakehouse of the target stage; after deployment it still points to the source-stage lakehouse. For Direct Lake on OneLake, you define Text M parameters for the workspace ID and lakehouse ID, use them in the connection expression, and set a parameter rule for each value in the Test and Production stages.
    fr: Un modèle sémantique Direct Lake n'est pas lié automatiquement au lakehouse de la phase cible ; après le déploiement, il pointe toujours vers le lakehouse de la phase source. Pour Direct Lake sur OneLake, vous définissez des paramètres M de type Text pour l'ID d'espace de travail et l'ID de lakehouse, vous les utilisez dans l'expression de connexion, puis vous créez une règle de paramètre pour chaque valeur dans les phases Test et Production.
  options:
    a:
      en: Autobinding works for other item types, but a deployed Direct Lake semantic model keeps its binding to the lakehouse of the source stage.
      fr: La liaison automatique fonctionne pour d'autres types d'éléments, mais un modèle sémantique Direct Lake déployé reste lié au lakehouse de la phase source.
    b:
      en: Data source rules are the method for Direct Lake on SQL analytics endpoint models. Deployment pipelines do not provide data source rules for Direct Lake on OneLake models.
      fr: Les règles de source de données sont la méthode prévue pour les modèles Direct Lake sur le point de terminaison d'analytique SQL. Les pipelines de déploiement ne proposent pas de règles de source de données pour les modèles Direct Lake sur OneLake.
    d:
      en: Default lakehouse rules exist only for notebooks; they set the default lakehouse of a notebook in the target stage.
      fr: Les règles de lakehouse par défaut existent uniquement pour les notebooks ; elles définissent le lakehouse par défaut d'un notebook dans la phase cible.
references:
  - title: The Microsoft Fabric deployment pipelines process
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/understand-the-deployment-process
  - title: Develop Direct Lake semantic models
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-develop
