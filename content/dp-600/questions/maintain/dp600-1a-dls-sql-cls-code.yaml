id: dp600-1a-dls-sql-cls-code
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a Fabric warehouse named **WH-People**. The table `dbo.Employees` contains the columns `EmployeeID`, `FullName`, `Department`, `HireDate`, `Salary` and `NationalID`.

    WH-People was shared with an HR analyst named ana@proseware.com without any additional permission. Ana must read every column of `dbo.Employees` except `Salary` and `NationalID`, and her report query must run without errors.

    How should you complete the T-SQL statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un entrepôt Fabric nommé **WH-People**. La table `dbo.Employees` contient les colonnes `EmployeeID`, `FullName`, `Department`, `HireDate`, `Salary` et `NationalID`.

    WH-People a été partagé avec une analyste RH nommée ana@proseware.com sans autorisation supplémentaire. Ana doit lire toutes les colonnes de `dbo.Employees` sauf `Salary` et `NationalID`, et sa requête de rapport doit s'exécuter sans erreur.

    Comment devez-vous compléter les instructions T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    -- Run by a workspace Admin
    [[s1]] SELECT ON dbo.Employees ([[s2]]) TO [ana@proseware.com];

    -- Report query run by Ana
    SELECT [[s3]] FROM dbo.Employees;
  slots:
    - id: s1
      options:
        - { id: grant, text: GRANT }
        - { id: deny, text: DENY }
        - { id: revoke, text: REVOKE }
    - id: s2
      options:
        - { id: allowed, text: "EmployeeID, FullName, Department, HireDate" }
        - { id: secret, text: "Salary, NationalID" }
        - { id: all, text: "EmployeeID, FullName, Department, HireDate, Salary, NationalID" }
    - id: s3
      options:
        - { id: star, text: "*" }
        - { id: allowed, text: "EmployeeID, FullName, Department, HireDate" }
        - { id: mixed, text: "EmployeeID, FullName, Salary" }
answer:
  values: { s1: grant, s2: allowed, s3: allowed }
explanation:
  correct:
    en: "Column-level security grants SELECT on the allowed columns only. Ana has no other permission on the table, so a DENY on the sensitive columns would leave her with nothing to read. A restricted user must list the permitted columns; `SELECT *` touches a denied column and fails with a permission error."
    fr: "La sécurité au niveau des colonnes accorde SELECT sur les seules colonnes autorisées. Ana n'a aucune autre autorisation sur la table : un DENY sur les colonnes sensibles ne lui laisserait rien à lire. Un utilisateur restreint doit lister les colonnes autorisées ; `SELECT *` touche une colonne refusée et échoue avec une erreur d'autorisation."
  options:
    star: { en: "SELECT * includes Salary and NationalID, so the query fails for Ana.", fr: "SELECT * inclut Salary et NationalID : la requête échoue pour Ana." }
    mixed: { en: "Salary isn't granted, so the query fails.", fr: "Salary n'est pas accordée : la requête échoue." }
    deny: { en: "DENY removes access, but Ana has no grant on the table to start with.", fr: "DENY retire un accès, mais Ana n'a au départ aucune autorisation sur la table." }
references:
  - title: Column-level security in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/column-level-security
