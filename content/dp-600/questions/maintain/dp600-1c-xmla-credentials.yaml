id: dp600-1c-xmla-credentials
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Retail** on a Fabric capacity whose XMLA Endpoint setting is set to **Read Write**. You have the Contributor role in WS-Retail.

    You deploy a Visual Studio tabular project named **RetailModel** to WS-Retail for the first time. The model uses an Azure SQL database as its data source. The deployment creates the semantic model, but processing to load the data fails.

    You need to load the data into RetailModel.

    What should you do first?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Retail** sur une capacité Fabric dont le paramètre XMLA Endpoint est défini sur **Read Write**. Vous avez le rôle Contributor dans WS-Retail.

    Vous déployez pour la première fois un projet tabulaire Visual Studio nommé **RetailModel** dans WS-Retail. Le modèle utilise une base de données Azure SQL comme source de données. Le déploiement crée le modèle sémantique, mais le traitement qui charge les données échoue.

    Vous devez charger les données dans RetailModel.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Set the data source credentials in the settings of RetailModel in the service.", fr: "Définir les informations d'identification de la source de données dans les paramètres de RetailModel dans le service." } }
    - { id: b, text: { en: "Add the credentials to the data source definition of the project, and then redeploy.", fr: "Ajouter les informations d'identification à la définition de la source de données du projet, puis redéployer." } }
    - { id: c, text: { en: "Set the Processing Option property of the project to Do Not Process, and then redeploy.", fr: "Définir la propriété Processing Option du projet sur Do Not Process, puis redéployer." } }
    - { id: d, text: { en: "Run a TMSL refresh command of type full on RetailModel from SSMS.", fr: "Exécuter depuis SSMS une commande TMSL refresh de type full sur RetailModel." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Metadata deployed through the XMLA endpoint can create connections to data sources, but it can't set their credentials, so the first processing fails. You set the credentials in the semantic model settings in the service, under Data source credentials, and then refresh the model in the service or process it from SSMS."
    fr: "Les métadonnées déployées par le point de terminaison XMLA peuvent créer des connexions aux sources de données, mais pas définir leurs informations d'identification : le premier traitement échoue donc. Vous définissez les informations d'identification dans les paramètres du modèle sémantique dans le service, sous Data source credentials, puis vous actualisez le modèle dans le service ou le traitez depuis SSMS."
  options:
    b:
      en: "Credentials can't be set through the XMLA endpoint, so redeploying the project doesn't supply them."
      fr: "Les informations d'identification ne peuvent pas être définies par le point de terminaison XMLA : redéployer le projet ne les fournit pas."
    c:
      en: "Do Not Process avoids the failed processing during deployment, but the model still has no credentials and no data."
      fr: "Do Not Process évite l'échec du traitement pendant le déploiement, mais le modèle n'a toujours ni informations d'identification ni données."
    d:
      en: "The refresh would fail for the same reason until credentials are set in the service."
      fr: "L'actualisation échouerait pour la même raison tant que les informations d'identification ne sont pas définies dans le service."
references:
  - title: Semantic model connectivity and management with the XMLA endpoint in Power BI
    url: https://learn.microsoft.com/en-us/fabric/enterprise/powerbi/service-premium-connect-tools
