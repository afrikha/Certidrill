id: dp600-1b-certifier-group
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your Fabric tenant has the Certification tenant setting enabled for a security group named DataStewards.

    A data architect named Ben must also be able to certify semantic models. Ben is not a member of any security group, and he has the Contributor role in the workspaces that contain the semantic models. You need to authorize Ben to certify items.

    What should you do?
  fr: |
    Votre locataire Fabric a le paramètre de locataire Certification activé pour un groupe de sécurité nommé DataStewards.

    Un architecte de données nommé Ben doit lui aussi pouvoir certifier des modèles sémantiques. Ben n'est membre d'aucun groupe de sécurité, et il a le rôle Contributor dans les espaces de travail qui contiennent les modèles sémantiques. Vous devez autoriser Ben à certifier des éléments.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add Ben's user account to the list of users in the Certification tenant setting.", fr: "Ajouter le compte d'utilisateur de Ben à la liste des utilisateurs du paramètre de locataire Certification." } }
    - { id: b, text: { en: "Assign Ben the Admin role in the workspaces that contain the semantic models.", fr: "Attribuer à Ben le rôle Admin dans les espaces de travail qui contiennent les modèles sémantiques." } }
    - { id: c, text: { en: "Select Domain admins can enable/disable in the Certification tenant setting.", fr: "Sélectionner Domain admins can enable/disable dans le paramètre de locataire Certification." } }
    - { id: d, text: { en: "Add Ben to the DataStewards security group.", fr: "Ajouter Ben au groupe de sécurité DataStewards." } }
answer: { optionId: d }
explanation:
  correct:
    en: The Certification tenant setting authorizes certifiers only through security groups; individual users can't be entered. Adding Ben to DataStewards authorizes him, and his Contributor role already gives him the write permission that certification also requires.
    fr: "Le paramètre de locataire Certification n'autorise des certificateurs que par des groupes de sécurité : il est impossible d'y saisir des utilisateurs individuels. Ajouter Ben à DataStewards l'autorise, et son rôle Contributor lui donne déjà l'autorisation d'écriture que la certification exige aussi."
  options:
    a: { en: "The setting accepts security groups only, not named users.", fr: "Le paramètre n'accepte que des groupes de sécurité, pas des utilisateurs nommés." }
    b: { en: "A workspace role gives write permission, but certification also requires authorization by the Fabric administrator through the tenant setting.", fr: "Un rôle d'espace de travail donne l'autorisation d'écriture, mais la certification exige aussi une autorisation de l'administrateur Fabric via le paramètre de locataire." }
    c: { en: "This option lets domain administrators override the certification settings for their domains; it does not authorize Ben.", fr: "Cette option permet aux administrateurs de domaine de remplacer les paramètres de certification de leurs domaines ; elle n'autorise pas Ben." }
references:
  - title: Enable item certification
    url: https://learn.microsoft.com/en-us/fabric/admin/endorsement-setup
