id: dp600-1a-lbl-mandatory-spn
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys configured a Microsoft Purview label policy that requires users to apply a label to their Fabric and Power BI content. Report authors can no longer save an unlabeled report.

    A release pipeline in Azure DevOps authenticates as a service principal and publishes reports to a workspace named **WS-Prod** by calling the Power BI REST APIs. The reports that it publishes have no sensitivity label.

    What explains this behavior?
  fr: |
    Tailspin Toys a configuré une stratégie d'étiquette Microsoft Purview qui oblige les utilisateurs à appliquer une étiquette à leur contenu Fabric et Power BI. Les auteurs de rapports ne peuvent plus enregistrer de rapport sans étiquette.

    Un pipeline de mise en production Azure DevOps s'authentifie en tant que principal de service et publie des rapports dans un espace de travail nommé **WS-Prod** en appelant les API REST Power BI. Les rapports qu'il publie n'ont aucune étiquette de confidentialité.

    Qu'est-ce qui explique ce comportement ?
body:
  options:
    - { id: a, text: { en: "Mandatory labeling applies only to .pbix files saved in Power BI Desktop", fr: "L'étiquetage obligatoire ne s'applique qu'aux fichiers .pbix enregistrés dans Power BI Desktop" } }
    - { id: b, text: { en: "Mandatory labeling isn't supported for reports", fr: "L'étiquetage obligatoire n'est pas pris en charge pour les rapports" } }
    - { id: c, text: { en: "Service principals and APIs aren't subject to mandatory label policies", fr: "Les principaux de service et les API ne sont pas soumis aux stratégies d'étiquetage obligatoire" } }
    - { id: d, text: { en: "Downstream inheritance is disabled for WS-Prod", fr: "L'héritage en aval est désactivé pour WS-Prod" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Mandatory label policies apply to users in the Fabric and Power BI service and in Power BI Desktop. Service principals and APIs are exempt, as are external guest users, so content published by the pipeline can stay unlabeled."
    fr: "Les stratégies d'étiquetage obligatoire s'appliquent aux utilisateurs dans le service Fabric et Power BI et dans Power BI Desktop. Les principaux de service et les API en sont exemptés, comme les utilisateurs invités externes : le contenu publié par le pipeline peut rester sans étiquette."
  options:
    a: { en: "Mandatory labeling also applies in the service: users can't save new or changed items without a label.", fr: "L'étiquetage obligatoire s'applique aussi dans le service : les utilisateurs ne peuvent pas enregistrer d'éléments nouveaux ou modifiés sans étiquette." }
    b: { en: "Mandatory labeling is fully supported for Power BI items, including reports.", fr: "L'étiquetage obligatoire est entièrement pris en charge pour les éléments Power BI, rapports compris." }
    d: { en: "Downstream inheritance copies labels from labeled parents; it isn't a workspace setting and doesn't enforce labeling.", fr: "L'héritage en aval copie les étiquettes de parents étiquetés ; ce n'est pas un paramètre d'espace de travail et il n'impose pas d'étiquetage." }
references:
  - title: Mandatory label policy for Fabric and Power BI
    url: https://learn.microsoft.com/en-us/fabric/governance/mandatory-label-policy
