id: dp600-1b-make-discoverable
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Finance that contains a semantic model named SM-Budget. User1 has the Contributor role in Finance and has promoted SM-Budget.

    The Fabric administrator has enabled the Make promoted content discoverable and Discover content tenant settings for the entire organization.

    Users who don't have access to SM-Budget must be able to find it in the OneLake catalog and request access to it. They must not receive access until the request is approved. When User1 opens the endorsement settings of SM-Budget, the Make discoverable option is unavailable.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Finance qui contient un modèle sémantique nommé SM-Budget. User1 a le rôle Contributor dans Finance et a promu SM-Budget.

    L'administrateur Fabric a activé les paramètres de locataire Make promoted content discoverable et Discover content pour toute l'organisation.

    Les utilisateurs qui n'ont pas accès à SM-Budget doivent pouvoir le trouver dans le catalogue OneLake et demander à y accéder. Ils ne doivent pas obtenir l'accès avant l'approbation de la demande. Quand User1 ouvre les paramètres d'approbation de SM-Budget, l'option Make discoverable n'est pas disponible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Ask an authorized reviewer to certify SM-Budget, and then have User1 select Make discoverable.", fr: "Demander à un réviseur autorisé de certifier SM-Budget, puis faire sélectionner Make discoverable par User1." } }
    - { id: b, text: { en: "Grant the Build permission on SM-Budget to all the users of the organization.", fr: "Accorder l'autorisation Build sur SM-Budget à tous les utilisateurs de l'organisation." } }
    - { id: c, text: { en: "Ask a user who has the Admin or Member role in Finance to select Make discoverable.", fr: "Demander à un utilisateur qui a le rôle Admin ou Member dans Finance de sélectionner Make discoverable." } }
    - { id: d, text: { en: "Ask the Fabric administrator to enable the Make certified content discoverable setting.", fr: "Demander à l'administrateur Fabric d'activer le paramètre Make certified content discoverable." } }
answer: { optionId: c }
explanation:
  correct:
    en: A discoverable semantic model is listed in the OneLake catalog for users without access, who can then request the Build permission. The model must be promoted or certified, which SM-Budget already is, and marking it as discoverable requires the Admin or Member role in its workspace, which User1, a Contributor, doesn't have.
    fr: Un modèle sémantique détectable est listé dans le catalogue OneLake pour les utilisateurs sans accès, qui peuvent alors demander l'autorisation Build. Le modèle doit être promu ou certifié, ce qui est déjà le cas de SM-Budget, et le rendre détectable demande le rôle Admin ou Member dans son espace de travail, que User1, Contributor, n'a pas.
  options:
    a: { en: "Certifying the model doesn't change the workspace role that User1 needs; a promoted model can already be made discoverable.", fr: "Certifier le modèle ne change pas le rôle d'espace de travail dont User1 a besoin ; un modèle promu peut déjà être rendu détectable." }
    b: { en: "Granting Build to everyone gives access immediately, which breaks the requirement that access follows an approved request.", fr: "Accorder Build à tous donne l'accès immédiatement, ce qui enfreint l'exigence d'un accès après approbation de la demande." }
    d: { en: "SM-Budget is promoted, not certified, and the setting for promoted content is already enabled; the missing condition is User1's workspace role.", fr: "SM-Budget est promu, pas certifié, et le paramètre pour le contenu promu est déjà activé ; la condition manquante est le rôle de User1 dans l'espace de travail." }
references:
  - title: Semantic model discoverability
    url: https://learn.microsoft.com/en-us/power-bi/collaborate-share/service-discovery
