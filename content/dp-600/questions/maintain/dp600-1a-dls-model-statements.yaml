id: dp600-1a-dls-model-statements
objective: "1.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a semantic model named **StoreModel** in a Fabric workspace named **WS-Retail**. StoreModel has two row-level security (RLS) roles: **North**, which shows the stores of the north region, and **South**, which shows the stores of the south region.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un modèle sémantique nommé **StoreModel** dans un espace de travail Fabric nommé **WS-Retail**. StoreModel a deux rôles de sécurité au niveau des lignes (RLS) : **North**, qui affiche les magasins de la région nord, et **South**, qui affiche ceux de la région sud.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A Viewer of WS-Retail who is a member of both North and South sees the stores of both regions."
        fr: "Un Viewer de WS-Retail membre à la fois de North et de South voit les magasins des deux régions."
    - id: s2
      text:
        en: "You can add a Microsoft 365 group as a member of the North role."
        fr: "Vous pouvez ajouter un groupe Microsoft 365 comme membre du rôle North."
    - id: s3
      text:
        en: "A Viewer of WS-Retail who has the Build permission on StoreModel and is a member of North sees only the north stores in Analyze in Excel."
        fr: "Un Viewer de WS-Retail qui a l'autorisation Build sur StoreModel et est membre de North ne voit que les magasins du nord dans Analyser dans Excel."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "RLS roles are additive, so a user in two roles sees the rows allowed by either role. Role members can be users, security groups, distribution groups and mail-enabled groups, but Microsoft 365 groups aren't supported. RLS still applies to Viewers who have Build, for example in Analyze in Excel."
    fr: "Les rôles RLS sont cumulatifs : un utilisateur membre de deux rôles voit les lignes autorisées par l'un ou l'autre. Les membres d'un rôle peuvent être des utilisateurs, des groupes de sécurité, des groupes de distribution et des groupes à extension messagerie, mais les groupes Microsoft 365 ne sont pas pris en charge. La RLS s'applique toujours aux Viewers qui ont Build, par exemple dans Analyser dans Excel."
references:
  - title: Row-level security (RLS) with Power BI
    url: https://learn.microsoft.com/en-us/fabric/security/service-admin-row-level-security
