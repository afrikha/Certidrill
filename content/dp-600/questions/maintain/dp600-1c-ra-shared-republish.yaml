id: dp600-1c-ra-shared-republish
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Core** that contains a semantic model named **SM-Sales**, published from a Power BI Desktop file named **Sales.pbix**. SM-Sales has no incremental refresh policy. Report authors in five other workspaces built 30 reports that connect live to SM-Sales.

    You add a measure named **Margin %** to Sales.pbix. You need to make Margin % available to all 30 reports. The solution must minimize effort.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Core** qui contient un modèle sémantique nommé **SM-Sales**, publié depuis un fichier Power BI Desktop nommé **Sales.pbix**. SM-Sales n'a pas de stratégie d'actualisation incrémentielle. Des auteurs de rapports de cinq autres espaces de travail ont créé 30 rapports connectés en direct à SM-Sales.

    Vous ajoutez une mesure nommée **Margin %** à Sales.pbix. Vous devez rendre Margin % disponible pour les 30 rapports. La solution doit réduire l'effort au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Publish Sales.pbix to WS-Core with the same name, and replace SM-Sales.", fr: "Publier Sales.pbix dans WS-Core avec le même nom, et remplacer SM-Sales." } }
    - { id: b, text: { en: "Publish Sales.pbix to each of the five workspaces.", fr: "Publier Sales.pbix dans chacun des cinq espaces de travail." } }
    - { id: c, text: { en: "Export Sales.pbix as a .pbit file, and send it to the report authors.", fr: "Exporter Sales.pbix en fichier .pbit, et l'envoyer aux auteurs de rapports." } }
    - { id: d, text: { en: "Ask the report authors to add Margin % as a report measure in each report.", fr: "Demander aux auteurs de rapports d'ajouter Margin % comme mesure de rapport dans chaque rapport." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Overwriting the original shared file overwrites the shared semantic model. Reports built on the model aren't overwritten, but they reflect the changes to the model, so all 30 reports can use Margin % after one publish."
    fr: "Remplacer le fichier partagé d'origine remplace le modèle sémantique partagé. Les rapports qui reposent sur le modèle ne sont pas remplacés, mais ils reflètent les modifications du modèle : les 30 rapports peuvent donc utiliser Margin % après une seule publication."
  options:
    b:
      en: "This creates five new copies of the model; the 30 reports stay connected to SM-Sales in WS-Core."
      fr: "Cela crée cinq nouvelles copies du modèle ; les 30 rapports restent connectés à SM-Sales dans WS-Core."
    c:
      en: "A template starts new reports with their own imported model; it doesn't change the model that the existing reports use."
      fr: "Un modèle de rapport démarre de nouveaux rapports avec leur propre modèle importé ; il ne modifie pas le modèle qu'utilisent les rapports existants."
    d:
      en: "Thirty copies of a report measure maximize effort and leave the definition ungoverned, outside the shared model."
      fr: "Trente copies d'une mesure de rapport maximisent l'effort et laissent la définition non gouvernée, hors du modèle partagé."
references:
  - title: Connect to semantic models in the Power BI service from Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-report-lifecycle-datasets
