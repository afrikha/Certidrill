id: dp600-1c-xmla-metadata-deploy
objective: "1.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Orders** on a Fabric capacity whose XMLA Endpoint setting is set to **Read Write**. WS-Orders contains a semantic model named **SM-Orders** that was published from Power BI Desktop.

    The Orders table of SM-Orders has an incremental refresh policy that stores five years of history. The historical partitions took several hours to load.

    A developer adds three measures to the source model in Power BI Desktop. You need to deploy the measures to SM-Orders. The solution must keep the existing partitions and avoid a full refresh of the historical data.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Orders** sur une capacité Fabric dont le paramètre XMLA Endpoint est défini sur **Read Write**. WS-Orders contient un modèle sémantique nommé **SM-Orders** publié depuis Power BI Desktop.

    La table Orders de SM-Orders a une stratégie d'actualisation incrémentielle qui conserve cinq ans d'historique. Le chargement des partitions historiques a pris plusieurs heures.

    Un développeur ajoute trois mesures au modèle source dans Power BI Desktop. Vous devez déployer les mesures dans SM-Orders. La solution doit conserver les partitions existantes et éviter une actualisation complète des données historiques.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Publish the file from Power BI Desktop to WS-Orders, and select Replace.", fr: "Publier le fichier depuis Power BI Desktop dans WS-Orders et sélectionner Remplacer." } }
    - { id: b, text: { en: "Use ALM Toolkit to compare the models, and then deploy the new measures.", fr: "Utiliser ALM Toolkit pour comparer les modèles, puis déployer les nouvelles mesures." } }
    - { id: c, text: { en: "Publish from Power BI Desktop, and then refresh with applyRefreshPolicy false.", fr: "Publier depuis Power BI Desktop, puis actualiser avec applyRefreshPolicy à false." } }
    - { id: d, text: { en: "Use DAX Studio to define the three measures in a DAX query.", fr: "Utiliser DAX Studio pour définir les trois mesures dans une requête DAX." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A metadata-only deployment adds objects such as measures without refreshing data. ALM Toolkit compares the running Desktop model with the model in the service through the XMLA endpoint, and its options let you retain partitions so the incremental refresh history is kept."
    fr: "Un déploiement des métadonnées uniquement ajoute des objets comme des mesures sans actualiser les données. ALM Toolkit compare le modèle Desktop en cours d'exécution au modèle du service par le point de terminaison XMLA, et ses options permettent de conserver les partitions pour garder l'historique de l'actualisation incrémentielle."
  options:
    a:
      en: "Replacing a model that has an incremental refresh policy can lose the historical data and forces a long refresh."
      fr: "Remplacer un modèle doté d'une stratégie d'actualisation incrémentielle peut faire perdre les données historiques et impose une longue actualisation."
    c:
      en: "Republishing already replaces the partitions; applyRefreshPolicy false then fully refreshes every partition of the table, which the requirement forbids."
      fr: "La republication remplace déjà les partitions ; applyRefreshPolicy à false actualise ensuite entièrement toutes les partitions de la table, ce que l'exigence interdit."
    d:
      en: "DAX Studio is read-only through the XMLA endpoint; measures defined in a query exist only for that query."
      fr: "DAX Studio est en lecture seule par le point de terminaison XMLA ; des mesures définies dans une requête n'existent que pour cette requête."
references:
  - title: Advanced incremental refresh and real-time data with the XMLA endpoint
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-xmla
