id: dp600-cs1b-endorse-model
objective: "1.1.5"
type: single
caseStudy: dp600-cs1b-woodgrove-bank
difficulty: 1
status: draft
stem:
  en: |
    The governance board has reviewed FinanceModel. You need to meet the governance requirement. What should a member of the finance analytics team do?
  fr: |
    Le comité de gouvernance a examiné FinanceModel. Vous devez satisfaire l'exigence de gouvernance. Que doit faire un membre de l'équipe d'analytique financière ?
body:
  options:
    - { id: a, text: { en: "Set the endorsement of FinanceModel to Promoted", fr: "Définir l'approbation de FinanceModel sur Promu (Promoted)" } }
    - { id: b, text: { en: "Request the Certified endorsement for FinanceModel", fr: "Demander l'approbation Certifié (Certified) pour FinanceModel" } }
    - { id: c, text: { en: "Request the Master data endorsement for FinanceModel", fr: "Demander l'approbation Données de référence (Master data) pour FinanceModel" } }
    - { id: d, text: { en: "Apply a Highly Confidential sensitivity label to FinanceModel", fr: "Appliquer une étiquette de confidentialité Highly Confidential à FinanceModel" } }
answer: { optionId: b }
explanation:
  correct:
    en: The Certified badge shows that an authorized reviewer confirmed that the item meets the organization's quality standards. Only users specified by a Fabric administrator can certify an item, and nobody in the team is authorized, but any user can request certification.
    fr: Le badge Certifié (Certified) indique qu'un réviseur autorisé a confirmé que l'élément respecte les normes de qualité de l'organisation. Seuls les utilisateurs désignés par un administrateur Fabric peuvent certifier un élément, et personne dans l'équipe n'est autorisé, mais tout utilisateur peut demander une certification.
  options:
    a:
      en: Any user with write permission can promote an item, but Promoted only means that the creators think the item is ready to share; it does not show a review against quality standards.
      fr: Tout utilisateur disposant de l'autorisation d'écriture peut promouvoir un élément, mais Promu (Promoted) signifie seulement que les créateurs estiment l'élément prêt à être partagé ; ce badge n'indique pas d'examen par rapport à des normes de qualité.
    c:
      en: Master data marks an item as a core, authoritative source of reference data such as customer lists or product codes, not as reviewed against quality standards.
      fr: Données de référence (Master data) désigne un élément comme source principale et faisant autorité de données de référence, comme des listes de clients ou des codes produits, et non comme examiné par rapport à des normes de qualité.
    d:
      en: A sensitivity label classifies and protects the data; it is not an endorsement badge and says nothing about quality.
      fr: Une étiquette de confidentialité classe et protège les données ; ce n'est pas un badge d'approbation et elle n'indique rien sur la qualité.
references:
  - title: Endorsement overview
    url: https://learn.microsoft.com/en-us/fabric/governance/endorsement-overview
