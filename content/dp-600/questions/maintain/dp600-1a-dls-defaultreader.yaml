id: dp600-1a-dls-defaultreader
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has a Fabric workspace named **WS-Lake** that contains a lakehouse named **LH-Enterprise** with the default OneLake security roles. Last month, LH-Enterprise was shared with the security group **SG-Marketing** with Read all with Apache Spark.

    Today, you created a OneLake security role named **MarketingOnly** that grants Read on the tables of the `marketing` schema only, and you added SG-Marketing to it. The members of SG-Marketing can still read every table of LH-Enterprise from Spark.

    The members of SG-Marketing must read only the `marketing` tables. Other users must keep their current access. What should you do?
  fr: |
    Litware dispose d'un espace de travail Fabric nommé **WS-Lake** qui contient un lakehouse nommé **LH-Enterprise** avec les rôles de sécurité OneLake par défaut. Le mois dernier, LH-Enterprise a été partagé avec le groupe de sécurité **SG-Marketing** avec Read all with Apache Spark.

    Aujourd'hui, vous avez créé un rôle de sécurité OneLake nommé **MarketingOnly** qui accorde Read sur les seules tables du schéma `marketing`, et vous y avez ajouté SG-Marketing. Les membres de SG-Marketing peuvent toujours lire toutes les tables de LH-Enterprise depuis Spark.

    Les membres de SG-Marketing ne doivent lire que les tables `marketing`. Les autres utilisateurs doivent conserver leur accès actuel. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a second OneLake security role that denies Read on the other schemas, and add SG-Marketing to it", fr: "Créer un second rôle de sécurité OneLake qui refuse Read sur les autres schémas, et y ajouter SG-Marketing" } }
    - { id: b, text: { en: "Remove the Read all with Apache Spark permission of SG-Marketing on LH-Enterprise", fr: "Retirer l'autorisation Read all with Apache Spark de SG-Marketing sur LH-Enterprise" } }
    - { id: c, text: { en: "Switch the SQL analytics endpoint of LH-Enterprise to User's identity access mode", fr: "Faire passer le point de terminaison d'analytique SQL de LH-Enterprise en mode d'accès identité de l'utilisateur" } }
    - { id: d, text: { en: "Change the MarketingOnly role to grant ReadWrite instead of Read", fr: "Modifier le rôle MarketingOnly pour accorder ReadWrite au lieu de Read" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The DefaultReader role uses virtual membership that includes every user with ReadAll, so SG-Marketing keeps full read access through it, and roles combine as a union. Virtual members can't be removed one by one; removing ReadAll from SG-Marketing takes the group out of DefaultReader and leaves only MarketingOnly, without changing other users' access."
    fr: "Le rôle DefaultReader utilise une appartenance virtuelle qui inclut tout utilisateur disposant de ReadAll : SG-Marketing conserve un accès complet en lecture par ce rôle, et les rôles se combinent par union. Les membres virtuels ne peuvent pas être retirés un par un ; retirer ReadAll à SG-Marketing fait sortir le groupe de DefaultReader et ne laisse que MarketingOnly, sans modifier l'accès des autres utilisateurs."
  options:
    a: { en: "OneLake security is deny-by-default and supports only Grant roles; there is no deny role.", fr: "La sécurité OneLake refuse par défaut et ne prend en charge que des rôles Grant ; il n'existe pas de rôle de refus." }
    c: { en: "User's identity mode makes the SQL analytics endpoint enforce OneLake security; it doesn't change what Spark reads through DefaultReader.", fr: "Le mode identité de l'utilisateur fait appliquer la sécurité OneLake par le point de terminaison d'analytique SQL ; il ne change pas ce que Spark lit par DefaultReader." }
    d: { en: "ReadWrite adds write access to the marketing tables and doesn't remove the DefaultReader access.", fr: "ReadWrite ajoute l'écriture sur les tables marketing et ne retire pas l'accès par DefaultReader." }
references:
  - title: Create and manage OneLake security roles
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/create-manage-roles
  - title: Get started with OneLake security
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/get-started-onelake-security
