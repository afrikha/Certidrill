id: dp600-sr1-ledger-auditors-1
objective: "1.1.2"
type: series_yesno
series: dp600-sr1-ledger-auditors
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You add ExtAuditors to WS-Finance with the Viewer role.
  fr: Vous ajoutez ExtAuditors à WS-Finance avec le rôle Viewer.
body:
  solution:
    en: |
      You add the ExtAuditors group to **WS-Finance** and assign it the **Viewer** workspace role.
    fr: |
      Vous ajoutez le groupe ExtAuditors à **WS-Finance** et vous lui attribuez le rôle d'espace de travail **Viewer**.
answer: { value: false }
explanation:
  correct:
    en: |
      Viewer can read warehouse data with T-SQL through the SQL endpoint, but a workspace role applies to every item of the workspace. The auditors would also see and open LH-Staging, the notebooks and the reports, which breaks the first requirement. An item permission on WH-Ledger alone is needed.
    fr: |
      Viewer peut lire les données de l'entrepôt en T-SQL par le point de terminaison SQL, mais un rôle d'espace de travail s'applique à tous les éléments de l'espace de travail. Les auditeurs verraient et ouvriraient aussi LH-Staging, les notebooks et les rapports, ce qui enfreint la première exigence. Il faut une autorisation d'élément sur WH-Ledger uniquement.
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
