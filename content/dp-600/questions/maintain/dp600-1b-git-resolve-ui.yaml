id: dp600-1b-git-resolve-ui
objective: "1.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Sales that is connected to the main branch of a GitHub repository. You have the Admin role in Sales.

    You modify a semantic model named SM-Orders in Sales. A colleague merges a pull request into main that also modifies SM-Orders. In the Source control pane, you select Update, and then you select Resolve conflicts.

    You need to keep the version of SM-Orders that is in the workspace and later commit it to main.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Sales connecté à la branche main d'un référentiel GitHub. Vous avez le rôle Admin dans Sales.

    Vous modifiez un modèle sémantique nommé SM-Orders dans Sales. Un collègue fusionne dans main une demande de tirage qui modifie aussi SM-Orders. Dans le volet Contrôle de code source, vous sélectionnez Update, puis Resolve conflicts.

    Vous devez conserver la version de SM-Orders qui se trouve dans l'espace de travail et la valider ensuite dans main.

    Comment devez-vous compléter la phrase ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      For SM-Orders, select [[choice]]. After the update, the Git status of SM-Orders is [[status]].
    fr: |
      Pour SM-Orders, sélectionnez [[choice]]. Après la mise à jour, le statut Git de SM-Orders est [[status]].
  slots:
    - id: choice
      options:
        - { id: incoming, text: Accept incoming changes }
        - { id: keep, text: Keep current content }
        - { id: undo, text: Undo }
    - id: status
      options:
        - { id: synced, text: Synced }
        - { id: uncommitted, text: Uncommitted changes }
        - { id: update, text: Update required }
        - { id: conflict, text: Conflict }
answer:
  values: { choice: keep, status: uncommitted }
explanation:
  correct:
    en: In the Resolve conflicts dialog, Keep current content keeps the workspace version of the item. Because that version differs from the latest commit of the branch, the item then shows Uncommitted changes, and you commit it to main.
    fr: Dans la boîte de dialogue Resolve conflicts, Keep current content conserve la version de l'élément qui se trouve dans l'espace de travail. Comme cette version diffère de la dernière validation de la branche, l'élément affiche ensuite Uncommitted changes, et vous le validez dans main.
  options:
    incoming: { en: "Accept incoming changes overwrites the workspace item with the version from Git, so your changes are lost; the item would then be Synced.", fr: "Accept incoming changes écrase l'élément de l'espace de travail avec la version de Git : vos modifications sont perdues ; l'élément serait alors Synced." }
    undo: { en: "Undo returns the item to its last synced state and discards your workspace changes.", fr: "Undo ramène l'élément à son dernier état synchronisé et abandonne vos modifications dans l'espace de travail." }
    synced: { en: "Synced would mean the workspace matches the branch, which isn't the case after keeping your version.", fr: "Synced signifierait que l'espace de travail correspond à la branche, ce qui n'est pas le cas après avoir conservé votre version." }
references:
  - title: Resolve conflicts with Git integration
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/conflict-resolution
