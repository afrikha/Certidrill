id: dp600-1c-ra-shared-governance
objective: "1.2.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have the Member role in a Fabric workspace named **WS-Core** that contains a semantic model named **SM-Core**. The tenant settings for certification and discovery are enabled, and you are not a certification reviewer.

    You need to meet the requirements described in the answer area for SM-Core. The solution must follow the principle of least privilege.

    What should you configure for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous avez le rôle Member dans un espace de travail Fabric nommé **WS-Core** qui contient un modèle sémantique nommé **SM-Core**. Les paramètres de locataire de certification et de découverte sont activés, et vous n'êtes pas un réviseur de certification.

    Vous devez satisfaire les exigences décrites dans la zone de réponse pour SM-Core. La solution doit respecter le principe du moindre privilège.

    Que devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: build, text: { en: "Build permission on SM-Core", fr: "Autorisation Build sur SM-Core" } }
    - { id: reshare, text: { en: "Reshare permission on SM-Core", fr: "Autorisation Reshare sur SM-Core" } }
    - { id: contrib, text: { en: "Contributor role in WS-Core", fr: "Rôle Contributor dans WS-Core" } }
    - { id: promote, text: { en: "Promoted endorsement of SM-Core", fr: "Approbation Promoted de SM-Core" } }
    - { id: certreq, text: { en: "A certification request for SM-Core", fr: "Une demande de certification de SM-Core" } }
  targets:
    - { id: authors, text: { en: "Analysts in other workspaces must build their own reports on SM-Core without accessing the other content of WS-Core.", fr: "Les analystes d'autres espaces de travail doivent créer leurs propres rapports sur SM-Core sans accéder aux autres contenus de WS-Core." } }
    - { id: discover, text: { en: "Before the governance review, SM-Core must be marked as ready for reuse so that you can make it discoverable.", fr: "Avant la révision de gouvernance, SM-Core doit être marqué comme prêt à être réutilisé afin que vous puissiez le rendre détectable." } }
    - { id: authority, text: { en: "SM-Core must be labeled as an authoritative model reviewed by the data governance team.", fr: "SM-Core doit être signalé comme un modèle de référence révisé par l'équipe de gouvernance des données." } }
answer:
  mapping: { authors: build, discover: promote, authority: certreq }
explanation:
  correct:
    en: "Build permission on the model lets users create content on it without a workspace role. Any user with write permission can promote an item, and Make discoverable becomes available once the model is promoted or certified. Only reviewers specified by a Fabric administrator can certify; other users request certification so that a reviewer applies the Certified badge."
    fr: "L'autorisation Build sur le modèle permet de créer du contenu dessus sans rôle d'espace de travail. Tout utilisateur qui a l'autorisation d'écriture peut promouvoir un élément, et Make discoverable devient disponible dès que le modèle est promu ou certifié. Seuls les réviseurs désignés par un administrateur Fabric peuvent certifier ; les autres utilisateurs demandent la certification pour qu'un réviseur appose le badge Certified."
  options:
    contrib:
      en: "Contributor grants Build but also write access to all the content of WS-Core, which breaks least privilege."
      fr: "Contributor accorde Build, mais aussi l'accès en écriture à tout le contenu de WS-Core, ce qui ne respecte pas le moindre privilège."
    reshare:
      en: "Reshare lets users share the model with others; it doesn't let them build reports on it."
      fr: "Reshare permet de partager le modèle avec d'autres utilisateurs ; il ne permet pas de créer des rapports dessus."
references:
  - title: Build permission for shared semantic models
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/service-datasets-build-permissions
  - title: Endorsement overview
    url: https://learn.microsoft.com/en-us/fabric/governance/endorsement-overview
