id: dp600-cs2b-dean-rls
objective: "1.1.3"
type: yesno_statements
caseStudy: dp600-cs2b-bellows-college
difficulty: 2
status: draft
stem:
  en: |
    You are planning the security of SM-Enrollment to meet the requirement for the deans and the registrar's office.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez la sécurité de SM-Enrollment pour respecter l'exigence relative aux doyens et au service de la scolarité.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A role in SM-Enrollment with the filter `[DeanUPN] = USERPRINCIPALNAME()` on the Faculty table, with the Deans group as its member, meets the requirement."
        fr: "Un rôle de SM-Enrollment avec le filtre `[DeanUPN] = USERPRINCIPALNAME()` sur la table Faculty, dont le groupe Deans est membre, respecte l'exigence."
    - id: s2
      text:
        en: If a dean is also given the Member role on Academic-Prod, the role filter still restricts the data that this dean sees.
        fr: Si un doyen reçoit aussi le rôle Member sur Academic-Prod, le filtre du rôle restreint toujours les données que voit ce doyen.
    - id: s3
      text:
        en: A row-level security policy created in WH-Academic restricts the enrollments that each dean sees in Enrollment Report.
        fr: Une stratégie de sécurité au niveau des lignes créée dans WH-Academic restreint les inscriptions que chaque doyen voit dans Enrollment Report.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Dynamic row-level security compares DeanUPN with the user principal name of the signed-in user, and the filter on Faculty propagates to Course and then to Enrollment. Model roles restrict only users who have the Viewer role or who access the content through the app; Admin, Member and Contributor users see all the data, which suits the registrar's office but not a dean who becomes a Member. SM-Enrollment imports the data with the credentials of its connection, so a security policy in WH-Academic does not filter the data per report user."
    fr: "La sécurité au niveau des lignes dynamique compare DeanUPN au nom d'utilisateur principal de l'utilisateur connecté, et le filtre sur Faculty se propage à Course puis à Enrollment. Les rôles du modèle ne restreignent que les utilisateurs qui ont le rôle Viewer ou qui accèdent au contenu par l'application ; les utilisateurs Admin, Member et Contributor voient toutes les données, ce qui convient au service de la scolarité mais pas à un doyen qui devient Member. SM-Enrollment importe les données avec les informations d'identification de sa connexion : une stratégie de sécurité de WH-Academic ne filtre donc pas les données par utilisateur du rapport."
references:
  - title: Row-level security (RLS) with Power BI
    url: https://learn.microsoft.com/en-us/fabric/security/service-admin-row-level-security
