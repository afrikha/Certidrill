id: dp600-cs3a-workspace-roles
objective: "1.1.1"
type: dragdrop
caseStudy: dp600-cs3a-consolidated-messenger
difficulty: 1
status: draft
stem:
  en: |
    You need to assign workspace roles in CM-Operations to meet requirement 5.

    Which role should you assign to each user or group? To answer, drag the appropriate roles to the correct targets. Each role may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez attribuer des rôles d'espace de travail dans CM-Operations pour satisfaire l'exigence 5.

    Quel rôle devez-vous attribuer à chaque utilisateur ou groupe ? Pour répondre, faites glisser les rôles appropriés vers les cibles correctes. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: admin, text: Admin }
    - { id: member, text: Member }
    - { id: contributor, text: Contributor }
    - { id: viewer, text: Viewer }
  targets:
    - { id: lucia, text: { en: "Lucia", fr: "Lucia" } }
    - { id: engineers, text: { en: "Data engineers", fr: "Ingénieurs données" } }
    - { id: managers, text: { en: "Depot managers", fr: "Responsables de dépôt" } }
    - { id: pablo, text: { en: "Pablo", fr: "Pablo" } }
answer:
  mapping: { lucia: member, engineers: contributor, managers: viewer, pablo: admin }
explanation:
  correct:
    en: |
      Member is the least privileged role that can add people with lower permissions, and only Admin can delete the workspace or connect it to a Git repository. Contributor can create and edit notebooks and write lakehouse data without managing access. Viewer can view the reports and read lakehouse data with T-SQL through the SQL analytics endpoint (ReadData), but not through Spark or the OneLake APIs.
    fr: |
      Member est le rôle le moins privilégié qui peut ajouter des personnes ayant des autorisations inférieures, et seul Admin peut supprimer l'espace de travail ou le connecter à un dépôt Git. Contributor peut créer et modifier des notebooks et écrire des données dans le lakehouse sans gérer les accès. Viewer peut consulter les rapports et lire les données du lakehouse en T-SQL via le point de terminaison d'analytique SQL (ReadData), mais pas via Spark ni les API OneLake.
  options:
    admin: { en: "Admin is required only for Pablo: for Lucia it would also allow deleting the workspace.", fr: "Admin n'est nécessaire que pour Pablo : pour Lucia, il permettrait aussi de supprimer l'espace de travail." }
    contributor: { en: "Contributor cannot add people to the workspace, and it gives the depot managers more than read access.", fr: "Contributor ne peut pas ajouter de personnes à l'espace de travail, et il donnerait aux responsables de dépôt plus qu'un accès en lecture." }
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
