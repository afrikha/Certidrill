id: dp600-1c-ra-template-file
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The central BI team of Adatum built a Power BI Desktop file named **Sales.pbix**. It contains six report pages, a model with relationships and measures, and Power Query queries that read a regional SQL Server database.

    Regional analysts must create new reports that start with the same pages, model and queries. Each analyst connects to the data with their own credentials. The file that you distribute must contain no data.

    What should you create from Sales.pbix?
  fr: |
    L'équipe BI centrale d'Adatum a créé un fichier Power BI Desktop nommé **Sales.pbix**. Il contient six pages de rapport, un modèle avec des relations et des mesures, et des requêtes Power Query qui lisent une base de données SQL Server régionale.

    Les analystes régionaux doivent créer de nouveaux rapports qui commencent avec les mêmes pages, le même modèle et les mêmes requêtes. Chaque analyste se connecte aux données avec ses propres informations d'identification. Le fichier que vous distribuez ne doit contenir aucune donnée.

    Que devez-vous créer à partir de Sales.pbix ?
body:
  options:
    - { id: a, text: { en: "A Power BI data source (.pbids) file", fr: "Un fichier de source de données Power BI (.pbids)" } }
    - { id: b, text: { en: "A Power BI project (.pbip) folder", fr: "Un dossier de projet Power BI (.pbip)" } }
    - { id: c, text: { en: "A Power BI template (.pbit) file", fr: "Un fichier de modèle Power BI (.pbit)" } }
    - { id: d, text: { en: "A copy of Sales.pbix saved with another name", fr: "Une copie de Sales.pbix enregistrée sous un autre nom" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A template contains the report pages and visuals, the model definition with its relationships and measures, and all the query definitions and parameters, but no data. When an analyst opens it, Power BI Desktop asks for the parameters and the data location, and the analyst connects with their own credentials."
    fr: "Un modèle de rapport contient les pages et les visuels, la définition du modèle avec ses relations et ses mesures, ainsi que toutes les définitions de requêtes et les paramètres, mais aucune donnée. Quand un analyste l'ouvre, Power BI Desktop demande les paramètres et l'emplacement des données, et l'analyste se connecte avec ses propres informations d'identification."
  options:
    a:
      en: "A .pbids file holds a single data source connection; it carries no report pages, model or queries."
      fr: "Un fichier .pbids contient une seule connexion de source de données ; il ne contient ni pages de rapport, ni modèle, ni requêtes."
    b:
      en: "A project stores the report and model as text files for source control, and its local folder keeps a data cache; it isn't the file type meant for starting new reports."
      fr: "Un projet stocke le rapport et le modèle sous forme de fichiers texte pour le contrôle de code source, et son dossier local conserve un cache de données ; ce n'est pas le type de fichier prévu pour démarrer de nouveaux rapports."
    d:
      en: "A .pbix file contains the imported data, which the requirement forbids."
      fr: "Un fichier .pbix contient les données importées, ce que l'exigence interdit."
references:
  - title: Create and use report templates in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-templates
