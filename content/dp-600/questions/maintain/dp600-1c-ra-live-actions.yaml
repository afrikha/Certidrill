id: dp600-1c-ra-live-actions
objective: "1.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a shared semantic model named **SM-Finance** in a Fabric workspace. An analyst who has the Build permission on SM-Finance creates a report in Power BI Desktop that connects live to SM-Finance.

    The analyst must keep the live connection and must not convert the report to a composite model.

    Which two actions can the analyst perform in the report?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique partagé nommé **SM-Finance** dans un espace de travail Fabric. Un analyste qui a l'autorisation Build sur SM-Finance crée dans Power BI Desktop un rapport connecté en direct à SM-Finance.

    L'analyste doit conserver la connexion active et ne doit pas convertir le rapport en modèle composite.

    Quelles sont les deux actions que l'analyste peut effectuer dans le rapport ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a relationship between two tables of SM-Finance.", fr: "Créer une relation entre deux tables de SM-Finance." } }
    - { id: b, text: { en: "Create a report measure that uses columns of SM-Finance.", fr: "Créer une mesure de rapport qui utilise des colonnes de SM-Finance." } }
    - { id: c, text: { en: "Import a CSV file as a new table.", fr: "Importer un fichier CSV comme nouvelle table." } }
    - { id: d, text: { en: "Add a visual calculation to a visual.", fr: "Ajouter un calcul visuel à un visuel." } }
    - { id: e, text: { en: "Change the data type of a column of SM-Finance.", fr: "Modifier le type de données d'une colonne de SM-Finance." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "In a live connection to a Power BI semantic model, the analyst can't modify the data model, but can create report-level calculations such as report measures and visual calculations. These calculations are stored in the report and don't change SM-Finance."
    fr: "Dans une connexion active à un modèle sémantique Power BI, l'analyste ne peut pas modifier le modèle de données, mais peut créer des calculs au niveau du rapport, comme des mesures de rapport et des calculs visuels. Ces calculs sont stockés dans le rapport et ne modifient pas SM-Finance."
  options:
    a:
      en: "Relationships between tables of the shared model are part of the data model, which a live connection can't modify."
      fr: "Les relations entre tables du modèle partagé font partie du modèle de données, qu'une connexion active ne peut pas modifier."
    c:
      en: "Adding a table from another source requires a local model, that is, converting the report to a composite model."
      fr: "Ajouter une table d'une autre source exige un modèle local, c'est-à-dire de convertir le rapport en modèle composite."
    e:
      en: "Column data types are defined in the shared model and can't be changed from a live-connected report."
      fr: "Les types de données des colonnes sont définis dans le modèle partagé et ne peuvent pas être modifiés depuis un rapport en connexion active."
references:
  - title: Connect to semantic models in the Power BI service from Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-report-lifecycle-datasets
