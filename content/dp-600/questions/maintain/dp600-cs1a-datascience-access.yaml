id: dp600-cs1a-datascience-access
objective: "1.1.2"
type: single
caseStudy: dp600-cs1a-wingtip-toys
difficulty: 2
status: draft
stem:
  en: |
    LH_Retail has been deployed to WT-Prod. You need to grant SG-DataScience access to LH_Retail in WT-Prod. The solution must meet the security requirements. What should you do?
  fr: |
    LH_Retail a été déployé dans WT-Prod. Vous devez accorder à SG-DataScience l'accès à LH_Retail dans WT-Prod. La solution doit respecter les exigences de sécurité. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add SG-DataScience to WT-Prod with the Viewer role", fr: "Ajouter SG-DataScience à WT-Prod avec le rôle Viewer" } }
    - { id: b, text: { en: "Share LH_Retail with SG-DataScience and grant Read all with Apache Spark", fr: "Partager LH_Retail avec SG-DataScience et accorder Read all with Apache Spark" } }
    - { id: c, text: { en: "Share LH_Retail with SG-DataScience and grant Read all with SQL analytics endpoint", fr: "Partager LH_Retail avec SG-DataScience et accorder Read all with SQL analytics endpoint" } }
    - { id: d, text: { en: "Add SG-DataScience to WT-Prod with the Contributor role", fr: "Ajouter SG-DataScience à WT-Prod avec le rôle Contributor" } }
answer: { optionId: b }
explanation:
  correct:
    en: Sharing the lakehouse grants item permissions on LH_Retail only, so the group gets no access to the other items of WT-Prod. The Read all with Apache Spark permission lets the users read the lakehouse tables and files through Spark and the OneLake APIs, which is what notebooks in another workspace use.
    fr: Le partage du lakehouse accorde des autorisations sur l'élément LH_Retail uniquement ; le groupe n'obtient donc aucun accès aux autres éléments de WT-Prod. L'autorisation Read all with Apache Spark permet de lire les tables et les fichiers du lakehouse via Spark et les API OneLake, ce qu'utilisent les notebooks d'un autre espace de travail.
  options:
    a:
      en: A workspace role applies to every item of WT-Prod, and the Viewer role does not include reading lakehouse data through Spark or the OneLake APIs.
      fr: Un rôle d'espace de travail s'applique à tous les éléments de WT-Prod, et le rôle Viewer ne permet pas de lire les données du lakehouse via Spark ou les API OneLake.
    c:
      en: This permission allows T-SQL reads through the SQL analytics endpoint only. It does not give access to the files or to the Delta tables through Spark.
      fr: Cette autorisation permet uniquement les lectures T-SQL via le point de terminaison d'analytique SQL. Elle ne donne pas accès aux fichiers ni aux tables Delta via Spark.
    d:
      en: Contributor can read the data with Spark, but it applies to every item of WT-Prod and allows changes, which breaks least privilege.
      fr: Contributor peut lire les données avec Spark, mais ce rôle s'applique à tous les éléments de WT-Prod et permet des modifications, ce qui enfreint le principe des privilèges minimum.
references:
  - title: Lakehouse sharing and permission management
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sharing
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
