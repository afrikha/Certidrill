id: dp600-cs3b-label-inheritance
objective: "1.1.4"
type: yesno_statements
caseStudy: dp600-cs3b-munsons
difficulty: 3
status: draft
stem:
  en: |
    Mia applies the Confidential label to SM-Sales as described in requirement 6.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  fr: |
    Mia applique l'étiquette Confidential à SM-Sales comme le décrit l'exigence 6.

    Pour chacune des affirmations suivantes, sélectionnez Oui si l'affirmation est vraie. Sinon, sélectionnez Non.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "RPT-Margins receives the Confidential label.", fr: "RPT-Margins reçoit l'étiquette Confidential." } }
    - { id: s2, text: { en: "RPT-Volumes receives the Confidential label.", fr: "RPT-Volumes reçoit l'étiquette Confidential." } }
    - { id: s3, text: { en: "A report that an analyst creates from SM-Sales the next day receives the Confidential label.", fr: "Un rapport qu'un analyste crée à partir de SM-Sales le lendemain reçoit l'étiquette Confidential." } }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Downstream inheritance never overwrites a manually applied label, so RPT-Margins keeps General. RPT-Volumes has no label and Mia has edit permissions in MPP-Prod (Member) with the check box selected, so it inherits Confidential; there are fewer than 80 downstream items. A new report built from a labeled semantic model inherits its label upon creation, independently of downstream inheritance.
    fr: |
      L'héritage en aval ne remplace jamais une étiquette appliquée manuellement : RPT-Margins conserve General. RPT-Volumes n'a pas d'étiquette et Mia dispose d'autorisations de modification dans MPP-Prod (Member) avec la case cochée : il hérite donc de Confidential ; il y a moins de 80 éléments en aval. Un nouveau rapport créé à partir d'un modèle sémantique étiqueté hérite de son étiquette à la création, indépendamment de l'héritage en aval.
references:
  - title: Sensitivity label downstream inheritance in Power BI
    url: https://learn.microsoft.com/en-us/fabric/governance/service-security-sensitivity-label-downstream-inheritance
