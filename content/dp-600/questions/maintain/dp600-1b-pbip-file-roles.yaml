id: dp600-1b-pbip-file-roles
objective: "1.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a Power BI project named Retail that is stored in a Git repository connected to a Fabric workspace.

    You need to identify the file that holds each type of information.

    Which file should you identify for each type of information? To answer, drag the appropriate files to the correct types of information. Each file may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un projet Power BI nommé Retail stocké dans un référentiel Git connecté à un espace de travail Fabric.

    Vous devez identifier le fichier qui contient chaque type d'information.

    Quel fichier devez-vous identifier pour chaque type d'information ? Pour répondre, faites glisser les fichiers appropriés vers les types d'information correspondants. Chaque fichier peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: pbir, text: definition.pbir }
    - { id: pbism, text: definition.pbism }
    - { id: platform, text: .platform }
    - { id: cache, text: .pbi\cache.abf }
    - { id: local, text: .pbi\localSettings.json }
  targets:
    - id: ref
      text: { en: "The reference from the report to its semantic model", fr: "La référence du rapport vers son modèle sémantique" }
    - id: logical
      text: { en: "The logical ID that links an item of the workspace to its folder in Git", fr: "L'ID logique qui relie un élément de l'espace de travail à son dossier dans Git" }
    - id: data
      text: { en: "A local copy of the model and its data from the last edit", fr: "Une copie locale du modèle et de ses données issue de la dernière modification" }
answer:
  mapping: { ref: pbir, logical: platform, data: cache }
explanation:
  correct:
    en: definition.pbir contains the datasetReference property that points to the semantic model. The .platform file holds the logicalId and other properties that connect the item to Git. cache.abf is an Analysis Services backup with the model and data from the last edit.
    fr: definition.pbir contient la propriété datasetReference qui pointe vers le modèle sémantique. Le fichier .platform contient le logicalId et d'autres propriétés qui relient l'élément à Git. cache.abf est une sauvegarde Analysis Services avec le modèle et les données de la dernière modification.
  options:
    pbism: { en: "definition.pbism holds the overall definition and core settings of the semantic model.", fr: "definition.pbism contient la définition globale et les paramètres principaux du modèle sémantique." }
    local: { en: "localSettings.json holds settings for the current user and computer only.", fr: "localSettings.json contient des paramètres propres à l'utilisateur et à l'ordinateur actuels." }
references:
  - title: Git integration source code format
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/source-code-format
  - title: Power BI Desktop project semantic model folder
    url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-dataset
