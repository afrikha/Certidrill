id: dp600-cs3b-pbip-repo
objective: "1.2.2"
type: yesno_statements
caseStudy: dp600-cs3b-munsons
difficulty: 1
status: draft
stem:
  en: |
    You are preparing SM-Sales and RPT-Margins to meet requirement 5.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez SM-Sales et RPT-Margins pour satisfaire l'exigence 5.

    Pour chacune des affirmations suivantes, sélectionnez Oui si l'affirmation est vraie. Sinon, sélectionnez Non.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "In Power BI Desktop, you should save the file as a Power BI Project (*.pbip) in a clone of mpp-bi.", fr: "Dans Power BI Desktop, vous devez enregistrer le fichier en tant que projet Power BI (*.pbip) dans un clone de mpp-bi." } }
    - { id: s2, text: { en: "You must commit the cache.abf file of the project so that SM-Sales opens with its data after a clone.", fr: "Vous devez valider le fichier cache.abf du projet pour que SM-Sales s'ouvre avec ses données après un clonage." } }
    - { id: s3, text: { en: "The definition of SM-Sales is stored as TMDL files in the definition folder of the SM-Sales.SemanticModel folder.", fr: "La définition de SM-Sales est stockée sous forme de fichiers TMDL dans le dossier definition du dossier SM-Sales.SemanticModel." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Saving as a Power BI Project splits the work into a .SemanticModel folder, whose definition folder holds the model as TMDL text files, and a .Report folder, which suits pull request reviews. Power BI Desktop creates a .gitignore that excludes .pbi/cache.abf, the local data cache, and localSettings.json, so no data is committed.
    fr: |
      L'enregistrement en tant que projet Power BI répartit le travail entre un dossier .SemanticModel, dont le dossier definition contient le modèle sous forme de fichiers texte TMDL, et un dossier .Report, ce qui convient aux revues de pull requests. Power BI Desktop crée un fichier .gitignore qui exclut .pbi/cache.abf, le cache local des données, et localSettings.json : aucune donnée n'est validée.
references:
  - title: Power BI Desktop projects (PBIP)
    url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-overview
