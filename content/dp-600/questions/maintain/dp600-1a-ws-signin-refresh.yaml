id: dp600-1a-ws-signin-refresh
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a Fabric workspace named **WS-Ops**. A user named Carla was signed in to Fabric when you changed her role in WS-Ops from Viewer to Contributor.

    A few minutes later, Carla reports that she still cannot create a notebook in WS-Ops.

    What should Carla do first?
  fr: |
    Adatum dispose d'un espace de travail Fabric nommé **WS-Ops**. Une utilisatrice nommée Carla était connectée à Fabric quand vous avez remplacé son rôle dans WS-Ops, Viewer, par Contributor.

    Quelques minutes plus tard, Carla signale qu'elle ne peut toujours pas créer de notebook dans WS-Ops.

    Que doit faire Carla en premier ?
body:
  options:
    - { id: a, text: { en: "Request the Build permission on the workspace items", fr: "Demander l'autorisation Build sur les éléments de l'espace de travail" } }
    - { id: b, text: { en: "Wait 24 hours for the role assignment to replicate", fr: "Attendre 24 heures que l'attribution de rôle soit répliquée" } }
    - { id: c, text: { en: "Sign out of Fabric and sign in again", fr: "Se déconnecter de Fabric et se reconnecter" } }
    - { id: d, text: { en: "Ask a workspace Admin to grant her the Execute permission", fr: "Demander à un Admin de l'espace de travail de lui accorder l'autorisation Execute" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A change to a user's workspace access takes effect the next time the user signs in to Fabric. Signing out and back in applies the Contributor role, which allows creating notebooks."
    fr: "La modification de l'accès d'un utilisateur à un espace de travail prend effet à sa prochaine connexion à Fabric. Se déconnecter et se reconnecter applique le rôle Contributor, qui permet de créer des notebooks."
  options:
    a: { en: "Build is a semantic model permission for creating content from the model, not for creating notebooks.", fr: "Build est une autorisation de modèle sémantique pour créer du contenu à partir du modèle, pas pour créer des notebooks." }
    b: { en: "There is no 24-hour replication delay; the new role applies at the next sign-in.", fr: "Il n'y a pas de délai de réplication de 24 heures ; le nouveau rôle s'applique à la prochaine connexion." }
    d: { en: "Execute lets a user run or cancel an existing item; it does not allow creating items, and Contributor already includes it.", fr: "Execute permet d'exécuter ou d'annuler un élément existant ; elle ne permet pas de créer des éléments, et Contributor l'inclut déjà." }
references:
  - title: Give users access to workspaces
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/give-access-workspaces
