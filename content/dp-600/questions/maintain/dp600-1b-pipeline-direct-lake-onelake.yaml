id: dp600-1b-pipeline-direct-lake-onelake
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a deployment pipeline that has Development, Test and Production stages. The Development workspace contains a lakehouse named LH-Sales and a Direct Lake on OneLake semantic model named SM-Sales that reads the tables of LH-Sales. The Test and Production workspaces each contain their own copy of LH-Sales.

    After each deployment, SM-Sales in Test and Production must read the lakehouse of its own stage. The solution must minimize manual effort at each release.

    What should you do?
  fr: |
    Vous disposez d'un pipeline de déploiement qui comporte les étapes Development, Test et Production. L'espace de travail de Development contient un lakehouse nommé LH-Sales et un modèle sémantique Direct Lake sur OneLake nommé SM-Sales qui lit les tables de LH-Sales. Les espaces de travail de Test et de Production contiennent chacun leur propre copie de LH-Sales.

    Après chaque déploiement, SM-Sales doit lire en Test et en Production le lakehouse de sa propre étape. La solution doit réduire au minimum l'effort manuel à chaque mise en production.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Rely on autobinding to bind SM-Sales to the lakehouse of each stage.", fr: "Compter sur la liaison automatique pour lier SM-Sales au lakehouse de chaque étape." } }
    - { id: b, text: { en: "Define the lakehouse connection of SM-Sales with M parameters, and create parameter rules in Test and Production.", fr: "Définir la connexion au lakehouse de SM-Sales par des paramètres M, et créer des règles de paramètre en Test et en Production." } }
    - { id: c, text: { en: "Create default lakehouse rules for SM-Sales in Test and Production.", fr: "Créer des règles de lakehouse par défaut pour SM-Sales en Test et en Production." } }
    - { id: d, text: { en: "After each deployment, edit the connection of SM-Sales in the Test and Production workspaces.", fr: "Après chaque déploiement, modifier la connexion de SM-Sales dans les espaces de travail de Test et de Production." } }
answer: { optionId: b }
explanation:
  correct:
    en: Direct Lake semantic models aren't autobound to the items of the target stage; they keep pointing to the source-stage item. For Direct Lake on OneLake models, define the connection with M parameters and use parameter rules in the target stages, which apply at every deployment.
    fr: Les modèles sémantiques Direct Lake ne sont pas liés automatiquement aux éléments de l'étape cible ; ils continuent de pointer vers l'élément de l'étape source. Pour les modèles Direct Lake sur OneLake, définissez la connexion par des paramètres M et utilisez des règles de paramètre dans les étapes cibles, appliquées à chaque déploiement.
  options:
    a: { en: "Autobinding doesn't apply to Direct Lake semantic models; SM-Sales would keep reading the Development lakehouse.", fr: "La liaison automatique ne s'applique pas aux modèles sémantiques Direct Lake ; SM-Sales continuerait de lire le lakehouse de Development." }
    c: { en: "Default lakehouse rules exist only for notebooks.", fr: "Les règles de lakehouse par défaut n'existent que pour les notebooks." }
    d: { en: "Manual edits after each deployment don't minimize effort, and the next deployment overwrites them.", fr: "Des modifications manuelles après chaque déploiement ne réduisent pas l'effort, et le déploiement suivant les écrase." }
references:
  - title: Assign a workspace to a deployment pipeline
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/assign-pipeline
  - title: The Microsoft Fabric deployment pipelines process
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/understand-the-deployment-process
