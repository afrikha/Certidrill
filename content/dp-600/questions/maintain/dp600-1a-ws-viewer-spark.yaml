id: dp600-1a-ws-viewer-spark
objective: "1.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Fabric workspace named **WS-Plant** that contains a lakehouse named **LH-Sensors**. The security group **SG-Analysts** has the Viewer role in WS-Plant.

    The analysts also run notebooks in a workspace named **WS-Lab**, where they are Contributors. They report that some ways of reading LH-Sensors work and others fail.

    You need to identify the failing access path and fix it. The analysts must not be able to modify any item in WS-Plant, and the solution must minimize the permissions granted.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un espace de travail Fabric nommé **WS-Plant** qui contient un lakehouse nommé **LH-Sensors**. Le groupe de sécurité **SG-Analysts** a le rôle Viewer dans WS-Plant.

    Les analystes exécutent aussi des notebooks dans un espace de travail nommé **WS-Lab**, dont ils sont Contributors. Ils signalent que certaines façons de lire LH-Sensors fonctionnent et que d'autres échouent.

    Vous devez identifier le chemin d'accès qui échoue et le corriger. Les analystes ne doivent pouvoir modifier aucun élément de WS-Plant, et la solution doit réduire au minimum les autorisations accordées.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The analysts get an error when they [[path]].

      To fix it, share LH-Sensors with SG-Analysts and select [[perm]].
    fr: |
      Les analystes obtiennent une erreur quand ils [[path]].

      Pour corriger le problème, partagez LH-Sensors avec SG-Analysts en sélectionnant [[perm]].
  slots:
    - id: path
      options:
        - { id: spark, text: { en: "load LH-Sensors tables into a DataFrame from a notebook in WS-Lab", fr: "chargent des tables de LH-Sensors dans un DataFrame depuis un notebook de WS-Lab" } }
        - { id: sql, text: { en: "query LH-Sensors tables through its SQL analytics endpoint", fr: "interrogent les tables de LH-Sensors par son point de terminaison d'analytique SQL" } }
        - { id: open, text: { en: "open the item list of WS-Plant", fr: "ouvrent la liste des éléments de WS-Plant" } }
    - id: perm
      options:
        - { id: readall, text: Read all with Apache Spark }
        - { id: readdata, text: Read all with SQL analytics endpoint }
        - { id: build, text: Build }
        - { id: share, text: Share }
answer:
  values: { path: spark, perm: readall }
explanation:
  correct:
    en: "Viewer includes ReadData, so the analysts can query the tables through the SQL analytics endpoint and can see the workspace items. Viewer doesn't include ReadAll, which Spark and the OneLake APIs need. Sharing LH-Sensors with Read all with Apache Spark adds ReadAll on that lakehouse only, without any write permission."
    fr: "Viewer inclut ReadData ; les analystes peuvent donc interroger les tables par le point de terminaison d'analytique SQL et voir les éléments de l'espace de travail. Viewer n'inclut pas ReadAll, dont Spark et les API OneLake ont besoin. Partager LH-Sensors avec Read all with Apache Spark ajoute ReadAll sur ce seul lakehouse, sans aucune autorisation d'écriture."
  options:
    readdata: { en: "The analysts already have ReadData through the Viewer role; it covers T-SQL, not Spark.", fr: "Les analystes ont déjà ReadData par le rôle Viewer ; elle couvre T-SQL, pas Spark." }
    build: { en: "Build applies to semantic models, not to reading lakehouse files.", fr: "Build s'applique aux modèles sémantiques, pas à la lecture des fichiers d'un lakehouse." }
    share: { en: "Share lets the recipients reshare the item; it gives no data access.", fr: "Share permet aux destinataires de repartager l'élément ; elle ne donne aucun accès aux données." }
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
  - title: How lakehouse sharing works
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sharing
