id: dp600-1a-item-build-permission
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Fabric workspace named **WS-Central** that contains a semantic model named **FinanceModel** and a report named **PnL**. A financial analyst named Ivo opens PnL through a link that was shared with him. Ivo has no role in WS-Central, and he is a Contributor in a workspace named **WS-Team**.

    Ivo must create his own reports on FinanceModel in Power BI Desktop, publish them to WS-Team, and use Analyze in Excel on FinanceModel. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Litware dispose d'un espace de travail Fabric nommé **WS-Central** qui contient un modèle sémantique nommé **FinanceModel** et un rapport nommé **PnL**. Un analyste financier nommé Ivo ouvre PnL par un lien qui a été partagé avec lui. Ivo n'a aucun rôle dans WS-Central, et il est Contributor dans un espace de travail nommé **WS-Team**.

    Ivo doit créer ses propres rapports sur FinanceModel dans Power BI Desktop, les publier dans WS-Team et utiliser Analyser dans Excel sur FinanceModel. La solution doit respecter le principe du privilège minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant Ivo the Write permission on FinanceModel", fr: "Accorder à Ivo l'autorisation Write sur FinanceModel" } }
    - { id: b, text: { en: "Assign Ivo the Contributor role in WS-Central", fr: "Attribuer à Ivo le rôle Contributor dans WS-Central" } }
    - { id: c, text: { en: "Grant Ivo the Build permission on FinanceModel", fr: "Accorder à Ivo l'autorisation Build sur FinanceModel" } }
    - { id: d, text: { en: "Grant Ivo the Reshare permission on PnL", fr: "Accorder à Ivo l'autorisation Reshare sur PnL" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Build lets a user create new content from a semantic model, including reports in other workspaces, and pull data into Analyze in Excel. Ivo already has Read through the shared report, so adding Build on FinanceModel is enough."
    fr: "Build permet à un utilisateur de créer du contenu à partir d'un modèle sémantique, y compris des rapports dans d'autres espaces de travail, et d'utiliser Analyser dans Excel. Ivo dispose déjà de Read par le rapport partagé : ajouter Build sur FinanceModel suffit."
  options:
    a: { en: "Write lets a user republish and change the model, which is more than building reports requires.", fr: "Write permet de republier et de modifier le modèle, ce qui dépasse ce que demande la création de rapports." }
    b: { en: "Contributor on WS-Central gives write access to every item of the workspace.", fr: "Contributor sur WS-Central donne un accès en écriture à tous les éléments de l'espace de travail." }
    d: { en: "Reshare lets Ivo share PnL with others; it doesn't let him build content on the model.", fr: "Reshare permet à Ivo de partager PnL avec d'autres ; il ne lui permet pas de créer du contenu sur le modèle." }
references:
  - title: Semantic model permissions
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/service-datasets-permissions
