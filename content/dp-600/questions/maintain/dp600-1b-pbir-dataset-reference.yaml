id: dp600-1b-pbir-dataset-reference
objective: "1.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    A Git repository contains two report folders that belong to Power BI projects:

    - Sales.Report must open in Power BI Desktop together with the Sales.SemanticModel folder of the same repository, in full edit mode.
    - Exec.Report is a thin report that is deployed by using the Fabric REST APIs to a workspace that already contains a published semantic model.

    You need to complete the datasetReference property of the definition.pbir file of each report.

    How should you complete the files? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un référentiel Git contient deux dossiers de rapport qui appartiennent à des projets Power BI :

    - Sales.Report doit s'ouvrir dans Power BI Desktop avec le dossier Sales.SemanticModel du même référentiel, en mode d'édition complet.
    - Exec.Report est un rapport léger déployé avec les API REST Fabric dans un espace de travail qui contient déjà un modèle sémantique publié.

    Vous devez compléter la propriété datasetReference du fichier definition.pbir de chaque rapport.

    Comment devez-vous compléter les fichiers ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template:
    en: |
      // Sales.Report/definition.pbir
      {
        "version": "4.0",
        "datasetReference": [[sales]]
      }

      // Exec.Report/definition.pbir
      {
        "version": "4.0",
        "datasetReference": [[exec]]
      }
    fr: |
      // Sales.Report/definition.pbir
      {
        "version": "4.0",
        "datasetReference": [[sales]]
      }

      // Exec.Report/definition.pbir
      {
        "version": "4.0",
        "datasetReference": [[exec]]
      }
  slots:
    - id: sales
      options:
        - { id: rel, text: "{ \"byPath\": { \"path\": \"../Sales.SemanticModel\" } }" }
        - { id: abs, text: "{ \"byPath\": { \"path\": \"C:/Repos/Contoso/Sales.SemanticModel\" } }" }
        - { id: conn, text: "{ \"byConnection\": { \"connectionString\": \"semanticmodelid=[SemanticModelId]\" } }" }
    - id: exec
      options:
        - { id: rel, text: "{ \"byPath\": { \"path\": \"../Sales.SemanticModel\" } }" }
        - { id: abs, text: "{ \"byPath\": { \"path\": \"C:/Repos/Contoso/Sales.SemanticModel\" } }" }
        - { id: conn, text: "{ \"byConnection\": { \"connectionString\": \"semanticmodelid=[SemanticModelId]\" } }" }
answer:
  values: { sales: rel, exec: conn }
explanation:
  correct:
    en: A byPath reference points to a semantic model folder with a relative path, and Power BI Desktop then opens the model in full edit mode. Deployments with the Fabric REST APIs must use byConnection, and the connection string only needs the semanticmodelid property.
    fr: Une référence byPath pointe vers un dossier de modèle sémantique par un chemin relatif, et Power BI Desktop ouvre alors le modèle en mode d'édition complet. Les déploiements avec les API REST Fabric doivent utiliser byConnection, et la chaîne de connexion n'a besoin que de la propriété semanticmodelid.
  options:
    abs: { en: "Absolute paths aren't supported in a byPath reference.", fr: "Les chemins absolus ne sont pas pris en charge dans une référence byPath." }
references:
  - title: Power BI Desktop project report folder
    url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-report
