id: dp600-1b-pipeline-admin-access
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a deployment pipeline named Pipeline1 that you created. The Development and Test stages are assigned to workspaces named WS-Dev and WS-Test.

    A release manager named User1 has the Admin role in WS-Dev and WS-Test. User1 can't open Pipeline1 and therefore can't deploy content from Development to Test.

    You need User1 to be able to deploy from Development to Test.

    What should you do?
  fr: |
    Vous disposez d'un pipeline de déploiement nommé Pipeline1 que vous avez créé. Les étapes Development et Test sont affectées aux espaces de travail WS-Dev et WS-Test.

    Une responsable des mises en production nommée User1 a le rôle Admin dans WS-Dev et WS-Test. User1 ne peut pas ouvrir Pipeline1 et ne peut donc pas déployer de contenu de Development vers Test.

    Vous devez permettre à User1 de déployer de Development vers Test.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Share Pipeline1 with User1 to make User1 a pipeline admin.", fr: "Partager Pipeline1 avec User1 pour en faire une administratrice du pipeline." } }
    - { id: b, text: { en: "Make the Test stage of Pipeline1 public.", fr: "Rendre publique l'étape Test de Pipeline1." } }
    - { id: c, text: { en: "Grant User1 the Build permission on the semantic models of WS-Dev.", fr: "Accorder à User1 l'autorisation Build sur les modèles sémantiques de WS-Dev." } }
    - { id: d, text: { en: "Assign User1 the Admin role on the capacity of the workspaces.", fr: "Attribuer à User1 le rôle Admin sur la capacité des espaces de travail." } }
answer: { optionId: a }
explanation:
  correct:
    en: Deployment pipelines have a single permission, pipeline admin, which every pipeline operation requires; users you share the pipeline with become pipeline admins. Deploying to the next stage then also needs the Contributor role or higher in both workspaces, which User1 already has.
    fr: Les pipelines de déploiement n'ont qu'une autorisation, administrateur du pipeline, nécessaire à toute opération sur le pipeline ; les utilisateurs avec qui vous partagez le pipeline en deviennent administrateurs. Déployer vers l'étape suivante demande en plus le rôle Contributor ou supérieur dans les deux espaces de travail, que User1 possède déjà.
  options:
    b: { en: "A public stage is visible to consumers as a regular workspace; it gives no access to the pipeline.", fr: "Une étape publique est visible par les consommateurs comme un espace de travail ordinaire ; elle ne donne pas accès au pipeline." }
    c: { en: "Build permission lets users create content from a semantic model; it doesn't give pipeline access.", fr: "L'autorisation Build permet de créer du contenu à partir d'un modèle sémantique ; elle ne donne pas accès au pipeline." }
    d: { en: "Capacity administration doesn't make a user a pipeline admin.", fr: "L'administration d'une capacité ne fait pas d'un utilisateur un administrateur du pipeline." }
references:
  - title: The Microsoft Fabric deployment pipelines process
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/understand-the-deployment-process
