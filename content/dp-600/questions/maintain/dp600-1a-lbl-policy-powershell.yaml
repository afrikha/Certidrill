id: dp600-1a-lbl-policy-powershell
objective: "1.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an existing Microsoft Purview label policy named **Fabric Authors**. The **General** label has the ID 6f3e2b9a-1c4d-4e8f-9a7b-2d5c8e1f0a34.

    You need to update the policy so that unlabeled Fabric and Power BI items get the General label by default, and users can't save Fabric and Power BI content without a label.

    How should you complete the PowerShell script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une stratégie d'étiquette Microsoft Purview existante nommée **Fabric Authors**. L'étiquette **General** a l'ID 6f3e2b9a-1c4d-4e8f-9a7b-2d5c8e1f0a34.

    Vous devez mettre à jour la stratégie pour que les éléments Fabric et Power BI sans étiquette reçoivent l'étiquette General par défaut, et que les utilisateurs ne puissent pas enregistrer de contenu Fabric et Power BI sans étiquette.

    Comment devez-vous compléter le script PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Connect-IPPSSession
    [[cmd]] -Identity "Fabric Authors" -AdvancedSettings @{
        [[k1]] = "6f3e2b9a-1c4d-4e8f-9a7b-2d5c8e1f0a34"
        [[k2]] = "true"
    }
  slots:
    - id: cmd
      options:
        - { id: setpolicy, text: Set-LabelPolicy }
        - { id: setlabel, text: Set-Label }
        - { id: autopolicy, text: Set-AutoSensitivityLabelPolicy }
    - id: k1
      options:
        - { id: pbidefault, text: powerbidefaultlabelid }
        - { id: pbimandatory, text: powerbimandatory }
        - { id: outlookdefault, text: outlookdefaultlabel }
        - { id: sitemandatory, text: siteandgroupmandatory }
    - id: k2
      options:
        - { id: pbidefault, text: powerbidefaultlabelid }
        - { id: pbimandatory, text: powerbimandatory }
        - { id: outlookdefault, text: outlookdefaultlabel }
        - { id: sitemandatory, text: siteandgroupmandatory }
answer:
  values: { cmd: setpolicy, k1: pbidefault, k2: pbimandatory }
explanation:
  correct:
    en: "The default and mandatory settings for Fabric and Power BI content are advanced settings of a label policy, so you update the policy with `Set-LabelPolicy` in Security & Compliance PowerShell. `powerbidefaultlabelid` takes the ID of the default label, and `powerbimandatory=\"true\"` requires users to label their content. Both are independent of the default and mandatory settings for files and email."
    fr: "Les paramètres d'étiquette par défaut et d'étiquetage obligatoire du contenu Fabric et Power BI sont des paramètres avancés d'une stratégie d'étiquette : vous mettez à jour la stratégie avec `Set-LabelPolicy` dans PowerShell Sécurité et conformité. `powerbidefaultlabelid` reçoit l'ID de l'étiquette par défaut, et `powerbimandatory=\"true\"` oblige les utilisateurs à étiqueter leur contenu. Les deux sont indépendants des paramètres par défaut et obligatoires des fichiers et e-mails."
  options:
    setlabel: { en: "Set-Label changes the settings of a label itself, not of the policy that publishes it.", fr: "Set-Label modifie les paramètres d'une étiquette elle-même, pas de la stratégie qui la publie." }
    autopolicy: { en: "Set-AutoSensitivityLabelPolicy manages auto-labeling policies, not the default label of a label policy.", fr: "Set-AutoSensitivityLabelPolicy gère les stratégies d'étiquetage automatique, pas l'étiquette par défaut d'une stratégie d'étiquette." }
    outlookdefault: { en: "outlookdefaultlabel sets the default label for Outlook email, not for Fabric and Power BI content.", fr: "outlookdefaultlabel définit l'étiquette par défaut des e-mails Outlook, pas du contenu Fabric et Power BI." }
    sitemandatory: { en: "siteandgroupmandatory applies to sites and groups, not to Fabric and Power BI content.", fr: "siteandgroupmandatory s'applique aux sites et aux groupes, pas au contenu Fabric et Power BI." }
references:
  - title: Default label policy for Fabric and Power BI
    url: https://learn.microsoft.com/en-us/fabric/governance/sensitivity-label-default-label-policy
  - title: Mandatory label policy for Fabric and Power BI
    url: https://learn.microsoft.com/en-us/fabric/governance/mandatory-label-policy
