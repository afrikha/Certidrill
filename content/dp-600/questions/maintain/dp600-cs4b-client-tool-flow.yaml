id: dp600-cs4b-client-tool-flow
objective: "1.2.1"
type: ordering
caseStudy: dp600-cs4b-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    A developer must add a measure to SM-Operations. The solution must meet the lifecycle requirement.

    Which five actions should the developer perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un développeur doit ajouter une mesure à SM-Operations. La solution doit satisfaire l'exigence relative au cycle de vie.

    Quelles sont les cinq actions que le développeur doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et placez-les dans l'ordre correct.
body:
  count: 5
  actions:
    - { id: clone, text: { en: "Clone Lamna-BI and create a feature branch from main.", fr: "Cloner Lamna-BI et créer une branche de fonctionnalité à partir de main." } }
    - { id: edit, text: { en: "Open the SM-Operations project in Power BI Desktop, add the measure, and save.", fr: "Ouvrir le projet SM-Operations dans Power BI Desktop, ajouter la mesure et enregistrer." } }
    - { id: push, text: { en: "Commit the changes to the local repository and push the feature branch.", fr: "Valider les modifications dans le référentiel local et envoyer (push) la branche de fonctionnalité." } }
    - { id: pr, text: { en: "Create a pull request into main and complete it after Bram approves it.", fr: "Créer une demande de tirage vers main et la terminer après l'approbation de Bram." } }
    - { id: update, text: { en: "In Lamna-Dev, open the Source control panel and select Update all.", fr: "Dans Lamna-Dev, ouvrir le volet Contrôle de code source et sélectionner Tout mettre à jour." } }
    - { id: publish, text: { en: "Publish SM-Operations from Power BI Desktop to Lamna-Dev.", fr: "Publier SM-Operations depuis Power BI Desktop dans Lamna-Dev." } }
    - { id: commitws, text: { en: "In Lamna-Dev, open the Source control panel and select Commit.", fr: "Dans Lamna-Dev, ouvrir le volet Contrôle de code source et sélectionner Valider." } }
answer:
  sequence: [clone, edit, push, pr, update]
explanation:
  correct:
    en: "With a client tool, the developer works in a local clone of the repository, edits the .pbip project in Power BI Desktop, commits locally and pushes the branch. The pull request into main is the approval gate. Once it is merged, Lamna-Dev shows the new commit in the Updates tab of the Source control panel, and Update all brings the change into the workspace."
    fr: "Avec un outil client, le développeur travaille dans un clone local du référentiel, modifie le projet .pbip dans Power BI Desktop, valide localement et envoie la branche. La demande de tirage vers main est le point d'approbation. Une fois qu'elle est fusionnée, Lamna-Dev affiche la nouvelle validation dans l'onglet Mises à jour du volet Contrôle de code source, et Tout mettre à jour apporte la modification dans l'espace de travail."
  options:
    publish: { en: "Publishing from Power BI Desktop changes Lamna-Dev directly, without the pull request.", fr: "Publier depuis Power BI Desktop modifie Lamna-Dev directement, sans demande de tirage." }
    commitws: { en: "Commit sends workspace changes to the branch; here the change comes from the branch, so the workspace must be updated, not committed.", fr: "Valider envoie les modifications de l'espace de travail vers la branche ; ici la modification vient de la branche, donc l'espace de travail doit être mis à jour, pas validé." }
references:
  - title: Development process using client tool
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/client-tool
  - title: Get started with Git integration
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-get-started
