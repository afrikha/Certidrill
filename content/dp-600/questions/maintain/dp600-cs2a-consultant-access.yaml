id: dp600-cs2a-consultant-access
objective: "1.1.2"
type: multi
caseStudy: dp600-cs2a-coho-vineyard
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the requirement for the external viticulture consultants.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter l'exigence relative aux consultants externes en viticulture.

    Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Assign the consultants the Viewer role on WS-Vineyard.", fr: "Attribuer aux consultants le rôle Viewer sur WS-Vineyard." }
    - id: b
      text: { en: "Share LH-Vineyard with the consultants without selecting any additional permission.", fr: "Partager LH-Vineyard avec les consultants sans sélectionner d'autorisation supplémentaire." }
    - id: c
      text: { en: "Share LH-Vineyard with the consultants and select Read all with SQL analytics endpoint.", fr: "Partager LH-Vineyard avec les consultants et sélectionner Read all with SQL analytics endpoint." }
    - id: d
      text: { en: "Share LH-Vineyard with the consultants and select Read all with Apache Spark.", fr: "Partager LH-Vineyard avec les consultants et sélectionner Read all with Apache Spark." }
    - id: e
      text: { en: "In the SQL analytics endpoint of LH-Vineyard, grant SELECT on dbo.Harvest and dbo.Blocks to the consultants.", fr: "Dans le point de terminaison d'analytique SQL de LH-Vineyard, accorder SELECT sur dbo.Harvest et dbo.Blocks aux consultants." }
answer:
  optionIds: [b, e]
explanation:
  correct:
    en: "Sharing the lakehouse without additional permissions grants only the item Read permission: the consultants see LH-Vineyard and can connect to its SQL analytics endpoint, the equivalent of CONNECT, but they cannot query any table yet. A T-SQL GRANT SELECT on the two tables then gives them exactly the data they need, and no other item of the workspace is visible to them."
    fr: "Le partage du lakehouse sans autorisation supplémentaire n'accorde que l'autorisation Read sur l'élément : les consultants voient LH-Vineyard et peuvent se connecter à son point de terminaison d'analytique SQL, l'équivalent de CONNECT, mais ne peuvent encore interroger aucune table. Une instruction T-SQL GRANT SELECT sur les deux tables leur donne ensuite exactement les données nécessaires, et aucun autre élément de l'espace de travail ne leur est visible."
  options:
    a:
      en: "The Viewer role applies to every item of WS-Vineyard and lets the consultants read all the data through the SQL analytics endpoints, which exceeds the requirement."
      fr: "Le rôle Viewer s'applique à tous les éléments de WS-Vineyard et permet aux consultants de lire toutes les données par les points de terminaison d'analytique SQL, ce qui dépasse l'exigence."
    c:
      en: "Read all with SQL analytics endpoint gives access to every table of the lakehouse, including GrapeVariety, so it is not least privilege."
      fr: "Read all with SQL analytics endpoint donne accès à toutes les tables du lakehouse, y compris GrapeVariety : ce n'est pas le moindre privilège."
    d:
      en: "Read all with Apache Spark gives access to all the lakehouse data through Spark and the OneLake APIs, not table-level T-SQL access."
      fr: "Read all with Apache Spark donne accès à toutes les données du lakehouse par Spark et les API OneLake, pas un accès T-SQL au niveau des tables."
references:
  - title: Share Your Warehouse and Manage Permissions
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions
  - title: SQL granular permissions in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/sql-granular-permissions
