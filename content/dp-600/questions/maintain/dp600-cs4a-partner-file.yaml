id: dp600-cs4a-partner-file
objective: "1.2.6"
type: single
caseStudy: dp600-cs4a-margies-travel
difficulty: 1
status: draft
stem:
  en: |
    You need to create the file for the partner hotels. The solution must meet the partner requirement.

    Which type of file should you create?
  fr: |
    Vous devez créer le fichier destiné aux hôtels partenaires. La solution doit satisfaire l'exigence relative aux partenaires.

    Quel type de fichier devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A Power BI data source file (.pbids)", fr: "Un fichier de source de données Power BI (.pbids)" } }
    - { id: b, text: { en: "A Power BI template file (.pbit)", fr: "Un fichier de modèle Power BI (.pbit)" } }
    - { id: c, text: { en: "A Power BI Desktop project (.pbip)", fr: "Un projet Power BI Desktop (.pbip)" } }
    - { id: d, text: { en: "A Power BI Desktop file (.pbix)", fr: "Un fichier Power BI Desktop (.pbix)" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A .pbids file contains only the connection to one data source, here the server and database of the SQL analytics endpoint, with an optional mode that can be set to DirectQuery. It contains no credentials and no tables, so Power BI Desktop asks the analysts to authenticate and opens the Navigator for them to select the tables."
    fr: "Un fichier .pbids ne contient que la connexion à une source de données, ici le serveur et la base de données du point de terminaison d'analytique SQL, avec un mode facultatif qui peut être défini sur DirectQuery. Il ne contient ni informations d'identification ni tables : Power BI Desktop demande aux analystes de s'authentifier et ouvre le Navigateur pour qu'ils sélectionnent les tables."
  options:
    b: { en: "A template contains the report pages, the model definition and the queries, which the requirement forbids.", fr: "Un modèle contient les pages du rapport, la définition du modèle et les requêtes, ce que l'exigence interdit." }
    c: { en: "A project is a folder of report and semantic model definitions used for source control, not a connection file.", fr: "Un projet est un dossier de définitions de rapport et de modèle sémantique utilisé pour le contrôle de code source, pas un fichier de connexion." }
    d: { en: "A .pbix file contains the report, the model and its data.", fr: "Un fichier .pbix contient le rapport, le modèle et ses données." }
references:
  - title: Get data in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-data-sources
