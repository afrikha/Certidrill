id: dp600-1b-discovery-settings
objective: "1.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Your Fabric tenant has certification enabled for a security group named Stewards. The members of Stewards certify the semantic models of the finance team.

    You need to configure the tenant to meet the following requirements:

    - The members of Stewards can mark the semantic models they certify as discoverable.
    - All users can find discoverable endorsed semantic models in the OneLake catalog, even when they don't have access to them.

    Which tenant setting should you enable for each requirement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre locataire Fabric a la certification activée pour un groupe de sécurité nommé Stewards. Les membres de Stewards certifient les modèles sémantiques de l'équipe financière.

    Vous devez configurer le locataire pour répondre aux exigences suivantes :

    - Les membres de Stewards peuvent rendre détectables les modèles sémantiques qu'ils certifient.
    - Tous les utilisateurs peuvent trouver dans le catalogue OneLake les modèles sémantiques approuvés détectables, même quand ils n'y ont pas accès.

    Quel paramètre de locataire devez-vous activer pour chaque exigence ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Stewards mark certified models as discoverable: [[mark]]
      All users find discoverable models: [[find]]
    fr: |
      Les membres de Stewards rendent détectables les modèles certifiés : [[mark]]
      Tous les utilisateurs trouvent les modèles détectables : [[find]]
  slots:
    - id: mark
      options:
        - { id: promo, text: Make promoted content discoverable }
        - { id: cert, text: Make certified content discoverable }
        - { id: disc, text: Discover content }
        - { id: certif, text: Certification }
    - id: find
      options:
        - { id: promo, text: Make promoted content discoverable }
        - { id: cert, text: Make certified content discoverable }
        - { id: disc, text: Discover content }
        - { id: certif, text: Certification }
answer:
  values: { mark: cert, find: disc }
explanation:
  correct:
    en: Make certified content discoverable lets the specified users who are authorized to certify content mark certified content as discoverable. Discover content lets the specified users find endorsed content that is marked as discoverable, even if they don't have access to it, and then request access.
    fr: Make certified content discoverable permet aux utilisateurs indiqués qui sont autorisés à certifier de rendre détectable le contenu certifié. Discover content permet aux utilisateurs indiqués de trouver le contenu approuvé marqué comme détectable, même sans y avoir accès, puis d'en demander l'accès.
  options:
    promo: { en: "This setting covers promoted content, not the certified models of the scenario.", fr: "Ce paramètre concerne le contenu promu, pas les modèles certifiés du scénario." }
    certif: { en: "Certification is already enabled for Stewards; it controls who can certify, not discoverability.", fr: "La certification est déjà activée pour Stewards ; elle contrôle qui peut certifier, pas la détectabilité." }
references:
  - title: Semantic model discoverability
    url: https://learn.microsoft.com/en-us/power-bi/collaborate-share/service-discovery
