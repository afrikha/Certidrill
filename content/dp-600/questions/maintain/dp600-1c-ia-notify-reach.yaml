id: dp600-1c-ia-notify-reach
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Core** that contains a lakehouse named **LH-Core**. You have the Contributor role in WS-Core.

    Impact analysis of LH-Core shows affected items in two workspaces only: **WS-A**, where you have the Viewer role, and **WS-B**, where you have no role.

    You select **Notify contacts**, describe a planned change to LH-Core, and select **Send**.

    Who receives the email?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Core** qui contient un lakehouse nommé **LH-Core**. Vous avez le rôle Contributor dans WS-Core.

    L'analyse d'impact de LH-Core montre des éléments affectés dans deux espaces de travail seulement : **WS-A**, où vous avez le rôle Viewer, et **WS-B**, où vous n'avez aucun rôle.

    Vous sélectionnez **Notifier les contacts**, décrivez une modification prévue de LH-Core et sélectionnez **Envoyer**.

    Qui reçoit l'e-mail ?
body:
  options:
    - { id: a, text: { en: "The contact list of WS-A only", fr: "La liste de contacts de WS-A uniquement" } }
    - { id: b, text: { en: "The owners of the affected items in WS-A only", fr: "Les propriétaires des éléments affectés de WS-A uniquement" } }
    - { id: c, text: { en: "The contact lists of WS-A and WS-B", fr: "Les listes de contacts de WS-A et de WS-B" } }
    - { id: d, text: { en: "The owners of the affected items in WS-A and WS-B", fr: "Les propriétaires des éléments affectés de WS-A et WS-B" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Notify contacts sends the email to the contact lists of all the impacted workspaces, including workspaces you can't access, and your name appears on the email so that the contacts can reply. Workspace roles don't matter: WS-B receives the message even though you have no role in it."
    fr: "Notifier les contacts envoie l'e-mail aux listes de contacts de tous les espaces de travail touchés, y compris ceux auxquels vous n'avez pas accès, et votre nom figure dans l'e-mail pour que les contacts puissent vous répondre. Les rôles d'espace de travail n'ont pas d'importance : WS-B reçoit le message même si vous n'y avez aucun rôle."
  options:
    a:
      en: "The message also reaches workspaces you can't access, such as WS-B."
      fr: "Le message atteint aussi les espaces de travail auxquels vous n'avez pas accès, comme WS-B."
    b:
      en: "The recipients are the workspace contact lists, not the owners of individual items."
      fr: "Les destinataires sont les listes de contacts des espaces de travail, pas les propriétaires des éléments."
    d:
      en: "Item owners aren't the recipients; the contact lists of the impacted workspaces are."
      fr: "Les propriétaires des éléments ne sont pas les destinataires : ce sont les listes de contacts des espaces de travail touchés."
references:
  - title: Impact analysis
    url: https://learn.microsoft.com/en-us/fabric/governance/impact-analysis
