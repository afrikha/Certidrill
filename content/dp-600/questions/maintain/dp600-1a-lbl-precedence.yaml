id: dp600-1a-lbl-precedence
objective: "1.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware uses three sensitivity labels, from least to most restrictive: **General**, **Confidential** and **Highly Confidential**. The tenant setting **Apply sensitivity labels from data sources to their data in Power BI** is enabled, and every label is published to the model owners.

    - **ModelA** imports two tables from an Azure SQL Database. One table is labeled General and the other Confidential. ModelA had no label.
    - **ModelB** was labeled Highly Confidential manually. It imports data from an Azure SQL Database labeled General.
    - **ReportC** is labeled Confidential. Its semantic model is labeled General. A user downloads ReportC to a .pbix file.

    Which label does each item end up with? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware utilise trois étiquettes de confidentialité, de la moins restrictive à la plus restrictive : **General**, **Confidential** et **Highly Confidential**. Le paramètre de locataire **Apply sensitivity labels from data sources to their data in Power BI** est activé, et toutes les étiquettes sont publiées pour les propriétaires des modèles.

    - **ModelA** importe deux tables d'une base de données Azure SQL Database. L'une est étiquetée General et l'autre Confidential. ModelA n'avait pas d'étiquette.
    - **ModelB** a été étiqueté manuellement Highly Confidential. Il importe des données d'une base Azure SQL Database étiquetée General.
    - **ReportC** porte l'étiquette Confidential. Son modèle sémantique porte l'étiquette General. Un utilisateur télécharge ReportC dans un fichier .pbix.

    Quelle étiquette chaque élément porte-t-il au final ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      ModelA after its next refresh: [[a]]

      ModelB after its next refresh: [[b]]

      The downloaded .pbix file of ReportC: [[c]]
    fr: |
      ModelA après sa prochaine actualisation : [[a]]

      ModelB après sa prochaine actualisation : [[b]]

      Le fichier .pbix téléchargé de ReportC : [[c]]
  slots:
    - id: a
      options:
        - { id: general, text: General }
        - { id: confidential, text: Confidential }
        - { id: highly, text: Highly Confidential }
    - id: b
      options:
        - { id: general, text: General }
        - { id: confidential, text: Confidential }
        - { id: highly, text: Highly Confidential }
    - id: c
      options:
        - { id: general, text: General }
        - { id: confidential, text: Confidential }
        - { id: highly, text: Highly Confidential }
answer:
  values: { a: confidential, b: highly, c: confidential }
explanation:
  correct:
    en: "When an imported source has several labels, the most restrictive one is chosen, so ModelA gets Confidential. Labels from data sources never overwrite a manually applied label and never replace a label with a less restrictive one, so ModelB keeps Highly Confidential. When a report and its semantic model have different labels, the more restrictive label applies to the downloaded .pbix file."
    fr: "Quand une source importée porte plusieurs étiquettes, la plus restrictive est retenue : ModelA reçoit Confidential. Les étiquettes des sources de données n'écrasent jamais une étiquette appliquée manuellement et ne remplacent jamais une étiquette par une moins restrictive : ModelB conserve Highly Confidential. Quand un rapport et son modèle sémantique ont des étiquettes différentes, l'étiquette la plus restrictive s'applique au fichier .pbix téléchargé."
references:
  - title: Sensitivity label inheritance from data sources in Power BI
    url: https://learn.microsoft.com/en-us/fabric/governance/service-security-sensitivity-label-inheritance-from-data-sources
  - title: Sensitivity labels in Power BI
    url: https://learn.microsoft.com/en-us/fabric/enterprise/powerbi/service-security-sensitivity-label-overview
