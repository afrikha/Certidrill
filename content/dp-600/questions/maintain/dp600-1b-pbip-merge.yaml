id: dp600-1b-pbip-merge
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Three developers at Contoso work on the same Power BI report and its semantic model in Power BI Desktop. Today, they store a single .pbix file in an Azure DevOps repository.

    You need the developers to be able to review each change to measures and report pages line by line and to merge their parallel changes in Git.

    How should the developers save their work?
  fr: |
    Trois développeurs de Contoso travaillent sur le même rapport Power BI et son modèle sémantique dans Power BI Desktop. Aujourd'hui, ils stockent un unique fichier .pbix dans un référentiel Azure DevOps.

    Vous devez permettre aux développeurs de relire ligne par ligne chaque modification des mesures et des pages de rapport, et de fusionner dans Git leurs modifications parallèles.

    Comment les développeurs doivent-ils enregistrer leur travail ?
body:
  options:
    - { id: a, text: { en: "As a Power BI template (.pbit) file", fr: "Sous forme de fichier de modèle Power BI (.pbit)" } }
    - { id: b, text: { en: "As a Power BI data source (.pbids) file", fr: "Sous forme de fichier de source de données Power BI (.pbids)" } }
    - { id: c, text: { en: "As a .pbix file with the large semantic model storage format", fr: "Sous forme de fichier .pbix avec le format de stockage de modèle sémantique volumineux" } }
    - { id: d, text: { en: "As a Power BI Project (.pbip)", fr: "Sous forme de projet Power BI (.pbip)" } }
answer: { optionId: d }
explanation:
  correct:
    en: A Power BI project saves the report and the semantic model definitions as folders of plain text files, such as TMDL files for the model, so Git can show line-level differences and merge changes. A .pbix file is a single binary file that can only be replaced as a whole.
    fr: |
      Un projet Power BI enregistre les définitions du rapport et du modèle sémantique sous forme de dossiers de fichiers texte, comme des fichiers TMDL pour le modèle : Git peut alors afficher les différences ligne par ligne et fusionner les modifications. Un fichier .pbix est un fichier binaire unique qui ne peut être remplacé que d'un bloc.
  options:
    a: { en: "A template is a single file used to start new reports from a common design; it isn't a text format for source control.", fr: "Un modèle est un fichier unique qui sert à démarrer de nouveaux rapports à partir d'une conception commune ; ce n'est pas un format texte pour le contrôle de code source." }
    b: { en: "A .pbids file only describes one data connection; it contains no report or model.", fr: "Un fichier .pbids ne décrit qu'une connexion de données ; il ne contient ni rapport ni modèle." }
    c: { en: "The large semantic model storage format is a service setting for model size; it doesn't change the .pbix into text files.", fr: "Le format de stockage de modèle sémantique volumineux est un paramètre du service lié à la taille du modèle ; il ne transforme pas le .pbix en fichiers texte." }
references:
  - title: Power BI Desktop projects (PBIP)
    url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-overview
