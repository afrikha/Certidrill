id: dp600-1a-dls-sql-user-identity
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Fabric lakehouse named **LH-Claims**. You defined OneLake security roles with row-level security on the `claims` table so that each insurance adjuster sees only the claims of their region.

    Adjusters who read the table from Spark see only their region. Adjusters who query the table through the SQL analytics endpoint of LH-Claims see every region.

    The SQL queries must be filtered by the same role definitions. The solution must minimize administrative effort. What should you do?
  fr: |
    Adatum dispose d'un lakehouse Fabric nommé **LH-Claims**. Vous avez défini des rôles de sécurité OneLake avec une sécurité au niveau des lignes sur la table `claims`, afin que chaque gestionnaire de sinistres ne voie que les sinistres de sa région.

    Les gestionnaires qui lisent la table depuis Spark ne voient que leur région. Ceux qui interrogent la table par le point de terminaison d'analytique SQL de LH-Claims voient toutes les régions.

    Les requêtes SQL doivent être filtrées par les mêmes définitions de rôles. La solution doit réduire au minimum l'effort d'administration. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a security policy with a filter predicate on the claims table in the SQL analytics endpoint", fr: "Créer une stratégie de sécurité avec un prédicat de filtre sur la table claims dans le point de terminaison d'analytique SQL" } }
    - { id: b, text: { en: "Grant the adjusters Read all with SQL analytics endpoint on LH-Claims", fr: "Accorder aux gestionnaires Read all with SQL analytics endpoint sur LH-Claims" } }
    - { id: c, text: { en: "Add a row-level security role with a DAX filter to a semantic model on LH-Claims", fr: "Ajouter un rôle de sécurité au niveau des lignes avec un filtre DAX à un modèle sémantique sur LH-Claims" } }
    - { id: d, text: { en: "Switch the SQL analytics endpoint of LH-Claims to User's identity access mode", fr: "Faire passer le point de terminaison d'analytique SQL de LH-Claims en mode d'accès identité de l'utilisateur" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A new SQL analytics endpoint starts in delegated identity mode and doesn't enforce OneLake security for the querying user. A workspace Admin or Member switches it once, from the Security tab, to User's identity access mode; the endpoint then applies the existing OneLake security roles, including their row-level rules."
    fr: "Un nouveau point de terminaison d'analytique SQL démarre en mode identité déléguée et n'applique pas la sécurité OneLake à l'utilisateur qui interroge. Un Admin ou un Member de l'espace de travail le fait passer une seule fois, depuis l'onglet Sécurité, en mode d'accès identité de l'utilisateur ; le point de terminaison applique alors les rôles de sécurité OneLake existants, y compris leurs règles de lignes."
  options:
    a: { en: "A SQL security policy would filter the queries, but it duplicates the rules in a second place to maintain.", fr: "Une stratégie de sécurité SQL filtrerait les requêtes, mais elle duplique les règles à un second endroit à maintenir." }
    b: { en: "ReadData gives more SQL access; it doesn't make the endpoint apply OneLake security.", fr: "ReadData donne plus d'accès SQL ; elle ne fait pas appliquer la sécurité OneLake par le point de terminaison." }
    c: { en: "Semantic model RLS filters queries through the model, not T-SQL queries on the SQL analytics endpoint.", fr: "La RLS du modèle sémantique filtre les requêtes passant par le modèle, pas les requêtes T-SQL sur le point de terminaison d'analytique SQL." }
references:
  - title: Get started with OneLake security
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/get-started-onelake-security
