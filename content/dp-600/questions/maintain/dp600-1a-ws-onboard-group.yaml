id: dp600-1a-ws-onboard-group
objective: "1.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Fabric workspace named **WS-Finance**. Twelve new data engineers must build and run items in WS-Finance. Adatum manages access by group to minimize administrative effort when people join or leave the team.

    The engineers are signed in to Fabric and must be able to work as soon as possible.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose d'un espace de travail Fabric nommé **WS-Finance**. Douze nouveaux ingénieurs données doivent créer et exécuter des éléments dans WS-Finance. Adatum gère les accès par groupe pour réduire l'effort d'administration à chaque arrivée ou départ dans l'équipe.

    Les ingénieurs sont connectés à Fabric et doivent pouvoir travailler le plus tôt possible.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: group, text: { en: "Create a security group in Microsoft Entra ID and add the engineers to it.", fr: "Créer un groupe de sécurité dans Microsoft Entra ID et y ajouter les ingénieurs." } }
    - { id: manage, text: { en: "In WS-Finance, select Manage access.", fr: "Dans WS-Finance, sélectionner Manage access." } }
    - { id: add, text: { en: "Select Add people or groups, enter the group, select the Contributor role and select Add.", fr: "Sélectionner Add people or groups, entrer le groupe, sélectionner le rôle Contributor puis Add." } }
    - { id: signin, text: { en: "Ask the engineers to sign out of Fabric and sign in again.", fr: "Demander aux ingénieurs de se déconnecter de Fabric et de se reconnecter." } }
    - { id: share, text: { en: "Share each item of WS-Finance with the group and select Edit.", fr: "Partager chaque élément de WS-Finance avec le groupe en sélectionnant Edit." } }
    - { id: reshare, text: { en: "Grant the group the Reshare permission on each item of WS-Finance.", fr: "Accorder au groupe l'autorisation Reshare sur chaque élément de WS-Finance." } }
answer:
  sequence: [ group, manage, add, signin ]
explanation:
  correct:
    en: "A workspace role assigned to a security group applies to all its members and to every item of the workspace, present and future, so later team changes only touch the group. You add the group from Manage access with the Contributor role, which allows creating and running items. Workspace access changes take effect the next time a user signs in, so the signed-in engineers sign out and back in."
    fr: "Un rôle d'espace de travail attribué à un groupe de sécurité s'applique à tous ses membres et à tous les éléments de l'espace de travail, présents et futurs ; les changements d'équipe ne touchent ensuite que le groupe. Vous ajoutez le groupe depuis Manage access avec le rôle Contributor, qui permet de créer et d'exécuter des éléments. Les modifications d'accès à un espace de travail prennent effet à la prochaine connexion : les ingénieurs connectés se déconnectent puis se reconnectent."
  options:
    share: { en: "Item sharing covers only existing items, needs one action per item and does not allow creating new items.", fr: "Le partage d'éléments ne couvre que les éléments existants, demande une action par élément et ne permet pas de créer de nouveaux éléments." }
    reshare: { en: "Reshare lets users share items onward; it does not let them build or run items.", fr: "Reshare permet de repartager des éléments ; il ne permet ni de créer ni d'exécuter des éléments." }
references:
  - title: Give users access to workspaces
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/give-access-workspaces
