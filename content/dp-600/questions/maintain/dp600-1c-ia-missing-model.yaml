id: dp600-1c-ia-missing-model
objective: "1.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Prep** that contains a dataflow named **DF-Products**. You have the Contributor role in WS-Prep and in a workspace named **WS-Legacy**.

    WS-Legacy contains a semantic model named **SM-Legacy** that imports data from DF-Products. A developer created the query of SM-Legacy by typing the M code in a blank query instead of using Get data.

    When you run impact analysis on DF-Products, SM-Legacy isn't listed, and the pane shows no item with limited access.

    You need to explain the result and ensure that SM-Legacy appears in future impact analyses.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Prep** qui contient un flux de données nommé **DF-Products**. Vous avez le rôle Contributor dans WS-Prep et dans un espace de travail nommé **WS-Legacy**.

    WS-Legacy contient un modèle sémantique nommé **SM-Legacy** qui importe des données depuis DF-Products. Un développeur a créé la requête de SM-Legacy en saisissant le code M dans une requête vide au lieu d'utiliser Obtenir les données.

    Quand vous lancez l'analyse d'impact sur DF-Products, SM-Legacy n'est pas listé et le volet n'affiche aucun élément en accès limité.

    Vous devez expliquer ce résultat et faire en sorte que SM-Legacy apparaisse dans les prochaines analyses d'impact.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      SM-Legacy is missing because [[cause]].

      To make it appear, [[fix]].
    fr: |
      SM-Legacy est absent parce que [[cause]].

      Pour qu'il apparaisse, [[fix]].
  slots:
    - id: cause
      options:
        - { id: mashup, text: { en: "lineage isn't guaranteed for a connection created with a manually written mashup query", fr: "la traçabilité n'est pas garantie pour une connexion créée avec une requête mashup écrite manuellement" } }
        - { id: access, text: { en: "items in workspaces that you can't access are hidden", fr: "les éléments des espaces de travail auxquels vous n'avez pas accès sont masqués" } }
        - { id: import, text: { en: "impact analysis doesn't list semantic models in Import mode", fr: "l'analyse d'impact ne liste pas les modèles sémantiques en mode Import" } }
        - { id: tab, text: { en: "the Child items tab doesn't list items in other workspaces", fr: "l'onglet Éléments enfants ne liste pas les éléments des autres espaces de travail" } }
    - id: fix
      options:
        - { id: getdata, text: { en: "re-create the query by using the Dataflows connector in Get data", fr: "recréer la requête avec le connecteur Dataflows dans Obtenir les données" } }
        - { id: role, text: { en: "ask for the Admin role in WS-Legacy", fr: "demander le rôle Admin dans WS-Legacy" } }
        - { id: endorse, text: { en: "promote SM-Legacy", fr: "promouvoir SM-Legacy" } }
        - { id: downstream, text: { en: "select the All downstream items tab", fr: "sélectionner l'onglet Tous les éléments en aval" } }
answer:
  values: { cause: mashup, fix: getdata }
explanation:
  correct:
    en: "Lineage between a semantic model and a dataflow is guaranteed only when the connection is set up through the Get data UI with the Dataflows connector; a manually created mashup query may not be displayed. Re-creating the query with the Dataflows connector makes SM-Legacy appear as a child of DF-Products in the lineage view and in impact analysis."
    fr: "La traçabilité entre un modèle sémantique et un flux de données n'est garantie que si la connexion est configurée par l'interface Obtenir les données avec le connecteur Dataflows ; une requête mashup créée manuellement peut ne pas être affichée. Recréer la requête avec le connecteur Dataflows fait apparaître SM-Legacy comme enfant de DF-Products dans la vue de traçabilité et dans l'analyse d'impact."
  options:
    access:
      en: "You have the Contributor role in WS-Legacy, and inaccessible items are shown as limited access rather than hidden."
      fr: "Vous avez le rôle Contributor dans WS-Legacy, et les éléments inaccessibles sont affichés en accès limité au lieu d'être masqués."
    tab:
      en: "Child items lists the direct children whatever their workspace; SM-Legacy would be a direct child of DF-Products."
      fr: "Éléments enfants liste les enfants directs quel que soit leur espace de travail ; SM-Legacy serait un enfant direct de DF-Products."
    role:
      en: "Your Contributor role already gives you access to WS-Legacy; the missing link comes from the way the query was written."
      fr: "Votre rôle Contributor vous donne déjà accès à WS-Legacy ; le lien manquant vient de la façon dont la requête a été écrite."
    downstream:
      en: "All downstream items extends the same lineage graph; a link that lineage doesn't know about appears on neither tab."
      fr: "Tous les éléments en aval étend le même graphe de traçabilité ; un lien que la traçabilité ignore n'apparaît dans aucun onglet."
references:
  - title: Lineage in Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/lineage
  - title: Impact analysis
    url: https://learn.microsoft.com/en-us/fabric/governance/impact-analysis
