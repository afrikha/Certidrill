id: dp600-1a-lbl-change-enforcement
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a Fabric workspace named **WS-Risk**. A user named Omar manually applied the **Highly Confidential** label, which has encryption settings, to a report named **Exposure**.

    A user named Rita has the Member role in WS-Risk. Rita must change the label of Exposure to **Confidential**, but the change is rejected. Omar has left the company.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un espace de travail Fabric nommé **WS-Risk**. Un utilisateur nommé Omar a appliqué manuellement l'étiquette **Highly Confidential**, qui comporte des paramètres de chiffrement, à un rapport nommé **Exposure**.

    Une utilisatrice nommée Rita a le rôle Member dans WS-Risk. Rita doit remplacer l'étiquette de Exposure par **Confidential**, mais la modification est refusée. Omar a quitté l'entreprise.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign Rita the Admin role in WS-Risk", fr: "Attribuer à Rita le rôle Admin dans WS-Risk" } }
    - { id: b, text: { en: "Grant Rita the Build permission on the semantic model of Exposure", fr: "Accorder à Rita l'autorisation Build sur le modèle sémantique de Exposure" } }
    - { id: c, text: { en: "Ask a Fabric administrator to enable Automatically apply sensitivity labels to downstream content", fr: "Demander à un administrateur Fabric d'activer Automatically apply sensitivity labels to downstream content" } }
    - { id: d, text: { en: "In the Microsoft Purview portal, assign Rita the EXPORT usage right for the Highly Confidential label", fr: "Dans le portail Microsoft Purview, attribuer à Rita le droit d'utilisation EXPORT pour l'étiquette Highly Confidential" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Power BI restricts changing or removing a label that has encryption settings to the user who applied it and to users who hold a usage right for the label, such as OWNER, EXPORT, or EDIT together with EDITRIGHTSDATA. Usage rights are configured with the label in Microsoft Purview, so granting Rita EXPORT lets her change the label."
    fr: "Power BI limite la modification ou la suppression d'une étiquette qui comporte des paramètres de chiffrement à l'utilisateur qui l'a appliquée et aux utilisateurs qui disposent d'un droit d'utilisation sur l'étiquette, comme OWNER, EXPORT, ou EDIT avec EDITRIGHTSDATA. Les droits d'utilisation se configurent avec l'étiquette dans Microsoft Purview : accorder EXPORT à Rita lui permet de changer l'étiquette."
  options:
    a: { en: "Label change enforcement relies on label usage rights, not on workspace roles; the workspace admin override covers only automatically applied labels.", fr: "Le contrôle des modifications d'étiquette repose sur les droits d'utilisation de l'étiquette, pas sur les rôles d'espace de travail ; le contournement par l'administrateur d'espace de travail ne couvre que les étiquettes appliquées automatiquement." }
    b: { en: "Build lets Rita create content from the model; it gives no right on the label.", fr: "Build permet à Rita de créer du contenu à partir du modèle ; il ne donne aucun droit sur l'étiquette." }
    c: { en: "This setting propagates labels to downstream items; it doesn't authorize label changes.", fr: "Ce paramètre propage les étiquettes vers les éléments en aval ; il n'autorise pas les modifications d'étiquette." }
references:
  - title: Sensitivity label change enforcement
    url: https://learn.microsoft.com/en-us/fabric/enterprise/powerbi/service-security-sensitivity-label-change-enforcement
