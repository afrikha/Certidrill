id: dp600-cs3c-student-ols
objective: "1.1.3"
type: multi
caseStudy: dp600-cs3c-graphic-design-institute
difficulty: 2
status: draft
stem:
  en: |
    You need to meet requirement 2.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence 2.

    Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In SM-Enrollment, set the Hidden property of NationalId and DateOfBirth to Yes.", fr: "Dans SM-Enrollment, définir la propriété Hidden de NationalId et DateOfBirth sur Yes." } }
    - { id: b, text: { en: "In SM-Enrollment, create a role whose filter on Student returns FALSE() for the rows that contain a NationalId.", fr: "Dans SM-Enrollment, créer un rôle dont le filtre sur Student renvoie FALSE() pour les lignes qui contiennent un NationalId." } }
    - { id: c, text: { en: "In SM-Enrollment, create a role that sets metadataPermission to none for the NationalId and DateOfBirth columns of Student.", fr: "Dans SM-Enrollment, créer un rôle qui définit metadataPermission sur none pour les colonnes NationalId et DateOfBirth de Student." } }
    - { id: d, text: { en: "Add the Lecturers group to the role on the Security page of SM-Enrollment in the Fabric portal.", fr: "Ajouter le groupe Lecturers au rôle dans la page Security de SM-Enrollment dans le portail Fabric." } }
    - { id: e, text: { en: "Give the Lecturers group the Contributor role in GDI-Analytics.", fr: "Donner au groupe Lecturers le rôle Contributor dans GDI-Analytics." } }
answer: { optionIds: [c, d] }
explanation:
  correct:
    en: |
      Object-level security is defined in a model role, for example in the TMDL view or with Tabular Editor, by setting metadataPermission to none on the columns; for the members of the role, the columns are treated as if they did not exist. Members are assigned to roles in the service, on the Security page of the semantic model. OLS applies to the Lecturers group because it has the Viewer role.
    fr: |
      La sécurité au niveau de l'objet se définit dans un rôle du modèle, par exemple dans la vue TMDL ou avec Tabular Editor, en définissant metadataPermission sur none pour les colonnes ; pour les membres du rôle, les colonnes sont traitées comme si elles n'existaient pas. Les membres sont affectés aux rôles dans le service, dans la page Security du modèle sémantique. L'OLS s'applique au groupe Lecturers car il a le rôle Viewer.
  options:
    a: { en: "Hiding a column only removes it from the field list for convenience; it is not security, and it would hide the columns from all the users.", fr: "Masquer une colonne ne la retire de la liste des champs que par commodité ; ce n'est pas une sécurité, et cela masquerait les colonnes pour tous les utilisateurs." }
    b: { en: "A row-level filter removes rows, not columns, and the columns would still appear in the model.", fr: "Un filtre au niveau des lignes supprime des lignes, pas des colonnes, et les colonnes apparaîtraient toujours dans le modèle." }
    e: { en: "OLS does not apply to Admin, Member or Contributor, because these roles have edit permission on the semantic model.", fr: "L'OLS ne s'applique pas aux rôles Admin, Member ou Contributor, car ces rôles ont l'autorisation de modification sur le modèle sémantique." }
references:
  - title: Object-Level Security (OLS) with Power BI
    url: https://learn.microsoft.com/en-us/fabric/security/service-admin-object-level-security
