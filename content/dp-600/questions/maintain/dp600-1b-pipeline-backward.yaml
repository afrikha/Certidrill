id: dp600-1b-pipeline-backward
objective: "1.2.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has a Fabric workspace named WS-Finance that business users already use in production. It contains semantic models and reports. You have the Admin role in WS-Finance.

    You need to create a deployment pipeline that has Development, Test and Production stages. WS-Finance must remain the production workspace, and the Development and Test stages must start with a copy of its content. No other workspace exists yet.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys dispose d'un espace de travail Fabric nommé WS-Finance que les utilisateurs métier utilisent déjà en production. Il contient des modèles sémantiques et des rapports. Vous avez le rôle Admin dans WS-Finance.

    Vous devez créer un pipeline de déploiement qui comporte les étapes Development, Test et Production. WS-Finance doit rester l'espace de travail de production, et les étapes Development et Test doivent démarrer avec une copie de son contenu. Aucun autre espace de travail n'existe encore.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create a deployment pipeline with the Development, Test and Production stages.", fr: "Créer un pipeline de déploiement avec les étapes Development, Test et Production." } }
    - { id: assignprod, text: { en: "Assign WS-Finance to the Production stage.", fr: "Affecter WS-Finance à l'étape Production." } }
    - { id: totest, text: { en: "Deploy all the content from the Production stage to the Test stage.", fr: "Déployer tout le contenu de l'étape Production vers l'étape Test." } }
    - { id: todev, text: { en: "Deploy all the content from the Test stage to the Development stage.", fr: "Déployer tout le contenu de l'étape Test vers l'étape Development." } }
    - { id: assigndev, text: { en: "Assign WS-Finance to the Development stage.", fr: "Affecter WS-Finance à l'étape Development." } }
    - { id: selective, text: { en: "Deploy only the semantic models from the Production stage to the Test stage.", fr: "Déployer uniquement les modèles sémantiques de l'étape Production vers l'étape Test." } }
    - { id: rules, text: { en: "Create deployment rules in the Development stage.", fr: "Créer des règles de déploiement dans l'étape Development." } }
answer:
  sequence: [ create, assignprod, totest, todev ]
explanation:
  correct:
    en: You create the pipeline and assign the existing workspace to the Production stage, so WS-Finance stays the production workspace. Backward deployment then copies the content to an earlier stage; it is possible only when the target stage is empty and only for all the content, so you deploy from Production to Test, and then from Test to Development.
    fr: |
      Vous créez le pipeline et affectez l'espace de travail existant à l'étape Production, pour que WS-Finance reste l'espace de travail de production. Le déploiement vers l'arrière copie ensuite le contenu vers une étape antérieure ; il n'est possible que si l'étape cible est vide et que pour tout le contenu : vous déployez donc de Production vers Test, puis de Test vers Development.
  options:
    assigndev: { en: "Assigning WS-Finance to Development would make it the development workspace, and forward deployments would create a new production workspace.", fr: "Affecter WS-Finance à Development en ferait l'espace de travail de développement, et les déploiements vers l'avant créeraient un nouvel espace de travail de production." }
    selective: { en: "Backward deployment can't be selective; it must deploy all the content.", fr: "Le déploiement vers l'arrière ne peut pas être sélectif ; il doit déployer tout le contenu." }
    rules: { en: "Deployment rules can't be created in the development stage and aren't needed to copy the content.", fr: "Les règles de déploiement ne peuvent pas être créées dans l'étape de développement et ne sont pas nécessaires pour copier le contenu." }
references:
  - title: Fabric Application lifecycle management (ALM) deployment pipelines deploy content
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/deploy-content
