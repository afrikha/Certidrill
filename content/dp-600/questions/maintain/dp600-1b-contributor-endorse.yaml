id: dp600-1b-contributor-endorse
objective: "1.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a semantic model named SM1 and a dashboard named Dash1. User1 has the Contributor role in Workspace1.

    Your Fabric tenant has the following configuration:

    - Certification is enabled for a security group named Certifiers. User1 is not a member of Certifiers.
    - Master data endorsement is disabled.

    Which two actions can User1 perform?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un modèle sémantique nommé SM1 et un tableau de bord nommé Dash1. User1 a le rôle Contributor dans Workspace1.

    Votre locataire Fabric a la configuration suivante :

    - La certification est activée pour un groupe de sécurité nommé Certifiers. User1 n'est pas membre de Certifiers.
    - L'approbation des données de référence est désactivée.

    Quelles sont les deux actions que User1 peut effectuer ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Certify SM1.", fr: "Certifier SM1." } }
    - { id: b, text: { en: "Promote SM1.", fr: "Promouvoir SM1." } }
    - { id: c, text: { en: "Promote Dash1.", fr: "Promouvoir Dash1." } }
    - { id: d, text: { en: "Apply the Master data badge to SM1.", fr: "Appliquer le badge Master data à SM1." } }
    - { id: e, text: { en: "Follow the How do I get content certified link to request certification of SM1.", fr: "Suivre le lien How do I get content certified pour demander la certification de SM1." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: The Contributor role gives User1 write permission on SM1, which is all that promotion requires. Because User1 isn't an authorized certifier, the Certified option is greyed out, but any user can request certification through the How do I get content certified link of the endorsement settings.
    fr: Le rôle Contributor donne à User1 l'autorisation d'écriture sur SM1, ce qui suffit pour promouvoir. Comme User1 n'est pas un certificateur autorisé, l'option Certified est grisée, mais tout utilisateur peut demander une certification par le lien How do I get content certified des paramètres d'approbation.
  options:
    a: { en: "Only members of the security groups specified by the Fabric administrator can certify items.", fr: "Seuls les membres des groupes de sécurité indiqués par l'administrateur Fabric peuvent certifier des éléments." }
    c: { en: "Power BI dashboards can't be promoted or certified.", fr: "Les tableaux de bord Power BI ne peuvent être ni promus ni certifiés." }
    d: { en: "Master data endorsement is disabled in the tenant, and it requires authorization by the Fabric administrator.", fr: "L'approbation des données de référence est désactivée dans le locataire, et elle demande une autorisation de l'administrateur Fabric." }
references:
  - title: Endorse Fabric and Power BI items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/endorsement-promote-certify
