id: dp600-1b-domain-certifiers
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your Fabric tenant contains two domains named Finance and HR. Each domain has its own domain administrators.

    You plan to enable certification. Each domain must have its own set of authorized certifiers, and the domain administrators must manage the certification settings of their domain. The solution must minimize the ongoing effort of the Fabric administrators.

    What should you do in the Certification tenant setting?
  fr: |
    Votre locataire Fabric contient deux domaines nommés Finance et HR. Chaque domaine a ses propres administrateurs de domaine.

    Vous prévoyez d'activer la certification. Chaque domaine doit avoir son propre ensemble de certificateurs autorisés, et les administrateurs de domaine doivent gérer les paramètres de certification de leur domaine. La solution doit réduire au minimum l'effort continu des administrateurs Fabric.

    Que devez-vous faire dans le paramètre de locataire Certification ?
body:
  options:
    - { id: a, text: { en: "Enable the setting and select Domain admins can enable/disable.", fr: "Activer le paramètre et sélectionner Domain admins can enable/disable." } }
    - { id: b, text: { en: "Enable the setting and list one security group per domain.", fr: "Activer le paramètre et indiquer un groupe de sécurité par domaine." } }
    - { id: c, text: { en: "Enable the setting and select Except specific security groups.", fr: "Activer le paramètre et sélectionner Except specific security groups." } }
    - { id: d, text: { en: "Enable the setting and enter a documentation URL for each domain.", fr: "Activer le paramètre et saisir une URL de documentation pour chaque domaine." } }
answer: { optionId: a }
explanation:
  correct:
    en: When Domain admins can enable/disable is selected, domain administrators can override the tenant-level certification settings for their domain, including who can certify. Each domain then manages its own certifiers without further work from the Fabric administrators.
    fr: Quand Domain admins can enable/disable est sélectionné, les administrateurs de domaine peuvent remplacer les paramètres de certification du locataire pour leur domaine, y compris la liste des certificateurs. Chaque domaine gère alors ses propres certificateurs sans travail supplémentaire des administrateurs Fabric.
  options:
    b: { en: "Tenant-level groups apply to the whole tenant: a member of the Finance group could certify HR items, and the Fabric administrators keep managing the list.", fr: "Les groupes définis au niveau du locataire s'appliquent à tout le locataire : un membre du groupe Finance pourrait certifier des éléments HR, et les administrateurs Fabric continuent de gérer la liste." }
    c: { en: "This option excludes subgroups from the authorized groups; it doesn't delegate anything to the domains.", fr: "Cette option exclut des sous-groupes des groupes autorisés ; elle ne délègue rien aux domaines." }
    d: { en: "The tenant setting has a single optional documentation URL, used as the Learn more link; it doesn't control who certifies.", fr: "Le paramètre de locataire a une seule URL de documentation facultative, utilisée comme lien En savoir plus ; elle ne contrôle pas qui certifie." }
references:
  - title: Enable item certification
    url: https://learn.microsoft.com/en-us/fabric/admin/endorsement-setup
  - title: Endorsement overview
    url: https://learn.microsoft.com/en-us/fabric/governance/endorsement-overview
