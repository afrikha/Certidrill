id: dp600-1b-pipeline-stage-statements
objective: "1.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You plan to create a deployment pipeline for the analytics team of Tailspin Toys.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer un pipeline de déploiement pour l'équipe d'analytique de Tailspin Toys.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can create the pipeline with six stages.
        fr: Vous pouvez créer le pipeline avec six étapes.
    - id: s2
      text:
        en: After you create the pipeline with three stages, you can add a fourth stage.
        fr: Après avoir créé le pipeline avec trois étapes, vous pouvez ajouter une quatrième étape.
    - id: s3
      text:
        en: By default, the final stage of the pipeline is public.
        fr: Par défaut, la dernière étape du pipeline est publique.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: A deployment pipeline has between 2 and 10 stages, three by default. The number of stages is fixed when the pipeline is created. The final stage is public by default, so consumers without pipeline access see it as a regular workspace.
    fr: |
      Un pipeline de déploiement compte entre 2 et 10 étapes, trois par défaut. Le nombre d'étapes est fixé à la création du pipeline. La dernière étape est publique par défaut : les consommateurs sans accès au pipeline la voient comme un espace de travail ordinaire.
references:
  - title: Get started using deployment pipelines, the Fabric Application lifecycle management (ALM) tool
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/get-started-with-deployment-pipelines
