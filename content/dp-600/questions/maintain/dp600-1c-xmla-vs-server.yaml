id: dp600-1c-xmla-vs-server
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Finance** that is assigned to a Fabric capacity whose XMLA Endpoint setting is set to **Read Write**. WS-Finance contains a warehouse named **WH-Finance**.

    You have a Visual Studio Analysis Services tabular project at the 1600 compatibility level. You have the Contributor role in WS-Finance.

    You need to deploy the project to WS-Finance as a new semantic model.

    To which value should you set the **Server** property of the project?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Finance**, attribué à une capacité Fabric dont le paramètre XMLA Endpoint est défini sur **Read Write**. WS-Finance contient un entrepôt nommé **WH-Finance**.

    Vous disposez d'un projet tabulaire Analysis Services Visual Studio au niveau de compatibilité 1600. Vous avez le rôle Contributor dans WS-Finance.

    Vous devez déployer le projet dans WS-Finance en tant que nouveau modèle sémantique.

    Sur quelle valeur devez-vous définir la propriété **Server** du projet ?
body:
  options:
    - { id: a, text: { en: "The SQL connection string of WH-Finance", fr: "La chaîne de connexion SQL de WH-Finance" } }
    - { id: b, text: { en: "The workspace connection of WS-Finance", fr: "La connexion d'espace de travail de WS-Finance" } }
    - { id: c, text: { en: "The URL of WS-Finance in the Fabric portal", fr: "L'URL de WS-Finance dans le portail Fabric" } }
    - { id: d, text: { en: "The name of the capacity of WS-Finance", fr: "Le nom de la capacité de WS-Finance" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The deployment server of a tabular project is the XMLA endpoint of the target workspace: the workspace connection, in the powerbi://api.powerbi.com/v1.0/... format, copied from the workspace settings. The model must be at the 1500 compatibility level or higher, which 1600 meets."
    fr: "Le serveur de déploiement d'un projet tabulaire est le point de terminaison XMLA de l'espace de travail cible : la connexion d'espace de travail, au format powerbi://api.powerbi.com/v1.0/..., copiée depuis les paramètres de l'espace de travail. Le modèle doit être au niveau de compatibilité 1500 ou supérieur, ce que 1600 respecte."
  options:
    a:
      en: "The SQL connection string accepts T-SQL for the warehouse; it isn't an Analysis Services endpoint that accepts model deployments."
      fr: "La chaîne de connexion SQL accepte du T-SQL pour l'entrepôt ; ce n'est pas un point de terminaison Analysis Services qui accepte des déploiements de modèles."
    c:
      en: "The portal URL opens the workspace in a browser; client tools need the powerbi:// workspace connection."
      fr: "L'URL du portail ouvre l'espace de travail dans un navigateur ; les outils clients ont besoin de la connexion d'espace de travail powerbi://."
    d:
      en: "The XMLA endpoint is exposed per workspace, not per capacity."
      fr: "Le point de terminaison XMLA est exposé par espace de travail, pas par capacité."
references:
  - title: Semantic model connectivity and management with the XMLA endpoint in Power BI
    url: https://learn.microsoft.com/en-us/fabric/enterprise/powerbi/service-premium-connect-tools
