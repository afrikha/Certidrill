id: dp600-cs4a-pbip-repository
objective: "1.2.2"
type: yesno_statements
caseStudy: dp600-cs4a-margies-travel
difficulty: 3
status: draft
stem:
  en: |
    Laura commits the Power BI Desktop project of SM-Campaigns to MT-BI. You need to evaluate whether the current configuration meets the sixth and seventh requirements for semantic models and reports.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  fr: |
    Laura valide le projet Power BI Desktop de SM-Campaigns dans MT-BI. Vous devez évaluer si la configuration actuelle satisfait les sixième et septième exigences relatives aux modèles sémantiques et aux rapports.

    Pour chacune des affirmations suivantes, sélectionnez Oui si l'affirmation est vraie. Sinon, sélectionnez Non.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "With the current .gitignore file, the local data cache of SM-Campaigns is excluded from the commits."
        fr: "Avec le fichier .gitignore actuel, le cache de données local de SM-Campaigns est exclu des validations."
    - id: s2
      text:
        en: "With the current .gitignore file, the Power Query changes that Laura saves by selecting Apply later are excluded from the commits."
        fr: "Avec le fichier .gitignore actuel, les modifications Power Query que Laura enregistre en sélectionnant Appliquer plus tard sont exclues des validations."
    - id: s3
      text:
        en: "If Laura applies the Confidential label to SM-Campaigns in Power BI Desktop, the label is saved in the project files that she commits."
        fr: "Si Laura applique l'étiquette Confidential à SM-Campaigns dans Power BI Desktop, l'étiquette est enregistrée dans les fichiers du projet qu'elle valide."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "The .gitignore file that Power BI Desktop creates excludes `.pbi/localSettings.json` and `.pbi/cache.abf`, the local cache of the model and its data, so the data is not committed. The Apply later changes are stored in `.pbi/unappliedChanges.json`, which Git includes by default: Laura must add it to .gitignore. Sensitivity labels are not supported in Power BI Desktop projects, so the label must be applied to SM-Campaigns in the Fabric workspace."
    fr: "Le fichier .gitignore créé par Power BI Desktop exclut `.pbi/localSettings.json` et `.pbi/cache.abf`, le cache local du modèle et de ses données : les données ne sont pas validées. Les modifications Appliquer plus tard sont stockées dans `.pbi/unappliedChanges.json`, que Git inclut par défaut : Laura doit l'ajouter au fichier .gitignore. Les étiquettes de confidentialité ne sont pas prises en charge dans les projets Power BI Desktop : l'étiquette doit être appliquée à SM-Campaigns dans l'espace de travail Fabric."
  options:
    s2: { en: "unappliedChanges.json is committed by default so that work in progress can be shared; it is excluded only if you add it to .gitignore.", fr: "unappliedChanges.json est validé par défaut pour permettre de partager le travail en cours ; il n'est exclu que si vous l'ajoutez au fichier .gitignore." }
    s3: { en: "The PBIP limitations list sensitivity labels as not supported.", fr: "Les limitations des projets PBIP indiquent que les étiquettes de confidentialité ne sont pas prises en charge." }
references:
  - title: Power BI Desktop projects
    url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-overview
  - title: Power BI Desktop project semantic model folder
    url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-dataset
