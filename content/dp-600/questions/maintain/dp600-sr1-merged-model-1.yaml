stem:
  en: User2 commits from the Source control pane.
  fr: User2 effectue une validation depuis le volet Contrôle de code source.
body:
  solution:
    en: |
      User2 opens the **Source control** pane of WS-Sales, selects the **Changes** tab, and then selects **Commit** with a comment.
    fr: |
      User2 ouvre le volet **Contrôle de code source** de WS-Sales, sélectionne l'onglet **Changes**, puis sélectionne **Commit** avec un commentaire.
answer: { value: false }
explanation:
  correct:
    en: |
      Commit copies changes from the workspace to the Git branch, the opposite direction of what is needed, and the workspace has no uncommitted changes. Moreover, commits are disabled while the branch contains updates that have not been pulled into the workspace.
    fr: |
      La validation (commit) copie les modifications de l'espace de travail vers la branche Git, soit le sens inverse de celui demandé, et l'espace de travail n'a aucune modification non validée. De plus, les validations sont désactivées tant que la branche contient des mises à jour qui n'ont pas été tirées dans l'espace de travail.
references:
  - title: Basic concepts in Git integration
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process
