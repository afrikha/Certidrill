id: dp600-1a-item-permission-statements
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Fabric workspace named **WS-Data** that contains a lakehouse named **LH-Ref** and a warehouse named **WH-Ref**. You manage access to these items by sharing them.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un espace de travail Fabric nommé **WS-Data** qui contient un lakehouse nommé **LH-Ref** et un entrepôt nommé **WH-Ref**. Vous gérez l'accès à ces éléments en les partageant.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A user with whom you share LH-Ref and select Read all with Apache Spark can write new files to LH-Ref from a notebook."
        fr: "Un utilisateur avec qui vous partagez LH-Ref en sélectionnant Read all with Apache Spark peut écrire de nouveaux fichiers dans LH-Ref depuis un notebook."
    - id: s2
      text:
        en: "After you remove a signed-in user's permission on WH-Ref, the user can keep access for up to two hours."
        fr: "Après le retrait de l'autorisation d'un utilisateur connecté sur WH-Ref, l'utilisateur peut conserver l'accès jusqu'à deux heures."
    - id: s3
      text:
        en: "You can share WH-Ref directly with a service principal from the sharing dialog."
        fr: "Vous pouvez partager WH-Ref directement avec un principal de service depuis la boîte de dialogue de partage."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Lakehouse sharing provides read permissions only; writing requires the Contributor role or higher. A permission removed from a signed-in user can take up to two hours to take effect. Sharing a warehouse directly with a service principal isn't supported."
    fr: "Le partage d'un lakehouse ne fournit que des autorisations de lecture ; écrire demande le rôle Contributor ou un rôle supérieur. Une autorisation retirée à un utilisateur connecté peut mettre jusqu'à deux heures à prendre effet. Le partage direct d'un entrepôt avec un principal de service n'est pas pris en charge."
references:
  - title: How lakehouse sharing works
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sharing
  - title: Share your data and manage permissions
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions
