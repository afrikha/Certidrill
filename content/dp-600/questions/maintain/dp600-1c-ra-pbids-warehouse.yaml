id: dp600-1c-ra-pbids-warehouse
objective: "1.2.6"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse named **WH-Sales**. Its SQL connection string is **abc123.datawarehouse.fabric.microsoft.com**.

    You need to create a Power BI data source (.pbids) file that report authors open to connect to WH-Sales in DirectQuery mode.

    How should you complete the file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé **WH-Sales**. Sa chaîne de connexion SQL est **abc123.datawarehouse.fabric.microsoft.com**.

    Vous devez créer un fichier de source de données Power BI (.pbids) que les auteurs de rapports ouvrent pour se connecter à WH-Sales en mode DirectQuery.

    Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "version": "0.1",
      "connections": [
        {
          "details": {
            "protocol": "[[proto]]",
            "address": {
              "server": "abc123.datawarehouse.fabric.microsoft.com",
              "database": "WH-Sales"
            }
          },
          "options": {},
          "mode": "[[mode]]"
        }
      ]
    }
  slots:
    - id: proto
      options:
        - { id: as, text: analysis-services }
        - { id: odata, text: odata }
        - { id: tds, text: tds }
        - { id: http, text: http }
    - id: mode
      options:
        - { id: import, text: Import }
        - { id: dq, text: DirectQuery }
        - { id: dual, text: Dual }
answer:
  values: { proto: tds, mode: dq }
explanation:
  correct:
    en: "The SQL connection string of a warehouse is a SQL Server (TDS) endpoint, so the connection uses the tds protocol with the server and database in address. The optional mode property accepts DirectQuery or Import; DirectQuery meets the requirement."
    fr: "La chaîne de connexion SQL d'un entrepôt est un point de terminaison SQL Server (TDS) : la connexion utilise donc le protocole tds avec le serveur et la base de données dans address. La propriété facultative mode accepte DirectQuery ou Import ; DirectQuery répond à l'exigence."
  options:
    as:
      en: "analysis-services connects to an Analysis Services server, not to a SQL endpoint."
      fr: "analysis-services se connecte à un serveur Analysis Services, pas à un point de terminaison SQL."
    odata:
      en: "odata expects the URL of an OData feed."
      fr: "odata attend l'URL d'un flux OData."
    http:
      en: "http is the Web connector and expects a URL."
      fr: "http correspond au connecteur Web et attend une URL."
    import:
      en: "Import copies the data into the model instead of querying the warehouse."
      fr: "Import copie les données dans le modèle au lieu d'interroger l'entrepôt."
    dual:
      en: "Dual is a table storage mode in a model; the mode of a .pbids file is DirectQuery or Import."
      fr: "Dual est un mode de stockage de table dans un modèle ; le mode d'un fichier .pbids est DirectQuery ou Import."
references:
  - title: Data sources in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-data-sources
