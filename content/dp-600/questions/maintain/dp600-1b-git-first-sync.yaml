id: dp600-1b-git-first-sync
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Finance that contains a warehouse, a lakehouse and four notebooks. You have the Admin role in Finance.

    You connect Finance to the main branch of an Azure DevOps repository. The folder that you select already contains item definitions committed months ago from another workspace. Fabric asks you which direction to sync.

    You need the branch to contain the current version of the Finance items. The items of Finance must not change.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Finance qui contient un entrepôt, un lakehouse et quatre notebooks. Vous avez le rôle Admin dans Finance.

    Vous connectez Finance à la branche main d'un référentiel Azure DevOps. Le dossier que vous sélectionnez contient déjà des définitions d'éléments validées il y a plusieurs mois depuis un autre espace de travail. Fabric vous demande dans quel sens synchroniser.

    Vous devez faire en sorte que la branche contienne la version actuelle des éléments de Finance. Les éléments de Finance ne doivent pas changer.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Select Update to sync from Git to the workspace.", fr: "Sélectionner la mise à jour (Update) pour synchroniser de Git vers l'espace de travail." } }
    - { id: b, text: { en: "Select Commit to sync from the workspace to Git.", fr: "Sélectionner la validation (Commit) pour synchroniser de l'espace de travail vers Git." } }
    - { id: c, text: { en: "Cancel, and branch out to a new workspace.", fr: "Annuler, puis créer une branche vers un nouvel espace de travail (Branch out)." } }
    - { id: d, text: { en: "Cancel, and enable Allow users with at least Contributor role to change Git branch.", fr: "Annuler, puis activer Allow users with at least Contributor role to change Git branch." } }
answer: { optionId: b }
explanation:
  correct:
    en: When both the workspace and the Git folder contain content at the first sync, you choose the direction. Commit exports all the supported workspace content and overwrites the content of the Git folder, which leaves the workspace unchanged.
    fr: "Quand l'espace de travail et le dossier Git contiennent tous deux du contenu à la première synchronisation, vous choisissez le sens. La validation (Commit) exporte tout le contenu pris en charge de l'espace de travail et écrase le contenu du dossier Git, sans modifier l'espace de travail."
  options:
    a: { en: "Update overwrites the workspace items with the old definitions from Git; the workspace content is lost.", fr: "La mise à jour écrase les éléments de l'espace de travail avec les anciennes définitions de Git ; le contenu de l'espace de travail est perdu." }
    c: { en: "Branching out creates another workspace from the branch; it doesn't put the Finance items into the branch.", fr: "Créer une branche vers un nouvel espace de travail crée un autre espace de travail à partir de la branche ; cela ne place pas les éléments de Finance dans la branche." }
    d: { en: "This setting controls who can switch branches; it doesn't choose the sync direction.", fr: "Ce paramètre contrôle qui peut changer de branche ; il ne choisit pas le sens de synchronisation." }
references:
  - title: Git integration process
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process
