id: dp600-1a-lbl-apply-locations
objective: "1.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has enabled sensitivity labels for Fabric. A data engineer named Noah is a Contributor in a workspace named **WS-Plant** that contains a warehouse named **WH-Quality**. Noah has a Power BI Pro license, and the **Internal** label is published to him.

    Noah must apply the Internal label to WH-Quality.

    Which two locations can Noah use?

    Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam a activé les étiquettes de confidentialité pour Fabric. Un ingénieur données nommé Noah est Contributor dans un espace de travail nommé **WS-Plant** qui contient un entrepôt nommé **WH-Quality**. Noah dispose d'une licence Power BI Pro, et l'étiquette **Internal** est publiée pour lui.

    Noah doit appliquer l'étiquette Internal à WH-Quality.

    Quels sont les deux emplacements que Noah peut utiliser ?

    Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The sensitivity indicator in the header of WH-Quality", fr: "L'indicateur de confidentialité dans l'en-tête de WH-Quality" } }
    - { id: b, text: { en: "The Manage permissions page of WH-Quality", fr: "La page Manage permissions de WH-Quality" } }
    - { id: c, text: { en: "The Manage access pane of WS-Plant", fr: "Le volet Manage access de WS-Plant" } }
    - { id: d, text: { en: "The sensitivity section of the WH-Quality settings", fr: "La section de confidentialité des paramètres de WH-Quality" } }
    - { id: e, text: { en: "The endorsement section of the WH-Quality settings", fr: "La section d'approbation des paramètres de WH-Quality" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "You apply a label to a Fabric item from the flyout menu that opens when you select the sensitivity indication in the item header, or from the sensitivity section of the item settings."
    fr: "Vous appliquez une étiquette à un élément Fabric depuis le menu volant qui s'ouvre quand vous sélectionnez l'indication de confidentialité dans l'en-tête de l'élément, ou depuis la section de confidentialité des paramètres de l'élément."
  options:
    b: { en: "Manage permissions controls who has access to the item.", fr: "Manage permissions contrôle qui a accès à l'élément." }
    c: { en: "Manage access assigns workspace roles.", fr: "Manage access attribue les rôles d'espace de travail." }
    e: { en: "Endorsement applies a Promoted, Certified or Master data badge, not a sensitivity label.", fr: "L'approbation applique un badge Promoted, Certified ou Master data, pas une étiquette de confidentialité." }
references:
  - title: Apply sensitivity labels to Fabric items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/apply-sensitivity-labels
