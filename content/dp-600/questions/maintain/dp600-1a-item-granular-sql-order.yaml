id: dp600-1a-item-granular-sql-order
objective: "1.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Fabric workspace named **WS-Retail** that contains a warehouse named **WH-Retail** with 25 tables. You are a Member of WS-Retail.

    An external auditor named Omar, who has no role in WS-Retail, must read only the `dbo.FactReturns` table with T-SQL. He must not see the other items of WS-Retail.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose d'un espace de travail Fabric nommé **WS-Retail** qui contient un entrepôt nommé **WH-Retail** comportant 25 tables. Vous êtes Member de WS-Retail.

    Un auditeur externe nommé Omar, qui n'a aucun rôle dans WS-Retail, doit lire en T-SQL uniquement la table `dbo.FactReturns`. Il ne doit pas voir les autres éléments de WS-Retail.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: share, text: { en: "Share WH-Retail with Omar without selecting any additional permission.", fr: "Partager WH-Retail avec Omar sans sélectionner d'autorisation supplémentaire." } }
    - { id: grant, text: { en: "Run GRANT SELECT ON OBJECT::dbo.FactReturns TO the account of Omar.", fr: "Exécuter GRANT SELECT ON OBJECT::dbo.FactReturns TO pour le compte d'Omar." } }
    - { id: readdata, text: { en: "Share WH-Retail with Omar and select Read all data using SQL.", fr: "Partager WH-Retail avec Omar en sélectionnant Read all data using SQL." } }
    - { id: viewer, text: { en: "Assign Omar the Viewer role in WS-Retail.", fr: "Attribuer à Omar le rôle Viewer dans WS-Retail." } }
    - { id: signin, text: { en: "Ask Omar to sign in again before he queries the table.", fr: "Demander à Omar de se reconnecter avant d'interroger la table." } }
    - { id: policy, text: { en: "Create a security policy on dbo.FactReturns.", fr: "Créer une stratégie de sécurité sur dbo.FactReturns." } }
answer:
  sequence: [ share, grant, signin ]
explanation:
  correct:
    en: "Sharing a warehouse with no additional permission grants Read, which lets Omar connect but read nothing, and only the shared item is visible to him. You then grant SELECT on the single table with T-SQL, which workspace Members can do. Permission changes can take time to propagate, and recipients should sign in again to see them in the SQL endpoint."
    fr: "Partager un entrepôt sans autorisation supplémentaire accorde Read, qui permet à Omar de se connecter sans rien lire, et seul l'élément partagé lui est visible. Vous accordez ensuite SELECT sur la seule table en T-SQL, ce que peuvent faire les Members de l'espace de travail. Les modifications d'autorisation peuvent mettre du temps à se propager, et les destinataires doivent se reconnecter pour les voir dans le point de terminaison SQL."
  options:
    readdata: { en: "Read all data using SQL (ReadData) gives read access to all 25 tables.", fr: "Read all data using SQL (ReadData) donne un accès en lecture aux 25 tables." }
    viewer: { en: "Viewer exposes every item of the workspace and includes ReadData on the warehouse.", fr: "Viewer expose tous les éléments de l'espace de travail et inclut ReadData sur l'entrepôt." }
    policy: { en: "A security policy filters rows of a table; it doesn't grant access to the table.", fr: "Une stratégie de sécurité filtre les lignes d'une table ; elle n'accorde pas l'accès à la table." }
references:
  - title: Share your data and manage permissions
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions
  - title: Workspace roles in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/workspace-roles
