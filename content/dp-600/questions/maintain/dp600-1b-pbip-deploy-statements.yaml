id: dp600-1b-pbip-deploy-statements
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Power BI project named Orders that contains a report and an Import mode semantic model. The project is stored in a GitHub repository and on your computer, where the local data cache exists.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un projet Power BI nommé Orders qui contient un rapport et un modèle sémantique en mode Import. Le projet est stocké dans un référentiel GitHub et sur votre ordinateur, où le cache de données local existe.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When you publish Orders from Power BI Desktop, the local data cache is deployed with the metadata.
        fr: Quand vous publiez Orders depuis Power BI Desktop, le cache de données local est déployé avec les métadonnées.
    - id: s2
      text:
        en: When a Fabric workspace connected to the repository is updated from Git, the semantic model of Orders contains the data of your local cache.
        fr: Quand un espace de travail Fabric connecté au référentiel est mis à jour depuis Git, le modèle sémantique d'Orders contient les données de votre cache local.
    - id: s3
      text:
        en: Long object names in Orders can make a save fail because of the default Windows maximum path length.
        fr: Des noms d'objets longs dans Orders peuvent faire échouer un enregistrement à cause de la longueur de chemin maximale par défaut de Windows.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Publish in Power BI Desktop deploys the metadata and the local data cache. Other deployment methods, such as Fabric Git integration and the Fabric REST APIs, deploy only the metadata, so the model must be refreshed. On Windows, the default 260-character path limit can be exceeded by long object names, which is why a short root folder is recommended.
    fr: |
      Publier dans Power BI Desktop déploie les métadonnées et le cache de données local. Les autres méthodes de déploiement, comme l'intégration Git de Fabric et les API REST Fabric, ne déploient que les métadonnées, et le modèle doit alors être actualisé. Sous Windows, la limite par défaut de 260 caractères par chemin peut être dépassée par des noms d'objets longs : il est donc recommandé d'utiliser un dossier racine court.
references:
  - title: Power BI Desktop projects (PBIP)
    url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-overview
