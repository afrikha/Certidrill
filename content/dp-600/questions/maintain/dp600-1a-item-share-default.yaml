id: dp600-1a-item-share-default
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Fabric workspace named **WS-Sales** that contains a lakehouse named **LH-Orders**. A user named Hana has no role in WS-Sales.

    You share LH-Orders with Hana by using the Specific people option. You don't select any additional permission.

    What can Hana do?
  fr: |
    Contoso dispose d'un espace de travail Fabric nommé **WS-Sales** qui contient un lakehouse nommé **LH-Orders**. Une utilisatrice nommée Hana n'a aucun rôle dans WS-Sales.

    Vous partagez LH-Orders avec Hana à l'aide de l'option Specific people. Vous ne sélectionnez aucune autorisation supplémentaire.

    Que peut faire Hana ?
body:
  options:
    - { id: a, text: { en: "Query every table of LH-Orders with T-SQL through its SQL analytics endpoint", fr: "Interroger toutes les tables de LH-Orders en T-SQL par son point de terminaison d'analytique SQL" } }
    - { id: b, text: { en: "Open LH-Orders and connect to its SQL analytics endpoint, without reading any table", fr: "Ouvrir LH-Orders et se connecter à son point de terminaison d'analytique SQL, sans lire aucune table" } }
    - { id: c, text: { en: "Read the Delta files of LH-Orders from a Spark notebook in another workspace", fr: "Lire les fichiers Delta de LH-Orders depuis un notebook Spark d'un autre espace de travail" } }
    - { id: d, text: { en: "Open LH-Orders and every other item of WS-Sales in read-only mode", fr: "Ouvrir LH-Orders et tous les autres éléments de WS-Sales en lecture seule" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Sharing always grants the Read permission. Read lets the recipient find and open the item and connect to the SQL analytics endpoint, but it gives no access to the tables until you add ReadData, ReadAll or T-SQL object permissions."
    fr: "Le partage accorde toujours l'autorisation Read. Read permet au destinataire de trouver et d'ouvrir l'élément et de se connecter au point de terminaison d'analytique SQL, mais ne donne aucun accès aux tables tant que vous n'ajoutez pas ReadData, ReadAll ou des autorisations T-SQL sur les objets."
  options:
    a: { en: "Querying all tables requires Read all with SQL analytics endpoint (ReadData).", fr: "Interroger toutes les tables demande Read all with SQL analytics endpoint (ReadData)." }
    c: { en: "Reading files with Spark requires Read all with Apache Spark (ReadAll).", fr: "Lire les fichiers avec Spark demande Read all with Apache Spark (ReadAll)." }
    d: { en: "Sharing gives access to the shared item only; the recipient doesn't see the other items of the workspace.", fr: "Le partage ne donne accès qu'à l'élément partagé ; le destinataire ne voit pas les autres éléments de l'espace de travail." }
references:
  - title: Share items in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/share-items
  - title: How lakehouse sharing works
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sharing
