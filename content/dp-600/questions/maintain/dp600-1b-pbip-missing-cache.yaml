id: dp600-1b-pbip-missing-cache
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer saves a Power BI project named Sales in a local Git repository and pushes it to GitHub. The repository uses the .gitignore file that Power BI Desktop created.

    A colleague clones the repository on another computer and opens Sales.pbip in Power BI Desktop.

    What happens?
  fr: |
    Un développeur enregistre un projet Power BI nommé Sales dans un référentiel Git local et le pousse vers GitHub. Le référentiel utilise le fichier .gitignore créé par Power BI Desktop.

    Un collègue clone le référentiel sur un autre ordinateur et ouvre Sales.pbip dans Power BI Desktop.

    Que se passe-t-il ?
body:
  options:
    - { id: a, text: { en: "The project fails to open because the data cache is missing.", fr: "Le projet ne s'ouvre pas, car le cache de données est absent." } }
    - { id: b, text: { en: "The report and model open without data until the model is refreshed.", fr: "Le rapport et le modèle s'ouvrent sans données jusqu'à l'actualisation du modèle." } }
    - { id: c, text: { en: "The report opens in read-only mode with a live connection.", fr: "Le rapport s'ouvre en lecture seule avec une connexion active." } }
    - { id: d, text: { en: "The report and model open with the data of the last commit.", fr: "Le rapport et le modèle s'ouvrent avec les données de la dernière validation." } }
answer: { optionId: b }
explanation:
  correct:
    en: The default .gitignore excludes .pbi/cache.abf, the local data cache of the semantic model. Power BI Desktop can open a project without this file, but the model then has no data until it is refreshed.
    fr: Le .gitignore par défaut exclut .pbi/cache.abf, le cache de données local du modèle sémantique. Power BI Desktop peut ouvrir un projet sans ce fichier, mais le modèle n'a alors aucune donnée jusqu'à son actualisation.
  options:
    a: { en: "The cache is optional; Desktop opens the project from the metadata files.", fr: "Le cache est facultatif ; Desktop ouvre le projet à partir des fichiers de métadonnées." }
    c: { en: "A live connection is used only when definition.pbir references a published model by connection; here the model folder is part of the project.", fr: "Une connexion active n'est utilisée que si definition.pbir référence un modèle publié par connexion ; ici, le dossier du modèle fait partie du projet." }
    d: { en: "Git stores the definitions only; the data cache was never committed.", fr: "Git ne stocke que les définitions ; le cache de données n'a jamais été validé." }
references:
  - title: Power BI Desktop project semantic model folder
    url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-dataset
