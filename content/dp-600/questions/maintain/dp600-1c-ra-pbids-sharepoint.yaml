id: dp600-1c-ra-pbids-sharepoint
objective: "1.2.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin stores inventory data in two SharePoint lists, **Stock** and **Suppliers**, on the site **https://tailspin.sharepoint.com/sites/Inventory**. The Stock list opens at https://tailspin.sharepoint.com/sites/Inventory/Lists/Stock/AllItems.aspx.

    You need to create a Power BI data source (.pbids) file. When report authors open it, they must be able to select both lists, each of which becomes a table in their model.

    How should you complete the file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin stocke ses données d'inventaire dans deux listes SharePoint, **Stock** et **Suppliers**, sur le site **https://tailspin.sharepoint.com/sites/Inventory**. La liste Stock s'ouvre à l'adresse https://tailspin.sharepoint.com/sites/Inventory/Lists/Stock/AllItems.aspx.

    Vous devez créer un fichier de source de données Power BI (.pbids). Quand les auteurs de rapports l'ouvrent, ils doivent pouvoir sélectionner les deux listes, chacune devenant une table de leur modèle.

    Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "version": "0.1",
      "connections": [
        {
          "details": {
            "protocol": "[[proto]]",
            "address": {
              "url": "[[url]]"
            }
          }
        }
      ]
    }
  slots:
    - id: proto
      options:
        - { id: http, text: http }
        - { id: splist, text: sharepoint-list }
        - { id: folder, text: folder }
        - { id: file, text: file }
    - id: url
      options:
        - { id: site, text: "https://tailspin.sharepoint.com/sites/Inventory" }
        - { id: list, text: "https://tailspin.sharepoint.com/sites/Inventory/Lists/Stock" }
        - { id: view, text: "https://tailspin.sharepoint.com/sites/Inventory/Lists/Stock/AllItems.aspx" }
answer:
  values: { proto: splist, url: site }
explanation:
  correct:
    en: "The sharepoint-list protocol connects to SharePoint lists. Its URL must point to the SharePoint site itself, not to a list within the site; the Navigator then lets the authors select one or more lists, and each list becomes a table."
    fr: "Le protocole sharepoint-list se connecte à des listes SharePoint. Son URL doit désigner le site SharePoint lui-même, et non une liste du site ; le Navigateur permet ensuite aux auteurs de sélectionner une ou plusieurs listes, et chaque liste devient une table."
  options:
    http:
      en: "http is the Web connector; it reads a web page or file, not SharePoint lists."
      fr: "http correspond au connecteur Web ; il lit une page web ou un fichier, pas des listes SharePoint."
    folder:
      en: "folder reads the files of a file system folder and expects a path, not a URL."
      fr: "folder lit les fichiers d'un dossier du système de fichiers et attend un chemin, pas une URL."
    file:
      en: "file reads a single text file and expects a path, not a SharePoint site."
      fr: "file lit un seul fichier texte et attend un chemin, pas un site SharePoint."
    list:
      en: "The URL must be the site, not a list; pointing at Stock wouldn't let the authors select Suppliers."
      fr: "L'URL doit être celle du site, pas d'une liste ; désigner Stock ne permettrait pas aux auteurs de sélectionner Suppliers."
    view:
      en: "A list view URL points inside one list, not to the site."
      fr: "L'URL d'une vue de liste désigne l'intérieur d'une liste, pas le site."
references:
  - title: Data sources in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-data-sources
