id: dp600-1c-xmla-write-tools
objective: "1.2.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a semantic model named **SM-HR** in a Fabric workspace whose capacity has the XMLA Endpoint setting set to **Read Write**. You have the Contributor role in the workspace.

    You need to add a measure to SM-HR directly in the service through the XMLA endpoint, without republishing the model from Power BI Desktop.

    Which two tools can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique nommé **SM-HR** dans un espace de travail Fabric dont la capacité a le paramètre XMLA Endpoint défini sur **Read Write**. Vous avez le rôle Contributor dans l'espace de travail.

    Vous devez ajouter une mesure à SM-HR directement dans le service par le point de terminaison XMLA, sans republier le modèle depuis Power BI Desktop.

    Quels sont les deux outils que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: DAX Studio }
    - { id: b, text: Tabular Editor }
    - { id: c, text: Microsoft Excel }
    - { id: d, text: SQL Server Management Studio }
    - { id: e, text: SQL Server Profiler }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Tabular Editor reads and writes model metadata through a read-write XMLA endpoint, so you can add the measure and save it to the service. SQL Server Management Studio can run a TMSL script that changes the model metadata."
    fr: "Tabular Editor lit et écrit les métadonnées du modèle par un point de terminaison XMLA en lecture-écriture : vous pouvez ajouter la mesure et l'enregistrer dans le service. SQL Server Management Studio peut exécuter un script TMSL qui modifie les métadonnées du modèle."
  options:
    a:
      en: "DAX Studio is read-only through the XMLA endpoint: it queries, traces and analyzes performance."
      fr: "DAX Studio est en lecture seule par le point de terminaison XMLA : il interroge, trace et analyse les performances."
    c:
      en: "Excel connects in read-only mode to build PivotTables; it can't change the model."
      fr: "Excel se connecte en lecture seule pour créer des tableaux croisés dynamiques ; il ne peut pas modifier le modèle."
    e:
      en: "SQL Server Profiler captures trace events; it doesn't change metadata."
      fr: "SQL Server Profiler capture des événements de trace ; il ne modifie pas les métadonnées."
references:
  - title: Semantic model connectivity and management with the XMLA endpoint in Power BI
    url: https://learn.microsoft.com/en-us/fabric/enterprise/powerbi/service-premium-connect-tools
