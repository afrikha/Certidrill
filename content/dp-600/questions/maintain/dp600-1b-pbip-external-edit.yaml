id: dp600-1b-pbip-external-edit
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Power BI project named Finance open in Power BI Desktop, and you have saved all your changes. In Visual Studio Code, you edit a measure in a TMDL file of the Finance.SemanticModel\definition folder and save the file.

    You need Power BI Desktop to use the edited measure. The solution must minimize effort.

    What should you do?
  fr: |
    Vous avez un projet Power BI nommé Finance ouvert dans Power BI Desktop, et vous avez enregistré toutes vos modifications. Dans Visual Studio Code, vous modifiez une mesure dans un fichier TMDL du dossier Finance.SemanticModel\definition et enregistrez le fichier.

    Vous devez faire en sorte que Power BI Desktop utilise la mesure modifiée. La solution doit réduire l'effort au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Select Refresh on the Home ribbon of Power BI Desktop.", fr: "Sélectionner Actualiser dans le ruban Accueil de Power BI Desktop." } }
    - { id: b, text: { en: "Publish the project, and then download it from the service.", fr: "Publier le projet, puis le télécharger depuis le service." } }
    - { id: c, text: { en: "Select Apply external changes in the banner of Power BI Desktop.", fr: "Sélectionner Apply external changes dans la bannière de Power BI Desktop." } }
    - { id: d, text: { en: "Save the project as a .pbix file, and then save it again as a .pbip project.", fr: "Enregistrer le projet en fichier .pbix, puis de nouveau en projet .pbip." } }
answer: { optionId: c }
explanation:
  correct:
    en: Power BI Desktop detects the external changes saved to the project files and shows an Apply external changes banner. Selecting it reloads the model without reopening the project.
    fr: Power BI Desktop détecte les modifications externes enregistrées dans les fichiers du projet et affiche une bannière Apply external changes. La sélectionner recharge le modèle sans rouvrir le projet.
  options:
    a: { en: "Refresh reloads data from the sources; it doesn't load metadata changes made in the files.", fr: "Actualiser recharge les données depuis les sources ; cela ne charge pas les modifications de métadonnées faites dans les fichiers." }
    b: { en: "Publishing uploads the version open in Desktop, without your external edit, and adds unnecessary steps.", fr: "La publication charge la version ouverte dans Desktop, sans votre modification externe, et ajoute des étapes inutiles." }
    d: { en: "Saving again writes the model held in memory by Desktop, which would overwrite your external edit.", fr: "Enregistrer de nouveau écrit le modèle que Desktop a en mémoire, ce qui écraserait votre modification externe." }
references:
  - title: Power BI Desktop project semantic model folder
    url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-dataset
