id: dp600-1b-git-commit-disabled
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Dev that is connected to the main branch of a GitHub repository. You have the Contributor role in Dev and the permissions required to commit to main.

    You modify a notebook named NB-Clean in Dev. Meanwhile, a colleague merges a pull request into main that changes a report named Sales. In the Source control pane, NB-Clean shows uncommitted changes, Sales shows Update required, and Commit is disabled.

    You need to commit your changes to NB-Clean without losing your colleague's changes.

    What should you do first?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Dev connecté à la branche main d'un référentiel GitHub. Vous avez le rôle Contributor dans Dev et les autorisations nécessaires pour valider dans main.

    Vous modifiez un notebook nommé NB-Clean dans Dev. Pendant ce temps, un collègue fusionne dans main une demande de tirage qui modifie un rapport nommé Sales. Dans le volet Contrôle de code source, NB-Clean affiche des modifications non validées, Sales affiche Update required et la validation (Commit) est désactivée.

    Vous devez valider vos modifications de NB-Clean sans perdre les modifications de votre collègue.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Select Undo on NB-Clean.", fr: "Sélectionner Undo sur NB-Clean." } }
    - { id: b, text: { en: "Disconnect Dev from Git and reconnect it.", fr: "Déconnecter Dev de Git puis le reconnecter." } }
    - { id: c, text: { en: "Select Update all in the Source control pane.", fr: "Sélectionner Update all dans le volet Contrôle de code source." } }
    - { id: d, text: { en: "Check out a new branch from the Source control pane.", fr: "Extraire une nouvelle branche (Checkout new branch) depuis le volet Contrôle de code source." } }
answer: { optionId: c }
explanation:
  correct:
    en: Commit is disabled while the connected branch has changes that the workspace hasn't received. Because the two changes concern different items, there is no conflict; Update all brings the changes of Sales into the workspace, keeps the uncommitted changes of NB-Clean, and then Commit becomes available.
    fr: La validation est désactivée tant que la branche connectée contient des modifications que l'espace de travail n'a pas reçues. Comme les deux modifications portent sur des éléments différents, il n'y a pas de conflit ; Update all apporte les modifications de Sales dans l'espace de travail, conserve les modifications non validées de NB-Clean, puis la validation redevient disponible.
  options:
    a: { en: "Undo discards your changes to NB-Clean, which defeats the goal.", fr: "Undo abandonne vos modifications de NB-Clean, ce qui va à l'encontre de l'objectif." }
    b: { en: "Disconnecting is reserved to workspace Admins, and reconnecting forces a sync direction that overwrites one side entirely.", fr: "La déconnexion est réservée aux Admins de l'espace de travail, et la reconnexion impose un sens de synchronisation qui écrase entièrement un côté." }
    d: { en: "Checking out a new branch is a workspace Admin operation by default and changes the branch of the shared workspace instead of committing to main.", fr: "Extraire une nouvelle branche est par défaut une opération d'Admin de l'espace de travail et change la branche de l'espace de travail partagé au lieu de valider dans main." }
references:
  - title: Git integration process
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process
  - title: Get started with Git integration
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-get-started
