id: dp600-sr2-sales-tables-access-3
objective: "1.1.2"
type: series_yesno
series: dp600-sr2-sales-tables-access
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You assign Auditor1 the Viewer role in Finance-WS.
  fr: Vous attribuez à Auditor1 le rôle Viewer dans Finance-WS.
body:
  solution:
    en: You add Auditor1 to **Finance-WS** and assign the **Viewer** workspace role.
    fr: Vous ajoutez Auditor1 à **Finance-WS** et lui attribuez le rôle d'espace de travail **Viewer**.
answer: { value: false }
explanation:
  correct:
    en: A workspace role applies to every item of the workspace, so Auditor1 could open LH-Ledger, the semantic models and the reports. Viewer also grants CONNECT and ReadData on every warehouse and SQL analytics endpoint of the workspace, so Auditor1 could read all 14 tables of WH-Finance.
    fr: "Un rôle d'espace de travail s'applique à tous les éléments de l'espace de travail : Auditor1 pourrait ouvrir LH-Ledger, les modèles sémantiques et les rapports. Viewer accorde aussi CONNECT et ReadData sur chaque entrepôt et point de terminaison d'analytique SQL de l'espace de travail : Auditor1 pourrait lire les 14 tables de WH-Finance."
references:
  - title: Workspace roles in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/workspace-roles
