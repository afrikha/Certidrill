id: dp600-1c-ia-data-source
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Finance**. In the lineage view of WS-Finance, an Azure SQL Database data source named **sql-fin/LedgerDB** feeds three semantic models of the workspace. Reports in WS-Finance and in two other workspaces are built on those semantic models. You have the Contributor role in WS-Finance.

    The database administrators plan to drop a view in LedgerDB. You run impact analysis on the data source card. The pane lists only the three semantic models.

    You need to identify all the reports that might be affected. The solution must minimize effort.

    What should you do next?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Finance**. Dans la vue de traçabilité de WS-Finance, une source de données Azure SQL Database nommée **sql-fin/LedgerDB** alimente trois modèles sémantiques de l'espace de travail. Des rapports de WS-Finance et de deux autres espaces de travail reposent sur ces modèles sémantiques. Vous avez le rôle Contributor dans WS-Finance.

    Les administrateurs de bases de données prévoient de supprimer une vue de LedgerDB. Vous lancez une analyse d'impact sur la carte de la source de données. Le volet ne liste que les trois modèles sémantiques.

    Vous devez identifier tous les rapports susceptibles d'être affectés. La solution doit réduire l'effort au minimum.

    Que devez-vous faire ensuite ?
body:
  options:
    - { id: a, text: { en: "Select the All downstream items tab in the data source pane.", fr: "Sélectionner l'onglet Tous les éléments en aval dans le volet de la source de données." } }
    - { id: b, text: { en: "Run impact analysis on each of the three semantic models.", fr: "Lancer une analyse d'impact sur chacun des trois modèles sémantiques." } }
    - { id: c, text: { en: "Ask for the Contributor role in the two other workspaces.", fr: "Demander le rôle Contributor dans les deux autres espaces de travail." } }
    - { id: d, text: { en: "Select Browse by workspace in the data source pane.", fr: "Sélectionner Parcourir par espace de travail dans le volet de la source de données." } }
answer: { optionId: b }
explanation:
  correct:
    en: "For a data source, impact analysis shows only the direct child items, together with the connection string. To go further downstream, you run impact analysis on the direct children, here the three semantic models, whose All downstream items tab lists the reports in every workspace."
    fr: "Pour une source de données, l'analyse d'impact n'affiche que les éléments enfants directs, avec la chaîne de connexion. Pour aller plus loin en aval, vous lancez l'analyse d'impact sur les enfants directs, ici les trois modèles sémantiques, dont l'onglet Tous les éléments en aval liste les rapports de tous les espaces de travail."
  options:
    a:
      en: "Data sources show direct child items only, so the pane of the data source never lists the reports built on the models."
      fr: "Les sources de données n'affichent que les éléments enfants directs : le volet de la source ne liste donc jamais les rapports qui reposent sur les modèles."
    c:
      en: "Impact analysis already reports items in workspaces you can't access; a role there neither shows the reports in the data source pane nor minimizes effort."
      fr: "L'analyse d'impact signale déjà les éléments des espaces de travail auxquels vous n'avez pas accès ; un rôle dans ces espaces n'affiche pas les rapports dans le volet de la source et ne réduit pas l'effort."
    d:
      en: "Browsing by workspace only regroups the items already listed, which are the three semantic models."
      fr: "Parcourir par espace de travail ne fait que regrouper les éléments déjà listés, c'est-à-dire les trois modèles sémantiques."
references:
  - title: Impact analysis
    url: https://learn.microsoft.com/en-us/fabric/governance/impact-analysis
