id: dp600-1c-ia-lineage-scope
objective: "1.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have the Fabric workspaces shown in the following table.

    | Workspace | Content |
    | --- | --- |
    | WS-Core | A lakehouse named LH-Core |
    | WS-Sales | A semantic model named SM-Sales that imports data from LH-Core and from an Azure SQL database |
    | WS-West | Reports that are built on SM-Sales |

    A user named User1 has the Viewer role in WS-Sales.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez des espaces de travail Fabric indiqués dans le tableau suivant.

    | Espace de travail | Contenu |
    | --- | --- |
    | WS-Core | Un lakehouse nommé LH-Core |
    | WS-Sales | Un modèle sémantique nommé SM-Sales qui importe des données depuis LH-Core et depuis une base de données Azure SQL |
    | WS-West | Des rapports qui reposent sur SM-Sales |

    Un utilisateur nommé User1 a le rôle Viewer dans WS-Sales.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In the lineage view of WS-Sales, the card of LH-Core shows the name of WS-Core.
        fr: Dans la vue de traçabilité de WS-Sales, la carte de LH-Core affiche le nom de WS-Core.
    - id: s2
      text:
        en: In the lineage view of WS-Sales, the reports of WS-West appear downstream of SM-Sales.
        fr: Dans la vue de traçabilité de WS-Sales, les rapports de WS-West apparaissent en aval de SM-Sales.
    - id: s3
      text:
        en: When User1 opens the lineage view of WS-Sales, User1 sees the card of the Azure SQL database data source.
        fr: Quand User1 ouvre la vue de traçabilité de WS-Sales, User1 voit la carte de la source de données Azure SQL Database.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "The lineage view of a workspace shows upstream items from other workspaces one level up, and their cards show the name of their workspace, so LH-Core appears with WS-Core. Downstream items in other workspaces aren't shown; impact analysis of SM-Sales is needed to find the reports of WS-West. Users with the Viewer role can open the lineage view but don't see data sources."
    fr: "La vue de traçabilité d'un espace de travail montre les éléments en amont des autres espaces de travail sur un niveau, et leurs cartes affichent le nom de leur espace de travail : LH-Core apparaît donc avec WS-Core. Les éléments en aval situés dans d'autres espaces de travail ne sont pas affichés ; il faut l'analyse d'impact de SM-Sales pour trouver les rapports de WS-West. Les utilisateurs qui ont le rôle Viewer peuvent ouvrir la vue de traçabilité, mais ne voient pas les sources de données."
references:
  - title: Lineage in Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/lineage
