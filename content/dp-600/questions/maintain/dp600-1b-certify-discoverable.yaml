id: dp600-1b-certify-discoverable
objective: "1.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Sales that contains a semantic model named SM-Revenue. Certification is disabled in your Fabric tenant. The discoverability tenant settings are already enabled for all users.

    A data steward named User1 has the Member role in Sales and belongs to a security group named Stewards. User1 has reviewed SM-Revenue against the organization's standards.

    You need to certify SM-Revenue and make it discoverable to users who don't have access to it.

    Which four actions should be performed in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Sales qui contient un modèle sémantique nommé SM-Revenue. La certification est désactivée dans votre locataire Fabric. Les paramètres de locataire de détectabilité sont déjà activés pour tous les utilisateurs.

    Un responsable des données nommé User1 a le rôle Member dans Sales et appartient à un groupe de sécurité nommé Stewards. User1 a examiné SM-Revenue selon les normes de l'organisation.

    Vous devez certifier SM-Revenue et le rendre détectable par les utilisateurs qui n'y ont pas accès.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: enable, text: { en: "As a Fabric administrator, enable the Certification tenant setting for Stewards.", fr: "En tant qu'administrateur Fabric, activer le paramètre de locataire Certification pour Stewards." } }
    - { id: open, text: { en: "As User1, open the settings of SM-Revenue, expand Endorsement and select Certified.", fr: "En tant que User1, ouvrir les paramètres de SM-Revenue, développer Endorsement et sélectionner Certified." } }
    - { id: disc, text: { en: "As User1, select Make discoverable.", fr: "En tant que User1, sélectionner Make discoverable." } }
    - { id: apply, text: { en: "As User1, select Apply.", fr: "En tant que User1, sélectionner Apply." } }
    - { id: promote, text: { en: "As User1, promote SM-Revenue and select Apply.", fr: "En tant que User1, promouvoir SM-Revenue et sélectionner Apply." } }
    - { id: build, text: { en: "Grant the Build permission on SM-Revenue to all users.", fr: "Accorder l'autorisation Build sur SM-Revenue à tous les utilisateurs." } }
    - { id: master, text: { en: "As a Fabric administrator, enable the Endorse master data tenant setting for Stewards.", fr: "En tant qu'administrateur Fabric, activer le paramètre de locataire Endorse master data pour Stewards." } }
answer:
  sequence: [ enable, open, disc, apply ]
explanation:
  correct:
    en: Certification must first be enabled by a Fabric administrator for the security groups whose members can certify. User1 then selects Certified in the endorsement settings; for a semantic model, the Make discoverable checkbox is available once the model is certified or promoted and the user has the Admin or Member role, and Apply saves both settings.
    fr: La certification doit d'abord être activée par un administrateur Fabric pour les groupes de sécurité dont les membres peuvent certifier. User1 sélectionne ensuite Certified dans les paramètres d'approbation ; pour un modèle sémantique, la case Make discoverable est disponible une fois le modèle certifié ou promu et si l'utilisateur a le rôle Admin ou Member, et Apply enregistre les deux paramètres.
  options:
    promote: { en: "Promotion isn't a prerequisite of certification: an authorized user can certify the model directly.", fr: "La promotion n'est pas un prérequis de la certification : un utilisateur autorisé peut certifier le modèle directement." }
    build: { en: "Discoverability exists so that users without access can find the model and request access; granting Build to all users isn't required.", fr: "La détectabilité permet justement aux utilisateurs sans accès de trouver le modèle et d'en demander l'accès ; accorder Build à tous n'est pas nécessaire." }
    master: { en: "Master data is a different badge; the requirement is certification.", fr: "Master data est un autre badge ; l'exigence porte sur la certification." }
references:
  - title: Endorse Fabric and Power BI items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/endorsement-promote-certify
  - title: Semantic model discoverability
    url: https://learn.microsoft.com/en-us/power-bi/collaborate-share/service-discovery
