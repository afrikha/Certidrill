id: dp600-1b-git-connect-role
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Analytics on a Fabric capacity. The Users can synchronize workspace items with their Git repositories tenant setting is enabled. User1 has the Member role in Analytics and the Contribute permission on an Azure DevOps repository named Repo1.

    User1 must connect Analytics to the main branch of Repo1, but the option to connect is unavailable to User1. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Analytics sur une capacité Fabric. Le paramètre de locataire Users can synchronize workspace items with their Git repositories est activé. User1 a le rôle Member dans Analytics et l'autorisation Contribute sur un référentiel Azure DevOps nommé Repo1.

    User1 doit connecter Analytics à la branche main de Repo1, mais l'option de connexion n'est pas disponible pour User1. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable Allow users with at least Contributor role to change Git branch in Analytics.", fr: "Activer Allow users with at least Contributor role to change Git branch dans Analytics." } }
    - { id: b, text: { en: "Grant User1 the Create branch permission on Repo1.", fr: "Accorder à User1 l'autorisation Create branch sur Repo1." } }
    - { id: c, text: { en: "Assign User1 the Fabric administrator role.", fr: "Attribuer à User1 le rôle d'administrateur Fabric." } }
    - { id: d, text: { en: "Assign User1 the Admin role in Analytics.", fr: "Attribuer à User1 le rôle Admin dans Analytics." } }
answer: { optionId: d }
explanation:
  correct:
    en: Only a workspace Admin can connect a workspace to a Git repository or disconnect it. After the connection, users with the Contributor role or higher can commit and update according to their Git permissions.
    fr: Seul un Admin de l'espace de travail peut connecter un espace de travail à un référentiel Git ou le déconnecter. Après la connexion, les utilisateurs qui ont le rôle Contributor ou supérieur peuvent valider et mettre à jour selon leurs autorisations Git.
  options:
    a: { en: "This setting lets Members and Contributors switch or create branches on a workspace that is already connected; connecting stays Admin-only.", fr: "Ce paramètre permet aux Members et Contributors de changer ou de créer des branches dans un espace de travail déjà connecté ; la connexion reste réservée à l'Admin." }
    b: { en: "The missing permission is on the workspace side; connecting only needs Read on the repository, which User1 already has.", fr: "L'autorisation manquante se situe côté espace de travail ; la connexion ne demande que Read sur le référentiel, que User1 possède déjà." }
    c: { en: "A tenant-wide administrator role grants far more than needed and doesn't replace the workspace Admin role.", fr: "Un rôle d'administrateur de tout le locataire accorde bien plus que nécessaire et ne remplace pas le rôle Admin de l'espace de travail." }
references:
  - title: Git integration process
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process
