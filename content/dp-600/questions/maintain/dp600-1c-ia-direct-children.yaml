id: dp600-1c-ia-direct-children
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Prep** that contains a dataflow named **DF-Customers**. Semantic models in several workspaces import data from DF-Customers, and many reports are built on those semantic models. You have the Contributor role in WS-Prep.

    You plan to rename an output column of DF-Customers. You need to list only the items that read directly from DF-Customers, grouped by the workspace that contains them.

    What should you do in the impact analysis pane of DF-Customers?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Prep** qui contient un flux de données nommé **DF-Customers**. Des modèles sémantiques de plusieurs espaces de travail importent des données depuis DF-Customers, et de nombreux rapports reposent sur ces modèles sémantiques. Vous avez le rôle Contributor dans WS-Prep.

    Vous prévoyez de renommer une colonne de sortie de DF-Customers. Vous devez lister uniquement les éléments qui lisent directement DF-Customers, regroupés par l'espace de travail qui les contient.

    Que devez-vous faire dans le volet d'analyse d'impact de DF-Customers ?
body:
  options:
    - { id: a, text: { en: "Select the All downstream items tab, and then select Browse by workspace.", fr: "Sélectionner l'onglet Tous les éléments en aval, puis Parcourir par espace de travail." } }
    - { id: b, text: { en: "Select the Child items tab, and then select Browse by item type.", fr: "Sélectionner l'onglet Éléments enfants, puis Parcourir par type d'élément." } }
    - { id: c, text: { en: "Select the All downstream items tab, and then select Browse by item type.", fr: "Sélectionner l'onglet Tous les éléments en aval, puis Parcourir par type d'élément." } }
    - { id: d, text: { en: "Select the Child items tab, and then select Browse by workspace.", fr: "Sélectionner l'onglet Éléments enfants, puis Parcourir par espace de travail." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The Child items tab limits the list to the direct children of DF-Customers, here the semantic models that import from it. Browse by workspace then groups those items by the workspace they're in."
    fr: "L'onglet Éléments enfants limite la liste aux enfants directs de DF-Customers, ici les modèles sémantiques qui l'importent. Parcourir par espace de travail regroupe ensuite ces éléments selon l'espace de travail qui les contient."
  options:
    a:
      en: "All downstream items also includes the reports built on the semantic models, which aren't direct readers of the dataflow."
      fr: "Tous les éléments en aval inclut aussi les rapports qui reposent sur les modèles sémantiques, lesquels ne lisent pas directement le flux de données."
    b:
      en: "Child items is the right scope, but Browse by item type groups the items by type, not by workspace."
      fr: "Éléments enfants est la bonne étendue, mais Parcourir par type d'élément regroupe les éléments par type, pas par espace de travail."
    c:
      en: "This choice includes indirect dependents and groups them by type instead of by workspace."
      fr: "Ce choix inclut les dépendants indirects et les regroupe par type au lieu de les regrouper par espace de travail."
references:
  - title: Impact analysis
    url: https://learn.microsoft.com/en-us/fabric/governance/impact-analysis
