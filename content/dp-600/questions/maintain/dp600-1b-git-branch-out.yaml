id: dp600-1b-git-branch-out
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Team-Dev that is connected to the main branch of an Azure DevOps repository. Five developers have the Contributor role in Team-Dev. The Allow users with at least Contributor role to change Git branch setting is disabled in Team-Dev. The developers have the Create branch permission on the repository, and they are allowed to create workspaces.

    Each developer must build a feature in Fabric without affecting the items that the other developers use in Team-Dev. Changes must reach main through pull requests. The solution must not change the role assignments or the settings of Team-Dev.

    What should each developer do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Team-Dev connecté à la branche main d'un référentiel Azure DevOps. Cinq développeurs ont le rôle Contributor dans Team-Dev. Le paramètre Allow users with at least Contributor role to change Git branch est désactivé dans Team-Dev. Les développeurs ont l'autorisation Create branch sur le référentiel et sont autorisés à créer des espaces de travail.

    Chaque développeur doit créer une fonctionnalité dans Fabric sans affecter les éléments que les autres développeurs utilisent dans Team-Dev. Les modifications doivent arriver dans main par des demandes de tirage. La solution ne doit modifier ni les attributions de rôles ni les paramètres de Team-Dev.

    Que doit faire chaque développeur ?
body:
  options:
    - { id: a, text: { en: "In Team-Dev, check out a new branch, work on the feature, and then create a pull request.", fr: "Dans Team-Dev, extraire une nouvelle branche, travailler sur la fonctionnalité, puis créer une demande de tirage." } }
    - { id: b, text: { en: "In Team-Dev, switch to a feature branch, work on the feature, and then create a pull request.", fr: "Dans Team-Dev, basculer vers une branche de fonctionnalité, travailler sur la fonctionnalité, puis créer une demande de tirage." } }
    - { id: c, text: { en: "From Team-Dev, branch out to a new workspace, work there, and then create a pull request.", fr: "Depuis Team-Dev, créer une branche vers un nouvel espace de travail (Branch out), y travailler, puis créer une demande de tirage." } }
    - { id: d, text: { en: "Deploy Team-Dev to a personal workspace with a deployment pipeline, and then commit from it.", fr: "Déployer Team-Dev vers un espace de travail personnel avec un pipeline de déploiement, puis valider depuis celui-ci." } }
answer: { optionId: c }
explanation:
  correct:
    en: Branch out to another workspace is available to Contributors who have the Read and Create branch permissions in Git. It creates a new branch and a new workspace synced to it, so each developer works in isolation and merges the feature into main through a pull request.
    fr: |
      Branch out vers un autre espace de travail est disponible pour les Contributors qui ont les autorisations Git Read et Create branch. Cette action crée une nouvelle branche et un nouvel espace de travail synchronisé avec elle : chaque développeur travaille isolé et fusionne sa fonctionnalité dans main par une demande de tirage.
  options:
    a: { en: "Checkout new branch requires the Admin role while the setting is disabled, and it would change the branch of the workspace shared by all developers.", fr: "Checkout new branch demande le rôle Admin tant que le paramètre est désactivé, et changerait la branche de l'espace de travail partagé par tous les développeurs." }
    b: { en: "Switch branch requires the Admin role while the setting is disabled, and it overwrites the items of the shared workspace for everyone.", fr: "Switch branch demande le rôle Admin tant que le paramètre est désactivé, et écrase les éléments de l'espace de travail partagé pour tout le monde." }
    d: { en: "A deployment pipeline promotes content between stage workspaces; it doesn't create a Git branch for the developer.", fr: "Un pipeline de déploiement promeut du contenu entre les espaces de travail des étapes ; il ne crée pas de branche Git pour le développeur." }
references:
  - title: Development process using branch workspace
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/branched-workspace
  - title: Git integration process
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process
