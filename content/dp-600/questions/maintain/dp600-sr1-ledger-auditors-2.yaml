id: dp600-sr1-ledger-auditors-2
objective: "1.1.2"
type: series_yesno
series: dp600-sr1-ledger-auditors
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You share WH-Ledger and select Read all data using SQL.
  fr: Vous partagez WH-Ledger et sélectionnez Read all data using SQL.
body:
  solution:
    en: |
      You share **WH-Ledger** with the ExtAuditors group and, in the share dialog, you select only the **Read all data using SQL** check box.
    fr: |
      Vous partagez **WH-Ledger** avec le groupe ExtAuditors et, dans la boîte de dialogue de partage, vous cochez uniquement la case **Read all data using SQL**.
answer: { value: true }
explanation:
  correct:
    en: |
      Sharing grants item permissions on WH-Ledger only, so the other items of WS-Finance stay invisible to the auditors. The Read all data using SQL option adds the ReadData permission, which gives read-only access to all the tables and views of the warehouse through T-SQL, so the auditors can query from SSMS but can't modify data.
    fr: |
      Le partage accorde des autorisations d'élément sur WH-Ledger uniquement : les autres éléments de WS-Finance restent invisibles pour les auditeurs. L'option Read all data using SQL ajoute l'autorisation ReadData, qui donne un accès en lecture seule à toutes les tables et vues de l'entrepôt en T-SQL : les auditeurs peuvent interroger l'entrepôt depuis SSMS sans pouvoir modifier les données.
references:
  - title: Share your data and manage permissions
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions
