id: dp600-1a-item-direct-lake-identity
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a Fabric workspace named **WS-Ops** that contains a warehouse named **WH-Ops** and a semantic model named **OpsModel**. OpsModel uses Direct Lake on SQL over WH-Ops, with the default single sign-on (SSO) connection. A report named **OpsDaily** uses OpsModel.

    You shared OpsDaily with the security group **SG-Shift**. Its members open the report, but the visuals return errors.

    The members of SG-Shift must see the data in OpsDaily. They must not be able to query WH-Ops directly with T-SQL tools.

    What should you do?
  fr: |
    Adatum dispose d'un espace de travail Fabric nommé **WS-Ops** qui contient un entrepôt nommé **WH-Ops** et un modèle sémantique nommé **OpsModel**. OpsModel utilise Direct Lake sur SQL au-dessus de WH-Ops, avec la connexion d'authentification unique (SSO) par défaut. Un rapport nommé **OpsDaily** utilise OpsModel.

    Vous avez partagé OpsDaily avec le groupe de sécurité **SG-Shift**. Ses membres ouvrent le rapport, mais les visuels renvoient des erreurs.

    Les membres de SG-Shift doivent voir les données de OpsDaily. Ils ne doivent pas pouvoir interroger directement WH-Ops avec des outils T-SQL.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Share WH-Ops with SG-Shift and select Read all data using SQL", fr: "Partager WH-Ops avec SG-Shift en sélectionnant Read all data using SQL" } }
    - { id: b, text: { en: "Bind OpsModel to a cloud connection that uses a fixed identity with access to WH-Ops", fr: "Lier OpsModel à une connexion cloud qui utilise une identité fixe ayant accès à WH-Ops" } }
    - { id: c, text: { en: "Grant SG-Shift the Build permission on OpsModel", fr: "Accorder à SG-Shift l'autorisation Build sur OpsModel" } }
    - { id: d, text: { en: "Assign SG-Shift the Viewer role in WS-Ops", fr: "Attribuer à SG-Shift le rôle Viewer dans WS-Ops" } }
answer: { optionId: b }
explanation:
  correct:
    en: "With SSO, a Direct Lake model reads the warehouse with the identity of the report user, so each user needs ReadData or granular SQL permissions on WH-Ops. A fixed identity cloud connection makes the model read the data with that identity, so the report users need only access to the report and model, not to the warehouse."
    fr: "Avec l'authentification unique, un modèle Direct Lake lit l'entrepôt avec l'identité de l'utilisateur du rapport : chaque utilisateur a besoin de ReadData ou d'autorisations SQL granulaires sur WH-Ops. Une connexion cloud à identité fixe fait lire les données par cette identité : les utilisateurs du rapport n'ont besoin que d'un accès au rapport et au modèle, pas à l'entrepôt."
  options:
    a: { en: "ReadData fixes the errors but lets the users query every table of WH-Ops with T-SQL tools.", fr: "ReadData corrige les erreurs mais permet aux utilisateurs d'interroger toutes les tables de WH-Ops avec des outils T-SQL." }
    c: { en: "Build allows creating content on the model; it gives no permission on the warehouse data that Direct Lake reads.", fr: "Build permet de créer du contenu sur le modèle ; il ne donne aucune autorisation sur les données de l'entrepôt lues par Direct Lake." }
    d: { en: "Viewer includes ReadData on every warehouse of the workspace, so the users could query WH-Ops directly.", fr: "Viewer inclut ReadData sur chaque entrepôt de l'espace de travail : les utilisateurs pourraient interroger directement WH-Ops." }
references:
  - title: Permission model
    url: https://learn.microsoft.com/en-us/fabric/security/permission-model
  - title: Share your data and manage permissions
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions
