id: dp600-cs2c-partition-refresh
objective: "1.2.5"
type: single
caseStudy: dp600-cs2c-blue-yonder-airlines
difficulty: 2
status: draft
stem:
  en: |
    Incremental refresh is configured and SM-FlightOps has been refreshed in the service. You need to meet the reprocessing requirement of the operations team.

    What should you do?
  fr: |
    L'actualisation incrémentielle est configurée et SM-FlightOps a été actualisé dans le service. Vous devez respecter l'exigence de retraitement de l'équipe des opérations.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Connect DAX Studio to the XMLA endpoint of FlightOps-BI, and run a DAX query that evaluates the partition.", fr: "Connecter DAX Studio au point de terminaison XMLA de FlightOps-BI, puis exécuter une requête DAX qui évalue la partition." }
    - id: b
      text: { en: "Connect SQL Server Management Studio to the SQL connection string of WH-Ops, and run the TMSL script on the partition.", fr: "Connecter SQL Server Management Studio à la chaîne de connexion SQL de WH-Ops, puis exécuter le script TMSL sur la partition." }
    - id: c
      text: { en: "Connect SQL Server Management Studio to the XMLA endpoint of FlightOps-BI, and run a TMSL refresh command on the partition.", fr: "Connecter SQL Server Management Studio au point de terminaison XMLA de FlightOps-BI, puis exécuter une commande TMSL refresh sur la partition." }
    - id: d
      text: { en: "In Power BI Desktop, refresh FactFlightLeg in the .pbip project, and then republish SM-FlightOps to FlightOps-BI.", fr: "Dans Power BI Desktop, actualiser FactFlightLeg dans le projet .pbip, puis republier SM-FlightOps dans FlightOps-BI." }
answer:
  optionId: c
explanation:
  correct:
    en: "The XMLA endpoint of a workspace on a Fabric capacity exposes the partitions that the incremental refresh policy creates. With the XMLA Endpoint setting at Read Write, SQL Server Management Studio can run a TMSL refresh command that targets one historical partition and leaves the others untouched."
    fr: "Le point de terminaison XMLA d'un espace de travail sur une capacité Fabric expose les partitions créées par la stratégie d'actualisation incrémentielle. Avec le paramètre XMLA Endpoint sur Read Write, SQL Server Management Studio peut exécuter une commande TMSL refresh qui cible une partition historique et laisse les autres intactes."
  options:
    a:
      en: "DAX Studio is read-only for queries through the XMLA endpoint, and a DAX query reads data without reprocessing it."
      fr: "DAX Studio est en lecture seule pour les requêtes par le point de terminaison XMLA, et une requête DAX lit les données sans les retraiter."
    b:
      en: "The SQL connection string of WH-Ops accepts T-SQL for the warehouse; TMSL commands are sent to the XMLA endpoint of the workspace that hosts the semantic model."
      fr: "La chaîne de connexion SQL de WH-Ops accepte du T-SQL pour l'entrepôt ; les commandes TMSL sont envoyées au point de terminaison XMLA de l'espace de travail qui héberge le modèle sémantique."
    d:
      en: "Power BI Desktop loads only the RangeStart to RangeEnd window and has no policy partitions; republishing does not reprocess a single partition in the service."
      fr: "Power BI Desktop ne charge que la fenêtre de RangeStart à RangeEnd et n'a pas de partitions de stratégie ; la republication ne retraite pas une partition unique dans le service."
references:
  - title: Semantic model connectivity and management with the XMLA endpoint in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/service-premium-connect-tools
