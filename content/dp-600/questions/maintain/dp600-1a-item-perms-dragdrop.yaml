id: dp600-1a-item-perms-dragdrop
objective: "1.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a Fabric workspace named **WS-Prod** that contains a lakehouse named **LH-Gold** and a pipeline named **PL-Nightly**. Four users have no role in WS-Prod and need the following access. You grant it by sharing the items.

    Which additional permission should you select for each user? To answer, drag the appropriate permissions to the correct users. Each permission may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un espace de travail Fabric nommé **WS-Prod** qui contient un lakehouse nommé **LH-Gold** et un pipeline nommé **PL-Nightly**. Quatre utilisateurs n'ont aucun rôle dans WS-Prod et ont besoin des accès suivants. Vous les accordez en partageant les éléments.

    Quelle autorisation supplémentaire devez-vous sélectionner pour chaque utilisateur ? Pour répondre, faites glisser les autorisations appropriées vers les utilisateurs correspondants. Chaque autorisation peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: readdata, text: Read all with SQL analytics endpoint }
    - { id: readall, text: Read all with Apache Spark }
    - { id: share, text: Share }
    - { id: execute, text: Execute }
    - { id: edit, text: Edit }
    - { id: build, text: Build }
  targets:
    - id: t1
      text: { en: "User1: query every table of LH-Gold with T-SQL from SQL Server Management Studio", fr: "User1 : interroger toutes les tables de LH-Gold en T-SQL depuis SQL Server Management Studio" }
    - id: t2
      text: { en: "User2: load LH-Gold files into a DataFrame from a notebook in another workspace", fr: "User2 : charger des fichiers de LH-Gold dans un DataFrame depuis un notebook d'un autre espace de travail" }
    - id: t3
      text: { en: "User3: share LH-Gold with the members of their own team", fr: "User3 : partager LH-Gold avec les membres de sa propre équipe" }
    - id: t4
      text: { en: "User4: start or cancel a run of PL-Nightly", fr: "User4 : démarrer ou annuler une exécution de PL-Nightly" }
answer:
  mapping: { t1: readdata, t2: readall, t3: share, t4: execute }
explanation:
  correct:
    en: "Read all with SQL analytics endpoint reads data through the TDS (T-SQL) endpoint. Read all with Apache Spark reads lakehouse data through Spark and the OneLake APIs. Share lets a recipient share the item and grant permissions up to their own. Execute lets a recipient run or cancel the execution of the item."
    fr: "Read all with SQL analytics endpoint lit les données par le point de terminaison TDS (T-SQL). Read all with Apache Spark lit les données du lakehouse via Spark et les API OneLake. Share permet au destinataire de partager l'élément et d'accorder des autorisations dans la limite des siennes. Execute permet au destinataire d'exécuter ou d'annuler l'exécution de l'élément."
  options:
    edit: { en: "Edit lets the recipient modify the item, which none of the users needs.", fr: "Edit permet au destinataire de modifier l'élément, ce dont aucun utilisateur n'a besoin." }
    build: { en: "Build applies to semantic models.", fr: "Build s'applique aux modèles sémantiques." }
references:
  - title: Share items in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/share-items
