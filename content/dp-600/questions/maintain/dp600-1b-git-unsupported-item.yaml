id: dp600-1b-git-unsupported-item
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Sales that contains a lakehouse named LH-Sales, a notebook named NB-Load and a Power BI dashboard named Dash-Sales.

    You connect Sales to an empty folder of a GitHub repository and commit all the items.

    What happens to Dash-Sales?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Sales qui contient un lakehouse nommé LH-Sales, un notebook nommé NB-Load et un tableau de bord Power BI nommé Dash-Sales.

    Vous connectez Sales à un dossier vide d'un référentiel GitHub et validez tous les éléments.

    Qu'arrive-t-il à Dash-Sales ?
body:
  options:
    - { id: a, text: { en: "It stays in the workspace and is ignored by Git.", fr: "Il reste dans l'espace de travail et Git l'ignore." } }
    - { id: b, text: { en: "It is deleted from the workspace.", fr: "Il est supprimé de l'espace de travail." } }
    - { id: c, text: { en: "It is committed as a JSON definition file.", fr: "Il est validé sous forme de fichier de définition JSON." } }
    - { id: d, text: { en: "It blocks the connection until you remove it.", fr: "Il bloque la connexion jusqu'à ce que vous le supprimiez." } }
answer: { optionId: a }
explanation:
  correct:
    en: Dashboards aren't in the list of items that Git integration supports. You can still connect a workspace that contains unsupported items; they are ignored, not saved, synced or deleted, and they appear in the Source control pane without being committable.
    fr: Les tableaux de bord ne figurent pas dans la liste des éléments pris en charge par l'intégration Git. Vous pouvez quand même connecter un espace de travail qui contient des éléments non pris en charge ; ils sont ignorés, ni enregistrés, ni synchronisés, ni supprimés, et ils apparaissent dans le volet Contrôle de code source sans pouvoir être validés.
  options:
    b: { en: "Git integration never deletes unsupported items from the workspace.", fr: "L'intégration Git ne supprime jamais les éléments non pris en charge de l'espace de travail." }
    c: { en: "Only supported item types are exported to Git as definition files.", fr: "Seuls les types d'éléments pris en charge sont exportés dans Git sous forme de fichiers de définition." }
    d: { en: "A workspace with unsupported items can still be connected; those items are simply ignored.", fr: "Un espace de travail qui contient des éléments non pris en charge peut quand même être connecté ; ces éléments sont simplement ignorés." }
references:
  - title: Overview of Fabric Git integration
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/intro-to-git-integration
