id: dp600-1a-ws-viewer-actions
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Fabric workspace named **WS-Supply** that contains a lakehouse named **LH-Supply**, a notebook named **NB-Load** and a pipeline named **PL-Daily**.

    An auditor named Dev has the Viewer role in WS-Supply and no item permissions.

    Which two actions can Dev perform?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un espace de travail Fabric nommé **WS-Supply** qui contient un lakehouse nommé **LH-Supply**, un notebook nommé **NB-Load** et un pipeline nommé **PL-Daily**.

    Un auditeur nommé Dev a le rôle Viewer dans WS-Supply et aucune autorisation d'élément.

    Quelles sont les deux actions que Dev peut effectuer ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Open NB-Load and read its code", fr: "Ouvrir NB-Load et lire son code" } }
    - { id: b, text: { en: "Run NB-Load to reload a table", fr: "Exécuter NB-Load pour recharger une table" } }
    - { id: c, text: { en: "View the execution output of the last PL-Daily run", fr: "Consulter les résultats d'exécution de la dernière exécution de PL-Daily" } }
    - { id: d, text: { en: "Browse the Files folder of LH-Supply in Lakehouse explorer", fr: "Parcourir le dossier Files de LH-Supply dans l'explorateur de lakehouse" } }
    - { id: e, text: { en: "Cancel a running execution of PL-Daily", fr: "Annuler une exécution en cours de PL-Daily" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "All four workspace roles can view and read the content of pipelines and notebooks and view their execution output. Viewer cannot execute or cancel items, and it does not include ReadAll, which Lakehouse explorer requires."
    fr: "Les quatre rôles d'espace de travail permettent de consulter et de lire le contenu des pipelines et des notebooks, ainsi que leurs résultats d'exécution. Viewer ne peut pas exécuter ni annuler des éléments, et il n'inclut pas ReadAll, que l'explorateur de lakehouse exige."
  options:
    b: { en: "Running notebooks requires Contributor or higher.", fr: "L'exécution de notebooks demande Contributor ou un rôle supérieur." }
    d: { en: "Reading lakehouse data through Lakehouse explorer requires ReadAll, which Viewer does not have.", fr: "Lire les données d'un lakehouse dans l'explorateur de lakehouse demande ReadAll, que Viewer n'a pas." }
    e: { en: "Cancelling a pipeline run requires Contributor or higher.", fr: "L'annulation d'une exécution de pipeline demande Contributor ou un rôle supérieur." }
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
