id: dp600-1b-pbip-gitignore
objective: "1.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You save a Power BI report named Inventory as a Power BI project in a new, empty folder. Power BI Desktop creates a .gitignore file in the folder.

    Which two files does the .gitignore file exclude from source control?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous enregistrez un rapport Power BI nommé Inventory en tant que projet Power BI dans un nouveau dossier vide. Power BI Desktop crée un fichier .gitignore dans le dossier.

    Quels sont les deux fichiers que le fichier .gitignore exclut du contrôle de code source ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Inventory.SemanticModel\definition.pbism }
    - { id: b, text: Inventory.SemanticModel\.pbi\cache.abf }
    - { id: c, text: Inventory.SemanticModel\.pbi\unappliedChanges.json }
    - { id: d, text: Inventory.Report\definition.pbir }
    - { id: e, text: Inventory.Report\.pbi\localSettings.json }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: The default .gitignore contains the patterns **/.pbi/localSettings.json and **/.pbi/cache.abf. The first file holds settings that apply only to the current user and computer; the second is the local data cache of the semantic model.
    fr: Le .gitignore par défaut contient les modèles **/.pbi/localSettings.json et **/.pbi/cache.abf. Le premier fichier contient des paramètres propres à l'utilisateur et à l'ordinateur ; le second est le cache de données local du modèle sémantique.
  options:
    a: { en: "definition.pbism is the required definition file of the semantic model and is committed.", fr: "definition.pbism est le fichier de définition obligatoire du modèle sémantique et il est validé." }
    c: { en: "unappliedChanges.json is included in Git by default; you can exclude it yourself.", fr: "unappliedChanges.json est inclus dans Git par défaut ; vous pouvez l'exclure vous-même." }
    d: { en: "definition.pbir defines the report and its semantic model reference; it must be committed.", fr: "definition.pbir définit le rapport et sa référence au modèle sémantique ; il doit être validé." }
references:
  - title: Power BI Desktop projects (PBIP)
    url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-overview
