id: dp600-1c-ra-asset-updates
objective: "1.2.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    The BI team of Proseware distributes two reusable files to report authors:

    - **Store.pbids**, which connects to the SQL Server database that stores sales data.
    - **Store.pbit**, a template exported from a report named Store.pbix. Authors have already created 15 reports from it.

    The following changes occur. You need to apply each change where it is required. The solution must minimize effort.

    What should you do for each change? To answer, drag the appropriate actions to the correct changes. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe BI de Proseware distribue deux fichiers réutilisables aux auteurs de rapports :

    - **Store.pbids**, qui se connecte à la base de données SQL Server qui stocke les données de ventes.
    - **Store.pbit**, un modèle de rapport exporté à partir d'un rapport nommé Store.pbix. Les auteurs ont déjà créé 15 rapports à partir de ce modèle.

    Les modifications suivantes ont lieu. Vous devez appliquer chaque modification là où elle est nécessaire. La solution doit réduire l'effort au minimum.

    Que devez-vous faire pour chaque modification ? Pour répondre, faites glisser les actions appropriées vers les modifications correspondantes. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: editpbids, text: { en: "Edit the server address in Store.pbids in a text editor.", fr: "Modifier l'adresse du serveur dans Store.pbids avec un éditeur de texte." } }
    - { id: reexport, text: { en: "Apply the change to Store.pbix, and export a new Store.pbit.", fr: "Appliquer la modification à Store.pbix, et exporter un nouveau Store.pbit." } }
    - { id: each, text: { en: "Apply the change in each report that was created from Store.pbit.", fr: "Appliquer la modification dans chaque rapport créé à partir de Store.pbit." } }
    - { id: rule, text: { en: "Create a data source rule in a deployment pipeline.", fr: "Créer une règle de source de données dans un pipeline de déploiement." } }
    - { id: republish, text: { en: "Republish Store.pbix to the service.", fr: "Republier Store.pbix dans le service." } }
  targets:
    - { id: server, text: { en: "The sales database moves to a new server. Authors who open the connection file from now on must reach the new server.", fr: "La base de données de ventes est déplacée vers un nouveau serveur. Les auteurs qui ouvrent le fichier de connexion à partir de maintenant doivent atteindre le nouveau serveur." } }
    - { id: newtheme, text: { en: "Reports that authors create from the template from now on must use the new corporate theme.", fr: "Les rapports que les auteurs créent à partir du modèle à partir de maintenant doivent utiliser le nouveau thème de l'entreprise." } }
    - { id: oldtheme, text: { en: "The 15 existing reports must use the new corporate theme.", fr: "Les 15 rapports existants doivent utiliser le nouveau thème de l'entreprise." } }
answer:
  mapping: { server: editpbids, newtheme: reexport, oldtheme: each }
explanation:
  correct:
    en: "A .pbids file is a JSON file that you can open and modify in a text editor, so changing its server address updates every future connection. A template is a snapshot of a report: you change the source report and export the template again. Reports created from a template are independent copies with their own pages, model and queries, so the existing reports must each be updated."
    fr: "Un fichier .pbids est un fichier JSON que vous pouvez ouvrir et modifier avec un éditeur de texte : changer l'adresse du serveur met à jour toutes les connexions futures. Un modèle de rapport est un instantané d'un rapport : vous modifiez le rapport source et exportez à nouveau le modèle. Les rapports créés à partir d'un modèle sont des copies indépendantes avec leurs propres pages, modèle et requêtes : chaque rapport existant doit donc être mis à jour."
  options:
    rule:
      en: "Deployment rules change the data source of items deployed between pipeline stages; they don't change files that authors open in Power BI Desktop."
      fr: "Les règles de déploiement changent la source de données des éléments déployés entre les étapes d'un pipeline ; elles ne modifient pas les fichiers que les auteurs ouvrent dans Power BI Desktop."
    republish:
      en: "Republishing Store.pbix updates the copy in the service, not the template file nor the reports created from it."
      fr: "Republier Store.pbix met à jour la copie du service, mais ni le fichier de modèle ni les rapports créés à partir de celui-ci."
references:
  - title: Data sources in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-data-sources
  - title: Create and use report templates in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-templates
