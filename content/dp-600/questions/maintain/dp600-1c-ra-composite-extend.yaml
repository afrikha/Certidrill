id: dp600-1c-ra-composite-extend
objective: "1.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a shared semantic model named **SM-Sales** in a Fabric workspace. An analyst connects Power BI Desktop to SM-Sales by using **Power BI semantic models** in Get data.

    The analyst needs to add an Excel table of sales targets to the report and relate it to the Product table of SM-Sales. SM-Sales must not be changed. The tenant settings required for composite models are enabled.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique partagé nommé **SM-Sales** dans un espace de travail Fabric. Un analyste connecte Power BI Desktop à SM-Sales avec **Modèles sémantiques Power BI** dans Obtenir les données.

    L'analyste doit ajouter au rapport une table Excel d'objectifs de ventes et la relier à la table Product de SM-Sales. SM-Sales ne doit pas être modifié. Les paramètres de locataire requis pour les modèles composites sont activés.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To add the Excel table, the analyst first selects [[action]].

      In the resulting model, the tables of SM-Sales use the [[mode]] storage mode.

      The minimum permission that the analyst needs on SM-Sales is [[perm]].
    fr: |
      Pour ajouter la table Excel, l'analyste sélectionne d'abord [[action]].

      Dans le modèle obtenu, les tables de SM-Sales utilisent le mode de stockage [[mode]].

      L'autorisation minimale dont l'analyste a besoin sur SM-Sales est [[perm]].
  slots:
    - id: action
      options:
        - { id: transform, text: { en: "Transform data", fr: "Transformer les données" } }
        - { id: makechanges, text: { en: "Make changes to this model", fr: "Make changes to this model" } }
        - { id: datasource, text: { en: "Data source settings", fr: "Paramètres de la source de données" } }
    - id: mode
      options:
        - { id: import, text: Import }
        - { id: dq, text: DirectQuery }
        - { id: directlake, text: Direct Lake }
        - { id: dual, text: Dual }
    - id: perm
      options:
        - { id: read, text: Read }
        - { id: build, text: Build }
        - { id: reshare, text: Reshare }
        - { id: write, text: Write }
answer:
  values: { action: makechanges, mode: dq, perm: build }
explanation:
  correct:
    en: "A live connection can't receive new tables. Make changes to this model adds a local model and turns the report into a composite model, where the tables of SM-Sales are DirectQuery tables and the Excel table is imported; cross-source relationships can then be created without changing SM-Sales. The owner of the composite model needs Build permission on each source semantic model."
    fr: "Une connexion active ne peut pas recevoir de nouvelles tables. Make changes to this model ajoute un modèle local et transforme le rapport en modèle composite, où les tables de SM-Sales sont des tables DirectQuery et la table Excel est importée ; les relations entre sources peuvent alors être créées sans modifier SM-Sales. Le propriétaire du modèle composite a besoin de l'autorisation Build sur chaque modèle sémantique source."
  options:
    transform:
      en: "A live-connected report can't receive new tables until a local model is added, which is what Make changes to this model does."
      fr: "Un rapport en connexion active ne peut pas recevoir de nouvelles tables tant qu'un modèle local n'est pas ajouté, ce que fait Make changes to this model."
    import:
      en: "The remote model isn't copied; its tables are queried with DirectQuery."
      fr: "Le modèle distant n'est pas copié ; ses tables sont interrogées en DirectQuery."
    read:
      en: "Read lets users view reports; connecting to a model to build content requires Build."
      fr: "Read permet de consulter des rapports ; se connecter à un modèle pour créer du contenu exige Build."
    write:
      en: "Write permission would allow changes to SM-Sales, which is more than needed."
      fr: "L'autorisation Write permettrait de modifier SM-Sales, ce qui dépasse le besoin."
references:
  - title: Connect to semantic models in the Power BI service from Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-report-lifecycle-datasets
  - title: Build permission for shared semantic models
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/service-datasets-build-permissions
