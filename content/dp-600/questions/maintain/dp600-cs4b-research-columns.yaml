id: dp600-cs4b-research-columns
objective: "1.1.3"
type: single
caseStudy: dp600-cs4b-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You need to configure access to dbo.Patients for the researchers. The solution must meet the research access requirement.

    What should you do in WH-Clinical?
  fr: |
    Vous devez configurer l'accès des chercheurs à dbo.Patients. La solution doit satisfaire l'exigence relative à l'accès des chercheurs.

    Que devez-vous faire dans WH-Clinical ?
body:
  options:
    - { id: a, text: { en: "Add a dynamic data mask to FullName and NationalId, and grant SELECT on dbo.Patients to SG-Research.", fr: "Ajouter un masque dynamique des données à FullName et NationalId, et accorder SELECT sur dbo.Patients à SG-Research." } }
    - { id: b, text: { en: "Create a security policy with a filter predicate on dbo.Patients, and grant SELECT on dbo.Patients to SG-Research.", fr: "Créer une stratégie de sécurité avec un prédicat de filtre sur dbo.Patients, et accorder SELECT sur dbo.Patients à SG-Research." } }
    - { id: c, text: { en: "Grant SELECT on dbo.Patients to SG-Research with a column list that contains only the four allowed columns.", fr: "Accorder SELECT sur dbo.Patients à SG-Research avec une liste de colonnes qui contient uniquement les quatre colonnes autorisées." } }
    - { id: d, text: { en: "Create a semantic model on WH-Clinical with object-level security that hides FullName and NationalId from SG-Research.", fr: "Créer un modèle sémantique sur WH-Clinical avec une sécurité au niveau de l'objet qui masque FullName et NationalId à SG-Research." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Column-level security grants SELECT on a list of columns, for example `GRANT SELECT ON dbo.Patients (PatientId, BirthYear, Sex, PostalCode) TO [SG-Research];`. It is enforced by the warehouse for every tool, and a query that references a column that is not granted, including `SELECT *`, fails with a permission error. The researchers only have the Read permission and no workspace role, so the grant is their only access to the table."
    fr: "La sécurité au niveau des colonnes accorde SELECT sur une liste de colonnes, par exemple `GRANT SELECT ON dbo.Patients (PatientId, BirthYear, Sex, PostalCode) TO [SG-Research];`. Elle est appliquée par l'entrepôt quel que soit l'outil, et une requête qui fait référence à une colonne non accordée, y compris `SELECT *`, échoue avec une erreur d'autorisation. Les chercheurs n'ont que l'autorisation Read et aucun rôle d'espace de travail : cette autorisation est leur seul accès à la table."
  options:
    a: { en: "Dynamic data masking returns masked values instead of failing the query, and the real values can be inferred with WHERE clauses.", fr: "Le masquage dynamique des données renvoie des valeurs masquées au lieu de faire échouer la requête, et les valeurs réelles peuvent être déduites avec des clauses WHERE." }
    b: { en: "A security policy implements row-level security: it filters rows, not columns.", fr: "Une stratégie de sécurité implémente la sécurité au niveau des lignes : elle filtre des lignes, pas des colonnes." }
    d: { en: "Object-level security applies only to queries sent to the semantic model; T-SQL queries on the warehouse would still return every column.", fr: "La sécurité au niveau de l'objet ne s'applique qu'aux requêtes envoyées au modèle sémantique ; les requêtes T-SQL sur l'entrepôt renverraient toujours toutes les colonnes." }
references:
  - title: Column-level security in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/column-level-security
  - title: Dynamic data masking in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dynamic-data-masking
