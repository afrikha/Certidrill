id: dp600-1b-pbir-structure
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Power BI project named Marketing. The report is saved in the PBIR format. The report contains a page named Overview and report-level measures.

    A developer must review changes to a single visual on the Overview page and changes to the report-level measures in pull requests.

    Which file should the developer review for each change? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un projet Power BI nommé Marketing. Le rapport est enregistré au format PBIR. Le rapport contient une page nommée Overview et des mesures au niveau du rapport.

    Un développeur doit relire dans les demandes de tirage les modifications d'un seul visuel de la page Overview et les modifications des mesures au niveau du rapport.

    Quel fichier le développeur doit-il relire pour chaque modification ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Change to one visual of Overview: Marketing.Report\definition\[[visual]]
      Change to the report-level measures: Marketing.Report\definition\[[measures]]
    fr: |
      Modification d'un visuel d'Overview : Marketing.Report\definition\[[visual]]
      Modification des mesures au niveau du rapport : Marketing.Report\definition\[[measures]]
  slots:
    - id: visual
      options:
        - { id: page, text: "pages\\[pageName]\\page.json" }
        - { id: visual, text: "pages\\[pageName]\\visuals\\[visualName]\\visual.json" }
        - { id: report, text: report.json }
        - { id: pages, text: pages\pages.json }
    - id: measures
      options:
        - { id: ext, text: reportExtensions.json }
        - { id: report, text: report.json }
        - { id: version, text: version.json }
        - { id: pages, text: pages\pages.json }
answer:
  values: { visual: visual, measures: ext }
explanation:
  correct:
    en: The PBIR format stores each page, visual and bookmark in its own JSON file, so a change to one visual appears only in that visual's visual.json file. Report extensions, such as report-level measures, are stored in reportExtensions.json.
    fr: Le format PBIR stocke chaque page, visuel et signet dans son propre fichier JSON ; la modification d'un visuel n'apparaît donc que dans le fichier visual.json de ce visuel. Les extensions de rapport, comme les mesures au niveau du rapport, sont stockées dans reportExtensions.json.
  options:
    page: { en: "page.json holds page metadata, such as page-level filters and formatting.", fr: "page.json contient les métadonnées de la page, comme les filtres et la mise en forme de la page." }
    report: { en: "report.json holds report metadata, such as report-level filters and formatting.", fr: "report.json contient les métadonnées du rapport, comme les filtres et la mise en forme du rapport." }
    pages: { en: "pages.json holds the page order and the active page.", fr: "pages.json contient l'ordre des pages et la page active." }
    version: { en: "version.json holds the PBIR file version.", fr: "version.json contient la version des fichiers PBIR." }
references:
  - title: Power BI Desktop project report folder
    url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-report
