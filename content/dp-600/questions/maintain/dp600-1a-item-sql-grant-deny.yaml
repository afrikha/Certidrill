id: dp600-1a-item-sql-grant-deny
objective: "1.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has a Fabric warehouse named **WH-Sales**. The `sales` schema of WH-Sales contains 40 tables, including `sales.Payroll`.

    You shared WH-Sales with a user named maria@northwind.com without selecting any additional permission. Maria must read every current and future table of the `sales` schema with T-SQL, except `sales.Payroll`. She must not read any other schema.

    How should you complete the T-SQL statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un entrepôt Fabric nommé **WH-Sales**. Le schéma `sales` de WH-Sales contient 40 tables, dont `sales.Payroll`.

    Vous avez partagé WH-Sales avec une utilisatrice nommée maria@northwind.com sans sélectionner d'autorisation supplémentaire. Maria doit lire en T-SQL toutes les tables actuelles et futures du schéma `sales`, sauf `sales.Payroll`. Elle ne doit lire aucun autre schéma.

    Comment devez-vous compléter les instructions T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    [[s1]] SELECT ON [[s2]] TO [maria@northwind.com];
    [[s3]] SELECT ON OBJECT::sales.Payroll TO [maria@northwind.com];
  slots:
    - id: s1
      options:
        - { id: grant, text: GRANT }
        - { id: deny, text: DENY }
        - { id: revoke, text: REVOKE }
    - id: s2
      options:
        - { id: schema, text: "SCHEMA::sales" }
        - { id: object, text: "OBJECT::sales" }
        - { id: database, text: "DATABASE::WH-Sales" }
    - id: s3
      options:
        - { id: grant, text: GRANT }
        - { id: deny, text: DENY }
        - { id: revoke, text: REVOKE }
answer:
  values: { s1: grant, s2: schema, s3: deny }
explanation:
  correct:
    en: "Sharing without additional permissions gives only Read (connect). Granting SELECT on the schema covers every table of `sales`, including tables created later, and nothing outside it. A DENY on `sales.Payroll` overrides the schema-level grant for that table."
    fr: "Le partage sans autorisation supplémentaire ne donne que Read (connexion). Accorder SELECT sur le schéma couvre toutes les tables de `sales`, y compris celles créées plus tard, et rien en dehors. Un DENY sur `sales.Payroll` l'emporte sur l'autorisation accordée au niveau du schéma pour cette table."
  options:
    revoke: { en: "REVOKE only removes an existing grant or deny on that object; Maria's schema-level SELECT would still cover sales.Payroll.", fr: "REVOKE retire seulement une autorisation ou un refus existant sur cet objet ; le SELECT de Maria au niveau du schéma couvrirait toujours sales.Payroll." }
    object: { en: "`OBJECT::` designates a single table or view, not a schema.", fr: "`OBJECT::` désigne une table ou une vue unique, pas un schéma." }
    database: { en: "A database-level SELECT would also expose the other schemas.", fr: "Un SELECT au niveau de la base de données exposerait aussi les autres schémas." }
references:
  - title: Share your data and manage permissions
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions
  - title: Secure your Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/security
