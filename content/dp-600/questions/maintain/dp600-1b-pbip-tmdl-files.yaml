id: dp600-1b-pbip-tmdl-files
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You save a Power BI report named Budget as a Power BI project. The semantic model is saved in the TMDL format. You use the DAX query view of Power BI Desktop and keep two query tabs.

    You need to explain to the team where the project stores these definitions.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous enregistrez un rapport Power BI nommé Budget en tant que projet Power BI. Le modèle sémantique est enregistré au format TMDL. Vous utilisez la vue de requête DAX de Power BI Desktop et conservez deux onglets de requête.

    Vous devez expliquer à l'équipe où le projet stocke ces définitions.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The tables, measures and roles of the model are stored in [[model]] of Budget.SemanticModel.
      To support this format, the version property of definition.pbism must be [[version]].
      Each DAX query tab is stored as a .dax file in [[dax]] of Budget.SemanticModel.
    fr: |
      Les tables, mesures et rôles du modèle sont stockés dans [[model]] de Budget.SemanticModel.
      Pour prendre en charge ce format, la propriété version de definition.pbism doit être [[version]].
      Chaque onglet de requête DAX est stocké sous forme de fichier .dax dans [[dax]] de Budget.SemanticModel.
  slots:
    - id: model
      options:
        - { id: bim, text: { en: "the model.bim file", fr: "le fichier model.bim" } }
        - { id: def, text: { en: "the definition folder", fr: "le dossier definition" } }
        - { id: cache, text: { en: "the .pbi\\cache.abf file", fr: "le fichier .pbi\\cache.abf" } }
    - id: version
      options:
        - { id: v1, text: "1.0" }
        - { id: v4, text: { en: "4.0 or later", fr: "4.0 ou ultérieure" } }
        - { id: any, text: { en: "any version", fr: "n'importe quelle version" } }
    - id: dax
      options:
        - { id: daxq, text: { en: "the DAXQueries folder", fr: "le dossier DAXQueries" } }
        - { id: tmdls, text: { en: "the TMDLScripts folder", fr: "le dossier TMDLScripts" } }
        - { id: defn, text: { en: "the definition folder", fr: "le dossier definition" } }
answer:
  values: { model: def, version: v4, dax: daxq }
explanation:
  correct:
    en: In TMDL format, the definition folder replaces model.bim and holds the model in separate files for tables, roles, cultures and perspectives. TMDL requires definition.pbism version 4.0 or later; version 1.0 supports only TMSL in model.bim. The DAXQueries folder contains one .dax file per DAX query view tab.
    fr: Au format TMDL, le dossier definition remplace model.bim et contient le modèle dans des fichiers séparés pour les tables, les rôles, les cultures et les perspectives. TMDL demande la version 4.0 ou ultérieure de definition.pbism ; la version 1.0 ne prend en charge que TMSL dans model.bim. Le dossier DAXQueries contient un fichier .dax par onglet de la vue de requête DAX.
  options:
    bim: { en: "model.bim holds the model in the TMSL format, not TMDL.", fr: "model.bim contient le modèle au format TMSL, pas TMDL." }
    cache: { en: "cache.abf is the local data cache, not the model definition.", fr: "cache.abf est le cache de données local, pas la définition du modèle." }
    tmdls: { en: "TMDLScripts stores the script tabs of the TMDL view, not DAX queries.", fr: "TMDLScripts stocke les onglets de script de la vue TMDL, pas les requêtes DAX." }
references:
  - title: Power BI Desktop project semantic model folder
    url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-dataset
