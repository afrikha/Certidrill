id: dp600-1b-git-branch-statements
objective: "1.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named WS1 that is connected to the main branch of a GitHub repository. The Allow users with at least Contributor role to change Git branch setting is disabled in WS1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS1 connecté à la branche main d'un référentiel GitHub. Le paramètre Allow users with at least Contributor role to change Git branch est désactivé dans WS1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When a workspace Admin switches WS1 to another branch, the items of WS1 are overwritten with the content of that branch.
        fr: Quand un Admin de l'espace de travail bascule WS1 vers une autre branche, les éléments de WS1 sont écrasés par le contenu de cette branche.
    - id: s2
      text:
        en: A user who has the Member role in WS1 can switch WS1 to another branch.
        fr: Un utilisateur qui a le rôle Member dans WS1 peut basculer WS1 vers une autre branche.
    - id: s3
      text:
        en: A workspace Admin can switch WS1 to another branch while WS1 has uncommitted changes.
        fr: Un Admin de l'espace de travail peut basculer WS1 vers une autre branche alors que WS1 a des modifications non validées.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Switch branch syncs the workspace with the other branch, overwrites its items and deletes the items that don't exist in that branch. While the setting is disabled, only workspace Admins can switch branches. Switching isn't possible while the workspace has uncommitted changes; you must commit or cancel first.
    fr: Switch branch synchronise l'espace de travail avec l'autre branche, écrase ses éléments et supprime ceux qui n'existent pas dans cette branche. Tant que le paramètre est désactivé, seuls les Admins de l'espace de travail peuvent changer de branche. Le changement est impossible tant que l'espace de travail a des modifications non validées ; il faut d'abord valider ou annuler.
references:
  - title: Development process using branch workspace
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/branched-workspace
  - title: Get started with Git integration
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-get-started
