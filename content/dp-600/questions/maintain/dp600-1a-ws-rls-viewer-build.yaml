id: dp600-1a-ws-rls-viewer-build
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has a Fabric workspace named **WS-Retail** that contains a semantic model named **StoreModel** and several reports. StoreModel has a row-level security (RLS) role named **StoreManager**, and the security group **SG-Managers** is a member of the role.

    SG-Managers currently has the Contributor role in WS-Retail, and its members see the data of every store. The store managers must:

    - See only the data of their own store in every report of WS-Retail.
    - Create their own reports from StoreModel in Power BI Desktop.

    The solution must follow the principle of least privilege. What should you do?
  fr: |
    Wingtip Toys dispose d'un espace de travail Fabric nommé **WS-Retail** qui contient un modèle sémantique nommé **StoreModel** et plusieurs rapports. StoreModel a un rôle de sécurité au niveau des lignes (RLS) nommé **StoreManager**, dont le groupe de sécurité **SG-Managers** est membre.

    SG-Managers a actuellement le rôle Contributor dans WS-Retail, et ses membres voient les données de tous les magasins. Les directeurs de magasin doivent :

    - Ne voir que les données de leur propre magasin dans tous les rapports de WS-Retail.
    - Créer leurs propres rapports à partir de StoreModel dans Power BI Desktop.

    La solution doit respecter le principe du privilège minimum. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the role of SG-Managers to Viewer, and grant SG-Managers the Build permission on StoreModel", fr: "Remplacer le rôle de SG-Managers par Viewer, et accorder à SG-Managers l'autorisation Build sur StoreModel" } }
    - { id: b, text: { en: "Change the role of SG-Managers to Viewer, and grant SG-Managers the Write permission on StoreModel", fr: "Remplacer le rôle de SG-Managers par Viewer, et accorder à SG-Managers l'autorisation Write sur StoreModel" } }
    - { id: c, text: { en: "Keep the Contributor role, and grant SG-Managers the Build permission on StoreModel", fr: "Conserver le rôle Contributor, et accorder à SG-Managers l'autorisation Build sur StoreModel" } }
    - { id: d, text: { en: "Change the role of SG-Managers to Member, and remove the Reshare permission on StoreModel", fr: "Remplacer le rôle de SG-Managers par Member, et retirer l'autorisation Reshare sur StoreModel" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Semantic model RLS filters only users who read the model, such as workspace Viewers. Admin, Member and Contributor have edit permission on the model, so RLS does not apply to them. Viewer does not include Build, so you grant Build on StoreModel to let the managers create reports; users with Build are still filtered by RLS."
    fr: "La RLS du modèle sémantique ne filtre que les utilisateurs qui lisent le modèle, comme les Viewers de l'espace de travail. Admin, Member et Contributor disposent de l'autorisation de modification sur le modèle : la RLS ne s'applique pas à eux. Viewer n'inclut pas Build ; vous accordez donc Build sur StoreModel pour que les directeurs puissent créer des rapports, et les utilisateurs qui ont Build restent filtrés par la RLS."
  options:
    b: { en: "Users with Write on a semantic model read all its data regardless of RLS, and Write is more than creating reports requires.", fr: "Les utilisateurs qui ont Write sur un modèle sémantique lisent toutes ses données quelle que soit la RLS, et Write dépasse ce que demande la création de rapports." }
    c: { en: "Contributors have edit permission on the model, so RLS still would not filter the managers.", fr: "Les Contributors ont l'autorisation de modification sur le modèle : la RLS ne filtrerait toujours pas les directeurs." }
    d: { en: "Member also has edit permission on the model, so RLS would not apply, and it grants more than Contributor.", fr: "Member a aussi l'autorisation de modification sur le modèle : la RLS ne s'appliquerait pas, et ce rôle accorde plus que Contributor." }
references:
  - title: Row-level security (RLS) with Power BI
    url: https://learn.microsoft.com/en-us/fabric/security/service-admin-row-level-security
  - title: Semantic model permissions
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/service-datasets-permissions
