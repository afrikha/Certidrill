id: dp600-cs3c-students-badge
objective: "1.1.5"
type: single
caseStudy: dp600-cs3c-graphic-design-institute
difficulty: 1
status: draft
stem:
  en: |
    You need to meet requirement 5.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence 5.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Ask a member of DataStewards to certify LH-Students.", fr: "Demander à un membre de DataStewards de certifier LH-Students." } }
    - { id: b, text: { en: "Ask Kai to promote LH-Students.", fr: "Demander à Kai de promouvoir LH-Students." } }
    - { id: c, text: { en: "Ask a member of DataStewards to apply the Master data badge to LH-Students.", fr: "Demander à un membre de DataStewards d'appliquer le badge Master data à LH-Students." } }
    - { id: d, text: { en: "Ask Kai to apply the Master data badge to LH-Students.", fr: "Demander à Kai d'appliquer le badge Master data à LH-Students." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Master data badge marks an item whose data is a core, authoritative source for the organization, such as a list of students, and it can be applied to items that contain data, such as lakehouses. Only the users that the Fabric administrator specified, here DataStewards, can apply it.
    fr: |
      Le badge Master data signale un élément dont les données sont une source essentielle et faisant autorité pour l'organisation, comme une liste d'étudiants, et il peut être appliqué aux éléments qui contiennent des données, comme les lakehouses. Seuls les utilisateurs désignés par l'administrateur Fabric, ici DataStewards, peuvent l'appliquer.
  options:
    a: { en: "Certification states that a reviewer checked the item's quality and reliability; it does not identify the item as the core source of organizational data.", fr: "La certification indique qu'un réviseur a vérifié la qualité et la fiabilité de l'élément ; elle ne le désigne pas comme la source essentielle de données de l'organisation." }
    b: { en: "Promotion only shows that the creators consider the item ready for sharing and reuse.", fr: "La promotion indique seulement que les créateurs jugent l'élément prêt à être partagé et réutilisé." }
    d: { en: "Kai is not in DataStewards, so he can only request the Master data badge, not apply it.", fr: "Kai ne fait pas partie de DataStewards : il peut seulement demander le badge Master data, pas l'appliquer." }
references:
  - title: Endorsement overview
    url: https://learn.microsoft.com/en-us/fabric/governance/endorsement-overview
