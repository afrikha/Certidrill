id: dp600-1b-pbip-multiple-pbir
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Sales-Dev that is connected to a Git branch. The branch contains a Power BI project that has the following files:

    - Sales.SemanticModel\definition.pbism
    - Sales.Report\definition.pbir, which references the semantic model by using byPath
    - Sales.Report\definition-liveConnect.pbir, which references a semantic model in another workspace by using byConnection

    You update Sales-Dev from Git.

    To which semantic model is the Sales report in Sales-Dev bound?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Sales-Dev connecté à une branche Git. La branche contient un projet Power BI qui comporte les fichiers suivants :

    - Sales.SemanticModel\definition.pbism
    - Sales.Report\definition.pbir, qui référence le modèle sémantique avec byPath
    - Sales.Report\definition-liveConnect.pbir, qui référence un modèle sémantique d'un autre espace de travail avec byConnection

    Vous mettez à jour Sales-Dev depuis Git.

    À quel modèle sémantique le rapport Sales de Sales-Dev est-il lié ?
body:
  options:
    - { id: a, text: { en: "The semantic model in the other workspace, through a live connection", fr: "Au modèle sémantique de l'autre espace de travail, par une connexion active" } }
    - { id: b, text: { en: "No semantic model, because the update fails on the second .pbir file", fr: "À aucun modèle sémantique, car la mise à jour échoue sur le second fichier .pbir" } }
    - { id: c, text: { en: "The semantic model whose .pbir file was modified most recently", fr: "Au modèle sémantique dont le fichier .pbir a été modifié le plus récemment" } }
    - { id: d, text: { en: "The Sales semantic model created in Sales-Dev from the project", fr: "Au modèle sémantique Sales créé dans Sales-Dev à partir du projet" } }
answer: { optionId: d }
explanation:
  correct:
    en: Fabric Git integration processes only the definition.pbir file of a report folder and ignores other .pbir files. Its byPath reference binds the report to the Sales semantic model that the update creates from the project. Extra .pbir files, such as a byConnection one, are a way to keep a live-connection variant for Power BI Desktop.
    fr: L'intégration Git de Fabric ne traite que le fichier definition.pbir d'un dossier de rapport et ignore les autres fichiers .pbir. Sa référence byPath lie le rapport au modèle sémantique Sales que la mise à jour crée à partir du projet. Des fichiers .pbir supplémentaires, comme un fichier byConnection, permettent de conserver une variante en connexion active pour Power BI Desktop.
  options:
    a: { en: "definition-liveConnect.pbir is ignored by Fabric Git integration, so its byConnection reference isn't used.", fr: "definition-liveConnect.pbir est ignoré par l'intégration Git de Fabric : sa référence byConnection n'est pas utilisée." }
    b: { en: "Additional .pbir files are ignored, not rejected; the update succeeds.", fr: "Les fichiers .pbir supplémentaires sont ignorés, pas rejetés ; la mise à jour réussit." }
    c: { en: "Fabric doesn't choose by modification date; it always uses definition.pbir.", fr: "Fabric ne choisit pas selon la date de modification ; il utilise toujours definition.pbir." }
references:
  - title: Power BI Desktop project report folder
    url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-report
