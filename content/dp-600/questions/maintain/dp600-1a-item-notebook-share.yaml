id: dp600-1a-item-notebook-share
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a Fabric workspace named **WS-Science** that contains a notebook named **NB-Forecast**. A data scientist named Lena has no role in WS-Science, and she already has access to the lakehouse that NB-Forecast uses.

    Lena must be able to change the code of NB-Forecast and run it. She must not be able to share NB-Forecast with other users.

    Which two permissions should you select when you share NB-Forecast with Lena?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un espace de travail Fabric nommé **WS-Science** qui contient un notebook nommé **NB-Forecast**. Une data scientist nommée Lena n'a aucun rôle dans WS-Science, et elle a déjà accès au lakehouse qu'utilise NB-Forecast.

    Lena doit pouvoir modifier le code de NB-Forecast et l'exécuter. Elle ne doit pas pouvoir partager NB-Forecast avec d'autres utilisateurs.

    Quelles sont les deux autorisations à sélectionner quand vous partagez NB-Forecast avec Lena ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Share }
    - { id: b, text: Edit }
    - { id: c, text: Run }
    - { id: d, text: Build }
    - { id: e, text: Read all with Apache Spark }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "When you share a notebook, you can add the Share, Edit and Run permissions to the default Read. Developing a notebook needs read, write and execute, so Lena needs Edit (write) and Run (execute). Share isn't selected because she must not reshare the notebook."
    fr: "Quand vous partagez un notebook, vous pouvez ajouter les autorisations Share, Edit et Run au Read par défaut. Développer un notebook demande la lecture, l'écriture et l'exécution : Lena a besoin de Edit (écriture) et de Run (exécution). Share n'est pas sélectionnée, car elle ne doit pas repartager le notebook."
  options:
    a: { en: "Share would let Lena share the notebook with other users, which is not allowed.", fr: "Share permettrait à Lena de partager le notebook avec d'autres utilisateurs, ce qui n'est pas autorisé." }
    d: { en: "Build is a semantic model permission.", fr: "Build est une autorisation de modèle sémantique." }
    e: { en: "Read all with Apache Spark is a lakehouse or warehouse permission, and Lena already has access to the lakehouse.", fr: "Read all with Apache Spark est une autorisation de lakehouse ou d'entrepôt, et Lena a déjà accès au lakehouse." }
references:
  - title: How to use Microsoft Fabric notebooks
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/how-to-use-notebook
