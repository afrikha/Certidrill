seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: User1 updates the workspace from the Source control pane.
  fr: User1 met à jour l'espace de travail depuis le volet Contrôle de code source.
body:
  solution:
    en: |
      User1 opens the **Source control** pane of WS-Sales, selects the **Updates** tab, selects **Update all**, and then confirms.
    fr: |
      User1 ouvre le volet **Contrôle de code source** de WS-Sales, sélectionne l'onglet **Updates**, sélectionne **Update all**, puis confirme.
answer: { value: false }
explanation:
  correct:
    en: |
      Update is the right operation, but a user needs both a Fabric workspace role and a Git permission. A Viewer can't perform any Git action in the workspace, whatever their permissions in Repo1; updating requires at least Contributor (write permission on all items) and Read in Git.
    fr: |
      La mise à jour est la bonne opération, mais l'utilisateur a besoin à la fois d'un rôle d'espace de travail Fabric et d'une autorisation Git. Un Viewer ne peut effectuer aucune action Git dans l'espace de travail, quelles que soient ses autorisations dans Repo1 ; la mise à jour exige au moins Contributor (autorisation d'écriture sur tous les éléments) et Read dans Git.
references:
  - title: Basic concepts in Git integration
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process
