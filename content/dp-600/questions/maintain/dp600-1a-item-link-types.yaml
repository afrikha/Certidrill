id: dp600-1a-item-link-types
objective: "1.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Litware has a Fabric workspace named **WS-Market** that contains a report named **Pricing**. You plan to share Pricing three times, with different audiences.

    Which link type should you use for each audience? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un espace de travail Fabric nommé **WS-Market** qui contient un rapport nommé **Pricing**. Vous prévoyez de partager Pricing trois fois, avec des publics différents.

    Quel type de lien devez-vous utiliser pour chaque public ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Anyone in Litware who opens the link, but no guest user: [[l1]]

      A colleague who already has access and needs only the URL: [[l2]]

      A partner who is a guest user in the Litware Microsoft Entra tenant: [[l3]]
    fr: |
      Toute personne de Litware qui ouvre le lien, mais aucun utilisateur invité : [[l1]]

      Un collègue qui a déjà accès et n'a besoin que de l'URL : [[l2]]

      Un partenaire qui est utilisateur invité dans le locataire Microsoft Entra de Litware : [[l3]]
  slots:
    - id: l1
      options:
        - { id: org, text: People in your organization }
        - { id: existing, text: People with existing access }
        - { id: specific, text: Specific people }
    - id: l2
      options:
        - { id: org, text: People in your organization }
        - { id: existing, text: People with existing access }
        - { id: specific, text: Specific people }
    - id: l3
      options:
        - { id: org, text: People in your organization }
        - { id: existing, text: People with existing access }
        - { id: specific, text: Specific people }
answer:
  values: { l1: org, l2: existing, l3: specific }
explanation:
  correct:
    en: "A People in your organization link works for everyone in the organization but not for guest or external users. A People with existing access link only generates the URL and grants nothing. A Specific people link grants access to named people or groups and can include guest users of your Microsoft Entra tenant."
    fr: "Un lien People in your organization fonctionne pour toute l'organisation, mais pas pour les utilisateurs invités ou externes. Un lien People with existing access génère seulement l'URL et n'accorde rien. Un lien Specific people accorde l'accès à des personnes ou des groupes nommés et peut inclure les utilisateurs invités de votre locataire Microsoft Entra."
references:
  - title: Share items in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/share-items
