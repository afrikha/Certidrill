id: dp600-1c-xmla-guest-url
objective: "1.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses the Microsoft Entra tenant **contoso.com**. The tenant contains a Fabric workspace named **Sales Analytics** that is assigned to a Fabric capacity named **F64-Contoso**. The workspace contains a semantic model named **SalesModel**. The XMLA Endpoint setting of the capacity is set to **Read Write**.

    A consultant from Fabrikam, whose home tenant is **fabrikam.com**, is a guest user in contoso.com and has the Contributor role in Sales Analytics.

    The consultant needs to connect Tabular Editor to the workspace through the XMLA endpoint.

    How should you complete the server address? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso utilise le locataire Microsoft Entra **contoso.com**. Le locataire contient un espace de travail Fabric nommé **Sales Analytics**, attribué à une capacité Fabric nommée **F64-Contoso**. L'espace de travail contient un modèle sémantique nommé **SalesModel**. Le paramètre XMLA Endpoint de la capacité est défini sur **Read Write**.

    Un consultant de Fabrikam, dont le locataire d'origine est **fabrikam.com**, est un utilisateur invité de contoso.com et a le rôle Contributor dans Sales Analytics.

    Le consultant doit connecter Tabular Editor à l'espace de travail par le point de terminaison XMLA.

    Comment devez-vous compléter l'adresse du serveur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    powerbi://api.powerbi.com/v1.0/[[tenant]]/[[ws]]
  slots:
    - id: tenant
      options:
        - { id: myorg, text: myorg }
        - { id: contoso, text: contoso.com }
        - { id: fabrikam, text: fabrikam.com }
    - id: ws
      options:
        - { id: model, text: SalesModel }
        - { id: wsname, text: Sales%20Analytics }
        - { id: capacity, text: F64-Contoso }
answer:
  values: { tenant: contoso, ws: wsname }
explanation:
  correct:
    en: "The XMLA endpoint address identifies a workspace, so it ends with the URI-encoded workspace name, Sales%20Analytics. Users of the home tenant can use myorg, but a B2B guest must specify the tenant that owns the workspace, here contoso.com. The semantic model is then selected as a database of that server."
    fr: "L'adresse du point de terminaison XMLA identifie un espace de travail : elle se termine par le nom de l'espace de travail encodé en URI, Sales%20Analytics. Les utilisateurs du locataire d'origine peuvent utiliser myorg, mais un invité B2B doit indiquer le locataire propriétaire de l'espace de travail, ici contoso.com. Le modèle sémantique est ensuite choisi comme base de données de ce serveur."
  options:
    myorg:
      en: "myorg is for users whose home tenant owns the workspace; a B2B guest must name the owning tenant explicitly."
      fr: "myorg est réservé aux utilisateurs dont le locataire d'origine est propriétaire de l'espace de travail ; un invité B2B doit nommer explicitement le locataire propriétaire."
    fabrikam:
      en: "The workspace belongs to contoso.com; the guest's home tenant doesn't contain it."
      fr: "L'espace de travail appartient à contoso.com ; le locataire d'origine de l'invité ne le contient pas."
    model:
      en: "The address points to the workspace; SalesModel is a database inside it."
      fr: "L'adresse désigne l'espace de travail ; SalesModel en est une base de données."
    capacity:
      en: "A capacity hosts several workspaces; the XMLA endpoint is exposed per workspace."
      fr: "Une capacité héberge plusieurs espaces de travail ; le point de terminaison XMLA est exposé par espace de travail."
references:
  - title: Semantic model connectivity and management with the XMLA endpoint in Power BI
    url: https://learn.microsoft.com/en-us/fabric/enterprise/powerbi/service-premium-connect-tools
