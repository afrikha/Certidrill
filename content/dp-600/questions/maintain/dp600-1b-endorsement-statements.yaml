id: dp600-1b-endorsement-statements
objective: "1.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a deployment pipeline named Pipeline1 that has Development, Test and Production stages. The Development stage contains a semantic model named SM1 that an authorized reviewer has certified. Your Fabric tenant has certification enabled for a security group named Reviewers.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline de déploiement nommé Pipeline1 qui comporte les étapes Development, Test et Production. L'étape Development contient un modèle sémantique nommé SM1 qu'un réviseur autorisé a certifié. Votre locataire Fabric a la certification activée pour un groupe de sécurité nommé Reviewers.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A member of Reviewers who has only the Viewer role in the workspace of the Test stage can certify the copy of SM1 in that workspace.
        fr: Un membre de Reviewers qui n'a que le rôle Viewer dans l'espace de travail de l'étape Test peut certifier la copie de SM1 dans cet espace de travail.
    - id: s2
      text:
        en: When you deploy SM1 to the Test stage for the first time, the copy of SM1 in the Test stage is certified.
        fr: Quand vous déployez SM1 pour la première fois vers l'étape Test, la copie de SM1 dans l'étape Test est certifiée.
    - id: s3
      text:
        en: A user who has the Contributor role in the workspace of the Development stage can promote another semantic model in that workspace without belonging to Reviewers.
        fr: Un utilisateur qui a le rôle Contributor dans l'espace de travail de l'étape Development peut promouvoir un autre modèle sémantique de cet espace de travail sans appartenir à Reviewers.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Certifying requires both the authorization of the Fabric administrator and write permission on the item, which the Viewer role doesn't give. Deployment pipelines don't copy the endorsement settings of semantic models, so the copy in Test must be endorsed again. Promotion only requires write permission, which the Contributor role gives.
    fr: |
      Certifier exige à la fois l'autorisation de l'administrateur Fabric et l'autorisation d'écriture sur l'élément, que le rôle Viewer ne donne pas. Les pipelines de déploiement ne copient pas les paramètres d'approbation des modèles sémantiques : la copie de Test doit être approuvée de nouveau. La promotion ne demande que l'autorisation d'écriture, que le rôle Contributor donne.
references:
  - title: Endorse Fabric and Power BI items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/endorsement-promote-certify
  - title: The Microsoft Fabric deployment pipelines process
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/understand-the-deployment-process
