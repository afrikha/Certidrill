id: dp600-1c-ra-template-steps
objective: "1.2.6"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a Power BI Desktop file named **Regions.pbix**. Its queries read from a SQL Server whose name is typed directly in the Source step of each query.

    You need to create a reusable file that contains the report and the model but no data. When an analyst opens the file, Power BI Desktop must ask the analyst for the server name.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un fichier Power BI Desktop nommé **Regions.pbix**. Ses requêtes lisent un serveur SQL Server dont le nom est saisi directement dans l'étape Source de chaque requête.

    Vous devez créer un fichier réutilisable qui contient le rapport et le modèle, mais aucune donnée. Quand un analyste ouvre le fichier, Power BI Desktop doit lui demander le nom du serveur.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: param, text: { en: "In Power Query Editor, create a query parameter named ServerName.", fr: "Dans l'éditeur Power Query, créer un paramètre de requête nommé ServerName." } }
    - { id: source, text: { en: "Change the Source step of each query to use ServerName.", fr: "Modifier l'étape Source de chaque requête pour utiliser ServerName." } }
    - { id: export, text: { en: "Select File > Export > Power BI template.", fr: "Sélectionner Fichier > Exporter > Modèle Power BI." } }
    - { id: save, text: { en: "Enter a template description, and then save the .pbit file.", fr: "Saisir une description du modèle, puis enregistrer le fichier .pbit." } }
    - { id: pbids, text: { en: "In Data source settings, select Export PBIDS.", fr: "Dans Paramètres de la source de données, sélectionner Exporter PBIDS." } }
    - { id: field, text: { en: "Create a field parameter named ServerName.", fr: "Créer un paramètre de champ nommé ServerName." } }
answer:
  sequence: [ param, source, export, save ]
explanation:
  correct:
    en: "Opening a template shows an Enter Parameters dialog for the parameters defined in the source report, so the server name must first become a query parameter used by the Source steps. You then export the template from File > Export > Power BI template, enter its description, and save the .pbit file."
    fr: "L'ouverture d'un modèle de rapport affiche une boîte de dialogue de saisie des paramètres définis dans le rapport source : le nom du serveur doit donc d'abord devenir un paramètre de requête utilisé par les étapes Source. Vous exportez ensuite le modèle par Fichier > Exporter > Modèle Power BI, saisissez sa description et enregistrez le fichier .pbit."
  options:
    pbids:
      en: "A .pbids file holds one connection and no report or model, so it doesn't meet the requirement."
      fr: "Un fichier .pbids contient une connexion et aucun rapport ni modèle : il ne répond donc pas à l'exigence."
    field:
      en: "A field parameter lets report users switch the fields of a visual; it can't change the server of a query."
      fr: "Un paramètre de champ permet aux utilisateurs du rapport de changer les champs d'un visuel ; il ne peut pas changer le serveur d'une requête."
references:
  - title: Create and use report templates in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-templates
