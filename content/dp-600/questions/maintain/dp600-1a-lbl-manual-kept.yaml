id: dp600-1a-lbl-manual-kept
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Fabric workspace named **WS-Finance** in which you are a Member. WS-Finance contains a semantic model named **BudgetModel**, a dashboard named **BudgetBoard** and a report named **BudgetReport**, both built on BudgetModel. Last week, the author of BudgetReport applied the **General** label to it manually.

    Today, you change the label of BudgetModel to **Highly Confidential** and leave the downstream inheritance checkbox selected. BudgetBoard gets Highly Confidential, but BudgetReport keeps General.

    What explains the behavior of BudgetReport?
  fr: |
    Litware dispose d'un espace de travail Fabric nommé **WS-Finance** dont vous êtes Member. WS-Finance contient un modèle sémantique nommé **BudgetModel**, un tableau de bord nommé **BudgetBoard** et un rapport nommé **BudgetReport**, tous deux basés sur BudgetModel. La semaine dernière, l'auteur de BudgetReport lui a appliqué manuellement l'étiquette **General**.

    Aujourd'hui, vous remplacez l'étiquette de BudgetModel par **Highly Confidential** en laissant cochée la case d'héritage en aval. BudgetBoard reçoit Highly Confidential, mais BudgetReport conserve General.

    Qu'est-ce qui explique le comportement de BudgetReport ?
body:
  options:
    - { id: a, text: { en: "Downstream inheritance applies only to items created after the label change", fr: "L'héritage en aval ne s'applique qu'aux éléments créés après la modification de l'étiquette" } }
    - { id: b, text: { en: "Downstream inheritance never overwrites a label that was applied manually", fr: "L'héritage en aval n'écrase jamais une étiquette appliquée manuellement" } }
    - { id: c, text: { en: "Downstream inheritance isn't supported from a Power BI item to another Power BI item", fr: "L'héritage en aval n'est pas pris en charge d'un élément Power BI vers un autre élément Power BI" } }
    - { id: d, text: { en: "You need the Build permission on BudgetReport for its label to change", fr: "Vous avez besoin de l'autorisation Build sur BudgetReport pour que son étiquette change" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Downstream inheritance propagates the label of a semantic model to the existing items built on it, here the dashboard. It never overwrites a manually applied label and never replaces a label with a less restrictive one, so BudgetReport keeps the General label its author set."
    fr: "L'héritage en aval propage l'étiquette d'un modèle sémantique vers les éléments existants construits sur lui, ici le tableau de bord. Il n'écrase jamais une étiquette appliquée manuellement et ne remplace jamais une étiquette par une moins restrictive : BudgetReport conserve l'étiquette General définie par son auteur."
  options:
    a: { en: "Downstream inheritance updates existing items; labeling new items from a parent is inheritance upon creation.", fr: "L'héritage en aval met à jour les éléments existants ; l'étiquetage des nouveaux éléments à partir d'un parent est l'héritage à la création." }
    c: { en: "Power BI to Power BI is a supported direction, as the dashboard shows; only Power BI to Fabric isn't.", fr: "Power BI vers Power BI est une direction prise en charge, comme le montre le tableau de bord ; seule Power BI vers Fabric ne l'est pas." }
    d: { en: "In user consent mode, you need edit permission on the downstream item, which a Member has; Build plays no part.", fr: "En mode avec consentement de l'utilisateur, il faut l'autorisation de modification sur l'élément en aval, qu'un Member possède ; Build ne joue aucun rôle." }
references:
  - title: Sensitivity label downstream inheritance
    url: https://learn.microsoft.com/en-us/fabric/governance/service-security-sensitivity-label-downstream-inheritance
