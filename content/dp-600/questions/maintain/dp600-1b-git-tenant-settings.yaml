id: dp600-1b-git-tenant-settings
objective: "1.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Your Fabric tenant has a capacity in the Central US region. The Users can synchronize workspace items with their Git repositories tenant setting is enabled. The workspaces on the capacity must be connected to Azure DevOps repositories that are located in West Europe.

    You need to meet the following requirements:

    - Users can commit the items of these workspaces to the West Europe repositories.
    - Users can commit items that have a sensitivity label applied.

    Which tenant setting should you enable for each requirement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre locataire Fabric dispose d'une capacité dans la région Central US. Le paramètre de locataire Users can synchronize workspace items with their Git repositories est activé. Les espaces de travail de la capacité doivent être connectés à des référentiels Azure DevOps situés en West Europe.

    Vous devez répondre aux exigences suivantes :

    - Les utilisateurs peuvent valider les éléments de ces espaces de travail dans les référentiels de West Europe.
    - Les utilisateurs peuvent valider des éléments auxquels une étiquette de confidentialité est appliquée.

    Quel paramètre de locataire devez-vous activer pour chaque exigence ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Commit to the West Europe repositories: [[geo]]
      Commit labeled items: [[label]]
    fr: |
      Valider dans les référentiels de West Europe : [[geo]]
      Valider des éléments étiquetés : [[label]]
  slots:
    - id: geo
      options:
        - { id: geo, text: Users can export items to Git repositories in other geographical locations }
        - { id: label, text: Users can export workspace items with applied sensitivity labels to Git repositories }
        - { id: gh, text: Users can sync workspace items with GitHub repositories }
        - { id: create, text: Users can create Fabric items }
    - id: label
      options:
        - { id: geo, text: Users can export items to Git repositories in other geographical locations }
        - { id: label, text: Users can export workspace items with applied sensitivity labels to Git repositories }
        - { id: gh, text: Users can sync workspace items with GitHub repositories }
        - { id: create, text: Users can create Fabric items }
answer:
  values: { geo: geo, label: label }
explanation:
  correct:
    en: When the workspace capacity and the Azure DevOps repository are in different geographies, the tenant setting for other geographical locations must be enabled; only item metadata is exported. Items that carry a sensitivity label can be exported only when the sensitivity label setting is enabled, and the label itself isn't included in Git.
    fr: Quand la capacité de l'espace de travail et le référentiel Azure DevOps sont dans des zones géographiques différentes, le paramètre de locataire pour les autres zones géographiques doit être activé ; seules les métadonnées des éléments sont exportées. Les éléments qui portent une étiquette de confidentialité ne peuvent être exportés que si le paramètre des étiquettes est activé, et l'étiquette elle-même n'est pas incluse dans Git.
  options:
    gh: { en: "This setting allows syncing with GitHub; the repositories are in Azure DevOps.", fr: "Ce paramètre autorise la synchronisation avec GitHub ; les référentiels sont dans Azure DevOps." }
    create: { en: "This setting lets users create Fabric items; it doesn't affect where or what they can commit.", fr: "Ce paramètre permet de créer des éléments Fabric ; il n'a pas d'effet sur l'endroit ni sur ce qu'on peut valider." }
references:
  - title: Git integration admin settings
    url: https://learn.microsoft.com/en-us/fabric/admin/git-integration-admin-settings
