id: dp600-1a-lbl-export-paths
objective: "1.1.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Litware has a report named **Payroll** whose semantic model is labeled **Confidential**. The label has encryption settings. Users export data from Payroll in three ways.

    What happens to the label in each case? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un rapport nommé **Payroll** dont le modèle sémantique porte l'étiquette **Confidential**. L'étiquette comporte des paramètres de chiffrement. Les utilisateurs exportent des données de Payroll de trois façons.

    Que devient l'étiquette dans chaque cas ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Export the report to PDF: [[e1]]

      Export the data of a visual to a .csv file: [[e2]]

      Open the semantic model with Analyze in Excel: [[e3]]
    fr: |
      Exporter le rapport en PDF : [[e1]]

      Exporter les données d'un visuel dans un fichier .csv : [[e2]]

      Ouvrir le modèle sémantique avec Analyser dans Excel : [[e3]]
  slots:
    - id: e1
      options:
        - { id: both, text: { en: "The label and its protection are applied to the file", fr: "L'étiquette et sa protection sont appliquées au fichier" } }
        - { id: labelonly, text: { en: "Only the label is applied, without protection", fr: "Seule l'étiquette est appliquée, sans protection" } }
        - { id: none, text: { en: "Neither the label nor its protection is applied", fr: "Ni l'étiquette ni sa protection ne sont appliquées" } }
    - id: e2
      options:
        - { id: both, text: { en: "The label and its protection are applied to the file", fr: "L'étiquette et sa protection sont appliquées au fichier" } }
        - { id: labelonly, text: { en: "Only the label is applied, without protection", fr: "Seule l'étiquette est appliquée, sans protection" } }
        - { id: none, text: { en: "Neither the label nor its protection is applied", fr: "Ni l'étiquette ni sa protection ne sont appliquées" } }
    - id: e3
      options:
        - { id: both, text: { en: "The label and its protection are applied to the file", fr: "L'étiquette et sa protection sont appliquées au fichier" } }
        - { id: labelonly, text: { en: "Only the label is applied, without protection", fr: "Seule l'étiquette est appliquée, sans protection" } }
        - { id: none, text: { en: "Neither the label nor its protection is applied", fr: "Ni l'étiquette ni sa protection ne sont appliquées" } }
answer:
  values: { e1: both, e2: none, e3: both }
explanation:
  correct:
    en: "Export to Excel, PDF and PowerPoint, Analyze in Excel and download to .pbix are supported export paths, so the exported file gets the label and its protection. Export to .csv or .txt isn't supported: the file carries neither the label nor its protection, and admins can block these paths."
    fr: "L'exportation vers Excel, PDF et PowerPoint, Analyser dans Excel et le téléchargement en .pbix sont des chemins d'exportation pris en charge : le fichier exporté reçoit l'étiquette et sa protection. L'exportation en .csv ou .txt n'est pas prise en charge : le fichier ne porte ni l'étiquette ni sa protection, et les administrateurs peuvent bloquer ces chemins."
references:
  - title: Sensitivity labels in Power BI
    url: https://learn.microsoft.com/en-us/fabric/enterprise/powerbi/service-security-sensitivity-label-overview
  - title: Information protection in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/information-protection
