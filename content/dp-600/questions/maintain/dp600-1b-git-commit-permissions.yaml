id: dp600-1b-git-commit-permissions
objective: "1.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Reporting that is connected to the develop branch of an Azure DevOps repository named Repo1. The develop branch allows direct commits.

    A new developer named User1 must commit changes from Reporting to develop. User1 must not be able to manage access to Reporting or create branches in Repo1. The solution must follow the principle of least privilege.

    Which permissions should you grant to User1? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Reporting connecté à la branche develop d'un référentiel Azure DevOps nommé Repo1. La branche develop autorise les validations directes.

    Un nouveau développeur nommé User1 doit valider des modifications de Reporting dans develop. User1 ne doit pas pouvoir gérer l'accès à Reporting ni créer de branches dans Repo1. La solution doit respecter le principe du moindre privilège.

    Quelles autorisations devez-vous accorder à User1 ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Workspace role in Reporting: [[ws]]
      Permissions on Repo1: [[git]]
    fr: |
      Rôle d'espace de travail dans Reporting : [[ws]]
      Autorisations sur Repo1 : [[git]]
  slots:
    - id: ws
      options:
        - { id: viewer, text: Viewer }
        - { id: contrib, text: Contributor }
        - { id: member, text: Member }
        - { id: admin, text: Admin }
    - id: git
      options:
        - { id: read, text: Read }
        - { id: readcontrib, text: { en: "Read and Contribute", fr: "Read et Contribute" } }
        - { id: readbranch, text: { en: "Read and Create branch", fr: "Read et Create branch" } }
        - { id: all, text: { en: "Read, Contribute and Create branch", fr: "Read, Contribute et Create branch" } }
answer:
  values: { ws: contrib, git: readcontrib }
explanation:
  correct:
    en: Committing to Git requires the Contributor role in the workspace with write permission on the items, plus Read and Contribute on the repository and a branch policy that allows direct commits. Contributor is the lowest role that can commit, and it can't manage workspace access.
    fr: Valider dans Git demande le rôle Contributor dans l'espace de travail avec l'autorisation d'écriture sur les éléments, plus Read et Contribute sur le référentiel et une stratégie de branche qui autorise les validations directes. Contributor est le rôle le plus faible qui puisse valider, et il ne peut pas gérer l'accès à l'espace de travail.
  options:
    viewer: { en: "Viewers can't perform any Git action.", fr: "Les Viewers ne peuvent effectuer aucune action Git." }
    member: { en: "Member can commit but also manages access to the workspace, which the scenario forbids.", fr: "Member peut valider mais gère aussi l'accès à l'espace de travail, ce que le scénario interdit." }
    admin: { en: "Admin grants full control of the workspace, far more than needed.", fr: "Admin donne le contrôle total de l'espace de travail, bien plus que nécessaire." }
    read: { en: "Read is enough to update the workspace from Git, not to commit.", fr: "Read suffit pour mettre à jour l'espace de travail depuis Git, pas pour valider." }
    readbranch: { en: "Create branch is forbidden by the scenario and doesn't allow commits.", fr: "Create branch est interdit par le scénario et ne permet pas de valider." }
    all: { en: "Create branch is forbidden by the scenario.", fr: "Create branch est interdit par le scénario." }
references:
  - title: Git integration process
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process
