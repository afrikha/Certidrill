id: dp600-1a-dls-feature-dragdrop
objective: "1.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses a Fabric warehouse named **WH-Core**, a lakehouse named **LH-Landing** and an Import mode semantic model named **CoreModel**. You must meet four data security requirements.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso utilise un entrepôt Fabric nommé **WH-Core**, un lakehouse nommé **LH-Landing** et un modèle sémantique en mode Import nommé **CoreModel**. Vous devez répondre à quatre exigences de sécurité des données.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: cls, text: { en: "Column-level security (GRANT SELECT on a column list)", fr: "Sécurité au niveau des colonnes (GRANT SELECT sur une liste de colonnes)" } }
    - { id: ols, text: { en: "Object-level security (OLS)", fr: "Sécurité au niveau de l'objet (OLS)" } }
    - { id: onelake, text: { en: "OneLake security data access role", fr: "Rôle d'accès aux données de la sécurité OneLake" } }
    - { id: rls, text: { en: "Semantic model row-level security (RLS)", fr: "Sécurité au niveau des lignes (RLS) du modèle sémantique" } }
    - { id: ddm, text: { en: "Dynamic data masking", fr: "Masquage dynamique des données" } }
    - { id: label, text: { en: "Sensitivity label", fr: "Étiquette de confidentialité" } }
  targets:
    - id: t1
      text: { en: "T-SQL queries on WH-Core must fail when they read the BankAccount column", fr: "Les requêtes T-SQL sur WH-Core doivent échouer quand elles lisent la colonne BankAccount" }
    - id: t2
      text: { en: "Some report viewers must not see that the Margin table of CoreModel exists", fr: "Certains lecteurs de rapports ne doivent pas voir que la table Margin de CoreModel existe" }
    - id: t3
      text: { en: "Partners must read only the Files/Partner folder of LH-Landing from Spark", fr: "Les partenaires ne doivent lire que le dossier Files/Partner de LH-Landing depuis Spark" }
    - id: t4
      text: { en: "Sales reps must see only their own customers in CoreModel reports", fr: "Les commerciaux ne doivent voir que leurs propres clients dans les rapports de CoreModel" }
answer:
  mapping: { t1: cls, t2: ols, t3: onelake, t4: rls }
explanation:
  correct:
    en: "Column-level security in a warehouse makes a query that touches a non-granted column fail. OLS hides a table or column and its metadata in a semantic model. OneLake security roles restrict folders and tables of a lakehouse for every engine, including Spark. Semantic model RLS filters the rows that report viewers see."
    fr: "La sécurité au niveau des colonnes d'un entrepôt fait échouer une requête qui touche une colonne non accordée. L'OLS masque une table ou une colonne et ses métadonnées dans un modèle sémantique. Les rôles de sécurité OneLake restreignent les dossiers et tables d'un lakehouse pour tous les moteurs, Spark compris. La RLS du modèle sémantique filtre les lignes que voient les lecteurs de rapports."
  options:
    ddm: { en: "Dynamic data masking returns masked values instead of failing, and it doesn't hide metadata.", fr: "Le masquage dynamique des données renvoie des valeurs masquées au lieu d'échouer, et il ne masque pas les métadonnées." }
    label: { en: "A sensitivity label classifies an item and protects exports; it doesn't restrict rows, columns or folders.", fr: "Une étiquette de confidentialité classe un élément et protège les exportations ; elle ne restreint ni lignes, ni colonnes, ni dossiers." }
references:
  - title: Permission model
    url: https://learn.microsoft.com/en-us/fabric/security/permission-model
  - title: Object-level security (OLS)
    url: https://learn.microsoft.com/en-us/fabric/security/service-admin-object-level-security
