id: dp600-1a-ws-contributor-share
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a Fabric workspace named **WS-HR** that contains a report named **Headcount**. A user named Elif has the Contributor role in WS-HR.

    Elif must share Headcount with a colleague who has no access to WS-HR. When Elif opens the report, the Share option is unavailable.

    Which two actions would each allow Elif to share Headcount?

    Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un espace de travail Fabric nommé **WS-HR** qui contient un rapport nommé **Headcount**. Une utilisatrice nommée Elif a le rôle Contributor dans WS-HR.

    Elif doit partager Headcount avec un collègue qui n'a pas accès à WS-HR. Quand Elif ouvre le rapport, l'option Share est indisponible.

    Quelles sont les deux actions qui permettraient chacune à Elif de partager Headcount ?

    Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Change the workspace role of Elif to Member", fr: "Remplacer le rôle d'espace de travail d'Elif par Member" } }
    - { id: b, text: { en: "Grant Elif the Build permission on the semantic model of Headcount", fr: "Accorder à Elif l'autorisation Build sur le modèle sémantique de Headcount" } }
    - { id: c, text: { en: "Grant Elif the Reshare permission on Headcount", fr: "Accorder à Elif l'autorisation Reshare sur Headcount" } }
    - { id: d, text: { en: "Change the workspace role of Elif to Viewer", fr: "Remplacer le rôle d'espace de travail d'Elif par Viewer" } }
    - { id: e, text: { en: "Grant Elif the Write permission on the semantic model of Headcount", fr: "Accorder à Elif l'autorisation Write sur le modèle sémantique de Headcount" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Admin and Member can share the items of a workspace. Contributors and Viewers can share an item only if they hold the Reshare permission on it. Either promoting Elif to Member or granting her Reshare on the report lets her share Headcount."
    fr: "Admin et Member peuvent partager les éléments d'un espace de travail. Les Contributors et les Viewers ne peuvent partager un élément que s'ils disposent de l'autorisation Reshare sur celui-ci. Promouvoir Elif au rôle Member ou lui accorder Reshare sur le rapport lui permet de partager Headcount."
  options:
    b: { en: "Build allows creating content from the semantic model; it does not allow sharing the report.", fr: "Build permet de créer du contenu à partir du modèle sémantique ; il ne permet pas de partager le rapport." }
    d: { en: "Viewer has fewer permissions than Contributor and, without Reshare, cannot share either.", fr: "Viewer a moins d'autorisations que Contributor et, sans Reshare, ne peut pas partager non plus." }
    e: { en: "Contributor already includes Write on the model; Write does not include sharing.", fr: "Contributor inclut déjà Write sur le modèle ; Write n'inclut pas le partage." }
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
