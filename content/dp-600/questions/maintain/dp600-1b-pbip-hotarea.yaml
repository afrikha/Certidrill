id: dp600-1b-pbip-hotarea
objective: "1.2.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have a Power BI project named Sales. The following table shows some of the files of the Sales.SemanticModel folder.

    Answer each prompt by selecting the appropriate file.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un projet Power BI nommé Sales. Le tableau suivant présente certains des fichiers du dossier Sales.SemanticModel.

    Répondez à chaque consigne en sélectionnant le fichier approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The file whose changes outside Power BI Desktop aren't supported", fr: "Le fichier dont la modification hors de Power BI Desktop n'est pas prise en charge" }
    - id: p2
      text: { en: "The file that saves the Power Query changes you chose to apply later", fr: "Le fichier qui enregistre les modifications Power Query que vous avez choisi d'appliquer plus tard" }
  grid:
    header: [{ en: "File", fr: "Fichier" }]
    rows:
      - [{ text: definition.pbism, area: pbism }]
      - [{ text: .pbi\editorSettings.json, area: editor }]
      - [{ text: .pbi\unappliedChanges.json, area: unapplied }]
      - [{ text: diagramLayout.json, area: diagram }]
      - [{ text: DAXQueries\Top customers.dax, area: dax }]
answer:
  values: { p1: diagram, p2: unapplied }
explanation:
  correct:
    en: diagramLayout.json holds the diagram layout of the model; its schema isn't documented and editing it outside Power BI Desktop isn't supported. unappliedChanges.json saves the Power Query changes kept with Apply later; Desktop prompts you to apply or discard them, and the file is included in Git by default.
    fr: diagramLayout.json contient la disposition du diagramme du modèle ; son schéma n'est pas documenté et sa modification hors de Power BI Desktop n'est pas prise en charge. unappliedChanges.json enregistre les modifications Power Query conservées avec Apply later ; Desktop propose de les appliquer ou de les abandonner, et le fichier est inclus dans Git par défaut.
references:
  - title: Power BI Desktop project semantic model folder
    url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-dataset
