id: dp600-1b-git-conflict-steps
objective: "1.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Finance that is connected to the main branch of an Azure DevOps repository. You have the Admin role in Finance.

    A notebook named NB-PnL has been modified both in Finance and in main, and its Git status is Conflict. You aren't sure which changes to keep, so you need to compare and merge both versions in Git. You must not lose the changes made in the workspace.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Finance connecté à la branche main d'un référentiel Azure DevOps. Vous avez le rôle Admin dans Finance.

    Un notebook nommé NB-PnL a été modifié à la fois dans Finance et dans main, et son statut Git est Conflict. Vous ne savez pas quelles modifications conserver : vous devez donc comparer et fusionner les deux versions dans Git. Vous ne devez pas perdre les modifications faites dans l'espace de travail.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: checkout, text: { en: "In the Source control pane, check out a new branch from the last synced commit.", fr: "Dans le volet Contrôle de code source, extraire une nouvelle branche à partir de la dernière validation synchronisée." } }
    - { id: commit, text: { en: "Commit the workspace changes to the new branch.", fr: "Valider les modifications de l'espace de travail dans la nouvelle branche." } }
    - { id: merge, text: { en: "In Azure DevOps, resolve the conflicts and merge the new branch into main.", fr: "Dans Azure DevOps, résoudre les conflits et fusionner la nouvelle branche dans main." } }
    - { id: switch, text: { en: "In Fabric, switch Finance back to main.", fr: "Dans Fabric, rebasculer Finance vers main." } }
    - { id: undo, text: { en: "Select Undo on NB-PnL.", fr: "Sélectionner Undo sur NB-PnL." } }
    - { id: accept, text: { en: "In Resolve conflicts, select Accept incoming changes for NB-PnL.", fr: "Dans Resolve conflicts, sélectionner Accept incoming changes pour NB-PnL." } }
    - { id: disconnect, text: { en: "Disconnect Finance from Git and reconnect it to main.", fr: "Déconnecter Finance de Git et le reconnecter à main." } }
answer:
  sequence: [ checkout, commit, merge, switch ]
explanation:
  correct:
    en: Checking out a new branch from the last synced commit changes the Git connection of the workspace without changing its content, so the uncommitted changes stay. You commit them to that branch, resolve the conflicts and merge in Git, and then switch the workspace back to the original branch.
    fr: |
      Extraire une nouvelle branche à partir de la dernière validation synchronisée change la connexion Git de l'espace de travail sans modifier son contenu : les modifications non validées sont conservées. Vous les validez dans cette branche, résolvez les conflits et fusionnez dans Git, puis rebasculez l'espace de travail vers la branche d'origine.
  options:
    undo: { en: "Undo discards the workspace changes since the last commit.", fr: "Undo abandonne les modifications de l'espace de travail depuis la dernière validation." }
    accept: { en: "Accept incoming changes overwrites the workspace version with the Git version.", fr: "Accept incoming changes écrase la version de l'espace de travail avec celle de Git." }
    disconnect: { en: "Reconnecting forces a sync direction that overwrites every item on one side, not only NB-PnL.", fr: "La reconnexion impose un sens de synchronisation qui écrase tous les éléments d'un côté, pas seulement NB-PnL." }
references:
  - title: Resolve conflicts with Git integration
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/conflict-resolution
