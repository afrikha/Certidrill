stem:
  en: User2 updates the workspace from the Source control pane.
  fr: User2 met à jour l'espace de travail depuis le volet Contrôle de code source.
body:
  solution:
    en: |
      User2 opens the **Source control** pane of WS-Sales, selects the **Updates** tab, selects **Update all**, and then confirms.
    fr: |
      User2 ouvre le volet **Contrôle de code source** de WS-Sales, sélectionne l'onglet **Updates**, sélectionne **Update all**, puis confirme.
answer: { value: true }
explanation:
  correct:
    en: |
      Update pulls changes from the Git branch into the workspace, and it always syncs the whole workspace to the latest commit of the branch, so SM-Sales receives the three measures. The Contributor role gives User2 write permission on all items, and the Read permission in Repo1 is enough for an update.
    fr: |
      La mise à jour tire les modifications de la branche Git vers l'espace de travail et synchronise toujours tout l'espace de travail sur le dernier commit de la branche : SM-Sales reçoit les trois mesures. Le rôle Contributor donne à User2 l'autorisation d'écriture sur tous les éléments, et l'autorisation Read dans Repo1 suffit pour une mise à jour.
references:
  - title: Basic concepts in Git integration
