id: dp600-cs3b-reusable-assets
objective: "1.2.6"
type: dragdrop
caseStudy: dp600-cs3b-munsons
difficulty: 2
status: draft
stem:
  en: |
    You need to provide the reusable assets of requirement 4.

    What should you provide to each group? To answer, drag the appropriate assets to the correct groups. Each asset may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez fournir les ressources réutilisables de l'exigence 4.

    Que devez-vous fournir à chaque groupe ? Pour répondre, faites glisser les ressources appropriées vers les groupes corrects. Chaque ressource peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pbids, text: { en: "A Power BI data source file (.pbids)", fr: "Un fichier de source de données Power BI (.pbids)" } }
    - { id: pbit, text: { en: "A Power BI template file (.pbit)", fr: "Un fichier de modèle Power BI (.pbit)" } }
    - { id: pbip, text: { en: "A Power BI project (.pbip)", fr: "Un projet Power BI (.pbip)" } }
    - { id: shared, text: { en: "Build permission on SM-Sales as a shared semantic model", fr: "L'autorisation Build sur SM-Sales en tant que modèle sémantique partagé" } }
  targets:
    - { id: plant, text: { en: "Plant analysts", fr: "Analystes d'usine" } }
    - { id: finance, text: { en: "Finance offices", fr: "Services financiers" } }
    - { id: sales, text: { en: "Sales analysts", fr: "Analystes commerciaux" } }
answer:
  mapping: { plant: pbids, finance: pbit, sales: shared }
explanation:
  correct:
    en: |
      A .pbids file describes a single data source connection, without credentials or tables, so Power BI Desktop opens the Navigator to choose the tables. A .pbit template contains the report pages, the model definition and the queries but no data, and the user connects with their own credentials. Build permission on a shared semantic model lets analysts create their own reports on it without copying its data or measures.
    fr: |
      Un fichier .pbids décrit une seule connexion de source de données, sans informations d'identification ni tables : Power BI Desktop ouvre donc le Navigateur pour choisir les tables. Un modèle .pbit contient les pages du rapport, la définition du modèle et les requêtes mais aucune donnée, et l'utilisateur se connecte avec ses propres informations d'identification. L'autorisation Build sur un modèle sémantique partagé permet aux analystes de créer leurs propres rapports sur celui-ci sans copier ses données ni ses mesures.
  options:
    pbip: { en: "A .pbip project is a source-control format for developers; it does not give each user a ready connection or a data-free starting point with their own credentials.", fr: "Un projet .pbip est un format de contrôle de code source pour les développeurs ; il ne donne pas à chaque utilisateur une connexion prête ou un point de départ sans données avec ses propres informations d'identification." }
references:
  - title: Data sources in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-data-sources
  - title: Create and Use Report Templates in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-templates
