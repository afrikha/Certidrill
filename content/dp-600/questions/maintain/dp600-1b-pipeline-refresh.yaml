id: dp600-1b-pipeline-refresh
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a deployment pipeline named Pipeline1 that has Development, Test and Production stages. Only the Development stage has a workspace. It contains an Import mode semantic model named SM-Sales and a report named Sales that uses SM-Sales.

    You deploy all the content from Development to the empty Test stage. In the Test workspace, the Sales report shows no data.

    What should you do?
  fr: |
    Vous disposez d'un pipeline de déploiement nommé Pipeline1 qui comporte les étapes Development, Test et Production. Seule l'étape Development a un espace de travail. Il contient un modèle sémantique en mode Import nommé SM-Sales et un rapport nommé Sales qui utilise SM-Sales.

    Vous déployez tout le contenu de Development vers l'étape Test vide. Dans l'espace de travail de Test, le rapport Sales n'affiche aucune donnée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Redeploy Sales and SM-Sales by using Select related.", fr: "Redéployer Sales et SM-Sales avec Select related." } }
    - { id: b, text: { en: "Create a data source rule for SM-Sales in the Test stage.", fr: "Créer une règle de source de données pour SM-Sales dans l'étape Test." } }
    - { id: c, text: { en: "Refresh SM-Sales in the Test workspace.", fr: "Actualiser SM-Sales dans l'espace de travail de Test." } }
    - { id: d, text: { en: "Make the Test stage public.", fr: "Rendre l'étape Test publique." } }
answer: { optionId: c }
explanation:
  correct:
    en: Deployment pipelines copy item metadata, not data. After the first deployment to an empty stage, the semantic model in the new workspace must be refreshed before its reports show data.
    fr: Les pipelines de déploiement copient les métadonnées des éléments, pas les données. Après le premier déploiement vers une étape vide, le modèle sémantique du nouvel espace de travail doit être actualisé avant que ses rapports affichent des données.
  options:
    a: { en: "The report is already bound to the Test copy of SM-Sales; redeploying copies metadata again, still without data.", fr: "Le rapport est déjà lié à la copie Test de SM-Sales ; redéployer copie de nouveau les métadonnées, toujours sans données." }
    b: { en: "A data source rule changes the connection used in Test; the model would still need a refresh to load data.", fr: "Une règle de source de données change la connexion utilisée en Test ; le modèle aurait toujours besoin d'une actualisation pour charger les données." }
    d: { en: "A public stage controls whether consumers without pipeline access see it as a regular workspace; it doesn't load data.", fr: "Une étape publique détermine si les consommateurs sans accès au pipeline la voient comme un espace de travail ordinaire ; cela ne charge pas de données." }
references:
  - title: The Microsoft Fabric deployment pipelines process
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/understand-the-deployment-process
