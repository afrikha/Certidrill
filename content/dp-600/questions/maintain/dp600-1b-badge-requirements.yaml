id: dp600-1b-badge-requirements
objective: "1.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Your Fabric tenant has certification and master data endorsement enabled for a security group named Governance. You manage the following items:

    - A report named PipelineReview, created by the sales team
    - A semantic model named FinanceModel, reviewed by Governance against the company's quality standards
    - A lakehouse named CustomerMaster that holds the reference list of customers used by every department

    You need to apply the appropriate endorsement to each item.

    Which endorsement should you apply to each item? To answer, drag the appropriate endorsements to the correct items. Each endorsement may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre locataire Fabric a la certification et l'approbation des données de référence activées pour un groupe de sécurité nommé Governance. Vous gérez les éléments suivants :

    - Un rapport nommé PipelineReview, créé par l'équipe commerciale
    - Un modèle sémantique nommé FinanceModel, examiné par Governance selon les normes de qualité de l'entreprise
    - Un lakehouse nommé CustomerMaster qui contient la liste de référence des clients utilisée par tous les services

    Vous devez appliquer l'approbation appropriée à chaque élément.

    Quelle approbation devez-vous appliquer à chaque élément ? Pour répondre, faites glisser les approbations appropriées vers les éléments correspondants. Chaque approbation peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: promoted, text: Promoted }
    - { id: certified, text: Certified }
    - { id: master, text: Master data }
    - { id: label, text: { en: "Sensitivity label", fr: "Étiquette de confidentialité" } }
  targets:
    - id: report
      text: { en: "PipelineReview: the sales team indicates that the report is ready to share, without a formal review", fr: "PipelineReview : l'équipe commerciale indique que le rapport est prêt à être partagé, sans examen formel" }
    - id: model
      text: { en: "FinanceModel: show that the model meets the organization's quality standards", fr: "FinanceModel : montrer que le modèle respecte les normes de qualité de l'organisation" }
    - id: lake
      text: { en: "CustomerMaster: show that the lakehouse is the single source of truth for customer data", fr: "CustomerMaster : montrer que le lakehouse est la source de vérité unique des données clients" }
answer:
  mapping: { report: promoted, model: certified, lake: master }
explanation:
  correct:
    en: Promoted means that the creators think the item is ready to share and reuse. Certified means that an authorized reviewer confirmed that the item meets the organization's quality standards. Master data marks a data item, such as a lakehouse, as core, single-source-of-truth data. A sensitivity label classifies confidentiality and is not an endorsement.
    fr: Promoted signifie que les créateurs jugent l'élément prêt à être partagé et réutilisé. Certified signifie qu'un réviseur autorisé a confirmé que l'élément respecte les normes de qualité de l'organisation. Master data désigne un élément de données, comme un lakehouse, comme source de vérité unique et centrale. Une étiquette de confidentialité classe la confidentialité et n'est pas une approbation.
references:
  - title: Endorsement overview
    url: https://learn.microsoft.com/en-us/fabric/governance/endorsement-overview
