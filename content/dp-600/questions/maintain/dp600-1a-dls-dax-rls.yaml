id: dp600-1a-dls-dax-rls
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Fabric workspace named **WS-Sales** that contains a semantic model named **SalesModel** in Import mode. SalesModel contains a table named **UserRegion** with the columns `ManagerEmail` and `RegionID`, related to the `Region` dimension and, through it, to the sales facts.

    Regional managers must see only the sales of the regions listed for them in UserRegion. The managers are members of the security group **SG-RegionalManagers**. The filter must return the same identity in Power BI Desktop and in the Power BI service.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un espace de travail Fabric nommé **WS-Sales** qui contient un modèle sémantique nommé **SalesModel** en mode Import. SalesModel contient une table nommée **UserRegion** avec les colonnes `ManagerEmail` et `RegionID`, reliée à la dimension `Region` et, par elle, aux faits de ventes.

    Les directeurs régionaux ne doivent voir que les ventes des régions qui leur sont associées dans UserRegion. Les directeurs sont membres du groupe de sécurité **SG-RegionalManagers**. Le filtre doit renvoyer la même identité dans Power BI Desktop et dans le service Power BI.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Filter of the RegionalManagers role on the UserRegion table: [ManagerEmail] = [[s1]]

      Add SG-RegionalManagers to the role from [[s2]].

      Give SG-RegionalManagers the [[s3]] role in WS-Sales so that the filter applies to them.
    fr: |
      Filtre du rôle RegionalManagers sur la table UserRegion : [ManagerEmail] = [[s1]]

      Ajoutez SG-RegionalManagers au rôle depuis [[s2]].

      Donnez à SG-RegionalManagers le rôle [[s3]] dans WS-Sales pour que le filtre s'applique à eux.
  slots:
    - id: s1
      options:
        - { id: upn, text: "USERPRINCIPALNAME()" }
        - { id: objectid, text: "USEROBJECTID()" }
        - { id: customdata, text: "CUSTOMDATA()" }
        - { id: culture, text: "USERCULTURE()" }
    - id: s2
      options:
        - { id: security, text: { en: "the Security page of SalesModel in the Power BI service", fr: "la page Sécurité de SalesModel dans le service Power BI" } }
        - { id: manageroles, text: { en: "Manage roles in Power BI Desktop", fr: "Gérer les rôles dans Power BI Desktop" } }
        - { id: manageaccess, text: { en: "the Manage access pane of WS-Sales", fr: "le volet Manage access de WS-Sales" } }
    - id: s3
      options:
        - { id: viewer, text: Viewer }
        - { id: contrib, text: Contributor }
        - { id: member, text: Member }
answer:
  values: { s1: upn, s2: security, s3: viewer }
explanation:
  correct:
    en: "`USERPRINCIPALNAME()` returns the user's UPN both in Power BI Desktop and in the service, so it matches an email-style mapping column. Roles are defined in Desktop, but members are assigned only in the service, from the semantic model's Security page. RLS filters workspace Viewers; Admin, Member and Contributor have edit permission on the model and aren't filtered."
    fr: "`USERPRINCIPALNAME()` renvoie l'UPN de l'utilisateur dans Power BI Desktop comme dans le service ; il correspond donc à une colonne de correspondance au format adresse e-mail. Les rôles sont définis dans Desktop, mais les membres ne sont attribués que dans le service, depuis la page Sécurité du modèle sémantique. La RLS filtre les Viewers de l'espace de travail ; Admin, Member et Contributor ont l'autorisation de modification sur le modèle et ne sont pas filtrés."
  options:
    objectid: { en: "USEROBJECTID() returns the Microsoft Entra object ID, which doesn't match an email column.", fr: "USEROBJECTID() renvoie l'ID d'objet Microsoft Entra, qui ne correspond pas à une colonne d'adresse e-mail." }
    customdata: { en: "CUSTOMDATA() returns a string passed by an embedding application, not the signed-in user.", fr: "CUSTOMDATA() renvoie une chaîne transmise par une application d'incorporation, pas l'utilisateur connecté." }
    manageroles: { en: "Manage roles defines roles and filters; members are added in the service.", fr: "Gérer les rôles définit les rôles et les filtres ; les membres s'ajoutent dans le service." }
    contrib: { en: "Contributors have edit permission on the model, so RLS doesn't filter them.", fr: "Les Contributors ont l'autorisation de modification sur le modèle : la RLS ne les filtre pas." }
references:
  - title: Row-level security (RLS) with Power BI
    url: https://learn.microsoft.com/en-us/fabric/security/service-admin-row-level-security
