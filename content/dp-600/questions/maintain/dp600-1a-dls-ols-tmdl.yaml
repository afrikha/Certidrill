id: dp600-1a-dls-ols-tmdl
objective: "1.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a semantic model named **HRModel** in Import mode. The table `Employee` contains a column named `Salary`.

    Members of a role named **HRRestricted** must use every report based on HRModel, but the `Salary` column and its metadata must not exist for them. You decide to configure the role in the TMDL view of Power BI Desktop.

    How should you complete the TMDL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un modèle sémantique nommé **HRModel** en mode Import. La table `Employee` contient une colonne nommée `Salary`.

    Les membres d'un rôle nommé **HRRestricted** doivent utiliser tous les rapports basés sur HRModel, mais la colonne `Salary` et ses métadonnées ne doivent pas exister pour eux. Vous décidez de configurer le rôle dans la vue TMDL de Power BI Desktop.

    Comment devez-vous compléter le script TMDL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    createOrReplace

        role HRRestricted
            modelPermission: [[s1]]

            tablePermission Employee
                columnPermission Salary
                    [[s2]]: [[s3]]
  slots:
    - id: s1
      options:
        - { id: read, text: read }
        - { id: none, text: none }
        - { id: administrator, text: administrator }
    - id: s2
      options:
        - { id: metadata, text: metadataPermission }
        - { id: filter, text: filterExpression }
        - { id: column, text: columnPermission }
    - id: s3
      options:
        - { id: none, text: none }
        - { id: read, text: read }
        - { id: default, text: default }
answer:
  values: { s1: read, s2: metadata, s3: none }
explanation:
  correct:
    en: "Object-level security is defined in model roles. The role keeps `modelPermission: read` so its members can query the model, and `metadataPermission: none` on the column hides `Salary` and its metadata, as if it didn't exist. A visual that uses the column returns an error for these users."
    fr: "La sécurité au niveau de l'objet se définit dans les rôles du modèle. Le rôle conserve `modelPermission: read` pour que ses membres puissent interroger le modèle, et `metadataPermission: none` sur la colonne masque `Salary` et ses métadonnées, comme si elle n'existait pas. Un visuel qui utilise la colonne renvoie une erreur pour ces utilisateurs."
  options:
    none: { en: "`modelPermission: none` would deny the whole model to the role members.", fr: "`modelPermission: none` refuserait tout le modèle aux membres du rôle." }
    administrator: { en: "administrator gives full control of the model, which is far more than reading reports requires.", fr: "administrator donne le contrôle total du modèle, bien plus que ne le demande la lecture de rapports." }
    filter: { en: "filterExpression defines a row filter (RLS) on a table; it can't hide a column.", fr: "filterExpression définit un filtre de lignes (RLS) sur une table ; il ne peut pas masquer de colonne." }
    read: { en: "`metadataPermission: read` leaves the column visible.", fr: "`metadataPermission: read` laisse la colonne visible." }
references:
  - title: Object-level security (OLS)
    url: https://learn.microsoft.com/en-us/fabric/security/service-admin-object-level-security
