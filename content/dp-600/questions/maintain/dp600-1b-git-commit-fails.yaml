id: dp600-1b-git-commit-fails
objective: "1.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Ops that is connected to the main branch of an Azure DevOps repository named Repo1. User1 has the Contributor role in Ops and write permission on all the items of Ops.

    User1 can update Ops from Git without errors, but User1 can't commit changes to main. No item is in conflict.

    Which two issues could cause the problem?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Ops connecté à la branche main d'un référentiel Azure DevOps nommé Repo1. User1 a le rôle Contributor dans Ops et l'autorisation d'écriture sur tous les éléments d'Ops.

    User1 peut mettre à jour Ops depuis Git sans erreur, mais ne peut pas valider de modifications dans main. Aucun élément n'est en conflit.

    Quels sont les deux problèmes qui pourraient en être la cause ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "User1 has the Read permission on Repo1 but not the Contribute permission.", fr: "User1 a l'autorisation Read sur Repo1 mais pas l'autorisation Contribute." } }
    - { id: b, text: { en: "User1 doesn't have the Admin role in Ops.", fr: "User1 n'a pas le rôle Admin dans Ops." } }
    - { id: c, text: { en: "The Allow users with at least Contributor role to change Git branch setting is disabled in Ops.", fr: "Le paramètre Allow users with at least Contributor role to change Git branch est désactivé dans Ops." } }
    - { id: d, text: { en: "A branch policy on main requires changes to go through pull requests.", fr: "Une stratégie de branche sur main impose de passer par des demandes de tirage." } }
    - { id: e, text: { en: "User1 doesn't have the Create branch permission on Repo1.", fr: "User1 n'a pas l'autorisation Create branch sur Repo1." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Updating needs the Contributor role and Read on the repository, which User1 has. Committing additionally needs the Contribute permission in Git and a branch policy that allows direct commits, so a missing Contribute permission or a pull-request-only policy on main blocks the commit.
    fr: La mise à jour demande le rôle Contributor et Read sur le référentiel, ce que User1 possède. La validation demande en plus l'autorisation Contribute dans Git et une stratégie de branche qui autorise les validations directes ; l'absence de Contribute ou une stratégie qui impose les demandes de tirage sur main bloque donc la validation.
  options:
    b: { en: "Committing requires the Contributor role with write permission on the items, not the Admin role.", fr: "La validation demande le rôle Contributor avec l'autorisation d'écriture sur les éléments, pas le rôle Admin." }
    c: { en: "This setting controls switching and creating branches, not committing to the connected branch.", fr: "Ce paramètre contrôle le changement et la création de branches, pas la validation dans la branche connectée." }
    e: { en: "Create branch is needed to branch out or create a branch, not to commit to an existing branch.", fr: "Create branch est nécessaire pour créer une branche ou utiliser Branch out, pas pour valider dans une branche existante." }
references:
  - title: Git integration process
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process
