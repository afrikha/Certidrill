id: dp600-1b-endorse-dashboard
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1. You have the Admin role in Workspace1. Workspace1 contains the following items:

    - A lakehouse named Lakehouse1
    - A notebook named Notebook1
    - A paginated report named Invoices
    - A Power BI dashboard named ExecDashboard

    You plan to promote each item.

    Which item can't you promote?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1. Vous avez le rôle Admin dans Workspace1. Workspace1 contient les éléments suivants :

    - Un lakehouse nommé Lakehouse1
    - Un notebook nommé Notebook1
    - Un rapport paginé nommé Invoices
    - Un tableau de bord Power BI nommé ExecDashboard

    Vous prévoyez de promouvoir chacun de ces éléments.

    Quel élément ne pouvez-vous pas promouvoir ?
body:
  options:
    - { id: a, text: Lakehouse1 }
    - { id: b, text: ExecDashboard }
    - { id: c, text: Notebook1 }
    - { id: d, text: Invoices }
answer: { optionId: b }
explanation:
  correct:
    en: All Fabric and Power BI items can be promoted or certified except Power BI dashboards. As a workspace Admin you have write permission on the other three items, so you can promote them.
    fr: Tous les éléments Fabric et Power BI peuvent être promus ou certifiés, sauf les tableaux de bord Power BI. En tant qu'Admin de l'espace de travail, vous avez l'autorisation d'écriture sur les trois autres éléments et pouvez donc les promouvoir.
  options:
    a: { en: "A lakehouse is a Fabric item and can be promoted by any user with write permission on it.", fr: "Un lakehouse est un élément Fabric et peut être promu par tout utilisateur qui a l'autorisation d'écriture sur lui." }
    c: { en: "Notebooks are Fabric items and support endorsement.", fr: "Les notebooks sont des éléments Fabric et prennent en charge l'approbation." }
    d: { en: "Paginated reports are Power BI items other than dashboards, so they can be promoted.", fr: "Les rapports paginés sont des éléments Power BI autres que des tableaux de bord : ils peuvent être promus." }
references:
  - title: Endorsement overview
    url: https://learn.microsoft.com/en-us/fabric/governance/endorsement-overview
