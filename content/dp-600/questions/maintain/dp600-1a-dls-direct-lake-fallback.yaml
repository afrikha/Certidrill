id: dp600-1a-dls-direct-lake-fallback
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a Fabric warehouse named **WH-Flights** and a semantic model named **FlightsModel** that uses Direct Lake on SQL over WH-Flights. Fallback to DirectQuery is enabled.

    You plan to add security so that report users see only part of the data. You must avoid changes that make FlightsModel queries fall back to DirectQuery.

    Which two security features, if defined in WH-Flights, would make the queries of FlightsModel fall back to DirectQuery?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un entrepôt Fabric nommé **WH-Flights** et d'un modèle sémantique nommé **FlightsModel** qui utilise Direct Lake sur SQL au-dessus de WH-Flights. Le basculement vers DirectQuery est activé.

    Vous prévoyez d'ajouter une sécurité pour que les utilisateurs des rapports ne voient qu'une partie des données. Vous devez éviter les modifications qui font basculer les requêtes de FlightsModel en DirectQuery.

    Quelles sont les deux fonctionnalités de sécurité qui, définies dans WH-Flights, feraient basculer les requêtes de FlightsModel en DirectQuery ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A security policy with a filter predicate on a fact table", fr: "Une stratégie de sécurité avec un prédicat de filtre sur une table de faits" } }
    - { id: b, text: { en: "A sensitivity label applied to WH-Flights", fr: "Une étiquette de confidentialité appliquée à WH-Flights" } }
    - { id: c, text: { en: "A GRANT SELECT statement on a subset of the columns of a table", fr: "Une instruction GRANT SELECT sur une partie des colonnes d'une table" } }
    - { id: d, text: { en: "The Certified endorsement of WH-Flights", fr: "L'approbation Certified de WH-Flights" } }
    - { id: e, text: { en: "A workspace role assignment that gives report authors the Contributor role", fr: "Une attribution de rôle d'espace de travail qui donne aux auteurs de rapports le rôle Contributor" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Row-level security (a security policy) and column-level security (GRANT on a column list) are enforced by the warehouse engine. Direct Lake on SQL can't apply them when it reads the Delta files directly, so the queries fall back to DirectQuery. To keep Direct Lake, define the restrictions in the semantic model instead."
    fr: "La sécurité au niveau des lignes (une stratégie de sécurité) et la sécurité au niveau des colonnes (GRANT sur une liste de colonnes) sont appliquées par le moteur de l'entrepôt. Direct Lake sur SQL ne peut pas les appliquer en lisant directement les fichiers Delta : les requêtes basculent en DirectQuery. Pour garder Direct Lake, définissez plutôt les restrictions dans le modèle sémantique."
  options:
    b: { en: "A sensitivity label classifies the item and protects exports; it doesn't change how Direct Lake reads data.", fr: "Une étiquette de confidentialité classe l'élément et protège les exportations ; elle ne change pas la façon dont Direct Lake lit les données." }
    d: { en: "Endorsement only marks the item as trustworthy.", fr: "L'approbation signale seulement que l'élément est fiable." }
    e: { en: "Workspace roles control access to items; they don't trigger fallback.", fr: "Les rôles d'espace de travail contrôlent l'accès aux éléments ; ils ne déclenchent pas de basculement." }
references:
  - title: Column-level security in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/column-level-security
  - title: Row-level security in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/row-level-security
