id: dp600-1a-lbl-downstream-auto
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has two Fabric workspaces. **WS-Central** contains a semantic model named **CustomerModel**. **WS-Regions** contains 30 reports built on CustomerModel; their labels were applied automatically when they were created. A data steward named Sara is a Member of WS-Central and a Viewer of WS-Regions.

    The tenant setting **Automatically apply sensitivity labels to downstream content** is disabled. When Sara changes the label of CustomerModel, with the consent checkbox selected, the reports in WS-Regions keep their previous label.

    Future label changes on CustomerModel must reach all the downstream reports. Sara's permissions must not change. What should you do?
  fr: |
    Contoso dispose de deux espaces de travail Fabric. **WS-Central** contient un modèle sémantique nommé **CustomerModel**. **WS-Regions** contient 30 rapports basés sur CustomerModel ; leurs étiquettes ont été appliquées automatiquement lors de leur création. Une gestionnaire de données nommée Sara est Member de WS-Central et Viewer de WS-Regions.

    Le paramètre de locataire **Automatically apply sensitivity labels to downstream content** est désactivé. Quand Sara change l'étiquette de CustomerModel en laissant cochée la case de consentement, les rapports de WS-Regions conservent leur étiquette précédente.

    Les futures modifications d'étiquette de CustomerModel doivent atteindre tous les rapports en aval. Les autorisations de Sara ne doivent pas changer. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Ask a Fabric administrator to enable Apply sensitivity labels from data sources to their data in Power BI", fr: "Demander à un administrateur Fabric d'activer Apply sensitivity labels from data sources to their data in Power BI" } }
    - { id: b, text: { en: "Ask a Fabric administrator to enable Automatically apply sensitivity labels to downstream content", fr: "Demander à un administrateur Fabric d'activer Automatically apply sensitivity labels to downstream content" } }
    - { id: c, text: { en: "Grant Sara the Build permission on CustomerModel", fr: "Accorder à Sara l'autorisation Build sur CustomerModel" } }
    - { id: d, text: { en: "Endorse CustomerModel as Certified", fr: "Approuver CustomerModel comme Certified" } }
answer: { optionId: b }
explanation:
  correct:
    en: "In the default user consent mode, a label propagates to a downstream item only if the user has edit permission on that item; Sara is only a Viewer of WS-Regions. Fully automated downstream inheritance, enabled by this tenant setting, propagates labels without the checkbox and ignores the user's edit permissions on the downstream items."
    fr: "Dans le mode par défaut avec consentement de l'utilisateur, une étiquette ne se propage à un élément en aval que si l'utilisateur dispose de l'autorisation de modification sur cet élément ; Sara n'est que Viewer de WS-Regions. L'héritage en aval entièrement automatisé, activé par ce paramètre de locataire, propage les étiquettes sans case à cocher et ignore les autorisations de modification de l'utilisateur sur les éléments en aval."
  options:
    a: { en: "This setting makes semantic models inherit labels from labeled data sources, not from parent items.", fr: "Ce paramètre fait hériter aux modèles sémantiques les étiquettes de sources de données étiquetées, pas d'éléments parents." }
    c: { en: "Build on the model gives no edit permission on the downstream reports.", fr: "Build sur le modèle ne donne aucune autorisation de modification sur les rapports en aval." }
    d: { en: "Endorsement has no effect on label propagation.", fr: "L'approbation n'a aucun effet sur la propagation des étiquettes." }
references:
  - title: Sensitivity label downstream inheritance
    url: https://learn.microsoft.com/en-us/fabric/governance/service-security-sensitivity-label-downstream-inheritance
