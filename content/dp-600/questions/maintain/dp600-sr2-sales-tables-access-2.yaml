id: dp600-sr2-sales-tables-access-2
objective: "1.1.2"
type: series_yesno
series: dp600-sr2-sales-tables-access
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You share WH-Finance without additional permissions and run GRANT statements.
  fr: Vous partagez WH-Finance sans autorisation supplémentaire et exécutez des instructions GRANT.
body:
  solution:
    en: |
      You share **WH-Finance** with Auditor1 without selecting any additional permission check box. You then run the following statements in WH-Finance.

      ```sql
      GRANT SELECT ON OBJECT::dbo.FactSales TO [auditor1@fabrikam.com];
      GRANT SELECT ON OBJECT::dbo.DimProduct TO [auditor1@fabrikam.com];
      ```
    fr: |
      Vous partagez **WH-Finance** avec Auditor1 sans cocher aucune case d'autorisation supplémentaire. Vous exécutez ensuite les instructions suivantes dans WH-Finance.

      ```sql
      GRANT SELECT ON OBJECT::dbo.FactSales TO [auditor1@fabrikam.com];
      GRANT SELECT ON OBJECT::dbo.DimProduct TO [auditor1@fabrikam.com];
      ```
answer: { value: true }
explanation:
  correct:
    en: A share without additional permissions gives only the Read item permission, which is equivalent to CONNECT and lets Auditor1 connect to WH-Finance and nothing else of the workspace. The GRANT statements then allow SELECT on the two tables only, which is the documented way to give granular access with the least privilege.
    fr: "Un partage sans autorisation supplémentaire donne uniquement l'autorisation d'élément Read, équivalente à CONNECT : Auditor1 peut se connecter à WH-Finance et à rien d'autre dans l'espace de travail. Les instructions GRANT autorisent ensuite SELECT sur les deux tables seulement, ce qui est la méthode documentée pour donner un accès granulaire avec le moindre privilège."
references:
  - title: Share Your Warehouse and Manage Permissions
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions
  - title: SQL granular permissions in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/sql-granular-permissions
