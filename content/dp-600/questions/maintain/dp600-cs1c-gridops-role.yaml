id: dp600-cs1c-gridops-role
objective: "1.1.1"
type: single
caseStudy: dp600-cs1c-litware-energy
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the access requirement for SG-GridOps. The solution must follow the principle of least privilege. Which role should you assign to SG-GridOps in LE-Grid?
  fr: |
    Vous devez satisfaire l'exigence d'accès concernant SG-GridOps. La solution doit respecter le principe des privilèges minimum. Quel rôle devez-vous attribuer à SG-GridOps dans LE-Grid ?
body:
  options:
    - { id: a, text: Admin }
    - { id: b, text: Member }
    - { id: c, text: Contributor }
    - { id: d, text: Viewer }
answer: { optionId: c }
explanation:
  correct:
    en: Contributor can create, edit and delete items such as KQL querysets and Real-Time dashboards, but can't add people to the workspace. It is the lowest workspace role that allows writing items.
    fr: Contributor peut créer, modifier et supprimer des éléments comme des ensembles de requêtes KQL et des tableaux de bord en temps réel, mais ne peut pas ajouter de personnes à l'espace de travail. C'est le rôle d'espace de travail le plus faible qui permet d'écrire des éléments.
  options:
    a:
      en: Admin can add or remove people, including other admins, which the requirement forbids.
      fr: Admin peut ajouter ou supprimer des personnes, y compris d'autres administrateurs, ce que l'exigence interdit.
    b:
      en: Member can add members or users with lower permissions, which the requirement forbids.
      fr: Member peut ajouter des membres ou des utilisateurs ayant des autorisations inférieures, ce que l'exigence interdit.
    d:
      en: Viewer can read KQL querysets and Real-Time dashboards but can't create or modify them.
      fr: Viewer peut lire les ensembles de requêtes KQL et les tableaux de bord en temps réel, mais ne peut ni les créer ni les modifier.
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
