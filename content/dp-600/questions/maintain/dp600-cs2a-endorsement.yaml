id: dp600-cs2a-endorsement
objective: "1.1.5"
type: single
caseStudy: dp600-cs2a-coho-vineyard
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the endorsement requirement for SM-Harvest.

    What should you do first?
  fr: |
    Vous devez respecter l'exigence d'approbation de SM-Harvest.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Assign the data governance lead the Admin role on WS-Vineyard, and then promote SM-Harvest.", fr: "Attribuer au responsable de la gouvernance des données le rôle Admin sur WS-Vineyard, puis promouvoir SM-Harvest." }
    - id: b
      text: { en: "Apply a sensitivity label to SM-Harvest, and then let the data governance lead change it.", fr: "Appliquer une étiquette de confidentialité à SM-Harvest, puis laisser le responsable de la gouvernance des données la modifier." }
    - id: c
      text: { en: "Ask a Fabric administrator to enable certification and to specify the data governance lead as a reviewer.", fr: "Demander à un administrateur Fabric d'activer la certification et de désigner le responsable de la gouvernance des données comme réviseur." }
    - id: d
      text: { en: "Remove the Contributor role of the data analysts, and then let the data governance lead promote SM-Harvest.", fr: "Retirer le rôle Contributor des analystes de données, puis laisser le responsable de la gouvernance des données promouvoir SM-Harvest." }
answer:
  optionId: c
explanation:
  correct:
    en: "The Certified badge states that an item is authoritative and meets the organization's quality standards. Certification is available only after a Fabric administrator enables it, and only the users that the administrator specifies can certify items, which limits the badge to the data governance lead."
    fr: "Le badge Certified indique qu'un élément fait autorité et répond aux normes de qualité de l'organisation. La certification n'est disponible qu'après son activation par un administrateur Fabric, et seuls les utilisateurs désignés par l'administrateur peuvent certifier des éléments, ce qui limite le badge au responsable de la gouvernance des données."
  options:
    a:
      en: "Any user with write permission on an item can promote it, so the data engineer and the data analysts could also apply the Promoted badge, which is not a quality review."
      fr: "Tout utilisateur disposant d'une autorisation d'écriture sur un élément peut le promouvoir : l'ingénieur données et les analystes pourraient donc aussi appliquer le badge Promoted, qui n'est pas une revue de qualité."
    b:
      en: "A sensitivity label classifies how confidential the data is; it is not an endorsement badge."
      fr: "Une étiquette de confidentialité classe le niveau de confidentialité des données ; ce n'est pas un badge d'approbation."
    d:
      en: "The data engineer, who is Admin, could still promote the model, and the Promoted badge does not certify quality."
      fr: "L'ingénieur données, qui est Admin, pourrait toujours promouvoir le modèle, et le badge Promoted ne certifie pas la qualité."
references:
  - title: Endorsement overview
    url: https://learn.microsoft.com/en-us/fabric/governance/endorsement-overview
