id: dp600-1a-ws-add-people-role
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a Fabric workspace named **WS-Finance**. A project lead named Ben must be able to add colleagues to WS-Finance as Contributors or Viewers, and to create and edit items.

    Ben must not be able to delete WS-Finance or connect it to a Git repository. The solution must follow the principle of least privilege.

    Which workspace role should you assign to Ben?
  fr: |
    Fabrikam dispose d'un espace de travail Fabric nommé **WS-Finance**. Un chef de projet nommé Ben doit pouvoir ajouter des collègues à WS-Finance en tant que Contributors ou Viewers, et créer et modifier des éléments.

    Ben ne doit pas pouvoir supprimer WS-Finance ni le connecter à un référentiel Git. La solution doit respecter le principe du privilège minimum.

    Quel rôle d'espace de travail devez-vous attribuer à Ben ?
body:
  options:
    - { id: a, text: Admin }
    - { id: b, text: Contributor }
    - { id: c, text: Viewer }
    - { id: d, text: Member }
answer: { optionId: d }
explanation:
  correct:
    en: "Member can add people with the Member role or lower and can create and edit items. Deleting the workspace and connecting it to Git are reserved for Admin, so Member meets the requirement with the fewest permissions."
    fr: "Member peut ajouter des personnes avec le rôle Member ou un rôle inférieur, et créer et modifier des éléments. La suppression de l'espace de travail et sa connexion à Git sont réservées à Admin : Member répond donc au besoin avec le moins d'autorisations."
  options:
    a: { en: "Admin can delete the workspace and connect it to Git, which Ben must not be able to do.", fr: "Admin peut supprimer l'espace de travail et le connecter à Git, ce que Ben ne doit pas pouvoir faire." }
    b: { en: "Contributor can create and edit items but cannot add people to the workspace.", fr: "Contributor peut créer et modifier des éléments, mais ne peut pas ajouter de personnes à l'espace de travail." }
    c: { en: "Viewer can neither edit items nor add people.", fr: "Viewer ne peut ni modifier des éléments ni ajouter des personnes." }
references:
  - title: Give users access to workspaces
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/give-access-workspaces
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
