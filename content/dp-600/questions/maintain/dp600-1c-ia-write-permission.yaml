id: dp600-1c-ia-write-permission
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Data** that contains a lakehouse named **LH-Sales**. A data engineer named Engineer1 has the Viewer role in WS-Data.

    Engineer1 plans to change the schema of a table in LH-Sales and must run impact analysis on LH-Sales first. The impact analysis option isn't available to Engineer1.

    You need to ensure that Engineer1 can run impact analysis on LH-Sales. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Data** qui contient un lakehouse nommé **LH-Sales**. Un ingénieur Données nommé Engineer1 a le rôle Viewer dans WS-Data.

    Engineer1 prévoit de modifier le schéma d'une table de LH-Sales et doit d'abord lancer une analyse d'impact sur LH-Sales. L'option d'analyse d'impact n'est pas disponible pour Engineer1.

    Vous devez faire en sorte qu'Engineer1 puisse lancer l'analyse d'impact sur LH-Sales. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign Engineer1 the Member role in WS-Data.", fr: "Attribuer à Engineer1 le rôle Member dans WS-Data." } }
    - { id: b, text: { en: "Share LH-Sales with Engineer1 and select Read all with SQL analytics endpoint.", fr: "Partager LH-Sales avec Engineer1 en sélectionnant Read all with SQL analytics endpoint." } }
    - { id: c, text: { en: "Assign Engineer1 the Contributor role in WS-Data.", fr: "Attribuer à Engineer1 le rôle Contributor dans WS-Data." } }
    - { id: d, text: { en: "Share LH-Sales with Engineer1 and select Read all with Apache Spark.", fr: "Partager LH-Sales avec Engineer1 en sélectionnant Read all with Apache Spark." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Impact analysis requires write permission on the item. The Viewer role is read-only; Contributor is the lowest workspace role that can write to the items of the workspace, so it is the least privileged way to give Engineer1 access to impact analysis."
    fr: "L'analyse d'impact exige l'autorisation d'écriture sur l'élément. Le rôle Viewer est en lecture seule ; Contributor est le rôle d'espace de travail le plus bas qui peut écrire dans les éléments de l'espace de travail : c'est donc le moyen le moins privilégié de donner à Engineer1 l'accès à l'analyse d'impact."
  options:
    a:
      en: "Member also grants write permission, but it adds the right to share items and add users, which exceeds what is needed."
      fr: "Member accorde aussi l'autorisation d'écriture, mais il ajoute le droit de partager des éléments et d'ajouter des utilisateurs, ce qui dépasse le besoin."
    b:
      en: "This sharing option gives read access to the data through the SQL analytics endpoint; lakehouse sharing never grants write permission."
      fr: "Cette option de partage donne un accès en lecture aux données par le point de terminaison d'analytique SQL ; le partage d'un lakehouse n'accorde jamais l'autorisation d'écriture."
    d:
      en: "This sharing option gives read access to the OneLake files through Spark; it doesn't give write permission on the lakehouse."
      fr: "Cette option de partage donne un accès en lecture aux fichiers OneLake par Spark ; elle ne donne pas l'autorisation d'écriture sur le lakehouse."
references:
  - title: Impact analysis
    url: https://learn.microsoft.com/en-us/fabric/governance/impact-analysis
  - title: Lakehouse sharing and permission management
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sharing
