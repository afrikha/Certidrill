id: dp600-1c-ia-retire-model
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Core** that contains a semantic model named **SM-Legacy**. You have the Admin role in WS-Core.

    You plan to delete SM-Legacy. The lineage view of WS-Core shows no report connected to SM-Legacy. Report authors in other departments use their own workspaces, and you don't have a role in most of them.

    You need to identify every item in any workspace that depends on SM-Legacy before you delete it.

    What should you use?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Core** qui contient un modèle sémantique nommé **SM-Legacy**. Vous avez le rôle Admin dans WS-Core.

    Vous prévoyez de supprimer SM-Legacy. La vue de traçabilité de WS-Core n'affiche aucun rapport connecté à SM-Legacy. Les auteurs de rapports des autres services utilisent leurs propres espaces de travail, et vous n'avez aucun rôle dans la plupart d'entre eux.

    Vous devez identifier tous les éléments, dans n'importe quel espace de travail, qui dépendent de SM-Legacy avant de le supprimer.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The lineage view of WS-Core in full-screen mode", fr: "La vue de traçabilité de WS-Core en mode plein écran" } }
    - { id: b, text: { en: "The impact analysis of SM-Legacy", fr: "L'analyse d'impact de SM-Legacy" } }
    - { id: c, text: { en: "The refresh history of SM-Legacy", fr: "L'historique d'actualisation de SM-Legacy" } }
    - { id: d, text: { en: "The Monitoring hub filtered on SM-Legacy", fr: "Le hub de surveillance filtré sur SM-Legacy" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The lineage view of a workspace shows its items and their upstream sources, but downstream items in other workspaces aren't shown. Impact analysis of SM-Legacy lists the dependent items and workspaces, including items in workspaces where you have no role, which appear under limited access."
    fr: "La vue de traçabilité d'un espace de travail montre ses éléments et leurs sources en amont, mais pas les éléments en aval situés dans d'autres espaces de travail. L'analyse d'impact de SM-Legacy liste les éléments et espaces de travail dépendants, y compris les éléments des espaces de travail où vous n'avez aucun rôle, qui apparaissent en accès limité."
  options:
    a:
      en: "Full-screen mode changes only the display; the lineage view still doesn't show downstream items in other workspaces."
      fr: "Le mode plein écran ne change que l'affichage ; la vue de traçabilité n'affiche toujours pas les éléments en aval des autres espaces de travail."
    c:
      en: "The refresh history lists refresh operations of the model, not the reports that connect to it."
      fr: "L'historique d'actualisation liste les opérations d'actualisation du modèle, pas les rapports qui s'y connectent."
    d:
      en: "The Monitoring hub shows activity runs such as refreshes, not the dependencies between items."
      fr: "Le hub de surveillance montre des exécutions d'activités, comme les actualisations, pas les dépendances entre éléments."
references:
  - title: Lineage in Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/lineage
  - title: Impact analysis
    url: https://learn.microsoft.com/en-us/fabric/governance/impact-analysis
