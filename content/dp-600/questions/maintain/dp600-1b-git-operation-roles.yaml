id: dp600-1b-git-operation-roles
objective: "1.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Data-Dev that you plan to connect to an Azure DevOps repository. The Allow users with at least Contributor role to change Git branch setting is disabled in Data-Dev. All users have the Git permissions that each operation requires.

    You need to identify the lowest workspace role that allows each Git operation.

    Which role should you identify for each operation? To answer, drag the appropriate roles to the correct operations. Each role may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Data-Dev que vous prévoyez de connecter à un référentiel Azure DevOps. Le paramètre Allow users with at least Contributor role to change Git branch est désactivé dans Data-Dev. Tous les utilisateurs ont les autorisations Git que chaque opération demande.

    Vous devez identifier le rôle d'espace de travail le plus faible qui permet chaque opération Git.

    Quel rôle devez-vous identifier pour chaque opération ? Pour répondre, faites glisser les rôles appropriés vers les opérations correspondantes. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: viewer, text: Viewer }
    - { id: contrib, text: Contributor }
    - { id: member, text: Member }
    - { id: admin, text: Admin }
  targets:
    - id: connect
      text: { en: "Connect Data-Dev to a branch of the repository", fr: "Connecter Data-Dev à une branche du référentiel" }
    - id: update
      text: { en: "Update Data-Dev from Git", fr: "Mettre à jour Data-Dev depuis Git" }
    - id: branchout
      text: { en: "Branch out to another workspace", fr: "Créer une branche vers un autre espace de travail (Branch out)" }
    - id: switch
      text: { en: "Switch Data-Dev to another branch", fr: "Basculer Data-Dev vers une autre branche" }
answer:
  mapping: { connect: admin, update: contrib, branchout: contrib, switch: admin }
explanation:
  correct:
    en: Connecting a workspace is reserved to its Admins, and so is switching branches while the setting is disabled. Updating from Git requires the Contributor role with write permission on the items, and Branch out to another workspace is available to Contributors and higher. Viewers can't perform any Git action.
    fr: La connexion d'un espace de travail est réservée à ses Admins, comme le changement de branche tant que le paramètre est désactivé. La mise à jour depuis Git demande le rôle Contributor avec l'autorisation d'écriture sur les éléments, et Branch out vers un autre espace de travail est disponible à partir de Contributor. Les Viewers ne peuvent effectuer aucune action Git.
references:
  - title: Git integration process
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process
