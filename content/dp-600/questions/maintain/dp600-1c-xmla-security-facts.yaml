id: dp600-1c-xmla-security-facts
objective: "1.2.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You manage a semantic model named **SM-Payroll** through the XMLA endpoint of a Fabric workspace. The capacity has the XMLA Endpoint setting set to **Read Write**, and you have the Admin role in the workspace. SM-Payroll has row-level security roles.

    You plan to manage the roles and test them by using SQL Server Management Studio and TMSL scripts.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez un modèle sémantique nommé **SM-Payroll** par le point de terminaison XMLA d'un espace de travail Fabric. La capacité a le paramètre XMLA Endpoint défini sur **Read Write**, et vous avez le rôle Admin dans l'espace de travail. SM-Payroll comporte des rôles de sécurité au niveau des lignes.

    Vous prévoyez de gérer les rôles et de les tester avec SQL Server Management Studio et des scripts TMSL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To impersonate a user by using the EffectiveUserName connection property, the user must have both the Read and Build permissions on SM-Payroll.
        fr: Pour emprunter l'identité d'un utilisateur avec la propriété de connexion EffectiveUserName, l'utilisateur doit avoir à la fois les autorisations Read et Build sur SM-Payroll.
    - id: s2
      text:
        en: A TMSL script can give a model role of SM-Payroll the Read and Process permission.
        fr: Un script TMSL peut attribuer à un rôle de modèle de SM-Payroll l'autorisation Read and Process.
    - id: s3
      text:
        en: A TMSL script can add a service principal as a member of a row-level security role of SM-Payroll.
        fr: Un script TMSL peut ajouter un principal de service comme membre d'un rôle de sécurité au niveau des lignes de SM-Payroll.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "An impersonation with EffectiveUserName fails unless the account is in Microsoft Entra ID and has both Read and Build on the model. Read is the only model role permission that can be set through the XMLA endpoint; other permissions follow the Power BI security model. Service principals don't work with RLS and OLS and can't be added as model role members."
    fr: "Un emprunt d'identité avec EffectiveUserName échoue si le compte n'est pas dans Microsoft Entra ID ou n'a pas à la fois Read et Build sur le modèle. Read est la seule autorisation de rôle de modèle qui peut être définie par le point de terminaison XMLA ; les autres autorisations suivent le modèle de sécurité de Power BI. Les principaux de service ne fonctionnent pas avec la RLS et l'OLS, et ne peuvent pas être membres d'un rôle de modèle."
references:
  - title: Semantic model connectivity and management with the XMLA endpoint in Power BI
    url: https://learn.microsoft.com/en-us/fabric/enterprise/powerbi/service-premium-connect-tools
