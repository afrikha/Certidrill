id: dp600-1b-pipeline-assign-eligible
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a deployment pipeline named Pipeline1. The Test stage is empty. You plan to assign an existing workspace to it. You have the Contributor role or higher in the workspaces of the adjacent stages.

    The following workspaces are on a Fabric capacity:

    | Workspace | Your role | Other details |
    | --- | --- | --- |
    | WS-A | Member | Not assigned to any pipeline |
    | WS-B | Admin | Assigned to the Test stage of Pipeline2 |
    | WS-C | Admin | Has a template app installed |
    | WS-D | Admin | Not assigned to any pipeline |

    Which workspace can you assign to the Test stage of Pipeline1?
  fr: |
    Vous disposez d'un pipeline de déploiement nommé Pipeline1. L'étape Test est vide. Vous prévoyez de lui affecter un espace de travail existant. Vous avez le rôle Contributor ou supérieur dans les espaces de travail des étapes adjacentes.

    Les espaces de travail suivants sont sur une capacité Fabric :

    | Espace de travail | Votre rôle | Autres détails |
    | --- | --- | --- |
    | WS-A | Member | Affecté à aucun pipeline |
    | WS-B | Admin | Affecté à l'étape Test de Pipeline2 |
    | WS-C | Admin | Une application modèle y est installée |
    | WS-D | Admin | Affecté à aucun pipeline |

    Quel espace de travail pouvez-vous affecter à l'étape Test de Pipeline1 ?
body:
  options:
    - { id: a, text: WS-A }
    - { id: b, text: WS-B }
    - { id: c, text: WS-C }
    - { id: d, text: WS-D }
answer: { optionId: d }
shuffle: false
explanation:
  correct:
    en: To be assigned to a stage, a workspace must be on a Fabric capacity, you must be its Admin, it must not be assigned to another pipeline, and it must not be a template app workspace or have a template app installed. Only WS-D meets every condition.
    fr: Pour être affecté à une étape, un espace de travail doit être sur une capacité Fabric, vous devez en être Admin, il ne doit pas être affecté à un autre pipeline, et il ne doit être ni un espace de travail d'application modèle ni avoir d'application modèle installée. Seul WS-D remplit toutes les conditions.
  options:
    a: { en: "Assigning a workspace requires the Admin role in that workspace.", fr: "Affecter un espace de travail demande le rôle Admin dans cet espace de travail." }
    b: { en: "A workspace can't be assigned when it already belongs to another deployment pipeline.", fr: "Un espace de travail ne peut pas être affecté s'il appartient déjà à un autre pipeline de déploiement." }
    c: { en: "Workspaces that have a template app installed aren't eligible.", fr: "Les espaces de travail où une application modèle est installée ne sont pas éligibles." }
references:
  - title: Assign a workspace to a deployment pipeline
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/assign-pipeline
