id: dp600-1a-ws-roles-dragdrop
objective: "1.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware has a Fabric workspace named **WS-Core** that contains a warehouse named **WH-Core** and a lakehouse named **LH-Raw**. You need to give four users the following capabilities in WS-Core.

    Which workspace role should you assign to each user? Each user must receive the least privileged role that provides the capability. To answer, drag the appropriate roles to the correct users. Each role may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un espace de travail Fabric nommé **WS-Core** qui contient un entrepôt nommé **WH-Core** et un lakehouse nommé **LH-Raw**. Vous devez donner à quatre utilisateurs les capacités suivantes dans WS-Core.

    Quel rôle d'espace de travail devez-vous attribuer à chaque utilisateur ? Chaque utilisateur doit recevoir le rôle le moins privilégié qui fournit la capacité. Pour répondre, faites glisser les rôles appropriés vers les utilisateurs correspondants. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: admin, text: Admin }
    - { id: member, text: Member }
    - { id: contrib, text: Contributor }
    - { id: viewer, text: Viewer }
  targets:
    - id: t1
      text: { en: "User1: delete WS-Core when the project ends", fr: "User1 : supprimer WS-Core à la fin du projet" }
    - id: t2
      text: { en: "User2: create a mirrored database item in WS-Core", fr: "User2 : créer un élément de base de données mise en miroir dans WS-Core" }
    - id: t3
      text: { en: "User3: read the files of LH-Raw in Lakehouse explorer", fr: "User3 : lire les fichiers de LH-Raw dans l'explorateur de lakehouse" }
    - id: t4
      text: { en: "User4: connect to the SQL analytics endpoint of WH-Core and read its tables", fr: "User4 : se connecter au point de terminaison d'analytique SQL de WH-Core et lire ses tables" }
answer:
  mapping: { t1: admin, t2: contrib, t3: contrib, t4: viewer }
explanation:
  correct:
    en: "Only Admin can update and delete the workspace. Creating database mirroring items and reading lakehouse data in Lakehouse explorer (ReadAll) are available from Contributor upward. Every role, including Viewer, can connect to the SQL analytics endpoint and read data with T-SQL (ReadData)."
    fr: "Seul Admin peut mettre à jour et supprimer l'espace de travail. La création d'éléments de mise en miroir de base de données et la lecture des données d'un lakehouse dans l'explorateur de lakehouse (ReadAll) sont possibles à partir de Contributor. Tous les rôles, Viewer compris, peuvent se connecter au point de terminaison d'analytique SQL et lire les données en T-SQL (ReadData)."
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
