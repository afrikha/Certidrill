id: dp600-1b-master-data-item
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your Fabric administrator has enabled master data endorsement and authorized you to apply the Master data badge. You have the Admin role in a workspace named Reference that contains the following items:

    - A report named ProductCatalog
    - A notebook named LoadProducts
    - A pipeline named NightlyLoad
    - A lakehouse named ProductsLH that stores the official product codes

    You need to apply the Master data badge.

    To which item can you apply the badge?
  fr: |
    Votre administrateur Fabric a activé l'approbation des données de référence et vous a autorisé à appliquer le badge Master data. Vous avez le rôle Admin dans un espace de travail nommé Reference qui contient les éléments suivants :

    - Un rapport nommé ProductCatalog
    - Un notebook nommé LoadProducts
    - Un pipeline nommé NightlyLoad
    - Un lakehouse nommé ProductsLH qui stocke les codes produits officiels

    Vous devez appliquer le badge Master data.

    À quel élément pouvez-vous appliquer le badge ?
body:
  options:
    - { id: a, text: ProductsLH }
    - { id: b, text: ProductCatalog }
    - { id: c, text: LoadProducts }
    - { id: d, text: NightlyLoad }
answer: { optionId: a }
explanation:
  correct:
    en: The Master data badge applies only to items that contain data, such as lakehouses and semantic models. It marks the item as a core, single source of truth, such as product codes or customer lists.
    fr: Le badge Master data ne s'applique qu'aux éléments qui contiennent des données, comme les lakehouses et les modèles sémantiques. Il désigne l'élément comme source de vérité unique et centrale, par exemple pour des codes produits ou des listes de clients.
  options:
    b: { en: "A report displays data from a semantic model but is not a data item; it can be promoted or certified, not marked as master data.", fr: "Un rapport affiche les données d'un modèle sémantique mais n'est pas un élément de données ; il peut être promu ou certifié, pas désigné comme données de référence." }
    c: { en: "A notebook contains code, not data, so it isn't eligible for the Master data badge.", fr: "Un notebook contient du code, pas des données : il n'est pas éligible au badge Master data." }
    d: { en: "A pipeline orchestrates activities and does not contain data.", fr: "Un pipeline orchestre des activités et ne contient pas de données." }
references:
  - title: Endorse Fabric and Power BI items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/endorsement-promote-certify
