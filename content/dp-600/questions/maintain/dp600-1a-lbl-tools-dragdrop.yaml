id: dp600-1a-lbl-tools-dragdrop
objective: "1.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is rolling out sensitivity labels for its Fabric and Power BI content. Four tasks must be performed.

    Which tool should you use for each task? To answer, drag the appropriate tools to the correct tasks. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders déploie des étiquettes de confidentialité pour son contenu Fabric et Power BI. Quatre tâches doivent être effectuées.

    Quel outil devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les outils appropriés vers les tâches correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: purview, text: { en: "Microsoft Purview portal", fr: "Portail Microsoft Purview" } }
    - { id: adminportal, text: { en: "Fabric admin portal (tenant settings)", fr: "Portail d'administration Fabric (paramètres de locataire)" } }
    - { id: desktop, text: Power BI Desktop }
    - { id: catalog, text: { en: "OneLake catalog (Govern tab)", fr: "Catalogue OneLake (onglet Govern)" } }
    - { id: wssettings, text: { en: "Workspace settings", fr: "Paramètres de l'espace de travail" } }
    - { id: entra, text: { en: "Microsoft Entra admin center", fr: "Centre d'administration Microsoft Entra" } }
  targets:
    - id: t1
      text: { en: "Create the Highly Confidential label and its encryption settings", fr: "Créer l'étiquette Highly Confidential et ses paramètres de chiffrement" }
    - id: t2
      text: { en: "Specify which users can apply labels to Fabric content", fr: "Indiquer quels utilisateurs peuvent appliquer des étiquettes au contenu Fabric" }
    - id: t3
      text: { en: "Label a .pbix file before it's published", fr: "Étiqueter un fichier .pbix avant sa publication" }
    - id: t4
      text: { en: "Identify the unlabeled items and review label coverage across Fabric", fr: "Identifier les éléments sans étiquette et examiner la couverture des étiquettes dans Fabric" }
answer:
  mapping: { t1: purview, t2: adminportal, t3: desktop, t4: catalog }
explanation:
  correct:
    en: "Sensitivity labels and their protection are created in the Microsoft Purview portal. Enabling labels for Fabric and choosing who can apply them is a tenant setting of the Fabric admin portal. Power BI Desktop applies labels to .pbix files. The governance experiences of the OneLake catalog show labeled and unlabeled items and label coverage."
    fr: "Les étiquettes de confidentialité et leur protection se créent dans le portail Microsoft Purview. L'activation des étiquettes pour Fabric et le choix des utilisateurs qui peuvent les appliquer sont un paramètre de locataire du portail d'administration Fabric. Power BI Desktop applique des étiquettes aux fichiers .pbix. Les expériences de gouvernance du catalogue OneLake montrent les éléments étiquetés et non étiquetés et la couverture des étiquettes."
  options:
    wssettings: { en: "Workspace settings don't define or enable sensitivity labels.", fr: "Les paramètres de l'espace de travail ne définissent ni n'activent les étiquettes de confidentialité." }
    entra: { en: "Microsoft Entra ID manages identities and groups, not sensitivity labels.", fr: "Microsoft Entra ID gère les identités et les groupes, pas les étiquettes de confidentialité." }
references:
  - title: Information protection in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/information-protection
  - title: Sensitivity labels in Power BI
    url: https://learn.microsoft.com/en-us/fabric/enterprise/powerbi/service-security-sensitivity-label-overview
