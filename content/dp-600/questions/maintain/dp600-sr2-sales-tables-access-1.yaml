id: dp600-sr2-sales-tables-access-1
objective: "1.1.2"
type: series_yesno
series: dp600-sr2-sales-tables-access
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You share WH-Finance with Read all data using SQL.
  fr: Vous partagez WH-Finance avec Read all data using SQL.
body:
  solution:
    en: You share **WH-Finance** with Auditor1 and select the **Read all data using SQL** check box in the share dialog.
    fr: Vous partagez **WH-Finance** avec Auditor1 et cochez la case **Read all data using SQL** dans la boîte de dialogue de partage.
answer: { value: false }
explanation:
  correct:
    en: Sharing the warehouse gives access to WH-Finance only, not to the other items of the workspace. However, Read all data using SQL grants the ReadData permission, which lets the recipient read every table and view of the warehouse, so Auditor1 could query the 12 other tables.
    fr: "Le partage de l'entrepôt donne accès à WH-Finance uniquement, pas aux autres éléments de l'espace de travail. Cependant, Read all data using SQL accorde l'autorisation ReadData, qui permet au destinataire de lire toutes les tables et vues de l'entrepôt : Auditor1 pourrait interroger les 12 autres tables."
references:
  - title: Share Your Warehouse and Manage Permissions
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions
