id: dp600-1b-pipeline-permissions
objective: "1.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a deployment pipeline named Pipeline1. The Development stage is assigned to a workspace named WS-Dev, and the Test stage is empty. User1 is a pipeline admin of Pipeline1 and has the Contributor role in WS-Dev.

    User1 must perform the following tasks:

    - Assign an existing workspace named WS-Test to the Test stage.
    - Later, deploy new versions of the items from Development to Test.

    You need to grant User1 the minimum role in WS-Test that each task requires.

    Which role should you identify for each task? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline de déploiement nommé Pipeline1. L'étape Development est affectée à un espace de travail nommé WS-Dev, et l'étape Test est vide. User1 est administrateur de Pipeline1 et a le rôle Contributor dans WS-Dev.

    User1 doit effectuer les tâches suivantes :

    - Affecter un espace de travail existant nommé WS-Test à l'étape Test.
    - Plus tard, déployer de nouvelles versions des éléments de Development vers Test.

    Vous devez accorder à User1 le rôle minimal dans WS-Test que chaque tâche demande.

    Quel rôle devez-vous identifier pour chaque tâche ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Assign WS-Test to the Test stage: [[assign]]
      Deploy from Development to Test: [[deploy]]
    fr: |
      Affecter WS-Test à l'étape Test : [[assign]]
      Déployer de Development vers Test : [[deploy]]
  slots:
    - id: assign
      options:
        - { id: viewer, text: Viewer }
        - { id: contrib, text: Contributor }
        - { id: member, text: Member }
        - { id: admin, text: Admin }
    - id: deploy
      options:
        - { id: viewer, text: Viewer }
        - { id: contrib, text: Contributor }
        - { id: member, text: Member }
        - { id: admin, text: Admin }
answer:
  values: { assign: admin, deploy: contrib }
explanation:
  correct:
    en: Assigning a workspace to a stage requires being a pipeline admin and an Admin of that workspace. Deploying to a stage that already has a workspace requires being a pipeline admin and at least a Contributor in both the source and the target workspaces.
    fr: Affecter un espace de travail à une étape demande d'être administrateur du pipeline et Admin de cet espace de travail. Déployer vers une étape qui a déjà un espace de travail demande d'être administrateur du pipeline et au moins Contributor dans les espaces de travail source et cible.
  options:
    viewer: { en: "A Viewer can consume content and unassign a workspace, but can't assign or deploy.", fr: "Un Viewer peut consulter le contenu et désaffecter un espace de travail, mais ne peut ni affecter ni déployer." }
    member: { en: "Member is more than the Contributor role that deploying requires, and less than the Admin role that assigning requires.", fr: "Member dépasse le rôle Contributor que le déploiement demande, et reste en dessous du rôle Admin que l'affectation demande." }
references:
  - title: The Microsoft Fabric deployment pipelines process
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/understand-the-deployment-process
