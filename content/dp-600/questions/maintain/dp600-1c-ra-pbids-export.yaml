id: dp600-1c-ra-pbids-export
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Power BI Desktop report named **Claims.pbix** that connects to an Azure SQL database named **ClaimsDB**.

    New report authors must be able to open a file that connects them to ClaimsDB, without receiving the report or its model. The solution must minimize effort.

    What should you do in Power BI Desktop?
  fr: |
    Vous disposez d'un rapport Power BI Desktop nommé **Claims.pbix** qui se connecte à une base de données Azure SQL nommée **ClaimsDB**.

    Les nouveaux auteurs de rapports doivent pouvoir ouvrir un fichier qui les connecte à ClaimsDB, sans recevoir le rapport ni son modèle. La solution doit réduire l'effort au minimum.

    Que devez-vous faire dans Power BI Desktop ?
body:
  options:
    - { id: a, text: { en: "Export the report as a Power BI template (.pbit).", fr: "Exporter le rapport en tant que modèle Power BI (.pbit)." } }
    - { id: b, text: { en: "Save the report as a Power BI project (.pbip).", fr: "Enregistrer le rapport en tant que projet Power BI (.pbip)." } }
    - { id: c, text: { en: "In Data source settings, select ClaimsDB, and then select Export PBIDS.", fr: "Dans Paramètres de la source de données, sélectionner ClaimsDB, puis Exporter PBIDS." } }
    - { id: d, text: { en: "Copy the M code of the ClaimsDB query to a new .pbids file.", fr: "Copier le code M de la requête ClaimsDB dans un nouveau fichier .pbids." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Exporting a .pbids file from the data source settings of an existing report autogenerates a file that contains only the ClaimsDB connection. Authors who open it authenticate and select their tables in the Navigator."
    fr: "Exporter un fichier .pbids depuis les paramètres de la source de données d'un rapport existant génère automatiquement un fichier qui ne contient que la connexion à ClaimsDB. Les auteurs qui l'ouvrent s'authentifient et sélectionnent leurs tables dans le Navigateur."
  options:
    a:
      en: "A template includes the report pages and the model, which the authors must not receive."
      fr: "Un modèle de rapport inclut les pages et le modèle, que les auteurs ne doivent pas recevoir."
    b:
      en: "A project contains the full report and model definitions as text files."
      fr: "Un projet contient les définitions complètes du rapport et du modèle sous forme de fichiers texte."
    d:
      en: "A .pbids file uses a JSON connection format, not M code; writing it by hand doesn't minimize effort either."
      fr: "Un fichier .pbids utilise un format de connexion JSON, pas du code M ; l'écrire à la main ne réduit pas non plus l'effort."
references:
  - title: Data sources in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-data-sources
