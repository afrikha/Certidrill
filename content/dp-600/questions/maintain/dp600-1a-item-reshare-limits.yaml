id: dp600-1a-item-reshare-limits
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a Fabric workspace named **WS-Cards** that contains a lakehouse named **LH-Cards**. A user named Kemal has no role in WS-Cards.

    You share LH-Cards with Kemal and select **Read all with SQL analytics endpoint** and **Share**. You don't select any other permission.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un espace de travail Fabric nommé **WS-Cards** qui contient un lakehouse nommé **LH-Cards**. Un utilisateur nommé Kemal n'a aucun rôle dans WS-Cards.

    Vous partagez LH-Cards avec Kemal en sélectionnant **Read all with SQL analytics endpoint** et **Share**. Vous ne sélectionnez aucune autre autorisation.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Kemal can share LH-Cards with a colleague and grant Read all with SQL analytics endpoint.", fr: "Kemal peut partager LH-Cards avec un collègue et lui accorder Read all with SQL analytics endpoint." } }
    - { id: b, text: { en: "Kemal can share LH-Cards with a colleague and grant Read all with Apache Spark.", fr: "Kemal peut partager LH-Cards avec un collègue et lui accorder Read all with Apache Spark." } }
    - { id: c, text: { en: "Kemal can insert rows into the tables of LH-Cards.", fr: "Kemal peut insérer des lignes dans les tables de LH-Cards." } }
    - { id: d, text: { en: "Kemal can query the tables of LH-Cards through the SQL analytics endpoint.", fr: "Kemal peut interroger les tables de LH-Cards par le point de terminaison d'analytique SQL." } }
    - { id: e, text: { en: "Kemal can read the files of LH-Cards in Lakehouse explorer.", fr: "Kemal peut lire les fichiers de LH-Cards dans l'explorateur de lakehouse." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Read all with SQL analytics endpoint (ReadData) lets Kemal query every table with T-SQL. Share lets him share the item and grant permissions up to his own, so he can pass on Read and ReadData but not ReadAll. Lakehouse sharing never grants write access."
    fr: "Read all with SQL analytics endpoint (ReadData) permet à Kemal d'interroger toutes les tables en T-SQL. Share lui permet de partager l'élément et d'accorder des autorisations dans la limite des siennes : il peut transmettre Read et ReadData, mais pas ReadAll. Le partage d'un lakehouse n'accorde jamais l'écriture."
  options:
    b: { en: "Kemal can't grant a permission he doesn't hold, and he doesn't have ReadAll.", fr: "Kemal ne peut pas accorder une autorisation qu'il n'a pas, et il n'a pas ReadAll." }
    c: { en: "Lakehouse sharing doesn't provide write permissions; writing requires Contributor or higher.", fr: "Le partage d'un lakehouse ne fournit pas d'autorisation d'écriture ; écrire demande Contributor ou un rôle supérieur." }
    e: { en: "Lakehouse explorer reads data through ReadAll, which Kemal doesn't have.", fr: "L'explorateur de lakehouse lit les données grâce à ReadAll, que Kemal n'a pas." }
references:
  - title: Share items in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/share-items
  - title: How lakehouse sharing works
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sharing
