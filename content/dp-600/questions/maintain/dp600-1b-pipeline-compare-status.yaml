id: dp600-1b-pipeline-compare-status
objective: "1.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a deployment pipeline that has Development, Test and Production stages. You select the Test stage to compare it with the Development stage. The stages contain the following items:

    - Report2 exists only in the Development workspace.
    - Report3 was created directly in the Test workspace and doesn't exist in Development.
    - SM1 is paired in both stages and has identical content, but you have just created a data source rule for SM1 in the Test stage.

    Which comparison status does each item show? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline de déploiement qui comporte les étapes Development, Test et Production. Vous sélectionnez l'étape Test pour la comparer à l'étape Development. Les étapes contiennent les éléments suivants :

    - Report2 n'existe que dans l'espace de travail de Development.
    - Report3 a été créé directement dans l'espace de travail de Test et n'existe pas dans Development.
    - SM1 est apparié dans les deux étapes et a un contenu identique, mais vous venez de créer une règle de source de données pour SM1 dans l'étape Test.

    Quel statut de comparaison chaque élément affiche-t-il ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Report2: [[r2]]
      Report3: [[r3]]
      SM1: [[sm1]]
    fr: |
      Report2 : [[r2]]
      Report3 : [[r3]]
      SM1 : [[sm1]]
  slots:
    - id: r2
      options:
        - { id: same, text: Same as source }
        - { id: diff, text: Different from source }
        - { id: only, text: Only in source }
        - { id: notin, text: Not in source }
    - id: r3
      options:
        - { id: same, text: Same as source }
        - { id: diff, text: Different from source }
        - { id: only, text: Only in source }
        - { id: notin, text: Not in source }
    - id: sm1
      options:
        - { id: same, text: Same as source }
        - { id: diff, text: Different from source }
        - { id: only, text: Only in source }
        - { id: notin, text: Not in source }
answer:
  values: { r2: only, r3: notin, sm1: diff }
explanation:
  correct:
    en: An item that exists only in the source stage shows Only in source and is cloned by the next deployment. An item that exists only in the selected stage shows Not in source; it can't be selected for deployment and isn't affected by it. A deployment rule that is set but not yet applied counts as a difference, so SM1 shows Different from source until you deploy it.
    fr: |
      Un élément qui n'existe que dans l'étape source affiche Only in source et est cloné par le déploiement suivant. Un élément qui n'existe que dans l'étape sélectionnée affiche Not in source ; il ne peut pas être sélectionné pour le déploiement et n'est pas affecté par celui-ci. Une règle de déploiement définie mais pas encore appliquée compte comme une différence : SM1 affiche Different from source jusqu'à son déploiement.
references:
  - title: Compare content in different stages before deployment
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/compare-pipeline-content
