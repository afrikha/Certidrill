id: dp600-1b-git-true-statements
objective: "1.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You plan to use Git integration for a Fabric workspace named Marketing that contains a lakehouse, notebooks, semantic models and reports.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser l'intégration Git pour un espace de travail Fabric nommé Marketing qui contient un lakehouse, des notebooks, des modèles sémantiques et des rapports.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Marketing can be connected to one branch and one folder of a repository at a time.", fr: "Marketing peut être connecté à une seule branche et un seul dossier d'un référentiel à la fois." } }
    - { id: b, text: { en: "Committing the lakehouse stores the data of its tables in the repository.", fr: "Valider le lakehouse stocke les données de ses tables dans le référentiel." } }
    - { id: c, text: { en: "When you update the workspace from Git, you can select the items to update.", fr: "Quand vous mettez à jour l'espace de travail depuis Git, vous pouvez sélectionner les éléments à mettre à jour." } }
    - { id: d, text: { en: "When you commit, you can select the items to commit.", fr: "Quand vous validez, vous pouvez sélectionner les éléments à valider." } }
    - { id: e, text: { en: "A user who has the Viewer role in Marketing can commit if the user has the Contribute permission in Git.", fr: "Un utilisateur qui a le rôle Viewer dans Marketing peut valider s'il a l'autorisation Contribute dans Git." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: A workspace connects to a single branch and a single folder at a time. In the Source control pane, you choose which changed items to commit, whereas an update always brings the whole branch to its latest commit.
    fr: Un espace de travail se connecte à une seule branche et un seul dossier à la fois. Dans le volet Contrôle de code source, vous choisissez les éléments modifiés à valider, alors qu'une mise à jour amène toujours toute la branche à sa dernière validation.
  options:
    b: { en: "Git stores item definitions, not data; restoring from Git recreates definitions only.", fr: "Git stocke les définitions des éléments, pas les données ; une restauration depuis Git ne recrée que les définitions." }
    c: { en: "Update always updates the whole branch; you can't select individual items.", fr: "La mise à jour porte toujours sur toute la branche ; vous ne pouvez pas sélectionner d'éléments." }
    e: { en: "Viewers can't perform any Git action and can't see Git information, whatever their Git permissions.", fr: "Les Viewers ne peuvent effectuer aucune action Git ni voir d'informations Git, quelles que soient leurs autorisations Git." }
references:
  - title: Git integration process
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process
