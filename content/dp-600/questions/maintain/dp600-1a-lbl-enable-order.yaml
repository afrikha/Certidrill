id: dp600-1a-lbl-enable-order
objective: "1.1.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Adatum has never used sensitivity labels. The data governance team must be able to apply a new **Restricted** label to a Fabric lakehouse named **LH-Patients**. The team members have Power BI Pro licenses and the Member role in the workspace of LH-Patients.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum n'a jamais utilisé d'étiquettes de confidentialité. L'équipe de gouvernance des données doit pouvoir appliquer une nouvelle étiquette **Restricted** à un lakehouse Fabric nommé **LH-Patients**. Les membres de l'équipe disposent de licences Power BI Pro et du rôle Member dans l'espace de travail de LH-Patients.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create the Restricted label in the Microsoft Purview portal.", fr: "Créer l'étiquette Restricted dans le portail Microsoft Purview." } }
    - { id: publish, text: { en: "Publish the label to the governance team in a label policy.", fr: "Publier l'étiquette pour l'équipe de gouvernance dans une stratégie d'étiquette." } }
    - { id: enable, text: { en: "In the Fabric admin portal, enable Allow users to apply sensitivity labels for content for the governance team.", fr: "Dans le portail d'administration Fabric, activer Allow users to apply sensitivity labels for content pour l'équipe de gouvernance." } }
    - { id: apply, text: { en: "Apply the label from the sensitivity indicator in the header of LH-Patients.", fr: "Appliquer l'étiquette depuis l'indicateur de confidentialité dans l'en-tête de LH-Patients." } }
    - { id: downstream, text: { en: "Enable Automatically apply sensitivity labels to downstream content.", fr: "Activer Automatically apply sensitivity labels to downstream content." } }
    - { id: certify, text: { en: "Endorse LH-Patients as Certified.", fr: "Approuver LH-Patients comme Certified." } }
answer:
  sequence: [ create, publish, enable, apply ]
explanation:
  correct:
    en: "Fabric uses the sensitivity labels of Microsoft Purview Information Protection. Labels must be defined and published to users and groups before you enable them on the tenant, where you also choose who can apply them. A user with a Pro or PPU license and edit permission then applies the label from the item header."
    fr: "Fabric utilise les étiquettes de confidentialité de Microsoft Purview Information Protection. Les étiquettes doivent être définies et publiées pour des utilisateurs et des groupes avant d'être activées sur le locataire, où vous choisissez aussi qui peut les appliquer. Un utilisateur disposant d'une licence Pro ou PPU et de l'autorisation de modification applique ensuite l'étiquette depuis l'en-tête de l'élément."
  options:
    downstream: { en: "Downstream inheritance propagates labels to dependent items; it isn't needed to apply a label manually.", fr: "L'héritage en aval propage les étiquettes vers les éléments dépendants ; il n'est pas nécessaire pour appliquer une étiquette manuellement." }
    certify: { en: "Endorsement is unrelated to sensitivity labels.", fr: "L'approbation est sans rapport avec les étiquettes de confidentialité." }
references:
  - title: Information protection in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/information-protection
  - title: Apply sensitivity labels to Fabric items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/apply-sensitivity-labels
