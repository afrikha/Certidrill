id: dp600-1a-dls-rls-hotarea
objective: "1.1.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Fabric workspace named **WS-Sales** that contains an Import mode semantic model named **SalesModel** and a report named **Revenue**. SalesModel has two row-level security roles, **West** and **East**, that each show the rows of one region. No other role exists.

    The following table shows four users who open Revenue.

    Answer each prompt by selecting the user.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un espace de travail Fabric nommé **WS-Sales** qui contient un modèle sémantique en mode Import nommé **SalesModel** et un rapport nommé **Revenue**. SalesModel a deux rôles de sécurité au niveau des lignes, **West** et **East**, qui affichent chacun les lignes d'une région. Il n'existe aucun autre rôle.

    Le tableau suivant présente quatre utilisateurs qui ouvrent Revenue.

    Répondez à chaque consigne en sélectionnant l'utilisateur.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The user who sees the rows of every region, including regions that have no role", fr: "L'utilisateur qui voit les lignes de toutes les régions, y compris celles qui n'ont pas de rôle" }
    - id: p2
      text: { en: "The user who sees no data", fr: "L'utilisateur qui ne voit aucune donnée" }
  grid:
    header: [{ en: "User", fr: "Utilisateur" }, { en: "Workspace role", fr: "Rôle d'espace de travail" }, { en: "RLS roles", fr: "Rôles RLS" }, { en: "Build on SalesModel", fr: "Build sur SalesModel" }]
    rows:
      - [{ text: Ana, area: ana }, { text: Contributor }, { text: { en: "None", fr: "Aucun" } }, { text: { en: "Yes", fr: "Oui" } }]
      - [{ text: Ben, area: ben }, { text: Viewer }, { text: West }, { text: { en: "No", fr: "Non" } }]
      - [{ text: Carla, area: carla }, { text: Viewer }, { text: { en: "None", fr: "Aucun" } }, { text: { en: "Yes", fr: "Oui" } }]
      - [{ text: Dev, area: dev }, { text: Viewer }, { text: "West, East" }, { text: { en: "No", fr: "Non" } }]
answer:
  values: { p1: ana, p2: carla }
explanation:
  correct:
    en: "RLS applies only to users who read the model, such as Viewers; Ana is a Contributor, has edit permission on the model and sees every row. When RLS is defined, a Viewer who belongs to no role sees no data, and Build doesn't change that, so Carla sees nothing. Ben sees West, and Dev sees West and East because roles are additive."
    fr: "La RLS ne s'applique qu'aux utilisateurs qui lisent le modèle, comme les Viewers ; Ana est Contributor, a l'autorisation de modification sur le modèle et voit toutes les lignes. Quand une RLS est définie, un Viewer qui n'appartient à aucun rôle ne voit aucune donnée, et Build n'y change rien : Carla ne voit rien. Ben voit West, et Dev voit West et East, car les rôles sont cumulatifs."
references:
  - title: Row-level security (RLS) with Power BI
    url: https://learn.microsoft.com/en-us/fabric/security/service-admin-row-level-security
  - title: Semantic model permissions
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/service-datasets-permissions
