id: dp600-1a-ws-git-admin
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Fabric workspace named **WS-Analytics**. A BI developer named User1 has the Member role in WS-Analytics and already has write access to an Azure DevOps repository named **analytics-repo**.

    User1 must connect WS-Analytics to analytics-repo. When User1 opens the workspace settings, the option to connect a Git repository is unavailable.

    What should you do?
  fr: |
    Litware dispose d'un espace de travail Fabric nommé **WS-Analytics**. Un développeur BI nommé User1 a le rôle Member dans WS-Analytics et dispose déjà d'un accès en écriture à un référentiel Azure DevOps nommé **analytics-repo**.

    User1 doit connecter WS-Analytics à analytics-repo. Quand User1 ouvre les paramètres de l'espace de travail, l'option de connexion à un référentiel Git est indisponible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the workspace role of User1 to Admin", fr: "Remplacer le rôle d'espace de travail de User1 par Admin" } }
    - { id: b, text: { en: "Grant User1 the Reshare permission on every item of WS-Analytics", fr: "Accorder à User1 l'autorisation Reshare sur chaque élément de WS-Analytics" } }
    - { id: c, text: { en: "Add User1 to a security group that has the Contributor role in WS-Analytics", fr: "Ajouter User1 à un groupe de sécurité qui a le rôle Contributor dans WS-Analytics" } }
    - { id: d, text: { en: "Grant User1 the Write permission on every item of WS-Analytics", fr: "Accorder à User1 l'autorisation Write sur chaque élément de WS-Analytics" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Only the workspace Admin role can connect a workspace to a Git repository. Member can add people and share items, but the Git integration settings require Admin."
    fr: "Seul le rôle Admin de l'espace de travail peut connecter un espace de travail à un référentiel Git. Member peut ajouter des personnes et partager des éléments, mais les paramètres d'intégration Git exigent Admin."
  options:
    b: { en: "Reshare lets a user share items onward; it gives no right on workspace settings.", fr: "Reshare permet de repartager des éléments ; il ne donne aucun droit sur les paramètres de l'espace de travail." }
    c: { en: "A user in several groups gets the highest role. User1 would stay Member, which cannot connect Git.", fr: "Un utilisateur membre de plusieurs groupes obtient le rôle le plus élevé. User1 resterait Member, qui ne peut pas connecter Git." }
    d: { en: "Item permissions apply to single items; connecting Git is a workspace-level action reserved for Admin.", fr: "Les autorisations d'élément s'appliquent à des éléments isolés ; la connexion à Git est une action au niveau de l'espace de travail réservée à Admin." }
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
