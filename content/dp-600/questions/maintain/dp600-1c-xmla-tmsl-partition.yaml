id: dp600-1c-xmla-tmsl-partition
objective: "1.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model named **SalesModel** in a Fabric workspace whose capacity has the XMLA Endpoint setting set to **Read Write**. The Sales table of SalesModel has a partition named **Sales-2024**.

    Rows for 2024 were corrected in the source. You need to reload the data of the Sales-2024 partition from the source and recalculate the objects that depend on it. No other partition must be reloaded.

    You connect SQL Server Management Studio to the workspace.

    How should you complete the TMSL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique nommé **SalesModel** dans un espace de travail Fabric dont la capacité a le paramètre XMLA Endpoint défini sur **Read Write**. La table Sales de SalesModel a une partition nommée **Sales-2024**.

    Des lignes de 2024 ont été corrigées dans la source. Vous devez recharger depuis la source les données de la partition Sales-2024 et recalculer les objets qui en dépendent. Aucune autre partition ne doit être rechargée.

    Vous connectez SQL Server Management Studio à l'espace de travail.

    Comment devez-vous compléter le script TMSL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "[[cmd]]": {
        "type": "[[type]]",
        "objects": [
          {
            "database": "SalesModel",
            "table": "Sales",
            "[[scope]]": "Sales-2024"
          }
        ]
      }
    }
  slots:
    - id: cmd
      options:
        - { id: alter, text: alter }
        - { id: refresh, text: refresh }
        - { id: create, text: createOrReplace }
        - { id: sequence, text: sequence }
    - id: type
      options:
        - { id: calculate, text: calculate }
        - { id: clear, text: clearValues }
        - { id: full, text: full }
        - { id: defrag, text: defragment }
    - id: scope
      options:
        - { id: partition, text: partition }
        - { id: datasource, text: dataSource }
        - { id: role, text: role }
answer:
  values: { cmd: refresh, type: full, scope: partition }
explanation:
  correct:
    en: "The TMSL refresh command processes the objects listed in objects; adding partition after database and table limits it to Sales-2024. The full type refreshes the data of the partition and recalculates all its dependents."
    fr: "La commande TMSL refresh traite les objets listés dans objects ; ajouter partition après database et table la limite à Sales-2024. Le type full actualise les données de la partition et recalcule tous ses dépendants."
  options:
    alter:
      en: "alter changes the definition of an object; it doesn't load data."
      fr: "alter modifie la définition d'un objet ; il ne charge pas de données."
    create:
      en: "createOrReplace creates or overwrites object definitions; it doesn't refresh data."
      fr: "createOrReplace crée ou remplace des définitions d'objets ; il n'actualise pas les données."
    sequence:
      en: "sequence runs a batch of commands; it has no type or objects of its own."
      fr: "sequence exécute un lot de commandes ; il n'a pas de type ni d'objets propres."
    calculate:
      en: "calculate only recalculates when needed and doesn't reload data from the source."
      fr: "calculate recalcule seulement si nécessaire et ne recharge pas les données depuis la source."
    clear:
      en: "clearValues empties the object and its dependents instead of reloading them."
      fr: "clearValues vide l'objet et ses dépendants au lieu de les recharger."
    defrag:
      en: "defragment removes unused dictionary values and applies to databases and tables, not partitions."
      fr: "defragment supprime les valeurs de dictionnaire inutilisées et s'applique aux bases de données et aux tables, pas aux partitions."
references:
  - title: Refresh command (TMSL)
    url: https://learn.microsoft.com/en-us/analysis-services/tmsl/refresh-command-tmsl
  - title: Advanced incremental refresh and real-time data with the XMLA endpoint
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/incremental-refresh-xmla
