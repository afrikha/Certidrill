id: dp600-1b-pbip-limitations
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware plans to save all its Power BI Desktop work as Power BI projects (.pbip) and manage them in Azure DevOps.

    Which two statements about Power BI projects are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit d'enregistrer tout son travail Power BI Desktop sous forme de projets Power BI (.pbip) et de les gérer dans Azure DevOps.

    Quelles sont les deux affirmations vraies sur les projets Power BI ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Sensitivity labels aren't supported in a Power BI project.", fr: "Les étiquettes de confidentialité ne sont pas prises en charge dans un projet Power BI." } }
    - { id: b, text: { en: "A Power BI project can't be published from Power BI Desktop.", fr: "Un projet Power BI ne peut pas être publié depuis Power BI Desktop." } }
    - { id: c, text: { en: "A Power BI project can't be saved directly to OneDrive or SharePoint.", fr: "Un projet Power BI ne peut pas être enregistré directement dans OneDrive ou SharePoint." } }
    - { id: d, text: { en: "Fabric Git integration requires the .pbip file to be committed.", fr: "L'intégration Git de Fabric exige que le fichier .pbip soit validé." } }
    - { id: e, text: { en: "The model metadata of a project can be edited only in Power BI Desktop.", fr: "Les métadonnées du modèle d'un projet ne peuvent être modifiées que dans Power BI Desktop." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Power BI projects don't support sensitivity labels, and they can't be saved directly to OneDrive or SharePoint; saving to a locally synced folder can cause sync issues. Keep the project in a short local path inside a Git repository.
    fr: Les projets Power BI ne prennent pas en charge les étiquettes de confidentialité et ne peuvent pas être enregistrés directement dans OneDrive ou SharePoint ; un enregistrement dans un dossier synchronisé localement peut causer des problèmes de synchronisation. Conservez le projet dans un chemin local court, à l'intérieur d'un référentiel Git.
  options:
    b: { en: "Publish in Desktop works with projects; it uses a temporary .pbix and deploys the metadata and the data cache.", fr: "Publier dans Desktop fonctionne avec les projets ; Desktop utilise un .pbix temporaire et déploie les métadonnées et le cache de données." }
    d: { en: "The .pbip file is an optional pointer; you can open definition.pbir instead.", fr: "Le fichier .pbip est un pointeur facultatif ; vous pouvez ouvrir definition.pbir à la place." }
    e: { en: "Model metadata can be edited as TMDL in any editor, such as Visual Studio Code, or with external tools.", fr: "Les métadonnées du modèle peuvent être modifiées en TMDL dans n'importe quel éditeur, comme Visual Studio Code, ou avec des outils externes." }
references:
  - title: Power BI Desktop projects (PBIP)
    url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-overview
