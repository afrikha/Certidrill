id: dp600-1a-dls-onelake-readwrite
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a Fabric workspace named **WS-Lake** that contains a lakehouse named **LH-Transactions** with the schemas `bronze` and `silver`. A team of data engineers develops Spark notebooks in a workspace named **WS-Dev**, where they are Contributors.

    The engineers must write data to the `bronze` tables of LH-Transactions from their notebooks. They must not modify the `silver` tables, and they must not create, edit or delete items in WS-Lake. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un espace de travail Fabric nommé **WS-Lake** qui contient un lakehouse nommé **LH-Transactions** avec les schémas `bronze` et `silver`. Une équipe d'ingénieurs données développe des notebooks Spark dans un espace de travail nommé **WS-Dev**, dont ils sont Contributors.

    Les ingénieurs doivent écrire des données dans les tables `bronze` de LH-Transactions depuis leurs notebooks. Ils ne doivent pas modifier les tables `silver`, et ils ne doivent pas créer, modifier ou supprimer d'éléments dans WS-Lake. La solution doit respecter le principe du privilège minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the engineers the Contributor role in WS-Lake", fr: "Attribuer aux ingénieurs le rôle Contributor dans WS-Lake" } }
    - { id: b, text: { en: "Share LH-Transactions with the engineers without additional permissions, and add them to a OneLake security role that grants ReadWrite on the bronze tables", fr: "Partager LH-Transactions avec les ingénieurs sans autorisation supplémentaire, et les ajouter à un rôle de sécurité OneLake qui accorde ReadWrite sur les tables bronze" } }
    - { id: c, text: { en: "Share LH-Transactions with the engineers and select Read all with Apache Spark", fr: "Partager LH-Transactions avec les ingénieurs en sélectionnant Read all with Apache Spark" } }
    - { id: d, text: { en: "Assign the engineers the Member role in WS-Lake, and add them to a OneLake security role that grants ReadWrite on the bronze tables", fr: "Attribuer aux ingénieurs le rôle Member dans WS-Lake, et les ajouter à un rôle de sécurité OneLake qui accorde ReadWrite sur les tables bronze" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The ReadWrite permission of OneLake security, supported on lakehouses, lets users edit data in the selected tables or folders through Spark and the OneLake APIs without permission to create or manage items. It applies to users who have Read on the item, which sharing without additional permissions gives; Admin, Member and Contributor already write everywhere through their role."
    fr: "L'autorisation ReadWrite de la sécurité OneLake, prise en charge sur les lakehouses, permet de modifier les données des tables ou dossiers choisis via Spark et les API OneLake, sans autorisation de créer ou de gérer des éléments. Elle s'applique aux utilisateurs qui ont Read sur l'élément, ce que donne un partage sans autorisation supplémentaire ; Admin, Member et Contributor écrivent déjà partout grâce à leur rôle."
  options:
    a: { en: "Contributor can write every table, including silver, and can create and delete items in WS-Lake.", fr: "Contributor peut écrire dans toutes les tables, silver comprises, et créer et supprimer des éléments dans WS-Lake." }
    c: { en: "Lakehouse sharing grants read permissions only; the engineers couldn't write to bronze.", fr: "Le partage d'un lakehouse n'accorde que des autorisations de lecture ; les ingénieurs ne pourraient pas écrire dans bronze." }
    d: { en: "ReadWrite has no effect for Members, who can already write every table and also manage items and access.", fr: "ReadWrite n'a aucun effet pour les Members, qui peuvent déjà écrire dans toutes les tables et aussi gérer les éléments et les accès." }
references:
  - title: OneLake security roles, permissions, and scopes
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/data-access-control-model
  - title: Get started with OneLake security
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/get-started-onelake-security
