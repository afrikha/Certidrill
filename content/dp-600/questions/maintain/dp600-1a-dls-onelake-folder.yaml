id: dp600-1a-dls-onelake-folder
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a Fabric workspace named **WS-Lake** that contains a lakehouse named **LH-Shared**. LH-Shared contains the folders `Files/HR` and `Files/Sales`.

    The members of the security group **SG-SalesAnalysts** have no access to LH-Shared. They must read the files in `Files/Sales` from Spark notebooks in their own workspace. They must not read `Files/HR`.

    What should you do?
  fr: |
    Northwind Traders dispose d'un espace de travail Fabric nommé **WS-Lake** qui contient un lakehouse nommé **LH-Shared**. LH-Shared contient les dossiers `Files/HR` et `Files/Sales`.

    Les membres du groupe de sécurité **SG-SalesAnalysts** n'ont aucun accès à LH-Shared. Ils doivent lire les fichiers de `Files/Sales` depuis des notebooks Spark de leur propre espace de travail. Ils ne doivent pas lire `Files/HR`.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Share LH-Shared with SG-SalesAnalysts with Read all with Apache Spark, and add the group to a OneLake security role that grants Read on Files/Sales", fr: "Partager LH-Shared avec SG-SalesAnalysts avec Read all with Apache Spark, et ajouter le groupe à un rôle de sécurité OneLake qui accorde Read sur Files/Sales" } }
    - { id: b, text: { en: "Share LH-Shared with SG-SalesAnalysts with Read all with SQL analytics endpoint, and create a security policy that filters on the folder path", fr: "Partager LH-Shared avec SG-SalesAnalysts avec Read all with SQL analytics endpoint, et créer une stratégie de sécurité qui filtre sur le chemin du dossier" } }
    - { id: c, text: { en: "Share LH-Shared with SG-SalesAnalysts without additional permissions, and add the group to a OneLake security role that grants Read on Files/Sales", fr: "Partager LH-Shared avec SG-SalesAnalysts sans autorisation supplémentaire, et ajouter le groupe à un rôle de sécurité OneLake qui accorde Read sur Files/Sales" } }
    - { id: d, text: { en: "Assign SG-SalesAnalysts the Viewer role in WS-Lake", fr: "Attribuer à SG-SalesAnalysts le rôle Viewer dans WS-Lake" } }
answer: { optionId: c }
explanation:
  correct:
    en: "OneLake security data access roles grant Read on selected folders or tables of a lakehouse, and the folder permission is inherited by its files and subfolders. It applies to every engine, including Spark. The users need basic Read on the item, which sharing without additional permissions gives."
    fr: "Les rôles d'accès aux données de la sécurité OneLake accordent Read sur des dossiers ou des tables choisis d'un lakehouse, et l'autorisation d'un dossier est héritée par ses fichiers et sous-dossiers. Elle s'applique à tous les moteurs, Spark compris. Les utilisateurs ont besoin du Read de base sur l'élément, que donne un partage sans autorisation supplémentaire."
  options:
    a: { en: "Users with ReadAll are members of the DefaultReader role, and roles combine as a union, so the analysts would still read Files/HR.", fr: "Les utilisateurs qui ont ReadAll sont membres du rôle DefaultReader, et les rôles se combinent par union : les analystes liraient toujours Files/HR." }
    b: { en: "SQL row-level security filters rows of tables in T-SQL queries; it doesn't protect files read by Spark.", fr: "La sécurité au niveau des lignes SQL filtre les lignes de tables dans les requêtes T-SQL ; elle ne protège pas les fichiers lus par Spark." }
    d: { en: "Viewer doesn't include ReadAll, so it doesn't give Spark access to the files.", fr: "Viewer n'inclut pas ReadAll : il ne donne pas à Spark l'accès aux fichiers." }
references:
  - title: Get started with OneLake security
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/get-started-onelake-security
  - title: OneLake security roles, permissions, and scopes
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/data-access-control-model
