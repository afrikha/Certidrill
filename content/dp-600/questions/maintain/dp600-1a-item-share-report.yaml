id: dp600-1a-item-share-report
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a Fabric workspace named **WS-Exec** that contains a report named **BoardPack**, its Import mode semantic model, two lakehouses and several notebooks.

    The members of the security group **SG-Board** must view BoardPack. They must not see any other item of WS-Exec. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Fabrikam dispose d'un espace de travail Fabric nommé **WS-Exec** qui contient un rapport nommé **BoardPack**, son modèle sémantique en mode Import, deux lakehouses et plusieurs notebooks.

    Les membres du groupe de sécurité **SG-Board** doivent consulter BoardPack. Ils ne doivent voir aucun autre élément de WS-Exec. La solution doit respecter le principe du privilège minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign SG-Board the Viewer role in WS-Exec", fr: "Attribuer à SG-Board le rôle Viewer dans WS-Exec" } }
    - { id: b, text: { en: "Grant SG-Board the Build permission on the semantic model", fr: "Accorder à SG-Board l'autorisation Build sur le modèle sémantique" } }
    - { id: c, text: { en: "Share BoardPack with SG-Board", fr: "Partager BoardPack avec SG-Board" } }
    - { id: d, text: { en: "Share the two lakehouses with SG-Board and select Read all with SQL analytics endpoint", fr: "Partager les deux lakehouses avec SG-Board en sélectionnant Read all with SQL analytics endpoint" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Item sharing gives access to one item without a workspace role; the recipients see only the shared item. An Import mode report reads the data stored in its semantic model, so the recipients need no permission on the lakehouses."
    fr: "Le partage d'élément donne accès à un élément sans rôle d'espace de travail ; les destinataires ne voient que l'élément partagé. Un rapport en mode Import lit les données stockées dans son modèle sémantique : les destinataires n'ont besoin d'aucune autorisation sur les lakehouses."
  options:
    a: { en: "A workspace role applies to every item of the workspace, so the board members would see all of them.", fr: "Un rôle d'espace de travail s'applique à tous les éléments de l'espace de travail : les membres du conseil les verraient tous." }
    b: { en: "Build lets users create content from the model; it doesn't give access to the report and is more than viewing requires.", fr: "Build permet de créer du contenu à partir du modèle ; il ne donne pas accès au rapport et dépasse ce que demande la consultation." }
    d: { en: "Lakehouse permissions don't give access to the report, and they expose raw data the board doesn't need.", fr: "Les autorisations sur les lakehouses ne donnent pas accès au rapport et exposent des données brutes dont le conseil n'a pas besoin." }
references:
  - title: Share items in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/share-items
  - title: Permission model
    url: https://learn.microsoft.com/en-us/fabric/security/permission-model
