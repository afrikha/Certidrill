id: dp600-1a-ws-min-role-tasks
objective: "1.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Fabric workspace named **WS-Marketing** that contains a lakehouse named **LH-Campaigns**. Three users need the following capabilities in WS-Marketing.

    You need to assign each user the least privileged workspace role that provides the capability.

    Which role should you assign to each user? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un espace de travail Fabric nommé **WS-Marketing** qui contient un lakehouse nommé **LH-Campaigns**. Trois utilisateurs ont besoin des capacités suivantes dans WS-Marketing.

    Vous devez attribuer à chaque utilisateur le rôle d'espace de travail le moins privilégié qui fournit la capacité.

    Quel rôle devez-vous attribuer à chaque utilisateur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      User1, who must create a workspace identity for WS-Marketing: [[u1]]

      User2, who must allow other users to reshare items of WS-Marketing: [[u2]]

      User3, who must subscribe to the OneLake events of LH-Campaigns: [[u3]]
    fr: |
      User1, qui doit créer une identité d'espace de travail pour WS-Marketing : [[u1]]

      User2, qui doit autoriser d'autres utilisateurs à repartager les éléments de WS-Marketing : [[u2]]

      User3, qui doit s'abonner aux événements OneLake de LH-Campaigns : [[u3]]
  slots:
    - id: u1
      options:
        - { id: admin, text: Admin }
        - { id: member, text: Member }
        - { id: contrib, text: Contributor }
        - { id: viewer, text: Viewer }
    - id: u2
      options:
        - { id: admin, text: Admin }
        - { id: member, text: Member }
        - { id: contrib, text: Contributor }
        - { id: viewer, text: Viewer }
    - id: u3
      options:
        - { id: admin, text: Admin }
        - { id: member, text: Member }
        - { id: contrib, text: Contributor }
        - { id: viewer, text: Viewer }
answer:
  values: { u1: admin, u2: member, u3: contrib }
explanation:
  correct:
    en: "Only Admin can create a workspace identity. Allowing others to reshare items is available to Admin and Member, so Member is the least privileged choice. Subscribing to OneLake events is available to Admin, Member and Contributor, but not to Viewer."
    fr: "Seul Admin peut créer une identité d'espace de travail. Autoriser d'autres utilisateurs à repartager des éléments est possible pour Admin et Member : Member est le choix le moins privilégié. L'abonnement aux événements OneLake est possible pour Admin, Member et Contributor, mais pas pour Viewer."
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
