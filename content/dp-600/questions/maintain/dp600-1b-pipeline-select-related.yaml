id: dp600-1b-pipeline-select-related
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a deployment pipeline that has Development, Test and Production stages. All three stages are assigned to workspaces.

    In the Development workspace, a developer creates a semantic model named SM-Returns and a report named Returns that uses it. Neither item exists in the Test workspace yet. You select only the Returns report and deploy it to Test, and the deployment fails.

    You need to deploy Returns to Test so that it uses the Test copy of its semantic model. The solution must deploy only the items that are required.

    What should you do?
  fr: |
    Vous disposez d'un pipeline de déploiement qui comporte les étapes Development, Test et Production. Les trois étapes sont affectées à des espaces de travail.

    Dans l'espace de travail de Development, un développeur crée un modèle sémantique nommé SM-Returns et un rapport nommé Returns qui l'utilise. Aucun des deux éléments n'existe encore dans l'espace de travail de Test. Vous sélectionnez uniquement le rapport Returns et le déployez vers Test, et le déploiement échoue.

    Vous devez déployer Returns vers Test pour qu'il utilise la copie Test de son modèle sémantique. La solution doit déployer uniquement les éléments nécessaires.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a data source rule for Returns in the Test stage, and then deploy Returns.", fr: "Créer une règle de source de données pour Returns dans l'étape Test, puis déployer Returns." } }
    - { id: b, text: { en: "Deploy all the content of the Development stage to the Test stage.", fr: "Déployer tout le contenu de l'étape Development vers l'étape Test." } }
    - { id: c, text: { en: "Deploy SM-Returns from Development to Production, and then deploy Returns to Test.", fr: "Déployer SM-Returns de Development vers Production, puis déployer Returns vers Test." } }
    - { id: d, text: { en: "Select Returns, select Select related, and then deploy the selected items.", fr: "Sélectionner Returns, sélectionner Select related, puis déployer les éléments sélectionnés." } }
answer: { optionId: d }
explanation:
  correct:
    en: An item can't be deployed when its dependencies don't exist in the target stage. Select related adds the items that Returns depends on, here SM-Returns, so both are deployed together and autobinding binds the report to the Test copy of the model.
    fr: |
      Un élément ne peut pas être déployé si ses dépendances n'existent pas dans l'étape cible. Select related ajoute les éléments dont Returns dépend, ici SM-Returns : les deux sont déployés ensemble et la liaison automatique lie le rapport à la copie Test du modèle.
  options:
    a: { en: "Data source rules apply to semantic models, dataflows Gen1, paginated reports and mirrored databases, not to Power BI reports.", fr: "Les règles de source de données s'appliquent aux modèles sémantiques, aux flux de données Gen1, aux rapports paginés et aux bases de données en miroir, pas aux rapports Power BI." }
    b: { en: "A full deployment would also overwrite every other paired item in Test, which deploys more than required.", fr: "Un déploiement complet écraserait aussi tous les autres éléments appariés de Test, ce qui déploie plus que nécessaire." }
    c: { en: "Deployments go to an adjacent stage, and the dependency must exist in the Test stage, not in Production.", fr: "Les déploiements se font vers une étape adjacente, et la dépendance doit exister dans l'étape Test, pas en Production." }
references:
  - title: Fabric Application lifecycle management (ALM) deployment pipelines deploy content
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/deploy-content
