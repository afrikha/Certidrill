id: dp600-1b-pipeline-rule-types
objective: "1.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a deployment pipeline that has Development, Test and Production stages. The Development workspace contains the following items:

    - SM-Sales: an Import mode semantic model that connects directly to an Azure SQL database, without parameters
    - NB-Load: a notebook that uses a lakehouse named LH-Raw as its default lakehouse
    - DF-Ref: a dataflow Gen1 whose source is selected by a Text parameter named Environment

    In the Test and Production stages, each item must use the resources of its own stage after each deployment. You own all the items.

    Which type of deployment rule should you create for each item? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline de déploiement qui comporte les étapes Development, Test et Production. L'espace de travail de Development contient les éléments suivants :

    - SM-Sales : un modèle sémantique en mode Import qui se connecte directement à une base de données Azure SQL, sans paramètres
    - NB-Load : un notebook qui utilise un lakehouse nommé LH-Raw comme lakehouse par défaut
    - DF-Ref : un flux de données Gen1 dont la source est choisie par un paramètre de type Text nommé Environment

    Dans les étapes Test et Production, chaque élément doit utiliser les ressources de sa propre étape après chaque déploiement. Vous êtes propriétaire de tous les éléments.

    Quel type de règle de déploiement devez-vous créer pour chaque élément ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      SM-Sales: [[sm]]
      NB-Load: [[nb]]
      DF-Ref: [[df]]
    fr: |
      SM-Sales : [[sm]]
      NB-Load : [[nb]]
      DF-Ref : [[df]]
  slots:
    - id: sm
      options:
        - { id: ds, text: { en: "Data source rule", fr: "Règle de source de données" } }
        - { id: param, text: { en: "Parameter rule", fr: "Règle de paramètre" } }
        - { id: lake, text: { en: "Default lakehouse rule", fr: "Règle de lakehouse par défaut" } }
    - id: nb
      options:
        - { id: ds, text: { en: "Data source rule", fr: "Règle de source de données" } }
        - { id: param, text: { en: "Parameter rule", fr: "Règle de paramètre" } }
        - { id: lake, text: { en: "Default lakehouse rule", fr: "Règle de lakehouse par défaut" } }
    - id: df
      options:
        - { id: ds, text: { en: "Data source rule", fr: "Règle de source de données" } }
        - { id: param, text: { en: "Parameter rule", fr: "Règle de paramètre" } }
        - { id: lake, text: { en: "Default lakehouse rule", fr: "Règle de lakehouse par défaut" } }
answer:
  values: { sm: ds, nb: lake, df: param }
explanation:
  correct:
    en: A semantic model that connects directly to a supported source, such as Azure SQL, uses a data source rule that switches to a source of the same type. Notebooks support only default lakehouse rules. When a dataflow Gen1 source is parameterized, data source rules aren't supported, so you change the parameter value with a parameter rule.
    fr: |
      Un modèle sémantique qui se connecte directement à une source prise en charge, comme Azure SQL, utilise une règle de source de données qui bascule vers une source du même type. Les notebooks ne prennent en charge que les règles de lakehouse par défaut. Quand la source d'un flux de données Gen1 est paramétrée, les règles de source de données ne sont pas prises en charge : vous modifiez la valeur du paramètre avec une règle de paramètre.
references:
  - title: Create deployment rules for Fabric's ALM
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/create-rules
