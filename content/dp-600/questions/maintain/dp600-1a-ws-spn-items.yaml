id: dp600-1a-ws-spn-items
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has a Fabric workspace named **WS-Data**. An Azure DevOps release pipeline authenticates as a Microsoft Entra service principal named **SP-Deploy**. The Fabric tenant settings already allow service principals to use the Fabric APIs.

    The release pipeline must create new notebooks in WS-Data and update the existing ones by calling the Fabric Items REST API. SP-Deploy must not be able to add people to WS-Data. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Tailspin Toys dispose d'un espace de travail Fabric nommé **WS-Data**. Un pipeline de mise en production Azure DevOps s'authentifie en tant que principal de service Microsoft Entra nommé **SP-Deploy**. Les paramètres de locataire Fabric autorisent déjà les principaux de service à utiliser les API Fabric.

    Le pipeline de mise en production doit créer de nouveaux notebooks dans WS-Data et mettre à jour les notebooks existants en appelant l'API REST Items de Fabric. SP-Deploy ne doit pas pouvoir ajouter de personnes à WS-Data. La solution doit respecter le principe du privilège minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign SP-Deploy the Viewer role in WS-Data", fr: "Attribuer à SP-Deploy le rôle Viewer dans WS-Data" } }
    - { id: b, text: { en: "Share each existing notebook in WS-Data with SP-Deploy and select Edit", fr: "Partager chaque notebook existant de WS-Data avec SP-Deploy en sélectionnant Edit" } }
    - { id: c, text: { en: "Assign SP-Deploy the Member role in WS-Data", fr: "Attribuer à SP-Deploy le rôle Member dans WS-Data" } }
    - { id: d, text: { en: "Assign SP-Deploy the Contributor role in WS-Data", fr: "Attribuer à SP-Deploy le rôle Contributor dans WS-Data" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Service principals can hold workspace roles and get the same permissions as users for API operations. Admin, Member and Contributor can create, update and delete notebooks through the Items REST API, and Contributor is the lowest of them; it cannot add people to the workspace."
    fr: "Les principaux de service peuvent recevoir des rôles d'espace de travail et obtiennent les mêmes autorisations que les utilisateurs pour les opérations d'API. Admin, Member et Contributor peuvent créer, mettre à jour et supprimer des notebooks via l'API REST Items, et Contributor est le moins élevé des trois ; il ne peut pas ajouter de personnes à l'espace de travail."
  options:
    a: { en: "Viewer cannot create, update or delete notebooks through the Items REST API.", fr: "Viewer ne peut pas créer, mettre à jour ou supprimer des notebooks via l'API REST Items." }
    b: { en: "Item permissions apply only to existing items; they do not allow creating new notebooks in the workspace.", fr: "Les autorisations d'élément ne s'appliquent qu'aux éléments existants ; elles ne permettent pas de créer de nouveaux notebooks dans l'espace de travail." }
    c: { en: "Member works, but it can also add people to the workspace, which breaks the requirement and least privilege.", fr: "Member fonctionne, mais il peut aussi ajouter des personnes à l'espace de travail, ce qui enfreint l'exigence et le privilège minimum." }
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
