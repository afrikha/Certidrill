id: dp600-1c-xmla-read-write
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Model** that is assigned to a Fabric capacity. WS-Model contains a semantic model named **SM-Budget**. The capacity settings have never been changed, and the tenant setting **Allow XMLA endpoints and Analyze in Excel with on-premises semantic models** is enabled.

    A developer who has the Contributor role in WS-Model connects Tabular Editor to WS-Model and adds a measure to SM-Budget. The connection and queries succeed, but saving the change to the service fails.

    You need to ensure that the developer can save changes to SM-Budget through the XMLA endpoint.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Model**, attribué à une capacité Fabric. WS-Model contient un modèle sémantique nommé **SM-Budget**. Les paramètres de la capacité n'ont jamais été modifiés, et le paramètre de locataire **Allow XMLA endpoints and Analyze in Excel with on-premises semantic models** est activé.

    Un développeur qui a le rôle Contributor dans WS-Model connecte Tabular Editor à WS-Model et ajoute une mesure à SM-Budget. La connexion et les requêtes réussissent, mais l'enregistrement de la modification dans le service échoue.

    Vous devez faire en sorte que le développeur puisse enregistrer des modifications de SM-Budget par le point de terminaison XMLA.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant the developer the Build permission on SM-Budget.", fr: "Accorder au développeur l'autorisation Build sur SM-Budget." } }
    - { id: b, text: { en: "Enable the large semantic model storage format for SM-Budget.", fr: "Activer le format de stockage de modèle sémantique volumineux pour SM-Budget." } }
    - { id: c, text: { en: "Assign the developer the Member role in WS-Model.", fr: "Attribuer au développeur le rôle Member dans WS-Model." } }
    - { id: d, text: { en: "Set the XMLA Endpoint setting of the capacity to Read Write.", fr: "Définir le paramètre XMLA Endpoint de la capacité sur Read Write." } }
answer: { optionId: d }
explanation:
  correct:
    en: "By default, the semantic model workload of a capacity allows only read-only connectivity through the XMLA endpoint, which is why queries succeed and the save fails. A capacity admin must set XMLA Endpoint to Read Write; the setting applies to all the workspaces and semantic models of the capacity."
    fr: "Par défaut, la charge de travail des modèles sémantiques d'une capacité n'autorise que la connectivité en lecture seule par le point de terminaison XMLA : c'est pourquoi les requêtes réussissent et l'enregistrement échoue. Un administrateur de la capacité doit définir XMLA Endpoint sur Read Write ; le paramètre s'applique à tous les espaces de travail et modèles sémantiques de la capacité."
  options:
    a:
      en: "Build gives read access through the XMLA endpoint, like a database reader; the developer's Contributor role already includes it."
      fr: "Build donne un accès en lecture par le point de terminaison XMLA, comme un lecteur de base de données ; le rôle Contributor du développeur l'inclut déjà."
    b:
      en: "The large format is recommended for models managed through XMLA, but it doesn't turn a read-only endpoint into a read-write one."
      fr: "Le format volumineux est recommandé pour les modèles gérés par XMLA, mais il ne transforme pas un point de terminaison en lecture seule en point de terminaison en lecture-écriture."
    c:
      en: "Contributor already acts as a database administrator through XMLA; the limit comes from the capacity setting."
      fr: "Contributor agit déjà comme administrateur de base de données par XMLA ; la limite vient du paramètre de la capacité."
references:
  - title: Semantic model connectivity and management with the XMLA endpoint in Power BI
    url: https://learn.microsoft.com/en-us/fabric/enterprise/powerbi/service-premium-connect-tools
