id: dp600-1c-xmla-effective-date
objective: "1.2.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a semantic model named **BudgetModel** in a Fabric workspace whose capacity has the XMLA Endpoint setting set to **Read Write**. The Budget table of BudgetModel has an incremental refresh policy with monthly partitions. The source already contains budget rows for future months.

    Testers need to run a refresh that applies the incremental refresh policy as if the current date were December 31, 2026, so that the partitions of the rolling window are created and loaded, and the dependent objects are recalculated.

    How should you complete the TMSL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique nommé **BudgetModel** dans un espace de travail Fabric dont la capacité a le paramètre XMLA Endpoint défini sur **Read Write**. La table Budget de BudgetModel a une stratégie d'actualisation incrémentielle avec des partitions mensuelles. La source contient déjà des lignes de budget pour des mois futurs.

    Les testeurs doivent lancer une actualisation qui applique la stratégie d'actualisation incrémentielle comme si la date du jour était le 31 décembre 2026, afin que les partitions de la fenêtre glissante soient créées et chargées, et que les objets dépendants soient recalculés.

    Comment devez-vous compléter le script TMSL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "refresh": {
        "type": "[[type]]",
        "applyRefreshPolicy": true,
        "[[date]]": "12/31/2026",
        "objects": [
          {
            "database": "BudgetModel",
            "table": "Budget"
          }
        ]
      }
    }
  slots:
    - id: type
      options:
        - { id: add, text: add }
        - { id: calculate, text: calculate }
        - { id: full, text: full }
        - { id: clear, text: clearValues }
    - id: date
      options:
        - { id: polling, text: pollingExpression }
        - { id: effective, text: effectiveDate }
        - { id: rolling, text: rollingWindowPeriods }
        - { id: incremental, text: incrementalPeriods }
answer:
  values: { type: full, date: effective }
explanation:
  correct:
    en: "effectiveDate overrides the current date used to compute the rolling historical and incremental windows. With applyRefreshPolicy set to true, a full refresh applies the policy: it adds the partitions that the window needs, refreshes the incremental partitions, and recalculates the dependents."
    fr: "effectiveDate remplace la date du jour utilisée pour calculer les fenêtres glissantes d'historique et d'actualisation incrémentielle. Avec applyRefreshPolicy défini sur true, une actualisation full applique la stratégie : elle ajoute les partitions nécessaires à la fenêtre, actualise les partitions incrémentielles et recalcule les dépendants."
  options:
    add:
      en: "add appends data to a partition and ignores applyRefreshPolicy, so the policy isn't applied to the table."
      fr: "add ajoute des données à une partition et ignore applyRefreshPolicy : la stratégie n'est donc pas appliquée à la table."
    calculate:
      en: "calculate ignores applyRefreshPolicy and doesn't load data."
      fr: "calculate ignore applyRefreshPolicy et ne charge pas de données."
    clear:
      en: "clearValues empties the table instead of loading it."
      fr: "clearValues vide la table au lieu de la charger."
    polling:
      en: "pollingExpression belongs to the refresh policy definition and detects data changes; it doesn't set a date."
      fr: "pollingExpression appartient à la définition de la stratégie d'actualisation et détecte les modifications de données ; il ne définit pas de date."
    rolling:
      en: "rollingWindowPeriods is a property of the refresh policy that sets the number of historical periods, not a refresh parameter."
      fr: "rollingWindowPeriods est une propriété de la stratégie d'actualisation qui fixe le nombre de périodes d'historique, pas un paramètre d'actualisation."
    incremental:
      en: "incrementalPeriods is a property of the refresh policy that sets the number of incremental periods, not a refresh parameter."
      fr: "incrementalPeriods est une propriété de la stratégie d'actualisation qui fixe le nombre de périodes incrémentielles, pas un paramètre d'actualisation."
references:
  - title: Refresh command (TMSL)
    url: https://learn.microsoft.com/en-us/analysis-services/tmsl/refresh-command-tmsl
