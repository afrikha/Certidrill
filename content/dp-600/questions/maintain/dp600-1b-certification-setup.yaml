id: dp600-1b-certification-setup
objective: "1.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are a Fabric administrator. Your organization publishes its certification policy on an intranet page.

    You need to configure certification to meet the following requirements:

    - Members of a security group named Stewards can certify items, except the members of its nested security group named StewardTrainees.
    - Users who aren't authorized can open the certification policy from the endorsement settings of an item.

    Which two configurations should you perform in the Certification tenant setting? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes administrateur Fabric. Votre organisation publie sa stratégie de certification sur une page intranet.

    Vous devez configurer la certification pour répondre aux exigences suivantes :

    - Les membres d'un groupe de sécurité nommé Stewards peuvent certifier des éléments, sauf les membres de son groupe de sécurité imbriqué nommé StewardTrainees.
    - Les utilisateurs non autorisés peuvent ouvrir la stratégie de certification depuis les paramètres d'approbation d'un élément.

    Quelles sont les deux configurations à effectuer dans le paramètre de locataire Certification ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enter the URL of the intranet page as the documentation URL.", fr: "Saisir l'URL de la page intranet comme URL de documentation." } }
    - { id: b, text: { en: "Select Domain admins can enable/disable.", fr: "Sélectionner Domain admins can enable/disable." } }
    - { id: c, text: { en: "Specify Stewards, select Except specific security groups, and enter StewardTrainees.", fr: "Indiquer Stewards, sélectionner Except specific security groups et saisir StewardTrainees." } }
    - { id: d, text: { en: "Specify Stewards, and enter the trainees' user accounts as excluded users.", fr: "Indiquer Stewards et saisir les comptes d'utilisateur des stagiaires comme utilisateurs exclus." } }
    - { id: e, text: { en: "Enable the Make certified content discoverable setting for Stewards.", fr: "Activer le paramètre Make certified content discoverable pour Stewards." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: The documentation URL becomes the Learn more link of the certification section in the endorsement settings, so unauthorized users reach the policy. Authorized certifiers are defined by security groups, and Except specific security groups excludes the members of subgroups such as StewardTrainees.
    fr: L'URL de documentation devient le lien En savoir plus de la section de certification dans les paramètres d'approbation, ce qui mène les utilisateurs non autorisés à la stratégie. Les certificateurs autorisés sont définis par des groupes de sécurité, et Except specific security groups exclut les membres de sous-groupes comme StewardTrainees.
  options:
    b: { en: "Delegating to domain administrators lets them override the settings for their domain; it doesn't exclude a subgroup or link to the policy.", fr: "Déléguer aux administrateurs de domaine leur permet de remplacer les paramètres de leur domaine ; cela n'exclut pas un sous-groupe et ne crée pas de lien vers la stratégie." }
    d: { en: "The Certification setting works with security groups only; individual users can't be entered.", fr: "Le paramètre Certification ne fonctionne qu'avec des groupes de sécurité ; il est impossible d'y saisir des utilisateurs individuels." }
    e: { en: "Discoverability lets users find certified semantic models they can't access; it doesn't define who can certify.", fr: "La détectabilité permet de trouver des modèles sémantiques certifiés auxquels on n'a pas accès ; elle ne définit pas qui peut certifier." }
references:
  - title: Enable item certification
    url: https://learn.microsoft.com/en-us/fabric/admin/endorsement-setup
