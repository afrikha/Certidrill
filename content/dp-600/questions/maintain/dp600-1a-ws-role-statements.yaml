id: dp600-1a-ws-role-statements
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has two Fabric workspaces named **WS-Risk** and **WS-Credit** on the same capacity.

    - The security group **SG-Risk-Read** has the Viewer role in WS-Risk.
    - The security group **SG-Risk-Dev** has the Contributor role in WS-Risk.
    - A user named Farid is a member of both groups.
    - A user named Gwen has the Member role in WS-Risk.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose de deux espaces de travail Fabric nommés **WS-Risk** et **WS-Credit** sur la même capacité.

    - Le groupe de sécurité **SG-Risk-Read** a le rôle Viewer dans WS-Risk.
    - Le groupe de sécurité **SG-Risk-Dev** a le rôle Contributor dans WS-Risk.
    - Un utilisateur nommé Farid est membre des deux groupes.
    - Une utilisatrice nommée Gwen a le rôle Member dans WS-Risk.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Farid can create a lakehouse in WS-Risk."
        fr: "Farid peut créer un lakehouse dans WS-Risk."
    - id: s2
      text:
        en: "Gwen can add a user to WS-Risk with the Admin role."
        fr: "Gwen peut ajouter un utilisateur à WS-Risk avec le rôle Admin."
    - id: s3
      text:
        en: "Members of SG-Risk-Dev can create items in WS-Credit."
        fr: "Les membres de SG-Risk-Dev peuvent créer des éléments dans WS-Credit."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "A user who receives several roles through groups gets the highest one, so Farid acts as a Contributor and can create items. A Member can add people with the Member role or lower, never Admins. A workspace role applies only to the items of its own workspace, not to other workspaces on the same capacity."
    fr: "Un utilisateur qui reçoit plusieurs rôles par des groupes obtient le plus élevé : Farid agit en Contributor et peut créer des éléments. Un Member peut ajouter des personnes avec le rôle Member ou un rôle inférieur, jamais des Admins. Un rôle d'espace de travail ne s'applique qu'aux éléments de son propre espace de travail, pas aux autres espaces de travail de la même capacité."
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
  - title: Give users access to workspaces
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/give-access-workspaces
