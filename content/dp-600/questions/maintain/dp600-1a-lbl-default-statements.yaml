id: dp600-1a-lbl-default-statements
objective: "1.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys configured a default label policy for Fabric and Power BI content that applies the **Internal** label. A Fabric workspace named **WS-Data** contains a lakehouse named **LH-Orders** labeled **Confidential**, a semantic model built on LH-Orders, and an unlabeled warehouse named **WH-Legacy**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys a configuré une stratégie d'étiquette par défaut pour le contenu Fabric et Power BI, qui applique l'étiquette **Internal**. Un espace de travail Fabric nommé **WS-Data** contient un lakehouse nommé **LH-Orders** étiqueté **Confidential**, un modèle sémantique basé sur LH-Orders et un entrepôt sans étiquette nommé **WH-Legacy**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A new lakehouse that a user creates through the creation dialog, without choosing a label, gets the Internal label."
        fr: "Un nouveau lakehouse qu'un utilisateur crée par la boîte de dialogue de création, sans choisir d'étiquette, reçoit l'étiquette Internal."
    - id: s2
      text:
        en: "When a user edits tables of WH-Legacy in the warehouse editor, WH-Legacy gets the Internal label."
        fr: "Quand un utilisateur modifie des tables de WH-Legacy dans l'éditeur d'entrepôt, WH-Legacy reçoit l'étiquette Internal."
    - id: s3
      text:
        en: "When the label of LH-Orders changes, the new label can propagate to the semantic model built on LH-Orders."
        fr: "Quand l'étiquette de LH-Orders change, la nouvelle étiquette peut se propager au modèle sémantique basé sur LH-Orders."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "A default label is applied when a user creates an item through a clear create dialog. For existing unlabeled non-Power BI items, only changes to attributes such as name or description made from the flyout menu trigger the default label; changes made in the experience interface don't. Downstream inheritance supports the Fabric to Power BI direction."
    fr: "Une étiquette par défaut est appliquée quand un utilisateur crée un élément par une boîte de dialogue de création explicite. Pour les éléments non Power BI existants sans étiquette, seules les modifications d'attributs comme le nom ou la description faites depuis le menu volant déclenchent l'étiquette par défaut ; les modifications faites dans l'interface de l'expérience ne la déclenchent pas. L'héritage en aval prend en charge la direction Fabric vers Power BI."
references:
  - title: Default label policy for Fabric and Power BI
    url: https://learn.microsoft.com/en-us/fabric/governance/sensitivity-label-default-label-policy
  - title: Information protection in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/information-protection
