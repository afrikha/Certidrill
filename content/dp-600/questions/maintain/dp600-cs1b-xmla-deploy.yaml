id: dp600-cs1b-xmla-deploy
objective: "1.2.5"
type: yesno_statements
caseStudy: dp600-cs1b-woodgrove-bank
difficulty: 2
status: draft
stem:
  en: |
    You are preparing the environment for the Tabular Editor requirement. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez l'environnement pour l'exigence concernant Tabular Editor. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The XMLA Endpoint setting of the F128 capacity must be changed to Read Write before the engineers can deploy changes to FinanceModel.
        fr: Le paramètre XMLA Endpoint de la capacité F128 doit être passé à Read Write avant que les ingénieurs puissent déployer des modifications de FinanceModel.
    - id: s2
      text:
        en: An engineer who has only the Build permission on FinanceModel can deploy changes to the model through the XMLA endpoint.
        fr: Un ingénieur qui ne dispose que de l'autorisation Build sur FinanceModel peut déployer des modifications du modèle via le point de terminaison XMLA.
    - id: s3
      text:
        en: After an engineer saves a change to FinanceModel through the XMLA endpoint, FinanceModel can still be downloaded from the service as a .pbix file.
        fr: Après qu'un ingénieur a enregistré une modification de FinanceModel via le point de terminaison XMLA, FinanceModel peut encore être téléchargé depuis le service sous forme de fichier .pbix.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: The XMLA endpoint of a capacity is read-only by default, and the capacity settings have never been changed, so it must be set to Read Write for write operations. Build permission only allows reading and querying through the endpoint; writing requires write permission on the model, which workspace Contributor and higher roles have. A write operation through the XMLA endpoint on a model authored in Power BI Desktop prevents downloading it back as a .pbix file, so the original file must be kept.
    fr: Le point de terminaison XMLA d'une capacité est en lecture seule par défaut, et les paramètres de la capacité n'ont jamais été modifiés ; il doit donc être passé à Read Write pour les opérations d'écriture. L'autorisation Build permet seulement de lire et d'interroger via le point de terminaison ; l'écriture exige l'autorisation d'écriture sur le modèle, dont disposent le rôle d'espace de travail Contributor et les rôles supérieurs. Une opération d'écriture via le point de terminaison XMLA sur un modèle créé dans Power BI Desktop empêche de le retélécharger sous forme de fichier .pbix ; il faut donc conserver le fichier d'origine.
references:
  - title: Semantic model connectivity and management with the XMLA endpoint in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/service-premium-connect-tools
