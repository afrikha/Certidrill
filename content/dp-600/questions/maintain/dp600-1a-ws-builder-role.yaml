id: dp600-1a-ws-builder-role
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Fabric workspace named **WS-Sales** that contains lakehouses, notebooks and pipelines.

    A data engineer named Ana must create, edit and run notebooks, lakehouses and pipelines in WS-Sales. Ana must not be able to add other people to the workspace. The solution must follow the principle of least privilege.

    Which workspace role should you assign to Ana?
  fr: |
    Contoso dispose d'un espace de travail Fabric nommé **WS-Sales** qui contient des lakehouses, des notebooks et des pipelines.

    Une ingénieure données nommée Ana doit créer, modifier et exécuter des notebooks, des lakehouses et des pipelines dans WS-Sales. Ana ne doit pas pouvoir ajouter d'autres personnes à l'espace de travail. La solution doit respecter le principe du privilège minimum.

    Quel rôle d'espace de travail devez-vous attribuer à Ana ?
body:
  options:
    - { id: a, text: Viewer }
    - { id: b, text: Contributor }
    - { id: c, text: Member }
    - { id: d, text: Admin }
answer: { optionId: b }
explanation:
  correct:
    en: "Contributor can create, modify and delete items, write lakehouse and warehouse data, and run or cancel notebooks and pipelines. It cannot add people to the workspace, which is reserved for Member and Admin."
    fr: "Contributor peut créer, modifier et supprimer des éléments, écrire les données des lakehouses et des entrepôts, et exécuter ou annuler des notebooks et des pipelines. Il ne peut pas ajouter de personnes à l'espace de travail, ce qui est réservé à Member et Admin."
  options:
    a: { en: "Viewer can read content and execution output, but cannot create, modify or run items.", fr: "Viewer peut lire le contenu et les résultats d'exécution, mais ne peut ni créer, ni modifier, ni exécuter des éléments." }
    c: { en: "Member can also add people to the workspace, which Ana must not be able to do.", fr: "Member peut aussi ajouter des personnes à l'espace de travail, ce qu'Ana ne doit pas pouvoir faire." }
    d: { en: "Admin can add and remove people and delete the workspace: far more than required.", fr: "Admin peut ajouter et retirer des personnes et supprimer l'espace de travail : bien plus que nécessaire." }
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
