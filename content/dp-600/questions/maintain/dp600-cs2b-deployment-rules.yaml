id: dp600-cs2b-deployment-rules
objective: "1.2.3"
type: single
caseStudy: dp600-cs2b-bellows-college
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the deployment requirement for SM-Enrollment.

    What should you do?
  fr: |
    Vous devez respecter l'exigence de déploiement de SM-Enrollment.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "In the Development stage, create parameter rules for SM-Enrollment.", fr: "Dans la phase Development, créer des règles de paramètres pour SM-Enrollment." }
    - id: b
      text: { en: "In the Test and Production stages, create data source rules for SM-Enrollment.", fr: "Dans les phases Test et Production, créer des règles de source de données pour SM-Enrollment." }
    - id: c
      text: { en: "In the Test and Production stages, create parameter rules for SM-Enrollment.", fr: "Dans les phases Test et Production, créer des règles de paramètres pour SM-Enrollment." }
    - id: d
      text: { en: "After each deployment, edit the parameters in the settings of SM-Enrollment in the target workspace.", fr: "Après chaque déploiement, modifier les paramètres dans les paramètres de SM-Enrollment de l'espace de travail cible." }
answer:
  optionId: c
explanation:
  correct:
    en: "Deployment rules are created in the target stage, and they apply each time an item is deployed to that stage. Because the connection of SM-Enrollment is defined by the WarehouseServer and WarehouseName parameters, parameter rules set the values of the Test and Production warehouses automatically."
    fr: "Les règles de déploiement sont créées dans la phase cible et s'appliquent chaque fois qu'un élément est déployé dans cette phase. Comme la connexion de SM-Enrollment est définie par les paramètres WarehouseServer et WarehouseName, des règles de paramètres définissent automatiquement les valeurs des entrepôts de Test et de Production."
  options:
    a:
      en: "Deployment rules cannot be created in the Development stage; they are defined in the stage that receives the deployment."
      fr: "Les règles de déploiement ne peuvent pas être créées dans la phase Development ; elles sont définies dans la phase qui reçoit le déploiement."
    b:
      en: "Data source rules are not supported on data sources that are parametrized; the parameters must be changed with parameter rules."
      fr: "Les règles de source de données ne sont pas prises en charge sur les sources de données paramétrées ; les paramètres doivent être modifiés par des règles de paramètres."
    d:
      en: "Editing the parameters manually after each deployment is not automatic and adds effort at every release."
      fr: "La modification manuelle des paramètres après chaque déploiement n'est pas automatique et ajoute du travail à chaque mise en production."
references:
  - title: Create deployment rules for Fabric's ALM
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/create-rules
