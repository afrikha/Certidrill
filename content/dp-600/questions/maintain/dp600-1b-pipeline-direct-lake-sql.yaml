id: dp600-1b-pipeline-direct-lake-sql
objective: "1.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a deployment pipeline that has Development, Test and Production stages. The Development workspace contains a lakehouse named LH-Ops and a semantic model named SM-Ops in Direct Lake on SQL mode that uses the SQL analytics endpoint of LH-Ops. The Test workspace contains its own copy of LH-Ops.

    You deploy SM-Ops to Test. SM-Ops in Test still reads the tables of the Development lakehouse.

    You need SM-Ops in Test to use the SQL analytics endpoint of the Test lakehouse at every deployment. You are the owner of SM-Ops.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline de déploiement qui comporte les étapes Development, Test et Production. L'espace de travail de Development contient un lakehouse nommé LH-Ops et un modèle sémantique nommé SM-Ops en mode Direct Lake sur SQL qui utilise le point de terminaison d'analytique SQL de LH-Ops. L'espace de travail de Test contient sa propre copie de LH-Ops.

    Vous déployez SM-Ops vers Test. Dans Test, SM-Ops lit toujours les tables du lakehouse de Development.

    Vous devez faire en sorte que SM-Ops utilise en Test le point de terminaison d'analytique SQL du lakehouse de Test à chaque déploiement. Vous êtes propriétaire de SM-Ops.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Refresh SM-Ops in the Test workspace.", fr: "Actualiser SM-Ops dans l'espace de travail de Test." } }
    - { id: b, text: { en: "In the Test stage, create a data source rule for SM-Ops that points to the Test lakehouse.", fr: "Dans l'étape Test, créer une règle de source de données pour SM-Ops qui pointe vers le lakehouse de Test." } }
    - { id: c, text: { en: "In the Development stage, create a parameter rule for SM-Ops.", fr: "Dans l'étape Development, créer une règle de paramètre pour SM-Ops." } }
    - { id: d, text: { en: "Redeploy SM-Ops from Development to Test.", fr: "Redéployer SM-Ops de Development vers Test." } }
    - { id: e, text: { en: "Deploy LH-Ops to Test together with SM-Ops by using Select related.", fr: "Déployer LH-Ops vers Test avec SM-Ops à l'aide de Select related." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Direct Lake semantic models aren't autobound and keep pointing to the source-stage item. For Direct Lake on SQL models, a data source rule in the target stage rebinds the model; the rule takes effect only at the next deployment, so you redeploy SM-Ops.
    fr: Les modèles sémantiques Direct Lake ne sont pas liés automatiquement et continuent de pointer vers l'élément de l'étape source. Pour les modèles Direct Lake sur SQL, une règle de source de données dans l'étape cible relie le modèle ; la règle ne prend effet qu'au déploiement suivant, d'où le redéploiement de SM-Ops.
  options:
    a: { en: "Refreshing reframes the model on its current source, which is still the Development lakehouse.", fr: "L'actualisation recadre le modèle sur sa source actuelle, qui reste le lakehouse de Development." }
    c: { en: "Rules can't be created in the development stage, and Direct Lake on SQL models use data source rules.", fr: "Les règles ne peuvent pas être créées dans l'étape de développement, et les modèles Direct Lake sur SQL utilisent des règles de source de données." }
    e: { en: "Deploying the lakehouse again doesn't change the binding, because Direct Lake models aren't autobound.", fr: "Redéployer le lakehouse ne change pas la liaison, car les modèles Direct Lake ne sont pas liés automatiquement." }
references:
  - title: Assign a workspace to a deployment pipeline
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/assign-pipeline
  - title: Create deployment rules for Fabric's ALM
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/create-rules
