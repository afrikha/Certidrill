id: dp600-1a-item-shortcut-target
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has two Fabric workspaces:

    - **WS-Source** contains a lakehouse named **LH-Source** with a table named `customers`.
    - **WS-Analysis** contains a lakehouse named **LH-Analysis**. LH-Analysis contains a OneLake shortcut named `customers` that points to the `customers` table of LH-Source, with the default authentication for OneLake-to-OneLake shortcuts.

    A user named Pia has no role in either workspace. LH-Analysis was shared with Pia with Read all with Apache Spark. From a notebook in her own workspace, Pia can read the local tables of LH-Analysis, but reading the `customers` shortcut fails. OneLake security roles are not customized on either lakehouse.

    Pia must read the shortcut from Spark. The solution must follow the principle of least privilege. What should you do?
  fr: |
    Wingtip Toys dispose de deux espaces de travail Fabric :

    - **WS-Source** contient un lakehouse nommé **LH-Source** avec une table nommée `customers`.
    - **WS-Analysis** contient un lakehouse nommé **LH-Analysis**. LH-Analysis contient un raccourci OneLake nommé `customers` qui pointe vers la table `customers` de LH-Source, avec l'authentification par défaut des raccourcis de OneLake vers OneLake.

    Une utilisatrice nommée Pia n'a aucun rôle dans les deux espaces de travail. LH-Analysis a été partagé avec Pia avec Read all with Apache Spark. Depuis un notebook de son propre espace de travail, Pia peut lire les tables locales de LH-Analysis, mais la lecture du raccourci `customers` échoue. Les rôles de sécurité OneLake ne sont personnalisés sur aucun des deux lakehouses.

    Pia doit lire le raccourci depuis Spark. La solution doit respecter le principe du privilège minimum. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Share LH-Source with Pia and select Read all with Apache Spark", fr: "Partager LH-Source avec Pia en sélectionnant Read all with Apache Spark" } }
    - { id: b, text: { en: "Share LH-Source with Pia and select Read all with SQL analytics endpoint", fr: "Partager LH-Source avec Pia en sélectionnant Read all with SQL analytics endpoint" } }
    - { id: c, text: { en: "Assign Pia the Contributor role in WS-Analysis", fr: "Attribuer à Pia le rôle Contributor dans WS-Analysis" } }
    - { id: d, text: { en: "Assign Pia the Viewer role in WS-Source", fr: "Attribuer à Pia le rôle Viewer dans WS-Source" } }
answer: { optionId: a }
explanation:
  correct:
    en: "OneLake-to-OneLake shortcuts use passthrough authentication by default, so OneLake checks the calling user's identity on the target. Pia needs read access to the target data in LH-Source; with default roles, ReadAll on LH-Source gives it through the DefaultReader role. Sharing LH-Source with Read all with Apache Spark grants this on one item only."
    fr: "Les raccourcis de OneLake vers OneLake utilisent par défaut l'authentification directe (passthrough) : OneLake vérifie l'identité de l'utilisateur appelant sur la cible. Pia a besoin d'un accès en lecture aux données cibles de LH-Source ; avec les rôles par défaut, ReadAll sur LH-Source le donne par le rôle DefaultReader. Partager LH-Source avec Read all with Apache Spark l'accorde sur ce seul élément."
  options:
    b: { en: "ReadData covers T-SQL queries through the SQL analytics endpoint, not Spark reads of the OneLake files.", fr: "ReadData couvre les requêtes T-SQL par le point de terminaison d'analytique SQL, pas la lecture Spark des fichiers OneLake." }
    c: { en: "A role in WS-Analysis gives nothing on LH-Source, where the shortcut target lives, and it grants write access.", fr: "Un rôle dans WS-Analysis ne donne rien sur LH-Source, où se trouve la cible du raccourci, et il accorde l'écriture." }
    d: { en: "Viewer doesn't include ReadAll, so Spark still couldn't read LH-Source, and it exposes every item of WS-Source.", fr: "Viewer n'inclut pas ReadAll : Spark ne pourrait toujours pas lire LH-Source, et ce rôle expose tous les éléments de WS-Source." }
references:
  - title: OneLake security roles, permissions, and scopes
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/data-access-control-model
  - title: Share items in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/share-items
