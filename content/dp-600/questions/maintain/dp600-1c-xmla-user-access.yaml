id: dp600-1c-xmla-user-access
objective: "1.2.5"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Fin** on a capacity whose XMLA Endpoint setting is set to **Read Write**. WS-Fin contains a semantic model named **SM-Fin** that has a row-level security role named **West**. The users shown in the following table need to connect to WS-Fin through the XMLA endpoint.

    Answer each prompt by selecting the user.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Fin** sur une capacité dont le paramètre XMLA Endpoint est défini sur **Read Write**. WS-Fin contient un modèle sémantique nommé **SM-Fin** qui comporte un rôle de sécurité au niveau des lignes nommé **West**. Les utilisateurs indiqués dans le tableau suivant doivent se connecter à WS-Fin par le point de terminaison XMLA.

    Répondez à chaque consigne en sélectionnant l'utilisateur.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Which user can deploy a metadata change to SM-Fin?", fr: "Quel utilisateur peut déployer une modification des métadonnées de SM-Fin ?" }
    - id: p2
      text: { en: "Which user can query SM-Fin and sees only the rows allowed by West?", fr: "Quel utilisateur peut interroger SM-Fin et ne voit que les lignes autorisées par West ?" }
  grid:
    header: [{ en: "User", fr: "Utilisateur" }, { en: "Role in WS-Fin", fr: "Rôle dans WS-Fin" }, { en: "Permissions on SM-Fin", fr: "Autorisations sur SM-Fin" }, { en: "Member of West", fr: "Membre de West" }]
    rows:
      - [{ text: User1, area: u1 }, { text: { en: "None", fr: "Aucun" } }, { text: { en: "Read, without Build", fr: "Read, sans Build" } }, { text: { en: "Yes", fr: "Oui" } }]
      - [{ text: User2, area: u2 }, { text: Contributor }, { text: { en: "From the workspace role", fr: "Issues du rôle d'espace de travail" } }, { text: { en: "No", fr: "Non" } }]
      - [{ text: User3, area: u3 }, { text: { en: "None", fr: "Aucun" } }, { text: "Read, Build" }, { text: { en: "Yes", fr: "Oui" } }]
      - [{ text: User4, area: u4 }, { text: { en: "None", fr: "Aucun" } }, { text: { en: "Read, Reshare, without Build", fr: "Read, Reshare, sans Build" } }, { text: { en: "No", fr: "Non" } }]
answer:
  values: { p1: u2, p2: u3 }
explanation:
  correct:
    en: "Contributor and higher roles have write permission on the models of the workspace, which is equivalent to an Analysis Services database administrator, so User2 can deploy metadata. Build permission is required for read access through the XMLA endpoint and makes the user a database reader whose RLS rules are honored, so User3 sees only the West rows. User1 and User4 lack Build and can't connect through the endpoint."
    fr: "Les rôles Contributor et supérieurs ont l'autorisation d'écriture sur les modèles de l'espace de travail, l'équivalent d'un administrateur de base de données Analysis Services : User2 peut donc déployer des métadonnées. L'autorisation Build est requise pour l'accès en lecture par le point de terminaison XMLA et fait de l'utilisateur un lecteur de base de données dont les règles RLS sont appliquées : User3 ne voit donc que les lignes de West. User1 et User4 n'ont pas Build et ne peuvent pas se connecter par le point de terminaison."
references:
  - title: Semantic model connectivity and management with the XMLA endpoint in Power BI
    url: https://learn.microsoft.com/en-us/fabric/enterprise/powerbi/service-premium-connect-tools
  - title: Build permission for shared semantic models
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/service-datasets-build-permissions
