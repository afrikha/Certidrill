id: dp600-1c-ia-lineage-features
objective: "1.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Sales** that contains a semantic model named **SM1**. SM1 imports data from a lakehouse named **LH1** that is in another workspace, and from an Azure SQL database. You have the Contributor role in WS-Sales.

    You open the lineage view of WS-Sales and need to perform the tasks described in the answer area.

    Which feature should you use for each task? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Sales** qui contient un modèle sémantique nommé **SM1**. SM1 importe des données depuis un lakehouse nommé **LH1** situé dans un autre espace de travail, et depuis une base de données Azure SQL. Vous avez le rôle Contributor dans WS-Sales.

    Vous ouvrez la vue de traçabilité de WS-Sales et devez effectuer les tâches décrites dans la zone de réponse.

    Quelle fonctionnalité devez-vous utiliser pour chaque tâche ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Highlight every item related to SM1 and dim the others: [[hl]]

      Find the name of the workspace that contains LH1: [[ws]]

      Display the connection string used to connect to the Azure SQL database: [[cs]]
    fr: |
      Mettre en évidence tous les éléments liés à SM1 et estomper les autres : [[hl]]

      Trouver le nom de l'espace de travail qui contient LH1 : [[ws]]

      Afficher la chaîne de connexion utilisée pour se connecter à la base de données Azure SQL : [[cs]]
  slots:
    - id: hl
      options:
        - { id: arrow, text: { en: "The arrow at the bottom-right corner of the SM1 card", fr: "La flèche dans le coin inférieur droit de la carte de SM1" } }
        - { id: lhcard, text: { en: "The LH1 card in the lineage view", fr: "La carte de LH1 dans la vue de traçabilité" } }
        - { id: iads, text: { en: "Impact analysis of the Azure SQL data source", fr: "L'analyse d'impact de la source de données Azure SQL" } }
        - { id: iasm, text: { en: "Impact analysis of SM1", fr: "L'analyse d'impact de SM1" } }
    - id: ws
      options:
        - { id: arrow, text: { en: "The arrow at the bottom-right corner of the SM1 card", fr: "La flèche dans le coin inférieur droit de la carte de SM1" } }
        - { id: lhcard, text: { en: "The LH1 card in the lineage view", fr: "La carte de LH1 dans la vue de traçabilité" } }
        - { id: iads, text: { en: "Impact analysis of the Azure SQL data source", fr: "L'analyse d'impact de la source de données Azure SQL" } }
        - { id: iasm, text: { en: "Impact analysis of SM1", fr: "L'analyse d'impact de SM1" } }
    - id: cs
      options:
        - { id: arrow, text: { en: "The arrow at the bottom-right corner of the SM1 card", fr: "La flèche dans le coin inférieur droit de la carte de SM1" } }
        - { id: lhcard, text: { en: "The LH1 card in the lineage view", fr: "La carte de LH1 dans la vue de traçabilité" } }
        - { id: iads, text: { en: "Impact analysis of the Azure SQL data source", fr: "L'analyse d'impact de la source de données Azure SQL" } }
        - { id: iasm, text: { en: "Impact analysis of SM1", fr: "L'analyse d'impact de SM1" } }
answer:
  values: { hl: arrow, ws: lhcard, cs: iads }
explanation:
  correct:
    en: "Selecting the arrow at the bottom-right corner of a card highlights all the items related to that item and dims the rest. The lineage view shows upstream items of other workspaces one level up, and their card shows the name of their workspace. Impact analysis of a data source shows the connection string used to connect to it, with its direct child items."
    fr: "La flèche dans le coin inférieur droit d'une carte met en évidence tous les éléments liés à cet élément et estompe les autres. La vue de traçabilité montre les éléments en amont des autres espaces de travail sur un niveau, et leur carte affiche le nom de leur espace de travail. L'analyse d'impact d'une source de données affiche la chaîne de connexion utilisée pour s'y connecter, avec ses éléments enfants directs."
  options:
    iasm:
      en: "Impact analysis of SM1 lists the items downstream of SM1; it shows neither its upstream sources nor a connection string."
      fr: "L'analyse d'impact de SM1 liste les éléments en aval de SM1 ; elle n'affiche ni ses sources en amont ni une chaîne de connexion."
references:
  - title: Lineage in Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/lineage
  - title: Impact analysis
    url: https://learn.microsoft.com/en-us/fabric/governance/impact-analysis
