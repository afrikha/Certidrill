id: dp600-1c-xmla-refresh-facts
objective: "1.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a semantic model named **SM-Logistics** in a Fabric workspace whose capacity has the XMLA Endpoint setting set to **Read Write**. SM-Logistics imports data from an Azure SQL database. A dashboard in the workspace has tiles pinned from a report built on SM-Logistics.

    You plan to refresh SM-Logistics from an Azure Automation runbook that sends TMSL commands through the XMLA endpoint, several times per hour.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un modèle sémantique nommé **SM-Logistics** dans un espace de travail Fabric dont la capacité a le paramètre XMLA Endpoint défini sur **Read Write**. SM-Logistics importe des données depuis une base de données Azure SQL. Un tableau de bord de l'espace de travail comporte des vignettes épinglées depuis un rapport reposant sur SM-Logistics.

    Vous prévoyez d'actualiser SM-Logistics depuis un runbook Azure Automation qui envoie des commandes TMSL par le point de terminaison XMLA, plusieurs fois par heure.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The refreshes count toward the limit of 48 scheduled refreshes per day.", fr: "Les actualisations sont décomptées de la limite de 48 actualisations planifiées par jour." } }
    - { id: b, text: { en: "The refreshes appear in the refresh history of SM-Logistics as performed via the XMLA endpoint.", fr: "Les actualisations apparaissent dans l'historique d'actualisation de SM-Logistics comme effectuées par le point de terminaison XMLA." } }
    - { id: c, text: { en: "Each refresh automatically updates the tile caches of the dashboard.", fr: "Chaque actualisation met automatiquement à jour les caches des vignettes du tableau de bord." } }
    - { id: d, text: { en: "The refreshes aren't subject to the timeout of scheduled refreshes.", fr: "Les actualisations ne sont pas soumises au délai d'expiration des actualisations planifiées." } }
    - { id: e, text: { en: "The runbook can set the credentials of the Azure SQL data source in a TMSL command.", fr: "Le runbook peut définir les informations d'identification de la source Azure SQL dans une commande TMSL." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Refresh operations through the XMLA endpoint aren't limited to 48 refreshes per day, and the scheduled refresh timeout isn't imposed. They're recorded in the refresh history with the label via XMLA endpoint."
    fr: "Les actualisations effectuées par le point de terminaison XMLA ne sont pas limitées à 48 par jour, et le délai d'expiration des actualisations planifiées ne s'applique pas. Elles sont enregistrées dans l'historique d'actualisation avec la mention via XMLA endpoint."
  options:
    a:
      en: "XMLA refreshes aren't limited to 48 refreshes per day."
      fr: "Les actualisations XMLA ne sont pas limitées à 48 par jour."
    c:
      en: "Refreshes performed through the XMLA endpoint don't automatically refresh tile caches."
      fr: "Les actualisations effectuées par le point de terminaison XMLA n'actualisent pas automatiquement les caches des vignettes."
    e:
      en: "Metadata sent through the XMLA endpoint can't set data source credentials; they're set in the semantic model settings in the service."
      fr: "Les métadonnées envoyées par le point de terminaison XMLA ne peuvent pas définir les informations d'identification ; elles se définissent dans les paramètres du modèle sémantique dans le service."
references:
  - title: Semantic model connectivity and management with the XMLA endpoint in Power BI
    url: https://learn.microsoft.com/en-us/fabric/enterprise/powerbi/service-premium-connect-tools
