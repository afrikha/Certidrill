id: dp600-1c-ra-pbids-facts
objective: "1.2.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You create a Power BI data source (.pbids) file named **Finance.pbids** that connects to an Azure SQL database named **FinanceDB**. The file doesn't contain a mode property. You send the file to report authors.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un fichier de source de données Power BI (.pbids) nommé **Finance.pbids** qui se connecte à une base de données Azure SQL nommée **FinanceDB**. Le fichier ne contient pas de propriété mode. Vous envoyez le fichier aux auteurs de rapports.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When an author opens Finance.pbids, Power BI Desktop prompts the author to select DirectQuery or Import.
        fr: Quand un auteur ouvre Finance.pbids, Power BI Desktop lui demande de sélectionner DirectQuery ou Import.
    - id: s2
      text:
        en: You can add a second connection, to another database, in the connections array of Finance.pbids.
        fr: Vous pouvez ajouter une seconde connexion, vers une autre base de données, dans le tableau connections de Finance.pbids.
    - id: s3
      text:
        en: When an author opens Finance.pbids, Power BI Desktop loads all the tables of FinanceDB without showing the Navigator.
        fr: Quand un auteur ouvre Finance.pbids, Power BI Desktop charge toutes les tables de FinanceDB sans afficher le Navigateur.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "When mode is missing or null, the user who opens the file is prompted to select DirectQuery or Import. A .pbids file supports a single data source, and specifying more than one results in an error. The file holds no table or schema information, so after authentication the Navigator opens for the author to select the tables."
    fr: "Quand mode est absent ou null, l'utilisateur qui ouvre le fichier doit choisir entre DirectQuery et Import. Un fichier .pbids prend en charge une seule source de données, et en indiquer plusieurs provoque une erreur. Le fichier ne contient aucune information de table ni de schéma : après l'authentification, le Navigateur s'ouvre pour que l'auteur sélectionne les tables."
references:
  - title: Data sources in Power BI Desktop
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-data-sources
