id: dp600-cs2c-branch-workflow
objective: "1.2.1"
type: ordering
caseStudy: dp600-cs2c-blue-yonder-airlines
difficulty: 2
status: draft
stem:
  en: |
    A developer must add a measure to SM-FlightOps. You need to meet the development requirement.

    Which four actions should the developer perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un développeur doit ajouter une mesure à SM-FlightOps. Vous devez respecter l'exigence de développement.

    Quelles sont les quatre actions que le développeur doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et placez-les dans l'ordre correct.
body:
  count: 4
  actions:
    - id: branchout
      text: { en: "From the Source control pane of FlightOps-BI, branch out to a new workspace and a new branch.", fr: "Depuis le volet Contrôle de code source de FlightOps-BI, créer une branche vers un nouvel espace de travail et une nouvelle branche." }
    - id: commit
      text: { en: "Add the measure in the new workspace, and commit the change to the new branch.", fr: "Ajouter la mesure dans le nouvel espace de travail et valider la modification dans la nouvelle branche." }
    - id: pr
      text: { en: "In Azure Repos, create a pull request from the new branch to main, and complete it after the review.", fr: "Dans Azure Repos, créer une demande de tirage de la nouvelle branche vers main, puis la terminer après la revue." }
    - id: update
      text: { en: "From the Source control pane of FlightOps-BI, update the workspace with the new commit of main.", fr: "Depuis le volet Contrôle de code source de FlightOps-BI, mettre à jour l'espace de travail avec le nouveau commit de main." }
    - id: pipeline
      text: { en: "Deploy SM-FlightOps from the new workspace to FlightOps-BI by using a deployment pipeline.", fr: "Déployer SM-FlightOps du nouvel espace de travail vers FlightOps-BI à l'aide d'un pipeline de déploiement." }
    - id: direct
      text: { en: "Add the measure in FlightOps-BI, and commit the change to main.", fr: "Ajouter la mesure dans FlightOps-BI et valider la modification dans main." }
answer:
  sequence: [branchout, commit, pr, update]
explanation:
  correct:
    en: "Branching out creates a branch from main and a workspace connected to it, so the developer works in isolation. The change is committed to that branch, merged into main through a reviewed pull request in Azure Repos, and the new commit of main then appears as an update in the Source control pane of FlightOps-BI, which the developer applies."
    fr: "La création d'une branche crée une branche à partir de main et un espace de travail connecté à celle-ci : le développeur travaille ainsi de façon isolée. La modification est validée dans cette branche, fusionnée dans main par une demande de tirage revue dans Azure Repos, puis le nouveau commit de main apparaît comme une mise à jour dans le volet Contrôle de code source de FlightOps-BI, que le développeur applique."
  options:
    pipeline:
      en: "A deployment pipeline bypasses the pull request, so the change would reach FlightOps-BI without a review."
      fr: "Un pipeline de déploiement contourne la demande de tirage : la modification atteindrait FlightOps-BI sans revue."
    direct:
      en: "Changing FlightOps-BI directly affects everyone who uses it and commits to main without a pull request."
      fr: "Modifier directement FlightOps-BI affecte tous ceux qui l'utilisent et valide dans main sans demande de tirage."
references:
  - title: Development process using branch workspace
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/branched-workspace
