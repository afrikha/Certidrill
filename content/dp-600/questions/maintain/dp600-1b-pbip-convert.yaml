id: dp600-1b-pbip-convert
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has 30 Power BI reports stored as .pbix files on a file share. Each file contains a report and its semantic model.

    You need to store each report and its semantic model as a Power BI project in a Git repository.

    What should you do?
  fr: |
    Fabrikam dispose de 30 rapports Power BI stockés sous forme de fichiers .pbix sur un partage de fichiers. Chaque fichier contient un rapport et son modèle sémantique.

    Vous devez stocker chaque rapport et son modèle sémantique sous forme de projet Power BI dans un référentiel Git.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the extension of each file from .pbix to .pbip, and then commit the files.", fr: "Changer l'extension de chaque fichier de .pbix en .pbip, puis valider les fichiers." } }
    - { id: b, text: { en: "Open each file in Power BI Desktop, select File > Save as, and save it as a Power BI Project.", fr: "Ouvrir chaque fichier dans Power BI Desktop, sélectionner Fichier > Enregistrer sous et l'enregistrer en tant que projet Power BI." } }
    - { id: c, text: { en: "Export each file as a Power BI template (.pbit), and then commit the templates.", fr: "Exporter chaque fichier en tant que modèle Power BI (.pbit), puis valider les modèles." } }
    - { id: d, text: { en: "Run a script that calls the Fabric REST APIs to convert each .pbix file to a project.", fr: "Exécuter un script qui appelle les API REST Fabric pour convertir chaque fichier .pbix en projet." } }
answer: { optionId: b }
explanation:
  correct:
    en: A .pbix file is converted to a Power BI project, and back, only with File > Save as in Power BI Desktop; the conversion can't be done programmatically. Desktop then writes the .Report and .SemanticModel folders that you commit to Git.
    fr: Un fichier .pbix se convertit en projet Power BI, et inversement, uniquement par Fichier > Enregistrer sous dans Power BI Desktop ; la conversion ne peut pas être faite par programmation. Desktop écrit alors les dossiers .Report et .SemanticModel que vous validez dans Git.
  options:
    a: { en: "A .pbip file is only a pointer to a report folder; renaming a binary .pbix doesn't create the project folders.", fr: "Un fichier .pbip n'est qu'un pointeur vers un dossier de rapport ; renommer un .pbix binaire ne crée pas les dossiers du projet." }
    c: { en: "A template is still a single binary file and contains no data; it isn't a project.", fr: "Un modèle reste un fichier binaire unique et ne contient aucune donnée ; ce n'est pas un projet." }
    d: { en: "The conversion between .pbix and .pbip can't be done programmatically.", fr: "La conversion entre .pbix et .pbip ne peut pas être faite par programmation." }
references:
  - title: Power BI Desktop projects (PBIP)
    url: https://learn.microsoft.com/en-us/power-bi/developer/projects/projects-overview
