id: dp600-1b-pipeline-copied-items
objective: "1.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have a deployment pipeline that has Development, Test and Production stages. You plan to deploy an Import mode semantic model named SM-HR and a report named HR from Test to Production. The Production stage already contains the paired items.

    You need to identify how the deployment handles each property.

    What should you identify for each property? To answer, drag the appropriate behaviors to the correct properties. Each behavior may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline de déploiement qui comporte les étapes Development, Test et Production. Vous prévoyez de déployer un modèle sémantique en mode Import nommé SM-HR et un rapport nommé HR de Test vers Production. L'étape Production contient déjà les éléments appariés.

    Vous devez identifier comment le déploiement traite chaque propriété.

    Que devez-vous identifier pour chaque propriété ? Pour répondre, faites glisser les comportements appropriés vers les propriétés correspondantes. Chaque comportement peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: copied, text: { en: "Copied from Test and overwrites Production", fr: "Copié depuis Test et écrase Production" } }
    - { id: notcopied, text: { en: "Not copied; Production keeps its own value", fr: "Non copié ; Production conserve sa propre valeur" } }
    - { id: rule, text: { en: "Copied, then changed by a deployment rule if one exists", fr: "Copié, puis modifié par une règle de déploiement s'il en existe une" } }
  targets:
    - id: pages
      text: { en: "The pages and visuals of HR", fr: "Les pages et visuels de HR" }
    - id: schedule
      text: { en: "The refresh schedule of SM-HR", fr: "La planification d'actualisation de SM-HR" }
    - id: roles
      text: { en: "The members assigned to the RLS roles of SM-HR", fr: "Les membres affectés aux rôles RLS de SM-HR" }
    - id: source
      text: { en: "The data source of SM-HR", fr: "La source de données de SM-HR" }
answer:
  mapping: { pages: copied, schedule: notcopied, roles: notcopied, source: rule }
explanation:
  correct:
    en: Deployment overwrites the paired items with the report pages, visuals and model metadata of the source. Data sources and parameters are copied too, and deployment rules defined in the target stage then change them. Semantic model role assignments, refresh schedules, data source credentials and endorsement settings aren't copied.
    fr: Le déploiement écrase les éléments appariés avec les pages, les visuels et les métadonnées de modèle de la source. Les sources de données et les paramètres sont aussi copiés, puis modifiés par les règles de déploiement définies dans l'étape cible. Les attributions de rôles du modèle sémantique, les planifications d'actualisation, les informations d'identification des sources et les paramètres d'approbation ne sont pas copiés.
references:
  - title: The Microsoft Fabric deployment pipelines process
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/understand-the-deployment-process
