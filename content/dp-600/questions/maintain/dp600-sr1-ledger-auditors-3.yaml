id: dp600-sr1-ledger-auditors-3
objective: "1.1.2"
type: series_yesno
series: dp600-sr1-ledger-auditors
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You share WH-Ledger and select Read all data using Apache Spark.
  fr: Vous partagez WH-Ledger et sélectionnez Read all data using Apache Spark.
body:
  solution:
    en: |
      You share **WH-Ledger** with the ExtAuditors group and, in the share dialog, you select only the **Read all data using Apache Spark** check box.
    fr: |
      Vous partagez **WH-Ledger** avec le groupe ExtAuditors et, dans la boîte de dialogue de partage, vous cochez uniquement la case **Read all data using Apache Spark**.
answer: { value: false }
explanation:
  correct:
    en: |
      Read all data using Apache Spark adds the ReadAll permission, which gives access to the warehouse files in OneLake through Spark, not to the tables through T-SQL. With the default Read permission, the auditors can only connect to the SQL endpoint: they can't query any table or view until they receive ReadData or T-SQL `GRANT` permissions.
    fr: |
      Read all data using Apache Spark ajoute l'autorisation ReadAll, qui donne accès aux fichiers de l'entrepôt dans OneLake par Spark, et non aux tables en T-SQL. Avec l'autorisation Read accordée par défaut, les auditeurs peuvent seulement se connecter au point de terminaison SQL : ils ne peuvent interroger aucune table ni aucune vue tant qu'ils n'ont pas reçu ReadData ou des autorisations T-SQL `GRANT`.
references:
  - title: Share your data and manage permissions
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions
