# DP-600 objectives — official study guide, skills measured as of 2026-10-19.
# English: en-gb / en-au editions of the study guide (the en-us URL returned the 2024 outline on 2026-11-16,
# see blueprint.yaml). French: fr-fr page, with one machine-translation slip corrected:
# 2.2.5 "Données agrégées" -> "Agréger des données" (Aggregate data).
# `code` is the stable key referenced by question files and course sections.
maintain:
- group:
    en: Implement security and governance
    fr: Implémenter la sécurité et la gouvernance
  objectives:
  - code: 1.1.1
    en: Implement workspace-level access controls
    fr: Implémenter des contrôles d'accès au niveau de l'espace de travail
  - code: 1.1.2
    en: Implement item-level access controls
    fr: Implémenter des contrôles d'accès au niveau de l'élément
  - code: 1.1.3
    en: Implement row-level, column-level, object-level, and file-level access control
    fr: Implémenter le contrôle d'accès au niveau des lignes, au niveau des colonnes, au niveau de l'objet et au niveau du fichier
  - code: 1.1.4
    en: Apply sensitivity labels to items
    fr: Appliquer des étiquettes de confidentialité aux éléments
  - code: 1.1.5
    en: Endorse items
    fr: Approuver les éléments
- group:
    en: Maintain the analytics development lifecycle
    fr: Maintenir le cycle de vie de développement des analyses
  objectives:
  - code: 1.2.1
    en: Configure version control for a workspace
    fr: Configurer le contrôle de version pour un espace de travail
  - code: 1.2.2
    en: Create and manage a Power BI Desktop project (.pbip)
    fr: Créer et gérer un projet Power BI Desktop (.pbip)
  - code: 1.2.3
    en: Create and configure deployment pipelines
    fr: Créer et configurer des pipelines de déploiement
  - code: 1.2.4
    en: Perform impact analysis of downstream dependencies from lakehouses, warehouses, dataflows, and semantic models
    fr: Réalisez une analyse d'impact des dépendances en aval à partir de lakehouses, d'entrepôts, de flux de données et de modèles sémantiques
  - code: 1.2.5
    en: Deploy and manage semantic models by using the XMLA endpoint
    fr: Déployer et gérer des modèles sémantiques à l'aide du point de terminaison XMLA
  - code: 1.2.6
    en: Create and update reusable assets, including Power BI template (.pbit) files, Power BI data source (.pbids) files, and shared semantic models
    fr: Créer et mettre à jour des ressources réutilisables, y compris des fichiers de modèles Power BI (.pbit), des fichiers de source de données Power BI (.pbids) et des modèles sémantiques partagés
prepare:
- group:
    en: Get data
    fr: Obtenir des données
  objectives:
  - code: 2.1.1
    en: Create a data connection
    fr: Créer une connexion de données
  - code: 2.1.2
    en: Discover data by using OneLake catalog and Real-Time hub
    fr: Découvrir des données à l'aide du catalogue OneLake et du hub Real-Time
  - code: 2.1.3
    en: Ingest or access data as needed
    fr: Ingérer ou accéder aux données selon les besoins
  - code: 2.1.4
    en: Choose between different data stores
    fr: Choisir entre différents magasins de données
  - code: 2.1.5
    en: Implement OneLake integration for Eventhouse and semantic models
    fr: Implémenter l'intégration de OneLake pour Eventhouse et des modèles sémantiques
- group:
    en: Transform data
    fr: Transformer les données
  objectives:
  - code: 2.2.1
    en: Create views, functions, and stored procedures
    fr: Créer des vues, des fonctions et des procédures stockées
  - code: 2.2.2
    en: Enrich data by adding new columns or tables
    fr: Enrichir des données en ajoutant de nouvelles colonnes ou tables
  - code: 2.2.3
    en: Implement a star schema for a lakehouse or warehouse
    fr: Implémenter un schéma en étoile pour un lakehouse ou un entrepôt
  - code: 2.2.4
    en: Denormalize data
    fr: Dénormaliser les données
  - code: 2.2.5
    en: Aggregate data
    fr: Agréger des données
  - code: 2.2.6
    en: Merge or join data
    fr: Fusionner ou joindre des données
  - code: 2.2.7
    en: Identify and resolve duplicate data, missing data, or null values
    fr: Identifier et résoudre les données en double, les données manquantes ou les valeurs Null
  - code: 2.2.8
    en: Convert column data types
    fr: Convertir des types de données de colonne
  - code: 2.2.9
    en: Filter data
    fr: Filtrer les données
- group:
    en: Query and analyze data
    fr: Interroger et analyser des données
  objectives:
  - code: 2.3.1
    en: Select, filter, and aggregate data by using the Visual query editor
    fr: Sélectionner, filtrer et agréger des données à l'aide de l'éditeur de requête Visual
  - code: 2.3.2
    en: Select, filter, and aggregate data by using SQL
    fr: Sélectionner, filtrer et agréger des données à l'aide de SQL
  - code: 2.3.3
    en: Select, filter, and aggregate data by using KQL
    fr: Sélectionner, filtrer et agréger des données à l'aide de KQL
  - code: 2.3.4
    en: Select, filter, and aggregate data by using DAX
    fr: Sélectionner, filtrer et agréger des données à l'aide de DAX
semantic-models:
- group:
    en: Design and build semantic models
    fr: Concevoir et générer des modèles sémantiques
  objectives:
  - code: 3.1.1
    en: Choose a storage mode
    fr: Choisir un mode de stockage
  - code: 3.1.2
    en: Implement a star schema for a semantic model
    fr: Implémenter un schéma en étoile pour un modèle sémantique
  - code: 3.1.3
    en: Implement relationships, such as bridge tables and many-to-many relationships
    fr: Implémenter des relations, telles que des tables de pont et des relations plusieurs-à-plusieurs
  - code: 3.1.4
    en: Write calculations that use DAX variables and functions, such as iterators, table filtering, windowing, and information functions
    fr: Écrire des calculs qui utilisent des variables et des fonctions DAX, telles que des itérateurs, un filtrage de table, un fenêtrage et des fonctions d'informations
  - code: 3.1.5
    en: Implement calculation groups, dynamic format strings, and field parameters
    fr: Implémenter des groupes de calcul, des chaînes de format dynamique et des paramètres de champ
  - code: 3.1.6
    en: Identify use cases for and configure large semantic model storage format
    fr: Identifier les cas d'usage pour et configurer un format de stockage de modèle sémantique volumineux
  - code: 3.1.7
    en: Design and build composite models
    fr: Concevoir et créer des modèles composites
- group:
    en: Optimize enterprise-scale semantic models
    fr: Optimiser les modèles sémantiques à l'échelle de l'entreprise
  objectives:
  - code: 3.2.1
    en: Implement performance improvements in queries and report visuals
    fr: Implémenter des améliorations des performances dans les requêtes et les visuels de rapport
  - code: 3.2.2
    en: Improve DAX performance
    fr: Améliorer les performances de DAX
  - code: 3.2.3
    en: Configure Direct Lake, including default fallback and refresh behavior
    fr: Configurer Direct Lake, y compris le comportement de secours et d'actualisation par défaut
  - code: 3.2.4
    en: Choose between Direct Lake on OneLake and Direct Lake on SQL analytics endpoint
    fr: Choisir entre Direct Lake sur OneLake et Direct Lake sur le point de terminaison d'analytique SQL
  - code: 3.2.5
    en: Implement incremental refresh for semantic models
    fr: Implémenter l'actualisation incrémentielle pour les modèles sémantiques
