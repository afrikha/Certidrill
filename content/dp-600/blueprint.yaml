# DP-600 — Implementing Analytics Solutions Using Microsoft Fabric
# (Microsoft Certified: Fabric Analytics Engineer Associate)
# Source: official study guide, "Skills measured as of October 19, 2026" (checked on 2026-11-16):
# https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-600
# WARNING: on 2026-11-16 the en-us URL returned an undated outline with four skill areas (the first
# version of the guide, 2024, "Last updated on 2026-10-30"), while the en-gb, en-au and fr-fr editions
# and the en-us certification page ("Maintain a data analytics solution / Prepare data / Implement and
# manage semantic models", last updated 10/19/2026) show the three areas below. This file follows the
# dated October 19, 2026 version; re-check the en-us page before publishing.
# Real exam: 100 minutes, passing score 700/1000, proctored, access to Microsoft Learn during the exam
# (associate exam); 100 minutes is the duration of exams without labs. Microsoft Learn does not say per
# exam whether there is a case study and does not publish the number of questions (40 to 60 in general).
# typeMix: more drop-down (code completion in T-SQL, KQL, DAX, PySpark) than AZ-104.
# Readiness and progression rules are those of AZ-104. active: false until the bank and the course
# are reviewed and published.
