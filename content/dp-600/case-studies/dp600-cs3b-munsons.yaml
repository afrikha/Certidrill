id: dp600-cs3b-munsons
status: draft
title:
  en: Munson's Pickles and Preserves
  fr: Munson's Pickles and Preserves
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Munson's Pickles and Preserves produces pickles, jams and sauces in three plants in Canada. The head office is in Toronto. A business intelligence team of three people builds the sales and production reporting in Microsoft Fabric.

        Munson's wants to extend its sales semantic model, to put its Power BI work under source control and to protect the margin data.
      fr: |
        Munson's Pickles and Preserves produit des cornichons, des confitures et des sauces dans trois usines au Canada. Le siège est à Toronto. Une équipe décisionnelle de trois personnes construit le reporting des ventes et de la production dans Microsoft Fabric.

        Munson's souhaite enrichir son modèle sémantique des ventes, placer son travail Power BI sous contrôle de code source et protéger les données de marge.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Fabric.** The workspace **MPP-Prod** contains the following items.

        | Item | Type | Details |
        | --- | --- | --- |
        | WH-Sales | Warehouse | Star schema of the sales and production data. The staging table **stg.Batches** stores every column as varchar: BatchId, PlantCode, BatchStart (date and time with milliseconds), BatchCost (amount with two decimals), JarCount (integer from 0 to 250). |
        | SM-Sales | Semantic model | Authored in Power BI Desktop. Import mode. Tables: Sales (fact: OrderDateKey, ShipDateKey, CustomerKey, ProductKey, PlantKey, Amount), Customer, Product, Plant and Date (DateKey, Date, Month, Year). Sales has an active relationship with Date on OrderDateKey. The measure [Sales Amount] returns SUM(Sales[Amount]). |
        | RPT-Margins | Report | Based on SM-Sales. Its author applied the General sensitivity label manually. |
        | RPT-Volumes | Report | Based on SM-Sales. It has no sensitivity label. |

        Twelve reports and dashboards are built on SM-Sales in MPP-Prod.

        **Sensitivity labels.** Sensitivity labels are enabled for Fabric. The labels General and Confidential exist; Confidential is more restrictive than General. Downstream inheritance uses the user consent mode.

        **Source control.** Munson's has an Azure DevOps Git repository named **mpp-bi**.
      fr: |
        **Fabric.** L'espace de travail **MPP-Prod** contient les éléments suivants.

        | Élément | Type | Détails |
        | --- | --- | --- |
        | WH-Sales | Entrepôt | Schéma en étoile des données de ventes et de production. La table de préparation **stg.Batches** stocke toutes les colonnes en varchar : BatchId, PlantCode, BatchStart (date et heure avec millisecondes), BatchCost (montant à deux décimales), JarCount (entier de 0 à 250). |
        | SM-Sales | Modèle sémantique | Créé dans Power BI Desktop. Mode importation. Tables : Sales (faits : OrderDateKey, ShipDateKey, CustomerKey, ProductKey, PlantKey, Amount), Customer, Product, Plant et Date (DateKey, Date, Month, Year). Sales a une relation active avec Date sur OrderDateKey. La mesure [Sales Amount] renvoie SUM(Sales[Amount]). |
        | RPT-Margins | Rapport | Basé sur SM-Sales. Son auteur lui a appliqué manuellement l'étiquette de confidentialité General. |
        | RPT-Volumes | Rapport | Basé sur SM-Sales. Il n'a pas d'étiquette de confidentialité. |

        Douze rapports et tableaux de bord sont construits sur SM-Sales dans MPP-Prod.

        **Étiquettes de confidentialité.** Les étiquettes de confidentialité sont activées pour Fabric. Les étiquettes General et Confidential existent ; Confidential est plus restrictive que General. L'héritage en aval utilise le mode avec consentement de l'utilisateur.

        **Contrôle de code source.** Munson's dispose d'un dépôt Git Azure DevOps nommé **mpp-bi**.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Munson's identifies the following requirements.

        **Data preparation**

        1. The plant managers must be able to retrieve the batches of one plant by joining a reusable object of WH-Sales in the FROM clause of their own queries, for example `SELECT b.*, p.PlantName FROM dbo.PlantBatches('TOR1') AS b JOIN dbo.Plant AS p ON p.PlantCode = b.PlantCode`.
        2. A table named dbo.FactBatch must be created from stg.Batches with typed columns. No precision must be lost on BatchStart and BatchCost.

        **Semantic model**

        3. Analysts must be able to analyze the sales by ship date by using a measure named [Sales by Ship Date]. SM-Sales must keep a single date table, and the existing visuals that analyze the sales by order date must keep working unchanged.

        **Reuse and lifecycle**

        4. The BI team must provide reusable assets:
           - Plant analysts must start their new reports from a file that already points to the SQL analytics endpoint of WH-Sales and then choose the tables to load.
           - The finance offices of the three plants must start from a file that contains the pages, the model definition and the queries of RPT-Margins, but no data, and then connect with their own credentials.
           - The sales analysts must build their own reports on the governed sales model without copying its data or its measures.
        5. SM-Sales and RPT-Margins must be stored in mpp-bi as text files that can be reviewed in pull requests. The repository must not contain any data.
        6. Mia, a member of the BI team, will apply the Confidential label to SM-Sales in MPP-Prod. She has the Member role in MPP-Prod and will leave the downstream inheritance check box selected.
      fr: |
        Munson's a défini les exigences suivantes.

        **Préparation des données**

        1. Les responsables d'usine doivent pouvoir récupérer les lots d'une usine en joignant un objet réutilisable de WH-Sales dans la clause FROM de leurs propres requêtes, par exemple `SELECT b.*, p.PlantName FROM dbo.PlantBatches('TOR1') AS b JOIN dbo.Plant AS p ON p.PlantCode = b.PlantCode`.
        2. Une table nommée dbo.FactBatch doit être créée à partir de stg.Batches avec des colonnes typées. Aucune précision ne doit être perdue sur BatchStart et BatchCost.

        **Modèle sémantique**

        3. Les analystes doivent pouvoir analyser les ventes par date d'expédition à l'aide d'une mesure nommée [Sales by Ship Date]. SM-Sales doit conserver une seule table de dates, et les visuels existants qui analysent les ventes par date de commande doivent continuer de fonctionner sans changement.

        **Réutilisation et cycle de vie**

        4. L'équipe décisionnelle doit fournir des ressources réutilisables :
           - Les analystes d'usine doivent commencer leurs nouveaux rapports à partir d'un fichier qui pointe déjà vers le point de terminaison d'analytique SQL de WH-Sales, puis choisir les tables à charger.
           - Les services financiers des trois usines doivent partir d'un fichier qui contient les pages, la définition du modèle et les requêtes de RPT-Margins, mais aucune donnée, puis se connecter avec leurs propres informations d'identification.
           - Les analystes commerciaux doivent créer leurs propres rapports sur le modèle des ventes gouverné sans copier ses données ni ses mesures.
        5. SM-Sales et RPT-Margins doivent être stockés dans mpp-bi sous forme de fichiers texte qui peuvent être revus dans des pull requests. Le dépôt ne doit contenir aucune donnée.
        6. Mia, membre de l'équipe décisionnelle, appliquera l'étiquette Confidential à SM-Sales dans MPP-Prod. Elle a le rôle Member dans MPP-Prod et laissera cochée la case de l'héritage en aval.
