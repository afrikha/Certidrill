id: dp600-cs1b-woodgrove-bank
status: draft
title:
  en: Woodgrove Bank
  fr: Woodgrove Bank
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Woodgrove Bank is a retail bank with 120 branches. The finance analytics team builds the regulatory and management reporting in Microsoft Fabric. A governance board reviews every dataset that is used for regulatory reporting.

        Woodgrove wants to reduce the load window of its reporting platform and to strengthen data access controls before an external audit.
      fr: |
        Woodgrove Bank est une banque de détail qui compte 120 agences. L'équipe d'analytique financière produit les rapports réglementaires et de gestion dans Microsoft Fabric. Un comité de gouvernance examine chaque jeu de données utilisé pour les rapports réglementaires.

        Woodgrove veut réduire la fenêtre de chargement de sa plateforme de reporting et renforcer les contrôles d'accès aux données avant un audit externe.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Source system**

        The core banking application uses an Azure SQL Database named **CoreBankingDB** (vCore, General Purpose). It contains the tables **Accounts**, **Branches**, **Customers** and **Transactions**. Transactions contains eight years of history (about two billion rows) and a **TransactionDate** column of type datetime2.

        **Fabric**

        Woodgrove has a Fabric capacity (F128) and a workspace named **WB-Finance** that contains:

        | Item | Description |
        | --- | --- |
        | **PL_NightlyCopy** | Pipeline that copies all CoreBankingDB tables to WH_Finance every night. It runs for five hours. |
        | **WH_Finance** | Warehouse used by the branch managers, who run T-SQL queries from SQL Server Management Studio (SSMS). The **dbo.BranchManagers** table maps each **BranchId** to the user principal name (**ManagerUpn**) of the branch manager. |
        | **FinanceModel** | Semantic model in Import mode, published from Power BI Desktop. It uses WH_Finance as its source. Its size is 9 GB and it is expected to reach 25 GB within a year. A full refresh takes three hours. |

        The capacity settings have not been changed since the capacity was created. The members of the finance analytics team have write permission on FinanceModel. None of them is authorized by the Fabric administrator to certify items.
      fr: |
        **Système source**

        L'application bancaire principale utilise une base de données Azure SQL Database nommée **CoreBankingDB** (vCore, General Purpose). Elle contient les tables **Accounts**, **Branches**, **Customers** et **Transactions**. Transactions contient huit ans d'historique (environ deux milliards de lignes) et une colonne **TransactionDate** de type datetime2.

        **Fabric**

        Woodgrove dispose d'une capacité Fabric (F128) et d'un espace de travail nommé **WB-Finance** qui contient :

        | Élément | Description |
        | --- | --- |
        | **PL_NightlyCopy** | Pipeline qui copie chaque nuit toutes les tables de CoreBankingDB dans WH_Finance. Il s'exécute pendant cinq heures. |
        | **WH_Finance** | Entrepôt utilisé par les directeurs d'agence, qui exécutent des requêtes T-SQL depuis SQL Server Management Studio (SSMS). La table **dbo.BranchManagers** associe chaque **BranchId** au nom d'utilisateur principal (**ManagerUpn**) du directeur de l'agence. |
        | **FinanceModel** | Modèle sémantique en mode Import, publié depuis Power BI Desktop. Il utilise WH_Finance comme source. Sa taille est de 9 Go et elle devrait atteindre 25 Go d'ici un an. Une actualisation complète dure trois heures. |

        Les paramètres de la capacité n'ont pas été modifiés depuis sa création. Les membres de l'équipe d'analytique financière disposent de l'autorisation d'écriture sur FinanceModel. Aucun d'eux n'est autorisé par l'administrateur Fabric à certifier des éléments.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Data ingestion**

        1. PL_NightlyCopy must be retired. The CoreBankingDB tables must be replicated continuously into OneLake as Delta tables, without any pipeline, notebook or schedule to maintain. WH_Finance will then be loaded from the replicated tables by T-SQL stored procedures.

        **Security**

        2. When a branch manager queries **dbo.Transactions** in WH_Finance, only the rows of their own branch must be returned. The filter must apply whatever tool the manager uses to run the query.

        **Semantic model**

        3. FinanceModel must keep eight years of transactions. Each nightly refresh must reload only the transactions of the last seven days.
        4. FinanceModel must remain in Import mode and must be able to grow to 25 GB.
        5. The analytics engineers must be able to deploy changes to FinanceModel with Tabular Editor through the XMLA endpoint.

        **Governance**

        6. After the governance board has reviewed FinanceModel, the model must display a badge that shows that it meets the bank's quality standards.
      fr: |
        **Ingestion des données**

        1. PL_NightlyCopy doit être mis hors service. Les tables de CoreBankingDB doivent être répliquées en continu dans OneLake sous forme de tables Delta, sans pipeline, notebook ni planification à maintenir. WH_Finance sera ensuite alimenté à partir des tables répliquées par des procédures stockées T-SQL.

        **Sécurité**

        2. Quand un directeur d'agence interroge **dbo.Transactions** dans WH_Finance, seules les lignes de sa propre agence doivent être renvoyées. Le filtre doit s'appliquer quel que soit l'outil utilisé pour exécuter la requête.

        **Modèle sémantique**

        3. FinanceModel doit conserver huit ans de transactions. Chaque actualisation nocturne ne doit recharger que les transactions des sept derniers jours.
        4. FinanceModel doit rester en mode Import et doit pouvoir atteindre 25 Go.
        5. Les ingénieurs analytiques doivent pouvoir déployer des modifications de FinanceModel avec Tabular Editor via le point de terminaison XMLA.

        **Gouvernance**

        6. Une fois que le comité de gouvernance a examiné FinanceModel, le modèle doit afficher un badge indiquant qu'il respecte les normes de qualité de la banque.
