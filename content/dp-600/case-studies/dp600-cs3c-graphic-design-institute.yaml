id: dp600-cs3c-graphic-design-institute
status: draft
title:
  en: Graphic Design Institute
  fr: Graphic Design Institute
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Graphic Design Institute is a private university of art and design with 14,000 students in four faculties. A data office of five people manages the analytics platform in Microsoft Fabric.

        The institute wants to improve the performance and the security of its enrollment reporting and to reuse research data that a partner publishes.
      fr: |
        Graphic Design Institute est une université privée d'art et de design qui compte 14 000 étudiants répartis dans quatre facultés. Un bureau des données de cinq personnes gère la plateforme d'analytique dans Microsoft Fabric.

        L'institut souhaite améliorer les performances et la sécurité de son reporting des inscriptions et réutiliser des données de recherche publiées par un partenaire.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Fabric.** The workspace **GDI-Analytics** is assigned to an F64 capacity. The Fabric administrator enabled certification and master data endorsement and specified the security group **DataStewards** as the users who can apply these badges.

        | Item | Type | Details |
        | --- | --- | --- |
        | LH-Campus | Lakehouse | Bronze, silver and gold tables loaded by notebooks. Gold tables: Enrollment, Student (StudentId, FullName, NationalId, DateOfBirth), Program (ProgramName, Faculty), Term (TermName) and Department. |
        | vw_Enrollment | View in the SQL analytics endpoint of LH-Campus | Joins the gold tables and keeps the active enrollments only (30 million rows) |
        | SM-Enrollment | Semantic model | Direct Lake on the SQL analytics endpoint of LH-Campus. Its Enrollment table is based on vw_Enrollment. It contains the measure [Enrolled Students]. The Direct Lake behavior property is Automatic. |
        | LH-Students | Lakehouse | The official list of all current and former students of the institute, used by every department |

        **Research data.** Trey Research, a partner, publishes weekly Parquet files of design trend data in an Amazon S3 bucket. Each file is between 50 MB and 300 MB. The data scientists of the institute read these files many times a day.

        **Users.** Kai, a BI developer, has the Contributor role in GDI-Analytics and maintains SM-Enrollment. The lecturers are members of the Microsoft Entra security group **Lecturers**, which has the Viewer role in GDI-Analytics. Some faculties offer a single program.
      fr: |
        **Fabric.** L'espace de travail **GDI-Analytics** est attribué à une capacité F64. L'administrateur Fabric a activé la certification et l'approbation des données de référence (Master data) et a désigné le groupe de sécurité **DataStewards** comme les utilisateurs qui peuvent appliquer ces badges.

        | Élément | Type | Détails |
        | --- | --- | --- |
        | LH-Campus | Lakehouse | Tables bronze, silver et gold chargées par des notebooks. Tables gold : Enrollment, Student (StudentId, FullName, NationalId, DateOfBirth), Program (ProgramName, Faculty), Term (TermName) et Department. |
        | vw_Enrollment | Vue du point de terminaison d'analytique SQL de LH-Campus | Joint les tables gold et ne conserve que les inscriptions actives (30 millions de lignes) |
        | SM-Enrollment | Modèle sémantique | Direct Lake sur le point de terminaison d'analytique SQL de LH-Campus. Sa table Enrollment est basée sur vw_Enrollment. Il contient la mesure [Enrolled Students]. La propriété Direct Lake behavior a la valeur Automatic. |
        | LH-Students | Lakehouse | La liste officielle de tous les étudiants actuels et anciens de l'institut, utilisée par tous les départements |

        **Données de recherche.** Trey Research, un partenaire, publie chaque semaine des fichiers Parquet de données de tendances du design dans un compartiment Amazon S3. Chaque fichier fait entre 50 Mo et 300 Mo. Les data scientists de l'institut lisent ces fichiers de nombreuses fois par jour.

        **Utilisateurs.** Kai, un développeur décisionnel, a le rôle Contributor dans GDI-Analytics et gère SM-Enrollment. Les enseignants sont membres du groupe de sécurité Microsoft Entra **Lecturers**, qui a le rôle Viewer dans GDI-Analytics. Certaines facultés ne proposent qu'un seul programme.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Graphic Design Institute identifies the following requirements.

        **Enrollment reporting**

        1. The visuals that use the Enrollment table are slow. The queries on Enrollment must be answered in Direct Lake mode.
        2. The lecturers must not be able to see the NationalId and DateOfBirth columns of Student, even in the list of fields of SM-Enrollment. All the other users of SM-Enrollment must keep seeing these columns.
        3. A measure named Program Share must show, in a matrix with Program[Faculty] and Program[ProgramName] on the rows, the enrolled students of each program as a share of all the enrolled students of its faculty, including the programs that are not selected in the Program[ProgramName] slicer of the page. The measure must be blank on the faculty rows and on the total row.
        4. Kai must write a DAX query in the DAX query view of SM-Enrollment that returns, for the term Fall 2026, one row per faculty with its number of enrolled students, from the largest number to the smallest. The faculties that have no enrolled student in that term must not be returned.

        **Governance and data access**

        5. LH-Students must be identified in the OneLake catalog as an authoritative, core source of organizational data.
        6. The Trey Research files must be readable from LH-Campus without copying them by using a scheduled process. Cross-cloud egress costs must be minimized.
      fr: |
        Graphic Design Institute a défini les exigences suivantes.

        **Reporting des inscriptions**

        1. Les visuels qui utilisent la table Enrollment sont lents. Les requêtes sur Enrollment doivent être traitées en mode Direct Lake.
        2. Les enseignants ne doivent pas pouvoir voir les colonnes NationalId et DateOfBirth de Student, même dans la liste des champs de SM-Enrollment. Tous les autres utilisateurs de SM-Enrollment doivent continuer de voir ces colonnes.
        3. Une mesure nommée Program Share doit afficher, dans une matrice avec Program[Faculty] et Program[ProgramName] en lignes, les étudiants inscrits de chaque programme en proportion de tous les étudiants inscrits de sa faculté, y compris les programmes non sélectionnés dans le segment Program[ProgramName] de la page. La mesure doit être vide sur les lignes de faculté et sur la ligne de total.
        4. Kai doit écrire une requête DAX dans la vue de requête DAX de SM-Enrollment qui renvoie, pour le semestre Fall 2026, une ligne par faculté avec son nombre d'étudiants inscrits, du plus grand nombre au plus petit. Les facultés qui n'ont aucun étudiant inscrit pour ce semestre ne doivent pas être renvoyées.

        **Gouvernance et accès aux données**

        5. LH-Students doit être identifié dans le catalogue OneLake comme une source de données de l'organisation essentielle et faisant autorité.
        6. Les fichiers de Trey Research doivent pouvoir être lus depuis LH-Campus sans être copiés par un processus planifié. Les coûts de sortie de données entre clouds doivent être réduits au minimum.
