id: dp600-cs2c-blue-yonder-airlines
status: draft
title:
  en: Blue Yonder Airlines
  fr: Blue Yonder Airlines
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Blue Yonder Airlines is a regional airline that operates 180 aircraft and about 900 flights a day from its hub in Dublin. A team of three BI developers maintains the enterprise semantic model used by the flight operations, network planning and finance departments.

        Blue Yonder Airlines wants to scale the semantic model, automate its maintenance and give developers an isolated development process.
      fr: |
        Blue Yonder Airlines est une compagnie aérienne régionale qui exploite 180 appareils et environ 900 vols par jour depuis son hub de Dublin. Une équipe de trois développeurs décisionnels maintient le modèle sémantique d'entreprise utilisé par les services des opérations aériennes, de la planification du réseau et de la finance.

        Blue Yonder Airlines souhaite faire évoluer la taille du modèle sémantique, automatiser sa maintenance et offrir aux développeurs un processus de développement isolé.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Blue Yonder Airlines has a Fabric capacity (F128 SKU). The XMLA Endpoint setting of the capacity is set to Read Write.

        | Item | Type | Workspace | Configuration |
        | --- | --- | --- | --- |
        | WH-Ops | Warehouse | FlightOps-Data | Tables **FactFlightLeg**, **DimAirport**, **DimCity**, **DimCountry**, **DimAircraft** and **DimDate** |
        | SM-FlightOps | Semantic model | FlightOps-BI | Import mode; 8 GB today; Large semantic model storage format is off |
        | Ops Dashboard | Report | FlightOps-BI | Uses SM-FlightOps |

        FactFlightLeg contains 2.4 billion rows, one per flight leg since January 2016. Its column **DepartureUtc** (datetime2) stores the departure time. Late corrections can change flight legs of the last seven days.

        The airport dimension is snowflaked: DimAirport (AirportKey, IATACode, AirportName, CityKey) is related to DimCity (CityKey, CityName, CountryKey), which is related to DimCountry (CountryKey, CountryName, Region).

        SM-FlightOps is saved as a Power BI project (.pbip) in an Azure Repos Git repository. The workspace FlightOps-BI is connected to the **main** branch by using Git integration. SM-FlightOps contains about 40 explicit measures, such as Passengers, Revenue and On-time Rate.
      fr: |
        Blue Yonder Airlines dispose d'une capacité Fabric (référence SKU F128). Le paramètre XMLA Endpoint de la capacité est défini sur Read Write.

        | Élément | Type | Espace de travail | Configuration |
        | --- | --- | --- | --- |
        | WH-Ops | Entrepôt | FlightOps-Data | Tables **FactFlightLeg**, **DimAirport**, **DimCity**, **DimCountry**, **DimAircraft** et **DimDate** |
        | SM-FlightOps | Modèle sémantique | FlightOps-BI | Mode Import ; 8 Go aujourd'hui ; Large semantic model storage format est désactivé |
        | Ops Dashboard | Rapport | FlightOps-BI | Utilise SM-FlightOps |

        FactFlightLeg contient 2,4 milliards de lignes, une par tronçon de vol depuis janvier 2016. Sa colonne **DepartureUtc** (datetime2) stocke l'heure de départ. Des corrections tardives peuvent modifier les tronçons de vol des sept derniers jours.

        La dimension des aéroports est en flocon : DimAirport (AirportKey, IATACode, AirportName, CityKey) est liée à DimCity (CityKey, CityName, CountryKey), elle-même liée à DimCountry (CountryKey, CountryName, Region).

        SM-FlightOps est enregistré comme projet Power BI (.pbip) dans un dépôt Git Azure Repos. L'espace de travail FlightOps-BI est connecté à la branche **main** par l'intégration Git. SM-FlightOps contient environ 40 mesures explicites, telles que Passengers, Revenue et On-time Rate.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Data model**

        1. SM-FlightOps must use a star schema. The flattened airport dimension must also be available to the data analysts who query WH-Ops by using T-SQL.
        2. SM-FlightOps must stay in Import mode, and it must be able to grow to 30 GB within 18 months.

        **Refresh**

        3. SM-FlightOps must keep 10 years of flight legs. Each nightly refresh must reload only the flight legs of the last seven days.
        4. After a data correction, the operations team must be able to reprocess one historical partition of FactFlightLeg, without reprocessing the other partitions, by running a TMSL script.

        **Calculations**

        5. Year-to-date, previous-year and year-over-year calculations must be available for every measure, without creating a separate measure for each combination.
        6. Report users must be able to choose, in a slicer, whether a visual shows Passengers, Revenue or On-time Rate.
        7. The Revenue measure must display its values in thousands, millions or billions depending on their magnitude, and it must remain numeric so that charts can plot it.

        **Development**

        8. Each developer must make and test changes in a separate workspace without affecting FlightOps-BI. Changes must reach FlightOps-BI only after a pull request is reviewed and merged into main.
      fr: |
        **Modèle de données**

        1. SM-FlightOps doit utiliser un schéma en étoile. La dimension des aéroports aplatie doit aussi être disponible pour les analystes de données qui interrogent WH-Ops avec T-SQL.
        2. SM-FlightOps doit rester en mode Import et doit pouvoir atteindre 30 Go d'ici 18 mois.

        **Actualisation**

        3. SM-FlightOps doit conserver 10 ans de tronçons de vol. Chaque actualisation nocturne ne doit recharger que les tronçons de vol des sept derniers jours.
        4. Après une correction de données, l'équipe des opérations doit pouvoir retraiter une partition historique de FactFlightLeg, sans retraiter les autres partitions, en exécutant un script TMSL.

        **Calculs**

        5. Des calculs depuis le début de l'année, de l'année précédente et d'évolution d'une année sur l'autre doivent être disponibles pour chaque mesure, sans créer une mesure distincte pour chaque combinaison.
        6. Les utilisateurs des rapports doivent pouvoir choisir, dans un segment, si un visuel affiche Passengers, Revenue ou On-time Rate.
        7. La mesure Revenue doit afficher ses valeurs en milliers, millions ou milliards selon leur ordre de grandeur, et elle doit rester numérique pour que les graphiques puissent la tracer.

        **Développement**

        8. Chaque développeur doit apporter et tester ses modifications dans un espace de travail distinct sans affecter FlightOps-BI. Les modifications ne doivent atteindre FlightOps-BI qu'après la revue et la fusion d'une demande de tirage dans main.
