id: dp600-cs4a-margies-travel
status: draft
title:
  en: Margie's Travel
  fr: Margie's Travel
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Margie's Travel is an online travel agency based in Montreal. It sells flights, hotel stays and package holidays through its website and its mobile app, and it works with 300 partner hotels.

        The analytics platform runs in Microsoft Fabric. Three teams use it:

        - The data engineers, who write PySpark notebooks.
        - The BI developers, who build semantic models and reports in Power BI Desktop.
        - The finance analysts, who come from a SQL Server background and work only in T-SQL.
      fr: |
        Margie's Travel est une agence de voyages en ligne basée à Montréal. Elle vend des vols, des séjours à l'hôtel et des voyages à forfait sur son site web et son application mobile, et elle travaille avec 300 hôtels partenaires.

        La plateforme d'analytique fonctionne dans Microsoft Fabric. Trois équipes l'utilisent :

        - Les ingénieurs données, qui écrivent des notebooks PySpark.
        - Les développeurs BI, qui créent des modèles sémantiques et des rapports dans Power BI Desktop.
        - Les analystes financiers, qui viennent du monde SQL Server et travaillent uniquement en T-SQL.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Fabric.** The workspace **MT-Analytics** is assigned to an F64 capacity and belongs to the Travel domain. It contains the following items.

        | Item | Type | Details |
        | --- | --- | --- |
        | LH-Bookings | Lakehouse | Delta tables fact_booking (BookingId, BookingDate, DestinationKey, ChannelKey, SegmentKey, BookingValue), dim_destination (DestinationKey, DestinationName, Country), dim_channel, dim_customer_segment and dim_date. The data engineers load them with notebooks. |
        | EH-Web | Eventhouse | Contains the KQL database ClicksDB. |
        | ES-Clickstream | Eventstream | Sends the click events of the website and the mobile app to ClicksDB continuously. |
        | SM-Campaigns | Semantic model | Import mode. Built in Power BI Desktop from LH-Bookings and from the advertising spend files. Contains the measures [Booking Value] and [Campaign Spend]. |
        | Campaign Performance | Report | Based on SM-Campaigns. Its Trends page contains eight visuals, including a column chart of [Booking Value] by month and a table of the campaigns by destination. |

        The workspace **MT-Partners** contains the lakehouse **LH-Partners**, which exposes the booking data of each partner hotel through its SQL analytics endpoint.

        **Azure.** The partner hotels upload their rate files to an Azure Blob Storage account named **stpartnerdrop**.

        **Version control.** MT-Analytics is connected to the main branch of an Azure DevOps repository named **MT-BI**. Laura, a BI developer, maintains SM-Campaigns and its report as a Power BI Desktop project (.pbip) in her local clone of MT-BI. When she first saved the project in the clone, Power BI Desktop created the .gitignore file of the repository. Nobody has changed this file.

        **Finance.** The finance analysts calculate the partner commissions in an on-premises SQL Server database. Their stored procedures insert and update the Commission, CommissionLine and PartnerBalance tables in a single transaction.
      fr: |
        **Fabric.** L'espace de travail **MT-Analytics** est attribué à une capacité F64 et appartient au domaine Travel. Il contient les éléments suivants.

        | Élément | Type | Détails |
        | --- | --- | --- |
        | LH-Bookings | Lakehouse | Tables Delta fact_booking (BookingId, BookingDate, DestinationKey, ChannelKey, SegmentKey, BookingValue), dim_destination (DestinationKey, DestinationName, Country), dim_channel, dim_customer_segment et dim_date. Les ingénieurs données les chargent avec des notebooks. |
        | EH-Web | Eventhouse | Contient la base de données KQL ClicksDB. |
        | ES-Clickstream | Eventstream | Envoie en continu les événements de clic du site web et de l'application mobile vers ClicksDB. |
        | SM-Campaigns | Modèle sémantique | Mode Import. Créé dans Power BI Desktop à partir de LH-Bookings et des fichiers de dépenses publicitaires. Contient les mesures [Booking Value] et [Campaign Spend]. |
        | Campaign Performance | Rapport | Basé sur SM-Campaigns. Sa page Trends contient huit visuels, dont un histogramme de [Booking Value] par mois et une table des campagnes par destination. |

        L'espace de travail **MT-Partners** contient le lakehouse **LH-Partners**, qui expose les données de réservation de chaque hôtel partenaire via son point de terminaison d'analytique SQL.

        **Azure.** Les hôtels partenaires chargent leurs fichiers de tarifs dans un compte Stockage Blob Azure nommé **stpartnerdrop**.

        **Contrôle de version.** MT-Analytics est connecté à la branche main d'un référentiel Azure DevOps nommé **MT-BI**. Laura, une développeuse BI, gère SM-Campaigns et son rapport sous forme de projet Power BI Desktop (.pbip) dans son clone local de MT-BI. Quand elle a enregistré le projet pour la première fois dans le clone, Power BI Desktop a créé le fichier .gitignore du référentiel. Personne n'a modifié ce fichier.

        **Finance.** Les analystes financiers calculent les commissions des partenaires dans une base de données SQL Server locale. Leurs procédures stockées insèrent et mettent à jour les tables Commission, CommissionLine et PartnerBalance dans une seule transaction.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Margie's Travel identifies the following requirements.

        **Data**

        1. The commission calculation must move to a new Fabric item in MT-Analytics. The finance analysts must keep their T-SQL stored procedures, including the single transaction across the three tables. The data engineers must be able to read the commission tables from their notebooks.
        2. The marketing analysts must be able to subscribe to the events raised when a partner uploads a file to stpartnerdrop, and to the job events raised when a notebook run in MT-Analytics completes or fails.
        3. The report creators of all departments must be able to find the endorsed semantic models of the Travel domain, including the discoverable models that they cannot access yet, and request access to them.
        4. The finance analysts need a query of the SQL analytics endpoint of LH-Bookings that returns the 10 destinations with the highest total booking value in 2026, highest first. Only destinations with at least 500 bookings in 2026 must be considered.

        **Semantic models and reports**

        5. The Trends page loads slowly. Before they change SM-Campaigns, the BI developers must measure, for each visual of the page, the time spent running its DAX query and the time spent drawing the visual. They must then open the DAX query of the slowest visual in DAX query view.
        6. The MT-BI repository must not contain the data of SM-Campaigns. The Power Query changes that Laura saves without applying them must not be shared with the other BI developers.
        7. SM-Campaigns must be labeled Confidential.

        **Partners**

        8. The analysts of each partner hotel build their own reports in Power BI Desktop. Margie's Travel must send them a file that opens Power BI Desktop already connected to the SQL analytics endpoint of LH-Partners in DirectQuery mode. The file must contain no credentials, no report page and no table definition: the analysts select the tables themselves.
      fr: |
        Margie's Travel a défini les exigences suivantes.

        **Données**

        1. Le calcul des commissions doit être déplacé vers un nouvel élément Fabric de MT-Analytics. Les analystes financiers doivent conserver leurs procédures stockées T-SQL, y compris la transaction unique sur les trois tables. Les ingénieurs données doivent pouvoir lire les tables de commissions depuis leurs notebooks.
        2. Les analystes marketing doivent pouvoir s'abonner aux événements déclenchés quand un partenaire charge un fichier dans stpartnerdrop, et aux événements de travail déclenchés quand l'exécution d'un notebook de MT-Analytics se termine ou échoue.
        3. Les auteurs de rapports de tous les services doivent pouvoir trouver les modèles sémantiques approuvés du domaine Travel, y compris les modèles détectables auxquels ils n'ont pas encore accès, et en demander l'accès.
        4. Les analystes financiers ont besoin d'une requête sur le point de terminaison d'analytique SQL de LH-Bookings qui renvoie les 10 destinations dont la valeur totale des réservations en 2026 est la plus élevée, de la plus élevée à la plus faible. Seules les destinations qui ont au moins 500 réservations en 2026 doivent être prises en compte.

        **Modèles sémantiques et rapports**

        5. La page Trends se charge lentement. Avant de modifier SM-Campaigns, les développeurs BI doivent mesurer, pour chaque visuel de la page, le temps passé à exécuter sa requête DAX et le temps passé à dessiner le visuel. Ils doivent ensuite ouvrir la requête DAX du visuel le plus lent dans la vue de requête DAX.
        6. Le référentiel MT-BI ne doit pas contenir les données de SM-Campaigns. Les modifications Power Query que Laura enregistre sans les appliquer ne doivent pas être partagées avec les autres développeurs BI.
        7. SM-Campaigns doit porter l'étiquette Confidential.

        **Partenaires**

        8. Les analystes de chaque hôtel partenaire créent leurs propres rapports dans Power BI Desktop. Margie's Travel doit leur envoyer un fichier qui ouvre Power BI Desktop déjà connecté au point de terminaison d'analytique SQL de LH-Partners en mode DirectQuery. Le fichier ne doit contenir ni informations d'identification, ni page de rapport, ni définition de table : les analystes sélectionnent eux-mêmes les tables.
